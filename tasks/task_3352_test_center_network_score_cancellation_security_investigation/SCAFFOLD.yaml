scenario: |
  Test Center Network, Score Cancellation & Security Investigation (ETS): test center authorization with facility, staffing and equipment requirements and periodic audits, seat capacity scheduling across test dates with registration caps and waitlists, identity verification at check-in with document standards, biometric capture and admission denial procedures, test administration protocols covering seating, breaks, prohibited items and irregularity reporting, score analysis for anomalous gains, response similarity and prior content exposure triggering review, examinee notification of score review with response opportunity and cancellation outcomes, score reporting to institutions with hold periods during investigations, accommodations approval and alternate format test delivery

domain_name: test-center-network-score-security
api_prefix: /ets

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: TestCenter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the test center"
      - name: facility_seat_capacity
        type: integer
        source: input
        description: "Declared maximum physical seats at the facility; informational ceiling"
        constraints: "must be >= 1"
      - name: equipment_list
        type: array
        source: input
        description: "Required equipment items attested by the operator (strings)"
      - name: authorization_status
        type: enum
        source: system
        description: "Authorization lifecycle state"
        default: APPLIED
        constraints: "one of {APPLIED, AUTHORIZED, SUSPENDED}"
      - name: last_audit_outcome
        type: enum
        source: system
        description: "Outcome of the most recently completed audit"
        default: NONE
        constraints: "one of {NONE, PASSED, FAILED}"
      - name: active_staff_count
        type: integer
        source: computed
        description: "Count of Staff rows with center_id == this center's id; recomputed on every staff create"

  - name: Staff
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> TestCenter.id; center this staff member belongs to"
      - name: full_name
        type: string
        source: input
        description: "Staff member legal name"
      - name: staff_role
        type: enum
        source: input
        description: "Operational role at the center"
        constraints: "one of {PROCTOR, CENTER_MANAGER}"
      - name: certification_level
        type: enum
        source: input
        description: "Certification grade on file"
        constraints: "one of {BASIC, ADVANCED}"

  - name: CenterAudit
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: system
        description: "FK -> TestCenter.id; taken from the scheduling path"
      - name: scheduled_date
        type: string
        source: input
        description: "Planned audit date, YYYY-MM-DD"
      - name: audit_type
        type: enum
        source: input
        description: "ANNOUNCED audits use raw deduction weights; UNANNOUNCED audits apply a 1.5x deduction multiplier"
        constraints: "one of {ANNOUNCED, UNANNOUNCED}"
      - name: status
        type: enum
        source: system
        description: "Audit lifecycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED}"
      - name: facility_findings
        type: integer
        source: input
        description: "Count of facility deficiencies found; supplied at completion"
        constraints: ">= 0"
      - name: staffing_findings
        type: integer
        source: input
        description: "Count of staffing deficiencies found; supplied at completion"
        constraints: ">= 0"
      - name: equipment_findings
        type: integer
        source: input
        description: "Count of equipment deficiencies found; supplied at completion"
        constraints: ">= 0"
      - name: high_severity_findings
        type: integer
        source: input
        description: "Count of high-severity findings; any >= 1 forces outcome FAILED regardless of score"
        constraints: ">= 0"
      - name: compliance_score
        type: integer
        source: computed
        description: "100 minus weighted deductions (see calculation audit_compliance_score); set at completion"
      - name: outcome
        type: enum
        source: computed
        description: "PASSED iff compliance_score >= 80 AND high_severity_findings == 0, else FAILED; PENDING until completion"
        default: PENDING
        constraints: "one of {PENDING, PASSED, FAILED}"

  - name: TestSession
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: system
        description: "FK -> TestCenter.id; taken from the creation path"
      - name: test_date
        type: string
        source: input
        description: "Administration date, YYYY-MM-DD (UTC)"
      - name: start_time
        type: string
        source: input
        description: "Start time HH:MM UTC; combined with test_date for the occupation interval"
      - name: end_time
        type: string
        source: input
        description: "End time HH:MM UTC; must be later than start_time"
      - name: room_label
        type: string
        source: input
        description: "Room identifier within the center; the 60-minute turnaround buffer applies per (center, test_date, room_label)"
      - name: total_seats
        type: integer
        source: input
        description: "Total bookable seats for this session"
        constraints: ">= 1"
      - name: reserved_accommodation_seats
        type: integer
        source: input
        description: "Seats carved out for accommodation registrations; 0 <= reserved <= total_seats"
        constraints: ">= 0 and <= total_seats"
      - name: status
        type: enum
        source: system
        description: "Session lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, LOCKED, ADMINISTERED, SCORED, CANCELLED}"
      - name: proctor_staff_ids
        type: array
        source: system
        description: "Staff ids assigned as proctors; appended by POST /sessions/{id}/proctors"
        default: []
      - name: confirmed_count
        type: integer
        source: computed
        description: "Count of Registrations for this session with booking_status == CONFIRMED; recomputed on every registration create/cancel/promote"
        default: 0
      - name: waitlist_count
        type: integer
        source: computed
        description: "Count of Registrations for this session with booking_status == WAITLISTED"
        default: 0
      - name: effective_general_cap
        type: integer
        source: computed
        description: "total_seats - reserved_accommodation_seats; the CONFIRMED ceiling for pool GENERAL"

  - name: Examinee
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Examinee legal name matching the identity document"
      - name: date_of_birth
        type: string
        source: input
        description: "YYYY-MM-DD"
      - name: id_document_type
        type: enum
        source: input
        description: "Identity document standard accepted at check-in"
        constraints: "one of {PASSPORT, NATIONAL_ID, DRIVERS_LICENSE}"
      - name: id_document_number
        type: string
        source: input
        description: "Document number that must be presented verbatim at check-in"
      - name: id_document_expiry
        type: string
        source: input
        description: "Document expiry date YYYY-MM-DD; expired iff strictly earlier than the current UTC date"
      - name: biometric_template_ref
        type: string
        source: system
        description: "Biometric template captured at the examinee's first successful check-in; null until then"
        default: null
      - name: status
        type: enum
        source: system
        description: "ACTIVE examinees may register; BANNED examinees are barred after a content-exposure cancellation"
        default: ACTIVE
        constraints: "one of {ACTIVE, BANNED}"

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: system
        description: "FK -> TestSession.id; taken from the creation path"
      - name: examinee_id
        type: string
        source: input
        description: "FK -> Examinee.id; must equal the caller's X-User-ID when the caller has role Examinee"
      - name: booking_status
        type: enum
        source: system
        description: "Seat-holding dimension, evolves independently of attendance_status"
        constraints: "one of {CONFIRMED, WAITLISTED, CANCELLED}"
      - name: attendance_status
        type: enum
        source: system
        description: "Check-in dimension, evolves independently of booking_status"
        default: PENDING
        constraints: "one of {PENDING, ADMITTED, DENIED, NO_SHOW, COMPLETED}"
      - name: requires_accommodation_seat
        type: boolean
        source: computed
        description: "true iff the examinee held at least one APPROVED AccommodationRequest at registration time; input value ignored"
      - name: pool
        type: enum
        source: computed
        description: "ACCOMMODATION when requires_accommodation_seat else GENERAL; selects which seat pool this registration draws from"
        constraints: "one of {GENERAL, ACCOMMODATION}"
      - name: waitlist_position
        type: integer
        source: computed
        description: "1-based creation-order position within the session+pool waitlist; null unless booking_status == WAITLISTED"
        default: null

  - name: CheckInRecord
    parent: null
    common_fields: false
    fields:
      - name: registration_id
        type: string
        source: system
        description: "FK -> Registration.id; taken from the check-in path"
      - name: recorded_by_staff_id
        type: string
        source: system
        description: "X-User-ID of the Proctor who performed check-in (plain operator reference, not a join key)"
      - name: document_check_result
        type: enum
        source: computed
        description: "PASS iff presented document number matches Examinee.id_document_number AND presented expiry is not strictly earlier than the current UTC date"
        constraints: "one of {PASS, FAIL}"
      - name: biometric_result
        type: enum
        source: computed
        description: "FIRST_CAPTURE when Examinee.biometric_template_ref is null (template stored); MATCH iff sample equals stored template; else MISMATCH"
        constraints: "one of {FIRST_CAPTURE, MATCH, MISMATCH}"
      - name: admission_decision
        type: enum
        source: computed
        description: "ADMITTED iff document PASS and biometric != MISMATCH and arrival not later than start_time + 15 minutes; else DENIED"
        constraints: "one of {ADMITTED, DENIED}"
      - name: denial_reason
        type: enum
        source: computed
        description: "Reason when DENIED; NONE when ADMITTED. Priority when several fail: DOCUMENT_MISMATCH > DOCUMENT_EXPIRED > BIOMETRIC_MISMATCH > LATE_ARRIVAL"
        default: NONE
        constraints: "one of {NONE, DOCUMENT_MISMATCH, DOCUMENT_EXPIRED, BIOMETRIC_MISMATCH, LATE_ARRIVAL}"

  - name: IrregularityReport
    parent: null
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the registration the irregularity concerns"
      - name: session_id
        type: string
        source: system
        description: "Session id denormalized from the registration (plain field, not a join key)"
      - name: reported_by_staff_id
        type: string
        source: system
        description: "X-User-ID of the filing Proctor; must be an element of the session's proctor_staff_ids"
      - name: category
        type: enum
        source: input
        description: "Irregularity category; CONTENT_EXPOSURE substantiation opens a security review case"
        constraints: "one of {SEATING_VIOLATION, PROHIBITED_ITEM, BREAK_VIOLATION, SUSPECTED_IMPERSONATION, CONTENT_EXPOSURE}"
      - name: severity
        type: enum
        source: input
        description: "Reporter-assessed severity"
        constraints: "one of {LOW, HIGH}"
      - name: narrative
        type: string
        source: input
        description: "Free-text description of the observed irregularity"
      - name: status
        type: enum
        source: system
        description: "Resolution lifecycle"
        default: FILED
        constraints: "one of {FILED, SUBSTANTIATED, DISMISSED}"

  - name: ScoreRecord
    parent: null
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: system
        description: "FK -> Registration.id; taken from the score-entry path"
      - name: section_raws
        type: array
        source: input
        description: "Exactly 3 integer raw section scores, each 0..50"
      - name: prior_best_scaled_score
        type: integer
        source: input
        description: "Examinee's best previously reported scaled score; baseline for anomalous-gain detection"
      - name: matched_responses_count
        type: integer
        source: input
        description: "Count of responses identical to the nearest seated peer; input to response-similarity analysis"
        constraints: ">= 0 and <= total_scored_items"
      - name: total_scored_items
        type: integer
        source: input
        description: "Total scored items on the form"
        constraints: ">= 1"
      - name: same_form
        type: boolean
        source: input
        description: "Whether the paired examinees were administered the same form"
      - name: adjacent_seated
        type: boolean
        source: input
        description: "Whether the paired examinees were seated adjacently"
      - name: raw_total
        type: integer
        source: computed
        description: "Sum of section_raws"
      - name: provisional_scaled_score
        type: integer
        source: computed
        description: "Per-section round_half_up(raw_i * weight_i) summed (see provisional_scaled_score calculation)"
      - name: scaled_score
        type: integer
        source: computed
        description: "Equated final score (see equated_final_scaled_score calculation); null until score analysis runs"
        default: null
      - name: status
        type: enum
        source: system
        description: "Score lifecycle"
        default: PENDING_ANALYSIS
        constraints: "one of {PENDING_ANALYSIS, UNDER_REVIEW, VALIDATED, RELEASED, CANCELLED}"
      - name: released_report_count
        type: integer
        source: computed
        description: "Count of ScoreReports for this record with status == RELEASED; recomputed on report create/release/recall"
        default: 0

  - name: ScoreReviewCase
    parent: null
    common_fields: true
    fields:
      - name: registration_id
        type: string
        source: system
        description: "FK -> Registration.id; registration whose score is under review"
      - name: trigger_reason
        type: enum
        source: system
        description: "Why the case was opened; when several signals fire, priority is CONTENT_EXPOSURE > ANOMALOUS_GAIN > RESPONSE_SIMILARITY"
        constraints: "one of {ANOMALOUS_GAIN, RESPONSE_SIMILARITY, CONTENT_EXPOSURE}"
      - name: flagged_by_analyst_id
        type: string
        source: system
        description: "X-User-ID of the ScoreAnalyst who ran the analysis (or ProgramAdmin who substantiated an exposure irregularity); segregation-of-duties key"
      - name: status
        type: enum
        source: system
        description: "Review lifecycle"
        default: OPENED
        constraints: "one of {OPENED, NOTIFIED, RESPONSE_RECEIVED, WINDOW_EXPIRED, ADJUDICATED_UPHELD, ADJUDICATED_CANCELLED}"
      - name: response_deadline
        type: datetime
        source: computed
        description: "Notify-time clock value plus RESPONSE_WINDOW_DAYS (30) days; null until NOTIFIED"
        default: null
      - name: examinee_response
        type: string
        source: system
        description: "Examinee's written response; set by the respond endpoint"
        default: null
      - name: adjudicator_id
        type: string
        source: system
        description: "X-User-ID of the adjudicating ProgramAdmin"
        default: null
      - name: adjudication_rationale
        type: string
        source: system
        description: "Recorded rationale for the adjudication outcome"
        default: null
      - name: adjudication_outcome
        type: enum
        source: system
        description: "UPHELD (score stands) or CANCELLED (score cancelled); NONE until adjudicated"
        default: NONE
        constraints: "one of {NONE, UPHELD, CANCELLED}"

  - name: ScoreReport
    parent: null
    common_fields: true
    fields:
      - name: score_record_id
        type: string
        source: system
        description: "FK -> ScoreRecord.id; taken from the report path"
      - name: institution_code
        type: string
        source: input
        description: "Recipient institution code"
        constraints: "must match ^[A-Z0-9]{4,8}$"
      - name: status
        type: enum
        source: system
        description: "HELD while an investigation is open on the score; RELEASED when deliverable; RECALLED after score cancellation"
        constraints: "one of {HELD, RELEASED, RECALLED}"
      - name: hold_until
        type: datetime
        source: computed
        description: "Set to the open review case's response_deadline when created HELD; null otherwise"
        default: null
      - name: released_at
        type: datetime
        source: system
        description: "Clock value when the report entered RELEASED"
        default: null
      - name: recalled_at
        type: datetime
        source: system
        description: "Clock value when the report was recalled"
        default: null

  - name: AccommodationRequest
    parent: null
    common_fields: true
    fields:
      - name: examinee_id
        type: string
        source: system
        description: "FK -> Examinee.id; taken from the creation path"
      - name: accommodation_type
        type: enum
        source: input
        description: "Requested accommodation"
        constraints: "one of {EXTENDED_TIME, SCREEN_READER, LARGE_PRINT, SEPARATE_ROOM}"
      - name: requires_alternate_format
        type: boolean
        source: computed
        description: "true for SCREEN_READER and LARGE_PRINT (alternate-format delivery), false otherwise"
      - name: status
        type: enum
        source: system
        description: "Approval lifecycle"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, DENIED}"
      - name: decided_by
        type: string
        source: system
        description: "X-User-ID of the deciding ProgramAdmin; null until decided"
        default: null

state_machines:
  - entity: TestCenter
    initial_state: APPLIED
    terminal_states: []
    state_field: authorization_status
    transitions:
      - from: APPLIED
        to: AUTHORIZED
        trigger: "system, when POST /ets/audits/{id}/complete records outcome PASSED for this center"
        actor: system
        preconditions:
          - "completed audit's outcome == PASSED"
        side_effects:
          - "TestCenter.last_audit_outcome := PASSED"
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "system, when POST /ets/audits/{id}/complete records outcome FAILED for this center"
        actor: system
        preconditions:
          - "completed audit's outcome == FAILED"
        side_effects:
          - "TestCenter.last_audit_outcome := FAILED"
          - "hop 1 (cascade down): every TestSession with center_id == this center AND status IN {DRAFT, PUBLISHED} transitions to CANCELLED"
          - "hop 2 (cascade down): for each TestSession cancelled in hop 1, every Registration with session_id == that session AND booking_status IN {CONFIRMED, WAITLISTED} transitions booking_status to CANCELLED; attendance_status is left unchanged"
          - "hop 3 (ledger sync): each cancelled TestSession's confirmed_count and waitlist_count recomputed (both become 0 after hop 2); each cancelled session's version increments by 1"
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "system, when POST /ets/audits/{id}/complete records outcome PASSED for this center"
        actor: system
        preconditions:
          - "completed audit's outcome == PASSED"
        side_effects:
          - "TestCenter.last_audit_outcome := PASSED"
        note: "This reinstatement edge closes the AUTHORIZED -> SUSPENDED -> AUTHORIZED cycle."
      - from: APPLIED
        to: APPLIED
        trigger: "system, when POST /ets/audits/{id}/complete records outcome FAILED for this center"
        actor: system
        preconditions:
          - "completed audit's outcome == FAILED"
        side_effects:
          - "TestCenter.last_audit_outcome := FAILED"
        note: "Self-loop: a failed audit on a never-authorized center does not suspend it; no session cascade fires."

  - entity: CenterAudit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    state_field: status
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /ets/audits/{id}/complete"
        actor: Auditor
        preconditions:
          - "audit.status == SCHEDULED"
        side_effects:
          - "compute compliance_score and outcome via calculation audit_compliance_score"
          - "apply the TestCenter transitions declared for audit outcome PASSED / FAILED (including the session and registration cascade on FAILED)"

  - entity: TestSession
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    state_field: status
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /ets/sessions/{id}/publish"
        actor: CenterManager
        preconditions:
          - "session.status == DRAFT"
          - "TestCenter of session.center_id has authorization_status == AUTHORIZED (else ERR_CENTER_NOT_AUTHORIZED)"
        side_effects:
          - "session.version increments by 1"
      - from: PUBLISHED
        to: LOCKED
        trigger: "POST /ets/sessions/{id}/lock"
        actor: CenterManager
        preconditions:
          - "session.status == PUBLISHED"
          - "current logical-clock UTC date == session.test_date (else ERR_LOCK_WINDOW_NOT_OPEN)"
        side_effects:
          - "session.version increments by 1"
      - from: LOCKED
        to: ADMINISTERED
        trigger: "POST /ets/sessions/{id}/administer"
        actor: CenterManager
        preconditions:
          - "session.status == LOCKED"
          - "current logical-clock UTC datetime >= session test_date + end_time"
        side_effects:
          - "no-show sweep: every Registration of this session with booking_status == CONFIRMED AND attendance_status == PENDING transitions attendance_status to NO_SHOW"
          - "session.version increments by 1"
      - from: ADMINISTERED
        to: SCORED
        trigger: "system, at the end of POST /ets/score-analysis/run for this session"
        actor: system
        preconditions:
          - "session.status == ADMINISTERED"
          - "every Registration of this session with attendance_status == COMPLETED has exactly one ScoreRecord (else ERR_SCORES_INCOMPLETE)"
        side_effects:
          - "see calculation score_analysis_run for per-record effects (scaled scores, case openings, auto-release)"
          - "session.version increments by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "system cascade from TestCenter AUTHORIZED -> SUSPENDED"
        actor: system
        preconditions:
          - "owning center's audit completed with outcome FAILED"
        side_effects:
          - "registration cancellation cascade as declared on the TestCenter SUSPENDED transition"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "system cascade from TestCenter AUTHORIZED -> SUSPENDED"
        actor: system
        preconditions:
          - "owning center's audit completed with outcome FAILED"
        side_effects:
          - "registration cancellation cascade as declared on the TestCenter SUSPENDED transition"

  - entity: Registration
    initial_state: "booking_status: none (set at create), attendance_status: PENDING"
    terminal_states: ["booking_status: CANCELLED"]
    state_field: "booking_status x attendance_status (two independent dimensions on one row)"
    transitions:
      - from: "(create)"
        to: "booking_status: CONFIRMED, attendance_status: PENDING"
        trigger: "POST /ets/sessions/{id}/registrations when the registration's pool has a free seat"
        actor: Examinee
        preconditions:
          - "session.status == PUBLISHED (else ERR_SESSION_NOT_PUBLISHED)"
          - "examinee.status == ACTIVE (else ERR_EXAMINEE_BANNED)"
          - "current UTC date strictly earlier than session.test_date (else ERR_REGISTRATION_WINDOW_CLOSED)"
          - "no Registration exists with same (session_id, examinee_id) and booking_status IN {CONFIRMED, WAITLISTED} (else ERR_DUPLICATE_REGISTRATION)"
          - "expected_session_version == session.version (else ERR_STALE_VERSION)"
          - "pool occupancy < pool size (GENERAL: effective_general_cap; ACCOMMODATION: reserved_accommodation_seats)"
        side_effects:
          - "session.confirmed_count += 1; session.version increments by 1"
      - from: "(create)"
        to: "booking_status: WAITLISTED, attendance_status: PENDING"
        trigger: "POST /ets/sessions/{id}/registrations when the registration's pool is full"
        actor: Examinee
        preconditions:
          - "same as the CONFIRMED create except pool occupancy == pool size"
        side_effects:
          - "waitlist_position := count of existing WAITLISTED registrations in same (session, pool) + 1"
          - "session.waitlist_count += 1; session.version increments by 1"
      - from: "booking_status: WAITLISTED"
        to: "booking_status: CONFIRMED"
        trigger: "system promotion after a CONFIRMED registration in the same (session, pool) is cancelled"
        actor: system
        preconditions:
          - "pool occupancy < pool size after the cancellation"
        side_effects:
          - "promoted registration chosen by waitlist_promotion_selection (earliest created_at in pool; see calculation)"
          - "promoted registration.waitlist_position := null; remaining WAITLISTED positions recomputed by created_at ascending"
          - "session.confirmed_count and waitlist_count recomputed; session.version increments by 1"
      - from: "booking_status: CONFIRMED or WAITLISTED"
        to: "booking_status: CANCELLED"
        trigger: "POST /ets/registrations/{id}/cancel"
        actor: "Examinee (own) or ProgramAdmin"
        preconditions:
          - "registration.booking_status IN {CONFIRMED, WAITLISTED} (else ERR_INVALID_STATE)"
          - "registration.attendance_status != COMPLETED (else ERR_INVALID_STATE)"
        side_effects:
          - "waitlist_position := null"
          - "if the cancelled registration was CONFIRMED: run the WAITLISTED -> CONFIRMED promotion for its pool"
          - "session.confirmed_count and waitlist_count recomputed; session.version increments by 1"
      - from: "booking_status: CONFIRMED or WAITLISTED"
        to: "booking_status: CANCELLED"
        trigger: "system cascade from TestSession cancellation"
        actor: system
        preconditions:
          - "owning session transitioned to CANCELLED"
        side_effects:
          - "no waitlist promotion fires for cascade cancellations (the session itself is cancelled)"
      - from: "attendance_status: PENDING"
        to: "attendance_status: ADMITTED"
        trigger: "POST /ets/registrations/{id}/check-in with computed admission_decision == ADMITTED"
        actor: Proctor
        preconditions:
          - "registration.booking_status == CONFIRMED (else ERR_INVALID_STATE)"
          - "registration.attendance_status == PENDING (else ERR_ALREADY_CHECKED_IN)"
          - "session.status == LOCKED (else ERR_SESSION_NOT_LOCKED)"
        side_effects:
          - "append CheckInRecord (immutable)"
          - "if biometric_result == FIRST_CAPTURE: Examinee.biometric_template_ref := presented biometric_sample"
      - from: "attendance_status: PENDING"
        to: "attendance_status: DENIED"
        trigger: "POST /ets/registrations/{id}/check-in with computed admission_decision == DENIED"
        actor: Proctor
        preconditions:
          - "same as ADMITTED transition"
        side_effects:
          - "append CheckInRecord with denial_reason set"
      - from: "attendance_status: PENDING"
        to: "attendance_status: NO_SHOW"
        trigger: "system sweep inside POST /ets/sessions/{id}/administer"
        actor: system
        preconditions:
          - "registration.booking_status == CONFIRMED and never checked in"
        side_effects: []
      - from: "attendance_status: ADMITTED"
        to: "attendance_status: COMPLETED"
        trigger: "POST /ets/registrations/{id}/score-entry"
        actor: ScoreAnalyst
        preconditions:
          - "registration.attendance_status == ADMITTED"
          - "session.status == ADMINISTERED (else ERR_SESSION_NOT_ADMINISTERED)"
        side_effects:
          - "create ScoreRecord with status PENDING_ANALYSIS"

  - entity: Examinee
    initial_state: ACTIVE
    terminal_states: [BANNED]
    state_field: status
    transitions:
      - from: ACTIVE
        to: BANNED
        trigger: "system, when a ScoreReviewCase with trigger_reason == CONTENT_EXPOSURE for a registration of this examinee is adjudicated CANCELLED"
        actor: system
        preconditions:
          - "adjudicated case.trigger_reason == CONTENT_EXPOSURE"
        side_effects:
          - "no change to existing registrations (historical record); future registration creation is rejected with ERR_EXAMINEE_BANNED"

  - entity: IrregularityReport
    initial_state: FILED
    terminal_states: [SUBSTANTIATED, DISMISSED]
    state_field: status
    transitions:
      - from: FILED
        to: SUBSTANTIATED
        trigger: "POST /ets/irregularity-reports/{id}/resolve with resolution SUBSTANTIATED"
        actor: ProgramAdmin
        preconditions:
          - "report.status == FILED"
        side_effects:
          - "if category == CONTENT_EXPOSURE AND a ScoreRecord exists for report.registration_id: open ScoreReviewCase (status OPENED, trigger_reason CONTENT_EXPOSURE, flagged_by_analyst_id := resolver X-User-ID) and move that ScoreRecord to UNDER_REVIEW (from any of PENDING_ANALYSIS or RELEASED); if no ScoreRecord exists yet, no case is opened"
      - from: FILED
        to: DISMISSED
        trigger: "POST /ets/irregularity-reports/{id}/resolve with resolution DISMISSED"
        actor: ProgramAdmin
        preconditions:
          - "report.status == FILED"
        side_effects: []

  - entity: ScoreRecord
    initial_state: PENDING_ANALYSIS
    terminal_states: [CANCELLED]
    state_field: status
    transitions:
      - from: PENDING_ANALYSIS
        to: RELEASED
        trigger: "system, inside POST /ets/score-analysis/run when no anomaly signal fires for this record"
        actor: system
        preconditions:
          - "anomalous_gain_check < GAIN_THRESHOLD and response_similarity_index < SIMILARITY_THRESHOLD (or matched_responses_count < MIN_MATCHED_ITEMS) and no CONTENT_EXPOSURE case"
        side_effects:
          - "scaled_score := equated final value (see equated_final_scaled_score)"
      - from: PENDING_ANALYSIS
        to: UNDER_REVIEW
        trigger: "system, inside POST /ets/score-analysis/run when at least one anomaly signal fires"
        actor: system
        preconditions:
          - "gain >= GAIN_THRESHOLD, or (similarity >= SIMILARITY_THRESHOLD and matched >= MIN_MATCHED_ITEMS)"
        side_effects:
          - "scaled_score := equated final value"
          - "open ScoreReviewCase (status OPENED, flagged_by_analyst_id := analyst X-User-ID, trigger_reason by priority CONTENT_EXPOSURE > ANOMALOUS_GAIN > RESPONSE_SIMILARITY)"
      - from: RELEASED
        to: UNDER_REVIEW
        trigger: "system, when a CONTENT_EXPOSURE IrregularityReport is substantiated for this record's registration"
        actor: system
        preconditions:
          - "irregularity substantiation side effect fires"
        side_effects:
          - "existing ScoreReports stay RELEASED until adjudication decides the outcome"
      - from: UNDER_REVIEW
        to: VALIDATED
        trigger: "system, when the open ScoreReviewCase for this record is adjudicated UPHELD"
        actor: system
        preconditions:
          - "case adjudication_outcome == UPHELD"
        side_effects:
          - "then immediately VALIDATED -> RELEASED (see next edge)"
      - from: VALIDATED
        to: RELEASED
        trigger: "system, immediately after UNDER_REVIEW -> VALIDATED"
        actor: system
        preconditions: []
        side_effects:
          - "every ScoreReport of this record with status HELD transitions to RELEASED (released_at := clock; hold_until := null)"
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "system, when the open ScoreReviewCase for this record is adjudicated CANCELLED"
        actor: system
        preconditions:
          - "case adjudication_outcome == CANCELLED"
        side_effects:
          - "hop 1 (cascade): every ScoreReport of this record with status IN {HELD, RELEASED} transitions to RECALLED (recalled_at := clock)"
          - "hop 2 (ledger sync): released_report_count recomputed (becomes 0)"
          - "branch hop (cross-entity): if case.trigger_reason == CONTENT_EXPOSURE, the owning Examinee transitions ACTIVE -> BANNED"
      - from: RELEASED
        to: CANCELLED
        trigger: "system, when a CONTENT_EXPOSURE case opened from RELEASED (via UNDER_REVIEW) is adjudicated CANCELLED"
        actor: system
        preconditions:
          - "case adjudication_outcome == CANCELLED"
        side_effects:
          - "same report-recall cascade and examinee-ban branch as UNDER_REVIEW -> CANCELLED"

  - entity: ScoreReviewCase
    initial_state: OPENED
    terminal_states: [ADJUDICATED_UPHELD, ADJUDICATED_CANCELLED]
    state_field: status
    transitions:
      - from: OPENED
        to: NOTIFIED
        trigger: "POST /ets/score-review-cases/{id}/notify"
        actor: ScoreAnalyst
        preconditions:
          - "case.status == OPENED"
        side_effects:
          - "response_deadline := current logical clock + RESPONSE_WINDOW_DAYS (30 days)"
      - from: NOTIFIED
        to: RESPONSE_RECEIVED
        trigger: "POST /ets/score-review-cases/{id}/respond"
        actor: Examinee
        preconditions:
          - "case.status IN {NOTIFIED, WINDOW_EXPIRED} at state level"
          - "current clock <= case.response_deadline (else ERR_RESPONSE_WINDOW_CLOSED)"
          - "caller X-User-ID == examinee_id of the case's registration (else ERR_UNAUTHORIZED)"
        side_effects:
          - "examinee_response := request response_text"
      - from: NOTIFIED
        to: WINDOW_EXPIRED
        trigger: "system sweep inside POST /ets/_clock/set_current_utc when the new clock value is strictly later than response_deadline"
        actor: system
        preconditions:
          - "case.status == NOTIFIED and new clock > response_deadline"
        side_effects: []
      - from: RESPONSE_RECEIVED
        to: ADJUDICATED_UPHELD
        trigger: "POST /ets/score-review-cases/{id}/adjudicate with outcome UPHELD"
        actor: ProgramAdmin
        preconditions:
          - "case.status IN {RESPONSE_RECEIVED, WINDOW_EXPIRED} (else ERR_ADJUDICATION_NOT_READY)"
          - "caller X-User-ID != case.flagged_by_analyst_id (else ERR_SOD_VIOLATION)"
          - "expected_case_version == case.version (else ERR_STALE_VERSION)"
        side_effects:
          - "adjudicator_id, adjudication_rationale, adjudication_outcome set; case.version increments by 1"
          - "ScoreRecord of case.registration_id: UNDER_REVIEW -> VALIDATED -> RELEASED (held reports released)"
      - from: RESPONSE_RECEIVED
        to: ADJUDICATED_CANCELLED
        trigger: "POST /ets/score-review-cases/{id}/adjudicate with outcome CANCELLED"
        actor: ProgramAdmin
        preconditions:
          - "same as ADJUDICATED_UPHELD edge"
        side_effects:
          - "adjudicator_id, adjudication_rationale, adjudication_outcome set; case.version increments by 1"
          - "ScoreRecord of case.registration_id -> CANCELLED with its declared report-recall cascade and examinee-ban branch"
      - from: WINDOW_EXPIRED
        to: ADJUDICATED_UPHELD
        trigger: "POST /ets/score-review-cases/{id}/adjudicate with outcome UPHELD"
        actor: ProgramAdmin
        preconditions:
          - "same as the RESPONSE_RECEIVED edge"
        side_effects:
          - "same as the RESPONSE_RECEIVED edge"
      - from: WINDOW_EXPIRED
        to: ADJUDICATED_CANCELLED
        trigger: "POST /ets/score-review-cases/{id}/adjudicate with outcome CANCELLED"
        actor: ProgramAdmin
        preconditions:
          - "same as the RESPONSE_RECEIVED edge"
        side_effects:
          - "same as the RESPONSE_RECEIVED edge"

  - entity: ScoreReport
    initial_state: "RELEASED or HELD (decided at creation from the score record's status)"
    terminal_states: [RECALLED]
    state_field: status
    transitions:
      - from: "(create)"
        to: RELEASED
        trigger: "POST /ets/score-records/{id}/reports when score.status IN {RELEASED}"
        actor: ScoreAnalyst
        preconditions:
          - "score.status IN {RELEASED, UNDER_REVIEW} (PENDING_ANALYSIS -> ERR_SCORE_NOT_RELEASED; CANCELLED -> ERR_SCORE_CANCELLED)"
        side_effects:
          - "released_at := clock; score.released_report_count += 1"
        note: "A score that reached RELEASED via VALIDATED (upheld review) reports identically to a directly released score."
      - from: "(create)"
        to: HELD
        trigger: "POST /ets/score-records/{id}/reports when score.status == UNDER_REVIEW"
        actor: ScoreAnalyst
        preconditions:
          - "score.status == UNDER_REVIEW"
        side_effects:
          - "hold_until := response_deadline of the open ScoreReviewCase for this score's registration"
      - from: HELD
        to: RELEASED
        trigger: "system, when the open review case for the score is adjudicated UPHELD"
        actor: system
        preconditions:
          - "score reached RELEASED via VALIDATED"
        side_effects:
          - "released_at := clock; hold_until := null; score.released_report_count += 1"
      - from: HELD
        to: RECALLED
        trigger: "system, when the score is CANCELLED"
        actor: system
        preconditions:
          - "score cancellation cascade fires"
        side_effects:
          - "recalled_at := clock"
      - from: RELEASED
        to: RECALLED
        trigger: "system, when the score is CANCELLED"
        actor: system
        preconditions:
          - "score cancellation cascade fires"
        side_effects:
          - "recalled_at := clock; score.released_report_count -= 1"

  - entity: AccommodationRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    state_field: status
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /ets/accommodation-requests/{id}/decide with decision APPROVED"
        actor: ProgramAdmin
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "decided_by := caller X-User-ID; future registrations by this examinee compute requires_accommodation_seat == true"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /ets/accommodation-requests/{id}/decide with decision DENIED"
        actor: ProgramAdmin
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "decided_by := caller X-User-ID"

concurrency_rules:
  - rule_id: registration-create-stale-session
    parent_entity: TestSession
    write_endpoint: "POST /ets/sessions/{id}/registrations"
    occ_field: "expected_session_version"
    description: |
      Creating a Registration against a TestSession whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just registered, cancelled, or been promoted
      against the same session (each of which legitimately changes the seat
      picture under the capacity rules) and the current writer's view of the
      session is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: adjudicate-stale-case
    parent_entity: ScoreReviewCase
    write_endpoint: "POST /ets/score-review-cases/{id}/adjudicate"
    occ_field: "expected_case_version"
    description: |
      Adjudicating a ScoreReviewCase whose version has advanced since the
      client last observed it (for example because an examinee response was
      recorded after the client read the case) is rejected, so an adjudicator
      never decides on a superseded view of the file.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: provisional_scaled_score
    trigger: "POST /ets/registrations/{id}/score-entry (at ScoreRecord creation)"
    algorithm: weighted_scoring
    formula: |
      weights = [1.2, 0.8, 1.0]   # per section index 0..2
      raw_total = sum(section_raws)
      provisional_scaled_score = sum over i of round_half_up(section_raws[i] * weights[i])
      PINNED ROUNDING ORDER: round each section to an integer FIRST, then sum.
      (Sum-then-round of the same inputs is a rejected variant: e.g. raws
      [33,21,40] give per-section [40,17,40] -> 97, while sum-first gives
      round_half_up(96.4) == 96.)
    input_set: "the 3 section_raws of this ScoreRecord only"
    constants:
      SECTION_WEIGHT_0: 1.2
      SECTION_WEIGHT_1: 0.8
      SECTION_WEIGHT_2: 1.0
    precision: "integer, round_half_up per section, then integer sum"
    variants:
      - name: sum_then_round_rejected
        when: "never — documented rejected alternative"
        difference: "sums weighted raws first and rounds once; produces different integers (96 vs 97 on raws [33,21,40])"

  - name: equated_final_scaled_score
    trigger: "POST /ets/score-analysis/run (for every ScoreRecord in the session, after all provisionals exist)"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (the dependency is self-referential-looking and
      MUST be evaluated in this order):
        step 1: compute raw_total and provisional_scaled_score for EVERY
                ScoreRecord of the session first
        step 2: session_mean_raw = round_half_up( sum(raw_total over all
                ScoreRecords of the session) / count(ScoreRecords), 2 )
                -- the mean INCLUDES the record being scored
        step 3: scaled_score = provisional_scaled_score +
                floor(0.5 * (raw_total - session_mean_raw) + 0.5)
                (i.e. round_half_up of the adjustment, defined as floor(x+0.5)
                so negative halves round toward zero: floor(-6.5+0.5) = -6)
    input_set: "all ScoreRecords whose registration belongs to the analyzed session (score entry is only possible for COMPLETED attendance, so the set equals the session's ScoreRecords)"
    constants:
      EQUATE_FACTOR: 0.5
    precision: "integer; mean kept at 2 decimals round_half_up; adjustment round_half_up via floor(x+0.5)"
    variants:
      - name: provisional
        when: "before score analysis runs (ScoreRecord.status == PENDING_ANALYSIS)"
        difference: "scaled_score is null and only provisional_scaled_score exists; the two variants produce different integers for identical raw data whenever raw_total != session_mean_raw (e.g. raw 94 vs mean 107.00 -> 91 instead of 97)"

  - name: audit_compliance_score
    trigger: "POST /ets/audits/{id}/complete"
    algorithm: weighted_scoring
    formula: |
      base_deduction = 5*facility_findings + 7*staffing_findings + 3*equipment_findings
      ANNOUNCED variant:   compliance_score = max(0, 100 - base_deduction)
      UNANNOUNCED variant: compliance_score = max(0, 100 - round_half_up(1.5 * base_deduction))
      outcome = FAILED if (compliance_score < PASS_THRESHOLD) OR (high_severity_findings >= 1) else PASSED
      (branch on high_severity_findings is independent of the score: a spotless
      count sheet with one high-severity finding still fails at score 100)
    input_set: "the findings counts supplied in the complete call plus the audit's audit_type"
    constants:
      PASS_THRESHOLD: 80
      FACILITY_WEIGHT: 5
      STAFFING_WEIGHT: 7
      EQUIPMENT_WEIGHT: 3
      UNANNOUNCED_MULTIPLIER: 1.5
    precision: "integer, round_half_up"
    variants:
      - name: announced
        when: "audit_type == ANNOUNCED"
        difference: "raw deduction weights; findings (1,1,2) -> score 82 -> PASSED"
      - name: unannounced
        when: "audit_type == UNANNOUNCED"
        difference: "1.5x deduction multiplier; identical findings (1,1,2) -> score 73 -> FAILED, so the same findings flip the outcome"

  - name: anomalous_gain_check
    trigger: "POST /ets/score-analysis/run (per ScoreRecord, after scaled_score is computed)"
    algorithm: threshold
    formula: |
      gain = scaled_score - prior_best_scaled_score
      anomalous iff gain >= GAIN_THRESHOLD
      BOUNDARY: gain == 30 flags; gain == 29 does not.
    input_set: "this ScoreRecord's scaled_score and prior_best_scaled_score"
    constants:
      GAIN_THRESHOLD: 30
    precision: "integer comparison"

  - name: response_similarity_index
    trigger: "POST /ets/score-analysis/run (per ScoreRecord, after scaled_score is computed)"
    algorithm: weighted_scoring
    formula: |
      form_factor      = 1.0 if same_form else 0.5
      adjacency_factor = 1.0 if adjacent_seated else 0.7
      similarity = round_half_up( (matched_responses_count / total_scored_items)
                                  * form_factor * adjacency_factor, 4 )
      flagged iff similarity >= SIMILARITY_THRESHOLD AND matched_responses_count >= MIN_MATCHED_ITEMS
      (non-linear: 3 inputs with conditional factor selection and a conjunctive
      floor on the raw match count; e.g. 34/40 same-form adjacent -> 0.85 flags,
      33/40 -> 0.825 does not, 34/40 non-adjacent -> 0.595 does not)
    input_set: "this ScoreRecord's matched_responses_count, total_scored_items, same_form, adjacent_seated"
    constants:
      SIMILARITY_THRESHOLD: 0.85
      MIN_MATCHED_ITEMS: 20
      SAME_FORM_FACTOR: 1.0
      DIFF_FORM_FACTOR: 0.5
      ADJACENT_FACTOR: 1.0
      NONADJACENT_FACTOR: 0.7
    precision: "4 decimal places, round_half_up, then compared with >="

  - name: waitlist_promotion_selection
    trigger: "system, after a CONFIRMED registration is cancelled (POST /ets/registrations/{id}/cancel)"
    algorithm: chronological
    formula: |
      candidate set = Registrations of the same (session_id, pool) with
        booking_status == WAITLISTED
      if candidate set is empty: no promotion
      else promote exactly one: the candidate with the smallest created_at
        (ISO-8601 UTC, millisecond precision; timestamps are server-stamped at
        creation, so ties cannot occur and no further tie-break exists)
      then recompute waitlist_position over the remaining candidates ordered by
        created_at ascending, assigning 1..n
    input_set: "WAITLISTED registrations of the cancelled registration's (session, pool)"
    constants: {}
    precision: "positional integers, 1-based"

  - name: seat_pool_capacity
    trigger: "POST /ets/sessions/{id}/registrations (pool selection and vacancy check)"
    algorithm: aggregation
    formula: |
      pool = ACCOMMODATION iff examinee has >= 1 APPROVED AccommodationRequest
             at creation time, else GENERAL
      pool_size(GENERAL)       = total_seats - reserved_accommodation_seats
      pool_size(ACCOMMODATION) = reserved_accommodation_seats
      occupancy(pool) = count of this session's Registrations with
                        booking_status == CONFIRMED and computed pool == pool
      vacancy iff occupancy < pool_size  (boundary: occupancy == pool_size
      means the next registration in that pool is WAITLISTED, never an error)
      CONSERVED QUANTITY (seat invariant): for every session, at all times
        confirmed_count + waitlist_count + count(booking CANCELLED)
          == total registrations ever created for the session
      and confirmed_count <= total_seats.
    input_set: "registrations of the session grouped by computed pool and booking_status"
    constants: {}
    precision: "integer counts"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "caller role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "request body shape: required fields present, enums and formats valid (institution_code ^[A-Z0-9]{4,8}$, section_raws exactly 3 integers 0..50, end_time later than start_time, reserved_accommodation_seats <= total_seats)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: auth
    check: "ownership: an Examinee caller may only act on their own resources — POST /sessions/{id}/registrations body examinee_id must equal X-User-ID; respond/cancel/accommodation-create/examinee-read paths must resolve to the caller's own examinee id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "Examinee-role endpoints"
  - priority: 5
    category: existence
    check: "path-template resources exist, validated left-to-right (center, then session/audit/staff, then registration/score/case/report)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 6
    category: state
    check: "state-machine preconditions: registration create requires session PUBLISHED (ERR_SESSION_NOT_PUBLISHED); publish requires center AUTHORIZED (ERR_CENTER_NOT_AUTHORIZED); check-in requires registration booking CONFIRMED + attendance PENDING (ERR_INVALID_STATE / ERR_ALREADY_CHECKED_IN) + session LOCKED (ERR_SESSION_NOT_LOCKED); score-entry and analysis require session ADMINISTERED (ERR_SESSION_NOT_ADMINISTERED); analysis requires a ScoreRecord for every COMPLETED registration (ERR_SCORES_INCOMPLETE); report send requires score not PENDING_ANALYSIS (ERR_SCORE_NOT_RELEASED) and not CANCELLED (ERR_SCORE_CANCELLED); adjudicate requires case RESPONSE_RECEIVED or WINDOW_EXPIRED (ERR_ADJUDICATION_NOT_READY); every other from-state violation (ERR_INVALID_STATE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "compliance gates: registration create rejects a BANNED examinee (ERR_EXAMINEE_BANNED); adjudicate rejects a caller whose X-User-ID equals the case's flagged_by_analyst_id — segregation of duties (ERR_SOD_VIOLATION)"
    error_id: ERR_EXAMINEE_BANNED
    http_status: 403
    applies_to: "POST /ets/sessions/{id}/registrations; POST /ets/score-review-cases/{id}/adjudicate"
  - priority: 8
    category: business_referential
    check: "referenced-context integrity: proctor assignment requires staff.center_id == session.center_id (ERR_PROCTOR_NOT_AT_CENTER); irregularity filing requires the caller's X-User-ID to be an element of the session's proctor_staff_ids (ERR_PROCTOR_NOT_ASSIGNED)"
    error_id: ERR_PROCTOR_NOT_AT_CENTER
    http_status: 422
    applies_to: "POST /ets/sessions/{id}/proctors; POST /ets/sessions/{id}/irregularity-reports"
  - priority: 9
    category: business_temporal
    check: "temporal conflicts: new session at same (center, test_date, room_label) must leave a gap >= TURNAROUND_BUFFER_MIN (60 min) to every existing non-CANCELLED session (ERR_SESSION_OVERLAP); a proctor may not be assigned to two sessions on the same test_date whose [start,end) intervals strictly overlap — back-to-back touching is allowed (ERR_PROCTOR_OVERLAP); session lock requires current UTC date == test_date (ERR_LOCK_WINDOW_NOT_OPEN); case respond requires clock <= response_deadline (ERR_RESPONSE_WINDOW_CLOSED); registration create requires the current UTC date strictly earlier than session.test_date — registration closes on the test date (ERR_REGISTRATION_WINDOW_CLOSED)"
    error_id: ERR_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /ets/test-centers/{id}/sessions; POST /ets/sessions/{id}/proctors; POST /ets/sessions/{id}/lock; POST /ets/score-review-cases/{id}/respond; POST /ets/sessions/{id}/registrations"
  - priority: 10
    category: business_constraint
    check: "uniqueness and optimistic-concurrency: one live (CONFIRMED or WAITLISTED) registration per (session, examinee) (ERR_DUPLICATE_REGISTRATION); expected_session_version / expected_case_version must equal the parent's current version (ERR_STALE_VERSION)"
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /ets/sessions/{id}/registrations; POST /ets/score-review-cases/{id}/adjudicate"

endpoints:
  - method: POST
    path: "/ets/test-centers"
    description: "Create a test-center application (starts APPLIED)"
    roles: [ProgramAdmin]
    code: 201
    input: [name, facility_seat_capacity, equipment_list]
    output: TestCenter
    side_effects: []
  - method: GET
    path: "/ets/test-centers/{id}"
    description: "Read one test center"
    roles: [ProgramAdmin, Auditor, CenterManager, Proctor, ScoreAnalyst]
    code: 200
    input: []
    output: TestCenter
    side_effects: []
  - method: POST
    path: "/ets/test-centers/{id}/audits"
    description: "Schedule a periodic audit for a center"
    roles: [ProgramAdmin]
    code: 201
    input: [scheduled_date, audit_type]
    output: CenterAudit
    side_effects: []
  - method: GET
    path: "/ets/test-centers/{id}/audits"
    description: "List audits of a center (FK reverse reachability)"
    roles: [ProgramAdmin, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "CenterAudit[]"
    side_effects: []
  - method: POST
    path: "/ets/audits/{id}/complete"
    description: "Record audit findings; computes compliance_score/outcome and drives the TestCenter authorization transition including the session+registration cascade on FAILED"
    roles: [Auditor]
    code: 200
    input: [facility_findings, staffing_findings, equipment_findings, high_severity_findings]
    output: CenterAudit
    side_effects: ["audit_compliance_score", "TestCenter authorization transitions"]
  - method: POST
    path: "/ets/test-centers/{id}/staff"
    description: "Add a staff member to a center"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, staff_role, certification_level]
    output: Staff
    side_effects: ["TestCenter.active_staff_count recompute"]
  - method: GET
    path: "/ets/test-centers/{id}/staff"
    description: "List staff of a center (FK reverse reachability)"
    roles: [ProgramAdmin, CenterManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Staff[]"
    side_effects: []
  - method: POST
    path: "/ets/test-centers/{id}/sessions"
    description: "Create a session (DRAFT); rejects same-room same-date overlaps that leave < 60 minutes turnaround"
    roles: [ProgramAdmin]
    code: 201
    input: [test_date, start_time, end_time, room_label, total_seats, reserved_accommodation_seats]
    output: TestSession
    side_effects: []
  - method: GET
    path: "/ets/test-centers/{id}/sessions"
    description: "List sessions of a center (FK reverse reachability)"
    roles: [ProgramAdmin, CenterManager, Proctor, ScoreAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "TestSession[]"
    side_effects: []
  - method: GET
    path: "/ets/sessions/{id}"
    description: "Read one session (source of the current version for expected_session_version)"
    roles: [ProgramAdmin, CenterManager, Proctor, ScoreAnalyst, Examinee]
    code: 200
    input: []
    output: TestSession
    side_effects: []
  - method: POST
    path: "/ets/sessions/{id}/publish"
    description: "Publish a DRAFT session; requires the center AUTHORIZED"
    roles: [CenterManager]
    code: 200
    input: []
    output: TestSession
    side_effects: ["increments TestSession.version by 1"]
  - method: POST
    path: "/ets/sessions/{id}/lock"
    description: "Lock a PUBLISHED session on its test date; opens check-in"
    roles: [CenterManager]
    code: 200
    input: []
    output: TestSession
    side_effects: ["increments TestSession.version by 1"]
  - method: POST
    path: "/ets/sessions/{id}/administer"
    description: "Close administration of a LOCKED session after end_time; sweeps never-admitted CONFIRMED registrations to NO_SHOW"
    roles: [CenterManager]
    code: 200
    input: []
    output: TestSession
    side_effects: ["no-show sweep", "increments TestSession.version by 1"]
  - method: POST
    path: "/ets/sessions/{id}/proctors"
    description: "Assign a proctor to a session; staff must belong to the session's center; strict same-date interval overlap with the proctor's other sessions is rejected (touching intervals allowed)"
    roles: [CenterManager]
    code: 200
    input: [staff_id]
    output: TestSession
    side_effects: ["appends staff_id to proctor_staff_ids", "increments TestSession.version by 1"]
  - method: POST
    path: "/ets/examinees"
    description: "Create an examinee record (ACTIVE)"
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, date_of_birth, id_document_type, id_document_number, id_document_expiry]
    output: Examinee
    side_effects: []
  - method: GET
    path: "/ets/examinees/{id}"
    description: "Read one examinee; an Examinee caller may only read their own id"
    roles: [ProgramAdmin, ScoreAnalyst, Examinee]
    code: 200
    input: []
    output: Examinee
    side_effects: []
  - method: GET
    path: "/ets/examinees/{id}/registrations"
    description: "List registrations of an examinee (FK reverse reachability)"
    roles: [ProgramAdmin, ScoreAnalyst, Examinee]
    code: 200
    input: ["limit?", "offset?"]
    output: "Registration[]"
    side_effects: []
  - method: POST
    path: "/ets/examinees/{id}/accommodation-requests"
    description: "Examinee files an accommodation request (SUBMITTED)"
    roles: [Examinee]
    code: 201
    input: [accommodation_type]
    output: AccommodationRequest
    side_effects: []
  - method: GET
    path: "/ets/examinees/{id}/accommodation-requests"
    description: "List accommodation requests of an examinee (FK reverse reachability)"
    roles: [Examinee, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "AccommodationRequest[]"
    side_effects: []
  - method: POST
    path: "/ets/accommodation-requests/{id}/decide"
    description: "Approve or deny a SUBMITTED accommodation request"
    roles: [ProgramAdmin]
    code: 200
    input: [decision]
    output: AccommodationRequest
    side_effects: ["sets decided_by"]

  - method: POST
    path: "/ets/sessions/{id}/registrations"
    description: "Register an examinee for a PUBLISHED session before the test date; pool selection and waitlisting per seat_pool_capacity; guarded by OCC on the session version"
    roles: [Examinee]
    code: 201
    input: [examinee_id, expected_session_version]
    output: Registration
    side_effects: ["seat_pool_capacity", "increments TestSession.version by 1", "recomputes confirmed_count / waitlist_count"]
  - method: GET
    path: "/ets/sessions/{id}/registrations"
    description: "List registrations of a session (FK reverse reachability)"
    roles: [ProgramAdmin, CenterManager, Proctor, ScoreAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "Registration[]"
    side_effects: []
  - method: GET
    path: "/ets/registrations/{id}"
    description: "Read one registration"
    roles: [ProgramAdmin, CenterManager, Proctor, ScoreAnalyst, Examinee]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: POST
    path: "/ets/registrations/{id}/cancel"
    description: "Cancel a CONFIRMED or WAITLISTED registration (Examinee cancels own); auto-promotes the pool waitlist per waitlist_promotion_selection"
    roles: [Examinee, ProgramAdmin]
    code: 200
    input: []
    output: Registration
    side_effects: ["waitlist_promotion_selection", "increments TestSession.version by 1", "recomputes confirmed_count / waitlist_count"]
  - method: POST
    path: "/ets/registrations/{id}/check-in"
    description: "Proctor performs identity verification; computes document/biometric checks and admission decision; appends an immutable CheckInRecord and moves attendance to ADMITTED or DENIED"
    roles: [Proctor]
    code: 201
    input: [id_document_number, id_document_expiry, biometric_sample]
    output: CheckInRecord
    side_effects: ["attendance transition", "first biometric capture stores Examinee.biometric_template_ref"]
  - method: GET
    path: "/ets/registrations/{id}/check-ins"
    description: "List check-in records of a registration (FK reverse reachability)"
    roles: [ProgramAdmin, CenterManager, Proctor]
    code: 200
    input: ["limit?", "offset?"]
    output: "CheckInRecord[]"
    side_effects: []
  - method: POST
    path: "/ets/sessions/{id}/irregularity-reports"
    description: "Assigned proctor files an irregularity report against a registration of this session"
    roles: [Proctor]
    code: 201
    input: [registration_id, category, severity, narrative]
    output: IrregularityReport
    side_effects: []
  - method: GET
    path: "/ets/registrations/{id}/irregularity-reports"
    description: "List irregularity reports of a registration (FK reverse reachability)"
    roles: [ProgramAdmin, CenterManager, ScoreAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "IrregularityReport[]"
    side_effects: []
  - method: POST
    path: "/ets/irregularity-reports/{id}/resolve"
    description: "Substantiate or dismiss a FILED report; substantiated CONTENT_EXPOSURE opens a ScoreReviewCase when a ScoreRecord exists"
    roles: [ProgramAdmin]
    code: 200
    input: [resolution]
    output: IrregularityReport
    side_effects: ["conditional ScoreReviewCase opening", "ScoreRecord -> UNDER_REVIEW"]
  - method: POST
    path: "/ets/registrations/{id}/score-entry"
    description: "Enter the raw score for an ADMITTED registration of an ADMINISTERED session; creates the ScoreRecord (PENDING_ANALYSIS) and completes attendance"
    roles: [ScoreAnalyst]
    code: 201
    input: [section_raws, prior_best_scaled_score, matched_responses_count, total_scored_items, same_form, adjacent_seated]
    output: ScoreRecord
    side_effects: ["provisional_scaled_score", "attendance ADMITTED -> COMPLETED"]
  - method: GET
    path: "/ets/registrations/{id}/score"
    description: "Return the ScoreRecord of a registration as a 0..1 element array (FK reverse reachability)"
    roles: [ProgramAdmin, ScoreAnalyst, Examinee]
    code: 200
    input: []
    output: "ScoreRecord[]"
    side_effects: []
  - method: GET
    path: "/ets/registrations/{id}/review-cases"
    description: "List review cases of a registration (FK reverse reachability; also the read path for a case's current version)"
    roles: [ProgramAdmin, ScoreAnalyst, Examinee]
    code: 200
    input: ["limit?", "offset?"]
    output: "ScoreReviewCase[]"
    side_effects: []
  - method: POST
    path: "/ets/score-analysis/run"
    description: "Run score analysis over an ADMINISTERED session: equated scores, anomalous-gain and similarity flags, case openings, auto-release of clean scores; session -> SCORED"
    roles: [ScoreAnalyst]
    code: 200
    input: [session_id]
    output: "{ processed_count: integer, flagged_count: integer, released_count: integer, opened_case_ids: array }"
    side_effects: ["equated_final_scaled_score", "anomalous_gain_check", "response_similarity_index", "ScoreReviewCase openings", "TestSession ADMINISTERED -> SCORED"]
  - method: POST
    path: "/ets/score-review-cases/{id}/notify"
    description: "Notify the examinee that their score is under review; opens the 30-day response window"
    roles: [ScoreAnalyst]
    code: 200
    input: []
    output: ScoreReviewCase
    side_effects: ["sets response_deadline", "increments ScoreReviewCase.version by 1"]
  - method: POST
    path: "/ets/score-review-cases/{id}/respond"
    description: "Examinee submits their response within the response window"
    roles: [Examinee]
    code: 200
    input: [response_text]
    output: ScoreReviewCase
    side_effects: ["sets examinee_response", "increments ScoreReviewCase.version by 1"]
  - method: POST
    path: "/ets/score-review-cases/{id}/adjudicate"
    description: "ProgramAdmin adjudicates a case after the response or window expiry; segregation of duties against flagged_by_analyst_id; OCC on the case version"
    roles: [ProgramAdmin]
    code: 200
    input: [outcome, rationale, expected_case_version]
    output: ScoreReviewCase
    side_effects: ["score VALIDATED->RELEASED with held-report release, or score CANCELLED with report-recall cascade and examinee-ban branch", "increments ScoreReviewCase.version by 1"]
  - method: POST
    path: "/ets/score-records/{id}/reports"
    description: "Send the score to an institution; RELEASED score -> RELEASED report, UNDER_REVIEW score -> HELD report with hold_until = case deadline"
    roles: [ScoreAnalyst]
    code: 201
    input: [institution_code]
    output: ScoreReport
    side_effects: ["released_report_count recompute"]
  - method: GET
    path: "/ets/score-records/{id}/reports"
    description: "List reports of a score record (FK reverse reachability)"
    roles: [ProgramAdmin, ScoreAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: "ScoreReport[]"
    side_effects: []
  - method: GET
    path: "/ets/score-records/{id}"
    description: "Read one score record"
    roles: [ProgramAdmin, ScoreAnalyst]
    code: 200
    input: []
    output: ScoreRecord
    side_effects: []
  - method: POST
    path: "/ets/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Before any set call the clock reads exactly 2026-09-01T00:00:00Z and never wall-clock time. Setting the clock sweeps NOTIFIED review cases whose response_deadline is now past into WINDOW_EXPIRED."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["ScoreReviewCase NOTIFIED -> WINDOW_EXPIRED sweep"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers, or an undeclared role name"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted on the endpoint, or an Examinee caller acting on another examinee's resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, unknown enum value, bad format (institution_code, section_raws arity/range, end_time <= start_time, reserved_accommodation_seats > total_seats)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-template resource id does not exist (checked left-to-right)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic from-state violation: transition attempted from a state not listing that trigger (e.g. double complete of an audit, cancel of a COMPLETED registration, check-in of a CANCELLED booking, respond on an already-responded case)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_session_version / expected_case_version does not equal the parent entity's current version"
  - id: ERR_CENTER_NOT_AUTHORIZED
    http: 409
    condition: "Session publish (or session-dependent action) attempted while the center is APPLIED or SUSPENDED"
  - id: ERR_SESSION_NOT_PUBLISHED
    http: 409
    condition: "Registration attempted against a session not in PUBLISHED"
  - id: ERR_SESSION_NOT_LOCKED
    http: 409
    condition: "Check-in attempted against a session not in LOCKED"
  - id: ERR_ALREADY_CHECKED_IN
    http: 409
    condition: "Check-in attempted when attendance_status != PENDING"
  - id: ERR_SESSION_NOT_ADMINISTERED
    http: 409
    condition: "Score entry or analysis run attempted for a session not in ADMINISTERED"
  - id: ERR_SCORES_INCOMPLETE
    http: 409
    condition: "Analysis run while some COMPLETED registration lacks a ScoreRecord"
  - id: ERR_SCORE_NOT_RELEASED
    http: 409
    condition: "Report send attempted while the score is PENDING_ANALYSIS"
  - id: ERR_SCORE_CANCELLED
    http: 409
    condition: "Report send attempted for a CANCELLED score"
  - id: ERR_EXAMINEE_BANNED
    http: 403
    condition: "Registration attempted by an examinee in BANNED status"
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Adjudicator X-User-ID equals the case's flagged_by_analyst_id (segregation of duties)"
  - id: ERR_PROCTOR_NOT_AT_CENTER
    http: 422
    condition: "Proctor assignment where staff.center_id != session.center_id"
  - id: ERR_PROCTOR_NOT_ASSIGNED
    http: 403
    condition: "Irregularity filed by a proctor whose id is not in the session's proctor_staff_ids"
  - id: ERR_SESSION_OVERLAP
    http: 409
    condition: "New session at the same (center, test_date, room_label) leaves < 60 minutes turnaround to an existing non-CANCELLED session"
  - id: ERR_PROCTOR_OVERLAP
    http: 409
    condition: "Proctor assignment where the same staff member's same-date sessions strictly overlap (touching intervals are allowed)"
  - id: ERR_LOCK_WINDOW_NOT_OPEN
    http: 422
    condition: "Session lock attempted when the current UTC date is not the session's test_date"
  - id: ERR_RESPONSE_WINDOW_CLOSED
    http: 422
    condition: "Examinee response submitted after the case's response_deadline"
  - id: ERR_ADJUDICATION_NOT_READY
    http: 409
    condition: "Adjudication attempted while the case is OPENED or NOTIFIED with the response window still open"
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "A registration with booking_status CONFIRMED or WAITLISTED already exists for this (session, examinee)"
  - id: ERR_REGISTRATION_WINDOW_CLOSED
    http: 422
    condition: "Registration attempted when the current UTC date is on or after the session's test_date (registration closes before test day)"

roles:
  - name: ProgramAdmin
    description: "ETS program operator: owns centers, audits scheduling, staff, sessions, accommodation decisions, irregularity resolution, and case adjudication"
    identity: opaque
    exclusive_operations: ["create test centers", "schedule audits", "add staff", "create sessions", "decide accommodation requests", "resolve irregularity reports", "adjudicate review cases", "set logical clock"]
    shared_operations: ["read centers/sessions/registrations/scores/reports", "cancel registrations"]
  - name: Auditor
    description: "Field auditor who records audit findings; an Auditor never schedules the audits they complete"
    identity: opaque
    exclusive_operations: ["complete audits"]
    shared_operations: ["read centers", "list audits"]
  - name: CenterManager
    description: "Manager of a test center (a Staff row with staff_role CENTER_MANAGER): drives the session day lifecycle and proctor assignments"
    identity: "entity_backed:Staff"
    exclusive_operations: ["publish/lock/administer sessions", "assign proctors"]
    shared_operations: ["read sessions and registrations", "list staff", "list check-ins and irregularity reports"]
  - name: Proctor
    description: "Test-day proctor (a Staff row with staff_role PROCTOR): performs check-in and files irregularity reports"
    identity: "entity_backed:Staff"
    exclusive_operations: ["perform check-in", "file irregularity reports"]
    shared_operations: ["read sessions and registrations", "list check-ins"]
  - name: Examinee
    description: "Test taker: registers for sessions, requests accommodations, and responds to score reviews"
    identity: "entity_backed:Examinee"
    exclusive_operations: ["create own registration", "file own accommodation request", "respond to own review case"]
    shared_operations: ["cancel own registration", "read own examinee record, registrations, score, review cases"]
  - name: ScoreAnalyst
    description: "Psychometric operations: enters scores, runs score analysis, notifies examinees, sends score reports; the analyst who flags a case may not adjudicate it"
    identity: opaque
    exclusive_operations: ["score entry", "run score analysis", "notify review cases", "send score reports"]
    shared_operations: ["read sessions, registrations, scores, review cases"]
