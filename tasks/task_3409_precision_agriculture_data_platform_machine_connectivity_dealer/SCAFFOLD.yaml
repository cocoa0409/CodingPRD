    preconditions: []
    side_effects:
    - Recompute Machine.active_license_count
  - from: PURCHASED
    to: REVOKED
    trigger: POST /agdata/feature-licenses/{id}/revoke
    actor: PlatformAdmin
    preconditions: []
    side_effects:
    - Recompute Machine.active_license_count
  - from: ACTIVATED
    to: REVOKED
    trigger: POST /agdata/feature-licenses/{id}/revoke
    actor: PlatformAdmin
    preconditions: []
    side_effects:
    - Recompute Machine.active_license_count
  - from: SUSPENDED
    to: REVOKED
    trigger: POST /agdata/feature-licenses/{id}/revoke
    actor: PlatformAdmin
    preconditions: []
    side_effects:
    - Recompute Machine.active_license_count
  - from: ACTIVATED
