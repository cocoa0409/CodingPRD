          assert:
            - "after FAIL audit House.${h}.house_status == QUARANTINED with downtime_until == 2026-10-03 (2026-09-12 + 21d > 2026-09-24 catch downtime, so max wins)"
            - "after PASS audit + release, House.${h}.house_status == ACTIVE and downtime_until == null"

  # ------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers)
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: catch_complete_cascade_depth3
        grounds:
          - state_machines.Flock.CATCH_SCHEDULED_to_HARVESTED
          - state_machines.House.PLACED_to_DOWNTIME
          - calculations.adjusted_fcr
        distinguishing_aspect: |
          Depth-3 cascade from catch-schedule complete: catch COMPLETED ->
          Flock HARVESTED (adj_fcr computed) -> House PLACED->DOWNTIME with
          downtime_until set -> SettlementGroup averages recomputed (third
          hop caused by the flock mutation, not by the original call).
        test_recipe:
          setup:
            - "Grower/house/flock placed 5000, feed 10000 lbs, catch scheduled 2026-09-10, one weight ticket 5000 lbs"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-C3", full_name: "Cascade Grower" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 10000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-C3", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-37", week_ending_date: "2026-10-17" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-C3" }, as: IntegratorAdmin, captures: { f: $.data.id } }
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-01", head_count: 5000 }, as: IntegratorAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 10000, feed_type: STARTER, ticket_no: "FT-C3" }, as: IntegratorAdmin }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-C3", max_catches_per_day: 2 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { cs: $.data.id } }
            - { call: "POST /api/flocks/${f}/weight-tickets", payload: { ticket_no: "WT-C3", weighed_at: "2026-09-10T08:00:00Z", live_weight_lbs: 5000 }, as: LivehaulScheduler }
          trigger:
