            - "a_appr == 52000 (exactly at 4.00% sub-cap — inclusive boundary, not clamped)"

      - name: adjustment_amount_zero_and_full_boundaries
        grounds:
          - state_machines.InvoiceLineItem.PENDING_to_ADJUSTED_APPROVED
          - errors[ERR_INVALID_ADJUSTMENT]
        distinguishing_aspect: |
          Metric: adjusted_amount_cents on the line-item adjust endpoint
          (distinct from the rate-cap metric). adjusted_amount_cents == 0 is
