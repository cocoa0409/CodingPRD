            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r1_id: $.data.id } }
