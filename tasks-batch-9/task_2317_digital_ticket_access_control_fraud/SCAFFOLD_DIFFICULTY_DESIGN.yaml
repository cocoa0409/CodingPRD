  # ===========================================================================
  # Rule 8 — resource_temporal_overlap
  # Half-open gate sessions, a closed per-ticket lockout interval, and a half-open
  # aggregate credential window. All three pin the touching-but-not-overlapping case.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: gate_session_interval_is_half_open_and_an_adjacent_open_is_accepted
        grounds:
          - validations[priority=29]
          - errors.ERR_GATE_SESSION_OVERLAP
          - entities.ScanSession.fields.opened_at
          - entities.ScanSession.fields.closed_at
          - concurrency_rules[scan-session-open-stale-gate]
          - state_machines.Gate.IDLE_to_SCANNING
        distinguishing_aspect: |
          The occupancy interval of a ScanSession over its Gate is the half-open
          [opened_at, closed_at), with an OPEN session unbounded above. Opening a second
          session on the same gate at 2026-09-12T18:15:00Z is refused with
          ERR_GATE_SESSION_OVERLAP (never ERR_INVALID_STATE, because priority 9 is scoped
          to the resource named in the path and this path names no session); opening one at
          exactly the predecessor's closed_at 2026-09-12T18:20:00Z is ACCEPTED because the
          upper bound is exclusive; and a session on a DIFFERENT gate during S1's open
          interval is accepted because the resource being contended is the gate, not the
          event.
        test_recipe:
          setup:
            - "Event DOORS_OPEN with two gates created while the event was DRAFT: G1 and G2, both on AccessZone GA1."
            - "Clock at 2026-09-12T18:10:00Z; ScanSession S1 opened on G1 (opened_at 2026-09-12T18:10:00Z, closed_at null)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
                price_cap_regime: "VENUE_POLICY"
                transfer_limit_per_ticket: 2
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload:
                zone_code: "GA1"
                required_entitlement_level: "GA"
                fire_code_capacity: 200
                face_value_reference_cents: 8750
                credential_capacity: 4
                comp_discount_pct: 0.85
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_ga_id: $.data.id }
            - call: "POST /events/${ev_id}/gates"
              payload: { gate_code: "G1", access_zone_id: "${z_ga_id}", throughput_per_minute: 20, lanes_open: 2 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { g1_id: $.data.id, g1_v0: $.data.version }
            - call: "POST /events/${ev_id}/gates"
              payload: { gate_code: "G2", access_zone_id: "${z_ga_id}", throughput_per_minute: 20, lanes_open: 1 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { g2_id: $.data.id, g2_v0: $.data.version }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "DOORS_OPEN" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:10:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-1", mode: "ONLINE", expected_gate_version: "${g1_v0}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s1_id: $.data.id, s1_opened_at: $.data.opened_at }
          trigger:
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g2_id}", operator_device_id: "SCN-2", mode: "ONLINE", expected_gate_version: "${g2_v0}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s_other_gate_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:15:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "GET /gates/${g1_id}"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { g1_v1: $.data.version, g1_status_scanning: $.data.status }
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-3", mode: "ONLINE", expected_gate_version: "${g1_v1}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:20:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-sessions/${s1_id}/close"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s1_closed_at: $.data.closed_at }
            - call: "GET /gates/${g1_id}"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { g1_v2: $.data.version }
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-3", mode: "OFFLINE_CAPABLE", expected_gate_version: "${g1_v2}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s2_id: $.data.id, s2_opened_at: $.data.opened_at, s2_mode: $.data.mode }
          assert:
            - "${s1_opened_at} == 2026-09-12T18:10:00Z and the concurrent session on G2 was created with HTTP 201 — the contended resource is the gate, not the event"
            - "${g1_status_scanning} == SCANNING at 2026-09-12T18:15:00Z"
            - "${err_overlap} == ERR_GATE_SESSION_OVERLAP with HTTP 409 — 18:15:00 lies inside [18:10:00, +infinity) for the still-OPEN S1, and this is NOT reported as ERR_INVALID_STATE"
            - "The refused attempt created nothing and moved no version: GET /scan-sessions?gate_id=${g1_id} still has total_count == 1 and Gate.${g1_id}.version == ${g1_v1}"
            - "${s1_closed_at} == 2026-09-12T18:20:00Z"
            - "${s2_opened_at} == 2026-09-12T18:20:00Z and ${s2_mode} == OFFLINE_CAPABLE, created with HTTP 201 — opening exactly at the predecessor's closed_at is accepted because the interval is half-open"
            - "GET /scan-sessions?gate_id=${g1_id} has total_count == 2 and GET /scan-sessions?gate_id=${g2_id} has total_count == 1"
            - "Gate.${g1_id}.status == SCANNING and Gate.${g2_id}.status == SCANNING at the end"

