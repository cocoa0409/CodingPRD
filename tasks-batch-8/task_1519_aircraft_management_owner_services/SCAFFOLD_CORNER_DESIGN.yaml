      - name: platform_admin_cannot_onboard_owner
        claim_type: role_exclusive_denied
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "PlatformAdmin exists only for the logical clock; every business endpoint rejects it with ERR_FORBIDDEN_ROLE."
        test_recipe:
