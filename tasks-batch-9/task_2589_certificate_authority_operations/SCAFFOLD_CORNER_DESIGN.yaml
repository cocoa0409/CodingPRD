          - calculations.issuance_charge_settlement.formula.step_1
          - calculations.issuance_charge_settlement.formula.step_2
          - calculations.issuance_charge_settlement.constants.VALIDATION_MULTIPLIER
        distinguishing_aspect: "With base_fee_cents 10001 on an OV profile the unit is round_half_up(15001.5) = 15002 and the two-domain subtotal is 30004; rounding the product instead (round_half_up(10001 * 1.5 * 2) = 30003) is off by one cent, so the assertion separates the two rounding orders."
        test_recipe:
          setup:
            - "One ACTIVE OV profile (base_fee_cents 10001, org_vetting_reuse_days 825), one subscriber with an APPROVED OV vetting and two validated DNS_TXT authorizations."
