            - call: "POST /boathouse/water-sessions"
              payload: { shell_id: "${shell_id}", session_kind: "PRACTICE", planned_start_at: "2026-08-01T06:00:00Z", planned_end_at: "2026-08-01T07:00:00Z", coach_member_id: "${coach_id}", athlete_member_ids: ["${gone_id}"] }
              as: Coach
              as_user_id: "${coach_id}"
          assert:
            - "the call returns HTTP 409 with data.error_id == ERR_MEMBER_NOT_ACTIVE"
            - "GET /boathouse/water-sessions?shell_id=${shell_id} returns total_count == 0"
            - "Shell.${shell_id}.status == AVAILABLE"

      - name: corner_entries_closed_versus_dues_block_ordering_covered_by_difficulty
