              captures: { cmb: "$.data[0].id" }
          assert:
            - "Shipment.${sh1}.original_charge_cents == 12500"
            - "Shipment.${sh1}.assessed_total_cents == 45314"
            - "CorrectionNotice.${na}.status == UPHELD"
            - "CorrectionNotice.${na}.applied_delta_cents == 28314"
            - "CorrectionNotice.${na}.inspection_fee_cents == 4500"
            - "CorrectionNotice.${na}.credited_total_cents == 0"
            - "CorrectionNotice.${nb}.status == OVERTURNED"
            - "CorrectionNotice.${nb}.applied_delta_cents == 28314"
            - "CorrectionNotice.${nb}.inspection_fee_cents == 4500"
            - "CorrectionNotice.${nb}.credited_total_cents == 32956"
            - "CreditMemo.${cmb}.freight_credit_cents == 28314"
            - "CreditMemo.${cmb}.fee_credit_cents == 4500"
            - "CreditMemo.${cmb}.interest_credit_cents == 142"
            - "CreditMemo.${cmb}.amount_cents == 32956"
            - "ledger identity — 12500 + (28314 + 4500) + (28314 + 4500) - (28314 + 4500) == 45314"
            - "Shipment.${sh1}.billing_status == CREDITED"
            - "Shipment.${sh1}.class_status == CAPTURED"
            - "Shipment.${sh1}.open_notice_count == 0"
            - "Customer.${cust1}.offender_strike_count == 1"

      - name: count_invariant_strike_reverts_but_education_flag_does_not
        grounds:
          - entities.Customer.fields.offender_strike_count
          - entities.Customer.fields.education_status
          - entities.Customer.fields.education_threshold_strikes
          - state_machines.CorrectionNotice.DISPUTED_to_OVERTURNED
          - state_machines.Customer.REQUIRED_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity = count. Overturning the only notice removes it from the counted status
          set, so offender_strike_count reverts 1 -> 0 and liability_index_lifetime stays 0.00, but
          the education dimension deliberately does NOT unwind: education_status remains COMPLETED,
          education_required_at keeps its 2026-01-10T08:00:00Z stamp and education_threshold_strikes
          stays at the raised value 2. Reverting the flag alongside the count is the wrong answer.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-10T08:00:00Z; terminal TRM1; customer REPEAT with education_strike_interval = 1 on an ACTIVE CLASS_BASED program (4200 c/cwt, 35%, 12500 minimum)."
            - "Shipment PROD101 (single 400 lb class 70 line, 4 pieces 48.0x40.0x48.0) billed at 12500 and captured at 520 lb."
            - "The automated BOTH notice is issued (strike 1 -> education REQUIRED, assessed 45314); education is then completed, raising education_threshold_strikes to 2, and the shipper files a dispute."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/terminals"
              payload: { code: "TRM1", name: "Chicago Dock" }
              as: PricingAnalyst
              captures: { trm1: "$.data.id" }
            - call: "POST /ltl/customers"
              payload: { account_code: "REPEAT", name: "Repeat Offender Co", education_strike_interval: 1 }
              as: PricingAnalyst
              captures: { cust1: "$.data.id", cust1_v: "$.data.version" }
            - call: "POST /ltl/tariff-versions"
              payload: { code: "NMFC-2026A", effective_at: "2026-01-01T00:00:00Z", density_breaks: [{min_density_pcf: 30, class_code: 60}, {min_density_pcf: 22.5, class_code: 65}, {min_density_pcf: 15, class_code: 70}, {min_density_pcf: 13.5, class_code: 85}, {min_density_pcf: 12, class_code: 92.5}, {min_density_pcf: 10.5, class_code: 100}, {min_density_pcf: 9, class_code: 110}, {min_density_pcf: 8, class_code: 125}, {min_density_pcf: 6, class_code: 150}, {min_density_pcf: 4, class_code: 175}, {min_density_pcf: 2, class_code: 250}, {min_density_pcf: 1, class_code: 300}, {min_density_pcf: 0, class_code: 400}] }
              as: PricingAnalyst
              captures: { tv1: "$.data.id" }
            - call: "POST /ltl/commodity-profiles"
              payload: { tariff_version_id: "${tv1}", nmfc_item: "156600", description: "Machine parts, boxed", classification_basis: "DENSITY_BASED" }
              as: PricingAnalyst
              captures: { cp1: "$.data.id" }
            - call: "POST /ltl/tariff-versions/${tv1}/publish"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs"
              payload: { customer_id: "${cust1}", program_type: "CLASS_BASED", base_rate_per_cwt_cents: 4200, discount_pct: 0.35, min_charge_cents: 12500 }
              as: PricingAnalyst
              captures: { rp1: "$.data.id" }
            - call: "POST /ltl/rate-programs/${rp1}/approve"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs/${rp1}/activate"
              payload: { expected_customer_version: "${cust1_v}" }
              as: PricingAnalyst
            - call: "POST /ltl/shipments"
              payload: { customer_id: "${cust1}", origin_terminal_id: "${trm1}", pro_number: "PROD101", pickup_at: "2026-01-10T08:00:00Z", bol_declared_total_weight_lb: 400 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { sh1: "$.data.id" }
            - call: "POST /ltl/shipments/${sh1}/lines"
              payload: { line_no: 1, commodity_profile_id: "${cp1}", declared_class_code: 70, declared_weight_lb: 400, pieces: 4, declared_length_in: 48.0, declared_width_in: 40.0, declared_height_in: 48.0 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { ln1: "$.data.id" }
            - call: "POST /ltl/shipments/${sh1}/bill"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/capture-events"
              payload: { shipment_id: "${sh1}", device_type: "COMBINED", measured_total_weight_lb: 520, line_measurements: [{line_no: 1, measured_weight_lb: 520, measured_length_in: 48.0, measured_width_in: 40.0, measured_height_in: 48.0}] }
              as: TerminalOperator
              as_user_id: "${trm1}"
              captures: { ce1: "$.data.id" }
            - call: "GET /ltl/correction-notices"
              payload: { shipment_id: "${sh1}" }
              as: ClassificationAuditor
              as_user_id: "aud-1"
              captures: { n1: "$.data[0].id" }
            - call: "POST /ltl/correction-notices/${n1}/issue"
              payload: {}
              as: ClassificationAuditor
              as_user_id: "aud-1"
            - call: "POST /ltl/customers/${cust1}/education/complete"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/disputes"
              payload: { correction_notice_id: "${n1}", claim_basis: "DEVICE_CALIBRATION", evidence_doc_count: 2 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { d1: "$.data.id" }
          trigger:
            - call: "POST /ltl/disputes/${d1}/resolve"
              payload: { outcome: "OVERTURNED", resolution_note: "Terminal scale was uncertified on the capture date." }
              as: DisputeReviewer
              as_user_id: "rev-1"
            - call: "GET /ltl/customers/${cust1}"
              payload: {}
              as: PricingAnalyst
              captures: { cust1_v2: "$.data.version" }
          assert:
            - "Customer.${cust1}.offender_strike_count == 0"
            - "Customer.${cust1}.liability_index_rolling == 0.00"
            - "Customer.${cust1}.liability_index_lifetime == 0.00"
            - "Customer.${cust1}.offender_tier == TIER_0"
            - "Customer.${cust1}.dispute_window_days == 30"
            - "Customer.${cust1}.education_status == COMPLETED"
            - "Customer.${cust1}.education_required_at == 2026-01-10T08:00:00Z"
            - "Customer.${cust1}.education_threshold_strikes == 2"
            - "CorrectionNotice.${n1}.status == OVERTURNED"
            - "CorrectionNotice.${n1}.credited_total_cents == 32956"
            - "Shipment.${sh1}.assessed_total_cents == 12500"
            - "Shipment.${sh1}.class_status == CAPTURED"
            - "Shipment.${sh1}.billing_status == CREDITED"
            - "ShipmentLine.${ln1}.effective_class_code == 70"
