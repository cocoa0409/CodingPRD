        distinguishing_aspect: "Four out-of-range shapes are refused (attrition before boarded_on, attrition after the clock, reactivation before the attrition, reactivation after the clock) while attrition exactly ON the clock date 2026-08-01 is accepted — the upper bound is inclusive. The refused calls must leave status and dates untouched."
