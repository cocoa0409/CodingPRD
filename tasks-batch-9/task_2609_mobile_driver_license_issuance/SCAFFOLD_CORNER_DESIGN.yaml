      - name: republication_clears_the_stale_pointer_inside_the_publishing_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /mdl/trust-list-snapshots]
          - entities.TrustListSnapshot.fields.revocation_pointer_sequence
        distinguishing_aspect: "The 201 body of the republication already reports snapshot_sequence 2, revocation_pointer_stale false, pending_delta_count 0 and revocation_pointer_sequence 1 (the one entry that existed at publication) - no second read is needed, and the profile's pending_republish_count is 0 immediately afterwards."
        test_recipe:
          setup:
            - "Canonical issuance chain produces one ACTIVE credential; snapshot 1 covers 2026-08-01 to 2026-12-01."
            - "The credential is then revoked, which appends one RevocationEntry and stales snapshot 1's pointer."
          setup_api_calls:
