              as: PropertyManager
              captures: { prvl_id: $.data.id }
            - call: "POST /leases/${prvl_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /vendor-bills"
              payload: { property_id: "${prv_id}", utility_id: "${uprv_id}", period_label: "2026-06", total_cost_cents: 7059 }
              as: PropertyManager
              captures: { prvvb_id: $.data.id }
            - call: "POST /vendor-bills/${prvvb_id}/approve"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles"
              payload: { property_id: "${prv_id}", utility_id: "${uprv_id}", vendor_bill_id: "${prvvb_id}", period_label: "2026-06", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: PropertyManager
              captures: { prvbc_id: $.data.id }
            - call: "POST /billing-cycles/${prvbc_id}/lock-reads"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${prvbc_id}/allocate"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${prvbc_id}/issue-statements"
