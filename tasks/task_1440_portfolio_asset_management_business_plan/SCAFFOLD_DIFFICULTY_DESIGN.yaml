  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: plan_revision_cycle_rejected_to_resubmitted
        grounds:
          - state_machines.BusinessPlan.DRAFT_to_SUBMITTED
          - state_machines.BusinessPlan.SUBMITTED_to_REJECTED
          - state_machines.BusinessPlan.REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          Entity = BusinessPlan: cyclic revision loop DRAFT -> SUBMITTED -> REJECTED ->
          SUBMITTED -> APPROVED; the REJECTED -> SUBMITTED edge makes the machine non-linear
          and version increments on every hop.
        test_recipe:
          setup:
            - "Portfolio P1, PM1 ACTIVE, asset A1 OWNED; FY2027 DRAFT plan with all 10 categories present"
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1", fiscal_year_start_month: 1 }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id, a1_v: $.data.version } }
