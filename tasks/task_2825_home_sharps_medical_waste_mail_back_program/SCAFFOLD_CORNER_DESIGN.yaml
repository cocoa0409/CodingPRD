# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index)
# Task 2825 — Home Sharps & Medical Waste Mail-Back Program
#
# Walked row-by-row against references/claim-extraction-guide.md over this
# scaffold's §1.1-§1.7 surface. Every `section:` is one of the guide's nine
# sections; every `claim_type:` is a row from that section's table.
# Corners already asserted by §1.8 carry an `excluded_because:` stub naming the
# §1.8 instance (all cited names exist in SCAFFOLD_DIFFICULTY_DESIGN.yaml).
# The logical clock's startup default is 2026-08-01T00:00:00Z; every chain sets
# it explicitly so each instance is self-contained.
# All numeric literals in `assert:` were produced by executing the §1.3 formulas
# against the pinned setup inputs.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: state_rule_creation_returns_201_with_every_declared_field_echoed
        claim_type: creation
        grounds:
          - entities.StateSharpsRule
          - endpoints.POST /sharps/state-rules
          - response_envelope.success
        distinguishing_aspect: "A single POST with all seven declared inputs returns 201 and a data object carrying every §1.1 StateSharpsRule field plus the four common fields, with version == 1 and created_at read from the logical clock."
        test_recipe:
          setup:
            - "Empty database, logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "CONDITIONALLY_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 5, requires_state_manifest: true, notification_deadline_hours: 48 }
              as: ProgramAdmin
              captures: { sr_new: $.data.id }
          assert:
            - "HTTP status == 201 and response_type == \"object\""
            - "StateSharpsRule.${sr_new}.state_code == \"CA\""
            - "StateSharpsRule.${sr_new}.household_sharps_classification == \"CONDITIONALLY_EXEMPT\""
            - "StateSharpsRule.${sr_new}.mail_back_permitted == true"
            - "StateSharpsRule.${sr_new}.max_container_volume_liters == 30.3"
            - "StateSharpsRule.${sr_new}.certificate_retention_years == 5"
            - "StateSharpsRule.${sr_new}.requires_state_manifest == true"
            - "StateSharpsRule.${sr_new}.notification_deadline_hours == 48"
            - "StateSharpsRule.${sr_new}.version == 1"
            - "StateSharpsRule.${sr_new}.created_at == \"2026-08-01T00:00:00Z\""
            - "StateSharpsRule.${sr_new}.updated_at == \"2026-08-01T00:00:00Z\""
            - "StateSharpsRule.${sr_new}.id is a non-empty string and is present in the response body"

      - name: patient_retrieval_returns_stored_row_with_zeroed_risk_fields
        claim_type: retrieval
        grounds:
          - entities.Patient
          - endpoints.GET /sharps/patients/{id}
          - entities.Patient.fields.screening_risk_score
          - entities.Patient.fields.audit_risk_score
        distinguishing_aspect: "GET /sharps/patients/{id} returns exactly what POST stored, and the two computed risk fields plus suspended_at read 0 / 0 / null for a patient with no non-conformance history."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; CA state rule seeded; one patient created and never reviewed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3, requires_state_manifest: false, notification_deadline_hours: 72 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Dana Reyes", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "dana@example.com" }
              as: ProgramAdmin
              captures: { pat_d: $.data.id }
          trigger:
            - call: "GET /sharps/patients/${pat_d}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "HTTP status == 200 and response_type == \"object\""
            - "Patient.${pat_d}.full_name == \"Dana Reyes\""
            - "Patient.${pat_d}.state_rule_id == ${sr_ca}"
            - "Patient.${pat_d}.therapy_type == \"INSULIN_PEN_NEEDLES\""
            - "Patient.${pat_d}.weekly_sharps_count == 20"
            - "Patient.${pat_d}.contact_email == \"dana@example.com\""
            - "Patient.${pat_d}.screening_risk_score == 0"
            - "Patient.${pat_d}.audit_risk_score == 0"
            - "Patient.${pat_d}.suspended_at == null"
            - "Patient.${pat_d}.status == \"PENDING_ELIGIBILITY\""
            - "Patient.${pat_d}.version == 1"

      - name: state_rules_listing_paginates_and_filters_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET /sharps/state-rules
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three StateSharpsRule rows seeded, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, offset=2 returns the last row with has_more false, and state_code=NV narrows total_count to 1 — pagination metadata is computed over the filtered set, not the whole table."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; exactly three state rules seeded: CA, NV, TX."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3 }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "NV", household_sharps_classification: "REGULATED_MEDICAL_WASTE", mail_back_permitted: false, max_container_volume_liters: 11.4, certificate_retention_years: 4 }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "TX", household_sharps_classification: "CONDITIONALLY_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 7.6, certificate_retention_years: 2 }
              as: ProgramAdmin
          trigger:
            - call: "GET /sharps/state-rules?limit=2&offset=0"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /sharps/state-rules?limit=2&offset=2"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /sharps/state-rules?state_code=NV"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /sharps/state-rules?mail_back_permitted=true"
              payload: {}
              as: LogisticsCoordinator
          assert:
            - "GET /sharps/state-rules?limit=2&offset=0 returns HTTP 200, response_type == \"array\", exactly 2 StateSharpsRule rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "GET /sharps/state-rules?limit=2&offset=2 returns exactly 1 StateSharpsRule row, total_count == 3, limit == 2, offset == 2, has_more == false"
            - "GET /sharps/state-rules?state_code=NV returns exactly 1 row whose state_code == \"NV\", total_count == 1, has_more == false"
            - "GET /sharps/state-rules?mail_back_permitted=true returns exactly 2 rows (CA and TX), total_count == 2, has_more == false"
            - "GET /sharps/state-rules with no query parameters returns all 3 rows, limit == 10, offset == 0, has_more == false"

      - name: unknown_ids_on_all_fourteen_single_row_reads_each_return_their_own_not_found_error
        claim_type: not_found
        grounds:
          - errors[ERR_STATE_RULE_NOT_FOUND]
          - errors[ERR_PACKAGING_SPEC_NOT_FOUND]
          - errors[ERR_FACILITY_NOT_FOUND]
          - errors[ERR_SPONSOR_NOT_FOUND]
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_PATIENT_NOT_FOUND]
          - errors[ERR_ENROLLMENT_NOT_FOUND]
          - errors[ERR_KIT_NOT_FOUND]
          - errors[ERR_LABEL_NOT_FOUND]
          - errors[ERR_SHIPMENT_NOT_FOUND]
          - errors[ERR_NONCONFORMANCE_EVENT_NOT_FOUND]
          - errors[ERR_CERTIFICATE_NOT_FOUND]
          - errors[ERR_LEDGER_ENTRY_NOT_FOUND]
          - errors[ERR_AUTOSHIP_RUN_NOT_FOUND]
          - validations[priority 4].existence
        distinguishing_aspect: "Fourteen reads against an empty database with one well-formed but unused UUID each return 404 with fourteen DISTINCT error_id values — a single generic ERR_NOT_FOUND for all of them fails this instance."
        test_recipe:
          setup:
            - "Empty database (no rows in any table); clock at 2026-08-01T00:00:00Z."
            - "The UUID 00000000-0000-4000-8000-00000000ffff is used for every read and exists in no table."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /sharps/state-rules/00000000-0000-4000-8000-00000000ffff"
              payload: {}
              as: ProgramAdmin
              captures: { e_sr: $.data.error_id }
            - call: "GET /sharps/packaging-specs/00000000-0000-4000-8000-00000000ffff"
              payload: {}
              as: ProgramAdmin
              captures: { e_ps: $.data.error_id }
            - call: "GET /sharps/treatment-facilities/00000000-0000-4000-8000-00000000ffff"
              payload: {}
              as: ProgramAdmin
              captures: { e_tf: $.data.error_id }
            - call: "GET /sharps/sponsors/00000000-0000-4000-8000-00000000ffff"
              payload: {}
              as: ProgramAdmin
              captures: { e_sp: $.data.error_id }
            - call: "GET /sharps/programs/00000000-0000-4000-8000-00000000ffff"
              payload: {}
              as: ProgramAdmin
              captures: { e_pg: $.data.error_id }
            - call: "GET /sharps/patients/00000000-0000-4000-8000-00000000ffff"
              payload: {}
              as: ProgramAdmin
              captures: { e_pt: $.data.error_id }
            - call: "GET /sharps/enrollments/00000000-0000-4000-8000-00000000ffff"
              payload: {}
              as: ProgramAdmin
              captures: { e_en: $.data.error_id }
            - call: "GET /sharps/kits/00000000-0000-4000-8000-00000000ffff"
              payload: {}
              as: ProgramAdmin
              captures: { e_kt: $.data.error_id }
            - call: "GET /sharps/return-labels/00000000-0000-4000-8000-00000000ffff"
              payload: {}
              as: ProgramAdmin
              captures: { e_lb: $.data.error_id }
            - call: "GET /sharps/shipments/00000000-0000-4000-8000-00000000ffff"
              payload: {}
              as: ProgramAdmin
              captures: { e_sh: $.data.error_id }
            - call: "GET /sharps/non-conformance-events/00000000-0000-4000-8000-00000000ffff"
              payload: {}
              as: ProgramAdmin
              captures: { e_nc: $.data.error_id }
            - call: "GET /sharps/destruction-certificates/00000000-0000-4000-8000-00000000ffff"
              payload: {}
              as: ProgramAdmin
              captures: { e_ct: $.data.error_id }
            - call: "GET /sharps/ledger-entries/00000000-0000-4000-8000-00000000ffff"
              payload: {}
              as: ProgramAdmin
              captures: { e_le: $.data.error_id }
            - call: "GET /sharps/auto-ship-runs/00000000-0000-4000-8000-00000000ffff"
              payload: {}
              as: ProgramAdmin
              captures: { e_ar: $.data.error_id }
          assert:
            - "every one of the fourteen reads returns HTTP status == 404 with response_type == \"error\""
            - "${e_sr} == \"ERR_STATE_RULE_NOT_FOUND\""
            - "${e_ps} == \"ERR_PACKAGING_SPEC_NOT_FOUND\""
            - "${e_tf} == \"ERR_FACILITY_NOT_FOUND\""
            - "${e_sp} == \"ERR_SPONSOR_NOT_FOUND\""
            - "${e_pg} == \"ERR_PROGRAM_NOT_FOUND\""
            - "${e_pt} == \"ERR_PATIENT_NOT_FOUND\""
            - "${e_en} == \"ERR_ENROLLMENT_NOT_FOUND\""
            - "${e_kt} == \"ERR_KIT_NOT_FOUND\""
            - "${e_lb} == \"ERR_LABEL_NOT_FOUND\""
            - "${e_sh} == \"ERR_SHIPMENT_NOT_FOUND\""
            - "${e_nc} == \"ERR_NONCONFORMANCE_EVENT_NOT_FOUND\""
            - "${e_ct} == \"ERR_CERTIFICATE_NOT_FOUND\""
            - "${e_le} == \"ERR_LEDGER_ENTRY_NOT_FOUND\""
            - "${e_ar} == \"ERR_AUTOSHIP_RUN_NOT_FOUND\""
            - "the fourteen captured error_id values are pairwise distinct"

      - name: creations_missing_required_input_fields_return_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority 3].business_constraint
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST /sharps/patients
          - endpoints.POST /sharps/treatment-facilities
          - endpoints.POST /sharps/sponsors/{id}/programs
          - endpoints.POST /sharps/enrollments
          - endpoints.POST /sharps/enrollments/{id}/kits
        distinguishing_aspect: "Each of five writes omits exactly one field that §1.5 declares WITHOUT a `?` suffix and gets 400 ERR_INVALID_REQUEST — including the OCC input expected_enrollment_version, whose absence is a 400 shape error at priority 3, never a 412 stale-version error at priority 13."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; CA rule, MANUFACTURER sponsor with program (500000 ceiling / 5000 per-kit allowance), patient Dana ELIGIBLE, enrollment ACTIVE after sponsor approval."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "Northwind Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@northwind.example" }
              as: ProgramAdmin
              captures: { sp_nw: $.data.id }
            - call: "POST /sharps/sponsors/${sp_nw}/programs"
              payload: { program_code: "NW-2026", funding_ceiling_cents: 500000, per_kit_allowance_cents: 5000 }
              as: ProgramAdmin
              captures: { prog_nw: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Dana Reyes", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "dana@example.com" }
              as: ProgramAdmin
              captures: { pat_d: $.data.id }
            - call: "POST /sharps/patients/${pat_d}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_d}", sponsorship_program_id: "${prog_nw}", cadence_days: 30, kits_authorized: 3 }
              as: ProgramAdmin
              captures: { enr_d: $.data.id }
            - call: "POST /sharps/enrollments/${enr_d}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr_d}/sponsor-decision"
              payload: { decision: "APPROVE" }
              as: SponsorRepresentative
              as_user_id: "${sp_nw}"
              captures: { enr_v1: $.data.version }
          trigger:
            - call: "POST /sharps/patients"
              payload: { full_name: "Ray Okafor", state_rule_id: "${sr_ca}", weekly_sharps_count: 12, contact_email: "ray@example.com" }
              as: ProgramAdmin
              captures: { e_pat: $.data.error_id }
            - call: "POST /sharps/treatment-facilities"
              payload: { name: "Valley Sharps Treatment", state_rule_id: "${sr_ca}", permit_number: "CA-TF-0001", accepted_hazard_classes: ["UN3291_SHARPS_ONLY"] }
              as: ProgramAdmin
              captures: { e_fac: $.data.error_id }
            - call: "POST /sharps/sponsors/${sp_nw}/programs"
              payload: { program_code: "NW-2027", funding_ceiling_cents: 200000 }
              as: ProgramAdmin
              captures: { e_prg: $.data.error_id }
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_d}", sponsorship_program_id: "${prog_nw}", kits_authorized: 3 }
              as: ProgramAdmin
              captures: { e_enr: $.data.error_id }
            - call: "POST /sharps/enrollments/${enr_d}/kits"
              payload: {}
              as: ProgramAdmin
              captures: { e_kit: $.data.error_id }
          assert:
            - "all five writes return HTTP status == 400 with response_type == \"error\""
            - "${e_pat} == \"ERR_INVALID_REQUEST\" (therapy_type omitted)"
            - "${e_fac} == \"ERR_INVALID_REQUEST\" (daily_intake_capacity_units omitted)"
            - "${e_prg} == \"ERR_INVALID_REQUEST\" (per_kit_allowance_cents omitted)"
            - "${e_enr} == \"ERR_INVALID_REQUEST\" (cadence_days omitted)"
            - "${e_kit} == \"ERR_INVALID_REQUEST\" and NOT \"ERR_STALE_ENROLLMENT_VERSION\" (expected_enrollment_version omitted)"
            - "GET /sharps/patients returns total_count == 1"
            - "GET /sharps/treatment-facilities returns total_count == 0"
            - "GET /sharps/sponsors/${sp_nw}/programs returns total_count == 1"
            - "GET /sharps/kits?enrollment_id=${enr_d} returns total_count == 0"
            - "Enrollment.${enr_d}.version == ${enr_v1} and Enrollment.${enr_d}.kits_issued == 0"
            - "SponsorshipProgram.${prog_nw}.reserved_cents == 0 and SponsorshipProgram.${prog_nw}.available_cents == 500000"

      - name: omitted_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.StateSharpsRule.fields.requires_state_manifest
          - entities.StateSharpsRule.fields.notification_deadline_hours
          - entities.PackagingSpec.fields.requires_absorbent
          - entities.PackagingSpec.fields.status
          - entities.TreatmentFacility.fields.status
          - entities.Sponsor.fields.status
          - entities.Enrollment.fields.requested_container_size
          - entities.Enrollment.fields.next_autoship_due_date
        distinguishing_aspect: "Five creations omit every `?`-suffixed input and land on the exact §1.1 defaults (false / 72 / false / ACTIVE / ACTIVE / ACTIVE / null), so a default of 0, an empty string, or a rejected request all fail this instance."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; CA rule, sponsor, program and an ELIGIBLE patient already seeded so an enrollment can be created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3, requires_state_manifest: false, notification_deadline_hours: 72 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "Northwind Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@northwind.example", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { sp_nw: $.data.id }
            - call: "POST /sharps/sponsors/${sp_nw}/programs"
              payload: { program_code: "NW-2026", funding_ceiling_cents: 500000, per_kit_allowance_cents: 5000 }
              as: ProgramAdmin
              captures: { prog_nw: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Dana Reyes", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "dana@example.com" }
              as: ProgramAdmin
              captures: { pat_d: $.data.id }
            - call: "POST /sharps/patients/${pat_d}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
          trigger:
            - call: "POST /sharps/state-rules"
              payload: { state_code: "OR", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 11.4, certificate_retention_years: 3 }
              as: ProgramAdmin
              captures: { sr_or: $.data.id }
            - call: "POST /sharps/packaging-specs"
              payload: { spec_code: "PS-D", un_specification_code: "UN 4G/X7.5/S/26", postal_service: "USPS_PARCEL_SELECT_MAILBACK", hazard_class: "UN3291_SHARPS_ONLY", max_gross_weight_grams: 7500, allowed_container_sizes: ["ONE_QUART", "TWO_GALLON"] }
              as: ProgramAdmin
              captures: { ps_d: $.data.id }
            - call: "POST /sharps/treatment-facilities"
              payload: { name: "Valley Sharps Treatment", state_rule_id: "${sr_ca}", permit_number: "CA-TF-0001", accepted_hazard_classes: ["UN3291_SHARPS_ONLY"], daily_intake_capacity_units: 1000 }
              as: ProgramAdmin
              captures: { tf_ca: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "Cascade Health Plan", sponsor_type: "HEALTH_PLAN", contact_email: "sharps@cascade.example" }
              as: ProgramAdmin
              captures: { sp_ch: $.data.id }
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_d}", sponsorship_program_id: "${prog_nw}", cadence_days: 30, kits_authorized: 3 }
              as: ProgramAdmin
              captures: { enr_d: $.data.id }
          assert:
            - "StateSharpsRule.${sr_or}.requires_state_manifest == false"
            - "StateSharpsRule.${sr_or}.notification_deadline_hours == 72"
            - "PackagingSpec.${ps_d}.requires_absorbent == false"
            - "PackagingSpec.${ps_d}.status == \"ACTIVE\""
            - "TreatmentFacility.${tf_ca}.status == \"ACTIVE\""
            - "TreatmentFacility.${tf_ca}.pending_intake_units == 0"
            - "TreatmentFacility.${tf_ca}.destroyed_units_total == 0"
            - "TreatmentFacility.${tf_ca}.certificates_issued_count == 0"
            - "Sponsor.${sp_ch}.status == \"ACTIVE\""
            - "Enrollment.${enr_d}.requested_container_size == null"
            - "Enrollment.${enr_d}.status == \"DRAFT\""
            - "Enrollment.${enr_d}.kits_issued == 0"
            - "Enrollment.${enr_d}.next_autoship_due_date == null"
            - "Enrollment.${enr_d}.activated_at == null"
            - "Enrollment.${enr_d}.version == 1"

      - name: kit_issuance_computes_sizing_cost_and_seal_deadline_fields
        claim_type: computed_fields
        grounds:
          - entities.Kit.fields.required_units
          - entities.Kit.fields.container_size
          - entities.Kit.fields.capacity_units
          - entities.Kit.fields.volume_liters
          - entities.Kit.fields.provisional_cost_cents
          - entities.Kit.fields.issued_at
          - entities.Kit.fields.seal_deadline_date
          - calculations.container_size_selection
          - calculations.kit_cost_provisional
        distinguishing_aspect: "The kit request body carries ONLY expected_enrollment_version, yet seven computed fields come back fully populated: required_units 99 (single ceiling of 20*1*30*115/700 = 98.571), ONE_QUART at 100 capacity units / 0.9 L, provisional_cost_cents 1465 (1450 catalog + 15 estimated transport), and seal_deadline_date 2026-09-14 (issue date + 30 cadence + 14 grace)."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "CA rule: mail-back permitted, 30.3 L volume cap, 3-year retention."
            - "MANUFACTURER sponsor with program: 500000-cent ceiling, 5000-cent per-kit allowance."
            - "Patient Dana Reyes, CA, INSULIN_PEN_NEEDLES (UNITS_PER_ITEM 1), 20 sharps/week, ELIGIBLE."
