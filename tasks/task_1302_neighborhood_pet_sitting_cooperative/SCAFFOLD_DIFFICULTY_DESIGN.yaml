        grounds:
          - state_machines.SittingRequest.transitions.OPEN_to_CANCELLED
          - state_machines.SittingRequest.transitions.OPEN_to_EXPIRED
          - state_machines.SittingRequest.transitions.IN_PROGRESS_to_COMPLETED
