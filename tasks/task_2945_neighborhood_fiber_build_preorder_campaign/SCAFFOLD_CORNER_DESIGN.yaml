              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /pole-attachment-requests"
              payload: { build_zone_id: "${z1}", utility_owner: "Aurora Power", pole_count: 12 }
              as: ProgramManager
              captures: { pr1: $.data.id }
