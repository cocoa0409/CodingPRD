              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /film-sales/films/${film_id}/agency-agreements"
              payload: { commission_pct: 0.10, expense_cap_usd: 75000.00, term_months: 24, term_start_date: "2026-08-01T00:00:00Z" }
              as: HeadOfSales
              captures: { agr_id: $.data.id }
            - call: "POST /film-sales/agency-agreements/${agr_id}/state"
              payload: { to_status: "EXECUTED" }
              as: HeadOfSales
              as_user_id: "hos-signer-1"
            - call: "POST /film-sales/films/${film_id}/state"
              payload: { to_status: "PACKAGING" }
              as: PlatformAdmin
            - call: "POST /film-sales/markets"
              payload: { name: "EFM Berlin", city: "Berlin", start_date: "2027-02-11T00:00:00Z", end_date: "2027-02-17T00:00:00Z", screening_room_count: 3, meeting_table_count: 4 }
              as: PlatformAdmin
              captures: { market_id: $.data.id }
            - call: "POST /film-sales/markets/${market_id}/state"
              payload: { to_status: "OPEN" }
              as: PlatformAdmin
          trigger:
            - call: "POST /film-sales/screening-slots"
              payload: { market_id: "${market_id}", film_id: "${film_id}", room_number: 1, start_at: "2027-02-10T09:00:00Z", end_at: "2027-02-10T11:00:00Z", slot_type: "BUYER_SCREENING", capacity: 60 }
              as: SalesAgent
              captures: { err_early: $.data.error_id }
            - call: "POST /film-sales/screening-slots"
              payload: { market_id: "${market_id}", film_id: "${film_id}", room_number: 1, start_at: "2027-02-16T23:00:00Z", end_at: "2027-02-17T01:00:00Z", slot_type: "BUYER_SCREENING", capacity: 60 }
              as: SalesAgent
              captures: { err_late: $.data.error_id }
            - call: "POST /film-sales/screening-slots"
              payload: { market_id: "${market_id}", film_id: "${film_id}", room_number: 1, start_at: "2027-02-11T00:00:00Z", end_at: "2027-02-11T02:00:00Z", slot_type: "BUYER_SCREENING", capacity: 60 }
              as: SalesAgent
              captures: { slot_id: $.data.id }
          assert:
            - "${err_early} == ERR_OUTSIDE_MARKET_WINDOW at HTTP 422"
            - "${err_late} == ERR_OUTSIDE_MARKET_WINDOW at HTTP 422 — end_at one hour past end_date is enough"
            - "the boundary-hugging window returns HTTP 201 with ScreeningSlot.${slot_id}.status == HELD"
            - "exactly one ScreeningSlot row exists at the end"

