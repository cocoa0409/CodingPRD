              as: BuilderRep
              as_user_id: "${b10}"
              captures: { h10: $.data.id }
            - call: "POST /ratings"
              payload: { home_id: "${h10}", rater_id: "${r10}" }
              as: CertifiedRater
              as_user_id: "${r10}"
              captures: { rt10: $.data.id }
            - call: "POST /inspections"
              payload: { rating_id: "${rt10}", inspector_id: "${fi10}", checkpoint: "FINAL", scheduled_start_utc: "2026-08-12T09:00:00Z", scheduled_end_utc: "2026-08-12T11:00:00Z", air_handler_installed: true }
              as: FieldInspector
              as_user_id: "${fi10}"
              captures: { in10: $.data.id }
            - call: "POST /ratings/${rt10}/void"
              payload: { reason: "Plan mismatch discovered during file audit" }
              as: RatingProviderAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
