              captures: { case_ca_id: $.data.id }
            - call: "GET /vendor-access/surgical-cases/${case_ca_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { case_ca_ver: $.data.version }
            - call: "POST /vendor-access/loaner-sets"
              payload: { surgical_case_id: "${case_ca_id}", approved_product_id: "${ap_pr_id}", tray_count: 4, reprocessing_complexity: "SIMPLE", expected_case_version: "${case_ca_ver}" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ls_ca_id: $.data.id }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_sp_id}", case_number: "CASE-CB", procedure_name: "Afternoon Reaming Case", scheduled_start_utc: "2026-09-20T16:00:00Z", scheduled_end_utc: "2026-09-20T18:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_cb_id: $.data.id }
            - call: "GET /vendor-access/surgical-cases/${case_cb_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { case_cb_ver: $.data.version }
          trigger:
            - call: "POST /vendor-access/loaner-sets"
              payload: { surgical_case_id: "${case_cb_id}", approved_product_id: "${ap_pr_id}", tray_count: 4, reprocessing_complexity: "SIMPLE", expected_case_version: "${case_cb_ver}" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { spd_error_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and error_id == ERR_SPD_BAY_CAPACITY_EXCEEDED"
            - "the response is NOT ERR_STALE_CASE_VERSION (412): expected_case_version matched, so the capacity check is what refused the write"
            - "LoanerSet.${ls_ca_id}.required_delivery_deadline_utc == 2026-09-20T04:00:00Z"
            - "LoanerSet.${ls_ca_id}.spd_occupation_start_utc == 2026-09-20T04:00:00Z"
            - "LoanerSet.${ls_ca_id}.spd_occupation_end_utc == 2026-09-20T10:00:00Z"
            - "LoanerSet.${ls_ca_id}.status == EXPECTED"
            - "zero LoanerSet rows exist whose surgical_case_id == ${case_cb_id}"
            - "SurgicalCase.${case_cb_id}.version == ${case_cb_ver} — the refused write did not bump the parent version"
            - "SurgicalCase.${case_cb_id}.implant_readiness_status == NOT_APPLICABLE"

  - rule_id: compensating_invariant
    instances:

      - name: revocation_conserves_authorization_counters_against_recount
        grounds:
          - state_machines.CaseRepAuthorization.APPROVED_to_REVOKED
          - calculations.vendor_access_quota_admission
          - calculations.case_vendor_coverage_status
          - entities.Vendor.fields.authorizations_used_epoch
          - entities.VendorRep.fields.open_authorization_count
          - entities.SurgicalCase.fields.approved_rep_count
          - entities.SurgicalCase.fields.revoked_authorization_count
          - endpoints.GET_/vendor-access/case-rep-authorizations
        distinguishing_aspect: |
          The conserved quantity is a COUNT that lives in three denormalised places at once. After one
          manual revocation the invariant
          Vendor.authorizations_used_epoch == count(APPROVED rows with epoch_number == last_sweep_epoch)
          must still hold, and it must hold against an independent recount through
          GET /vendor-access/case-rep-authorizations?status=APPROVED. The revocation is a compensating
          operation: it undoes exactly the three increments the approval made and adds one to
          revoked_authorization_count, without drifting the sibling case's counters.
        test_recipe:
          setup:
            - "Facility IV-17 and Vendor INVAR exist; rep Ken Sato is CREDENTIALED with four credentials VERIFIED to 2027-07-01T00:00:00Z."
            - "Two non-implant cases on consecutive days, 2026-09-05T08:00:00Z-10:00:00Z and 2026-09-06T08:00:00Z-10:00:00Z, produce disjoint badge windows."
            - "Both authorizations are APPROVED at the 2026-08-01T00:00:00Z default clock, so both carry epoch_number 0 and Vendor.authorizations_used_epoch reads 2."
            - "No sweep runs, so last_sweep_epoch stays 0 and every approved row remains in the current epoch."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Inverness Valley Hospital", code: "IV-17", spd_turnaround_hours: 6, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_iv_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Invariant Surgical Supply Co", vendor_code: "INVAR" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_invar_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_invar_id}", full_name: "Ken Sato", email: "ken.sato@invariant.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_ken_id: $.data.id }
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_ken_id}", credential_type: "IMMUNIZATION_INFLUENZA", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "IMM-KEN-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_ken_flu_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_ken_flu_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_ken_id}", credential_type: "TRAINING_BLOODBORNE_PATHOGENS", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "BBP-KEN-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_ken_bbp_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_ken_bbp_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_ken_id}", credential_type: "BACKGROUND_CHECK", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "BGC-KEN-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_ken_bgc_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_ken_bgc_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_ken_id}", credential_type: "COI_GIFT_ATTESTATION", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "COI-KEN-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_ken_coi_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_ken_coi_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_iv_id}", case_number: "CASE-11001", procedure_name: "Shoulder Scope Day One", scheduled_start_utc: "2026-09-05T08:00:00Z", scheduled_end_utc: "2026-09-05T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_11001_id: $.data.id }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_iv_id}", case_number: "CASE-11002", procedure_name: "Shoulder Scope Day Two", scheduled_start_utc: "2026-09-06T08:00:00Z", scheduled_end_utc: "2026-09-06T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_11002_id: $.data.id }
            - call: "POST /vendor-access/case-rep-authorizations"
              payload: { surgical_case_id: "${case_11001_id}", vendor_rep_id: "${rep_ken_id}", requested_role: "TECHNICAL_SUPPORT" }
              as: VendorAdmin
              as_user_id: "${v_invar_id}"
              captures: { auth_11001_id: $.data.id }
            - call: "POST /vendor-access/case-rep-authorizations/${auth_11001_id}/decide"
              payload: { decision: "APPROVE" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
            - call: "POST /vendor-access/case-rep-authorizations"
              payload: { surgical_case_id: "${case_11002_id}", vendor_rep_id: "${rep_ken_id}", requested_role: "TECHNICAL_SUPPORT" }
              as: VendorAdmin
              as_user_id: "${v_invar_id}"
              captures: { auth_11002_id: $.data.id }
            - call: "POST /vendor-access/case-rep-authorizations/${auth_11002_id}/decide"
              payload: { decision: "APPROVE" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
          trigger:
            - call: "POST /vendor-access/case-rep-authorizations/${auth_11001_id}/revoke"
              payload: { revoked_reason: "MANUAL" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
          assert:
            - "CaseRepAuthorization.${auth_11001_id}.status == REVOKED and revoked_reason == MANUAL"
            - "CaseRepAuthorization.${auth_11002_id}.status == APPROVED and epoch_number == 0"
            - "Vendor.${v_invar_id}.authorizations_used_epoch == 1"
            - "Vendor.${v_invar_id}.last_sweep_epoch == 0"
            - "the recount invariant holds: GET /vendor-access/case-rep-authorizations?vendor_rep_id=${rep_ken_id}&status=APPROVED returns total_count 1, exactly Vendor.${v_invar_id}.authorizations_used_epoch"
            - "VendorRep.${rep_ken_id}.open_authorization_count == 1"
            - "SurgicalCase.${case_11001_id}.approved_rep_count == 0"
            - "SurgicalCase.${case_11001_id}.revoked_authorization_count == 1"
            - "SurgicalCase.${case_11001_id}.vendor_coverage_status == NOT_REQUIRED (non-implant case with zero approved authorizations)"
            - "SurgicalCase.${case_11002_id}.approved_rep_count == 1"
            - "SurgicalCase.${case_11002_id}.revoked_authorization_count == 0"
            - "SurgicalCase.${case_11002_id}.vendor_coverage_status == COVERED — the sibling case did not drift"
            - "Vendor.${v_invar_id}.adjudicated_compliance_score == 100"

      - name: fee_reversal_conserves_vendor_ledger_against_resum
        grounds:
          - state_machines.LoanerSet.DELIVERED_LATE_to_DELIVERED_ON_TIME
          - state_machines.SurgicalCase.SCHEDULED_to_RESCHEDULED
          - calculations.loaner_late_fee
          - calculations.vendor_compliance_score
          - entities.LoanerSet.fields.fee_status
          - entities.LoanerSet.fields.assessed_late_fee_cents
          - entities.Vendor.fields.late_fee_balance_cents
        distinguishing_aspect: |
          The conserved quantity is MONEY rather than a count, and the compensation is driven from a
          different aggregate (a case reschedule, not an authorization revoke). Two identical late sets
          each assess 1125 cents, so the ledger reads 2250; reversing exactly one of them must leave
          late_fee_balance_cents == 1125 == the re-sum over rows with fee_status == ASSESSED. The
          reversed row must RETAIN assessed_late_fee_cents 1125 as history and its pinned-basis late
          minutes, so a naive "recompute the balance as the sum of assessed_late_fee_cents" would
          overstate the ledger by 1125.
        test_recipe:
          setup:
            - "Facility LG-18 has spd_turnaround_hours 8 and spd_bay_count 3."
            - "Vendor LEDGR has one approved NON-implant product, so lead_hours = 8 + 6 + 1 = 15 for a 9-tray COMPLEX set with no implant floor."
            - "Case CASE-11101 runs 2026-09-12T14:00:00Z to 18:00:00Z; its 9-tray COMPLEX set has a deadline of 2026-09-11T23:00:00Z and is received at 2026-09-11T23:37:00Z: 37 late minutes, fee 1125 cents, fee_status ASSESSED."
            - "Case CASE-11102 runs 2026-09-13T14:00:00Z to 18:00:00Z; its 9-tray COMPLEX set has a deadline of 2026-09-12T23:00:00Z and is received at 2026-09-12T23:37:00Z: the same 37 minutes and the same 1125-cent fee."
            - "Vendor.late_fee_balance_cents therefore reads 2250 before the trigger, still below FEE_HOLD_THRESHOLD_CENTS."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Ledgerport Surgical Hospital", code: "LG-18", spd_turnaround_hours: 8, spd_bay_count: 3 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_lg_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Ledger Medical Instruments Ltd", vendor_code: "LEDGR" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_ledgr_id: $.data.id, v_ledgr_ver0: $.data.version }
            - call: "POST /vendor-access/product-introduction-requests"
              payload: { vendor_id: "${v_ledgr_id}", facility_id: "${f_lg_id}", product_name: "Universal Retractor Frame", product_catalog_number: "UR-500", manufacturer: "Ledger Medical", is_implant: false, unit_cost_cents: 150000, expected_vendor_version: "${v_ledgr_ver0}" }
              as: VendorAdmin
              as_user_id: "${v_ledgr_id}"
              captures: { pir_ur_id: $.data.id }
            - call: "POST /vendor-access/product-introduction-requests/${pir_ur_id}/submit"
              payload: {}
              as: VendorAdmin
              as_user_id: "${v_ledgr_id}"
            - call: "POST /vendor-access/product-introduction-requests/${pir_ur_id}/clinical-review"
              payload: { decision: "ENDORSE" }
              as: ClinicalSponsor
              as_user_id: "user_sponsor_1"
            - call: "POST /vendor-access/product-introduction-requests/${pir_ur_id}/value-analysis-decision"
              payload: { decision: "APPROVE" }
              as: ValueAnalysisApprover
              as_user_id: "user_vac_1"
            - call: "GET /vendor-access/approved-products?product_introduction_request_id=${pir_ur_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ap_ur_id: "$.data[0].id" }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_lg_id}", case_number: "CASE-11101", procedure_name: "Open Reduction Day One", scheduled_start_utc: "2026-09-12T14:00:00Z", scheduled_end_utc: "2026-09-12T18:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_11101_id: $.data.id }
            - call: "GET /vendor-access/surgical-cases/${case_11101_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { case_11101_ver: $.data.version }
            - call: "POST /vendor-access/loaner-sets"
              payload: { surgical_case_id: "${case_11101_id}", approved_product_id: "${ap_ur_id}", tray_count: 9, reprocessing_complexity: "COMPLEX", expected_case_version: "${case_11101_ver}" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ls_11101_id: $.data.id }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_lg_id}", case_number: "CASE-11102", procedure_name: "Open Reduction Day Two", scheduled_start_utc: "2026-09-13T14:00:00Z", scheduled_end_utc: "2026-09-13T18:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_11102_id: $.data.id }
            - call: "GET /vendor-access/surgical-cases/${case_11102_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { case_11102_ver: $.data.version }
            - call: "POST /vendor-access/loaner-sets"
              payload: { surgical_case_id: "${case_11102_id}", approved_product_id: "${ap_ur_id}", tray_count: 9, reprocessing_complexity: "COMPLEX", expected_case_version: "${case_11102_ver}" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ls_11102_id: $.data.id }
            - call: "POST /vendor-access/loaner-sets/${ls_11101_id}/receive"
              payload: { delivered_at_utc: "2026-09-11T23:37:00Z" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
            - call: "POST /vendor-access/loaner-sets/${ls_11102_id}/receive"
              payload: { delivered_at_utc: "2026-09-12T23:37:00Z" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
          trigger:
            - call: "POST /vendor-access/surgical-cases/${case_11101_id}/reschedule"
              payload: { new_scheduled_start_utc: "2026-09-12T18:00:00Z", new_scheduled_end_utc: "2026-09-12T22:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
          assert:
            - "SurgicalCase.${case_11101_id}.status == RESCHEDULED and reschedule_count == 1"
            - "SurgicalCase.${case_11101_id}.original_scheduled_start_utc == 2026-09-12T14:00:00Z"
            - "LoanerSet.${ls_11101_id}.required_delivery_deadline_utc == 2026-09-12T03:00:00Z"
            - "LoanerSet.${ls_11101_id}.pinned_deadline_utc == 2026-09-11T23:00:00Z"
            - "LoanerSet.${ls_11101_id}.late_minutes_current_basis == 0"
            - "LoanerSet.${ls_11101_id}.late_minutes_pinned_basis == 37"
            - "LoanerSet.${ls_11101_id}.status == DELIVERED_ON_TIME"
            - "LoanerSet.${ls_11101_id}.fee_status == REVERSED"
            - "LoanerSet.${ls_11101_id}.assessed_late_fee_cents == 1125 — retained as history, not zeroed"
            - "LoanerSet.${ls_11102_id}.status == DELIVERED_LATE, fee_status == ASSESSED, assessed_late_fee_cents == 1125, late_minutes_current_basis == 37"
            - "Vendor.${v_ledgr_id}.late_fee_balance_cents == 1125"
            - "the re-sum invariant holds: the sum of assessed_late_fee_cents over this vendor's LoanerSet rows with fee_status == ASSESSED is 1125, exactly Vendor.${v_ledgr_id}.late_fee_balance_cents, while the naive sum over ALL rows would be 2250"
            - "Vendor.${v_ledgr_id}.adjudicated_compliance_score == 95 (only ${ls_11102_id} still counts as a late delivery; the REVERSED row drops out)"
            - "SurgicalCase.${case_11101_id}.implant_readiness_status == NOT_APPLICABLE"
