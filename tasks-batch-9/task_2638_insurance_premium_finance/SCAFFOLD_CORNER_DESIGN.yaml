            - "${pr_parent_error} == 'ERR_AGREEMENT_NOT_FOUND' with HTTP 404 — the nested parent is resolved before the body is validated"
            - "${pr_fk_error} == 'ERR_INSURER_NOT_FOUND' with HTTP 404 — a real parent plus a dangling body FK is still an integrity failure, not a 422"
            - "${pr_count1} == 0 — neither rejection incremented policy_count or created a FinancedPolicy"
