              as: CorporateSecretary
              captures: { m: $.data.id }
            - call: "POST /meetings/${m}/send_notices"
              as: CorporateSecretary
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T11:00:00Z" }
              as: CorporateSecretary
            - call: "POST /meetings/${m}/convene"
              as: BoardChair
              as_user_id: "${d1}"
