            - "After the NM entry qualifies: GA == 50.0, NM == 50.0 (120000000 / 120000000 of 240000000) — the sibling re-derives too"
      - name: calc_tier_boundary_covered_by_difficulty
        claim_type: correct_result
        grounds:
          - "calculations.credit_amount"
        excluded_because:
          difficulty_instance: tiered_credit_rate_threshold_straddle
          rationale: "Tier boundary semantics (threshold-1 vs threshold) are asserted with literals in the named §1.8 instance."
      - name: calc_uplift_rounding_covered_by_difficulty
        claim_type: precision
        grounds:
          - "calculations.qualified_spend_totals"
        excluded_because:
          difficulty_instance: per_entry_uplift_rounding_order
          rationale: "Pinned per-entry rounding order asserted as 208-vs-207 divergence in the named §1.8 instance."
      - name: calc_atl_cap_order_covered_by_difficulty
