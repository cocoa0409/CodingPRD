# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of testable claims not in §1.8)
# Waxing Studio Membership. Default clock = 2026-01-01T00:00:00Z.
# Sections + claim_types per references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_location_returns_201_all_fields
        claim_type: Creation
        grounds: [entities.Location, endpoints]
        distinguishing_aspect: "POST /studio/locations with required fields -> 201, version==1, defaults applied (deposit_required_cents==1000, no_show_fee_cents==2500)."
        test_recipe:
          setup: ["Empty DB; clock at default."]
          setup_api_calls: []
          trigger:
            - call: "POST /studio/locations"
              payload: { name: "Mall", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id, ver: $.data.version }
          assert:
            - "response_type == object"
            - "Location.${loc_id}.version == 1"
            - "Location.${loc_id}.deposit_required_cents == 1000"
            - "Location.${loc_id}.no_show_fee_cents == 2500"
            - "Location.${loc_id}.open_minute_of_day == 540"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /studio/members/{bogus} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /studio/members/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_member_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Member.fields.email, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /studio/members without email -> ERR_INVALID_REQUEST (422); email has source:input and no default."
        test_recipe:
          setup: ["One location."]
          setup_api_calls:
            - call: "POST /studio/locations"
              payload: { name: "L", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "NoEmail" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: service_type_default_credit_cost_applied
        claim_type: Defaults
        grounds: [entities.ServiceType.fields.credit_cost, entities.ServiceType.fields.buffer_minutes]
        distinguishing_aspect: "POST /studio/service-types omitting credit_cost and buffer_minutes -> credit_cost defaults to 1, buffer_minutes to 5, intro_eligible to false, active to true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studio/service-types"
              payload: { name: "Quick Brow", duration_minutes: 15, list_price_cents: 1500 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
          assert:
            - "ServiceType.${svc_id}.credit_cost == 1"
            - "ServiceType.${svc_id}.buffer_minutes == 5"
            - "ServiceType.${svc_id}.intro_eligible == false"
            - "ServiceType.${svc_id}.active == true"

      - name: member_computed_fields_initialized_zero
        claim_type: Computed Fields
        grounds: [entities.Member.fields.intro_used, entities.Member.fields.no_show_strike_count, entities.Member.fields.wallet_credit_cents]
        distinguishing_aspect: "A freshly registered member has intro_used==false, no_show_strike_count==0, wallet_credit_cents==0; any client-supplied values for these computed fields are ignored."
        test_recipe:
          setup: ["One location."]
          setup_api_calls:
            - call: "POST /studio/locations"
              payload: { name: "L2", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "Fresh", email: "fresh@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
          assert:
            - "Member.${mem_id}.intro_used == false"
            - "Member.${mem_id}.no_show_strike_count == 0"
            - "Member.${mem_id}.wallet_credit_cents == 0"

      - name: membership_invalid_tier_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Membership.fields.tier, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /studio/memberships with tier='GOLD' (not in {BASIC,PLUS,UNLIMITED}) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["One location + member."]
          setup_api_calls:
            - call: "POST /studio/locations"
              payload: { name: "L3", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "Tia", email: "tia2@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /studio/memberships"
              payload: { member_id: "${mem_id}", tier: "GOLD", monthly_credit_grant: 4, monthly_fee_cents: 6000 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: room_create_wrong_parent_location_not_found
        claim_type: Parent Relationships
        grounds: [entities.Room.fields.location_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /studio/rooms with a non-existent location_id -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studio/rooms"
              payload: { location_id: "00000000-0000-4000-8000-0000000000aa", label: "Ghost" }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND"

      - name: list_locations_pagination_envelope
        claim_type: Listing
        grounds: [entities.Location, endpoints]
        distinguishing_aspect: "GET /studio/locations returns response_type==array with total_count and has_more in meta/pagination after two locations created."
        test_recipe:
          setup: ["Two locations."]
          setup_api_calls:
            - call: "POST /studio/locations"
              payload: { name: "A", state_code: "CA" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "B", state_code: "TX" }
              as: StudioAdmin
          trigger:
            - call: "GET /studio/locations"
              payload: {}
              as: FrontDesk
          assert:
            - "response_type == array"
            - "total_count == 2"
            - "has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_membership_twice_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Membership.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED membership cancelled again -> ERR_INVALID_STATE; no further ledger entries written."
        test_recipe:
          setup: ["An ACTIVE membership then CANCELLED."]
          setup_api_calls:
            - call: "POST /studio/locations"
              payload: { name: "SMc", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "Sm", email: "smc@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/memberships"
              payload: { member_id: "${mem_id}", tier: "PLUS", monthly_credit_grant: 4, monthly_fee_cents: 6000 }
              as: FrontDesk
              captures: { mbr_id: $.data.id }
            - call: "POST /studio/memberships/${mbr_id}/activate"
              payload: {}
              as: FrontDesk
            - call: "POST /studio/memberships/${mbr_id}/cancel"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /studio/memberships/${mbr_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: activate_already_active_membership_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Membership.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating a membership already ACTIVE -> ERR_INVALID_STATE (initial-state guard PENDING violated)."
        test_recipe:
          setup: ["An ACTIVE membership."]
          setup_api_calls:
            - call: "POST /studio/locations"
              payload: { name: "SMa", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "Aa", email: "aa@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/memberships"
              payload: { member_id: "${mem_id}", tier: "PLUS", monthly_credit_grant: 4, monthly_fee_cents: 6000 }
              as: FrontDesk
              captures: { mbr_id: $.data.id }
            - call: "POST /studio/memberships/${mbr_id}/activate"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /studio/memberships/${mbr_id}/activate"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: complete_without_checkin_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Reservation.CHECKED_IN_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a BOOKED (never checked-in) reservation -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A WALK_IN reservation in BOOKED."]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "SMcomp", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "Q", duration_minutes: 30, list_price_cents: 2000 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "R" }
              as: StudioAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "T", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "M", email: "smcomp@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T10:00:00Z", payment_method: "WALK_IN", expected_room_version: "${room_v}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /studio/reservations/${res_id}/complete"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: checkin_too_early_rejected
        claim_type: precondition_violation
        grounds: [state_machines.Reservation.BOOKED_to_CHECKED_IN, "validations[priority=15]", "errors[ERR_CHECKIN_TOO_EARLY]"]
        distinguishing_aspect: "Check-in attempted more than 30 minutes before start_utc -> ERR_CHECKIN_TOO_EARLY; at exactly start-30m it succeeds."
        test_recipe:
          setup: ["A WALK_IN reservation BOOKED for 2026-06-16T10:00:00Z; clock at 2026-06-16T09:00:00Z (60m before)."]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Early", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "QE", duration_minutes: 30, list_price_cents: 2000 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "RE" }
              as: StudioAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "TE", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "ME", email: "early@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T10:00:00Z", payment_method: "WALK_IN", expected_room_version: "${room_v}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T09:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /studio/reservations/${res_id}/check-in"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_CHECKIN_TOO_EARLY"

      - name: completed_reservation_is_terminal_cancel_locked
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Reservation.CHECKED_IN_to_COMPLETED, state_machines.Reservation.BOOKED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED reservation cannot be cancelled (COMPLETED is terminal on the booking axis) -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A WALK_IN reservation completed."]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Term", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "QT", duration_minutes: 30, list_price_cents: 2000 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "RT" }
              as: StudioAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "TT", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "MT", email: "term@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T10:00:00Z", payment_method: "WALK_IN", expected_room_version: "${room_v}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T09:45:00Z" }
              as: StudioAdmin
            - call: "POST /studio/reservations/${res_id}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /studio/reservations/${res_id}/complete"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /studio/reservations/${res_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: reservation_initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.Reservation.BOOKED_to_CHECKED_IN, entities.Reservation.fields.booking_status, entities.Reservation.fields.settlement_status]
        distinguishing_aspect: "A new CREDIT reservation starts booking_status==BOOKED and settlement_status==CREDIT_HELD (parallel axes initialized)."
        test_recipe:
          setup: ["ACTIVE PLUS membership 8 credits; clock 2026-06-15T12:00:00Z."]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Init", state_code: "CA" }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "QI", duration_minutes: 30, list_price_cents: 3000, credit_cost: 1 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "RI" }
              as: StudioAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "TI", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "MI", email: "init@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/memberships"
              payload: { member_id: "${mem_id}", tier: "PLUS", monthly_credit_grant: 8, monthly_fee_cents: 6000 }
              as: FrontDesk
              captures: { mbr_id: $.data.id }
            - call: "POST /studio/memberships/${mbr_id}/activate"
              payload: {}
              as: FrontDesk
              captures: { mbr_v: $.data.version }
          trigger:
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T10:00:00Z", payment_method: "CREDIT", membership_id: "${mbr_id}", expected_room_version: "${room_v}", expected_membership_version: "${mbr_v}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
          assert:
            - "Reservation.${res_id}.booking_status == BOOKED"
            - "Reservation.${res_id}.settlement_status == CREDIT_HELD"
            - "Reservation.${res_id}.credits_held == 1"

      - name: late_cancel_mints_strike_branch
        claim_type: side_effect_execution
        grounds: [state_machines.Reservation.BOOKED_to_CANCELLED, entities.NoShowStrike.fields.strike_kind, entities.Member.fields.no_show_strike_count]
        distinguishing_aspect: "Cancelling < 24h before start (late) mints a LATE_CANCEL strike, forfeits the deposit, and increments Member.no_show_strike_count to 1 (the branch divergent from timely cancel)."
        test_recipe:
          setup: ["A DEPOSIT reservation BOOKED for 2026-06-16T10:00:00Z; clock advanced to 2026-06-16T00:00:00Z (10h before, < 24h => late)."]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Late", state_code: "CA", deposit_required_cents: 1000 }
              as: StudioAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /studio/service-types"
              payload: { name: "QL", duration_minutes: 30, list_price_cents: 2000 }
              as: StudioAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /studio/rooms"
              payload: { location_id: "${loc_id}", label: "RL" }
              as: StudioAdmin
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /studio/technicians"
              payload: { location_id: "${loc_id}", full_name: "TL", certified_service_ids: ["${svc_id}"] }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /studio/members"
              payload: { home_location_id: "${loc_id}", full_name: "ML", email: "late@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /studio/reservations"
              payload: { member_id: "${mem_id}", location_id: "${loc_id}", room_id: "${room_id}", technician_id: "${tech_id}", service_type_id: "${svc_id}", start_utc: "2026-06-16T10:00:00Z", payment_method: "DEPOSIT", expected_room_version: "${room_v}" }
              as: FrontDesk
              as_user_id: "${mem_id}"
              captures: { res_id: $.data.id }
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /studio/reservations/${res_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
              captures: { sett: $.data.settlement_status }
          assert:
            - "Reservation.${res_id}.booking_status == CANCELLED"
            - "Reservation.${res_id}.settlement_status == FORFEITED"
            - "Member.${mem_id}.no_show_strike_count == 1"
            - "Member.${mem_id}.wallet_credit_cents == 0"

      - name: freeze_auto_expires_on_clock_advance
        claim_type: side_effect_execution
        grounds: [state_machines.Membership.FROZEN_to_ACTIVE, entities.Membership.fields.freeze_until_utc, entities.Membership.fields.credit_balance]
        distinguishing_aspect: "Advancing the clock past freeze_until_utc auto-transitions a FROZEN membership back to ACTIVE and restores parked credits (system actor on the FROZEN->ACTIVE transition)."
        test_recipe:
          setup: ["ACTIVE PLUS membership 4 credits, frozen for 5 days at 2026-06-15T12:00:00Z (freeze_until 2026-06-20T12:00:00Z)."]
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/locations"
              payload: { name: "Fz", state_code: "CA" }
              as: StudioAdmin
