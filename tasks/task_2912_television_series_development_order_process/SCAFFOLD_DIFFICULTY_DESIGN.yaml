  - rule_id: resource_temporal_overlap
    instances:
      - name: rights_holdback_closed_interval_and_quiet_buffer_are_both_inclusive
        grounds:
          - validations[priority=28]
          - entities.RightsCheck.fields.holdback_start_date
          - entities.RightsCheck.fields.holdback_end_date
          - entities.RightsCheck.fields.quiet_period_end_date
          - endpoints["POST /pitches/{id}/advance"]
        distinguishing_aspect: |
          Resource = the underlying IP; interval semantics = a CLOSED holdback window
          [holdback_start_date, holdback_end_date] extended by an inclusive 90-day
          quiet buffer through quiet_period_end_date. Three clock probes pin every
          edge: the last holdback day (2026-06-01) blocks, the last buffer day
          (2026-08-30) blocks, the first free day (2026-08-31) clears. This is the
          opposite convention from the sibling instance's half-open term.
        test_recipe:
          setup:
            - "one COVERED pitch with recommendation ADVANCE on an OPEN slate"
            - "one RightsCheck on it, chain_of_title_status CLEAN, holdback 2026-05-01..2026-06-01, so quiet_period_end_date is 2026-08-30 and result is CLEAR"
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Fennmore Literary", agency_code: "FEN", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /slates"
              payload: { platform: "BROADCAST", season_year: 2027, total_dev_budget_cents: 400000000, pattern_budget_per_episode_cents: 32000000, license_fee_cap_per_episode_cents: 30000000, max_deficit_per_episode_cents: 7000000, episode_capacity: 20, default_episode_count: 10, max_backend_points_bps: 2000, max_concurrent_pilot_shoots: 2 }
              as: PlatformAdmin
              captures: { slate_id: $.data.id }
            - call: "POST /pitches"
              payload: { agency_id: "${ag_id}", slate_id: "${slate_id}", title: "Salt Road", logline: "A caravan of smugglers crosses a border that no longer exists.", packaging_elements: [], underlying_ip_key: "IP-SALT-ROAD" }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { pitch_id: $.data.id }
            - call: "POST /pitches/${pitch_id}/rights-checks"
              payload: { underlying_ip_key: "IP-SALT-ROAD", chain_of_title_status: "CLEAN", holdback_start_date: "2026-05-01", holdback_end_date: "2026-06-01" }
              as: BusinessAffairs
              captures: { rc_id: $.data.id }
            - call: "POST /pitches/${pitch_id}/coverage"
              payload: { coverage_score: 81.0, recommendation: "ADVANCE" }
              as: DevelopmentExec
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pitches/${pitch_id}/advance"
              payload: {}
              as: DevelopmentExec
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pitches/${pitch_id}/advance"
              payload: {}
              as: DevelopmentExec
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pitches/${pitch_id}/advance"
              payload: {}
              as: DevelopmentExec
              captures: { proj_id: $.data.id }
          assert:
            - "RightsCheck.${rc_id}.quiet_period_end_date == 2026-08-30 and result == CLEAR"
            - "at clock 2026-06-01 (the inclusive last holdback day) advance returns ERR_RIGHTS_HOLDBACK_CONFLICT with HTTP 422"
            - "at clock 2026-08-30 (the inclusive last quiet-buffer day) advance still returns ERR_RIGHTS_HOLDBACK_CONFLICT with HTTP 422"
            - "at clock 2026-08-31 advance returns 201 and creates the DevelopmentProject with dev_status ACTIVE_DEVELOPMENT and cumulative_dev_cost_cents 0"
            - "Pitch.${pitch_id}.status is COVERED through both refusals and only becomes ADVANCED on the third attempt"
            - "no DevelopmentProject exists before the third attempt: GET /development-projects with pitch_id filter returns an empty list"

      - name: holding_deal_half_open_term_permits_abutting_but_not_one_day_overlap
        grounds:
          - validations[priority=29]
          - entities.HoldingDeal.fields.term_start_date
          - entities.HoldingDeal.fields.term_end_date
          - entities.HoldingDeal.fields.term_state
          - endpoints["POST /holding-deals"]
        distinguishing_aspect: |
          Resource = the writer's exclusivity, and the interval convention is
          HALF-OPEN [term_start_date, term_end_date) per writer across slates. The
          probe pair is one day apart: a second hold starting 2027-01-31 collides
          with the first hold's last covered day, while one starting exactly on the
          first hold's exclusive end 2027-02-01 abuts legally. A closed-interval
          implementation rejects the abutting deal; an open-interval one accepts the
          overlapping deal.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one writer with one ACTIVE holding deal, term 2026-08-01..2027-02-01, annual_cost_cents 20000000, on a slate with total_dev_budget_cents 400000000"
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Arbor Talent", agency_code: "ARB", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /slates"
              payload: { platform: "STREAMING", season_year: 2027, total_dev_budget_cents: 400000000, pattern_budget_per_episode_cents: 32000000, license_fee_cap_per_episode_cents: 30000000, max_deficit_per_episode_cents: 7000000, episode_capacity: 20, default_episode_count: 10, max_backend_points_bps: 2000, max_concurrent_pilot_shoots: 2 }
              as: PlatformAdmin
              captures: { slate_id: $.data.id }
            - call: "POST /writers"
              payload: { full_name: "Nadia Roth", agency_id: "${ag_id}", guild_minimum_tier: "HIGH", quote_per_step_cents: 6000000 }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { wr_id: $.data.id }
            - call: "POST /holding-deals"
              payload: { writer_id: "${wr_id}", slate_id: "${slate_id}", annual_cost_cents: 20000000, term_start_date: "2026-08-01", term_end_date: "2027-02-01" }
              as: BusinessAffairs
              captures: { hd1_id: $.data.id }
          trigger:
            - call: "POST /holding-deals"
              payload: { writer_id: "${wr_id}", slate_id: "${slate_id}", annual_cost_cents: 18000000, term_start_date: "2027-01-31", term_end_date: "2027-07-01" }
              as: BusinessAffairs
            - call: "POST /holding-deals"
              payload: { writer_id: "${wr_id}", slate_id: "${slate_id}", annual_cost_cents: 18000000, term_start_date: "2027-02-01", term_end_date: "2027-08-01" }
              as: BusinessAffairs
              captures: { hd2_id: $.data.id }
          assert:
            - "the 2027-01-31 attempt returns ERR_HOLDING_DEAL_OVERLAP with HTTP 422 - it shares the single day 2027-01-31 with the first term"
            - "the refusal reserves nothing: Slate.${slate_id}.reserved_holding_cents is still 20000000 and available_dev_cents is still 380000000"
            - "the 2027-02-01 attempt returns 201 - abutting at the exclusive end is legal"
            - "HoldingDeal.${hd1_id}.term_state == IN_TERM and HoldingDeal.${hd2_id}.term_state == PENDING_START at clock 2026-08-01"
            - "Slate.${slate_id}.reserved_holding_cents == 38000000 and available_dev_cents == 362000000 after the abutting deal"
            - "Writer.${wr_id}.exclusivity_status == HOLDING_DEAL (the in-term deal decides it; the pending one does not)"

  - rule_id: compensating_invariant
    instances:
      - name: holding_deal_create_then_terminate_restores_the_slate_dollar_invariant
        grounds:
          - calculations.slate_dev_budget_ledger
          - entities.Slate.fields.reserved_holding_cents
          - entities.Slate.fields.available_dev_cents
          - endpoints["POST /holding-deals"]
          - endpoints["POST /holding-deals/{id}/terminate"]
        distinguishing_aspect: |
          Conserved quantity = money. The invariant is
          available + committed + reserved_holding + writeoff - recouped ==
          total_dev_budget_cents, and it is checked across a create/terminate
          compensating pair while a live script deal keeps committed_dev_cents
          non-zero, so a naive implementation that rebuilds available_dev_cents by
          subtracting only the reservation cannot hide.
