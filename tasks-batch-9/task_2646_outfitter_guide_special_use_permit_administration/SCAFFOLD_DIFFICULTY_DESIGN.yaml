      - name: screen_oversubscription_reroutes_sibling_depth_four
        grounds:
          - state_machines.PermitApplication.DIRECT_AWARD_PENDING_to_PROSPECTUS_QUEUED
          - calculations.use_area_service_day_availability
          - calculations.needs_assessment_allocation_recomputation
          - entities.UseArea.fields.allocation_posture
          - entities.NeedsAssessment.fields.prospectus_required
        distinguishing_aspect: |
          TRIGGER: screening a different application. DEPTH 4, and the interesting hop is lateral —
          the cascade reaches a SIBLING row that the request never named: (1) the screened
          application is routed PROSPECTUS and takes a 300-day hold, (2) because pending rose the
          area recomputes available_service_days to -220 and allocation_posture to EXHAUSTED,
          (3) because available_service_days went strictly negative every other
          DIRECT_AWARD_PENDING application in the area is rerouted to PROSPECTUS_QUEUED, and
          (4) because the area's totals moved the PUBLISHED needs assessment recomputes
          allocated_service_days to 1120, unallocated to -220 and prospectus_required to true.
          Issuance can never fire this chain, because issuing moves the same day count from pending
          to committed and leaves available_service_days arithmetically unchanged.
        test_recipe:
          setup:
            - "logical clock at 2027-01-05T00:00:00Z"
            - "UseArea BRW-01 with allocatable 900 service days and a PUBLISHED 2027 needs assessment for a determined capacity of 900"
            - "Outfitter Legacy holding an ISSUED permit for 700 days, so committed is 700 and available is 200"
            - "Outfitter Alpine with a DIRECT_AWARD_PENDING application for 120 days, so pending is 120, available is 80 and allocation_posture is CONSTRAINED"
            - "Outfitter Cedar with a SUBMITTED application for 300 days that has not been screened yet"
          setup_api_calls:
            - call: "POST /osup/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /osup/use-areas"
              payload: { area_code: "BRW-01", name: "Bear River Wilderness", total_allocated_service_days: 1000, season_year: 2027, season_open_date: "2027-05-15", season_close_date: "2027-09-30", party_size_max: 12, max_clients_per_guide: 8, reserved_admin_service_days: 100, min_liability_coverage_cents: 100000000 }
