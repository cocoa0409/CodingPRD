        excluded_because:
          difficulty_instance: certify_then_rescind_conserves_the_seat_ledger_total
          rationale: "That §1.8 instance certifies the initiator for 8 seats and the target for 7 out of a 15-seat pool, asserting the pool at 15, 0 and 7 across the certify/certify/rescind walk plus the Organization.governance_seats mirror, so the per-party draw order and the amounts are already pinned there."

