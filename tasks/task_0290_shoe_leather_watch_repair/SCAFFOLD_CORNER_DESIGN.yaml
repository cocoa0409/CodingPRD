# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Shoe / Leather & Watch Repair — Expert
# Breadth probe over the claim-extraction-guide taxonomy. Reuses the canonical
# bootstrap from §1.8. excluded_because stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_minimal_required_fields
        claim_type: Creation
        grounds:
          - "entities.Customer"
          - "endpoints[POST /customers]"
        distinguishing_aspect: "POST /customers with full_name+email+phone -> 201, status=ACTIVE, notify_channel defaults to EMAIL, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Mina Min", email: "mina@x.com", phone: "555-1000" }
              as: FrontDeskClerk
              captures: { cid: $.data.id, ch: $.data.notify_channel, st: $.data.status, v: $.data.version }
          assert:
            - "response.status == 201"
            - "Customer.${cid}.status == ACTIVE"
            - "Customer.${cid}.notify_channel == EMAIL"
            - "Customer.${cid}.version == 1"

      - name: create_customer_missing_email_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Customer.fields.email"
          - "validations[priority=6]"
        distinguishing_aspect: "POST /customers omitting required email -> ERR_INVALID_REQUEST (400); no customer created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "No Email", phone: "555-1001" }
              as: FrontDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_customer_email_conflict
        claim_type: Type Constraints
        grounds:
          - "entities.Customer.fields.email"
          - "validations[priority=5]"
          - "errors[ERR_DUPLICATE_KEY]"
        distinguishing_aspect: "Second POST /customers reusing an existing email -> ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup: ["One customer with email dup@x.com already exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "First", email: "dup@x.com", phone: "555-1002" }
              as: FrontDeskClerk
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Second", email: "dup@x.com", phone: "555-1003" }
              as: FrontDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_DUPLICATE_KEY"

      - name: get_ticket_not_found
        claim_type: Not Found
        grounds:
          - "entities.RepairTicket"
          - "errors[ERR_TICKET_NOT_FOUND]"
          - "endpoints[GET /repair-tickets/{id}]"
        distinguishing_aspect: "GET /repair-tickets/{random-uuid} -> ERR_TICKET_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /repair-tickets/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: FrontDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "data.error_id == ERR_TICKET_NOT_FOUND"

      - name: service_type_create_system_fields_generated
        claim_type: System Fields
        grounds:
          - "entities.ServiceType.fields.active"
          - "endpoints[POST /service-types]"
        distinguishing_aspect: "POST /service-types -> active=true is server-set; supplying active in the body is ignored."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /service-types"
              payload: { code: "SHOE_SOLE", name: "Sole Replacement", item_category: "SHOE", base_price_cents: 4000, standard_turnaround_days: 3, warranty_days: 90 }
              as: ShopManager
              captures: { stid: $.data.id, act: $.data.active }
          assert:
            - "response.status == 201"
            - "ServiceType.${stid}.active == true"

      - name: service_line_quoted_price_snapshot_computed
        claim_type: Computed Fields
        grounds:
          - "entities.ServiceLine.fields.quoted_price_cents"
          - "endpoints[POST /service-lines]"
        distinguishing_aspect: "ServiceLine.quoted_price_cents is snapshotted from ServiceType.base_price_cents (4000) at creation; status defaults QUOTED."
        test_recipe:
          setup: ["A SHOE service-type base 4000, a ticket with one SHOE item."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Snap Cust", email: "snap@x.com", phone: "555-1004" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "SHOE_SOLE", name: "Sole Replacement", item_category: "SHOE", base_price_cents: 4000, standard_turnaround_days: 3, warranty_days: 90 }
              as: ShopManager
              captures: { st_shoe: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}" }
              as: FrontDeskClerk
              captures: { tkt_id: $.data.id }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "SHOE", description: "shoe", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_shoe: $.data.id }
          trigger:
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_shoe}", service_type_id: "${st_shoe}" }
              as: RepairTechnician
              captures: { lid: $.data.id, qp: $.data.quoted_price_cents, ls: $.data.status }
          assert:
            - "ServiceLine.${lid}.quoted_price_cents == 4000"
            - "ServiceLine.${lid}.status == QUOTED"

      - name: service_line_category_mismatch_rejected
        claim_type: Type Constraints
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_INVALID_REQUEST]"
          - "entities.ServiceType.fields.item_category"
        distinguishing_aspect: "A SHOE item paired with a WATCH service-type -> ERR_INVALID_REQUEST (400) (item_category mismatch)."
        test_recipe:
          setup: ["A WATCH service-type and a ticket with a SHOE item."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Mismatch Cust", email: "mis@x.com", phone: "555-1005" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "WATCH_BATT", name: "Watch Battery", item_category: "WATCH", base_price_cents: 1500, standard_turnaround_days: 1, warranty_days: 90 }
              as: ShopManager
              captures: { st_watch: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}" }
              as: FrontDeskClerk
              captures: { tkt_id: $.data.id }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "SHOE", description: "shoe", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_shoe: $.data.id }
          trigger:
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_shoe}", service_type_id: "${st_watch}" }
              as: RepairTechnician
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: service_line_retired_type_rejected
        claim_type: Type Constraints
        grounds:
          - "endpoints[POST /service-types/{id}/retire]"
          - "validations[priority=6]"
          - "entities.ServiceType.fields.active"
        distinguishing_aspect: "A retired (active=false) ServiceType used on a new ServiceLine -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A SHOE service-type then retired; a ticket with a SHOE item."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Retire Cust", email: "ret@x.com", phone: "555-1006" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "SHOE_SOLE", name: "Sole Replacement", item_category: "SHOE", base_price_cents: 4000, standard_turnaround_days: 3, warranty_days: 90 }
              as: ShopManager
              captures: { st_shoe: $.data.id }
            - call: "POST /service-types/${st_shoe}/retire"
              payload: {}
              as: ShopManager
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}" }
              as: FrontDeskClerk
              captures: { tkt_id: $.data.id }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "SHOE", description: "shoe", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_shoe: $.data.id }
          trigger:
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_shoe}", service_type_id: "${st_shoe}" }
              as: RepairTechnician
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: list_tickets_pagination_envelope
        claim_type: Listing
        grounds:
          - "endpoints[GET /repair-tickets]"
        distinguishing_aspect: "GET /repair-tickets returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["At least one ticket exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "List Cust", email: "list@x.com", phone: "555-1007" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}" }
              as: FrontDeskClerk
          trigger:
            - call: "GET /repair-tickets"
              payload: {}
              as: ShopManager
          assert:
            - "response.status == 200"
            - "response_type == array"
            - "meta.total_count >= 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_estimate_from_intake_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Estimate.PRESENTED_to_APPROVED"
          - "errors[ERR_INVALID_ESTIMATE_STATE]"
        distinguishing_aspect: "Approving a DRAFT estimate (never presented) -> ERR_INVALID_ESTIMATE_STATE (409); ticket stays INTAKE."
        test_recipe:
          setup: ["A ticket with a service-line and a DRAFT estimate that was never presented."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Inv Cust", email: "inv@x.com", phone: "555-1008" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "SHOE_SOLE", name: "Sole Replacement", item_category: "SHOE", base_price_cents: 4000, standard_turnaround_days: 3, warranty_days: 90 }
              as: ShopManager
              captures: { st_shoe: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}" }
              as: FrontDeskClerk
              captures: { tkt_id: $.data.id }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "SHOE", description: "shoe", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_shoe: $.data.id }
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_shoe}", service_type_id: "${st_shoe}" }
              as: RepairTechnician
              captures: { line_a: $.data.id }
            - call: "POST /estimates"
              payload: { ticket_id: "${tkt_id}", authored_by_technician_id: "${st_shoe}" }
              as: RepairTechnician
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /estimates/${est_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_ESTIMATE_STATE"

      - name: present_without_service_lines_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.RepairTicket.INTAKE_to_AWAITING_APPROVAL"
          - "errors[ERR_NO_SERVICE_LINES]"
        distinguishing_aspect: "Present on a ticket with zero non-VOIDED ServiceLines -> ERR_NO_SERVICE_LINES (409)."
        test_recipe:
          setup: ["A ticket with a DRAFT estimate but no ServiceLines."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Empty Cust", email: "empty@x.com", phone: "555-1009" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Tess Tech", skills: ["SHOE"] }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", assigned_technician_id: "${tech_id}" }
              as: FrontDeskClerk
              captures: { tkt_id: $.data.id, tkt_v0: $.data.version }
            - call: "POST /estimates"
              payload: { ticket_id: "${tkt_id}", authored_by_technician_id: "${tech_id}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /estimates/${est_id}/present"
              payload: { expected_ticket_version: "${tkt_v0}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_NO_SERVICE_LINES"

      - name: mark_ready_with_incomplete_line_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.RepairTicket.IN_REPAIR_to_READY_FOR_PICKUP"
          - "errors[ERR_LINES_NOT_COMPLETED]"
        distinguishing_aspect: "mark-ready while a non-VOIDED line is still QUOTED (not COMPLETED) -> ERR_LINES_NOT_COMPLETED (409)."
        test_recipe:
          setup: ["Ticket IN_REPAIR with one still-QUOTED line."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Incomplete Cust", email: "incpl@x.com", phone: "555-1010" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "SHOE_SOLE", name: "Sole Replacement", item_category: "SHOE", base_price_cents: 4000, standard_turnaround_days: 3, warranty_days: 90 }
              as: ShopManager
              captures: { st_shoe: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Tess Tech", skills: ["SHOE"] }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", assigned_technician_id: "${tech_id}" }
              as: FrontDeskClerk
              captures: { tkt_id: $.data.id, tkt_v0: $.data.version }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "SHOE", description: "shoe", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_shoe: $.data.id }
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_shoe}", service_type_id: "${st_shoe}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { line_a: $.data.id }
            - call: "POST /estimates"
              payload: { ticket_id: "${tkt_id}", authored_by_technician_id: "${tech_id}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/present"
              payload: { expected_ticket_version: "${tkt_v0}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
            - call: "POST /estimates/${est_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /repair-tickets/${tkt_id}/start-repair"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /repair-tickets/${tkt_id}/mark-ready"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_LINES_NOT_COMPLETED"

      - name: start_repair_without_technician_rejected
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.RepairTicket.APPROVED_to_IN_REPAIR"
          - "errors[ERR_NO_TECHNICIAN]"
        distinguishing_aspect: "start-repair on an APPROVED ticket with no assigned_technician_id -> ERR_NO_TECHNICIAN (409)."
        test_recipe:
          setup: ["Ticket APPROVED (no parts) but assigned_technician_id never set."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "NoTech Cust", email: "notech@x.com", phone: "555-1011" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "SHOE_SOLE", name: "Sole Replacement", item_category: "SHOE", base_price_cents: 4000, standard_turnaround_days: 3, warranty_days: 90 }
              as: ShopManager
              captures: { st_shoe: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Author Tech", skills: ["SHOE"] }
              as: ShopManager
              captures: { tech_author: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}" }
              as: FrontDeskClerk
              captures: { tkt_id: $.data.id, tkt_v0: $.data.version }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "SHOE", description: "shoe", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_shoe: $.data.id }
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_shoe}", service_type_id: "${st_shoe}" }
              as: RepairTechnician
              as_user_id: "${tech_author}"
              captures: { line_a: $.data.id }
            - call: "POST /estimates"
              payload: { ticket_id: "${tkt_id}", authored_by_technician_id: "${tech_author}" }
              as: RepairTechnician
              as_user_id: "${tech_author}"
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/present"
              payload: { expected_ticket_version: "${tkt_v0}" }
              as: RepairTechnician
              as_user_id: "${tech_author}"
            - call: "POST /estimates/${est_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /repair-tickets/${tkt_id}/start-repair"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_author}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_NO_TECHNICIAN"

      - name: cancel_picked_up_ticket_not_cancellable
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.RepairTicket.AWAITING_PARTS_to_CANCELLED"
          - "errors[ERR_NOT_CANCELLABLE]"
        distinguishing_aspect: "Cancelling a PICKED_UP (terminal) ticket -> ERR_NOT_CANCELLABLE (409); no cascade fires."
        test_recipe:
          setup: ["A ticket carried to PICKED_UP."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { full_name: "Done Cust", email: "done@x.com", phone: "555-1012" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "WATCH_BATT", name: "Watch Battery", item_category: "WATCH", base_price_cents: 1500, standard_turnaround_days: 1, warranty_days: 90 }
              as: ShopManager
              captures: { st_watch: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Tess Tech", skills: ["WATCH"] }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", assigned_technician_id: "${tech_id}" }
              as: FrontDeskClerk
              captures: { tkt_id: $.data.id, tkt_v0: $.data.version }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "WATCH", description: "watch", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_w: $.data.id }
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_w}", service_type_id: "${st_watch}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { line_w: $.data.id }
            - call: "POST /estimates"
              payload: { ticket_id: "${tkt_id}", authored_by_technician_id: "${tech_id}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/present"
              payload: { expected_ticket_version: "${tkt_v0}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
            - call: "POST /estimates/${est_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /repair-tickets/${tkt_id}/start-repair"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_id}"
            - call: "PATCH /service-lines/${line_w}"
              payload: { status: "COMPLETED" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
            - call: "POST /repair-tickets/${tkt_id}/mark-ready"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_id}"
            - call: "GET /repair-tickets/${tkt_id}"
              payload: {}
              as: FrontDeskClerk
              captures: { tkt_vr: $.data.version }
            - call: "POST /payments"
              payload: { ticket_id: "${tkt_id}", amount_cents: 1500, method: "CASH", expected_ticket_version: "${tkt_vr}" }
              as: FrontDeskClerk
            - call: "POST /repair-tickets/${tkt_id}/pickup"
              payload: {}
              as: FrontDeskClerk
          trigger:
            - call: "POST /repair-tickets/${tkt_id}/cancel"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_NOT_CANCELLABLE"

      - name: notify_ready_parallel_dimension_independent
        claim_type: parallel
        grounds:
          - "endpoints[POST /repair-tickets/{id}/notify-ready]"
          - "entities.RepairTicket.fields.notify_status"
        distinguishing_aspect: "notify-ready flips notify_status NONE->READY_NOTIFIED without changing repair_status (parallel dimensions evolve independently)."
        test_recipe:
          setup: ["Ticket READY_FOR_PICKUP, notify_status NONE."]
          setup_api_calls:
            - call: "POST /_clock/set"
