          sit_daily_rate_cents_per_cwt: 250
          hourly_labor_rate_cents: 4000
        as: VanLineAdmin
        captures:
          tar: $.data.id
      - call: POST /tariffs/${tar}/publish
        payload: {}
        as: VanLineAdmin
      - call: POST /orders
        payload:
          customer_id: ${cust}
          tariff_id: ${tar}
          pricing_mode: BINDING
          origin_city: Chicago
          origin_state: IL
          destination_city: Denver
          destination_state: CO
          mileage: 900
          pickup_date: '2026-06-10T00:00:00Z'
        as: BookingAgent
        as_user_id: ${ag_b}
        captures:
          ord: $.data.id
          ord_v: $.data.version
      - call: POST /orders/${ord}/estimates
        payload:
          estimate_kind: BINDING
          estimated_weight_lbs: 8000
          packing_services_cents: 0
          expected_order_version: ${ord_v}
        as: BookingAgent
        as_user_id: ${ag_b}
        captures:
          e1: $.data.id
      trigger:
      - call: GET /orders/${ord}
        as: VanLineAdmin
        captures:
          ord_v2: $.data.version
      - call: POST /orders/${ord}/estimates
        payload:
          estimate_kind: BINDING
          estimated_weight_lbs: 9000
          packing_services_cents: 5000
          expected_order_version: ${ord_v2}
        as: BookingAgent
        as_user_id: ${ag_b}
        captures:
          e2: $.data.id
      assert:
      - Estimate.${e2}.revision_number == 2 and supersedes_estimate_id == ${e1}
      - Estimate.${e1}.status == SUPERSEDED
      - GET /estimates?supersedes_estimate_id=${e1} returns exactly [${e2}]
      - Estimate.${e2}.estimated_charges_cents == 490500 (90 cwt * 4500 * 1.0 = 405000
        + fuel 40500 + packing 5000; released-value premium 0)
- section: state_machines
  instances:
  - name: estimate_accept_from_declined_rejected
    claim_type: invalid_transition
    grounds:
    - state_machines.Estimate
    - errors[ERR_TRANSITION_NOT_ALLOWED]
    distinguishing_aspect: 'DECLINED is terminal: a later accept attempt fails and
      no side effects fire (order estimated_weight_lbs stays null).'
    test_recipe:
      setup:
      - order REGISTERED with estimate DECLINED by the customer
      setup_api_calls:
      - call: POST /agents
        payload:
          legal_name: Booking Co
          agent_code: CB06
          capabilities:
          - BOOKING
          home_market: Chicago
        as: VanLineAdmin
