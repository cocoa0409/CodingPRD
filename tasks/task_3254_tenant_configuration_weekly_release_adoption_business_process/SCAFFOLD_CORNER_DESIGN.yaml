  # ===========================================================================
  # Section: calculations — input-set filtering, constants, precision claims
  # not exercised by §1.8 instances.
  # ===========================================================================
  - section: calculations
    instances:
      - name: adoption_health_input_set_filtering
        claim_type: input_set_filtering
        grounds:
          - calculations.adoption_health_score
        distinguishing_aspect: "Only adoptions on trains in OPT_IN_OPEN or MANDATORY_LIVE contribute status penalties; adoptions on RETIRED trains are excluded from the input set."
        test_recipe:
          setup: ["tenant t1; adoption a1 ENROLLED on train f1; train f1 later RETIRED (requires successor train f2 MANDATORY_LIVE first)"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-CA1", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /release-trains"
              payload: { release_label: "F2026-R1", release_kind: "FEATURE_RELEASE", opt_in_window_start: "2026-09-01T00:00:00Z", opt_in_window_end: "2026-09-10T00:00:00Z", mandatory_date: "2026-10-01T00:00:00Z" }
              as: PlatformOperator
              captures: { f1: $.data.id }
            - call: "POST /release-trains"
              payload: { release_label: "F2026-R2", release_kind: "FEATURE_RELEASE", opt_in_window_start: "2026-09-01T00:00:00Z", opt_in_window_end: "2026-09-10T00:00:00Z", mandatory_date: "2026-10-02T00:00:00Z" }
              as: PlatformOperator
              captures: { f2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/feature-adoptions"
              payload: { release_train_id: "${f1}", feature_key: "F1" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { a1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-03T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /release-trains/${f1}/retire"
              as: PlatformOperator
          trigger:
            - call: "GET /tenants/${t1}/adoption-health"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { score: $.data.score }
          assert:
            - "after f1 forced a1 to FORCE_ENABLED at mandatory and f1 retired: the FORCE_ENABLED status carries no penalty in the formula; score == 100 (ENROLLED/DEFERRED/LATE penalties no longer apply)"
            - "adoption-health enrolled_count == 0 after the mandatory transition"

      - name: step_chain_input_set_excludes_removed_steps
        claim_type: input_set_filtering
        grounds:
          - calculations.effective_step_chain_resolution
        distinguishing_aspect: "REMOVED steps are excluded from the effective chain input set even when their inclusion_condition would hold."
        test_recipe:
          setup: ["tenant t1, DRAFT definition d1 with step 1 (REMOVED via group disable cascade... simpler: step on DRAFT definition removed by cascade), or direct assert via definition whose step was REMOVED by org deactivation cascade"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { tenant_name: "T-CA2", tenant_kind: "PRODUCTION", maintenance_slot_utc: 2 }
              as: PlatformOperator
              captures: { t1: $.data.id, t1_admin: $.data.bootstrap_admin_worker_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tenants/${t1}/organization-units"
              payload: { unit_name: "U1", unit_type: "TEAM", effective_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { u1: $.data.id }
            - call: "POST /tenants/${t1}/security-groups"
              payload: { group_name: "G-ROLE", assignment_mode: "ROLE_BASED", org_unit_id: "${u1}", min_approvers: 1 }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { g_role: $.data.id }
            - call: "POST /tenants/${t1}/workers"
              payload: { worker_ref: "WR", full_name: "Role Worker", org_unit_id: "${u1}", hire_date: "2026-09-02T00:00:00Z" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { w_role: $.data.id }
            - call: "POST /tenants/${t1}/business-process-definitions"
              payload: { transaction_type: "EXPENSE", definition_name: "Flow" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
              captures: { d1: $.data.id }
            - call: "POST /tenants/${t1}/business-process-definitions/${d1}/steps"
              payload: { step_order: 1, step_kind: "APPROVAL", approver_security_group_id: "${g_role}", inclusion_condition: "ALWAYS" }
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/workers/${w_role}/terminate"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
            - call: "POST /tenants/${t1}/organization-units/${u1}/deactivate"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
          trigger:
            - call: "GET /tenants/${t1}/business-process-definitions/${d1}/steps"
              as: TenantAdministrator
              as_user_id: "${t1_admin}"
          assert:
            - "step 1 status == REMOVED after the cascade"
            - "definition ${d1} can no longer activate (zero ACTIVE APPROVAL steps → ERR_NO_APPROVAL_STEP), confirming REMOVED steps are excluded from the activation input set"

