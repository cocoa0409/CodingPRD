  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    rule_name: "Priority-pair validation conflict — a request violates two rules at once and only the higher-priority error may surface"
    instances:

      - name: confirm_state_check_outranks_deposit_shortfall
        differentiation: |
          Pairs the STATE tier (priority 40) against the BUSINESS_FISCAL tier (priority 90) — the two
          extremes of the post-existence ladder — and the two candidate errors even carry different
          HTTP statuses (409 vs 402), so a mis-ordered implementation is detectable from the status
          line alone. The sibling instance below pairs two ADJACENT business tiers (60 vs 70) whose
          statuses also differ but whose semantic distance is small, which is the harder ordering to
          get right.
        mechanism: "validations priority 40 (ERR_ENGAGEMENT_NOT_DRAFT, 409) vs priority 90 (ERR_DEPOSIT_SHORTFALL, 402) on POST /engagements/{id}/confirm"
        entities_involved: [Engagement, RentalClient, TechRider]
        test_recipe:
          setup: |
            Two identical RENTAL engagements for a credit_rating A client with a zero outstanding
            balance, each with 1 performance day and 0 load-in days -> facility fee 500000 ->
            deposit_required_cents = max(50000, ceil100(round(0.25*500000))) = 125000, and no deposit
            is ever recorded, so both stand at deposit_paid_cents 0.
            Both riders are CAPABLE and CLEARED and both engagements are assessed
            LOW/CLEARED (RENTAL variant: credit factor A = 0, arrears 0/125000 = 0, lead 62 days ->
            100*(0.20*(1-62/120)) = 9.7 -> 10), so the rider gate and the clearance gate are
            deliberately satisfied and only two violations remain in play.
            Engagement A is then cancelled from DRAFT, which makes its lifecycle_status CANCELLED
            while its deposit shortfall persists. Engagement B is the control and is left in DRAFT.
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Studio Theatre"
                seat_capacity: 400
                base_facility_fee_cents: 500000
                load_in_day_fee_cents: 200000
                changeover_buffer_minutes: 60
                rigging_capacity_kg: 2000
                house_power_amps: 200
                dmx_universes: 2
              captures: { space_id: "$.data.id" }
            - call: "POST /rental-clients"
              as: RentalManager
              payload:
                org_name: "Fifth Ward Poetry Slam"
                contact_email: "book@fifthward.example"
                credit_rating: "A"
                is_nonprofit: false
                outstanding_balance_cents: 0
              captures: { client_id: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload:
                engagement_type: "RENTAL"
                space_id: "${space_id}"
                rental_client_id: "${client_id}"
                title: "Fifth Ward Slam Finals"
                load_in_start_utc: "2026-10-02T12:00:00Z"
                performance_start_utc: "2026-10-02T19:00:00Z"
                performance_end_utc: "2026-10-02T22:00:00Z"
                load_out_end_utc: "2026-10-02T23:30:00Z"
                performance_day_count: 1
                load_in_day_count: 0
              captures: { eng_a: "$.data.id" }
            - call: "POST /engagements"
              as: RentalManager
              payload:
                engagement_type: "RENTAL"
                space_id: "${space_id}"
                rental_client_id: "${client_id}"
                title: "Fifth Ward Slam Encore"
                load_in_start_utc: "2026-10-09T12:00:00Z"
                performance_start_utc: "2026-10-09T19:00:00Z"
                performance_end_utc: "2026-10-09T22:00:00Z"
                load_out_end_utc: "2026-10-09T23:30:00Z"
                performance_day_count: 1
                load_in_day_count: 0
              captures: { eng_b: "$.data.id" }
            - call: "POST /engagements/${eng_a}/tech-riders"
              as: RentalClientContact
              as_user_id: "${client_id}"
              payload:
                submitted_rigging_kg: 500
                requested_power_amps: 100
                requested_dmx_universes: 1
                requires_orchestra_pit: false
              captures: { rider_a: "$.data.id" }
            - call: "POST /engagements/${eng_b}/tech-riders"
              as: RentalClientContact
              as_user_id: "${client_id}"
              payload:
                submitted_rigging_kg: 500
                requested_power_amps: 100
                requested_dmx_universes: 1
                requires_orchestra_pit: false
              captures: { rider_b: "$.data.id" }
            - call: "POST /tech-riders/${rider_a}/review"
              as: TechnicalDirector
              payload: {}
            - call: "POST /tech-riders/${rider_a}/clear"
              as: TechnicalDirector
              payload: {}
            - call: "POST /tech-riders/${rider_b}/review"
              as: TechnicalDirector
              payload: {}
            - call: "POST /tech-riders/${rider_b}/clear"
              as: TechnicalDirector
              payload: {}
            - call: "GET /engagements/${eng_a}"
              as: FinanceController
              payload: {}
              captures: { eng_a_v: "$.data.version" }
            - call: "POST /engagements/${eng_a}/assess-risk"
              as: FinanceController
              payload:
                expected_engagement_version: "${eng_a_v}"
            - call: "GET /engagements/${eng_b}"
              as: FinanceController
              payload: {}
              captures: { eng_b_v: "$.data.version" }
            - call: "POST /engagements/${eng_b}/assess-risk"
              as: FinanceController
              payload:
                expected_engagement_version: "${eng_b_v}"
            - call: "POST /engagements/${eng_a}/cancel"
              as: RentalManager
              payload:
                reason: "Presenter withdrew before deposit"
          trigger:
            - call: "POST /engagements/${eng_a}/confirm"
              as: RentalManager
              payload: {}
              captures: { err: "$.data.error_id" }
          assert:
            - "409 with error_id ERR_ENGAGEMENT_NOT_DRAFT. Two rules are violated simultaneously — lifecycle_status is CANCELLED (priority 40) and deposit_paid_cents 0 < deposit_required_cents 125000 (priority 90) — and only the priority-40 error may surface."
            - "The HTTP status is 409, not 402: returning ERR_DEPOSIT_SHORTFALL with 402 is the mis-ordered signature."
            - "GET /engagements/${eng_a}: lifecycle_status is still CANCELLED, deposit_required_cents still 125000, deposit_paid_cents still 0 — the rejected confirm wrote nothing."
            - "CONTROL: POST /engagements/${eng_b}/confirm (still DRAFT, rider CLEARED, clearance CLEARED, deposit_paid 0) returns 402 ERR_DEPOSIT_SHORTFALL, proving the priority-90 rule is live and was genuinely masked rather than absent."
            - "CONTROL: recording a 125000-cent deposit on engagement B and confirming then returns 200 with lifecycle_status CONFIRMED, so the fiscal rule is satisfiable at exactly the required amount (>= comparison, not >)."

      - name: labor_call_window_check_outranks_crew_capacity
        differentiation: |
          Pairs two ADJACENT business tiers — BUSINESS_TEMPORAL containment (priority 64, 422) against
          BUSINESS_CONSTRAINT aggregate capacity (priority 70, 409) — on a single create call whose
          interval simultaneously escapes the engagement's occupancy window and oversubscribes the
          department roster. The sibling instance above pairs the far-apart state and fiscal tiers.
        mechanism: "validations priority 64 (ERR_CALL_OUTSIDE_ENGAGEMENT_WINDOW, 422) vs priority 70 (ERR_CREW_CAPACITY_EXCEEDED, 409) on POST /engagements/{id}/labor-calls"
        entities_involved: [Engagement, UnionDepartment, LaborCall]
        test_recipe:
          setup: |
            One PRESENTED engagement whose occupancy window is
            [2026-10-01T08:00:00Z, 2026-10-03T02:00:00Z), and a STAGEHANDS department with
            roster_size 10. One existing call books a crew of 8 from 08:00Z to 16:00Z on 1 October.
            The trigger call asks for a crew of 5 from 2026-10-01T12:00:00Z to 2026-10-03T12:00:00Z:
            it overlaps the existing call by four hours (8 + 5 = 13 > 10, a priority-70 violation)
            AND it runs ten hours past load_out_end_utc (a priority-64 violation).
          setup_api_calls:
            - call: "POST /performance-spaces"
              as: CenterAdmin
              payload:
                name: "Grand Hall"
                seat_capacity: 1200
                base_facility_fee_cents: 500000
                load_in_day_fee_cents: 200000
                changeover_buffer_minutes: 120
                rigging_capacity_kg: 5000
                house_power_amps: 400
                dmx_universes: 4
              captures: { space_id: "$.data.id" }
            - call: "POST /artists"
              as: ProgrammingDirector
              payload:
                legal_name: "Ridgeway Gospel Choir"
                agency_name: "Southgate Booking"
                guarantee_floor_cents: 100000
                historical_sell_through_pct: 0.65
                routing_window_start_utc: "2026-09-01T00:00:00Z"
                routing_window_end_utc: "2026-12-31T00:00:00Z"
                min_days_between_engagements: 0
              captures: { artist_id: "$.data.id" }
            - call: "POST /union-departments"
              as: CenterAdmin
              payload:
                department: "STAGEHANDS"
                roster_size: 10
                straight_hourly_rate_cents: 5000
              captures: { dept_id: "$.data.id" }
            - call: "POST /engagements"
              as: ProgrammingDirector
              payload:
                engagement_type: "PRESENTED"
                space_id: "${space_id}"
                artist_id: "${artist_id}"
                title: "Ridgeway Gospel Choir"
                load_in_start_utc: "2026-10-01T08:00:00Z"
                performance_start_utc: "2026-10-02T19:00:00Z"
                performance_end_utc: "2026-10-02T22:00:00Z"
                load_out_end_utc: "2026-10-03T02:00:00Z"
                performance_day_count: 1
                load_in_day_count: 1
              captures: { engagement_id: "$.data.id" }
            - call: "POST /engagements/${engagement_id}/labor-calls"
              as: TechnicalDirector
              payload:
                union_department_id: "${dept_id}"
                crew_size: 8
                call_start_utc: "2026-10-01T08:00:00Z"
                call_end_utc: "2026-10-01T16:00:00Z"
              captures: { call_a: "$.data.id" }
          trigger:
            - call: "POST /engagements/${engagement_id}/labor-calls"
              as: TechnicalDirector
              payload:
                union_department_id: "${dept_id}"
                crew_size: 5
                call_start_utc: "2026-10-01T12:00:00Z"
                call_end_utc: "2026-10-03T12:00:00Z"
              captures: { err: "$.data.error_id" }
          assert:
            - "422 with error_id ERR_CALL_OUTSIDE_ENGAGEMENT_WINDOW — the priority-64 temporal containment rule fires even though the priority-70 roster rule is also violated."
            - "The status is 422, not 409: ERR_CREW_CAPACITY_EXCEEDED here is the mis-ordered signature."
            - "GET /engagements/${engagement_id}/labor-calls returns total_count == 1 (only the crew-of-8 call) and GET /engagements/${engagement_id} still shows labor_estimate_total_cents equal to that call's estimate alone."
            - "CONTROL: the same crew of 5 requested for 2026-10-01T12:00:00Z to 2026-10-01T20:00:00Z — inside the window but still overlapping — returns 409 ERR_CREW_CAPACITY_EXCEEDED, proving the roster rule was masked rather than missing."
            - "CONTROL: a crew of 2 for 2026-10-01T12:00:00Z to 2026-10-01T13:00:00Z succeeds, because 8 + 2 == roster_size 10 and the check is an exceedance test, not a strict-less-than test."

  # ===========================================================================
  - rule_id: boundary_precision_check
    rule_name: "Boundary and precision check — the result changes at an exact comparison boundary or at an empty/zero edge"
    instances:

      - name: dynamic_ticket_price_at_exact_mid_band_ratio
        differentiation: |
          An INCLUSIVE-boundary probe on a derived RATIO: three consecutive single-seat sales walk
          sold_ratio across 0.5900, 0.6000 and the ratio's own 4-decimal precision, so the >= band
          comparison is pinned from below and exactly at the threshold, and the multiplier is applied
          to the per-unit price before the quantity multiplication. The sibling instance below probes
          the opposite kind of edge: an EMPTY input set and a NEGATIVE intermediate that must clamp.
        mechanism: "calculations.dynamic_single_ticket_price DYNAMIC_MID_BAND = 0.60 with a >= comparison on sold_qty / seats_allocated evaluated BEFORE the sale"
        entities_involved: [PriceTier, TicketSale, Engagement]
        test_recipe:
          setup: |
            A presented engagement taken ON_SALE with a single ORCH tier of exactly 100 seats at
            8000 cents, dynamic_pricing_enabled true and a 9500-cent ceiling (100 seats makes the
            ratio arithmetic exact).
            Risk gate: guarantee 200000 against projected gross round(8000*100*0.80) = 640000 ->
            fee exposure 0.3125, routing slack 31 days, lead 62 days, sell-through term 0.20 ->
            score 26 -> LOW -> CLEARED.
            Sale 1 sells 59 seats with sold_ratio_before 0.0000 -> multiplier 1.00 -> unit 8000 ->
            gross 472000, restoration 11800.
            Sale 2 sells 1 seat with sold_ratio_before 59/100 = 0.5900, strictly below the band ->
            multiplier 1.00 -> unit 8000.
            The trigger sells 1 seat with sold_ratio_before 60/100 = 0.6000 exactly.
          setup_api_calls:
