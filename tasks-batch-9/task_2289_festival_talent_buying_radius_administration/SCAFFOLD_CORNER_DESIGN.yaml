              as: TalentBuyer
              captures: { fest: "$.data.id", fest_v: "$.data.version" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 0.5, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_h: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "MID_CARD", tier_rank: 2, allocation_pct: 0.3, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_m: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "EMERGING", tier_rank: 3, allocation_pct: 0.2, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_e: "$.data.id" }
          trigger:
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
          assert:
            - "HTTP 200 and response_type == \"array\" with total_count == 3"
            - "data[0].tier_rank == 1 and data[0].allocation_cents == 500001"
            - "data[1].allocation_cents == 299999 and data[2].allocation_cents == 199999"
            - "data[0].allocation_cents + data[1].allocation_cents + data[2].allocation_cents == 999999 exactly"
            - "GET /festival-ops/festivals/${fest} returns tiers_allocated == true and version == 2"

      - name: contingency_reserve_uses_round_half_up_at_the_exact_half_cent
        claim_type: precision
        grounds:
          - calculations.tier_allocation_waterfall
          - entities.Festival.fields.allocatable_budget_cents
          - entities.Festival.fields.contingency_reserve_pct
        distinguishing_aspect: |
          100010 * 0.05 is exactly 5000.5, the single point where the three plausible
          rounding modes disagree: round_half_up gives a 5001 reserve and an allocatable
          of 95009, while truncation and banker's rounding both give 5000 / 95010. The
          single tier at 1.00 then shows the whole allocatable arriving with a zero
          remainder.
        test_recipe:
          setup:
            - "Festival with talent_budget_cents 100010 and contingency_reserve_pct 0.05."
            - "One HEADLINER tier at allocation_pct 1.00."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 100010, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest: "$.data.id", fest_v: "$.data.version" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 1.0, max_slots: 3, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_h: "$.data.id" }
          trigger:
            - call: "GET /festival-ops/festivals/${fest}"
              as: FinanceController
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
          assert:
            - "first call: data.allocatable_budget_cents == 95009 (not 95010)"
            - "first call: data.talent_budget_cents == 100010 and data.contingency_reserve_pct == 0.05"
            - "second call: data[0].allocation_cents == 95009 with no remainder left over"
            - "second call: total_count == 1"

