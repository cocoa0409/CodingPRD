  - rule_id: cross_entity_state_dependency
    instances:
      - name: session_scheduling_gated_by_plan_and_package_states
        grounds:
          - state_machines.CoachingPlan
          - state_machines.Package.ACTIVE_to_REFUNDED
          - validations[priority=12]
        distinguishing_aspect: |
          Entity pair Session -> Package (with Session -> CoachingPlan as the
          positive leg): scheduling succeeds only while the plan is ACTIVE and
          the package is ACTIVE with available credit; after the package is
          REFUNDED the same request fails with ERR_PACKAGE_NOT_ACTIVE and the
          plan posture flips to SCHEDULING_BLOCKED.
        test_recipe:
