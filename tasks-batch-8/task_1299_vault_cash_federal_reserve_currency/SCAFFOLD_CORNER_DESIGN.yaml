# =============================================================================
# §1.9 Scaffold Corner Design — Vault Cash & Federal Reserve Currency Ordering
# Breadth coverage of §1.1–§1.7 claims not already probed by §1.8.
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------- entities ---
  - section: entities
    instances:
      - name: create_vault_site_applies_defaults
        claim_type: creation
        grounds: ["entities.VaultSite", "endpoints[POST /vault-cash/vault-sites]"]
        distinguishing_aspect: "Omitting optional openings seeds 0 balances; posture derived NORMAL; version 1; server mints id/created_at."
        test_recipe:
          setup: ["Empty DB; default clock 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "Main Vault", site_type: "CENTRAL", vault_limit_cents: 50000000, insurance_coverage_cents: 80000000, dock_capacity: 3 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id, s_posture: $.data.posture, s_v: $.data.version }
          assert:
            - "response 201; VaultSite.${s_id}.opening_fit_cents == 0 and opening_unfit_cents == 0 (defaults applied)"
            - "on_hand_fit_cents == 0; on_hand_total_cents == 0; reserved_out_cents == 0; insurance_headroom_cents == 80000000"
            - "posture ${s_posture} == NORMAL; version ${s_v} == 1"

      - name: fed_order_missing_required_direction
        claim_type: required_fields
        grounds: ["entities.FedOrder.fields.direction", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field direction on order create yields 400 ERR_INVALID_REQUEST before any state/business check."
        test_recipe:
          setup: ["Site S; FedCoordinator U1 on S"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 10000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", business_date: "2026-08-03" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected 400 with error_id ERR_INVALID_REQUEST"

      - name: fed_order_invalid_enum_direction
        claim_type: type_constraints
        grounds: ["entities.FedOrder.fields.direction", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "direction must be ORDER|DEPOSIT; SIDEWAYS is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Site S; FedCoordinator U1 on S"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 10000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "SIDEWAYS", business_date: "2026-08-03" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected 400 with error_id ERR_INVALID_REQUEST"

      - name: create_site_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.VaultSite]
        distinguishing_aspect: "Client-supplied id/version on create are ignored; server mints its own id and version=1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vault-cash/vault-sites"
              payload: { id: "00000000-0000-0000-0000-000000000000", version: 99, name: "S", site_type: "BRANCH", vault_limit_cents: 50000000, insurance_coverage_cents: 80000000, dock_capacity: 2 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id, s_v: $.data.version }
          assert:
            - "201; returned id ${s_id} != 00000000-0000-0000-0000-000000000000 and version ${s_v} == 1"

      - name: denomination_line_computed_fields
        claim_type: computed_fields
        grounds: [entities.DenominationLine.fields.line_cents, entities.DenominationLine.fields.fee_cents, calculations.fed_order_face_total]
        distinguishing_aspect: "line_cents and fee_cents are server-computed: denom 5000 x 5 straps → line_cents 2,500,000, fee round_half_up(2,500,000/160) = 15,625."
        test_recipe:
          setup: ["Site S; FedCoordinator U1; DEPOSIT order O (business_date 2026-08-03, DRAFT)"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 10000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "DEPOSIT", business_date: "2026-08-03" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
          trigger:
            - call: "POST /vault-cash/fed-orders/${o_id}/lines"
              payload: { denomination_cents: 5000, strap_count: 5, expected_fed_order_version: "${o_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { l_cents: $.data.line_cents, l_fee: $.data.fee_cents }
          assert:
            - "line_cents ${l_cents} == 2500000 (5000 * 100 * 5)"
            - "fee_cents ${l_fee} == 15625"
            - "GET /vault-cash/fed-orders/${o_id}: face_total_cents == 2500000, fee_total_cents == 15625, grand_total_cents == 2515625"

      - name: get_nonexistent_fed_order_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_FED_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "GET with a random UUID yields 404 ERR_FED_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["Site S; staff U1 for a scoped read role"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2 }
              as: CashOperationsAdmin
          trigger:
            - call: "GET /vault-cash/fed-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: CashOperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "404 with error_id ERR_FED_ORDER_NOT_FOUND"

      - name: atm_create_with_unknown_site_rejected
        claim_type: parent_relationships
        grounds: ["entities.AtmMachine.fields.site_id", "errors[ERR_VAULT_SITE_NOT_FOUND]"]
        distinguishing_aspect: "Body FK site_id referencing a nonexistent site yields 404 ERR_VAULT_SITE_NOT_FOUND (existence of body references, priority 5)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /vault-cash/atm-machines"
              payload: { site_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", terminal_code: "ATM-9", cash_capacity_cents: 10000000 }
              as: CashOperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "404 with error_id ERR_VAULT_SITE_NOT_FOUND"

      - name: pagination_list_total_count_and_has_more
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /vault-cash/carriers]"]
        distinguishing_aspect: "With 3 carriers, GET ?limit=2&offset=2 returns exactly 1 row, total_count 3, has_more false; default limit is 10."
        test_recipe:
          setup: ["Carriers C1, C2, C3 created"]
          setup_api_calls:
            - call: "POST /vault-cash/carriers"
              payload: { name: "C1", liability_cap_per_truck_cents: 1000000 }
              as: CashOperationsAdmin
            - call: "POST /vault-cash/carriers"
              payload: { name: "C2", liability_cap_per_truck_cents: 1000000 }
              as: CashOperationsAdmin
            - call: "POST /vault-cash/carriers"
              payload: { name: "C3", liability_cap_per_truck_cents: 1000000 }
              as: CashOperationsAdmin
          trigger:
            - call: "GET /vault-cash/carriers?limit=2&offset=2"
              payload: {}
              as: CashOperationsAdmin
          assert:
            - "response_type == array; data length == 1; total_count == 3; has_more == false"
            - "GET /vault-cash/carriers (no params) returns all 3 with default limit 10"

  # -------------------------------------------------------- state machines ---
  - section: state_machines
    instances:
      - name: fed_order_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.FedOrder]
        distinguishing_aspect: "A newly created FedOrder starts in DRAFT with advice_count 0 and zeroed totals."
        test_recipe:
          setup: ["Site S; FedCoordinator U1"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 10000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "ORDER", business_date: "2026-08-03" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_id: $.data.id }
          assert:
            - "FedOrder.${o_id}.status == DRAFT; face_total_cents == 0; fee_total_cents == 0; advice_count == 0; version == 1"

      - name: recall_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.FedOrder.SUBMITTED_to_DRAFT", "errors[ERR_FED_ORDER_INVALID_STATE]"]
        distinguishing_aspect: "recall is defined only from SUBMITTED; from DRAFT it fails with ERR_FED_ORDER_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["Site S; FedCoordinator U1; DRAFT order O (no lines needed — state check precedes business checks)"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 10000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "ORDER", business_date: "2026-08-03" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/fed-orders/${o_id}/recall"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected 409 with error_id ERR_FED_ORDER_INVALID_STATE; order remains DRAFT"

      - name: batch_settle_from_open_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.FitnessBatch.SORTED_to_SETTLED", "errors[ERR_BATCH_INVALID_STATE]"]
        distinguishing_aspect: "settle requires SORTED; from OPEN it fails with ERR_BATCH_INVALID_STATE."
        test_recipe:
          setup: ["Site S with unfit 1,000,000; custodian U1; OPEN batch B input 500,000"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 1000000, opening_unfit_cents: 1000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/fitness-batches"
              payload: { site_id: "${s_id}", input_unfit_cents: 500000 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/fitness-batches/${b_id}/settle"
              payload: {}
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected 409 with error_id ERR_BATCH_INVALID_STATE; batch remains OPEN"

      - name: batch_double_settle_rejected
        claim_type: idempotency
        grounds: ["state_machines.FitnessBatch.SORTED_to_SETTLED", "errors[ERR_BATCH_INVALID_STATE]"]
        distinguishing_aspect: "Repeating settle on a SETTLED (terminal) batch fails with ERR_BATCH_INVALID_STATE — the successful transition is not replayable."
        test_recipe:
          setup: ["Site S unfit 1,000,000; custodian U1; batch B input 500,000 sorted to {fit 300,000, unfit 200,000, counterfeit 0} (shrink 0)"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 1000000, opening_unfit_cents: 1000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/fitness-batches"
              payload: { site_id: "${s_id}", input_unfit_cents: 500000 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { b_id: $.data.id }
            - call: "POST /vault-cash/fitness-batches/${b_id}/sort-results"
              payload: { fit_recovered_cents: 300000, unfit_remaining_cents: 200000, counterfeit_face_cents: 0 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/fitness-batches/${b_id}/settle"
              payload: {}
              as: VaultCustodian
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /vault-cash/fitness-batches/${b_id}/settle"
              payload: {}
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second settle rejected 409 ERR_BATCH_INVALID_STATE"
            - "site on_hand_fit_cents == 1300000 exactly once (first settle applied once: 1,000,000 + 300,000)"

      - name: case_terminal_lockdown_seize_after_release_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.CounterfeitCase.SEIZED_to_RELEASED", "errors[ERR_CASE_INVALID_STATE]"]
        distinguishing_aspect: "RELEASED is terminal; seizing a released case fails with ERR_CASE_INVALID_STATE and the released cash stays returned."
        test_recipe:
          setup: ["Site S fit 5,000,000; custodian U1; compliance U2; case K face 50,000 (25 x 2000), SEIZED then RELEASED by U2"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Comp U2", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u2_id: $.data.id }
            - call: "POST /vault-cash/counterfeit-cases"
              payload: { site_id: "${s_id}", denomination_cents: 2000, note_count: 25 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { k_id: $.data.id }
            - call: "POST /vault-cash/counterfeit-cases/${k_id}/seize"
              payload: {}
              as: VaultCustodian
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/counterfeit-cases/${k_id}/release"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${u2_id}"
          trigger:
            - call: "POST /vault-cash/counterfeit-cases/${k_id}/seize"
              payload: {}
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected 409 ERR_CASE_INVALID_STATE (terminal lockdown)"
            - "GET /vault-cash/vault-sites/${s_id}.on_hand_fit_cents == 5000000 (seize -50,000 then release +50,000; failed re-seize applied nothing)"

      - name: recon_count_auto_forks_balanced
        claim_type: valid_transition
        grounds: [state_machines.Reconciliation.OPEN_to_COUNTED, state_machines.Reconciliation.COUNTED_to_BALANCED]
        distinguishing_aspect: "Count within tolerance (|variance| 500 <= 1000) auto-forks COUNTED → BALANCED in one request."
        test_recipe:
          setup: ["Site S fit 5,000,000; custodian U1; recon R for 2026-08-02 opening 5,000,000 (no ledger entries on that date)"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/reconciliations"
              payload: { site_id: "${s_id}", business_date: "2026-08-02", opening_balance_cents: 5000000 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/reconciliations/${r_id}/count"
              payload: { counted_on_hand_cents: 5000500 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
          assert:
            - "Reconciliation.${r_id}.status == BALANCED (auto-fork)"
            - "variance_cents == 500; provisional_expected_cents == 5000000 == final_expected_cents (no entries on 2026-08-02)"

      - name: forecast_publish_supersedes_prior
        claim_type: side_effect_execution
        grounds: [state_machines.AtmForecast.PUBLISHED_to_SUPERSEDED, state_machines.AtmForecast.DRAFT_to_PUBLISHED]
        distinguishing_aspect: "Publishing a second DRAFT forecast for the same atm+date supersedes the first PUBLISHED one and re-points atm.current_forecast_id."
        test_recipe:
          setup: ["Site S; ATM X (cap 10,000,000, opening 5,000,000, ACTIVE); analyst A1; DRAFT forecasts F1 and F2 for 2026-08-10"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/atm-machines"
              payload: { site_id: "${s_id}", terminal_code: "ATM-X", cash_capacity_cents: 10000000, opening_balance_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { x_id: $.data.id, x_v: $.data.version }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Analyst A1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /vault-cash/atm-forecasts"
              payload: { atm_id: "${x_id}", forecast_date: "2026-08-10", w1_cents: 1000000, w2_cents: 1000000, w3_cents: 1000000 }
              as: AtmAnalyst
              as_user_id: "${a1_id}"
              captures: { f1_id: $.data.id }
            - call: "POST /vault-cash/atm-forecasts"
              payload: { atm_id: "${x_id}", forecast_date: "2026-08-10", w1_cents: 2000000, w2_cents: 2000000, w3_cents: 2000000 }
              as: AtmAnalyst
              as_user_id: "${a1_id}"
              captures: { f2_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/atm-forecasts/${f1_id}/publish"
              payload: { expected_atm_version: "${x_v}" }
              as: AtmAnalyst
              as_user_id: "${a1_id}"
            - call: "GET /vault-cash/atm-machines/${x_id}"
              payload: {}
              as: AtmAnalyst
              as_user_id: "${a1_id}"
              captures: { x_v2: $.data.version }
            - call: "POST /vault-cash/atm-forecasts/${f2_id}/publish"
              payload: { expected_atm_version: "${x_v2}" }
              as: AtmAnalyst
              as_user_id: "${a1_id}"
          assert:
            - "GET /vault-cash/atm-forecasts/${f1_id}.status == SUPERSEDED"
            - "GET /vault-cash/atm-forecasts/${f2_id}.status == PUBLISHED"
            - "GET /vault-cash/atm-machines/${x_id}.current_forecast_id == ${f2_id}"

      - name: shipment_lifecycle_exception_branch_effects
        claim_type: side_effect_execution
        grounds: [state_machines.CashShipment.LOADED_to_IN_TRANSIT, state_machines.CashShipment.IN_TRANSIT_to_EXCEPTION, state_machines.CashShipment.EXCEPTION_to_VERIFIED, state_machines.FedOrder.ACKNOWLEDGED_to_IN_TRANSIT]
        distinguishing_aspect: "depart auto-moves the linked order to IN_TRANSIT; a mismatched verify branches to EXCEPTION with no cash movement; exception-accept books the counted value and sets the order's settled basis."
        test_recipe:
          setup: ["Site S fit 30,000,000 (NORMAL); coord U2; carrier C; ORDER O face 2,000,000 (denom 2000 x 10) ACKNOWLEDGED; shipment SH linked to O, LOADED"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "CENTRAL", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 30000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U2", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u2_id: $.data.id }
            - call: "POST /vault-cash/carriers"
              payload: { name: "Carrier C", liability_cap_per_truck_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { c_id: $.data.id }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "ORDER", business_date: "2026-08-04" }
              as: FedCoordinator
              as_user_id: "${u2_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o_id}/lines"
              payload: { denomination_cents: 2000, strap_count: 10, expected_fed_order_version: "${o_v}" }
              as: FedCoordinator
              as_user_id: "${u2_id}"
            - call: "POST /vault-cash/fed-orders/${o_id}/submit"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u2_id}"
            - call: "POST /vault-cash/fed-orders/${o_id}/acknowledge"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u2_id}"
            - call: "POST /vault-cash/cash-shipments"
              payload: { fed_order_id: "${o_id}", carrier_id: "${c_id}", scheduled_departure_at: "2026-08-02T10:00:00Z", scheduled_arrival_at: "2026-08-02T12:00:00Z" }
              as: FedCoordinator
              as_user_id: "${u2_id}"
              captures: { sh_id: $.data.id }
            - call: "POST /vault-cash/cash-shipments/${sh_id}/load"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u2_id}"
          trigger:
            - call: "POST /vault-cash/cash-shipments/${sh_id}/depart"
              payload: {}
              as: CarrierDispatcher
              as_user_id: "${c_id}"
            - call: "POST /vault-cash/cash-shipments/${sh_id}/verify"
              payload: { counted_value_cents: 1900000 }
              as: CarrierDispatcher
              as_user_id: "${c_id}"
              captures: { sh_exc: $.data.status }
            - call: "POST /vault-cash/cash-shipments/${sh_id}/verify"
              payload: { counted_value_cents: 1900000, accept_variance: true }
              as: CarrierDispatcher
              as_user_id: "${c_id}"
          assert:
            - "after depart: FedOrder.${o_id}.status == IN_TRANSIT (auto transition)"
            - "mismatched verify: status ${sh_exc} == EXCEPTION and site fit still 30000000 (no cash movement on exception)"
            - "exception-accept: CashShipment.${sh_id}.status == VERIFIED; site fit == 31900000 (counted 1,900,000 booked, not declared 2,000,000)"
            - "FedOrder.${o_id}.status == RECEIVED and settled_basis_cents == 1900000"
            - "GET /vault-cash/vault-sites/${s_id}.in_transit_inbound_cents == 0 and pending_inbound_order_cents == 0"

  # ------------------------------------------------------------ calculations ---
  - section: calculations
    instances:
      - name: recon_input_set_excludes_other_business_dates
        claim_type: input_set_filtering
        grounds: [calculations.reconciliation_expected_balance]
        distinguishing_aspect: "Only ledger entries whose business_date equals the recon date enter the expected balance; entries on 08-01 and 08-03 are excluded from the 08-02 recon."
        test_recipe:
          setup: ["Site S fit 5,000,000 (opening entry lands on 2026-08-01); clock 2026-08-02T09:00; entries: +500,000 on 08-01, +300,000 on 08-02, +900,000 on 08-03; recon R for 08-02 opening 1,000,000"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "CENTRAL", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: CashOperationsAdmin
            - call: "POST /vault-cash/cash-ledger-entries"
              payload: { site_id: "${s_id}", business_date: "2026-08-01", signed_amount_cents: 500000, bucket: "FIT" }
              as: VaultCustodian
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/cash-ledger-entries"
              payload: { site_id: "${s_id}", business_date: "2026-08-02", signed_amount_cents: 300000, bucket: "FIT" }
              as: VaultCustodian
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/cash-ledger-entries"
              payload: { site_id: "${s_id}", business_date: "2026-08-03", signed_amount_cents: 900000, bucket: "FIT" }
              as: VaultCustodian
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /vault-cash/reconciliations"
              payload: { site_id: "${s_id}", business_date: "2026-08-02", opening_balance_cents: 1000000 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { r_id: $.data.id }
          assert:
            - "Reconciliation.${r_id}.final_expected_cents == 1300000 (only the 08-02 entry counted)"
            - "provisional_expected_cents == 1300000 (all three entries predate the recon, but only the 08-02 one is in the input set)"

      - name: shrink_tolerance_501_rejected
        claim_type: constants_applied
        grounds: ["calculations.fitness_settlement", "errors[ERR_SHRINK_TOLERANCE_EXCEEDED]", "validations[priority=22]"]
        distinguishing_aspect: "SHRINK_TOLERANCE_CENTS = 500 is inclusive: shrink 501 is rejected at settle while the batch stays SORTED (contrasts with the ==500 boundary admitted in §1.9 sibling fitness_batch_conservation... covered in §1.8 fitness invariant)."
        test_recipe:
          setup: ["Site S unfit 1,000,000; custodian U1; batch B input 1,000,000 sorted to {fit 600,000, unfit 399,499, counterfeit 0} → shrink 501"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 1000000, opening_unfit_cents: 1000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/fitness-batches"
              payload: { site_id: "${s_id}", input_unfit_cents: 1000000 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { b_id: $.data.id }
            - call: "POST /vault-cash/fitness-batches/${b_id}/sort-results"
              payload: { fit_recovered_cents: 600000, unfit_remaining_cents: 399499, counterfeit_face_cents: 0 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { b_shrink: $.data.shrink_cents }
          trigger:
            - call: "POST /vault-cash/fitness-batches/${b_id}/settle"
              payload: {}
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "shrink ${b_shrink} == 501"
            - "settle rejected 422 ERR_SHRINK_TOLERANCE_EXCEEDED; batch remains SORTED; no ledger entries posted"

      - name: forecast_weight_constants_applied
        claim_type: constants_applied
        grounds: [calculations.atm_forecast_projection]
        excluded_because:
          difficulty_instance: "dual_variant_calc / atm_forecast_trailing_vs_seasonal_projection"
          rationale: "Weights 0.5/0.3/0.2 and the 12500-bps multiplier are asserted as literal outcomes in the named §1.8 instance."

      - name: fee_per_line_rounding_precision
        claim_type: precision
        grounds: [calculations.fed_service_fee]
        excluded_because:
          difficulty_instance: "combinatorial_formula / fed_fee_per_line_rounding_then_sum"
          rationale: "The 63+63=126 vs 125 rounding-order trap is asserted with literals in the named §1.8 instance."

  # ------------------------------------------------------------- validations ---
  - section: validations
    instances:
      - name: get_site_missing_auth_header_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=4]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with no auth headers to a nonexistent site id must return 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER — authentication (priority 1) precedes existence (priority 4) and never leaks 404s."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /vault-cash/vault-sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
          assert:
            - "400 with error_id ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (not 404)"

      - name: atm_analyst_cannot_create_vault_site
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "roles[CashOperationsAdmin].exclusive_operations", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Site creation is exclusive to CashOperationsAdmin; an AtmAnalyst with a valid staff identity is rejected 403 ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["Site S; staff A1 (will act as AtmAnalyst)"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Analyst A1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "Rogue", site_type: "BRANCH", vault_limit_cents: 1, insurance_coverage_cents: 1, dock_capacity: 1 }
              as: AtmAnalyst
              as_user_id: "${a1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected 403 ERR_INSUFFICIENT_PERMISSIONS; GET /vault-cash/vault-sites still lists exactly 1 site"

      - name: custodian_cross_site_scope_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_SITE_SCOPE_VIOLATION]", "roles[VaultCustodian]"]
        distinguishing_aspect: "A custodian whose home_site_id is A cannot count a reconciliation of site B — per-resource ownership scoping via entity-backed identity."
        test_recipe:
          setup: ["Sites A and B; custodians U_A (home A), U_B (home B); recon R_B on site B (created by U_B)"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "A", site_type: "CENTRAL", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { a_id: $.data.id }
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "B", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 3000000 }
              as: CashOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust A", home_site_id: "${a_id}" }
              as: CashOperationsAdmin
              captures: { ua_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust B", home_site_id: "${b_id}" }
              as: CashOperationsAdmin
              captures: { ub_id: $.data.id }
            - call: "POST /vault-cash/reconciliations"
              payload: { site_id: "${b_id}", business_date: "2026-08-01", opening_balance_cents: 3000000 }
              as: VaultCustodian
              as_user_id: "${ub_id}"
              captures: { rb_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/reconciliations/${rb_id}/count"
              payload: { counted_on_hand_cents: 3000000 }
              as: VaultCustodian
              as_user_id: "${ua_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected 403 ERR_SITE_SCOPE_VIOLATION"
            - "Reconciliation.${rb_id}.status == OPEN (no count recorded)"

      - name: dispatcher_depart_other_carrier_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_RESOURCE_OWNERSHIP_VIOLATION]", "roles[CarrierDispatcher]"]
        distinguishing_aspect: "CarrierDispatcher identity is entity_backed by Carrier; departing a shipment owned by a different carrier id fails 403 even though the role itself is allowed on the endpoint."
        test_recipe:
          setup: ["Sites A(fit 30,000,000)/B; carriers C1, C2; coord U1 on A; inter-site shipment SH of carrier C2 A→B, LOADED"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "A", site_type: "CENTRAL", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 5, opening_fit_cents: 30000000 }
              as: CashOperationsAdmin
              captures: { a_id: $.data.id }
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "B", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 5, opening_fit_cents: 0 }
              as: CashOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /vault-cash/carriers"
              payload: { name: "C1", liability_cap_per_truck_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /vault-cash/carriers"
              payload: { name: "C2", liability_cap_per_truck_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${a_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/cash-shipments"
              payload: { carrier_id: "${c2_id}", origin_site_id: "${a_id}", destination_site_id: "${b_id}", declared_value_cents: 1000000, scheduled_departure_at: "2026-08-10T10:00:00Z", scheduled_arrival_at: "2026-08-10T12:00:00Z" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { sh_id: $.data.id }
            - call: "POST /vault-cash/cash-shipments/${sh_id}/load"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /vault-cash/cash-shipments/${sh_id}/depart"
              payload: {}
              as: CarrierDispatcher
              as_user_id: "${c1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected 403 ERR_RESOURCE_OWNERSHIP_VIOLATION; shipment remains LOADED"

      - name: order_submit_after_cutoff_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_ORDER_CUTOFF_PASSED]", "endpoints[POST /vault-cash/_clock/set_current_utc]"]
        distinguishing_aspect: "Cutoff is (business_date - 1 day)T18:00:00Z against the logical clock: at the default clock 2026-08-01T00:00:00Z an order for business_date 2026-08-01 is already past cutoff (2026-07-31T18:00Z), while 2026-08-03 is submittable."
        test_recipe:
          setup: ["Site S fit 10,000,000 NORMAL; coord U1; ORDER O1 business_date 2026-08-01 with line denom 2000 x 10; ORDER O2 business_date 2026-08-03 with same line"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 10000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "ORDER", business_date: "2026-08-01" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o1_id: $.data.id, o1_v: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o1_id}/lines"
              payload: { denomination_cents: 2000, strap_count: 10, expected_fed_order_version: "${o1_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "ORDER", business_date: "2026-08-03" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o2_id: $.data.id, o2_v: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o2_id}/lines"
              payload: { denomination_cents: 2000, strap_count: 10, expected_fed_order_version: "${o2_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /vault-cash/fed-orders/${o1_id}/submit"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /vault-cash/fed-orders/${o2_id}/submit"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
          assert:
            - "O1 submit rejected 422 ERR_ORDER_CUTOFF_PASSED"
            - "O2 submit succeeds: FedOrder.${o2_id}.status == SUBMITTED"

      - name: seasonal_window_overlap_rejected_adjacency_allowed
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_SEASONAL_WINDOW_OVERLAP]"]
        distinguishing_aspect: "Closed-interval semantics: [12-20,12-26] then [12-26,12-31] overlap on 12-26 (inclusive ends) and are rejected; [12-27,2027-01-02] is exactly adjacent (end+1 day) and allowed."
        test_recipe:
          setup: ["Site S; window W1 2026-12-20..2026-12-26"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/seasonal-windows"
              payload: { site_id: "${s_id}", name: "W1", start_date: "2026-12-20", end_date: "2026-12-26", multiplier_bps: 12500 }
              as: CashOperationsAdmin
          trigger:
            - call: "POST /vault-cash/seasonal-windows"
              payload: { site_id: "${s_id}", name: "W2", start_date: "2026-12-26", end_date: "2026-12-31", multiplier_bps: 13000 }
              as: CashOperationsAdmin
              captures: { err: $.data.error_id }
            - call: "POST /vault-cash/seasonal-windows"
              payload: { site_id: "${s_id}", name: "W3", start_date: "2026-12-27", end_date: "2027-01-02", multiplier_bps: 13000 }
              as: CashOperationsAdmin
              captures: { w3_id: $.data.id }
          assert:
            - "W2 rejected 409 ERR_SEASONAL_WINDOW_OVERLAP"
            - "W3 created (${w3_id} present) — adjacency with zero-day gap is allowed"

      - name: duplicate_reconciliation_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_DUPLICATE_RECONCILIATION]"]
        distinguishing_aspect: "(site_id, business_date) is unique; the second create for the same pair fails 409 ERR_DUPLICATE_RECONCILIATION."
        test_recipe:
          setup: ["Site S; custodian U1; recon R1 for 2026-08-02"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/reconciliations"
              payload: { site_id: "${s_id}", business_date: "2026-08-02", opening_balance_cents: 5000000 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /vault-cash/reconciliations"
              payload: { site_id: "${s_id}", business_date: "2026-08-02", opening_balance_cents: 5000000 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected 409 ERR_DUPLICATE_RECONCILIATION"

      - name: order_bundle_multiple_violation_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_INVALID_DENOMINATION_MIX]"]
        distinguishing_aspect: "ORDER direction requires strap_count %% 10 == 0 for denom <= 2000; 3 straps of 2000-cent notes is rejected 422 while a DEPOSIT order accepts any strap count."
        test_recipe:
          setup: ["Site S; coord U1; ORDER O1 and DEPOSIT O2, both DRAFT"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 10000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "ORDER", business_date: "2026-08-03" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o1_id: $.data.id, o1_v: $.data.version }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "DEPOSIT", business_date: "2026-08-03" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o2_id: $.data.id, o2_v: $.data.version }
          trigger:
            - call: "POST /vault-cash/fed-orders/${o1_id}/lines"
              payload: { denomination_cents: 2000, strap_count: 3, expected_fed_order_version: "${o1_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /vault-cash/fed-orders/${o2_id}/lines"
              payload: { denomination_cents: 2000, strap_count: 3, expected_fed_order_version: "${o2_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { l2_cents: $.data.line_cents }
          assert:
            - "ORDER line rejected 422 ERR_INVALID_DENOMINATION_MIX (3 %% 10 != 0)"
            - "DEPOSIT line accepted: line_cents ${l2_cents} == 600000"

      - name: carrier_liability_exceeded_alone
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_CARRIER_LIABILITY_EXCEEDED]"]
        distinguishing_aspect: "With insurance headroom ample, a declared value above the carrier per-truck cap fails on the fiscal liability check alone — isolating priority 18 from the priority-10 insurance check."
        test_recipe:
          setup: ["Sites A (fit 10,000,000) and B (coverage 100,000,000); carrier C cap 500,000; coord U1 on A"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "A", site_type: "CENTRAL", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 5, opening_fit_cents: 10000000 }
              as: CashOperationsAdmin
              captures: { a_id: $.data.id }
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "B", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 5, opening_fit_cents: 0 }
              as: CashOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /vault-cash/carriers"
              payload: { name: "C", liability_cap_per_truck_cents: 500000 }
              as: CashOperationsAdmin
              captures: { c_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${a_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/cash-shipments"
              payload: { carrier_id: "${c_id}", origin_site_id: "${a_id}", destination_site_id: "${b_id}", declared_value_cents: 600000, scheduled_departure_at: "2026-08-10T10:00:00Z", scheduled_arrival_at: "2026-08-10T12:00:00Z" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected 402 ERR_CARRIER_LIABILITY_EXCEEDED (insurance headroom 99,000,000 was NOT the binding constraint)"

      - name: fitness_input_exceeds_unfit_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_INSUFFICIENT_UNFIT_BALANCE]"]
        distinguishing_aspect: "Batch input 200,000 against site unfit 100,000 fails 422 ERR_INSUFFICIENT_UNFIT_BALANCE and escrows nothing."
        test_recipe:
          setup: ["Site S unfit 100,000 fit 1,000,000 (NORMAL); custodian U1"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 1000000, opening_unfit_cents: 100000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/fitness-batches"
              payload: { site_id: "${s_id}", input_unfit_cents: 200000 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected 422 ERR_INSUFFICIENT_UNFIT_BALANCE"
            - "GET /vault-cash/vault-sites/${s_id}.on_hand_unfit_cents == 100000 (no escrow taken)"

      - name: sod_report_by_seizer_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SOD_VIOLATION]", "roles[ComplianceOfficer]"]
        distinguishing_aspect: "Segregation of duties on clean state: case SEIZED by U1; the same human (X-User-ID U1) wearing the ComplianceOfficer role cannot report it — reporter must differ from seizer."
        test_recipe:
          setup: ["Site S fit 5,000,000; staff U1 and U2 on S; case K SEIZED by U1 (as VaultCustodian)"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "User One", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "User Two", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u2_id: $.data.id }
            - call: "POST /vault-cash/counterfeit-cases"
              payload: { site_id: "${s_id}", denomination_cents: 2000, note_count: 25 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { k_id: $.data.id }
            - call: "POST /vault-cash/counterfeit-cases/${k_id}/seize"
              payload: {}
              as: VaultCustodian
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /vault-cash/counterfeit-cases/${k_id}/report"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /vault-cash/counterfeit-cases/${k_id}/report"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${u2_id}"
          assert:
            - "report by seizer rejected 403 ERR_SOD_VIOLATION"
            - "report by U2 succeeds: CounterfeitCase.${k_id}.status == REPORTED and reported_by_staff_id == ${u2_id}"

      - name: sod_recon_lock_by_counter_rejected_then_peer_locks
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "state_machines.Reconciliation.BALANCED_to_LOCKED", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "The counting custodian cannot lock their own count; a peer custodian of the same site can. State is valid (BALANCED) in both attempts — only the SoD rule differs."
        test_recipe:
          setup: ["Site S fit 5,000,000; custodians U1, U2 on S; recon R for 2026-08-02 counted 5,000,000 by U1 → BALANCED"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U2", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u2_id: $.data.id }
            - call: "POST /vault-cash/reconciliations"
              payload: { site_id: "${s_id}", business_date: "2026-08-02", opening_balance_cents: 5000000 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { r_id: $.data.id }
            - call: "POST /vault-cash/reconciliations/${r_id}/count"
              payload: { counted_on_hand_cents: 5000000 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /vault-cash/reconciliations/${r_id}/lock"
              payload: {}
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /vault-cash/reconciliations/${r_id}/lock"
              payload: {}
              as: VaultCustodian
              as_user_id: "${u2_id}"
          assert:
            - "lock by counter U1 rejected 403 ERR_SOD_VIOLATION"
            - "lock by peer U2 succeeds: Reconciliation.${r_id}.status == LOCKED, approved_by_staff_id == ${u2_id}"

      - name: deposit_exceeding_cash_on_hand_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_INSUFFICIENT_CASH_FOR_DEPOSIT]"]
        distinguishing_aspect: "DEPOSIT face 200,000 against fit 100,000 + unfit 50,000 fails 422 ERR_INSUFFICIENT_CASH_FOR_DEPOSIT at submit."
        test_recipe:
          setup: ["Site S fit 100,000 unfit 50,000 (NORMAL); coord U1; DEPOSIT order with line denom 100 x 20 straps (face 200,000)"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 100000, opening_unfit_cents: 50000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "DEPOSIT", business_date: "2026-08-03" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o_id}/lines"
              payload: { denomination_cents: 100, strap_count: 20, expected_fed_order_version: "${o_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /vault-cash/fed-orders/${o_id}/submit"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rejected 422 ERR_INSUFFICIENT_CASH_FOR_DEPOSIT; order remains DRAFT"

  # --------------------------------------------------------------- endpoints ---
  - section: endpoints
    instances:
      - name: success_envelope_shape
        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, and data; object endpoints use response_type object."
        test_recipe:
          setup: ["One site created"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 50000000, insurance_coverage_cents: 80000000, dock_capacity: 2 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /vault-cash/vault-sites/${s_id}"
              payload: {}
              as: CashOperationsAdmin
          assert:
            - "response has meta.api_request_id (non-empty) and meta.api_request_timestamp (ISO8601)"
            - "response_type == object; data.id == ${s_id}"

      - name: error_envelope_shape
        claim_type: standard_crud
        grounds: ["response_envelope", "errors[ERR_FED_ORDER_NOT_FOUND]"]
        distinguishing_aspect: "Every error response carries response_type error and data.error_id + data.message."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /vault-cash/fed-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: CashOperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "404; response_type == error; data.error_id == ERR_FED_ORDER_NOT_FOUND; data.message non-empty"

      - name: pagination_limit_101_rejected
        claim_type: standard_crud
        grounds: ["response_envelope", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "pagination_defaults cap limit at 100; limit=101 fails 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /vault-cash/vault-sites?limit=101"
              payload: {}
              as: CashOperationsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "rejected 400 ERR_INVALID_REQUEST"

      - name: atm_forecast_load_settle_residual_cycle
        claim_type: computed_read
        grounds: ["endpoints[POST /vault-cash/atm-forecasts/{forecastId}/load]", "endpoints[POST /vault-cash/atm-forecasts/{forecastId}/settle]", "calculations.atm_forecast_projection"]
        distinguishing_aspect: "Full forecast money cycle: publish→load debits the vault 1,800,000 and credits the ATM; settle of 1,000,000 withdrawals returns the 5,800,000 residual to the vault and zeroes the cassette — every hop visible in derived fields."
        test_recipe:
          setup: ["Site S fit 50,000,000 (NORMAL); ATM X cap 10,000,000 opening 5,000,000 ACTIVE; analyst A1; DRAFT forecast F (TRAILING, load 1,800,000)"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/atm-machines"
              payload: { site_id: "${s_id}", terminal_code: "ATM-X", cash_capacity_cents: 10000000, opening_balance_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { x_id: $.data.id, x_v: $.data.version }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Analyst A1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /vault-cash/atm-forecasts"
              payload: { atm_id: "${x_id}", forecast_date: "2026-08-10", w1_cents: 1000000, w2_cents: 2000000, w3_cents: 3000000 }
              as: AtmAnalyst
              as_user_id: "${a1_id}"
              captures: { f_id: $.data.id }
            - call: "POST /vault-cash/atm-forecasts/${f_id}/publish"
              payload: { expected_atm_version: "${x_v}" }
              as: AtmAnalyst
              as_user_id: "${a1_id}"
          trigger:
            - call: "POST /vault-cash/atm-forecasts/${f_id}/load"
              payload: {}
              as: AtmAnalyst
              as_user_id: "${a1_id}"
            - call: "POST /vault-cash/atm-forecasts/${f_id}/settle"
              payload: { actual_withdrawals_cents: 1000000 }
              as: AtmAnalyst
              as_user_id: "${a1_id}"
          assert:
            - "after load: site fit == 48200000 and ATM balance == 6800000 (5,000,000 + 1,800,000)"
            - "after settle: AtmForecast.${f_id}.status == SETTLED and residual_balance_cents == 5800000"
            - "ATM current_balance_cents == 0 (residual cassette returned)"
            - "GET /vault-cash/vault-sites/${s_id}.on_hand_fit_cents == 54000000 (50,000,000 - 1,800,000 + 5,800,000)"
            - "GET /vault-cash/cash-ledger-entries?site_id=${s_id} contains ATM_LOAD -1800000 and ATM_RESIDUAL_RETURN +5800000 on 2026-08-01"

      - name: fed_advice_dispute_cycle_adjusts_basis
        claim_type: conditional_action
        grounds: ["state_machines.FedOrder.RECEIVED_to_DISPUTED", "state_machines.FedOrder.DISPUTED_to_RECONCILED", "entities.FedOrder.fields.settled_basis_cents"]
        distinguishing_aspect: "Advice deltas are basis-relative: first advice 1,800,000 vs face 2,000,000 posts -200,000 and DISPUTES; a corrective advice of 2,000,000 posts +200,000 against the new basis and RECONCILES — net cash effect zero across the dispute cycle."
        test_recipe:
          setup: ["Site S fit 5,000,000 (NORMAL); coord U1; carrier C; DEPOSIT order O face 2,000,000 (denom 2000 x 10) ACKNOWLEDGED; shipment LOADED (fit debited to 3,000,000), departed, verified matched (order RECEIVED, basis 2,000,000)"]
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "CENTRAL", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/carriers"
              payload: { name: "C", liability_cap_per_truck_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { c_id: $.data.id }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "DEPOSIT", business_date: "2026-08-03" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o_id}/lines"
              payload: { denomination_cents: 2000, strap_count: 10, expected_fed_order_version: "${o_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/fed-orders/${o_id}/submit"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/fed-orders/${o_id}/acknowledge"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/cash-shipments"
              payload: { fed_order_id: "${o_id}", carrier_id: "${c_id}", scheduled_departure_at: "2026-08-02T10:00:00Z", scheduled_arrival_at: "2026-08-02T12:00:00Z" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { sh_id: $.data.id }
            - call: "POST /vault-cash/cash-shipments/${sh_id}/load"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/cash-shipments/${sh_id}/depart"
              payload: {}
              as: CarrierDispatcher
              as_user_id: "${c_id}"
            - call: "POST /vault-cash/cash-shipments/${sh_id}/verify"
              payload: { counted_value_cents: 2000000 }
              as: CarrierDispatcher
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /vault-cash/fed-orders/${o_id}/record-fed-advice"
              payload: { counted_total_cents: 1800000 }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_disputed: $.data.status }
            - call: "POST /vault-cash/fed-orders/${o_id}/record-fed-advice"
              payload: { counted_total_cents: 2000000 }
              as: FedCoordinator
              as_user_id: "${u1_id}"
          assert:
            - "first advice: status ${o_disputed} == DISPUTED; settled_basis_cents == 1800000; site fit == 2800000 (3,000,000 - 200,000 delta)"
            - "second advice: FedOrder.${o_id}.status == RECONCILED; settled_basis_cents == 2000000; advice_count == 2"
            - "site fit restored to 3000000 — basis-relative deltas net to zero across the dispute cycle"

  # -------------------------------------------------------------------- rbac ---
  - section: rbac
    instances:
      - name: compliance_officer_full_case_lifecycle
