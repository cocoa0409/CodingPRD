          window_end: '2026-08-05T00:00:00Z'
        as: IncidentCommander
      - call: POST /emergency/patient-records
        payload:
          incident_id: ${inc_id}
          patient_ref: P-T
          triage_category: DELAYED
          arrival_at: '2026-08-01T00:05:00Z'
        as: PlanningChief
        captures:
