      - name: charge_conservation_across_provision_and_release
        grounds:
          - calculations.sync_seat_charge
          - state_machines.AppAccount.RESERVED_or_ACTIVE_to_RELEASED
          - entities.AppAccount.fields.seat_charge_cents
          - entities.AppAccount.fields.refunded_charge_cents
          - entities.VendorApp.fields.committed_charge_cents
          - entities.Term.fields.add_drop_cutoff_date
        distinguishing_aspect: "A DIFFERENT conserved quantity from 9a — CENTS rather than seats — and it is conserved only CONDITIONALLY: committed_charge_cents == sum(seat_charge_cents) - sum(refunded_charge_cents) always holds, but a release after the add/drop cutoff refunds nothing, so money does NOT return to its baseline even though the seat does. Releasing inside the window returns 1000; releasing on 2026-09-16 returns 0 while consumed_seats still falls to 0."
