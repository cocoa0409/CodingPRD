              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /curation-reviews/${rev_id}/revoke"
              payload: {}
              as: CatalogCurator
              captures: { rev_v: $.data.version }
            - call: "POST /curation-reviews/${rev_id}/revoke"
              payload: {}
              as: CatalogCurator
              captures: { error_id: $.data.error_id }
          assert:
            - "the first revoke returns 200, CurationReview.${rev_id}.review_status == REVOKED and CatalogItem.${item_id}.curation_review_state == UNREVIEWED"
            - "the second revoke returns 409 with error_id == ERR_INVALID_STATE"
            - "CurationReview.${rev_id}.version is unchanged by the rejected second revoke"
            - "CatalogItem.${item_id}.curation_review_state is still UNREVIEWED"

      - name: dc_posture_lifecycle_is_automatic_on_the_stock_threshold
        claim_type: Valid Transition
        grounds:
          - state_machines.DistributionCenter.OPEN_to_RESTRICTED
          - state_machines.DistributionCenter.RESTRICTED_to_OPEN
          - entities.DistributionCenter.fields.operations_posture
          - entities.DistributionCenter.fields.inbound_capacity_units
        distinguishing_aspect: "The OPEN/RESTRICTED axis is driven without any posture endpoint by the DC's own reservation arithmetic: with inbound_capacity_units 10 and RESTRICTED_RESERVE_RATIO 0.90 the threshold ceil(10 * 0.90) is 9, so an allocation taking inbound_reserved_units to exactly 9 already reads RESTRICTED while the freed order drops it back to OPEN."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. DC BOS with inbound_capacity_units 10 and a second DC DAL with inbound_capacity_units 900 so the selection stays deterministic."
