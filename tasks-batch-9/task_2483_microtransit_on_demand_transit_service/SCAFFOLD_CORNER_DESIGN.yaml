            - "the first offer returns HTTP 201"
            - "the replayed-token offer returns HTTP 412 with data.error_id == ERR_STALE_VEHICLE_BLOCK_VERSION"
            - "immediately after the 412, VehicleBlock.${b1_id}.seats_committed == 1 and TripRequest.${t2_id}.status == RECEIVED with assigned_block_id == null"
            - "the retry with the fresh token returns HTTP 201 and PoolAssignment.${pa2_id}.state == OFFERED"
            - "VehicleBlock.${b1_id}.seats_committed == 2 after the retry"
            - "${b1_v_open} == ${b1_v_create} + 1, ${b1_v_fresh} == ${b1_v_open} + 1 and ${b1_v_final} == ${b1_v_fresh} + 1 — every successful write bumps version by exactly 1 and the rejected write bumps nothing"

      - name: stale_expected_service_zone_version_blocks_the_forecast_publish
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.forecast-create-stale-zone
          - errors.ERR_STALE_SERVICE_ZONE_VERSION
        distinguishing_aspect: "Here the zone version is advanced by writes that have nothing to do with forecasting — a suspend/activate cycle — proving the OCC token guards the whole ServiceZone row and not just its forecast history. The zone is ACTIVE again when the stale publish is attempted, so 412 cannot be confused with a zone-state validation."
        test_recipe:
          setup:
            - "Zone RBM created then activated; the version is captured at activation, then a suspend/activate cycle advances it twice."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T05:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
              captures: { z_v_stale: $.data.version }
            - call: "POST /service-zones/${z_id}/suspend"
              payload: {}
              as: ZoneAdmin
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
              captures: { z_v_now: $.data.version }
          trigger:
            - call: "POST /demand-forecasts"
              payload: { zone_id: "${z_id}", window_start_utc: "2026-08-03T06:00:00Z", window_end_utc: "2026-08-03T10:00:00Z", forecast_trips: 10, peak_factor: 1.20, expected_service_zone_version: "${z_v_stale}" }
              as: ZoneAdmin
            - call: "POST /demand-forecasts"
              payload: { zone_id: "${z_id}", window_start_utc: "2026-08-03T06:00:00Z", window_end_utc: "2026-08-03T10:00:00Z", forecast_trips: 10, peak_factor: 1.20, expected_service_zone_version: "${z_v_now}" }
              as: ZoneAdmin
              captures: { f1_id: $.data.id }
            - call: "GET /service-zones/${z_id}"
              payload: {}
              as: ZoneAdmin
              captures: { z_v_after: $.data.version }
          assert:
            - "the stale publish returns HTTP 412 with data.error_id == ERR_STALE_SERVICE_ZONE_VERSION"
            - "immediately after the 412, GET /demand-forecasts?zone_id=${z_id} returns total_count == 0"
            - "the publish with the current token returns HTTP 201 and DemandForecast.${f1_id}.state == PUBLISHED"
            - "${z_v_now} == ${z_v_stale} + 2 (suspend and activate each bumped the zone)"
            - "${z_v_after} == ${z_v_now} + 1 (publishing writes the parent zone)"
            - "ServiceZone.${z_id}.status == ACTIVE throughout the trigger"

      - name: multi_hop_cascade_is_covered_by_the_difficulty_probe
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers, endpoints.POST_vehicle-blocks_id_cancel]
        excluded_because:
          difficulty_instance: block_cancel_cascade_four_hops_to_no_service
          rationale: "That instance verifies the deepest declared chain end to end — block cancel releases its assignments, each release recomputes the block's capacity and index window, each trip is re-queued and the trip that has exhausted its match attempts lands in NO_SERVICE with the zone's unserved_trip_count recomputed — including ordering sensitivity, which a shallower cascade test cannot expose."

      - name: dual_variant_divergence_is_covered_by_the_difficulty_probe
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers, calculations.trip_fare]
        excluded_because:
          difficulty_instance: trip_fare_provisional_quote_vs_settled_charge_band_shift
          rationale: "Both variants of trip_fare are computed over the same trip there, and the delta on the switch is asserted as the ledger rows written at settlement, which is exactly the layer's 'both variants plus delta on switch' claim in its strongest form."

