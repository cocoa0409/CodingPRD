              as: PosAssociate
              captures: { cardA_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 6000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${cardA_id}", pos_terminal_id: "T-12", packaging_seal_intact: true }
              as: PosAssociate
              captures: { irA_id: $.data.id }
            - call: "POST /issuance-requests/${irA_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-1202" }
              as: PosAssociate
              captures: { cardB_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 6000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${cardB_id}", pos_terminal_id: "T-12", packaging_seal_intact: true }
              as: PosAssociate
              captures: { irB_id: $.data.id }
            - call: "POST /issuance-requests/${irB_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards/${cardA_id}/balance-inquiries"
              payload: { channel: "WEB", requester_ip_hash: "iph-a1" }
              as: ResellerPartner
              as_user_id: "partner-2"
            - call: "POST /gift-cards/${cardA_id}/balance-inquiries"
              payload: { channel: "WEB", requester_ip_hash: "iph-a1" }
              as: ResellerPartner
              as_user_id: "partner-2"
            - call: "POST /gift-cards/${cardA_id}/balance-inquiries"
              payload: { channel: "WEB", requester_ip_hash: "iph-a1" }
              as: ResellerPartner
              as_user_id: "partner-2"
            - call: "POST /gift-cards/${cardA_id}/balance-inquiries"
              payload: { channel: "WEB", requester_ip_hash: "iph-a1" }
              as: ResellerPartner
              as_user_id: "partner-2"
              captures: { a_count: $.data.velocity_count_at_inquiry, a_score: $.data.drain_score_at_inquiry }
            - call: "GET /gift-cards/${cardA_id}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-2"
              captures: { postureA: $.data.risk_posture, scoreA: $.data.drain_risk_score_inquiry }
            - call: "POST /gift-cards/${cardB_id}/posture"
              payload: { risk_posture: "RESTRICTED", reason: "suspected drain pattern" }
              as: RiskManager
              as_user_id: "risk-2"
              captures: { postureB: $.data.risk_posture }
            - call: "POST /reseller-listings"
              payload: { card_id: "${cardA_id}", marketplace_name: "GiftBay", asking_price_cents: 5400, listed_balance_cents: 6000 }
              as: ResellerPartner
              as_user_id: "partner-2"
              captures: { listA_id: $.data.id, listA_state0: $.data.state }
            - call: "POST /reseller-listings"
              payload: { card_id: "${cardB_id}", marketplace_name: "GiftBay", asking_price_cents: 5400, listed_balance_cents: 6000 }
              as: ResellerPartner
              as_user_id: "partner-2"
              captures: { listB_id: $.data.id, listB_state0: $.data.state }
          trigger:
            - call: "POST /reseller-listings/${listA_id}/validate"
              payload: { validation_note: "routine marketplace check" }
              as: FraudAnalyst
              as_user_id: "analyst-2"
              captures: { stateA: $.data.state, reasonA: $.data.block_reason }
            - call: "POST /reseller-listings/${listB_id}/validate"
              payload: { validation_note: "routine marketplace check" }
              as: FraudAnalyst
              as_user_id: "analyst-2"
              captures: { stateB: $.data.state, reasonB: $.data.block_reason }
          assert:
            - "${listA_state0} == SUBMITTED and ${listB_state0} == SUBMITTED — identical starting points"
            - "${a_count} == 4 and ${a_score} == 48 and ${scoreA} == 48 — below the drain_restrict_score_threshold of 70, so check 4 (DRAIN_SCORE) does not fire either"
            - "GET /draining-alerts?card_id=${cardA_id} returns total_count == 0 — four inquiries is one short of the velocity threshold"
            - "${postureA} == WATCH and ${postureB} == RESTRICTED — the ONLY difference between the two listings"
            - "ResellerListing.${listA_id}.state == VALIDATED"
            - "ResellerListing.${listA_id}.block_reason == null"
            - "ResellerListing.${listA_id}.listed_balance_cents == 6000 == GiftCard.${cardA_id}.current_balance_cents, so check 3 (BALANCE_MISMATCH) was satisfied"
            - "ResellerListing.${listB_id}.state == BLOCKED"
            - "ResellerListing.${listB_id}.block_reason == CARD_RISK_POSTURE"
            - "ResellerListing.${listB_id}.listed_balance_cents == 6000 == GiftCard.${cardB_id}.current_balance_cents — the balance itself was fine; the CARD's state blocked it at check 2"
            - "GET /reseller-listings?state=BLOCKED returns total_count == 1"
            - "GET /gift-cards/${cardA_id}/reseller-listings returns total_count == 1"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: liability_period_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - calculations.liability_period_overlap
          - validations[priority=70]
          - errors.ERR_PERIOD_OVERLAP
          - state_machines.LiabilityPeriod.initial_state
          - entities.LiabilityPeriod.fields.period_start
          - entities.LiabilityPeriod.fields.period_end
        distinguishing_aspect: |
          RESOURCE = the LiabilityPeriod accounting calendar, INTERVAL SEMANTICS
          = HALF-OPEN [start, end): two back-to-back months touching exactly at
          2026-09-01T00:00:00Z must BOTH be accepted, while a genuinely
          straddling interval is rejected — a closed-interval implementation
          wrongly rejects the legal adjacency.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "No LiabilityPeriods exist yet — the calendar starts empty so every rejection below is attributable to the interval arithmetic alone."
          setup_api_calls:
            - call: "GET /liability-periods"
              payload: {}
              as: LiabilityAccountant
          trigger:
            - call: "POST /liability-periods"
              payload: { label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: LiabilityAccountant
              captures: { p_aug_id: $.data.id, p_aug_state: $.data.state }
            - call: "POST /liability-periods"
              payload: { label: "2026-09", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: LiabilityAccountant
              captures: { p_sep_id: $.data.id, p_sep_state: $.data.state }
            - call: "POST /liability-periods"
              payload: { label: "2026-08-straddle", period_start: "2026-08-31T00:00:00Z", period_end: "2026-09-15T00:00:00Z" }
              as: LiabilityAccountant
              captures: { err: $.data.error_id }
          assert:
            - "the calendar started empty: the setup GET /liability-periods returns total_count == 0"
            - "ADJACENCY IS LEGAL — the September period was created: ${p_sep_state} == OPEN"
            - "LiabilityPeriod.${p_aug_id}.state == OPEN and period_end == 2026-09-01T00:00:00Z"
            - "LiabilityPeriod.${p_sep_id}.state == OPEN and period_start == 2026-09-01T00:00:00Z"
            - "the shared instant 2026-09-01T00:00:00Z belongs ONLY to the September period under [start, end) semantics"
            - "STRADDLE IS ILLEGAL — HTTP status == 409 and ${err} == ERR_PERIOD_OVERLAP"
            - "GET /liability-periods returns total_count == 2 — the straddling period was not persisted"
            - "GET /liability-periods?state=OPEN returns total_count == 2"

      - name: redemption_hold_aggregate_capacity_over_closed_intervals
        grounds:
          - calculations.hold_capacity_check
          - validations[priority=76]
          - errors.ERR_HOLD_CAPACITY_EXCEEDED
          - state_machines.RedemptionHold.initial_state
          - concurrency_rules.hold-create-stale-card
          - entities.GiftCard.fields.held_amount_cents
          - entities.GiftCard.fields.available_balance_cents
        distinguishing_aspect: |
          A DIFFERENT resource entity (GiftCard funds, not the accounting
          calendar) under DIFFERENT interval semantics: RedemptionHold windows
          are CLOSED [start, end] and, unlike periods, are allowed to overlap
          freely — the constraint is the AGGREGATE held amount against the
          balance, so a disjoint third hold is still rejected when the running
          total would exceed 10000, and accepted when it lands exactly on it.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "One RetailStore, one CardRack, one ACTIVE PHYSICAL GiftCard with face value 10000 cents."
            - "Two ACTIVE RedemptionHolds on DISJOINT closed windows — 4000 cents over [00:00, 06:00] and 5000 cents over [12:00, 18:00] — totalling 9000 cents held."
            - "The card version is re-read before each hold because POST /gift-cards/{id}/redemption-holds carries the optimistic-concurrency field expected_gift_card_version."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Metro Wholesale", region_code: "NE", address_line: "500 Metro Pkwy" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-M1", expected_card_count: 11 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
