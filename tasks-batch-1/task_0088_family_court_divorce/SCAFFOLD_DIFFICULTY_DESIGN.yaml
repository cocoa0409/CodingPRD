      # ----- Instance 2: Hearings — HALF-OPEN intervals (adjacency allowed) -----
      - name: hearing_back_to_back_half_open_allowed_but_overlap_rejected
        grounds:
          - validations[priority=9]
          - errors[ERR_COURTROOM_DOUBLE_BOOKED]
          - entities.Hearing.fields.courtroom_code
        distinguishing_aspect: |
          Hearing overlap on a DIFFERENT resource (courtroom) uses HALF-OPEN [start,end):
          a back-to-back hearing starting exactly when the first ends (10:00==10:00) is
