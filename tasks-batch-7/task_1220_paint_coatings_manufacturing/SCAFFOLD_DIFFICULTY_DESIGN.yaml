        grounds:
          - calculations.fill_weigh_check
          - entities.Container.fields.fill_variance_g
        distinguishing_aspect: |
          Weight metric at the exact tolerance edge: a GALLON can at 4531 g has
          |variance| == tolerance 69 g and passes (<= semantics, born IN_STOCK),
          while 4530 g exceeds it by one gram and is born QUARANTINED. Reached via
          POST /coatings/batches/{id}/fills.
        test_recipe:
          setup:
            - "F1 ACTIVE; M1; 3-gal batch B1 driven to QC_APPROVED"
