        claim_type: error_triggerable
        grounds:
          - errors[ERR_PROPERTY_NOT_FOUND]
          - errors[ERR_VALIDATION_FAILED]
        distinguishing_aspect: "Every failure returns the fixed error envelope: meta.api_request_id, meta.api_request_timestamp, response_type 'error' and a data object holding exactly error_id and a non-empty message."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
          trigger:
            - call: "GET /properties/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
