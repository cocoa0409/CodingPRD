# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2839_medical_device_vendor_credentialing_or_access
#
# Nine rule_id blocks, two instances each = 18 instances.
# Every numeric assert below was executed against the §1.3 formulas and their
# constants before being written down; no assert contains an unevaluated
# expression. The logical clock starts at 2026-08-01T00:00:00Z, so any setup
# that does not call POST /vendor-access/_clock/set_current_utc is running at
# that instant.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: vendor_provisional_vs_adjudicated_score_diverge_on_open_incident
        grounds:
          - calculations.vendor_compliance_score
          - entities.Vendor.fields.provisional_compliance_score
          - entities.Vendor.fields.adjudicated_compliance_score
          - state_machines.Incident.REPORTED_to_SUBSTANTIATED
        distinguishing_aspect: |
          Variant divergence on the Vendor entity domain (compliance risk scoring): with one MINOR
          incident still REPORTED and one MAJOR incident adjudicated SUBSTANTIATED, the provisional
          variant reads 89 and the adjudicated variant reads 92 from identical stored data, because
          only the provisional variant counts unadjudicated incidents.
        test_recipe:
          setup:
            - "Facility MW-01 and Vendor ORTHO exist; the vendor has one representative that is still PENDING_CREDENTIALING (no credential work is needed to report an incident)."
            - "One surgical case exists at MW-01."
            - "Two incidents are reported against the rep: one MINOR (weight 3) and one MAJOR (weight 8). Both are still REPORTED, so provisional reads 89 and adjudicated reads 100."
            - "Logical clock is at its 2026-08-01T00:00:00Z default throughout."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Mercy West Surgical Pavilion", code: "MW-01", spd_turnaround_hours: 8, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_mw_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Ortholine Devices Inc", vendor_code: "ORTHO" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_ortho_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_ortho_id}", full_name: "Dana Reyes", email: "dana.reyes@ortholine.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_dana_id: $.data.id }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_mw_id}", case_number: "CASE-9001", procedure_name: "Total Knee Arthroplasty", scheduled_start_utc: "2026-09-05T08:00:00Z", scheduled_end_utc: "2026-09-05T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_9001_id: $.data.id }
            - call: "POST /vendor-access/incidents"
              payload: { surgical_case_id: "${case_9001_id}", vendor_rep_id: "${rep_dana_id}", incident_type: "BADGE_MISUSE", severity: "MINOR", narrative: "Rep badge lent to a colleague at the kiosk." }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { inc_minor_id: $.data.id }
            - call: "POST /vendor-access/incidents"
              payload: { surgical_case_id: "${case_9001_id}", vendor_rep_id: "${rep_dana_id}", incident_type: "UNAPPROVED_PRODUCT_USE", severity: "MAJOR", narrative: "Non-catalogued trial spacer opened in the field." }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { inc_major_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/incidents/${inc_major_id}/adjudicate"
              payload: { outcome: "SUBSTANTIATED", adjudication_note: "Product was not on the approved catalogue." }
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
          assert:
            - "Vendor.${v_ortho_id}.provisional_compliance_score == 89"
            - "Vendor.${v_ortho_id}.adjudicated_compliance_score == 92"
            - "Vendor.${v_ortho_id}.adjudicated_compliance_score - Vendor.${v_ortho_id}.provisional_compliance_score == 3, exactly W_INCIDENT_MINOR, contributed solely by the still-REPORTED incident ${inc_minor_id}"
            - "Incident.${inc_major_id}.status == SUBSTANTIATED"
            - "Incident.${inc_major_id}.adjudicated_outcome == SUBSTANTIATED"
            - "Incident.${inc_minor_id}.status == REPORTED"
            - "VendorRep.${rep_dana_id}.access_status == PENDING_CREDENTIALING (a MAJOR substantiation does not suspend; only CRITICAL UNAPPROVED_PRODUCT_USE does)"

      - name: loaner_pinned_versus_current_deadline_basis_after_reschedule
        grounds:
          - calculations.loaner_delivery_deadline
          - calculations.loaner_late_minutes
          - entities.LoanerSet.fields.pinned_deadline_utc
          - entities.LoanerSet.fields.required_delivery_deadline_utc
          - entities.LoanerSet.fields.late_minutes_pinned_basis
          - entities.LoanerSet.fields.late_minutes_current_basis
          - state_machines.LoanerSet.DELIVERED_LATE_to_DELIVERED_ON_TIME
        distinguishing_aspect: |
          Variant divergence on the LoanerSet entity domain (sterile-processing scheduling), a
          different subject from the Vendor scorecard instance: after one reschedule the pinned-basis
          deadline stays 2026-09-09T14:00:00Z with 37 late minutes while the current-basis deadline
          moves to 2026-09-09T18:00:00Z with 0 late minutes, from one unchanged delivered_at_utc.
        test_recipe:
          setup:
            - "Facility ME-02 has spd_turnaround_hours 8 and spd_bay_count 2."
            - "Vendor SPNX has one approved implant product (product introduction request endorsed then approved by two different users)."
            - "Case CASE-9101 is an implant case scheduled 2026-09-10T14:00:00Z to 18:00:00Z, so original_scheduled_start_utc is pinned at 14:00."
            - "A 9-tray COMPLEX loaner set is registered: lead_hours = max(8 + 6 + 1, 24) = 24, so both deadline variants land on 2026-09-09T14:00:00Z."
            - "The set is received at 2026-09-09T14:37:00Z: 37 late minutes on both bases, DELIVERED_LATE, per-tray fee 125 cents, total 1125 cents assessed."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Mercy East Surgical Center", code: "ME-02", spd_turnaround_hours: 8, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_me_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Spinaxis Implants LLC", vendor_code: "SPNX" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_spnx_id: $.data.id, v_spnx_ver0: $.data.version }
            - call: "POST /vendor-access/product-introduction-requests"
              payload: { vendor_id: "${v_spnx_id}", facility_id: "${f_me_id}", product_name: "Pedicle Screw System X2", product_catalog_number: "PS-X2-770", manufacturer: "Spinaxis", is_implant: true, unit_cost_cents: 450000, expected_vendor_version: "${v_spnx_ver0}" }
              as: VendorAdmin
              as_user_id: "${v_spnx_id}"
              captures: { pir_x2_id: $.data.id }
            - call: "POST /vendor-access/product-introduction-requests/${pir_x2_id}/submit"
              payload: {}
              as: VendorAdmin
              as_user_id: "${v_spnx_id}"
            - call: "POST /vendor-access/product-introduction-requests/${pir_x2_id}/clinical-review"
              payload: { decision: "ENDORSE", review_note: "Matches the fusion service line standard." }
              as: ClinicalSponsor
              as_user_id: "user_sponsor_1"
            - call: "POST /vendor-access/product-introduction-requests/${pir_x2_id}/value-analysis-decision"
              payload: { decision: "APPROVE", decision_note: "Price parity confirmed." }
              as: ValueAnalysisApprover
              as_user_id: "user_vac_1"
            - call: "GET /vendor-access/approved-products?product_introduction_request_id=${pir_x2_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ap_x2_id: "$.data[0].id" }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_me_id}", case_number: "CASE-9101", procedure_name: "Lumbar Fusion L4-L5", scheduled_start_utc: "2026-09-10T14:00:00Z", scheduled_end_utc: "2026-09-10T18:00:00Z", implant_required: true }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_9101_id: $.data.id }
            - call: "GET /vendor-access/surgical-cases/${case_9101_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { case_9101_ver: $.data.version }
            - call: "POST /vendor-access/loaner-sets"
              payload: { surgical_case_id: "${case_9101_id}", approved_product_id: "${ap_x2_id}", tray_count: 9, reprocessing_complexity: "COMPLEX", expected_case_version: "${case_9101_ver}" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ls_9101_id: $.data.id }
            - call: "POST /vendor-access/loaner-sets/${ls_9101_id}/receive"
              payload: { delivered_at_utc: "2026-09-09T14:37:00Z" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
          trigger:
            - call: "POST /vendor-access/surgical-cases/${case_9101_id}/reschedule"
              payload: { new_scheduled_start_utc: "2026-09-10T18:00:00Z", new_scheduled_end_utc: "2026-09-10T22:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
          assert:
            - "SurgicalCase.${case_9101_id}.original_scheduled_start_utc == 2026-09-10T14:00:00Z"
            - "SurgicalCase.${case_9101_id}.scheduled_start_utc == 2026-09-10T18:00:00Z"
            - "LoanerSet.${ls_9101_id}.pinned_deadline_utc == 2026-09-09T14:00:00Z"
            - "LoanerSet.${ls_9101_id}.required_delivery_deadline_utc == 2026-09-09T18:00:00Z"
            - "LoanerSet.${ls_9101_id}.late_minutes_pinned_basis == 37"
            - "LoanerSet.${ls_9101_id}.late_minutes_current_basis == 0"
            - "LoanerSet.${ls_9101_id}.status == DELIVERED_ON_TIME"
            - "LoanerSet.${ls_9101_id}.fee_status == REVERSED"
            - "LoanerSet.${ls_9101_id}.assessed_late_fee_cents == 1125"
            - "Vendor.${v_spnx_id}.late_fee_balance_cents == 0"
            - "Vendor.${v_spnx_id}.adjudicated_compliance_score == 100"

  - rule_id: combinatorial_formula
    instances:

      - name: late_fee_rounds_per_tray_before_multiplying_by_tray_count
        grounds:
          - calculations.loaner_late_fee
          - calculations.loaner_delivery_deadline
          - entities.LoanerSet.fields.assessed_late_fee_cents
          - entities.Vendor.fields.late_fee_balance_cents
          - state_machines.LoanerSet.EXPECTED_to_DELIVERED_LATE
        distinguishing_aspect: |
          Mode (b) — nested rounding whose order is observable: round_half_up(37 * 2.5 * 1.35) = 125
          cents per tray times 9 trays = 1125 cents, whereas the sum-then-round order
          round_half_up(37 * 2.5 * 1.35 * 9) = 1124 cents. The scaffold pins round-per-tray-then-multiply
          and the assert distinguishes the two integers.
        test_recipe:
          setup:
            - "Facility NW-04 has spd_turnaround_hours 8 and spd_bay_count 2."
            - "Vendor TRAUMX has one approved non-implant product."
            - "Case CASE-9301 is a NON-implant case starting 2026-09-10T14:00:00Z, so lead_hours = max(8 + 6 + 1, 0) = 15 and the deadline is 2026-09-09T23:00:00Z."
            - "A 9-tray COMPLEX loaner set is registered against that case."
            - "Logical clock stays at the 2026-08-01T00:00:00Z default; delivered_at_utc is supplied explicitly."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Northwood Regional Hospital", code: "NW-04", spd_turnaround_hours: 8, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_nw_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Traumax Instruments GmbH", vendor_code: "TRAUMX" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_traumx_id: $.data.id, v_traumx_ver0: $.data.version }
            - call: "POST /vendor-access/product-introduction-requests"
              payload: { vendor_id: "${v_traumx_id}", facility_id: "${f_nw_id}", product_name: "Distal Femur Plating Set", product_catalog_number: "DF-410", manufacturer: "Traumax", is_implant: false, unit_cost_cents: 120000, expected_vendor_version: "${v_traumx_ver0}" }
              as: VendorAdmin
              as_user_id: "${v_traumx_id}"
              captures: { pir_df_id: $.data.id }
            - call: "POST /vendor-access/product-introduction-requests/${pir_df_id}/submit"
              payload: {}
              as: VendorAdmin
              as_user_id: "${v_traumx_id}"
            - call: "POST /vendor-access/product-introduction-requests/${pir_df_id}/clinical-review"
              payload: { decision: "ENDORSE" }
              as: ClinicalSponsor
              as_user_id: "user_sponsor_1"
            - call: "POST /vendor-access/product-introduction-requests/${pir_df_id}/value-analysis-decision"
              payload: { decision: "APPROVE" }
              as: ValueAnalysisApprover
              as_user_id: "user_vac_1"
            - call: "GET /vendor-access/approved-products?product_introduction_request_id=${pir_df_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ap_df_id: "$.data[0].id" }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_nw_id}", case_number: "CASE-9301", procedure_name: "Distal Femur ORIF", scheduled_start_utc: "2026-09-10T14:00:00Z", scheduled_end_utc: "2026-09-10T18:00:00Z", implant_required: false }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_9301_id: $.data.id }
            - call: "GET /vendor-access/surgical-cases/${case_9301_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { case_9301_ver: $.data.version }
            - call: "POST /vendor-access/loaner-sets"
              payload: { surgical_case_id: "${case_9301_id}", approved_product_id: "${ap_df_id}", tray_count: 9, reprocessing_complexity: "COMPLEX", expected_case_version: "${case_9301_ver}" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { ls_9301_id: $.data.id }
          trigger:
            - call: "POST /vendor-access/loaner-sets/${ls_9301_id}/receive"
              payload: { delivered_at_utc: "2026-09-09T23:37:00Z" }
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
          assert:
            - "LoanerSet.${ls_9301_id}.required_delivery_deadline_utc == 2026-09-09T23:00:00Z"
            - "LoanerSet.${ls_9301_id}.pinned_deadline_utc == 2026-09-09T23:00:00Z"
            - "LoanerSet.${ls_9301_id}.late_minutes_current_basis == 37"
            - "LoanerSet.${ls_9301_id}.status == DELIVERED_LATE"
            - "LoanerSet.${ls_9301_id}.assessed_late_fee_cents == 1125"
            - "LoanerSet.${ls_9301_id}.assessed_late_fee_cents != 1124 — the sum-then-round order is wrong"
            - "LoanerSet.${ls_9301_id}.fee_status == ASSESSED"
            - "Vendor.${v_traumx_id}.late_fee_balance_cents == 1125"
            - "Vendor.${v_traumx_id}.adjudicated_compliance_score == 95"

      - name: sweep_quota_tier_reset_pinned_evaluation_order
        grounds:
          - calculations.vendor_scorecard_tier_and_quota
          - calculations.vendor_compliance_score
          - calculations.vendor_access_quota_admission
          - entities.Vendor.fields.access_quota_in_effect
          - entities.Vendor.fields.authorizations_used_epoch
          - entities.Vendor.fields.scorecard_tier
          - entities.ComplianceSweep.fields.vendors_rescored_count
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency pinned to one order: the utilization ratio is taken
          from the PRE-sweep quota and the PRE-reset counter (5 / 4 = 1.25 > 1.0, so the 12-point
          overage penalty applies), giving adjudicated score 60, TIER_PROBATION and a new quota of 1.
          Resetting authorizations_used_epoch before taking the ratio yields 72, TIER_STANDARD and a
          quota of 4 — a different tier and a different quota, not merely a different score.
        test_recipe:
          setup:
            - "Facility NG-03 exists; Vendor CDLX starts at score 100, TIER_PLATINUM, access_quota_in_effect 4 (BASE_QUOTA), authorizations_used_epoch 0, last_sweep_epoch 0."
            - "Representative Ira Vance holds all four required credentials VERIFIED (issued 2026-07-01, expiring 2027-07-01), so the rep is CREDENTIALED and COMPLIANT."
            - "Five non-implant cases on 2026-09-01 through 2026-09-05, each 08:00-10:00, give five non-overlapping badge windows 07:00-10:30."
            - "All five authorizations are APPROVED: authorizations_used_epoch reaches 5, which is legal because the hard cap is floor(4 * 1.5) = 6."
            - "Two incidents are adjudicated SUBSTANTIATED against the rep: one CRITICAL (weight 20) and one MAJOR (weight 8), neither of type UNAPPROVED_PRODUCT_USE, so no rep suspension cascade fires."
            - "Immediately before the sweep the adjudicated score reads 72, because the overage penalty is only applied at sweep time."
          setup_api_calls:
            - call: "POST /vendor-access/facilities"
              payload: { name: "Northgate Ambulatory Surgery", code: "NG-03", spd_turnaround_hours: 6, spd_bay_count: 2 }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { f_ng_id: $.data.id }
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Cardiolux Devices SA", vendor_code: "CDLX" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_cdlx_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_cdlx_id}", full_name: "Ira Vance", email: "ira.vance@cardiolux.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_ira_id: $.data.id }
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_ira_id}", credential_type: "IMMUNIZATION_INFLUENZA", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "IMM-IRA-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_ira_flu_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_ira_flu_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_ira_id}", credential_type: "TRAINING_BLOODBORNE_PATHOGENS", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "BBP-IRA-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_ira_bbp_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_ira_bbp_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_ira_id}", credential_type: "BACKGROUND_CHECK", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "BGC-IRA-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_ira_bgc_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_ira_bgc_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_ira_id}", credential_type: "COI_GIFT_ATTESTATION", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "COI-IRA-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_ira_coi_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_ira_coi_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_ng_id}", case_number: "CASE-9201", procedure_name: "Pacemaker Generator Change 1", scheduled_start_utc: "2026-09-01T08:00:00Z", scheduled_end_utc: "2026-09-01T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_9201_id: $.data.id }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_ng_id}", case_number: "CASE-9202", procedure_name: "Pacemaker Generator Change 2", scheduled_start_utc: "2026-09-02T08:00:00Z", scheduled_end_utc: "2026-09-02T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_9202_id: $.data.id }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_ng_id}", case_number: "CASE-9203", procedure_name: "Pacemaker Generator Change 3", scheduled_start_utc: "2026-09-03T08:00:00Z", scheduled_end_utc: "2026-09-03T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_9203_id: $.data.id }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_ng_id}", case_number: "CASE-9204", procedure_name: "Pacemaker Generator Change 4", scheduled_start_utc: "2026-09-04T08:00:00Z", scheduled_end_utc: "2026-09-04T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_9204_id: $.data.id }
            - call: "POST /vendor-access/surgical-cases"
              payload: { facility_id: "${f_ng_id}", case_number: "CASE-9205", procedure_name: "Pacemaker Generator Change 5", scheduled_start_utc: "2026-09-05T08:00:00Z", scheduled_end_utc: "2026-09-05T10:00:00Z" }
              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_9205_id: $.data.id }
            - call: "POST /vendor-access/case-rep-authorizations"
              payload: { surgical_case_id: "${case_9201_id}", vendor_rep_id: "${rep_ira_id}", requested_role: "TECHNICAL_SUPPORT" }
              as: VendorAdmin
              as_user_id: "${v_cdlx_id}"
              captures: { auth_9201_id: $.data.id }
