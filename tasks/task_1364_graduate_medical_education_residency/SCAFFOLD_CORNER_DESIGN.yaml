            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/duty-hour-logs", payload: { resident_id: "${res}", started_at: "2026-08-03T00:00:00Z", ended_at: "2026-08-03T08:00:00Z" }, as: Resident, as_user_id: "${res}", captures: { l1: "$.data.id" } }
            - { call: "POST /residency-programs/duty-hour-logs/${l1}/attest", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "POST /residency-programs/duty-hour-logs", payload: { resident_id: "${res}", started_at: "2026-08-03T16:00:00Z", ended_at: "2026-08-04T00:00:00Z" }, as: Resident, as_user_id: "${res}", captures: { l2: "$.data.id" } }
            - { call: "POST /residency-programs/duty-hour-logs/${l2}/attest", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "GET /residency-programs/duty-hour-violations", payload: { resident_id: "${res}" }, as: ProgramDirector }
          trigger:
            - { call: "POST /residency-programs/duty-hour-logs", payload: { resident_id: "${res}", started_at: "2026-08-04T07:59:00Z", ended_at: "2026-08-04T12:00:00Z" }, as: Resident, as_user_id: "${res}", captures: { l3: "$.data.id" } }
            - { call: "POST /residency-programs/duty-hour-logs/${l3}/attest", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "GET /residency-programs/duty-hour-violations", payload: { resident_id: "${res}" }, as: ProgramDirector, captures: { v0: "$.data" } }
          assert:
            - "After l2 attest (gap exactly 8.00h from l1's 08:00 end to l2's 16:00 start): zero violations (gap == 8.00 passes; the rule is strict <)"
            - "After l3 attest (gap 2026-08-04T00:00 -> 07:59 = 7h59m = 7.98h): exactly one REST_8H violation with measured_value == 7.98, threshold_value == 8.00"
            - "No HOURS_80_AVG or DAY_OFF_4_IN_28 violation exists"

