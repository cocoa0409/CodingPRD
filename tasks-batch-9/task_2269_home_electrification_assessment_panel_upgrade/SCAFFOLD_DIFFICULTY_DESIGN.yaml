              payload: { measure_code: "HP-DUCT-01", measure_name: "Duct sealing and replacement", category: "HVAC", unit_incentive_cents: 250000, max_quantity: 1, measure_cap_cents: 250000, combined_cap_group: "HVAC_GROUP", required_panel_capacity_amps: 100, prerequisite_measure_code: "HP-HVAC-01", sort_order: 15 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Dev Rao", email: "dev@example.com", service_address_line1: "77 Dogwood Way", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /income-verifications/${iv_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /contractors"
              payload: { program_id: "${prog_id}", business_name: "Mesa Heating", license_number: "MC-3312", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_id: $.data.id }
            - call: "POST /contractors/${ctr_id}/enrollment-decision"
