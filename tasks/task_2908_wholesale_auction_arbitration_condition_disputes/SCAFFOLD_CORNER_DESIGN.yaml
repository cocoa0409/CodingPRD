              as: BlockClerk
              as_user_id: "clerk-01"
              captures: { sale_id: $.data.id }
            - call: "POST /arbitration/cases"
              payload: { sale_id: "${sale_id}", defect_class: "MECHANICAL", claim_amount_cents: 60000, odometer_at_claim: 84100, complaint_text: "Transmission slips under load" }
              as: BuyerRep
              as_user_id: "${buyer_id}"
              captures: { case_id: $.data.id }
            - call: "POST /arbitration/cases/${case_id}/evidence"
              payload: { evidence_type: "INSPECTION_REPORT", provider_name: "Statewide Vehicle Inspection", document_reference: "IR-77120", repair_estimate_cents: 285000 }
              as: BuyerRep
              as_user_id: "${buyer_id}"
            - call: "POST /arbitration/cases/${case_id}/open-review"
              payload: {}
              as: Arbitrator
              as_user_id: "arb-intake-01"
          trigger:
            - call: "POST /arbitration/cases/${case_id}/seller-response"
              payload: { response_type: "OFFER_REPAIR_ALLOWANCE", response_note: "Full policy limit plus a cent", seller_offer_cents: 290001 }
              as: SellerRep
              as_user_id: "${seller_id}"
              captures: { err: $.data.error_id }
            - call: "POST /arbitration/cases/${case_id}/seller-response"
