  # =====================================================================
  # RULE 9 — compensating_invariant
  # Differentiation: instance 1 conserves MONEY (gross aggregate interest ==
  # receivable + written_off + collected, across a waiver and its reversal);
  # instance 2 conserves a COUNT (Employer.active_iwo_count == the number of
  # that employer's IWOs in {SERVED, AMENDED}, across asymmetric terminations
  # and a rejected repeat).
  # =====================================================================
  - rule_id: compensating_invariant
    instances:

      - name: compromise_default_reinstates_written_off_interest
        grounds:
          - state_machines.CompromiseOffer.status.ACTIVE_to_DEFAULTED
          - state_machines.CompromiseOffer.status.PROPOSED_to_ACCEPTED
          - state_machines.CompromiseOffer.status.ACCEPTED_to_ACTIVE
          - calculations.compromise_settlement_amount
          - calculations.arrears_interest_accrual
          - entities.SupportCase.fields.interest_written_off_cents
          - entities.SupportCase.fields.interest_receivable_cents
          - entities.SupportCase.fields.total_collected_principal_cents
        distinguishing_aspect: |
          Declaring an ACTIVE compromise offer in default must reverse exactly
          the 4332 interest waiver and nothing else: interest_written_off_cents
          returns from 4332 to 0, interest_receivable_cents rises from 6426 to
          10758 (the identical gross aggregate figure), and the 71333 already
          collected is NOT clawed back — so gross interest and principal are
          each conserved across the compensation.
