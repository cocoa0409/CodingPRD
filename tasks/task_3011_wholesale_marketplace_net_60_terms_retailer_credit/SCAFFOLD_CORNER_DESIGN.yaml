            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
            - call: "POST /wholesale/brands"
              payload: { name: "Brand RR", contact_email: "rr@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 5000, qty: 2 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "GET /wholesale/orders/${o_id}/invoice"
              payload: {}
              as: PlatformAdmin
            - call: "GET /wholesale/orders/${o_id}/lines"
              payload: {}
              as: PlatformAdmin
              captures: { line0_amount: "$.data[0].amount_cents" }
            - call: "POST /wholesale/orders/${o_id}/ship"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "GET /wholesale/orders/${o_id}/invoice"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: "$.data[0].id" }
            - call: "GET /wholesale/orders/${o_id}/return-authorizations"
              payload: {}
              as: PlatformAdmin
          assert:
            - "invoice list is empty before ship and length 1 after ship (1:1 handled as array of 0-1)"
            - "lines list length 1 with amount_cents == 10000 and net_sold_qty == 2"
            - "return-authorizations list is empty before any RA is requested"
      - name: clock_default_and_set
        claim_type: computed_read
        grounds:
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Before any set call the logical clock reads exactly 2026-09-01T00:00:00Z; after a set it reads the new instant — the clock never follows wall-clock time."
        test_recipe:
          setup: ["empty database; no clock call yet"]
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { now1: $.data.now_iso8601 }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: PlatformAdmin
              captures: { now2: $.data.now_iso8601 }
          assert:
            - "setting to the default instant echoes now_iso8601 == 2026-09-01T00:00:00Z (startup default)"
            - "after the second set, now_iso8601 == 2026-09-15T12:00:00Z exactly"

