  # =========================================================================
  # Endpoints (§1.5) — CRUD, action, computed and conditional surfaces
  # =========================================================================
  - section: endpoints
    instances:

      - name: patch_speaker_updates_the_fee_range_and_bumps_the_version
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /speakers/{speakerId}]
          - entities.Speaker.fields.fee_ceiling_cents
        distinguishing_aspect: |
          A partial update must touch only the supplied fields, bump version by exactly 1, refresh
          updated_at, and leave every derived counter alone — while the new range immediately
          governs the next quotation.
        test_recipe:
          setup:
            - "One ACTIVE roster speaker with fee range [1000000, 2000000]"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY", "LEADERSHIP"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", travel_buffer_days: 1, tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp: $.data.id, v0: $.data.version }
          trigger:
            - call: "PATCH /speakers/${sp}"
              payload: { fee_floor_cents: 1200000, fee_ceiling_cents: 2400000, travel_class: "BUSINESS" }
              as: BureauAdmin
              captures: { fl: $.data.fee_floor_cents, fc: $.data.fee_ceiling_cents, v1: $.data.version }
          assert:
            - "fee_floor_cents 1200000, fee_ceiling_cents 2400000 and travel_class BUSINESS are stored; version becomes 2"
            - "full_name, topics, travel_buffer_days 1 and tax_form_status ON_FILE are untouched"
            - "roster_status is still ACTIVE, roster_tier still BRONZE and default_commission_pct still 0.25 — a PATCH does not re-tier"

      - name: travel_expense_reject_then_approve_is_refused_by_the_state_check
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /travel-expenses/{expenseId}/reject]
          - errors[ERR_TRAVEL_EXPENSE_STATE_INVALID]
          - state_machines.TravelExpense.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Rejection is terminal for a receipt: reimbursable_cents stays null, the engagement total
          stays 0, and a later approval of the same receipt is refused rather than resurrecting it
          into the reimbursable pool.
        test_recipe:
          setup:
            - "A CONTRACTED engagement under POLICY_A with one SUBMITTED receipt of 63750"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY", "LEADERSHIP"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", travel_buffer_days: 1, tax_form_status: "ON_FILE" }
              as: BureauAdmin
              captures: { sp: $.data.id }
            - call: "POST /clients"
              payload: { org_name: "Meridian Health", industry_code: "HEALTHCARE", primary_contact_email: "ops@meridian.example" }
              as: BureauAdmin
              captures: { cl: $.data.id }
            - call: "POST /inquiries"
              payload: { client_id: "${cl}", required_topic: "AI_STRATEGY", event_start_utc: "2026-10-15T16:00:00Z", event_end_utc: "2026-10-15T18:00:00Z", audience_size: 800, budget_cents: 1600000, objective_tags: ["STRATEGY"] }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq: $.data.id }
            - call: "POST /inquiries/${inq}/qualify"
              payload: { outcome: "QUALIFY" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { inq_v: $.data.version }
            - call: "POST /inquiries/${inq}/proposals"
              payload: { expected_inquiry_version: "${inq_v}", valid_until_utc: "2026-09-20T00:00:00Z" }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { pr: $.data.id }
            - call: "POST /proposal-options"
              payload: { proposal_id: "${pr}", speaker_id: "${sp}", quoted_fee_cents: 1275000, rank_no: 1, travel_allowance_cents: 70000 }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { opt: $.data.id }
            - call: "POST /proposals/${pr}/present"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
            - call: "POST /proposals/${pr}/select"
              payload: { option_id: "${opt}" }
              as: Client
              as_user_id: "${cl}"
              captures: { eng: $.data.id }
            - call: "POST /engagements/${eng}/confirm"
              payload: {}
              as: Speaker
              as_user_id: "${sp}"
            - call: "POST /engagements/${eng}/contracts"
              payload: { cancellation_schedule_code: "STANDARD", travel_policy_code: "POLICY_A", recording_rights: "NONE", technical_rider_code: "STANDARD_AV", exclusivity_days: 0 }
              as: BookingAgent
              as_user_id: "agent-01"
              captures: { ct: $.data.id }
            - call: "POST /contracts/${ct}/send"
              payload: {}
              as: BookingAgent
              as_user_id: "agent-01"
            - call: "POST /contracts/${ct}/sign"
              payload: { signature_name: "Dana Reyes" }
              as: Speaker
              as_user_id: "${sp}"
            - call: "POST /contracts/${ct}/sign"
              payload: { signature_name: "M. Okafor" }
              as: Client
