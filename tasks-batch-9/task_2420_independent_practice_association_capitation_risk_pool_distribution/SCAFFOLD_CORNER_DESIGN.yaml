            - call: "GET /ipa/enrollees/${e_x1}"
              as: NetworkManager
              captures: { e_x1_v3: "$.data.version", e_x1_physician_final: "$.data.assigned_physician_id" }
          assert:
            - "${e_x1_v1} == 1 and ${e_x1_v2} == 2 — the first assignment increments Enrollee.version by exactly 1"
            - "the replay with expected_enrollee_version 1 returns HTTP 412 with ${err_stale} == \"ERR_STALE_ENROLLEE_VERSION\" (priority 7 beats the priority 18 overlap the same request would also cause)"
            - "${e_x1_v_after_reject} == 2 and ${e_x1_physician_after_reject} == \"${p_x1a}\" — the rejected write is a no-op, version does not advance on failure"
            - "the retry with expected_enrollee_version 2 returns 201; ${ma_x1a_status} == \"TERMINATED\", ${ma_x1a_term} == \"2026-08-01T00:00:00Z\", ${ma_x1a_superseded_by} == \"${ma_x1b}\""
            - "${e_x1_v3} == 3 and ${e_x1_physician_final} == \"${p_x1b}\"; PhysicianMember.${p_x1a}.panel_size == 0 and PhysicianMember.${p_x1b}.panel_size == 1"

      - name: stale_expected_physician_version_blocks_the_superseding_scorecard
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.scorecard-create-stale-physician
          - validations.priority_7_ERR_STALE_PHYSICIAN_VERSION
          - endpoints.POST_/ipa/quality-scorecards
        distinguishing_aspect: |
          The second §1.2.1 rule, on a different parent entity and with a
          different error_id, so an implementation that hardcodes one OCC field is
          caught. The physician's version is walked deliberately —
          1 at create, 2 at CREDENTIALED, 3 at ACTIVE, 4 after the first
          scorecard — proving the guard reads the *live* version rather than the
          version at physician creation. Replaying version 3 must return
          ERR_STALE_PHYSICIAN_VERSION (412) and must not supersede the existing
          DRAFT scorecard; replaying version 4 supersedes it.
        test_recipe:
          setup:
            - "Agreement AGR_X2 ACTIVE with physician P_X2 walked APPLICANT -> CREDENTIALED -> ACTIVE."
          setup_api_calls:
