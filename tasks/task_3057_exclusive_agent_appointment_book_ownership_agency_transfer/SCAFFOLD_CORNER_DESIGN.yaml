          expected_agency_version: ${cali_v0}
        as: AppointingExecutive
      - call: POST /agency-network/_inject/agent
        payload:
          full_name: Cal Ops
          state_code: CA
          license_status: LICENSED
          is_new_agent: false
          status: ACTIVE
        as: PlatformAdmin
        captures:
          cal_id: $.data.id
      - call: POST /agency-network/policies
        payload:
          policy_number: CA-P15
          product_line: AUTO
          annual_premium_cents: 400000
          is_new_business: true
          holder_agent_id: ${cal_id}
          owner_agency_id: ${cali_id}
        as: FieldManager
        captures:
          p: $.data.id
      - call: POST /agency-network/claims
        payload:
          policy_id: ${p}
          claim_amount_cents: 20000
        as: ClaimsAdjuster
        captures:
          cl: $.data.id
      - call: POST /agency-network/claims/${cl}/settle
        payload: {}
        as: ClaimsAdjuster
      trigger:
      - call: POST /agency-network/agencies/${cali_id}/run_ops
        payload: {}
        as: PlatformAdmin
        captures:
          idx1: $.data.ops_run_index
          exp1: $.data.exposure_inforce_cents
      - call: POST /agency-network/agencies/${cali_id}/run_ops
        payload: {}
        as: PlatformAdmin
        captures:
          idx2: $.data.ops_run_index
          exp2: $.data.exposure_inforce_cents
      assert:
      - the first run reports ops_run_index ${idx1}; the second reports ${idx2} == ${idx1} + 1
      - exposure_inforce_cents is unchanged across the two runs (no drift from re-running)
