          - validations[priority=9.5]
          - entities.Inspection.fields.window_start
          - entities.Inspection.fields.window_end
        distinguishing_aspect: |
          Inspection window separation on a Building uses CLOSED intervals expanded by a 7-day buffer —
          different interval semantics than the lease's half-open zero-buffer rule, and on a different
          resource entity. A window [2026-03-08, 2026-03-09] is within 7 days of [2026-03-01,2026-03-05]
          and is rejected; [2026-03-13, 2026-03-14] clears the buffer and is accepted.
        test_recipe:
          setup:
            - "Building B with one existing inspection window [2026-03-01, 2026-03-05]."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /inspections"
              payload: { building_id: "${b_id}", window_start: "2026-03-01T00:00:00Z", window_end: "2026-03-05T00:00:00Z", inspected_on: "2026-03-03T00:00:00Z", deduction_points: [5], has_exigent_health_safety: false }
              as: StateHFA
              captures: { i1_id: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { building_id: "${b_id}", window_start: "2026-03-08T00:00:00Z", window_end: "2026-03-09T00:00:00Z", inspected_on: "2026-03-08T00:00:00Z", deduction_points: [5], has_exigent_health_safety: false }
              as: StateHFA
              captures: { err: $.data.error_id }
            - call: "POST /inspections"
              payload: { building_id: "${b_id}", window_start: "2026-03-13T00:00:00Z", window_end: "2026-03-14T00:00:00Z", inspected_on: "2026-03-13T00:00:00Z", deduction_points: [5], has_exigent_health_safety: false }
              as: StateHFA
              captures: { i3_id: $.data.id }
          assert:
            - "Window [2026-03-08,2026-03-09] (within 7-day buffer of prior window_end 2026-03-05) returns 409 ERR_INSPECTION_WINDOW_CONFLICT"
            - "Window [2026-03-13,2026-03-14] (clears 7-day buffer) returns 201"
            - "Inspection.${i3_id}.status == SCHEDULED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: revoke_final_restores_building_annual_credit
        grounds:
          - state_machines.Building.PROVISIONAL_8609_to_FINAL_8609
          - state_machines.Building.FINAL_8609_to_PROVISIONAL_8609
          - entities.Building.fields.annual_credit_cents
        distinguishing_aspect: |
          Conserved quantity = Building.annual_credit_cents. Forward FINAL issuance pins it to 5400000;
          the compensating revoke-final restores it exactly to the provisional 7200000 (the pre-FINAL
          value), leaving no drift in the credit figure.
        test_recipe:
          setup:
            - "Project P SET_ASIDE_MET; Building B with 8 designated units; PROVISIONAL issued (annual_credit_cents=7200000)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U1", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U2", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U3", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U4", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_50" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U5", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_60" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U6", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_60" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U7", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_60" }
              as: OwnerAgent
            - call: "POST /units"
              payload: { building_id: "${b_id}", unit_number: "U8", bedroom_count: 1, sqft: 1000, utility_allowance_cents: 9000, ami_designation: "AMI_60" }
              as: OwnerAgent
            - call: "POST /projects/${p_id}/certify-set-aside"
              payload: {}
              as: StateHFA
            - call: "POST /buildings/${b_id}/form8609"
              payload: { issuance_type: "PROVISIONAL" }
              as: StateHFA
            - call: "GET /buildings/${b_id}"
              payload: {}
              as: StateHFA
              captures: { b_v: $.data.version, credit_before: $.data.annual_credit_cents }
            - call: "POST /buildings/${b_id}/form8609"
              payload: { issuance_type: "FINAL", monthly_qualified_units: [2,2,4,4,6,6,8,8,8,8,8,8], expected_building_version: "${b_v}" }
              as: StateHFA
          trigger:
            - call: "POST /buildings/${b_id}/revoke-final"
              payload: {}
              as: StateHFA
              captures: { credit_after: $.data.annual_credit_cents }
          assert:
            - "Building.${b_id}.annual_credit_cents == 7200000 after revoke-final (restored to the pre-FINAL provisional value 7200000)"
            - "Building.${b_id}.credit_status == PROVISIONAL_8609"

      - name: report_then_correct_restores_project_open_finding_count
        grounds:
          - state_machines.Finding.OPEN_to_REPORTED_8823
          - state_machines.Finding.REPORTED_8823_to_CORRECTED
          - entities.Project.fields.open_finding_count
          - entities.Project.fields.posture
        distinguishing_aspect: |
          Conserved quantity = Project.open_finding_count (different from annual credit). After the
          FAILing inspection open_finding_count=1; reporting the 8823 (OPEN->REPORTED_8823) keeps the
          finding unresolved so open_finding_count stays 1 (posture NONCOMPLIANT), and the compensating
          correct returns open_finding_count to 0 and posture to COMPLIANT — no drift in the count.
        test_recipe:
          setup:
            - "Project P; Building B; FAILing inspection by StateHFA 'hfa-1' created Finding F OPEN (open_finding_count=1); a different StateHFA 'hfa-2' reported the 8823 so F is REPORTED_8823 (open_finding_count still 1, posture NONCOMPLIANT)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P", area_median_income_cents: 9600000, minimum_set_aside: "FORTY_SIXTY", placed_in_service_date: "2026-01-01T00:00:00Z" }
              as: OwnerAgent
              captures: { p_id: $.data.id }
            - call: "POST /buildings"
              payload: { project_id: "${p_id}", bin: "B-001", eligible_basis_cents: 100000000, credit_type: "NINE_PERCENT", total_residential_units: 10, total_residential_sqft: 10000 }
              as: OwnerAgent
              captures: { b_id: $.data.id }
            - call: "POST /inspections"
              payload: { building_id: "${b_id}", window_start: "2026-03-01T00:00:00Z", window_end: "2026-03-05T00:00:00Z", inspected_on: "2026-03-03T00:00:00Z", deduction_points: [20,15,12], has_exigent_health_safety: false }
              as: StateHFA
              as_user_id: "hfa-1"
              captures: { i_id: $.data.id }
            - call: "POST /inspections/${i_id}/conduct"
              payload: {}
              as: StateHFA
              as_user_id: "hfa-1"
            - call: "GET /findings?inspection_id=${i_id}"
              payload: {}
              as: StateHFA
              as_user_id: "hfa-1"
              captures: { f_id: "$.data[0].id" }
            - call: "POST /findings/${f_id}/report"
              payload: {}
              as: StateHFA
              as_user_id: "hfa-2"
          trigger:
            - call: "POST /findings/${f_id}/correct"
              payload: {}
              as: OwnerAgent
              captures: { fstatus: $.data.status }
          assert:
            - "After report (8823) Project.${p_id}.open_finding_count remained 1"
            - "After correct Project.${p_id}.open_finding_count == 0 (restored to pre-finding value)"
            - "Project.${p_id}.posture == COMPLIANT"
            - "Finding.${f_id}.status == CORRECTED"
