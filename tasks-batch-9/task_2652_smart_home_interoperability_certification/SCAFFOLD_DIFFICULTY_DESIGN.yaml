          assert:
            - "The first return-for-info (state SUBMITTED, not IN_REVIEW) returns 409 ERR_INVALID_SUBMISSION_STATE and leaves revision_round == 0"
            - "After the first successful return-for-info: state == RETURNED_FOR_INFO, conformance_review_state == RETURNED, revision_round == 1, conformance_reviewer_user_id == \"rev-conf-1\""
            - "After the first re-submit: state == SUBMITTED, conformance_review_state == PENDING, revision_round stays 1"
            - "After the second successful return-for-info: revision_round == 2, conformance_review_state == RETURNED"
            - "After the second re-submit and second start-review: state == IN_REVIEW, conformance_review_state == PENDING, revision_round == 2"
            - "The final return-for-info returns 409 ERR_REVISION_LIMIT_EXCEEDED (revision_round 2 is not < MAX_REVISION_ROUNDS 2) and leaves state == IN_REVIEW"
            - "Ledger untouched by the loop: Member.${m1_id}.credit_balance_cents == 850000, escrowed_credit_cents == 150000, credits_consumed_cents == 0, and CertificationSubmission.${sub_id}.fee_escrowed_cents == 150000 (charged once, on the DRAFT -> SUBMITTED edge only)"
            - "GET /members/${m1_id}/credit-ledger with variant AVAILABLE returns data.balance_cents == 850000; with variant COMMITTED returns data.balance_cents == 1000000"

