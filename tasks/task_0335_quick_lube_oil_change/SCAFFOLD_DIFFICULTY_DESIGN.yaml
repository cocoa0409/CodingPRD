  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: start_requires_bay_occupied_workorder_to_bay
        grounds:
          - state_machines.WorkOrder.DRAFT_to_IN_SERVICE
          - state_machines.Bay.OCCUPIED_to_OPEN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair WorkOrder -> Bay: WorkOrder DRAFT->IN_SERVICE is valid only while its Bay
          is OCCUPIED by this order. Cancelling the order frees the bay (OCCUPIED->OPEN) and moves
          the order to CANCELLED; a subsequent /start on that order is rejected with ERR_INVALID_STATE
          because the bay no longer holds it.
        test_recipe:
          setup:
            - "WO created on a bay (bay OCCUPIED), technician claimed, then cancelled so the bay frees (OPEN)."
            - "A /start on the now-CANCELLED order is attempted; the bay no longer satisfies the cross-entity precondition."
          setup_api_calls:
            - call: "POST /_clock/set"
