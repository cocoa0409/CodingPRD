          Resource three is SupplyLot, and its interval semantics are aggregate rather than
          pairwise: overlapping shipping windows may coexist as long as their summed units stay
          within window_capacity_units 6, so a second reservation of 3 units overlapping a
          reserved 4 is refused while a third reservation of 3 units in a window that merely
          abuts the first is accepted.
