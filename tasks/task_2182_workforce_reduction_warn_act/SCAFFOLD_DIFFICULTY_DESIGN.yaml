              payload: {}
              as: BenefitsAdministrator
              as_user_id: "u-benefits-1"
              captures: { reserve_before: $.data.severance_reserve_cents, liability_before: $.data.benefit_liability_cents }
          trigger:
            - call: "POST /severance-offers/${offer_id}/issue"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "u-benefits-1"
            - call: "GET /reduction-plans/${plan_id}"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "u-benefits-1"
              captures: { reserve_issued: $.data.severance_reserve_cents }
            - call: "POST /severance-offers/${offer_id}/sign"
              payload: {}
              as: SeparatingEmployee
              as_user_id: "${alice_id}"
            - call: "GET /reduction-plans/${plan_id}"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "u-benefits-1"
              captures: { reserve_signed: $.data.severance_reserve_cents, liability_signed: $.data.benefit_liability_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00.000Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /severance-offers/${offer_id}/revoke"
              payload: { revocation_reason: "Exercised the seven-day revocation right." }
              as: SeparatingEmployee
              as_user_id: "${alice_id}"
            - call: "GET /reduction-plans/${plan_id}"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "u-benefits-1"
              captures: { reserve_after: $.data.severance_reserve_cents, liability_after: $.data.benefit_liability_cents }
          assert:
            - "${reserve_before} == 0"
            - "${liability_before} == 0"
            - "${reserve_issued} == 3553428"
            - "${reserve_signed} == 3553428"
            - "${liability_signed} == 526500"
            - "${reserve_after} == 0"
            - "${liability_after} == 0"
            - "${reserve_after} == ${reserve_before}"
            - "${liability_after} == ${liability_before}"
            - "SeveranceOffer.${offer_id}.status == REVOKED"
            - "SeveranceOffer.${offer_id}.total_separation_cost_cents == 3553428"
            - "Employee.${alice_id}.release_signed == false"
            - "Employee.${alice_id}.benefit_continuation_status == TERMINATED"
            - "Employee.${alice_id}.benefit_subsidy_cents == 0"
            - "Employee.${alice_id}.outplacement_tier == NONE"
