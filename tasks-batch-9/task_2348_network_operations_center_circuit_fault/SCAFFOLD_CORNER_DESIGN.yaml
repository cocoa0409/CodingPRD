              payload: { alarm_type: "ERRORED_SECONDS", raw_severity: "MINOR", raised_at: "2026-08-21T00:15:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
              captures: { a2_id: $.data.id }
            - call: "GET /incidents"
              payload: { primary_circuit_id: "${cz_id}" }
              as: NocAnalyst
          assert:
            - "the delta is exactly CORRELATION_WINDOW_SECONDS (900), and the inclusive bound still suppresses"
            - "Alarm.${a2_id}.correlation_state == SUPPRESSED and correlation_parent_alarm_id == ${a1_id}"
            - "Alarm.${a2_id}.incident_id == ${i1_id} (filed under the parent's incident)"
            - "GET /incidents returns total_count 1 (no second incident was opened)"
            - "Incident.${i1_id}.alarm_count == 2 and severity is still SEV3 with impact_score 20"
            - "Circuit.${cz_id}.operational_state == DOWN (unchanged by the MINOR noise, which would otherwise mean DEGRADED)"

      - name: corner_third_consecutive_high_reading_orders_next_ladder_rung
        claim_type: threshold
        grounds:
          - calculations.capacity_threshold_evaluation
          - calculations.upgrade_order_cost
          - endpoints["POST /circuits/{id}/capacity-readings"]
        distinguishing_aspect: "Two HIGH readings leave the circuit at WATCH with no order; the third crosses CONSECUTIVE_HIGH_READINGS_FOR_UPGRADE and must synthesize one AUTO_THRESHOLD DRAFT order at the next ladder rung above 100 (200, not the requested-nothing default) priced 340000 with no expedite fee."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9005 at bandwidth_mbps 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9005", site_a_code: "CHI01", site_z_code: "OMA01", bandwidth_mbps: 100, mrc_cents: 90000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /circuits/${cz_id}/capacity-readings"
              payload: { sample_at: "2026-08-22T00:05:00Z", utilization_pct: 85.00, direction: "INGRESS" }
              as: CapacityPlanner
              as_user_id: "cp-1"
            - call: "POST /circuits/${cz_id}/capacity-readings"
              payload: { sample_at: "2026-08-22T00:10:00Z", utilization_pct: 82.50, direction: "INGRESS" }
              as: CapacityPlanner
              as_user_id: "cp-1"
          trigger:
            - call: "POST /circuits/${cz_id}/capacity-readings"
              payload: { sample_at: "2026-08-22T00:15:00Z", utilization_pct: 90.00, direction: "INGRESS" }
              as: CapacityPlanner
              as_user_id: "cp-1"
            - call: "GET /circuits/${cz_id}/upgrade-orders"
              payload: { origin: "AUTO_THRESHOLD" }
              as: CapacityPlanner
              as_user_id: "cp-1"
              captures: { ao_id: "$.data[0].id" }
          assert:
            - "after the second reading the circuit was WATCH with consecutive_high_readings 2 and GET /circuits/${cz_id}/upgrade-orders returned total_count 0"
            - "the third reading has threshold_state HIGH"
            - "Circuit.${cz_id}.consecutive_high_readings == 3 and capacity_state == UPGRADE_REQUIRED"
            - "exactly one order exists: UpgradeOrder.${ao_id}.origin == AUTO_THRESHOLD, state == DRAFT, created_by_user_id == system, expedite == false"
            - "UpgradeOrder.${ao_id}.target_bandwidth_mbps == 200 and delta_mbps == 100"
            - "UpgradeOrder.${ao_id}.subtotal_cents == 340000, expedite_fee_cents == 0, total_cost_cents == 340000"
            - "Carrier.${pft_id}.committed_upgrade_mbps == 100"
            - "Circuit.${cz_id}.bandwidth_mbps is still 100 (an order is not an upgrade)"

      - name: corner_three_resolved_incidents_in_window_mark_circuit_chronic
        claim_type: aggregation
        grounds:
          - calculations.chronic_circuit_evaluation
          - entities.Circuit.fields.chronic_state
          - entities.Carrier.fields.chronic_circuit_count
        distinguishing_aspect: "The chronic ladder walks NORMAL -> CHRONIC_CANDIDATE -> CHRONIC across three separate resolved incidents days apart (well outside the 120-minute reopen window), and the carrier's chronic_circuit_count is re-derived to 1 only on the third resolve."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9001 and one BRONZE single-leg path."
            - "Two full alarm/clear/triage/mitigate/resolve cycles already ran on 2026-08-01 and 2026-08-04, leaving fault_count_period 2 and chronic_state CHRONIC_CANDIDATE."
