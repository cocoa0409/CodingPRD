          Interval semantics A on the Room resource: whole-day occupancy intervals that are
          CLOSED on both ends and separated by a mandatory TURNOVER_BUFFER_DAYS gap. With a
          prior effective_end_date of 2026-06-18 the next move_in_date must be STRICTLY later
