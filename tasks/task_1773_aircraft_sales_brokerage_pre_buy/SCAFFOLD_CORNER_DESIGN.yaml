# =============================================================================
# §1.9 Scaffold Corner Design — task_1773_aircraft_sales_brokerage_pre_buy
# Breadth coverage of every testable claim in §1.1-§1.7 not already covered
# by SCAFFOLD_DIFFICULTY_DESIGN.yaml. Names unique across both files.
# =============================================================================

scaffold_corner_design:
  # ============================================================ entities
  - section: entities
    instances:
      - name: listing_create_then_get_shows_defaults
        claim_type: creation_defaults
        grounds: [entities.Listing]
        distinguishing_aspect: "A freshly created listing persists with system defaults: status DRAFT, valuation_status NONE, market_value_estimate_usd null, version 1."
        test_recipe:
          setup: ["Listing created with all required fields"]
          setup_api_calls:
            - call: "POST /api/listings"
              payload: { tail_number: "N1001GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
              as: ListingAgent
              captures: { lst_id: $.data.id }
          trigger:
            - call: "GET /api/listings/${lst_id}"
              as: BuyerAgent
          assert:
            - "trigger[0] response data.status == DRAFT"
            - "trigger[0] response data.valuation_status == NONE"
            - "trigger[0] response data.market_value_estimate_usd == null"
            - "trigger[0] response data.version == 1 and data.tail_number == N1001GS"

      - name: create_listing_missing_tail_number_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Listing.fields.tail_number, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required field tail_number is rejected with ERR_VALIDATION 400; no row is persisted."
        test_recipe:
          setup: ["A comparable sale exists so the database is non-empty"]
          setup_api_calls:
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2014, sale_price_usd: 4123456.05, sale_date: "2026-01-20", total_time_hours: 3001, comp_status: "VERIFIED" }
              as: ListingAgent
          trigger:
            - call: "POST /api/listings"
              payload: { make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
              as: ListingAgent
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response data.error_id == ERR_VALIDATION, HTTP 400"

      - name: list_lois_empty_pagination_envelope
        claim_type: listing_pagination
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "Empty LOI list honors the fixed envelope: response_type array, total_count 0, has_more false, limit 10, offset 0."
        test_recipe:
          setup: ["A buyer exists so the database is non-empty but no LOIs exist"]
          setup_api_calls:
            - call: "POST /api/buyers"
              payload: { full_name: "Dana Rios", email: "dana@rios.example" }
              as: BuyerAgent
          trigger:
            - call: "GET /api/lois"
              as: BrokerPrincipal
          assert:
            - "trigger[0] response meta contains api_request_id and api_request_timestamp"
            - "trigger[0] response_type == array; data == []"
            - "pagination block: total_count == 0, has_more == false, limit == 10, offset == 0"

      - name: buyer_create_defaults_unqualified_then_qualify
        claim_type: defaults
        grounds: [entities.Buyer.fields.qualification_status, "state_machines.Buyer.UNQUALIFIED_to_QUALIFIED"]
        distinguishing_aspect: "Buyer is created UNQUALIFIED with null budget/ref; qualify sets QUALIFIED plus the provided budget and proof-of-funds reference."
        test_recipe:
          setup: ["Buyer registered"]
          setup_api_calls:
            - call: "POST /api/buyers"
              payload: { full_name: "Dana Rios", email: "dana@rios.example" }
              as: BuyerAgent
              captures: { byr_id: $.data.id }
          trigger:
            - call: "POST /api/buyers/${byr_id}/qualify"
              payload: { qualified_budget_usd: 3000000.00, proof_of_funds_ref: "POF-8891" }
              as: BuyerAgent
          assert:
            - "setup response: qualification_status == UNQUALIFIED, qualified_budget_usd == null, proof_of_funds_ref == null"
            - "trigger[0] response data.qualification_status == QUALIFIED"
            - "trigger[0] response data.qualified_budget_usd == 3000000.00 and data.proof_of_funds_ref == POF-8891"

      - name: comparable_sale_comp_status_defaults_unverified
        claim_type: defaults
        grounds: [entities.ComparableSale.fields.comp_status]
        distinguishing_aspect: "Omitting comp_status at creation stores UNVERIFIED (not VERIFIED), keeping the comp out of valuation input sets."
        test_recipe:
          setup: ["Comparable sale created without comp_status"]
          setup_api_calls:
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2014, sale_price_usd: 4123456.05, sale_date: "2026-01-20", total_time_hours: 3001 }
              as: ListingAgent
              captures: { comp_id: $.data.id }
          trigger:
            - call: "GET /api/comparable-sales/${comp_id}"
              as: ListingAgent
          assert:
            - "setup response: comp_status == UNVERIFIED"
            - "trigger[0] response data.comp_status == UNVERIFIED"

      - name: get_listing_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_LISTING_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID listing id yields ERR_LISTING_NOT_FOUND 404."
        test_recipe:
          setup: ["One listing exists (unrelated)"]
          setup_api_calls:
            - call: "POST /api/listings"
              payload: { tail_number: "N1001GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
              as: ListingAgent
          trigger:
            - call: "GET /api/listings/00000000-0000-0000-0000-000000000000"
              as: ListingAgent
              captures: { err: $.data.error_id }
          assert: ["trigger[0] data.error_id == ERR_LISTING_NOT_FOUND, HTTP 404"]

      - name: get_loi_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_LOI_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID LOI id yields ERR_LOI_NOT_FOUND 404."
        test_recipe:
          setup: ["One buyer exists (unrelated)"]
          setup_api_calls:
            - call: "POST /api/buyers"
              payload: { full_name: "Dana Rios", email: "dana@rios.example" }
              as: BuyerAgent
          trigger:
            - call: "GET /api/lois/00000000-0000-0000-0000-000000000000"
              as: BuyerAgent
              captures: { err: $.data.error_id }
          assert: ["trigger[0] data.error_id == ERR_LOI_NOT_FOUND, HTTP 404"]

      - name: get_transaction_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_TRANSACTION_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID transaction id yields ERR_TRANSACTION_NOT_FOUND 404."
        test_recipe:
          setup: ["One buyer exists (unrelated)"]
          setup_api_calls:
            - call: "POST /api/buyers"
              payload: { full_name: "Dana Rios", email: "dana@rios.example" }
              as: BuyerAgent
          trigger:
            - call: "GET /api/transactions/00000000-0000-0000-0000-000000000000"
              as: BrokerPrincipal
              captures: { err: $.data.error_id }
          assert: ["trigger[0] data.error_id == ERR_TRANSACTION_NOT_FOUND, HTTP 404"]

      - name: get_escrow_deposit_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_ESCROW_DEPOSIT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID escrow deposit id yields ERR_ESCROW_DEPOSIT_NOT_FOUND 404."
        test_recipe:
          setup: ["One buyer exists (unrelated)"]
          setup_api_calls:
            - call: "POST /api/buyers"
              payload: { full_name: "Dana Rios", email: "dana@rios.example" }
              as: BuyerAgent
          trigger:
            - call: "GET /api/escrow-deposits/00000000-0000-0000-0000-000000000000"
              as: EscrowOfficer
              captures: { err: $.data.error_id }
          assert: ["trigger[0] data.error_id == ERR_ESCROW_DEPOSIT_NOT_FOUND, HTTP 404"]

      - name: get_inspection_booking_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_INSPECTION_BOOKING_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID booking id yields ERR_INSPECTION_BOOKING_NOT_FOUND 404."
        test_recipe:
          setup: ["One buyer exists (unrelated)"]
          setup_api_calls:
            - call: "POST /api/buyers"
              payload: { full_name: "Dana Rios", email: "dana@rios.example" }
              as: BuyerAgent
          trigger:
            - call: "GET /api/inspection-bookings/00000000-0000-0000-0000-000000000000"
              as: FacilityScheduler
              captures: { err: $.data.error_id }
          assert: ["trigger[0] data.error_id == ERR_INSPECTION_BOOKING_NOT_FOUND, HTTP 404"]

      - name: get_discrepancy_item_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_DISCREPANCY_ITEM_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID discrepancy id yields ERR_DISCREPANCY_ITEM_NOT_FOUND 404."
        test_recipe:
          setup: ["One buyer exists (unrelated)"]
          setup_api_calls:
            - call: "POST /api/buyers"
              payload: { full_name: "Dana Rios", email: "dana@rios.example" }
              as: BuyerAgent
          trigger:
            - call: "GET /api/discrepancy-items/00000000-0000-0000-0000-000000000000"
              as: FacilityScheduler
              captures: { err: $.data.error_id }
          assert: ["trigger[0] data.error_id == ERR_DISCREPANCY_ITEM_NOT_FOUND, HTTP 404"]

      - name: get_comparable_sale_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_COMPARABLE_SALE_NOT_FOUND]"]
        distinguishing_aspect: "GET on a random UUID comparable id yields ERR_COMPARABLE_SALE_NOT_FOUND 404."
        test_recipe:
          setup: ["One buyer exists (unrelated)"]
          setup_api_calls:
            - call: "POST /api/buyers"
              payload: { full_name: "Dana Rios", email: "dana@rios.example" }
              as: BuyerAgent
          trigger:
            - call: "GET /api/comparable-sales/00000000-0000-0000-0000-000000000000"
              as: ListingAgent
              captures: { err: $.data.error_id }
          assert: ["trigger[0] data.error_id == ERR_COMPARABLE_SALE_NOT_FOUND, HTTP 404"]

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: activate_with_provisional_only_returns_valuation_required
        claim_type: precondition_enforcement
        grounds: [state_machines.Listing.DRAFT_to_ACTIVE, "errors[ERR_VALUATION_REQUIRED]"]
        distinguishing_aspect: "A DRAFT listing whose latest valuation is PROVISIONAL (not FINAL) cannot activate: ERR_VALUATION_REQUIRED 409."
        test_recipe:
          setup: ["Listing with 3 VERIFIED comps and a PROVISIONAL valuation only"]
          setup_api_calls:
            - call: "POST /api/listings"
              payload: { tail_number: "N1001GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
              as: ListingAgent
              captures: { lst_id: $.data.id }
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2014, sale_price_usd: 4123456.05, sale_date: "2026-01-20", total_time_hours: 3001, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2016, sale_price_usd: 4350000.00, sale_date: "2026-02-11", total_time_hours: 2850, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2013, sale_price_usd: 3980000.55, sale_date: "2026-03-02", total_time_hours: 3100, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/listings/${lst_id}/valuation"
              payload: { variant: "PROVISIONAL" }
              as: ListingAgent
          trigger:
            - call: "POST /api/listings/${lst_id}/activate"
              as: ListingAgent
              captures: { err: $.data.error_id }
          assert: ["trigger[0] data.error_id == ERR_VALUATION_REQUIRED, HTTP 409; listing stays DRAFT"]

      - name: withdraw_accepted_loi_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.LOI, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ACCEPTED is terminal for negotiation: withdraw on an ACCEPTED LOI fails with ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["LOI ACCEPTED (full accept chain)"]
          setup_api_calls:
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2014, sale_price_usd: 4123456.05, sale_date: "2026-01-20", total_time_hours: 3001, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2016, sale_price_usd: 4350000.00, sale_date: "2026-02-11", total_time_hours: 2850, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2013, sale_price_usd: 3980000.55, sale_date: "2026-03-02", total_time_hours: 3100, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/listings"
              payload: { tail_number: "N1001GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
              as: ListingAgent
              captures: { lst_id: $.data.id }
            - call: "POST /api/listings/${lst_id}/valuation"
              payload: { variant: "FINAL" }
              as: ListingAgent
            - call: "POST /api/listings/${lst_id}/activate"
              as: ListingAgent
            - call: "POST /api/buyers"
              payload: { full_name: "Dana Rios", email: "dana@rios.example" }
              as: BuyerAgent
              captures: { byr_id: $.data.id }
            - call: "POST /api/buyers/${byr_id}/qualify"
              payload: { qualified_budget_usd: 3000000.00, proof_of_funds_ref: "POF-8891" }
              as: BuyerAgent
            - call: "POST /api/lois"
              payload: { listing_id: "${lst_id}", buyer_id: "${byr_id}", offer_price_usd: 2000000.00, deposit_amount_usd: 100000.00 }
              as: BuyerAgent
              captures: { loi_id: $.data.id }
            - call: "POST /api/lois/${loi_id}/accept"
              as: ListingAgent
          trigger:
            - call: "POST /api/lois/${loi_id}/withdraw"
              as: BuyerAgent
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] data.error_id == ERR_INVALID_STATE, HTTP 409"
            - "GET /api/lois/${loi_id}: status still ACCEPTED"

      - name: fund_escrow_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.EscrowDeposit.AWAITING_FUNDS_to_FUNDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second fund call on an already-FUNDED escrow fails with ERR_INVALID_STATE; the first funding_reference is retained."
        test_recipe:
          setup: ["EscrowDeposit FUNDED (accept + fund chain)"]
          setup_api_calls:
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2014, sale_price_usd: 4123456.05, sale_date: "2026-01-20", total_time_hours: 3001, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2016, sale_price_usd: 4350000.00, sale_date: "2026-02-11", total_time_hours: 2850, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2013, sale_price_usd: 3980000.55, sale_date: "2026-03-02", total_time_hours: 3100, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/listings"
              payload: { tail_number: "N1001GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
              as: ListingAgent
              captures: { lst_id: $.data.id }
            - call: "POST /api/listings/${lst_id}/valuation"
              payload: { variant: "FINAL" }
              as: ListingAgent
            - call: "POST /api/listings/${lst_id}/activate"
              as: ListingAgent
            - call: "POST /api/buyers"
              payload: { full_name: "Dana Rios", email: "dana@rios.example" }
              as: BuyerAgent
              captures: { byr_id: $.data.id }
            - call: "POST /api/buyers/${byr_id}/qualify"
              payload: { qualified_budget_usd: 3000000.00, proof_of_funds_ref: "POF-8891" }
              as: BuyerAgent
            - call: "POST /api/lois"
              payload: { listing_id: "${lst_id}", buyer_id: "${byr_id}", offer_price_usd: 2000000.00, deposit_amount_usd: 100000.00 }
              as: BuyerAgent
              captures: { loi_id: $.data.id }
            - call: "POST /api/lois/${loi_id}/accept"
              as: ListingAgent
            - call: "GET /api/transactions?listing_id=${lst_id}"
              as: ListingAgent
              captures: { tx_id: "$.data[0].id" }
            - call: "GET /api/escrow-deposits?transaction_id=${tx_id}"
              as: EscrowOfficer
              captures: { esc_id: "$.data[0].id" }
            - call: "POST /api/escrow-deposits/${esc_id}/fund"
              payload: { funding_reference: "WIRE-1" }
              as: EscrowOfficer
          trigger:
            - call: "POST /api/escrow-deposits/${esc_id}/fund"
              payload: { funding_reference: "WIRE-DUP" }
              as: EscrowOfficer
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] data.error_id == ERR_INVALID_STATE, HTTP 409"
            - "GET /api/escrow-deposits/${esc_id}: status FUNDED, funding_reference == WIRE-1"

      - name: complete_requested_booking_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.InspectionBooking.CONFIRMED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete from REQUESTED (skipping confirm) is not a declared transition: ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["Deal ESCROW_FUNDED with booking in REQUESTED"]
          setup_api_calls:
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2014, sale_price_usd: 4123456.05, sale_date: "2026-01-20", total_time_hours: 3001, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2016, sale_price_usd: 4350000.00, sale_date: "2026-02-11", total_time_hours: 2850, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2013, sale_price_usd: 3980000.55, sale_date: "2026-03-02", total_time_hours: 3100, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/listings"
              payload: { tail_number: "N1001GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
              as: ListingAgent
              captures: { lst_id: $.data.id }
            - call: "POST /api/listings/${lst_id}/valuation"
              payload: { variant: "FINAL" }
              as: ListingAgent
            - call: "POST /api/listings/${lst_id}/activate"
              as: ListingAgent
            - call: "POST /api/buyers"
              payload: { full_name: "Dana Rios", email: "dana@rios.example" }
              as: BuyerAgent
              captures: { byr_id: $.data.id }
            - call: "POST /api/buyers/${byr_id}/qualify"
              payload: { qualified_budget_usd: 3000000.00, proof_of_funds_ref: "POF-8891" }
              as: BuyerAgent
            - call: "POST /api/lois"
              payload: { listing_id: "${lst_id}", buyer_id: "${byr_id}", offer_price_usd: 2000000.00, deposit_amount_usd: 100000.00 }
              as: BuyerAgent
              captures: { loi_id: $.data.id }
            - call: "POST /api/lois/${loi_id}/accept"
              as: ListingAgent
            - call: "GET /api/transactions?listing_id=${lst_id}"
              as: ListingAgent
              captures: { tx_id: "$.data[0].id" }
            - call: "GET /api/escrow-deposits?transaction_id=${tx_id}"
              as: EscrowOfficer
              captures: { esc_id: "$.data[0].id" }
            - call: "POST /api/escrow-deposits/${esc_id}/fund"
              payload: { funding_reference: "WIRE-1" }
              as: EscrowOfficer
            - call: "POST /api/inspection-facilities"
              payload: { name: "SkyMRO", airport_code: "KTEB", turnaround_buffer_minutes: 120 }
              as: BrokerPrincipal
              captures: { fac_id: $.data.id }
            - call: "POST /api/inspection-bookings"
              payload: { transaction_id: "${tx_id}", facility_id: "${fac_id}", start_at: "2026-09-01T10:00:00Z", end_at: "2026-09-01T14:00:00Z" }
              as: FacilityScheduler
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /api/inspection-bookings/${bk_id}/complete"
              as: FacilityScheduler
              captures: { err: $.data.error_id }
          assert: ["trigger[0] data.error_id == ERR_INVALID_STATE, HTTP 409; booking stays REQUESTED"]

      - name: booking_cancel_reverts_transaction_to_escrow_funded
        claim_type: compensation
        grounds: [state_machines.Transaction.INSPECTION_SCHEDULED_to_ESCROW_FUNDED, state_machines.InspectionBooking.CONFIRMED_to_CANCELLED]
        distinguishing_aspect: "Cancelling the only active booking after confirm reverts the transaction INSPECTION_SCHEDULED -> ESCROW_FUNDED (undo of the confirm bubble-up)."
        test_recipe:
          setup: ["Deal INSPECTION_SCHEDULED via one CONFIRMED booking"]
          setup_api_calls:
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2014, sale_price_usd: 4123456.05, sale_date: "2026-01-20", total_time_hours: 3001, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2016, sale_price_usd: 4350000.00, sale_date: "2026-02-11", total_time_hours: 2850, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/comparable-sales"
              payload: { make: "Gulfstream", model: "G550", year: 2013, sale_price_usd: 3980000.55, sale_date: "2026-03-02", total_time_hours: 3100, comp_status: "VERIFIED" }
              as: ListingAgent
            - call: "POST /api/listings"
              payload: { tail_number: "N1001GS", make: "Gulfstream", model: "G550", year: 2015, total_time_hours: 2900, asking_price_usd: 12900000.00, seller_name: "Apex Jet Holdings" }
              as: ListingAgent
              captures: { lst_id: $.data.id }
            - call: "POST /api/listings/${lst_id}/valuation"
              payload: { variant: "FINAL" }
