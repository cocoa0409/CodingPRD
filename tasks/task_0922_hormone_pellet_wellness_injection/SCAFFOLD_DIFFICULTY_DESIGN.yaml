  - rule_id: priority_pair_validation_conflict
    instances:
      - name: standing_order_gate_pre_empts_terminal_state_for_nurse
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_STANDING_ORDER_INVALID]
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: |
          Category pair business_safety (rung 9) versus state (rung 11). The same
          CANCELLED procedure under the same REVOKED order returns
          ERR_STANDING_ORDER_INVALID with 403 to a NurseInjector and
          ERR_ALREADY_TERMINAL with 409 to a Physician, because the gate is scoped to
          the nurse role and pre-empts the terminal-state rung only for her.
        test_recipe:
          setup:
            - "A testosterone procedure taken to SUPPLY_OPENED and then CANCELLED."
            - "The governing standing order REVOKED after the cancellation."
            - "Clock at its 2026-05-01T00:00:00Z startup default."
