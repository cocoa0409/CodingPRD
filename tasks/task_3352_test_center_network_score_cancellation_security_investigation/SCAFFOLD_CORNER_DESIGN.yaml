  - section: endpoints
    instances:
      - name: pagination_defaults_empty_sessions_list
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "A list endpoint with zero rows honors the fixed envelope: response_type array, data [], total_count 0, has_more false, and default limit 10 / offset 0 applied."
        test_recipe:
          setup: ["one center with no sessions"]
          setup_api_calls:
            - call: "POST /ets/test-centers"
              payload: { name: "Center PG", facility_seat_capacity: 10, equipment_list: [] }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /ets/test-centers/${c_id}/sessions"
              as: ProgramAdmin
          assert:
            - "response_type == array and data == []"
            - "pagination block reports total_count == 0, has_more == false, limit == 10, offset == 0"
      - name: analysis_run_output_shape
        claim_type: computed_read
        grounds: ["endpoints[POST /ets/score-analysis/run]"]
        excluded_because:
          difficulty_instance: similarity_weighted_nonlinear_threshold
          rationale: "The named difficulty instance captures and asserts processed_count / flagged_count / released_count (2 / 1 / 1) from the run response."

  - section: errors
    instances:
      - name: err_session_overlap_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SESSION_OVERLAP]"]
        excluded_because:
          difficulty_instance: session_room_turnaround_buffer
          rationale: "Asserted as the failure branch of the named difficulty instance."
      - name: err_proctor_overlap_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PROCTOR_OVERLAP]"]
        excluded_because:
          difficulty_instance: proctor_strict_overlap_adjacency_allowed
          rationale: "Asserted as the failure branch of the named difficulty instance."
      - name: err_registration_window_closed_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_REGISTRATION_WINDOW_CLOSED]"]
        excluded_because:
          difficulty_instance: temporal_beats_constraint_on_duplicate_registration
          rationale: "Asserted as the winning error of the named priority-conflict instance."
      - name: err_center_not_authorized_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CENTER_NOT_AUTHORIZED]"]
        excluded_because:
          difficulty_instance: session_publish_requires_center_authorized
          rationale: "Asserted as the failure branch of the named difficulty instance."
      - name: err_session_not_published_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SESSION_NOT_PUBLISHED]"]
        excluded_because:
          difficulty_instance: state_beats_safety_on_banned_registration
          rationale: "Asserted as the winning error of the named priority-conflict instance."
      - name: err_session_not_locked_triggered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SESSION_NOT_LOCKED]"]
        excluded_because:
          difficulty_instance: checkin_requires_session_locked
          rationale: "Asserted as the failure branch of the named difficulty instance."

  - section: rbac
    instances:
      - name: proctor_cannot_create_test_center
        claim_type: rbac_denial
        grounds: ["roles", "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Role denial precedes existence and state: a Proctor calling the ProgramAdmin-only center-creation endpoint gets ERR_UNAUTHORIZED (403)."
        test_recipe:
