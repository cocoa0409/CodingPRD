      - name: hourly_pay_is_additive_and_never_competes_with_the_linehaul_max
        claim_type: correct_result
        grounds:
          - calculations.linehaul_component_pay
          - calculations.settlement_line_generation
          - entities.Load.fields.hours_worked_minutes
          - entities.SettlementLine.fields.quantity
        distinguishing_aspect: |
          The max() in linehaul_component_pay ranges over the PER_MILE and REVENUE_PERCENT legs only; HOURLY is
          additive. 300 paid miles at 58 gives a 17400 linehaul and 470 minutes at 2200 per hour gives
          round_half_up(17233.33) = 17233, so gross is 34633 - not max(17400, 17233) = 17400 and not the 17233
          a handler that let the hourly leg into the comparison would drop. The HOURLY line carries quantity
          7.83, the minutes divided by 60 at two decimal places, while Load.linehaul_pay_cents stays 17400.
