              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
          trigger:
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/revenue-forecasts/${fc_gen_id}/adopt"
