        test_recipe:
          setup:
            - "One UNQUALIFIED supplier whose stored audit_score is 65."
          setup_api_calls:
            - call: "POST /supplement-compliance/suppliers"
              payload: { supplier_name: "Riverbend Botanicals", country_code: "US", audit_score: 65 }
