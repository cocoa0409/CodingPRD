      - name: check_in_before_the_window_and_completion_before_the_end_are_refused
        claim_type: temporal_validation
        grounds: ["validations[priority=32]", errors.ERR_CHECK_IN_WINDOW_CLOSED, errors.ERR_SHIFT_NOT_ENDED, "state_machines.ShiftAssignment.status.CONFIRMED_to_CHECKED_IN", "state_machines.ConstructionShift.status.LOCKED_to_COMPLETED", "endpoints.POST /_clock/set_current_utc"]
        distinguishing_aspect: "Both refusals depend on nothing but the logical clock: a fully LOCKED shift with a CONFIRMED seat rejects check-in while now is four days before start_at and rejects completion while now is before end_at, and both calls succeed unchanged once the clock is moved onto the window and then past the end. Staging the check-in attempt four days early makes it a violation under the 30-minute grace stated in §1.2 and priority 32 as well as the 60-minute figure the error catalog mentions."
        test_recipe:
          setup:
            - "Canonical program with a READY_TO_BUILD site and one adult volunteer whose waiver runs to 2027-12-31. A single-seat shift on 2026-08-05T08:00 to 12:00 has been opened, the volunteer reserved and CONFIRMED, and the shift LOCKED with a safety briefing on file (one confirmation meets ceil(0.60 * 1) == 1). The logical clock is still at its initial 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "TITLE", document_reference: "TITLE-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "ENVIRONMENTAL", document_reference: "ENV-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "UTL-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/volunteers", payload: { program_id: "${prog_id}", full_name: "Dana Reyes", birth_date: "1990-04-10T00:00:00.000Z", waiver_expires_on: "2027-12-31T00:00:00.000Z" }, as: ConstructionManager, as_user_id: "cm-1", captures: { vol_id: $.data.id } }
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-05T08:00:00.000Z", end_at: "2026-08-05T12:00:00.000Z", volunteer_slots: 1 }, as: ConstructionManager, as_user_id: "cm-1", captures: { shift_id: $.data.id } }
            - { call: "POST /homeownership/construction-shifts/${shift_id}/open", payload: {}, as: ConstructionManager, as_user_id: "cm-1", captures: { sv1: $.data.version } }
            - { call: "POST /homeownership/shift-assignments", payload: { shift_id: "${shift_id}", expected_shift_version: "${sv1}", role: "GENERAL_VOLUNTEER", volunteer_id: "${vol_id}" }, as: ConstructionManager, as_user_id: "cm-1", captures: { asg_id: $.data.id } }
            - { call: "POST /homeownership/shift-assignments/${asg_id}/confirm", payload: {}, as: Volunteer, as_user_id: "${vol_id}" }
            - { call: "POST /homeownership/construction-shifts/${shift_id}/lock", payload: { safety_briefing_reference: "SB-2026-08-05" }, as: ConstructionManager, as_user_id: "cm-1" }
          trigger:
            - { call: "POST /homeownership/shift-assignments/${asg_id}/check-in", payload: {}, as: ConstructionManager, as_user_id: "cm-1", captures: { e_window: $.data.error_id } }
            - { call: "POST /homeownership/construction-shifts/${shift_id}/complete", payload: { completion_note: "Premature close attempt" }, as: ConstructionManager, as_user_id: "cm-1", captures: { e_notended: $.data.error_id } }
            - { call: "GET /homeownership/shift-assignments/${asg_id}", as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00.000Z" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/shift-assignments/${asg_id}/check-in", payload: {}, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T12:00:00.000Z" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/construction-shifts/${shift_id}/complete", payload: { completion_note: "Shift finished on schedule" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "GET /homeownership/shift-assignments/${asg_id}", as: ConstructionManager, as_user_id: "cm-1" }
          assert:
            - "Early check-in: HTTP 409 and ${e_window} == ERR_CHECK_IN_WINDOW_CLOSED — the clock is 2026-08-01T00:00, far outside any grace window before 2026-08-05T08:00"
            - "Early completion: HTTP 409 and ${e_notended} == ERR_SHIFT_NOT_ENDED"
            - "Assignment re-read after both refusals: status is still CONFIRMED and checked_in_at == null"
            - "Check-in at exactly start_at: HTTP 200, status == CHECKED_IN, checked_in_at == 2026-08-05T08:00:00.000Z"
            - "Completion at exactly end_at: HTTP 200 with shift status == COMPLETED, and the assignment re-read shows status == COMPLETED, not NO_SHOW"

      - name: a_lock_is_refused_while_trade_coverage_is_short
        claim_type: violation_to_error
        grounds: ["validations[priority=33]", calculations.shift_lock_readiness, errors.ERR_TRADE_COVERAGE_INSUFFICIENT, entities.ConstructionShift.fields.required_trade_slots, "state_machines.ConstructionShift.status.OPEN_to_LOCKED"]
        distinguishing_aspect: "The general-fill gate and the trade-coverage gate are independent conditions on the same lock: with volunteer_slots 3 the two confirmed general seats already satisfy ceil(0.60 * 3) == 2, so the only thing missing is the single PLUMBING seat — the refusal is therefore unambiguously ERR_TRADE_COVERAGE_INSUFFICIENT and not the fill error."
        test_recipe:
          setup:
            - "Canonical program with a READY_TO_BUILD site and three adult volunteers on waivers to 2027-12-31, one of whom holds a PLUMBING certification expiring 2027-12-31. An OPEN shift on 2026-08-05T08:00 to 12:00 offers 3 general seats plus 1 required PLUMBING seat; the two uncertified volunteers are CONFIRMED on general seats, so confirmed general is 2 and confirmed trade is 0."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
