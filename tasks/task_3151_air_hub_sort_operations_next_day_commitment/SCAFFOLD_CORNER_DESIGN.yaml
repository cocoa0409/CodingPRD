  # ===========================================================================
  - section: validations
    instances:

      - name: hazmat_package_into_a_zero_cap_buildup_returns_cap_exceeded
        claim_type: Violation to Error
        grounds:
          - validations[priority=5]
          - errors.ERR_HAZMAT_CAP_EXCEEDED
          - endpoints.POST_/airhub/moves/{move_id}/load-package
        distinguishing_aspect: "The hazardous cap is a per-buildup declared ceiling, so a HAZMAT package admitted by its lane is still refused onboarding into a buildup declaring hazardous_cap_grams 0."
        test_recipe:
          setup:
            - "Clock 1450. SDF hub, lane P-01 (GENERAL, capacity 400000), HAZMAT lane HZ-01 (capacity 400000, certified_until 1560), SECONDARY S-01 (capacity 400000), BANK_A with N701UP landed and unloaded, N702UP the move aircraft, shift N-A, a load move M with a destination buildup G of container 70000 and hazardous_cap_grams 0, and one 30000-gram HAZMAT package routed to the hazmat lane and secondary-sorted."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 400000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "S-01", lane_kind: "SECONDARY", commodity_capability: "GENERAL", capacity_weight_grams: 400000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1600 }
              as: SortSupervisor
              captures: { lane_s1_id: $.data.id }
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "HZ-01", lane_kind: "HAZMAT", commodity_capability: "HAZMAT", capacity_weight_grams: 400000, certified_until_minutes: 1560, turnout_start_minutes: 1400, turnout_end_minutes: 1600 }
              as: SortSupervisor
              captures: { lane_hz1_id: $.data.id }
            - *c_bank
            - *c_ac1
            - *c_ac2
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/moves"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac2_id}", weight_limit_grams: 400000 }
              as: LoadPlanner
              captures: { move_id: $.data.id, move_v0: $.data.version }
            - call: "POST /airhub/buildups"
              payload: { hub_id: "${hub_id}", load_move_id: "${move_id}", destination_gateway_code: "LAX", container_limit_grams: 70000, hazardous_cap_grams: 0, requires_container: false }
              as: LoadPlanner
              captures: { bd_id: $.data.id }
            - call: "POST /airhub/moves/${move_id}/plan-load"
              payload: {}
              as: LoadPlanner
              captures: { move_v1: $.data.version }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-HZ-0001", commodity_class: "HAZMAT", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 30000, dimension_weight_grams: 30000 }
              as: SortOperator
              captures: { pkg_hz: $.data.id }
            - call: "POST /airhub/packages/${pkg_hz}/induct"
              payload: { dimension_weight_grams: 30000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_hz}/route-hazmat"
              payload: { lane_id: "${lane_hz1_id}" }
              as: HazmatCertifier
              captures: { hazmat_handling: $.data.handling_status }
            - call: "POST /airhub/packages/${pkg_hz}/primary-sort"
              payload: { lane_id: "${lane_hz1_id}" }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_hz}/secondary-sort"
              payload: { lane_id: "${lane_s1_id}" }
              as: SortOperator
              captures: { pkg_hz_v: $.data.version }
            - call: "POST /airhub/moves/${move_id}/assign-buildup"
              payload: { package_id: "${pkg_hz}", buildup_id: "${bd_id}" }
              as: LoadPlanner
          trigger:
            - call: "POST /airhub/moves/${move_id}/load-package"
              payload: { package_id: "${pkg_hz}", expected_load_move_version: "${move_v1}", expected_package_version: "${pkg_hz_v}" }
              as: LoadPlanner
              captures: { err_cap: $.data.error_id }
          assert:
            - "the package reached the hazmat lane as ${hazmat_handling} == ROUTED_TO_HAZMAT and its sort_status is SECONDARY_SORTED"
            - "the onboarding returns 409 with ${err_cap} == ERR_HAZMAT_CAP_EXCEEDED"
            - "Buildup.${bd_id}.hazardous_cap_grams == 0 and hazardous_weight_grams == 0, so no hazardous grams were admitted"
            - "Package.${pkg_hz}.sort_status is still SECONDARY_SORTED and Buildup.${bd_id}.status == OPEN"

