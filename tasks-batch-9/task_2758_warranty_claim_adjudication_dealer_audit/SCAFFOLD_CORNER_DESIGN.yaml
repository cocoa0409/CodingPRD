      - name: goodwill_decision_amount_above_the_deciding_roles_limit
        claim_type: violation_to_error
        grounds:
          - validations[priority 87].ERR_GOODWILL_LIMIT_EXCEEDED
          - calculations.goodwill_authorization_limit
          - entities.GoodwillAuthorization.fields.adjudicator_limit_cents
          - entities.GoodwillAuthorization.fields.manager_limit_cents
        distinguishing_aspect: |
          The ceiling checked at decision time belongs to the DECIDING role, not to the request: 44000 is
          refused for a ClaimAdjudicator (limit 40000) and accepted for an AdjudicationManager (limit 48000) on
          the identical authorization row, and the approved amount may exceed the requested 40000.
        test_recipe:
          setup:
            - "WORLD-GOODWILL: claim CL_GW is out of warranty, provisional_total_cents 60000, coverage_type NONE, SUSPENDED."
            - "adj-user-1 requested 40000 with policy_adjustment_pct 0.25, so the authorization opened PENDING with adjudicator_limit_cents 40000 and manager_limit_cents 48000."
            - "adj-user-2 and mgr-user-1 are both different users from the requester, so segregation of duties at priority 25 passes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-20T00:00:00Z" }
              as: WarrantyAdmin
