              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { s_id: $.data.id }
          assert:
            - "the incapable program is caught at screening: HTTP 200 with data.compliance_status \"REJECTED\" and data.rejection_error_id \"ERR_ADULT_SIGNATURE_NOT_SUPPORTED\""
            - "it is not mistaken for an enrollment problem: the enrollment was APPROVED and its program serves TX, so priority 70 passed"
            - "the rejected order appended nothing: GET /dtc/volume-ledger-entries?order_id=${oa_id} returns zero rows"
            - "with a capable program approved instead, the identical second order clears: data.compliance_status \"CLEARED\" and rejection_error_id null"
            - "labelling against the now-SUSPENDED first enrollment returns HTTP 422 with error_id \"ERR_CARRIER_NOT_ENROLLED\" \u2014 priority 70 answers before priority 72 can complain about the missing service code"
            - "labelling against the capable enrollment returns HTTP 201 with data.status \"LABEL_CREATED\", data.adult_signature_required true and data.adult_signature_service_code \"AS21\""
            - "CarrierEnrollment.${ce_id}.status == \"SUSPENDED\" and CarrierEnrollment.${ce2_id}.status == \"APPROVED\" \u2014 the two enrollments sit on different programs, so neither superseded the other"
            - "Order.${oa_id}.compliance_status is still \"REJECTED\" \u2014 fixing the carrier does not revive a rejected order"
      - name: invalid_request_covers_empty_arrays_reversed_periods_and_mismatched_rules
