      - name: complaint_sanction_suspends_dealer_and_sponsored_salespersons
        claim_type: cascade_down
        grounds:
          - state_machines.Dealer.LICENSED_to_SUSPENDED
          - state_machines.Salesperson.LICENSED_to_SUSPENDED_BY_SPONSOR
        excluded_because:
          difficulty_instance: complaint_sanction_to_dealer_suspension_to_salesperson_to_count
          rationale: "The four-link sanction cascade (points >= 12 -> dealer SUSPENDED -> every sponsored salesperson SUSPENDED_BY_SPONSOR -> licensed_salesperson_count recomputed to 0) is exercised end-to-end by that §1.8 transitive_cascade instance, including the counter reconciliation a corner test would only partially observe."

      - name: termination_finalize_moots_open_warranty_rate_disputes
        claim_type: cross_entity
        grounds:
          - state_machines.WarrantyRateDispute.UNDER_REVIEW_to_DISMISSED_MOOT
          - state_machines.Dealer.LICENSED_to_CANCELLED
        excluded_because:
          difficulty_instance: filing_finalize_termination_to_dispute_moot_to_mfr_count
          rationale: "The finalize cascade (dealer CANCELLED/TERMINATED -> dispute DISMISSED_MOOT -> Manufacturer.open_dispute_count recomputed) is covered by that §1.8 transitive_cascade instance with all three links asserted in one request."

      - name: filing_amendment_withdraws_protests_and_releases_room_slot
        claim_type: compensation
        grounds:
          - state_machines.FranchiseFiling.PROTEST_PENDING_to_NOTICE_SERVED
          - state_machines.Protest.SCHEDULED_to_WITHDRAWN
          - calculations.hearing_room_slot_ledger
        excluded_because:
          difficulty_instance: hearing_room_session_slot_released_on_amendment
          rationale: "The amendment-driven withdrawal and the room-slot conservation check (booked_hearing_count returned to its pre-booking value and the identical interval rebookable) are the subject of that §1.8 compensating_invariant instance."

      - name: restitution_settlement_reinstates_delinquent_dealer
        claim_type: ledger_sync
        grounds:
          - state_machines.ConsumerComplaint.SANCTIONED_to_CLOSED_SATISFIED
          - state_machines.Dealer.SUSPENDED_to_LICENSED
          - calculations.restitution_ledger
        excluded_because:
          difficulty_instance: restitution_ledger_conserved_after_payment
          rationale: "That §1.8 compensating_invariant instance already walks the partial payment, the settling payment, the conservation identity between complaint and dealer ledgers, and the reinstatement of the RESTITUTION_DELINQUENT suspension."

      - name: salesperson_license_and_discipline_dimensions_move_independently
        claim_type: valid_transition
        grounds:
          - state_machines.Salesperson.dimensions
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: salesperson_parallel_license_and_discipline_dimensions
          rationale: "The parallel-dimension claim (a PROBATION salesperson keeps selling, a renewal leaves discipline untouched, and only the discipline dimension blocks renewal approval at 9 points) is the whole point of that §1.8 non_linear_state_machine instance."

