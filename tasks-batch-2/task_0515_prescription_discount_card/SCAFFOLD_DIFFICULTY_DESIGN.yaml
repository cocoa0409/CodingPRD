              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "a@x.com", full_name: "M A", state_code: "CA" }
              as: Anonymous
              captures: { m_a_id: $.data.id }
            - call: "POST /members"
              payload: { email: "b@x.com", full_name: "M B", state_code: "CA" }
              as: Anonymous
              captures: { m_b_id: $.data.id }
            - call: "POST /comparisons"
              payload: { member_id: "${m_a_id}", drug_id: "${drug_id}", state_code: "CA" }
              as: Member
              as_user_id: "${m_a_id}"
              captures: { cmp_id: $.data.id }
            - call: "POST /comparisons/${cmp_id}/run"
              payload: { member_id: "${m_a_id}" }
              as: Member
              as_user_id: "${m_a_id}"
            - call: "POST /discount-cards"
              payload: { member_id: "${m_a_id}", comparison_id: "${cmp_id}" }
              as: Member
              as_user_id: "${m_a_id}"
              captures: { card_id: $.data.id }
            - call: "POST /discount-cards/${card_id}/void"
              payload: { member_id: "${m_a_id}" }
