              captures: { dv_after_duty: $.data.version }
            - call: "POST /fleet/drivers/${driver_id}/pay-plan-assignments"
              payload: { pay_plan_id: "${plan_d}", expected_driver_version: "${dv_read}" }
              as: PayrollAnalyst
              captures: { stale_err: $.data.error_id }
            - call: "POST /fleet/telematics-events"
              payload: { driver_id: "${driver_id}", event_type: "HARD_BRAKE", severity: 1, occurred_at: "2026-07-20T14:00:00Z" }
              as: SafetyManager
              captures: { ev_id: $.data.id }
            - call: "GET /fleet/drivers/${driver_id}"
              payload: {}
              as: PayrollAnalyst
              captures: { dv_after_event: $.data.version, plan_still: $.data.pay_plan_id, points_now: $.data.open_penalty_points }
            - call: "POST /fleet/drivers/${driver_id}/pay-plan-assignments"
              payload: { pay_plan_id: "${plan_d}", expected_driver_version: "${dv_after_duty}" }
              as: PayrollAnalyst
              captures: { stale_err_2: $.data.error_id }
            - call: "POST /fleet/drivers/${driver_id}/pay-plan-assignments"
              payload: { pay_plan_id: "${plan_d}", expected_driver_version: "${dv_after_event}" }
              as: PayrollAnalyst
              captures: { plan_new: $.data.pay_plan_id, dv_after_swap: $.data.version }
            - call: "GET /fleet/trips/${trip_id}"
              payload: {}
              as: PayrollAnalyst
              captures: { pinned_plan_after: $.data.pinned_pay_plan_id, planned_pay_after: $.data.planned_pay_cents }
            - call: "GET /fleet/trips/${trip_id}/pay-preview"
              payload: { variant: "PLANNED_ACCRUAL" }
              as: PayrollAnalyst
              captures: { preview_plan: $.data.pay_plan_id, preview_mileage: $.data.mileage_cents }
          assert:
            - "${dv0} == 1, ${dv_read} == 1 and ${dv_after_duty} == 2 - the HOS correction is a write to the driver row"
            - "${stale_err} == ERR_STALE_DRIVER_VERSION with HTTP 412"
            - "${dv_after_event} == 3 with ${points_now} == 2 and ${plan_still} == ${plan_c} - a SafetyManager write also invalidates the payroll analyst's read, and neither refused nor unrelated write changed the plan"
            - "${stale_err_2} == ERR_STALE_DRIVER_VERSION - version 2 is now stale in turn"
            - "${plan_new} == ${plan_d} and ${dv_after_swap} == 4 at the current version"
            - "${pinned_plan} == ${plan_c} with ${pinned_ver} == ${plan_c_v} and ${planned_pay} == ${planned_pay_after} - the swap does not retro-price a trip that already pinned its plan"
            - "${preview_plan} == ${plan_c} and ${preview_mileage} == 8000 (100 miles at MILE-C's 80, not MILE-D's 120)"

      - name: a_refused_close_out_leaves_every_link_of_the_cascade_unapplied
        claim_type: cascading_side_effects
        grounds:
          - state_machines[Trip].transitions[IN_PROGRESS->COMPLETED]
          - endpoints[POST /fleet/trips/{trip_id}/complete]
          - consistency_model
        distinguishing_aspect: "Trip completion is the widest cascade in the domain - orders, store ledgers, HOS counters, odometer, PM projection, asset release and settlement all move inside one call - so its atomicity is the claim: a close-out refused because one stop is still ARRIVED must leave all seven downstream effects unapplied, with no partially delivered order, no statement and no odometer creep, and the same call must then succeed once the last stop is terminal."
        test_recipe:
          setup:
            - "TRIP-C4 is IN_PROGRESS with two DELIVERY stops (400 and 200 cases at S-6240, 600 cases/hour). Stop 1 is COMPLETED; stop 2 is only ARRIVED."
            - "Tractor TR-C4 starts at odometer 50000 with pm_interval 25000 and pm_last_service 40000, so miles_since_pm is 10000 - far from the PM trigger, which keeps the check on the odometer honest."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-C4", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 10, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { dom_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-C", mileage_cents_per_mile: 80, stop_cents_per_stop: 2000, drop_hook_cents: 1400, hourly_cents_per_minute: 40, minimum_daily_cents: 20000, backhaul_bonus_pct: 0.04 }
              as: PayrollAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /fleet/stores"
              payload: { store_code: "S-6240", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { store_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-C4", domicile_id: "${dom_id}", pay_plan_id: "${plan_id}", seniority_date: "2019-03-01" }
              as: TransportManager
              captures: { driver_id: $.data.id }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-C4", domicile_id: "${dom_id}", odometer_miles: 50000, pm_interval_miles: 25000, pm_last_service_odometer: 40000 }
              as: MaintenanceCoordinator
              captures: { tractor_id: $.data.id }
            - call: "POST /fleet/trailers"
              payload: { trailer_code: "TL-C4", domicile_id: "${dom_id}", trailer_type: "DRY_VAN", capacity_cases: 1800, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
              captures: { trailer_id: $.data.id }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_id}", cases: 400, weight_lbs: 8800, requested_window_start: "2026-08-20T06:00:00Z", requested_window_end: "2026-08-20T18:00:00Z", temperature_mode: "DRY", priority: 1 }
              as: FleetPlanner
              captures: { order_1: $.data.id }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_id}", cases: 200, weight_lbs: 4400, requested_window_start: "2026-08-20T06:00:00Z", requested_window_end: "2026-08-20T18:00:00Z", temperature_mode: "DRY", priority: 1 }
