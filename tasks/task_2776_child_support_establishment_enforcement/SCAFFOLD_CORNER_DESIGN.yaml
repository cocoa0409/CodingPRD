# §1.9 Scaffold Corner Design — Breadth Index
# Domain: child-support-enforcement (task_2776)
#
# Walk of references/claim-extraction-guide.md against this scaffold's
# §1.1–§1.7 surface. The nine `section:` values are the guide's nine sections;
# every `claim_type:` is a row from that section's table. Corners already
# proven by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:`
# stubs. Every numeric literal below was produced by executing the §1.3
# formulas and their `constants:` as code — none are estimates.
#
# Logical clock: the server default is 2026-08-01T00:00:00Z; every chain sets
# it explicitly first so no instance depends on the default.

scaffold_corner_design:

  # ====================================================================
  # Table 1 — Entities, plus the entity_topology row for
  # complexity_profile.entity_topology == flat.
  # ====================================================================
  - section: entities
    instances:

      - name: participant_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - "entities.Participant"
          - "endpoints[POST /child-support/participants]"
          - "response_envelope.success"
        distinguishing_aspect: >
          A single POST /child-support/participants with all four required inputs
          returns 201 and a body carrying every one of Participant's 21 declared
          fields plus the four common fields, wrapped in the declared
          meta/response_type/data envelope; nothing is left for a follow-up GET to
          fill in.
        test_recipe:
          setup:
            - "Empty database. Logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Alex Ruiz", ssn_last4: "1111", residence_state_code: "MN", employer_name: "Northline Fabrication LLC", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { pid: "$.data.id", ver: "$.data.version", created: "$.data.created_at", updated: "$.data.updated_at", ls: "$.data.locate_status", lac: "$.data.locate_attempt_count", ers: "$.data.enforcement_risk_score", ert: "$.data.enforcement_risk_tier", crs: "$.data.compromise_risk_score", crt: "$.data.compromise_risk_tier", tac: "$.data.total_arrears_certified_cents", occ: "$.data.open_case_count" }
          assert:
            - "HTTP status is 201"
            - "response_type == object and meta carries api_request_id and api_request_timestamp"
            - "${pid} is a server-minted uuid string"
            - "${ver} == 1"
            - "${created} == 2026-08-01T00:00:00Z and ${updated} == 2026-08-01T00:00:00Z"
            - "role_type == NONCUSTODIAL_PARTY, full_name == Alex Ruiz, ssn_last4 == 1111, residence_state_code == MN"
            - "employer_name == Northline Fabrication LLC, monthly_gross_income_cents == 300000, income_verification_source == VERIFIED_WAGE_RECORD"
            - "supports_second_family == false and has_valid_drivers_license == true"
            - "${ls} == NOT_NEEDED and ${lac} == 0"
            - "license_suspension_active == false, lien_recorded == false, credit_bureau_reported == false"
            - "${ers} == 0 and ${ert} == LOW  # no cases yet, every risk component is 0"
            - "${crs} == 0 and ${crt} == LOW"
            - "${tac} == 0 and ${occ} == 0"

      - name: case_single_read_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - "entities.SupportCase"
          - "endpoints[GET /child-support/cases/{case_id}]"
          - "endpoints[POST /child-support/cases]"
        distinguishing_aspect: >
          GET /child-support/cases/{case_id} on a freshly opened case echoes the
          five input fields byte-for-byte and reports the three status dimensions at
          their initial states with all nine money fields at 0 — the read adds
          nothing and loses nothing.
        test_recipe:
          setup:
            - "One DIRECT_APPLICATION case, child_count 2, tanf_assistance false, good_cause_claim false; CP income 200000 and NCP income 300000, both VERIFIED_WAGE_RECORD; NCP locate_status LOCATED."
            - "No paternity action, order, charge or payment exists yet."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Dana Ruiz", ssn_last4: "1111", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Alex Ruiz", ssn_last4: "2222", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "GET /child-support/cases/${case_id}"
              as: CaseWorker
              captures: { cs: "$.data.case_status", ep: "$.data.enforcement_posture", ir: "$.data.interstate_role", ap: "$.data.arrears_principal_cents", ir2: "$.data.interest_receivable_cents", aa: "$.data.assigned_arrears_cents", ua: "$.data.unassigned_arrears_cents", uc: "$.data.unapplied_credit_cents", lrc: "$.data.locate_referral_count", cv: "$.data.version" }
          assert:
            - "HTTP status is 200"
            - "case_type == DIRECT_APPLICATION, child_count == 2, tanf_assistance == false, good_cause_claim == false"
            - "custodial_party_id == ${cp_id} and noncustodial_party_id == ${ncp_id}"
            - "${cs} == OPENED, ${ep} == NORMAL, ${ir} == NONE"
            - "${ap} == 0, ${ir2} == 0, ${aa} == 0, ${ua} == 0, ${uc} == 0"
            - "total_charged_principal_cents == 0, total_collected_principal_cents == 0, interest_collected_cents == 0, interest_written_off_cents == 0"
            - "${lrc} == 0, closed_reason == null, closed_at == null"
            - "${cv} == 1  # nothing has touched the case since POST /child-support/cases; no paternity action, charge or payment exists to bump it"
            - "the response envelope is meta + response_type object + data"

      - name: charge_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - "entities.ObligationCharge"
          - "endpoints[GET /child-support/charges]"
          - "response_envelope.pagination_fields"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: >
          With exactly three charges on one order, GET /child-
          support/charges?order_id=..&limit=2&offset=0 returns 2 rows with
          total_count 3 and has_more true, and the same query at offset 2 returns 1
          row with has_more false; omitting limit returns all 3 under the declared
          default of 10.
        test_recipe:
          setup:
            - "Standard core: DIRECT_APPLICATION case, PRESUMED_MARITAL paternity, one ENTERED CURRENT_SUPPORT order at the guideline amount 75000."
            - "Three OPEN CURRENT_SUPPORT charges of 75000 each, periods 2026-08-01/09-01, 09-01/10-01 and 10-01/11-01, due 2026-08-15, 09-15 and 10-15."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Dana Ruiz", ssn_last4: "1111", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Alex Ruiz", ssn_last4: "2222", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { case_id: "$.data.id" }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
              captures: { pa_id: "$.data.id" }
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { order_id: "$.data.id" }
            - call: "POST /child-support/orders/${order_id}/guideline-calculation"
              payload: {}
              as: CaseWorker
              captures: { guideline: "$.data.guideline_monthly_cents" }
            - call: "POST /child-support/orders/${order_id}/entry"
              payload: {}
              as: SupervisingAttorney
              captures: { monthly: "$.data.monthly_obligation_cents" }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15" }
              as: FinanceOfficer
              captures: { ch1_id: "$.data.id" }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-09-01", period_end_date: "2026-10-01", due_date: "2026-09-15" }
              as: FinanceOfficer
              captures: { ch2_id: "$.data.id" }
            - call: "POST /child-support/orders/${order_id}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-10-01", period_end_date: "2026-11-01", due_date: "2026-10-15" }
              as: FinanceOfficer
              captures: { ch3_id: "$.data.id" }
          trigger:
            - call: "GET /child-support/charges"
              payload: { order_id: "${order_id}", limit: 2, offset: 0 }
              as: FinanceOfficer
              captures: { p1_first: "$.data[0].id", p1_tc: "$.meta.total_count", p1_hm: "$.meta.has_more" }
            - call: "GET /child-support/charges"
              payload: { order_id: "${order_id}", limit: 2, offset: 2 }
              as: FinanceOfficer
              captures: { p2_first: "$.data[0].id", p2_tc: "$.meta.total_count", p2_hm: "$.meta.has_more" }
            - call: "GET /child-support/charges"
              payload: { order_id: "${order_id}" }
              as: FinanceOfficer
              captures: { all_tc: "$.meta.total_count" }
            - call: "GET /child-support/charges"
              payload: { order_id: "${order_id}", status: "VOID" }
              as: FinanceOfficer
              captures: { void_tc: "$.meta.total_count" }
          assert:
            - "page 1 data length == 2, ${p1_tc} == 3, ${p1_hm} == true, limit == 2, offset == 0"
            - "page 2 data length == 1, ${p2_tc} == 3, ${p2_hm} == false"
            - "${p1_first} != ${p2_first} and the union of both pages is exactly {${ch1_id}, ${ch2_id}, ${ch3_id}}"
            - "the unpaginated call returns data length == 3 with ${all_tc} == 3 and has_more == false under the declared default limit of 10"
            - "the status=VOID filter returns data length == 0 with ${void_tc} == 0"
            - "response_type == array on every one of these reads"

      - name: every_path_id_segment_returns_its_own_not_found_error
        claim_type: not_found
        grounds:
          - "errors[ERR_PARTICIPANT_NOT_FOUND]"
          - "errors[ERR_CASE_NOT_FOUND]"
          - "errors[ERR_PATERNITY_ACTION_NOT_FOUND]"
          - "errors[ERR_ORDER_NOT_FOUND]"
          - "errors[ERR_EMPLOYER_NOT_FOUND]"
          - "errors[ERR_IWO_NOT_FOUND]"
          - "errors[ERR_CHARGE_NOT_FOUND]"
          - "errors[ERR_PAYMENT_NOT_FOUND]"
          - "errors[ERR_REVIEW_NOT_FOUND]"
          - "errors[ERR_ENFORCEMENT_ACTION_NOT_FOUND]"
          - "errors[ERR_REFERRAL_NOT_FOUND]"
          - "errors[ERR_OFFER_NOT_FOUND]"
          - "validations[priority 6]"
        distinguishing_aspect: >
          Twelve reads against one well-formed but absent uuid produce twelve
          DISTINCT error_ids — a shared generic ERR_NOT_FOUND fails this instance,
          because §1.4 priority 6 declares one existence rule per entity.
        test_recipe:
          setup:
            - "Empty database apart from the clock set. The uuid 00000000-0000-4000-8000-000000000000 is never minted by any call."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /child-support/participants/00000000-0000-4000-8000-000000000000"
              as: CaseWorker
              captures: { e_participant: "$.data.error_id" }
            - call: "GET /child-support/cases/00000000-0000-4000-8000-000000000000"
              as: CaseWorker
              captures: { e_case: "$.data.error_id" }
            - call: "GET /child-support/paternity-actions/00000000-0000-4000-8000-000000000000"
              as: CaseWorker
              captures: { e_paternity_action: "$.data.error_id" }
            - call: "GET /child-support/orders/00000000-0000-4000-8000-000000000000"
              as: CaseWorker
              captures: { e_order: "$.data.error_id" }
            - call: "GET /child-support/employers/00000000-0000-4000-8000-000000000000"
              as: CaseWorker
              captures: { e_employer: "$.data.error_id" }
            - call: "GET /child-support/withholding-orders/00000000-0000-4000-8000-000000000000"
              as: CaseWorker
              captures: { e_iwo: "$.data.error_id" }
            - call: "GET /child-support/charges/00000000-0000-4000-8000-000000000000"
              as: CaseWorker
              captures: { e_charge: "$.data.error_id" }
            - call: "GET /child-support/payments/00000000-0000-4000-8000-000000000000"
              as: CaseWorker
              captures: { e_payment: "$.data.error_id" }
            - call: "GET /child-support/modification-reviews/00000000-0000-4000-8000-000000000000"
              as: CaseWorker
              captures: { e_review: "$.data.error_id" }
            - call: "GET /child-support/enforcement-actions/00000000-0000-4000-8000-000000000000"
              as: CaseWorker
              captures: { e_enforcement_action: "$.data.error_id" }
            - call: "GET /child-support/interstate-referrals/00000000-0000-4000-8000-000000000000"
              as: CaseWorker
              captures: { e_referral: "$.data.error_id" }
            - call: "GET /child-support/compromise-offers/00000000-0000-4000-8000-000000000000"
              as: CaseWorker
              captures: { e_offer: "$.data.error_id" }
          assert:
            - "every one of the twelve reads returns HTTP 404 with response_type error"
            - "${e_participant} == ERR_PARTICIPANT_NOT_FOUND"
            - "${e_case} == ERR_CASE_NOT_FOUND"
            - "${e_paternity_action} == ERR_PATERNITY_ACTION_NOT_FOUND"
            - "${e_order} == ERR_ORDER_NOT_FOUND"
            - "${e_employer} == ERR_EMPLOYER_NOT_FOUND"
            - "${e_iwo} == ERR_IWO_NOT_FOUND"
            - "${e_charge} == ERR_CHARGE_NOT_FOUND"
            - "${e_payment} == ERR_PAYMENT_NOT_FOUND"
            - "${e_review} == ERR_REVIEW_NOT_FOUND"
            - "${e_enforcement_action} == ERR_ENFORCEMENT_ACTION_NOT_FOUND"
            - "${e_referral} == ERR_REFERRAL_NOT_FOUND"
            - "${e_offer} == ERR_OFFER_NOT_FOUND"
            - "the twelve captured error_ids are pairwise distinct"
            - "each error body carries data.error_id and data.message and no entity payload"

      - name: case_creation_missing_required_child_count_is_rejected
        claim_type: required_fields
        grounds:
          - "entities.SupportCase.fields.child_count"
          - "entities.SupportCase.fields.tanf_assistance"
          - "endpoints[POST /child-support/cases]"
          - "validations[priority 7]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: >
          Each of the five §1.5 inputs for POST /child-support/cases that has source
          input and no declared default (case_type, custodial_party_id,
          noncustodial_party_id, child_count, tanf_assistance) produces
          ERR_VALIDATION 422 when omitted, while omitting the one input that DOES
          declare a default (good_cause_claim) succeeds.
        test_recipe:
          setup:
            - "Two participants exist and the NCP is LOCATED; no case has been opened."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Dana Ruiz", ssn_last4: "1111", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Alex Ruiz", ssn_last4: "2222", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncp_id: "$.data.id" }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
          trigger:
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", tanf_assistance: false }
              as: CaseWorker
              captures: { e_kids: "$.data.error_id" }
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2 }
              as: CaseWorker
              captures: { e_tanf: "$.data.error_id" }
            - call: "POST /child-support/cases"
              payload: { custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false }
              as: CaseWorker
              captures: { e_type: "$.data.error_id" }
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false }
              as: CaseWorker
              captures: { e_cp: "$.data.error_id" }
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", child_count: 2, tanf_assistance: false }
              as: CaseWorker
              captures: { e_ncp: "$.data.error_id" }
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 2, tanf_assistance: false }
              as: CaseWorker
              captures: { ok_gc: "$.data.good_cause_claim" }
          assert:
            - "${e_kids} == ERR_VALIDATION with HTTP 422"
            - "${e_tanf} == ERR_VALIDATION with HTTP 422"
            - "${e_type} == ERR_VALIDATION with HTTP 422"
            - "${e_cp} == ERR_VALIDATION with HTTP 422"
            - "${e_ncp} == ERR_VALIDATION with HTTP 422"
            - "the final call returns 201 with ${ok_gc} == false, proving good_cause_claim is the only optional member of the set"
            - "GET /child-support/cases returns total_count == 1 — none of the five rejected calls persisted a row"

      - name: omitted_optional_inputs_fall_back_to_their_declared_defaults
        claim_type: defaults
        grounds:
          - "entities.Participant.fields.income_verification_source"
          - "entities.Participant.fields.supports_second_family"
          - "entities.Participant.fields.has_valid_drivers_license"
          - "entities.SupportCase.fields.good_cause_claim"
          - "entities.Employer.fields.remittance_fee_cents"
          - "entities.SupportOrder.fields.medical_support_monthly_cents"
          - "entities.PaternityAction.fields.notary_verified"
        distinguishing_aspect: >
          Four entities are created with every optional input omitted and each
          declared default appears verbatim: income_verification_source NONE,
          supports_second_family false, has_valid_drivers_license true,
          good_cause_claim false, remittance_fee_cents 0 and
          medical_support_monthly_cents 0 — not null and not absent from the
          response.
        test_recipe:
          setup:
            - "Empty database. Only the four required Participant inputs, the five required case inputs, the four required Employer inputs and the three required order inputs are supplied."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Dana Ruiz", ssn_last4: "1212", residence_state_code: "MN" }
              as: CaseWorker
              captures: { cp_id: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Alex Ruiz", ssn_last4: "1313", residence_state_code: "MN" }
              as: CaseWorker
              captures: { ncp_id: "$.data.id", d_ivs: "$.data.income_verification_source", d_ssf: "$.data.supports_second_family", d_dl: "$.data.has_valid_drivers_license", d_inc: "$.data.monthly_gross_income_cents", d_emp: "$.data.employer_name" }
            - call: "POST /child-support/participants/${ncp_id}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
          trigger:
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cp_id}", noncustodial_party_id: "${ncp_id}", child_count: 1, tanf_assistance: false }
              as: CaseWorker
              captures: { case_id: "$.data.id", d_gc: "$.data.good_cause_claim" }
            - call: "POST /child-support/employers"
              payload: { legal_name: "Kestrel Metalworks Inc", fein: "41-0000102", state_code: "MN", pay_frequency: "MONTHLY" }
              as: ProgramAdmin
              captures: { d_fee: "$.data.remittance_fee_cents", d_cap: "$.data.statutory_cap_pct", d_cnt: "$.data.active_iwo_count" }
            - call: "POST /child-support/cases/${case_id}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
              captures: { pa_id: "$.data.id", d_notary: "$.data.notary_verified", d_rc: "$.data.rescission_count", d_gcost: "$.data.genetic_cost_cents", d_liable: "$.data.genetic_cost_liable_party" }
            - call: "POST /child-support/cases/${case_id}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
