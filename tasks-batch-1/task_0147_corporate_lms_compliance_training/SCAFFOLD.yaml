    path: "/learning-paths/{id}/publish"
    description: "Publish a path (DRAFT->PUBLISHED)"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: LearningPath
    side_effects: ["validates steps/sequence/published-courses; increments LearningPath.version"]
  - method: POST
    path: "/learning-paths/{id}/archive"
    description: "Archive a path (PUBLISHED->ARCHIVED)"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: LearningPath
    side_effects: ["increments LearningPath.version"]

  # ---- Steps reverse-reachability for PathStep.course_id -------------------
  - method: GET
    path: "/path-steps"
    description: "List path steps, filterable by course_id (reverse-reachability for PathStep.course_id) or learning_path_id"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: ["course_id?", "learning_path_id?", "limit?", "offset?"]
    output: PathStep[]
    side_effects: []
  - method: GET
    path: "/path-steps/{id}"
    description: "Get one path step"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: []
    output: PathStep
    side_effects: []

  # ---- Assignment rules ----------------------------------------------------
  - method: POST
    path: "/assignment-rules"
    description: "Create a rule-based assignment (department+role -> course|path)"
    roles: [ComplianceAdmin]
    code: 201
    input: [target_department, target_job_role, "course_id?", "learning_path_id?", due_in_days, effective_from, effective_to]
    output: AssignmentRule
    side_effects: ["window-overlap check; exactly-one-target check; status=ACTIVE"]
  - method: GET
    path: "/assignment-rules"
    description: "List assignment rules (filter by course_id / learning_path_id — reverse-reachability for those FKs)"
    roles: [ComplianceAdmin, Manager]
    code: 200
    input: ["course_id?", "learning_path_id?", "status?", "limit?", "offset?"]
    output: AssignmentRule[]
    side_effects: []
  - method: GET
    path: "/assignment-rules/{id}"
    description: "Get one assignment rule"
    roles: [ComplianceAdmin, Manager]
    code: 200
    input: []
    output: AssignmentRule
    side_effects: []
  - method: POST
    path: "/assignment-rules/{id}/apply"
    description: "Sweep: create Enrollments/PathEnrollments for all matching ACTIVE employees within the effective window"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: "{ created_enrollment_ids: string[], created_path_enrollment_ids: string[], created_count: integer }"
    side_effects: ["creates one Enrollment or PathEnrollment per matching employee with due_date = current_utc + due_in_days; sets assignment_rule_id; skips employees already in an open cycle"]

  # ---- Enrollments ---------------------------------------------------------
  - method: POST
    path: "/enrollments"
    description: "Self/admin enroll an employee into a course"
    roles: [ComplianceAdmin, Learner]
    code: 201
    input: [employee_id, course_id, "is_required?", "due_in_days?"]
    output: Enrollment
    side_effects: ["due_date = current_utc + due_in_days (default 30); status=NOT_STARTED; cycle_index=1"]
  - method: GET
    path: "/enrollments"
    description: "List enrollments, filterable by employee_id / course_id / assignment_rule_id / path_enrollment_id / status — reverse-reachability for all four Enrollment FKs (manager & learner scopes apply)"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: ["employee_id?", "course_id?", "assignment_rule_id?", "path_enrollment_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: GET
    path: "/enrollments/{id}"
    description: "Get one enrollment"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/start"
    description: "Learner starts an enrollment (NOT_STARTED->IN_PROGRESS)"
    roles: [Learner]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["course-published + prerequisite + path-sequence gates; bubbles PathEnrollment to IN_PROGRESS; increments Enrollment.version"]
  - method: POST
    path: "/enrollments/{id}/quiz-attempts"
    description: "Record a quiz attempt; passing/failing-final drives COMPLETED/FAILED with full cascade"
    roles: [Learner]
    code: 201
    input: [score, expected_enrollment_version]
    output: QuizAttempt
    side_effects: ["OCC: rejects if expected_enrollment_version != Enrollment.version", "recomputes best_score/latest_score/attempts_used", "on pass -> COMPLETED + issue Certificate + CEU + compliance recompute", "on failing-final -> FAILED", "increments Enrollment.version by 1"]
  - method: GET
    path: "/enrollments/{id}/quiz-attempts"
    description: "List an enrollment's quiz attempts (reverse-reachability for QuizAttempt.enrollment_id)"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: ["cycle_index?", "limit?", "offset?"]
    output: QuizAttempt[]
    side_effects: []
  - method: POST
    path: "/enrollments/{id}/reopen"
    description: "Admin reopens a FAILED enrollment for retry (FAILED->IN_PROGRESS)"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["resets attempts for the cycle; bubbles PathEnrollment back to IN_PROGRESS; increments Enrollment.version"]
  - method: POST
    path: "/enrollments/{id}/waive"
    description: "Admin waives an enrollment (->WAIVED)"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["recomputes PathEnrollment progress treating waived mandatory steps as satisfied; increments Enrollment.version"]

  # ---- Tracking sessions (SCORM/xAPI) --------------------------------------
  - method: POST
    path: "/enrollments/{id}/tracking-sessions"
    description: "Open a SCORM/xAPI tracking session (INITIALIZED)"
    roles: [Learner]
    code: 201
    input: []
    output: TrackingSession
    side_effects: ["copies content_type from course; started_at=current_utc; single-open-session check"]
  - method: GET
    path: "/enrollments/{id}/tracking-sessions"
    description: "List an enrollment's tracking sessions (reverse-reachability for TrackingSession.enrollment_id)"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TrackingSession[]
    side_effects: []
  - method: PATCH
    path: "/tracking-sessions/{id}/commit"
    description: "Commit runtime data (INITIALIZED->RUNNING / RUNNING self-loop)"
    roles: [Learner]
    code: 200
    input: [lesson_status, progress_pct, "reported_score?"]
    output: TrackingSession
    side_effects: ["updates lesson_status/progress_pct/reported_score; increments TrackingSession.version"]
  - method: POST
    path: "/tracking-sessions/{id}/terminate"
    description: "Terminate session; promotes reported_score to a QuizAttempt and drives the enrollment"
    roles: [Learner]
    code: 200
    input: ["expected_enrollment_version?"]
    output: TrackingSession
    side_effects: ["terminated_at=current_utc; if reported_score present, promotes a QuizAttempt and applies Enrollment completion/failure cascade (OCC checked when expected_enrollment_version supplied)"]

  # ---- Path enrollments ----------------------------------------------------
  - method: POST
    path: "/path-enrollments"
    description: "Enroll an employee into a learning path; creates child course Enrollments"
    roles: [ComplianceAdmin, Learner]
    code: 201
    input: [employee_id, learning_path_id, "due_in_days?"]
    output: PathEnrollment
    side_effects: ["creates one child Enrollment per PathStep with path_enrollment_id set; due_date = current_utc + due_in_days (default 60)"]
  - method: GET
    path: "/path-enrollments"
    description: "List path enrollments, filterable by employee_id / learning_path_id / assignment_rule_id / status — reverse-reachability for all three PathEnrollment FKs"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: ["employee_id?", "learning_path_id?", "assignment_rule_id?", "status?", "limit?", "offset?"]
    output: PathEnrollment[]
    side_effects: []
  - method: GET
    path: "/path-enrollments/{id}"
    description: "Get one path enrollment with computed progress_pct"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: []
    output: PathEnrollment
    side_effects: ["recomputes progress_pct on read"]

  # ---- Certificates --------------------------------------------------------
  - method: GET
    path: "/certificates"
    description: "List certificates, filterable by employee_id / course_id / enrollment_id / status — reverse-reachability for all three Certificate FKs"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: ["employee_id?", "course_id?", "enrollment_id?", "status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []
  - method: GET
    path: "/certificates/{id}"
    description: "Get one certificate"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: POST
    path: "/certificates/{id}/revoke"
    description: "Admin revokes a certificate (ACTIVE->REVOKED), compensating CEU/compliance"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: Certificate
    side_effects: ["deducts ceu_credited from holder; decrements compliant_required_count when required; recomputes compliance_score; increments Certificate.version"]

  # ---- Escalations ---------------------------------------------------------
  - method: POST
    path: "/escalations/run"
    description: "System sweep: expire overdue enrollments, expire due certs (driving recurrence resets), and emit EscalationEvents per tier"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: "{ expired_enrollment_ids: string[], expired_certificate_ids: string[], reset_enrollment_ids: string[], escalation_event_ids: string[] }"
    side_effects: ["EXPIRES overdue NOT_STARTED/IN_PROGRESS enrollments; EXPIRES certs past expires_at -> recurrence-resets linked enrollments (compensating CEU/compliance); recomputes escalation_tier and appends EscalationEvent per overdue enrollment at tier>=1"]
  - method: GET
    path: "/escalation-events"
    description: "List escalation events, filterable by enrollment_id / employee_id / manager_id — reverse-reachability for all three EscalationEvent FKs; manager dashboard feed"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: ["enrollment_id?", "employee_id?", "manager_id?", "acknowledged?", "tier?", "limit?", "offset?"]
    output: EscalationEvent[]
    side_effects: []
  - method: GET
    path: "/escalation-events/{id}"
    description: "Get one escalation event"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: []
    output: EscalationEvent
    side_effects: []
  - method: POST
    path: "/escalation-events/{id}/acknowledge"
    description: "Manager acknowledges an escalation event for one of their reports"
    roles: [ComplianceAdmin, Manager]
    code: 200
    input: []
    output: EscalationEvent
    side_effects: ["sets acknowledged=true"]

  # ---- Test-driving clock --------------------------------------------------
  - method: POST
    path: "/_clock/set"
    description: "Set the deterministic system clock (test-driving)"
    roles: [ComplianceAdmin]
    code: 200
    input: [current_utc]
    output: ClockState
    side_effects: ["sets ClockState.current_utc; increments ClockState.version"]
  - method: GET
    path: "/_clock"
    description: "Read the current deterministic clock"
    roles: [ComplianceAdmin, Manager, Learner]
    code: 200
    input: []
    output: ClockState
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role, or missing X-User-ID for an entity-backed role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or ownership/manager-scope check failed" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-id or body FK references a non-existent resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed type, enum out of range, score outside 0-100, non-positive where positive required, or AssignmentRule not setting exactly one target" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_enrollment_version does not match Enrollment.version on quiz-attempt submission (OCC)" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Unique constraint violated: Course.code, LearningPath.code, Employee.email, PathStep.sequence_index within path, or duplicate open-cycle Enrollment for (employee,course)" }
  - { id: ERR_RECURRENCE_CONFIG_INVALID, http: 409, condition: "Publishing a course with is_recurring=true but recurrence_months not a positive integer" }
  - { id: ERR_PREREQUISITE_NOT_PUBLISHED, http: 409, condition: "Publishing a course whose prerequisite course is not PUBLISHED" }
  - { id: ERR_COURSE_HAS_OPEN_ENROLLMENTS, http: 409, condition: "Archiving a course with NOT_STARTED/IN_PROGRESS enrollments" }
  - { id: ERR_PATH_EMPTY, http: 409, condition: "Publishing a path with no steps" }
  - { id: ERR_PATH_STEP_COURSE_NOT_PUBLISHED, http: 409, condition: "Publishing a path containing a step whose course is not PUBLISHED" }
  - { id: ERR_PATH_SEQUENCE_INVALID, http: 409, condition: "Publishing a path whose step sequence_index values are not contiguous 1..N" }
  - { id: ERR_PATH_HAS_OPEN_ENROLLMENTS, http: 409, condition: "Archiving a path with NOT_STARTED/IN_PROGRESS path enrollments" }
  - { id: ERR_COURSE_NOT_PUBLISHED, http: 409, condition: "Starting/reopening an enrollment whose course is not PUBLISHED" }
  - { id: ERR_PREREQUISITE_NOT_MET, http: 409, condition: "Starting an enrollment whose course prerequisites lack an ACTIVE certificate for the learner" }
  - { id: ERR_PATH_STEP_LOCKED, http: 409, condition: "Starting a path-step enrollment before the prior step's enrollment is COMPLETED (enforce_sequence)" }
  - { id: ERR_ATTEMPTS_EXHAUSTED, http: 409, condition: "Recording a quiz attempt on a FAILED enrollment (the cycle's attempts_used has reached course.max_attempts); reopen or recurrence reset is required first" }
  - { id: ERR_SESSION_ALREADY_OPEN, http: 409, condition: "Opening a tracking session while another non-TERMINATED session exists for the enrollment" }
  - { id: ERR_ASSIGNMENT_RULE_OVERLAP, http: 409, condition: "New ACTIVE assignment rule's effective window overlaps an existing ACTIVE rule for the same target+course/path" }
  - { id: ERR_PREREQUISITE_CYCLE, http: 409, condition: "Adding a course prerequisite that would create a cycle in the prerequisite DAG" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceAdmin
    description: "Owns catalog config (courses, paths, steps, prerequisites), assignment rules and their sweeps, waivers, reopens, certificate revocation, escalation runs, and the test clock. Read access to everything."
    identity: "opaque"
    exclusive_operations:
      - "POST /employees"
      - "POST /courses, /courses/{id}/publish, /courses/{id}/archive, /courses/{id}/prerequisites"
      - "POST /learning-paths, /learning-paths/{id}/steps, /learning-paths/{id}/publish, /learning-paths/{id}/archive"
      - "POST /assignment-rules, /assignment-rules/{id}/apply"
      - "POST /enrollments/{id}/reopen, /enrollments/{id}/waive"
      - "POST /certificates/{id}/revoke"
      - "POST /escalations/run"
      - "POST /_clock/set"
    shared_operations:
      - "POST /enrollments, /path-enrollments (also Learner)"
      - "All GET reads; POST /escalation-events/{id}/acknowledge (also Manager)"
  - name: Manager
    description: "Reviews own direct/indirect reports: dashboards, enrollments, certificates, escalation feed; acknowledges escalations. Cannot mutate catalog or learner content."
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "GET /employees, /employees/{id}, /employees/{id}/dashboard and report-scoped lists"
      - "GET /escalation-events (manager_id scope); POST /escalation-events/{id}/acknowledge (also ComplianceAdmin)"
  - name: Learner
    description: "Acts on own enrollments: start, quiz attempts, tracking sessions; self-enroll into courses/paths; reads own data."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /enrollments/{id}/start"
      - "POST /enrollments/{id}/quiz-attempts"
      - "POST /enrollments/{id}/tracking-sessions, PATCH /tracking-sessions/{id}/commit, POST /tracking-sessions/{id}/terminate"
    shared_operations:
      - "POST /enrollments, /path-enrollments (also ComplianceAdmin)"
      - "GET own enrollments, attempts, sessions, certificates, dashboard"
