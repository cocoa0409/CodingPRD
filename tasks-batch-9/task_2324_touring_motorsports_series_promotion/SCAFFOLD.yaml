scenario: "2324. Touring Motorsports Series Promotion (touring motorsports promoter): venue booking with rental terms, date selection and market rotation across a season, competitor and vehicle logistics including transport, staging and technical inspection, show format design with competition segments, intermission entertainment and run order, ticket sales with pricing tiers, group sales and pre-show pit party add-ons, sponsorship activation with vehicle branding, signage and hospitality obligations, safety planning with barriers, catch fencing, medical staffing and emergency access, local marketing spend allocation with radio, digital and grassroots promotions, event settlement with venue and profitability analysis by market"
domain_name: "touring-motorsports-series-promotion"
api_prefix: ""            # flat topology: every collection is a top-level path (/seasons, /venue-bookings, /tour-stops, ...)

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit FK fields; the only
  # nesting in URL paths is for creation-under-parent and reverse-reachability reads.

  state_machine_shape: cyclic
  # VenueBooking negotiates in rounds (TERMS_PROPOSED -> COUNTERED -> TERMS_PROPOSED),
  # SafetyPlan loops DRAFT -> SUBMITTED -> RETURNED -> DRAFT, EventSettlement loops
  # PREPARED -> DISPUTED -> PREPARED, and TourStop carries two independent state
  # dimensions (sales_state x safety_state) each with its own cycle.

  relationship_patterns:
    - one_to_many          # Season -> VenueBooking, TourStop -> TicketTier / ShowSegment / MarketingAllocation
    - many_to_many         # SponsorshipActivation joins Sponsor x TourStop (and optionally TicketTier + VehicleEntry)
    - self_referential     # TourStop.preceding_stop_id chains the market rotation / transport legs
    - cross_aggregate      # SafetyPlan gates TicketOrder creation; VehicleEntry.tech_status gates ShowSegment

  role_model: segregation_of_duties
  # The SafetyOfficial who authored a plan may not certify it; the FinanceController
  # who prepared a settlement may not approve it. Venue/Competitor/Sponsor roles are
  # entity-backed and may only act on their own resources.

  consistency_model: immediate

difficulty_level: expert_plus
# 15 entities / 64 endpoints / 66 errors / 14 calculations (2 dual-variant) /
# 53 ordered validations / 10 state machines (3 cyclic, 2 parallel-dimension
# pairs, 1 branching self-loop) / 3 named cascades / 2 OCC rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

global_constants:
  CLOCK_DEFAULT_UTC: "2026-08-01T00:00:00Z"
  BOOKING_LEAD_TIME_DAYS: 45
  MAX_NEGOTIATION_ROUNDS: 3
  DEFAULT_MARKET_ROTATION_COOLDOWN_DAYS: 21
  DEFAULT_VENUE_TURNAROUND_HOURS: 12
  HAUL_AVG_MPH: 50
  HAUL_REST_HOURS: 10
  STAGING_OPEN_HOURS_BEFORE_SHOW: 8
  STAGING_CLOSE_HOURS_BEFORE_SHOW: 2
  MAX_TECH_ATTEMPTS: 3
  FLOOR_RESET_MINUTES: 8
  HEAVY_VEHICLE_LBS: 9000
  MAX_BRANDING_SLOTS_PER_VEHICLE: 4
  PIT_PARTY_BUNDLE_DISCOUNT_PCT: 0.15
  STOP_MARKETING_CAP_PCT: 0.20
  CHANNEL_CAP_PCT: { RADIO: 0.40, DIGITAL: 0.60, GRASSROOTS: 0.30 }
  ALS_STAFF_COST_CENTS: 45000
  BLS_STAFF_COST_CENTS: 28000
  AMBULANCE_COST_CENTS: 120000
  BARRIER_COST_PER_FOOT_CENTS: 350
  PURSE_PER_ENTRY_CENTS: 150000
  SPONSOR_HOLDBACK_PCT: 0.50
  MARKETING_COOP_TIERS: "rental_due_pre_credit_cents >= 5000000 -> 0.06; >= 2500000 -> 0.04; else 0.02"

entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: season label, e.g. "2026-27 Thunder Tour"
      - name: year
        type: integer
        source: input
        description: opening calendar year of the season
      - name: season_start_date
        type: string
        source: input
        description: first date (YYYY-MM-DD) a tour date may be booked on
      - name: season_end_date
        type: string
        source: input
        description: last date (YYYY-MM-DD) a tour date may be booked on
      - name: market_rotation_cooldown_days
        type: integer
        source: input
        default: 21
        description: minimum whole days between two CONFIRMED bookings in the same market_code
        constraints: ">= 0"
      - name: total_marketing_budget_cents
        type: integer
        source: input
        description: season-wide local marketing budget the allocations draw down
        constraints: ">= 0"
      - name: marketing_allocated_cents
        type: integer
        source: computed
        default: 0
        description: "sum of MarketingAllocation.amount_cents for allocations with state == COMMITTED across all stops of this season"
      - name: marketing_unallocated_cents
        type: integer
        source: computed
        description: "total_marketing_budget_cents - marketing_allocated_cents (conserved-quantity partner)"
      - name: booking_count
        type: integer
        source: computed
        default: 0
        description: "count of VenueBooking rows with season_id == this Season.id in state IN {TERMS_PROPOSED, COUNTERED, CONFIRMED}"
      - name: settled_stop_count
        type: integer
        source: computed
        default: 0
        description: "count of TourStop rows of this season with sales_state == SETTLED"
      - name: season_net_cents
        type: integer
        source: computed
        default: 0
        description: "sum of EventSettlement.net_to_promoter_cents over settlements with state == APPROVED in this season"
      - name: status
        type: enum
        source: system
        default: PLANNING
        description: season lifecycle
        constraints: "PLANNING | CLOSED"

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: venue name
      - name: market_code
        type: string
        source: input
        description: designated market identifier used by the rotation rule, e.g. "ATL"
      - name: city
        type: string
        source: input
        description: city
      - name: state_code
        type: string
        source: input
        description: two-letter state code
      - name: seat_capacity
        type: integer
        source: input
        description: hard seat cap; ceilings expected_attendance
        constraints: ">= 1"
      - name: floor_type
        type: enum
        source: input
        description: competition floor surface, drives BLS staffing add-on
        constraints: "DIRT | CONCRETE | ASPHALT"
      - name: catch_fence_max_height_ft
        type: integer
        source: input
        description: tallest catch fence the venue's rigging supports
        constraints: ">= 0"
      - name: medical_bay_count
        type: integer
        source: input
        description: on-site medical bays
        constraints: ">= 0"
      - name: load_in_hours_required
        type: integer
        source: input
        description: hours of load-in the venue requires before doors
        constraints: ">= 0"
      - name: staging_bay_count
        type: integer
        source: input
        description: number of staging bays (1..staging_bay_count) the bay selector draws from
        constraints: ">= 0"
      - name: turnaround_hours
        type: integer
        source: input
        default: 12
        description: mandatory buffer hours after tear-down before another load-in may start at this venue
        constraints: ">= 0"

  - name: VenueBooking
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: input
        description: "FK -> Season.id; the season this date belongs to"
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the booked building"
      - name: tour_date
        type: string
        source: input
        description: show date (YYYY-MM-DD), must sit inside the season window
      - name: rental_base_cents
        type: integer
        source: input
        description: flat rental guarantee in the current terms
        constraints: ">= 0"
      - name: revenue_share_pct
        type: number
        source: input
        description: venue share of adjusted ticket gross in the current terms
        constraints: "0 <= x <= 1"
      - name: per_ticket_facility_fee_cents
        type: integer
        source: input
        description: facility fee collected per ticket and remitted to the venue
        constraints: ">= 0"
      - name: load_in_start_utc
        type: datetime
        source: input
        description: start of the venue occupancy interval
      - name: tear_down_end_utc
        type: datetime
        source: input
        description: end of the venue occupancy interval
      - name: state
        type: enum
        source: system
        default: TERMS_PROPOSED
        description: negotiation lifecycle
        constraints: "TERMS_PROPOSED | COUNTERED | CONFIRMED | WITHDRAWN"
      - name: negotiation_round
        type: integer
        source: computed
        default: 1
        description: increments on every counter; capped by MAX_NEGOTIATION_ROUNDS
      - name: terms_source
        type: enum
        source: computed
        default: PROMOTER
        description: which side authored the terms currently on the row
        constraints: "PROMOTER | VENUE"
      - name: last_counter_by_user_id
        type: string
        source: system
        description: X-User-ID of the VenueManager who last countered; null until first counter
      - name: confirmed_at
        type: datetime
        source: system
        description: logical-clock instant the booking was accepted; null before that
      - name: withdraw_reason
        type: string
        source: system
        description: reason recorded on withdrawal; null otherwise

  - name: TourStop
    parent: null
    common_fields: true
    fields:
      - name: season_id
        type: string
        source: computed
        description: "FK -> Season.id; copied from the confirming VenueBooking"
      - name: venue_booking_id
        type: string
        source: computed
        description: "FK -> VenueBooking.id; the CONFIRMED booking that produced this stop"
      - name: preceding_stop_id
        type: string
        source: input
        description: "FK -> TourStop.id; previous stop on the transport chain, null for the first stop of a chain"
      - name: market_code
        type: string
        source: computed
        description: denormalized from the booked Venue.market_code
      - name: event_date
        type: string
        source: computed
        description: denormalized from VenueBooking.tour_date
      - name: doors_open_utc
        type: datetime
        source: input
        description: doors time; null until logistics are patched
      - name: show_start_utc
        type: datetime
        source: input
        description: show start; anchors the staging window and the run-order timeline
      - name: show_window_minutes
        type: integer
        source: input
        default: 150
        description: total minutes available to the run order
        constraints: ">= 0"
      - name: pit_party_price_cents
        type: integer
        source: input
        default: 2450
        description: per-head price of the pre-show pit party add-on
        constraints: ">= 0"
      - name: pit_party_capacity
        type: integer
        source: input
        default: 0
        description: maximum pit party heads for this stop
        constraints: ">= 0"
      - name: pit_party_sold_count
        type: integer
        source: computed
        default: 0
        description: "sum of pit_party_addon_qty over TicketOrder rows of this stop with status == PAID"
      - name: sales_state
        type: enum
        source: system
        default: SALES_PENDING
        description: ticketing dimension of the stop
        constraints: "SALES_PENDING | ON_SALE | SALES_HALTED | SALES_CLOSED | SETTLED | CANCELLED"
      - name: safety_state
        type: enum
        source: system
        default: SAFETY_DRAFT
        description: safety dimension of the stop, evolves independently of sales_state
        constraints: "SAFETY_DRAFT | SAFETY_REVIEW | SAFETY_CERTIFIED | SAFETY_SUSPENDED"
      - name: readiness_posture
        type: enum
        source: computed
        default: RESTRICTED
        description: derived gate over both dimensions plus children (see calculations.stop_readiness_posture)
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: expected_attendance
        type: integer
        source: computed
        default: 0
        description: "MIN(Venue.seat_capacity, sum of TicketTier.allotment for this stop)"
      - name: competition_segment_count
        type: integer
        source: computed
        default: 0
        description: "count of ShowSegment rows of this stop with segment_type == COMPETITION"
      - name: run_order_end_offset_minutes
        type: integer
        source: computed
        default: 0
        description: end_offset_minutes of the highest-positioned ShowSegment of this stop
      - name: tickets_sold_count
        type: integer
        source: computed
        default: 0
        description: "sum of qty over TicketOrder rows of this stop with status == PAID"
      - name: gross_ticket_revenue_cents
        type: integer
        source: computed
        default: 0
        description: "sum of (line_subtotal_cents - group_discount_cents) over PAID orders of this stop"
      - name: addon_revenue_cents
        type: integer
        source: computed
        default: 0
        description: "sum of (addon_subtotal_cents - addon_discount_cents) over PAID orders of this stop"
      - name: facility_fee_collected_cents
        type: integer
        source: computed
        default: 0
        description: "sum of facility_fee_cents over PAID orders of this stop"
      - name: marketing_spend_committed_cents
        type: integer
        source: computed
        default: 0
        description: "sum of MarketingAllocation.amount_cents for this stop with state == COMMITTED"
      - name: sponsorship_committed_cents
        type: integer
        source: computed
        default: 0
        description: "sum of SponsorshipActivation.fee_cents for this stop with state IN {ACTIVATED, FULFILLED}"
      - name: held_hospitality_seat_count
        type: integer
        source: computed
        default: 0
        description: "sum of SponsorshipActivation.hospitality_seat_count for this stop with state IN {ACTIVATED, FULFILLED}"
      - name: haul_distance_miles
        type: integer
        source: input
        default: 0
        description: road miles from the preceding stop's venue to this one
        constraints: ">= 0"
      - name: cancel_reason
        type: string
        source: system
        description: reason propagated from the withdrawing booking; null otherwise

  - name: Competitor
    parent: null
    common_fields: true
    fields:
      - name: team_name
        type: string
        source: input
        description: team name
      - name: driver_name
        type: string
        source: input
        description: driver name
      - name: home_market_code
        type: string
        source: input
        description: home market of the team
      - name: vehicle_class
        type: enum
        source: input
        description: class the team competes in
        constraints: "LIGHT | HEAVY"
      - name: entry_count
        type: integer
        source: computed
        default: 0
        description: "count of VehicleEntry rows of this competitor with logistics_state IN {ENTERED, STAGED}"

  - name: VehicleEntry
    parent: null
    common_fields: true
    fields:
      - name: competitor_id
        type: string
        source: input
        description: "FK -> Competitor.id; the team fielding the vehicle"
      - name: tour_stop_id
        type: string
        source: input
        description: "FK -> TourStop.id; the stop entered"
      - name: vehicle_number
        type: string
        source: input
        description: vehicle number as it appears on the body
      - name: vehicle_weight_lbs
        type: integer
        source: input
        description: race weight; >= HEAVY_VEHICLE_LBS drives the catch-fence requirement and reverses bay selection order
        constraints: ">= 1"
      - name: haul_distance_miles
        type: integer
        source: input
        description: road miles the transporter covers to reach this stop
        constraints: ">= 0"
      - name: scheduled_arrival_utc
        type: datetime
        source: input
        description: transporter ETA promised at entry time
      - name: actual_arrival_utc
        type: datetime
        source: system
        description: logical-clock instant of check-in; null until STAGED
      - name: staging_bay_index
        type: integer
        source: computed
        description: bay chosen by the staging-bay selector at entry time; null when the entry is WITHDRAWN
      - name: logistics_state
        type: enum
        source: system
        default: ENTERED
        description: transport/staging lifecycle
        constraints: "ENTERED | STAGED | WITHDRAWN"
      - name: tech_status
        type: enum
        source: system
        default: TECH_PENDING
        description: technical-inspection dimension driven by TechInspection rows
        constraints: "TECH_PENDING | TECH_CLEARED | TECH_CONDITIONAL | TECH_HELD"
      - name: tech_attempt_count
        type: integer
        source: computed
        default: 0
        description: "count of TechInspection rows for this entry"
      - name: failed_attempt_count
        type: integer
        source: computed
        default: 0
        description: "count of TechInspection rows for this entry with result == FAILED"
      - name: readiness_score
        type: integer
        source: computed
        default: 100
        description: logistics readiness 0..100 (see calculations.logistics_readiness_score)
      - name: readiness_variant
        type: enum
        source: computed
        default: PRE_STAGING
        description: which readiness variant produced readiness_score
        constraints: "PRE_STAGING | POST_STAGING"
      - name: branding_slots_committed
        type: integer
        source: computed
        default: 0
        description: "sum of SponsorshipActivation.vehicle_branding_slots for activations with branded_vehicle_entry_id == this entry and state IN {ACTIVATED, FULFILLED}"

  - name: TechInspection
    parent: null
    common_fields: false
    fields:
      - name: vehicle_entry_id
        type: string
        source: input
        description: "FK -> VehicleEntry.id; the inspected entry"
      - name: attempt_no
        type: integer
        source: computed
        description: "1-based attempt index = vehicle_entry.tech_attempt_count + 1 at insert time"
      - name: result
        type: enum
        source: input
        description: inspection outcome; branches the entry's tech_status
        constraints: "PASSED | CONDITIONAL | FAILED"
      - name: defect_severity
        type: enum
        source: input
        description: worst defect found on this attempt
        constraints: "NONE | MINOR | MAJOR | CRITICAL"
      - name: notes
        type: string
        source: input
        description: inspector notes; optional
      - name: inspected_by_user_id
        type: string
        source: system
        description: X-User-ID of the SafetyOfficial who filed the attempt

  - name: ShowSegment
    parent: null
    common_fields: true
    fields:
      - name: tour_stop_id
        type: string
        source: input
        description: "FK -> TourStop.id; the stop whose run order this segment belongs to"
      - name: featured_vehicle_entry_id
        type: string
        source: input
        description: "FK -> VehicleEntry.id; headline entry for a COMPETITION segment, null when unused"
      - name: segment_type
        type: enum
        source: input
        description: competition heat vs intermission entertainment
        constraints: "COMPETITION | INTERMISSION"
      - name: title
        type: string
        source: input
        description: printed segment title
      - name: run_order_position
        type: integer
        source: input
        description: 1-based slot in the run order; unique per stop
        constraints: ">= 1"
      - name: duration_minutes
        type: integer
        source: input
        description: on-floor minutes
        constraints: ">= 1"
      - name: start_offset_minutes
        type: integer
        source: computed
        description: minutes after show_start_utc this segment begins (half-open interval start)
      - name: end_offset_minutes
        type: integer
        source: computed
        description: minutes after show_start_utc this segment ends (half-open interval end, exclusive)
      - name: reset_gap_minutes
        type: integer
        source: computed
        default: 0
        description: FLOOR_RESET_MINUTES inserted before this segment when the previous position is also COMPETITION, else 0

  - name: TicketTier
    parent: null
    common_fields: true
    fields:
      - name: tour_stop_id
        type: string
        source: input
        description: "FK -> TourStop.id; the stop this tier sells into"
      - name: tier_code
        type: string
        source: input
        description: tier code, unique per stop
      - name: price_cents
        type: integer
        source: input
        description: face price per seat
        constraints: ">= 0"
      - name: allotment
        type: integer
        source: input
        description: seats allotted to this tier; the conserved seat pool
        constraints: ">= 1"
      - name: reserved_seat_count
        type: integer
        source: computed
        default: 0
        description: "sum of qty over TicketOrder rows on this tier with status == PENDING"
      - name: sold_seat_count
        type: integer
        source: computed
        default: 0
        description: "sum of qty over TicketOrder rows on this tier with status == PAID"
      - name: held_seat_count
        type: integer
        source: computed
        default: 0
        description: "sum of hospitality_seat_count over SponsorshipActivation rows with hospitality_tier_id == this tier and state IN {ACTIVATED, FULFILLED}"
      - name: available_seat_count
        type: integer
        source: computed
        description: "allotment - reserved_seat_count - sold_seat_count - held_seat_count"
      - name: group_min_qty
        type: integer
        source: input
        default: 20
        description: minimum seats on one order to qualify as a group sale
        constraints: ">= 1"
      - name: group_discount_pct
        type: number
        source: input
        default: 0.125
        description: discount applied to the ticket line when the group threshold is met
        constraints: "0 <= x <= 1"
      - name: on_sale_start_utc
        type: datetime
        source: input
        description: inclusive start of this tier's selling window
      - name: on_sale_end_utc
        type: datetime
        source: input
        description: inclusive end of this tier's selling window (validation order 34 treats both bounds as inclusive)

  - name: TicketOrder
    parent: null
    common_fields: true
    fields:
      - name: tour_stop_id
        type: string
        source: input
        description: "FK -> TourStop.id; the stop being sold"
      - name: ticket_tier_id
        type: string
        source: input
        description: "FK -> TicketTier.id; the tier being drawn down"
      - name: purchaser_name
        type: string
        source: input
        description: purchaser name
      - name: purchaser_email
        type: string
        source: input
        description: purchaser email
      - name: qty
        type: integer
        source: input
        description: seats ordered
        constraints: ">= 1"
      - name: is_group
        type: boolean
        source: input
        default: false
        description: purchaser claims the group-sales rate
      - name: pit_party_addon_qty
        type: integer
        source: input
        default: 0
        description: pre-show pit party heads added to the order
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: order lifecycle
        constraints: "PENDING | PAID | REFUNDED | VOID"
      - name: line_subtotal_cents
        type: integer
        source: computed
        description: price_cents * qty
      - name: group_discount_cents
        type: integer
        source: computed
        description: rounded group discount on the ticket line, 0 when the group rate does not apply
      - name: addon_subtotal_cents
        type: integer
        source: computed
        description: pit_party_price_cents * pit_party_addon_qty
      - name: addon_discount_cents
        type: integer
        source: computed
        description: rounded pit party bundle discount, 0 unless pit_party_addon_qty == qty
      - name: facility_fee_cents
        type: integer
        source: computed
        description: per_ticket_facility_fee_cents * qty, never discounted
      - name: total_cents
        type: integer
        source: computed
        description: order total (see calculations.ticket_order_amounts)
      - name: paid_at
        type: datetime
        source: system
        description: logical-clock instant of payment; null before that
      - name: refunded_at
        type: datetime
        source: system
        description: logical-clock instant of refund; null before that
      - name: void_reason
        type: string
        source: system
        description: reason recorded when a PENDING order is voided by a cascade; null otherwise

  - name: Sponsor
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: sponsor company name
      - name: category
        type: enum
        source: input
        description: sponsorship category, used by the exclusivity rule
        constraints: "FUEL | TIRE | BEVERAGE | RETAIL | AUTOMOTIVE"
      - name: contact_email
        type: string
        source: input
        description: contact email
      - name: exclusive_category
        type: boolean
        source: input
        default: false
        description: when true, no other activation of the same category may be ACTIVATED on the same stop

  - name: SponsorshipActivation
    parent: null
    common_fields: true
    fields:
      - name: sponsor_id
        type: string
        source: input
        description: "FK -> Sponsor.id; the paying sponsor"
      - name: tour_stop_id
        type: string
        source: input
        description: "FK -> TourStop.id; the activated stop"
      - name: hospitality_tier_id
        type: string
        source: input
        description: "FK -> TicketTier.id; tier the hospitality seats are held against, null when hospitality_seat_count == 0"
      - name: branded_vehicle_entry_id
        type: string
        source: input
        description: "FK -> VehicleEntry.id; entry carrying the sponsor's vehicle branding, null when no branding is bought"
      - name: fee_cents
        type: integer
        source: input
        description: activation fee
        constraints: ">= 0"
      - name: vehicle_branding_slots
        type: integer
        source: input
        description: branding slots bought on branded_vehicle_entry_id
        constraints: ">= 0"
      - name: signage_units
        type: integer
        source: input
        description: signage units owed at the venue
        constraints: ">= 0"
      - name: hospitality_seat_count
        type: integer
        source: input
        default: 0
        description: hospitality seats held out of hospitality_tier_id
        constraints: ">= 0"
      - name: state
        type: enum
        source: system
        default: PROPOSED
        description: activation lifecycle
        constraints: "PROPOSED | ACTIVATED | FULFILLED"
      - name: obligations_fulfilled_at
        type: datetime
        source: system
        description: logical-clock instant obligations were signed off; null before that
      - name: recognized_fee_cents
        type: integer
        source: computed
        default: 0
        description: fee recognized by the settlement variant currently in force (100% when FULFILLED, SPONSOR_HOLDBACK_PCT applied when ACTIVATED under the FINAL variant)

  - name: SafetyPlan
    parent: null
    common_fields: true
    fields:
      - name: tour_stop_id
        type: string
        source: input
        description: "FK -> TourStop.id; at most one plan per stop"
      - name: state
        type: enum
        source: system
        default: DRAFT
        description: plan lifecycle, loops DRAFT -> SUBMITTED -> RETURNED -> DRAFT
        constraints: "DRAFT | SUBMITTED | CERTIFIED | RETURNED"
      - name: barrier_linear_feet
        type: integer
        source: input
        description: linear feet of concrete barrier provisioned
        constraints: ">= 0"
      - name: catch_fence_height_ft
        type: integer
        source: input
        description: catch fence height provisioned
        constraints: ">= 0"
      - name: medical_als_staff_count
        type: integer
        source: input
        description: advanced-life-support medics provisioned
        constraints: ">= 0"
      - name: medical_bls_staff_count
        type: integer
        source: input
        description: basic-life-support medics provisioned
        constraints: ">= 0"
      - name: ambulance_count
        type: integer
        source: input
        description: ambulances on site
        constraints: ">= 0"
      - name: emergency_access_lanes
        type: integer
        source: input
        description: unobstructed emergency access lanes
        constraints: ">= 0"
      - name: required_als_staff_count
        type: integer
        source: computed
        description: requirement from calculations.required_safety_provisioning
      - name: required_bls_staff_count
        type: integer
        source: computed
        description: requirement from calculations.required_safety_provisioning
      - name: required_ambulance_count
        type: integer
        source: computed
        description: requirement from calculations.required_safety_provisioning
      - name: required_catch_fence_height_ft
        type: integer
        source: computed
        description: requirement from calculations.required_safety_provisioning
      - name: required_emergency_access_lanes
        type: integer
        source: computed
        description: requirement from calculations.required_safety_provisioning
      - name: required_barrier_linear_feet
        type: integer
        source: computed
        description: requirement from calculations.required_safety_provisioning
      - name: safety_cost_cents
        type: integer
        source: computed
        default: 0
        description: provisioning cost fed into settlement (see calculations.required_safety_provisioning)
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the SafetyOfficial who created or last PATCHed the plan
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the certifying SafetyOfficial; null until CERTIFIED
      - name: return_count
        type: integer
        source: computed
        default: 0
        description: number of times the plan left SUBMITTED or CERTIFIED for RETURNED
      - name: return_reason
        type: string
        source: system
        description: reason of the most recent return; null otherwise

  - name: MarketingAllocation
    parent: null
    common_fields: true
    fields:
      - name: tour_stop_id
        type: string
        source: input
        description: "FK -> TourStop.id; the market this spend buys"
      - name: channel
        type: enum
        source: input
        description: local marketing channel
        constraints: "RADIO | DIGITAL | GRASSROOTS"
      - name: amount_cents
        type: integer
        source: input
        description: committed spend
        constraints: ">= 1"
      - name: state
        type: enum
        source: system
        default: COMMITTED
        description: allocation lifecycle; RELEASED returns the money to the season pool
        constraints: "COMMITTED | RELEASED"
      - name: released_at
        type: datetime
        source: system
        description: logical-clock instant of release; null while COMMITTED

  - name: EventSettlement
    parent: null
    common_fields: true
    fields:
      - name: tour_stop_id
        type: string
        source: input
        description: "FK -> TourStop.id; at most one settlement per stop"
      - name: state
        type: enum
        source: system
        default: PREPARED
        description: settlement lifecycle, loops PREPARED -> DISPUTED -> PREPARED
        constraints: "PREPARED | DISPUTED | APPROVED"
      - name: variant
        type: enum
        source: computed
        default: PROVISIONAL
        description: which calculation variant produced the money fields on this row
        constraints: "PROVISIONAL | FINAL"
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceController who last prepared the row
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the approving FinanceController; null until APPROVED
      - name: ticket_revenue_cents
        type: integer
        source: computed
        description: included ticket face revenue for the active variant
      - name: addon_revenue_cents
        type: integer
        source: computed
        description: included pit party revenue for the active variant
      - name: facility_fee_cents
        type: integer
        source: computed
        description: included facility fees for the active variant
      - name: sponsorship_revenue_cents
        type: integer
        source: computed
        description: recognized sponsorship revenue for the active variant
      - name: marketing_spend_cents
        type: integer
        source: computed
        description: COMMITTED marketing spend on the stop
      - name: safety_cost_cents
        type: integer
        source: computed
        description: safety provisioning cost copied from the stop's SafetyPlan
      - name: purse_cents
        type: integer
        source: computed
        description: competitor purse = PURSE_PER_ENTRY_CENTS * staged entry count
      - name: rental_due_pre_credit_cents
        type: integer
        source: computed
        description: venue money before the marketing co-op credit
      - name: coop_credit_pct
        type: number
        source: computed
        description: co-op credit rate selected from rental_due_pre_credit_cents
      - name: coop_credit_cents
        type: integer
        source: computed
        description: applied co-op credit
      - name: venue_due_cents
        type: integer
        source: computed
        description: money owed to the venue after the credit
      - name: collected_cash_cents
        type: integer
        source: computed
        description: cash available to the payout waterfall
      - name: net_to_promoter_cents
        type: integer
        source: computed
        description: promoter economics for the active variant, may be negative
      - name: payout_venue_cents
        type: integer
        source: computed
        description: waterfall bucket 1 funded amount
      - name: payout_safety_cents
        type: integer
        source: computed
        description: waterfall bucket 2 funded amount
      - name: payout_marketing_cents
        type: integer
        source: computed
        description: waterfall bucket 3 funded amount
      - name: payout_purse_cents
        type: integer
        source: computed
        description: waterfall bucket 4 funded amount
      - name: promoter_remainder_cents
        type: integer
        source: computed
        description: cash left after all four buckets, floored at 0
      - name: shortfall_cents
        type: integer
        source: computed
        description: total unfunded obligation across the four buckets
      - name: profitability_margin_pct
        type: number
        source: computed
        description: net_to_promoter_cents / collected_cash_cents * 100, two decimals
      - name: dispute_reason
        type: string
        source: system
        description: reason of the most recent dispute; null otherwise
      - name: dispute_count
        type: integer
        source: computed
        default: 0
        description: number of times this settlement has been disputed

state_machines:
  - entity: Season
    state_field: status
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: CLOSED
        trigger: "system, on POST /settlements/{id}/approve when the approved settlement was the last outstanding stop"
        actor: system
        preconditions:
          - "season has >= 1 TourStop"
          - "every TourStop of the season has sales_state IN {SETTLED, CANCELLED}"
          - "at least one TourStop has sales_state == SETTLED"
        side_effects:
          - "sets Season.status = CLOSED"
          - "increments Season.version by 1"
        note: "cascade C link 3 — bubble-up from EventSettlement APPROVED -> TourStop SETTLED -> Season CLOSED"

  - entity: VenueBooking
    state_field: state
    initial_state: TERMS_PROPOSED
    terminal_states: [CONFIRMED, WITHDRAWN]
    transitions:
      - from: TERMS_PROPOSED
        to: COUNTERED
        trigger: "POST /venue-bookings/{id}/counter"
        actor: VenueManager
        preconditions:
          - "X-User-ID == booking.venue_id"
          - "booking.negotiation_round < MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "overwrites rental_base_cents, revenue_share_pct, per_ticket_facility_fee_cents and, when supplied, load_in_start_utc / tear_down_end_utc with the venue's terms"
          - "sets terms_source = VENUE and last_counter_by_user_id = X-User-ID"
          - "increments negotiation_round by 1"
          - "increments VenueBooking.version by 1"
      - from: COUNTERED
        to: TERMS_PROPOSED
        trigger: "POST /venue-bookings/{id}/revise"
        actor: SeriesPromoter
        preconditions:
          - "booking.negotiation_round < MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "overwrites the terms fields with the promoter's revised terms"
          - "sets terms_source = PROMOTER"
          - "increments VenueBooking.version by 1"
        note: "cyclic — COUNTERED -> TERMS_PROPOSED -> COUNTERED repeats until negotiation_round reaches MAX_NEGOTIATION_ROUNDS"
      - from: TERMS_PROPOSED
        to: CONFIRMED
        trigger: "POST /venue-bookings/{id}/accept"
        actor: VenueManager
        preconditions:
          - "X-User-ID == booking.venue_id"
          - "season.status == PLANNING"
          - "no other VenueBooking with state == CONFIRMED on the same venue_id whose occupancy interval collides under calculations.venue_occupancy_conflict"
          - "no other VenueBooking with state == CONFIRMED in the same Venue.market_code within season.market_rotation_cooldown_days of tour_date"
        side_effects:
          - "sets state = CONFIRMED and confirmed_at = current logical clock"
          - "creates one TourStop with season_id, venue_booking_id, market_code = venue.market_code, event_date = tour_date, sales_state = SALES_PENDING, safety_state = SAFETY_DRAFT"
          - "recomputes the new TourStop.readiness_posture (calculations.stop_readiness_posture) which yields RESTRICTED"
          - "increments Season.booking_count is unchanged; increments VenueBooking.version by 1"
      - from: COUNTERED
        to: CONFIRMED
        trigger: "POST /venue-bookings/{id}/accept"
        actor: VenueManager
        preconditions:
          - "X-User-ID == booking.venue_id"
          - "season.status == PLANNING"
          - "no other VenueBooking with state == CONFIRMED on the same venue_id whose occupancy interval collides under calculations.venue_occupancy_conflict"
          - "no other VenueBooking with state == CONFIRMED in the same Venue.market_code within season.market_rotation_cooldown_days of tour_date"
        side_effects:
          - "identical to TERMS_PROPOSED -> CONFIRMED; the terms in force are the venue's counter terms (terms_source == VENUE)"
      - from: TERMS_PROPOSED
        to: WITHDRAWN
        trigger: "POST /venue-bookings/{id}/withdraw"
        actor: SeriesPromoter
        preconditions: []
        side_effects:
          - "sets state = WITHDRAWN, withdraw_reason = reason"
          - "decrements Season.booking_count by 1 and increments Season.version by 1"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /venue-bookings/{id}/withdraw"
        actor: SeriesPromoter
        preconditions: []
        side_effects:
          - "sets state = WITHDRAWN, withdraw_reason = reason"
          - "decrements Season.booking_count by 1 and increments Season.version by 1"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /venue-bookings/{id}/withdraw"
        actor: SeriesPromoter
        preconditions:
          - "the booking's TourStop has sales_state != SETTLED"
        side_effects:
          - "CASCADE A link 1: sets state = WITHDRAWN, withdraw_reason = reason, decrements Season.booking_count by 1"
          - "CASCADE A link 2: because the booking left CONFIRMED, its TourStop sets sales_state = CANCELLED, safety_state = SAFETY_SUSPENDED, cancel_reason = reason"
          - "CASCADE A link 3: because the stop became CANCELLED, every TicketOrder of the stop with status == PENDING moves to VOID (void_reason = 'STOP_CANCELLED') and every TicketOrder with status == PAID moves to REFUNDED"
          - "CASCADE A link 4: because those orders left PENDING/PAID, each TicketOrder's TicketTier decrements reserved_seat_count / sold_seat_count and recomputes available_seat_count, and the stop's tickets_sold_count, gross_ticket_revenue_cents, addon_revenue_cents, facility_fee_collected_cents and pit_party_sold_count decrement by the reversed amounts"
          - "CASCADE A link 5: because the stop became CANCELLED, every MarketingAllocation of the stop with state == COMMITTED moves to RELEASED (released_at = clock), which decrements Season.marketing_allocated_cents, recomputes Season.marketing_unallocated_cents and increments Season.version by 1"
          - "every VehicleEntry of the stop with logistics_state IN {ENTERED, STAGED} moves to WITHDRAWN and clears staging_bay_index"
          - "recomputes TourStop.readiness_posture, which yields FROZEN"

  - entity: TourStop
    state_field: sales_state
    initial_state: SALES_PENDING
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: SALES_PENDING
        to: ON_SALE
        trigger: "POST /tour-stops/{id}/on-sale"
        actor: TicketingManager
        preconditions:
          - "stop.safety_state == SAFETY_CERTIFIED"
          - "stop.competition_segment_count >= 1"
          - "count of TicketTier rows for the stop >= 1"
          - "stop.readiness_posture == OPEN"
        side_effects:
          - "sets sales_state = ON_SALE"
          - "increments TourStop.version by 1"
      - from: ON_SALE
        to: SALES_HALTED
        trigger: "system, whenever readiness_posture leaves OPEN (safety suspension, plan auto-return)"
        actor: system
        preconditions:
          - "stop.readiness_posture != OPEN after recomputation"
        side_effects:
          - "sets sales_state = SALES_HALTED"
          - "every TicketOrder of the stop with status == PENDING moves to VOID (void_reason = 'SALES_HALTED'), releasing reserved_seat_count on its TicketTier"
          - "increments TourStop.version by 1"
      - from: SALES_HALTED
        to: ON_SALE
        trigger: "POST /tour-stops/{id}/resume-sales"
        actor: TicketingManager
        preconditions:
          - "stop.readiness_posture == OPEN"
        side_effects:
          - "sets sales_state = ON_SALE"
          - "increments TourStop.version by 1"
        note: "cycle on the sales dimension: ON_SALE -> SALES_HALTED -> ON_SALE"
      - from: ON_SALE
        to: SALES_CLOSED
        trigger: "POST /tour-stops/{id}/close-sales"
        actor: TicketingManager
        preconditions: []
        side_effects:
          - "sets sales_state = SALES_CLOSED"
          - "every TicketOrder of the stop with status == PENDING moves to VOID (void_reason = 'SALES_CLOSED'), releasing reserved_seat_count on its TicketTier"
          - "increments TourStop.version by 1"
      - from: SALES_HALTED
        to: SALES_CLOSED
        trigger: "POST /tour-stops/{id}/close-sales"
        actor: TicketingManager
        preconditions: []
        side_effects:
          - "identical to ON_SALE -> SALES_CLOSED"
      - from: SALES_CLOSED
        to: SETTLED
        trigger: "system, on POST /settlements/{id}/approve"
        actor: system
        preconditions:
          - "the stop's EventSettlement moved to APPROVED"
        side_effects:
          - "CASCADE C link 2: sets sales_state = SETTLED"
          - "CASCADE C link 3: increments Season.settled_stop_count by 1, adds EventSettlement.net_to_promoter_cents to Season.season_net_cents, increments Season.version by 1, and when every TourStop of the season is SETTLED or CANCELLED sets Season.status = CLOSED"
      - from: SALES_PENDING
        to: CANCELLED
        trigger: "system, on POST /venue-bookings/{id}/withdraw of the CONFIRMED booking"
        actor: system
        preconditions: []
        side_effects:
          - "see CASCADE A links 2-5 on VenueBooking CONFIRMED -> WITHDRAWN"
      - from: ON_SALE
        to: CANCELLED
        trigger: "system, on POST /venue-bookings/{id}/withdraw of the CONFIRMED booking"
        actor: system
        preconditions: []
        side_effects:
          - "see CASCADE A links 2-5 on VenueBooking CONFIRMED -> WITHDRAWN"
      - from: SALES_HALTED
        to: CANCELLED
        trigger: "system, on POST /venue-bookings/{id}/withdraw of the CONFIRMED booking"
        actor: system
        preconditions: []
        side_effects:
          - "see CASCADE A links 2-5 on VenueBooking CONFIRMED -> WITHDRAWN"
      - from: SALES_CLOSED
        to: CANCELLED
        trigger: "system, on POST /venue-bookings/{id}/withdraw of the CONFIRMED booking"
        actor: system
        preconditions: []
        side_effects:
          - "see CASCADE A links 2-5 on VenueBooking CONFIRMED -> WITHDRAWN"

  - entity: TourStop
    state_field: safety_state
    initial_state: SAFETY_DRAFT
    terminal_states: []
    transitions:
      - from: SAFETY_DRAFT
        to: SAFETY_REVIEW
        trigger: "system, on POST /safety-plans/{id}/submit"
        actor: system
        preconditions:
          - "the stop's SafetyPlan moved DRAFT -> SUBMITTED or RETURNED -> SUBMITTED"
        side_effects:
          - "sets safety_state = SAFETY_REVIEW and recomputes readiness_posture"
      - from: SAFETY_REVIEW
        to: SAFETY_CERTIFIED
        trigger: "system, on POST /safety-plans/{id}/certify"
        actor: system
        preconditions:
          - "the stop's SafetyPlan moved SUBMITTED -> CERTIFIED"
        side_effects:
          - "sets safety_state = SAFETY_CERTIFIED and recomputes readiness_posture (may become OPEN)"
      - from: SAFETY_REVIEW
        to: SAFETY_DRAFT
        trigger: "system, on POST /safety-plans/{id}/return"
        actor: system
        preconditions:
          - "the stop's SafetyPlan moved SUBMITTED -> RETURNED"
        side_effects:
          - "sets safety_state = SAFETY_DRAFT and recomputes readiness_posture"
        note: "cycle on the safety dimension: SAFETY_DRAFT -> SAFETY_REVIEW -> SAFETY_DRAFT"
      - from: SAFETY_CERTIFIED
        to: SAFETY_DRAFT
        trigger: "system, on POST /tour-stops/{id}/ticket-tiers when the enlarged expected_attendance raises a requirement above what the CERTIFIED plan provisioned"
        actor: system
        preconditions:
          - "the stop's SafetyPlan moved CERTIFIED -> RETURNED by the auto-return rule"
        side_effects:
          - "CASCADE B link 3: sets safety_state = SAFETY_DRAFT"
          - "CASCADE B link 4: recomputes readiness_posture to RESTRICTED and, when sales_state == ON_SALE, drives sales_state to SALES_HALTED"
          - "CASCADE B link 5: because sales_state became SALES_HALTED, every PENDING TicketOrder of the stop moves to VOID, releasing reserved_seat_count on its TicketTier"
      - from: SAFETY_CERTIFIED
        to: SAFETY_SUSPENDED
        trigger: "POST /tour-stops/{id}/safety-suspend"
        actor: SafetyOfficial
        preconditions:
          - "stop.sales_state != SETTLED"
        side_effects:
          - "sets safety_state = SAFETY_SUSPENDED"
          - "recomputes readiness_posture to FROZEN"
          - "because readiness_posture left OPEN, sales_state ON_SALE moves to SALES_HALTED, which voids every PENDING TicketOrder of the stop and releases their reserved seats"
      - from: SAFETY_SUSPENDED
        to: SAFETY_CERTIFIED
        trigger: "POST /tour-stops/{id}/safety-reinstate"
        actor: SafetyOfficial
        preconditions:
          - "the stop's SafetyPlan.state == CERTIFIED"
          - "stop.sales_state != SETTLED"
        side_effects:
          - "sets safety_state = SAFETY_CERTIFIED and recomputes readiness_posture"
        note: "cycle on the safety dimension: SAFETY_CERTIFIED -> SAFETY_SUSPENDED -> SAFETY_CERTIFIED; sales_state stays SALES_HALTED until resume-sales"
      - from: SAFETY_CERTIFIED
        to: SAFETY_SUSPENDED
        trigger: "system, on POST /venue-bookings/{id}/withdraw of the CONFIRMED booking"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE A link 2 companion: sets safety_state = SAFETY_SUSPENDED"
      - from: SAFETY_DRAFT
        to: SAFETY_SUSPENDED
        trigger: "system, on POST /venue-bookings/{id}/withdraw of the CONFIRMED booking"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE A link 2 companion: sets safety_state = SAFETY_SUSPENDED"

  - entity: SafetyPlan
    state_field: state
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /safety-plans/{id}/submit"
        actor: SafetyOfficial
        preconditions:
          - "medical_als_staff_count >= required_als_staff_count AND medical_bls_staff_count >= required_bls_staff_count AND ambulance_count >= required_ambulance_count"
          - "catch_fence_height_ft >= required_catch_fence_height_ft AND catch_fence_height_ft <= venue.catch_fence_max_height_ft"
          - "emergency_access_lanes >= required_emergency_access_lanes"
          - "barrier_linear_feet >= required_barrier_linear_feet"
        side_effects:
          - "recomputes every required_* field and safety_cost_cents from calculations.required_safety_provisioning"
          - "sets state = SUBMITTED"
          - "drives TourStop.safety_state to SAFETY_REVIEW and recomputes readiness_posture"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /safety-plans/{id}/submit"
        actor: SafetyOfficial
        preconditions:
          - "same four provisioning preconditions as DRAFT -> SUBMITTED"
        side_effects:
          - "identical to DRAFT -> SUBMITTED"
        note: "cyclic — RETURNED -> SUBMITTED -> RETURNED may repeat; return_count records the loops"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /safety-plans/{id}/certify"
        actor: SafetyOfficial
        preconditions:
          - "X-User-ID != plan.authored_by_user_id (segregation of duties)"
          - "the four provisioning preconditions still hold against the freshly recomputed required_* fields"
        side_effects:
          - "sets state = CERTIFIED, certified_by_user_id = X-User-ID"
          - "drives TourStop.safety_state to SAFETY_CERTIFIED and recomputes readiness_posture"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /safety-plans/{id}/return"
        actor: SafetyOfficial
        preconditions: []
        side_effects:
          - "sets state = RETURNED, return_reason = reason, increments return_count by 1"
          - "drives TourStop.safety_state to SAFETY_DRAFT and recomputes readiness_posture"
      - from: RETURNED
        to: DRAFT
        trigger: "PATCH /safety-plans/{id}"
        actor: SafetyOfficial
        preconditions: []
        side_effects:
          - "overwrites the supplied provisioning fields, sets authored_by_user_id = X-User-ID, sets state = DRAFT"
          - "recomputes required_* and safety_cost_cents"
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /safety-plans/{id}"
        actor: SafetyOfficial
        preconditions: []
        side_effects:
          - "overwrites the supplied provisioning fields, sets authored_by_user_id = X-User-ID"
          - "recomputes required_* and safety_cost_cents"
      - from: CERTIFIED
        to: RETURNED
        trigger: "system, on POST /tour-stops/{id}/ticket-tiers when the recomputed requirements exceed the provisioned counts"
        actor: system
        preconditions:
          - "after recomputation at least one of medical_als_staff_count / medical_bls_staff_count / ambulance_count / emergency_access_lanes / barrier_linear_feet / catch_fence_height_ft is below its required_* counterpart"
        side_effects:
          - "CASCADE B link 2: sets state = RETURNED, clears certified_by_user_id, increments return_count by 1, sets return_reason = 'AUTO_REQUIREMENT_INCREASE'"
          - "drives TourStop.safety_state SAFETY_CERTIFIED -> SAFETY_DRAFT (cascade B link 3)"

  - entity: VehicleEntry
    state_field: logistics_state
    initial_state: ENTERED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ENTERED
        to: STAGED
        trigger: "POST /vehicle-entries/{id}/check-in"
        actor: CompetitorTeam
        preconditions:
          - "X-User-ID == entry.competitor_id"
          - "stop.safety_state == SAFETY_CERTIFIED"
          - "stop.readiness_posture != FROZEN"
          - "current logical clock IN [show_start_utc - STAGING_OPEN_HOURS_BEFORE_SHOW, show_start_utc - STAGING_CLOSE_HOURS_BEFORE_SHOW]"
        side_effects:
          - "sets logistics_state = STAGED and actual_arrival_utc = current logical clock"
          - "recomputes readiness_score under the POST_STAGING variant and sets readiness_variant = POST_STAGING"
          - "increments VehicleEntry.version by 1"
      - from: ENTERED
        to: WITHDRAWN
        trigger: "system, on POST /venue-bookings/{id}/withdraw of the CONFIRMED booking"
        actor: system
        preconditions: []
        side_effects:
          - "sets logistics_state = WITHDRAWN, clears staging_bay_index (bay returns to the selector pool)"
      - from: STAGED
        to: WITHDRAWN
        trigger: "system, on POST /venue-bookings/{id}/withdraw of the CONFIRMED booking"
        actor: system
        preconditions: []
        side_effects:
          - "sets logistics_state = WITHDRAWN, clears staging_bay_index (bay returns to the selector pool)"

  - entity: VehicleEntry
    state_field: tech_status
    initial_state: TECH_PENDING
    terminal_states: []
    transitions:
      - from: TECH_PENDING
        to: TECH_CLEARED
        trigger: "POST /vehicle-entries/{id}/tech-inspections with result == PASSED"
        actor: SafetyOfficial
        preconditions:
          - "entry.logistics_state == STAGED"
          - "entry.tech_attempt_count < MAX_TECH_ATTEMPTS"
        side_effects:
          - "appends a TechInspection with attempt_no = tech_attempt_count + 1"
          - "sets tech_status = TECH_CLEARED, increments tech_attempt_count"
          - "recomputes readiness_score under POST_STAGING"
      - from: TECH_PENDING
        to: TECH_CONDITIONAL
        trigger: "POST /vehicle-entries/{id}/tech-inspections with result == CONDITIONAL"
        actor: SafetyOfficial
        preconditions:
          - "entry.logistics_state == STAGED"
          - "entry.tech_attempt_count < MAX_TECH_ATTEMPTS"
        side_effects:
          - "appends a TechInspection; sets tech_status = TECH_CONDITIONAL; increments tech_attempt_count"
          - "recomputes readiness_score under POST_STAGING (CONDITIONAL_PENALTY applies)"
        note: "branch 2 of 3 — divergent side-effect set: the entry stays eligible for the run order but carries a 10-point penalty"
      - from: TECH_PENDING
        to: TECH_HELD
        trigger: "POST /vehicle-entries/{id}/tech-inspections with result == FAILED"
        actor: SafetyOfficial
        preconditions:
          - "entry.logistics_state == STAGED"
          - "entry.tech_attempt_count < MAX_TECH_ATTEMPTS"
        side_effects:
          - "appends a TechInspection; sets tech_status = TECH_HELD; increments tech_attempt_count and failed_attempt_count"
          - "recomputes readiness_score under POST_STAGING (FAILED_ATTEMPT_PENALTY applies)"
          - "recomputes TourStop.readiness_posture, which becomes RESTRICTED while any entry of the stop is TECH_HELD, and drives sales_state ON_SALE -> SALES_HALTED"
        note: "branch 3 of 3 — the only branch with a cross-entity posture side effect"
      - from: TECH_HELD
        to: TECH_CLEARED
        trigger: "POST /vehicle-entries/{id}/tech-inspections with result == PASSED"
        actor: SafetyOfficial
        preconditions:
          - "entry.logistics_state == STAGED"
          - "entry.tech_attempt_count < MAX_TECH_ATTEMPTS"
        side_effects:
          - "appends a re-inspection attempt; sets tech_status = TECH_CLEARED"
          - "recomputes readiness_score under POST_STAGING (the earlier FAILED attempt still counts)"
          - "recomputes TourStop.readiness_posture (may return to OPEN)"
        note: "cycle back out of the hold — TECH_PENDING -> TECH_HELD -> TECH_CLEARED"
      - from: TECH_HELD
        to: TECH_CONDITIONAL
        trigger: "POST /vehicle-entries/{id}/tech-inspections with result == CONDITIONAL"
        actor: SafetyOfficial
        preconditions:
          - "entry.logistics_state == STAGED"
          - "entry.tech_attempt_count < MAX_TECH_ATTEMPTS"
        side_effects:
          - "appends a re-inspection attempt; sets tech_status = TECH_CONDITIONAL"
          - "recomputes readiness_score under POST_STAGING; recomputes TourStop.readiness_posture"
      - from: TECH_HELD
        to: TECH_HELD
        trigger: "POST /vehicle-entries/{id}/tech-inspections with result == FAILED"
        actor: SafetyOfficial
        preconditions:
          - "entry.logistics_state == STAGED"
          - "entry.tech_attempt_count < MAX_TECH_ATTEMPTS"
        side_effects:
          - "appends a re-inspection attempt; increments failed_attempt_count; recomputes readiness_score under POST_STAGING"
        note: "self-loop; the third FAILED attempt exhausts MAX_TECH_ATTEMPTS and any further attempt is rejected"

  - entity: TicketOrder
    state_field: status
    initial_state: PENDING
    terminal_states: [REFUNDED, VOID]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /ticket-orders/{id}/pay"
        actor: TicketingManager
        preconditions:
          - "stop.sales_state IN {ON_SALE, SALES_HALTED}"
          - "stop.readiness_posture != FROZEN"
        side_effects:
          - "sets status = PAID, paid_at = clock"
          - "moves qty from TicketTier.reserved_seat_count to TicketTier.sold_seat_count and recomputes available_seat_count"
          - "adds (line_subtotal_cents - group_discount_cents) to TourStop.gross_ticket_revenue_cents, (addon_subtotal_cents - addon_discount_cents) to addon_revenue_cents, facility_fee_cents to facility_fee_collected_cents, qty to tickets_sold_count and pit_party_addon_qty to pit_party_sold_count"
          - "increments TicketTier.version and TourStop.version by 1"
      - from: PAID
        to: REFUNDED
        trigger: "POST /ticket-orders/{id}/refund"
        actor: TicketingManager
        preconditions:
          - "stop.sales_state != SETTLED"
        side_effects:
          - "sets status = REFUNDED, refunded_at = clock"
          - "decrements TicketTier.sold_seat_count by qty and recomputes available_seat_count (seat conservation invariant)"
          - "subtracts the same four money/count amounts it added on payment from the TourStop counters"
          - "increments TicketTier.version and TourStop.version by 1"
          - "no state change on an existing EventSettlement in state PREPARED; the FINAL recompute at approval picks the refund up"
      - from: PENDING
        to: VOID
        trigger: "system, on sales_state -> SALES_HALTED, sales_state -> SALES_CLOSED, or stop cancellation"
        actor: system
        preconditions: []
        side_effects:
          - "sets status = VOID, void_reason = the driving cause"
          - "decrements TicketTier.reserved_seat_count by qty and recomputes available_seat_count"

  - entity: SponsorshipActivation
    state_field: state
    initial_state: PROPOSED
    terminal_states: [FULFILLED]
    transitions:
      - from: PROPOSED
        to: ACTIVATED
        trigger: "POST /sponsorship-activations/{id}/activate"
        actor: SeriesPromoter
        preconditions:
          - "stop.readiness_posture != FROZEN"
          - "when hospitality_seat_count > 0: hospitality_tier_id is set, belongs to the same tour_stop_id, and TicketTier.available_seat_count >= hospitality_seat_count"
          - "when vehicle_branding_slots > 0: branded_vehicle_entry_id is set, belongs to the same tour_stop_id, and branding_slots_committed + vehicle_branding_slots <= MAX_BRANDING_SLOTS_PER_VEHICLE"
          - "no other SponsorshipActivation on the stop with state IN {ACTIVATED, FULFILLED} whose Sponsor.category equals this Sponsor.category when either sponsor has exclusive_category == true"
        side_effects:
          - "sets state = ACTIVATED"
          - "adds hospitality_seat_count to TicketTier.held_seat_count, recomputes available_seat_count and increments TicketTier.version by 1"
          - "adds vehicle_branding_slots to VehicleEntry.branding_slots_committed"
          - "adds fee_cents to TourStop.sponsorship_committed_cents and hospitality_seat_count to TourStop.held_hospitality_seat_count"
      - from: ACTIVATED
        to: FULFILLED
        trigger: "POST /sponsorship-activations/{id}/fulfill"
        actor: SponsorRep
        preconditions:
          - "X-User-ID == activation.sponsor_id"
          - "stop.sales_state IN {ON_SALE, SALES_HALTED, SALES_CLOSED}"
        side_effects:
          - "sets state = FULFILLED, obligations_fulfilled_at = clock"
          - "sets recognized_fee_cents = fee_cents (no holdback applies to a fulfilled activation in either settlement variant)"

  - entity: EventSettlement
    state_field: state
    initial_state: PREPARED
    terminal_states: [APPROVED]
    transitions:
      - from: PREPARED
        to: APPROVED
        trigger: "POST /settlements/{id}/approve"
        actor: FinanceController
        preconditions:
          - "X-User-ID != settlement.prepared_by_user_id (segregation of duties)"
          - "stop.sales_state == SALES_CLOSED"
        side_effects:
          - "CASCADE C link 1: recomputes every money field under the FINAL variant of calculations.settlement_net_to_promoter (and therefore calculations.venue_settlement_due and calculations.settlement_payout_waterfall), sets variant = FINAL, state = APPROVED, approved_by_user_id = X-User-ID"
          - "CASCADE C link 2: because the settlement became APPROVED, the stop moves sales_state SALES_CLOSED -> SETTLED"
          - "CASCADE C link 3: because the stop became SETTLED, Season.settled_stop_count increments, Season.season_net_cents accumulates net_to_promoter_cents, Season.version increments, and Season.status becomes CLOSED when no stop of the season is left outside {SETTLED, CANCELLED}"
      - from: PREPARED
        to: DISPUTED
        trigger: "POST /settlements/{id}/dispute"
        actor: VenueManager
        preconditions:
          - "X-User-ID == the Venue.id of the stop's VenueBooking"
        side_effects:
          - "sets state = DISPUTED, dispute_reason = dispute_reason, increments dispute_count by 1"
      - from: DISPUTED
        to: PREPARED
        trigger: "POST /tour-stops/{id}/settlement"
        actor: FinanceController
        preconditions:
          - "stop.sales_state == SALES_CLOSED"
          - "no TicketOrder of the stop has status == PENDING"
        side_effects:
          - "recomputes every money field under the PROVISIONAL variant, sets variant = PROVISIONAL, state = PREPARED, prepared_by_user_id = X-User-ID"
          - "leaves dispute_count and dispute_reason in place"
        note: "cyclic — PREPARED -> DISPUTED -> PREPARED repeats until the venue accepts and finance approves"

concurrency_rules:
  - rule_id: ticket-order-stale-tier
    parent_entity: TicketTier
    write_endpoint: "POST /ticket-orders"
    occ_field: "expected_ticket_tier_version"
    description: |
      Creating a TicketOrder against a TicketTier whose version has advanced since
      the client last read it is rejected. This captures the case where the tier's
      seat buckets have already moved — another order was written, or a sponsorship
      activation legitimately held hospitality seats out of the same tier — so the
      requesting client's view of available_seat_count is stale.
    error_id: ERR_STALE_TIER_VERSION
    http_status: 412

  - rule_id: marketing-allocation-stale-season
    parent_entity: Season
    write_endpoint: "POST /tour-stops/{id}/marketing-allocations"
    occ_field: "expected_season_version"
    description: |
      Committing local marketing spend against a Season whose version has advanced
      since the client last read it is rejected. The season's marketing_unallocated_cents
      is the pool every market draws from, so a writer holding a stale season version
      may be planning against money another market has already committed or released.
    error_id: ERR_STALE_SEASON_VERSION
    http_status: 412

calculations:
  - name: ticket_order_amounts
    trigger: "POST /ticket-orders (order creation); the amounts are frozen on the row and never recomputed afterwards"
    algorithm: tiered_pricing
    formula: |
      # Rounding order is PINNED: every percentage component is rounded to whole
      # cents on its own line, in the order below, and only then are the lines
      # summed. Summing the two un-rounded discounts first and rounding once
      # produces a different total and is WRONG.
      line_subtotal_cents  = tier.price_cents * qty
      group_qualifies      = (is_group == true) AND (qty >= tier.group_min_qty)
      group_discount_cents = group_qualifies
                             ? ROUND_HALF_UP(line_subtotal_cents * tier.group_discount_pct)
                             : 0
      addon_subtotal_cents = stop.pit_party_price_cents * pit_party_addon_qty
      bundle_qualifies     = (pit_party_addon_qty > 0) AND (pit_party_addon_qty == qty)
      addon_discount_cents = bundle_qualifies
                             ? ROUND_HALF_UP(addon_subtotal_cents * PIT_PARTY_BUNDLE_DISCOUNT_PCT)
                             : 0
      facility_fee_cents   = booking.per_ticket_facility_fee_cents * qty      # never discounted
      total_cents          = line_subtotal_cents - group_discount_cents
                             + addon_subtotal_cents - addon_discount_cents
                             + facility_fee_cents
    input_set: "the single order being created; tier.price_cents / group_min_qty / group_discount_pct as stored on TicketTier, pit_party_price_cents from the TourStop, per_ticket_facility_fee_cents from the stop's VenueBooking (terms in force at CONFIRMED)"
    constants:
      PIT_PARTY_BUNDLE_DISCOUNT_PCT: 0.15
    precision: "whole cents, ROUND_HALF_UP applied per discount line (never to the summed discounts)"
    variants: []

  - name: venue_settlement_due
    trigger: "POST /tour-stops/{id}/settlement (PROVISIONAL) and POST /settlements/{id}/approve (FINAL); writes rental_due_pre_credit_cents, coop_credit_pct, coop_credit_cents, venue_due_cents"
    algorithm: threshold
    formula: |
      # Evaluation order is PINNED because the co-op credit rate is keyed on the
      # very total the credit then reduces. The rate is selected from the
      # PRE-credit figure and is NOT re-selected after the credit is applied.
      # 1. inclusion set depends on the active settlement variant (see
      #    settlement_net_to_promoter.variants):
      #      PROVISIONAL -> orders with status == PAID as of preparation
      #      FINAL       -> orders with status == PAID as of approval
      adjusted_gross_cents   = SUM(order.line_subtotal_cents - order.group_discount_cents)
      facility_fee_total     = SUM(order.facility_fee_cents)
      # 2. venue money before credit
      share_component_cents  = ROUND_HALF_UP(adjusted_gross_cents * booking.revenue_share_pct)
      rental_due_pre_credit_cents = MAX(booking.rental_base_cents, share_component_cents)
                                    + facility_fee_total
      # 3. credit RATE keyed on the pre-credit figure (boundaries are inclusive)
      coop_credit_pct = rental_due_pre_credit_cents >= 5000000 ? 0.06
                        : rental_due_pre_credit_cents >= 2500000 ? 0.04
                        : 0.02
      # 4. credit AMOUNT, capped by the marketing money actually committed on the stop
      coop_credit_cents = MIN(ROUND_HALF_UP(rental_due_pre_credit_cents * coop_credit_pct),
                              stop.marketing_spend_committed_cents)
      venue_due_cents   = rental_due_pre_credit_cents - coop_credit_cents
    input_set: "TicketOrder rows of the stop whose status == PAID at the moment the active variant runs; REFUNDED, VOID and PENDING orders are excluded from adjusted_gross_cents and facility_fee_total"
    constants:
      COOP_TIER_HIGH_FLOOR_CENTS: 5000000
      COOP_TIER_HIGH_PCT: 0.06
      COOP_TIER_MID_FLOOR_CENTS: 2500000
      COOP_TIER_MID_PCT: 0.04
      COOP_TIER_LOW_PCT: 0.02
    precision: "whole cents, ROUND_HALF_UP on share_component_cents and coop_credit_cents independently"
    variants: []

  - name: settlement_net_to_promoter
    trigger: "POST /tour-stops/{id}/settlement runs the PROVISIONAL variant; POST /settlements/{id}/approve re-runs the FINAL variant and overwrites the same fields"
    algorithm: aggregation
    formula: |
      ticket_revenue_cents  = SUM over included orders of (line_subtotal_cents - group_discount_cents)
      addon_revenue_cents   = SUM over included orders of (addon_subtotal_cents - addon_discount_cents)
      facility_fee_cents    = SUM over included orders of facility_fee_cents
      sponsorship_revenue_cents = SUM over included activations of recognized_fee(activation)
      marketing_spend_cents = SUM of MarketingAllocation.amount_cents for the stop with state == COMMITTED
      safety_cost_cents     = the stop's SafetyPlan.safety_cost_cents (0 when the stop has no SafetyPlan)
      purse_cents           = PURSE_PER_ENTRY_CENTS * COUNT(VehicleEntry of the stop with logistics_state == STAGED)
      venue_due_cents       = calculations.venue_settlement_due over the same inclusion set
      collected_cash_cents  = ticket_revenue_cents + addon_revenue_cents + facility_fee_cents
                              + sponsorship_revenue_cents
      net_to_promoter_cents = collected_cash_cents - venue_due_cents - safety_cost_cents
                              - marketing_spend_cents - purse_cents          # may be negative
      profitability_margin_pct = collected_cash_cents > 0
                              ? ROUND_HALF_UP(net_to_promoter_cents / collected_cash_cents * 100, 2)
                              : 0.00
    input_set: "orders and activations of the stop, filtered per variant; marketing allocations filtered to state == COMMITTED; entries filtered to logistics_state == STAGED"
    constants:
      PURSE_PER_ENTRY_CENTS: 150000
      SPONSOR_HOLDBACK_PCT: 0.50
    precision: "whole cents; profitability_margin_pct to 2 decimals, ROUND_HALF_UP"
    variants:
      - name: PROVISIONAL
        when: "run by POST /tour-stops/{id}/settlement when the row is created or re-prepared out of DISPUTED"
        difference: "included orders = status == PAID as of preparation; recognized_fee(activation) = fee_cents for every activation with state IN {ACTIVATED, FULFILLED} — no holdback; sets variant = PROVISIONAL"
      - name: FINAL
        when: "run by POST /settlements/{id}/approve"
        difference: "included orders = status == PAID as of approval, so anything refunded after preparation drops out (and venue_settlement_due re-runs on the smaller gross, which can flip MAX(rental_base, share) and re-select the co-op tier); recognized_fee(activation) = fee_cents when state == FULFILLED but ROUND_HALF_UP(fee_cents * SPONSOR_HOLDBACK_PCT) when state == ACTIVATED; sets variant = FINAL"

  - name: settlement_payout_waterfall
    trigger: "runs immediately after settlement_net_to_promoter in both POST /tour-stops/{id}/settlement and POST /settlements/{id}/approve"
    algorithm: waterfall_allocation
    formula: |
      # Buckets are funded in this exact order out of collected_cash_cents.
      remaining = collected_cash_cents
      payout_venue_cents     = MIN(remaining, venue_due_cents);        remaining -= payout_venue_cents
      payout_safety_cents    = MIN(remaining, safety_cost_cents);      remaining -= payout_safety_cents
      payout_marketing_cents = MIN(remaining, marketing_spend_cents);  remaining -= payout_marketing_cents
      payout_purse_cents     = MIN(remaining, purse_cents);            remaining -= payout_purse_cents
      promoter_remainder_cents = remaining                             # >= 0 by construction
      shortfall_cents = (venue_due_cents - payout_venue_cents)
                        + (safety_cost_cents - payout_safety_cents)
                        + (marketing_spend_cents - payout_marketing_cents)
                        + (purse_cents - payout_purse_cents)
      # INVARIANT the settlement must satisfy in both variants:
      #   net_to_promoter_cents == promoter_remainder_cents - shortfall_cents
    input_set: "the money fields written by settlement_net_to_promoter on the same request"
    constants: {}
    precision: "whole cents, no rounding (integer subtraction only)"
    variants: []

  - name: logistics_readiness_score
    trigger: "POST /vehicle-entries writes the PRE_STAGING score; POST /vehicle-entries/{id}/check-in and POST /vehicle-entries/{id}/tech-inspections overwrite it with the POST_STAGING score"
    algorithm: weighted_scoring
    formula: |
      haul_risk = HAUL_RISK_PER_BLOCK * FLOOR(entry.haul_distance_miles / HAUL_RISK_BLOCK_MILES)
      staging_close_utc = stop.show_start_utc - STAGING_CLOSE_HOURS_BEFORE_SHOW hours
      # variant-specific penalties, see variants[]
      score = CLAMP(SCORE_BASE - haul_risk - schedule_penalty - inspection_penalty, 0, 100)
    input_set: "the single VehicleEntry, its TourStop.show_start_utc, and (POST_STAGING only) every TechInspection row of the entry"
    constants:
      SCORE_BASE: 100
      HAUL_RISK_PER_BLOCK: 5
      HAUL_RISK_BLOCK_MILES: 500
      PROJECTED_LATE_PENALTY: 15
      ARRIVAL_SLIP_PENALTY: 15
      FAILED_ATTEMPT_PENALTY: 25
      CONDITIONAL_PENALTY: 10
    precision: "integer score, CLAMP to [0, 100]"
    variants:
      - name: PRE_STAGING
        when: "at entry creation, before the transporter has arrived (logistics_state == ENTERED)"
        difference: "schedule_penalty = PROJECTED_LATE_PENALTY when scheduled_arrival_utc > staging_close_utc else 0; inspection_penalty = 0 because inspections are treated as a provisional pass; sets readiness_variant = PRE_STAGING"
      - name: POST_STAGING
        when: "from check-in onwards (logistics_state == STAGED), recomputed after every inspection attempt"
        difference: "schedule_penalty = ARRIVAL_SLIP_PENALTY when actual_arrival_utc > scheduled_arrival_utc else 0 (the projection is discarded); inspection_penalty = FAILED_ATTEMPT_PENALTY * failed_attempt_count + (CONDITIONAL_PENALTY when the most recent TechInspection.result == CONDITIONAL else 0); sets readiness_variant = POST_STAGING"

  - name: required_safety_provisioning
    trigger: "POST /tour-stops/{id}/safety-plan, PATCH /safety-plans/{id}, POST /safety-plans/{id}/submit, POST /safety-plans/{id}/certify, and POST /tour-stops/{id}/ticket-tiers (which changes expected_attendance); writes the six required_* fields and safety_cost_cents"
    algorithm: threshold
    formula: |
      attendance   = stop.expected_attendance          # MIN(venue.seat_capacity, SUM(tier.allotment))
      entry_count  = COUNT(VehicleEntry of the stop with logistics_state IN {ENTERED, STAGED})
      heavy_present = EXISTS(VehicleEntry of the stop with logistics_state IN {ENTERED, STAGED}
                             AND vehicle_weight_lbs >= HEAVY_VEHICLE_LBS)
      required_als_staff_count      = 1 + (attendance >= 6000 ? 1 : 0) + (entry_count >= 12 ? 1 : 0)
      required_bls_staff_count      = MAX(2, CEIL(attendance / 2500))
                                      + (venue.floor_type == 'CONCRETE' ? 1 : 0)
      required_ambulance_count      = MAX(1, CEIL(entry_count / 10))
      required_catch_fence_height_ft = heavy_present ? 8 : 6
      required_emergency_access_lanes = 1 + (attendance >= 6000 ? 1 : 0)
      required_barrier_linear_feet  = MAX(1200, 900 + 75 * entry_count)
      safety_cost_cents = plan.medical_als_staff_count * ALS_STAFF_COST_CENTS
                          + plan.medical_bls_staff_count * BLS_STAFF_COST_CENTS
                          + plan.ambulance_count * AMBULANCE_COST_CENTS
                          + plan.barrier_linear_feet * BARRIER_COST_PER_FOOT_CENTS
    input_set: "the stop's expected_attendance, its VehicleEntry rows with logistics_state IN {ENTERED, STAGED}, and the booked Venue.floor_type / catch_fence_max_height_ft"
    constants:
      ATTENDANCE_ALS_FLOOR: 6000
      ENTRY_ALS_FLOOR: 12
      BLS_SEATS_PER_STAFF: 2500
      ENTRIES_PER_AMBULANCE: 10
      HEAVY_VEHICLE_LBS: 9000
      HEAVY_FENCE_FT: 8
      LIGHT_FENCE_FT: 6
      BARRIER_FLOOR_FEET: 1200
      BARRIER_BASE_FEET: 900
      BARRIER_FEET_PER_ENTRY: 75
      ALS_STAFF_COST_CENTS: 45000
      BLS_STAFF_COST_CENTS: 28000
      AMBULANCE_COST_CENTS: 120000
      BARRIER_COST_PER_FOOT_CENTS: 350
    precision: "integers; thresholds are inclusive (attendance == 6000 already requires the second ALS medic and the second emergency lane)"
    variants: []

  - name: stop_readiness_posture
    trigger: "recomputed at the end of every mutation that touches a TourStop or any of its children (bookings accept/withdraw, safety plan transitions, tier creation, entry creation/check-in/inspection, order transitions, activation transitions, marketing allocation create/release)"
    algorithm: constraint_propagation
    formula: |
      IF stop.safety_state == SAFETY_SUSPENDED OR stop.sales_state == CANCELLED:
          readiness_posture = FROZEN
      ELSE IF stop.safety_state != SAFETY_CERTIFIED
           OR stop.competition_segment_count == 0
           OR EXISTS(VehicleEntry of the stop with logistics_state IN {ENTERED, STAGED}
                     AND tech_status == TECH_HELD)
           OR stop.marketing_spend_committed_cents == 0
           OR stop.show_start_utc IS NULL:
          readiness_posture = RESTRICTED
      ELSE:
          readiness_posture = OPEN
      # Gate semantics:
      #   FROZEN     -> every child mutation of the stop is rejected with ERR_STOP_FROZEN
      #   RESTRICTED -> children may still be built, but the stop cannot go/return ON_SALE
      #   OPEN       -> on-sale and resume-sales are admissible
    input_set: "the stop's own two state dimensions plus its ShowSegment, VehicleEntry and MarketingAllocation children"
    constants: {}
    precision: "enum, no rounding"
    variants: []

  - name: run_order_timeline
    trigger: "POST /tour-stops/{id}/show-segments; recomputes start_offset_minutes / end_offset_minutes / reset_gap_minutes for every segment of the stop and TourStop.run_order_end_offset_minutes"
    algorithm: interval_merge
    formula: |
      # Segments are laid out on half-open [start, end) minute intervals measured
      # from show_start_utc, walked in run_order_position ASC (positions are unique
      # per stop, so the ordering has no ties and needs no fallback key).
      offset = 0
      previous_type = null
      FOR segment IN segments ORDER BY run_order_position ASC:
          segment.reset_gap_minutes = (previous_type == 'COMPETITION'
                                       AND segment.segment_type == 'COMPETITION')
                                      ? FLOOR_RESET_MINUTES : 0
          offset += segment.reset_gap_minutes
          segment.start_offset_minutes = offset
          segment.end_offset_minutes   = offset + segment.duration_minutes
          offset = segment.end_offset_minutes            # adjacency with gap 0 is legal
          previous_type = segment.segment_type
      stop.run_order_end_offset_minutes = offset
      # Admission rules for the segment being inserted:
      #   run_order_position already occupied by another segment of the stop
      #        -> ERR_SEGMENT_TIMELINE_CONFLICT (the timeline slot is taken)
      #   resulting stop.run_order_end_offset_minutes > stop.show_window_minutes
      #        -> ERR_SHOW_WINDOW_EXCEEDED (aggregate capacity; equality is allowed)
    input_set: "all ShowSegment rows of the stop, including the one being inserted"
    constants:
      FLOOR_RESET_MINUTES: 8
    precision: "integer minutes"
    variants: []

  - name: venue_occupancy_conflict
    trigger: "POST /venue-bookings and POST /venue-bookings/{id}/accept"
    algorithm: interval_merge
    formula: |
      # Venue occupancy intervals are CLOSED at both ends and additionally
      # padded by the venue's turnaround buffer, so touching intervals collide.
      candidate = [new.load_in_start_utc, new.tear_down_end_utc]
      FOR other IN VenueBooking WHERE venue_id == new.venue_id
                                  AND state == CONFIRMED
                                  AND id != new.id:
          blocked = [other.load_in_start_utc - venue.turnaround_hours hours,
                     other.tear_down_end_utc + venue.turnaround_hours hours]
          IF candidate.start <= blocked.end AND blocked.start <= candidate.end:
              -> ERR_VENUE_DATE_CONFLICT
      # Note the asymmetry with run_order_timeline: here an exact touch
      # (candidate.start == blocked.end) IS a conflict; there an exact touch
      # (segment.start == previous.end) is legal.
    input_set: "VenueBooking rows on the same venue_id with state == CONFIRMED; TERMS_PROPOSED, COUNTERED and WITHDRAWN rows never block"
    constants:
      DEFAULT_VENUE_TURNAROUND_HOURS: 12
    precision: "whole seconds on datetime comparison"
    variants: []

  - name: market_rotation_cooldown
    trigger: "POST /venue-bookings and POST /venue-bookings/{id}/accept"
    algorithm: threshold
    formula: |
      FOR other IN VenueBooking WHERE state == CONFIRMED
                                  AND season_id == new.season_id
                                  AND Venue(other.venue_id).market_code == Venue(new.venue_id).market_code
                                  AND id != new.id:
          gap_days = ABS(DATE_DIFF(new.tour_date, other.tour_date, DAY))
          IF gap_days < season.market_rotation_cooldown_days:
              -> ERR_MARKET_ROTATION_COOLDOWN
      # gap_days == season.market_rotation_cooldown_days is ALLOWED (strict <).
    input_set: "CONFIRMED bookings of the same season whose venue shares the candidate's market_code"
    constants:
      DEFAULT_MARKET_ROTATION_COOLDOWN_DAYS: 21
    precision: "whole days between tour_date values"
    variants: []

  - name: haul_buffer_requirement
    trigger: "PATCH /tour-stops/{id}/logistics whenever preceding_stop_id or haul_distance_miles is supplied"
    algorithm: threshold
    formula: |
      required_haul_hours = CEIL(stop.haul_distance_miles / HAUL_AVG_MPH) + HAUL_REST_HOURS
      earliest_load_in    = preceding_stop.booking.tear_down_end_utc + required_haul_hours hours
      IF stop.booking.load_in_start_utc < earliest_load_in:
          -> ERR_HAUL_BUFFER_VIOLATION
      # Third distinct interval semantic: a one-sided, distance-derived buffer on
      # the transport chain (the preceding stop's tear-down is the anchor), unlike
      # the venue's symmetric turnaround pad and the run order's half-open packing.
    input_set: "the stop being patched, its VenueBooking, the preceding TourStop and that stop's VenueBooking"
    constants:
      HAUL_AVG_MPH: 50
      HAUL_REST_HOURS: 10
    precision: "whole hours after CEIL on the distance quotient"
    variants: []

  - name: staging_bay_selector
    trigger: "POST /vehicle-entries; writes staging_bay_index"
    algorithm: constraint_propagation
    formula: |
      # (a) eligibility filter
      candidates = { 1 .. venue.staging_bay_count }
                   MINUS { e.staging_bay_index : e IN VehicleEntry
                           WHERE e.tour_stop_id == new.tour_stop_id
                             AND e.logistics_state IN {ENTERED, STAGED} }
      # (b) ranking expression
      IF new.vehicle_weight_lbs >= HEAVY_VEHICLE_LBS:
          staging_bay_index = MAX(candidates)     # heavy rigs stage nearest the ramp
      ELSE:
          staging_bay_index = MIN(candidates)     # light rigs stage from the far wall
      # (c) tie-break: none possible, bay indices are unique integers
      # (d) empty candidate set -> ERR_NO_STAGING_BAY_AVAILABLE, no entry is created
    input_set: "bay indices 1..staging_bay_count of the stop's Venue minus the bays held by entries of the same stop with logistics_state IN {ENTERED, STAGED}; WITHDRAWN entries release their bay"
    constants:
      HEAVY_VEHICLE_LBS: 9000
    precision: "integer bay index"
    variants: []

  - name: season_market_profitability
    trigger: "GET /seasons/{id}/market-report"
    algorithm: aggregation
    formula: |
      rows = FOR EACH market_code among TourStop rows of the season with sales_state == SETTLED
             whose EventSettlement.state == APPROVED:
                 stop_count            = COUNT(those stops in this market_code)
                 collected_cash_cents  = SUM(settlement.collected_cash_cents)
                 net_to_promoter_cents = SUM(settlement.net_to_promoter_cents)
                 margin_pct            = collected_cash_cents > 0
                                         ? ROUND_HALF_UP(net_to_promoter_cents
                                                         / collected_cash_cents * 100, 2)
                                         : 0.00
      # ordering: net_to_promoter_cents DESC, then market_code ASC as the tie-break
      total_net_cents        = SUM(row.net_to_promoter_cents)
      settled_stop_count     = COUNT(TourStop of the season with sales_state == SETTLED)
      unsettled_stop_count   = COUNT(TourStop of the season with sales_state NOT IN {SETTLED, CANCELLED})
    input_set: "TourStop rows of the season with sales_state == SETTLED joined to their APPROVED EventSettlement; CANCELLED stops and stops whose settlement is PREPARED or DISPUTED contribute to unsettled_stop_count only"
    constants: {}
    precision: "whole cents; margin_pct to 2 decimals, ROUND_HALF_UP"
    variants: []

  - name: marketing_allocation_admission
    trigger: "POST /tour-stops/{id}/marketing-allocations; also re-evaluated in reverse by DELETE /marketing-allocations/{id}"
    algorithm: threshold
    formula: |
      stop_cap_cents    = ROUND_HALF_UP(season.total_marketing_budget_cents * STOP_MARKETING_CAP_PCT)
      channel_cap_cents = ROUND_HALF_UP(stop_cap_cents * CHANNEL_CAP_PCT[channel])
      stop_total_after    = stop.marketing_spend_committed_cents + amount_cents
      channel_total_after = SUM(MarketingAllocation.amount_cents for this stop and channel
                                with state == COMMITTED) + amount_cents
      IF channel_total_after > channel_cap_cents:  -> ERR_CHANNEL_CAP_EXCEEDED
      IF stop_total_after   > stop_cap_cents:      -> ERR_STOP_MARKETING_CAP_EXCEEDED
      IF amount_cents       > season.marketing_unallocated_cents: -> ERR_MARKETING_BUDGET_EXCEEDED
      # On success: season.marketing_allocated_cents += amount_cents,
      #             season.marketing_unallocated_cents = total - allocated,
      #             stop.marketing_spend_committed_cents += amount_cents.
      # DELETE (release) applies exactly the inverse deltas, so the invariant
      #   season.total_marketing_budget_cents
      #     == season.marketing_allocated_cents + season.marketing_unallocated_cents
      # holds before and after every allocate/release pair.
      # Caps are inclusive: channel_total_after == channel_cap_cents is admitted.
    input_set: "COMMITTED MarketingAllocation rows of the stop (for the channel and stop running totals) and the Season budget fields; RELEASED rows are excluded from both totals"
    constants:
      STOP_MARKETING_CAP_PCT: 0.20
      CHANNEL_CAP_PCT: { RADIO: 0.40, DIGITAL: 0.60, GRASSROOTS: 0.30 }
    precision: "whole cents, ROUND_HALF_UP on each cap"
    variants: []

validations:
  # ---- 1..6: envelope-level order, identical on every endpoint ----
  - order: 1
    category: unauthenticated
    rule: "X-User-ID header absent or empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: ["ALL endpoints"]
  - order: 2
    category: unauthorized
    rule: "the caller's role is not listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: ["ALL endpoints"]
  - order: 3
    category: invalid_request
    rule: "missing required body field, wrong scalar type, malformed datetime/date, enum value outside the declared set, qty/amount/count below its declared minimum, limit outside 1..100, offset < 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: ["ALL endpoints with a body or query parameters"]
  - order: 4
    category: not_found
    rule: "the {id} in the path does not resolve to a row of the addressed entity"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: ["ALL endpoints with a path parameter"]
  - order: 5
    category: not_found
    rule: "an FK supplied in the body does not resolve (season_id, venue_id, competitor_id, tour_stop_id, ticket_tier_id, sponsor_id, hospitality_tier_id, branded_vehicle_entry_id, featured_vehicle_entry_id, preceding_stop_id)"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: ["POST /venue-bookings", "POST /vehicle-entries", "POST /ticket-orders", "POST /sponsorship-activations", "POST /tour-stops/{id}/show-segments", "PATCH /tour-stops/{id}/logistics"]
  - order: 6
    category: unauthorized
    rule: "entity-backed caller acting on a resource that is not theirs: VenueManager whose identity venue_id != booking.venue_id, CompetitorTeam whose identity competitor_id != entry.competitor_id, SponsorRep whose identity sponsor_id != activation.sponsor_id"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: ["POST /venue-bookings/{id}/counter", "POST /vehicle-entries", "POST /vehicle-entries/{id}/check-in", "POST /sponsorship-activations", "POST /sponsorship-activations/{id}/fulfill"]

  # ---- 7..8: segregation of duties (before any state check) ----
  - order: 7
    category: unauthorized
    rule: "the certifying SafetyOfficial's X-User-ID equals SafetyPlan.authored_by_user_id"
    error_id: ERR_SAFETY_SELF_CERTIFICATION
    http_status: 403
    applies_to: ["POST /safety-plans/{id}/certify"]
  - order: 8
    category: unauthorized
    rule: "the approving FinanceController's X-User-ID equals EventSettlement.prepared_by_user_id"
    error_id: ERR_SETTLEMENT_SELF_APPROVAL
    http_status: 403
    applies_to: ["POST /settlements/{id}/approve"]

  # ---- 9..10: optimistic concurrency, checked before the target's own state ----
  - order: 9
    category: state
    rule: "expected_ticket_tier_version != TicketTier.version of the referenced tier"
    error_id: ERR_STALE_TIER_VERSION
    http_status: 412
    applies_to: ["POST /ticket-orders"]
  - order: 10
    category: state
    rule: "expected_season_version != Season.version of the stop's season"
    error_id: ERR_STALE_SEASON_VERSION
    http_status: 412
    applies_to: ["POST /tour-stops/{id}/marketing-allocations"]

  # ---- 11..14: lifecycle state gates ----
  - order: 11
    category: state
    rule: "the addressed row is not in a state from which the requested transition is declared (booking not TERMS_PROPOSED/COUNTERED for counter, revise or accept; booking already WITHDRAWN; plan not in {DRAFT, RETURNED} for patch or submit, not SUBMITTED for certify or return; entry not ENTERED for check-in, not STAGED for inspection; order not PENDING for pay, not PAID for refund; activation not PROPOSED for activate, not ACTIVATED for fulfill; settlement not PREPARED for approve or dispute; season CLOSED for any child write; stop sales_state == CANCELLED or SETTLED for any child write)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: ["ALL state-transition endpoints"]
  - order: 12
    category: state
    rule: "TourStop.sales_state is not ON_SALE when an order is created"
    error_id: ERR_SALES_NOT_OPEN
    http_status: 409
    applies_to: ["POST /ticket-orders"]
  - order: 13
    category: state
    rule: "the stop's readiness_posture == FROZEN (safety suspended or stop cancelled) and the request mutates the stop or any of its children other than safety-reinstate"
    error_id: ERR_STOP_FROZEN
    http_status: 409
    applies_to: ["PATCH /tour-stops/{id}/logistics", "POST /tour-stops/{id}/show-segments", "POST /tour-stops/{id}/ticket-tiers", "POST /tour-stops/{id}/on-sale", "POST /tour-stops/{id}/resume-sales", "POST /tour-stops/{id}/marketing-allocations", "POST /vehicle-entries", "POST /ticket-orders", "POST /sponsorship-activations", "POST /tour-stops/{id}/settlement"]
  - order: 14
    category: state
    rule: "negotiation_round would exceed MAX_NEGOTIATION_ROUNDS (3) on this counter"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: ["POST /venue-bookings/{id}/counter"]

  # ---- 15..21: business_safety (life-safety gates outrank everything downstream) ----
  - order: 15
    category: business_safety
    rule: "the stop's safety_state != SAFETY_CERTIFIED when sales are being opened or resumed"
    error_id: ERR_SAFETY_NOT_CERTIFIED
    http_status: 409
    applies_to: ["POST /tour-stops/{id}/on-sale", "POST /tour-stops/{id}/resume-sales"]
  - order: 16
    category: business_safety
    rule: "medical_als_staff_count < required_als_staff_count or medical_bls_staff_count < required_bls_staff_count"
    error_id: ERR_MEDICAL_STAFFING_SHORTFALL
    http_status: 422
    applies_to: ["POST /safety-plans/{id}/submit", "POST /safety-plans/{id}/certify"]
  - order: 17
    category: business_safety
    rule: "ambulance_count < required_ambulance_count"
    error_id: ERR_AMBULANCE_SHORTFALL
    http_status: 422
    applies_to: ["POST /safety-plans/{id}/submit", "POST /safety-plans/{id}/certify"]
  - order: 18
    category: business_safety
    rule: "catch_fence_height_ft < required_catch_fence_height_ft, or catch_fence_height_ft > the booked Venue.catch_fence_max_height_ft"
    error_id: ERR_CATCH_FENCE_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /safety-plans/{id}/submit", "POST /safety-plans/{id}/certify"]
  - order: 19
    category: business_safety
    rule: "emergency_access_lanes < required_emergency_access_lanes"
    error_id: ERR_EMERGENCY_ACCESS_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /safety-plans/{id}/submit", "POST /safety-plans/{id}/certify"]
  - order: 20
    category: business_safety
    rule: "barrier_linear_feet < required_barrier_linear_feet"
    error_id: ERR_BARRIER_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /safety-plans/{id}/submit", "POST /safety-plans/{id}/certify"]
  - order: 21
    category: business_safety
    rule: "the entry is TECH_HELD (its inspection attempts are exhausted) and it is being featured in a segment or branded by an activation"
    error_id: ERR_ENTRY_TECH_HELD
    http_status: 409
    applies_to: ["POST /tour-stops/{id}/show-segments", "POST /sponsorship-activations"]
  - order: 22
    category: business_safety
    rule: "a further inspection is requested after MAX_TECH_ATTEMPTS (3) attempts have already been recorded for the entry"
    error_id: ERR_TECH_ATTEMPTS_EXHAUSTED
    http_status: 409
    applies_to: ["POST /vehicle-entries/{id}/tech-inspections"]

  # ---- 23..27: business_referential (required companions must already exist) ----
  - order: 23
    category: business_referential
    rule: "the stop has competition_segment_count == 0 when sales are being opened"
    error_id: ERR_RUN_ORDER_INCOMPLETE
    http_status: 409
    applies_to: ["POST /tour-stops/{id}/on-sale"]
  - order: 24
    category: business_referential
    rule: "the stop has no TicketTier rows when sales are being opened"
    error_id: ERR_NO_TICKET_TIERS
    http_status: 409
    applies_to: ["POST /tour-stops/{id}/on-sale"]
  - order: 25
    category: business_referential
    rule: "the stop still has TicketOrder rows in status PENDING when a settlement is prepared"
    error_id: ERR_PENDING_ORDERS_OUTSTANDING
    http_status: 409
    applies_to: ["POST /tour-stops/{id}/settlement"]
  - order: 26
    category: business_referential
    rule: "ticket_tier_id belongs to a different TourStop than tour_stop_id, or hospitality_tier_id / featured_vehicle_entry_id / branded_vehicle_entry_id belongs to a different stop than the one addressed"
    error_id: ERR_CHILD_STOP_MISMATCH
    http_status: 422
    applies_to: ["POST /ticket-orders", "POST /sponsorship-activations", "POST /tour-stops/{id}/show-segments"]
  - order: 27
    category: business_referential
    rule: "the stop has no SafetyPlan row when a settlement is prepared"
    error_id: ERR_SAFETY_PLAN_MISSING
    http_status: 409
    applies_to: ["POST /tour-stops/{id}/settlement"]

  # ---- 28..34: business_temporal (calendar/interval feasibility) ----
  - order: 28
    category: business_temporal
    rule: "tour_date is before season_start_date or after season_end_date"
    error_id: ERR_DATE_OUTSIDE_SEASON
    http_status: 422
    applies_to: ["POST /venue-bookings"]
  - order: 29
    category: business_temporal
    rule: "tour_date is fewer than BOOKING_LEAD_TIME_DAYS (45) whole days after the current logical clock date"
    error_id: ERR_BOOKING_LEAD_TIME
    http_status: 422
    applies_to: ["POST /venue-bookings"]
  - order: 30
    category: business_temporal
    rule: "load_in_start_utc >= tear_down_end_utc, or the occupancy interval collides with a CONFIRMED booking of the same venue padded by turnaround_hours (calculations.venue_occupancy_conflict)"
    error_id: ERR_VENUE_DATE_CONFLICT
    http_status: 409
    applies_to: ["POST /venue-bookings", "POST /venue-bookings/{id}/accept"]
  - order: 31
    category: business_temporal
    rule: "the stop's load_in_start_utc is earlier than the preceding stop's tear_down_end_utc plus the distance-derived haul buffer (calculations.haul_buffer_requirement)"
    error_id: ERR_HAUL_BUFFER_VIOLATION
    http_status: 409
    applies_to: ["PATCH /tour-stops/{id}/logistics"]
  - order: 32
    category: business_temporal
    rule: "run_order_position is already taken by another ShowSegment of the stop"
    error_id: ERR_SEGMENT_TIMELINE_CONFLICT
    http_status: 409
    applies_to: ["POST /tour-stops/{id}/show-segments"]
  - order: 33
    category: business_temporal
    rule: "on_sale_start_utc >= on_sale_end_utc, or on_sale_end_utc is after the stop's show_start_utc"
    error_id: ERR_TIER_WINDOW_INVALID
    http_status: 422
    applies_to: ["POST /tour-stops/{id}/ticket-tiers"]
  - order: 34
    category: business_temporal
    rule: "the current logical clock is outside [tier.on_sale_start_utc, tier.on_sale_end_utc] (both bounds inclusive)"
    error_id: ERR_TIER_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /ticket-orders"]
  - order: 35
    category: business_temporal
    rule: "doors_open_utc >= show_start_utc, or show_start_utc - doors_open_utc is less than one hour, or show_start_utc falls outside the booking's [load_in_start_utc, tear_down_end_utc] occupancy interval"
    error_id: ERR_SHOW_TIMING_INVALID
    http_status: 422
    applies_to: ["PATCH /tour-stops/{id}/logistics"]
  - order: 36
    category: business_temporal
    rule: "the current logical clock is outside the staging window [show_start_utc - STAGING_OPEN_HOURS_BEFORE_SHOW, show_start_utc - STAGING_CLOSE_HOURS_BEFORE_SHOW] (both bounds inclusive), i.e. the transporter presents outside the bay's open hours; scheduled_arrival_utc is only a promise and never gates check-in"
    error_id: ERR_STAGING_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /vehicle-entries/{id}/check-in"]

  # ---- 37..46: business_constraint (structural/uniqueness/capacity of non-money resources) ----
  - order: 37
    category: business_constraint
    rule: "a CONFIRMED booking of the same season in the same market_code sits fewer than season.market_rotation_cooldown_days away (calculations.market_rotation_cooldown)"
    error_id: ERR_MARKET_ROTATION_COOLDOWN
    http_status: 409
    applies_to: ["POST /venue-bookings", "POST /venue-bookings/{id}/accept"]
  - order: 38
    category: business_constraint
    rule: "preceding_stop_id is the stop itself, belongs to a different season, has an event_date on or after this stop's event_date, or already has another stop pointing at it"
    error_id: ERR_ROTATION_CHAIN_INVALID
    http_status: 422
    applies_to: ["PATCH /tour-stops/{id}/logistics"]
  - order: 39
    category: business_constraint
    rule: "the recomputed run_order_end_offset_minutes would exceed the stop's show_window_minutes (equality is allowed)"
    error_id: ERR_SHOW_WINDOW_EXCEEDED
    http_status: 409
    applies_to: ["POST /tour-stops/{id}/show-segments"]
  - order: 40
    category: business_constraint
    rule: "is_group is true and qty < tier.group_min_qty, or is_group is true on a tier with no group_min_qty"
    error_id: ERR_GROUP_MINIMUM_NOT_MET
    http_status: 422
    applies_to: ["POST /ticket-orders"]
  - order: 41
    category: business_constraint
    rule: "pit_party_sold_count + pit_party_addon_qty would exceed the stop's pit_party_capacity, or pit_party_addon_qty > qty"
    error_id: ERR_PIT_PARTY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: ["POST /ticket-orders"]
  - order: 42
    category: business_constraint
    rule: "the branded vehicle entry's total committed branding slots plus vehicle_branding_slots would exceed MAX_BRANDING_SLOTS_PER_VEHICLE (4)"
    error_id: ERR_BRANDING_SLOTS_EXCEEDED
    http_status: 409
    applies_to: ["POST /sponsorship-activations"]
  - order: 43
    category: business_constraint
    rule: "another ACTIVATED or FULFILLED activation on the same stop belongs to a sponsor with the same category"
    error_id: ERR_SPONSOR_CATEGORY_EXCLUSIVITY
    http_status: 409
    applies_to: ["POST /sponsorship-activations/{id}/activate"]
  - order: 44
    category: business_constraint
    rule: "tier_code already exists on this stop"
    error_id: ERR_DUPLICATE_TIER_CODE
    http_status: 409
    applies_to: ["POST /tour-stops/{id}/ticket-tiers"]
  - order: 45
    category: business_constraint
    rule: "the stop already has a SafetyPlan row, or the stop already has an EventSettlement row that is not DISPUTED"
    error_id: ERR_DUPLICATE_CHILD
    http_status: 409
    applies_to: ["POST /tour-stops/{id}/safety-plan", "POST /tour-stops/{id}/settlement"]
  - order: 46
    category: business_constraint
    rule: "the same competitor already has a non-WITHDRAWN VehicleEntry with this vehicle_number on this stop"
    error_id: ERR_DUPLICATE_VEHICLE_ENTRY
    http_status: 409
    applies_to: ["POST /vehicle-entries"]
  - order: 47
    category: business_constraint
    rule: "no staging bay is free on the stop (calculations.staging_bay_selector produced an empty candidate set)"
    error_id: ERR_NO_STAGING_BAY_AVAILABLE
    http_status: 409
    applies_to: ["POST /vehicle-entries"]

  # ---- 48..53: business_fiscal (money and inventory ledgers, evaluated last) ----
  - order: 48
    category: business_fiscal
    rule: "tier.available_seat_count < qty (allotment already exhausted by reserved + sold + held)"
    error_id: ERR_TIER_SOLD_OUT
    http_status: 409
    applies_to: ["POST /ticket-orders"]
  - order: 49
    category: business_fiscal
    rule: "held_hospitality_seat_count + hospitality_seat_count would exceed the hospitality tier's allotment"
    error_id: ERR_HOSPITALITY_SEATS_EXCEEDED
    http_status: 409
    applies_to: ["POST /sponsorship-activations", "POST /sponsorship-activations/{id}/activate"]
  - order: 50
    category: business_fiscal
    rule: "the channel running total would exceed the channel cap (calculations.marketing_allocation_admission; equality is allowed)"
    error_id: ERR_CHANNEL_CAP_EXCEEDED
    http_status: 409
    applies_to: ["POST /tour-stops/{id}/marketing-allocations"]
  - order: 51
    category: business_fiscal
    rule: "the stop running total would exceed STOP_MARKETING_CAP_PCT of the season budget (equality is allowed)"
    error_id: ERR_STOP_MARKETING_CAP_EXCEEDED
    http_status: 409
    applies_to: ["POST /tour-stops/{id}/marketing-allocations"]
  - order: 52
    category: business_fiscal
    rule: "amount_cents exceeds season.marketing_unallocated_cents"
    error_id: ERR_MARKETING_BUDGET_EXCEEDED
    http_status: 409
    applies_to: ["POST /tour-stops/{id}/marketing-allocations"]
  - order: 53
    category: business_fiscal
    rule: "the stop's readiness_posture is not OPEN when sales are being opened or resumed (final composite gate, reached only after every specific safety and referential check above has passed)"
    error_id: ERR_STOP_NOT_READY
    http_status: 409
    applies_to: ["POST /tour-stops/{id}/on-sale", "POST /tour-stops/{id}/resume-sales"]

endpoints:
  # ---------------- Season ----------------
  - method: POST
    path: "/seasons"
    description: "Create a season with its calendar window, rotation cooldown and local marketing budget."
    roles: [SeriesPromoter]
    code: 201
    input: ["name", "year", "season_start_date", "season_end_date", "total_marketing_budget_cents", "market_rotation_cooldown_days?"]
    output: Season
    side_effects: ["status = PLANNING", "marketing_allocated_cents = 0", "marketing_unallocated_cents = total_marketing_budget_cents"]
  - method: GET
    path: "/seasons/{id}"
    description: "Read one season including its marketing ledger and settled-stop counters."
    roles: [SeriesPromoter, FinanceController, TicketingManager]
    code: 200
    input: []
    output: Season
    side_effects: []
  - method: GET
    path: "/seasons/{id}/market-report"
    description: "Profitability by market across APPROVED settlements of the season, ordered by net_to_promoter_cents DESC then market_code ASC (calculations.season_market_profitability)."
    roles: [SeriesPromoter, FinanceController]
    code: 200
    input: []
    output: "{ season_id: string, market_rows: object[], total_net_cents: integer, settled_stop_count: integer, unsettled_stop_count: integer }"
    side_effects: []

  # ---------------- Venue ----------------
  - method: POST
    path: "/venues"
    description: "Register a building with its seat capacity, floor type, rigging limit, staging bays and turnaround buffer."
    roles: [SeriesPromoter]
    code: 201
    input: ["name", "market_code", "city", "state_code", "seat_capacity", "floor_type", "catch_fence_max_height_ft", "medical_bay_count", "load_in_hours_required", "staging_bay_count", "turnaround_hours?"]
    output: Venue
    side_effects: []
  - method: GET
    path: "/venues/{id}"
    description: "Read one venue."
    roles: [SeriesPromoter, VenueManager, SafetyOfficial, FinanceController]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # ---------------- VenueBooking ----------------
  - method: POST
    path: "/venue-bookings"
    description: "Propose rental terms for a date at a venue. Runs the season-window, lead-time, occupancy-overlap and market-rotation checks."
    roles: [SeriesPromoter]
    code: 201
    input: ["season_id", "venue_id", "tour_date", "rental_base_cents", "revenue_share_pct", "per_ticket_facility_fee_cents", "load_in_start_utc", "tear_down_end_utc"]
    output: VenueBooking
    side_effects: ["state = TERMS_PROPOSED", "negotiation_round = 1", "terms_source = PROMOTER", "increments Season.booking_count"]
  - method: GET
    path: "/venue-bookings"
    description: "List bookings, filterable by season, venue and state."
    roles: [SeriesPromoter, VenueManager, FinanceController]
    code: 200
    input: ["season_id?", "venue_id?", "state?", "limit?", "offset?"]
    output: VenueBooking[]
    side_effects: []
  - method: GET
    path: "/venue-bookings/{id}"
    description: "Read one booking with the terms currently on the row."
    roles: [SeriesPromoter, VenueManager, FinanceController]
    code: 200
    input: []
    output: VenueBooking
    side_effects: []
  - method: POST
    path: "/venue-bookings/{id}/counter"
    description: "Venue counters the terms. Only the VenueManager who owns the booked venue may call it; capped at MAX_NEGOTIATION_ROUNDS."
    roles: [VenueManager]
    code: 200
    input: ["rental_base_cents", "revenue_share_pct", "per_ticket_facility_fee_cents", "note?"]
    output: VenueBooking
    side_effects: ["TERMS_PROPOSED -> COUNTERED", "negotiation_round += 1", "terms_source = VENUE", "last_counter_by_user_id = X-User-ID"]
  - method: POST
    path: "/venue-bookings/{id}/revise"
    description: "Promoter re-proposes terms after a counter, returning the row to TERMS_PROPOSED (the negotiation cycle)."
    roles: [SeriesPromoter]
    code: 200
    input: ["rental_base_cents", "revenue_share_pct", "per_ticket_facility_fee_cents", "load_in_start_utc?", "tear_down_end_utc?", "note?"]
    output: VenueBooking
    side_effects: ["COUNTERED -> TERMS_PROPOSED", "terms_source = PROMOTER"]
  - method: POST
    path: "/venue-bookings/{id}/accept"
    description: "Accept the terms on the row. Re-runs the occupancy-overlap and market-rotation checks against currently CONFIRMED bookings, then synthesizes the TourStop."
    roles: [SeriesPromoter]
    code: 200
    input: []
    output: VenueBooking
    side_effects: ["TERMS_PROPOSED|COUNTERED -> CONFIRMED", "confirmed_at = current logical clock", "creates the TourStop for this booking with sales_state = SALES_PENDING, safety_state = SAFETY_DRAFT, readiness_posture = RESTRICTED, market_code and event_date denormalized from the venue and the booking"]
  - method: POST
    path: "/venue-bookings/{id}/withdraw"
    description: "Withdraw the booking. On a CONFIRMED booking this fires CASCADE A across the stop, its orders, tier counters and marketing allocations."
    roles: [SeriesPromoter]
    code: 200
    input: ["reason"]
    output: VenueBooking
    side_effects: ["-> WITHDRAWN", "withdraw_reason = reason", "CASCADE A depth 1: TourStop.sales_state -> CANCELLED and safety_state -> SAFETY_SUSPENDED, readiness_posture -> FROZEN, cancel_reason = reason", "CASCADE A depth 2: PENDING TicketOrders -> VOID, PAID TicketOrders -> REFUNDED", "CASCADE A depth 3: TicketTier.reserved_seat_count / sold_seat_count reversed and available_seat_count recomputed, TourStop revenue counters reversed", "CASCADE A depth 4: COMMITTED MarketingAllocations -> RELEASED, Season.marketing_allocated_cents / marketing_unallocated_cents restored, increments Season.version by 1", "decrements Season.booking_count"]

  # ---------------- TourStop ----------------
  - method: GET
    path: "/tour-stops"
    description: "List tour stops, filterable by season, originating booking, transport predecessor and market."
    roles: [SeriesPromoter, VenueManager, TicketingManager, SafetyOfficial, FinanceController, CompetitorTeam]
    code: 200
    input: ["season_id?", "venue_booking_id?", "preceding_stop_id?", "market_code?", "sales_state?", "limit?", "offset?"]
    output: TourStop[]
    side_effects: []
  - method: GET
    path: "/tour-stops/{id}"
    description: "Read one stop with both state dimensions, the derived readiness posture and every roll-up counter."
    roles: [SeriesPromoter, VenueManager, TicketingManager, SafetyOfficial, FinanceController, CompetitorTeam, SponsorRep]
    code: 200
    input: []
    output: TourStop
    side_effects: []
  - method: PATCH
    path: "/tour-stops/{id}/logistics"
    description: "Set show timing, pit party terms and the transport chain link. Runs calculations.haul_buffer_requirement when preceding_stop_id or haul_distance_miles is supplied."
    roles: [SeriesPromoter]
    code: 200
    input: ["doors_open_utc?", "show_start_utc?", "show_window_minutes?", "pit_party_price_cents?", "pit_party_capacity?", "preceding_stop_id?", "haul_distance_miles?"]
    output: TourStop
    side_effects: ["recomputes calculations.run_order_timeline offsets when show_start_utc changes", "recomputes calculations.stop_readiness_posture"]
  - method: POST
    path: "/tour-stops/{id}/on-sale"
    description: "Open ticket sales. Gated by safety certification, a non-empty competition run order, at least one tier and an OPEN readiness posture."
    roles: [TicketingManager]
    code: 200
    input: []
    output: TourStop
    side_effects: ["sales_state SALES_PENDING -> ON_SALE"]
  - method: POST
    path: "/tour-stops/{id}/close-sales"
    description: "Close ticket sales ahead of settlement."
    roles: [TicketingManager]
    code: 200
    input: []
    output: TourStop
    side_effects: ["sales_state ON_SALE|SALES_HALTED -> SALES_CLOSED"]
  - method: POST
    path: "/tour-stops/{id}/resume-sales"
    description: "Return a halted stop to sale. Re-runs the same safety and readiness gates as on-sale."
    roles: [TicketingManager]
    code: 200
    input: []
    output: TourStop
    side_effects: ["sales_state SALES_HALTED -> ON_SALE (the sales cycle)"]
  - method: POST
    path: "/tour-stops/{id}/safety-suspend"
    description: "Suspend the stop on safety grounds. Freezes the stop and halts sales."
    roles: [SafetyOfficial]
    code: 200
    input: ["reason"]
    output: TourStop
    side_effects: ["safety_state -> SAFETY_SUSPENDED", "readiness_posture -> FROZEN", "sales_state ON_SALE -> SALES_HALTED"]
  - method: POST
    path: "/tour-stops/{id}/safety-reinstate"
    description: "Lift a safety suspension. Admissible only while the stop's SafetyPlan is still CERTIFIED, in which case the safety dimension returns to SAFETY_CERTIFIED."
    roles: [SafetyOfficial]
    code: 200
    input: ["note?"]
    output: TourStop
    side_effects: ["safety_state SAFETY_SUSPENDED -> SAFETY_CERTIFIED (precondition: the stop's SafetyPlan.state == CERTIFIED)", "recomputes calculations.stop_readiness_posture (FROZEN -> OPEN when every other readiness condition still holds, otherwise RESTRICTED)", "sales_state is NOT restored: a stop halted by the suspension stays SALES_HALTED until POST /tour-stops/{id}/resume-sales"]

  # ---------------- Competitor / VehicleEntry / TechInspection ----------------
  - method: POST
    path: "/competitors"
    description: "Register a competing team."
    roles: [SeriesPromoter]
    code: 201
    input: ["team_name", "driver_name", "home_market_code", "vehicle_class"]
    output: Competitor
    side_effects: []
  - method: GET
    path: "/competitors/{id}"
    description: "Read one competitor."
    roles: [SeriesPromoter, CompetitorTeam, SafetyOfficial]
    code: 200
    input: []
    output: Competitor
    side_effects: []
  - method: POST
    path: "/vehicle-entries"
    description: "Enter a vehicle in a stop. Assigns a staging bay via calculations.staging_bay_selector and scores PRE_STAGING readiness."
    roles: [SeriesPromoter, CompetitorTeam]
    code: 201
    input: ["competitor_id", "tour_stop_id", "vehicle_number", "vehicle_weight_lbs", "haul_distance_miles", "scheduled_arrival_utc"]
    output: VehicleEntry
    side_effects: ["logistics_state = ENTERED", "tech_status = TECH_PENDING", "staging_bay_index assigned", "readiness_score / readiness_variant = PRE_STAGING", "increments Competitor.entry_count", "recomputes the stop's SafetyPlan required_* fields and calculations.stop_readiness_posture"]
  - method: GET
    path: "/vehicle-entries"
    description: "List entries, filterable by stop and competitor."
    roles: [SeriesPromoter, CompetitorTeam, SafetyOfficial, SponsorRep]
    code: 200
    input: ["tour_stop_id?", "competitor_id?", "logistics_state?", "limit?", "offset?"]
    output: VehicleEntry[]
    side_effects: []
  - method: GET
    path: "/vehicle-entries/{id}"
    description: "Read one entry with its staging bay, tech status and readiness score."
    roles: [SeriesPromoter, CompetitorTeam, SafetyOfficial, SponsorRep]
    code: 200
    input: []
    output: VehicleEntry
    side_effects: []
  - method: POST
    path: "/vehicle-entries/{id}/check-in"
    description: "Record the transporter's arrival at the staging bay. Stamps actual_arrival_utc from the logical clock and re-scores readiness under the POST_STAGING variant."
    roles: [SeriesPromoter, CompetitorTeam]
    code: 200
    input: ["arrival_note?"]
    output: VehicleEntry
    side_effects: ["logistics_state ENTERED -> STAGED", "actual_arrival_utc = current logical clock", "readiness_variant = POST_STAGING and readiness_score recomputed"]
  - method: POST
    path: "/vehicle-entries/{id}/tech-inspections"
    description: "File one technical inspection attempt. Branches the entry's tech_status and may exhaust the attempt budget."
    roles: [SafetyOfficial]
    code: 201
    input: ["result", "defect_severity", "notes?"]
    output: TechInspection
    side_effects: ["attempt_no = entry.tech_attempt_count + 1", "inspected_by_user_id = X-User-ID", "increments VehicleEntry.tech_attempt_count (and failed_attempt_count on FAILED)", "tech_status branches: PASSED -> TECH_CLEARED, CONDITIONAL -> TECH_CONDITIONAL, FAILED -> TECH_PENDING while attempts remain else TECH_HELD", "recomputes readiness_score under POST_STAGING", "recomputes calculations.stop_readiness_posture"]
  - method: GET
    path: "/vehicle-entries/{id}/tech-inspections"
    description: "Full inspection history of an entry, ordered by attempt_no ASC."
    roles: [SeriesPromoter, SafetyOfficial, CompetitorTeam]
    code: 200
    input: ["limit?", "offset?"]
    output: TechInspection[]
    side_effects: []
  - method: GET
    path: "/tech-inspections/{id}"
    description: "Read one filed inspection attempt by its own id."
    roles: [SeriesPromoter, SafetyOfficial, CompetitorTeam]
    code: 200
    input: []
    output: TechInspection
    side_effects: []
  - method: GET
    path: "/vehicle-entries/{id}/featured-segments"
    description: "Run-order segments that headline this entry."
    roles: [SeriesPromoter, CompetitorTeam, SponsorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: ShowSegment[]
    side_effects: []

  # ---------------- ShowSegment ----------------
  - method: POST
    path: "/tour-stops/{id}/show-segments"
    description: "Insert a competition or intermission segment into the run order. Recomputes the whole timeline and enforces the show window."
    roles: [SeriesPromoter]
    code: 201
    input: ["segment_type", "title", "run_order_position", "duration_minutes", "featured_vehicle_entry_id?"]
    output: ShowSegment
    side_effects: ["recomputes calculations.run_order_timeline for every segment of the stop", "sets TourStop.run_order_end_offset_minutes and competition_segment_count", "recomputes calculations.stop_readiness_posture"]
  - method: GET
    path: "/tour-stops/{id}/show-segments"
    description: "Run order of the stop, ordered by run_order_position ASC."
    roles: [SeriesPromoter, TicketingManager, SafetyOfficial, SponsorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: ShowSegment[]
    side_effects: []
  - method: GET
    path: "/show-segments/{id}"
    description: "Read one segment with its computed timeline offsets."
    roles: [SeriesPromoter, TicketingManager, SafetyOfficial, SponsorRep]
    code: 200
    input: []
    output: ShowSegment
    side_effects: []

  # ---------------- TicketTier / TicketOrder ----------------
  - method: POST
    path: "/tour-stops/{id}/ticket-tiers"
    description: "Add a pricing tier. Raising the stop's expected_attendance fires CASCADE B against a CERTIFIED safety plan."
    roles: [TicketingManager]
    code: 201
    input: ["tier_code", "price_cents", "allotment", "on_sale_start_utc", "on_sale_end_utc", "group_min_qty?", "group_discount_pct?"]
    output: TicketTier
    side_effects: ["recomputes TourStop.expected_attendance = MIN(venue.seat_capacity, SUM(allotment))", "recomputes the stop's SafetyPlan required_* fields", "CASCADE B depth 1: when the new requirements outrun a CERTIFIED plan, SafetyPlan CERTIFIED -> RETURNED with return_count += 1", "CASCADE B depth 2: TourStop.safety_state SAFETY_CERTIFIED -> SAFETY_DRAFT and readiness_posture -> RESTRICTED", "CASCADE B depth 3: sales_state ON_SALE -> SALES_HALTED and every PENDING TicketOrder of the stop -> VOID with reserved_seat_count released"]
  - method: GET
    path: "/tour-stops/{id}/ticket-tiers"
    description: "Tiers of the stop, ordered by created_at ASC."
    roles: [SeriesPromoter, TicketingManager, FinanceController, SponsorRep]
    code: 200
    input: ["limit?", "offset?"]
    output: TicketTier[]
    side_effects: []
  - method: GET
    path: "/ticket-tiers/{id}"
    description: "Read one tier with its conserved seat pool (allotment = available + reserved + sold + held)."
    roles: [SeriesPromoter, TicketingManager, FinanceController, SponsorRep]
    code: 200
    input: []
    output: TicketTier
    side_effects: []
  - method: POST
    path: "/ticket-orders"
    description: "Place an order against a tier. Optimistically concurrency-checked on the tier via expected_ticket_tier_version; prices via calculations.ticket_order_amounts."
    roles: [TicketingManager]
    code: 201
    input: ["tour_stop_id", "ticket_tier_id", "purchaser_name", "purchaser_email", "qty", "expected_ticket_tier_version", "is_group?", "pit_party_addon_qty?"]
    output: TicketOrder
    side_effects: ["status = PENDING", "writes line_subtotal_cents, group_discount_cents, addon_subtotal_cents, addon_discount_cents, facility_fee_cents, total_cents", "increments TicketTier.reserved_seat_count and decrements available_seat_count", "increments TicketTier.version by 1"]
  - method: GET
    path: "/ticket-orders"
    description: "List orders, filterable by stop, tier and status."
    roles: [SeriesPromoter, TicketingManager, FinanceController]
    code: 200
    input: ["tour_stop_id?", "ticket_tier_id?", "status?", "limit?", "offset?"]
    output: TicketOrder[]
    side_effects: []
  - method: GET
    path: "/ticket-orders/{id}"
    description: "Read one order with its frozen money breakdown."
    roles: [SeriesPromoter, TicketingManager, FinanceController]
    code: 200
    input: []
    output: TicketOrder
    side_effects: []
  - method: POST
    path: "/ticket-orders/{id}/pay"
    description: "Settle a pending order."
    roles: [TicketingManager]
    code: 200
    input: []
    output: TicketOrder
    side_effects: ["status PENDING -> PAID", "paid_at = current logical clock", "moves qty from TicketTier.reserved_seat_count to sold_seat_count (available_seat_count unchanged)", "increments TicketTier.version by 1", "increments TourStop.tickets_sold_count, gross_ticket_revenue_cents, addon_revenue_cents, facility_fee_collected_cents, pit_party_sold_count"]
  - method: POST
    path: "/ticket-orders/{id}/refund"
    description: "Refund a paid order, returning its seats to the tier pool."
    roles: [TicketingManager]
    code: 200
    input: ["reason"]
    output: TicketOrder
    side_effects: ["status PAID -> REFUNDED", "refunded_at = current logical clock", "decrements TicketTier.sold_seat_count and restores available_seat_count", "increments TicketTier.version by 1", "reverses the stop's revenue and pit-party counters"]

  # ---------------- Sponsor / SponsorshipActivation ----------------
  - method: POST
    path: "/sponsors"
    description: "Register a sponsor and its category exclusivity claim."
    roles: [SeriesPromoter]
    code: 201
    input: ["company_name", "category", "contact_email", "exclusive_category?"]
    output: Sponsor
    side_effects: []
  - method: GET
    path: "/sponsors/{id}"
    description: "Read one sponsor."
    roles: [SeriesPromoter, SponsorRep, FinanceController]
    code: 200
    input: []
    output: Sponsor
    side_effects: []
  - method: POST
    path: "/sponsorship-activations"
    description: "Propose an activation package: vehicle branding slots, signage units and hospitality seats held out of a tier."
    roles: [SeriesPromoter, SponsorRep]
    code: 201
    input: ["sponsor_id", "tour_stop_id", "fee_cents", "vehicle_branding_slots", "signage_units", "hospitality_seat_count?", "hospitality_tier_id?", "branded_vehicle_entry_id?"]
    output: SponsorshipActivation
    side_effects: ["state = PROPOSED", "recognized_fee_cents = 0 until activation"]
  - method: GET
    path: "/sponsorship-activations"
    description: "List activations, filterable by sponsor, stop, hospitality tier and branded entry."
    roles: [SeriesPromoter, SponsorRep, FinanceController, TicketingManager]
    code: 200
    input: ["sponsor_id?", "tour_stop_id?", "hospitality_tier_id?", "branded_vehicle_entry_id?", "state?", "limit?", "offset?"]
    output: SponsorshipActivation[]
    side_effects: []
  - method: GET
    path: "/sponsorship-activations/{id}"
    description: "Read one activation."
    roles: [SeriesPromoter, SponsorRep, FinanceController]
    code: 200
    input: []
    output: SponsorshipActivation
    side_effects: []
  - method: POST
    path: "/sponsorship-activations/{id}/activate"
    description: "Activate the package. Enforces category exclusivity, branding-slot capacity and hospitality seat holds."
    roles: [SeriesPromoter]
    code: 200
    input: []
    output: SponsorshipActivation
    side_effects: ["state PROPOSED -> ACTIVATED", "increments TicketTier.held_seat_count and decrements available_seat_count on hospitality_tier_id", "increments VehicleEntry.branding_slots_committed on branded_vehicle_entry_id", "increments TourStop.sponsorship_committed_cents and held_hospitality_seat_count"]
  - method: POST
    path: "/sponsorship-activations/{id}/fulfill"
    description: "Sign off that the signage, branding and hospitality obligations were delivered — the condition for recognizing the fee at 100% under the FINAL settlement variant."
    roles: [SeriesPromoter, SponsorRep]
    code: 200
    input: ["note?"]
    output: SponsorshipActivation
    side_effects: ["state ACTIVATED -> FULFILLED", "obligations_fulfilled_at = current logical clock", "recognized_fee_cents = fee_cents"]

  # ---------------- SafetyPlan ----------------
  - method: POST
    path: "/tour-stops/{id}/safety-plan"
    description: "Create the stop's single safety plan. Computes the required_* provisioning floors from attendance, entries and floor type."
    roles: [SafetyOfficial]
    code: 201
    input: ["barrier_linear_feet", "catch_fence_height_ft", "medical_als_staff_count", "medical_bls_staff_count", "ambulance_count", "emergency_access_lanes"]
    output: SafetyPlan
    side_effects: ["state = DRAFT", "authored_by_user_id = X-User-ID", "writes the six required_* fields and safety_cost_cents via calculations.required_safety_provisioning"]
  - method: GET
    path: "/tour-stops/{id}/safety-plan"
    description: "The stop's safety plan as an array of length 0 or 1."
    roles: [SeriesPromoter, SafetyOfficial, FinanceController, VenueManager]
    code: 200
    input: []
    output: SafetyPlan[]
    side_effects: []
  - method: GET
    path: "/safety-plans/{id}"
    description: "Read one plan with provisioned and required figures side by side."
    roles: [SeriesPromoter, SafetyOfficial, FinanceController, VenueManager]
    code: 200
    input: []
    output: SafetyPlan
    side_effects: []
  - method: PATCH
    path: "/safety-plans/{id}"
    description: "Revise a DRAFT plan's provisioning. Re-stamps authorship and recomputes cost and requirements."
    roles: [SafetyOfficial]
    code: 200
    input: ["barrier_linear_feet?", "catch_fence_height_ft?", "medical_als_staff_count?", "medical_bls_staff_count?", "ambulance_count?", "emergency_access_lanes?"]
    output: SafetyPlan
    side_effects: ["authored_by_user_id = X-User-ID", "recomputes required_* and safety_cost_cents"]
  - method: POST
    path: "/safety-plans/{id}/submit"
    description: "Submit the plan for certification. Every provisioning floor must already be met."
    roles: [SafetyOfficial]
    code: 200
    input: []
    output: SafetyPlan
    side_effects: ["state DRAFT -> SUBMITTED", "TourStop.safety_state SAFETY_DRAFT -> SAFETY_REVIEW"]
  - method: POST
    path: "/safety-plans/{id}/certify"
    description: "Certify a submitted plan. The certifier must not be the author (segregation of duties)."
    roles: [SafetyOfficial]
    code: 200
    input: ["note?"]
    output: SafetyPlan
    side_effects: ["state SUBMITTED -> CERTIFIED", "certified_by_user_id = X-User-ID", "TourStop.safety_state SAFETY_REVIEW -> SAFETY_CERTIFIED", "recomputes calculations.stop_readiness_posture"]
  - method: POST
    path: "/safety-plans/{id}/return"
    description: "Return a submitted plan for rework, closing the plan cycle back to DRAFT territory."
    roles: [SafetyOfficial]
    code: 200
    input: ["reason"]
    output: SafetyPlan
    side_effects: ["state SUBMITTED -> RETURNED then RETURNED -> DRAFT on the next PATCH (the plan cycle)", "return_count += 1", "return_reason = reason", "TourStop.safety_state SAFETY_REVIEW -> SAFETY_DRAFT"]

  # ---------------- MarketingAllocation ----------------
  - method: POST
    path: "/tour-stops/{id}/marketing-allocations"
    description: "Commit local marketing spend on one channel. Optimistically concurrency-checked on the season via expected_season_version; enforces the channel cap, the per-stop cap and the season budget."
    roles: [SeriesPromoter]
    code: 201
    input: ["channel", "amount_cents", "expected_season_version"]
    output: MarketingAllocation
    side_effects: ["state = COMMITTED", "increments Season.marketing_allocated_cents and decrements marketing_unallocated_cents", "increments Season.version by 1", "increments TourStop.marketing_spend_committed_cents", "recomputes calculations.stop_readiness_posture"]
  - method: GET
    path: "/tour-stops/{id}/marketing-allocations"
    description: "Allocations of the stop, ordered by created_at ASC."
    roles: [SeriesPromoter, FinanceController]
    code: 200
    input: ["channel?", "state?", "limit?", "offset?"]
    output: MarketingAllocation[]
    side_effects: []
  - method: GET
    path: "/marketing-allocations/{id}"
    description: "Read one allocation."
    roles: [SeriesPromoter, FinanceController]
    code: 200
    input: []
    output: MarketingAllocation
    side_effects: []
  - method: DELETE
    path: "/marketing-allocations/{id}"
    description: "Release a committed allocation, returning the money to the season pool. Returns the released row so the conserved-quantity ledger is observable."
    roles: [SeriesPromoter]
    code: 200
    input: []
    output: MarketingAllocation
    side_effects: ["state COMMITTED -> RELEASED", "released_at = current logical clock", "decrements Season.marketing_allocated_cents and restores marketing_unallocated_cents", "increments Season.version by 1", "decrements TourStop.marketing_spend_committed_cents", "recomputes calculations.stop_readiness_posture"]

  # ---------------- EventSettlement ----------------
  - method: POST
    path: "/tour-stops/{id}/settlement"
    description: "Prepare the stop's settlement under the PROVISIONAL variant. Preparation deliberately does NOT require sales to be closed: it requires only that a SafetyPlan row exists (validations order 27) and that no TicketOrder is still PENDING (validations order 25), so a promoter may cut a provisional settlement mid-window. The SALES_CLOSED requirement lives on PREPARED -> APPROVED instead."
    roles: [FinanceController]
    code: 201
    input: []
    output: EventSettlement
    side_effects: ["state = PREPARED", "variant = PROVISIONAL", "prepared_by_user_id = X-User-ID", "writes every money field via calculations.settlement_net_to_promoter, calculations.venue_settlement_due and calculations.settlement_payout_waterfall"]
  - method: GET
    path: "/tour-stops/{id}/settlement"
    description: "The stop's settlement as an array of length 0 or 1."
    roles: [SeriesPromoter, FinanceController, VenueManager]
    code: 200
    input: []
    output: EventSettlement[]
    side_effects: []
  - method: GET
    path: "/settlements/{id}"
    description: "Read one settlement with its variant, waterfall buckets and margin."
    roles: [SeriesPromoter, FinanceController, VenueManager]
    code: 200
    input: []
    output: EventSettlement
    side_effects: []
  - method: POST
    path: "/settlements/{id}/approve"
    description: "Approve the settlement. Re-runs every money field under the FINAL variant; the approver must not be the preparer (segregation of duties)."
    roles: [FinanceController]
    code: 200
    input: ["note?"]
    output: EventSettlement
    side_effects: ["state PREPARED -> APPROVED", "variant = FINAL", "approved_by_user_id = X-User-ID", "overwrites every money field under the FINAL variant", "CASCADE C depth 1: TourStop.sales_state SALES_CLOSED -> SETTLED", "CASCADE C depth 2: Season.settled_stop_count += 1 and season_net_cents += net_to_promoter_cents", "CASCADE C depth 3: Season.status -> CLOSED once no stop of the season remains unsettled"]
  - method: POST
    path: "/settlements/{id}/dispute"
    description: "Dispute a prepared settlement, sending it back for re-preparation (the settlement cycle)."
    roles: [FinanceController, VenueManager]
    code: 200
    input: ["dispute_reason"]
    output: EventSettlement
    side_effects: ["state PREPARED -> DISPUTED", "dispute_count += 1", "dispute_reason recorded"]

  # ---------------- test-driving ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the fixed startup default); it never falls back to wall-clock time."
    roles: [SeriesPromoter, VenueManager, CompetitorTeam, SafetyOfficial, TicketingManager, SponsorRep, FinanceController]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: datetime }"
    side_effects: ["every subsequent lead-time, on-sale-window, staging-window and timestamp-stamping evaluation reads this value"]

errors:
  # ---- auth / envelope ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header missing or empty on any endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the X-User-Role is not listed in the endpoint's roles"
  - id: ERR_OWNERSHIP_MISMATCH
    http: 403
    condition: "an entity-backed caller (VenueManager, CompetitorTeam, SponsorRep) acts on a booking, entry or activation that does not belong to their own Venue, Competitor or Sponsor"
  - id: ERR_SAFETY_SELF_CERTIFICATION
    http: 403
    condition: "the SafetyOfficial certifying a plan is the same user recorded in SafetyPlan.authored_by_user_id"
  - id: ERR_SETTLEMENT_SELF_APPROVAL
    http: 403
    condition: "the FinanceController approving a settlement is the same user recorded in EventSettlement.prepared_by_user_id"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong type, malformed date/datetime, enum outside its declared set, numeric value below its declared minimum, or pagination limit/offset out of range"

  # ---- not found ----
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "season_id in path or body does not resolve"
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "venue_id in path or body does not resolve"
  - id: ERR_VENUE_BOOKING_NOT_FOUND
    http: 404
    condition: "booking id in path or venue_booking_id filter does not resolve"
  - id: ERR_TOUR_STOP_NOT_FOUND
    http: 404
    condition: "tour stop id in path or tour_stop_id / preceding_stop_id in body does not resolve"
  - id: ERR_COMPETITOR_NOT_FOUND
    http: 404
    condition: "competitor id in path or competitor_id in body does not resolve"
  - id: ERR_VEHICLE_ENTRY_NOT_FOUND
    http: 404
    condition: "entry id in path or featured_vehicle_entry_id / branded_vehicle_entry_id in body does not resolve"
  - id: ERR_TECH_INSPECTION_NOT_FOUND
    http: 404
    condition: "inspection id does not resolve"
  - id: ERR_SHOW_SEGMENT_NOT_FOUND
    http: 404
    condition: "segment id in path does not resolve"
  - id: ERR_TICKET_TIER_NOT_FOUND
    http: 404
    condition: "tier id in path or ticket_tier_id / hospitality_tier_id in body does not resolve"
  - id: ERR_TICKET_ORDER_NOT_FOUND
    http: 404
    condition: "order id in path does not resolve"
  - id: ERR_SPONSOR_NOT_FOUND
    http: 404
    condition: "sponsor id in path or sponsor_id in body does not resolve"
  - id: ERR_SPONSORSHIP_ACTIVATION_NOT_FOUND
    http: 404
    condition: "activation id in path does not resolve"
  - id: ERR_SAFETY_PLAN_NOT_FOUND
    http: 404
    condition: "safety plan id in path does not resolve"
  - id: ERR_MARKETING_ALLOCATION_NOT_FOUND
    http: 404
    condition: "allocation id in path does not resolve"
  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "settlement id in path does not resolve"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_TIER_VERSION
    http: 412
    condition: "expected_ticket_tier_version on POST /ticket-orders does not equal the tier's current version — the caller read the tier before a cascade or another order bumped it"
  - id: ERR_STALE_SEASON_VERSION
    http: 412
    condition: "expected_season_version on POST /tour-stops/{id}/marketing-allocations does not equal the season's current version — the caller read the season before another allocation or a release changed the budget ledger"

  # ---- lifecycle state ----
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the addressed row is not in a state from which the requested transition is declared in §1.2"
  - id: ERR_SALES_NOT_OPEN
    http: 409
    condition: "an order is placed on a stop whose sales_state is not ON_SALE"
  - id: ERR_STOP_FROZEN
    http: 409
    condition: "a mutation targets a stop (or a child of a stop) whose readiness_posture is FROZEN"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 409
    condition: "a counter would push negotiation_round past MAX_NEGOTIATION_ROUNDS"

  # ---- business_safety ----
  - id: ERR_SAFETY_NOT_CERTIFIED
    http: 409
    condition: "sales are opened or resumed while the stop's safety_state is not SAFETY_CERTIFIED"
  - id: ERR_MEDICAL_STAFFING_SHORTFALL
    http: 422
    condition: "provisioned ALS or BLS medics fall below required_als_staff_count / required_bls_staff_count"
  - id: ERR_AMBULANCE_SHORTFALL
    http: 422
    condition: "provisioned ambulances fall below required_ambulance_count"
  - id: ERR_CATCH_FENCE_INSUFFICIENT
    http: 422
    condition: "catch fence height is below required_catch_fence_height_ft or above the venue's rigging limit"
  - id: ERR_EMERGENCY_ACCESS_INSUFFICIENT
    http: 422
    condition: "emergency access lanes fall below required_emergency_access_lanes"
  - id: ERR_BARRIER_INSUFFICIENT
    http: 422
    condition: "barrier linear feet fall below required_barrier_linear_feet"
  - id: ERR_ENTRY_TECH_HELD
    http: 409
    condition: "a TECH_HELD entry is featured in a run-order segment or carries sponsor branding"
  - id: ERR_TECH_ATTEMPTS_EXHAUSTED
    http: 409
    condition: "a further inspection attempt is filed after MAX_TECH_ATTEMPTS attempts already exist for the entry"

  # ---- business_referential ----
  - id: ERR_RUN_ORDER_INCOMPLETE
    http: 409
    condition: "sales are opened on a stop with competition_segment_count == 0"
  - id: ERR_NO_TICKET_TIERS
    http: 409
    condition: "sales are opened on a stop that has no TicketTier rows"
  - id: ERR_PENDING_ORDERS_OUTSTANDING
    http: 409
    condition: "a settlement is prepared while the stop still has PENDING orders"
  - id: ERR_CHILD_STOP_MISMATCH
    http: 422
    condition: "a referenced tier, hospitality tier or vehicle entry belongs to a different tour stop than the one addressed"
  - id: ERR_SAFETY_PLAN_MISSING
    http: 409
    condition: "a settlement is prepared for a stop that has no SafetyPlan row"

  # ---- business_temporal ----
  - id: ERR_DATE_OUTSIDE_SEASON
    http: 422
    condition: "tour_date falls outside [season_start_date, season_end_date]"
  - id: ERR_BOOKING_LEAD_TIME
    http: 422
    condition: "tour_date is fewer than BOOKING_LEAD_TIME_DAYS whole days after the current logical clock date"
  - id: ERR_VENUE_DATE_CONFLICT
    http: 409
    condition: "the occupancy interval is inverted, or it overlaps a CONFIRMED booking of the same venue once padded by the venue's turnaround_hours (touching counts as overlap)"
  - id: ERR_HAUL_BUFFER_VIOLATION
    http: 409
    condition: "load-in starts before the preceding stop's tear-down plus the distance-derived haul buffer"
  - id: ERR_SEGMENT_TIMELINE_CONFLICT
    http: 409
    condition: "run_order_position is already occupied by another segment of the stop"
  - id: ERR_TIER_WINDOW_INVALID
    http: 422
    condition: "on_sale_start_utc is not before on_sale_end_utc, or the window ends after the show starts"
  - id: ERR_TIER_WINDOW_CLOSED
    http: 409
    condition: "the logical clock sits outside the tier's inclusive on-sale window when an order is placed"
  - id: ERR_SHOW_TIMING_INVALID
    http: 422
    condition: "doors and show times are inverted, less than an hour apart, or the show start falls outside the booking's occupancy interval"
  - id: ERR_STAGING_WINDOW_CLOSED
    http: 409
    condition: "check-in is attempted while the logical clock sits outside [show_start - STAGING_OPEN_HOURS_BEFORE_SHOW, show_start - STAGING_CLOSE_HOURS_BEFORE_SHOW]"

  # ---- business_constraint ----
  - id: ERR_MARKET_ROTATION_COOLDOWN
    http: 409
    condition: "another CONFIRMED booking of the same season in the same market_code sits fewer than market_rotation_cooldown_days away"
  - id: ERR_ROTATION_CHAIN_INVALID
    http: 422
    condition: "preceding_stop_id is self-referential, cross-season, not earlier than this stop, or already claimed by another stop"
  - id: ERR_SHOW_WINDOW_EXCEEDED
    http: 409
    condition: "the recomputed run order, including floor-reset gaps, would end past the stop's show_window_minutes"
  - id: ERR_GROUP_MINIMUM_NOT_MET
    http: 422
    condition: "the group rate is claimed on an order below the tier's group_min_qty"
  - id: ERR_PIT_PARTY_CAPACITY_EXCEEDED
    http: 409
    condition: "pit party heads exceed the stop's remaining pit_party_capacity, or exceed the order's seat quantity"
  - id: ERR_BRANDING_SLOTS_EXCEEDED
    http: 409
    condition: "committed branding slots on the branded entry would pass MAX_BRANDING_SLOTS_PER_VEHICLE"
  - id: ERR_SPONSOR_CATEGORY_EXCLUSIVITY
    http: 409
    condition: "an exclusive sponsor category is already ACTIVATED or FULFILLED on the same stop"
  - id: ERR_DUPLICATE_TIER_CODE
    http: 409
    condition: "tier_code already exists on the stop"
  - id: ERR_DUPLICATE_CHILD
    http: 409
    condition: "the stop already has a SafetyPlan, or already has an EventSettlement that is not DISPUTED"
  - id: ERR_DUPLICATE_VEHICLE_ENTRY
    http: 409
    condition: "the competitor already has a non-WITHDRAWN entry with the same vehicle_number on the stop"
  - id: ERR_NO_STAGING_BAY_AVAILABLE
    http: 409
    condition: "every staging bay of the stop's venue is already held by an ENTERED or STAGED entry"

  # ---- business_fiscal ----
  - id: ERR_TIER_SOLD_OUT
    http: 409
    condition: "the tier's available_seat_count is smaller than the requested qty"
  - id: ERR_HOSPITALITY_SEATS_EXCEEDED
    http: 409
    condition: "hospitality holds would push the tier past its allotment"
  - id: ERR_CHANNEL_CAP_EXCEEDED
    http: 409
    condition: "the channel's running total would pass CHANNEL_CAP_PCT of the stop's marketing cap"
  - id: ERR_STOP_MARKETING_CAP_EXCEEDED
    http: 409
    condition: "the stop's running total would pass STOP_MARKETING_CAP_PCT of the season budget"
  - id: ERR_MARKETING_BUDGET_EXCEEDED
    http: 409
    condition: "the requested amount exceeds the season's marketing_unallocated_cents"
  - id: ERR_STOP_NOT_READY
    http: 409
    condition: "the stop's readiness_posture is not OPEN when sales are opened or resumed, after every specific safety and referential gate has already passed"

roles:
  - name: SeriesPromoter
    description: "Tour operator. Owns the season, the booking negotiation from the promoter side, the run order, sponsorship activation and the local marketing budget."
    identity: "opaque"
    exclusive_operations:
      - "POST /seasons"
      - "POST /venues"
      - "POST /competitors"
      - "POST /sponsors"
      - "POST /venue-bookings"
      - "POST /venue-bookings/{id}/revise"
      - "POST /venue-bookings/{id}/accept"
      - "POST /venue-bookings/{id}/withdraw"
      - "PATCH /tour-stops/{id}/logistics"
      - "POST /tour-stops/{id}/show-segments"
      - "POST /sponsorship-activations/{id}/activate"
      - "POST /tour-stops/{id}/marketing-allocations"
      - "DELETE /marketing-allocations/{id}"
    shared_operations:
      - "POST /vehicle-entries (shared with CompetitorTeam)"
      - "POST /vehicle-entries/{id}/check-in (shared with CompetitorTeam)"
      - "POST /sponsorship-activations (shared with SponsorRep)"
      - "POST /sponsorship-activations/{id}/fulfill (shared with SponsorRep)"
      - "all GET reads"
      - "POST /_clock/set_current_utc"
  - name: VenueManager
    description: "Building representative. Counters rental terms on bookings for their own venue and may dispute a settlement."
    identity: "entity_backed:Venue"
    exclusive_operations:
      - "POST /venue-bookings/{id}/counter"
    shared_operations:
      - "POST /settlements/{id}/dispute (shared with FinanceController)"
      - "GET /venue-bookings, GET /venue-bookings/{id}, GET /tour-stops, GET /tour-stops/{id}, GET /tour-stops/{id}/safety-plan, GET /safety-plans/{id}, GET /tour-stops/{id}/settlement, GET /settlements/{id}, GET /venues/{id}"
      - "POST /_clock/set_current_utc"
  - name: CompetitorTeam
    description: "Racing team. Enters its own vehicles and checks them into staging; may never touch another team's entries."
    identity: "entity_backed:Competitor"
    exclusive_operations: []
    shared_operations:
      - "POST /vehicle-entries (shared with SeriesPromoter, restricted to own competitor_id)"
      - "POST /vehicle-entries/{id}/check-in (shared with SeriesPromoter, restricted to own entries)"
      - "GET /competitors/{id}, GET /vehicle-entries, GET /vehicle-entries/{id}, GET /vehicle-entries/{id}/tech-inspections, GET /vehicle-entries/{id}/featured-segments, GET /tour-stops, GET /tour-stops/{id}"
      - "POST /_clock/set_current_utc"
  - name: SafetyOfficial
    description: "Technical and safety authority. Files inspections, authors and certifies safety plans (never both on the same plan), and can suspend a stop."
    identity: "opaque"
    exclusive_operations:
      - "POST /vehicle-entries/{id}/tech-inspections"
      - "POST /tour-stops/{id}/safety-plan"
      - "PATCH /safety-plans/{id}"
      - "POST /safety-plans/{id}/submit"
      - "POST /safety-plans/{id}/certify"
      - "POST /safety-plans/{id}/return"
      - "POST /tour-stops/{id}/safety-suspend"
      - "POST /tour-stops/{id}/safety-reinstate"
    shared_operations:
      - "GET /venues/{id}, GET /competitors/{id}, GET /vehicle-entries, GET /vehicle-entries/{id}, GET /vehicle-entries/{id}/tech-inspections, GET /tour-stops, GET /tour-stops/{id}, GET /tour-stops/{id}/show-segments, GET /show-segments/{id}, GET /tour-stops/{id}/safety-plan, GET /safety-plans/{id}"
      - "POST /_clock/set_current_utc"
  - name: TicketingManager
    description: "Box office. Builds pricing tiers, runs the sales window and processes orders, payments and refunds."
    identity: "opaque"
    exclusive_operations:
      - "POST /tour-stops/{id}/ticket-tiers"
      - "POST /tour-stops/{id}/on-sale"
      - "POST /tour-stops/{id}/close-sales"
      - "POST /tour-stops/{id}/resume-sales"
      - "POST /ticket-orders"
      - "POST /ticket-orders/{id}/pay"
      - "POST /ticket-orders/{id}/refund"
    shared_operations:
      - "GET /seasons/{id}, GET /tour-stops, GET /tour-stops/{id}, GET /tour-stops/{id}/ticket-tiers, GET /ticket-tiers/{id}, GET /ticket-orders, GET /ticket-orders/{id}, GET /tour-stops/{id}/show-segments, GET /show-segments/{id}, GET /sponsorship-activations"
      - "POST /_clock/set_current_utc"
  - name: SponsorRep
    description: "Sponsor representative. Proposes and signs off its own activation packages; may never act on another sponsor's activation."
    identity: "entity_backed:Sponsor"
    exclusive_operations: []
    shared_operations:
      - "POST /sponsorship-activations (shared with SeriesPromoter, restricted to own sponsor_id)"
      - "POST /sponsorship-activations/{id}/fulfill (shared with SeriesPromoter, restricted to own activations)"
      - "GET /sponsors/{id}, GET /sponsorship-activations, GET /sponsorship-activations/{id}, GET /tour-stops/{id}, GET /tour-stops/{id}/ticket-tiers, GET /ticket-tiers/{id}, GET /tour-stops/{id}/show-segments, GET /show-segments/{id}, GET /vehicle-entries, GET /vehicle-entries/{id}, GET /vehicle-entries/{id}/featured-segments"
      - "POST /_clock/set_current_utc"
  - name: FinanceController
    description: "Settlement desk. Prepares and approves event settlements under segregation of duties and reads the by-market profitability report."
    identity: "opaque"
    exclusive_operations:
      - "POST /tour-stops/{id}/settlement"
      - "POST /settlements/{id}/approve"
    shared_operations:
      - "POST /settlements/{id}/dispute (shared with VenueManager)"
      - "GET /seasons/{id}, GET /seasons/{id}/market-report (shared with SeriesPromoter), GET /venue-bookings, GET /venue-bookings/{id}, GET /venues/{id}, GET /tour-stops, GET /tour-stops/{id}, GET /tour-stops/{id}/ticket-tiers, GET /ticket-tiers/{id}, GET /ticket-orders, GET /ticket-orders/{id}, GET /sponsors/{id}, GET /sponsorship-activations, GET /sponsorship-activations/{id}, GET /tour-stops/{id}/marketing-allocations, GET /marketing-allocations/{id}, GET /tour-stops/{id}/safety-plan, GET /safety-plans/{id}, GET /tour-stops/{id}/settlement, GET /settlements/{id}"
      - "POST /_clock/set_current_utc"

sod_rules:
  - rule_id: safety-plan-author-vs-certifier
    description: "The SafetyOfficial recorded in SafetyPlan.authored_by_user_id (creator or most recent PATCHer) may not be the X-User-ID that certifies the plan."
    enforced_on: "POST /safety-plans/{id}/certify"
    error_id: ERR_SAFETY_SELF_CERTIFICATION
  - rule_id: settlement-preparer-vs-approver
    description: "The FinanceController recorded in EventSettlement.prepared_by_user_id may not be the X-User-ID that approves the settlement."
    enforced_on: "POST /settlements/{id}/approve"
    error_id: ERR_SETTLEMENT_SELF_APPROVAL
