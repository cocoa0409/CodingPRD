scenario: "Skilled Nursing Facility (SNF/MDS): admission/PASRR, MDS assessment schedule, PDPM case-mix, 3-day qualifying stay, therapy minutes, bed-hold leave, care plan, discharge, five-star quality"
domain_name: snf-mds
api_prefix: /snf

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: hybrid
  # Facility/Resident are roots; Admission is the central episode entity with
  # cross-aggregate FKs (Resident, Facility, PasrrScreening, QualifyingStay);
  # MdsAssessment / TherapyLog / CarePlan / BedHold / Claim hang off Admission;
  # QualityMeasure hangs off Facility; PdpmRate is flat configuration.

  state_machine_shape: cyclic
  # Resident (ADMITTED <-> ON_LEAVE loop) and CarePlan (ACTIVE <-> UNDER_REVIEW
  # loop) and MdsAssessment (COMPLETED -> IN_PROGRESS correction loop) are cyclic;
  # Claim and BedHold are branching fork.

  relationship_patterns:
    - one_to_many        # Admission has many MdsAssessment / TherapyLog / BedHold
    - cross_aggregate    # Admission references Resident, Facility, Pasrr, QualifyingStay across roots
    - self_referential   # MdsAssessment.corrects_assessment_id -> MdsAssessment.id (modification chain)

  role_model: peer_roles
  # AdmissionsCoordinator, MdsCoordinator, Therapist, Physician, BillingAnalyst,
  # Administrator each own distinct resource types; Administrator has facility-config
  # exclusive ops. Not a hierarchical superset.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: facility legal name
      - name: cms_certification_number
        type: string
        source: input
        description: unique CMS certification number (CCN)
        constraints: unique across all Facility
      - name: certified_bed_count
        type: integer
        source: input
        description: number of certified beds
        constraints: ">= 1"
      - name: occupied_bed_count
        type: integer
        source: computed
        description: count of Residents whose status IN {ADMITTED, ON_LEAVE} whose active Admission.facility_id == this.id
      - name: health_inspection_rating
        type: integer
        source: input
        description: health-inspection star component 1..5 (regulatory survey input)
        default: 3
        constraints: "1..5"
      - name: staffing_rating
        type: integer
        source: input
        description: staffing star component 1..5
        default: 3
        constraints: "1..5"
      - name: quality_measure_rating
        type: integer
        source: computed
        description: QM star component 1..5 derived by five_star_quality_score from QualityMeasure events
      - name: overall_star_rating
        type: integer
        source: computed
        description: overall five-star rating derived by five_star_quality_score (combines health/staffing/QM components)

  - name: PdpmRate
    parent: null
    common_fields: true
    fields:
      - name: component
        type: enum
        source: input
        description: PDPM component this rate row prices
        constraints: "one of {PT, OT, SLP, NURSING, NTA}"
      - name: case_mix_group
        type: string
        source: input
        description: case-mix group code within the component (e.g., TA, TB, ...)
      - name: case_mix_index
        type: number
        source: input
        description: case-mix index multiplier for this group
        constraints: "> 0; up to 4 decimals"
      - name: base_rate_cents
        type: integer
        source: input
        description: unadjusted federal per-diem base rate for the component, in cents
        constraints: ">= 0"
      - name: effective_from
        type: datetime
        source: input
        description: ISO 8601 date the rate becomes effective
      - name: active
        type: boolean
        source: input
        description: whether this rate row participates in pricing
        default: true

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: resident full legal name
      - name: medical_record_number
        type: string
        source: input
        description: facility medical record number
        constraints: unique across all Resident
      - name: date_of_birth
        type: datetime
        source: input
        description: ISO 8601 date of birth
      - name: primary_facility_id
        type: string
        source: input
        description: "FK -> Facility.id; facility the resident is registered against"
      - name: status
        type: enum
        source: system
        description: resident lifecycle state
        default: PROSPECTIVE
        constraints: "one of {PROSPECTIVE, ADMITTED, ON_LEAVE, DISCHARGED}"

  - name: PasrrScreening
    parent: null
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: level
        type: enum
        source: input
        description: PASRR screening level
        constraints: "one of {LEVEL_I, LEVEL_II}"
      - name: has_serious_mental_illness_indicator
        type: boolean
        source: input
        description: Level I positive indicator for SMI/ID/DD requiring Level II
        default: false
      - name: status
        type: enum
        source: system
        description: screening lifecycle state
        default: PENDING
        constraints: "one of {PENDING, CLEARED, DENIED, ESCALATED}"
      - name: outcome_note
        type: string
        source: input
        description: clearance or denial rationale
        default: null

  - name: QualifyingStay
    parent: null
    common_fields: false
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: hospital_admit_at
        type: datetime
        source: input
        description: ISO 8601 acute-hospital admission datetime (UTC)
      - name: hospital_discharge_at
        type: datetime
        source: input
        description: ISO 8601 acute-hospital discharge datetime (UTC)
        constraints: "must be strictly after hospital_admit_at"
      - name: midnights_count
        type: integer
        source: computed
        description: count of calendar midnights crossed between admit and discharge (qualifying_stay_midnights)
      - name: qualifies
        type: boolean
        source: computed
        description: true iff midnights_count >= QUALIFYING_MIDNIGHTS (3); gates Medicare coverage

  - name: Admission
    parent: null
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id"
      - name: pasrr_screening_id
        type: string
        source: input
        description: "FK -> PasrrScreening.id; the screening that gates this admission"
      - name: qualifying_stay_id
        type: string
        source: input
        description: "FK -> QualifyingStay.id; the prior hospital stay; null for non-Medicare payers"
        default: null
      - name: payer_source
        type: enum
        source: input
        description: primary payer for this episode
        constraints: "one of {MEDICARE_A, MEDICAID, PRIVATE, MANAGED_CARE}"
      - name: admit_at
        type: datetime
        source: input
        description: ISO 8601 SNF admission datetime (UTC); day 1 of the PDPM stay
      - name: medicare_covered
        type: boolean
        source: computed
        description: true iff payer_source==MEDICARE_A AND linked QualifyingStay.qualifies==true
      - name: covered_day_count
        type: integer
        source: computed
        description: count of covered utilization days accrued for this stay (advances on per-diem accrual; excludes paid bed-hold-credited days per rules)
      - name: status
        type: enum
        source: system
        description: admission lifecycle state
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, NON_COVERED, DISCHARGE_PLANNED, DISCHARGED}"
      - name: discharge_at
        type: datetime
        source: system
        description: ISO 8601 discharge datetime, set on DISCHARGED transition
        default: null

  - name: MdsAssessment
    parent: Admission
    common_fields: true
    fields:
      - name: admission_id
        type: string
        source: input
        description: "FK -> Admission.id"
      - name: assessment_type
        type: enum
        source: input
        description: PDPM MDS schedule slot
        constraints: "one of {ADMISSION_5DAY, INTERIM_IPA, DISCHARGE}"
      - name: target_day
        type: integer
        source: computed
        description: stay-day the assessment is anchored to (5 for ADMISSION_5DAY); used for ARD window validation
      - name: assessment_reference_date
        type: datetime
        source: input
        description: ISO 8601 ARD date (UTC); the look-back anchor; must fall inside the type's allowed window
      - name: corrects_assessment_id
        type: string
        source: system
        description: "FK -> MdsAssessment.id; set by POST /snf/assessments/{id}/correct when this row supersedes an earlier SUBMITTED assessment (modification chain); null for originals"
        default: null
      - name: pt_function_score
        type: integer
        source: input
        description: section GG functional score driving PT/OT case-mix group
        constraints: "0..24"
      - name: slp_components_count
        type: integer
        source: input
        description: count of SLP comorbidity/condition components present
        constraints: "0..3"
      - name: nta_comorbidity_points
        type: integer
        source: input
        description: NTA comorbidity score (points sum) driving the NTA case-mix group
        constraints: "0..20"
      - name: pt_ot_case_mix_group
        type: string
        source: computed
        description: PT/OT case-mix group resolved by pdpm_component_classification
      - name: slp_case_mix_group
        type: string
        source: computed
        description: SLP case-mix group resolved by pdpm_component_classification
      - name: nta_case_mix_group
        type: string
        source: computed
        description: NTA case-mix group resolved by pdpm_component_classification
      - name: status
        type: enum
        source: system
        description: assessment lifecycle state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, COMPLETED, SUBMITTED, SUPERSEDED}"

  - name: TherapyLog
    parent: Admission
    common_fields: true
    fields:
      - name: admission_id
        type: string
        source: input
        description: "FK -> Admission.id"
      - name: discipline
        type: enum
        source: input
        description: therapy discipline
        constraints: "one of {PT, OT, SLP}"
      - name: mode
        type: enum
        source: input
        description: delivery mode (affects minute-weighting toward individual-equivalent)
        constraints: "one of {INDIVIDUAL, CONCURRENT, GROUP}"
      - name: minutes
        type: integer
        source: input
        description: raw minutes delivered in this session
        constraints: ">= 1"
      - name: session_date
        type: datetime
        source: input
        description: ISO 8601 date of session (UTC); must fall within the admission stay window
      - name: individual_equivalent_minutes
        type: integer
        source: computed
        description: minutes weighted by mode (therapy_minutes_aggregate per-row weighting); used for group/concurrent 25% cap check

  - name: CarePlan
    parent: Admission
    common_fields: true
    fields:
      - name: admission_id
        type: string
        source: input
        description: "FK -> Admission.id"
      - name: review_interval_days
        type: integer
        source: input
        description: required days between care-plan reviews
        default: 90
        constraints: ">= 1"
      - name: last_reviewed_at
        type: datetime
        source: system
        description: ISO 8601 datetime of last completed review; set on review transitions
        default: null
      - name: open_goal_count
        type: integer
        source: computed
        description: count of CarePlanGoal under this plan whose status IN {OPEN, IN_PROGRESS}
      - name: status
        type: enum
        source: system
        description: care-plan lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, UNDER_REVIEW, CLOSED}"

  - name: CarePlanGoal
    parent: CarePlan
    common_fields: true
    fields:
      - name: care_plan_id
        type: string
        source: input
        description: "FK -> CarePlan.id"
      - name: description
        type: string
        source: input
        description: goal text
      - name: target_date
        type: datetime
        source: input
        description: ISO 8601 goal target date
      - name: status
        type: enum
        source: system
        description: goal lifecycle state
        default: OPEN
        constraints: "one of {OPEN, IN_PROGRESS, MET, DISCONTINUED}"

  - name: BedHold
    parent: Admission
    common_fields: true
    fields:
      - name: admission_id
        type: string
        source: input
        description: "FK -> Admission.id"
      - name: leave_reason
        type: enum
        source: input
        description: reason for the leave-of-absence
        constraints: "one of {HOSPITAL, THERAPEUTIC, OTHER}"
      - name: leave_start_at
        type: datetime
        source: input
        description: ISO 8601 datetime the resident left the facility (UTC); half-open interval start (inclusive)
      - name: expected_return_at
        type: datetime
        source: input
        description: ISO 8601 expected return datetime (UTC); half-open interval end (exclusive); must be strictly after leave_start_at
      - name: actual_return_at
        type: datetime
        source: system
        description: ISO 8601 actual return datetime, set on CLOSED transition
        default: null
      - name: leave_day_count
        type: integer
        source: computed
        description: midnights occupied by the leave window (bed_hold_days); recomputed on close against actual_return_at
      - name: paid_day_count
        type: integer
        source: computed
        description: subset of leave_day_count the payer credits as paid bed-hold (bed_hold_days variant); excess days are unpaid
      - name: status
        type: enum
        source: system
        description: bed-hold lifecycle state
        default: OPEN
        constraints: "one of {OPEN, CLOSED, CONVERTED_TO_DISCHARGE}"

  - name: Claim
    parent: Admission
    common_fields: true
    fields:
      - name: admission_id
        type: string
        source: input
        description: "FK -> Admission.id"
      - name: driving_assessment_id
        type: string
        source: input
        description: "FK -> MdsAssessment.id; the SUBMITTED assessment whose case-mix groups price this claim"
      - name: period_start_at
        type: datetime
        source: input
        description: ISO 8601 claim period start (UTC); first covered day in the period (inclusive)
      - name: period_end_at
        type: datetime
        source: input
        description: ISO 8601 claim period end (UTC); last covered day in the period (inclusive); must be on/after period_start_at
      - name: billed_day_count
        type: integer
        source: computed
        description: count of covered days in [period_start_at, period_end_at] minus unpaid bed-hold days overlapping the period
      - name: estimated_amount_cents
        type: integer
        source: computed
        description: forward_looking variant total set at ESTIMATED (claim_total estimated variant)
      - name: final_amount_cents
        type: integer
        source: computed
        description: chronological variant total set at FINALIZED (claim_total actual variant); may differ from estimated
      - name: variance_cents
        type: integer
        source: computed
        description: final_amount_cents - estimated_amount_cents; reconciliation delta
      - name: status
        type: enum
        source: system
        description: claim lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, ESTIMATED, FINALIZED, SUBMITTED, PAID, REJECTED}"

  - name: QualityMeasure
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id"
      - name: measure_code
        type: enum
        source: input
        description: quality-measure category
        constraints: "one of {FALLS_WITH_INJURY, PRESSURE_ULCER, ANTIPSYCHOTIC_USE, REHOSPITALIZATION}"
      - name: numerator
        type: integer
        source: input
        description: count of adverse events for this measure in the reporting period
        constraints: ">= 0"
      - name: denominator
        type: integer
        source: input
        description: eligible-resident denominator for this measure
        constraints: ">= 1"
      - name: reporting_period
        type: string
        source: input
        description: reporting period label (e.g., 2026Q1)
      - name: measure_points
        type: integer
        source: computed
        description: 1..100 points assigned to this measure by five_star_quality_score thresholds (lower adverse rate -> more points)

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: Resident
    initial_state: PROSPECTIVE
    terminal_states: [DISCHARGED]
    transitions:
      - from: PROSPECTIVE
        to: ADMITTED
        trigger: "POST /snf/admissions/{id}/activate"
        actor: AdmissionsCoordinator
        preconditions:
          - "the Admission being activated has status==PENDING and resident_id==this.id"
          - "linked PasrrScreening.status==CLEARED"
          - "Facility.occupied_bed_count < Facility.certified_bed_count"
        side_effects:
          - "Resident.status -> ADMITTED"
          - "linked Admission.status -> ACTIVE or NON_COVERED (see Admission machine)"
          - "Facility.occupied_bed_count recomputed (+1)"
        note: "cross-entity guarded transition: Resident admit driven by Admission.activate"
      - from: ADMITTED
        to: ON_LEAVE
        trigger: "POST /snf/admissions/{id}/bed-holds (BedHold created OPEN)"
        actor: AdmissionsCoordinator
        preconditions:
          - "Admission.status==ACTIVE"
          - "no other BedHold for this Admission with status==OPEN"
        side_effects:
          - "Resident.status -> ON_LEAVE"
          - "a BedHold row is created with status==OPEN"
        note: "loop hop out; bed is held while occupied_bed_count still counts the resident"
      - from: ON_LEAVE
        to: ADMITTED
        trigger: "POST /snf/bed-holds/{id}/close"
        actor: AdmissionsCoordinator
        preconditions:
          - "BedHold.status==OPEN and its Admission.status==ACTIVE"
          - "close payload return_outcome==RETURNED"
        side_effects:
          - "BedHold.status -> CLOSED; BedHold.actual_return_at set"
          - "BedHold.leave_day_count and paid_day_count recomputed (bed_hold_days)"
          - "Resident.status -> ADMITTED"
          - "Admission.covered_day_count reduced by the BedHold's unpaid_day_count (= leave_day_count - paid_day_count)"
        note: "loop hop back in; cyclic ADMITTED<->ON_LEAVE"
      - from: ON_LEAVE
        to: DISCHARGED
        trigger: "POST /snf/bed-holds/{id}/close"
        actor: AdmissionsCoordinator
        preconditions:
          - "BedHold.status==OPEN"
          - "close payload return_outcome==DID_NOT_RETURN"
        side_effects:
          - "BedHold.status -> CONVERTED_TO_DISCHARGE"
          - "Resident.status -> DISCHARGED"
          - "Admission.status -> DISCHARGED; Admission.discharge_at = BedHold.leave_start_at"
          - "Facility.occupied_bed_count recomputed (-1)"
        note: "leave converts to discharge when resident never returns"
      - from: ADMITTED
        to: DISCHARGED
        trigger: "POST /snf/admissions/{id}/discharge"
        actor: AdmissionsCoordinator
        preconditions:
          - "Admission.status==DISCHARGE_PLANNED"
          - "Resident.status==ADMITTED (not ON_LEAVE)"
        side_effects:
          - "Resident.status -> DISCHARGED"
          - "Admission.status -> DISCHARGED; Admission.discharge_at set to request discharge_at"
          - "Facility.occupied_bed_count recomputed (-1)"

  - entity: Admission
    initial_state: PENDING
    terminal_states: [DISCHARGED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /snf/admissions/{id}/activate"
        actor: AdmissionsCoordinator
        preconditions:
          - "linked PasrrScreening.status==CLEARED"
          - "if payer_source==MEDICARE_A then qualifying_stay_id is non-null AND linked QualifyingStay.qualifies==true"
          - "Facility.occupied_bed_count < Facility.certified_bed_count"
        side_effects:
          - "Admission.medicare_covered computed (true iff MEDICARE_A and QualifyingStay.qualifies)"
          - "Admission.status -> ACTIVE"
          - "Resident.status -> ADMITTED (see Resident machine)"
          - "Facility.occupied_bed_count recomputed"
        note: "guarded by PASRR + qualifying-stay cross-entity state"
      - from: PENDING
        to: NON_COVERED
        trigger: "POST /snf/admissions/{id}/activate"
        actor: AdmissionsCoordinator
        preconditions:
          - "linked PasrrScreening.status==CLEARED"
          - "payer_source==MEDICARE_A AND (qualifying_stay_id is null OR linked QualifyingStay.qualifies==false)"
          - "Facility.occupied_bed_count < Facility.certified_bed_count"
          - "activate payload allow_non_covered==true"
        side_effects:
          - "Admission.medicare_covered=false"
          - "Admission.status -> NON_COVERED"
          - "Resident.status -> ADMITTED"
          - "Facility.occupied_bed_count recomputed"
        note: "branch: a Medicare resident without a qualifying stay may still be admitted as a self-pay/non-covered episode if the coordinator opts in"
      - from: ACTIVE
        to: DISCHARGE_PLANNED
        trigger: "POST /snf/admissions/{id}/plan-discharge"
        actor: AdmissionsCoordinator
        preconditions:
          - "Admission.status==ACTIVE"
          - "the Admission has at least one CarePlan with status==ACTIVE"
          - "no BedHold for this Admission with status==OPEN"
        side_effects:
          - "Admission.status -> DISCHARGE_PLANNED"
          - "all MdsAssessment rows with assessment_type==DISCHARGE and status==SCHEDULED move to IN_PROGRESS"
        note: "cross-entity guard on CarePlan.status"
      - from: NON_COVERED
        to: DISCHARGE_PLANNED
        trigger: "POST /snf/admissions/{id}/plan-discharge"
        actor: AdmissionsCoordinator
        preconditions:
          - "Admission.status==NON_COVERED"
          - "the Admission has at least one CarePlan with status==ACTIVE"
        side_effects:
          - "Admission.status -> DISCHARGE_PLANNED"
      - from: DISCHARGE_PLANNED
        to: DISCHARGED
        trigger: "POST /snf/admissions/{id}/discharge"
        actor: AdmissionsCoordinator
        preconditions:
          - "Admission.status==DISCHARGE_PLANNED"
          - "every MdsAssessment with assessment_type==DISCHARGE for this Admission has status==SUBMITTED"
          - "every CarePlan for this Admission has status IN {ACTIVE, CLOSED}"
        side_effects:
          - "Admission.status -> DISCHARGED; Admission.discharge_at set"
          - "Resident.status -> DISCHARGED (see Resident machine)"
          - "every CarePlan with status==ACTIVE for this Admission -> CLOSED"
          - "every CarePlanGoal with status IN {OPEN, IN_PROGRESS} under those plans -> DISCONTINUED"
          - "Facility.occupied_bed_count recomputed"
        note: "depth-3 cascade: discharge -> CarePlan CLOSED -> CarePlanGoal DISCONTINUED"

  - entity: MdsAssessment
    initial_state: SCHEDULED
    terminal_states: [SUBMITTED, SUPERSEDED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /snf/assessments/{id}/start"
        actor: MdsCoordinator
        preconditions:
          - "parent Admission.status IN {ACTIVE, NON_COVERED, DISCHARGE_PLANNED}"
          - "assessment_reference_date falls within the type's ARD window (see ard_window_check)"
        side_effects:
          - "MdsAssessment.status -> IN_PROGRESS"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /snf/assessments/{id}/complete"
        actor: MdsCoordinator
        preconditions:
          - "pt_function_score, slp_components_count, nta_comorbidity_points all present"
        side_effects:
          - "pt_ot_case_mix_group, slp_case_mix_group, nta_case_mix_group computed (pdpm_component_classification)"
          - "MdsAssessment.status -> COMPLETED"
      - from: COMPLETED
        to: IN_PROGRESS
        trigger: "POST /snf/assessments/{id}/reopen"
        actor: MdsCoordinator
        preconditions:
          - "MdsAssessment.status==COMPLETED"
          - "no Claim with driving_assessment_id==this.id has status IN {FINALIZED, SUBMITTED, PAID}"
        side_effects:
          - "MdsAssessment.status -> IN_PROGRESS"
          - "the three case-mix group fields are cleared (recomputed on next complete)"
        note: "correction loop; cyclic COMPLETED<->IN_PROGRESS; guarded by downstream Claim state"
      - from: COMPLETED
        to: SUBMITTED
        trigger: "POST /snf/assessments/{id}/submit"
        actor: MdsCoordinator
        preconditions:
          - "MdsAssessment.status==COMPLETED"
        side_effects:
          - "MdsAssessment.status -> SUBMITTED"
          - "if corrects_assessment_id is non-null, the corrected MdsAssessment.status -> SUPERSEDED"
        note: "modification chain: submitting a correction supersedes the original"

  - entity: CarePlan
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /snf/care-plans/{id}/activate"
        actor: Physician
        preconditions:
          - "parent Admission.status IN {ACTIVE, NON_COVERED}"
          - "the CarePlan has at least one CarePlanGoal with status==OPEN"
        side_effects:
          - "CarePlan.status -> ACTIVE; CarePlan.last_reviewed_at set to request now"
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /snf/care-plans/{id}/begin-review"
        actor: Physician
        preconditions:
          - "CarePlan.status==ACTIVE"
        side_effects:
          - "CarePlan.status -> UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /snf/care-plans/{id}/complete-review"
        actor: Physician
        preconditions:
          - "CarePlan.status==UNDER_REVIEW"
        side_effects:
          - "CarePlan.status -> ACTIVE; CarePlan.last_reviewed_at set to request now"
        note: "revision loop; cyclic ACTIVE<->UNDER_REVIEW"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /snf/care-plans/{id}/close OR cascade from Admission discharge"
        actor: Physician
        preconditions:
          - "CarePlan.status==ACTIVE"
        side_effects:
          - "CarePlan.status -> CLOSED"
          - "every CarePlanGoal with status IN {OPEN, IN_PROGRESS} under this plan -> DISCONTINUED"

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: DRAFT
        to: ESTIMATED
        trigger: "POST /snf/claims/{id}/estimate"
        actor: BillingAnalyst
        preconditions:
          - "parent Admission.medicare_covered==true"
          - "linked MdsAssessment.status==SUBMITTED"
        side_effects:
          - "Claim.billed_day_count computed"
          - "Claim.estimated_amount_cents computed (claim_total estimated/forward_looking variant)"
          - "Claim.status -> ESTIMATED"
      - from: ESTIMATED
        to: FINALIZED
        trigger: "POST /snf/claims/{id}/finalize"
        actor: BillingAnalyst
        preconditions:
          - "Claim.status==ESTIMATED"
          - "no BedHold for the Admission with status==OPEN whose leave window overlaps the claim period"
        side_effects:
          - "Claim.final_amount_cents computed (claim_total actual/chronological variant)"
          - "Claim.variance_cents = final_amount_cents - estimated_amount_cents"
          - "Claim.status -> FINALIZED"
      - from: FINALIZED
        to: SUBMITTED
        trigger: "POST /snf/claims/{id}/submit"
        actor: BillingAnalyst
        preconditions:
          - "Claim.status==FINALIZED"
          - "expected_claim_version matches Claim.version (OCC)"
        side_effects:
          - "Claim.status -> SUBMITTED"
          - "increments Claim.version by 1"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /snf/claims/{id}/adjudicate"
        actor: BillingAnalyst
        preconditions:
          - "Claim.status==SUBMITTED"
          - "adjudicate payload decision==PAID"
        side_effects:
          - "Claim.status -> PAID"
          - "Admission.covered_day_count increased by Claim.billed_day_count"
        note: "branch fork: SUBMITTED -> {PAID, REJECTED} with divergent side-effects"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /snf/claims/{id}/adjudicate"
        actor: BillingAnalyst
        preconditions:
          - "Claim.status==SUBMITTED"
          - "adjudicate payload decision==REJECTED"
        side_effects:
          - "Claim.status -> REJECTED"
          - "the driving MdsAssessment, if status==SUBMITTED, is left unchanged; no covered_day_count change"
        note: "branch fork sibling: REJECTED leaves covered_day_count untouched"

  - entity: BedHold
    initial_state: OPEN
    terminal_states: [CLOSED, CONVERTED_TO_DISCHARGE]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /snf/bed-holds/{id}/close (return_outcome==RETURNED)"
        actor: AdmissionsCoordinator
        preconditions:
          - "BedHold.status==OPEN"
          - "actual_return_at strictly after leave_start_at"
        side_effects:
          - "BedHold.actual_return_at set; leave_day_count and paid_day_count recomputed (bed_hold_days)"
          - "Resident.status -> ADMITTED"
          - "Admission.covered_day_count decreased by (leave_day_count - paid_day_count)"
        note: "RETURNED branch"
      - from: OPEN
        to: CONVERTED_TO_DISCHARGE
        trigger: "POST /snf/bed-holds/{id}/close (return_outcome==DID_NOT_RETURN)"
        actor: AdmissionsCoordinator
        preconditions:
          - "BedHold.status==OPEN"
        side_effects:
          - "Resident.status -> DISCHARGED"
          - "Admission.status -> DISCHARGED; Admission.discharge_at = BedHold.leave_start_at"
          - "every CarePlan with status==ACTIVE for the Admission -> CLOSED"
          - "every CarePlanGoal with status IN {OPEN, IN_PROGRESS} under those plans -> DISCONTINUED"
          - "Facility.occupied_bed_count recomputed (-1)"
        note: "DID_NOT_RETURN branch; depth-3 cascade convert -> Admission DISCHARGED -> CarePlan CLOSED -> CarePlanGoal DISCONTINUED"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: assessment-correction-stale-version
    parent_entity: MdsAssessment
    write_endpoint: "POST /snf/assessments/{id}/correct"
    occ_field: "expected_assessment_version"
    description: |
      Opening a correcting MdsAssessment against a SUBMITTED assessment whose
      version has advanced since the client last observed it is rejected. A
      correction legitimately supersedes the prior assessment; if another writer
      has already opened a correction against it (bumping the corrected
      assessment's version), the current writer's view is stale and its correction
      would build a conflicting modification chain on an already-superseded target.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-submit-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /snf/claims/{id}/submit"
    occ_field: "expected_claim_version"
    description: |
      Submitting a Claim whose version has advanced since the client last read it
      is rejected. The finalize step that legitimately re-prices a claim bumps
      Claim.version; a submit carrying a stale expected_claim_version is rejected
      so a re-finalized (re-priced) claim is never submitted under an out-of-date
      amount.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: qualifying_stay_midnights
    trigger: "on POST /snf/residents/{id}/qualifying-stays (create) and on read"
    algorithm: threshold
    formula: |
      midnights_count = number of calendar-date boundaries (UTC) strictly
        between floor_to_date(hospital_admit_at) and floor_to_date(hospital_discharge_at)
        = (date(hospital_discharge_at) - date(hospital_admit_at)).days
      qualifies = (midnights_count >= QUALIFYING_MIDNIGHTS)
    input_set: "the single QualifyingStay row's two datetimes"
    constants:
      QUALIFYING_MIDNIGHTS: 3
    precision: "integer day count; UTC date floor"
    variants:
      - name: same_day_zero
        when: "admit and discharge on same UTC date"
        difference: "midnights_count==0; qualifies==false regardless of hours elapsed"

  - name: pdpm_component_classification
    trigger: "on POST /snf/assessments/{id}/complete (MdsAssessment IN_PROGRESS->COMPLETED)"
    algorithm: weighted_scoring
    formula: |
      # PT/OT group from function score bands (non-linear branch selection)
      if pt_function_score in 0..5:   pt_ot_case_mix_group = "TA"   # CMI 1.53
      elif pt_function_score in 6..9: pt_ot_case_mix_group = "TB"   # CMI 1.69
      elif pt_function_score in 10..23: pt_ot_case_mix_group = "TC" # CMI 1.85
      else (==24):                    pt_ot_case_mix_group = "TD"   # CMI 1.00
      # SLP group from component count
      slp_case_mix_group = {0:"SA",1:"SB",2:"SC",3:"SF"}[slp_components_count]
      # NTA group from comorbidity points (tiered)
      if nta_comorbidity_points >= 12:   nta_case_mix_group = "NA"  # CMI 3.25
      elif nta_comorbidity_points in 9..11: nta_case_mix_group="NB" # CMI 2.53
      elif nta_comorbidity_points in 6..8:  nta_case_mix_group="NC" # CMI 1.85
      elif nta_comorbidity_points in 3..5:  nta_case_mix_group="ND" # CMI 1.34
      else (0..2):                          nta_case_mix_group="NE" # CMI 0.96
    input_set: "the MdsAssessment's pt_function_score, slp_components_count, nta_comorbidity_points"
    constants:
      PT_OT_CMI: { TA: 1.53, TB: 1.69, TC: 1.85, TD: 1.00 }
      SLP_CMI: { SA: 1.00, SB: 1.46, SC: 2.13, SF: 2.98 }
      NTA_CMI: { NA: 3.25, NB: 2.53, NC: 1.85, ND: 1.34, NE: 0.96 }
    precision: "group codes are exact; CMI carried at 4 decimals"

  - name: pdpm_per_diem_amount
    trigger: "during claim_total (per covered day), keyed on driving MdsAssessment groups + stay-day index"
    algorithm: tiered_pricing
    formula: |
      # evaluation order is PINNED: resolve each component's adjusted rate, then
      # sum components, THEN apply the day-index variable adjustment factor, THEN
      # round once to the cent (see claim_total for rounding placement).
      for component in {PT, OT, SLP, NTA, NURSING}:
        rate_row = active PdpmRate with component==component
                   and case_mix_group == group-from-assessment-for-that-component
                   (NURSING uses a flat case_mix_group "NURS" row; SLP/PT/OT/NTA
                    use the assessment's resolved groups; OT reuses the PT group code)
        component_base = rate_row.base_rate_cents * rate_row.case_mix_index
        component_day_amount = component_base * variable_adjustment(component, stay_day_index)
      day_rate_cents_unrounded = sum over components of component_day_amount
      where variable_adjustment(component, d) =
        if component in {PT, OT}: 1.00 for d in 1..20, then 0.98 stepping down
            0.02 every 7 days starting day 21 (1..20->1.00, 21..27->0.98, 28..34->0.96, ...)
        if component == NTA: 3.00 for d in 1..3, else 1.00
        if component in {SLP, NURSING}: 1.00 for all d
    input_set: "driving MdsAssessment groups; the day's 1-based stay_day_index; active PdpmRate rows"
    constants:
      NTA_FRONTLOAD_FACTOR: 3.00
      NTA_FRONTLOAD_DAYS: 3
      PTOT_FULL_DAYS: 20
      PTOT_STEP: 0.02
      PTOT_STEP_PERIOD_DAYS: 7
    precision: "components carried unrounded; rounding deferred to claim_total"
    variants:
      - name: nta_front_loaded
        when: "stay_day_index in 1..3"
        difference: "NTA component multiplied by 3.00; days 4+ use 1.00"
      - name: ptot_decayed
        when: "stay_day_index >= 21"
        difference: "PT and OT components stepped down 0.02 per 7-day block past day 20"

  - name: claim_total
    trigger: "on Claim estimate (estimated_amount_cents) and Claim finalize (final_amount_cents)"
    algorithm: chronological
    formula: |
      # ROUNDING ORDER PINNED: compute each day's day_rate_cents_unrounded
      # (pdpm_per_diem_amount), round THAT to the nearest cent per day
      # (round_half_up), THEN sum the rounded per-day amounts. Per-day-then-sum,
      # NOT sum-then-round.
      total_cents = sum over each billed covered day d of
                      round_half_up(pdpm_per_diem_amount(d))
    input_set: "the claim's billed covered days; see variants for which day set"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; round per day then sum"
    variants:
      - name: estimated_forward_looking
        when: "Claim estimate (DRAFT->ESTIMATED)"
        difference: |
          billed day set = every calendar day in [period_start_at, period_end_at]
          inclusive, PROJECTED as fully covered (no bed-hold deductions yet).
          stay_day_index for day d = (date(d) - date(Admission.admit_at)).days + 1.
          Writes estimated_amount_cents.
      - name: final_chronological
        when: "Claim finalize (ESTIMATED->FINALIZED)"
        difference: |
          billed day set = calendar days in [period_start_at, period_end_at]
          MINUS any day that falls inside a CLOSED/CONVERTED BedHold's
          [leave_start_at, expected_or_actual_return_at) window beyond that
          bed-hold's paid_day_count (unpaid bed-hold days are removed). Same
          per-day pricing and rounding. Writes final_amount_cents; the two
          variants diverge whenever an unpaid bed-hold day overlaps the period.

  - name: therapy_minutes_aggregate
    trigger: "on POST /snf/admissions/{id}/therapy-logs (per row) and GET /snf/admissions/{id}/therapy-summary"
    algorithm: aggregation
    formula: |
      # per-row weighting toward individual-equivalent minutes
      individual_equivalent_minutes(row) =
        if mode==INDIVIDUAL:  row.minutes
        if mode==CONCURRENT:  floor(row.minutes / 2)
        if mode==GROUP:       floor(row.minutes / 4)
      # summary, scoped to one discipline over the stay:
      total_raw = sum(row.minutes) for rows with that discipline
      total_individual_equiv = sum(individual_equivalent_minutes(row))
      group_concurrent_raw = sum(row.minutes for rows with mode in {GROUP, CONCURRENT})
      group_concurrent_pct = (group_concurrent_raw / total_raw) if total_raw>0 else 0
      exceeds_group_cap = (group_concurrent_pct > GROUP_CONCURRENT_CAP_PCT)
    input_set: "all TherapyLog rows for the admission, filtered by discipline; INCLUDE rows on bed-hold days? NO — rows whose session_date falls in an OPEN/CLOSED BedHold window are EXCLUDED from the summary"
    constants:
      GROUP_CONCURRENT_CAP_PCT: 0.25
    precision: "integer minutes; floor on weighting; pct compared with > (strict)"

  - name: bed_hold_days
    trigger: "on BedHold create (provisional) and on BedHold close (final, against actual_return_at)"
    algorithm: interval_merge
    formula: |
      window_end = actual_return_at if status closing else expected_return_at
      leave_day_count = (date(window_end) - date(leave_start_at)).days   # midnights, half-open
      # payer-specific paid cap
      paid_cap = PAID_BEDHOLD_CAP[Admission.payer_source]
      paid_day_count = min(leave_day_count, paid_cap)
      unpaid_day_count = leave_day_count - paid_day_count
    input_set: "the BedHold's interval and its Admission.payer_source"
    constants:
      PAID_BEDHOLD_CAP: { MEDICAID: 10, MEDICARE_A: 0, MANAGED_CARE: 7, PRIVATE: 30 }
    precision: "integer midnights; half-open [start, end); min() for paid cap"
    variants:
      - name: medicare_no_paid_holds
        when: "Admission.payer_source==MEDICARE_A"
        difference: "paid_cap==0, so all leave days are unpaid (paid_day_count==0)"

  - name: five_star_quality_score
    trigger: "on POST /snf/facilities/{id}/quality-measures (per row) and on GET /snf/facilities/{id}/star-summary"
    algorithm: weighted_scoring
    formula: |
      for each QualityMeasure row of the facility (latest reporting_period per measure_code):
        adverse_rate = numerator / denominator
        measure_points = points-by-threshold(measure_code, adverse_rate)   # 1..100
      qm_total = sum(measure_points over the four measure_codes, missing measure -> 50 baseline)
      quality_measure_rating =  # qm component star, threshold cut points on qm_total
        5 if qm_total >= 360, 4 if 280..359, 3 if 200..279, 2 if 120..199, else 1
      overall_star_rating = clamp(1,5,
        health_inspection_rating
        + (1 if staffing_rating>=4 else 0) - (1 if staffing_rating<=2 else 0)
        + (1 if quality_measure_rating>=4 else 0) - (1 if quality_measure_rating<=2 else 0))
    input_set: "QualityMeasure rows, one (latest reporting_period) per measure_code; Facility health/staffing inputs"
    constants:
      QM_BASELINE_MISSING: 50
      QM_STAR_CUTS: { five: 360, four: 280, three: 200, two: 120 }
      POINTS_BY_RATE:
        FALLS_WITH_INJURY: "rate<0.01->100, <0.03->75, <0.05->50, else 25"
        PRESSURE_ULCER: "rate<0.02->100, <0.05->75, <0.08->50, else 25"
        ANTIPSYCHOTIC_USE: "rate<0.10->100, <0.15->75, <0.20->50, else 25"
        REHOSPITALIZATION: "rate<0.15->100, <0.20->75, <0.25->50, else 25"
    precision: "integer points; rate compared with < (strict) at each cut; overall clamped 1..5"

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "role is permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every path/body referenced resource exists, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "request body has all required fields with valid types/enums/ranges"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: business_referential
    check: "on Admission activate: linked PasrrScreening.status==CLEARED"
    error_id: ERR_PASRR_NOT_CLEARED
    http_status: 409
    applies_to: "POST /snf/admissions/{id}/activate"

  - priority: 7
    category: business_safety
    check: "on Admission activate with payer_source==MEDICARE_A and allow_non_covered!=true: linked QualifyingStay exists and qualifies==true"
    error_id: ERR_QUALIFYING_STAY_NOT_MET
    http_status: 409
    applies_to: "POST /snf/admissions/{id}/activate"

  - priority: 8
    category: business_constraint
    check: "on Admission activate: Facility.occupied_bed_count < Facility.certified_bed_count"
    error_id: ERR_NO_BEDS_AVAILABLE
    http_status: 409
    applies_to: "POST /snf/admissions/{id}/activate"

  - priority: 9
    category: business_temporal
    check: "on MdsAssessment start: assessment_reference_date falls inside the type's ARD window (ADMISSION_5DAY: stay-days 1..8 inclusive of admit; INTERIM_IPA: any day after the 5-day ARD; DISCHARGE: within [discharge_planned_at-2d, +14d])"
    error_id: ERR_ARD_OUT_OF_WINDOW
    http_status: 422
    applies_to: "POST /snf/assessments/{id}/start"

  - priority: 10
    category: business_temporal
    check: "on BedHold create: leave window [leave_start_at, expected_return_at) does not overlap any existing BedHold window for the same Admission (touching endpoints allowed: end==start is NOT an overlap)"
    error_id: ERR_BEDHOLD_OVERLAP
    http_status: 409
    applies_to: "POST /snf/admissions/{id}/bed-holds"

  - priority: 11
    category: business_temporal
    check: "on MdsAssessment start: the ARD window of this assessment does not overlap the ARD window of another non-SUPERSEDED assessment of the SAME assessment_type for the Admission (aggregate-capacity semantics: only one open assessment per type-window; adjacency at exactly the window boundary IS a conflict because windows are inclusive-closed)"
    error_id: ERR_ASSESSMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /snf/assessments/{id}/start"

  - priority: 12
    category: business_constraint
    check: "on TherapyLog create: session_date falls within [Admission.admit_at, now] and Admission.status IN {ACTIVE, NON_COVERED, DISCHARGE_PLANNED}"
    error_id: ERR_THERAPY_OUT_OF_STAY
    http_status: 422
    applies_to: "POST /snf/admissions/{id}/therapy-logs"

  - priority: 13
    category: business_referential
    check: "on Claim create/estimate: driving MdsAssessment belongs to the same Admission and has status==SUBMITTED"
    error_id: ERR_ASSESSMENT_NOT_SUBMITTED
    http_status: 409
    applies_to: ["POST /snf/admissions/{id}/claims", "POST /snf/claims/{id}/estimate"]

  - priority: 14
    category: business_fiscal
    check: "on Claim estimate: parent Admission.medicare_covered==true"
    error_id: ERR_NOT_MEDICARE_COVERED
    http_status: 409
    applies_to: "POST /snf/claims/{id}/estimate"

  - priority: 15
    category: business_temporal
    check: "on Claim create: [period_start_at, period_end_at] lies within [Admission.admit_at, Admission.discharge_at or now]; period_end_at on/after period_start_at"
    error_id: ERR_CLAIM_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /snf/admissions/{id}/claims"

  - priority: 16
    category: business_constraint
    check: "on Admission plan-discharge: at least one CarePlan with status==ACTIVE exists for the Admission"
    error_id: ERR_NO_ACTIVE_CARE_PLAN
    http_status: 409
    applies_to: "POST /snf/admissions/{id}/plan-discharge"

  - priority: 17
    category: business_constraint
    check: "on Admission discharge: every DISCHARGE-type MdsAssessment for the Admission has status==SUBMITTED"
    error_id: ERR_DISCHARGE_ASSESSMENT_INCOMPLETE
    http_status: 409
    applies_to: "POST /snf/admissions/{id}/discharge"

  - priority: 18
    category: business_constraint
    check: "on BedHold create: Admission.status==ACTIVE and no other OPEN BedHold for the Admission"
    error_id: ERR_BEDHOLD_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /snf/admissions/{id}/bed-holds"

  - priority: 19
    category: business_referential
    check: "on MdsAssessment reopen: no Claim driven by this assessment has status IN {FINALIZED, SUBMITTED, PAID}"
    error_id: ERR_ASSESSMENT_LOCKED_BY_CLAIM
    http_status: 409
    applies_to: "POST /snf/assessments/{id}/reopen"

  - priority: 20
    category: business_constraint
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /snf/assessments/{id}/correct", "POST /snf/claims/{id}/submit"]

  - priority: 21
    category: state
    check: "on MdsAssessment correct: the corrected target assessment {id} has status==SUBMITTED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /snf/assessments/{id}/correct"

  - priority: 22
    category: business_referential
    check: "on PASRR resolve to CLEARED: the screening is NOT a LEVEL_I with has_serious_mental_illness_indicator==true (such a screening must escalate to LEVEL_II before clearance)"
    error_id: ERR_PASRR_LEVEL_II_REQUIRED
    http_status: 409
    applies_to: "POST /snf/pasrr-screenings/{id}/resolve"

  - priority: 23
    category: business_constraint
    check: "on CarePlan activate: the plan has at least one CarePlanGoal with status==OPEN (open_goal_count >= 1)"
    error_id: ERR_GOAL_REQUIRED
    http_status: 409
    applies_to: "POST /snf/care-plans/{id}/activate"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- Facility ----
  - method: POST
    path: "/snf/facilities"
    description: "create a facility"
    roles: [Administrator]
    code: 201
    input: [name, cms_certification_number, certified_bed_count, "health_inspection_rating?", "staffing_rating?"]
    output: Facility
    side_effects: ["occupied_bed_count initialized to 0; quality_measure_rating/overall_star_rating initialized via five_star_quality_score baseline"]

  - method: GET
    path: "/snf/facilities/{id}"
    description: "fetch a facility"
    roles: [Administrator, AdmissionsCoordinator, MdsCoordinator, BillingAnalyst, Physician, Therapist]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: GET
    path: "/snf/facilities/{id}/star-summary"
    description: "computed five-star summary for the facility"
    roles: [Administrator, BillingAnalyst]
    code: 200
    input: []
    output: Facility
    side_effects: ["recomputes quality_measure_rating and overall_star_rating (five_star_quality_score)"]

  - method: POST
    path: "/snf/facilities/{id}/quality-measures"
    description: "record a quality-measure data point for the facility"
    roles: [Administrator]
    code: 201
    input: [measure_code, numerator, denominator, reporting_period]
    output: QualityMeasure
    side_effects: ["measure_points computed (five_star_quality_score); Facility.quality_measure_rating + overall_star_rating recomputed"]

  - method: GET
    path: "/snf/facilities/{id}/quality-measures"
    description: "list quality measures for the facility (reverse-reachability for QualityMeasure.facility_id)"
    roles: [Administrator, BillingAnalyst]
    code: 200
    input: ["measure_code?", "limit?", "offset?"]
    output: QualityMeasure[]
    side_effects: []

  # ---- PdpmRate (configuration) ----
  - method: POST
    path: "/snf/pdpm-rates"
    description: "create a PDPM rate configuration row"
    roles: [Administrator]
    code: 201
    input: [component, case_mix_group, case_mix_index, base_rate_cents, effective_from, "active?"]
    output: PdpmRate
    side_effects: []

  - method: GET
    path: "/snf/pdpm-rates"
    description: "list PDPM rate rows"
    roles: [Administrator, BillingAnalyst]
    code: 200
    input: ["component?", "active?", "limit?", "offset?"]
    output: PdpmRate[]
    side_effects: []

  # ---- Resident ----
  - method: POST
    path: "/snf/residents"
    description: "register a prospective resident"
    roles: [AdmissionsCoordinator]
    code: 201
    input: [full_name, medical_record_number, date_of_birth, primary_facility_id]
    output: Resident
    side_effects: ["status initialized to PROSPECTIVE"]

  - method: GET
    path: "/snf/residents/{id}"
    description: "fetch a resident"
    roles: [AdmissionsCoordinator, MdsCoordinator, Physician, BillingAnalyst, Therapist]
    code: 200
    input: []
    output: Resident
    side_effects: []

  - method: GET
    path: "/snf/residents"
    description: "list residents; filter by primary_facility_id (reverse-reachability for Resident.primary_facility_id)"
    roles: [AdmissionsCoordinator, MdsCoordinator]
    code: 200
    input: ["primary_facility_id?", "status?", "limit?", "offset?"]
    output: Resident[]
    side_effects: []

  - method: POST
    path: "/snf/residents/{id}/qualifying-stays"
    description: "record a prior acute-hospital qualifying stay"
    roles: [AdmissionsCoordinator]
    code: 201
    input: [hospital_admit_at, hospital_discharge_at]
    output: QualifyingStay
    side_effects: ["midnights_count and qualifies computed (qualifying_stay_midnights)"]

  - method: GET
    path: "/snf/qualifying-stays/{id}"
    description: "fetch a qualifying stay"
    roles: [AdmissionsCoordinator, BillingAnalyst]
    code: 200
    input: []
    output: QualifyingStay
    side_effects: []

  - method: GET
    path: "/snf/qualifying-stays"
    description: "list qualifying stays; filter by resident_id (reverse-reachability for QualifyingStay.resident_id)"
    roles: [AdmissionsCoordinator, BillingAnalyst]
    code: 200
    input: ["resident_id?", "limit?", "offset?"]
    output: QualifyingStay[]
    side_effects: []

  - method: POST
    path: "/snf/residents/{id}/pasrr-screenings"
    description: "create a PASRR screening for a resident"
    roles: [AdmissionsCoordinator]
    code: 201
    input: [level, "has_serious_mental_illness_indicator?"]
    output: PasrrScreening
    side_effects: ["status initialized to PENDING"]

  - method: POST
    path: "/snf/pasrr-screenings/{id}/resolve"
    description: "resolve a PASRR screening (clear/deny/escalate)"
    roles: [AdmissionsCoordinator, Physician]
    code: 200
    input: [resolution, "outcome_note?"]
    output: PasrrScreening
    side_effects: ["status -> CLEARED|DENIED|ESCALATED based on resolution and has_serious_mental_illness_indicator"]

  - method: GET
    path: "/snf/pasrr-screenings/{id}"
    description: "fetch a PASRR screening"
    roles: [AdmissionsCoordinator, Physician]
    code: 200
    input: []
    output: PasrrScreening
    side_effects: []

  - method: GET
    path: "/snf/pasrr-screenings"
    description: "list PASRR screenings; filter by resident_id (reverse-reachability for PasrrScreening.resident_id)"
    roles: [AdmissionsCoordinator, Physician]
    code: 200
    input: ["resident_id?", "status?", "limit?", "offset?"]
    output: PasrrScreening[]
    side_effects: []

  # ---- Admission ----
  - method: POST
    path: "/snf/admissions"
    description: "create a pending admission episode"
    roles: [AdmissionsCoordinator]
    code: 201
    input: [resident_id, facility_id, pasrr_screening_id, payer_source, admit_at, "qualifying_stay_id?"]
    output: Admission
    side_effects: ["status initialized to PENDING; medicare_covered/covered_day_count initialized"]

  - method: GET
    path: "/snf/admissions/{id}"
    description: "fetch an admission"
    roles: [AdmissionsCoordinator, MdsCoordinator, BillingAnalyst, Physician, Therapist]
    code: 200
    input: []
    output: Admission
    side_effects: []

  - method: GET
    path: "/snf/admissions"
    description: "list admissions; filter by resident_id / facility_id / pasrr_screening_id / qualifying_stay_id (reverse-reachability for all four Admission FKs)"
    roles: [AdmissionsCoordinator, BillingAnalyst]
    code: 200
    input: ["resident_id?", "facility_id?", "pasrr_screening_id?", "qualifying_stay_id?", "status?", "limit?", "offset?"]
    output: Admission[]
    side_effects: []

  - method: POST
    path: "/snf/admissions/{id}/activate"
    description: "activate a pending admission (ACTIVE or NON_COVERED)"
    roles: [AdmissionsCoordinator]
    code: 200
    input: ["allow_non_covered?"]
    output: Admission
    side_effects: ["Admission PENDING->ACTIVE|NON_COVERED; Resident PROSPECTIVE->ADMITTED; medicare_covered computed; Facility.occupied_bed_count recomputed"]

  - method: POST
    path: "/snf/admissions/{id}/plan-discharge"
    description: "move admission to DISCHARGE_PLANNED"
    roles: [AdmissionsCoordinator]
    code: 200
    input: []
    output: Admission
    side_effects: ["Admission ACTIVE|NON_COVERED->DISCHARGE_PLANNED; scheduled DISCHARGE assessments -> IN_PROGRESS"]

  - method: POST
    path: "/snf/admissions/{id}/discharge"
    description: "discharge a planned admission"
    roles: [AdmissionsCoordinator]
    code: 200
    input: [discharge_at]
    output: Admission
    side_effects: ["Admission DISCHARGE_PLANNED->DISCHARGED; Resident->DISCHARGED; cascade CarePlan ACTIVE->CLOSED -> CarePlanGoal->DISCONTINUED; Facility.occupied_bed_count recomputed"]

  - method: POST
    path: "/snf/admissions/{id}/assessments"
    description: "schedule an original MDS assessment for the admission"
    roles: [MdsCoordinator]
    code: 201
    input: [assessment_type, assessment_reference_date, pt_function_score, slp_components_count, nta_comorbidity_points]
    output: MdsAssessment
    side_effects: ["status SCHEDULED; target_day computed; corrects_assessment_id left null"]

  - method: POST
    path: "/snf/admissions/{id}/bed-holds"
    description: "open a bed-hold leave on an active admission"
    roles: [AdmissionsCoordinator]
    code: 201
    input: [leave_reason, leave_start_at, expected_return_at]
    output: BedHold
    side_effects: ["BedHold status OPEN; Resident ADMITTED->ON_LEAVE; leave_day_count/paid_day_count provisionally computed (bed_hold_days)"]

  - method: GET
    path: "/snf/admissions/{id}/bed-holds"
    description: "list bed-holds for an admission (reverse-reachability for BedHold.admission_id)"
    roles: [AdmissionsCoordinator, BillingAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BedHold[]
    side_effects: []

  - method: POST
    path: "/snf/admissions/{id}/therapy-logs"
    description: "log a therapy session for an admission"
    roles: [Therapist]
    code: 201
    input: [discipline, mode, minutes, session_date]
    output: TherapyLog
    side_effects: ["individual_equivalent_minutes computed (therapy_minutes_aggregate per-row)"]

  - method: GET
    path: "/snf/admissions/{id}/therapy-logs"
    description: "list therapy logs for an admission (reverse-reachability for TherapyLog.admission_id)"
    roles: [Therapist, MdsCoordinator, BillingAnalyst]
    code: 200
    input: ["discipline?", "limit?", "offset?"]
    output: TherapyLog[]
    side_effects: []

  - method: GET
    path: "/snf/admissions/{id}/therapy-summary"
    description: "computed therapy-minutes summary (individual-equivalent + group/concurrent cap check)"
    roles: [Therapist, MdsCoordinator]
    code: 200
    input: [discipline]
    output: "{ discipline: string, total_raw: integer, total_individual_equiv: integer, group_concurrent_pct: number, exceeds_group_cap: boolean }"
    side_effects: ["computes therapy_minutes_aggregate over the admission's TherapyLog rows for the discipline"]

  - method: GET
    path: "/snf/admissions/{id}/assessments"
    description: "list MDS assessments for an admission (reverse-reachability for MdsAssessment.admission_id)"
    roles: [MdsCoordinator, BillingAnalyst]
    code: 200
    input: ["assessment_type?", "status?", "limit?", "offset?"]
    output: MdsAssessment[]
    side_effects: []

  - method: POST
    path: "/snf/admissions/{id}/claims"
    description: "create a draft claim for an admission period"
    roles: [BillingAnalyst]
    code: 201
    input: [driving_assessment_id, period_start_at, period_end_at]
    output: Claim
    side_effects: ["status DRAFT; billed_day_count/estimated/final initialized to 0"]

  - method: POST
    path: "/snf/admissions/{id}/care-plans"
    description: "create a draft care plan for an admission"
    roles: [Physician, MdsCoordinator]
    code: 201
    input: ["review_interval_days?"]
    output: CarePlan
    side_effects: ["status DRAFT; open_goal_count initialized to 0"]

  - method: GET
    path: "/snf/admissions/{id}/care-plans"
    description: "list care plans for an admission (reverse-reachability for CarePlan.admission_id)"
    roles: [Physician, MdsCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CarePlan[]
    side_effects: []

  - method: GET
    path: "/snf/admissions/{id}/claims"
    description: "list claims for an admission (reverse-reachability for Claim.admission_id)"
    roles: [BillingAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  # ---- MdsAssessment lifecycle ----
  - method: GET
    path: "/snf/assessments/{id}"
    description: "fetch an MDS assessment"
    roles: [MdsCoordinator, BillingAnalyst]
    code: 200
    input: []
    output: MdsAssessment
    side_effects: []

  - method: GET
    path: "/snf/assessments"
    description: "list MDS assessments; filter by corrects_assessment_id (reverse-reachability for the self-referential FK)"
    roles: [MdsCoordinator, BillingAnalyst]
    code: 200
    input: ["corrects_assessment_id?", "admission_id?", "status?", "limit?", "offset?"]
    output: MdsAssessment[]
    side_effects: []

  - method: POST
    path: "/snf/assessments/{id}/start"
    description: "start an MDS assessment (SCHEDULED->IN_PROGRESS); validates ARD window"
    roles: [MdsCoordinator]
    code: 200
    input: []
    output: MdsAssessment
    side_effects: ["status SCHEDULED->IN_PROGRESS"]

  - method: POST
    path: "/snf/assessments/{id}/complete"
    description: "complete an MDS assessment (IN_PROGRESS->COMPLETED); computes case-mix groups"
    roles: [MdsCoordinator]
    code: 200
    input: []
    output: MdsAssessment
    side_effects: ["pt_ot/slp/nta case-mix groups computed (pdpm_component_classification); status IN_PROGRESS->COMPLETED"]

  - method: POST
    path: "/snf/assessments/{id}/reopen"
    description: "reopen a completed assessment for correction (COMPLETED->IN_PROGRESS)"
    roles: [MdsCoordinator]
    code: 200
    input: []
    output: MdsAssessment
    side_effects: ["status COMPLETED->IN_PROGRESS; case-mix group fields cleared"]

  - method: POST
    path: "/snf/assessments/{id}/submit"
    description: "submit a completed assessment (COMPLETED->SUBMITTED); supersedes corrected original"
    roles: [MdsCoordinator]
    code: 200
    input: []
    output: MdsAssessment
    side_effects: ["status COMPLETED->SUBMITTED; if corrects_assessment_id set, corrected assessment -> SUPERSEDED"]

  - method: POST
    path: "/snf/assessments/{id}/correct"
    description: "open a correcting MDS assessment that supersedes a SUBMITTED assessment; OCC on the corrected assessment's version"
    roles: [MdsCoordinator]
    code: 201
    input: [assessment_type, assessment_reference_date, pt_function_score, slp_components_count, nta_comorbidity_points, expected_assessment_version]
    output: MdsAssessment
    side_effects: ["creates a new SCHEDULED MdsAssessment with corrects_assessment_id == {id} under the same Admission; OCC on the corrected MdsAssessment.version (expected_assessment_version); increments the corrected MdsAssessment.version by 1"]

  # ---- CarePlan / CarePlanGoal lifecycle ----
  - method: GET
    path: "/snf/care-plans/{id}"
    description: "fetch a care plan"
    roles: [Physician, MdsCoordinator]
    code: 200
    input: []
    output: CarePlan
    side_effects: []

  - method: POST
    path: "/snf/care-plans/{id}/goals"
    description: "add a goal to a care plan"
    roles: [Physician, MdsCoordinator]
    code: 201
    input: [description, target_date]
    output: CarePlanGoal
    side_effects: ["status OPEN; CarePlan.open_goal_count recomputed"]

  - method: GET
    path: "/snf/care-plans/{id}/goals"
    description: "list goals under a care plan (reverse-reachability for CarePlanGoal.care_plan_id)"
    roles: [Physician, MdsCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CarePlanGoal[]
    side_effects: []

  - method: POST
    path: "/snf/care-plans/{id}/activate"
    description: "activate a draft care plan (DRAFT->ACTIVE)"
    roles: [Physician]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["status DRAFT->ACTIVE; last_reviewed_at set"]

  - method: POST
    path: "/snf/care-plans/{id}/begin-review"
    description: "begin a care-plan review (ACTIVE->UNDER_REVIEW)"
    roles: [Physician]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["status ACTIVE->UNDER_REVIEW"]

  - method: POST
    path: "/snf/care-plans/{id}/complete-review"
    description: "complete a care-plan review (UNDER_REVIEW->ACTIVE)"
    roles: [Physician]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["status UNDER_REVIEW->ACTIVE; last_reviewed_at set"]

  - method: POST
    path: "/snf/care-plans/{id}/close"
    description: "close a care plan (ACTIVE->CLOSED)"
    roles: [Physician]
    code: 200
    input: []
    output: CarePlan
    side_effects: ["status ACTIVE->CLOSED; cascade open/in-progress goals -> DISCONTINUED"]

  - method: PATCH
    path: "/snf/goals/{id}"
    description: "update a goal's status"
    roles: [Physician, MdsCoordinator]
    code: 200
    input: [status]
    output: CarePlanGoal
    side_effects: ["status updated; CarePlan.open_goal_count recomputed"]

  # ---- BedHold lifecycle ----
  - method: GET
    path: "/snf/bed-holds/{id}"
    description: "fetch a bed-hold"
    roles: [AdmissionsCoordinator, BillingAnalyst]
    code: 200
    input: []
    output: BedHold
    side_effects: []

  - method: POST
    path: "/snf/bed-holds/{id}/close"
    description: "close a bed-hold (returned or did-not-return)"
    roles: [AdmissionsCoordinator]
    code: 200
    input: [return_outcome, "actual_return_at?"]
    output: BedHold
    side_effects: ["RETURNED: status->CLOSED, Resident->ADMITTED, recompute bed_hold_days, Admission.covered_day_count -= unpaid_day_count; DID_NOT_RETURN: status->CONVERTED_TO_DISCHARGE, cascade discharge"]

  # ---- Claim lifecycle ----
  - method: GET
    path: "/snf/claims/{id}"
    description: "fetch a claim"
    roles: [BillingAnalyst]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/snf/claims"
    description: "list claims; filter by driving_assessment_id / admission_id (reverse-reachability for Claim.driving_assessment_id)"
    roles: [BillingAnalyst]
    code: 200
    input: ["driving_assessment_id?", "admission_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/snf/claims/{id}/estimate"
    description: "estimate a draft claim (DRAFT->ESTIMATED)"
    roles: [BillingAnalyst]
    code: 200
    input: []
    output: Claim
    side_effects: ["billed_day_count + estimated_amount_cents computed (claim_total estimated variant); status DRAFT->ESTIMATED"]

  - method: POST
    path: "/snf/claims/{id}/finalize"
    description: "finalize an estimated claim (ESTIMATED->FINALIZED)"
    roles: [BillingAnalyst]
    code: 200
    input: []
    output: Claim
    side_effects: ["final_amount_cents + variance_cents computed (claim_total final variant); status ESTIMATED->FINALIZED"]

  - method: POST
    path: "/snf/claims/{id}/submit"
    description: "submit a finalized claim (FINALIZED->SUBMITTED); OCC on Claim.version"
    roles: [BillingAnalyst]
    code: 200
    input: [expected_claim_version]
    output: Claim
    side_effects: ["status FINALIZED->SUBMITTED; increments Claim.version by 1"]

  - method: POST
    path: "/snf/claims/{id}/adjudicate"
    description: "adjudicate a submitted claim (SUBMITTED->PAID|REJECTED)"
    roles: [BillingAnalyst]
    code: 200
    input: [decision]
    output: Claim
    side_effects: ["PAID: status->PAID, Admission.covered_day_count += billed_day_count; REJECTED: status->REJECTED, no covered_day_count change"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or empty X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "authenticated role not permitted for this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, bad type, out-of-range value, or invalid enum"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in a valid state for the requested transition"
  - id: ERR_PASRR_NOT_CLEARED
    http: 409
    condition: "Admission activate attempted while linked PasrrScreening.status != CLEARED"
  - id: ERR_QUALIFYING_STAY_NOT_MET
    http: 409
    condition: "Medicare-A admission activate without a qualifying 3-midnight stay and allow_non_covered not set"
  - id: ERR_NO_BEDS_AVAILABLE
    http: 409
    condition: "Admission activate while Facility.occupied_bed_count >= certified_bed_count"
  - id: ERR_ARD_OUT_OF_WINDOW
    http: 422
    condition: "MdsAssessment start with assessment_reference_date outside the type's ARD window"
  - id: ERR_BEDHOLD_OVERLAP
    http: 409
    condition: "new BedHold window overlaps an existing BedHold window for the same admission"
  - id: ERR_ASSESSMENT_WINDOW_CONFLICT
    http: 409
    condition: "MDS assessment start whose ARD window collides with another non-superseded assessment of the same type"
  - id: ERR_THERAPY_OUT_OF_STAY
    http: 422
    condition: "TherapyLog session_date outside the admission stay window or admission not in a therapy-eligible state"
  - id: ERR_ASSESSMENT_NOT_SUBMITTED
    http: 409
    condition: "claim references a driving assessment that is not SUBMITTED or belongs to another admission"
  - id: ERR_NOT_MEDICARE_COVERED
    http: 409
    condition: "claim estimate on an admission whose medicare_covered is false"
  - id: ERR_CLAIM_PERIOD_INVALID
    http: 422
    condition: "claim period outside the stay window or period_end before period_start"
  - id: ERR_NO_ACTIVE_CARE_PLAN
    http: 409
    condition: "plan-discharge attempted with no ACTIVE CarePlan for the admission"
  - id: ERR_DISCHARGE_ASSESSMENT_INCOMPLETE
    http: 409
    condition: "discharge attempted while a DISCHARGE-type MDS assessment is not SUBMITTED"
  - id: ERR_BEDHOLD_ALREADY_OPEN
    http: 409
    condition: "opening a bed-hold while one is already OPEN for the admission, or admission not ACTIVE"
  - id: ERR_ASSESSMENT_LOCKED_BY_CLAIM
    http: 409
    condition: "reopen attempted while a claim driven by this assessment is FINALIZED/SUBMITTED/PAID"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)"
  - id: ERR_PASRR_LEVEL_II_REQUIRED
    http: 409
    condition: "PASRR resolve to CLEARED attempted on a Level I screening with positive SMI indicator (must escalate to Level II first)"
  - id: ERR_GOAL_REQUIRED
    http: 409
    condition: "CarePlan activate attempted with no OPEN CarePlanGoal under the plan"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: Administrator
    description: "facility configuration, rate setup, quality-measure entry, star ratings"
    identity: opaque
    exclusive_operations:
      - "POST /snf/facilities"
      - "POST /snf/pdpm-rates"
      - "POST /snf/facilities/{id}/quality-measures"
    shared_operations:
      - "GET /snf/facilities/{id}"
      - "GET /snf/facilities/{id}/star-summary"
      - "GET /snf/facilities/{id}/quality-measures"
      - "GET /snf/pdpm-rates"

  - name: AdmissionsCoordinator
    description: "registers residents, PASRR, qualifying stays, admissions, bed-holds, discharge"
    identity: opaque
    exclusive_operations:
      - "POST /snf/residents"
      - "POST /snf/residents/{id}/qualifying-stays"
      - "POST /snf/residents/{id}/pasrr-screenings"
      - "POST /snf/admissions"
      - "POST /snf/admissions/{id}/activate"
      - "POST /snf/admissions/{id}/plan-discharge"
      - "POST /snf/admissions/{id}/discharge"
      - "POST /snf/admissions/{id}/bed-holds"
      - "POST /snf/bed-holds/{id}/close"
    shared_operations:
      - "POST /snf/pasrr-screenings/{id}/resolve"
      - "GET /snf/residents/{id}"
      - "GET /snf/residents"
      - "GET /snf/pasrr-screenings/{id}"
      - "GET /snf/pasrr-screenings"
      - "GET /snf/qualifying-stays/{id}"
      - "GET /snf/qualifying-stays"
      - "GET /snf/admissions/{id}"
      - "GET /snf/admissions"
      - "GET /snf/bed-holds/{id}"
      - "GET /snf/admissions/{id}/bed-holds"

  - name: MdsCoordinator
    description: "owns the MDS assessment schedule and lifecycle, may seed care plans"
    identity: opaque
    exclusive_operations:
      - "POST /snf/admissions/{id}/assessments"
      - "POST /snf/assessments/{id}/start"
      - "POST /snf/assessments/{id}/complete"
      - "POST /snf/assessments/{id}/reopen"
      - "POST /snf/assessments/{id}/submit"
      - "POST /snf/assessments/{id}/correct"
    shared_operations:
      - "POST /snf/admissions/{id}/care-plans"
      - "GET /snf/admissions/{id}/assessments"
      - "GET /snf/assessments/{id}"
      - "GET /snf/assessments"
      - "GET /snf/admissions/{id}/therapy-summary"
      - "GET /snf/admissions/{id}/therapy-logs"
      - "POST /snf/care-plans/{id}/goals"
      - "PATCH /snf/goals/{id}"
      - "GET /snf/care-plans/{id}"
      - "GET /snf/care-plans/{id}/goals"
      - "GET /snf/admissions/{id}/care-plans"

  - name: Therapist
    description: "logs therapy sessions and reads therapy summaries"
    identity: opaque
    exclusive_operations:
      - "POST /snf/admissions/{id}/therapy-logs"
    shared_operations:
      - "GET /snf/admissions/{id}/therapy-logs"
      - "GET /snf/admissions/{id}/therapy-summary"
      - "GET /snf/admissions/{id}"

  - name: Physician
    description: "owns the care-plan lifecycle and PASRR clinical clearance"
    identity: opaque
    exclusive_operations:
      - "POST /snf/care-plans/{id}/activate"
      - "POST /snf/care-plans/{id}/begin-review"
