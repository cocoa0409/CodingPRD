      - name: cumulative_failed_inspection_counter_trips_probation_at_the_third_failure
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Contractor
          - calculations.constant PROBATION_FAIL_THRESHOLD
          - endpoints.POST /eqp/inspections/{id}/record-result
        distinguishing_aspect: "The contractor stays CERTIFIED after the first and second FAIL and flips to PROBATION on exactly the third, and because failed_inspection_count is never reset a reinstated contractor is knocked back to PROBATION by its very next failure."
