          setup:
            - "Alpha National Bank is LIVE with a prefunded position account of 1,200,000,000 cents."
            - "At 10:00 a PARTICIPANT-scoped FULL_OUTAGE with fallback_rail FALLBACK_ACH is declared for Alpha, driving its operational_posture to OFFLINE."
            - "At 12:00 the outage is resolved with ended_at 2026-08-03T12:00:00Z, which restores the posture and starts the 15-minute stabilization reservation running to 12:15."
            - "The clock is 2026-08-03T12:10:00Z when the second declaration is attempted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
