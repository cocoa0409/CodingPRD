  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: rvu_total_equals_sum_of_credited_after_addendum
        grounds:
          - calculations.rvu_credit
          - state_machines.RadiologyReport.FINAL_to_AMENDED
          - entities.Staff.fields.signed_rvu_total
        distinguishing_aspect: |
          Conserved quantity: Staff.signed_rvu_total == SUM over the radiologist's signed reports of
          their current rvu_credited. The addendum re-sign applies the DELTA (new - prior) so the
          invariant holds with zero drift: after first sign-off total == 3.75 == report.rvu_credited;
          after addendum total == 1.88 == report.rvu_credited.
        test_recipe:
          setup:
            - "Reuse rvu_first_signoff_vs_addendum_resign: MRI STAT contrast order signed (rvu 3.75) then addendum re-signed (rvu 1.88)."
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C", repeat_rate_threshold_pct: 8.0 }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
