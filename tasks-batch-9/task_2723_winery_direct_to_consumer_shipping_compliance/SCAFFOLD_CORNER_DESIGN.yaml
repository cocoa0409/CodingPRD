          setup:
            - "The WY rule allows DTC with a 27.000 L per-consumer limit but only a 9.000 L per-winery annual limit; it charges 55 c/L excise and 825 bps tax and requires a carrier program."
            - "Estate 1 (120000 gallons) holds an ACTIVE WY permit and an APPROVED enrollment on a GSO program serving WY. Consumer Ada lives at 82001 and is ID-verified. Clock 2026-08-01."
            - "Orders A and B are each 6 x 750 ml at 4200 c (4.500 L, 211 c excise) and both were screened and CLEARED, so the winery's 2026 WY aggregate is exactly 9.000 L."
