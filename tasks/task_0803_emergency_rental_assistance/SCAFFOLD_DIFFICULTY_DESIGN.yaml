  # =================================================================
  # Rule 9 — Compensating-action invariants across different quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: funding_pool_conserved_across_disburse_and_recapture
        grounds:
          - state_machines.Disbursement.CLEARED_to_RECAPTURED
          - entities.Program.fields.funding_pool_remaining_cents
          - entities.Program.fields.funding_pool_total_cents
        distinguishing_aspect: |
          Conserved quantity = funding dollars. Invariant:
          funding_pool_remaining_cents == funding_pool_total_cents -
          SUM(Disbursement.amount_cents WHERE status IN {PENDING,SENT,CLEARED}).
          Reserve (disburse, 100000000 -> 99000000) and its compensator (recapture,
          -> 100000000) net to zero drift.
        test_recipe:
          setup:
            - "Application DISBURSED (1000000 CLEARED); RecaptureCase SUBSTANTIATED; funding total 100000000, remaining 99000000 before recovery"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
