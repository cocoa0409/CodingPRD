          - "validations[priority=24]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "The denying reviewer u-ur-1 cannot resolve their own peer review (403 ERR_SEGREGATION_OF_DUTIES); an independent peer u-peer-1 can, and an OVERTURN moves the parent referral from PENDING_UR to AUTHORIZED."
        test_recipe:
          setup:
            - "A ROUTINE referral in PENDING_UR whose UtilizationReview was DENIED by u-ur-1 at 2026-05-01T00:00:00Z and escalated to PEER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
