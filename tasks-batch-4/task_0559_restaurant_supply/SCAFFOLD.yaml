    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: ["limit?", "offset?"]
    output: "TaxExemptCertificate[]"
    side_effects: []

  - method: GET
    path: "/tax-certificates/{cert_id}"
    description: "Get a certificate"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: []
    output: TaxExemptCertificate
    side_effects: []

  - method: GET
    path: "/tax-certificates"
    description: "List certificates filtered by account (reverse-reachability for TaxExemptCertificate.account_id)"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: "TaxExemptCertificate[]"
    side_effects: []

  - method: POST
    path: "/tax-certificates/{cert_id}/approve"
    description: "Approve a submitted certificate"
    roles: [AccountManager]
    code: 200
    input: []
    output: TaxExemptCertificate
    side_effects: ["status → APPROVED", "Account.tax_exempt_status → CERTIFIED", "Account.version += 1"]

  - method: POST
    path: "/tax-certificates/{cert_id}/reject"
    description: "Reject a submitted certificate"
    roles: [AccountManager]
    code: 200
    input: []
    output: TaxExemptCertificate
    side_effects: ["status → REJECTED"]

  - method: POST
    path: "/tax-certificates/{cert_id}/resubmit"
    description: "Resubmit a rejected certificate (owner only)"
    roles: [Buyer]
    code: 200
    input: []
    output: TaxExemptCertificate
    side_effects: ["status → SUBMITTED"]

  # ---- Product ----
  - method: POST
    path: "/products"
    description: "Create a catalog product"
    roles: [WarehouseOps]
    code: 201
    input: [sku, name, category, "taxable?", unit_price_cents, case_qty, case_price_cents, pallet_case_qty, pallet_price_cents, weight_lbs_per_unit, fulfillment_type, freight_type, "lead_time_days?", on_hand_qty, par_level, reorder_point]
    output: Product
    side_effects: ["needs_reorder / reorder_suggested_qty computed from on_hand_qty"]

  - method: GET
    path: "/products"
    description: "List products"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: ["limit?", "offset?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/products/{product_id}"
    description: "Get a product (includes needs_reorder, reorder_suggested_qty)"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: POST
    path: "/products/{product_id}/restock"
    description: "Manually add stock to a product"
    roles: [WarehouseOps]
    code: 200
