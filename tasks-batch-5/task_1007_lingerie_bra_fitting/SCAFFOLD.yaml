  - { method: GET,  path: "/boutique/skus", description: "List SKUs (filter by product)", roles: [Customer, Fitter, StoreManager, BillingClerk], code: 200, input: ["product_id?", "limit?", "offset?"], output: "SKU[]", side_effects: [] }
  - { method: POST, path: "/boutique/skus/{id}/restock", description: "Add physical inventory units", roles: [StoreManager], code: 200, input: [quantity], output: SKU, side_effects: ["stock_on_hand += quantity", "available_units/stock_status recomputed"] }

