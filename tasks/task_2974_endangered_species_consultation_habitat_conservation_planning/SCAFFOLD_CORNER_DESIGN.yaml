          The single most consequential branch in the rule: FIELD_SURVEY plus
          NOT_DETECTED splits on survey_in_season. An in-season negative is ABSENT
          (and drops out of every downstream candidate set); the identical
          negative surveyed in September lands in PRESUMED_PRESENT and keeps the
          species in play. An implementation that maps NOT_DETECTED straight to
          ABSENT passes the first assert and inverts the second.
