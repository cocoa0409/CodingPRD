        distinguishing_aspect: |
          Metric: moves-per-hour ratio at the contracted target, reached via the
          gang-order complete endpoint (distinct metric and endpoint from the OT
          instance). actual_mph == 25.0 == contracted_mph_target qualifies (>=), yet
          excess_moves is 0 so bonus_pool_cents is 0 — eligibility without payout.
        test_recipe:
          setup:
