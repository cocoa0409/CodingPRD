              payload: { findings_underpayment_cents: 19999, audit_cost_cents: 90000 }
              as: Auditor
          assert:
            - "Audit.${au1}.cost_bearer == FIRM: 20000/400000 == exactly 0.05 and the comparison is >= (exact rational: 20000*100 >= 400000*5)"
            - "Audit.${au2}.cost_bearer == ARTIST: 19999/400000 < 0.05 and 19999 < 2500000 floor"
            - "Both statements pinned net_payable_cents == 400000 (533334 - 133334); the ratio uses the PINNED value"

      - name: option_exercise_window_inclusive_bounds
        grounds:
          - calculations.option_window_check
          - state_machines.Option.OPEN_to_EXERCISED
        distinguishing_aspect: |
          Metric: time-window bounds on POST /options/{id}/exercise (vs money and
          ratio in the sibling instances). The upper bound is INCLUSIVE: exercise
          at clock == exercise_window_end succeeds (the lapse sweep only fires when
          clock > window_end). Exercising before exercise_window_start leaves the
          option OPEN and fails with ERR_OPTION_WINDOW_VIOLATION.
        test_recipe:
          setup:
            - "Artist + ACTIVE agreement; Agent"
            - "Option O_IN: window [2026-07-01T00:00:00Z, 2026-09-01T00:00:00Z], engagement window 2027-03-01T20:00:00Z..2027-03-01T23:00:00Z"
            - "Option O_OUT: window [2026-09-15T00:00:00Z, 2026-10-15T00:00:00Z] - still BEFORE its start at the test clock, so it stays OPEN"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Bound Act", legal_name: "Bound Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Bo", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /options"
              payload: { artist_id: "${a_id}", agreement_id: "${agr_id}", option_type: "TOUR_LEG", income_type: "TOURING", exercise_window_start: "2026-07-01T00:00:00Z", exercise_window_end: "2026-09-01T00:00:00Z", engagement_start_datetime: "2027-03-01T20:00:00Z", engagement_end_datetime: "2027-03-01T23:00:00Z", exercise_value_cents: 500000 }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { opt_in: $.data.id }
            - call: "POST /options"
              payload: { artist_id: "${a_id}", agreement_id: "${agr_id}", option_type: "RECORDING_CYCLE", income_type: "RECORDING", exercise_window_start: "2026-09-15T00:00:00Z", exercise_window_end: "2026-10-15T00:00:00Z", engagement_start_datetime: "2027-04-01T10:00:00Z", engagement_end_datetime: "2027-04-01T18:00:00Z", exercise_value_cents: 600000 }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { opt_out: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /options/${opt_in}/exercise"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
            - call: "POST /options/${opt_out}/exercise"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { err: $.data.error_id }
          assert:
            - "Option.${opt_in}: EXERCISED at clock == exercise_window_end exactly (inclusive upper bound); its Engagement is CONFIRMED"
            - "Option.${opt_out}: exercise attempted before exercise_window_start (clock 2026-09-01 < 2026-09-15) fails with error_id == ERR_OPTION_WINDOW_VIOLATION (http 409) and the option remains OPEN (the sweep only lapses options PAST their window end, never before their start)"

  # ---------------------------------------------------------------------------
  # Rule 7 - cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: income_verify_gated_on_agreement_posture
        grounds:
          - state_machines.IncomeEvent.REPORTED_to_VERIFIED
          - entities.IncomeEvent.fields.agreement_id
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair IncomeEvent -> Agreement: verify is gated on the RESOLVED
          agreement's posture (commissionable set {ACTIVE, SUPERSEDED, TERMINATED,
          EXPIRED, SUNSET}); while the covering agreement is DRAFT the same call
          fails with ERR_AGREEMENT_NOT_ACTIVE, and it succeeds once activated.
        test_recipe:
          setup:
            - "Artist with a DRAFT agreement (term 2026-01-01..2027-12-31) and a TOURING 1500bps schedule"
            - "Income event gross 200000 recognized 2026-03-10 REPORTED (agreement_id resolved to the DRAFT agreement at create)"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Gate Act", legal_name: "Gate Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Ga", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "BUSINESS_MANAGER", display_name: "BM Ga", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_bm: $.data.id }
            - call: "POST /income-events"
              payload: { artist_id: "${a_id}", income_type: "TOURING", gross_amount_cents: 200000, recognition_date: "2026-03-10", source_name: "Promoter Ga" }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /income-events/${ev1}/verify"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_bm}"
              captures: { err: $.data.error_id }
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /income-events/${ev1}/verify"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_bm}"
          assert:
            - "First verify fails with error_id == ERR_AGREEMENT_NOT_ACTIVE (http 409): the covering agreement is DRAFT"
            - "IncomeEvent.${ev1} remains REPORTED with commission_amount_cents null"
            - "After activation the identical verify succeeds: status VERIFIED, term_relation == IN_TERM, applied_rate_bps == 1500, commission_amount_cents == 30000"

      - name: option_exercise_gated_on_agreement_active
        grounds:
          - state_machines.Option.OPEN_to_EXERCISED
          - entities.Option.fields.agreement_id
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair Option -> Agreement (a different pair than the sibling instance):
          options cannot be exercised post-term - the option's agreement must be
          ACTIVE, so after early termination the in-window exercise fails with
          ERR_AGREEMENT_NOT_ACTIVE even though the option is OPEN and in-window.
        test_recipe:
          setup:
            - "Artist + agreement ACTIVATED then TERMINATED with termination_date 2026-06-15 (sunset window opens but options are dead)"
            - "Option created while ACTIVE: window [2026-07-01, 2026-09-01] contains the default clock 2026-08-01"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Term Act", legal_name: "Term Act LLC", primary_genre: "rock" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Te", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /options"
              payload: { artist_id: "${a_id}", agreement_id: "${agr_id}", option_type: "TOUR_LEG", income_type: "TOURING", exercise_window_start: "2026-07-01T00:00:00Z", exercise_window_end: "2026-09-01T00:00:00Z", engagement_start_datetime: "2027-03-01T20:00:00Z", engagement_end_datetime: "2027-03-01T23:00:00Z", exercise_value_cents: 500000 }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { opt: $.data.id }
            - call: "POST /agreements/${agr_id}/terminate"
              payload: { termination_date: "2026-06-15" }
              as: FirmAdmin
          trigger:
            - call: "POST /options/${opt}/exercise"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { err: $.data.error_id }
          assert:
            - "Exercise fails with error_id == ERR_AGREEMENT_NOT_ACTIVE (http 409): the option's agreement is TERMINATED"
            - "Option.${opt}.status == OPEN (unchanged); no Engagement is created"
            - "The option's own window is valid at the clock, isolating the cross-entity gate as the failure cause"

      - name: engagement_confirm_gated_on_opportunity_accepted
        grounds:
          - state_machines.Engagement.HOLD_to_CONFIRMED
          - entities.Engagement.fields.opportunity_id
          - errors[ERR_OPPORTUNITY_NOT_ACCEPTED]
        distinguishing_aspect: |
          Pair Engagement -> Opportunity (distinct from the two Agreement pairs):
          a hold linked to an opportunity still in NEGOTIATING cannot be
          confirmed - the opportunity must first reach ACCEPTED/CONVERTED.
        test_recipe:
          setup:
            - "Artist + ACTIVE agreement; Agent; opportunity O in NEGOTIATING (evaluated, negotiate called)"
            - "HOLD engagement H linked to O via opportunity_id; window 2026-09-10T18:00:00Z..2026-09-10T23:00:00Z (future at default clock), buffer 0"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Link Act", legal_name: "Link Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Li", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /opportunities"
              payload: { artist_id: "${a_id}", income_type: "TOURING", counterparty_name: "FestLi", proposed_value_cents: 5000000, offer_expiry_date: "2026-12-31", proposed_window_start: "2026-09-10T18:00:00Z", proposed_window_end: "2026-09-10T23:00:00Z", fit_score: 60 }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { opp: $.data.id }
            - call: "POST /opportunities/${opp}/evaluate"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
            - call: "POST /opportunities/${opp}/negotiate"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
            - call: "POST /engagements"
              payload: { artist_id: "${a_id}", income_type: "TOURING", counterparty_name: "FestLi", start_datetime: "2026-09-10T18:00:00Z", end_datetime: "2026-09-10T23:00:00Z", guarantee_cents: 5000000, travel_buffer_hours: 0, opportunity_id: "${opp}" }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { eng_h: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_h}/confirm"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { err: $.data.error_id }
          assert:
            - "Confirm fails with error_id == ERR_OPPORTUNITY_NOT_ACCEPTED (http 409): linked opportunity is NEGOTIATING, not ACCEPTED/CONVERTED"
            - "Engagement.${eng_h}.status == HOLD (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 8 - resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_schedule_half_open_adjacency
        grounds:
          - calculations.rate_schedule_overlap_detection
          - errors[ERR_RATE_SCHEDULE_OVERLAP]
        distinguishing_aspect: |
          Resource CommissionRateSchedule, HALF-OPEN semantics: windows
          [from, to) may touch - a successor starting exactly at the predecessor's
          effective_to_date is legal - while a one-day-early start is rejected.
        test_recipe:
          setup:
            - "Artist + ACTIVE agreement"
            - "S1 TOURING [2026-01-01, 2026-07-01) created with explicit effective_to_date"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Rate Act", legal_name: "Rate Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01", effective_to_date: "2026-07-01" }
              as: FirmAdmin
              captures: { rs1: $.data.id }
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
          trigger:
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1600, sunset_rate_bps: 800, sunset_months: 12, effective_from_date: "2026-07-01" }
              as: FirmAdmin
              captures: { rs2: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1700, sunset_rate_bps: 850, sunset_months: 12, effective_from_date: "2026-06-15" }
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "S2 (effective_from_date == S1.effective_to_date == 2026-07-01) is CREATED: half-open adjacency is allowed"
            - "S3 (effective_from_date 2026-06-15) fails with error_id == ERR_RATE_SCHEDULE_OVERLAP (http 409): it intersects S1 by 16 days"

      - name: engagement_buffered_window_strict_touch
        grounds:
          - calculations.engagement_overlap_detection
          - errors[ERR_ENGAGEMENT_OVERLAP]
        distinguishing_aspect: |
          Resource Engagement, BUFFERED CLOSED-interval semantics (different from
          the half-open schedule arithmetic): each window expands by
          travel_buffer_hours on BOTH sides and comparison is strict, so a
          successor starting exactly at the buffered edge is legal while one hour
          earlier conflicts.
        test_recipe:
          setup:
            - "Artist + ACTIVE agreement; Agent"
            - "E1 CONFIRMED 2026-09-10T18:00:00Z..2026-09-10T23:00:00Z buffer 24h -> effective [2026-09-09T18:00, 2026-09-11T23:00]"
            - "E2 HOLD starting exactly 2026-09-11T23:00:00Z buffer 0 (touches the buffered edge)"
            - "E3 HOLD starting 2026-09-11T22:00:00Z buffer 0 (one hour inside the buffer)"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Edge Act", legal_name: "Edge Act LLC", primary_genre: "rock" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Ed", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /engagements"
              payload: { artist_id: "${a_id}", income_type: "TOURING", counterparty_name: "Venue A", start_datetime: "2026-09-10T18:00:00Z", end_datetime: "2026-09-10T23:00:00Z", guarantee_cents: 100000, travel_buffer_hours: 24 }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { eng1: $.data.id }
            - call: "POST /engagements/${eng1}/confirm"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
            - call: "POST /engagements"
              payload: { artist_id: "${a_id}", income_type: "TOURING", counterparty_name: "Venue B", start_datetime: "2026-09-11T23:00:00Z", end_datetime: "2026-09-12T02:00:00Z", guarantee_cents: 100000, travel_buffer_hours: 0 }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { eng2: $.data.id }
            - call: "POST /engagements"
              payload: { artist_id: "${a_id}", income_type: "TOURING", counterparty_name: "Venue C", start_datetime: "2026-09-11T22:00:00Z", end_datetime: "2026-09-12T01:00:00Z", guarantee_cents: 100000, travel_buffer_hours: 0 }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { eng3: $.data.id }
          trigger:
            - call: "POST /engagements/${eng2}/confirm"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
            - call: "POST /engagements/${eng3}/confirm"
              payload: {}
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { err: $.data.error_id }
          assert:
            - "E2 confirms successfully: its effective start 2026-09-11T23:00:00Z merely TOUCHES E1's effective end (strict < comparison)"
            - "E3 confirm fails with error_id == ERR_ENGAGEMENT_OVERLAP (http 409): 2026-09-11T22:00:00Z < 2026-09-11T23:00:00Z"
            - "E1 stays CONFIRMED; E2 becomes CONFIRMED; E3 stays HOLD"

      - name: statement_period_closed_interval_no_touch
        grounds:
          - calculations.statement_period_overlap_detection
          - errors[ERR_STATEMENT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource Statement, CLOSED-interval semantics (third distinct
          arithmetic): P.start == S.end IS an overlap (both endpoints inclusive),
          so the tightest legal successor starts at S.end + 1 day - unlike the
          rate-schedule case where touching is allowed.
        test_recipe:
          setup:
            - "Artist + ACTIVE agreement (TOURING 1500bps); BM"
            - "P1 statement [2026-01-01, 2026-03-31] generated and ISSUED (empty period: totals all zero)"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Per Act", legal_name: "Per Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "BUSINESS_MANAGER", display_name: "BM Pe", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_bm: $.data.id }
            - call: "POST /statements/generate"
              payload: { artist_id: "${a_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", basis: "ACCRUAL" }
              as: BusinessManager
              as_user_id: "${tm_bm}"
              captures: { st1: $.data.id }
            - call: "POST /statements/${st1}/issue"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_bm}"
          trigger:
            - call: "POST /statements/generate"
              payload: { artist_id: "${a_id}", period_start_date: "2026-03-31", period_end_date: "2026-06-30", basis: "ACCRUAL" }
              as: BusinessManager
              as_user_id: "${tm_bm}"
              captures: { err: $.data.error_id }
            - call: "POST /statements/generate"
              payload: { artist_id: "${a_id}", period_start_date: "2026-04-01", period_end_date: "2026-06-30", basis: "ACCRUAL" }
              as: BusinessManager
              as_user_id: "${tm_bm}"
              captures: { st2: $.data.id }
          assert:
            - "Generate [2026-03-31, 2026-06-30] fails with error_id == ERR_STATEMENT_PERIOD_OVERLAP (http 409): closed intervals share 2026-03-31"
            - "Generate [2026-04-01, 2026-06-30] succeeds (S.end + 1 day is the tightest legal start): Statement.${st2}.carry_in_cents == 0 and prior_statement_id == ${st1}"

  # ---------------------------------------------------------------------------
  # Rule 9 - compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: advance_principal_partition_invariant
        grounds:
          - calculations.advance_recoupment_waterfall
          - state_machines.Advance.ACTIVE_to_WRITTEN_OFF
          - entities.Advance.fields.outstanding_cents
        distinguishing_aspect: |
          Conserved quantity: the advance principal partition
          principal_cents == recouped_cents + outstanding_cents + written_off_cents.
          A forward action (settle recoupment 80000) followed by a compensating
          write-off of the remainder preserves the partition exactly (100000 ==
          80000 + 0 + 20000) with no drift.
        test_recipe:
          setup:
            - "Artist + ACTIVE FIFO agreement (TOURING 1500bps); advance 100000 @100% cross-collateralized"
            - "Event gross 94118 VERIFIED (commission 14118; cash share on full receipt 80000)"
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Part Act", legal_name: "Part Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}", recoupment_policy: "FIFO" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Pa", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "BUSINESS_MANAGER", display_name: "BM Pa", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_bm: $.data.id }
            - call: "POST /advances"
              payload: { artist_id: "${a_id}", principal_cents: 100000, issued_date: "2026-01-05", recoup_pct_bps: 10000 }
              as: BusinessManager
              as_user_id: "${tm_bm}"
              captures: { adv1: $.data.id }
            - call: "POST /income-events"
              payload: { artist_id: "${a_id}", income_type: "TOURING", gross_amount_cents: 94118, recognition_date: "2026-03-10", source_name: "Promoter Pa" }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { ev1: $.data.id }
            - call: "POST /income-events/${ev1}/verify"
              payload: {}
              as: BusinessManager
              as_user_id: "${tm_bm}"
          trigger:
            - call: "POST /income-events/${ev1}/settle"
              payload: { received_date: "2026-03-12", received_amount_cents: 94118 }
              as: BusinessManager
              as_user_id: "${tm_bm}"
            - call: "POST /advances/${adv1}/write-off"
              payload: {}
              as: FirmAdmin
          assert:
            - "After settle: Advance.${adv1} has recouped_cents == 80000, outstanding_cents == 20000, written_off_cents == 0 -> 80000 + 20000 + 0 == 100000 == principal_cents"
            - "After write-off: recouped_cents == 80000, outstanding_cents == 0, written_off_cents == 20000, status == WRITTEN_OFF -> 80000 + 0 + 20000 == 100000 == principal_cents (no drift from the forward+compensating pair)"
            - "Artist.${a_id}.unrecouped_advance_balance_cents == 0 after the write-off"

      - name: statement_disburse_carry_conservation
        grounds:
          - calculations.statement_generation
          - state_machines.Statement
          - entities.Statement.fields.disbursed_cents
        distinguishing_aspect: |
          Conserved quantity: per-statement money flow
          disbursed_cents + carry_out_cents == net_payable_cents, which must hold
          on the DRAFT, after issue, and after disbursement - the disburse action
          moves money to the artist without disturbing the conservation.
        test_recipe:
