  # ===========================================================================
  # RULE 5 — All four declared priority-pair validation conflicts (§1.4 A–D)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: conflict_a_order_not_compliance_cleared_masks_sailing_capacity_exceeded
        grounds:
          - validations[priority=12]
          - validations[priority=31]
          - calculations.sailing_capacity_ledger
          - entities.ExportControlScreening.fields.status
        distinguishing_aspect: |
          Conflict A: one POST /freight-bookings violates BOTH the priority-12 cross-entity
          state precondition (the order's screening is still INITIATED, not CLEARED) AND the
          priority-31 fiscal capacity bound (600.000 already booked + 500.000 requested =
          1100.000 > capacity 1000.000), and the response must be
          ERR_ORDER_NOT_COMPLIANCE_CLEARED with HTTP 409, never ERR_SAILING_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "ForeignBuyer (JP, BBB, NONE, not restricted); the same buyer owns both orders."
            - "Order B (the capacity consumer): FOB / ZONE_1, one line 60.000 @ 100.0000 with gross_weight_kg 600.000, screened NLR so it is COMPLIANCE_CLEARED, then booked LCL 600.000 kg on the sailing, which becomes booked_weight_kg 600.000 / status OPEN and the order BOOKED."
            - "Order A (the request subject): FOB / ZONE_1, one line 50.000 @ 100.0000 with gross_weight_kg 500.000, submitted for compliance so fulfillment_status is COMPLIANCE_PENDING and its ExportControlScreening is still INITIATED with license_determination null (so priority 16 passes and only priorities 12 and 31 are violated)."
            - "VesselSailing S1 with capacity_weight_kg exactly 1000.000, cutoff_at 2026-08-15 (the clock stays at 2026-08-01 so priority 23 passes)."
            - "The booking request for order A is the only call in the trigger; because the created row is the FreightBooking, the ExportOrder's readiness is checked by priority 12, not by priority 11."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Nagoya Bearing Import", country_code: "JP", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { buyer_id: "$.data.id" }
            - call: "POST /vessel-sailings"
              payload: { carrier_scac: "MAEU", vessel_name: "Han River", voyage_no: "H801", port_of_loading: "KRPUS", port_of_discharge: "JPTYO", destination_zone: "ZONE_1", cutoff_at: "2026-08-15T00:00:00Z", etd: "2026-08-17T00:00:00Z", eta: "2026-08-30T00:00:00Z", capacity_weight_kg: 1000.000, tariff_rate_per_1000kg_usd: 300.00 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { sailing_id: "$.data.id", sailing_v1: "$.data.version" }
            - call: "POST /export-orders"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "FOB Busan", origin_country_code: "KR", destination_country_code: "JP", destination_zone: "ZONE_1", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_b_id: "$.data.id" }
            - call: "POST /export-orders/${order_b_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "Roller bearings", hs_code: "848250", quantity: 60.000, uom: "EA", unit_price_usd: 100.0000, line_discount_pct: 0, net_weight_kg: 550.000, gross_weight_kg: 600.000, package_count: 6 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /export-orders/${order_b_id}/submit-for-compliance"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "GET /export-control-screenings"
              payload: { export_order_id: "${order_b_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { screening_b_id: "$.data[0].id" }
            - call: "POST /export-control-screenings/${screening_b_id}/decision"
              payload: { license_determination: "NLR", eccn: "3A001", denied_party_hits: 0 }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
            - call: "POST /freight-bookings"
              payload: { export_order_id: "${order_b_id}", vessel_sailing_id: "${sailing_id}", booked_weight_kg: 600.000, container_type: "LCL", expected_vessel_sailing_version: "${sailing_v1}" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { booking_b_id: "$.data.id" }
            - call: "POST /export-orders"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "FOB Busan", origin_country_code: "KR", destination_country_code: "JP", destination_zone: "ZONE_1", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_a_id: "$.data.id" }
            - call: "POST /export-orders/${order_a_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "Bearing housings", hs_code: "848330", quantity: 50.000, uom: "EA", unit_price_usd: 100.0000, line_discount_pct: 0, net_weight_kg: 450.000, gross_weight_kg: 500.000, package_count: 5 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /export-orders/${order_a_id}/submit-for-compliance"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "GET /vessel-sailings/${sailing_id}"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { sailing_v2: "$.data.version" }
          trigger:
            - call: "POST /freight-bookings"
              payload: { export_order_id: "${order_a_id}", vessel_sailing_id: "${sailing_id}", booked_weight_kg: 500.000, container_type: "LCL", expected_vessel_sailing_version: "${sailing_v2}" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "HTTP status is 409"
            - "error_id == ERR_ORDER_NOT_COMPLIANCE_CLEARED (priority 12 wins)"
            - "error_id != ERR_SAILING_CAPACITY_EXCEEDED (priority 31 is never evaluated)"
            - "VesselSailing.${sailing_id}.booked_weight_kg == 600.000 and VesselSailing.${sailing_id}.status == OPEN (no partial write)"
            - "no FreightBooking row exists with export_order_id ${order_a_id}"
            - "ExportOrder.${order_a_id}.fulfillment_status == COMPLIANCE_PENDING"

      - name: conflict_b_stale_lc_version_412_masks_restricted_party_blocked
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - concurrency_rules[lc-review-stale-credit]
          - entities.ForeignBuyer.fields.restricted_party_flag
        distinguishing_aspect: |
          Conflict B: one POST /letters-of-credit/{lc_id}/reviews carries a stale
          expected_letter_of_credit_version AND targets a buyer whose restricted_party_flag
          was just set true, and the response must be ERR_STALE_LC_VERSION with HTTP 412 —
          the 409 ERR_RESTRICTED_PARTY_BLOCKED of priority 14 is never reached, so the OCC
          check strictly precedes the compliance check.
        test_recipe:
          setup:
            - "ForeignBuyer created with restricted_party_flag false so the order, its clearance and the credit capture all succeed."
            - "ExportOrder FOB / ZONE_1 / USD with one line 100.000 @ 250.0000; submitted and screened NLR so it is COMPLIANCE_CLEARED."
            - "LetterOfCredit LC-2195-007 captured by ops_1 (26000.00, tolerance 5.00, SIGHT, expiry 2026-10-15); its version is captured at creation and is NOT bumped afterwards, so version - 1 is a genuinely stale value."
            - "PATCH /foreign-buyers/{buyer_id}/restricted-party-flag then sets the flag true; with no FreightBooking the cascade only moves the order COMPLIANCE_CLEARED -> COMPLIANCE_BLOCKED and re-opens its screening, and it does not touch LetterOfCredit.version."
            - "The clock stays at 2026-08-01, strictly before expiry_date, so priority 19 passes and the only two violated rules are 13 and 14."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Kobe Precision Trading", country_code: "JP", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "FOB Busan", origin_country_code: "KR", destination_country_code: "JP", destination_zone: "ZONE_1", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "Stainless couplings", hs_code: "732290", quantity: 100.000, uom: "EA", unit_price_usd: 250.0000, line_discount_pct: 0, net_weight_kg: 900.000, gross_weight_kg: 1000.000, package_count: 10 }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "POST /export-orders/${order_id}/submit-for-compliance"
              payload: {}
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
            - call: "GET /export-control-screenings"
              payload: { export_order_id: "${order_id}" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
              captures: { screening_id: "$.data[0].id" }
            - call: "POST /export-control-screenings/${screening_id}/decision"
              payload: { license_determination: "NLR", eccn: "3A001", denied_party_hits: 0 }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
            - call: "POST /letters-of-credit"
              payload: { export_order_id: "${order_id}", lc_number: "LC-2195-007", issuing_bank_swift: "SMBCJPJT", amount_usd: 26000.00, tolerance_pct: 5.00, availability: "SIGHT", usance_days: 0, expiry_date: "2026-10-15T00:00:00Z", latest_shipment_date: "2026-09-30T00:00:00Z", presentation_period_days: 21, partial_shipment_allowed: false, transshipment_allowed: false, required_document_types: ["COMMERCIAL_INVOICE", "BILL_OF_LADING"] }
              as: ExportOpsCoordinator
              as_user_id: "ops_1"
              captures: { lc_id: "$.data.id", lc_v: "$.data.version" }
            - call: "PATCH /foreign-buyers/${buyer_id}/restricted-party-flag"
              payload: { restricted_party_flag: true, restricted_party_reason: "Denied party list hit published after the credit was captured" }
              as: TradeComplianceOfficer
              as_user_id: "tco_1"
          trigger:
            - call: "POST /letters-of-credit/${lc_id}/reviews"
              payload: { expected_letter_of_credit_version: "${lc_v} - 1" }
              as: DocumentaryCreditReviewer
              as_user_id: "rev_1"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "HTTP status is 412"
            - "error_id == ERR_STALE_LC_VERSION (priority 13 wins)"
            - "error_id != ERR_RESTRICTED_PARTY_BLOCKED (priority 14 is never evaluated)"
            - "no LCTermsReview row exists for LetterOfCredit ${lc_id}"
            - "LetterOfCredit.${lc_id}.status == RECEIVED and LetterOfCredit.${lc_id}.version is unchanged"
            - "ExportOrder.${order_id}.fulfillment_status == COMPLIANCE_BLOCKED and ExportOrder.${order_id}.settlement_status == UNSECURED"

