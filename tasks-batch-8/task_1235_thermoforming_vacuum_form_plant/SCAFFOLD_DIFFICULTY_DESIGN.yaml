            - { call: "POST /tools/${tool_i}/approve-production", payload: { production_cost: 8000.00, rated_lifetime_shots: 80000 }, as: ToolingEngineer }
            - { call: "POST /tools", payload: { tool_code: "TF", part_number: "P-F8", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: FOOD, prototype_cost: 1500.00 }, as: ToolingEngineer, captures: { tool_f: $.data.id } }
