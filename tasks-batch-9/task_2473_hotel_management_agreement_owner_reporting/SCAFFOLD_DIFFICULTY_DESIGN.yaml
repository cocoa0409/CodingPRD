scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: incentive_provisional_monthly_versus_final_annual_true_up
        grounds:
          - calculations.agop_and_provisional_incentive
          - calculations.annual_incentive_true_up
          - entities.FeeAccrual.fields.variant
          - entities.FeeAccrual.fields.amount_cents
          - state_machines.FeeAccrual.ACCRUED_to_INVOICED
        distinguishing_aspect: |
          Lives in the fee-ledger domain (FeeAccrual): the PROVISIONAL monthly variant floors each
          month at zero and charges the owner priority as a rounded twelfth, while the FINAL annual
          variant applies the whole unrounded annual priority across a two-rate bracket, so the same
          single accepted period yields 2171253 provisionally and 1356879 finally — a negative
          -814374 true-up delta the monthly variant cannot express.
        test_recipe:
          setup:
            - "One ManagementAgreement ACTIVE with base_fee_pct 0.0325, incentive_fee_pct 0.10, incentive_tier2_pct 0.15, incentive_tier2_threshold_cents 5000000 and owner_priority_cents 12000000."
            - "Its FY2026 OperatingBudget is APPROVED."
            - "One MonthlyReportPackage for (2026, 9) with gross_revenue_cents 55000025, one RESERVATIONS chargeback of 500000, financial_status ACCEPTED, agop_cents 22712525 and an INCENTIVE/PROVISIONAL FeeAccrual of 2171253 in status INVOICED."
            - "Logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Harborline Grand", owner_entity_name: "Pier 9 Hotel Owner LLC", base_fee_pct: 0.0325, incentive_fee_pct: 0.10, incentive_tier2_pct: 0.15, incentive_tier2_threshold_cents: 5000000, owner_priority_cents: 12000000, ffe_reserve_pct: 0.04, centralized_services_cap_pct: 0.015, working_capital_floor_cents: 500000, initial_working_capital_cents: 1000000, owner_review_window_days: 30, max_revision_rounds: 1, manager_indemnity_cap_cents: 2000000, min_benchmark_months: 2, test_periods_expected: 3, max_dispute_rounds: 1 }
              as: PlatformAdmin
              captures: { agr: $.data.id }
            - call: "POST /hotel-management/agreements/${agr}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { agr_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 600000000, budgeted_operating_expenses_cents: 400000000, budgeted_capital_ffe_cents: 20000000, budgeted_capital_brand_cents: 10000000, expected_agreement_version: "${agr_v2}" }
              as: HotelManagerOps
              captures: { bud: $.data.id }
            - call: "POST /hotel-management/budgets/${bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${agr}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 40000015, fnb_revenue_cents: 12000005, other_revenue_cents: 3000005, operating_expenses_cents: 30000000, closing_cash_available_cents: 6000000 }
              as: HotelManagerOps
              captures: { pkg: $.data.id }
            - call: "POST /hotel-management/report-packages/${pkg}/centralized-charges"
              payload: { service_code: "RESERVATIONS", allocation_basis: "GROSS_REVENUE", pool_amount_cents: 10000000, hotel_basis_share: 0.05 }
              as: HotelManagerOps
              captures: { chg: $.data.id }
            - call: "POST /hotel-management/report-packages/${pkg}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${pkg}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "GET /hotel-management/agreements/${agr}"
              payload: {}
              as: HotelManagerOps
              captures: { agr_v_fresh: $.data.version }
          trigger:
            - call: "POST /hotel-management/agreements/${agr}/annual-true-up"
              payload: { fiscal_year: 2026, expected_agreement_version: "${agr_v_fresh}" }
              as: HotelManagerOps
              captures: { tu_accrual: $.data.true_up_accrual_id, tu_final: $.data.final_incentive_fee_cents, tu_delta: $.data.true_up_delta_cents }
          assert:
            - "MonthlyReportPackage.${pkg}.agop_cents == 22712525"
            - "MonthlyReportPackage.${pkg}.incentive_fee_provisional_cents == 2171253 (PROVISIONAL variant: owner priority entered as round_half_up(12000000/12) == 1000000 and only incentive_fee_pct 0.10 applied)"
            - "true-up response accepted_period_count == 1 and annual_agop_cents == 22712525"
            - "true-up response provisional_incentive_total_cents == 2171253"
            - "true-up response final_incentive_fee_cents == 1356879 (FINAL variant: excess 10712525 split as 5000000 @ 0.10 == 500000 plus 5712525 @ 0.15 == 856879)"
            - "true-up response true_up_delta_cents == -814374"
            - "FeeAccrual.${tu_accrual}.variant == FINAL and FeeAccrual.${tu_accrual}.fee_type == INCENTIVE"
            - "FeeAccrual.${tu_accrual}.amount_cents == -814374 and FeeAccrual.${tu_accrual}.status == ACCRUED"
            - "FeeAccrual.${tu_accrual}.report_package_id == ${pkg}"
            - "the PROVISIONAL accrual is left untouched: its amount_cents is still 2171253 and its status is still INVOICED"

      - name: rpi_rooms_weighted_versus_simple_average_decides_performance_test
        grounds:
          - calculations.performance_test_evaluation
          - entities.PerformanceTest.fields.rpi_weighted
          - entities.PerformanceTest.fields.rpi_simple_average
          - entities.MarketBenchmark.fields.rooms_available
          - state_machines.PerformanceTest.(creation)_to_PASSED
        distinguishing_aspect: |
          Lives in the market-share domain (MarketBenchmark / PerformanceTest), not the fee ledger:
          both indices consume the identical two benchmark rows (rpi 83.33 and 95.65, simple mean
          89.49) yet the rooms-weighted variant reads 92.47 and clears the 90.0 threshold, so the
          test is PASSED — an implementation scoring on the simple average would read 89.49 and fail
          the RPI leg.
        test_recipe:
          setup:
            - "One ManagementAgreement ACTIVE with base_fee_pct 0.03, gop_test_threshold_pct 0.85, rpi_test_threshold 90.0, min_benchmark_months 2, test_periods_expected 3, consecutive_failure_limit 2, owner_priority_cents 12000000."
            - "Its FY2026 OperatingBudget is APPROVED with budgeted_agop_cents 86500000."
            - "Two MonthlyReportPackage rows for (2026, 9) and (2026, 10) both with financial_status ACCEPTED and benchmark_status ACCEPTED, carrying agop_cents 20220000 and 20190000."
            - "Both benchmarks are source STR_REPORT: month 9 revpar 10000 against comp 12000 on 3000 rooms_available, month 10 revpar 11000 against comp 11500 on 9000 rooms_available."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Weighted Index Resort", owner_entity_name: "Comp Set Owner LP", base_fee_pct: 0.03, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, gop_test_threshold_pct: 0.85, rpi_test_threshold: 90.0, min_benchmark_months: 2, test_periods_expected: 3, consecutive_failure_limit: 2, working_capital_floor_cents: 0, initial_working_capital_cents: 0 }
              as: PlatformAdmin
              captures: { agrb: $.data.id }
            - call: "POST /hotel-management/agreements/${agrb}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { agrb_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${agrb}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 200000000, expected_agreement_version: "${agrb_v2}" }
              as: HotelManagerOps
              captures: { budb: $.data.id }
            - call: "POST /hotel-management/budgets/${budb}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${budb}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${agrb}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 20000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 5000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { pkgb9: $.data.id }
            - call: "POST /hotel-management/report-packages/${pkgb9}/benchmarks"
              payload: { hotel_revpar_cents: 10000, comp_set_revpar_cents: 12000, rooms_available: 3000, source: "STR_REPORT" }
              as: HotelManagerOps
              captures: { bmb9: $.data.id }
            - call: "POST /hotel-management/report-packages/${pkgb9}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${pkgb9}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/report-packages/${pkgb9}/owner-review"
              payload: { dimension: "BENCHMARK", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${agrb}/report-packages"
              payload: { fiscal_year: 2026, period_month: 10, rooms_revenue_cents: 21000000, fnb_revenue_cents: 5000000, other_revenue_cents: 1000000, operating_expenses_cents: 6000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { pkgb10: $.data.id }
            - call: "POST /hotel-management/report-packages/${pkgb10}/benchmarks"
              payload: { hotel_revpar_cents: 11000, comp_set_revpar_cents: 11500, rooms_available: 9000, source: "STR_REPORT" }
              as: HotelManagerOps
              captures: { bmb10: $.data.id }
            - call: "POST /hotel-management/report-packages/${pkgb10}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${pkgb10}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/report-packages/${pkgb10}/owner-review"
              payload: { dimension: "BENCHMARK", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
          trigger:
            - call: "POST /hotel-management/agreements/${agrb}/performance-tests"
              payload: { fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { ptest: $.data.id }
          assert:
            - "MarketBenchmark.${bmb9}.rpi == 83.33 and MarketBenchmark.${bmb10}.rpi == 95.65"
            - "PerformanceTest.${ptest}.str_month_count == 2 and accepted_period_count == 2"
            - "PerformanceTest.${ptest}.budgeted_agop_snapshot_cents == 86500000 and budget_source_status == APPROVED"
            - "PerformanceTest.${ptest}.prorated_budget_agop_cents == 57666667"
            - "PerformanceTest.${ptest}.actual_agop_cents == 40410000"
            - "PerformanceTest.${ptest}.gop_achievement_pct == 0.7009 (below the 0.85 threshold, so the AGOP leg fails)"
            - "PerformanceTest.${ptest}.rpi_weighted == 92.47"
            - "PerformanceTest.${ptest}.rpi_simple_average == 89.49"
            - "PerformanceTest.${ptest}.status == PASSED because the weighted index of 92.47 clears rpi_test_threshold 90.0 and both legs must fail"
            - "PerformanceTest.${ptest}.cure_payment_due_cents == 0 and cure_deadline_utc is null"
            - "ManagementAgreement.${agrb}.status == ACTIVE and performance_failure_streak == 0"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: base_fee_rounded_per_revenue_line_then_summed
        grounds:
          - calculations.base_management_fee_per_line
          - entities.MonthlyReportPackage.fields.base_fee_cents
          - entities.ManagementAgreement.fields.base_fee_pct
        distinguishing_aspect: |
          Per-element-then-aggregate composition: the fee is round_half_up'ed on each of the three
          revenue lines and only then summed, giving 1787500, whereas the mathematically tempting
          single rounding of the 55000025 total gives 1787501 — a one-cent divergence no
          reordering of the same three multiplications can reproduce.
        test_recipe:
          setup:
            - "One ManagementAgreement ACTIVE with base_fee_pct 0.0325 and an APPROVED FY2026 OperatingBudget."
            - "One MonthlyReportPackage for (2026, 9) with rooms 40000015, F&B 12000005 and other 3000005 revenue cents and no centralized chargebacks."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Three Line Rounding Inn", owner_entity_name: "Line Item Owner LLC", base_fee_pct: 0.0325, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, centralized_services_cap_pct: 0.015, working_capital_floor_cents: 500000, initial_working_capital_cents: 1000000 }
              as: PlatformAdmin
              captures: { agr2a: $.data.id }
            - call: "POST /hotel-management/agreements/${agr2a}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { agr2a_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${agr2a}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 600000000, budgeted_operating_expenses_cents: 400000000, expected_agreement_version: "${agr2a_v2}" }
              as: HotelManagerOps
              captures: { bud2a: $.data.id }
            - call: "POST /hotel-management/budgets/${bud2a}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${bud2a}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${agr2a}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 40000015, fnb_revenue_cents: 12000005, other_revenue_cents: 3000005, operating_expenses_cents: 30000000, closing_cash_available_cents: 6000000 }
              as: HotelManagerOps
              captures: { pkg2a: $.data.id }
          trigger:
            - call: "POST /hotel-management/report-packages/${pkg2a}/submit"
              payload: {}
              as: HotelManagerOps
          assert:
            - "MonthlyReportPackage.${pkg2a}.gross_revenue_cents == 55000025"
            - "MonthlyReportPackage.${pkg2a}.base_fee_cents == 1787500 (1300000 + 390000 + 97500)"
            - "MonthlyReportPackage.${pkg2a}.base_fee_cents != 1787501, the figure produced by rounding 55000025 * 0.0325 once"
            - "MonthlyReportPackage.${pkg2a}.allocated_centralized_cents == 0"
            - "MonthlyReportPackage.${pkg2a}.agop_cents == 23212525"
            - "MonthlyReportPackage.${pkg2a}.incentive_fee_provisional_cents == 2221253"
            - "the BASE/PROVISIONAL FeeAccrual created by the submit carries amount_cents == 1787500"

      - name: annual_incentive_two_tier_bracket_split_over_netted_agop
        grounds:
          - calculations.annual_incentive_true_up
          - entities.ManagementAgreement.fields.incentive_tier2_threshold_cents
          - entities.ManagementAgreement.fields.incentive_tier2_pct
          - validations[priority=41]
        distinguishing_aspect: |
          Bracket-decomposition composition: the annual excess of 7050025 is split at
          incentive_tier2_threshold_cents 5000000 and each bracket rounded on its own
          (500000 + 307504 == 807504); a single blended rate over the same excess gives 705003, and
          the excess itself only exists because the month-10 loss of -4162500 nets against the
          month-9 profit — an operation the monthly floor-at-zero variant cannot perform.
        test_recipe:
          setup:
            - "One ManagementAgreement ACTIVE with base_fee_pct 0.0325, incentive_fee_pct 0.10, incentive_tier2_pct 0.15, incentive_tier2_threshold_cents 5000000, owner_priority_cents 12000000."
            - "APPROVED FY2026 OperatingBudget."
            - "Two ACCEPTED MonthlyReportPackage rows: (2026, 9) with agop_cents 23212525 and (2026, 10) with agop_cents -4162500."
            - "The INCENTIVE/PROVISIONAL accruals total 2221253 because the loss month floors at 0."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Bracket Split Hotel", owner_entity_name: "Two Tier Owner LP", base_fee_pct: 0.0325, incentive_fee_pct: 0.10, incentive_tier2_pct: 0.15, incentive_tier2_threshold_cents: 5000000, owner_priority_cents: 12000000, working_capital_floor_cents: 0, initial_working_capital_cents: 0 }
              as: PlatformAdmin
              captures: { agr2b: $.data.id }
            - call: "POST /hotel-management/agreements/${agr2b}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { agr2b_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${agr2b}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 600000000, budgeted_operating_expenses_cents: 400000000, expected_agreement_version: "${agr2b_v2}" }
              as: HotelManagerOps
              captures: { bud2b: $.data.id }
            - call: "POST /hotel-management/budgets/${bud2b}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${bud2b}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${agr2b}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 40000015, fnb_revenue_cents: 12000005, other_revenue_cents: 3000005, operating_expenses_cents: 30000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { pkg2b9: $.data.id }
            - call: "POST /hotel-management/report-packages/${pkg2b9}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${pkg2b9}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${agr2b}/report-packages"
              payload: { fiscal_year: 2026, period_month: 10, rooms_revenue_cents: 4000000, fnb_revenue_cents: 1000000, other_revenue_cents: 0, operating_expenses_cents: 9000000, closing_cash_available_cents: 0 }
              as: HotelManagerOps
              captures: { pkg2b10: $.data.id }
            - call: "POST /hotel-management/report-packages/${pkg2b10}/submit"
              payload: {}
              as: HotelManagerOps
            - call: "POST /hotel-management/report-packages/${pkg2b10}/owner-review"
              payload: { dimension: "FINANCIAL", decision: "ACCEPT" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "GET /hotel-management/agreements/${agr2b}"
              payload: {}
              as: HotelManagerOps
              captures: { agr2b_vf: $.data.version }
          trigger:
            - call: "POST /hotel-management/agreements/${agr2b}/annual-true-up"
              payload: { fiscal_year: 2026, expected_agreement_version: "${agr2b_vf}" }
              as: HotelManagerOps
              captures: { tu2b: $.data.true_up_accrual_id }
          assert:
            - "MonthlyReportPackage.${pkg2b9}.agop_cents == 23212525 and incentive_fee_provisional_cents == 2221253"
            - "MonthlyReportPackage.${pkg2b10}.agop_cents == -4162500 and incentive_fee_provisional_cents == 0"
            - "true-up response accepted_period_count == 2 and annual_agop_cents == 19050025"
            - "true-up response final_incentive_fee_cents == 807504 (tier 1: 5000000 @ 0.10 == 500000; tier 2: 2050025 @ 0.15 == 307504)"
            - "true-up response final_incentive_fee_cents != 705003, the single-rate figure for the same 7050025 excess"
            - "true-up response provisional_incentive_total_cents == 2221253 and true_up_delta_cents == -1413749"
            - "FeeAccrual.${tu2b}.amount_cents == -1413749 and FeeAccrual.${tu2b}.report_package_id == ${pkg2b10} (the ACCEPTED period with the highest period_month)"

      - name: agop_pinned_evaluation_order_centralized_then_fee_then_priority
        grounds:
          - calculations.agop_and_provisional_incentive
          - calculations.centralized_services_allocation
          - entities.MonthlyReportPackage.fields.agop_cents
          - entities.ManagementAgreement.fields.ffe_reserve_pct
        distinguishing_aspect: |
          Fixed-evaluation-order composition: the centralized cap is keyed on gross revenue and must
          be resolved BEFORE the base fee and AGOP, and the FF&E reserve contribution — also keyed on
          gross revenue — must NOT enter AGOP; the pinned order yields agop_cents 22712525 whereas
          deducting the 2200001 reserve contribution yields 20512524 and a different incentive fee.
        test_recipe:
          setup:
            - "One ManagementAgreement ACTIVE with base_fee_pct 0.0325, centralized_services_cap_pct 0.015, ffe_reserve_pct 0.04, owner_priority_cents 12000000, and an APPROVED FY2026 OperatingBudget."
            - "One MonthlyReportPackage for (2026, 9) with gross_revenue_cents 55000025, operating_expenses_cents 30000000 and one RESERVATIONS chargeback of 500000 in status DISCLOSED."
          setup_api_calls:
            - call: "POST /hotel-management/agreements"
              payload: { hotel_name: "Order Of Operations Suites", owner_entity_name: "Pinned Order Owner LLC", base_fee_pct: 0.0325, incentive_fee_pct: 0.10, owner_priority_cents: 12000000, ffe_reserve_pct: 0.04, centralized_services_cap_pct: 0.015, working_capital_floor_cents: 500000, initial_working_capital_cents: 1000000 }
              as: PlatformAdmin
              captures: { agr2c: $.data.id }
            - call: "POST /hotel-management/agreements/${agr2c}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { agr2c_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${agr2c}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 600000000, budgeted_operating_expenses_cents: 400000000, expected_agreement_version: "${agr2c_v2}" }
              as: HotelManagerOps
              captures: { bud2c: $.data.id }
            - call: "POST /hotel-management/budgets/${bud2c}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${bud2c}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
            - call: "POST /hotel-management/agreements/${agr2c}/report-packages"
              payload: { fiscal_year: 2026, period_month: 9, rooms_revenue_cents: 40000015, fnb_revenue_cents: 12000005, other_revenue_cents: 3000005, operating_expenses_cents: 30000000, closing_cash_available_cents: 6000000 }
              as: HotelManagerOps
              captures: { pkg2c: $.data.id }
            - call: "POST /hotel-management/report-packages/${pkg2c}/centralized-charges"
              payload: { service_code: "RESERVATIONS", allocation_basis: "GROSS_REVENUE", pool_amount_cents: 10000000, hotel_basis_share: 0.05 }
              as: HotelManagerOps
              captures: { chg2c: $.data.id }
          trigger:
            - call: "POST /hotel-management/report-packages/${pkg2c}/submit"
              payload: {}
              as: HotelManagerOps
          assert:
            - "CentralizedServiceCharge.${chg2c}.requested_amount_cents == 500000 and allocated_amount_cents == 500000 (cap for the period is floor(55000025 * 0.015) == 825000)"
            - "MonthlyReportPackage.${pkg2c}.allocated_centralized_cents == 500000"
            - "MonthlyReportPackage.${pkg2c}.base_fee_cents == 1787500"
            - "MonthlyReportPackage.${pkg2c}.agop_cents == 22712525 (55000025 - 30000000 - 1787500 - 500000)"
            - "MonthlyReportPackage.${pkg2c}.agop_cents != 20512524, the figure produced when the 2200001 FF&E reserve contribution is wrongly deducted"
            - "MonthlyReportPackage.${pkg2c}.incentive_fee_provisional_cents == 2171253"
            - "ManagementAgreement.${agr2c}.ffe_reserve_balance_cents == 0 — the reserve is untouched by reporting"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: budget_revision_cycle_exhausts_rounds_and_deadlocks_into_carryforward
        grounds:
          - state_machines.OperatingBudget.REVISION_REQUESTED_to_SUBMITTED
