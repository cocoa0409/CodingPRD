# =============================================================================
# Task 0501 — Kids' Allowance & Chore Debit Card
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances total (meets the >= 2-per-rule / >= 18 minimum).
# Every grounds[] resolves to SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls chain
# drives empty-DB -> setup state using only §1.5 endpoints. All numeric asserts are
# literals computed against §1.3 formulas with round_half_up.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: interest_whole_period_vs_daily_average_diverge
        grounds:
          - calculations.interest_match_accrual
          - entities.InterestMatchConfig.fields.accrual_method
          - entities.InterestAccrual.fields.matched_cents
        distinguishing_aspect: |
          Same SAVE-jar end balance (120000 cents), same rate (1000 bps) and period (30 days):
          WHOLE_PERIOD credits 986 cents, DAILY_AVERAGE (avg 90000) credits 740 cents — a 246-cent
          divergence on the InterestMatchConfig/Jar domain.
        test_recipe:
          setup:
            - "Family funded with 200000 cents; one child with SAVE jar holding 120000 cents."
            - "InterestMatchConfig ENABLED at 1000 bps, monthly_cap_cents=0, accrual_method=WHOLE_PERIOD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { family_name: "Acme" }
              as: Parent
              as_user_id: "parent-1"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 200000 }
              as: Parent
              as_user_id: "parent-1"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Kid", birthdate: "2014-01-01" }
              as: Parent
              as_user_id: "parent-1"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/jars"
              payload: { jar_type: "SAVE" }
              as: Parent
              as_user_id: "parent-1"
              captures: { save_jar_id: "$.data[0].id" }
            - call: "POST /child-accounts/${child_id}/fund-jar"
              payload: { jar_type: "SAVE", amount_cents: 120000 }
              as: Parent
              as_user_id: "parent-1"
            - call: "GET /child-accounts/${child_id}/interest-match-config"
              payload: {}
              as: Parent
              as_user_id: "parent-1"
              captures: { cfg_id: "$.data[0].id" }
            - call: "PUT /interest-match-configs/${cfg_id}"
              payload: { annual_rate_bps: 1000, monthly_cap_cents: 0, accrual_method: "WHOLE_PERIOD" }
              as: Parent
              as_user_id: "parent-1"
          trigger:
            - call: "POST /interest-match-configs/${cfg_id}/accrue"
              payload: { period_days: 30 }
              as: Parent
              as_user_id: "parent-1"
              captures: { accr_id: $.data.id }
          assert:
            - "InterestAccrual.${accr_id}.matched_cents == 986"
            - "Jar.${save_jar_id}.balance_cents == 120986"
            - "Family.${fam_id}.funding_balance_cents == 199014"

      - name: spend_provisional_hold_vs_final_settle_diverge
        grounds:
          - calculations.spend_authorization_amount
          - state_machines.Transaction.PENDING_to_SETTLED
          - entities.DebitCard.fields.held_cents
          - entities.DebitCard.fields.available_cents
        distinguishing_aspect: |
          On the Transaction/Jar domain: authorizing 3000 reserves a 3000 hold (SPEND jar unchanged at
          5000, available drops to 2000); settling at 2500 releases the hold and debits the jar by 2500
          (jar 2500, available 2500) — provisional reservation differs from final settle by 500 cents.
        test_recipe:
          setup:
            - "Child's SPEND jar holds 5000 cents; card UNLOCKED/FUNDED; no controls."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "Beta" }
              as: Parent
              as_user_id: "parent-2"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 50000 }
              as: Parent
              as_user_id: "parent-2"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Sam", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "parent-2"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/debit-cards"
              payload: {}
              as: Parent
              as_user_id: "parent-2"
              captures: { card_id: "$.data[0].id" }
            - call: "POST /child-accounts/${child_id}/fund-jar"
              payload: { jar_type: "SPEND", amount_cents: 5000 }
              as: Parent
              as_user_id: "parent-2"
            - call: "POST /debit-cards/${card_id}/authorizations"
              payload: { merchant_id: "M1", category: "FOOD", amount_cents: 3000 }
              as: Child
              as_user_id: "${child_id}"
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/settle"
              payload: { settled_amount_cents: 2500 }
              as: PlatformAdmin
          assert:
            - "Transaction.${txn_id}.status == SETTLED"
            - "DebitCard.${card_id}.held_cents == 0"
            - "DebitCard.${card_id}.available_cents == 2500"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: card_control_limit_three_input_conditional_branches
        grounds:
          - calculations.card_control_limit_check
          - entities.CardControl.fields.rule
          - entities.CardControl.fields.per_period_cap_cents
          - validations[priority=16]
        distinguishing_aspect: |
          Mode (a): a >=3-input formula (control_kind, match_value, running matched sum) with a
          conditional branch on control_kind (STORE matches merchant_id, CATEGORY matches category);
          cumulative GAMING spend of 3000 then 2000 reaches the 5000 cap exactly (passes), a further
          1-cent authorization (5001) is rejected.
        test_recipe:
          setup:
            - "Child SPEND jar holds 20000 cents; one active LIMIT CardControl on category GAMING capped at 5000."
            - "One PENDING GAMING txn for 3000 and one PENDING GAMING txn for 2000 already exist (cumulative 5000)."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "Gamma" }
              as: Parent
              as_user_id: "parent-3"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 50000 }
              as: Parent
              as_user_id: "parent-3"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Gus", birthdate: "2014-01-01" }
              as: Parent
              as_user_id: "parent-3"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/debit-cards"
              payload: {}
              as: Parent
              as_user_id: "parent-3"
              captures: { card_id: "$.data[0].id", card_v0: "$.data[0].version" }
            - call: "POST /debit-cards/${card_id}/controls"
              payload: { control_kind: "CATEGORY", match_value: "GAMING", rule: "LIMIT", per_period_cap_cents: 5000, expected_debit_card_version: "${card_v0}" }
              as: Parent
              as_user_id: "parent-3"
            - call: "POST /child-accounts/${child_id}/fund-jar"
              payload: { jar_type: "SPEND", amount_cents: 20000 }
              as: Parent
              as_user_id: "parent-3"
            - call: "POST /debit-cards/${card_id}/authorizations"
              payload: { merchant_id: "MG", category: "GAMING", amount_cents: 3000 }
              as: Child
              as_user_id: "${child_id}"
            - call: "POST /debit-cards/${card_id}/authorizations"
              payload: { merchant_id: "MG", category: "GAMING", amount_cents: 2000 }
              as: Child
              as_user_id: "${child_id}"
          trigger:
            - call: "POST /debit-cards/${card_id}/authorizations"
              payload: { merchant_id: "MG", category: "GAMING", amount_cents: 1 }
              as: Child
              as_user_id: "${child_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CONTROL_LIMIT_EXCEEDED"
            - "HTTP status == 409"

      - name: investment_order_rounding_order_round_once
        grounds:
          - calculations.investment_order_settlement
          - entities.InvestmentOrder.fields.gross_cents
          - entities.InvestmentAccount.fields.cash_cents
        distinguishing_aspect: |
          Mode (b): rounding order pinned — gross = round_half_up(shares_milli * price / 1000) computed
          once over the whole order, never per-share-then-sum. A 2500-milli order at 1001 cents/share is
          2502.5 -> 2503 (round-half-up at the single division), not 2502.
        test_recipe:
          setup:
            - "Teen child (born 2010-01-01) with an ACTIVE InvestmentAccount funded with 10000 cents cash."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-26T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { family_name: "Delta" }
              as: Parent
              as_user_id: "parent-4"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 50000 }
              as: Parent
              as_user_id: "parent-4"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Tina", birthdate: "2010-01-01" }
              as: Parent
              as_user_id: "parent-4"
              captures: { child_id: $.data.id }
            - call: "POST /child-accounts/${child_id}/fund-jar"
              payload: { jar_type: "SAVE", amount_cents: 20000 }
              as: Parent
              as_user_id: "parent-4"
            - call: "POST /child-accounts/${child_id}/investment-account"
              payload: {}
              as: Parent
              as_user_id: "parent-4"
              captures: { inv_id: $.data.id }
            - call: "POST /investment-accounts/${inv_id}/fund"
              payload: { amount_cents: 10000 }
              as: Parent
              as_user_id: "parent-4"
          trigger:
            - call: "POST /investment-accounts/${inv_id}/orders"
              payload: { side: "BUY", symbol: "ZZZ", shares_milli: 2500, price_cents_per_share: 1001 }
              as: Parent
              as_user_id: "parent-4"
              captures: { ord_id: $.data.id }
          assert:
            - "InvestmentOrder.${ord_id}.gross_cents == 2503"
            - "InvestmentOrder.${ord_id}.status == FILLED"
            - "InvestmentAccount.${inv_id}.cash_cents == 7497"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: chore_completion_revision_cycle_increments_count
        grounds:
          - state_machines.ChoreCompletion.PENDING_REVIEW_to_NEEDS_REVISION
          - state_machines.ChoreCompletion.NEEDS_REVISION_to_PENDING_REVIEW
          - entities.ChoreCompletion.fields.revision_count
        distinguishing_aspect: |
          Cycle on ChoreCompletion: PENDING_REVIEW -> NEEDS_REVISION (kick-back) -> PENDING_REVIEW
          (resubmit) loops; revision_count increments by 1 on each resubmit. After kick-back+resubmit
          twice, revision_count == 2 and status is back to PENDING_REVIEW.
        test_recipe:
          setup:
            - "Child has one AVAILABLE chore; child submits it creating a PENDING_REVIEW completion."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "Epsilon" }
              as: Parent
              as_user_id: "parent-5"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Eve", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "parent-5"
              captures: { child_id: $.data.id }
            - call: "POST /child-accounts/${child_id}/chores"
              payload: { title: "Dishes", reward_cents: 500 }
              as: Parent
              as_user_id: "parent-5"
              captures: { chore_id: $.data.id }
            - call: "POST /chores/${chore_id}/submit"
              payload: {}
              as: Child
              as_user_id: "${child_id}"
              captures: { comp_id: $.data.id }
            - call: "POST /chore-completions/${comp_id}/kick-back"
              payload: {}
              as: Parent
              as_user_id: "parent-5"
            - call: "POST /chore-completions/${comp_id}/resubmit"
              payload: {}
              as: Child
              as_user_id: "${child_id}"
            - call: "POST /chore-completions/${comp_id}/kick-back"
              payload: {}
              as: Parent
              as_user_id: "parent-5"
          trigger:
            - call: "POST /chore-completions/${comp_id}/resubmit"
              payload: {}
              as: Child
              as_user_id: "${child_id}"
          assert:
            - "ChoreCompletion.${comp_id}.status == PENDING_REVIEW"
            - "ChoreCompletion.${comp_id}.revision_count == 2"

      - name: debit_card_parallel_lock_funding_independent
        grounds:
          - state_machines.DebitCard.lock_state_UNLOCKED_to_LOCKED
          - state_machines.DebitCard.funding_state_DRAINED_to_FUNDED
          - entities.DebitCard.fields.lock_state
          - entities.DebitCard.fields.funding_state
        distinguishing_aspect: |
          On DebitCard (different entity from ChoreCompletion): lock_state and funding_state evolve
          independently. A LOCKED card still flips funding_state to FUNDED when its SPEND jar is funded;
          locking does not change funding_state and funding does not change lock_state.
        test_recipe:
          setup:
            - "Child's card is UNLOCKED/DRAINED (SPEND jar empty); card then locked."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "Zeta" }
              as: Parent
              as_user_id: "parent-6"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 10000 }
              as: Parent
              as_user_id: "parent-6"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Zoe", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "parent-6"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/debit-cards"
              payload: {}
              as: Parent
              as_user_id: "parent-6"
              captures: { card_id: "$.data[0].id", card_v0: "$.data[0].version" }
            - call: "POST /debit-cards/${card_id}/lock"
              payload: { expected_debit_card_version: "${card_v0}" }
              as: Parent
              as_user_id: "parent-6"
          trigger:
            - call: "POST /child-accounts/${child_id}/fund-jar"
              payload: { jar_type: "SPEND", amount_cents: 4000 }
              as: Parent
              as_user_id: "parent-6"
          trigger_note: "Funding the SPEND jar flips funding_state to FUNDED while lock_state stays LOCKED."
          assert:
            - "DebitCard.${card_id}.lock_state == LOCKED"
            - "DebitCard.${card_id}.funding_state == FUNDED"
            - "DebitCard.${card_id}.available_cents == 4000"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: chore_approve_cascade_funding_jar_card_depth3
        grounds:
          - state_machines.ChoreCompletion.PENDING_REVIEW_to_PAID
          - entities.Family.fields.funding_balance_cents
          - entities.Jar.fields.balance_cents
          - entities.DebitCard.fields.available_cents
        distinguishing_aspect: |
          Depth-3 cascade triggered by chore-completion approve: (1) Family.funding_balance_cents debited
          1500 -> 8500; (2) that debit's paired credit lands on the SPEND Jar (1500); (3) the SPEND-jar
          balance change recomputes DebitCard.funding_state=FUNDED and available_cents=1500. Each hop is
          caused by the previous hop.
        test_recipe:
          setup:
            - "Family funded 10000 cents; child with a SPEND-payout chore reward 1500; completion PENDING_REVIEW."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "Eta" }
              as: Parent
              as_user_id: "parent-7"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 10000 }
              as: Parent
              as_user_id: "parent-7"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Hal", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "parent-7"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/debit-cards"
              payload: {}
              as: Parent
              as_user_id: "parent-7"
              captures: { card_id: "$.data[0].id" }
            - call: "GET /child-accounts/${child_id}/jars"
              payload: { jar_type: "SPEND" }
              as: Parent
              as_user_id: "parent-7"
              captures: { spend_jar_id: "$.data[0].id" }
            - call: "POST /child-accounts/${child_id}/chores"
              payload: { title: "Mow", reward_cents: 1500, payout_jar_type: "SPEND" }
              as: Parent
              as_user_id: "parent-7"
              captures: { chore_id: $.data.id }
            - call: "POST /chores/${chore_id}/submit"
              payload: {}
              as: Child
              as_user_id: "${child_id}"
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /chore-completions/${comp_id}/approve"
              payload: {}
              as: Parent
              as_user_id: "parent-7"
          assert:
            - "Family.${fam_id}.funding_balance_cents == 8500"
            - "Jar.${spend_jar_id}.balance_cents == 1500"
            - "DebitCard.${card_id}.funding_state == FUNDED"
            - "DebitCard.${card_id}.available_cents == 1500"

      - name: settle_cascade_hold_jar_card_depth3
        grounds:
          - state_machines.Transaction.PENDING_to_SETTLED
          - entities.DebitCard.fields.held_cents
          - entities.Jar.fields.balance_cents
          - entities.DebitCard.fields.funding_state
        distinguishing_aspect: |
          Depth-3 cascade from a DIFFERENT trigger (transaction settle, not chore approve): (1) settle
          releases the hold (held_cents 4000 -> 0); (2) debits the SPEND Jar by 4000 (4000 -> 0); (3) the
          zeroed SPEND jar recomputes DebitCard.funding_state FUNDED -> DRAINED. Each hop caused by the prior.
        test_recipe:
          setup:
            - "Child SPEND jar holds 4000; one PENDING authorization for the full 4000 (held 4000, funding_state FUNDED)."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "Theta" }
              as: Parent
              as_user_id: "parent-8"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 20000 }
              as: Parent
              as_user_id: "parent-8"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Ida", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "parent-8"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/debit-cards"
              payload: {}
              as: Parent
              as_user_id: "parent-8"
              captures: { card_id: "$.data[0].id" }
            - call: "GET /child-accounts/${child_id}/jars"
              payload: { jar_type: "SPEND" }
              as: Parent
              as_user_id: "parent-8"
              captures: { spend_jar_id: "$.data[0].id" }
            - call: "POST /child-accounts/${child_id}/fund-jar"
              payload: { jar_type: "SPEND", amount_cents: 4000 }
              as: Parent
              as_user_id: "parent-8"
            - call: "POST /debit-cards/${card_id}/authorizations"
              payload: { merchant_id: "M9", category: "BOOKS", amount_cents: 4000 }
              as: Child
              as_user_id: "${child_id}"
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/settle"
              payload: { settled_amount_cents: 4000 }
              as: PlatformAdmin
          assert:
            - "DebitCard.${card_id}.held_cents == 0"
            - "Jar.${spend_jar_id}.balance_cents == 0"
            - "DebitCard.${card_id}.funding_state == DRAINED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: card_locked_beats_insufficient_funds
        grounds:
          - validations[priority=14]
          - validations[priority=23]
          - errors[ERR_CARD_LOCKED]
          - errors[ERR_INSUFFICIENT_CARD_FUNDS]
        distinguishing_aspect: |
          Error-category pair business_safety (ERR_CARD_LOCKED, priority 14) vs business_fiscal
          (ERR_INSUFFICIENT_CARD_FUNDS, priority 23): a LOCKED card with available_cents=0 authorizing
          5000 returns ERR_CARD_LOCKED (the lower-priority safety check), never the funds error.
        test_recipe:
          setup:
            - "Child card LOCKED and SPEND jar empty (available 0); authorize 5000 violates both lock and funds."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "Iota" }
              as: Parent
              as_user_id: "parent-9"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Jay", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "parent-9"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/debit-cards"
              payload: {}
              as: Parent
              as_user_id: "parent-9"
              captures: { card_id: "$.data[0].id", card_v0: "$.data[0].version" }
            - call: "POST /debit-cards/${card_id}/lock"
              payload: { expected_debit_card_version: "${card_v0}" }
              as: Parent
              as_user_id: "parent-9"
          trigger:
            - call: "POST /debit-cards/${card_id}/authorizations"
              payload: { merchant_id: "MX", category: "FOOD", amount_cents: 5000 }
              as: Child
              as_user_id: "${child_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CARD_LOCKED"
            - "HTTP status == 409"

      - name: family_suspended_beats_insufficient_funding
        grounds:
          - validations[priority=12]
          - validations[priority=22]
          - errors[ERR_FAMILY_SUSPENDED]
          - errors[ERR_INSUFFICIENT_FUNDING]
        distinguishing_aspect: |
          Error-category pair business_referential (ERR_FAMILY_SUSPENDED, priority 12) vs business_fiscal
          (ERR_INSUFFICIENT_FUNDING, priority 22): approving a 5000 reward in a SUSPENDED family whose
          funding_balance_cents is 0 returns ERR_FAMILY_SUSPENDED, not the funding error.
        test_recipe:
          setup:
            - "Family funding 0 and SUSPENDED; child has a PENDING_REVIEW completion worth 5000."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "Kappa" }
              as: Parent
              as_user_id: "parent-10"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Kim", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "parent-10"
              captures: { child_id: $.data.id }
            - call: "POST /child-accounts/${child_id}/chores"
              payload: { title: "Vacuum", reward_cents: 5000 }
              as: Parent
              as_user_id: "parent-10"
              captures: { chore_id: $.data.id }
            - call: "POST /chores/${chore_id}/submit"
              payload: {}
              as: Child
