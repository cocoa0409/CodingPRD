# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3219 — Local Newspaper Consolidation, Print Site Closure &
# Delivery Outsourcing
#
# Breadth probe. Every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs with no
# test_recipe. Sections and claim_types follow references/claim-extraction-guide.md.
#
# Shared fixture chain used by many instances (empty-DB reachable):
#   hub 30 heads, ceiling 20000 ; site KOT 2x2x25000 ; region North ;
#   market Riverton floor 8000 ; route KOT->Riverton transit 120 cutoff 01:00
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: region_hub_create_returns_every_declared_field_and_opens_posture
        claim_type: Creation
        grounds:
          - entities.RegionHub
          - endpoints.POST_/regional-news-ops/region-hubs
        distinguishing_aspect: "A hub created with only the four required fields comes back 201 with press_posture OPEN, legal_notice_block false, unassigned_headcount equal to the supplied headcount, version 1 and server-generated id / created_at / updated_at."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /regional-news-ops/region-hubs"
              payload: { name: "North Ridge Media Group", total_newsroom_headcount: 30, max_print_tonnage_budget_cents: 5000000, transfer_cost_ceiling_cents: 20000 }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "RegionHub.${hub_id}.name == \"North Ridge Media Group\" and total_newsroom_headcount == 30"
            - "RegionHub.${hub_id}.press_posture == OPEN and legal_notice_block == false"
            - "RegionHub.${hub_id}.min_on_time_ratio_pct == 90 by default"
            - "RegionHub.${hub_id}.unassigned_headcount == 30 and version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"

      - name: print_site_get_round_trips_every_configuration_field
        claim_type: Retrieval
        grounds:
          - entities.PrintSite
          - endpoints.GET_/regional-news-ops/print-sites/{id}
        distinguishing_aspect: "Every PrintSite configuration field round-trips through GET unchanged, including the non-default loading_slot_minutes 45 and distinct_shifts_per_night 2, and the derived capacity_copies is 400000."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Hub and one site CED with non-default loading slot and shift count."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regional-news-ops/region-hubs"
              payload: { name: "North Ridge Media Group", total_newsroom_headcount: 30, max_print_tonnage_budget_cents: 5000000, transfer_cost_ceiling_cents: 20000 }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /regional-news-ops/region-hubs/${hub_id}/print-sites"
              payload: { code: "CED", press_units: 1, shifts_per_night: 2, copies_per_hour_per_press: 25000, max_concurrent_departures: 2, allocation_method: "PROPORTIONAL", distinct_shifts_per_night: 2, loading_slot_minutes: 45 }
              as: PrintOperationsDirector
              captures: { site_ced_id: $.data.id }
          trigger:
            - call: "GET /regional-news-ops/print-sites/${site_ced_id}"
              payload: {}
              as: PrintOperationsDirector
              captures: { ced_capacity: $.data.capacity_copies, ced_slot: $.data.loading_slot_minutes }
          assert:
            - "the response status is 200"
            - "PrintSite.${site_ced_id}.code == \"CED\" and press_units == 1 and shifts_per_night == 2"
            - "PrintSite.${site_ced_id}.allocation_method == PROPORTIONAL and distinct_shifts_per_night == 2"
            - "PrintSite.${site_ced_id}.loading_slot_minutes == 45, not the 30 default"
            - "PrintSite.${site_ced_id}.capacity_copies == 400000 and capacity_remaining_copies == 400000"

      - name: print_markets_list_paginates_and_reports_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/regional-news-ops/print-markets
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three markets on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Hub, region North and three markets in it."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regional-news-ops/region-hubs"
              payload: { name: "North Ridge Media Group", total_newsroom_headcount: 30, max_print_tonnage_budget_cents: 5000000, transfer_cost_ceiling_cents: 20000 }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /regional-news-ops/region-hubs/${hub_id}/regions"
              payload: { name: "North", daily_headcount_floor: 4, daily_headcount_cap: 10, allocation_priority: 1 }
              as: PrintOperationsDirector
              captures: { reg_n_id: $.data.id }
            - call: "POST /regional-news-ops/regions/${reg_n_id}/print-markets"
              payload: { name: "Riverton", per_copy_revenue_cents: 45, daily_route_cost_ceiling_cents: 9000, weighted_demand_units: 7000, print_edition_per_week: 7 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/regions/${reg_n_id}/print-markets"
              payload: { name: "Fallow", per_copy_revenue_cents: 45, daily_route_cost_ceiling_cents: 9000, weighted_demand_units: 6000, print_edition_per_week: 7 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/regions/${reg_n_id}/print-markets"
              payload: { name: "Eastport", per_copy_revenue_cents: 45, daily_route_cost_ceiling_cents: 9000, weighted_demand_units: 6000, print_edition_per_week: 7 }
              as: PrintOperationsDirector
          trigger:
            - call: "GET /regional-news-ops/print-markets"
              payload: { region_id: "${reg_n_id}", limit: 2, offset: 0 }
              as: PrintOperationsDirector
              captures: { page_first: "$.data[0].name", page_second: "$.data[1].name" }
          assert:
            - "the limit=2&offset=0 page returns exactly 2 rows, first ${page_first} and second ${page_second}"
            - "the envelope reports total_count 3 and has_more true for that page"
            - "the same request with offset=2 returns 1 row and the envelope reports has_more false"
            - "pagination_fields limit / offset / total_count / has_more are all present on the response"

      - name: print_market_get_unknown_id_returns_resource_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/regional-news-ops/print-markets/{id}
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "A GET on a well-formed but never-issued market id returns ERR_RESOURCE_NOT_FOUND with http 404 rather than an empty object."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. One hub on file; no market exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regional-news-ops/region-hubs"
              payload: { name: "North Ridge Media Group", total_newsroom_headcount: 30, max_print_tonnage_budget_cents: 5000000, transfer_cost_ceiling_cents: 20000 }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
          trigger:
            - call: "GET /regional-news-ops/print-markets/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: PrintOperationsDirector
              captures: { nf_id: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "the response error_id == ERR_RESOURCE_NOT_FOUND"

      - name: region_create_without_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Region.fields.name
          - endpoints.POST_/regional-news-ops/region-hubs/{id}/regions
        distinguishing_aspect: "Omitting the required Region.name yields ERR_INVALID_REQUEST with http 400, and the region is not created."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. One hub on file."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regional-news-ops/region-hubs"
              payload: { name: "North Ridge Media Group", total_newsroom_headcount: 30, max_print_tonnage_budget_cents: 5000000, transfer_cost_ceiling_cents: 20000 }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
          trigger:
            - call: "POST /regional-news-ops/region-hubs/${hub_id}/regions"
              payload: { daily_headcount_floor: 4, daily_headcount_cap: 10, allocation_priority: 1 }
              as: PrintOperationsDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "a follow-up GET on the hub's regions returns an empty array, so no region was created"

      - name: print_site_capacity_fields_are_computed_and_input_is_ignored
        claim_type: Computed Fields
        grounds:
          - entities.PrintSite.fields.capacity_copies
          - entities.PrintSite.fields.capacity_remaining_copies
          - endpoints.POST_/regional-news-ops/region-hubs/{id}/print-sites
        distinguishing_aspect: "capacity_copies is derived from press_units, shifts_per_night and copies_per_hour_per_press rather than accepted from the client, so a client-supplied capacity_copies value never reaches the stored row."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. One hub on file."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regional-news-ops/region-hubs"
              payload: { name: "North Ridge Media Group", total_newsroom_headcount: 30, max_print_tonnage_budget_cents: 5000000, transfer_cost_ceiling_cents: 20000 }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
          trigger:
            - call: "POST /regional-news-ops/region-hubs/${hub_id}/print-sites"
              payload: { code: "KOT", press_units: 2, shifts_per_night: 2, copies_per_hour_per_press: 25000, max_concurrent_departures: 2, allocation_method: "PRIORITY" }
              as: PrintOperationsDirector
              captures: { kot_capacity: $.data.capacity_copies }
          assert:
            - "PrintSite KOT capacity_copies == 800000, computed as 2 * 2 * 8 * 25000"
            - "PrintSite KOT capacity_remaining_copies == 800000 and allocated_copies == 0"
            - "PrintSite KOT annualized_savings_cents == 180000.00 and realized_savings_cents == 180000.00 with an empty savings window"

      - name: print_route_transit_and_buffer_defaults_applied
        claim_type: Defaults
        grounds:
          - entities.PrintRoute.fields.buffer_minutes
          - entities.PrintMarket.fields.publication_deadline_utc
          - entities.PrintMarket.fields.on_time_margin_minutes
          - endpoints.POST_/regional-news-ops/print-sites/{id}/routes
        distinguishing_aspect: "Omitting buffer_minutes, publication_deadline_utc and on_time_margin_minutes applies the declared defaults 45, 05:30 and 30 rather than null, and the derived ready time reflects a 45-minute buffer."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Hub, site KOT, region North and market Riverton created with no deadline or margin supplied."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regional-news-ops/region-hubs"
              payload: { name: "North Ridge Media Group", total_newsroom_headcount: 30, max_print_tonnage_budget_cents: 5000000, transfer_cost_ceiling_cents: 20000 }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /regional-news-ops/region-hubs/${hub_id}/print-sites"
              payload: { code: "KOT", press_units: 2, shifts_per_night: 2, copies_per_hour_per_press: 25000, max_concurrent_departures: 2, allocation_method: "PRIORITY" }
              as: PrintOperationsDirector
              captures: { site_kot_id: $.data.id }
            - call: "POST /regional-news-ops/region-hubs/${hub_id}/regions"
              payload: { name: "North", daily_headcount_floor: 4, daily_headcount_cap: 10, allocation_priority: 1 }
              as: PrintOperationsDirector
              captures: { reg_n_id: $.data.id }
            - call: "POST /regional-news-ops/regions/${reg_n_id}/print-markets"
              payload: { name: "Riverton", per_copy_revenue_cents: 45, daily_route_cost_ceiling_cents: 9000, weighted_demand_units: 7000, print_edition_per_week: 7 }
              as: PrintOperationsDirector
              captures: { mkt_riv_id: $.data.id }
          trigger:
            - call: "POST /regional-news-ops/print-sites/${site_kot_id}/routes"
              payload: { destination_market_id: "${mkt_riv_id}", transit_minutes: 120, dispatch_cutoff_utc: "01:00", is_direct_hop: true }
              as: PrintOperationsDirector
              captures: { route_id: $.data.id }
          assert:
            - "PrintRoute ${route_id} buffer_minutes == 45 by default"
            - "PrintMarket Riverton publication_deadline_utc == \"05:30\" and on_time_margin_minutes == 30 by default"
            - "PrintRoute ${route_id} distance_miles == 110.00 and marginal_mileage_cost == 90.00 with zero stops"

      - name: subscriber_contract_has_no_lifecycle_delete_and_rejects_bad_enum
        claim_type: Type Constraints
        grounds:
          - entities.SubscriberContract.fields.status
          - entities.PrintMarket.fields.print_edition_per_week
          - endpoints.POST_/regional-news-ops/regions/{id}/print-markets
        distinguishing_aspect: "A print_edition_per_week outside 1..7 and a single_copy_market_rule outside the declared enum both yield ERR_INVALID_REQUEST rather than being coerced, and no market row is written."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Hub and region North on file."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regional-news-ops/region-hubs"
              payload: { name: "North Ridge Media Group", total_newsroom_headcount: 30, max_print_tonnage_budget_cents: 5000000, transfer_cost_ceiling_cents: 20000 }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /regional-news-ops/region-hubs/${hub_id}/regions"
              payload: { name: "North", daily_headcount_floor: 4, daily_headcount_cap: 10, allocation_priority: 1 }
              as: PrintOperationsDirector
              captures: { reg_n_id: $.data.id }
          trigger:
            - call: "POST /regional-news-ops/regions/${reg_n_id}/print-markets"
              payload: { name: "Riverton", per_copy_revenue_cents: 45, daily_route_cost_ceiling_cents: 9000, weighted_demand_units: 7000, print_edition_per_week: 9, single_copy_market_rule: "carrier" }
              as: PrintOperationsDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "a follow-up filtered list on region ${reg_n_id} returns an empty array"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: edition_dispatch_from_delivered_is_rejected_as_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LatestEdition.transitions.in_production_to_on_time_dispatch
          - state_machines.LatestEdition.transitions.late_dispatch_to_delivered_market
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second dispatch on an edition already at delivered_market is refused with ERR_INVALID_STATE rather than re-dispatching, and no penalty is recomputed."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Hub, site KOT, region North, market Riverton, a selected route and one on-time edition already delivered."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regional-news-ops/region-hubs"
              payload: { name: "North Ridge Media Group", total_newsroom_headcount: 30, max_print_tonnage_budget_cents: 5000000, transfer_cost_ceiling_cents: 20000 }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /regional-news-ops/region-hubs/${hub_id}/print-sites"
              payload: { code: "KOT", press_units: 2, shifts_per_night: 2, copies_per_hour_per_press: 25000, max_concurrent_departures: 2, allocation_method: "PRIORITY" }
              as: PrintOperationsDirector
              captures: { site_kot_id: $.data.id }
            - call: "POST /regional-news-ops/region-hubs/${hub_id}/regions"
              payload: { name: "North", daily_headcount_floor: 4, daily_headcount_cap: 10, allocation_priority: 1 }
              as: PrintOperationsDirector
              captures: { reg_n_id: $.data.id }
            - call: "POST /regional-news-ops/regions/${reg_n_id}/print-markets"
              payload: { name: "Riverton", per_copy_revenue_cents: 45, daily_route_cost_ceiling_cents: 9000, weighted_demand_units: 7000, print_edition_per_week: 7, publication_deadline_utc: "05:30", on_time_margin_minutes: 30, guaranteed_floor_copies: 8000, single_copy_market_rule: "carrier" }
              as: PrintOperationsDirector
              captures: { mkt_riv_id: $.data.id }
            - call: "POST /regional-news-ops/print-sites/${site_kot_id}/routes"
              payload: { destination_market_id: "${mkt_riv_id}", transit_minutes: 120, dispatch_cutoff_utc: "01:00", is_direct_hop: true }
              as: PrintOperationsDirector
              captures: { route_id: $.data.id }
            - call: "GET /regional-news-ops/region-hubs/${hub_id}"
              payload: {}
              as: PrintOperationsDirector
              captures: { hub_v1: $.data.version }
            - call: "POST /regional-news-ops/print-markets/${mkt_riv_id}/plan-transfer"
              payload: { receiving_print_site_id: "${site_kot_id}", expected_hub_version: "${hub_v1}" }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/print-markets/${mkt_riv_id}/editions"
              payload: { assigned_print_site_id: "${site_kot_id}", slug: "2026-09-21", page_count: 8, requested_print_run_copies: 40000, late_sports_engineering_flag: false, legal_notice_count: 0 }
              as: PrintOperationsDirector
              captures: { ed_id: $.data.id }
            - call: "POST /regional-news-ops/editions/${ed_id}/dispatch"
              payload: {}
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/editions/${ed_id}/deliver"
              payload: {}
              as: PrintOperationsDirector
          trigger:
            - call: "POST /regional-news-ops/editions/${ed_id}/dispatch"
              payload: {}
              as: PrintOperationsDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "LatestEdition ${ed_id} status is still delivered_market after the rejected dispatch"

      - name: delivery_contractor_terminated_is_a_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.DeliveryContractor.terminal_states
          - state_machines.DeliveryContractor.transitions.terminated_to_terminated
          - errors[ERR_CONTRACTOR_TERMINAL]
        distinguishing_aspect: "From the terminated terminal state the reinstate action that is legal from suspended is refused with ERR_CONTRACTOR_TERMINAL, so the lockdown is by state rather than by action."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Hub, region North, market Riverton and contractor Cedar Hill on file."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /regional-news-ops/region-hubs"
              payload: { name: "North Ridge Media Group", total_newsroom_headcount: 30, max_print_tonnage_budget_cents: 5000000, transfer_cost_ceiling_cents: 20000 }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - call: "POST /regional-news-ops/region-hubs/${hub_id}/regions"
              payload: { name: "North", daily_headcount_floor: 4, daily_headcount_cap: 10, allocation_priority: 1 }
              as: PrintOperationsDirector
              captures: { reg_n_id: $.data.id }
            - call: "POST /regional-news-ops/regions/${reg_n_id}/print-markets"
              payload: { name: "Riverton", per_copy_revenue_cents: 45, daily_route_cost_ceiling_cents: 9000, weighted_demand_units: 7000, print_edition_per_week: 7 }
              as: PrintOperationsDirector
              captures: { mkt_riv_id: $.data.id }
            - call: "POST /regional-news-ops/region-hubs/${hub_id}/print-sites"
              payload: { code: "KOT", press_units: 2, shifts_per_night: 2, copies_per_hour_per_press: 25000, max_concurrent_departures: 2, allocation_method: "PRIORITY" }
              as: PrintOperationsDirector
              captures: { site_kot_id: $.data.id }
            - call: "POST /regional-news-ops/region-hubs/${hub_id}/delivery-contractors"
              payload: { name: "Cedar Hill Carriers", pay_basis: "PER_STOP", per_copy_rate_cents: 45, min_stop_guarantee: 3, net_60_available: true, cost_per_copy_ceiling_cents: 600, last_load_claim_weight_lbs: 0, sanction_reason_code: "NONE" }
              as: DeliveryNetworkManager
              captures: { con_cedar_id: $.data.id }
            - call: "POST /regional-news-ops/delivery-contractors/${con_cedar_id}/routes"
              payload: { print_market_id: "${mkt_riv_id}", route_code: "R1", stop_capacity: 6, per_stop_fee_cents: 1150, dist_per_stop_miles: 3.0, cost_per_copy_ceiling_cents: 600, printed_copies_surcharge_cents: 0, cost_run_date: "2026-09-10" }
              as: DeliveryNetworkManager
              captures: { droute_id: $.data.id }
            - call: "POST /regional-news-ops/print-markets/${mkt_riv_id}/editions"
              payload: { assigned_print_site_id: "${site_kot_id}", slug: "2026-09-20", page_count: 12, requested_print_run_copies: 28000, late_sports_engineering_flag: false, legal_notice_count: 0 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/delivery-routes/${droute_id}/cost-run"
              payload: { run_date: "2026-09-20" }
              as: DeliveryNetworkManager
          trigger:
            - call: "POST /regional-news-ops/delivery-contractors/${con_cedar_id}/terminate"
              payload: {}
              as: DeliveryNetworkManager
              captures: { con_status: $.data.status }
            - call: "POST /regional-news-ops/delivery-contractors/${con_cedar_id}/reinstate"
              payload: {}
              as: DeliveryNetworkManager
              captures: { lock_err: $.data.error_id }
          assert:
            - "DeliveryContractor Cedar Hill status == terminated"
            - "a subsequent reinstate is refused with error_id == ERR_CONTRACTOR_TERMINAL and http status 409"
            - "DeliveryContractor Cedar Hill status is still terminated after the rejected reinstate"

      - name: new_print_site_starts_in_active_status
        claim_type: Initial State
        grounds:
          - state_machines.PrintSite.initial_state
          - state_machines.PrintRoute.initial_state
          - state_machines.PrintMarket.initial_state
        distinguishing_aspect: "Every newly created row starts in its declared initial state — active for sites and markets, eligible for routes, prepared for delivery routes — and never in a client-supplied status."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Hub, region North and market Riverton created."]
