# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design
# Task: Master Patient Index Duplicate Resolution & Identity Integrity
#
# Breadth probe. Each instance is a walk of one row of
# references/claim-extraction-guide.md against this scaffold's §1.1–§1.7.
# `section:` values are the guide's nine sections; `claim_type:` values are the
# guide's per-section table rows. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) appear as `excluded_because:` stubs
# naming the covering instance.
#
# Conventions used by every recipe below (identical to §1.8):
#   * the logical clock is pinned with POST /_clock/set_current_utc before any
#     other call; DEFAULT_CLOCK_UTC is 2026-08-01T00:00:00Z
#   * RS-BASE means attribute_weights
#     {last_name 25.00, first_name 15.00, dob 25.00, ssn_last4 15.00,
#      sex 5.00, postal_code 10.00, phone 5.00}, auto_link_threshold 85.00,
#     review_threshold 70.00, conflict_penalty_points 12.00, version_label V-BASE-1
#   * PatientRecord creates use the opaque IdentityAnalyst role unless the corner
#     is specifically about the SiteRegistrar conditional rules (§1.4 priority 3
#     and priority 18)
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:

      - name: create_registration_site_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.RegistrationSite
          - endpoints[POST /mpi/registration-sites]
        distinguishing_aspect: "A RegistrationSite created with the four required inputs returns 201 with status defaulted to ACTIVE, both derived counters at 0, and the four common fields present with version 1."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
          trigger:
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-E1", name: "Entity Claims Clinic", region_code: "US-OR", registrar_headcount: 9 }
              as: MpiAdmin
              captures: { site_e1_id: $.data.id }
          assert:
            - "HTTP 201"
            - "$.data.site_code == \"SITE-E1\" and $.data.name == \"Entity Claims Clinic\" and $.data.region_code == \"US-OR\" and $.data.registrar_headcount == 9"
            - "$.data.status == ACTIVE (declared default)"
            - "$.data.active_record_count == 0 and $.data.flagged_record_count == 0"
            - "$.data.version == 1 and $.data.created_at == \"2026-08-01T00:00:00.000Z\" and $.data.updated_at == \"2026-08-01T00:00:00.000Z\""
            - "$.data.id is a non-empty string"

      - name: get_patient_record_returns_stored_and_computed_fields
        claim_type: retrieval
        grounds:
          - entities.PatientRecord
          - endpoints[GET /mpi/patient-records/{id}]
        distinguishing_aspect: "A GET by id returns the same stored demographics that were posted plus the computed enterprise_id and both state dimensions, with no field drift between the create response and the read."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-E2 and one PatientRecord E2-1000 created under it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-E2", name: "Retrieval Clinic", region_code: "US-UT", registrar_headcount: 2 }
              as: MpiAdmin
              captures: { site_e2_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_e2_id}", mrn: "E2-1000", last_name: "Marchetti", first_name: "Giulia", dob: "1979-10-12", sex: "F", ssn_last4: "5150", address_line: "44 Cedar Way", postal_code: "84101", phone: "8015550101", biometric_template_hash: "BIO-E2-1000", insurance_member_id: "INS-E2-1000", clinical_element_count: 13 }
              as: IdentityAnalyst
              captures: { rec_e2_id: $.data.id }
          trigger:
            - call: "GET /mpi/patient-records/${rec_e2_id}"
              payload: {}
              as: SiteRegistrar
              as_user_id: "${site_e2_id}"
          assert:
            - "HTTP 200"
            - "$.data.site_id == ${site_e2_id} and $.data.mrn == \"E2-1000\""
            - "$.data.last_name == \"Marchetti\" and $.data.first_name == \"Giulia\" and $.data.dob == \"1979-10-12\" and $.data.sex == F"
            - "$.data.ssn_last4 == \"5150\" and $.data.address_line == \"44 Cedar Way\" and $.data.postal_code == \"84101\" and $.data.phone == \"8015550101\""
            - "$.data.biometric_template_hash == \"BIO-E2-1000\" and $.data.insurance_member_id == \"INS-E2-1000\""
            - "$.data.clinical_element_count == 13"
            - "$.data.enterprise_id == \"EID-SITE-E2-E2-1000\" (computed as 'EID-' + site_code + '-' + mrn)"
            - "$.data.identity_state == ACTIVE and $.data.integrity_state == CLEAR and $.data.survivor_record_id == null and $.data.subsumed_member_count == 0"
            - "$.data.version == 1"

      - name: list_patient_records_filters_by_site_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /mpi/patient-records]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The record list honours the site_id filter and the limit/offset window together: with three records across two sites, site_id plus limit 1 returns exactly one row while total_count still reports 2 and has_more flips from true to false as offset advances."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Two ACTIVE RegistrationSite rows SITE-E3A and SITE-E3B."
            - "Two PatientRecord rows at SITE-E3A created in mrn order E3-1000 then E3-2000, and one PatientRecord at SITE-E3B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-E3A", name: "List Clinic A", region_code: "US-KS", registrar_headcount: 1 }
              as: MpiAdmin
              captures: { site_e3a_id: $.data.id }
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-E3B", name: "List Clinic B", region_code: "US-KS", registrar_headcount: 1 }
              as: MpiAdmin
              captures: { site_e3b_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_e3a_id}", mrn: "E3-1000", last_name: "Nakamura", first_name: "Sora", dob: "1995-01-20", sex: "X", clinical_element_count: 1 }
              as: IdentityAnalyst
              captures: { rec_e3a1_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_e3a_id}", mrn: "E3-2000", last_name: "Silva", first_name: "Pedro", dob: "1961-03-08", sex: "M", clinical_element_count: 2 }
              as: IdentityAnalyst
              captures: { rec_e3a2_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_e3b_id}", mrn: "E3-3000", last_name: "Haddad", first_name: "Lina", dob: "1988-08-08", sex: "F", clinical_element_count: 3 }
              as: IdentityAnalyst
              captures: { rec_e3b1_id: $.data.id }
          trigger:
            - call: "GET /mpi/patient-records"
              payload: { site_id: "${site_e3a_id}", limit: 1, offset: 0 }
              as: MpiAdmin
            - call: "GET /mpi/patient-records"
              payload: { site_id: "${site_e3a_id}", limit: 1, offset: 1 }
              as: MpiAdmin
            - call: "GET /mpi/patient-records"
              payload: { limit: 10, offset: 0 }
              as: MpiAdmin
          assert:
            - "First trigger call: response_type == \"array\", exactly 1 row in $.data, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "First trigger call: $.data[0].id == ${rec_e3a1_id} (created_at ASC ordering)"
            - "Second trigger call: exactly 1 row, $.data[0].id == ${rec_e3a2_id}, total_count == 2, has_more == false"
            - "Third trigger call: exactly 3 rows and total_count == 3 (no site filter)"
            - "No row returned by the first two calls has site_id == ${site_e3b_id}"

      - name: get_patient_record_by_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=8]
          - errors[ERR_RECORD_NOT_FOUND]
        distinguishing_aspect: "A GET for a syntactically valid but unknown record id returns 404 ERR_RECORD_NOT_FOUND rather than 200 with an empty body."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z and no PatientRecord rows at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
          trigger:
            - call: "GET /mpi/patient-records/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MpiAdmin
          assert:
            - "HTTP 404"
            - "$.data.error_id == \"ERR_RECORD_NOT_FOUND\""
            - "response_type == \"error\" and $.data.message is a non-empty string"

      - name: create_match_rule_set_without_thresholds_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - endpoints[POST /mpi/match-rule-sets]
        distinguishing_aspect: "Omitting the required review_threshold and conflict_penalty_points inputs returns 400 ERR_INVALID_REQUEST at priority 4, before the priority-16 weight-sum check and the priority-17 threshold-order check can run."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
          trigger:
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Incomplete Rules", version_label: "V-BAD-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00 }
              as: MpiAdmin
          assert:
            - "HTTP 400"
            - "$.data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /mpi/match-rule-sets/{id} for any id returns 404 - no MatchRuleSet was persisted"

      - name: patient_record_optional_fields_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.PatientRecord.fields.clinical_element_count
          - entities.PatientRecord.fields.identity_state
          - endpoints[POST /mpi/patient-records]
        distinguishing_aspect: "Omitting clinical_element_count and every optional demographic yields clinical_element_count 0, identity_state ACTIVE, integrity_state CLEAR, subsumed_member_count 0 and explicit nulls for the omitted demographics - not absent keys."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-E4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-E4", name: "Defaults Clinic", region_code: "US-ID", registrar_headcount: 1 }
              as: MpiAdmin
              captures: { site_e4_id: $.data.id }
          trigger:
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_e4_id}", mrn: "E4-1000", last_name: "Osei", first_name: "Kwame", dob: "1974-07-04", sex: "M" }
              as: IdentityAnalyst
          assert:
            - "HTTP 201"
            - "$.data.clinical_element_count == 0 (declared default)"
            - "$.data.identity_state == ACTIVE and $.data.integrity_state == CLEAR and $.data.subsumed_member_count == 0 and $.data.survivor_record_id == null"
            - "$.data.ssn_last4 == null and $.data.address_line == null and $.data.postal_code == null and $.data.phone == null and $.data.biometric_template_hash == null and $.data.insurance_member_id == null"
            - "$.data.origin_search_attempt_id == null (optional for the opaque IdentityAnalyst role)"
            - "$.data.enterprise_id == \"EID-SITE-E4-E4-1000\""

      - name: registration_site_active_record_count_is_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - entities.RegistrationSite.fields.active_record_count
          - endpoints[POST /mpi/patient-records]
        distinguishing_aspect: "active_record_count is never an input: it reads 0 at site creation and advances to 1 then 2 purely as a consequence of PatientRecord creates, with flagged_record_count staying 0 because no record is under a fraud hold."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-E5 with no records."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-E5", name: "Counter Clinic", region_code: "US-NM", registrar_headcount: 4 }
              as: MpiAdmin
              captures: { site_e5_id: $.data.id, site_e5_count0: $.data.active_record_count }
          trigger:
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_e5_id}", mrn: "E5-1000", last_name: "Abbas", first_name: "Yusra", dob: "1992-11-11", sex: "F", clinical_element_count: 2 }
              as: IdentityAnalyst
            - call: "GET /mpi/registration-sites/${site_e5_id}"
              payload: {}
              as: MpiAdmin
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_e5_id}", mrn: "E5-2000", last_name: "Novak", first_name: "Jiri", dob: "1955-02-02", sex: "M", clinical_element_count: 6 }
              as: IdentityAnalyst
            - call: "GET /mpi/registration-sites/${site_e5_id}"
              payload: {}
              as: MpiAdmin
          assert:
            - "${site_e5_count0} == 0"
            - "Second trigger call: $.data.active_record_count == 1 and $.data.flagged_record_count == 0"
            - "Fourth trigger call: $.data.active_record_count == 2 and $.data.flagged_record_count == 0"
            - "Fourth trigger call: $.data.registrar_headcount == 4 (an unrelated input field is untouched by the recompute)"

      - name: patient_record_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.PatientRecord.fields.enterprise_id
          - entities.PatientRecord.fields.identity_state
          - complexity_profile.consistency_model
        distinguishing_aspect: "id, created_at, updated_at, version, enterprise_id, identity_state and integrity_state are all minted by the server: the create response and an immediate read agree on every one of them, and version is exactly 1 before any mutation."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-E6."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-E6", name: "System Fields Clinic", region_code: "US-IA", registrar_headcount: 1 }
              as: MpiAdmin
              captures: { site_e6_id: $.data.id }
          trigger:
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_e6_id}", mrn: "E6-1000", last_name: "Lindqvist", first_name: "Elsa", dob: "1983-05-05", sex: "F", clinical_element_count: 4 }
              as: IdentityAnalyst
              captures: { rec_e6_id: $.data.id, rec_e6_created: $.data.created_at, rec_e6_version: $.data.version }
            - call: "GET /mpi/patient-records/${rec_e6_id}"
              payload: {}
              as: MpiAdmin
          assert:
            - "${rec_e6_version} == 1"
            - "${rec_e6_created} == \"2026-08-01T00:00:00.000Z\" (the logical clock, not host wall-clock time)"
            - "Second trigger call: $.data.id == ${rec_e6_id} and $.data.created_at == ${rec_e6_created} and $.data.updated_at == \"2026-08-01T00:00:00.000Z\" and $.data.version == 1"
            - "Second trigger call: $.data.enterprise_id == \"EID-SITE-E6-E6-1000\" and $.data.identity_state == ACTIVE and $.data.integrity_state == CLEAR"

      - name: create_patient_record_with_invalid_enum_sex_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - entities.PatientRecord.fields.sex
        distinguishing_aspect: "sex is constrained to M | F | X | U, so the value \"MALE\" is refused with 400 ERR_INVALID_REQUEST and no record is persisted; the site's active_record_count stays 0."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-E7 with zero records."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-E7", name: "Enum Clinic", region_code: "US-ME", registrar_headcount: 1 }
              as: MpiAdmin
              captures: { site_e7_id: $.data.id }
          trigger:
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_e7_id}", mrn: "E7-1000", last_name: "Duarte", first_name: "Ines", dob: "1990-09-09", sex: "MALE" }
              as: IdentityAnalyst
            - call: "GET /mpi/registration-sites/${site_e7_id}"
              payload: {}
              as: MpiAdmin
          assert:
            - "First trigger call: HTTP 400 with $.data.error_id == \"ERR_INVALID_REQUEST\""
            - "Second trigger call: $.data.active_record_count == 0 and $.data.version == 1"

      - name: review_evidence_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.ReviewEvidence
          - endpoints[GET /mpi/candidate-pairs/{id}/evidence]
        distinguishing_aspect: "ReviewEvidence declares common_fields false, so a created evidence row exposes only id and created_at - no version and no updated_at - and §1.5 offers no endpoint that mutates or deletes it; the pair, not the evidence, carries the version."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-E8 and one MatchRuleSet RS-BASE."
            - "Two PatientRecord rows agreeing on last_name, first_name, dob and sex, with E8-2000 leaving ssn_last4, postal_code and phone null: STRICT scoring gives 25.00 + 15.00 + 25.00 + 0.00 + 5.00 + 0.00 + 0.00 = 70.00, which is POTENTIAL_DUPLICATE (below auto_link_threshold 85.00), so the pair is created in queue_state NEW."
            - "The pair is triaged and taken into review so evidence can be attached."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-E8", name: "Evidence Immutability Clinic", region_code: "US-VT", registrar_headcount: 2 }
              as: MpiAdmin
              captures: { site_e8_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_e8_id}", mrn: "E8-1000", last_name: "Rasmussen", first_name: "Freja", dob: "1981-03-14", sex: "F", ssn_last4: "4242", clinical_element_count: 3 }
              as: IdentityAnalyst
              captures: { rec_e8a_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_e8_id}", mrn: "E8-2000", last_name: "Rasmussen", first_name: "Freja", dob: "1981-03-14", sex: "F", clinical_element_count: 1 }
              as: IdentityAnalyst
              captures: { rec_e8b_id: $.data.id }
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_e8a_id}", record_b_id: "${rec_e8b_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { pair_e8_id: $.data.id }
            - call: "POST /mpi/candidate-pairs/${pair_e8_id}/triage"
              payload: { triage_note: "Immutability probe." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /mpi/candidate-pairs/${pair_e8_id}/start-review"
              payload: {}
              as: IdentityAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /mpi/candidate-pairs/${pair_e8_id}/evidence"
              payload: { evidence_type: "PHONE_VERIFICATION", outcome: "INCONCLUSIVE", weight_points: 0.00, note: "Number disconnected." }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
              captures: { ev_e8_id: $.data.id }
            - call: "GET /mpi/candidate-pairs/${pair_e8_id}/evidence"
              payload: { limit: 10, offset: 0 }
              as: MpiAdmin
          assert:
            - "First trigger call: HTTP 201 with $.data.id present and $.data.created_at == \"2026-08-01T00:00:00.000Z\""
            - "First trigger call: the response carries no version key and no updated_at key (ReviewEvidence declares common_fields false)"
            - "First trigger call: $.data.pair_id == ${pair_e8_id} and $.data.evidence_type == PHONE_VERIFICATION and $.data.outcome == INCONCLUSIVE and $.data.weight_points == 0.00 and $.data.submitted_by_user_id == \"analyst-1\""
            - "Second trigger call: exactly 1 row and total_count == 1"
            - "§1.5 declares no PATCH, PUT or DELETE endpoint under /mpi/candidate-pairs/{id}/evidence - the row cannot be amended, only superseded by a further evidence row"
            - "DuplicateCandidatePair.${pair_e8_id}.evidence_points == 0.00 and evidence_adjustment == 0.00 (an INCONCLUSIVE row contributes nothing) and version == 4"

      - name: create_search_attempt_under_unknown_site_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_SITE_NOT_FOUND]
        distinguishing_aspect: "A RegistrationSearchAttempt is a child of RegistrationSite via the {id} path segment, so posting one under an unknown site id returns 404 ERR_SITE_NOT_FOUND instead of creating an orphan."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z and no RegistrationSite rows at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
          trigger:
            - call: "POST /mpi/registration-sites/00000000-0000-4000-8000-0000000000ff/search-attempts"
              payload: { searched_last_name: "Ghost" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "HTTP 404"
            - "$.data.error_id == \"ERR_SITE_NOT_FOUND\""

      - name: merge_cluster_graph_topology_is_a_chain_of_survivor_pointers
        claim_type: parent_relationships
        grounds:
          - entities.PatientRecord.fields.survivor_record_id
          - complexity_profile.entity_topology
        excluded_because:
          difficulty_instance: merge_path_compression_repoints_grandchild_to_new_survivor
          rationale: "The graph-topology claim (self-referential survivor_record_id cluster, cycle-free after path compression) is exactly what that §1.8 instance asserts end-to-end."

  - section: state_machines
    instances:

      - name: activating_a_second_rule_set_retires_the_first
        claim_type: valid_transition
        grounds:
          - state_machines.MatchRuleSet.DRAFT_to_ACTIVE
          - state_machines.MatchRuleSet.ACTIVE_to_RETIRED
          - endpoints[POST /mpi/match-rule-sets/{id}/activate]
        distinguishing_aspect: "The DRAFT -> ACTIVE transition carries a system side effect on a different row: activating a second rule set drives the incumbent ACTIVE -> RETIRED, so at most one ACTIVE MatchRuleSet ever exists and both versions advance."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z and no MatchRuleSet rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_first_id: $.data.id, rs_first_status0: $.data.status }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Second Generation Rules", version_label: "V-BASE-2", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 88.00, review_threshold: 72.00, conflict_penalty_points: 10.00 }
              as: MpiAdmin
              captures: { rs_second_id: $.data.id }
          trigger:
            - call: "POST /mpi/match-rule-sets/${rs_first_id}/activate"
              payload: {}
              as: MpiAdmin
            - call: "POST /mpi/match-rule-sets/${rs_second_id}/activate"
              payload: {}
              as: MpiAdmin
            - call: "GET /mpi/match-rule-sets/${rs_first_id}"
              payload: {}
              as: MpiAdmin
          assert:
            - "${rs_first_status0} == \"DRAFT\" (declared initial_state)"
            - "First trigger call: HTTP 200 with $.data.status == ACTIVE and $.data.version == 2"
            - "Second trigger call: HTTP 200 with $.data.status == ACTIVE and $.data.version == 2"
            - "Third trigger call: $.data.status == RETIRED and $.data.version == 3 (v1 create, v2 activate, v3 system retirement)"
            - "Third trigger call: $.data.auto_link_threshold == 85.00 and $.data.review_threshold == 70.00 (retirement does not rewrite the retired rule set's thresholds)"

      - name: candidate_pair_is_created_in_the_new_queue_state
        claim_type: initial_state
        grounds:
          - state_machines.DuplicateCandidatePair.initial_state
          - endpoints[POST /mpi/candidate-pairs]
        distinguishing_aspect: "A pair whose classification is POTENTIAL_DUPLICATE with empty conflict_flags takes neither create-time system branch, so it lands in the declared initial_state NEW at version 1 with every review field null."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-S2 and one MatchRuleSet RS-BASE."
            - "Two PatientRecord rows agreeing on last_name, first_name, dob and sex, with S2-2000 leaving ssn_last4, postal_code and phone null: STRICT score is 25.00 + 15.00 + 25.00 + 0.00 + 5.00 + 0.00 + 0.00 = 70.00, so classification is POTENTIAL_DUPLICATE and conflict_flags is empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MpiAdmin
            - call: "POST /mpi/registration-sites"
              payload: { site_code: "SITE-S2", name: "Initial State Clinic", region_code: "US-NE", registrar_headcount: 2 }
              as: MpiAdmin
              captures: { site_s2_id: $.data.id }
            - call: "POST /mpi/match-rule-sets"
              payload: { name: "Baseline Match Rules", version_label: "V-BASE-1", attribute_weights: { last_name: 25.00, first_name: 15.00, dob: 25.00, ssn_last4: 15.00, sex: 5.00, postal_code: 10.00, phone: 5.00 }, auto_link_threshold: 85.00, review_threshold: 70.00, conflict_penalty_points: 12.00 }
              as: MpiAdmin
              captures: { rs_base_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_s2_id}", mrn: "S2-1000", last_name: "Bergstrom", first_name: "Anders", dob: "1969-04-22", sex: "M", ssn_last4: "1919", postal_code: "68102", phone: "4025550101", clinical_element_count: 5 }
              as: IdentityAnalyst
              captures: { rec_s2a_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_s2_id}", mrn: "S2-2000", last_name: "Bergstrom", first_name: "Anders", dob: "1969-04-22", sex: "M", clinical_element_count: 1 }
              as: IdentityAnalyst
              captures: { rec_s2b_id: $.data.id }
          trigger:
            - call: "POST /mpi/candidate-pairs"
              payload: { record_a_id: "${rec_s2a_id}", record_b_id: "${rec_s2b_id}", rule_set_id: "${rs_base_id}", score_variant: "STRICT" }
              as: IdentityAnalyst
              as_user_id: "analyst-1"
          assert:
            - "HTTP 201 and $.data.queue_state == NEW and $.data.version == 1"
            - "$.data.match_score == 70.00 and $.data.classification == POTENTIAL_DUPLICATE and $.data.conflict_flags == []"
            - "$.data.triage_note == null and $.data.recommended_by_user_id == null and $.data.recommendation == null and $.data.approved_by_user_id == null"
            - "$.data.evidence_points == 0.00 and $.data.evidence_adjustment == 0.00 and $.data.effective_score == 70.00 and $.data.base_band == P2 and $.data.priority_band == P2"
            - "$.data.detected_at_site_id == ${site_s2_id} and $.data.rule_set_id == ${rs_base_id} and $.data.score_variant == STRICT"
            - "GET /mpi/fraud-investigations?pair_id={this pair} returns exactly 0 rows (no auto-open branch fired)"

      - name: resolved_distinct_pair_rejects_every_further_queue_action
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DuplicateCandidatePair.terminal_states
          - validations[priority=26]
          - endpoints[POST /mpi/candidate-pairs/{id}/resolve-distinct]
        distinguishing_aspect: "RESOLVED_DISTINCT is the only declared terminal queue_state, so after resolution both return-to-review and triage return 409 ERR_PAIR_INVALID_STATE and the pair's version stops advancing at 7."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One ACTIVE RegistrationSite SITE-S3 and one MatchRuleSet RS-BASE."
            - "Two PatientRecord rows scoring STRICT 70.00 (S3-2000 leaves ssn_last4, postal_code and phone null), so the pair starts NEW."
            - "The pair is triaged (version 2), taken into review (version 3), given two SUPPORTS_DISTINCT evidence rows of 3.00 and 2.00 (versions 4 and 5), then recommended DISTINCT by analyst-1 (version 6) and resolved distinct by steward-1 (version 7). evidence_points is -5.00, base_band P2 so the multiplier is 1.00, evidence_adjustment -5.00 and effective_score 65.00 with priority_band P3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
