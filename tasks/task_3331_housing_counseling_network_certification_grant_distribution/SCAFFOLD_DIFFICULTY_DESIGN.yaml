          withdraw must leave Course.seats_taken exactly at its pre-enroll
          value — forward action (+1) paired with its compensating action
          (-1) conserves the seat ledger, and a FAILED grade also releases
          the seat while COMPLETED does not.
        test_recipe:
          setup:
            - "Course crs (capacity 2) in IN_SESSION; counselors c1, c2, c3 of member m1"
          setup_api_calls:
            - call: "POST /housing-network/members"
              payload: { legal_name: "Seat Housing", ein: "123450006", state_code: "OR", service_regions: ["41006"] }
              as: NetworkDirector
              captures: { m1: $.data.id }
            - call: "POST /housing-network/counselors"
              payload: { member_id: "${m1}", full_name: "S1", email: "s1@x.com" }
              as: NetworkDirector
              captures: { c1: $.data.id }
            - call: "POST /housing-network/counselors"
              payload: { member_id: "${m1}", full_name: "S2", email: "s2@x.com" }
              as: NetworkDirector
              captures: { c2: $.data.id }
            - call: "POST /housing-network/counselors"
              payload: { member_id: "${m1}", full_name: "S3", email: "s3@x.com" }
              as: NetworkDirector
              captures: { c3: $.data.id }
            - call: "POST /housing-network/courses"
              payload: { course_code: "HO-902", title: "HO", program_area: "HOMEOWNERSHIP", capacity: 2, ce_eligible: false, ce_credits: 0, delivery_start: "2026-09-02T00:00:00Z", delivery_end: "2026-12-20T00:00:00Z" }
              as: TrainingRegistrar
              captures: { crs: $.data.id }
            - call: "POST /housing-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: NetworkDirector
            - call: "POST /housing-network/courses/${crs}/enrollments"
              payload: { counselor_id: "${c1}" }
              as: TrainingRegistrar
              captures: { e1: $.data.id }
            - call: "POST /housing-network/courses/${crs}/enrollments"
              payload: { counselor_id: "${c2}" }
              as: TrainingRegistrar
              captures: { e2: $.data.id }
          trigger:
            - call: "POST /housing-network/enrollments/${e1}/withdraw"
              payload: {}
              as: TrainingRegistrar
            - call: "GET /housing-network/courses/${crs}"
              payload: {}
              as: TrainingRegistrar
              captures: { seats_after_withdraw: $.data.seats_taken }
            - call: "POST /housing-network/courses/${crs}/enrollments"
              payload: { counselor_id: "${c3}" }
              as: TrainingRegistrar
              captures: { e3: $.data.id }
            - call: "POST /housing-network/enrollments/${e2}/grade"
              payload: { score: 50 }
              as: TrainingRegistrar
            - call: "GET /housing-network/courses/${crs}"
              payload: {}
              as: TrainingRegistrar
              captures: { seats_final: $.data.seats_taken }
          assert:
            - "after withdraw: Course.${crs}.seats_taken == 1 (invariant restored to pre-enroll level; captured ${seats_after_withdraw})"
            - "Enrollment.${e3}.enrollment_status == REGISTERED (released seat re-usable, no ERR_COURSE_FULL)"
            - "after failing grade on e2: Course.${crs}.seats_taken == 1 (failure also releases; COMPLETED would not; captured ${seats_final})"
            - "Course.${crs}.seats_taken never exceeds capacity 2 at any point"
