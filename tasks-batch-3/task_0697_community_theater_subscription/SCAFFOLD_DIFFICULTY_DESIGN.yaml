              as: SeasonAdmin
              captures: { perf_id: $.data.id }
            - call: "POST /box-office/performances/${perf_id}/schedule"
              payload: {}
              as: SeasonAdmin
            - call: "POST /box-office/performances/${perf_id}/open-sales"
              payload: {}
              as: BoxOfficeAgent
              captures: { perf_v0: $.data.version }
            - call: "POST /box-office/patrons"
              payload: { email: "p16@x.com", full_name: "Pat Sixteen" }
              as: SeasonAdmin
              captures: { patron_id: $.data.id }
            - call: "POST /box-office/tickets"
              payload: { performance_id: "${perf_id}", seat_id: "${seat1}", patron_id: "${patron_id}", origin: "SINGLE", expected_performance_version: "${perf_v0}" }
              as: BoxOfficeAgent
              captures: { t1: $.data.id }
            - call: "GET /box-office/performances/${perf_id}"
