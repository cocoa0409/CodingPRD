        distinguishing_aspect: "POSTPONED releases are excluded from the overlap check: R2's window may intersect a postponed release's dormant window and is accepted (201)."
        test_recipe:
          setup: ["program CES (window 30); cycles 2026-09 and 2026-10; R1 (Sep cycle) at 2026-10-01T13:30:00Z then POSTPONED"]
          setup_api_calls:
