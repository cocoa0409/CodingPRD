            - "${st_a} == FILED"
            - "${err_b} == ERR_TRANSFER_WINDOW_OVERLAP (B matches {2029-06-01, 2030-06-01}; intersects A's set at 2029-06-01)"
            - "${st_c} == FILED (C matches {2030-06-01, 2031-06-01}; disjoint from A — adjacency is allowed at the payment-set level)"

      - name: guardianship_half_open_interval_overlap
        grounds:
          - validations[priority=14]
          - state_machines.GuardianshipCase.PENDING_REVIEW_to_ACTIVE
          - state_machines.GuardianshipCase.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Semantics = half-open [effective_from_date, terminated_at_date or
          infinity) intervals on resource GuardianshipCase (different semantics
          and resource than petition payment sets): an open-ended ACTIVE case
          blocks any later case for the payee; after revocation, a new case
          starting exactly on the termination date is allowed (end-exclusive
          geometry + closed cases excluded from the check).
        test_recipe:
          setup:
            - "CA profile; adult payee (DOB 1990-04-02)"
