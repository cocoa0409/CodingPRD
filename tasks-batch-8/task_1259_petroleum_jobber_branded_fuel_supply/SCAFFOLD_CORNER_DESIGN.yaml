# =============================================================================
# Task 1259 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: every testable claim of SCAFFOLD.yaml §1.1–§1.7 not already
# covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml (stubs mark those).
# =============================================================================

scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: station_create_defaults_and_initial_state
        claim_type: creation_defaults_initial_state
        grounds: ["entities.DealerStation"]
        distinguishing_aspect: "Creating a station without local_option_tc_per_gal / credit_terms_days applies defaults 0 and 10, initializes exposure 0, the three parallel statuses, and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Def", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 500000 }
              as: JobberAdmin
              captures: { s_id: $.data.id, ver: $.data.version }
          trigger: []
          assert:
            - "create response: local_option_tc_per_gal == 0, credit_terms_days == 10, current_exposure_cents == 0"
            - "operating_status == ONBOARDING, credit_status == GOOD_STANDING, compliance_status == COMPLIANT"
            - "version == 1 and id/created_at/updated_at are server-generated"

      - name: station_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.DealerStation.fields.credit_limit_cents", "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "Omitting required credit_limit_cents is rejected with ERR_VALIDATION_FAILED (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Bad", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200 }
              as: JobberAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION_FAILED, http 400"

      - name: product_create_extra_field_rejected
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "Unknown request fields are rejected (strict body shape), not silently ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065, sponsor: "acme" }
              as: JobberAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION_FAILED, http 400 (unknown key `sponsor`)"

      - name: dealer_station_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_DEALER_STATION_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent station id returns ERR_DEALER_STATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/dealer-stations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: JobberAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DEALER_STATION_NOT_FOUND, http 404"

      - name: agreement_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.SupplyAgreement.fields.buyout_method", "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "buyout_method outside {UNAMORTIZED_DISCOUNT, LOST_MARGIN} is rejected at shape validation."
        test_recipe:
          setup: ["existing station"]
          setup_api_calls:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Enum", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 500000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 1000, imaging_allowance_cents: 1000, margin_tc_per_gal: 10, shortfall_penalty_tc_per_gal: 10, buyout_method: "WEEKLY" }
              as: JobberAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION_FAILED, http 400"

      - name: product_duplicate_code_rejected
        claim_type: type_constraints
        grounds: ["entities.Product.fields.product_code", "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "product_code uniqueness: second product with the same code is rejected."
        test_recipe:
          setup: ["one product REGULAR_87 exists"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
          trigger:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Duplicate", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION_FAILED, http 400"

      - name: tank_safe_fill_default_applied
        claim_type: defaults
        grounds: ["entities.StorageTank.fields.safe_fill_pct"]
        distinguishing_aspect: "Omitting safe_fill_pct on tank create applies 0.95."
        test_recipe:
          setup: ["existing station"]
          setup_api_calls:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Tk", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 500000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
          trigger:
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 1000 }
              as: JobberAdmin
              captures: { sfp: $.data.safe_fill_pct, book: $.data.book_inventory_gallons, phys: $.data.physical_gallons }
          assert:
            - "safe_fill_pct == 0.95 (default)"
            - "physical_gallons == 1000 and book_inventory_gallons == 1000 (seeded from opening)"

      - name: meter_reading_immutable_no_version_field
        claim_type: immutability
        grounds: ["entities.MeterReading"]
        distinguishing_aspect: "MeterReading is common_fields:false — response carries id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["station + tank exist"]
          setup_api_calls:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Mr", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 500000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /api/meter-readings"
              payload: { tank_id: "${t_id}", reading_at: "2026-05-01T08:00:00Z", totalizer_gallons: 5000 }
              as: DealerOperator
              as_user_id: "${s_id}"
              captures: { mr_id: $.data.id }
          assert:
            - "response contains id and created_at but no `version` and no `updated_at` key"
            - "metered_gallons == 0 (first reading is the baseline)"

      - name: audit_result_computed_boundary
        claim_type: computed_fields
        grounds: ["entities.BrandComplianceAudit.fields.result"]
        distinguishing_aspect: "result is computed (PASS at score >= 70): score 70 -> PASS, score 69 -> FAIL; boundary inclusive."
        test_recipe:
          setup: ["ACTIVE station"]
          setup_api_calls:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Aud", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 500000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
          trigger:
            - call: "POST /api/brand-compliance-audits"
              payload: { station_id: "${s_id}", audit_date: "2026-05-10", score: 70 }
              as: BrandInspector
              captures: { r70: $.data.result }
          assert:
            - "audit with score 70 has result == PASS (boundary inclusive)"
            - "station compliance_status remains COMPLIANT after a PASS"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: deliver_planned_drop_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.TransportDrop.EN_ROUTE_to_DELIVERED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "deliver from PLANNED (skipping schedule/dispatch) fails with ERR_INVALID_STATE; no invoice is created."
        test_recipe:
          setup: ["full fixture with one PLANNED drop"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Inv1", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 100000, imaging_allowance_cents: 100000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 20, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_gas}", effective_date: "2026-05-01", price_tc_per_gal: 2000 }
              as: PricingDesk
              captures: { pp_id: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-1", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 1000, window_start: "2026-05-02T08:00:00Z", window_end: "2026-05-02T12:00:00Z" }
              as: Dispatcher
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/transport-drops/${d_id}/deliver"
              payload: { delivered_gallons: 1000 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); drop stays PLANNED; no invoice linked"

      - name: cancel_reconciled_drop_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.TransportDrop.PLANNED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RECONCILED is terminal: cancel fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["full fixture; drop delivered and reconciled"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Term", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 100000, imaging_allowance_cents: 100000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 20, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_gas}", effective_date: "2026-05-01", price_tc_per_gal: 2000 }
              as: PricingDesk
              captures: { pp_id: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-1", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 1000, window_start: "2026-05-02T08:00:00Z", window_end: "2026-05-02T12:00:00Z" }
              as: Dispatcher
              captures: { d_id: $.data.id }
            - call: "POST /api/transport-drops/${d_id}/schedule"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/dispatch"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/deliver"
              payload: { delivered_gallons: 1000 }
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/reconcile"
              as: Dispatcher
          trigger:
            - call: "POST /api/transport-drops/${d_id}/cancel"
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409); drop remains RECONCILED"

      - name: post_superseded_posting_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.RackPricePosting.POSTED_to_SUPERSEDED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SUPERSEDED is terminal: posting the old posting again fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["product; posting A POSTED then superseded"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_gas}", effective_date: "2026-05-01", price_tc_per_gal: 2000 }
              as: PricingDesk
              captures: { pp_id: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
              captures: { pp_ver: $.data.version }
            - call: "POST /api/rack-price-postings/${pp_id}/supersede"
              payload: { expected_superseded_posting_version: "${pp_ver}", new_price_tc_per_gal: 2050, effective_date: "2026-05-01" }
              as: PricingDesk
          trigger:
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409) — SUPERSEDED is terminal"

      - name: invoice_auto_overdue_on_clock_advance
        claim_type: automatic_transition
        grounds: ["state_machines.Invoice.ISSUED_to_OVERDUE", "entities.Invoice.fields.due_date"]
        distinguishing_aspect: "Setting the logical clock past due_date (invoice_date 2026-05-01 + 10 terms days = 2026-05-11) auto-flips ISSUED -> OVERDUE; no explicit endpoint exists."
        test_recipe:
          setup: ["full fixture; one drop delivered at clock 2026-05-01 producing an ISSUED invoice due 2026-05-11"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { product_code: "REGULAR_87", display_name: "Regular 87", category: "GASOLINE", federal_excise_tc_per_gal: 184, temp_coeff: 0.00065 }
              as: JobberAdmin
              captures: { p_gas: $.data.id }
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Od", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 100000000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-12-31", committed_gallons: 100000, imaging_allowance_cents: 100000, margin_tc_per_gal: 25, shortfall_penalty_tc_per_gal: 20, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
            - call: "POST /api/rack-price-postings"
              payload: { terminal_code: "TX-NORTH", product_id: "${p_gas}", effective_date: "2026-05-01", price_tc_per_gal: 2000 }
              as: PricingDesk
              captures: { pp_id: $.data.id }
            - call: "POST /api/rack-price-postings/${pp_id}/post"
              as: PricingDesk
            - call: "POST /api/storage-tanks"
              payload: { station_id: "${s_id}", product_id: "${p_gas}", capacity_gallons: 20000, opening_physical_gallons: 0 }
              as: JobberAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/trucks"
              payload: { truck_code: "TRK-1", capacity_gallons: 12000 }
              as: JobberAdmin
              captures: { tr_id: $.data.id }
            - call: "POST /api/transport-drops"
              payload: { station_id: "${s_id}", tank_id: "${t_id}", truck_id: "${tr_id}", product_id: "${p_gas}", planned_gallons: 1000, window_start: "2026-05-02T08:00:00Z", window_end: "2026-05-02T12:00:00Z" }
              as: Dispatcher
              captures: { d_id: $.data.id }
            - call: "POST /api/transport-drops/${d_id}/schedule"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/dispatch"
              as: Dispatcher
            - call: "POST /api/transport-drops/${d_id}/deliver"
              payload: { delivered_gallons: 1000 }
              as: Dispatcher
              captures: { inv_id: $.data.invoice_id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T00:00:00Z" }
              as: JobberAdmin
            - call: "GET /api/invoices/${inv_id}"
              as: JobberAdmin
              captures: { st: $.data.status, dd: $.data.due_date }
          assert:
            - "Invoice due_date == 2026-05-11"
            - "Invoice status == OVERDUE after clock advanced to 2026-05-12"

      - name: agreement_auto_expired_on_clock_advance
        claim_type: automatic_transition
        grounds: ["state_machines.SupplyAgreement.ACTIVE_to_EXPIRED"]
        distinguishing_aspect: "Clock advancing past term_end_date auto-expires an ACTIVE agreement; EXPIRED is terminal (subsequent start-renewal fails)."
        test_recipe:
          setup: ["ACTIVE station; ACTIVE agreement term 2026-01-01..2026-05-10"]
          setup_api_calls:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Exp", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 500000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
              payload: { station_id: "${s_id}", term_start_date: "2026-01-01", term_end_date: "2026-05-10", committed_gallons: 1000, imaging_allowance_cents: 1000, margin_tc_per_gal: 10, shortfall_penalty_tc_per_gal: 10, buyout_method: "LOST_MARGIN" }
              as: JobberAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/supply-agreements/${a_id}/activate"
              as: JobberAdmin
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: JobberAdmin
            - call: "GET /api/supply-agreements/${a_id}"
              as: JobberAdmin
              captures: { st: $.data.status }
            - call: "POST /api/supply-agreements/${a_id}/start-renewal"
              as: JobberAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Agreement status == EXPIRED after clock passes term_end_date"
            - "start-renewal on EXPIRED fails with ERR_INVALID_STATE (409)"

      - name: cure_period_expiry_defaults_station_and_agreement
        claim_type: automatic_transition
        grounds: ["state_machines.DealerStation.compliance_status=CURE_PERIOD_to_compliance_status=DEFAULT", "state_machines.SupplyAgreement.ACTIVE_to_DEFAULT_NOTICE"]
        distinguishing_aspect: "Clock advancing past cure_started_at + 30 days (2026-05-10 + 30d = 2026-06-09) auto-flips the station to DEFAULT and cascades the agreement to DEFAULT_NOTICE — no audit needed."
        test_recipe:
          setup: ["ACTIVE station with ACTIVE agreement; FAIL audit at clock 2026-05-10 puts station in CURE_PERIOD"]
          setup_api_calls:
            - call: "POST /api/dealer-stations"
              payload: { station_name: "S-Cure", state_code: "TX", home_terminal_code: "TX-NORTH", state_excise_tc_per_gal: 200, credit_limit_cents: 500000 }
              as: JobberAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/dealer-stations/${s_id}/activate"
              as: JobberAdmin
            - call: "POST /api/supply-agreements"
