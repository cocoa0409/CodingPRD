            - { call: "POST /cement-ops/cement-batches/${b1}/finish-grinding", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "BLAINE", value: 400, cement_batch_id: "${b1}" } }
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "COMPRESSIVE_STRENGTH_28D", value: 30.0, cement_batch_id: "${b1}" } }
            - { call: "GET /cement-ops/plants/${plant}", as: ProcessEngineer, payload: {}, captures: { balance_before: "$.data.cement_tonne_balance_tonnes" } }
            - { call: "POST /cement-ops/mill-certificates", as: QualityManager, payload: { cement_batch_id: "${b1}", customer_id: "${cu1}", certified_tonnes: 574.72 }, captures: { mc1: "$.data.id" } }
            - { call: "POST /cement-ops/mill-certificates/${mc1}/issue", as: QualityManager, payload: {}, captures: { mc1_v: "$.data.version" } }
            - { call: "POST /cement-ops/loadout-orders", as: LogisticsPlanner, payload: { customer_id: "${cu1}", cement_silo_id: "${sm1}", mill_certificate_id: "${mc1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T08:00:00Z", tonnes: 120.00, expected_mill_certificate_version: "${mc1_v}" }, captures: { lo1: "$.data.id" } }
            - { call: "POST /cement-ops/_clock/set_current_utc", as: PlantAdmin, payload: { to_iso8601: "2026-08-05T06:00:00Z" } }
            - { call: "POST /cement-ops/loadout-orders/${lo1}/start-loading", as: LogisticsPlanner, payload: {} }
            - { call: "POST /cement-ops/loadout-orders/${lo1}/complete", as: LogisticsPlanner, payload: { loaded_tonnes: 120.00 } }
            - { call: "GET /cement-ops/plants/${plant}", as: LogisticsPlanner, payload: {}, captures: { balance_mid: "$.data.cement_tonne_balance_tonnes" } }
          trigger:
            - { call: "POST /cement-ops/loadout-orders/${lo1}/void", as: LogisticsPlanner, payload: { void_reason: "truck rejected at the customer gate" } }
          assert:
            - "balance_before (after finish-grinding, before any loadout) == 574.72 = 574.72 silo tonnes + 0.00 shipped"
            - "after the completion: SM1 tonnes_on_hand 454.72, reserved_tonnes 0.00, unreleased_tonnes 0.00, available_tonnes 454.72; LO1 loaded_tonnes 120.00; CU1 open_reserved_tonnes 0.00 and lifetime_loaded_tonnes 120.00"
            - "balance_mid == 574.72 — unchanged by the completion (454.72 + 120.00)"
            - "the trigger returns 200 with LoadoutOrder status VOIDED and loaded_tonnes 0.00"
            - "after the void: SM1 tonnes_on_hand 574.72 and available_tonnes 574.72; CU1 lifetime_loaded_tonnes 0.00"
            - "GET the plant again: cement_tonne_balance_tonnes == 574.72, byte-for-byte the pre-loadout value — no drift in either direction"
            - "the certificate's allocated_tonnes drops to 0.00 because the VOIDED order leaves the {RESERVED, LOADING, COMPLETED} input set"

      - name: aborting_a_burning_run_returns_the_annual_nox_budget_to_its_pre_charge_value
        grounds: >
          calculations.nox_budget_conservation defines
          permit_nox_budget_remaining_kg = round(permit_annual_nox_budget_kg -
          sum(KilnRun.nox_emitted_kg over the input set), 2) and states the invariant that abort
          both zeroes the run's nox_emitted_kg and removes it from the input set, so the remaining
          budget returns to its exact pre-charge value. §1.2 KilnRun's abort transition is declared
          as a COMPENSATION.
        distinguishing_aspect: >
          An implementation that only flips process_state to ABORTED leaves the remaining budget at
          1999244.00, permanently burning 756.00 kg of an annual permit against a run that produced
          nothing. One that zeroes nox_emitted_kg but keeps the run in the input set double-counts
          nothing but also credits nothing back if the sum is cached. The correct answer is exactly
          2000000.00 with the run reading nox_emitted_kg 0.00 and clinker_tonnes 0.00, and the
          clinker silo untouched at 0.00 tonnes_on_hand.
        test_recipe:
          setup: >
            Plant with permit_annual_nox_budget_kg 2000000. One run is lit and charged with 80.00 t
            of coal, which emits 756.00 kg of NOx and would have produced 583.78 t of clinker. The
            budget is read before the abort. The run is aborted while still BURNING.
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id", budget0: "$.data.permit_nox_budget_remaining_kg" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "LS-1", category: "LIMESTONE", cao_pct: 52.0, sio2_pct: 3.5, al2o3_pct: 1.0, fe2o3_pct: 0.5, so3_pct: 0.05, moisture_pct: 2.0, cost_per_tonne: 8.00 }, captures: { ls: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "CL-1", category: "CLAY", cao_pct: 1.0, sio2_pct: 60.0, al2o3_pct: 18.0, fe2o3_pct: 7.0, so3_pct: 0.10, moisture_pct: 12.0, cost_per_tonne: 12.00 }, captures: { cl: "$.data.id" } }
            - { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "COAL-1", category: "COAL", lhv_gj_per_tonne: 27.00, nox_kg_per_gj: 0.35, co2_kg_per_gj: 96.0, chlorine_pct: 0.02 }, captures: { coal: "$.data.id" } }
            - { call: "POST /cement-ops/kilns", as: PlantAdmin, payload: { plant_id: "${plant}", code: "K1", nominal_shc_gj_per_tonne: 3.60, cooldown_buffer_hours: 12, reline_due_hours: 4000 }, captures: { k1: "$.data.id" } }
            - { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SC1", material_kind: "CLINKER", capacity_tonnes: 20000.00, draw_rate_tonnes_per_hour: 300.00 }, captures: { sc1: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D2", target_lsf: 97.00, target_sm: 2.40, target_am: 2.45, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 82.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 18.00 }] }, captures: { d2: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/approve", as: QualityManager, payload: {}, captures: { d2_v: "$.data.version" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d2}", pile_code: "PA", expected_raw_mix_design_version: "${d2_v}" }, captures: { pa: "$.data.id" } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ls}", tonnes_as_received: 836.73, moisture_pct: 2.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${cl}", tonnes_as_received: 204.55, moisture_pct: 12.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/seal", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }, captures: { r1: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs/${r1}/light", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/kiln-runs/${r1}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${coal}", tonnes: 80.00 }, captures: { nox: "$.data.nox_emitted_kg" } }
            - { call: "GET /cement-ops/plants/${plant}", as: EnvironmentalOfficer, payload: {}, captures: { budget1: "$.data.permit_nox_budget_remaining_kg" } }
          trigger:
            - { call: "POST /cement-ops/kiln-runs/${r1}/abort", as: KilnOperator, payload: { abort_reason: "preheater tower blockage" } }
          assert:
            - "budget0 == 2000000.00 at plant creation"
            - "after the coal charge the run reads nox_emitted_kg 756.00 and clinker_tonnes 583.78, and budget1 == 1999244.00"
            - "the trigger returns 200 with process_state ABORTED and abort_reason stored"
            - "the aborted run reads nox_emitted_kg 0.00 and clinker_tonnes 0.00, while gross_energy_gj and the fuel_charges list are preserved as the fuel record"
            - "GET the plant: permit_nox_budget_remaining_kg == 2000000.00, exactly budget0 — no drift"
            - "SC1 reads tonnes_on_hand 0.00 and unreleased_tonnes 0.00: no clinker was ever credited"
            - "the pile stays status CONSUMED — the compensation restores the permit ledger, not the raw meal"
            - "Plant.rolling_nox_intensity_kg_per_tonne returns to 0.000 because the aborted run leaves the window set"
