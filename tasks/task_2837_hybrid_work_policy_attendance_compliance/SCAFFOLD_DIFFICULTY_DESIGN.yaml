              as: ComplianceAuditor
              as_user_id: "aud-1"
            - call: "POST /remote-location-requests"
              payload: { employee_id: "${e1_id}", jurisdiction_code: "US_NY", data_classification_tier: "RESTRICTED", proposed_start_date: "2026-10-01" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { ny_id: $.data.id }
            - call: "POST /remote-location-requests/${ny_id}/tax-review"
              payload: { review_outcome: "CLEARED", licensing_gap_count: 3, tax_nexus_registration_cost_cents: 5000000 }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /remote-location-requests/${ny_id}/security-review"
              payload: { review_outcome: "CLEARED", control_gap_count: 3 }
