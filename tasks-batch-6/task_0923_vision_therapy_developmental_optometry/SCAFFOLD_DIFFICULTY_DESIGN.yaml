  - rule_id: non_linear_state_machine
    instances:

      - name: claim_capped_appeal_cycle_denied_to_submitted_to_denied
        grounds:
          - state_machines.Claim.DENIED_to_SUBMITTED
          - state_machines.Claim.ACCEPTED_to_DENIED
          - validations[priority=36]
          - entities.Claim.fields.appeal_attempt_log_count
          - errors[ERR_APPEAL_LIMIT_REACHED]
        distinguishing_aspect: |
          Non-linearity on the Claim entity: DENIED -> SUBMITTED -> ACCEPTED -> DENIED is a genuine
          cycle walked twice, and the loop is closed by a capped retry counter rather than by a terminal
          state. The third appeal is a mutate-then-reject rung - appeal_attempt_log_count reaches 3 even
          though appeal_count stays at the cap of 2.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z with an ACTIVE plan and a 12-visit authorization."
            - "One completed 45-minute TIMED_THERAPEUTIC_ACTIVITY session billed at 126.00 for 3 units."
