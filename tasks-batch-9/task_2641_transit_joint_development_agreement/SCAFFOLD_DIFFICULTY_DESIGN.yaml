          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "AgencySite certified READY and released, then moved to UNDER_AGREEMENT by a direct negotiation period"
            - "Two CLEAR prequalified developers with one SUBMITTED proposal each on the same ISSUED solicitation"
