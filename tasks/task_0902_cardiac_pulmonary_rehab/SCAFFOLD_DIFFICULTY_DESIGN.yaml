            - "trigger HTTP status == 409"

      - name: program_activate_requires_approved_authorization
        grounds:
          - state_machines.RehabProgram.DRAFT_to_ACTIVE
          - entities.InsuranceAuthorization.fields.status
          - errors[ERR_NO_APPROVED_AUTHORIZATION]
        distinguishing_aspect: "Entity pair (RehabProgram, InsuranceAuthorization): activation is rejected while the program's only authorization is still PENDING; the program's DRAFT->ACTIVE transition depends on an APPROVED InsuranceAuthorization — a different entity pair than (RehabSession, RehabProgram)."
        test_recipe:
          setup:
            - "DRAFT program with a PENDING (un-approved) authorization and a FINALIZED BASELINE outcome"
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "M-014", full_name: "Pat Fourteen", date_of_birth: "1947-07-17" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr Ref", npi: "1000000014" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/clinicians", payload: { full_name: "EP Fourteen", credential: "EP" }, as: RehabCoordinator, captures: { clin: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "MODERATE" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
            - { call: "POST /rehab/referrals/${ref}/decision", payload: { decision: "ACCEPT" }, as: RehabCoordinator }
            - { call: "POST /rehab/programs", payload: { referral_id: "${ref}" }, as: RehabCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /rehab/authorizations", payload: { program_id: "${prog}", payer_name: "Acme", authorized_visits: 10, allowed_amount_cents: 18000, copay_cents: 2000 }, as: RehabCoordinator, captures: { auth: $.data.id } }
            - { call: "POST /rehab/outcomes", payload: { program_id: "${prog}", timing: "BASELINE", distance_meters: 300 }, as: RehabClinician, as_user_id: "${clin}", captures: { base_out: $.data.id } }
            - { call: "POST /rehab/outcomes/${base_out}/finalize", payload: {}, as: RehabClinician, as_user_id: "${clin}" }
          trigger:
            - { call: "POST /rehab/programs/${prog}/activate", payload: {}, as: RehabCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "trigger response data.error_id == ERR_NO_APPROVED_AUTHORIZATION"
            - "trigger HTTP status == 409"
            - "RehabProgram.${prog}.status == DRAFT (unchanged)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: station_double_booking_halfopen
        grounds:
          - validations[priority=8]
          - entities.MonitoringStation.fields.station_type
          - errors[ERR_STATION_OVERLAP]
        distinguishing_aspect: "On MonitoringStation: half-open [start,end) overlap — a second session [09:30,10:30) on the SAME station as an existing [09:00,10:00) session is rejected, while adjacency [10:00,11:00) would be allowed (touching endpoints do not overlap)."
        test_recipe:
          setup:
            - "ACTIVE MODERATE program; TELEMETRY station with a SCHEDULED session [09:00,10:00) supervised by clinician A"
          setup_api_calls:
            - { call: "POST /rehab/patients", payload: { mrn: "M-015", full_name: "Pat Fifteen", date_of_birth: "1946-06-16" }, as: RehabCoordinator, captures: { pat: $.data.id } }
            - { call: "POST /rehab/physicians", payload: { full_name: "Dr Ref", npi: "1000000015" }, as: RehabCoordinator, captures: { phy: $.data.id } }
            - { call: "POST /rehab/clinicians", payload: { full_name: "EP A", credential: "EP" }, as: RehabCoordinator, captures: { clinA: $.data.id } }
            - { call: "POST /rehab/clinicians", payload: { full_name: "EP B", credential: "RN" }, as: RehabCoordinator, captures: { clinB: $.data.id } }
            - { call: "POST /rehab/stations", payload: { name: "Tele-15", station_type: "TELEMETRY" }, as: RehabCoordinator, captures: { st: $.data.id } }
            - { call: "POST /rehab/referrals", payload: { patient_id: "${pat}", physician_id: "${phy}", program_type: "CARDIAC", indication: "post-MI", risk_stratification: "MODERATE" }, as: ReferringPhysician, as_user_id: "${phy}", captures: { ref: $.data.id } }
