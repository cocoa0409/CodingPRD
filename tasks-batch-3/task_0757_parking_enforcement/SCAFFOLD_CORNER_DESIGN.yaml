# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Municipal Parking-Enforcement & Citation Issuance — breadth probe.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7. Names are unique across
# this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_citation_reassess_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[citation-reassess-stale-version]"
          - "entities.Citation.fields.fine_amount_cents"
        distinguishing_aspect: "Reassess with the current expected_citation_version succeeds: fine_amount_cents becomes 8000 and Citation.version increments from 1 to 2."
        test_recipe:
          setup:
            - "One ISSUED citation (EXP_METER base 5000, residential => fine 5000), citation.version == 1 captured at issue."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-OC1", full_name: "O OC1" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "OCC1", name: "OccBeat1", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "OC1PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/oc1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit_id: "$.data.id", cit_v: "$.data.version" } }
          trigger:
            - { call: "POST /citations/${cit_id}/reassess", payload: { new_fine_amount_cents: 8000, expected_citation_version: "${cit_v}" }, as: Supervisor }
          assert:
            - "Citation.${cit_id}.fine_amount_cents == 8000"
            - "Citation.${cit_id}.version == 2"

      - name: occ_citation_reassess_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[citation-reassess-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "After a first reassess advances the citation version, a second reassess still carrying the original expected_citation_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "One ISSUED citation with version 1 captured; a first successful reassess advances the version to 2."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-OC2", full_name: "O OC2" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "OCC2", name: "OccBeat2", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "OC2PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/oc2.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit_id: "$.data.id", cit_v: "$.data.version" } }
            - { call: "POST /citations/${cit_id}/reassess", payload: { new_fine_amount_cents: 8000, expected_citation_version: "${cit_v}" }, as: Supervisor }
          trigger:
            - { call: "POST /citations/${cit_id}/reassess", payload: { new_fine_amount_cents: 9000, expected_citation_version: "${cit_v}" }, as: Supervisor, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 412"
            - "response error_id == ERR_STALE_VERSION"

      - name: occ_vehicle_adjustment_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[vehicle-adjustment-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "After a first waiver advances the vehicle version, a second waiver still carrying the originally observed expected_vehicle_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "Vehicle with one ISSUED citation (fine 5000); the vehicle version observed via GET; a first waiver of 1000 advances that version."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-OC3", full_name: "O OC3" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "OCC3", name: "OccBeat3", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "OC3PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/oc3.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit_id: "$.data.id" } }
            - { call: "GET /vehicles/${vehicle_id}", payload: {}, as: Supervisor, captures: { veh_v: "$.data.version" } }
            - { call: "POST /vehicles/${vehicle_id}/adjustments", payload: { citation_id: "${cit_id}", waive_amount_cents: 1000, expected_vehicle_version: "${veh_v}" }, as: Supervisor }
          trigger:
            - { call: "POST /vehicles/${vehicle_id}/adjustments", payload: { citation_id: "${cit_id}", waive_amount_cents: 1000, expected_vehicle_version: "${veh_v}" }, as: Supervisor, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 412"
            - "response error_id == ERR_STALE_VERSION"

      - name: cascade_boot_escalation_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.BootTowOrder.ORDERED_to_CANCELLED, state_machines.RegistrationHold.PLACED_to_CLEARED]
        excluded_because:
          difficulty_instance: transitive_cascade / payment_settle_to_paid_to_clear
          rationale: "The settle -> PAID -> de-escalate -> boot CANCELLED + hold CLEARED cascade is asserted end-to-end by the named §1.8 instance."

      - name: dual_variant_projected_balance_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.vehicle_balance]
        excluded_because:
          difficulty_instance: dual_variant_calc / vehicle_outstanding_vs_projected_balance
          rationale: "settled vs projected balance divergence is asserted by the named §1.8 instance."

  # ---------------------------------------------------------------- entities
  - section: entities
    instances:
      - name: create_officer_returns_201_with_id
        claim_type: Creation
        grounds: [entities.Officer, endpoints]
        distinguishing_aspect: "POST /officers with badge_number and full_name returns 201 with a server-minted id, created_at, and version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /officers", payload: { badge_number: "B-100", full_name: "Jane Officer" }, as: Admin, captures: { officer_id: "$.data.id" } }
          assert:
            - "response http_status == 201"
            - "Officer.${officer_id}.badge_number == B-100"
            - "Officer.${officer_id}.version == 1"

      - name: officer_missing_full_name_returns_validation
        claim_type: Required Fields
        grounds:
          - "entities.Officer.fields.full_name"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /officers omitting the required full_name field is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /officers", payload: { badge_number: "B-101" }, as: Admin, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 400"
            - "response error_id == ERR_VALIDATION"

      - name: get_vehicle_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "entities.Vehicle"
          - "errors[ERR_VEHICLE_NOT_FOUND]"
        distinguishing_aspect: "GET /vehicles/{id} with a non-existent UUID returns ERR_VEHICLE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /vehicles/00000000-0000-0000-0000-000000000000", payload: {}, as: Admin, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 404"
            - "response error_id == ERR_VEHICLE_NOT_FOUND"

      - name: vehicle_ledger_fields_default_zero_on_create
        claim_type: Computed Fields
        grounds: [entities.Vehicle.fields.outstanding_balance_cents, entities.Vehicle.fields.scofflaw_status, entities.Vehicle.fields.unpaid_citation_count]
        distinguishing_aspect: "A newly created Vehicle has outstanding_balance_cents=0, projected_balance_cents=0, unpaid_citation_count=0, scofflaw_status=NONE, has_active_registration_hold=false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /vehicles", payload: { plate: "NEW1", state: "NV" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
          assert:
            - "Vehicle.${vehicle_id}.outstanding_balance_cents == 0"
            - "Vehicle.${vehicle_id}.unpaid_citation_count == 0"
            - "Vehicle.${vehicle_id}.scofflaw_status == NONE"
            - "Vehicle.${vehicle_id}.has_active_registration_hold == false"

      - name: citation_issued_via_invalid_enum_returns_validation
        claim_type: Type Constraints
        grounds:
          - "entities.Citation.fields.issued_via"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "POST /citations with issued_via outside {LPR, HANDHELD} is rejected with ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Officer with OPEN shift, an ACTIVE violation code, and a vehicle all exist."]
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-EN1", full_name: "O EN1" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "ENB1", name: "EnumBeat1", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "EN1PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
          trigger:
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "DRONE", evidence_photo_url: "https://ev/en1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 400"
            - "response error_id == ERR_VALIDATION"

      - name: beat_created_has_no_version_field
        claim_type: Immutability
        grounds: [entities.Beat]
        distinguishing_aspect: "Beat is common_fields:false configuration: its create response carries id and created_at but no version and no updated_at, and there is no update/state endpoint for it."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /beats", payload: { beat_code: "IMMB", name: "Immutable Beat", patrol_zone: "SCHOOL" }, as: Admin, captures: { beat_id: "$.data.id" } }
          assert:
            - "response http_status == 201"
            - "Beat.${beat_id}.patrol_zone == SCHOOL"
            - "Beat response body has no 'version' key"

      - name: citations_list_pagination_envelope
        claim_type: Listing
        grounds: [entities.Citation, endpoints]
        distinguishing_aspect: "GET /citations?vehicle_id with limit=1 over a vehicle holding 2 citations returns total_count=2, has_more=true, and exactly 1 element."
        test_recipe:
          setup:
            - "One vehicle with 2 issued STREET_CLEAN citations."
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-PG1", full_name: "O PG1" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "PGB1", name: "PageBeat1", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "STREET_CLEAN", description: "Street cleaning", base_fine_cents: 6000, is_booting_eligible: false }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "PG1PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/pg1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}" }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/pg2.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}" }
          trigger:
            - { call: "GET /citations", payload: { vehicle_id: "${vehicle_id}", limit: 1, offset: 0 }, as: Admin }
          assert:
            - "response total_count == 2"
            - "response has_more == true"
            - "response data array length == 1"

  # ----------------------------------------------------------- state_machines
  - section: state_machines
    instances:
      - name: void_already_void_citation_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Citation.ISSUED_to_VOID"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Voiding a citation already in terminal VOID is rejected with ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["One ISSUED citation, then voided (terminal VOID)."]
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-SM1", full_name: "O SM1" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "SMB1", name: "SmBeat1", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "SM1PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/sm1.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit_id: "$.data.id" } }
            - { call: "POST /citations/${cit_id}/void", payload: {}, as: Supervisor }
          trigger:
            - { call: "POST /citations/${cit_id}/void", payload: {}, as: Supervisor, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: settle_already_settled_payment_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - "state_machines.Payment.PENDING_to_SETTLED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Settling a payment already in SETTLED is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["One ISSUED citation (fine 5000) with a card payment of 5000 that has been SETTLED."]
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-SM2", full_name: "O SM2" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "SMB2", name: "SmBeat2", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "SM2PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/sm2.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit_id: "$.data.id" } }
            - { call: "POST /payments", payload: { citation_id: "${cit_id}", amount_cents: 5000, method: "CARD" }, as: Motorist, captures: { pay_id: "$.data.id" } }
            - { call: "POST /payments/${pay_id}/settle", payload: {}, as: Motorist }
          trigger:
            - { call: "POST /payments/${pay_id}/settle", payload: {}, as: Motorist, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: refund_pending_payment_returns_not_refundable
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Payment.SETTLED_to_REFUNDED"
          - "errors[ERR_PAYMENT_NOT_REFUNDABLE]"
        distinguishing_aspect: "Refunding a payment still in PENDING (never settled) is rejected with ERR_PAYMENT_NOT_REFUNDABLE (409)."
        test_recipe:
          setup: ["One ISSUED citation (fine 5000) with a PENDING card payment of 5000 (not settled)."]
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-SM3", full_name: "O SM3" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "SMB3", name: "SmBeat3", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "SM3PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/sm3.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit_id: "$.data.id" } }
            - { call: "POST /payments", payload: { citation_id: "${cit_id}", amount_cents: 5000, method: "CARD" }, as: Motorist, captures: { pay_id: "$.data.id" } }
          trigger:
            - { call: "POST /payments/${pay_id}/refund", payload: {}, as: Supervisor, captures: { err: "$.data.error_id" } }
          assert:
            - "response http_status == 409"
            - "response error_id == ERR_PAYMENT_NOT_REFUNDABLE"

      - name: decide_hearing_invalid_decision_returns_error
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Hearing.SCHEDULED_to_HELD"
          - "errors[ERR_HEARING_DECISION_INVALID]"
        distinguishing_aspect: "POST /hearings/{id}/decide with a decision outside {UPHELD, DISMISSED} is rejected with ERR_HEARING_DECISION_INVALID (422)."
        test_recipe:
          setup: ["A SCHEDULED hearing for a SUBMITTED contest on an ISSUED citation."]
          setup_api_calls:
            - { call: "POST /officers", payload: { badge_number: "B-SM4", full_name: "O SM4" }, as: Admin, captures: { officer_id: "$.data.id" } }
            - { call: "POST /beats", payload: { beat_code: "SMB4", name: "SmBeat4", patrol_zone: "RESIDENTIAL" }, as: Admin, captures: { beat_id: "$.data.id" } }
            - { call: "POST /violation-codes", payload: { code: "EXP_METER", description: "Expired meter", base_fine_cents: 5000, is_booting_eligible: true }, as: Admin, captures: { vc_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { plate: "SM4PLT", state: "CA" }, as: Admin, captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /shifts", payload: { officer_id: "${officer_id}", beat_id: "${beat_id}", scheduled_start: "2026-03-02T08:00:00Z", scheduled_end: "2026-03-02T16:00:00Z" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { shift_id: "$.data.id" } }
            - { call: "POST /citations", payload: { vehicle_id: "${vehicle_id}", shift_id: "${shift_id}", violation_code_id: "${vc_id}", issued_via: "LPR", evidence_photo_url: "https://ev/sm4.jpg" }, as: EnforcementOfficer, as_user_id: "${officer_id}", captures: { cit_id: "$.data.id" } }
