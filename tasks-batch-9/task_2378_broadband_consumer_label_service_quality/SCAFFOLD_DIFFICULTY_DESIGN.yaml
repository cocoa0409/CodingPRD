      - name: invalidate_run_five_hop_substantiation_cascade
        grounds:
          - state_machines.TestRun.INCLUDED_to_INVALIDATED
          - endpoints.POST_test_runs_id_invalidate
          - calculations.plan_label_posture
          - entities.ServicePlan.fields.evidence_sample_total
        distinguishing_aspect: |
          The evidence chain: run -> plan sample total -> attestation status -> label substantiation ->
          plan posture. Each hop is *caused by* the previous one (the attestation is only revoked
          because the recomputed sample total fell below its snapshotted minimum, and the posture only
          freezes because the label became unsubstantiated), and it is triggered by a network-side
          invalidation. The declared additional consequence (Complaint.evidence_gap) fans out from hop
          4 rather than continuing the chain, so it is called out separately below.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (the scaffold default 2026-08-01T00:00:00Z is repositioned first)."
            - "ServicePlan FIBER300 (advertised 300/140, intro 4999 for 6 months, post-promotional 7999, ETF 12000 PRORATED_MONTHLY, required_locales [en-US])."
            - "Five FeeLineItems: EQUIP_RENTAL 1500 ALWAYS, NETWORK_ACCESS 700 POST_PROMO_ONLY, REG_RECOVERY 3.25% ALWAYS, STATE_USF 2.11% ALWAYS, INSTALL 9900 ONE_TIME."
