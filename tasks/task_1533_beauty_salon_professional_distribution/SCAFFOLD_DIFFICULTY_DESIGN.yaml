            - { call: "POST /api/licenses/${lic_id}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/brands", payload: { name: "BrandF" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-F1", name: "Pomade", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 10000, weight_grams: 100 }, as: DistributionAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p1}", quantity: 1 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /api/orders/${o_id}/submit", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "POST /api/diversion-cases", payload: { salon_account_id: "${s_id}", product_id: "${p1}", severity: MAJOR, evidence_note: "marketplace listing", hold_shipments: false }, as: SalesConsultant, as_user_id: "${c_id}", captures: { dc1: "$.data.id" } }
            - { call: "POST /api/diversion-cases/${dc1}/start-review", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /api/diversion-cases/${dc1}/substantiate", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "POST /api/diversion-cases", payload: { salon_account_id: "${s_id}", product_id: "${p1}", severity: MAJOR, evidence_note: "retail shelf sighting", hold_shipments: false }, as: SalesConsultant, as_user_id: "${c_id}", captures: { dc2: "$.data.id" } }
            - { call: "POST /api/diversion-cases/${dc2}/start-review", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
          trigger:
            - { call: "POST /api/diversion-cases/${dc2}/substantiate", payload: {}, as: ComplianceOfficer, as_user_id: "officer-1" }
            - { call: "GET /api/salon-accounts/${s_id}", payload: {}, as: ComplianceOfficer }
            - { call: "GET /api/orders/${o_id}", payload: {}, as: ComplianceOfficer }
          assert:
            - "SalonAccount.${s_id}.diversion_strike_points == 4 (2 + 2)"
            - "SalonAccount.${s_id}.status == SUSPENDED with suspension_reason == DIVERSION_STRIKES"
            - "SalonAccount.${s_id}.diversion_risk_score == 4.0 (2 cases x 2 points x decay 1.0)"
            - "Order.${o_id}.fulfillment_status == CANCELLED and payment_status == VOIDED"
            - "SalonAccount.${s_id}.education_credit_points == 0"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_salon_suspended_beats_credit_balance
        grounds:
          - validations[priority=7]
          - validations[priority=20]
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
          - errors[ERR_INSUFFICIENT_CREDIT_BALANCE]
        distinguishing_aspect: |
