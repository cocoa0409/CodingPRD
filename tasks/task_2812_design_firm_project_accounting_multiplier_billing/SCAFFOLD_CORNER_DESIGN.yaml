            - "ACTIVE T&M project, target_multiplier 3.0000, EFFORT_BASED, rate 62.50, phase fee 200000.00 with labor budget 60000.00"
            - "multiplier 2.5000 effective 2026-01-01 superseded by 3.0500 effective 2026-05-01"
