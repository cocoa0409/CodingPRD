            - "the DEFERRED call returns 200 and ResidentCouncilRequest.${req_id}.status == DEFERRED"
            - "ResidentCouncilRequest.${req_id}.decision_note == \"Revisit after the next council meeting\""
            - "ActivityProgram.${prog_id}.council_preference_weight == 0"
      - name: duplicate_outing_consent_rejected
