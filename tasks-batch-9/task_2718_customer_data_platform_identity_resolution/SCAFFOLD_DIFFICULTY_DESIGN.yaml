  # =============================================================================
  # RULE 3 — non_linear_state_machine
  # Differentiation required by §0.5: the two instances must be on DIFFERENT entities.
  # Instance 1 is Profile (parallel dimensions on one row); instance 2 is IdentityLink
  # (branching fork with disjoint side-effect sets from a single trigger).
  # =============================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: profile_privacy_axis_moves_without_touching_resolution_axis
        grounds:
          - state_machines.Profile.NORMAL_to_SUPPRESSED
          - state_machines.Profile.SUPPRESSED_to_NORMAL
          - state_machines.Profile.RESOLVED_to_MERGED_AWAY
          - entities.Profile.fields.privacy_status
          - entities.Profile.fields.resolution_status
          - calculations.effective_channel_consent
        distinguishing_aspect: |
          Entity: Profile. The SAME row travels NORMAL -> SUPPRESSED -> NORMAL on the
          privacy_status axis while resolution_status stays RESOLVED at every step, and then
          travels RESOLVED -> MERGED_AWAY on the resolution axis while privacy_status stays
          NORMAL — neither axis is a precondition of the other, and the combined state is
          observable at each of the three steps.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem WEB_TAG and one PROMOTED batch of two fully valid records, so two RESOLVED / NORMAL Profiles exist with source_record_count 1 each; the second-created profile is the merge loser because both discriminators (source_record_count, trust_tier) tie and created_at breaks the tie."
            - "One PROBABILISTIC MatchRule PROB_AXIS created after the promote: STRICT_ZERO, review_floor 0.65, auto_merge_threshold 0.92, min_precision 0.40."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
