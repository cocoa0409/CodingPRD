# =============================================================================
# Eating-Disorder & Behavioral Treatment Program — seed tables (v1)
# Difficulty band: Expert (§0.4)
# Topology: FLAT — peer entities linked by foreign keys; collections are
# top-level under /edt; FK reverse-reachability via filtered-list GETs.
# =============================================================================

scenario: |
  635. Eating-Disorder & Behavioral Treatment Program (residential/PHP/IOP):
  assessment & level-of-care criteria, admission & bed/cohort, meal plan &
  supervised-meal protocol, multidisciplinary treatment plan
  (therapy/dietitian/medical), insurance authorization & concurrent review,
  step-down (PHP->IOP->OP), family program, discharge & relapse plan

domain_name: eating-disorder-treatment
api_prefix: /edt

complexity_profile:
  primary_archetype: quota_allocation          # finite beds/cohort slots reserved, committed, released
  secondary_archetype: compliance_audit         # insurance authorization windows + concurrent review + medical clearance gating
  complexity_layers:
    - optimistic_concurrency                    # OCC on Patient.version / Admission.version for supersede writes
    - cascading_side_effects                     # discharge -> bed release -> waitlist/risk recompute chains
    - dual_variant_calculation                   # authorized-days (forward vs chronological); nutritional-risk (provisional vs reconciled)
    - rate_threshold_triggers                    # occupancy FULL boundary; meal-compliance step-down boundary
    - derived_field_reconciliation               # beds_occupied, occupancy_posture, days_remaining kept consistent

  entity_topology: flat                          # peer entities; FK references in bodies; collections are not nested in URL paths
  state_machine_shape: parallel                  # Admission carries (clinical_status x level_of_care) independent dimensions
  relationship_patterns:
    - one_to_many                                # facility->programs, program->cohorts, meal_plan->meal_events
    - cross_aggregate                            # Admission references Program, Cohort, Patient by FK across the flat web
    - polymorphic                                # ConcurrentReview decisions apply to an InsuranceAuthorization
  role_model: peer_roles                         # Intake, Clinician, Dietitian, UtilizationReviewer, Admin own different surfaces
  consistency_model: immediate                   # all cascades resolve atomically within the triggering request

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: timezone, type: string, source: input, required: false, default: "UTC", description: "Display timezone label; clock math always uses the logical UTC clock" }

  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: level_of_care, type: enum, source: input, description: "Program level: RESIDENTIAL | PHP | IOP | OP", constraints: "one of RESIDENTIAL, PHP, IOP, OP" }
      - { name: bed_capacity, type: integer, source: input, description: "Total beds (RESIDENTIAL/PHP) or virtual slots (IOP/OP); must be >= 1" }
      - { name: beds_occupied, type: integer, source: computed, default: 0, description: "Count of admissions occupying a bed in this program (clinical_status in {ADMITTED, MEDICAL_HOLD, DISCHARGE_PENDING})" }
      - { name: beds_available, type: integer, source: computed, description: "= max(bed_capacity - beds_occupied, 0)" }
      - { name: occupancy_posture, type: enum, source: computed, default: "OPEN", description: "OPEN when beds_occupied < bed_capacity; FULL when beds_occupied >= bed_capacity", constraints: "one of OPEN, FULL" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | CLOSED; CLOSED programs reject new admissions", constraints: "one of OPEN, CLOSED" }

  - name: Cohort
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: name, type: string, source: input, description: "Cohort label (e.g., 'Adolescent AM')" }
      - { name: age_band, type: enum, source: input, description: "ADOLESCENT | ADULT; admitted patient age_band must match", constraints: "one of ADOLESCENT, ADULT" }
      - { name: slot_capacity, type: integer, source: input, description: "Max concurrent active members in this cohort; must be >= 1" }
      - { name: slots_filled, type: integer, source: computed, default: 0, description: "Count of admissions assigned to this cohort with clinical_status in {ADMITTED, MEDICAL_HOLD, DISCHARGE_PENDING}" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: full_name, type: string, source: input, description: "Patient name" }
      - { name: age_band, type: enum, source: input, description: "ADOLESCENT | ADULT", constraints: "one of ADOLESCENT, ADULT" }
      - { name: bmi, type: number, source: input, description: "Body mass index at intake; positive number" }
      - { name: medical_stability_posture, type: enum, source: computed, default: "STABLE", description: "STABLE | GUARDED | UNSTABLE derived from nutritional_risk_score thresholds; gates which level_of_care is admissible", constraints: "one of STABLE, GUARDED, UNSTABLE" }
      - { name: nutritional_risk_score, type: number, source: computed, default: 0, description: "Reconciled nutritional-risk score (0-100); reconciled variant updated on meal-plan close and medical holds" }
      - { name: provisional_nutritional_risk_score, type: number, source: computed, default: 0, description: "Provisional nutritional-risk score computed at admission from the active assessment; never mutated by meal events" }
      - { name: active_assessment_id, type: string, source: computed, required: false, description: "Denormalized pointer holding the id of the single FINALIZED Assessment currently governing this patient (null until first finalize); the assessment itself is discoverable via GET /edt/assessments?patient_id=..." }

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: medical_severity, type: integer, source: input, description: "Medical severity rating 0-10 (vitals, electrolytes, bradycardia)" }
      - { name: behavioral_severity, type: integer, source: input, description: "Behavioral/purge-restrict severity rating 0-10" }
      - { name: psychiatric_severity, type: integer, source: input, description: "Comorbid psychiatric severity rating 0-10 (suicidality, OCD)" }
      - { name: motivation_level, type: integer, source: input, description: "Patient motivation/insight rating 0-10 (higher reduces required intensity)" }
      - { name: composite_score, type: number, source: computed, description: "Weighted composite (0-100) per recommended_level_of_care formula" }
      - { name: recommended_level_of_care, type: enum, source: computed, description: "RESIDENTIAL | PHP | IOP | OP derived from composite_score thresholds", constraints: "one of RESIDENTIAL, PHP, IOP, OP" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | FINALIZED | SUPERSEDED", constraints: "one of DRAFT, FINALIZED, SUPERSEDED" }

  - name: Admission
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the program currently housing this admission" }
      - { name: cohort_id, type: string, source: input, description: "FK -> Cohort.id; cohort within the program" }
      - { name: requested_length_of_stay_days, type: integer, source: input, description: "Clinically requested days at admission; positive integer used by the forward-looking days projection" }
      - { name: clinical_status, type: enum, source: system, default: "WAITLISTED", description: "WAITLISTED | PENDING_ADMISSION | ADMITTED | MEDICAL_HOLD | DISCHARGE_PENDING | DISCHARGED | ADMINISTRATIVE_DISCHARGE", constraints: "one of WAITLISTED, PENDING_ADMISSION, ADMITTED, MEDICAL_HOLD, DISCHARGE_PENDING, DISCHARGED, ADMINISTRATIVE_DISCHARGE" }
      - { name: level_of_care, type: enum, source: system, required: false, description: "Independent dimension: RESIDENTIAL -> PHP -> IOP -> OP step-down ladder; set from program at admit", constraints: "one of RESIDENTIAL, PHP, IOP, OP" }
      - { name: admitted_at_iso, type: datetime, source: system, required: false, description: "Logical-clock timestamp when clinical_status entered ADMITTED" }
      - { name: loc_entered_at_iso, type: datetime, source: system, required: false, description: "Logical-clock timestamp when current level_of_care was entered (resets on each step-down)" }
      - { name: discharged_at_iso, type: datetime, source: system, required: false, description: "Logical-clock timestamp of discharge" }
      - { name: waitlist_promoted, type: boolean, source: computed, default: false, description: "True once this admission was auto-promoted off the waitlist by a discharge cascade" }

  - name: InsuranceAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: payer_name, type: string, source: input, description: "Insurer name" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Contracted daily rate in cents; positive integer" }
      - { name: coinsurance_pct, type: number, source: input, description: "Patient coinsurance fraction 0.0-1.0 applied per covered day" }
      - { name: days_authorized, type: integer, source: computed, default: 0, description: "Total covered days granted; grows as concurrent reviews approve extensions" }
      - { name: days_consumed, type: integer, source: computed, default: 0, description: "Covered days elapsed up to the logical clock (chronological variant)" }
      - { name: days_remaining, type: integer, source: computed, description: "= max(days_authorized - days_consumed, 0); conserved with days_consumed" }
      - { name: covered_through_iso, type: datetime, source: computed, required: false, description: "End instant of the latest contiguous covered window (null until first APPROVE)" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED | DENIED | APPEALED | EXPIRED | EXHAUSTED", constraints: "one of PENDING, APPROVED, DENIED, APPEALED, EXPIRED, EXHAUSTED" }

  - name: ConcurrentReview
    parent: null
    common_fields: true
    fields:
      - { name: authorization_id, type: string, source: input, description: "FK -> InsuranceAuthorization.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: decision, type: enum, source: input, description: "APPROVE | DENY decision rendered by the payer at this review", constraints: "one of APPROVE, DENY" }
      - { name: window_start_iso, type: datetime, source: input, required: false, description: "Inclusive start instant of the extension coverage window (required when decision=APPROVE)" }
      - { name: window_end_iso, type: datetime, source: input, required: false, description: "Exclusive end instant of the extension window, half-open [start, end) (required when decision=APPROVE)" }
      - { name: approved_days, type: integer, source: computed, default: 0, description: "Whole covered days granted by this review on APPROVE (else 0)" }

  - name: TreatmentPlan
    parent: null
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: therapy_signed, type: boolean, source: computed, default: false, description: "True once a Clinician signs the THERAPY discipline" }
      - { name: dietitian_signed, type: boolean, source: computed, default: false, description: "True once a Dietitian signs the DIETITIAN discipline" }
      - { name: medical_signed, type: boolean, source: computed, default: false, description: "True once a Clinician signs the MEDICAL discipline" }
      - { name: goals_total, type: integer, source: input, description: "Number of treatment goals defined; positive integer" }
      - { name: goals_met, type: integer, source: computed, default: 0, description: "Number of goals marked met; 0 <= goals_met <= goals_total" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ACTIVE | REVISION | SUPERSEDED | CLOSED", constraints: "one of DRAFT, ACTIVE, REVISION, SUPERSEDED, CLOSED" }

  - name: MealPlan
    parent: null
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: required_meals_per_day, type: integer, source: input, description: "Supervised meals+snacks scheduled per day; 1-6" }
      - { name: supervision_level, type: enum, source: input, description: "FULL | PARTIAL supervision intensity", constraints: "one of FULL, PARTIAL" }
      - { name: meals_logged, type: integer, source: computed, default: 0, description: "Count of MealEvent rows logged" }
      - { name: completion_points, type: number, source: computed, default: 0, description: "Sum of per-event completion fractions (0.0-1.0 each)" }
      - { name: meal_compliance_rate, type: number, source: computed, default: 0, description: "= completion_points / meals_logged (0.0-1.0); 0 when no events" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CLOSED", constraints: "one of ACTIVE, CLOSED" }

  - name: MealEvent
    parent: null
    common_fields: false   # append-only log: id + created_at only
    fields:
      - { name: meal_plan_id, type: string, source: input, description: "FK -> MealPlan.id" }
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id" }
      - { name: meal_type, type: enum, source: input, description: "BREAKFAST | LUNCH | DINNER | SNACK", constraints: "one of BREAKFAST, LUNCH, DINNER, SNACK" }
      - { name: completion_fraction, type: number, source: input, description: "Fraction of meal completed 0.0-1.0" }
      - { name: refused, type: boolean, source: input, required: false, default: false, description: "True if meal fully refused (forces effective completion to 0.0)" }
      - { name: logged_at_iso, type: datetime, source: system, description: "Logical-clock instant the event was logged" }

  - name: FamilyProgramEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: family_contact_name, type: string, source: input, description: "Primary family participant name" }
      - { name: sessions_required, type: integer, source: input, description: "Family sessions required before discharge; >= 0" }
      - { name: sessions_completed, type: integer, source: computed, default: 0, description: "Family sessions completed" }
      - { name: status, type: enum, source: system, default: "ENROLLED", description: "ENROLLED | COMPLETED | WAIVED", constraints: "one of ENROLLED, COMPLETED, WAIVED" }

  - name: DischargePlan
    parent: null
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: aftercare_level_of_care, type: enum, source: input, description: "Recommended step-down LOC after discharge: PHP | IOP | OP | NONE", constraints: "one of PHP, IOP, OP, NONE" }
      - { name: relapse_warning_signs, type: string, source: input, description: "Free-text relapse warning signs; non-empty" }
      - { name: relapse_plan_complete, type: boolean, source: input, description: "True when the relapse-prevention plan is filled out" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | FINALIZED", constraints: "one of DRAFT, FINALIZED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # ---- Admission: PARALLEL dimensions (clinical_status x level_of_care) ----
  - entity: Admission
    initial_state: WAITLISTED          # clinical_status dimension
    terminal_states: [DISCHARGED, ADMINISTRATIVE_DISCHARGE]
    note: |
      Two independent dimensions on the same row. clinical_status is the
      lifecycle below. level_of_care is the orthogonal step-down ladder
      (RESIDENTIAL -> PHP -> IOP -> OP) advanced only by the dedicated step-down
      transition; level_of_care never moves backward and is independent of
      clinical_status except where preconditions cross-reference it.
    transitions:
      # --- clinical_status dimension ---
      - from: WAITLISTED
        to: PENDING_ADMISSION
        trigger: "POST /edt/admissions/{aid}/promote OR system (discharge waitlist-promotion cascade)"
        actor: Intake | system
        preconditions:
          - "Admission.clinical_status == WAITLISTED (ERR_INVALID_STATE)"
          - "Program.status == OPEN (ERR_PROGRAM_CLOSED)"
        side_effects:
          - "waitlist_promoted set true when promoted by the discharge cascade"

      - from: PENDING_ADMISSION
        to: ADMITTED
        trigger: "POST /edt/admissions/{aid}/admit"
        actor: Intake
        preconditions:
          - "Admission.clinical_status == PENDING_ADMISSION (ERR_INVALID_STATE)"
          - "Cohort.age_band == Patient.age_band (ERR_COHORT_AGE_MISMATCH)"
          - "Patient.medical_stability_posture admissible for program.level_of_care: UNSTABLE only into RESIDENTIAL (ERR_LOC_NOT_ADMISSIBLE)"
          - "Program.status == OPEN (ERR_PROGRAM_CLOSED)"
          - "Program.occupancy_posture == OPEN, i.e. beds_occupied < bed_capacity (ERR_PROGRAM_AT_CAPACITY)"
          - "Cohort.slots_filled < Cohort.slot_capacity (ERR_COHORT_FULL)"
          - "An InsuranceAuthorization for this admission exists with status == APPROVED and days_remaining >= 1 (ERR_NO_ACTIVE_AUTHORIZATION)"
        side_effects:
          - "level_of_care = Program.level_of_care"
          - "admitted_at_iso = current logical clock; loc_entered_at_iso = current logical clock"
          - "Program.beds_occupied += 1; recompute Program.beds_available and Program.occupancy_posture"
          - "Cohort.slots_filled += 1"
        note: "Provisional risk + posture were already set at Assessment finalize; admit does not recompute them."

      - from: ADMITTED
        to: MEDICAL_HOLD
        trigger: "POST /edt/admissions/{aid}/medical-hold"
        actor: Clinician
        preconditions:
          - "Admission.clinical_status == ADMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "Patient.nutritional_risk_score += MEDICAL_HOLD_RISK_BUMP (reconciled variant); recompute Patient.medical_stability_posture"

      - from: MEDICAL_HOLD
        to: ADMITTED
        trigger: "POST /edt/admissions/{aid}/clear-hold"
        actor: Clinician
        preconditions:
          - "Admission.clinical_status == MEDICAL_HOLD (ERR_INVALID_STATE)"
        side_effects:
          - "No risk reversal: the hold bump persists (compensation only via reconciliation on meal-plan close)"
        note: "Cycle: ADMITTED <-> MEDICAL_HOLD (non-linear)."

      - from: ADMITTED
        to: DISCHARGE_PENDING
        trigger: "POST /edt/admissions/{aid}/begin-discharge OR system (authorization-expiry/exhaustion cascade)"
        actor: Clinician | system
        preconditions:
          - "Admission.clinical_status == ADMITTED (ERR_INVALID_STATE)"
        side_effects: []

      - from: DISCHARGE_PENDING
        to: DISCHARGED
        trigger: "POST /edt/admissions/{aid}/discharge"
        actor: Clinician
        preconditions:
          - "Admission.clinical_status == DISCHARGE_PENDING (ERR_INVALID_STATE)"
          - "A DischargePlan for this admission exists with status == FINALIZED (ERR_DISCHARGE_PLAN_NOT_FINALIZED)"
          - "FamilyProgramEnrollment.status in {COMPLETED, WAIVED} (ERR_FAMILY_PROGRAM_INCOMPLETE)"
        side_effects:
          - "discharged_at_iso = current logical clock"
          - "Program.beds_occupied -= 1; recompute Program.beds_available and Program.occupancy_posture"
          - "Cohort.slots_filled -= 1"
          - "Associated MealPlan(s) in ACTIVE -> CLOSED (cascade hop 1)"
          - "MealPlan close reconciles Patient.nutritional_risk_score (cascade hop 2) -> recompute Patient.medical_stability_posture (cascade hop 3)"
          - "Active/REVISION/DRAFT TreatmentPlan -> CLOSED"
          - "If Program.occupancy_posture flipped FULL->OPEN, promote the earliest-created (created_at ASC) WAITLISTED admission in the same program to PENDING_ADMISSION (separate waitlist cascade)"

      - from: PENDING_ADMISSION
        to: ADMINISTRATIVE_DISCHARGE
        trigger: "POST /edt/admissions/{aid}/admin-discharge"
        actor: Admin
        preconditions:
          - "Admission.clinical_status in {WAITLISTED, PENDING_ADMISSION} (ERR_INVALID_STATE)"
        side_effects:
          - "No bed/cohort counters change (admission never occupied a bed)"

      - from: WAITLISTED
        to: ADMINISTRATIVE_DISCHARGE
        trigger: "POST /edt/admissions/{aid}/admin-discharge"
        actor: Admin
        preconditions:
          - "Admission.clinical_status in {WAITLISTED, PENDING_ADMISSION} (ERR_INVALID_STATE)"
        side_effects: []

      # --- level_of_care dimension (orthogonal step-down ladder) ---
      - from: "level_of_care: RESIDENTIAL|PHP|IOP"
        to: "level_of_care: next lower rung (PHP|IOP|OP)"
        trigger: "POST /edt/admissions/{aid}/step-down"
        actor: Clinician
        preconditions:
          - "Admission.clinical_status == ADMITTED (ERR_INVALID_STATE)"
          - "Admission.level_of_care != OP, i.e. a lower rung exists (ERR_ALREADY_LOWEST_LOC)"
          - "TreatmentPlan for this admission exists with status == ACTIVE (ERR_TREATMENT_PLAN_NOT_ACTIVE)"
          - "MealPlan.meal_compliance_rate >= MEAL_COMPLIANCE_FLOOR (0.80) with meals_logged >= MIN_MEALS_FOR_STEP_DOWN (3) (ERR_INSUFFICIENT_MEAL_COMPLIANCE)"
          - "step_down_readiness_score >= STEP_DOWN_THRESHOLD (75) (ERR_STEP_DOWN_NOT_READY)"
        side_effects:
          - "level_of_care advances one rung down the ladder RESIDENTIAL->PHP->IOP->OP"
          - "loc_entered_at_iso = current logical clock"
        note: "Orthogonal to clinical_status; admission stays ADMITTED while LOC changes."

  # ---- InsuranceAuthorization: CYCLIC (concurrent-review loop + appeal loop) ----
  - entity: InsuranceAuthorization
    initial_state: PENDING
    terminal_states: [EXPIRED, EXHAUSTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /edt/reviews (authorization_id=..., decision=APPROVE)"
        actor: UtilizationReviewer
        preconditions:
          - "InsuranceAuthorization.status in {PENDING, APPROVED, APPEALED} (ERR_INVALID_STATE)"
          - "window_end_iso > window_start_iso (ERR_INVALID_WINDOW)"
          - "First APPROVE on a PENDING auth: any window accepted (no prior coverage to overlap)"
        side_effects:
          - "approved_days = whole days in [window_start_iso, window_end_iso)"
          - "days_authorized += approved_days; recompute days_remaining and covered_through_iso = window_end_iso"
          - "status -> APPROVED"

      - from: APPROVED
        to: APPROVED
        trigger: "POST /edt/reviews (authorization_id=..., decision=APPROVE)"
        actor: UtilizationReviewer
        preconditions:
          - "InsuranceAuthorization.status in {PENDING, APPROVED, APPEALED} (ERR_INVALID_STATE)"
          - "window_end_iso > window_start_iso (ERR_INVALID_WINDOW)"
          - "Extension contiguity: window_start_iso == covered_through_iso, gap=0 required (ERR_AUTH_WINDOW_NONCONTIGUOUS)"
          - "window does not overlap a prior APPROVED window (ERR_AUTH_WINDOW_OVERLAP)"
        side_effects:
          - "approved_days = whole days in [window_start_iso, window_end_iso); days_authorized += approved_days; recompute days_remaining and covered_through_iso = window_end_iso"
        note: "Self-loop: concurrent-review extension (cycle)."

      - from: APPROVED
        to: DENIED
        trigger: "POST /edt/reviews (authorization_id=..., decision=DENY)"
        actor: UtilizationReviewer
        preconditions:
          - "InsuranceAuthorization.status in {PENDING, APPROVED, APPEALED} (ERR_INVALID_STATE)"
        side_effects:
          - "No change to days_authorized; ConcurrentReview row appended with decision=DENY; status -> DENIED"

      - from: PENDING
        to: DENIED
        trigger: "POST /edt/reviews (authorization_id=..., decision=DENY)"
        actor: UtilizationReviewer
        preconditions:
          - "InsuranceAuthorization.status in {PENDING, APPROVED, APPEALED} (ERR_INVALID_STATE)"
        side_effects:
          - "status -> DENIED; ConcurrentReview row appended with decision=DENY"

      - from: DENIED
        to: APPEALED
        trigger: "POST /edt/authorizations/{authId}/appeal"
        actor: UtilizationReviewer
        preconditions:
          - "InsuranceAuthorization.status == DENIED (ERR_INVALID_STATE)"
        side_effects: []
        note: "Cycle: DENIED -> APPEALED -> (APPROVED | DENIED) negotiation rounds."

      - from: APPEALED
        to: DENIED
        trigger: "POST /edt/reviews (authorization_id=..., decision=DENY)"
        actor: UtilizationReviewer
        preconditions:
          - "InsuranceAuthorization.status in {PENDING, APPROVED, APPEALED} (ERR_INVALID_STATE)"
        side_effects:
          - "status -> DENIED; ConcurrentReview row appended with decision=DENY"

      - from: APPROVED
        to: EXPIRED
        trigger: "POST /edt/authorizations/{authId}/expire OR system (clock passes covered_through_iso)"
        actor: UtilizationReviewer | system
        preconditions:
          - "InsuranceAuthorization.status in {PENDING, APPROVED, DENIED, APPEALED} (ERR_INVALID_STATE)"
          - "Logical clock >= covered_through_iso (ERR_AUTH_NOT_EXPIRABLE)"
        side_effects:
          - "status -> EXPIRED"
          - "If parent Admission.clinical_status == ADMITTED, cascade Admission ADMITTED -> DISCHARGE_PENDING (authorization-expiry cascade)"

      - from: APPROVED
        to: EXHAUSTED
        trigger: "system (days_remaining reaches 0 at the boundary while consuming days)"
        actor: system
        preconditions:
          - "InsuranceAuthorization.status == APPROVED and days_remaining == 0 (ERR_INVALID_STATE)"
        side_effects:
          - "status -> EXHAUSTED"
          - "If parent Admission.clinical_status == ADMITTED, cascade Admission ADMITTED -> DISCHARGE_PENDING"

  # ---- TreatmentPlan: BRANCHING fork-join (three discipline sign-offs converge) ----
  - entity: TreatmentPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CLOSED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "POST /edt/treatment-plans/{tpId}/sign (discipline in {THERAPY, DIETITIAN, MEDICAL})"
        actor: Clinician | Dietitian
        preconditions:
          - "TreatmentPlan.status in {DRAFT, REVISION} (ERR_INVALID_STATE)"
          - "THERAPY/MEDICAL sign requires actor role Clinician; DIETITIAN sign requires actor role Dietitian (ERR_UNAUTHORIZED)"
          - "The named discipline is not already signed (ERR_DISCIPLINE_ALREADY_SIGNED)"
        side_effects:
          - "Set the corresponding *_signed flag true (fork branch completes)"

      - from: DRAFT
        to: ACTIVE
        trigger: "POST /edt/treatment-plans/{tpId}/activate"
        actor: Clinician
        preconditions:
          - "TreatmentPlan.status == DRAFT (ERR_INVALID_STATE)"
          - "therapy_signed AND dietitian_signed AND medical_signed (join: all branches complete) (ERR_DISCIPLINES_INCOMPLETE)"
        side_effects:
          - "status = ACTIVE"

      - from: ACTIVE
        to: REVISION
        trigger: "POST /edt/treatment-plans/{tpId}/revise"
        actor: Clinician
        preconditions:
          - "TreatmentPlan.status == ACTIVE (ERR_INVALID_STATE)"
          - "expected_admission_version matches Admission.version (ERR_STALE_VERSION)"
        side_effects:
          - "Clear all three *_signed flags (re-fork for new sign-off round)"
          - "increments Admission.version by 1"
        note: "Cycle back toward sign-off; REVISION must be re-activated."

      - from: REVISION
        to: ACTIVE
        trigger: "POST /edt/treatment-plans/{tpId}/activate"
        actor: Clinician
        preconditions:
          - "TreatmentPlan.status == REVISION (ERR_INVALID_STATE)"
          - "therapy_signed AND dietitian_signed AND medical_signed (ERR_DISCIPLINES_INCOMPLETE)"
        side_effects:
          - "status = ACTIVE"

      - from: ACTIVE
        to: CLOSED
        trigger: "system (admission discharge cascade)"
        actor: system
        preconditions:
          - "TreatmentPlan.status in {ACTIVE, REVISION, DRAFT} (ERR_INVALID_STATE)"
        side_effects: []

  # ---- Assessment: linear with supersede ----
  - entity: Assessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /edt/assessments/{asid}/finalize"
        actor: Clinician
        preconditions:
          - "Assessment.status == DRAFT (ERR_INVALID_STATE)"
          - "expected_patient_version matches Patient.version (ERR_STALE_VERSION)"
        side_effects:
          - "If Patient.active_assessment_id is set, that prior Assessment -> SUPERSEDED"
          - "Patient.active_assessment_id = this assessment id"
          - "Patient.provisional_nutritional_risk_score = provisional variant (composite_score + bmi_bonus, clamped); Patient.nutritional_risk_score = that value"
          - "recompute Patient.medical_stability_posture from the new nutritional_risk_score"
          - "increments Patient.version by 1"

  # ---- MealPlan: linear ----
  - entity: MealPlan
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /edt/meal-plans/{mpId}/close OR system (admission discharge cascade)"
        actor: Dietitian | system
        preconditions:
          - "MealPlan.status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "Reconcile Patient.nutritional_risk_score (reconciled variant) from meal_compliance_rate; recompute Patient.medical_stability_posture"

  # ---- DischargePlan: linear ----
  - entity: DischargePlan
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /edt/discharge-plans/{dpId}/finalize"
        actor: Clinician
        preconditions:
          - "DischargePlan.status == DRAFT (ERR_INVALID_STATE)"
          - "relapse_plan_complete == true (ERR_RELAPSE_PLAN_INCOMPLETE)"
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules (OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: assessment-finalize-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /edt/assessments/{asid}/finalize"
    occ_field: "expected_patient_version"
    description: |
      Finalizing an Assessment supersedes whatever assessment currently governs
      the Patient and re-points Patient.active_assessment_id. A finalize that
      carries a Patient.version older than the patient's current version is
      rejected: the client's view of which assessment is active is stale because
      another finalize already superseded it and advanced the patient version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: treatment-plan-revise-stale-admission
    parent_entity: Admission
    write_endpoint: "POST /edt/treatment-plans/{tpId}/revise"
    occ_field: "expected_admission_version"
    description: |
      Revising the ACTIVE TreatmentPlan re-forks discipline sign-off against the
      admission. A revise carrying an Admission.version older than current is
      rejected: a clinical change (step-down or medical-hold) already advanced
      the admission, so the revising client's view of the admission is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: recommended_level_of_care
    trigger: "Assessment create; recomputed on Assessment finalize"
    algorithm: weighted_scoring
    formula: |
      composite_score = round(
          0.40 * (medical_severity     * 10)
        + 0.30 * (behavioral_severity  * 10)
        + 0.20 * (psychiatric_severity * 10)
        - 0.10 * (motivation_level     * 10), 2 )
      composite_score clamped to [0, 100].
      recommended_level_of_care =
        RESIDENTIAL if composite_score >= 70
        PHP         if 50 <= composite_score < 70
        IOP         if 30 <= composite_score < 50
        OP          if composite_score < 30
    input_set: "Single Assessment row's four severity/motivation inputs (each 0-10)."
    constants:
      W_MEDICAL: 0.40
      W_BEHAVIORAL: 0.30
      W_PSYCHIATRIC: 0.20
      W_MOTIVATION: -0.10
      T_RESIDENTIAL: 70
      T_PHP: 50
      T_IOP: 30
    precision: "2 decimal places, round_half_up; thresholds use >= (inclusive lower bound)"

  - name: nutritional_risk_score
    trigger: "provisional: Assessment finalize; reconciled: Admission medical-hold, MealPlan close"
    algorithm: weighted_scoring
    formula: |
      PROVISIONAL (computed at Assessment finalize, stored on provisional_nutritional_risk_score, frozen):
        bmi_bonus = (bmi < 16)   ? 15
                  : (bmi < 18.5) ? 7
                  :                0
        provisional = clamp(active_assessment.composite_score + bmi_bonus, 0, 100)
      RECONCILED (stored on nutritional_risk_score, mutated over the stay):
        base = provisional                                  # set at Assessment finalize
        on each medical-hold:  base += MEDICAL_HOLD_RISK_BUMP (10)   # accumulates
        on MealPlan close:     base = clamp(base - round(MEAL_CREDIT_FACTOR * meal_compliance_rate, 2), 0, 100)
      nutritional_risk_score is the running reconciled value.
    input_set: "Provisional from the patient's active FINALIZED assessment composite_score + intake bmi. Reconciled folds in medical-hold bumps and the meal_compliance_rate at meal-plan close."
    constants:
      BMI_SEVERE_BONUS: 15
      BMI_MODERATE_BONUS: 7
      MEDICAL_HOLD_RISK_BUMP: 10
      MEAL_CREDIT_FACTOR: 40
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "computed once at admission from the assessment + bmi; never changed by meal events"
        difference: "Ignores meal compliance and holds; a fixed admission-time estimate."
      - name: reconciled
        when: "running value over the stay; folds medical-hold bumps and meal-plan-close credit"
        difference: "Diverges from provisional as soon as a hold fires or a meal plan closes."

  - name: medical_stability_posture
    trigger: "recomputed whenever nutritional_risk_score changes (assessment finalize, medical-hold, meal-plan close)"
    algorithm: threshold
    formula: |
      posture =
        UNSTABLE if nutritional_risk_score >= 75
        GUARDED  if 50 <= nutritional_risk_score < 75
        STABLE   if nutritional_risk_score < 50
    input_set: "Patient.nutritional_risk_score (reconciled) only."
    constants:
      T_UNSTABLE: 75
      T_GUARDED: 50
    precision: "thresholds use >= (inclusive lower bound)"

  - name: occupancy_posture
    trigger: "recomputed on Admission admit and discharge (beds_occupied change)"
    algorithm: threshold
    formula: |
      beds_available = max(bed_capacity - beds_occupied, 0)
      occupancy_posture = FULL if beds_occupied >= bed_capacity else OPEN
    input_set: "Single Program row: beds_occupied vs bed_capacity. beds_occupied counts admissions in {ADMITTED, MEDICAL_HOLD, DISCHARGE_PENDING}."
    constants: {}
    precision: "integer; boundary uses >= (beds_occupied == bed_capacity is FULL)"

  - name: authorized_days_balance
    trigger: "InsuranceAuthorization review approve (forward projection); clock advance (chronological consumption)"
    algorithm: forward_looking
    formula: |
      whole_days(window) = floor((window_end_iso - window_start_iso) / SECONDS_PER_DAY)
      FORWARD-LOOKING (projection used at admit eligibility & step-down planning):
        projected_remaining = days_authorized - requested_length_of_stay_days
        i.e. treats the full requested_length_of_stay_days as if it will be consumed.
      CHRONOLOGICAL (running consumption up to the logical clock):
        days_consumed = sum over APPROVED windows of
                        max( floor((min(window_end_iso, clock) - window_start_iso) / SECONDS_PER_DAY), 0 )
        days_remaining = max(days_authorized - days_consumed, 0)
    input_set: "All APPROVED ConcurrentReview windows on the authorization; the logical clock for the chronological variant; the admission's requested_length_of_stay_days for the forward variant."
    constants:
      SECONDS_PER_DAY: 86400
    precision: "integer days; per-window floor"
    variants:
      - name: forward_looking_projection
        when: "admission eligibility and step-down planning — assumes full requested_length_of_stay_days consumed"
        difference: "Pessimistic: reserves the whole requested stay regardless of clock position."
      - name: chronological_consumption
        when: "days_consumed / days_remaining shown on the authorization as the clock advances"
        difference: "Only counts window time elapsed up to the clock; equals forward only when clock has passed every window end."

  - name: patient_responsibility_cents
    trigger: "GET authorization billing-summary; recomputed on each approved review"
    algorithm: aggregation
    formula: |
      Per-covered-day cost share, rounded PER DAY then multiplied (order pinned):
        per_day_share = round_half_up(daily_rate_cents * coinsurance_pct)   # whole cents, per day
        patient_responsibility_cents = per_day_share * days_consumed
      The order is fixed: round the per-day share to whole cents FIRST, then
      multiply by days_consumed. (Multiplying the un-rounded share by days then
      rounding once would yield a different total; that order is explicitly NOT used.)
    input_set: "Authorization daily_rate_cents, coinsurance_pct, and chronological days_consumed."
    constants: {}
    precision: "integer cents; round_half_up applied per-day BEFORE multiplication"

  - name: step_down_readiness_score
    trigger: "Admission step-down precondition evaluation"
    algorithm: weighted_scoring
    formula: |
      Combinatorial (>=3 inputs, nested min/max + conditional branch on posture):
        goal_ratio   = (goals_total == 0) ? 0 : goals_met / goals_total        # 0.0-1.0
        meal_factor  = min(meal_compliance_rate, 1.0)                            # 0.0-1.0
        stability_factor =
            (medical_stability_posture == STABLE)  ? 1.0
          : (medical_stability_posture == GUARDED) ? 0.6
          :                                          0.0     # UNSTABLE
        readiness = round(100 * (0.45 * goal_ratio
                                + 0.35 * meal_factor
                                + 0.20 * stability_factor), 2)
        readiness = max(0, min(readiness, 100))
      Step-down allowed only when readiness >= STEP_DOWN_THRESHOLD (75).
    input_set: "Admission's ACTIVE TreatmentPlan (goals_met/goals_total), its MealPlan meal_compliance_rate, and Patient.medical_stability_posture."
    constants:
      W_GOALS: 0.45
      W_MEALS: 0.35
      W_STABILITY: 0.20
      STEP_DOWN_THRESHOLD: 75
      MEAL_COMPLIANCE_FLOOR: 0.80
      MIN_MEALS_FOR_STEP_DOWN: 3
    precision: "2 decimal places, round_half_up; threshold uses >= (inclusive)"

  - name: meal_compliance_rate
    trigger: "MealEvent log append"
    algorithm: aggregation
    formula: |
      For each MealEvent: effective_fraction = refused ? 0.0 : clamp(completion_fraction, 0.0, 1.0)
      completion_points = sum of effective_fraction over all events on this meal plan
      meals_logged      = count of events
      meal_compliance_rate = (meals_logged == 0) ? 0 : round(completion_points / meals_logged, 4)
    input_set: "All MealEvent rows under the MealPlan (append-only; none excluded)."
    constants: {}
    precision: "4 decimal places, round_half_up; empty set yields 0"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Path resource ids exist"
    error_id: "ERR_*_NOT_FOUND (resource-specific)"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: existence
    check: "Referenced foreign keys in body exist (facility_id, patient_id, program_id, cohort_id, admission_id, authorization_id, meal_plan_id)"
    error_id: "ERR_*_NOT_FOUND (resource-specific)"
    http_status: 404
    applies_to: "create endpoints carrying FK bodies"

  - priority: 5
    category: state
    check: "OCC version match where expected_<parent>_version supplied (checked before business logic)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "assessment finalize, treatment-plan revise"

  - priority: 6
    category: state
    check: "Target resource in a state from which the requested transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_referential
    check: "Cohort.age_band must equal Patient.age_band on admit"
    error_id: ERR_COHORT_AGE_MISMATCH
    http_status: 409
    applies_to: "POST /edt/admissions/{aid}/admit"

  - priority: 8
    category: business_safety
    check: "Patient.medical_stability_posture must be admissible for program.level_of_care (UNSTABLE only into RESIDENTIAL)"
    error_id: ERR_LOC_NOT_ADMISSIBLE
    http_status: 409
    applies_to: "POST /edt/admissions/{aid}/admit"

  - priority: 9
    category: business_safety
    check: "Program must be OPEN (not CLOSED)"
    error_id: ERR_PROGRAM_CLOSED
    http_status: 409
    applies_to: "POST /edt/admissions/{aid}/promote, POST /edt/admissions/{aid}/admit"

  - priority: 10
    category: business_constraint
    check: "Program.occupancy_posture must be OPEN (beds_occupied < bed_capacity) on admit"
    error_id: ERR_PROGRAM_AT_CAPACITY
    http_status: 409
    applies_to: "POST /edt/admissions/{aid}/admit"

  - priority: 11
    category: business_constraint
    check: "Cohort.slots_filled < Cohort.slot_capacity on admit"
    error_id: ERR_COHORT_FULL
    http_status: 409
    applies_to: "POST /edt/admissions/{aid}/admit"

  - priority: 12
    category: business_temporal
    check: "Concurrent-review extension window must not overlap a prior APPROVED window"
    error_id: ERR_AUTH_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /edt/reviews (decision=APPROVE on already-APPROVED auth)"

  - priority: 13
    category: business_temporal
    check: "Concurrent-review extension window must be contiguous with prior coverage (window_start == covered_through, gap=0)"
    error_id: ERR_AUTH_WINDOW_NONCONTIGUOUS
    http_status: 409
    applies_to: "POST /edt/reviews (decision=APPROVE on already-APPROVED auth)"

  - priority: 14
    category: business_safety
    check: "Step-down requires meal_compliance_rate >= MEAL_COMPLIANCE_FLOOR (0.80) AND meals_logged >= MIN_MEALS_FOR_STEP_DOWN (3)"
    error_id: ERR_INSUFFICIENT_MEAL_COMPLIANCE
    http_status: 409
    applies_to: "POST /edt/admissions/{aid}/step-down"

  - priority: 15
    category: business_constraint
    check: "Step-down requires an ACTIVE TreatmentPlan and step_down_readiness_score >= STEP_DOWN_THRESHOLD (75)"
    error_id: ERR_STEP_DOWN_NOT_READY
    http_status: 409
    applies_to: "POST /edt/admissions/{aid}/step-down"

  - priority: 16
    category: business_fiscal
    check: "Admit requires an APPROVED authorization with days_remaining >= 1"
    error_id: ERR_NO_ACTIVE_AUTHORIZATION
    http_status: 402
    applies_to: "POST /edt/admissions/{aid}/admit"

  - priority: 17
    category: business_referential
    check: "Discharge requires a FINALIZED DischargePlan and a FamilyProgramEnrollment in {COMPLETED, WAIVED}"
    error_id: ERR_FAMILY_PROGRAM_INCOMPLETE
    http_status: 409
    applies_to: "POST /edt/admissions/{aid}/discharge"

  - priority: 18
    category: business_constraint
    check: "Request body field-level validation (enum membership, numeric ranges, non-empty strings, window_end > window_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table  (FLAT topology — collections under /edt)
# =============================================================================
endpoints:
  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical UTC clock to an arbitrary ISO8601 instant. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Logical clock set; re-evaluates authorization expiry/exhaustion and may cascade Admission -> DISCHARGE_PENDING"

  # ---- Facilities ----
  - method: POST
    path: "/edt/facilities"
    description: "Create a facility"
    roles: [Admin]
    code: 201
    input: [name, "timezone?"]
    output: Facility
    side_effects: []

  - method: GET
    path: "/edt/facilities"
    description: "List facilities (paginated)"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "Facility[]"
    side_effects: []

  - method: GET
    path: "/edt/facilities/{fid}"
    description: "Get a facility"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: []
    output: Facility
    side_effects: []

  # ---- Programs ----
  - method: POST
    path: "/edt/programs"
    description: "Create a level-of-care program"
    roles: [Admin]
    code: 201
    input: [facility_id, level_of_care, bed_capacity]
    output: Program
    side_effects: ["beds_occupied=0, beds_available=bed_capacity, occupancy_posture=OPEN, status=OPEN"]

  - method: GET
    path: "/edt/programs"
    description: "List programs; reverse-reachability for Program.facility_id via facility_id filter"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: ["facility_id?", "level_of_care?", "limit?", "offset?"]
    output: "Program[]"
    side_effects: []

  - method: GET
    path: "/edt/programs/{pgid}"
    description: "Get a program (with computed bed counters and posture)"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: POST
    path: "/edt/programs/{pgid}/close"
    description: "Close a program to new admissions"
    roles: [Admin]
    code: 200
    input: []
    output: Program
    side_effects: ["status = CLOSED"]

  # ---- Cohorts ----
  - method: POST
    path: "/edt/cohorts"
    description: "Create a cohort within a program"
    roles: [Admin, Intake]
    code: 201
    input: [program_id, facility_id, name, age_band, slot_capacity]
    output: Cohort
    side_effects: ["slots_filled=0"]

  - method: GET
    path: "/edt/cohorts"
    description: "List cohorts; reverse-reachability for Cohort.program_id and Cohort.facility_id via filters"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: ["program_id?", "facility_id?", "limit?", "offset?"]
    output: "Cohort[]"
    side_effects: []

  - method: GET
    path: "/edt/cohorts/{cid}"
    description: "Get a cohort"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: []
    output: Cohort
    side_effects: []

  # ---- Patients ----
  - method: POST
    path: "/edt/patients"
    description: "Register a patient"
    roles: [Intake, Admin]
    code: 201
    input: [facility_id, full_name, age_band, bmi]
    output: Patient
    side_effects: ["medical_stability_posture=STABLE, nutritional_risk_score=0, version=1"]

  - method: GET
    path: "/edt/patients"
    description: "List patients; reverse-reachability for Patient.facility_id via facility_id filter"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: ["facility_id?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/edt/patients/{pid}"
    description: "Get a patient (computed posture and risk scores)"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # ---- Assessments ----
  - method: POST
    path: "/edt/assessments"
    description: "Create a DRAFT level-of-care assessment"
    roles: [Clinician]
    code: 201
    input: [patient_id, facility_id, medical_severity, behavioral_severity, psychiatric_severity, motivation_level]
    output: Assessment
    side_effects: ["composite_score + recommended_level_of_care computed; status=DRAFT"]

  - method: GET
    path: "/edt/assessments"
    description: "List assessments; reverse-reachability for Assessment.patient_id and Assessment.facility_id via filters"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: ["patient_id?", "facility_id?", "limit?", "offset?"]
    output: "Assessment[]"
    side_effects: []

  - method: GET
    path: "/edt/assessments/{asid}"
    description: "Get an assessment"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: []
    output: Assessment
    side_effects: []

  - method: POST
    path: "/edt/assessments/{asid}/finalize"
    description: "Finalize an assessment; supersedes the prior active one (OCC on Patient.version)"
    roles: [Clinician]
    code: 200
    input: [expected_patient_version]
    output: Assessment
    side_effects:
      - "Prior active assessment -> SUPERSEDED"
      - "Patient.active_assessment_id = this id"
      - "Patient.provisional_nutritional_risk_score + nutritional_risk_score set from provisional variant; recompute medical_stability_posture"
      - "increments Patient.version by 1"

  # ---- Admissions ----
  - method: POST
    path: "/edt/admissions"
    description: "Create a WAITLISTED admission referencing a patient, program + cohort"
    roles: [Intake]
    code: 201
    input: [patient_id, facility_id, program_id, cohort_id, requested_length_of_stay_days]
    output: Admission
    side_effects: ["clinical_status=WAITLISTED"]

  - method: GET
    path: "/edt/admissions"
    description: "List admissions; reverse-reachability for Admission.patient_id / program_id / cohort_id / facility_id via filters"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: ["patient_id?", "program_id?", "cohort_id?", "facility_id?", "limit?", "offset?"]
    output: "Admission[]"
    side_effects: []

  - method: GET
    path: "/edt/admissions/{aid}"
    description: "Get an admission (both dimensions)"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: []
    output: Admission
    side_effects: []

  - method: POST
    path: "/edt/admissions/{aid}/promote"
    description: "Promote a WAITLISTED admission to PENDING_ADMISSION"
    roles: [Intake]
    code: 200
    input: []
    output: Admission
    side_effects: ["clinical_status WAITLISTED -> PENDING_ADMISSION"]

  - method: POST
    path: "/edt/admissions/{aid}/admit"
    description: "Admit a PENDING_ADMISSION; occupies bed + cohort slot, freezes provisional risk"
    roles: [Intake]
    code: 200
    input: []
    output: Admission
    side_effects:
      - "clinical_status -> ADMITTED; level_of_care = program.level_of_care"
      - "Program.beds_occupied += 1; recompute beds_available + occupancy_posture"
      - "Cohort.slots_filled += 1"
      - "admitted_at_iso + loc_entered_at_iso stamped (provisional risk + posture already set at finalize)"

  - method: POST
    path: "/edt/admissions/{aid}/medical-hold"
    description: "Place admission on medical hold"
    roles: [Clinician]
    code: 200
    input: []
    output: Admission
    side_effects: ["clinical_status ADMITTED -> MEDICAL_HOLD; nutritional_risk_score += 10; recompute posture"]

  - method: POST
    path: "/edt/admissions/{aid}/clear-hold"
    description: "Clear a medical hold"
    roles: [Clinician]
    code: 200
    input: []
    output: Admission
    side_effects: ["clinical_status MEDICAL_HOLD -> ADMITTED (hold risk bump is not reversed)"]

  - method: POST
    path: "/edt/admissions/{aid}/step-down"
    description: "Step the admission down one LOC rung (RESIDENTIAL->PHP->IOP->OP)"
    roles: [Clinician]
    code: 200
    input: []
    output: Admission
    side_effects: ["level_of_care advances one rung; loc_entered_at_iso re-stamped"]

  - method: POST
    path: "/edt/admissions/{aid}/begin-discharge"
    description: "Move ADMITTED admission to DISCHARGE_PENDING"
    roles: [Clinician]
    code: 200
    input: []
    output: Admission
    side_effects: ["clinical_status ADMITTED -> DISCHARGE_PENDING"]

  - method: POST
    path: "/edt/admissions/{aid}/discharge"
    description: "Discharge; releases bed/cohort, closes plans, may promote a waitlisted admission"
    roles: [Clinician]
    code: 200
    input: []
    output: Admission
    side_effects:
      - "clinical_status DISCHARGE_PENDING -> DISCHARGED; discharged_at_iso stamped"
      - "Program.beds_occupied -= 1; recompute beds_available + occupancy_posture"
      - "Cohort.slots_filled -= 1"
      - "Active MealPlan -> CLOSED (cascade hop 1) -> reconcile Patient.nutritional_risk_score (hop 2) -> recompute medical_stability_posture (hop 3)"
      - "Active/REVISION/DRAFT TreatmentPlan -> CLOSED"
      - "If occupancy_posture flipped FULL->OPEN, promote earliest-created (created_at ASC) WAITLISTED admission in same program to PENDING_ADMISSION (waitlist cascade)"

  - method: POST
    path: "/edt/admissions/{aid}/admin-discharge"
    description: "Administratively discharge a never-admitted (WAITLISTED/PENDING) admission"
    roles: [Admin]
    code: 200
    input: []
    output: Admission
    side_effects: ["clinical_status -> ADMINISTRATIVE_DISCHARGE; no counter changes"]

  # ---- Insurance Authorizations ----
  - method: POST
    path: "/edt/authorizations"
    description: "Create a PENDING insurance authorization for an admission"
    roles: [UtilizationReviewer]
    code: 201
    input: [admission_id, facility_id, payer_name, daily_rate_cents, coinsurance_pct]
    output: InsuranceAuthorization
    side_effects: ["status=PENDING, days_authorized=0, days_consumed=0"]

  - method: GET
    path: "/edt/authorizations"
    description: "List authorizations; reverse-reachability for InsuranceAuthorization.admission_id / facility_id via filters"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: ["admission_id?", "facility_id?", "limit?", "offset?"]
    output: "InsuranceAuthorization[]"
    side_effects: []

  - method: GET
    path: "/edt/authorizations/{authId}"
    description: "Get an authorization (computed days + covered_through)"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: []
    output: InsuranceAuthorization
    side_effects: []

  - method: GET
    path: "/edt/authorizations/{authId}/billing-summary"
    description: "Computed read: patient_responsibility_cents from days_consumed"
    roles: [Admin, UtilizationReviewer]
    code: 200
    input: []
    output: "{ authorization_id: string, days_consumed: integer, days_remaining: integer, patient_responsibility_cents: integer }"
    side_effects: []

  - method: POST
    path: "/edt/reviews"
    description: "Render a concurrent-review decision against an authorization (APPROVE extends days; DENY records denial)"
    roles: [UtilizationReviewer]
    code: 201
    input: [authorization_id, facility_id, decision, "window_start_iso?", "window_end_iso?"]
    output: ConcurrentReview
    side_effects:
      - "On APPROVE: approved_days = whole days in [start,end); days_authorized += approved_days; recompute days_remaining, covered_through_iso; auth status -> APPROVED"
      - "On DENY: auth status -> DENIED; no day change"

  - method: GET
    path: "/edt/reviews"
    description: "List concurrent reviews; reverse-reachability for ConcurrentReview.authorization_id / facility_id via filters"
    roles: [Admin, UtilizationReviewer, Clinician]
    code: 200
    input: ["authorization_id?", "facility_id?", "limit?", "offset?"]
    output: "ConcurrentReview[]"
    side_effects: []

  - method: GET
    path: "/edt/reviews/{rid}"
    description: "Get a concurrent review"
    roles: [Admin, UtilizationReviewer, Clinician]
    code: 200
    input: []
    output: ConcurrentReview
    side_effects: []

  - method: POST
    path: "/edt/authorizations/{authId}/appeal"
    description: "Appeal a DENIED authorization (DENIED -> APPEALED)"
    roles: [UtilizationReviewer]
    code: 200
    input: []
    output: InsuranceAuthorization
    side_effects: ["status DENIED -> APPEALED"]

  - method: POST
    path: "/edt/authorizations/{authId}/expire"
    description: "Expire an authorization whose coverage window has passed; cascades to admission"
    roles: [UtilizationReviewer, Admin]
    code: 200
    input: []
    output: InsuranceAuthorization
    side_effects:
      - "status -> EXPIRED"
      - "If parent Admission ADMITTED, cascade Admission -> DISCHARGE_PENDING"

  # ---- Treatment Plans ----
  - method: POST
    path: "/edt/treatment-plans"
    description: "Create a DRAFT multidisciplinary treatment plan"
    roles: [Clinician]
    code: 201
    input: [admission_id, facility_id, goals_total]
    output: TreatmentPlan
    side_effects: ["status=DRAFT; all *_signed=false; goals_met=0"]

  - method: GET
    path: "/edt/treatment-plans"
    description: "List treatment plans; reverse-reachability for TreatmentPlan.admission_id / facility_id via filters"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: ["admission_id?", "facility_id?", "limit?", "offset?"]
    output: "TreatmentPlan[]"
    side_effects: []

  - method: GET
    path: "/edt/treatment-plans/{tpId}"
    description: "Get a treatment plan"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []

  - method: POST
    path: "/edt/treatment-plans/{tpId}/sign"
    description: "Sign one discipline (THERAPY/MEDICAL by Clinician, DIETITIAN by Dietitian)"
    roles: [Clinician, Dietitian]
    code: 200
    input: [discipline]
    output: TreatmentPlan
    side_effects: ["Set the discipline's *_signed flag true"]

  - method: POST
    path: "/edt/treatment-plans/{tpId}/goals/met"
    description: "Increment goals_met by one (cannot exceed goals_total)"
    roles: [Clinician]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["goals_met += 1 (capped at goals_total)"]

  - method: POST
    path: "/edt/treatment-plans/{tpId}/activate"
    description: "Activate a fully-signed plan (join)"
    roles: [Clinician]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["status DRAFT|REVISION -> ACTIVE"]

  - method: POST
    path: "/edt/treatment-plans/{tpId}/revise"
    description: "Revise an ACTIVE plan (re-fork sign-offs; OCC on Admission.version)"
    roles: [Clinician]
    code: 200
    input: [expected_admission_version]
    output: TreatmentPlan
    side_effects: ["status ACTIVE -> REVISION; clear all *_signed flags; increments Admission.version by 1"]

  # ---- Meal Plans + Events ----
  - method: POST
    path: "/edt/meal-plans"
    description: "Create an ACTIVE supervised meal plan"
    roles: [Dietitian]
    code: 201
    input: [admission_id, facility_id, required_meals_per_day, supervision_level]
    output: MealPlan
    side_effects: ["status=ACTIVE; meals_logged=0; meal_compliance_rate=0"]

  - method: GET
    path: "/edt/meal-plans"
    description: "List meal plans; reverse-reachability for MealPlan.admission_id / facility_id via filters"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: ["admission_id?", "facility_id?", "limit?", "offset?"]
    output: "MealPlan[]"
    side_effects: []

  - method: GET
    path: "/edt/meal-plans/{mpId}"
    description: "Get a meal plan (computed compliance rate)"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: []
    output: MealPlan
    side_effects: []

  - method: POST
    path: "/edt/meal-events"
    description: "Append a supervised-meal event (recomputes compliance rate)"
    roles: [Dietitian, Clinician]
    code: 201
    input: [meal_plan_id, admission_id, meal_type, completion_fraction, "refused?"]
    output: MealEvent
    side_effects:
      - "MealPlan.meals_logged += 1; completion_points += effective_fraction; recompute meal_compliance_rate"

  - method: GET
    path: "/edt/meal-events"
    description: "List meal events; reverse-reachability for MealEvent.meal_plan_id / admission_id via filters"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: ["meal_plan_id?", "admission_id?", "limit?", "offset?"]
    output: "MealEvent[]"
    side_effects: []

  - method: GET
    path: "/edt/meal-events/{meid}"
    description: "Get a meal event"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: []
    output: MealEvent
    side_effects: []

  - method: POST
    path: "/edt/meal-plans/{mpId}/close"
    description: "Close a meal plan; reconciles nutritional risk"
    roles: [Dietitian]
    code: 200
    input: []
    output: MealPlan
    side_effects:
      - "status ACTIVE -> CLOSED"
      - "Reconcile Patient.nutritional_risk_score from meal_compliance_rate; recompute medical_stability_posture"

  # ---- Family Program ----
  - method: POST
    path: "/edt/family-programs"
    description: "Enroll an admission in the family program"
    roles: [Clinician]
    code: 201
    input: [admission_id, facility_id, family_contact_name, sessions_required]
    output: FamilyProgramEnrollment
    side_effects: ["status=ENROLLED; sessions_completed=0"]

  - method: GET
    path: "/edt/family-programs"
    description: "List family-program enrollments; reverse-reachability for FamilyProgramEnrollment.admission_id / facility_id via filters"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: ["admission_id?", "facility_id?", "limit?", "offset?"]
    output: "FamilyProgramEnrollment[]"
    side_effects: []

  - method: GET
    path: "/edt/family-programs/{fpid}"
    description: "Get a family-program enrollment"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: []
    output: FamilyProgramEnrollment
    side_effects: []

  - method: POST
    path: "/edt/family-programs/{fpid}/complete-session"
    description: "Record one completed family session (auto-COMPLETED at sessions_required)"
    roles: [Clinician]
    code: 200
    input: []
    output: FamilyProgramEnrollment
    side_effects:
      - "sessions_completed += 1; if sessions_completed >= sessions_required, status -> COMPLETED"

  - method: POST
    path: "/edt/family-programs/{fpid}/waive"
    description: "Waive the family-program requirement"
    roles: [Clinician, Admin]
    code: 200
    input: []
    output: FamilyProgramEnrollment
    side_effects: ["status -> WAIVED"]

  # ---- Discharge Plans ----
  - method: POST
    path: "/edt/discharge-plans"
    description: "Create a DRAFT discharge + relapse-prevention plan"
    roles: [Clinician]
    code: 201
    input: [admission_id, facility_id, aftercare_level_of_care, relapse_warning_signs, relapse_plan_complete]
    output: DischargePlan
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/edt/discharge-plans"
    description: "List discharge plans; reverse-reachability for DischargePlan.admission_id / facility_id via filters"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: ["admission_id?", "facility_id?", "limit?", "offset?"]
    output: "DischargePlan[]"
    side_effects: []

  - method: GET
    path: "/edt/discharge-plans/{dpId}"
    description: "Get a discharge plan"
    roles: [Admin, Intake, Clinician, Dietitian, UtilizationReviewer]
    code: 200
    input: []
    output: DischargePlan
    side_effects: []

  - method: POST
    path: "/edt/discharge-plans/{dpId}/finalize"
    description: "Finalize the discharge plan (requires relapse_plan_complete)"
    roles: [Clinician]
    code: 200
    input: []
    output: DischargePlan
    side_effects: ["status DRAFT -> FINALIZED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation (incl. wrong discipline signing)" }

  # --- Not Found ---
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "Facility id not found" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "Program id not found" }
  - { id: ERR_COHORT_NOT_FOUND, http: 404, condition: "Cohort id not found" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id not found" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "Assessment id not found" }
  - { id: ERR_ADMISSION_NOT_FOUND, http: 404, condition: "Admission id not found" }
  - { id: ERR_AUTHORIZATION_NOT_FOUND, http: 404, condition: "Insurance authorization id not found" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "Concurrent review id not found" }
  - { id: ERR_TREATMENT_PLAN_NOT_FOUND, http: 404, condition: "Treatment plan id not found" }
  - { id: ERR_MEAL_PLAN_NOT_FOUND, http: 404, condition: "Meal plan id not found" }
  - { id: ERR_MEAL_EVENT_NOT_FOUND, http: 404, condition: "Meal event id not found" }
  - { id: ERR_FAMILY_PROGRAM_NOT_FOUND, http: 404, condition: "Family-program enrollment id not found" }
  - { id: ERR_DISCHARGE_PLAN_NOT_FOUND, http: 404, condition: "Discharge plan id not found" }

  # --- Input validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, enum out of range, numeric out of bounds, empty string" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "Review window_end_iso <= window_start_iso, or APPROVE missing window fields" }

  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version" }

  # --- State ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not legal from current state" }
  - { id: ERR_ALREADY_LOWEST_LOC, http: 409, condition: "Step-down attempted from OP (no lower rung)" }
  - { id: ERR_PROGRAM_CLOSED, http: 409, condition: "Program.status == CLOSED on promote/admit" }
  - { id: ERR_TREATMENT_PLAN_NOT_ACTIVE, http: 409, condition: "Step-down requires an ACTIVE treatment plan" }
  - { id: ERR_DISCIPLINE_ALREADY_SIGNED, http: 409, condition: "That discipline is already signed on this plan" }
  - { id: ERR_DISCIPLINES_INCOMPLETE, http: 409, condition: "Activate attempted before all three disciplines signed" }
  - { id: ERR_DISCHARGE_PLAN_NOT_FINALIZED, http: 409, condition: "Discharge requires a FINALIZED discharge plan" }
  - { id: ERR_FAMILY_PROGRAM_INCOMPLETE, http: 409, condition: "Discharge requires family program COMPLETED or WAIVED" }
  - { id: ERR_RELAPSE_PLAN_INCOMPLETE, http: 409, condition: "Finalize requires relapse_plan_complete == true" }
  - { id: ERR_AUTH_NOT_EXPIRABLE, http: 409, condition: "Authorization coverage window has not yet passed (clock < covered_through_iso)" }

  # --- Capacity / quota (constraint) ---
  - { id: ERR_PROGRAM_AT_CAPACITY, http: 409, condition: "Program.beds_occupied >= bed_capacity on admit" }
  - { id: ERR_COHORT_FULL, http: 409, condition: "Cohort.slots_filled >= slot_capacity on admit" }
  - { id: ERR_COHORT_AGE_MISMATCH, http: 409, condition: "Cohort.age_band != Patient.age_band on admit" }

  # --- Safety ---
  - { id: ERR_LOC_NOT_ADMISSIBLE, http: 409, condition: "Patient posture not admissible for program LOC (UNSTABLE only into RESIDENTIAL)" }
  - { id: ERR_INSUFFICIENT_MEAL_COMPLIANCE, http: 409, condition: "Step-down meal_compliance_rate < 0.80 or meals_logged < 3" }
  - { id: ERR_STEP_DOWN_NOT_READY, http: 409, condition: "step_down_readiness_score < 75" }

  # --- Temporal ---
  - { id: ERR_AUTH_WINDOW_OVERLAP, http: 409, condition: "Review window overlaps a prior APPROVED window" }
  - { id: ERR_AUTH_WINDOW_NONCONTIGUOUS, http: 409, condition: "Extension window not contiguous with prior coverage (window_start != covered_through)" }

  # --- Fiscal ---
  - { id: ERR_NO_ACTIVE_AUTHORIZATION, http: 402, condition: "Admit requires APPROVED authorization with days_remaining >= 1" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Facility/program operator: facilities, programs, cohorts, clock, administrative discharge, waivers"
    identity: "opaque"
    exclusive_operations:
      - "POST /edt/facilities — create facility"
      - "POST /_clock/set_current_utc — set logical clock"
      - "POST /edt/programs — create program"
      - "POST /edt/programs/{pgid}/close — close program"
      - "POST /edt/admissions/{aid}/admin-discharge — administrative discharge"
    shared_operations:
      - "POST /edt/cohorts — create cohort (with Intake)"
      - "POST /edt/patients — register patient (with Intake)"
      - "POST /edt/authorizations/{authId}/expire — expire auth (with UtilizationReviewer)"
      - "POST /edt/family-programs/{fpid}/waive — waive family program (with Clinician)"
      - "GET billing-summary and all GET reads"

  - name: Intake
    description: "Intake coordinator: patients, admissions, bed/cohort placement, waitlist promotion"
    identity: "opaque"
    exclusive_operations:
      - "POST /edt/admissions — create admission"
      - "POST /edt/admissions/{aid}/promote — promote off waitlist"
      - "POST /edt/admissions/{aid}/admit — admit"
    shared_operations:
      - "POST /edt/cohorts — create cohort (with Admin)"
      - "POST /edt/patients — register patient (with Admin)"
      - "GET reads"

  - name: Clinician
    description: "Therapist/physician: assessments, treatment plans, clinical holds, step-down, discharge, family program, discharge plans"
    identity: "opaque"
    exclusive_operations:
      - "POST /edt/assessments — create assessment"
      - "POST /edt/assessments/{asid}/finalize — finalize assessment"
      - "POST /edt/admissions/{aid}/medical-hold — place hold"
      - "POST /edt/admissions/{aid}/clear-hold — clear hold"
      - "POST /edt/admissions/{aid}/step-down — step down LOC"
      - "POST /edt/admissions/{aid}/begin-discharge — begin discharge"
      - "POST /edt/admissions/{aid}/discharge — discharge"
      - "POST /edt/treatment-plans — create treatment plan"
      - "POST /edt/treatment-plans/{tpId}/goals/met — mark goal met"
      - "POST /edt/treatment-plans/{tpId}/activate — activate plan"
      - "POST /edt/treatment-plans/{tpId}/revise — revise plan"
      - "POST /edt/family-programs — enroll family program"
      - "POST /edt/family-programs/{fpid}/complete-session — complete session"
      - "POST /edt/discharge-plans — create discharge plan"
      - "POST /edt/discharge-plans/{dpId}/finalize — finalize discharge plan"
    shared_operations:
      - "POST /edt/treatment-plans/{tpId}/sign — sign THERAPY/MEDICAL discipline (Dietitian signs DIETITIAN)"
      - "POST /edt/meal-events — log meal event (with Dietitian)"
      - "POST /edt/family-programs/{fpid}/waive — waive family program (with Admin)"
      - "GET reads"

  - name: Dietitian
    description: "Registered dietitian: meal plans, supervised-meal events, nutrition discipline sign-off"
    identity: "opaque"
    exclusive_operations:
      - "POST /edt/meal-plans — create meal plan"
      - "POST /edt/meal-plans/{mpId}/close — close meal plan"
    shared_operations:
      - "POST /edt/treatment-plans/{tpId}/sign — sign DIETITIAN discipline"
      - "POST /edt/meal-events — log meal event (with Clinician)"
      - "GET reads"

  - name: UtilizationReviewer
    description: "Insurance/utilization reviewer: authorizations, concurrent reviews, appeals, expiry, billing"
    identity: "opaque"
    exclusive_operations:
      - "POST /edt/authorizations — create authorization"
      - "POST /edt/reviews — concurrent review decision"
      - "POST /edt/authorizations/{authId}/appeal — appeal a denial"
    shared_operations:
      - "POST /edt/authorizations/{authId}/expire — expire auth (with Admin)"
      - "GET billing-summary and all GET reads"
