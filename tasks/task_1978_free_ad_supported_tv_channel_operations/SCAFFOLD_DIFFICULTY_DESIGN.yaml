  # ---------------------------------------------------------------- rule 4 --
  - rule_id: transitive_cascade
    instances:
      - name: r4_publish_plays_exhaustion_cascade_reverts_validated_loops
        grounds:
          - state_machines.RightsGrant.ACTIVE_to_EXHAUSTED
          - state_machines.ContentAsset.AVAILABLE_to_WINDOW_EXPIRED
          - state_machines.PlaylistLoop.VALIDATED_to_DRAFT
          - calculations.rights_play_consumption
        distinguishing_aspect: |
          Depth-4 chain triggered by loop publish (NOT by content pull): publish
          L1 -> grant plays_used hits max_plays 1 -> grant EXHAUSTED -> content
          loses its last PENDING/ACTIVE grant -> ContentAsset WINDOW_EXPIRED ->
          unrelated VALIDATED loop L2 containing the content reverts to DRAFT.
        test_recipe:
          setup:
            - "Channel ch (600s); content ct (540s) AVAILABLE; ONE grant g (max_plays 1) ACTIVE covering both 2026-09-01 and 2026-09-02"
            - "Loop l1 for 2026-09-01 tiled (entry ct + 60s break), VALIDATED, break DECIDED (all-slate run), LOCKED; channel LIVE"
            - "Loop l2 for 2026-09-02 tiled (entry ct + 60s break), VALIDATED (remaining plays 1 >= 1 at validate time)"
          setup_api_calls:
            - { call: "POST /v1/channels", payload: { name: "Ch H", genre: "movies", timezone: "UTC", loop_duration_seconds: 600 }, as: PlatformAdmin, captures: { ch: $.data.id } }
            - { call: "POST /v1/content-assets", payload: { title: "Movie 540", content_type: "MOVIE", runtime_seconds: 540, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
