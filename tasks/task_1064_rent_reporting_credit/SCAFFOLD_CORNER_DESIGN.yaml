scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: tenant_create_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Tenant, 'endpoints["POST /api/tenants"]']
        distinguishing_aspect: "POST /api/tenants with full_name+email returns 201; server mints id, version starts at 1."
        test_recipe:
          setup: ["Empty DB; clock at default."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/tenants"
              payload: { full_name: "Ana New", email: "ana@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
          assert:
            - "POST /api/tenants response http status == 201"
            - "POST /api/tenants .data.full_name == Ana New"
            - "POST /api/tenants .data.version == 1"

      - name: tenant_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Tenant, 'errors[ERR_TENANT_NOT_FOUND]']
        distinguishing_aspect: "GET /api/tenants/{unknown} returns ERR_TENANT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/tenants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "GET /api/tenants/00000000-0000-4000-8000-000000000000 .data.error_id == ERR_TENANT_NOT_FOUND"
            - "response http status == 404"

      - name: enrollment_missing_plan_id_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Enrollment.fields.plan_id, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "POST /api/enrollments without plan_id returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A tenant exists."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tenants"
              payload: { full_name: "Rea Req", email: "rea@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /api/enrollments"
              payload: { tenant_id: "${t_id}" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /api/enrollments .data.error_id == ERR_INVALID_REQUEST"
            - "response http status == 400"

      - name: score_snapshot_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.ScoreSnapshot.fields.score, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "POST /api/score-snapshots with score 900 (>850) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A tenant exists."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tenants"
              payload: { full_name: "Sam Score", email: "sam@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /api/score-snapshots"
              payload: { tenant_id: "${t_id}", bureau: "EQUIFAX", score: 900, as_of_month: "2026-06" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "POST /api/score-snapshots .data.error_id == ERR_INVALID_REQUEST"
            - "response http status == 400"

      - name: score_snapshot_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.ScoreSnapshot]
        distinguishing_aspect: "ScoreSnapshot is common_fields:false append-only — response carries id + created_at but no version, and there is no update endpoint."
        test_recipe:
          setup: ["A tenant exists."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tenants"
              payload: { full_name: "Ima Immut", email: "ima@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /api/score-snapshots"
              payload: { tenant_id: "${t_id}", bureau: "EXPERIAN", score: 705, as_of_month: "2026-06" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          assert:
            - "POST /api/score-snapshots response http status == 201"
            - "POST /api/score-snapshots .data.score == 705"
            - "POST /api/score-snapshots .data has no `version` field"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Enrollment.PENDING_PAYMENT_to_CANCELLED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Cancelling a CANCELLED enrollment returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["An enrollment already CANCELLED (from PENDING_PAYMENT)."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/subscription-plans"
              payload: { name: "Plus", tier: "PLUS", monthly_fee_cents: 1499, back_reporting_included_months: 6 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { full_name: "Dan Double", email: "dan@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { tenant_id: "${t_id}", plan_id: "${plan_id}" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { en_id: $.data.id }
            - call: "POST /api/enrollments/${en_id}/cancel"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /api/enrollments/${en_id}/cancel"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /api/enrollments/${en_id}/cancel .data.error_id == ERR_INVALID_STATE"
            - "response http status == 409"

      - name: verify_already_verified_returns_already_verified
        claim_type: Invalid Transitions
        grounds: [state_machines.Lease.PENDING_VERIFICATION_to_VERIFIED, 'errors[ERR_ALREADY_VERIFIED]']
        distinguishing_aspect: "Verifying a VERIFIED lease returns ERR_ALREADY_VERIFIED (409)."
        test_recipe:
          setup: ["A VERIFIED lease."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tenants"
              payload: { full_name: "Vic Verify", email: "vic@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/landlords"
              payload: { company_name: "Acme PM", email: "pm@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "30 Verify St", rent_amount_cents: 120000, monthly_due_day: 5, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/verify"
              payload: { decision: "VERIFIED" }
              as: Landlord
              as_user_id: "${ll_id}"
          trigger:
            - call: "POST /api/leases/${lease_id}/verify"
              payload: { decision: "VERIFIED" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /api/leases/${lease_id}/verify .data.error_id == ERR_ALREADY_VERIFIED"
            - "response http status == 409"

      - name: resolve_from_open_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Dispute.INVESTIGATING_to_RESOLVED_UPHELD, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Resolving a dispute still in OPEN (never investigated) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A dispute in OPEN on a REPORTED item."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/subscription-plans"
              payload: { name: "Plus", tier: "PLUS", monthly_fee_cents: 1499, back_reporting_included_months: 6 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { full_name: "Ora Open", email: "ora@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/landlords"
              payload: { company_name: "Acme PM", email: "pm@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { tenant_id: "${t_id}", plan_id: "${plan_id}" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { en_id: $.data.id }
            - call: "GET /api/invoices"
              payload: { enrollment_id: "${en_id}", kind: "SUBSCRIPTION" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { sub_inv_id: "$.data[0].id" }
            - call: "POST /api/invoices/${sub_inv_id}/pay"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "31 Open Ave", rent_amount_cents: 120000, monthly_due_day: 5, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/verify"
              payload: { decision: "VERIFIED" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v2: $.data.version }
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-06", due_date: "2026-06-05T00:00:00Z", paid_date: "2026-06-05T00:00:00Z", amount_paid_cents: 120000, expected_lease_version: "${lease_v2}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /api/rent-payments/${pay_id}/report"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { ri_id: $.data.id }
            - call: "POST /api/disputes"
              payload: { reported_item_id: "${ri_id}", reason_code: "NOT_MINE" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/disputes/${d_id}/resolve"
              payload: { resolution: "UPHELD" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "POST /api/disputes/${d_id}/resolve .data.error_id == ERR_INVALID_STATE"
            - "response http status == 409"

      - name: dispute_upheld_reinstates_reported_item
        claim_type: Valid Transition
        grounds: [state_machines.Dispute.INVESTIGATING_to_RESOLVED_UPHELD, state_machines.ReportedItem.DISPUTED_to_REPORTED]
        distinguishing_aspect: "Resolving UPHELD sets dispute RESOLVED_UPHELD and reinstates the item to REPORTED (no superseding item)."
        test_recipe:
          setup: ["A dispute in INVESTIGATING on a REPORTED item; analyst-1 investigated."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/subscription-plans"
              payload: { name: "Plus", tier: "PLUS", monthly_fee_cents: 1499, back_reporting_included_months: 6 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { full_name: "Uma Uphold", email: "uma@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/landlords"
              payload: { company_name: "Acme PM", email: "pm@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { tenant_id: "${t_id}", plan_id: "${plan_id}" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { en_id: $.data.id }
            - call: "GET /api/invoices"
              payload: { enrollment_id: "${en_id}", kind: "SUBSCRIPTION" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { sub_inv_id: "$.data[0].id" }
            - call: "POST /api/invoices/${sub_inv_id}/pay"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "32 Uphold Rd", rent_amount_cents: 120000, monthly_due_day: 5, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/verify"
              payload: { decision: "VERIFIED" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v2: $.data.version }
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-06", due_date: "2026-06-05T00:00:00Z", paid_date: "2026-06-05T00:00:00Z", amount_paid_cents: 120000, expected_lease_version: "${lease_v2}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /api/rent-payments/${pay_id}/report"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { ri_id: $.data.id }
            - call: "POST /api/disputes"
              payload: { reported_item_id: "${ri_id}", reason_code: "NOT_MINE" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { d_id: $.data.id }
            - call: "POST /api/disputes/${d_id}/investigate"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /api/disputes/${d_id}/resolve"
              payload: { resolution: "UPHELD" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "POST /api/disputes/${d_id}/resolve .data.status == RESOLVED_UPHELD"
            - "GET /api/reported-items/${ri_id} .data.status == REPORTED"
            - "GET /api/reported-items?supersedes_item_id=${ri_id} .data length == 0"

      - name: backreport_reject_voids_fee_invoice
        claim_type: Valid Transition
        grounds: [state_machines.BackReportRequest.PENDING_to_REJECTED, entities.Invoice.fields.status]
        distinguishing_aspect: "Decision REJECTED moves a PENDING back-report to REJECTED and VOIDs its BACK_REPORT fee invoice."
        test_recipe:
          setup: ["ACTIVE enrollment (plan included 0), VERIFIED lease, one RECORDED payment for 2026-05, a PENDING back-report [2026-05] with a DUE fee invoice (200)."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/subscription-plans"
              payload: { name: "Basic", tier: "BASIC", monthly_fee_cents: 999, back_reporting_included_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /api/tenants"
              payload: { full_name: "Rex Reject", email: "rex@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/landlords"
              payload: { company_name: "Acme PM", email: "pm@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /api/enrollments"
              payload: { tenant_id: "${t_id}", plan_id: "${plan_id}" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { en_id: $.data.id }
            - call: "GET /api/invoices"
              payload: { enrollment_id: "${en_id}", kind: "SUBSCRIPTION" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { sub_inv_id: "$.data[0].id" }
            - call: "POST /api/invoices/${sub_inv_id}/pay"
              payload: {}
              as: Tenant
              as_user_id: "${t_id}"
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "33 Reject Ln", rent_amount_cents: 120000, monthly_due_day: 5, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/verify"
              payload: { decision: "VERIFIED" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v2: $.data.version }
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-05", due_date: "2026-05-05T00:00:00Z", paid_date: "2026-05-05T00:00:00Z", amount_paid_cents: 120000, expected_lease_version: "${lease_v2}" }
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "POST /api/back-report-requests"
              payload: { lease_id: "${lease_id}", requested_months: ["2026-05"] }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { br_id: $.data.id }
            - call: "GET /api/invoices"
              payload: { back_report_request_id: "${br_id}", kind: "BACK_REPORT" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { br_inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/back-report-requests/${br_id}/decision"
              payload: { decision: "REJECTED" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "POST /api/back-report-requests/${br_id}/decision .data.status == REJECTED"
            - "GET /api/invoices/${br_inv_id} .data.status == VOID"

      - name: lease_verify_reject_sets_rejected
        claim_type: Valid Transition
        grounds: [state_machines.Lease.PENDING_VERIFICATION_to_REJECTED, entities.Lease.fields.verification_status]
        distinguishing_aspect: "Decision REJECTED sets a pending lease's verification_status to REJECTED."
        test_recipe:
          setup: ["A PENDING_VERIFICATION lease."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tenants"
              payload: { full_name: "Ray Rej", email: "ray@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/landlords"
              payload: { company_name: "Acme PM", email: "pm@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "34 Rej Blvd", rent_amount_cents: 120000, monthly_due_day: 5, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { lease_id: $.data.id }
          trigger:
            - call: "POST /api/leases/${lease_id}/verify"
              payload: { decision: "REJECTED", note: "docs missing" }
              as: Landlord
              as_user_id: "${ll_id}"
          assert:
            - "POST /api/leases/${lease_id}/verify .data.verification_status == REJECTED"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: back_report_fee_zero_when_within_included_allowance
        claim_type: Correct Result
        grounds: [calculations.back_report_fee, entities.BackReportRequest.fields.fee_cents]
