            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /reinvestment-accounts"
              payload: { installation_id: "${inst_id}", fiscal_year: 2026, opening_balance_cents: 5000000, occupancy_basis: "UNIT_DAY_WEIGHTED" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /installations/${inst_id}/allotment-run"
              payload: { period_month: "2026-09" }
              as: PropertyManager
            - call: "POST /hazard-cases"
              payload: { housing_unit_id: "${u1_id}", lease_id: "${l1_id}", hazard_type: "MOLD", reported_symptoms: "Growth across the master bedroom wall" }
              as: PropertyManager
              captures: { hz_id: $.data.id }
            - call: "POST /hazard-cases/${hz_id}/assess"
              payload: { affected_area_sqft: 45, child_under_six_present: true }
              as: EnvironmentalSpecialist
              as_user_id: "es-user-1"
              captures: { rwo_id: $.data.remediation_work_order_id }
            - call: "POST /displacement-lodgings"
              payload: { hazard_case_id: "${hz_id}", lease_id: "${l1_id}", start_date: "2026-09-20", end_date: "2026-09-30", nightly_rate_cents: 22000, occupants_count: 4 }
              as: PropertyManager
              captures: { lodg_id: $.data.id }
            - call: "GET /leases/${l1_id}"
              payload: {}
              as: PropertyManager
              captures: { bal_before_void: $.data.allotment_balance_cents, abate_before_void: $.data.abatement_total_cents }
          trigger:
            - call: "POST /hazard-cases/${hz_id}/void"
              payload: { void_reason: "Laboratory re-analysis identified the sample as harmless efflorescence, not mold" }
              as: InstallationHousingOffice
              as_user_id: "iho-user-1"
              captures: { hz_status: $.data.status }
          assert:
            - "${bal_before_void} == 139258 and ${abate_before_void} == 78892 — the pre-void state is the abated one"
            - "${hz_status} == VOIDED (terminal)"
            - "GET /leases/${l1_id}/allotment-transactions now returns exactly 3 rows in chronological order: CHARGE +218150 with running_balance_cents 218150, ABATEMENT -78892 with running_balance_cents 139258, and ARREARS_ADJUSTMENT +78892 with running_balance_cents 218150"
            - "the ABATEMENT row is still present and still -78892 — the reversal appended a compensating row instead of editing or deleting history"
            - "Lease.${l1_id}.allotment_balance_cents == 218150, bit-for-bit the pre-abatement value, and equals the running sum of the three rows"
            - "Lease.${l1_id}.abatement_total_cents == 0 — not 1, not -1, and not 78892"
            - "Lease.${l1_id}.allotment_status == ACTIVE and occupancy_status is still OCCUPIED"
            - "HousingUnit.${u1_id}.status == OCCUPIED with hazard_hold_reason null, and Installation.${inst_id}.hazard_hold_unit_count == 0, occupied_unit_count == 1, total_unit_count == 1"
            - "WorkOrder.${rwo_id}.status == CLOSED — the void drove the open remediation order to the terminal state"
            - "DisplacementLodging.${lodg_id}.status == CLOSED with actual_end_date == 2026-09-20 (its own start_date), nights_displaced 0, lodging_authorized_cents 0 and rent_abatement_cents 0"
            - "ReinvestmentAccount.${acct_id}.expenditures_cents == 0 and closing_balance_cents == 5000000 — the cascaded zero-night lodging expenditure moved no money either"

      - name: unit_status_counters_conserve_installation_inventory
        grounds:
          - calculations.unit_inventory_conservation
          - state_machines.HousingUnit.AVAILABLE_to_HAZARD_HOLD
          - state_machines.HousingUnit.HAZARD_HOLD_to_AVAILABLE
          - state_machines.HousingUnit.AVAILABLE_to_OFFLINE_MAINTENANCE
          - entities.Installation.fields.total_unit_count
          - endpoints.POST_/housing-units/{id}/status
        distinguishing_aspect: |
          The conserved quantity is a COUNT, not money: available_unit_count +
          assigned_unit_count + occupied_unit_count + offline_unit_count +
          hazard_hold_unit_count must equal total_unit_count after every single
          status write, and total_unit_count itself must never move because no
          unit is created or destroyed. Two units are pushed out of AVAILABLE
          into two different non-AVAILABLE buckets and then released, while a
          third stays OCCUPIED throughout; the release must also clear
          hazard_hold_reason. Instance 9.1 conserves a ledger balance instead.
        test_recipe:
          setup:
            - "One installation with three units created in this order: A-101 (2-bedroom TOWNHOME, JUNIOR_ENLISTED), B-200 (3-bedroom SFH, SENIOR_ENLISTED) and C-300 (2-bedroom APARTMENT, JUNIOR_ENLISTED)."
            - "One E5 sponsor with three full-time-custody dependents, so bedroom_eligibility is 2 and rank_category is JUNIOR_ENLISTED; the offer run walks units by bedroom_count ASC then created_at ASC and therefore offers A-101, leaving B-200 and C-300 AVAILABLE."
            - "Lease 1 on A-101 is OCCUPIED / ACTIVE from 2026-09-01, so the starting counters are total 3, available 2, assigned 0, occupied 1, offline 0, hazard_hold 0."
            - "The clock stands at 2026-09-10T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /bah-rates"
              payload: { installation_id: "${inst_id}", pay_grade: "E5", with_dependents: true, effective_year: 2026, monthly_rate_cents: 245000, utility_allowance_cents: 19500 }
              as: PlatformAdmin
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "B-200", bedroom_count: 3, unit_type: "SFH", designated_rank_category: "SENIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u2_id: $.data.id }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "C-300", bedroom_count: 2, unit_type: "APARTMENT", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u3_id: $.data.id }
            - call: "POST /service-members"
              payload: { dodid: "1000000001", last_name: "Reyes", first_name: "Ana", branch: "ARMY", pay_grade: "E5" }
              as: PlatformAdmin
              captures: { sm1_id: $.data.id }
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "SPOUSE", date_of_birth: "1992-03-04", gender: "FEMALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2018-04-10", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2022-03-15", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /waitlist-applications"
              payload: { installation_id: "${inst_id}", service_member_id: "${sm1_id}", pcs_orders_date: "2026-08-25", expected_arrival_date: "2026-09-01", accessibility_required: false }
              as: ServiceMember
              as_user_id: "${sm1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /installations/${inst_id}/waitlist-offer-run"
              payload: {}
              as: PropertyManager
            - call: "POST /waitlist-applications/${app1_id}/accept-offer"
              payload: {}
              as: ServiceMember
              as_user_id: "${sm1_id}"
            - call: "POST /leases"
              payload: { application_id: "${app1_id}", housing_unit_id: "${u1_id}", start_date: "2026-09-01", term_months: 12 }
              as: PropertyManager
              captures: { l1_id: $.data.id }
            - call: "POST /move-in-inspections"
              payload: { lease_id: "${l1_id}", scheduled_date: "2026-08-31" }
              as: PropertyManager
              captures: { insp1_id: $.data.id }
            - call: "POST /move-in-inspections/${insp1_id}/tenant-acknowledge"
              payload: { tenant_signature_name: "Ana Reyes", bill_of_rights_version_ack: "2026.1" }
              as: ServiceMember
              as_user_id: "${sm1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /leases/${l1_id}/move-in"
              payload: {}
              as: PropertyManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /installations/${inst_id}"
              payload: {}
              as: PropertyManager
              captures: { t0_total: $.data.total_unit_count, t0_avail: $.data.available_unit_count, t0_occ: $.data.occupied_unit_count }
          trigger:
            - call: "POST /housing-units/${u3_id}/status"
              payload: { status: "HAZARD_HOLD", hazard_hold_reason: "Lead paint survey pending in the stairwell" }
              as: PropertyManager
              captures: { u3_status: $.data.status, u3_reason: $.data.hazard_hold_reason }
            - call: "GET /installations/${inst_id}"
              payload: {}
              as: PropertyManager
              captures: { t1_total: $.data.total_unit_count, t1_avail: $.data.available_unit_count, t1_hazard: $.data.hazard_hold_unit_count, t1_offline: $.data.offline_unit_count, t1_occ: $.data.occupied_unit_count, t1_assigned: $.data.assigned_unit_count }
            - call: "POST /housing-units/${u2_id}/status"
              payload: { status: "OFFLINE_MAINTENANCE" }
              as: PropertyManager
              captures: { u2_status: $.data.status }
            - call: "GET /installations/${inst_id}"
              payload: {}
              as: PropertyManager
              captures: { t2_total: $.data.total_unit_count, t2_avail: $.data.available_unit_count, t2_hazard: $.data.hazard_hold_unit_count, t2_offline: $.data.offline_unit_count, t2_occ: $.data.occupied_unit_count, t2_assigned: $.data.assigned_unit_count }
            - call: "POST /housing-units/${u3_id}/status"
              payload: { status: "AVAILABLE" }
              as: PropertyManager
              captures: { u3_released: $.data.status, u3_reason_after: $.data.hazard_hold_reason }
            - call: "GET /installations/${inst_id}"
              payload: {}
              as: PropertyManager
              captures: { t3_total: $.data.total_unit_count, t3_avail: $.data.available_unit_count, t3_hazard: $.data.hazard_hold_unit_count, t3_offline: $.data.offline_unit_count, t3_occ: $.data.occupied_unit_count, t3_assigned: $.data.assigned_unit_count }
            - call: "POST /housing-units/${u2_id}/status"
              payload: { status: "AVAILABLE" }
              as: PropertyManager
              captures: { u2_released: $.data.status }
            - call: "GET /installations/${inst_id}"
              payload: {}
              as: PropertyManager
              captures: { t4_total: $.data.total_unit_count, t4_avail: $.data.available_unit_count, t4_hazard: $.data.hazard_hold_unit_count, t4_offline: $.data.offline_unit_count, t4_occ: $.data.occupied_unit_count, t4_assigned: $.data.assigned_unit_count }
          assert:
            - "starting point: ${t0_total} == 3, ${t0_avail} == 2, ${t0_occ} == 1"
            - "after the hazard hold: ${u3_status} == HAZARD_HOLD with ${u3_reason} non-null, and ${t1_avail} == 1, ${t1_hazard} == 1, ${t1_offline} == 0, ${t1_occ} == 1, ${t1_assigned} == 0 with ${t1_total} == 3 — the five counters sum to 3"
            - "after the maintenance takedown: ${u2_status} == OFFLINE_MAINTENANCE, and ${t2_avail} == 0, ${t2_offline} == 1, ${t2_hazard} == 1, ${t2_occ} == 1, ${t2_assigned} == 0 with ${t2_total} == 3 — the counters still sum to 3"
            - "after releasing the hazard hold: ${u3_released} == AVAILABLE, ${u3_reason_after} is null (the reason is cleared on every transition out of HAZARD_HOLD), and ${t3_avail} == 1, ${t3_hazard} == 0, ${t3_offline} == 1, ${t3_occ} == 1, ${t3_assigned} == 0 with ${t3_total} == 3"
            - "after releasing the maintenance takedown: ${u2_released} == AVAILABLE, and ${t4_avail} == 2, ${t4_offline} == 0, ${t4_hazard} == 0, ${t4_occ} == 1, ${t4_assigned} == 0 with ${t4_total} == 3 — the inventory has returned exactly to its starting distribution"
            - "${t0_total} == ${t1_total} == ${t2_total} == ${t3_total} == ${t4_total} == 3 throughout: no status write ever creates or destroys a unit"
            - "the OCCUPIED unit A-101 is untouched by all four writes: HousingUnit.${u1_id}.status is still OCCUPIED and Lease.${l1_id}.occupancy_status is still OCCUPIED with allotment_status ACTIVE"
