        payload: {}
        as: ClaimsSpecialist
      - call: GET /ssa/workers/${w3b}/earnings-years
        payload: {}
        as: ClaimsSpecialist
      assert:
      - EarningsYear(${w3b}, 2025).indexed_earnings_cents == 1975000 (face value, no indexation factor)
      - BenefitClaim.${c3b}.aime_cents == 4700, pia_cents == 4230, monthly_benefit_cents == 2960
  - name: cola_january_only_and_prior_entitlement_only
    claim_type: constants_applied
