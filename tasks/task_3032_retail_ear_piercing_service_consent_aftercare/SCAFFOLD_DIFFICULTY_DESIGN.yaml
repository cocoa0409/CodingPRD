              payload: { state_code: "IL", min_age_self_consent: 18, min_age_with_guardian: 6, min_age_absolute: 6, permitted_sites: ["LOBE"], requires_guardian_presence: false, record_retention_years: 7, consent_form_version: "IL-2026", sterilization_protocol_code: "AUTOCLAVE-B" }
