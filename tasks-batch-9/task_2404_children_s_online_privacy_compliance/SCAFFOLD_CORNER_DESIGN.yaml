        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one MIXED_AUDIENCE service."
            - "Regulator-approved program with annual_assessment_required true, validity 365, grace 30."
            - "Assessment opened by assessor-1 and driven through two remediation rounds with findings still open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
