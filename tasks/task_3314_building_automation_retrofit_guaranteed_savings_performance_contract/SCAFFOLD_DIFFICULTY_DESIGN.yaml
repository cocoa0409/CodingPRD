        captures:
          ov_pb_id: $.data.id
      - call: POST /performance-contracts/${c1_id}/phases
        payload:
          phase_label: Adjacent C
          window_start: '2026-09-20T00:00:00Z'
          window_end: '2026-09-25T00:00:00Z'
          disruption_budget_hours: 10
        as: ESCOEngineer
        as_user_id: ${eng_id}
        captures:
          ov_pc_id: $.data.id
