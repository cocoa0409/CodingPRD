  - title_id?
  - translation_status?
  output: LocalizationPack[]
  side_effects: []
- method: POST
  path: /qa-cert/localization-packs/{packId}/transition
  description: 'axis TRANSLATION (ReleaseManager): DRAFT->TRANSLATING->LQA->LOCKED with coverage gate, LQA->TRANSLATING fail-back; axis SIGNOFF
    (QALead): UNSIGNED->SIGNED'
  roles:
  - ReleaseManager
  - QALead
  code: 200
  input:
  - axis
  - to_status
  - translated_text_assets?
  - translated_audio_assets?
  output: LocalizationPack
  side_effects:
  - Translated counts applied before gate evaluation; coverage recomputed
- method: POST
  path: /qa-cert/release-windows
  description: Reserve a launch / day-one-patch / hotfix deployment window (half-open overlap check per platform)
  roles:
  - ReleaseManager
  code: 201
  input:
  - title_id
  - platform_code
  - kind
  - start_utc
  - end_utc
  output: ReleaseWindow
  side_effects:
  - status = RESERVED; ERR_WINDOW_OVERLAP on half-open collision; ERR_WINDOW_IN_PAST if start_utc <= now
- method: GET
  path: /qa-cert/release-windows/{windowId}
  description: Get a release window
  roles:
  - Any
  code: 200
  input: []
  output: ReleaseWindow
  side_effects: []
- method: GET
  path: /qa-cert/release-windows
  description: List release windows
  roles:
  - Any
  code: 200
  input:
  - title_id?
  - platform_code?
  - kind?
  - status?
  output: ReleaseWindow[]
  side_effects: []
- method: POST
  path: /qa-cert/release-windows/{windowId}/transition
  description: RESERVED -> CONFIRMED (title-state gate + demand fee charged) -> CONSUMED (clock >= start); RESERVED/CONFIRMED -> RELEASED
  roles:
  - ReleaseManager
  code: 200
  input:
  - to_status
  output: ReleaseWindow
  side_effects:
  - CONFIRM charges fee_cents to title spent per window_demand_fee
- method: POST
  path: /qa-cert/cert-blackout-windows
  description: Declare a platform certification freeze with a submission buffer on both ends
  roles:
  - PlatformAdmin
  code: 201
  input:
  - platform_code
  - start_utc
  - end_utc
  - buffer_hours
  - reason
  output: CertBlackoutWindow
  side_effects: []
- method: GET
  path: /qa-cert/cert-blackout-windows/{windowId}
  description: Get a blackout window
  roles:
  - Any
  code: 200
  input: []
  output: CertBlackoutWindow
  side_effects: []
- method: GET
  path: /qa-cert/cert-blackout-windows
  description: List blackout windows
  roles:
  - Any
  code: 200
  input:
  - platform_code?
  output: CertBlackoutWindow[]
  side_effects: []
- method: DELETE
  path: /qa-cert/cert-blackout-windows/{windowId}
  description: Remove a blackout window
  roles:
  - PlatformAdmin
  code: 204
  input: []
  output: null
  side_effects: []
- method: POST
  path: /qa-cert/hotfixes
  description: Declare a post-launch hotfix (title must be LAUNCHED and not embargoed)
  roles:
  - ReleaseManager
  code: 201
  input:
  - title_id
  - platform_code
  - build_id
  - severity
  - incident_summary
  output: Hotfix
  side_effects:
  - status = DECLARED
- method: GET
  path: /qa-cert/hotfixes/{hotfixId}
  description: Get a hotfix
  roles:
  - Any
  code: 200
  input: []
  output: Hotfix
  side_effects: []
- method: GET
  path: /qa-cert/hotfixes
  description: List hotfixes
  roles:
  - Any
  code: 200
  input:
  - title_id?
  - status?
  - build_id?
  output: Hotfix[]
  side_effects: []
- method: POST
  path: /qa-cert/hotfixes/{hotfixId}/transition
  description: 'DECLARED->IN_DEV->READY_FOR_CERT (ReleaseManager); READY_FOR_CERT->EXPEDITED_CERT (PlatformReviewer: S1 rolling quota + HOTFIX_DEPLOY
    window + fee); EXPEDITED_CERT->DEPLOYED and DEPLOYED->ROLLED_BACK (ReleaseManager)'
  roles:
  - ReleaseManager
  - PlatformReviewer
  code: 200
  input:
  - to_status
  output: Hotfix
  side_effects:
  - EXPEDITED_CERT charges fee and stamps expedited_cert_entered_at; DEPLOYED consumes the covering window; ROLLED_BACK increments title.hotfix_rollback_count
    (>= 2 auto-embargoes the title)
errors:
- id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http: 400
  condition: X-User-ID or X-User-Role header missing or not a declared role
- id: ERR_INSUFFICIENT_PERMISSIONS
  http: 403
  condition: Role may not perform this endpoint/action (per-action roles on transition endpoints included)
- id: ERR_INVALID_REQUEST
  http: 400
  condition: 'Malformed request: missing required field, bad enum, bad type, out-of-range scalar, end_utc <= start_utc'
- id: ERR_NOT_FOUND
  http: 404
  condition: Path or body-referenced resource does not exist
- id: ERR_ENTRY_NOT_FOUND
  http: 404
  condition: No embedded entry with the given feature_area in the referenced plan
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_title_version / expected_checklist_version does not match the parent's current version
- id: ERR_INVALID_STATE
  http: 409
  condition: 'Generic state-machine guard: requested transition not legal from the current state, or a state precondition failed'
- id: ERR_PACKAGE_NOT_ASSEMBLING
  http: 409
  condition: Package submit attempted from any state other than ASSEMBLING
- id: ERR_PACKAGE_NOT_REVIEWABLE
  http: 409
  condition: Findings can only be filed while the package is IN_REVIEW or REJECTED
- id: ERR_CHECKLIST_NOT_EDITABLE
  http: 409
  condition: Checklist item verify/waive attempted while the owning package is not ASSEMBLING
- id: ERR_PLAN_NOT_DRAFT
  http: 409
  condition: Entries can only be added while the plan is DRAFT
- id: ERR_BUILD_NOT_CANDIDATE
  http: 409
  condition: Package assembly requires the referenced build to be CANDIDATE
- id: ERR_FIX_BUILD_NOT_QUALIFIED
  http: 409
  condition: Fix build must be TEST_PASSED or CANDIDATE (finding mark-fixed, hotfix READY_FOR_CERT)
- id: ERR_NO_PLAN_ENTRIES
  http: 409
  condition: Plan cannot enter IN_REVIEW with zero entries
- id: ERR_NO_APPROVED_PACKAGE
  http: 409
  condition: Title cannot reach CERT_APPROVED without an APPROVED submission package
- id: ERR_TITLE_NOT_CERT_APPROVED
  http: 409
  condition: LAUNCH / DAY_ONE_PATCH window confirm requires the title CERT_APPROVED
- id: ERR_TITLE_NOT_LAUNCHED
  http: 409
  condition: Hotfix creation and HOTFIX_DEPLOY window confirm require the title LAUNCHED
- id: ERR_VENDOR_NOT_ACTIVE
  http: 409
  condition: Assignments can only be created for ACTIVE vendors
- id: ERR_WAIVER_REQUIRES_FAILED_ITEM
  http: 409
  condition: Waivers may only be requested for items in FAILED
- id: ERR_WAIVER_NOT_PENDING
  http: 409
  condition: Waiver decision requires the item's waiver_status == PENDING
- id: ERR_TITLE_UNDER_EMBARGO
  http: 403
  condition: Title is embargoed; package submit and hotfix creation are blocked
- id: ERR_SELF_CERT_DECISION
  http: 403
  condition: 'Segregation of duties: the package submitter cannot decide the same package'
- id: ERR_SELF_WAIVER_DECISION
  http: 403
  condition: 'Segregation of duties: the waiver requester cannot decide that waiver'
- id: ERR_SUBMISSION_BLACKOUT_ACTIVE
  http: 409
  condition: Submit timestamp inside a buffered blackout interval for the platform
- id: ERR_WINDOW_IN_PAST
  http: 400
  condition: Window start_utc must be strictly after the logical clock
- id: ERR_HOTFIX_QUOTA_EXCEEDED
  http: 409
  condition: Two S1 hotfixes already entered EXPEDITED_CERT within the rolling 30-day window
- id: ERR_FINDING_BUILD_NOT_NEWER
  http: 422
  condition: Fix build must be created strictly after the rejected package's build
- id: ERR_BUILD_TITLE_MISMATCH
  http: 422
  condition: Referenced build belongs to a different title
- id: ERR_BUILD_PLATFORM_MISMATCH
  http: 422
  condition: Referenced build targets a different platform
- id: ERR_REGRESSION_TARGET_NOT_CLOSED
  http: 422
  condition: regression_of_id must reference a bug of the same title in RESOLVED, VERIFIED, or CLOSED
- id: ERR_WEEK_START_NOT_MONDAY
  http: 422
  condition: week_start_date must be a Monday (ISO week start)
- id: ERR_CHECKLIST_INCOMPLETE
  http: 409
  condition: Submit requires every checklist item in PASSED, WAIVED, or NA
- id: ERR_OPEN_BLOCKERS_EXIST
  http: 409
  condition: An open BLOCKER bug exists on the title (submit / launch / build-promote gates)
- id: ERR_OPEN_CATEGORY_A_FINDINGS
  http: 409
  condition: A prior round for the same (title, platform) has CATEGORY_A findings still OPEN or FIXED_IN_BUILD
- id: ERR_AGE_RATING_NOT_GRANTED
  http: 409
  condition: No GRANTED age-rating filing for the platform's mapped territory
- id: ERR_LOCALIZATION_NOT_LOCKED
  http: 409
  condition: A required localization pack is not LOCKED+SIGNED
- id: ERR_REQUIRED_COVERAGE_MISSING
  http: 409
  condition: Plan approval requires every cert-blocker entry COVERED
- id: ERR_WINDOW_OVERLAP
  http: 409
  condition: Half-open overlap with an existing RESERVED/CONFIRMED window on the platform
- id: ERR_COVERAGE_BELOW_LOCK_THRESHOLD
  http: 409
  condition: LOCK requires text_coverage_pct >= 98.00 and audio_coverage_pct >= 95.00
- id: ERR_NO_HOTFIX_WINDOW
  http: 409
  condition: No CONFIRMED HOTFIX_DEPLOY window covers the current logical time
- id: ERR_DUPLICATE_TEST_PLAN
  http: 409
  condition: A non-ARCHIVED plan already exists for (title, platform)
- id: ERR_DUPLICATE_FEATURE_AREA
  http: 409
  condition: feature_area already present in the plan
- id: ERR_DUPLICATE_BUILD_VERSION
  http: 409
  condition: version_string already used for (title, platform)
- id: ERR_DUPLICATE_FILING
  http: 409
  condition: A DRAFT or FILED filing already exists for (title, territory)
- id: ERR_DUPLICATE_LOCALE
  http: 409
  condition: A localization pack already exists for (title, locale)
- id: ERR_CERT_BUDGET_EXCEEDED
  http: 402
  condition: cert_budget_available_cents below the fee about to be charged
- id: ERR_VENDOR_CAPACITY_EXCEEDED
  http: 409
  condition: Sum of the week's non-terminal reservations would exceed weekly_capacity_hours (equality is allowed)
- id: ERR_NA_NOT_ALLOWED_FOR_REQUIRED
  http: 400
  condition: result NA is only accepted for RECOMMENDED checklist items
roles:
- name: ReleaseManager
  description: Owns title lifecycle, release windows, age-rating filings, localization packs, hotfix declaration/deployment
  identity: opaque
  exclusive_operations:
  - POST /qa-cert/titles; POST .../titles/{id}/transition
  - POST /qa-cert/release-windows; POST .../release-windows/{id}/transition
  - POST /qa-cert/age-rating-filings; file/amend transitions
  - POST /qa-cert/localization-packs; TRANSLATION-axis transitions
  - POST /qa-cert/hotfixes; hotfix IN_DEV/READY_FOR_CERT/DEPLOYED/ROLLED_BACK transitions
  shared_operations:
  - All GET endpoints
- name: QALead
  description: Owns test plans, builds, bug intake/triage/lifecycle, localization signoff
  identity: opaque
  exclusive_operations:
  - POST /qa-cert/test-plans; POST .../entries; plan transitions
  - POST /qa-cert/builds; build transitions
  - POST /qa-cert/bugs; triage; bug transitions
  - LocalizationPack SIGNOFF-axis transition
  shared_operations:
  - All GET endpoints
- name: VendorManager
  description: Owns external QA vendors, capacity, assignments, invoice reads
  identity: opaque
  exclusive_operations:
  - POST /qa-cert/vendors; vendor transitions
  - POST /qa-cert/assignments; assignment transitions
  - GET /qa-cert/vendors/{id}/invoice
  shared_operations:
  - All GET endpoints
- name: CertificationLead
  description: Assembles and submits certification packages, withdraws them, requests waivers, marks findings fixed
  identity: opaque
  exclusive_operations:
  - POST /qa-cert/titles/{id}/submission-packages
  - Package submit and withdraw transitions
  - POST .../items/waive
  - Finding FIXED_IN_BUILD transition
  shared_operations:
  - All GET endpoints
- name: PlatformReviewer
  description: 'Platform-holder side: reviews submissions, files and verifies findings, decides age-rating filings, grants expedited hotfix cert'
  identity: opaque
  exclusive_operations:
  - Package IN_REVIEW and APPROVED/REJECTED decide transitions
  - POST /qa-cert/submission-packages/{id}/findings
  - Finding VERIFIED / reopen (passed=false) transitions
  - Age-rating GRANTED/CHALLENGED decisions
  - Hotfix EXPEDITED_CERT transition
  shared_operations:
  - All GET endpoints
- name: ComplianceManager
  description: Verifies TRC checklist items, decides waivers (never own requests), manages embargoes
  identity: opaque
  exclusive_operations:
  - POST .../items/verify
  - POST .../items/waiver-decision
  - POST /qa-cert/titles/{id}/embargo
  shared_operations:
  - All GET endpoints
- name: PlatformAdmin
  description: 'Operator: logical clock, ops-run checkpoint, blackout windows'
  identity: opaque
  exclusive_operations:
  - POST /_clock/set_current_utc
  - POST /qa-cert/ops/run
  - POST/DELETE /qa-cert/cert-blackout-windows
  shared_operations:
  - All GET endpoints
- name: Any
  description: 'Marker role for read-only endpoints: every declared role (and only declared roles) may read'
  identity: opaque
  exclusive_operations: []
  shared_operations:
  - All GET endpoints
