            - "VendorAllowanceAgreement.${agreement_id}.current_share_pct was 15.00 and current_cap_cents 40000 while COUNTERED"
            - "${r3_status} == PROPOSED, ${r3_round} == 3 and ${r3_owner} == PricingAnalyst after the retailer counter (the machine returns to PROPOSED, not forward to a new state)"
