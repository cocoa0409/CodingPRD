# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Judgment Enforcement & Asset Search — task 2115
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7. Deleting this file changes
# no declared behaviour; it only makes coverage harder to audit.
# Logical clock default before any /_clock call: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: payoff_statutory_vs_principal_first_on_judgment_ledger
        grounds:
          - calculations.judgment_payoff_replay
          - entities.Judgment.fields.application_order
          - entities.Judgment.fields.accrued_interest_cents
          - entities.Payment.fields.applied_to_interest_cents
          - endpoints[GET /judgments/{judgment_id}/payoff]
        distinguishing_aspect: |
          This instance is the money-ledger domain: identical payment history on the SAME Judgment row
          priced under STATUTORY_ORDER yields total_payoff_cents == 4299064 while PRINCIPAL_FIRST yields
          4293767, a 5297-cent divergence caused purely by which bucket the 1000000-cent payment drains first.
        test_recipe:
          setup:
            - "One creditor, one CA debtor, one CA judgment entered 2026-01-01 with 5000000 cents principal, 1000 bps statutory interest and 45000 cents of taxed filing costs."
            - "Exactly one APPLIED payment of 1000000 cents received on 2026-03-02, recorded while Judgment.application_order is still the default STATUTORY_ORDER."
            - "Logical clock still at its 2026-08-01T00:00:00Z default, so the default quote date is 2026-08-01."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA", head_of_household: false, weekly_disposable_earnings_cents: 100000 }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-0001", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 1000, entered_on: "2026-01-01", filing_costs_cents: 45000 }
              as: CaseManager
              captures: { jud_id: $.data.id }
            - call: "POST /payments"
              payload: { judgment_id: "${jud_id}", amount_cents: 1000000, received_on: "2026-03-02", source: "DEBTOR_DIRECT" }
              as: CaseManager
              captures: { pay_id: $.data.id, pay_interest: $.data.applied_to_interest_cents, pay_costs: $.data.applied_to_costs_cents, pay_principal: $.data.applied_to_principal_cents }
          trigger:
            - call: "GET /judgments/${jud_id}/payoff"
              payload: { as_of: "2026-08-01", application_order: "STATUTORY_ORDER" }
              as: CaseManager
              captures: { st_total: $.data.total_payoff_cents, st_principal: $.data.principal_balance_cents, st_interest: $.data.accrued_interest_cents, st_costs: $.data.costs_balance_cents }
            - call: "GET /judgments/${jud_id}/payoff"
              payload: { as_of: "2026-08-01", application_order: "PRINCIPAL_FIRST" }
              as: CaseManager
              captures: { pf_total: $.data.total_payoff_cents, pf_principal: $.data.principal_balance_cents, pf_interest: $.data.accrued_interest_cents, pf_costs: $.data.costs_balance_cents }
          assert:
            - "${st_total} == 4299064"
            - "${st_principal} == 4127192"
            - "${st_interest} == 171872"
            - "${st_costs} == 0"
            - "${pf_total} == 4293767"
            - "${pf_principal} == 4000000"
            - "${pf_interest} == 248767"
            - "${pf_costs} == 45000"
            - "${st_total} - ${pf_total} == 5297"
            - "${pay_costs} == 45000"
            - "${pay_interest} == 82192"
            - "${pay_principal} == 872808"
            - "Judgment.${jud_id}.total_payoff_cents == 4299064"

      - name: recoverability_preliminary_vs_certified_on_debtor_risk
        grounds:
          - calculations.debtor_recoverability_score
          - entities.Debtor.fields.recoverability_score
          - entities.Debtor.fields.certified_recoverability_score
          - entities.AssetFinding.fields.status
          - state_machines.AssetFinding.OPEN_to_VERIFIED
        distinguishing_aspect: |
          This instance is the debtor-risk domain, not the money ledger: the SAME two asset findings
          (one VERIFIED at 2000000 cents, one still OPEN at 2000000 cents) score 78 under the PRELIMINARY
          variant and 64 under the CERTIFIED variant, because CERTIFIED drops OPEN findings outright
          instead of discounting them to 60%.
        test_recipe:
          setup:
            - "One CA debtor located by a completed skip trace (locate_status == LOCATED, no_show_count == 0)."
            - "Two PUBLIC_RECORD asset findings on the same judgment, each 2000000 cents: a BANK_ACCOUNT finding VERIFIED by investigator inv-1, and a REAL_PROPERTY finding left OPEN."
            - "A CA county filing RECORDED, so Judgment.enforcement_posture is LIEN_PERFECTED and a writ may be requested."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA", head_of_household: false, weekly_disposable_earnings_cents: 100000 }
              as: CaseManager
              captures: { dbt_id: $.data.id, dbt_v: $.data.version }
            - call: "POST /debtors/${dbt_id}/skip-trace"
              payload: { vendor: "TLOxp", located: true, hits_count: 3, expected_debtor_version: "${dbt_v}" }
              as: AssetInvestigator
              as_user_id: "inv-1"
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-0002", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 1000, entered_on: "2026-01-01", filing_costs_cents: 45000 }
              as: CaseManager
              captures: { jud_id: $.data.id }
            - call: "POST /county-filings"
              payload: { judgment_id: "${jud_id}", county_code: "CA-LOS-ANGELES", state_code: "CA", filing_type: "ABSTRACT_OF_JUDGMENT", fee_cents: 0 }
              as: CaseManager
              captures: { cf_id: $.data.id }
            - call: "POST /county-filings/${cf_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /county-filings/${cf_id}/adjudicate"
              payload: { outcome: "RECORDED", recorded_on: "2026-08-01" }
              as: CaseManager
            - call: "POST /asset-findings"
              payload: { judgment_id: "${jud_id}", asset_type: "BANK_ACCOUNT", institution_name: "First Pacific Bank", identifier_last4: "8811", estimated_value_cents: 2000000, source: "PUBLIC_RECORD" }
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { af_bank_id: $.data.id }
            - call: "POST /asset-findings/${af_bank_id}/verify"
              payload: {}
              as: AssetInvestigator
              as_user_id: "inv-1"
            - call: "POST /asset-findings"
              payload: { judgment_id: "${jud_id}", asset_type: "REAL_PROPERTY", institution_name: "LA County Recorder", identifier_last4: "0042", estimated_value_cents: 2000000, source: "PUBLIC_RECORD" }
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { af_prop_id: $.data.id }
            - call: "GET /debtors/${dbt_id}"
              payload: {}
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { prelim_score: $.data.recoverability_score }
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { jud_v: $.data.version }
            - call: "POST /enforcement-actions"
              payload: { judgment_id: "${jud_id}", asset_finding_id: "${af_bank_id}", action_type: "BANK_LEVY", expected_judgment_version: "${jud_v}" }
              as: CaseManager
              captures: { ea_id: $.data.id }
          trigger:
            - call: "POST /enforcement-actions/${ea_id}/request-writ"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "eo-1"
          assert:
            - "${prelim_score} == 78"
            - "Debtor.${dbt_id}.recoverability_score == 78"
            - "Debtor.${dbt_id}.certified_recoverability_score == 64"
            - "Debtor.${dbt_id}.recoverability_score != Debtor.${dbt_id}.certified_recoverability_score"
            - "AssetFinding.${af_bank_id}.status == VERIFIED"
            - "AssetFinding.${af_prop_id}.status == OPEN"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: garnishment_three_way_min_with_head_of_household_branch
        grounds:
          - calculations.wage_garnishment_withholding
          - entities.Debtor.fields.head_of_household
          - entities.EnforcementAction.fields.weekly_withholding_cents
          - state_machines.EnforcementAction.DRAFT_to_WRIT_REQUESTED
        distinguishing_aspect: |
          Mode (a): four inputs (weekly_disposable_earnings_cents, head_of_household, state_code and the
          live payoff) interact through a nested min/max with a conditional branch — the same FL
          head-of-household debtor at 100000 cents disposable yields 10000 cents on a large judgment
          (the 1000 bps percentage cap binds) and 500 cents on a 500-cent judgment (the payoff cap binds),
          so the binding term of the three-way min switches between the two writs.
        test_recipe:
          setup:
            - "One FL debtor with head_of_household == true and weekly_disposable_earnings_cents == 100000."
            - "Two FL judgments for that debtor: J1 with 5000000 cents principal at 1000 bps entered 2026-01-01 (payoff 5335411 on 2026-08-01) and J2 with 500 cents principal at 0 bps entered 2026-01-01 (payoff 500)."
            - "Each judgment has a zero-fee FL county filing RECORDED (posture LIEN_PERFECTED) and its own VERIFIED EMPLOYMENT finding."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Marco Vela", state_code: "FL", head_of_household: true, weekly_disposable_earnings_cents: 100000 }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-0101", state_code: "FL", original_principal_cents: 5000000, interest_rate_bps: 1000, entered_on: "2026-01-01", filing_costs_cents: 45000 }
              as: CaseManager
              captures: { j1_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-0102", state_code: "FL", original_principal_cents: 500, interest_rate_bps: 0, entered_on: "2026-01-01", filing_costs_cents: 0 }
              as: CaseManager
              captures: { j2_id: $.data.id }
            - call: "POST /county-filings"
              payload: { judgment_id: "${j1_id}", county_code: "FL-DUVAL", state_code: "FL", filing_type: "ABSTRACT_OF_JUDGMENT", fee_cents: 0 }
              as: CaseManager
              captures: { cf1_id: $.data.id }
            - call: "POST /county-filings/${cf1_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /county-filings/${cf1_id}/adjudicate"
              payload: { outcome: "RECORDED", recorded_on: "2026-08-01" }
              as: CaseManager
            - call: "POST /county-filings"
              payload: { judgment_id: "${j2_id}", county_code: "FL-DUVAL", state_code: "FL", filing_type: "ABSTRACT_OF_JUDGMENT", fee_cents: 0 }
              as: CaseManager
              captures: { cf2_id: $.data.id }
            - call: "POST /county-filings/${cf2_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /county-filings/${cf2_id}/adjudicate"
              payload: { outcome: "RECORDED", recorded_on: "2026-08-01" }
              as: CaseManager
            - call: "POST /asset-findings"
              payload: { judgment_id: "${j1_id}", asset_type: "EMPLOYMENT", institution_name: "Atlantic Freight Co", identifier_last4: "7712", estimated_value_cents: 0, source: "PUBLIC_RECORD", weekly_disposable_earnings_cents: 100000 }
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { af1_id: $.data.id }
            - call: "POST /asset-findings/${af1_id}/verify"
              payload: {}
              as: AssetInvestigator
              as_user_id: "inv-1"
            - call: "POST /asset-findings"
              payload: { judgment_id: "${j2_id}", asset_type: "EMPLOYMENT", institution_name: "Atlantic Freight Co", identifier_last4: "7712", estimated_value_cents: 0, source: "PUBLIC_RECORD", weekly_disposable_earnings_cents: 100000 }
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { af2_id: $.data.id }
            - call: "POST /asset-findings/${af2_id}/verify"
              payload: {}
              as: AssetInvestigator
              as_user_id: "inv-1"
            - call: "GET /judgments/${j1_id}"
              payload: {}
              as: CaseManager
              captures: { j1_v: $.data.version }
            - call: "POST /enforcement-actions"
              payload: { judgment_id: "${j1_id}", asset_finding_id: "${af1_id}", action_type: "WAGE_GARNISHMENT", expected_judgment_version: "${j1_v}" }
              as: CaseManager
              captures: { ea1_id: $.data.id }
            - call: "GET /judgments/${j2_id}"
              payload: {}
              as: CaseManager
              captures: { j2_v: $.data.version }
            - call: "POST /enforcement-actions"
              payload: { judgment_id: "${j2_id}", asset_finding_id: "${af2_id}", action_type: "WAGE_GARNISHMENT", expected_judgment_version: "${j2_v}" }
              as: CaseManager
              captures: { ea2_id: $.data.id }
          trigger:
            - call: "POST /enforcement-actions/${ea1_id}/request-writ"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { w1: $.data.weekly_withholding_cents }
            - call: "POST /enforcement-actions/${ea2_id}/request-writ"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "eo-1"
              captures: { w2: $.data.weekly_withholding_cents }
          assert:
            - "${w1} == 10000"
            - "${w2} == 500"
            - "EnforcementAction.${ea1_id}.weekly_withholding_cents == 10000"
            - "EnforcementAction.${ea2_id}.weekly_withholding_cents == 500"
            - "EnforcementAction.${ea1_id}.status == WRIT_REQUESTED"
            - "EnforcementAction.${ea2_id}.status == WRIT_REQUESTED"

      - name: contingency_fee_rounded_per_payment_then_summed
        grounds:
          - calculations.settlement_net_recovery
          - entities.Payment.fields.contingency_fee_cents
          - entities.Judgment.fields.contingency_fee_cents
          - entities.Judgment.fields.net_to_creditor_cents
        distinguishing_aspect: |
          Mode (b): the rounding ORDER decides the answer. Two payments of 1000050 and 500050 cents at the
          3300 bps tier round to 330017 and 165017 individually and sum to 495034, whereas rounding the
          1500100-cent aggregate once gives 495033 — a one-cent gap that only the pinned per-payment order
          produces.
        test_recipe:
          setup:
            - "One CA judgment with 5000000 cents principal, 0 bps interest and 0 filing costs, so the payoff never moves with time."
            - "Two APPLIED payments received the same day, 1000050 cents then 500050 cents, gross 1500100 cents which lands in the 3300 bps tier."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA" }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-0201", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 0, entered_on: "2026-01-01", filing_costs_cents: 0 }
              as: CaseManager
              captures: { jud_id: $.data.id }
          trigger:
            - call: "POST /payments"
              payload: { judgment_id: "${jud_id}", amount_cents: 1000050, received_on: "2026-08-01", source: "DEBTOR_DIRECT" }
              as: CaseManager
              captures: { p1_id: $.data.id }
            - call: "POST /payments"
              payload: { judgment_id: "${jud_id}", amount_cents: 500050, received_on: "2026-08-01", source: "DEBTOR_DIRECT" }
              as: CaseManager
              captures: { p2_id: $.data.id, p2_fee: $.data.contingency_fee_cents }
          assert:
            - "Payment.${p1_id}.contingency_fee_cents == 330017"
            - "${p2_fee} == 165017"
            - "Judgment.${jud_id}.collected_to_date_cents == 1500100"
            - "Judgment.${jud_id}.contingency_fee_cents == 495034"
            - "Judgment.${jud_id}.contingency_fee_cents != 495033"
            - "Judgment.${jud_id}.net_to_creditor_cents == 1005066"

      - name: contingency_tier_keyed_on_gross_before_cost_reimbursement
        grounds:
          - calculations.settlement_net_recovery
          - entities.Judgment.fields.filing_costs_cents
          - entities.Judgment.fields.net_to_creditor_cents
        distinguishing_aspect: |
          Mode (c): the dependency only looks circular (tier -> fee -> net -> tier). With gross 5000000 and
          45000 cents of advanced filing costs, the pinned order keys the tier on the gross (2500 bps,
          fee 1250000, net 3705000); keying it on gross-minus-costs (4955000) would pick 3300 bps and
          produce fee 1650000 and net 3305000 instead.
        test_recipe:
          setup:
            - "One CA judgment with 6000000 cents principal, 0 bps interest and 45000 cents of taxed filing costs (payoff 6045000)."
            - "Exactly one APPLIED payment of 5000000 cents, so gross_collected_cents is exactly the 5000000-cent tier breakpoint while gross-minus-costs is 4955000."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA" }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-0202", state_code: "CA", original_principal_cents: 6000000, interest_rate_bps: 0, entered_on: "2026-01-01", filing_costs_cents: 45000 }
              as: CaseManager
              captures: { jud_id: $.data.id }
          trigger:
            - call: "POST /payments"
              payload: { judgment_id: "${jud_id}", amount_cents: 5000000, received_on: "2026-08-01", source: "SETTLEMENT" }
              as: CaseManager
              captures: { p1_id: $.data.id, p1_fee: $.data.contingency_fee_cents }
          assert:
            - "${p1_fee} == 1250000"
            - "Judgment.${jud_id}.contingency_fee_cents == 1250000"
            - "Judgment.${jud_id}.contingency_fee_cents != 1650000"
            - "Judgment.${jud_id}.net_to_creditor_cents == 3705000"
            - "Judgment.${jud_id}.net_to_creditor_cents != 3305000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: judgment_posture_cycles_while_status_stays_active
        grounds:
          - state_machines.Judgment.enforcement_posture.NONE_to_LIEN_PERFECTED
          - state_machines.Judgment.enforcement_posture.ENFORCING_to_STAYED
          - state_machines.Judgment.enforcement_posture.STAYED_to_ENFORCING
          - entities.Judgment.fields.status
          - entities.Judgment.fields.enforcement_posture
        distinguishing_aspect: |
          Non-linearity on the Judgment entity: two independent state dimensions on one row, with the
          enforcement_posture axis traversing the cycle ENFORCING -> STAYED -> ENFORCING while the status
          axis never leaves ACTIVE.
        test_recipe:
          setup:
            - "A CA judgment whose posture has been walked NONE -> LIEN_PERFECTED (county filing recorded) -> ENFORCING (bank levy served)."
            - "An accepted INSTALLMENT settlement offer creating an ACTIVE agreement, which stays the judgment."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA", weekly_disposable_earnings_cents: 100000 }
              as: CaseManager
              captures: { dbt_id: $.data.id }
            - call: "POST /judgments"
              payload: { creditor_id: "${cred_id}", debtor_id: "${dbt_id}", court_case_number: "CV-2026-0301", state_code: "CA", original_principal_cents: 5000000, interest_rate_bps: 1000, entered_on: "2026-01-01", filing_costs_cents: 45000 }
              as: CaseManager
              captures: { jud_id: $.data.id }
            - call: "POST /county-filings"
              payload: { judgment_id: "${jud_id}", county_code: "CA-LOS-ANGELES", state_code: "CA", filing_type: "ABSTRACT_OF_JUDGMENT", fee_cents: 0 }
              as: CaseManager
              captures: { cf_id: $.data.id }
            - call: "POST /county-filings/${cf_id}/submit"
              payload: {}
              as: CaseManager
            - call: "POST /county-filings/${cf_id}/adjudicate"
              payload: { outcome: "RECORDED", recorded_on: "2026-08-01" }
              as: CaseManager
              captures: { cf_rank: $.data.priority_rank }
            - call: "POST /asset-findings"
              payload: { judgment_id: "${jud_id}", asset_type: "BANK_ACCOUNT", institution_name: "First Pacific Bank", identifier_last4: "8811", estimated_value_cents: 900000, source: "PUBLIC_RECORD" }
              as: AssetInvestigator
              as_user_id: "inv-1"
              captures: { af_id: $.data.id }
            - call: "POST /asset-findings/${af_id}/verify"
              payload: {}
              as: AssetInvestigator
              as_user_id: "inv-1"
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { jv1: $.data.version }
            - call: "POST /enforcement-actions"
              payload: { judgment_id: "${jud_id}", asset_finding_id: "${af_id}", action_type: "BANK_LEVY", expected_judgment_version: "${jv1}" }
              as: CaseManager
              captures: { ea_id: $.data.id }
            - call: "POST /enforcement-actions/${ea_id}/request-writ"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "eo-1"
            - call: "POST /enforcement-actions/${ea_id}/serve"
              payload: { served_on: "2026-08-01" }
              as: EnforcementOfficer
              as_user_id: "eo-1"
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { jv2: $.data.version, posture_after_serve: $.data.enforcement_posture, status_after_serve: $.data.status }
            - call: "POST /settlement-offers"
              payload: { judgment_id: "${jud_id}", offered_by: "CREDITOR", kind: "INSTALLMENT", amount_cents: 3600000, installment_count: 12, application_order_concession: "PRINCIPAL_FIRST", expires_at: "2026-12-01T00:00:00Z", expected_judgment_version: "${jv2}" }
              as: CaseManager
              captures: { off_id: $.data.id }
            - call: "POST /settlement-offers/${off_id}/accept"
              payload: {}
              as: Debtor
              as_user_id: "${dbt_id}"
            - call: "GET /installment-agreements"
              payload: { settlement_offer_id: "${off_id}" }
              as: CaseManager
              captures: { agr_id: "$.data[0].id" }
          trigger:
            - call: "POST /installment-agreements/${agr_id}/record-miss"
              payload: {}
              as: CaseManager
            - call: "POST /installment-agreements/${agr_id}/record-miss"
              payload: {}
