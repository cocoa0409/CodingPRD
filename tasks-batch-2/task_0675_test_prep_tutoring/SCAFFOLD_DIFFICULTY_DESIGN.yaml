            - call: "POST /cohorts/${cohort_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
              captures: { cohort_v1: $.data.version }
            - call: "POST /students/register"
              payload: { email: "s5@x.com", full_name: "Stu Five" }
              as: Anonymous
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}", expected_cohort_version: "${cohort_v1}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /installment-plans"
              payload: { enrollment_id: "${enr_id}", num_installments: 1 }
              as: Registrar
              captures: { plan_id: $.data.id }
            - call: "POST /installment-plans/${plan_id}/payments"
              payload: { amount_cents: 100000 }
              as: Registrar
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /practice-attempts"
              payload: { enrollment_id: "${enr_id}", attempt_type: "DIAGNOSTIC", raw_correct: 50, total_items: 80 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { diag_id: $.data.id }
            - call: "POST /practice-attempts/${diag_id}/score"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /practice-attempts"
              payload: { enrollment_id: "${enr_id}", attempt_type: "PRACTICE", raw_correct: 550, total_items: 800 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /practice-attempts/${p1_id}/score"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: Registrar
            - call: "POST /cohorts/${cohort_id}/start"
              payload: {}
              as: Registrar
            - call: "POST /cohorts/${cohort_id}/conclude"
              payload: {}
              as: Registrar
            - call: "POST /guarantee-claims"
              payload: { enrollment_id: "${enr_id}", resolution: "RETAKE" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /guarantee-claims/${claim_id}/review"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /guarantee-claims/${claim_id}/approve"
              payload: {}
              as: Registrar
          assert:
            - "GuaranteeClaim.${claim_id}.status == APPROVED"
            - "GuaranteeClaim.${claim_id}.refund_amount_cents == 0"
            - "Enrollment.${enr_id}.guarantee_status == RETAKE_GRANTED"

