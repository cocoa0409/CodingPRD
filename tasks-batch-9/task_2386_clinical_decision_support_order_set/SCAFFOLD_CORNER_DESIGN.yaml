            - "call 2 returns HTTP 409 with error_id ERR_VENDOR_RELEASE_NOT_ANALYZED"
            - "call 3 returns HTTP 409 with error_id ERR_VENDOR_RELEASE_NOT_ANALYZED and VendorRuleDelta.${d1_id}.disposition is still null"
            - "call 4 returns HTTP 200 with impact_score == 3 and review_cycle_state == IMPACT_ANALYZED_FAST_TRACK"
            - "call 5 returns HTTP 409 with error_id ERR_VENDOR_RELEASE_NOT_RECEIVED and the release keeps impact_score 3 and version unchanged from call 4"

