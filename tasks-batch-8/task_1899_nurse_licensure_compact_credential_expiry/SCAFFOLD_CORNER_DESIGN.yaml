            - "CredentialPacket.${pkt_id}.readiness_score == 1.0 ((40+20+15+5)/80, all credits 1.0)"
            - "CredentialPacket.${pkt_id}.status == 'APPROVED' and reviewed_by_user_id == 'spec-2'"

  # ===========================================================================
  - section: validations
    instances:
      - name: invalid_role_header_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "An X-User-Role value outside the declared role set is an authentication failure (400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER), not an authorization failure."
        test_recipe:
          setup: ["Empty database, clock default."]
          setup_api_calls: []
          trigger:
            - { call: "POST /credentialing/nurses", payload: { full_name: "Role X", email: "role.x@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: "MysteryRole", captures: { err: "$.data.error_id" } }
          assert:
            - "Response 400 with error_id == 'ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER'"
            - "GET /credentialing/nurses returns total_count == 0"

      - name: body_fk_nurse_not_found_returns_404
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_NURSE_NOT_FOUND]"
        distinguishing_aspect: "A body FK (nurse_id) that does not exist yields the domain-specific 404 ERR_NURSE_NOT_FOUND at priority 4, distinct from path-id ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database, clock default."]
          setup_api_calls: []
          trigger:
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "11111111-2222-4333-8444-555555555555", state_code: "AZ", license_number: "RN-AZ-XX1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { err: "$.data.error_id" } }
          assert:
            - "Response 404 with error_id == 'ERR_NURSE_NOT_FOUND'"
            - "GET /credentialing/state-licenses returns total_count == 0"

      - name: ownership_violation_on_item_evidence
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2.5]"
          - "errors[ERR_OWNERSHIP_VIOLATION]"
          - "roles[name=Nurse]"
        distinguishing_aspect: "Entity-backed Nurse identity: nurse A cannot submit evidence into nurse B's packet — the server compares X-User-ID to packet.nurse_id and rejects with 403 ERR_OWNERSHIP_VIOLATION."
        test_recipe:
          setup: ["Clock 2026-08-01; unit MED; travel nurses A and B; B has a DRAFT packet with items materialized."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/units", payload: { name: "MED", required_cert_types: [] }, as: NurseManager, as_user_id: "mgr-1", captures: { unit_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Amy Own", email: "amy.own@x.com", primary_state_of_residence: "AZ", employment_type: "TRAVEL", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_a: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Bob Own", email: "bob.own@x.com", primary_state_of_residence: "AZ", employment_type: "TRAVEL", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_b: "$.data.id" } }
            - { call: "POST /credentialing/credential-packets", payload: { nurse_id: "${n_b}", target_unit_id: "${unit_id}" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { pkt_b: "$.data.id" } }
            - { call: "GET /credentialing/packet-items?packet_id=${pkt_b}", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { item_att: "$.data[3].id" } }
          trigger:
            - { call: "POST /credentialing/packet-items/${item_att}/submit-evidence", payload: { evidence_ref: "forged" }, as: Nurse, as_user_id: "${n_a}", captures: { err: "$.data.error_id" } }
          assert:
            - "Response 403 with error_id == 'ERR_OWNERSHIP_VIOLATION' (item belongs to ${n_b}'s packet, caller is ${n_a})"
            - "PacketItem.${item_att}.status remains 'MISSING'"

      - name: multistate_flag_non_compact_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_MULTISTATE_NON_COMPACT_STATE]"
          - "entities.StateLicense.fields.multistate_flag"
        distinguishing_aspect: "Conditional validation: multistate_flag=true is only legal when state_code is in COMPACT_STATES; CA (non-compact) is rejected 422 while the same payload with TX is accepted."
        test_recipe:
          setup: ["Clock 2026-08-01; nurse exists."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Cal Ifornia", email: "cal.ifornia@x.com", primary_state_of_residence: "CA", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
          trigger:
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "CA", license_number: "RN-CA-CN1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "TX", license_number: "RN-TX-CN2", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_tx: "$.data.id" } }
          assert:
            - "First create fails 422 with error_id == 'ERR_MULTISTATE_NON_COMPACT_STATE'"
            - "Second create (compact state TX) succeeds 201 with status 'DRAFT'"

      - name: license_renewal_window_boundary
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_RENEWAL_WINDOW_NOT_OPEN]"
          - "state_machines.StateLicense.EXPIRED_to_ACTIVE"
        distinguishing_aspect: "ACTIVE-license renewal opens exactly at (expires_on - current_date).days == 60: at 61 days the renew fails ERR_RENEWAL_WINDOW_NOT_OPEN; at exactly 60 it succeeds."
        test_recipe:
          setup:
            - "Clock 2026-07-01 at setup; nurse's license (expires 2026-09-30) is ACTIVE after PSV VERIFIED at 2026-07-01 (valid_through 2026-12-28)."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Ren Window", email: "ren.window@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-06-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-RW1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-01", expires_on: "2026-09-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
          trigger:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-07-31T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/renew", payload: { new_expires_on: "2027-09-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/renew", payload: { new_expires_on: "2027-09-30" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
          assert:
            - "At 2026-07-31 (61 days before expiry): renew fails 422 error_id == 'ERR_RENEWAL_WINDOW_NOT_OPEN'; license stays ACTIVE with expires_on 2026-09-30"
            - "At 2026-08-01 (exactly 60 days, inclusive): renew succeeds 200; StateLicense.${lic_id}.expires_on == '2027-09-30', status 'ACTIVE'"

      - name: shift_horizon_and_past_boundaries
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_SCHEDULING_HORIZON_EXCEEDED]"
          - "errors[ERR_SHIFT_IN_PAST]"
        distinguishing_aspect: "Date-granular temporal window: start_date == current_date + 90 is allowed (inclusive), +91 is rejected ERR_SCHEDULING_HORIZON_EXCEEDED; start_date < current_date is rejected ERR_SHIFT_IN_PAST."
        test_recipe:
          setup: ["Clock 2026-08-01; mandatory requirement; unit MED; ACTIVE/CLEAR nurse."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "ANNUAL_SKILLS", name: "Annual Skills", validity_months: 12, window_mode: "ROLLING", mandatory: true, applies_to: ["STAFF", "TRAVEL", "PER_DIEM"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_id: "$.data.id" } }
            - { call: "POST /credentialing/units", payload: { name: "MED", required_cert_types: [] }, as: NurseManager, as_user_id: "mgr-1", captures: { unit_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Hor Izon", email: "hor.izon@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-HZ1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "BLS", issuing_body: "AHA", obtained_on: "2026-05-01", expires_on: "2027-03-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/competency-completions", payload: { nurse_id: "${n_id}", requirement_id: "${req_id}", completed_on: "2026-07-15" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/nurses/${n_id}/activate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
          trigger:
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-10-30T07:00:00Z", ends_at: "2026-10-30T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { sh_ok: "$.data.id" } }
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-10-31T07:00:00Z", ends_at: "2026-10-31T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { err_horizon: "$.data.error_id" } }
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-09T07:00:00Z", ends_at: "2026-08-09T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { err_past: "$.data.error_id" } }
          assert:
            - "Shift starting 2026-10-30 (current_date + 90 exactly) succeeds 201"
            - "Shift starting 2026-10-31 fails 422 error_id == 'ERR_SCHEDULING_HORIZON_EXCEEDED'"
            - "At clock 2026-08-10, shift starting 2026-08-09 fails 422 error_id == 'ERR_SHIFT_IN_PAST'"
            - "Exactly 1 ShiftAssignment exists for ${n_id}"

      - name: discipline_effective_future_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_DISCIPLINE_EFFECTIVE_FUTURE]"
        distinguishing_aspect: "A disciplinary action cannot be reported with effective_on in the future (422); effective_on == current_date is accepted."
        test_recipe:
          setup: ["Clock 2026-08-01; ACTIVE nurse (license attested)."]
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Eff Future", email: "eff.future@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-EF1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/nurses/${n_id}/activate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
          trigger:
            - { call: "POST /credentialing/disciplinary-actions", payload: { nurse_id: "${n_id}", scope: "PRIVILEGE", action_type: "REPRIMAND", effective_on: "2026-08-02" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /credentialing/disciplinary-actions", payload: { nurse_id: "${n_id}", scope: "PRIVILEGE", action_type: "REPRIMAND", effective_on: "2026-08-01" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { da_ok: "$.data.id" } }
          assert:
            - "effective_on 2026-08-02 (> current_date) fails 422 error_id == 'ERR_DISCIPLINE_EFFECTIVE_FUTURE'"
            - "effective_on 2026-08-01 (== current_date) succeeds 201 with status 'REPORTED'"

      - name: resolve_premature_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_RESOLUTION_PREMATURE]"
          - "state_machines.DisciplinaryAction.ADJUDICATED_to_RESOLVED"
        distinguishing_aspect: "SUSPENSION resolve at 29 days after effective_on fails ERR_RESOLUTION_PREMATURE; the minimum active period (30 days, inclusive) is not yet met."
        test_recipe:
          setup: ["Clock 2026-08-01; ACTIVE nurse; LICENSE-scope SUSPENSION (effective 2026-08-01) adjudicated SUSTAINED; clock moves to 2026-08-30 (29 days)."]
          setup_api_calls:
