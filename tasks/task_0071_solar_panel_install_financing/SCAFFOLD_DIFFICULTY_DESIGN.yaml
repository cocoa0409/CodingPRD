scaffold_difficulty_design:
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: itc_attribution_homeowner_vs_financier
        grounds:
          - calculations.itc_credit
          - entities.FinancingPlan.fields.itc_beneficiary
          - state_machines.FinancingPlan.DRAFT_to_ACTIVE
          - entities.Project.fields.itc_credit_cents
        distinguishing_aspect: |
          Same Project + same gross_system_cost_cents produces the SAME itc_credit_cents value,
          but the itc_beneficiary diverges by entity domain: a LOAN plan books the credit to the
          HOMEOWNER while a PPA plan books it to the FINANCIER — two different beneficiaries from
          identical cost inputs, decided on the FinancingPlan entity, not the Project's cost.
        test_recipe:
          setup:
            - "Two homeowners in CA, each with a DESIGNED project of gross_system_cost_cents=3000000 (itc_credit_cents=900000)."
            - "Project P1 has a LOAN plan; Project P2 has a PPA plan; both plans activated."
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "h1@x.com", full_name: "H One", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h1: $.data.id }
            - call: "POST /solar/homeowners"
              payload: { email: "h2@x.com", full_name: "H Two", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h2: $.data.id }
            - call: "POST /solar/installers"
              payload: { company_name: "SunCo", licensed_states: ["CA"] }
              as: Anonymous
              captures: { inst: $.data.id }
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h1}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /solar/projects/${p1}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p1}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { p1_v: $.data.version }
            - call: "POST /solar/financing-plans"
              payload: { project_id: "${p1}", model: "LOAN", term_years: 10, loan_principal_cents: 2500000, loan_apr: 0.06 }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { fp1: $.data.id }
            - call: "POST /solar/financing-plans/${fp1}/activate"
              payload: { expected_project_version: "${p1_v}" }
              as: Homeowner
              as_user_id: "${h1}"
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h2}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h2}"
              captures: { p2: $.data.id }
            - call: "POST /solar/projects/${p2}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p2}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { p2_v: $.data.version }
            - call: "POST /solar/financing-plans"
              payload: { project_id: "${p2}", model: "PPA", term_years: 20, ppa_rate_cents_per_kwh: 12.5, ppa_escalator_pct: 0.029 }
              as: Homeowner
              as_user_id: "${h2}"
              captures: { fp2: $.data.id }
          trigger:
            - call: "POST /solar/financing-plans/${fp2}/activate"
              payload: { expected_project_version: "${p2_v}" }
              as: Homeowner
              as_user_id: "${h2}"
          assert:
            - "FinancingPlan.${fp1}.itc_beneficiary == HOMEOWNER"
            - "FinancingPlan.${fp2}.itc_beneficiary == FINANCIER"
            - "Project.${p1}.itc_credit_cents == 900000"
            - "Project.${p2}.itc_credit_cents == 900000"

      - name: net_metering_full_retail_vs_net_billing
        grounds:
          - calculations.net_metering_settlement
          - entities.Utility.fields.export_credit_ratio
          - entities.NetMeterPeriod.fields.bill_credit_cents
          - state_machines.NetMeterPeriod.OPEN_to_SETTLED
        distinguishing_aspect: |
          For an identical surplus period (net_kwh == +300, rate 15 c/kWh) the bill_credit_cents
          differs by utility: a full-retail utility (export_credit_ratio==1.0) credits 4500 while a
          net-billing utility (export_credit_ratio==0.5) credits 2250 — the divergence lives on the
          NetMeterPeriod entity (a different domain than the ITC dual-variant on Project/Plan).
        test_recipe:
          setup:
            - "Two OPERATIONAL projects, each with its own utility: U1 full retail (ratio 1.0), U2 net billing (ratio 0.5), both rate 15 c/kWh."
            - "Each project has one OPEN period produced=900 consumed=600 (net +300), bank starts at 0."
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "nm1@x.com", full_name: "NM One", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h1: $.data.id }
            - call: "POST /solar/homeowners"
              payload: { email: "nm2@x.com", full_name: "NM Two", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h2: $.data.id }
            - call: "POST /solar/installers"
              payload: { company_name: "SunCo", licensed_states: ["CA"] }
              as: Anonymous
              captures: { inst: $.data.id }
            - call: "POST /solar/utilities"
              payload: { name: "FullRetail U", state_code: "CA", feeder_headroom_kw: 1000, net_metering_rate_cents_per_kwh: 15.0, export_credit_ratio: 1.0 }
              as: PlatformAdmin
              captures: { u1: $.data.id }
            - call: "POST /solar/utilities"
              payload: { name: "NetBill U", state_code: "CA", feeder_headroom_kw: 1000, net_metering_rate_cents_per_kwh: 15.0, export_credit_ratio: 0.5 }
              as: PlatformAdmin
              captures: { u2: $.data.id }
            # --- Project 1 to OPERATIONAL on U1 ---
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h1}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /solar/projects/${p1}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p1}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { p1_v: $.data.version }
            - call: "POST /solar/financing-plans"
              payload: { project_id: "${p1}", model: "LEASE", term_years: 20, lease_monthly_cents: 8500 }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { fp1: $.data.id }
            - call: "POST /solar/financing-plans/${fp1}/activate"
              payload: { expected_project_version: "${p1_v}" }
              as: Homeowner
              as_user_id: "${h1}"
            - call: "POST /solar/projects/${p1}/submit-permit"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p1}/approve-permit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /solar/projects/${p1}/complete-install"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/interconnection-applications"
              payload: { project_id: "${p1}", utility_id: "${u1}", requested_export_kw: 7.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { ia1: $.data.id }
            - call: "POST /solar/interconnection-applications/${ia1}/begin-review"
              payload: {}
              as: Utility
              as_user_id: "${u1}"
            - call: "POST /solar/interconnection-applications/${ia1}/approve"
              payload: {}
              as: Utility
              as_user_id: "${u1}"
            - call: "POST /solar/projects/${p1}/inspect"
              payload: { result: "PASS" }
              as: PlatformAdmin
            - call: "POST /solar/interconnection-applications/${ia1}/grant-pto"
              payload: {}
              as: Utility
              as_user_id: "${u1}"
            - call: "POST /solar/net-meter-periods"
              payload: { project_id: "${p1}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-02-01T00:00:00.000Z", kwh_produced: 900, kwh_consumed: 600 }
              as: Utility
              as_user_id: "${u1}"
              captures: { nm1: $.data.id }
            # --- Project 2 to OPERATIONAL on U2 ---
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h2}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h2}"
              captures: { p2: $.data.id }
            - call: "POST /solar/projects/${p2}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p2}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { p2_v: $.data.version }
            - call: "POST /solar/financing-plans"
              payload: { project_id: "${p2}", model: "LEASE", term_years: 20, lease_monthly_cents: 8500 }
              as: Homeowner
              as_user_id: "${h2}"
              captures: { fp2: $.data.id }
            - call: "POST /solar/financing-plans/${fp2}/activate"
              payload: { expected_project_version: "${p2_v}" }
              as: Homeowner
              as_user_id: "${h2}"
            - call: "POST /solar/projects/${p2}/submit-permit"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p2}/approve-permit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /solar/projects/${p2}/complete-install"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/interconnection-applications"
              payload: { project_id: "${p2}", utility_id: "${u2}", requested_export_kw: 7.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { ia2: $.data.id }
            - call: "POST /solar/interconnection-applications/${ia2}/begin-review"
              payload: {}
              as: Utility
              as_user_id: "${u2}"
            - call: "POST /solar/interconnection-applications/${ia2}/approve"
              payload: {}
              as: Utility
              as_user_id: "${u2}"
            - call: "POST /solar/projects/${p2}/inspect"
              payload: { result: "PASS" }
              as: PlatformAdmin
            - call: "POST /solar/interconnection-applications/${ia2}/grant-pto"
              payload: {}
              as: Utility
              as_user_id: "${u2}"
            - call: "POST /solar/net-meter-periods"
              payload: { project_id: "${p2}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-02-01T00:00:00.000Z", kwh_produced: 900, kwh_consumed: 600 }
              as: Utility
              as_user_id: "${u2}"
              captures: { nm2: $.data.id }
          trigger:
            - call: "POST /solar/net-meter-periods/${nm1}/settle"
              payload: {}
              as: Utility
              as_user_id: "${u1}"
            - call: "POST /solar/net-meter-periods/${nm2}/settle"
              payload: {}
              as: Utility
              as_user_id: "${u2}"
          assert:
            - "NetMeterPeriod.${nm1}.net_kwh == 300"
            - "NetMeterPeriod.${nm2}.net_kwh == 300"
            - "NetMeterPeriod.${nm1}.bill_credit_cents == 4500"
            - "NetMeterPeriod.${nm2}.bill_credit_cents == 2250"

  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: loan_amortization_three_input_nonlinear
        grounds:
          - calculations.financing_monthly_payment
          - entities.FinancingPlan.fields.monthly_payment_cents
          - state_machines.FinancingPlan.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Mode (a): the LOAN monthly payment is a non-linear annuity over three inputs
          (loan_principal_cents, loan_apr, term_years) — factor = r(1+r)^n / ((1+r)^n - 1) —
          where principal 2500000, apr 0.06, term 10 yields exactly 27755 cents, not a linear
          principal/n division (which would give 20833).
        test_recipe:
          setup:
            - "A DESIGNED project; a DRAFT LOAN plan principal=2500000 apr=0.06 term_years=10."
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "lo@x.com", full_name: "Lo An", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /solar/installers"
              payload: { company_name: "SunCo", licensed_states: ["CA"] }
              as: Anonymous
              captures: { inst: $.data.id }
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { p: $.data.id }
            - call: "POST /solar/projects/${p}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { p_v: $.data.version }
            - call: "POST /solar/financing-plans"
              payload: { project_id: "${p}", model: "LOAN", term_years: 10, loan_principal_cents: 2500000, loan_apr: 0.06 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { fp: $.data.id }
          trigger:
            - call: "POST /solar/financing-plans/${fp}/activate"
              payload: { expected_project_version: "${p_v}" }
              as: Homeowner
              as_user_id: "${h}"
          assert:
            - "FinancingPlan.${fp}.monthly_payment_cents == 27755"

      - name: srec_sale_fee_sum_then_round
        grounds:
          - calculations.srec_sale_settlement
          - entities.SrecSale.fields.net_proceeds_cents
          - entities.SrecSale.fields.gross_proceeds_cents
          - concurrency_rules[srec-sale-stale-project]
        distinguishing_aspect: |
          Mode (b): the broker fee is computed once on the gross total then subtracted
          (sum-then-round). With 5 LISTED SRECs at price 32099 and fee 0.035, the pinned order gives
          fee 5617 / net 154878; the rejected per-SREC-then-sum order gives fee 5615 — a 2-cent
          divergence that pins the rounding order.
        test_recipe:
          setup:
            - "An OPERATIONAL project (CA) with a broker operating CA at fee 0.035."
            - "5 SRECs vintage 2026 minted and LISTED for the project."
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "sr@x.com", full_name: "Sr Ec", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /solar/installers"
              payload: { company_name: "SunCo", licensed_states: ["CA"] }
              as: Anonymous
              captures: { inst: $.data.id }
            - call: "POST /solar/utilities"
              payload: { name: "U CA", state_code: "CA", feeder_headroom_kw: 1000, net_metering_rate_cents_per_kwh: 15.0 }
              as: PlatformAdmin
              captures: { u: $.data.id }
            - call: "POST /solar/brokers"
              payload: { firm_name: "GreenBroker", broker_fee_pct: 0.035, operating_states: ["CA"] }
              as: Anonymous
              captures: { br: $.data.id }
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { p: $.data.id }
            - call: "POST /solar/projects/${p}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { p_v: $.data.version }
            - call: "POST /solar/financing-plans"
              payload: { project_id: "${p}", model: "LOAN", term_years: 10, loan_principal_cents: 2500000, loan_apr: 0.06 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { fp: $.data.id }
            - call: "POST /solar/financing-plans/${fp}/activate"
              payload: { expected_project_version: "${p_v}" }
              as: Homeowner
              as_user_id: "${h}"
            - call: "POST /solar/projects/${p}/submit-permit"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p}/approve-permit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /solar/projects/${p}/complete-install"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/interconnection-applications"
              payload: { project_id: "${p}", utility_id: "${u}", requested_export_kw: 7.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { ia: $.data.id }
            - call: "POST /solar/interconnection-applications/${ia}/begin-review"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/interconnection-applications/${ia}/approve"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/projects/${p}/inspect"
              payload: { result: "PASS" }
              as: PlatformAdmin
            - call: "POST /solar/interconnection-applications/${ia}/grant-pto"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/srecs"
              payload: { project_id: "${p}", vintage_year: 2026 }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /solar/srecs"
              payload: { project_id: "${p}", vintage_year: 2026 }
              as: PlatformAdmin
              captures: { s2: $.data.id }
            - call: "POST /solar/srecs"
              payload: { project_id: "${p}", vintage_year: 2026 }
              as: PlatformAdmin
              captures: { s3: $.data.id }
            - call: "POST /solar/srecs"
              payload: { project_id: "${p}", vintage_year: 2026 }
              as: PlatformAdmin
              captures: { s4: $.data.id }
            - call: "POST /solar/srecs"
              payload: { project_id: "${p}", vintage_year: 2026 }
              as: PlatformAdmin
              captures: { s5: $.data.id }
            - call: "POST /solar/srecs/${s1}/list"
              payload: {}
              as: Homeowner
              as_user_id: "${h}"
            - call: "POST /solar/srecs/${s2}/list"
              payload: {}
              as: Homeowner
              as_user_id: "${h}"
            - call: "POST /solar/srecs/${s3}/list"
              payload: {}
              as: Homeowner
              as_user_id: "${h}"
            - call: "POST /solar/srecs/${s4}/list"
              payload: {}
              as: Homeowner
              as_user_id: "${h}"
            - call: "POST /solar/srecs/${s5}/list"
              payload: {}
              as: Homeowner
              as_user_id: "${h}"
            - call: "GET /solar/projects/${p}"
              payload: {}
              as: Homeowner
              as_user_id: "${h}"
              captures: { p_v2: $.data.version }
          trigger:
            - call: "POST /solar/srec-sales"
              payload: { project_id: "${p}", broker_id: "${br}", vintage_year: 2026, price_cents_per_srec: 32099, expected_project_version: "${p_v2}" }
              as: SrecBroker
              as_user_id: "${br}"
              captures: { sale: $.data.id }
          assert:
            - "SrecSale.${sale}.srec_count == 5"
            - "SrecSale.${sale}.gross_proceeds_cents == 160495"
            - "SrecSale.${sale}.net_proceeds_cents == 154878"

  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: project_failed_inspection_remediation_cycle
        grounds:
          - state_machines.Project.INSTALLED_to_FAILED_INSPECTION
          - state_machines.Project.FAILED_INSPECTION_to_REMEDIATION
          - state_machines.Project.REMEDIATION_to_INSTALLED
        distinguishing_aspect: |
          Project is cyclic: INSTALLED -> FAILED_INSPECTION -> REMEDIATION -> INSTALLED re-enters
          the inspection branch (a revision loop on the Project entity), not a forward-only pipeline.
        test_recipe:
          setup:
            - "A project at INSTALLED that fails inspection, enters remediation, and returns to INSTALLED."
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "cy@x.com", full_name: "Cy Cle", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /solar/installers"
              payload: { company_name: "SunCo", licensed_states: ["CA"] }
              as: Anonymous
              captures: { inst: $.data.id }
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { p: $.data.id }
            - call: "POST /solar/projects/${p}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { p_v: $.data.version }
            - call: "POST /solar/financing-plans"
              payload: { project_id: "${p}", model: "LEASE", term_years: 20, lease_monthly_cents: 8500 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { fp: $.data.id }
            - call: "POST /solar/financing-plans/${fp}/activate"
              payload: { expected_project_version: "${p_v}" }
              as: Homeowner
              as_user_id: "${h}"
            - call: "POST /solar/projects/${p}/submit-permit"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p}/approve-permit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /solar/projects/${p}/complete-install"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p}/inspect"
              payload: { result: "FAIL" }
              as: PlatformAdmin
            - call: "POST /solar/projects/${p}/start-remediation"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
          trigger:
            - call: "POST /solar/projects/${p}/complete-install"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { st: $.data.status }
          assert:
            - "Project.${p}.status == INSTALLED"

      - name: warranty_claim_info_requested_resubmit_cycle
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_INFO_REQUESTED
          - state_machines.WarrantyClaim.INFO_REQUESTED_to_SUBMITTED
        distinguishing_aspect: |
