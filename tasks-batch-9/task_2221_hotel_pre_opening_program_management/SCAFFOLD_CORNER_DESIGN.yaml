        excluded_because:
          difficulty_instance: permit_deficiency_resubmission_cycle_returns_to_submitted
          rationale: "The DRAFT -> SUBMITTED -> DEFICIENT -> SUBMITTED -> ISSUED loop, the resubmission_count increment and the BLOCKED -> IN_PROGRESS unwind of the gating milestone are already exercised end-to-end by the identically named §1.8 non_linear_state_machine instance; duplicating it here would add no new claim."
        grounds:
          - "§1.2 PermitApplication declares DEFICIENT -> SUBMITTED as a resubmission cycle that increments resubmission_count, clears deficiency_reason and returns the gating Milestone from BLOCKED to IN_PROGRESS."

      - name: the_two_program_state_dimensions_change_without_disturbing_each_other
        claim_type: parallel
        excluded_because:
          difficulty_instance: program_schedule_and_commercial_dimensions_advance_independently
          rationale: "§1.0 declares state_machine_shape parallel because PreOpeningProgram carries two independent dimensions; the §1.8 non_linear_state_machine instance of the same name already drives schedule_state and commercial_state apart and asserts the combined state, so the corner is covered."
        grounds:
          - "§1.2 declares two state machines over PreOpeningProgram — schedule_state (PLANNING..STABILIZED) and commercial_state (BOOKING_CLOSED..SELLING_STABILIZED) — whose triggers are disjoint."

      - name: onboarding_side_effects_reach_the_plan_row_and_the_program_row
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: hire_onboarding_bubbles_plan_readiness_into_program_score
          rationale: "The three-link bubble-up (hire ONBOARDED -> plan.onboarded_count and readiness_flag READY -> program.departments_ready_count and readiness_score) is asserted link by link in the §1.8 transitive_cascade instance of the same name."
        grounds:
          - "§1.2 Hire ACCEPTED -> ONBOARDED declares CASCADE LINK 1..3 bubbling the child completion up into DepartmentHiringPlan.readiness_flag and then into PreOpeningProgram.departments_ready_count and readiness_score."

      - name: decertification_side_effects_reverse_the_certification_side_effects
        claim_type: side_effect_execution
