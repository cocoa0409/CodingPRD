            - "PlaygroundStandard.${std1_id}.version == 2 (one create + one successful activation; the rejected repeat did not increment)"

      - name: superseded_standard_is_terminal_for_activate_and_supersede
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PlaygroundStandard.terminal_states
          - errors.ERR_STANDARD_NOT_DRAFT
          - errors.ERR_STANDARD_NOT_ACTIVE
        distinguishing_aspect: "Once ASTM_F1487/2024 is SUPERSEDED, neither trigger of its state machine can fire again: activate returns ERR_STANDARD_NOT_DRAFT and supersede (with a fresh DRAFT successor) returns ERR_STANDARD_NOT_ACTIVE, both 409."
        test_recipe:
          setup:
            - "S1 = ASTM_F1487/2024 ACTIVE; S2 = ASTM_F1487/2027 DRAFT with effective_from 2026-01-01 (<= the default clock 2026-08-01T00:00:00Z); S3 = ASTM_F1487/2030 DRAFT, kept as an unused successor candidate."
