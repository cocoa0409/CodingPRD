              as: ClientServiceRep
              captures: { d16_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: MethodologyStatistician
            - call: "POST /processing-runs/${run12_id}/publish"
              payload: {}
              as: MethodologyStatistician
              as_user_id: "stat-publisher-12"
          trigger:
            - call: "POST /client-deliverables/${d17_id}/dispatch"
              payload: {}
              as: ClientServiceRep
              captures: { d17_gross: "$.data.gross_cents", d17_discount: "$.data.discount_cents", d17_total: "$.data.total_cents" }
            - call: "POST /client-deliverables/${d16_id}/dispatch"
