            - "err_close == ERR_PRIMARY_ACCOUNT_REQUIRED (409)"

      - name: voting_window_bounds
        claim_type: temporal_validation
        grounds: ["validations[priority=11]", "errors[ERR_VOTING_WINDOW_CLOSED]"]
        distinguishing_aspect: "The ballot window [voting_open_date, meeting_date] is inclusive: 2026-07-09 (before open) and 2026-07-21 (after meeting) both fail; 2026-07-20 (meeting day) succeeds. The late cast uses a second member so only the temporal rule is violated (no chain-duplicate confound)."
        test_recipe:
          setup: ["members m1 and m2 both effective 2026-07-01; meeting record 2026-07-05, voting_open 2026-07-10, meeting 2026-07-20, quorum 1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
