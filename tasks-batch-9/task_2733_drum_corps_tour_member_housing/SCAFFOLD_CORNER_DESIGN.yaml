              payload: { season_id: "${season_id}", stop_type: "REHEARSAL_ONLY", venue_name: "Doomed Stop", city: "Peoria", state_code: "IL", arrive_at: "2027-06-21T08:00:00Z", depart_at: "2027-06-21T20:00:00Z", travel_miles_from_previous: 0, uniform_trunks: 0, instrument_cases: 0, prop_units: 0, truck_count: 1, rehearsal_minutes: 120, heat_index_f: 80 }
              as: TourManager
              captures: { stop_id: "$.data.id" }
            - call: "POST /tour-stops/${stop_id}/cancel"
              payload: { cancel_reason: "venue lost" }
              as: CorpsDirector
          trigger:
            - call: "POST /tour-stops/${stop_id}/confirm"
              payload: {}
              as: TourManager
              captures: { confirm_err: "$.data.error_id" }
            - call: "POST /tour-stops/${stop_id}/complete"
              payload: {}
              as: TourManager
              captures: { complete_err: "$.data.error_id" }
            - call: "POST /tour-stops/${stop_id}/cancel"
