# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Breadth probe over §1.1–§1.7 claims not covered by §1.8. Sections and
# claim_type values follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_writer_applies_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Writer, "endpoints[POST /writers]"]
        distinguishing_aspect: "201 create returns server-minted id/created_at/version=1, status default ACTIVE, computed balances 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /writers", payload: { legal_name: "Default Writer", ipi_number: "00000010001", pro_affiliation: "PRS" }, as: PublisherAdmin, captures: { w: $.data.id, st: $.data.status, pay: $.data.payable_balance_cents, adv: $.data.advance_outstanding_cents, life: $.data.lifetime_earned_cents, ver: $.data.version } }
          assert:
            - "${st} == ACTIVE and ${pay} == 0 and ${adv} == 0 and ${life} == 0 and ${ver} == 1"
            - "${w} is a server-minted UUID with no type prefix"

      - name: get_writer_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Writer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /writers/00000000-0000-4000-8000-000000000000", as: PublisherAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: work_derivative_parent_reference_checked
        claim_type: parent_relationships
        grounds: [entities.Work.fields.parent_work_id]
        distinguishing_aspect: "Self-referential FK: derivative work with a valid parent_work_id is created; a bogus parent id yields ERR_NOT_FOUND."
        test_recipe:
          setup: ["Original work O exists"]
          setup_api_calls:
            - { call: "POST /works", payload: { title: "Original", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { o: $.data.id } }
          trigger:
            - { call: "POST /works", payload: { title: "Remix", grant_date: "2020-01-01T00:00:00Z", parent_work_id: "${o}" }, as: PublisherAdmin, captures: { d: $.data.id, d_parent: $.data.parent_work_id } }
            - { call: "POST /works", payload: { title: "Orphan Remix", grant_date: "2020-01-01T00:00:00Z", parent_work_id: "00000000-0000-4000-8000-000000000000" }, as: PublisherAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /works?parent_work_id=${o}", as: PublisherAdmin, captures: { kid: "$.data[0].id" } }
          assert:
            - "${d_parent} == ${o} (derivative link stored)"
            - "${err} == ERR_NOT_FOUND (bogus parent rejected)"
            - "Reverse reachability: GET /works?parent_work_id=${o} returns exactly one row and ${kid} == ${d}"

      - name: invalid_enum_value_rejected
        claim_type: type_constraints
        grounds: [entities.Writer.fields.pro_affiliation, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Enum membership: pro_affiliation BOGUS is rejected with ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /writers", payload: { legal_name: "Bad Enum", ipi_number: "00000010002", pro_affiliation: "BOGUS" }, as: PublisherAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_VALIDATION"

      - name: create_writer_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.Writer.fields.payable_balance_cents]
        distinguishing_aspect: "Client-supplied computed field is ignored: payable_balance_cents in the create payload does not persist."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /writers", payload: { legal_name: "Sneaky", ipi_number: "00000010003", pro_affiliation: "ASCAP", payable_balance_cents: 99999 }, as: PublisherAdmin, captures: { pay: $.data.payable_balance_cents } }
          assert:
            - "${pay} == 0 (input for computed field ignored)"

      - name: writers_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /writers]"]
        distinguishing_aspect: "Pagination contract: limit/offset/has_more/total_count behave per the fixed envelope (defaults limit=10)."
        test_recipe:
          setup: ["Three writers exist"]
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "P1", ipi_number: "00000010011", pro_affiliation: "ASCAP" }, as: PublisherAdmin }
            - { call: "POST /writers", payload: { legal_name: "P2", ipi_number: "00000010012", pro_affiliation: "BMI" }, as: PublisherAdmin }
            - { call: "POST /writers", payload: { legal_name: "P3", ipi_number: "00000010013", pro_affiliation: "SESAC" }, as: PublisherAdmin }
          trigger:
            - { call: "GET /writers?limit=2&offset=0", as: PublisherAdmin, captures: { first: "$.data[0].id" } }
            - { call: "GET /writers?limit=2&offset=2", as: PublisherAdmin, captures: { third: "$.data[0].id" } }
          assert:
            - "Page 1 returns exactly 2 items with total_count == 3 and has_more == true; order is created_at ASC (P1 first: ${first})"
            - "Page 2 (offset=2) returns exactly 1 item (P3: ${third}) with has_more == false"
            - "Omitting limit/offset returns all 3 (default limit 10 applies)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: society_registration_reject_resubmit_cycle
        claim_type: valid_transition
        grounds: [state_machines.SocietyRegistration.SUBMITTED_to_REJECTED, state_machines.SocietyRegistration.REJECTED_to_SUBMITTED, state_machines.Work]
        distinguishing_aspect: "Cyclic SocietyRegistration: SUBMITTED -> REJECTED -> SUBMITTED; Work.registration_status bubbles down to UNREGISTERED on rejection and back to PENDING_SOCIETY on resubmit."
        test_recipe:
          setup:
            - "Writer W1; Work K with CONFIRMED split set; Society S; registration R in SUBMITTED (work PENDING_SOCIETY)"
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000020001", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /works", payload: { title: "Cycle Reg Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
            - { call: "POST /split-sets/${ss}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1: "$.data[0].id", l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${l1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}" }
            - { call: "POST /split-lines/${l2}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "POST /societies", payload: { name: "ASCAP", code: "ASCAP", society_type: "PRO", territory_code: "US" }, as: PublisherAdmin, captures: { soc: $.data.id } }
            - { call: "POST /society-registrations", payload: { work_id: "${k}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg: $.data.id } }
            - { call: "POST /society-registrations/${reg}/submit", payload: {}, as: CopyrightSpecialist }
          trigger:
            - { call: "POST /society-registrations/${reg}/reject", payload: { reason: "metadata mismatch" }, as: CopyrightSpecialist, captures: { st1: $.data.status, why: $.data.rejection_reason } }
            - { call: "GET /works/${k}", as: PublisherAdmin, captures: { k_st1: $.data.registration_status } }
            - { call: "POST /society-registrations/${reg}/submit", payload: {}, as: CopyrightSpecialist, captures: { st2: $.data.status, why2: $.data.rejection_reason } }
            - { call: "GET /works/${k}", as: PublisherAdmin, captures: { k_st2: $.data.registration_status } }
          assert:
            - "${st1} == REJECTED and ${why} == 'metadata mismatch'"
            - "${k_st1} == UNREGISTERED (no live registrations remain)"
            - "${st2} == SUBMITTED and ${why2} == null (cycle back; reason cleared)"
            - "${k_st2} == PENDING_SOCIETY"

      - name: society_registration_acknowledge_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SocietyRegistration, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "acknowledge is only valid from SUBMITTED; from DRAFT it returns ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Work K; Society S; registration R in DRAFT (no split-set requirement for create)"]
          setup_api_calls:
            - { call: "POST /works", payload: { title: "Draft Reg Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id } }
            - { call: "POST /societies", payload: { name: "ASCAP", code: "ASCAP", society_type: "PRO", territory_code: "US" }, as: PublisherAdmin, captures: { soc: $.data.id } }
            - { call: "POST /society-registrations", payload: { work_id: "${k}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg: $.data.id } }
          trigger:
            - { call: "POST /society-registrations/${reg}/acknowledge", payload: { society_work_number: "880000999" }, as: CopyrightSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION"

      - name: society_registration_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SocietyRegistration]
        distinguishing_aspect: "REGISTERED is terminal: submit and reject from REGISTERED both fail; nothing mutates."
        test_recipe:
          setup: ["Fully registered work K with registration R in REGISTERED"]
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000020002", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /works", payload: { title: "Terminal Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
            - { call: "POST /split-sets/${ss}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1: "$.data[0].id", l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${l1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}" }
            - { call: "POST /split-lines/${l2}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "POST /societies", payload: { name: "ASCAP", code: "ASCAP", society_type: "PRO", territory_code: "US" }, as: PublisherAdmin, captures: { soc: $.data.id } }
            - { call: "POST /society-registrations", payload: { work_id: "${k}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg: $.data.id } }
            - { call: "POST /society-registrations/${reg}/submit", payload: {}, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/acknowledge", payload: { society_work_number: "880000998" }, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/register", payload: { iswc: "T-900000998-1" }, as: CopyrightSpecialist }
          trigger:
            - { call: "POST /society-registrations/${reg}/reject", payload: { reason: "too late" }, as: CopyrightSpecialist, captures: { err1: $.data.error_id } }
            - { call: "POST /society-registrations/${reg}/submit", payload: {}, as: CopyrightSpecialist, captures: { err2: $.data.error_id } }
            - { call: "GET /society-registrations/${reg}", as: PublisherAdmin, captures: { st: $.data.status } }
          assert:
            - "${err1} == ERR_INVALID_STATE_TRANSITION and ${err2} == ERR_INVALID_STATE_TRANSITION"
            - "${st} == REGISTERED (terminal lockdown; no drift)"

      - name: work_parallel_dimensions_independent
        claim_type: valid_transition
        grounds: [state_machines.Work, entities.Work.fields.registration_status, entities.Work.fields.copyright_status]
        distinguishing_aspect: "Parallel state dimensions on Work: copyright filings advance copyright_status while registration_status stays UNREGISTERED, and vice versa."
        test_recipe:
          setup: ["Work K created (UNREGISTERED / UNFILED)"]
          setup_api_calls:
            - { call: "POST /works", payload: { title: "Parallel Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id } }
          trigger:
            - { call: "POST /works/${k}/file-copyright", payload: { filing_ref: "PA-2026-001" }, as: CopyrightSpecialist, captures: { cop1: $.data.copyright_status, reg1: $.data.registration_status } }
            - { call: "POST /works/${k}/register-copyright", payload: { registration_number: "PA0001234567" }, as: CopyrightSpecialist, captures: { cop2: $.data.copyright_status, reg2: $.data.registration_status } }
          assert:
            - "${cop1} == FILED and ${reg1} == UNREGISTERED (registration dimension untouched)"
            - "${cop2} == COPCO_REGISTERED and ${reg2} == UNREGISTERED (dimensions evolve independently)"

      - name: work_iswc_assigned_on_pro_registration
        claim_type: side_effect_execution
        grounds: [state_machines.Work, entities.Work.fields.iswc, state_machines.SocietyRegistration.ACKNOWLEDGED_to_REGISTERED]
        distinguishing_aspect: "Registering with a PRO society assigns the work's ISWC and flips registration_status to REGISTERED; the iswc is set exactly once."
        test_recipe:
          setup: ["Work K with CONFIRMED splits; PRO society S; registration R ACKNOWLEDGED"]
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000020003", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /works", payload: { title: "ISWC Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
            - { call: "POST /split-sets/${ss}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1: "$.data[0].id", l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${l1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}" }
            - { call: "POST /split-lines/${l2}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "POST /societies", payload: { name: "ASCAP", code: "ASCAP", society_type: "PRO", territory_code: "US" }, as: PublisherAdmin, captures: { soc: $.data.id } }
            - { call: "POST /society-registrations", payload: { work_id: "${k}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg: $.data.id } }
            - { call: "POST /society-registrations/${reg}/submit", payload: {}, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/acknowledge", payload: { society_work_number: "880000997" }, as: CopyrightSpecialist }
          trigger:
            - { call: "POST /society-registrations/${reg}/register", payload: { iswc: "T-900000997-4" }, as: CopyrightSpecialist }
            - { call: "GET /works/${k}", as: PublisherAdmin, captures: { iswc: $.data.iswc, reg_st: $.data.registration_status } }
          assert:
            - "${iswc} == 'T-900000997-4' (society-assigned unique identifier propagated to the work)"
            - "${reg_st} == REGISTERED"

      - name: split_line_confirm_before_submit_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.SplitLine.PENDING_to_CONFIRMED]
        distinguishing_aspect: "Line confirm requires parent set PENDING_CONFIRMATIONS; while the set is DRAFT the confirm fails."
        test_recipe:
          setup: ["Work K; split set in DRAFT with one writer line"]
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000020004", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /works", payload: { title: "Early Confirm Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1: "$.data[0].id" } }
          trigger:
            - { call: "POST /split-lines/${l1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION"

      - name: split_line_double_confirm_rejected
        claim_type: idempotency
        grounds: [state_machines.SplitLine.PENDING_to_CONFIRMED]
        distinguishing_aspect: "Same trigger twice: the second confirm hits a terminal line and fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Work K; split set PENDING_CONFIRMATIONS; writer line L1"]
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000020005", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /works", payload: { title: "Double Confirm Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
            - { call: "POST /split-sets/${ss}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1: "$.data[0].id" } }
          trigger:
            - { call: "POST /split-lines/${l1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}", captures: { st1: $.data.confirmation_status } }
            - { call: "POST /split-lines/${l1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}", captures: { err: $.data.error_id } }
          assert:
            - "${st1} == CONFIRMED (first confirm succeeds)"
            - "${err} == ERR_INVALID_STATE_TRANSITION (second confirm rejected; no duplicate side effects)"

      - name: statement_match_automatch_selector
        claim_type: side_effect_execution
        grounds: [state_machines.RoyaltyStatement.RECEIVED_to_MATCHING_REVIEW, entities.StatementLine.fields.match_status]
        distinguishing_aspect: "Auto-match determinism: line with a known work_code hint auto-matches to the REGISTERED work; line without hints stays UNMATCHED; statement advances to MATCHING_REVIEW."
        test_recipe:
          setup: ["REGISTERED work K; statement with lines L1 (work_code hint) and L2 (no hints)"]
          setup_api_calls:
            - { call: "POST /writers", payload: { legal_name: "W1", ipi_number: "00000020006", pro_affiliation: "ASCAP" }, as: PublisherAdmin, captures: { w1: $.data.id } }
            - { call: "POST /works", payload: { title: "Match Song", grant_date: "1990-06-15T00:00:00Z" }, as: PublisherAdmin, captures: { k: $.data.id, k_code: $.data.work_code, k_v: $.data.version } }
            - { call: "POST /split-sets", payload: { work_id: "${k}", expected_work_version: "${k_v}", lines: [ { participant_type: WRITER, writer_id: "${w1}", share_bp: 10000 }, { participant_type: PUBLISHER, publisher_name: "OurPub", share_bp: 10000 } ] }, as: PublisherAdmin, captures: { ss: $.data.id } }
            - { call: "POST /split-sets/${ss}/submit", payload: {}, as: PublisherAdmin }
            - { call: "GET /split-lines?split_set_id=${ss}", as: PublisherAdmin, captures: { l1: "$.data[0].id", l2: "$.data[1].id" } }
            - { call: "POST /split-lines/${l1}/confirm", payload: {}, as: Writer, as_user_id: "${w1}" }
            - { call: "POST /split-lines/${l2}/confirm", payload: {}, as: PublisherAdmin }
            - { call: "POST /societies", payload: { name: "ASCAP", code: "ASCAP", society_type: "PRO", territory_code: "US" }, as: PublisherAdmin, captures: { soc: $.data.id } }
            - { call: "POST /society-registrations", payload: { work_id: "${k}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg: $.data.id } }
            - { call: "POST /society-registrations/${reg}/submit", payload: {}, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/acknowledge", payload: { society_work_number: "880000996" }, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/register", payload: { iswc: "T-900000996-5" }, as: CopyrightSpecialist }
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 3000, lines: [ { line_number: 1, reported_title: "Match Song", reported_work_code: "${k_code}", gross_cents: 2000 }, { line_number: 2, reported_title: "Mystery", gross_cents: 1000 } ] }, as: RoyaltyAnalyst, captures: { st: $.data.id } }
          trigger:
            - { call: "POST /royalty-statements/${st}/match", payload: {}, as: RoyaltyAnalyst, captures: { st_st: $.data.status } }
            - { call: "GET /statement-lines?statement_id=${st}", as: RoyaltyAnalyst, captures: { l1_ms: "$.data[0].match_status", l1_w: "$.data[0].work_id", l2_ms: "$.data[1].match_status" } }
          assert:
            - "${st_st} == MATCHING_REVIEW"
            - "${l1_ms} == AUTO_MATCHED and ${l1_w} == ${k} (work_code hint matched the REGISTERED work)"
            - "${l2_ms} == UNMATCHED (empty candidate set leaves the line unmatched, no error)"

      - name: statement_finalize_from_received_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RoyaltyStatement]
        distinguishing_aspect: "Stage-skipping: finalize from RECEIVED (no match/allocate) is rejected; the pipeline order is enforced."
        test_recipe:
          setup: ["Licensee L; statement S in RECEIVED with one line"]
          setup_api_calls:
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "MECHANICAL", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 500, lines: [ { line_number: 1, reported_title: "Skip Song", gross_cents: 500 } ] }, as: RoyaltyAnalyst, captures: { st: $.data.id } }
          trigger:
            - { call: "POST /royalty-statements/${st}/finalize", payload: {}, as: RoyaltyAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION"

      - name: advance_cancel_from_paid_rejected
