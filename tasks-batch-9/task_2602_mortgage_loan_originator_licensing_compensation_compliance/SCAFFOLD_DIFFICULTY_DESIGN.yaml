  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: license_expiry_sweep_five_hop_authority_lapse_cascade
        grounds:
          - state_machines.LicenseRegistration.ACTIVE_to_EXPIRED
          - endpoints[POST /_ops/daily-license-sweep]
          - calculations.state_authority_resolution
        distinguishing_aspect: |
          Depth-5 chain across four entities driven by one clock-advanced sweep:
          hop 1 licence ACTIVE -> EXPIRED relinquishes the ACTIVE SponsorshipTransfer;
          hop 2 clears the licence's denormalised sponsorship fields and recomputes
          Originator.authorized_state_codes to []; hop 3 suspends the originator's TAKEN loan in
          that state; hop 4 opens an UnlicensedActivityInvestigation for it; hop 5 recomputes
          Originator.open_investigation_count. Each hop is caused by the previous hop's mutation,
          never by the sweep call itself.
        test_recipe:
          setup:
            - "Originator NMLS 1100007 with a CA licence expiring 2026-09-01T00:00:00Z, activated
               at the default clock with sponsorship INST-ALPHA effective 2026-08-01T00:00:00Z."
            - "One loan taken (never locked) at clock 2026-08-05T00:00:00Z while authority holds."
            - "The clock is then advanced past the expiration date and the sweep is run once."
          setup_api_calls:
            - call: "POST /originators"
              payload: { nmls_unique_id: "1100007", legal_name: "Ada Cortez", hire_date: "2024-09-01T00:00:00Z", employment_status: "EMPLOYED" }
