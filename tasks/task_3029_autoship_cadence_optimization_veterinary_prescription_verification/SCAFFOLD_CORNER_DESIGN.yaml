            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_s5}" }
              as: Customer
              as_user_id: "${pet_s5}"
              captures: { plan_s5: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_s5}/items"
              payload: { product_id: "${prod_s5}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_s5}"
              captures: { item_s5: $.data.id }
            - call: "POST /v1/prescriptions"
              payload: { autoship_item_id: "${item_s5}", prescriber_id: "${vet_s5}", script_source: "UPLOADED_SCRIPT", script_document_id: "doc-expiry-1", drug_schedule: "NONE", temperature_sensitive: false, authorized_qty_total: 900, refills_authorized: 12 }
              as: PharmacyTechnician
              captures: { rx_s5: $.data.id }
            - call: "POST /v1/prescriptions/${rx_s5}/clinic-contacts"
              payload: {}
              as: PharmacyTechnician
            - call: "POST /v1/prescriptions/${rx_s5}/clinic-authorizations"
              payload: {}
              as: ClinicContact
              as_user_id: "${vet_s5}"
