  instances:
  - name: household_trial_buffer_rejects_one_minute_inside_and_admits_the_boundary
    grounds: validations.household_trial_no_overlap; global_constants.TRIAL_BUFFER_MINUTES; entities.TrialEngagement.start_at
      / end_at
    mechanism: 'A live trial occupies the household from start_at minus 120 minutes to end_at plus 120 minutes, and
      that occupancy interval is half-open. A 09:00-17:00 trial day therefore blocks [07:00, 19:00): a second candidate
      proposed at 18:59 intersects the buffer and is refused, and the same booking at 19:00 touches the boundary and
      is admitted.'
    naive_implementation: Compare the raw trial intervals without the buffer (18:59 is then accepted), or treat the
      buffered interval as closed at both ends (19:00 is then refused too).
    distinguishing_aspect: 'Two bookings one minute apart resolve differently: 18:59 returns ERR_TRIAL_OVERLAP and
      19:00 returns 201, pinning both the 120-minute buffer and its half-open upper end.'
