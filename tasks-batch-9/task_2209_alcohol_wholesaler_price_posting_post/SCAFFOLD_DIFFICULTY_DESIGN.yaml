            - "Item A carries one ACTIVE quantity discount tier at min_cases 5 and discount_pct 0.10, so its discounted_case_price_cents starts at 108000."
            - "Wholesaler A files two hold amendments on item A referencing item B; the first is accepted and the second is rejected."
