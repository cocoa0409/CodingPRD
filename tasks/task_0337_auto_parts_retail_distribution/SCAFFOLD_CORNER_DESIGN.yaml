              payload: { part_id: "${pid}" }
              as: InventoryManager
              captures: { ro_id: $.data.id }
            - call: "POST /reorder-requests/${ro_id}/place"
              as: InventoryManager
          trigger:
            - call: "POST /reorder-requests/${ro_id}/receive"
