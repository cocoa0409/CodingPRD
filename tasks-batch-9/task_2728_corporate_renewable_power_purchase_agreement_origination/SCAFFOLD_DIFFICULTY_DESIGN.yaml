              as: Originator
              as_user_id: "u_orig_1"
              captures: { curtail_a_id: $.data.id }
          trigger:
            - call: "POST /ppa/deals/${deal_id}/risk-events"
              payload: { event_type: "CURTAILMENT", claimed_by: "DEVELOPER", window_start: "2027-07-18T00:00:00Z", window_end: "2027-07-12T00:00:00Z", description: "Inverted window that also straddles the existing claim" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/deals/${deal_id}/risk-events"
              payload: { event_type: "CURTAILMENT", claimed_by: "DEVELOPER", window_start: "2027-07-12T00:00:00Z", window_end: "2027-07-18T00:00:00Z", description: "Same two dates, correct order" }
              as: Originator
              as_user_id: "u_orig_1"
