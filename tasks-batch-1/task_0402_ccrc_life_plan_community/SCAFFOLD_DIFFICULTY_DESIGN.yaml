              as: AdmissionsDirector
              captures: { rs2: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "R3", date_of_birth: "1930-01-03" }
              as: AdmissionsDirector
              captures: { rs3: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "R4", date_of_birth: "1930-01-04" }
              as: AdmissionsDirector
              captures: { rs4: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${rs1}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { r1: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${rs2}", contract_plan_id: "${pid}" }
