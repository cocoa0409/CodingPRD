            - { call: "POST /v1/agreements/${agr_id}/sign", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/auditoriums", payload: { agreement_id: "${agr_id}", auditorium_label: "S1", screen_geometry: { width_m: 20, height_m: 11, curvature_deg: 60 }, seating_capacity: 200, supported_formats: ["PREMIUM_2D"], sound_calibration_profile: { spl_target_db: 85, eq_curve_id: "STD", channel_count: 12 } }, as: PlatformContractManager, captures: { aud_id: $.data.id } }
            - { call: "POST /v1/auditoriums/${aud_id}/begin-construction", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/auditoriums/${aud_id}/begin-calibration", payload: {}, as: FieldEngineer }
            - { call: "POST /v1/auditoriums/${aud_id}/certify", payload: {}, as: FieldEngineer }
            - { call: "POST /v1/auditoriums/${aud_id}/open", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/agreements/${agr_id}/activate", payload: {}, as: PlatformContractManager }
            - { call: "POST /v1/qa-alerts", payload: { auditorium_id: "${aud_id}", alert_code: "PROJECTOR_TEMP", severity: "CRITICAL" }, as: FieldEngineer, captures: { alert_id: $.data.id } }
          trigger:
            - { call: "POST /v1/auditoriums/${aud_id}/return-to-service", payload: {}, as: FieldEngineer, captures: { err_id: $.data.error_id } }
          assert:
            - "the response status is 409"
            - "error_id == ERR_UNRESOLVED_CRITICAL_ALERTS (safety, priority 8)"
            - "Auditorium.${aud_id}.status remains DEGRADED"

  # ===========================================================================
  # Rule 6: boundary_precision_check — different metrics / endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tier1_cap_one_cent_over_flips_into_tier2
        grounds:
          - calculations.apply_tiered_marginal_share
          - calculations.final_revenue_share
        distinguishing_aspect: |
          Metric: weekly gross cents at exactly TIER1_CAP_CENTS ($100,000.00)
          vs one cent over. Endpoint: GET /v1/revenue-share-statements/{id}.
          At exactly the cap, all share is tier 1 (12%); one cent over, the
          marginal cent falls into tier 2 (15%) — but rounded via
          round-half-up, 10_000_001 × 0.15 = 1_500_000.15 → 1_500_000 when
          stored as integer cents. The observable difference between the two
          scenarios is the exhibitor_retained_cents.
        test_recipe:
          setup:
            - "Standard setup with TWO auditoriums and TWO films, two CONFIRMED slots in the same window."
            - "Slot A's film grosses exactly TIER1_CAP_CENTS = 10_000_000 cents on 2026-09-07 (one VALIDATED report)."
            - "Slot B's film grosses 10_000_001 cents on 2026-09-07 (one VALIDATED report) — exactly one cent over the cap."
