  - rule_id: transitive_cascade
    instances:
      - name: inspection_failure_cascades_club_to_franchisee_to_promotion_withdrawal
        grounds:
          - endpoints[POST /franchise/inspections/{id}/score]
          - state_machines.Club.OPEN_to_SUSPENDED
          - state_machines.Franchisee.ACTIVE_to_PROBATION
          - state_machines.Promotion.APPROVED_to_WITHDRAWN_BY_BRAND
          - calculations.inspection_score
          - calculations.franchisee_compliance_score
        cascade_depth: 4
        distinguishing_aspect: |
          A four-node compliance chain fired by a single scoring call:
          FacilityInspection.score -> Club.equipment_compliance_state/status -> Franchisee
          inspection_fail_streak/compliance_score/status -> Promotion.status. Every link is caused
          strictly by the previous one: the score below REMEDIATION_SCORE_THRESHOLD is what makes the
          club NON_COMPLIANT and SUSPENDED, the second consecutive failing score is what drops
          compliance_score to 60 and demotes the franchisee, and it is the ACTIVE -> PROBATION demotion
          (not the inspection) that withdraws the approved promotion. A one-link implementation that
          only suspends the club, or a two-link one that stops at the franchisee, leaves the promotion
          APPROVED.
        test_recipe:
          setup:
            - "One franchisee with a pre-2020 club (opened_on 2019-06-01), so every inspection uses the accelerated 42-month refresh cycle."
            - "One PUBLISHED plan template and one APPROVED 10 percent promotion owned by that franchisee."
            - "One inspection dated 2026-07-10 already scored 78/86/80 with a 54-month equipment floor: refresh_pts 0, score 69, so the club is already NON_COMPLIANT and SUSPENDED, inspection_fail_streak is 1 and compliance_score is 80 (still ACTIVE)."
            - "A second inspection dated 2026-07-20 standing SCHEDULED."
