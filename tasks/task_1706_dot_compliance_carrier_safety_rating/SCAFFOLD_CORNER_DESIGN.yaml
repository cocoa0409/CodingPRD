  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_coaching_create_stale_driver_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[coaching-create-stale-driver-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "CREATE-with-supersede OCC: a second create carrying the pre-supersede driver version is rejected with 412; re-issued with the current version it succeeds and supersedes the open assignment."
        test_recipe:
          setup: ["carrier; driver (version captured at creation)"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2601", legal_name: "OCC Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2601", full_name: "Kim Uto", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id, d_ver: $.data.version } }
          trigger:
            - { call: "POST /safety/coaching-assignments", payload: { driver_id: "${d_id}", coaching_type: "TRAINING_COURSE", due_date: "2026-12-01T00:00:00Z", expected_driver_version: "${d_ver}" }, as: SafetyManager, captures: { co_a: $.data.id } }
            - { call: "GET /safety/drivers/${d_id}", payload: {}, as: SafetyManager, captures: { d_ver2: $.data.version } }
            - { call: "POST /safety/coaching-assignments", payload: { driver_id: "${d_id}", coaching_type: "TRAINING_COURSE", due_date: "2026-12-15T00:00:00Z", expected_driver_version: "${d_ver}" }, as: SafetyManager, captures: { err: $.data.error_id } }
            - { call: "POST /safety/coaching-assignments", payload: { driver_id: "${d_id}", coaching_type: "TRAINING_COURSE", due_date: "2026-12-15T00:00:00Z", expected_driver_version: "${d_ver2}" }, as: SafetyManager, captures: { co_b: $.data.id } }
            - { call: "GET /safety/coaching-assignments/${co_a}", payload: {}, as: SafetyManager, captures: { co_a_status: $.data.status } }
          assert:
            - "create A succeeds (driver version ${d_ver}); driver.version advances to ${d_ver2} == ${d_ver} + 1"
            - "create B with stale expected_driver_version ${d_ver} -> ERR_STALE_VERSION (HTTP 412)"
            - "create B with current version ${d_ver2} -> 201; assignment A -> SUPERSEDED (create-with-supersede)"

      - name: occ_carrier_patch_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[carrier-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Update OCC: a PATCH carrying the pre-mutation carrier version is rejected with 412; the same PATCH with the current version succeeds."
        test_recipe:
          setup: ["carrier (version captured at creation)"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2602", legal_name: "OCC Carrier Two", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id, c_ver: $.data.version } }
          trigger:
            - { call: "PATCH /safety/carriers/${c_id}", payload: { fleet_size: 5, expected_carrier_version: "${c_ver}" }, as: SafetyAdmin, captures: { c_ver2: $.data.version } }
            - { call: "PATCH /safety/carriers/${c_id}", payload: { legal_name: "Stale Edit", expected_carrier_version: "${c_ver}" }, as: SafetyAdmin, captures: { err: $.data.error_id } }
            - { call: "PATCH /safety/carriers/${c_id}", payload: { legal_name: "Fresh Edit", expected_carrier_version: "${c_ver2}" }, as: SafetyAdmin, captures: { c_ver3: $.data.version } }
          assert:
            - "first PATCH: fleet_size == 5, version ${c_ver2} == ${c_ver} + 1"
            - "second PATCH with stale ${c_ver} -> ERR_STALE_VERSION (412), legal_name unchanged"
            - "third PATCH with ${c_ver2} -> 200, legal_name == Fresh Edit"

      - name: version_increments_on_cascaded_mutation
        claim_type: derived_field_reconciliation
        grounds: [entities.Driver.fields.version, "endpoints[POST /safety/inspection-violations]"]
        distinguishing_aspect: "A cascaded mutation counts as a mutation: creating a violation recomputes driver.risk_score and bumps Driver.version from 1 to 2 (updated_at refreshed)."
        test_recipe:
          setup: ["carrier; category; driver (version 1); inspection"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2603", legal_name: "Version Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "UNSAFE_DRIVING", display_name: "UD", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2603", full_name: "Liv Ite", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id, d_ver: $.data.version } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-2603", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 1, state_code: "SC" }, as: SafetyManager, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "392.2", severity_weight: 4, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager }
            - { call: "GET /safety/drivers/${d_id}", payload: {}, as: SafetyManager, captures: { d_ver2: $.data.version, d_risk: $.data.risk_score } }
          assert:
            - "driver.version == 2 after the violation create (cascaded risk recompute is a mutation), risk_score == 12 (4 x tw3)"

      - name: dual_variant_coverage_stub
        claim_type: dual_variant_calculation
        grounds: [calculations.category_measure, calculations.insurance_premium]
        excluded_because:
          difficulty_instance: category_measure_official_vs_provisional
          rationale: "Both dual-variant calculations are asserted with literal values in §1.8 (this and premium_baseline_vs_projected)."

      - name: cascade_chain_coverage_stub
        claim_type: cascading_side_effects
        grounds: [state_machines.InspectionViolation.CHALLENGED_to_REMOVED]
        excluded_because:
          difficulty_instance: cascade_overturn_to_premium_stale
          rationale: "The 4-hop overturn cascade and the 3-hop audit-close cascade are asserted hop-by-hop in §1.8."

      - name: rate_threshold_coverage_stub
        claim_type: rate_threshold_triggers
        grounds: [calculations.violation_time_weight, calculations.percentile_from_measure]
        excluded_because:
          difficulty_instance: time_weight_six_month_inclusive_boundary
          rationale: "Threshold boundaries are asserted at the 6-month inclusive edge (§1.8) and at percentile == threshold (calculations/percentile_equality_alert_threshold)."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_mutation
        claim_type: immediate_consistency
        grounds: [complexity_profile, "endpoints[POST /safety/inspection-violations]"]
        distinguishing_aspect: "Immediate consistency: the create response itself carries the computed time_weight_multiplier (3) and weighted_points (24); a follow-up GET returns identical values — no read-repair or lag."
        test_recipe:
          setup: ["carrier; category; driver; inspection"]
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2604", legal_name: "Immediate Carrier", fleet_size: 2 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "UNSAFE_DRIVING", display_name: "UD", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2604", full_name: "Max Uli", hire_date: "2025-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-2604", inspection_date: "2026-05-01T00:00:00Z", inspection_level: 1, state_code: "FL" }, as: SafetyManager, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "392.2", severity_weight: 8, occurred_at: "2026-05-01T00:00:00Z" }, as: SafetyManager, captures: { v_id: $.data.id, v_tw: $.data.time_weight_multiplier, v_pts: $.data.weighted_points } }
            - { call: "GET /safety/inspection-violations/${v_id}", payload: {}, as: SafetyManager, captures: { g_tw: $.data.time_weight_multiplier, g_pts: $.data.weighted_points } }
            - { call: "GET /safety/roadside-inspections/${i_id}", payload: {}, as: SafetyManager, captures: { i_pts: $.data.total_weighted_points } }
          assert:
            - "create response: time_weight_multiplier == 3, weighted_points == 24 (computed in-request)"
            - "GET returns the same values; inspection.total_weighted_points == 24 immediately"
