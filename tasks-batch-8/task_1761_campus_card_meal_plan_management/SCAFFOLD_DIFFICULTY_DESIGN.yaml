              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { card_id: "$.data.id" }
            - call: "POST /api/cards/${card_id}/photos"
              payload: { image_ref: "img://gus" }
              as: CardHolder
              as_user_id: "${h_id}"
