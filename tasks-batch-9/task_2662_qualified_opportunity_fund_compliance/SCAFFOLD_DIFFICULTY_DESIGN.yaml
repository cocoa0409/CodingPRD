  - rule_id: non_linear_state_machine
    instances:
      - name: fund_parallel_state_dimensions_independent
        grounds:
          - state_machines.Fund.DRAFT_to_SELF_CERTIFIED
          - state_machines.Fund.UNTESTED_to_COMPLIANT
          - entities.Fund.fields.certification_status
          - entities.Fund.fields.compliance_posture
          - calculations.semiannual_asset_test_ratio
        distinguishing_aspect: |
          Non-linearity on the FUND entity, parallel shape: Fund carries two
          simultaneous state dimensions, and a certify-PASS event advances
          compliance_posture UNTESTED -> COMPLIANT while leaving
          certification_status pinned at SELF_CERTIFIED — a single-dimension
          implementation cannot reproduce the pair (SELF_CERTIFIED, COMPLIANT).
        test_recipe:
          setup:
            - "One Fund managed by mgr-fund-1 self-certified at the clock instant 2026-08-01, so certification_status is SELF_CERTIFIED while compliance_posture is still UNTESTED (captured before the trigger)."
            - "One QUALIFIED QOZ_BUSINESS_PROPERTY FundAsset at 1000000.00 and no other asset, so the 90-percent ratio measures 100.0000."
            - "One MEASURED AssetTest over [2026-01-01, 2026-07-01) with measurement_date 2026-06-30 and result PASS, measured by co-measurer-1."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Parallel Dimensions Fund", entity_type: "CORPORATION", manager_user_id: "mgr-fund-1" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { fund_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/self-certify"
              payload: { first_taxable_month_iso8601: "2026-01-01T00:00:00Z" }
              as: FundManager
              as_user_id: "mgr-fund-1"
            - call: "GET /qof/funds/${fund_id}"
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { cert_before: $.data.certification_status, posture_before: $.data.compliance_posture }
            - call: "POST /qof/fund-assets"
              payload: { fund_id: "${fund_id}", asset_class: "QOZ_BUSINESS_PROPERTY", acquisition_date: "2026-01-15T00:00:00Z", unadjusted_cost_basis: 1000000.00, afs_fair_value: 1000000.00, original_use_in_zone: true }
              as: FundManager
              as_user_id: "mgr-fund-1"
              captures: { asset_id: $.data.id }
            - call: "POST /qof/funds/${fund_id}/asset-tests"
              payload: { measurement_date: "2026-06-30T00:00:00Z", period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
              captures: { test_id: $.data.id }
            - call: "POST /qof/asset-tests/${test_id}/measure"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-measurer-1"
          trigger:
            - call: "POST /qof/asset-tests/${test_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-certifier-1"
          assert:
            - "${cert_before} == SELF_CERTIFIED"
            - "${posture_before} == UNTESTED"
            - "AssetTest.${test_id}.ratio_pct == 100.0000"
            - "AssetTest.${test_id}.result == PASS"
            - "AssetTest.${test_id}.status == CERTIFIED_PASS"
            - "AssetTest.${test_id}.shortfall_amount == 0.00"
            - "AssetTest.${test_id}.failed_month_count == 0"
            - "Fund.${fund_id}.compliance_posture == COMPLIANT"
            - "Fund.${fund_id}.certification_status == SELF_CERTIFIED (the certification dimension did not move)"
            - "Fund.${fund_id}.consecutive_failed_tests == 0"
            - "Fund.${fund_id}.cumulative_penalty_months == 0"
            - "Fund.${fund_id}.self_certification_date == 2026-08-01T00:00:00Z"
            - "Fund.${fund_id}.last_test_measurement_date == 2026-06-30T00:00:00Z"

      - name: penalty_assessment_cure_cycle_returns_to_assessed
        grounds:
          - state_machines.PenaltyAssessment.ASSESSED_to_CURE_REQUESTED
          - state_machines.PenaltyAssessment.CURE_REQUESTED_to_ASSESSED
          - state_machines.PenaltyAssessment.CURE_REQUESTED_to_UPHELD
          - state_machines.Fund.CURE_PENDING_to_DEFICIENT
          - validations[priority=38]
        distinguishing_aspect: |
          Non-linearity on the PENALTYASSESSMENT entity, cyclic shape: the row
          revisits ASSESSED after a first denial (ASSESSED -> CURE_REQUESTED ->
          ASSESSED -> CURE_REQUESTED -> UPHELD), and which arc a DENY takes is
          decided by the cure_basis of the request being decided, not by the
          attempt number — a forward-only machine would have to terminate at the
          first denial, and an attempt-counting machine would misroute the pair.
        test_recipe:
          setup:
            - "One SELF_CERTIFIED Fund whose AssetTest was certified FAIL, leaving a PenaltyAssessment in status ASSESSED with gross_penalty_amount 1999.98, failed_month_count 6 and cure_attempt_count 0."
            - "Fund.compliance_posture is DEFICIENT and Fund.cumulative_penalty_months is 6."
          setup_api_calls:
            - call: "POST /qof/funds"
              payload: { name: "Cure Cycle Fund", entity_type: "PARTNERSHIP", manager_user_id: "mgr-fund-1", asset_test_valuation_method: "UNADJUSTED_COST_BASIS" }
