# =============================================================================
# SCAFFOLD.yaml — Grant Competition, Host Country Placement & Exchange Visitor
# Compliance (Fulbright-style exchange program)
# =============================================================================

scenario: |
  Grant Competition, Host Country Placement & Exchange Visitor Compliance (Fulbright Program): open competition application cycles with campus committee review for enrolled students and independent review for others, national screening committee evaluation with project feasibility and country-specific criteria, host country commission or embassy review with placement negotiation at receiving institutions, grant terms covering stipend, travel, health benefits and program duration with country-specific allowances, exchange visitor visa sponsorship with program regulations including the two-year home residency requirement, pre-departure orientation and in-country support with emergency protocols, grantee reporting obligations and program evaluation, alumni engagement and follow-on program eligibility

domain_name: grant-exchange-compliance
api_prefix: /exchange

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, rate_threshold_triggers]
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: CompetitionCycle
    parent: null
    common_fields: true
    fields:
      - { name: academic_year, type: string, source: input, description: "Academic year label, e.g. 2027-2028" }
      - { name: application_deadline, type: datetime, source: input, description: "Submissions close at this ISO8601 instant (inclusive)" }
      - { name: status, type: enum, source: system, description: "Cycle phase", constraints: "DRAFT | OPEN | CLOSED | SCREENING | AWARDS_FINALIZED | COMPLETED" }

  - name: CountryProgram
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> CompetitionCycle.id; cycle this country offering belongs to" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 host country code" }
      - { name: slot_quota, type: integer, source: input, description: "Maximum number of grants awardable to this country in this cycle" }
      - { name: min_duration_months, type: integer, source: input, description: "Minimum grant duration in whole calendar months" }
      - { name: max_duration_months, type: integer, source: input, description: "Maximum grant duration in whole calendar months" }
      - { name: monthly_stipend_standard_cents, type: integer, source: input, description: "Monthly stipend for STANDARD cost-of-living band institutions" }
      - { name: monthly_stipend_high_cents, type: integer, source: input, description: "Monthly stipend for HIGH cost-of-living band institutions" }
      - { name: dependent_allowance_monthly_cents, type: integer, source: input, description: "Monthly allowance per counted dependent" }
      - { name: travel_allowance_cents, type: integer, source: input, description: "One-time travel allowance in cents" }
      - { name: health_benefit_monthly_cents, type: integer, source: input, description: "Monthly health benefits premium" }
      - { name: language_requirement, type: enum, source: input, description: "Country-specific language criterion", constraints: "NONE | BASIC | PROFICIENT" }
      - { name: slots_remaining, type: integer, source: computed, description: "slot_quota minus count of slot-consuming applications (see calculations.slot_accounting)" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Applicant full legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across applicants (ERR_DUPLICATE_EMAIL)" }
      - { name: applicant_type, type: enum, source: input, description: "Determines review path fork at submit", constraints: "ENROLLED_STUDENT | INDEPENDENT" }
      - { name: home_institution_name, type: string, source: input, required: false, description: "Enrolling institution; required iff applicant_type == ENROLLED_STUDENT" }
      - { name: citizenship_country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 home country code" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; owning applicant (must equal X-User-ID for Applicant role)" }
      - { name: cycle_id, type: string, source: input, description: "FK -> CompetitionCycle.id" }
      - { name: country_program_id, type: string, source: input, description: "FK -> CountryProgram.id; must belong to cycle_id" }
      - { name: project_title, type: string, source: input, description: "Proposed project title" }
      - { name: project_summary, type: string, source: input, description: "Proposed project summary" }
      - { name: proposed_duration_months, type: integer, source: input, description: "Requested grant duration; must be within country program [min_duration_months, max_duration_months]" }
      - { name: dependents_count, type: integer, source: input, default: 0, description: "Accompanying dependents; counted up to DEPENDENT_CAP" }
      - { name: is_follow_on, type: boolean, source: input, default: false, description: "Follow-on program application; requires latest AlumniProfile follow_on_eligible == ELIGIBLE" }
      - { name: status, type: enum, source: system, description: "Pipeline state", constraints: "DRAFT | CAMPUS_REVIEW | NATIONAL_SCREENING | HOST_REVIEW | SELECTED | ALTERNATE | PLACEMENT | GRANT_PENDING | AWARDED | NOT_SELECTED | WITHDRAWN | DECLINED | PLACEMENT_FAILED" }
      - { name: submitted_at, type: datetime, source: system, required: false, description: "Logical clock at SUBMIT" }
      - { name: recommend_seq, type: integer, source: system, required: false, description: "Per-country-program monotonically increasing recommendation order (1-based); assigned on entering HOST_REVIEW; never ties" }
      - { name: national_weighted_score, type: number, source: computed, required: false, description: "Weighted national screening score, set once national quorum reached; 2 decimal places" }
      - { name: placement_rounds_used, type: integer, source: system, default: 0, description: "Count of placement rounds opened; hard cap MAX_PLACEMENT_ROUNDS" }

  - name: ReviewScore
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id" }
      - { name: stage, type: enum, source: system, description: "Derived from application status at post time", constraints: "CAMPUS | NATIONAL" }
      - { name: reviewer_id, type: string, source: system, description: "X-User-ID of the reviewer who posted" }
      - { name: feasibility_score, type: number, source: input, description: "Project feasibility 0-100" }
      - { name: country_fit_score, type: number, source: input, description: "Country-specific criteria fit 0-100" }
      - { name: language_score, type: number, source: input, description: "Language preparedness 0-100" }
      - { name: comment, type: string, source: input, required: false, description: "Free-form reviewer note" }

  - name: PlacementRound
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id" }
      - { name: round_number, type: integer, source: system, description: "1-based sequence of negotiation rounds for this application" }
      - { name: institution_name, type: string, source: input, description: "Receiving institution negotiated with" }
      - { name: institution_band, type: enum, source: input, description: "Cost-of-living band offered by the institution", constraints: "STANDARD | HIGH" }
      - { name: response_deadline, type: datetime, source: input, description: "Offer expiry instant (inclusive)" }
      - { name: status, type: enum, source: system, description: "Round state", constraints: "OFFERED | ACCEPTED | DECLINED | EXPIRED" }
      - { name: responded_at, type: datetime, source: system, required: false, description: "Logical clock at ACCEPT/DECLINE" }

  - name: Grant
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; created when the application enters SELECTED" }
      - { name: status, type: enum, source: system, description: "Grant lifecycle", constraints: "PROVISIONAL | CONFIRMED | ACTIVE | SUSPENDED | COMPLETED | TERMINATED_EARLY" }
      - { name: awarded_band, type: enum, source: system, required: false, description: "Cost-of-living band inherited from the ACCEPTED placement round", constraints: "STANDARD | HIGH" }
      - { name: provisional_monthly_stipend_cents, type: integer, source: computed, description: "Provisional monthly stipend (always STANDARD band) at selection" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Provisional total award at selection (uncapped dependent allowance)" }
      - { name: final_monthly_stipend_cents, type: integer, source: computed, required: false, description: "Final monthly stipend per awarded_band at confirmation" }
      - { name: final_total_cents, type: integer, source: computed, required: false, description: "Final total award at confirmation (capped dependent allowance)" }
      - { name: duration_months, type: integer, source: computed, required: false, description: "Whole calendar months between start_date and end_date: (end.year-start.year)*12 + (end.month-start.month)" }
      - { name: start_date, type: datetime, source: input, required: false, description: "Program start; supplied at grant-confirmation" }
      - { name: end_date, type: datetime, source: input, required: false, description: "Program end; supplied at grant-confirmation; extended by suspension days" }
      - { name: orientation_completed_at, type: datetime, source: system, required: false, description: "Pre-departure orientation timestamp, recorded at visa sponsorship issuance" }
      - { name: interim_report_due_date, type: datetime, source: computed, required: false, description: "add_months(start_date, INTERIM_REPORT_DUE_MONTHS), set at activation" }
      - { name: final_report_due_date, type: datetime, source: computed, required: false, description: "end_date + FINAL_REPORT_DUE_DAYS days; recomputed when end_date shifts" }
      - { name: suspension_days_total, type: integer, source: system, default: 0, description: "Cumulative suspension days applied to end_date" }
      - { name: compliance_strikes, type: integer, source: system, default: 0, description: "Late-report strikes; >= MAX_COMPLIANCE_STRIKES bars follow-on eligibility" }
      - { name: earned_cents, type: integer, source: computed, required: false, description: "Served-months portion of final_total_cents at early termination" }
      - { name: repayment_cents, type: integer, source: computed, required: false, description: "Unserved-months repayment at early termination" }
      - { name: reconciliation_adjustment_cents, type: integer, source: computed, required: false, description: "Rounding remainder so that earned + repayment + adjustment == final_total_cents" }
      - { name: termination_reason, type: string, source: input, required: false, description: "Reason recorded at early termination" }

  - name: VisaSponsorship
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id; one sponsorship per grant" }
      - { name: sponsor_program_number, type: string, source: system, description: "Exchange visitor program number, EV- plus 6-digit sequence" }
      - { name: subject_to_home_residency, type: boolean, source: input, description: "Two-year home residency (212(e)) determination" }
      - { name: orientation_completed_at, type: datetime, source: input, description: "Pre-departure orientation completion; must not be in the future" }
      - { name: status, type: enum, source: system, description: "Sponsorship lifecycle", constraints: "ISSUED | ACTIVE | COMPLETED | ENDED_EARLY" }

  - name: ResidencyLedger
    parent: null
    common_fields: true
    fields:
      - { name: visa_sponsorship_id, type: string, source: system, description: "FK -> VisaSponsorship.id; one ledger per sponsorship" }
      - { name: status, type: enum, source: system, description: "Two-year home residency tracking state", constraints: "PENDING | ACCRUING | WAIVER_PENDING | FULFILLED | WAIVED | NOT_REQUIRED" }
      - { name: required_days, type: integer, source: system, default: 730, description: "RESIDENCY_REQUIRED_DAYS" }
      - { name: accrued_days, type: integer, source: computed, default: 0, description: "Sum of recorded stay day_counts (inclusive of both endpoints)" }
      - { name: accrual_start_date, type: datetime, source: system, required: false, description: "Date accrual opened (grant end or termination date)" }
      - { name: stays, type: array, source: system, description: "Recorded home-country stays: [{start_date, end_date, day_count}]" }
      - { name: waiver_reason, type: string, source: input, required: false, description: "Reason supplied at REQUEST_WAIVER" }

  - name: Report
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id" }
      - { name: report_type, type: enum, source: input, description: "Obligation kind", constraints: "INTERIM | FINAL" }
      - { name: content, type: string, source: input, description: "Report body" }
      - { name: status, type: enum, source: system, description: "Review state", constraints: "SUBMITTED | ACCEPTED | NEEDS_REVISION" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at first submission; resubmission does not move it" }
      - { name: late, type: boolean, source: computed, description: "submitted_at strictly after the applicable due date" }
      - { name: revision_note, type: string, source: input, required: false, description: "Reviewer note recorded at REQUEST_REVISION" }

  - name: EmergencyIncident
    parent: null
    common_fields: true
    fields:
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id" }
      - { name: category, type: enum, source: input, description: "Emergency category", constraints: "MEDICAL | SECURITY | NATURAL_DISASTER | CIVIL_UNREST" }
      - { name: description, type: string, source: input, description: "Incident description" }
      - { name: status, type: enum, source: system, description: "Incident state", constraints: "OPEN | RESOLVED" }
      - { name: opened_at, type: datetime, source: system, description: "Logical clock at declaration" }
      - { name: resolved_at, type: datetime, source: system, required: false, description: "Logical clock at resolution" }
      - { name: outcome, type: enum, source: system, required: false, description: "Resolution outcome", constraints: "RESUME | TERMINATE" }
      - { name: suspension_days, type: integer, source: computed, required: false, description: "Whole days between opened_at and resolved_at (RESUME only)" }

  - name: AlumniProfile
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id" }
      - { name: grant_id, type: string, source: system, description: "FK -> Grant.id; grant whose completion/termination created this profile" }
      - { name: terminated_early, type: boolean, source: system, description: "True when the grant ended TERMINATED_EARLY" }
      - { name: compliance_strikes, type: integer, source: system, description: "Strike count copied from the grant at profile creation" }
      - { name: engagement_index_provisional, type: integer, source: computed, description: "Engagement index counting SUBMITTED and ACCEPTED reports (see calculations.alumni_engagement_index)" }
      - { name: engagement_index_certified, type: integer, source: computed, description: "Engagement index counting only ACCEPTED reports" }
      - { name: residency_status, type: enum, source: computed, description: "Live mirror of the linked ResidencyLedger status" }
      - { name: follow_on_eligible, type: enum, source: computed, description: "ELIGIBLE | INELIGIBLE per calculations.alumni_engagement_index", constraints: "ELIGIBLE | INELIGIBLE" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: CompetitionCycle
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /exchange/cycles/{id}/transition (action=OPEN)"
        actor: PlatformAdmin
        preconditions:
          - "At least one CountryProgram exists for this cycle (ERR_NO_COUNTRY_PROGRAMS)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /exchange/cycles/{id}/transition (action=CLOSE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: CLOSED
        to: SCREENING
        trigger: "POST /exchange/cycles/{id}/transition (action=BEGIN_SCREENING)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: SCREENING
        to: AWARDS_FINALIZED
        trigger: "POST /exchange/cycles/{id}/transition (action=FINALIZE_AWARDS)"
        actor: PlatformAdmin
        preconditions:
          - "No application of this cycle is in CAMPUS_REVIEW, NATIONAL_SCREENING or HOST_REVIEW (ERR_APPLICATIONS_PENDING)"
        side_effects:
          - "All DRAFT applications of this cycle -> WITHDRAWN"
          - "All ALTERNATE applications of this cycle -> NOT_SELECTED"
      - from: AWARDS_FINALIZED
        to: COMPLETED
        trigger: "POST /exchange/cycles/{id}/transition (action=COMPLETE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: Application
    initial_state: DRAFT
    terminal_states: [AWARDED, NOT_SELECTED, WITHDRAWN, DECLINED, PLACEMENT_FAILED]
    transitions:
      - from: DRAFT
        to: CAMPUS_REVIEW
        trigger: "POST /exchange/applications/{id}/transition (action=SUBMIT)"
        actor: Applicant
        preconditions:
          - "Applicant.applicant_type == ENROLLED_STUDENT (fork; INDEPENDENT takes DRAFT->NATIONAL_SCREENING)"
          - "CompetitionCycle.status == OPEN (ERR_CYCLE_NOT_OPEN)"
          - "logical clock <= cycle.application_deadline (ERR_DEADLINE_PASSED)"
          - "proposed_duration_months within country program [min_duration_months, max_duration_months] (ERR_DURATION_OUT_OF_RANGE)"
          - "no other application of the same applicant in the same cycle with status in {CAMPUS_REVIEW, NATIONAL_SCREENING, HOST_REVIEW, SELECTED, ALTERNATE, PLACEMENT, GRANT_PENDING, AWARDED} (ERR_DUPLICATE_APPLICATION)"
          - "is_follow_on == false, or latest AlumniProfile (by created_at) has follow_on_eligible == ELIGIBLE (ERR_FOLLOW_ON_INELIGIBLE)"
        side_effects:
          - "submitted_at = logical clock"
      - from: DRAFT
        to: NATIONAL_SCREENING
        trigger: "POST /exchange/applications/{id}/transition (action=SUBMIT)"
        actor: Applicant
        preconditions:
          - "Applicant.applicant_type == INDEPENDENT (fork; all other preconditions identical to DRAFT->CAMPUS_REVIEW)"
        side_effects:
          - "submitted_at = logical clock"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /exchange/applications/{id}/transition (action=WITHDRAW)"
        actor: Applicant
        preconditions: []
        side_effects: []
      - from: CAMPUS_REVIEW
        to: NATIONAL_SCREENING
        trigger: "POST /exchange/applications/{id}/transition (action=DECIDE, outcome=ENDORSE)"
        actor: CampusReviewer
        preconditions:
          - "cycle.status IN {OPEN, CLOSED, SCREENING} (ERR_CYCLE_PHASE_FORBIDS)"
          - "count of CAMPUS-stage ReviewScores >= CAMPUS_QUORUM (ERR_SCORE_QUORUM_NOT_MET)"
        side_effects: []
      - from: CAMPUS_REVIEW
        to: NOT_SELECTED
        trigger: "POST /exchange/applications/{id}/transition (action=DECIDE, outcome=REJECT)"
        actor: CampusReviewer
        preconditions:
          - "cycle.status IN {OPEN, CLOSED, SCREENING} (ERR_CYCLE_PHASE_FORBIDS)"
        side_effects: []
      - from: CAMPUS_REVIEW
        to: WITHDRAWN
        trigger: "POST /exchange/applications/{id}/transition (action=WITHDRAW)"
        actor: Applicant
        preconditions: []
        side_effects: []
      - from: NATIONAL_SCREENING
        to: HOST_REVIEW
        trigger: "POST /exchange/applications/{id}/transition (action=DECIDE, outcome=RECOMMEND)"
        actor: NationalReviewer
        preconditions:
          - "cycle.status IN {OPEN, CLOSED, SCREENING} (ERR_CYCLE_PHASE_FORBIDS)"
          - "count of NATIONAL-stage ReviewScores >= NATIONAL_QUORUM (ERR_SCORE_QUORUM_NOT_MET)"
          - "national_weighted_score >= RECOMMEND_SCORE_THRESHOLD and avg feasibility >= MIN_AVG_FEASIBILITY (ERR_SCORE_BELOW_THRESHOLD)"
          - "country language gate satisfied (ERR_LANGUAGE_CRITERION_UNMET)"
        side_effects:
          - "national_weighted_score computed and stored (calculations.weighted_screening_score)"
          - "recommend_seq = 1 + max(recommend_seq over applications with same country_program_id), starting at 1"
      - from: NATIONAL_SCREENING
        to: NOT_SELECTED
        trigger: "POST /exchange/applications/{id}/transition (action=DECIDE, outcome=REJECT)"
        actor: NationalReviewer
        preconditions:
          - "cycle.status IN {OPEN, CLOSED, SCREENING} (ERR_CYCLE_PHASE_FORBIDS)"
        side_effects: []
      - from: NATIONAL_SCREENING
        to: WITHDRAWN
        trigger: "POST /exchange/applications/{id}/transition (action=WITHDRAW)"
        actor: Applicant
        preconditions: []
        side_effects: []
      - from: HOST_REVIEW
        to: SELECTED
        trigger: "POST /exchange/applications/{id}/transition (action=DECIDE, outcome=SELECT)"
        actor: HostCommission
        preconditions:
          - "cycle.status IN {CLOSED, SCREENING} (ERR_CYCLE_PHASE_FORBIDS)"
          - "CountryProgram.slots_remaining >= 1 (ERR_COUNTRY_QUOTA_EXHAUSTED)"
        side_effects:
          - "CountryProgram.slots_remaining decremented (slot consumed; calculations.slot_accounting)"
          - "Grant created in PROVISIONAL with provisional_monthly_stipend_cents and provisional_total_cents (calculations.grant_award_terms provisional variant)"
      - from: HOST_REVIEW
        to: ALTERNATE
        trigger: "POST /exchange/applications/{id}/transition (action=DECIDE, outcome=ALTERNATE)"
        actor: HostCommission
        preconditions:
          - "cycle.status IN {CLOSED, SCREENING} (ERR_CYCLE_PHASE_FORBIDS)"
        side_effects: []
      - from: HOST_REVIEW
        to: NOT_SELECTED
        trigger: "POST /exchange/applications/{id}/transition (action=DECIDE, outcome=REJECT)"
        actor: HostCommission
        preconditions:
          - "cycle.status IN {CLOSED, SCREENING} (ERR_CYCLE_PHASE_FORBIDS)"
        side_effects: []
      - from: HOST_REVIEW
        to: WITHDRAWN
        trigger: "POST /exchange/applications/{id}/transition (action=WITHDRAW)"
        actor: Applicant
        preconditions: []
        side_effects: []
      - from: ALTERNATE
        to: SELECTED
        trigger: "system (slot release on DECLINE / PLACEMENT_FAILED cascade; calculations.alternate_auto_promotion)"
        actor: system
        preconditions:
          - "This application has the smallest recommend_seq among ALTERNATE applications of the same country_program_id"
        side_effects:
          - "CountryProgram.slots_remaining decremented (re-consumed)"
          - "Grant created in PROVISIONAL with provisional award fields"
      - from: ALTERNATE
        to: NOT_SELECTED
        trigger: "system (cycle FINALIZE_AWARDS) "
        actor: system
        preconditions: []
        side_effects: []
      - from: ALTERNATE
        to: WITHDRAWN
        trigger: "POST /exchange/applications/{id}/transition (action=WITHDRAW)"
        actor: Applicant
        preconditions: []
        side_effects: []
      - from: SELECTED
        to: PLACEMENT
        trigger: "system (first PlacementRound created for this application)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SELECTED
        to: DECLINED
        trigger: "POST /exchange/applications/{id}/transition (action=DECLINE)"
        actor: Applicant
        preconditions: []
        side_effects:
          - "CountryProgram.slots_remaining incremented (slot released)"
          - "calculations.alternate_auto_promotion runs for the freed slot"
      - from: PLACEMENT
        to: DECLINED
        trigger: "POST /exchange/applications/{id}/transition (action=DECLINE)"
        actor: Applicant
        preconditions: []
        side_effects:
          - "Any OFFERED PlacementRound of this application -> DECLINED"
          - "CountryProgram.slots_remaining incremented (slot released)"
          - "calculations.alternate_auto_promotion runs for the freed slot"
      - from: PLACEMENT
        to: PLACEMENT_FAILED
        trigger: "system (a PlacementRound reaches DECLINED or EXPIRED with round_number == MAX_PLACEMENT_ROUNDS)"
        actor: system
        preconditions: []
        side_effects:
          - "CountryProgram.slots_remaining incremented (slot released)"
          - "calculations.alternate_auto_promotion runs for the freed slot"
      - from: PLACEMENT
        to: GRANT_PENDING
        trigger: "system (a PlacementRound reaches ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GRANT_PENDING
        to: AWARDED
        trigger: "system (POST /exchange/applications/{id}/grant-confirmation succeeds)"
        actor: system
        preconditions: []
        side_effects: []
    note: "Branching fork at SUBMIT by applicant_type; ALTERNATE->SELECTED promotion loop; PLACEMENT negotiation can cycle through up to MAX_PLACEMENT_ROUNDS rounds."

  - entity: PlacementRound
    initial_state: OFFERED
    terminal_states: [ACCEPTED, DECLINED, EXPIRED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /exchange/placement-rounds/{id}/transition (action=ACCEPT)"
        actor: Applicant
        preconditions:
          - "Round is OFFERED (ERR_ROUND_NOT_OFFERED)"
          - "logical clock <= response_deadline (ERR_OFFER_EXPIRED)"
        side_effects:
          - "responded_at = logical clock"
          - "Application PLACEMENT -> GRANT_PENDING"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /exchange/placement-rounds/{id}/transition (action=DECLINE)"
        actor: Applicant
        preconditions:
          - "Round is OFFERED (ERR_ROUND_NOT_OFFERED)"
          - "logical clock <= response_deadline (ERR_OFFER_EXPIRED)"
        side_effects:
          - "responded_at = logical clock"
          - "If round_number == MAX_PLACEMENT_ROUNDS: Application PLACEMENT -> PLACEMENT_FAILED (slot release + auto-promotion cascade)"
      - from: OFFERED
        to: EXPIRED
        trigger: "POST /exchange/placement-rounds/{id}/transition (action=EXPIRE)"
        actor: ProgramOfficer
        preconditions:
          - "Round is OFFERED (ERR_ROUND_NOT_OFFERED)"
          - "logical clock > response_deadline (otherwise ERR_INVALID_STATE)"
        side_effects:
          - "If round_number == MAX_PLACEMENT_ROUNDS: Application PLACEMENT -> PLACEMENT_FAILED (slot release + auto-promotion cascade)"

  - entity: Grant
    initial_state: PROVISIONAL
    terminal_states: [COMPLETED, TERMINATED_EARLY]
    transitions:
      - from: PROVISIONAL
        to: CONFIRMED
        trigger: "POST /exchange/applications/{id}/grant-confirmation"
        actor: ProgramOfficer
        preconditions:
          - "Application.status == GRANT_PENDING (ERR_PLACEMENT_NOT_SECURED)"
          - "Grant is PROVISIONAL (ERR_INVALID_STATE)"
          - "duration_months(start_date, end_date) within country program [min_duration_months, max_duration_months] (ERR_DURATION_OUT_OF_RANGE)"
          - "start_date >= logical clock date (ERR_START_DATE_IN_PAST)"
          - "No other grant of the same applicant with status IN {CONFIRMED, ACTIVE, SUSPENDED} whose [start_date, end_date) half-open interval overlaps the requested one (ERR_GRANT_PERIOD_OVERLAP); adjacency (new start == existing end) is allowed"
        side_effects:
          - "awarded_band = ACCEPTED round's institution_band"
          - "duration_months, final_monthly_stipend_cents, final_total_cents computed (calculations.grant_award_terms final variant + calculations.dependent_allowance_cap)"
          - "Application GRANT_PENDING -> AWARDED"
      - from: CONFIRMED
        to: ACTIVE
        trigger: "POST /exchange/grants/{id}/transition (action=ACTIVATE)"
        actor: ProgramOfficer
        preconditions:
          - "orientation_completed_at is set (a VisaSponsorship has been issued) (ERR_ORIENTATION_INCOMPLETE)"
          - "logical clock >= start_date (ERR_START_DATE_NOT_REACHED)"
        side_effects:
          - "VisaSponsorship ISSUED -> ACTIVE"
          - "interim_report_due_date = add_months(start_date, INTERIM_REPORT_DUE_MONTHS)"
          - "final_report_due_date = end_date + FINAL_REPORT_DUE_DAYS days"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (EmergencyIncident declared)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (EmergencyIncident resolved with outcome=RESUME)"
        actor: system
        preconditions: []
        side_effects:
          - "end_date += incident suspension_days (calculations.suspension_extension); award amounts unchanged"
          - "final_report_due_date recomputed from the shifted end_date"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /exchange/grants/{id}/transition (action=COMPLETE)"
        actor: ProgramOfficer
        preconditions:
          - "logical clock >= end_date (ERR_END_DATE_NOT_REACHED)"
          - "a FINAL Report for this grant exists with status IN {SUBMITTED, ACCEPTED} (ERR_FINAL_REPORT_MISSING)"
        side_effects:
          - "VisaSponsorship ACTIVE -> COMPLETED"
          - "ResidencyLedger PENDING -> ACCRUING with accrual_start_date = end_date (only when subject_to_home_residency)"
          - "AlumniProfile created (terminated_early=false)"
      - from: ACTIVE
        to: TERMINATED_EARLY
        trigger: "POST /exchange/grants/{id}/transition (action=TERMINATE) or system (incident resolved with outcome=TERMINATE)"
        actor: ProgramOfficer
        preconditions:
          - "logical clock < end_date (otherwise use COMPLETE; ERR_INVALID_STATE)"
        side_effects:
          - "calculations.early_termination_reconciliation computes earned_cents, repayment_cents, reconciliation_adjustment_cents"
          - "VisaSponsorship ACTIVE -> ENDED_EARLY"
          - "ResidencyLedger PENDING -> ACCRUING with accrual_start_date = termination date (only when subject_to_home_residency)"
          - "AlumniProfile created (terminated_early=true)"
          - "Any OPEN EmergencyIncident of this grant -> RESOLVED with outcome=TERMINATE"
      - from: SUSPENDED
        to: TERMINATED_EARLY
        trigger: "POST /exchange/grants/{id}/transition (action=TERMINATE) or system (incident resolved with outcome=TERMINATE)"
        actor: ProgramOfficer
        preconditions:
          - "logical clock < end_date (ERR_INVALID_STATE)"
        side_effects:
          - "Same cascade as ACTIVE -> TERMINATED_EARLY"
    note: "ACTIVE <-> SUSPENDED cycle driven by emergency incidents; completion and early termination both cascade into visa, residency ledger and alumni profile."

  - entity: VisaSponsorship
    initial_state: ISSUED
    terminal_states: [COMPLETED, ENDED_EARLY]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "system (grant ACTIVATE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (grant COMPLETE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: ENDED_EARLY
        trigger: "system (grant TERMINATE)"
        actor: system
        preconditions: []
        side_effects: []
    note: "Created in ISSUED by POST /exchange/grants/{id}/visa-sponsorships; requires grant CONFIRMED, no existing sponsorship for the grant (ERR_DUPLICATE_VISA), orientation_completed_at <= logical clock (ERR_VALIDATION). Creation side effects: Grant.orientation_completed_at set; ResidencyLedger created (PENDING when subject_to_home_residency else NOT_REQUIRED)."

  - entity: ResidencyLedger
    initial_state: PENDING
    terminal_states: [FULFILLED, WAIVED, NOT_REQUIRED]
    transitions:
      - from: PENDING
        to: ACCRUING
        trigger: "system (grant COMPLETE or TERMINATE cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "accrual_start_date = grant end_date (completion) or termination date (early termination)"
      - from: ACCRUING
        to: FULFILLED
        trigger: "system (POST /exchange/residency-ledgers/{id}/stays pushes accrued_days >= required_days)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCRUING
        to: WAIVER_PENDING
        trigger: "POST /exchange/residency-ledgers/{id}/transition (action=REQUEST_WAIVER)"
        actor: Applicant
        preconditions: []
        side_effects:
          - "waiver_reason stored"
      - from: WAIVER_PENDING
        to: ACCRUING
        trigger: "POST /exchange/residency-ledgers/{id}/transition (action=DENY_WAIVER)"
        actor: ProgramOfficer
        preconditions: []
        side_effects: []
      - from: WAIVER_PENDING
        to: WAIVED
        trigger: "POST /exchange/residency-ledgers/{id}/transition (action=APPROVE_WAIVER)"
        actor: ProgramOfficer
        preconditions: []
        side_effects: []
    note: "Cyclic ACCRUING <-> WAIVER_PENDING loop; NOT_REQUIRED is the initial state when the visa is not subject to home residency."

  - entity: Report
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /exchange/reports/{id}/transition (action=ACCEPT)"
        actor: ProgramOfficer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: NEEDS_REVISION
        trigger: "POST /exchange/reports/{id}/transition (action=REQUEST_REVISION)"
        actor: ProgramOfficer
        preconditions: []
        side_effects:
          - "revision_note stored"
      - from: NEEDS_REVISION
        to: SUBMITTED
        trigger: "POST /exchange/reports/{id}/transition (action=RESUBMIT)"
        actor: Applicant
        preconditions: []
        side_effects:
          - "content replaced when supplied; submitted_at unchanged (lateness is fixed at first submission)"

  - entity: EmergencyIncident
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /exchange/incidents/{id}/resolve"
        actor: ProgramOfficer
        preconditions: []
        side_effects:
          - "resolved_at = logical clock; outcome = payload outcome"
          - "outcome=RESUME: suspension_days = whole days between opened_at and resolved_at; Grant SUSPENDED -> ACTIVE with end_date shift (calculations.suspension_extension)"
          - "outcome=TERMINATE: Grant SUSPENDED -> TERMINATED_EARLY full termination cascade"

# =============================================================================
# Concurrency Rules (OCC on parent entity version only)
# =============================================================================
concurrency_rules:
  - rule_id: application-patch-stale-version
    parent_entity: Application
    write_endpoint: "PATCH /exchange/applications/{id}"
    occ_field: expected_application_version
    description: |
      Updating a DRAFT application against an Application.version the client
      no longer holds is rejected. The client must pass the version it last
      observed; any mutation since (including cascaded version bumps from
      submit, decisions, or placement-round creation) makes the write stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: placement-round-create-stale-application
    parent_entity: Application
    write_endpoint: "POST /exchange/applications/{id}/placement-rounds"
    occ_field: expected_application_version
    description: |
      Opening a placement negotiation round against an Application whose
      version has advanced since the client last observed it is rejected.
      At most one non-terminal round may exist per application, so a stale
      writer's view of the negotiation position is superseded by the newer
      round or state the version bump records.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: slot_accounting
    trigger: "HOST_REVIEW->SELECTED decision, ALTERNATE->SELECTED auto-promotion, SELECTED/PLACEMENT->DECLINED, PLACEMENT->PLACEMENT_FAILED"
    algorithm: aggregation
    formula: |
      slots_remaining = slot_quota - count(applications with country_program_id == this program
                        AND status IN {SELECTED, PLACEMENT, GRANT_PENDING, AWARDED})
      INVARIANT (slot conservation): slot_quota == slots_remaining + consuming_count at all times.
      Selecting and later declining the same application leaves slots_remaining unchanged.
    input_set: "Applications of this CountryProgram in slot-consuming states {SELECTED, PLACEMENT, GRANT_PENDING, AWARDED}; ALTERNATE and all terminal-negative states consume nothing"
    constants:
      SLOT_CONSUMING_STATES: "SELECTED, PLACEMENT, GRANT_PENDING, AWARDED"
    precision: "integer"

  - name: weighted_screening_score
    trigger: "computed and stored on Application.national_weighted_score when the NATIONAL_QUORUM-th NATIONAL-stage score is posted; read and gated at DECIDE outcome=RECOMMEND"
    algorithm: weighted_scoring
    formula: |
      Let S = all NATIONAL-stage ReviewScores of the application (immutable; posted by distinct reviewers).
      Quorum: |S| >= NATIONAL_QUORUM.
      avg_f = round_half_up(mean of feasibility_score over S, 2)
      avg_c = round_half_up(mean of country_fit_score over S, 2)
      avg_l = round_half_up(mean of language_score over S, 2)
      national_weighted_score = round_half_up(WEIGHT_FEASIBILITY*avg_f + WEIGHT_COUNTRY_FIT*avg_c + WEIGHT_LANGUAGE*avg_l, 2)
      RECOMMEND requires: national_weighted_score >= RECOMMEND_SCORE_THRESHOLD (inclusive)
        AND avg_f >= MIN_AVG_FEASIBILITY (inclusive)
        AND language gate by CountryProgram.language_requirement:
          PROFICIENT -> avg_l >= LANGUAGE_GATE_PROFICIENT; BASIC -> avg_l >= LANGUAGE_GATE_BASIC; NONE -> no gate
    input_set: "All NATIONAL-stage ReviewScores of the application"
    constants:
      NATIONAL_QUORUM: 2
      CAMPUS_QUORUM: 2
      WEIGHT_FEASIBILITY: 0.40
      WEIGHT_COUNTRY_FIT: 0.35
      WEIGHT_LANGUAGE: 0.25
      RECOMMEND_SCORE_THRESHOLD: 70.00
      MIN_AVG_FEASIBILITY: 50
      LANGUAGE_GATE_PROFICIENT: 80
      LANGUAGE_GATE_BASIC: 60
    precision: "2 decimal places, round_half_up"

  - name: grant_award_terms
    trigger: "provisional variant at HOST_REVIEW->SELECTED (grant creation); final variant at grant-confirmation"
    algorithm: tiered_pricing
    formula: |
      PROVISIONAL variant (at selection; placement band not yet known):
        p_monthly = CountryProgram.monthly_stipend_standard_cents   (always STANDARD band)
        dep_monthly = dependent_allowance_monthly_cents * min(Application.dependents_count, DEPENDENT_CAP)
        provisional_monthly_stipend_cents = p_monthly
        provisional_total_cents = (p_monthly + dep_monthly + health_benefit_monthly_cents) * Application.proposed_duration_months
                                  + travel_allowance_cents
        (provisional variant applies NO dependent cap; duration is the requested proposed_duration_months)
      FINAL variant (at confirmation):
        f_monthly = monthly_stipend_high_cents when awarded_band == HIGH else monthly_stipend_standard_cents
        duration_months = (end.year - start.year)*12 + (end.month - start.month)   (whole calendar months; days ignored)
        base_total = (f_monthly + health_benefit_monthly_cents) * duration_months + travel_allowance_cents
        dep_final = dependent_allowance_cap(base_total, dep_raw)   (see calculations.dependent_allowance_cap)
        final_monthly_stipend_cents = f_monthly
        final_total_cents = base_total + dep_final
      The two variants diverge on identical application data whenever the accepted band is HIGH
      or the dependent cap binds, because provisional pins STANDARD band and skips the cap.
    input_set: "The Application, its CountryProgram, and (final variant) the ACCEPTED PlacementRound"
    constants:
      DEPENDENT_CAP: 2
    precision: "integer cents"
    variants:
      - name: provisional
        when: "grant creation at SELECTED"
        difference: "STANDARD band stipend; proposed_duration_months; dependent allowance NOT capped"
      - name: final
        when: "grant-confirmation after placement acceptance"
        difference: "awarded band stipend; confirmed duration_months; dependent allowance capped by calculations.dependent_allowance_cap"

  - name: dependent_allowance_cap
    trigger: "inside grant_award_terms final variant"
    algorithm: constraint_propagation
    formula: |
      dep_raw = dependent_allowance_monthly_cents * min(Application.dependents_count, DEPENDENT_CAP) * duration_months
      EVALUATION ORDER IS PINNED (the cap is keyed on a total that excludes the dependent allowance):
        (1) base_total = (f_monthly + health_benefit_monthly_cents) * duration_months + travel_allowance_cents
        (2) dep_cap  = round_half_up(DEP_CAP_PCT_OF_BASE * base_total)   (integer cents)
        (3) dep_final = min(dep_raw, dep_cap)
        (4) final_total_cents = base_total + dep_final
      Computing the cap against (base_total + dep_raw) instead of base_total is a different, wrong number.
    input_set: "The confirming Grant, its Application and CountryProgram"
    constants:
      DEPENDENT_CAP: 2
      DEP_CAP_PCT_OF_BASE: 0.25
    precision: "integer cents, round_half_up"

  - name: early_termination_reconciliation
    trigger: "Grant ACTIVE/SUSPENDED -> TERMINATED_EARLY"
    algorithm: chronological
    formula: |
      termination_date = logical clock date at TERMINATE
      served_months = floor(whole days between start_date and termination_date / DAYS_PER_MONTH)
      unserved_months = duration_months - served_months   (>= 1 because termination requires clock < end_date)
      ROUNDING ORDER IS PINNED — round per month FIRST, then multiply:
        monthly_rate = round_half_up(final_total_cents / duration_months)        (integer cents)
        repayment_cents = unserved_months * monthly_rate
        earned_cents    = served_months * monthly_rate
        reconciliation_adjustment_cents = final_total_cents - earned_cents - repayment_cents
      INVARIANT (award conservation): earned_cents + repayment_cents + reconciliation_adjustment_cents == final_total_cents.
      The adjustment absorbs the per-month rounding remainder and may be negative, zero, or positive.
      (Summing first and rounding once would give a different cent value and is wrong.)
    input_set: "The terminating Grant"
    constants:
      DAYS_PER_MONTH: 30
    precision: "integer cents, round_half_up"

  - name: residency_accrual
    trigger: "POST /exchange/residency-ledgers/{id}/stays"
    algorithm: chronological
    formula: |
      For a stay [start_date, end_date]: day_count = (end_date - start_date).days + 1   (BOTH endpoints inclusive)
      Stays on one ledger are closed intervals: a new stay overlaps an existing one unless
      new.end < existing.start OR new.start > existing.end — touching endpoints (new.start == existing.end)
      count as overlap (ERR_STAY_OVERLAP), because a calendar day cannot be counted twice.
      accrued_days = sum of day_count over all recorded stays.
      When accrued_days >= required_days after appending a stay: ledger ACCRUING -> FULFILLED (inclusive boundary).
    input_set: "All stays recorded on the ledger, in arrival order"
    constants:
      RESIDENCY_REQUIRED_DAYS: 730
    precision: "integer days"

  - name: report_lateness
    trigger: "POST /exchange/grants/{id}/reports"
    algorithm: threshold
    formula: |
      INTERIM due date = grant.interim_report_due_date; FINAL due date = grant.final_report_due_date.
      late = (submitted_at > due_date)   — STRICTLY greater; submission exactly at the due instant is on time.
      A late report increments Grant.compliance_strikes by 1 at submission (once; resubmission never re-strikes).
    input_set: "The created Report and its Grant"
    constants:
      INTERIM_REPORT_DUE_MONTHS: 4
      FINAL_REPORT_DUE_DAYS: 30
      MAX_COMPLIANCE_STRIKES: 2
    precision: "ISO8601 instant comparison"

  - name: suspension_extension
    trigger: "EmergencyIncident resolved with outcome=RESUME"
    algorithm: aggregation
    formula: |
      suspension_days = (resolved_at.date - opened_at.date).days
      Grant.end_date += suspension_days days
      Grant.final_report_due_date = end_date + FINAL_REPORT_DUE_DAYS days   (recomputed)
      Grant.suspension_days_total += suspension_days
      interim_report_due_date and all award amounts are UNCHANGED by suspension.
    input_set: "The resolving incident and its grant"
    constants:
      FINAL_REPORT_DUE_DAYS: 30
    precision: "whole days"

  - name: alumni_engagement_index
    trigger: "recomputed on every read of an AlumniProfile"
    algorithm: aggregation
    formula: |
      PROVISIONAL variant: counts reports in {SUBMITTED, ACCEPTED}:
        engagement_index_provisional = clamp(ENGAGEMENT_BASE_POINTS
          + REPORT_ACCEPT_POINTS * count(reports of the grant with status IN {SUBMITTED, ACCEPTED})
          - STRIKE_PENALTY_POINTS * compliance_strikes, 0, 100)
      CERTIFIED variant: counts only ACCEPTED reports:
        engagement_index_certified = clamp(ENGAGEMENT_BASE_POINTS
          + REPORT_ACCEPT_POINTS * count(reports of the grant with status == ACCEPTED)
          - STRIKE_PENALTY_POINTS * compliance_strikes, 0, 100)
      The variants diverge whenever a report sits in SUBMITTED or NEEDS_REVISION.
      follow_on_eligible = ELIGIBLE iff terminated_early == false
        AND compliance_strikes < MAX_COMPLIANCE_STRIKES
        AND residency_status IN {FULFILLED, WAIVED, NOT_REQUIRED}; otherwise INELIGIBLE.
      residency_status mirrors the linked ResidencyLedger status live.
    input_set: "The AlumniProfile's grant reports, strikes, termination flag, and linked ResidencyLedger"
    constants:
      ENGAGEMENT_BASE_POINTS: 50
      REPORT_ACCEPT_POINTS: 10
      STRIKE_PENALTY_POINTS: 20
      MAX_COMPLIANCE_STRIKES: 2
    precision: "integer points"
    variants:
      - name: provisional
        when: "default surface shown to the grantee"
        difference: "SUBMITTED reports count as engagements"
      - name: certified
        when: "eligibility decisions (follow_on_eligible, program office view)"
        difference: "only ACCEPTED reports count"

  - name: alternate_auto_promotion
    trigger: "any slot release (SELECTED/PLACEMENT -> DECLINED, or PLACEMENT -> PLACEMENT_FAILED)"
    algorithm: constraint_propagation
    formula: |
      Eligibility filter: applications with country_program_id == the freed slot's program AND status == ALTERNATE.
      Ranking: recommend_seq ASC (lowest first; recommend_seq is unique per program, so no tie-break is ever needed;
        a second-level fallback, if ever required, is created_at ASC — never id).
      Fallback: empty candidate set -> no promotion; slots_remaining stays incremented.
      Effect: exactly one promotion per released slot; the promoted application -> SELECTED with a new PROVISIONAL Grant.
    input_set: "ALTERNATE applications of the freed slot's CountryProgram"
    constants:
      MAX_PLACEMENT_ROUNDS: 3
    precision: "n/a"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Role is in the endpoint's roles; for action endpoints the role must match the action family: SUBMIT/WITHDRAW/DECLINE -> Applicant; DECIDE -> the reviewer family {CampusReviewer, NationalReviewer, HostCommission}; EXPIRE -> ProgramOfficer; ACCEPT/REQUEST_REVISION -> ProgramOfficer; RESUBMIT -> Applicant; REQUEST_WAIVER -> Applicant; APPROVE/DENY_WAIVER -> ProgramOfficer. Score POSTing is additionally stage-bound at this priority: CampusReviewer may score only while the application is CAMPUS_REVIEW, NationalReviewer only while NATIONAL_SCREENING (violation -> ERR_UNAUTHORIZED). For DECIDE transitions the stage-specific reviewer binding is enforced WITH the state machine at priority 6: a DECIDE by a reviewer whose stage does not match the current state is an invalid transition (ERR_INVALID_STATE), not an authz failure.", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "cycle_id in path exists", error_id: ERR_CYCLE_NOT_FOUND, http_status: 404, applies_to: "paths containing {id}" }
  - { priority: 3, category: existence, check: "program_id in path exists", error_id: ERR_COUNTRY_PROGRAM_NOT_FOUND, http_status: 404, applies_to: "paths containing {id}" }
  - { priority: 3, category: existence, check: "applicant_id in path exists", error_id: ERR_APPLICANT_NOT_FOUND, http_status: 404, applies_to: "paths containing {id}" }
  - { priority: 3, category: existence, check: "application_id in path exists", error_id: ERR_APPLICATION_NOT_FOUND, http_status: 404, applies_to: "paths containing {id}" }
  - { priority: 3, category: existence, check: "round_id in path exists", error_id: ERR_ROUND_NOT_FOUND, http_status: 404, applies_to: "paths containing {id}" }
  - { priority: 3, category: existence, check: "grant_id in path exists", error_id: ERR_GRANT_NOT_FOUND, http_status: 404, applies_to: "paths containing {id}" }
  - { priority: 3, category: existence, check: "visa_id in path exists", error_id: ERR_VISA_NOT_FOUND, http_status: 404, applies_to: "paths containing {id}" }
  - { priority: 3, category: existence, check: "ledger_id in path exists", error_id: ERR_LEDGER_NOT_FOUND, http_status: 404, applies_to: "paths containing {id}" }
  - { priority: 3, category: existence, check: "report_id in path exists", error_id: ERR_REPORT_NOT_FOUND, http_status: 404, applies_to: "paths containing {id}" }
  - { priority: 3, category: existence, check: "incident_id in path exists", error_id: ERR_INCIDENT_NOT_FOUND, http_status: 404, applies_to: "paths containing {id}" }
  - { priority: 4, category: existence, check: "expected_application_version in the request body equals the Application's current version (OCC)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /exchange/applications/{id}; POST /exchange/applications/{id}/placement-rounds" }
  - { priority: 5, category: auth, check: "For Applicant-role calls, X-User-ID equals the owning applicant id (application.applicant_id; grant/report/ledger reach the applicant through their FK chain)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "Applicant-role calls on application/placement-round/grant/report/residency-ledger resources" }
  - { priority: 6, category: state, check: "Target entity is in a state from which the requested transition exists; unknown action or outcome for the endpoint is ERR_VALIDATION instead", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition/action endpoints" }
  - { priority: 6, category: state, check: "PlacementRound must be OFFERED to be accepted/declined/expired", error_id: ERR_ROUND_NOT_OFFERED, http_status: 409, applies_to: "POST /exchange/placement-rounds/{id}/transition" }
  - { priority: 6, category: state, check: "ResidencyLedger must be ACCRUING to record stays or request a waiver", error_id: ERR_RESIDENCY_NOT_ACCRUING, http_status: 409, applies_to: "POST /exchange/residency-ledgers/{id}/stays; REQUEST_WAIVER" }
  - { priority: 7, category: business_safety, check: "Pre-departure orientation completed (Grant.orientation_completed_at set) before activation", error_id: ERR_ORIENTATION_INCOMPLETE, http_status: 409, applies_to: "POST /exchange/grants/{id}/transition (ACTIVATE)" }
  - { priority: 8, category: business_temporal, check: "logical clock <= cycle.application_deadline at SUBMIT (deadline inclusive)", error_id: ERR_DEADLINE_PASSED, http_status: 409, applies_to: "Application SUBMIT" }
  - { priority: 8, category: business_temporal, check: "start_date >= logical clock date at grant-confirmation", error_id: ERR_START_DATE_IN_PAST, http_status: 409, applies_to: "POST /exchange/applications/{id}/grant-confirmation" }
  - { priority: 8, category: business_temporal, check: "logical clock >= grant.start_date at ACTIVATE", error_id: ERR_START_DATE_NOT_REACHED, http_status: 409, applies_to: "POST /exchange/grants/{id}/transition (ACTIVATE)" }
  - { priority: 8, category: business_temporal, check: "logical clock >= grant.end_date at COMPLETE", error_id: ERR_END_DATE_NOT_REACHED, http_status: 409, applies_to: "POST /exchange/grants/{id}/transition (COMPLETE)" }
  - { priority: 8, category: business_temporal, check: "logical clock <= response_deadline when an Applicant responds to an offer (deadline inclusive)", error_id: ERR_OFFER_EXPIRED, http_status: 409, applies_to: "POST /exchange/placement-rounds/{id}/transition (ACCEPT/DECLINE)" }
  - { priority: 8, category: business_temporal, check: "FINAL report creatable only when logical clock >= grant.end_date (or grant already COMPLETED/TERMINATED_EARLY)", error_id: ERR_REPORT_WINDOW_INVALID, http_status: 409, applies_to: "POST /exchange/grants/{id}/reports (FINAL)" }
  - { priority: 8, category: business_temporal, check: "stay.start_date >= ledger.accrual_start_date", error_id: ERR_STAY_BEFORE_ACCRUAL_START, http_status: 409, applies_to: "POST /exchange/residency-ledgers/{id}/stays" }
  - { priority: 9, category: business_constraint, check: "Required fields present, enum members valid, scores within 0-100, end_date after start_date, stay end_date >= start_date, orientation_completed_at not in the future, no unknown request fields, country_program_id belongs to cycle_id", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all endpoints" }
  - { priority: 9, category: business_constraint, check: "DECIDE outcome is valid for the current stage (ENDORSE/REJECT in CAMPUS_REVIEW; RECOMMEND/REJECT in NATIONAL_SCREENING; SELECT/ALTERNATE/REJECT in HOST_REVIEW)", error_id: ERR_INVALID_OUTCOME, http_status: 400, applies_to: "Application DECIDE" }
  - { priority: 9, category: business_constraint, check: "proposed_duration_months / confirmed duration_months within country program [min_duration_months, max_duration_months]", error_id: ERR_DURATION_OUT_OF_RANGE, http_status: 422, applies_to: "Application create/SUBMIT; grant-confirmation" }
  - { priority: 9, category: business_constraint, check: "Applicant email unique", error_id: ERR_DUPLICATE_EMAIL, http_status: 409, applies_to: "POST /exchange/applicants" }
  - { priority: 9, category: business_constraint, check: "No second submitted-or-later non-terminal application for the same applicant in the same cycle", error_id: ERR_DUPLICATE_APPLICATION, http_status: 409, applies_to: "Application SUBMIT" }
  - { priority: 9, category: business_constraint, check: "One score per (application, stage, reviewer_id)", error_id: ERR_DUPLICATE_SCORE, http_status: 409, applies_to: "POST /exchange/applications/{id}/scores" }
  - { priority: 9, category: business_constraint, check: "One VisaSponsorship per grant", error_id: ERR_DUPLICATE_VISA, http_status: 409, applies_to: "POST /exchange/grants/{id}/visa-sponsorships" }
  - { priority: 9, category: business_constraint, check: "One report per (grant, report_type)", error_id: ERR_DUPLICATE_REPORT, http_status: 409, applies_to: "POST /exchange/grants/{id}/reports" }
  - { priority: 9, category: business_constraint, check: "At most one non-terminal (OFFERED) PlacementRound per application", error_id: ERR_ACTIVE_ROUND_EXISTS, http_status: 409, applies_to: "POST /exchange/applications/{id}/placement-rounds" }
  - { priority: 9, category: business_constraint, check: "At most one OPEN EmergencyIncident per grant", error_id: ERR_ACTIVE_INCIDENT_EXISTS, http_status: 409, applies_to: "POST /exchange/grants/{id}/incidents" }
  - { priority: 9, category: business_constraint, check: "Stage quorum met (CAMPUS_QUORUM campus scores to ENDORSE; NATIONAL_QUORUM national scores to RECOMMEND)", error_id: ERR_SCORE_QUORUM_NOT_MET, http_status: 409, applies_to: "Application DECIDE (ENDORSE/RECOMMEND)" }
  - { priority: 9, category: business_constraint, check: "national_weighted_score >= RECOMMEND_SCORE_THRESHOLD and avg feasibility >= MIN_AVG_FEASIBILITY", error_id: ERR_SCORE_BELOW_THRESHOLD, http_status: 409, applies_to: "Application DECIDE (RECOMMEND)" }
  - { priority: 9, category: business_constraint, check: "Country language gate satisfied for RECOMMEND", error_id: ERR_LANGUAGE_CRITERION_UNMET, http_status: 409, applies_to: "Application DECIDE (RECOMMEND)" }
  - { priority: 9, category: business_constraint, check: "New stay does not closed-interval-overlap an existing stay on the ledger (touching endpoints overlap)", error_id: ERR_STAY_OVERLAP, http_status: 409, applies_to: "POST /exchange/residency-ledgers/{id}/stays" }
  - { priority: 9, category: business_constraint, check: "Confirmed grant period [start_date, end_date) does not half-open-overlap another CONFIRMED/ACTIVE/SUSPENDED grant of the same applicant (adjacency allowed)", error_id: ERR_GRANT_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /exchange/applications/{id}/grant-confirmation" }
  - { priority: 9, category: business_constraint, check: "A FINAL report in {SUBMITTED, ACCEPTED} exists before completion", error_id: ERR_FINAL_REPORT_MISSING, http_status: 409, applies_to: "POST /exchange/grants/{id}/transition (COMPLETE)" }
  - { priority: 9, category: business_constraint, check: "is_follow_on application requires the applicant's latest AlumniProfile (by created_at) to have follow_on_eligible == ELIGIBLE", error_id: ERR_FOLLOW_ON_INELIGIBLE, http_status: 409, applies_to: "Application create with is_follow_on=true" }
  - { priority: 9, category: business_constraint, check: "Cycle OPEN requires at least one CountryProgram", error_id: ERR_NO_COUNTRY_PROGRAMS, http_status: 409, applies_to: "Cycle transition OPEN" }
  - { priority: 9, category: business_constraint, check: "FINALIZE_AWARDS requires no applications in CAMPUS_REVIEW, NATIONAL_SCREENING or HOST_REVIEW", error_id: ERR_APPLICATIONS_PENDING, http_status: 409, applies_to: "Cycle transition FINALIZE_AWARDS" }
  - { priority: 10, category: business_referential, check: "Cycle OPEN for application create and SUBMIT", error_id: ERR_CYCLE_NOT_OPEN, http_status: 409, applies_to: "POST /exchange/applications; Application SUBMIT" }
  - { priority: 10, category: business_referential, check: "Cycle phase permits the operation (campus/national decisions in {OPEN, CLOSED, SCREENING}; host decisions in {CLOSED, SCREENING}; CountryProgram PATCH only while cycle DRAFT)", error_id: ERR_CYCLE_PHASE_FORBIDS, http_status: 409, applies_to: "Application DECIDE; PATCH /exchange/country-programs/{id}" }
  - { priority: 10, category: business_referential, check: "Grant CONFIRMED before visa sponsorship issuance", error_id: ERR_GRANT_NOT_CONFIRMED, http_status: 409, applies_to: "POST /exchange/grants/{id}/visa-sponsorships" }
  - { priority: 10, category: business_referential, check: "Application GRANT_PENDING (an ACCEPTED placement round exists) before grant-confirmation", error_id: ERR_PLACEMENT_NOT_SECURED, http_status: 409, applies_to: "POST /exchange/applications/{id}/grant-confirmation" }
  - { priority: 10, category: business_referential, check: "Grant ACTIVE or SUSPENDED for report submission; Grant ACTIVE for incident declaration", error_id: ERR_GRANT_NOT_ACTIVE, http_status: 409, applies_to: "POST /exchange/grants/{id}/reports; POST /exchange/grants/{id}/incidents" }
  - { priority: 11, category: business_fiscal, check: "CountryProgram.slots_remaining >= 1 to SELECT", error_id: ERR_COUNTRY_QUOTA_EXHAUSTED, http_status: 409, applies_to: "Application DECIDE (SELECT)" }


# =============================================================================
# Table 5: API Endpoint Table (39 endpoints)
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any call) is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced; no entity mutation"]

  # --- CompetitionCycle ---
  - method: POST
    path: "/exchange/cycles"
    description: "Create a competition cycle"
    roles: [PlatformAdmin]
    code: 201
    input: [academic_year, application_deadline]
    output: CompetitionCycle
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/exchange/cycles/{id}"
    description: "Get a competition cycle"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, NationalReviewer, CampusReviewer, Applicant]
    code: 200
    input: []
    output: CompetitionCycle
    side_effects: []
  - method: POST
    path: "/exchange/cycles/{id}/transition"
    description: "Advance cycle phase (OPEN, CLOSE, BEGIN_SCREENING, FINALIZE_AWARDS, COMPLETE)"
    roles: [PlatformAdmin]
    code: 200
    input: [action]
    output: CompetitionCycle
    side_effects: ["per CompetitionCycle state machine; FINALIZE_AWARDS sweeps DRAFT->WITHDRAWN and ALTERNATE->NOT_SELECTED"]

  # --- CountryProgram ---
  - method: POST
    path: "/exchange/cycles/{id}/country-programs"
    description: "Create a host-country program offering for a cycle"
    roles: [PlatformAdmin]
    code: 201
    input: [country_code, slot_quota, min_duration_months, max_duration_months, monthly_stipend_standard_cents, monthly_stipend_high_cents, dependent_allowance_monthly_cents, travel_allowance_cents, health_benefit_monthly_cents, language_requirement]
    output: CountryProgram
    side_effects: ["slots_remaining = slot_quota"]
  - method: GET
    path: "/exchange/country-programs/{id}"
    description: "Get a country program"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, NationalReviewer, CampusReviewer, Applicant]
    code: 200
    input: []
    output: CountryProgram
    side_effects: []
  - method: GET
    path: "/exchange/cycles/{id}/country-programs"
    description: "List country programs of a cycle"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, NationalReviewer, CampusReviewer, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: CountryProgram[]
    side_effects: []
  - method: PATCH
    path: "/exchange/country-programs/{id}"
    description: "Update a country program's quota/allowances while its cycle is DRAFT"
    roles: [PlatformAdmin]
    code: 200
    input: ["slot_quota?", "min_duration_months?", "max_duration_months?", "monthly_stipend_standard_cents?", "monthly_stipend_high_cents?", "dependent_allowance_monthly_cents?", "travel_allowance_cents?", "health_benefit_monthly_cents?", "language_requirement?"]
    output: CountryProgram
    side_effects: ["slots_remaining recomputed; increments CountryProgram.version by 1"]

  # --- Applicant ---
  - method: POST
    path: "/exchange/applicants"
    description: "Register an applicant"
    roles: [Anonymous]
    code: 201
    input: [full_name, email, applicant_type, "home_institution_name?", citizenship_country_code]
    output: Applicant
    side_effects: []
  - method: GET
    path: "/exchange/applicants/{id}"
    description: "Get an applicant (Applicant role: own record only)"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, NationalReviewer, CampusReviewer, Applicant]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # --- Application ---
  - method: POST
    path: "/exchange/applications"
    description: "Create a DRAFT application (cycle must be OPEN)"
    roles: [Applicant]
    code: 201
    input: [applicant_id, cycle_id, country_program_id, project_title, project_summary, proposed_duration_months, "dependents_count?", "is_follow_on?"]
    output: Application
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/exchange/applications/{id}"
    description: "Get an application (Applicant role: own only)"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, NationalReviewer, CampusReviewer, Applicant]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/exchange/applications"
    description: "List applications with filters"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, NationalReviewer, CampusReviewer, Applicant]
    code: 200
    input: ["cycle_id?", "country_program_id?", "applicant_id?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: PATCH
    path: "/exchange/applications/{id}"
    description: "Update a DRAFT application's fields (OCC on Application.version)"
    roles: [Applicant]
    code: 200
    input: ["project_title?", "project_summary?", "proposed_duration_months?", "dependents_count?", expected_application_version]
    output: Application
    side_effects: ["increments Application.version by 1"]
  - method: POST
    path: "/exchange/applications/{id}/transition"
    description: "Application lifecycle action (SUBMIT, WITHDRAW, DECLINE by Applicant; DECIDE with outcome by stage reviewer role)"
    roles: [Applicant, CampusReviewer, NationalReviewer, HostCommission]
    code: 200
    input: [action, "outcome?", "rationale?"]
    output: Application
    side_effects: ["per Application state machine; SELECT/promotion creates PROVISIONAL Grant and recomputes slots_remaining; increments Application.version by 1"]
  - method: POST
    path: "/exchange/applications/{id}/scores"
    description: "Post a review score; stage derived from application status (CAMPUS_REVIEW -> CampusReviewer, NATIONAL_SCREENING -> NationalReviewer)"
    roles: [CampusReviewer, NationalReviewer]
    code: 201
    input: [feasibility_score, country_fit_score, language_score, "comment?"]
    output: ReviewScore
    side_effects: ["stage derived from application status; one score per (application, stage, reviewer_id); when the NATIONAL_QUORUM-th NATIONAL score is posted, Application.national_weighted_score is computed and stored (calculations.weighted_screening_score)"]
  - method: GET
    path: "/exchange/applications/{id}/scores"
    description: "List review scores of an application"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, NationalReviewer, CampusReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: ReviewScore[]
    side_effects: []

  # --- PlacementRound ---
  - method: POST
    path: "/exchange/applications/{id}/placement-rounds"
    description: "Open a placement negotiation round with a receiving institution (OCC on Application.version)"
    roles: [HostCommission]
    code: 201
    input: [institution_name, institution_band, response_deadline, expected_application_version]
    output: PlacementRound
    side_effects: ["round_number = placement_rounds_used + 1; placement_rounds_used += 1; first round moves Application SELECTED -> PLACEMENT; increments Application.version by 1"]
  - method: GET
    path: "/exchange/applications/{id}/placement-rounds"
    description: "List placement rounds of an application"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: PlacementRound[]
    side_effects: []
  - method: POST
    path: "/exchange/placement-rounds/{id}/transition"
    description: "Respond to or expire an offer (ACCEPT, DECLINE by owning Applicant; EXPIRE by ProgramOfficer)"
    roles: [Applicant, ProgramOfficer]
    code: 200
    input: [action]
    output: PlacementRound
    side_effects: ["per PlacementRound state machine; ACCEPT moves Application PLACEMENT -> GRANT_PENDING; terminal 3rd round triggers PLACEMENT_FAILED cascade"]

  # --- Grant ---
  - method: GET
    path: "/exchange/applications/{id}/grants"
    description: "List the grant of an application (0 or 1 entries)"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, Applicant]
    code: 200
    input: []
    output: Grant[]
    side_effects: []
  - method: POST
    path: "/exchange/applications/{id}/grant-confirmation"
    description: "Confirm final grant terms after an accepted placement (final award computation)"
    roles: [ProgramOfficer]
    code: 200
    input: [start_date, end_date]
    output: Grant
    side_effects: ["Grant PROVISIONAL -> CONFIRMED; awarded_band/duration_months/final award computed; Application GRANT_PENDING -> AWARDED"]
  - method: GET
    path: "/exchange/grants/{id}"
    description: "Get a grant"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, Applicant]
    code: 200
    input: []
    output: Grant
    side_effects: []
  - method: POST
    path: "/exchange/grants/{id}/transition"
    description: "Grant lifecycle action (ACTIVATE, COMPLETE, TERMINATE)"
    roles: [ProgramOfficer]
    code: 200
    input: [action, "termination_reason?"]
    output: Grant
    side_effects: ["per Grant state machine; ACTIVATE sets report due dates and activates visa; COMPLETE/TERMINATE cascade to visa, residency ledger, alumni profile"]

  # --- VisaSponsorship / ResidencyLedger ---
  - method: POST
    path: "/exchange/grants/{id}/visa-sponsorships"
    description: "Issue exchange visitor visa sponsorship for a CONFIRMED grant"
    roles: [ProgramOfficer]
    code: 201
    input: [subject_to_home_residency, orientation_completed_at]
    output: VisaSponsorship
    side_effects: ["sponsor_program_number assigned; Grant.orientation_completed_at set; ResidencyLedger created (PENDING if subject else NOT_REQUIRED)"]
  - method: GET
    path: "/exchange/visa-sponsorships/{id}"
    description: "Get a visa sponsorship"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, Applicant]
    code: 200
    input: []
    output: VisaSponsorship
    side_effects: []
  - method: GET
    path: "/exchange/grants/{id}/visa-sponsorships"
    description: "List visa sponsorships of a grant (0 or 1 entries)"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, Applicant]
    code: 200
    input: []
    output: VisaSponsorship[]
    side_effects: []
  - method: GET
    path: "/exchange/visa-sponsorships/{id}/residency-ledgers"
    description: "List the residency ledger of a sponsorship (0 or 1 entries)"
    roles: [PlatformAdmin, ProgramOfficer, Applicant]
    code: 200
    input: []
    output: ResidencyLedger[]
    side_effects: []
  - method: GET
    path: "/exchange/residency-ledgers/{id}"
    description: "Get a residency ledger"
    roles: [PlatformAdmin, ProgramOfficer, Applicant]
    code: 200
    input: []
    output: ResidencyLedger
    side_effects: []
  - method: POST
    path: "/exchange/residency-ledgers/{id}/stays"
    description: "Record a home-country stay; accrues days and may fulfill the two-year requirement"
    roles: [Applicant]
    code: 201
    input: [start_date, end_date]
    output: ResidencyLedger
    side_effects: ["stay appended (day_count inclusive); accrued_days recomputed; ACCRUING -> FULFILLED at >= required_days"]
  - method: POST
    path: "/exchange/residency-ledgers/{id}/transition"
    description: "Residency waiver actions (REQUEST_WAIVER by owning Applicant; APPROVE_WAIVER, DENY_WAIVER by ProgramOfficer)"
    roles: [Applicant, ProgramOfficer]
    code: 200
    input: [action, "waiver_reason?"]
    output: ResidencyLedger
    side_effects: ["per ResidencyLedger state machine"]

  # --- Report ---
  - method: POST
    path: "/exchange/grants/{id}/reports"
    description: "Submit an INTERIM or FINAL report for a grant"
    roles: [Applicant]
    code: 201
    input: [report_type, content]
    output: Report
    side_effects: ["status=SUBMITTED; submitted_at=logical clock; late flag per calculations.report_lateness; late submission increments Grant.compliance_strikes"]
  - method: GET
    path: "/exchange/grants/{id}/reports"
    description: "List reports of a grant"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, Applicant]
    code: 200
    input: ["report_type?", "limit?", "offset?"]
    output: Report[]
    side_effects: []
  - method: POST
    path: "/exchange/reports/{id}/transition"
    description: "Review a report (ACCEPT, REQUEST_REVISION by ProgramOfficer; RESUBMIT by owning Applicant)"
    roles: [ProgramOfficer, Applicant]
    code: 200
    input: [action, "revision_note?", "content?"]
    output: Report
    side_effects: ["per Report state machine"]

  # --- EmergencyIncident ---
  - method: POST
    path: "/exchange/grants/{id}/incidents"
    description: "Declare an in-country emergency incident on an ACTIVE grant"
    roles: [ProgramOfficer]
    code: 201
    input: [category, description]
    output: EmergencyIncident
    side_effects: ["status=OPEN; opened_at=logical clock; Grant ACTIVE -> SUSPENDED"]
  - method: GET
    path: "/exchange/grants/{id}/incidents"
    description: "List incidents of a grant"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: EmergencyIncident[]
    side_effects: []
  - method: POST
    path: "/exchange/incidents/{id}/resolve"
    description: "Resolve an OPEN incident (outcome RESUME resumes the grant with end_date shift; TERMINATE runs early-termination cascade)"
    roles: [ProgramOfficer]
    code: 200
    input: [outcome]
    output: EmergencyIncident
    side_effects: ["per EmergencyIncident state machine and calculations.suspension_extension / early_termination_reconciliation"]

  # --- AlumniProfile ---
  - method: GET
    path: "/exchange/applicants/{id}/alumni-profiles"
    description: "List alumni profiles of an applicant (engagement indices and follow-on eligibility recomputed on read)"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, Applicant]
    code: 200
    input: []
    output: AlumniProfile[]
    side_effects: []
  - method: GET
    path: "/exchange/grants/{id}/alumni-profiles"
    description: "List the alumni profile spawned by a grant (0 or 1 entries)"
    roles: [PlatformAdmin, ProgramOfficer, HostCommission, Applicant]
    code: 200
    input: []
    output: AlumniProfile[]
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint, or role/stage mismatch on an action endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Applicant-role caller is not the owner of the target resource" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "No CompetitionCycle with the given id" }
  - { id: ERR_COUNTRY_PROGRAM_NOT_FOUND, http: 404, condition: "No CountryProgram with the given id" }
  - { id: ERR_APPLICANT_NOT_FOUND, http: 404, condition: "No Applicant with the given id" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "No Application with the given id" }
  - { id: ERR_ROUND_NOT_FOUND, http: 404, condition: "No PlacementRound with the given id" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "No Grant with the given id" }
  - { id: ERR_VISA_NOT_FOUND, http: 404, condition: "No VisaSponsorship with the given id" }
  - { id: ERR_LEDGER_NOT_FOUND, http: 404, condition: "No ResidencyLedger with the given id" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "No Report with the given id" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "No EmergencyIncident with the given id" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum/range, unknown field, malformed cross-reference, or structurally invalid input" }
  - { id: ERR_INVALID_OUTCOME, http: 400, condition: "DECIDE outcome not valid for the application's current stage" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity state does not permit the requested transition (including expiring an offer before its deadline)" }
  - { id: ERR_ROUND_NOT_OFFERED, http: 409, condition: "PlacementRound is not OFFERED" }
  - { id: ERR_RESIDENCY_NOT_ACCRUING, http: 409, condition: "ResidencyLedger is not ACCRUING (stays and waiver requests require ACCRUING)" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Application create/SUBMIT requires cycle status OPEN" }
  - { id: ERR_CYCLE_PHASE_FORBIDS, http: 409, condition: "Cycle phase does not permit the operation (decisions, host selection, program edits)" }
  - { id: ERR_GRANT_NOT_CONFIRMED, http: 409, condition: "Visa sponsorship issuance requires the grant to be CONFIRMED" }
  - { id: ERR_PLACEMENT_NOT_SECURED, http: 409, condition: "Grant confirmation requires an ACCEPTED placement round (application GRANT_PENDING)" }
  - { id: ERR_GRANT_NOT_ACTIVE, http: 409, condition: "Report submission requires grant ACTIVE/SUSPENDED; incident declaration requires grant ACTIVE" }
  - { id: ERR_NO_COUNTRY_PROGRAMS, http: 409, condition: "Cycle cannot OPEN without at least one CountryProgram" }
  - { id: ERR_APPLICATIONS_PENDING, http: 409, condition: "FINALIZE_AWARDS blocked by applications still under review" }
  - { id: ERR_DEADLINE_PASSED, http: 409, condition: "Logical clock is past the cycle application_deadline" }
  - { id: ERR_START_DATE_IN_PAST, http: 409, condition: "Grant start_date is before the logical clock date at confirmation" }
  - { id: ERR_START_DATE_NOT_REACHED, http: 409, condition: "Logical clock is before grant start_date at ACTIVATE" }
  - { id: ERR_END_DATE_NOT_REACHED, http: 409, condition: "Logical clock is before grant end_date at COMPLETE" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Placement offer response_deadline has passed" }
  - { id: ERR_REPORT_WINDOW_INVALID, http: 409, condition: "FINAL report submitted before grant end_date (and grant not yet completed/terminated)" }
  - { id: ERR_STAY_BEFORE_ACCRUAL_START, http: 409, condition: "Stay start_date precedes the ledger's accrual_start_date" }
  - { id: ERR_ORIENTATION_INCOMPLETE, http: 409, condition: "Pre-departure orientation not recorded (no visa sponsorship issued) at ACTIVATE" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "An applicant with this email already exists" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Applicant already has a submitted-or-later non-terminal application in this cycle" }
  - { id: ERR_DUPLICATE_SCORE, http: 409, condition: "This reviewer already scored this application at this stage" }
  - { id: ERR_DUPLICATE_VISA, http: 409, condition: "Grant already has a VisaSponsorship" }
  - { id: ERR_DUPLICATE_REPORT, http: 409, condition: "A report of this type already exists for this grant" }
  - { id: ERR_ACTIVE_ROUND_EXISTS, http: 409, condition: "Application already has a non-terminal (OFFERED) placement round" }
  - { id: ERR_ACTIVE_INCIDENT_EXISTS, http: 409, condition: "Grant already has an OPEN emergency incident" }
  - { id: ERR_SCORE_QUORUM_NOT_MET, http: 409, condition: "Fewer than the required quorum of stage scores posted" }
  - { id: ERR_SCORE_BELOW_THRESHOLD, http: 409, condition: "Weighted score below RECOMMEND_SCORE_THRESHOLD or avg feasibility below MIN_AVG_FEASIBILITY" }
  - { id: ERR_LANGUAGE_CRITERION_UNMET, http: 409, condition: "Country-specific language gate not satisfied" }
  - { id: ERR_STAY_OVERLAP, http: 409, condition: "Stay closed-interval-overlaps an existing stay (touching endpoints count as overlap)" }
  - { id: ERR_GRANT_PERIOD_OVERLAP, http: 409, condition: "Confirmed period half-open-overlaps another CONFIRMED/ACTIVE/SUSPENDED grant of the applicant" }
  - { id: ERR_FINAL_REPORT_MISSING, http: 409, condition: "No FINAL report in SUBMITTED/ACCEPTED before completion" }
  - { id: ERR_FOLLOW_ON_INELIGIBLE, http: 409, condition: "No AlumniProfile or latest profile not ELIGIBLE for a follow-on application" }
  - { id: ERR_COUNTRY_QUOTA_EXHAUSTED, http: 409, condition: "CountryProgram.slots_remaining is 0 for SELECT" }
  - { id: ERR_DURATION_OUT_OF_RANGE, http: 422, condition: "Duration in months outside the country program [min_duration_months, max_duration_months]" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_application_version does not match the Application's current version (OCC)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Exchange program administrator; configures cycles, country programs, and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /exchange/cycles; POST /exchange/cycles/{id}/transition"
      - "POST /exchange/cycles/{id}/country-programs; PATCH /exchange/country-programs/{id}"
    shared_operations:
      - "All GET endpoints"
  - name: ProgramOfficer
    description: "Grant administration officer; confirms grants, issues visa sponsorships, activates/completes/terminates grants, decides waivers, reviews reports, manages emergency incidents"
    identity: opaque
    exclusive_operations:
      - "POST /exchange/applications/{id}/grant-confirmation"
      - "POST /exchange/grants/{id}/transition"
      - "POST /exchange/grants/{id}/visa-sponsorships"
      - "POST /exchange/grants/{id}/incidents; POST /exchange/incidents/{id}/resolve"
      - "POST /exchange/reports/{id}/transition (ACCEPT, REQUEST_REVISION)"
      - "POST /exchange/residency-ledgers/{id}/transition (APPROVE_WAIVER, DENY_WAIVER)"
      - "POST /exchange/placement-rounds/{id}/transition (EXPIRE)"
    shared_operations:
      - "All GET endpoints"
  - name: HostCommission
    description: "Host country commission / embassy reviewer; selects grantees, manages alternates, opens placement negotiation rounds"
    identity: opaque
    exclusive_operations:
      - "POST /exchange/applications/{id}/transition (DECIDE in HOST_REVIEW)"
      - "POST /exchange/applications/{id}/placement-rounds"
    shared_operations:
      - "All GET endpoints"
  - name: NationalReviewer
    description: "National screening committee member; scores and recommends during NATIONAL_SCREENING only (segregated from campus review)"
    identity: opaque
    exclusive_operations:
      - "POST /exchange/applications/{id}/scores while application in NATIONAL_SCREENING"
      - "POST /exchange/applications/{id}/transition (DECIDE in NATIONAL_SCREENING)"
    shared_operations:
      - "All GET endpoints"
  - name: CampusReviewer
    description: "Campus committee member for enrolled students; scores and endorses during CAMPUS_REVIEW only (segregated from national screening)"
    identity: opaque
    exclusive_operations:
      - "POST /exchange/applications/{id}/scores while application in CAMPUS_REVIEW"
      - "POST /exchange/applications/{id}/transition (DECIDE in CAMPUS_REVIEW)"
    shared_operations:
      - "All GET endpoints"
  - name: Applicant
    description: "A registered applicant acting on their own resources"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /exchange/applications; PATCH /exchange/applications/{id}"
      - "POST /exchange/applications/{id}/transition (SUBMIT, WITHDRAW, DECLINE)"
      - "POST /exchange/placement-rounds/{id}/transition (ACCEPT, DECLINE)"
      - "POST /exchange/grants/{id}/reports; POST /exchange/reports/{id}/transition (RESUBMIT)"
      - "POST /exchange/residency-ledgers/{id}/stays; POST /exchange/residency-ledgers/{id}/transition (REQUEST_WAIVER)"
    shared_operations:
      - "All GET endpoints (own resources only)"
  - name: Anonymous
    description: "Unauthenticated registration caller"
    identity: opaque
    exclusive_operations:
      - "POST /exchange/applicants"
    shared_operations: []
