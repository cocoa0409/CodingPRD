            - call: "POST /purchase-agreements/${a1}/fund"
              payload: { funding_reference: "FND-0001", collected_amount_cents: 3019980 }
              as: ContractAdministrator
              as_user_id: "admin-funder"
            - call: "POST /financing-applications/${fa1}/decision"
              payload: { decision: "APPROVE" }
              as: ContractAdministrator
              as_user_id: "admin-underwriter"
            - call: "POST /purchase-agreements/${a1}/fund"
              payload: { funding_reference: "FND-0001", collected_amount_cents: 3019980 }
              as: ContractAdministrator
              as_user_id: "admin-funder"
            - call: "GET /purchase-agreements/${a1}"
              payload: {}
              as: SalesRepresentative
              as_user_id: "${rep1}"
              captures: { a1_v2: $.data.version }
            - call: "POST /financing-applications"
              payload: { agreement_id: "${a1}", requested_amount_cents: 3019980, applicant_fico: 760, term_months: 120, expected_agreement_version: "${a1_v2}" }
              as: SalesRepresentative
              as_user_id: "${rep1}"
              captures: { fa2: $.data.id }
            - call: "POST /financing-applications/${fa2}/decision"
              payload: { decision: "APPROVE" }
              as: ContractAdministrator
              as_user_id: "admin-underwriter"
            - call: "POST /purchase-agreements/${a1}/fund"
              payload: { funding_reference: "FND-0001", collected_amount_cents: 3019980 }
              as: ContractAdministrator
              as_user_id: "admin-funder"
          assert:
            - "trigger 1 returns 409 with error_id ERR_FINANCING_NOT_APPROVED (no FinancingApplication exists at all)"
            - "trigger 4 returns 409 with error_id ERR_FINANCING_NOT_APPROVED (FinancingApplication.${fa1}.status == SUBMITTED, not APPROVED)"
            - "FinancingApplication.${fa1}.apr_bps == 1399 and ltv_cap_cents == 3005982 and approved_amount_cents == 3005982 and monthly_payment_cents == 46655"
            - "trigger 6 returns 422 with error_id ERR_FINANCING_AMOUNT_SHORTFALL (3005982 < 3019980)"
            - "after trigger 8: FinancingApplication.${fa1}.status == WITHDRAWN (superseded) and FinancingApplication.${fa2}.status == SUBMITTED"
            - "FinancingApplication.${fa2}.apr_bps == 1099 and ltv_cap_cents == 3172981 and approved_amount_cents == 3019980 and monthly_payment_cents == 41583"
            - "trigger 10 returns 200 and PurchaseAgreement.${a1}.fulfillment_status == FUNDED with total_collected_cents == 3339980"
            - "GET /closing-packages?agreement_id=${a1} returns total_count 1 with status AWAITING_RECORDING and instrument_type DEED"

      - name: booking_creation_gated_by_channel_status_and_reinstatement
        grounds:
          - validations[priority=13]
          - state_machines[TourChannel]
          - calculations.channel_no_show_rate
          - calculations.tour_qualification_evaluation
          - errors[ERR_CHANNEL_SUSPENDED]
        distinguishing_aspect: |
          POST /tour-bookings is gated by the state of a different entity, the TourChannel.
          After one no-show drives historical_no_show_rate to 1.0000 on a channel with
          booked_count 4, an identical booking payload is refused with ERR_CHANNEL_SUSPENDED
          (priority 13) even though the same payload would ALSO fail the priority-32
          qualification gate (penalty 30 would drop the score to 50 < 55) -- proving the
          cross-entity state gate is evaluated first. POST /tour-channels/{id}/reinstate
          resets toured_count and no_show_count but NOT booked_count, so the replayed payload
          then succeeds with qualification_score back at 80.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "One gallery with concurrent_tour_capacity 4 and one ACTIVE representative."
            - "One channel with min_qualification_score 55 and four SCHEDULED bookings for the same prospect at 2026-08-16T07:00:00Z, so booked_count reaches NO_SHOW_MIN_SAMPLE 4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-galleries"
              payload: { name: "Orlando Sales Gallery", site_code: "ORLGAL", concurrent_tour_capacity: 4, presentation_minutes: 120, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g1: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Dana Reyes", license_number: "FL-SL-410077", rotation_position: 1 }
              as: GalleryManager
              captures: { r1: $.data.id }
            - call: "POST /tour-channels"
              payload: { name: "Off-Property Contact", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55 }
              as: MarketingManager
              captures: { ch1: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "MARRIED" }
              as: MarketingManager
              captures: { p1: $.data.id }
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T07:00:00Z" }
              as: MarketingManager
              captures: { b1: $.data.id }
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T07:00:00Z" }
              as: MarketingManager
              captures: { b2: $.data.id }
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T07:00:00Z" }
              as: MarketingManager
              captures: { b3: $.data.id }
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T07:00:00Z" }
              as: MarketingManager
              captures: { b4: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T07:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tour-bookings/${b1}/no-show"
              payload: {}
              as: MarketingManager
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T10:00:00Z" }
              as: MarketingManager
            - call: "POST /tour-channels/${ch1}/reinstate"
              payload: {}
              as: MarketingManager
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-16T10:00:00Z" }
              as: MarketingManager
              captures: { b5: $.data.id }
          assert:
            - "after trigger 1: TourChannel.${ch1}.no_show_count == 1, toured_count == 0, historical_no_show_rate == 1.0000, status == SUSPENDED"
            - "after trigger 1: TourBooking.${b2}.status == CANCELLED and TourBooking.${b3}.status == CANCELLED and TourBooking.${b4}.status == CANCELLED with cancel_reason CHANNEL_SUSPENDED"
            - "trigger 2 returns 409 with error_id ERR_CHANNEL_SUSPENDED (not ERR_PROSPECT_NOT_QUALIFIED, though score 80 - 30 = 50 < 55 would also fail)"
            - "after trigger 3: TourChannel.${ch1}.status == ACTIVE, no_show_count == 0, toured_count == 0, historical_no_show_rate == 0.0000, booked_count == 4 (NOT reset)"
            - "trigger 4 returns 201 with TourBooking.${b5}.qualification_score == 80 and qualification_penalty_points == 0"
            - "TourChannel.${ch1}.booked_count == 5 after trigger 4"

      - name: gallery_reopen_posture_derived_from_representative_availability
        grounds:
          - state_machines[SalesGallery]
          - state_machines[SalesRepresentative]
          - state_machines[ComplianceRetrainingAssignment]
          - validations[priority=14]
          - errors[ERR_GALLERY_NOT_OPEN]
          - concurrency_rules[retraining-assign-stale-representative]
        distinguishing_aspect: |
          The gallery's posture is not owned by the gallery: starting a retraining assignment
          moves the only representative ACTIVE -> RETRAINING, which drops
          available_rep_count to 0 and re-derives the gallery OPEN -> RESTRICTED.
          Consequently POST /sales-galleries/{id}/set-status with status OPEN lands on
          RESTRICTED rather than OPEN, and only creating a second representative flips the
          posture back. A three-entity dependency (assignment -> representative -> gallery)
          gating a fourth call, POST /tour-bookings.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "One gallery with exactly one ACTIVE representative, so available_rep_count is 1 and status is OPEN."
            - "One channel and one prospect that qualify (score 80)."
