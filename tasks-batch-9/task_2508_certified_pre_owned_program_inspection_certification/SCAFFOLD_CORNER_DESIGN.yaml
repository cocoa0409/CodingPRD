            - "trigger call 3 returns 200 with status APPROVED, dealer_ratio_snapshot_before 0.00 and approved_amount_cents 100000 - the snapshot is pre-claim, so the share is 1.00 and the claim is paid in full"
            - "trigger call 4 shows the post-claim recount: approved_claim_count_lifetime 1, claim_ratio_effective 1.00 == 1/1, audit_fail_rate 0.00 and risk_score 60 == round_half_up(1.00*100*0.60 + 0.00*100*0.40)"
            - "trigger call 4 shows privilege_status SUSPENDED with privilege_reason CLAIM_RATIO_SUSPENSION: 1.00 clears the 0.4 suspension threshold, so the 0.25 probation threshold must NOT win even though it is also crossed"
            - "trigger call 5 shows L1 WITHDRAWN with withdrawal_reason DEALER_SUSPENDED, withdrawn_at 2026-08-01T00:00:00Z and removal_due_at 2026-08-03T00:00:00Z == withdrawn_at + 48 hours"
            - "trigger call 6 shows C2 REJECTED with rejection_reason DEALER_SUSPENDED, and it was never activated: activated_at stays null and lifetime_activated_count stays 1"
            - "trigger call 7 shows Certification.${c1}.approved_claim_count 1 and approved_claim_amount_cents 100000, so a further claim on this certification has only 150000 of the per-certification cap left"
            - "Certification.${c1}.status is still ACTIVE: the dealer lost its privilege, but an already-active certification is not decertified by a claim"

      - name: cumulative_audit_failure_count_reaches_its_threshold_on_the_second_failure
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.audit_sample_selection
          - calculations.dealer_risk_score
          - state_machines.AuditSample.SELECTED_to_FAILED
        distinguishing_aspect: |
          The audit axis suspends on a cumulative COUNT (audit_fail_suspension_count 2), not on the rate,
          so a dealer whose audit_fail_rate is already 1.00 after one failure keeps its privilege and is
          suspended only on the second. Two successive runs are needed because a certification is sampled
          at most once, and the second run's pool must have shrunk to the one certification that survived.
        test_recipe:
          setup:
            - "Dealer D1 with technicians T1 and T2, published MPI-172 with P1, and two certifications C1 (activated first) and C2 both ACTIVE."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
