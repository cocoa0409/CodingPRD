# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1-§1.7 not already covered by §1.8. Same 7-point
# contract and §1.5 lint gates as §1.8. excluded_because stubs point at the
# §1.8 instance (by name) that already exercises the corner.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: patient_create_missing_required_full_name_returns_validation
        claim_type: Required Fields
        grounds: ["entities.Patient.fields.full_name", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /patients without full_name returns ERR_VALIDATION (422); no patient is created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { email: "x@x.com", date_of_birth: "1970-01-01", state_code: "CA", billing_mode: "CASH", menopause_stage: "UNKNOWN" }
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: patient_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Patient", "errors[ERR_PATIENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /patients/{unknown} returns ERR_PATIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PATIENT_NOT_FOUND"

      - name: visit_completion_creates_visit_charge_computed
        claim_type: Computed Fields
        grounds: ["entities.Charge.fields.billable_kind", "entities.Visit.fields.visit_charge_id"]
        distinguishing_aspect: "Completing a visit mints a Charge with billable_kind == VISIT discoverable via GET /charges?billable_id={visit_id} (produces the VISIT enum member)."
        test_recipe:
          setup: ["completed visit for a CASH patient"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Ora Vex", email: "ora@x.com", date_of_birth: "1970-06-06", state_code: "CA", billing_mode: "CASH", menopause_stage: "MENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Cee", specialty: "GYNECOLOGY", npi: "2020202020", visit_fee_cents: 15000 }
              as: CareCoordinator
              captures: { prov_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", intake_assessment_id: "${intake_id}", scheduled_start: "2026-05-24T09:00:00Z", scheduled_end: "2026-05-24T10:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "GET /charges?billable_id=${visit_id}"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { bk: "$.data[0].billable_kind" }
          assert:
            - "GET /charges?billable_id=${visit_id} returns one charge with billable_kind == VISIT and allowed_amount_cents == 15000"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: intake_submit_twice_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.IntakeAssessment.DRAFT_to_CLEARED", "errors[ERR_INTAKE_INVALID_STATE]"]
        distinguishing_aspect: "Submitting an already-CLEARED intake returns ERR_INTAKE_INVALID_STATE; no re-computation occurs."
        test_recipe:
          setup: ["a submitted (CLEARED) intake"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pia Wu", email: "pia@x.com", date_of_birth: "1971-01-21", state_code: "NY", billing_mode: "CASH", menopause_stage: "PERIMENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
          trigger:
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second submit error_id == ERR_INTAKE_INVALID_STATE"

      - name: visit_complete_from_cancelled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Visit.SCHEDULED_to_CANCELLED", "errors[ERR_VISIT_INVALID_STATE]"]
        distinguishing_aspect: "Completing a CANCELLED visit returns ERR_VISIT_INVALID_STATE; no VISIT charge is created."
        test_recipe:
          setup: ["a CANCELLED visit"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Rae Yo", email: "rae@x.com", date_of_birth: "1972-02-22", state_code: "CA", billing_mode: "CASH", menopause_stage: "MENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Dot", specialty: "GYNECOLOGY", npi: "2121212121", visit_fee_cents: 15000 }
              as: CareCoordinator
              captures: { prov_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", intake_assessment_id: "${intake_id}", scheduled_start: "2026-05-25T09:00:00Z", scheduled_end: "2026-05-25T10:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/cancel"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
          trigger:
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "complete error_id == ERR_VISIT_INVALID_STATE"

      - name: charge_adjudicate_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.Charge.ESTIMATED_to_ADJUDICATED", "errors[ERR_CHARGE_INVALID_STATE]"]
        distinguishing_aspect: "Adjudicating an already-ADJUDICATED charge returns ERR_CHARGE_INVALID_STATE; deductible is not applied twice."
        test_recipe:
          setup: ["one ADJUDICATED refill charge (INSURANCE patient)"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Sia Ze", email: "sia@x.com", date_of_birth: "1968-03-13", state_code: "CA", billing_mode: "INSURANCE", menopause_stage: "POSTMENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/insurance-policies"
              payload: { payer_name: "BlueGrid", deductible_cents: 25000, coinsurance_rate: 0.20, out_of_pocket_max_cents: 500000 }
              as: BillingAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Eve", specialty: "GYNECOLOGY", npi: "2323232323", visit_fee_cents: 15000 }
              as: CareCoordinator
              captures: { prov_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", intake_assessment_id: "${intake_id}", scheduled_start: "2026-05-26T09:00:00Z", scheduled_end: "2026-05-26T10:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions"
              payload: { visit_id: "${visit_id}", hrt_type: "ESTROGEN_PATCH", days_supply_per_fill: 30, total_refills_authorized: 2, lab_required_before_refill: false, coverage_days: 90, refill_price_cents: 20000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/refills"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /refills/${r1_id}/approve"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /refills/${r1_id}/fulfill"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { c1_id: $.data.charge_id }
            - call: "POST /charges/${c1_id}/adjudicate"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /charges/${c1_id}/adjudicate"
              payload: {}
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "second adjudicate error_id == ERR_CHARGE_INVALID_STATE"
            - "InsurancePolicy.${pol_id}.consumed_deductible_cents == 20000 (not doubled)"

      - name: prescription_discontinue_cascade_cancels_labs_denies_refills
        claim_type: Side Effect Execution
        grounds: ["state_machines.Prescription.ACTIVE_to_DISCONTINUED", "state_machines.LabOrder.PENDING_to_CANCELLED", "state_machines.Refill.REQUESTED_to_DENIED"]
        distinguishing_aspect: "Discontinuing an ACTIVE prescription cancels its PENDING lab orders and denies its open (REQUESTED) refills (produces the LabOrder CANCELLED member)."
        test_recipe:
          setup: ["ACTIVE prescription with a PENDING lab and a REQUESTED refill"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Tia Ab", email: "tia@x.com", date_of_birth: "1969-04-14", state_code: "OR", billing_mode: "CASH", menopause_stage: "MENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Foy", specialty: "ENDOCRINOLOGY", npi: "2424242424", visit_fee_cents: 13000 }
              as: CareCoordinator
              captures: { prov_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", intake_assessment_id: "${intake_id}", scheduled_start: "2026-05-27T09:00:00Z", scheduled_end: "2026-05-27T10:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions"
              payload: { visit_id: "${visit_id}", hrt_type: "COMBINED", days_supply_per_fill: 30, total_refills_authorized: 3, lab_required_before_refill: false, coverage_days: 90, refill_price_cents: 16000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/lab-orders"
              payload: { panel_type: "LIVER" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { lab_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/refills"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /prescriptions/${rx_id}/discontinue"
              payload: { reason: "adverse event" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { st: $.data.status }
          assert:
            - "Prescription.${rx_id}.status == DISCONTINUED"
            - "LabOrder.${lab_id}.status == CANCELLED"
            - "Refill.${r1_id}.status == DENIED"

      - name: subscription_cancel_cascade_suspends_active_prescription
        claim_type: Side Effect Execution
        grounds: ["state_machines.Subscription.ACTIVE_to_CANCELLED", "state_machines.Prescription.ACTIVE_to_SUSPENDED", "entities.CarePlanMessage.fields.message_type"]
        distinguishing_aspect: "Cancelling a subscription suspends the patient's ACTIVE prescriptions and appends a SUSPENSION_NOTICE CarePlanMessage to each."
        test_recipe:
          setup: ["patient with ACTIVE subscription and one ACTIVE prescription"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Uma Bd", email: "umab@x.com", date_of_birth: "1970-05-15", state_code: "CA", billing_mode: "CASH", menopause_stage: "MENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /providers"
              payload: { full_name: "Dr Gil", specialty: "GYNECOLOGY", npi: "2525252525", visit_fee_cents: 15000 }
              as: CareCoordinator
              captures: { prov_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", intake_assessment_id: "${intake_id}", scheduled_start: "2026-05-28T09:00:00Z", scheduled_end: "2026-05-28T10:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions"
              payload: { visit_id: "${visit_id}", hrt_type: "ESTROGEN_PATCH", days_supply_per_fill: 30, total_refills_authorized: 2, lab_required_before_refill: false, coverage_days: 90, refill_price_cents: 15000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id, cp_id: $.data.care_plan_id }
            - call: "POST /subscriptions"
              payload: { patient_id: "${pat_id}", plan_tier: "ESSENTIAL", expected_patient_version: "${pat_v}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { sub_status: $.data.status }
          assert:
            - "Subscription.${sub_id}.status == CANCELLED"
            - "Prescription.${rx_id}.status == SUSPENDED"
            - "GET /care-plans/${cp_id}/messages contains an item with message_type == SUSPENSION_NOTICE"

      - name: refill_reverse_of_unadjudicated_charge_voids_it
        claim_type: Compensation
        grounds: ["state_machines.Refill.FULFILLED_to_REVERSED", "state_machines.Charge.ESTIMATED_to_VOID"]
        distinguishing_aspect: "Reversing a fulfilled refill whose charge is still ESTIMATED voids the charge (produces the Charge VOID member); no deductible movement since none was applied."
        test_recipe:
          setup: ["CASH patient; one FULFILLED refill with an ESTIMATED charge (never adjudicated)"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Val Ce", email: "valc@x.com", date_of_birth: "1971-06-16", state_code: "OR", billing_mode: "CASH", menopause_stage: "PERIMENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Hoy", specialty: "GYNECOLOGY", npi: "2626262626", visit_fee_cents: 12000 }
              as: CareCoordinator
              captures: { prov_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", intake_assessment_id: "${intake_id}", scheduled_start: "2026-05-29T09:00:00Z", scheduled_end: "2026-05-29T10:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions"
              payload: { visit_id: "${visit_id}", hrt_type: "ESTROGEN_ORAL", days_supply_per_fill: 30, total_refills_authorized: 2, lab_required_before_refill: false, coverage_days: 90, refill_price_cents: 18000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/refills"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /refills/${r1_id}/approve"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /refills/${r1_id}/fulfill"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { c1_id: $.data.charge_id }
          trigger:
            - call: "POST /refills/${r1_id}/reverse"
              payload: { reason: "returned unopened" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { st: $.data.status }
          assert:
            - "Refill.${r1_id}.status == REVERSED"
            - "Charge.${c1_id}.status == VOID"

      - name: refill_approve_after_coverage_end_expires_prescription
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Prescription.ACTIVE_to_EXPIRED", "errors[ERR_PRESCRIPTION_NOT_ACTIVE]"]
        distinguishing_aspect: "Approving a refill after the coverage_end_date expires the prescription (ACTIVE -> EXPIRED) and rejects the approve with ERR_PRESCRIPTION_NOT_ACTIVE (produces the EXPIRED member)."
        test_recipe:
          setup: ["ACTIVE prescription (coverage 2026-06-01..2026-06-21) with a REQUESTED refill; clock advanced past coverage_end to 2026-07-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /patients"
              payload: { full_name: "Wyn De", email: "wyn@x.com", date_of_birth: "1970-07-17", state_code: "CA", billing_mode: "CASH", menopause_stage: "MENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Dr Iko", specialty: "GYNECOLOGY", npi: "2727272727", visit_fee_cents: 15000 }
              as: CareCoordinator
              captures: { prov_id: $.data.id }
            - call: "POST /patients/${pat_id}/intake-assessments"
              payload: { symptom_ratings: [], reported_conditions: ["NONE"] }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { intake_id: $.data.id }
            - call: "POST /intake-assessments/${intake_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", intake_assessment_id: "${intake_id}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T10:00:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions"
              payload: { visit_id: "${visit_id}", hrt_type: "ESTROGEN_PATCH", days_supply_per_fill: 20, total_refills_authorized: 3, lab_required_before_refill: false, coverage_days: 20, refill_price_cents: 15000 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /prescriptions/${rx_id}/refills"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /refills/${r1_id}/approve"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "approve error_id == ERR_PRESCRIPTION_NOT_ACTIVE"
            - "Prescription.${rx_id}.status == EXPIRED"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: second_insurance_policy_returns_already_exists
        claim_type: Violation to Error
        grounds: ["validations[priority=13.5]", "errors[ERR_POLICY_ALREADY_EXISTS]"]
        distinguishing_aspect: "Attaching a second policy to a patient returns ERR_POLICY_ALREADY_EXISTS (409)."
        test_recipe:
          setup: ["patient with one insurance policy"]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Xia Ef", email: "xia@x.com", date_of_birth: "1968-08-18", state_code: "CA", billing_mode: "INSURANCE", menopause_stage: "POSTMENOPAUSE" }
              as: CareCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/insurance-policies"
              payload: { payer_name: "BlueGrid", deductible_cents: 25000, coinsurance_rate: 0.20, out_of_pocket_max_cents: 500000 }
              as: BillingAdmin
          trigger:
            - call: "POST /patients/${pat_id}/insurance-policies"
