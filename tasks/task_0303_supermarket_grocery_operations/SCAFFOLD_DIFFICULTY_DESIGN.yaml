  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # ---- depth-3: sale finalize -> lot DEPLETED -> product rollup -> reorder_flag set ----
      - name: finalize_depletes_lot_rolls_up_sets_reorder_flag
        grounds:
          - state_machines.SalesTransaction.OPEN_to_FINALIZED
          - state_machines.InventoryLot.ACTIVE_to_DEPLETED
          - calculations.product_inventory_rollup
          - calculations.reorder_flag
          - entities.Product.fields.reorder_flagged
        distinguishing_aspect: |
          One finalize triggers a depth-3 chain: (1) sale finalize depletes the lot's remaining_qty
          to 0 (lot -> DEPLETED); (2) that lot change triggers product_inventory_rollup lowering
          on_hand_qty to 0; (3) that rollup triggers reorder_flag, and since 0 <= reorder_point 5 the
          product becomes reorder_flagged. Each link is caused by the previous link.
        test_recipe:
          setup:
            - "Clock 2026-06-05T00:00:00Z. Each-sold product reorder_point 5, single ACTIVE lot remaining 5."
            - "OPEN sale with one line quantity 5 (exactly empties the lot)."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Rice", sku: "SKU-RICE", sell_by_weight: false, unit_price_cents: 99, is_perishable: false, reorder_point_qty: 5 }
              as: PriceManager
              as_user_id: "pm-1"
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /shipments"
              payload: { vendor_name: "V", reference_code: "REF-G1", expected_total_cents: 500 }
              as: ReceivingClerk
              as_user_id: "rc-1"
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/lines"
              payload: { product_id: "${prod_id}", ordered_qty: 5, accepted_qty: 5, unit_cost_cents: 100 }
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/start-receiving"
              payload: {}
              as: ReceivingClerk
              as_user_id: "rc-1"
            - call: "POST /shipments/${ship_id}/receive"
              payload: { expected_product_version: "${prod_v}", override_variance: true }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "GET /inventory-lots"
              payload: {}
              as: InventoryAuditor
              as_user_id: "aud-1"
              captures: { lot_id: "$.data[0].id" }
            - call: "POST /sales"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/line-items"
              payload: { product_id: "${prod_id}", quantity: 5 }
              as: Cashier
              as_user_id: "csh-1"
          trigger:
            - call: "POST /sales/${sale_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "csh-1"
          assert:
            - "InventoryLot.${lot_id}.status == DEPLETED"
            - "Product.${prod_id}.on_hand_qty == 0"
            - "Product.${prod_id}.reorder_flagged == true"

      # ---- depth-2: member close -> clipped coupons EXPIRED ----
      - name: member_close_expires_clipped_coupons
        grounds:
          - state_machines.LoyaltyMember.ACTIVE_to_CLOSED
          - state_machines.ClippedCoupon.CLIPPED_to_EXPIRED
          - entities.ClippedCoupon.fields.status
        distinguishing_aspect: |
          Closing a member (depth-2 chain) is caused-by-previous: (1) member -> CLOSED; (2) that close
          cascades to flip every CLIPPED ClippedCoupon of the member to EXPIRED. Originates from a
          different trigger (member close) than the finalize cascade.
        test_recipe:
          setup:
            - "Clock 2026-06-05T00:00:00Z. ACTIVE member with one CLIPPED coupon."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
              as_user_id: "mgr-1"
              captures: { dept_id: $.data.id }
            - call: "POST /products"
              payload: { department_id: "${dept_id}", name: "Tea", sku: "SKU-TEA", sell_by_weight: false, unit_price_cents: 99, is_perishable: false, reorder_point_qty: 0 }
