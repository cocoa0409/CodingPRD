              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
            - call: "POST /loan-accounts"
              payload: { employee_id: "${emp_id}", servicer_name: "Nelnet", account_last4: "4321", original_principal_cents: 2500000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { la_id: $.data.id }
            - call: "POST /loan-accounts/${la_id}/verification"
              payload: { to_status: "VERIFIED", evidence_ref: "STMT-2026-03" }
              as: BenefitsAdministrator
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp_v: $.data.version }
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_id}", plan_year_id: "${py_id}", certification_method: "SERVICER_STATEMENT", expected_employee_version: "${emp_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /loan-certifications/${cert_id}/lines"
              payload: { loan_account_id: "${la_id}", payment_date: "2026-03-15T00:00:00Z", amount_cents: 30000, covered_period_start: "2026-03-01T00:00:00Z", covered_period_end: "2026-04-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /loan-certifications/${cert_id}/submit"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
