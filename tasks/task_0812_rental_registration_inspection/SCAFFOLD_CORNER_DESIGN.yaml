scaffold_corner_design:
  # -------------------------------------------------------------------------
  # Entities
  # -------------------------------------------------------------------------
  - section: entities
    instances:
      - name: property_creation_returns_201_with_computed_fields
        claim_type: creation
        grounds: [entities.Property, entities.Property.fields.has_lead_risk]
        distinguishing_aspect: "POST /properties with all required fields returns 201, registration_status REGISTERED, total_fees_paid_cents 0, and has_lead_risk false for year_built 1980."
        test_recipe:
          setup: ["A landlord exists."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "C1", email: "c1@x.com", phone: "555", mailing_address: "1 C" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
          trigger:
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "1 New", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id", status: "$.data.registration_status", lead: "$.data.has_lead_risk", ledger: "$.data.total_fees_paid_cents" }
          assert:
            - "response status == 201"
            - "Property.${prop_id}.registration_status == REGISTERED"
            - "Property.${prop_id}.has_lead_risk == false"
            - "Property.${prop_id}.total_fees_paid_cents == 0"

      - name: property_creation_missing_unit_count_returns_422
        claim_type: required_fields
        grounds: [entities.Property.fields.unit_count, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /properties omitting the required unit_count returns 422 ERR_VALIDATION."
        test_recipe:
          setup: ["A landlord exists."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "C2", email: "c2@x.com", phone: "555", mailing_address: "2 C" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
          trigger:
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "2 New", year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 422 with error_id ERR_VALIDATION"

      - name: property_get_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PROPERTY_NOT_FOUND]"]
        distinguishing_aspect: "GET /properties/{unknown-uuid} returns 404 ERR_PROPERTY_NOT_FOUND with the error response envelope (data.error_id, data.message)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /properties/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Registrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 404 with error_id ERR_PROPERTY_NOT_FOUND"

      - name: property_lead_risk_true_for_pre1978
        claim_type: computed_fields
        grounds: [entities.Property.fields.has_lead_risk, entities.Property.fields.year_built]
        distinguishing_aspect: "A property with year_built 1950 reports has_lead_risk true on GET (computed strictly from year_built < 1978)."
        test_recipe:
          setup: ["A landlord exists."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "C3", email: "c3@x.com", phone: "555", mailing_address: "3 C" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "3 Old", unit_count: 2, year_built: 1950 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id" }
          trigger:
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: Registrar
              captures: { lead: "$.data.has_lead_risk" }
          assert:
            - "Property.${prop_id}.has_lead_risk == true"

  # -------------------------------------------------------------------------
  # State Machines
  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: begin_already_in_progress_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Inspection.SCHEDULED_to_IN_PROGRESS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling begin on an inspection already IN_PROGRESS returns 409 ERR_INVALID_STATE; no state change."
        test_recipe:
          setup: ["A REGISTERED property with a periodic inspection already IN_PROGRESS."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "C4", email: "c4@x.com", phone: "555", mailing_address: "4 C" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { full_name: "IC4", badge_number: "BC4", email: "ic4@x.com" }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "4 S", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", inspection_type: "PERIODIC", scheduled_date: "2026-06-01T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/begin"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspections/${ins_id}/begin"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409 with error_id ERR_INVALID_STATE"
            - "Inspection.${ins_id}.status == IN_PROGRESS (unchanged)"

      - name: pay_already_active_license_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.RentalLicense.PENDING_PAYMENT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Paying a license that is already ACTIVE returns 409 ERR_INVALID_STATE (pay is only valid from PENDING_PAYMENT)."
        test_recipe:
          setup: ["A property with a PASSED periodic inspection and an ACTIVE license."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "C5", email: "c5@x.com", phone: "555", mailing_address: "5 C" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { full_name: "IC5", badge_number: "BC5", email: "ic5@x.com" }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "5 S", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", inspection_type: "PERIODIC", scheduled_date: "2026-06-01T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/begin"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "LIFE_SAFETY", code: "SMOKE_DETECTOR", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "HABITABILITY", code: "HEAT", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: Registrar
              captures: { prop_v: "$.data.version" }
            - call: "POST /rental-licenses"
              payload: { property_id: "${prop_id}", term_years: 1, expected_property_version: "${prop_v}" }
              as: Registrar
              captures: { lic_id: "$.data.id" }
            - call: "POST /rental-licenses/${lic_id}/pay"
              payload: { amount_cents: 30000 }
              as: Landlord
              as_user_id: "${ll_id}"
          trigger:
            - call: "POST /rental-licenses/${lic_id}/pay"
              payload: { amount_cents: 30000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409 with error_id ERR_INVALID_STATE"

      - name: acknowledge_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.TenantNotice.SENT_to_ACKNOWLEDGED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Acknowledging a TenantNotice already ACKNOWLEDGED (a terminal state) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A property with a SENT tenant notice already ACKNOWLEDGED once."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "C6", email: "c6@x.com", phone: "555", mailing_address: "6 C" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "6 S", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /tenant-notices"
              payload: { property_id: "${prop_id}", recipient_email: "t@x.com", recipient_unit: "1A", notice_type: "INSPECTION_NOTICE" }
              as: Registrar
              captures: { notice_id: "$.data.id" }
            - call: "POST /tenant-notices/${notice_id}/acknowledge"
              payload: {}
              as: Tenant
          trigger:
            - call: "POST /tenant-notices/${notice_id}/acknowledge"
              payload: {}
              as: Tenant
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409 with error_id ERR_INVALID_STATE"
            - "TenantNotice.${notice_id}.status == ACKNOWLEDGED (unchanged)"

      - name: issue_condemnation_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.CondemnationOrder.DRAFT_to_ISSUED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Issuing a CondemnationOrder that is already ISSUED (terminal) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A property with an ESCALATED critical violation and a CondemnationOrder already ISSUED."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "C7", email: "c7@x.com", phone: "555", mailing_address: "7 C" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { full_name: "IC7", badge_number: "BC7", email: "ic7@x.com" }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "7 S", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", inspection_type: "PERIODIC", scheduled_date: "2026-06-01T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/begin"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "LIFE_SAFETY", code: "FIRE_EXIT", result: "FAIL", severity: "CRITICAL" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "HABITABILITY", code: "MOLD", result: "FAIL", severity: "CRITICAL" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /violations?inspection_id=${ins_id}"
              payload: {}
              as: Registrar
              captures: { v0: "$.data[0].id" }
            - call: "POST /violations/${v0}/escalate"
              payload: {}
              as: Registrar
            - call: "POST /condemnation-orders"
              payload: { property_id: "${prop_id}", basis: "critical", triggering_violation_id: "${v0}" }
              as: Registrar
              captures: { cond_id: "$.data.id" }
            - call: "POST /condemnation-orders/${cond_id}/issue"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /condemnation-orders/${cond_id}/issue"
              payload: {}
              as: Registrar
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409 with error_id ERR_INVALID_STATE"

      - name: complaint_resolved_on_passing_complaint_inspection
        claim_type: side_effect_execution
        grounds: [state_machines.Complaint.INSPECTION_SCHEDULED_to_RESOLVED, state_machines.Complaint.FILED_to_INSPECTION_SCHEDULED]
        distinguishing_aspect: "Scheduling a COMPLAINT inspection moves the complaint FILED->INSPECTION_SCHEDULED; completing that inspection PASSED moves it ->RESOLVED."
        test_recipe:
          setup: ["A FILED complaint on a REGISTERED property."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "C8", email: "c8@x.com", phone: "555", mailing_address: "8 C" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { full_name: "IC8", badge_number: "BC8", email: "ic8@x.com" }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "8 S", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /complaints"
              payload: { property_id: "${prop_id}", tenant_email: "t8@x.com", tenant_unit: "2B", category: "HABITABILITY", description: "no heat", severity_alleged: "MAJOR" }
              as: Tenant
              captures: { comp_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", inspection_type: "COMPLAINT", complaint_id: "${comp_id}", scheduled_date: "2026-06-01T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/begin"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "LIFE_SAFETY", code: "SMOKE_DETECTOR", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "HABITABILITY", code: "HEAT", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspections/${ins_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /properties/${prop_id}/complaints"
              payload: {}
              as: Registrar
              captures: { comp_status: "$.data[0].status" }
          assert:
            - "Complaint.${comp_id}.status == RESOLVED after the complaint inspection passes"

      - name: inspection_fail_creates_violations_stub
        claim_type: side_effect_execution
        grounds: [state_machines.Inspection.IN_PROGRESS_to_FAILED]
        excluded_because:
          difficulty_instance: transitive_cascade / inspection_fail_depth2_cascade
          rationale: "The FAILED-branch violation creation and property suspension side effects are exercised end-to-end by the named §1.8 instance."

  # -------------------------------------------------------------------------
  # Calculations
  # -------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: renewal_on_time_fee_uses_base_variant
        claim_type: variant_selection
        grounds: [calculations.license_fee, state_machines.RentalLicense.ACTIVE_to_ACTIVE]
        distinguishing_aspect: "Renewing while still ACTIVE (clock at or before expires_at) selects the on_time variant: fee_cents stays 30000 (no 1.5x multiplier, no reinstatement fee)."
        test_recipe:
          setup: ["A property with a PASSED periodic inspection and an ACTIVE license, clock still before expires_at."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "C9", email: "c9@x.com", phone: "555", mailing_address: "9 C" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { full_name: "IC9", badge_number: "BC9", email: "ic9@x.com" }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "9 S", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", inspection_type: "PERIODIC", scheduled_date: "2026-06-01T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/begin"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "LIFE_SAFETY", code: "SMOKE_DETECTOR", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "HABITABILITY", code: "HEAT", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: Registrar
              captures: { prop_v: "$.data.version" }
            - call: "POST /rental-licenses"
              payload: { property_id: "${prop_id}", term_years: 1, expected_property_version: "${prop_v}" }
              as: Registrar
              captures: { lic_id: "$.data.id" }
            - call: "POST /rental-licenses/${lic_id}/pay"
              payload: { amount_cents: 30000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lic_v: "$.data.version" }
          trigger:
            - call: "POST /rental-licenses/${lic_id}/renew"
              payload: { expected_license_version: "${lic_v}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { fee: "$.data.fee_cents", status: "$.data.status" }
          assert:
            - "RentalLicense.${lic_id}.fee_cents == 30000 (on_time variant)"
            - "RentalLicense.${lic_id}.status == ACTIVE"

  # -------------------------------------------------------------------------
  # Validations / RBAC / Errors
  # -------------------------------------------------------------------------
  - section: validations
    instances:
      - name: tenant_cannot_register_property_returns_403
        claim_type: rbac_denial
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Tenant calling POST /properties (not in that endpoint's roles) is rejected with 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["A landlord exists."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "C10", email: "c10@x.com", phone: "555", mailing_address: "10 C" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
          trigger:
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "10 S", unit_count: 3, year_built: 1980 }
              as: Tenant
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 403 with error_id ERR_UNAUTHORIZED"

      - name: landlord_cannot_register_for_other_landlord_returns_403
        claim_type: ownership_denial
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "A Landlord (X-User-ID == B) posting a property whose landlord_id == A is rejected with 403 ERR_FORBIDDEN_OWNERSHIP."
        test_recipe:
          setup: ["Two landlords A and B exist."]
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "A", email: "a@x.com", phone: "555", mailing_address: "A" }
              as: Registrar
              captures: { ll_a: "$.data.id" }
            - call: "POST /landlords"
              payload: { full_name: "B", email: "b@x.com", phone: "555", mailing_address: "B" }
              as: Registrar
              captures: { ll_b: "$.data.id" }
          trigger:
            - call: "POST /properties"
              payload: { landlord_id: "${ll_a}", street_address: "11 S", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_b}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 403 with error_id ERR_FORBIDDEN_OWNERSHIP"

      - name: missing_auth_headers_returns_401
        claim_type: auth
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unknown/missing X-User-Role is rejected with 401 ERR_UNAUTHENTICATED before any resource logic runs."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /properties/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Nobody
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 401 with error_id ERR_UNAUTHENTICATED"

      - name: issue_condemnation_without_escalated_returns_no_basis
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_NO_CONDEMNATION_BASIS]"]
        distinguishing_aspect: "Issuing a DRAFT CondemnationOrder for a property with no ESCALATED violation returns 409 ERR_NO_CONDEMNATION_BASIS."
        test_recipe:
          setup: ["A property with a DRAFT condemnation order but no ESCALATED violation."]
          setup_api_calls:
            - call: "POST /landlords"
