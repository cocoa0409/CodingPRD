scenario: |
  Digital Ad Campaign Trafficking & Verification (media agency ad operations): insertion order to line item setup & targeting configuration, creative asset QA & tag implementation, pacing/delivery monitoring & mid-flight optimization, viewability/fraud verification vendor thresholds & make-goods, third-party tag discrepancy reconciliation & billing basis, frequency capping across placements, campaign wrap report & attribution, invalid traffic credit

domain_name: digital-ad-campaign-trafficking
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation      # agency ad-server numbers vs third-party tag numbers → billing basis
  secondary_archetype: compliance_audit         # verification vendor thresholds, fraud hold, make-good credit trail
  complexity_layers:
    - dual_variant_calculation                  # pacing projection variants; billing-basis variants; attribution models
    - rate_threshold_triggers                   # viewability/IVT thresholds, frequency caps, pacing alerts, goal auto-complete
    - cascading_side_effects                    # IVT breach → line-item pause → creative pause; IO cancel → line items → creatives
    - optimistic_concurrency                    # OCC on LineItem.version for mid-flight optimization edits
  entity_topology: flat                         # peer entities with FK references; writes are flat (FKs in body)
  state_machine_shape: cyclic                   # QA revision loop, PAUSE/RESUME loop, REJECTED→PROPOSED, RECONCILED→OPEN
  relationship_patterns:
    - one_to_many                               # IO→LineItem→Creative/Snapshot/Event/Report; Report→MakeGood
    - cross_aggregate                           # MakeGood credits roll up to IO; Reconciliation reads DeliverySnapshots
  role_model: segregation_of_duties             # proposer of a make-good cannot approve it; reconciler cannot lock
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: InsertionOrder
    parent: null
    common_fields: true
    fields:
      - { name: advertiser_name, type: string, source: input, description: "Advertiser display name" }
      - { name: total_budget_cents, type: integer, source: input, description: "Contract budget ceiling in cents; sum of line-item budgets must not exceed it", constraints: "> 0" }
      - { name: flight_start, type: datetime, source: input, description: "First eligible delivery date (inclusive), ISO date" }
      - { name: flight_end, type: datetime, source: input, description: "Last eligible delivery date (inclusive), ISO date; must be >= flight_start" }
      - { name: billing_basis, type: enum, source: input, description: "AGENCY_PLATFORM | THIRD_PARTY_TAG | LOWER_OF — selects billing_impressions variant at reconciliation" }
      - { name: viewability_threshold_pct, type: number, source: input, description: "Minimum acceptable viewability rate (0..1)", default: 0.70 }
      - { name: ivt_threshold_pct, type: number, source: input, description: "Maximum tolerable invalid-traffic rate (0..1)", default: 0.02 }
      - { name: status, type: enum, source: system, description: "DRAFT → APPROVED → ACTIVE → COMPLETED → CLOSED; CANCELLED from DRAFT/APPROVED/ACTIVE" }
      - { name: booked_budget_cents, type: integer, source: computed, description: "Sum of budget_cents over non-CANCELLED LineItems of this IO" }
      - { name: total_applied_credit_cents, type: integer, source: computed, description: "Sum of credit_cents over MakeGoods in APPLIED status whose VerificationReport's line item belongs to this IO" }

  - name: LineItem
    parent: null
    common_fields: true
    fields:
      - { name: io_id, type: string, source: input, description: "FK -> InsertionOrder.id; owning insertion order" }
      - { name: name, type: string, source: input, description: "Line item name" }
      - { name: goal_impressions, type: integer, source: input, description: "Contracted impression goal", constraints: "> 0" }
      - { name: cpm_rate_cents, type: integer, source: input, description: "Booked CPM rate in cents", constraints: "> 0" }
      - { name: start_date, type: datetime, source: input, description: "Line item start date; must be within IO flight" }
      - { name: end_date, type: datetime, source: input, description: "Line item end date; >= start_date and within IO flight" }
      - { name: pacing_mode, type: enum, source: input, description: "EVEN | ASAP" }
      - { name: targeting, type: object, source: input, description: "Free-form targeting configuration (geo, device, daypart)", default: {} }
      - { name: frequency_cap_max_impressions, type: integer, source: input, description: "Max impressions per user_key per rolling window across all placements of this line item; absent = uncapped", default: null }
      - { name: frequency_cap_window_hours, type: integer, source: input, description: "Rolling window length in hours for the frequency cap", default: 24 }
      - { name: status, type: enum, source: system, description: "DRAFT → TRAFFICKED → LIVE ⇄ PAUSED → COMPLETED; CANCELLED from DRAFT/TRAFFICKED/LIVE/PAUSED" }
      - { name: fraud_posture, type: enum, source: system, description: "CLEAR | BREACH — set to BREACH by an IVT-breach VerificationReport; cleared via CLEAR_FRAUD" }
      - { name: budget_cents, type: integer, source: computed, description: "round_half_up(goal_impressions × cpm_rate_cents / 1000)" }
      - { name: delivered_impressions, type: integer, source: computed, description: "Sum of impressions over this line item's DeliverySnapshots with status POSTED" }
      - { name: delivered_clicks, type: integer, source: computed, description: "Sum of clicks over POSTED DeliverySnapshots" }
      - { name: delivered_spend_cents, type: integer, source: computed, description: "Sum of spend_cents over POSTED DeliverySnapshots" }
      - { name: pacing_projection_impressions, type: integer, source: computed, description: "Projected final delivery, lifetime-average variant (see calculations.pacing_projection)" }
      - { name: pacing_projection_trailing_impressions, type: integer, source: computed, description: "Projected final delivery, trailing-3-day variant" }
      - { name: pacing_alert, type: boolean, source: computed, description: "true when delivered_impressions < 0.90 × expected_to_date (see calculations.pacing_expected)" }

  - name: Creative
    parent: null
    common_fields: true
    fields:
      - { name: line_item_id, type: string, source: input, description: "FK -> LineItem.id; line item this creative traffics under" }
      - { name: name, type: string, source: input, description: "Creative name" }
      - { name: asset_url, type: string, source: input, description: "Asset location" }
      - { name: width, type: integer, source: input, description: "Pixel width", constraints: "> 0" }
      - { name: height, type: integer, source: input, description: "Pixel height", constraints: "> 0" }
      - { name: ad_tag, type: string, source: system, description: "Third-party ad tag markup captured by the TAG transition; null until tagged" }
      - { name: qa_failure_reason, type: string, source: system, description: "Set by FAIL_QA; cleared by REVISE; null otherwise" }
      - { name: status, type: enum, source: system, description: "UPLOADED → IN_QA → QA_PASSED | QA_FAILED → (REVISE → IN_QA) ; QA_PASSED → TAGGED → LIVE ⇄ PAUSED → ARCHIVED" }

  - name: DeliverySnapshot
    parent: null
    common_fields: false
    fields:
      - { name: line_item_id, type: string, source: input, description: "FK -> LineItem.id" }
      - { name: snapshot_date, type: datetime, source: input, description: "Delivery date (ISO date); must fall inside the line item's start_date..end_date" }
      - { name: impressions, type: integer, source: input, description: "Agency ad-server impressions for that date", constraints: ">= 0" }
      - { name: clicks, type: integer, source: input, description: "Clicks for that date", constraints: ">= 0 and <= impressions" }
      - { name: spend_cents, type: integer, source: computed, description: "round_half_up(impressions × line_item.cpm_rate_cents / 1000) at posting time" }
      - { name: status, type: enum, source: system, description: "POSTED → VOIDED (VOID reverses the snapshot out of all aggregates)" }

  - name: ImpressionEvent
    parent: null
    common_fields: false
    fields:
      - { name: line_item_id, type: string, source: input, description: "FK -> LineItem.id" }
      - { name: user_key, type: string, source: input, description: "Anonymous user identifier the frequency cap is enforced against" }
      - { name: occurred_at, type: datetime, source: input, description: "Event timestamp; defaults to the server's logical clock when omitted", default: "logical clock now" }

  - name: VerificationReport
    parent: null
    common_fields: true
    fields:
      - { name: line_item_id, type: string, source: input, description: "FK -> LineItem.id" }
      - { name: vendor, type: enum, source: input, description: "MOAT | IAS | DOUBLEVERIFY" }
      - { name: period_start, type: datetime, source: input, description: "Measurement period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Measurement period end (INCLUSIVE — closed interval semantics)" }
      - { name: measured_impressions, type: integer, source: input, description: "Vendor-measured impressions", constraints: "> 0" }
      - { name: viewable_impressions, type: integer, source: input, description: "Vendor-measured viewable impressions", constraints: ">= 0 and <= measured_impressions" }
      - { name: ivt_impressions, type: integer, source: input, description: "Vendor-measured invalid-traffic impressions", constraints: ">= 0 and <= measured_impressions" }
      - { name: viewability_rate, type: number, source: computed, description: "viewable_impressions / measured_impressions, 4 decimal places round_half_up" }
      - { name: ivt_rate, type: number, source: computed, description: "ivt_impressions / measured_impressions, 4 decimal places round_half_up" }
      - { name: assessment, type: enum, source: system, description: "PASS | BREACH — BREACH iff viewability_rate < threshold OR ivt_rate > threshold (thresholds from the parent IO)" }
      - { name: make_good_max_credit_cents, type: integer, source: computed, description: "round_half_up((ivt_impressions + viewability_shortfall_impressions) × cpm / 1000); ceiling for CREDIT make-goods" }
      - { name: status, type: enum, source: system, description: "OPEN → CLOSED; CLOSE requires every MakeGood on this report to be terminal" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the VerificationAnalyst who filed the report" }

  - name: MakeGood
    parent: null
    common_fields: true
    fields:
      - { name: verification_report_id, type: string, source: input, description: "FK -> VerificationReport.id; report whose BREACH this compensates" }
      - { name: kind, type: enum, source: input, description: "CREDIT | BONUS_IMPRESSIONS" }
      - { name: credit_cents, type: integer, source: input, description: "Required when kind=CREDIT; must be > 0 and <= report.make_good_max_credit_cents", default: null }
      - { name: bonus_impressions, type: integer, source: input, description: "Required when kind=BONUS_IMPRESSIONS; must be > 0", default: null }
      - { name: status, type: enum, source: system, description: "PROPOSED → APPROVED → APPLIED; PROPOSED → REJECTED → (REVISE → PROPOSED); APPLIED → REVERSED" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of proposing VerificationAnalyst" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the BillingManager who last approved/rejected; must differ from proposed_by_user_id" }

  - name: Reconciliation
    parent: null
    common_fields: true
    fields:
      - { name: line_item_id, type: string, source: input, description: "FK -> LineItem.id" }
      - { name: period_start, type: datetime, source: input, description: "Billing period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Billing period end (EXCLUSIVE — half-open interval semantics)" }
      - { name: third_party_impressions, type: integer, source: input, description: "Impressions counted by the third-party ad tag for this period", constraints: ">= 0" }
      - { name: agency_impressions, type: integer, source: computed, description: "Sum of impressions over this line item's POSTED DeliverySnapshots with snapshot_date in [period_start, period_end)" }
      - { name: discrepancy_pct, type: number, source: computed, description: "(third_party − agency) / agency, 4dp round_half_up; null when agency_impressions == 0" }
      - { name: billing_impressions, type: integer, source: computed, description: "Billable impressions per IO.billing_basis (see calculations.billing_impressions); null until RECONCILE" }
      - { name: billable_cents, type: integer, source: computed, description: "round_half_up(billing_impressions × cpm / 1000); null until RECONCILE" }
      - { name: status, type: enum, source: system, description: "OPEN → RECONCILED → LOCKED; RECONCILED → OPEN via REOPEN" }
      - { name: reconciled_by_user_id, type: string, source: system, description: "X-User-ID of the BillingManager who ran RECONCILE" }
      - { name: locked_by_user_id, type: string, source: system, description: "X-User-ID of the BillingManager who ran LOCK; must differ from reconciled_by_user_id" }

  - name: WrapReport
    parent: null
    common_fields: true
    fields:
      - { name: io_id, type: string, source: input, description: "FK -> InsertionOrder.id" }
      - { name: attribution_model, type: enum, source: input, description: "LINEAR_CLICKS | VIEW_WEIGHTED" }
      - { name: total_conversions, type: integer, source: input, description: "Total conversions to attribute across the IO's line items", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT → FINALIZED" }
      - { name: total_delivered_impressions, type: integer, source: computed, description: "Sum of delivered_impressions over the IO's non-CANCELLED line items" }
      - { name: total_spend_cents, type: integer, source: computed, description: "Sum of delivered_spend_cents over the IO's non-CANCELLED line items" }
      - { name: total_billable_cents, type: integer, source: computed, description: "Sum of billable_cents over LOCKED Reconciliations of the IO's line items (per-reconciliation rounding, then summed)" }
      - { name: total_applied_credit_cents, type: integer, source: computed, description: "Copy of IO.total_applied_credit_cents at generation time" }
      - { name: net_billable_cents, type: integer, source: computed, description: "max(0, total_billable_cents − total_applied_credit_cents)" }
      - { name: attribution, type: array, source: computed, description: "Per line item: {line_item_id, weight, attributed_conversions}; largest-remainder rounding, ties broken by line item created_at ASC" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: InsertionOrder
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /insertion-orders/{id}/transition (action=APPROVE)"
        actor: AdOpsManager
        preconditions: ["at least one non-CANCELLED LineItem exists for this IO"]
        side_effects: ["increments InsertionOrder.version by 1"]
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /insertion-orders/{id}/transition (action=ACTIVATE)"
        actor: AdOpsManager
        preconditions: ["at least one LineItem of this IO has status == LIVE"]
        side_effects: ["increments InsertionOrder.version by 1"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /insertion-orders/{id}/transition (action=COMPLETE)"
        actor: AdOpsManager
        preconditions:
          - "logical clock current date is strictly greater than flight_end"
          - "every LineItem of this IO has status IN {COMPLETED, CANCELLED}"
        side_effects: ["increments InsertionOrder.version by 1"]
      - from: COMPLETED
        to: CLOSED
        trigger: "system (WrapReport FINALIZE side effect)"
        actor: system
        preconditions: []
        side_effects: ["increments InsertionOrder.version by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /insertion-orders/{id}/transition (action=CANCEL)"
        actor: AdOpsManager
        preconditions: []
        side_effects:
          - "every LineItem of this IO with status NOT IN {COMPLETED, CANCELLED} transitions to CANCELLED"
          - "that LineItem cancellation itself cascades: every Creative of such a LineItem with status NOT IN {ARCHIVED} transitions to ARCHIVED"
          - "increments InsertionOrder.version by 1"
        note: "Cascade chain: IO.CANCELLED → LineItem.CANCELLED → Creative.ARCHIVED (depth 2)."
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /insertion-orders/{id}/transition (action=CANCEL)"
        actor: AdOpsManager
        preconditions: []
        side_effects: ["same LineItem/Creative cascade as DRAFT→CANCELLED", "increments InsertionOrder.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /insertion-orders/{id}/transition (action=CANCEL)"
        actor: AdOpsManager
        preconditions: []
        side_effects: ["same LineItem/Creative cascade as DRAFT→CANCELLED", "increments InsertionOrder.version by 1"]

  - entity: LineItem
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: TRAFFICKED
        trigger: "POST /line-items/{id}/transition (action=TRAFFIC)"
        actor: Trafficker
        preconditions:
          - "at least one Creative of this line item has status == TAGGED (ERR_NO_TAGGED_CREATIVE)"
        side_effects: ["increments LineItem.version by 1"]
      - from: TRAFFICKED
        to: LIVE
        trigger: "POST /line-items/{id}/transition (action=LAUNCH)"
        actor: Trafficker
        preconditions:
          - "parent InsertionOrder.status IN {APPROVED, ACTIVE} (ERR_IO_NOT_APPROVED)"
          - "logical clock current date >= start_date (ERR_FLIGHT_NOT_STARTED) and <= end_date"
          - "fraud_posture == CLEAR (ERR_FRAUD_HOLD)"
          - "at least one Creative of this line item has status IN {TAGGED, LIVE}"
        side_effects:
          - "every Creative of this line item with status == TAGGED transitions to LIVE"
          - "increments LineItem.version by 1"
      - from: LIVE
        to: PAUSED
        trigger: "POST /line-items/{id}/transition (action=PAUSE) or system (IVT-breach fraud cascade)"
        actor: "Trafficker or system"
        preconditions: []
        side_effects:
          - "every Creative of this line item with status == LIVE transitions to PAUSED"
          - "increments LineItem.version by 1"
      - from: PAUSED
        to: LIVE
        trigger: "POST /line-items/{id}/transition (action=RESUME)"
        actor: Trafficker
        preconditions:
          - "fraud_posture == CLEAR (ERR_FRAUD_HOLD)"
          - "logical clock current date <= end_date"
        side_effects:
          - "every Creative of this line item with status == PAUSED transitions to LIVE"
          - "increments LineItem.version by 1"
      - from: LIVE
        to: COMPLETED
        trigger: "POST /line-items/{id}/transition (action=COMPLETE) or system (delivered_impressions >= goal_impressions after a DeliverySnapshot post)"
        actor: "Trafficker or system"
        preconditions:
          - "manual: logical clock current date > end_date; automatic: delivered_impressions >= goal_impressions"
        side_effects:
          - "every Creative of this line item with status IN {LIVE, PAUSED} transitions to ARCHIVED"
          - "increments LineItem.version by 1"
      - from: PAUSED
        to: COMPLETED
        trigger: "POST /line-items/{id}/transition (action=COMPLETE)"
        actor: Trafficker
        preconditions: ["logical clock current date > end_date"]
        side_effects:
          - "every Creative of this line item with status == PAUSED transitions to ARCHIVED"
          - "increments LineItem.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /line-items/{id}/transition (action=CANCEL) or system (IO cancel cascade)"
        actor: "Trafficker or system"
        preconditions: []
        side_effects:
          - "every Creative of this line item with status NOT IN {ARCHIVED} transitions to ARCHIVED"
          - "increments LineItem.version by 1; InsertionOrder.booked_budget_cents recomputed"
      - from: TRAFFICKED
        to: CANCELLED
        trigger: "POST /line-items/{id}/transition (action=CANCEL) or system (IO cancel cascade)"
        actor: "Trafficker or system"
        preconditions: []
        side_effects: ["same Creative-ARCHIVED cascade as DRAFT→CANCELLED", "increments LineItem.version by 1; booked_budget_cents recomputed"]
      - from: LIVE
        to: CANCELLED
        trigger: "POST /line-items/{id}/transition (action=CANCEL) or system (IO cancel cascade)"
        actor: "Trafficker or system"
        preconditions: []
        side_effects: ["same Creative-ARCHIVED cascade as DRAFT→CANCELLED", "increments LineItem.version by 1; booked_budget_cents recomputed"]
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /line-items/{id}/transition (action=CANCEL) or system (IO cancel cascade)"
        actor: "Trafficker or system"
        preconditions: []
        side_effects: ["same Creative-ARCHIVED cascade as DRAFT→CANCELLED", "increments LineItem.version by 1; booked_budget_cents recomputed"]
      - from: LIVE
        to: LIVE
        trigger: "POST /line-items/{id}/transition (action=CLEAR_FRAUD)"
        actor: Trafficker
        preconditions: ["fraud_posture == BREACH"]
        side_effects: ["fraud_posture := CLEAR", "increments LineItem.version by 1"]
        note: "Self-transition that only mutates fraud_posture; status unchanged."
      - from: PAUSED
        to: PAUSED
        trigger: "POST /line-items/{id}/transition (action=CLEAR_FRAUD)"
        actor: Trafficker
        preconditions: ["fraud_posture == BREACH"]
        side_effects: ["fraud_posture := CLEAR", "increments LineItem.version by 1"]

  - entity: Creative
    field: status
    initial_state: UPLOADED
    terminal_states: [ARCHIVED]
    transitions:
      - from: UPLOADED
        to: IN_QA
        trigger: "POST /creatives/{id}/transition (action=SUBMIT_QA)"
        actor: Trafficker
        preconditions: []
        side_effects: ["increments Creative.version by 1"]
      - from: IN_QA
        to: QA_PASSED
        trigger: "POST /creatives/{id}/transition (action=PASS_QA)"
        actor: Trafficker
        preconditions: []
        side_effects: ["increments Creative.version by 1"]
      - from: IN_QA
        to: QA_FAILED
        trigger: "POST /creatives/{id}/transition (action=FAIL_QA)"
        actor: Trafficker
        preconditions: ["qa_failure_reason payload field present and non-empty (ERR_TAG_REQUIRED)"]
        side_effects: ["qa_failure_reason := payload value", "increments Creative.version by 1"]
      - from: QA_FAILED
        to: IN_QA
        trigger: "POST /creatives/{id}/transition (action=REVISE)"
        actor: Trafficker
        preconditions: []
        side_effects: ["qa_failure_reason := null", "increments Creative.version by 1"]
        note: "Revision loop: IN_QA → QA_FAILED → IN_QA (cyclic)."
      - from: QA_PASSED
        to: TAGGED
        trigger: "POST /creatives/{id}/transition (action=TAG)"
        actor: Trafficker
        preconditions: ["ad_tag payload field present and non-empty (ERR_TAG_REQUIRED)"]
        side_effects: ["ad_tag := payload value", "increments Creative.version by 1"]
      - from: TAGGED
        to: LIVE
        trigger: "POST /creatives/{id}/transition (action=ACTIVATE) or system (line item LAUNCH side effect)"
        actor: "Trafficker or system"
        preconditions: ["manual: parent LineItem.status == LIVE (ERR_LINE_ITEM_NOT_LIVE); manual: parent LineItem.fraud_posture == CLEAR (ERR_FRAUD_HOLD)"]
        side_effects: ["increments Creative.version by 1"]
      - from: LIVE
        to: PAUSED
        trigger: "system (line item PAUSE side effect, incl. fraud cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments Creative.version by 1"]
      - from: PAUSED
        to: LIVE
        trigger: "system (line item RESUME side effect)"
        actor: system
        preconditions: []
        side_effects: ["increments Creative.version by 1"]
      - from: LIVE
        to: ARCHIVED
        trigger: "system (line item COMPLETE/CANCEL cascade) or POST /creatives/{id}/transition (action=ARCHIVE)"
        actor: "system or Trafficker"
        preconditions: []
        side_effects: ["increments Creative.version by 1"]
      - from: PAUSED
        to: ARCHIVED
        trigger: "system (line item COMPLETE/CANCEL cascade) or POST /creatives/{id}/transition (action=ARCHIVE)"
        actor: "system or Trafficker"
        preconditions: []
        side_effects: ["increments Creative.version by 1"]
      - from: TAGGED
        to: ARCHIVED
        trigger: "system (line item CANCEL cascade) or POST /creatives/{id}/transition (action=ARCHIVE)"
        actor: "system or Trafficker"
        preconditions: []
        side_effects: ["increments Creative.version by 1"]
      - from: UPLOADED
        to: ARCHIVED
        trigger: "system (line item CANCEL cascade) or POST /creatives/{id}/transition (action=ARCHIVE)"
        actor: "system or Trafficker"
        preconditions: []
        side_effects: ["increments Creative.version by 1"]
      - from: IN_QA
        to: ARCHIVED
        trigger: "system (line item CANCEL cascade) or POST /creatives/{id}/transition (action=ARCHIVE)"
        actor: "system or Trafficker"
        preconditions: []
        side_effects: ["increments Creative.version by 1"]
      - from: QA_PASSED
        to: ARCHIVED
        trigger: "system (line item CANCEL cascade) or POST /creatives/{id}/transition (action=ARCHIVE)"
        actor: "system or Trafficker"
        preconditions: []
        side_effects: ["increments Creative.version by 1"]
      - from: QA_FAILED
        to: ARCHIVED
        trigger: "system (line item CANCEL cascade) or POST /creatives/{id}/transition (action=ARCHIVE)"
        actor: "system or Trafficker"
        preconditions: []
        side_effects: ["increments Creative.version by 1"]

  - entity: DeliverySnapshot
    field: status
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /delivery-snapshots/{id}/transition (action=VOID)"
        actor: Trafficker
        preconditions: []
        side_effects:
          - "LineItem.delivered_impressions / delivered_clicks / delivered_spend_cents recomputed over POSTED snapshots only"
          - "pacing fields recomputed"
        note: "VOID is the compensating action of POST /delivery-snapshots (see invariants)."

  - entity: VerificationReport
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /verification-reports/{id}/transition (action=CLOSE_REPORT)"
        actor: VerificationAnalyst
        preconditions: ["every MakeGood with verification_report_id == this report has status IN {REJECTED, APPLIED, REVERSED} (ERR_UNRESOLVED_MAKE_GOODS)"]
        side_effects: ["increments VerificationReport.version by 1"]
    note: "assessment (PASS/BREACH) is computed at creation; on IVT breach the fraud cascade fires: LineItem.fraud_posture := BREACH → LineItem LIVE→PAUSED → its LIVE Creatives → PAUSED."

  - entity: MakeGood
    field: status
    initial_state: PROPOSED
    terminal_states: [REJECTED, APPLIED, REVERSED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /make-goods/{id}/transition (action=APPROVE)"
        actor: BillingManager
        preconditions: ["X-User-ID != proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["decided_by_user_id := X-User-ID", "increments MakeGood.version by 1"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /make-goods/{id}/transition (action=REJECT)"
        actor: BillingManager
        preconditions: ["X-User-ID != proposed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["decided_by_user_id := X-User-ID", "increments MakeGood.version by 1"]
      - from: REJECTED
        to: PROPOSED
        trigger: "POST /make-goods/{id}/transition (action=REVISE)"
        actor: VerificationAnalyst
        preconditions: []
        side_effects: ["decided_by_user_id := null", "increments MakeGood.version by 1"]
        note: "Negotiation loop: PROPOSED → REJECTED → PROPOSED (cyclic)."
      - from: APPROVED
        to: APPLIED
        trigger: "POST /make-goods/{id}/transition (action=APPLY)"
        actor: BillingManager
        preconditions: []
        side_effects:
          - "InsertionOrder.total_applied_credit_cents recomputed (credit_cents now counted)"
          - "increments MakeGood.version by 1"
      - from: APPLIED
        to: REVERSED
        trigger: "POST /make-goods/{id}/transition (action=REVERSE)"
        actor: BillingManager
        preconditions: []
        side_effects:
          - "InsertionOrder.total_applied_credit_cents recomputed (credit_cents no longer counted)"
          - "increments MakeGood.version by 1"
        note: "REVERSE is the compensating action of APPLY (see invariants)."

  - entity: Reconciliation
    field: status
    initial_state: OPEN
    terminal_states: [LOCKED]
    transitions:
      - from: OPEN
        to: RECONCILED
        trigger: "POST /reconciliations/{id}/transition (action=RECONCILE)"
        actor: BillingManager
        preconditions: []
        side_effects:
          - "agency_impressions recomputed from current POSTED DeliverySnapshots in [period_start, period_end)"
          - "discrepancy_pct, billing_impressions, billable_cents computed per calculations.billing_impressions"
          - "reconciled_by_user_id := X-User-ID"
          - "increments Reconciliation.version by 1"
      - from: RECONCILED
        to: LOCKED
        trigger: "POST /reconciliations/{id}/transition (action=LOCK)"
        actor: BillingManager
        preconditions:
          - "X-User-ID != reconciled_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "no MakeGood on a VerificationReport of this line item whose period overlaps [period_start, period_end) has status IN {PROPOSED, APPROVED} (ERR_UNRESOLVED_MAKE_GOODS)"
        side_effects: ["locked_by_user_id := X-User-ID", "increments Reconciliation.version by 1"]
      - from: RECONCILED
        to: OPEN
        trigger: "POST /reconciliations/{id}/transition (action=REOPEN)"
        actor: BillingManager
        preconditions: []
        side_effects: ["reconciled_by_user_id := null", "increments Reconciliation.version by 1"]
        note: "Reopen loop: OPEN → RECONCILED → OPEN → RECONCILED (cyclic)."

  - entity: WrapReport
    field: status
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /wrap-reports/{id}/transition (action=FINALIZE)"
        actor: BillingManager
        preconditions: []
        side_effects:
          - "parent InsertionOrder.status := CLOSED (COMPLETED → CLOSED)"
          - "increments WrapReport.version by 1"

# =============================================================================
# Table 2.1: Concurrency Rules (OCC)
# =============================================================================
concurrency_rules:
  - rule_id: line-item-optimization-stale-version
    parent_entity: LineItem
    write_endpoint: "PATCH /line-items/{id}"
    occ_field: "expected_line_item_version"
    description: |
      A mid-flight optimization write (PATCH) against a LineItem whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another writer has just modified goals, pacing, or caps
      and the current writer's view of the line item is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: line_item_budget
    trigger: "LineItem create; PATCH /line-items/{id} when goal_impressions or cpm changes; LineItem CANCEL (removes from sum)"
    algorithm: aggregation
    formula: |
      budget_cents = round_half_up(goal_impressions × cpm_rate_cents / 1000)
      InsertionOrder.booked_budget_cents = sum of budget_cents over LineItems with status != CANCELLED
    input_set: "LineItems of the IO with status != CANCELLED"
    precision: "integer cents, round_half_up"

  - name: snapshot_spend
    trigger: "DeliverySnapshot creation"
    algorithm: aggregation
    formula: |
      spend_cents = round_half_up(impressions × line_item.cpm_rate_cents / 1000)
      LineItem.delivered_impressions = sum(impressions) over snapshots with status == POSTED
      LineItem.delivered_clicks     = sum(clicks)     over snapshots with status == POSTED
      LineItem.delivered_spend_cents = sum(spend_cents) over snapshots with status == POSTED
      After recompute: if delivered_impressions >= goal_impressions and status == LIVE → auto-COMPLETED
    input_set: "DeliverySnapshots of the line item with status == POSTED (VOIDED excluded)"
    precision: "integer cents, round_half_up"

  - name: pacing_projection
    trigger: "DeliverySnapshot create/VOID; LineItem create/PATCH; read of LineItem"
    algorithm: forward_looking
    formula: |
      total_days = (end_date − start_date) in whole days + 1
      elapsed_days = clamp((logical_current_date − start_date) in whole days, 0, total_days)
      remaining_days = total_days − elapsed_days
      pacing_projection_impressions (lifetime_average variant):
        rate = delivered_impressions / elapsed_days   (elapsed_days == 0 → projection = delivered_impressions)
        projection = delivered_impressions + remaining_days × rate
      round_half_up to integer impressions.
    input_set: "POSTED DeliverySnapshots of the line item; logical clock for current date"
    constants:
      TRAILING_WINDOW_DAYS: 3
      PACING_ALERT_RATIO: 0.90
    precision: "integer impressions, round_half_up"
    variants:
      - name: trailing_3_day
        when: "always computed alongside; exposed as pacing_projection_trailing_impressions"
        difference: "rate = (sum of impressions over POSTED snapshots with snapshot_date in [current_date − 2 days, current_date]) / TRAILING_WINDOW_DAYS — window is 3 calendar days ending today, missing days count as 0"

  - name: pacing_expected
    trigger: "read of LineItem (pacing_alert field)"
    algorithm: threshold
    formula: |
      EVEN: expected_to_date = goal_impressions × elapsed_days / total_days
      ASAP: expected_to_date = goal_impressions
      pacing_alert = (delivered_impressions < PACING_ALERT_RATIO × expected_to_date)
    input_set: "line item fields + logical clock"
    constants:
      PACING_ALERT_RATIO: 0.90
    precision: "exact real comparison; no rounding"

  - name: frequency_cap_check
    trigger: "POST /impression-events (before persisting)"
    algorithm: threshold
    formula: |
      if line_item.frequency_cap_max_impressions is null → accept
      window = [now − frequency_cap_window_hours, now)   # half-open: an event exactly window_hours old is EXCLUDED
      count = number of ImpressionEvents with line_item_id == this line item,
              user_key == payload user_key, occurred_at ∈ window
      if count >= frequency_cap_max_impressions → reject ERR_FREQUENCY_CAP_EXCEEDED
      else persist event
    input_set: "ImpressionEvents of the same (line_item_id, user_key) — ACROSS all placements (placement is not a separate entity; the cap is line-item-wide per user)"
    precision: "integer count comparison, >= rejects (exactly cap−1 accepts, exactly cap rejects)"

  - name: verification_assessment
    trigger: "POST /verification-reports (at creation)"
    algorithm: threshold
    formula: |
      viewability_rate = round_half_up(viewable_impressions / measured_impressions, 4dp)
      ivt_rate         = round_half_up(ivt_impressions / measured_impressions, 4dp)
      thresholds from parent IO: V = viewability_threshold_pct, I = ivt_threshold_pct
      viewability_shortfall_impressions = max(0, ceil(V × measured_impressions) − viewable_impressions)
      make_good_max_credit_cents = round_half_up((ivt_impressions + viewability_shortfall_impressions) × line_item.cpm_rate_cents / 1000)
      assessment = BREACH iff (viewability_rate < V) OR (ivt_rate > I)   # equality with a threshold PASSES
      FRAUD CASCADE (only when ivt_rate > I):
        LineItem.fraud_posture := BREACH
        → if LineItem.status == LIVE → PAUSED (auto)
        → that pause cascades: every Creative of the line item with status == LIVE → PAUSED
    input_set: "payload counts; parent IO thresholds; line item cpm"
    precision: "rates 4 decimal places round_half_up; credit integer cents round_half_up"

  - name: billing_impressions
    trigger: "Reconciliation RECONCILE"
    algorithm: tiered_pricing
    formula: |
      agency_impressions = sum of impressions over POSTED DeliverySnapshots of the line item
                           with snapshot_date in [period_start, period_end)   # half-open
      discrepancy_pct = agency_impressions == 0 ? null
                      : round_half_up((third_party_impressions − agency_impressions) / agency_impressions, 4dp)
      basis = line_item.io.billing_basis
      AGENCY_PLATFORM:   billing_impressions = agency_impressions
      THIRD_PARTY_TAG:   billing_impressions = third_party_impressions
      LOWER_OF:          if agency_impressions == 0 → billing_impressions = 0
                         elif abs(discrepancy_pct) > DISCREPANCY_TOLERANCE → billing_impressions = min(agency, third_party)
                         else → billing_impressions = agency_impressions
      billable_cents = round_half_up(billing_impressions × cpm_rate_cents / 1000)
    input_set: "POSTED snapshots in half-open period; third_party_impressions payload; IO.billing_basis"
    constants:
      DISCREPANCY_TOLERANCE: 0.10
    precision: "discrepancy 4dp round_half_up; billable integer cents round_half_up"
    variants:
      - name: agency_platform_basis
        when: "IO.billing_basis == AGENCY_PLATFORM"
        difference: "bills the agency ad-server number regardless of third-party count"
      - name: third_party_tag_basis
        when: "IO.billing_basis == THIRD_PARTY_TAG"
        difference: "bills the third-party tag number regardless of agency count"
      - name: lower_of_gated
        when: "IO.billing_basis == LOWER_OF"
        difference: "bills min(agency, third_party) ONLY when |discrepancy_pct| > 0.10; otherwise bills agency"

  - name: wrap_report_totals
    trigger: "POST /wrap-reports (at generation; FINALIZE locks the stored values)"
    algorithm: aggregation
    formula: |
      line items = LineItems of the IO with status != CANCELLED
      total_delivered_impressions = sum(delivered_impressions)
      total_spend_cents           = sum(delivered_spend_cents)
      total_billable_cents        = sum(billable_cents over LOCKED Reconciliations of those line items)
      # ROUNDING ORDER PINNED: billable_cents is rounded per reconciliation FIRST, then summed.
      # (sum-then-round over raw products yields a different cent total — see difficulty design.)
      total_applied_credit_cents  = IO.total_applied_credit_cents at generation time
      net_billable_cents          = max(0, total_billable_cents − total_applied_credit_cents)
    input_set: "non-CANCELLED line items; LOCKED reconciliations only; APPLIED make-goods only"
    precision: "integer cents"

  - name: attribution
    trigger: "POST /wrap-reports (at generation)"
    algorithm: weighted_scoring
    formula: |
      LINEAR_CLICKS:   weight_li = delivered_clicks_li / sum(delivered_clicks)
      VIEW_WEIGHTED:   weight_li = viewable_li / sum(viewable_li), where
                       viewable_li = sum of viewable_impressions over ALL VerificationReports of li (any assessment)
      denominator == 0 → equal weights 1/N for every non-CANCELLED line item
      raw_li = total_conversions × weight_li
      attributed_li = largest-remainder rounding of raw_li to integers summing EXACTLY to total_conversions;
                      ties on fractional remainder broken by line item created_at ASC (earliest first)
    input_set: "non-CANCELLED line items of the IO"
    precision: "integer conversions, largest-remainder"
    variants:
      - name: linear_clicks
        when: "attribution_model == LINEAR_CLICKS"
        difference: "weights from agency click counts"
      - name: view_weighted
        when: "attribution_model == VIEW_WEIGHTED"
        difference: "weights from vendor viewable impressions — diverges from LINEAR_CLICKS on identical delivery data"

# =============================================================================
# Named invariants (compensating-action pairs)
# =============================================================================
invariants:
  - name: delivered_volume_post_void
    formula: "LineItem.delivered_impressions == sum(impressions) over its DeliverySnapshots with status == POSTED"
    pair: "POST /delivery-snapshots (forward) ↔ POST /delivery-snapshots/{id}/transition VOID (compensate)"
    statement: "After a POST followed by VOID of the same snapshot, delivered_impressions, delivered_clicks and delivered_spend_cents return to their pre-pair values."
  - name: applied_credit_apply_reverse
    formula: "InsertionOrder.total_applied_credit_cents == sum(credit_cents) over MakeGoods with status == APPLIED whose report's line item belongs to the IO"
    pair: "POST /make-goods/{id}/transition APPLY (forward) ↔ REVERSE (compensate)"
    statement: "After APPLY followed by REVERSE of the same make-good, InsertionOrder.total_applied_credit_cents returns to its pre-pair value."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is known", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: business_constraint, check: "Request body schema: required fields present, types correct, enum members valid, cross-field consistency (viewable <= measured, ivt <= measured, clicks <= impressions, end_date >= start_date, period_end > period_start, measured_impressions > 0, amounts > 0 where required)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 4, category: existence, check: "Path ids and body FK references exist (io_id, line_item_id, verification_report_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "OCC: expected_line_item_version matches current LineItem.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["PATCH /line-items/{id}"] }
  - { priority: 6, category: state, check: "Target resource in a valid from-state for the requested action (incl. PATCH only in LIVE/PAUSED; VOID only from POSTED; IO transitions; wrap generate requires IO COMPLETED; line-item create requires IO NOT IN {COMPLETED, CLOSED, CANCELLED}; snapshots require line item IN {LIVE, PAUSED, COMPLETED}; impression events require line item LIVE; verification reports require line item NOT IN {DRAFT, CANCELLED})", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints, PATCH /line-items/{id}, POST /wrap-reports, POST /line-items, POST /delivery-snapshots, POST /impression-events, POST /verification-reports" }
  - { priority: 7, category: business_safety, check: "fraud_posture == CLEAR for LAUNCH / RESUME / creative ACTIVATE", error_id: ERR_FRAUD_HOLD, http_status: 409, applies_to: ["POST /line-items/{id}/transition", "POST /creatives/{id}/transition"] }
  - { priority: 8, category: business_temporal, check: "8a: line item start/end within IO flight", error_id: ERR_FLIGHT_WINDOW_VIOLATION, http_status: 422, applies_to: ["POST /line-items", "PATCH /line-items/{id}"] }
  - { priority: 9, category: business_temporal, check: "8b: LAUNCH only when current date within [start_date, end_date]", error_id: ERR_FLIGHT_NOT_STARTED, http_status: 422, applies_to: ["POST /line-items/{id}/transition"] }
  - { priority: 10, category: business_temporal, check: "8c: snapshot_date within line item [start_date, end_date]", error_id: ERR_SNAPSHOT_OUT_OF_FLIGHT, http_status: 422, applies_to: ["POST /delivery-snapshots"] }
  - { priority: 11, category: business_temporal, check: "8d: no overlapping Reconciliation period for the same line item (half-open: [start,end) — adjacency allowed)", error_id: ERR_RECONCILIATION_OVERLAP, http_status: 409, applies_to: ["POST /reconciliations"] }
  - { priority: 12, category: business_temporal, check: "8e: no overlapping VerificationReport period for the same (line_item_id, vendor) (CLOSED interval: touching periods conflict)", error_id: ERR_VERIFICATION_PERIOD_OVERLAP, http_status: 409, applies_to: ["POST /verification-reports"] }
  - { priority: 13, category: business_referential, check: "line item must have >= 1 TAGGED creative for TRAFFIC", error_id: ERR_NO_TAGGED_CREATIVE, http_status: 409, applies_to: ["POST /line-items/{id}/transition"] }
  - { priority: 14, category: business_referential, check: "line item launch/activate guards: IO must be APPROVED/ACTIVE for LAUNCH", error_id: ERR_IO_NOT_APPROVED, http_status: 409, applies_to: ["POST /line-items/{id}/transition"] }
  - { priority: 15, category: business_referential, check: "creative ACTIVATE requires parent line item LIVE", error_id: ERR_LINE_ITEM_NOT_LIVE, http_status: 409, applies_to: ["POST /creatives/{id}/transition"] }
  - { priority: 16, category: business_referential, check: "make-good requires report.assessment == BREACH and report.status == OPEN", error_id: ERR_NO_BREACH, http_status: 409, applies_to: ["POST /make-goods"] }
  - { priority: 17, category: business_referential, check: "wrap generation requires every Reconciliation of the IO's line items to be LOCKED", error_id: ERR_RECONCILIATION_NOT_LOCKED, http_status: 409, applies_to: ["POST /wrap-reports"] }
  - { priority: 18, category: business_referential, check: "report close / reconciliation LOCK blocked while any related MakeGood is PROPOSED or APPROVED", error_id: ERR_UNRESOLVED_MAKE_GOODS, http_status: 409, applies_to: ["POST /verification-reports/{id}/transition", "POST /reconciliations/{id}/transition"] }
  - { priority: 19, category: business_constraint, check: "segregation of duties: make-good APPROVE/REJECT user != proposed_by_user_id; reconciliation LOCK user != reconciled_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /make-goods/{id}/transition", "POST /reconciliations/{id}/transition"] }
  - { priority: 20, category: business_constraint, check: "no duplicate DeliverySnapshot for (line_item_id, snapshot_date) regardless of status", error_id: ERR_DUPLICATE_SNAPSHOT, http_status: 409, applies_to: ["POST /delivery-snapshots"] }
  - { priority: 21, category: business_constraint, check: "frequency cap: window count >= cap", error_id: ERR_FREQUENCY_CAP_EXCEEDED, http_status: 422, applies_to: ["POST /impression-events"] }
  - { priority: 22, category: business_constraint, check: "TAG transition requires non-empty ad_tag; FAIL_QA requires qa_failure_reason", error_id: ERR_TAG_REQUIRED, http_status: 400, applies_to: ["POST /creatives/{id}/transition"] }
  - { priority: 23, category: business_fiscal, check: "sum of non-CANCELLED line-item budget_cents must stay <= IO.total_budget_cents", error_id: ERR_BUDGET_EXCEEDED, http_status: 422, applies_to: ["POST /line-items", "PATCH /line-items/{id}"] }
  - { priority: 24, category: business_fiscal, check: "CREDIT make-good credit_cents <= report.make_good_max_credit_cents", error_id: ERR_CREDIT_EXCEEDS_BASIS, http_status: 422, applies_to: ["POST /make-goods"] }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock (test-driving endpoint). Server startup default is 2026-08-01T00:00:00Z; the logical clock NEVER falls back to wall-clock time.", roles: [AdOpsManager], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }

  - method: POST
    path: "/insertion-orders"
    description: "Create an insertion order"
    roles: [AdOpsManager]
    code: 201
    input: [advertiser_name, total_budget_cents, flight_start, flight_end, billing_basis, "viewability_threshold_pct?", "ivt_threshold_pct?"]
    output: InsertionOrder
    side_effects: ["status=DRAFT", "booked_budget_cents=0", "total_applied_credit_cents=0"]
  - method: GET
    path: "/insertion-orders/{id}"
    description: "Get one insertion order"
    roles: [AdOpsManager, Trafficker, VerificationAnalyst, BillingManager]
    code: 200
    input: []
    output: InsertionOrder
    side_effects: []
  - method: POST
    path: "/insertion-orders/{id}/transition"
    description: "IO lifecycle: APPROVE | ACTIVATE | COMPLETE | CANCEL"
    roles: [AdOpsManager]
    code: 200
    input: [action]
    output: InsertionOrder
    side_effects: ["state transition per §1.2", "CANCEL cascades to line items and creatives", "increments InsertionOrder.version by 1"]

  - method: POST
    path: "/line-items"
    description: "Create a line item with targeting, pacing, and frequency-cap configuration"
    roles: [Trafficker]
    code: 201
    input: [io_id, name, goal_impressions, cpm_rate_cents, start_date, end_date, pacing_mode, "targeting?", "frequency_cap_max_impressions?", "frequency_cap_window_hours?"]
    output: LineItem
    side_effects: ["status=DRAFT", "fraud_posture=CLEAR", "budget_cents computed", "IO.booked_budget_cents recomputed", "ERR_BUDGET_EXCEEDED when aggregate exceeds IO budget"]
  - method: GET
    path: "/line-items"
    description: "List line items; filterable by io_id and status"
    roles: [AdOpsManager, Trafficker, VerificationAnalyst, BillingManager]
    code: 200
    input: ["io_id?", "status?", "limit?", "offset?"]
    output: LineItem[]
    side_effects: []
  - method: GET
    path: "/line-items/{id}"
    description: "Get one line item (incl. computed delivery/pacing fields)"
    roles: [AdOpsManager, Trafficker, VerificationAnalyst, BillingManager]
    code: 200
    input: []
    output: LineItem
    side_effects: []
  - method: PATCH
    path: "/line-items/{id}"
    description: "Mid-flight optimization edit; OCC-guarded"
    roles: [Trafficker]
    code: 200
    input: [expected_line_item_version, "goal_impressions?", "cpm_rate_cents?", "pacing_mode?", "start_date?", "end_date?", "frequency_cap_max_impressions?", "frequency_cap_window_hours?"]
    output: LineItem
    side_effects: ["only in status LIVE or PAUSED", "increments LineItem.version by 1", "budget_cents + IO.booked_budget_cents recomputed (ERR_BUDGET_EXCEEDED)", "date changes re-checked against IO flight (ERR_FLIGHT_WINDOW_VIOLATION)"]
  - method: POST
    path: "/line-items/{id}/transition"
    description: "Line item lifecycle: TRAFFIC | LAUNCH | PAUSE | RESUME | COMPLETE | CANCEL | CLEAR_FRAUD"
    roles: [Trafficker]
    code: 200
    input: [action]
    output: LineItem
    side_effects: ["state transition per §1.2 incl. creative cascades and fraud hold", "increments LineItem.version by 1"]

  - method: POST
    path: "/creatives"
    description: "Upload a creative asset under a line item"
    roles: [Trafficker]
    code: 201
    input: [line_item_id, name, asset_url, width, height]
    output: Creative
    side_effects: ["status=UPLOADED"]
  - method: GET
    path: "/creatives"
    description: "List creatives; filterable by line_item_id and status"
    roles: [AdOpsManager, Trafficker, VerificationAnalyst, BillingManager]
    code: 200
    input: ["line_item_id?", "status?", "limit?", "offset?"]
    output: Creative[]
    side_effects: []
  - method: GET
    path: "/creatives/{id}"
    description: "Get one creative"
    roles: [AdOpsManager, Trafficker, VerificationAnalyst, BillingManager]
    code: 200
    input: []
    output: Creative
    side_effects: []
  - method: POST
    path: "/creatives/{id}/transition"
    description: "Creative QA & trafficking lifecycle: SUBMIT_QA | PASS_QA | FAIL_QA | REVISE | TAG | ACTIVATE | ARCHIVE"
    roles: [Trafficker]
    code: 200
    input: [action, "qa_failure_reason?", "ad_tag?"]
    output: Creative
    side_effects: ["state transition per §1.2", "TAG stores ad_tag", "FAIL_QA stores qa_failure_reason", "REVISE clears it", "increments Creative.version by 1"]

  - method: POST
    path: "/delivery-snapshots"
    description: "Post a daily agency delivery snapshot for a line item"
    roles: [Trafficker]
    code: 201
    input: [line_item_id, snapshot_date, impressions, clicks]
    output: DeliverySnapshot
    side_effects: ["spend_cents computed", "line item delivered_* recomputed", "pacing fields recomputed", "auto-COMPLETED when delivered_impressions >= goal_impressions"]
  - method: GET
    path: "/line-items/{id}/delivery-snapshots"
    description: "List delivery snapshots of a line item (all statuses)"
    roles: [AdOpsManager, Trafficker, VerificationAnalyst, BillingManager]
    code: 200
    input: ["limit?", "offset?"]
    output: DeliverySnapshot[]
    side_effects: []
  - method: POST
    path: "/delivery-snapshots/{id}/transition"
    description: "VOID a snapshot (compensating action; removes it from all aggregates)"
    roles: [Trafficker]
    code: 200
    input: [action]
    output: DeliverySnapshot
    side_effects: ["status POSTED→VOIDED", "line item delivered_* recomputed over POSTED only"]

  - method: POST
    path: "/impression-events"
    description: "Record a single impression for frequency-cap enforcement across placements"
    roles: [Trafficker]
    code: 201
    input: [line_item_id, user_key, "occurred_at?"]
    output: ImpressionEvent
    side_effects: ["frequency_cap_check per §1.3; reject ERR_FREQUENCY_CAP_EXCEEDED when count >= cap"]
  - method: GET
    path: "/line-items/{id}/impression-events"
    description: "List impression events of a line item; filterable by user_key"
    roles: [AdOpsManager, Trafficker, VerificationAnalyst, BillingManager]
    code: 200
    input: ["user_key?", "limit?", "offset?"]
    output: ImpressionEvent[]
    side_effects: []

  - method: POST
    path: "/verification-reports"
    description: "File a third-party verification vendor report; assessment + fraud cascade computed at creation"
    roles: [VerificationAnalyst]
    code: 201
    input: [line_item_id, vendor, period_start, period_end, measured_impressions, viewable_impressions, ivt_impressions]
    output: VerificationReport
    side_effects: ["viewability_rate / ivt_rate / assessment / make_good_max_credit_cents computed", "IVT breach → line item fraud_posture=BREACH → auto-PAUSE → LIVE creatives PAUSED", "recorded_by_user_id := X-User-ID"]
  - method: GET
    path: "/verification-reports"
    description: "List verification reports; filterable by line_item_id"
    roles: [AdOpsManager, Trafficker, VerificationAnalyst, BillingManager]
    code: 200
    input: ["line_item_id?", "limit?", "offset?"]
    output: VerificationReport[]
    side_effects: []
  - method: GET
    path: "/verification-reports/{id}"
    description: "Get one verification report"
    roles: [AdOpsManager, Trafficker, VerificationAnalyst, BillingManager]
    code: 200
    input: []
    output: VerificationReport
    side_effects: []
  - method: POST
    path: "/verification-reports/{id}/transition"
    description: "CLOSE_REPORT: close an OPEN report once all make-goods are terminal"
    roles: [VerificationAnalyst]
    code: 200
    input: [action]
    output: VerificationReport
    side_effects: ["status OPEN→CLOSED"]

  - method: POST
    path: "/make-goods"
    description: "Propose a make-good (credit or bonus impressions) against a BREACH report"
    roles: [VerificationAnalyst]
    code: 201
    input: [verification_report_id, kind, "credit_cents?", "bonus_impressions?"]
    output: MakeGood
    side_effects: ["status=PROPOSED", "proposed_by_user_id := X-User-ID", "ERR_CREDIT_EXCEEDS_BASIS when credit > report.make_good_max_credit_cents"]
  - method: GET
    path: "/make-goods"
    description: "List make-goods; filterable by verification_report_id and status"
    roles: [AdOpsManager, Trafficker, VerificationAnalyst, BillingManager]
    code: 200
    input: ["verification_report_id?", "status?", "limit?", "offset?"]
    output: MakeGood[]
    side_effects: []
  - method: GET
    path: "/make-goods/{id}"
    description: "Get one make-good"
    roles: [AdOpsManager, Trafficker, VerificationAnalyst, BillingManager]
    code: 200
    input: []
    output: MakeGood
    side_effects: []
  - method: POST
    path: "/make-goods/{id}/transition"
    description: "APPROVE | REJECT | APPLY | REVERSE (BillingManager); REVISE (VerificationAnalyst)"
    roles: [BillingManager, VerificationAnalyst]
    code: 200
    input: [action]
    output: MakeGood
    side_effects: ["state transition per §1.2", "APPLY/REVERSE recompute IO.total_applied_credit_cents", "SoD: decider != proposer"]

  - method: POST
    path: "/reconciliations"
    description: "Open a third-party tag reconciliation for a line item and period"
    roles: [BillingManager]
    code: 201
    input: [line_item_id, period_start, period_end, third_party_impressions]
    output: Reconciliation
    side_effects: ["status=OPEN", "agency_impressions computed", "ERR_RECONCILIATION_OVERLAP on half-open period collision"]
  - method: GET
    path: "/reconciliations"
    description: "List reconciliations; filterable by line_item_id and status"
    roles: [AdOpsManager, Trafficker, VerificationAnalyst, BillingManager]
    code: 200
    input: ["line_item_id?", "status?", "limit?", "offset?"]
    output: Reconciliation[]
    side_effects: []
  - method: GET
    path: "/reconciliations/{id}"
    description: "Get one reconciliation"
    roles: [AdOpsManager, Trafficker, VerificationAnalyst, BillingManager]
    code: 200
    input: []
    output: Reconciliation
    side_effects: []
  - method: POST
    path: "/reconciliations/{id}/transition"
    description: "RECONCILE | LOCK | REOPEN"
    roles: [BillingManager]
    code: 200
    input: [action]
    output: Reconciliation
    side_effects: ["RECONCILE computes discrepancy_pct, billing_impressions, billable_cents", "LOCK enforces SoD + no open make-goods", "REOPEN clears reconciled_by_user_id"]

  - method: POST
    path: "/wrap-reports"
    description: "Generate the campaign wrap report with attribution for a COMPLETED IO"
    roles: [BillingManager]
    code: 201
    input: [io_id, attribution_model, total_conversions]
    output: WrapReport
    side_effects: ["status=DRAFT", "all computed totals + attribution array", "requires IO COMPLETED and every reconciliation LOCKED"]
  - method: GET
    path: "/wrap-reports"
    description: "List wrap reports; filterable by io_id"
    roles: [AdOpsManager, Trafficker, VerificationAnalyst, BillingManager]
    code: 200
    input: ["io_id?", "limit?", "offset?"]
    output: WrapReport[]
    side_effects: []
  - method: GET
    path: "/wrap-reports/{id}"
    description: "Get one wrap report"
    roles: [AdOpsManager, Trafficker, VerificationAnalyst, BillingManager]
    code: 200
    input: []
    output: WrapReport
    side_effects: []
  - method: POST
    path: "/wrap-reports/{id}/transition"
    description: "FINALIZE the wrap report; closes the parent IO"
    roles: [BillingManager]
    code: 200
    input: [action]
    output: WrapReport
    side_effects: ["status DRAFT→FINALIZED", "InsertionOrder COMPLETED→CLOSED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint (incl. per-action role gates on make-good transitions)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad type, invalid enum member, or cross-field inconsistency (viewable>measured, clicks>impressions, end<start, measured<=0, non-positive amounts)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_line_item_version does not match current LineItem.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested action (incl. terminal-state lockdown, PATCH outside LIVE/PAUSED, double VOID, wrap generation before IO COMPLETED)" }
  - { id: ERR_FRAUD_HOLD, http: 409, condition: "LAUNCH / RESUME / creative ACTIVATE attempted while line item fraud_posture == BREACH" }
  - { id: ERR_FLIGHT_WINDOW_VIOLATION, http: 422, condition: "Line item start_date/end_date outside parent IO flight" }
  - { id: ERR_FLIGHT_NOT_STARTED, http: 422, condition: "LAUNCH attempted before start_date or after end_date" }
  - { id: ERR_SNAPSHOT_OUT_OF_FLIGHT, http: 422, condition: "snapshot_date outside line item [start_date, end_date]" }
  - { id: ERR_RECONCILIATION_OVERLAP, http: 409, condition: "Reconciliation period (half-open) overlaps an existing reconciliation of the same line item" }
  - { id: ERR_VERIFICATION_PERIOD_OVERLAP, http: 409, condition: "VerificationReport period (closed) overlaps an existing report for the same line item and vendor" }
  - { id: ERR_NO_TAGGED_CREATIVE, http: 409, condition: "TRAFFIC attempted with zero TAGGED creatives" }
  - { id: ERR_IO_NOT_APPROVED, http: 409, condition: "LAUNCH attempted while parent IO is DRAFT or CANCELLED" }
  - { id: ERR_LINE_ITEM_NOT_LIVE, http: 409, condition: "Creative ACTIVATE attempted while parent line item is not LIVE" }
  - { id: ERR_NO_BREACH, http: 409, condition: "Make-good proposed against a PASS report or a CLOSED report" }
  - { id: ERR_RECONCILIATION_NOT_LOCKED, http: 409, condition: "Wrap report generation attempted while any reconciliation of the IO's line items is not LOCKED" }
  - { id: ERR_UNRESOLVED_MAKE_GOODS, http: 409, condition: "Report close or reconciliation LOCK attempted while a related make-good is PROPOSED or APPROVED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID on both sides of a segregated duty (propose vs approve make-good; reconcile vs lock)" }
  - { id: ERR_DUPLICATE_SNAPSHOT, http: 409, condition: "A DeliverySnapshot already exists for (line_item_id, snapshot_date) in any status" }
  - { id: ERR_FREQUENCY_CAP_EXCEEDED, http: 422, condition: "Rolling-window impression count for (line_item_id, user_key) already >= frequency_cap_max_impressions" }
  - { id: ERR_TAG_REQUIRED, http: 400, condition: "TAG without ad_tag, or FAIL_QA without qa_failure_reason" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Sum of non-CANCELLED line-item budget_cents would exceed IO.total_budget_cents" }
  - { id: ERR_CREDIT_EXCEEDS_BASIS, http: 422, condition: "CREDIT make-good exceeds verification report's make_good_max_credit_cents" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: AdOpsManager
    description: "Agency ad-operations lead; owns insertion orders and the campaign lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /insertion-orders"
      - "POST /insertion-orders/{id}/transition"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: Trafficker
    description: "Ad trafficker; owns line item setup, creative QA/tagging, delivery snapshots, impression events, mid-flight optimization"
    identity: opaque
    exclusive_operations:
      - "POST /line-items"
      - "PATCH /line-items/{id}"
      - "POST /line-items/{id}/transition"
      - "POST /creatives"
      - "POST /creatives/{id}/transition"
      - "POST /delivery-snapshots"
      - "POST /delivery-snapshots/{id}/transition"
      - "POST /impression-events"
    shared_operations: ["all GET endpoints"]
  - name: VerificationAnalyst
    description: "Verification vendor analyst; files measurement reports and proposes make-goods"
    identity: opaque
    exclusive_operations:
      - "POST /verification-reports"
      - "POST /verification-reports/{id}/transition"
      - "POST /make-goods"
      - "POST /make-goods/{id}/transition (action=REVISE)"
    shared_operations: ["all GET endpoints"]
  - name: BillingManager
    description: "Billing/finance manager; owns reconciliation, make-good decisions, wrap reports"
    identity: opaque
    exclusive_operations:
      - "POST /reconciliations"
      - "POST /reconciliations/{id}/transition"
      - "POST /make-goods/{id}/transition (action=APPROVE|REJECT|APPLY|REVERSE)"
      - "POST /wrap-reports"
      - "POST /wrap-reports/{id}/transition"
    shared_operations: ["all GET endpoints"]
