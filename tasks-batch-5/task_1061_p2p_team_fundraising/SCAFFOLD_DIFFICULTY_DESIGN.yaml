  - rule_id: cross_entity_state_dependency
    instances:
      - name: donation_create_rejected_while_campaign_is_draft
        grounds:
          - validations[priority=10]
          - errors[ERR_CAMPAIGN_NOT_PUBLISHED]
          - entities.Campaign.fields.status
          - state_machines.Campaign.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Entity pair Donation -> Campaign: a Donation cannot be created at all while its Campaign.status is
          DRAFT, so the child's very existence depends on the parent's state, and the same request succeeds
          verbatim once the campaign is PUBLISHED.
        test_recipe:
          setup:
            - "An organization with one campaign left in DRAFT (never published)."
            - "One donor exists."
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 10000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_id: $.data.id }
          assert:
            - "first POST /api/donations returns HTTP 409 with error_id == ERR_CAMPAIGN_NOT_PUBLISHED"
            - "Campaign.${camp_id}.status == DRAFT at the moment of the first attempt"
            - "second POST /api/donations returns HTTP 201 with Donation.${don_id}.payment_status == PENDING"
            - "Donation.${don_id}.fee_cents == 820"

      - name: payout_release_blocked_until_organization_payout_account_verified
        grounds:
          - validations[priority=15]
          - errors[ERR_ORGANIZATION_PAYOUT_UNVERIFIED]
          - entities.Organization.fields.payout_account_status
          - state_machines.Payout.APPROVED_to_RELEASED
        distinguishing_aspect: |
          A different entity pair, Payout -> Organization: an APPROVED payout cannot reach RELEASED while
          Organization.payout_account_status is UNVERIFIED, and the identical release call succeeds once the
          platform flips that field to VERIFIED.
        test_recipe:
          setup:
            - "Organization with payout_account_status UNVERIFIED (its creation default)."
            - "PUBLISHED campaign with one SETTLED 100000-cent donation and no match pool, so lifetime_net_cents is 92070."
            - "One 50000-cent Payout already APPROVED (reviewed by fr-reviewer-1, approved by fr-reviewer-2)."
          setup_api_calls:
            - call: "POST /api/organizations"
              payload: { name: "Riverside Health Foundation", ein: "12-3456789", contact_email: "ops@riverside.org" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /api/campaigns"
              payload: { organization_id: "${org_id}", title: "Autumn Walk 2026", goal_amount_cents: 1000000 }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /api/campaigns/${camp_id}/publish"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
            - call: "POST /api/donors"
              payload: { display_name: "Dana Cole", email: "dana@example.com" }
              as: Anonymous
              captures: { d_id: $.data.id }
            - call: "POST /api/donations"
              payload: { campaign_id: "${camp_id}", donor_id: "${d_id}", designation_type: "CAMPAIGN", designation_id: "${camp_id}", amount_cents: 100000 }
              as: Donor
              as_user_id: "${d_id}"
              captures: { don_id: $.data.id }
            - call: "POST /api/donations/${don_id}/settle"
              payload: { outcome: "SETTLED" }
              as: PlatformAdmin
            - call: "GET /api/campaigns/${camp_id}"
              payload: {}
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { camp_v: $.data.version }
            - call: "POST /api/campaigns/${camp_id}/payouts"
              payload: { amount_cents: 50000, expected_campaign_version: "${camp_v}", note: "first tranche" }
              as: CampaignManager
              as_user_id: "${org_id}"
              captures: { payout_id: $.data.id }
            - call: "POST /api/payouts/${payout_id}/review"
              payload: {}
              as: FinanceReviewer
              as_user_id: "fr-reviewer-1"
            - call: "POST /api/payouts/${payout_id}/approve"
              payload: {}
              as: FinanceReviewer
              as_user_id: "fr-reviewer-2"
          trigger:
            - call: "POST /api/payouts/${payout_id}/release"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /api/organizations/${org_id}/payout-account"
              payload: { status: "VERIFIED" }
              as: PlatformAdmin
            - call: "POST /api/payouts/${payout_id}/release"
              payload: {}
              as: PlatformAdmin
          assert:
            - "first release returns HTTP 409 with error_id == ERR_ORGANIZATION_PAYOUT_UNVERIFIED"
            - "Payout.${payout_id}.status after the first release attempt == APPROVED"
            - "Organization.${org_id}.payout_account_status == VERIFIED after the payout-account call"
            - "Payout.${payout_id}.status after the second release == RELEASED"
            - "Campaign.${camp_id}.paid_out_cents == 50000"
            - "Campaign.${camp_id}.reserved_payout_cents == 0"
            - "Campaign.${camp_id}.available_balance_cents == 42070"

  - rule_id: resource_temporal_overlap
    instances:
      - name: match_pool_half_open_window_adjacent_ok_overlap_rejected
        grounds:
          - validations[priority=9]
          - errors[ERR_MATCH_WINDOW_OVERLAP]
          - entities.MatchPool.fields.starts_at
          - entities.MatchPool.fields.ends_at
        distinguishing_aspect: |
          Interval semantics on the Campaign resource are HALF-OPEN [starts_at, ends_at) with no buffer: a pool
          beginning exactly at 2026-08-01T00:00:00Z (the prior pool's ends_at) is accepted, while a pool spanning
          2026-07-15 .. 2026-08-15 is rejected with ERR_MATCH_WINDOW_OVERLAP.
