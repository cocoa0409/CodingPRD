        distinguishing_aspect: |
          Conserved quantity: pool distributable revenue. The close->settle pipeline paired with
          its remainder reconciliation keeps sum(lot_gross_final_cents) ==
          pool_distributable_cents exactly (1930760), and the per-grower rollup keeps
          sum(statement.gross_cents) == 1930760 — distribution is zero-sum; no cent is created
          or lost between variants.
