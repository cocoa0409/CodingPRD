            - call: "POST /false-alarm-program/alarm-permits/${permit3}/renewals"
              payload: {expected_alarm_permit_version: "${permit3_v}"}
              as: PermitClerk
            - call: "GET /false-alarm-program/alarm-permits/${permit4}"
              payload: {}
              as: PermitClerk
              captures: {permit4_v: $.data.version}
            - call: "POST /false-alarm-program/alarm-permits/${permit4}/renewals"
              payload: {expected_alarm_permit_version: "${permit4_v}"}
