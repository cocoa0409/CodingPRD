        excluded_because:
          difficulty_instance: compensating_invariant / election_withdraw_restores_station_filed_election_count
          rationale: "The full undo of the filing fan-out, including filed_election_count restoration, is asserted there."
      - name: corner_execute_guarded_on_affiliation_state
        claim_type: guarded transitions
