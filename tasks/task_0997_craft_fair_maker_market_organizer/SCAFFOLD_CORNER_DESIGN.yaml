# =============================================================================
# SCAFFOLD_CORNER_DESIGN — Craft-Fair & Maker-Market Organizer
# §1.9 Coverage Index — non-difficulty testable claims (envelope, CRUD, RBAC,
# FK integrity, validation violations, OCC, side-effect checks).
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # §Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: maker_event_creation_returns_201_and_defaults
        claim_type: creation
        grounds:
          - "entities.MakerEvent"
          - "endpoints.POST_/maker-events"
        distinguishing_aspect: "POST /maker-events with valid inputs returns 201, posture=PLANNING, weather_flag defaults to CLEAR, version=1"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /maker-events"
              payload:
                name: "Default Fair"
                opens_at: "2026-06-01T09:00:00Z"
                closes_at: "2026-06-01T18:00:00Z"
                venue_capacity: 50
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
                commission_pct_standard: 0.10
                commission_pct_anchor: 0.05
              as: EventCoordinator
              captures: { ev_id: $.data.id, posture: $.data.posture, weather: $.data.weather_flag, version: $.data.version }
          assert:
            - "posture == 'PLANNING'"
            - "weather_flag == 'CLEAR'"
            - "version == 1"

      - name: maker_event_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "entities.MakerEvent"
          - "errors.ERR_NOT_FOUND"
        distinguishing_aspect: "GET on a non-existent UUID returns 404 ERR_NOT_FOUND"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /maker-events/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EventCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == 'ERR_NOT_FOUND'"

      - name: vendor_profile_email_uniqueness_enforced
        claim_type: violation_to_error
        grounds:
          - "entities.VendorProfile"
          - "errors.ERR_EMAIL_TAKEN"
        distinguishing_aspect: "Second POST /vendor-profiles with same contact_email returns 409 ERR_EMAIL_TAKEN"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /vendor-profiles"
              payload: { display_name: "V1", contact_email: "dup@x.com", home_region: "WA" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vendor-profiles"
              payload: { display_name: "V2", contact_email: "dup@x.com", home_region: "OR" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == 'ERR_EMAIL_TAKEN'"

      - name: maker_event_list_returns_paginated
        claim_type: listing
        grounds:
          - "entities.MakerEvent"
          - "endpoints.GET_/maker-events"
        distinguishing_aspect: "GET /maker-events returns pagination fields with defaults"
        test_recipe:
          setup: ["Two events exist"]
          setup_api_calls:
            - call: "POST /maker-events"
              payload:
                name: "E1"
                opens_at: "2026-06-01T09:00:00Z"
                closes_at: "2026-06-01T18:00:00Z"
                venue_capacity: 50
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
                commission_pct_standard: 0.10
                commission_pct_anchor: 0.05
              as: EventCoordinator
            - call: "POST /maker-events"
              payload:
                name: "E2"
                opens_at: "2026-07-01T09:00:00Z"
                closes_at: "2026-07-01T18:00:00Z"
                venue_capacity: 50
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
                commission_pct_standard: 0.10
                commission_pct_anchor: 0.05
              as: EventCoordinator
          trigger:
            - call: "GET /maker-events"
              payload: { limit: 1, offset: 0 }
              as: EventCoordinator
          assert:
            - "response contains total_count, has_more"
            - "limit=1 honored"

      - name: jury_score_common_fields_false_no_version
        claim_type: immutability
        grounds:
          - "entities.JuryScore"
        distinguishing_aspect: "JuryScore has common_fields: false — no version field; no update endpoint"
        test_recipe:
          setup: ["One JuryScore exists"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events"
              payload:
                name: "J"
                opens_at: "2026-06-01T09:00:00Z"
                closes_at: "2026-06-01T18:00:00Z"
                venue_capacity: 50
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
                commission_pct_standard: 0.10
                commission_pct_anchor: 0.05
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/booth-zones"
              payload: { label: "H", weather_exposure: "INDOOR", category: "CERAMICS", category_cap: 3 }
              as: EventCoordinator
            - call: "POST /vendor-profiles"
              payload: { display_name: "V", contact_email: "v@x.com", home_region: "WA" }
              as: PlatformAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/open-applications"
              payload: {}
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/applications"
              payload: { vendor_profile_id: "${vendor_id}", requested_category: "CERAMICS", requested_tier: "STANDARD" }
              as: Vendor
              as_user_id: "${vendor_id}"
              captures: { app_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events/${ev_id}/close-applications"
              payload: {}
              as: EventCoordinator
          trigger:
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/jury-scores"
              payload: { craftsmanship: 8, originality: 8, booth_presentation: 8 }
              as: Juror
              as_user_id: "juror-1"
              captures: { js_id: $.data.id, total: $.data.total }
          assert:
            - "JuryScore has id, created_at, no version field in response"
            - "total == 24 (8+8+8)"

  # ===========================================================================
  # §State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_from_wrong_state_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.VendorApplication"
        distinguishing_aspect: "POST /decide on a DRAFT application returns ERR_INVALID_STATE"
        test_recipe:
          setup: ["MakerEvent in APPLICATION_OPEN; one DRAFT application"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events"
              payload:
                name: "S"
                opens_at: "2026-06-01T09:00:00Z"
                closes_at: "2026-06-01T18:00:00Z"
                venue_capacity: 50
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
                commission_pct_standard: 0.10
                commission_pct_anchor: 0.05
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /vendor-profiles"
              payload: { display_name: "V", contact_email: "v@x.com", home_region: "WA" }
              as: PlatformAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/open-applications"
              payload: {}
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/applications"
              payload: { vendor_profile_id: "${vendor_id}", requested_category: "CERAMICS", requested_tier: "STANDARD" }
              as: Vendor
              as_user_id: "${vendor_id}"
              captures: { app_id: $.data.id }
            - call: "GET /maker-events/${ev_id}"
              payload: {}
              as: EventCoordinator
              captures: { ev_v: $.data.version }
          trigger:
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/decide"
              payload: { outcome: "APPROVE", expected_event_version: "${ev_v}" }
              as: EventCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id IN {'ERR_INVALID_STATE', 'ERR_POSTURE_FORBIDS'}"

      - name: ticket_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Ticket"
        distinguishing_aspect: "REFUNDED ticket cannot be redeemed; redeem returns ERR_TICKET_NOT_REDEEMABLE"
        test_recipe:
          setup: ["MakerEvent LIVE; one REFUNDED ticket"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events"
              payload:
                name: "T"
                opens_at: "2026-06-01T09:00:00Z"
                closes_at: "2026-06-01T18:00:00Z"
                venue_capacity: 50
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
                commission_pct_standard: 0.10
                commission_pct_anchor: 0.05
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/tickets"
              payload: { purchaser_email: "p@x.com", kind: "GA", price_cents: 1000 }
              as: EventCoordinator
              captures: { ticket_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/tickets/${ticket_id}/refund"
              payload: { reason: "USER_REQUEST" }
              as: EventCoordinator
          trigger:
            - call: "POST /maker-events/${ev_id}/tickets/${ticket_id}/redeem"
              payload: {}
              as: GateAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id IN {'ERR_TICKET_NOT_REDEEMABLE', 'ERR_INVALID_STATE', 'ERR_POSTURE_FORBIDS'}"

  # ===========================================================================
  # §Calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: anchor_tier_uses_reduced_commission
        claim_type: constants_applied
        grounds:
          - "calculations.commission_quote"
        distinguishing_aspect: "ANCHOR booth applies commission_pct_anchor (0.05) instead of standard (0.10); on 50,000 cents gross the commission is 2,500 not 5,000"
        test_recipe:
          setup: ["Event at SETTLEMENT with ANCHOR-tier assignment and one 50,000-cent sale"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events"
              payload:
                name: "Anchor Fair"
                opens_at: "2026-06-01T09:00:00Z"
                closes_at: "2026-06-01T18:00:00Z"
                venue_capacity: 100
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
                commission_pct_standard: 0.10
                commission_pct_anchor: 0.05
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/booth-zones"
              payload: { label: "Hall", weather_exposure: "INDOOR", category: "CERAMICS", category_cap: 3 }
              as: EventCoordinator
              captures: { zone_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/booth-zones/${zone_id}/booths"
              payload: { code: "A-01", tier: "ANCHOR", footprint_sqm: 25, price_cents: 8000 }
              as: EventCoordinator
            - call: "POST /vendor-profiles"
              payload: { display_name: "V", contact_email: "v@x.com", home_region: "WA" }
              as: PlatformAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/open-applications"
              payload: {}
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/applications"
              payload: { vendor_profile_id: "${vendor_id}", requested_category: "CERAMICS", requested_tier: "ANCHOR" }
              as: Vendor
              as_user_id: "${vendor_id}"
              captures: { app_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events/${ev_id}/close-applications"
              payload: {}
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/jury-scores"
              payload: { craftsmanship: 8, originality: 8, booth_presentation: 8 }
              as: Juror
              as_user_id: "juror-1"
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/jury-scores"
              payload: { craftsmanship: 8, originality: 8, booth_presentation: 8 }
              as: Juror
              as_user_id: "juror-2"
            - call: "GET /maker-events/${ev_id}"
              payload: {}
              as: EventCoordinator
              captures: { ev_v: $.data.version }
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/decide"
              payload: { outcome: "APPROVE", expected_event_version: "${ev_v}" }
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/begin-scheduling"
              payload: {}
              as: EventCoordinator
            - call: "GET /maker-events/${ev_id}/assignments"
              payload: { vendor_application_id: "${app_id}" }
              as: EventCoordinator
              captures: { assignment_id: "$.data[0].id" }
            - call: "POST /maker-events/${ev_id}/assignments/${assignment_id}/pay"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /maker-events/${ev_id}/go-live"
              payload: {}
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/sales-ledger"
              payload: { booth_assignment_id: "${assignment_id}", gross_cents: 50000 }
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events/${ev_id}/end-event"
              payload: {}
              as: EventCoordinator
            - call: "GET /maker-events/${ev_id}/settlements"
              payload: { booth_assignment_id: "${assignment_id}" }
              as: Treasurer
              captures: { settlement_id: "$.data[0].id" }
          trigger:
            - call: "POST /maker-events/${ev_id}/settlements/${settlement_id}/compute"
              payload: {}
              as: Treasurer
              captures: { comm: "$.data.commission_cents" }
          assert:
            - "Settlement.commission_cents == 2500"

  # ===========================================================================
  # §Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors.ERR_MISSING_AUTH"
        distinguishing_aspect: "Request with missing X-User-Role header returns 400 ERR_MISSING_AUTH"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /maker-events"
              payload: {}
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == 'ERR_MISSING_AUTH' OR status_code == 400"

      - name: forbidden_role_returns_403
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors.ERR_FORBIDDEN"
        distinguishing_aspect: "Vendor role cannot create MakerEvent (EventCoordinator-only); returns 403 ERR_FORBIDDEN"
        test_recipe:
          setup: ["VendorProfile exists"]
          setup_api_calls:
            - call: "POST /vendor-profiles"
              payload: { display_name: "V", contact_email: "v@x.com", home_region: "WA" }
              as: PlatformAdmin
              captures: { vendor_id: $.data.id }
          trigger:
            - call: "POST /maker-events"
              payload:
                name: "V"
                opens_at: "2026-06-01T09:00:00Z"
                closes_at: "2026-06-01T18:00:00Z"
                venue_capacity: 50
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
                commission_pct_standard: 0.10
                commission_pct_anchor: 0.05
              as: Vendor
              as_user_id: "${vendor_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == 'ERR_FORBIDDEN'"

      - name: booth_double_booked_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=14]"
          - "errors.ERR_BOOTH_DOUBLE_BOOKED"
        distinguishing_aspect: "Already covered by difficulty instance booth_assignment_aggregate_capacity_semantics"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / booth_assignment_aggregate_capacity_semantics
          rationale: "Same validation exercised in §1.8 with two-vendor scenario"

      - name: payment_window_expired
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors.ERR_PAYMENT_WINDOW_EXPIRED"
        distinguishing_aspect: "POST /assignments/{id}/pay after payment_due_at returns 409 ERR_PAYMENT_WINDOW_EXPIRED"
        test_recipe:
          setup: ["Assignment in PENDING_PAYMENT with payment_due_at in past"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events"
              payload:
                name: "Expire Fair"
                opens_at: "2026-06-01T09:00:00Z"
                closes_at: "2026-06-01T18:00:00Z"
                venue_capacity: 100
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
                commission_pct_standard: 0.10
                commission_pct_anchor: 0.05
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/booth-zones"
              payload: { label: "Hall", weather_exposure: "INDOOR", category: "CERAMICS", category_cap: 3 }
              as: EventCoordinator
              captures: { zone_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/booth-zones/${zone_id}/booths"
              payload: { code: "H-01", tier: "STANDARD", footprint_sqm: 9, price_cents: 5000 }
              as: EventCoordinator
            - call: "POST /vendor-profiles"
              payload: { display_name: "V", contact_email: "v@x.com", home_region: "WA" }
              as: PlatformAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/open-applications"
              payload: {}
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/applications"
              payload: { vendor_profile_id: "${vendor_id}", requested_category: "CERAMICS", requested_tier: "STANDARD" }
              as: Vendor
              as_user_id: "${vendor_id}"
              captures: { app_id: $.data.id }
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/submit"
              payload: {}
              as: Vendor
              as_user_id: "${vendor_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events/${ev_id}/close-applications"
              payload: {}
              as: EventCoordinator
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/jury-scores"
              payload: { craftsmanship: 8, originality: 8, booth_presentation: 8 }
              as: Juror
