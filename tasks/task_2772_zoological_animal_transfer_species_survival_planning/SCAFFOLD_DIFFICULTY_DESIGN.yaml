  - rule_id: priority_pair_validation_conflict
    instances:
      - name: execute_state_50_outranks_accreditation_60
        grounds:
          - validations[priority=50, error_id=ERR_AGREEMENT_INVALID_STATE]
          - validations[priority=60, error_id=ERR_INSTITUTION_NOT_ACCREDITED]
          - errors[ERR_AGREEMENT_INVALID_STATE]
          - errors[ERR_INSTITUTION_NOT_ACCREDITED]
          - endpoints[POST /transfer-agreements/{agreementId}/execute]
        distinguishing_aspect: |
          Two independent defects are present on the same execute call: the agreement is still
          OFFERED rather than ACCEPTED (state, priority 50) and the receiving institution is
          SUSPENDED (business_safety, priority 60). Only ERR_AGREEMENT_INVALID_STATE (409) may be
          returned. The recipe then repairs only the state defect and re-runs the same call to
          prove the lower-priority rule still bites with ERR_INSTITUTION_NOT_ACCREDITED (422),
          so the two cannot be conflated.
        test_recipe:
          setup:
            - "Clock left at its 2026-08-01T00:00:00Z default."
            - "Base fixture through an endorsed recommendation and a DRAFT agreement, then the agreement is offered so it sits in OFFERED, and Harbor Bay Zoo's accreditation_status is patched to SUSPENDED."
