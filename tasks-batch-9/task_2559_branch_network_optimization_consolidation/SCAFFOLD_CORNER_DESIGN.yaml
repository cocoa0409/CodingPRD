        distinguishing_aspect: "The market occupation interval is closed at both ends, so 2026-12-02 is the first legal filing date after a notice effective 2026-11-01 (buffer_end 2026-12-01) — filing exactly on 2026-12-01 would collide, one day later does not, and the second notice's own interval runs [2026-12-02, 2027-04-14] on a 103-day lead."
        test_recipe:
          setup:
            - "Harbor Metro holds RB-101 (case 1, notice effective 2026-11-01, buffer_end 2026-12-01), RB-102 (shared receiving branch) and RB-103 (case 2's closing branch)."
            - "Case 1 is NOTICE_FILED and was never executed; the clock has been advanced to 2026-12-02, which swept notice 1 to EFFECTIVE."
