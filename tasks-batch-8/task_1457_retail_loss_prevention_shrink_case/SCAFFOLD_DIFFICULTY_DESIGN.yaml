  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: payment_return_cascade_depth4
        grounds:
          - state_machines.RestitutionPayment.POSTED_to_RETURNED
          - state_machines.CivilDemand.PAID_IN_FULL_to_PARTIALLY_PAID
          - calculations.restitution_waterfall
          - entities.Store.fields.restitution_collected_cents
        distinguishing_aspect: |
          Depth-4 cascade triggered by payment return: (1) demand counters recompute
          (paid_to_date 130000 -> 50000, fees_incurred 2500, outstanding 0 -> 107500), which
          (2) flips CivilDemand PAID_IN_FULL -> PARTIALLY_PAID, which (3) flips
          Case.restitution_status SETTLED -> OUTSTANDING, which (4) leaves
          Store.restitution_collected_cents at 50000. Each hop is caused by the previous one.
        test_recipe:
          setup:
            - "Store S1; EXTERNAL case CX (manual loss 75000) INTERVIEWED; demand DD STATUTORY priors 2 ISSUED (amount_due 130000)"
            - "Payment PAY1 80000 POSTED (fees 0 / penalty 55000 / merch 25000); payment PAY2 50000 POSTED (merch 50000); DD PAID_IN_FULL, outstanding 0, S1.restitution_collected_cents 130000"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S160", name: "Store 160", region_code: "R5" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /cases"
