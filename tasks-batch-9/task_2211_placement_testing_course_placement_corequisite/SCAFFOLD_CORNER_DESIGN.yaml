              payload: {}
              as: Student
              as_user_id: "${sx4}"
              captures: { dv3: $.data.version, dstate2: $.data.placement_state }
          assert:
            - "${dv1} == 1 (setup) and ${dev} == \"VERIFIED\" with ${dv2} == 2 — a pure evidence-axis move bumps the determination's version"
            - "${e_stale1} == \"ERR_STALE_DETERMINATION_VERSION\" with HTTP 412 at priority 7 — the filing was inside the 30-day window and otherwise valid; only the version was old"
            - "${dv2b} == 2 and ${dstate} == \"PROVISIONAL\" — the refused filing did not move the placement axis"
            - "${app_state} == \"SUBMITTED\" — the refreshed retry of the identical filing succeeds"
            - "${e_stale2} == \"ERR_STALE_DETERMINATION_VERSION\" — the successful filing bumped the parent to 3, so replaying version 2 is refused; without OCC this second filing would have auto-withdrawn the first appeal"
            - "${app_state_after} == \"SUBMITTED\" and ${app_round} == 0 — the first appeal is untouched by the refused replay"
            - "${dv3} == 3 and ${dstate2} == \"APPEALED\""

