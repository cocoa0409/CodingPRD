      - name: slack_aggregate_reads_only_open_milestones_and_falls_back_to_the_empty_set_sentinel
        claim_type: input_set_filtering
        grounds:
          - calculations.cycle_milestone_slack
          - state_machines.Milestone.IN_PROGRESS_to_COMPLETE
          - entities.ReportingCycle.fields.min_slack_days_calendar
          - entities.ReportingCycle.fields.min_slack_days_business
        distinguishing_aspect: |
          Only PLANNED and IN_PROGRESS milestones feed the cycle aggregate, and the aggregate is re-read
          three times as the input set shrinks: with CLOSE (7, 5) and FILING (1, 1) both open the cycle
          reads (1, 1); COMPLETEing the FILING row — the one holding the minimum — moves the cycle to
          (7, 5); COMPLETEing the CLOSE row empties the set and the cycle reads the sentinel
          (9999, 9999) rather than 0 or null. Each completed row keeps its own frozen per-row slack, so
          the FILING milestone still reports 1 / 1 after it has left the aggregate.
        test_recipe:
          setup:
            - "An ADOPTED charter with an ACTIVE voting FINANCE member."
            - "A cycle in CLOSE_OPEN with statutory_deadline_utc 2026-08-10T17:30:00Z carrying CLOSE [2026-08-01T00:00:00Z, 2026-08-03T00:00:00Z) and FILING [2026-08-09T00:00:00Z, 2026-08-09T06:00:00Z); no CERTIFICATION milestone exists, so the FILING row's ordering-buffer rule is skipped."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Standing Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { close_ms_id: $.data.id, close_cal: $.data.slack_calendar_days, close_bus: $.data.slack_business_days }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "FILING", planned_start_utc: "2026-08-09T00:00:00Z", planned_end_utc: "2026-08-09T06:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { filing_ms_id: $.data.id, filing_cal: $.data.slack_calendar_days, filing_bus: $.data.slack_business_days }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
              captures: { cal_both_open: $.data.min_slack_days_calendar, bus_both_open: $.data.min_slack_days_business }
          trigger:
            - call: "POST /disclosure/milestones/${filing_ms_id}/transitions"
              payload: { action: "START" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/milestones/${filing_ms_id}/transitions"
              payload: { action: "COMPLETE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cal_one_open: $.data.min_slack_days_calendar, bus_one_open: $.data.min_slack_days_business }
            - call: "POST /disclosure/milestones/${close_ms_id}/transitions"
              payload: { action: "START" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/milestones/${close_ms_id}/transitions"
              payload: { action: "COMPLETE" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { cal_none_open: $.data.min_slack_days_calendar, bus_none_open: $.data.min_slack_days_business }
          assert:
            - "${close_cal} == 7 and ${close_bus} == 5"
            - "${filing_cal} == 1 and ${filing_bus} == 1"
            - "${cal_both_open} == 1 and ${bus_both_open} == 1"
            - "${cal_one_open} == 7 and ${bus_one_open} == 5"
