              as: HieAdmin
            - call: "POST /hie/participants/${pD_id}/conformance-tests"
              payload: { profile: "DOCUMENT_SOURCE", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { ctD2_id: $.data.id }
            - call: "POST /hie/conformance-tests/${ctD2_id}/results"
              payload: { assertions_total: 200, assertions_passed: 200 }
              as: HieAdmin
            - call: "POST /hie/participants/${pD_id}/conformance-tests"
              payload: { profile: "QUERY_RESPONDER", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { ctD3_id: $.data.id }
            - call: "POST /hie/conformance-tests/${ctD3_id}/results"
              payload: { assertions_total: 200, assertions_passed: 200 }
              as: HieAdmin
            - call: "POST /hie/participants/${pD_id}/onboarding-transitions"
              payload: { action: "CERTIFY" }
              as: HieAdmin
              as_user_id: "admin-cert-1"
            - call: "POST /hie/participants/${pD_id}/patient-records"
              payload: { source_mrn: "H-3001", given_name: "Dana", family_name: "Okafor", birth_date: "1988-09-14", sex: "F", ssn_last4: "7781", postal_code: "98104", phone_digits: "2065550133" }
              as: HieAdmin
              captures: { recD_id: $.data.id, clusterD_id: $.data.cluster_id }
          trigger:
            - call: "POST /hie/break-glass-accesses"
              payload: { cluster_id: "${clusterD_id}", invoking_participant_id: "${pD_id}", emergency_category: "UNCONSCIOUS_PATIENT", justification_text: "Unconscious trauma patient in resuscitation bay 3 with no identification and no responsive next of kin." }
              as: Clinician
              as_user_id: "clin-d-1"
              captures: { bgD_id: $.data.id, bgD_opened: $.data.opened_at, bgD_expires: $.data.expires_at }
