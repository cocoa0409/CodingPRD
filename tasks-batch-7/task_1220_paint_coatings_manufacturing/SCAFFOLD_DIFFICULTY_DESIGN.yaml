  - rule_id: transitive_cascade
    instances:
      - name: formula_activation_cascade_depth3
        grounds:
          - state_machines.Formula.DRAFT_to_ACTIVE
          - state_machines.Batch.PLANNED_to_ON_HOLD
          - state_machines.SalesOrder.SCHEDULED_to_BLOCKED
        distinguishing_aspect: |
          Depth-3 cascade from the successor-activation trigger: activating formula
          F1b deprecates its predecessor F1 (link 1); F1's deprecation moves PLANNED
          batch B1 to ON_HOLD (link 2, caused by the deprecation, not the activate);
          B1's hold moves SCHEDULED order O1 to BLOCKED (link 3, caused by the batch
          hold). The chain unwinds on resume: B1 repoints to F1b and O1 returns to
          SCHEDULED.
        test_recipe:
          setup:
            - "F1 ACTIVE (version 1); CU1; O1 standard order PLACED; B1 PLANNED on F1 linked to O1; O1 SCHEDULED via B1"
