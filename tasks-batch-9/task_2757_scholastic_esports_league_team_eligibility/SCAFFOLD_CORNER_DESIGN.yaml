              payload: { team_id: "${tm_a_id}", subject_type: "STUDENT", subject_student_id: "${st_id}", case_type: "ACCOUNT_SHARING", evidence_ref: "EV-001" }
              as: IntegrityOfficer
              as_user_id: "integrity-a"
              captures: { fp_id: $.data.id }
          trigger:
            - call: "GET /title-approvals/${ta_id}"
              payload: {}
