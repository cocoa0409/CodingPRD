scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: hazard_screening_physical_vs_regulatory_counts
        grounds:
          - calculations.hazard_threshold_screening
          - entities.Lab.fields.hazard_totals_physical
          - entities.Lab.fields.hazard_totals_regulatory
          - entities.Lab.fields.permit_report_required
        distinguishing_aspect: |
          Container-domain dual variant: the SAME container set yields physical total
          (IN_USE only) 6.0 vs regulatory total (IN_USE + WASTE_TAGGED) 11.0 for
          FLAMMABLE, and only the regulatory variant crosses the 10.0 permit threshold.
        test_recipe:
          setup:
            - "Lab L with PI worker who has COMPLETED FLAMMABLE training"
            - "containers BC-001 (6.0 FLAMMABLE, IN_USE) and BC-002 (5.0 FLAMMABLE, WASTE_TAGGED into area)"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Chem A", department: "Chemistry", building: "Hall A", room: "101" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "FLAMMABLE", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "BC-001", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 6.0, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "BC-002", chemical_name: "Methanol", hazard_class: "FLAMMABLE", quantity_value: 5.0, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c2: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 20 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers/${c2}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
          trigger:
            - { call: "GET /ehs/labs/${l}", as: EHSAdmin }
          assert:
            - "Lab.${l}.hazard_totals_physical.FLAMMABLE == 6.0"
            - "Lab.${l}.hazard_totals_regulatory.FLAMMABLE == 11.0"
            - "Lab.${l}.permit_report_required == true"
      - name: inspection_scoring_weighted_vs_flat
        grounds:
          - calculations.inspection_scoring
          - entities.LabInspection.fields.score_weighted
          - entities.LabInspection.fields.score_flat
          - entities.LabInspection.fields.outcome
        distinguishing_aspect: |
          Inspection-domain dual variant (different entity domain from the hazard
          screening instance): identical findings 2xMAJOR + 1xMINOR produce
          score_weighted 55 (authoritative -> FAIL) but score_flat 70 (would-pass).
        test_recipe:
          setup:
            - "Lab L exists; inspection assigned to inspector insp-1 is SCHEDULED"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Bio B", department: "Biology", building: "Hall B", room: "202" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/inspections", payload: { lab_id: "${l}", inspector_id: "insp-1", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T10:00:00Z" }, as: EHSAdmin, captures: { insp: $.data.id } }
          trigger:
            - { call: "POST /ehs/inspections/${insp}/complete", payload: { findings: [ { severity: "MAJOR", description: "unlabeled waste" }, { severity: "MAJOR", description: "blocked shower" }, { severity: "MINOR", description: "missing signage" } ] }, as: EHSInspector, as_user_id: "insp-1" }
          assert:
            - "LabInspection.${insp}.score_weighted == 55"
            - "LabInspection.${insp}.score_flat == 70"
            - "LabInspection.${insp}.outcome == FAIL"

  - rule_id: combinatorial_formula
    instances:
      - name: posture_derivation_multi_input_branching
        grounds:
          - calculations.lab_posture_derivation
          - entities.Lab.fields.posture
          - state_machines.CorrectiveAction
        distinguishing_aspect: |
          Mode (a) combinatorial: posture derives from >= 3 inputs with first-match
          branching — one OPEN (not overdue) MINOR corrective action yields RESTRICTED;
          advancing the clock past its due_date makes the SAME corrective action drive
          the lab to FROZEN via the overdue branch.
        test_recipe:
          setup:
            - "Lab L with PI; inspection completed at default clock 2026-08-01T00:00:00Z with one MINOR finding -> one CorrectiveAction OPEN, due_date 2026-08-31T00:00:00Z; posture RESTRICTED"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Phys C", department: "Physics", building: "Hall C", room: "303" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/inspections", payload: { lab_id: "${l}", inspector_id: "insp-1", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: EHSAdmin, captures: { insp: $.data.id } }
            - { call: "POST /ehs/inspections/${insp}/complete", payload: { findings: [ { severity: "MINOR", description: "missing signage" } ] }, as: EHSInspector, as_user_id: "insp-1" }
          trigger:
            - { call: "POST /ehs/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: EHSAdmin }
            - { call: "GET /ehs/labs/${l}", as: EHSAdmin }
          assert:
            - "Lab.${l}.posture == FROZEN (was RESTRICTED before the clock advance)"
      - name: pickup_cost_per_item_rounding_order
        grounds:
          - calculations.pickup_cost_estimate
          - entities.WastePickupRequest.fields.estimated_cost
          - entities.WastePickupRequest.fields.estimated_quantity_total
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode from the posture instance): two TOXIC
          items of 0.2375 gal at 21.20/gal are rounded per item (5.035 -> 5.04 each)
          then summed and added to the 75.00 base fee -> 85.08; the alternative
          sum-then-round order would yield 85.07, so the pinned order is observable.
        test_recipe:
          setup:
            - "Lab L with PI holding COMPLETED TOXIC training; two TOXIC containers of 0.2375 each, both WASTE_TAGGED and linked to a DRAFT pickup"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Chem D", department: "Chemistry", building: "Hall A", room: "104" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "TOXIC", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "TX-1", chemical_name: "Mercury sol", hazard_class: "TOXIC", quantity_value: 0.2375, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "TX-2", chemical_name: "Arsenic sol", hazard_class: "TOXIC", quantity_value: 0.2375, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c2: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers/${c2}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { p: $.data.id } }
            - { call: "POST /ehs/waste-pickup-requests/${p}/add-item", payload: { container_id: "${c1}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/add-item", payload: { container_id: "${c2}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
          trigger:
            - { call: "GET /ehs/waste-pickup-requests/${p}", as: EHSAdmin }
          assert:
            - "WastePickupRequest.${p}.estimated_quantity_total == 0.475"
            - "WastePickupRequest.${p}.estimated_cost == 85.08"

  - rule_id: non_linear_state_machine
    instances:
      - name: pickup_submit_reject_resubmit_cycle
        grounds:
          - state_machines.WastePickupRequest.SUBMITTED_to_REJECTED
          - state_machines.WastePickupRequest.REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic machine on WastePickupRequest: SUBMITTED -> REJECTED -> SUBMITTED is a
          revision loop; rejection preserves the linked items (estimated_quantity_total
          unchanged) and clears rejection_reason on re-submit.
        test_recipe:
          setup:
            - "Lab with trained PI; one 2.0 FLAMMABLE container tagged; pickup DRAFT with the item; submitted"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Chem E", department: "Chemistry", building: "Hall A", room: "105" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "FLAMMABLE", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "FL-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 2.0, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { p: $.data.id } }
            - { call: "POST /ehs/waste-pickup-requests/${p}/add-item", payload: { container_id: "${c1}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
          trigger:
            - { call: "POST /ehs/waste-pickup-requests/${p}/reject", payload: { reason: "missing manifest" }, as: EHSAdmin }
            - { call: "POST /ehs/waste-pickup-requests/${p}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "GET /ehs/waste-pickup-requests/${p}", as: EHSAdmin }
          assert:
            - "WastePickupRequest.${p}.status == SUBMITTED after the REJECTED intermediate state"
            - "WastePickupRequest.${p}.rejection_reason == null (cleared on re-submit)"
            - "WastePickupRequest.${p}.estimated_quantity_total == 2.0 (items preserved through the loop)"
      - name: corrective_action_rework_loop
        grounds:
          - state_machines.CorrectiveAction.SUBMITTED_to_REOPENED
          - state_machines.CorrectiveAction.REOPENED_to_SUBMITTED
          - state_machines.CorrectiveAction.SUBMITTED_to_VERIFIED
        distinguishing_aspect: |
          Cyclic machine on CorrectiveAction (different entity from the pickup cycle):
          OPEN -> SUBMITTED -> REOPENED -> SUBMITTED -> VERIFIED loops through rework;
          verification requires a different inspector than the one who completed the
          parent inspection.
        test_recipe:
          setup:
            - "Lab with PI; inspection completed by insp-1 with one MINOR finding -> one CorrectiveAction OPEN"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Bio F", department: "Biology", building: "Hall B", room: "206" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/inspections", payload: { lab_id: "${l}", inspector_id: "insp-1", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: EHSAdmin, captures: { insp: $.data.id } }
            - { call: "POST /ehs/inspections/${insp}/complete", payload: { findings: [ { severity: "MINOR", description: "fridge temp log gap" } ] }, as: EHSInspector, as_user_id: "insp-1" }
            - { call: "GET /ehs/inspections/${insp}/corrective-actions", as: EHSAdmin, captures: { ca: "$.data[0].id" } }
          trigger:
            - { call: "POST /ehs/corrective-actions/${ca}/submit", payload: { resolution_note: "log fixed" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/corrective-actions/${ca}/verify", payload: { decision: "REJECT" }, as: EHSInspector, as_user_id: "insp-2" }
            - { call: "POST /ehs/corrective-actions/${ca}/submit", payload: { resolution_note: "log fixed, photo attached" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/corrective-actions/${ca}/verify", payload: { decision: "APPROVE" }, as: EHSInspector, as_user_id: "insp-2" }
          assert:
            - "CorrectiveAction.${ca}.status == VERIFIED after traversing SUBMITTED -> REOPENED -> SUBMITTED"
            - "CorrectiveAction.${ca}.verified_by == insp-2"
            - "CorrectiveAction.${ca}.resolution_note == 'log fixed, photo attached'"

  - rule_id: transitive_cascade
    instances:
      - name: inspection_fail_cascade_freezes_registrations
        grounds:
          - state_machines.LabInspection.SCHEDULED_to_COMPLETED
          - state_machines.Registration.ACTIVE_to_SUSPENDED
          - calculations.lab_posture_derivation
          - entities.ChemicalContainer.fields.access_blocked
        distinguishing_aspect: |
          Depth-3 cascade from inspection completion: FAIL with a MAJOR finding forces
          lab.posture FROZEN (link 1); becoming FROZEN suspends the lab's ACTIVE
          registration (link 2); the suspension recomputes access_blocked=true on the
          lab's CONTROLLED_SUBSTANCE container (link 3).
        test_recipe:
          setup:
            - "Lab with PI; registration REG-1 (CONTROLLED_SUBSTANCE) created (OCC) and ACTIVE; one CONTROLLED_SUBSTANCE container CS-1; inspection SCHEDULED for insp-1"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Pharm G", department: "Pharmacy", building: "Hall D", room: "401" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "GET /ehs/labs/${l}", as: EHSAdmin, captures: { lv: $.data.version } }
            - { call: "POST /ehs/registrations", payload: { lab_id: "${l}", material_type: "CONTROLLED_SUBSTANCE", registration_number: "REG-1", expected_lab_version: "${lv}" }, as: EHSAdmin, captures: { reg: $.data.id } }
            - { call: "POST /ehs/registrations/${reg}/activate", payload: {}, as: EHSAdmin }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "CS-1", chemical_name: "Fentanyl stock", hazard_class: "CONTROLLED_SUBSTANCE", quantity_value: 0.5, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/inspections", payload: { lab_id: "${l}", inspector_id: "insp-1", scheduled_start: "2026-08-06T09:00:00Z", scheduled_end: "2026-08-06T10:00:00Z" }, as: EHSAdmin, captures: { insp: $.data.id } }
          trigger:
            - { call: "POST /ehs/inspections/${insp}/complete", payload: { findings: [ { severity: "MAJOR", description: "open CSA safe" }, { severity: "MAJOR", description: "missing log" } ] }, as: EHSInspector, as_user_id: "insp-1" }
            - { call: "GET /ehs/labs/${l}", as: EHSAdmin }
            - { call: "GET /ehs/labs/${l}/registrations", as: EHSAdmin, captures: { reg_status: "$.data[0].status" } }
            - { call: "GET /ehs/containers/${c1}", as: EHSAdmin }
          assert:
            - "LabInspection.${insp}.outcome == FAIL (score_weighted 60 < 70)"
            - "Lab.${l}.posture == FROZEN"
            - "Registration.${reg}.status == SUSPENDED"
            - "ChemicalContainer.${c1}.access_blocked == true"
      - name: pickup_complete_cascade_unflags_permit
        grounds:
          - state_machines.WastePickupRequest.SCHEDULED_to_COMPLETED
          - state_machines.ChemicalContainer.WASTE_TAGGED_to_PICKED_UP
          - calculations.hazard_threshold_screening
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (pickup completion, not inspection):
          completion flips the linked container WASTE_TAGGED -> PICKED_UP (link 1);
          the container's departure from the regulatory set re-screens hazard totals and
          flips lab.permit_report_required from true to false (link 2).
        test_recipe:
          setup:
            - "Lab with trained PI; FLAMMABLE containers 6.0 (stays IN_USE) and 5.0 (tagged, in a SCHEDULED pickup); permit_report_required true before completion (regulatory 11.0 >= 10.0)"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Chem H", department: "Chemistry", building: "Hall A", room: "108" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "FLAMMABLE", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "FL-A", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 6.0, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "FL-B", chemical_name: "Methanol", hazard_class: "FLAMMABLE", quantity_value: 5.0, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c2: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers/${c2}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { p: $.data.id } }
            - { call: "POST /ehs/waste-pickup-requests/${p}/add-item", payload: { container_id: "${c2}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/schedule", payload: { dock_id: "DOCK-1", window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T11:00:00Z" }, as: EHSAdmin }
          trigger:
            - { call: "POST /ehs/waste-pickup-requests/${p}/complete", payload: {}, as: EHSAdmin }
            - { call: "GET /ehs/containers/${c2}", as: EHSAdmin }
            - { call: "GET /ehs/labs/${l}", as: EHSAdmin }
          assert:
            - "WastePickupRequest.${p}.status == COMPLETED"
            - "ChemicalContainer.${c2}.state == PICKED_UP"
            - "Lab.${l}.hazard_totals_regulatory.FLAMMABLE == 6.0"
            - "Lab.${l}.permit_report_required == false"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_precedes_frozen_safety_on_submit
        grounds:
          - "validations[priority=6]"
          - "validations[priority=7]"
          - "errors[ERR_PICKUP_STATE]"
          - "errors[ERR_LAB_FROZEN]"
        distinguishing_aspect: |
          Category pair (state vs business_safety): a submit against a SCHEDULED pickup
          in a FROZEN lab violates both rules; priority 6 (state) wins, so the error is
          ERR_PICKUP_STATE, never ERR_LAB_FROZEN.
        test_recipe:
          setup:
            - "Pickup reached SCHEDULED; afterwards the lab's MINOR corrective action became overdue via clock advance -> posture FROZEN"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Chem I", department: "Chemistry", building: "Hall A", room: "109" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "FLAMMABLE", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "FL-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { p: $.data.id } }
            - { call: "POST /ehs/waste-pickup-requests/${p}/add-item", payload: { container_id: "${c1}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/schedule", payload: { dock_id: "DOCK-1", window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T11:00:00Z" }, as: EHSAdmin }
            - { call: "POST /ehs/inspections", payload: { lab_id: "${l}", inspector_id: "insp-1", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: EHSAdmin, captures: { insp: $.data.id } }
            - { call: "POST /ehs/inspections/${insp}/complete", payload: { findings: [ { severity: "MINOR", description: "missing signage" } ] }, as: EHSInspector, as_user_id: "insp-1" }
            - { call: "POST /ehs/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: EHSAdmin }
          trigger:
            - { call: "POST /ehs/waste-pickup-requests/${p}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { err: $.data.error_id } }
            - { call: "GET /ehs/waste-pickup-requests/${p}", as: EHSAdmin }
          assert:
            - "error_id == ERR_PICKUP_STATE (HTTP 409), not ERR_LAB_FROZEN"
            - "WastePickupRequest.${p}.status == SCHEDULED (unchanged)"
      - name: training_safety_precedes_cross_lab_referential
        grounds:
          - "validations[priority=9]"
          - "validations[priority=19]"
          - "errors[ERR_REQUIRED_TRAINING_INCOMPLETE]"
          - "errors[ERR_CROSS_LAB_REFERENCE]"
        distinguishing_aspect: |
          Different category pair from the state/safety instance (business_safety vs
          business_referential): a tag-waste call where the actor lacks training AND the
          target area belongs to another lab returns ERR_REQUIRED_TRAINING_INCOMPLETE
          (priority 9), not ERR_CROSS_LAB_REFERENCE (priority 19).
        test_recipe:
          setup:
            - "Lab L1 with PI pi1 who has NO FLAMMABLE training; Lab L2 with area area2; container c1 FLAMMABLE in L1"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab J1", department: "Chemistry", building: "Hall A", room: "110" }, as: EHSAdmin, captures: { l1: $.data.id } }
            - { call: "POST /ehs/labs", payload: { name: "Lab J2", department: "Chemistry", building: "Hall A", room: "111" }, as: EHSAdmin, captures: { l2: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l1}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi1: $.data.id } }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l1}", barcode: "FL-9", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi1}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l2}", name: "SAA-OTHER", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area2: $.data.id } }
          trigger:
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area2}" }, as: PrincipalInvestigator, as_user_id: "${pi1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REQUIRED_TRAINING_INCOMPLETE (HTTP 422), not ERR_CROSS_LAB_REFERENCE"
            - "ChemicalContainer.${c1}.state == IN_USE (unchanged)"

  - rule_id: boundary_precision_check
    instances:
      - name: permit_threshold_inclusive_boundary
        grounds:
          - calculations.hazard_threshold_screening
          - "validations[priority=1]"
          - entities.Lab.fields.permit_report_required
        distinguishing_aspect: |
          Numeric threshold boundary on the permit metric via GET /ehs/labs/{id}: the
          comparison is >= (inclusive), so a FLAMMABLE regulatory total of exactly 10.0
          flags the permit while 9.999 does not.
        test_recipe:
          setup:
            - "Lab A with one 9.999 FLAMMABLE container; Lab B with one 10.0 FLAMMABLE container (both IN_USE)"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab K1", department: "Chemistry", building: "Hall A", room: "112" }, as: EHSAdmin, captures: { la: $.data.id } }
            - { call: "POST /ehs/labs", payload: { name: "Lab K2", department: "Chemistry", building: "Hall A", room: "113" }, as: EHSAdmin, captures: { lb: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${la}", full_name: "Dr. Ay", role_in_lab: "PI" }, as: EHSAdmin, captures: { pia: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${lb}", full_name: "Dr. Bee", role_in_lab: "PI" }, as: EHSAdmin, captures: { pib: $.data.id } }
            - { call: "POST /ehs/containers", payload: { lab_id: "${la}", barcode: "B-A", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 9.999, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pia}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${lb}", barcode: "B-B", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 10.0, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pib}" }
          trigger:
            - { call: "GET /ehs/labs/${la}", as: EHSAdmin }
            - { call: "GET /ehs/labs/${lb}", as: EHSAdmin }
          assert:
            - "Lab.${la}.permit_report_required == false (9.999 < 10.0)"
            - "Lab.${lb}.permit_report_required == true (10.0 >= 10.0, inclusive)"
            - "Lab.${lb}.hazard_totals_regulatory.FLAMMABLE == 10.0"
      - name: pickup_submit_empty_vs_single_item
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_PICKUP_EMPTY]"
          - state_machines.WastePickupRequest.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Empty-collection boundary on item count (a different metric from the quantity
          threshold, reached via the submit endpoint rather than a lab read): zero
          linked items is rejected with ERR_PICKUP_EMPTY; exactly one item submits.
        test_recipe:
          setup:
            - "Lab with trained PI; DRAFT pickup with no items"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab L0", department: "Chemistry", building: "Hall A", room: "114" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "FLAMMABLE", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { p: $.data.id } }
          trigger:
            - { call: "POST /ehs/waste-pickup-requests/${p}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { err: $.data.error_id } }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "FL-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 2.0, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/add-item", payload: { container_id: "${c1}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests/${p}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
          assert:
            - "first submit: error_id == ERR_PICKUP_EMPTY (HTTP 422)"
            - "second submit succeeds: WastePickupRequest.${p}.status == SUBMITTED"
            - "WastePickupRequest.${p}.estimated_quantity_total == 2.0"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: frozen_lab_blocks_pickup_submit
        grounds:
          - state_machines.WastePickupRequest.DRAFT_to_SUBMITTED
          - calculations.lab_posture_derivation
          - "errors[ERR_LAB_FROZEN]"
        distinguishing_aspect: |
          Entity pair WastePickupRequest -> Lab: a DRAFT pickup with a valid item still
          cannot submit while its LAB's derived posture is FROZEN (overdue corrective
          action); the pickup stays DRAFT.
        test_recipe:
          setup:
            - "Lab with trained PI; DRAFT pickup with one tagged item; inspection completed with a MINOR finding; clock advanced past the CA due date -> posture FROZEN"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab M", department: "Chemistry", building: "Hall A", room: "115" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "POST /ehs/training-assignments", payload: { lab_id: "${l}", worker_id: "${pi}", hazard_class: "FLAMMABLE", due_date: "2027-01-01T00:00:00Z" }, as: EHSAdmin, captures: { tr: $.data.id } }
            - { call: "POST /ehs/training-assignments/${tr}/complete", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "FL-1", chemical_name: "Ethanol", hazard_class: "FLAMMABLE", quantity_value: 1.0, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { c1: $.data.id } }
            - { call: "POST /ehs/accumulation-areas", payload: { lab_id: "${l}", name: "SAA-1", area_type: "SAA", capacity_containers: 10 }, as: EHSAdmin, captures: { area: $.data.id } }
            - { call: "POST /ehs/containers/${c1}/tag-waste", payload: { accumulation_area_id: "${area}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/waste-pickup-requests", payload: { lab_id: "${l}" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { p: $.data.id } }
            - { call: "POST /ehs/waste-pickup-requests/${p}/add-item", payload: { container_id: "${c1}" }, as: PrincipalInvestigator, as_user_id: "${pi}" }
            - { call: "POST /ehs/inspections", payload: { lab_id: "${l}", inspector_id: "insp-1", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: EHSAdmin, captures: { insp: $.data.id } }
            - { call: "POST /ehs/inspections/${insp}/complete", payload: { findings: [ { severity: "MINOR", description: "missing signage" } ] }, as: EHSInspector, as_user_id: "insp-1" }
            - { call: "POST /ehs/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: EHSAdmin }
          trigger:
            - { call: "POST /ehs/waste-pickup-requests/${p}/submit", payload: {}, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LAB_FROZEN (HTTP 409)"
            - "WastePickupRequest.${p}.status == DRAFT (unchanged)"
      - name: controlled_container_requires_active_registration
        grounds:
          - "validations[priority=8]"
          - state_machines.Registration
          - "errors[ERR_CONTROLLED_MATERIAL_UNREGISTERED]"
        distinguishing_aspect: |
          Different entity pair (ChemicalContainer -> Registration): creating a
          CONTROLLED_SUBSTANCE container while the lab's matching registration is still
          PENDING (not ACTIVE) is rejected; only activation unblocks it.
        test_recipe:
          setup:
            - "Lab with PI; registration REG-2 for CONTROLLED_SUBSTANCE exists but is PENDING (never activated)"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab N", department: "Pharmacy", building: "Hall D", room: "402" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/workers", payload: { lab_id: "${l}", full_name: "Dr. Py", role_in_lab: "PI" }, as: EHSAdmin, captures: { pi: $.data.id } }
            - { call: "GET /ehs/labs/${l}", as: EHSAdmin, captures: { lv: $.data.version } }
            - { call: "POST /ehs/registrations", payload: { lab_id: "${l}", material_type: "CONTROLLED_SUBSTANCE", registration_number: "REG-2", expected_lab_version: "${lv}" }, as: EHSAdmin }
          trigger:
            - { call: "POST /ehs/containers", payload: { lab_id: "${l}", barcode: "CS-9", chemical_name: "Morphine stock", hazard_class: "CONTROLLED_SUBSTANCE", quantity_value: 0.25, quantity_unit: "GAL" }, as: PrincipalInvestigator, as_user_id: "${pi}", captures: { err: $.data.error_id } }
            - { call: "GET /ehs/containers?lab_id=${l}", as: EHSAdmin }
          assert:
            - "error_id == ERR_CONTROLLED_MATERIAL_UNREGISTERED (HTTP 422)"
            - "container list for the lab is empty (total_count == 0)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_half_open_window_overlap
        grounds:
          - "validations[priority=17]"
          - "errors[ERR_INSPECTOR_SCHEDULE_CONFLICT]"
          - entities.LabInspection.fields.scheduled_start
        distinguishing_aspect: |
          Half-open interval semantics on the Inspector resource: a second inspection
          starting exactly at the first's end (10:00 == 10:00) is allowed, while a
          09:30-10:30 window overlaps and is rejected.
        test_recipe:
          setup:
            - "Lab L; inspection A for insp-1 SCHEDULED 2026-08-10T09:00-10:00"
          setup_api_calls:
            - { call: "POST /ehs/labs", payload: { name: "Lab O", department: "Biology", building: "Hall B", room: "210" }, as: EHSAdmin, captures: { l: $.data.id } }
            - { call: "POST /ehs/inspections", payload: { lab_id: "${l}", inspector_id: "insp-1", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T10:00:00Z" }, as: EHSAdmin, captures: { ia: $.data.id } }
          trigger:
            - { call: "POST /ehs/inspections", payload: { lab_id: "${l}", inspector_id: "insp-1", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T11:00:00Z" }, as: EHSAdmin, captures: { ib: $.data.id } }
            - { call: "POST /ehs/inspections", payload: { lab_id: "${l}", inspector_id: "insp-1", scheduled_start: "2026-08-10T09:30:00Z", scheduled_end: "2026-08-10T10:30:00Z" }, as: EHSAdmin, captures: { err: $.data.error_id } }
          assert:
            - "adjacent inspection B created (201): LabInspection.${ib}.status == SCHEDULED"
            - "overlapping inspection C rejected: error_id == ERR_INSPECTOR_SCHEDULE_CONFLICT (HTTP 409)"
      - name: dock_thirty_minute_buffer_overlap
        grounds:
          - "validations[priority=18]"
          - "errors[ERR_DOCK_WINDOW_CONFLICT]"
          - entities.WastePickupRequest.fields.dock_id
        distinguishing_aspect: |
          Buffered-interval semantics on a different resource (dock, not inspector):
          windows at the same dock must be separated by >= 30 minutes — a gap of exactly
          30 minutes succeeds, a 15-minute gap conflicts. Adjacency alone (0 gap) is
          NOT sufficient, unlike the inspector rule.
        test_recipe:
          setup:
            - "Lab with trained PI; three tagged containers; three SUBMITTED pickups p1/p2/p3; p1 SCHEDULED at DOCK-1 2026-08-10T10:00-11:00"
          setup_api_calls:
