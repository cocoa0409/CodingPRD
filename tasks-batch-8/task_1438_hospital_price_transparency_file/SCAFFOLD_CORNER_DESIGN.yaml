            - "submit-plan from ESCALATED succeeds: attestation_status == PLAN_SUBMITTED (late plan path)"

      - name: contract_expiry_via_clock_cascades_rates_inactive
        claim_type: valid_transition
        grounds: [state_machines.PayerContract.ACTIVE_to_EXPIRED, state_machines.PayerNegotiatedRate.ACTIVE_to_INACTIVE]
        distinguishing_aspect: "Advancing the logical clock past effective_end auto-expires the ACTIVE contract (closed interval: expiry when current date > effective_end) and cascades its ACTIVE rate to INACTIVE without any contract endpoint call."
        test_recipe:
          setup: ["Facility F; payer PA; contract C [2026-01-01, 2026-08-15] ACTIVE with rate R ACTIVE"]
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-SM7", bed_count: 50 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-08-15T00:00:00Z" }, as: ContractManager, captures: { c: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${c}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager, captures: { r: $.data.id } }
            - { call: "POST /transparency/payer-contracts/${c}/activate", as: ContractManager }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /transparency/payers/${pa}/payer-contracts", as: ContractManager, captures: { c_st: "$.data[0].status" } }
            - { call: "GET /transparency/payer-negotiated-rates/${r}", as: ContractManager, captures: { r_st: $.data.status } }
          assert:
            - "contract.status == EXPIRED (auto-transition at clock advance; 2026-08-16 > effective_end 2026-08-15)"
            - "rate.status == INACTIVE (cascade from expiry)"

