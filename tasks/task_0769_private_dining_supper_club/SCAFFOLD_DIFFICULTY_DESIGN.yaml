  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_turnover_buffer_overlap
        grounds:
          - state_machines.Event.DRAFT_to_SCHEDULED
          - "validations[priority=7]"
          - "errors[ERR_VENUE_TIME_CONFLICT]"
          - entities.Event.fields.venue_id
        distinguishing_aspect: |
          Venue interval semantics: a second event at the same venue is rejected when [start, end + 120min turnover)
          intervals intersect — the buffer is appended to the END of the occupancy.
        test_recipe:
          setup:
            - "Event1 (venueA, chefA, 15:00-18:00) SCHEDULED; Event2 (same venueA, different chefB, 16:00-19:00) still DRAFT"
          setup_api_calls:
