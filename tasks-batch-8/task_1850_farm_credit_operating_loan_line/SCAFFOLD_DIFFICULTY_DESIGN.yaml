            - { call: "POST /draw-requests/${drw2}/approve", as: LoanOfficer }
            - { call: "POST /draw-requests/${drw2}/disburse", as: LoanOfficer }
            - { call: "GET /loan-accounts/${loan}/financial_summary", as: LoanOfficer, captures: { cov2: $.data.coverage_cents, po2: $.data.payment_posture } }
          assert:
            - "after 45,000,000: coverage_cents == 5000000 (${cov1}) and 5,000,000 x 10 >= 50,000,000 -> posture CURRENT (${po1})"
            - "after one cent more: coverage_cents == 4999999 (${cov2}) and 49,999,990 < 50,000,000 -> posture WATCH (${po2})"

  # ---------------------------------------------------------------- rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: draw_approve_requires_assigned_active_policy
        grounds:
          - state_machines.DrawRequest.REQUESTED_to_APPROVED
          - state_machines.InsurancePolicy.ACTIVE_to_CANCELLED
          - errors[ERR_INSURANCE_NOT_ASSIGNED]
        distinguishing_aspect: |
          Entity pair DrawRequest -> InsurancePolicy: cancelling the only
          ASSIGNED policy releases the assignment, and the draw-approve gate
          then fails with ERR_INSURANCE_NOT_ASSIGNED even though the loan is
          ACTIVE and availability is ample; re-assigning a replacement policy
          restores approvability.
        test_recipe:
          setup:
