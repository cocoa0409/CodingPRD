          - entities.Release.fields.disposition
          - state_machines.ShootBlock.ROLLING_to_WRAPPED
          - validations.priority_32
        distinguishing_aspect: |
          Aggregation claim over the disposition filter: covered head_count sums only
          COLLECTED and BLURRED_WAIVER rows. Four COLLECTED plus five REFUSED gives 4,
          not 9, so wrap fails against an expected crowd of 10; adding a single
          BLURRED_WAIVER row of 6 lifts covered to exactly 10 and wrap succeeds. An
          implementation that counted rows instead of head_count, or that counted
          REFUSED, would wrap on the first attempt.
        test_recipe:
          setup:
            - "One DOCUSOAP production; one STUDIO location; one ACTIVE DUTY_OF_CARE_OFFICER protocol covering 2026-09-01 to 2026-12-31; one ROLLING crowd block with expected_crowd_headcount 10 and no participants attached."
