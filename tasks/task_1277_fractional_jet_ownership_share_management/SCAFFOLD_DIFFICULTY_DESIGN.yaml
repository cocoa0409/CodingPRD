            - call: "POST /aircraft"
              payload: { program_id: "${prog_id}", tail_number: "N500BP", class_id: "${cls_mid}" }
              as: FleetOps
              captures: { tail_id: $.data.id }
            - call: "POST /bookings"
              payload: { share_id: "${share_id}", requested_class_id: "${cls_mid}", scheduled_departure_utc: "2026-12-10T15:00:00Z", estimated_block_hours: 2.00, expected_share_version: "${share_v}" }
              as: Owner
              as_user_id: "${own_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/confirm"
