  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_production_advance_gated_by_parent_window_status
        grounds:
          - state_machines.Order.ROUTED_to_IN_PRODUCTION
          - state_machines.ProductionWindow.CUTOFF_PASSED_to_IN_PRODUCTION
          - validations[priority=11]
          - errors.ERR_INVALID_ORDER_TRANSITION
        distinguishing_aspect: |
          The order's own state is legal (ROUTED) and the payload is legal, yet the transition must
          be refused because a DIFFERENT entity - the parent ProductionWindow - is only
          CUTOFF_PASSED. The identical request succeeds once the window itself reaches
          IN_PRODUCTION, so the outcome is a pure function of the other entity's state.
        test_recipe:
          setup:
            - "StatePolicy CA exists; Cook Omar is ACTIVE and CLEAR with weekly_capacity_meals 6."
            - "One APPROVED MenuItem at 1200 cents and one DOOR_DELIVERY zone."
            - "One ProductionWindow advanced to CUTOFF_PASSED (clock at 2026-08-06T00:00:00Z) holding one quantity-2 order in fulfillment_status ROUTED."
