      - name: corner_calc_warranty_part_and_labor_windows_diverge_from_one_completion
        claim_type: Correct Result
        grounds: ["calculations.warranty_coverage_expires_at", "calculations.warranty_coverage_state", "entities.WarrantyCoverage.fields.expires_at", "entities.WarrantyCoverage.fields.starts_at"]
        distinguishing_aspect: |
          One completion at 2026-06-01T12:00:00Z mints exactly two coverages that share
          a starts_at and diverge on expiry: the PART coverage runs
          PART_WARRANTY_DAYS 365 to 2027-06-01T12:00:00.000Z and the LABOR coverage
          runs LABOR_WARRANTY_DAYS 90 to 2026-08-30T12:00:00.000Z. Both start at the
          work order's actual_end_at, never at the consumption row's posted_at or at
          the coverage row's created_at. An implementation that uses one window for
          both returns the same expires_at twice.
        test_recipe:
          setup:
            - "One NONE-tier account, property, well, JOURNEYMAN technician and one CONTROL part costing 5000 cents with 10 on hand."
            - "One PRE_AUTHORIZED emergency work order of scope REPAIR with exactly one POSTED consumption row of quantity 1, completed while the clock reads 2026-06-01T12:00:00Z."
