            - &t1r
              call: "POST /truck-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", available_from: "2026-08-02T00:00:00Z", available_until: "2026-08-05T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_q_id}"
          trigger:
            - call: "POST /truck-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", available_from: "2026-08-05T00:00:00Z", available_until: "2026-08-08T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_q_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /truck-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", available_from: "2026-08-04T23:59:59Z", available_until: "2026-08-09T00:00:00Z" }
              as: CarrierAdmin
              as_user_id: "${carrier_q_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent window [2026-08-05, 2026-08-08) is accepted (201) — half-open adjacency is not overlap"
            - "Window [2026-08-04T23:59:59Z, 2026-08-09) returns 409 and err == ERR_TRUCK_WINDOW_OVERLAP"
            - "GET /truck-posts?carrier_org_id=${carrier_q_id}&status=AVAILABLE returns exactly 2 rows"

      - name: insurance_windows_gap_breaks_coverage_contiguity
        grounds:
          - calculations.insurance_coverage
          - errors.ERR_INSURANCE_WINDOW_GAP
        distinguishing_aspect: |
          Different interval semantics on a different resource (AuthorityVerification):
          windows must chain contiguously — next.effective_from <= covered_until. A one-day
          gap fails verification with ERR_INSURANCE_WINDOW_GAP even though each window
          individually is valid; adjacent (touching) windows verify cleanly.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Broker B exists. Two verifications submitted: V_gap with windows [2026-01-01,2026-06-01) and [2026-06-02,2027-01-01); V_ok with windows [2026-01-01,2026-06-01) and [2026-06-01,2027-01-01)."
          setup_api_calls:
            - *clock_aug1
            - &broker_i
              call: "POST /broker-orgs"
              payload: { legal_name: "Gap Coverage Brokers", mc_number: "MC-900" }
              as: PlatformAdmin
              captures: { broker_i_id: $.data.id }
            - &av_gap
              call: "POST /authority-verifications"
              payload: { broker_org_id: "${broker_i_id}", authority_reference: "MC-900-AUTH", insurance_windows: [{ effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }, { effective_from: "2026-06-02T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }] }
              as: BrokerAdmin
              as_user_id: "${broker_i_id}"
              captures: { av_gap_id: $.data.id }
            - &av_ok
              call: "POST /authority-verifications"
              payload: { broker_org_id: "${broker_i_id}", authority_reference: "MC-900-AUTH-2", insurance_windows: [{ effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }, { effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }] }
              as: BrokerAdmin
              as_user_id: "${broker_i_id}"
              captures: { av_ok_id: $.data.id }
          trigger:
            - call: "POST /authority-verifications/${av_gap_id}/verify"
              payload: {}
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /authority-verifications/${av_ok_id}/verify"
              payload: {}
              as: ComplianceAnalyst
          assert:
            - "V_gap verify returns 422 and err == ERR_INSURANCE_WINDOW_GAP; AuthorityVerification.${av_gap_id}.status remains PENDING and coverage_gap_detected == true"
            - "V_ok verify returns 200; AuthorityVerification.${av_ok_id}.status == VERIFIED and insurance_ok == true and covered_until == 2027-01-01T00:00:00Z"

  - rule_id: compensating_invariant
    instances:
      - name: post_then_timely_withdraw_restores_posting_quota
        grounds:
          - calculations.posting_quota_check
          - state_machines.LoadPost
          - state_machines.Subscription
        distinguishing_aspect: |
          Conserved quantity: Subscription.posts_used. Forward action (POST /load-posts,
          +1) paired with its compensating action (POST /load-posts/{id}/withdraw within
          24h, -1) leaves posts_used == 0 and period_price_cents == base + addon exactly;
          a withdrawal after 24h does NOT refund, proving the compensation is time-gated.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Broker B VERIFIED, subscribed to PRO plan (base 24900, allowance 3, tier1_limit 2, hard cap 10, LANE_LEVEL addon 2000)."
            - "posts_used == 0, period_price_cents == 26900."
          setup_api_calls:
            - *clock_aug1
            - *plan_pro
            - *broker_p
            - *sub_pro2
            - *av_broker_p
            - *av_broker_p_verify
          trigger:
            - call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 150000 }
              as: BrokerAdmin
              as_user_id: "${broker_p_id}"
              captures: { l_inv1: $.data.id }
            - call: "POST /load-posts/${l_inv1}/withdraw"
              payload: {}
              as: BrokerAdmin
              as_user_id: "${broker_p_id}"
            - call: "POST /load-posts"
              payload: { origin: "DAL", destination: "HOU", equipment_type: "DRY_VAN", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-05T00:00:00Z", rate_offer_cents: 150000 }
              as: BrokerAdmin
              as_user_id: "${broker_p_id}"
              captures: { l_inv2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:01Z" }
              as: PlatformAdmin
            - call: "POST /load-posts/${l_inv2}/withdraw"
              payload: {}
              as: BrokerAdmin
              as_user_id: "${broker_p_id}"
          assert:
            - "After post+timely-withdraw: Subscription posts_used == 0 and period_price_cents == 26900"
            - "LoadPost.${l_inv1}.status == WITHDRAWN"
            - "After the second post and a clock advance of 24h+1s: withdraw succeeds but posts_used == 1 (no refund)"
            - "Final period_price_cents == 26900 (post 1 within allowance 3 -> no overage)"

      - name: dispute_then_sustain_resolution_restores_credit_totals
        grounds:
          - state_machines.CreditReportEvent
          - state_machines.CreditDispute
          - calculations.broker_credit_score
        distinguishing_aspect: |
          Conserved quantity: BrokerOrg credit ledger totals. Filing a dispute (PUBLISHED ->
          UNDER_DISPUTE) then resolving SUSTAIN (UNDER_DISPUTE -> PUBLISHED) restores
          credit_score, days_to_pay averages, and included/under_dispute totals exactly —
          and at every point included + under_dispute + removed == 120000 (different
          conserved-quantity type than the posting-quota count invariant).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Broker B with 2 PUBLISHED events from carrier C: A (50000, dtp 30) and B (70000, dtp 40)."
            - "Pre-dispute: credit_score == 74, included 120000, under_dispute 0, removed 0."
          setup_api_calls:
            - *clock_aug1
            - *broker_b
            - *carrier_c2_unused
            - &creA
              call: "POST /credit-report-events"
              payload: { broker_org_id: "${broker_id}", invoice_amount_cents: 50000, days_to_pay: 30 }
              as: CarrierAdmin
              as_user_id: "${carrier2_id}"
            - &creB
              call: "POST /credit-report-events"
              payload: { broker_org_id: "${broker_id}", invoice_amount_cents: 70000, days_to_pay: 40 }
              as: CarrierAdmin
              as_user_id: "${carrier2_id}"
              captures: { creB_id: $.data.id }
          trigger:
            - call: "POST /credit-report-events/${creB_id}/disputes"
              payload: { reason: "Payment was within terms" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { disp_inv: $.data.id }
            - call: "POST /credit-disputes/${disp_inv}/resolve"
              payload: { outcome: "SUSTAIN" }
              as: ComplianceAnalyst
          assert:
            - "Mid-cycle (during dispute): included_amount_cents == 50000, under_dispute_amount_cents == 70000, removed_amount_cents == 0, credit_score == 73 (SIMPLE over A only: avg 30 -> raw 100, confidence 0.1 -> round(73.0))"
            - "After SUSTAIN resolve: CreditReportEvent.${creB_id}.status == PUBLISHED"
            - "Post-resolve: included_amount_cents == 120000, under_dispute_amount_cents == 0, removed_amount_cents == 0"
            - "Post-resolve credit_score == 74 and days_to_pay_simple == 35.0 — identical to pre-dispute values"
            - "Invariant held at every read: included + under_dispute + removed == 120000"
