  - rule_id: priority_pair_validation_conflict
    instances:
      - name: select_structure_deal_state_error_precedes_reserve_floor_error
        grounds:
          - validations.priority_16_ERR_INVALID_DEAL_STATE
          - validations.priority_49_ERR_RESERVE_BELOW_FLOOR
          - calculations.combined_operating_reserve_months
        distinguishing_aspect: |
          The request violates two rules at once: the deal is still in DILIGENCE rather
          than DILIGENCE_CLOSED (priority 16) and the gating DILIGENCE_ADJUSTED
          assessment reports reserve_months 1.00 against a floor of 3.00 (priority 49).
          Only the priority-16 error may surface. The fixture is tuned so that the
          alignment rating at priority 48 is MODERATE and therefore satisfied, which
          removes the intermediate rule and makes the 16-versus-50 ordering the sole
          thing under test.
        test_recipe:
          setup:
            - "Two Organizations each with annual_expense_cents 1200000000 and unrestricted_net_assets_cents 100000000, giving combined_monthly_expense_cents 200000000 and reserve_months 1.00"
            - "Two Programs per party arranged so program_overlap_index is exactly 0.5000 and program_overlap_points are the full 30.00, which with identical mission codes yields composite_score 70.00 and composite_rating MODERATE"
            - "The Restructuring left in DILIGENCE with zero DiligenceRequest rows, so the DILIGENCE -> DILIGENCE_CLOSED bubble-up cannot fire"
