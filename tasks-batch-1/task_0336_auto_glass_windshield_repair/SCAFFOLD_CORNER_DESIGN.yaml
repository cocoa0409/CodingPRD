            - call: "POST /part-orders"
              payload: { work_order_id: "${wo}", glass_part_id: "${pid}", quantity: 1, expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
              captures: { po: $.data.id, po_st: $.data.status }
          trigger:
            - call: "POST /part-orders/${po}/receive"
              payload: {}
              as: ShopManager
              captures: { po_st2: $.data.status }
            - call: "GET /glass-parts/${pid}"
