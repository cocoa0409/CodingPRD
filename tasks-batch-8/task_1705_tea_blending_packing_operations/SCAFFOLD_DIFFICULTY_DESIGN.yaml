# =============================================================================
# §1.8 Scaffold Difficulty Design — Tea Blending & Packing Operations
# Test Targeting Index: 9 Difficulty Rules x >=2 instances (19 total).
# Every chain replays from empty-DB against the §1.5 surface.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # ------------------------------------------------------------- Rule 1 ----
  - rule_id: dual_variant_calc
    instances:
      - name: batch_cost_provisional_vs_final
        grounds:
          - calculations.batch_cost_accounting
          - state_machines.BlendBatch.RECIPE_LOCKED_to_ALLOCATED
          - state_machines.BlendBatch.QC_REVIEW_to_RELEASED
        distinguishing_aspect: |
          Entity domain = BlendBatch cost accounting. The provisional variant
          (leaf line-costs only, at finalize-allocation) yields 48000 cents;
          the final variant (leaf + flavoring + 2% waste, at release) yields
          48960 cents for identical allocation data.
        test_recipe:
          setup:
            - "Supplier ACTIVE; lot1 BLACK 100.0 kg @1200 c/kg moisture 6.0 and lot2 BLACK 50.0 kg @1200 c/kg moisture 6.0, both grade A, residue PASS, RELEASED"
            - "Recipe r1 CONVENTIONAL LOOSE_PACK [{BLACK,B,100.0}] ACTIVE; batch target 40.0 locked; allocations 28.0 + 12.0"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Assam Co", origin_region: "Assam" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-01-15", weight_kg: 100.0, cost_per_kg_cents: 1200, moisture_pct: 6.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot1: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lot1}/grade-assessments", payload: { aroma_score: 90, briskness_score: 88, appearance_score: 92 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot1}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.30, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot1}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-01-20", weight_kg: 50.0, cost_per_kg_cents: 1200, moisture_pct: 6.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot2: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lot2}/grade-assessments", payload: { aroma_score: 90, briskness_score: 88, appearance_score: 92 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot2}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.30, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot2}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "R1", certification_target: "CONVENTIONAL", pack_format: "LOOSE_PACK", components: [{ leaf_type: "BLACK", min_grade: "B", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r1: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r1}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r1}", target_weight_kg: 40.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b1: $.data.id } }
            - { call: "POST /tea-ops/batches/${b1}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv2: $.data.version } }
            - { call: "POST /tea-ops/batches/${b1}/allocations", payload: { lot_id: "${lot1}", allocated_kg: 28.0, expected_batch_version: "${bv2}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "GET /tea-ops/batches/${b1}", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv3: $.data.version } }
            - { call: "POST /tea-ops/batches/${b1}/allocations", payload: { lot_id: "${lot2}", allocated_kg: 12.0, expected_batch_version: "${bv3}" }, as: BlendMaster, as_user_id: "bm-1" }
          trigger:
            - { call: "POST /tea-ops/batches/${b1}/finalize-allocation", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { prov: $.data.provisional_cost_cents } }
            - { call: "POST /tea-ops/batches/${b1}/blend", payload: { measured_moisture_pct: 6.2 }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b1}/submit-qc", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b1}/release", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { fin: $.data.final_cost_cents, aw: $.data.actual_weight_kg } }
          assert:
            - "BlendBatch.${b1}.provisional_cost_cents == 48000 (round(28.0*1200) + round(12.0*1200))"
            - "BlendBatch.${b1}.final_cost_cents == 48960 (48000 + 0 + round_half_up(48000*0.02))"
            - "${fin} != ${prov} — same inputs, two variants, different cents"
            - "BlendBatch.${b1}.actual_weight_kg == 39.579 (27.705 + 11.874 per-line rounded yield, flavoring 0)"

      - name: shelf_life_provisional_vs_final
        grounds:
          - calculations.packed_shelf_life
          - state_machines.ProductionRun.IN_PROGRESS_to_COMPLETED
          - entities.ProductionRun.fields.provisional_shelf_life_days
          - entities.ProductionRun.fields.final_shelf_life_days
        distinguishing_aspect: |
          Entity domain = ProductionRun shelf-life (different from Rule-1
          instance 1's BlendBatch cost). Provisional (moisture-decay estimate
          at creation) = 326 days; final (min with oldest-lot harvest ceiling
          at completion) = 295 days for the same run.
        test_recipe:
          setup:
            - "Supplier ACTIVE; lot GREEN 50.0 kg @800 c/kg moisture 5.0 harvest 2025-06-01, grade A, residue PASS, RELEASED"
            - "Recipe CONVENTIONAL LOOSE_PACK [{GREEN,C,100.0}] ACTIVE; batch target 20.0 fully allocated (single lot, component 20.0 <= 25.0 exempt from dominance), blended at measured moisture 6.25, RELEASED"
            - "Packaging line LOOSE_PACK ACTIVE"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Uva Co", origin_region: "Uva" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "GREEN", harvest_date: "2025-06-01", weight_kg: 50.0, cost_per_kg_cents: 800, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 90, briskness_score: 88, appearance_score: 92 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "R2", certification_target: "CONVENTIONAL", pack_format: "LOOSE_PACK", components: [{ leaf_type: "GREEN", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r2: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r2}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r2}", target_weight_kg: 20.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${lot}", allocated_kg: 20.0, expected_batch_version: "${bv}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/finalize-allocation", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/blend", payload: { measured_moisture_pct: 6.25 }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/submit-qc", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/packaging-lines", payload: { name: "LP-1", line_type: "LOOSE_PACK" }, as: ProductionPlanner, as_user_id: "pp-1", captures: { ln: $.data.id } }
          trigger:
            - { call: "POST /tea-ops/runs", payload: { line_id: "${ln}", batch_id: "${b}", planned_start: "2026-08-10T08:00:00Z", planned_end: "2026-08-10T10:00:00Z", planned_units: 500 }, as: ProductionPlanner, as_user_id: "pp-1", captures: { run: $.data.id, prov: $.data.provisional_shelf_life_days } }
            - { call: "POST /tea-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:30:00Z" }, as: PlatformAdmin, as_user_id: "adm-1" }
            - { call: "POST /tea-ops/runs/${run}/start", payload: {}, as: ProductionPlanner, as_user_id: "pp-1" }
            - { call: "POST /tea-ops/runs/${run}/complete", payload: { actual_units: 500 }, as: ProductionPlanner, as_user_id: "pp-1", captures: { fin: $.data.final_shelf_life_days } }
          assert:
            - "ProductionRun.${run}.provisional_shelf_life_days == 326 (365 - ceil(12.5)*3 = 365 - 39)"
            - "ProductionRun.${run}.final_shelf_life_days == 295 (min(326, 730 - 435 days of harvest age))"
            - "${fin} != ${prov} — final variant joins the harvest-age ceiling the provisional ignores"

  # ------------------------------------------------------------- Rule 2 ----
  - rule_id: combinatorial_formula
    instances:
      - name: contract_price_tier_multiplier_floor
        grounds:
          - calculations.contract_unit_price
          - state_machines.PrivateLabelContract.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: tiered discount
          selection (120000 units -> 0.15) multiplies a certification
          multiplier (ORGANIC -> 1.20) against base price under a floor:
          max(1, round(250 * 1.20 * 0.85)) = 255 cents.
        test_recipe:
          setup:
            - "ORGANIC LOOSE_PACK recipe ACTIVE (no flavoring); contract with base 250 cents, minimum 500, total 120000 in DRAFT"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Dimbula Co", origin_region: "Dimbula" }, as: ProcurementLead, as_user_id: "pl-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "R3", certification_target: "ORGANIC", pack_format: "LOOSE_PACK", components: [{ leaf_type: "GREEN", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r3: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r3}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/contracts", payload: { customer_name: "Acme Foods", recipe_id: "${r3}", minimum_units_per_run: 500, contracted_total_units: 120000, base_unit_price_cents: 250 }, as: AccountManager, as_user_id: "am-1", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /tea-ops/contracts/${c1}/activate", payload: {}, as: AccountManager, as_user_id: "am-1", captures: { price: $.data.contract_unit_price_cents } }
          assert:
            - "PrivateLabelContract.${c1}.contract_unit_price_cents == 255"
            - "PrivateLabelContract.${c1}.status == ACTIVE"

      - name: yield_per_line_rounding_order
        grounds:
          - calculations.moisture_adjusted_yield
          - state_machines.BlendBatch.ALLOCATED_to_BLENDED
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: per-line
          round_half_up to 3 decimals THEN sum gives 9.895 + 9.895 = 19.790 kg;
          sum-then-round would give 19.789 kg. Scaffold pins per-line-then-sum.
        test_recipe:
          setup:
            - "Two GREEN lots (10.0 kg each, moisture 6.0), RELEASED; CONVENTIONAL TEA_BAG recipe [{GREEN,C,100.0}] ACTIVE; batch target 20.0 locked, allocations 10.0 + 10.0"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Kandy Co", origin_region: "Kandy" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "GREEN", harvest_date: "2026-03-01", weight_kg: 10.0, cost_per_kg_cents: 500, moisture_pct: 6.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { la: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${la}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${la}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${la}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "GREEN", harvest_date: "2026-03-02", weight_kg: 10.0, cost_per_kg_cents: 500, moisture_pct: 6.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lb: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lb}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${lb}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${lb}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "R4", certification_target: "CONVENTIONAL", pack_format: "TEA_BAG", components: [{ leaf_type: "GREEN", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r4: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r4}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r4}", target_weight_kg: 20.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv2: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${la}", allocated_kg: 10.0, expected_batch_version: "${bv2}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "GET /tea-ops/batches/${b}", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv3: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${lb}", allocated_kg: 10.0, expected_batch_version: "${bv3}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/finalize-allocation", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
          trigger:
            - { call: "POST /tea-ops/batches/${b}/blend", payload: { measured_moisture_pct: 6.5 }, as: BlendMaster, as_user_id: "bm-1", captures: { y: $.data.yield_kg } }
          assert:
            - "BlendBatch.${b}.yield_kg == 19.790 (per-line: round(10.0*(1-1/95),3) = 9.895 twice, then summed)"
            - "19.790 != 19.789 — the sum-then-round misreading is falsifiably excluded"

      - name: component_scaling_evaluation_order
        grounds:
          - calculations.recipe_component_scaling
          - state_machines.BlendBatch.DRAFT_to_RECIPE_LOCKED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          flavoring is reserved from the target FIRST (2.5 kg), then leaf
          components are normalized over the remaining 47.5 kg pool, giving
          BLACK 28.5 / GREEN 19.0; normalizing leaf shares over the full
          50.0 kg target would wrongly give BLACK 30.0 / GREEN 20.0.
        test_recipe:
          setup:
            - "Flavoring f1 ACTIVE (natural, no allergens); recipe CONVENTIONAL LOOSE_PACK [{BLACK,B,57.0},{GREEN,C,38.0}] + flavoring 5.0% ACTIVE; batch target 50.0"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Nuwara Co", origin_region: "Nuwara Eliya" }, as: ProcurementLead, as_user_id: "pl-1" }
            - { call: "POST /tea-ops/flavorings", payload: { name: "Bergamot Oil", allergen_tags: [], natural_certified: true, cost_per_kg_cents: 3000 }, as: BlendMaster, as_user_id: "bm-1", captures: { f1: $.data.id } }
            - { call: "POST /tea-ops/recipes", payload: { name: "R5", certification_target: "CONVENTIONAL", pack_format: "LOOSE_PACK", components: [{ leaf_type: "BLACK", min_grade: "B", pct: 57.0 }, { leaf_type: "GREEN", min_grade: "C", pct: 38.0 }], flavoring_id: "${f1}", flavoring_pct: 5.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { r5: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r5}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r5}", target_weight_kg: 50.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
          trigger:
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { fk: $.data.flavoring_kg, rc: $.data.required_components } }
          assert:
            - "BlendBatch.${b}.flavoring_kg == 2.5 (50.0 * 0.05, reserved first)"
            - "BlendBatch.${b}.required_components contains {leaf_type: BLACK, required_kg: 28.5} (= 47.5 * 57/95)"
            - "BlendBatch.${b}.required_components contains {leaf_type: GREEN, required_kg: 19.0} (= 47.5 * 38/95)"
            - "28.5 + 19.0 + 2.5 == 50.0 — the pool identity holds only under the pinned order"

  # ------------------------------------------------------------- Rule 3 ----
  - rule_id: non_linear_state_machine
    instances:
      - name: leaf_lot_retest_cycle
        grounds:
          - state_machines.LeafLot.ON_HOLD_to_LAB_SUBMITTED
          - state_machines.LeafLot.LAB_SUBMITTED_to_RELEASED
          - calculations.residue_verdict_threshold
        distinguishing_aspect: |
          Cyclic machine on LeafLot: GRADED -> ON_HOLD (FAIL_SOFT) ->
          LAB_SUBMITTED (retest PASS) -> RELEASED; the ON_HOLD -> LAB_SUBMITTED
          arc closes a loop no linear pipeline has.
        test_recipe:
          setup:
            - "Supplier ACTIVE; lot BLACK 10.0 kg @600 moisture 5.5, graded B (80/80/80 -> 80.0)"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Galle Co", origin_region: "Galle" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 600, moisture_pct: 5.5 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
          trigger:
            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.75, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1", captures: { v1: $.data.verdict, tr1: $.data.test_round } }
            - { call: "GET /tea-ops/leaf-lots/${lot}", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { st1: $.data.status } }
            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabB", measured_residue_ppm: 0.30, test_method: "HPLC" }, as: QALabAnalyst, as_user_id: "an-1", captures: { v2: $.data.verdict, tr2: $.data.test_round } }
            - { call: "GET /tea-ops/leaf-lots/${lot}", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { st2: $.data.status } }
            - { call: "POST /tea-ops/leaf-lots/${lot}/release", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { st3: $.data.status } }
          assert:
            - "first test: ${v1} == FAIL_SOFT and lot status ${st1} == ON_HOLD (0.50 < 0.75 <= 1.00)"
            - "retest: ${v2} == PASS, ${tr2} == 2, lot status ${st2} == LAB_SUBMITTED (cycle ON_HOLD -> LAB_SUBMITTED)"
            - "release after retest: ${st3} == RELEASED"

      - name: blend_batch_hold_rework_cycle
        grounds:
          - state_machines.BlendBatch.ON_HOLD_to_QC_REVIEW
          - state_machines.LeafLot.RELEASED_to_ON_HOLD
        distinguishing_aspect: |
          Cyclic machine on BlendBatch (different entity from instance 1):
          QC_REVIEW -> ON_HOLD (via lot-recall cascade) -> QC_REVIEW (rework
          re-submission) -> RELEASED; the rework arc re-validates lot state.
        test_recipe:
          setup:
            - "Supplier ACTIVE; lot GREEN 30.0 kg @700 moisture 5.0, grade A, residue PASS, RELEASED; CONVENTIONAL TEA_BAG recipe [{GREEN,C,100.0}] ACTIVE; batch target 20.0 in QC_REVIEW"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Ruhuna Co", origin_region: "Ruhuna" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
