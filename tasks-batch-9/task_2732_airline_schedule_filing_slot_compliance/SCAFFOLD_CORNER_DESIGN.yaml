        distinguishing_aspect: |
          FlightLeg's parent is ScheduleVersion. A leg whose schedule_version_id matches no row must
          fail with ERR_SCHEDULE_VERSION_NOT_FOUND (404) at priority 10 — before the station existence
          checks at 7 could ever matter and long before curfew or route-authority rules — so the
          response must be 404 and not 422.
