              as: RightsHolderUser
              as_user_id: "${lbl}"
              captures: { rg: "$.data.id", st: "$.data.status", ev: "$.data.evidence_round", payee: "$.data.payee_holder_id", rev: "$.data.reviewed_by_user_id", dis: "$.data.disputing_holder_id", sup: "$.data.supersede_overlapping" }
            - name: approve_directly_from_submitted_rejected
              call: "POST /royalties/rights-registrations/${rg}/approve"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-review-2"
              captures: { err: "$.data.error_id" }
            - call: "POST /royalties/rights-registrations/${rg}/review"
              payload: {}
              as: RightsOpsAnalyst
              as_user_id: "analyst-review-2"
              captures: { st2: "$.data.status" }
          assert:
            - "status is SUPPLIED as SUBMITTED, evidence_round 0, reviewed_by_user_id null, disputing_holder_id null, supersede_overlapping false, collective_id null."
            - "payee_holder_id equals claimant_id (routing DIRECT), computed rather than supplied."
            - "Approve straight from SUBMITTED: HTTP 409 with error_id ERR_INVALID_REGISTRATION_STATE — UNDER_REVIEW is a mandatory waypoint; the row stays SUBMITTED."
            - "review moves SUBMITTED -> UNDER_REVIEW and the Work's rights_state is still UNMATCHED (only approval registers a work)."

      - name: registration_rejected_is_terminal_for_every_trigger
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RightsRegistration.terminal_states
