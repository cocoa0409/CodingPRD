        and quoted_total_cents 14932320
      - POST /orders/${o40}/quote returns 200
      - GET /orders/${o40}/price-breakdown returns discount_base_cents == 15000000 exactly (13935000 + 1065000)
      - Order.${o40}.volume_discount_cents == 1125000 (0.075 tier applies at the inclusive lower bound)
      - Order.${o40}.volume_discount_cents != 600000 (the 0.04 result an exclusive lower bound would give)
      - GET /orders/${o40}/price-breakdown returns discounted_base_cents == 13875000 and freight_cents == 915200 (3520.0 kg x 260)
      - Order.${o40}.quoted_total_cents == 14790200
      - Order.${o39}.quoted_total_cents - Order.${o40}.quoted_total_cents == 142120 (the 40-unit order is cheaper than the 39-unit order)
