          - calculations.compliance_exposure_score
          - entities.DisclosureArtifact.fields.expired_reason
          - entities.SurchargeProgram.fields.disclosure_ready
        distinguishing_aspect: |
          TRIGGER B - an ENFORCEMENT event on ComplaintCase (POST /complaint-cases/{id}/investigation-actions
          with action SUBSTANTIATE): a FOUR-level chain whose middle link is a recomputed boolean rather than a
          status, ComplaintCase SUBSTANTIATED -> program REMEDIATION -> three ATTESTED artifacts EXPIRED ->
          disclosure_ready false -> Terminal QUARANTINED with quarantine_reason DISCLOSURE_EXPIRED (a different
          reason code than trigger A's PROGRAM_DISABLED).
