          - validations[priority=10]
          - errors[ERR_REVIEWER_CONFLICT]
          - errors[ERR_REVIEW_WINDOW_PASSED]
        distinguishing_aspect: "business_safety (priority 8) vs business_temporal (priority 10) pair: a review opened by the SAME reviewer who endorsed AND more than 24 months after endorsement must surface ERR_REVIEWER_CONFLICT, not ERR_REVIEW_WINDOW_PASSED — a different category pair than state-vs-fiscal."
