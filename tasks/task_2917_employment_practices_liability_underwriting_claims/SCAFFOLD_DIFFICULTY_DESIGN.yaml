# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_2917_employment_practices_liability_underwriting_claims
#
# Every instance grounds ONLY in elements already declared in SCAFFOLD.yaml
# §1.1–§1.7. Deleting this file leaves the scaffold's declared behavior
# identical; it only makes coverage harder to audit.
#
# Logical clock default (SCAFFOLD.yaml §1.5, POST /epli/_clock/set_current_utc):
#   2026-08-01T00:00:00Z
# Every timestamp literal below is ISO-8601 UTC with three fractional digits.
#
# Pinned principals (SCAFFOLD.yaml §1.7 rbac_notes.pinned_user_ids):
#   admin-001 | uw-001 uw-002 | uwm-001 uwm-002 | adj-001 adj-002 | clm-001 clm-002
# PanelCounsel / PolicyholderContact are entity_backed: X-User-ID is the
# DefensePanelFirm.id / Applicant.id respectively.
#
# 9 rule_ids, 24 instances (2 + 2 + 2 + 3 + 3 + 3 + 3 + 3 + 3).
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: premium_quote_vs_bound_audit_variant_divergence
        grounds:
          - calculations.indicated_premium
          - calculations.turnover_pct
          - calculations.risk_credit_pct
          - entities.ExposureAssessment.fields.indicated_premium_cents
          - entities.Applicant.fields.separations_since_assessment
          - entities.Policy.fields.bound_premium_cents
          - entities.Policy.fields.premium_variance_cents
          - state_machines.ExposureAssessment.APPROVED_to_BOUND
        distinguishing_aspect: |
          This instance exercises the dual-variant calculation in the UNDERWRITING /
          PREMIUM entity domain (Applicant + ExposureAssessment + RatePlan + Policy):
          the QUOTE variant reads prior_year_separations only and counts every ACTIVE
          risk-management service, while the BOUND_AUDIT variant adds
          separations_since_assessment and counts only services whose completed_at
          <= Policy.effective_from, so the SAME applicant row yields
          indicated_premium_cents == 17360516 and bound_premium_cents == 19844261
          with premium_variance_cents == 2483745.
        test_recipe:
          setup:
            - "Jurisdictions CA (hazard_tier T4) and TX (hazard_tier T2) exist."
            - "RatePlan 'EPLI Standard 2026' is ACTIVE with base_rate_per_employee_cents 41750 and min_premium_cents 750000."
            - "Applicant 'Northgate Retail Group': total_headcount 400, prior_year_separations 96, CA 262 / TX 138, primary CA — turnover_pct 24.00, hazard_load_pct 0.215, exposure_score 75.20 before credits."
            - "Two RiskManagementService rows are ACTIVE: HOTLINE_SUBSCRIPTION credit_pct 0.08 completed at 2026-08-01, HANDBOOK_REVIEW credit_pct 0.05 completed at 2026-08-10 — so risk_credit_pct is 0.13 and exposure_score is 65.20."
            - "The assessment is priced (PRICED, because 65.20 < 72.00) and approved by uwm-001, then separations_since_assessment is set to 44."
            - "The policy is bound with effective_from 2026-08-05, which sits AFTER the hotline completion and BEFORE the handbook completion."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "CA", name: "California", hazard_tier: "T4", admin_agency_name: "California Civil Rights Department", pre_suit_window_days: 180, wage_hour_multiplier: 1.60, class_action_propensity_pct: 42.00, pre_suit_mediation_required: true }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00, pre_suit_mediation_required: false }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/rate-plans"
              payload: { name: "EPLI Standard 2026", base_rate_per_employee_cents: 41750, min_premium_cents: 750000, wage_hour_sublimit_pct: 0.25, third_party_sublimit_pct: 0.40 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { plan_id: $.data.id }
            - call: "POST /epli/rate-plans/${plan_id}/activate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/applicants"
              payload: { legal_name: "Northgate Retail Group", total_headcount: 400, prior_year_separations: 96, jurisdiction_headcounts: [{ code: "CA", headcount: 262 }, { code: "TX", headcount: 138 }], primary_jurisdiction_code: "CA" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_id: $.data.id }
            - call: "POST /epli/applicants/${app_id}/risk-management-services"
              payload: { service_type: "HOTLINE_SUBSCRIPTION", credit_pct: 0.08, effective_from: "2026-07-01T00:00:00.000Z", effective_to: "2027-07-01T00:00:00.000Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { svc_hotline_id: $.data.id }
            - call: "POST /epli/risk-management-services/${svc_hotline_id}/complete"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /epli/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/applicants/${app_id}/risk-management-services"
              payload: { service_type: "HANDBOOK_REVIEW", credit_pct: 0.05, effective_from: "2026-08-06T00:00:00.000Z", effective_to: "2027-08-06T00:00:00.000Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { svc_handbook_id: $.data.id }
            - call: "POST /epli/risk-management-services/${svc_handbook_id}/complete"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "GET /epli/applicants/${app_id}"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_v: $.data.version }
            - call: "POST /epli/exposure-assessments"
              payload: { applicant_id: "${app_id}", rate_plan_id: "${plan_id}", requested_aggregate_limit_cents: 200000000, requested_retention_cents: 5000000, third_party_coverage_requested: true, expected_applicant_version: "${app_v}" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { asmt_id: $.data.id }
            - call: "POST /epli/exposure-assessments/${asmt_id}/price"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /epli/exposure-assessments/${asmt_id}/approve"
              payload: {}
              as: UnderwritingManager
              as_user_id: "uwm-001"
            - call: "PATCH /epli/applicants/${app_id}"
              payload: { separations_since_assessment: 44 }
              as: Underwriter
              as_user_id: "uw-001"
          trigger:
            - call: "POST /epli/policies"
              payload: { exposure_assessment_id: "${asmt_id}", effective_from: "2026-08-05T00:00:00.000Z", effective_to: "2027-08-05T00:00:00.000Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pol_id: $.data.id }
          assert:
            - "ExposureAssessment.${asmt_id}.turnover_pct_snapshot == 24.00"
            - "ExposureAssessment.${asmt_id}.exposure_score_snapshot == 65.20"
            - "ExposureAssessment.${asmt_id}.base_premium_cents == 14278501"
            - "ExposureAssessment.${asmt_id}.turnover_load_cents == 1998990"
            - "ExposureAssessment.${asmt_id}.hazard_load_cents == 3069878"
            - "ExposureAssessment.${asmt_id}.limit_load_cents == 1427850"
            - "ExposureAssessment.${asmt_id}.retention_credit_cents == 713925"
            - "ExposureAssessment.${asmt_id}.risk_mgmt_credit_cents == 2700778"
            - "ExposureAssessment.${asmt_id}.indicated_premium_cents == 17360516"
            - "ExposureAssessment.${asmt_id}.status == BOUND"
            - "Policy.${pol_id}.bound_premium_cents == 19844261"
            - "Policy.${pol_id}.premium_variance_cents == 2483745"
            - "Policy.${pol_id}.aggregate_limit_cents == 200000000"
            - "Policy.${pol_id}.per_claim_retention_cents == 5000000"
            - "Policy.${pol_id}.wage_hour_sublimit_cents == 50000000"
            - "Policy.${pol_id}.third_party_sublimit_cents == 80000000"
            - "Policy.${pol_id}.status == ACTIVE"
            - "Policy.${pol_id}.limit_posture == OPEN"
            - "Applicant.${app_id}.risk_credit_pct == 0.13"
            - "Applicant.${app_id}.turnover_pct == 24.00 (the applicant's own turnover_pct is NEVER re-derived from separations_since_assessment; only the BOUND_AUDIT variant adds it)"
            - "Policy.${pol_id}.bound_premium_cents != ExposureAssessment.${asmt_id}.indicated_premium_cents"

      - name: retention_per_claim_vs_group_aggregated_variant_divergence
        grounds:
          - calculations.claim_retention
          - calculations.indemnity_waterfall
          - entities.Claim.fields.retention_basis
          - entities.Claim.fields.applied_retention_cents
          - entities.RelatedClaimGroup.fields.shared_retention_cents
          - entities.RelatedClaimGroup.fields.retention_basis_claim_id
          - state_machines.RelatedClaimGroup.OPEN_to_LOCKED
        distinguishing_aspect: |
          This instance exercises the dual-variant calculation in the CLAIMS /
          RETENTION entity domain (Claim + RelatedClaimGroup + IndemnityPayment) — a
          different entity domain from premium_quote_vs_bound_audit_variant_divergence.
          Three wage-and-hour claims each carry per_claim_retention_cents 7500000; under
          PER_CLAIM they would collect 22500000 of retention in total, but once grouped
          the GROUP_AGGREGATED variant collapses them to a single shared_retention_cents
          of 7500000, so the SECOND 5000000 payment splits 2500000 retention /
          2500000 insurer instead of 5000000 / 0.
        test_recipe:
          setup:
            - "Chain P is in place: CA (T4) and TX (T2) jurisdictions, ACTIVE RatePlan, applicant 'Northgate Retail Group', assessment priced REFERRED at 75.20 with no risk services, approved by uwm-001, policy ACTIVE with aggregate_limit_cents 200000000 and per_claim_retention_cents 5000000."
            - "Three WAGE_AND_HOUR / EMPLOYEE claims g1, g2, g3 are reported inside the policy period and each accepted, so each has per_claim_retention_cents 7500000 (5000000 * 1.50) and applied_retention_cents 7500000 while retention_basis is PER_CLAIM."
            - "A RelatedClaimGroup with aggregation_basis COMMON_POLICY_PRACTICE and lead_claim_id g1 is opened, then g2 and g3 are attached, flipping all three to GROUP_AGGREGATED."
            - "A first 5000000 SETTLEMENT payment on g1 is approved, consuming 5000000 of the group's 7500000 shared retention."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "CA", name: "California", hazard_tier: "T4", admin_agency_name: "California Civil Rights Department", pre_suit_window_days: 180, wage_hour_multiplier: 1.60, class_action_propensity_pct: 42.00, pre_suit_mediation_required: true }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00, pre_suit_mediation_required: false }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/rate-plans"
              payload: { name: "EPLI Standard 2026", base_rate_per_employee_cents: 41750, min_premium_cents: 750000, wage_hour_sublimit_pct: 0.25, third_party_sublimit_pct: 0.40 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { plan_id: $.data.id }
            - call: "POST /epli/rate-plans/${plan_id}/activate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/applicants"
              payload: { legal_name: "Northgate Retail Group", total_headcount: 400, prior_year_separations: 96, jurisdiction_headcounts: [{ code: "CA", headcount: 262 }, { code: "TX", headcount: 138 }], primary_jurisdiction_code: "CA" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /epli/exposure-assessments"
              payload: { applicant_id: "${app_id}", rate_plan_id: "${plan_id}", requested_aggregate_limit_cents: 200000000, requested_retention_cents: 5000000, third_party_coverage_requested: true, expected_applicant_version: "${app_v}" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { asmt_id: $.data.id }
            - call: "POST /epli/exposure-assessments/${asmt_id}/price"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /epli/exposure-assessments/${asmt_id}/approve"
              payload: {}
              as: UnderwritingManager
              as_user_id: "uwm-001"
            - call: "POST /epli/policies"
              payload: { exposure_assessment_id: "${asmt_id}", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2027-08-01T00:00:00.000Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pol_id: $.data.id }
            - call: "POST /epli/policies/${pol_id}/claims"
              payload: { claim_type: "WAGE_AND_HOUR", claimant_class: "EMPLOYEE", notice_type: "LAWSUIT", first_notice_at: "2026-08-01T00:00:00.000Z", alleged_damages_cents: 40000000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { g1_id: $.data.id }
            - call: "POST /epli/policies/${pol_id}/claims"
              payload: { claim_type: "WAGE_AND_HOUR", claimant_class: "EMPLOYEE", notice_type: "LAWSUIT", first_notice_at: "2026-08-01T00:00:00.000Z", alleged_damages_cents: 30000000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { g2_id: $.data.id }
            - call: "POST /epli/policies/${pol_id}/claims"
              payload: { claim_type: "WAGE_AND_HOUR", claimant_class: "EMPLOYEE", notice_type: "LAWSUIT", first_notice_at: "2026-08-01T00:00:00.000Z", alleged_damages_cents: 20000000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { g3_id: $.data.id }
            - call: "POST /epli/claims/${g1_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /epli/claims/${g1_id}/coverage-decision"
              payload: { decision: "ACCEPT" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /epli/claims/${g2_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /epli/claims/${g2_id}/coverage-decision"
              payload: { decision: "ACCEPT" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /epli/claims/${g3_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /epli/claims/${g3_id}/coverage-decision"
              payload: { decision: "ACCEPT" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /epli/related-claim-groups"
              payload: { policy_id: "${pol_id}", lead_claim_id: "${g1_id}", aggregation_basis: "COMMON_POLICY_PRACTICE" }
              as: ClaimsManager
              as_user_id: "clm-001"
              captures: { grp_id: $.data.id, grp_v1: $.data.version }
            - call: "POST /epli/related-claim-groups/${grp_id}/claims"
              payload: { claim_id: "${g2_id}", expected_related_claim_group_version: "${grp_v1}" }
              as: ClaimsManager
              as_user_id: "clm-001"
              captures: { grp_v2: $.data.version }
            - call: "POST /epli/related-claim-groups/${grp_id}/claims"
              payload: { claim_id: "${g3_id}", expected_related_claim_group_version: "${grp_v2}" }
              as: ClaimsManager
              as_user_id: "clm-001"
            - call: "GET /epli/policies/${pol_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { pol_v1: $.data.version }
            - call: "POST /epli/claims/${g1_id}/indemnity-payments"
              payload: { amount_cents: 5000000, payment_basis: "SETTLEMENT", expected_policy_version: "${pol_v1}" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { pay1_id: $.data.id }
            - call: "POST /epli/indemnity-payments/${pay1_id}/approve"
              payload: {}
              as: ClaimsManager
              as_user_id: "clm-001"
            - call: "GET /epli/policies/${pol_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { pol_v2: $.data.version }
          trigger:
            - call: "POST /epli/claims/${g2_id}/indemnity-payments"
              payload: { amount_cents: 5000000, payment_basis: "SETTLEMENT", expected_policy_version: "${pol_v2}" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { pay2_id: $.data.id }
            - call: "POST /epli/indemnity-payments/${pay2_id}/approve"
              payload: {}
              as: ClaimsManager
              as_user_id: "clm-001"
          assert:
            - "Claim.${g1_id}.per_claim_retention_cents == 7500000"
            - "Claim.${g2_id}.per_claim_retention_cents == 7500000"
            - "Claim.${g3_id}.per_claim_retention_cents == 7500000"
            - "Claim.${g1_id}.retention_basis == GROUP_AGGREGATED"
            - "Claim.${g2_id}.retention_basis == GROUP_AGGREGATED"
            - "Claim.${g1_id}.applied_retention_cents == 0"
            - "Claim.${g2_id}.applied_retention_cents == 0"
            - "RelatedClaimGroup.${grp_id}.member_count == 3"
            - "RelatedClaimGroup.${grp_id}.shared_retention_cents == 7500000"
            - "RelatedClaimGroup.${grp_id}.retention_basis_claim_id == ${g1_id}"
            - "IndemnityPayment.${pay1_id}.retention_portion_cents == 5000000"
            - "IndemnityPayment.${pay1_id}.insurer_portion_cents == 0"
            - "IndemnityPayment.${pay2_id}.retention_portion_cents == 2500000"
            - "IndemnityPayment.${pay2_id}.insurer_portion_cents == 2500000"
            - "IndemnityPayment.${pay2_id}.sublimit_bucket == WAGE_HOUR"
            - "RelatedClaimGroup.${grp_id}.retention_paid_cents == 7500000"
            - "RelatedClaimGroup.${grp_id}.status == LOCKED"
            - "Policy.${pol_id}.indemnity_paid_cents == 2500000"
            - "Policy.${pol_id}.aggregate_limit_remaining_cents == 197500000"
            - "Policy.${pol_id}.wage_hour_sublimit_remaining_cents == 47500000"
            - "Policy.${pol_id}.limit_posture == ERODED"
            - "IndemnityPayment.${pay2_id}.insurer_portion_cents == 2500000, whereas the PER_CLAIM variant would have produced retention_portion_cents 5000000 and insurer_portion_cents 0"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: premium_per_jurisdiction_round_then_sum_order
        grounds:
          - calculations.indicated_premium
          - calculations.hazard_load_pct
          - entities.ExposureAssessment.fields.base_premium_cents
          - entities.Applicant.fields.jurisdiction_headcounts
          - state_machines.ExposureAssessment.DRAFT_to_REFERRED
        distinguishing_aspect: |
          Mode (b) — rounding order. calculations.indicated_premium pins the base
          premium to a PER-JURISDICTION round-then-sum: per_employee_exact is
          41750 * 0.855 = 35696.25 (carried unrounded), each jurisdiction share is
          rounded to whole cents FIRST (CA 262 * 35696.25 = 9352417.5 -> 9352418,
          TX 138 * 35696.25 = 4926082.5 -> 4926083) and only then summed to
          14278501. Rounding the single product 400 * 35696.25 = 14278500 instead
          yields 14278500 and drags the whole chain to a final
          indicated_premium_cents of 20061293 rather than 20061294.
        test_recipe:
          setup:
            - "Jurisdictions CA (T4) and TX (T2) exist; RatePlan 'EPLI Standard 2026' is ACTIVE (base_rate_per_employee_cents 41750, min_premium_cents 750000)."
            - "Applicant 'Northgate Retail Group' has total_headcount 400 in the 251..1000 HEADCOUNT_FACTOR band (0.855), CA 262 / TX 138 — both jurisdiction shares land on an exact .5 cent."
            - "No RiskManagementService rows exist, so risk_credit_pct is 0.00 and risk_mgmt_credit_cents is 0 — the divergence is not masked by a credit."
            - "An ExposureAssessment requests aggregate_limit 200000000 and retention 5000000 and is still DRAFT."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "CA", name: "California", hazard_tier: "T4", admin_agency_name: "California Civil Rights Department", pre_suit_window_days: 180, wage_hour_multiplier: 1.60, class_action_propensity_pct: 42.00, pre_suit_mediation_required: true }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00, pre_suit_mediation_required: false }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/rate-plans"
              payload: { name: "EPLI Standard 2026", base_rate_per_employee_cents: 41750, min_premium_cents: 750000, wage_hour_sublimit_pct: 0.25, third_party_sublimit_pct: 0.40 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { plan_id: $.data.id }
            - call: "POST /epli/rate-plans/${plan_id}/activate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/applicants"
              payload: { legal_name: "Northgate Retail Group", total_headcount: 400, prior_year_separations: 96, jurisdiction_headcounts: [{ code: "CA", headcount: 262 }, { code: "TX", headcount: 138 }], primary_jurisdiction_code: "CA" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /epli/exposure-assessments"
              payload: { applicant_id: "${app_id}", rate_plan_id: "${plan_id}", requested_aggregate_limit_cents: 200000000, requested_retention_cents: 5000000, third_party_coverage_requested: true, expected_applicant_version: "${app_v}" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "POST /epli/exposure-assessments/${asmt_id}/price"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
          assert:
            - "Applicant.${app_id}.turnover_pct == 24.00"
            - "Applicant.${app_id}.hazard_load_pct == 0.215"
            - "Applicant.${app_id}.exposure_score == 75.20"
            - "ExposureAssessment.${asmt_id}.base_premium_cents == 14278501"
            - "ExposureAssessment.${asmt_id}.base_premium_cents != 14278500"
            - "ExposureAssessment.${asmt_id}.turnover_load_cents == 1998990"
            - "ExposureAssessment.${asmt_id}.hazard_load_cents == 3069878"
            - "ExposureAssessment.${asmt_id}.limit_load_cents == 1427850"
            - "ExposureAssessment.${asmt_id}.retention_credit_cents == 713925"
