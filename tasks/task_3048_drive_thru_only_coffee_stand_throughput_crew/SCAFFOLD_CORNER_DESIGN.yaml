              payload: { stand_id: "${stand_id}", source: "LOYALTY_APP", loyalty_account_id: "${acct_id}", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: LoyaltyCustomer
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: LoyaltyCustomer
              as_user_id: "${acct_id}"
              captures: { stale_v: $.data.version }
            # intervening mutation bumps the stand version
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stale_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
          trigger:
            - call: "POST /orders/${order_id}/merge"
              payload: { expected_stand_version: "${stale_v}" }
              as: LoyaltyCustomer
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: LoyaltyCustomer
              as_user_id: "${acct_id}"
              captures: { fresh_v: $.data.version }
            - call: "POST /orders/${order_id}/merge"
              payload: { expected_stand_version: "${fresh_v}" }
              as: LoyaltyCustomer
              as_user_id: "${acct_id}"
              captures: { merged_lane: $.data.lane_code, merged_status: $.data.queue_status }
          assert:
            - "merge with stale version -> 412 ERR_STALE_VERSION; order stays QUEUED"
            - "merge with fresh version succeeds: queue_status MERGED, lane_code \"B\" (lane A carries the window order's 60s outstanding build, lane B's projected clear is 0)"

      - name: stale_shift_version_rejected_on_assignment_add
        claim_type: optimistic_concurrency
