            - "Call 2 succeeds: state == COUNTERED, current_fee_per_store_cents == 60000, round_index == 1, last_offer_side == RETAILER"
            - "Call 3 returns 409 ERR_PROPOSAL_NOT_LOWER — 60000 is not strictly below the standing 60000"
            - "Calls 4-8 alternate legally: after the third counter (call 7) round_index == 3 and state == COUNTERED; call 8 re-proposes 56000 leaving state PROPOSED"
            - "Call 9 returns 409 ERR_NEGOTIATION_ROUNDS_EXHAUSTED — round_index has already reached MAX_NEGOTIATION_ROUNDS = 3"
            - "SlottingDeal.${deal}.state is still PROPOSED with current_fee_per_store_cents == 56000, round_index == 3 and last_offer_side == BROKER, so the deal remains acceptable by the retailer"

      - name: review_lock_reopen_cycle_is_bounded_and_window_guarded
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CategoryReview.SCHEDULED_to_OPEN
          - state_machines.CategoryReview.OPEN_to_PRESENTATION_LOCKED
          - state_machines.CategoryReview.PRESENTATION_LOCKED_to_OPEN
          - errors.ERR_SUBMISSION_WINDOW_STILL_OPEN
          - errors.ERR_REVIEW_REOPEN_LIMIT
          - errors.ERR_REVIEW_CALENDAR_INVALID
          - errors.ERR_REVIEW_WINDOW_STARTED
        distinguishing_aspect: |
          Four temporal guards on one small cycle: locking before the deadline is
          refused (422 ERR_SUBMISSION_WINDOW_STILL_OPEN), a reopen deadline must
          sit strictly between now and review_window_start (409
          ERR_REVIEW_CALENDAR_INVALID), reopening on or after
          review_window_start is refused (422 ERR_REVIEW_WINDOW_STARTED), and the
          loop is capped at MAX_REVIEW_REOPENS = 1 (409 ERR_REVIEW_REOPEN_LIMIT).
        test_recipe:
