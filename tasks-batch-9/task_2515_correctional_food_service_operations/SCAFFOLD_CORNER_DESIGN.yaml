          - errors.ERR_SHARPS_COUNT_OVER_AUTHORIZED
          - endpoints[POST /cfs/facilities/{id}/sharps-audit]
        distinguishing_aspect: "The ceiling is on the whole accountability identity, not just the counted figure: with one sharp issued out, a counted_on_board of 12 against 12 authorized already overshoots by one, while 11 is exactly at the limit and passes."
        test_recipe:
          setup:
