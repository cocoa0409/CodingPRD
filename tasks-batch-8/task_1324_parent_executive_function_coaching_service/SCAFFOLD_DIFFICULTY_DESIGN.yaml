      - name: note_share_gated_by_consent_state
        grounds:
          - state_machines.CoordinationNote.FINALIZED_to_SHARED
          - state_machines.ConsentGrant.PENDING_SIGNATURE_to_ACTIVE
          - validations[priority=16]
        distinguishing_aspect: |
          Different entity pair than Session -> Package: CoordinationNote ->
          ConsentGrant. Sharing a FINALIZED note fails while the consent is
          PENDING_SIGNATURE (ERR_CONSENT_NOT_ACTIVE) and succeeds after the
          consent transitions to ACTIVE; the shared note then appears in the
          contact's consent-limited view.
        test_recipe:
          setup:
            - "Family with one client; coach-authored FINALIZED note (topic PROGRESS)"
            - "Contact for the same family; ConsentGrant scope FULL_PLAN created but still PENDING_SIGNATURE"
          setup_api_calls:
