            - "second trigger call: HTTP 201 — [2026-08-07, 2026-08-09) does not overlap [2026-08-03, 2026-08-07) because the seat interval is half-open at the end"
            - "SecureEnvironmentSession.${sess_e_id}.status == SCHEDULED and workstation_class == ONSITE_SECURE"
