  # ===========================================================================
  - section: state_machines
    instances:

      - name: settlement_cycle_starts_in_open
        claim_type: Initial State
        grounds:
          - state_machines.SettlementCycle.initial_state
          - endpoints.POST_car-hire_settlement-cycles
        distinguishing_aspect: "A freshly created cycle is OPEN with every money field at 0, variant_applied null and reopen_count 0 — the compute has not run yet, so period_start_at/period_end_at are derived from period_month while computed_at stays null."
        test_recipe:
          setup:
            - "Railroads BN and CX exist; the clock reads 2026-09-01T00:00:00Z so the August period has ended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
          trigger:
            - call: "POST /car-hire/settlement-cycles"
              payload: { payer_road_id: "${bn_id}", payee_road_id: "${cx_id}", period_month: "2026-08" }
              as: CarHireAccountant
              as_user_id: "${cx_id}"
              captures: { cycle_id: "$.data.id" }
          assert:
            - "HTTP 201 and SettlementCycle.${cycle_id}.status == OPEN"
            - "SettlementCycle.${cycle_id}.period_start_at == 2026-08-01T00:00:00.000Z and period_end_at == 2026-09-01T00:00:00.000Z"
            - "SettlementCycle.${cycle_id} == (gross_hire_cents 0, reclaim_credit_cents 0, penalty_cents 0, repair_charge_cents 0, dispute_adjustment_cents 0, pre_fee_net_cents 0, clearinghouse_fee_cents 0, net_settlement_cents 0)"
            - "SettlementCycle.${cycle_id}.variant_applied == null, computed_at == null, exchanged_at == null, reopen_count == 0, movement_line_count == 0, version == 1"

      - name: cycle_compute_before_period_end_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SettlementCycle.OPEN_to_COMPUTED.preconditions
          - validations.priority_36_ERR_PERIOD_NOT_ENDED
        distinguishing_aspect: "The OPEN -> COMPUTED precondition `now >= period_end_at` is enforced at priority 36: computing the August cycle while the clock still reads 2026-08-31T23:59:59Z gives 422 ERR_PERIOD_NOT_ENDED and leaves the cycle OPEN; the same call one second later succeeds."
        test_recipe:
          setup:
            - "Railroads BN and CX; an OPEN August cycle (payer BN, payee CX) created while the clock reads 2026-08-31T23:59:59Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T23:59:59Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/settlement-cycles"
              payload: { payer_road_id: "${bn_id}", payee_road_id: "${cx_id}", period_month: "2026-08" }
              as: CarHireAccountant
              as_user_id: "${cx_id}"
              captures: { cycle_id: "$.data.id" }
          trigger:
            - call: "POST /car-hire/settlement-cycles/${cycle_id}/compute"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${cx_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/settlement-cycles/${cycle_id}/compute"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${cx_id}"
              captures: { after_status: "$.data.status" }
          assert:
            - "the first compute returns HTTP 422 with err == ERR_PERIOD_NOT_ENDED and SettlementCycle.${cycle_id}.status stays OPEN with version 1"
            - "the second compute returns HTTP 200 with after_status == COMPUTED and computed_at == 2026-09-01T00:00:00.000Z"
            - "the empty cycle computes to gross_hire_cents 0, pre_fee_net_cents 0, clearinghouse_fee_cents 0, net_settlement_cents 0 and movement_line_count 0"

      - name: settlement_exchange_stamps_dispute_deadline_at
        claim_type: Side Effect Execution
