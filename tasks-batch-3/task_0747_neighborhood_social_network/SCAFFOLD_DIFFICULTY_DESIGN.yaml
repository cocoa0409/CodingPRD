  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: civic_notice_half_open_overlap_rejects_strict_intersect_on_same_kind
        grounds:
          - validations[priority=130]
          - errors[ERR_NOTICE_WINDOW_OVERLAP]
          - entities.CivicNotice.fields.effective_from
          - entities.CivicNotice.fields.effective_until
        distinguishing_aspect: |
          Interval semantics 1: CivicNotice intervals are half-open
          [effective_from, effective_until); two ACTIVE/SCHEDULED notices
          overlapping by any strictly positive duration on the same
          (neighborhood_id, notice_kind) collide with ERR_NOTICE_WINDOW_OVERLAP.
          Adjacency (touching endpoints) does NOT collide. Resource entity
          is CivicNotice.
        test_recipe:
          setup:
            - "Neighborhood N1 exists."
            - "AgencyOfficer OFF1 has an ACTIVE POLICE CivicNotice cn1 spanning [2026-06-05T00:00:00Z, 2026-06-10T00:00:00Z)."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /neighborhood/neighborhoods"
              payload: { name: "N1", state_code: "CA", center_lat: 37.75, center_lng: -122.42, radius_meters: 2000 }
              as: PlatformAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /neighborhood/civic-notices"
              payload: { neighborhood_id: "${n1_id}", title: "Roadwork", body: "closed", notice_kind: "POLICE", effective_from: "2026-06-05T00:00:00Z", effective_until: "2026-06-10T00:00:00Z" }
              as: AgencyOfficer
              as_user_id: "OFF1"
              captures: { cn1_id: "$.data.id" }
          trigger:
            - call: "POST /neighborhood/civic-notices"
              payload: { neighborhood_id: "${n1_id}", title: "Bad", body: "b", notice_kind: "POLICE", effective_from: "2026-06-09T23:00:00Z", effective_until: "2026-06-11T00:00:00Z" }
              as: AgencyOfficer
              as_user_id: "OFF1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "Response HTTP status is 409"
            - "Response data.error_id == \"ERR_NOTICE_WINDOW_OVERLAP\""
            - "Overlap of 1 hour rejected on identical (neighborhood, POLICE) key"

      - name: event_group_aggregate_capacity_rejects_fourth_concurrent_event
        grounds:
          - validations[priority=131]
          - errors[ERR_GROUP_EVENT_CAPACITY]
          - entities.Event.fields.starts_at
          - entities.Event.fields.ends_at
        distinguishing_aspect: |
          Interval semantics 2: Event intervals per group are open-interval
          overlaps with an AGGREGATE CAPACITY = 3 concurrent events. Adjacency
          does NOT overlap. Resource entity is Event, structurally distinct
          from CivicNotice exclusion (which permits at most 1 overlapping on
          the key). Rejects the fourth concurrent event, not the second.
        test_recipe:
          setup:
            - "Neighborhood N1; Verified Resident R1; Group G1 by R1 in N1."
            - "Three SCHEDULED Events E1, E2, E3 on G1 all overlapping [2026-06-10T12:00:00Z, 2026-06-10T14:00:00Z)."
          setup_api_calls:
            - call: "POST /neighborhood/_clock/set_current_utc"
