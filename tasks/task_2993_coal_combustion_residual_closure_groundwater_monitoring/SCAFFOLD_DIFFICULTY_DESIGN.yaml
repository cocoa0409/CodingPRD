      - name: closure_plan_fork_join_and_return_to_draft_clears_both_branches
        grounds:
          - state_machines.ClosurePlan.DRAFT_to_ENGINEERING_CERTIFIED
          - state_machines.ClosurePlan.ENGINEERING_CERTIFIED_to_FULLY_CERTIFIED
          - state_machines.ClosurePlan.DRAFT_to_COST_CERTIFIED
          - state_machines.ClosurePlan.COST_CERTIFIED_to_FULLY_CERTIFIED
          - state_machines.ClosurePlan.FULLY_CERTIFIED_to_DRAFT
          - validations.priority_22_ERR_INVALID_PLAN_STATE
        distinguishing_aspect: |
          The plan is a fork-join diamond, not a chain: the two certification branches may be taken in
          either order, approval is refused from a half-certified state, and return-to-draft rewinds the
          join, clearing BOTH branch record sets and incrementing return_count. The same plan therefore
          passes through DRAFT twice and reaches FULLY_CERTIFIED by two different edges in one test.
        test_recipe:
          setup:
            - "One clean unit with an ADEQUATE stability assessment dated 2026-07-15 (so the unit is WATCH, never FROZEN, at the default clock)"
            - "Two engineers: a GEOTECHNICAL PE for the engineering branch and a CIVIL PE for the cost branch"
            - "One DRAFT closure plan whose cheap in-place cost profile makes recommended_method CLOSURE_IN_PLACE, matching selected_method so no justification is required"
            - "The engineering branch is already taken: plan status is ENGINEERING_CERTIFIED at trigger time"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
              as: UtilityAdmin
              captures: { pe_geo_id: $.data.id }
            - call: "POST /ccr/professionals"
