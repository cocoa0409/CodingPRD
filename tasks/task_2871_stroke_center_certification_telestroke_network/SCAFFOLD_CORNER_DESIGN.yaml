          cn_st2: $.data.status
          cn_n2: $.data.assigned_neurologist_id
          cn_at2: $.data.assigned_at
      - call: GET /stroke-network/neurologists/${n1_id}
        as: ProgramCoordinator
        captures:
          cn_n1: $.data.active_consult_count
          cn_state1: $.data.on_call_state
      - call: GET /stroke-network/spoke-agreements/${agr_id}
        payload: {}
        as: ProgramCoordinator
        as_user_id: pc_carl
        captures:
          cn_a1: $.data.active_consult_count
      - call: GET /stroke-network/code-strokes/${cn_id}
        as: EdPhysician
        captures:
          cn_v1: $.data.version
          cn_st1: $.data.status
      assert:
      - 'the 201 body ALREADY carries the routing result: ${cn_st} == ASSIGNED with ${cn_n} == ${n1_id} and ${cn_at} == 2026-09-01T08:10:00Z, never REQUESTED with a null assignment'
      - '${cn_at} == ${cn_req}: assignment and request happened in one write at one clock instant'
      - ${cn_att} == 1 in the create response itself
      - 'the immediate re-read agrees exactly: ${cn_st2} == ${cn_st}, ${cn_n2} == ${cn_n} and ${cn_at2} == ${cn_at}'
      - 'the neurologist''s load is already reconciled: ${cn_n1} == ${cn_n0} + 1 == 1, with ${cn_state1} == ON_CALL because assignment alone does not consume the roster state'
      - 'the agreement''s derived counter is already reconciled: ${cn_a1} == ${cn_a0} + 1 == 1'
      - 'the cascade onto the parent is visible with no delay: ${cn_st1} == CONSULT_IN_PROGRESS and ${cn_v1} == ${cn_v0} + 1'
  - name: a_cascade_created_deviation_is_discoverable_in_the_same_instant_as_the_write
