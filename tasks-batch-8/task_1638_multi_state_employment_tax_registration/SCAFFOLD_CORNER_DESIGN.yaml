          trigger:
            - { call: "GET /etax/registrations/${reg_or}", payload: {}, as: Auditor, captures: { acct: $.data.account_number, freq: $.data.filing_frequency, basis: $.data.frequency_basis, tier: $.data.deposit_tier, kind: $.data.registration_kind } }
          assert:
