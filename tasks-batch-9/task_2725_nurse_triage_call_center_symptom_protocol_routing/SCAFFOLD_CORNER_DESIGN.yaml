          - endpoints[POST /coverage-windows/{id}/activate]
        distinguishing_aspect: "Activation is not idempotent: the second activate on the same window answers ERR_COVERAGE_WINDOW_INVALID_STATE at 409 and must not bump the window's version a second time."
        test_recipe:
          setup:
            - "Clock at 2026-07-30T12:00:00Z; one practice with one DRAFT window in the future."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
