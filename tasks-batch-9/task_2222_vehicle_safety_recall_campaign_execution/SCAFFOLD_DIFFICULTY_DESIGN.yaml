      - name: quarterly_filing_low_effectiveness_revises_remedy_and_reverts_remedied_vehicles
        grounds:
          - calculations.remedy_effectiveness_score
          - state_machines.RecallCampaign.remedy_status.REMEDY_RELEASED_to_REMEDY_REVISED
          - state_machines.AffectedVehicle.REMEDIED_to_UNREPAIRED
          - entities.RegulatoryFiling.fields.amendment_required
          - entities.PartsAllocation.fields.revoked_reason
        distinguishing_aspect: |
          A different trigger (a QUARTERLY regulatory filing, not a claim reversal) drives a
          depth-3 chain: (1) the recomputed effectiveness score of 40.00 pushes remedy_status
          REMEDY_RELEASED -> REMEDY_REVISED, (2) caused by (1) every REMEDIED AffectedVehicle
          reverts to UNREPAIRED with requires_renotification true and every ALLOCATED allocation is
          revoked with revoked_reason REMEDY_REVISED, (3) caused by (2) completion_rate_pct falls to
          0.00 and the filing just created is stamped amendment_required true.
