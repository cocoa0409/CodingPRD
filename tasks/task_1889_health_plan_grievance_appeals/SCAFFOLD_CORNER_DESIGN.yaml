            - call: "POST /appeals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /appeals/cases"
              payload: { member_id: "${m_va2}", case_kind: "GRIEVANCE", expedited_requested: true, expedited_justification: "urgent" }
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_EXPEDITED_NOT_ALLOWED"

