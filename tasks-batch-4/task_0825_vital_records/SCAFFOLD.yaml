scenario: "Vital Records Registration (state registrar): birth/death/fetal-death registration, hospital/funeral-home EDR filing, cause-of-death medical certification, amendment/correction & paternity acknowledgment, certified-copy eligibility & ID, delayed/foreign registration, apostille/exemplified copy, statistics reporting"
domain_name: "vital-records-registration"
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities (VitalEvent, MedicalCertification, Amendment, PaternityAcknowledgment,
  # CertifiedCopyRequest, ApostilleRequest, DelayedRegistrationPacket, StatisticsReport)
  # linked by explicit foreign-key fields; no nesting in URL paths — all collections
  # are top-level and cross-reference via *_id fields.

  state_machine_shape: branching
  # Multiple entities carry fork-join / revision-loop machines: Amendment
  # (SUBMITTED -> {APPROVED, REJECTED}, REJECTED -> SUBMITTED cycle), VitalEvent
  # (FILED -> {REGISTERED, RETURNED}, RETURNED -> DRAFT cycle), CertifiedCopyRequest
  # (SUBMITTED -> ID_VERIFIED -> {ISSUED, DENIED}), PaternityAcknowledgment
  # (ACKNOWLEDGED -> {RESCINDED, FINALIZED}).

  relationship_patterns:
    - one_to_many          # VitalEvent has many CertifiedCopyRequests, Amendments, Certifications
    - cross_aggregate      # ApostilleRequest -> CertifiedCopyRequest -> VitalEvent; Amendment -> MedicalCertification
    - polymorphic          # Amendment.target_certification_id present only for MEDICAL amendments

  role_model: segregation_of_duties
  # Filing (FacilityFiler), certifying (MedicalCertifier), and registering
  # (StateRegistrar) are separated duties: no single role performs two of
  # {file an EDR, certify cause-of-death, register a record}. Applicants are the
  # public copy-requesting surface.

  consistency_model: immediate
  # All cascades (registration lock chain, amendment-to-certification-to-event,
  # void compensation, fee ledger) complete atomically within the triggering request.

# ===========================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# ===========================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the hospital, funeral home, or birthing center"
      - name: facility_type
        type: enum
        source: input
        description: "Kind of filing facility"
        constraints: "one of HOSPITAL, FUNERAL_HOME, BIRTHING_CENTER"
      - name: jurisdiction_code
        type: string
        source: input
        description: "Registration jurisdiction (e.g., county code) this facility files under"
      - name: npi
        type: string
        source: input
        description: "National provider / facility identifier"
      - name: active
        type: boolean
        source: input
        description: "Whether the facility may currently file EDRs"
        default: true
      - name: registered_count
        type: integer
        source: computed
        description: "Conserved count of VitalEvents with facility_id == this.id and status IN {REGISTERED, AMENDED}; incremented on register, decremented on void"
        default: 0

  - name: Certifier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Name of the medical certifier"
      - name: certifier_type
        type: enum
        source: input
        description: "Certifier authority type"
        constraints: "one of PHYSICIAN, MEDICAL_EXAMINER, CORONER"
      - name: license_number
        type: string
        source: input
        description: "Medical/legal license number authorizing certification"
      - name: jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction the certifier is authorized in"
      - name: active
        type: boolean
        source: input
        description: "Whether the certifier may currently certify"
        default: true
      - name: locked_certification_count
        type: integer
        source: computed
        description: "Count of this certifier's MedicalCertifications that reached LOCKED via cascade from event registration; incremented when a linked certification locks"
        default: 0

  - name: VitalEvent
    parent: null
    common_fields: true
    fields:
      - name: event_type
        type: enum
        source: input
        description: "Kind of vital event"
        constraints: "one of BIRTH, DEATH, FETAL_DEATH"
      - name: event_date
        type: datetime
        source: input
        description: "Date the birth/death/fetal-death occurred (ISO 8601 UTC)"
      - name: subject_last_name
        type: string
        source: input
        description: "Last name of the registrant (newborn) or decedent"
      - name: subject_first_name
        type: string
        source: input
        description: "First name of the registrant or decedent"
      - name: sex
        type: enum
        source: input
        description: "Recorded sex"
        constraints: "one of MALE, FEMALE, UNDETERMINED"
      - name: jurisdiction_code
        type: string
        source: input
        description: "Registration jurisdiction for this event"
      - name: facility_id
        type: string
        source: input
        description: "FK -> Facility.id; the hospital/funeral home/birthing center that files the EDR"
      - name: place_of_event
        type: string
        source: input
        description: "Free-text place where the event occurred"
      - name: foreign_born
        type: boolean
        source: input
        description: "True when the event occurred outside the registering state's territory (drives FOREIGN registration path)"
        default: false
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: DRAFT
        constraints: "one of DRAFT, FILED, RETURNED, REGISTERED, AMENDED, VOIDED"
      - name: registration_type
        type: enum
        source: computed
        description: "Classification pinned at file time from event-to-file lateness and foreign_born"
        constraints: "one of TIMELY, DELAYED, FOREIGN; null until filed"
      - name: days_late
        type: integer
        source: computed
        description: "Full days between event_date and filed_at (floor of second-difference / 86400); pinned at file time"
        default: 0
      - name: delayed_fee_cents
        type: integer
        source: computed
        description: "Late-registration surcharge pinned at file time by the registration_delay_fee calculation; 0 when TIMELY"
        default: 0
      - name: certification_required
        type: boolean
        source: computed
        description: "True iff event_type IN {DEATH, FETAL_DEATH}; a CERTIFIED MedicalCertification is then a precondition to REGISTER"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical clock instant the FacilityFiler filed the EDR (set on DRAFT->FILED); null before"
      - name: registered_at
        type: datetime
        source: system
        description: "Logical clock instant of registration (set on ->REGISTERED); null before; anchors the 1-year amendment-evidence threshold"
      - name: state_file_number
        type: string
        source: system
        description: "State file number minted at registration; format '{year_of_registered_at}-{event_type}-{seq:06d}' where seq is 1 + count of prior REGISTERED/AMENDED events sharing jurisdiction_code and event_type, ordered registered_at ASC then created_at ASC"
      - name: paternity_established
        type: boolean
        source: computed
        description: "True once a PaternityAcknowledgment for this BIRTH event is ACKNOWLEDGED or FINALIZED; cleared to false on RESCINDED"
        default: false
      - name: father_last_name
        type: string
        source: computed
        description: "Set from an ACKNOWLEDGED PaternityAcknowledgment; cleared on rescission; null otherwise"
      - name: father_first_name
        type: string
        source: computed
        description: "Set from an ACKNOWLEDGED PaternityAcknowledgment; cleared on rescission; null otherwise"
      - name: cause_of_death_amended
        type: boolean
        source: computed
        description: "Set true when a MEDICAL Amendment cascades into the linked MedicalCertification"
        default: false
      - name: amendment_count
        type: integer
        source: computed
        description: "Number of APPROVED amendments applied to this event (any amendment_type)"
        default: 0
      - name: copies_issued_count
        type: integer
        source: computed
        description: "Conserved count of CertifiedCopyRequests for this event with status == ISSUED"
        default: 0
      - name: fees_collected_cents
        type: integer
        source: computed
        description: "Conserved sum of fee_total_cents over CertifiedCopyRequests for this event with status == ISSUED; increased on issue, reversed on void of an issued copy"
        default: 0

  - name: MedicalCertification
    parent: VitalEvent
    common_fields: true
    fields:
      - name: vital_event_id
        type: string
        source: input
        description: "FK -> VitalEvent.id; the DEATH/FETAL_DEATH event being certified"
      - name: certifier_id
        type: string
        source: input
        description: "FK -> Certifier.id; the medical certifier signing cause of death"
      - name: cause_of_death
        type: string
        source: input
        description: "Immediate cause of death narrative"
      - name: manner_of_death
        type: enum
        source: input
        description: "Manner classification"
        constraints: "one of NATURAL, ACCIDENT, SUICIDE, HOMICIDE, PENDING_INVESTIGATION, UNDETERMINED"
      - name: status
        type: enum
        source: system
        description: "Certification lifecycle state"
        default: PENDING
        constraints: "one of PENDING, CERTIFIED, LOCKED, AMENDED"
      - name: certified_at
        type: datetime
        source: system
        description: "Logical clock instant the certifier signed (set on PENDING->CERTIFIED); null before"
      - name: amendment_count
        type: integer
        source: computed
        description: "Number of MEDICAL amendments cascaded into this certification"
        default: 0

  - name: Amendment
    parent: VitalEvent
    common_fields: true
    fields:
      - name: vital_event_id
        type: string
        source: input
        description: "FK -> VitalEvent.id; the record being corrected"
      - name: amendment_type
        type: enum
        source: input
        description: "Whether the correction targets demographic record fields or the cause-of-death certification"
        constraints: "one of DEMOGRAPHIC, MEDICAL"
      - name: target_certification_id
        type: string
        source: input
        description: "FK -> MedicalCertification.id; required when amendment_type == MEDICAL, must be null/omitted when DEMOGRAPHIC"
      - name: field_name
        type: string
        source: input
        description: "Name of the record field to correct (e.g., subject_last_name, cause_of_death)"
      - name: new_value
        type: string
        source: input
        description: "Corrected value to write on approval"
      - name: reason
        type: string
        source: input
        description: "Justification for the correction"
      - name: evidence_required
        type: boolean
        source: computed
        description: "Pinned at submit: true iff clock now > VitalEvent.registered_at + 1 year (365 days) — post-first-year corrections require documentary evidence"
        default: false
      - name: status
        type: enum
        source: system
        description: "Amendment lifecycle state"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, APPROVED, REJECTED"

  - name: PaternityAcknowledgment
    parent: VitalEvent
    common_fields: true
    fields:
      - name: vital_event_id
        type: string
        source: input
        description: "FK -> VitalEvent.id; must reference a BIRTH event"
      - name: father_last_name
        type: string
        source: input
        description: "Acknowledging father's last name"
      - name: father_first_name
        type: string
        source: input
        description: "Acknowledging father's first name"
      - name: mother_consent
        type: boolean
        source: input
        description: "Whether the mother has consented to the acknowledgment (required true to acknowledge)"
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the actor who created the acknowledgment (audit only; opaque)"
      - name: status
        type: enum
        source: system
        description: "Acknowledgment lifecycle state"
        default: DRAFT
        constraints: "one of DRAFT, ACKNOWLEDGED, RESCINDED, FINALIZED"
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical clock instant of acknowledgment (set on DRAFT->ACKNOWLEDGED); null before"
      - name: rescission_deadline
        type: datetime
        source: computed
        description: "acknowledged_at + 60 days; rescission allowed only while clock now <= this instant"

  - name: CertifiedCopyRequest
    parent: VitalEvent
    common_fields: true
    fields:
      - name: vital_event_id
        type: string
        source: input
        description: "FK -> VitalEvent.id; the record a copy is requested from"
      - name: requester_name
        type: string
        source: input
        description: "Name of the person requesting the copy"
      - name: requester_relationship
        type: enum
        source: input
        description: "Requester's relationship to the record subject"
        constraints: "one of SELF, PARENT, CHILD, SPOUSE, SIBLING, LEGAL_GUARDIAN, LEGAL_REPRESENTATIVE, OTHER, GENEALOGIST"
      - name: requester_category
        type: enum
        source: input
        description: "Fee category"
        default: STANDARD
        constraints: "one of STANDARD, VETERAN, INDIGENT"
      - name: id_document_type
        type: enum
        source: input
        description: "Government ID presented for identity verification"
        constraints: "one of DRIVERS_LICENSE, PASSPORT, STATE_ID, MILITARY_ID"
      - name: copy_count
        type: integer
        source: input
        description: "Number of copies requested; must be >= 1"
      - name: expedite
        type: boolean
        source: input
        description: "Whether expedited processing surcharge applies"
        default: false
      - name: id_verified
        type: boolean
        source: system
        description: "Set true by verify-id; precondition to issue"
        default: false
      - name: copy_class
        type: enum
        source: computed
        description: "Pinned at issue by copy_eligibility: CERTIFIED for confidential records to eligible parties, INFORMATIONAL for public (aged-out) records"
        constraints: "one of CERTIFIED, INFORMATIONAL; null until issued"
      - name: fee_total_cents
        type: integer
        source: computed
        description: "Pinned at issue by the certified_copy_fee calculation"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Copy request lifecycle state"
        default: SUBMITTED
        constraints: "one of SUBMITTED, ID_VERIFIED, ISSUED, DENIED"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical clock instant the copy was issued (set on ->ISSUED); null before"

  - name: ApostilleRequest
    parent: null
    common_fields: true
    fields:
      - name: certified_copy_request_id
        type: string
        source: input
        description: "FK -> CertifiedCopyRequest.id; the issued certified copy to authenticate for international use"
      - name: destination_country
        type: string
        source: input
        description: "Country the authenticated copy will be used in"
      - name: apostille_type
        type: enum
        source: input
        description: "APOSTILLE for Hague-convention countries, EXEMPLIFIED for non-convention chain authentication"
        constraints: "one of APOSTILLE, EXEMPLIFIED"
      - name: status
        type: enum
        source: system
        description: "Authentication lifecycle state"
        default: SUBMITTED
        constraints: "one of SUBMITTED, AUTHENTICATED, REJECTED"
      - name: authenticated_at
        type: datetime
        source: system
        description: "Logical clock instant of authentication (set on ->AUTHENTICATED); null before"

  - name: DelayedRegistrationPacket
    parent: VitalEvent
    common_fields: true
    fields:
      - name: vital_event_id
        type: string
        source: input
        description: "FK -> VitalEvent.id; the event whose delayed/foreign registration this packet supports"
      - name: packet_type
        type: enum
        source: input
        description: "DELAYED for late in-state events, FOREIGN for events occurring outside the state"
        constraints: "one of DELAYED, FOREIGN"
      - name: documentary_evidence_count
        type: integer
        source: input
        description: "Number of documentary evidence items attached; must be >= 1"
      - name: hearing_start
        type: datetime
        source: input
        description: "Start instant of the reserved registrar hearing slot (ISO 8601 UTC)"
      - name: hearing_end
        type: datetime
        source: input
        description: "End instant of the reserved registrar hearing slot; must be strictly after hearing_start"
      - name: hearing_jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction whose hearing calendar the slot is booked on (overlap is checked within this code)"
      - name: status
        type: enum
        source: system
        description: "Packet lifecycle state"
        default: SUBMITTED
        constraints: "one of SUBMITTED, ACCEPTED, RETURNED"
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical clock instant the packet was accepted (set on ->ACCEPTED); null before"

  - name: StatisticsReport
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction the report aggregates"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the reporting window (ISO 8601 UTC)"
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the reporting window; events counted have period_start <= event_date < period_end"
      - name: birth_count
        type: integer
        source: computed
        description: "Count of REGISTERED/AMENDED BIRTH events in jurisdiction with event_date in [period_start, period_end)"
        default: 0
      - name: death_count
        type: integer
        source: computed
        description: "Count of REGISTERED/AMENDED DEATH events in jurisdiction with event_date in [period_start, period_end)"
        default: 0
      - name: fetal_death_count
        type: integer
        source: computed
        description: "Count of REGISTERED/AMENDED FETAL_DEATH events in jurisdiction with event_date in [period_start, period_end)"
        default: 0
      - name: total_fees_collected_cents
        type: integer
        source: computed
        description: "Sum of fee_total_cents over CertifiedCopyRequests with status == ISSUED whose issued_at is in [period_start, period_end) and whose event is in this jurisdiction"
        default: 0
      - name: state_remittance_cents
        type: integer
        source: computed
        description: "State's share computed by the state_remittance calculation: per-transaction round_half_up(fee_total_cents * 0.45) summed across the same ISSUED copies"
        default: 0

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: VitalEvent
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /vital-events/{id}/file"
        actor: FacilityFiler
        preconditions:
          - "acting FacilityFiler owns the event: X-User-ID == VitalEvent.facility_id"
          - "VitalEvent.status == DRAFT"
        side_effects:
          - "set filed_at = clock now"
          - "compute days_late = floor((filed_at - event_date) / 86400 seconds)"
          - "set registration_type per registration_delay_fee.variants (FOREIGN if foreign_born; else DELAYED if days_late > statutory window for event_type; else TIMELY)"
          - "compute and set delayed_fee_cents via registration_delay_fee"
      - from: FILED
        to: REGISTERED
        trigger: "POST /vital-events/{id}/register"
        actor: StateRegistrar
        preconditions:
          - "VitalEvent.status == FILED"
          - "if certification_required: the event's MedicalCertification.status == CERTIFIED (else ERR_CERTIFICATION_REQUIRED)"
          - "if registration_type IN {DELAYED, FOREIGN}: a DelayedRegistrationPacket for this event has status == ACCEPTED (else ERR_DELAYED_REGISTRATION_REQUIRED)"
        side_effects:
          - "set registered_at = clock now"
          - "mint state_file_number = '{year(registered_at)}-{event_type}-{seq:06d}', seq = 1 + count of prior REGISTERED/AMENDED events with same jurisdiction_code and event_type ordered registered_at ASC, created_at ASC"
          - "set status = REGISTERED"
          - "increment Facility(registered_count) for facility_id by 1  [cascade link 1]"
          - "if certification_required: linked MedicalCertification CERTIFIED->LOCKED  [cascade link 2, caused by this registration]"
          - "when that certification locks: increment its Certifier.locked_certification_count by 1  [cascade link 3, caused by the lock]"
          - "increment version by 1"
      - from: FILED
        to: RETURNED
        trigger: "POST /vital-events/{id}/return"
        actor: StateRegistrar
        preconditions:
          - "VitalEvent.status == FILED"
        side_effects:
          - "set status = RETURNED"
        note: "Registrar kicks an EDR back to the facility for correction."
      - from: RETURNED
        to: DRAFT
        trigger: "POST /vital-events/{id}/file is preceded by re-drafting; RETURNED->DRAFT occurs automatically as the first step of re-filing a returned event"
        actor: FacilityFiler
        preconditions:
          - "VitalEvent.status == RETURNED"
          - "X-User-ID == VitalEvent.facility_id"
        side_effects:
          - "set status = DRAFT"
        note: "Cyclic revision loop: a RETURNED event is re-opened to DRAFT so the facility can refile."
      - from: REGISTERED
        to: AMENDED
        trigger: "system: cascade from POST /amendments/{id}/approve"
        actor: system
        preconditions:
          - "VitalEvent.status IN {REGISTERED, AMENDED}"
        side_effects:
          - "apply DEMOGRAPHIC change (field_name := new_value) or set cause_of_death_amended for MEDICAL amendments"
          - "increment amendment_count by 1"
          - "set status = AMENDED"
          - "increment version by 1"
      - from: REGISTERED
        to: VOIDED
        trigger: "POST /vital-events/{id}/void"
        actor: StateRegistrar
        preconditions:
          - "VitalEvent.status IN {REGISTERED, AMENDED}"
        side_effects:
          - "set status = VOIDED"
          - "decrement Facility(registered_count) for facility_id by 1  [compensates registration]"
          - "for each CertifiedCopyRequest of this event with status == ISSUED: reverse it — decrement VitalEvent.copies_issued_count by 1 and decrement fees_collected_cents by that copy's fee_total_cents  [compensation]"
          - "increment version by 1"
      - from: AMENDED
        to: VOIDED
        trigger: "POST /vital-events/{id}/void"
        actor: StateRegistrar
        preconditions:
          - "VitalEvent.status IN {REGISTERED, AMENDED}"
        side_effects:
          - "same compensation as REGISTERED->VOIDED"
          - "increment version by 1"

  - entity: MedicalCertification
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /certifications/{id}/certify"
        actor: MedicalCertifier
        preconditions:
          - "acting MedicalCertifier owns it: X-User-ID == MedicalCertification.certifier_id"
          - "MedicalCertification.status == PENDING"
        side_effects:
          - "set certified_at = clock now"
          - "set status = CERTIFIED"
      - from: CERTIFIED
        to: LOCKED
        trigger: "system: cascade from POST /vital-events/{id}/register"
        actor: system
        preconditions:
          - "linked VitalEvent transitions to REGISTERED"
        side_effects:
          - "set status = LOCKED"
          - "increment Certifier.locked_certification_count by 1"
        note: "Cascade link 2->3: registration locks the certification, which bumps the certifier's locked counter."
      - from: LOCKED
        to: AMENDED
        trigger: "system: cascade from POST /amendments/{id}/approve for a MEDICAL amendment"
        actor: system
        preconditions:
          - "MedicalCertification.status == LOCKED"
          - "Amendment.amendment_type == MEDICAL and Amendment.target_certification_id == this.id"
        side_effects:
          - "apply cause_of_death := Amendment.new_value"
          - "increment amendment_count by 1"
          - "set status = AMENDED"
          - "cascade: set parent VitalEvent.cause_of_death_amended = true, bump its updated_at  [cascade link 2, caused by this certification amendment]"
      - from: AMENDED
        to: AMENDED
        trigger: "system: cascade from a further MEDICAL amendment approval"
        actor: system
        preconditions:
          - "MedicalCertification.status == AMENDED"
        side_effects:
          - "apply cause_of_death := Amendment.new_value; increment amendment_count by 1"

  - entity: Amendment
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /amendments/{id}/submit"
        actor: StateRegistrar
        preconditions:
          - "Amendment.status == DRAFT"
          - "target VitalEvent.status IN {REGISTERED, AMENDED} (else ERR_EVENT_NOT_REGISTERED)"
        side_effects:
          - "compute evidence_required = (clock now > VitalEvent.registered_at + 365 days)"
          - "set status = SUBMITTED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /amendments/{id}/approve"
        actor: StateRegistrar
        preconditions:
          - "Amendment.status == SUBMITTED"
          - "target VitalEvent.status IN {REGISTERED, AMENDED} (else ERR_EVENT_NOT_REGISTERED)"
          - "expected_vital_event_version matches VitalEvent.version (else ERR_STALE_EVENT_VERSION)"
        side_effects:
          - "set status = APPROVED"
          - "cascade: if DEMOGRAPHIC -> VitalEvent field_name := new_value, amendment_count++, status->AMENDED, version++  [chain A: amendment->event]"
          - "cascade: if MEDICAL -> target MedicalCertification (LOCKED->AMENDED, cause_of_death := new_value, amendment_count++) which itself sets VitalEvent.cause_of_death_amended = true and event.amendment_count++ and event.version++  [chain B: amendment->certification->event]"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /amendments/{id}/reject"
        actor: StateRegistrar
        preconditions:
          - "Amendment.status == SUBMITTED"
        side_effects:
          - "set status = REJECTED"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /amendments/{id}/submit"
        actor: StateRegistrar
        preconditions:
          - "Amendment.status == REJECTED"
          - "target VitalEvent.status IN {REGISTERED, AMENDED}"
        side_effects:
          - "recompute evidence_required; set status = SUBMITTED"
        note: "Revision loop: a rejected amendment can be re-submitted."

  - entity: PaternityAcknowledgment
    initial_state: DRAFT
    terminal_states: [RESCINDED, FINALIZED]
    transitions:
      - from: DRAFT
        to: ACKNOWLEDGED
        trigger: "POST /paternity-acknowledgments/{id}/acknowledge"
        actor: StateRegistrar
        preconditions:
          - "PaternityAcknowledgment.status == DRAFT"
          - "referenced VitalEvent.event_type == BIRTH (else ERR_NOT_BIRTH_EVENT)"
          - "referenced VitalEvent.status IN {REGISTERED, AMENDED} (else ERR_EVENT_NOT_REGISTERED)"
          - "mother_consent == true"
        side_effects:
          - "set acknowledged_at = clock now; set rescission_deadline = acknowledged_at + 60 days"
          - "set status = ACKNOWLEDGED"
          - "cascade: BIRTH VitalEvent.father_last_name := father_last_name, father_first_name := father_first_name, paternity_established := true, event.version++"
      - from: ACKNOWLEDGED
        to: RESCINDED
        trigger: "POST /paternity-acknowledgments/{id}/rescind"
        actor: StateRegistrar
        preconditions:
          - "PaternityAcknowledgment.status == ACKNOWLEDGED"
          - "clock now <= rescission_deadline (else ERR_RESCISSION_WINDOW_CLOSED)"
        side_effects:
          - "set status = RESCINDED"
          - "cascade: BIRTH VitalEvent.father_last_name := null, father_first_name := null, paternity_established := false, event.version++"
      - from: ACKNOWLEDGED
        to: FINALIZED
        trigger: "POST /paternity-acknowledgments/{id}/finalize"
        actor: StateRegistrar
        preconditions:
          - "PaternityAcknowledgment.status == ACKNOWLEDGED"
          - "clock now > rescission_deadline (else ERR_RESCISSION_WINDOW_OPEN)"
        side_effects:
          - "set status = FINALIZED"

  - entity: CertifiedCopyRequest
    initial_state: SUBMITTED
    terminal_states: [ISSUED, DENIED]
    transitions:
      - from: SUBMITTED
        to: ID_VERIFIED
        trigger: "POST /certified-copy-requests/{id}/verify-id"
        actor: StateRegistrar
        preconditions:
          - "CertifiedCopyRequest.status == SUBMITTED"
        side_effects:
          - "set id_verified = true; set status = ID_VERIFIED"
      - from: ID_VERIFIED
        to: ISSUED
        trigger: "POST /certified-copy-requests/{id}/issue"
        actor: StateRegistrar
        preconditions:
          - "CertifiedCopyRequest.status == ID_VERIFIED (else ERR_ID_NOT_VERIFIED if still SUBMITTED)"
          - "referenced VitalEvent.status IN {REGISTERED, AMENDED} (else ERR_EVENT_NOT_REGISTERED)"
          - "copy_eligibility resolves to CERTIFIED or INFORMATIONAL (else ERR_NOT_ELIGIBLE for confidential record + ineligible requester)"
          - "expected_vital_event_version matches VitalEvent.version (else ERR_STALE_EVENT_VERSION)"
        side_effects:
          - "set copy_class per copy_eligibility"
          - "compute and set fee_total_cents via certified_copy_fee"
          - "set issued_at = clock now; set status = ISSUED"
          - "increment VitalEvent.copies_issued_count by 1 and VitalEvent.fees_collected_cents by fee_total_cents; event.version++"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /certified-copy-requests/{id}/deny"
        actor: StateRegistrar
        preconditions:
          - "CertifiedCopyRequest.status IN {SUBMITTED, ID_VERIFIED}"
        side_effects:
          - "set status = DENIED"
      - from: ID_VERIFIED
        to: DENIED
        trigger: "POST /certified-copy-requests/{id}/deny"
        actor: StateRegistrar
        preconditions:
          - "CertifiedCopyRequest.status IN {SUBMITTED, ID_VERIFIED}"
        side_effects:
          - "set status = DENIED"

  - entity: ApostilleRequest
    initial_state: SUBMITTED
    terminal_states: [AUTHENTICATED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: AUTHENTICATED
        trigger: "POST /apostille-requests/{id}/authenticate"
        actor: StateRegistrar
        preconditions:
          - "ApostilleRequest.status == SUBMITTED"
          - "referenced CertifiedCopyRequest.status == ISSUED (else ERR_COPY_NOT_ISSUED)"
        side_effects:
          - "set authenticated_at = clock now; set status = AUTHENTICATED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /apostille-requests/{id}/reject"
        actor: StateRegistrar
        preconditions:
          - "ApostilleRequest.status == SUBMITTED"
        side_effects:
          - "set status = REJECTED"

  - entity: DelayedRegistrationPacket
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /delayed-registration-packets/{id}/accept"
        actor: StateRegistrar
        preconditions:
          - "DelayedRegistrationPacket.status == SUBMITTED"
          - "no other DelayedRegistrationPacket with same hearing_jurisdiction_code and status IN {SUBMITTED, ACCEPTED} has a hearing interval overlapping [hearing_start, hearing_end] inclusive within a 15-minute buffer (else ERR_HEARING_SLOT_CONFLICT)"
        side_effects:
          - "set accepted_at = clock now; set status = ACCEPTED"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /delayed-registration-packets/{id}/return"
        actor: StateRegistrar
        preconditions:
          - "DelayedRegistrationPacket.status == SUBMITTED"
        side_effects:
          - "set status = RETURNED"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /delayed-registration-packets/{id}/resubmit is folded into re-accept; RETURNED->SUBMITTED via POST /delayed-registration-packets/{id}/accept re-opening"
        actor: StateRegistrar
        preconditions:
          - "DelayedRegistrationPacket.status == RETURNED"
        side_effects:
          - "set status = SUBMITTED"
        note: "Cyclic: a returned packet is re-opened to SUBMITTED for another review."

# ===========================================================================
# §1.2.1 Concurrency Rules (OCC on VitalEvent.version)
# ===========================================================================
concurrency_rules:
  - rule_id: amend-approve-stale-event
    parent_entity: VitalEvent
    write_endpoint: "POST /amendments/{id}/approve"
    occ_field: "expected_vital_event_version"
    description: |
      Approving an Amendment writes corrected data onto the VitalEvent based on
      the record the registrar last observed. If the VitalEvent.version has
      advanced since — because another amendment was approved (legitimately
      superseding the prior record state) or a copy was issued — the current
      approval carries a stale expected_vital_event_version and is rejected.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
  - rule_id: copy-issue-stale-event
    parent_entity: VitalEvent
    write_endpoint: "POST /certified-copy-requests/{id}/issue"
    occ_field: "expected_vital_event_version"
    description: |
      A certified copy must reflect the current record. Issuing against a
      VitalEvent whose version has advanced since the requester last observed it
      (an intervening amendment approval or copy issuance changed the record) is
      rejected as stale, so no copy is minted from an out-of-date view.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: registration_delay_fee
    trigger: "POST /vital-events/{id}/file (DRAFT->FILED side effect)"
    algorithm: threshold
    formula: |
      window = STATUTORY_WINDOW_DAYS[event_type]   # BIRTH:10, DEATH:5, FETAL_DEATH:5
      days_late = floor((filed_at - event_date) / 86400 seconds)
      if foreign_born:
          registration_type = FOREIGN
      elif days_late > window:
          registration_type = DELAYED
      else:
          registration_type = TIMELY
      # variant selection:
      if registration_type == TIMELY:
          delayed_fee_cents = 0
      else:   # DELAYED or FOREIGN
          overage = max(0, days_late - window)
          delayed_fee_cents = DELAYED_BASE_FEE_CENTS + min(MAX_SURCHARGE_CENTS, PER_DAY_SURCHARGE_CENTS * overage)
    input_set: "single VitalEvent at file time; event_date and filed_at only"
    constants:
      STATUTORY_WINDOW_DAYS_BIRTH: 10
      STATUTORY_WINDOW_DAYS_DEATH: 5
      STATUTORY_WINDOW_DAYS_FETAL_DEATH: 5
      DELAYED_BASE_FEE_CENTS: 2000
      PER_DAY_SURCHARGE_CENTS: 100
      MAX_SURCHARGE_CENTS: 5000
    precision: "integer cents, no rounding needed"
    variants:
      - name: timely
        when: "days_late <= window and not foreign_born"
        difference: "delayed_fee_cents = 0; registration_type = TIMELY; no packet required to register"
      - name: delayed_or_foreign
        when: "foreign_born, or days_late > window"
        difference: "delayed_fee_cents = base + capped per-day surcharge; registration requires an ACCEPTED DelayedRegistrationPacket"

  - name: certified_copy_fee
    trigger: "POST /certified-copy-requests/{id}/issue (ID_VERIFIED->ISSUED side effect)"
    algorithm: tiered_pricing
    formula: |
      # evaluation order pinned: (1) certified base, (2) expedite, (3) category adjustment
      if copy_class == CERTIFIED:
          base = SEARCH_FEE_CENTS + ADDITIONAL_COPY_CENTS * (copy_count - 1)
          gross = base + (EXPEDITE_SURCHARGE_CENTS if expedite else 0)
          if requester_category == VETERAN:
              fee_total_cents = 0
          elif requester_category == INDIGENT:
              fee_total_cents = round_half_up(gross * 0.5)   # cents, half up
          else:  # STANDARD
              fee_total_cents = gross
      else:  # INFORMATIONAL (public / genealogy)
          gross = INFORMATIONAL_COPY_CENTS * copy_count + (EXPEDITE_SURCHARGE_CENTS if expedite else 0)
          # informational copies get no category waiver
          fee_total_cents = gross
    input_set: "single CertifiedCopyRequest at issue; copy_class from copy_eligibility"
    constants:
      SEARCH_FEE_CENTS: 1500
      ADDITIONAL_COPY_CENTS: 800
      EXPEDITE_SURCHARGE_CENTS: 1900
      INFORMATIONAL_COPY_CENTS: 1000
    precision: "2 decimal (cents) round_half_up on the INDIGENT halving; all other arithmetic exact in cents"
    variants:
      - name: certified
        when: "copy_eligibility == CERTIFIED (confidential record, eligible requester)"
        difference: "search fee + tiered additional-copy fee + expedite; VETERAN waives to 0, INDIGENT halves (round_half_up)"
      - name: informational
        when: "copy_eligibility == INFORMATIONAL (record aged past public threshold)"
        difference: "flat per-copy informational fee + expedite; no search fee, no category waiver — different total for identical copy_count/expedite"

  - name: copy_eligibility
    trigger: "POST /certified-copy-requests/{id}/issue (determines copy_class and gate)"
    algorithm: threshold
    formula: |
      age_years = floor((clock_now - VitalEvent.event_date) / 365 days)
      public_threshold = PUBLIC_THRESHOLD_YEARS[event_type]   # BIRTH:75, DEATH:25, FETAL_DEATH:25
      if age_years >= public_threshold:
          copy_class = INFORMATIONAL          # public record, any requester
      else:
          if requester_relationship in ELIGIBLE_RELATIONSHIPS:
              copy_class = CERTIFIED
          else:
              REJECT with ERR_NOT_ELIGIBLE     # confidential record, ineligible requester
    input_set: "single CertifiedCopyRequest + its VitalEvent; clock now"
    constants:
      PUBLIC_THRESHOLD_YEARS_BIRTH: 75
      PUBLIC_THRESHOLD_YEARS_DEATH: 25
      PUBLIC_THRESHOLD_YEARS_FETAL_DEATH: 25
      ELIGIBLE_RELATIONSHIPS: "SELF, PARENT, CHILD, SPOUSE, SIBLING, LEGAL_GUARDIAN, LEGAL_REPRESENTATIVE"
    precision: "integer years, floor; boundary >= public_threshold is public (INFORMATIONAL)"

  - name: statistics_counts
    trigger: "POST /statistics-reports (report creation)"
    algorithm: aggregation
    formula: |
      pool = { VitalEvent e : e.jurisdiction_code == report.jurisdiction_code
               AND e.status in {REGISTERED, AMENDED}
               AND period_start <= e.event_date < period_end }   # half-open
      birth_count       = count(e in pool where e.event_type == BIRTH)
      death_count       = count(e in pool where e.event_type == DEATH)
      fetal_death_count = count(e in pool where e.event_type == FETAL_DEATH)
    input_set: "REGISTERED/AMENDED VitalEvents in the report's jurisdiction whose event_date is in [period_start, period_end)"
    constants: {}
    precision: "integer counts; order-independent"

  - name: state_remittance
    trigger: "POST /statistics-reports (report creation)"
    algorithm: aggregation
    formula: |
      copies = { CertifiedCopyRequest c : c.status == ISSUED
                 AND c.VitalEvent.jurisdiction_code == report.jurisdiction_code
                 AND period_start <= c.issued_at < period_end }   # half-open, ordered created_at ASC
      total_fees_collected_cents = sum(c.fee_total_cents for c in copies)
      # ROUNDING ORDER PINNED: round per transaction, THEN sum (not sum-then-round)
      state_remittance_cents = sum( round_half_up(c.fee_total_cents * STATE_SHARE_PCT) for c in copies )
    input_set: "ISSUED CertifiedCopyRequests in the report's jurisdiction whose issued_at is in [period_start, period_end)"
    constants:
      STATE_SHARE_PCT: 0.45
    precision: "cents; round_half_up applied PER transaction before summation — summing raw then rounding is a different (wrong) result"

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number checked first)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "entity_backed actor owns the target resource (FacilityFiler: X-User-ID == VitalEvent.facility_id; MedicalCertifier: X-User-ID == MedicalCertification.certifier_id)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "POST /vital-events/{id}/file, POST /certifications/{id}/certify"
  - priority: 4
    category: existence
    check: "each path/body-referenced resource exists, validated left-to-right"
    error_id: "ERR_*_NOT_FOUND (per entity)"
    http_status: 404
    applies_to: "all id-bearing endpoints"
  - priority: 5
    category: business_constraint
    check: "request body has all required fields with valid types/enums"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"
  - priority: 6
    category: business_constraint
    check: "copy_count >= 1 on copy request creation; documentary_evidence_count >= 1 on packet creation"
    error_id: ERR_INVALID_COPY_COUNT
    http_status: 422
    applies_to: "POST /certified-copy-requests, POST /delayed-registration-packets"
  - priority: 7
    category: business_constraint
    check: "MEDICAL amendment supplies target_certification_id; DEMOGRAPHIC amendment omits it"
    error_id: ERR_AMENDMENT_TARGET_REQUIRED
    http_status: 422
    applies_to: "POST /amendments"
  - priority: 8
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 9
    category: business_constraint
    check: "certification created only for DEATH/FETAL_DEATH events"
    error_id: ERR_NOT_DEATH_EVENT
    http_status: 409
    applies_to: "POST /certifications"
  - priority: 10
    category: business_constraint
    check: "paternity acknowledgment references a BIRTH event"
    error_id: ERR_NOT_BIRTH_EVENT
    http_status: 409
    applies_to: "POST /paternity-acknowledgments/{id}/acknowledge"
  - priority: 11
    category: business_constraint
    check: "at most one MedicalCertification per VitalEvent (no second certification create)"
    error_id: ERR_DUPLICATE_CERTIFICATION
    http_status: 409
    applies_to: "POST /certifications"
  - priority: 12
    category: state
    check: "copy request must be ID_VERIFIED before issue"
    error_id: ERR_ID_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /certified-copy-requests/{id}/issue"
  - priority: 13
    category: state
    check: "operations on a record require the record REGISTERED/AMENDED (copy issue, amendment submit/approve, paternity acknowledge)"
    error_id: ERR_EVENT_NOT_REGISTERED
    http_status: 409
    applies_to: "POST /certified-copy-requests/{id}/issue, POST /amendments/{id}/submit, POST /amendments/{id}/approve, POST /paternity-acknowledgments/{id}/acknowledge"
  - priority: 14
    category: state
    check: "apostille authentication requires the referenced copy ISSUED"
    error_id: ERR_COPY_NOT_ISSUED
    http_status: 409
    applies_to: "POST /apostille-requests/{id}/authenticate"
  - priority: 15
    category: business_safety
    check: "registering a DEATH/FETAL_DEATH event requires its MedicalCertification CERTIFIED"
    error_id: ERR_CERTIFICATION_REQUIRED
    http_status: 409
    applies_to: "POST /vital-events/{id}/register"
  - priority: 16
    category: business_temporal
    check: "registering a DELAYED/FOREIGN event requires an ACCEPTED DelayedRegistrationPacket"
    error_id: ERR_DELAYED_REGISTRATION_REQUIRED
    http_status: 409
    applies_to: "POST /vital-events/{id}/register"
  - priority: 17
    category: business_temporal
    check: "rescission allowed only while clock now <= rescission_deadline"
    error_id: ERR_RESCISSION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /paternity-acknowledgments/{id}/rescind"
  - priority: 18
    category: business_temporal
    check: "finalize allowed only after clock now > rescission_deadline"
    error_id: ERR_RESCISSION_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /paternity-acknowledgments/{id}/finalize"
  - priority: 19
    category: business_temporal
    check: "accepting a packet whose hearing interval [start,end] (with 15-min buffer, inclusive) overlaps another SUBMITTED/ACCEPTED packet in the same hearing_jurisdiction_code is rejected"
    error_id: ERR_HEARING_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /delayed-registration-packets/{id}/accept"
  - priority: 20
    category: business_temporal
    check: "a StatisticsReport period [period_start, period_end) must not overlap an existing report in the same jurisdiction_code; adjacency (period_start == other.period_end) is allowed"
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /statistics-reports"
  - priority: 21
    category: business_referential
    check: "issuing a copy of a confidential record (age < public threshold) requires an eligible requester_relationship"
    error_id: ERR_NOT_ELIGIBLE
    http_status: 403
    applies_to: "POST /certified-copy-requests/{id}/issue"
  - priority: 22
    category: business_fiscal
    check: "expected_vital_event_version matches the VitalEvent.version (OCC)"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "POST /amendments/{id}/approve, POST /certified-copy-requests/{id}/issue"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- Facility ----
  - method: POST
    path: "/facilities"
    description: "Register a filing facility"
    roles: [StateRegistrar]
    code: 201
    input: [name, facility_type, jurisdiction_code, npi, "active?"]
    output: Facility
    side_effects: []
  - method: GET
    path: "/facilities/{id}"
    description: "Fetch a facility"
    roles: [StateRegistrar, FacilityFiler, MedicalCertifier, Applicant]
    code: 200
    input: []
    output: Facility
    side_effects: []

  # ---- Certifier ----
  - method: POST
    path: "/certifiers"
    description: "Register a medical certifier"
    roles: [StateRegistrar]
    code: 201
    input: [name, certifier_type, license_number, jurisdiction_code, "active?"]
    output: Certifier
    side_effects: []
  - method: GET
    path: "/certifiers/{id}"
    description: "Fetch a certifier"
    roles: [StateRegistrar, MedicalCertifier, FacilityFiler]
    code: 200
    input: []
    output: Certifier
    side_effects: []

  # ---- VitalEvent ----
  - method: POST
    path: "/vital-events"
    description: "Facility drafts a new EDR (DRAFT)"
    roles: [FacilityFiler]
    code: 201
    input: [event_type, event_date, subject_last_name, subject_first_name, sex, jurisdiction_code, facility_id, place_of_event, "foreign_born?"]
    output: VitalEvent
    side_effects: ["set certification_required = event_type in {DEATH, FETAL_DEATH}"]
  - method: GET
    path: "/vital-events/{id}"
    description: "Fetch a vital event"
    roles: [StateRegistrar, FacilityFiler, MedicalCertifier, Applicant]
    code: 200
    input: []
    output: VitalEvent
    side_effects: []
  - method: GET
    path: "/vital-events"
    description: "List vital events (reverse-reachability for facility_id)"
    roles: [StateRegistrar, FacilityFiler]
    code: 200
    input: ["facility_id?", "status?", "event_type?", "jurisdiction_code?", "registration_type?", "limit?", "offset?"]
    output: VitalEvent[]
    side_effects: []
  - method: POST
    path: "/vital-events/{id}/file"
    description: "Facility files the EDR (DRAFT/RETURNED->FILED); computes registration_type/days_late/delayed_fee_cents"
    roles: [FacilityFiler]
    code: 200
    input: []
    output: VitalEvent
    side_effects: ["registration_delay_fee", "if RETURNED first re-opens to DRAFT then files"]
  - method: POST
    path: "/vital-events/{id}/register"
    description: "Registrar registers the event (FILED->REGISTERED); mints state_file_number; cascade lock chain"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: VitalEvent
    side_effects: ["mint state_file_number", "increment Facility.registered_count", "cascade CERTIFIED->LOCKED then Certifier.locked_certification_count++", "increment version by 1"]
  - method: POST
    path: "/vital-events/{id}/return"
    description: "Registrar returns a filed event to the facility (FILED->RETURNED)"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: VitalEvent
    side_effects: ["set status RETURNED"]
  - method: POST
    path: "/vital-events/{id}/void"
    description: "Registrar voids a registered record (REGISTERED/AMENDED->VOIDED); compensating reversal"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: VitalEvent
    side_effects: ["decrement Facility.registered_count", "reverse ISSUED copies: decrement copies_issued_count and fees_collected_cents", "increment version by 1"]

  # ---- MedicalCertification ----
  - method: POST
    path: "/certifications"
    description: "Certifier opens a cause-of-death certification for a DEATH/FETAL_DEATH event (PENDING)"
    roles: [MedicalCertifier]
    code: 201
    input: [vital_event_id, certifier_id, cause_of_death, manner_of_death]
    output: MedicalCertification
    side_effects: []
  - method: GET
    path: "/certifications/{id}"
    description: "Fetch a certification"
    roles: [StateRegistrar, MedicalCertifier, FacilityFiler]
    code: 200
    input: []
    output: MedicalCertification
    side_effects: []
  - method: GET
    path: "/certifications"
    description: "List certifications (reverse-reachability for vital_event_id and certifier_id)"
    roles: [StateRegistrar, MedicalCertifier]
    code: 200
    input: ["vital_event_id?", "certifier_id?", "status?", "limit?", "offset?"]
    output: MedicalCertification[]
    side_effects: []
  - method: POST
    path: "/certifications/{id}/certify"
    description: "Certifier signs (PENDING->CERTIFIED)"
    roles: [MedicalCertifier]
    code: 200
    input: []
    output: MedicalCertification
    side_effects: ["set certified_at"]

  # ---- Amendment ----
  - method: POST
    path: "/amendments"
    description: "Registrar opens a correction (DRAFT)"
    roles: [StateRegistrar]
    code: 201
    input: [vital_event_id, amendment_type, "target_certification_id?", field_name, new_value, reason]
    output: Amendment
    side_effects: []
  - method: GET
    path: "/amendments/{id}"
    description: "Fetch an amendment"
    roles: [StateRegistrar, Applicant]
    code: 200
    input: []
    output: Amendment
    side_effects: []
  - method: GET
    path: "/amendments"
    description: "List amendments (reverse-reachability for vital_event_id and target_certification_id)"
    roles: [StateRegistrar]
    code: 200
    input: ["vital_event_id?", "target_certification_id?", "status?", "limit?", "offset?"]
    output: Amendment[]
    side_effects: []
  - method: POST
    path: "/amendments/{id}/submit"
    description: "Submit or re-submit a correction (DRAFT/REJECTED->SUBMITTED); pins evidence_required"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: Amendment
    side_effects: ["compute evidence_required"]
  - method: POST
    path: "/amendments/{id}/approve"
    description: "Approve a correction (SUBMITTED->APPROVED); cascade into event (and certification for MEDICAL). OCC on the event."
    roles: [StateRegistrar]
    code: 200
    input: [expected_vital_event_version]
    output: Amendment
    side_effects: ["cascade DEMOGRAPHIC->event or MEDICAL->certification->event", "increment VitalEvent.version by 1"]
  - method: POST
    path: "/amendments/{id}/reject"
    description: "Reject a correction (SUBMITTED->REJECTED)"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: Amendment
    side_effects: []

  # ---- PaternityAcknowledgment ----
  - method: POST
    path: "/paternity-acknowledgments"
    description: "Open an acknowledgment of paternity for a birth record (DRAFT)"
    roles: [StateRegistrar, Applicant]
    code: 201
    input: [vital_event_id, father_last_name, father_first_name, mother_consent]
    output: PaternityAcknowledgment
    side_effects: ["set filed_by_user_id = X-User-ID"]
  - method: GET
    path: "/paternity-acknowledgments/{id}"
    description: "Fetch a paternity acknowledgment"
    roles: [StateRegistrar, Applicant]
    code: 200
    input: []
    output: PaternityAcknowledgment
    side_effects: []
  - method: GET
    path: "/paternity-acknowledgments"
    description: "List acknowledgments (reverse-reachability for vital_event_id)"
    roles: [StateRegistrar]
    code: 200
    input: ["vital_event_id?", "status?", "limit?", "offset?"]
    output: PaternityAcknowledgment[]
    side_effects: []
  - method: POST
    path: "/paternity-acknowledgments/{id}/acknowledge"
    description: "Acknowledge (DRAFT->ACKNOWLEDGED); cascade father fields onto BIRTH event"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: PaternityAcknowledgment
    side_effects: ["set acknowledged_at, rescission_deadline", "cascade event father fields + paternity_established, event.version++"]
  - method: POST
    path: "/paternity-acknowledgments/{id}/rescind"
    description: "Rescind within window (ACKNOWLEDGED->RESCINDED); cascade-clear father fields"
    roles: [StateRegistrar, Applicant]
    code: 200
    input: []
    output: PaternityAcknowledgment
    side_effects: ["cascade clear event father fields + paternity_established=false, event.version++"]
  - method: POST
    path: "/paternity-acknowledgments/{id}/finalize"
    description: "Finalize after window closes (ACKNOWLEDGED->FINALIZED)"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: PaternityAcknowledgment
    side_effects: []

  # ---- CertifiedCopyRequest ----
  - method: POST
    path: "/certified-copy-requests"
    description: "Applicant requests certified copies (SUBMITTED)"
    roles: [Applicant, StateRegistrar]
    code: 201
    input: [vital_event_id, requester_name, requester_relationship, "requester_category?", id_document_type, copy_count, "expedite?"]
    output: CertifiedCopyRequest
    side_effects: []
  - method: GET
    path: "/certified-copy-requests/{id}"
    description: "Fetch a copy request"
    roles: [StateRegistrar, Applicant]
    code: 200
    input: []
    output: CertifiedCopyRequest
    side_effects: []
  - method: GET
    path: "/certified-copy-requests"
    description: "List copy requests (reverse-reachability for vital_event_id)"
    roles: [StateRegistrar, Applicant]
    code: 200
    input: ["vital_event_id?", "status?", "limit?", "offset?"]
    output: CertifiedCopyRequest[]
    side_effects: []
  - method: POST
    path: "/certified-copy-requests/{id}/verify-id"
    description: "Verify presented ID (SUBMITTED->ID_VERIFIED)"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: CertifiedCopyRequest
    side_effects: ["set id_verified = true"]
  - method: POST
    path: "/certified-copy-requests/{id}/issue"
    description: "Issue copies (ID_VERIFIED->ISSUED); eligibility + fee + fee ledger. OCC on the event."
    roles: [StateRegistrar]
    code: 200
    input: [expected_vital_event_version]
    output: CertifiedCopyRequest
    side_effects: ["copy_eligibility", "certified_copy_fee", "increment VitalEvent.copies_issued_count and fees_collected_cents, event.version++"]
  - method: POST
    path: "/certified-copy-requests/{id}/deny"
    description: "Deny a copy request (SUBMITTED/ID_VERIFIED->DENIED)"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: CertifiedCopyRequest
    side_effects: []

  # ---- ApostilleRequest ----
  - method: POST
    path: "/apostille-requests"
    description: "Request apostille/exemplified authentication of an issued copy (SUBMITTED)"
    roles: [Applicant, StateRegistrar]
    code: 201
    input: [certified_copy_request_id, destination_country, apostille_type]
    output: ApostilleRequest
    side_effects: []
  - method: GET
    path: "/apostille-requests/{id}"
    description: "Fetch an apostille request"
    roles: [StateRegistrar, Applicant]
    code: 200
    input: []
    output: ApostilleRequest
    side_effects: []
  - method: GET
    path: "/apostille-requests"
    description: "List apostille requests (reverse-reachability for certified_copy_request_id)"
    roles: [StateRegistrar]
    code: 200
    input: ["certified_copy_request_id?", "status?", "limit?", "offset?"]
    output: ApostilleRequest[]
    side_effects: []
  - method: POST
    path: "/apostille-requests/{id}/authenticate"
    description: "Authenticate (SUBMITTED->AUTHENTICATED); requires copy ISSUED"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: ApostilleRequest
    side_effects: ["set authenticated_at"]
  - method: POST
    path: "/apostille-requests/{id}/reject"
    description: "Reject (SUBMITTED->REJECTED)"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: ApostilleRequest
    side_effects: []

  # ---- DelayedRegistrationPacket ----
  - method: POST
    path: "/delayed-registration-packets"
    description: "Submit a delayed/foreign registration evidence packet with a hearing slot (SUBMITTED)"
    roles: [FacilityFiler, StateRegistrar]
    code: 201
    input: [vital_event_id, packet_type, documentary_evidence_count, hearing_start, hearing_end, hearing_jurisdiction_code]
    output: DelayedRegistrationPacket
    side_effects: []
  - method: GET
    path: "/delayed-registration-packets/{id}"
    description: "Fetch a packet"
    roles: [StateRegistrar, FacilityFiler]
    code: 200
    input: []
    output: DelayedRegistrationPacket
    side_effects: []
  - method: GET
    path: "/delayed-registration-packets"
    description: "List packets (reverse-reachability for vital_event_id)"
    roles: [StateRegistrar]
    code: 200
    input: ["vital_event_id?", "status?", "limit?", "offset?"]
    output: DelayedRegistrationPacket[]
    side_effects: []
  - method: POST
    path: "/delayed-registration-packets/{id}/accept"
    description: "Accept a packet or re-open a returned one (SUBMITTED->ACCEPTED, RETURNED->SUBMITTED); hearing-slot overlap check on accept"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: DelayedRegistrationPacket
    side_effects: ["set accepted_at on ACCEPTED", "RETURNED re-opens to SUBMITTED"]
  - method: POST
    path: "/delayed-registration-packets/{id}/return"
    description: "Return a packet for more evidence (SUBMITTED->RETURNED)"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: DelayedRegistrationPacket
    side_effects: []

  # ---- StatisticsReport ----
  - method: POST
    path: "/statistics-reports"
    description: "Generate a jurisdiction statistics report over a period; computes counts + remittance"
    roles: [StateRegistrar]
    code: 201
    input: [jurisdiction_code, period_start, period_end]
    output: StatisticsReport
    side_effects: ["statistics_counts", "state_remittance"]
  - method: GET
    path: "/statistics-reports/{id}"
    description: "Fetch a statistics report"
    roles: [StateRegistrar]
    code: 200
    input: []
    output: StatisticsReport
    side_effects: []
  - method: GET
    path: "/statistics-reports"
    description: "List statistics reports"
    roles: [StateRegistrar]
    code: 200
    input: ["jurisdiction_code?", "limit?", "offset?"]
    output: StatisticsReport[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to a fixed instant. Server startup default is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default (never real wall-clock). All event dates, windows, and deadlines resolve against this logical clock."
    roles: [StateRegistrar]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock now := to_iso8601"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID; unknown role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "entity_backed actor is not the owner of the target (FacilityFiler != facility_id, MedicalCertifier != certifier_id)"
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "facility_id does not resolve"
  - id: ERR_CERTIFIER_NOT_FOUND
    http: 404
    condition: "certifier_id does not resolve"
  - id: ERR_VITAL_EVENT_NOT_FOUND
    http: 404
    condition: "vital event id does not resolve"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "certification id does not resolve"
  - id: ERR_AMENDMENT_NOT_FOUND
    http: 404
    condition: "amendment id does not resolve"
  - id: ERR_PATERNITY_NOT_FOUND
    http: 404
    condition: "paternity acknowledgment id does not resolve"
  - id: ERR_COPY_REQUEST_NOT_FOUND
    http: 404
    condition: "certified copy request id does not resolve"
  - id: ERR_APOSTILLE_NOT_FOUND
    http: 404
    condition: "apostille request id does not resolve"
  - id: ERR_PACKET_NOT_FOUND
    http: 404
    condition: "delayed registration packet id does not resolve"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "statistics report id does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, or invalid enum value"
  - id: ERR_INVALID_COPY_COUNT
    http: 422
    condition: "copy_count < 1 or documentary_evidence_count < 1"
  - id: ERR_AMENDMENT_TARGET_REQUIRED
    http: 422
    condition: "MEDICAL amendment lacks target_certification_id, or DEMOGRAPHIC amendment supplies one"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state (includes acting on a terminal state)"
  - id: ERR_NOT_DEATH_EVENT
    http: 409
    condition: "Certification opened on a non-DEATH/FETAL_DEATH event"
  - id: ERR_NOT_BIRTH_EVENT
    http: 409
    condition: "Paternity acknowledgment on a non-BIRTH event"
  - id: ERR_DUPLICATE_CERTIFICATION
    http: 409
    condition: "A second MedicalCertification created for a VitalEvent that already has one"
  - id: ERR_ID_NOT_VERIFIED
    http: 409
    condition: "Issue attempted before ID verification (status still SUBMITTED)"
  - id: ERR_EVENT_NOT_REGISTERED
    http: 409
    condition: "Copy issue / amendment submit-or-approve / paternity acknowledge attempted while the event is not REGISTERED/AMENDED"
  - id: ERR_COPY_NOT_ISSUED
    http: 409
    condition: "Apostille authentication attempted while the referenced copy is not ISSUED"
  - id: ERR_CERTIFICATION_REQUIRED
    http: 409
    condition: "Registering a DEATH/FETAL_DEATH event whose MedicalCertification is not CERTIFIED"
  - id: ERR_DELAYED_REGISTRATION_REQUIRED
    http: 409
    condition: "Registering a DELAYED/FOREIGN event with no ACCEPTED DelayedRegistrationPacket"
  - id: ERR_RESCISSION_WINDOW_CLOSED
    http: 409
    condition: "Rescission attempted after clock now > rescission_deadline"
  - id: ERR_RESCISSION_WINDOW_OPEN
    http: 409
    condition: "Finalize attempted while clock now <= rescission_deadline"
  - id: ERR_HEARING_SLOT_CONFLICT
    http: 409
    condition: "Accepting a packet whose hearing interval overlaps another SUBMITTED/ACCEPTED packet in the same jurisdiction within the 15-minute buffer"
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "A statistics report period overlaps an existing report in the same jurisdiction (adjacency allowed)"
  - id: ERR_NOT_ELIGIBLE
    http: 403
    condition: "Certified copy of a confidential (not-yet-public) record requested by an ineligible relationship"
  - id: ERR_STALE_EVENT_VERSION
    http: 412
    condition: "expected_vital_event_version does not match the current VitalEvent.version (OCC)"

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: StateRegistrar
    description: "The state/local registrar authority: registers, returns, voids records; approves/rejects amendments; processes copy issuance, apostilles, delayed packets, paternity lifecycle; runs statistics"
    identity: "opaque"
    exclusive_operations:
      - "POST /vital-events/{id}/register"
      - "POST /vital-events/{id}/return"
      - "POST /vital-events/{id}/void"
      - "POST /amendments (create), submit, approve, reject"
      - "POST /certified-copy-requests/{id}/verify-id, issue, deny"
      - "POST /apostille-requests/{id}/authenticate, reject"
      - "POST /delayed-registration-packets/{id}/accept, return"
      - "POST /paternity-acknowledgments/{id}/acknowledge, finalize"
      - "POST /statistics-reports"
      - "POST /facilities, POST /certifiers"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across all collections"
      - "POST /certified-copy-requests (create), POST /apostille-requests (create), POST /paternity-acknowledgments (create), POST /delayed-registration-packets (create)"
      - "POST /paternity-acknowledgments/{id}/rescind"
  - name: FacilityFiler
    description: "Hospital / funeral home / birthing center EDR filer; owns and files vital events for its own facility"
    identity: "entity_backed:Facility"
    exclusive_operations:
      - "POST /vital-events (create)"
      - "POST /vital-events/{id}/file"
    shared_operations:
      - "POST /delayed-registration-packets (create)"
      - "GET /vital-events, GET /vital-events/{id}, GET /facilities/{id}, GET /certifiers/{id}, GET /certifications/{id}, GET /delayed-registration-packets/{id}"
  - name: MedicalCertifier
    description: "Physician / medical examiner / coroner; owns and signs cause-of-death certifications"
    identity: "entity_backed:Certifier"
    exclusive_operations:
      - "POST /certifications (create)"
      - "POST /certifications/{id}/certify"
    shared_operations:
      - "GET /certifications, GET /certifications/{id}, GET /vital-events/{id}, GET /facilities/{id}, GET /certifiers/{id}"
  - name: Applicant
    description: "Public requester of certified/informational copies, apostilles, and paternity acknowledgments"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /certified-copy-requests (create)"
      - "POST /apostille-requests (create)"
      - "POST /paternity-acknowledgments (create)"
      - "POST /paternity-acknowledgments/{id}/rescind"
      - "GET /certified-copy-requests/{id}, GET /apostille-requests/{id}, GET /paternity-acknowledgments/{id}, GET /amendments/{id}, GET /vital-events/{id}, GET /facilities/{id}"
