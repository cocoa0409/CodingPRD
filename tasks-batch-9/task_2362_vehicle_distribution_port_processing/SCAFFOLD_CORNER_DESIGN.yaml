          - state_machines.Vehicle.transitions.NONE_to_SURVEY_DAMAGE_OPEN
        excluded_because:
          difficulty_instance: non_linear_state_machine / vehicle_parallel_dimensions_and_inspection_rework_cycle
          rationale: "That §1.8 instance drives processing_status and damage_status through independent advances on the same unit and asserts the combined state after each step."

