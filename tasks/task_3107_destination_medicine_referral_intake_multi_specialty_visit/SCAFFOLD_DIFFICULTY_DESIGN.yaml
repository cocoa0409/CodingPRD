      - name: review_fatigue_circular_accumulator_evaluation_order
        grounds:
          - calculations.review_fatigue_accumulation
          - entities.VisitCase.fields.fatigue_score
        distinguishing_aspect: "Mode (c): the fatigue accumulator has a circular-looking dependency — verification increments can force WITHDRAWN, which then gates whether a later remote-consult decrement applies — and the scaffold pins evaluation order (increment lands, then threshold check, then decrements only on non-terminal cases), so 5 verifies auto-withdraw the case at exactly score 10 before any decrement can rescue it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One referral with a DESTINATION case in INTAKE (never approved); five medical records registered, each verified sequentially by the same reviewer (distinct from the coordinator)."
          setup_api_calls:
