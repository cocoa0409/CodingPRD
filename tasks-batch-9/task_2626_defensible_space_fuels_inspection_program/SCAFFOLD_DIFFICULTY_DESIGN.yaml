  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: risk_class_high_at_exact_55_00_score
        grounds:
          - calculations.parcel_risk_score
          - entities.Parcel.fields.risk_score
          - entities.Parcel.fields.risk_class
          - endpoints."POST /fire-district/parcels"
        distinguishing_aspect: |
          Boundary surface is the risk-band ladder and the two min() clamps inside
          parcel_risk_score, exercised entirely at intake. slope_pct 20 with GRASS / NONE roof
          / DOG_ON_SITE / MODERATE hazard produces weighted_subtotal exactly 55.00, which must
          band as HIGH because RISK_CLASS_THRESHOLDS are inclusive (>=); slope_pct 19.9 gives
          54.94 and bands MODERATE. The same instance pins slope_points = min(100, slope_pct *
          2) at its clamp (slope 50 and slope 70 must score identically) and the outer
          min(100.00, ...) clamp on risk_score itself. The sibling instance owns a different
          calculation with a different rounding depth.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. No cycle is required; parcel intake does not read one."
            - "Three control parcels: one just below the HIGH threshold (slope 19.9), two identical except for slope 50 vs slope 70 to expose the slope clamp, and one engineered to overflow 100.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-7001", owner_name: "Lo Below", owner_email: "lo@example.com", situs_address: "1 Edge Rd", structure_present: true, roof_class: "NONE", vegetation_type: "GRASS", slope_pct: 19.9, lot_area_sqft: 20000, hazard_zone: "MODERATE", access_constraint: "DOG_ON_SITE" }
              as: ProgramAdmin
              captures: { below_score: "$.data.risk_score", below_class: "$.data.risk_class" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-7002", owner_name: "Cl Amp", owner_email: "cl@example.com", situs_address: "2 Edge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 50, lot_area_sqft: 20000, hazard_zone: "MODERATE", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { clamp50_score: "$.data.risk_score" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-7003", owner_name: "Cl Amp2", owner_email: "cl2@example.com", situs_address: "3 Edge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 70, lot_area_sqft: 20000, hazard_zone: "MODERATE", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { clamp70_score: "$.data.risk_score" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-7004", owner_name: "Ov Erflow", owner_email: "ov@example.com", situs_address: "4 Edge Rd", structure_present: true, roof_class: "NONE", vegetation_type: "MIXED_CONIFER", slope_pct: 50, lot_area_sqft: 20000, hazard_zone: "VERY_HIGH", access_constraint: "LOCKED_GATE" }
              as: ProgramAdmin
              captures: { over_score: "$.data.risk_score", over_class: "$.data.risk_class" }
          trigger:
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-7005", owner_name: "Ed Ge", owner_email: "ed@example.com", situs_address: "5 Edge Rd", structure_present: true, roof_class: "NONE", vegetation_type: "GRASS", slope_pct: 20, lot_area_sqft: 20000, hazard_zone: "MODERATE", access_constraint: "DOG_ON_SITE" }
              as: ProgramAdmin
              captures: { edge_score: "$.data.risk_score", edge_class: "$.data.risk_class" }
          assert:
            - "${edge_score} == 55.00 (0.30*40 + 0.30*40 + 0.25*100 + 0.15*40, HAZARD_MULT[MODERATE] 1.00)"
            - "${edge_class} == \"HIGH\", NOT \"MODERATE\": the 55.00 threshold is inclusive"
            - "${below_score} == 54.94 and ${below_class} == \"MODERATE\": one tenth of a slope point below the boundary changes the band"
            - "${clamp50_score} == 67.50 and ${clamp70_score} == 67.50: slope_points saturates at min(100, slope_pct * 2), so slope 70 scores no higher than slope 50"
            - "${clamp70_score} != 79.50, the value produced for slope_pct 70 when the slope clamp is omitted (0.30 * 140 == 42.00 instead of 30.00)"
            - "${over_score} == 100.00 and ${over_class} == \"EXTREME\": the raw product 91.00 * 1.30 == 118.30 is clamped by min(100.00, ...) before rounding"
            - "Every risk_score above carries exactly 2 decimals and risk_score_basis == \"INTAKE_PROVISIONAL\""

      - name: zone_severity_major_at_exact_0_6000_deficit_ratio
        grounds:
          - calculations.zone_deficiency_assessment
          - entities.ZoneEvaluation.fields.required_clearance_ft
          - entities.ZoneEvaluation.fields.deficit_ratio
          - entities.ZoneEvaluation.fields.deficiency_severity
          - entities.ZoneEvaluation.fields.points
          - endpoints."POST /fire-district/inspections/{inspection_id}/zone-evaluations"
        distinguishing_aspect: |
          Boundary surface is the per-zone severity ladder, and unlike the risk-band instance
          the decisive quantity is rounded at THREE different depths in one request:
          required_clearance_ft at 1 decimal (5 * 1.25 == 6.25 must become 6.3, not the 6.2 a
          round-half-even implementation gives), deficit_ratio at 4 decimals, and points at 2
          (0.2063 * 100 * 1.50 == 30.945 must become 30.95, not 30.94). At ZONE_1 on a slope-30
          parcel, measured 15.0 ft gives deficit_ratio exactly 0.6000, which is MAJOR because
          SEVERITY_MAJOR_MAX_RATIO is inclusive on the upper edge; 14.9 ft tips to CRITICAL and
          15.1 ft stays MAJOR with a smaller ratio.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one ACTIVE cycle with notice_lead_days 10."
            - "One ACTIVE inspector and one parcel with slope_pct 30, so slope_factor is 1.25 and ZONE_1 requires 37.5 ft."
            - "Three noticed inspections on that parcel on 2026-08-20, 2026-08-21 and 2026-08-22, each 15:00Z-17:00Z, so each can hold its own ZONE_1 row."
            - "On the 2026-08-21 inspection a ZONE_1 measurement of 14.9 ft is recorded; on the 2026-08-22 inspection 15.1 ft; on the 2026-08-20 inspection a ZONE_0_EMBER measurement of 5.0 ft is recorded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026, notice_lead_days: 10 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-7101", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { ins_a: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "COMPLAINT", scheduled_start_utc: "2026-08-21T15:00:00Z", scheduled_end_utc: "2026-08-21T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { ins_b: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "COMPLAINT", scheduled_start_utc: "2026-08-22T15:00:00Z", scheduled_end_utc: "2026-08-22T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { ins_c: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins_a}/notice"
              payload: { notice_method: "EMAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins_b}/notice"
              payload: { notice_method: "EMAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins_c}/notice"
              payload: { notice_method: "EMAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins_a}/zone-evaluations"
              payload: { zone: "ZONE_0_EMBER", measured_clearance_ft: 5.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { z0_req: "$.data.required_clearance_ft", z0_ratio: "$.data.deficit_ratio", z0_points: "$.data.points", z0_sev: "$.data.deficiency_severity" }
            - call: "POST /fire-district/inspections/${ins_b}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 14.9, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { zb_ratio: "$.data.deficit_ratio", zb_sev: "$.data.deficiency_severity", zb_points: "$.data.points" }
            - call: "POST /fire-district/inspections/${ins_c}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 15.1, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { zc_ratio: "$.data.deficit_ratio", zc_sev: "$.data.deficiency_severity", zc_points: "$.data.points" }
          trigger:
            - call: "POST /fire-district/inspections/${ins_a}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 15.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { za_req: "$.data.required_clearance_ft", za_ratio: "$.data.deficit_ratio", za_sev: "$.data.deficiency_severity", za_points: "$.data.points" }
          assert:
            - "${za_req} == 37.5 (ZONE_BASE_FT[ZONE_1] 30 * slope_factor 1.25) and ${za_ratio} == 0.6000 exactly"
            - "${za_sev} == \"MAJOR\", NOT \"CRITICAL\": SEVERITY_MAJOR_MAX_RATIO 0.6000 is inclusive on the upper edge"
            - "${za_points} == 60.00 (0.6000 * 100 * ZONE_WEIGHT[ZONE_1] 1.00)"
            - "${zb_ratio} == 0.6027 and ${zb_sev} == \"CRITICAL\" and ${zb_points} == 60.27: 22.6 / 37.5 == 0.602666... rounds up at the 4th decimal and crosses the band"
            - "${zc_ratio} == 0.5973 and ${zc_sev} == \"MAJOR\" and ${zc_points} == 59.73"
            - "${z0_req} == 6.3, NOT 6.2: 5 * 1.25 == 6.25 is rounded half-UP at 1 decimal"
            - "${z0_ratio} == 0.2063 (1.3 / 6.3 == 0.2063492...) and ${z0_sev} == \"MINOR\" since 0.2063 <= SEVERITY_MINOR_MAX_RATIO 0.2500"
            - "${z0_points} == 30.95, NOT 30.94: 0.2063 * 100 * 1.50 == 30.945 is rounded half-UP at 2 decimals"
            - "A second ZONE_1 evaluation on ${ins_a} is rejected with ERR_ZONE_ALREADY_EVALUATED (409), so each boundary case needs its own inspection"

  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: inspection_scheduling_gated_on_inspector_status_active
        entity_pair: [Inspection, Inspector]
        grounds:
          - validations.priority_51
          - errors.ERR_INSPECTOR_SUSPENDED
          - entities.Inspector.fields.status
          - entities.Inspector.fields.assigned_open_count
          - endpoints."POST /fire-district/inspections"
        distinguishing_aspect: |
          The gate lives on a SIBLING entity that the request only references by FK: creating an
          Inspection is legal in every respect (window free, cycle ACTIVE, parcel fine) and
          fails only because Inspector.status == SUSPENDED. Nothing about the Inspection's own
          state or the request body is defective, and the identical payload with an ACTIVE
          inspector succeeds, so the claim isolates a read of the other entity's state. The
          sibling instance in this rule gates a decision on the state of a set of rows on a
          third entity rather than on one FK target.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one ACTIVE cycle."
            - "Two inspectors created at the same certification level: insp_ok with status ACTIVE and insp_susp with status SUSPENDED."
            - "One HIGH-hazard parcel with no inspections, so no window is occupied by anyone."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ada Ok", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp_ok: "$.data.id" }
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Sam Susp", certification_level: "ADVANCED", status: "SUSPENDED" }
              as: ProgramAdmin
              captures: { insp_susp: "$.data.id", susp_status: "$.data.status", susp_open: "$.data.assigned_open_count" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-8001", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp_susp}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
          assert:
            - "${susp_status} == \"SUSPENDED\" and ${susp_open} == 0 before the trigger"
            - "The trigger returns HTTP 409 with error.code == \"ERR_INSPECTOR_SUSPENDED\""
            - "No Inspection row exists for parcel ${p1} and Inspector.${insp_susp}.assigned_open_count is still 0"
            - "The byte-identical payload with inspector_id ${insp_ok} succeeds, creating a SCHEDULED Inspection and raising Inspector.${insp_ok}.assigned_open_count to 1"
            - "The failure is therefore attributable to Inspector state alone, not to the window, the cycle or the parcel"
            - "The error is 409 / ERR_INSPECTOR_SUSPENDED and NOT 422 / ERR_INSPECTOR_NOT_CERTIFIED, since the parcel is HIGH rather than VERY_HIGH and priority 50 does not apply"

      - name: certificate_issuance_gated_on_no_open_violation_notice
        entity_pair: [ComplianceCertificate, ViolationNotice]
        grounds:
          - validations.priority_58
          - errors.ERR_OPEN_VIOLATION_EXISTS
          - errors.ERR_PARCEL_NOT_INSPECTED
          - state_machines.ComplianceCertificate.REQUESTED_to_ISSUED
          - entities.Parcel.fields.compliance_status
          - endpoints."POST /fire-district/compliance-certificates/{certificate_id}/decision"
        distinguishing_aspect: |
          The gate is a SET predicate over a third entity rather than a field read on one FK
          target: issuing a certificate is refused while ANY ViolationNotice on the parcel sits
          in {ISSUED, EXTENDED, OVERDUE, ABATEMENT_AUTHORIZED}, and the certificate row itself
          is in a perfectly valid REQUESTED state. The same rule also demonstrates
          state-dependent error SELECTION on one endpoint: a never-inspected parcel yields
          ERR_PARCEL_NOT_INSPECTED while a failed-inspection parcel yields
          ERR_OPEN_VIOLATION_EXISTS, both 409 from priority 58.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one ACTIVE cycle with notice_lead_days 10."
            - "Parcel p1 fails an INITIAL inspection at clock 2026-08-22 and holds one ISSUED MAJOR notice, so compliance_status is NON_COMPLIANT."
            - "Parcel p2 is freshly registered and has never been inspected (compliance_status PENDING_INSPECTION)."
            - "An INSURANCE certificate request exists on p1 and another on p2, both in status REQUESTED."
            - "A REINSPECTION on p1 is scheduled for 2026-09-05T15:00Z-17:00Z, noticed, and evaluated 10.0 / 40.0 / 130.0 ft so it can pass on demand."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026, notice_lead_days: 10 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-8101", owner_name: "Ann Reyes", owner_email: "ann@example.com", situs_address: "12 Ridge Rd", structure_present: true, roof_class: "CLASS_B", vegetation_type: "BRUSH", slope_pct: 30, lot_area_sqft: 43560, hazard_zone: "HIGH", access_constraint: "GATED" }
              as: ProgramAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /fire-district/parcels"
              payload: { apn: "APN-8102", owner_name: "Ben Ortiz", owner_email: "ben@example.com", situs_address: "14 Ridge Rd", structure_present: true, roof_class: "CLASS_A", vegetation_type: "GRASS", slope_pct: 5, lot_area_sqft: 20000, hazard_zone: "MODERATE", access_constraint: "NONE" }
              as: ProgramAdmin
              captures: { p2: "$.data.id", p2_status: "$.data.compliance_status" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "INITIAL", scheduled_start_utc: "2026-08-20T15:00:00Z", scheduled_end_utc: "2026-08-20T17:00:00Z", access_arrangement: "EXTERIOR_ONLY" }
              as: ProgramAdmin
              captures: { ins1: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins1}/notice"
              payload: { notice_method: "CERTIFIED_MAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_0_EMBER", measured_clearance_ft: 5.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 15.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins1}/zone-evaluations"
              payload: { zone: "ZONE_2", measured_clearance_ft: 118.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins1}/complete"
              payload: { result: "FAIL", violation_notice_method: "CERTIFIED_MAIL" }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "GET /fire-district/violation-notices"
              payload: { parcel_id: "${p1}" }
              as: ProgramAdmin
              captures: { n1: "$.data[0].id", n1_status: "$.data[0].status" }
            - call: "POST /fire-district/parcels/${p1}/compliance-certificates"
              payload: { requester_kind: "INSURANCE", transaction_reference: "POL-4471" }
              as: TitleAgent
              captures: { cert1: "$.data.id", cert1_status: "$.data.status" }
            - call: "POST /fire-district/parcels/${p2}/compliance-certificates"
              payload: { requester_kind: "INSURANCE", transaction_reference: "POL-4472" }
              as: TitleAgent
              captures: { cert2: "$.data.id" }
            - call: "POST /fire-district/inspections"
              payload: { parcel_id: "${p1}", cycle_id: "${cyc}", inspector_id: "${insp1}", inspection_type: "REINSPECTION", scheduled_start_utc: "2026-09-05T15:00:00Z", scheduled_end_utc: "2026-09-05T17:00:00Z", access_arrangement: "OWNER_PRESENT" }
              as: ProgramAdmin
              captures: { ins2: "$.data.id" }
            - call: "POST /fire-district/inspections/${ins2}/notice"
              payload: { notice_method: "EMAIL" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspections/${ins2}/zone-evaluations"
              payload: { zone: "ZONE_0_EMBER", measured_clearance_ft: 10.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins2}/zone-evaluations"
              payload: { zone: "ZONE_1", measured_clearance_ft: 40.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
            - call: "POST /fire-district/inspections/${ins2}/zone-evaluations"
              payload: { zone: "ZONE_2", measured_clearance_ft: 130.0, ladder_fuel_present: false }
              as: Inspector
              as_user_id: "${insp1}"
          trigger:
            - call: "POST /fire-district/compliance-certificates/${cert1}/decision"
              payload: { decision: "ISSUE" }
              as: ProgramAdmin
          assert:
            - "${n1_status} == \"ISSUED\", ${cert1_status} == \"REQUESTED\" and ${p2_status} == \"PENDING_INSPECTION\" before the trigger"
            - "The trigger returns HTTP 409 with error.code == \"ERR_OPEN_VIOLATION_EXISTS\""
            - "ComplianceCertificate.${cert1}.status is still \"REQUESTED\" and issued_at_utc, expires_at_utc and both snapshot fields remain null"
            - "Issuing ${cert2} on the never-inspected parcel ${p2} returns 409 with error.code == \"ERR_PARCEL_NOT_INSPECTED\", the other branch of the same priority-58 rule"
            - "Clearing the gate on the other entity only — set the clock to 2026-09-05T16:00:00Z and complete ${ins2} with result PASS, which moves ${n1} to CLEARED and Parcel.${p1}.compliance_status to COMPLIANT — then re-sending the identical decision for ${cert1} succeeds"
            - "After that success ComplianceCertificate.${cert1}.status == \"ISSUED\", issued_at_utc == \"2026-09-05T16:00:00Z\", expires_at_utc == \"2026-12-04T23:59:59Z\" and snapshot_compliance_status == \"COMPLIANT\""
            - "A DENY decision on a certificate whose parcel still holds an open notice is always allowed: priority 58 gates only the ISSUE branch"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: inspector_half_open_window_adjacent_ok_overlap_conflict
        interval_semantics: half_open
        grounds:
          - validations.priority_62
          - errors.ERR_INSPECTOR_WINDOW_CONFLICT
          - entities.Inspection.fields.scheduled_start_utc
          - entities.Inspection.fields.scheduled_end_utc
          - state_machines.Inspection.SCHEDULED_to_CANCELLED
          - endpoints."POST /fire-district/inspections"
        distinguishing_aspect: |
          Inspector occupation uses HALF-OPEN intervals [start, end): exact adjacency in either
          direction is legal, so back-to-back 15:00-17:00 and 17:00-19:00 bookings must both
          exist, while 16:00-18:00 is refused. The occupied set is also status-filtered to
          {SCHEDULED, NOTICED, ACCESS_DENIED}, so cancelling the first inspection frees its
          window for an exact re-book. The sibling instance in this rule deliberately uses the
          OPPOSITE interval convention on a different entity, and the two must not be
          implemented with one shared overlap helper.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one ACTIVE cycle."
            - "One ACTIVE ADVANCED inspector insp1 and three HIGH-hazard parcels."
            - "insp1 holds ins1 on p1 for 2026-08-20T15:00Z-17:00Z, and an exactly adjacent ins2 on p2 for 2026-08-20T17:00Z-19:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fire-district/inspection-cycles"
              payload: { season_year: 2026 }
              as: ProgramAdmin
              captures: { cyc: "$.data.id" }
            - call: "POST /fire-district/inspection-cycles/${cyc}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /fire-district/inspectors"
              payload: { full_name: "Ivan Ruiz", certification_level: "ADVANCED", status: "ACTIVE" }
              as: ProgramAdmin
              captures: { insp1: "$.data.id" }
