              payload: { project_id: "${p_id}", utility_owner_id: "${o_id}", pipe_segment_id: "${s_id}", window_start: "2026-08-03T10:00:00Z", window_end: "2026-08-03T13:00:00Z", expected_project_version: "${p_v}" }
