  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: machine_pairwise_halfopen_double_book
        grounds:
          - validations[priority=25]
          - errors[ERR_MACHINE_DOUBLE_BOOKED]
          - entities.Batch.fields.machine_id
          - entities.Batch.fields.scheduled_start
          - entities.Batch.fields.scheduled_end
        distinguishing_aspect: |
          Machine interval semantics = pairwise half-open [start,end): a second batch [09:30,10:30)
          overlaps an existing [09:00,10:00) on the same machine and is rejected (adjacency would be
          allowed, but these strictly overlap).
        test_recipe:
          setup:
            - "One machine with an existing batch reserving [09:00,10:00)."
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "RT1M", kind: "TAPE_DECK" }
              as: Admin
              captures: { machine_id: $.data.id }
            - call: "POST /batches"
              payload: { machine_id: "${machine_id}", scheduled_start: "2026-03-01T09:00:00Z", scheduled_end: "2026-03-01T10:00:00Z" }
              as: LabTech
              captures: { batch_1: $.data.id }
          trigger:
            - call: "POST /batches"
              payload: { machine_id: "${machine_id}", scheduled_start: "2026-03-01T09:30:00Z", scheduled_end: "2026-03-01T10:30:00Z" }
              as: LabTech
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_MACHINE_DOUBLE_BOOKED"

      - name: bin_aggregate_capacity_overlap
        grounds:
          - validations[priority=26]
          - errors[ERR_BIN_CAPACITY_EXCEEDED]
          - entities.StorageBin.fields.capacity
          - entities.MediaItem.fields.retention_until
        distinguishing_aspect: |
          StorageBin interval semantics = aggregate capacity over overlapping retention windows (not
          pairwise): a bin with capacity 1 already holds one item whose 30-day window covers the
          clock; logging a second overlapping item exceeds capacity and is rejected.
        test_recipe:
          setup:
            - "Order RECEIVED; a capacity-1 bin already holding one logged tape item."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rt2@x.com", full_name: "RT2", state_code: "CA" }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", plan_tier: "STANDARD_KIT", turnaround: "STANDARD", output_option: "CLOUD", declared_tape_count: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/receive"
              payload: {}
              as: IntakeTech
            - call: "POST /storage-bins"
              payload: { label: "RT2B", capacity: 1 }
              as: Admin
              captures: { bin_id: $.data.id }
            - call: "POST /orders/${ord_id}/media-items"
              payload: { media_type: "TAPE", bin_id: "${bin_id}" }
              as: IntakeTech
              captures: { mi1: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/media-items"
              payload: { media_type: "TAPE", bin_id: "${bin_id}" }
              as: IntakeTech
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BIN_CAPACITY_EXCEEDED"

