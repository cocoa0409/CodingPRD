              as: ProgrammingExec
              captures: { bv2: $.data.version }
          trigger:
            - call: "POST /slate/air-slots"
              payload: { block_id: "${block_id}", title_id: "${t1}", air_start: "2027-11-09T00:00:00Z", kind: "ENCORE", expected_block_version: "${bv2}" }
