            - "Sample.${s3_id}.status == INVALIDATED and Sample.${s3_id}.invalidation_reason == FIELD_BLANK_CONTAMINATED"
            - "Sample.${s3_id}.status_before_invalidation == null"
            - "After the first receive, EntryPoint.${ep_id}.consecutive_invalidated_samples == 1 and monitoring_status == INITIAL"
            - "After the second receive, EntryPoint.${ep_id}.consecutive_invalidated_samples == 2 and monitoring_status == INITIAL"
            - "After the third receive, EntryPoint.${ep_id}.consecutive_invalidated_samples == 3 and monitoring_status == SUSPENDED"
            - "EntryPoint.${ep_id}.requested_monitoring_status == null"

      - name: resuming_a_suspended_entry_point_lands_on_quarterly_and_zeroes_the_streak
        claim_type: valid_transition
        grounds:
          - state_machines.EntryPoint.transitions.SUSPENDED_to_QUARTERLY
          - endpoints[POST /entry-points/{id}/monitoring-status]
        distinguishing_aspect: "The destination is a fixed state rather than a restored one: an entry point suspended while still in INITIAL comes back as QUARTERLY, and the resume also clears a non-zero invalidation streak in the same write."
        test_recipe:
          setup:
            - "Contaminant PFOA, one Laboratory, EntryPoint EPTDS-01 in INITIAL."
            - "One sample received with a broken chain of custody, leaving consecutive_invalidated_samples at 1."
            - "The administrator then suspends monitoring by hand."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-RES" }
              as: SamplingTechnician
              captures: { s_id: "$.data.id" }
            - call: "POST /samples/${s_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s_id}/receive"
              payload: { chain_of_custody_intact: false, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /entry-points/${ep_id}/monitoring-status"
              payload: { action: "SUSPEND", reason: "Sampling crew retraining" }
              as: UtilityAdmin
          trigger:
            - call: "POST /entry-points/${ep_id}/monitoring-status"
              payload: { action: "RESUME" }
              as: UtilityAdmin
          assert:
            - "HTTP status is 200"
            - "EntryPoint.${ep_id}.monitoring_status == QUARTERLY"
            - "EntryPoint.${ep_id}.consecutive_invalidated_samples == 0"
            - "EntryPoint.${ep_id}.accepted_result_count == 0"
            - "EntryPoint.${ep_id}.compliance_posture == COMPLIANT"
            - "Sample.${s_id}.status == INVALIDATED"
            - "Sample.${s_id}.invalidation_reason == CHAIN_OF_CUSTODY_BROKEN"

      - name: sample_reaches_analyzed_when_the_last_panel_result_is_accepted
        claim_type: valid_transition
        grounds:
          - state_machines.Sample.transitions.RECEIVED_to_ANALYZED
        excluded_because:
          difficulty_instance: transitive_cascade / accepting_a_high_result_cascades_through_sample_entry_point_and_mandated_evaluation
          rationale: "That instance asserts the RECEIVED -> ANALYZED leg as cascade depth 1 of the four-level chain, including the panel-completeness precondition."

      - name: accepted_results_become_superseded_when_their_sample_is_invalidated
        claim_type: side_effect_execution
        grounds:
          - state_machines.LabResult.transitions.ACCEPTED_to_SUPERSEDED
        excluded_because:
          difficulty_instance: transitive_cascade / invalidating_a_sample_cascades_supersede_and_deescalates_the_posture
          rationale: "That instance asserts the supersede side effect and the posture de-escalation it drives in one recipe."

      - name: a_rejected_review_returns_the_notification_to_draft
        claim_type: valid_transition
        grounds:
          - state_machines.PublicNotification.transitions.SUBMITTED_to_DRAFT
        excluded_because:
          difficulty_instance: non_linear_state_machine / notification_revision_cycle_clears_the_draft_and_increments_the_bounded_counter
          rationale: "The cyclic SUBMITTED -> DRAFT leg, the revision counter and the cleared content arrays are all asserted there."

      - name: funding_and_construction_dimensions_do_not_read_each_other
        claim_type: valid_transition
        grounds:
          - state_machines.CapitalProject.funding_status
          - state_machines.CapitalProject.construction_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / capital_project_funding_and_construction_dimensions_advance_independently
          rationale: "The two parallel dimensions and the single BIDDING gate where construction does read funding are asserted there."

  # ===========================================================================
  # Guide section 3 — Calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: waste_classification_thresholds_are_inclusive_lower_bounds
        claim_type: threshold_boundary
        grounds:
          - calculations.waste_classification
          - global_constants.LEACHATE_HAZARDOUS_NG_PER_L
          - global_constants.LEACHATE_SPECIAL_NG_PER_L
        distinguishing_aspect: "Four sibling manifests off one 800 kg pilot are classified at 500.0, 499.99, 50.00 and 49.99 ng/L, pinning both thresholds as inclusive lower bounds with the one-cent-of-concentration neighbours on the other side."
        test_recipe:
          setup:
            - "EntryPoint EPTDS-01, one TreatmentEvaluation with residuals_budget_cents 500000."
            - "One GAC pilot run in its May 2026 window and completed with spent_media_kg 800.00."
            - "Four DRAFT manifests of 100.00 kg GAC_CARBON each."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}", residuals_budget_cents: 500000 }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "GAC", window_start_at: "2026-05-01T00:00:00.000Z", window_end_at: "2026-05-15T00:00:00.000Z", ebct_min: 10.00, lifecycle_cost_cents: 2550000000, capital_cost_estimate_cents: 680000000, annual_om_estimate_cents: 31000000, residuals_burden_score: 62.00, footprint_score: 71.00, om_complexity_score: 83.00 }
              as: TreatmentEngineer
              captures: { pilot_id: "$.data.id" }
            - call: "POST /pilot-tests/${pilot_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${pilot_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 1.85, bed_volumes_treated: 25000.00, spent_media_kg: 800.00 }
              as: TreatmentEngineer
            - call: "POST /residuals-manifests"
              payload: { pilot_test_id: "${pilot_id}", media_type: "GAC_CARBON", mass_kg: 100.00 }
              as: TreatmentEngineer
              captures: { m1_id: "$.data.id" }
            - call: "POST /residuals-manifests"
              payload: { pilot_test_id: "${pilot_id}", media_type: "GAC_CARBON", mass_kg: 100.00 }
              as: TreatmentEngineer
              captures: { m2_id: "$.data.id" }
            - call: "POST /residuals-manifests"
              payload: { pilot_test_id: "${pilot_id}", media_type: "GAC_CARBON", mass_kg: 100.00 }
              as: TreatmentEngineer
              captures: { m3_id: "$.data.id" }
            - call: "POST /residuals-manifests"
              payload: { pilot_test_id: "${pilot_id}", media_type: "GAC_CARBON", mass_kg: 100.00 }
              as: TreatmentEngineer
              captures: { m4_id: "$.data.id" }
          trigger:
            - call: "POST /residuals-manifests/${m1_id}/classify"
              payload: { leachate_pfas_ng_per_l: 500.0 }
              as: StateRegulator
            - call: "POST /residuals-manifests/${m2_id}/classify"
              payload: { leachate_pfas_ng_per_l: 499.99 }
              as: StateRegulator
            - call: "POST /residuals-manifests/${m3_id}/classify"
              payload: { leachate_pfas_ng_per_l: 50.00 }
              as: StateRegulator
            - call: "POST /residuals-manifests/${m4_id}/classify"
              payload: { leachate_pfas_ng_per_l: 49.99 }
              as: StateRegulator
          assert:
            - "All four calls return HTTP 200"
            - "ResidualsManifest.${m1_id}.waste_classification == HAZARDOUS"
            - "ResidualsManifest.${m2_id}.waste_classification == SPECIAL_WASTE"
            - "ResidualsManifest.${m3_id}.waste_classification == SPECIAL_WASTE"
            - "ResidualsManifest.${m4_id}.waste_classification == NON_HAZARDOUS_SOLID"
            - "All four manifests have status == CLASSIFIED and disposal_cost_cents == null"
            - "PilotTest.${pilot_id}.spent_media_kg == 800.00"
            - "PilotTest.${pilot_id}.unmanifested_media_kg == 400.00"
            - "PilotTest.${pilot_id}.removal_pct == 96.30"

      - name: disposal_cost_uses_the_per_method_rate_from_the_constants_table
        claim_type: constants_applied
        grounds:
          - calculations.waste_classification.formula.disposal_cost_cents
          - global_constants.DISPOSAL_RATE_CENTS_PER_KG
          - state_machines.ResidualsManifest.transitions.CLASSIFIED_to_SHIPPED.side_effects
        distinguishing_aspect: "The rate is looked up by disposal_method, not by classification: 300.00 kg of SPECIAL_WASTE resin shipped to REACTIVATION costs 300 * 95 = 28500 cents, and exactly that integer lands in the evaluation's residuals_spent_cents ledger."
        test_recipe:
          setup:
            - "EntryPoint EPTDS-01, one TreatmentEvaluation with residuals_budget_cents 500000 and residuals_spent_cents 0."
            - "One IX pilot completed with spent_media_kg 300.00, one 300.00 kg IX_RESIN manifest classified at leachate 60.00 (SPECIAL_WASTE)."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}", residuals_budget_cents: 500000 }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "IX", window_start_at: "2026-05-17T00:00:00.000Z", window_end_at: "2026-05-31T00:00:00.000Z", ebct_min: 3.00, lifecycle_cost_cents: 1800000000, capital_cost_estimate_cents: 520000000, annual_om_estimate_cents: 28000000, residuals_burden_score: 40.00, footprint_score: 85.00, om_complexity_score: 70.00 }
              as: TreatmentEngineer
              captures: { pilot_id: "$.data.id" }
            - call: "POST /pilot-tests/${pilot_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${pilot_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 4.00, bed_volumes_treated: 18000.00, spent_media_kg: 300.00 }
              as: TreatmentEngineer
            - call: "POST /residuals-manifests"
              payload: { pilot_test_id: "${pilot_id}", media_type: "IX_RESIN", mass_kg: 300.00 }
              as: TreatmentEngineer
              captures: { m_id: "$.data.id" }
            - call: "POST /residuals-manifests/${m_id}/classify"
              payload: { leachate_pfas_ng_per_l: 60.00 }
              as: StateRegulator
          trigger:
            - call: "POST /residuals-manifests/${m_id}/ship"
              payload: { disposal_method: "REACTIVATION", carrier_ref: "HAULER-4417" }
              as: TreatmentEngineer
          assert:
            - "HTTP status is 200"
            - "ResidualsManifest.${m_id}.status == SHIPPED"
            - "ResidualsManifest.${m_id}.waste_classification == SPECIAL_WASTE"
            - "ResidualsManifest.${m_id}.disposal_method == REACTIVATION"
            - "ResidualsManifest.${m_id}.disposal_cost_cents == 28500"
            - "TreatmentEvaluation.${eval_id}.residuals_spent_cents == 28500"
