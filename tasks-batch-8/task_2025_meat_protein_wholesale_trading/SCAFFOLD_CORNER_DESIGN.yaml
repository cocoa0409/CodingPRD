            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: DeskAdmin }
            - { call: "POST /api/purchase-orders", payload: { po_number: "PO-OC1", supplier_id: "${sup_id}", product_id: "${rib_id}", ordered_weight_lbs: 500, contract_price_per_cwt_cents: 20000, required_delivery_date: "2026-08-04" }, as: Trader, captures: { po_id: "$.data.id" } }
            - { call: "POST /api/purchase-orders/${po_id}/receive", payload: { received_weight_lbs: 500, warehouse_id: "${wh_id}", lot_code: "LOT-OC1", production_date: "2026-08-01" }, as: WarehouseOperator }
            - { call: "GET /api/inventory-lots?po_id=${po_id}", payload: {}, as: DeskAdmin, captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /api/inventory-lots/${lot_id}/inspect", payload: { measured_fat_pct: 10.0 }, as: QualityGrader }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 100 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { alloc_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer }
            - { call: "POST /api/shipments", payload: { allocation_id: "${alloc_id}", carrier_name: "CAR-1", trailer_temp_setpoint_f: 36.0, shipped_lbs: 100 }, as: WarehouseOperator, captures: { ship_id: "$.data.id" } }
            - { call: "POST /api/shipments/${ship_id}/temperature-readings", payload: { reading_f: 37.0, recorded_at: "2026-08-03T08:00:00Z" }, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/depart", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/shipments/${ship_id}/deliver", payload: {}, as: CustomerRep, as_user_id: "${cust_id}" }
            - { call: "POST /api/claims", payload: { shipment_id: "${ship_id}", claim_type: "QUALITY_DEFECT", claimed_amount_cents: 5000 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { claim_id: "$.data.id", claim_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/claims/${claim_id}/offers", payload: { offer_cents: 4000, expected_claim_version: "${claim_v}" }, as: ClaimsAdjuster, captures: { v2: "$.data.version" } }
            - { call: "POST /api/claims/${claim_id}/offers", payload: { offer_cents: 4500, expected_claim_version: "${claim_v}" }, as: ClaimsAdjuster, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/claims/${claim_id}/offers", payload: { offer_cents: 4500, expected_claim_version: "${v2}" }, as: ClaimsAdjuster, captures: { v3: "$.data.version" } }
          assert:
            - "First offer succeeds: ${v2} == 2 and status OFFER_MADE"
            - "Stale replay with version 1: ${err} == ERR_STALE_CLAIM_VERSION (http 412)"
            - "Correct current version succeeds: ${v3} == 3 and current_offer_cents == 4500"

      - name: occ_contract_amend_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-amend-stale-version]", "errors[ERR_STALE_CONTRACT_VERSION]"]
        distinguishing_aspect: "OCC on ForwardContract.version: a second sequential amendment carrying the stale pre-amendment version fails ERR_STALE_CONTRACT_VERSION (412) even though the contract is still OPEN."
        test_recipe:
          setup: ["FC-OCC OPEN at version 1"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-OCC", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer OCC", customer_code: "CUST-OCC", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/forward-contracts", payload: { contract_number: "FC-OCC", customer_id: "${cust_id}", product_id: "${rib_id}", committed_lbs: 100, fixed_price_per_lb_cents: 650, delivery_week_start: "2026-08-03" }, as: Trader, captures: { fc_id: "$.data.id", fc_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/forward-contracts/${fc_id}/amend", payload: { committed_lbs: 200, fixed_price_per_lb_cents: 640, delivery_week_start: "2026-08-03", expected_contract_version: "${fc_v}" }, as: Trader, captures: { v2: "$.data.version" } }
            - { call: "POST /api/forward-contracts/${fc_id}/amend", payload: { committed_lbs: 300, fixed_price_per_lb_cents: 630, delivery_week_start: "2026-08-03", expected_contract_version: "${fc_v}" }, as: Trader, captures: { err: "$.data.error_id" } }
          assert:
            - "First amend succeeds: ${v2} == 2 and amendment_round == 1 and committed_lbs == 200"
            - "Stale amend: ${err} == ERR_STALE_CONTRACT_VERSION (http 412); committed_lbs stays 200, amendment_round stays 1"

      - name: clock_default_is_fixed_startup_time
        claim_type: scheduled_actions
        grounds: [endpoints]
        distinguishing_aspect: "Without any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z: a sheet published first thing carries published_at == 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["DRAFT sheet with one line; clock never set"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-CK", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 10000 }, as: Trader }
          trigger:
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin, captures: { pub_at: "$.data.published_at" } }
          assert:
            - "${pub_at} == 2026-08-01T00:00:00Z (fixed default, not wall-clock)"

      - name: run_allocation_rerun_idempotent
        claim_type: derived_field_reconciliation
        grounds: [calculations.allocation_waterfall]
        distinguishing_aspect: "Ops-run checkpoint: run-allocation only processes REQUESTED allocations — a second run is a no-op (confirmed_count 0) and previously granted allocated_lbs/exposure values are unchanged."
        test_recipe:
          setup: ["PUBLISHED sheet; one allocation CONFIRMED by a first run"]
          setup_api_calls:
            - { call: "POST /api/products", payload: { product_code: "RIBEYE-RR2", kind: "PRIMAL", species: "BEEF", max_fat_pct: 12.0, shelf_life_days: 21, required_temp_max_f: 40 }, as: DeskAdmin, captures: { rib_id: "$.data.id" } }
            - { call: "POST /api/customers", payload: { name: "Buyer RR2", customer_code: "CUST-RR2", credit_limit_cents: 100000000, allocation_tier: "TIER_1" }, as: DeskAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /api/price-sheets", payload: { week_start_date: "2026-08-03" }, as: Trader, captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/lines", payload: { product_id: "${rib_id}", price_per_lb_cents: 700, weekly_supply_lbs: 10000 }, as: Trader, captures: { line_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/publish", payload: {}, as: DeskAdmin }
            - { call: "POST /api/allocations", payload: { customer_id: "${cust_id}", price_sheet_line_id: "${line_id}", requested_lbs: 100 }, as: CustomerRep, as_user_id: "${cust_id}", captures: { alloc_id: "$.data.id" } }
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer, captures: { run1: "$.data.confirmed_count" } }
          trigger:
            - { call: "POST /api/price-sheets/${s1_id}/run-allocation", payload: {}, as: RiskOfficer, captures: { run2_conf: "$.data.confirmed_count", run2_short: "$.data.shortfall_count" } }
          assert:
            - "${run1} == 1 and ${run2_conf} == 0 and ${run2_short} == 0"
            - "Allocation.${alloc_id}.allocated_lbs == 100 and status == CONFIRMED (unchanged)"
            - "PriceSheetLine.${line_id}.allocated_lbs == 100 (no double-grant)"

      - name: line_allocated_lbs_reconciliation
        claim_type: derived_field_reconciliation
        grounds: [entities.PriceSheetLine.fields.allocated_lbs]
        excluded_because:
          difficulty_instance: allocation_confirm_cancel_exposure_conservation
          rationale: "Confirm->cancel reconciliation of allocated_lbs and exposure asserted there with exact literals."

