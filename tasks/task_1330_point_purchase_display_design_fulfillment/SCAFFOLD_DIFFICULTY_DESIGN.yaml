  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: program_cancel_rejects_designs_conserves_design_count
        grounds:
          - state_machines.RetailerProgram.DRAFT_to_CANCELLED
          - state_machines.RetailerProgram.DESIGN_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: total number of DisplayDesign entities for the
          program. Forward action (create designs) + compensating action (cancel
          program) must leave the count unchanged — designs transition state but
          are never deleted.
        test_recipe:
          setup:
            - "Program in DESIGN with 2 non-terminal designs"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /pop/programs"
              payload: { client_id: "${client_id}", retailer_name: "BigBox", program_name: "Summer", store_count: 200, program_revenue_cents: 12000000 }
              as: ProgramManager
              captures: { program_id: $.data.id }
            - call: "POST /pop/programs/${program_id}/compliance-rules"
              payload: { program_id: "${program_id}", dimension: "MAX_WIDTH_IN", limit_value: "48" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/start-design"
              payload: {}
              as: ProgramManager
            - call: "POST /pop/designs"
              payload: { program_id: "${program_id}", design_code: "D1", width_in: 40, height_in: 60, depth_in: 24, weight_lb: 30, material: "CORRUGATE" }
              as: Designer
            - call: "POST /pop/designs"
              payload: { program_id: "${program_id}", design_code: "D2", width_in: 42, height_in: 62, depth_in: 26, weight_lb: 32, material: "ACRYLIC" }
              as: Designer
          trigger:
            - call: "POST /pop/programs/${program_id}/cancel"
              payload: {}
              as: ProgramManager
          assert:
            - "GET /pop/programs/${program_id}/designs returns 2 designs"
            - "every returned design.status == REJECTED"
            - "design count is conserved (2 before cancel, 2 after)"
      - name: damage_claim_reject_conserves_kit_count_and_status
        grounds:
          - state_machines.DamageClaim.REPORTED_to_REJECTED
        distinguishing_aspect: |
          Conserved quantity: Kit.status and total kit count. A rejected damage
          claim must NOT mutate the parent kit — different conserved quantity
          (kit state cardinality) from the design-count invariant.
        test_recipe:
          setup:
            - "Kit in DELIVERED status with a REPORTED damage claim"
          setup_api_calls:
            - call: "POST /pop/clients"
