            - { call: "GET /pyro/displays/${e1}", payload: {}, as: SystemAdmin, captures: { e1_status: $.data.status, e1_reason: $.data.cancellation_reason } }
            - { call: "GET /pyro/displays/${e2}", payload: {}, as: SystemAdmin, captures: { e2_status: $.data.status } }
