              payload: { patient_id: "${p_id}", test_type: "EXERCISE", spo2_percent: 86, tested_at: "2026-08-01T00:00:00Z", ordering_physician_npi: "1234567893" }
              as: IntakeCoordinator
              captures: { e_test: $.data.error_id }
          assert:
            - "${e_active_service} == ERR_PATIENT_HAS_ACTIVE_SERVICE (409): the contract is PENDING_SETUP, one of the three blocking service states"
            - "The failing setup drives service_status to SETUP_FAILED (a terminal service state) and billing_status to SUSPENDED with suspension_reason SETUP_FAILED"
            - "${d_status} == DISCHARGED; RentalContract.${c_id}.billing_status == CLOSED, CertificateOfMedicalNecessity.${cmn_id}.status == VOIDED with void_reason \"PATIENT_DISCHARGED\", and Patient.${p_id}.current_cmn_status == VOIDED"
            - "${e_rediscarge} == ERR_INVALID_STATE (409): DISCHARGED is the Patient machine's only terminal state"
            - "${e_transfer} == ERR_INVALID_STATE (409): transfer-requests is declared only from ACTIVE and is not on the priority-33 endpoint list"
            - "${e_test} == ERR_PATIENT_NOT_ACTIVE (409): priority 33 answers for the create endpoints that ARE on its list, so the two guards are distinguishable"

      - name: transfer_pending_cycle_completes_then_cancels
        claim_type: valid_transition
        grounds:
          - state_machines[entity=Patient].transitions[ACTIVE->TRANSFER_PENDING]
          - state_machines[entity=Patient].transitions[TRANSFER_PENDING->ACTIVE]
          - validations[priority=41]
          - validations[priority=65]
          - validations[priority=77]
        distinguishing_aspect: |
          The transfer cycle has two distinct return edges, and they differ in exactly one field:
          complete moves branch_id to the receiving branch, cancel leaves it alone. Both clear the
          two transfer fields and both lift the TRANSFER suspension.
        test_recipe:
          setup:
            - "Two branches (Tampa Bay and Sarasota, both FL), one ACTIVE certificate at Tampa Bay and one ACCRUING / PENDING_SETUP contract. Clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
