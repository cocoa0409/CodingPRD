  - name: sub_block_plans_must_fit_inside_the_parent_night_by_night
    claim_type: aggregate_validation
    grounds:
    - validations[priority=20]
    - validations[priority=30]
    - errors[ERR_SUB_BLOCK_DATES_OUTSIDE_PARENT]
    - errors[ERR_SUB_BLOCK_ALLOTMENT_EXCEEDED]
