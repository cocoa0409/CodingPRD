      - name: leg_posture_becomes_restricted_when_booked_load_reaches_ninety_percent
        claim_type: constants_applied
        grounds:
          - calculations.leg_posture_derivation
          - entities.FlightLeg.fields.booked_checked_count
        distinguishing_aspect: "The RESTRICTED test is the integer cross-multiplication booked * 10 >= limit * 9: with checked_animal_limit 2, one booking gives 10 >= 18 false so the leg stays OPEN, and the second booking gives 20 >= 18 true so posture flips to RESTRICTED without any embargo rule existing."
        test_recipe:
          setup:
            - "AN101 HKG->LAX with checked_animal_limit 2 and no TemperatureEmbargoRule in the database"
            - "Two CHECKED reservations, each with one animal; the first animal already holds a RESERVED sequence-1 segment, so booked_checked_count is 1 and posture is still OPEN"
