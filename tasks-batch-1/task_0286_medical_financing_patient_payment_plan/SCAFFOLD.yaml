# =============================================================================
# PRD Benchmark Scaffold — Medical Financing / Patient Payment Plan
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  Medical Financing / Patient Payment Plan (CareCredit style): provider enrollment,
  patient credit application, promotional deferred-interest plan, recurring autopay,
  deferred-interest accrual/forfeit, settlement to provider, delinquency, refund/void

domain_name: medical-financing-patient-payment-plan
api_prefix: /

# Flat topology: every business entity is a peer top-level collection (/providers,
# /accounts, /credit-applications, /promotional-plans, /provider-promotions,
# /financed-purchases, /payments, /settlements, /statements, /refunds,
# /autopay-enrollments) linked by foreign keys in the request/response body.
# api_prefix is the root "/" because the collections are siblings, not nested under
# any single resource.

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # All business entities are peer top-level collections joined by FK fields in
  # the request/response body — no parent ids appear as URL path segments except
  # the provider-scoped promotion-applicability sub-resource. Chosen to PRIORITIZE
  # the under-represented flat topology.

  state_machine_shape: parallel
  # FinancedPurchase carries two independent state axes (settlement_status ×
  # promo_status); PatientAccount is cyclic (ACTIVE↔DELINQUENT, →DEFAULTED).

  relationship_patterns:
    - one_to_many        # PatientAccount 1—* FinancedPurchase, 1—* Payment, 1—* BillingStatement
    - flat_with_references  # FinancedPurchase references Provider, PatientAccount, PromotionalPlan by FK
    - cross_aggregate    # Refund (on a purchase) reaches across to Settlement and PatientAccount

  role_model: peer_roles
  # Provider owns enrollment/purchase/refund; Patient owns account/payment/autopay;
  # PlatformAdmin (financier) underwrites, settles, and runs the billing cycle.

  consistency_model: immediate
  # All cascades (refund→clawback→credit-restore→delinquency-cure, promo-expiry→
  # interest-forfeit→balance-increase) complete atomically within the triggering
  # request or the clock-advance request that fires them.

# =============================================================================
# 1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Provider/clinic legal name" }
      - { name: specialty, type: enum, source: input, description: "DENTAL | VISION | VETERINARY | DERMATOLOGY | GENERAL", constraints: "one of the five enum members" }
      - { name: tax_id, type: string, source: input, description: "Provider tax identifier; unique among non-terminated providers" }
      - { name: base_merchant_discount_rate, type: number, source: input, description: "Floor merchant discount fraction applied to settlements, e.g. 0.085", constraints: "0 <= base_merchant_discount_rate <= 0.30" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | ENROLLED | SUSPENDED | TERMINATED" }
      - { name: monthly_settled_volume_cents, type: integer, source: computed, default: 0, description: "Sum of Settlement.gross_cents with status PAID settled in the current clock month for this provider; resets each month boundary; drives the volume-tier discount in settlement_fee calc" }
      - { name: settled_net_cents, type: integer, source: computed, default: 0, description: "Net cash position: sum(Settlement.net_cents WHERE status=PAID) - sum(Settlement.net_cents WHERE status=CLAWED_BACK) for this provider" }

  - name: PromotionalPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Promo plan display name, e.g. '12-Month No-Interest'" }
      - { name: plan_category, type: enum, source: input, description: "DEFERRED_INTEREST | EQUAL_PAYMENT | REDUCED_APR", constraints: "one of the three enum members" }
      - { name: deferred_period_months, type: integer, source: input, description: "Length of the promotional window in whole months", constraints: "1 <= deferred_period_months <= 60" }
      - { name: promo_apr, type: number, source: input, description: "Annual deferred-interest rate charged retroactively on forfeit, e.g. 0.2699", constraints: "0 <= promo_apr <= 0.3599" }
      - { name: min_payment_factor, type: number, source: input, description: "Fraction of outstanding purchase principal due each cycle as the minimum, e.g. 0.0333", constraints: "0 < min_payment_factor <= 1" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | RETIRED" }

  - name: ProviderPromotion
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the enrolling provider" }
      - { name: promotional_plan_id, type: string, source: input, description: "FK -> PromotionalPlan.id; the offered plan" }
      - { name: effective_start, type: datetime, source: input, description: "Half-open window start (inclusive) during which this provider may originate purchases under the plan" }
      - { name: effective_end, type: datetime, source: input, description: "Half-open window end (exclusive); must be strictly after effective_start" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | WITHDRAWN" }

  - name: CreditApplication
    parent: null
    common_fields: true
    fields:
      - { name: applicant_full_name, type: string, source: input, description: "Patient legal name" }
      - { name: applicant_ssn_last4, type: string, source: input, description: "Last four digits of SSN; unique among applications not in DECLINED" }
      - { name: stated_annual_income_cents, type: integer, source: input, description: "Self-reported annual income in cents", constraints: ">= 0" }
      - { name: requested_limit_cents, type: integer, source: input, description: "Credit line the applicant requests in cents", constraints: "> 0" }
      - { name: provisional_limit_cents, type: integer, source: computed, description: "Pre-qualification estimate computed at submission via credit_decision provisional variant" }
      - { name: approved_limit_cents, type: integer, source: computed, default: null, description: "Final approved line computed at the APPROVE transition via credit_decision final variant; null until decided" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | APPROVED | DECLINED" }
      - { name: patient_account_id, type: string, source: system, default: null, description: "FK -> PatientAccount.id; the account minted on APPROVE (null until approved)" }

  - name: PatientAccount
    parent: null
    common_fields: true
    fields:
      - { name: credit_application_id, type: string, source: input, description: "FK -> CreditApplication.id; the approved application that minted this account" }
      - { name: account_holder_name, type: string, source: system, description: "Copied from the application's applicant_full_name" }
      - { name: credit_limit_cents, type: integer, source: system, description: "Copied from CreditApplication.approved_limit_cents at activation; immutable thereafter" }
      - { name: current_balance_cents, type: integer, source: computed, default: 0, description: "Outstanding principal + posted deferred interest - applied payments across all non-reversed FinancedPurchases and Payments" }
      - { name: available_credit_cents, type: integer, source: computed, description: "credit_limit_cents - sum(open FinancedPurchase principal_cents); restored on refund/void" }
      - { name: delinquency_strikes, type: integer, source: computed, default: 0, description: "Count of consecutive BillingStatements with min_payment_satisfied=false; reset to 0 when a statement is satisfied" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DELINQUENT | DEFAULTED | CLOSED" }

  - name: AutopayEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: patient_account_id, type: string, source: input, description: "FK -> PatientAccount.id; the account autopay draws from" }
      - { name: funding_token, type: string, source: input, description: "Opaque tokenized bank/card handle the financier debits" }
      - { name: draft_day_of_month, type: integer, source: input, description: "Day of month autopay attempts the minimum payment", constraints: "1 <= draft_day_of_month <= 28" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | PAUSED | REVOKED" }

  - name: FinancedPurchase
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the originating provider" }
      - { name: patient_account_id, type: string, source: input, description: "FK -> PatientAccount.id; the financed account" }
      - { name: provider_promotion_id, type: string, source: input, description: "FK -> ProviderPromotion.id; the promo enrollment governing terms" }
      - { name: principal_cents, type: integer, source: input, description: "Amount financed in cents", constraints: "> 0" }
      - { name: promo_start, type: datetime, source: system, description: "Clock value at authorization; start of the deferred-interest window" }
      - { name: promo_end, type: datetime, source: system, description: "promo_start + PromotionalPlan.deferred_period_months months; deferred interest is forfeited if principal not fully paid strictly before this instant" }
      - { name: principal_paid_cents, type: integer, source: computed, default: 0, description: "Cumulative payment principal allocated to this purchase" }
      - { name: deferred_interest_posted_cents, type: integer, source: computed, default: 0, description: "Retroactive interest posted to balance on INTEREST_FORFEITED; 0 while DEFERRED or if PAID_IN_FULL" }
      - { name: settlement_status, type: enum, source: system, default: AUTHORIZED, description: "AUTHORIZED | SETTLED | REFUNDED | VOID  (settlement axis)" }
      - { name: promo_status, type: enum, source: system, default: DEFERRED, description: "DEFERRED | PAID_IN_FULL | INTEREST_FORFEITED  (promo axis, independent of settlement axis)" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: financed_purchase_id, type: string, source: input, description: "FK -> FinancedPurchase.id; the purchase being settled" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; copied from the purchase" }
      - { name: gross_cents, type: integer, source: system, description: "Equals FinancedPurchase.principal_cents at settlement time" }
      - { name: discount_rate_applied, type: number, source: computed, description: "Effective merchant discount fraction after volume-tier adjustment (settlement_fee calc)" }
      - { name: discount_fee_cents, type: integer, source: computed, description: "round_half_up(gross_cents * discount_rate_applied)" }
      - { name: net_cents, type: integer, source: computed, description: "gross_cents - discount_fee_cents; paid to the provider" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | PAID | CLAWED_BACK" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: patient_account_id, type: string, source: input, description: "FK -> PatientAccount.id; the account credited" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents", constraints: "> 0" }
      - { name: payment_type, type: enum, source: input, description: "AUTOPAY | MANUAL | PAYOFF", constraints: "one of the three enum members" }
      - { name: posted_at, type: datetime, source: system, description: "Clock value when the payment posted; drives chronological allocation order" }
      - { name: allocation, type: array, source: computed, description: "Ordered list of {financed_purchase_id, principal_applied_cents, interest_applied_cents} produced by payment_allocation calc" }
      - { name: status, type: enum, source: system, default: POSTED, description: "POSTED | REVERSED" }

  - name: BillingStatement
    parent: null
    common_fields: true
    fields:
      - { name: patient_account_id, type: string, source: input, description: "FK -> PatientAccount.id; the billed account" }
      - { name: period_start, type: datetime, source: system, description: "Closed-interval cycle start (inclusive); equals prior statement's period_end + 1 day, or account activation for the first" }
      - { name: period_end, type: datetime, source: system, description: "Closed-interval cycle end (inclusive); statement_date" }
      - { name: opening_balance_cents, type: integer, source: system, description: "current_balance_cents snapshot at period_start" }
      - { name: minimum_payment_due_cents, type: integer, source: computed, description: "Per-purchase minimum summed via minimum_payment calc, capped at the closing balance" }
      - { name: amount_paid_in_cycle_cents, type: integer, source: computed, default: 0, description: "Sum of POSTED Payment.amount_cents posted within [period_start, period_end]" }
      - { name: min_payment_satisfied, type: boolean, source: computed, description: "amount_paid_in_cycle_cents >= minimum_payment_due_cents" }
      - { name: due_date, type: datetime, source: system, description: "period_end + grace days; delinquency assessed at cycle close" }

  - name: Refund
    parent: null
    common_fields: true
    fields:
      - { name: financed_purchase_id, type: string, source: input, description: "FK -> FinancedPurchase.id; the purchase being refunded or voided" }
      - { name: refund_kind, type: enum, source: input, description: "VOID | REFUND; VOID only allowed pre-settlement, REFUND only post-settlement", constraints: "one of the two enum members" }
      - { name: amount_cents, type: integer, source: input, description: "Refund amount in cents; must equal the purchase principal_cents (full refund only)" }
      - { name: status, type: enum, source: system, default: APPLIED, description: "APPLIED (terminal)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Provider
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ENROLLED
        trigger: "POST /providers/{id}/enroll"
        actor: PlatformAdmin
        preconditions: ["provider.status == PENDING"]
        side_effects: ["set status=ENROLLED", "increments Provider.version by 1"]
      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /providers/{id}/suspend"
        actor: PlatformAdmin
        preconditions: ["provider.status == ENROLLED"]
        side_effects: ["set status=SUSPENDED", "increments Provider.version by 1"]
        note: "Suspended providers may not originate new FinancedPurchases (cross-entity precondition on AUTHORIZE) and pending Settlements may not be PAID."
      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /providers/{id}/enroll"
        actor: PlatformAdmin
        preconditions: ["provider.status == SUSPENDED"]
        side_effects: ["set status=ENROLLED", "increments Provider.version by 1"]
        note: "Reinstatement — makes the Provider→ENROLLED axis cyclic (ENROLLED↔SUSPENDED)."
      - from: ENROLLED
        to: TERMINATED
        trigger: "POST /providers/{id}/terminate"
        actor: PlatformAdmin
        preconditions: ["provider.status == ENROLLED", "no FinancedPurchase for this provider has settlement_status==AUTHORIZED"]
        side_effects: ["set status=TERMINATED", "increments Provider.version by 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /providers/{id}/terminate"
        actor: PlatformAdmin
        preconditions: ["provider.status == SUSPENDED", "no FinancedPurchase for this provider has settlement_status==AUTHORIZED"]
        side_effects: ["set status=TERMINATED", "increments Provider.version by 1"]

  - entity: PromotionalPlan
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /promotional-plans/{id}/activate"
        actor: PlatformAdmin
        preconditions: ["plan.status == DRAFT"]
        side_effects: ["set status=ACTIVE", "increments PromotionalPlan.version by 1"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /promotional-plans/{id}/retire"
        actor: PlatformAdmin
        preconditions: ["plan.status == ACTIVE"]
        side_effects: ["set status=RETIRED", "increments PromotionalPlan.version by 1"]
        note: "Retiring does not withdraw existing ProviderPromotions; it only blocks new ProviderPromotion creation."

  - entity: ProviderPromotion
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /provider-promotions/{id}/withdraw"
        actor: PlatformAdmin
        preconditions: ["provider_promotion.status == ACTIVE"]
        side_effects: ["set status=WITHDRAWN", "increments ProviderPromotion.version by 1"]
        note: "Withdrawal blocks new purchases under this enrollment; in-flight purchases keep their pinned promo_end."

  - entity: CreditApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DECLINED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /credit-applications/{id}/approve"
        actor: PlatformAdmin
        preconditions: ["application.status == SUBMITTED", "credit_decision final variant yields approved_limit_cents > 0"]
        side_effects:
          - "compute approved_limit_cents via credit_decision final variant and store it"
          - "mint a PatientAccount with status=ACTIVE, credit_limit_cents=approved_limit_cents, available_credit_cents=approved_limit_cents, current_balance_cents=0, delinquency_strikes=0"
          - "set patient_account_id to the minted account id"
          - "set status=APPROVED"
          - "increments CreditApplication.version by 1"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /credit-applications/{id}/decline"
        actor: PlatformAdmin
        preconditions: ["application.status == SUBMITTED"]
        side_effects: ["set approved_limit_cents=0", "set status=DECLINED", "increments CreditApplication.version by 1"]
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /credit-applications/{id}/approve (auto-decline path)"
        actor: PlatformAdmin
        preconditions: ["application.status == SUBMITTED", "credit_decision final variant yields approved_limit_cents == 0"]
        side_effects: ["set approved_limit_cents=0", "set status=DECLINED", "increments CreditApplication.version by 1"]
        note: "When the final underwriting variant computes a zero line, approve resolves to DECLINED rather than minting an account."

  - entity: PatientAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system: POST /_cycle/close_statement closing a statement with min_payment_satisfied==false"
        actor: system
        preconditions: ["account.status == ACTIVE", "the just-closed BillingStatement.min_payment_satisfied == false", "resulting delinquency_strikes in {1,2}"]
        side_effects: ["increment delinquency_strikes by 1", "set status=DELINQUENT"]
      - from: DELINQUENT
        to: DELINQUENT
        trigger: "system: POST /_cycle/close_statement closing another unsatisfied statement"
        actor: system
        preconditions: ["account.status == DELINQUENT", "the just-closed BillingStatement.min_payment_satisfied == false", "resulting delinquency_strikes in {1,2}"]
        side_effects: ["increment delinquency_strikes by 1"]
      - from: DELINQUENT
        to: ACTIVE
        trigger: "system: POST /_cycle/close_statement closing a satisfied statement, OR POST /payments curing the open delinquency"
        actor: system
        preconditions: ["account.status == DELINQUENT", "the just-closed BillingStatement.min_payment_satisfied == true (or a payment lifts amount_paid_in_cycle to satisfy the open statement)"]
        side_effects: ["reset delinquency_strikes to 0", "set status=ACTIVE"]
        note: "Cure loop — makes PatientAccount cyclic (ACTIVE↔DELINQUENT)."
      - from: DELINQUENT
        to: DEFAULTED
        trigger: "system: POST /_cycle/close_statement closing an unsatisfied statement that raises strikes to 3"
        actor: system
        preconditions: ["account.status == DELINQUENT", "the just-closed BillingStatement.min_payment_satisfied == false", "resulting delinquency_strikes == 3"]
        side_effects: ["increment delinquency_strikes to 3", "set status=DEFAULTED", "for every AutopayEnrollment on this account with status==ACTIVE set status=REVOKED"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: Patient
        preconditions: ["account.status == ACTIVE", "current_balance_cents == 0", "no FinancedPurchase on this account has settlement_status==AUTHORIZED"]
        side_effects: ["set status=CLOSED", "for every AutopayEnrollment on this account with status in {ACTIVE,PAUSED} set status=REVOKED", "increments PatientAccount.version by 1"]

  - entity: AutopayEnrollment
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /autopay-enrollments/{id}/pause"
        actor: Patient
        preconditions: ["autopay.status == ACTIVE"]
        side_effects: ["set status=PAUSED", "increments AutopayEnrollment.version by 1"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /autopay-enrollments/{id}/resume"
        actor: Patient
        preconditions: ["autopay.status == PAUSED", "parent PatientAccount.status in {ACTIVE, DELINQUENT}"]
        side_effects: ["set status=ACTIVE", "increments AutopayEnrollment.version by 1"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /autopay-enrollments/{id}/revoke (or cascade from account close/default)"
        actor: Patient
        preconditions: ["autopay.status in {ACTIVE, PAUSED}"]
        side_effects: ["set status=REVOKED", "increments AutopayEnrollment.version by 1"]

  - entity: FinancedPurchase
    initial_state: "settlement_status=AUTHORIZED, promo_status=DEFERRED"
    terminal_states: ["settlement_status in {REFUNDED, VOID}"]
    transitions:
      # --- settlement axis ---
      - from: "settlement_status=AUTHORIZED"
        to: "settlement_status=SETTLED"
        trigger: "POST /financed-purchases/{id}/settle"
        actor: PlatformAdmin
        preconditions:
          - "purchase.settlement_status == AUTHORIZED"
          - "Provider.status == ENROLLED (cross-entity)"
          - "PatientAccount.status in {ACTIVE, DELINQUENT} (cross-entity)"
        side_effects:
          - "create a Settlement with gross_cents=principal_cents, compute discount_rate_applied + discount_fee_cents + net_cents via settlement_fee calc, status=PENDING"
          - "set purchase.settlement_status=SETTLED"
          - "increments FinancedPurchase.version by 1"
      - from: "settlement_status=AUTHORIZED"
        to: "settlement_status=VOID"
        trigger: "POST /refunds with refund_kind=VOID"
        actor: Provider
        preconditions: ["purchase.settlement_status == AUTHORIZED", "refund.amount_cents == purchase.principal_cents"]
        side_effects:
          - "create Refund(status=APPLIED)"
          - "set purchase.settlement_status=VOID"
          - "restore PatientAccount.available_credit_cents by principal_cents (credit-conservation invariant)"
          - "decrement PatientAccount.current_balance_cents by the purchase's unpaid principal (principal_cents - principal_paid_cents)"
          - "increments FinancedPurchase.version by 1"
        note: "VOID is the pre-settlement compensation; no Settlement exists yet so no clawback."
      - from: "settlement_status=SETTLED"
        to: "settlement_status=REFUNDED"
        trigger: "POST /refunds with refund_kind=REFUND"
        actor: Provider
        preconditions: ["purchase.settlement_status == SETTLED", "refund.amount_cents == purchase.principal_cents"]
        side_effects:
          - "create Refund(status=APPLIED)"
          - "set purchase.settlement_status=REFUNDED"
          - "the purchase's Settlement transitions PAID→CLAWED_BACK (or PENDING→CLAWED_BACK), reducing Provider.settled_net_cents by that Settlement.net_cents (cascade hop)"
          - "restore PatientAccount.available_credit_cents by principal_cents"
          - "decrement PatientAccount.current_balance_cents by the purchase's then-current outstanding (principal_cents - principal_paid_cents + deferred_interest_posted_cents)"
          - "if this decrement satisfies the open BillingStatement minimum and account.status==DELINQUENT, cure the account (DELINQUENT→ACTIVE) (cascade hop)"
          - "increments FinancedPurchase.version by 1"
        note: "REFUND is the post-settlement compensation; depth-3 cascade purchase→settlement→provider/account→delinquency."
      # --- promo axis (independent of settlement axis) ---
      - from: "promo_status=DEFERRED"
        to: "promo_status=PAID_IN_FULL"
        trigger: "system: POST /payments allocation that drives principal_paid_cents to principal_cents strictly before promo_end"
        actor: system
        preconditions: ["purchase.promo_status == DEFERRED", "principal_paid_cents == principal_cents", "current clock < promo_end"]
        side_effects: ["set promo_status=PAID_IN_FULL", "no deferred interest is ever posted for this purchase"]
      - from: "promo_status=DEFERRED"
        to: "promo_status=INTEREST_FORFEITED"
        trigger: "system: POST /_clock/advance crossing promo_end while principal_paid_cents < principal_cents"
        actor: system
        preconditions: ["purchase.promo_status == DEFERRED", "current clock >= promo_end", "principal_paid_cents < principal_cents", "purchase.settlement_status not in {REFUNDED, VOID}"]
        side_effects:
          - "compute deferred_interest_posted_cents via deferred_interest calc (chronological actual variant)"
          - "set promo_status=INTEREST_FORFEITED"
          - "increment PatientAccount.current_balance_cents by deferred_interest_posted_cents (cascade hop onto account)"

  - entity: Settlement
    initial_state: PENDING
    terminal_states: [CLAWED_BACK]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /settlements/{id}/pay"
        actor: PlatformAdmin
        preconditions: ["settlement.status == PENDING", "Provider.status == ENROLLED (cross-entity)"]
        side_effects:
          - "set status=PAID"
          - "increment Provider.settled_net_cents by net_cents"
          - "increment Provider.monthly_settled_volume_cents by gross_cents (for the current clock month)"
          - "increments Settlement.version by 1"
      - from: PENDING
        to: CLAWED_BACK
        trigger: "system: cascade from FinancedPurchase REFUND while Settlement still PENDING"
        actor: system
        preconditions: ["settlement.status == PENDING", "owning purchase transitioned SETTLED→REFUNDED"]
        side_effects: ["set status=CLAWED_BACK", "no Provider.settled_net_cents change (was never paid)"]
      - from: PAID
        to: CLAWED_BACK
        trigger: "system: cascade from FinancedPurchase REFUND while Settlement PAID"
        actor: system
        preconditions: ["settlement.status == PAID", "owning purchase transitioned SETTLED→REFUNDED"]
        side_effects: ["set status=CLAWED_BACK", "decrement Provider.settled_net_cents by net_cents", "decrement Provider.monthly_settled_volume_cents by gross_cents if the settlement was paid in the current clock month"]

  - entity: Payment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /payments/{id}/reverse"
        actor: PlatformAdmin
        preconditions: ["payment.status == POSTED", "payment.payment_type != PAYOFF"]
        side_effects:
          - "set status=REVERSED"
          - "for each allocation line, decrement that FinancedPurchase.principal_paid_cents by principal_applied_cents"
          - "increment PatientAccount.current_balance_cents by amount_cents"
          - "if any purchase was PAID_IN_FULL solely due to this payment and clock < promo_end, revert promo_status PAID_IN_FULL→DEFERRED"
          - "increments Payment.version by 1"
        note: "Compensation that must leave current_balance + sum(applied) invariant intact (balance-conservation)."

  - entity: BillingStatement
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system: POST /_cycle/close_statement"
        actor: system
        preconditions: ["statement.status == OPEN", "current clock >= statement.period_end"]
        side_effects:
          - "compute amount_paid_in_cycle_cents, minimum_payment_due_cents, min_payment_satisfied"
          - "drive the parent PatientAccount delinquency machine (strike / cure / default) per its transitions"
          - "open the next BillingStatement (period_start = period_end + 1 day)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: purchase-authorize-stale-account
    parent_entity: PatientAccount
    write_endpoint: "POST /financed-purchases"
    occ_field: "expected_patient_account_version"
    description: |
      Authorizing a new FinancedPurchase against a PatientAccount whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another writer has just authorized a purchase that legitimately
      consumed available credit (debiting available_credit_cents and bumping the
      account version), so the current writer's view of remaining credit is stale
      and its authorization must be re-evaluated against the new available credit.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: settle-stale-purchase
    parent_entity: FinancedPurchase
    write_endpoint: "POST /financed-purchases/{id}/settle"
    occ_field: "expected_financed_purchase_version"
    description: |
      Settling a FinancedPurchase whose version has advanced since the client
      last observed it is rejected. This captures the case where the purchase has
      already moved off AUTHORIZED (e.g., a void/refund or a prior settle bumped
      its version), so the client's intent to create a Settlement is based on a
      stale view of the purchase.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: credit_decision
    trigger: "provisional at POST /credit-applications (submission); final at POST /credit-applications/{id}/approve"
    algorithm: threshold
    formula: |
      # Provisional (estimate, at submission) — income-only, ignores network history:
      income_band_limit = floor(stated_annual_income_cents * INCOME_MULTIPLIER)   # 0.20 of income
      provisional_limit_cents = min(requested_limit_cents, income_band_limit, ABSOLUTE_CAP_CENTS)
      if provisional_limit_cents < MIN_VIABLE_LINE_CENTS: provisional_limit_cents = 0

      # Final (actual, at approval) — re-runs income band, then applies a network-history
      # haircut from the applicant's prior settled volume across the platform:
      base = min(requested_limit_cents, floor(stated_annual_income_cents * INCOME_MULTIPLIER), ABSOLUTE_CAP_CENTS)
      prior_default_count = count(PatientAccount WHERE account_holder_name == applicant_full_name AND status == DEFAULTED)
      haircut = base * DEFAULT_HAIRCUT_PER_PRIOR * min(prior_default_count, 3)   # 0.25 each, capped at 3
      approved_limit_cents = max(0, floor(base - haircut))
      if approved_limit_cents < MIN_VIABLE_LINE_CENTS: approved_limit_cents = 0
    input_set: "Single CreditApplication; final variant additionally scans PatientAccount rows by account_holder_name with status==DEFAULTED"
    constants:
      INCOME_MULTIPLIER: 0.20
      ABSOLUTE_CAP_CENTS: 2500000
      MIN_VIABLE_LINE_CENTS: 50000
      DEFAULT_HAIRCUT_PER_PRIOR: 0.25
    precision: "integer cents; floor() after each multiplication, round_half_up not needed (floor pinned)"
    variants:
      - name: provisional
        when: "computed at submission; stored in provisional_limit_cents"
        difference: "uses income band only; never inspects prior DEFAULTED accounts; never haircut-reduced"
      - name: final
        when: "computed at approve; stored in approved_limit_cents and copied to PatientAccount.credit_limit_cents"
        difference: "applies the prior-default haircut, so for an applicant with prior defaults final < provisional for identical income/request inputs"

  - name: deferred_interest
    trigger: "system: FinancedPurchase DEFERRED→INTEREST_FORFEITED when clock crosses promo_end with unpaid principal"
    algorithm: chronological
    formula: |
      # Chronological (actual) — the ONLY posted variant: interest accrues retroactively
      # on the ACTUAL outstanding principal balance walked day-by-day in payment order,
      # from promo_start through promo_end, at the daily promo rate.
      daily_rate = promo_apr / 360
      segments = ordered payment-allocation events for this purchase with posted_at in [promo_start, promo_end),
                 processed by posted_at ASC, ties broken by Payment.created_at ASC
      outstanding = principal_cents
      accrued = 0.0
      prev_t = promo_start
      for each segment at time t with principal_applied p:
          days = day_count(prev_t, t)                 # whole days, [prev_t, t)
          accrued += outstanding * daily_rate * days
          outstanding -= p
          prev_t = t
      accrued += outstanding * daily_rate * day_count(prev_t, promo_end)
      deferred_interest_posted_cents = round_half_up(accrued)
    input_set: "One FinancedPurchase plus its in-window Payment allocations; only purchases with promo_status==DEFERRED and principal_paid_cents < principal_cents at promo_end"
    constants:
      DAYS_PER_YEAR: 360
    precision: "accrue in float on cents, round_half_up once at the end to integer cents"
    variants:
      - name: chronological_actual
        when: "the posted forfeit — walks real payment timeline"
        difference: "interest on the time-weighted actual outstanding balance"
      - name: forward_looking_projected
        when: "advisory only — surfaced by GET /financed-purchases/{id}/payoff-projection; NEVER posted to balance"
        difference: "assumes NO further payments after the projection instant: charges promo_apr on the FULL remaining principal_cents for the entire window remaining; always >= the chronological_actual that the same purchase would forfeit, because it ignores the principal reductions real payments would make"

  - name: settlement_fee
    trigger: "FinancedPurchase AUTHORIZED→SETTLED (Settlement creation)"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency pinned: the volume tier that selects the discount
      # rate is keyed on the provider's monthly_settled_volume INCLUDING this settlement's
      # gross. Evaluation order is fixed:
      #   step 1: prospective_volume = Provider.monthly_settled_volume_cents + gross_cents
      #   step 2: tier_delta = TIER1_DELTA if prospective_volume >= TIER1_THRESHOLD_CENTS
      #                        else TIER2_DELTA if prospective_volume >= TIER2_THRESHOLD_CENTS
      #                        else 0
      #   step 3: discount_rate_applied = max(MIN_RATE, base_merchant_discount_rate - tier_delta)
      #   step 4: discount_fee_cents = round_half_up(gross_cents * discount_rate_applied)
      #   step 5: net_cents = gross_cents - discount_fee_cents
      # monthly_settled_volume_cents itself is only mutated at the Settlement PENDING→PAID
      # transition, NOT here, so two settlements created back-to-back before either is PAID
      # both see the same monthly_settled_volume baseline.
    input_set: "One FinancedPurchase (gross), its Provider (base rate + monthly_settled_volume_cents)"
    constants:
      TIER1_THRESHOLD_CENTS: 5000000
      TIER2_THRESHOLD_CENTS: 1000000
      TIER1_DELTA: 0.02
      TIER2_DELTA: 0.01
      MIN_RATE: 0.02
    precision: "discount_fee_cents round_half_up to integer cents"

  - name: minimum_payment
    trigger: "BillingStatement close (POST /_cycle/close_statement)"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED as round-per-purchase-then-sum (NOT sum-then-round):
      per_purchase_min[i] = round_half_up(open_principal_i * PromotionalPlan(i).min_payment_factor)
                            for each FinancedPurchase i on the account whose
                            settlement_status NOT IN {REFUNDED, VOID} AND open_principal_i > 0,
                            where open_principal_i = principal_cents - principal_paid_cents
      raw_minimum = sum(per_purchase_min)                       # sum of already-rounded line minimums
      closing_balance = current_balance_cents snapshot at close
      minimum_payment_due_cents = min(raw_minimum, closing_balance)   # cap at full balance
      # Empty set (no open purchases) -> raw_minimum = 0 -> minimum_payment_due_cents = 0
    input_set: "All FinancedPurchases on the account with settlement_status NOT IN {REFUNDED,VOID} and open_principal>0; each line's min_payment_factor from its governing PromotionalPlan"
    constants:
      FLOOR_PAYMENT_CENTS: 2500
    precision: "round_half_up per purchase line, THEN sum; final cap is a plain min()"
    variants:
      - name: round_then_sum
        when: "the pinned posted order"
        difference: "rounds each purchase's min to whole cents BEFORE summing; differs from sum-of-raw-then-round whenever two or more lines each carry a sub-cent remainder that would otherwise net out"

  - name: payment_allocation
    trigger: "POST /payments (POSTED) and reversed on POST /payments/{id}/reverse"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall across the account's open purchases, ordered DETERMINISTICALLY:
      #   primary sort: promo_end ASC (soonest-expiring promo first — protect the patient)
      #   tie-break:    FinancedPurchase.created_at ASC   (never id)
      # Within each purchase, principal is paid before any posted deferred interest.
      remaining = amount_cents
      for purchase in open_purchases ordered by (promo_end ASC, created_at ASC):
          interest_open = deferred_interest_posted_cents - interest_paid_so_far
          interest_applied = min(remaining, interest_open); remaining -= interest_applied
          principal_open = principal_cents - principal_paid_cents
          principal_applied = min(remaining, principal_open); remaining -= principal_applied
          emit allocation line {purchase.id, principal_applied, interest_applied}
          if remaining == 0: break
      # Leftover after all open purchases settled becomes account credit (negative balance
      # not allowed: surplus reduces current_balance toward 0 only, floor 0).
    input_set: "Open FinancedPurchases on the account (settlement_status NOT IN {REFUNDED,VOID}, outstanding>0)"
    constants: {}
    precision: "integer cents; no rounding (amounts already integral)"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /credit-applications and the /_clock,/_cycle,/_autopay test endpoints"
  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For entity_backed roles, X-User-ID owns the targeted resource (Patient owns the account; Provider owns the purchase/promotion/refund target)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all owner-scoped Patient/Provider endpoints"
  - priority: 4
    category: existence
    check: "Every path/body id (provider_id, patient_account_id, financed_purchase_id, etc.) references an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: existence
    check: "Required body fields present and well-typed; enum members valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 6
    category: state
    check: "Target resource is in a state from which this transition is defined (e.g., settle requires purchase AUTHORIZED; pay requires settlement PENDING; close requires balance 0)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version equals the live parent version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /financed-purchases", "POST /financed-purchases/{id}/settle"]
  - priority: 8
    category: business_referential
    check: "Cross-entity coherence: a Payment's allocation may only touch FinancedPurchases on its own patient_account_id; a FinancedPurchase's provider_promotion_id must belong to its provider_id and to an ACTIVE ProviderPromotion; a Refund's amount_cents must equal the purchase principal_cents"
    error_id: ERR_REFERENTIAL_MISMATCH
    http_status: 409
    applies_to: ["POST /payments", "POST /financed-purchases", "POST /refunds"]
  - priority: 9
    category: business_temporal
    check: "Temporal-window coherence: a FinancedPurchase authorization clock must fall in [ProviderPromotion.effective_start, effective_end); a new ProviderPromotion for the same (provider, plan_category) must not overlap an existing ACTIVE one's half-open window; a new BillingStatement period must be closed-adjacent (period_start == prior.period_end + 1 day) with no overlap"
    error_id: ERR_TEMPORAL_CONFLICT
    http_status: 409
    applies_to: ["POST /financed-purchases", "POST /provider-promotions", "POST /_cycle/close_statement"]
  - priority: 10
    category: business_safety
    check: "Compliance gate: Provider.status==ENROLLED required to originate/settle; PatientAccount.status must be ACTIVE to authorize a new purchase and NOT DEFAULTED/CLOSED for any debit; DEFAULTED accounts reject new purchases and payments other than PAYOFF"
    error_id: ERR_ACCOUNT_NOT_ELIGIBLE
    http_status: 409
    applies_to: ["POST /financed-purchases", "POST /financed-purchases/{id}/settle", "POST /payments"]
  - priority: 11
    category: business_fiscal
    check: "Fiscal capacity: a new FinancedPurchase principal_cents must not exceed PatientAccount.available_credit_cents; a MANUAL/AUTOPAY Payment amount_cents must not exceed current_balance_cents (PAYOFF may equal exactly)"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 409
    applies_to: ["POST /financed-purchases", "POST /payments"]
  - priority: 12
    category: business_constraint
    check: "Uniqueness: Provider.tax_id unique among non-TERMINATED providers; CreditApplication.applicant_ssn_last4 unique among non-DECLINED applications; at most one ACTIVE AutopayEnrollment per account"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: ["POST /providers", "POST /credit-applications", "POST /autopay-enrollments"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Provider ----
  - method: POST
    path: "/providers"
    description: "Register a provider (starts PENDING)"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, specialty, tax_id, base_merchant_discount_rate]
    output: Provider
    side_effects: ["status=PENDING", "monthly_settled_volume_cents=0", "settled_net_cents=0"]
  - method: GET
    path: "/providers/{id}"
    description: "Get a provider"
    roles: [PlatformAdmin, Provider]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: GET
    path: "/providers"
    description: "List providers (paginated; filter by status/specialty)"
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "specialty?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []
  - method: POST
    path: "/providers/{id}/enroll"
    description: "Enroll/reinstate a provider (PENDING|SUSPENDED → ENROLLED)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: ["status=ENROLLED", "increments Provider.version by 1"]
  - method: POST
    path: "/providers/{id}/suspend"
    description: "Suspend an enrolled provider"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: ["status=SUSPENDED", "increments Provider.version by 1"]
  - method: POST
    path: "/providers/{id}/terminate"
    description: "Terminate a provider"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: ["status=TERMINATED", "increments Provider.version by 1"]
  - method: GET
    path: "/providers/{id}/settlements"
    description: "List settlements for a provider (reverse-reachability for Settlement.provider_id)"
    roles: [PlatformAdmin, Provider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  # ---- PromotionalPlan ----
  - method: POST
    path: "/promotional-plans"
    description: "Create a promotional plan template (DRAFT)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, plan_category, deferred_period_months, promo_apr, min_payment_factor]
    output: PromotionalPlan
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/promotional-plans/{id}"
    description: "Get a promotional plan"
    roles: [PlatformAdmin, Provider]
    code: 200
    input: []
    output: PromotionalPlan
    side_effects: []
  - method: GET
    path: "/promotional-plans"
    description: "List promotional plans (paginated)"
    roles: [PlatformAdmin, Provider]
    code: 200
    input: ["plan_category?", "status?", "limit?", "offset?"]
    output: PromotionalPlan[]
    side_effects: []
  - method: POST
    path: "/promotional-plans/{id}/activate"
    description: "Activate a plan (DRAFT→ACTIVE)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PromotionalPlan
    side_effects: ["status=ACTIVE", "increments PromotionalPlan.version by 1"]
  - method: POST
    path: "/promotional-plans/{id}/retire"
    description: "Retire a plan (ACTIVE→RETIRED)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PromotionalPlan
    side_effects: ["status=RETIRED", "increments PromotionalPlan.version by 1"]

  # ---- ProviderPromotion ----
  - method: POST
    path: "/provider-promotions"
    description: "Enroll a provider into an ACTIVE plan for a half-open effective window"
    roles: [PlatformAdmin]
    code: 201
    input: [provider_id, promotional_plan_id, effective_start, effective_end]
    output: ProviderPromotion
    side_effects: ["status=ACTIVE", "temporal-overlap check against existing ACTIVE promotions for same (provider, plan_category)"]
  - method: GET
    path: "/provider-promotions/{id}"
    description: "Get a provider promotion"
    roles: [PlatformAdmin, Provider]
    code: 200
    input: []
    output: ProviderPromotion
    side_effects: []
  - method: GET
    path: "/provider-promotions"
    description: "List provider promotions (filter by provider_id or promotional_plan_id)"
    roles: [PlatformAdmin, Provider]
    code: 200
    input: ["provider_id?", "promotional_plan_id?", "status?", "limit?", "offset?"]
    output: ProviderPromotion[]
    side_effects: []
  - method: POST
    path: "/provider-promotions/{id}/withdraw"
    description: "Withdraw a provider promotion (ACTIVE→WITHDRAWN)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProviderPromotion
    side_effects: ["status=WITHDRAWN", "increments ProviderPromotion.version by 1"]

  # ---- CreditApplication ----
  - method: POST
    path: "/credit-applications"
    description: "Submit a credit application (computes provisional_limit_cents)"
    roles: [Anonymous, Provider]
    code: 201
    input: [applicant_full_name, applicant_ssn_last4, stated_annual_income_cents, requested_limit_cents]
    output: CreditApplication
    side_effects: ["status=SUBMITTED", "provisional_limit_cents via credit_decision provisional variant"]
  - method: GET
    path: "/credit-applications/{id}"
    description: "Get a credit application"
    roles: [PlatformAdmin, Provider]
    code: 200
    input: []
    output: CreditApplication
    side_effects: []
  - method: GET
    path: "/credit-applications"
    description: "List credit applications (filter by status or patient_account_id; the patient_account_id filter is the reverse-reachability channel for CreditApplication.patient_account_id)"
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "patient_account_id?", "limit?", "offset?"]
    output: CreditApplication[]
    side_effects: []
  - method: POST
    path: "/credit-applications/{id}/approve"
    description: "Approve an application; mints a PatientAccount or auto-declines on a zero final line"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CreditApplication
    side_effects: ["compute approved_limit_cents (final variant)", "mint PatientAccount + link patient_account_id, OR auto-decline", "increments CreditApplication.version by 1"]
  - method: POST
    path: "/credit-applications/{id}/decline"
    description: "Decline an application (SUBMITTED→DECLINED)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: CreditApplication
    side_effects: ["status=DECLINED", "approved_limit_cents=0", "increments CreditApplication.version by 1"]

  # ---- PatientAccount ----
  - method: GET
    path: "/accounts/{id}"
    description: "Get a patient account"
    roles: [PlatformAdmin, Patient]
    code: 200
    input: []
    output: PatientAccount
    side_effects: []
  - method: GET
    path: "/accounts"
    description: "List patient accounts (filter by status or credit_application_id; reverse-reachability for PatientAccount.credit_application_id)"
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "credit_application_id?", "limit?", "offset?"]
    output: PatientAccount[]
    side_effects: []
  - method: GET
    path: "/accounts/{id}/financed-purchases"
    description: "List a patient account's financed purchases (reverse-reachability for FinancedPurchase.patient_account_id)"
    roles: [PlatformAdmin, Patient]
    code: 200
    input: ["settlement_status?", "promo_status?", "limit?", "offset?"]
    output: FinancedPurchase[]
    side_effects: []
  - method: GET
    path: "/accounts/{id}/payments"
    description: "List a patient account's payments (reverse-reachability for Payment.patient_account_id)"
    roles: [PlatformAdmin, Patient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: GET
    path: "/accounts/{id}/statements"
    description: "List a patient account's billing statements (reverse-reachability for BillingStatement.patient_account_id)"
    roles: [PlatformAdmin, Patient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BillingStatement[]
    side_effects: []
  - method: GET
    path: "/accounts/{id}/autopay-enrollments"
    description: "List a patient account's autopay enrollments (reverse-reachability for AutopayEnrollment.patient_account_id)"
    roles: [PlatformAdmin, Patient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AutopayEnrollment[]
    side_effects: []
  - method: POST
    path: "/accounts/{id}/close"
    description: "Close a zero-balance account (ACTIVE→CLOSED)"
    roles: [Patient]
    code: 200
    input: []
    output: PatientAccount
    side_effects: ["status=CLOSED", "revoke autopay enrollments", "increments PatientAccount.version by 1"]

  # ---- AutopayEnrollment ----
  - method: POST
    path: "/autopay-enrollments"
    description: "Enroll the account in recurring autopay"
    roles: [Patient]
    code: 201
    input: [patient_account_id, funding_token, draft_day_of_month]
    output: AutopayEnrollment
    side_effects: ["status=ACTIVE", "uniqueness: at most one ACTIVE per account"]
  - method: GET
    path: "/autopay-enrollments/{id}"
    description: "Get an autopay enrollment"
    roles: [PlatformAdmin, Patient]
    code: 200
    input: []
    output: AutopayEnrollment
    side_effects: []
  - method: POST
    path: "/autopay-enrollments/{id}/pause"
    description: "Pause autopay (ACTIVE→PAUSED)"
    roles: [Patient]
    code: 200
    input: []
    output: AutopayEnrollment
    side_effects: ["status=PAUSED", "increments AutopayEnrollment.version by 1"]
  - method: POST
    path: "/autopay-enrollments/{id}/resume"
    description: "Resume autopay (PAUSED→ACTIVE)"
    roles: [Patient]
    code: 200
    input: []
    output: AutopayEnrollment
    side_effects: ["status=ACTIVE", "increments AutopayEnrollment.version by 1"]
  - method: POST
    path: "/autopay-enrollments/{id}/revoke"
    description: "Revoke autopay (ACTIVE|PAUSED→REVOKED)"
    roles: [Patient]
    code: 200
    input: []
    output: AutopayEnrollment
    side_effects: ["status=REVOKED", "increments AutopayEnrollment.version by 1"]

  # ---- FinancedPurchase ----
  - method: POST
    path: "/financed-purchases"
    description: "Authorize a financed purchase (OCC-guarded on the account)"
    roles: [Provider]
    code: 201
    input: [provider_id, patient_account_id, provider_promotion_id, principal_cents, expected_patient_account_version]
    output: FinancedPurchase
    side_effects: ["settlement_status=AUTHORIZED", "promo_status=DEFERRED", "set promo_start=clock, promo_end=clock+deferred_period_months", "debit PatientAccount.available_credit_cents by principal_cents", "increment PatientAccount.current_balance_cents by principal_cents", "increments PatientAccount.version by 1"]
  - method: GET
    path: "/financed-purchases/{id}"
    description: "Get a financed purchase"
    roles: [PlatformAdmin, Provider, Patient]
    code: 200
    input: []
    output: FinancedPurchase
    side_effects: []
  - method: GET
    path: "/financed-purchases"
    description: "List financed purchases (filter by provider_id, patient_account_id, provider_promotion_id, statuses)"
    roles: [PlatformAdmin, Provider]
    code: 200
    input: ["provider_id?", "patient_account_id?", "provider_promotion_id?", "settlement_status?", "promo_status?", "limit?", "offset?"]
    output: FinancedPurchase[]
    side_effects: []
  - method: GET
    path: "/financed-purchases/{id}/payoff-projection"
    description: "Advisory forward-looking deferred-interest projection (NEVER posted)"
    roles: [PlatformAdmin, Provider, Patient]
    code: 200
    input: []
    output: "{ projected_forfeit_interest_cents: integer, principal_remaining_cents: integer, days_remaining: integer }"
    side_effects: []
  - method: POST
    path: "/financed-purchases/{id}/settle"
    description: "Settle a purchase to its provider (OCC-guarded on the purchase); creates a PENDING Settlement"
    roles: [PlatformAdmin]
    code: 201
    input: [expected_financed_purchase_version]
    output: Settlement
    side_effects: ["create Settlement via settlement_fee calc", "set purchase.settlement_status=SETTLED", "increments FinancedPurchase.version by 1"]

  # ---- Settlement ----
  - method: GET
    path: "/settlements/{id}"
    description: "Get a settlement"
    roles: [PlatformAdmin, Provider]
    code: 200
    input: []
    output: Settlement
    side_effects: []
  - method: GET
    path: "/settlements"
    description: "List settlements (filter by provider_id, financed_purchase_id, status)"
    roles: [PlatformAdmin, Provider]
    code: 200
    input: ["provider_id?", "financed_purchase_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []
  - method: POST
    path: "/settlements/{id}/pay"
    description: "Disburse a PENDING settlement to the provider (PENDING→PAID)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status=PAID", "increment Provider.settled_net_cents by net_cents", "increment Provider.monthly_settled_volume_cents by gross_cents", "increments Settlement.version by 1"]

  # ---- Payment ----
  - method: POST
    path: "/payments"
    description: "Post a manual/payoff payment; runs payment_allocation waterfall"
    roles: [Patient]
    code: 201
    input: [patient_account_id, amount_cents, payment_type]
    output: Payment
    side_effects: ["status=POSTED", "set posted_at=clock", "allocate via payment_allocation", "reduce purchases' principal/interest, decrement current_balance, may flip promo_status DEFERRED→PAID_IN_FULL", "may cure DELINQUENT→ACTIVE"]
  - method: GET
    path: "/payments/{id}"
    description: "Get a payment"
    roles: [PlatformAdmin, Patient]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/payments"
    description: "List payments (filter by patient_account_id, status, payment_type)"
    roles: [PlatformAdmin, Patient]
    code: 200
    input: ["patient_account_id?", "status?", "payment_type?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/payments/{id}/reverse"
    description: "Reverse a non-PAYOFF posted payment (POSTED→REVERSED); unwinds allocation"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: ["status=REVERSED", "unwind allocation: restore principal_paid/interest, increment current_balance", "may revert PAID_IN_FULL→DEFERRED", "increments Payment.version by 1"]

  # ---- Refund ----
  - method: POST
    path: "/refunds"
    description: "Void (pre-settlement) or refund (post-settlement) a purchase; triggers clawback/credit-restore cascade"
    roles: [Provider]
    code: 201
    input: [financed_purchase_id, refund_kind, amount_cents]
    output: Refund
    side_effects: ["create Refund(APPLIED)", "VOID: purchase AUTHORIZED→VOID; REFUND: purchase SETTLED→REFUNDED + Settlement→CLAWED_BACK", "restore available_credit, decrement current_balance, possibly cure delinquency"]
  - method: GET
    path: "/refunds/{id}"
    description: "Get a refund"
    roles: [PlatformAdmin, Provider]
    code: 200
    input: []
    output: Refund
    side_effects: []
  - method: GET
    path: "/refunds"
    description: "List refunds (filter by financed_purchase_id; reverse-reachability for Refund.financed_purchase_id)"
    roles: [PlatformAdmin, Provider]
    code: 200
    input: ["financed_purchase_id?", "refund_kind?", "limit?", "offset?"]
    output: Refund[]
    side_effects: []

  # ---- BillingStatement / cycle (test-driving + business) ----
  - method: GET
    path: "/statements/{id}"
    description: "Get a billing statement"
    roles: [PlatformAdmin, Patient]
    code: 200
    input: []
    output: BillingStatement
    side_effects: []

  # ---- Test-driving endpoints (/_ namespace) ----
  - method: POST
    path: "/_clock/set"
    description: "Set the system clock to an absolute ISO-8601 instant (test-driving)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["does NOT auto-fire promo expiry or cycle close; use /_clock/advance or /_cycle/close_statement to trigger time-gated transitions"]
  - method: POST
    path: "/_clock/advance"
    description: "Advance the system clock to an absolute instant AND fire all promo_end crossings in between (test-driving)"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, forfeited_purchase_ids: array }"
    side_effects: ["for every FinancedPurchase with promo_status==DEFERRED and promo_end <= new clock and principal_paid_cents<principal_cents: DEFERRED→INTEREST_FORFEITED via deferred_interest calc, increment account balance"]
  - method: POST
    path: "/_cycle/open_statement"
    description: "Open the first OPEN BillingStatement for an account with an explicit closed-interval period (test-driving)"
    roles: [PlatformAdmin]
    code: 201
    input: [patient_account_id, period_start, period_end]
    output: BillingStatement
    side_effects: ["status=OPEN", "opening_balance snapshot", "temporal closed-adjacency check"]
  - method: POST
    path: "/_cycle/close_statement"
    description: "Close an account's OPEN statement; computes minimum, drives delinquency, opens next (test-driving)"
    roles: [PlatformAdmin]
    code: 200
    input: [patient_account_id]
    output: BillingStatement
    side_effects: ["compute minimum_payment_due_cents, amount_paid_in_cycle_cents, min_payment_satisfied", "drive PatientAccount strike/cure/default", "open next statement"]
  - method: POST
    path: "/_autopay/run"
    description: "Simulate an autopay draft for one ACTIVE enrollment, posting an AUTOPAY Payment of the open statement minimum (test-driving)"
    roles: [PlatformAdmin]
    code: 201
    input: [autopay_enrollment_id]
    output: Payment
    side_effects: ["post AUTOPAY Payment of min(open statement minimum, current_balance)", "run payment_allocation", "may cure delinquency"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers on a protected endpoint" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed actor does not own the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, or invalid enum member" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version does not match the live parent version" }
  - { id: ERR_REFERENTIAL_MISMATCH, http: 409, condition: "Cross-entity link invalid: payment touches foreign purchase, promotion not owned by provider, or refund amount != principal" }
  - { id: ERR_TEMPORAL_CONFLICT, http: 409, condition: "Authorization clock outside promo window, overlapping ProviderPromotion, or non-adjacent/overlapping statement period" }
  - { id: ERR_ACCOUNT_NOT_ELIGIBLE, http: 409, condition: "Provider not ENROLLED, or account not in an eligible status for the requested debit/origination" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 409, condition: "Purchase principal exceeds available credit, or payment exceeds balance" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Duplicate tax_id, ssn_last4, or second ACTIVE autopay enrollment" }
  - { id: ERR_PAYOFF_NOT_REVERSIBLE, http: 409, condition: "Attempt to reverse a PAYOFF payment" }
  - { id: ERR_VALIDATION_AMOUNT, http: 422, condition: "Numeric field out of allowed range (negative principal, factor > 1, day_of_month out of 1..28, etc.)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "The financier/operator: underwrites applications, runs settlements, drives the billing cycle and clock, reverses payments."
    identity: "opaque"
    exclusive_operations:
      - "POST /providers and provider enroll/suspend/terminate"
      - "POST /promotional-plans and activate/retire"
      - "POST /provider-promotions and withdraw"
      - "POST /credit-applications/{id}/approve|decline"
      - "POST /financed-purchases/{id}/settle"
      - "POST /settlements/{id}/pay"
      - "POST /payments/{id}/reverse"
      - "all /_clock,/_cycle,/_autopay test-driving endpoints"
      - "List/get of all collections"
    shared_operations: []
  - name: Provider
    description: "An enrolled clinic acting as itself; originates and refunds purchases, views its promotions/settlements."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /financed-purchases (must own provider_id)"
      - "POST /refunds (must own the purchase's provider_id)"
    shared_operations:
      - "POST /credit-applications (with Anonymous)"
      - "GET its own providers/{id}, provider-promotions, settlements, financed-purchases, refunds"
  - name: Patient
    description: "An account holder acting as itself; pays, manages autopay, closes the account."
    identity: "entity_backed:PatientAccount"
    exclusive_operations:
      - "POST /payments (must own patient_account_id)"
      - "POST /autopay-enrollments and pause/resume/revoke (must own the account)"
      - "POST /accounts/{id}/close (must own the account)"
    shared_operations:
      - "GET its own accounts/{id}, financed-purchases, payments, statements, autopay-enrollments"
  - name: Anonymous
    description: "Unauthenticated public surface limited to submitting a credit application."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /credit-applications (with Provider)"
