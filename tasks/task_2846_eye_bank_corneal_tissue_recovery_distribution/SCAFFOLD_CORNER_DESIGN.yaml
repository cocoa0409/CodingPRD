      - name: within_extended_band_docks_forty_eight_hours_from_the_provisional_shelf_life
        claim_type: threshold_crossing
        grounds:
          - calculations.recovery_time_limit
          - calculations.tissue_shelf_life
          - entities.CorneaTissue.fields.expires_at
          - entities.Recovery.fields.time_limit_band
        distinguishing_aspect: |
          Preservation at 15:00 against death at 02:00 gives 780 minutes, which lands in the
          (720, 900] WITHIN_EXTENDED band and is still inside the 960-minute recovery window
          (deadline 18:00), so the recovery is ACCEPTED and the band penalty applies:
          provisional shelf life 336 - 48 = 288 h, expires_at 2026-08-15T15:00:00.000Z. The
          rejection path only opens above the deadline, which is why the extended band is
          reachable at all.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one donor: ASYSTOLE, cooled 03:00 (delay 60 -> credit 240), age 52 -> window 960, deadline 2026-08-03T18:00:00.000Z"
            - "one RECOVERY_ONLY technician; the recovery is completed with preservation_at 15:00 in OPTISOL_GS"
          setup_api_calls:
