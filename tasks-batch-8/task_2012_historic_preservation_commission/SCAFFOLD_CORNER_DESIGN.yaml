  - section: endpoints
    instances:
      - name: list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "GET /preservation/districts honors limit/offset with total_count and has_more per the fixed envelope (defaults limit 10)."
        test_recipe:
          setup: ["three districts created"]
          setup_api_calls:
            - call: "POST /preservation/districts"
              payload: { name: "D1", boundary_description: "b1", significance_tier: "LOCAL" }
              as: PreservationStaff
            - call: "POST /preservation/districts"
              payload: { name: "D2", boundary_description: "b2", significance_tier: "LANDMARK" }
              as: PreservationStaff
            - call: "POST /preservation/districts"
              payload: { name: "D3", boundary_description: "b3", significance_tier: "ICONIC" }
              as: PreservationStaff
          trigger:
            - call: "GET /preservation/districts"
              payload: { limit: 2, offset: 0 }
              as: PreservationStaff
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2 (offset 2): 1 item, total_count == 3, has_more == false"

