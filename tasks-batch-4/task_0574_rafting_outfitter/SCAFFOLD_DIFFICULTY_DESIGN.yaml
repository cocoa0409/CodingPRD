# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: reservation_estimate_vs_final_total_diverge
        grounds:
          - calculations.reservation_estimated_total
          - calculations.reservation_final_total
          - entities.Reservation.fields.estimated_total_cents
          - entities.Reservation.fields.final_total_cents
        distinguishing_aspect: |
          Same Reservation: estimated_total (party_size=5, disc 10%) = 58000; final_total charges only the
          1 checked-in guest with the SAME booked-size tier = 19800; the two variants differ because the
          estimate uses booked party_size while the final uses checked_in_guest_count.
        test_recipe:
          setup:
            - "CLASS_III trip OPEN with 1 LEAD guide; base_rate_cents=12000, guide_ratio_max=6, max_capacity=12."
            - "Reservation booked party_size=5, photo_addon=true, deposit paid; one guest added, waiver signed, PFD assigned, reservation CHECKED_IN."
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Arkansas", difficulty_class: "CLASS_III", trip_date: "2026-06-15T09:00:00Z", end_time: "2026-06-15T15:00:00Z", put_in_location: "Numbers", take_out_location: "Fractions", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, min_age: 12, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "Ada Guide", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { guide_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${guide_id}", role: "LEAD" }
              as: OutfitterManager
              captures: { ga_id: $.data.id }
            - call: "POST /trips/${trip_id}/open"
              payload: {}
              as: OutfitterManager
            - call: "POST /gear-items"
              payload: { gear_type: "PFD", size_label: "L", min_weight_lbs: 100, max_weight_lbs: 250 }
              as: OutfitterManager
              captures: { pfd_id: $.data.id }
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { trip_v: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 5, photo_addon: true, deposit_cents: 14500, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id }
            - call: "POST /guests"
              payload: { reservation_id: "${res_id}", full_name: "Bob Guest", age: 30, weight_lbs: 180 }
              as: Reservationist
              captures: { guest_id: $.data.id }
            - call: "GET /waivers?guest_id=${guest_id}"
              payload: {}
              as: Reservationist
              captures: { waiver_id: "$.data[0].id" }
            - call: "POST /waivers/${waiver_id}/sign"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /gear-assignments"
              payload: { gear_item_id: "${pfd_id}", guest_id: "${guest_id}", trip_id: "${trip_id}" }
              as: Reservationist
            - call: "POST /reservations/${res_id}/pay-deposit"
              payload: {}
              as: Reservationist
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Reservationist
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: Reservationist
          trigger:
            - call: "POST /reservations/${res_id}/settle"
              payload: { gratuity_cents: 5000 }
              as: Reservationist
              captures: { final_total: $.data.final_total_cents, est_total: $.data.estimated_total_cents }
          assert:
            - "Reservation.${res_id}.estimated_total_cents == 58000"
            - "Reservation.${res_id}.final_total_cents == 19800"
            - "Reservation.${res_id}.estimated_total_cents != Reservation.${res_id}.final_total_cents"

      - name: gratuity_provisional_equal_vs_final_weighted
        grounds:
          - calculations.provisional_gratuity_share_cents
          - calculations.final_gratuity_share_cents
          - entities.GuideAssignment.fields.provisional_gratuity_share_cents
          - entities.GuideAssignment.fields.final_gratuity_share_cents
        distinguishing_aspect: |
          On the LEAD GuideAssignment: provisional share (equal split of pool=10000 over 3 guides) = 3334,
          but final share (role-weighted 3:2:1) = 5001; the gratuity distribution diverges between the
          equal-split provisional and role-weighted final variants on the GuideAssignment domain.
        test_recipe:
          setup:
            - "CLASS_III trip OPEN with 3 guides assigned in creation order LEAD, SAFETY, SWEEP."
            - "One reservation (party_size=1, no photo) fully checked-in and SETTLED with gratuity_cents=10000 (pool=10000)."
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Gauley", difficulty_class: "CLASS_III", trip_date: "2026-06-16T09:00:00Z", end_time: "2026-06-16T15:00:00Z", put_in_location: "Summersville", take_out_location: "Swiss", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, min_age: 12, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "Lead Guide", max_class: "CLASS_IV" }
              as: OutfitterManager
              captures: { g_lead: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${g_lead}", role: "LEAD" }
              as: OutfitterManager
              captures: { ga_lead: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "Safety Guide", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { g_safety: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${g_safety}", role: "SAFETY" }
              as: OutfitterManager
              captures: { ga_safety: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "Sweep Guide", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { g_sweep: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${g_sweep}", role: "SWEEP" }
              as: OutfitterManager
              captures: { ga_sweep: $.data.id }
            - call: "POST /trips/${trip_id}/open"
              payload: {}
              as: OutfitterManager
            - call: "POST /gear-items"
              payload: { gear_type: "PFD", size_label: "M", min_weight_lbs: 100, max_weight_lbs: 250 }
              as: OutfitterManager
              captures: { pfd_id: $.data.id }
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { trip_v: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 1, deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id }
            - call: "POST /guests"
              payload: { reservation_id: "${res_id}", full_name: "Cy Guest", age: 40, weight_lbs: 190 }
              as: Reservationist
              captures: { guest_id: $.data.id }
            - call: "GET /waivers?guest_id=${guest_id}"
              payload: {}
              as: Reservationist
              captures: { waiver_id: "$.data[0].id" }
            - call: "POST /waivers/${waiver_id}/sign"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /gear-assignments"
              payload: { gear_item_id: "${pfd_id}", guest_id: "${guest_id}", trip_id: "${trip_id}" }
              as: Reservationist
            - call: "POST /reservations/${res_id}/pay-deposit"
              payload: {}
              as: Reservationist
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Reservationist
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: Reservationist
            - call: "POST /reservations/${res_id}/settle"
              payload: { gratuity_cents: 10000 }
              as: Reservationist
          trigger:
            - call: "POST /trips/${trip_id}/complete"
              payload: {}
              as: OutfitterManager
          assert:
            - "GuideAssignment.${ga_lead}.provisional_gratuity_share_cents == 3334"
            - "GuideAssignment.${ga_lead}.final_gratuity_share_cents == 5001"
            - "GuideAssignment.${ga_safety}.final_gratuity_share_cents == 3333"
            - "GuideAssignment.${ga_sweep}.final_gratuity_share_cents == 1666"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: estimated_total_tiered_discount_with_photo_mode_a
        grounds:
          - calculations.reservation_estimated_total
          - calculations.group_discount_pct
          - entities.Reservation.fields.estimated_total_cents
        distinguishing_aspect: |
          Mode (a): estimated_total for party_size=8 selects the 15% tier and adds the conditional photo fee:
          round(12000*8*0.85)+4000 = 85600 — a >=3-input non-linear formula (base_rate x count x tiered rate,
          plus a conditional photo branch).
        test_recipe:
          setup:
            - "CLASS_III trip OPEN with 1 guide; base_rate_cents=12000."
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Kern", difficulty_class: "CLASS_III", trip_date: "2026-06-17T09:00:00Z", end_time: "2026-06-17T15:00:00Z", put_in_location: "Fairview", take_out_location: "Powerhouse", max_capacity: 20, guide_ratio_max: 6, base_rate_cents: 12000, min_age: 12, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "G", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { guide_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${guide_id}", role: "LEAD" }
              as: OutfitterManager
            - call: "POST /trips/${trip_id}/open"
              payload: {}
              as: OutfitterManager
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { trip_v: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 8, photo_addon: true, deposit_cents: 21400, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id, est: $.data.estimated_total_cents }
          assert:
            - "Reservation.${res_id}.estimated_total_cents == 85600"

      - name: final_gratuity_rounding_order_mode_b
        grounds:
          - calculations.final_gratuity_share_cents
          - entities.GuideAssignment.fields.final_gratuity_share_cents
        distinguishing_aspect: |
          Mode (b): pinned rounding order (floor each weighted share, then hand the single leftover cent to
          the earliest-created guide by created_at ASC) yields exactly 5001 + 3333 + 1666 = 10000; a naive
          proportional rounding would drift and not sum to the 10000 pool.
        test_recipe:
          setup:
            - "Same shape as gratuity_provisional_equal_vs_final_weighted: 3 guides (LEAD,SAFETY,SWEEP created in that order), one SETTLED reservation with gratuity 10000, trip COMPLETED."
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Ocoee", difficulty_class: "CLASS_III", trip_date: "2026-06-18T09:00:00Z", end_time: "2026-06-18T15:00:00Z", put_in_location: "Dam", take_out_location: "Powerhouse", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, min_age: 12, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "Lead", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { g_lead: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${g_lead}", role: "LEAD" }
              as: OutfitterManager
              captures: { ga_lead: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "Safety", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { g_safety: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${g_safety}", role: "SAFETY" }
              as: OutfitterManager
              captures: { ga_safety: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "Sweep", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { g_sweep: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${g_sweep}", role: "SWEEP" }
              as: OutfitterManager
              captures: { ga_sweep: $.data.id }
            - call: "POST /trips/${trip_id}/open"
              payload: {}
              as: OutfitterManager
            - call: "POST /gear-items"
              payload: { gear_type: "PFD", size_label: "M", min_weight_lbs: 100, max_weight_lbs: 250 }
              as: OutfitterManager
              captures: { pfd_id: $.data.id }
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { trip_v: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 1, deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id }
            - call: "POST /guests"
              payload: { reservation_id: "${res_id}", full_name: "Dee", age: 33, weight_lbs: 175 }
              as: Reservationist
              captures: { guest_id: $.data.id }
            - call: "GET /waivers?guest_id=${guest_id}"
              payload: {}
              as: Reservationist
              captures: { waiver_id: "$.data[0].id" }
            - call: "POST /waivers/${waiver_id}/sign"
              payload: {}
              as: Guest
              as_user_id: "${guest_id}"
            - call: "POST /gear-assignments"
              payload: { gear_item_id: "${pfd_id}", guest_id: "${guest_id}", trip_id: "${trip_id}" }
              as: Reservationist
            - call: "POST /reservations/${res_id}/pay-deposit"
              payload: {}
              as: Reservationist
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Reservationist
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: Reservationist
            - call: "POST /reservations/${res_id}/settle"
              payload: { gratuity_cents: 10000 }
              as: Reservationist
          trigger:
            - call: "POST /trips/${trip_id}/complete"
              payload: {}
              as: OutfitterManager
          assert:
            - "GuideAssignment.${ga_lead}.final_gratuity_share_cents == 5001"
            - "GuideAssignment.${ga_safety}.final_gratuity_share_cents == 3333"
            - "GuideAssignment.${ga_sweep}.final_gratuity_share_cents == 1666"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - state_machines.Reservation.UNPAID_to_DEPOSIT_PAID
          - entities.Reservation.fields.payment_status
          - entities.Reservation.fields.fulfillment_status
        distinguishing_aspect: |
          Reservation carries two independent state dimensions: confirming advances fulfillment_status to
          CONFIRMED while payment_status stays UNPAID; paying the deposit then advances payment_status to
          DEPOSIT_PAID while fulfillment_status remains CONFIRMED.
        test_recipe:
          setup:
            - "CLASS_III trip OPEN with 1 guide; a fresh Reservation (party_size=2, deposit_cents=6000) exists in fulfillment PENDING / payment UNPAID."
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Rogue", difficulty_class: "CLASS_III", trip_date: "2026-06-19T09:00:00Z", end_time: "2026-06-19T15:00:00Z", put_in_location: "Grave", take_out_location: "Foster", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, min_age: 12, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "G", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { guide_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${guide_id}", role: "LEAD" }
              as: OutfitterManager
            - call: "POST /trips/${trip_id}/open"
              payload: {}
              as: OutfitterManager
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { trip_v: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 2, deposit_cents: 6000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Reservationist
              captures: { fs_after_confirm: $.data.fulfillment_status, ps_after_confirm: $.data.payment_status }
            - call: "POST /reservations/${res_id}/pay-deposit"
              payload: {}
              as: Reservationist
              captures: { fs_after_pay: $.data.fulfillment_status, ps_after_pay: $.data.payment_status }
          assert:
            - "After confirm: Reservation.${res_id}.fulfillment_status == CONFIRMED and payment_status == UNPAID"
            - "After pay-deposit: Reservation.${res_id}.payment_status == DEPOSIT_PAID and fulfillment_status == CONFIRMED"

      - name: trip_cyclic_full_then_reopen_on_cancel
        grounds:
          - state_machines.RiverTrip.OPEN_to_FULL
          - state_machines.RiverTrip.FULL_to_OPEN
          - entities.RiverTrip.fields.status
        distinguishing_aspect: |
          RiverTrip cycles: confirming a party that fills max_capacity=2 drives OPEN -> FULL; cancelling that
          reservation drives FULL -> OPEN again (a genuine A->B->A cycle on a different entity than Reservation).
        test_recipe:
          setup:
            - "CLASS_III trip OPEN with 1 guide, max_capacity=2; a Reservation party_size=2 is CONFIRMED, driving the trip to FULL."
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Deschutes", difficulty_class: "CLASS_III", trip_date: "2026-06-20T09:00:00Z", end_time: "2026-06-20T15:00:00Z", put_in_location: "Warm", take_out_location: "Trout", max_capacity: 2, guide_ratio_max: 6, base_rate_cents: 12000, min_age: 12, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "G", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { guide_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${guide_id}", role: "LEAD" }
              as: OutfitterManager
            - call: "POST /trips/${trip_id}/open"
              payload: {}
              as: OutfitterManager
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { trip_v: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 2, deposit_cents: 6000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Reservationist
          trigger:
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { status_full: $.data.status }
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: Reservationist
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { status_reopen: $.data.status }
          assert:
            - "Before cancel: RiverTrip.${trip_id}.status == FULL"
            - "After cancel: RiverTrip.${trip_id}.status == OPEN"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: unsafe_reading_cancels_trip_releases_gear_depth4
        grounds:
          - state_machines.RiverTrip.OPEN_to_CANCELLED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.GearAssignment.ASSIGNED_to_RELEASED
          - state_machines.GearItem.ASSIGNED_to_AVAILABLE
          - calculations.flow_safety_band
        distinguishing_aspect: |
          Depth-4 chain triggered by a single UNSAFE reading: RiverConditionReading -> RiverTrip CANCELLED ->
          Reservation CANCELLED/REFUNDED -> that reservation's GearAssignment RELEASED -> its GearItem AVAILABLE;
          each hop is caused by the prior hop, not by the reading directly.
        test_recipe:
          setup:
            - "CLASS_III trip OPEN with 1 guide; one Reservation CONFIRMED with a guest holding an ASSIGNED PFD and DEPOSIT_PAID."
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Chattooga", difficulty_class: "CLASS_III", trip_date: "2026-06-21T09:00:00Z", end_time: "2026-06-21T15:00:00Z", put_in_location: "Earls", take_out_location: "US76", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, min_age: 12, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "G", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { guide_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${guide_id}", role: "LEAD" }
              as: OutfitterManager
            - call: "POST /trips/${trip_id}/open"
              payload: {}
              as: OutfitterManager
            - call: "POST /gear-items"
              payload: { gear_type: "PFD", size_label: "L", min_weight_lbs: 100, max_weight_lbs: 250 }
              as: OutfitterManager
              captures: { pfd_id: $.data.id }
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { trip_v: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 1, deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id }
            - call: "POST /guests"
              payload: { reservation_id: "${res_id}", full_name: "Ed", age: 29, weight_lbs: 200 }
              as: Reservationist
              captures: { guest_id: $.data.id }
            - call: "POST /gear-assignments"
              payload: { gear_item_id: "${pfd_id}", guest_id: "${guest_id}", trip_id: "${trip_id}" }
              as: Reservationist
              captures: { gasg_id: $.data.id }
            - call: "POST /reservations/${res_id}/pay-deposit"
              payload: {}
              as: Reservationist
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Reservationist
          trigger:
