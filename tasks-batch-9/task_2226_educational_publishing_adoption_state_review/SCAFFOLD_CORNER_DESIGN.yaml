            - "HTTP status == 409"
            - "error_id == ERR_SUBMISSION_STATE_INVALID"
            - "GET /submissions/${sub_id}/correlations returns total_count 1"
            - "AdoptionCycle.${cyc_id}.submission_count == 0"

      - name: panel_close_session_marks_reserved_slot_no_show
