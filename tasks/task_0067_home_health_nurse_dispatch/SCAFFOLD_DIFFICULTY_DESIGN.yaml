              as: IntakeCoordinator
              captures: { soc_id: $.data.id }
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "START_OF_CARE", assessment_date: "2026-02-09T08:00:00Z", clinical_group: "WOUND", functional_level: "HIGH", comorbidity_count: 2 }
