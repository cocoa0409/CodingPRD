            - "Session B (party 1) rejected: error_id == ERR_WINDOW_CAPACITY_FULL (30 + 1 > 30), HTTP 422"

      - name: tare_exactly_equals_gross_zero_net
        grounds:
          - calculations.weigh_out_total
          - entities.HarvestLine.fields.net_oz
          - errors[ERR_TARE_EXCEEDS_GROSS]
        distinguishing_aspect: |
          Metric: weight arithmetic via POST /farm/harvest-lines (distinct
          metric and endpoint from the slot-count instance). net_oz == 0 is a
          VALID zero-quantity line charging 0 cents; net_oz == -1 is
          ERR_TARE_EXCEEDS_GROSS — the boundary sits exactly at zero.
        test_recipe:
          setup:
            - "Weekday 2026-08-04; policy A; crop 480 c/lb; session party 1 containers 0 (admission 650), paid, FIELD_ACTIVE"
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 650, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager, captures: { pol_id: $.data.id } }
