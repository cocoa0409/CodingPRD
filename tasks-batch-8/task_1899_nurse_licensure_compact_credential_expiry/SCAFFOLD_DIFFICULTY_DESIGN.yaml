          - errors[ERR_SHIFT_OVERLAP]
          - errors[ERR_SHIFT_IN_PAST]
        distinguishing_aspect: |
          Category pair business_constraint vs business_temporal: the request overlaps the nurse's
          existing SCHEDULED shift (priority 7) AND starts in the past (priority 8); the constraint
          error ERR_SHIFT_OVERLAP MUST win. Distinct category pair from the state/safety sibling.
