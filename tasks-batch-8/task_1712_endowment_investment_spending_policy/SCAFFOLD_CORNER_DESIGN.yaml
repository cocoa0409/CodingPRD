  # ===================== Section: validations =====================
  - section: validations
    instances:
      - name: activation_minimum_boundary_4999999_fails_5000000_passes
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_MINIMUM_FUNDING_NOT_MET]"]
        distinguishing_aspect: "The activation floor is inclusive: pledged corpus 4999999 cents is rejected; adding a 1-cent pledge reaches exactly 5000000 and activates (>=, not >)."
        test_recipe:
          setup: ["pool; fund FMIN (DRAFT) with one CORPUS pledge of 4999999"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool MN", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { mn_pool: $.data.id } }
            - { call: "POST /endowment/funds", payload: { pool_id: "${mn_pool}", fund_code: "FMIN", fund_name: "Fund MN", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { mn_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D MN", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { mn_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${mn_fund}", donor_id: "${mn_donor}", external_ref: "MN1", gift_type: CORPUS, amount_cents: 4999999 }, as: DevelopmentOfficer, captures: { mn_g1: $.data.id } }
          trigger:
            - { call: "POST /endowment/funds/${mn_fund}/activate", payload: {}, as: DevelopmentOfficer, captures: { mn_err: $.data.error_id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${mn_fund}", donor_id: "${mn_donor}", external_ref: "MN2", gift_type: CORPUS, amount_cents: 1 }, as: DevelopmentOfficer }
            - { call: "POST /endowment/funds/${mn_fund}/activate", payload: {}, as: DevelopmentOfficer, captures: { mn_ok: $.data.fund_status, mn_aq: $.data.activated_quarter_index } }
          assert:
            - "first activate: http 422 ERR_MINIMUM_FUNDING_NOT_MET (4999999 < 5000000)"
            - "after a 1-cent CORPUS pledge (pledged == 5000000 exactly): activate succeeds, fund_status == ACTIVE, activated_quarter_index == 1"

      - name: policy_parameter_ranges_enforced
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_POLICY_PARAM_OUT_OF_RANGE]"]
        distinguishing_aspect: "spending_rate_bps 2001 (above the 2000 cap) and smoothing_window_quarters 3 (below the 4 floor) are each rejected; the boundary values 2000 and 4 pass."
        test_recipe:
          setup: ["one pool"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool PR", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { pr_pool: $.data.id } }
          trigger:
            - { call: "POST /endowment/policies", payload: { pool_id: "${pr_pool}", spending_rate_bps: 2001, smoothing_window_quarters: 12, band_floor_bps: 0, band_cap_bps: 10000, effective_from_fiscal_year: 2026 }, as: InvestmentOfficer, captures: { pr_err1: $.data.error_id } }
            - { call: "POST /endowment/policies", payload: { pool_id: "${pr_pool}", spending_rate_bps: 500, smoothing_window_quarters: 3, band_floor_bps: 0, band_cap_bps: 10000, effective_from_fiscal_year: 2026 }, as: InvestmentOfficer, captures: { pr_err2: $.data.error_id } }
            - { call: "POST /endowment/policies", payload: { pool_id: "${pr_pool}", spending_rate_bps: 2000, smoothing_window_quarters: 4, band_floor_bps: 0, band_cap_bps: 10000, effective_from_fiscal_year: 2026 }, as: InvestmentOfficer, captures: { pr_ok: $.data.policy_status } }
          assert:
            - "first two creates: http 422 ERR_POLICY_PARAM_OUT_OF_RANGE"
            - "boundary create (rate 2000, window 4): 201 with policy_status == DRAFT"

      - name: allocation_targets_must_sum_to_exactly_10000
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_ALLOCATION_SUM_INVALID]"]
        distinguishing_aspect: "A bulk set summing to 9999 bps is rejected atomically (no rows written); 10000 succeeds; a duplicate asset_class inside one request is a uniqueness violation."
        test_recipe:
          setup: ["one pool"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool AS", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { as_pool: $.data.id } }
          trigger:
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${as_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 5999, rebalance_band_bps: 500 }, { asset_class: CASH, target_pct_bps: 4000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin, captures: { as_err1: $.data.error_id } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${as_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 5000, rebalance_band_bps: 500 }, { asset_class: US_EQUITY, target_pct_bps: 5000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin, captures: { as_err2: $.data.error_id } }
