scaffold_difficulty_design:

  # ============================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: earnings_ratio_pre_vs_post_disbursal_divergence
        grounds:
          - calculations.earnings_ratio
          - state_machines.Withdrawal.SUBMITTED_to_APPROVED
          - endpoints["GET /withdrawals/{id}/audit"]
          - entities.Withdrawal.fields.basis_portion_cents
          - entities.Withdrawal.fields.earnings_portion_cents
        distinguishing_aspect: |
          Same Withdrawal, two variants of earnings_ratio: pre_disbursal (pinned at
          APPROVED against pre-withdrawal Account balances) vs post_disbursal_audit
          (recomputed at /audit against CURRENT Account balances after a later
          contribution and disbursal shifted basis/earnings mix). The two values
          differ on Withdrawal w1: pinned earnings_portion_cents=40000 vs audit
          earnings_portion_cents=26667. This is the Withdrawal entity domain.
        test_recipe:
          setup:
            - "Donor d1 (CA, email d1@x.com). Beneficiary b1. Account a1 OPEN, donor=d1, beneficiary=b1."
            - "Two contributions of 300000 cents posted on a1; market earnings credit of 200000 cents."
            - "Pre-W1 state: balance=500000 basis=300000 earnings=200000."
            - "W1 amount=100000 expense_class=NON_QUALIFIED is approved (pinning earnings_portion=40000 basis_portion=60000) then disbursed (balance=400000 basis=240000 earnings=160000)."
            - "A new contribution of 200000 is posted on a1 (balance=600000 basis=440000 earnings=160000)."
            - "Then /withdrawals/{w1}/audit is called — it must report basis_portion 73333 / earnings_portion 26667 against CURRENT account totals, distinct from the pinned 60000/40000 on w1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "D1", state_code: "CA", federal_tax_id_last4: "1111", email: "d1@x.com" }
              as: CustodianAgent
              captures: { d1_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B1", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b1_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d1_id}", beneficiary_id: "${b1_id}" }
              as: CustodianAgent
              captures: { a1_id: $.data.id }
            - call: "POST /contributions"
              payload: { account_id: "${a1_id}", amount_cents: 300000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c1_id: $.data.id }
            - call: "POST /contributions/${c1_id}/post"
              payload: {}
              as: CustodianAgent
            - call: "POST /_market/credit_earnings"
              payload: { account_id: "${a1_id}", delta_cents: 200000 }
              as: CustodianAgent
              captures: { a1_v_after_market: $.data.version }
            - call: "POST /withdrawals"
              payload: { account_id: "${a1_id}", amount_cents: 100000, expense_class: "NON_QUALIFIED" }
              as: AccountOwner
              as_user_id: "${d1_id}"
              captures: { w1_id: $.data.id }
            - call: "POST /withdrawals/${w1_id}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${d1_id}"
            - call: "POST /withdrawals/${w1_id}/approve"
              payload: { expected_account_version: "${a1_v_after_market}" }
              as: ComplianceOfficer
              captures: { w1_basis: $.data.basis_portion_cents, w1_earnings: $.data.earnings_portion_cents, w1_penalty: $.data.penalty_cents, a1_v_after_approve: $.data.version }
            - call: "POST /withdrawals/${w1_id}/disburse"
              payload: {}
              as: CustodianAgent
            - call: "POST /contributions"
              payload: { account_id: "${a1_id}", amount_cents: 200000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c2_id: $.data.id }
            - call: "POST /contributions/${c2_id}/post"
              payload: {}
              as: CustodianAgent
          trigger:
            - call: "GET /withdrawals/${w1_id}/audit"
              payload: {}
              as: ComplianceOfficer
              captures: { audit_basis: $.data.basis_portion_cents, audit_earnings: $.data.earnings_portion_cents }
          assert:
            - "Withdrawal.${w1_id}.basis_portion_cents == 60000"
            - "Withdrawal.${w1_id}.earnings_portion_cents == 40000"
            - "Withdrawal.${w1_id}.penalty_cents == 4000"
            - "audit response data.basis_portion_cents == 73333"
            - "audit response data.earnings_portion_cents == 26667"
            - "Withdrawal.${w1_id} stored basis_portion_cents UNCHANGED after audit (still 60000)"

      - name: state_tax_incentive_ca_cap_vs_ny_tiered_divergence
        grounds:
          - calculations.state_tax_incentive_match
          - entities.Donor.fields.state_code
          - entities.StateTaxIncentive.fields.match_cents
          - endpoints["POST /state-tax-incentives/{id}/calculate"]
        distinguishing_aspect: |
          Same contributions_eligible_cents value (800000), two different algorithmic
          variants of state_tax_incentive_match keyed on Donor.state_code: CA uses
          tier-cap-then-rate (match=60000), NY uses tiered marginal (match=31000).
          This is the Donor entity domain, distinct from the Withdrawal-domain
          instance above.
        test_recipe:
          setup:
            - "Two donors with identical contribution profile but different state_code."
            - "Donor d_ca (CA) and Donor d_ny (NY). Each owns one account."
            - "Each account receives 800000 cents in posted contributions in tax_year 2026."
            - "A StateTaxIncentive is created for each (donor, 2026) and calculated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "D CA", state_code: "CA", federal_tax_id_last4: "1111", email: "dca@x.com" }
              as: CustodianAgent
              captures: { d_ca_id: $.data.id }
            - call: "POST /donors"
              payload: { full_name: "D NY", state_code: "NY", federal_tax_id_last4: "2222", email: "dny@x.com" }
              as: CustodianAgent
              captures: { d_ny_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B CA", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "3333" }
              as: CustodianAgent
              captures: { b_ca_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B NY", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "4444" }
              as: CustodianAgent
              captures: { b_ny_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_ca_id}", beneficiary_id: "${b_ca_id}" }
              as: CustodianAgent
              captures: { a_ca_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_ny_id}", beneficiary_id: "${b_ny_id}" }
              as: CustodianAgent
              captures: { a_ny_id: $.data.id }
            - call: "POST /contributions"
              payload: { account_id: "${a_ca_id}", amount_cents: 800000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c_ca_id: $.data.id }
            - call: "POST /contributions/${c_ca_id}/post"
              payload: {}
              as: CustodianAgent
            - call: "POST /contributions"
              payload: { account_id: "${a_ny_id}", amount_cents: 800000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c_ny_id: $.data.id }
            - call: "POST /contributions/${c_ny_id}/post"
              payload: {}
              as: CustodianAgent
            - call: "POST /state-tax-incentives"
              payload: { donor_id: "${d_ca_id}", tax_year: 2026 }
              as: CustodianAgent
              captures: { sti_ca_id: $.data.id }
            - call: "POST /state-tax-incentives"
              payload: { donor_id: "${d_ny_id}", tax_year: 2026 }
              as: CustodianAgent
              captures: { sti_ny_id: $.data.id }
          trigger:
            - call: "POST /state-tax-incentives/${sti_ca_id}/calculate"
              payload: {}
              as: CustodianAgent
              captures: { ca_match: $.data.match_cents }
            - call: "POST /state-tax-incentives/${sti_ny_id}/calculate"
              payload: {}
              as: CustodianAgent
              captures: { ny_match: $.data.match_cents }
          assert:
            - "StateTaxIncentive.${sti_ca_id}.match_cents == 60000"
            - "StateTaxIncentive.${sti_ny_id}.match_cents == 31000"
            - "StateTaxIncentive.${sti_ca_id}.status == CALCULATED"
            - "StateTaxIncentive.${sti_ny_id}.status == CALCULATED"

  # ============================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: excess_withdrawal_penalty_multi_input_nonlinear
        grounds:
          - calculations.excess_withdrawal_penalty
          - calculations.k12_excess_calc
          - calculations.earnings_ratio
          - state_machines.Withdrawal.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (a): a single formula with ≥3 inputs (amount_cents, earnings_portion_cents,
          expense_class, k12_excess_cents) that interact non-linearly via a conditional
          branch on expense_class — NON_QUAL takes the full earnings portion as the
          penalty base; K_12_TUITION pro-rates the earnings portion by the
          k12_excess fraction. The formula nests three rounding steps
          (earnings_ratio rhu, penalty_base pro-rate rhu, 10% rate rhu).
        test_recipe:
          setup:
            - "Account a1 with two posted contributions totalling 2000000 and a market-earnings credit of 1000000 (balance=3000000 basis=2000000 earnings=1000000)."
            - "W1 K_12_TUITION amount=600000 approved+disbursed first (ytd_k12 becomes 600000, k12_excess=0, penalty=0)."
            - "After W1 disburse: balance=2400000 basis=1600000 earnings=800000."
            - "W2 K_12_TUITION amount=600000 is approved: projected ytd=1200000, k12_excess=200000."
            - "earnings_portion for W2 = round_half_up(600000*800000/2400000) = 200000."
            - "penalty_base = round_half_up(200000*200000/600000) = 66667; penalty = round_half_up(66667*0.10) = 6667."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "D2", state_code: "CA", federal_tax_id_last4: "1111", email: "d2@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B2", date_of_birth: "2015-01-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "POST /contributions"
              payload: { account_id: "${a_id}", amount_cents: 1000000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c1_id: $.data.id }
            - call: "POST /contributions/${c1_id}/post"
              payload: {}
              as: CustodianAgent
            - call: "POST /contributions"
              payload: { account_id: "${a_id}", amount_cents: 1000000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c2_id: $.data.id }
            - call: "POST /contributions/${c2_id}/post"
              payload: {}
              as: CustodianAgent
            - call: "POST /_market/credit_earnings"
              payload: { account_id: "${a_id}", delta_cents: 1000000 }
              as: CustodianAgent
              captures: { a_v1: $.data.version }
            - call: "POST /withdrawals"
              payload: { account_id: "${a_id}", amount_cents: 600000, expense_class: "K_12_TUITION" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { w1_id: $.data.id }
            - call: "POST /withdrawals/${w1_id}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
            - call: "POST /withdrawals/${w1_id}/approve"
              payload: { expected_account_version: "${a_v1}" }
              as: ComplianceOfficer
              captures: { a_v2: $.data.version }
            - call: "POST /withdrawals/${w1_id}/disburse"
              payload: {}
              as: CustodianAgent
              captures: { a_v3: $.data.version }
            - call: "POST /withdrawals"
              payload: { account_id: "${a_id}", amount_cents: 600000, expense_class: "K_12_TUITION" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { w2_id: $.data.id }
            - call: "POST /withdrawals/${w2_id}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
          trigger:
            - call: "POST /withdrawals/${w2_id}/approve"
              payload: { expected_account_version: "${a_v3}" }
              as: ComplianceOfficer
              captures: { w2_earnings: $.data.earnings_portion_cents, w2_basis: $.data.basis_portion_cents, w2_k12: $.data.k12_excess_cents, w2_pen: $.data.penalty_cents }
          assert:
            - "Withdrawal.${w2_id}.earnings_portion_cents == 200000"
            - "Withdrawal.${w2_id}.basis_portion_cents == 400000"
            - "Withdrawal.${w2_id}.k12_excess_cents == 200000"
            - "Withdrawal.${w2_id}.penalty_cents == 6667"

      - name: ny_tiered_match_pinned_per_tier_rounding_order
        grounds:
          - calculations.state_tax_incentive_match
          - constants.NY_TIER1_CENTS
          - constants.NY_TIER2_CENTS
        distinguishing_aspect: |
          Mode (b): nested rounding where the order matters. NY match uses
          per-tier round_half_up then sum, NOT sum-then-round. With
          contributions_eligible_cents=800000 the pinned order produces
          round_half_up(500000*0.05) + round_half_up(300000*0.02) = 25000 + 6000 = 31000.
          Sum-then-round would produce round_half_up(500000*0.05 + 300000*0.02) =
          round_half_up(31000) = 31000 (coincides) — but at contributions=1000000
          per-tier gives 25000+10000=35000 vs sum-then-round gives same 35000. The
          pinned ordering is the contract regardless of whether instances coincide,
          and is structurally distinct from mode (a) above (no branching on entity
          state, no ≥3-input nonlinearity — purely a rounding-order question).
        test_recipe:
          setup:
            - "NY donor with 1000000 cents posted in 2026 — exactly at NY_TIER2_CENTS boundary."
            - "tier1=500000 -> rounded match 25000; tier2=500000 -> rounded match 10000; total 35000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "D NY2", state_code: "NY", federal_tax_id_last4: "1111", email: "dny2@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B NY2", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "POST /contributions"
              payload: { account_id: "${a_id}", amount_cents: 1000000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c_id: $.data.id }
            - call: "POST /contributions/${c_id}/post"
              payload: {}
              as: CustodianAgent
            - call: "POST /state-tax-incentives"
              payload: { donor_id: "${d_id}", tax_year: 2026 }
              as: CustodianAgent
              captures: { sti_id: $.data.id }
          trigger:
            - call: "POST /state-tax-incentives/${sti_id}/calculate"
              payload: {}
              as: CustodianAgent
              captures: { match: $.data.match_cents }
          assert:
            - "StateTaxIncentive.${sti_id}.match_cents == 35000"
            - "StateTaxIncentive.${sti_id}.contributions_eligible_cents == 1000000"

  # ============================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ============================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: withdrawal_branching_with_revert_rejected_to_draft_cycle
        grounds:
          - state_machines.Withdrawal.SUBMITTED_to_REJECTED
          - state_machines.Withdrawal.REJECTED_to_DRAFT
          - state_machines.Withdrawal.SUBMITTED_to_APPROVED
          - validations[priority=16]
        distinguishing_aspect: |
          Withdrawal exhibits non-linear shape: branching-with-revert.
          SUBMITTED → {REJECTED, APPROVED}; from REJECTED a /revise loops back
          to DRAFT (up to rejection_count < 3). Linear A→B→C→D pipelines
          cannot reproduce this revert cycle.
        test_recipe:
          setup:
            - "Account a with balance=200000 (one posted contribution)."
            - "Withdrawal w1 in DRAFT submitted → SUBMITTED → /reject → REJECTED → /revise → DRAFT → /submit → SUBMITTED."
            - "rejection_count == 1 after this cycle."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "D3", state_code: "CA", federal_tax_id_last4: "1111", email: "d3@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B3", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "POST /contributions"
              payload: { account_id: "${a_id}", amount_cents: 200000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c_id: $.data.id }
            - call: "POST /contributions/${c_id}/post"
              payload: {}
              as: CustodianAgent
            - call: "POST /withdrawals"
              payload: { account_id: "${a_id}", amount_cents: 50000, expense_class: "HIGHER_ED_TUITION" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { w_id: $.data.id }
            - call: "POST /withdrawals/${w_id}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
            - call: "POST /withdrawals/${w_id}/reject"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /withdrawals/${w_id}/revise"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { w_status: $.data.status, w_count: $.data.rejection_count }
            - call: "POST /withdrawals/${w_id}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { w_status2: $.data.status }
          assert:
            - "Withdrawal.${w_id}.status == SUBMITTED"
            - "Withdrawal.${w_id}.rejection_count == 1"

      - name: beneficiary_change_branching_pending_to_approved_or_rejected
        grounds:
          - state_machines.BeneficiaryChange.PENDING_to_APPROVED
          - state_machines.BeneficiaryChange.PENDING_to_REJECTED
          - entities.Account.fields.beneficiary_id
        distinguishing_aspect: |
          BeneficiaryChange is a branching state machine: PENDING fans out to
          {APPROVED, REJECTED} with divergent side effects — APPROVED mutates
          Account.beneficiary_id; REJECTED leaves it untouched. Different
          entity (BeneficiaryChange) from Rule-3 instance 1 (Withdrawal).
        test_recipe:
          setup:
            - "Donor d, two Beneficiaries b1 (initial) and b2 (proposed CHILD)."
            - "Account a OPEN with beneficiary_id=b1."
            - "BeneficiaryChange bc1 (PENDING) created targeting b2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "D4", state_code: "CA", federal_tax_id_last4: "1111", email: "d4@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B1", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b1_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B2", date_of_birth: "2010-06-01", relationship_class: "CHILD", federal_tax_id_last4: "3333" }
              as: CustodianAgent
              captures: { b2_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b1_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /beneficiary-changes"
              payload: { account_id: "${a_id}", to_beneficiary_id: "${b2_id}" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { bc_id: $.data.id }
          trigger:
            - call: "POST /beneficiary-changes/${bc_id}/approve"
              payload: { expected_account_version: "${a_v}" }
              as: ComplianceOfficer
              captures: { bc_status: $.data.status, a_v2: $.data.version }
          assert:
            - "BeneficiaryChange.${bc_id}.status == APPROVED"
            - "Account.${a_id}.beneficiary_id == ${b2_id}"
            - "Account.${a_id}.version == ${a_v} + 1"

  # ============================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ============================================================
  - rule_id: transitive_cascade
    instances:
      - name: contribution_post_cascade_to_state_tax_incentive_via_account
        grounds:
          - state_machines.Contribution.DRAFT_to_POSTED
          - entities.Account.fields.account_balance_cents
          - entities.Account.fields.total_basis_cents
          - entities.StateTaxIncentive.fields.contributions_eligible_cents
        distinguishing_aspect: |
          Depth-3 cascade triggered by Contribution DRAFT→POSTED. Hop 1:
          Contribution.status mutates. Hop 2 (caused by hop 1): Account ledger
          fields recomputed (account_balance_cents, total_basis_cents,
          total_earnings_cents, version). Hop 3 (caused by hop 2 on Account):
          StateTaxIncentive(donor_id, tax_year).contributions_eligible_cents
          re-aggregated. Each link is caused by the previous link — Hop 3 reads
          Account totals updated by Hop 2.
        test_recipe:
          setup:
            - "Donor d (CA), Beneficiary b, Account a OPEN."
            - "StateTaxIncentive sti for (d, 2026) DRAFT, contributions_eligible_cents=0."
