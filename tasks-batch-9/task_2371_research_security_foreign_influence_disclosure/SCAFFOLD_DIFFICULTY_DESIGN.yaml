      - name: committed_effort_percentage_returns_to_24_99_after_add_and_remove
        grounds:
          - calculations.investigator_commitment_totals
          - state_machines.ProjectPersonnel.PROPOSED_to_ACTIVE
          - state_machines.ProjectPersonnel.ACTIVE_to_REMOVED
          - entities.Investigator.fields.committed_effort_pct
          - entities.Investigator.fields.total_commitment_pct
        distinguishing_aspect: |
          The conserved quantity is a rounded percentage, not a headcount: three ACTIVE rows hold
          committed_effort_pct at exactly 24.99, adding a fourth identical row takes it to 33.32,
          and removing that row must land back on exactly 24.99. Any implementation that keeps a
          running total and subtracts an unrounded 8.3333 drifts to 24.9867 or 25.00 and never
          returns to the original value.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "Investigator INV with institutional_base_effort_pct 0 and no disclosure items."
            - "Four STANDARD projects P1..P4, each with a PROPOSED personnel row for INV at 1.00 committed_person_months; P1..P3 already ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /investigators"
              payload: { full_name: "Xan Yilmaz", email: "xan.yilmaz@uni.edu", appointment_type: "FACULTY", home_department: "Statistics", institutional_base_effort_pct: 0 }
              as: SystemAdmin
