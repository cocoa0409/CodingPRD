            - "Brand.${brand_id}.dilution_consumed_bps == 1300 (0 core + 750 + 550)"
            - "Brand.${brand_id}.core_identity_share_bps == 8700"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: product_line_brand_review_revision_loop
        grounds:
          - state_machines.ProductLine.FORMULATION_to_FORMULATION
          - state_machines.ProductLine.FORMULATION_to_PILOT
          - entities.ProductLine.fields.brand_review_attempts
        distinguishing_aspect: "Cyclic machine on ProductLine: FORMULATION -> FORMULATION revision loops (attempts 1 and 2) precede a successful APPROVE to PILOT, and brand_review_attempts survives the loop at 2."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z. Brand with line EXT-R in FORMULATION and a SEALED formulation."
          setup_api_calls:
            - *c_brand
            - call: "POST /brand-ops/brands/${brand_id}/product-lines"
              payload: { line_code: "EXT-R", name: "Revision Loop Line", is_core: false, target_channels: ["HARDWARE"] }
              as: BrandManager
              captures: { line_id: $.data.id }
            - *c_form
            - *c_seal
          trigger:
            - call: "POST /brand-ops/product-lines/${line_id}/brand-review"
              payload: { decision: "REJECT" }
              as: BrandManager
              captures: { st1: $.data.status, att1: $.data.brand_review_attempts }
            - call: "POST /brand-ops/product-lines/${line_id}/brand-review"
              payload: { decision: "REJECT" }
              as: BrandManager
              captures: { st2: $.data.status, att2: $.data.brand_review_attempts }
            - call: "POST /brand-ops/product-lines/${line_id}/brand-review"
              payload: { decision: "APPROVE" }
              as: BrandManager
              captures: { st3: $.data.status, att3: $.data.brand_review_attempts }
          assert:
            - "first REJECT: status == FORMULATION and brand_review_attempts == 1 (loop, no state change)"
            - "second REJECT: status == FORMULATION and brand_review_attempts == 2"
            - "APPROVE after the loop: status == PILOT and brand_review_attempts stays 2"
            - "the sealed formulation satisfied the APPROVE gate even after two rejections"

      - name: distributor_suspend_reinstate_cycle
        grounds:
          - state_machines.Distributor.APPROVED_to_SUSPENDED
          - state_machines.Distributor.SUSPENDED_to_APPROVED
          - state_machines.CoverageAssignment.ACTIVE_to_SUSPENDED
          - state_machines.CoverageAssignment.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "Cyclic machine on Distributor: APPROVED -> SUSPENDED -> APPROVED via manual suspend/reinstate, while the assignment cascade is NOT symmetric — reinstatement leaves assignments SUSPENDED until individually resumed."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z."
            - "Brand with LAUNCHED core line; distributor APPROVED with one ACTIVE non-exclusive assignment."
          setup_api_calls:
            - *c_brand
            - *c_market
            - *c_mfr1
            - *c_mfr1q
            - *c_mfr2
            - *c_mfr2q
            - *c_line_core
            - *c_form
            - *c_seal
            - *c_g1
            - *c_g1g
            - *c_g1a
            - *c_g2
            - *c_g2g
            - *c_g2a
            - *c_review
            - *c_pack
            - *c_tool
            - *c_price
            - *c_enterprod
            - *c_launch
            - *c_dist
            - *c_dist_app
            - call: "POST /brand-ops/distributors/${dist_id}/coverage-assignments"
              payload: { market_id: "${market_id}", product_line_id: "${line_id}", channel: "HARDWARE", exclusive: false, starts_on: "2026-08-01", ends_on: "2027-07-31", annual_quota_units: 1200, expected_distributor_version: "${dist_v2}" }
              as: ChannelManager
              captures: { asg_id: $.data.id }
            - *c_asg_act
          trigger:
            - call: "POST /brand-ops/distributors/${dist_id}/suspend"
              payload: {}
              as: ChannelManager
              captures: { d_st1: $.data.status, d_cnt1: $.data.suspension_count }
            - call: "POST /brand-ops/distributors/${dist_id}/reinstate"
              payload: {}
              as: ChannelManager
              captures: { d_st2: $.data.status }
            - call: "POST /brand-ops/coverage-assignments/${asg_id}/resume"
              payload: {}
              as: ChannelManager
              captures: { a_st3: $.data.status }
          assert:
            - "after manual suspend: distributor status SUSPENDED, suspension_count == 1"
            - "the suspension cascaded: CoverageAssignment.${asg_id}.status == SUSPENDED"
            - "after reinstate: distributor status APPROVED"
            - "before the resume call the assignment is still SUSPENDED (reinstate does not cascade back)"
            - "after resume: assignment status ACTIVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: breach_revocation_cascade_manufacturer_grants_formulation
        grounds:
          - state_machines.ConfidentialityGrant.ACTIVE_to_REVOKED
          - state_machines.ContractManufacturer.QUALIFIED_to_SUSPENDED
          - state_machines.Formulation.COMPARTMENTALIZED_to_SEALED
          - calculations.component_coverage
          - calculations.brand_protection_posture
        distinguishing_aspect: "Depth-3 cascade triggered by a for-cause revoke: grant revocation suspends the manufacturer (link 1), the suspension revokes that manufacturer's OTHER grants for cause (link 2), and the lost coverage regresses the formulation COMPARTMENTALIZED -> SEALED (link 3) — proven by g1b.revoked_for_cause == true although only g1a was revoked by the call."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z."
            - "Brand with line CORE; formulation F [C1..C4] COMPARTMENTALIZED via mfr1 ACTIVE grants g1a {C1}, g1b {C2} and mfr2 ACTIVE grant g2 {C3, C4}."
            - "All grants granted by user tso-1; the revoker is user ca-1 (segregation satisfied)."
          setup_api_calls:
            - *c_brand
            - *c_mfr1
            - *c_mfr1q
            - *c_mfr2
            - *c_mfr2q
            - *c_line_core
            - *c_form
            - *c_seal
            - call: "POST /brand-ops/confidentiality-grants"
              payload: { manufacturer_id: "${mfr1_id}", formulation_id: "${form_id}", component_scope: ["C1"], expires_on: "2027-12-31T00:00:00Z", grant_reason: "PRODUCTION" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { g1a_id: $.data.id }
            - call: "POST /brand-ops/confidentiality-grants/${g1a_id}/grant"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - call: "POST /brand-ops/confidentiality-grants/${g1a_id}/activate"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - call: "POST /brand-ops/confidentiality-grants"
              payload: { manufacturer_id: "${mfr1_id}", formulation_id: "${form_id}", component_scope: ["C2"], expires_on: "2027-12-31T00:00:00Z", grant_reason: "PRODUCTION" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { g1b_id: $.data.id }
            - call: "POST /brand-ops/confidentiality-grants/${g1b_id}/grant"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - call: "POST /brand-ops/confidentiality-grants/${g1b_id}/activate"
              payload: {}
              as: TradeSecretOfficer
              as_user_id: "tso-1"
            - *c_g2
            - *c_g2g
            - *c_g2a
            - call: "GET /brand-ops/formulations/${form_id}"
              payload: {}
              as: TradeSecretOfficer
              captures: { form_status_pre: $.data.status }
          trigger:
            - call: "POST /brand-ops/confidentiality-grants/${g1a_id}/revoke"
              payload: { for_cause: true }
              as: ComplianceAuditor
              as_user_id: "ca-1"
          assert:
            - "pre-trigger, formulation status was COMPARTMENTALIZED"
            - "Grant.${g1a_id}.status == REVOKED and revoked_for_cause == true (the direct target)"
            - "ContractManufacturer.${mfr1_id}.status == SUSPENDED (cascade link 1)"
            - "Grant.${g1b_id}.status == REVOKED and revoked_for_cause == true (cascade link 2 — never touched by the request)"
            - "Grant.${g2_id} remains ACTIVE (mfr2 untouched)"
            - "Formulation.${form_id}.status == SEALED (cascade link 3: coverage of C1/C2 lost)"
            - "ContractManufacturer.${mfr1_id}.disclosed_component_count == 0"
            - "Brand.${brand_id}.protection_posture == CRITICAL (two for-cause revocations within 180 days)"

      - name: sanction_attainment_cascade_distributor_assignments
        grounds:
          - calculations.coverage_attainment
          - state_machines.Distributor.APPROVED_to_SUSPENDED
          - state_machines.CoverageAssignment.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "Depth-2 cascade triggered by a sell-through report (a different trigger than the breach cascade): the attainment recomputation flips the tier to SANCTION, which suspends the distributor (link 1), which suspends its ACTIVE assignments (link 2)."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z; window {2026-06, 2026-07, 2026-08}."
            - "Brand with LAUNCHED core line; distributor APPROVED with one ACTIVE assignment, annual_quota_units 1200 (3-month quota 300)."
          setup_api_calls:
            - *c_brand
            - *c_market
            - *c_mfr1
            - *c_mfr1q
            - *c_mfr2
            - *c_mfr2q
            - *c_line_core
            - *c_form
            - *c_seal
            - *c_g1
            - *c_g1g
            - *c_g1a
            - *c_g2
            - *c_g2g
            - *c_g2a
            - *c_review
            - *c_pack
            - *c_tool
            - *c_price
            - *c_enterprod
            - *c_launch
            - *c_dist
            - *c_dist_app
            - call: "POST /brand-ops/distributors/${dist_id}/coverage-assignments"
              payload: { market_id: "${market_id}", product_line_id: "${line_id}", channel: "HARDWARE", exclusive: false, starts_on: "2026-08-01", ends_on: "2027-07-31", annual_quota_units: 1200, expected_distributor_version: "${dist_v2}" }
              as: ChannelManager
              captures: { asg_id: $.data.id }
            - *c_asg_act
          trigger:
            - call: "POST /brand-ops/distributors/${dist_id}/sell-through-reports"
              payload: { coverage_assignment_id: "${asg_id}", period_month: "2026-06", units_sold: 200 }
              as: DistributorContact
              as_user_id: "${dist_id}"
              captures: { report_id: $.data.id }
          assert:
            - "SellThroughReport.${report_id}.net_units == 200"
            - "Distributor.${dist_id}.attainment_actual_bps == 6667 (round_half_up(10000 * 200 / 300))"
            - "Distributor.${dist_id}.quota_compliance_tier == SANCTION (6667 < 9000)"
            - "Distributor.${dist_id}.status == SUSPENDED and suspension_count == 1 (cascade link 1 fired from the report, not from any distributor endpoint)"
            - "CoverageAssignment.${asg_id}.status == SUSPENDED (cascade link 2)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: promo_approve_state_error_trumps_depth_fiscal_error
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - state_machines.Promotion.DRAFT_to_PENDING_APPROVAL
          - calculations.brand_protection_posture
        distinguishing_aspect: "Category pair state-vs-business_fiscal: approving a promotion that is still DRAFT while its 30.00 percent depth would also breach the NORMAL-posture cap must return 409 ERR_INVALID_STATE_TRANSITION (priority 8), never ERR_PROMO_DEPTH_EXCEEDS_CAP (priority 13)."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z; brand posture NORMAL (depth cap 25.00)."
            - "Brand with LAUNCHED line EXT-1; pack with price list 499/300 EFFECTIVE."
            - "Promotion at 30.00% created but never submitted, so it sits in DRAFT; both the state gate (approve needs PENDING_APPROVAL) and the fiscal gate (30.00 > 25.00) are violated."
          setup_api_calls:
            - *c_brand
            - *c_mfr1
            - *c_mfr1q
            - *c_mfr2
            - *c_mfr2q
            - call: "POST /brand-ops/brands/${brand_id}/product-lines"
              payload: { line_code: "EXT-1", name: "Smart Straw Extension", is_core: false, target_channels: ["HARDWARE"] }
              as: BrandManager
              captures: { line_id: $.data.id }
            - *c_form
            - *c_seal
            - *c_g1
            - *c_g1g
            - *c_g1a
            - *c_g2
            - *c_g2g
            - *c_g2a
            - *c_review
            - *c_pack
            - *c_tool
            - *c_price
            - *c_enterprod
            - *c_launch
            - call: "POST /brand-ops/promotions"
              payload: { product_line_id: "${line_id}", channel: "HARDWARE", discount_pct: 30.00, starts_on: "2026-10-01", ends_on: "2026-10-31", funding_budget_cents: 100000 }
              as: PricingAnalyst
              as_user_id: "pa-1"
              captures: { promo_id: $.data.id }
          trigger:
            - call: "POST /brand-ops/promotions/${promo_id}/approve"
              payload: {}
              as: MarketingManager
              as_user_id: "mm-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE_TRANSITION (DRAFT is not a valid from-state for approve)"
            - "error_id != ERR_PROMO_DEPTH_EXCEEDS_CAP even though 30.00 exceeds the NORMAL-posture cap of 25.00"
            - "Promotion.${promo_id}.status remains DRAFT and unit_funding_provisional_cents remains null"

      - name: grant_safety_error_trumps_temporal_window_error
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - endpoints.POST_/brand-ops/confidentiality-grants
        distinguishing_aspect: "Category pair business_safety-vs-business_temporal: a grant request against a VETTING (unqualified) manufacturer with an already-past expires_on must return 409 ERR_MANUFACTURER_NOT_QUALIFIED (priority 9), never the temporal ERR_WINDOW_INVALID (priority 10)."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z."
            - "Brand, line, and a SEALED formulation; a contract manufacturer still in VETTING."
          setup_api_calls:
            - *c_brand
            - *c_line_core
            - *c_form
            - *c_seal
            - call: "POST /brand-ops/contract-manufacturers"
              payload: { legal_name: "Unvetted Packers LLC", site_country: "US", capabilities: ["PACKAGING"] }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { mfr_v_id: $.data.id }
          trigger:
            - call: "POST /brand-ops/confidentiality-grants"
              payload: { manufacturer_id: "${mfr_v_id}", formulation_id: "${form_id}", component_scope: ["C1"], expires_on: "2020-01-01T00:00:00Z", grant_reason: "PRODUCTION" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_MANUFACTURER_NOT_QUALIFIED"
            - "error_id != ERR_WINDOW_INVALID even though expires_on 2020-01-01 is far in the past"
            - "no grant row exists afterwards: GET /brand-ops/confidentiality-grants?manufacturer_id=${mfr_v_id} returns 0 rows"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: promo_depth_exactly_at_posture_cap
        grounds:
          - calculations.brand_protection_posture
          - state_machines.Promotion.PENDING_APPROVAL_to_APPROVED
