            - call: "POST /assessments"
              payload: { audit_id: "${audit_id}" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { asmt_id: "$.data.id" }
            - call: "POST /assessments/${asmt_id}/issue"
              payload: { notice_mailed_date: "2026-06-30" }
              as: AuditSupervisor
