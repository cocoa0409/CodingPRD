      - name: exemption_filing_rejects_an_overlap_but_admits_an_abutting_half_open_interval
        claim_type: cross_entity_validation
        grounds:
          - validations.v_exemption_period_overlap
          - errors.ERR_EXEMPTION_PERIOD_OVERLAP
          - entities.ExemptionCertification.fields.coverage_period_end
        distinguishing_aspect: "Coverage is [start, start+3y) and the overlap test must respect the OPEN upper end: a filing effective 2028-12-31 collides with the approved [2026-01-01, 2029-01-01) window and is refused, while one effective exactly 2029-01-01 abuts it with a zero-length gap and is ACCEPTED. A closed-interval comparison rejects the abutting filing and forces a one-day gap in statutory coverage."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01; ProgramYear 2026 configured"
            - "Ridge Composites (120 employees, WAVE_1) has one APPROVED 401K certification with plan_effective_date 2026-01-01, so its coverage window is [2026-01-01, 2029-01-01)"
            - "Ridge has no OPEN enforcement referral, so the priority-45 hold is not in play"
          setup_api_calls:
