              payload: {}
              as: OfficiatingDirector
              captures: { da_status_end: $.data.status, da_cycles_end: $.data.remediation_cycle_count, da_plan_end: $.data.remediation_plan }
          assert:
            - "${dan_status_pre_disc} == ACTIVE, ${da_status_open} == OPENED and ${da_cycles_open} == 0"
            - "${da_status_c1} == REMEDIATION_ASSIGNED with ${da_cycles_c1} == 1, then ${da_status_r1} == REASSESSED"
            - "${da_status_c2} == REMEDIATION_ASSIGNED with ${da_cycles_c2} == 2, then ${da_status_r2} == REASSESSED — the loop is genuinely cyclic"
            - "the third assign-remediation returns HTTP 409 with ${err_cycle_cap} == ERR_REMEDIATION_CYCLE_LIMIT"
            - "${da_status_end} == REASSESSED, ${da_cycles_end} == 2 and ${da_plan_end} == 'Cycle 2: field mentoring' — the rejected third plan was not stored"
            - "Official.${dan_id}.status == PROBATION throughout the loop"

      - name: discipline_resolve_cleared_returns_official_to_active
        claim_type: valid_transition
        grounds:
          - state_machines.DisciplineAction.OPENED_to_CLEARED
          - state_machines.Official.ACTIVE_to_PROBATION
          - state_machines.Official.PROBATION_to_ACTIVE
          - entities.DisciplineAction.fields.resolution_note
        distinguishing_aspect: "A WARNING action with reason_category PERFORMANCE moves the official ACTIVE -> PROBATION, and resolving it with outcome CLEARED moves the action OPENED -> CLEARED and the official PROBATION -> ACTIVE in the same call."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN and Dan is ACTIVE after a passed rules exam."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_read_dan_v
            - call: "POST /discipline-actions"
              payload: { official_id: "${dan_id}", reason_category: "PERFORMANCE", severity: "WARNING", expected_official_version: "${dan_v1}" }
              as: OfficiatingDirector
              captures: { da_w_id: $.data.id, da_w_status: $.data.status, da_w_games: $.data.suspension_games }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { dan_status_probation: $.data.status }
          trigger:
            - call: "POST /discipline-actions/${da_w_id}/resolve"
              payload: { outcome: "CLEARED", note: "no repeat incidents" }
              as: OfficiatingDirector
              captures: { da_w_status_end: $.data.status, da_w_note_end: $.data.resolution_note }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { dan_status_restored: $.data.status }
          assert:
            - "${da_w_status} == OPENED and ${da_w_games} == null — suspension_games must be null for a WARNING"
            - "${dan_status_probation} == PROBATION — a PERFORMANCE warning is the one WARNING severity that moves status at all"
            - "${da_w_status_end} == CLEARED with ${da_w_note_end} == 'no repeat incidents'"
            - "${dan_status_restored} == ACTIVE — the resolve cascade reinstates the official in the same request"

      - name: pool_report_publication_supersedes_named_earlier_report
        claim_type: side_effect_execution
        grounds:
          - state_machines.PoolReport.DRAFT_to_PUBLISHED
          - state_machines.PoolReport.PUBLISHED_to_SUPERSEDED
          - entities.PoolReport.fields.supersedes_id
          - entities.PoolReport.fields.published_at
        distinguishing_aspect: "Publishing a report whose supersedes_id names an already PUBLISHED report flips that earlier row to SUPERSEDED in the same call, while the new row becomes PUBLISHED with published_at stamped from the logical clock."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1."
            - "Game G1 is FINALIZED and Dan's grade Q3-P22 is FINAL."
            - "Pool report R1 (POOL_REPORT) citing that grade is PUBLISHED; report R2 (RULES_CLARIFICATION) is DRAFT and names R1 in supersedes_id."
          setup_api_calls:
            - *k_clock
            - *k_prog1
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_game
            - *k_assign_dan
            - *k_confirm_dan
            - *k_clock_kick
            - *k_kick
            - *k_clock_grade
            - *k_played
            - *k_grade
            - *k_post_grade
            - *k_finalize
            - call: "POST /pool-reports"
              payload: { game_id: "${g_id}", play_grade_id: "${pg_id}", report_type: "POOL_REPORT", body: "The crew confirmed the missed holding call after the game." }
              as: CommunicationsOfficer
              captures: { pr1_id: $.data.id }
            - call: "POST /pool-reports/${pr1_id}/publish"
              payload: {}
              as: CommunicationsOfficer
              captures: { pr1_status_pub: $.data.status, pr1_published_at: $.data.published_at }
            - call: "POST /pool-reports"
              payload: { game_id: "${g_id}", play_grade_id: "${pg_id}", report_type: "RULES_CLARIFICATION", body: "Clarification: the hold occurred away from the point of attack.", supersedes_id: "${pr1_id}" }
              as: CommunicationsOfficer
              captures: { pr2_id: $.data.id, pr2_status_draft: $.data.status, pr2_supersedes: $.data.supersedes_id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T15:00:00Z" }
              as: OfficiatingDirector
            - call: "POST /pool-reports/${pr2_id}/publish"
              payload: {}
              as: CommunicationsOfficer
              captures: { pr2_status_pub: $.data.status, pr2_published_at: $.data.published_at }
            - call: "GET /pool-reports/${pr1_id}"
              payload: {}
              as: CommunicationsOfficer
              captures: { pr1_status_end: $.data.status, pr1_published_end: $.data.published_at }
          assert:
            - "${pr1_status_pub} == PUBLISHED with ${pr1_published_at} == 2026-09-13T21:30:00Z"
            - "${pr2_status_draft} == DRAFT with ${pr2_supersedes} == ${pr1_id}"
            - "${pr2_status_pub} == PUBLISHED with ${pr2_published_at} == 2026-09-14T15:00:00Z"
            - "${pr1_status_end} == SUPERSEDED while ${pr1_published_end} == ${pr1_published_at} — superseding preserves the original publication stamp"

      - name: play_grade_two_dimensions_advance_independently
        claim_type: valid_transition
        grounds:
          - state_machines.PlayGrade.grade_status_POSTED_to_FINAL
          - state_machines.PlayGrade.appeal_state_NOT_APPEALED_to_APPEAL_PENDING
        excluded_because:
          difficulty_instance: non_linear_state_machine / play_grade_status_and_appeal_state_advance_independently
          rationale: "The parallel-dimension walk, including the cross-dimension guard that freezes a POSTED grade under a pending appeal, is the body of that §1.8 instance."

      - name: advancement_committee_return_loop_terminates_in_auto_denial
        claim_type: valid_transition
        grounds:
          - state_machines.AdvancementApplication.COMMITTEE_REVIEW_to_RETURNED_FOR_TAPE
          - state_machines.AdvancementApplication.COMMITTEE_REVIEW_to_DENIED
        excluded_because:
          difficulty_instance: non_linear_state_machine / advancement_application_return_loop_then_auto_denial_at_cap
          rationale: "The cyclic return loop and its auto-denial at max_application_returns are asserted end-to-end by that §1.8 instance."

      - name: suspension_cascade_voids_assignments_and_reprices_game
        claim_type: side_effect_execution
        grounds:
          - state_machines.CrewAssignment.CONFIRMED_to_VOIDED
          - state_machines.Official.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / suspension_voids_assignments_and_reprices_game_crew
          rationale: "The four-hop suspension cascade (official -> assignments -> game counters -> REALIZED index) is that §1.8 instance's chain."

  # ===========================================================================
  - section: calculations
    instances:

      - name: field_evaluation_composite_rounds_before_the_average
        claim_type: precision
        grounds:
          - calculations.field_evaluation_score
          - entities.FieldEvaluation.fields.composite_score
          - entities.AdvancementApplication.fields.evaluation_average
        distinguishing_aspect: "The weighted composite is rounded per report and evaluation_average averages the ALREADY-ROUNDED composites, so 75.825 -> 75.83 propagates and the average is 78.72 rather than the 78.71 an unrounded average would give."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with the default evaluation constants (W_MECHANICS 0.4, W_RULES 0.35, W_PRESENCE 0.25, MIN_EVALUATIONS 2, MIN_EVAL_AVERAGE 75.00)."
            - "Lee Park (TIER_3, 7 seasons, ACTIVE, preseason-cleared) has a SCREENED TIER_2 application with return_count 0."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_off_lee
            - *k_lee_exam
            - *k_lee_phys
            - *k_lee_app
            - *k_lee_screen
          trigger:
            - call: "POST /advancement-applications/${app_id}/field-evaluations"
              payload: { mechanics_score: 79.00, rules_score: 76.00, presence_score: 70.50 }
              as: FieldEvaluator
              as_user_id: "eval-1"
              captures: { fe1_id: $.data.id, fe1_composite: $.data.composite_score, fe1_evaluator: $.data.evaluator_user_id }
            - call: "GET /advancement-applications/${app_id}"
              payload: {}
              as: FieldEvaluator
              captures: { app_avg_1: $.data.evaluation_average, app_status_after_fe1: $.data.status }
            - call: "POST /advancement-applications/${app_id}/field-evaluations"
              payload: { mechanics_score: 84.00, rules_score: 80.00, presence_score: 80.00 }
              as: FieldEvaluator
              as_user_id: "eval-2"
              captures: { fe2_id: $.data.id, fe2_composite: $.data.composite_score }
            - call: "GET /advancement-applications/${app_id}"
              payload: {}
              as: FieldEvaluator
              captures: { app_avg_2: $.data.evaluation_average }
            - call: "POST /advancement-applications/${app_id}/submit-to-committee"
              payload: {}
              as: FieldEvaluator
              as_user_id: "eval-1"
              captures: { app_status_committee: $.data.status }
          assert:
            - "${fe1_composite} == 75.83 — 79.00*0.4 + 76.00*0.35 + 70.50*0.25 = 31.60 + 26.60 + 17.625 = 75.825, round_half_up to 2 dp"
            - "${fe2_composite} == 81.60 — 33.60 + 28.00 + 20.00, no rounding needed"
            - "${app_avg_1} == 75.83 and ${app_status_after_fe1} == SCREENED (filing a report is not a transition)"
            - "${app_avg_2} == 78.72 — (75.83 + 81.60) / 2 = 78.715 rounded half-up; averaging the unrounded 75.825 would give 78.7125 -> 78.71, which is wrong"
            - "${fe1_evaluator} == eval-1 — the evaluator is taken from X-User-ID, not from the payload"
            - "${app_status_committee} == COMMITTEE_REVIEW because 2 reports >= MIN_EVALUATIONS + return_count 0 and 78.72 >= 75.00"

      - name: training_passed_flags_use_per_type_constants_at_the_boundary
        claim_type: constants_applied
        grounds:
          - calculations.preseason_clearance
          - calculations.training_deficiency_count
          - entities.TrainingRecord.fields.passed
          - entities.Official.fields.preseason_cleared
        distinguishing_aspect: "passed is derived per record_type: a RULES_CLINIC ignores score entirely, a PHYSICAL_TEST at 69.99 fails but at exactly 70.00 passes, and preseason_cleared flips only once a passed PHYSICAL_TEST and a passed RULES_EXAM both exist — clinic attendance never contributes."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with physical_test_min_score 70.00, exam_min_score 80.00 and clinic_attendance_required 1."
            - "Dan Ruiz is CANDIDATE with no training records."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_off_dan
          trigger:
            - call: "POST /officials/${dan_id}/training-records"
              payload: { record_type: "RULES_CLINIC", session_code: "CL-D1" }
              as: TrainingCoordinator
              captures: { tr_clinic_passed: $.data.passed, tr_clinic_score: $.data.score }
            - call: "POST /officials/${dan_id}/training-records"
              payload: { record_type: "PHYSICAL_TEST", session_code: "PT-D0", score: 69.99 }
              as: TrainingCoordinator
              captures: { tr_phys_fail_passed: $.data.passed }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: TrainingCoordinator
              captures: { dan_cleared_a: $.data.preseason_cleared, dan_status_a: $.data.status }
            - call: "POST /officials/${dan_id}/training-records"
              payload: { record_type: "RULES_EXAM", session_code: "EX-D0", score: 80.00 }
              as: TrainingCoordinator
              captures: { tr_exam_edge_passed: $.data.passed }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: TrainingCoordinator
              captures: { dan_cleared_b: $.data.preseason_cleared, dan_status_b: $.data.status }
            - call: "POST /officials/${dan_id}/training-records"
              payload: { record_type: "PHYSICAL_TEST", session_code: "PT-D2", score: 70.00 }
              as: TrainingCoordinator
              captures: { tr_phys_edge_passed: $.data.passed }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: TrainingCoordinator
              captures: { dan_cleared_c: $.data.preseason_cleared }
            - call: "GET /officials/${dan_id}/training-records"
              payload: { passed: true }
              as: TrainingCoordinator
              captures: { tr_first_passed_type: "$.data[0].record_type" }
          assert:
            - "${tr_clinic_passed} == true with ${tr_clinic_score} == null — a clinic always stores passed true and score is optional"
            - "${tr_phys_fail_passed} == false because 69.99 < 70.00, and ${dan_cleared_a} == false with ${dan_status_a} == CANDIDATE"
            - "${tr_exam_edge_passed} == true because 80.00 >= 80.00 (inclusive), and ${dan_status_b} == ACTIVE"
            - "${dan_cleared_b} == false — the exam alone does not clear him while the only physical test failed"
            - "${tr_phys_edge_passed} == true because 70.00 >= 70.00, and ${dan_cleared_c} == true"
            - "the passed:true filter lists three rows (clinic, exam, second physical) and ${tr_first_passed_type} == RULES_CLINIC in created_at order"
            - "his clinic count 1 meets clinic_attendance_required 1, so training_deficiency_count is 0 — this is the input the retention penalty later reads"

      - name: zero_play_official_reads_accuracy_100_but_is_not_eligible
        claim_type: correct_result
        grounds:
          - calculations.accuracy_index
          - entities.OfficialSeasonRecord.fields.accuracy_index
          - entities.OfficialSeasonRecord.fields.accuracy_eligible
          - endpoints[POST /officials]
        distinguishing_aspect: "Creating an official opens a season record with graded_play_count 0, accuracy_index exactly 100.00 and accuracy_eligible false — the play-count floor fails even though the percentage is perfect, so a perfect score is not a shortcut to eligibility."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with accuracy_eligibility_threshold 95.00 and min_graded_plays_for_eligibility 3."
            - "Dan Ruiz was just created and has been graded on nothing."
          setup_api_calls:
            - *k_clock
            - *k_prog
            - *k_open
            - *k_off_dan
          trigger:
            - call: "GET /season-records"
              payload: { official_id: "${dan_id}" }
              as: OfficiatingDirector
              captures:
                rec_id: "$.data[0].id"
                rec_n: "$.data[0].graded_play_count"
                rec_wep: "$.data[0].weighted_error_points"
                rec_index: "$.data[0].accuracy_index"
                rec_variant: "$.data[0].accuracy_variant"
                rec_acc_elig: "$.data[0].accuracy_eligible"
                rec_post_elig: "$.data[0].postseason_eligible"
            - call: "GET /season-records/${rec_id}"
              payload: {}
              as: Official
              as_user_id: "${dan_id}"
              captures: { rec_index_read: $.data.accuracy_index, rec_avail: $.data.availability_component, rec_retention: $.data.retention_score, rec_reco: $.data.retention_recommendation }
          assert:
            - "the list returns exactly one row — the record is opened by POST /officials, not by the first grade"
            - "${rec_n} == 0, ${rec_wep} == 0.00 and ${rec_index} == 100.00 (the zero-play branch, not a divide-by-zero)"
            - "${rec_variant} == PROVISIONAL and ${rec_acc_elig} == false because 0 < min_graded_plays_for_eligibility 3"
            - "${rec_post_elig} == false — accuracy_eligible is a conjunct, and he is still CANDIDATE and uncleared"
            - "${rec_index_read} == ${rec_index}, ${rec_avail} == 0.00, ${rec_retention} == 0.00 and ${rec_reco} == DEVELOP (declared defaults before the postseason lock)"

      - name: open_discipline_action_alone_falsifies_postseason_eligibility
        claim_type: correct_result
        grounds:
          - calculations.postseason_eligibility
          - calculations.accuracy_index
          - entities.OfficialSeasonRecord.fields.postseason_eligible
          - state_machines.DisciplineAction.OPENED_to_CLEARED
        distinguishing_aspect: "An ATTENDANCE WARNING leaves Official.status ACTIVE, so the only conjunct that moves is the discipline count: postseason_eligible flips true -> false on the OPENED action and back to true when it is CLEARED, with accuracy_index untouched at 100.00."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1, threshold 95.00 and min_graded_plays_for_eligibility 3."
            - "Game G1 is PLAYED with Dan's COMPLETED assignment; three CORRECT/MEDIUM grades on Dan are POSTED, so his accuracy_index is 100.00 over 3 plays."
          setup_api_calls:
            - *k_clock
            - *k_prog1
            - *k_open
            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_game
            - *k_assign_dan
            - *k_confirm_dan
            - *k_clock_kick
            - *k_kick
            - *k_clock_grade
            - *k_played
            - &k_three_correct_grades
              call: "POST /play-grades"
              payload: { game_id: "${g_id}", official_id: "${dan_id}", play_ref: "Q1-P01", call_category: "FALSE_START", grade_code: "CORRECT", impact: "MEDIUM" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { c1_id: $.data.id, c1_points: $.data.error_points }
            - call: "POST /play-grades/${c1_id}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - call: "POST /play-grades"
              payload: { game_id: "${g_id}", official_id: "${dan_id}", play_ref: "Q2-P07", call_category: "HOLDING", grade_code: "CORRECT", impact: "GAME_CRITICAL" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { c2_id: $.data.id, c2_points: $.data.error_points }
            - call: "POST /play-grades/${c2_id}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - call: "POST /play-grades"
              payload: { game_id: "${g_id}", official_id: "${dan_id}", play_ref: "Q4-P31", call_category: "ROUGHING_PASSER", grade_code: "CORRECT", impact: "LOW" }
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
              captures: { c3_id: $.data.id }
            - call: "POST /play-grades/${c3_id}/post"
              payload: {}
              as: GradingSupervisor
              as_user_id: "sup-grader-1"
            - call: "GET /season-records"
              payload: { official_id: "${dan_id}" }
              as: OfficiatingDirector
              captures:
                rec_n_clean: "$.data[0].graded_play_count"
                rec_index_clean: "$.data[0].accuracy_index"
                rec_acc_clean: "$.data[0].accuracy_eligible"
                rec_post_clean: "$.data[0].postseason_eligible"
            - &k_read_dan_v2
              call: "GET /officials/${dan_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { dan_v2: $.data.version, dan_status_clean: $.data.status }
          trigger:
            - call: "POST /discipline-actions"
              payload: { official_id: "${dan_id}", reason_category: "ATTENDANCE", severity: "WARNING", expected_official_version: "${dan_v2}" }
              as: OfficiatingDirector
              captures: { da_a_id: $.data.id, da_a_status: $.data.status }
            - call: "GET /officials/${dan_id}"
              payload: {}
              as: OfficiatingDirector
              captures: { dan_status_open_da: $.data.status }
            - call: "GET /season-records"
              payload: { official_id: "${dan_id}" }
              as: OfficiatingDirector
              captures:
                rec_index_da: "$.data[0].accuracy_index"
                rec_acc_da: "$.data[0].accuracy_eligible"
                rec_post_da: "$.data[0].postseason_eligible"
            - call: "POST /discipline-actions/${da_a_id}/resolve"
              payload: { outcome: "CLEARED", note: "late arrival explained" }
              as: OfficiatingDirector
