              payload: { carrier_id: "${v3_car}", connection_id: "${v3_conn}", mode: "TRUCKLOAD", tracking_reference: "IW-1", mode_reference: "PRO-IW", destination_code: "DAL", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${v3_shp}"
              captures: { v3_ship: $.data.id }
            - call: "POST /facilities"
              payload: { facility_name: "InvWin DC", facility_type: "DESTINATION" }
              as: PlatformAdmin
              captures: { v3_fac: $.data.id, v3_fac_v: $.data.version }
          trigger:
            - call: "POST /facilities/${v3_fac}/appointments"
              payload: { shipment_id: "${v3_ship}", window_start: "2026-09-01T10:00:00Z", window_end: "2026-09-01T10:00:00Z", expected_facility_version: "${v3_fac_v}" }
              as: CarrierRep
              as_user_id: "${v3_car}"
              captures: { v3_err: $.data.error_id }
          assert:
            - "response status 400 with error_id ERR_INVALID_REQUEST (window_end must be strictly after window_start)"
            - "GET /facilities/${v3_fac}/appointments returns 0 rows"

      - name: grant_expired_window_blocks_read
        claim_type: temporal_validation
        grounds: ["validations[priority=3]", errors.ERR_DATA_SHARE_FORBIDDEN]
        distinguishing_aspect: "A grant whose expires_at has passed no longer authorizes reads even though its status is still ACTIVE: expiry is a time predicate evaluated against the logical clock, not a state flip."
        test_recipe:
          setup: ["Shipper with shipment; carrier grant effective [2026-09-01, 2026-09-02); clock advanced to 2026-09-03; a second carrier (grantee) attempts the read."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "GrantCarrier", scac_code: "GRCR" }
              as: NetworkOps
              captures: { v4_car: $.data.id }
            - call: "POST /carriers/${v4_car}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { v4_conn: $.data.id }
            - call: "POST /connections/${v4_conn}/submit-credentials"
              payload: { credential_ref: "vault://grcr" }
              as: CarrierRep
              as_user_id: "${v4_car}"
            - call: "POST /connections/${v4_conn}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /shippers"
              payload: { company_name: "GrantShip" }
              as: PlatformAdmin
              captures: { v4_shp: $.data.id }
            - call: "POST /shippers/${v4_shp}/shipments"
              payload: { carrier_id: "${v4_car}", connection_id: "${v4_conn}", mode: "TRUCKLOAD", tracking_reference: "GR-1", mode_reference: "PRO-G1", destination_code: "DAL", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${v4_shp}"
              captures: { v4_ship: $.data.id }
            - call: "POST /carriers"
              payload: { carrier_name: "SecondCarrier", scac_code: "SECC" }
              as: NetworkOps
              captures: { v4_car2: $.data.id }
            - call: "POST /shippers/${v4_shp}/data-share-grants"
              payload: { grantee_type: "CARRIER", grantee_id: "${v4_car2}", scope: "FULL_TRACE", effective_from: "2026-09-01T00:00:00Z", expires_at: "2026-09-02T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${v4_shp}"
              captures: { v4_grant: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /shipments/${v4_ship}"
              payload: {}
              as: CarrierRep
              as_user_id: "${v4_car2}"
              captures: { v4_err: $.data.error_id }
          assert:
            - "response status 403 with error_id ERR_DATA_SHARE_FORBIDDEN (now 2026-09-03 > expires_at 2026-09-02)"
            - "DataShareGrant.${v4_grant}.status is still ACTIVE (expiry is temporal, not a state change)"

      - name: revoke_active_grant_then_revoke_again_rejected
        claim_type: violation_to_error
        grounds: [state_machines.DataShareGrant, errors.ERR_GRANT_ALREADY_REVOKED]
        distinguishing_aspect: "Revoke is idempotent-unsafe by design: the second revoke on a REVOKED grant fails 409 ERR_GRANT_ALREADY_REVOKED."
        test_recipe:
          setup: ["Shipper with an ACTIVE grant to a carrier; grant revoked once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "RevCo", scac_code: "REVC" }
              as: NetworkOps
              captures: { v5_car: $.data.id }
            - call: "POST /shippers"
              payload: { company_name: "RevShip" }
              as: PlatformAdmin
              captures: { v5_shp: $.data.id }
            - call: "POST /shippers/${v5_shp}/data-share-grants"
              payload: { grantee_type: "CARRIER", grantee_id: "${v5_car}", scope: "ETA_ONLY", effective_from: "2026-09-01T00:00:00Z", expires_at: "2026-12-31T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${v5_shp}"
              captures: { v5_grant: $.data.id }
            - call: "POST /data-share-grants/${v5_grant}/revoke"
              payload: {}
              as: ShipperRep
              as_user_id: "${v5_shp}"
          trigger:
            - call: "POST /data-share-grants/${v5_grant}/revoke"
              payload: {}
              as: ShipperRep
              as_user_id: "${v5_shp}"
              captures: { v5_err: $.data.error_id }
          assert:
            - "second revoke fails 409 with error_id ERR_GRANT_ALREADY_REVOKED"
            - "DataShareGrant.${v5_grant}.status remains REVOKED"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: ops_run_checkpoint_reports_per_run_counters
        claim_type: action_endpoint
        grounds: [endpoints.POST_/_ops/run-checkpoint, entities.OpsRun]
        distinguishing_aspect: "The checkpoint returns an OpsRun with monotonic run_index and per-run counters; an idle run (nothing stale, nothing expired) reports all-zero counters and run_index still increments."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. Empty database otherwise."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_ops/run-checkpoint"
              payload: {}
              as: PlatformAdmin
              captures: { e1_run: $.data.run_index }
            - call: "POST /_ops/run-checkpoint"
              payload: {}
              as: PlatformAdmin
              captures: { e1_run2: $.data.run_index, e1_created: $.data.alerts_created }
          assert:
            - "first run has run_index == 1, second run_index == 2 (monotonic)"
            - "second run reports connections_degraded == 0, testing_connections_reset == 0, etas_recomputed == 0, alerts_created == 0, alerts_escalated == 0"

      - name: clock_rejects_backwards_time
        claim_type: conditional_action
        grounds: [endpoints.POST_/_clock/set_current_utc, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "The logical clock never moves backwards: setting an earlier instant than the current logical time fails 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Clock at 2026-09-05T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { e2_err: $.data.error_id }
          assert:
            - "response status 400 with error_id ERR_INVALID_REQUEST"
            - "the clock remains 2026-09-05T00:00:00Z (a subsequent forward set to 2026-09-06 succeeds)"

      - name: alerts_queue_filters_by_status_and_severity
        claim_type: computed_read
