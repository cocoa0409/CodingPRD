# =============================================================================
# SCAFFOLD — Rapid Product Iteration & Direct Response Retail Launch (SharkNinja)
# §1.0–§1.7 seed tables. Difficulty: beyond-expert (requester instruction).
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Rapid Product Iteration & Direct Response Retail Launch (SharkNinja): consumer
  problem identification through research with rapid prototype cycles and short
  development timelines, engineering and sourcing coordination with factory
  partners to compress time from concept to shelf, product testing and claim
  substantiation for comparative performance advertising, direct response
  marketing with long-form video and infomercial testing before broad retail
  launch, retail partner exclusives and model number differentiation across
  channels to limit price comparison, patent landscape navigation and litigation
  exposure in crowded categories, launch quantity commitments with rapid
  replenishment for successful items, product line refresh cadence that retires
  models within short lifecycles

domain_name: rapid-launch-dr-retail
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  # Claim substantiation gates comparative advertising; segregation of duties on
  # study substantiation and case settlement; litigation exposure cascades into
  # an operational freeze. Audit-style gates dominate the design.
  secondary_archetype: posture_driven_gating
  # LaunchSeason.posture (OPEN/GUARDED/FROZEN/CLOSED) is a derived aggregate of
  # category litigation exposure and gates nearly all child mutations.
  complexity_layers:
    - optimistic_concurrency   # OCC on RetailAgreement.version and ModelVariant.version
    - cascading_side_effects   # judgment -> category exposure -> season posture; retirement -> commitment cancel -> capacity release
    - dual_variant_calculation # media MER provisional vs settled; litigation reserve provisional vs final
    - ops_run_checkpoint       # POST /launch-seasons/{id}/run-review advances the season and fires all time-based transitions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate
  entity_count: 12
  state_machine_count: 13
  calculation_count: 8
  endpoint_count: 49
  error_code_count: 41
  role_count: 7

# =============================================================================
# Named constants — every threshold/weight referenced anywhere in §1.1–§1.7 is
# pinned here exactly once. Downstream tables reference these names; the values
# below are authoritative.
# =============================================================================
constants:
  CLOCK_DEFAULT_ISO: "2026-09-01T00:00:00Z"   # logical clock value at server startup before any set_current_utc call
  RESEARCH_DECAY_PER_WEEK: 0.85               # per-full-week multiplier on insight points
  RESEARCH_SCORE_MIN: 40.0                    # momentum gate for CONCEPT_LOCKED (>=)
  CONCEPT_MAX_AGE_DAYS: 120                   # run-review kills concepts older than this that are not ENGINEERING_LOCKED
  ROUND_MAX_OPEN_DAYS: 21                     # run-review expires OPEN rounds older than this
  MAX_ROUNDS_PER_CYCLE: 4                     # completed-round budget per prototype cycle
  ROUND_PASS_SCORE: 75                        # round score gate for ENGINEERING_LOCKED (>=)
  CLAIM_MIN_MARGIN: 0.15                      # comparative performance margin gate (>=, 4dp)
  CLAIM_MIN_SAMPLES: 30                       # minimum sample size to record study results (>=)
  AGENCY_COMMISSION_RATE: 0.15                # per-order-line commission deducted in settled MER
  MER_SCALE_MIN: 2.0                          # settled MER required for a SCALE decision (>=, 4dp)
  MEDIA_DECISION_MAX_DAYS: 28                 # run-review kills media tests AIRING longer than this
  PRIOR_ADVERSE_PROB: 0.30                    # provisional litigation reserve = claim_cents * this
  CASE_WEIGHT_LOW: 2
  CASE_WEIGHT_MED: 5
  CASE_WEIGHT_HIGH: 9
  ADVERSE_WEIGHT_MULTIPLIER: 3                # JUDGED_ADVERSE cases weigh severity * this in exposure
  EXPOSURE_ELEVATED_MIN: 8                    # exposure_index >= 8 -> ELEVATED
  EXPOSURE_SEVERE_MIN: 20                     # exposure_index >= 20 -> SEVERE
  GUARDED_GRACE_REVIEWS: 2                    # GUARDED seasons still SEVERE after this many reviews -> FROZEN
  SHORTFALL_PENALTY_CENTS: 150                # per committed unit when a partner suspension strands a commitment
  COVER_WEEKS: 3                              # weeks of cover targeted by a replenishment order
  REPLENISH_MIN_WEEKLY_UNITS: 50              # weekly sell-through velocity gate for replenishment (>=)
  MODEL_MAX_AGE_DAYS: 240                     # RETAIL_LIVE variants older than this become REFRESH_CANDIDATE at review
  REFRESH_GRACE_DAYS: 30                      # REFRESH_CANDIDATE variants older than this (since candidacy) RETIRE at review
  TOOLING_WINDOW_DAYS: 14                     # a tooling engagement occupies [tooled_at, tooled_at + 14d)
  TOOLING_PARALLEL_SLOTS: 2                   # max simultaneous tooling engagements per factory partner

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology — all collections are root-level;
# parents are referenced by FK fields in request bodies, not nested URLs)
# =============================================================================
entities:
  - name: LaunchSeason
    parent: null
    common_fields: true
    fields:
      - { name: season_code, type: string, source: input, description: "Unique human season code, e.g. FW26" , constraints: "unique across all seasons; duplicate create -> ERR_INVALID_REQUEST" }
      - { name: posture, type: enum, source: computed, description: "SEASON_OPEN | SEASON_GUARDED | SEASON_FROZEN | SEASON_CLOSED — derived/gated per state machine; never client-set", default: SEASON_OPEN }
      - { name: review_index, type: integer, source: system, description: "Monotonic ops-run counter; starts 0, increments by 1 on each run-review", default: 0 }
      - { name: frozen_at_review_index, type: integer, source: system, description: "review_index value at the moment of the most recent freeze; null when never frozen", default: null }
      - { name: guarded_since_review_index, type: integer, source: system, description: "review_index value when posture last became SEASON_GUARDED; null when not guarded", default: null }
      - { name: last_review_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent run-review; null until the first", default: null }
      - { name: penalty_accrual_cents, type: integer, source: computed, description: "Sum of LaunchCommitment.penalty_cents over all commitments SHORTFALL_PENALIZED on variants whose concept chain belongs to this season", default: 0 }

  - name: Category
    parent: null
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> LaunchSeason.id; the season workspace this category is launched under" }
      - { name: name, type: string, source: input, description: "Category name, e.g. Cordless Vacuums" }
      - { name: crowding_base, type: integer, source: input, description: "Patent crowding baseline for the category, 0..10 inclusive", constraints: "0 <= crowding_base <= 10; out of range -> ERR_INVALID_REQUEST" }
      - { name: exposure_index, type: integer, source: computed, description: "patent_exposure_index output; recomputed on every PatentCase create/settle/judgment in this category", default: 0 }
      - { name: exposure_level, type: enum, source: computed, description: "CLEAR | ELEVATED | SEVERE — banded from exposure_index per patent_exposure_index", default: CLEAR }
      - { name: active_reserve_cents, type: integer, source: computed, description: "Litigation reserve ledger: sum of provisional_reserve_cents over cases FILED/ACTIVE plus final_amount_cents over cases SETTLED/JUDGED_ADVERSE; JUDGED_FAVORABLE contributes 0", default: 0 }

  - name: ProductConcept
    parent: null
    common_fields: true
    fields:
      - { name: category_id, type: string, source: input, description: "FK -> Category.id; category (and thereby season) this concept targets" }
      - { name: title, type: string, source: input, description: "Concept title describing the consumer problem being solved" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | RESEARCHING | CONCEPT_LOCKED | PROTOTYPE_CYCLING | ENGINEERING_LOCKED | LAUNCH_KILLED", default: IDENTIFIED }
      - { name: research_insights, type: array, source: input, description: "Append-only list of {points: integer 1..100, observed_at: datetime} added via POST /concepts/{id}/insights; each entry decays by recency in research_momentum_score", default: [] }
      - { name: research_momentum, type: number, source: computed, description: "research_momentum_score output, 2 decimal places, recomputed on insight append and on every read", default: 0.0 }
      - { name: rounds_used, type: integer, source: system, description: "Count of PrototypeRounds SCORED or EXPIRED in the current prototype cycle; resets to 0 when the concept reverts to RESEARCHING", default: 0 }
      - { name: killed_reason, type: enum, source: system, description: "DEADLINE_EXCEEDED — set when run-review auto-kills; null otherwise", default: null }

  - name: PrototypeRound
    parent: null
    common_fields: true
    fields:
      - { name: concept_id, type: string, source: system, description: "FK -> ProductConcept.id; taken from the URL path of POST /concepts/{id}/rounds" }
      - { name: round_number, type: integer, source: system, description: "1-based sequence per concept ordered by created_at ASC (deterministic — rounds are created sequentially)" }
      - { name: status, type: enum, source: system, description: "OPEN | SCORED | EXPIRED", default: OPEN }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock timestamp when the round was created" }
      - { name: score, type: integer, source: input, description: "0..100 inclusive, supplied at complete; null while OPEN", default: null, constraints: "integer 0..100; outside -> ERR_INVALID_REQUEST" }
      - { name: feedback, type: string, source: input, description: "Optional engineering feedback note recorded at complete", default: null }

  - name: FactoryPartner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Factory partner name" }
      - { name: capacity_units_total, type: integer, source: input, description: "Total production capacity in units the partner can hold allocated at once", constraints: "integer > 0" }
      - { name: allocated_units, type: integer, source: computed, description: "Sum of committed_units over LaunchCommitments with status OPEN on variants tooled at this partner, plus quantity_units over ReplenishmentOrders with status OPEN on variants tooled at this partner", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — SUSPENDED is terminal", default: ACTIVE }

  - name: ModelVariant
    parent: null
    common_fields: true
    fields:
      - { name: concept_id, type: string, source: input, description: "FK -> ProductConcept.id; concept must be ENGINEERING_LOCKED at creation" }
      - { name: factory_partner_id, type: string, source: system, description: "FK -> FactoryPartner.id; null until the variant is TOOLED via POST /model-variants/{id}/tool", default: null }
      - { name: model_number, type: string, source: input, description: "Channel-differentiated model number (price-comparison-limiting identifier)", constraints: "globally unique across all variants; duplicate -> ERR_MODEL_NUMBER_CONFLICT" }
      - { name: channel, type: enum, source: input, description: "AMAZON | BIG_BOX | CLUB | DTC | SPECIALTY — retail channel this model number is exclusive to" }
      - { name: lifecycle, type: enum, source: system, description: "DRAFT | TOOLED | DR_TESTING | RETAIL_LIVE | REFRESH_CANDIDATE | RETIRED", default: DRAFT }
      - { name: claim_clearance, type: enum, source: system, description: "UNSUBSTANTIATED | SUBSTANTIATED | CHALLENGED — parallel state dimension driven by this variant's ClaimStudies, independent of lifecycle", default: UNSUBSTANTIATED }
      - { name: tooled_at, type: datetime, source: system, description: "Logical-clock timestamp of the tooling transition; null until TOOLED", default: null }
      - { name: retail_live_at, type: datetime, source: system, description: "Logical-clock timestamp of the RETAIL_LIVE transition; null until live", default: null }
      - { name: refresh_candidate_at, type: datetime, source: system, description: "Logical-clock timestamp of the REFRESH_CANDIDATE transition; null until candidate", default: null }
      - { name: retired_at, type: datetime, source: system, description: "Logical-clock timestamp of retirement; null until RETIRED", default: null }

  - name: ClaimStudy
    parent: null
    common_fields: true
    fields:
      - { name: variant_id, type: string, source: input, description: "FK -> ModelVariant.id; variant must be TOOLED at creation" }
      - { name: claim_text, type: string, source: input, description: "Comparative advertising claim under test, e.g. '50% more suction than the leading competitor'" }
      - { name: conducted_by_user_id, type: string, source: system, description: "X-User-ID of the ClaimsScientist who created (runs) the study; recorded for segregation of duties" }
      - { name: status, type: enum, source: system, description: "RUNNING | RESULTS_RECORDED | SUBSTANTIATED | CHALLENGED — cyclic (CHALLENGED -> RUNNING via retest)", default: RUNNING }
      - { name: our_metric, type: number, source: input, description: "Measured performance of our product, supplied at complete; null while RUNNING", default: null }
      - { name: baseline_metric, type: number, source: input, description: "Measured performance of the competitor baseline, supplied at complete; must be > 0", default: null }
      - { name: sample_size, type: integer, source: input, description: "Test sample size, supplied at complete; must be >= CLAIM_MIN_SAMPLES", default: null }
      - { name: margin, type: number, source: computed, description: "claim_margin output (4dp) computed at complete; null while RUNNING", default: null }
      - { name: substantiated_by_user_id, type: string, source: system, description: "X-User-ID of the substantiating ClaimsScientist; must differ from conducted_by_user_id; null until SUBSTANTIATED", default: null }
      - { name: challenge_reason, type: string, source: input, description: "Reason recorded when LegalCounsel challenges a substantiated claim; null unless CHALLENGED", default: null }

  - name: MediaTest
    parent: null
    common_fields: true
    fields:
      - { name: variant_id, type: string, source: input, description: "FK -> ModelVariant.id; variant must be TOOLED at creation" }
      - { name: title, type: string, source: input, description: "Long-form video / infomercial test title" }
      - { name: media_spend_cents, type: integer, source: input, description: "Total media spend behind the test; must be > 0", constraints: "integer > 0" }
      - { name: status, type: enum, source: system, description: "EDITING | AIRING | DECIDED_SCALE | KILLED", default: EDITING }
      - { name: projected_gross_cents, type: integer, source: input, description: "Projected gross order revenue supplied at air; null while EDITING", default: null }
      - { name: provisional_mer, type: number, source: computed, description: "media_efficiency_ratio provisional variant (4dp) computed at air; null while EDITING", default: null }
      - { name: order_lines, type: array, source: input, description: "List of {revenue_cents, cancels_cents, returns_cents} per direct-response order, supplied at decide; null until decided", default: null }
      - { name: settled_mer, type: number, source: computed, description: "media_efficiency_ratio settled variant (4dp) computed at decide; null until decided", default: null }
      - { name: aired_at, type: datetime, source: system, description: "Logical-clock timestamp of the air transition; null until AIRING", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the decide transition; null until decided", default: null }

  - name: RetailAgreement
    parent: null
    common_fields: true
    fields:
      - { name: category_id, type: string, source: input, description: "FK -> Category.id; category whose shelf space this agreement covers" }
      - { name: retailer_name, type: string, source: input, description: "Retail partner name" }
      - { name: exclusive, type: boolean, source: input, description: "True when this is a category-exclusive launch window" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the launch window (half-open interval [window_start, window_end))" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the launch window; must be strictly after window_start", constraints: "window_end > window_start else ERR_INVALID_REQUEST" }
      - { name: min_launch_units, type: integer, source: input, description: "Minimum launch quantity the retailer commits to take", constraints: "integer > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED | EXPIRED", default: DRAFT }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock timestamp of signing; null until SIGNED", default: null }

  - name: LaunchCommitment
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> RetailAgreement.id; agreement must be SIGNED" }
      - { name: variant_id, type: string, source: input, description: "FK -> ModelVariant.id; variant must be DR_TESTING with a DECIDED_SCALE media test" }
      - { name: committed_units, type: integer, source: input, description: "Launch quantity committed against the agreement", constraints: "integer > 0" }
      - { name: need_by_date, type: datetime, source: input, description: "Date the units are needed at retail; must lie inside the agreement window [window_start, window_end)", constraints: "window_start <= need_by_date < window_end else ERR_COMMITMENT_OUTSIDE_WINDOW" }
      - { name: status, type: enum, source: system, description: "OPEN | FULFILLED | CANCELLED | SHORTFALL_PENALIZED", default: OPEN }
      - { name: penalty_cents, type: integer, source: computed, description: "SHORTFALL_PENALTY_CENTS * committed_units, set when the partner suspension cascade penalizes this commitment; 0 otherwise", default: 0 }

  - name: ReplenishmentOrder
    parent: null
    common_fields: true
    fields:
      - { name: variant_id, type: string, source: input, description: "FK -> ModelVariant.id; variant must be RETAIL_LIVE" }
      - { name: weekly_velocity, type: integer, source: input, description: "Retailer-reported sell-through units per week for this variant", constraints: "integer >= 0" }
      - { name: on_hand_units, type: integer, source: input, description: "Retailer-reported units on hand", constraints: "integer >= 0" }
      - { name: in_transit_units, type: integer, source: input, description: "Retailer-reported units already in transit", constraints: "integer >= 0" }
      - { name: case_pack_units, type: integer, source: input, description: "Factory case-pack multiple the order must round up to", constraints: "integer > 0" }
      - { name: quantity_units, type: integer, source: computed, description: "replenishment_quantity output — clamped, case-pack-rounded, capacity-validated order quantity" }
      - { name: status, type: enum, source: system, description: "OPEN | FULFILLED | SUPERSEDED | CANCELLED", default: OPEN }
      - { name: superseded_by_id, type: string, source: system, description: "id of the ReplenishmentOrder that superseded this one; null unless SUPERSEDED", default: null }

  - name: PatentCase
    parent: null
    common_fields: true
    fields:
      - { name: category_id, type: string, source: input, description: "FK -> Category.id; crowded category this litigation sits in" }
      - { name: case_number, type: string, source: input, description: "Docket-style case number", constraints: "globally unique; duplicate -> ERR_INVALID_REQUEST" }
      - { name: claim_cents, type: integer, source: input, description: "Damages claimed against the company", constraints: "integer > 0" }
      - { name: severity, type: enum, source: input, description: "LOW | MED | HIGH — weighted in patent_exposure_index" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the LegalCounsel who filed; recorded for segregation of duties on settlement" }
      - { name: status, type: enum, source: system, description: "FILED | ACTIVE | SETTLED | JUDGED_ADVERSE | JUDGED_FAVORABLE", default: FILED }
      - { name: provisional_reserve_cents, type: integer, source: computed, description: "litigation_reserve provisional variant: round_half_up(claim_cents * PRIOR_ADVERSE_PROB, 0); set at creation" }
      - { name: final_amount_cents, type: integer, source: computed, description: "litigation_reserve final variant: settlement_cents on settle, award_cents on adverse judgment, 0 on favorable; null while FILED/ACTIVE", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LaunchSeason
    field: posture
    initial_state: SEASON_OPEN
    terminal_states: [SEASON_CLOSED]
    transitions:
      - from: SEASON_OPEN
        to: SEASON_GUARDED
        trigger: "system — a linked Category's exposure_level recomputes to SEVERE (on any PatentCase create/settle/record-judgment in the category)"
        actor: system
        preconditions:
          - "At least one Category with season_id == this season has exposure_level == SEVERE"
        side_effects:
          - "guarded_since_review_index = review_index"
      - from: SEASON_OPEN
        to: SEASON_FROZEN
        trigger: "POST /launch-seasons/{id}/freeze"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "frozen_at_review_index = review_index"
      - from: SEASON_GUARDED
        to: SEASON_FROZEN
        trigger: "POST /launch-seasons/{id}/freeze, or system at run-review when review_index - guarded_since_review_index >= GUARDED_GRACE_REVIEWS and any linked category is still SEVERE"
        actor: "PlatformAdmin or system"
        preconditions:
          - "system path only: review_index - guarded_since_review_index >= 2 at the moment the review runs"
        side_effects:
          - "frozen_at_review_index = review_index"
      - from: SEASON_FROZEN
        to: SEASON_OPEN
        trigger: "POST /launch-seasons/{id}/unfreeze"
        actor: PlatformAdmin
        preconditions:
          - "review_index > frozen_at_review_index (at least one full run-review has completed since the freeze; otherwise ERR_INVALID_STATE)"
          - "No linked Category has exposure_level == SEVERE (otherwise ERR_INVALID_STATE)"
        side_effects:
          - "frozen_at_review_index = null"
      - from: SEASON_GUARDED
        to: SEASON_OPEN
        trigger: "system at run-review — no linked Category has exposure_level == SEVERE"
        actor: system
        preconditions: []
        side_effects:
          - "guarded_since_review_index = null"
      - from: SEASON_OPEN
        to: SEASON_CLOSED
        trigger: "POST /launch-seasons/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "No ModelVariant whose concept chain resolves to this season is in DRAFT, TOOLED, DR_TESTING, RETAIL_LIVE, or REFRESH_CANDIDATE"
          - "No LaunchCommitment or ReplenishmentOrder on such variants is OPEN"
          - "No PatentCase in a linked Category is FILED or ACTIVE"
          - "Violations -> ERR_CLOSE_PRECONDITIONS_UNMET"
        side_effects: []
      - from: SEASON_OPEN
        to: SEASON_OPEN
        trigger: "POST /launch-seasons/{id}/run-review — ops-run checkpoint; also runs while GUARDED/FROZEN (self-transition on posture)"
        actor: PlatformAdmin
        preconditions:
          - "posture != SEASON_CLOSED (otherwise ERR_SEASON_CLOSED)"
        side_effects:
          - "review_index += 1; last_review_at = current logical clock"
          - "Step 1: every PatentCase FILED in a linked Category -> ACTIVE"
          - "Step 2: every PrototypeRound OPEN with now - opened_at > ROUND_MAX_OPEN_DAYS -> EXPIRED (counts toward rounds_used; may trigger the concept revert)"
          - "Step 3: every ProductConcept in this season not ENGINEERING_LOCKED and not LAUNCH_KILLED with now - created_at > CONCEPT_MAX_AGE_DAYS -> LAUNCH_KILLED (killed_reason = DEADLINE_EXCEEDED; any OPEN round -> EXPIRED)"
          - "Step 4: every MediaTest AIRING on a variant in this season with now - aired_at > MEDIA_DECISION_MAX_DAYS -> KILLED"
          - "Step 5: every LaunchCommitment OPEN on a variant in this season with need_by_date < now -> FULFILLED (its units leave FactoryPartner.allocated_units)"
          - "Step 6: every ReplenishmentOrder OPEN on a variant in this season -> FULFILLED (its units leave allocated_units)"
          - "Step 7: every RetailAgreement SIGNED on a linked Category with window_end <= now -> EXPIRED"
          - "Step 8: every ModelVariant DR_TESTING in this season with at least one LaunchCommitment in OPEN or FULFILLED -> RETAIL_LIVE (retail_live_at = now)"
          - "Step 9: every ModelVariant RETAIL_LIVE in this season with now - retail_live_at > MODEL_MAX_AGE_DAYS -> REFRESH_CANDIDATE (refresh_candidate_at = now)"
          - "Step 10: every ModelVariant REFRESH_CANDIDATE in this season with now - refresh_candidate_at > REFRESH_GRACE_DAYS -> RETIRED; cascade: its OPEN commitments -> CANCELLED and OPEN replenishments -> CANCELLED, releasing FactoryPartner.allocated_units"
          - "Step 11: recompute every linked Category.exposure_index/level; if posture is GUARDED and no category is SEVERE -> SEASON_OPEN; if GUARDED and still SEVERE and review_index - guarded_since_review_index >= GUARDED_GRACE_REVIEWS -> SEASON_FROZEN"

  - entity: Category
    field: exposure_level
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: [CLEAR, ELEVATED, SEVERE]
        to: [CLEAR, ELEVATED, SEVERE]
        trigger: "system — patent_exposure_index recomputes on every PatentCase create/settle/record-judgment in this category and at run-review step 11"
        actor: system
        preconditions: []
        side_effects:
          - "exposure_index updated per patent_exposure_index formula"
          - "if the new level is SEVERE and the linked LaunchSeason.posture == SEASON_OPEN, the season -> SEASON_GUARDED (cross-entity cascade)"

  - entity: ProductConcept
    field: status
    initial_state: IDENTIFIED
    terminal_states: [LAUNCH_KILLED]
    transitions:
      - from: IDENTIFIED
        to: RESEARCHING
        trigger: "POST /concepts/{id}/advance"
        actor: ProductLead
        preconditions:
          - "research_insights contains at least 1 entry (otherwise ERR_NO_RESEARCH_INSIGHTS)"
        side_effects: []
      - from: RESEARCHING
        to: CONCEPT_LOCKED
        trigger: "POST /concepts/{id}/advance"
        actor: ProductLead
        preconditions:
          - "research_momentum >= RESEARCH_SCORE_MIN evaluated at the current logical clock (otherwise ERR_RESEARCH_SCORE_TOO_LOW)"
        side_effects: []
      - from: CONCEPT_LOCKED
        to: PROTOTYPE_CYCLING
        trigger: "POST /concepts/{id}/advance"
        actor: ProductLead
        preconditions: []
        side_effects: []
      - from: PROTOTYPE_CYCLING
        to: ENGINEERING_LOCKED
        trigger: "POST /concepts/{id}/advance"
        actor: ProductLead
        preconditions:
          - "At least one PrototypeRound created in the current cycle has status SCORED and score >= ROUND_PASS_SCORE (otherwise ERR_ROUND_NOT_PASSED)"
        side_effects: []
      - from: PROTOTYPE_CYCLING
        to: RESEARCHING
        trigger: "system — a round completes SCORED with score < ROUND_PASS_SCORE (or EXPIRES) and rounds_used reaches MAX_ROUNDS_PER_CYCLE"
        actor: system
        preconditions:
          - "rounds_used == 4 after accounting for the completing/expiring round"
        side_effects:
          - "rounds_used reset to 0 (a fresh prototype budget begins after new research)"
        note: "The iteration loop: exhausted prototype budget without a pass sends the concept back for more consumer research; decayed momentum may now block re-locking."
      - from: [IDENTIFIED, RESEARCHING, CONCEPT_LOCKED, PROTOTYPE_CYCLING]
        to: LAUNCH_KILLED
        trigger: "system at run-review step 3"
        actor: system
        preconditions:
          - "now - created_at > CONCEPT_MAX_AGE_DAYS and status != ENGINEERING_LOCKED"
        side_effects:
          - "killed_reason = DEADLINE_EXCEEDED"
          - "any OPEN PrototypeRound on this concept -> EXPIRED"

  - entity: PrototypeRound
    field: status
    initial_state: OPEN
    terminal_states: [SCORED, EXPIRED]
    transitions:
      - from: OPEN
        to: SCORED
        trigger: "POST /prototype-rounds/{id}/complete"
        actor: ProductLead
        preconditions:
          - "score is an integer 0..100 (otherwise ERR_INVALID_REQUEST)"
        side_effects:
          - "ProductConcept.rounds_used += 1"
          - "if score < ROUND_PASS_SCORE and rounds_used == MAX_ROUNDS_PER_CYCLE after the increment, the concept -> RESEARCHING and rounds_used resets to 0"
      - from: OPEN
        to: EXPIRED
        trigger: "system at run-review step 2"
        actor: system
        preconditions:
          - "now - opened_at > ROUND_MAX_OPEN_DAYS"
        side_effects:
          - "ProductConcept.rounds_used += 1 (expiry consumes prototype budget)"
          - "if rounds_used == MAX_ROUNDS_PER_CYCLE after the increment, the concept -> RESEARCHING and rounds_used resets to 0"

  - entity: FactoryPartner
    field: status
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /factory-partners/{id}/suspend"
        actor: SourcingManager
        preconditions: []
        side_effects:
          - "every LaunchCommitment OPEN on a variant tooled at this partner -> SHORTFALL_PENALIZED; penalty_cents = committed_units * SHORTFALL_PENALTY_CENTS; the owning LaunchSeason.penalty_accrual_cents += penalty_cents"
          - "every ReplenishmentOrder OPEN on a variant tooled at this partner -> CANCELLED"
          - "allocated_units recomputes (penalized/cancelled units are released)"

  - entity: ModelVariant
    field: lifecycle
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: TOOLED
        trigger: "POST /model-variants/{id}/tool"
        actor: SourcingManager
        preconditions:
          - "factory_partner_id references a FactoryPartner with status ACTIVE (otherwise ERR_PARTNER_NOT_ACTIVE)"
          - "fewer than TOOLING_PARALLEL_SLOTS other variants share that partner with tooling windows [tooled_at, tooled_at + TOOLING_WINDOW_DAYS) intersecting [now, now + TOOLING_WINDOW_DAYS) (otherwise ERR_TOOLING_SLOTS_FULL)"
        side_effects:
          - "factory_partner_id set; tooled_at = current logical clock"
      - from: TOOLED
        to: DR_TESTING
        trigger: "system — a MediaTest for this variant transitions EDITING -> AIRING"
        actor: system
        preconditions: []
        side_effects: []
      - from: DR_TESTING
        to: RETAIL_LIVE
        trigger: "system at run-review step 8"
        actor: system
        preconditions:
          - "the variant has at least one LaunchCommitment with status OPEN or FULFILLED"
        side_effects:
          - "retail_live_at = current logical clock"
      - from: RETAIL_LIVE
        to: REFRESH_CANDIDATE
        trigger: "system at run-review step 9"
        actor: system
        preconditions:
          - "now - retail_live_at > MODEL_MAX_AGE_DAYS"
        side_effects:
          - "refresh_candidate_at = current logical clock"
      - from: REFRESH_CANDIDATE
        to: RETIRED
        trigger: "system at run-review step 10"
        actor: system
        preconditions:
          - "now - refresh_candidate_at > REFRESH_GRACE_DAYS"
        side_effects:
          - "retired_at = current logical clock"
          - "cascade: every OPEN LaunchCommitment on this variant -> CANCELLED; every OPEN ReplenishmentOrder on this variant -> CANCELLED; FactoryPartner.allocated_units recomputes"

  - entity: ModelVariant
    field: claim_clearance
    initial_state: UNSUBSTANTIATED
    terminal_states: []
    transitions:
      - from: UNSUBSTANTIATED
        to: SUBSTANTIATED
        trigger: "system — one of this variant's ClaimStudies transitions RESULTS_RECORDED -> SUBSTANTIATED"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBSTANTIATED
        to: CHALLENGED
        trigger: "system — the substantiating ClaimStudy is challenged (SUBSTANTIATED -> CHALLENGED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHALLENGED
        to: UNSUBSTANTIATED
        trigger: "system — the challenged ClaimStudy re-enters RUNNING via retest"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNSUBSTANTIATED
        to: SUBSTANTIATED
        trigger: "system — the retaken ClaimStudy substantiates again"
        actor: system
        preconditions: []
        side_effects: []
        note: "claim_clearance evolves independently of lifecycle (parallel dimensions): a RETAIL_LIVE variant can be CHALLENGED, and clearance alone gates POST /media-tests/{id}/air."

  - entity: ClaimStudy
    field: status
    initial_state: RUNNING
    terminal_states: []
    transitions:
      - from: RUNNING
        to: RESULTS_RECORDED
        trigger: "POST /claim-studies/{id}/complete"
        actor: ClaimsScientist
        preconditions:
          - "sample_size >= CLAIM_MIN_SAMPLES (otherwise ERR_SAMPLE_SIZE_TOO_SMALL)"
          - "baseline_metric > 0 (otherwise ERR_INVALID_REQUEST)"
        side_effects:
          - "margin computed per claim_margin (4dp)"
      - from: RESULTS_RECORDED
        to: SUBSTANTIATED
        trigger: "POST /claim-studies/{id}/substantiate"
        actor: ClaimsScientist
        preconditions:
          - "X-User-ID != conducted_by_user_id (segregation of duties — otherwise ERR_SEGREGATION_OF_DUTIES)"
          - "margin >= CLAIM_MIN_MARGIN (otherwise ERR_MARGIN_BELOW_MINIMUM; the study stays RESULTS_RECORDED)"
        side_effects:
          - "substantiated_by_user_id = X-User-ID"
          - "ModelVariant.claim_clearance -> SUBSTANTIATED"
      - from: SUBSTANTIATED
        to: CHALLENGED
        trigger: "POST /claim-studies/{id}/challenge"
        actor: LegalCounsel
        preconditions: []
        side_effects:
          - "challenge_reason recorded"
          - "ModelVariant.claim_clearance -> CHALLENGED"
      - from: CHALLENGED
        to: RUNNING
        trigger: "POST /claim-studies/{id}/retest"
        actor: ClaimsScientist
        preconditions: []
        side_effects:
          - "our_metric, baseline_metric, sample_size, margin reset to null"
          - "challenge_reason reset to null"
          - "ModelVariant.claim_clearance -> UNSUBSTANTIATED"

  - entity: MediaTest
    field: status
    initial_state: EDITING
    terminal_states: [DECIDED_SCALE, KILLED]
    transitions:
      - from: EDITING
        to: AIRING
        trigger: "POST /media-tests/{id}/air"
        actor: MediaBuyer
        preconditions:
          - "ModelVariant.lifecycle in {TOOLED, DR_TESTING, RETAIL_LIVE} (otherwise ERR_INVALID_STATE)"
          - "ModelVariant.claim_clearance == SUBSTANTIATED (otherwise ERR_CLAIM_NOT_SUBSTANTIATED)"
          - "owning LaunchSeason.posture != SEASON_GUARDED (otherwise ERR_SEASON_GUARDED)"
        side_effects:
          - "aired_at = current logical clock"
          - "provisional_mer computed per media_efficiency_ratio provisional variant"
          - "if ModelVariant.lifecycle == TOOLED, the variant -> DR_TESTING"
      - from: AIRING
        to: DECIDED_SCALE
        trigger: "POST /media-tests/{id}/decide with decision = SCALE"
        actor: MediaBuyer
        preconditions:
          - "settled_mer computed from order_lines >= MER_SCALE_MIN (otherwise ERR_DECISION_BAND_MISMATCH)"
        side_effects:
          - "settled_mer computed per media_efficiency_ratio settled variant; decided_at = current logical clock"
      - from: AIRING
        to: KILLED
        trigger: "POST /media-tests/{id}/decide with decision = KILL, or system at run-review step 4"
        actor: "MediaBuyer or system"
        preconditions:
          - "manual path: settled_mer < MER_SCALE_MIN (otherwise ERR_DECISION_BAND_MISMATCH)"
          - "system path: now - aired_at > MEDIA_DECISION_MAX_DAYS"
        side_effects:
          - "manual path: settled_mer computed; decided_at = current logical clock"

  - entity: RetailAgreement
    field: status
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /retail-agreements/{id}/sign"
        actor: RetailExec
        preconditions:
          - "owning LaunchSeason.posture in {SEASON_OPEN, SEASON_GUARDED} (FROZEN/CLOSED -> posture errors)"
          - "Category.exposure_level != SEVERE (otherwise ERR_CATEGORY_LITIGATION_BLOCKED)"
          - "no other RetailAgreement with status SIGNED, exclusive == true, same category_id, whose half-open window [window_start, window_end) intersects this one (adjacency where one window_end == the other's window_start is NOT an intersection; otherwise ERR_EXCLUSIVE_WINDOW_CONFLICT)"
          - "window_end > current logical clock (otherwise ERR_WINDOW_ELAPSED)"
        side_effects:
          - "signed_at = current logical clock"
      - from: SIGNED
        to: EXPIRED
        trigger: "system at run-review step 7"
        actor: system
        preconditions:
          - "window_end <= now"
        side_effects: []

  - entity: LaunchCommitment
    field: status
    initial_state: OPEN
    terminal_states: [FULFILLED, CANCELLED, SHORTFALL_PENALIZED]
    transitions:
      - from: OPEN
        to: FULFILLED
        trigger: "system at run-review step 5"
        actor: system
        preconditions:
          - "need_by_date < now"
        side_effects:
          - "FactoryPartner.allocated_units recomputes (units released)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /launch-commitments/{id}/cancel, or system cascade when the variant retires"
        actor: "SourcingManager or system"
        preconditions: []
        side_effects:
          - "FactoryPartner.allocated_units recomputes (units released)"
      - from: OPEN
        to: SHORTFALL_PENALIZED
        trigger: "system cascade when the variant's FactoryPartner is suspended"
        actor: system
        preconditions: []
        side_effects:
          - "penalty_cents = committed_units * SHORTFALL_PENALTY_CENTS"
          - "owning LaunchSeason.penalty_accrual_cents += penalty_cents"
          - "FactoryPartner.allocated_units recomputes (units released)"

  - entity: ReplenishmentOrder
    field: status
    initial_state: OPEN
    terminal_states: [FULFILLED, SUPERSEDED, CANCELLED]
    transitions:
      - from: OPEN
        to: FULFILLED
        trigger: "system at run-review step 6"
        actor: system
        preconditions: []
        side_effects:
          - "FactoryPartner.allocated_units recomputes (units released)"
      - from: OPEN
        to: SUPERSEDED
        trigger: "system — a new ReplenishmentOrder is created for the same variant while this one is OPEN"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_id = the new order's id"
          - "FactoryPartner.allocated_units recomputes (old units released, new units allocated)"
      - from: OPEN
        to: CANCELLED
        trigger: "system cascade when the variant retires or its factory partner is suspended"
        actor: system
        preconditions: []
        side_effects:
          - "FactoryPartner.allocated_units recomputes (units released)"

  - entity: PatentCase
    field: status
    initial_state: FILED
    terminal_states: [SETTLED, JUDGED_ADVERSE, JUDGED_FAVORABLE]
    transitions:
      - from: FILED
        to: ACTIVE
        trigger: "system at run-review step 1"
        actor: system
        preconditions: []
        side_effects: []
      - from: [FILED, ACTIVE]
        to: SETTLED
        trigger: "POST /patent-cases/{id}/settle"
        actor: LegalCounsel
        preconditions:
          - "X-User-ID != filed_by_user_id (segregation of duties — otherwise ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "final_amount_cents = settlement_cents"
          - "Category.active_reserve_cents recomputes (provisional reserve replaced by the final amount)"
          - "Category.exposure_index recomputes (the case leaves the FILED/ACTIVE set)"
      - from: ACTIVE
        to: JUDGED_ADVERSE
        trigger: "POST /patent-cases/{id}/record-judgment with outcome = ADVERSE"
        actor: LegalCounsel
        preconditions:
          - "award_cents present and > 0 (otherwise ERR_INVALID_REQUEST)"
        side_effects:
          - "final_amount_cents = award_cents"
          - "Category.active_reserve_cents recomputes"
          - "Category.exposure_index recomputes with the ADVERSE_WEIGHT_MULTIPLIER term; if the level becomes SEVERE the linked LaunchSeason -> SEASON_GUARDED"
      - from: ACTIVE
        to: JUDGED_FAVORABLE
        trigger: "POST /patent-cases/{id}/record-judgment with outcome = FAVORABLE"
        actor: LegalCounsel
        preconditions: []
        side_effects:
          - "final_amount_cents = 0"
          - "Category.active_reserve_cents recomputes (reserve fully released)"
          - "Category.exposure_index recomputes (the case leaves the FILED/ACTIVE set)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's version — the only
# sanctioned write-write mechanism; every entry passed the serial-observability
# filter: a second strictly-sequential request sees identical business state and
# would legitimately succeed, so the conflict is expressed as a stale version)
# =============================================================================
concurrency_rules:
  - rule_id: replenish-create-stale-variant
    parent_entity: ModelVariant
    write_endpoint: "POST /replenishment-orders"
    occ_field: "expected_variant_version"
    description: |
      Creating a ReplenishmentOrder against a ModelVariant whose version has
      advanced since the client last observed it is rejected. The natural flow
      is: client reads the variant, computes the reorder need from retailer
      feeds, and posts; another writer may legitimately have created a
      superseding order (or retired the variant) in between, advancing
      ModelVariant.version. The stale writer loses with 412.
    error_id: ERR_STALE_VARIANT_VERSION
    http_status: 412
  - rule_id: commitment-create-stale-agreement
    parent_entity: RetailAgreement
    write_endpoint: "POST /launch-commitments"
    occ_field: "expected_agreement_version"
    description: |
      Creating a LaunchCommitment against a RetailAgreement whose version has
      advanced since the client last observed it is rejected. Repeated
      commitments against one agreement are legitimate business operations, so
      the conflict only surfaces as a stale read of the agreement (e.g. another
      writer's commitment advanced its version). The stale writer loses with 412.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: research_momentum_score
    trigger: "on POST /concepts/{id}/insights (append), and re-evaluated against the current logical clock on every ProductConcept read and on every advance attempt"
    algorithm: decay_function
    formula: |
      momentum = round_half_up(
        SUM over i in concept.research_insights:
          i.points * (RESEARCH_DECAY_PER_WEEK ^ weeks_old(i)),
        2 decimal places)
      where weeks_old(i) = max(0, floor((now - i.observed_at) / 7 days))
      and now = current logical clock.
      Gate: RESEARCHING -> CONCEPT_LOCKED requires momentum >= RESEARCH_SCORE_MIN (40.0, inclusive).
    input_set: "all entries of ProductConcept.research_insights (append-only; no status filter)"
    constants: { RESEARCH_DECAY_PER_WEEK: 0.85, RESEARCH_SCORE_MIN: 40.0 }
    precision: "2 decimal places, round_half_up"

  - name: prototype_gate
    trigger: "POST /concepts/{id}/advance from PROTOTYPE_CYCLING"
    algorithm: threshold
    formula: |
      pass_exists = EXISTS round r created in the concept's current cycle
                    with r.status == SCORED and r.score >= ROUND_PASS_SCORE (75, inclusive).
      Budget: rounds_used counts SCORED + EXPIRED rounds in the current cycle;
      when a non-passing completion (or expiry) makes rounds_used == MAX_ROUNDS_PER_CYCLE (4),
      the concept reverts PROTOTYPE_CYCLING -> RESEARCHING and rounds_used resets to 0.
    input_set: "PrototypeRounds of this concept created after the most recent entry into PROTOTYPE_CYCLING (i.e. since the last rounds_used reset)"
    constants: { ROUND_PASS_SCORE: 75, MAX_ROUNDS_PER_CYCLE: 4, ROUND_MAX_OPEN_DAYS: 21 }
    precision: "integer scores; boundary is inclusive (score == 75 passes)"

  - name: claim_margin
    trigger: "POST /claim-studies/{id}/complete"
    algorithm: threshold
    formula: |
      margin = round_half_up((our_metric - baseline_metric) / baseline_metric, 4 decimal places).
      Substantiation gate at POST /claim-studies/{id}/substantiate:
        margin >= CLAIM_MIN_MARGIN (0.15, inclusive — margin exactly 0.1500 passes).
      Sample gate at complete: sample_size >= CLAIM_MIN_SAMPLES (30, inclusive).
    input_set: "the completing ClaimStudy's our_metric / baseline_metric / sample_size"
    constants: { CLAIM_MIN_MARGIN: 0.15, CLAIM_MIN_SAMPLES: 30 }
    precision: "4 decimal places, round_half_up"

  - name: media_efficiency_ratio
    trigger: "provisional variant at POST /media-tests/{id}/air; settled variant at POST /media-tests/{id}/decide"
    algorithm: aggregation
    formula: |
      provisional_mer = round_half_up(projected_gross_cents / media_spend_cents, 4).
      settled_mer    = round_half_up(
                         SUM over line in order_lines:
                           round_half_up((line.revenue_cents - line.cancels_cents - line.returns_cents)
                                         * (1 - AGENCY_COMMISSION_RATE), 0 decimal places)
                         / media_spend_cents,
                       4 decimal places).
      PINNED ROUNDING ORDER (settled variant): the agency commission is rounded to
      whole cents PER ORDER LINE first (round_half_up, 0dp), the per-line results are
      then summed, and only the final ratio is rounded to 4dp. The alternative order
      (sum net revenue across all lines, apply the commission once, round) can differ
      by whole cents and can flip the MER_SCALE_MIN band — it is NOT equivalent and is
      rejected.
      Decision band: SCALE requires settled_mer >= MER_SCALE_MIN (2.0, inclusive);
      KILL requires settled_mer < MER_SCALE_MIN; a decision contradicting the band is
      rejected with ERR_DECISION_BAND_MISMATCH.
    input_set: "provisional: the air request's projected_gross_cents; settled: the decide request's order_lines array"
    constants: { AGENCY_COMMISSION_RATE: 0.15, MER_SCALE_MIN: 2.0 }
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "computed at the air transition from the projected gross"
        difference: "uses projected_gross_cents with no cancels, no returns, and no agency commission — a forward-looking estimate"
      - name: settled
        when: "computed at the decide transition from actual order lines"
        difference: "nets out cancels and returns per line and deducts the per-line-rounded agency commission — a realized measure; for identical spend the two variants diverge"

  - name: litigation_reserve
    trigger: "provisional variant at POST /patent-cases; final variant at POST /patent-cases/{id}/settle or /record-judgment"
    algorithm: aggregation
    formula: |
      provisional_reserve_cents = round_half_up(claim_cents * PRIOR_ADVERSE_PROB, 0).
      final_amount_cents =
        settlement_cents            when the case settles;
        award_cents                 when judgment is ADVERSE;
        0                           when judgment is FAVORABLE;
        null                        while FILED or ACTIVE.
      Category.active_reserve_cents =
        SUM provisional_reserve_cents over cases in {FILED, ACTIVE}
        + SUM final_amount_cents over cases in {SETTLED, JUDGED_ADVERSE}
        (JUDGED_FAVORABLE contributes 0).
    input_set: "PatentCases of the category, partitioned by status as above"
    constants: { PRIOR_ADVERSE_PROB: 0.30 }
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "while the case is FILED or ACTIVE"
        difference: "expected-value estimate from the prior adverse probability; booked against the category reserve ledger"
      - name: final
        when: "once the case is SETTLED or JUDGED"
        difference: "the actual settlement/award (or 0 when favorable) replaces the estimate in the same ledger — the two variants differ for identical case data"

  - name: patent_exposure_index
    trigger: "on every PatentCase create/settle/record-judgment in the category, and at run-review step 11"
    algorithm: weighted_scoring
    formula: |
      W(severity) = LOW -> 2, MED -> 5, HIGH -> 9.
      exposure_index = crowding_base
                       + SUM over cases with status in {FILED, ACTIVE}: W(severity)
                       + ADVERSE_WEIGHT_MULTIPLIER * SUM over cases with status JUDGED_ADVERSE: W(severity).
      Level bands (inclusive lower bounds):
        exposure_index >= EXPOSURE_SEVERE_MIN (20)  -> SEVERE
        exposure_index >= EXPOSURE_ELEVATED_MIN (8) -> ELEVATED
        otherwise                                   -> CLEAR
      Contagion: a level becoming SEVERE flips the linked LaunchSeason OPEN -> GUARDED.
    input_set: "all PatentCases with category_id == this category; SETTLED and JUDGED_FAVORABLE cases contribute nothing"
    constants: { CASE_WEIGHT_LOW: 2, CASE_WEIGHT_MED: 5, CASE_WEIGHT_HIGH: 9, ADVERSE_WEIGHT_MULTIPLIER: 3, EXPOSURE_ELEVATED_MIN: 8, EXPOSURE_SEVERE_MIN: 20 }
    precision: "integer index"

  - name: replenishment_quantity
    trigger: "POST /replenishment-orders"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (five inputs, three nested gates):
        1. velocity gate: weekly_velocity >= REPLENISH_MIN_WEEKLY_UNITS (50, inclusive),
           otherwise ERR_VELOCITY_BELOW_THRESHOLD.
        2. raw_need = COVER_WEEKS (3) * weekly_velocity - on_hand_units - in_transit_units.
           If raw_need <= 0 -> ERR_REPLENISHMENT_NOT_NEEDED (exactly zero is rejected).
        3. rounded_need = ceil(raw_need / case_pack_units) * case_pack_units
           (case-pack rounding happens AFTER the zero-clamp branch, never before).
        4. capacity_free = variant.factory_partner.capacity_units_total
                           - variant.factory_partner.allocated_units.
           If rounded_need > capacity_free -> ERR_CAPACITY_EXCEEDED (no partial fills).
        5. quantity_units = rounded_need.
    input_set: "the request's velocity/on-hand/in-transit/case-pack plus the variant's FactoryPartner capacity fields"
    constants: { COVER_WEEKS: 3, REPLENISH_MIN_WEEKLY_UNITS: 50 }
    precision: "integer units"

  - name: shortfall_penalty
    trigger: "FactoryPartner suspension cascade (POST /factory-partners/{id}/suspend)"
    algorithm: aggregation
    formula: |
      Per OPEN commitment on a variant tooled at the suspended partner:
        penalty_cents = committed_units * SHORTFALL_PENALTY_CENTS (150).
      LaunchSeason.penalty_accrual_cents += penalty_cents for each penalized commitment
      (running accrual applied at cascade time; never recomputed backward).
    input_set: "LaunchCommitments with status OPEN whose variant's factory_partner_id == the suspended partner"
    constants: { SHORTFALL_PENALTY_CENTS: 150 }
    precision: "integer cents"

# =============================================================================
# Conservation invariants (Rule-9 anchors — explicit formulas over entity fields)
# =============================================================================
invariants:
  - name: partner_capacity_conservation
    formula: |
      For every FactoryPartner p, at all times:
        p.allocated_units ==
          SUM committed_units over LaunchCommitments (status == OPEN)
              on variants with factory_partner_id == p.id
          + SUM quantity_units over ReplenishmentOrders (status == OPEN)
              on variants with factory_partner_id == p.id.
      The create/cancel compensating pair on a commitment (and the
      create/supersede pair on a replenishment) MUST leave this identity exact —
      a cascade that drifts is a defect.
    conserved_quantity: "factory unit capacity"
  - name: litigation_reserve_reconciliation
    formula: |
      For every Category c, at all times:
        c.active_reserve_cents ==
          SUM provisional_reserve_cents over PatentCases in {FILED, ACTIVE}
          + SUM final_amount_cents over PatentCases in {SETTLED, JUDGED_ADVERSE}.
      The accrue/release compensating pair (create case -> judgment FAVORABLE,
      or create case -> settle) MUST return the ledger to its prior value exactly.
    conserved_quantity: "legal reserve money ledger"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — a request failing several
# checks reports the lowest-priority-numbered failure)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-blank; X-User-Role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the role named by X-User-Role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path-template ids resolve left-to-right; then request-body FK fields (season_id, category_id, concept_id, factory_partner_id, variant_id, agreement_id) resolve"
    error_id: "ERR_<ENTITY>_NOT_FOUND (ERR_SEASON_NOT_FOUND | ERR_CATEGORY_NOT_FOUND | ERR_CONCEPT_NOT_FOUND | ERR_ROUND_NOT_FOUND | ERR_PARTNER_NOT_FOUND | ERR_VARIANT_NOT_FOUND | ERR_STUDY_NOT_FOUND | ERR_MEDIA_TEST_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_CASE_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"
  - priority: 4
    category: state
    check: "posture gate — resolve the owning season (concept->category->season; variant->concept->category->season; study/media/commitment/replenishment via variant; agreement via category). SEASON_FROZEN blocks every season-scoped mutation with ERR_SEASON_FROZEN; SEASON_CLOSED likewise with ERR_SEASON_CLOSED; SEASON_GUARDED blocks only POST /media-tests/{id}/air with ERR_SEASON_GUARDED (retail signing continues under GUARDED unless the category itself is SEVERE, which is the priority-7 litigation gate). Patent-case endpoints, factory-partner endpoints, season admin endpoints, and GETs are exempt. POST /categories is exempt from SEASON_FROZEN (admin repair path) but NOT from SEASON_CLOSED."
    error_id: "ERR_SEASON_FROZEN | ERR_SEASON_CLOSED | ERR_SEASON_GUARDED"
    http_status: 409
    applies_to: "season-scoped mutating endpoints per the rule text"
  - priority: 5
    category: state
    check: "entity-level transition preconditions: the target resource is in a state from which the requested transition exists (incl. cross-entity state gates: variant TOOLED for study creation, variant in {TOOLED, DR_TESTING, RETAIL_LIVE} for media creation, partner ACTIVE for tooling, concept ENGINEERING_LOCKED for variant creation, commitment gate on DR_TESTING+DECIDED_SCALE -> ERR_VARIANT_NOT_RETAIL_READY, close aggregate preconditions -> ERR_CLOSE_PRECONDITIONS_UNMET)"
    error_id: "ERR_INVALID_STATE | ERR_PARTNER_NOT_ACTIVE | ERR_VARIANT_NOT_RETAIL_READY | ERR_CLOSE_PRECONDITIONS_UNMET"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "OCC version precondition on the two concurrency-guarded writes: expected_variant_version == ModelVariant.version; expected_agreement_version == RetailAgreement.version"
    error_id: "ERR_STALE_VARIANT_VERSION | ERR_STALE_AGREEMENT_VERSION"
    http_status: 412
    applies_to: "POST /replenishment-orders, POST /launch-commitments"
  - priority: 7
    category: business_safety
    check: "compliance gates: segregation of duties (substantiate and settle require a different X-User-ID than the creator); claim clearance SUBSTANTIATED before media air; category exposure_level != SEVERE before signing a retail agreement"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_CLAIM_NOT_SUBSTANTIATED | ERR_CATEGORY_LITIGATION_BLOCKED"
    http_status: "403 | 422 | 422"
    applies_to: "POST /claim-studies/{id}/substantiate, POST /patent-cases/{id}/settle, POST /media-tests/{id}/air, POST /retail-agreements/{id}/sign"
  - priority: 8
    category: business_temporal
    check: "temporal-window rules: exclusive-window half-open overlap on sign; window already elapsed on sign; commitment need_by_date inside the agreement window; factory tooling slot windows free"
    error_id: "ERR_EXCLUSIVE_WINDOW_CONFLICT | ERR_WINDOW_ELAPSED | ERR_COMMITMENT_OUTSIDE_WINDOW | ERR_TOOLING_SLOTS_FULL"
    http_status: 409
    applies_to: "POST /retail-agreements/{id}/sign, POST /launch-commitments, POST /model-variants/{id}/tool"
  - priority: 9
    category: business_constraint
    check: "domain constraints: insight presence and momentum gates on advance; round budget/occupancy; claim sample size and margin; media decision band; model-number uniqueness; replenishment velocity and zero-need"
    error_id: "ERR_NO_RESEARCH_INSIGHTS | ERR_RESEARCH_SCORE_TOO_LOW | ERR_ROUND_ALREADY_OPEN | ERR_ROUND_NOT_PASSED | ERR_SAMPLE_SIZE_TOO_SMALL | ERR_MARGIN_BELOW_MINIMUM | ERR_DECISION_BAND_MISMATCH | ERR_MODEL_NUMBER_CONFLICT | ERR_VELOCITY_BELOW_THRESHOLD | ERR_REPLENISHMENT_NOT_NEEDED"
    http_status: "422 (ERR_ROUND_ALREADY_OPEN and ERR_MODEL_NUMBER_CONFLICT: 409)"
    applies_to: "per-rule endpoints"
  - priority: 10
    category: business_fiscal
    check: "capacity check: FactoryPartner free capacity (capacity_units_total - allocated_units) must cover the requested committed_units / rounded replenishment quantity"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /launch-commitments, POST /replenishment-orders"

# =============================================================================
# §1.5 API Endpoint Table (flat root-level collections; 49 endpoints)
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock. Startup default is exactly 2026-09-01T00:00:00Z (CLOCK_DEFAULT_ISO); before any set_current_utc call the clock reads this default and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set; all time-derived rules (decay, expiry, windows, cadence) evaluate against this clock"]

  - method: POST
    path: "/launch-seasons"
    description: "Create a launch season (posture container). Initial posture SEASON_OPEN, review_index 0."
    roles: [PlatformAdmin]
    code: 201
    input: [season_code]
    output: LaunchSeason
    side_effects: []

  - method: GET
    path: "/launch-seasons/{id}"
    description: "Fetch one season including computed posture, review_index, and penalty_accrual_cents."
    roles: &ALL_ROLES [PlatformAdmin, ProductLead, SourcingManager, ClaimsScientist, MediaBuyer, RetailExec, LegalCounsel]
    code: 200
    input: []
    output: LaunchSeason
    side_effects: []

  - method: GET
    path: "/launch-seasons/{id}/categories"
    description: "List categories launched under this season (FK reverse-reachability for Category.season_id)."
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: Category[]
    side_effects: []

  - method: POST
    path: "/launch-seasons/{id}/freeze"
    description: "SEASON_OPEN|SEASON_GUARDED -> SEASON_FROZEN."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: LaunchSeason
    side_effects: ["posture -> SEASON_FROZEN; frozen_at_review_index = review_index; increments LaunchSeason.version by 1"]

  - method: POST
    path: "/launch-seasons/{id}/unfreeze"
    description: "SEASON_FROZEN -> SEASON_OPEN; requires review_index > frozen_at_review_index and no SEVERE category."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: LaunchSeason
    side_effects: ["posture -> SEASON_OPEN; frozen_at_review_index = null; increments LaunchSeason.version by 1"]

  - method: POST
    path: "/launch-seasons/{id}/close"
    description: "SEASON_OPEN -> SEASON_CLOSED with aggregate close preconditions."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: LaunchSeason
    side_effects: ["posture -> SEASON_CLOSED; increments LaunchSeason.version by 1"]

  - method: POST
    path: "/launch-seasons/{id}/run-review"
    description: "Ops-run checkpoint: advances review_index and applies the 11 ordered review steps (case activation, round expiry, concept deadline kill, media auto-kill, commitment fulfillment, replenishment fulfillment, agreement expiry, variant go-live, refresh candidacy, retirement cascade, exposure/posture reconciliation)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: LaunchSeason
    side_effects: ["review_index += 1; last_review_at = clock; the 11 ordered step side_effects from the LaunchSeason state machine; increments LaunchSeason.version by 1"]

  - method: POST
    path: "/categories"
    description: "Create a category workspace inside a season. exposure_index initializes to crowding_base; exposure_level banded immediately."
    roles: [PlatformAdmin]
    code: 201
    input: [season_id, name, crowding_base]
    output: Category
    side_effects: ["exposure_index = crowding_base; exposure_level banded per patent_exposure_index (base >= 8 starts ELEVATED, >= 20 starts SEVERE and immediately guards the season)"]

  - method: GET
    path: "/categories/{id}"
    description: "Fetch one category including computed exposure_index, exposure_level, active_reserve_cents."
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Category
    side_effects: []

  - method: GET
    path: "/categories/{id}/retail-agreements"
    description: "List retail agreements on this category (FK reverse for RetailAgreement.category_id)."
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: RetailAgreement[]
    side_effects: []

  - method: GET
    path: "/categories/{id}/patent-cases"
    description: "List patent cases on this category (FK reverse for PatentCase.category_id)."
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: PatentCase[]
    side_effects: []

  - method: POST
    path: "/concepts"
    description: "Create a product concept in a category. Initial status IDENTIFIED."
    roles: [ProductLead]
    code: 201
    input: [category_id, title]
    output: ProductConcept
    side_effects: []

  - method: GET
    path: "/concepts/{id}"
    description: "Fetch one concept; research_momentum is re-evaluated against the current logical clock on read."
    roles: *ALL_ROLES
    code: 200
    input: []
    output: ProductConcept
    side_effects: []

  - method: GET
    path: "/concepts"
    description: "List concepts, optionally filtered by category and/or status (FK reverse for ProductConcept.category_id)."
    roles: *ALL_ROLES
    code: 200
    input: ["category_id?", "status?", "limit?", "offset?"]
    output: ProductConcept[]
    side_effects: []

  - method: POST
    path: "/concepts/{id}/insights"
    description: "Append one research insight {points, observed_at}; recomputes research_momentum."
    roles: [ProductLead]
    code: 201
    input: [points, observed_at]
    output: ProductConcept
    side_effects: ["insight appended to research_insights; research_momentum recomputed per research_momentum_score; increments ProductConcept.version by 1"]

  - method: POST
    path: "/concepts/{id}/advance"
    description: "Advance the concept one step along IDENTIFIED -> RESEARCHING -> CONCEPT_LOCKED -> PROTOTYPE_CYCLING -> ENGINEERING_LOCKED per gate preconditions."
    roles: [ProductLead]
    code: 200
    input: []
    output: ProductConcept
    side_effects: ["status transition per ProductConcept machine; increments ProductConcept.version by 1"]

  - method: POST
    path: "/concepts/{id}/rounds"
    description: "Open a new prototype round. Requires the concept in PROTOTYPE_CYCLING with no other OPEN round (ERR_ROUND_ALREADY_OPEN); the MAX_ROUNDS_PER_CYCLE budget is enforced by the revert-to-RESEARCHING transition, not at creation."
    roles: [ProductLead]
    code: 201
    input: []
    output: PrototypeRound
    side_effects: ["round_number = 1 + count of prior rounds of this concept; opened_at = clock"]

  - method: GET
    path: "/concepts/{id}/rounds"
    description: "List prototype rounds of a concept ordered by round_number ASC (FK reverse for PrototypeRound.concept_id)."
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: PrototypeRound[]
    side_effects: []

  - method: POST
    path: "/prototype-rounds/{id}/complete"
    description: "Score an OPEN round (OPEN -> SCORED); failing scores consume budget and may revert the concept to RESEARCHING."
    roles: [ProductLead]
    code: 200
    input: [score, "feedback?"]
    output: PrototypeRound
    side_effects: ["status -> SCORED; ProductConcept.rounds_used += 1; if score < ROUND_PASS_SCORE and rounds_used == MAX_ROUNDS_PER_CYCLE the concept -> RESEARCHING with rounds_used reset to 0"]

  - method: POST
    path: "/factory-partners"
    description: "Register a factory partner. Initial status ACTIVE, allocated_units 0."
    roles: [SourcingManager]
    code: 201
    input: [name, capacity_units_total]
    output: FactoryPartner
    side_effects: []

  - method: GET
    path: "/factory-partners/{id}"
    description: "Fetch one partner including computed allocated_units."
    roles: *ALL_ROLES
    code: 200
    input: []
    output: FactoryPartner
    side_effects: []

  - method: POST
    path: "/factory-partners/{id}/suspend"
    description: "ACTIVE -> SUSPENDED (terminal); strands OPEN commitments as SHORTFALL_PENALIZED and cancels OPEN replenishments."
    roles: [SourcingManager]
    code: 200
    input: []
    output: FactoryPartner
    side_effects: ["commitment penalty cascade + replenishment cancellation per FactoryPartner machine; allocated_units recomputed; increments FactoryPartner.version by 1"]

  - method: POST
    path: "/model-variants"
    description: "Create a channel-differentiated model variant. Requires concept ENGINEERING_LOCKED (ERR_INVALID_STATE otherwise); model_number globally unique (ERR_MODEL_NUMBER_CONFLICT)."
    roles: [ProductLead]
    code: 201
    input: [concept_id, model_number, channel]
    output: ModelVariant
    side_effects: []

  - method: GET
    path: "/model-variants/{id}"
    description: "Fetch one variant including both parallel state dimensions (lifecycle, claim_clearance)."
    roles: *ALL_ROLES
    code: 200
    input: []
    output: ModelVariant
    side_effects: []

  - method: GET
    path: "/model-variants"
    description: "List variants with filters (FK reverse for ModelVariant.concept_id and ModelVariant.factory_partner_id)."
    roles: *ALL_ROLES
    code: 200
    input: ["concept_id?", "factory_partner_id?", "lifecycle?", "claim_clearance?", "limit?", "offset?"]
    output: ModelVariant[]
    side_effects: []

  - method: POST
    path: "/model-variants/{id}/tool"
    description: "Tool a DRAFT variant at a factory partner (DRAFT -> TOOLED); books a 14-day tooling slot."
    roles: [SourcingManager]
    code: 200
    input: [factory_partner_id]
    output: ModelVariant
    side_effects: ["factory_partner_id set; tooled_at = clock; lifecycle -> TOOLED; increments ModelVariant.version by 1"]

  - method: GET
    path: "/model-variants/{id}/claim-studies"
    description: "List claim studies for a variant (FK reverse for ClaimStudy.variant_id)."
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: ClaimStudy[]
    side_effects: []

  - method: GET
    path: "/model-variants/{id}/media-tests"
    description: "List media tests for a variant (FK reverse for MediaTest.variant_id)."
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: MediaTest[]
    side_effects: []

  - method: GET
    path: "/model-variants/{id}/replenishments"
    description: "List replenishment orders for a variant (FK reverse for ReplenishmentOrder.variant_id)."
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: ReplenishmentOrder[]
    side_effects: []

  - method: POST
    path: "/claim-studies"
    description: "Open a comparative-claim study on a TOOLED variant. Initial status RUNNING; conducted_by_user_id = X-User-ID."
    roles: [ClaimsScientist]
    code: 201
    input: [variant_id, claim_text]
    output: ClaimStudy
    side_effects: ["conducted_by_user_id = X-User-ID"]

  - method: POST
    path: "/claim-studies/{id}/complete"
    description: "Record study results (RUNNING -> RESULTS_RECORDED); computes margin."
    roles: [ClaimsScientist]
    code: 200
    input: [our_metric, baseline_metric, sample_size]
    output: ClaimStudy
    side_effects: ["margin computed per claim_margin; increments ClaimStudy.version by 1"]

  - method: POST
    path: "/claim-studies/{id}/substantiate"
    description: "Substantiate recorded results (RESULTS_RECORDED -> SUBSTANTIATED). Segregation of duties: caller must differ from conducted_by_user_id."
    roles: [ClaimsScientist]
    code: 200
    input: []
    output: ClaimStudy
    side_effects: ["substantiated_by_user_id = X-User-ID; ModelVariant.claim_clearance -> SUBSTANTIATED; increments ClaimStudy.version by 1"]

  - method: POST
    path: "/claim-studies/{id}/challenge"
    description: "Legal challenge to a substantiated claim (SUBSTANTIATED -> CHALLENGED)."
    roles: [LegalCounsel]
    code: 200
    input: [reason]
    output: ClaimStudy
    side_effects: ["challenge_reason set; ModelVariant.claim_clearance -> CHALLENGED; increments ClaimStudy.version by 1"]

  - method: POST
    path: "/claim-studies/{id}/retest"
    description: "Send a challenged study back to RUNNING; clears recorded results."
    roles: [ClaimsScientist]
    code: 200
    input: []
    output: ClaimStudy
    side_effects: ["results fields reset to null; ModelVariant.claim_clearance -> UNSUBSTANTIATED; increments ClaimStudy.version by 1"]

  - method: POST
    path: "/media-tests"
    description: "Create a long-form video / infomercial test. Requires variant lifecycle in {TOOLED, DR_TESTING, RETAIL_LIVE}. Initial status EDITING."
    roles: [MediaBuyer]
    code: 201
    input: [variant_id, title, media_spend_cents]
    output: MediaTest
    side_effects: []

  - method: POST
    path: "/media-tests/{id}/air"
    description: "Air the test (EDITING -> AIRING); requires claim_clearance SUBSTANTIATED and season not GUARDED; computes provisional_mer."
    roles: [MediaBuyer]
    code: 200
    input: [projected_gross_cents]
    output: MediaTest
    side_effects: ["aired_at = clock; provisional_mer per media_efficiency_ratio provisional variant; variant TOOLED -> DR_TESTING when applicable; increments MediaTest.version by 1"]

  - method: POST
    path: "/media-tests/{id}/decide"
    description: "Decide SCALE or KILL from settled_mer (AIRING -> DECIDED_SCALE | KILLED); decision must match the MER_SCALE_MIN band; order_lines must be a non-empty array of {revenue_cents, cancels_cents, returns_cents} (empty -> ERR_INVALID_REQUEST)."
    roles: [MediaBuyer]
    code: 200
    input: [decision, order_lines]
    output: MediaTest
    side_effects: ["settled_mer per media_efficiency_ratio settled variant (pinned per-line rounding order); decided_at = clock; increments MediaTest.version by 1"]

  - method: POST
    path: "/retail-agreements"
    description: "Draft a retail agreement (exclusive or not) over a half-open launch window. Initial status DRAFT."
    roles: [RetailExec]
    code: 201
    input: [category_id, retailer_name, exclusive, window_start, window_end, min_launch_units]
    output: RetailAgreement
    side_effects: []

  - method: GET
    path: "/retail-agreements/{id}"
    description: "Fetch one agreement."
    roles: *ALL_ROLES
    code: 200
    input: []
    output: RetailAgreement
    side_effects: []

  - method: POST
    path: "/retail-agreements/{id}/sign"
    description: "Sign a DRAFT agreement (DRAFT -> SIGNED) after posture, litigation, exclusivity-overlap, and window-elapsed checks."
    roles: [RetailExec]
    code: 200
    input: []
    output: RetailAgreement
    side_effects: ["signed_at = clock; increments RetailAgreement.version by 1"]

  - method: POST
    path: "/launch-commitments"
    description: "Commit launch quantity against a SIGNED agreement for a DR_TESTING variant that has a DECIDED_SCALE media test. OCC-guarded on the agreement's version."
    roles: [SourcingManager]
    code: 201
    input: [agreement_id, variant_id, committed_units, need_by_date, expected_agreement_version]
    output: LaunchCommitment
    side_effects: ["FactoryPartner.allocated_units += committed_units; increments RetailAgreement.version by 1 (OCC parent); increments LaunchCommitment.version starts at 1"]

  - method: GET
    path: "/launch-commitments/{id}"
    description: "Fetch one commitment."
    roles: *ALL_ROLES
    code: 200
    input: []
    output: LaunchCommitment
    side_effects: []

  - method: GET
    path: "/launch-commitments"
    description: "List commitments with filters (FK reverse for LaunchCommitment.agreement_id and LaunchCommitment.variant_id)."
    roles: *ALL_ROLES
    code: 200
    input: ["agreement_id?", "variant_id?", "status?", "limit?", "offset?"]
    output: LaunchCommitment[]
    side_effects: []

  - method: POST
    path: "/launch-commitments/{id}/cancel"
    description: "Cancel an OPEN commitment, releasing its capacity."
    roles: [SourcingManager]
    code: 200
    input: []
    output: LaunchCommitment
    side_effects: ["status -> CANCELLED; FactoryPartner.allocated_units -= committed_units; increments LaunchCommitment.version by 1"]

  - method: POST
    path: "/replenishment-orders"
    description: "Place a rapid replenishment order for a RETAIL_LIVE variant; supersedes any prior OPEN order for that variant. OCC-guarded on the variant's version."
    roles: [RetailExec]
    code: 201
    input: [variant_id, weekly_velocity, on_hand_units, in_transit_units, case_pack_units, expected_variant_version]
    output: ReplenishmentOrder
    side_effects: ["quantity_units computed per replenishment_quantity; any prior OPEN ReplenishmentOrder on this variant -> SUPERSEDED (superseded_by_id set); FactoryPartner.allocated_units += quantity_units; increments ModelVariant.version by 1 (OCC parent)"]

  - method: POST
    path: "/patent-cases"
    description: "File a patent case in a category. Initial status FILED; provisional reserve booked immediately."
    roles: [LegalCounsel]
    code: 201
    input: [category_id, case_number, claim_cents, severity]
    output: PatentCase
    side_effects: ["provisional_reserve_cents per litigation_reserve; filed_by_user_id = X-User-ID; Category.exposure_index/level and active_reserve_cents recompute; season may flip SEASON_OPEN -> SEASON_GUARDED"]

  - method: POST
    path: "/patent-cases/{id}/settle"
    description: "Settle a FILED or ACTIVE case. Segregation of duties: caller must differ from filed_by_user_id."
    roles: [LegalCounsel]
    code: 200
    input: [settlement_cents]
    output: PatentCase
    side_effects: ["status -> SETTLED; final_amount_cents = settlement_cents; Category reserve + exposure recompute; increments PatentCase.version by 1"]

  - method: POST
    path: "/patent-cases/{id}/record-judgment"
    description: "Record a court judgment on an ACTIVE case (ADVERSE requires award_cents > 0; FAVORABLE releases the reserve)."
    roles: [LegalCounsel]
    code: 200
    input: [outcome, "award_cents?"]
    output: PatentCase
    side_effects: ["status -> JUDGED_ADVERSE | JUDGED_FAVORABLE; final_amount_cents set; Category reserve + exposure recompute with ADVERSE_WEIGHT_MULTIPLIER on adverse; season may flip SEASON_OPEN -> SEASON_GUARDED; increments PatentCase.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog (43 codes)
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, malformed value, enum outside the declared set, numeric range violated (score 0..100, crowding_base 0..10, baseline_metric > 0, positive integer quantities), window_end <= window_start, duplicate season_code or case_number, or ADVERSE judgment without award_cents" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing/blank, or X-User-Role names no declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role not in the endpoint's roles list" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Caller X-User-ID equals the creator's id on a segregation-guarded step: claim-study substantiate (vs conducted_by_user_id) or patent-case settle (vs filed_by_user_id)" }
  - { id: ERR_SEASON_NOT_FOUND, http: 404, condition: "LaunchSeason id in path (or season_id FK in body) does not resolve" }
  - { id: ERR_CATEGORY_NOT_FOUND, http: 404, condition: "Category id in path (or category_id FK in body) does not resolve" }
  - { id: ERR_CONCEPT_NOT_FOUND, http: 404, condition: "ProductConcept id in path does not resolve" }
  - { id: ERR_ROUND_NOT_FOUND, http: 404, condition: "PrototypeRound id in path does not resolve" }
  - { id: ERR_PARTNER_NOT_FOUND, http: 404, condition: "FactoryPartner id in path (or factory_partner_id FK in body) does not resolve" }
  - { id: ERR_VARIANT_NOT_FOUND, http: 404, condition: "ModelVariant id in path (or variant_id FK in body) does not resolve" }
  - { id: ERR_STUDY_NOT_FOUND, http: 404, condition: "ClaimStudy id in path does not resolve" }
  - { id: ERR_MEDIA_TEST_NOT_FOUND, http: 404, condition: "MediaTest id in path does not resolve" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "RetailAgreement id in path (or agreement_id FK in body) does not resolve" }
  - { id: ERR_COMMITMENT_NOT_FOUND, http: 404, condition: "LaunchCommitment id in path (or FK filter) does not resolve" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "PatentCase id in path does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the entity's current state (double advance, double complete, air a decided test, tool a non-DRAFT variant, cancel a non-OPEN commitment, judgment on a non-ACTIVE case, unfreeze a non-FROZEN season, state-changing call on a terminal entity)" }
  - { id: ERR_SEASON_GUARDED, http: 409, condition: "Season posture is SEASON_GUARDED and the endpoint is launch-throttled (POST /media-tests/{id}/air only)" }
  - { id: ERR_SEASON_FROZEN, http: 409, condition: "Season posture is SEASON_FROZEN and the endpoint is a season-scoped mutation" }
  - { id: ERR_SEASON_CLOSED, http: 409, condition: "Season posture is SEASON_CLOSED (blocks all season-scoped mutations and run-review)" }
  - { id: ERR_PARTNER_NOT_ACTIVE, http: 409, condition: "POST /model-variants/{id}/tool targets a FactoryPartner whose status is SUSPENDED" }
  - { id: ERR_ROUND_ALREADY_OPEN, http: 409, condition: "POST /concepts/{id}/rounds while another round of the same concept is still OPEN" }
  - { id: ERR_EXCLUSIVE_WINDOW_CONFLICT, http: 409, condition: "Signing would make two exclusive SIGNED agreements overlap on the same category under half-open [window_start, window_end) semantics (adjacent windows where end == start do NOT conflict)" }
  - { id: ERR_MODEL_NUMBER_CONFLICT, http: 409, condition: "model_number already exists on another ModelVariant (global uniqueness — channel differentiation forbids reuse)" }
  - { id: ERR_WINDOW_ELAPSED, http: 409, condition: "Signing an agreement whose window_end <= current logical clock" }
  - { id: ERR_COMMITMENT_OUTSIDE_WINDOW, http: 409, condition: "need_by_date lies outside the agreement's half-open [window_start, window_end)" }
  - { id: ERR_TOOLING_SLOTS_FULL, http: 409, condition: "Tooling would exceed TOOLING_PARALLEL_SLOTS (2) simultaneous tooling engagements at the partner (aggregate-capacity overlap semantics)" }
  - { id: ERR_CLOSE_PRECONDITIONS_UNMET, http: 409, condition: "Season close blocked by live variants, OPEN commitments/replenishments, or FILED/ACTIVE patent cases" }
  - { id: ERR_STALE_VARIANT_VERSION, http: 412, condition: "expected_variant_version != ModelVariant.version on POST /replenishment-orders (OCC)" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_agreement_version != RetailAgreement.version on POST /launch-commitments (OCC)" }
  - { id: ERR_NO_RESEARCH_INSIGHTS, http: 422, condition: "Advance IDENTIFIED -> RESEARCHING with zero research insights recorded" }
  - { id: ERR_RESEARCH_SCORE_TOO_LOW, http: 422, condition: "Advance RESEARCHING -> CONCEPT_LOCKED with research_momentum < RESEARCH_SCORE_MIN (40.0)" }
  - { id: ERR_ROUND_NOT_PASSED, http: 422, condition: "Advance PROTOTYPE_CYCLING -> ENGINEERING_LOCKED without a SCORED round >= ROUND_PASS_SCORE (75) in the current cycle" }
  - { id: ERR_SAMPLE_SIZE_TOO_SMALL, http: 422, condition: "POST /claim-studies/{id}/complete with sample_size < CLAIM_MIN_SAMPLES (30)" }
  - { id: ERR_MARGIN_BELOW_MINIMUM, http: 422, condition: "POST /claim-studies/{id}/substantiate with margin < CLAIM_MIN_MARGIN (0.15); the study remains RESULTS_RECORDED" }
  - { id: ERR_CLAIM_NOT_SUBSTANTIATED, http: 422, condition: "POST /media-tests/{id}/air while the variant's claim_clearance != SUBSTANTIATED" }
  - { id: ERR_CATEGORY_LITIGATION_BLOCKED, http: 422, condition: "POST /retail-agreements/{id}/sign while the category's exposure_level == SEVERE" }
  - { id: ERR_DECISION_BAND_MISMATCH, http: 422, condition: "POST /media-tests/{id}/decide with decision = SCALE but settled_mer < MER_SCALE_MIN (2.0), or decision = KILL but settled_mer >= MER_SCALE_MIN" }
  - { id: ERR_VELOCITY_BELOW_THRESHOLD, http: 422, condition: "POST /replenishment-orders with weekly_velocity < REPLENISH_MIN_WEEKLY_UNITS (50) — replenishment is for successful items only" }
  - { id: ERR_REPLENISHMENT_NOT_NEEDED, http: 422, condition: "POST /replenishment-orders whose raw_need (COVER_WEEKS * velocity - on_hand - in_transit) is <= 0 — zero is rejected" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Requested units exceed the factory partner's free capacity (capacity_units_total - allocated_units); no partial fills" }
  - { id: ERR_VARIANT_NOT_RETAIL_READY, http: 422, condition: "POST /launch-commitments for a variant not in DR_TESTING or lacking a DECIDED_SCALE media test" }

# =============================================================================
# §1.7 RBAC Matrix (all roles opaque — X-User-ID is an operator identifier never
# equal to any entity id; segregation-of-duties compares X-User-IDs between users)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operations administrator: owns the logical clock, seasons, categories, and the run-review checkpoint"
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /launch-seasons", "POST /launch-seasons/{id}/freeze", "POST /launch-seasons/{id}/unfreeze", "POST /launch-seasons/{id}/close", "POST /launch-seasons/{id}/run-review", "POST /categories"]
    shared_operations: ["all GET endpoints"]
  - name: ProductLead
    description: "Owns consumer research, concept iteration, prototype cycles, and model-number creation"
    identity: opaque
    exclusive_operations: ["POST /concepts", "POST /concepts/{id}/insights", "POST /concepts/{id}/advance", "POST /concepts/{id}/rounds", "POST /prototype-rounds/{id}/complete", "POST /model-variants"]
    shared_operations: ["all GET endpoints"]
  - name: SourcingManager
    description: "Owns factory partners, tooling slots, and launch quantity commitments"
    identity: opaque
    exclusive_operations: ["POST /factory-partners", "POST /factory-partners/{id}/suspend", "POST /model-variants/{id}/tool", "POST /launch-commitments", "POST /launch-commitments/{id}/cancel"]
    shared_operations: ["all GET endpoints"]
  - name: ClaimsScientist
    description: "Runs comparative product testing; substantiation is segregation-guarded (a second scientist must approve)"
    identity: opaque
    exclusive_operations: ["POST /claim-studies", "POST /claim-studies/{id}/complete", "POST /claim-studies/{id}/substantiate", "POST /claim-studies/{id}/retest"]
    shared_operations: ["all GET endpoints"]
  - name: MediaBuyer
    description: "Owns long-form video / infomercial tests and the scale-or-kill decision"
    identity: opaque
    exclusive_operations: ["POST /media-tests", "POST /media-tests/{id}/air", "POST /media-tests/{id}/decide"]
    shared_operations: ["all GET endpoints"]
  - name: RetailExec
    description: "Owns retail partner agreements and rapid replenishment orders"
    identity: opaque
    exclusive_operations: ["POST /retail-agreements", "POST /retail-agreements/{id}/sign", "POST /replenishment-orders"]
    shared_operations: ["all GET endpoints"]
  - name: LegalCounsel
    description: "Owns the patent landscape: case filing, settlement (segregation-guarded), judgments, and claim challenges"
    identity: opaque
    exclusive_operations: ["POST /patent-cases", "POST /patent-cases/{id}/settle", "POST /patent-cases/{id}/record-judgment", "POST /claim-studies/{id}/challenge"]
    shared_operations: ["all GET endpoints"]
