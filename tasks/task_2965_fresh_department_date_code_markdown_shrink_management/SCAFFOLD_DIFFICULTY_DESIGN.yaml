          The pickup carries two independent state dimensions: confirming moves logistics_status
          SCHEDULED -> CONFIRMED while manifest_status stays DRAFT, completing from that combined
          state is rejected with ERR_MANIFEST_NOT_SEALED (409), and sealing then moves
