              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/stores"
              payload: { market_id: "${m_id}", store_code: "STORE-101", override_authority_cents: 5000, label_printer_capacity_per_day: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-ALPHA", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY", price_match_eligible: true }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 95, attribute_score: 95, image_score: 95, competitor_identifier: "00712345678905" }
              as: PricingAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /pricing/matches/${l_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/match-policies"
              payload: { market_id: "${m_id}", eligible_competitor_tiers: ["PRIMARY"], daily_override_budget_cents: 100000, max_match_discount_pct: 0.25, claim_window_hours: 168 }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /pricing/claims"
              payload: { policy_id: "${pol_id}", product_id: "${p_id}", competitor_id: "${c1_id}", store_id: "${s_id}", claimed_price_cents: 5000, claimed_observed_at: "2026-07-31T18:00:00Z", competitor_evidence_ref: "flyer-1" }
              as: StoreAssociate
              as_user_id: "${s_id}"
              captures: { err_map: $.data.error_id }
            - call: "POST /pricing/claims"
              payload: { policy_id: "${pol_id}", product_id: "${p_id}", competitor_id: "${c1_id}", store_id: "${s_id}", claimed_price_cents: 9900, claimed_observed_at: "2026-07-31T18:00:00Z", competitor_evidence_ref: "flyer-2" }
              as: StoreAssociate
              as_user_id: "${s_id}"
              captures: { err_cap: $.data.error_id }
          assert:
            - "First call: HTTP 422 with error_id == ERR_MAP_FLOOR_VIOLATION (claimed 5000 < map_floor 9000)"
            - "First call: error_id != ERR_MATCH_DISCOUNT_CAP_EXCEEDED although honored would be 9000 and discount 3999 > cap 3250"
            - "Second call: HTTP 422 with error_id == ERR_MATCH_DISCOUNT_CAP_EXCEEDED (honored 9405 = 9900 - 495, discount 3594 > 3250)"
            - "GET /pricing/claims?store_id=${s_id} returns total_count == 0 — neither rejected claim was persisted"
            - "Store.${s_id}.override_budget_used_cents == 0 and PriceMatchPolicy.${pol_id}.honored_claim_count == 0"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: confidence_exactly_8500_confirms_while_8485_is_refused
        grounds:
          - calculations.match_confidence_score
          - validations.priority_69_ERR_CONFIDENCE_BELOW_CONFIRM_THRESHOLD
          - endpoints.POST_/pricing/matches/{id}/review
        distinguishing_aspect: |
          Metric: confidence_bp against the 8500 PROPOSED confirm threshold, exercised on
          POST /pricing/matches/{id}/review. One image-score point (80 vs 79) moves the
          blend 15 bp across the boundary, and the comparison is inclusive (>=), so 8500
          confirms while 8485 is refused.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Market US-WEST, ACTIVE PRIMARY competitor C-ALPHA, two ACTIVE products SKU-EDGE-A and SKU-EDGE-B."
            - "ATTRIBUTE link A on SKU-EDGE-A with 100 / 60 / 80 -> 55*100 + 30*60 + 15*80 == 8500 bp, grade EXACT."
            - "ATTRIBUTE link B on SKU-EDGE-B with 100 / 60 / 79 -> 8485 bp, grade CLOSE."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800, index_tolerance_bp: 150 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-ALPHA", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-EDGE-A", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000, margin_floor_pct: 0.20, map_floor_cents: 0, index_weight_bp: 10000 }
              as: PlatformAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-EDGE-B", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000, margin_floor_pct: 0.20, map_floor_cents: 0, index_weight_bp: 10000 }
              as: PlatformAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${pa_id}", competitor_id: "${c1_id}", match_method: "ATTRIBUTE", identifier_score: 100, attribute_score: 60, image_score: 80 }
              as: PricingAnalyst
              captures: { la_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${pb_id}", competitor_id: "${c1_id}", match_method: "ATTRIBUTE", identifier_score: 100, attribute_score: 60, image_score: 79 }
              as: PricingAnalyst
              captures: { lb_id: $.data.id }
          trigger:
            - call: "POST /pricing/matches/${la_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/matches/${lb_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { err: $.data.error_id }
          assert:
            - "CompetitorProductLink.${la_id}.confidence_bp == 8500, match_grade == EXACT, confidence_variant == ATTRIBUTE_BLEND"
            - "First call succeeds: CompetitorProductLink.${la_id}.status == CONFIRMED (8500 >= 8500 is inclusive)"
            - "CompetitorProductLink.${lb_id}.confidence_bp == 8485 and match_grade == CLOSE"
            - "Second call: HTTP 422 with error_id == ERR_CONFIDENCE_BELOW_CONFIRM_THRESHOLD"
            - "CompetitorProductLink.${lb_id}.status is still PROPOSED with review_round == 0"
            - "Competitor.${c1_id}.confirmed_match_count == 1 — only link A counted"

      - name: zero_matched_products_makes_index_insufficient_and_blocks_publish
        grounds:
          - calculations.price_index
          - validations.priority_70_ERR_INSUFFICIENT_INDEX_DATA
          - endpoints.POST_/pricing/index-reports/{id}/publish
        distinguishing_aspect: |
          A different metric (matched_product_count at its zero boundary) on a different
          endpoint (POST /pricing/index-reports/{id}/publish). At zero matches index_bp is
          null, data_sufficiency INSUFFICIENT and publish is refused; adding exactly one
          qualifying product flips the same market to a publishable report.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Market US-WEST with strategic_index_target_bp 9800 and index_tolerance_bp 150."
