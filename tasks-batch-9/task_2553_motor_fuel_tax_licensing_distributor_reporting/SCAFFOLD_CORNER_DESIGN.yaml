  - section: calculations
    instances:
      - name: dyed_penalty_floor_dominates_a_small_tank
        claim_type: correct_result
        grounds:
          - calculations.dyed_fuel_penalty
          - entities.RoadsideInspection.fields.penalty_cents
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: "With 40.00 gallons in the tank the per-gallon computation is 40000 cents, below DYED_BASE_PENALTY_CENTS, so the max() floor of 100000 wins on a first offence (multiplier 1.0) and the PENALTY ledger row is 100000, not 40000."
        test_recipe:
          setup:
            - "One RETAILER licensee with retail_channel HIGHWAY and no prior inspections; clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Floor Test Retail Stops LLC", fein: "41-4400001", license_type: "RETAILER", mailing_state: "MN", retail_channel: "HIGHWAY" }
              as: LicensingOfficer
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /mft/roadside-inspections"
              payload: { inspected_licensee_id: "${ret_id}", inspection_date: "2026-07-20", dye_test_result: "POSITIVE", gallons_in_tank: 40.00, vehicle_identifier: "MN-TRK-9001", location_description: "I-94 eastbound scale" }
              as: FieldInspector
              captures: { insp_id: $.data.id }
          assert:
            - "HTTP 201; data.prior_positive_count == 0, data.penalty_cents == 100000 and data.status == PENALTY_ASSESSED"
            - "GET /mft/licensees/${ret_id} reports dyed_violation_count == 1, balance_cents == 100000 and status == PENDING_BOND (one violation is below DYED_SUSPENSION_THRESHOLD)"
            - "GET /mft/licensees/${ret_id}/ledger-entries with payload { entry_type: PENALTY } returns total_count == 1 with amount_cents == 100000 and source_entity_type == RoadsideInspection"

      - name: bond_basis_excludes_a_draft_return
        claim_type: input_set_filtering
        grounds:
          - calculations.licensee_bond_requirement.input_set
          - endpoints[GET /mft/licensees/{id}/bond-status]
          - entities.Licensee.fields.avg_monthly_tax_liability_cents
        distinguishing_aspect: "Only FILED returns enter the bond basis: one FILED 500000-cent period sets avg_monthly_tax_liability_cents to 500000 and required_bond_cents to 1500000, and a DRAFT sibling return carrying 100000.00 gallons does not move either number - basis_return_count stays 1."
        test_recipe:
          setup:
            - "One SUPPLIER counterparty and one ACTIVE DISTRIBUTOR holding a 1500000-cent bond; clock at 2026-09-05T00:00:00Z."
            - "The distributor's FILED 2026-08 return carries SCH_2 GASOLINE 17482.52 gallons, so tax_due_cents is exactly 500000 and it was filed before the 2026-09-20 due instant."
            - "The distributor also holds a DRAFT 2026-07 return with SCH_2 GASOLINE 100000.00 gallons that has never been filed."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Basis Fuel Supply LLC", fein: "41-4500001", license_type: "SUPPLIER", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /mft/licensees"
              payload: { legal_name: "Basis Distribution Inc", fein: "41-4500002", license_type: "DISTRIBUTOR", mailing_state: "MN" }
              as: LicensingOfficer
              captures: { dist_id: $.data.id, dist_v0: $.data.version }
            - call: "POST /mft/licensees/${dist_id}/bonds"
              payload: { amount_cents: 1500000, surety_name: "Granite Surety Co", effective_date: "2026-07-01", expected_licensee_version: "${dist_v0}" }
              as: LicensingOfficer
            - call: "POST /mft/licensees/${dist_id}/activate"
              payload: {}
              as: LicensingOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-08" }
              as: ReturnsExaminer
              captures: { filed_ret: $.data.id }
            - call: "POST /mft/returns/${filed_ret}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "GASOLINE", total_gallons: 17482.52 }
              as: ReturnsExaminer
              captures: { filed_sch: $.data.id }
            - call: "POST /mft/schedules/${filed_sch}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 17482.52, document_date: "2026-08-05", bill_of_lading_number: "BOL-BASIS-0001" }
              as: ReturnsExaminer
            - call: "POST /mft/returns/${filed_ret}/file"
              payload: { attest_name: "B. Basis" }
              as: ReturnsExaminer
            - call: "POST /mft/returns"
              payload: { licensee_id: "${dist_id}", period_month: "2026-07" }
              as: ReturnsExaminer
              captures: { draft_ret: $.data.id }
            - call: "POST /mft/returns/${draft_ret}/schedules"
              payload: { schedule_code: "SCH_2_RECEIVED_TAX_UNPAID", product_code: "GASOLINE", total_gallons: 100000.00 }
              as: ReturnsExaminer
              captures: { draft_sch: $.data.id }
            - call: "POST /mft/schedules/${draft_sch}/lines"
              payload: { counterparty_licensee_id: "${sup_id}", transaction_type: "PURCHASE", gallons: 100000.00, document_date: "2026-07-05", bill_of_lading_number: "BOL-BASIS-0002" }
              as: ReturnsExaminer
          trigger:
            - call: "GET /mft/licensees/${dist_id}/bond-status"
              payload: {}
              as: LicensingOfficer
          assert:
            - "HTTP 200; data.basis_return_count == 1 (the DRAFT return is invisible to the basis)"
            - "data.avg_monthly_tax_liability_cents == 500000 and data.required_bond_cents == 1500000"
            - "data.posted_bond_cents == 1500000 and data.bond_deficiency_cents == 0"
            - "GET /mft/returns/${draft_ret} still reports filing_status == DRAFT with tax_due_cents null-or-uncomputed and match_status == NOT_MATCHED"
            - "GET /mft/licensees/${dist_id} reports the same avg_monthly_tax_liability_cents == 500000 and balance_cents == 500000"

      - name: type_multiplier_constants_set_retailer_and_supplier_requirements
        claim_type: constants_applied
        grounds:
          - calculations.licensee_bond_requirement.constants
          - entities.Licensee.fields.required_bond_cents
        distinguishing_aspect: "The same 500000-cent assumed liability and 3-month window produce 400000 for a RETAILER (multiplier 0.25 -> 375000 then ceil to the 100000-cent step) and 1500000 for a SUPPLIER (multiplier 1.0) - the ceil happens before the MIN/MAX clamp, so 375000 does not stay 375000."
        test_recipe:
          setup:
            - "Empty database; no returns exist, so both licensees take the assumed-liability path."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LicensingOfficer
          trigger:
            - call: "POST /mft/licensees"
