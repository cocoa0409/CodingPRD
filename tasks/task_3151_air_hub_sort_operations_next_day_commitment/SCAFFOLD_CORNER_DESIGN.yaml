              captures: { err: $.data.error_id }
            - call: "POST /airhub/failures"
              payload: { hub_id: "${hub_id}", package_id: "${pkg_ds2}", cause_code: "BAD_ADDRESS", failure_minutes: 1500 }
              as: RefundAdjuster
              captures: { fail_customer: $.data.id, role_customer: $.data.attributed_role }
            - call: "POST /airhub/failures/${fail_customer}/dispute"
              payload: {}
              as: RefundAdjuster
              captures: { customer_status: $.data.status }
          assert:
            - "the carrier failure is ${role_carrier} == CARRIER and the dispute returns 409 with ${err} == ERR_CARRIER_ATTRIBUTED_NOT_DISPUTABLE"
            - "ServiceFailure.${fail_carrier}.status is still OPEN"
            - "the customer failure is ${role_customer} == CUSTOMER and the dispute succeeds with ${customer_status} == DISPUTED"
            - "the two failures differ only in cause_code, so the gate is attribution and not status"

      - name: package_void_while_a_finalized_failure_exists_returns_finalized_failure_present
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Package.transitions.DOWNGRADED_to_VOIDED
          - errors.ERR_FINALIZED_FAILURE_PRESENT
        distinguishing_aspect: "A downgraded package may be voided only while its failure is provisional, so finalizing the failure first flips the same void into ERR_FINALIZED_FAILURE_PRESENT — the guard is on the failure's status, not the package's."
        test_recipe:
          setup:
            - "Clock 1540. SDF hub, BANK_A with N701UP landed and unloaded, shift N-A, one NEXT_DAY_AIR package time-downgraded so it carries an OPEN carrier failure."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_lane_s1
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-FP-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_fp: $.data.id, pkg_fp_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T01:40:00Z" }
              as: HubOpsManager
            - call: "POST /airhub/packages/${pkg_fp}/downgrade-commitment"
              payload: { expected_package_version: "${pkg_fp_v}" }
              as: CommitmentController
              captures: { dg_status: $.data.commitment_status }
            - call: "GET /airhub/packages/${pkg_fp}/failures"
              payload: {}
              as: RefundAdjuster
              captures: { fail_fp: "$.data[0].id" }
          trigger:
            - call: "POST /airhub/failures/${fail_fp}/finalize"
              payload: {}
              as: RefundAdjuster
              captures: { fin_status: $.data.status }
            - call: "POST /airhub/packages/${pkg_fp}/void"
              payload: {}
              as: CommitmentController
              captures: { err: $.data.error_id }
          assert:
            - "the package is ${dg_status} == DOWNGRADED and the failure finalized to ${fin_status} == FINALIZED"
            - "the void returns 409 with ${err} == ERR_FINALIZED_FAILURE_PRESENT"
            - "Package.${pkg_fp}.commitment_status is still DOWNGRADED and sort_status is UNSORTED"
            - "the same void would have succeeded while the failure was still OPEN"

      - name: clock_backwards_move_returns_clock_out_of_order
        claim_type: precondition_enforcement
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - errors.ERR_CLOCK_OUT_OF_ORDER
        distinguishing_aspect: "The logical clock is monotone: a set_current_utc strictly behind the current value is refused with ERR_CLOCK_OUT_OF_ORDER, so no deadline can be un-crossed by rewinding time."
        test_recipe:
          setup:
            - "Clock 1500. Empty database."
          setup_api_calls:
            - *c_clock
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T01:00:00Z" }
              as: HubOpsManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: HubOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and ${err} == ERR_CLOCK_OUT_OF_ORDER"
            - "the clock remains at minute 1500, so a subsequent package created in the same test still reads commitment_cutoff_minutes 1560"
            - "a forward move to 1600 on the same clock succeeds, so only strictly-backward moves are refused"

      - name: feeder_staging_outside_the_owning_hub_sort_window_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.GroundFeeder.transitions.SCHEDULED_to_STAGING
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Feeder staging is gated on the owning hub's sort window, so a feeder whose turnout window falls entirely after sort_window_close is refused even though its own timing constraint holds."
        test_recipe:
          setup:
            - "Clock 1600. SDF hub with window 1380-1560, shift N-B (1380-1630), feeder F-late departing 1610 with window 20 (turnout 1590-1610), and feeder F-ok departing 1560 with window 20 (turnout 1540-1560)."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_lane_s1
            - *c_bank
            - *c_ac1
            - call: "POST /airhub/shifts"
              payload: { hub_id: "${hub_id}", shift_code: "N-B", start_minutes: 1380, end_minutes: 1630, headcount: 64, productivity_grams_per_operator_hour: 4200, forecast_volume_grams: 380000, certified_for_hazmat: true }
              as: SortSupervisor
              captures: { shift_id: $.data.id }
            - call: "POST /airhub/feeders"
              payload: { hub_id: "${hub_id}", feeder_code: "F-late", origin_station_code: "LEX", scheduled_departure_minutes: 1610, stage_capacity_grams: 100000, window_minutes: 20 }
              as: FeederCoordinator
              captures: { f_late_id: $.data.id }
            - call: "POST /airhub/feeders"
              payload: { hub_id: "${hub_id}", feeder_code: "F-ok", origin_station_code: "BNA", scheduled_departure_minutes: 1560, stage_capacity_grams: 100000, window_minutes: 20 }
              as: FeederCoordinator
              captures: { f_ok_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T02:40:00Z" }
              as: HubOpsManager
          trigger:
            - call: "POST /airhub/feeders/${f_late_id}/begin-staging"
              payload: {}
              as: FeederCoordinator
              captures: { err_window: $.data.error_id }
            - call: "POST /airhub/feeders/${f_ok_id}/begin-staging"
              payload: {}
              as: FeederCoordinator
              captures: { ok_status: $.data.status }
          assert:
            - "the late feeder returns 409 with ${err_window} == ERR_INVALID_STATE"
            - "its own timing clause holds (1600 >= 1610 - 20) so only the hub sort-window clause fails"
            - "GroundFeeder.${f_late_id}.status == SCHEDULED"
            - "the feeder whose turnout still overlaps the window reports ${ok_status} == STAGING"

      - name: lane_close_and_reopen_round_trip_refuses_a_second_close
        claim_type: valid_transition
        grounds:
          - state_machines.SortLane.transitions.AVAILABLE_to_CLOSED
          - state_machines.SortLane.transitions.CLOSED_to_AVAILABLE
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The lane's operator axis round-trips AVAILABLE -> CLOSED -> AVAILABLE, and each side refuses a repeat, so the pair is idempotent-free in both directions."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, lanes P-01 and S-01, BANK_A with N701UP landed and unloaded, shift N-A."
          setup_api_calls:
