            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V12", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
