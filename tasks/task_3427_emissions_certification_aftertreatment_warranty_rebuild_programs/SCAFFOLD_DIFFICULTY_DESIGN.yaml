      - name: bay_capacity_day_bucket_aggregate
        grounds:
          - calculations.shop_bay_capacity_check
          - entities.ServiceCenter.fields.bay_capacity_per_day
          - errors.ERR_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Interval semantics: aggregate day-bucket capacity — multiple work
          orders may share a day up to bay_capacity_per_day, and a new order is
          rejected only when its whole span contains a day that would exceed
          the cap. Two 2-day orders overlap legally on one day at capacity 2;
          a third 1-day order on exactly that shared day is rejected. Different
          resource (service center bays) and different semantics (aggregate
          count vs strict pairwise non-overlap) from the lab-window instance.
        test_recipe:
          setup:
            - "Logical clock 2026-12-15T00:00:00Z; family IN_PRODUCTION, NON_CONFORMING; RECALL CMP-5 IN_PROGRESS over units UN-911/UN-912/UN-913; center capacity 2."
