# =============================================================================
# Medicare Star Ratings Program Management — benchmark seed tables
# =============================================================================

scenario: |
  Medicare Star Ratings Program Management (Medicare Advantage stars team): measure inventory & weighting by domain, performance tracking against cut points, member-level gap targeting & provider incentive alignment, CAHPS/HOS survey preparation, pharmacy measures (adherence) intervention, appeals/complaint measures monitoring, improvement measure calculation, rating forecast & rebate impact modeling

domain_name: medicare-star-ratings
api_prefix: /api

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # CMS-regulated cycles, segregation of duties on payouts, locked measurement data
  secondary_archetype: pricing_engine        # cut-point banding, weighted scoring, tiered rebate rates, rounding traps
  complexity_layers:
    - optimistic_concurrency                 # OCC on RatingCycle.version (cutpoint publish) and CutPointSet.version (row replace)
    - cascading_side_effects                 # disenroll -> gap exclusion -> performance recompute -> cycle live stars refresh
    - dual_variant_calculation               # published-star vs draft-star banding; ATTAINMENT vs GAP_CLOSURE payout amounts
    - rate_threshold_triggers                # star banding, improvement banding, rebate tiers, survey sufficiency, intervention cap
  entity_topology: flat                      # peer collections under /api with FK references in bodies
  state_machine_shape: cyclic                # RatingCycle reverts CUTPOINT_REVIEW->DATA_COLLECTION; CareGap OPEN->CLOSED->REOPENED->CLOSED; plus branching ComplaintCase
  relationship_patterns:
    - one_to_many                            # RatingCycle -> Measure/CutPointSet/MeasurePerformance/SurveyWave/ComplaintCase/RatingForecast
    - cross_aggregate                        # CareGap -> Member & Measure; IncentivePayout -> ProviderGroup
    - many_to_many                           # CareGap is a junction of Member x Measure with lifecycle
  role_model: segregation_of_duties          # payout proposer cannot approve own payout; reporting and validation split across roles
  consistency_model: immediate               # all mutations + cascades atomic in one request

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: RatingCycle
    parent: null
    common_fields: true
    fields:
      - { name: measurement_year, type: integer, source: input, description: "Measurement year (e.g., 2026); data collected for this year" }
      - { name: rating_year, type: integer, source: input, description: "Star rating publication year (e.g., 2028); must be > measurement_year" }
      - { name: benchmark_pmpm, type: number, source: input, description: "Benchmark payment per member per month in dollars; > 0; rebate base" }
      - { name: status, type: enum, source: system, default: SETUP, description: "SETUP | DATA_COLLECTION | CUTPOINT_REVIEW | OFFICIAL_PUBLISHED | CLOSED" }
      - { name: published_cutpoint_set_id, type: string, source: system, description: "Back-pointer: id of the most recently PUBLISHED CutPointSet of this cycle; null until first publish" }
      - { name: live_weighted_stars, type: number, source: computed, description: "Live weighted overall stars over ACTIVE measures' VALIDATED-or-LOCKED performances on the best-available basis (published_star if a PUBLISHED set exists, else draft_star), incl. improvement pseudo-measure when computable; recomputed on every performance star recompute; null when no banded performances" }
      - { name: official_overall_stars, type: number, source: computed, description: "Official overall stars computed at publish-official-rating from LOCKED performances on published basis; null until OFFICIAL_PUBLISHED" }
      - { name: official_rebate_amount, type: number, source: computed, description: "Official rebate dollars computed at publish-official-rating; null until OFFICIAL_PUBLISHED" }
      - { name: official_improvement_star, type: integer, source: computed, description: "Improvement pseudo-measure star (1-5) computed at publish-official-rating; null when no eligible measures" }

  - name: Measure
    parent: null
    common_fields: true
    fields:
      - { name: rating_cycle_id, type: string, source: input, description: "FK -> RatingCycle.id; owning cycle" }
      - { name: code, type: string, source: input, description: "Measure code, unique within its cycle (e.g., BCS, SPD)" }
      - { name: title, type: string, source: input, description: "Measure title" }
      - { name: domain, type: enum, source: input, description: "STAYING_HEALTHY | CHRONIC_CARE | MEMBER_EXPERIENCE | MEMBER_COMPLAINTS | CUSTOMER_SERVICE | DRUG_SAFETY" }
      - { name: measure_type, type: enum, source: input, description: "PROCESS | OUTCOME | PATIENT_EXPERIENCE; drives weight" }
      - { name: weight, type: integer, source: computed, description: "PROCESS -> 1; OUTCOME -> 3; PATIENT_EXPERIENCE -> 4" }
      - { name: direction, type: enum, source: input, description: "HIGHER_BETTER | LOWER_BETTER; banding and cutpoint monotonicity depend on it" }
      - { name: data_source, type: enum, source: input, description: "HEDIS | CAHPS | HOS | PHARMACY_PDE | COMPLAINTS | APPEALS" }
      - { name: improvement_eligible, type: boolean, source: input, description: "Whether the measure participates in the improvement pseudo-measure" }
      - { name: prior_cycle_star, type: integer, source: input, description: "Star earned in prior cycle (1-5); null allowed; required for improvement eligibility to count" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | RETIRED" }

  - name: CutPointSet
    parent: null
    common_fields: true
    fields:
      - { name: rating_cycle_id, type: string, source: input, description: "FK -> RatingCycle.id; owning cycle" }
      - { name: label, type: string, source: input, description: "Human label, e.g. proposed-2028-draft" }
      - { name: rows, type: array, source: input, default: [], description: "Cut point rows: objects {measure_id, band_2_floor, band_3_floor, band_4_floor, band_5_floor}; each floor a number; one row per measure" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | SUPERSEDED" }

  - name: MeasurePerformance
    parent: null
    common_fields: true
    fields:
      - { name: rating_cycle_id, type: string, source: input, description: "FK -> RatingCycle.id; owning cycle" }
      - { name: measure_id, type: string, source: input, description: "FK -> Measure.id; measured measure; unique per cycle" }
      - { name: numerator, type: integer, source: input, description: "Compliant member count; >= 0 and <= denominator" }
      - { name: denominator, type: integer, source: input, description: "Eligible member count; >= 0" }
      - { name: exclusion_count, type: integer, source: input, default: 0, description: "Members excluded from denominator for clinical reasons; informational" }
      - { name: raw_value, type: number, source: computed, description: "round_half_up(numerator / denominator, 2); null when denominator == 0" }
      - { name: published_star, type: integer, source: computed, description: "Star 1-5 banded from raw_value against the cycle's PUBLISHED cut point set; null when no published set or raw_value null" }
      - { name: draft_star, type: integer, source: computed, description: "Star 1-5 banded from raw_value against the most recently created DRAFT cut point set; null when no draft set or raw_value null" }
      - { name: timeliness_alert, type: boolean, source: computed, default: false, description: "True once any linked complaint resolves late (> 30 days); sticky" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of the reporter (segregation-of-duties anchor)" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED | VALIDATED | LOCKED" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: member_ref, type: string, source: input, description: "External member reference, unique across the system" }
      - { name: plan_contract, type: string, source: input, description: "MA contract identifier" }
      - { name: enrolled_months, type: integer, source: input, description: "Months enrolled in the measurement year, 1..12; feeds member-months" }
      - { name: status, type: enum, source: system, default: ENROLLED, description: "ENROLLED | DISENROLLED" }

  - name: CareGap
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; gap owner" }
      - { name: measure_id, type: string, source: input, description: "FK -> Measure.id; measure this gap feeds" }
      - { name: gap_type, type: enum, source: input, description: "PHARMACY_ADHERENCE | SCREENING | FOLLOW_UP | IMMUNIZATION" }
      - { name: intervention_count, type: integer, source: system, default: 0, description: "Completed-or-ordered outreach interventions; max 3" }
      - { name: last_intervention_channel, type: enum, source: system, description: "CALL | MAIL | SMS | PHARMACIST_CONSULT; null until first intervention" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED | REOPENED | EXCLUDED" }

  - name: ProviderGroup
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Provider group name, unique" }
      - { name: program_type, type: enum, source: input, description: "ATTAINMENT | GAP_CLOSURE; selects the payout amount variant" }
      - { name: linked_measure_id, type: string, source: input, description: "FK -> Measure.id; measure the incentive is aligned to" }
      - { name: target_star, type: integer, source: input, description: "1-5; ATTAINMENT variant target" }
      - { name: unit_reward_per_gap, type: number, source: input, description: "Dollars per closed gap; GAP_CLOSURE variant rate; > 0" }
      - { name: max_pool_amount, type: number, source: input, description: "Total incentive pool dollars; >= 0" }
      - { name: paid_total, type: number, source: computed, default: 0, description: "Dollars in PAID payouts" }
      - { name: reserved_total, type: number, source: computed, default: 0, description: "Dollars in PENDING or APPROVED payouts" }
      - { name: remaining_amount, type: number, source: computed, description: "= max_pool_amount - paid_total - reserved_total; invariant max_pool == paid + reserved + remaining" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CLOSED" }

  - name: IncentivePayout
    parent: null
    common_fields: true
    fields:
      - { name: provider_group_id, type: string, source: input, description: "FK -> ProviderGroup.id; paying group" }
      - { name: amount, type: number, source: computed, description: "Computed at propose by the group's program_type variant; 2dp half-up" }
      - { name: basis_snapshot, type: object, source: computed, description: "Inputs used: {program_type, published_star, target_star, closed_gap_count, unit_reward_per_gap, max_pool_amount}" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of proposer; approver must differ" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | PAID | DENIED" }

  - name: SurveyVendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor name, unique" }
      - { name: max_concurrent_waves, type: integer, source: input, description: "Capacity: max overlapping survey waves assigned to this vendor; >= 1" }

  - name: SurveyWave
    parent: null
    common_fields: true
    fields:
      - { name: rating_cycle_id, type: string, source: input, description: "FK -> RatingCycle.id; owning cycle" }
      - { name: survey_type, type: enum, source: input, description: "CAHPS | HOS" }
      - { name: vendor_id, type: string, source: input, description: "FK -> SurveyVendor.id; fielding vendor" }
      - { name: window_start, type: datetime, source: input, description: "Fielding window start (inclusive), ISO 8601 UTC" }
      - { name: window_end, type: datetime, source: input, description: "Fielding window end (exclusive), ISO 8601 UTC; half-open [start, end)" }
      - { name: sample_size, type: integer, source: input, description: "Surveyed sample size; > 0" }
      - { name: response_count, type: integer, source: input, description: "Completed responses; set at SCORED transition; 0..sample_size" }
      - { name: response_rate, type: number, source: computed, description: "round_half_up(response_count / sample_size, 4); null until SCORED" }
      - { name: sufficient, type: boolean, source: computed, description: "response_rate >= 0.40; null until SCORED" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | FIELDING | CLOSED_FIELD | SCORED" }

  - name: ComplaintCase
    parent: null
    common_fields: true
    fields:
      - { name: rating_cycle_id, type: string, source: input, description: "FK -> RatingCycle.id; owning cycle" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; complainant" }
      - { name: category, type: enum, source: input, description: "APPEALS_TIMELINESS | COVERAGE_DETERMINATION | BILLING | ENROLLMENT | SERVICE_QUALITY" }
      - { name: filed_at, type: datetime, source: input, description: "Filing timestamp, ISO 8601 UTC" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock timestamp at resolution; null until resolved" }
      - { name: late_resolution, type: boolean, source: computed, description: "resolved_at - filed_at > 30 days (strictly greater); null until resolved" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | RESOLVED_VALID | RESOLVED_INVALID" }

  - name: RatingForecast
    parent: null
    common_fields: true
    fields:
      - { name: rating_cycle_id, type: string, source: input, description: "FK -> RatingCycle.id; forecasted cycle" }
      - { name: basis, type: enum, source: input, description: "PUBLISHED_CUTPOINTS | DRAFT_CUTPOINTS; which cut point set bands the stars" }
      - { name: measures_included, type: integer, source: computed, description: "Count of ACTIVE measures with a banded star on the basis whose performance is VALIDATED or LOCKED" }
      - { name: measures_improved, type: integer, source: computed, description: "Eligible measures whose basis star > prior_cycle_star" }
      - { name: measures_declined, type: integer, source: computed, description: "Eligible measures whose basis star < prior_cycle_star" }
      - { name: measures_eligible, type: integer, source: computed, description: "ACTIVE, improvement_eligible, prior_cycle_star non-null, basis star non-null, performance VALIDATED or LOCKED" }
      - { name: improvement_score, type: number, source: computed, description: "round_half_up((improved - declined) / eligible, 4); null when eligible == 0" }
      - { name: improvement_star, type: integer, source: computed, description: "Banded improvement star 1-5; null when eligible == 0 (excluded from weighted average)" }
      - { name: projected_overall_stars, type: number, source: computed, description: "Half-star rounded weighted mean over included measures plus improvement pseudo-measure (weight 5) when non-null; null when measures_included == 0 and improvement_star null" }
      - { name: member_months_used, type: integer, source: computed, description: "Sum of enrolled_months over Members with status == ENROLLED at forecast time" }
      - { name: rebate_tier_rate, type: number, source: computed, description: "Tier rate keyed on projected_overall_stars; 0.0 when stars < 3.5 or null" }
      - { name: projected_rebate_amount, type: number, source: computed, description: "round_half_up(member_months_used * benchmark_pmpm * rebate_tier_rate, 2)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: RatingCycle
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: DATA_COLLECTION
        trigger: "POST /api/rating-cycles/{cycleId}/transition {to_state: DATA_COLLECTION}"
        actor: StarsAdmin
        preconditions:
          - "cycle.status == SETUP (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments RatingCycle.version by 1"

      - from: DATA_COLLECTION
        to: CUTPOINT_REVIEW
        trigger: "POST /api/rating-cycles/{cycleId}/transition {to_state: CUTPOINT_REVIEW}"
        actor: StarsAdmin
        preconditions:
          - "cycle.status == DATA_COLLECTION (ERR_INVALID_STATE_TRANSITION)"
          - "every MeasurePerformance with rating_cycle_id == cycle.id is LOCKED (ERR_PERFORMANCES_NOT_LOCKED); vacuously true when none exist"
        side_effects:
          - "increments RatingCycle.version by 1"

      - from: CUTPOINT_REVIEW
        to: DATA_COLLECTION
        trigger: "POST /api/rating-cycles/{cycleId}/transition {to_state: DATA_COLLECTION} (reopen)"
        actor: StarsAdmin
        preconditions:
          - "cycle.status == CUTPOINT_REVIEW (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "every LOCKED MeasurePerformance of the cycle reverts to VALIDATED"
          - "increments RatingCycle.version by 1"
        note: "Revert leg of the cycle: data collection may be reopened after review begins; published cut point sets are NOT unpublished."

      - from: CUTPOINT_REVIEW
        to: OFFICIAL_PUBLISHED
        trigger: "POST /api/rating-cycles/{cycleId}/transition {to_state: OFFICIAL_PUBLISHED}"
        actor: StarsAdmin
        preconditions:
          - "cycle.status == CUTPOINT_REVIEW (ERR_INVALID_STATE_TRANSITION)"
          - "at least one CutPointSet of the cycle has status PUBLISHED (ERR_NO_PUBLISHED_CUTPOINT_SET)"
          - "at least one LOCKED MeasurePerformance of the cycle has non-null published_star (ERR_NO_BANDED_PERFORMANCES)"
        side_effects:
          - "official_overall_stars := weighted_overall_stars over LOCKED performances, published basis, including improvement pseudo-measure when computable"
          - "official_improvement_star := improvement star on published basis (null when eligible == 0)"
          - "official_rebate_amount := rebate_projection(official_overall_stars)"
          - "increments RatingCycle.version by 1"

      - from: OFFICIAL_PUBLISHED
        to: CLOSED
        trigger: "POST /api/rating-cycles/{cycleId}/transition {to_state: CLOSED}"
        actor: StarsAdmin
        preconditions:
          - "cycle.status == OFFICIAL_PUBLISHED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments RatingCycle.version by 1"

  - entity: Measure
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/measures/{measureId}/transition {to_state: ACTIVE}"
        actor: StarsAnalyst
        preconditions:
          - "measure.status == DRAFT (ERR_INVALID_STATE_TRANSITION)"
          - "owning cycle status IN {SETUP, DATA_COLLECTION} (ERR_CYCLE_STATE_FORBIDS)"
        side_effects:
          - "increments Measure.version by 1"

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/measures/{measureId}/transition {to_state: RETIRED}"
        actor: StarsAnalyst
        preconditions:
          - "measure.status == ACTIVE (ERR_INVALID_STATE_TRANSITION)"
          - "owning cycle status NOT IN {OFFICIAL_PUBLISHED, CLOSED} (ERR_CYCLE_STATE_FORBIDS)"
        side_effects:
          - "measure excluded from all future weighted/improvement input sets"
          - "increments Measure.version by 1"

  - entity: CutPointSet
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/cutpoint-sets/{setId}/publish"
        actor: StarsAdmin
        preconditions:
          - "set.status == DRAFT (ERR_CUTPOINT_SET_IMMUTABLE)"
          - "owning cycle status == CUTPOINT_REVIEW (ERR_CYCLE_STATE_FORBIDS)"
          - "OCC: expected_rating_cycle_version == cycle.version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "link 1: any previously PUBLISHED set of the same cycle -> SUPERSEDED; cycle.published_cutpoint_set_id := this set"
          - "link 1: every MeasurePerformance of the cycle recomputes published_star against this set"
          - "link 2: each published_star recompute refreshes cycle.live_weighted_stars"
          - "increments RatingCycle.version by 1 (single logical mutation for this request)"
          - "increments CutPointSet.version by 1"

      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (automatic when another set of the same cycle is published)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MeasurePerformance
    initial_state: REPORTED
    terminal_states: []
    transitions:
      - from: REPORTED
        to: VALIDATED
        trigger: "POST /api/measure-performances/{perfId}/transition {to_state: VALIDATED}"
        actor: StarsAnalyst
        preconditions:
          - "performance.status == REPORTED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments MeasurePerformance.version by 1"

      - from: VALIDATED
        to: LOCKED
        trigger: "POST /api/measure-performances/{perfId}/transition {to_state: LOCKED}"
        actor: StarsAnalyst
        preconditions:
          - "performance.status == VALIDATED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments MeasurePerformance.version by 1"
          - "cycle.live_weighted_stars refresh (LOCKED performances enter every input set)"

      - from: LOCKED
        to: VALIDATED
        trigger: "system (automatic when owning cycle reopens CUTPOINT_REVIEW -> DATA_COLLECTION)"
        actor: system
        preconditions: []
        side_effects:
          - "increments MeasurePerformance.version by 1"

  - entity: Member
    initial_state: ENROLLED
    terminal_states: [DISENROLLED]
    transitions:
      - from: ENROLLED
        to: DISENROLLED
        trigger: "POST /api/members/{memberId}/transition {to_state: DISENROLLED}"
        actor: QualityOps
        preconditions:
          - "member.status == ENROLLED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "link 1: every CareGap of this member with status IN {OPEN, REOPENED} -> EXCLUDED"
          - "link 2: each such exclusion decrements the linked MeasurePerformance.denominator by 1 (when that performance is not LOCKED) and recomputes raw_value + published_star + draft_star"
          - "link 3: each star recompute refreshes the owning cycle's live_weighted_stars"
          - "member-months pool shrinks: future forecasts exclude this member's enrolled_months"
          - "increments Member.version by 1"

  - entity: CareGap
    initial_state: OPEN
    terminal_states: [EXCLUDED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/care-gaps/{gapId}/transition {to_state: CLOSED}"
        actor: QualityOps
        preconditions:
          - "gap.status IN {OPEN, REOPENED} (ERR_GAP_NOT_OPEN)"
          - "member.status == ENROLLED (ERR_MEMBER_NOT_ENROLLED)"
          - "owning cycle (via measure.rating_cycle_id) status == DATA_COLLECTION (ERR_CYCLE_NOT_COLLECTING)"
          - "linked MeasurePerformance exists and status != LOCKED (ERR_PERFORMANCE_LOCKED)"
        side_effects:
          - "linked MeasurePerformance.numerator += 1; raw_value, published_star, draft_star recompute"
          - "cycle.live_weighted_stars refresh"
          - "increments CareGap.version by 1"

      - from: REOPENED
        to: CLOSED
        trigger: "POST /api/care-gaps/{gapId}/transition {to_state: CLOSED}"
        actor: QualityOps
        preconditions:
          - "gap.status IN {OPEN, REOPENED} (ERR_GAP_NOT_OPEN)"
          - "member.status == ENROLLED (ERR_MEMBER_NOT_ENROLLED)"
          - "owning cycle status == DATA_COLLECTION (ERR_CYCLE_NOT_COLLECTING)"
          - "linked MeasurePerformance exists and status != LOCKED (ERR_PERFORMANCE_LOCKED)"
        side_effects:
          - "linked MeasurePerformance.numerator += 1; raw_value, published_star, draft_star recompute"
          - "cycle.live_weighted_stars refresh"
          - "increments CareGap.version by 1"

      - from: CLOSED
        to: REOPENED
        trigger: "POST /api/care-gaps/{gapId}/transition {to_state: REOPENED}"
        actor: QualityOps
        preconditions:
          - "gap.status == CLOSED (ERR_GAP_NOT_CLOSED)"
          - "owning cycle status == DATA_COLLECTION (ERR_CYCLE_NOT_COLLECTING)"
          - "linked MeasurePerformance status != LOCKED (ERR_PERFORMANCE_LOCKED)"
        side_effects:
          - "compensation: linked MeasurePerformance.numerator -= 1; raw_value, published_star, draft_star recompute"
          - "cycle.live_weighted_stars refresh"
          - "increments CareGap.version by 1"

      - from: OPEN
        to: EXCLUDED
        trigger: "POST /api/care-gaps/{gapId}/transition {to_state: EXCLUDED} or system (member disenrollment)"
        actor: QualityOps | system
        preconditions:
          - "gap.status IN {OPEN, REOPENED} (ERR_GAP_NOT_OPEN) — skipped for system-triggered disenrollment exclusions which only target OPEN/REOPENED gaps"
          - "for the manual transition: owning cycle status == DATA_COLLECTION (ERR_CYCLE_NOT_COLLECTING) and linked performance not LOCKED (ERR_PERFORMANCE_LOCKED)"
        side_effects:
          - "linked MeasurePerformance.denominator -= 1; raw_value, published_star, draft_star recompute"
          - "cycle.live_weighted_stars refresh"
          - "increments CareGap.version by 1"

      - from: REOPENED
        to: EXCLUDED
        trigger: "POST /api/care-gaps/{gapId}/transition {to_state: EXCLUDED} or system (member disenrollment)"
        actor: QualityOps | system
        preconditions:
          - "gap.status IN {OPEN, REOPENED} (ERR_GAP_NOT_OPEN)"
          - "for the manual transition: owning cycle status == DATA_COLLECTION (ERR_CYCLE_NOT_COLLECTING) and linked performance not LOCKED (ERR_PERFORMANCE_LOCKED)"
        side_effects:
          - "linked MeasurePerformance.denominator -= 1; raw_value, published_star, draft_star recompute"
          - "cycle.live_weighted_stars refresh"
          - "increments CareGap.version by 1"

  - entity: ProviderGroup
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/provider-groups/{groupId}/transition {to_state: CLOSED}"
        actor: IncentiveManager
        preconditions:
          - "group.status == ACTIVE (ERR_INVALID_STATE_TRANSITION)"
          - "no IncentivePayout of this group has status IN {PENDING, APPROVED} (ERR_GROUP_HAS_OPEN_PAYOUTS)"
        side_effects:
          - "increments ProviderGroup.version by 1"

  - entity: IncentivePayout
    initial_state: PENDING
    terminal_states: [PAID, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /api/incentive-payouts/{payoutId}/transition {to_state: APPROVED}"
        actor: IncentiveManager
        preconditions:
          - "payout.status == PENDING (ERR_PAYOUT_NOT_PENDING)"
          - "approver X-User-ID != payout.proposed_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "pool fields unchanged (amount was reserved at propose time)"
          - "increments IncentivePayout.version by 1"

      - from: APPROVED
        to: PAID
        trigger: "POST /api/incentive-payouts/{payoutId}/transition {to_state: PAID}"
        actor: IncentiveManager
        preconditions:
          - "payout.status == APPROVED (ERR_PAYOUT_NOT_APPROVED)"
        side_effects:
          - "group.paid_total += amount; group.reserved_total -= amount (remaining_amount unchanged)"
          - "increments IncentivePayout.version by 1 and ProviderGroup.version by 1"

      - from: PENDING
        to: DENIED
        trigger: "POST /api/incentive-payouts/{payoutId}/transition {to_state: DENIED}"
        actor: IncentiveManager
        preconditions:
          - "payout.status == PENDING (ERR_PAYOUT_NOT_PENDING)"
        side_effects:
          - "compensation: group.reserved_total -= amount; group.remaining_amount += amount"
          - "increments IncentivePayout.version by 1 and ProviderGroup.version by 1"

  - entity: SurveyWave
    initial_state: PLANNED
    terminal_states: [SCORED]
    transitions:
      - from: PLANNED
        to: FIELDING
        trigger: "POST /api/survey-waves/{waveId}/transition {to_state: FIELDING}"
        actor: SurveyCoordinator
        preconditions:
          - "wave.status == PLANNED (ERR_INVALID_STATE_TRANSITION)"
          - "logical clock now satisfies window_start <= now < window_end (ERR_WAVE_OUTSIDE_WINDOW)"
        side_effects:
          - "increments SurveyWave.version by 1"

      - from: FIELDING
        to: CLOSED_FIELD
        trigger: "POST /api/survey-waves/{waveId}/transition {to_state: CLOSED_FIELD}"
        actor: SurveyCoordinator
        preconditions:
          - "wave.status == FIELDING (ERR_INVALID_STATE_TRANSITION)"
          - "logical clock now >= window_end (ERR_WAVE_OUTSIDE_WINDOW)"
        side_effects:
          - "increments SurveyWave.version by 1"

      - from: CLOSED_FIELD
        to: SCORED
        trigger: "POST /api/survey-waves/{waveId}/transition {to_state: SCORED, response_count: N}"
        actor: SurveyCoordinator
        preconditions:
          - "wave.status == CLOSED_FIELD (ERR_INVALID_STATE_TRANSITION)"
          - "0 <= response_count <= sample_size (ERR_INVALID_REQUEST)"
        side_effects:
          - "response_rate and sufficient computed"
          - "increments SurveyWave.version by 1"

  - entity: ComplaintCase
    initial_state: FILED
    terminal_states: [RESOLVED_VALID, RESOLVED_INVALID]
    transitions:
      - from: FILED
        to: RESOLVED_VALID
        trigger: "POST /api/complaint-cases/{caseId}/transition {to_state: RESOLVED_VALID}"
        actor: ComplaintsAuditor
        preconditions:
          - "case.status == FILED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "branch A: the cycle's MeasurePerformance whose measure has data_source == COMPLAINTS and status != LOCKED gets numerator += 1; raw_value, published_star, draft_star recompute; if LOCKED, numerator unchanged"
          - "resolved_at := logical clock now; late_resolution := (resolved_at - filed_at > 30 days)"
          - "when late_resolution is true, that performance's timeliness_alert := true"
          - "increments ComplaintCase.version by 1"

      - from: FILED
        to: RESOLVED_INVALID
        trigger: "POST /api/complaint-cases/{caseId}/transition {to_state: RESOLVED_INVALID}"
        actor: ComplaintsAuditor
        preconditions:
          - "case.status == FILED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "branch B: no measure numerator change; resolved_at and late_resolution still recorded"
          - "increments ComplaintCase.version by 1"

# =============================================================================
# Table 2.1: Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: cutpoint-publish-stale-cycle
    parent_entity: RatingCycle
    write_endpoint: "POST /api/cutpoint-sets/{setId}/publish"
    occ_field: expected_rating_cycle_version
    description: |
      Publishing a cut point set against a RatingCycle whose version has
      advanced since the client last observed it is rejected. Publishing a
      second set legitimately supersedes the previously published set, so a
      client holding a pre-publish view of the cycle is stale and must
      re-read the cycle before publishing again.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: cutpoint-rows-replace-stale-set
    parent_entity: CutPointSet
    write_endpoint: "PUT /api/cutpoint-sets/{setId}"
    occ_field: expected_cutpoint_set_version
    description: |
      Replacing the rows of a DRAFT CutPointSet whose version has advanced
      since the client last observed it is rejected; the client must re-read
      the set and rebase its row edits.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: measure_star_banding
    trigger: "performance create/update; gap close/reopen/exclude; complaint resolution; cutpoint set publish"
    algorithm: threshold
    formula: |
      raw_value = round_half_up(numerator / denominator, 2)   -- ROUND FIRST (pinned order)
      if denominator == 0: raw_value = null, star = null
      Banding applies to the ROUNDED raw_value, never the unrounded ratio.
      HIGHER_BETTER: star = 1 + count(f in {band_2_floor, band_3_floor, band_4_floor, band_5_floor} where raw_value >= f)
      LOWER_BETTER:  star = 1 + count(f in {band_2_floor, band_3_floor, band_4_floor, band_5_floor} where raw_value <= f)
      Boundary: raw_value == floor counts toward the higher star (>= / <=, not > / <).
    input_set: "the MeasurePerformance being recomputed; cut point row for its measure from the basis set"
    constants:
      RAW_PRECISION_DP: 2
    precision: "raw_value 2 decimal places, round_half_up, applied BEFORE banding"
    variants:
      - name: published_star
        when: "basis = the cycle's CutPointSet with status PUBLISHED (cycle.published_cutpoint_set_id)"
        difference: "bands against the published set's floors; null when no set is PUBLISHED"
      - name: draft_star
        when: "basis = the most recently created CutPointSet of the cycle that is in DRAFT status at the moment the banding trigger runs"
        difference: "bands against that draft set's floors; null when no DRAFT set exists; cutpoint set creation alone does not re-band existing performances (rebanding happens on the next banding trigger)"

  - name: weighted_overall_stars
    trigger: "cycle.live_weighted_stars refresh; forecast creation; publish-official-rating"
    algorithm: weighted_scoring
    formula: |
      input measures = ACTIVE measures of the cycle whose basis star is non-null
      basis star selection: forecast uses the caller's basis (PUBLISHED_CUTPOINTS ->
      published_star, DRAFT_CUTPOINTS -> draft_star); live_weighted_stars and the
      official publish use published_star when the cycle has a PUBLISHED set,
      otherwise draft_star (best-available basis, deterministic)
      forecast basis filter: performance.status IN {VALIDATED, LOCKED}
      live/official filter: live uses {VALIDATED, LOCKED}; official publish uses {LOCKED}
      numerator_sum = sum(weight_i * star_i) + (5 * improvement_star if improvement_star non-null)
      denominator_sum = sum(weight_i) + (5 if improvement_star non-null)
      if denominator_sum == 0: result = null
      else: result = floor(2 * (numerator_sum / denominator_sum) + 0.5) / 2   -- half-star, round half up
    input_set: "per filter above; RETIRED measures and REPORTED performances never enter; improvement pseudo-measure uses the same basis star selection"
    constants:
      IMPROVEMENT_WEIGHT: 5
    precision: "half-star grid via floor(2x + 0.5)/2"

  - name: improvement_measure
    trigger: "forecast creation; publish-official-rating; live_weighted_stars refresh"
    algorithm: threshold
    formula: |
      eligible = ACTIVE measures with improvement_eligible == true, prior_cycle_star non-null,
                 basis star non-null, performance status in the caller's filter
      improved = count(star > prior_cycle_star); declined = count(star < prior_cycle_star)
      if eligible == 0: improvement_score = null, improvement_star = null (pseudo-measure EXCLUDED
                        from weighted_overall_stars — the weight-5 term is absent entirely)
      score = round_half_up((improved - declined) / eligible, 4)
      star = 5 if score >= 0.20
             4 if 0.08 <= score < 0.20
             3 if -0.08 < score < 0.08
             2 if -0.20 < score <= -0.08
             1 if score <= -0.20
    input_set: "eligible set exactly as above; empty eligible set yields null (zero-count edge)"
    constants:
      BAND_5_MIN: 0.20
      BAND_4_MIN: 0.08
      BAND_2_MAX: -0.08
      BAND_1_MAX: -0.20
    precision: "score 4 decimal places, round_half_up, then banded with the inclusive boundaries shown"

  - name: rebate_projection
    trigger: "forecast creation; publish-official-rating"
    algorithm: tiered_pricing
    formula: |
      member_months = sum(enrolled_months over Member where status == ENROLLED at call time)
      tier_rate = 0.0   if stars < 3.5 or stars is null
                  0.035 if 3.5 <= stars < 4.0
                  0.040 if 4.0 <= stars < 4.5
                  0.045 if 4.5 <= stars < 5.0
                  0.050 if stars == 5.0
      rebate = round_half_up(member_months * benchmark_pmpm * tier_rate, 2)
      Evaluation order pinned: stars -> tier lookup -> multiply -> single final rounding.
    input_set: "ENROLLED members only; DISENROLLED members contribute zero member-months"
    constants:
      TIER_35: 0.035
      TIER_40: 0.040
      TIER_45: 0.045
      TIER_50: 0.050
    precision: "2 decimal places, round_half_up"

  - name: incentive_payout_amount
    trigger: "POST /api/incentive-payouts (propose)"
    algorithm: weighted_scoring
    formula: |
      Variant selected by provider_group.program_type at propose time.
      ATTAINMENT:
        star = published_star of the performance for (group.linked_measure_id, its cycle)
        requires star non-null (ERR_PERFORMANCE_NOT_BANDED)
        attainment_pct = min(1.0, star / group.target_star)
        amount = round_half_up(group.max_pool_amount * attainment_pct, 2)
      GAP_CLOSURE:
        closed_gap_count = count(CareGap where measure_id == group.linked_measure_id and status == CLOSED)
        amount = min(group.max_pool_amount, round_half_up(group.unit_reward_per_gap * closed_gap_count, 2))
      Fiscal gate afterwards: amount > group.remaining_amount -> ERR_INCENTIVE_POOL_EXCEEDED.
    input_set: "ATTAINMENT: linked measure's performance published_star; GAP_CLOSURE: CLOSED gaps of linked measure at propose time"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: attainment_amount
        when: "group.program_type == ATTAINMENT"
        difference: "proportional to published_star / target_star of the linked measure"
      - name: gap_closure_amount
        when: "group.program_type == GAP_CLOSURE"
        difference: "unit rate times closed-gap count of the linked measure, capped at max_pool_amount"

  - name: survey_response_rate
    trigger: "SurveyWave transition to SCORED"
    algorithm: aggregation
    formula: |
      response_rate = round_half_up(response_count / sample_size, 4)
      sufficient = (response_rate >= 0.40)   -- exactly 0.40 is sufficient
    input_set: "the wave being scored"
    constants:
      MIN_RESPONSE_RATE: 0.40
    precision: "4 decimal places, round_half_up"

  - name: complaint_timeliness
    trigger: "ComplaintCase resolution (either branch)"
    algorithm: threshold
    formula: |
      late_resolution = (resolved_at - filed_at > 30 days)   -- strictly greater; exactly 30 days is NOT late
      when late_resolution and the cycle's COMPLAINTS-source performance exists:
        performance.timeliness_alert = true (sticky, never auto-cleared)
    input_set: "the resolving complaint; the cycle's measure with data_source == COMPLAINTS"
    constants:
      SLA_DAYS: 30
    precision: "day granularity on whole-day difference"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role must be one of the declared roles AND permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request shape: required fields present, types correct, enum members valid, integer ranges (numerator >= 0, denominator >= 0, numerator <= denominator, sample_size > 0, response_count in 0..sample_size, enrolled_months in 1..12, max_concurrent_waves >= 1, target_star in 1..5, unit_reward_per_gap > 0, max_pool_amount >= 0, benchmark_pmpm > 0, rating_year > measurement_year)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body FK ids exist"
    error_id: "ERR_CYCLE_NOT_FOUND | ERR_MEASURE_NOT_FOUND | ERR_CUTPOINT_SET_NOT_FOUND | ERR_PERFORMANCE_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_CARE_GAP_NOT_FOUND | ERR_PROVIDER_GROUP_NOT_FOUND | ERR_PAYOUT_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_WAVE_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_FORECAST_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with ids"

  - priority: 5
    category: state
    check: "OCC: expected_rating_cycle_version == cycle.version on publish; expected_cutpoint_set_version == set.version on row replace"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/cutpoint-sets/{setId}/publish, PUT /api/cutpoint-sets/{setId}"

  - priority: 6
    category: state
    check: "Transition from-state matches the state machine (generic)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: state
    check: "Cross-entity state gates: cycle in DATA_COLLECTION for gap mutations (ERR_CYCLE_NOT_COLLECTING); linked performance not LOCKED for gap close/reopen/exclude (ERR_PERFORMANCE_LOCKED); member ENROLLED for gap create/close (ERR_MEMBER_NOT_ENROLLED); group ACTIVE for payout propose (ERR_GROUP_NOT_ACTIVE); cycle CUTPOINT_REVIEW for cutpoint publish and SETUP/DATA_COLLECTION for measure activate, not OFFICIAL_PUBLISHED/CLOSED for measure retire (ERR_CYCLE_STATE_FORBIDS); cutpoint set DRAFT for row replace (ERR_CUTPOINT_SET_IMMUTABLE); payout PENDING for approve/deny (ERR_PAYOUT_NOT_PENDING), APPROVED for pay (ERR_PAYOUT_NOT_APPROVED); gap OPEN/REOPENED for close or intervene (ERR_GAP_NOT_OPEN), CLOSED for reopen (ERR_GAP_NOT_CLOSED); gap intervention cap 3 (ERR_INTERVENTION_LIMIT_REACHED); no PENDING/APPROVED payouts when closing group (ERR_GROUP_HAS_OPEN_PAYOUTS); wave window gates (ERR_WAVE_OUTSIDE_WINDOW); cycle transition preconditions (ERR_PERFORMANCES_NOT_LOCKED, ERR_NO_PUBLISHED_CUTPOINT_SET, ERR_NO_BANDED_PERFORMANCES); ATTAINMENT propose requires banded published_star (ERR_PERFORMANCE_NOT_BANDED)"
    error_id: "ERR_CYCLE_NOT_COLLECTING | ERR_PERFORMANCE_LOCKED | ERR_MEMBER_NOT_ENROLLED | ERR_GROUP_NOT_ACTIVE | ERR_CYCLE_STATE_FORBIDS | ERR_CUTPOINT_SET_IMMUTABLE | ERR_PAYOUT_NOT_PENDING | ERR_PAYOUT_NOT_APPROVED | ERR_GAP_NOT_OPEN | ERR_GAP_NOT_CLOSED | ERR_INTERVENTION_LIMIT_REACHED | ERR_GROUP_HAS_OPEN_PAYOUTS | ERR_WAVE_OUTSIDE_WINDOW | ERR_PERFORMANCES_NOT_LOCKED | ERR_NO_PUBLISHED_CUTPOINT_SET | ERR_NO_BANDED_PERFORMANCES | ERR_PERFORMANCE_NOT_BANDED"
    http_status: 409
    applies_to: "transition and mutation endpoints as listed"

  - priority: 8
    category: business_referential
    check: "Same-cycle consistency and uniqueness: cutpoint row measure must belong to the set's cycle (ERR_CUTPOINT_MEASURE_CYCLE_MISMATCH); performance measure must belong to the given cycle (ERR_MEASURE_CYCLE_MISMATCH); one performance per (measure, cycle) (ERR_DUPLICATE_PERFORMANCE); one OPEN/REOPENED gap per (member, measure) (ERR_DUPLICATE_OPEN_GAP); gap_type PHARMACY_ADHERENCE only on PHARMACY_PDE measures, other gap types not on PHARMACY_PDE measures (ERR_GAP_TYPE_MEASURE_MISMATCH); measure code unique within cycle (ERR_DUPLICATE_MEASURE_CODE); member_ref unique system-wide (ERR_DUPLICATE_MEMBER_REF)"
    error_id: "ERR_CUTPOINT_MEASURE_CYCLE_MISMATCH | ERR_MEASURE_CYCLE_MISMATCH | ERR_DUPLICATE_PERFORMANCE | ERR_DUPLICATE_OPEN_GAP | ERR_GAP_TYPE_MEASURE_MISMATCH | ERR_DUPLICATE_MEASURE_CODE | ERR_DUPLICATE_MEMBER_REF"
    http_status: 409
    applies_to: "POST /api/cutpoint-sets, PUT /api/cutpoint-sets/{setId}, POST /api/measure-performances, POST /api/care-gaps, POST /api/measures, POST /api/members"

  - priority: 9
    category: business_constraint
    check: "Cross-field sanity: window_start < window_end (ERR_INVALID_WINDOW); cutpoint floors strictly monotonic per direction — HIGHER_BETTER requires band_2 < band_3 < band_4 < band_5, LOWER_BETTER requires band_5 < band_4 < band_3 < band_2 (ERR_CUTPOINTS_NON_MONOTONIC); intervene allowed only on PHARMACY_ADHERENCE gaps (ERR_INTERVENTION_GAP_TYPE_MISMATCH)"
    error_id: "ERR_INVALID_WINDOW | ERR_CUTPOINTS_NON_MONOTONIC | ERR_INTERVENTION_GAP_TYPE_MISMATCH"
    http_status: 400
    applies_to: "POST /api/survey-waves, POST /api/cutpoint-sets, PUT /api/cutpoint-sets/{setId}, POST /api/care-gaps/{gapId}/intervene"

  - priority: 10
    category: business_temporal
    check: "Survey lane overlap: within same (rating_cycle_id, survey_type), a new wave's half-open [window_start, window_end) must not intersect any existing non-terminal wave's window — adjacency (start == other.end or end == other.start) is ALLOWED (ERR_SURVEY_WINDOW_OVERLAP); vendor capacity: count of existing non-terminal waves of the vendor whose windows intersect the new window (any-intersection test, adjacency excluded) must be < vendor.max_concurrent_waves (ERR_VENDOR_CAPACITY_EXCEEDED)"
    error_id: "ERR_SURVEY_WINDOW_OVERLAP | ERR_VENDOR_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "POST /api/survey-waves"

  - priority: 11
    category: business_safety
    check: "Segregation of duties: payout approver X-User-ID must differ from payout.proposed_by_user_id"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /api/incentive-payouts/{payoutId}/transition {to_state: APPROVED}"

  - priority: 12
    category: business_fiscal
    check: "Incentive pool sufficiency: computed payout amount must be <= group.remaining_amount"
    error_id: ERR_INCENTIVE_POOL_EXCEEDED
    http_status: 402
    applies_to: "POST /api/incentive-payouts"

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Default at server startup is exactly 2026-08-01T00:00:00Z; before any set call the logical clock reads this default and never falls back to wall-clock time."
    roles: [StarsAdmin]
    code: 200
    input: [to_iso8601]
    output: { now: string }
    side_effects: ["logical clock advanced; no entity mutated"]

  # --- RatingCycle ---
  - method: POST
    path: "/api/rating-cycles"
    description: "Create a rating cycle"
    roles: [StarsAdmin]
    code: 201
    input: [measurement_year, rating_year, benchmark_pmpm]
    output: RatingCycle
    side_effects: ["status = SETUP"]

  - method: GET
    path: "/api/rating-cycles"
    description: "List rating cycles"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: ["status?"]
    output: "RatingCycle[]"
    side_effects: []

  - method: GET
    path: "/api/rating-cycles/{cycleId}"
    description: "Get one rating cycle"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: []
    output: RatingCycle
    side_effects: []

  - method: POST
    path: "/api/rating-cycles/{cycleId}/transition"
    description: "Drive cycle lifecycle; to_state one of DATA_COLLECTION, CUTPOINT_REVIEW, OFFICIAL_PUBLISHED, CLOSED"
    roles: [StarsAdmin]
    code: 200
    input: [to_state]
    output: RatingCycle
    side_effects: ["per RatingCycle state machine; reopen reverts LOCKED performances to VALIDATED; publish-official computes official stars and rebate"]

  # --- Measure ---
  - method: POST
    path: "/api/measures"
    description: "Register a measure in a cycle's inventory"
    roles: [StarsAnalyst]
    code: 201
    input: [rating_cycle_id, code, title, domain, measure_type, direction, data_source, improvement_eligible, "prior_cycle_star?"]
    output: Measure
    side_effects: ["status = DRAFT; weight computed from measure_type"]

  - method: GET
    path: "/api/measures"
    description: "List measures"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: ["rating_cycle_id?", "status?", "domain?"]
    output: "Measure[]"
    side_effects: []

  - method: GET
    path: "/api/measures/{measureId}"
    description: "Get one measure"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: []
    output: Measure
    side_effects: []

  - method: POST
    path: "/api/measures/{measureId}/transition"
    description: "Activate or retire a measure"
    roles: [StarsAnalyst]
    code: 200
    input: [to_state]
    output: Measure
    side_effects: ["per Measure state machine"]

  # --- CutPointSet ---
  - method: POST
    path: "/api/cutpoint-sets"
    description: "Create a cut point set with rows for a cycle"
    roles: [StarsAnalyst]
    code: 201
    input: [rating_cycle_id, label, "rows?"]
    output: CutPointSet
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/api/cutpoint-sets"
    description: "List cut point sets"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: ["rating_cycle_id?", "status?"]
    output: "CutPointSet[]"
    side_effects: []

  - method: GET
    path: "/api/cutpoint-sets/{setId}"
    description: "Get one cut point set"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: []
    output: CutPointSet
    side_effects: []

  - method: PUT
    path: "/api/cutpoint-sets/{setId}"
    description: "Replace all rows of a DRAFT set (OCC-guarded)"
    roles: [StarsAnalyst]
    code: 200
    input: [rows, expected_cutpoint_set_version]
    output: CutPointSet
    side_effects: ["rows replaced atomically; increments CutPointSet.version by 1"]

  - method: POST
    path: "/api/cutpoint-sets/{setId}/publish"
    description: "Publish a DRAFT set; supersedes the cycle's previously published set (OCC on cycle)"
    roles: [StarsAdmin]
    code: 200
    input: [expected_rating_cycle_version]
    output: CutPointSet
    side_effects:
      - "status -> PUBLISHED; previous PUBLISHED set -> SUPERSEDED"
      - "every MeasurePerformance of the cycle recomputes published_star"
      - "cycle.live_weighted_stars refresh"
      - "increments RatingCycle.version by 1"

  # --- MeasurePerformance ---
  - method: POST
    path: "/api/measure-performances"
    description: "Report measure performance for a cycle"
    roles: [QualityOps]
    code: 201
    input: [rating_cycle_id, measure_id, numerator, denominator, "exclusion_count?"]
    output: MeasurePerformance
    side_effects: ["status = REPORTED; raw_value + published_star + draft_star computed; reported_by_user_id from X-User-ID"]

  - method: GET
    path: "/api/measure-performances"
    description: "List performances"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: ["rating_cycle_id?", "measure_id?", "status?"]
    output: "MeasurePerformance[]"
    side_effects: []

  - method: GET
    path: "/api/measure-performances/{perfId}"
    description: "Get one performance"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: []
    output: MeasurePerformance
    side_effects: []

  - method: PUT
    path: "/api/measure-performances/{perfId}"
    description: "Correct numerator/denominator/exclusion_count while REPORTED"
    roles: [QualityOps]
    code: 200
    input: ["numerator?", "denominator?", "exclusion_count?"]
    output: MeasurePerformance
    side_effects: ["raw_value + published_star + draft_star recomputed; increments MeasurePerformance.version by 1"]

  - method: POST
    path: "/api/measure-performances/{perfId}/transition"
    description: "Validate or lock a performance"
    roles: [StarsAnalyst]
    code: 200
    input: [to_state]
    output: MeasurePerformance
    side_effects: ["per MeasurePerformance state machine; LOCKED entry refreshes cycle live stars"]

  # --- Member ---
  - method: POST
    path: "/api/members"
    description: "Enroll a member"
    roles: [QualityOps]
    code: 201
    input: [member_ref, plan_contract, enrolled_months]
    output: Member
    side_effects: ["status = ENROLLED"]

  - method: GET
    path: "/api/members"
    description: "List members"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: ["status?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/api/members/{memberId}"
    description: "Get one member"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/api/members/{memberId}/transition"
    description: "Disenroll a member"
    roles: [QualityOps]
    code: 200
    input: [to_state]
    output: Member
    side_effects: ["per Member state machine: open gaps EXCLUDED, denominators decremented, stars and live rating refreshed"]

  # --- CareGap ---
  - method: POST
    path: "/api/care-gaps"
    description: "Open a member-level care gap against a measure"
    roles: [QualityOps]
    code: 201
    input: [member_id, measure_id, gap_type]
    output: CareGap
    side_effects: ["status = OPEN; linked performance denominator += 1; raw/stars recompute; live stars refresh"]

  - method: GET
    path: "/api/care-gaps"
    description: "List care gaps (gap targeting worklists)"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: ["member_id?", "measure_id?", "status?", "gap_type?"]
    output: "CareGap[]"
    side_effects: []

  - method: GET
    path: "/api/care-gaps/{gapId}"
    description: "Get one care gap"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: []
    output: CareGap
    side_effects: []

  - method: POST
    path: "/api/care-gaps/{gapId}/transition"
    description: "Close, reopen, or exclude a gap"
    roles: [QualityOps]
    code: 200
    input: [to_state]
    output: CareGap
    side_effects: ["per CareGap state machine: numerator/denominator deltas, recomputes, live stars refresh"]

  - method: POST
    path: "/api/care-gaps/{gapId}/intervene"
    description: "Record a pharmacy-adherence outreach intervention against an open gap"
    roles: [QualityOps]
    code: 200
    input: [channel]
    output: CareGap
    side_effects: ["intervention_count += 1; last_intervention_channel := channel; increments CareGap.version by 1"]

  # --- ProviderGroup ---
  - method: POST
    path: "/api/provider-groups"
    description: "Create a provider group with an incentive program"
    roles: [IncentiveManager]
    code: 201
    input: [name, program_type, linked_measure_id, target_star, unit_reward_per_gap, max_pool_amount]
    output: ProviderGroup
    side_effects: ["status = ACTIVE; remaining_amount = max_pool_amount"]

  - method: GET
    path: "/api/provider-groups"
    description: "List provider groups"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: ["status?", "program_type?", "linked_measure_id?"]
    output: "ProviderGroup[]"
    side_effects: []

  - method: GET
    path: "/api/provider-groups/{groupId}"
    description: "Get one provider group"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: []
    output: ProviderGroup
    side_effects: []

  - method: POST
    path: "/api/provider-groups/{groupId}/transition"
    description: "Close a provider group"
    roles: [IncentiveManager]
    code: 200
    input: [to_state]
    output: ProviderGroup
    side_effects: ["per ProviderGroup state machine"]

  # --- IncentivePayout ---
  - method: POST
    path: "/api/incentive-payouts"
    description: "Propose a payout; amount computed by the group's program_type variant"
    roles: [IncentiveManager]
    code: 201
    input: [provider_group_id]
    output: IncentivePayout
    side_effects: ["amount + basis_snapshot computed; group.reserved_total += amount; group.remaining_amount -= amount; proposed_by_user_id from X-User-ID; increments ProviderGroup.version by 1"]

  - method: GET
    path: "/api/incentive-payouts"
    description: "List payouts"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: ["provider_group_id?", "status?"]
    output: "IncentivePayout[]"
    side_effects: []

  - method: GET
    path: "/api/incentive-payouts/{payoutId}"
    description: "Get one payout"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: []
    output: IncentivePayout
    side_effects: []

  - method: POST
    path: "/api/incentive-payouts/{payoutId}/transition"
    description: "Approve, pay, or deny a payout"
    roles: [IncentiveManager]
    code: 200
    input: [to_state]
    output: IncentivePayout
    side_effects: ["per IncentivePayout state machine: pool movements, SoD on approve"]

  # --- SurveyVendor ---
  - method: POST
    path: "/api/survey-vendors"
    description: "Register a survey vendor with a concurrency capacity"
    roles: [SurveyCoordinator]
    code: 201
    input: [name, max_concurrent_waves]
    output: SurveyVendor
    side_effects: []

  - method: GET
    path: "/api/survey-vendors"
    description: "List survey vendors"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: []
    output: "SurveyVendor[]"
    side_effects: []

  # --- SurveyWave ---
  - method: POST
    path: "/api/survey-waves"
    description: "Plan a CAHPS/HOS survey wave"
    roles: [SurveyCoordinator]
    code: 201
    input: [rating_cycle_id, survey_type, vendor_id, window_start, window_end, sample_size]
    output: SurveyWave
    side_effects: ["status = PLANNED"]

  - method: GET
    path: "/api/survey-waves"
    description: "List survey waves"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: ["rating_cycle_id?", "vendor_id?", "survey_type?", "status?"]
    output: "SurveyWave[]"
    side_effects: []

  - method: GET
    path: "/api/survey-waves/{waveId}"
    description: "Get one survey wave"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: []
    output: SurveyWave
    side_effects: []

  - method: POST
    path: "/api/survey-waves/{waveId}/transition"
    description: "Advance wave fielding; SCORED requires response_count"
    roles: [SurveyCoordinator]
    code: 200
    input: [to_state, "response_count?"]
    output: SurveyWave
    side_effects: ["per SurveyWave state machine: response_rate and sufficient computed at SCORED"]

  # --- ComplaintCase ---
  - method: POST
    path: "/api/complaint-cases"
    description: "File a complaint or appeal case"
    roles: [ComplaintsAuditor]
    code: 201
    input: [rating_cycle_id, member_id, category, filed_at]
    output: ComplaintCase
    side_effects: ["status = FILED"]

  - method: GET
    path: "/api/complaint-cases"
    description: "List complaint cases"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: ["rating_cycle_id?", "member_id?", "status?", "category?"]
    output: "ComplaintCase[]"
    side_effects: []

  - method: GET
    path: "/api/complaint-cases/{caseId}"
    description: "Get one complaint case"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: []
    output: ComplaintCase
    side_effects: []

  - method: POST
    path: "/api/complaint-cases/{caseId}/transition"
    description: "Resolve a complaint as valid or invalid; divergent measure side effects per branch"
    roles: [ComplaintsAuditor]
    code: 200
    input: [to_state]
    output: ComplaintCase
    side_effects: ["per ComplaintCase state machine: RESOLVED_VALID increments complaints-measure numerator; timeliness flagging"]

  # --- RatingForecast ---
  - method: POST
    path: "/api/rating-forecasts"
    description: "Run and persist a rating forecast + rebate impact snapshot"
    roles: [StarsAnalyst]
    code: 201
    input: [rating_cycle_id, basis]
    output: RatingForecast
    side_effects: ["snapshot computed per weighted_overall_stars + improvement_measure + rebate_projection"]

  - method: GET
    path: "/api/rating-forecasts"
    description: "List forecasts"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: ["rating_cycle_id?", "basis?"]
    output: "RatingForecast[]"
    side_effects: []

  - method: GET
    path: "/api/rating-forecasts/{forecastId}"
    description: "Get one forecast snapshot"
    roles: [StarsAdmin, StarsAnalyst, QualityOps, SurveyCoordinator, IncentiveManager, ComplaintsAuditor]
    code: 200
    input: []
    output: RatingForecast
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, invalid enum member, or scalar range violation" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "RatingCycle id does not exist" }
  - { id: ERR_MEASURE_NOT_FOUND, http: 404, condition: "Measure id does not exist" }
  - { id: ERR_CUTPOINT_SET_NOT_FOUND, http: 404, condition: "CutPointSet id does not exist" }
  - { id: ERR_PERFORMANCE_NOT_FOUND, http: 404, condition: "MeasurePerformance id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member id does not exist" }
  - { id: ERR_CARE_GAP_NOT_FOUND, http: 404, condition: "CareGap id does not exist" }
  - { id: ERR_PROVIDER_GROUP_NOT_FOUND, http: 404, condition: "ProviderGroup id does not exist" }
  - { id: ERR_PAYOUT_NOT_FOUND, http: 404, condition: "IncentivePayout id does not exist" }
  - { id: ERR_VENDOR_NOT_FOUND, http: 404, condition: "SurveyVendor id does not exist" }
  - { id: ERR_WAVE_NOT_FOUND, http: 404, condition: "SurveyWave id does not exist" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "ComplaintCase id does not exist" }
  - { id: ERR_FORECAST_NOT_FOUND, http: 404, condition: "RatingForecast id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition's from-state does not match the entity's current state" }
  - { id: ERR_CYCLE_NOT_COLLECTING, http: 409, condition: "Care gap mutation requires owning cycle in DATA_COLLECTION" }
  - { id: ERR_CYCLE_STATE_FORBIDS, http: 409, condition: "Cycle state forbids the operation (measure activate/retire windows, cutpoint publish, publish-official preconditions)" }
  - { id: ERR_PERFORMANCE_LOCKED, http: 409, condition: "Linked performance is LOCKED; numerator/denominator mutations forbidden" }
  - { id: ERR_PERFORMANCES_NOT_LOCKED, http: 409, condition: "Cycle cannot enter CUTPOINT_REVIEW while any performance is REPORTED or VALIDATED" }
  - { id: ERR_NO_PUBLISHED_CUTPOINT_SET, http: 409, condition: "Publish-official or published-basis forecast requires a PUBLISHED cut point set" }
  - { id: ERR_NO_BANDED_PERFORMANCES, http: 409, condition: "Publish-official requires at least one LOCKED performance with non-null published_star" }
  - { id: ERR_NO_DRAFT_CUTPOINT_SET, http: 409, condition: "Draft-basis forecast requires at least one DRAFT cut point set" }
  - { id: ERR_MEMBER_NOT_ENROLLED, http: 409, condition: "Gap create/close requires member ENROLLED" }
  - { id: ERR_GAP_NOT_OPEN, http: 409, condition: "Close requires gap OPEN or REOPENED" }
  - { id: ERR_GAP_NOT_CLOSED, http: 409, condition: "Reopen requires gap CLOSED" }
  - { id: ERR_DUPLICATE_OPEN_GAP, http: 409, condition: "An OPEN or REOPENED gap already exists for (member, measure)" }
  - { id: ERR_GAP_TYPE_MEASURE_MISMATCH, http: 409, condition: "PHARMACY_ADHERENCE gaps require a PHARMACY_PDE measure; other gap types require a non-PHARMACY_PDE measure" }
  - { id: ERR_INTERVENTION_GAP_TYPE_MISMATCH, http: 400, condition: "Interventions only allowed on PHARMACY_ADHERENCE gaps" }
  - { id: ERR_INTERVENTION_LIMIT_REACHED, http: 409, condition: "Gap already has 3 interventions" }
  - { id: ERR_CUTPOINT_SET_IMMUTABLE, http: 409, condition: "Row replace requires set DRAFT; publish requires set DRAFT" }
  - { id: ERR_CUTPOINT_MEASURE_CYCLE_MISMATCH, http: 409, condition: "Cut point row references a measure outside the set's cycle" }
  - { id: ERR_MEASURE_CYCLE_MISMATCH, http: 409, condition: "Performance measure does not belong to the given cycle" }
  - { id: ERR_DUPLICATE_PERFORMANCE, http: 409, condition: "A performance already exists for (measure, cycle)" }
  - { id: ERR_DUPLICATE_MEASURE_CODE, http: 409, condition: "Measure code already used within the cycle" }
  - { id: ERR_DUPLICATE_MEMBER_REF, http: 409, condition: "member_ref already registered" }
  - { id: ERR_CUTPOINTS_NON_MONOTONIC, http: 400, condition: "Cut point floors not strictly monotonic for the measure's direction" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "window_start >= window_end" }
  - { id: ERR_SURVEY_WINDOW_OVERLAP, http: 409, condition: "New wave overlaps an existing non-terminal wave in the same (cycle, survey_type) lane" }
  - { id: ERR_VENDOR_CAPACITY_EXCEEDED, http: 409, condition: "Vendor's overlapping-wave count would reach max_concurrent_waves" }
  - { id: ERR_WAVE_OUTSIDE_WINDOW, http: 409, condition: "Logical clock outside the wave's fielding window for the requested transition" }
  - { id: ERR_GROUP_NOT_ACTIVE, http: 409, condition: "Payout propose requires provider group ACTIVE" }
  - { id: ERR_GROUP_HAS_OPEN_PAYOUTS, http: 409, condition: "Group close forbidden while PENDING or APPROVED payouts exist" }
  - { id: ERR_PAYOUT_NOT_PENDING, http: 409, condition: "Approve/deny requires payout PENDING" }
  - { id: ERR_PAYOUT_NOT_APPROVED, http: 409, condition: "Pay requires payout APPROVED" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Approver X-User-ID equals payout.proposed_by_user_id" }
  - { id: ERR_INCENTIVE_POOL_EXCEEDED, http: 402, condition: "Computed payout amount exceeds group.remaining_amount" }
  - { id: ERR_PERFORMANCE_NOT_BANDED, http: 409, condition: "ATTAINMENT payout requires the linked measure's performance to have a non-null published_star" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: StarsAdmin
    description: "Stars program administrator: owns rating cycles, publishes cut point sets and official ratings, controls the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/rating-cycles"
      - "POST /api/rating-cycles/{cycleId}/transition"
      - "POST /api/cutpoint-sets/{setId}/publish"
    shared_operations:
      - "all GET list/detail endpoints"

  - name: StarsAnalyst
    description: "Stars measure analyst: owns measure inventory, cut point set drafting, performance validation/locking, forecasts"
    identity: opaque
    exclusive_operations:
      - "POST /api/measures"
      - "POST /api/measures/{measureId}/transition"
      - "POST /api/cutpoint-sets"
      - "PUT /api/cutpoint-sets/{setId}"
      - "POST /api/measure-performances/{perfId}/transition"
      - "POST /api/rating-forecasts"
    shared_operations:
      - "all GET list/detail endpoints"

  - name: QualityOps
    description: "Quality operations specialist: reports performance, manages members, care gaps, and adherence interventions"
    identity: opaque
    exclusive_operations:
      - "POST /api/measure-performances"
      - "PUT /api/measure-performances/{perfId}"
      - "POST /api/members"
      - "POST /api/members/{memberId}/transition"
      - "POST /api/care-gaps"
      - "POST /api/care-gaps/{gapId}/transition"
      - "POST /api/care-gaps/{gapId}/intervene"
    shared_operations:
      - "all GET list/detail endpoints"

  - name: SurveyCoordinator
    description: "Survey operations coordinator: manages CAHPS/HOS vendors and waves"
    identity: opaque
    exclusive_operations:
      - "POST /api/survey-vendors"
      - "POST /api/survey-waves"
      - "POST /api/survey-waves/{waveId}/transition"
    shared_operations:
      - "all GET list/detail endpoints"

  - name: IncentiveManager
    description: "Provider incentive manager: owns provider groups and payout lifecycle; approver must differ from proposer"
    identity: opaque
    exclusive_operations:
      - "POST /api/provider-groups"
      - "POST /api/provider-groups/{groupId}/transition"
      - "POST /api/incentive-payouts"
      - "POST /api/incentive-payouts/{payoutId}/transition"
    shared_operations:
      - "all GET list/detail endpoints"

  - name: ComplaintsAuditor
    description: "Appeals and complaints auditor: files and resolves complaint cases"
    identity: opaque
    exclusive_operations:
      - "POST /api/complaint-cases"
      - "POST /api/complaint-cases/{caseId}/transition"
    shared_operations:
      - "all GET list/detail endpoints"
