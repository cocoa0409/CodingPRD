              as: SiteController
              as_user_id: "${a1}"
              captures: { ok2_mva: $.data.apparent_mva }
          assert:
            - "MW branch (25.01 > 25.0): HTTP 422 with ${e_mw} == \"ERR_POI_LIMIT_EXCEEDED\""
            - "MVA branch (25.0 MW legal, but round(sqrt(625 + 144), 3) == 27.731 > 27.5): HTTP 422 with ${e_mva} == \"ERR_POI_LIMIT_EXCEEDED\""
            - "reactive branch (10.0 MW, apparent 15.628 well inside 27.5, abs(12.01) > 12.0): HTTP 422 with ${e_mvar} == \"ERR_REACTIVE_LIMIT_EXCEEDED\" - not the POI code"
            - "exactly at the MW limit: HTTP 201 with ${ok1_mva} == 25.0 - the comparisons are inclusive"
            - "exactly at the reactive limit with a negative (absorbing) value: HTTP 201 with ${ok2_mva} == 15.62 - a signed MVAr is a well-formed reading and abs(-12.0) == 12.0 is compliant"
            - "telemetry_sample_count == 2 - the three rejected readings persisted nothing"

      - name: telemetry_regression_and_pre_window_samples_are_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TELEMETRY_OUT_OF_ORDER]
          - validations[priority=24]
          - entities.TelemetrySample.sampled_at
        distinguishing_aspect: |
          Monotonicity has two halves that pull in opposite directions: a sample may never be at or
          before the newest stored instant, yet a sample AFTER setpoint_end is perfectly legal and
          must be stored as late-arriving telemetry (it is exactly what makes the settled scoring
          variant diverge). The equal-instant case is the trap - strictly greater means an exact
          repeat of the newest timestamp is refused.
        test_recipe:
          setup:
            - "instruction D1 EXECUTING with setpoint window 12:00-14:00, no samples yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /storage-assets"
              payload: { name: "Mesa Verde BESS 1", nameplate_energy_mwh: 100.0, power_rating_mw: 25.0, poi_mw_limit: 25.0, poi_mva_limit: 27.5, reactive_capability_mvar: 12.0, initial_soc_mwh: 80.0, degradation_cost_usd_per_mwh: 12.00, warranty_throughput_limit_mwh: 40000.0, commercial_operation_date: "2023-08-01T00:00:00Z", cycle_limit_per_year: 365 }
              as: PlatformAdmin
              captures: { a1: $.data.id }
            - call: "POST /storage-assets/${a1}/commission"
              payload: {}
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /soc-reservations"
              payload: { asset_id: "${a1}", purpose: "ENERGY_ARBITRAGE", reserved_mwh: 40.0, window_start: "2026-08-10T12:00:00Z", window_end: "2026-08-10T20:00:00Z", expected_asset_version: "${v1}" }
              as: MarketTrader
              captures: { r1: $.data.id }
            - call: "POST /market-bids"
              payload: { asset_id: "${a1}", reservation_id: "${r1}", market_type: "DAY_AHEAD", product: "ENERGY", direction: "DISCHARGE", delivery_start: "2026-08-10T12:00:00Z", delivery_end: "2026-08-10T16:00:00Z", offer_mw: 10.0 }
              as: MarketTrader
              captures: { b1: $.data.id }
            - call: "POST /market-bids/${b1}/submit"
              payload: {}
              as: MarketTrader
            - call: "POST /market-bids/${b1}/clearing-result"
              payload: { outcome: "CLEARED", cleared_price_usd_per_mwh: 45.00, cleared_mw: 10.0 }
              as: MarketOperator
            - call: "POST /dispatch-instructions"
              payload: { bid_id: "${b1}", asset_id: "${a1}", instructed_mw: 10.0, setpoint_start: "2026-08-10T12:00:00Z", setpoint_end: "2026-08-10T14:00:00Z" }
              as: MarketOperator
              captures: { d1: $.data.id }
            - call: "POST /dispatch-instructions/${d1}/accept"
              payload: {}
              as: ControlRoomOperator
            - call: "POST /dispatch-instructions/${d1}/execute"
              payload: {}
              as: SiteController
              as_user_id: "${a1}"
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 1, sampled_at: "2026-08-10T13:00:00Z", measured_mw: 10.0, measured_mvar: 4.0, soc_mwh_reading: 75.0, max_cell_temp_c: 40.0 }
              as: SiteController
              as_user_id: "${a1}"
              captures: { s1: $.data.sample_index }
          trigger:
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 2, sampled_at: "2026-08-10T12:30:00Z", measured_mw: 10.0, measured_mvar: 4.0, soc_mwh_reading: 74.0, max_cell_temp_c: 40.0 }
              as: SiteController
              as_user_id: "${a1}"
              captures: { e_back: $.data.error_id }
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 2, sampled_at: "2026-08-10T13:00:00Z", measured_mw: 10.0, measured_mvar: 4.0, soc_mwh_reading: 74.0, max_cell_temp_c: 40.0 }
              as: SiteController
              as_user_id: "${a1}"
              captures: { e_equal: $.data.error_id }
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 2, sampled_at: "2026-08-10T11:30:00Z", measured_mw: 10.0, measured_mvar: 4.0, soc_mwh_reading: 74.0, max_cell_temp_c: 40.0 }
              as: SiteController
              as_user_id: "${a1}"
              captures: { e_pre: $.data.error_id }
            - call: "POST /telemetry-samples"
              payload: { dispatch_id: "${d1}", sample_index: 2, sampled_at: "2026-08-10T13:30:00Z", measured_mw: 10.0, measured_mvar: 4.0, soc_mwh_reading: 74.0, max_cell_temp_c: 40.0 }
              as: SiteController
              as_user_id: "${a1}"
