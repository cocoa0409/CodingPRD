scaffold_difficulty_design:

  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: performance_estimated_vs_actual_on_contract
        grounds:
          - calculations.performance_metrics
          - state_machines.Payout.RELEASED_to_SETTLED
          - endpoints["GET /contracts/{id}/performance"]
        distinguishing_aspect: |
          On the Contract domain: GET /contracts/{id}/performance returns variant=estimated
          (cost_basis=contracted_rate_cents=80000) before the payout settles and variant=actual
          (cost_basis=net_amount_cents=64000) after settlement; identical conversions give
          cpm 8.00 vs 6.40 and roas 4.0000 vs 5.0000.
        test_recipe:
          setup:
            - "Brand budget 1,000,000c; Creator with W-9 on file and a clean audience snapshot"
            - "OPEN campaign with one FEED_POST deliverable; offer 80000c accepted; contract signed (ACTIVE)"
            - "One ENABLED tracking link with 100000 impressions, 4000 engagements, 320000c sale revenue"
            - "Deliverable's content APPROVED -> contract FULFILLED"
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "Acme", contact_email: "ops@acme.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@perf_w9", primary_platform: "INSTAGRAM", tax_id_on_file: true }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /creators/${creator_id}/audience-snapshots"
              payload: { follower_count: 100000, avg_engagement_rate: 0.045, estimated_reach: 50000, fake_follower_pct: 0.05 }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "Spring", campaign_budget_cents: 500000, requires_ftc_disclosure: true, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { campaign_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${campaign_id}/deliverables"
              payload: { content_type: "FEED_POST", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 80000 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { deliverable_id: $.data.id }
            - call: "POST /campaigns/${campaign_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${campaign_id}", creator_id: "${creator_id}", current_amount_cents: 80000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { offer_id: $.data.id, ov0: $.data.version }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_offer_version: "${ov0}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { ov_acc: $.data.version }
            - call: "POST /contracts"
              payload: { offer_id: "${offer_id}", expected_offer_version: "${ov_acc}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /attribution-assets"
              payload: { contract_id: "${contract_id}", asset_type: "TRACKING_LINK", code_or_slug: "spring-w9" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { asset_id: $.data.id }
            - call: "POST /attribution-assets/${asset_id}/conversions"
              payload: { event_type: "IMPRESSION", count: 100000 }
              as: PlatformAdmin
            - call: "POST /attribution-assets/${asset_id}/conversions"
              payload: { event_type: "ENGAGEMENT", count: 4000 }
              as: PlatformAdmin
            - call: "POST /attribution-assets/${asset_id}/conversions"
              payload: { event_type: "SALE", count: 50, revenue_cents: 320000 }
              as: PlatformAdmin
            - call: "POST /content-submissions"
              payload: { deliverable_id: "${deliverable_id}", contract_id: "${contract_id}", media_url: "https://x/1", caption: "Loving this #ad" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /content-submissions/${sub_id}/start-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /content-submissions/${sub_id}/approve"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "GET /contracts/${contract_id}/performance"
              payload: {}
              as: Brand
              as_user_id: "${brand_id}"
              captures: { variant_est: $.data.variant, cpm_est: $.data.cpm, roas_est: $.data.roas }
          assert:
            - "GET performance before settle: data.variant == 'estimated'"
            - "data.cost_basis_cents == 80000"
            - "data.cpm == 8.00"
            - "data.cpe == 0.20"
            - "data.roas == 4.0000"

      - name: payout_breakdown_w9_vs_backup_withholding
        grounds:
          - calculations.payout_breakdown
          - entities.Creator.fields.tax_id_on_file
          - state_machines.Payout.NEW_to_PENDING
        distinguishing_aspect: |
          On the Payout/Creator domain: the same gross 80000c yields net 64000 when
          creator.tax_id_on_file==true (variant with_w9, tax_withholding 0) but net 48640
          when false (variant backup_withholding, tax_withholding = round(64000*0.24)=15360);
          a different subject than the Contract-domain performance dual-variant.
        test_recipe:
          setup:
            - "Two creators, identical except W-9 status; each with a FULFILLED 80000c contract"
            - "Creator A tax_id_on_file=true; Creator B tax_id_on_file=false"
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "Beta", contact_email: "b@beta.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@noW9", primary_platform: "TIKTOK", tax_id_on_file: false }
              as: PlatformAdmin
              captures: { creator_b: $.data.id }
            - call: "POST /creators/${creator_b}/audience-snapshots"
              payload: { follower_count: 50000, avg_engagement_rate: 0.05, estimated_reach: 30000, fake_follower_pct: 0.05 }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "B-camp", campaign_budget_cents: 500000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { campaign_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${campaign_id}/deliverables"
              payload: { content_type: "REEL", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 80000 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { deliverable_id: $.data.id }
            - call: "POST /campaigns/${campaign_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${campaign_id}", creator_id: "${creator_b}", current_amount_cents: 80000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { offer_id: $.data.id, ov0: $.data.version }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_offer_version: "${ov0}" }
              as: Creator
              as_user_id: "${creator_b}"
              captures: { ov_acc: $.data.version }
            - call: "POST /contracts"
              payload: { offer_id: "${offer_id}", expected_offer_version: "${ov_acc}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { contract_id: $.data.id, kv0: $.data.version }
            - call: "POST /content-submissions"
              payload: { deliverable_id: "${deliverable_id}", contract_id: "${contract_id}", media_url: "https://x/2", caption: "no disclosure needed" }
              as: Creator
              as_user_id: "${creator_b}"
              captures: { sub_id: $.data.id }
            - call: "POST /content-submissions/${sub_id}/start-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /content-submissions/${sub_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { kv_fulfilled: $.data.version }
          trigger:
            - call: "POST /payouts"
              payload: { contract_id: "${contract_id}", expected_contract_version: "${kv_fulfilled}" }
              as: ComplianceOfficer
              captures: { payout_id: $.data.id }
          assert:
            - "Payout.${payout_id}.gross_amount_cents == 80000"
            - "Payout.${payout_id}.platform_fee_cents == 16000"
            - "Payout.${payout_id}.tax_withholding_cents == 15360"
            - "Payout.${payout_id}.net_amount_cents == 48640"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: payout_marginal_tier_fee_mode_a
        grounds:
          - calculations.payout_breakdown
          - state_machines.Payout.NEW_to_PENDING
        distinguishing_aspect: |
          Mode (a): platform_fee is a 3-input non-linear marginal-tier selection over gross
          80000c -> all in tier1 -> 16000c, while gross 300000c straddles tier1+tier2 ->
          100000*0.20 + 200000*0.15 = 50000c (not flat 20%); plus a conditional branch on
          tax_id_on_file. Rounded ONCE at the end of the tier sum.
        test_recipe:
          setup:
            - "Brand budget 1,000,000c; W-9 creator with FULFILLED 300000c contract (straddles tier1->tier2)"
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "Gamma", contact_email: "g@g.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@tier", primary_platform: "YOUTUBE", tax_id_on_file: true }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /creators/${creator_id}/audience-snapshots"
              payload: { follower_count: 200000, avg_engagement_rate: 0.05, estimated_reach: 90000, fake_follower_pct: 0.05 }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "Tier", campaign_budget_cents: 400000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { campaign_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${campaign_id}/deliverables"
              payload: { content_type: "VIDEO", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 300000 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { deliverable_id: $.data.id }
            - call: "POST /campaigns/${campaign_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${campaign_id}", creator_id: "${creator_id}", current_amount_cents: 300000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { offer_id: $.data.id, ov0: $.data.version }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_offer_version: "${ov0}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { ov_acc: $.data.version }
            - call: "POST /contracts"
              payload: { offer_id: "${offer_id}", expected_offer_version: "${ov_acc}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /content-submissions"
              payload: { deliverable_id: "${deliverable_id}", contract_id: "${contract_id}", media_url: "https://x/3", caption: "tiered" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /content-submissions/${sub_id}/start-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /content-submissions/${sub_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { kv_fulfilled: $.data.version }
          trigger:
            - call: "POST /payouts"
              payload: { contract_id: "${contract_id}", expected_contract_version: "${kv_fulfilled}" }
              as: ComplianceOfficer
              captures: { payout_id: $.data.id }
          assert:
            - "Payout.${payout_id}.gross_amount_cents == 300000"
            - "Payout.${payout_id}.platform_fee_cents == 50000"
            - "Payout.${payout_id}.tax_withholding_cents == 0"
            - "Payout.${payout_id}.net_amount_cents == 250000"

      - name: ytd_round_per_payout_then_sum_mode_b
        grounds:
          - calculations.tax_1099_total
          - calculations.payout_breakdown
          - state_machines.Payout.RELEASED_to_SETTLED
        distinguishing_aspect: |
          Mode (b): YTD is the SUM of per-payout already-rounded nets (round-then-sum). Two
          SETTLED W-9 payouts net 40000 (gross 50000) and 32000 (gross 40000) sum to
          creator.ytd_paid_cents == 72000 — each net rounded once at its own creation, never
          re-derived from raw fractions and rounded in aggregate.
        test_recipe:
          setup:
            - "W-9 creator; two separate FULFILLED contracts grosses 50000c and 40000c, each settled"
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "Delta", contact_email: "d@d.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@ytd", primary_platform: "INSTAGRAM", tax_id_on_file: true }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /creators/${creator_id}/audience-snapshots"
              payload: { follower_count: 80000, avg_engagement_rate: 0.05, estimated_reach: 40000, fake_follower_pct: 0.05 }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "C1", campaign_budget_cents: 100000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-02-15T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { camp1: $.data.id, cv1: $.data.version }
            - call: "POST /campaigns/${camp1}/deliverables"
              payload: { content_type: "STORY", quantity: 1, due_at: "2026-02-10T00:00:00Z", base_rate_cents: 50000 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { del1: $.data.id }
            - call: "POST /campaigns/${camp1}/open"
              payload: { expected_campaign_version: "${cv1}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${camp1}", creator_id: "${creator_id}", current_amount_cents: 50000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { off1: $.data.id, off1v: $.data.version }
            - call: "POST /offers/${off1}/accept"
              payload: { expected_offer_version: "${off1v}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { off1acc: $.data.version }
            - call: "POST /contracts"
              payload: { offer_id: "${off1}", expected_offer_version: "${off1acc}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { con1: $.data.id }
            - call: "POST /content-submissions"
              payload: { deliverable_id: "${del1}", contract_id: "${con1}", media_url: "https://x/c1", caption: "one" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sub1: $.data.id }
            - call: "POST /content-submissions/${sub1}/start-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /content-submissions/${sub1}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /contracts/${con1}"
              payload: {}
              as: ComplianceOfficer
              captures: { con1v: $.data.version }
            - call: "POST /payouts"
              payload: { contract_id: "${con1}", expected_contract_version: "${con1v}" }
              as: ComplianceOfficer
              captures: { pay1: $.data.id }
            - call: "POST /payouts/${pay1}/release"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /payouts/${pay1}/settle"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "C2", campaign_budget_cents: 100000, requires_ftc_disclosure: false, starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-04-15T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { camp2: $.data.id, cv2: $.data.version }
            - call: "POST /campaigns/${camp2}/deliverables"
              payload: { content_type: "STORY", quantity: 1, due_at: "2026-04-10T00:00:00Z", base_rate_cents: 40000 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { del2: $.data.id }
            - call: "POST /campaigns/${camp2}/open"
              payload: { expected_campaign_version: "${cv2}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${camp2}", creator_id: "${creator_id}", current_amount_cents: 40000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { off2: $.data.id, off2v: $.data.version }
            - call: "POST /offers/${off2}/accept"
              payload: { expected_offer_version: "${off2v}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { off2acc: $.data.version }
            - call: "POST /contracts"
              payload: { offer_id: "${off2}", expected_offer_version: "${off2acc}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { con2: $.data.id }
            - call: "POST /content-submissions"
              payload: { deliverable_id: "${del2}", contract_id: "${con2}", media_url: "https://x/c2", caption: "two" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { sub2: $.data.id }
            - call: "POST /content-submissions/${sub2}/start-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /content-submissions/${sub2}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /contracts/${con2}"
              payload: {}
              as: ComplianceOfficer
              captures: { con2v: $.data.version }
            - call: "POST /payouts"
              payload: { contract_id: "${con2}", expected_contract_version: "${con2v}" }
              as: ComplianceOfficer
              captures: { pay2: $.data.id }
            - call: "POST /payouts/${pay2}/release"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /payouts/${pay2}/settle"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "Creator.${creator_id}.ytd_paid_cents == 72000"
            - "Payout.${pay1}.net_amount_cents == 40000"
            - "Payout.${pay2}.net_amount_cents == 32000"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_counter_cycle_alternating_sides
        grounds:
          - state_machines.Offer.OFFERED_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_COUNTERED
          - entities.Offer.fields.round_count
        distinguishing_aspect: |
          Offer is cyclic: COUNTERED -> COUNTERED self-loop. Brand opens at 80000, Creator
          counters to 120000 (round_count 1, last_actor CREATOR), Brand counters to 100000
          (round_count 2, last_actor BRAND, status still COUNTERED) — same state re-entered.
        test_recipe:
          setup:
            - "OPEN campaign; Brand opens offer 80000c; Creator counters; Brand counters again"
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "Eps", contact_email: "e@e.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@neg", primary_platform: "TIKTOK", tax_id_on_file: true }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "Neg", campaign_budget_cents: 300000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { campaign_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${campaign_id}/deliverables"
              payload: { content_type: "FEED_POST", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 80000 }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /campaigns/${campaign_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${campaign_id}", creator_id: "${creator_id}", current_amount_cents: 80000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { offer_id: $.data.id, ov0: $.data.version }
            - call: "POST /offers/${offer_id}/counter"
              payload: { counter_amount_cents: 120000, expected_offer_version: "${ov0}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { ov1: $.data.version }
          trigger:
            - call: "POST /offers/${offer_id}/counter"
              payload: { counter_amount_cents: 100000, expected_offer_version: "${ov1}" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { ov2: $.data.version, rc2: $.data.round_count, st2: $.data.status }
          assert:
            - "Offer.${offer_id}.status == COUNTERED"
            - "Offer.${offer_id}.round_count == 2"
            - "Offer.${offer_id}.current_amount_cents == 100000"
            - "Offer.${offer_id}.last_actor == BRAND"

      - name: content_revision_loop_resubmit_cycle
        grounds:
          - state_machines.ContentSubmission.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.ContentSubmission.CHANGES_REQUESTED_to_SUBMITTED
          - entities.ContentSubmission.fields.revision_count
        distinguishing_aspect: |
          ContentSubmission is cyclic (different entity than Offer): IN_REVIEW ->
          CHANGES_REQUESTED -> SUBMITTED -> IN_REVIEW again, with revision_count incrementing
          to 1 on the loop; the submission re-enters SUBMITTED rather than advancing linearly.
        test_recipe:
          setup:
            - "ACTIVE contract with one deliverable; content submitted, review started, changes requested, then resubmitted"
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "Zeta", contact_email: "z@z.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@rev", primary_platform: "INSTAGRAM", tax_id_on_file: true }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
