        distinguishing_aspect: "Full closeout arc: draw 150000 settled against obligated 300000 -> initiate-closeout auto-creates the FFR -> submit (unliquidated 0; residual snapshot 150000) -> sponsor accept -> close deobligates the residual (total_obligated 300000 -> 150000, residual_deobligated_cents 150000)."
