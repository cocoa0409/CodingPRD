            - { call: "POST /work-items/${w1_id}/permits", payload: { permit_type: "COLD_WORK", hazard_class: "LOW", valid_from: "2026-06-12T00:00:00Z", valid_until: "2026-06-20T00:00:00Z", required_isolation_ids: [ "${i1_id}", "${i2_id}" ] }, as: PermitCoordinator, captures: { p_id: "$.data.id" } }
