            - call: "GET /rental-accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { acct_balance: $.data.open_credit_balance_cents, acct_hold: $.data.billing_hold }
          assert:
            - "${dep_state} == DEPLOYED, ${dep_site} == ${dest_id}, ${dep_reloc} == 1 — relocate is a DEPLOYED -> DEPLOYED self-loop"
            - "${reloc_amount} == 21275 (18500 * 115 / 100, no same-day uplift because 2026-08-05 != the clock date 2026-08-03), ${reloc_state} == ASSESSED, ${reloc_assessor} == planner-1"
            - "${debits_assessed} == 21275 and ${net_assessed} == 21275"
            - "${st_disputed} == DISPUTED and ${amount_disputed} == 21275 — the amount itself never changes"
            - "${debits_disputed} == 0 and ${net_disputed} == 0 — DISPUTED is outside the {ASSESSED, UPHELD} input set"
            - "${bs_disputed} == UNBILLED, so no INVOICED -> REBILL_REQUIRED hop was taken"
            - "${st_upheld} == UPHELD and ${resolver} == officer-2 and ${amount_upheld} == 21275"
            - "${debits_upheld} == 21275 and ${net_upheld} == 21275 — exactly the pre-dispute figures, no drift"
            - "${acct_balance} == 0 and ${acct_hold} == false throughout: RELOCATION is not a MISSED_SERVICE_CREDIT, so it never enters the account credit ledger"

