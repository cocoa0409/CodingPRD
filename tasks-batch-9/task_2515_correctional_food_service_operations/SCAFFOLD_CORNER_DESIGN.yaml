          - validations[priority=19]
          - validations[priority=49]
        distinguishing_aspect: "When a locked-down kitchen and an over-budget tray count are both violated by one request, the lower-numbered business_safety rule must answer."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / locked_down_kitchen_beats_tray_budget_on_production_batch_create
          rationale: "That instance builds a request that violates priority 19 and priority 49 simultaneously and asserts ERR_KITCHEN_POSTURE_BLOCKED, which is exactly the priority-ordering claim."

      - name: corner_activation_succeeds_once_the_guard_is_satisfied
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=43]
        distinguishing_aspect: "The same activation request that failed on a DRAFT contract must succeed unchanged once the contract is ACTIVE."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / menu_cycle_activation_requires_service_contract_active
          rationale: "That instance replays the identical activate call after activating the contract and asserts the cycle reaches ACTIVE, covering the satisfaction-to-pass direction."

      - name: corner_touching_diet_windows_are_not_a_conflict
        claim_type: temporal_validation
        grounds:
          - validations[priority=38]
          - calculations.diet_order_coverage_window
        distinguishing_aspect: "A new order whose effective_from equals the incumbent's effective_to must be accepted, while one that starts a second earlier must be refused."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / diet_order_half_open_windows_allow_touching_endpoints_on_same_inmate
          rationale: "That instance accepts the touching window and rejects the one-second overlap with ERR_DIET_ORDER_WINDOW_CONFLICT, covering the temporal claim in both directions."

