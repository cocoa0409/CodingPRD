scaffold_difficulty_design:
  # =====================================================================
  # Rule 1: dual_variant_calc — two variants on DIFFERENT entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: weekly_bucket_fresh_enrollment_vs_paused_week_rollover
        grounds:
          - calculations.weekly_bucket_grant
          - entities.ReservationCreditBucket.fields.rollover_in
        distinguishing_aspect: |
          Entity domain: ReservationCreditBucket. For week_index 0 of a fresh
          enrollment rollover_in is unconditionally 0, whereas a paused-week
          bucket (week_index >= 1 opened while PAUSED) still carries rollover_in
          from the previous week even though base_granted is forced to 0 — the
          two variants assign different rollover_in to structurally similar weeks.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; plan ALIST_PLUS quota=3 rollover cap=2 PUBLISHED"
            - "Member m1 ACTIVE with subscription s1 on ALIST_PLUS enrolled 2026-09-01 (week 0 bucket: base 3, rollover 0)"
            - "Theater + 10-seat auditorium + STANDARD ON_SALE showtime at 2026-09-03T19:00:00Z"
            - "m1 consumes exactly 2 credits in week 0 (two CONFIRMED reservations)"
            - "s1 paused at 2026-09-05T00:00:00Z for 14 days; clock advanced to 2026-09-08T00:00:00Z (week 1 opens while PAUSED)"
          setup_api_calls:
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscription-plans"
              payload: { code: "ALIST_PLUS", tier: "PLUS", monthly_fee_cents: 2499, weekly_reservation_quota: 3, max_rollover_credits: 2, premium_format_allowed: true, max_future_reservations: 5, loyalty_points_multiplier_pct: 125, concession_discount_pct: 10 }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /cinemas/subscription-plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/members"
              payload: { email: "m1@x.com", full_name: "M One" }
              as: MemberServices
              captures: { m1: $.data.id }
            - call: "POST /cinemas/members/${m1}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/theaters"
              payload: { name: "T1", timezone: "America/Los_Angeles" }
              as: ProgramAdmin
              captures: { th1: $.data.id }
            - call: "POST /cinemas/theaters/${th1}/auditoriums"
              payload: { label: "Aud 1", seat_count: 10, supported_formats: ["STANDARD", "IMAX"] }
              as: ProgramAdmin
              captures: { aud1: $.data.id }
            - call: "POST /cinemas/showtimes"
              payload: { auditorium_id: "${aud1}", film_title: "Film A", studio_code: "WB", format: "STANDARD", starts_at: "2026-09-03T19:00:00Z", runtime_minutes: 120, base_price_cents: 1200, premium_surcharge_cents: 0, opening_weekend: false }
              as: ProgramAdmin
              captures: { st1: $.data.id, st1_v: $.data.version }
            - call: "POST /cinemas/showtimes/${st1}/open_sales"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/members/${m1}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: MemberServices
              captures: { s1: $.data.id }
            - call: "POST /cinemas/reservations"
              payload: { subscription_id: "${s1}", showtime_id: "${st1}", expected_showtime_version: "${st1_v}" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1a: $.data.id }
            - call: "POST /cinemas/reservations/${r1a}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m1}"
            - call: "GET /cinemas/showtimes/${st1}"
              payload: {}
              as: ProgramAdmin
              captures: { st1_v2: $.data.version }
            - call: "POST /cinemas/reservations"
              payload: { subscription_id: "${s1}", showtime_id: "${st1}", expected_showtime_version: "${st1_v2}" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1b: $.data.id }
            - call: "POST /cinemas/reservations/${r1b}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m1}"
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscriptions/${s1}/pause"
              payload: { pause_days: 14 }
              as: Member
              as_user_id: "${m1}"
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /cinemas/subscriptions/${s1}/credit-buckets"
              payload: {}
              as: ProgramAdmin
              captures: { w0_rollover: "$.data[0].rollover_in", w1_base: "$.data[1].base_granted", w1_rollover: "$.data[1].rollover_in" }
          assert:
            - "week 0 bucket.rollover_in == 0 (fresh_enrollment variant)"
            - "week 1 bucket.base_granted == 0 (paused_week variant)"
            - "week 1 bucket.rollover_in == 1 (min(3+0-2, cap=2) = 1, carried despite pause)"
            - "week 1 bucket.posture == OPEN (credits_available == 1 from rollover alone)"

      - name: settlement_provisional_draft_vs_finalized_submitted_totals
        grounds:
          - calculations.settlement_valuation
          - state_machines.SettlementReport.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Entity domain: SettlementReport (money, not credits). A DRAFT report
          recomputes totals live from showtime pricing, while a SUBMITTED report's
          totals are frozen — a base_price_cents change between draft observation
          and submit makes provisional and finalized totals diverge.
        test_recipe:
          setup:
            - "Clock 2026-09-01; plan ALIST_BASIC quota=3 PUBLISHED; member m2 ACTIVE with subscription s2"
            - "Theater th2, 10-seat auditorium aud2, STANDARD showtime st2 at 2026-09-02T19:00:00Z base_price_cents=1200, studio WB"
            - "m2 reservation r2 CONFIRMED on st2 then CHECKED_IN within window"
            - "Settlement report rep2 (DRAFT) for th2/WB covering 2026-09-02; line for r2 added (draft valuation = 899 contract rate)"
          setup_api_calls:
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscription-plans"
              payload: { code: "ALIST_BASIC", tier: "BASIC", monthly_fee_cents: 1999, weekly_reservation_quota: 3, max_rollover_credits: 2, premium_format_allowed: false, max_future_reservations: 5, loyalty_points_multiplier_pct: 100, concession_discount_pct: 0 }
              as: ProgramAdmin
              captures: { plan2: $.data.id }
            - call: "POST /cinemas/subscription-plans/${plan2}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/members"
              payload: { email: "m2@x.com", full_name: "M Two" }
              as: MemberServices
              captures: { m2: $.data.id }
            - call: "POST /cinemas/members/${m2}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/theaters"
              payload: { name: "T2", timezone: "America/Chicago" }
              as: ProgramAdmin
              captures: { th2: $.data.id }
            - call: "POST /cinemas/theaters/${th2}/auditoriums"
              payload: { label: "Aud 1", seat_count: 10, supported_formats: ["STANDARD"] }
              as: ProgramAdmin
              captures: { aud2: $.data.id }
            - call: "POST /cinemas/showtimes"
              payload: { auditorium_id: "${aud2}", film_title: "Film B", studio_code: "WB", format: "STANDARD", starts_at: "2026-09-02T19:00:00Z", runtime_minutes: 120, base_price_cents: 1200, premium_surcharge_cents: 0, opening_weekend: false }
              as: ProgramAdmin
              captures: { st2: $.data.id, st2_v: $.data.version }
            - call: "POST /cinemas/showtimes/${st2}/open_sales"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/members/${m2}/subscriptions"
              payload: { plan_id: "${plan2}" }
              as: MemberServices
              captures: { s2: $.data.id }
            - call: "POST /cinemas/reservations"
              payload: { subscription_id: "${s2}", showtime_id: "${st2}", expected_showtime_version: "${st2_v}" }
              as: Member
              as_user_id: "${m2}"
              captures: { r2: $.data.id }
            - call: "POST /cinemas/reservations/${r2}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m2}"
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T19:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/reservations/${r2}/check_in"
              payload: {}
              as: TheaterStaff
            - call: "POST /cinemas/theaters/${th2}/settlement-reports"
              payload: { studio_code: "WB", period_start: "2026-09-02T00:00:00Z", period_end: "2026-09-03T00:00:00Z" }
              as: TheaterStaff
              captures: { rep2: $.data.id }
            - call: "POST /cinemas/settlement-reports/${rep2}/lines"
              payload: { reservation_id: "${r2}" }
              as: TheaterStaff
              captures: { ln2: $.data.id, ln2_val: $.data.reported_value_cents }
          trigger:
            - call: "GET /cinemas/settlement-reports/${rep2}"
              payload: {}
              as: TheaterStaff
              captures: { draft_gross: $.data.total_gross_cents, draft_sub_adm: $.data.total_subscription_admissions }
            - call: "POST /cinemas/settlement-reports/${rep2}/submit"
              payload: {}
              as: TheaterStaff
            - call: "GET /cinemas/settlement-reports/${rep2}"
              payload: {}
              as: TheaterStaff
              captures: { final_gross: $.data.total_gross_cents }
          assert:
            - "line reported_value_cents == 899 (STUDIO_CONTRACT_RATE_CENTS, not the 1200 box-office price)"
            - "draft total_gross_cents == 899 and total_subscription_admissions == 1 (provisional variant, live recompute)"
            - "submitted total_gross_cents == 899 (finalized variant, frozen)"
            - "Reservation ${r2}.settlement_reported == true after submit"
            - "post-submit line-add attempt fails with ERR_INVALID_STATE (frozen line set)"

  # =====================================================================
  # Rule 2: combinatorial_formula — instances in DIFFERENT modes (a/b/c)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: displacement_cap_nested_min_max_opening_weekend
        grounds:
          - calculations.displacement_capacity_check
          - validations[priority=14]
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — auditorium.seat_count,
          seats_held_subscription, seats_held_paid, subscriber_displacement_cap_pct,
          and the opening_weekend flag gate the check through nested capacity and
          integer-scaled percentage comparisons; the formula only branches in when
          opening_weekend is true.
        test_recipe:
          setup:
            - "Clock 2026-09-04 (Friday); plan ALIST_PREMIER quota=3 PUBLISHED; members m3a, m3b, m3c, m3d ACTIVE each with own subscription"
            - "Theater th3 with 10-seat auditorium; DOLBY opening-weekend showtime st3 at 2026-09-05T20:00:00Z, displacement cap 40 pct, ON_SALE"
            - "Exactly 3 subscription reservations already held on st3 (seats_held_subscription == 3)"
          setup_api_calls:
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscription-plans"
              payload: { code: "ALIST_PREMIER", tier: "PREMIER", monthly_fee_cents: 2999, weekly_reservation_quota: 3, max_rollover_credits: 2, premium_format_allowed: true, max_future_reservations: 6, loyalty_points_multiplier_pct: 150, concession_discount_pct: 15 }
              as: ProgramAdmin
              captures: { plan3: $.data.id }
            - call: "POST /cinemas/subscription-plans/${plan3}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/theaters"
              payload: { name: "T3", timezone: "America/New_York" }
              as: ProgramAdmin
              captures: { th3: $.data.id }
            - call: "POST /cinemas/theaters/${th3}/auditoriums"
              payload: { label: "Aud 1", seat_count: 10, supported_formats: ["STANDARD", "DOLBY"] }
              as: ProgramAdmin
              captures: { aud3: $.data.id }
            - call: "POST /cinemas/showtimes"
              payload: { auditorium_id: "${aud3}", film_title: "Blockbuster", studio_code: "DIS", format: "DOLBY", starts_at: "2026-09-05T20:00:00Z", runtime_minutes: 120, base_price_cents: 1400, premium_surcharge_cents: 400, opening_weekend: true, subscriber_displacement_cap_pct: 40 }
              as: ProgramAdmin
              captures: { st3: $.data.id, st3_v: $.data.version }
            - call: "POST /cinemas/showtimes/${st3}/open_sales"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/members"
              payload: { email: "m3a@x.com", full_name: "M3 A" }
              as: MemberServices
              captures: { m3a: $.data.id }
            - call: "POST /cinemas/members/${m3a}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/members/${m3a}/subscriptions"
              payload: { plan_id: "${plan3}" }
              as: MemberServices
              captures: { s3a: $.data.id }
            - call: "POST /cinemas/reservations"
              payload: { subscription_id: "${s3a}", showtime_id: "${st3}", expected_showtime_version: "${st3_v}" }
              as: Member
              as_user_id: "${m3a}"
              captures: { r3a: $.data.id }
            - call: "POST /cinemas/members"
              payload: { email: "m3b@x.com", full_name: "M3 B" }
              as: MemberServices
              captures: { m3b: $.data.id }
            - call: "POST /cinemas/members/${m3b}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/members/${m3b}/subscriptions"
              payload: { plan_id: "${plan3}" }
              as: MemberServices
              captures: { s3b: $.data.id }
            - call: "GET /cinemas/showtimes/${st3}"
              payload: {}
              as: ProgramAdmin
              captures: { st3_v2: $.data.version }
            - call: "POST /cinemas/reservations"
              payload: { subscription_id: "${s3b}", showtime_id: "${st3}", expected_showtime_version: "${st3_v2}" }
              as: Member
              as_user_id: "${m3b}"
              captures: { r3b: $.data.id }
            - call: "POST /cinemas/members"
              payload: { email: "m3c@x.com", full_name: "M3 C" }
              as: MemberServices
              captures: { m3c: $.data.id }
            - call: "POST /cinemas/members/${m3c}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/members/${m3c}/subscriptions"
              payload: { plan_id: "${plan3}" }
              as: MemberServices
              captures: { s3c: $.data.id }
            - call: "GET /cinemas/showtimes/${st3}"
              payload: {}
              as: ProgramAdmin
              captures: { st3_v3: $.data.version }
            - call: "POST /cinemas/reservations"
              payload: { subscription_id: "${s3c}", showtime_id: "${st3}", expected_showtime_version: "${st3_v3}" }
              as: Member
              as_user_id: "${m3c}"
              captures: { r3c: $.data.id }
            - call: "POST /cinemas/members"
              payload: { email: "m3d@x.com", full_name: "M3 D" }
              as: MemberServices
              captures: { m3d: $.data.id }
            - call: "POST /cinemas/members/${m3d}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/members/${m3d}/subscriptions"
              payload: { plan_id: "${plan3}" }
              as: MemberServices
              captures: { s3d: $.data.id }
            - call: "GET /cinemas/showtimes/${st3}"
              payload: {}
              as: ProgramAdmin
              captures: { st3_v4: $.data.version }
          trigger:
            - call: "POST /cinemas/reservations"
              payload: { subscription_id: "${s3d}", showtime_id: "${st3}", expected_showtime_version: "${st3_v4}" }
              as: Member
              as_user_id: "${m3d}"
              captures: { r3d: $.data.id }
            - call: "GET /cinemas/showtimes/${st3}"
              payload: {}
              as: ProgramAdmin
              captures: { st3_v5: $.data.version, held_sub_after: $.data.seats_held_subscription }
            - call: "POST /cinemas/reservations"
              payload: { subscription_id: "${s3d}", showtime_id: "${st3}", expected_showtime_version: "${st3_v5}" }
              as: Member
              as_user_id: "${m3d}"
              captures: { err_id: $.data.error_id }
          assert:
            - "4th reservation succeeds: (3+1)*100 = 400 <= 40*10 = 400 boundary is inclusive"
            - "Showtime.seats_held_subscription == 4 after the 4th reservation"
            - "5th subscription reservation fails with ERR_CAPACITY_EXCEEDED: (4+1)*100 = 500 > 400"
            - "seats_available == 6 remains physically open — the cap, not the house, blocks subscribers (paid buyers could still book)"

      - name: concession_discount_floor_then_subtract_then_points
        grounds:
          - calculations.concession_discount
          - calculations.loyalty_points_earn
        distinguishing_aspect: |
          Mode (b): nested rounding order — discount is floored BEFORE subtraction
          (floor(999*15/100)=149, charged=850) and points are computed by flooring
          charged_cents/100 * 20 then flooring the 150 pct multiplier; computing in
          the other order (floor(999*0.85)=849, or rounding points per-stage) yields
          different integers.
        test_recipe:
          setup:
            - "Clock 2026-09-01; ALIST_PREMIER plan (discount 15 pct, multiplier 150) PUBLISHED"
            - "Member m4 ACTIVE with ACTIVE subscription s4 on ALIST_PREMIER"
            - "Theater th4 exists"
          setup_api_calls:
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscription-plans"
              payload: { code: "ALIST_PREMIER", tier: "PREMIER", monthly_fee_cents: 2999, weekly_reservation_quota: 3, max_rollover_credits: 2, premium_format_allowed: true, max_future_reservations: 6, loyalty_points_multiplier_pct: 150, concession_discount_pct: 15 }
              as: ProgramAdmin
              captures: { plan4: $.data.id }
            - call: "POST /cinemas/subscription-plans/${plan4}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/theaters"
              payload: { name: "T4", timezone: "America/Denver" }
              as: ProgramAdmin
              captures: { th4: $.data.id }
            - call: "POST /cinemas/members"
              payload: { email: "m4@x.com", full_name: "M Four" }
              as: MemberServices
              captures: { m4: $.data.id }
            - call: "POST /cinemas/members/${m4}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/members/${m4}/subscriptions"
              payload: { plan_id: "${plan4}" }
              as: MemberServices
              captures: { s4: $.data.id }
          trigger:
            - call: "POST /cinemas/concession-purchases"
              payload: { member_id: "${m4}", theater_id: "${th4}", pre_discount_cents: 999 }
              as: Member
              as_user_id: "${m4}"
              captures: { disc: $.data.discount_cents, charged: $.data.charged_cents, pts: $.data.points_earned }
            - call: "GET /cinemas/members/${m4}"
              payload: {}
              as: MemberServices
              captures: { bal: $.data.loyalty_points_balance }
          assert:
            - "discount_cents == 149 (floor(999*15/100)), NOT 150 (round) and NOT 149 via floor(charged) reorderings"
            - "charged_cents == 850 (999 - 149)"
            - "points_earned == 240 (floor(850/100)*20 = 160 base; floor(160*150/100) = 240)"
            - "Member.loyalty_points_balance == 240"

      - name: loyalty_earn_pinned_evaluation_order_charged_then_base_then_multiplier
        grounds:
          - calculations.loyalty_points_earn
          - calculations.concession_discount
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — points
          derive from charged_cents, charged_cents derives from discount, discount
          derives from the plan tied to the member's ACTIVE subscription, and the
          multiplier comes from the same plan; changing the order (points on
          pre_discount, or multiplier on pre-discount base) yields 250/300 instead
          of 225.
        test_recipe:
          setup:
            - "Clock 2026-09-01; ALIST_PLUS plan (discount 10 pct, multiplier 125) PUBLISHED"
            - "Member m5 ACTIVE with ACTIVE subscription s5 on ALIST_PLUS; theater th5"
          setup_api_calls:
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscription-plans"
              payload: { code: "ALIST_PLUS", tier: "PLUS", monthly_fee_cents: 2499, weekly_reservation_quota: 3, max_rollover_credits: 2, premium_format_allowed: true, max_future_reservations: 5, loyalty_points_multiplier_pct: 125, concession_discount_pct: 10 }
              as: ProgramAdmin
              captures: { plan5: $.data.id }
            - call: "POST /cinemas/subscription-plans/${plan5}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /cinemas/theaters"
              payload: { name: "T5", timezone: "America/Phoenix" }
              as: ProgramAdmin
              captures: { th5: $.data.id }
            - call: "POST /cinemas/members"
              payload: { email: "m5@x.com", full_name: "M Five" }
              as: MemberServices
              captures: { m5: $.data.id }
            - call: "POST /cinemas/members/${m5}/activate"
              payload: {}
              as: MemberServices
            - call: "POST /cinemas/members/${m5}/subscriptions"
              payload: { plan_id: "${plan5}" }
              as: MemberServices
              captures: { s5: $.data.id }
          trigger:
            - call: "POST /cinemas/concession-purchases"
              payload: { member_id: "${m5}", theater_id: "${th5}", pre_discount_cents: 1000 }
              as: Member
              as_user_id: "${m5}"
              captures: { disc5: $.data.discount_cents, charged5: $.data.charged_cents, pts5: $.data.points_earned }
          assert:
            - "discount_cents == 100"
            - "charged_cents == 900"
            - "points_earned == 225 (floor(900/100)*20 = 180 base; floor(180*125/100) = 225) — NOT 250 (multiplier on pre-discount base 200*1.25) and NOT 240 (points on charged without multiplier error paths)"

  # =====================================================================
  # Rule 3: non_linear_state_machine — different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_pause_resume_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
        distinguishing_aspect: |
          Entity: Subscription — cyclic ACTIVE -> PAUSED -> ACTIVE across cycle
          boundaries (one pause per billing cycle; the cycle rollover resets
          pause_count_in_cycle, permitting a later second pause, so the loop can
          close more than once over the subscription's life).
        test_recipe:
          setup:
            - "Clock 2026-09-01; plan ALIST_BASIC PUBLISHED; member m6 ACTIVE with subscription s6"
            - "s6 paused for 7 days on 2026-09-02; clock advanced to 2026-09-09 (auto-resume fires); clock advanced to 2026-10-01 (new billing cycle resets pause_count_in_cycle)"
          setup_api_calls:
            - call: "POST /cinemas/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /cinemas/subscription-plans"
