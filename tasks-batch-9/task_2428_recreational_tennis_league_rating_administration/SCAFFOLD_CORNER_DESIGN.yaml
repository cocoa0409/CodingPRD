      - name: two_light_strikes_summing_to_exactly_three_suspend_the_player_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.strike_weight_ledger
          - endpoints.POST /tennis/strikes
        distinguishing_aspect: "The threshold is a weighted cumulative sum with an inclusive comparison, so it can be reached without any single strike being heavy: an INELIGIBLE_LINEUP of weight 2 leaves the player ACTIVE at 2, and a NO_SHOW_DEFAULT of weight 1 lands exactly on strike_limit 3 and fires the suspension. Counting strike rows instead of weights would suspend at the second row for the wrong reason and would miss the case where one weight-3 row suspends alone, and the spot's source_strike_id must name the strike that crossed the line, not the first one filed."
