    code: 200
    input: ["limit?", "offset?", "faculty_id?", "obligation_id?", "status?"]
    output: "RepaymentObligation[]"
    side_effects: []
  - method: GET
    path: "/repayment-obligations/{id}"
    description: "Get one repayment"
    roles: [Faculty, CommitteeMember, DepartmentChair, ProvostOffice, LeaveAdministrator]
    code: 200
    input: []
    output: RepaymentObligation
    side_effects: []
  - method: GET
    path: "/repayment-obligations/{id}/payments"
    description: "List payments of a repayment (reverse reachability)"
    roles: [Faculty, CommitteeMember, DepartmentChair, ProvostOffice, LeaveAdministrator]
    code: 200
    input: ["limit?", "offset?"]
    output: "RepaymentPayment[]"
    side_effects: []
  - method: POST
    path: "/repayment-obligations/{id}/payments"
    description: "Record a payment (partial allowed); OCC-guarded on the repayment version"
    roles: [LeaveAdministrator]
    code: 201
    input: ["amount", "expected_repayment_version"]
    output: RepaymentPayment
    side_effects: ["amount_outstanding -= amount; SETTLED at 0; increments RepaymentObligation.version by 1"]
  - method: POST
    path: "/repayment-obligations/{id}/waive"
    description: "Waive the outstanding balance (e.g., medical separation)"
    roles: [ProvostOffice]
    code: 200
    input: ["comments?"]
    output: RepaymentObligation
    side_effects: ["status -> WAIVED; amount_outstanding := 0; increments RepaymentObligation.version by 1"]

  # --- AccomplishmentReport ---
  - method: GET
    path: "/accomplishment-reports"
    description: "List reports"
    roles: [Faculty, CommitteeMember, DepartmentChair, ProvostOffice, LeaveAdministrator]
    code: 200
    input: ["limit?", "offset?", "faculty_id?", "grant_id?", "status?"]
    output: "AccomplishmentReport[]"
    side_effects: []
  - method: GET
    path: "/accomplishment-reports/{id}"
    description: "Get one report"
    roles: [Faculty, CommitteeMember, DepartmentChair, ProvostOffice, LeaveAdministrator]
    code: 200
    input: []
    output: AccomplishmentReport
    side_effects: []
  - method: POST
    path: "/accomplishment-reports/{id}/submit"
    description: "Submit report text from DUE / OVERDUE / REVISION_REQUIRED"
    roles: [Faculty]
    code: 200
    input: ["report_text"]
    output: AccomplishmentReport
    side_effects: ["submitted_late set iff submitted while OVERDUE; increments AccomplishmentReport.version by 1"]
  - method: POST
    path: "/accomplishment-reports/{id}/review"
    description: "ProvostOffice accepts or rejects a SUBMITTED report"
    roles: [ProvostOffice]
    code: 200
    input: ["decision", "comments?"]
    output: AccomplishmentReport
    side_effects: ["ACCEPTED -> ACCEPTED; REJECTED -> REVISION_REQUIRED; increments AccomplishmentReport.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing/unknown" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, enum out of range, numeric domain violation, cycle_id present/absent against leave_type rule, ADJUST-only entry_type violated" }
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit outside 1..100 or offset < 0 on list endpoints" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Faculty/CommitteeMember acting on a resource owned by another user" }
  - { id: ERR_CHAIR_DEPARTMENT_MISMATCH, http: 403, condition: "DepartmentChair acting on a plan outside their chaired department" }
  - { id: ERR_REVIEWER_CONFLICT, http: 403, condition: "Reviewer is the applicant or shares the applicant's department" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Plan creator is the applicant (chair may not file coverage for their own application)" }
  - { id: ERR_DEPARTMENT_NOT_FOUND, http: 404, condition: "Department id does not exist" }
  - { id: ERR_FACULTY_NOT_FOUND, http: 404, condition: "FacultyMember id does not exist" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "LeaveCycle id does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "LeaveApplication id does not exist" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "CommitteeReview id does not exist" }
  - { id: ERR_COVERAGE_PLAN_NOT_FOUND, http: 404, condition: "CoveragePlan id does not exist" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "LeaveGrant id does not exist" }
  - { id: ERR_FELLOWSHIP_NOT_FOUND, http: 404, condition: "ExternalFellowship id does not exist" }
  - { id: ERR_OBLIGATION_NOT_FOUND, http: 404, condition: "ServiceObligation id does not exist" }
  - { id: ERR_REPAYMENT_NOT_FOUND, http: 404, condition: "RepaymentObligation id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "AccomplishmentReport id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_CYCLE_STATE, http: 409, condition: "Cycle transition invalid for current cycle status" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Application submit requires the cycle to be OPEN" }
  - { id: ERR_CYCLE_NOT_CLOSED, http: 409, condition: "allocate requires the cycle to be CLOSED" }
  - { id: ERR_CYCLE_NOT_ALLOCATED, http: 409, condition: "finalize requires the cycle to be ALLOCATED" }
  - { id: ERR_INVALID_APPLICATION_STATE, http: 409, condition: "Application transition invalid for current status (incl. withdraw after AWARDED, review creation outside UNDER_REVIEW)" }
  - { id: ERR_SABBATICAL_REQUIRES_ALLOCATION, http: 409, condition: "decide invoked on a SABBATICAL application; sabbaticals are decided only by allocation" }
  - { id: ERR_INVALID_FACULTY_STATE, http: 409, condition: "Faculty status incompatible with the operation (e.g., activate for a SEPARATED or ON_LEAVE faculty, separate twice)" }
  - { id: ERR_INVALID_REVIEW_STATE, http: 409, condition: "Review submit requires DRAFT" }
  - { id: ERR_INVALID_PLAN_STATE, http: 409, condition: "CoveragePlan transition invalid for current status" }
  - { id: ERR_INVALID_GRANT_STATE, http: 409, condition: "Grant transition invalid for current status" }
  - { id: ERR_INVALID_FELLOWSHIP_STATE, http: 409, condition: "Fellowship transition invalid for current status" }
  - { id: ERR_INVALID_REPAYMENT_STATE, http: 409, condition: "Payment/waive on a terminal (SETTLED/WAIVED) repayment" }
  - { id: ERR_INVALID_REPORT_STATE, http: 409, condition: "Report transition invalid for current status" }
  - { id: ERR_OVERDUE_REPORT_BLOCKS, http: 409, condition: "Faculty has an AccomplishmentReport with status == OVERDUE; new application submissions blocked" }
  - { id: ERR_DEFAULTED_REPAYMENT_BLOCKS, http: 409, condition: "Faculty has a RepaymentObligation with status == DEFAULTED; new application submissions blocked" }
  - { id: ERR_DUPLICATE_ACTIVE_APPLICATION, http: 409, condition: "Faculty already has a DIFFERENT application with status IN {DRAFT, UNDER_REVIEW, REVISION_REQUESTED}" }
  - { id: ERR_DUPLICATE_REVIEW, http: 409, condition: "Reviewer already has a review (any status) for this application" }
  - { id: ERR_INSUFFICIENT_SERVICE_MONTHS, http: 422, condition: "Sabbatical submit requires lifetime_service_months >= 72 (certified)" }
  - { id: ERR_INVALID_DURATION_SALARY_COMBO, http: 422, condition: "(requested_duration_semesters, requested_salary_pct) not in the allowed tier set for the leave type" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "end <= start; window != semesters*6 calendar months; complete before end_date; curtail date outside the window" }
  - { id: ERR_LEAVE_WINDOW_OVERLAP, http: 409, condition: "Proposed/activated window overlaps an ACTIVE grant of the same faculty (half-open intervals; adjacency allowed)" }
  - { id: ERR_FELLOWSHIP_OVERLAP_INSUFFICIENT, http: 422, condition: "Fellowship window overlaps less than 50% of the leave window's days" }
  - { id: ERR_GRANT_START_NOT_REACHED, http: 409, condition: "activate before grant.start_date" }
  - { id: ERR_DEPARTMENT_LEAVE_CAPACITY, http: 409, condition: "Some day of the window already has >= 2 ACTIVE grants in the department" }
  - { id: ERR_INSUFFICIENT_SABBATICAL_CREDITS, http: 402, condition: "credit_balance < 36 * requested_duration_semesters at submit (or at allocation re-check)" }
  - { id: ERR_DEPARTMENT_FROZEN, http: 409, condition: "Department posture == FROZEN at plan submit or approve" }
  - { id: ERR_INSUFFICIENT_COVERAGE_BUDGET, http: 402, condition: "available_amount < plan provisional_cost at approve" }
  - { id: ERR_PAYMENT_EXCEEDS_OUTSTANDING, http: 422, condition: "Payment amount > amount_outstanding" }
  - { id: ERR_POOL_BELOW_COMMITMENTS, http: 422, condition: "PATCH replacement_pool below reserved_amount + spent_amount" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Faculty
    description: "A faculty member acting on their own leave lifecycle"
    identity: "entity_backed:FacultyMember"
    exclusive_operations:
      - "POST /leave-applications — create own application"
      - "POST /leave-applications/{id}/submit — submit/resubmit own application"
      - "POST /leave-applications/{id}/withdraw — withdraw own application"
      - "POST /external-fellowships — report own fellowship"
      - "POST /external-fellowships/{id}/decline — decline own fellowship"
      - "POST /accomplishment-reports/{id}/submit — submit own report"
    shared_operations:
      - "GET endpoints — all roles may read"
  - name: CommitteeMember
    description: "Faculty serving on the sabbatical review committee; may never review own or same-department applications"
    identity: "entity_backed:FacultyMember"
    exclusive_operations:
      - "POST /committee-reviews — author a review"
      - "POST /committee-reviews/{id}/submit — submit own review"
    shared_operations:
      - "GET endpoints — all roles may read"
  - name: DepartmentChair
    description: "Chair of a department (Department.chair_faculty_id); files and submits coverage plans for their department's applicants"
    identity: "entity_backed:FacultyMember"
    exclusive_operations:
      - "POST /coverage-plans — draft coverage plan (own department only; never for own application)"
      - "POST /coverage-plans/{id}/submit — submit plan (own department)"
    shared_operations:
      - "GET endpoints — all roles may read"
  - name: ProvostOffice
    description: "Provost's office: cycle operations, allocation, non-sabbatical decisions, plan approval, report review, repayment waivers"
    identity: "opaque"
    exclusive_operations:
      - "POST /leave-cycles and /open, /close, /allocate, /finalize"
      - "POST /leave-applications/{id}/request-revision and /decide"
      - "POST /coverage-plans/{id}/approve and /request-revision (may also create/submit plans)"
      - "POST /accomplishment-reports/{id}/review"
      - "POST /repayment-obligations/{id}/waive"
    shared_operations:
      - "GET endpoints — all roles may read"
  - name: LeaveAdministrator
    description: "Academic-affairs leave administrator: org setup, accrual runs, grant activation/completion/curtailment, fellowship verification, payments, separation, logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /departments, PATCH /departments/{id}"
      - "POST /faculty-members, POST /faculty-members/{id}/separate"
      - "POST /accrual-runs, POST /accrual-ledger-entries"
      - "POST /leave-grants/{id}/activate, /complete, /curtail"
      - "POST /external-fellowships/{id}/verify"
      - "POST /repayment-obligations/{id}/payments"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints — all roles may read"
