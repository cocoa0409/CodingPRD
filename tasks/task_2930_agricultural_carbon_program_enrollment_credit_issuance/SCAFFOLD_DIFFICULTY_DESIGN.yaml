            - "Enrollment E12 on F12: screened ACCEPT with its own APPROVED HISTORICAL_DATA baseline B12, so E12 is ACTIVE."
            - "E11 has one PASSED EQUIPMENT_TELEMETRY packet for 2026 (1000.00 acres, coverage 92.00, measured 0.3000); E12 has none."
