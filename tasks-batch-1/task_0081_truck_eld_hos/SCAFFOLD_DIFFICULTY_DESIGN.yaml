              as: Driver
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409 with data.error_id == ERR_VEHICLE_OUT_OF_SERVICE."
            - "ELDDevice.${dev_id}.status remains UNBOUND, bound_driver_id == null."
      - name: certify_blocked_by_open_event_on_closed_day
        grounds:
