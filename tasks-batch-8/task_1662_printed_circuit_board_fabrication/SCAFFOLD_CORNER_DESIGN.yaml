            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: true }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/spec-lines", payload: { layer_name: "L1", target_ohms: 50.0, tolerance_plus_ohms: 5.0, tolerance_minus_ohms: 5.0, line_type: "SINGLE_ENDED", coupon_required: true }, as: CAMOperator }
          trigger:
            - { call: "GET /pcb/fab-orders/${ord}", payload: {}, as: CAMOperator, captures: { price_before: $.data.provisional_total_cents } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "GET /pcb/fab-orders/${ord}", payload: {}, as: CAMOperator, captures: { price_after: $.data.provisional_total_cents } }
          assert:
            - "before lock: provisional_total_cents == 65748"
            - "after lock: provisional_total_cents == 68248 (recomputed with 1 impedance line, +2500)"

  # =========================================================================
  # Section: consistency_model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_release
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: the release response body already shows fab_status RELEASED, and a follow-up GET reflects the same state plus the lane commitment."
        test_recipe:
          setup: ["QUICK_TURN order fully prepared (array released, drill approved, 34 panels reserved)"]
          setup_api_calls:
            - { call: "POST /pcb/quick-turn-lanes", payload: { lane_code: "QT3", turn_days: 3, capacity_boards_per_day: 500, premium_multiplier: 1.50, active: true }, as: FabAdmin, captures: { lane: $.data.id } }
            - { call: "POST /pcb/customers", payload: { company_name: "Imm Co", contact_email: "imm@co.example", credit_limit_cents: 100000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "QUICK_TURN", quick_turn_lane_id: "${lane}", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${ord}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/fab-orders/${ord}/drill-programs", payload: { revision: 1, min_hole_mils: 8, hole_count: 1200 }, as: CAMOperator, as_user_id: "cam_1", captures: { drl: $.data.id } }
            - { call: "POST /pcb/drill-programs/${drl}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/drill-programs/${drl}/approve", payload: {}, as: ProcessEngineer, as_user_id: "eng_1" }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-IM1", manufacture_date: "2025-09-01T00:00:00Z", panels_total: 100 }, as: ProcessEngineer, captures: { lot: $.data.id } }
            - { call: "POST /pcb/laminate-lots/${lot}/qualify", payload: {}, as: QualityInspector, captures: { lot_v: $.data.version } }
            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "${lot}", panels_allocated: 34, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner }
          trigger:
            - { call: "POST /pcb/fab-orders/${ord}/release", payload: {}, as: ProductionPlanner, captures: { rel_s: $.data.fab_status } }
            - { call: "GET /pcb/fab-orders/${ord}", payload: {}, as: ProductionPlanner, captures: { get_s: $.data.fab_status } }
            - { call: "GET /pcb/quick-turn-lanes/${lane}/slots", payload: { ship_date: "2026-08-10" }, as: ProductionPlanner, captures: { committed: "$.data[0].committed_boards" } }
          assert:
            - "release response body fab_status == RELEASED (same-request visibility)"
            - "follow-up GET agrees: fab_status == RELEASED"
            - "lane slot for 2026-08-10 shows committed_boards == 100 in the same read path"

  # =========================================================================
  # Exclusion stubs — corners already covered by §1.8 difficulty instances
  # =========================================================================
  - section: state_machines
    instances:
      - name: corner_cancel_cascade_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.FabOrder.RELEASED_to_CANCELLED
        excluded_because:
          difficulty_instance: cancel_released_order_cascade_depth3
          rationale: "The full cancel cascade (array, reservation, lot, lane) is asserted end-to-end by the named §1.8 instance."
      - name: corner_coupon_retest_loop
        claim_type: valid_transition
        grounds:
          - state_machines.ImpedanceCoupon.FAILED_to_AWAITING_MEASURE
        excluded_because:
          difficulty_instance: coupon_retest_cycle
          rationale: "The FAILED -> AWAITING_MEASURE -> PASSED loop and retest_count accounting are asserted by the named §1.8 instance."
      - name: corner_final_fail_order_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.FabOrder.PENDING_to_FAILED
        excluded_because:
          difficulty_instance: coupon_final_fail_cascade
          rationale: "Final-fail cascade (disposition, auto DefectRecord, boards_scrapped) is asserted by the named §1.8 instance."
      - name: corner_lot_expiry_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.LaminateLot.QUALIFIED_to_EXPIRED
        excluded_because:
          difficulty_instance: clock_expiry_cascade
          rationale: "Expiry-triggered reservation release and order auto-hold are asserted by the named §1.8 instance."
      - name: corner_parallel_dimensions
        claim_type: valid_transition
        grounds:
          - state_machines.FabOrder.quality_disposition
        excluded_because:
          difficulty_instance: order_parallel_status_dimensions
          rationale: "Independent quality_disposition evolution under a fixed fab_status is asserted by the named §1.8 instance."
      - name: corner_drill_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.DrillProgram.REJECTED_to_DRAFT
        excluded_because:
          difficulty_instance: drill_program_revision_cycle
          rationale: "The DRAFT->UNDER_REVIEW->REJECTED->DRAFT->APPROVED cycle is asserted by the named §1.8 instance."
  - section: calculations
    instances:
      - name: corner_provisional_final_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.order_pricing
        excluded_because:
          difficulty_instance: provisional_vs_final_pricing_diverge
          rationale: "Both pricing variants and their delta are asserted by the named §1.8 instance."
      - name: corner_impedance_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.impedance_disposition
        excluded_because:
          difficulty_instance: single_vs_statistical_coupon_disposition
          rationale: "SINGLE vs STATISTICAL divergence on identical readings is asserted by the named §1.8 instance."
      - name: corner_yield_floor_branch
        claim_type: boundary_edge
        grounds:
          - calculations.panel_array_yield
        excluded_because:
          difficulty_instance: array_yield_floor_ceil_interaction
          rationale: "Both the main branch and the ARRAY_YIELD_FLOOR clamp branch are asserted by the named §1.8 instance."
      - name: corner_rounding_order
        claim_type: precision
        grounds:
          - calculations.order_pricing
        excluded_because:
          difficulty_instance: per_line_rounding_order_pinned
          rationale: "The pinned per-line-then-sum rounding order is asserted against the sum-then-round alternative by the named §1.8 instance."
      - name: corner_lane_capacity_boundary
        claim_type: boundary_edge
        grounds:
          - calculations.lane_capacity_commitment
        excluded_because:
          difficulty_instance: lane_capacity_exact_fit
          rationale: "The inclusive capacity boundary (500 == 500 passes, 501 fails) is asserted by the named §1.8 instance."
      - name: corner_aspect_ratio_boundary
        claim_type: boundary_edge
        grounds:
          - calculations.aspect_ratio_check
        excluded_because:
          difficulty_instance: aspect_ratio_exact_limit
          rationale: "The inclusive 8.0 ceiling (pass) and 8.857 (fail) are asserted by the named §1.8 instance."
  - section: validations
    instances:
      - name: corner_release_state_priority
        claim_type: priority_ordering
        grounds:
          - "validations[priority=7]"
        excluded_because:
          difficulty_instance: release_state_beats_insufficient_laminate
          rationale: "State-beats-fiscal priority is asserted by the named §1.8 instance."
      - name: corner_reservation_temporal_priority
        claim_type: priority_ordering
        grounds:
          - "validations[priority=22]"
        excluded_because:
          difficulty_instance: reservation_temporal_beats_insufficient_panels
          rationale: "Temporal-beats-fiscal priority is asserted by the named §1.8 instance."
      - name: corner_drill_gate_on_release
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_DRILL_NOT_APPROVED]"
        excluded_because:
          difficulty_instance: release_requires_drill_approved
          rationale: "ERR_DRILL_NOT_APPROVED is triggered and then cleared by the named §1.8 instance."
      - name: corner_coupon_gate_on_complete_fab
        claim_type: violation_to_error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_COUPON_NOT_PASSED]"
        excluded_because:
          difficulty_instance: complete_fab_requires_coupons_passed
          rationale: "ERR_COUPON_NOT_PASSED is triggered by the named §1.8 instance."
      - name: corner_lab_buffer_conflict
        claim_type: violation_to_error
        grounds:
          - "validations[priority=24]"
          - "errors[ERR_LAB_SLOT_CONFLICT]"
        excluded_because:
          difficulty_instance: lab_slot_buffer_gap
          rationale: "The 15-minute buffer boundary (15 passes, 14 conflicts) is asserted by the named §1.8 instance."
      - name: corner_lane_capacity_error
        claim_type: violation_to_error
        grounds:
          - "validations[priority=33]"
          - "errors[ERR_LANE_CAPACITY_EXCEEDED]"
        excluded_because:
          difficulty_instance: lane_day_aggregate_capacity
          rationale: "ERR_LANE_CAPACITY_EXCEEDED and per-day aggregate semantics are asserted by the named §1.8 instance."
      - name: corner_insufficient_laminate_error
        claim_type: violation_to_error
        grounds:
          - "validations[priority=32]"
          - "errors[ERR_INSUFFICIENT_LAMINATE]"
        excluded_because:
          difficulty_instance: reservation_temporal_beats_insufficient_panels
          rationale: "The insufficient-panels violation is present in the named §1.8 instance's dual-failure setup (masked by the higher-priority temporal error)."
      - name: corner_expiry_before_ship_error
        claim_type: violation_to_error
        grounds:
          - "validations[priority=22]"
          - "errors[ERR_LOT_EXPIRES_BEFORE_SHIP]"
        excluded_because:
          difficulty_instance: reservation_temporal_beats_insufficient_panels
          rationale: "ERR_LOT_EXPIRES_BEFORE_SHIP is the asserted winning error of the named §1.8 instance."
  - section: cross_cutting_layers
    instances:
      - name: corner_cancel_cascade_layer
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: cancel_released_order_cascade_depth3
          rationale: "N-level cascade ordering is asserted end-to-end by the named §1.8 instance."
      - name: corner_dual_variant_layer
        claim_type: variant_divergence
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: provisional_vs_final_pricing_diverge
          rationale: "The dual-variant layer is exercised by the named §1.8 instance (and its coupon-domain sibling)."
