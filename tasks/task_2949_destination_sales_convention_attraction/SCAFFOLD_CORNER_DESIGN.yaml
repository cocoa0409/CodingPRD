          - calculations.citywide_block_readiness
          - global_constants.CUTOFF_ALIGNMENT_TOLERANCE_DAYS
        distinguishing_aspect: "Each hotel's cutoff is individually legal; only the collective spread fails. Adding Bayside at 400 rooms with a 45-day cutoff lifts coverage to 90.00 but pushes cutoff_alignment_spread_days to 15, so submit returns ERR_CUTOFF_MISALIGNED; re-doing that block at 31 days keeps coverage 90.00 with spread 1 and the submit succeeds."
        test_recipe:
          setup:
            - "the end state of submit_checks_support_letters_before_block_coverage: bid ${bid_id} APPROVED with MAYOR + CHAMBER letters, Harborview committed 500 at cutoff 30, coverage 50.00"
