  - rule_id: resource_temporal_overlap
    instances:
      - name: assignment_window_half_open_adjacency
        grounds:
          - validations[priority=16]
          - validations[priority=17]
          - entities.RepresentationAssignment.fields.window_start
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) on EnrolledAgent time — a window
          starting exactly at the previous window's end is ACCEPTED (touching
          endpoints), while one starting inside is rejected ERR_WINDOW_OVERLAP; the
          resource is the agent's calendar.
        test_recipe:
          setup:
            - "Office O1; preparer P1; clients C1, C2; FILED returns R1, R2 ([1040_SIMPLE]) each with STANDARD product"
            - "Notices N1, N2; claims CL1, CL2 scoped IN_SCOPE (both SCOPE_CONFIRMED); agent A1 (max_parallel 5)"
          setup_api_calls:
            - call: "POST /tax/offices"
