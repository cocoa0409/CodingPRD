    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: []
    output: MarketingSpend
    side_effects: []

  # --- Settlement ---
  - method: GET
    path: "/tours/{tourId}/shows/{showId}/settlement"
    description: "Get settlement for a show"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/shows/{showId}/settlement/submit"
    description: "Promoter submits settlement"
    roles: [Promoter]
    code: 200
    input: [box_office_gross_cents, taxes_cents, facility_fees_cents, promoter_expenses_cents]
    output: Settlement
    side_effects:
      - "status → SUBMITTED"
      - "artist_share_cents computed"
      - "variance_flag computed"

  - method: POST
    path: "/tours/{tourId}/shows/{showId}/settlement/verify"
    description: "Accountant verifies settlement"
    roles: [SettlementAccountant]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status → VERIFIED"]

  - method: POST
    path: "/tours/{tourId}/shows/{showId}/settlement/pay"
    description: "Accountant marks paid"
    roles: [SettlementAccountant]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "status → PAID"
      - "Show → SETTLED"
      - "tour.settled_* recomputed"

  # --- ComplianceHold ---
  - method: POST
    path: "/tours/{tourId}/compliance-holds"
    description: "Open a manual compliance hold"
    roles: [TourManager]
    code: 201
    input: [hold_kind, severity, "related_show_id?", reason]
    output: ComplianceHold
    side_effects: ["status=ACTIVE", "tour.posture recomputed"]

  - method: GET
    path: "/tours/{tourId}/compliance-holds"
    description: "List compliance holds"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: ["status?", "severity?", "limit?", "offset?"]
    output: "ComplianceHold[]"
    side_effects: []

  - method: GET
    path: "/tours/{tourId}/compliance-holds/{holdId}"
    description: "Get a compliance hold"
    roles: [TourManager, Promoter, VenueRep, SettlementAccountant]
    code: 200
    input: []
    output: ComplianceHold
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/compliance-holds/{holdId}/resolve"
    description: "Resolve a compliance hold"
    roles: [TourManager]
    code: 200
    input: []
    output: ComplianceHold
    side_effects: ["status → RESOLVED", "tour.posture recomputed"]

  # --- Flat FK reverse-reachability GETs (segment-anchoring single-resource
  #     GETs + filtered lists) so every §1.1 FK can be traversed from the
  #     parent.id without knowing the tour path ---
  - method: GET
