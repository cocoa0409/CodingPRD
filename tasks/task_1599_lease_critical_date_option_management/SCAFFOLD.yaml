scenario: |
  Lease Critical Date & Option Management (corporate real estate department): option
  type inventory (renewal/expansion/termination/ROFR) & notice windows, reminder
  cascade to asset manager & broker, market rate determination & arbitration
  provisions for fair market renewals, exercise notice delivery & acknowledgment,
  missed-option consequence analysis, holdover rent provisions, portfolio expiration
  laddering strategy, negotiation initiation timeline

domain_name: lease-critical-dates
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Portfolio
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Portfolio display name" }
      - { name: region, type: string, source: input, description: "Region code for reporting" }
      - { name: laddering_max_pct_per_year, type: integer, source: input, description: "Maximum share (percent, 0-100) of portfolio rentable_square_feet whose lease expiration may fall in any single calendar year; posture trips when exceeded" }
      - { name: total_active_square_feet, type: integer, source: computed, description: "Sum of Lease.rentable_square_feet across leases with status IN {ACTIVE, EXPIRING, HOLDOVER}" }
      - { name: posture, type: enum, source: computed, description: "LADDER_OK | LADDER_STRESSED — derived from expiration ladder exposure; see calculations.portfolio_expiration_ladder" }
      - { name: posture_year, type: integer, source: computed, description: "First calendar year in which the ladder cap is breached, else null" }

  - name: Lease
    parent: Portfolio
    common_fields: true
    fields:
      - { name: portfolio_id, type: string, source: system, description: "FK -> Portfolio.id; owning portfolio" }
      - { name: premises_label, type: string, source: input, description: "Human-readable premises label (building/floor/suite)" }
      - { name: rentable_square_feet, type: integer, source: input, description: "RSF covered by this lease; > 0" }
      - { name: base_rent_cents_per_rsf_year, type: integer, source: input, description: "Current annual base rent in cents per RSF; > 0" }
      - { name: commencement_date, type: datetime, source: input, description: "Lease commencement date (date-only, UTC midnight)" }
      - { name: expiration_date, type: datetime, source: input, description: "Natural lease expiration date (date-only, UTC midnight); must be strictly after commencement_date" }
      - { name: holdover_tier1_pct, type: integer, source: input, description: "Percent of then-current base rent charged during holdover tier 1 (days 1-90 of holdover); typical 150" }
      - { name: holdover_tier2_pct, type: integer, source: input, description: "Percent of then-current base rent charged during holdover tier 2 (day 91 onward); typical 200" }
      - { name: holdover_tier1_days, type: integer, source: input, description: "Length in days of holdover tier 1; default 90 if omitted" , default: 90 }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | EXPIRING | HOLDOVER | TERMINATED | EXPIRED | RENEWED" }
      - { name: holdover_entered_at, type: datetime, source: system, description: "Legal holdover start = expiration_date + 1 day at 00:00:00Z (backdated on entry regardless of when the sweep fires); null when not in HOLDOVER" }
      - { name: accrued_holdover_rent_cents, type: integer, source: computed, description: "Cumulative accrued holdover rent as of the logical clock; see calculations.holdover_rent_accrual" }
      - { name: active_amendment_id, type: string, source: system, description: "FK -> Amendment.id; the EXECUTED amendment that produced current commercial terms, null when no amendment has executed" }

  - name: Contact
    parent: Portfolio
    common_fields: true
    fields:
      - { name: portfolio_id, type: string, source: system, description: "FK -> Portfolio.id; owning portfolio" }
      - { name: full_name, type: string, source: input, description: "Contact full name" }
      - { name: email, type: string, source: input, description: "Notification email; unique within a portfolio" }
      - { name: contact_kind, type: enum, source: input, description: "ASSET_MANAGER | BROKER | LANDLORD_COUNSEL" }
      - { name: is_active, type: boolean, source: input, description: "Inactive contacts receive no new reminders", default: true }

  - name: Option
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; lease carrying this option" }
      - { name: option_type, type: enum, source: input, description: "RENEWAL | EXPANSION | TERMINATION | ROFR" }
      - { name: notice_window_open_date, type: datetime, source: input, description: "First date on which exercise notice may be delivered (date-only, UTC midnight); window opens INCLUSIVE" }
      - { name: notice_window_close_date, type: datetime, source: input, description: "Last date on which exercise notice may be delivered (date-only, UTC midnight); window closes INCLUSIVE; must be >= notice_window_open_date" }
      - { name: target_commencement_date, type: datetime, source: input, description: "For RENEWAL/EXPANSION: start date of the new term; for TERMINATION: early termination effective date; for ROFR: matching-offer response deadline" }
      - { name: extension_years, type: integer, source: input, description: "For RENEWAL: length of renewal term in years (1-10); for others, ignored and stored as null" }
      - { name: rate_determination, type: enum, source: input, description: "FIXED | FAIR_MARKET — how rent is set on exercise; only meaningful for RENEWAL and EXPANSION" }
      - { name: fixed_rent_cents_per_rsf_year, type: integer, source: input, description: "When rate_determination=FIXED, the renewal/expansion rent in cents per RSF-year; otherwise null" }
      - { name: exercise_fee_cents, type: integer, source: input, description: "Non-refundable fee payable on exercise of a TERMINATION option (0 for other types unless the lease provides)", default: 0 }
      - { name: missed_option_penalty_cents, type: integer, source: input, description: "Forfeited amount when this option lapses unexercised (deposit forfeiture or contractual penalty); default 0", default: 0 }
      - { name: status, type: enum, source: system, description: "AVAILABLE | WINDOW_OPEN | NOTICE_SENT | EXERCISED | IN_ARBITRATION | LAPSED | WITHDRAWN | SUPERSEDED" }
      - { name: exercised_at, type: datetime, source: system, description: "Timestamp of the acknowledgment that completed exercise; null until EXERCISED" }
      - { name: lapsed_at, type: datetime, source: system, description: "Timestamp at which the option lapsed; null until LAPSED" }
      - { name: determined_rent_cents_per_rsf_year, type: integer, source: system, description: "Final rent in cents per RSF-year determined for this option once EXERCISED; FIXED options copy fixed_rent_cents_per_rsf_year; FAIR_MARKET options copy the FINAL MarketRateAssessment.determined_rent" }

  - name: MarketRateAssessment
    parent: Option
    common_fields: true
    fields:
      - { name: option_id, type: string, source: system, description: "FK -> Option.id; option whose fair-market rent this assessment determines" }
      - { name: method, type: enum, source: input, description: "COMPARABLE_AVERAGE | PSF_REGRESSION — appraisal method used" }
      - { name: comparable_rents_cents, type: array, source: input, description: "For COMPARABLE_AVERAGE: 3 to 7 comparable annual rents in cents per RSF-year; for PSF_REGRESSION: null" }
      - { name: regression_base_cents, type: integer, source: input, description: "For PSF_REGRESSION: base cents per RSF-year before adjustments; else null" }
      - { name: regression_adjustments, type: array, source: input, description: "For PSF_REGRESSION: list of signed integer cent adjustments (floor premium, TI amortization, etc.) applied to regression_base_cents; may be empty; else null" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | DISPUTED | SUPERSEDED" }
      - { name: provisional_rent_cents, type: integer, source: computed, description: "Method result per calculations.fair_market_rent at submission time" }
      - { name: determined_rent_cents, type: integer, source: system, description: "Rent finally adopted (own provisional rent when finalized unchallenged; arbitration award midpoint when decided); null until FINAL" }

  - name: ArbitrationCase
    parent: MarketRateAssessment
    common_fields: true
    fields:
      - { name: assessment_id, type: string, source: system, description: "FK -> MarketRateAssessment.id; disputed assessment under arbitration" }
      - { name: landlord_rent_cents, type: integer, source: input, description: "Landlord's submitted annual rent in cents per RSF-year" }
      - { name: tenant_rent_cents, type: integer, source: input, description: "Tenant's submitted annual rent in cents per RSF-year" }
      - { name: submission_close_date, type: datetime, source: system, description: "Server-stamped date 30 calendar days after case creation; submissions freeze after this date" }
      - { name: status, type: enum, source: system, description: "OPEN | SUBMISSIONS_FROZEN | DECIDED" }
      - { name: award_rent_cents, type: integer, source: system, description: "Baseball-arbitration award: the party submission nearest to the panel guidance rent; tie resolves to the lower submission; null until DECIDED" }
      - { name: panel_guidance_rent_cents, type: integer, source: input, description: "Arbitrator guidance rent supplied at decision time" }

  - name: ExerciseNotice
    parent: Option
    common_fields: true
    fields:
      - { name: option_id, type: string, source: system, description: "FK -> Option.id; option being exercised" }
      - { name: delivery_method, type: enum, source: input, description: "CERTIFIED_MAIL | COURIER | PERSONAL_DELIVERY | EMAIL_IF_PERMITTED" }
      - { name: sent_at, type: datetime, source: system, description: "Server-stamped send timestamp" }
      - { name: delivered_at, type: datetime, source: system, description: "Server-stamped delivery timestamp" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Server-stamped acknowledgment timestamp" }
      - { name: status, type: enum, source: system, description: "SENT | DELIVERED | ACKNOWLEDGED | REJECTED | VOID" }
      - { name: rejection_reason, type: string, source: input, description: "Reason text when delivery is rejected; null otherwise" }

  - name: Reminder
    parent: Option
    common_fields: true
    fields:
      - { name: option_id, type: string, source: system, description: "FK -> Option.id; option whose notice window this reminder tracks" }
      - { name: contact_id, type: string, source: system, description: "FK -> Contact.id; recipient" }
      - { name: tier, type: enum, source: system, description: "T90 | T60 | T30 | T7 | T0 — days before notice_window_close_date at which this reminder is scheduled" }
      - { name: scheduled_for, type: datetime, source: system, description: "Shifted schedule timestamp per calculations.reminder_cascade_schedule" }
      - { name: status, type: enum, source: system, description: "PENDING | SENT | CANCELED" }
      - { name: sent_at, type: datetime, source: system, description: "Server-stamped time the reminder fired; null until SENT" }

  - name: Amendment
    parent: Lease
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; lease under negotiation" }
      - { name: supersedes_amendment_id, type: string, source: input, description: "FK -> Amendment.id; prior amendment on the same lease this one supersedes; null for the first amendment on the lease; self-referential chain head is null" }
      - { name: kind, type: enum, source: input, description: "RENEWAL_TERM | EXPANSION_TERM | CONTRACTION | HOLDOVER_SETTLEMENT" }
      - { name: new_expiration_date, type: datetime, source: input, description: "Proposed expiration date after this amendment executes; must be strictly after the lease's current expiration_date" }
      - { name: new_base_rent_cents_per_rsf_year, type: integer, source: input, description: "Proposed annual base rent in cents per RSF after execution; > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROPOSED | COUNTERED | AGREED | EXECUTED | ABANDONED" }
      - { name: negotiation_opened_at, type: datetime, source: system, description: "Timestamp at which status first reached PROPOSED" }
      - { name: executed_at, type: datetime, source: system, description: "Timestamp of execution; null until EXECUTED" }

  - name: LedgerEntry
    parent: Lease
    common_fields: false
    fields:
      - { name: lease_id, type: string, source: system, description: "FK -> Lease.id; lease whose account this entry posts to" }
      - { name: entry_kind, type: enum, source: system, description: "OPTION_FEE | MISSED_OPTION_PENALTY | ARBITRATION_AWARD_ADJUSTMENT | AMENDMENT_SETTLEMENT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; positive = receivable from tenant" }
      - { name: effective_date, type: datetime, source: system, description: "Date the entry accrues to (date-only, UTC midnight)" }
      - { name: source_option_id, type: string, source: system, description: "FK -> Option.id; option that caused this entry when applicable; null otherwise" }
      - { name: source_assessment_id, type: string, source: system, description: "FK -> MarketRateAssessment.id; assessment that caused this entry when applicable; null otherwise" }

  - name: ClockEvent
    parent: null
    common_fields: false
    fields:
      - { name: set_to, type: datetime, source: input, description: "Logical clock value the operator pinned" }
      - { name: fired_reminder_ids, type: array, source: system, description: "Reminder ids transitioned to SENT by this clock advance" }
      - { name: lapsed_option_ids, type: array, source: system, description: "Option ids transitioned to LAPSED by this clock advance" }
      - { name: holdover_lease_ids, type: array, source: system, description: "Lease ids transitioned to HOLDOVER by this clock advance" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Lease
    field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED, RENEWED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /portfolios/{pid}/leases/{lid}/activate"
        actor: AssetManager
        preconditions:
          - "commencement_date <= current logical clock date"
          - "expiration_date > current logical clock date"
        side_effects:
          - "increments Lease.version by 1"
          - "portfolio.total_active_square_feet recomputed"

      - from: ACTIVE
        to: EXPIRING
        trigger: "system (clock advance: expiration_date - 180 days <= clock < expiration_date)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Lease.version by 1"
          - "For each Option on the lease with status == AVAILABLE and notice_window_open_date <= clock <= notice_window_close_date: Option.status → WINDOW_OPEN (cascade hop 1)"
          - "Each Option that enters WINDOW_OPEN spawns its Reminder cascade (cascade hop 2: five Reminders created PENDING, one per active Contact per tier)"

      - from: ACTIVE
        to: HOLDOVER
        trigger: "system (clock advance: clock > expiration_date and no EXECUTED Amendment with kind RENEWAL_TERM or EXPANSION_TERM and no EXERCISED RENEWAL Option)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Lease.version by 1"
          - "sets holdover_entered_at to expiration_date + 1 day at 00:00:00Z (legal holdover start, backdated)"
          - "Option rows still AVAILABLE/WINDOW_OPEN on the lease → LAPSED (cascade hop 1), each posting a MISSED_OPTION_PENALTY LedgerEntry when missed_option_penalty_cents > 0 (cascade hop 2)"

      - from: EXPIRING
        to: HOLDOVER
        trigger: "system (clock advance: clock > expiration_date, no renewal in place)"
        actor: system
        preconditions: []
        side_effects:
          - "same side effects as ACTIVE → HOLDOVER (holdover_entered_at = expiration_date + 1 day, unexercised open-window options lapse, penalty entries post)"

      - from: HOLDOVER
        to: ACTIVE
        trigger: "POST /portfolios/{pid}/leases/{lid}/amendments/{aid}/execute with kind=HOLDOVER_SETTLEMENT"
        actor: AssetManager
        preconditions:
          - "Amendment.status == AGREED and Amendment.kind == HOLDOVER_SETTLEMENT"
          - "payload expected_lease_version equals Lease.version"
        side_effects:
          - "increments Lease.version by 1"
          - "clears holdover_entered_at to null"
          - "sets expiration_date to Amendment.new_expiration_date and base rent to Amendment.new_base_rent_cents_per_rsf_year"
          - "posts an AMENDMENT_SETTLEMENT LedgerEntry for the final accrued_holdover_rent_cents delta"
          - "resets accrued_holdover_rent_cents to 0"
          - "lease.active_amendment_id ← this amendment"

      - from: [ACTIVE, EXPIRING]
        to: EXPIRED
        trigger: "system (clock advance: clock > expiration_date and tenant vacated flag raised via POST /portfolios/{pid}/leases/{lid}/vacate before holdover begins)"
        actor: system
        preconditions:
          - "vacate request recorded at or before expiration_date"
        side_effects:
          - "increments Lease.version by 1"
          - "unexercised options on the lease → SUPERSEDED (not LAPSED — no penalty posts when tenant vacates on time)"
          - "PENDING reminders on those options → CANCELED"
          - "portfolio.total_active_square_feet recomputed"

      - from: [ACTIVE, EXPIRING]
        to: TERMINATED
        trigger: "system (TERMINATION Option reaches EXERCISED with target_commencement_date <= clock)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Lease.version by 1"
          - "all other non-terminal Option rows on the lease → SUPERSEDED"
          - "PENDING reminders on those options → CANCELED"
          - "portfolio.total_active_square_feet recomputed"

      - from: [ACTIVE, EXPIRING]
        to: RENEWED
        trigger: "system (RENEWAL Option reaches EXERCISED and target_commencement_date <= clock) OR POST /portfolios/{pid}/leases/{lid}/amendments/{aid}/execute with kind=RENEWAL_TERM"
        actor: system
        preconditions: []
        side_effects:
          - "increments Lease.version by 1"
          - "new lease row auto-created in DRAFT with commencement_date = option.target_commencement_date, expiration_date = target + extension_years years, base rent = Option.determined_rent_cents_per_rsf_year"
          - "all other non-terminal Option rows on the old lease → SUPERSEDED"
          - "PENDING reminders on those options → CANCELED"
          - "portfolio.total_active_square_feet recomputed"

  - entity: Option
    field: status
    initial_state: AVAILABLE
    terminal_states: [EXERCISED, LAPSED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: AVAILABLE
        to: WINDOW_OPEN
        trigger: "system (clock advance: notice_window_open_date <= clock <= notice_window_close_date, parent lease in ACTIVE or EXPIRING)"
        actor: system
        preconditions: []
        side_effects:
          - "spawns reminder cascade: for each Contact on the portfolio with is_active == true, create five Reminders (tiers T90/T60/T30/T7/T0) in PENDING with scheduled_for computed by calculations.reminder_cascade_schedule"

      - from: [AVAILABLE, WINDOW_OPEN]
        to: NOTICE_SENT
        trigger: "POST /portfolios/{pid}/leases/{lid}/options/{oid}/notices (first ExerciseNotice created)"
        actor: AssetManager
        preconditions:
          - "current logical clock date >= notice_window_open_date"
          - "current logical clock date <= notice_window_close_date"
          - "parent lease status IN {ACTIVE, EXPIRING}"
          - "no other ExerciseNotice on this option with status IN {SENT, DELIVERED, ACKNOWLEDGED}"
          - "payload expected_lease_version equals Lease.version"
        side_effects:
          - "ExerciseNotice created with status=SENT, sent_at = clock"
          - "increments Lease.version by 1"

      - from: NOTICE_SENT
        to: NOTICE_SENT
        trigger: "POST /portfolios/{pid}/leases/{lid}/options/{oid}/notices (re-delivery after a REJECTED notice — the failed notice goes VOID and a fresh SENT notice is created)"
        actor: AssetManager
        preconditions:
          - "all prior ExerciseNotice rows on this option are in {VOID, REJECTED}"
          - "current clock date <= notice_window_close_date"
          - "payload expected_lease_version equals Lease.version"
        side_effects:
          - "new ExerciseNotice SENT; prior REJECTED notice → VOID"
          - "increments Lease.version by 1"

      - from: NOTICE_SENT
        to: IN_ARBITRATION
        trigger: "system (the option has rate_determination=FAIR_MARKET and its latest MarketRateAssessment reaches DISPUTED)"
        actor: system
        preconditions: []
        side_effects:
          - "option leaves the notice path pending arbitration; notice window lapse is suspended while IN_ARBITRATION (see validations on lapse sweep)"
          - "PENDING reminders on this option stay PENDING but do not fire while IN_ARBITRATION"

      - from: IN_ARBITRATION
        to: NOTICE_SENT
        trigger: "system (ArbitrationCase on the disputed assessment reaches DECIDED)"
        actor: system
        preconditions: []
        side_effects:
          - "option.determined_rent_cents_per_rsf_year ← arbitration award via the FINAL assessment"
          - "PENDING reminders resume firing under the normal schedule"

      - from: NOTICE_SENT
        to: EXERCISED
        trigger: "system (the open ExerciseNotice reaches ACKNOWLEDGED)"
        actor: system
        preconditions:
          - "for FAIR_MARKET options: a MarketRateAssessment in FINAL exists (either unchallenged or arbitration-decided)"
          - "delivery acknowledgment occurred on or before notice_window_close_date"
        side_effects:
          - "sets exercised_at = clock"
          - "sets determined_rent_cents_per_rsf_year (FIXED: copies fixed_rent_cents_per_rsf_year; FAIR_MARKET: copies FINAL assessment determined_rent_cents)"
          - "posts OPTION_FEE LedgerEntry when exercise_fee_cents > 0"
          - "parent Lease transitions per lease machine (RENEWAL → RENEWED when target date reached; TERMINATION → TERMINATED when target date reached)"
          - "all PENDING reminders on this option → CANCELED"

      - from: [AVAILABLE, WINDOW_OPEN, NOTICE_SENT]
        to: LAPSED
        trigger: "system (clock advance: clock > notice_window_close_date and option not EXERCISED, WITHDRAWN, IN_ARBITRATION, or SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "sets lapsed_at = clock"
          - "posts MISSED_OPTION_PENALTY LedgerEntry when missed_option_penalty_cents > 0"
          - "PENDING reminders on this option → CANCELED"

      - from: [AVAILABLE, WINDOW_OPEN, NOTICE_SENT]
        to: WITHDRAWN
        trigger: "POST /portfolios/{pid}/leases/{lid}/options/{oid}/withdraw"
        actor: AssetManager
        preconditions:
          - "payload expected_lease_version equals Lease.version"
        side_effects:
          - "increments Lease.version by 1"
          - "PENDING reminders on this option → CANCELED"
          - "any ExerciseNotice in SENT/DELIVERED on this option → VOID"

      - from: [AVAILABLE, WINDOW_OPEN, NOTICE_SENT]
        to: SUPERSEDED
        trigger: "system (parent lease reached a terminal state without this option being exercised: vacated EXPIRED, TERMINATED by another option, RENEWED by another option or amendment)"
        actor: system
        preconditions: []
        side_effects:
          - "PENDING reminders on this option → CANCELED"
          - "no penalty entry posts (supersession is not a lapse)"

  - entity: ExerciseNotice
    field: status
    initial_state: SENT
    terminal_states: [ACKNOWLEDGED, REJECTED, VOID]
    transitions:
      - from: SENT
        to: DELIVERED
        trigger: "POST /portfolios/{pid}/leases/{lid}/options/{oid}/notices/{nid}/deliver"
        actor: Broker
        preconditions:
          - "the acting Broker's Contact.id == the broker contact registered for the parent portfolio (ownership)"
        side_effects:
          - "sets delivered_at = clock"

      - from: SENT
        to: REJECTED
        trigger: "POST /portfolios/{pid}/leases/{lid}/options/{oid}/notices/{nid}/reject"
        actor: Broker
        preconditions:
          - "payload rejection_reason is non-empty"
        side_effects: []

      - from: DELIVERED
        to: ACKNOWLEDGED
        trigger: "POST /portfolios/{pid}/leases/{lid}/options/{oid}/notices/{nid}/acknowledge"
        actor: LandlordCounsel
        preconditions:
          - "acknowledgment clock date <= option.notice_window_close_date"
        side_effects:
          - "sets acknowledged_at = clock"
          - "parent Option NOTICE_SENT → EXERCISED (cascade hop 1), which itself cascades to parent Lease (cascade hop 2)"

      - from: [SENT, DELIVERED]
        to: VOID
        trigger: "system (option withdrawn, or a re-delivery notice supersedes this one)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MarketRateAssessment
    field: status
    initial_state: PROVISIONAL
    terminal_states: [FINAL, SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "system (clock advance: 15 calendar days after assessment creation with no dispute filed)"
        actor: system
        preconditions: []
        side_effects:
          - "determined_rent_cents ← provisional_rent_cents"
          - "if the parent Option is NOTICE_SENT and its open ExerciseNotice is ACKNOWLEDGED, option exercise can now complete"

      - from: PROVISIONAL
        to: DISPUTED
        trigger: "POST /portfolios/{pid}/leases/{lid}/options/{oid}/assessments/{mid}/dispute"
        actor: AssetManager
        preconditions:
          - "clock date <= creation date + 15 calendar days"
          - "option.status == NOTICE_SENT or IN_ARBITRATION"
        side_effects:
          - "ArbitrationCase created OPEN with submission_close_date = clock + 30 days"
          - "parent Option NOTICE_SENT → IN_ARBITRATION (cross-entity cascade)"

      - from: DISPUTED
        to: FINAL
        trigger: "system (its ArbitrationCase reaches DECIDED)"
        actor: system
        preconditions: []
        side_effects:
          - "determined_rent_cents ← case.award_rent_cents"
          - "posts ARBITRATION_AWARD_ADJUSTMENT LedgerEntry with amount = (award_rent_cents - provisional_rent_cents) × parent lease rentable_square_feet when the award differs from the provisional rent; skipped when they are equal"
          - "parent Option IN_ARBITRATION → NOTICE_SENT"

      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "POST /portfolios/{pid}/leases/{lid}/options/{oid}/assessments (a fresh assessment is submitted while one is PROVISIONAL)"
        actor: AssetManager
        preconditions:
          - "payload expected_option_version equals Option.version"
        side_effects:
          - "prior PROVISIONAL row → SUPERSEDED"
          - "increments Option.version by 1"

  - entity: ArbitrationCase
    field: status
    initial_state: OPEN
    terminal_states: [DECIDED]
    transitions:
      - from: OPEN
        to: SUBMISSIONS_FROZEN
        trigger: "system (clock advance: clock > submission_close_date)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [OPEN, SUBMISSIONS_FROZEN]
        to: DECIDED
        trigger: "POST /portfolios/{pid}/leases/{lid}/options/{oid}/assessments/{mid}/arbitration/decide"
        actor: LandlordCounsel
        preconditions:
          - "payload panel_guidance_rent_cents is a positive integer"
        side_effects:
          - "award_rent_cents ← the submission (landlord_rent_cents or tenant_rent_cents) nearest panel_guidance_rent_cents; exact tie → the lower of the two submissions"
          - "parent MarketRateAssessment DISPUTED → FINAL (cascade hop 1)"
          - "grandparent Option IN_ARBITRATION → NOTICE_SENT (cascade hop 2)"

  - entity: Amendment
    field: status
    initial_state: DRAFT
    terminal_states: [EXECUTED, ABANDONED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /portfolios/{pid}/leases/{lid}/amendments/{aid}/propose"
        actor: AssetManager
        preconditions:
          - "lease status IN {ACTIVE, EXPIRING, HOLDOVER}"
          - "no other Amendment on the same lease is in {PROPOSED, COUNTERED, AGREED} (one open negotiation per lease)"
          - "payload expected_lease_version equals Lease.version"
        side_effects:
          - "sets negotiation_opened_at = clock"
          - "increments Lease.version by 1"

      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /portfolios/{pid}/leases/{lid}/amendments/{aid}/counter"
        actor: LandlordCounsel
        preconditions: []
        side_effects: []

      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /portfolios/{pid}/leases/{lid}/amendments/{aid}/repropose (tenant side revises terms — cyclic negotiation loop)"
        actor: AssetManager
        preconditions: []
        side_effects: []

      - from: [PROPOSED, COUNTERED]
        to: AGREED
        trigger: "POST /portfolios/{pid}/leases/{lid}/amendments/{aid}/agree"
        actor: LandlordCounsel
        preconditions:
          - "segregation of duties: the agreeing LandlordCounsel's X-User-ID must differ from the X-User-ID of the AssetManager who most recently moved this amendment to PROPOSED (or COUNTERED→PROPOSED)"
        side_effects: []

      - from: AGREED
        to: EXECUTED
        trigger: "POST /portfolios/{pid}/leases/{lid}/amendments/{aid}/execute"
        actor: AssetManager
        preconditions:
          - "segregation of duties: the executing AssetManager's X-User-ID must differ from the X-User-ID of the LandlordCounsel who agreed"
          - "payload expected_lease_version equals Lease.version"
        side_effects:
          - "increments Lease.version by 1"
          - "sets executed_at = clock; lease.active_amendment_id ← this amendment"
          - "applies new_expiration_date and new_base_rent_cents_per_rsf_year to the lease"
          - "kind=RENEWAL_TERM or EXPANSION_TERM: lease → RENEWED per lease machine; kind=HOLDOVER_SETTLEMENT: lease HOLDOVER → ACTIVE with AMENDMENT_SETTLEMENT LedgerEntry"

      - from: [DRAFT, PROPOSED, COUNTERED, AGREED]
        to: ABANDONED
        trigger: "POST /portfolios/{pid}/leases/{lid}/amendments/{aid}/abandon"
        actor: AssetManager
        preconditions: []
        side_effects:
          - "increments Lease.version by 1"

  - entity: Reminder
    field: status
    initial_state: PENDING
    terminal_states: [SENT, CANCELED]
    transitions:
      - from: PENDING
        to: SENT
        trigger: "system (clock advance: scheduled_for <= clock and option not IN_ARBITRATION and recipient Contact is_active == true)"
        actor: system
        preconditions: []
        side_effects:
          - "sets sent_at = clock"

      - from: PENDING
        to: CANCELED
        trigger: "system (option reaches EXERCISED/LAPSED/WITHDRAWN/SUPERSEDED, or recipient Contact deactivated)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: exercise-notice-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /portfolios/{pid}/leases/{lid}/options/{oid}/notices"
    occ_field: "expected_lease_version"
    description: |
      Creating an ExerciseNotice against a Lease whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      writer has just mutated the lease (activation, amendment propose/execute,
      or a prior notice creation) and the current writer's view of the lease is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: assessment-supersede-stale-option
    parent_entity: Option
    write_endpoint: "POST /portfolios/{pid}/leases/{lid}/options/{oid}/assessments"
    occ_field: "expected_option_version"
    description: |
      Submitting a fresh MarketRateAssessment against an Option whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just superseded the provisional assessment
      (which itself bumps Option.version) and the current writer's view of the
      option is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: amendment-execute-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /portfolios/{pid}/leases/{lid}/amendments/{aid}/execute"
    occ_field: "expected_lease_version"
    description: |
      Executing an Amendment against a Lease whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just executed a sibling amendment or exercised an option on the
      same lease, and the current writer's view of the lease is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: notice_window_membership
    trigger: "exercise notice creation; lapse sweep on clock advance"
    algorithm: threshold
    formula: |
      window_open  = option.notice_window_open_date        # date-only, INCLUSIVE
      window_close = option.notice_window_close_date       # date-only, INCLUSIVE
      deliverable(d) = (window_open <= d) AND (d <= window_close)
      # Both bounds inclusive. A notice delivered exactly on window_close is timely;
      # one delivered on window_close + 1 day lapses the option.
    input_set: "the option row being exercised; clock date d"
    constants:
      BOUND_SEMANTICS: "CLOSED_CLOSED"
    precision: "date granularity, UTC"

  - name: reminder_cascade_schedule
    trigger: "option AVAILABLE → WINDOW_OPEN"
    algorithm: chronological
    formula: |
      TIERS = [90, 60, 30, 7, 0]  # days before notice_window_close_date
      For each tier t, for each active contact:
        raw = notice_window_close_date - t days
        # Weekend roll-FORWARD: if raw falls on Saturday → +2 days; Sunday → +1 day.
        # Roll-forward can push T0 reminders past the close date — that is intended
        # (the T0 reminder is a lapse alarm, not a deadline).
        scheduled_for = roll_forward_weekend(raw) at 09:00:00 UTC
      # Firing order on a clock advance that crosses several tiers at once:
      # chronological by scheduled_for ASC; ties (same timestamp) break by
      # tier severity (T0 > T7 > T30 > T60 > T90), then by Contact.created_at ASC.
      # Random ids are never consulted in ordering.
    input_set: "the option entering WINDOW_OPEN; contacts of the parent portfolio with is_active == true at the moment of the cascade"
    constants:
      TIER_OFFSETS_DAYS: [90, 60, 30, 7, 0]
      FIRE_TIME_UTC: "09:00:00"
    precision: "second granularity, UTC"

  - name: holdover_rent_accrual
    trigger: "clock advance while lease in HOLDOVER; holdover exit (execute HOLDOVER_SETTLEMENT amendment)"
    algorithm: tiered_pricing
    formula: |
      # Tier 1: holdover days 1..holdover_tier1_days at holdover_tier1_pct of base rent
      # Tier 2: days holdover_tier1_days+1 onward at holdover_tier2_pct of base rent
      daily_base_cents = floor(lease.base_rent_cents_per_rsf_year * lease.rentable_square_feet / 365)
      tier1_daily = round_half_up(daily_base_cents * lease.holdover_tier1_pct / 100)
      tier2_daily = round_half_up(daily_base_cents * lease.holdover_tier2_pct / 100)
      days_held = calendar days from holdover_entered_at (exclusive) through clock date (inclusive)
      accrued = min(days_held, tier1_days) * tier1_daily
              + max(0, days_held - tier1_days) * tier2_daily
      # Rounding order PINNED: per-day tier amounts rounded first, then multiplied
      # by days, then summed. Never compute the month subtotal and round once.
    input_set: "leases with status == HOLDOVER; each lease's tier percentages and tier1_days"
    constants:
      DAYS_PER_YEAR_DIVISOR: 365
    precision: "integer cents; round_half_up at the per-day tier step"
    variants:
      - name: per_day_then_sum
        when: "default — used for all accrual reporting and ledger posting"
        difference: "per-day tier rounding, then multiply by days (pinned base)"
      - name: sum_then_round
        when: "FORBIDDEN alternate interpretation the spec explicitly rules out"
        difference: "computes unrounded tier subtotals and rounds the grand total; can differ from the pinned base by up to (days_held - 1) cents; any implementation producing this variant is non-conformant"

  - name: fair_market_rent
    trigger: "MarketRateAssessment creation"
    algorithm: weighted_scoring
    formula: |
      # Variant selected by assessment.method:
      if method == COMPARABLE_AVERAGE:
        # 3..7 comparable rents (cents per RSF-year)
        provisional = round_half_up(mean(comparable_rents_cents))
      if method == PSF_REGRESSION:
        provisional = regression_base_cents + sum(regression_adjustments)
        provisional = max(1, provisional)   # floor at 1 cent — never zero or negative
    input_set: "the new assessment's own input fields only (no cross-entity reads)"
    precision: "integer cents; round_half_up"
    variants:
      - name: comparable_average
        when: "assessment.method == COMPARABLE_AVERAGE"
        difference: "arithmetic mean of 3-7 comparables, rounded half-up"
      - name: psf_regression
        when: "assessment.method == PSF_REGRESSION"
        difference: "base plus signed adjustments with a 1-cent floor; no mean, no rounding step"

  - name: portfolio_expiration_ladder
    trigger: "lease activate, vacate-expire, terminate, renew, amendment execute; GET /portfolios/{pid}/ladder"
    algorithm: aggregation
    formula: |
      # For each calendar year Y from current clock year through max expiration year:
      expiring_rsf(Y) = sum(rentable_square_feet of leases with status IN {ACTIVE, EXPIRING, HOLDOVER}
                            whose expiration_date falls in calendar year Y)
      exposure_pct(Y) = round_half_up(100 * expiring_rsf(Y) / total_active_square_feet)
      posture = LADDER_STRESSED if any exposure_pct(Y) > laddering_max_pct_per_year else LADDER_OK
      posture_year = smallest Y breaching the cap, else null
      # Boundary: exposure_pct(Y) == cap does NOT trip posture (strict >).
      # Division by zero: when total_active_square_feet == 0, posture = LADDER_OK.
    input_set: "leases of the portfolio with status IN {ACTIVE, EXPIRING, HOLDOVER}"
    constants:
      STRICTLY_GREATER_THAN_CAP: true
    precision: "integer percent; round_half_up"

  - name: missed_option_consequence
    trigger: "option → LAPSED"
    algorithm: threshold
    formula: |
      # Consequence posting at lapse:
      if option.missed_option_penalty_cents > 0:
        post LedgerEntry(entry_kind=MISSED_OPTION_PENALTY, amount=+missed_option_penalty_cents,
                         effective_date=clock date, source_option_id=option.id)
      else:
        no entry posts (zero-penalty lapses are silent)
    input_set: "the lapsing option"
    precision: "integer cents"
    variants:
      - name: deposit_forfeiture
        when: "missed_option_penalty_cents > 0"
        difference: "posts a receivable ledger entry at lapse time"
      - name: silent_lapse
        when: "missed_option_penalty_cents == 0"
        difference: "no ledger entry; only the status transition is observable"

  - name: negotiation_timeline_compliance
    trigger: "amendment propose; amendment execute; GET /portfolios/{pid}/negotiations/compliance"
    algorithm: forward_looking
    formula: |
      # Negotiation initiation must begin early enough to close before expiration.
      lead_days_required = 270                       # 9 months
      initiation_deadline = lease.expiration_date - lead_days_required days
      # An amendment is ON_TIME if negotiation_opened_at (date) <= initiation_deadline,
      # else LATE. An amendment is EXECUTION_COMPLIANT if executed_at (date) <
      # lease.expiration_date (strict — same-day execution is non-compliant).
      # A lease with no amendment at all is flagged NEGOTIATION_MISSING once the
      # clock passes initiation_deadline while lease status IN {ACTIVE, EXPIRING}.
    input_set: "amendments of the lease; lease.expiration_date"
    constants:
      LEAD_DAYS_REQUIRED: 270
    precision: "date granularity, UTC"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resources exist and nest correctly (portfolio → lease → option → assessment/notice; amendment under lease), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 4
    category: business_referential
    check: "Body-supplied foreign keys resolve within the same portfolio scope (contact belongs to the option's portfolio; supersedes_amendment_id belongs to the same lease)"
    error_id: ERR_FK_SCOPE_VIOLATION
    http_status: 422
    applies_to: "POST endpoints carrying FK fields"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_temporal
    check: "Exercise notice may only be created when clock date is within [notice_window_open_date, notice_window_close_date] (both inclusive)"
    error_id: ERR_NOTICE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /portfolios/{pid}/leases/{lid}/options/{oid}/notices"

  - priority: 7
    category: business_temporal
    check: "Assessment dispute must be filed within 15 calendar days of assessment creation (clock date <= created_at date + 15)"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST .../assessments/{mid}/dispute"

  - priority: 8
    category: business_constraint
    check: "Only one open negotiation per lease: no second amendment may reach PROPOSED while another amendment on the same lease is in {PROPOSED, COUNTERED, AGREED}"
    error_id: ERR_NEGOTIATION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST .../amendments/{aid}/propose"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: agree and execute must be performed by different users than the immediately preceding step (agreer ≠ most recent proposer; executor ≠ agreer)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST .../amendments/{aid}/agree, POST .../amendments/{aid}/execute"

  - priority: 10
    category: business_constraint
    check: "Lease temporal sanity: expiration_date strictly after commencement_date; amendment new_expiration_date strictly after lease's current expiration_date; option notice_window_close_date >= notice_window_open_date"
    error_id: ERR_TEMPORAL_ORDER
    http_status: 422
    applies_to: "POST /portfolios/{pid}/leases, POST .../options, POST .../amendments"

  - priority: 11
    category: business_constraint
    check: "Rate determination coherence: FIXED requires fixed_rent_cents_per_rsf_year > 0; FAIR_MARKET forbids fixed_rent_cents_per_rsf_year (must be absent/null); TERMINATION and ROFR options must use rate_determination=FIXED semantics with exercise terms carried on the option row"
    error_id: ERR_RATE_TERMS_INCOHERENT
    http_status: 422
    applies_to: "POST .../options"

  - priority: 12
    category: business_constraint
    check: "Comparable set shape: COMPARABLE_AVERAGE requires 3..7 comparable_rents_cents entries, all positive; PSF_REGRESSION requires regression_base_cents > 0 and forbids comparable_rents_cents"
    error_id: ERR_ASSESSMENT_SHAPE
    http_status: 422
    applies_to: "POST .../assessments"

  - priority: 13
    category: business_constraint
    check: "No duplicate open exercise notice: an option may have at most one ExerciseNotice in {SENT, DELIVERED}"
    error_id: ERR_NOTICE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST .../notices"

  - priority: 14
    category: business_fiscal
    check: "OCC precondition: expected_lease_version / expected_option_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "endpoints listed in §1.2.1 concurrency_rules"

  - priority: 15
    category: business_fiscal
    check: "Portfolio ladder guard: a lease activation or amendment execution must not push the portfolio into LADDER_STRESSED when payload field enforce_ladder=true is supplied by the caller (advisory gate, off by default)"
    error_id: ERR_LADDER_BREACH
    http_status: 422
    applies_to: "POST .../leases/{lid}/activate, POST .../amendments/{aid}/execute"

  - priority: 16
    category: business_constraint
    check: "Holdover settlement completeness: a HOLDOVER_SETTLEMENT amendment may only execute while the lease is actually in HOLDOVER"
    error_id: ERR_NOT_IN_HOLDOVER
    http_status: 409
    applies_to: "POST .../amendments/{aid}/execute"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Pins the server's logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall time. Advancing the clock fires the reminder/lapse/holdover sweeps described in §1.2 and §1.3."
    roles: [PlatformAdmin]
    code: 201
    input: [to_iso8601]
    output: ClockEvent
    side_effects:
      - "Reminder sweep: PENDING reminders with scheduled_for <= clock and option not IN_ARBITRATION and contact active → SENT"
      - "Lapse sweep: options past notice_window_close_date → LAPSED (posting MISSED_OPTION_PENALTY when applicable)"
      - "Lease sweep: ACTIVE → EXPIRING at expiration-180d; ACTIVE/EXPIRING → HOLDOVER or EXPIRED past expiration"
      - "Assessment sweep: PROVISIONAL older than 15 days undisputed → FINAL"
      - "Arbitration sweep: OPEN cases past submission_close_date → SUBMISSIONS_FROZEN"
      - "Holdover accrual recompute on every HOLDOVER lease"

  # --- Portfolios ---
  - method: POST
    path: "/portfolios"
    description: "Create a portfolio"
    roles: [PlatformAdmin]
    code: 201
    input: [name, region, laddering_max_pct_per_year]
    output: Portfolio
    side_effects: ["posture=LADDER_OK, total_active_square_feet=0"]

  - method: GET
    path: "/portfolios/{pid}"
    description: "Get portfolio with derived posture fields"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: []
    output: Portfolio
    side_effects: []

  - method: GET
    path: "/portfolios"
    description: "List portfolios (paginated)"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "region?"]
    output: Portfolio[]
    side_effects: []

  - method: GET
    path: "/portfolios/{pid}/ladder"
    description: "Computed read: expiration ladder exposure per calendar year and posture"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: []
    output: "{ years: array, posture: string, posture_year: integer|null }"
    side_effects: []

  - method: GET
    path: "/portfolios/{pid}/negotiations/compliance"
    description: "Computed read: per-lease negotiation timeline compliance (ON_TIME | LATE | NEGOTIATION_MISSING)"
    roles: [PlatformAdmin, AssetManager, LandlordCounsel]
    code: 200
    input: []
    output: "{ items: array }"
    side_effects: []

  # --- Contacts ---
  - method: POST
    path: "/portfolios/{pid}/contacts"
    description: "Register a contact (asset manager, broker, landlord counsel)"
    roles: [PlatformAdmin, AssetManager]
    code: 201
    input: [full_name, email, contact_kind, "is_active?"]
    output: Contact
    side_effects: []

  - method: GET
    path: "/portfolios/{id}/contacts"
    description: "List contacts of a portfolio"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "contact_kind?", "is_active?"]
    output: Contact[]
    side_effects: []

  - method: GET
    path: "/portfolios/{pid}/contacts/{cid}"
    description: "Get a contact"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: []
    output: Contact
    side_effects: []

  - method: PATCH
    path: "/portfolios/{pid}/contacts/{cid}"
    description: "Update contact (deactivation cascades: PENDING reminders addressed to this contact → CANCELED)"
    roles: [PlatformAdmin, AssetManager]
    code: 200
    input: ["full_name?", "email?", "is_active?"]
    output: Contact
    side_effects: ["is_active true→false cancels PENDING reminders for this contact"]

  # --- Leases ---
  - method: POST
    path: "/portfolios/{pid}/leases"
    description: "Create a lease in DRAFT"
    roles: [PlatformAdmin, AssetManager]
    code: 201
    input: [premises_label, rentable_square_feet, base_rent_cents_per_rsf_year, commencement_date, expiration_date, holdover_tier1_pct, holdover_tier2_pct, "holdover_tier1_days?"]
    output: Lease
    side_effects: ["status=DRAFT, accrued_holdover_rent_cents=0"]

  - method: GET
    path: "/portfolios/{pid}/leases/{lid}"
    description: "Get lease"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: GET
    path: "/portfolios/{id}/leases"
    description: "List leases of a portfolio"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Lease[]
    side_effects: []

  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/activate"
    description: "Activate a DRAFT lease whose term has begun"
    roles: [AssetManager]
    code: 200
    input: ["enforce_ladder?"]
    output: Lease
    side_effects:
      - "Lease DRAFT → ACTIVE; increments Lease.version by 1"
      - "portfolio totals and ladder posture recompute"
      - "enforce_ladder=true trips ERR_LADDER_BREACH when activation would stress the ladder"

  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/vacate"
    description: "Record tenant vacating at natural expiration (lease → EXPIRED at the next clock sweep instead of HOLDOVER)"
    roles: [AssetManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["marks lease for EXPIRED-at-expiration; on sweep: options → SUPERSEDED, reminders → CANCELED"]

  # --- Options ---
  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/options"
    description: "Register an option on a lease"
    roles: [AssetManager]
    code: 201
    input: [option_type, notice_window_open_date, notice_window_close_date, target_commencement_date, "extension_years?", rate_determination, "fixed_rent_cents_per_rsf_year?", "exercise_fee_cents?", "missed_option_penalty_cents?"]
    output: Option
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/portfolios/{pid}/leases/{lid}/options/{oid}"
    description: "Get an option"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: []
    output: Option
    side_effects: []

  - method: GET
    path: "/portfolios/{pid}/leases/{lid}/options"
    description: "List options of a lease"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "status?", "option_type?"]
    output: Option[]
    side_effects: []

  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/options/{oid}/withdraw"
    description: "Withdraw an unexercised option"
    roles: [AssetManager]
    code: 200
    input: [expected_lease_version]
    output: Option
    side_effects:
      - "Option → WITHDRAWN; increments Lease.version by 1"
      - "PENDING reminders → CANCELED; open notices → VOID"

  # --- Exercise notices ---
  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/options/{oid}/notices"
    description: "Deliver an exercise notice (OCC on Lease.version)"
    roles: [AssetManager]
    code: 201
    input: [delivery_method, expected_lease_version]
    output: ExerciseNotice
    side_effects:
      - "ExerciseNotice created SENT; parent Option AVAILABLE/WINDOW_OPEN → NOTICE_SENT"
      - "increments Lease.version by 1"

  - method: GET
    path: "/portfolios/{pid}/leases/{lid}/options/{oid}/notices"
    description: "List exercise notices of an option"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ExerciseNotice[]
    side_effects: []

  - method: GET
    path: "/portfolios/{pid}/leases/{lid}/options/{oid}/notices/{nid}"
    description: "Get an exercise notice"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: []
    output: ExerciseNotice
    side_effects: []

  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/options/{oid}/notices/{nid}/deliver"
    description: "Broker confirms delivery"
    roles: [Broker]
    code: 200
    input: []
    output: ExerciseNotice
    side_effects: ["notice SENT → DELIVERED"]

  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/options/{oid}/notices/{nid}/reject"
    description: "Broker marks delivery rejected (bad address, refused)"
    roles: [Broker]
    code: 200
    input: [rejection_reason]
    output: ExerciseNotice
    side_effects: ["notice SENT → REJECTED"]

  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/options/{oid}/notices/{nid}/acknowledge"
    description: "Landlord counsel acknowledges receipt — completes exercise when all gates pass"
    roles: [LandlordCounsel]
    code: 200
    input: []
    output: ExerciseNotice
    side_effects:
      - "notice DELIVERED → ACKNOWLEDGED"
      - "parent Option NOTICE_SENT → EXERCISED (fee ledger entry when exercise_fee_cents > 0)"
      - "lease-level cascade per §1.2 lease machine when target dates have arrived"

  # --- Market rate assessments ---
  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/options/{oid}/assessments"
    description: "Submit a market-rate assessment for a FAIR_MARKET option (OCC on Option.version; supersedes a prior PROVISIONAL row)"
    roles: [AssetManager]
    code: 201
    input: [method, "comparable_rents_cents?", "regression_base_cents?", "regression_adjustments?", expected_option_version]
    output: MarketRateAssessment
    side_effects:
      - "new row PROVISIONAL with computed provisional_rent_cents"
      - "prior PROVISIONAL row on the same option → SUPERSEDED"
      - "increments Option.version by 1"

  - method: GET
    path: "/portfolios/{pid}/leases/{lid}/options/{oid}/assessments"
    description: "List assessments of an option"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: MarketRateAssessment[]
    side_effects: []

  - method: GET
    path: "/portfolios/{pid}/leases/{lid}/options/{oid}/assessments/{mid}"
    description: "Get an assessment"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: []
    output: MarketRateAssessment
    side_effects: []

  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/options/{oid}/assessments/{mid}/dispute"
    description: "Dispute a provisional assessment (opens arbitration)"
    roles: [AssetManager]
    code: 201
    input: [landlord_rent_cents, tenant_rent_cents]
    output: ArbitrationCase
    side_effects:
      - "assessment PROVISIONAL → DISPUTED"
      - "ArbitrationCase OPEN created; submission_close_date = clock + 30 days"
      - "parent Option NOTICE_SENT → IN_ARBITRATION (reminder firing suspended)"

  - method: GET
    path: "/portfolios/{pid}/leases/{lid}/options/{oid}/assessments/{mid}/arbitration"
    description: "Get the arbitration case of an assessment (0 or 1 row)"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: []
    output: ArbitrationCase[]
    side_effects: []

  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/options/{oid}/assessments/{mid}/arbitration/decide"
    description: "Arbitrator decision — baseball arbitration nearest-the-guidance award"
    roles: [LandlordCounsel]
    code: 200
    input: [panel_guidance_rent_cents]
    output: ArbitrationCase
    side_effects:
      - "case → DECIDED with award_rent_cents per §1.2 rule"
      - "assessment DISPUTED → FINAL (determined_rent_cents ← award; ARBITRATION_AWARD_ADJUSTMENT entry when applicable)"
      - "option IN_ARBITRATION → NOTICE_SENT"

  # --- Amendments ---
  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/amendments"
    description: "Open an amendment draft (negotiation initiation)"
    roles: [AssetManager]
    code: 201
    input: ["supersedes_amendment_id?", kind, new_expiration_date, new_base_rent_cents_per_rsf_year]
    output: Amendment
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/portfolios/{pid}/leases/{lid}/amendments"
    description: "List amendments of a lease"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "status?", "kind?"]
    output: Amendment[]
    side_effects: []

  - method: GET
    path: "/portfolios/{pid}/leases/{lid}/amendments/{aid}"
    description: "Get an amendment"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: []
    output: Amendment
    side_effects: []

  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/amendments/{aid}/propose"
    description: "Move amendment DRAFT → PROPOSED (or COUNTERED → PROPOSED on revise)"
    roles: [AssetManager]
    code: 200
    input: [expected_lease_version]
    output: Amendment
    side_effects: ["sets negotiation_opened_at on first proposal; increments Lease.version by 1"]

  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/amendments/{aid}/counter"
    description: "Landlord counters a proposal (PROPOSED → COUNTERED)"
    roles: [LandlordCounsel]
    code: 200
    input: [new_base_rent_cents_per_rsf_year]
    output: Amendment
    side_effects: ["updates proposed rent; status → COUNTERED"]

  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/amendments/{aid}/repropose"
    description: "Tenant revises terms after a counter (COUNTERED → PROPOSED) — cyclic negotiation"
    roles: [AssetManager]
    code: 200
    input: ["new_base_rent_cents_per_rsf_year?", "new_expiration_date?"]
    output: Amendment
    side_effects: ["status → PROPOSED"]

  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/amendments/{aid}/agree"
    description: "Landlord counsel agrees (SoD: cannot be the user who last proposed)"
    roles: [LandlordCounsel]
    code: 200
    input: []
    output: Amendment
    side_effects: ["status → AGREED"]

  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/amendments/{aid}/execute"
    description: "Execute an AGREED amendment (OCC on Lease.version; SoD: cannot be the agreer)"
    roles: [AssetManager]
    code: 200
    input: [expected_lease_version, "enforce_ladder?"]
    output: Amendment
    side_effects:
      - "status → EXECUTED; increments Lease.version by 1"
      - "applies terms to lease; kind-specific cascade per §1.2"

  - method: POST
    path: "/portfolios/{pid}/leases/{lid}/amendments/{aid}/abandon"
    description: "Abandon an open amendment"
    roles: [AssetManager]
    code: 200
    input: []
    output: Amendment
    side_effects: ["status → ABANDONED; increments Lease.version by 1"]

  # --- Ledger & reminders ---
  - method: GET
    path: "/portfolios/{pid}/leases/{lid}/ledger"
    description: "List ledger entries of a lease"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "entry_kind?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/portfolios/{pid}/leases/{lid}/options/{oid}/reminders"
    description: "List reminders of an option"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "status?", "tier?", "contact_id?"]
    output: Reminder[]
    side_effects: []

  # --- Flat read aliases (reverse-reachability surface; same resources, flat paths) ---
  - method: GET
    path: "/leases/{id}"
    description: "Flat read alias for a lease"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: GET
    path: "/leases"
    description: "Flat filtered list of leases across portfolios"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "status?", "active_amendment_id?"]
    output: Lease[]
    side_effects: []

  - method: GET
    path: "/options/{id}"
    description: "Flat read alias for an option"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: []
    output: Option
    side_effects: []

  - method: GET
    path: "/assessments/{id}"
    description: "Flat read alias for a market-rate assessment"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: []
    output: MarketRateAssessment
    side_effects: []

  - method: GET
    path: "/contacts/{id}"
    description: "Flat read alias for a contact"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: []
    output: Contact
    side_effects: []

  - method: GET
    path: "/amendments/{id}"
    description: "Flat read alias for an amendment"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: []
    output: Amendment
    side_effects: []

  - method: GET
    path: "/amendments"
    description: "Flat filtered list of amendments across leases"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "status?", "kind?", "supersedes_amendment_id?"]
    output: Amendment[]
    side_effects: []

  - method: GET
    path: "/leases/{id}/options"
    description: "Flat alias: options of a lease"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "status?", "option_type?"]
    output: Option[]
    side_effects: []

  - method: GET
    path: "/leases/{id}/amendments"
    description: "Flat alias: amendments of a lease"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "status?", "kind?"]
    output: Amendment[]
    side_effects: []

  - method: GET
    path: "/leases/{id}/ledger"
    description: "Flat alias: ledger entries of a lease"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "entry_kind?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/options/{id}/assessments"
    description: "Flat alias: assessments of an option"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: MarketRateAssessment[]
    side_effects: []

  - method: GET
    path: "/options/{id}/notices"
    description: "Flat alias: exercise notices of an option"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ExerciseNotice[]
    side_effects: []

  - method: GET
    path: "/options/{id}/reminders"
    description: "Flat alias: reminders of an option"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "status?", "tier?", "contact_id?"]
    output: Reminder[]
    side_effects: []

  - method: GET
    path: "/options/{id}/ledger"
    description: "Flat alias: ledger entries sourced from an option"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/assessments/{id}/arbitration"
    description: "Flat alias: arbitration case of an assessment (0 or 1 rows)"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: []
    output: ArbitrationCase[]
    side_effects: []

  - method: GET
    path: "/assessments/{id}/ledger"
    description: "Flat alias: ledger entries sourced from an assessment"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/contacts/{id}/reminders"
    description: "Flat alias: reminders addressed to a contact"
    roles: [PlatformAdmin, AssetManager, Broker, LandlordCounsel]
    code: 200
    input: ["limit?", "offset?", "status?", "tier?"]
    output: Reminder[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties breached: agreer equals last proposer, or executor equals agreer" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource missing or nested outside its parent scope" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not equal the parent entity's current version" }
  - { id: ERR_NOTICE_WINDOW_CLOSED, http: 422, condition: "Exercise notice attempted before notice_window_open_date or after notice_window_close_date" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 422, condition: "Assessment dispute filed more than 15 calendar days after assessment creation" }
  - { id: ERR_NEGOTIATION_ALREADY_OPEN, http: 409, condition: "Another amendment on the same lease is already in PROPOSED/COUNTERED/AGREED" }
  - { id: ERR_TEMPORAL_ORDER, http: 422, condition: "Date ordering violated (expiration <= commencement, close < open, new expiration <= current expiration)" }
  - { id: ERR_RATE_TERMS_INCOHERENT, http: 422, condition: "FIXED without fixed rent, or FAIR_MARKET carrying a fixed rent, or fixed-rent terms on TERMINATION/ROFR" }
  - { id: ERR_ASSESSMENT_SHAPE, http: 422, condition: "Comparable count outside 3..7, non-positive comparables, or regression inputs missing/mixed" }
  - { id: ERR_NOTICE_ALREADY_OPEN, http: 409, condition: "An ExerciseNotice in SENT or DELIVERED already exists on this option" }
  - { id: ERR_LADDER_BREACH, http: 422, condition: "enforce_ladder=true and the operation would push the portfolio into LADDER_STRESSED" }
  - { id: ERR_NOT_IN_HOLDOVER, http: 409, condition: "HOLDOVER_SETTLEMENT execution attempted on a lease not in HOLDOVER" }
  - { id: ERR_FK_SCOPE_VIOLATION, http: 422, condition: "Body FK references a resource outside the portfolio/lease scope" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request body: missing required field, wrong type, enum out of range" }
  - { id: ERR_ACK_AFTER_WINDOW, http: 422, condition: "Acknowledgment attempted after notice_window_close_date; exercise cannot complete" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Back-office operator; owns portfolio/contact setup and the test-driving clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /portfolios"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /portfolios/{pid}/contacts"
      - "PATCH /portfolios/{pid}/contacts/{cid}"
      - "POST /portfolios/{pid}/leases"

  - name: AssetManager
    description: "Corporate real estate asset manager; owns leases, options, notices, assessments, and the tenant side of amendment negotiation"
    identity: "entity_backed:Contact"
    exclusive_operations:
      - "POST /portfolios/{pid}/leases/{lid}/activate"
      - "POST /portfolios/{pid}/leases/{lid}/vacate"
      - "POST /portfolios/{pid}/leases/{lid}/options"
      - "POST /portfolios/{pid}/leases/{lid}/options/{oid}/withdraw"
      - "POST /portfolios/{pid}/leases/{lid}/options/{oid}/notices"
      - "POST /portfolios/{pid}/leases/{lid}/options/{oid}/assessments"
      - "POST /portfolios/{pid}/leases/{lid}/options/{oid}/assessments/{mid}/dispute"
      - "POST /portfolios/{pid}/leases/{lid}/amendments (+ propose/repropose/abandon/execute)"
    shared_operations:
      - "All GET endpoints"
      - "POST /portfolios/{pid}/contacts"
      - "PATCH /portfolios/{pid}/contacts/{cid}"
      - "POST /portfolios/{pid}/leases"

  - name: Broker
    description: "External broker; confirms notice delivery and receives reminder cascade"
    identity: "entity_backed:Contact"
    exclusive_operations:
      - "POST /portfolios/{pid}/leases/{lid}/options/{oid}/notices/{nid}/deliver"
      - "POST /portfolios/{pid}/leases/{lid}/options/{oid}/notices/{nid}/reject"
    shared_operations:
      - "All GET endpoints"

  - name: LandlordCounsel
    description: "Landlord's counsel; acknowledges notices, counters/agrees amendments, and renders arbitration decisions"
    identity: "entity_backed:Contact"
    exclusive_operations:
      - "POST /portfolios/{pid}/leases/{lid}/options/{oid}/notices/{nid}/acknowledge"
      - "POST /portfolios/{pid}/leases/{lid}/amendments/{aid}/counter"
      - "POST /portfolios/{pid}/leases/{lid}/amendments/{aid}/agree"
      - "POST /portfolios/{pid}/leases/{lid}/options/{oid}/assessments/{mid}/arbitration/decide"
    shared_operations:
      - "All GET endpoints"
