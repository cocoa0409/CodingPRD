  - rule_id: non_linear_state_machine
    instances:

      - name: pool_returns_to_allocating_from_two_different_calibration_states
        grounds:
          - state_machines.BusinessUnitPool
          - state_machines.BonusPlan
          - entities.BusinessUnitPool.fields.calibration_returned_count
          - endpoints."POST /bu-pools/{poolId}/calibration-decision"
          - endpoints."POST /bonus-plans/{planId}/open-calibration"
        distinguishing_aspect: |
          The pool reaches ALLOCATING three separate times and the two RETURN
          edges start from DIFFERENT states: the first from
          CALIBRATION_SUBMITTED, the second from CALIBRATED (a state a linear
          reading treats as final). Each RETURN also bubbles the plan back
          CALIBRATION_REVIEW -> ALLOCATION_OPEN and pushes every CALIBRATED
          award back to PROPOSED, so the loop is not idempotent bookkeeping:
          calibration_returned_count reaches exactly 2 while allocated_cents
          never moves off 4,000,000.
        test_recipe:
          setup:
            - "One unit, one plan (weights 50/30/20), L5 target 20.00%, one REVENUE metric weight 100.00 with actual == target (achievement 100.00), one pool with scorecard certified at 100.00, one participant L5 salary 20,000,000 hired 2025-03-01."
            - "Plan certified at blended 100.00 / multiplier 1.0000 and funded: pool funded_cents 4,000,000, min_utilization_cents 3,980,000."
            - "The single award is allocated at exactly 4,000,000 (ratio 1.0000), so the pool is WITHIN_GUIDELINES and the plan is COMPLIANT."
