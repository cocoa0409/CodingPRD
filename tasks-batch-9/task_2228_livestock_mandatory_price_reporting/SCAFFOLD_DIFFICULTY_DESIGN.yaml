          - validations[priority=37]
          - errors.ERR_SUPERSEDE_TARGET_PLANT_MISMATCH
          - errors.ERR_DUPLICATE_SUBMISSION
          - entities.Submission.fields.supersedes_submission_id
        conflicting_priorities: [31, 37]
        distinguishing_aspect: |
          Error-category pair business_referential (priority 31) vs business_constraint
          (priority 37) on POST /submissions — a third distinct pair. A filing that both
          names a supersede target belonging to another plant and duplicates the plant's
          own open filing must report the referential defect: the duplicate check itself
          consults supersedes_submission_id, so an unusable pointer has to be rejected
          before the constraint that depends on it is evaluated.
