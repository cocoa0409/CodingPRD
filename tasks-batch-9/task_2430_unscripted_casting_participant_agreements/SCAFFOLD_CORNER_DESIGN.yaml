              captures: { call_status: $.data.status }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T23:59:59Z" }
              as: ProductionAdmin
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Early Bird", date_of_birth: "1994-04-02", residency_state_code: "GA" }
              as: CastingDirector
