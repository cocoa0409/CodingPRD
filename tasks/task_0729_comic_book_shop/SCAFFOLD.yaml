  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call to this endpoint the clock reads exactly that default (never real wall-clock time)."
    roles: [Clerk, Manager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["Logical clock set; all temporal checks (cutoff, event windows) evaluate against it"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or Customer acting on another customer's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or FK body id does not resolve" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum, out-of-range number, ends_at <= starts_at, or commission_pct outside [0,1)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition/operation not defined from the resource's current state" }
  - { id: ERR_CUSTOMER_BANNED, http: 409, condition: "Operation requires an ACTIVE customer but the customer is BANNED" }
  - { id: ERR_SERIES_DISCONTINUED, http: 409, condition: "Issue lifecycle advance requires ACTIVE series but series is DISCONTINUED" }
  - { id: ERR_PAST_CUTOFF, http: 422, condition: "Pre-order CONFIRM at/after ComicIssue.order_cutoff_date" }
  - { id: ERR_ISSUE_NOT_ON_SALE, http: 409, condition: "Allocation or reservation pull requires ComicIssue.status == ON_SALE" }
  - { id: ERR_ISSUE_ALREADY_ON_SALE, http: 409, condition: "Pre-order CONFIRM requires ComicIssue.status in {SOLICITED, ORDERED}; issue already ON_SALE or CLOSED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_comic_issue_version does not match current ComicIssue.version" }
  - { id: ERR_ALLOCATION_ALREADY_RUN, http: 409, condition: "run-allocation invoked when there are no RESERVED reservations left to allocate and allocation already executed once" }
  - { id: ERR_INSUFFICIENT_COPIES, http: 409, condition: "Reserved copies cannot be satisfied at allocation for a mandatory grant (reserved for boundary tests)" }
  - { id: ERR_INSUFFICIENT_STORE_CREDIT, http: 402, condition: "pay_with_store_credit_only checkout where store_credit_cents < amount_due_cents" }
  - { id: ERR_EVENT_FULL, http: 409, condition: "Event registration would exceed capacity (registered_count >= capacity)" }
  - { id: ERR_EVENT_CLOSED, http: 409, condition: "Registration/check-in requires Event.status == OPEN" }
  - { id: ERR_EVENT_TIME_CONFLICT, http: 409, condition: "New event overlaps a non-CANCELLED event at the same store_location (half-open [starts_at, ends_at))" }
  - { id: ERR_REGISTRATION_TIME_CONFLICT, http: 409, condition: "Customer already registered for another event whose window, expanded by a 30-minute buffer each side, overlaps this event" }
  - { id: ERR_EVENT_ALREADY_STARTED, http: 422, condition: "Event registration attempted at/after Event.starts_at" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "Customer already has a REGISTERED/CHECKED_IN registration for this event" }
  - { id: ERR_SALE_PRICE_REQUIRED, http: 422, condition: "Consignment SELL without sale_price_cents" }
  - { id: ERR_DISPUTE_LIMIT_REACHED, http: 409, condition: "Grading dispute (RETURNED->AT_GRADER) attempted when dispute_count >= DISPUTE_LIMIT (3)" }
  - { id: ERR_NEGATIVE_INVENTORY, http: 409, condition: "A release/reconcile would drive copies_available or copies_allocated below 0" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "A retail customer acting on their own subscriptions, reservations, pre-orders, event registrations, consignments (as consignor), and grading submissions."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "GET own Customer / CreditTransactions"
      - "POST /api/pull-subscriptions (own), transition (pause/resume/cancel own)"
      - "POST /api/reservations (own), transition (release own)"
      - "POST /api/pre-orders (own), transition (cancel own)"
      - "POST /api/event-registrations (own), transition (cancel own)"
      - "POST /api/consignments (own as consignor)"
      - "POST /api/grading-submissions (own), transition (dispute own returned grade)"
      - "GET read endpoints scoped to own resources"
  - name: Clerk
    description: "Store staff running day-to-day operations: catalog, allocation, pulls, grading intake/advance, events, consignment listing/sale, checkout."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/customers"
      - "POST /api/comic-series, /api/comic-issues and their transitions"
      - "POST /api/comic-issues/{id}/run-allocation"
      - "POST /api/reservations/{id}/transition (pull/sell)"
      - "POST /api/pre-orders/{id}/transition (confirm/fulfill)"
      - "POST /api/back-issues and transitions"
      - "POST /api/grading-submissions/{id}/transition (submit/at_grader/return/ready/pickup)"
      - "POST /api/events and transitions"
      - "POST /api/consignments/{id}/transition (list/sell/return)"
      - "POST /api/checkout"
    shared_operations:
      - "All GET read endpoints"
  - name: Manager
    description: "Superset of Clerk (hierarchical override) plus fiscal-authority operations: store-credit adjustments, customer bans, and consignment payouts."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/customers/{id}/credit-adjustments"
      - "POST /api/customers/{id}/ban"
      - "POST /api/consignments/{id}/transition (PAID_OUT)"
    shared_operations:
      - "Every Clerk operation (Manager can perform all Clerk actions)"
      - "All GET read endpoints"
