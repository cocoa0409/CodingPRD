# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 0999 — Corporate Wellness Program & Incentive Platform
# 9 rules x 2 instances = 18 instances. Every recipe replays clean against
# SCAFFOLD.yaml §1.2/§1.4/§1.5/§1.6. Default logical clock (unset):
# 2026-05-01T00:00:00Z; default program window 2026-01-01..2027-01-01 contains it.
# Standard employer fixture: annual_self_only_premium_cents=120000 (cap 0.30 ->
# 36000), tobacco_surcharge_cents=50000, pmpm_fee_cents=10000,
# coaching_session_fee_cents=7500, k_anonymity_threshold=5, kiosk_capacity=2,
# invoice_approval_limit_cents=5000.
# Standard program fixture: thresholds 500/1500/3000, awards 10000/30000/60000,
# premium_cap_pct=0.30, coaching_required_sessions=4.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_settled_points_balance
        grounds:
          - calculations.points_balance
          - calculations.activity_points_conversion
          - entities.Enrollment.fields.points_balance_provisional
          - entities.Enrollment.fields.points_balance_settled
        distinguishing_aspect: |
          Same accepted activity event yields points_balance_provisional == 100
          while points_balance_settled == 0 on the SAME Enrollment — the
          provisional view counts PROVISIONAL ledger entries, the settled view
          counts POSTED only. Entity domain: points ledger on Enrollment.
        test_recipe:
          setup:
            - "Employer (standard fixture), program ACTIVE (standard fixture), employee, enrollment accepted to ACTIVE; logical clock unset (2026-05-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
          trigger:
            - call: "POST /wellness/activity-events"
              payload: { enrollment_id: "${enr_id}", device_source: "fitbit", external_event_id: "evt-1", activity_type: "STEPS", quantity: 100000, occurred_at: "2026-04-15T10:00:00Z" }
              as: Employee
              as_user_id: "${e1_id}"
              captures: { ev_id: $.data.id, ev_pts: $.data.points_granted }
            - call: "GET /wellness/enrollments/${enr_id}"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "ActivityEvent.${ev_id}.points_granted == 100"
            - "Enrollment.${enr_id}.points_balance_provisional == 100"
            - "Enrollment.${enr_id}.points_balance_settled == 0"

      - name: reasonable_alternative_overrides_standard_award
        grounds:
          - calculations.premium_differential
          - entities.IncentiveAward.fields.applied_variant
          - state_machines.CoachingReferral.ENGAGED_to_DISCHARGED
        distinguishing_aspect: |
          Same settled points (200, tier NONE) produce award_cents == 0 under
          STANDARD but award_cents == 36000 under REASONABLE_ALTERNATIVE for an
          ra_eligible enrollment with a GOALS_MET discharge. Entity domain:
          IncentiveAward money — different domain from the points-ledger
          instance. 36000 = min(60000 gold, round_half_up(0.30*120000)).
        test_recipe:
          setup:
            - "Employer/program ACTIVE (standard fixtures); employee; enrollment ra_eligible=true, ACTIVE; coaching referral RA_REQUEST discharged GOALS_MET after 4 sessions; +200 settled points via manual adjustment"
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}", ra_eligible: true }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
              captures: { enr_v: $.data.version }
            - call: "POST /wellness/enrollments/${enr_id}/adjustments"
              payload: { points_delta: 200, reason: "manual credit", expected_enrollment_version: "${enr_v}" }
              as: BenefitsAdmin
            - call: "POST /wellness/coaching-referrals"
              payload: { enrollment_id: "${enr_id}", reason: "RA_REQUEST" }
              as: BenefitsAdmin
              captures: { ref_id: $.data.id }
            - call: "POST /wellness/coaching-referrals/${ref_id}/engage"
              payload: {}
              as: Coach
              as_user_id: "coach-1"
            - call: "POST /wellness/coaching-referrals/${ref_id}/sessions"
              payload: { session_date: "2026-04-02", duration_minutes: 30 }
              as: Coach
              as_user_id: "coach-1"
            - call: "POST /wellness/coaching-referrals/${ref_id}/sessions"
              payload: { session_date: "2026-04-09", duration_minutes: 30 }
              as: Coach
              as_user_id: "coach-1"
            - call: "POST /wellness/coaching-referrals/${ref_id}/sessions"
              payload: { session_date: "2026-04-16", duration_minutes: 30 }
              as: Coach
              as_user_id: "coach-1"
            - call: "POST /wellness/coaching-referrals/${ref_id}/sessions"
              payload: { session_date: "2026-04-23", duration_minutes: 30 }
              as: Coach
              as_user_id: "coach-1"
            - call: "POST /wellness/coaching-referrals/${ref_id}/discharge"
              payload: { outcome: "GOALS_MET" }
              as: Coach
              as_user_id: "coach-1"
          trigger:
            - call: "POST /wellness/incentive-awards/compute"
              payload: { program_id: "${prog_id}" }
              as: BenefitsAdmin
            - call: "GET /wellness/enrollments/${enr_id}/incentive-awards"
              payload: {}
              as: BenefitsAdmin
              captures: { aw_id: "$.data[0].id" }
          assert:
            - "IncentiveAward.${aw_id}.tier == NONE"
            - "IncentiveAward.${aw_id}.standard_award_cents == 0"
            - "IncentiveAward.${aw_id}.applied_variant == REASONABLE_ALTERNATIVE"
            - "IncentiveAward.${aw_id}.award_cents == 36000"
            - "IncentiveAward.${aw_id}.surcharge_cents == 0"
            - "IncentiveAward.${aw_id}.net_annual_differential_cents == -36000"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: tier_attainment_multi_input_with_cap
        grounds:
          - calculations.tier_attainment
          - calculations.premium_differential
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — settled points
          (1500), HRA existence, best screening targets, tobacco attestation and
          the min(tier_value, cap) clamp combine: SILVER award 30000 with a
          50000 tobacco surcharge stacking to net +20000.
        test_recipe:
          setup:
            - "Employer/program ACTIVE (standard fixtures); employee tobacco_attested=true; enrollment ACTIVE (ra_eligible=false); +1500 settled points; HRA scored LOW (sum 20); no screening"
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01", tobacco_attested: true }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
              captures: { enr_v: $.data.version }
            - call: "POST /wellness/enrollments/${enr_id}/adjustments"
              payload: { points_delta: 1500, reason: "manual credit", expected_enrollment_version: "${enr_v}" }
              as: BenefitsAdmin
            - call: "POST /wellness/hras"
              payload: { enrollment_id: "${enr_id}", answers: [2, 2, 2, 2, 2, 2, 2, 2, 2, 2] }
              as: Employee
              as_user_id: "${e1_id}"
          trigger:
            - call: "POST /wellness/incentive-awards/compute"
              payload: { program_id: "${prog_id}" }
              as: BenefitsAdmin
            - call: "GET /wellness/enrollments/${enr_id}/incentive-awards"
              payload: {}
              as: BenefitsAdmin
              captures: { aw_id: "$.data[0].id" }
          assert:
            - "IncentiveAward.${aw_id}.tier == SILVER"
            - "IncentiveAward.${aw_id}.standard_award_cents == 30000"
            - "IncentiveAward.${aw_id}.award_cents == 30000"
            - "IncentiveAward.${aw_id}.applied_variant == STANDARD"
            - "IncentiveAward.${aw_id}.surcharge_cents == 50000"
            - "IncentiveAward.${aw_id}.net_annual_differential_cents == 20000"

      - name: invoice_member_month_per_line_rounding
        grounds:
          - calculations.vendor_invoice_total
          - entities.VendorInvoice.fields.total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — each MEMBER_MONTH line is
          rounded half-up to integer cents BEFORE summation. Two members at 15
          of 31 days: round(10000*15/31)=4839 each, total 9678; the rejected
          sum-then-round order would yield 9677. Different mode from instance 1
          (which is mode (a)).
        test_recipe:
          setup:
            - "Employer/program ACTIVE (standard fixtures); logical clock 2026-05-17T09:00:00Z; two employees each enrolled and accepted on 2026-05-17 (15 billable days in a 31-day May period); no coaching sessions"
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-17T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr1_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr1_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e2@acme.com", full_name: "E Two", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e2_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e2_id}" }
              as: BenefitsAdmin
              captures: { enr2_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr2_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e2_id}"
          trigger:
            - call: "POST /wellness/vendor-invoices"
              payload: { program_id: "${prog_id}", vendor_name: "WellCo", period_start: "2026-05-01", period_end: "2026-05-31" }
              as: VendorManager
              captures: { inv_id: $.data.id }
          assert:
            - "VendorInvoice.${inv_id}.line_items contains exactly 2 MEMBER_MONTH lines, each amount_cents == 4839"
            - "VendorInvoice.${inv_id}.line_items contains 0 COACHING_SESSION lines"
            - "VendorInvoice.${inv_id}.total_cents == 9678"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: coaching_referral_rerefer_cycle
        grounds:
          - state_machines.CoachingReferral.DISCHARGED_to_REFERRED
          - state_machines.CoachingReferral.DECLINED_to_REFERRED
        distinguishing_aspect: |
          Cyclic machine on CoachingReferral: DISCHARGED -> REFERRED re-enters
          the machine with referral_round == 2 and per-round fields reset
          (sessions_completed 0, outcome null, assigned_coach_id null).
        test_recipe:
          setup:
            - "Employer/program ACTIVE (standard fixtures); employee; enrollment ACTIVE; MANUAL referral discharged GOALS_MET after 4 sessions"
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
            - call: "POST /wellness/coaching-referrals"
              payload: { enrollment_id: "${enr_id}", reason: "HIGH_RISK" }
              as: BenefitsAdmin
              captures: { ref_id: $.data.id }
            - call: "POST /wellness/coaching-referrals/${ref_id}/engage"
              payload: {}
              as: Coach
              as_user_id: "coach-1"
            - call: "POST /wellness/coaching-referrals/${ref_id}/sessions"
              payload: { session_date: "2026-04-02", duration_minutes: 30 }
              as: Coach
              as_user_id: "coach-1"
            - call: "POST /wellness/coaching-referrals/${ref_id}/sessions"
              payload: { session_date: "2026-04-09", duration_minutes: 30 }
              as: Coach
              as_user_id: "coach-1"
            - call: "POST /wellness/coaching-referrals/${ref_id}/sessions"
              payload: { session_date: "2026-04-16", duration_minutes: 30 }
              as: Coach
              as_user_id: "coach-1"
            - call: "POST /wellness/coaching-referrals/${ref_id}/sessions"
              payload: { session_date: "2026-04-23", duration_minutes: 30 }
              as: Coach
              as_user_id: "coach-1"
            - call: "POST /wellness/coaching-referrals/${ref_id}/discharge"
              payload: { outcome: "GOALS_MET" }
              as: Coach
              as_user_id: "coach-1"
          trigger:
            - call: "POST /wellness/coaching-referrals/${ref_id}/rerefer"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "CoachingReferral.${ref_id}.status == REFERRED"
            - "CoachingReferral.${ref_id}.referral_round == 2"
            - "CoachingReferral.${ref_id}.sessions_completed == 0"
            - "CoachingReferral.${ref_id}.outcome == null"
            - "CoachingReferral.${ref_id}.assigned_coach_id == null"

      - name: enrollment_parallel_state_dimensions
        grounds:
          - state_machines.Enrollment.ACTIVE_to_SUSPENDED
          - state_machines.Enrollment.VERIFIED_to_FLAGGED
        distinguishing_aspect: |
          Parallel state dimensions on Enrollment: verification_status
          (PENDING/VERIFIED/FLAGGED, driven by HRA/screening events) evolves
          independently of participation_status (driven by accept/suspend) — a
          FLAGGED member can be SUSPENDED and REINSTATED without touching the
          verification axis.
        test_recipe:
          setup:
            - "Employer/program ACTIVE (standard fixtures); employee; enrollment ACTIVE; HRA scored (verification VERIFIED); screening RESULTED with targets_met == 1 (verification FLAGGED)"
          setup_api_calls:
            - call: "POST /wellness/employers"
              payload: { name: "Acme", annual_self_only_premium_cents: 120000, tobacco_surcharge_cents: 50000, pmpm_fee_cents: 10000, coaching_session_fee_cents: 7500, k_anonymity_threshold: 5, kiosk_capacity: 2, invoice_approval_limit_cents: 5000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wellness/programs"
              payload: { employer_id: "${emp_id}", name: "PY2026", plan_year_start: "2026-01-01", plan_year_end: "2027-01-01", bronze_threshold: 500, silver_threshold: 1500, gold_threshold: 3000, bronze_award_cents: 10000, silver_award_cents: 30000, gold_award_cents: 60000, premium_cap_pct: 0.30, coaching_required_sessions: 4 }
              as: BenefitsAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /wellness/programs/${prog_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/employees"
              payload: { employer_id: "${emp_id}", email: "e1@acme.com", full_name: "E One", department: "ENG", hire_date: "2024-03-01" }
              as: BenefitsAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /wellness/enrollments"
              payload: { program_id: "${prog_id}", employee_id: "${e1_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /wellness/enrollments/${enr_id}/accept"
              payload: {}
              as: Employee
              as_user_id: "${e1_id}"
            - call: "POST /wellness/hras"
              payload: { enrollment_id: "${enr_id}", answers: [2, 2, 2, 2, 2, 2, 2, 2, 2, 2] }
              as: Employee
              as_user_id: "${e1_id}"
            - call: "POST /wellness/biometric-screenings"
              payload: { enrollment_id: "${enr_id}", clinic_location: "HQ", slot_start: "2026-04-20T10:00:00Z", slot_end: "2026-04-20T10:30:00Z" }
              as: Employee
              as_user_id: "${e1_id}"
              captures: { scr_id: $.data.id }
            - call: "POST /wellness/biometric-screenings/${scr_id}/result"
              payload: { bmi: 35.0, systolic_bp: 150, total_cholesterol: 240, glucose: 95 }
              as: BenefitsAdmin
          trigger:
            - call: "POST /wellness/enrollments/${enr_id}/suspend"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /wellness/enrollments/${enr_id}/reinstate"
              payload: {}
              as: BenefitsAdmin
            - call: "GET /wellness/enrollments/${enr_id}"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "BiometricScreening.${scr_id}.targets_met == 1"
            - "After suspend: Enrollment.${enr_id}.participation_status == SUSPENDED and verification_status == FLAGGED"
            - "After reinstate: Enrollment.${enr_id}.participation_status == ACTIVE and verification_status == FLAGGED (verification axis untouched)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: activity_ingest_transitive_cascade
        grounds:
          - state_machines.ChallengeParticipation.JOINED_to_COMPLETED
          - calculations.challenge_progress
          - calculations.activity_points_conversion
        distinguishing_aspect: |
          Depth-4 chain from POST /wellness/activity-events: event acceptance
          creates an EARNED ledger entry (hop 1) which recomputes the
          enrollment balance (hop 2) which recomputes participation progress
          and completes it at exactly the 100000 goal (hop 3) which creates a
          BONUS ledger entry and bumps challenge.completed_count (hop 4).
        test_recipe:
          setup:
