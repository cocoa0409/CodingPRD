              as: SystemOperator
              captures: { il_id: $.data.id }
            - call: "POST /data-subjects"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", subject_type: "EMPLOYEE", external_ref: "EMP-0001", preferred_locale: "en" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /consent-records"
              payload: { data_subject_id: "00000000-0000-4000-8000-00000000000a", asset_id: "00000000-0000-4000-8000-00000000000b", locale: "en" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { first_err: $.data.error_id }
            - call: "POST /consent-records"
              payload: { data_subject_id: "${s1_id}", asset_id: "00000000-0000-4000-8000-00000000000b", locale: "en" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { second_err: $.data.error_id }
          assert:
            - "First trigger: HTTP 404 with ${first_err} == ERR_SUBJECT_NOT_FOUND, not ERR_ASSET_NOT_FOUND"
            - "Second trigger: HTTP 404 with ${second_err} == ERR_ASSET_NOT_FOUND once the subject resolves"
            - "No ConsentRecord row is created by either call: GET /consent-records with data_subject_id ${s1_id} returns total_count 0"

