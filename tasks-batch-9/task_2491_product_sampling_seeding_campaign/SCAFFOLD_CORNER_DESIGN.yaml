            - "PurchaseMatch.${pm_below_id}.qualified == false"
            - "PurchaseMatch.${pm_at_id}.purchased_at == 2026-10-30T00:00:00Z"
            - "GET /enrollments/${e1_id}/purchase-matches returns total_count == 2"

      - name: kit_assembly_unit_cost_rounds_per_line_then_sums
        claim_type: correct_result
        grounds:
