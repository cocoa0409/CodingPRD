              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { stock_order_id: $.data.id }
            - call: "POST /dealer-network/orders/${stock_order_id}/approve"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/orders/${stock_order_id}/fulfill"
              payload: {}
              as: RegionManager
            - call: "POST /dealer-network/orders/${stock_order_id}/invoice"
              payload: {}
              as: RegionManager
