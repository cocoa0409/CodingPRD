            - { call: "POST /paper-machines", payload: { name: "PM2", wire_width_mm: 2800, max_tons_per_hour: 12.00, changeover_buffer_minutes: 30, steam_tph_per_ton: 1.200 }, as: MillPlanner, as_user_id: "mp_1", captures: { pm2_id: "$.data.id", pm2_v1: "$.data.version" } }
            - { call: "POST /customers", payload: { name: "Softline Tissue", allocation_priority_tier: 2, max_roll_diameter_mm: 1400, max_roll_width_mm: 2200, wrap_spec: "KRAFT_ONLY" }, as: MillPlanner, as_user_id: "mp_1", captures: { cust_id: "$.data.id" } }
            - { call: "POST /suppliers", payload: { name: "Northgate Recovered", freight_per_ton: 18.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { sup_id: "$.data.id" } }
            - { call: "POST /fiber-purchase-orders", payload: { supplier_id: "${sup_id}", fiber_grade_code: "DLK_37", contracted_tons: 150.00, index_basis: "PRIOR_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }, as: FiberBuyer, as_user_id: "fb_1", captures: { po_id: "$.data.id", po_v1: "$.data.version" } }
            - { call: "POST /fiber-purchase-orders/${po_id}/price", payload: { expected_purchase_order_version: "${po_v1}" }, as: FiberBuyer, as_user_id: "fb_1" }
            - { call: "POST /fiber-purchase-orders/${po_id}/confirm", payload: {}, as: Supplier, as_user_id: "${sup_id}" }
            - { call: "POST /fiber-purchase-orders/${po_id}/receipts", payload: { truck_reference: "TRK-D-001", sublots: [ { sublot_no: 1, gross_tons: 12.000, tare_tons: 1.000, moisture_pct: 10.00, contamination_pct: 1.50 }, { sublot_no: 2, gross_tons: 10.000, tare_tons: 1.000, moisture_pct: 12.00, contamination_pct: 1.80 } ] }, as: QualityLab, as_user_id: "ql_sample", captures: { rcpt_id: "$.data.id" } }
            - { call: "POST /fiber-receipts/${rcpt_id}/disposition", payload: { disposition: "ACCEPT" }, as: QualityLab, as_user_id: "ql_dispo" }
            - { call: "GET /fiber-inventory-lots", payload: { receipt_id: "${rcpt_id}" }, as: MachineOperator, as_user_id: "mo_2", captures: { lot_id: "$.data[0].id" } }
            - { call: "POST /pulp-batches", payload: { pulper_line: "DIP_LINE", target_product_code: "TIS_16", furnish_lines: [ { inventory_lot_id: "${lot_id}", tons_charged: 15.000 } ] }, as: MachineOperator, as_user_id: "mo_2", captures: { pb_id: "$.data.id" } }
