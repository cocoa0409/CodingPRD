              payload: {}
              as: CheckoutService
          trigger:
            - call: "GET /fraud/devices/${dev_id}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust2_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { r4_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${r4_id}/score"
              payload: {}
              as: CheckoutService
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust3_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
