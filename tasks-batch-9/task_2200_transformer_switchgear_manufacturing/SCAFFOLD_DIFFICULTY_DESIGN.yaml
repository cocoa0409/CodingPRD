            - call: "GET /component-allocations/${alloc_a}"
              payload: {}
              as: MaterialsPlanner
          assert:
            - "after alloc_a RESERVED (6): quantity_on_hand 10, quantity_reserved 6, quantity_committed 0, quantity_consumed 0, quantity_available 4; S = on_hand + consumed = 10"
            - "after commit alloc_a: quantity_reserved 0, quantity_committed 6, quantity_available STILL 4 and quantity_on_hand STILL 10 -- COMMIT is a pure internal move, S = 10 unchanged, and EngineeredOrder.${ord_a}.fulfillment_status advances PLANNING -> MATERIAL_ALLOCATED"
            - "after the +2 receipt: quantity_on_hand 12, quantity_available 6, S = 12 -- a receipt is the ONLY operation permitted to raise S"
            - "after alloc_b RESERVED (6, order B): quantity_reserved 6, quantity_available 0, S = 12"
            - "alloc_c (order A, quantity 2, priority_class 1) -> 201 despite quantity_available == 0: shortfall = 2 - 0 = 2 and preemption_victim_selector admits alloc_b (RESERVED, priority_class 4 > 1, engineered_order_id != order A, component PREEMPTIBLE), so victims = [alloc_b] -- the shortest prefix whose summed quantity 6 >= 2, over-freeing 6 units for a 2-unit shortfall"
            - "ComponentAllocation.${alloc_b}.status == PREEMPTED with preempted_for_allocation_id == ${alloc_c}; EngineeredOrder.${ord_b}.production_posture == RESTRICTED with MATERIAL_PREEMPTED in posture_reason_codes"
            - "after the preemption: quantity_reserved 2 (only alloc_c), quantity_committed 6, quantity_available 4, quantity_on_hand 12, S = 12 -- PREEMPTED rows contribute to NO term, so the 6 preempted units are neither reserved nor available-adjusted twice"
            - "after releasing alloc_c: status RELEASED, release_penalty_cents == 0 (a RESERVED release never accrues a penalty, and lead_time_days 20 <= 30 is the zero tier anyway); quantity_reserved 0, quantity_available 6, quantity_on_hand 12, S = 12"
            - "EngineeredOrder.${ord_a}.fulfillment_status stays MATERIAL_ALLOCATED after that release because alloc_a is still COMMITTED -- the MATERIAL_ALLOCATED -> PLANNING revert is driven by the absence of COMMITTED rows, not by any release"
            - "after the FAT concludes PASS: ComponentAllocation.${alloc_a}.status == CONSUMED, quantity_committed 0, quantity_consumed 6, quantity_on_hand 6, quantity_available 6, quantity_reserved 0"
            - "S is STILL 12 across the consume (6 on_hand + 6 consumed) -- CONSUME is the only operation that moves units between the two terms of the conserved quantity"
            - "the identity quantity_on_hand == quantity_available + quantity_reserved + quantity_committed holds at every one of the seven observations: 10==4+6+0, 10==4+0+6, 12==6+0+6, 12==0+6+6, 12==4+2+6, 12==6+0+6, 6==6+0+0"

