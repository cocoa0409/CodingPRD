              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Yard", zone_type: "TURF", area_sqft: 4000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "POST /subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", billing_mode: "PER_VISIT", season_start_date: "2026-05-01", season_end_date: "2026-08-31", auto_renew: false }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "GET /subscriptions/${sub_id}"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
          assert:
            - "Subscription ${sub_id}.status == ACTIVE (not auto-skipped, because default clock 2026-04-01 is before season_end_date)"
            - "GET /subscriptions/${sub_id}/visits total_count == 6"

