        distinguishing_aspect: "For an entity-backed Agent the scope rule covers item reads, list reads and writes, and an UNFILTERED list read is a violation rather than an empty page. Because it sits at priority 3 it also pre-empts the priority-8 OCC check: proposing an adjustment on another agent's statement with an expected_statement_version that the setup has already made stale still reports ERR_AGENT_SCOPE_VIOLATION, never ERR_STALE_STATEMENT_VERSION."
        test_recipe:
