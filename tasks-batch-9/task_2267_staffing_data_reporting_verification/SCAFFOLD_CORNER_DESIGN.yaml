          assert:
            - "response code is 409 with data.error_id == ERR_SUBMISSION_STATE_INVALID"
            - "QuarterlySubmission.${sub}.status is still DRAFT with accepted_at == null and audit_support_score == null"
            - "Facility.${fac}.posture == REPORTING_OPEN"

      - name: reopen_after_period_close_is_blocked_by_period_closed
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.QuarterlySubmission.ACCEPTED_to_FINAL
          - validations[priority 17 ERR_PERIOD_CLOSED]
          - endpoints[POST /reporting-periods/{id}/close]
        distinguishing_aspect: "Closing the period drives the ACCEPTED submission to the terminal state FINAL; the reopen that previously succeeded is now refused, and because the period check sits at priority 17 the reported error is ERR_PERIOD_CLOSED rather than the priority 18 state error."
        test_recipe:
          setup:
            - "An ACCEPTED 2026Q2 submission at the default clock, then POST /reporting-periods/{id}/close applied to 2026Q2"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_pr_0401
            - *k_entry_0401
            - *k_census_0401
            - *k_reconcile_c1
            - *k_verify_e1
            - *k_validate
            - *k_submit
            - *k_accept
            - call: "POST /reporting-periods/${per}/close"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /submissions/${sub}/reopen"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "after the close, ReportingPeriod.${per}.status == CLOSED and QuarterlySubmission.${sub}.status == FINAL"
            - "response code is 409 with data.error_id == ERR_PERIOD_CLOSED"
            - "QuarterlySubmission.${sub}.amendment_index is still 0 and amendment_surcharge_cents is still 0"
            - "Facility.${fac}.outstanding_surcharge_cents == 0"

      - name: validate_twice_second_call_rejected
        claim_type: idempotency
        grounds:
          - validations[priority 18 ERR_SUBMISSION_STATE_INVALID]
          - state_machines.QuarterlySubmission.DRAFT_to_VALIDATED
        distinguishing_aspect: "validate declares a from-set of DRAFT only, so repeating the same trigger from VALIDATED is refused instead of being silently absorbed; the finding set from the first pass is left untouched."
        test_recipe:
          setup:
