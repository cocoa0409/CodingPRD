          The ProcessorNotification ack interval uses a DIFFERENT interval geometry — a per-processor
          sla_ack_hours buffer added to dispatched_at — on a different resource (Processor). With
          sla_ack_hours=24 and dispatched_at 2026-01-10T10:00:00Z, ack_deadline is 2026-01-11T10:00:00Z;
