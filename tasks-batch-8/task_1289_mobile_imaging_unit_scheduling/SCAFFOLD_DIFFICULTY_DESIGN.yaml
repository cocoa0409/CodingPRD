        distinguishing_aspect: |
          BillingStatement runs a revision cycle FINALIZED -> DISPUTED -> FINALIZED on the
          BillingStatement entity, with the ADJUST branch rewriting final_amount_cents to
          450000. Distinct entity from the ImageStudy retry cycle of the sibling instance.
