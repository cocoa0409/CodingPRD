scaffold_corner_design:

  # =============================================================================================
  # SECTION 1 — entities
  # Walks the claim-extraction guide's Table-1 rows (Creation, Retrieval, Listing, Not Found,
  # Required Fields, Defaults, Computed Fields, System Fields, Type Constraints, Immutability,
  # Parent Relationships) plus the `graph` entity-topology row, against §1.1's 14 entities.
  # =============================================================================================
  - section: entities
    instances:
      - name: intersection_created_with_every_declared_input_field
        claim_type: creation
        grounds:
          - entities.Intersection
          - endpoints[POST /signal-ops/intersections]
          - calculations.intersection_operational_posture
          - calculations.intersection_timing_plan_age_days
        distinguishing_aspect: "POST with all eight declared inputs returns 201 and a body carrying every §1.1 Intersection field, including the four priority-budget fields at 0 and timing_plan_age_days at NEVER_RETIMED_AGE_DAYS 3650."
        test_recipe:
          setup:
            - "Empty database; clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "ATC_CABINET", detection_status: "FULL", comm_status: "ONLINE", aps_installed: true, walking_speed_standard: "EXTENDED_3_0_FPS", pedestrian_recall: true, max_cycle_length_sec: 180 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id, i1_version: $.data.version, i1_name: $.data.location_name, i1_ctrl: $.data.controller_type, i1_aps: $.data.aps_installed, i1_speed: $.data.walking_speed_standard, i1_recall: $.data.pedestrian_recall, i1_maxcycle: $.data.max_cycle_length_sec, i1_posture: $.data.operational_posture, i1_age: $.data.timing_plan_age_days, i1_retimed: $.data.last_retimed_at, i1_cycle: $.data.deployed_coordinated_cycle_sec, i1_budget: $.data.priority_budget_sec, i1_granted: $.data.granted_priority_extension_total_sec, i1_unalloc: $.data.unallocated_priority_budget_sec }
          assert:
            - "HTTP 201"
            - "${i1_id} is a non-empty string and ${i1_version} == 1"
            - "${i1_name} == Main St @ 1st Ave, ${i1_ctrl} == ATC_CABINET, ${i1_aps} == true, ${i1_speed} == EXTENDED_3_0_FPS, ${i1_recall} == true, ${i1_maxcycle} == 180"
            - "${i1_posture} == READY"
            - "${i1_age} == 3650 and ${i1_retimed} == null"
            - "${i1_cycle} == null, ${i1_budget} == 0, ${i1_granted} == 0, ${i1_unalloc} == 0"
            - "created_at and updated_at are present and equal 2026-08-01T00:00:00Z"

      - name: corridor_retrieval_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds:
          - endpoints[GET /signal-ops/corridors/{id}]
          - entities.Corridor
        distinguishing_aspect: "GET /signal-ops/corridors/{id} after one screen returns the same priority_score, avg_plan_age_days, member_count and screened_at that the screen response reported — the read path derives nothing extra and loses nothing."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor c1 (ARTERIAL, annual_volume_change_pct 20.0) has one READY never-retimed member and has been screened once, scoring 91.25."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET" }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { screen_score: $.data.priority_score, screen_age: $.data.avg_plan_age_days, screen_members: $.data.member_count, screen_at: $.data.screened_at, screen_version: $.data.version }
          trigger:
            - call: "GET /signal-ops/corridors/${c1_id}"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { read_score: $.data.priority_score, read_age: $.data.avg_plan_age_days, read_members: $.data.member_count, read_at: $.data.screened_at, read_status: $.data.selection_status, read_variant: $.data.priority_score_variant, read_version: $.data.version }
          assert:
            - "HTTP 200"
            - "${read_score} == 91.25 == ${screen_score}"
            - "${read_age} == 3650.00 == ${screen_age}"
            - "${read_members} == 1 == ${screen_members}"
            - "${read_at} == 2026-08-01T00:00:00Z == ${screen_at}"
            - "${read_status} == SCREENED and ${read_variant} == SCREENING"
            - "${read_version} == ${screen_version} (a GET never bumps version)"

      - name: intersections_list_returns_pagination_envelope_and_honours_filters
        claim_type: listing
        grounds:
          - endpoints[GET /signal-ops/intersections]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three intersections stored, GET /signal-ops/intersections?limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and the operational_posture=BLOCKED filter narrows the same collection to the single OFFLINE intersection."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Three intersections exist: two READY (ONLINE/FULL) and one BLOCKED (comm_status OFFLINE)."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET" }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 2nd Ave", controller_type: "TS2_CABINET" }
              as: SignalOpsAdmin
              captures: { i2_id: $.data.id }
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 3rd Ave", controller_type: "LEGACY_170", comm_status: "OFFLINE" }
              as: SignalOpsAdmin
              captures: { i3_id: $.data.id, i3_posture: $.data.operational_posture }
          trigger:
            - call: "GET /signal-ops/intersections"
              payload: { limit: 2, offset: 0 }
              as: SignalOpsAdmin
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /signal-ops/intersections"
              payload: { limit: 2, offset: 2 }
              as: SignalOpsAdmin
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /signal-ops/intersections"
              payload: { operational_posture: "BLOCKED" }
              as: SignalOpsAdmin
              captures: { blocked_first: "$.data[0].id", blocked_first_posture: "$.data[0].operational_posture" }
          assert:
            - "${i3_posture} == BLOCKED"
            - "page 1 carries exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "page 2 carries exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "the three ids across both pages are exactly ${i1_id}, ${i2_id}, ${i3_id} with no duplicates — ${page1_first}, ${page1_second} and ${page2_first} are pairwise distinct"
            - "the filtered call carries exactly 1 row with ${blocked_first} == ${i3_id} and ${blocked_first_posture} == BLOCKED, total_count == 1"
            - "response_type == array on all three calls"

      - name: get_corridor_with_unknown_id_returns_corridor_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_CORRIDOR_NOT_FOUND
          - validations[priority=20]
          - endpoints[GET /signal-ops/corridors/{id}]
        distinguishing_aspect: "A syntactically valid but unknown corridor id on the single-resource GET returns HTTP 404 with error_id ERR_CORRIDOR_NOT_FOUND, not an empty 200 body and not the generic ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database; clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "GET /signal-ops/corridors/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: SignalOpsAdmin
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP 404"
            - "${err} == ERR_CORRIDOR_NOT_FOUND"
            - "${msg} is a non-empty string and response_type == error"

      - name: corridor_create_missing_jurisdiction_class_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /signal-ops/corridors]
          - entities.Corridor.fields.jurisdiction_class
          - validations[priority=30]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "jurisdiction_class has source input and no default, so omitting it is rejected 422 ERR_INVALID_REQUEST and no Corridor row is created, whereas annual_volume_change_pct (default 0) may be omitted freely."
        test_recipe:
          setup:
            - "Empty database; clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd" }
              as: SignalOpsAdmin
              captures: { err: $.data.error_id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "COLLECTOR" }
              as: SignalOpsAdmin
              captures: { c1_class: $.data.jurisdiction_class, c1_vol: $.data.annual_volume_change_pct }
          assert:
            - "the first call returns HTTP 422 with ${err} == ERR_INVALID_REQUEST"
            - "GET /signal-ops/corridors immediately after the refusal has total_count == 0"
            - "the second call returns HTTP 201 with ${c1_class} == COLLECTOR and ${c1_vol} == 0"

      - name: intersection_defaults_applied_when_optional_inputs_are_omitted
        claim_type: defaults
        grounds:
          - entities.Intersection.fields.detection_status
          - entities.Intersection.fields.comm_status
          - entities.Intersection.fields.aps_installed
          - entities.Intersection.fields.walking_speed_standard
          - entities.Intersection.fields.pedestrian_recall
          - entities.Intersection.fields.max_cycle_length_sec
        distinguishing_aspect: "Creating an Intersection with only the two required inputs yields detection_status FULL, comm_status ONLINE, aps_installed false, walking_speed_standard STD_3_5_FPS, pedestrian_recall false and max_cycle_length_sec 150 — every §1.1 default, not nulls."
        test_recipe:
          setup:
            - "Empty database; clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Elm St @ 4th Ave", controller_type: "LEGACY_170" }
              as: SignalOpsAdmin
              captures: { det: $.data.detection_status, comm: $.data.comm_status, aps: $.data.aps_installed, speed: $.data.walking_speed_standard, recall: $.data.pedestrian_recall, maxcycle: $.data.max_cycle_length_sec, posture: $.data.operational_posture }
          assert:
            - "HTTP 201"
            - "${det} == FULL"
            - "${comm} == ONLINE"
            - "${aps} == false"
            - "${speed} == STD_3_5_FPS"
            - "${recall} == false"
            - "${maxcycle} == 150"
            - "${posture} == READY (the defaults compose to the healthy posture)"

      - name: turning_movement_count_computed_fields_ignore_client_supplied_values
        claim_type: computed_fields
        grounds:
          - entities.TurningMovementCount.fields.critical_flow_ratio_sum
          - entities.TurningMovementCount.fields.recommended_cycle_sec
          - calculations.intersection_recommended_cycle_length
          - endpoints[POST /signal-ops/intersections/{id}/turning-movement-counts]
        distinguishing_aspect: "critical_flow_ratio_sum and recommended_cycle_sec are source computed and absent from the endpoint's input list, so phase_volumes {1:350, 2:500, 4:250, 6:180} always yields 0.7111 and 105 regardless of any values a client tries to smuggle in the body."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor c1 (ARTERIAL, annual_volume_change_pct 20.0) is SELECTED with a single READY member i1 and project p1 is in DATA_COLLECTION."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Programme corridor" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-15T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { cfr: $.data.critical_flow_ratio_sum, rec: $.data.recommended_cycle_sec }
          assert:
            - "HTTP 201"
            - "${cfr} == 0.7111 (350+500+250+180 == 1280 over a saturation flow of 1800, rounded to 4 dp)"
            - "${rec} == 105 (Webster with 4 phases at 4.0 s lost time, ceiled to the next multiple of 5 and clamped into [60, 150])"
            - "no field named critical_flow_ratio_sum or recommended_cycle_sec appears in the endpoint's declared input list, so a body value for either is ignored rather than honoured"

      - name: travel_time_run_recorded_at_is_system_assigned_from_the_logical_clock
        claim_type: system_fields
        grounds:
          - entities.TravelTimeRun.fields.recorded_at
          - endpoints[POST /signal-ops/retiming-projects/{id}/travel-time-runs]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "recorded_at is source system and tracks the logical clock at insert time, so two runs recorded either side of a clock move carry different recorded_at values even though both carry back-dated started_at values in July."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor c1 is SELECTED with a single READY member i1; project p1 is in DATA_COLLECTION."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET" }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Programme corridor" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-07-15T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { run1_recorded: $.data.recorded_at, run1_started: $.data.started_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "SB", started_at: "2026-07-15T09:00:00Z", duration_sec: 340, stops_count: 7, arrivals_on_green_count: 3, total_arrivals: 18 }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { run2_recorded: $.data.recorded_at, run2_started: $.data.started_at }
          assert:
            - "${run1_recorded} == 2026-08-01T00:00:00Z while ${run1_started} == 2026-07-15T09:00:00Z"
            - "${run2_recorded} == 2026-08-03T00:00:00Z while ${run2_started} == 2026-07-15T09:00:00Z"
            - "recorded_at is never echoed from the request body: neither call supplied it"

      - name: timing_plan_type_constraints_reject_bad_enum_and_inverted_tod_window
        claim_type: type_constraints
        grounds:
          - entities.TimingPlan.fields.tod_period
          - entities.TimingPlan.fields.tod_end_min
          - entities.TimingPlan.fields.cycle_length_sec
          - validations[priority=30]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Three separate type-constraint violations on the same endpoint — an out-of-enum tod_period, tod_end_min <= tod_start_min, and cycle_length_sec 50 below the 60 floor — each return 422 ERR_INVALID_REQUEST and create nothing, while the corrected body succeeds."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Project p1 on corridor c1 (single READY member i1) has been advanced to PLAN_DEVELOPMENT, so plans may be drafted."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Programme corridor" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-15T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-07-15T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_v1: $.data.version }
          trigger:
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "NIGHT_OWL", tod_start_min: 360, tod_end_min: 540, cycle_length_sec: 90, expected_project_version: "${p1_v1}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { err_enum: $.data.error_id }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "AM_PEAK", tod_start_min: 540, tod_end_min: 540, cycle_length_sec: 90, expected_project_version: "${p1_v1}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { err_window: $.data.error_id }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "AM_PEAK", tod_start_min: 360, tod_end_min: 540, cycle_length_sec: 50, expected_project_version: "${p1_v1}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { err_cycle: $.data.error_id }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "AM_PEAK", tod_start_min: 360, tod_end_min: 540, cycle_length_sec: 90, expected_project_version: "${p1_v1}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { ok_status: $.data.status, ok_drafted: $.data.drafted_cycle_length_sec }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST with HTTP 422"
            - "${err_window} == ERR_INVALID_REQUEST with HTTP 422 (tod_end_min must be strictly greater than tod_start_min)"
            - "${err_cycle} == ERR_INVALID_REQUEST with HTTP 422 (cycle_length_sec floor is 60)"
            - "the fourth call returns HTTP 201 with ${ok_status} == DRAFT and ${ok_drafted} == 90"
            - "GET /signal-ops/retiming-projects/${p1_id}/timing-plans has total_count == 1, so none of the three refusals created a row"
            - "RetimingProject.${p1_id}.version is unchanged by the three refusals — all three carried the same ${p1_v1} and the fourth still succeeded with it"

      - name: corridor_member_is_immutable_with_no_version_and_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.CorridorMember
          - endpoints[GET /signal-ops/corridors/{id}/members]
          - endpoints[POST /signal-ops/corridors/{id}/members]
        distinguishing_aspect: "CorridorMember declares common_fields false, so its rows carry no version/updated_at and §1.5 exposes only a create and two list reads for it — correcting a member means adding the next sequence_index, never editing an existing row."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor c1 has two READY member intersections at sequence_index 1 and 2."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
