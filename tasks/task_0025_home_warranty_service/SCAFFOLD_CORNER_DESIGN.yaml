scaffold_corner_design:

  # =====================================================================
  # Entities (§1.1) — creation, retrieval, listing, not-found, defaults,
  # type constraints, immutability, FK integrity.
  # =====================================================================
  - section: entities
    instances:

      - name: contract_package_creation_minimal_required_fields
        claim_type: Creation
        grounds:
          - entities.ContractPackage
        distinguishing_aspect: |
          POST /contract-packages with all required fields succeeds and the
          response carries the full record including server-stamped id,
          created_at, updated_at, version=1, and status defaulted to ACTIVE.
        test_recipe:
          setup:
            - "Empty database. Server clock at 2026-01-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /contract-packages"
              payload: { code: "BASIC", name: "Basic Package", annual_premium_cents: 30000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 3 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id, pkg_status: $.data.status, pkg_version: $.data.version }
          assert:
            - "Response HTTP status == 201"
            - "ContractPackage.${pkg_id}.status == 'ACTIVE'"
            - "ContractPackage.${pkg_id}.version == 1"
            - "ContractPackage.${pkg_id}.code == 'BASIC'"

      - name: customer_retrieval_by_id
        claim_type: Retrieval
        grounds:
          - entities.Customer
        distinguishing_aspect: |
          GET /customers/{id} returns the row created by POST /customers,
          field-for-field.
        test_recipe:
          setup:
            - "One Customer registered."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "alice@example.com", full_name: "Alice", home_address: "1 Main St" }
              as: Anonymous
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /customers/${c_id}"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { got_email: $.data.email, got_name: $.data.full_name }
          assert:
            - "Customer.${c_id}.email == 'alice@example.com'"
            - "Customer.${c_id}.full_name == 'Alice'"

      - name: contract_listing_paginated
        claim_type: Listing
        grounds:
          - entities.Contract
        distinguishing_aspect: |
          GET /contracts returns a paginated response with limit, offset,
          total_count, and has_more meta fields per the response envelope.
        test_recipe:
          setup:
            - "Three Contracts on one ContractPackage for one Customer."
          setup_api_calls:
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "u@example.com", full_name: "U", home_address: "1 Pine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /contracts"
              payload: { customer_id: "${cust_id}", limit: 2, offset: 0 }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Response data is an array of length 2 (limit honored)"
            - "Response meta carries total_count == 3 and has_more == true"

      - name: contract_get_non_existent_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          GET /contracts/{id} with a never-issued UUID returns ERR_NOT_FOUND
          (404).
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_NOT_FOUND'"
            - "Response HTTP status == 404"

      - name: contract_package_create_missing_required_field
        claim_type: Required Fields
        grounds:
          - validations[priority=14]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /contract-packages without service_fee_cents fails with
          ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /contract-packages"
              payload: { code: "BAD", name: "Bad", annual_premium_cents: 30000, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 3 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_INVALID_REQUEST'"
            - "Response HTTP status == 400"

      - name: covered_item_pre_existing_flag_default_false
        claim_type: Defaults
        grounds:
          - entities.CoveredItem.fields.pre_existing_flag
        distinguishing_aspect: |
          POST /covered-items with pre_existing_flag omitted defaults the
          field to false.
        test_recipe:
          setup:
            - "An ACTIVE Contract."
          setup_api_calls:
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "v@example.com", full_name: "V", home_address: "9 Pine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "HVAC", brand: "B", model: "M", install_year: 2022 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_pref: $.data.pre_existing_flag }
          assert:
            - "CoveredItem.pre_existing_flag == false (default applied)"

      - name: covered_item_category_enum_validation
        claim_type: Type Constraints
        grounds:
          - entities.CoveredItem.fields.category
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /covered-items with category outside the declared enum set
          returns ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "An ACTIVE Contract."
          setup_api_calls:
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "w@example.com", full_name: "W", home_address: "8 Pine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "BLENDER", brand: "B", model: "M", install_year: 2022 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_invalid_enum: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_INVALID_REQUEST' (category 'BLENDER' not in declared enum)"

      - name: contract_create_with_nonexistent_package_id
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          POST /contracts with a package_id that does not resolve to a row
          returns ERR_NOT_FOUND (404). Validates FK integrity on creation.
        test_recipe:
          setup:
            - "A Customer."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "x@example.com", full_name: "X", home_address: "7 Pine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "00000000-0000-4000-8000-000000000000" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_not_found: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_NOT_FOUND'"
            - "Response HTTP status == 404"

      - name: renewal_reminder_immutable_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.RenewalReminder
        distinguishing_aspect: |
          RenewalReminder has common_fields:false (no version, no
          updated_at). §1.5 declares no PUT/PATCH/DELETE for RenewalReminder
          — the event row is append-only by absence-of-write-endpoint.
        test_recipe:
          setup:
            - "An ACTIVE Contract that has been ticked into EXPIRING_SOON so a RenewalReminder exists."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "y@example.com", full_name: "Y", home_address: "6 Pine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-12-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/tick"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /contracts/${contract_id}/renewal-reminders"
              payload: {}
              as: PlatformAdmin
              captures: { first_rem_sent: "$.data[0].sent_utc", first_rem_days: "$.data[0].days_to_expiry" }
          assert:
            - "Response array length == 1"
            - "RenewalReminder.sent_utc == '2026-12-12T00:00:00.000Z'"
            - "RenewalReminder.days_to_expiry == 20 (floor((2027-01-01 - 2026-12-12)/86400) = 20)"

  # =====================================================================
  # State Machines (§1.2) — invalid transitions, initial state, terminal
  # lockdown, side effect execution.
  # =====================================================================
  - section: state_machines
    instances:

      - name: contract_cancel_from_terminal_expired_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Contract
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          POST /contracts/{id}/cancel against a Contract in terminal state
          EXPIRED returns ERR_INVALID_STATE. Terminal state lockdown.
        test_recipe:
          setup:
            - "A Contract that has been auto-transitioned to EXPIRED via /_clock/tick."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "z@example.com", full_name: "Z", home_address: "5 Pine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/tick"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /contracts/${contract_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_INVALID_STATE'"
            - "Response HTTP status == 409"

      - name: claim_initial_state_submitted_on_create
        claim_type: Initial State
        grounds:
          - state_machines.ClaimTicket
          - entities.ClaimTicket.fields.status
        distinguishing_aspect: |
          A newly created ClaimTicket starts in status == 'SUBMITTED'.
        test_recipe:
          setup:
            - "An ACTIVE Contract with one CoveredItem."
          setup_api_calls:
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "init@example.com", full_name: "Init", home_address: "4 Pine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "HVAC", brand: "B", model: "M", install_year: 2022 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "Just filed" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_status: $.data.status }
          assert:
            - "ClaimTicket.status == 'SUBMITTED' on create"

      - name: contract_terminal_renewed_lockdown_no_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Contract
        distinguishing_aspect: |
          Once Contract reaches RENEWED, no further transitions are
          permitted — /cancel, /renew, /activate all return ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "A Contract that was renewed and is now in RENEWED state (terminal)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "rn@example.com", full_name: "Rn", home_address: "3 Pine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-12-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/tick"
              payload: {}
              as: PlatformAdmin
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: PlatformAdmin
              captures: { v_es: $.data.version }
            - call: "POST /contracts/${contract_id}/renew"
              payload: { expected_contract_version: "${v_es}" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /contracts/${contract_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == 'ERR_INVALID_STATE' (RENEWED is terminal; cannot cancel)"
            - "Response HTTP status == 409"

      - name: dispatch_complete_stamps_completed_utc_side_effect
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Dispatch.IN_PROGRESS_to_COMPLETED
          - entities.Dispatch.fields.completed_utc
        distinguishing_aspect: |
          POST /dispatches/{id}/complete stamps Dispatch.completed_utc with
          the server clock at the moment of the call. Direct side-effect
          verification (NOT covered by §1.8 cascade instance which only
          asserts the downstream CoveredItem update).
        test_recipe:
          setup:
            - "A Dispatch in IN_PROGRESS status. Clock at 2026-02-01T11:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "se@example.com", full_name: "SE", home_address: "2 Pine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "HVAC", brand: "B", model: "M", install_year: 2022 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "X" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/assess"
              payload: { estimated_repair_cost_cents: 10000 }
              as: Dispatcher
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /claims/${claim_id}/dispatch"
              payload: { technician_id: "tech-S", scheduled_utc: "2026-02-01T10:00:00Z" }
              as: Dispatcher
            - call: "GET /dispatches"
              payload: { claim_id: "${claim_id}" }
              as: Dispatcher
              captures: { d_id: "$.data[0].id" }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /dispatches/${d_id}/start"
              payload: {}
              as: Technician
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T11:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dispatches/${d_id}/complete"
              payload: {}
              as: Technician
              captures: { completed_at: $.data.completed_utc, status: $.data.status }
          assert:
            - "Dispatch.${d_id}.status == 'COMPLETED'"
            - "Dispatch.${d_id}.completed_utc == '2026-02-01T11:00:00.000Z'"

      - name: dispatch_start_before_scheduled_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Dispatch.SCHEDULED_to_IN_PROGRESS
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          POST /dispatches/{id}/start when clock_now < Dispatch.scheduled_utc
          returns ERR_INVALID_STATE — precondition on time, not just on the
          status enum.
        test_recipe:
          setup:
            - "A Dispatch in SCHEDULED status with scheduled_utc = 2026-02-01T10:00Z; clock_now = 2026-02-01T08:00Z (before scheduled)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /contract-packages"
              payload: { code: "PLUS", name: "Plus", annual_premium_cents: 50000, service_fee_cents: 7500, copay_cap_cents: 25000, copay_share_pct: 0.20, return_visit_window_days: 30, max_covered_items: 5 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "pr@example.com", full_name: "Pr", home_address: "1 Pine" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /covered-items"
              payload: { contract_id: "${contract_id}", category: "HVAC", brand: "B", model: "M", install_year: 2022 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "Soon" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/assess"
              payload: { estimated_repair_cost_cents: 10000 }
              as: Dispatcher
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /claims/${claim_id}/dispatch"
              payload: { technician_id: "tech-Q", scheduled_utc: "2026-02-01T10:00:00Z" }
              as: Dispatcher
            - call: "GET /dispatches"
              payload: { claim_id: "${claim_id}" }
              as: Dispatcher
