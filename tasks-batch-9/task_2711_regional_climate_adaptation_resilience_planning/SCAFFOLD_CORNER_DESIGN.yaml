      - name: project_creation_for_a_suspended_jurisdiction_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_9_ERR_JURISDICTION_NOT_ACTIVE
          - errors.ERR_JURISDICTION_NOT_ACTIVE
        distinguishing_aspect: "A project for a SUSPENDED jurisdiction is refused with 409 ERR_JURISDICTION_NOT_ACTIVE, and the same payload succeeds once the jurisdiction is patched back to ACTIVE — PROBATION is not blocked, only SUSPENDED is."
        test_recipe:
          setup:
            - "One DRAFT PlanCycle and one Jurisdiction that has been patched to SUSPENDED."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Ridge Town", jurisdiction_code: "TOWN-RIDGE", population: 40000, svi_score: 0.18, endorsement_weight: 3 }
              as: RegionalAdministrator
              captures: { j_ridge_id: $.data.id }
            - call: "POST /resilience/plan-cycles"
              payload: { cycle_label: "Regional Plan 2027-2032", endorsement_deadline: "2026-12-01T00:00:00Z", quorum_weight_bps: 6600, max_revision_rounds: 1, required_session_count: 0 }
              as: RegionalAdministrator
              captures: { cycle_id: $.data.id }
            - call: "PATCH /resilience/jurisdictions/${j_ridge_id}"
              payload: { status: "SUSPENDED" }
              as: RegionalAdministrator
          trigger:
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_ridge_id}", name: "Ridge Culvert Upsizing", hazard_type: "FLOOD", strategy_type: "ACCOMMODATE", base_cost_cents: 30000000, service_life_years: 25, cobenefit_points: 10, feasibility_score: 0.65 }
              as: ProjectSponsor
              as_user_id: "${j_ridge_id}"
            - call: "PATCH /resilience/jurisdictions/${j_ridge_id}"
              payload: { status: "PROBATION" }
              as: RegionalAdministrator
            - call: "POST /resilience/projects"
              payload: { plan_cycle_id: "${cycle_id}", jurisdiction_id: "${j_ridge_id}", name: "Ridge Culvert Upsizing", hazard_type: "FLOOD", strategy_type: "ACCOMMODATE", base_cost_cents: 30000000, service_life_years: 25, cobenefit_points: 10, feasibility_score: 0.65 }
              as: ProjectSponsor
              as_user_id: "${j_ridge_id}"
          assert:
            - "first call: status 409 with data.error_id == ERR_JURISDICTION_NOT_ACTIVE and no AdaptationProject row created"
            - "patch call: status 200 with data.status == PROBATION"
            - "third call: status 409 with data.error_id == ERR_JURISDICTION_NOT_ACTIVE as well, because the rule demands status == ACTIVE and PROBATION is not ACTIVE"

