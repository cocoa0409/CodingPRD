  # =======================================================================
  # Rule 6 — boundary-precision checks on different metrics and endpoints
  # =======================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: second_approval_threshold_is_inclusive_at_exactly_one_hundred_thousand
        grounds:
          - state_machines.Payment.approval_status.PREPARED_to_PENDING_SECOND_APPROVAL
          - state_machines.Payment.approval_status.PREPARED_to_APPROVED
          - validations[priority=30]
          - entities.Payment.fields.approval_status
        distinguishing_aspect: |
          A numeric threshold crossing on POST /dmm/payments - an amount of
          exactly SECOND_APPROVAL_THRESHOLD_CENTS (100000) must land in
          PENDING_SECOND_APPROVAL because the comparison is >=, while 99999
          lands in APPROVED. Different metric and different endpoint from the
          empty-collection boundary below.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T09:00:00Z, one IN_FORCE bond with ample coverage"
            - "one ACTIVE client, one ACTIVE FULL_AGENCY authorization, one account with 5000000 cents"
