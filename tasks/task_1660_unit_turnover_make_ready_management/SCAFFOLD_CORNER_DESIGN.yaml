      - name: second_turn_on_notice_unit_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNIT_NOT_OCCUPIED]", "validations[priority=6.1]"]
        distinguishing_aspect: "Creating a turn on a unit already in NOTICE (an open turn exists) → 409 ERR_UNIT_NOT_OCCUPIED; at most one non-terminal turn per unit."
        test_recipe:
          setup: ["Unit 101 has an OPEN turn (status NOTICE)"]
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
          trigger:
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-08-01", move_out_date: "2026-08-05" }
              as: TurnCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNIT_NOT_OCCUPIED (http 409); Unit.${u}.status remains NOTICE"

      - name: unit_window_overlap_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNIT_WINDOW_OVERLAP]", "validations[priority=8]"]
        distinguishing_aspect: "One crew in the unit at a time: two same-turn REPAIR items (equal rank, so sequence passes) scheduled on shared calendar days by DIFFERENT vendors → 422 ERR_UNIT_WINDOW_OVERLAP."
        test_recipe:
          setup: ["Turn SCOPED with two PLANNED REPAIR items; vendors V1, V2 (REPAIR); item A scheduled [2026-08-05, 2026-08-08) with V1"]
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 7, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
