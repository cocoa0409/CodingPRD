            - call: "POST /licensing/qualifier-assignments/${qa_id}/withdraw"
              payload: { withdrawn_on: "2026-08-10" }
              as: LicensingAnalyst
          trigger:
            - call: "POST /licensing/qualifier-assignments/${qa_id}/withdraw"
              payload: { withdrawn_on: "2026-08-20" }
              as: LicensingAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 409"
            - "${err} == ERR_ASSIGNMENT_STATE_INVALID"
            - "QualifierAssignment.${qa_id}.status == WITHDRAWN"
            - "QualifierAssignment.${qa_id}.withdrawn_on == 2026-08-10"
            - "QualifyingIndividual.${qi_id}.active_qualification_count == 0"

      - name: corner_paying_from_a_drained_fund_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FUND_BALANCE_EXHAUSTED]
          - validations[priority=80]
          - calculations[recovery_prorata_distribution]
        excluded_because:
          difficulty_instance: prorata_distribution_of_exhausted_fund_across_two_approved_claims
          rationale: "That §1.8 combinatorial instance drives the account balance to the point where approved awards exceed available cash and asserts the pro-rata split, and its final call attempts one more disbursement against the emptied account expecting ERR_FUND_BALANCE_EXHAUSTED — the exact claim this corner test would restate."

      - name: corner_paying_an_unadjudicated_claim_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CLAIM_STATE_INVALID]
          - validations[priority=20]
          - endpoints[POST /licensing/recovery-fund-claims/{id}/pay]
        excluded_because:
          difficulty_instance: claim_pay_state_error_outranks_fund_exhaustion_error
          rationale: "The §1.8 priority-pair instance pays a FILED claim out of an exhausted account and asserts ERR_CLAIM_STATE_INVALID rather than ERR_FUND_BALANCE_EXHAUSTED, so it already proves the state error is triggerable on /pay and fixes its precedence."

  - section: rbac
    instances:

      - name: corner_consumer_cannot_screen_a_complaint
        claim_type: Role denial
        grounds:
          - rbac[LicensingAnalyst].exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority=2]
        distinguishing_aspect: "Jurisdiction screening is the analyst's exclusive act even on the consumer's own complaint: the filer calling /screen gets ERR_ROLE_NOT_PERMITTED (403) and the complaint stays RECEIVED, which distinguishes ownership from authority."
        test_recipe:
          setup:
            - "clock at 2026-08-01 with one unlicensed-subject complaint in RECEIVED filed by this consumer"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/consumers"
              payload: { full_name: "Cody Consumer", contact_email: "cody@home.test", mailing_state: "CA" }
              as: LicensingAnalyst
              captures: { con_id: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { consumer_id: "${con_id}", subject_business_name: "Self Screen Builders", alleged_loss_cents: 400000, contract_date: "2026-07-01", description: "Retaining wall failed inspection" }
              as: Consumer
              as_user_id: "${con_id}"
              captures: { cmp_id: $.data.id }
          trigger:
            - call: "POST /licensing/complaints/${cmp_id}/screen"
              payload: { jurisdiction_finding: "ACCEPTED" }
              as: Consumer
              as_user_id: "${con_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response http status == 403"
            - "${err} == ERR_ROLE_NOT_PERMITTED"
            - "Complaint.${cmp_id}.status == RECEIVED"
            - "the same call as LicensingAnalyst returns 200 and moves the complaint out of RECEIVED"

      - name: corner_licensing_analyst_cannot_issue_a_citation
        claim_type: Role denial
        grounds:
          - rbac[Investigator].exclusive_operations
          - rbac[LicensingAnalyst]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Citation issuance belongs to the Investigator alone: the analyst who ran screening cannot issue it and receives ERR_ROLE_NOT_PERMITTED (403), even with a SUBSTANTIATED case and a matching classification in hand."
        test_recipe:
          setup:
            - "clock at 2026-08-01 with a C-10 classification and a SUBSTANTIATED unlicensed-subject sting investigation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-10", name: "Electrical", hazard_tier: 3, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1500000, required_ce_hours: 8, renewal_base_fee_cents: 45000, mediation_required: true }
              as: BoardAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /licensing/investigations"
              payload: { origin: "STING", subject_business_name: "Analyst Reach Wiring" }
              as: Investigator
              as_user_id: "inv-30"
              captures: { inv_id: $.data.id }
            - call: "POST /licensing/investigations/${inv_id}/close"
              payload: { finding: "SUBSTANTIATED", finding_severity: "MINOR", evidence_summary: "Unlicensed bid documented" }
