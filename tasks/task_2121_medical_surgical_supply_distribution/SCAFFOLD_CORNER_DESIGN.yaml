              as_user_id: "dc-op-1"
          assert:
            - "${err} == ERR_STOP_OUTSIDE_ROOM_WINDOW with HTTP 422"
            - "after the accepted stop: ReplenishmentOrder.${order_id}.stop_arrival_min == 570 and stop_service_minutes == 30"
            - "DeliveryRoute.${route_id}.planned_order_count == 1"

      - name: route_cold_capacity_accepts_exactly_400_units_and_rejects_401
        claim_type: aggregate_validation
        grounds:
          - validations[priority=20]
          - calculations.route_cold_chain_load
          - errors[ERR_ROUTE_COLD_CAPACITY_EXCEEDED]
        distinguishing_aspect: "The route cold-chain ceiling is inclusive: a first order carrying exactly 400 cold units is accepted, and a second order carrying one more unit is refused because 401 > 400."
        test_recipe:
          setup:
