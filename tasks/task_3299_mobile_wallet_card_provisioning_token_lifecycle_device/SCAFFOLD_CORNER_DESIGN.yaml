              payload: { cryptogram: "cgm-d", amount_cents: 10000, currency: "USD", merchant_id: "m-1", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
              captures: { au_id: $.data.id }
          trigger:
