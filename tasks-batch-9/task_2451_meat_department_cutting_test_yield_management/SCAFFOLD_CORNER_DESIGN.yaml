  # ===========================================================================
  - section: state_machines
    instances:

      - name: cutting_test_is_created_in_draft_with_zeroed_metrics
        claim_type: initial_state
        grounds:
          - state_machines.CuttingTest.initial_state
          - entities.CuttingTest.fields.status
          - entities.CuttingTest.fields.revision_count
          - endpoints[POST /meat-ops/cutting-tests]
        distinguishing_aspect: "A freshly created CuttingTest is in DRAFT with revision_count 0, every yield metric 0 and no submitted_by_user_id — the initial state is not derived from the purchase's status."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; PrimalPurchase P1 is RECEIVED with net_weight_lb 98.5."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
