            - call: "GET /signal-ops/requesters/${r1_id}/complaints"
              payload: {}
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { by_req_total: $.total_count }
            - call: "GET /signal-ops/corridors/${c1_id}/complaints"
              payload: { category: "PEDESTRIAN" }
              as: SignalOpsAdmin
              captures: { by_cat_total: $.total_count, by_cat_id: "$.data[0].id" }
            - call: "GET /signal-ops/retiming-projects/${p1_id}/complaints"
