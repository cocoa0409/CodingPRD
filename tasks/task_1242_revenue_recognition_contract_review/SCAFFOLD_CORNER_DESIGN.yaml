        distinguishing_aspect: "Modifications require an ACTIVE contract at creation: with a DRAFT contract (correct OCC version supplied, so the OCC check passes), creation fails 409 ERR_CONTRACT_NOT_ACTIVE — the state gate, not the concurrency gate, fires."
