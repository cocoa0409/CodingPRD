          setup:
            - "The plan with certified valuations 2021-2025. A first record for 2021-2025 with 250000 CBU, 250000000 cents and a rate of 1000 is filed, then superseded by a corrected record for exactly the same interval with 100000 CBU, 100000000 cents and a rate of 400. The withdrawal event for 2026 is determined COMPLETE."
