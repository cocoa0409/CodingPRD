      - name: four_hop_cascade_from_inspection_pass_to_policy_premium
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: inspection_pass_cascades_four_hops_from_inspection_to_policy_premium
          rationale: "That difficulty instance already walks the whole chain end to end - inspection PASS, project VERIFIED, dwelling VERIFIED plus verified_retrofit_scope, grant VERIFIED_COMPLETE, the cycle reserved-to-disbursed move and the policy premium rewrite at hop 4 - and asserts every intermediate field, so a separate breadth instance would repeat it hop for hop."

      - name: provisional_and_final_settlement_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: claim_provisional_vs_final_settlement_divergence
          rationale: "That difficulty instance computes both settlement variants on identical loss data, asserts the divergence between the provisional and final payable, and reconciles the delta into the event ledger when the variant switches, which is exactly the three claims this layer asks for."

