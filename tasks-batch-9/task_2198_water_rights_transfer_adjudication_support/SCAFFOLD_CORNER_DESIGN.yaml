  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_hcu_certify_stale_right_version_rejects_an_unseen_recertification
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[hcu-certify-stale-right]
          - errors[ERR_STALE_RIGHT_VERSION]
          - complexity_profile.complexity_layers.optimistic_concurrency
        distinguishing_aspect: >-
          Recertification is a legal operation on identical state — the second study
          supersedes the first — so nothing but the version token can distinguish an
          intentional recertification from one issued against a certified_hcu_af the
          caller never observed. The stale token is refused with 412 and the identical
          call with the refreshed token succeeds and rewrites the ledger.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A's activated right carries two DRAFT studies over 2023-2025: S1 (DIVERSION_BASED) and S2 (CIR_BASED)."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st1: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: CIR_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st2: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v0: "$.data.version"}}
          trigger:
            - {call: "POST /hcu-studies/${st1}/certify", payload: {expected_water_right_version: "${wr_v0}"}, as: WaterRightsAnalyst}
            - {call: "POST /hcu-studies/${st2}/certify", payload: {expected_water_right_version: "${wr_v0}"}, as: WaterRightsAnalyst, captures: {err: "$.data.error_id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /hcu-studies/${st2}/certify", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
          assert:
            - "First certification with the observed version: HTTP 200; S1 status CERTIFIED, WaterRight.certified_hcu_af 195.00, transferable_af 195.00 and the right's version advances past ${wr_v0}."
            - "Second certification replaying the same token: HTTP 412 with error_id ERR_STALE_RIGHT_VERSION — not 409 and not a validation 422."
            - "The refusal is total: S2 stays DRAFT, S1 stays CERTIFIED, certified_hcu_af stays 195.00, and no version anywhere moves (so ${wr_v1} read afterwards equals the value written by the first certification)."
            - "Replay with the refreshed token: HTTP 200; S2 becomes CERTIFIED, S1 becomes SUPERSEDED, and certified_hcu_af / transferable_af are rewritten to S2's transferable_cu_af, which differs from 195.00 because the CIR-based method computes consumptive use from acreage rather than from diversion records."

      - name: occ_application_submit_stale_right_version_protects_the_escrow_ledger
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[application-submit-stale-right]
          - errors[ERR_STALE_RIGHT_VERSION]
          - calculations.right_volume_ledger
        distinguishing_aspect: >-
          Two applications may legitimately be pending on one right, so the second
          submit is a valid operation on identical state; the version token is the only
          thing that stops it from escrowing against a transferable_af figure the first
          escrow has already consumed. The rejected call is well within the remaining
          budget (50.00 <= 95.00), so a naive budget check would have let it through.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A's right certified at 195.00 AF with two DRAFT applications: APP1 for 100.00 AF and APP2 for 50.00 AF."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
            - {call: "POST /water-rights", payload: {claimant_id: "${cl_a}", right_number: "WR-2198-001", priority_date: "1901-05-01T00:00:00Z", source_stream_code: "SNK-14", purpose_of_use: IRRIGATION, place_of_use_acres: 120.00, authorized_diversion_af: 400.00, authorized_rate_cfs: 5.000}, as: WaterRightsAnalyst, captures: {wr: "$.data.id"}}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/beneficial-use-records", payload: {use_year: 2025, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: METER}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/activate", as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr}/hcu-studies", payload: {method: DIVERSION_BASED, study_period_start_year: 2023, study_period_end_year: 2025}, as: WaterRightsAnalyst, captures: {st: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_vc: "$.data.version"}}
            - {call: "POST /hcu-studies/${st}/certify", payload: {expected_water_right_version: "${wr_vc}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 100.00, proposed_purpose_of_use: MUNICIPAL}, as: WaterRightsAnalyst, captures: {app1: "$.data.id"}}
            - {call: "POST /transfer-applications", payload: {water_right_id: "${wr}", hcu_study_id: "${st}", application_type: CHANGE_OF_USE, requested_af: 50.00, proposed_purpose_of_use: STOCKWATER}, as: WaterRightsAnalyst, captures: {app2: "$.data.id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v0: "$.data.version"}}
          trigger:
            - {call: "POST /transfer-applications/${app1}/submit", payload: {expected_water_right_version: "${wr_v0}"}, as: WaterRightsAnalyst}
            - {call: "POST /transfer-applications/${app2}/submit", payload: {expected_water_right_version: "${wr_v0}"}, as: WaterRightsAnalyst, captures: {err: "$.data.error_id"}}
            - {call: "GET /water-rights/${wr}", as: WaterRightsAnalyst, captures: {wr_v1: "$.data.version"}}
            - {call: "POST /transfer-applications/${app2}/submit", payload: {expected_water_right_version: "${wr_v1}"}, as: WaterRightsAnalyst}
          assert:
            - "APP1 submit: HTTP 200; escrowed_af 100.00, WaterRight.transferable_af 95.00, encumbered_af 100.00, status ENCUMBERED, version advanced past ${wr_v0}."
            - "APP2 submit with the stale token: HTTP 412 ERR_STALE_RIGHT_VERSION — NOT ERR_TRANSFERABLE_VOLUME_EXCEEDED, because 50.00 AF still fits inside the remaining 95.00 AF."
            - "The refusal leaves APP2 in DRAFT with escrowed_af 0.00 and leaves the right's ledger at 95.00 / 100.00 / 0.00 with no version bump."
            - "APP2 submit with the refreshed token: HTTP 200; escrowed_af 50.00, transferable_af 45.00, encumbered_af 150.00, and 195.00 == 45.00 + 150.00 + 0.00 keeps the volume ledger conserved."

      - name: occ_bank_deposit_stale_account_version_rejects_a_replayed_deposit
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[bank-deposit-stale-account]
          - errors[ERR_STALE_ACCOUNT_VERSION]
          - calculations.bank_credit_ledger
        distinguishing_aspect: >-
          The third OCC rule guards a different parent entity with a differently named
          token (expected_water_bank_account_version) and its own 412 error id, so the
          two rules cannot share one implementation. Repeated deposits are legitimate,
          which is exactly why only the token can catch a decision made against a
          credit ledger the caller never saw.
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z; claimant A's bank-enrolled right certified at 195.00 AF; empty account ACC in basin SNK."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-03-01T00:00:00Z"}, as: WaterRightsAnalyst}
            - {call: "POST /claimants", payload: {legal_name: "Vega Ditch Company", contact_email: "ops@vega.example", entity_type: IRRIGATION_DISTRICT}, as: WaterRightsAnalyst, captures: {cl_a: "$.data.id"}}
