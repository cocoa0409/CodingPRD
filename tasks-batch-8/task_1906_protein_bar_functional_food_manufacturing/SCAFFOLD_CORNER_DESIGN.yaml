          trigger:
            - { call: "POST /mfg/production-runs/${run1}/verify-pre-run", payload: {}, as: QualityManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /mfg/production-runs/${run1}", payload: {}, as: QualityManager, captures: { st: "$.data.status" } }
          assert:
            - "control: label_protein_g_per_serving == 19.21 (captured lbl)"
            - "error_id == ERR_COMPOSITE_CLAIM_UNSUBSTANTIATED (422): composite 40000*0.20/1666 = 4.80 < 10.0"
            - "run remains SCHEDULED"

      - name: c_structure_function_disclaimer_required
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_DISCLAIMER_REQUIRED]"]
        distinguishing_aspect: "A STRUCTURE_FUNCTION claim review with substantiation_ok true but structure_function_disclaimer false cannot be approved (ERR_DISCLAIMER_REQUIRED); a twin review with disclaimer true approves."
        test_recipe:
          setup: ["revision RSF (WHEY 40, claims [HIGH_PROTEIN]) NUTRITION_VERIFIED (label 19.21)"]
          setup_api_calls:
            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${cust}", name: "FSF", bar_weight_g: 60 }, as: FormulationScientist, captures: { fsf: "$.data.id" } }
            - { call: "POST /mfg/formulas/${fsf}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 40, is_protein_contributor: true }], batch_size_kg: 100, target_protein_g_per_serving: 19, claim_tags: ["HIGH_PROTEIN"] }, as: FormulationScientist, captures: { rsf: "$.data.id" } }
            - { call: "POST /mfg/revisions/${rsf}/submit", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${rsf}/verify-nutrition", payload: {}, as: QualityManager }
          trigger:
            - { call: "POST /mfg/claim-reviews", payload: { revision_id: "${rsf}", claim_tag: "HIGH_PROTEIN", claim_type: "STRUCTURE_FUNCTION", structure_function_disclaimer: false }, as: FormulationScientist, captures: { cr1: "$.data.id", ok1: "$.data.substantiation_ok" } }
            - { call: "POST /mfg/claim-reviews/${cr1}/start-review", payload: {}, as: QualityManager }
            - { call: "POST /mfg/claim-reviews/${cr1}/approve", payload: {}, as: QualityManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /mfg/claim-reviews", payload: { revision_id: "${rsf}", claim_tag: "HIGH_PROTEIN", claim_type: "STRUCTURE_FUNCTION", structure_function_disclaimer: true }, as: FormulationScientist, captures: { cr2: "$.data.id" } }
            - { call: "POST /mfg/claim-reviews/${cr2}/start-review", payload: {}, as: QualityManager }
            - { call: "POST /mfg/claim-reviews/${cr2}/approve", payload: {}, as: QualityManager, captures: { st2: "$.data.status" } }
          assert:
            - "first review substantiation_ok == true but approve -> ERR_DISCLAIMER_REQUIRED (422)"
            - "second review (disclaimer true) approves -> status APPROVED"

