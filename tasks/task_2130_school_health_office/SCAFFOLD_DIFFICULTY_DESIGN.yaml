              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { visit1_id: $.data.id }
            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu2_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "INJURY", acuity: "ROUTINE" }
              as: SchoolNurse
