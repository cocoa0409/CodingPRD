            - "trigger[1] captured ok_status == REQUESTED (start 2026-07-03 == end + buffer, boundary allowed)"

  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_requires_tenant_verified
        grounds:
          - state_machines.Booking.REQUESTED_to_CONFIRMED
          - entities.Tenant.fields.verification_status
        distinguishing_aspect: |
          Entity pair Booking<-Tenant: Booking REQUESTED->CONFIRMED is valid only
          when Tenant.verification_status == VERIFIED; a PENDING tenant yields
          ERR_TENANT_NOT_VERIFIED, and approving the verification then lets the
          same confirm succeed.
        test_recipe:
          setup:
            - "Verified-payout host, LISTED unit; tenant has a PENDING (not approved) verification"
            - "Booking REQUESTED"
          setup_api_calls:
            - call: "POST /hosts"
              payload: { display_name: "Host M", email: "hostM@x.com" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /hosts/${host_id}/verify-payout"
