      - name: collateral_posted_to_returned_manual_edge
        claim_type: valid_transition
        grounds:
          - state_machines.CollateralPosting.transitions
        excluded_because:
          difficulty_instance: compensating_invariant / collateral_return_conserves_posted_ledger_without_touching_credit
          rationale: "The named §1.8 instance drives REQUIRED -> POSTED -> RETURNED through /post and /return and asserts the full ledger conservation, including the retained posted_amount_usd."

      - name: execute_requires_active_parent_program
        claim_type: precondition_enforcement
        grounds:
          - state_machines.HedgeInstrument.transitions
          - errors[ERR_PROGRAM_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / program_state_gate_beats_coverage_ceiling_on_execute
          rationale: "The named §1.8 instance asserts ERR_PROGRAM_NOT_ACTIVE on /execute from a PENDING_APPROVAL program while a coverage breach is co-present, which subsumes the plain precondition check."

      - name: terminate_executed_trade_cascade_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.HedgeInstrument.transitions
        excluded_because:
          difficulty_instance: transitive_cascade / terminate_returns_posted_collateral_and_restores_counterparty
          rationale: "The named §1.8 instance replays all three cascade hops of EXECUTED -> TERMINATED with literal ledger values."

      - name: redesignation_cycle_on_accounting_dimension
        claim_type: valid_transition
        grounds:
          - state_machines.HedgeInstrument.transitions
        excluded_because:
          difficulty_instance: non_linear_state_machine / instrument_accounting_dimension_redesignation_cycle
          rationale: "The named §1.8 instance walks DESIGNATED -> DEDESIGNATED -> DESIGNATED and asserts the exception gate on re-entry."

      - name: directive_needs_revision_loop_and_supersession
        claim_type: valid_transition
        grounds:
          - state_machines.TankeringDirective.transitions
        excluded_because:
          difficulty_instance: non_linear_state_machine / directive_revision_cycle_then_supersession
          rationale: "The named §1.8 instance drives PROPOSED -> NEEDS_REVISION -> PROPOSED and the SUPERSEDED exit with revision_count assertions."

  # ===========================================================================
  - section: calculations
    instances:

      - name: sizing_applies_one_season_factor_per_forecast_then_rounds_once
        claim_type: constants_applied
        grounds:
          - calculations.consumption_basis_gallons
          - entities.HedgeProgram.fields.consumption_basis_gallons
        distinguishing_aspect: |
          All four SEASON_FACTOR members are exercised in a single sizing run:
          WINTER 1000000 x 1.00 = 1000000, SPRING 5000000 x 0.95 = 4750000,
          SUMMER 2000000 x 1.10 = 2200000, FALL 1000000 x 0.98 = 980000, summing to
          8930000. A flat unweighted sum would give 9000000 and a single averaged
          factor would give neither figure.
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy accepting all three fleet types."
            - "Four PUBLISHED forecasts spanning 2027-01 to 2027-04, one per season, each on a distinct fleet_type + route_group pair so no overlap rule fires."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CORNER", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "WINTER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 1000000 }
              as: FuelAnalyst
              captures: { fw: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_LONG", season: "SPRING", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 5000000 }
              as: FuelAnalyst
              captures: { fsp: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "WIDEBODY", route_group: "TRANSATLANTIC", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 2000000 }
              as: FuelAnalyst
              captures: { fsu: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "REGIONAL", route_group: "DOMESTIC_SHORT", season: "FALL", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 1000000 }
              as: FuelAnalyst
              captures: { ffa: $.data.id }
            - call: "POST /fuel/consumption-forecasts/${fw}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts/${fsp}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts/${fsu}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/consumption-forecasts/${ffa}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs"
              payload: { policy_id: "${policy_id}", program_code: "HP-SEASONS", period_start_month: "2027-01", period_end_month: "2027-03", route_groups: ["DOMESTIC_SHORT", "DOMESTIC_LONG", "TRANSATLANTIC"], target_coverage_pct: 30.00 }
              as: FuelAnalyst
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
          assert:
            - "HTTP 200 and data.status == \"SIZING\"."
            - "data.consumption_basis_gallons == 8930000."
            - "data.coverage_pct_notional == 0.00, data.coverage_pct_delta == 0.00, data.planned_coverage_pct_delta == 0.00 (no instruments yet)."
            - "data.version == 2."

      - name: sizing_input_set_excludes_draft_wrong_fleet_wrong_route_and_partial_window
        claim_type: input_set_filtering
        grounds:
          - calculations.consumption_basis_gallons
          - entities.HedgePolicy.fields.eligible_fleet_types
          - entities.HedgeProgram.fields.route_groups
        distinguishing_aspect: |
          Five forecasts are visible and only one enters the basis. Each of the other
          four is excluded by a different clause: DRAFT status, a fleet_type outside
          eligible_fleet_types, a route_group outside route_groups, and a window
          ending 2027-06 which is not contained in month_after(2027-03) = 2027-04.
          The partial-window row is dropped whole — pro-rating it would add 137500.
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy whose eligible_fleet_types is exactly [NARROWBODY]."
            - "Five forecasts: one qualifying SUMMER NARROWBODY/DOMESTIC_SHORT row of 4000000 gallons plus four decoys."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-FILTER", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 5.00, max_single_counterparty_pct: 100.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY"] }
              as: RiskPolicyAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 4000000 }
              as: FuelAnalyst
              captures: { f_in: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "DOMESTIC_SHORT", season: "WINTER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 1000000 }
              as: FuelAnalyst
              captures: { f_draft: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "WIDEBODY", route_group: "DOMESTIC_SHORT", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 3000000 }
              as: FuelAnalyst
              captures: { f_fleet: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
              payload: { fleet_type: "NARROWBODY", route_group: "TRANSPACIFIC", season: "SUMMER", period_start_month: "2027-01", period_end_month: "2027-04", forecast_gallons: 2000000 }
              as: FuelAnalyst
              captures: { f_route: $.data.id }
            - call: "POST /fuel/consumption-forecasts"
