            - { call: "POST /deeds/${d}/execute", payload: { expected_accession_version: "${av}" }, as: Registrar }
            - { call: "POST /finding-aids", payload: { collection_id: "${c}", title: "FA", summary: "S" }, as: Archivist, captures: { fa: $.data.id } }
            - { call: "POST /finding-aids/${fa}/submit-review", as: Archivist }
            - { call: "POST /finding-aids/${fa}/publish", as: Archivist }
            - { call: "POST /items", payload: { accession_id: "${a}", collection_id: "${c}", title: "Banner" }, as: Archivist, captures: { i: $.data.id } }
            - { call: "POST /items/${i}/catalog", payload: { description: "Parade banner", condition_grade: "FAIR", appraised_value_cents: 12000, format: "ARTIFACT" }, as: Archivist }
            - { call: "POST /items/${i}/make-available", as: Archivist }
            - { call: "POST /researchers", payload: { full_name: "R. Reader", email: "r1@example.org" }, as: ReadingRoomStaff, captures: { r: $.data.id } }
            - { call: "POST /research-requests", payload: { item_ids: ["${i}"], topic: "Parades", purpose: "PERSONAL" }, as: Researcher, as_user_id: "${r}", captures: { rq: $.data.id } }
            - { call: "POST /research-requests/${rq}/begin-review", as: ReadingRoomStaff }
            - { call: "POST /research-requests/${rq}/approve", as: ReadingRoomStaff }
            - { call: "POST /reading-room-appointments", payload: { research_request_id: "${rq}", room_code: "MAIN", scheduled_date: "2026-08-10", start_time: "10:00", end_time: "12:00", seats: 1 }, as: Researcher, as_user_id: "${r}", captures: { appt: $.data.id } }
            - { call: "POST /volunteer-projects", payload: { name: "Artifact digitization" }, as: VolunteerCoordinator, captures: { p: $.data.id } }
            - { call: "POST /volunteer-projects/${p}/activate", as: VolunteerCoordinator }
            - { call: "POST /volunteer-projects/${p}/tickets", payload: { item_id: "${i}" }, as: VolunteerCoordinator, captures: { t: $.data.id } }
            - { call: "POST /reproduction-orders", payload: { research_request_id: "${rq}", item_ids: ["${i}"], format: "SCAN_STANDARD", page_estimate: 10, license_class: "PERSONAL", rush: false }, as: Researcher, as_user_id: "${r}", captures: { o: $.data.id } }
            - { call: "POST /deaccession-proposals", payload: { item_ids: ["${i}"], justification: "Returns to donor institution", disposal_method: "TRANSFER" }, as: Registrar, as_user_id: "reg_1", captures: { prop: $.data.id } }
            - { call: "POST /deaccession-proposals/${prop}/submit", as: Registrar, as_user_id: "reg_1" }
            - { call: "POST /deaccession-proposals/${prop}/send-to-board", as: Registrar, as_user_id: "reg_1" }
            - { call: "POST /deaccession-proposals/${prop}/approve", as: BoardOfficer, as_user_id: "board_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /deaccession-proposals/${prop}/finalize", payload: {}, as: Registrar, as_user_id: "reg_1", captures: { pst: $.data.status } }
          assert:
