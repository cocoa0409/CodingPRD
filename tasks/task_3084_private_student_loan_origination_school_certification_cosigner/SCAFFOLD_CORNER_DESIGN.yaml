# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3084_private_student_loan_origination_school_certification_cosigner
#
# Breadth probe over every testable claim the scaffold declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners 1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: borrower_creation_returns_every_declared_field_and_starts_active
        claim_type: Creation
        grounds:
          - entities.Borrower
          - endpoints.POST_/private-student-loans/borrowers
        distinguishing_aspect: "A borrower created with five input fields comes back 201 with status ACTIVE, version 1, and server-minted id / created_at / updated_at that were never client-supplied."
        test_recipe:
          setup:
            - 'Logical clock at its fixed server default 2026-09-01T00:00:00Z. Empty database.'
          setup_api_calls:
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "Nora Borrower", email: "nora@example.com", state_code: "OH", program_level: "GRADUATE", credit_score: 720, dti_ratio: 0.26 }
              as: PlatformAdmin
              captures: { brw: $.data.id }
          trigger:
            - call: "GET /private-student-loans/borrowers/${brw}"
              payload: {}
              as: PlatformAdmin
          assert:
            - 'the response status is 201 and response_type is object'
            - 'Borrower.${brw}.full_name == "Nora Borrower" and program_level == GRADUATE'
            - 'Borrower.${brw}.status == ACTIVE and version == 1'
            - 'Borrower.${brw}.on_time_payment_run_count == 0 and lifetime_on_time_payment_count == 0'
            - 'id, created_at and updated_at are all non-null on the read-back'
            - 'meta.api_request_id and meta.api_request_timestamp are present'
      - name: borrower_retrieval_round_trips_every_stored_field
        claim_type: Retrieval
        grounds:
          - entities.Borrower
          - endpoints.GET_/private-student-loans/borrowers/{id}
        distinguishing_aspect: "Every stored scalar of a borrower round-trips through the single-resource GET exactly as posted, including the credit_score and dti_ratio the underwriting formula consumes."
        test_recipe:
          setup:
            - 'One borrower on file.'
          setup_api_calls:
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "Nora Borrower", email: "nora@example.com", state_code: "OH", program_level: "GRADUATE", credit_score: 720, dti_ratio: 0.26 }
              as: PlatformAdmin
              captures: { brw: $.data.id }
          trigger:
            - call: "GET /private-student-loans/borrowers/${brw}"
              payload: {}
              as: Borrower
              as_user_id: "${brw}"
          assert:
            - 'the response status is 200 and response_type is object'
            - 'Borrower.${brw}.email == "nora@example.com" and state_code == OH'
            - 'Borrower.${brw}.credit_score == 720 and dti_ratio == 0.26'
            - 'Borrower.${brw}.program_level == GRADUATE'
      - name: borrower_listing_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/private-student-loans/borrowers
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three borrowers on file, limit=2&offset=0 returns two rows carrying total_count 3 and has_more true, while offset=2 returns the remaining row with has_more false - total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - 'Three borrowers registered.'
          setup_api_calls:
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "P1", email: "p1@example.com", state_code: "OH", program_level: "UNDERGRADUATE", credit_score: 700, dti_ratio: 0.20 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "P2", email: "p2@example.com", state_code: "IA", program_level: "UNDERGRADUATE", credit_score: 710, dti_ratio: 0.21 }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "P3", email: "p3@example.com", state_code: "IA", program_level: "UNDERGRADUATE", credit_score: 715, dti_ratio: 0.22 }
              as: PlatformAdmin
              captures: { p3: $.data.id }
          trigger:
            - call: "GET /private-student-loans/borrowers?limit=2&offset=0"
              payload: {}
              as: PlatformAdmin
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /private-student-loans/borrowers?limit=2&offset=2"
              payload: {}
              as: PlatformAdmin
              captures: { page2_first: "$.data[0].id" }
          assert:
            - 'the offset=0 page returns response_type array with exactly two rows, ${page1_first} and ${page1_second}, both among ${p1} / ${p2} / ${p3}'
            - 'the offset=0 page reports total_count 3 and has_more true'
            - 'the offset=2 page returns exactly one row ${page2_first} and reports has_more false'
            - 'the envelope carries all four pagination_fields keys limit, offset, total_count and has_more'

      - name: unknown_borrower_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_BORROWER_NOT_FOUND]
          - endpoints.GET_/private-student-loans/borrowers/{id}
        distinguishing_aspect: "A syntactically valid but unregistered borrower UUID yields ERR_BORROWER_NOT_FOUND at 404 rather than an empty object or a malformed-identifier 400."
        test_recipe:
          setup:
            - 'Empty database.'
          setup_api_calls:
            - call: "POST /private-student-loans/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /private-student-loans/borrowers/3f2a91d4-0000-4b00-9c11-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - '${err_id} == ERR_BORROWER_NOT_FOUND'
            - 'the response status is 404 and response_type is error'
            - 'the error body carries a non-empty message alongside error_id'
      - name: school_creation_without_school_code_is_rejected
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=11]
          - entities.School.fields.school_code
        distinguishing_aspect: "Omitting the required school_code is rejected with ERR_INVALID_REQUEST at 400 before any School row is written, while the same request with school_code present succeeds."
        test_recipe:
          setup:
            - 'Empty database.'
          setup_api_calls:
            - call: "POST /private-student-loans/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /private-student-loans/schools"
              payload: { name: "Nameless College", state_code: "OH", certification_capacity_per_period_cents: 1000 }
              as: PlatformAdmin
              captures: { err_missing: $.data.error_id }
            - call: "POST /private-student-loans/schools"
              payload: { name: "Nameless College", school_code: "009999", state_code: "OH", certification_capacity_per_period_cents: 1000 }
              as: PlatformAdmin
              captures: { sch_ok: $.data.id }
          assert:
            - '${err_missing} == ERR_INVALID_REQUEST with status 400'
            - 'the corrected request returns 201 and ${sch_ok} is a server-minted id'
            - 'GET /private-student-loans/schools reports total_count 1'
      - name: school_and_policy_defaults_apply_when_omitted
        claim_type: Defaults
        grounds:
          - entities.School.fields.active
          - entities.LoanPolicy.fields.cosigner_release_min_on_time_payments
          - entities.LoanPolicy.fields.capitalized_interest_cap_pct
          - entities.LoanPolicy.fields.allows_standalone_borrower
        distinguishing_aspect: "A school created without the active flag comes back active true, and a policy created with only product_code and program_level comes back carrying all six published defaults rather than nulls."
        test_recipe:
          setup:
            - 'Empty database.'
          setup_api_calls:
            - call: "POST /private-student-loans/schools"
              payload: { name: "Default College", school_code: "009998", state_code: "OH", certification_capacity_per_period_cents: 5000 }
              as: PlatformAdmin
              captures: { sch: $.data.id }
            - call: "POST /private-student-loans/loan-policies"
              payload: { product_code: "SM-DEF-2026", program_level: "UNDERGRADUATE" }
              as: PlatformAdmin
              captures: { pol: $.data.id }
          trigger:
            - call: "GET /private-student-loans/loan-policies/${pol}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /private-student-loans/schools/${sch}"
              payload: {}
              as: PlatformAdmin
          assert:
            - 'School.${sch}.active == true - the boolean default was applied, not left null'
            - 'LoanPolicy.${pol}.product_code == "SM-DEF-2026" and program_level == UNDERGRADUATE'
            - 'LoanPolicy.${pol}.cosigner_release_min_on_time_payments == 24 and cosigner_release_min_credit_score == 660'
            - 'LoanPolicy.${pol}.cosigner_release_max_dti_ratio == 0.45'
            - 'LoanPolicy.${pol}.capitalized_interest_cap_pct == 0.10 and in_school_max_deferment_months == 48'
            - 'LoanPolicy.${pol}.allows_standalone_borrower == false'

      - name: application_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds:
          - entities.LoanApplication.fields.certified_limit_cents
          - entities.LoanApplication.fields.tier
          - calculations.combined_credit_underwriting.variants.provisional
        distinguishing_aspect: "certified_limit_cents, combined_credit_score and tier are computed on the server: the stored ceiling is cost_of_attendance_cents minus other_aid_cents and the tier is derived from the score pair, whatever the client may claim."
        test_recipe:
          setup:
            - 'One borrower, one school and one policy on file.'
          setup_api_calls:
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "Quill Borrower", email: "quill@example.com", state_code: "OH", program_level: "UNDERGRADUATE", credit_score: 700, dti_ratio: 0.22 }
              as: PlatformAdmin
              captures: { brw: $.data.id }
            - call: "POST /private-student-loans/schools"
              payload: { name: "Default College", school_code: "009997", state_code: "OH", certification_capacity_per_period_cents: 100000000, active: true }
              as: PlatformAdmin
              captures: { sch: $.data.id }
            - call: "POST /private-student-loans/loan-policies"
              payload: { product_code: "SM-CMP-2026", program_level: "UNDERGRADUATE", extended_term_months: 180, cosigner_release_min_on_time_payments: 24, capitalized_interest_cap_pct: 0.10, in_school_max_deferment_months: 48, repayment_max_deferment_months: 24, delinquency_notice_threshold_days: 5, allows_standalone_borrower: false }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /private-student-loans/borrowers/${brw}/cosigners"
              payload: { full_name: "Roth Cosigner", email: "roth@example.com", state_code: "OH", relationship: "PARENT", credit_score: 760, credit_history_months: 150, dti_ratio: 0.2 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { cos: $.data.id }
            - call: "POST /private-student-loans/cosigners/${cos}/reunderwrite"
              payload: { credit_score: 760, dti_ratio: 0.2 }
              as: Cosigner
              as_user_id: "${cos}"
          trigger:
            - call: "POST /private-student-loans/loan-applications"
              payload: { borrower_id: "${brw}", school_id: "${sch}", policy_id: "${pol}", cosigner_id: "${cos}", requested_amount_cents: 900000, cost_of_attendance_cents: 900000, other_aid_cents: 95000, interest_accrual_option: "DEFERRED", repayment_term_months: 120 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { app: $.data.id, c_limit: $.data.certified_limit_cents, c_tier: $.data.tier, c_score: $.data.combined_credit_score }
          assert:
            - '${c_limit} == 805000 recomputed from cost_of_attendance_cents minus other_aid_cents'
            - '${c_score} == 760 and ${c_tier} == A because the provisional variant took max(760, 700)'
            - 'LoanApplication.${app}.margin_rate_pct == 2.75 and decision_path == COSIGNER_PRIMARY'
      - name: system_identifiers_and_stamps_are_server_minted
        claim_type: System Fields
        grounds:
          - entities.School
        distinguishing_aspect: "A school's id is a bare UUID with no type prefix, version starts at 1, and created_at equals updated_at on a freshly created row, both carrying three fractional digits and a trailing Z."
        test_recipe:
          setup:
            - 'Empty database.'
          setup_api_calls:
            - call: "POST /private-student-loans/schools"
              payload: { name: "Stamped College", school_code: "009996", state_code: "OH", certification_capacity_per_period_cents: 5000 }
              as: PlatformAdmin
              captures: { sch: $.data.id }
          trigger:
            - call: "GET /private-student-loans/schools/${sch}"
              payload: {}
              as: PlatformAdmin
          assert:
            - 'School.${sch}.id matches the canonical UUID shape with no type prefix such as sch_'
            - 'School.${sch}.version == 1'
            - 'School.${sch}.created_at equals updated_at on a freshly created row, both carrying three fractional digits and a trailing Z'
            - 'School.${sch}.school_code == "009996" stored verbatim as the client supplied it'
      - name: application_rejects_an_undeclared_accrual_option
        claim_type: Type Constraints
        grounds:
          - entities.LoanApplication.fields.interest_accrual_option
          - validations[priority=11]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A federal-style accrual option outside the three declared members is rejected, which matters because that field selects the in-school accrual rule; the nearest declared member is accepted in the same test."
        test_recipe:
          setup:
            - 'One borrower, one school and one policy on file.'
          setup_api_calls:
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "Sage Borrower", email: "sage@example.com", state_code: "OH", program_level: "UNDERGRADUATE", credit_score: 700, dti_ratio: 0.22 }
              as: PlatformAdmin
              captures: { brw: $.data.id }
            - call: "POST /private-student-loans/schools"
              payload: { name: "Enum College", school_code: "009995", state_code: "OH", certification_capacity_per_period_cents: 100000000, active: true }
              as: PlatformAdmin
              captures: { sch: $.data.id }
            - call: "POST /private-student-loans/loan-policies"
              payload: { product_code: "SM-ENM-2026", program_level: "UNDERGRADUATE", extended_term_months: 180, cosigner_release_min_on_time_payments: 24, capitalized_interest_cap_pct: 0.10, in_school_max_deferment_months: 48, repayment_max_deferment_months: 24, delinquency_notice_threshold_days: 5, allows_standalone_borrower: false }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /private-student-loans/borrowers/${brw}/cosigners"
              payload: { full_name: "Tate Cosigner", email: "tate@example.com", state_code: "OH", relationship: "PARENT", credit_score: 760, credit_history_months: 150, dti_ratio: 0.2 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { cos: $.data.id }
            - call: "POST /private-student-loans/cosigners/${cos}/reunderwrite"
              payload: { credit_score: 760, dti_ratio: 0.2 }
              as: Cosigner
              as_user_id: "${cos}"
          trigger:
            - call: "POST /private-student-loans/loan-applications"
              payload: { borrower_id: "${brw}", school_id: "${sch}", policy_id: "${pol}", cosigner_id: "${cos}", requested_amount_cents: 900000, cost_of_attendance_cents: 900000, other_aid_cents: 95000, interest_accrual_option: "FEDERAL_SUBSIDIZED", repayment_term_months: 120 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { err_enum: $.data.error_id }
            - call: "POST /private-student-loans/loan-applications"
              payload: { borrower_id: "${brw}", school_id: "${sch}", policy_id: "${pol}", cosigner_id: "${cos}", requested_amount_cents: 900000, cost_of_attendance_cents: 900000, other_aid_cents: 95000, interest_accrual_option: "INTEREST_ONLY", repayment_term_months: 120 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { app_ok: $.data.id }
          assert:
            - '${err_enum} == ERR_INVALID_REQUEST at 400 because the federal-style option is not a private-loan option'
            - 'LoanApplication.${app_ok} exists with interest_accrual_option INTEREST_ONLY'
      - name: accrual_entry_is_an_append_only_log_row_without_a_version
        claim_type: Immutability
        grounds:
          - entities.InterestAccrualEntry
          - endpoints.GET_/private-student-loans/loans/{id}/accrual-entries
        distinguishing_aspect: "An InterestAccrualEntry declares common_fields false, so ledger rows expose only id and created_at and carry no version field at all - they are events, not resources."
        test_recipe:
          setup:
            - 'An IN_SCHOOL loan with one booked accrual entry.'
          setup_api_calls:
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "Ada Borrower", email: "ada@example.com", state_code: "VT", program_level: "UNDERGRADUATE", credit_score: 700, dti_ratio: 0.24 }
              as: PlatformAdmin
              captures: { brw: $.data.id }
            - call: "POST /private-student-loans/schools"
              payload: { name: "Green Mountain College", school_code: "003010", state_code: "VT", certification_capacity_per_period_cents: 100000000, active: true }
              as: PlatformAdmin
              captures: { sch: $.data.id }
            - call: "POST /private-student-loans/loan-policies"
              payload: { product_code: "SM-UG-DEF", program_level: "UNDERGRADUATE", extended_term_months: 180, cosigner_release_min_on_time_payments: 24, capitalized_interest_cap_pct: 0.10, in_school_max_deferment_months: 48, repayment_max_deferment_months: 24, delinquency_notice_threshold_days: 5, allows_standalone_borrower: false }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /private-student-loans/borrowers/${brw}/cosigners"
              payload: { full_name: "Cara Cosigner", email: "cara@example.com", state_code: "VT", relationship: "PARENT", credit_score: 760, credit_history_months: 170, dti_ratio: 0.2 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { cos: $.data.id }
            - call: "POST /private-student-loans/cosigners/${cos}/reunderwrite"
              payload: { credit_score: 760, dti_ratio: 0.2 }
              as: Cosigner
              as_user_id: "${cos}"
            - call: "POST /private-student-loans/loan-applications"
              payload: { borrower_id: "${brw}", school_id: "${sch}", policy_id: "${pol}", cosigner_id: "${cos}", requested_amount_cents: 805000, cost_of_attendance_cents: 900000, other_aid_cents: 95000, interest_accrual_option: "DEFERRED", repayment_term_months: 120 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { app: $.data.id }
            - call: "POST /private-student-loans/loan-applications/${app}/decision"
              payload: { decision: "APPROVE" }
              as: Underwriter
            - call: "GET /private-student-loans/loan-applications/${app}/loans"
              payload: {}
              as: Underwriter
              captures: { loan: "$.data[0].id" }
            - call: "POST /private-student-loans/loan-applications/${app}/school-certifications"
              payload: { academic_period_label: "2026-FALL", certified_amount_cents: 805000, certified_enrollment_status: "IN_SCHOOL", period_end_date: "2026-12-20T00:00:00Z" }
              as: School
              as_user_id: "${sch}"
              captures: { cert: $.data.id }
            - call: "POST /private-student-loans/school-certifications/${cert}/certify"
              payload: { certified_amount_cents: 805000, certified_enrollment_status: "IN_SCHOOL" }
              as: School
              as_user_id: "${sch}"
            - call: "GET /private-student-loans/loans/${loan}"
              payload: {}
              as: Servicer
              captures: { v_dsb: $.data.version }
            - call: "POST /private-student-loans/loans/${loan}/disbursements"
              payload: { academic_period_label: "2026-FALL", period_start_date: "2026-09-02T00:00:00Z", period_end_date: "2026-12-20T00:00:00Z", scheduled_date: "2026-09-15T00:00:00Z", amount_cents: 805000, expected_loan_version: "${v_dsb}" }
              as: Servicer
              captures: { dsb: $.data.id }
            - call: "POST /private-student-loans/disbursements/${dsb}/release"
              payload: {}
              as: Servicer
            - call: "POST /private-student-loans/loans/${loan}/accrual-entries"
              payload: { entry_date: "2026-09-30T00:00:00Z", window_months: 6 }
              as: Servicer
          trigger:
            - call: "GET /private-student-loans/loans/${loan}/accrual-entries"
              payload: {}
              as: Servicer
              captures: { entry_id: "$.data[0].id", entry_status: "$.data[0].entry_status", entry_created: "$.data[0].created_at" }
          assert:
            - 'the ledger returns exactly one row with entry_status ACCRUED and source_event PERIOD_ACCRUAL'
            - 'the row carries id ${entry_id} and a non-null created_at ${entry_created}'
            - 'the row exposes no version field, because InterestAccrualEntry declares common_fields false'
            - 'Loan.${loan}.unpaid_interest_cents == 15096 and no capitalization entry exists yet'

  # ===========================================================================
  - section: state_machines
    instances:

      - name: cancel_an_already_cancelled_application_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.LoanApplication.SUBMITTED_to_CANCELLED
          - state_machines.LoanApplication.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second cancel on an already CANCELLED application - a declared terminal state - is rejected with ERR_INVALID_STATE, and no SchoolCertification child changes status as a result."
        test_recipe:
          setup:
            - 'An application cancelled while still SUBMITTED.'
          setup_api_calls:
            - call: "POST /private-student-loans/borrowers"
              payload: { full_name: "Blair Borrower", email: "blair@example.com", state_code: "OH", program_level: "UNDERGRADUATE", credit_score: 700, dti_ratio: 0.22 }
              as: PlatformAdmin
              captures: { brw: $.data.id }
            - call: "POST /private-student-loans/schools"
              payload: { name: "Terminal College", school_code: "003021", state_code: "OH", certification_capacity_per_period_cents: 100000000, active: true }
              as: PlatformAdmin
              captures: { sch: $.data.id }
            - call: "POST /private-student-loans/loan-policies"
              payload: { product_code: "SM-TRM-2026", program_level: "UNDERGRADUATE", extended_term_months: 180, cosigner_release_min_on_time_payments: 24, capitalized_interest_cap_pct: 0.10, in_school_max_deferment_months: 48, repayment_max_deferment_months: 24, delinquency_notice_threshold_days: 5, allows_standalone_borrower: false }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /private-student-loans/borrowers/${brw}/cosigners"
              payload: { full_name: "Casey Cosigner", email: "casey@example.com", state_code: "OH", relationship: "PARENT", credit_score: 760, credit_history_months: 150, dti_ratio: 0.2 }
              as: Borrower
              as_user_id: "${brw}"
              captures: { cos: $.data.id }
            - call: "POST /private-student-loans/cosigners/${cos}/reunderwrite"
              payload: { credit_score: 760, dti_ratio: 0.2 }
              as: Cosigner
              as_user_id: "${cos}"
            - call: "POST /private-student-loans/loan-applications"
