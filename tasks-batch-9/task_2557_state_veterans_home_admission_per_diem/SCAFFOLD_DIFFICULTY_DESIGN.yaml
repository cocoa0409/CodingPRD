      - name: home_recognition_beats_claim_month_not_closed_on_submit
        grounds:
          - validations[priority=70,ERR_HOME_NOT_RECOGNIZED]
          - validations[priority=85,ERR_CLAIM_MONTH_NOT_CLOSED]
          - errors.ERR_HOME_NOT_RECOGNIZED
          - errors.ERR_CLAIM_MONTH_NOT_CLOSED
          - state_machines.VeteransHome.RECOGNIZED_to_SUSPENDED
        distinguishing_aspect: |
          A different priority pair on a different endpoint: the submit request violates the
          priority-70 recognition gate and the priority-85 closed-month gate at once, and must
          answer ERR_HOME_NOT_RECOGNIZED. Restoring recognition without touching the clock then
          flips the same request to ERR_CLAIM_MONTH_NOT_CLOSED, so neither error can be produced by
          an implementation that only ever checks one of the two.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-09-01T00:00:00Z."
            - "One VeteransHome moved to SUSPENDED by an explicit recognition action BEFORE any claim exists (a suspension voids DRAFT claims, so the ordering matters)."
            - "One CERTIFIED NURSING CareUnit under that home."
            - "One DRAFT PerDiemClaim for claim_month 2026-09 — the current, not-yet-closed month."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: StateProgramAdmin
