              as: PlatformAdmin
          trigger:
            - call: "GET /smart-home-support/household-members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: "$.data.error_id" }
          assert: ["HTTP status == 404", "response data.error_id == ERR_MEMBER_NOT_FOUND"]

      - name: subscription_plan_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_PLAN_NOT_FOUND]", "validations[priority=6]"]
        distinguishing_aspect: "A well-formed but unknown SubscriptionPlan id returns ERR_PLAN_NOT_FOUND with HTTP 404."
        test_recipe:
