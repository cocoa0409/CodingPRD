              payload: {}
              as: BenefitsAdmin
          assert:
            - "the first recompute returned 422 with ${err_id} == ERR_NO_HOURS_DATA"
            - "Employee.${emp_zero_id}.measured_average_hours == null and full_time_month_count == 0 and last_recomputed_at == null"
