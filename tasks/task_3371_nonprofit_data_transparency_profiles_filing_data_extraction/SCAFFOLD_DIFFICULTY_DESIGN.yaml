        distinguishing_aspect: |
          The Filing -> Organization pair: POST /nonprofits/filings/{id}/normalize is legal for the
          filing's own state (EXTRACTED) but is refused because the owning Organization is
          DISSOLVED, an entity the request never mentions.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Cascade Youth Trust was ACTIVE and its filing reached EXTRACTED with one PENDING TOTREV line; the organization was then dissolved by a finalized DISSOLUTION identity case."
          setup_api_calls:
            - *clock
            - *cy_org
            - *cy_prog
            - *cy_l1
            - *cy_l2
            - *cy_l3
            - *cy_verify
            - *cy_filing
            - *cy_extract
            - call: "POST /nonprofits/identity-cases"
              payload: { subject_organization_id: "${cy_id}", case_type: "DISSOLUTION", effective_date: "2026-09-01T00:00:00Z", resolution_note: "Cascade Youth Trust wound down operations." }
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { cy_case: $.data.id }
            - call: "POST /nonprofits/identity-cases/${cy_case}/finalize"
              payload: { resolution_decision: "FINALIZE" }
              as: PlatformAdmin
              as_user_id: "admin-root"
          trigger:
            - call: "POST /nonprofits/filings/${cy_filing_id}/normalize"
              payload: {}
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { err_dissolved: $.data.error_id }
          assert:
            - "the trigger returns 403 and err_dissolved == ERR_ORG_NOT_IN_GOOD_STANDING"
            - "Filing.${cy_filing_id}.status is still EXTRACTED and total_revenue_cents == 0"
            - "the filing's ExtractedField rows are still normalization_status PENDING"
            - "Organization.${cy_id}.profile_status == DISSOLVED"

      - name: correction_accept_requires_target_filing_still_normalized
        grounds:
          - validations[priority=5]
          - state_machines.Filing.NORMALIZED_to_VOIDED
          - state_machines.CorrectionRequest.UNDER_REVIEW_to_ACCEPTED
          - endpoints.POST_/nonprofits/correction-requests/{id}/decide
        distinguishing_aspect: |
          The CorrectionRequest -> Filing pair, different from the Filing -> Organization
          pair: the review machine is willing (UNDER_REVIEW -> ACCEPTED is declared) but the
          target field's parent Filing was voided in the meantime, so the accept is refused.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Cascade Youth Trust has a NORMALIZED filing with one CORRECTED-eligible TOTREV line, one CorrectionRequest against that line in UNDER_REVIEW, and the filing itself was then voided."
          setup_api_calls:
            - *clock
            - *cy_org
            - *cy_prog
            - *cy_l1
            - *cy_l2
            - *cy_l3
            - *cy_verify
            - *cy_filing
            - *cy_extract
            - *cy_normalize
            - call: "GET /nonprofits/filings/${cy_filing_id}/extracted-fields"
              payload: {}
              as: OrganizationUser
              as_user_id: "${cy_id}"
              captures: { cy_field: "$.data[0].id", cy_field_v: "$.data[0].version" }
            - call: "POST /nonprofits/extracted-fields/${cy_field}/correction-requests"
              payload: { requested_value: "2000.00", evidence_url: "https://evidence.example.org/cascade-2025-audited.pdf", justification: "The audited statement reports total revenue of 2000.00.", expected_extracted_field_version: "${cy_field_v}" }
              as: OrganizationUser
              as_user_id: "${cy_id}"
              captures: { cy_cr: $.data.id }
            - call: "POST /nonprofits/correction-requests/${cy_cr}/decide"
              payload: { decision: "CLAIM" }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/filings/${cy_filing_id}/void"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
          trigger:
            - call: "POST /nonprofits/correction-requests/${cy_cr}/decide"
              payload: { decision: "ACCEPT" }
              as: PlatformVerifier
              as_user_id: "ver-dana"
              captures: { err_filing_void: $.data.error_id }
          assert:
            - "the trigger returns 409 and err_filing_void == ERR_INVALID_STATE"
            - "Filing.${cy_filing_id}.status == VOIDED"
            - "CorrectionRequest.${cy_cr}.status is still UNDER_REVIEW"
            - "ExtractedField.${cy_field}.normalized_value_cents == 100000 and normalization_status == NORMALIZED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: license_half_open_terms_allow_adjacent_renewal_but_reject_overlap
        grounds:
          - errors[ERR_LICENSE_TERM_OVERLAP]
          - state_machines.DataLicense.DRAFT_to_ACTIVE
          - entities.DataLicense.fields.term_start
          - endpoints.POST_/nonprofits/licenses/{id}/activate
        distinguishing_aspect: |
          Half-open interval semantics on DataLicense: a successor term whose term_start
          equals the prior term_end is NOT an overlap and activates, while a term that starts
          one day earlier does overlap and is rejected.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Helios Foundation is ACTIVE and holds one ACTIVE RESEARCHER license covering [2026-09-01T00:00:00Z, 2027-09-01T00:00:00Z)."
          setup_api_calls:
            - *clock
            - *hel_org
            - call: "POST /nonprofits/organizations/${hel_id}/programs"
              payload: { program_name: "Hudson Valley Grants", fiscal_year: 2025, subject_code: "T20", disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${hel_id}"
            - call: "POST /nonprofits/organizations/${hel_id}/leadership-members"
              payload: { full_name: "Marta Silva", office_title: "Executive Director", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${hel_id}"
            - call: "POST /nonprofits/organizations/${hel_id}/leadership-members"
              payload: { full_name: "Owen Blake", office_title: "Board Chair", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${hel_id}"
            - call: "POST /nonprofits/organizations/${hel_id}/leadership-members"
              payload: { full_name: "Ruth Adeyemi", office_title: "Treasurer", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${hel_id}"
            - call: "POST /nonprofits/organizations/${hel_id}/verify"
              payload: { target_level: "DOCUMENT_VERIFIED", evidence_count: 1 }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/organizations/${hel_id}/licenses"
              payload: { tier: "RESEARCHER", permitted_use: "AGGREGATE_RESEARCH", term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z", projected_annual_records: 12000 }
              as: DataConsumer
              as_user_id: "${hel_id}"
              captures: { hel_lic1: $.data.id }
            - call: "POST /nonprofits/licenses/${hel_lic1}/activate"
              payload: {}
              as: DataConsumer
              as_user_id: "${hel_id}"
          trigger:
            - call: "POST /nonprofits/organizations/${hel_id}/licenses"
              payload: { tier: "RESEARCHER", permitted_use: "AGGREGATE_RESEARCH", term_start: "2027-09-01T00:00:00Z", term_end: "2028-09-01T00:00:00Z", projected_annual_records: 12000 }
              as: DataConsumer
              as_user_id: "${hel_id}"
              captures: { hel_lic2: $.data.id }
            - call: "POST /nonprofits/licenses/${hel_lic2}/activate"
              payload: {}
              as: DataConsumer
              as_user_id: "${hel_id}"
              captures: { hel_lic2_status: $.data.status }
            - call: "POST /nonprofits/organizations/${hel_id}/licenses"
              payload: { tier: "RESEARCHER", permitted_use: "AGGREGATE_RESEARCH", term_start: "2027-08-31T00:00:00Z", term_end: "2028-08-31T00:00:00Z", projected_annual_records: 12000 }
              as: DataConsumer
              as_user_id: "${hel_id}"
              captures: { hel_lic3: $.data.id }
            - call: "POST /nonprofits/licenses/${hel_lic3}/activate"
              payload: {}
              as: DataConsumer
              as_user_id: "${hel_id}"
              captures: { err_overlap: $.data.error_id }
          assert:
            - "hel_lic2_status == ACTIVE — the adjacent term [2027-09-01, 2028-09-01) is not an overlap"
            - "err_overlap == ERR_LICENSE_TERM_OVERLAP and the response status is 409"
            - "DataLicense.${hel_lic3}.status == DRAFT"
            - "GET /nonprofits/organizations/${hel_id}/licenses?status=ACTIVE returns exactly 2 rows"

      - name: filing_closed_coverage_intervals_reject_touching_endpoints
        grounds:
          - errors[ERR_FILING_COVERAGE_OVERLAP]
          - entities.Filing.fields.coverage_start
          - entities.Filing.fields.coverage_end
          - endpoints.POST_/nonprofits/filings
        distinguishing_aspect: |
          Closed interval semantics on Filing, contrasted with the DataLicense half-open
          rule: a new filing of a different form_type whose coverage_start equals the prior
          filing's coverage_end is rejected, while a coverage window starting the next day is
          accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Cascade Youth Trust has one FORM_990 filing covering [2025-01-01T00:00:00Z, 2025-12-31T00:00:00Z]."
          setup_api_calls:
            - *clock
            - *cy_org
            - *cy_prog
            - *cy_l1
            - *cy_l2
            - *cy_l3
            - *cy_verify
            - *cy_filing
            - call: "GET /nonprofits/organizations/${cy_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { cy_v2: $.data.version }
          trigger:
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${cy_id}", form_type: "FORM_990_EZ", form_version_year: 2023, tax_year: 2025, coverage_start: "2025-12-31T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z", source: "ORG_UPLOAD", expected_organization_version: "${cy_v2}" }
              as: OrganizationUser
              as_user_id: "${cy_id}"
              captures: { err_touch: $.data.error_id }
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${cy_id}", form_type: "FORM_990_EZ", form_version_year: 2023, tax_year: 2026, coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z", source: "ORG_UPLOAD", expected_organization_version: "${cy_v2}" }
              as: OrganizationUser
              as_user_id: "${cy_id}"
              captures: { cy_ez_filing: $.data.id }
          assert:
            - "the touching request returns 409 and err_touch == ERR_FILING_COVERAGE_OVERLAP"
            - "the disjoint request returns 201 and Filing.${cy_ez_filing}.status == RECEIVED"
            - "GET /nonprofits/organizations/${cy_id}/filings returns exactly 2 rows"
            - "Filing.${cy_ez_filing}.form_type == FORM_990_EZ and tax_year == 2026"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: license_records_accessed_conserved_across_usage_void
        grounds:
          - entities.DataLicense.fields.records_accessed
          - state_machines.DataLicense.ACTIVE_to_ACTIVE
          - calculations.license_annual_fee_cents
          - endpoints.POST_/nonprofits/licenses/{id}/usage-events/{event_id}/void
        distinguishing_aspect: |
          A conserved COUNT: after three posted events of 4000, 5000 and 6000 records the
          license holds 15000; voiding the third must leave records_accessed exactly equal to
          the sum of the surviving POSTED events (9000), with the overage fee falling back to
          the tier base and no drift of a single record.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Helios Foundation is ACTIVE and holds one ACTIVE RESEARCHER license with included_records 10000."
            - "Three usage events of 4000, 5000 and 6000 records are POSTED, so records_accessed is 15000, overage_records is 5000 and final_annual_fee_cents is 525000."
          setup_api_calls:
            - *clock
            - *hel_org
            - call: "POST /nonprofits/organizations/${hel_id}/programs"
              payload: { program_name: "Hudson Valley Grants", fiscal_year: 2025, subject_code: "T20", disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${hel_id}"
            - call: "POST /nonprofits/organizations/${hel_id}/leadership-members"
              payload: { full_name: "Marta Silva", office_title: "Executive Director", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${hel_id}"
            - call: "POST /nonprofits/organizations/${hel_id}/leadership-members"
              payload: { full_name: "Owen Blake", office_title: "Board Chair", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${hel_id}"
            - call: "POST /nonprofits/organizations/${hel_id}/leadership-members"
              payload: { full_name: "Ruth Adeyemi", office_title: "Treasurer", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC", compensation_cents: 0 }
              as: OrganizationUser
              as_user_id: "${hel_id}"
            - call: "POST /nonprofits/organizations/${hel_id}/verify"
              payload: { target_level: "DOCUMENT_VERIFIED", evidence_count: 1 }
              as: PlatformVerifier
              as_user_id: "ver-dana"
            - call: "POST /nonprofits/organizations/${hel_id}/licenses"
              payload: { tier: "RESEARCHER", permitted_use: "AGGREGATE_RESEARCH", term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z", projected_annual_records: 12000 }
              as: DataConsumer
              as_user_id: "${hel_id}"
              captures: { hel_lic: $.data.id }
            - call: "POST /nonprofits/licenses/${hel_lic}/activate"
              payload: {}
              as: DataConsumer
              as_user_id: "${hel_id}"
            - call: "POST /nonprofits/licenses/${hel_lic}/usage-events"
              payload: { dataset_scope: "ORGANIZATION_PROFILES", record_count: 4000, purpose_code: "COHORT_A" }
              as: DataConsumer
              as_user_id: "${hel_id}"
              captures: { ev1: $.data.id }
            - call: "POST /nonprofits/licenses/${hel_lic}/usage-events"
              payload: { dataset_scope: "FILING_FINANCIALS", record_count: 5000, purpose_code: "COHORT_B" }
              as: DataConsumer
              as_user_id: "${hel_id}"
              captures: { ev2: $.data.id }
            - call: "POST /nonprofits/licenses/${hel_lic}/usage-events"
              payload: { dataset_scope: "GRANT_HISTORY", record_count: 6000, purpose_code: "COHORT_C" }
              as: DataConsumer
              as_user_id: "${hel_id}"
              captures: { ev3: $.data.id }
          trigger:
            - call: "POST /nonprofits/licenses/${hel_lic}/usage-events/${ev3}/void"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { ev3_status: $.data.status }
            - call: "GET /nonprofits/licenses/${hel_lic}"
              payload: {}
              as: DataConsumer
              as_user_id: "${hel_id}"
          assert:
            - "ev3_status == VOIDED"
            - "DataLicense.${hel_lic}.records_accessed == 9000"
            - "DataLicense.${hel_lic}.records_accessed == 4000 + 5000 — exactly the POSTED events, with no drift"
            - "DataLicense.${hel_lic}.records_accessed != 15000"
            - "DataLicense.${hel_lic}.overage_records == 0 and overage_flag == false"
            - "DataLicense.${hel_lic}.final_annual_fee_cents == 500000"

      - name: organization_revenue_conserved_across_filing_supersede_and_void
        grounds:
          - entities.Organization.fields.total_revenue_cents
          - state_machines.Filing.NORMALIZED_to_SUPERSEDED
          - state_machines.Filing.SUPERSEDED_to_NORMALIZED
          - calculations.organization_total_revenue_cents
          - endpoints.POST_/nonprofits/filings/{id}/void
        distinguishing_aspect: |
          A conserved CURRENCY AGGREGATE rather than a count: creating a higher revision
          supersedes the original filing and moves Organization.total_revenue_cents, and
          voiding that revision must restore the aggregate to exactly 100000 cents because
          the superseded filing returns to the status it held before supersession.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Cascade Youth Trust is ACTIVE with one NORMALIZED FORM_990 filing for tax_year 2025 whose single TOTREV line normalized to 100000 cents, so Organization.total_revenue_cents is 100000."
          setup_api_calls:
            - *clock
            - *cy_org
            - *cy_prog
            - *cy_l1
            - *cy_l2
            - *cy_l3
            - *cy_verify
            - *cy_filing
            - *cy_extract
            - *cy_normalize
            - call: "GET /nonprofits/organizations/${cy_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
              captures: { cy_v_pre: $.data.version, cy_rev_pre: $.data.total_revenue_cents }
          trigger:
            - call: "POST /nonprofits/filings"
              payload: { organization_id: "${cy_id}", form_type: "FORM_990", form_version_year: 2024, tax_year: 2025, coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", source: "ORG_UPLOAD", expected_organization_version: "${cy_v_pre}" }
              as: OrganizationUser
              as_user_id: "${cy_id}"
              captures: { cy_rev2: $.data.id, cy_rev2_revision: $.data.revision_number }
            - call: "POST /nonprofits/filings/${cy_rev2}/void"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-root"
          assert:
            - "cy_rev_pre == 100000"
            - "Filing.${cy_rev2}.revision_number == 2 and Filing.${cy_rev2}.status == VOIDED"
            - "Filing.${cy_filing_id}.status == NORMALIZED — restored to the pre_supersede_status recorded at supersession"
            - "Filing.${cy_filing_id}.superseded_by_revision_number is null after the restore"
            - "Organization.${cy_id}.total_revenue_cents == 100000 — identical to cy_rev_pre, zero drift"
            - "GET /nonprofits/organizations/${cy_id}/filings?status=NORMALIZED returns exactly 1 row"

