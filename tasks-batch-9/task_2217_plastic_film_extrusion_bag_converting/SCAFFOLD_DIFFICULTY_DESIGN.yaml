            - *a_plate1_mount
            - *a_pj1
          trigger:
            - { call: "POST /print-jobs/${pj1}/registration-check", payload: { registration_drift_micron: 40.0 }, as: PrintOperator }
            - { call: "POST /print-jobs/${pj1}/start-print", payload: {}, as: PrintOperator }
            - { call: "POST /print-jobs/${pj1}/color-proof", payload: { delta_e_measured: 3.0 }, as: PrintOperator }
