    side_effects: ["status → COMPLETED", "Select recovery_variant", "recovered_cost_cents := selected variant"]

  - method: POST
    path: "/construction-projects/{pid}/acceleration-directives/{aid}/dispute"
    description: "Contractor disputes directive"
    roles: [ContractorScheduler]
    code: 200
    input: []
    output: AccelerationDirective
    side_effects: ["status → DISPUTED"]

  - method: POST
    path: "/construction-projects/{pid}/acceleration-directives/{aid}/negotiate"
    description: "Open negotiation"
    roles: [OwnerRepresentative]
    code: 200
    input: []
    output: AccelerationDirective
    side_effects: ["status DISPUTED → UNDER_NEGOTIATION"]

  - method: POST
    path: "/construction-projects/{pid}/acceleration-directives/{aid}/resolve"
    description: "Resolve a disputed directive"
    roles: [OwnerRepresentative]
    code: 200
    input: [recovery_variant, recovered_cost_cents]
    output: AccelerationDirective
    side_effects: ["status UNDER_NEGOTIATION → RESOLVED", "recovered_cost_cents := payload"]

  # --- LiquidatedDamagesAssessment ---
  - method: POST
    path: "/construction-projects/{pid}/ld-assessments"
    description: "Draft an LD assessment (or system creates one automatically on progress-update approval if schedule overruns)"
    roles: [OwnerRepresentative]
    code: 201
    input: [assessment_period_start, assessment_period_end]
