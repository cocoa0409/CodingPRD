          assert:
            - "TelehealthReferral.${refrf}.referral_reason == ABNORMAL"
            - "TelehealthReferral.${refrf}.status == SCHEDULED"

      - name: abnormal_release_no_consent_skips_referral_silently
        claim_type: Conditional action
        grounds: ["endpoints", "validations[priority=10]", "state_machines.LabResult.PROCESSING_to_RELEASED", "entities.Patient.fields.consent_share_results"]
        distinguishing_aspect: "Releasing an ABNORMAL result for a patient with consent_share_results false succeeds (200) but mints NO referral (privacy cascade silently skipped)."
        test_recipe:
          setup: ["Offering NC ref 70-100 (consent FALSE). HOME_KIT order, processed analyzer 150 (ABNORMAL)."]
          setup_api_calls:
