# =============================================================================
# SCAFFOLD.yaml — task_2905_competency_based_education_direct_assessment_program
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  2905. Competency-Based Education & Direct Assessment Program (competency-based
  university): competency map and assessment blueprint per program with mastery
  thresholds, subscription term enrollment with unlimited course attempts inside
  the period, faculty mentor caseload assignment and progress cadence
  expectations, assessment submission, evaluator scoring rubric and inter-rater
  reliability, academic integrity controls for unproctored assessments,
  satisfactory academic progress defined by competencies rather than credit
  hours, federal aid disbursement tied to a credit-hour equivalency, transcript
  translation of competencies to credits for transfer

domain_name: competency-based-education
api_prefix: ""   # flat topology: every collection is a top-level path segment

complexity_profile:
  difficulty_level: expert
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a peer collection addressed at `/<collection>/{id}` with
  # foreign keys carried in the request body. No nesting in URL paths except
  # for action sub-paths (`/assessment-attempts/{id}/scores`) that operate on
  # the parent resource itself.

  state_machine_shape: cyclic
  # AssessmentAttempt loops UNDER_REVIEW -> REVISION_REQUESTED -> DRAFT ->
  # UNDER_REVIEW; Student carries two independent axes (enrollment_status ×
  # sap_status) and sap_status itself recovers WARNING -> GOOD_STANDING.

  relationship_patterns:
    - one_to_many          # Program -> Competency, Student -> SubscriptionTerm
    - self_referential     # Competency.prerequisite_competency_id -> Competency.id
    - many_to_many         # MentorAssignment joins Mentor and Student
    - cross_aggregate      # AidDisbursement reads Student.sap_status and SubscriptionTerm

  role_model: segregation_of_duties
  # An Evaluator who also holds the faculty-mentor appointment for a student
  # (Evaluator.mentor_id matches that student's ACTIVE MentorAssignment.mentor_id)
  # may not score that student's assessments; and no Evaluator may supply two
  # non-VOIDED scores on the same attempt.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# All datetimes are ISO 8601 UTC with exactly three fractional digits.
# =============================================================================
entities:

  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Program code, globally unique, uppercase", constraints: "unique; 3-16 chars" }
      - { name: title, type: string, source: input, description: "Program title" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Publication state", constraints: "DRAFT | PUBLISHED" }
      - { name: mastery_threshold_pct, type: number, source: input, default: 80.00, description: "Default minimum final score percent required to master a competency in this program", constraints: "0 < v <= 100; 2 decimals" }
      - { name: units_per_credit_hour, type: number, source: input, default: 3.0, description: "Competency units that equate to one federal credit hour", constraints: "> 0; 1 decimal" }
      - { name: sap_min_units_per_term, type: number, source: input, default: 12, description: "Competency units a student is expected to master per counted subscription term (SAP pace denominator per term)", constraints: "> 0" }
      - { name: required_unit_total, type: number, source: input, default: 120, description: "Cumulative mastered units required to graduate", constraints: "> 0" }
      - { name: irr_tolerance_pct, type: number, source: input, default: 5.00, description: "Maximum absolute gap between the two reader scores on one attempt before adjudication is required", constraints: ">= 0; 2 decimals" }
      - { name: irr_min_paired_reviews, type: integer, source: input, default: 3, description: "Minimum paired reviews an evaluator must accumulate before the inter-rater reliability demotion rule can fire", constraints: ">= 1" }
      - { name: irr_suspend_rate_pct, type: number, source: input, default: 70.00, description: "Agreement rate below which a CERTIFIED evaluator is demoted to PROVISIONAL", constraints: "0 < v <= 100; 2 decimals" }
      - { name: attempt_cooloff_hours, type: integer, source: input, default: 48, description: "Hours that must elapse after an attempt is scored SCORED_NOT_MASTERED before the same student may open another attempt on the same competency", constraints: ">= 0" }
      - { name: attempts_before_endorsement, type: integer, source: input, default: 3, description: "Number of non-VOIDED attempts a student may open on one competency inside one term before a mentor endorsement is required", constraints: ">= 1" }
      - { name: critical_dimension_min_ratio, type: number, source: input, default: 0.70, description: "Minimum score/max_score ratio a rubric dimension flagged critical must reach", constraints: "0 < v <= 1; 2 decimals" }
      - { name: cadence_gate_overdue_days, type: integer, source: input, default: 7, description: "Mentor-contact overdue days at which new assessment attempts are gated", constraints: ">= 1" }
      - { name: blueprint_notice_days, type: integer, source: input, default: 14, description: "Minimum notice, in days from the logical clock, for a superseding blueprint's effective_from_utc", constraints: ">= 0" }
      - { name: aid_earned_pct_full_threshold, type: number, source: input, default: 0.6000, description: "Attended-fraction at or above which the term is treated as 100 percent earned for aid-return purposes", constraints: "0 < v <= 1; 4 decimals" }
      - { name: aid_min_credit_equivalency, type: integer, source: input, default: 1, description: "Minimum whole credit-hour equivalency a term must have earned before a scheduled disbursement may be released", constraints: ">= 0" }
      - { name: competency_count, type: integer, source: computed, default: 0, description: "Count of Competency rows with program_id == this program and status == ACTIVE" }
      - { name: published_at_utc, type: datetime, source: system, description: "Logical-clock instant at which status became PUBLISHED; null while DRAFT" }

  - name: Competency
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the program whose competency map contains this row" }
      - { name: code, type: string, source: input, description: "Competency code", constraints: "unique within program_id" }
      - { name: title, type: string, source: input, description: "Competency title" }
      - { name: unit_value, type: number, source: input, description: "Competency units awarded on mastery", constraints: "> 0; 2 decimals" }
      - { name: level, type: enum, source: input, description: "Map tier", constraints: "FOUNDATION | CORE | CAPSTONE" }
      - { name: mastery_threshold_pct, type: number, source: input, description: "Per-competency override of the program mastery threshold; null means inherit", constraints: "null or 0 < v <= 100 with 2 decimals" }
      - { name: effective_mastery_threshold_pct, type: number, source: computed, description: "= mastery_threshold_pct when non-null, else Program.mastery_threshold_pct of program_id" }
      - { name: prerequisite_competency_id, type: string, source: input, description: "FK -> Competency.id; self-referential prerequisite that must already be mastered; null when the competency has no prerequisite" }
      - { name: prerequisite_depth, type: integer, source: computed, default: 0, description: "Number of hops from this competency to a competency whose prerequisite_competency_id is null, following prerequisite_competency_id" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Lifecycle", constraints: "ACTIVE | RETIRED" }
      - { name: effective_blueprint_id, type: string, source: computed, description: "Denormalized pointer to the AssessmentBlueprint row for this competency whose effective window contains the logical clock (see calculations.effective_blueprint_resolution); null when no window covers the clock. Not a declared foreign key — it is a derived cache of a window lookup." }
      - { name: mastered_by_student_count, type: integer, source: computed, default: 0, description: "Count of distinct Student ids holding a non-VOIDED SCORED_MASTERED AssessmentAttempt on this competency" }

  - name: AssessmentBlueprint
    parent: null
    common_fields: true
    fields:
      - { name: competency_id, type: string, source: input, description: "FK -> Competency.id; the competency this rubric assesses" }
      - { name: version_label, type: string, source: computed, description: "\"BP-<n>\" where n is the 1-based ordinal of this blueprint among blueprints of competency_id ordered by effective_from_utc ASC, tie-break created_at ASC" }
      - { name: dimensions, type: array, source: input, description: "Ordered rubric dimensions. Each element is { code: string, weight: number (4 decimals), max_score: number (> 0), critical: boolean }", constraints: "1-8 elements; codes unique; sum of weight == 1.0000 exactly" }
      - { name: dimension_count, type: integer, source: computed, description: "Length of dimensions" }
      - { name: passing_rule, type: enum, source: input, description: "How weighted_score_pct and the critical-dimension check combine", constraints: "WEIGHTED_ONLY | WEIGHTED_PLUS_ALL_CRITICAL" }
      - { name: required_evaluator_count, type: integer, source: input, description: "Number of independent reader scores required before the attempt resolves", constraints: "1 | 2" }
      - { name: effective_from_utc, type: datetime, source: input, description: "Inclusive start of this blueprint's effective window on the competency" }
      - { name: effective_to_utc, type: datetime, source: computed, description: "Exclusive end of the effective window; null while this blueprint is the PUBLISHED one. Set to the superseding blueprint's effective_from_utc, so windows tile the competency timeline with no gap." }
      - { name: status, type: enum, source: system, default: "PUBLISHED", description: "Window state", constraints: "PUBLISHED | SUPERSEDED" }
      - { name: attempts_bound_count, type: integer, source: computed, default: 0, description: "Count of AssessmentAttempt rows with blueprint_id == this blueprint" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; the program the student is enrolled against" }
      - { name: full_name, type: string, source: input, description: "Student legal name" }
      - { name: email, type: string, source: input, description: "Student email", constraints: "globally unique" }
      - { name: enrollment_status, type: enum, source: system, default: "APPLICANT", description: "Enrollment axis; evolves independently of sap_status", constraints: "APPLICANT | ACTIVE | SUSPENDED | WITHDRAWN | GRADUATED" }
      - { name: sap_status, type: enum, source: system, default: "GOOD_STANDING", description: "Satisfactory-academic-progress axis, written only by SapReview creation; evolves independently of enrollment_status", constraints: "GOOD_STANDING | WARNING | PROBATION | DISMISSED" }
      - { name: mastered_unit_total, type: number, source: computed, default: 0, description: "Sum of Competency.unit_value over distinct competency_id values for which this student holds an AssessmentAttempt in status SCORED_MASTERED (VOIDED attempts excluded)" }
      - { name: mastered_competency_count, type: integer, source: computed, default: 0, description: "Count of distinct competency_id values contributing to mastered_unit_total" }
      - { name: cumulative_credit_equivalency, type: number, source: computed, default: 0.0, description: "= round_half_up(mastered_unit_total / Program.units_per_credit_hour, 1)" }
      - { name: integrity_strike_count, type: integer, source: computed, default: 0, description: "Count of IntegrityCase rows for this student with status == SUBSTANTIATED" }
      - { name: aid_scheduled_total_cents, type: integer, source: computed, default: 0, description: "Sum of AidDisbursement.scheduled_amount_cents over this student's disbursements" }
      - { name: aid_retained_total_cents, type: integer, source: computed, default: 0, description: "Sum of AidDisbursement.retained_amount_cents over this student's disbursements" }
      - { name: aid_returned_total_cents, type: integer, source: computed, default: 0, description: "Sum of AidDisbursement.returned_amount_cents over this student's disbursements" }
      - { name: activated_at_utc, type: datetime, source: system, description: "Logical-clock instant of APPLICANT -> ACTIVE; null while APPLICANT" }
      - { name: suspended_at_utc, type: datetime, source: system, description: "Logical-clock instant of the most recent ACTIVE -> SUSPENDED; null when never suspended" }
      - { name: withdrawn_at_utc, type: datetime, source: system, description: "Logical-clock instant of withdrawal; null otherwise" }
      - { name: graduated_at_utc, type: datetime, source: system, description: "Logical-clock instant of graduation; null otherwise" }

  - name: SubscriptionTerm
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the subscriber" }
      - { name: term_start_utc, type: datetime, source: input, description: "Inclusive start of the subscription period" }
      - { name: term_end_utc, type: datetime, source: input, description: "Exclusive end of the subscription period", constraints: "> term_start_utc" }
      - { name: tuition_cents, type: integer, source: input, description: "Flat subscription tuition for the whole period", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "Term lifecycle", constraints: "PENDING | ACTIVE | COMPLETED | LAPSED | CANCELLED" }
      - { name: term_days, type: integer, source: computed, description: "= floor((term_end_utc - term_start_utc) / 86400 seconds)" }
      - { name: attempts_used, type: integer, source: computed, default: 0, description: "Count of AssessmentAttempt rows with term_id == this term and status != VOIDED. Uncapped: attempts inside the period are unlimited except for the cool-off and endorsement gates." }
      - { name: units_mastered_in_term, type: number, source: computed, default: 0, description: "Sum of Competency.unit_value over distinct competency_id for attempts with term_id == this term and status == SCORED_MASTERED" }
      - { name: credit_equivalency_earned, type: integer, source: computed, default: 0, description: "= floor(units_mastered_in_term / Program.units_per_credit_hour) — whole credit hours the term has earned for federal aid purposes" }
      - { name: activated_at_utc, type: datetime, source: system, description: "Logical-clock instant of PENDING -> ACTIVE; null while PENDING" }
      - { name: closed_effective_utc, type: datetime, source: system, description: "Effective instant supplied when the term was closed; null while not closed" }
      - { name: attended_days, type: integer, source: computed, description: "= max(0, floor((closed_effective_utc - term_start_utc) / 86400 seconds)); null while not closed" }
      - { name: earned_pct, type: number, source: computed, description: "Fraction of the period the student earned, 4 decimals; null while not closed. See calculations.term_close_aid_return." }
      - { name: institutional_refund_cents, type: integer, source: computed, description: "Tuition refunded to the student on an unearned close; null while not closed" }
      - { name: net_institutional_charge_cents, type: integer, source: computed, description: "= tuition_cents - institutional_refund_cents; null while not closed" }

  - name: Mentor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Faculty mentor name" }
      - { name: email, type: string, source: input, description: "Faculty mentor email", constraints: "globally unique" }
      - { name: max_caseload, type: integer, source: input, description: "Maximum number of concurrently ACTIVE MentorAssignment rows this mentor may hold", constraints: "> 0" }
      - { name: cadence_days, type: integer, source: input, description: "Default progress-contact cadence in days applied to assignments created without an explicit cadence_days", constraints: "> 0" }
      - { name: current_caseload, type: integer, source: computed, default: 0, description: "Count of MentorAssignment rows with mentor_id == this mentor and status == ACTIVE" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Availability for caseload assignment", constraints: "ACTIVE | ON_LEAVE | INACTIVE" }

  - name: MentorAssignment
    parent: null
    common_fields: true
    fields:
      - { name: mentor_id, type: string, source: input, description: "FK -> Mentor.id; the assigned faculty mentor (explicit in the request, or chosen by calculations.mentor_caseload_selector)" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the mentee" }
      - { name: cadence_days, type: integer, source: system, description: "Contact cadence for this pairing: the request's cadence_days when supplied, else the chosen Mentor.cadence_days" }
      - { name: selection_mode, type: enum, source: system, description: "How mentor_id was determined", constraints: "EXPLICIT | AUTO_SELECTED" }
      - { name: assigned_at_utc, type: datetime, source: system, description: "Logical-clock instant of assignment creation" }
      - { name: last_contact_utc, type: datetime, source: system, description: "Logical-clock instant of the most recent recorded contact; null until the first contact" }
      - { name: contact_count, type: integer, source: computed, default: 0, description: "Number of contacts recorded on this assignment" }
      - { name: next_contact_due_utc, type: datetime, source: computed, description: "= coalesce(last_contact_utc, assigned_at_utc) + cadence_days * 86400 seconds" }
      - { name: cadence_status, type: enum, source: computed, default: "COMPLIANT", description: "COMPLIANT while logical_now <= next_contact_due_utc, OVERDUE once logical_now > next_contact_due_utc (exact equality is COMPLIANT)", constraints: "COMPLIANT | OVERDUE" }
      - { name: overdue_days, type: integer, source: computed, default: 0, description: "0 when COMPLIANT, else floor((logical_now - next_contact_due_utc) / 86400 seconds)" }
      - { name: endorsed_competency_ids, type: array, source: computed, description: "Competency ids with an endorsement recorded on this assignment that no attempt has consumed yet, ordered by endorsement created_at ASC" }
      - { name: endorsement_count, type: integer, source: computed, default: 0, description: "Total endorsements ever recorded on this assignment, consumed or not" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "Assignment lifecycle", constraints: "ACTIVE | ENDED" }
      - { name: ended_at_utc, type: datetime, source: system, description: "Logical-clock instant at which status became ENDED; null while ACTIVE" }

  - name: Evaluator
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Evaluator name" }
      - { name: email, type: string, source: input, description: "Evaluator email", constraints: "globally unique" }
      - { name: certification_level, type: enum, source: input, description: "Rubric certification tier", constraints: "ASSOCIATE | SENIOR" }
      - { name: mentor_id, type: string, source: input, description: "FK -> Mentor.id; the faculty-mentor appointment this same person also holds; null when the evaluator holds no mentor appointment. Drives the segregation-of-duties check." }
      - { name: status, type: enum, source: system, default: "CERTIFIED", description: "Scoring eligibility", constraints: "CERTIFIED | PROVISIONAL | SUSPENDED" }
      - { name: submitted_score_count, type: integer, source: computed, default: 0, description: "Count of EvaluatorScore rows with evaluator_id == this evaluator and status == SUBMITTED" }
      - { name: paired_review_count, type: integer, source: computed, default: 0, description: "Count of attempts on which this evaluator supplied reader_ordinal 1 or 2 and both reader slots are filled with status == SUBMITTED scores" }
      - { name: agreeing_review_count, type: integer, source: computed, default: 0, description: "Subset of paired_review_count where abs(reader-1 weighted_score_pct - reader-2 weighted_score_pct) <= Program.irr_tolerance_pct" }
      - { name: irr_agreement_rate_pct, type: number, source: computed, default: 100.00, description: "= 100.00 when paired_review_count == 0, else round_half_up(agreeing_review_count / paired_review_count * 100, 2)" }
      - { name: demoted_at_utc, type: datetime, source: system, description: "Logical-clock instant of the CERTIFIED -> PROVISIONAL inter-rater-reliability demotion; null when never demoted" }

  - name: AssessmentAttempt
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the candidate" }
      - { name: competency_id, type: string, source: input, description: "FK -> Competency.id; the competency under assessment" }
      - { name: blueprint_id, type: string, source: system, description: "FK -> AssessmentBlueprint.id; pinned at attempt creation to the blueprint whose effective window contains the logical clock, and never re-pinned afterwards" }
      - { name: term_id, type: string, source: system, description: "FK -> SubscriptionTerm.id; pinned at attempt creation to the student's ACTIVE term whose window contains the logical clock" }
      - { name: attempt_number, type: integer, source: computed, description: "1-based ordinal of this attempt among the student's non-VOIDED attempts on the same competency, ordered by created_at ASC" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Attempt lifecycle", constraints: "DRAFT | UNDER_REVIEW | ADJUDICATION | INTEGRITY_HOLD | REVISION_REQUESTED | SCORED_MASTERED | SCORED_NOT_MASTERED | VOIDED" }
      - { name: held_from_status, type: enum, source: system, description: "Status the attempt occupied immediately before it entered INTEGRITY_HOLD, so the hold can be released back to it; null when not held", constraints: "null | DRAFT | UNDER_REVIEW | ADJUDICATION" }
      - { name: integrity_hold, type: boolean, source: computed, default: false, description: "True while at least one IntegrityCase on this attempt has status OPEN or UNDER_INVESTIGATION" }
      - { name: artifact_hash, type: string, source: input, description: "Client-computed hash of the submitted artifact, supplied on submit; null while DRAFT and never submitted" }
      - { name: integrity_attestation_accepted, type: boolean, source: input, default: false, description: "Unproctored-assessment attestation checkbox supplied on submit" }
      - { name: client_fingerprint, type: string, source: input, description: "Opaque device fingerprint supplied on submit; null while never submitted" }
      - { name: submitted_at_utc, type: datetime, source: system, description: "Logical-clock instant of the most recent submit; null while never submitted" }
      - { name: scores_received_count, type: integer, source: computed, default: 0, description: "Count of EvaluatorScore rows on this attempt with status == SUBMITTED" }
      - { name: final_score_pct, type: number, source: computed, description: "Resolved attempt score, 2 decimals; null before the first score. See calculations.attempt_final_score." }
      - { name: is_provisional_score, type: boolean, source: computed, default: false, description: "True while final_score_pct reflects the provisional single-reader variant on a two-reader blueprint" }
      - { name: score_variant, type: enum, source: computed, description: "Which variant produced final_score_pct; null before the first score", constraints: "null | SINGLE_READER_FINAL | PROVISIONAL_SINGLE_READER | TWO_READER_MEAN | ADJUDICATED" }
      - { name: critical_fail, type: boolean, source: computed, default: false, description: "True when the resolving score set contains a critical dimension below Program.critical_dimension_min_ratio" }
      - { name: scored_at_utc, type: datetime, source: system, description: "Logical-clock instant at which the attempt reached SCORED_MASTERED or SCORED_NOT_MASTERED; null otherwise" }
      - { name: mastered_at_utc, type: datetime, source: system, description: "Logical-clock instant at which the attempt reached SCORED_MASTERED; null otherwise" }
      - { name: cooloff_until_utc, type: datetime, source: computed, description: "= scored_at_utc + Program.attempt_cooloff_hours * 3600 seconds when status == SCORED_NOT_MASTERED, else null" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of times this attempt has entered REVISION_REQUESTED" }
      - { name: endorsement_consumed, type: boolean, source: computed, default: false, description: "True when this attempt's creation consumed a mentor endorsement for its competency" }

  - name: EvaluatorScore
    parent: null
    common_fields: true
    fields:
      - { name: attempt_id, type: string, source: input, description: "FK -> AssessmentAttempt.id; the attempt being scored" }
      - { name: evaluator_id, type: string, source: input, description: "FK -> Evaluator.id; the reader" }
      - { name: dimension_scores, type: array, source: input, description: "One element per blueprint dimension: { code: string, score: number (2 decimals) }", constraints: "codes MUST equal the bound blueprint's dimension codes as a set; 0 <= score <= that dimension's max_score" }
      - { name: narrative, type: string, source: input, description: "Free-text reader narrative; null when omitted" }
      - { name: weighted_score_pct, type: number, source: computed, description: "This reader's rubric score, 2 decimals. See calculations.rubric_weighted_score." }
      - { name: critical_fail, type: boolean, source: computed, default: false, description: "True when any dimension flagged critical scored below Program.critical_dimension_min_ratio of its max_score" }
      - { name: reader_ordinal, type: integer, source: computed, description: "1 for the first non-VOIDED score on the attempt, 2 for the second, 3 for the adjudicating score" }
      - { name: is_adjudication, type: boolean, source: computed, default: false, description: "True when reader_ordinal == 3" }
      - { name: submitted_at_utc, type: datetime, source: system, description: "Logical-clock instant the score was recorded" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "Score validity", constraints: "SUBMITTED | VOIDED" }
      - { name: voided_reason, type: enum, source: system, description: "Why the score was voided; null while SUBMITTED", constraints: "null | REVISION_REQUESTED | ATTEMPT_VOIDED" }

  - name: IntegrityCase
    parent: null
    common_fields: true
    fields:
      - { name: attempt_id, type: string, source: input, description: "FK -> AssessmentAttempt.id; the attempt under integrity review" }
      - { name: student_id, type: string, source: computed, description: "FK -> Student.id; copied from the attempt's student_id at case creation" }
      - { name: signal_type, type: enum, source: input, description: "What raised the case", constraints: "SHARED_DEVICE | DUPLICATE_ARTIFACT | ATTESTATION_ANOMALY | THIRD_PARTY_REPORT" }
      - { name: severity, type: enum, source: input, description: "Triage severity", constraints: "LOW | MEDIUM | HIGH" }
      - { name: note, type: string, source: input, description: "Officer note; null when omitted" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "Case lifecycle", constraints: "OPEN | UNDER_INVESTIGATION | SUBSTANTIATED | DISMISSED" }
      - { name: sanction, type: enum, source: system, default: "NONE", description: "Sanction recorded at resolution; stays NONE unless the case is SUBSTANTIATED with a sanction", constraints: "NONE | ATTEMPT_VOID | TERM_SUSPENSION" }
      - { name: attempt_status_at_open, type: enum, source: system, description: "AssessmentAttempt.status observed when the case was created; drives whether the attempt was pushed to INTEGRITY_HOLD or merely flagged" }
      - { name: opened_by_user_id, type: string, source: system, description: "Opaque IntegrityOfficer identifier taken from X-User-ID at creation; auto-raised cases carry the literal \"SYSTEM\"" }
      - { name: resolved_by_user_id, type: string, source: system, description: "Opaque IntegrityOfficer identifier taken from X-User-ID at resolution; null while unresolved" }
      - { name: resolved_at_utc, type: datetime, source: system, description: "Logical-clock instant of resolution; null while unresolved" }
      - { name: auto_raised, type: boolean, source: system, default: false, description: "True when the case was raised by the submit-time integrity screen rather than by an officer" }

  - name: SapReview
    parent: null
    common_fields: false   # append-only audit event: carries only id and created_at
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the reviewed student" }
      - { name: term_id, type: string, source: input, description: "FK -> SubscriptionTerm.id; the term at which the checkpoint is taken" }
      - { name: evaluated_at_utc, type: datetime, source: system, description: "Logical-clock instant of the checkpoint" }
      - { name: terms_counted, type: integer, source: computed, description: "Number of the student's SubscriptionTerm rows with status IN {ACTIVE, COMPLETED, LAPSED} whose term_start_utc <= the reviewed term's term_start_utc" }
      - { name: expected_units, type: number, source: computed, description: "= Program.sap_min_units_per_term * terms_counted" }
      - { name: cumulative_mastered_units, type: number, source: computed, description: "Student.mastered_unit_total observed at the checkpoint" }
      - { name: pace_pct, type: number, source: computed, description: "= 100.00 when expected_units == 0, else round_half_up(cumulative_mastered_units / expected_units * 100, 2)" }
      - { name: pace_band, type: enum, source: computed, description: "Band of pace_pct", constraints: "GOOD | WARN | PROB | FAIL" }
      - { name: previous_sap_status, type: enum, source: computed, description: "Student.sap_status immediately before this review" }
      - { name: new_sap_status, type: enum, source: computed, description: "Student.sap_status immediately after this review" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "Opaque Registrar identifier taken from X-User-ID" }

  - name: AidDisbursement
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the aid recipient" }
      - { name: term_id, type: string, source: input, description: "FK -> SubscriptionTerm.id; the payment period" }
      - { name: scheduled_amount_cents, type: integer, source: input, description: "Federal aid scheduled for this payment period", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "Disbursement lifecycle", constraints: "SCHEDULED | HELD | DISBURSED | RETURNED | CANCELLED" }
      - { name: hold_reason, type: enum, source: system, description: "Why the disbursement is HELD; null unless status == HELD", constraints: "null | CREDIT_EQUIVALENCY_SHORTFALL | TERM_CLOSED | INTEGRITY_REVIEW" }
      - { name: credit_equivalency_at_disbursement, type: integer, source: computed, description: "SubscriptionTerm.credit_equivalency_earned captured at the moment of release; null while not released" }
      - { name: outstanding_amount_cents, type: integer, source: computed, description: "Portion of scheduled_amount_cents not yet released or cancelled" }
      - { name: disbursed_amount_cents, type: integer, source: computed, default: 0, description: "Portion released to the student" }
      - { name: cancelled_amount_cents, type: integer, source: computed, default: 0, description: "Portion cancelled before release" }
      - { name: returned_amount_cents, type: integer, source: computed, default: 0, description: "Portion the school returned to the federal program after an unearned close" }
      - { name: retained_amount_cents, type: integer, source: computed, default: 0, description: "= disbursed_amount_cents - returned_amount_cents" }
      - { name: unearned_aid_cents, type: integer, source: computed, description: "Aid attributable to the unearned portion of the period; null until the term closes unearned" }
      - { name: school_return_share_cents, type: integer, source: computed, description: "School's share of unearned_aid_cents; null until the term closes unearned" }
      - { name: student_return_share_cents, type: integer, source: computed, description: "= unearned_aid_cents - school_return_share_cents; null until the term closes unearned" }
      - { name: aid_review_required, type: boolean, source: computed, default: false, description: "True when an already DISBURSED award later lost its credit-hour equivalency basis and needs manual review" }
      - { name: disbursed_at_utc, type: datetime, source: system, description: "Logical-clock instant of release; null while not released" }
      - { name: returned_at_utc, type: datetime, source: system, description: "Logical-clock instant of the return; null while not returned" }

  - name: TranscriptRecord
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; the transcript subject" }
      - { name: purpose, type: enum, source: input, description: "Why the transcript was produced", constraints: "TRANSFER | INTERNAL | STUDENT_COPY" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Transcript lifecycle", constraints: "DRAFT | ISSUED | VOIDED" }
      - { name: competency_line_count, type: integer, source: computed, default: 0, description: "Number of mastered-competency lines on the transcript" }
      - { name: total_mastered_units, type: number, source: computed, default: 0, description: "Sum of unit_value across the lines" }
      - { name: translated_credit_hours, type: number, source: computed, default: 0.0, description: "= round_half_up(total_mastered_units / Program.units_per_credit_hour, 1) — computed from the summed units, NOT by adding the per-line credits" }
      - { name: line_credit_hour_sum, type: number, source: computed, default: 0.00, description: "= sum over lines of line_credit_hours (each already rounded to 2 decimals)" }
      - { name: rounding_residual_credit_hours, type: number, source: computed, default: 0.00, description: "= round_half_up(line_credit_hour_sum - translated_credit_hours, 2) — the pinned-order rounding artifact the receiving institution must reconcile" }
      - { name: lines, type: array, source: computed, description: "One element per mastered competency: { competency_code, unit_value, line_credit_hours, mastered_at_utc }, ordered by mastered_at_utc ASC with tie-break created_at ASC on the mastering attempt" }
      - { name: issued_at_utc, type: datetime, source: system, description: "Logical-clock instant of issuance; null while DRAFT or VOIDED" }
      - { name: voided_reason, type: enum, source: system, description: "Why the record was voided; null unless status == VOIDED", constraints: "null | UNIT_TOTAL_CHANGED | SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# "logical_now" always means the logical clock (see endpoints POST /_clock/...).
# Entries that carry `state_field:` share their entity with a sibling machine —
# the two fields are independent parallel dimensions on the same row.
# =============================================================================
state_machines:

  - entity: Program
    state_field: status
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /programs/{id}/publish"
        actor: Registrar
        preconditions:
          - "Program.status == DRAFT"
          - "at least one Competency exists with program_id == this program and status == ACTIVE"
        side_effects:
          - "sets Program.published_at_utc = logical_now"
          - "recomputes Program.competency_count"
          - "increments Program.version by 1"
        note: "PUBLISHED is terminal: students and terms may only be created against a PUBLISHED program."

  - entity: Competency
    state_field: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /competencies/{id}/retire"
        actor: Registrar
        preconditions:
          - "Competency.status == ACTIVE"
          - "no AssessmentAttempt with competency_id == this competency has status IN {DRAFT, UNDER_REVIEW, ADJUDICATION, INTEGRITY_HOLD, REVISION_REQUESTED}"
          - "no ACTIVE Competency has prerequisite_competency_id == this competency"
        side_effects:
          - "decrements Program.competency_count by 1 and increments Program.version by 1"
          - "sets every AssessmentBlueprint of this competency with status == PUBLISHED to effective_to_utc = logical_now and status = SUPERSEDED"
          - "increments Competency.version by 1"

  - entity: AssessmentBlueprint
    state_field: status
    initial_state: PUBLISHED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "POST /assessment-blueprints (a later blueprint on the same competency) or POST /competencies/{id}/retire"
        actor: Registrar
        preconditions:
          - "AssessmentBlueprint.status == PUBLISHED"
          - "the superseding blueprint's effective_from_utc > this blueprint's effective_from_utc"
        side_effects:
          - "sets this blueprint's effective_to_utc = the superseding blueprint's effective_from_utc (or logical_now when triggered by competency retirement), so the two windows are contiguous with zero gap"
          - "increments AssessmentBlueprint.version by 1"
          - "recomputes Competency.effective_blueprint_id and increments Competency.version by 1"
        note: "Attempts already bound to this blueprint keep their blueprint_id; the rubric they were graded against never changes."

  - entity: Student
    state_field: enrollment_status
    initial_state: APPLICANT
    terminal_states: [WITHDRAWN, GRADUATED]
    transitions:
      - from: APPLICANT
        to: ACTIVE
        trigger: "POST /students/{id}/activate"
        actor: Registrar
        preconditions:
          - "Student.enrollment_status == APPLICANT"
          - "Program.status of Student.program_id == PUBLISHED"
        side_effects:
          - "sets Student.activated_at_utc = logical_now"
          - "increments Student.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /students/{id}/suspend, or system: IntegrityCase resolution pushes Student.integrity_strike_count to >= 2, or an IntegrityCase resolved with sanction TERM_SUSPENSION"
        actor: Registrar
        preconditions:
          - "Student.enrollment_status == ACTIVE"
        side_effects:
          - "sets Student.suspended_at_utc = logical_now"
          - "sets every AssessmentAttempt of the student in status IN {DRAFT, UNDER_REVIEW, ADJUDICATION} to REVISION_REQUESTED and voids their non-VOIDED EvaluatorScore rows with voided_reason REVISION_REQUESTED"
          - "increments Student.version by 1"
        note: "sap_status is NOT touched: the two dimensions on Student advance independently."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /students/{id}/reinstate"
        actor: Registrar
        preconditions:
          - "Student.enrollment_status == SUSPENDED"
          - "no IntegrityCase of this student has status IN {OPEN, UNDER_INVESTIGATION}"
        side_effects:
          - "leaves Student.suspended_at_utc as the historical record"
          - "leaves Student.sap_status unchanged"
          - "increments Student.version by 1"
        note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE may repeat any number of times."
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /students/{id}/withdraw"
        actor: Registrar
        preconditions:
          - "Student.enrollment_status == ACTIVE"
          - "effective_utc >= Student.activated_at_utc and effective_utc <= logical_now"
        side_effects:
          - "sets Student.withdrawn_at_utc = effective_utc"
          - "closes every SubscriptionTerm of the student with status == ACTIVE as CANCELLED with closed_effective_utc = effective_utc, which runs calculations.term_close_aid_return on each"
          - "ends every MentorAssignment of the student with status == ACTIVE and decrements each affected Mentor.current_caseload by 1"
          - "increments Student.version by 1"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /students/{id}/withdraw"
        actor: Registrar
        preconditions:
          - "Student.enrollment_status == SUSPENDED"
          - "effective_utc >= Student.activated_at_utc and effective_utc <= logical_now"
        side_effects:
          - "same side-effect set as ACTIVE -> WITHDRAWN"
      - from: ACTIVE
        to: GRADUATED
        trigger: "system: an attempt reaching SCORED_MASTERED pushes Student.mastered_unit_total to >= Program.required_unit_total"
        actor: system
        preconditions:
          - "Student.enrollment_status == ACTIVE"
          - "Student.mastered_unit_total >= Program.required_unit_total of Student.program_id"
        side_effects:
          - "sets Student.graduated_at_utc = logical_now"
          - "sets Student.sap_status = GOOD_STANDING"
          - "ends every MentorAssignment of the student with status == ACTIVE (ended_at_utc = logical_now) and decrements each affected Mentor.current_caseload by 1"
          - "closes every SubscriptionTerm of the student with status == ACTIVE as COMPLETED with closed_effective_utc = logical_now"
          - "increments Student.version by 1"
        note: "Cascade hop 3 and hop 4 of calculations-cascade `mastery_to_graduation_cascade`."

  - entity: Student
    state_field: sap_status
    initial_state: GOOD_STANDING
    terminal_states: [DISMISSED]
    transitions:
      - from: GOOD_STANDING
        to: WARNING
        trigger: "POST /sap-reviews"
        actor: Registrar
        preconditions:
          - "Student.sap_status == GOOD_STANDING"
          - "SapReview.pace_band == WARN"
        side_effects:
          - "records SapReview.previous_sap_status = GOOD_STANDING and new_sap_status = WARNING"
          - "increments Student.version by 1"
      - from: GOOD_STANDING
        to: PROBATION
        trigger: "POST /sap-reviews"
        actor: Registrar
        preconditions:
          - "Student.sap_status == GOOD_STANDING"
          - "SapReview.pace_band == PROB"
        side_effects:
          - "records the SapReview status pair and increments Student.version by 1"
      - from: WARNING
        to: PROBATION
        trigger: "POST /sap-reviews"
        actor: Registrar
        preconditions:
          - "Student.sap_status == WARNING"
          - "SapReview.pace_band IN {WARN, PROB}"
        side_effects:
          - "records the SapReview status pair and increments Student.version by 1"
        note: "Escalation is prior-status dependent: the same WARN band that produced WARNING from GOOD_STANDING produces PROBATION from WARNING."
      - from: WARNING
        to: GOOD_STANDING
        trigger: "POST /sap-reviews"
        actor: Registrar
        preconditions:
          - "Student.sap_status == WARNING"
          - "SapReview.pace_band == GOOD"
        side_effects:
          - "records the SapReview status pair and increments Student.version by 1"
        note: "Recovery cycle GOOD_STANDING -> WARNING -> GOOD_STANDING."
      - from: PROBATION
        to: GOOD_STANDING
        trigger: "POST /sap-reviews"
        actor: Registrar
        preconditions:
          - "Student.sap_status == PROBATION"
          - "SapReview.pace_band == GOOD"
        side_effects:
          - "records the SapReview status pair and increments Student.version by 1"
      - from: PROBATION
        to: DISMISSED
        trigger: "POST /sap-reviews"
        actor: Registrar
        preconditions:
          - "Student.sap_status == PROBATION"
          - "SapReview.pace_band IN {WARN, PROB, FAIL}"
        side_effects:
          - "records the SapReview status pair"
          - "sets every AidDisbursement of the student with status IN {SCHEDULED, HELD} to CANCELLED with cancelled_amount_cents = scheduled_amount_cents and outstanding_amount_cents = 0"
          - "increments Student.version by 1"
      - from: GOOD_STANDING
        to: DISMISSED
        trigger: "POST /sap-reviews"
        actor: Registrar
        preconditions:
          - "Student.sap_status == GOOD_STANDING"
          - "SapReview.pace_band == FAIL"
        side_effects:
          - "same side-effect set as PROBATION -> DISMISSED"
      - from: WARNING
        to: DISMISSED
        trigger: "POST /sap-reviews"
        actor: Registrar
        preconditions:
          - "Student.sap_status == WARNING"
          - "SapReview.pace_band == FAIL"
        side_effects:
          - "same side-effect set as PROBATION -> DISMISSED"
      - from: GOOD_STANDING
        to: GOOD_STANDING
        trigger: "POST /sap-reviews"
        actor: Registrar
        preconditions:
          - "Student.sap_status == GOOD_STANDING"
          - "SapReview.pace_band == GOOD"
        side_effects:
          - "records SapReview.previous_sap_status = GOOD_STANDING and new_sap_status = GOOD_STANDING"
          - "leaves Student.sap_status unchanged and does NOT increment Student.version (no field on Student changes)"
        note: "The SapReview row is still created and is the only observable outcome of a clean checkpoint."

  - entity: SubscriptionTerm
    state_field: status
    initial_state: PENDING
    terminal_states: [COMPLETED, LAPSED, CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /subscription-terms/{id}/activate"
        actor: Registrar
        preconditions:
          - "SubscriptionTerm.status == PENDING"
          - "Student.enrollment_status == ACTIVE"
          - "no other SubscriptionTerm of the same student has status == ACTIVE"
        side_effects:
          - "sets SubscriptionTerm.activated_at_utc = logical_now"
          - "increments SubscriptionTerm.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /subscription-terms/{id}/close with outcome COMPLETED, or the Student ACTIVE -> GRADUATED cascade"
        actor: Registrar
        preconditions:
          - "SubscriptionTerm.status == ACTIVE"
          - "effective_utc >= term_start_utc and effective_utc <= logical_now"
        side_effects:
          - "sets closed_effective_utc = effective_utc, attended_days, earned_pct = 1.0000, institutional_refund_cents = 0, net_institutional_charge_cents = tuition_cents"
          - "sets every AssessmentAttempt on this term with status IN {DRAFT, REVISION_REQUESTED} to VOIDED"
          - "sets every AidDisbursement on this term with status == SCHEDULED to HELD with hold_reason TERM_CLOSED"
          - "increments SubscriptionTerm.version by 1"
        note: "COMPLETED is the earned branch: no refund and no aid return, regardless of attended_days."
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /subscription-terms/{id}/close with outcome LAPSED"
        actor: Registrar
        preconditions:
          - "SubscriptionTerm.status == ACTIVE"
          - "effective_utc >= term_start_utc and effective_utc <= logical_now"
        side_effects:
          - "runs calculations.term_close_aid_return, writing attended_days, earned_pct, institutional_refund_cents, net_institutional_charge_cents"
          - "sets every AssessmentAttempt on this term with status IN {DRAFT, REVISION_REQUESTED} to VOIDED"
          - "for each AidDisbursement on this term: status SCHEDULED -> HELD with hold_reason TERM_CLOSED; status DISBURSED and earned_pct < 1.0000 -> RETURNED with unearned_aid_cents, school_return_share_cents, student_return_share_cents and returned_amount_cents = school_return_share_cents"
          - "increments SubscriptionTerm.version by 1"
        note: "Divergent branch: LAPSED and CANCELLED run the unearned-return arithmetic, COMPLETED does not."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscription-terms/{id}/close with outcome CANCELLED, the Student ACTIVE -> WITHDRAWN cascade, or an IntegrityCase resolved with sanction TERM_SUSPENSION"
        actor: Registrar
        preconditions:
          - "SubscriptionTerm.status == ACTIVE"
          - "effective_utc >= term_start_utc and effective_utc <= logical_now"
        side_effects:
          - "identical side-effect set to ACTIVE -> LAPSED"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /subscription-terms/{id}/close with outcome CANCELLED"
        actor: Registrar
        preconditions:
          - "SubscriptionTerm.status == PENDING"
        side_effects:
          - "sets closed_effective_utc = effective_utc, attended_days = 0, earned_pct = 0.0000, institutional_refund_cents = tuition_cents, net_institutional_charge_cents = 0"
          - "sets every AidDisbursement on this term with status IN {SCHEDULED, HELD} to CANCELLED with cancelled_amount_cents = scheduled_amount_cents and outstanding_amount_cents = 0"
          - "increments SubscriptionTerm.version by 1"

  - entity: MentorAssignment
    state_field: status
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /mentor-assignments/{id}/contacts"
        actor: FacultyMentor
        preconditions:
          - "MentorAssignment.status == ACTIVE"
          - "the acting FacultyMentor's X-User-ID equals MentorAssignment.mentor_id"
          - "Student.enrollment_status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "sets last_contact_utc = logical_now, increments contact_count by 1"
          - "recomputes next_contact_due_utc = logical_now + cadence_days * 86400 seconds, cadence_status = COMPLIANT, overdue_days = 0"
          - "increments MentorAssignment.version by 1"
        note: "Self-transition: the cadence clock resets without leaving ACTIVE."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /mentor-assignments/{id}/endorsements"
        actor: FacultyMentor
        preconditions:
          - "MentorAssignment.status == ACTIVE"
          - "the acting FacultyMentor's X-User-ID equals MentorAssignment.mentor_id"
          - "the endorsed competency_id belongs to Student.program_id and has status == ACTIVE"
          - "competency_id is not already present in endorsed_competency_ids"
        side_effects:
          - "appends competency_id to endorsed_competency_ids and increments endorsement_count by 1"
          - "increments MentorAssignment.version by 1"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /mentor-assignments/{id}/end, a superseding POST /mentor-assignments for the same student, the Student ACTIVE -> GRADUATED cascade, or the Student -> WITHDRAWN cascade"
        actor: Registrar
        preconditions:
          - "MentorAssignment.status == ACTIVE"
        side_effects:
          - "sets ended_at_utc = logical_now"
          - "clears endorsed_competency_ids to the empty array"
          - "decrements Mentor.current_caseload by 1 and increments Mentor.version by 1"
          - "increments MentorAssignment.version by 1"
        note: "Caseload-slot conservation: Mentor.current_caseload == count of ACTIVE assignments holds before and after."

  - entity: AssessmentAttempt
    state_field: status
    initial_state: DRAFT
    terminal_states: [SCORED_MASTERED, VOIDED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /assessment-attempts/{id}/submit"
        actor: Student
        preconditions:
          - "AssessmentAttempt.status == DRAFT"
          - "the acting Student's X-User-ID equals AssessmentAttempt.student_id"
          - "SubscriptionTerm of term_id has status == ACTIVE and term_start_utc <= logical_now < term_end_utc"
          - "integrity_attestation_accepted == true in the request body"
          - "no IntegrityCase on this attempt has status IN {OPEN, UNDER_INVESTIGATION}"
          - "the submit-time integrity screen finds no reusable signal (see side effects for the branch that fires when it does)"
        side_effects:
          - "stores artifact_hash, client_fingerprint, integrity_attestation_accepted; sets submitted_at_utc = logical_now"
          - "recomputes SubscriptionTerm.attempts_used and increments SubscriptionTerm.version by 1"
          - "increments AssessmentAttempt.version by 1"
      - from: DRAFT
        to: INTEGRITY_HOLD
        trigger: "POST /assessment-attempts/{id}/submit when the integrity screen fires"
        actor: Student
        preconditions:
          - "AssessmentAttempt.status == DRAFT"
          - "integrity_attestation_accepted == true"
          - "the same client_fingerprint appears on a non-VOIDED attempt of a DIFFERENT student submitted within 72 hours before logical_now (signal SHARED_DEVICE), or the same artifact_hash appears on a non-VOIDED attempt of a DIFFERENT student (signal DUPLICATE_ARTIFACT); when both fire, DUPLICATE_ARTIFACT is recorded"
        side_effects:
          - "stores artifact_hash, client_fingerprint, submitted_at_utc = logical_now"
          - "sets held_from_status = UNDER_REVIEW and integrity_hold = true"
          - "creates an IntegrityCase with auto_raised = true, opened_by_user_id \"SYSTEM\", status OPEN, severity MEDIUM, attempt_status_at_open = DRAFT"
          - "increments AssessmentAttempt.version by 1"
        note: "Branch: the same trigger reaches UNDER_REVIEW or INTEGRITY_HOLD depending on the screen result, with divergent side-effect sets."
      - from: INTEGRITY_HOLD
        to: UNDER_REVIEW
        trigger: "POST /integrity-cases/{id}/resolve with outcome DISMISSED, or with outcome SUBSTANTIATED and sanction NONE"
        actor: IntegrityOfficer
        preconditions:
          - "AssessmentAttempt.status == INTEGRITY_HOLD and held_from_status == UNDER_REVIEW"
          - "no other IntegrityCase on this attempt has status IN {OPEN, UNDER_INVESTIGATION}"
        side_effects:
          - "restores status to held_from_status, clears held_from_status to null, sets integrity_hold = false"
          - "increments AssessmentAttempt.version by 1"
        note: "Cycle: DRAFT -> INTEGRITY_HOLD -> UNDER_REVIEW rejoins the normal review path."
      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /assessment-attempts/{id}/scores when the bound blueprint requires two readers and this is the first score"
        actor: Evaluator
        preconditions:
          - "AssessmentAttempt.status == UNDER_REVIEW"
          - "AssessmentBlueprint.required_evaluator_count == 2 and scores_received_count == 0"
        side_effects:
          - "creates the EvaluatorScore with reader_ordinal 1 and its weighted_score_pct per calculations.rubric_weighted_score"
          - "sets AssessmentAttempt.final_score_pct = that reader's weighted_score_pct, is_provisional_score = true, score_variant = PROVISIONAL_SINGLE_READER, scores_received_count = 1"
          - "leaves Student.mastered_unit_total untouched"
          - "increments AssessmentAttempt.version by 1"
      - from: UNDER_REVIEW
        to: ADJUDICATION
        trigger: "POST /assessment-attempts/{id}/scores when the second reader's score diverges beyond tolerance"
        actor: Evaluator
        preconditions:
          - "AssessmentAttempt.status == UNDER_REVIEW"
          - "AssessmentBlueprint.required_evaluator_count == 2 and scores_received_count == 1"
          - "abs(reader-1 weighted_score_pct - reader-2 weighted_score_pct) > Program.irr_tolerance_pct"
        side_effects:
          - "creates the EvaluatorScore with reader_ordinal 2; scores_received_count = 2"
          - "sets final_score_pct = null, is_provisional_score = false, score_variant = null"
          - "recomputes paired_review_count, agreeing_review_count and irr_agreement_rate_pct on BOTH readers, and demotes a CERTIFIED reader to PROVISIONAL when paired_review_count >= Program.irr_min_paired_reviews and irr_agreement_rate_pct < Program.irr_suspend_rate_pct"
          - "increments AssessmentAttempt.version by 1"
      - from: UNDER_REVIEW
        to: SCORED_MASTERED
        trigger: "POST /assessment-attempts/{id}/scores when the score set resolves at or above the mastery threshold"
        actor: Evaluator
        preconditions:
          - "AssessmentAttempt.status == UNDER_REVIEW"
          - "scores_received_count reaches AssessmentBlueprint.required_evaluator_count with this score"
          - "final_score_pct >= Competency.effective_mastery_threshold_pct AND (passing_rule == WEIGHTED_ONLY OR critical_fail == false)"
        side_effects:
          - "hop 1: creates the EvaluatorScore, sets final_score_pct per calculations.attempt_final_score, is_provisional_score = false, score_variant SINGLE_READER_FINAL or TWO_READER_MEAN, scored_at_utc = mastered_at_utc = logical_now"
          - "hop 2: because the attempt entered SCORED_MASTERED, increases Student.mastered_unit_total by Competency.unit_value and Student.mastered_competency_count by 1, recomputes Student.cumulative_credit_equivalency, recomputes SubscriptionTerm.units_mastered_in_term and credit_equivalency_earned, and voids every TranscriptRecord of the student with status IN {DRAFT, ISSUED} with voided_reason UNIT_TOTAL_CHANGED"
          - "hop 3: because Student.mastered_unit_total changed, when it now reaches Program.required_unit_total the Student ACTIVE -> GRADUATED transition fires"
          - "hop 4: because the Student entered GRADUATED, every ACTIVE MentorAssignment of the student goes ENDED (each decrementing its Mentor.current_caseload) and every ACTIVE SubscriptionTerm of the student closes COMPLETED"
          - "recomputes inter-rater reliability on both readers when required_evaluator_count == 2"
          - "increments AssessmentAttempt.version by 1"
        note: "Transitive cascade `mastery_to_graduation_cascade`: each hop is caused by the previous hop's mutation, not by the original request."
      - from: UNDER_REVIEW
        to: SCORED_NOT_MASTERED
        trigger: "POST /assessment-attempts/{id}/scores when the score set resolves below the mastery threshold or fails a critical dimension"
        actor: Evaluator
        preconditions:
          - "AssessmentAttempt.status == UNDER_REVIEW"
          - "scores_received_count reaches AssessmentBlueprint.required_evaluator_count with this score"
          - "final_score_pct < Competency.effective_mastery_threshold_pct OR (passing_rule == WEIGHTED_PLUS_ALL_CRITICAL AND critical_fail == true)"
        side_effects:
          - "creates the EvaluatorScore, sets final_score_pct, score_variant, critical_fail, scored_at_utc = logical_now, mastered_at_utc stays null"
          - "sets cooloff_until_utc = logical_now + Program.attempt_cooloff_hours * 3600 seconds"
          - "leaves Student.mastered_unit_total unchanged"
          - "recomputes inter-rater reliability on both readers when required_evaluator_count == 2"
          - "increments AssessmentAttempt.version by 1"
      - from: ADJUDICATION
        to: SCORED_MASTERED
        trigger: "POST /assessment-attempts/{id}/scores by a third reader"
        actor: Evaluator
        preconditions:
          - "AssessmentAttempt.status == ADJUDICATION"
          - "Evaluator.status == CERTIFIED (PROVISIONAL and SUSPENDED evaluators may not adjudicate)"
          - "the adjudicating evaluator supplied neither reader-1 nor reader-2 score"
          - "the adjudicator's weighted_score_pct >= Competency.effective_mastery_threshold_pct and no critical failure blocks it"
        side_effects:
          - "creates the EvaluatorScore with reader_ordinal 3 and is_adjudication = true"
          - "sets final_score_pct = the adjudicator's weighted_score_pct alone, score_variant = ADJUDICATED, is_provisional_score = false"
          - "runs the same hop 2 / hop 3 / hop 4 cascade as UNDER_REVIEW -> SCORED_MASTERED"
          - "increments AssessmentAttempt.version by 1"
      - from: ADJUDICATION
        to: SCORED_NOT_MASTERED
        trigger: "POST /assessment-attempts/{id}/scores by a third reader"
        actor: Evaluator
        preconditions:
          - "AssessmentAttempt.status == ADJUDICATION"
          - "Evaluator.status == CERTIFIED"
          - "the adjudicating evaluator supplied neither reader-1 nor reader-2 score"
          - "the adjudicator's weighted_score_pct < Competency.effective_mastery_threshold_pct or a critical dimension failed under WEIGHTED_PLUS_ALL_CRITICAL"
        side_effects:
          - "creates the reader-3 EvaluatorScore, sets final_score_pct = the adjudicator's score alone, score_variant = ADJUDICATED, cooloff_until_utc = logical_now + Program.attempt_cooloff_hours * 3600 seconds"
          - "increments AssessmentAttempt.version by 1"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /assessment-attempts/{id}/request-revision"
        actor: Evaluator
        preconditions:
          - "AssessmentAttempt.status IN {UNDER_REVIEW, ADJUDICATION}"
          - "no IntegrityCase on this attempt has status IN {OPEN, UNDER_INVESTIGATION}"
        side_effects:
          - "voids every EvaluatorScore on the attempt with status == SUBMITTED, setting voided_reason = REVISION_REQUESTED"
          - "resets scores_received_count = 0, final_score_pct = null, is_provisional_score = false, score_variant = null, critical_fail = false"
          - "increments revision_count by 1"
          - "recomputes paired_review_count / agreeing_review_count / irr_agreement_rate_pct on every affected Evaluator"
          - "increments AssessmentAttempt.version by 1"
      - from: ADJUDICATION
        to: REVISION_REQUESTED
        trigger: "POST /assessment-attempts/{id}/request-revision"
        actor: Evaluator
        preconditions:
          - "AssessmentAttempt.status == ADJUDICATION"
        side_effects:
          - "identical side-effect set to UNDER_REVIEW -> REVISION_REQUESTED"
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /assessment-attempts/{id}/reopen"
        actor: Student
        preconditions:
          - "AssessmentAttempt.status == REVISION_REQUESTED"
          - "the acting Student's X-User-ID equals AssessmentAttempt.student_id"
          - "SubscriptionTerm of term_id has status == ACTIVE"
        side_effects:
          - "clears artifact_hash, client_fingerprint, integrity_attestation_accepted (back to false) and submitted_at_utc"
          - "increments AssessmentAttempt.version by 1"
        note: "Closes the revision cycle: DRAFT -> UNDER_REVIEW -> REVISION_REQUESTED -> DRAFT, with attempt_number unchanged."
      - from: SCORED_MASTERED
        to: VOIDED
        trigger: "POST /integrity-cases/{id}/resolve with outcome SUBSTANTIATED and sanction ATTEMPT_VOID"
        actor: IntegrityOfficer
        preconditions:
          - "AssessmentAttempt.status IN {DRAFT, UNDER_REVIEW, ADJUDICATION, INTEGRITY_HOLD, REVISION_REQUESTED, SCORED_MASTERED, SCORED_NOT_MASTERED}"
        side_effects:
          - "hop 2: voids every EvaluatorScore on the attempt with voided_reason = ATTEMPT_VOIDED and sets integrity_hold = false, held_from_status = null"
          - "hop 3: because the attempt left SCORED_MASTERED, decreases Student.mastered_unit_total by Competency.unit_value and mastered_competency_count by 1, recomputes Student.cumulative_credit_equivalency, recomputes SubscriptionTerm.units_mastered_in_term and credit_equivalency_earned, voids every TranscriptRecord of the student in status IN {DRAFT, ISSUED} with voided_reason UNIT_TOTAL_CHANGED, and recomputes inter-rater reliability on the affected Evaluators"
          - "hop 4: because SubscriptionTerm.credit_equivalency_earned dropped below Program.aid_min_credit_equivalency, every AidDisbursement on that term with status == SCHEDULED goes HELD with hold_reason CREDIT_EQUIVALENCY_SHORTFALL, and every AidDisbursement with status == DISBURSED gets aid_review_required = true"
          - "increments AssessmentAttempt.version by 1"
        note: "Transitive cascade `integrity_void_cascade`. Hop 3 fires only because hop 2 changed the attempt's contribution; hop 4 fires only because hop 3 changed the term's equivalency."
      - from: SCORED_NOT_MASTERED
        to: VOIDED
        trigger: "POST /integrity-cases/{id}/resolve with outcome SUBSTANTIATED and sanction ATTEMPT_VOID"
        actor: IntegrityOfficer
        preconditions:
          - "AssessmentAttempt.status == SCORED_NOT_MASTERED"
        side_effects:
          - "same hop 2 side effects; hops 3 and 4 are no-ops because the attempt contributed no units"
          - "renumbers attempt_number on the student's remaining non-VOIDED attempts for the same competency"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /subscription-terms/{id}/close (any outcome) or POST /integrity-cases/{id}/resolve with sanction ATTEMPT_VOID"
        actor: system
        preconditions:
          - "AssessmentAttempt.status IN {DRAFT, REVISION_REQUESTED}"
        side_effects:
          - "sets status = VOIDED and renumbers attempt_number on the student's remaining non-VOIDED attempts for the same competency"
          - "increments AssessmentAttempt.version by 1"

  - entity: IntegrityCase
    state_field: status
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /integrity-cases/{id}/investigate"
        actor: IntegrityOfficer
        preconditions:
          - "IntegrityCase.status == OPEN"
        side_effects:
          - "increments IntegrityCase.version by 1"
          - "leaves AssessmentAttempt.integrity_hold true"
      - from: UNDER_INVESTIGATION
        to: DISMISSED
        trigger: "POST /integrity-cases/{id}/resolve with outcome DISMISSED"
        actor: IntegrityOfficer
        preconditions:
          - "IntegrityCase.status == UNDER_INVESTIGATION"
        side_effects:
          - "sets sanction = NONE, resolved_at_utc = logical_now, resolved_by_user_id = X-User-ID"
          - "sets AssessmentAttempt.integrity_hold = false, and when the attempt is in INTEGRITY_HOLD restores it to held_from_status"
          - "leaves Student.integrity_strike_count unchanged"
          - "increments IntegrityCase.version by 1"
      - from: UNDER_INVESTIGATION
        to: SUBSTANTIATED
        trigger: "POST /integrity-cases/{id}/resolve with outcome SUBSTANTIATED"
        actor: IntegrityOfficer
        preconditions:
          - "IntegrityCase.status == UNDER_INVESTIGATION"
          - "sanction IN {NONE, ATTEMPT_VOID, TERM_SUSPENSION}"
        side_effects:
          - "hop 1: sets sanction, resolved_at_utc = logical_now, resolved_by_user_id = X-User-ID, and increments Student.integrity_strike_count by 1"
          - "sets AssessmentAttempt.integrity_hold = false and, when the attempt is in INTEGRITY_HOLD and sanction != ATTEMPT_VOID, restores it to held_from_status"
          - "hop 2 (sanction ATTEMPT_VOID only): the AssessmentAttempt goes VOIDED, which runs the `integrity_void_cascade` hops 3 and 4"
          - "sanction TERM_SUSPENSION only: the student's ACTIVE SubscriptionTerm closes CANCELLED (running calculations.term_close_aid_return) and Student.enrollment_status goes ACTIVE -> SUSPENDED"
          - "hop 5 (any sanction): because Student.integrity_strike_count reached 2, Student.enrollment_status ACTIVE -> SUSPENDED fires"
          - "increments IntegrityCase.version by 1"

  - entity: AidDisbursement
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DISBURSED
        trigger: "POST /aid-disbursements/{id}/disburse"
        actor: FinancialAidOfficer
        preconditions:
          - "AidDisbursement.status == SCHEDULED"
          - "SubscriptionTerm.status == ACTIVE"
          - "Student.sap_status IN {GOOD_STANDING, WARNING}"
          - "SubscriptionTerm.credit_equivalency_earned >= Program.aid_min_credit_equivalency"
        side_effects:
          - "sets disbursed_amount_cents = scheduled_amount_cents, outstanding_amount_cents = 0, retained_amount_cents = scheduled_amount_cents, disbursed_at_utc = logical_now, credit_equivalency_at_disbursement = SubscriptionTerm.credit_equivalency_earned"
          - "recomputes Student.aid_retained_total_cents and increments Student.version by 1"
          - "increments AidDisbursement.version by 1"
        note: "Branch point: SCHEDULED fans out to DISBURSED, HELD or CANCELLED with disjoint side-effect sets."
      - from: SCHEDULED
        to: HELD
        trigger: "system: the `integrity_void_cascade` hop 4, or a term close with outcome COMPLETED / LAPSED"
        actor: system
        preconditions:
          - "AidDisbursement.status == SCHEDULED"
        side_effects:
          - "sets hold_reason = CREDIT_EQUIVALENCY_SHORTFALL when SubscriptionTerm.credit_equivalency_earned < Program.aid_min_credit_equivalency, else TERM_CLOSED"
          - "leaves outstanding_amount_cents = scheduled_amount_cents"
          - "increments AidDisbursement.version by 1"
      - from: HELD
        to: DISBURSED
        trigger: "POST /aid-disbursements/{id}/disburse"
        actor: FinancialAidOfficer
        preconditions:
          - "AidDisbursement.status == HELD"
          - "SubscriptionTerm.status == ACTIVE"
          - "Student.sap_status IN {GOOD_STANDING, WARNING}"
          - "SubscriptionTerm.credit_equivalency_earned >= Program.aid_min_credit_equivalency"
        side_effects:
          - "clears hold_reason to null and applies the same side effects as SCHEDULED -> DISBURSED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /aid-disbursements/{id}/cancel, a PENDING term cancellation, or a SAP review that lands on DISMISSED"
        actor: FinancialAidOfficer
        preconditions:
          - "AidDisbursement.status IN {SCHEDULED, HELD}"
        side_effects:
          - "sets cancelled_amount_cents = scheduled_amount_cents, outstanding_amount_cents = 0, hold_reason = null"
          - "increments AidDisbursement.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "POST /aid-disbursements/{id}/cancel"
        actor: FinancialAidOfficer
        preconditions:
          - "AidDisbursement.status == HELD"
        side_effects:
          - "identical side-effect set to SCHEDULED -> CANCELLED"
      - from: DISBURSED
        to: RETURNED
        trigger: "POST /aid-disbursements/{id}/return, or the ACTIVE -> LAPSED / ACTIVE -> CANCELLED term close when earned_pct < 1.0000"
        actor: FinancialAidOfficer
        preconditions:
          - "AidDisbursement.status == DISBURSED"
          - "SubscriptionTerm.status IN {LAPSED, CANCELLED} and SubscriptionTerm.earned_pct < 1.0000"
        side_effects:
          - "runs calculations.term_close_aid_return, writing unearned_aid_cents, school_return_share_cents, student_return_share_cents"
          - "sets returned_amount_cents = school_return_share_cents, retained_amount_cents = disbursed_amount_cents - returned_amount_cents, returned_at_utc = logical_now"
          - "recomputes Student.aid_returned_total_cents and Student.aid_retained_total_cents and increments Student.version by 1"
          - "increments AidDisbursement.version by 1"
        note: "Compensating action for SCHEDULED -> DISBURSED: calculations.aid_cents_conservation must hold identically before and after."

  - entity: TranscriptRecord
    state_field: status
    initial_state: DRAFT
    terminal_states: [ISSUED, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /transcript-records/{id}/issue"
        actor: Registrar
        preconditions:
          - "TranscriptRecord.status == DRAFT"
          - "no IntegrityCase of the subject student has status IN {OPEN, UNDER_INVESTIGATION}"
        side_effects:
          - "sets issued_at_utc = logical_now"
          - "increments TranscriptRecord.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "system: Student.mastered_unit_total changes, or a newer TranscriptRecord is created for the same student"
        actor: system
        preconditions:
          - "TranscriptRecord.status == DRAFT"
        side_effects:
          - "sets voided_reason = UNIT_TOTAL_CHANGED when triggered by a unit-total change, else SUPERSEDED"
          - "increments TranscriptRecord.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "system: Student.mastered_unit_total changes after issuance"
        actor: system
        preconditions:
          - "TranscriptRecord.status == ISSUED"
        side_effects:
          - "sets voided_reason = UNIT_TOTAL_CHANGED"
          - "increments TranscriptRecord.version by 1"

  - entity: Evaluator
    state_field: status
    initial_state: CERTIFIED
    terminal_states: [SUSPENDED]
    transitions:
      - from: CERTIFIED
        to: PROVISIONAL
        trigger: "system: calculations.irr_agreement_rate demotion on completion of a scored pair; or POST /evaluators/{id}/status with status PROVISIONAL"
        actor: system
        preconditions:
          - "Evaluator.status == CERTIFIED"
          - "for the automatic path: paired_review_count >= Program.irr_min_paired_reviews AND irr_agreement_rate_pct < Program.irr_suspend_rate_pct"
        side_effects:
          - "sets demoted_at_utc = logical_now"
          - "increments Evaluator.version by 1"
          - "the evaluator may still take reader_ordinal 1 or 2 but is refused reader_ordinal 3 with ERR_EVALUATOR_NOT_CERTIFIED"
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /evaluators/{id}/status with status CERTIFIED"
        actor: PlatformAdmin
        preconditions:
          - "Evaluator.status == PROVISIONAL"
        side_effects:
          - "leaves demoted_at_utc as the historical record of the last demotion"
          - "increments Evaluator.version by 1"
        note: "Cyclic: an evaluator may be demoted and restored repeatedly; irr_agreement_rate_pct is unaffected by the restoration."
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /evaluators/{id}/status with status SUSPENDED"
        actor: PlatformAdmin
        preconditions:
          - "Evaluator.status == CERTIFIED"
        side_effects:
          - "increments Evaluator.version by 1"
          - "every subsequent POST /assessment-attempts/{id}/scores under this evaluator is refused with ERR_EVALUATOR_NOT_CERTIFIED"
      - from: PROVISIONAL
        to: SUSPENDED
        trigger: "POST /evaluators/{id}/status with status SUSPENDED"
        actor: PlatformAdmin
        preconditions:
          - "Evaluator.status == PROVISIONAL"
        side_effects:
          - "identical side-effect set to CERTIFIED -> SUSPENDED"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# Each entry is a CREATE-with-supersede: the second create is legitimate product
# behavior under the natural semantics, so a stale parent version is the only
# deterministic way to reject a writer working from an outdated view.
# =============================================================================
concurrency_rules:
  - rule_id: blueprint-create-stale-competency
    parent_entity: Competency
    write_endpoint: "POST /assessment-blueprints"
    occ_field: "expected_competency_version"
    description: |
      Publishing a new AssessmentBlueprint against a Competency whose version has
      advanced since the client last read it is rejected. A blueprint create
      legitimately supersedes the competency's current PUBLISHED blueprint (closing
      its effective window), so a writer holding a stale competency view would
      silently retire a window it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: mentor-assignment-create-stale-student
    parent_entity: Student
    write_endpoint: "POST /mentor-assignments"
    occ_field: "expected_student_version"
    description: |
      Creating a MentorAssignment for a Student whose version has advanced since
      the client last read it is rejected. A new assignment legitimately supersedes
      the student's current ACTIVE assignment (ending it and freeing that mentor's
      caseload slot), so a writer holding a stale student view would reassign a
      mentee whose caseload situation it never observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: aid-disbursement-create-stale-term
    parent_entity: SubscriptionTerm
    write_endpoint: "POST /aid-disbursements"
    occ_field: "expected_term_version"
    description: |
      Scheduling an AidDisbursement against a SubscriptionTerm whose version has
      advanced since the client last read it is rejected. A new disbursement
      legitimately supersedes any SCHEDULED award on the same term (cancelling it),
      and the term's credit_equivalency_earned moves on every mastery, so a stale
      term view means the aid officer is scheduling against an equivalency figure
      that no longer holds.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# All monetary amounts are integer cents. All percentages are decimals with an
# explicit scale. round_half_up(x, n) = round x to n decimal places, ties away
# from zero. Every formula below states its evaluation order explicitly and,
# where a plausible alternative ordering exists, names the rejected alternative.
# =============================================================================
calculations:
  - rule_id: effective_blueprint_resolution
    name: "Effective assessment blueprint at an instant"
    algorithm_type: interval_merge
    trigger: "read of Competency.effective_blueprint_id; POST /assessment-attempts; POST /assessment-blueprints"
    inputs:
      - "AssessmentBlueprint rows for the competency, each with effective_from_utc and effective_to_utc (nullable)"
      - "the resolution instant t (logical_now for an attempt, the requested effective_from_utc for a create)"
    formula: |
      The blueprint windows for one competency form a contiguous half-open tiling:
        window_i = [effective_from_utc_i, effective_to_utc_i)
      where effective_to_utc is null for the single PUBLISHED (open-ended) window.

      effective_blueprint(t) = the unique blueprint b such that
        b.effective_from_utc <= t AND (b.effective_to_utc IS NULL OR t < b.effective_to_utc)

      Half-open is load-bearing: at t exactly equal to a boundary the NEW window
      owns the instant, never the superseded one. If no window contains t
      (t precedes the first blueprint's effective_from_utc) the resolution yields
      null and the caller raises ERR_NO_EFFECTIVE_BLUEPRINT.

      Contiguity maintenance on POST /assessment-blueprints with
      requested_from = effective_from_utc:
        1. Let cur = the blueprint with status PUBLISHED and effective_to_utc IS NULL.
        2. If cur IS NULL this is the first blueprint: accept any requested_from
           (no notice period applies) and store effective_to_utc = null.
        3. Else require requested_from > cur.effective_from_utc strictly;
           equality or an earlier instant raises ERR_BLUEPRINT_WINDOW_NOT_CONTIGUOUS.
        4. Else require requested_from >= logical_now +
           Program.blueprint_notice_days * 86400 seconds;
           a shorter notice raises ERR_BLUEPRINT_NOTICE_TOO_SHORT.
        5. Set cur.effective_to_utc = requested_from and cur.status = SUPERSEDED,
           then insert the new blueprint PUBLISHED with effective_to_utc = null.
      Step 3 is checked before step 4 so an out-of-order window is reported as a
      contiguity failure rather than as a notice failure.
    constants:
      - "Program.blueprint_notice_days (default 14)"
    output_fields:
      - "Competency.effective_blueprint_id"
      - "AssessmentBlueprint.effective_to_utc"
      - "AssessmentBlueprint.status"
      - "AssessmentAttempt.blueprint_id"

  - rule_id: rubric_weighted_score
    name: "Evaluator rubric weighted score"
    algorithm_type: weighted_scoring
    trigger: "POST /assessment-attempts/{id}/scores"
    inputs:
      - "AssessmentBlueprint.dimensions: ordered list of { code, weight, max_score, critical }"
      - "the submitted dimension_scores: map of dimension code -> raw score"
      - "Program.critical_dimension_min_ratio"
    formula: |
      Precondition: the submitted dimension_scores key set must equal the
      blueprint's dimension code set exactly (no missing, no extra) or
      ERR_RUBRIC_DIMENSION_MISMATCH is raised; each raw score must satisfy
      0 <= score_i <= max_score_i or ERR_INVALID_REQUEST is raised.

      Evaluation order (pinned):
        1. ratio_i = score_i / max_score_i, kept at full precision (NOT rounded).
        2. raw = SUM over i of (ratio_i * weight_i), accumulated at full
           precision in the blueprint's declared dimension order.
        3. weighted_score_pct = round_half_up(raw * 100, 2)

      SUM-THEN-ROUND is normative. The rejected alternative is
      round-then-sum, i.e. SUM(round_half_up(ratio_i * weight_i * 100, 2)),
      which drifts by up to 0.01 per dimension and is NOT the rule here.

      critical_fail = there exists a dimension i with critical == true and
        ratio_i < Program.critical_dimension_min_ratio
      (strict less-than: a ratio exactly equal to the floor is a pass).

      critical_fail is computed from the raw per-dimension ratios, never from
      weighted_score_pct, so a high weighted total does not mask a critical miss.
    constants:
      - "Program.critical_dimension_min_ratio (default 0.70)"
      - "rounding: round_half_up to 2 decimal places, applied once at step 3"
    output_fields:
      - "EvaluatorScore.weighted_score_pct"
      - "EvaluatorScore.critical_fail"

  - rule_id: attempt_final_score
    name: "Attempt final score and mastery outcome (dual variant)"
    algorithm_type: threshold
    trigger: "POST /assessment-attempts/{id}/scores"
    variants:
      - variant_id: SINGLE_READER_FINAL
        applies_when: "AssessmentBlueprint.required_evaluator_count == 1"
        formula: "final_score_pct = the sole EvaluatorScore.weighted_score_pct; is_provisional_score = false"
      - variant_id: PROVISIONAL_SINGLE_READER
        applies_when: "AssessmentBlueprint.required_evaluator_count == 2 AND exactly one SUBMITTED EvaluatorScore exists"
        formula: "final_score_pct = reader 1's weighted_score_pct; is_provisional_score = true; NO unit award and NO mastery outcome is recorded"
      - variant_id: TWO_READER_MEAN
        applies_when: "required_evaluator_count == 2 AND both readers SUBMITTED AND abs(s1 - s2) <= Program.irr_tolerance_pct"
        formula: "final_score_pct = round_half_up((s1 + s2) / 2, 2); is_provisional_score = false"
      - variant_id: ADJUDICATED
        applies_when: "required_evaluator_count == 2 AND both readers SUBMITTED AND abs(s1 - s2) > Program.irr_tolerance_pct, after an adjudicator score is SUBMITTED"
        formula: "final_score_pct = the adjudicator's weighted_score_pct ALONE; is_provisional_score = false"
    inputs:
      - "EvaluatorScore.weighted_score_pct for reader_ordinal 1, 2 and 3 (adjudicator)"
      - "AssessmentBlueprint.required_evaluator_count"
      - "Competency.effective_mastery_threshold_pct, Program.irr_tolerance_pct, AssessmentBlueprint.passing_rule"
    formula: |
      Variant selection is by (required_evaluator_count, count of SUBMITTED
      scores, reader disagreement) in that order:

        required_evaluator_count == 1
          -> SINGLE_READER_FINAL on the first score.
        required_evaluator_count == 2, one score present
          -> PROVISIONAL_SINGLE_READER. The attempt STAYS in UNDER_REVIEW,
             final_score_pct is written but is_provisional_score = true, and no
             mastery outcome, unit award or cascade fires.
        required_evaluator_count == 2, two scores present, agreement
          (abs(s1 - s2) <= irr_tolerance_pct, boundary inclusive)
          -> TWO_READER_MEAN.
        required_evaluator_count == 2, two scores present, disagreement
          (abs(s1 - s2) > irr_tolerance_pct)
          -> the attempt goes UNDER_REVIEW -> ADJUDICATION, final_score_pct is
             cleared to null and is_provisional_score = false; a third score with
             reader_ordinal 3 from a CERTIFIED evaluator then selects ADJUDICATED.

      ADJUDICATED uses the adjudicator's score ALONE. The rejected alternative is
      the mean of all three scores, i.e. round_half_up((s1 + s2 + s3) / 3, 2),
      which is NOT the rule here and can land on the other side of the threshold.

      Reconciliation on the provisional -> final switch: the final variant
      OVERWRITES final_score_pct, clears is_provisional_score to false and
      rewrites score_variant; only the final variant may award units, so the
      unit award observed after the second score reflects the final figure and
      never the provisional one.

      Mastery outcome, once is_provisional_score == false:
        mastered = final_score_pct >= Competency.effective_mastery_threshold_pct
                   (boundary inclusive: exactly at threshold is MASTERED)
        and, when AssessmentBlueprint.passing_rule == WEIGHTED_PLUS_ALL_CRITICAL,
        additionally no counted EvaluatorScore has critical_fail == true.
        Under passing_rule == WEIGHTED_ONLY the critical flags are ignored.
        The counted scores are: the sole score (SINGLE_READER_FINAL), both
        reader scores (TWO_READER_MEAN), or the adjudicator's score only
        (ADJUDICATED).
    constants:
      - "Program.mastery_threshold_pct (default 80.00), overridable per competency via Competency.mastery_threshold_pct"
      - "Program.irr_tolerance_pct (default 5.00)"
      - "AssessmentBlueprint.passing_rule (WEIGHTED_ONLY | WEIGHTED_PLUS_ALL_CRITICAL)"
    output_fields:
      - "AssessmentAttempt.final_score_pct"
      - "AssessmentAttempt.is_provisional_score"
      - "AssessmentAttempt.score_variant"
      - "AssessmentAttempt.critical_fail"
      - "AssessmentAttempt.status"

  - rule_id: credit_hour_equivalency
    name: "Credit-hour equivalency of mastered competency units (dual variant)"
    algorithm_type: aggregation
    trigger: "mastery of a competency; POST /aid-disbursements/{id}/disburse; POST /transcript-records"
    variants:
      - variant_id: AID_TERM_FLOOR
        applies_when: "computing SubscriptionTerm.credit_equivalency_earned for federal aid eligibility"
        formula: "credit_equivalency_earned = floor(units_mastered_in_term / Program.units_per_credit_hour), evaluated PER TERM and never across terms"
      - variant_id: TRANSCRIPT_CUMULATIVE_ROUND
        applies_when: "computing TranscriptRecord.translated_credit_hours for transfer"
        formula: "translated_credit_hours = round_half_up(Student.mastered_unit_total / Program.units_per_credit_hour, 1), evaluated CUMULATIVELY over the student's whole record"
    inputs:
      - "the unit_value of each mastered Competency"
      - "AssessmentAttempt.term_id and mastered_at_utc for each mastered attempt"
      - "Program.units_per_credit_hour"
    formula: |
      units_mastered_in_term(T) = SUM of Competency.unit_value over AssessmentAttempts
        with term_id == T.id AND status == SCORED_MASTERED AND is_provisional == false
      Student.mastered_unit_total = SUM of Competency.unit_value over ALL such
        attempts for the student, regardless of term.

      The two variants diverge by design and MUST both be reported:
        - AID_TERM_FLOOR truncates (floor) and partitions by term, because aid is
          certified per payment period; partial credits inside a term are lost and
          are NOT carried into the next term.
        - TRANSCRIPT_CUMULATIVE_ROUND rounds half-up to 1 decimal place over the
          lifetime total, because a transcript reports total earned credit.
      Consequently SUM over terms of credit_equivalency_earned is generally
      STRICTLY LESS THAN Student.cumulative_credit_equivalency, which uses the
      TRANSCRIPT_CUMULATIVE_ROUND variant; the two figures are reported side by
      side and are NOT reconciled to each other. Summing the per-term floors to
      produce the transcript figure is the rejected alternative.
    constants:
      - "Program.units_per_credit_hour (default 3.0)"
      - "AID_TERM_FLOOR: floor (truncate toward zero); TRANSCRIPT_CUMULATIVE_ROUND: round_half_up to 1 dp"
    output_fields:
      - "SubscriptionTerm.credit_equivalency_earned"
      - "SubscriptionTerm.units_mastered_in_term"
      - "Student.mastered_unit_total"
      - "Student.cumulative_credit_equivalency"
      - "TranscriptRecord.translated_credit_hours"

  - rule_id: term_close_aid_return
    name: "Term close: earned percentage, institutional refund and aid return split"
    algorithm_type: tiered_pricing
    trigger: "POST /subscription-terms/{id}/close; POST /aid-disbursements/{id}/return"
    inputs:
      - "SubscriptionTerm.term_start_utc, term_end_utc, tuition_cents"
      - "the close request's effective_utc (stored as closed_effective_utc)"
      - "AidDisbursement.disbursed_amount_cents for the term's DISBURSED award"
      - "Program.aid_earned_pct_full_threshold"
    formula: |
      Evaluation order is pinned; every step consumes only the outputs of the
      steps above it.

        1. attended_days = max(0, floor((closed_effective_utc - term_start_utc) / 86400))
        2. term_days     = floor((term_end_utc - term_start_utc) / 86400)
        3. earned_pct    = min(1.0000, round_half_up(attended_days / term_days, 4))
        4. if earned_pct >= Program.aid_earned_pct_full_threshold:
               earned_pct = 1.0000
           (the threshold comparison uses the step-3 value; at or above the
           threshold the term is fully earned and steps 5-8 all yield zero)
        5. institutional_refund_cents =
               round_half_up(tuition_cents * (1 - earned_pct), 0)
           computed from GROSS tuition_cents.
        6. unearned_aid_cents =
               round_half_up(disbursed_amount_cents * (1 - earned_pct), 0)
        7. net_institutional_charge_cents = tuition_cents - institutional_refund_cents
        8. school_return_share_cents = min(
               unearned_aid_cents,
               round_half_up(net_institutional_charge_cents * (1 - earned_pct), 0))
           student_return_share_cents = unearned_aid_cents - school_return_share_cents

      Step 5 is computed from GROSS tuition_cents. The rejected alternative is
      computing step 5 from net_institutional_charge_cents (a circular definition)
      or applying step 8's unearned factor to gross tuition; neither is the rule.
      Step 8's min() guarantees the two shares are non-negative and sum EXACTLY to
      unearned_aid_cents with no rounding residue.

      A term_days value of 0 is impossible because term_end_utc > term_start_utc is
      validated at create; closed_effective_utc before term_start_utc clamps
      attended_days to 0 via step 1's max().
    constants:
      - "Program.aid_earned_pct_full_threshold (default 0.6000)"
      - "seconds per day: 86400"
      - "earned_pct: round_half_up to 4 dp; all cent amounts: round_half_up to 0 dp"
    output_fields:
      - "SubscriptionTerm.attended_days"
      - "SubscriptionTerm.term_days"
      - "SubscriptionTerm.earned_pct"
      - "SubscriptionTerm.institutional_refund_cents"
      - "SubscriptionTerm.net_institutional_charge_cents"
      - "AidDisbursement.unearned_aid_cents"
      - "AidDisbursement.school_return_share_cents"
      - "AidDisbursement.student_return_share_cents"
      - "AidDisbursement.returned_amount_cents"
      - "AidDisbursement.retained_amount_cents"

  - rule_id: sap_pace_and_outcome
    name: "Satisfactory academic progress: competency pace and status escalation"
    algorithm_type: threshold
    trigger: "POST /sap-reviews"
    inputs:
      - "Student.mastered_unit_total"
      - "the student's SubscriptionTerms with status IN {ACTIVE, COMPLETED, LAPSED}"
      - "the reviewed term's term_start_utc"
      - "Student.sap_status (the PRIOR status — the outcome depends on it)"
      - "Program.sap_min_units_per_term and the SAP band thresholds"
    formula: |
        1. terms_counted = COUNT of the student's SubscriptionTerms whose
           status IN {ACTIVE, COMPLETED, LAPSED} AND
           term_start_utc <= the reviewed term's term_start_utc.
           PENDING and CANCELLED terms are excluded from the denominator.
        2. expected_units = Program.sap_min_units_per_term * terms_counted
        3. pace_pct = 100.00 when expected_units == 0,
           else round_half_up(Student.mastered_unit_total / expected_units * 100, 2)
        4. pace_band =
             GOOD when pace_pct >= 100.00
             WARN when 75.00 <= pace_pct <  100.00
             PROB when 50.00 <= pace_pct <   75.00
             FAIL when pace_pct < 50.00
           (each lower bound is inclusive, each upper bound exclusive)
        5. new_sap_status is a function of BOTH pace_band and the prior
           Student.sap_status — the same band produces different outcomes:
             pace_band GOOD -> GOOD_STANDING from any prior status except DISMISSED
             pace_band WARN -> WARNING    when prior == GOOD_STANDING
                            -> PROBATION  when prior == WARNING
                            -> DISMISSED  when prior == PROBATION
             pace_band PROB -> PROBATION  when prior IN {GOOD_STANDING, WARNING}
                            -> DISMISSED  when prior == PROBATION
             pace_band FAIL -> DISMISSED  from any prior status
        6. DISMISSED is terminal: a review of an already-DISMISSED student raises
           ERR_SAP_ALREADY_DISMISSED and no SapReview row is written.

        A review that lands on DISMISSED additionally cancels the student's
        SCHEDULED and HELD AidDisbursements and blocks any further disbursement.
        Step 5 depends on the prior status, so replaying the same pace figure twice
        escalates rather than repeating.
    constants:
      - "Program.sap_min_units_per_term (default 12)"
      - "SAP bands: GOOD >= 100.00, WARN >= 75.00, PROB >= 50.00, FAIL < 50.00"
      - "pace_pct: round_half_up to 2 dp"
    output_fields:
      - "SapReview.pace_pct"
      - "SapReview.pace_band"
      - "SapReview.expected_units"
      - "SapReview.terms_counted"
      - "SapReview.previous_sap_status"
      - "SapReview.new_sap_status"
      - "Student.sap_status"

  - rule_id: mentor_cadence_compliance
    name: "Mentor contact cadence compliance and overdue gating"
    algorithm_type: decay_function
    trigger: "read of MentorAssignment; POST /mentor-assignments/{id}/contacts; POST /assessment-attempts"
    inputs:
      - "MentorAssignment.assigned_at_utc, last_contact_utc (nullable), cadence_days"
      - "the logical clock value logical_now"
      - "Program.cadence_gate_overdue_days"
    formula: |
      next_contact_due_utc = coalesce(last_contact_utc, assigned_at_utc)
                             + cadence_days * 86400 seconds

      cadence_status =
        COMPLIANT when logical_now <= next_contact_due_utc
        OVERDUE   when logical_now >  next_contact_due_utc
      The boundary is inclusive: an instant exactly equal to
      next_contact_due_utc is COMPLIANT.

      overdue_days = 0 when cadence_status == COMPLIANT,
                     else floor((logical_now - next_contact_due_utc) / 86400)

      Recording a contact resets the curve: last_contact_utc = logical_now,
      next_contact_due_utc is recomputed from the new anchor, cadence_status
      returns to COMPLIANT and overdue_days returns to 0. contact_count
      increments by 1.

      Gate: POST /assessment-attempts is refused with ERR_MENTOR_CADENCE_OVERDUE
      when the student's ACTIVE MentorAssignment has
      overdue_days >= Program.cadence_gate_overdue_days (inclusive), so
      overdue_days of exactly the gate value is already refused while one day
      less is still allowed.
    constants:
      - "MentorAssignment.cadence_days (the request value when supplied, else the chosen Mentor.cadence_days)"
      - "Program.cadence_gate_overdue_days (default 7)"
      - "seconds per day: 86400; overdue_days uses floor"
    output_fields:
      - "MentorAssignment.next_contact_due_utc"
      - "MentorAssignment.cadence_status"
      - "MentorAssignment.overdue_days"
      - "MentorAssignment.last_contact_utc"
      - "MentorAssignment.contact_count"

  - rule_id: irr_agreement_rate
    name: "Evaluator inter-rater reliability agreement rate"
    algorithm_type: aggregation
    trigger: "POST /assessment-attempts/{id}/scores (recomputed for both readers of every completed pair)"
    inputs:
      - "every AssessmentAttempt on which this evaluator holds reader_ordinal 1 or 2"
      - "the paired reader's EvaluatorScore.weighted_score_pct"
      - "Program.irr_tolerance_pct, Program.irr_min_paired_reviews, Program.irr_suspend_rate_pct"
    formula: |
      paired_review_count = COUNT of attempts where this evaluator submitted a
        score with reader_ordinal IN {1, 2} AND the OTHER reader ordinal on the
        same attempt also has a SUBMITTED score. Attempts still waiting for the
        second reader, VOIDED attempts and adjudicator scores (reader_ordinal 3)
        are all excluded from both numerator and denominator.

      agreeing_review_count = COUNT of those paired attempts where
        abs(s1 - s2) <= Program.irr_tolerance_pct  (boundary inclusive)

      irr_agreement_rate_pct = 100.00 when paired_review_count == 0,
        else round_half_up(agreeing_review_count / paired_review_count * 100, 2)

      Demotion (both readers of the pair are re-evaluated on every pair
      completion): an Evaluator whose status is CERTIFIED is demoted to
      PROVISIONAL when
        paired_review_count >= Program.irr_min_paired_reviews  AND
        irr_agreement_rate_pct < Program.irr_suspend_rate_pct
      Both conditions are required, so a 0.00 rate over 2 pairs does NOT demote.
      Demotion sets status = PROVISIONAL and demoted_at_utc = logical_now and
      increments Evaluator.version by 1.
      A PROVISIONAL evaluator may not take reader_ordinal 3 (adjudication).
      An attempt VOID removes its pair from the denominator and the rate is
      recomputed; the recomputed rate is reported immediately, but a demotion is
      never automatically undone — only POST /evaluators/{id}/status restores
      CERTIFIED.
    constants:
      - "Program.irr_tolerance_pct (default 5.00)"
      - "Program.irr_min_paired_reviews (default 3)"
      - "Program.irr_suspend_rate_pct (default 70.00)"
      - "irr_agreement_rate_pct: round_half_up to 2 dp"
    output_fields:
      - "Evaluator.paired_review_count"
      - "Evaluator.agreeing_review_count"
      - "Evaluator.irr_agreement_rate_pct"
      - "Evaluator.status"
      - "Evaluator.demoted_at_utc"

  - rule_id: mentor_caseload_selector
    name: "Automatic mentor selection for a new assignment"
    algorithm_type: constraint_propagation
    trigger: "POST /mentor-assignments with mentor_id omitted"
    inputs:
      - "all Mentor rows with their status, current_caseload, max_caseload, cadence_days, created_at"
    formula: |
      Eligibility filter (both conditions required):
        Mentor.status == ACTIVE
        Mentor.current_caseload < Mentor.max_caseload   (strict)

      Ranking of the eligible pool, applied in order until a single mentor
      remains:
        1. current_caseload ASC   (least loaded first)
        2. max_caseload DESC      (prefer the mentor with the most headroom)
        3. cadence_days ASC       (prefer the most attentive cadence)
        4. created_at ASC         (deterministic final tie-break)

      The first mentor after ranking is assigned. An empty eligible pool raises
      ERR_NO_ELIGIBLE_MENTOR (422). When mentor_id IS supplied the selector does
      not run and a full mentor instead raises ERR_MENTOR_CASELOAD_FULL (409) —
      the two paths deliberately report different errors for the same underlying
      capacity condition.

      On assignment the chosen mentor's current_caseload increments by 1 and
      Mentor.version increments by 1; the superseded ACTIVE assignment's mentor
      has current_caseload decremented by 1 (never below 0).
    constants:
      - "Mentor.max_caseload (default 25)"
    output_fields:
      - "MentorAssignment.mentor_id"
      - "MentorAssignment.selection_mode"
      - "Mentor.current_caseload"

  - rule_id: transcript_translation
    name: "Transcript translation of competencies to credit hours"
    algorithm_type: chronological
    trigger: "POST /transcript-records"
    inputs:
      - "every AssessmentAttempt of the student with status SCORED_MASTERED and is_provisional false"
      - "the mastered Competency's code, title, unit_value, level"
      - "AssessmentAttempt.mastered_at_utc and created_at"
      - "Program.units_per_credit_hour"
    formula: |
      Line ordering (chronological, deterministic):
        mastered_at_utc ASC, then created_at ASC as the tie-break. Attempts are
        ordered by MASTERY instant, not by creation instant, so a competency
        attempted earlier but mastered later appears later in the transcript.

      Per line:
        line_credit_hours[i] = round_half_up(unit_value_i / Program.units_per_credit_hour, 2)

      Totals:
        total_mastered_units    = SUM of unit_value_i (exact integers)
        translated_credit_hours = round_half_up(total_mastered_units / Program.units_per_credit_hour, 1)
        line_credit_hour_sum    = SUM of line_credit_hours[i]
        rounding_residual_credit_hours =
              round_half_up(line_credit_hour_sum - translated_credit_hours, 2)

      translated_credit_hours is computed from the SUM OF UNITS, never from the
      sum of the per-line rounded figures; summing the lines is the rejected
      alternative, and the discrepancy it would introduce is exactly what
      rounding_residual_credit_hours reports.

      A transcript with zero mastered competencies is legal: lines is the empty
      list, all totals are 0 / 0.0 / 0.00.
    constants:
      - "Program.units_per_credit_hour (default 3.0)"
      - "line_credit_hours: round_half_up to 2 dp; translated_credit_hours: round_half_up to 1 dp"
    output_fields:
      - "TranscriptRecord.lines"
      - "TranscriptRecord.total_mastered_units"
      - "TranscriptRecord.translated_credit_hours"
      - "TranscriptRecord.line_credit_hour_sum"
      - "TranscriptRecord.rounding_residual_credit_hours"

  - rule_id: attempt_eligibility_ladder
    name: "Unlimited-attempt eligibility: cool-off and endorsement ladder"
    algorithm_type: forward_looking
    trigger: "POST /assessment-attempts"
    inputs:
      - "the student's prior AssessmentAttempts for the same competency"
      - "the most recent attempt's scored_at_utc and status"
      - "MentorAssignment endorsement records for the competency"
      - "Program.attempt_cooloff_hours, Program.attempts_before_endorsement"
    formula: |
      Attempts inside a subscription term are unlimited in COUNT, but each new
      attempt for a competency must clear the ladder below, evaluated in order:

        1. The competency must not already be mastered by this student
           (ERR_COMPETENCY_ALREADY_MASTERED).
        2. Every prerequisite competency, transitively, must be mastered
           (ERR_PREREQUISITE_NOT_MASTERED). The prerequisite chain is walked to
           its root; a single unmastered ancestor anywhere in the chain refuses
           the attempt.
        3. Cool-off: let last = the student's most recent non-VOIDED attempt for
           this competency with status SCORED_NOT_MASTERED. If last exists, then
             earliest_next_utc = last.scored_at_utc
                                 + Program.attempt_cooloff_hours * 3600
           (this value is published as last.cooloff_until_utc)
           and logical_now >= earliest_next_utc is required (boundary inclusive);
           otherwise ERR_ATTEMPT_COOLOFF_ACTIVE.
        4. Endorsement: let failed_count = COUNT of the student's non-VOIDED
           attempts for this competency with status SCORED_NOT_MASTERED. When
             failed_count >= Program.attempts_before_endorsement
           an unconsumed mentor endorsement for this (student, competency) pair
           is required; without one, ERR_MENTOR_ENDORSEMENT_REQUIRED. Creating
           the attempt consumes exactly one endorsement, so the ladder re-arms
           for the following attempt.
        5. Cadence gate (calculations.mentor_cadence_compliance) and the
           integrity-hold gate are applied after steps 1-4.

      VOIDED attempts are invisible to steps 3 and 4: voiding a failure both
      lifts a live cool-off and lowers failed_count, which can un-require an
      endorsement that was previously demanded.
    constants:
      - "Program.attempt_cooloff_hours (default 48)"
      - "Program.attempts_before_endorsement (default 3)"
      - "seconds per hour: 3600"
    output_fields:
      - "AssessmentAttempt.attempt_number"
      - "AssessmentAttempt.cooloff_until_utc"
      - "AssessmentAttempt.endorsement_consumed"
      - "MentorAssignment.endorsement_count"

  - rule_id: aid_cents_conservation
    name: "Aid ledger conservation invariant (compensating)"
    algorithm_type: aggregation
    trigger: "every AidDisbursement write; read of GET /students/{id}/progress-summary"
    inputs:
      - "AidDisbursement.scheduled_amount_cents, outstanding_amount_cents, disbursed_amount_cents, retained_amount_cents, returned_amount_cents, cancelled_amount_cents"
    formula: |
      For each AidDisbursement the following identity holds after EVERY
      transition, including the compensating DISBURSED -> RETURNED:

        scheduled_amount_cents == outstanding_amount_cents
                                + retained_amount_cents
                                + returned_amount_cents
                                + cancelled_amount_cents

      Per state:
        SCHEDULED / HELD : outstanding = scheduled; retained = returned = cancelled = 0
        DISBURSED        : outstanding = 0; retained = scheduled; returned = cancelled = 0
        RETURNED         : outstanding = 0; retained = scheduled - school_return_share_cents;
                           returned = school_return_share_cents; cancelled = 0
        CANCELLED        : outstanding = retained = returned = 0; cancelled = scheduled

      Student-level roll-up, recomputed from the rows and never incrementally
      patched:
        Student.aid_retained_total_cents = SUM of retained_amount_cents
        Student.aid_returned_total_cents = SUM of returned_amount_cents
      The return path must leave the identity EXACTLY balanced with no drift:
      student_return_share_cents is the student's own liability and is reported
      but is NOT part of the institution's ledger identity above.
    constants:
      - "all amounts are integer cents; the identity is exact, not approximate"
    output_fields:
      - "AidDisbursement.outstanding_amount_cents"
      - "AidDisbursement.retained_amount_cents"
      - "AidDisbursement.cancelled_amount_cents"
      - "Student.aid_retained_total_cents"
      - "Student.aid_returned_total_cents"

  - rule_id: unit_conservation
    name: "Mastered-unit conservation invariant (compensating)"
    algorithm_type: aggregation
    trigger: "mastery of a competency; attempt VOID; read of GET /students/{id}/progress-summary"
    inputs:
      - "the student's AssessmentAttempts with status SCORED_MASTERED and is_provisional false"
      - "the mastered Competency.unit_value"
    formula: |
      Student.mastered_unit_total and Student.mastered_competency_count are
      always equal to a full recomputation over the student's currently
      SCORED_MASTERED, non-provisional attempts:

        mastered_unit_total       = SUM of Competency.unit_value
        mastered_competency_count = COUNT of DISTINCT competency_id

      Voiding a mastered attempt is the compensating action for the mastery
      award and must restore BOTH figures to their pre-mastery values exactly:
        mastery:  total 0 -> unit_value
        void:     total unit_value -> 0
      No residue may remain in mastered_unit_total, in the owning term's
      units_mastered_in_term / credit_equivalency_earned, or in any
      TranscriptRecord (which is VOIDED rather than edited).

      Because a competency can be mastered only once per student
      (ERR_COMPETENCY_ALREADY_MASTERED), mastered_competency_count can never
      exceed the program's competency_count, and graduation fires exactly when
        mastered_unit_total >= Program.required_unit_total
      (boundary inclusive). Student.cumulative_credit_equivalency is recomputed
      from mastered_unit_total on every change, in both directions.
    constants:
      - "Program.required_unit_total (default 120)"
      - "Program.units_per_credit_hour (default 3.0)"
    output_fields:
      - "Student.mastered_unit_total"
      - "Student.mastered_competency_count"
      - "Student.cumulative_credit_equivalency"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest priority number wins
# when a single request violates several rules)
# Domain ordering of the business band: academic-integrity and compliance checks
# precede referential/graph checks, which precede temporal checks, which precede
# capacity checks, which precede fiscal checks.
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty; a blank or whitespace-only value counts as absent"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the seven declared roles AND that role appears in the target endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Resource ownership for entity-backed roles: a caller with role Student may only touch resources whose subject student id equals X-User-ID; a caller with role FacultyMentor may only act on MentorAssignment rows whose mentor_id equals X-User-ID; a caller with role Evaluator may only submit a score whose evaluator_id equals X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /students/{id}, GET /students/{id}/progress-summary, GET /assessment-attempts/{id}, POST /assessment-attempts, POST /assessment-attempts/{id}/submit, POST /assessment-attempts/{id}/scores, POST /mentor-assignments/{id}/contacts, POST /mentor-assignments/{id}/endorsements, GET /transcript-records/{id}"

  - priority: 4
    category: existence
    check: "Every {id} path segment resolves to an existing row, validated left-to-right, and yields that entity's own 404 error_id"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter (the error_id is the target entity's: ERR_PROGRAM_NOT_FOUND, ERR_COMPETENCY_NOT_FOUND, ERR_BLUEPRINT_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_TERM_NOT_FOUND, ERR_MENTOR_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_EVALUATOR_NOT_FOUND, ERR_ATTEMPT_NOT_FOUND, ERR_SCORE_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_SAP_REVIEW_NOT_FOUND, ERR_DISBURSEMENT_NOT_FOUND, ERR_TRANSCRIPT_NOT_FOUND)"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in a request body resolves to an existing row, validated in the order the fields are declared in the endpoint's input list, and yields the referenced entity's own 404 error_id"
    error_id: ERR_STUDENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /competencies, POST /assessment-blueprints, POST /students, POST /subscription-terms, POST /mentor-assignments, POST /evaluators, POST /assessment-attempts, POST /assessment-attempts/{id}/scores, POST /integrity-cases, POST /sap-reviews, POST /aid-disbursements, POST /transcript-records"

  - priority: 6
    category: business_constraint
    check: "Request body shape: every required field present; enum fields hold a declared value; integers non-negative; percentages within 0.00-100.00; ISO-8601 UTC instants parseable; term_end_utc strictly after term_start_utc; uniqueness of Program.code, Competency.code within a program, Student.email and Evaluator.email"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 7
    category: state
    check: "The referenced Program is PUBLISHED before students may enrol in it, competencies may be published under it, or attempts may be created against it"
    error_id: ERR_PROGRAM_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /students, POST /competencies/{id}/prerequisite, POST /assessment-attempts"

  - priority: 8
    category: state
    check: "The target resource is in the lifecycle status its operation requires: a DRAFT Program to publish; an ACTIVE Competency to retire, to attempt or to publish a blueprint against; an APPLICANT Student to activate; a SUSPENDED Student to reinstate; a non-terminal Student to withdraw or suspend; a PENDING SubscriptionTerm to activate; an ACTIVE MentorAssignment to record a contact, an endorsement or an end on; a non-SUSPENDED Evaluator to re-certify; a non-VOIDED TranscriptRecord to issue"
    error_id: ERR_PROGRAM_ALREADY_PUBLISHED
    http_status: 409
    applies_to: "POST /programs/{id}/publish (ERR_PROGRAM_ALREADY_PUBLISHED), POST /competencies/{id}/retire and POST /assessment-attempts and POST /assessment-blueprints (ERR_COMPETENCY_RETIRED), POST /students/{id}/activate (ERR_STUDENT_NOT_APPLICANT), POST /students/{id}/reinstate (ERR_STUDENT_NOT_SUSPENDED), POST /students/{id}/withdraw and POST /students/{id}/suspend (ERR_STUDENT_ALREADY_CLOSED), POST /subscription-terms/{id}/activate (ERR_TERM_NOT_PENDING), POST /mentor-assignments/{id}/contacts and /endorsements and /end (ERR_ASSIGNMENT_NOT_ACTIVE), POST /evaluators/{id}/status (ERR_EVALUATOR_SUSPENDED), POST /transcript-records/{id}/issue (ERR_TRANSCRIPT_VOIDED)"

  - priority: 9
    category: state
    check: "The subject Student.enrollment_status is ACTIVE"
    error_id: ERR_STUDENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /subscription-terms, POST /mentor-assignments, POST /assessment-attempts, POST /aid-disbursements, POST /aid-disbursements/{id}/disburse"

  - priority: 10
    category: state
    check: "The student has a SubscriptionTerm with status ACTIVE whose half-open window [term_start_utc, term_end_utc) contains logical_now, and that term is the one the attempt is booked against"
    error_id: ERR_TERM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /assessment-attempts, POST /aid-disbursements/{id}/disburse"

  - priority: 11
    category: state
    check: "The AssessmentAttempt is in the status the operation requires: DRAFT for submit, UNDER_REVIEW or ADJUDICATION for scores, UNDER_REVIEW for request-revision, REVISION_REQUESTED for reopen; a VOIDED attempt refuses every write"
    error_id: ERR_ATTEMPT_NOT_DRAFT
    http_status: 409
    applies_to: "POST /assessment-attempts/{id}/submit (ERR_ATTEMPT_NOT_DRAFT), POST /assessment-attempts/{id}/scores (ERR_ATTEMPT_NOT_UNDER_REVIEW), POST /assessment-attempts/{id}/request-revision (ERR_ATTEMPT_NOT_UNDER_REVIEW), POST /assessment-attempts/{id}/reopen (ERR_ATTEMPT_NOT_IN_REVISION), all attempt writes on a voided attempt (ERR_ATTEMPT_VOIDED)"

  - priority: 12
    category: state
    check: "The IntegrityCase is in the status the operation requires: OPEN for investigate, UNDER_INVESTIGATION for resolve; an already-resolved case refuses both"
    error_id: ERR_CASE_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /integrity-cases/{id}/investigate (ERR_CASE_ALREADY_RESOLVED), POST /integrity-cases/{id}/resolve (ERR_CASE_NOT_UNDER_INVESTIGATION on an OPEN case, ERR_CASE_ALREADY_RESOLVED on a resolved case)"

  - priority: 13
    category: state
    check: "The AidDisbursement is in the status the operation requires: SCHEDULED or HELD for disburse and cancel, DISBURSED for return"
    error_id: ERR_DISBURSEMENT_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /aid-disbursements/{id}/disburse (ERR_AID_ALREADY_DISBURSED when already DISBURSED, ERR_DISBURSEMENT_NOT_SCHEDULED when RETURNED or CANCELLED), POST /aid-disbursements/{id}/return (ERR_AID_NOT_DISBURSED), POST /aid-disbursements/{id}/cancel (ERR_DISBURSEMENT_NOT_SCHEDULED)"

  - priority: 14
    category: state
    check: "The TranscriptRecord is in DRAFT; an ISSUED or VOIDED record cannot be issued again"
    error_id: ERR_TRANSCRIPT_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /transcript-records/{id}/issue"

  - priority: 15
    category: state
    check: "The subject Student.sap_status is not already DISMISSED — DISMISSED is terminal and no further SAP review may be recorded"
    error_id: ERR_SAP_ALREADY_DISMISSED
    http_status: 409
    applies_to: "POST /sap-reviews"

  - priority: 16
    category: state
    check: "The supplied expected_<parent>_version equals the parent entity's current version (§1.2.1 optimistic concurrency)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /assessment-blueprints, POST /mentor-assignments, POST /aid-disbursements"

  - priority: 17
    category: business_safety
    check: "integrity_attestation_accepted is exactly true and client_fingerprint is a non-empty string — an unproctored assessment cannot be submitted without the academic-integrity attestation"
    error_id: ERR_ATTESTATION_REQUIRED
    http_status: 422
    applies_to: "POST /assessment-attempts/{id}/submit"

  - priority: 18
    category: business_safety
    check: "Neither the attempt nor the subject student is under an active integrity hold: no IntegrityCase with status IN {OPEN, UNDER_INVESTIGATION} exists for the student, and AssessmentAttempt.integrity_hold is false"
    error_id: ERR_INTEGRITY_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /assessment-attempts, POST /assessment-attempts/{id}/submit, POST /assessment-attempts/{id}/scores, POST /aid-disbursements/{id}/disburse"

  - priority: 19
    category: business_safety
    check: "Segregation of duties: the scoring Evaluator is not linked to the student's own ACTIVE MentorAssignment mentor (Evaluator.mentor_id != that assignment's mentor_id) and no existing non-VOIDED score on the attempt was submitted by an Evaluator sharing that same mentor_id; and the X-User-ID resolving an IntegrityCase differs from that case's opened_by_user_id"
    error_id: ERR_EVALUATOR_CONFLICT_OF_INTEREST
    http_status: 422
    applies_to: "POST /assessment-attempts/{id}/scores (ERR_EVALUATOR_CONFLICT_OF_INTEREST), POST /integrity-cases/{id}/resolve (ERR_CASE_RESOLVER_IS_OPENER)"

  - priority: 20
    category: business_safety
    check: "The same Evaluator has not already submitted a score for this attempt, and the attempt has not already collected its required_evaluator_count reader scores"
    error_id: ERR_DUPLICATE_EVALUATOR_SCORE
    http_status: 409
    applies_to: "POST /assessment-attempts/{id}/scores"

  - priority: 21
    category: business_safety
    check: "The scoring Evaluator has status ACTIVE, and for the adjudication slot (reader_ordinal 3) certification_level is CERTIFIED; a PROVISIONAL or SUSPENDED evaluator cannot adjudicate"
    error_id: ERR_EVALUATOR_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /assessment-attempts/{id}/scores"

  - priority: 22
    category: business_safety
    check: "No IntegrityCase of the subject student has status IN {OPEN, UNDER_INVESTIGATION} — a transcript may not be issued while an integrity matter is unresolved"
    error_id: ERR_TRANSCRIPT_INTEGRITY_PENDING
    http_status: 422
    applies_to: "POST /transcript-records/{id}/issue"

  - priority: 23
    category: business_referential
    check: "The submitted dimension_scores key set equals the effective blueprint's rubric dimension code set exactly — no missing dimension, no unknown dimension"
    error_id: ERR_RUBRIC_DIMENSION_MISMATCH
    http_status: 422
    applies_to: "POST /assessment-attempts/{id}/scores"

  - priority: 24
    category: business_referential
    check: "The blueprint's rubric_dimensions weights sum to exactly 1.00 (2 dp), every weight is greater than 0, every max_score is a positive integer, dimension codes are unique, and at least one dimension exists"
    error_id: ERR_RUBRIC_WEIGHTS_INVALID
    http_status: 422
    applies_to: "POST /assessment-blueprints"

  - priority: 25
    category: business_referential
    check: "A prerequisite competency belongs to the same Program as the dependent competency"
    error_id: ERR_PREREQUISITE_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /competencies, POST /competencies/{id}/prerequisite"

  - priority: 26
    category: business_referential
    check: "Adding the prerequisite edge does not create a cycle in the competency prerequisite graph, including the self-edge case and any longer cycle reachable transitively"
    error_id: ERR_PREREQUISITE_CYCLE
    http_status: 422
    applies_to: "POST /competencies, POST /competencies/{id}/prerequisite"

  - priority: 27
    category: business_referential
    check: "Every competency in the target competency's transitive prerequisite chain is already mastered by this student"
    error_id: ERR_PREREQUISITE_NOT_MASTERED
    http_status: 422
    applies_to: "POST /assessment-attempts"

  - priority: 28
    category: business_referential
    check: "The student has not already mastered this competency (no SCORED_MASTERED non-provisional attempt for the pair)"
    error_id: ERR_COMPETENCY_ALREADY_MASTERED
    http_status: 409
    applies_to: "POST /assessment-attempts"

  - priority: 29
    category: business_referential
    check: "calculations.effective_blueprint_resolution yields a blueprint for the competency at logical_now — a competency with no window covering the instant cannot be attempted"
    error_id: ERR_NO_EFFECTIVE_BLUEPRINT
    http_status: 409
    applies_to: "POST /assessment-attempts"

  - priority: 30
    category: business_temporal
    check: "The attempt cool-off window has elapsed: logical_now >= the last SCORED_NOT_MASTERED attempt's scored_at_utc + Program.attempt_cooloff_hours (boundary inclusive)"
    error_id: ERR_ATTEMPT_COOLOFF_ACTIVE
    http_status: 422
    applies_to: "POST /assessment-attempts"

  - priority: 31
    category: business_temporal
    check: "The requested subscription-term window does not overlap any of the student's existing non-CANCELLED term windows; windows are half-open [term_start_utc, term_end_utc) so exact adjacency is allowed"
    error_id: ERR_TERM_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /subscription-terms"

  - priority: 32
    category: business_temporal
    check: "A superseding blueprint's effective_from_utc is strictly after the current PUBLISHED blueprint's effective_from_utc, so the competency's blueprint windows remain a contiguous half-open tiling with no gap and no overlap"
    error_id: ERR_BLUEPRINT_WINDOW_NOT_CONTIGUOUS
    http_status: 409
    applies_to: "POST /assessment-blueprints"

  - priority: 33
    category: business_temporal
    check: "A superseding blueprint's effective_from_utc is at least Program.blueprint_notice_days ahead of logical_now (boundary inclusive); the first blueprint for a competency is exempt from the notice period"
    error_id: ERR_BLUEPRINT_NOTICE_TOO_SHORT
    http_status: 422
    applies_to: "POST /assessment-blueprints"

  - priority: 34
    category: business_temporal
    check: "The student's ACTIVE MentorAssignment has overdue_days < Program.cadence_gate_overdue_days per calculations.mentor_cadence_compliance"
    error_id: ERR_MENTOR_CADENCE_OVERDUE
    http_status: 422
    applies_to: "POST /assessment-attempts"

  - priority: 35
    category: business_constraint
    check: "An explicitly named mentor has current_caseload < max_caseload and status ACTIVE"
    error_id: ERR_MENTOR_CASELOAD_FULL
    http_status: 409
    applies_to: "POST /mentor-assignments (only when mentor_id is supplied)"

  - priority: 36
    category: business_constraint
    check: "When mentor_id is omitted, calculations.mentor_caseload_selector finds at least one eligible mentor"
    error_id: ERR_NO_ELIGIBLE_MENTOR
    http_status: 422
    applies_to: "POST /mentor-assignments (only when mentor_id is omitted)"

  - priority: 37
    category: business_constraint
    check: "When the student's non-VOIDED failed attempts for this competency have reached Program.attempts_before_endorsement, an unconsumed mentor endorsement exists for the (student, competency) pair"
    error_id: ERR_MENTOR_ENDORSEMENT_REQUIRED
    http_status: 422
    applies_to: "POST /assessment-attempts"

  - priority: 38
    category: business_fiscal
    check: "The subject Student.sap_status is GOOD_STANDING or WARNING — federal aid may not be released to a student on PROBATION or DISMISSED"
    error_id: ERR_AID_SAP_INELIGIBLE
    http_status: 422
    applies_to: "POST /aid-disbursements/{id}/disburse"

  - priority: 39
    category: business_fiscal
    check: "The term's credit_equivalency_earned (AID_TERM_FLOOR variant of calculations.credit_hour_equivalency) is at least Program.aid_min_credit_equivalency"
    error_id: ERR_AID_CREDIT_EQUIVALENCY_SHORTFALL
    http_status: 422
    applies_to: "POST /aid-disbursements/{id}/disburse"

# =============================================================================
# §1.5 API Endpoint Table
# Flat topology: every collection sits at the root. Reads are exhaustive (a
# scalar GET /<collection>/{id} plus a filtered GET /<collection> per entity) so
# every declared field and every foreign key is observable from the API alone.
# All list endpoints accept limit? and offset? and return
# { items: [...], total_count, has_more } inside the standard envelope.
# =============================================================================
endpoints:

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock, which every rule in this scaffold reads as logical_now. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant and MUST NOT fall back to real wall-clock time. Setting the clock backwards is permitted."
    roles: [PlatformAdmin, Registrar, IntegrityOfficer, FinancialAidOfficer]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "all subsequent reads of logical_now return current_utc"
      - "recomputes every clock-derived field: MentorAssignment.cadence_status / overdue_days, Competency.effective_blueprint_id"

  - method: GET
    path: "/_clock"
    description: "Read the logical clock's current value (2026-08-01T00:00:00Z until set)."
    roles: [PlatformAdmin, Registrar, IntegrityOfficer, FinancialAidOfficer, FacultyMentor, Evaluator, Student]
    code: 200
    input: []
    output: { current_utc: string }
    side_effects: []

  - method: POST
    path: "/programs"
    description: "Register a competency-based program with its mastery, SAP, aid and integrity policy constants. Every policy field is optional and falls back to its documented default."
    roles: [Registrar, PlatformAdmin]
    code: 201
    input: [code, title, "mastery_threshold_pct?", "units_per_credit_hour?", "sap_min_units_per_term?", "required_unit_total?", "irr_tolerance_pct?", "irr_min_paired_reviews?", "irr_suspend_rate_pct?", "attempt_cooloff_hours?", "attempts_before_endorsement?", "critical_dimension_min_ratio?", "cadence_gate_overdue_days?", "blueprint_notice_days?", "aid_earned_pct_full_threshold?", "aid_min_credit_equivalency?"]
    output: Program
    side_effects:
      - "creates the Program in status DRAFT with competency_count 0"

  - method: GET
    path: "/programs/{id}"
    description: "Read one program with its policy constants and competency_count."
    roles: [Registrar, PlatformAdmin, FacultyMentor, Evaluator, IntegrityOfficer, FinancialAidOfficer, Student]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: GET
    path: "/programs"
    description: "List programs, newest first by created_at DESC."
    roles: [Registrar, PlatformAdmin, FacultyMentor, Evaluator, IntegrityOfficer, FinancialAidOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Program[]
    side_effects: []

  - method: POST
    path: "/programs/{id}/publish"
    description: "Publish a DRAFT program, opening it for enrollment and attempts."
    roles: [Registrar]
    code: 200
    input: []
    output: Program
    side_effects:
      - "Program.status DRAFT -> PUBLISHED, published_at_utc = logical_now, version incremented"

  - method: POST
    path: "/competencies"
    description: "Add a competency to a program's competency map, optionally with a mastery-threshold override and a prerequisite edge."
    roles: [Registrar]
    code: 201
    input: [program_id, code, title, unit_value, level, "mastery_threshold_pct?", "prerequisite_competency_id?"]
    output: Competency
    side_effects:
      - "creates the Competency in status ACTIVE with effective_blueprint_id null"
      - "computes effective_mastery_threshold_pct and prerequisite_depth"
      - "increments Program.competency_count and Program.version by 1"

  - method: GET
    path: "/competencies/{id}"
    description: "Read one competency, including its effective_blueprint_id resolved against the logical clock and its effective_mastery_threshold_pct."
    roles: [Registrar, PlatformAdmin, FacultyMentor, Evaluator, IntegrityOfficer, Student]
    code: 200
    input: []
    output: Competency
    side_effects: []

  - method: GET
    path: "/competencies"
    description: "List competencies, filterable by owning program, by prerequisite edge, by status and by map level; ordered by code ASC."
    roles: [Registrar, PlatformAdmin, FacultyMentor, Evaluator, IntegrityOfficer, Student]
    code: 200
    input: ["program_id?", "prerequisite_competency_id?", "status?", "level?", "limit?", "offset?"]
    output: Competency[]
    side_effects: []

  - method: POST
    path: "/competencies/{id}/prerequisite"
    description: "Set or clear the competency's prerequisite edge. Passing prerequisite_competency_id null clears it."
    roles: [Registrar]
    code: 200
    input: [prerequisite_competency_id]
    output: Competency
    side_effects:
      - "validates same-program membership and acyclicity of the prerequisite graph"
      - "recomputes prerequisite_depth for this competency and every competency reachable through it"
      - "increments Competency.version by 1"

  - method: POST
    path: "/competencies/{id}/retire"
    description: "Retire a competency so no new attempts may be created against it. Existing attempts and mastery records are untouched."
    roles: [Registrar]
    code: 200
    input: []
    output: Competency
    side_effects:
      - "Competency.status ACTIVE -> RETIRED, version incremented"

  - method: POST
    path: "/assessment-blueprints"
    description: "Publish an assessment blueprint (rubric dimensions, passing rule, reader count) on a competency, superseding the competency's current PUBLISHED blueprint at effective_from_utc. Requires the competency's current version."
    roles: [Registrar]
    code: 201
    input: [competency_id, expected_competency_version, dimensions, passing_rule, required_evaluator_count, effective_from_utc]
    output: AssessmentBlueprint
    side_effects:
      - "validates the rubric weight sum, window contiguity and the notice period (calculations.effective_blueprint_resolution)"
      - "sets the superseded blueprint's effective_to_utc = effective_from_utc and its status to SUPERSEDED"
      - "creates the new blueprint PUBLISHED with version_label BP-<n> and effective_to_utc null"
      - "refreshes Competency.effective_blueprint_id and increments Competency.version by 1"

  - method: GET
    path: "/assessment-blueprints/{id}"
    description: "Read one blueprint with its rubric dimensions and effective window."
    roles: [Registrar, PlatformAdmin, FacultyMentor, Evaluator, IntegrityOfficer, Student]
    code: 200
    input: []
    output: AssessmentBlueprint
    side_effects: []

  - method: GET
    path: "/assessment-blueprints"
    description: "List blueprints, filterable by competency and status; ordered by effective_from_utc ASC, created_at ASC."
    roles: [Registrar, PlatformAdmin, FacultyMentor, Evaluator, IntegrityOfficer, Student]
    code: 200
    input: ["competency_id?", "status?", "limit?", "offset?"]
    output: AssessmentBlueprint[]
    side_effects: []

  - method: POST
    path: "/students"
    description: "Enrol a student against a PUBLISHED program. The student starts as an APPLICANT in SAP status GOOD_STANDING."
    roles: [Registrar]
    code: 201
    input: [program_id, full_name, email]
    output: Student
    side_effects:
      - "creates the Student with enrollment_status APPLICANT, sap_status GOOD_STANDING and all totals zero"

  - method: GET
    path: "/students/{id}"
    description: "Read one student, including both status axes, mastered-unit totals, credit equivalency and aid totals."
    roles: [Registrar, PlatformAdmin, FacultyMentor, IntegrityOfficer, FinancialAidOfficer, Student]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: GET
    path: "/students"
    description: "List students, filterable by program and by either status axis; ordered by created_at ASC."
    roles: [Registrar, PlatformAdmin, FacultyMentor, IntegrityOfficer, FinancialAidOfficer]
    code: 200
    input: ["program_id?", "enrollment_status?", "sap_status?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  - method: POST
    path: "/students/{id}/activate"
    description: "Activate an APPLICANT student against a PUBLISHED program."
    roles: [Registrar]
    code: 200
    input: []
    output: Student
    side_effects:
      - "Student.enrollment_status APPLICANT -> ACTIVE, activated_at_utc = logical_now, version incremented"

  - method: POST
    path: "/students/{id}/reinstate"
    description: "Reinstate a SUSPENDED student once every integrity matter is resolved. The SAP axis is untouched, so a reinstated student can be ACTIVE and on PROBATION at once."
    roles: [Registrar]
    code: 200
    input: []
    output: Student
    side_effects:
      - "Student.enrollment_status SUSPENDED -> ACTIVE, version incremented"
      - "leaves suspended_at_utc and sap_status unchanged"

  - method: POST
    path: "/students/{id}/withdraw"
    description: "Withdraw a student. Terminal for the enrollment axis: the SAP axis freezes at its current value."
    roles: [Registrar]
    code: 200
    input: [effective_utc, reason]
    output: Student
    side_effects:
      - "Student.enrollment_status -> WITHDRAWN, withdrawn_at_utc = effective_utc, version incremented"
      - "closes the student's ACTIVE SubscriptionTerms as CANCELLED with closed_effective_utc = effective_utc, running calculations.term_close_aid_return"
      - "ends the student's ACTIVE MentorAssignments, decrementing each mentor's current_caseload"
      - "cancels SCHEDULED and HELD AidDisbursements"

  - method: POST
    path: "/students/{id}/suspend"
    description: "Suspend an ACTIVE student administratively. Also fired by the integrity cascade at the second substantiated strike."
    roles: [Registrar, IntegrityOfficer]
    code: 200
    input: [reason]
    output: Student
    side_effects:
      - "Student.enrollment_status ACTIVE -> SUSPENDED, suspended_at_utc = logical_now, version incremented"
      - "blocks POST /assessment-attempts and aid disbursement while suspended"

  - method: GET
    path: "/students/{id}/progress-summary"
    description: "Computed read: the student's competency progress, the per-term aid credit equivalency (AID_TERM_FLOOR variant) alongside the cumulative transcript figure (TRANSCRIPT_CUMULATIVE_ROUND variant), the aid ledger identity and the current mentor cadence state. aid_credit_equivalency_sum is the SUM of credit_equivalency_earned over the student's non-CANCELLED SubscriptionTerms and credit_equivalency_variance is cumulative_credit_equivalency MINUS aid_credit_equivalency_sum, rounded half-up to 1 decimal; cadence_status and overdue_days come from calculations.mentor_cadence_compliance and are null / 0 when the student has no ACTIVE MentorAssignment."
    roles: [Registrar, PlatformAdmin, FacultyMentor, FinancialAidOfficer, Student]
    code: 200
    input: []
    output:
      student_id: string
      enrollment_status: string
      sap_status: string
      mastered_unit_total: number
      mastered_competency_count: integer
      required_unit_total: number
      cumulative_credit_equivalency: number
      aid_credit_equivalency_sum: integer
      credit_equivalency_variance: number
      aid_scheduled_total_cents: integer
      aid_retained_total_cents: integer
      aid_returned_total_cents: integer
      active_mentor_assignment_id: string
      cadence_status: string
      overdue_days: integer
      open_integrity_case_count: integer
    side_effects: []

  - method: POST
    path: "/subscription-terms"
    description: "Open a subscription term for a student: a flat-tuition period with unlimited attempts inside it. Windows are half-open, so adjacent terms are allowed but overlaps are not."
    roles: [Registrar]
    code: 201
    input: [student_id, term_start_utc, term_end_utc, tuition_cents]
    output: SubscriptionTerm
    side_effects:
      - "creates the term in status PENDING, computing term_days"
      - "validates non-overlap against the student's other non-CANCELLED terms"

  - method: GET
    path: "/subscription-terms/{id}"
    description: "Read one subscription term, including its close-out figures once closed."
    roles: [Registrar, PlatformAdmin, FinancialAidOfficer, FacultyMentor, Student]
    code: 200
    input: []
    output: SubscriptionTerm
    side_effects: []

  - method: GET
    path: "/subscription-terms"
    description: "List subscription terms, filterable by student and status; ordered by term_start_utc ASC."
    roles: [Registrar, PlatformAdmin, FinancialAidOfficer, FacultyMentor]
    code: 200
    input: ["student_id?", "status?", "limit?", "offset?"]
    output: SubscriptionTerm[]
    side_effects: []

  - method: POST
    path: "/subscription-terms/{id}/activate"
    description: "Activate a PENDING term so attempts may be booked against it."
    roles: [Registrar]
    code: 200
    input: []
    output: SubscriptionTerm
    side_effects:
      - "SubscriptionTerm.status PENDING -> ACTIVE, activated_at_utc = logical_now, version incremented"

  - method: POST
    path: "/subscription-terms/{id}/close"
    description: "Close an ACTIVE term as COMPLETED, LAPSED or CANCELLED at an effective instant, running the earned-percentage and aid-return calculation."
    roles: [Registrar, FinancialAidOfficer]
    code: 200
    input: [outcome, effective_utc]
    output: SubscriptionTerm
    side_effects:
      - "SubscriptionTerm.status ACTIVE -> COMPLETED | LAPSED | CANCELLED, closed_effective_utc = effective_utc, version incremented"
      - "runs calculations.term_close_aid_return, writing attended_days, earned_pct, institutional_refund_cents and net_institutional_charge_cents"
      - "a DISBURSED award on the term goes to RETURNED when earned_pct < 1.0000; a SCHEDULED award goes to HELD (outcome COMPLETED or LAPSED) or CANCELLED (outcome CANCELLED)"
      - "refuses new attempts against the term afterwards"

  - method: POST
    path: "/mentors"
    description: "Register a faculty mentor with a caseload ceiling and a default progress-contact cadence."
    roles: [Registrar, PlatformAdmin]
    code: 201
    input: [full_name, email, max_caseload, cadence_days]
    output: Mentor
    side_effects:
      - "creates the Mentor in status ACTIVE with current_caseload 0"

  - method: GET
    path: "/mentors/{id}"
    description: "Read one mentor with the live current_caseload."
    roles: [Registrar, PlatformAdmin, FacultyMentor, IntegrityOfficer]
    code: 200
    input: []
    output: Mentor
    side_effects: []

  - method: GET
    path: "/mentors"
    description: "List mentors, filterable by status; ordered by current_caseload ASC then created_at ASC, mirroring the selector's ranking."
    roles: [Registrar, PlatformAdmin, FacultyMentor, IntegrityOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Mentor[]
    side_effects: []

  - method: POST
    path: "/mentors/{id}/status"
    description: "Change a mentor's availability. A mentor who is not ACTIVE is excluded from calculations.mentor_caseload_selector but keeps existing assignments."
    roles: [Registrar, PlatformAdmin]
    code: 200
    input: [status]
    output: Mentor
    side_effects:
      - "Mentor.status set to ACTIVE | ON_LEAVE | INACTIVE, version incremented"

  - method: POST
    path: "/mentor-assignments"
    description: "Assign a faculty mentor to a student, either explicitly or by automatic selection when mentor_id is omitted. Supersedes the student's current ACTIVE assignment. Requires the student's current version."
    roles: [Registrar]
    code: 201
    input: [student_id, expected_student_version, "mentor_id?", "cadence_days?"]
    output: MentorAssignment
    side_effects:
      - "runs calculations.mentor_caseload_selector when mentor_id is omitted, setting selection_mode AUTO_SELECTED, else EXPLICIT"
      - "creates the assignment ACTIVE with assigned_at_utc = logical_now, cadence_status COMPLIANT and next_contact_due_utc = assigned_at_utc + cadence_days * 86400"
      - "ends the student's prior ACTIVE assignment and decrements that mentor's current_caseload"
      - "increments the chosen Mentor.current_caseload and Mentor.version by 1"
      - "increments Student.version by 1"

  - method: GET
    path: "/mentor-assignments/{id}"
    description: "Read one mentor assignment, including the clock-derived cadence_status, overdue_days and unconsumed endorsed_competency_ids."
    roles: [Registrar, PlatformAdmin, FacultyMentor, Student]
    code: 200
    input: []
    output: MentorAssignment
    side_effects: []

  - method: GET
    path: "/mentor-assignments"
    description: "List mentor assignments, filterable by student, mentor, status and cadence_status; ordered by assigned_at_utc DESC."
    roles: [Registrar, PlatformAdmin, FacultyMentor]
    code: 200
    input: ["student_id?", "mentor_id?", "status?", "cadence_status?", "limit?", "offset?"]
    output: MentorAssignment[]
    side_effects: []

  - method: POST
    path: "/mentor-assignments/{id}/contacts"
    description: "Record a progress contact, resetting the cadence curve from the logical clock."
    roles: [FacultyMentor, Registrar]
    code: 200
    input: ["note?"]
    output: MentorAssignment
    side_effects:
      - "sets last_contact_utc = logical_now, increments contact_count, recomputes next_contact_due_utc, resets cadence_status to COMPLIANT and overdue_days to 0"
      - "increments MentorAssignment.version by 1"

  - method: POST
    path: "/mentor-assignments/{id}/endorsements"
    description: "Record a mentor endorsement for one competency, which a later attempt on that competency consumes to clear the repeated-failure gate."
    roles: [FacultyMentor]
    code: 200
    input: [competency_id]
    output: MentorAssignment
    side_effects:
      - "appends competency_id to endorsed_competency_ids and increments endorsement_count"
      - "increments MentorAssignment.version by 1"

  - method: POST
    path: "/mentor-assignments/{id}/end"
    description: "End an ACTIVE assignment without replacing it, freeing the mentor's caseload slot."
    roles: [Registrar]
    code: 200
    input: []
    output: MentorAssignment
    side_effects:
      - "MentorAssignment.status ACTIVE -> ENDED, ended_at_utc = logical_now, version incremented"
      - "decrements Mentor.current_caseload and increments Mentor.version by 1"

  - method: POST
    path: "/evaluators"
    description: "Register a rubric evaluator. mentor_id links the evaluator to a faculty-mentor appointment held by the same person, which drives the segregation-of-duties check at scoring time."
    roles: [Registrar, PlatformAdmin]
    code: 201
    input: [full_name, email, certification_level, "mentor_id?"]
    output: Evaluator
    side_effects:
      - "creates the Evaluator in status CERTIFIED with irr_agreement_rate_pct 100.00 and all counts zero"

  - method: GET
    path: "/evaluators/{id}"
    description: "Read one evaluator with the live inter-rater reliability figures."
    roles: [Registrar, PlatformAdmin, Evaluator, IntegrityOfficer]
    code: 200
    input: []
    output: Evaluator
    side_effects: []

  - method: GET
    path: "/evaluators"
    description: "List evaluators, filterable by linked mentor appointment, status and certification tier; ordered by created_at ASC."
    roles: [Registrar, PlatformAdmin, Evaluator, IntegrityOfficer]
    code: 200
    input: ["mentor_id?", "status?", "certification_level?", "limit?", "offset?"]
    output: Evaluator[]
    side_effects: []

  - method: POST
    path: "/evaluators/{id}/status"
    description: "Set an evaluator's scoring eligibility. Restoring CERTIFIED after an inter-rater-reliability demotion is the only way back."
    roles: [PlatformAdmin]
    code: 200
    input: [status]
    output: Evaluator
    side_effects:
      - "Evaluator.status set to CERTIFIED | PROVISIONAL | SUSPENDED, version incremented"
      - "leaves irr_agreement_rate_pct and demoted_at_utc unchanged"

  - method: POST
    path: "/assessment-attempts"
    description: "Start an attempt on a competency. Runs the full eligibility ladder (mastery, prerequisites, cool-off, endorsement, cadence, integrity hold) and pins both the effective blueprint and the student's ACTIVE term."
    roles: [Student, Registrar]
    code: 201
    input: [student_id, competency_id]
    output: AssessmentAttempt
    side_effects:
      - "runs calculations.attempt_eligibility_ladder in its documented order"
      - "pins blueprint_id via calculations.effective_blueprint_resolution at logical_now and term_id to the covering ACTIVE term"
      - "creates the attempt in status DRAFT with attempt_number = prior non-VOIDED attempts on the competency + 1"
      - "consumes one endorsement and sets endorsement_consumed when the endorsement gate applied"
      - "increments SubscriptionTerm.attempts_used and AssessmentBlueprint.attempts_bound_count"

  - method: GET
    path: "/assessment-attempts/{id}"
    description: "Read one attempt, including final_score_pct, is_provisional_score, score_variant and cooloff_until_utc."
    roles: [Registrar, PlatformAdmin, FacultyMentor, Evaluator, IntegrityOfficer, Student]
    code: 200
    input: []
    output: AssessmentAttempt
    side_effects: []

  - method: GET
    path: "/assessment-attempts"
    description: "List attempts, filterable by student, competency, pinned blueprint, pinned term and status; ordered by created_at ASC."
    roles: [Registrar, PlatformAdmin, FacultyMentor, Evaluator, IntegrityOfficer, Student]
    code: 200
    input: ["student_id?", "competency_id?", "blueprint_id?", "term_id?", "status?", "limit?", "offset?"]
    output: AssessmentAttempt[]
    side_effects: []

  - method: POST
    path: "/assessment-attempts/{id}/submit"
    description: "Submit the attempt artifact with the unproctored-assessment integrity attestation and a device fingerprint. A fingerprint already seen on another student's attempt trips the automatic integrity screen."
    roles: [Student]
    code: 200
    input: [artifact_hash, integrity_attestation_accepted, client_fingerprint]
    output: AssessmentAttempt
    side_effects:
      - "AssessmentAttempt.status DRAFT -> UNDER_REVIEW, submitted_at_utc = logical_now, version incremented"
      - "when client_fingerprint matches a submitted attempt of a DIFFERENT student, or artifact_hash matches any other attempt, opens an IntegrityCase with auto_raised true and the attempt goes DRAFT -> INTEGRITY_HOLD instead"

  - method: POST
    path: "/assessment-attempts/{id}/scores"
    description: "Record one evaluator's rubric score. Reader ordinal is assigned automatically (1, 2, then 3 for the adjudicator) and the attempt's final score resolves per calculations.attempt_final_score."
    roles: [Evaluator]
    code: 201
    input: [evaluator_id, dimension_scores, "narrative?"]
    output: EvaluatorScore
    side_effects:
      - "runs calculations.rubric_weighted_score, writing weighted_score_pct and critical_fail"
      - "assigns reader_ordinal and is_adjudication, increments AssessmentAttempt.scores_received_count and Evaluator.submitted_score_count"
      - "runs calculations.attempt_final_score, which may leave the attempt UNDER_REVIEW with a provisional score, move it to ADJUDICATION, or resolve it to SCORED_MASTERED / SCORED_NOT_MASTERED"
      - "on mastery runs the mastery_to_graduation_cascade; on a non-mastery resolution publishes cooloff_until_utc"
      - "recomputes calculations.irr_agreement_rate for both readers whenever a reader pair completes, which may demote a CERTIFIED evaluator to PROVISIONAL"

  - method: POST
    path: "/assessment-attempts/{id}/request-revision"
    description: "Send an UNDER_REVIEW or ADJUDICATION attempt back to the candidate for revision, voiding the scores collected so far."
    roles: [Evaluator, Registrar]
    code: 200
    input: [reason]
    output: AssessmentAttempt
    side_effects:
      - "AssessmentAttempt.status -> REVISION_REQUESTED, increments revision_count, version incremented"
      - "voids every SUBMITTED EvaluatorScore on the attempt with voided_reason REVISION_REQUESTED and resets scores_received_count to 0, final_score_pct to null and score_variant to null"
      - "recomputes calculations.irr_agreement_rate for the affected evaluators"

  - method: POST
    path: "/assessment-attempts/{id}/reopen"
    description: "Return a REVISION_REQUESTED attempt to DRAFT so the candidate can resubmit. The attempt keeps its original pinned blueprint even if a newer blueprint window has opened since."
    roles: [Student, Registrar]
    code: 200
    input: []
    output: AssessmentAttempt
    side_effects:
      - "AssessmentAttempt.status REVISION_REQUESTED -> DRAFT, version incremented"
      - "leaves blueprint_id and term_id at their original pinned values"

  - method: GET
    path: "/evaluator-scores/{id}"
    description: "Read one evaluator score with its weighted result and reader ordinal."
    roles: [Registrar, PlatformAdmin, Evaluator, IntegrityOfficer]
    code: 200
    input: []
    output: EvaluatorScore
    side_effects: []

  - method: GET
    path: "/evaluator-scores"
    description: "List evaluator scores, filterable by attempt, evaluator and status; ordered by reader_ordinal ASC."
    roles: [Registrar, PlatformAdmin, Evaluator, IntegrityOfficer]
    code: 200
    input: ["attempt_id?", "evaluator_id?", "status?", "limit?", "offset?"]
    output: EvaluatorScore[]
    side_effects: []

  - method: POST
    path: "/integrity-cases"
    description: "Open an academic-integrity case against an attempt. Places an immediate hold: the attempt cannot be submitted or scored, and aid cannot be disbursed, while the case is unresolved."
    roles: [IntegrityOfficer, Evaluator]
    code: 201
    input: [attempt_id, signal_type, severity, "note?"]
    output: IntegrityCase
    side_effects:
      - "creates the case in status OPEN with auto_raised false, student_id copied from the attempt and attempt_status_at_open recording the attempt's status"
      - "sets AssessmentAttempt.integrity_hold true; when the attempt is in DRAFT, UNDER_REVIEW or ADJUDICATION it moves to INTEGRITY_HOLD with held_from_status recording where it came from"

  - method: GET
    path: "/integrity-cases/{id}"
    description: "Read one integrity case with its sanction and resolution audit fields."
    roles: [IntegrityOfficer, Registrar, PlatformAdmin]
    code: 200
    input: []
    output: IntegrityCase
    side_effects: []

  - method: GET
    path: "/integrity-cases"
    description: "List integrity cases, filterable by student, attempt, status and signal type; ordered by created_at ASC."
    roles: [IntegrityOfficer, Registrar, PlatformAdmin]
    code: 200
    input: ["student_id?", "attempt_id?", "status?", "signal_type?", "limit?", "offset?"]
    output: IntegrityCase[]
    side_effects: []

  - method: POST
    path: "/integrity-cases/{id}/investigate"
    description: "Move an OPEN case to UNDER_INVESTIGATION. The hold stays in force."
    roles: [IntegrityOfficer]
    code: 200
    input: []
    output: IntegrityCase
    side_effects:
      - "IntegrityCase.status OPEN -> UNDER_INVESTIGATION, version incremented"

  - method: POST
    path: "/integrity-cases/{id}/resolve"
    description: "Resolve an UNDER_INVESTIGATION case. Segregation of duties: the resolving user must differ from opened_by_user_id. SUBSTANTIATED with sanction ATTEMPT_VOID runs the four-hop integrity_void_cascade."
    roles: [IntegrityOfficer]
    code: 200
    input: [outcome, sanction]
    output: IntegrityCase
    side_effects:
      - "IntegrityCase.status -> SUBSTANTIATED | DISMISSED with sanction, resolved_at_utc = logical_now and resolved_by_user_id = X-User-ID, version incremented"
      - "clears AssessmentAttempt.integrity_hold and, unless the attempt is voided, restores it to held_from_status"
      - "on SUBSTANTIATED increments Student.integrity_strike_count, which at 2 suspends the student"
      - "on sanction ATTEMPT_VOID runs the integrity_void_cascade: attempt VOIDED, scores VOIDED, unit totals and credit equivalency decremented, transcripts VOIDED, aid held or flagged for review"
      - "on sanction TERM_SUSPENSION cancels the student's ACTIVE term (running calculations.term_close_aid_return) and suspends the student"

  - method: POST
    path: "/sap-reviews"
    description: "Record a satisfactory-academic-progress checkpoint for a student against a term. Pace is measured in mastered competency units, never credit hours, and the resulting status depends on the student's prior sap_status."
    roles: [Registrar]
    code: 201
    input: [student_id, term_id]
    output: SapReview
    side_effects:
      - "runs calculations.sap_pace_and_outcome, writing terms_counted, expected_units, cumulative_mastered_units, pace_pct, pace_band, previous_sap_status and new_sap_status"
      - "sets Student.sap_status = new_sap_status and increments Student.version by 1 whenever the value changes"
      - "a review landing on DISMISSED cancels the student's SCHEDULED and HELD AidDisbursements"
      - "the SapReview row is append-only: it has no version and is never updated"

  - method: GET
    path: "/sap-reviews/{id}"
    description: "Read one SAP review. Append-only audit row: it carries id and created_at but no updated_at and no version."
    roles: [Registrar, PlatformAdmin, FinancialAidOfficer, FacultyMentor, Student]
    code: 200
    input: []
    output: SapReview
    side_effects: []

  - method: GET
    path: "/sap-reviews"
    description: "List SAP reviews, filterable by student, term and resulting pace band; ordered by created_at ASC."
    roles: [Registrar, PlatformAdmin, FinancialAidOfficer, FacultyMentor]
    code: 200
    input: ["student_id?", "term_id?", "pace_band?", "limit?", "offset?"]
    output: SapReview[]
    side_effects: []

  - method: POST
    path: "/aid-disbursements"
    description: "Schedule a federal aid award against a subscription term. Requires the term's current version because the term's credit equivalency moves on every mastery."
    roles: [FinancialAidOfficer]
    code: 201
    input: [student_id, term_id, scheduled_amount_cents, expected_term_version]
    output: AidDisbursement
    side_effects:
      - "creates the award in status SCHEDULED with outstanding_amount_cents = scheduled_amount_cents and every other ledger bucket 0"
      - "cancels any prior SCHEDULED award on the same term"
      - "increments Student.aid_scheduled_total_cents and Student.version by 1"
      - "increments SubscriptionTerm.version by 1"

  - method: GET
    path: "/aid-disbursements/{id}"
    description: "Read one aid award with the full ledger: outstanding, disbursed, retained, returned, cancelled and the return split."
    roles: [FinancialAidOfficer, Registrar, PlatformAdmin, Student]
    code: 200
    input: []
    output: AidDisbursement
    side_effects: []

  - method: GET
    path: "/aid-disbursements"
    description: "List aid awards, filterable by student, term, status and hold reason; ordered by created_at ASC."
    roles: [FinancialAidOfficer, Registrar, PlatformAdmin]
    code: 200
    input: ["student_id?", "term_id?", "status?", "hold_reason?", "limit?", "offset?"]
    output: AidDisbursement[]
    side_effects: []

  - method: POST
    path: "/aid-disbursements/{id}/disburse"
    description: "Release a SCHEDULED or HELD award. Requires an ACTIVE term, a student in GOOD_STANDING or WARNING, no live integrity hold, and a term credit-hour equivalency at or above the program floor."
    roles: [FinancialAidOfficer]
    code: 200
    input: []
    output: AidDisbursement
    side_effects:
      - "AidDisbursement.status -> DISBURSED, disbursed_at_utc = logical_now, hold_reason cleared, version incremented"
      - "moves the whole amount from outstanding_amount_cents to retained_amount_cents and records credit_equivalency_at_disbursement"
      - "recomputes Student.aid_retained_total_cents and increments Student.version by 1"

  - method: POST
    path: "/aid-disbursements/{id}/return"
    description: "Return unearned aid on a DISBURSED award after the term closed short, splitting the unearned amount between the school and the student."
    roles: [FinancialAidOfficer]
    code: 200
    input: []
    output: AidDisbursement
    side_effects:
      - "runs calculations.term_close_aid_return, writing unearned_aid_cents, school_return_share_cents and student_return_share_cents"
      - "AidDisbursement.status DISBURSED -> RETURNED, returned_amount_cents = school_return_share_cents, retained_amount_cents reduced by the same figure, returned_at_utc = logical_now, version incremented"
      - "recomputes Student.aid_returned_total_cents and Student.aid_retained_total_cents and increments Student.version by 1"
      - "calculations.aid_cents_conservation must still balance exactly afterwards"

  - method: POST
    path: "/aid-disbursements/{id}/cancel"
    description: "Cancel a SCHEDULED or HELD award that will never be released."
    roles: [FinancialAidOfficer]
    code: 200
    input: ["reason?"]
    output: AidDisbursement
    side_effects:
      - "AidDisbursement.status -> CANCELLED, cancelled_amount_cents = scheduled_amount_cents, outstanding_amount_cents = 0, version incremented"

  - method: POST
    path: "/transcript-records"
    description: "Build a transcript that translates the student's mastered competencies into credit hours for transfer, one line per mastered competency in mastery order."
    roles: [Registrar, Student]
    code: 201
    input: [student_id, purpose]
    output: TranscriptRecord
    side_effects:
      - "runs calculations.transcript_translation, writing lines, competency_line_count, total_mastered_units, translated_credit_hours, line_credit_hour_sum and rounding_residual_credit_hours"
      - "creates the record in status DRAFT"
      - "voids any earlier DRAFT record for the same student with voided_reason SUPERSEDED"

  - method: GET
    path: "/transcript-records/{id}"
    description: "Read one transcript record with its per-competency credit lines and the rounding residual between the line sum and the cumulative figure."
    roles: [Registrar, PlatformAdmin, Student]
    code: 200
    input: []
    output: TranscriptRecord
    side_effects: []

  - method: GET
    path: "/transcript-records"
    description: "List transcript records, filterable by student, status and purpose; ordered by created_at DESC."
    roles: [Registrar, PlatformAdmin]
    code: 200
    input: ["student_id?", "status?", "purpose?", "limit?", "offset?"]
    output: TranscriptRecord[]
    side_effects: []

  - method: POST
    path: "/transcript-records/{id}/issue"
    description: "Issue a DRAFT transcript. Refused while any integrity case on the student is unresolved."
    roles: [Registrar]
    code: 200
    input: []
    output: TranscriptRecord
    side_effects:
      - "TranscriptRecord.status DRAFT -> ISSUED, issued_at_utc = logical_now, version incremented"

# =============================================================================
# §1.6 Error Code Catalog
# Every id below is triggerable through at least one §1.5 endpoint.
# =============================================================================
errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role missing, empty, or whitespace-only"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "X-User-Role is not a declared role, or the role is absent from the target endpoint's roles list"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed role acts on a resource it does not own: Student id, MentorAssignment.mentor_id or EvaluatorScore.evaluator_id does not equal X-User-ID"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unparseable ISO-8601 instant, undeclared enum value, negative amount, out-of-range percentage, dimension score outside 0..max_score, term_end_utc not after term_start_utc, or a uniqueness collision on Program.code / Competency.code within a program / Student.email / Evaluator.email / Mentor.email"

  # --- existence (one per entity, resolved left-to-right) ---
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No Program with the given id"
  - id: ERR_COMPETENCY_NOT_FOUND
    http: 404
    condition: "No Competency with the given id, including a prerequisite_competency_id that does not resolve"
  - id: ERR_BLUEPRINT_NOT_FOUND
    http: 404
    condition: "No AssessmentBlueprint with the given id"
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "No Student with the given id"
  - id: ERR_TERM_NOT_FOUND
    http: 404
    condition: "No SubscriptionTerm with the given id"
  - id: ERR_MENTOR_NOT_FOUND
    http: 404
    condition: "No Mentor with the given id, including an explicit mentor_id on an assignment create"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "No MentorAssignment with the given id"
  - id: ERR_EVALUATOR_NOT_FOUND
    http: 404
    condition: "No Evaluator with the given id"
  - id: ERR_ATTEMPT_NOT_FOUND
    http: 404
    condition: "No AssessmentAttempt with the given id"
  - id: ERR_SCORE_NOT_FOUND
    http: 404
    condition: "No EvaluatorScore with the given id"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "No IntegrityCase with the given id"
  - id: ERR_SAP_REVIEW_NOT_FOUND
    http: 404
    condition: "No SapReview with the given id"
  - id: ERR_DISBURSEMENT_NOT_FOUND
    http: 404
    condition: "No AidDisbursement with the given id"
  - id: ERR_TRANSCRIPT_NOT_FOUND
    http: 404
    condition: "No TranscriptRecord with the given id"

  # --- optimistic concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_competency_version, expected_student_version or expected_term_version does not equal the parent's current version"

  # --- lifecycle / state preconditions ---
  - id: ERR_PROGRAM_NOT_PUBLISHED
    http: 409
    condition: "The Program is still DRAFT when a student enrollment, prerequisite edge or assessment attempt is attempted against it"
  - id: ERR_PROGRAM_ALREADY_PUBLISHED
    http: 409
    condition: "POST /programs/{id}/publish on a Program that is already PUBLISHED"
  - id: ERR_COMPETENCY_RETIRED
    http: 409
    condition: "The Competency is RETIRED when a retire, blueprint publication or new attempt is attempted against it"
  - id: ERR_STUDENT_NOT_APPLICANT
    http: 409
    condition: "POST /students/{id}/activate on a Student whose enrollment_status is not APPLICANT"
  - id: ERR_STUDENT_NOT_SUSPENDED
    http: 409
    condition: "POST /students/{id}/reinstate on a Student whose enrollment_status is not SUSPENDED"
  - id: ERR_STUDENT_ALREADY_CLOSED
    http: 409
    condition: "Withdraw or suspend on a Student already in the terminal WITHDRAWN or GRADUATED state"
  - id: ERR_STUDENT_NOT_ACTIVE
    http: 409
    condition: "The subject Student's enrollment_status is not ACTIVE when a term, assignment, attempt or disbursement operation requires it"
  - id: ERR_TERM_NOT_PENDING
    http: 409
    condition: "POST /subscription-terms/{id}/activate on a term that is not PENDING"
  - id: ERR_TERM_NOT_ACTIVE
    http: 409
    condition: "The student has no ACTIVE SubscriptionTerm whose half-open window covers the logical clock, or the operation targets a term that is not ACTIVE"
  - id: ERR_ASSIGNMENT_NOT_ACTIVE
    http: 409
    condition: "A contact, endorsement or end operation targets a MentorAssignment that is already ENDED"
  - id: ERR_EVALUATOR_SUSPENDED
    http: 409
    condition: "POST /evaluators/{id}/status attempts to move a SUSPENDED evaluator back to CERTIFIED or PROVISIONAL"
  - id: ERR_ATTEMPT_NOT_DRAFT
    http: 409
    condition: "POST /assessment-attempts/{id}/submit on an attempt that is not DRAFT"
  - id: ERR_ATTEMPT_NOT_UNDER_REVIEW
    http: 409
    condition: "A score or revision request targets an attempt that is neither UNDER_REVIEW nor ADJUDICATION"
  - id: ERR_ATTEMPT_NOT_IN_REVISION
    http: 409
    condition: "POST /assessment-attempts/{id}/reopen on an attempt that is not REVISION_REQUESTED"
  - id: ERR_ATTEMPT_VOIDED
    http: 409
    condition: "Any write against an attempt in the terminal VOIDED state"
  - id: ERR_CASE_NOT_UNDER_INVESTIGATION
    http: 409
    condition: "POST /integrity-cases/{id}/resolve on a case still OPEN"
  - id: ERR_CASE_ALREADY_RESOLVED
    http: 409
    condition: "Investigate or resolve on a case already SUBSTANTIATED or DISMISSED"
  - id: ERR_DISBURSEMENT_NOT_SCHEDULED
    http: 409
    condition: "Disburse or cancel on an award that is RETURNED or CANCELLED"
  - id: ERR_AID_ALREADY_DISBURSED
    http: 409
    condition: "POST /aid-disbursements/{id}/disburse on an award already DISBURSED"
  - id: ERR_AID_NOT_DISBURSED
    http: 409
    condition: "POST /aid-disbursements/{id}/return on an award that is not DISBURSED"
  - id: ERR_TRANSCRIPT_ALREADY_ISSUED
    http: 409
    condition: "POST /transcript-records/{id}/issue on a record already ISSUED"
  - id: ERR_TRANSCRIPT_VOIDED
    http: 409
    condition: "POST /transcript-records/{id}/issue on a record that has been VOIDED by a unit-total change or superseded by a newer record"
  - id: ERR_SAP_ALREADY_DISMISSED
    http: 409
    condition: "POST /sap-reviews for a Student whose sap_status is already the terminal DISMISSED"

  # --- academic integrity and segregation of duties ---
  - id: ERR_ATTESTATION_REQUIRED
    http: 422
    condition: "integrity_attestation_accepted is not exactly true, or client_fingerprint is missing or empty, on submit"
  - id: ERR_INTEGRITY_HOLD_ACTIVE
    http: 409
    condition: "An attempt write or an aid disbursement is attempted while an IntegrityCase on the attempt or student is OPEN or UNDER_INVESTIGATION"
  - id: ERR_EVALUATOR_CONFLICT_OF_INTEREST
    http: 422
    condition: "The scoring Evaluator's mentor_id equals the mentor_id of the student's ACTIVE MentorAssignment, or matches the mentor link of an evaluator who already scored the attempt"
  - id: ERR_DUPLICATE_EVALUATOR_SCORE
    http: 409
    condition: "The same Evaluator scores one attempt twice, or a further reader score arrives after required_evaluator_count scores are already recorded"
  - id: ERR_EVALUATOR_NOT_CERTIFIED
    http: 422
    condition: "The scoring Evaluator is SUSPENDED, or is PROVISIONAL and is being asked to take the reader_ordinal 3 adjudication slot"
  - id: ERR_CASE_RESOLVER_IS_OPENER
    http: 422
    condition: "The X-User-ID resolving an IntegrityCase equals its opened_by_user_id (segregation of duties)"
  - id: ERR_TRANSCRIPT_INTEGRITY_PENDING
    http: 422
    condition: "Transcript issuance while any IntegrityCase on the student is OPEN or UNDER_INVESTIGATION"

  # --- rubric and competency-graph integrity ---
  - id: ERR_RUBRIC_DIMENSION_MISMATCH
    http: 422
    condition: "The submitted dimension_scores code set differs from the bound blueprint's dimension code set (missing or unknown dimension)"
  - id: ERR_RUBRIC_WEIGHTS_INVALID
    http: 422
    condition: "Blueprint dimension weights do not sum to exactly 1.0000, a weight is not positive, a max_score is not positive, dimension codes repeat, or the dimensions list is empty or longer than 8"
  - id: ERR_PREREQUISITE_PROGRAM_MISMATCH
    http: 422
    condition: "A prerequisite competency belongs to a different Program than the dependent competency"
  - id: ERR_PREREQUISITE_CYCLE
    http: 422
    condition: "The prerequisite edge would close a cycle in the competency graph, including a self-edge"
  - id: ERR_PREREQUISITE_NOT_MASTERED
    http: 422
    condition: "Some competency in the target's transitive prerequisite chain is not yet mastered by the student"
  - id: ERR_COMPETENCY_ALREADY_MASTERED
    http: 409
    condition: "The student already holds a non-VOIDED SCORED_MASTERED attempt on the competency"
  - id: ERR_NO_EFFECTIVE_BLUEPRINT
    http: 409
    condition: "No blueprint window covers the logical clock for the competency, so no rubric can be pinned to the attempt"

  # --- temporal windows and cadence ---
  - id: ERR_ATTEMPT_COOLOFF_ACTIVE
    http: 422
    condition: "logical_now is strictly before cooloff_until_utc of the student's most recent SCORED_NOT_MASTERED attempt on the competency"
  - id: ERR_TERM_WINDOW_OVERLAP
    http: 409
    condition: "The requested half-open term window intersects an existing non-CANCELLED term window of the same student; exact adjacency does not"
  - id: ERR_BLUEPRINT_WINDOW_NOT_CONTIGUOUS
    http: 409
    condition: "A superseding blueprint's effective_from_utc is not strictly after the current PUBLISHED blueprint's effective_from_utc, which would leave a gap or an overlap in the window tiling"
  - id: ERR_BLUEPRINT_NOTICE_TOO_SHORT
    http: 422
    condition: "A superseding blueprint's effective_from_utc is less than Program.blueprint_notice_days ahead of the logical clock"
  - id: ERR_MENTOR_CADENCE_OVERDUE
    http: 422
    condition: "The student's ACTIVE MentorAssignment has overdue_days at or beyond Program.cadence_gate_overdue_days"

  # --- caseload and endorsement capacity ---
  - id: ERR_MENTOR_CASELOAD_FULL
    http: 409
    condition: "An explicitly named mentor is at max_caseload or is not ACTIVE"
  - id: ERR_NO_ELIGIBLE_MENTOR
    http: 422
    condition: "Automatic selection finds no ACTIVE mentor with spare caseload"
  - id: ERR_MENTOR_ENDORSEMENT_REQUIRED
    http: 422
    condition: "The student has reached Program.attempts_before_endorsement failed non-VOIDED attempts on the competency and holds no unconsumed mentor endorsement for it"

  # --- federal aid gating ---
  - id: ERR_AID_SAP_INELIGIBLE
    http: 422
    condition: "Disbursement attempted while Student.sap_status is PROBATION or DISMISSED"
  - id: ERR_AID_CREDIT_EQUIVALENCY_SHORTFALL
    http: 422
    condition: "The term's credit_equivalency_earned is below Program.aid_min_credit_equivalency at disbursement time"

# =============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# The scoring pipeline deliberately splits authorship (Student), mentoring
# (FacultyMentor), scoring (Evaluator), integrity adjudication
# (IntegrityOfficer) and money (FinancialAidOfficer) across five distinct
# roles, and no role may hold two adjacent steps for the same resource.
# =============================================================================
roles:
  - name: Registrar
    description: "Academic records office: owns the competency map, blueprints, enrollment, subscription terms, mentor assignments and SAP checkpoints."
    identity: "opaque"
    exclusive_operations:
      - "POST /programs"
      - "POST /programs/{id}/publish"
      - "POST /competencies"
      - "POST /competencies/{id}/prerequisite"
      - "POST /competencies/{id}/retire"
      - "POST /assessment-blueprints"
      - "POST /students"
      - "POST /students/{id}/activate"
      - "POST /students/{id}/withdraw"
      - "POST /students/{id}/reinstate"
      - "POST /subscription-terms"
      - "POST /subscription-terms/{id}/activate"
      - "POST /mentor-assignments"
      - "POST /mentor-assignments/{id}/end"
      - "POST /sap-reviews"
      - "POST /transcript-records/{id}/issue"
    shared_operations:
      - "POST /students/{id}/suspend (with IntegrityOfficer)"
      - "POST /subscription-terms/{id}/close (with FinancialAidOfficer)"
      - "POST /mentors and POST /mentors/{id}/status (with PlatformAdmin)"
      - "POST /evaluators (with PlatformAdmin)"
      - "POST /mentor-assignments/{id}/contacts (with FacultyMentor)"
      - "POST /assessment-attempts and POST /assessment-attempts/{id}/reopen (with Student)"
      - "POST /assessment-attempts/{id}/request-revision (with Evaluator)"
      - "POST /transcript-records (with Student)"
      - "POST /_clock/set_current_utc and GET /_clock"
      - "all GET reads except GET /evaluator-scores, which it shares with Evaluator, PlatformAdmin and IntegrityOfficer"

  - name: Student
    description: "The learner. Starts attempts, submits artifacts with the integrity attestation, and reads only their own record."
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /assessment-attempts/{id}/submit"
    shared_operations:
      - "POST /assessment-attempts and POST /assessment-attempts/{id}/reopen (with Registrar)"
      - "POST /transcript-records (with Registrar)"
      - "GET /students/{id}, GET /students/{id}/progress-summary, GET /assessment-attempts, GET /subscription-terms, GET /mentor-assignments, GET /transcript-records/{id}, GET /aid-disbursements/{id}, GET /sap-reviews/{id} — restricted to rows whose subject student id equals X-User-ID"

  - name: FacultyMentor
    description: "Faculty mentor carrying a caseload: records progress contacts on the declared cadence and endorses a mentee for a further attempt after repeated failures."
    identity: "entity_backed:Mentor"
    exclusive_operations:
      - "POST /mentor-assignments/{id}/endorsements"
    shared_operations:
      - "POST /mentor-assignments/{id}/contacts (with Registrar)"
      - "GET /mentor-assignments, GET /mentors/{id}, GET /students, GET /assessment-attempts, GET /subscription-terms, GET /sap-reviews — restricted, for assignment reads and writes, to rows whose mentor_id equals X-User-ID"

  - name: Evaluator
    description: "Independent rubric reader. Scores attempts, may open an integrity case on a suspicious artifact, and may send an attempt back for revision — but never touches enrollment, aid or case resolution."
    identity: "entity_backed:Evaluator"
    exclusive_operations:
      - "POST /assessment-attempts/{id}/scores"
    shared_operations:
      - "POST /assessment-attempts/{id}/request-revision (with Registrar)"
      - "POST /integrity-cases (with IntegrityOfficer)"
      - "GET /assessment-attempts, GET /evaluator-scores, GET /evaluators/{id}, GET /competencies, GET /assessment-blueprints"

  - name: IntegrityOfficer
    description: "Academic-integrity adjudicator for unproctored assessments. Investigates and resolves cases and applies sanctions. Cannot score, cannot enrol and cannot move money; and cannot resolve a case they themselves opened."
    identity: "opaque"
    exclusive_operations:
      - "POST /integrity-cases/{id}/investigate"
      - "POST /integrity-cases/{id}/resolve"
    shared_operations:
      - "POST /integrity-cases (with Evaluator)"
      - "POST /students/{id}/suspend (with Registrar)"
      - "GET /integrity-cases, GET /integrity-cases/{id}, GET /assessment-attempts, GET /evaluator-scores, GET /students, GET /evaluators/{id}, GET /mentors/{id}, GET /_clock"

  - name: FinancialAidOfficer
    description: "Federal aid administrator. Schedules, releases, holds, returns and cancels aid against the credit-hour equivalency, and may close a term for aid purposes."
    identity: "opaque"
    exclusive_operations:
      - "POST /aid-disbursements"
      - "POST /aid-disbursements/{id}/disburse"
      - "POST /aid-disbursements/{id}/return"
      - "POST /aid-disbursements/{id}/cancel"
    shared_operations:
      - "POST /subscription-terms/{id}/close (with Registrar)"
      - "GET /aid-disbursements, GET /aid-disbursements/{id}, GET /subscription-terms, GET /students, GET /students/{id}/progress-summary, GET /sap-reviews, GET /_clock"

  - name: PlatformAdmin
    description: "Operational administrator: registers mentors and evaluators, changes their availability or certification, drives the logical clock, and reads everything. Holds no academic, integrity or fiscal authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /evaluators/{id}/status"
    shared_operations:
      - "POST /programs (with Registrar)"
      - "POST /mentors and POST /mentors/{id}/status (with Registrar)"
      - "POST /evaluators (with Registrar)"
      - "POST /_clock/set_current_utc (with Registrar, IntegrityOfficer, FinancialAidOfficer)"
      - "every GET endpoint"
