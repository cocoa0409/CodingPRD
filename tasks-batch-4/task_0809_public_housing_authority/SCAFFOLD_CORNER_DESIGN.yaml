        test_recipe:
          setup: ["A drawn ACTIVE bedroom-2 entry."]
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "NF-U" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
