      - name: third_ninety_minute_session_exceeds_weekly_cap
        claim_type: aggregate_validation
        grounds: ["validations[priority=26]", "errors[ERR_COHORT_WEEKLY_SEMINAR_CAP_EXCEEDED]", entities.SeminarSession.fields.scheduled_minutes]
        distinguishing_aspect: "Each 90-minute session is individually legal and none of them overlap, yet the third pushes the ISO-week total to 270 against COHORT_WEEKLY_SEMINAR_CAP_MINUTES=240; the identical session in the following ISO week is accepted, proving the window resets on the Monday boundary rather than being a rolling seven days."
        test_recipe:
          setup: ["Cohort NORTH-2026 owns two SCHEDULED 90-minute sessions in ISO week 2026-W32, on 2026-08-05 and 2026-08-06, for a running total of 180 minutes. The logical clock is at its startup default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 4 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /seminar-sessions"
              payload: { cohort_id: "${cohort_id}", session_index: 1, topic: "Classroom routines", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:30:00Z" }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /seminar-sessions"
              payload: { cohort_id: "${cohort_id}", session_index: 2, topic: "Formative assessment", scheduled_start: "2026-08-06T09:00:00Z", scheduled_end: "2026-08-06T10:30:00Z" }
              as: ProgramAdmin
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /seminar-sessions"
              payload: { cohort_id: "${cohort_id}", session_index: 3, topic: "Family engagement", scheduled_start: "2026-08-07T09:00:00Z", scheduled_end: "2026-08-07T10:30:00Z" }
              as: ProgramAdmin
            - call: "POST /seminar-sessions"
              payload: { cohort_id: "${cohort_id}", session_index: 4, topic: "Family engagement", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T10:30:00Z" }
              as: ProgramAdmin
              captures: { s4_id: $.data.id }
          assert:
            - "the first call returns HTTP 422 with data.error_id == \"ERR_COHORT_WEEKLY_SEMINAR_CAP_EXCEEDED\" — 180 + 90 = 270 exceeds 240"
            - "the second call returns HTTP 201 with data.scheduled_minutes == 90 and data.status == \"SCHEDULED\" — 2026-08-10 opens ISO week 2026-W33"
            - "GET /seminar-sessions?cohort_id=${cohort_id} returns total_count == 3 and session_index 3 is absent"
            - "GET /seminar-sessions/${s4_id} reports credited_attendance_count == 0"

      - name: prerequisite_check_applies_only_when_prerequisite_named
        claim_type: conditional_validation
        grounds: ["validations[priority=31]", "errors[ERR_PREREQUISITE_NOT_ATTAINED]", entities.Milestone.fields.prerequisite_milestone_id, state_machines.MilestoneAttainment.transitions.REVOKED_to_IN_PROGRESS]
        distinguishing_aspect: "The rule is conditioned on the milestone's own configuration, tested on the REOPEN path rather than the ATTAIN path: reopening the dependent row is refused because its prerequisite is now REVOKED, while reopening the prerequisite row itself succeeds because it names no prerequisite at all. Both calls hit the same endpoint with the same decision value."
        test_recipe:
          setup: ["Milestones IND_M1 (sequence_index 1, no prerequisite) and IND_M2 (sequence_index 2, prerequisite IND_M1) carry zero evidence requirements and neither gates the licence recommendation. For novice Dana Pike both attainment rows were attained and then revoked — IND_M2 first, then IND_M1 — so both rows are REVOKED with revocation_count 1. The logical clock is at its startup default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Northgate High", site_code: "NG-001", region_code: "NORTH", mentor_slot_cap: 6 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /cohorts"
              payload: { name: "Induction 2026-27", program_year: 2026, region_code: "NORTH", seminar_sessions_required: 1 }
              as: ProgramAdmin
              captures: { cohort_id: $.data.id }
            - call: "POST /milestones"
              payload: { code: "IND_M1", title: "Orientation complete", sequence_index: 1, required_contact_minutes: 0, required_observation_cycles: 0, required_credited_seminars: 0, license_stage_unlocked: "PROVISIONAL", gates_license_recommendation: false }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /milestones"
              payload: { code: "IND_M2", title: "Mid-year review complete", sequence_index: 2, required_contact_minutes: 0, required_observation_cycles: 0, required_credited_seminars: 0, license_stage_unlocked: "PROVISIONAL", gates_license_recommendation: false, prerequisite_milestone_id: "${m1_id}" }
              as: ProgramAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /novice-teachers"
              payload: { site_id: "${site_id}", cohort_id: "${cohort_id}", full_name: "Dana Pike", subject_area: "MATH", induction_year: 1 }
              as: ProgramAdmin
              captures: { novice_id: $.data.id }
            - call: "GET /milestone-attainments?novice_id=${novice_id}&milestone_id=${m1_id}"
              payload: {}
              as: ProgramAdmin
              captures: { a1_id: "$.data[0].id" }
            - call: "GET /milestone-attainments?novice_id=${novice_id}&milestone_id=${m2_id}"
              payload: {}
              as: ProgramAdmin
              captures: { a2_id: "$.data[0].id" }
            - call: "POST /milestone-attainments/${a1_id}/decision"
              payload: { decision: "ATTAIN", evidence_note: "Orientation roster on file" }
              as: ProgramAdmin
              as_user_id: "u-program-office-1"
            - call: "POST /milestone-attainments/${a2_id}/decision"
              payload: { decision: "ATTAIN", evidence_note: "Mid-year review notes on file" }
              as: ProgramAdmin
              as_user_id: "u-program-office-1"
            - call: "POST /milestone-attainments/${a2_id}/decision"
              payload: { decision: "REVOKE", reason: "Mid-year review packet was filed against the wrong novice" }
              as: ProgramAdmin
              as_user_id: "u-program-office-1"
            - call: "POST /milestone-attainments/${a1_id}/decision"
              payload: { decision: "REVOKE", reason: "Orientation roster signature could not be authenticated" }
              as: ProgramAdmin
              as_user_id: "u-program-office-1"
          trigger:
            - call: "POST /milestone-attainments/${a2_id}/decision"
              payload: { decision: "REOPEN" }
              as: ProgramAdmin
              as_user_id: "u-program-office-1"
            - call: "POST /milestone-attainments/${a1_id}/decision"
              payload: { decision: "REOPEN" }
              as: ProgramAdmin
              as_user_id: "u-program-office-1"
          assert:
            - "the first call returns HTTP 422 with data.error_id == \"ERR_PREREQUISITE_NOT_ATTAINED\" — IND_M2 names IND_M1 and that row is REVOKED, not ATTAINED"
            - "the second call returns HTTP 200 with data.status == \"IN_PROGRESS\" and data.revoke_reason == null — IND_M1 names no prerequisite so the rule does not apply"
            - "GET /milestone-attainments/${a2_id} still reports status == \"REVOKED\" and revocation_count == 1"
            - "GET /milestone-attainments/${a1_id} reports revocation_count == 1 — reopening does not reset the revocation counter"
            - "GET /novice-teachers/${novice_id} reports attained_milestone_count == 0 and readiness_index_snapshot == 0.00"

      - name: packet_submit_runs_gate_checks_in_dependency_order
        claim_type: cascading_validation
        grounds: ["validations[priority=20]", "validations[priority=33]", "validations[priority=34]"]
        excluded_because:
          difficulty_instance: multi_hop_state_dependency / packet_submission_requires_closed_cohort
          rationale: "The named §1.8 instance clears one gate at a time on the same SUBMIT call — cohort state first, then the licence recommendation — so the ordering of the dependent checks is asserted by the sequence of distinct errors it observes."

  - section: endpoints
    instances:
      - name: milestone_create_read_and_reverse_filtered_list
        claim_type: standard_crud
        grounds: ["endpoints[POST /milestones]", "endpoints[GET /milestones/{id}]", "endpoints[GET /milestones]", entities.Milestone.fields.prerequisite_milestone_id]
        distinguishing_aspect: "The whole CRUD surface of the immutable config entity is exactly create + read + list: the read echoes every stored field, the reverse-lookup filter prerequisite_milestone_id returns only the dependent milestone, and the unfiltered list is ordered by sequence_index ASC with a complete pagination envelope."
        test_recipe:
          setup: ["Two Milestones exist — IND_M1 at sequence_index 1 with no prerequisite, and IND_M2 at sequence_index 2 whose prerequisite_milestone_id is IND_M1. No novice teachers exist. The logical clock is at its startup default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /milestones"
              payload: { code: "IND_M1", title: "Orientation complete", sequence_index: 1, required_contact_minutes: 0, required_observation_cycles: 0, required_credited_seminars: 0, license_stage_unlocked: "PROVISIONAL", gates_license_recommendation: false }
              as: ProgramAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /milestones"
              payload: { code: "IND_M2", title: "Mid-year review complete", sequence_index: 2, required_contact_minutes: 300, required_observation_cycles: 1, required_credited_seminars: 1, license_stage_unlocked: "CLEAR", gates_license_recommendation: true, prerequisite_milestone_id: "${m1_id}" }
              as: ProgramAdmin
              captures: { m2_id: $.data.id }
          trigger:
            - call: "GET /milestones/${m2_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /milestones?prerequisite_milestone_id=${m1_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /milestones"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the read returns HTTP 200 with data.code == \"IND_M2\", data.sequence_index == 2, data.required_contact_minutes == 300, data.required_observation_cycles == 1, data.required_credited_seminars == 1, data.license_stage_unlocked == \"CLEAR\", data.gates_license_recommendation == true and data.prerequisite_milestone_id == \"${m1_id}\""
            - "the read response carries no version field — Milestone is immutable configuration"
            - "the filtered list returns total_count == 1 and data[0].id == \"${m2_id}\" — the reverse lookup of prerequisite_milestone_id"
            - "the unfiltered list returns total_count == 2, has_more == false, limit == 10, offset == 0 and data[0].id == \"${m1_id}\" — sequence_index ASC"
            - "every response carries meta.api_request_id and meta.api_request_timestamp with response_type \"object\" for the read and \"array\" for both lists"

      - name: match_reject_action_releases_novice_and_blocks_repeat
