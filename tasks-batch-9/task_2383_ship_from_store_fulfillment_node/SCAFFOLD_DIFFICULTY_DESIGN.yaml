  - rule_id: resource_temporal_overlap
    instances:
      - name: pickup_windows_conflict_under_a_thirty_minute_symmetric_buffer
        grounds:
          - calculations.carrier_pickup_window_conflict
          - validations.ERR_PICKUP_WINDOW_OVERLAP
          - state_machines.CarrierPickup.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Resource 1 = one store's carrier-pickup calendar under a PAIRWISE symmetric 30-minute
          dead band: a gap of 20 minutes on the right and 10 minutes on the left both conflict,
          a gap of exactly 30 minutes on either side does not, and a CANCELLED window drops out
          of the comparison set entirely so a new pickup may be scheduled inside it.
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; store S1 exists with no orders and no inventory."
            - "S1 already has pickup pk1 for 16:00Z-18:00Z with parcel_capacity 5 and status SCHEDULED."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "GRD", window_start_utc: "2026-08-03T16:00:00Z", window_end_utc: "2026-08-03T18:00:00Z", parcel_capacity: 5 }
              as: CarrierCoordinator
              captures: { pk1: "$.data.id" }
          trigger:
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "EXP", window_start_utc: "2026-08-03T18:20:00Z", window_end_utc: "2026-08-03T19:00:00Z", parcel_capacity: 5 }
              as: CarrierCoordinator
              captures: { err_gap20: "$.data.error_id" }
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "EXP", window_start_utc: "2026-08-03T15:35:00Z", window_end_utc: "2026-08-03T15:50:00Z", parcel_capacity: 5 }
              as: CarrierCoordinator
              captures: { err_gap10: "$.data.error_id" }
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "EXP", window_start_utc: "2026-08-03T18:30:00Z", window_end_utc: "2026-08-03T19:30:00Z", parcel_capacity: 5 }
              as: CarrierCoordinator
              captures: { pk3: "$.data.id" }
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "EXP", window_start_utc: "2026-08-03T15:00:00Z", window_end_utc: "2026-08-03T15:30:00Z", parcel_capacity: 5 }
              as: CarrierCoordinator
              captures: { pk4: "$.data.id" }
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "GRD", window_start_utc: "2026-08-03T19:00:00Z", window_end_utc: "2026-08-03T20:00:00Z", parcel_capacity: 5 }
              as: CarrierCoordinator
              captures: { err_true_overlap: "$.data.error_id" }
            - call: "POST /fulfillment-network/carrier-pickups/${pk1}/cancel"
              payload: {}
              as: CarrierCoordinator
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "GRD", window_start_utc: "2026-08-03T17:00:00Z", window_end_utc: "2026-08-03T17:30:00Z", parcel_capacity: 5 }
              as: CarrierCoordinator
              captures: { pk5: "$.data.id" }
            - call: "GET /fulfillment-network/carrier-pickups"
              payload: { store_id: "${s1}", status: "SCHEDULED" }
              as: CarrierCoordinator
          assert:
            - "18:20Z-19:00Z leaves only a 20-minute gap after pk1 and returns HTTP 409 with ${err_gap20} == ERR_PICKUP_WINDOW_OVERLAP"
            - "15:35Z-15:50Z leaves only a 10-minute gap before pk1 and returns HTTP 409 with ${err_gap10} == ERR_PICKUP_WINDOW_OVERLAP"
            - "18:30Z-19:30Z leaves exactly 30 minutes after pk1 and is created with HTTP 201"
            - "15:00Z-15:30Z leaves exactly 30 minutes before pk1 and is created with HTTP 201"
            - "19:00Z-20:00Z truly overlaps pk3 and returns HTTP 409 with ${err_true_overlap} == ERR_PICKUP_WINDOW_OVERLAP"
            - "17:00Z-17:30Z sits inside the now CANCELLED pk1 and is created with HTTP 201, because CANCELLED windows leave the comparison set"
            - "CarrierPickup.${pk1}.status == CANCELLED"
            - "CarrierPickup.${pk1}.reserved_parcels == 0"
            - "CarrierPickup.${pk3}.status == SCHEDULED"
            - "CarrierPickup.${pk3}.window_start_utc == 2026-08-03T18:30:00Z"
            - "CarrierPickup.${pk4}.status == SCHEDULED"
            - "CarrierPickup.${pk4}.window_end_utc == 2026-08-03T15:30:00Z"
            - "CarrierPickup.${pk5}.status == SCHEDULED"
            - "GET /carrier-pickups?store_id=${s1}&status=SCHEDULED returns exactly 3 rows (pk4, pk5, pk3) with total_count 3"

      - name: concurrent_pick_labor_counts_only_overlapping_pick_intervals
        grounds:
          - calculations.concurrent_pick_labor_load
          - validations.ERR_LABOR_WINDOW_OVERSUBSCRIBED
          - entities.FulfillmentAssignment.fields.pick_deadline_utc
        distinguishing_aspect: |
          Resource 2 = one node's in-progress pick labour minutes over HALF-OPEN
          [accepted_at, pick_deadline_utc) intervals with zero buffer (a different resource and
          a different interval semantics from the buffered pickup calendar): an ACCEPTED
          assignment whose pick deadline has already elapsed contributes nothing, so a later
          accept sees 18.00 instead of 36.00 and succeeds, while two genuinely overlapping picks
          do stack and the third overlapping accept is refused at 39.00 against the cap of 30.
