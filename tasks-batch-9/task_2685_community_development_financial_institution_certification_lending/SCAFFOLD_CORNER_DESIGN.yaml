      - name: stale_expected_loan_version_rejected_before_the_prior_report_is_superseded
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[impact-report-supersede-stale-loan]
          - errors.ERR_STALE_LOAN_VERSION
          - endpoints[POST /cdfi/loans/{loan_id}/impact-reports]
        distinguishing_aspect: |
          Filing the first report itself advances Loan.version, so the client's own successful
          write invalidates its own token: replaying that token for the superseding report is 412
          ERR_STALE_LOAN_VERSION, and the rejected attempt must not supersede the first report -
          it is still SUBMITTED, not SUPERSEDED, and no second row exists. Retrying with the
          refreshed version then supersedes it.
        test_recipe:
          setup:
            - "One institution with one product, one borrower and one loan at version 1 in SCREENING."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000054", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
