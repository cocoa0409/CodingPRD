# =====================================================================
# SCAFFOLD_CORNER_DESIGN.yaml  --  section 1.9 of the scaffold for
# task 2847, Orthopedic Practice In-Office DME Dispensing & Bracing.
#
# Breadth probe. Every `section:` value below is one of the nine sections
# of references/claim-extraction-guide.md and every `claim_type:` is a row
# of that section's table. Depth (the nine hard reasoning rules) lives in
# the sibling SCAFFOLD_DIFFICULTY_DESIGN.yaml; corners already asserted
# there appear here as `excluded_because:` stubs with no test_recipe.
#
# Every chain below starts from an empty database. The logical clock
# starts at 2026-08-01T00:00:00Z and is only moved through
# POST /_clock/set_current_utc. Every request carries X-User-Role (the
# `as:` value) and a non-empty X-User-Id; for the two entity-backed roles
# (OrthoPhysician -> Physician, DmeFitter -> Fitter) that X-User-Id must be
# the row's own id and is shown explicitly as `as_user_id:`.
# =====================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: corner_clinic_creation_returns_every_declared_field
        claim_type: Creation
        grounds:
          - entities.Clinic
          - endpoints[POST /dme/clinics]
        distinguishing_aspect: "A POST /dme/clinics with all six input fields returns 201 and a body carrying every declared Clinic field, including the computed dispensing_status and stockout_par_level_count and the four common fields."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { clock_now: $.data.current_utc }
          trigger:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE", "HAND"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id, clinic_status: $.data.dispensing_status, clinic_count: $.data.stockout_par_level_count, clinic_version: $.data.version }
          assert:
            - "HTTP status is 201"
            - "${clock_now} == 2026-08-01T00:00:00Z"
            - "Clinic.${clinic_id}.name == North Ortho and state_code == OH and accreditation_body == ABC"
            - "Clinic.${clinic_id}.accreditation_expires_on == 2027-06-30 and ioas_supervision_level == DIRECT"
            - "Clinic.${clinic_id}.dispensing_specialties == [SPINE, HAND] (order preserved)"
            - "${clinic_status} == ACTIVE and ${clinic_count} == 0"
            - "${clinic_version} == 1 and created_at, updated_at and id are all present"
            - "the response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: corner_supplier_retrieval_returns_stored_representation
        claim_type: Retrieval
        grounds:
          - entities.Supplier
          - endpoints[GET /dme/suppliers/{id}]
        distinguishing_aspect: "GET /dme/suppliers/{id} returns exactly what POST /dme/suppliers stored, including the defaulted turnaround_score of 100 and accepted_fab_order_count of 0."
        test_recipe:
          setup:
            - "one supplier registered with a 12-day promised turnaround"
          setup_api_calls:
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "BOC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 12, dmepos_standards_attested: true, custom_fab_capable: true, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
          trigger:
            - call: "GET /dme/suppliers/${supplier_id}"
              payload: {}
              as: InventoryManager
              captures: { sup_name: $.data.name, sup_body: $.data.accreditation_body, sup_days: $.data.promised_turnaround_days, sup_score: $.data.turnaround_score, sup_accepted: $.data.accepted_fab_order_count }
          assert:
            - "HTTP status is 200"
            - "${sup_name} == Bracewell Ortho and ${sup_body} == BOC and ${sup_days} == 12"
            - "${sup_score} == 100 and ${sup_accepted} == 0"

      - name: corner_par_level_listing_filters_and_paginates
        claim_type: Listing
        grounds:
          - entities.ClinicParLevel
          - endpoints[GET /dme/par-levels]
        distinguishing_aspect: "GET /dme/par-levels honours the stock_posture filter together with limit and offset, and reports total_count over the FILTERED set with has_more computed from limit + offset."
        test_recipe:
          setup:
            - "one clinic licensed for SPINE with three shelves: two never stocked (STOCKOUT) and one stocked to 10 units (OK)"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: false, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0650", description: "LSO brace, prefabricated", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "LSO_BRACE", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 20600, cash_price_cents: 11765, unit_cost_cents: 6000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_1_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0464", description: "TLSO brace, prefabricated", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "TLSO_BRACE", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 30000, cash_price_cents: 18000, unit_cost_cents: 9000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_2_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0172", description: "Cervical collar, semi-rigid", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "CERVICAL_COLLAR", reasonable_useful_lifetime_months: 24, allowed_amount_cents: 12000, cash_price_cents: 7000, unit_cost_cents: 3000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_3_id: $.data.id }
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_1_id}", par_min_qty: 4, par_max_qty: 20 }
              as: InventoryManager
              captures: { par_1_id: $.data.id }
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_2_id}", par_min_qty: 4, par_max_qty: 20 }
              as: InventoryManager
              captures: { par_2_id: $.data.id }
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_3_id}", par_min_qty: 4, par_max_qty: 20 }
              as: InventoryManager
              captures: { par_3_id: $.data.id }
            - call: "POST /dme/par-levels/${par_3_id}/stock-receipts"
              payload: { received_qty: 10 }
              as: InventoryManager
          trigger:
            - call: "GET /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", stock_posture: "STOCKOUT", limit: 1, offset: 0 }
              as: InventoryManager
            - call: "GET /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", stock_posture: "STOCKOUT", limit: 1, offset: 1 }
              as: InventoryManager
            - call: "GET /dme/par-levels"
              payload: { clinic_id: "${clinic_id}" }
              as: InventoryManager
          assert:
            - "the first page returns exactly 1 ClinicParLevel, total_count == 2, limit == 1, offset == 0, has_more == true"
            - "the second page returns exactly 1 ClinicParLevel, total_count == 2, offset == 1, has_more == false"
            - "neither STOCKOUT page contains ${par_3_id}"
            - "the unfiltered call returns 3 rows with total_count == 3 and has_more == false (default limit 10 exceeds the row count)"
            - "response_type == array on all three calls"

      - name: corner_unknown_product_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=8]
          - errors[ERR_PRODUCT_NOT_FOUND]
          - endpoints[GET /dme/products/{id}]
        distinguishing_aspect: "GET /dme/products/{id} for a well-formed UUID that was never created returns ERR_PRODUCT_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "GET /dme/products/00000000-0000-4000-8000-0000000000f1"
              payload: {}
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PRODUCT_NOT_FOUND"
            - "HTTP status is 404"
            - "response_type == error and data.message is present"

      - name: corner_par_level_creation_missing_par_min_qty_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /dme/par-levels]
        distinguishing_aspect: "par_min_qty has source input with no default, so omitting it from POST /dme/par-levels returns ERR_INVALID_REQUEST (400) and creates no ClinicParLevel."
        test_recipe:
          setup:
            - "one clinic licensed for SPINE and one SPINE product"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: false, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0650", description: "LSO brace, prefabricated", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "LSO_BRACE", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 20600, cash_price_cents: 11765, unit_cost_cents: 6000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_id}", par_max_qty: 20 }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status is 400"
            - "GET /dme/par-levels?clinic_id=${clinic_id} returns total_count 0"

      - name: corner_supplier_flag_defaults_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Supplier.fields.dmepos_standards_attested
          - entities.Supplier.fields.custom_fab_capable
          - entities.Supplier.fields.quality_hold
          - endpoints[POST /dme/suppliers]
        distinguishing_aspect: "Omitting the three optional boolean flags on POST /dme/suppliers yields dmepos_standards_attested false, custom_fab_capable false and quality_hold false -- not null and not true."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ACHC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 15 }
              as: PracticeAdmin
              captures: { sup_id: $.data.id, sup_attested: $.data.dmepos_standards_attested, sup_custom: $.data.custom_fab_capable, sup_hold: $.data.quality_hold, sup_score: $.data.turnaround_score }
          assert:
            - "${sup_attested} == false and ${sup_custom} == false and ${sup_hold} == false"
            - "${sup_score} == 100 (default score before any accepted fabrication order)"
            - "Supplier.${sup_id}.promised_turnaround_days == 15"

      - name: corner_encounter_service_date_defaults_to_clock_date
        claim_type: Defaults
        grounds:
          - entities.DispenseEncounter.fields.service_date
          - endpoints[POST /dme/encounters]
        distinguishing_aspect: "Omitting service_date on POST /dme/encounters stamps the logical clock's calendar date (2026-08-05 after the clock is moved), proving the default is read from the clock and not from wall time."
        test_recipe:
          setup:
            - "one clinic licensed for SPINE, one SPINE physician, one patient, one SPINE product; the logical clock is moved to 2026-08-05"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Ora Vance", npi: "1700000201", specialty: "SPINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/patients"
              payload: { full_name: "Ida Moss", dob: "1961-03-04", payer_type: "COMMERCIAL", member_id: "CM-1", medicare_beneficiary: false }
              as: PracticeAdmin
              captures: { patient_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: false, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0650", description: "LSO brace, prefabricated", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "LSO_BRACE", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 20600, cash_price_cents: 11765, unit_cost_cents: 6000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T13:45:00Z" }
              as: PracticeAdmin
              captures: { prev_utc: $.data.previous_utc }
          trigger:
            - call: "POST /dme/encounters"
              payload: { clinic_id: "${clinic_id}", patient_id: "${patient_id}", product_id: "${prod_id}", ordering_physician_id: "${phys_id}", quantity: 1 }
              as: PracticeAdmin
              captures: { enc_id: $.data.id, enc_service_date: $.data.service_date, enc_clinical: $.data.clinical_status, enc_financial: $.data.financial_status }
          assert:
            - "${prev_utc} == 2026-08-01T00:00:00Z"
            - "${enc_service_date} == 2026-08-05"
            - "${enc_clinical} == DRAFT and ${enc_financial} == UNVERIFIED"
            - "DispenseEncounter.${enc_id}.compliance_hold == false and hold_reason == null"

      - name: corner_par_level_computed_quantities_are_server_owned_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.ClinicParLevel.fields.available_qty
          - entities.ClinicParLevel.fields.stock_posture
          - entities.ClinicParLevel.fields.on_hand_qty
          - endpoints[POST /dme/par-levels]
        distinguishing_aspect: "available_qty, stock_posture, on_hand_qty and lifetime_received_qty are server-owned: a POST /dme/par-levels body that also carries those keys is created with 0/0/STOCKOUT/0 regardless, and only a stock receipt can move them."
        test_recipe:
          setup:
            - "one clinic licensed for SPINE and one SPINE product"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: false, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0650", description: "LSO brace, prefabricated", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "LSO_BRACE", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 20600, cash_price_cents: 11765, unit_cost_cents: 6000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_id}", par_min_qty: 4, par_max_qty: 20, on_hand_qty: 99, available_qty: 99, stock_posture: "OK", lifetime_received_qty: 99 }
              as: InventoryManager
              captures: { par_id: $.data.id, par_on_hand: $.data.on_hand_qty, par_available: $.data.available_qty, par_posture: $.data.stock_posture, par_lifetime: $.data.lifetime_received_qty }
            - call: "POST /dme/par-levels/${par_id}/stock-receipts"
              payload: { received_qty: 6 }
              as: InventoryManager
              captures: { par_on_hand_2: $.data.on_hand_qty, par_available_2: $.data.available_qty, par_posture_2: $.data.stock_posture }
          assert:
            - "${par_on_hand} == 0 and ${par_available} == 0 and ${par_lifetime} == 0"
            - "${par_posture} == STOCKOUT (the OK value supplied in the body is ignored)"
            - "${par_on_hand_2} == 6 and ${par_available_2} == 6 and ${par_posture_2} == OK"
            - "ClinicParLevel.${par_id}.par_min_qty == 4 and par_max_qty == 20 (the genuine input fields were honoured)"

      - name: corner_encounter_system_fields_are_server_minted_input_ignored
        claim_type: System Fields
        grounds:
          - entities.DispenseEncounter.fields.clinical_status
          - entities.DispenseEncounter.fields.mn_signed_at
          - entities.DispenseEncounter.fields.compliance_hold
          - endpoints[POST /dme/encounters]
        distinguishing_aspect: "id, created_at, updated_at, version and every source-system field of DispenseEncounter (clinical_status, mn_signed_at, compliance_hold, delivered_at) are minted by the server: supplying them in the create body does not change the created row."
        test_recipe:
          setup:
            - "one clinic licensed for SPINE, one SPINE physician, one patient, one SPINE product"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/physicians"
              payload: { full_name: "Ora Vance", npi: "1700000201", specialty: "SPINE", group_member: true, stark_disclosure_on_file: true }
              as: PracticeAdmin
              captures: { phys_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/patients"
              payload: { full_name: "Ida Moss", dob: "1961-03-04", payer_type: "COMMERCIAL", member_id: "CM-1", medicare_beneficiary: false }
              as: PracticeAdmin
              captures: { patient_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Bracewell Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: false, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0650", description: "LSO brace, prefabricated", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "LSO_BRACE", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 20600, cash_price_cents: 11765, unit_cost_cents: 6000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /dme/encounters"
              payload: { clinic_id: "${clinic_id}", patient_id: "${patient_id}", product_id: "${prod_id}", ordering_physician_id: "${phys_id}", quantity: 1, id: "00000000-0000-4000-8000-0000000000aa", version: 47, clinical_status: "DELIVERED", mn_signed_at: "2026-07-01T00:00:00Z", compliance_hold: true, delivered_at: "2026-07-02T00:00:00Z" }
              as: PracticeAdmin
              captures: { enc_id: $.data.id, enc_version: $.data.version, enc_clinical: $.data.clinical_status, enc_mn_signed: $.data.mn_signed_at, enc_hold: $.data.compliance_hold, enc_delivered: $.data.delivered_at }
          assert:
            - "${enc_id} != 00000000-0000-4000-8000-0000000000aa"
            - "${enc_version} == 1 and ${enc_clinical} == DRAFT"
            - "${enc_mn_signed} == null and ${enc_delivered} == null and ${enc_hold} == false"
            - "GET /dme/encounters/00000000-0000-4000-8000-0000000000aa returns ERR_ENCOUNTER_NOT_FOUND with HTTP 404"

      - name: corner_patient_invalid_payer_type_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Patient.fields.payer_type
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /dme/clinics/{id}/patients]
        distinguishing_aspect: "payer_type is constrained to {MEDICARE, MEDICAID, COMMERCIAL, SELF_PAY}, so the value TRICARE returns ERR_INVALID_REQUEST (400) and no Patient row is created."
        test_recipe:
          setup:
            - "one clinic licensed for SPINE"
          setup_api_calls:
            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["SPINE"] }
              as: PracticeAdmin
              captures: { clinic_id: $.data.id }
          trigger:
            - call: "POST /dme/clinics/${clinic_id}/patients"
              payload: { full_name: "Ida Moss", dob: "1961-03-04", payer_type: "TRICARE", member_id: "CM-1", medicare_beneficiary: false }
              as: InsuranceCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status is 400"
            - "GET /dme/clinics/${clinic_id}/patients returns total_count 0"

      - name: corner_coverage_verification_is_immutable_and_append_only
        claim_type: Immutability
        grounds:
          - entities.CoverageVerification
          - entities.CoverageVerification.fields.verification_seq
          - endpoints[GET /dme/encounters/{id}/coverage-verifications]
