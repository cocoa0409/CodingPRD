        claim_type: conditional_action
        grounds: ["state_machines.ScholarshipFund.OPEN_to_CLOSED", "errors[ERR_FUND_NOT_OPEN]"]
        distinguishing_aspect: "Fund close cascade hits only PENDING awards (CANCELLED); creating a new award on a CLOSED fund fails ERR_FUND_NOT_OPEN."
