# =============================================================================
# Task 1931 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 per references/claim-extraction-guide.md.
# Names are unique across this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: publisher_creation_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - "entities.Publisher.fields.payment_terms"
          - "entities.Publisher.fields.status"
          - "entities.Publisher.fields.lifetime_net_micros"
        distinguishing_aspect: "Omitting payment_terms yields SEQUENTIAL_LIABILITY; status starts ACTIVE; computed money counters start at 0; version starts at 1."
        test_recipe:
          setup: ["One publisher already exists (proves defaults are evaluated per-entity, not globally)"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Seed Pub", domain: "seed.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { seed_id: $.data.id } }
          trigger:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com" }, as: ExchangeAdmin, captures: { pub_id: $.data.id, terms: $.data.payment_terms, st: $.data.status, v: $.data.version, open: $.data.accrued_open_micros } }
          assert:
            - "payment_terms == SEQUENTIAL_LIABILITY (default applied)"
            - "status == ACTIVE; version == 1; accrued_open_micros == 0; lifetime_net_micros == 0; id is a server-minted UUID"

      - name: package_create_missing_required_floor_rejected
        claim_type: required_fields
        grounds:
          - "entities.InventoryPackage.fields.base_floor_cpm_micros"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /packages without base_floor_cpm_micros fails with ERR_INVALID_REQUEST (400); nothing is persisted."
        test_recipe:
          setup: ["Publisher P ACTIVE"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
          trigger:
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"] }, as: PublisherManager, as_user_id: "${pub_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400)"

      - name: package_effective_floor_identity_without_window
        claim_type: computed_fields
        grounds:
          - "entities.InventoryPackage.fields.effective_floor_cpm_micros"
          - "calculations.effective_floor"
        distinguishing_aspect: "With no seasonal window the effective floor equals the base floor exactly (neutral 10000 bps multiplier)."
        test_recipe:
          setup: ["Publisher P ACTIVE"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
          trigger:
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 2000000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { eff: $.data.effective_floor_cpm_micros, mult: $.data.current_seasonal_multiplier_bps } }
          assert:
            - "current_seasonal_multiplier_bps == 10000 and effective_floor_cpm_micros == 2000000"

      - name: deal_pg_commitment_required_iff_programmatic_guaranteed
        claim_type: type_constraints
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_PG_COMMITMENT_MISMATCH]"
          - "entities.Deal.fields.remaining_committed_impressions"
        distinguishing_aspect: "committed_impressions is forbidden on PMP_STANDARD and required > 0 on PROGRAMMATIC_GUARANTEED; on PG creation remaining == committed."
        test_recipe:
          setup: ["Publisher P with ACTIVE package; partner DP ACTIVE"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
          trigger:
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z", committed_impressions: 1000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { err: $.data.error_id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PROGRAMMATIC_GUARANTEED", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z", committed_impressions: 5000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pg_id: $.data.id, pg_remaining: $.data.remaining_committed_impressions, pg_excl: $.data.is_exclusive } }
          assert:
            - "PMP_STANDARD with committed_impressions -> error_id == ERR_PG_COMMITMENT_MISMATCH (422)"
            - "PG creation succeeds: remaining_committed_impressions == 5000 and is_exclusive == true (computed from deal_type)"

      - name: supply_chain_node_hop_index_and_tail_flag
        claim_type: computed_fields
        grounds:
          - "entities.SupplyChainNode.fields.hop_index"
          - "entities.SupplyChainNode.fields.is_tail"
          - "validations[priority=12]"
        distinguishing_aspect: "Head node gets hop_index 0 and is_tail true; appending flips the parent's is_tail to false and assigns hop_index 1 — a self-referential chain invariant."
        test_recipe:
          setup: ["Publisher P with ACTIVE package"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
          trigger:
            - { call: "POST /supply-chain-nodes", payload: { package_id: "${pkg_id}", seller_domain: "ssp1.com", fee_bps: 1000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { n0: $.data.id, n0_hop: $.data.hop_index, n0_tail: $.data.is_tail } }
            - { call: "POST /supply-chain-nodes", payload: { package_id: "${pkg_id}", seller_domain: "ssp2.com", fee_bps: 500, parent_node_id: "${n0}" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { n1_hop: $.data.hop_index } }
            - { call: "GET /supply-chain-nodes?package_id=${pkg_id}", payload: {}, as: ExchangeAdmin, captures: { n0_tail_after: "$.data[0].is_tail", n1_tail: "$.data[1].is_tail" } }
          assert:
            - "Head node: hop_index == 0 and is_tail == true at creation"
            - "After append: head is_tail == false, child hop_index == 1 and is_tail == true"

      - name: auction_record_is_append_only_without_version
        claim_type: immutability
        grounds:
          - "entities.AuctionRecord"
        distinguishing_aspect: "AuctionRecord has common_fields: false — its read model carries id and created_at but no version/updated_at; correction is only via the void action endpoint, never an update."
        test_recipe:
          setup: ["One filled auction on an approved FIRST_PRICE deal (floor 500,000 package and deal; bid 1,000,000 x 1000 imps)"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 1000, creative_domain: "a.com" } ] }, as: DemandSide, captures: { rec_id: $.data.auction_record.id } }
          trigger:
            - { call: "GET /auction-records/${rec_id}", payload: {}, as: ExchangeAdmin, captures: { rec: $.data } }
          assert:
            - "Response contains id and created_at but no version or updated_at keys (append-only event entity)"
            - "created_at == 2026-08-01T00:00:00.000Z (logical clock default, three fractional digits)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: deal_submit_from_active_is_invalid_transition
        claim_type: invalid_transition
        grounds:
          - "state_machines.Deal"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "From ACTIVE only pause/renegotiate/expire are valid; submit on an ACTIVE deal fails with ERR_INVALID_STATE and changes nothing."
        test_recipe:
          setup: ["APPROVED ACTIVE deal D on publisher P's package"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
          trigger:
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (409); deal remains ACTIVE"

      - name: deal_expiry_is_terminal_via_clock_sweep
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Deal.ACTIVE_to_EXPIRED"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "When the logical clock passes end_at, the next touch expires the deal; from EXPIRED every action (pause, resume, renegotiate) is rejected."
        test_recipe:
          setup: ["APPROVED ACTIVE deal D with flight [2026-08-01, 2026-08-10)"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-10T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ExchangeAdmin }
            - { call: "GET /deals/${deal_id}", payload: {}, as: ExchangeAdmin, captures: { st: $.data.status } }
            - { call: "POST /deals/${deal_id}/pause", payload: {}, as: ExchangeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "After the clock reaches end_at exactly (half-open flight), GET reports status == EXPIRED"
            - "pause on EXPIRED -> error_id == ERR_INVALID_STATE (409)"

      - name: paused_deal_resume_after_window_closed
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Deal.PAUSED_to_ACTIVE"
          - "errors[ERR_DEAL_WINDOW_CLOSED]"
        distinguishing_aspect: "The expiry sweep only touches ACTIVE deals, so a PAUSED deal outlives its flight; resume then fails with ERR_DEAL_WINDOW_CLOSED instead of expiring it."
        test_recipe:
          setup: ["Deal D approved ACTIVE with flight [2026-08-01, 2026-08-10), then PAUSED; clock moved to 2026-08-15"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-10T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /deals/${deal_id}/pause", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: ExchangeAdmin }
          trigger:
            - { call: "POST /deals/${deal_id}/resume", payload: {}, as: PublisherManager, as_user_id: "${pub_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DEAL_WINDOW_CLOSED (409); deal stays PAUSED (the sweep never expires PAUSED deals)"

      - name: publisher_resume_does_not_resume_deals
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Publisher.SUSPENDED_to_ACTIVE"
          - "state_machines.InventoryPackage.PAUSED_to_ACTIVE"
          - "state_machines.Deal.PAUSED_to_ACTIVE"
        distinguishing_aspect: "The resume cascade is asymmetric: it restores packages but deliberately leaves deals PAUSED; each deal needs its own resume (which re-pins its approved floor)."
        test_recipe:
          setup: ["Publisher suspended (publisher SUSPENDED, package PAUSED, deal PAUSED) then resumed"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /publishers/${pub_id}/suspend", payload: {}, as: ExchangeAdmin }
          trigger:
            - { call: "POST /publishers/${pub_id}/resume", payload: {}, as: ExchangeAdmin }
            - { call: "GET /packages/${pkg_id}", payload: {}, as: ExchangeAdmin, captures: { pkg_status: $.data.status } }
            - { call: "GET /deals/${deal_id}", payload: {}, as: ExchangeAdmin, captures: { deal_status: $.data.status } }
          assert:
            - "Publisher ACTIVE and package ACTIVE after resume"
            - "Deal remains PAUSED (resume cascade deliberately stops at packages)"

      - name: blocklist_double_lift_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.BlocklistEntry.ACTIVE_to_LIFTED"
          - "errors[ERR_ENTRY_ALREADY_LIFTED]"
        distinguishing_aspect: "Lifting an entry is one-way; a second lift fails with ERR_ENTRY_ALREADY_LIFTED and the entry stays LIFTED."
        test_recipe:
          setup: ["One ACTIVE EXCHANGE-scope ADVERTISER_DOMAIN entry"]
          setup_api_calls:
            - { call: "POST /blocklist-entries", payload: { scope: "EXCHANGE", rule_type: "ADVERTISER_DOMAIN", value: "evil.com" }, as: ExchangeAdmin, captures: { entry_id: $.data.id } }
          trigger:
            - { call: "POST /blocklist-entries/${entry_id}/lift", payload: {}, as: ExchangeAdmin, captures: { st: $.data.status } }
            - { call: "POST /blocklist-entries/${entry_id}/lift", payload: {}, as: ExchangeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "First lift: status == LIFTED"
            - "Second lift: error_id == ERR_ENTRY_ALREADY_LIFTED (409)"

      - name: report_resolve_twice_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.ReconciliationReport"
          - "errors[ERR_REPORT_ALREADY_TERMINAL]"
        distinguishing_aspect: "RESOLVED is terminal: acknowledge/dispute/resolve on a RESOLVED report all fail with ERR_REPORT_ALREADY_TERMINAL."
        test_recipe:
          setup: ["Deal D with one confirmed 500-imp auction; report R (0.000% discrepancy, OPEN) resolved ACCEPT_SSP"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
            - { call: "POST /deals/${deal_id}/approve", payload: {}, as: ExchangeAdmin }
            - { call: "POST /auctions/execute", payload: { publisher_id: "${pub_id}", bids: [ { bid_cpm_micros: 1000000, impression_count: 500, creative_domain: "a.com" } ] }, as: DemandSide, captures: { rec_id: $.data.auction_record.id } }
            - { call: "POST /auction-records/${rec_id}/confirm-billing", payload: {}, as: DemandSide }
            - { call: "POST /reconciliation-reports", payload: { deal_id: "${deal_id}", period_start: "2026-08-01", period_end: "2026-08-02" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { rep_id: $.data.id } }
            - { call: "POST /reconciliation-reports/${rep_id}/resolve", payload: { resolution_type: "ACCEPT_SSP" }, as: ExchangeAdmin }
          trigger:
            - { call: "POST /reconciliation-reports/${rep_id}/resolve", payload: { resolution_type: "ACCEPT_DSP" }, as: FinanceOfficer, as_user_id: "fin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REPORT_ALREADY_TERMINAL (409); report remains RESOLVED with resolution_type ACCEPT_SSP"

      - name: batch_reject_deletes_lines_and_unblocks_period
        claim_type: side_effect_execution
        grounds:
          - "state_machines.PayoutBatch.PENDING_APPROVAL_to_DRAFT"
          - "validations[priority=11]"
        distinguishing_aspect: "Reject is a compensating transition: generated lines are deleted, aggregates reset to 0, and the freed period accepts a fresh submit (revision loop DRAFT->PENDING_APPROVAL->DRAFT)."
        test_recipe:
          setup: ["GUARANTEED publisher with one filled auction; batch submitted (1 ELIGIBLE line, payable 850,000)"]
          setup_api_calls:
            - { call: "POST /publishers", payload: { name: "Pub", domain: "p.com", payment_terms: "GUARANTEED" }, as: ExchangeAdmin, captures: { pub_id: $.data.id } }
            - { call: "POST /demand-partners", payload: { name: "DP", seat_id: "seat-1", max_qps: 100, daily_cap_micros: 100000000 }, as: ExchangeAdmin, captures: { dp_id: $.data.id } }
            - { call: "POST /packages", payload: { name: "Pkg", ad_format: "DISPLAY", category_tags: ["IAB1"], base_floor_cpm_micros: 500000 }, as: PublisherManager, as_user_id: "${pub_id}", captures: { pkg_id: $.data.id } }
            - { call: "POST /deals", payload: { package_id: "${pkg_id}", demand_partner_id: "${dp_id}", deal_type: "PMP_STANDARD", auction_type: "FIRST_PRICE", floor_cpm_micros: 500000, start_at: "2026-08-01T00:00:00Z", end_at: "2026-12-31T00:00:00Z" }, as: PublisherManager, as_user_id: "${pub_id}", captures: { deal_id: $.data.id } }
            - { call: "POST /deals/${deal_id}/submit", payload: {}, as: PublisherManager, as_user_id: "${pub_id}" }
