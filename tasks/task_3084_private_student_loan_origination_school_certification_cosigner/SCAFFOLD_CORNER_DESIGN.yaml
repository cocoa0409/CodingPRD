          - entities.LoanApplication.fields.certified_limit_cents
        distinguishing_aspect: "With a 1210000 ceiling a single 900000 certification is accepted whole (ceiling_slack), so Loan.certified_amount_cents settles at 900000 and headroom at 900000 - the variant that does NOT bind must be true when the total sits below the ceiling."
