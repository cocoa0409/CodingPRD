            - { call: "POST /curriculum/terms", payload: { term_code: "2027SP", academic_year: "2026-2027", sequence_index: 2, classes_start_date: "2027-01-16", classes_end_date: "2027-05-10", proposal_freeze_at: "2027-02-01T00:00:00Z", catalog_freeze_at: "2027-05-20T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t2: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "CS", course_number: "301", title: "Legacy", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["legacy"], owning_department_id: "${dept_cs}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { course_c: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "DEACTIVATION", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t2}", target_course_id: "${course_c}", declared_remaining_cohorts: 1, justification: "retire" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
            - { call: "POST /curriculum/proposals/${prop}/teach-out-plan", payload: { enrolled_cohort_count: 1, cohort_sizes: [7], last_enrolled_term_id: "${t1}" }, as: FacultyProposer, as_user_id: "fac-001", captures: { plan: $.data.id } }
            - { call: "POST /curriculum/teach-out-plans/${plan}/commit", payload: {}, as: DepartmentChair, as_user_id: "${dept_cs}" }
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: DepartmentChair, as_user_id: "${dept_cs}" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: CurriculumCommittee, as_user_id: "cc-1" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: FacultySenate, as_user_id: "sen-1" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "NOTIFY" }, as: Registrar, as_user_id: "reg-1" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE", effective_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1" }
            - { call: "POST /curriculum/_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: Registrar, as_user_id: "reg-1" }
            - { call: "POST /curriculum/terms/${t1}/freeze-proposals", payload: {}, as: Registrar, as_user_id: "reg-1" }
          trigger:
            - { call: "POST /curriculum/teach-out-plans/${plan}/complete", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { early_err: $.data.error_id } }
            - { call: "POST /curriculum/proposals/${prop}/activate", payload: {}, as: Registrar, as_user_id: "reg-1" }
            - { call: "GET /curriculum/courses/${course_c}", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { c_mid: $.data.status } }
            - { call: "POST /curriculum/teach-out-plans/${plan}/complete", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { plan_final: $.data.status } }
            - { call: "GET /curriculum/courses/${course_c}", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { c_final: $.data.status } }
          assert:
            - "captured early_err == ERR_INVALID_STATE (plan COMMITTED, not IN_PROGRESS: completion gated behind proposal activation)"
            - "captured c_mid == DEACTIVATING (activation alone never retires the course — only plan completion can)"
            - "captured plan_final == COMPLETE"
            - "captured c_final == INACTIVE (cross-entity cascade fired only from the plan's COMPLETE transition)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: term_half_open_adjacency_allowed
        grounds:
          - validations[priority=18]
          - entities.Term.fields.classes_end_date
        distinguishing_aspect: |
          Interval semantics = half-open [start, end) on the Term resource: a new term
          starting exactly on the incumbent's exclusive end (2026-12-15) is adjacency, not
          overlap, and is accepted; starting one day earlier (2026-12-14) is a true
          intersection and rejected with ERR_TERM_DATE_OVERLAP.
        test_recipe:
          setup:
            - "T1 occupies [2026-08-24, 2026-12-15) with sequence_index 1"
          setup_api_calls:
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /curriculum/terms", payload: { term_code: "2027SP", academic_year: "2026-2027", sequence_index: 2, classes_start_date: "2026-12-15", classes_end_date: "2027-05-10", proposal_freeze_at: "2027-02-01T00:00:00Z", catalog_freeze_at: "2027-05-20T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t_adj: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2027WI", academic_year: "2026-2027", sequence_index: 3, classes_start_date: "2026-12-14", classes_end_date: "2027-01-15", proposal_freeze_at: "2026-12-01T00:00:00Z", catalog_freeze_at: "2027-01-05T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { err: $.data.error_id } }
          assert:
            - "adjacent term created (captured t_adj is a UUID): start == incumbent end is NOT an overlap under half-open semantics"
            - "captured err == ERR_TERM_DATE_OVERLAP for the 2026-12-14 start (one day into the occupied interval)"
      - name: edition_closed_interval_contiguity_required
        grounds:
          - validations[priority=20]
          - entities.CatalogEdition.fields.year_end_date
        distinguishing_aspect: |
          Different resource (CatalogEdition) with different interval semantics — CLOSED
          [start, end] plus mandatory day-after contiguity: sharing a single boundary day
          (2027-07-31) IS an overlap, a one-day gap (start 2027-08-02) is equally a
          conflict, and only exact day-after adjacency (2027-08-01) is accepted.
        test_recipe:
          setup:
            - "E1 exists: [2026-08-01, 2027-07-31] closed, AY 2026-2027, DRAFT"
          setup_api_calls:
            - { call: "POST /curriculum/editions", payload: { edition_label: "2026-2027 Catalog", academic_year: "2026-2027", year_start_date: "2026-08-01", year_end_date: "2027-07-31" }, as: Registrar, as_user_id: "reg-1", captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /curriculum/editions", payload: { edition_label: "Overlap attempt", academic_year: "2027-2028", year_start_date: "2027-07-31", year_end_date: "2028-07-30" }, as: Registrar, as_user_id: "reg-1", captures: { err_overlap: $.data.error_id } }
            - { call: "POST /curriculum/editions", payload: { edition_label: "Gap attempt", academic_year: "2027-2028", year_start_date: "2027-08-02", year_end_date: "2028-07-31" }, as: Registrar, as_user_id: "reg-1", captures: { err_gap: $.data.error_id } }
            - { call: "POST /curriculum/editions", payload: { edition_label: "2027-2028 Catalog", academic_year: "2027-2028", year_start_date: "2027-08-01", year_end_date: "2028-07-31" }, as: Registrar, as_user_id: "reg-1", captures: { e2: $.data.id } }
          assert:
            - "captured err_overlap == ERR_EDITION_WINDOW_CONFLICT (closed interval: one shared day is an overlap)"
            - "captured err_gap == ERR_EDITION_WINDOW_CONFLICT (gap of one day breaks mandatory contiguity)"
            - "captured e2 is a UUID (exact day-after start accepted)"

  - rule_id: compensating_invariant
    instances:
      - name: course_number_hold_release_conservation
        grounds:
          - state_machines.Proposal.DRAFT_to_DEPT_REVIEW
          - state_machines.Proposal.DEPT_REVIEW_to_WITHDRAWN
          - validations[priority=17]
        distinguishing_aspect: |
          Conserved quantity = available course-number pool for a subject: submit holds
          (CS, 499) and withdraw releases it, so hold-then-release leaves the pool exactly
          unchanged — proven by a second proposal for the same number being rejected while
          held (ERR_COURSE_NUMBER_HELD) and accepted after the release.
        test_recipe:
          setup:
            - "Department CS; term T1 OPEN; proposals P1 and P2 both NEW_COURSE for (CS, 499); P1 already submitted (number held)"
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "499", proposed_title: "P1", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["x"], justification: "first" }, as: FacultyProposer, as_user_id: "fac-001", captures: { p1: $.data.id } }
            - { call: "POST /curriculum/proposals/${p1}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "499", proposed_title: "P2", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["x"], justification: "second" }, as: FacultyProposer, as_user_id: "fac-001", captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /curriculum/proposals/${p2}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001", captures: { blocked_err: $.data.error_id } }
            - { call: "POST /curriculum/proposals/${p1}/withdraw", payload: {}, as: FacultyProposer, as_user_id: "fac-001", captures: { p1_status: $.data.status } }
            - { call: "POST /curriculum/proposals/${p2}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001", captures: { p2_status: $.data.status } }
          assert:
            - "captured blocked_err == ERR_COURSE_NUMBER_HELD (hold active while P1 in DEPT_REVIEW)"
            - "captured p1_status == WITHDRAWN (compensating action releases the hold)"
            - "captured p2_status == DEPT_REVIEW (pool restored: submit + withdraw conserve the available-number set)"
      - name: term_scheduled_count_reassignment_conservation
        grounds:
          - state_machines.Proposal.APPROVED_to_APPROVED
          - entities.Term.fields.scheduled_proposal_count
          - state_machines.Proposal.REGISTRAR_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Conserved quantity = per-term scheduled_proposal_count ledger entries summing to
          the global APPROVED/EFFECTIVE proposal count: REASSIGN_TERM T1->T2 followed by its
          compensation T2->T1 leaves each term's count exactly as before (1 and 0), and the
          sum over terms is invariant at 1 across every step.
        test_recipe:
          setup:
            - "Department CS; terms T1 (seq 1) and T2 (seq 2) OPEN"
            - "NEW_COURSE proposal fully approved with effective term T1 (status APPROVED)"
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2027SP", academic_year: "2026-2027", sequence_index: 2, classes_start_date: "2027-01-16", classes_end_date: "2027-05-10", proposal_freeze_at: "2027-02-01T00:00:00Z", catalog_freeze_at: "2027-05-20T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t2: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "470", proposed_title: "Net", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["x"], justification: "new" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: DepartmentChair, as_user_id: "${dept_cs}" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: CurriculumCommittee, as_user_id: "cc-1" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: FacultySenate, as_user_id: "sen-1" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE", effective_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1" }
            - { call: "GET /curriculum/terms/${t1}", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { t1_n0: $.data.scheduled_proposal_count } }
          trigger:
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "REASSIGN_TERM", effective_term_id: "${t2}" }, as: Registrar, as_user_id: "reg-1", captures: { eff_mid: $.data.effective_term_id } }
            - { call: "GET /curriculum/terms/${t1}", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { t1_mid: $.data.scheduled_proposal_count } }
            - { call: "GET /curriculum/terms/${t2}", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { t2_mid: $.data.scheduled_proposal_count } }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "REASSIGN_TERM", effective_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1" }
            - { call: "GET /curriculum/terms/${t1}", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { t1_end: $.data.scheduled_proposal_count } }
            - { call: "GET /curriculum/terms/${t2}", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { t2_end: $.data.scheduled_proposal_count } }
          assert:
            - "captured t1_n0 == 1 after approval (Registrar APPROVE booked the count)"
            - "captured eff_mid == ${t2} with t1_mid == 0 and t2_mid == 1 (forward move)"
            - "captured t1_end == 1 and t2_end == 0 (compensating move restores both ledgers exactly)"
            - "invariant: t1 + t2 scheduled_proposal_count == 1 at every step (1+0, 0+1, 1+0)"
