# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Podiatry & Foot-Care Practice — 9 Difficulty Rules x 2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Flat /podiatry topology; FK references carried in request bodies.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: procedure_coverage_covered_via_diabetes_vs_denied_frequency
        grounds:
          - calculations.procedure_coverage_decision
          - calculations.encounter_charge_split
          - entities.Procedure.fields.coverage_decision
          - entities.Patient.fields.last_covered_routine_care_date
          - state_machines.Encounter.EXAM_DONE_to_CODED
        distinguishing_aspect: |
          Same routine procedure_kind and same diabetic patient yield COVERED (medicare 5600,
          patient 1400) when gap>=61 days vs DENIED_FREQUENCY (medicare 0, patient full billed 8000)
          when gap==60 days — divergent results from the temporal-window variant on the Procedure domain.
        test_recipe:
          setup:
            - "Practice with default routine_care_min_interval_days=61, fee_split_medicare_pct=0.80"
            - "Diabetic patient whose last_covered_routine_care_date == 2026-04-01 (established by adjudicating a prior covered routine encounter dated 2026-04-01)"
            - "Two fresh encounters: one with a routine procedure service_date 2026-06-01 (gap 61), one 2026-05-31 (gap 60)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T08:00:00Z" }
              as: PracticeAdmin
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Diabetic", date_of_birth: "1955-03-03", has_diabetes_mellitus: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-04-01T09:00:00Z", scheduled_end: "2026-04-01T09:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc0_id: $.data.id }
            - call: "POST /podiatry/procedures"
              payload: { encounter_id: "${enc0_id}", procedure_kind: "ROUTINE_NAIL_DEBRIDEMENT", service_date: "2026-04-01", billed_cents: 8000, fee_cap_cents: 7000 }
              as: Podiatrist
              as_user_id: "${prov_id}"
            - call: "POST /podiatry/encounters/${enc0_id}/complete-exam"
              payload: {}
              as: Podiatrist
              as_user_id: "${prov_id}"
            - call: "POST /podiatry/encounters/${enc0_id}/code"
              payload: {}
              as: BillingSpecialist
            - call: "POST /podiatry/encounters/${enc0_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /podiatry/encounters/${enc0_id}/adjudicate"
              payload: {}
              as: PayerAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc_cov_id: $.data.id }
            - call: "POST /podiatry/procedures"
              payload: { encounter_id: "${enc_cov_id}", procedure_kind: "ROUTINE_NAIL_DEBRIDEMENT", service_date: "2026-06-01", billed_cents: 8000, fee_cap_cents: 7000 }
              as: Podiatrist
              as_user_id: "${prov_id}"
              captures: { proc_cov_id: $.data.id }
            - call: "POST /podiatry/encounters/${enc_cov_id}/complete-exam"
              payload: {}
              as: Podiatrist
              as_user_id: "${prov_id}"
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-05-31T09:00:00Z", scheduled_end: "2026-05-31T09:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc_den_id: $.data.id }
            - call: "POST /podiatry/procedures"
              payload: { encounter_id: "${enc_den_id}", procedure_kind: "ROUTINE_NAIL_DEBRIDEMENT", service_date: "2026-05-31", billed_cents: 8000, fee_cap_cents: 7000 }
              as: Podiatrist
              as_user_id: "${prov_id}"
              captures: { proc_den_id: $.data.id }
            - call: "POST /podiatry/encounters/${enc_den_id}/complete-exam"
              payload: {}
              as: Podiatrist
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /podiatry/encounters/${enc_cov_id}/code"
              payload: {}
              as: BillingSpecialist
            - call: "POST /podiatry/encounters/${enc_den_id}/code"
              payload: {}
              as: BillingSpecialist
          assert:
            - "Procedure.${proc_cov_id}.coverage_decision == COVERED"
            - "Procedure.${proc_cov_id}.medicare_pays_cents == 5600"
            - "Procedure.${proc_cov_id}.patient_resp_cents == 1400"
            - "Procedure.${proc_den_id}.coverage_decision == DENIED_FREQUENCY"
            - "Procedure.${proc_den_id}.medicare_pays_cents == 0"
            - "Procedure.${proc_den_id}.patient_resp_cents == 8000"

      - name: dme_rental_cap_vs_purchase_full_charge
        grounds:
          - calculations.dme_rental_charge
          - entities.DmeDispense.fields.this_period_charge_cents
          - entities.DmeDispense.fields.acquisition_mode
          - state_machines.PriorAuthorization.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          For a PURCHASE the device line is charged the full purchase_price 30000, while a RENTAL whose
          earlier rentals already paid cumulative 25000 is charged only min(5000, remaining 5000)=5000 — two
          valid algorithms producing different this_period_charge_cents on the DmeDispense domain (distinct from
          the Procedure-coverage dual variant above).
        test_recipe:
          setup:
            - "Diabetic patient with a DME PA authorized 6 units APPROVED, valid 2026-01-01..2026-12-31; an OPEN encounter"
            - "Five prior RENTAL dispenses each charged 5000 so cumulative rental for the device reached 25000 (purchase 30000)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat DME", date_of_birth: "1950-01-01", has_diabetes_mellitus: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /podiatry/prior-authorizations"
              payload: { patient_id: "${pat_id}", service_category: "DME", hcpcs_code: "L4360", authorized_units: 6, valid_from_date: "2026-01-01", valid_through_date: "2026-12-31" }
              as: BillingSpecialist
              captures: { pa_id: $.data.id }
            - call: "POST /podiatry/prior-authorizations/${pa_id}/approve"
              payload: {}
              as: PayerAgent
              captures: { pa_v0: $.data.version }
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T09:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /podiatry/dme-dispenses"
              payload: { prior_authorization_id: "${pa_id}", encounter_id: "${enc_id}", hcpcs_code: "L4360", acquisition_mode: "RENTAL", units: 1, purchase_price_cents: 30000, monthly_rental_cents: 5000, expected_prior_authorization_version: "${pa_v0}" }
              as: FrontDesk
            - call: "GET /podiatry/prior-authorizations/${pa_id}"
              payload: {}
              as: FrontDesk
              captures: { pa_va: $.data.version }
            - call: "POST /podiatry/dme-dispenses"
              payload: { prior_authorization_id: "${pa_id}", encounter_id: "${enc_id}", hcpcs_code: "L4360", acquisition_mode: "RENTAL", units: 1, purchase_price_cents: 30000, monthly_rental_cents: 5000, expected_prior_authorization_version: "${pa_va}" }
              as: FrontDesk
            - call: "GET /podiatry/prior-authorizations/${pa_id}"
              payload: {}
              as: FrontDesk
              captures: { pa_vb: $.data.version }
            - call: "POST /podiatry/dme-dispenses"
              payload: { prior_authorization_id: "${pa_id}", encounter_id: "${enc_id}", hcpcs_code: "L4360", acquisition_mode: "RENTAL", units: 1, purchase_price_cents: 30000, monthly_rental_cents: 5000, expected_prior_authorization_version: "${pa_vb}" }
              as: FrontDesk
            - call: "GET /podiatry/prior-authorizations/${pa_id}"
              payload: {}
              as: FrontDesk
              captures: { pa_vc: $.data.version }
            - call: "POST /podiatry/dme-dispenses"
              payload: { prior_authorization_id: "${pa_id}", encounter_id: "${enc_id}", hcpcs_code: "L4360", acquisition_mode: "RENTAL", units: 1, purchase_price_cents: 30000, monthly_rental_cents: 5000, expected_prior_authorization_version: "${pa_vc}" }
              as: FrontDesk
            - call: "GET /podiatry/prior-authorizations/${pa_id}"
              payload: {}
              as: FrontDesk
              captures: { pa_vd: $.data.version }
            - call: "POST /podiatry/dme-dispenses"
              payload: { prior_authorization_id: "${pa_id}", encounter_id: "${enc_id}", hcpcs_code: "L4360", acquisition_mode: "RENTAL", units: 1, purchase_price_cents: 30000, monthly_rental_cents: 5000, expected_prior_authorization_version: "${pa_vd}" }
              as: FrontDesk
              captures: { fifth_rental_cum: $.data.cumulative_rental_paid_cents }
            - call: "GET /podiatry/prior-authorizations/${pa_id}"
              payload: {}
              as: FrontDesk
              captures: { pa_ve: $.data.version }
          trigger:
            - call: "POST /podiatry/dme-dispenses"
              payload: { prior_authorization_id: "${pa_id}", encounter_id: "${enc_id}", hcpcs_code: "L4360", acquisition_mode: "PURCHASE", units: 1, purchase_price_cents: 30000, expected_prior_authorization_version: "${pa_ve}" }
              as: FrontDesk
              captures: { purchase_dispense_id: $.data.id, purchase_charge: $.data.this_period_charge_cents }
          assert:
            - "DmeDispense.${purchase_dispense_id}.this_period_charge_cents == 30000"
            - "DmeDispense.${purchase_dispense_id}.cumulative_rental_paid_cents == 30000"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: encounter_charge_split_conditional_min_cap_branch
        grounds:
          - calculations.encounter_charge_split
          - calculations.procedure_coverage_decision
          - entities.Encounter.fields.total_patient_resp_cents
          - entities.Encounter.fields.total_medicare_pays_cents
          - state_machines.Encounter.EXAM_DONE_to_CODED
        distinguishing_aspect: |
          Mode (a): >=3 inputs (billed, cap, coverage_decision, fee_split_pct) with non-linear interaction —
          a min(billed,cap) cap, a conditional branch on coverage, and round-half-up on the payer portion only;
          a covered exam (allowed 10000 -> 8000/2000) summed with a DENIED routine line (full billed 8000 to patient)
          gives encounter totals medicare 8000, patient 10000.
        test_recipe:
          setup:
            - "Non-diabetic patient (so the routine line is DENIED_NO_QUALIFYING_DX) under a default practice"
            - "One OPEN encounter with exam billed 12000 cap 10000 and one routine procedure billed 8000 cap 7000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat NoDx", date_of_birth: "1960-02-02", has_diabetes_mellitus: false }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T10:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /podiatry/procedures"
              payload: { encounter_id: "${enc_id}", procedure_kind: "ROUTINE_CALLUS_PARING", service_date: "2026-06-01", billed_cents: 8000, fee_cap_cents: 7000 }
              as: Podiatrist
              as_user_id: "${prov_id}"
              captures: { proc_id: $.data.id }
            - call: "POST /podiatry/encounters/${enc_id}/complete-exam"
              payload: {}
              as: Podiatrist
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /podiatry/encounters/${enc_id}/code"
              payload: {}
              as: BillingSpecialist
              captures: { enc_med: $.data.total_medicare_pays_cents, enc_pat: $.data.total_patient_resp_cents }
          assert:
            - "Procedure.${proc_id}.coverage_decision == DENIED_NO_QUALIFYING_DX"
            - "Encounter.${enc_id}.total_medicare_pays_cents == 8000"
            - "Encounter.${enc_id}.total_patient_resp_cents == 10000"

      - name: lab_order_total_round_per_line_then_sum
        grounds:
          - calculations.lab_order_total
          - entities.LabOrder.fields.total_cents
          - entities.LabOrder.fields.line_items
          - state_machines.OrthoticRx.DRAFT_to_PENDING_PA
        distinguishing_aspect: |
          Mode (b): pinned rounding ORDER — round each line then sum. Two lines each raw 500.5 round to 501,
          summing to 1002, whereas sum-then-round of 1001.0 would give 1001; the scaffold pins per-line-then-sum
          so total_cents == 1002.
        test_recipe:
          setup:
            - "Patient with an APPROVED ORTHOTIC PA (authorized 5 units) and an OrthoticRx in APPROVED state on it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Ortho", date_of_birth: "1962-04-04", has_diabetes_mellitus: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /podiatry/prior-authorizations"
              payload: { patient_id: "${pat_id}", service_category: "ORTHOTIC", hcpcs_code: "L3000", authorized_units: 5, valid_from_date: "2026-01-01", valid_through_date: "2026-12-31" }
              as: BillingSpecialist
              captures: { pa_id: $.data.id }
            - call: "POST /podiatry/prior-authorizations/${pa_id}/approve"
              payload: {}
              as: PayerAgent
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T11:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /podiatry/orthotic-rxs"
              payload: { encounter_id: "${enc_id}", prior_authorization_id: "${pa_id}", l_code: "L3000", foot_side: "LEFT" }
              as: Podiatrist
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /podiatry/orthotic-rxs/${rx_id}/submit-to-payer"
              payload: {}
              as: Podiatrist
              as_user_id: "${prov_id}"
            - call: "POST /podiatry/orthotic-rxs/${rx_id}/payer-decision"
              payload: { decision: "APPROVE" }
              as: PayerAgent
          trigger:
            - call: "POST /podiatry/lab-orders"
              payload: { orthotic_rx_id: "${rx_id}", lab_name: "OrthoLab", line_items: [ { description: "shell A", l_code: "L3000", unit_price_cents: 1001, quantity: 1, discount_pct: 0.5 }, { description: "shell B", l_code: "L3000", unit_price_cents: 1001, quantity: 1, discount_pct: 0.5 } ], units_drawn: 1 }
              as: BillingSpecialist
              captures: { lab_id: $.data.id, lab_total: $.data.total_cents }
          assert:
            - "LabOrder.${lab_id}.total_cents == 1002"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: encounter_recode_revert_cycle
        grounds:
          - state_machines.Encounter.CODED_to_EXAM_DONE
          - state_machines.Encounter.EXAM_DONE_to_CODED
          - entities.Encounter.fields.status
          - entities.Procedure.fields.coverage_decision
        distinguishing_aspect: |
          Encounter exhibits a cycle EXAM_DONE -> CODED -> EXAM_DONE (recode revert), and the recode resets
          every child Procedure coverage_decision back to PENDING and totals to 0 — a non-linear loop on the
          Encounter entity (distinct from the OrthoticRx loop below).
        test_recipe:
          setup:
            - "Diabetic patient, no prior covered routine care (last_covered null), one encounter CODED with a COVERED routine line"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Cycle", date_of_birth: "1958-05-05", has_diabetes_mellitus: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-01T12:00:00Z", scheduled_end: "2026-06-01T12:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /podiatry/procedures"
              payload: { encounter_id: "${enc_id}", procedure_kind: "ROUTINE_NAIL_DEBRIDEMENT", service_date: "2026-06-01", billed_cents: 8000, fee_cap_cents: 7000 }
              as: Podiatrist
              as_user_id: "${prov_id}"
              captures: { proc_id: $.data.id }
            - call: "POST /podiatry/encounters/${enc_id}/complete-exam"
              payload: {}
              as: Podiatrist
              as_user_id: "${prov_id}"
            - call: "POST /podiatry/encounters/${enc_id}/code"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /podiatry/encounters/${enc_id}/recode"
              payload: {}
              as: BillingSpecialist
              captures: { st: $.data.status }
          assert:
            - "Encounter.${enc_id}.status == EXAM_DONE"
            - "Encounter.${enc_id}.total_medicare_pays_cents == 0"
            - "Encounter.${enc_id}.total_patient_resp_cents == 0"
            - "Procedure.${proc_id}.coverage_decision == PENDING"

      - name: orthotic_rx_payer_revision_loop
        grounds:
          - state_machines.OrthoticRx.PENDING_PA_to_DRAFT
          - state_machines.OrthoticRx.DRAFT_to_PENDING_PA
          - entities.OrthoticRx.fields.status
        distinguishing_aspect: |
          OrthoticRx cycles DRAFT -> PENDING_PA -> DRAFT (payer REVISE) -> PENDING_PA again, a revision loop on a
          different entity than the Encounter recode cycle.
        test_recipe:
          setup:
            - "Patient with an APPROVED ORTHOTIC PA and a DRAFT OrthoticRx on an encounter"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /podiatry/practices"
              payload: { name: "Foot Clinic", npi: "1234567890" }
              as: PracticeAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /podiatry/providers"
              payload: { practice_id: "${prac_id}", full_name: "Dr Sole", role_type: "PODIATRIST" }
              as: PracticeAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /podiatry/patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Loop", date_of_birth: "1959-06-06", has_diabetes_mellitus: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /podiatry/prior-authorizations"
              payload: { patient_id: "${pat_id}", service_category: "ORTHOTIC", hcpcs_code: "L3000", authorized_units: 3, valid_from_date: "2026-01-01", valid_through_date: "2026-12-31" }
              as: BillingSpecialist
              captures: { pa_id: $.data.id }
            - call: "POST /podiatry/prior-authorizations/${pa_id}/approve"
              payload: {}
              as: PayerAgent
            - call: "POST /podiatry/encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", scheduled_start: "2026-06-01T13:00:00Z", scheduled_end: "2026-06-01T13:30:00Z", exam_billed_cents: 12000, exam_fee_cap_cents: 10000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /podiatry/orthotic-rxs"
              payload: { encounter_id: "${enc_id}", prior_authorization_id: "${pa_id}", l_code: "L3000", foot_side: "RIGHT" }
              as: Podiatrist
              as_user_id: "${prov_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /podiatry/orthotic-rxs/${rx_id}/submit-to-payer"
              payload: {}
              as: Podiatrist
