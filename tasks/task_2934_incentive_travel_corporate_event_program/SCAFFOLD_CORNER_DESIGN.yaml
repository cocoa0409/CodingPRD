  - name: exposure_projection_computed_read
    claim_type: computed_read
    grounds:
    - §1.5 GET /supplier-contracts/{contract_id}/exposure-projection (output block)
    - §1.3 cancellation_exposure_projection
    - §0.5 dual_variant_calc
    distinguishing_aspect: |
      The exposure projection is the one endpoint in §1.5 whose entire response is derived rather than stored, and the claim for it — that all twelve returned figures match the calculation and that both variant bases are reported side by side even though only one binds — is exactly the §1.8 dual-variant instance. GET /programs/{program_id}/measurement, the other computed read, has its own full recipes in the calculations section of this document.
    excluded_because:
      difficulty_instance: cancellation_exposure_attrition_vs_deposit_forfeiture_divergence
      rationale: |
        That §1.8 instance reads the projection endpoint and asserts contract_value_cents, both basis figures, the pre-relief accumulation, the relief rate, the binding basis and all four room-night fields, which is the whole output contract of this computed read.
  - name: closing_a_program_is_conditional_on_every_taxable_award_being_reported
    claim_type: conditional_action
    grounds:
    - §1.5 POST /programs/{program_id}/advance, GET /programs/{program_id}/measurement
    - §1.2 Program ONSITE -> RECONCILED -> CLOSED
    - §1.4 priority 32 ERR_TAX_REPORTING_INCOMPLETE, priority 10 ERR_PROGRAM_STATE_INVALID
    - §1.3 program_measurement (null branches)
    distinguishing_aspect: |
      The advance endpoint is conditional in two different ways and this instance separates them: asking for a status that is not a declared edge out of the current one is a 409 shape error, while asking for a legal edge whose business precondition is unmet is a 422. CLOSED is the only edge in the scaffold guarded by the state of a whole cohort of other rows — every qualifier with a positive taxable award must be REPORTED — and the guard is strict enough that a DRAFT report is not good enough, which is the detail an implementation is most likely to get wrong. The same recipe also pins the null branches of the measurement read before reconciliation, so the computed endpoint is shown to be conditional on program status too. ERR_TAX_REPORTING_INCOMPLETE is triggered nowhere else in §1.8 or §1.9.
