      - call: POST /bank/documents/${doc}/review
        payload:
          decision: VERIFIED
        as: OpsOfficer
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_FORBIDDEN_FOR_ROLE
  - name: manager_cannot_file_title_change
    claim_type: violation_to_error
    grounds:
    - roles
    - errors[ERR_FORBIDDEN_FOR_ROLE]
    distinguishing_aspect: 'Title-change filing is exclusive to OpsOfficer: POST title-changes
      as OpsManager fails ERR_FORBIDDEN_FOR_ROLE.'
    test_recipe:
      setup:
      - one account
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Mgr M
          owner_tax_id: R3
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 5000
        as: OpsOfficer
        captures:
          acct: $.data.id
          v0: $.data.version
      trigger:
      - call: POST /bank/accounts/${acct}/title-changes
        payload:
          requested_ownership_type: JOINT
          expected_account_version: ${v0}
        as: OpsManager
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_FORBIDDEN_FOR_ROLE
  - name: create_account_missing_auth_header_unauthenticated
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
    distinguishing_aspect: A request without X-User-ID / X-User-Role headers fails
      ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role check.
    test_recipe:
      setup:
      - empty database
      setup_api_calls: []
      trigger:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: NoH N
          owner_tax_id: R4
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 1000
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
      - http status == 400
- section: cross_cutting_layers
  instances:
  - name: occ_stale_version_on_close
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[close-stale-account]
    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: 'OCC on DepositAccount.version: a close carrying the version
      observed before an intervening deposit fails ERR_STALE_VERSION (412); re-reading
      and closing with the fresh version succeeds.'
    test_recipe:
      setup:
      - account created (version v0 observed); a deposit posts advancing the version
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Occ C
          owner_tax_id: R5
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 5000
        as: OpsOfficer
        captures:
          acct: $.data.id
          v0: $.data.version
      - call: POST /bank/accounts/${acct}/transactions
        payload:
          txn_type: DEPOSIT
          amount_cents: 250
          customer_initiated: false
        as: OpsOfficer
      trigger:
      - call: POST /bank/accounts/${acct}/close
        payload:
          expected_account_version: ${v0}
        as: OpsOfficer
        captures:
          err: $.data.error_id
      - call: GET /bank/accounts/${acct}
        payload: {}
        as: OpsManager
        captures:
          v1: $.data.version
      - call: POST /bank/accounts/${acct}/close
        payload:
          expected_account_version: ${v1}
        as: OpsOfficer
        captures:
          lc: $.data.lifecycle_status
          payout: $.data.closure_payout_cents
      assert:
      - ${err} == ERR_STALE_VERSION
      - ${v1} != ${v0}
      - ${lc} == CLOSED
      - ${payout} == 5250
  - name: cascading_side_effects_coverage
    claim_type: cascading_side_effects
    grounds:
    - state_machines.DepositAccount
    - state_machines.DeceasedCase.REPORTED_to_VERIFIED
    excluded_because:
      difficulty_instance: transitive_cascade / dormancy_fee_zero_balance_auto_close_chain
      rationale: N-level cascade chains (sweep-triggered and verify-triggered) are
        asserted end-to-end by the two §1.8 transitive_cascade instances.
  - name: scheduled_conversion_side_effects
    claim_type: scheduled_actions
    grounds:
    - state_machines.ProductConversion.SCHEDULED_to_COMPLETED
    excluded_because:
      difficulty_instance: combinatorial_formula / interest_rounding_per_day_vs_round_at_end
      rationale: Execute at effective_date, product/rate mutation, and settled-interest
        posting are asserted there with computed literals; the not-yet-due rejection
        is covered by err_conversion_not_due_before_effective_date.
  - name: statement_suppression_derived_on_death
    claim_type: derived_field_reconciliation
    grounds:
    - entities.DepositAccount.fields.statement_suppression
    excluded_because:
      difficulty_instance: transitive_cascade / deceased_verify_signer_suspension_chain
      rationale: statement_suppression == DECEASED is asserted there as a cascade
        outcome; DORMANT suppression of a produced cycle is covered by statement_cycle_suppressed_by_dormant_posture.
- section: consistency_model
  instances:
  - name: immediate_consistency_mutation_visible_in_response
    claim_type: immediate
    grounds:
    - complexity_profile
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / account_closure_gated_on_garnishment_state
      rationale: The close response itself carries lifecycle_status CLOSED and closure_payout_cents
        80000 in the same request — immediate consistency is asserted without a re-read.
