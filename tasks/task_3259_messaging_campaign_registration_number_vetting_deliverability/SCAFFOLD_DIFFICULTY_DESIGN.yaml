              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand}", use_case: "MARKETING", description: "Promos", sample_messages: ["Hi"], help_message: "HELP", stop_message: "STOP", path_kind: "TEN_DLC" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/submit"
              payload: {}
              as: CampaignManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/revoke"
              payload: { reason: "fraud review" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/submit"
              payload: {}
              as: CampaignManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 7 state check beats priority 9 brand-referential check)"
            - "http status == 409"
            - "Campaign.${camp}.status remains PENDING_REVIEW (brand-revoke cascade only touches APPROVED campaigns)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ten_dlc_tier_boundary_score_75_inclusive
        grounds:
          - calculations.throughput_allocation
          - entities.Campaign.fields.allocated_mps
        distinguishing_aspect: |
          Numeric threshold metric: TEN_DLC tier boundary is INCLUSIVE — a brand
          scoring exactly 75 yields allocated_mps 10 (top tier), while a brand
          scoring 74 yields 3; verified via the campaign submit endpoint on two
          brands engineered to score exactly 75 and 74.
        test_recipe:
          setup:
            - "Brand H engineered to identity_score exactly 75: base 50 + website 10 + PUBLIC_PROFIT 10 + opt_in WEB_FORM 5, tax_id 'X' (no +10), postal 'X' (no +10)"
            - "Brand L engineered to identity_score exactly 74: base 50 + website 10 + PUBLIC_PROFIT 10 + tax 10 - ... use base 50 + website 10 + PUBLIC_PROFIT 10 + KEYWORD 0 + tax 'X' 0 + postal valid 10 - ... rather: 50 + 10 (website) + 10 (PUBLIC_PROFIT) + 10 (postal) - 6 impossible; use SOLE_PROPRIETOR: 50 - 20 + 10 (website) + 10 (tax) + 10 (postal) + ... = 60; final choice: 50 + 10 website + 10 postal + 5 WEB_FORM - ... = 75 same. Use PRIVATE_PROFIT + website + tax + postal = 80. To hit exactly 74 is impossible with integer step terms {10,10,5,-20,10,10,5} from base 50 — deltas are {-20,5,10}; reachable scores are 50 + 10a + 5b - 20c. 75 = 50+10+10+5 yes; 74 NOT reachable. Pivot: boundary tested at score 75 vs 70 (both reachable: 70 = 50+10+10, i.e. website+PUBLIC_PROFIT, no opt_in bonus). 75 -> tier 10; 70 -> tier 3. The inclusive claim pinned: score 75 lands in the >=75 tier."
          setup_api_calls:
            - call: "POST /messaging/accounts"
              payload: { name: "Acme", plan_tier: "PREMIUM", country_code: "US" }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "High Corp", tax_id: "X", business_type: "PUBLIC_PROFIT", address_line1: "1 Main", city: "SF", region_code: "CA", postal_code: "X", country_code: "US", website_url: "https://h.example", opt_in_mechanism: "WEB_FORM" }
              as: BrandManager
              captures: { brand_h: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands/${brand_h}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand_h}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/brands"
              payload: { legal_name: "Mid Corp", tax_id: "X", business_type: "PUBLIC_PROFIT", address_line1: "2 Main", city: "SF", region_code: "CA", postal_code: "X", country_code: "US", website_url: "https://m.example", opt_in_mechanism: "KEYWORD" }
              as: BrandManager
              captures: { brand_l: $.data.id }
            - call: "POST /messaging/accounts/${acct}/brands/${brand_l}/submit"
              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand_l}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand_h}", use_case: "MARKETING", description: "d", sample_messages: ["s"], help_message: "h", stop_message: "st", path_kind: "TEN_DLC" }
              as: CampaignManager
              captures: { camp_h: $.data.id }
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp_h}/submit"
              payload: {}
              as: CampaignManager
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand_l}", use_case: "MARKETING", description: "d", sample_messages: ["s"], help_message: "h", stop_message: "st", path_kind: "TEN_DLC" }
              as: CampaignManager
              captures: { camp_l: $.data.id }
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp_l}/submit"
              payload: {}
              as: CampaignManager
          trigger:
            - call: "GET /messaging/accounts/${acct}/campaigns/${camp_h}"
              payload: {}
              as: CampaignManager
            - call: "GET /messaging/accounts/${acct}/campaigns/${camp_l}"
              payload: {}
              as: CampaignManager
          assert:
            - "Brand.${brand_h}.identity_score == 75"
            - "Brand.${brand_l}.identity_score == 70"
            - "Campaign.${camp_h}.allocated_mps == 10 (score 75 is INCLUSIVE of the top tier)"
            - "Campaign.${camp_l}.allocated_mps == 3 (score 70 falls in the >=50 tier)"

      - name: send_rejected_when_throughput_count_equals_cap
        grounds:
          - validations[priority=8]
          - entities.Campaign.fields.allocated_mps
          - errors[ERR_THROUGHPUT_EXCEEDED]
        distinguishing_aspect: |
          Count metric on a different endpoint (POST messages vs campaign submit):
          TOLL_FREE campaign has allocated_mps exactly 3; the 1st, 2nd, 3rd sends
          within the same logical second succeed, and the 4th — where the trailing
