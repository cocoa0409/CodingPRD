      - name: posture_change_replaying_a_used_customer_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[customer_posture_change]
          - errors.ERR_STALE_CUSTOMER_VERSION
          - endpoints[POST /ltl/customers/{id}/posture]
        distinguishing_aspect: "A posture write consumes exactly one version: replaying the version that the first CREDIT_HOLD write already consumed returns 412 and leaves the account on CREDIT_HOLD, so the release only lands after a refetch."
        test_recipe:
          setup:
            - "Logical clock 2026-01-10T08:00:00Z; customer ACME created with its version captured; no other state is needed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/customers"
              payload: { account_code: "ACME", name: "Acme Mfg" }
              as: PricingAnalyst
              captures: { cust1: "$.data.id", cust1_v0: "$.data.version" }
          trigger:
            - call: "POST /ltl/customers/${cust1}/posture"
              payload: { billing_posture: "CREDIT_HOLD", expected_customer_version: "${cust1_v0}" }
