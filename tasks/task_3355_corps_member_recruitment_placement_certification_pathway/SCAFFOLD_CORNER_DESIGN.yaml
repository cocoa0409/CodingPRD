scaffold_corner_design:
  - section: entities
    instances:
      - name: region_creation_returns_201_with_server_fields
        claim_type: creation
        grounds:
          - entities.Region.fields.region_code
          - entities.Region.fields.term_start_date
          - entities.Region.fields.max_corps_members
        distinguishing_aspect: |
          POST /corps/regions with every required field returns 201 and echoes all six declared input fields
          plus the four server-minted common fields, and the response body is wrapped in the §1.0 envelope.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: PlatformAdmin
              captures: { r_id: $.data.id, r_v: $.data.version }
          assert:
            - "HTTP status == 201 and response_type == object"
            - "Region.${r_id}.region_code == \"GULF-COAST\" and Region.${r_id}.state_code == \"TX\""
            - "Region.${r_id}.max_corps_members == 10 and Region.${r_id}.base_placement_fee_cents == 300000"
            - "Region.${r_id}.version == 1 and Region.${r_id}.created_at and Region.${r_id}.updated_at are non-null ISO8601 instants"
      - name: region_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.Region.fields.max_corps_members
        distinguishing_aspect: |
          Omitting the required field max_corps_members from POST /corps/regions is refused with
          ERR_INVALID_REQUEST (400) and no Region row is created.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response data.error_id == ERR_INVALID_REQUEST and HTTP status == 400"
            - "GET /corps/partner-districts?region_id=<the would-be region> finds nothing, so no Region row was persisted"
      - name: region_code_and_applicant_email_uniqueness
        claim_type: type_constraints
        grounds:
          - entities.Region.fields.region_code
          - entities.Applicant.fields.email
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          The two fields whose §1.1 constraints declare them unique are both enforced: a second Region with
          region_code GULF-COAST and a second Applicant with email ada@x.edu are each refused with
          ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "One Region with region_code GULF-COAST and one Applicant with email ada@x.edu."
          setup_api_calls:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /corps/applicants"
              payload: { full_name: "Ada Rivera", email: "ada@x.edu", campus_name: "State U", campus_tier: "STANDARD", graduation_year: 2026, leadership_score: 80.0, achievement_score: 85.0, gpa: 4.0 }
              as: SelectionManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast Duplicate", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 5 }
              as: PlatformAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /corps/applicants"
              payload: { full_name: "Ada Rivera Again", email: "ada@x.edu", campus_name: "Other U", campus_tier: "STANDARD", graduation_year: 2026, leadership_score: 70.0, achievement_score: 70.0, gpa: 3.0 }
              as: SelectionManager
              captures: { err2: $.data.error_id }
          assert:
            - "Duplicate region: data.error_id == ERR_INVALID_REQUEST and no second Region is created"
            - "Duplicate applicant: data.error_id == ERR_INVALID_REQUEST and no second Applicant is created"
            - "GET /corps/applications?applicant_id=${a_id} still resolves the original applicant only"
      - name: application_create_with_unknown_applicant_returns_404
        claim_type: parent_relationships
        grounds:
          - validations[priority=7]
          - errors[ERR_APPLICANT_NOT_FOUND]
          - entities.Application.fields.applicant_id
        distinguishing_aspect: |
          An Application whose applicant_id names no persisted Applicant is refused with
          ERR_APPLICANT_NOT_FOUND (404), and existence is validated before any state or business rule runs.
        test_recipe:
          setup:
            - "One Region (TX) exists."
          setup_api_calls:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /corps/applications"
              payload: { applicant_id: "00000000-0000-4000-8000-000000000000", preferred_region_id: "${r_id}", subject_area: "MATH", grade_preference: "HIGH" }
              as: SelectionManager
              captures: { err: $.data.error_id }
          assert:
            - "Response data.error_id == ERR_APPLICANT_NOT_FOUND and HTTP status == 404"
            - "No Application row is created"
      - name: partner_district_create_defaults_and_list_pagination
        claim_type: defaults
        grounds:
          - entities.PartnerDistrict.fields.agreement_status
          - entities.PartnerDistrict.fields.committed_placement_count
          - entities.PartnerDistrict.fields.invoice_amount_cents
          - endpoints."GET /corps/partner-districts"
        distinguishing_aspect: |
          A freshly created PartnerDistrict defaults agreement_status to DRAFT, committed_placement_count to
          0 and invoice_amount_cents to 0, and the filtered list endpoint reports the §1.0 pagination
          fields with total_count and has_more consistent with the page returned.
        test_recipe:
          setup:
            - "One Region (TX) exists."
          setup_api_calls:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /corps/partner-districts"
              payload: { region_id: "${r_id}", name: "Bayou ISD", hiring_commitment_slots: 4, placement_fee_per_member_cents: 350000, unfilled_slot_penalty_cents: 120000, fee_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "GET /corps/partner-districts"
              payload: { region_id: "${r_id}", limit: 1, offset: 0 }
              as: PlatformAdmin
              captures: { total: $.meta.total_count }
          assert:
            - "PartnerDistrict.${d_id}.agreement_status == DRAFT"
            - "PartnerDistrict.${d_id}.committed_placement_count == 0 and invoice_amount_cents == 0"
            - "GET /corps/partner-districts?region_id=${r_id} returns response_type == array with 1 row"
            - "meta.total_count == 1 and meta.has_more == false for limit 1, offset 0"
      - name: application_not_found_returns_404
        claim_type: not_found
        grounds:
          - validations[priority=8]
          - errors[ERR_APPLICATION_NOT_FOUND]
        distinguishing_aspect: |
          GET /corps/applications/{id} with a well-formed id that matches no row returns
          ERR_APPLICATION_NOT_FOUND (404) in the §1.0 error envelope rather than an empty object.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /corps/applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SelectionManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and response_type == error"
            - "data.error_id == ERR_APPLICATION_NOT_FOUND and data.message is a non-empty string"
            - "meta.api_request_id is present on the error envelope"
      - name: corps_member_computed_fields_after_cascade
        claim_type: computed_fields
        grounds:
          - entities.CorpsMember.fields.readiness_score
          - entities.CorpsMember.fields.certification_hours_verified
        excluded_because:
          difficulty_instance: offer_accept_three_hop_cascade
          rationale: "The synthesized CorpsMember's computed fields (certification_hours_verified == 0, readiness_score == 0.0, version == 5) are asserted directly by that §1.8 instance."
      - name: corps_member_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.CorpsMember.fields.service_started_at
          - entities.CorpsMember.fields.leave_started_at
        excluded_because:
          difficulty_instance: leave_return_conserves_verified_hours
          rationale: "leave_started_at being null before the leave and stamped after it is asserted as part of that §1.8 invariant instance."
  - section: state_machines
    instances:
      - name: application_initial_state_is_submitted
        claim_type: initial_state
        grounds:
          - state_machines.Application.initial_state
          - entities.Application.fields.status
        distinguishing_aspect: |
          A newly created Application always starts in SUBMITTED with revision_count 0, regardless of any
          other field supplied at creation.
        test_recipe:
          setup:
            - "One Region (TX) and one Applicant exist."
          setup_api_calls:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /corps/applicants"
              payload: { full_name: "Ada Rivera", email: "ada@x.edu", campus_name: "State U", campus_tier: "STANDARD", graduation_year: 2026, leadership_score: 80.0, achievement_score: 85.0, gpa: 4.0 }
              as: SelectionManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /corps/applications"
              payload: { applicant_id: "${a_id}", preferred_region_id: "${r_id}", subject_area: "MATH", grade_preference: "HIGH" }
              as: SelectionManager
              captures: { app_id: $.data.id, st: $.data.status, rc: $.data.revision_count }
          assert:
            - "Application.${app_id}.status == SUBMITTED"
            - "Application.${app_id}.revision_count == 0 and returned_at is null"
            - "Application.${app_id}.decided_by_user_id is null and reviewed_by_user_id is null"
      - name: application_rejected_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Application.terminal_states
          - errors[ERR_ALREADY_TERMINAL]
          - validations[priority=16]
        distinguishing_aspect: |
          REJECTED is a declared terminal state, so every subsequent transition trigger on that application
          is refused with ERR_ALREADY_TERMINAL and the row's status never leaves REJECTED.
        test_recipe:
          setup:
            - "One Region (TX), one Applicant, and one Application in UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /corps/applicants"
              payload: { full_name: "Ada Rivera", email: "ada@x.edu", campus_name: "State U", campus_tier: "STANDARD", graduation_year: 2026, leadership_score: 80.0, achievement_score: 85.0, gpa: 4.0 }
              as: SelectionManager
              captures: { a_id: $.data.id }
            - call: "POST /corps/applications"
              payload: { applicant_id: "${a_id}", preferred_region_id: "${r_id}", subject_area: "MATH", grade_preference: "HIGH" }
              as: SelectionManager
              captures: { app_id: $.data.id }
            - call: "POST /corps/applications/${app_id}/review"
              payload: { verified_gpa: 4.0 }
              as: SelectionManager
              as_user_id: "sm_reviewer"
            - call: "POST /corps/applications/${app_id}/decision"
              payload: { decision: "REJECT", decision_reason: "no open subject need" }
              as: SelectionManager
              as_user_id: "sm_decider"
          trigger:
            - call: "POST /corps/applications/${app_id}/review"
              payload: { verified_gpa: 4.0 }
              as: SelectionManager
              as_user_id: "sm_reviewer"
              captures: { err1: $.data.error_id }
            - call: "POST /corps/applications/${app_id}/offer"
              payload: {}
              as: SelectionManager
              captures: { err2: $.data.error_id }
          assert:
            - "Application.${app_id}.status == REJECTED after the decision"
            - "Re-review returns data.error_id == ERR_ALREADY_TERMINAL (409)"
            - "Offer returns data.error_id == ERR_ALREADY_TERMINAL (409)"
            - "Application.${app_id}.status is still REJECTED"
      - name: corps_member_exited_blocks_leave_and_placement
        claim_type: invalid_transition
        grounds:
          - state_machines.CorpsMember.ACTIVE_to_EXITED
          - errors[ERR_MEMBER_NOT_ACTIVE]
          - validations[priority=19]
        distinguishing_aspect: |
          Once a CorpsMember is EXITED, the leave trigger no longer has a legal from-state and every
          placement-creating call is refused by the state gate ERR_MEMBER_NOT_ACTIVE.
        test_recipe:
          setup:
            - "One Region (TX), one CertificationPathway, one ACTIVE PartnerDistrict and one PartnerSchool."
            - "One corps member synthesized by offer acceptance, then moved to EXITED."
          setup_api_calls:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /corps/certification-pathways"
              payload: { region_id: "${r_id}", state_code: "TX", certification_track: "ALTERNATIVE_EMERGENCY", required_coursework_hours: 60, required_practice_hours: 120, deadline_days_before_term: 30, coursework_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /corps/partner-districts"
              payload: { region_id: "${r_id}", name: "Bayou ISD", hiring_commitment_slots: 4, placement_fee_per_member_cents: 350000, unfilled_slot_penalty_cents: 120000, fee_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { d_id: $.data.id, d_v1: $.data.version }
            - call: "POST /corps/partner-schools"
              payload: { district_id: "${d_id}", name: "Bayou High", grade_band: "HIGH", subject_needs: ["MATH", "SCIENCE"], classroom_capacity: 1, expected_district_version: "${d_v1}" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /corps/partner-districts/${d_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /corps/applicants"
              payload: { full_name: "Ada Rivera", email: "ada@x.edu", campus_name: "State U", campus_tier: "STANDARD", graduation_year: 2026, leadership_score: 80.0, achievement_score: 85.0, gpa: 4.0 }
              as: SelectionManager
              captures: { a_id: $.data.id }
            - call: "POST /corps/applications"
              payload: { applicant_id: "${a_id}", preferred_region_id: "${r_id}", subject_area: "MATH", grade_preference: "HIGH" }
              as: SelectionManager
              captures: { app_id: $.data.id }
            - call: "POST /corps/applications/${app_id}/review"
              payload: { verified_gpa: 4.0 }
              as: SelectionManager
              as_user_id: "sm_reviewer"
            - call: "POST /corps/applications/${app_id}/decision"
              payload: { decision: "SELECT" }
              as: SelectionManager
              as_user_id: "sm_decider"
            - call: "POST /corps/applications/${app_id}/offer"
              payload: {}
              as: SelectionManager
            - call: "POST /corps/applications/${app_id}/offer/respond"
              payload: { accept: true }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { m_id: $.data.created_corps_member_id }
            - call: "POST /corps/corps-members/${m_id}/exit"
              payload: { exit_reason: "resigned before the term began" }
              as: PlacementCoordinator
            - call: "GET /corps/corps-members/${m_id}"
              payload: {}
              as: PlacementCoordinator
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /corps/corps-members/${m_id}/leave"
              payload: {}
              as: PlacementCoordinator
              captures: { err1: $.data.error_id }
            - call: "POST /corps/placements"
              payload: { corps_member_id: "${m_id}", school_id: "${s_id}", subject_area: "MATH", grade_band: "HIGH", term_start_date: "2026-12-01T00:00:00Z", term_end_date: "2027-05-31T00:00:00Z", expected_corps_member_version: "${m_v}" }
              as: PlacementCoordinator
              captures: { err2: $.data.error_id }
          assert:
            - "CorpsMember.${m_id}.service_status == EXITED"
            - "Leave returns data.error_id == ERR_INVALID_STATE (no ACTIVE from-state)"
            - "Placement create returns data.error_id == ERR_MEMBER_NOT_ACTIVE (409)"
            - "No Placement row exists for the member: GET /corps/corps-members/${m_id}/placements returns an empty array"
      - name: placement_and_milestone_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Placement.initial_state
          - state_machines.CertificationMilestone.initial_state
          - entities.Placement.fields.employment_eligible
          - entities.CertificationMilestone.fields.progress_status
        distinguishing_aspect: |
          A newly created Placement starts MATCHED with employment_eligible false, and every synthesized
          CertificationMilestone starts PENDING with verification_status UNVERIFIED.
        test_recipe:
          setup:
            - "One Region (TX), one CertificationPathway, one ACTIVE PartnerDistrict and one PartnerSchool."
            - "One corps member synthesized by offer acceptance."
          setup_api_calls:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /corps/certification-pathways"
              payload: { region_id: "${r_id}", state_code: "TX", certification_track: "ALTERNATIVE_EMERGENCY", required_coursework_hours: 60, required_practice_hours: 120, deadline_days_before_term: 30, coursework_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /corps/partner-districts"
              payload: { region_id: "${r_id}", name: "Bayou ISD", hiring_commitment_slots: 4, placement_fee_per_member_cents: 350000, unfilled_slot_penalty_cents: 120000, fee_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { d_id: $.data.id, d_v1: $.data.version }
            - call: "POST /corps/partner-schools"
              payload: { district_id: "${d_id}", name: "Bayou High", grade_band: "HIGH", subject_needs: ["MATH", "SCIENCE"], classroom_capacity: 1, expected_district_version: "${d_v1}" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /corps/partner-districts/${d_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /corps/applicants"
              payload: { full_name: "Ada Rivera", email: "ada@x.edu", campus_name: "State U", campus_tier: "STANDARD", graduation_year: 2026, leadership_score: 80.0, achievement_score: 85.0, gpa: 4.0 }
              as: SelectionManager
              captures: { a_id: $.data.id }
            - call: "POST /corps/applications"
              payload: { applicant_id: "${a_id}", preferred_region_id: "${r_id}", subject_area: "MATH", grade_preference: "HIGH" }
              as: SelectionManager
              captures: { app_id: $.data.id }
            - call: "POST /corps/applications/${app_id}/review"
              payload: { verified_gpa: 4.0 }
              as: SelectionManager
              as_user_id: "sm_reviewer"
            - call: "POST /corps/applications/${app_id}/decision"
              payload: { decision: "SELECT" }
              as: SelectionManager
              as_user_id: "sm_decider"
            - call: "POST /corps/applications/${app_id}/offer"
              payload: {}
              as: SelectionManager
            - call: "POST /corps/applications/${app_id}/offer/respond"
              payload: { accept: true }
              as: Applicant
              as_user_id: "${a_id}"
              captures: { m_id: $.data.created_corps_member_id }
            - call: "GET /corps/corps-members/${m_id}"
              payload: {}
              as: PlacementCoordinator
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /corps/placements"
              payload: { corps_member_id: "${m_id}", school_id: "${s_id}", subject_area: "MATH", grade_band: "HIGH", term_start_date: "2026-12-01T00:00:00Z", term_end_date: "2027-05-31T00:00:00Z", expected_corps_member_version: "${m_v}" }
              as: PlacementCoordinator
              captures: { pl_id: $.data.id, pl_st: $.data.status, pl_elig: $.data.employment_eligible }
            - call: "GET /corps/corps-members/${m_id}/certification-milestones"
              payload: {}
              as: CertificationOfficer
              captures: { ms_all: "$.data[0].progress_status", vs_all: "$.data[0].verification_status" }
          assert:
            - "Placement.${pl_id}.status == MATCHED and employment_eligible == false"
            - "Placement.${pl_id}.confirmed_at is null and activated_at is null"
            - "Every synthesized milestone reports progress_status == PENDING and verification_status == UNVERIFIED"
            - "PartnerDistrict.${d_id}.committed_placement_count == 0 because MATCHED does not count toward the commitment"
      - name: district_activation_requires_at_least_one_school
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PartnerDistrict.DRAFT_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          PartnerDistrict.DRAFT -> ACTIVE carries the precondition that at least one PartnerSchool already
          exists under the district; activating an empty district is refused with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "One Region (TX) and one PartnerDistrict in DRAFT with no schools."
          setup_api_calls:
            - call: "POST /corps/regions"
              payload: { region_code: "GULF-COAST", name: "Gulf Coast", state_code: "TX", term_start_date: "2026-12-01T00:00:00Z", base_placement_fee_cents: 300000, max_corps_members: 10 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /corps/partner-districts"
              payload: { region_id: "${r_id}", name: "Bayou ISD", hiring_commitment_slots: 4, placement_fee_per_member_cents: 350000, unfilled_slot_penalty_cents: 120000, fee_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { d_id: $.data.id, d_v1: $.data.version }
          trigger:
            - call: "POST /corps/partner-districts/${d_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /corps/partner-schools"
              payload: { district_id: "${d_id}", name: "Bayou High", grade_band: "HIGH", subject_needs: ["MATH"], classroom_capacity: 1, expected_district_version: "${d_v1}" }
              as: PlatformAdmin
              captures: { s_id: $.data.id, d_v2: $.data.version }
