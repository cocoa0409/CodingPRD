          A second authorization against the same plan is a legitimate product operation, so the write
          cannot be refused on state: replaying the pre-create expected_plan_of_care_version is 412
          ERR_STALE_PLAN_OF_CARE_VERSION, while the same call carrying the refreshed version is 201.
        test_recipe:
          setup:
            - "A SUBMITTED plan of care; its version after the submit is captured before any"
            - "authorization exists."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
