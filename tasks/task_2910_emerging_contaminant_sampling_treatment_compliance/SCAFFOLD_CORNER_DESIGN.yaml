  # Remaining §1.6 codes not triggered above are triggered elsewhere:
  #   ERR_SEGREGATION_OF_DUTIES        -> this file, rbac section
  #   ERR_STALE_ENTRY_POINT_VERSION    -> this file, complexity layers section
  #   ERR_STALE_CAPITAL_PROJECT_VERSION-> this file, complexity layers section
  #   ERR_INVALID_REQUEST / ERR_PAGINATION_OUT_OF_RANGE and the body-FK 404s
  #                                    -> this file, entities and validations sections
  #   the remaining state, boundary, budget and capacity codes
  #                                    -> this file's state_machines, calculations and
  #                                       validations sections and SCAFFOLD_DIFFICULTY_DESIGN.yaml

  # ===========================================================================
  # Guide section 7 — RBAC
  #
  # §1.7 declares seven roles. Every role's exclusive operations are probed
  # from at least one other role, the shared read surface is probed from all
  # seven, and the single declared segregation-of-duties rule gets its own
  # instance.
  # ===========================================================================
  - section: rbac
    instances:

      - name: no_role_can_perform_another_roles_exclusive_operation
        claim_type: exclusive_operations
        grounds:
          - roles.UtilityAdmin.exclusive_operations
          - roles.SamplingTechnician.exclusive_operations
          - roles.LaboratoryManager.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.TreatmentEngineer.exclusive_operations
          - roles.FinanceOfficer.exclusive_operations
          - roles.StateRegulator.exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
          - validations[priority=3]
        distinguishing_aspect: "All seven roles are crossed in a single pass, and two of the attempts point at ids that do not exist: because the role gate sits at priority 3 and the path-404 family at priority 5, those must still answer ERR_FORBIDDEN_ROLE rather than leaking the existence or absence of the row. The lab-result attempt further proves priority 3 beats the laboratory-ownership gate at priority 4."
        test_recipe:
          setup:
            - "One entry point, one contaminant, one laboratory and one collected sample exist so the legitimate owners of each operation would have something to act on."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-A1" }
              as: SamplingTechnician
              captures: { s_id: "$.data.id" }
          trigger:
            - call: "POST /contaminants"
              payload: { code: "PFOS", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { e_admin_op: "$.data.error_id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-16T08:00:00.000Z", protocol: "COMPOSITE", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-A2" }
              as: UtilityAdmin
              captures: { e_technician_op: "$.data.error_id" }
            - call: "POST /lab-results"
              payload: { sample_id: "${s_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 3.00, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { e_lab_op: "$.data.error_id" }
            - call: "POST /samples/${s_id}/invalidate"
              payload: { invalidation_reason: "OPERATOR_ERROR" }
              as: SamplingTechnician
              captures: { e_officer_op: "$.data.error_id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}", residuals_budget_cents: 500000 }
              as: FinanceOfficer
              captures: { e_engineer_op: "$.data.error_id" }
            - call: "PATCH /capital-projects/00000000-0000-4000-8000-0000000000aa"
              payload: { capital_cost_cents: 1000 }
              as: TreatmentEngineer
              captures: { e_finance_op: "$.data.error_id" }
            - call: "POST /compliance-determinations/00000000-0000-4000-8000-0000000000bb/rescind"
              payload: { rescind_reason: "Attempted by the wrong role" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { e_regulator_op: "$.data.error_id" }
          assert:
            - "All seven attempts return HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "The lab-result attempt returns ERR_FORBIDDEN_ROLE and NOT ERR_LABORATORY_NOT_OWNED, even though the ComplianceOfficer's X-User-ID resolves to no Laboratory"
            - "The PATCH on the unknown project returns ERR_FORBIDDEN_ROLE and NOT ERR_PROJECT_NOT_FOUND"
            - "The rescind on the unknown determination returns ERR_FORBIDDEN_ROLE and NOT ERR_DETERMINATION_NOT_FOUND"
            - "GET /contaminants still returns total_count == 1 and GET /samples still returns total_count == 1"
            - "Sample.${s_id}.status is still COLLECTED and GET /treatment-evaluations returns total_count == 0"

      - name: all_seven_roles_share_the_read_surface_and_the_clock
        claim_type: shared_operations
        grounds:
          - roles.UtilityAdmin.shared_operations
          - roles.SamplingTechnician.shared_operations
          - roles.LaboratoryManager.shared_operations
          - roles.ComplianceOfficer.shared_operations
          - roles.TreatmentEngineer.shared_operations
          - roles.FinanceOfficer.shared_operations
          - roles.StateRegulator.shared_operations
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "§1.7 gives every role \"every GET\" plus the clock, so an implementation that reuses a role's write allow-list for its reads locks six of the seven out of the very collection they are supposed to see; the LaboratoryManager read is included because its X-User-ID scoping applies to sample and lab-result reads, never to the entry-point registry."
        test_recipe:
          setup:
            - "One entry point exists so every read has exactly one row to return."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
          trigger:
            - call: "GET /entry-points"
              payload: {}
              as: UtilityAdmin
            - call: "GET /entry-points"
              payload: {}
              as: SamplingTechnician
            - call: "GET /entry-points"
              payload: {}
              as: LaboratoryManager
              as_user_id: "some-laboratory-user"
            - call: "GET /entry-points"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /entry-points"
              payload: {}
              as: TreatmentEngineer
            - call: "GET /entry-points"
              payload: {}
              as: FinanceOfficer
            - call: "GET /entry-points"
              payload: {}
              as: StateRegulator
              as_user_id: "regulator-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00.000Z" }
              as: SamplingTechnician
          assert:
            - "All seven reads return HTTP 200 with total_count == 1 and the same EntryPoint id ${ep_id}"
            - "None of the seven reads returns 403"
            - "The clock write returns HTTP 200 with current_utc 2026-08-02T00:00:00.000Z from a non-admin role"
            - "GET /entry-points as UtilityAdmin after the clock write still returns total_count == 1 — the clock endpoint touches no business row"

      - name: the_officer_who_drafted_a_notification_cannot_certify_its_distribution
        claim_type: segregation_of_duties
        grounds:
          - roles.segregation_of_duties_rules.notification_drafting_versus_certification
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - endpoints[POST /public-notifications/{id}/certify-distribution]
        distinguishing_aspect: "Both actors hold the same ComplianceOfficer role, so the refusal cannot come from the role table at all — it comes from comparing the certifying X-User-ID against the drafted_by_user_id stored at submit time, and the identical request from a second officer of the same role must succeed."
        test_recipe:
          setup:
            - "The TIER_2 notification from the PFOA 4.50 ng/L MCL violation on EPTDS-01 is submitted by officer-1 with all six mandatory content elements and both required delivery methods, then approved by the state regulator."
            - "The clock is still at its 2026-08-01T00:00:00.000Z default, which is inside the 2026-08-31T00:00:00.000Z deadline."
          setup_api_calls:
            - call: "POST /contaminants"
