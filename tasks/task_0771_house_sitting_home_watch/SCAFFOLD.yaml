# =============================================================================
# PRD Benchmark Seed Tables — House-Sitting & Home-Watch Service (Expert)
# =============================================================================

scenario: |
  771. House-Sitting & Home-Watch Service: client property & service checklist
  (mail/plants/security check), recurring vs vacation booking, sitter assignment
  & background check, visit log (photo/GPS) & report, key/access management,
  incident/emergency protocol, billing per-visit, insurance/bond. Design at
  Expert difficulty.

domain_name: house-sitting-home-watch
api_prefix: /home-watch

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency          # OCC on Sitter.version for coverage-policy supersede
    - cascading_side_effects          # booking cancel & incident settle multi-hop chains
    - dual_variant_calculation        # provisional vs final per-visit charge; reserved vs settled exposure
    - derived_field_reconciliation    # invoice subtotal ↔ visit charges; property key custody
  entity_topology: flat               # peer entities under a common prefix, FK links, no nested URLs
  state_machine_shape: branching      # Visit fork/flag; Booking has an assign↔unassign cycle; Incident escalate/resolve branches
  relationship_patterns:
    - one_to_many                     # Client→Property, Booking→Visit, Visit→VisitLogEntry
    - cross_aggregate                 # Booking references Sitter; Visit check-in references KeyAssignment
  role_model: peer_roles              # Client & Sitter own disjoint resource types; Coordinator is the opaque operator
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true               # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Client legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: billing_tier, type: enum, source: input, default: STANDARD, description: "STANDARD | PREMIUM — informational billing segment", constraints: "one of {STANDARD, PREMIUM}" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Lifecycle flag; initialized ACTIVE on creation", constraints: "one of {ACTIVE}" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning client" }
      - { name: label, type: string, source: input, description: "Human label e.g. 'Lakeside Cabin'" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: size_tier, type: enum, source: input, description: "SMALL | MEDIUM | LARGE — drives per-visit size surcharge", constraints: "one of {SMALL, MEDIUM, LARGE}" }
      - { name: has_pets, type: boolean, source: input, default: false, description: "Whether the property has pets requiring care (pet surcharge)" }
      - { name: checklist_config, type: array, source: input, description: "Non-empty subset of {MAIL, PLANTS, SECURITY}; the service tasks every visit must complete", constraints: "non-empty; each element one of {MAIL, PLANTS, SECURITY}" }
      - { name: center_lat, type: number, source: input, description: "Property latitude for visit geofence" }
      - { name: center_lng, type: number, source: input, description: "Property longitude for visit geofence" }
      - { name: geofence_radius_m, type: integer, source: input, default: 150, description: "Allowed check-in distance from center in metres" }
      - { name: key_copies_total, type: integer, source: input, description: "Total physical key copies held for this property (conserved quantity)", constraints: ">= 1" }
      - { name: available_key_copies, type: integer, source: computed, description: "= key_copies_total - checked_out_count - lost_count; copies currently at the office" }

  - name: Sitter
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Sitter legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: background_check_status, type: enum, source: computed, default: NONE, description: "Mirror of the latest BackgroundCheck.status: NONE | SUBMITTED | CLEARED | REJECTED", constraints: "one of {NONE, SUBMITTED, CLEARED, REJECTED}" }
      - { name: missed_visit_count, type: integer, source: computed, default: 0, description: "Cumulative count of this sitter's MISSED visits" }
      - { name: escalated_incident_count, type: integer, source: computed, default: 0, description: "Cumulative count of ESCALATED incidents attributed to this sitter" }
      - { name: reliability_score, type: number, source: computed, default: 100, description: "= max(0, 100 - 20*missed_visit_count - 10*escalated_incident_count)" }
      - { name: status, type: enum, source: system, default: ONBOARDING, description: "ONBOARDING → ACTIVE → SUSPENDED", constraints: "one of {ONBOARDING, ACTIVE, SUSPENDED}" }

  - name: BackgroundCheck
    parent: Sitter
    common_fields: true
    fields:
      - { name: sitter_id, type: string, source: input, description: "FK -> Sitter.id; subject of the check" }
      - { name: provider_ref, type: string, source: input, description: "External vetting provider reference" }
      - { name: expires_at, type: datetime, source: input, description: "Instant after which a CLEARED check is stale and no longer qualifies the sitter for assignment" }
      - { name: cleared_at, type: datetime, source: computed, description: "Logical-clock instant the check was CLEARED; null otherwise" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED → CLEARED | REJECTED", constraints: "one of {SUBMITTED, CLEARED, REJECTED}" }

  - name: CoveragePolicy
    parent: Sitter
    common_fields: true
    fields:
      - { name: sitter_id, type: string, source: input, description: "FK -> Sitter.id; policy holder" }
      - { name: policy_type, type: enum, source: input, description: "BOND (fidelity/theft) | LIABILITY (property damage)", constraints: "one of {BOND, LIABILITY}" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Maximum indemnity in cents", constraints: ">= 1" }
      - { name: effective_from, type: datetime, source: input, description: "Coverage start instant" }
      - { name: expires_at, type: datetime, source: input, description: "Coverage end instant; policy is inactive once clock >= expires_at" }
      - { name: reserved_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of estimated exposure reserved by ESCALATED, not-yet-resolved incidents (LIABILITY only)" }
      - { name: paid_out_cents, type: integer, source: computed, default: 0, description: "Cumulative settled indemnity paid on resolved incidents (LIABILITY only)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE → SUPERSEDED (replaced by a newer same-type policy) | EXHAUSTED (paid_out_cents >= coverage_amount_cents)", constraints: "one of {ACTIVE, SUPERSEDED, EXHAUSTED}" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; property to watch" }
      - { name: client_id, type: string, source: computed, description: "FK -> Client.id; denormalized from Property.client_id at creation" }
      - { name: sitter_id, type: string, source: computed, description: "FK -> Sitter.id; assigned sitter, null until assignment" }
      - { name: booking_type, type: enum, source: input, description: "RECURRING (repeating schedule) | VACATION (single continuous coverage window)", constraints: "one of {RECURRING, VACATION}" }
      - { name: frequency, type: enum, source: input, description: "DAILY | WEEKLY | BIWEEKLY — required when booking_type=RECURRING, must be omitted for VACATION", constraints: "one of {DAILY, WEEKLY, BIWEEKLY} or null" }
      - { name: start_date, type: datetime, source: input, description: "Inclusive first coverage date (visits scheduled 09:00Z that day)" }
      - { name: end_date, type: datetime, source: input, description: "Inclusive last coverage date" }
      - { name: base_visit_rate_cents, type: integer, source: input, description: "Base per-visit rate in cents before surcharges/multipliers", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT → PENDING_ASSIGNMENT → SCHEDULED → ACTIVE → COMPLETED; CANCELLED from any non-terminal", constraints: "one of {DRAFT, PENDING_ASSIGNMENT, SCHEDULED, ACTIVE, COMPLETED, CANCELLED}" }

  - name: Visit
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; owning booking" }
      - { name: sitter_id, type: string, source: computed, description: "FK -> Sitter.id; inherited from booking at generation" }
      - { name: property_id, type: string, source: computed, description: "FK -> Property.id; inherited from booking" }
      - { name: scheduled_start, type: datetime, source: computed, description: "Visit window start (09:00Z on the scheduled date)" }
      - { name: scheduled_end, type: datetime, source: computed, description: "Visit window end (09:30Z; STANDARD_VISIT_MINUTES after start)" }
      - { name: check_in_at, type: datetime, source: computed, description: "Logical-clock instant of check-in; null until IN_PROGRESS" }
      - { name: check_out_at, type: datetime, source: computed, description: "Logical-clock instant of check-out; null until DONE" }
      - { name: completed_tasks, type: array, source: input, description: "Checklist task types marked done at check-out; must equal property.checklist_config set" }
      - { name: is_weekend, type: boolean, source: computed, description: "True when scheduled_start falls on Saturday/Sunday (UTC); drives weekend multiplier" }
      - { name: provisional_charge_cents, type: integer, source: computed, default: 0, description: "Charge computed at check-out using standard duration factor 1.0" }
      - { name: final_charge_cents, type: integer, source: computed, description: "Charge recomputed at booking completion using actual duration factor; null until finalized" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED → IN_PROGRESS → DONE; SCHEDULED → MISSED; IN_PROGRESS → FLAGGED → DONE; → CANCELLED on booking cancel/unassign", constraints: "one of {SCHEDULED, IN_PROGRESS, FLAGGED, DONE, MISSED, CANCELLED}" }

  - name: VisitLogEntry
    parent: Visit
    common_fields: false              # append-only evidence record: only id + created_at, immutable, no version
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; the visit this evidence belongs to" }
      - { name: entry_type, type: enum, source: input, description: "PHOTO | GPS_PING | NOTE", constraints: "one of {PHOTO, GPS_PING, NOTE}" }
      - { name: photo_url, type: string, source: input, description: "Photo URL when entry_type=PHOTO; null otherwise" }
      - { name: gps_lat, type: number, source: input, description: "Latitude captured at the log instant" }
      - { name: gps_lng, type: number, source: input, description: "Longitude captured at the log instant" }
      - { name: captured_at, type: datetime, source: input, description: "Client-supplied capture timestamp" }

  - name: KeyAssignment
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; property whose key copy is tracked" }
      - { name: sitter_id, type: string, source: input, description: "FK -> Sitter.id; sitter entrusted with the copy" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; booking the copy is issued for" }
      - { name: checked_out_at, type: datetime, source: computed, description: "Instant of checkout; null until CHECKED_OUT" }
      - { name: returned_at, type: datetime, source: computed, description: "Instant of return; null until RETURNED" }
      - { name: status, type: enum, source: system, default: AT_OFFICE, description: "AT_OFFICE → CHECKED_OUT → RETURNED; CHECKED_OUT → LOST", constraints: "one of {AT_OFFICE, CHECKED_OUT, RETURNED, LOST}" }

  - name: Incident
    parent: Visit
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: input, description: "FK -> Visit.id; visit during which the incident was observed" }
      - { name: booking_id, type: string, source: computed, description: "FK -> Booking.id; inherited from the visit" }
      - { name: reported_by_sitter_id, type: string, source: system, description: "FK -> Sitter.id; sitter who filed the incident (from X-User-ID)" }
      - { name: category, type: enum, source: input, description: "BREAK_IN | WATER_LEAK | FIRE | MEDICAL | OTHER", constraints: "one of {BREAK_IN, WATER_LEAK, FIRE, MEDICAL, OTHER}" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | EMERGENCY", constraints: "one of {MINOR, MAJOR, EMERGENCY}" }
      - { name: assessed_damage_cents, type: integer, source: input, description: "Assessed property damage in cents, supplied at resolution; null until RESOLVED" }
      - { name: estimated_exposure_cents, type: integer, source: computed, default: 0, description: "Reserve placed against the sitter's LIABILITY policy at escalation" }
      - { name: settled_payout_cents, type: integer, source: computed, description: "Indemnity actually paid at resolution; null until RESOLVED" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN → RESOLVED; OPEN → ESCALATED → RESOLVED", constraints: "one of {OPEN, ESCALATED, RESOLVED}" }

  - name: Invoice
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; one invoice per booking" }
      - { name: client_id, type: string, source: computed, description: "FK -> Client.id; inherited from booking" }
      - { name: billed_visit_count, type: integer, source: computed, default: 0, description: "Count of DONE visits contributing charges" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of contributing visit charges (provisional while ACTIVE, final at completion)" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "Loyalty discount keyed on subtotal tier" }
      - { name: service_fee_cents, type: integer, source: computed, default: 0, description: "Platform service fee on the discounted base" }
      - { name: tax_cents, type: integer, source: computed, default: 0, description: "Tax on discounted base + service fee" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "= discounted_base + service_fee + tax" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT → ISSUED → PAID; DRAFT|ISSUED → VOID on booking cancel", constraints: "one of {DRAFT, ISSUED, PAID, VOID}" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: BackgroundCheck
    initial_state: SUBMITTED
    terminal_states: [CLEARED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /home-watch/background-checks/{id}/decide (decision=CLEARED)"
        actor: Coordinator
        preconditions:
          - "Check is in SUBMITTED (ERR_BGCHECK_NOT_PENDING)"
        side_effects:
          - "cleared_at = current clock"
          - "Sitter.background_check_status = CLEARED"
          - "If Sitter.status == ONBOARDING → Sitter.status = ACTIVE"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /home-watch/background-checks/{id}/decide (decision=REJECTED)"
        actor: Coordinator
        preconditions:
          - "Check is in SUBMITTED (ERR_BGCHECK_NOT_PENDING)"
        side_effects:
          - "Sitter.background_check_status = REJECTED"

  - entity: Booking
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_ASSIGNMENT
        trigger: "POST /home-watch/bookings/{id}/submit"
        actor: Client | Coordinator
        preconditions:
          - "Booking is in DRAFT (ERR_BOOKING_NOT_DRAFT)"
          - "Property.checklist_config is non-empty (ERR_CHECKLIST_CONFIG_EMPTY)"
          - "For VACATION bookings, no other VACATION booking on the same property in {PENDING_ASSIGNMENT, SCHEDULED, ACTIVE} has an inclusive date range overlapping [start_date, end_date] (ERR_PROPERTY_BOOKING_OVERLAP)"
        side_effects: []
      - from: PENDING_ASSIGNMENT
        to: SCHEDULED
        trigger: "POST /home-watch/bookings/{id}/assign"
        actor: Coordinator
        preconditions:
          - "Booking is in PENDING_ASSIGNMENT (ERR_BOOKING_NOT_PENDING_ASSIGNMENT)"
          - "Sitter's latest BackgroundCheck.status == CLEARED and current clock < that check's expires_at (ERR_SITTER_NOT_CLEARED)"
          - "Sitter has an ACTIVE BOND CoveragePolicy with effective_from <= clock < expires_at (ERR_SITTER_COVERAGE_INACTIVE)"
          - "Sitter.reliability_score >= MIN_RELIABILITY (60) (ERR_SITTER_RELIABILITY_TOO_LOW)"
          - "None of the visits this booking would generate collide with the sitter's existing SCHEDULED/IN_PROGRESS visits under the buffered-overlap rule (ERR_SITTER_SCHEDULE_CONFLICT)"
        side_effects:
          - "Booking.sitter_id = payload sitter_id"
          - "Generate Visit rows for the schedule (recurrence_visit_generation), each status=SCHEDULED, sitter_id/property_id inherited"
          - "Create the booking's Invoice in DRAFT (subtotal 0)"
      - from: SCHEDULED
        to: PENDING_ASSIGNMENT
        trigger: "POST /home-watch/bookings/{id}/unassign"
        actor: Coordinator
        preconditions:
          - "Booking is in SCHEDULED (ERR_BOOKING_NOT_SCHEDULED)"
        note: "Cyclic revision loop: return to the assignment pool to pick a different sitter."
        side_effects:
          - "All SCHEDULED visits of this booking → CANCELLED"
          - "Booking.Invoice → VOID"
          - "Booking.sitter_id = null"
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /home-watch/bookings/{id}/activate"
        actor: Coordinator
        preconditions:
          - "Booking is in SCHEDULED (ERR_BOOKING_NOT_SCHEDULED)"
          - "A KeyAssignment for (this booking, its sitter) is in CHECKED_OUT (ERR_KEY_NOT_READY)"
        side_effects:
          - "Invoice → ISSUED"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /home-watch/bookings/{id}/complete"
        actor: Coordinator
        preconditions:
          - "Booking is in ACTIVE (ERR_BOOKING_NOT_ACTIVE)"
          - "Every visit of the booking is terminal (DONE/MISSED/CANCELLED) (ERR_VISITS_NOT_RESOLVED)"
        side_effects:
          - "For each DONE visit: final_charge_cents recomputed with actual duration factor (per_visit_charge final variant)"
          - "Invoice.subtotal/discount/service_fee/tax/total recomputed from final charges (invoice_financials)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /home-watch/bookings/{id}/cancel"
        actor: Client | Coordinator
        preconditions:
          - "Booking is in {DRAFT, PENDING_ASSIGNMENT, SCHEDULED, ACTIVE} (ERR_BOOKING_NOT_CANCELLABLE)"
        side_effects: []
      - from: PENDING_ASSIGNMENT
        to: CANCELLED
        trigger: "POST /home-watch/bookings/{id}/cancel"
        actor: Client | Coordinator
        preconditions:
          - "Booking is in {DRAFT, PENDING_ASSIGNMENT, SCHEDULED, ACTIVE} (ERR_BOOKING_NOT_CANCELLABLE)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /home-watch/bookings/{id}/cancel"
        actor: Client | Coordinator
        preconditions:
          - "Booking is in {DRAFT, PENDING_ASSIGNMENT, SCHEDULED, ACTIVE} (ERR_BOOKING_NOT_CANCELLABLE)"
        side_effects:
          - "Cascade hop 1: every Visit not already CANCELLED/MISSED (SCHEDULED/IN_PROGRESS/FLAGGED/DONE) → CANCELLED"
          - "Cascade hop 2: each such Visit that had billed a charge (was DONE) reverses that charge → Invoice.subtotal decremented and recomputed"
          - "Cascade hop 3: Invoice → VOID"
          - "Any CHECKED_OUT KeyAssignment for this booking → RETURNED (releases the key copy)"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /home-watch/bookings/{id}/cancel"
        actor: Client | Coordinator
        preconditions:
          - "Booking is in {DRAFT, PENDING_ASSIGNMENT, SCHEDULED, ACTIVE} (ERR_BOOKING_NOT_CANCELLABLE)"
        side_effects:
          - "Cascade hop 1: every Visit not already CANCELLED/MISSED (SCHEDULED/IN_PROGRESS/FLAGGED/DONE) → CANCELLED"
          - "Cascade hop 2: each such Visit that had billed a charge (was DONE) reverses that charge → Invoice.subtotal decremented and recomputed"
          - "Cascade hop 3: Invoice → VOID"
          - "Any CHECKED_OUT KeyAssignment for this booking → RETURNED (releases the key copy)"

  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [DONE, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /home-watch/visits/{id}/check-in"
        actor: Sitter
        preconditions:
          - "Visit is in SCHEDULED (ERR_VISIT_NOT_SCHEDULED)"
          - "Acting sitter is the visit's sitter_id (ERR_FORBIDDEN_NOT_OWNER)"
          - "Owning Booking.status == ACTIVE (ERR_BOOKING_NOT_ACTIVE)"
          - "Check-in GPS within property.geofence_radius_m of property center (ERR_OUTSIDE_GEOFENCE)"
          - "A KeyAssignment for (booking, sitter) is CHECKED_OUT (ERR_KEY_NOT_CHECKED_OUT)"
        side_effects:
          - "check_in_at = current clock"
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /home-watch/visits/{id}/check-out"
        actor: Sitter
        preconditions:
          - "Visit is in IN_PROGRESS (ERR_VISIT_NOT_IN_PROGRESS)"
          - "At least one VisitLogEntry exists for the visit (ERR_VISIT_EVIDENCE_MISSING)"
          - "completed_tasks set equals property.checklist_config set (ERR_CHECKLIST_INCOMPLETE)"
        side_effects:
          - "check_out_at = current clock"
          - "provisional_charge_cents computed (per_visit_charge, duration factor 1.0)"
          - "Invoice.subtotal += provisional_charge_cents; billed_visit_count += 1; Invoice financials recomputed"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /home-watch/visits/{id}/mark-missed"
        actor: Coordinator
        preconditions:
          - "Visit is in SCHEDULED (ERR_VISIT_NOT_SCHEDULED)"
          - "Current clock >= visit.scheduled_end (ERR_VISIT_WINDOW_OPEN)"
        side_effects:
          - "Cascade hop 1: Sitter.missed_visit_count += 1; reliability_score recomputed"
          - "Cascade hop 2: if reliability_score < MIN_RELIABILITY (60), Sitter.status → SUSPENDED"
      - from: IN_PROGRESS
        to: FLAGGED
        trigger: "system (a Sitter files an Incident via POST /home-watch/incidents on an IN_PROGRESS visit)"
        actor: system
        preconditions:
          - "Visit is in IN_PROGRESS"
        side_effects: []
      - from: FLAGGED
        to: DONE
        trigger: "POST /home-watch/visits/{id}/check-out"
        actor: Sitter
        preconditions:
          - "Every Incident on this visit is RESOLVED (ERR_UNRESOLVED_INCIDENT)"
          - "At least one VisitLogEntry exists for the visit (ERR_VISIT_EVIDENCE_MISSING)"
          - "completed_tasks set equals property.checklist_config set (ERR_CHECKLIST_INCOMPLETE)"
        side_effects:
          - "check_out_at = current clock"
          - "provisional_charge_cents computed (per_visit_charge, duration factor 1.0)"
          - "Invoice.subtotal += provisional_charge_cents; billed_visit_count += 1; Invoice financials recomputed"

  - entity: KeyAssignment
    initial_state: AT_OFFICE
    terminal_states: [RETURNED, LOST]
    transitions:
      - from: AT_OFFICE
        to: CHECKED_OUT
        trigger: "POST /home-watch/key-assignments/{id}/check-out"
        actor: Coordinator | Sitter
        preconditions:
          - "Assignment is in AT_OFFICE (ERR_KEY_NOT_AT_OFFICE)"
          - "property.available_key_copies >= 1 (ERR_NO_KEY_COPIES_AVAILABLE)"
        side_effects:
          - "checked_out_at = current clock"
          - "property.available_key_copies -= 1 (recompute custody)"
      - from: CHECKED_OUT
        to: RETURNED
        trigger: "POST /home-watch/key-assignments/{id}/return"
        actor: Coordinator | Sitter
        preconditions:
          - "Assignment is in CHECKED_OUT (ERR_KEY_NOT_CHECKED_OUT)"
        side_effects:
          - "returned_at = current clock"
          - "property.available_key_copies += 1 (recompute custody)"
      - from: CHECKED_OUT
        to: LOST
        trigger: "POST /home-watch/key-assignments/{id}/report-lost"
        actor: Coordinator
        preconditions:
          - "Assignment is in CHECKED_OUT (ERR_KEY_NOT_CHECKED_OUT)"
        note: "The copy moves from the checked-out bucket to the lost bucket; available_key_copies is unchanged, so key_copies_total is conserved."
        side_effects: []

  - entity: Incident
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "POST /home-watch/incidents/{id}/escalate"
        actor: Coordinator
        preconditions:
          - "Incident is in OPEN (ERR_INCIDENT_NOT_OPEN)"
          - "Sitter has an ACTIVE LIABILITY CoveragePolicy (ERR_NO_LIABILITY_COVERAGE)"
        side_effects:
          - "estimated_exposure_cents computed (incident_liability_exposure, estimated variant)"
          - "LIABILITY policy.reserved_exposure_cents += estimated_exposure_cents"
          - "Sitter.escalated_incident_count += 1; reliability_score recomputed"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /home-watch/incidents/{id}/resolve"
        actor: Coordinator
        preconditions:
          - "Incident is in {OPEN, ESCALATED} (ERR_INCIDENT_NOT_RESOLVABLE)"
          - "assessed_damage_cents >= 0 provided (ERR_INVALID_REQUEST)"
        side_effects:
          - "settled_payout_cents computed (incident_liability_exposure, settled variant)"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /home-watch/incidents/{id}/resolve"
        actor: Coordinator
        preconditions:
          - "Incident is in {OPEN, ESCALATED} (ERR_INCIDENT_NOT_RESOLVABLE)"
          - "assessed_damage_cents >= 0 provided (ERR_INVALID_REQUEST)"
        side_effects:
          - "Cascade hop 1: settled_payout_cents computed; LIABILITY policy.reserved_exposure_cents -= estimated_exposure_cents; policy.paid_out_cents += settled_payout_cents"
          - "Cascade hop 2: if policy.paid_out_cents >= coverage_amount_cents → policy.status = EXHAUSTED, and (caused by exhaustion) Sitter.status → SUSPENDED"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "system (booking activate)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: PAID
        trigger: "POST /home-watch/invoices/{id}/pay"
        actor: Client | Coordinator
        preconditions:
          - "Invoice is in ISSUED (ERR_INVOICE_NOT_ISSUED)"
          - "Owning Booking.status == COMPLETED (ERR_BOOKING_NOT_COMPLETED)"
        side_effects: []
      - from: DRAFT
        to: VOID
        trigger: "system (booking cancel/unassign)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: VOID
        trigger: "system (booking cancel)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: coverage-policy-supersede-stale-sitter
    parent_entity: Sitter
    write_endpoint: "POST /home-watch/coverage-policies"
    occ_field: "expected_sitter_version"
    description: |
      Creating a new CoveragePolicy supersedes the sitter's prior ACTIVE policy
      of the same policy_type. A create whose expected_sitter_version no longer
      matches the sitter's current version is rejected: the sitter's coverage
      posture already advanced (another writer added a policy that legitimately
      supersedes the prior one), so this writer's view is stale and its
      supersede decision would be based on outdated coverage state.
    error_id: ERR_STALE_SITTER_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: recurrence_visit_generation
    trigger: "Booking assign (PENDING_ASSIGNMENT → SCHEDULED)"
    algorithm: interval_merge
    formula: |
      Let d0 = start_date (date), dN = end_date (date), both inclusive.
      VACATION:  one visit per calendar day from d0 to dN inclusive.
                 visit_count = (dN - d0).days + 1
      RECURRING: step = {DAILY:1, WEEKLY:7, BIWEEKLY:14}[frequency] days.
                 visits at d0, d0+step, d0+2*step, ... while date <= dN.
                 visit_count = floor((dN - d0).days / step) + 1
      Each visit: scheduled_start = date @ 09:00:00Z, scheduled_end = start + STANDARD_VISIT_MINUTES.
      is_weekend = scheduled_start weekday in {Sat, Sun} (UTC).
      Generation order is ascending scheduled_start (chronological); ties impossible (distinct dates).
    constants:
      STANDARD_VISIT_MINUTES: 30
    input_set: "Only the booking under assignment; dates are inclusive on both ends."
    precision: "integer day arithmetic (UTC calendar days)"

  - name: per_visit_charge
    trigger: "Visit check-out (provisional variant); Booking complete (final variant)"
    algorithm: tiered_pricing
    formula: |
      size_surcharge = SIZE_SURCHARGE[property.size_tier]      # SMALL/MEDIUM/LARGE
      pet_surcharge  = property.has_pets ? PET_SURCHARGE : 0
      base_sum       = booking.base_visit_rate_cents + size_surcharge + pet_surcharge
      weekend_mult   = visit.is_weekend ? WEEKEND_MULTIPLIER : 1.0
      duration_factor= clamp(actual_minutes / STANDARD_VISIT_MINUTES, MIN_FACTOR, MAX_FACTOR)
      charge_cents   = round_half_up( base_sum * weekend_mult * duration_factor )
      # Evaluation order is fixed: additive base_sum first, then multiply by weekend_mult,
      # then by duration_factor, then a single round to whole cents.
    constants:
      SIZE_SURCHARGE: { SMALL: 0, MEDIUM: 1500, LARGE: 3500 }
      PET_SURCHARGE: 1000
      WEEKEND_MULTIPLIER: 1.25
      STANDARD_VISIT_MINUTES: 30
      MIN_FACTOR: 0.5
      MAX_FACTOR: 2.0
    precision: "round_half_up to whole cents; single final rounding (no intermediate rounding)"
    variants:
      - name: provisional
        when: "at check-out"
        difference: "duration_factor is fixed at 1.0 (assumes a standard-length visit); actual elapsed time is ignored."
      - name: final
        when: "at booking completion"
        difference: "duration_factor = clamp((check_out_at - check_in_at) minutes / 30, 0.5, 2.0); uses the actual GPS-logged elapsed time and can diverge from provisional."

  - name: invoice_financials
    trigger: "Visit check-out; Booking complete; Booking cancel (visit charge reversal)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order pinned to resolve the discount<->fee<->total interdependence:
      subtotal        = sum of contributing visit charges (provisional while ACTIVE; final at completion)
      # 1) discount tier keyed on subtotal:
      if   subtotal >= DISCOUNT_TIER2_MIN: discount_rate = 0.10
      elif subtotal >= DISCOUNT_TIER1_MIN: discount_rate = 0.05
      else:                                discount_rate = 0.00
      discount_cents  = round_half_up(subtotal * discount_rate)
      discounted_base = subtotal - discount_cents
      # 2) service fee on the discounted base:
      service_fee_cents = round_half_up(discounted_base * SERVICE_FEE_RATE)
      # 3) tax on discounted base + service fee:
      tax_cents       = round_half_up((discounted_base + service_fee_cents) * TAX_RATE)
      total_cents     = discounted_base + service_fee_cents + tax_cents
    constants:
      DISCOUNT_TIER1_MIN: 20000
      DISCOUNT_TIER2_MIN: 50000
      SERVICE_FEE_RATE: 0.08
      TAX_RATE: 0.07
    input_set: "Contributing visits are those in DONE status for the booking; CANCELLED/MISSED visits contribute nothing."
    precision: "round_half_up to whole cents at each pinned step, in the order shown"

  - name: incident_liability_exposure
    trigger: "Incident escalate (estimated variant); Incident resolve (settled variant)"
    algorithm: threshold
    formula: |
      Let policy = the sitter's ACTIVE LIABILITY CoveragePolicy.
      estimated_exposure = min( policy.coverage_amount_cents, SEVERITY_RESERVE[severity] )
      settled_payout     = min( assessed_damage_cents, policy.coverage_amount_cents )
    constants:
      SEVERITY_RESERVE: { MINOR: 50000, MAJOR: 200000, EMERGENCY: 500000 }
    input_set: "Single incident and its sitter's ACTIVE LIABILITY policy."
    precision: "integer cents"
    variants:
      - name: estimated
        when: "at escalation, before damage is known"
        difference: "reserves a severity-capped amount (min of policy cap and the severity reserve); forward-looking, independent of actual damage."
      - name: settled
        when: "at resolution, once assessed_damage_cents is known"
        difference: "pays the lesser of assessed damage and policy cap; can differ from the estimated reserve in either direction."

  - name: sitter_reliability_score
    trigger: "Visit mark-missed; Incident escalate"
    algorithm: weighted_scoring
    formula: |
      reliability_score = max(0, 100 - MISS_PENALTY*missed_visit_count - ESCALATION_PENALTY*escalated_incident_count)
    constants:
      MISS_PENALTY: 20
      ESCALATION_PENALTY: 10
      MIN_RELIABILITY: 60
    input_set: "Per-sitter counters; recomputed on every counter change."
    precision: "integer; floored at 0"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation (per RBAC matrix)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids exist, validated left-to-right"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "entity_backed actor owns the target resource (Client owns property/booking/invoice; Sitter owns visit/key it acts on)"
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "ownership-scoped mutations"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, RECURRING has frequency and VACATION omits it"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/action endpoints with a body"

  - priority: 6
    category: state
    check: "Target resource is in the correct state for the requested transition"
    error_id: "ERR_*_NOT_* (state guard, e.g. ERR_BOOKING_NOT_PENDING_ASSIGNMENT)"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_constraint
    check: "OCC: expected_sitter_version matches Sitter.version on coverage-policy create"
    error_id: ERR_STALE_SITTER_VERSION
    http_status: 412
    applies_to: "POST /home-watch/coverage-policies"

  # --- assign endpoint business rules (ordered) — Conflict #1 lives at 8 vs 9 ---
  - priority: 8
    category: state
    check: "Assigned sitter's latest BackgroundCheck is CLEARED and not expired at the current clock"
    error_id: ERR_SITTER_NOT_CLEARED
    http_status: 409
    applies_to: "POST /home-watch/bookings/{id}/assign"

  - priority: 9
    category: business_safety
    check: "Assigned sitter has an ACTIVE, in-window BOND CoveragePolicy"
    error_id: ERR_SITTER_COVERAGE_INACTIVE
    http_status: 403
    applies_to: "POST /home-watch/bookings/{id}/assign"

  - priority: 10
    category: business_constraint
    check: "Assigned sitter's reliability_score >= 60"
    error_id: ERR_SITTER_RELIABILITY_TOO_LOW
    http_status: 403
    applies_to: "POST /home-watch/bookings/{id}/assign"

  - priority: 11
    category: business_temporal
    check: "None of the booking's prospective visits collide with the sitter's existing SCHEDULED/IN_PROGRESS visits under the buffered-overlap rule (start_b < end_a + BUFFER and start_a < end_b + BUFFER)"
    error_id: ERR_SITTER_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /home-watch/bookings/{id}/assign"

  - priority: 12
    category: business_temporal
    check: "For VACATION submit, no other VACATION booking on the property in {PENDING_ASSIGNMENT,SCHEDULED,ACTIVE} has an inclusive date-range overlap"
    error_id: ERR_PROPERTY_BOOKING_OVERLAP
    http_status: 409
    applies_to: "POST /home-watch/bookings/{id}/submit"

  # --- check-in business rules ---
  - priority: 13
    category: business_safety
    check: "Check-in GPS lies within property.geofence_radius_m of the property center"
    error_id: ERR_OUTSIDE_GEOFENCE
    http_status: 422
    applies_to: "POST /home-watch/visits/{id}/check-in"

  - priority: 14
    category: business_referential
    check: "A KeyAssignment for (booking, acting sitter) is CHECKED_OUT"
    error_id: ERR_KEY_NOT_CHECKED_OUT
    http_status: 409
    applies_to: "POST /home-watch/visits/{id}/check-in"

  # --- check-out business rules — Conflict #2 lives at 15 vs 16 ---
  - priority: 15
    category: business_safety
    check: "At least one VisitLogEntry (photo/GPS evidence) exists for the visit"
    error_id: ERR_VISIT_EVIDENCE_MISSING
    http_status: 422
    applies_to: "POST /home-watch/visits/{id}/check-out"

  - priority: 16
    category: business_constraint
    check: "completed_tasks set equals property.checklist_config set"
    error_id: ERR_CHECKLIST_INCOMPLETE
    http_status: 422
    applies_to: "POST /home-watch/visits/{id}/check-out"

  - priority: 17
    category: business_fiscal
    check: "property.available_key_copies >= 1 when checking out a key copy"
    error_id: ERR_NO_KEY_COPIES_AVAILABLE
    http_status: 409
    applies_to: "POST /home-watch/key-assignments/{id}/check-out"

  - priority: 18
    category: business_referential
    check: "Booking activate requires a CHECKED_OUT KeyAssignment for the booking"
    error_id: ERR_KEY_NOT_READY
    http_status: 409
    applies_to: "POST /home-watch/bookings/{id}/activate"

  - priority: 19
    category: business_constraint
    check: "Booking complete requires every visit terminal (DONE/MISSED/CANCELLED)"
    error_id: ERR_VISITS_NOT_RESOLVED
    http_status: 409
    applies_to: "POST /home-watch/bookings/{id}/complete"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Coordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

  # ---- Clients ----
  - method: POST
    path: "/home-watch/clients"
    description: "Onboard a client"
    roles: [Coordinator]
    code: 201
    input: [full_name, email, "billing_tier?"]
    output: Client
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/home-watch/clients"
    description: "List clients"
    roles: [Coordinator, Client, Sitter]
    code: 200
    input: []
    output: "Client[]"
    side_effects: []
  - method: GET
    path: "/home-watch/clients/{id}"
    description: "Get a client"
    roles: [Coordinator, Client, Sitter]
    code: 200
    input: []
    output: Client
    side_effects: []

  # ---- Properties ----
  - method: POST
    path: "/home-watch/properties"
    description: "Register a property under a client"
    roles: [Coordinator, Client]
    code: 201
    input: [client_id, label, address, size_tier, "has_pets?", checklist_config, center_lat, center_lng, "geofence_radius_m?", key_copies_total]
    output: Property
    side_effects: ["available_key_copies = key_copies_total"]
  - method: GET
    path: "/home-watch/properties"
    description: "List properties (filter by client_id)"
    roles: [Coordinator, Client, Sitter]
    code: 200
    input: ["client_id?"]
    output: "Property[]"
    side_effects: []
  - method: GET
    path: "/home-watch/properties/{id}"
    description: "Get a property"
    roles: [Coordinator, Client, Sitter]
    code: 200
    input: []
    output: Property
    side_effects: []

  # ---- Sitters ----
  - method: POST
    path: "/home-watch/sitters"
    description: "Onboard a sitter"
    roles: [Coordinator]
    code: 201
    input: [full_name, email]
    output: Sitter
    side_effects: ["status = ONBOARDING; background_check_status = NONE; reliability_score = 100"]
  - method: GET
    path: "/home-watch/sitters"
    description: "List sitters"
    roles: [Coordinator, Client, Sitter]
    code: 200
    input: []
    output: "Sitter[]"
    side_effects: []
  - method: GET
    path: "/home-watch/sitters/{id}"
    description: "Get a sitter"
    roles: [Coordinator, Client, Sitter]
    code: 200
    input: []
    output: Sitter
    side_effects: []

  # ---- Background Checks ----
  - method: POST
    path: "/home-watch/background-checks"
    description: "Submit a background check for a sitter"
    roles: [Coordinator]
    code: 201
    input: [sitter_id, provider_ref, expires_at]
    output: BackgroundCheck
    side_effects: ["status = SUBMITTED; Sitter.background_check_status = SUBMITTED"]
  - method: POST
    path: "/home-watch/background-checks/{id}/decide"
    description: "Clear or reject a submitted background check"
    roles: [Coordinator]
    code: 200
    input: [decision]
    output: BackgroundCheck
    side_effects: ["status → CLEARED|REJECTED; mirrors to Sitter.background_check_status; sets cleared_at; ONBOARDING sitter → ACTIVE on CLEARED"]
  - method: GET
    path: "/home-watch/background-checks"
    description: "List background checks (filter by sitter_id)"
    roles: [Coordinator, Sitter]
    code: 200
    input: ["sitter_id?"]
    output: "BackgroundCheck[]"
    side_effects: []
  - method: GET
    path: "/home-watch/background-checks/{id}"
    description: "Get a background check"
    roles: [Coordinator, Sitter]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: []

  # ---- Coverage Policies (insurance/bond) ----
  - method: POST
    path: "/home-watch/coverage-policies"
    description: "Issue an insurance/bond policy to a sitter (supersedes prior ACTIVE same-type). OCC-guarded on Sitter.version."
    roles: [Coordinator]
    code: 201
    input: [sitter_id, policy_type, coverage_amount_cents, effective_from, expires_at, expected_sitter_version]
    output: CoveragePolicy
    side_effects: ["status = ACTIVE; prior ACTIVE same-type policy → SUPERSEDED; increments Sitter.version by 1"]
  - method: GET
    path: "/home-watch/coverage-policies"
    description: "List coverage policies (filter by sitter_id)"
    roles: [Coordinator, Sitter]
    code: 200
    input: ["sitter_id?"]
    output: "CoveragePolicy[]"
    side_effects: []
  - method: GET
    path: "/home-watch/coverage-policies/{id}"
    description: "Get a coverage policy"
    roles: [Coordinator, Sitter]
    code: 200
    input: []
    output: CoveragePolicy
    side_effects: []

  # ---- Bookings ----
  - method: POST
    path: "/home-watch/bookings"
    description: "Create a booking (recurring or vacation) in DRAFT"
    roles: [Coordinator, Client]
    code: 201
    input: [property_id, booking_type, "frequency?", start_date, end_date, base_visit_rate_cents]
    output: Booking
    side_effects: ["status = DRAFT; client_id inherited from property"]
  - method: GET
    path: "/home-watch/bookings"
    description: "List bookings (filter by property_id, client_id, sitter_id, status)"
    roles: [Coordinator, Client, Sitter]
    code: 200
    input: ["property_id?", "client_id?", "sitter_id?", "status?"]
    output: "Booking[]"
    side_effects: []
  - method: GET
    path: "/home-watch/bookings/{id}"
    description: "Get a booking"
    roles: [Coordinator, Client, Sitter]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: POST
    path: "/home-watch/bookings/{id}/submit"
    description: "Submit a DRAFT booking to the assignment pool"
    roles: [Coordinator, Client]
    code: 200
    input: []
    output: Booking
    side_effects: ["status → PENDING_ASSIGNMENT (VACATION overlap checked)"]
  - method: POST
    path: "/home-watch/bookings/{id}/assign"
    description: "Assign a sitter and generate visits + invoice"
    roles: [Coordinator]
    code: 200
    input: [sitter_id]
    output: Booking
    side_effects: ["status → SCHEDULED; sitter_id set; visits generated; DRAFT invoice created"]
  - method: POST
    path: "/home-watch/bookings/{id}/unassign"
    description: "Return a SCHEDULED booking to the assignment pool"
    roles: [Coordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["status → PENDING_ASSIGNMENT; SCHEDULED visits → CANCELLED; invoice → VOID; sitter_id cleared"]
  - method: POST
    path: "/home-watch/bookings/{id}/activate"
    description: "Activate a scheduled booking (keys ready)"
    roles: [Coordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["status → ACTIVE; invoice → ISSUED"]
  - method: POST
    path: "/home-watch/bookings/{id}/complete"
    description: "Complete an active booking; finalize charges"
    roles: [Coordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["status → COMPLETED; final charges recomputed; invoice financials recomputed"]
  - method: POST
    path: "/home-watch/bookings/{id}/cancel"
    description: "Cancel a booking with cascade"
    roles: [Coordinator, Client]
    code: 200
    input: []
    output: Booking
    side_effects: ["status → CANCELLED; non-terminal visits → CANCELLED; DONE-visit charges reversed; invoice → VOID; checked-out key returned"]

  # ---- Visits ----
  - method: GET
    path: "/home-watch/visits"
    description: "List visits (filter by booking_id, property_id, sitter_id, status)"
    roles: [Coordinator, Client, Sitter]
    code: 200
    input: ["booking_id?", "property_id?", "sitter_id?", "status?"]
    output: "Visit[]"
    side_effects: []
  - method: GET
    path: "/home-watch/visits/{id}"
    description: "Get a visit"
    roles: [Coordinator, Client, Sitter]
    code: 200
    input: []
    output: Visit
    side_effects: []
  - method: POST
    path: "/home-watch/visits/{id}/check-in"
    description: "Sitter checks in (geofence + key verified)"
