# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Wine-Storage & Cellar Management — 9 rule_ids x 2 instances = 18 instances
# Every ground resolves into SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls /
# trigger chain drives empty-DB -> the described state using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: appraisal_market_vs_replacement_diverge
        grounds:
          - calculations.appraisal_valuation
          - entities.Appraisal.fields.assessed_value_cents
        distinguishing_aspect: "Identical base_value_cents 5000000 yields MARKET_COMPARABLE assessed 5000000 vs REPLACEMENT_COST assessed 6000000 on the Bottle-valuation domain — a 1000000-cent divergence from the same input."
        test_recipe:
          setup:
            - "One member with an ASSIGNED locker holding one STORED bottle."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ava Cork", email: "ava@x.com", membership_tier: "RESERVE" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "A-01", size_tier: "LARGE", climate_zone: "RED", capacity_bottles: 6 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Ch. Latour", vintage_year: 2015, varietal: "Cabernet", format_ml: 750, drink_window_start_year: 2020, drink_window_end_year: 2040 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /appraisals"
              payload: { bottle_id: "${b_id}", method: "MARKET_COMPARABLE", base_value_cents: 5000000 }
              as: Appraiser
              as_user_id: "appraiser-alpha"
              captures: { ap_market_assessed: $.data.assessed_value_cents }
            - call: "POST /appraisals"
              payload: { bottle_id: "${b_id}", method: "REPLACEMENT_COST", base_value_cents: 5000000 }
              as: Appraiser
              as_user_id: "appraiser-alpha"
              captures: { ap_repl_assessed: $.data.assessed_value_cents }
          assert:
            - "ap_market_assessed == 5000000"
            - "ap_repl_assessed == 6000000"
            - "ap_repl_assessed - ap_market_assessed == 1000000"

      - name: consignment_provisional_vs_final_proceeds_diverge
        grounds:
          - calculations.consignment_proceeds
          - entities.Consignment.fields.estimated_proceeds_cents
          - entities.Consignment.fields.net_proceeds_cents
        distinguishing_aspect: "Provisional proceeds over offer_price 4000000 (20% tier) = 3104000, but final proceeds over hammer_price 6000000 (15% tier) = 4947000 — same Consignment, two prices, different payouts on the Member-payout domain (distinct from appraisal's Bottle domain)."
        test_recipe:
          setup:
            - "A STORED, DOCUMENTED bottle owned by an active member; a consignment listed then offered at 4000000 and accepted."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Bo Rioja", email: "bo@x.com", membership_tier: "PREMIUM" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "B-02", size_tier: "MEDIUM", climate_zone: "RED", capacity_bottles: 4 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "DRC", vintage_year: 2012, varietal: "Pinot Noir", format_ml: 750, drink_window_start_year: 2018, drink_window_end_year: 2038, provenance_status: "DOCUMENTED" }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id }
            - call: "POST /consignments"
              payload: { bottle_id: "${b_id}", reserve_price_cents: 3000000 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { cn_id: $.data.id }
            - call: "POST /consignments/${cn_id}/list"
              payload: {}
              as: AuctionBroker
            - call: "POST /consignments/${cn_id}/offer"
              payload: { offer_price_cents: 4000000 }
              as: AuctionBroker
            - call: "POST /consignments/${cn_id}/accept"
              payload: {}
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { est_proceeds: $.data.estimated_proceeds_cents }
          trigger:
            - call: "POST /consignments/${cn_id}/settle"
              payload: { hammer_price_cents: 6000000 }
              as: AuctionBroker
              captures: { net_proceeds: $.data.net_proceeds_cents, comm_pct: $.data.commission_pct }
          assert:
            - "est_proceeds == 3104000"
            - "net_proceeds == 4947000"
            - "comm_pct == 0.15"

  - rule_id: combinatorial_formula
    instances:
      - name: storage_fee_tier_climate_occupancy_clamp
        grounds:
          - calculations.storage_fee
          - entities.Locker.fields.monthly_fee_cents
          - entities.Locker.fields.occupancy_status
        distinguishing_aspect: "storage_fee combines three interacting inputs — LARGE base 6000 x SPARKLING 1.30 x FULL surcharge 1.10 = 8580 — then clamps to [2500, 9000]; mode (a) non-linear multi-input with nested min/max."
        test_recipe:
          setup:
            - "A LARGE/SPARKLING locker of capacity 1, assigned, driven to FULL by one stored bottle."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Cy Brut", email: "cy@x.com", membership_tier: "RESERVE" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "C-03", size_tier: "LARGE", climate_zone: "SPARKLING", capacity_bottles: 1 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
          trigger:
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Krug", vintage_year: 2008, varietal: "Champagne Blend", format_ml: 750, drink_window_start_year: 2016, drink_window_end_year: 2035 }
              as: CellarMember
              as_user_id: "${m_id}"
            - call: "GET /lockers/${lk_id}"
              payload: {}
              as: CellarManager
              captures: { fee: $.data.monthly_fee_cents, occ: $.data.occupancy_status }
          assert:
            - "occ == FULL"
            - "fee == 8580"

      - name: insurance_premium_round_per_bottle_then_sum
        grounds:
          - calculations.insurance_premium
          - entities.InsurancePolicy.fields.premium_cents
          - entities.InsurancePolicy.fields.insured_value_cents
        distinguishing_aspect: "Two DOCUMENTED bottles each appraised 700 at FULL tier: round-per-bottle (11 + 11 = 22) not sum-then-round (round(10.5 + 10.5) = 21); the pinned per-line rounding order makes premium_cents == 22."
        test_recipe:
          setup:
            - "One member owns two STORED bottles, each with a FINALIZED appraisal of assessed_value_cents 700."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Di Barolo", email: "di@x.com", membership_tier: "PREMIUM" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "D-04", size_tier: "SMALL", climate_zone: "RED", capacity_bottles: 4 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Wine One", vintage_year: 2016, varietal: "Nebbiolo", format_ml: 750, drink_window_start_year: 2020, drink_window_end_year: 2040, provenance_status: "DOCUMENTED" }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b1_id: $.data.id, b1_v: $.data.version }
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Wine Two", vintage_year: 2016, varietal: "Nebbiolo", format_ml: 750, drink_window_start_year: 2020, drink_window_end_year: 2040, provenance_status: "DOCUMENTED" }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b2_id: $.data.id, b2_v: $.data.version }
            - call: "POST /appraisals"
              payload: { bottle_id: "${b1_id}", method: "MARKET_COMPARABLE", base_value_cents: 700 }
              as: Appraiser
              as_user_id: "appraiser-alpha"
              captures: { ap1_id: $.data.id }
            - call: "POST /appraisals/${ap1_id}/finalize"
              payload: { expected_bottle_version: "${b1_v}" }
              as: Appraiser
              as_user_id: "appraiser-beta"
            - call: "POST /appraisals"
              payload: { bottle_id: "${b2_id}", method: "MARKET_COMPARABLE", base_value_cents: 700 }
              as: Appraiser
              as_user_id: "appraiser-alpha"
              captures: { ap2_id: $.data.id }
            - call: "POST /appraisals/${ap2_id}/finalize"
              payload: { expected_bottle_version: "${b2_v}" }
              as: Appraiser
              as_user_id: "appraiser-beta"
          trigger:
            - call: "POST /insurance-policies"
              payload: { member_id: "${m_id}", coverage_tier: "FULL", covered_bottle_ids: ["${b1_id}", "${b2_id}"] }
              as: InsuranceAgent
              captures: { premium: $.data.premium_cents, insured: $.data.insured_value_cents }
          assert:
            - "insured == 1400"
            - "premium == 22"

  - rule_id: non_linear_state_machine
    instances:
      - name: member_active_suspended_active_cycle
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Member.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "Member cycles ACTIVE -> SUSPENDED -> ACTIVE on the same row (a true cycle, not a linear pipeline); final status is ACTIVE again."
        test_recipe:
          setup:
            - "One ACTIVE member."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ed Merlot", email: "ed@x.com", membership_tier: "STANDARD" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
          trigger:
            - call: "POST /members/${m_id}/suspend"
              payload: {}
              as: CellarManager
              captures: { st_suspended: $.data.status }
            - call: "POST /members/${m_id}/reactivate"
              payload: {}
              as: CellarManager
              captures: { st_reactivated: $.data.status }
          assert:
            - "st_suspended == SUSPENDED"
            - "st_reactivated == ACTIVE"

      - name: consignment_offer_counter_offer_loop
        grounds:
          - state_machines.Consignment.OFFERED_to_COUNTERED
          - state_machines.Consignment.COUNTERED_to_OFFERED
        distinguishing_aspect: "Consignment loops OFFERED -> COUNTERED -> OFFERED (negotiation cycle on the Consignment entity, distinct from Member's cycle); after the second offer status is OFFERED with offer_price_cents 5200000."
        test_recipe:
          setup:
            - "A DOCUMENTED, STORED bottle listed as a consignment, already at OFFERED once."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Fi Syrah", email: "fi@x.com", membership_tier: "PREMIUM" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "F-06", size_tier: "MEDIUM", climate_zone: "RED", capacity_bottles: 4 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Hermitage", vintage_year: 2010, varietal: "Syrah", format_ml: 750, drink_window_start_year: 2016, drink_window_end_year: 2040, provenance_status: "DOCUMENTED" }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id }
            - call: "POST /consignments"
              payload: { bottle_id: "${b_id}", reserve_price_cents: 4000000 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { cn_id: $.data.id }
            - call: "POST /consignments/${cn_id}/list"
              payload: {}
              as: AuctionBroker
            - call: "POST /consignments/${cn_id}/offer"
              payload: { offer_price_cents: 4500000 }
              as: AuctionBroker
          trigger:
            - call: "POST /consignments/${cn_id}/counter"
              payload: { counter_price_cents: 5500000 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { st_countered: $.data.status }
            - call: "POST /consignments/${cn_id}/offer"
              payload: { offer_price_cents: 5200000 }
              as: AuctionBroker
              captures: { st_offered: $.data.status, offer2: $.data.offer_price_cents }
          assert:
            - "st_countered == COUNTERED"
            - "st_offered == OFFERED"
            - "offer2 == 5200000"

  - rule_id: transitive_cascade
    instances:
      - name: member_suspend_freeze_cancel_release_depth3
        grounds:
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Locker.ASSIGNED_to_FROZEN
          - state_machines.MovementRequest.REQUESTED_to_CANCELLED
          - calculations.locker_occupancy
        distinguishing_aspect: "Suspend -> (hop1) locker ASSIGNED->FROZEN -> (hop2) its REQUESTED INTAKE request ->CANCELLED -> (hop3) reserved_bottles recomputed 3->0 so free_bottles 2->5; each hop is caused by the prior, depth 3."
        test_recipe:
          setup:
            - "ACTIVE member, ASSIGNED locker capacity 5, one REQUESTED INTAKE request quantity 3 (reserved_bottles 3, free_bottles 2)."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Gia Port", email: "gia@x.com", membership_tier: "RESERVE" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "G-07", size_tier: "LARGE", climate_zone: "RED", capacity_bottles: 5 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /movement-requests"
              payload: { member_id: "${m_id}", locker_id: "${lk_id}", request_type: "INTAKE", quantity: 3 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { mr_id: $.data.id }
          trigger:
            - call: "POST /members/${m_id}/suspend"
              payload: {}
              as: CellarManager
            - call: "GET /lockers/${lk_id}"
              payload: {}
              as: CellarManager
              captures: { lk_status: $.data.status, reserved: $.data.reserved_bottles, free: $.data.free_bottles }
            - call: "GET /movement-requests/${mr_id}"
              payload: {}
              as: CellarManager
              captures: { mr_status: $.data.status }
          assert:
            - "lk_status == FROZEN"
            - "mr_status == CANCELLED"
            - "reserved == 0"
            - "free == 5"

      - name: consignment_settle_sell_bottle_recompute_locker
        grounds:
          - state_machines.Consignment.ACCEPTED_to_SETTLED
          - state_machines.Bottle.CONSIGNED_to_SOLD
          - calculations.locker_occupancy
          - calculations.member_wallet_balance
        distinguishing_aspect: "Settle -> (hop1) Bottle CONSIGNED->SOLD with locker_id nulled -> (hop2) source locker occupied_bottles 1->0, free_bottles 2->3; a CREDIT of net_proceeds 4947000 also posts to the seller wallet."
        test_recipe:
          setup:
            - "Member owns one STORED, DOCUMENTED bottle in a capacity-3 locker (occupied 1, free 2); consignment accepted at offer 4000000."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Hal Cava", email: "hal@x.com", membership_tier: "PREMIUM" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "H-08", size_tier: "MEDIUM", climate_zone: "RED", capacity_bottles: 3 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Sassicaia", vintage_year: 2013, varietal: "Bordeaux Blend", format_ml: 750, drink_window_start_year: 2018, drink_window_end_year: 2040, provenance_status: "DOCUMENTED" }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id }
            - call: "POST /consignments"
              payload: { bottle_id: "${b_id}", reserve_price_cents: 3000000 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { cn_id: $.data.id }
            - call: "POST /consignments/${cn_id}/list"
              payload: {}
              as: AuctionBroker
            - call: "POST /consignments/${cn_id}/offer"
              payload: { offer_price_cents: 4000000 }
              as: AuctionBroker
            - call: "POST /consignments/${cn_id}/accept"
              payload: {}
              as: CellarMember
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /consignments/${cn_id}/settle"
              payload: { hammer_price_cents: 6000000 }
              as: AuctionBroker
              captures: { net: $.data.net_proceeds_cents }
            - call: "GET /bottles/${b_id}"
              payload: {}
              as: CellarManager
              captures: { b_status: $.data.status, b_locker: $.data.locker_id }
            - call: "GET /lockers/${lk_id}"
              payload: {}
              as: CellarManager
              captures: { occ_count: $.data.occupied_bottles, free: $.data.free_bottles }
            - call: "GET /members/${m_id}"
              payload: {}
              as: CellarManager
              captures: { wallet: $.data.wallet_balance_cents }
          assert:
            - "b_status == SOLD"
            - "b_locker == null"
            - "occ_count == 0"
            - "free == 3"
            - "net == 4947000"
            - "wallet == 4947000"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: list_referential_beats_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_PROVENANCE_NOT_DOCUMENTED]
          - errors[ERR_DRINK_WINDOW_NOT_OPEN]
        distinguishing_aspect: "On POST /consignments/{id}/list a bottle that is both UNVERIFIED (business_referential, priority 8) and TOO_YOUNG (business_temporal, priority 9) returns ERR_PROVENANCE_NOT_DOCUMENTED — the lower-priority-number referential check wins."
        test_recipe:
          setup:
            - "A STORED bottle with provenance UNVERIFIED and drink_window_start_year 2030 (TOO_YOUNG at clock 2026), wrapped in a DRAFT consignment."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ivy Gamay", email: "ivy@x.com", membership_tier: "STANDARD" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "I-09", size_tier: "SMALL", climate_zone: "RED", capacity_bottles: 3 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Young Cru", vintage_year: 2022, varietal: "Gamay", format_ml: 750, drink_window_start_year: 2030, drink_window_end_year: 2045, provenance_status: "UNVERIFIED" }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id }
            - call: "POST /consignments"
              payload: { bottle_id: "${b_id}", reserve_price_cents: 1000000 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { cn_id: $.data.id }
          trigger:
            - call: "POST /consignments/${cn_id}/list"
              payload: {}
              as: AuctionBroker
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PROVENANCE_NOT_DOCUMENTED"

      - name: settle_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OFFER_BELOW_RESERVE]
        distinguishing_aspect: "POST /consignments/{id}/settle on a LISTED (not ACCEPTED) consignment with hammer_price 1 < reserve 3000000 violates both state (priority 5) and business_fiscal (priority 11); ERR_INVALID_STATE wins."
        test_recipe:
          setup:
            - "A DOCUMENTED STORED bottle in a consignment that is only LISTED (never accepted), reserve 3000000."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Jo Tokaj", email: "jo@x.com", membership_tier: "PREMIUM" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "J-10", size_tier: "MEDIUM", climate_zone: "WHITE", capacity_bottles: 3 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Aszu", vintage_year: 2011, varietal: "Furmint", format_ml: 750, drink_window_start_year: 2016, drink_window_end_year: 2050, provenance_status: "DOCUMENTED" }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id }
            - call: "POST /consignments"
              payload: { bottle_id: "${b_id}", reserve_price_cents: 3000000 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { cn_id: $.data.id }
            - call: "POST /consignments/${cn_id}/list"
              payload: {}
              as: AuctionBroker
          trigger:
            - call: "POST /consignments/${cn_id}/settle"
              payload: { hammer_price_cents: 1 }
              as: AuctionBroker
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

  - rule_id: boundary_precision_check
    instances:
      - name: locker_capacity_exact_boundary
        grounds:
          - calculations.locker_occupancy
          - entities.Locker.fields.free_bottles
          - errors[ERR_LOCKER_CAPACITY_EXCEEDED]
        distinguishing_aspect: "A capacity-1 locker with one STORED bottle has occupied_bottles == capacity_bottles (1 == 1) so free_bottles == 0; the next POST /bottles is rejected with ERR_LOCKER_CAPACITY_EXCEEDED — boundary is == (free 0 blocks), not >."
        test_recipe:
          setup:
            - "A capacity-1 ASSIGNED locker already holding one STORED bottle (free_bottles 0)."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ky Rose", email: "ky@x.com", membership_tier: "STANDARD" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "K-11", size_tier: "SMALL", climate_zone: "RED", capacity_bottles: 1 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "First Fill", vintage_year: 2015, varietal: "Rose", format_ml: 750, drink_window_start_year: 2016, drink_window_end_year: 2030 }
              as: CellarMember
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Overflow", vintage_year: 2015, varietal: "Rose", format_ml: 750, drink_window_start_year: 2016, drink_window_end_year: 2030 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_LOCKER_CAPACITY_EXCEEDED"

      - name: drink_window_year_inclusive_boundary
        grounds:
          - calculations.drink_window_status
          - entities.Bottle.fields.drink_window_status
          - state_machines.Consignment.DRAFT_to_LISTED
        distinguishing_aspect: "At the default clock (2026-05-01) a bottle with drink_window_start_year 2026 has year == start_year, which is IN_WINDOW (inclusive lower bound), so POST /consignments/{id}/list succeeds; had start been 2027 it would be TOO_YOUNG and rejected."
        test_recipe:
          setup:
            - "Clock at default 2026-05-01; a STORED DOCUMENTED bottle whose drink_window_start_year is exactly 2026, in a DRAFT consignment."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Lo Grand", email: "lo@x.com", membership_tier: "RESERVE" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "L-12", size_tier: "MEDIUM", climate_zone: "RED", capacity_bottles: 3 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Just Ready", vintage_year: 2016, varietal: "Cabernet", format_ml: 750, drink_window_start_year: 2026, drink_window_end_year: 2040, provenance_status: "DOCUMENTED" }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id }
            - call: "POST /consignments"
              payload: { bottle_id: "${b_id}", reserve_price_cents: 2000000 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { cn_id: $.data.id }
          trigger:
            - call: "GET /bottles/${b_id}"
              payload: {}
              as: CellarManager
              captures: { dws: $.data.drink_window_status }
            - call: "POST /consignments/${cn_id}/list"
              payload: {}
              as: AuctionBroker
              captures: { cn_status: $.data.status }
          assert:
            - "dws == IN_WINDOW"
            - "cn_status == LISTED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: assign_requires_member_active
        grounds:
          - state_machines.Locker.AVAILABLE_to_ASSIGNED
          - validations[priority=7]
          - errors[ERR_MEMBER_NOT_ACTIVE]
        distinguishing_aspect: "POST /lockers/{id}/assign on a PENDING (not activated) member is rejected with ERR_MEMBER_NOT_ACTIVE — Locker's transition depends on Member.status (entity pair Locker->Member)."
        test_recipe:
          setup:
            - "A PENDING member (never activated) and an AVAILABLE locker."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Mo Pending", email: "mo@x.com", membership_tier: "STANDARD" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /lockers"
              payload: { label: "M-13", size_tier: "SMALL", climate_zone: "RED", capacity_bottles: 2 }
              as: CellarManager
              captures: { lk_id: $.data.id }
          trigger:
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MEMBER_NOT_ACTIVE"

      - name: list_requires_bottle_stored
        grounds:
          - state_machines.Consignment.DRAFT_to_LISTED
          - validations[priority=8]
          - errors[ERR_BOTTLE_NOT_STORED]
        distinguishing_aspect: "POST /consignments/{id}/list on a bottle already CONSIGNED (via a prior listing) fails ERR_BOTTLE_NOT_STORED — Consignment's transition depends on Bottle.status (entity pair Consignment->Bottle, distinct from Locker->Member)."
        test_recipe:
          setup:
            - "A DOCUMENTED bottle already CONSIGNED under a first listed consignment; a second DRAFT consignment on the same bottle."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ned Douro", email: "ned@x.com", membership_tier: "PREMIUM" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "N-14", size_tier: "MEDIUM", climate_zone: "RED", capacity_bottles: 3 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Vintage Port", vintage_year: 2011, varietal: "Touriga", format_ml: 750, drink_window_start_year: 2016, drink_window_end_year: 2060, provenance_status: "DOCUMENTED" }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id }
            - call: "POST /consignments"
              payload: { bottle_id: "${b_id}", reserve_price_cents: 2000000 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { cn1_id: $.data.id }
            - call: "POST /consignments/${cn1_id}/list"
              payload: {}
              as: AuctionBroker
            - call: "POST /consignments"
              payload: { bottle_id: "${b_id}", reserve_price_cents: 2500000 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { cn2_id: $.data.id }
          trigger:
            - call: "POST /consignments/${cn2_id}/list"
              payload: {}
              as: AuctionBroker
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_BOTTLE_NOT_STORED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: courier_slot_half_open_overlap
        grounds:
          - calculations.courier_slot_overlap
          - errors[ERR_COURIER_SLOT_CONFLICT]
          - entities.DeliveryOrder.fields.courier_ref
        distinguishing_aspect: "Second DeliveryOrder on courier CX-1 with slot [11:00,13:00) overlaps the first's [10:00,12:00) because 11:00 < 12:00 and 10:00 < 13:00; ERR_COURIER_SLOT_CONFLICT. Half-open, zero-buffer — pure adjacency would pass."
        test_recipe:
          setup:
            - "One member with two WITHDRAWN bottles; a first SCHEDULED delivery on courier CX-1 for slot [2026-06-01T10:00Z, 2026-06-01T12:00Z)."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ori Loire", email: "ori@x.com", membership_tier: "PREMIUM" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "O-15", size_tier: "MEDIUM", climate_zone: "WHITE", capacity_bottles: 3 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Sancerre", vintage_year: 2019, varietal: "Sauvignon Blanc", format_ml: 750, drink_window_start_year: 2020, drink_window_end_year: 2030 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Vouvray", vintage_year: 2018, varietal: "Chenin Blanc", format_ml: 750, drink_window_start_year: 2020, drink_window_end_year: 2032 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /movement-requests"
              payload: { member_id: "${m_id}", locker_id: "${lk_id}", request_type: "WITHDRAWAL", quantity: 2, bottle_ids: ["${b1_id}", "${b2_id}"] }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { mr_id: $.data.id }
            - call: "POST /movement-requests/${mr_id}/approve"
              payload: {}
              as: CellarManager
            - call: "POST /movement-requests/${mr_id}/complete"
              payload: {}
              as: CellarManager
            - call: "POST /delivery-orders"
              payload: { member_id: "${m_id}", bottle_ids: ["${b1_id}"], courier_ref: "CX-1", slot_start: "2026-06-01T10:00:00Z", slot_end: "2026-06-01T12:00:00Z" }
              as: CellarManager
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /delivery-orders"
              payload: { member_id: "${m_id}", bottle_ids: ["${b2_id}"], courier_ref: "CX-1", slot_start: "2026-06-01T11:00:00Z", slot_end: "2026-06-01T13:00:00Z" }
              as: CellarManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COURIER_SLOT_CONFLICT"

      - name: maintenance_window_closed_buffer_overlap
        grounds:
          - calculations.maintenance_window_overlap
          - errors[ERR_MAINTENANCE_WINDOW_CONFLICT]
          - entities.MaintenanceWindow.fields.window_start
        distinguishing_aspect: "A second MaintenanceWindow [13:00,14:00] starts only 60 minutes after the first's 12:00 end — inside the 120-minute MAINTENANCE_BUFFER_MINUTES — so it is rejected with ERR_MAINTENANCE_WINDOW_CONFLICT; closed-interval-plus-buffer semantics (unlike courier adjacency which is allowed)."
        test_recipe:
          setup:
            - "A locker with one SCHEDULED maintenance window [2026-06-01T10:00Z, 2026-06-01T12:00Z]."
          setup_api_calls:
            - call: "POST /lockers"
              payload: { label: "P-16", size_tier: "LARGE", climate_zone: "RED", capacity_bottles: 5 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { locker_id: "${lk_id}", window_start: "2026-06-01T10:00:00Z", window_end: "2026-06-01T12:00:00Z", reason: "coil service" }
              as: CellarManager
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /maintenance-windows"
              payload: { locker_id: "${lk_id}", window_start: "2026-06-01T13:00:00Z", window_end: "2026-06-01T14:00:00Z", reason: "sensor swap" }
              as: CellarManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MAINTENANCE_WINDOW_CONFLICT"

  - rule_id: compensating_invariant
    instances:
      - name: intake_reservation_conserved
        grounds:
          - calculations.locker_occupancy
          - state_machines.MovementRequest.REQUESTED_to_CANCELLED
          - entities.Locker.fields.free_bottles
          - entities.Locker.fields.reserved_bottles
        distinguishing_aspect: "Conserved quantity occupied_bottles + reserved_bottles + free_bottles == capacity_bottles (5). An INTAKE reservation of 3 (free 5->2) paired with its cancel (free 2->5) leaves free_bottles back at 5 and reserved_bottles 0 — bottle-count conservation."
        test_recipe:
          setup:
            - "ACTIVE member, ASSIGNED empty capacity-5 locker (free_bottles 5)."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Ro Rhone", email: "ro@x.com", membership_tier: "RESERVE" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "R-17", size_tier: "LARGE", climate_zone: "RED", capacity_bottles: 5 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
          trigger:
            - call: "POST /movement-requests"
              payload: { member_id: "${m_id}", locker_id: "${lk_id}", request_type: "INTAKE", quantity: 3 }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { mr_id: $.data.id }
            - call: "GET /lockers/${lk_id}"
              payload: {}
              as: CellarManager
              captures: { reserved_mid: $.data.reserved_bottles, free_mid: $.data.free_bottles }
            - call: "POST /movement-requests/${mr_id}/cancel"
              payload: {}
              as: CellarMember
              as_user_id: "${m_id}"
            - call: "GET /lockers/${lk_id}"
              payload: {}
              as: CellarManager
              captures: { reserved_end: $.data.reserved_bottles, free_end: $.data.free_bottles }
          assert:
            - "reserved_mid == 3"
            - "free_mid == 2"
            - "reserved_end == 0"
            - "free_end == 5"

      - name: wallet_ledger_conserved
        grounds:
          - calculations.member_wallet_balance
          - state_machines.InsurancePolicy.QUOTED_to_BOUND
          - state_machines.InsurancePolicy.BOUND_to_CANCELLED
          - entities.Member.fields.wallet_balance_cents
        distinguishing_aspect: "Conserved quantity wallet_balance_cents. Binding a premium-11 policy posts DEBIT 11 (wallet 0->-11); cancelling posts the compensating CREDIT 11 (wallet -11->0); net drift 0 — money conservation, distinct from the bottle-count invariant."
        test_recipe:
          setup:
            - "Member (wallet 0) owns one STORED DOCUMENTED bottle with a FINALIZED appraisal 700; a QUOTED FULL policy with premium_cents 11 over that bottle."
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Su Alsace", email: "su@x.com", membership_tier: "PREMIUM" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "S-18", size_tier: "SMALL", climate_zone: "WHITE", capacity_bottles: 2 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Riesling GC", vintage_year: 2017, varietal: "Riesling", format_ml: 750, drink_window_start_year: 2020, drink_window_end_year: 2040, provenance_status: "DOCUMENTED" }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /appraisals"
              payload: { bottle_id: "${b_id}", method: "MARKET_COMPARABLE", base_value_cents: 700 }
              as: Appraiser
              as_user_id: "appraiser-alpha"
              captures: { ap_id: $.data.id }
            - call: "POST /appraisals/${ap_id}/finalize"
              payload: { expected_bottle_version: "${b_v}" }
              as: Appraiser
              as_user_id: "appraiser-beta"
            - call: "POST /insurance-policies"
              payload: { member_id: "${m_id}", coverage_tier: "FULL", covered_bottle_ids: ["${b_id}"] }
              as: InsuranceAgent
              captures: { pol_id: $.data.id, prem: $.data.premium_cents }
          trigger:
            - call: "POST /insurance-policies/${pol_id}/bind"
              payload: {}
              as: InsuranceAgent
            - call: "GET /members/${m_id}"
              payload: {}
              as: CellarManager
              captures: { wallet_after_bind: $.data.wallet_balance_cents }
            - call: "POST /insurance-policies/${pol_id}/cancel"
              payload: {}
              as: InsuranceAgent
            - call: "GET /members/${m_id}"
              payload: {}
              as: CellarManager
              captures: { wallet_after_cancel: $.data.wallet_balance_cents }
          assert:
            - "prem == 11"
            - "wallet_after_bind == -11"
            - "wallet_after_cancel == 0"

