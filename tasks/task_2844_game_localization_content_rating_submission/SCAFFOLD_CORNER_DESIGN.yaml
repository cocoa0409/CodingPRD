  # =========================================================================
  # 6. Errors
  # =========================================================================
  - section: errors
    instances:
      - name: every_entity_type_has_its_own_reachable_not_found_error
        claim_type: error_triggerable
        grounds:
          - errors[ERR_STRING_KEY_NOT_FOUND]
          - errors[ERR_TRANSLATION_UNIT_NOT_FOUND]
          - errors[ERR_SESSION_NOT_FOUND]
          - errors[ERR_QA_PASS_NOT_FOUND]
          - errors[ERR_BUG_NOT_FOUND]
          - errors[ERR_SUBMISSION_NOT_FOUND]
          - errors[ERR_CONTENT_EDIT_NOT_FOUND]
        distinguishing_aspect: "Twelve entities carry twelve distinct 404 codes; a shared ERR_NOT_FOUND is wrong. The store is deliberately non-empty (a real Title and StringKey exist), so each 404 must come from the id lookup and not from an empty table."
        test_recipe:
          setup:
            - "One real Title with one StringKey, so every table probed below is reachable and only the ids are fabricated."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-73", name: "Nova Drift 73", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { key_id: "$.data.id" }
          trigger:
            - call: "GET /titles/00000000-0000-4000-8000-00000000ff01"
              payload: {}
              as: LocalizationProducer
              captures: { e_title: "$.data.error_id" }
            - call: "GET /market-plans/00000000-0000-4000-8000-00000000ff02"
              payload: {}
              as: LocalizationProducer
              captures: { e_plan: "$.data.error_id" }
            - call: "GET /string-keys/00000000-0000-4000-8000-00000000ff03"
              payload: {}
              as: LocalizationProducer
              captures: { e_key: "$.data.error_id" }
            - call: "GET /translation-units/00000000-0000-4000-8000-00000000ff04"
              payload: {}
              as: TranslationVendor
              captures: { e_unit: "$.data.error_id" }
            - call: "GET /booths/00000000-0000-4000-8000-00000000ff05"
              payload: {}
              as: LocalizationProducer
              captures: { e_booth: "$.data.error_id" }
            - call: "GET /voice-talents/00000000-0000-4000-8000-00000000ff06"
              payload: {}
              as: LocalizationProducer
              captures: { e_talent: "$.data.error_id" }
            - call: "GET /talent-contracts/00000000-0000-4000-8000-00000000ff07"
              payload: {}
              as: LocalizationProducer
              captures: { e_contract: "$.data.error_id" }
            - call: "GET /voice-sessions/00000000-0000-4000-8000-00000000ff08"
              payload: {}
              as: LocalizationProducer
              captures: { e_session: "$.data.error_id" }
            - call: "GET /qa-passes/00000000-0000-4000-8000-00000000ff09"
              payload: {}
              as: LqaTester
              as_user_id: "lqa-1"
              captures: { e_pass: "$.data.error_id" }
            - call: "GET /lqa-bugs/00000000-0000-4000-8000-00000000ff0a"
              payload: {}
              as: LqaTester
              as_user_id: "lqa-1"
              captures: { e_bug: "$.data.error_id" }
            - call: "GET /rating-submissions/00000000-0000-4000-8000-00000000ff0b"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { e_sub: "$.data.error_id" }
            - call: "GET /content-edits/00000000-0000-4000-8000-00000000ff0c"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { e_edit: "$.data.error_id" }
            - call: "POST /qa-passes/00000000-0000-4000-8000-00000000ff09/close"
              payload: {}
              as: LqaTester
              as_user_id: "lqa-2"
              captures: { e_pass_action: "$.data.error_id" }
          assert:
            - "the twelve GETs return HTTP 404 with error_id ERR_TITLE_NOT_FOUND, ERR_MARKET_PLAN_NOT_FOUND, ERR_STRING_KEY_NOT_FOUND, ERR_TRANSLATION_UNIT_NOT_FOUND, ERR_BOOTH_NOT_FOUND, ERR_TALENT_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_QA_PASS_NOT_FOUND, ERR_BUG_NOT_FOUND, ERR_SUBMISSION_NOT_FOUND and ERR_CONTENT_EDIT_NOT_FOUND respectively - twelve different codes, one per entity"
            - "the action call on a non-existent pass also returns ERR_QA_PASS_NOT_FOUND (404) rather than a state error: priority 30 resolves the path id before any state check at 42"
            - "GET /string-keys/${key_id} still returns HTTP 200, proving the 404s above were id lookups and not a mis-wired route"
            - "every error body carries error_id and message under data, per the §1.0 envelope"

      - name: duplicate_title_code_is_global_while_duplicate_string_key_is_per_title
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_TITLE_CODE]
          - errors[ERR_DUPLICATE_STRING_KEY]
          - validations[priority 40]
        distinguishing_aspect: "The two 409s at priority 40 have different scopes: title_code is unique across the whole system, but key_name is unique only within its Title - so the same key_name in a second Title must succeed. Collapsing both into one global-uniqueness check breaks the second half."
        test_recipe:
          setup:
            - "Two Titles NOVA-74A and NOVA-74B; NOVA-74A owns the key menu.start."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-74A", name: "Nova Drift 74 A", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_a: "$.data.id" }
            - call: "POST /titles"
              payload: { title_code: "NOVA-74B", name: "Nova Drift 74 B", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_b: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_a}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { key_a: "$.data.id" }
          trigger:
            - call: "POST /titles"
              payload: { title_code: "NOVA-74A", name: "Nova Drift 74 A reprise", source_language: "JA", target_release_utc: "2027-01-01T00:00:00Z", release_mode: "SIMULTANEOUS" }
              as: LocalizationProducer
              captures: { e_title_code: "$.data.error_id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_a}", key_name: "menu.start", source_text: "Begin Game", source_char_count: 100, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 90 }
              as: LocalizationProducer
              captures: { e_key_dup: "$.data.error_id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_b}", key_name: "menu.start", source_text: "Start Game", source_char_count: 125, ui_surface: "MENU", display_char_limit: 140, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { key_b: "$.data.id", key_b_title: "$.data.title_id" }
          assert:
            - "re-using title_code NOVA-74A returns HTTP 409 with error_id == ERR_DUPLICATE_TITLE_CODE even though every other field differs"
            - "re-using key_name menu.start inside ${title_a} returns HTTP 409 with error_id == ERR_DUPLICATE_STRING_KEY"
            - "the same key_name under ${title_b} returns HTTP 201 with title_id == ${title_b} - key uniqueness is scoped to the parent Title"
            - "Title.${title_a} still has exactly one StringKey after the rejected duplicate: a 409 must not create a partial row"

      - name: talent_agent_ownership_and_the_draft_only_signing_window
        claim_type: error_triggerable
        grounds:
          - errors[ERR_OWNERSHIP_VIOLATION]
          - errors[ERR_CONTRACT_NOT_DRAFT]
          - roles[TalentAgent]
        distinguishing_aspect: "TalentAgent is entity-backed: the acting X-User-ID must equal the contract's voice_talent_id, so agent B signing A's contract is a 403 at priority 36 - before the state check at 42. Once signed, a second sign is ERR_CONTRACT_NOT_DRAFT, and terminate on a DRAFT contract raises the SAME code from the opposite direction."
        test_recipe:
          setup:
            - "Title NOVA-75, talents A (JA) and B (KO), one DRAFT contract per talent for that title."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-75", name: "Nova Drift 75", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /voice-talents"
              payload: { talent_name: "Miki Sato", language_code: "JA", union_flag: false, max_daily_recording_minutes: 240 }
              as: LocalizationProducer
              captures: { talent_a: "$.data.id", talent_a_v: "$.data.version" }
            - call: "POST /voice-talents"
              payload: { talent_name: "Ji-hoon Park", language_code: "KO", union_flag: true, max_daily_recording_minutes: 180 }
              as: LocalizationProducer
              captures: { talent_b: "$.data.id", talent_b_v: "$.data.version" }
            - call: "POST /talent-contracts"
              payload: { voice_talent_id: "${talent_a}", title_id: "${title_id}", territory_scope: ["JP"], media_scope: "IN_GAME_AND_TRAILER", buyout_fee_cents: 400000, per_line_rate_cents: 200, rights_start_utc: "2026-08-01T00:00:00Z", rights_end_utc: "2026-12-31T00:00:00Z", expected_voice_talent_version: "${talent_a_v}" }
              as: LocalizationProducer
              captures: { contract_a: "$.data.id" }
            - call: "POST /talent-contracts"
              payload: { voice_talent_id: "${talent_b}", title_id: "${title_id}", territory_scope: ["KR"], media_scope: "IN_GAME_ONLY", buyout_fee_cents: 300000, per_line_rate_cents: 150, rights_start_utc: "2026-08-01T00:00:00Z", rights_end_utc: "2026-12-31T00:00:00Z", expected_voice_talent_version: "${talent_b_v}" }
              as: LocalizationProducer
              captures: { contract_b: "$.data.id" }
          trigger:
            - call: "POST /talent-contracts/${contract_a}/sign"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_b}"
              captures: { e_ownership: "$.data.error_id" }
            - call: "POST /talent-contracts/${contract_a}/sign"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_a}"
              captures: { signed_status: "$.data.status" }
            - call: "POST /talent-contracts/${contract_a}/sign"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_a}"
              captures: { e_not_draft: "$.data.error_id" }
            - call: "POST /talent-contracts/${contract_b}/terminate"
              payload: {}
              as: LocalizationProducer
              captures: { e_terminate_draft: "$.data.error_id" }
            - call: "POST /talent-contracts/${contract_a}/terminate"
              payload: {}
              as: LocalizationProducer
              captures: { terminated_status: "$.data.status" }
          assert:
            - "agent B signing contract A returns HTTP 403 with error_id == ERR_OWNERSHIP_VIOLATION and the contract stays DRAFT"
            - "agent A signing the same contract returns HTTP 200 with status == SIGNED and signed_at_utc == 2026-08-01T00:00:00Z"
            - "the repeat sign returns HTTP 409 with error_id == ERR_CONTRACT_NOT_DRAFT - the ownership check at 36 passed, so the state check at 42 is what fires"
            - "terminate on the still-DRAFT contract B returns HTTP 409 with the SAME error_id ERR_CONTRACT_NOT_DRAFT, because that code covers both 'sign requires DRAFT' and 'terminate requires SIGNED'"
            - "terminate on the SIGNED contract A returns HTTP 200 with status == TERMINATED"

      - name: rights_window_and_single_utc_date_are_two_separate_session_guards
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CONTRACT_RIGHTS_WINDOW_EXCEEDED]
          - errors[ERR_SESSION_SPANS_TWO_DATES]
          - validations[priority 55]
          - validations[priority 56]
        distinguishing_aspect: "Priorities 55 and 56 are adjacent but independent: a window that ends after rights_end_utc is a 55 even if it sits on one date, and a window fully inside the rights period is still a 56 if it crosses midnight. A 22:00-23:59 booking on the last covered day must be accepted."
