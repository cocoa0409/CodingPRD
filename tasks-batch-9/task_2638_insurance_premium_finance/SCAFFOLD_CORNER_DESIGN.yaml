      - name: conditional_action_endorsement_financing_requires_a_pending_endorsement
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/agreements/{id}/endorsement-financings
          - validations.priority_42_ERR_NO_PENDING_ENDORSEMENTS
          - state_machines.PremiumEndorsement
        distinguishing_aspect: |
          Financing endorsements is a conditional action whose gate is a POPULATION, not a status:
          it needs at least one PENDING endorsement sitting on a VERIFIED policy of the note. The same
          call is therefore refused, refused again, and then accepted against an agreement that never
          changed status. The middle leg is the discriminator — an endorsement that exists but has been
          DECLINED must not satisfy the gate, so an implementation that tests for the existence of any
          endorsement row rather than a PENDING one wrongly re-prices the note off a dead amendment.
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15 and the canonical TX regime has an effective License"
