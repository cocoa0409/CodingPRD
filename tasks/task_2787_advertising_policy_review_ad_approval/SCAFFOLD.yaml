    path: "/ad-policy/review-tasks/{id}/requeue"
    description: "Return an ESCALATED task to its queue, bumping cycle_count and re-deriving priority_score and sla_deadline_at"
    roles: [PolicyAdmin]
    code: 200
    input: []
    output: ReviewTask
    side_effects: ["status ESCALATED -> QUEUED, cycle_count + 1, resolution reset to PENDING", "recomputes priority_score against current advertiser state and sla_deadline_at = logical clock + review_sla_hours", "increments ReviewTask.version by 1"]

