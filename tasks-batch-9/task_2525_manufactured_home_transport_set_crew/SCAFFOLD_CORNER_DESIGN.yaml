      - name: installation_invoice_full_waterfall_correct_result
        claim_type: correct_result
        grounds:
          - calculations.installation_invoice_total
          - endpoints[POST /installations/set-jobs/{id}/scope-split]
          - endpoints[POST /installations/set-jobs/{id}/utility-crossover]
          - endpoints[POST /installations/set-jobs/{id}/final-inspection]
          - entities.SetJob.fields.invoice_total_cents
        distinguishing_aspect: |
          The eight-step waterfall run end to end on one job: skirting 52 ft at
          1850 = 96200, one set of steps = 42000, crossover 60000 + 3 x 18000 =
          114000, so the tier basis is 480000 + 138200 + 114000 = 732200, which
          selects the 6 percent tier, waives the crossover line entirely, and
          discounts 6 percent OF THE PRE-WAIVER 732200 (43932) rather than of the
          618200 billable base - final invoice 574268. Discounting the billable
          base instead would produce 581108, and re-evaluating the tier after the
          waiver would drop to 3 percent and produce 599654.
