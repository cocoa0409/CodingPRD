      - name: practice_block_completion_and_cancellation_are_single_shot_returns_409
        claim_type: Idempotency
        grounds:
          - state_machines.PracticeBlock.SCHEDULED_to_HELD
          - state_machines.PracticeBlock.SCHEDULED_to_CANCELLED
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_BLOCK_NOT_SCHEDULED]
          - errors[ERR_BLOCK_NOT_FINISHED]
          - entities.PracticeBlock.fields.cancel_reason
          - state_machines.Player.TRYOUT_INVITED_to_TRYOUT_COMPLETED
        distinguishing_aspect: |
          The same /complete call is refused with ERR_BLOCK_NOT_FINISHED before the block's
          ends_at, succeeds exactly once at ends_at, and is refused with ERR_BLOCK_NOT_SCHEDULED
          on the second attempt; /cancel on the now-HELD block is refused with the same
          ERR_BLOCK_NOT_SCHEDULED, and a CANCELLED sibling block cannot be completed either.
