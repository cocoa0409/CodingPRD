              captures: { sol_id: $.data.id }
            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car1_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ESSENTIAL_MINIMUM", weekly_round_trips: 12, seats_per_departure: 19, annual_subsidy_request_usd: 1200000.00, term_months: 12, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /eas/proposals/${p1_id}/actions"
              payload: { action: "SUBMIT" }
              as: Carrier
              as_user_id: "${car1_id}"
            - call: "POST /eas/solicitations/${sol_id}/actions"
              payload: { action: "CLOSE" }
              as: ProgramAdmin
            - call: "POST /eas/solicitations/${sol_id}/selection-order"
              payload: { order_note: "award to sole candidate" }
              as: SelectionOfficer
              as_user_id: "officer-1"
              captures: { agr_id: $.data.id }
            - call: "POST /eas/service-periods"
              payload: { agreement_id: "${agr_id}", period_month: "2026-08" }
              as: ProgramAdmin
              captures: { per1_id: $.data.id }
            - call: "POST /eas/service-periods/${per1_id}/report"
              payload: { scheduled_departures: 100, completed_departures: 100, cancelled_carrier_departures: 0, cancelled_weather_departures: 0, seats_offered: 1900, passengers_enplaned: 700 }
              as: Carrier
              as_user_id: "${car1_id}"
            - call: "POST /eas/service-periods/${per1_id}/certify"
              payload: { certification_note: "clean month" }
              as: ProgramAdmin
              captures: { pay1_id: $.data.id }
            - call: "POST /eas/rate-renegotiations"
              payload: { agreement_id: "${agr_id}", trigger_type: "COST_INCREASE", documented_cost_increase_pct: 0.0400, requested_annual_subsidy_usd: 1240000.00, justification: "insurance renewal" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { rn1_id: $.data.id }
          trigger:
            - call: "POST /eas/subsidy-payments/${pay1_id}/actions"
              payload: { action: "DISBURSE" }
              as: ProgramAdmin
              as_user_id: "admin-disburser"
              captures: { not_disbursable_error_id: $.data.error_id }
            - call: "POST /eas/subsidy-payments/${pay1_id}/actions"
              payload: { action: "APPROVE" }
              as: ProgramAdmin
              as_user_id: "admin-approver"
            - call: "POST /eas/subsidy-payments/${pay1_id}/actions"
