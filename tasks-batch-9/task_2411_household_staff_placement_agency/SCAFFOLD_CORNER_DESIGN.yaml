          full_name: Q. Ashe
          contact_email: qashe@mail.example
          primary_role_type: CHAUFFEUR
      asserts:
      - the trigger returns 400 with response_type == error and data == null
      - error_id == ERR_INVALID_REQUEST and message == "A required field is missing or null."
      - meta.api_request_id and meta.api_request_timestamp are both present on the error body
      - GET /candidates as VettingSpecialist returns total_count == 0
