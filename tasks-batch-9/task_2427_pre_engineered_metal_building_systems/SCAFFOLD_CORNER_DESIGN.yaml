          - endpoints[GET /orders/{id}/erection-sequence]
        distinguishing_aspect: "The projection is ordered by ERECTION_STAGE_SEQUENCE ascending and only then by created_at, so loads planned in reverse erection order come back sorted anyway; within the tied ANCHORAGE stage the earlier-created load wins, and blocked_load_count is measured against the smallest PLANNED stage_sequence rather than against the dispatched history."
        test_recipe:
          setup:
