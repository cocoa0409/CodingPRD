scaffold_corner_design:
  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_product_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Product.fields.sku, endpoints]
        distinguishing_aspect: "POST /products with all required fields -> 201; response has server-minted id, created_at, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "FG-E1", name: "Widget", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { p_id: $.data.id, p_v: $.data.version }
          assert:
            - "response.status == 201"
            - "Product.${p_id}.version == 1"
            - "Product.${p_id}.sku == FG-E1"

      - name: create_product_missing_sku_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Product.fields.sku, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required sku -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { name: "NoSku", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_product_invalid_enum_product_type_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Product.fields.product_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "product_type not in {FINISHED_GOOD,SUBASSEMBLY,RAW_MATERIAL} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "BAD", name: "Bad", product_type: "GADGET" }
              as: ManufacturingEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_product_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /products/{id} with unknown UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ManufacturingEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: product_defaults_lot_controlled_false_unit_cost_zero
        claim_type: Defaults
        grounds: [entities.Product.fields.lot_controlled, entities.Product.fields.unit_cost_cents]
        distinguishing_aspect: "Omitting lot_controlled and unit_cost_cents applies defaults false and 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "FG-DEF", name: "Def", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { p_id: $.data.id }
          assert:
            - "Product.${p_id}.lot_controlled == false"
            - "Product.${p_id}.unit_cost_cents == 0"

      - name: routing_initial_status_draft_operation_count_zero
        claim_type: System Fields
        grounds: [entities.Routing.fields.status, entities.Routing.fields.operation_count]
        distinguishing_aspect: "New routing initializes status=DRAFT and operation_count=0 (system/computed, input ignored)."
        test_recipe:
          setup: ["One FINISHED_GOOD product."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-RT", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
          trigger:
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-1" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
          assert:
            - "Routing.${rt_id}.status == DRAFT"
            - "Routing.${rt_id}.operation_count == 0"

      - name: operation_count_recomputed_on_operation_add
        claim_type: Computed Fields
        grounds: [entities.Routing.fields.operation_count, endpoints]
        distinguishing_aspect: "Adding two operations to a routing recomputes operation_count to 2 (derived-field reconciliation)."
        test_recipe:
          setup: ["DRAFT routing for an FG, with one machine."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-OC", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-OC", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-OC" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
          trigger:
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 20, ideal_cycle_time_secs: 50 }
              as: ManufacturingEngineer
            - call: "GET /routings/${rt_id}"
              payload: {}
              as: ManufacturingEngineer
              captures: { oc: $.data.operation_count }
          assert:
            - "Routing.${rt_id}.operation_count == 2"

      - name: travelersignoff_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.TravelerSignoff.fields.result, endpoints]
        distinguishing_aspect: "TravelerSignoff is common_fields:false (append-only); created record has id+created_at, no version, and no update endpoint exists."
        test_recipe:
          setup: ["A released WO with one op signed PASS exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-TS", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-TS", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-TS" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop1_id: "$.data[0].id" }
          trigger:
            - call: "POST /work-order-operations/${woop1_id}/signoffs"
              payload: { result: "PASS" }
              as: QualityInspector
              captures: { ts_id: $.data.id, ts_at: $.data.signed_at }
          assert:
            - "response.status == 201"
            - "TravelerSignoff.${ts_id}.result == PASS"
            - "TravelerSignoff response has no version field"

      - name: bomline_self_loop_rejected
        claim_type: Type Constraints
        grounds: [entities.BomLine.fields.parent_product_id, "errors[ERR_BOM_CYCLE]"]
        distinguishing_aspect: "parent_product_id == component_product_id -> ERR_BOM_CYCLE (no self-loop)."
        test_recipe:
          setup: ["One product P."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-SL", name: "P", product_type: "SUBASSEMBLY", unit_cost_cents: 10 }
              as: ManufacturingEngineer
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /bom-lines"
              payload: { parent_product_id: "${p_id}", component_product_id: "${p_id}", quantity_per: 1 }
              as: ManufacturingEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BOM_CYCLE"

  # ===========================================================================
  # State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: workorder_initial_state_planned
        claim_type: Initial State
        grounds: [state_machines.WorkOrder, entities.WorkOrder.fields.status]
        distinguishing_aspect: "A newly created WorkOrder starts in PLANNED with started_qty=0, completed_qty=0, wip_qty=0."
        test_recipe:
          setup: ["FG product + RELEASED routing exist."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-IS", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-IS", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-IS" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
          trigger:
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 5 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id }
          assert:
            - "WorkOrder.${wo_id}.status == PLANNED"
            - "WorkOrder.${wo_id}.started_qty == 0"
            - "WorkOrder.${wo_id}.wip_qty == 0"

      - name: complete_workorder_from_released_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.WorkOrder.IN_PROCESS_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a RELEASED (not IN_PROCESS) WorkOrder -> ERR_INVALID_STATE; no transition defined from RELEASED to COMPLETED."
        test_recipe:
          setup: ["A RELEASED WorkOrder whose ops are all QUEUED (none started)."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-IV", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-IV", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-IV" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_completed_workorder_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.WorkOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel is defined only from PLANNED/RELEASED; cancelling a COMPLETED WorkOrder -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A COMPLETED single-op WorkOrder (no BOM)."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-TL", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-TL", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-TL" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop1_id: "$.data[0].id" }
            - call: "POST /work-order-operations/${woop1_id}/signoffs"
              payload: { result: "PASS" }
              as: QualityInspector
            - call: "POST /work-order-operations/${woop1_id}/start"
              payload: { units_in: 1 }
              as: MachineOperator
            - call: "POST /work-order-operations/${woop1_id}/complete"
              payload: { good_qty: 1 }
              as: MachineOperator
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: start_operation_out_of_sequence_rejected
        claim_type: guarded_transition
        grounds: [state_machines.WorkOrderOperation.QUEUED_to_IN_PROGRESS, "validations[priority=5]", "errors[ERR_OPERATION_SEQUENCE_VIOLATION]"]
        distinguishing_aspect: "Starting the seq-20 op while the seq-10 op is not COMPLETED -> ERR_OPERATION_SEQUENCE_VIOLATION."
        test_recipe:
          setup: ["Released WO with two QUEUED ops (seq 10, 20)."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-SEQ", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-SEQ", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-SEQ" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 20, ideal_cycle_time_secs: 50 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop2_id: "$.data[1].id" }
          trigger:
            - call: "POST /work-order-operations/${woop2_id}/start"
              payload: { units_in: 1 }
              as: MachineOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_OPERATION_SEQUENCE_VIOLATION"

      - name: complete_operation_without_signoff_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.WorkOrderOperation.IN_PROGRESS_to_COMPLETED, "validations[priority=8]", "errors[ERR_TRAVELER_NOT_SIGNED]"]
        distinguishing_aspect: "Completing an IN_PROGRESS op with no PASS TravelerSignoff -> ERR_TRAVELER_NOT_SIGNED."
        test_recipe:
          setup: ["Released WO; single op started IN_PROGRESS; no sign-off recorded."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-NS", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-NS", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-NS" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop1_id: "$.data[0].id" }
            - call: "POST /work-order-operations/${woop1_id}/start"
              payload: { units_in: 1 }
              as: MachineOperator
          trigger:
            - call: "POST /work-order-operations/${woop1_id}/complete"
              payload: { good_qty: 1 }
              as: MachineOperator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TRAVELER_NOT_SIGNED"

      - name: start_first_op_bubbles_workorder_to_in_process
        claim_type: bubble_up
        grounds: [state_machines.WorkOrderOperation.QUEUED_to_IN_PROGRESS, state_machines.WorkOrder.RELEASED_to_IN_PROCESS, entities.WorkOrder.fields.started_qty]
        distinguishing_aspect: "Starting the first op bubbles the parent WorkOrder RELEASED->IN_PROCESS and sets started_qty=order_qty."
        test_recipe:
          setup: ["Released WO order_qty 6 with one QUEUED op."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-BU", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-BU", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-BU" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 6 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
            - call: "GET /work-orders/${wo_id}/operations"
              payload: {}
              as: ProductionPlanner
              captures: { woop1_id: "$.data[0].id" }
          trigger:
            - call: "POST /work-order-operations/${woop1_id}/start"
              payload: { units_in: 6 }
              as: MachineOperator
            - call: "GET /work-orders/${wo_id}"
              payload: {}
              as: ProductionPlanner
              captures: { st: $.data.status, sq: $.data.started_qty }
          assert:
            - "WorkOrder.${wo_id}.status == IN_PROCESS"
            - "WorkOrder.${wo_id}.started_qty == 6"

      - name: archive_routing_with_active_workorder_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Routing.RELEASED_to_ARCHIVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Archiving a RELEASED routing referenced by a RELEASED WorkOrder is blocked -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["RELEASED routing referenced by a RELEASED WorkOrder."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "FG-AR", name: "FG", product_type: "FINISHED_GOOD" }
              as: ManufacturingEngineer
              captures: { fg_id: $.data.id }
            - call: "POST /machines"
              payload: { machine_code: "M-AR", work_center: "WC1", planned_production_secs: 28800 }
              as: ManufacturingEngineer
              captures: { m_id: $.data.id }
            - call: "POST /routings"
              payload: { product_id: "${fg_id}", routing_code: "RT-AR" }
              as: ManufacturingEngineer
              captures: { rt_id: $.data.id }
            - call: "POST /routings/${rt_id}/operations"
              payload: { machine_id: "${m_id}", sequence_no: 10, ideal_cycle_time_secs: 100 }
              as: ManufacturingEngineer
            - call: "POST /routings/${rt_id}/release"
              payload: {}
              as: ManufacturingEngineer
            - call: "POST /work-orders"
              payload: { product_id: "${fg_id}", routing_id: "${rt_id}", order_qty: 1 }
              as: ProductionPlanner
              captures: { wo_id: $.data.id, wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ProductionPlanner
          trigger:
            - call: "POST /routings/${rt_id}/archive"
              payload: {}
              as: ManufacturingEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: scrap_disposition_already_dispositioned_invalid_state
        claim_type: Idempotency
