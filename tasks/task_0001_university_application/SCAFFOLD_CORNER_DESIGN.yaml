          rationale: "Covered by §1.9 validations.validation_priority_2_unknown_role."

      - name: error_ERR_FORBIDDEN_ROLE_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Applicant calling POST /applications/{id}/decide (an AdmissionsOfficer exclusive op) → ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup:
            - "One Applicant exists; one Application exists (state irrelevant)"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "FR-1", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /applicants/register"
              payload: { email: "fr@x.com", full_name: "FR", gpa: 3.0 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/decide"
              payload: { decision: "ADMIT", expected_application_version: 1 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == 'ERR_FORBIDDEN_ROLE'"

