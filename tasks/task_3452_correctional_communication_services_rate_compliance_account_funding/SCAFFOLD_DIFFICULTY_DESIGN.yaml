  - rule_id: boundary_precision_check
    instances:
      - name: schedule_rate_exactly_at_cap_activates_one_cent_over_fails
        grounds:
          - state_machines.RateSchedule.DRAFT_to_ACTIVE
          - errors.ERR_RATE_EXCEEDS_CAP
          - calculations.effective_rate_snapshot
        distinguishing_aspect: |
          Threshold boundary on the per-minute rate metric via the schedule-activation
          endpoint (vs the zero-count closure metric in the sibling): a schedule whose
          worst rate equals the cap exactly (25 == 25) activates, while one cent over
          (26) is rejected — the comparison is <=, not <.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Cap for ST: per-minute 25, connection 300, ancillary 500. Facility with ACTIVE contract. Two DRAFT schedules on the contract: S1 with every rate at exactly the cap (25/25/25/25, connection 300, message 500, video 500); S2 identical except interstate 26."
