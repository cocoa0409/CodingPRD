              as: PlatformAdmin
            - call: "POST /api/workers/${tomas_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "ENROLL" }
              as: PlatformAdmin
            - call: "POST /api/workers/${tomas_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001", required_units: 1 }
