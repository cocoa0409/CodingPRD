# =============================================================================
# Timeshare & Fractional Ownership — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  Timeshare & Fractional Ownership: points/weeks inventory, deeded vs
  right-to-use, maintenance fee/special assessment, reservation
  banking/borrowing, exchange (RCI/II), resale/rescission period,
  delinquency/foreclosure

domain_name: timeshare-fractional-ownership
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions

  entity_topology: flat
  # Flat top-level collections (`/owners`, `/contracts`, `/reservations`, ...).
  # Resort is the aggregate root carrying config + clock + use-year epoch, but it
  # is NOT a URL parent: children reference it by resort_id FK and list endpoints
  # filter by resort_id. Cross-aggregate references (Reservation -> InventoryUnit)
  # and a self-reference (Contract.superseded_by_contract_id) round out the graph.

  state_machine_shape: cyclic
  # Reservation has a revision cycle (CONFIRMED -> DEPOSITED_TO_EXCHANGE -> CONFIRMED
  # via recall). DelinquencyCase escalates (NOTICE -> LIEN -> LIEN) and can
  # de-escalate (-> CURED -> Contract reactivates). Foreclose branches on
  # deeded-vs-RTU. Owner.status is compound (derived from invoices + cases).

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
    - polymorphic

  role_model: peer_roles
  # ResortManager (operator), Owner (entity_backed, acts on own contracts),
  # ResaleAgent (transfers), ComplianceOfficer (foreclosure/rescission),
  # System (clock-driven rollover / billing).

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Resort
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Resort name" }
      - { name: points_per_week_base, type: integer, source: input, description: "Base points one standard week costs at this resort (the inventory denomination unit)" }
      - { name: annual_fee_cents_per_1000_points, type: integer, source: input, description: "Annual maintenance fee rate in cents per 1000 allotted points, used by maintenance_fee_proration" }
      - { name: rescission_days, type: integer, source: input, default: 7, description: "Statutory cooling-off window in days during which a new or resold contract may be rescinded" }
      - { name: borrow_surcharge_pct, type: number, source: input, default: 0.10, description: "Fraction of borrowed points added as surcharge to reservation cost when next-year points are borrowed" }
      - { name: current_use_year, type: integer, source: system, default: 2026, description: "The active use-year epoch; advanced by rollover" }
      - { name: current_utc, type: datetime, source: system, description: "Resort clock; set via /_clock and read by rescission/delinquency windows" }
      - { name: delinquency_grace_days, type: integer, source: input, default: 30, description: "Days after invoice due_date before an unpaid invoice becomes DELINQUENT" }
      - { name: foreclosure_threshold_periods, type: integer, source: input, default: 2, description: "Number of escalation periods of continuous delinquency before a DelinquencyCase may move to FORECLOSURE/TERMINATION" }

  - name: Owner
    parent: Resort
    common_fields: true
    fields:
      - { name: resort_id, type: string, source: input, description: "FK -> Resort.id; resort the owner belongs to" }
      - { name: full_name, type: string, source: input, description: "Owner legal name" }
      - { name: email, type: string, source: input, description: "Owner contact email" }
      - { name: status, type: enum, source: computed, description: "Compound status derived from this owner's invoices and delinquency cases. Values: GOOD_STANDING, DELINQUENT, SUSPENDED" }
      - { name: open_balance_cents, type: integer, source: computed, description: "Sum of amount_due_cents over this owner's invoices in {ISSUED, DELINQUENT}" }

  - name: InventoryUnit
    parent: Resort
    common_fields: true
    fields:
      - { name: resort_id, type: string, source: input, description: "FK -> Resort.id; resort that owns this bookable unit" }
      - { name: unit_label, type: string, source: input, description: "Human label, e.g. 'Villa 12'" }
      - { name: week_number, type: integer, source: input, description: "ISO week-of-year this unit is bookable for", constraints: "1..52" }
      - { name: season, type: enum, source: input, description: "Season tier driving the points multiplier. Values: PLATINUM, GOLD, SILVER" }
      - { name: points_value, type: integer, source: computed, description: "Points cost to reserve this unit = round_half_up(resort.points_per_week_base * season multiplier); see reservation_points_cost constants" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "Bookability state. Values: AVAILABLE, RESERVED, DEPOSITED_TO_EXCHANGE" }

  - name: Contract
    parent: Resort
    common_fields: true
    fields:
      - { name: resort_id, type: string, source: input, description: "FK -> Resort.id; resort this contract is in" }
      - { name: owner_id, type: string, source: input, description: "FK -> Owner.id; current holder of the contract" }
      - { name: ownership_type, type: enum, source: input, description: "Legal model. Values: DEEDED, RIGHT_TO_USE" }
      - { name: inventory_model, type: enum, source: input, description: "How the contract holds inventory. Values: POINTS, FIXED_WEEK" }
      - { name: annual_points_allotment, type: integer, source: input, default: 0, description: "Points granted each use-year (POINTS model); 0 for FIXED_WEEK" }
      - { name: fixed_unit_id, type: string, source: input, required: false, description: "FK -> InventoryUnit.id; the deeded fixed week (FIXED_WEEK model only)" }
      - { name: rtu_expiry_use_year, type: integer, source: input, required: false, description: "Last use-year of a RIGHT_TO_USE contract; null for DEEDED (perpetual)" }
      - { name: signed_at, type: datetime, source: system, description: "Resort-clock timestamp when the contract was created; starts the rescission window" }
      - { name: superseded_by_contract_id, type: string, source: system, required: false, description: "FK -> Contract.id; set when this contract is replaced by a resale transfer's new contract" }
      - { name: status, type: enum, source: system, description: "Lifecycle. Values: PENDING_RESCISSION, ACTIVE, SUSPENDED, RESCINDED, TERMINATED, FORECLOSED, TRANSFERRED" }

  - name: PointsAccount
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; the POINTS contract this ledger belongs to" }
      - { name: use_year, type: integer, source: system, description: "Use-year this account tracks" }
      - { name: allotment_points, type: integer, source: system, description: "Points granted for this use-year (snapshot of contract.annual_points_allotment at account open)" }
      - { name: banked_in_points, type: integer, source: system, default: 0, description: "Points carried into this use-year from the prior year's banking" }
      - { name: banked_out_points, type: integer, source: system, default: 0, description: "Points banked forward out of this use-year into next year" }
      - { name: borrowed_out_points, type: integer, source: system, default: 0, description: "Points pulled forward FROM this use-year into the prior year's reservations" }
      - { name: committed_points, type: integer, source: system, default: 0, description: "Points held by CONFIRMED reservations drawing on this account" }
      - { name: available_points, type: integer, source: computed, description: "allotment_points + banked_in_points - banked_out_points - borrowed_out_points - committed_points" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "Lifecycle. Values: OPEN, ROLLED_OVER" }

  - name: Reservation
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; reserving contract" }
      - { name: inventory_unit_id, type: string, source: input, description: "FK -> InventoryUnit.id; unit being reserved" }
      - { name: use_year, type: integer, source: input, description: "Use-year the reservation draws points from (the booking account's use_year)" }
      - { name: points_cost, type: integer, source: computed, description: "Total points charged = base season cost, with optional borrow surcharge (see reservation_points_cost)" }
      - { name: borrowed_points, type: integer, source: computed, default: 0, description: "Portion of points_cost satisfied by borrowing from use_year+1" }
      - { name: source_use_year_account_id, type: string, source: system, description: "FK -> PointsAccount.id; the use_year account debited for this reservation" }
      - { name: borrow_source_account_id, type: string, source: system, required: false, description: "FK -> PointsAccount.id; the use_year+1 account borrowed_out for the borrowed portion (null when no borrow)" }
      - { name: status, type: enum, source: system, description: "Lifecycle. Values: HELD, CONFIRMED, CANCELLED, COMPLETED, DEPOSITED_TO_EXCHANGE, EXPIRED" }

  - name: MaintenanceFeeInvoice
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; billed contract" }
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; owner billed (snapshot of contract.owner_id at issue)" }
      - { name: source_type, type: enum, source: input, description: "Polymorphic source of the charge. Values: ANNUAL, SPECIAL_ASSESSMENT" }
      - { name: special_assessment_id, type: string, source: input, required: false, description: "FK -> SpecialAssessment.id; set only when source_type=SPECIAL_ASSESSMENT" }
      - { name: use_year, type: integer, source: input, description: "Use-year the charge applies to" }
      - { name: amount_cents, type: integer, source: computed, description: "Original charged amount (proration applied for resale-split, see maintenance_fee_proration)" }
      - { name: late_charge_cents, type: integer, source: computed, default: 0, description: "Accumulated late charges from delinquency escalation (see delinquency_late_charge)" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of CLEARED payment allocations applied to this invoice" }
      - { name: amount_due_cents, type: integer, source: computed, description: "amount_cents + late_charge_cents - amount_paid_cents" }
      - { name: due_date, type: datetime, source: input, description: "Resort-clock date the invoice is due; drives delinquency_grace_days" }
      - { name: status, type: enum, source: system, description: "Lifecycle. Values: DRAFT, ISSUED, PAID, DELINQUENT, WRITTEN_OFF" }

  - name: Payment
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; contract whose invoices this payment settles" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount", constraints: "must be > 0" }
      - { name: invoice_id, type: string, source: input, required: false, description: "FK -> MaintenanceFeeInvoice.id; explicit target invoice; if omitted, auto-allocated oldest-due-first" }
      - { name: status, type: enum, source: system, description: "Lifecycle. Values: INITIATED, CLEARED, FAILED, REVERSED" }

  - name: SpecialAssessment
    parent: Resort
    common_fields: true
    fields:
      - { name: resort_id, type: string, source: input, description: "FK -> Resort.id; resort levying the assessment" }
      - { name: reason, type: string, source: input, description: "e.g. 'Roof replacement'" }
      - { name: total_amount_cents, type: integer, source: input, description: "Total amount to distribute across ACTIVE contracts by points share", constraints: "must be > 0" }
      - { name: use_year, type: integer, source: input, description: "Use-year the assessment is billed against" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "Lifecycle. Values: DRAFT, LEVIED" }

  - name: ExchangeDeposit
    parent: Reservation
    common_fields: true
    fields:
      - { name: reservation_id, type: string, source: input, description: "FK -> Reservation.id; the CONFIRMED reservation deposited into the exchange" }
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; owning contract (snapshot)" }
      - { name: exchange_network, type: enum, source: input, description: "External exchange network. Values: RCI, II" }
      - { name: exchange_credits, type: integer, source: computed, description: "Credits granted = floor(reservation.points_cost / credit_divisor) by network (see exchange_credit_grant)" }
      - { name: status, type: enum, source: system, description: "Lifecycle. Values: DEPOSITED, REDEEMED, RECALLED" }

  - name: ResaleTransfer
    parent: Contract
    common_fields: true
    fields:
      - { name: source_contract_id, type: string, source: input, description: "FK -> Contract.id; the contract being sold" }
      - { name: resort_id, type: string, source: system, description: "FK -> Resort.id; resort (snapshot)" }
      - { name: buyer_owner_id, type: string, source: input, description: "FK -> Owner.id; the purchasing owner" }
      - { name: sale_price_cents, type: integer, source: input, description: "Agreed resale price", constraints: "must be >= 0" }
      - { name: transfer_use_year, type: integer, source: input, description: "Use-year in which the transfer takes effect (drives maintenance fee resale-split proration)" }
      - { name: transfer_day_of_year, type: integer, source: input, description: "Day-of-year the transfer is effective, used to prorate the use-year annual fee between seller and buyer", constraints: "1..365" }
      - { name: new_contract_id, type: string, source: system, required: false, description: "FK -> Contract.id; the buyer's new contract minted on completion" }
      - { name: signed_at, type: datetime, source: system, description: "Resort-clock timestamp of transfer initiation; starts the buyer rescission window" }
      - { name: status, type: enum, source: system, description: "Lifecycle. Values: PENDING_RESCISSION, COMPLETED, RESCINDED" }

  - name: DelinquencyCase
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; delinquent contract" }
      - { name: owner_id, type: string, source: system, description: "FK -> Owner.id; delinquent owner (snapshot)" }
      - { name: trigger_invoice_id, type: string, source: system, description: "FK -> MaintenanceFeeInvoice.id; the invoice whose delinquency opened the case" }
      - { name: escalation_periods, type: integer, source: computed, default: 0, description: "Count of escalation steps applied (incremented each escalate call); drives foreclosure eligibility and compounding late_charge" }
      - { name: late_charge_basis, type: enum, source: input, default: "COMPOUNDING", description: "Which delinquency_late_charge variant applies. Values: SIMPLE, COMPOUNDING" }
      - { name: status, type: enum, source: system, description: "Lifecycle. Values: NOTICE, LIEN, FORECLOSURE, TERMINATION, CURED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Contract
    initial_state: PENDING_RESCISSION
    terminal_states: [RESCINDED, TERMINATED, FORECLOSED, TRANSFERRED]
    transitions:
      - from: PENDING_RESCISSION
        to: ACTIVE
        trigger: "POST /contracts/{contractId}/activate"
        actor: ResortManager
        preconditions:
          - "resort.current_utc >= contract.signed_at + resort.rescission_days days, i.e. the rescission window has fully elapsed (else ERR_RESCISSION_WINDOW_OPEN)"
        side_effects:
          - "status -> ACTIVE"
          - "If inventory_model=POINTS: open a PointsAccount for resort.current_use_year (allotment_points = contract.annual_points_allotment, available_points = allotment_points) if none exists"
          - "If inventory_model=FIXED_WEEK: set fixed_unit InventoryUnit.status -> RESERVED"
          - "increments Contract.version by 1"
      - from: PENDING_RESCISSION
        to: RESCINDED
        trigger: "POST /contracts/{contractId}/rescind"
        actor: "Owner | ComplianceOfficer"
        preconditions:
          - "resort.current_utc <= contract.signed_at + resort.rescission_days days, i.e. still inside the cooling-off window (else ERR_RESCISSION_WINDOW_CLOSED)"
        side_effects:
          - "status -> RESCINDED"
          - "Void all DRAFT/ISSUED MaintenanceFeeInvoices for this contract (status -> WRITTEN_OFF)"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascade: a DelinquencyCase for this contract escalates to LIEN)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> SUSPENDED"
          - "Cancel every HELD Reservation on this contract (HELD -> CANCELLED)"
          - "increments Contract.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (cascade: the DelinquencyCase for this contract reaches CURED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> ACTIVE"
          - "increments Contract.version by 1"
      - from: SUSPENDED
        to: FORECLOSED
        trigger: "POST /delinquency-cases/{caseId}/foreclose"
        actor: ComplianceOfficer
        preconditions:
          - "contract.ownership_type == DEEDED (RIGHT_TO_USE contracts TERMINATE instead; else ERR_OWNERSHIP_TYPE_MISMATCH)"
          - "the case is in LIEN and case.escalation_periods >= resort.foreclosure_threshold_periods (else ERR_FORECLOSURE_NOT_ELIGIBLE)"
        side_effects:
          - "status -> FORECLOSED"
          - "Cancel all non-terminal Reservations on this contract (release committed_points)"
          - "Release fixed_unit InventoryUnit.status -> AVAILABLE if FIXED_WEEK"
          - "increments Contract.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /delinquency-cases/{caseId}/foreclose"
        actor: ComplianceOfficer
        preconditions:
          - "contract.ownership_type == RIGHT_TO_USE (DEEDED contracts FORECLOSE instead; else ERR_OWNERSHIP_TYPE_MISMATCH)"
          - "the case is in LIEN and case.escalation_periods >= resort.foreclosure_threshold_periods (else ERR_FORECLOSURE_NOT_ELIGIBLE)"
        side_effects:
          - "status -> TERMINATED"
          - "Cancel all non-terminal Reservations on this contract (release committed_points)"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "POST /resale-transfers/{transferId}/complete"
        actor: ResaleAgent
        preconditions:
          - "no open DelinquencyCase in {NOTICE, LIEN} on this contract (else ERR_CONTRACT_DELINQUENT)"
        side_effects:
          - "status -> TRANSFERRED"
          - "superseded_by_contract_id set to the newly minted buyer contract"
          - "increments Contract.version by 1"

  - entity: Reservation
    initial_state: HELD
    terminal_states: [CANCELLED, COMPLETED, EXPIRED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /reservations/{reservationId}/confirm"
        actor: Owner
        preconditions:
          - "owning Contract.status == ACTIVE (else ERR_CONTRACT_NOT_ACTIVE)"
          - "InventoryUnit.status == AVAILABLE for the target unit at confirm time (else ERR_UNIT_NOT_AVAILABLE)"
        side_effects:
          - "status -> CONFIRMED"
          - "InventoryUnit.status -> RESERVED"
          - "source PointsAccount.committed_points += (points_cost - borrowed_points)"
          - "borrow source PointsAccount.borrowed_out_points += borrowed_points (when borrowed_points > 0)"
      - from: HELD
        to: CANCELLED
        trigger: "POST /reservations/{reservationId}/cancel"
        actor: "Owner | ResortManager"
        preconditions: []
        side_effects:
          - "status -> CANCELLED"
          - "No points were committed at HELD, so no committed_points change"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /reservations/{reservationId}/cancel"
        actor: "Owner | ResortManager"
        preconditions: []
        side_effects:
          - "status -> CANCELLED"
          - "InventoryUnit.status -> AVAILABLE"
          - "source PointsAccount.committed_points -= (points_cost - borrowed_points)  (compensation)"
          - "borrow source PointsAccount.borrowed_out_points -= borrowed_points (compensation, when borrowed_points > 0)"
      - from: CONFIRMED
        to: DEPOSITED_TO_EXCHANGE
        trigger: "POST /reservations/{reservationId}/deposit-exchange"
        actor: Owner
        preconditions:
          - "owning Contract.status == ACTIVE (else ERR_CONTRACT_NOT_ACTIVE)"
          - "reservation has no existing ExchangeDeposit in {DEPOSITED, REDEEMED} (else ERR_ALREADY_DEPOSITED)"
        side_effects:
          - "status -> DEPOSITED_TO_EXCHANGE"
          - "InventoryUnit.status -> DEPOSITED_TO_EXCHANGE"
          - "Create ExchangeDeposit (status DEPOSITED) with computed exchange_credits"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /reservations/{reservationId}/complete"
        actor: ResortManager
        preconditions: []
        side_effects:
          - "status -> COMPLETED"
          - "InventoryUnit.status -> AVAILABLE"
          - "source PointsAccount.committed_points -= (points_cost - borrowed_points) (points consumed, not refunded)"
      - from: HELD
        to: EXPIRED
        trigger: "system (cascade during POST /resorts/{resortId}/rollover-use-year for the closing use-year)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> EXPIRED"

  - entity: MaintenanceFeeInvoice
    initial_state: DRAFT
    terminal_states: [WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{invoiceId}/issue"
        actor: ResortManager
        preconditions:
          - "owning Contract.status in {ACTIVE, SUSPENDED} (else ERR_CONTRACT_NOT_ACTIVE)"
        side_effects:
          - "status -> ISSUED"
          - "amount_cents finalized via maintenance_fee_proration"
      - from: ISSUED
        to: PAID
        trigger: "system (cascade when a CLEARED Payment brings amount_due_cents to 0)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> PAID"
      - from: ISSUED
        to: DELINQUENT
        trigger: "POST /invoices/{invoiceId}/mark-delinquent (or system during rollover)"
        actor: "ResortManager | system"
        preconditions:
          - "amount_due_cents > 0 (else ERR_INVOICE_NOT_PAYABLE)"
          - "resort.current_utc >= due_date + resort.delinquency_grace_days days (else ERR_GRACE_PERIOD_ACTIVE)"
        side_effects:
          - "status -> DELINQUENT"
          - "Open a DelinquencyCase (status NOTICE) for this contract if none open; set trigger_invoice_id"
      - from: DELINQUENT
        to: PAID
        trigger: "system (cascade when a CLEARED Payment brings amount_due_cents to 0)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> PAID"
          - "If this clears the last DELINQUENT invoice on the contract, the owning DelinquencyCase moves toward CURED (see DelinquencyCase machine)"
      - from: DELINQUENT
        to: WRITTEN_OFF
        trigger: "system (cascade on Contract FORECLOSED/TERMINATED/RESCINDED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> WRITTEN_OFF"
      - from: DRAFT
        to: WRITTEN_OFF
        trigger: "system (cascade on Contract RESCINDED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> WRITTEN_OFF"
      - from: ISSUED
        to: WRITTEN_OFF
        trigger: "system (cascade on Contract RESCINDED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> WRITTEN_OFF"

  - entity: Payment
    initial_state: INITIATED
    terminal_states: [CLEARED, FAILED, REVERSED]
    transitions:
      - from: INITIATED
        to: CLEARED
        trigger: "POST /payments/{paymentId}/clear"
        actor: ResortManager
        preconditions: []
        side_effects:
          - "status -> CLEARED"
          - "Allocate amount across target invoice(s): explicit invoice_id, else oldest due_date first then created_at ASC across {ISSUED, DELINQUENT} invoices of the contract"
          - "Each fully-paid invoice transitions to PAID (cascade)"
          - "When the contract's last DELINQUENT invoice reaches amount_due_cents=0, cascade the DelinquencyCase to CURED"
      - from: INITIATED
        to: FAILED
        trigger: "POST /payments/{paymentId}/fail"
        actor: ResortManager
        preconditions: []
        side_effects:
          - "status -> FAILED"
      - from: CLEARED
        to: REVERSED
        trigger: "POST /payments/{paymentId}/reverse"
        actor: ResortManager
        preconditions: []
        side_effects:
          - "status -> REVERSED"
          - "Undo allocations: each previously-paid invoice's amount_paid_cents reduced; PAID invoices revert to ISSUED (or DELINQUENT if past grace)"
          - "If a CURED DelinquencyCase was cured by this payment, re-open it to its prior LIEN/NOTICE state"

  - entity: ExchangeDeposit
    initial_state: DEPOSITED
    terminal_states: [REDEEMED, RECALLED]
    transitions:
      - from: DEPOSITED
        to: REDEEMED
        trigger: "POST /exchange-deposits/{depositId}/redeem"
        actor: Owner
        preconditions: []
        side_effects:
          - "status -> REDEEMED (credits consumed externally)"
      - from: DEPOSITED
        to: RECALLED
        trigger: "POST /exchange-deposits/{depositId}/recall"
        actor: Owner
        preconditions: []
        side_effects:
          - "status -> RECALLED"
          - "Reservation status -> CONFIRMED"
          - "InventoryUnit.status -> RESERVED"

  - entity: SpecialAssessment
    initial_state: DRAFT
    terminal_states: [LEVIED]
    transitions:
      - from: DRAFT
        to: LEVIED
        trigger: "POST /special-assessments/{assessmentId}/levy"
        actor: ResortManager
        preconditions:
          - "at least one ACTIVE contract exists at the resort (else ERR_NO_ELIGIBLE_CONTRACTS)"
        side_effects:
          - "status -> LEVIED"
          - "Create one SPECIAL_ASSESSMENT MaintenanceFeeInvoice (DRAFT) per ACTIVE contract, amount via special_assessment_proration"

  - entity: ResaleTransfer
    initial_state: PENDING_RESCISSION
    terminal_states: [COMPLETED, RESCINDED]
    transitions:
      - from: PENDING_RESCISSION
        to: COMPLETED
        trigger: "POST /resale-transfers/{transferId}/complete"
        actor: ResaleAgent
        preconditions:
          - "resort.current_utc >= signed_at + resort.rescission_days days (else ERR_RESCISSION_WINDOW_OPEN)"
          - "source Contract.status == ACTIVE (else ERR_CONTRACT_NOT_ACTIVE)"
          - "no open DelinquencyCase in {NOTICE, LIEN} on the source contract (else ERR_CONTRACT_DELINQUENT)"
        side_effects:
          - "status -> COMPLETED"
          - "Source Contract -> TRANSFERRED (cascade)"
          - "Mint new_contract for buyer_owner_id (status ACTIVE, same inventory_model/allotment), set source.superseded_by_contract_id"
          - "Split the transfer_use_year ANNUAL invoice via maintenance_fee_proration resale variant: seller invoice reduced to days-owned share, new buyer invoice (ISSUED) for remainder"
      - from: PENDING_RESCISSION
        to: RESCINDED
        trigger: "POST /resale-transfers/{transferId}/rescind"
        actor: "Owner | ComplianceOfficer"
        preconditions:
          - "resort.current_utc <= signed_at + resort.rescission_days days (else ERR_RESCISSION_WINDOW_CLOSED)"
        side_effects:
          - "status -> RESCINDED (source contract keeps its current owner, unchanged)"

  - entity: DelinquencyCase
    initial_state: NOTICE
    terminal_states: [FORECLOSURE, TERMINATION, CURED]
    transitions:
      - from: NOTICE
        to: LIEN
        trigger: "POST /delinquency-cases/{caseId}/escalate"
        actor: ComplianceOfficer
        preconditions:
          - "the contract still has a DELINQUENT invoice (else ERR_NO_DELINQUENT_INVOICE)"
        side_effects:
          - "status -> LIEN"
          - "escalation_periods += 1"
          - "Apply delinquency_late_charge to the contract's DELINQUENT invoices (late_charge_cents grows)"
          - "Source Contract -> SUSPENDED (cascade)"
      - from: LIEN
        to: LIEN
        trigger: "POST /delinquency-cases/{caseId}/escalate"
        actor: ComplianceOfficer
        preconditions:
          - "the contract still has a DELINQUENT invoice (else ERR_NO_DELINQUENT_INVOICE)"
        side_effects:
          - "escalation_periods += 1"
          - "Apply delinquency_late_charge again (compounding variant compounds on prior late_charge)"
      - from: NOTICE
        to: CURED
        trigger: "system (cascade when the contract has no remaining DELINQUENT invoices)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> CURED"
      - from: LIEN
        to: CURED
        trigger: "system (cascade when the contract has no remaining DELINQUENT invoices)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> CURED"
          - "Source Contract SUSPENDED -> ACTIVE (cascade)"
      - from: LIEN
        to: FORECLOSURE
        trigger: "POST /delinquency-cases/{caseId}/foreclose"
        actor: ComplianceOfficer
        preconditions:
          - "contract.ownership_type == DEEDED (else ERR_OWNERSHIP_TYPE_MISMATCH)"
          - "escalation_periods >= resort.foreclosure_threshold_periods (else ERR_FORECLOSURE_NOT_ELIGIBLE)"
        side_effects:
          - "status -> FORECLOSURE"
          - "Source Contract SUSPENDED -> FORECLOSED (cascade), which WRITES_OFF its DELINQUENT invoices (cascade)"
      - from: LIEN
        to: TERMINATION
        trigger: "POST /delinquency-cases/{caseId}/foreclose"
        actor: ComplianceOfficer
        preconditions:
          - "contract.ownership_type == RIGHT_TO_USE (else ERR_OWNERSHIP_TYPE_MISMATCH)"
          - "escalation_periods >= resort.foreclosure_threshold_periods (else ERR_FORECLOSURE_NOT_ELIGIBLE)"
        side_effects:
          - "status -> TERMINATION"
          - "Source Contract SUSPENDED -> TERMINATED (cascade), which WRITES_OFF its DELINQUENT invoices (cascade)"

# -----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reservation-create-stale-points-account
    parent_entity: PointsAccount
    write_endpoint: "POST /reservations"
    occ_field: "expected_points_account_version"
    description: |
      Creating a HELD Reservation against a PointsAccount whose version has
      advanced since the client last observed it is rejected as a stale-version
      write. This captures the case where another booking already drew down or
      banked points on the same account (legitimately reducing available_points),
      so the current writer's view of the account is out of date and must
      re-read before re-pricing.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: bank-points-stale-points-account
    parent_entity: PointsAccount
    write_endpoint: "POST /points-accounts/{accountId}/bank"
    occ_field: "expected_points_account_version"
    description: |
      Banking points forward from a PointsAccount whose version has advanced
      since last observed is rejected. Another bank or reservation already moved
      points on the account, so the requested bank amount may now exceed
      available_points; the stale-version guard forces a re-read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: reservation_points_cost
    trigger: "POST /reservations (compute at HELD creation; pinned thereafter)"
    algorithm: tiered_pricing
    formula: |
      # INPUTS (>=3, non-linear interaction): unit.season, resort.points_per_week_base,
      # lead-time tier, and whether next-year points are borrowed.
      base = resort.points_per_week_base * SEASON_MULT[unit.season]   # PLATINUM=1.50, GOLD=1.00, SILVER=0.60
      base = round_half_up(base)   # round BEFORE any discount
      # Lead-time discount tier (booking >= 180 days before the use-year start):
      lead_days = (use_year_start_utc - resort.current_utc) in whole days
      if lead_days >= EARLY_BIRD_DAYS (180): discounted = floor(base * (1 - EARLY_BIRD_DISCOUNT))   # 0.10
      else: discounted = base
      avail = source_account.available_points   # the use_year account
      if discounted <= avail:
        borrowed_points = 0
        points_cost = discounted
      else:
        shortfall = discounted - avail
        borrowed_points = shortfall
        surcharge = ceil(shortfall * resort.borrow_surcharge_pct)   # 0.10
        points_cost = discounted + surcharge
        # The borrow source is the contract's use_year+1 PointsAccount; if that
        # account does not yet exist it is created lazily here with
        # allotment_points = contract.annual_points_allotment (no clock advance).
        # borrowed_points must be <= borrow_source.available_points else
        # ERR_INSUFFICIENT_POINTS (validation priority 14).
      # borrowed portion == shortfall (NOT shortfall+surcharge); surcharge is
      # charged against the current-year (use_year) account.
    input_set: "Single InventoryUnit + the source PointsAccount for use_year and the use_year+1 account when borrowing."
    constants:
      SEASON_MULT_PLATINUM: 1.50
      SEASON_MULT_GOLD: 1.00
      SEASON_MULT_SILVER: 0.60
      EARLY_BIRD_DAYS: 180
      EARLY_BIRD_DISCOUNT: 0.10
    precision: "Whole points; base rounded round_half_up; early-bird floor'd; surcharge ceil'd."
    variants:
      - name: within_balance
        when: "discounted <= source account available_points"
        difference: "borrowed_points=0, points_cost=discounted, no surcharge, no use_year+1 account touched."
      - name: borrowed_with_surcharge
        when: "discounted > source account available_points"
        difference: "Shortfall borrowed from use_year+1 account; surcharge = ceil(shortfall*borrow_surcharge_pct) added to points_cost; genuinely different result vs within_balance for identical unit inputs."

  - name: maintenance_fee_proration
    trigger: "POST /invoices/{invoiceId}/issue (ANNUAL); resale-split during ResaleTransfer complete"
    algorithm: forward_looking
    formula: |
      annual_full = ceil(contract.annual_points_allotment / 1000 * resort.annual_fee_cents_per_1000_points)
      # For FIXED_WEEK contracts, points basis = fixed_unit.points_value instead of annual_points_allotment.
      # PROVISIONAL (initial issue, full-year owner): amount_cents = annual_full
      # FINAL (resale-split): seller keeps days_owned/365 share, buyer gets remainder.
      #   seller_share = floor(annual_full * transfer_day_of_year / 365)
      #   buyer_share  = annual_full - seller_share        # remainder absorbs rounding
    input_set: "One contract's annual fee for one use_year; on resale, split across seller and buyer by transfer_day_of_year."
    constants:
      DAYS_IN_YEAR: 365
    precision: "Cents; annual_full ceil'd; seller_share floored; buyer_share = annual_full - seller_share so seller+buyer == annual_full with no drift."
    variants:
      - name: provisional_full_year
        when: "ANNUAL invoice issued before any resale in the use_year"
        difference: "amount_cents = annual_full (whole year on the original owner)."
      - name: final_resale_split
        when: "ResaleTransfer completes in transfer_use_year"
        difference: "Seller's ANNUAL invoice amount_cents reduced to floor(annual_full*transfer_day_of_year/365); a new ISSUED buyer invoice carries (annual_full - seller_share). Same annual_full, two different per-party numbers."

  - name: special_assessment_proration
    trigger: "POST /special-assessments/{assessmentId}/levy"
    algorithm: waterfall_allocation
    formula: |
      # Distribute total_amount_cents across ACTIVE contracts by points share.
      # points_basis(c) = annual_points_allotment (POINTS) or fixed_unit.points_value (FIXED_WEEK)
      total_basis = sum(points_basis(c) for c in ACTIVE contracts)
      raw_share(c)   = total_amount_cents * points_basis(c) / total_basis      # exact rational
      floor_share(c) = floor(raw_share(c))
      remainder      = total_amount_cents - sum(floor_share(c))
      # ORDER PINNED: round per-contract DOWN first, then hand out `remainder`
      # extra cents one each to contracts ordered by (raw_share - floor_share) DESC,
      # tie-break Contract.created_at ASC. (round-then-distribute, NOT sum-then-round.)
      assessed(c) = floor_share(c) + (1 if c among top `remainder` by that order else 0)
    input_set: "All Contracts at the resort with status == ACTIVE at levy time."
    constants: {}
    precision: "Cents; per-contract floor then largest-remainder distribution; sum(assessed) == total_amount_cents exactly (conserved)."

  - name: delinquency_late_charge
    trigger: "POST /delinquency-cases/{caseId}/escalate"
    algorithm: decay_function
    formula: |
      # Applied to each DELINQUENT invoice on the contract at each escalate.
      # SIMPLE: flat rate on ORIGINAL amount_cents each period.
      #   delta = floor(invoice.amount_cents * LATE_RATE)          # LATE_RATE = 0.05
      #   invoice.late_charge_cents += delta
      # COMPOUNDING: rate on running balance (amount_cents + prior late_charge_cents).
      #   base  = invoice.amount_cents + invoice.late_charge_cents
      #   delta = floor(base * LATE_RATE)
      #   invoice.late_charge_cents += delta
      # Variant chosen by DelinquencyCase.late_charge_basis.
    input_set: "All MaintenanceFeeInvoices in DELINQUENT for the case's contract."
    constants:
      LATE_RATE: 0.05
    precision: "Cents, floored each period. SIMPLE and COMPOUNDING diverge from the 2nd escalation onward."
    variants:
      - name: simple
        when: "DelinquencyCase.late_charge_basis == SIMPLE"
        difference: "delta = floor(amount_cents * LATE_RATE) every period; late_charge_cents grows linearly."
      - name: compounding
        when: "DelinquencyCase.late_charge_basis == COMPOUNDING"
        difference: "delta = floor((amount_cents + late_charge_cents) * LATE_RATE); strictly larger than SIMPLE from period 2 for identical inputs."

  - name: exchange_credit_grant
    trigger: "POST /reservations/{reservationId}/deposit-exchange"
    algorithm: threshold
    formula: |
      divisor = CREDIT_DIVISOR[exchange_network]      # RCI=100, II=120
      exchange_credits = floor(reservation.points_cost / divisor)
      # Boundary: points_cost == divisor yields exactly 1 credit; divisor-1 yields 0.
    input_set: "One CONFIRMED reservation's points_cost and the chosen exchange network."
    constants:
      CREDIT_DIVISOR_RCI: 100
      CREDIT_DIVISOR_II: 120
    precision: "Whole credits, floor."

  - name: owner_status
    trigger: "Recomputed on any invoice/delinquency/payment change for the owner (compound, derived)"
    algorithm: aggregation
    formula: |
      open_balance_cents = sum(inv.amount_due_cents for inv in this owner's MaintenanceFeeInvoices
                               where inv.status in {ISSUED, DELINQUENT})
      if any DelinquencyCase for this owner's contracts is in {LIEN, FORECLOSURE, TERMINATION}: SUSPENDED
      elif any MaintenanceFeeInvoice for this owner is DELINQUENT: DELINQUENT
      else: GOOD_STANDING
    input_set: "All invoices and delinquency cases across all contracts whose owner_id == this owner."
    constants: {}
    precision: "Integer cents for open_balance; enum for status."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and a valid role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: auth
    check: "For entity_backed Owner, X-User-ID must equal the owner_id of the contract the resource belongs to (ownership)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Owner-actor endpoints: reservation create/confirm/cancel/deposit-exchange, contract rescind, exchange redeem/recall, resale rescind, contract payment"

  - priority: 4
    category: existence
    check: "Path resources must exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, amounts/points > 0 where required, enum values valid, week_number in 1..52, transfer_day_of_year in 1..365"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 6
    category: business_referential
    check: "FK targets resolve and belong to the same resort (owner_id, inventory_unit_id, contract_id, invoice_id, special_assessment_id, fixed_unit_id)"
    error_id: ERR_CROSS_RESORT_REFERENCE
    http_status: 409
    applies_to: "create contract, create reservation, create invoice, create payment, create resale-transfer"

  - priority: 7
    category: state
    check: "Target resource must be in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 8
    category: business_safety
    check: "Rescission window must be respected: activate/complete blocked while window OPEN; rescind blocked once window CLOSED"
    error_id: "ERR_RESCISSION_WINDOW_OPEN | ERR_RESCISSION_WINDOW_CLOSED"
    http_status: 409
    applies_to: "contract activate/rescind, resale-transfer complete/rescind"

  - priority: 9
    category: business_referential
    check: "Cross-entity gate: a transition requiring the owning Contract be ACTIVE fails if it is not"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "reservation confirm/deposit-exchange, invoice issue, resale-transfer complete"

  - priority: 10
    category: business_constraint
    check: "Inventory unit must be AVAILABLE to be CONFIRMED (exclusive occupancy per unit-week). Many reservations may HELD the same unit; only one may CONFIRM it."
    error_id: ERR_UNIT_NOT_AVAILABLE
    http_status: 409
    applies_to: "reservation confirm"

  - priority: 11
    category: business_constraint
    check: "Delinquency block: a contract with an open DelinquencyCase in {NOTICE, LIEN} cannot complete a resale transfer"
    error_id: ERR_CONTRACT_DELINQUENT
    http_status: 409
    applies_to: "resale-transfer complete"

  - priority: 12
    category: business_temporal
    check: "Delinquency grace: an ISSUED invoice may only be marked DELINQUENT once current_utc >= due_date + grace days"
    error_id: ERR_GRACE_PERIOD_ACTIVE
    http_status: 409
    applies_to: "invoice mark-delinquent"

  - priority: 13
    category: business_constraint
    check: "Foreclosure eligibility: case must be LIEN with escalation_periods >= foreclosure_threshold_periods, and ownership_type must match the branch"
    error_id: "ERR_FORECLOSURE_NOT_ELIGIBLE | ERR_OWNERSHIP_TYPE_MISMATCH"
    http_status: 409
    applies_to: "delinquency-case foreclose"

  - priority: 14
    category: business_fiscal
    check: "Points sufficiency / borrow ceiling: a reservation's borrowed_points cannot exceed the use_year+1 account's available_points; banked points cannot exceed available_points"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 409
    applies_to: "reservation create, points-account bank"

  - priority: 15
    category: concurrency
    check: "OCC: expected_points_account_version must equal the current PointsAccount.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "reservation create, points-account bank"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Resort ---
  - method: POST
    path: "/resorts"
    description: "Create a Resort"
    roles: [ResortManager]
    code: 201
    input: [name, points_per_week_base, annual_fee_cents_per_1000_points, "rescission_days?", "borrow_surcharge_pct?", "delinquency_grace_days?", "foreclosure_threshold_periods?"]
    output: Resort
    side_effects: ["current_use_year defaulted to 2026", "current_utc initialized to epoch (overridable via /_clock)"]

  - method: GET
    path: "/resorts/{resortId}"
    description: "Get a Resort"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Resort
    side_effects: []

  - method: POST
    path: "/resorts/{resortId}/rollover-use-year"
    description: "Advance the resort to the next use-year: roll PointsAccounts, expire HELD reservations, mark grace-expired invoices delinquent"
    roles: [ResortManager, System]
    code: 200
    input: []
    output: Resort
    side_effects:
      - "current_use_year += 1"
      - "For each OPEN PointsAccount in the closing year: status -> ROLLED_OVER; open next-year account; carry banked_out_points into next-year banked_in_points"
      - "Expire HELD reservations on the closing year (HELD -> EXPIRED)"
      - "Mark grace-expired ISSUED invoices DELINQUENT (system) and open DelinquencyCases"

  # --- Owner ---
  - method: POST
    path: "/owners"
    description: "Create an Owner"
    roles: [ResortManager]
    code: 201
    input: [resort_id, full_name, email]
    output: Owner
    side_effects: ["status=GOOD_STANDING, open_balance_cents=0"]

  - method: GET
    path: "/owners/{ownerId}"
    description: "Get an Owner (with computed status and open_balance_cents)"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Owner
    side_effects: []

  - method: GET
    path: "/owners"
    description: "List Owners (filter by resort)"
    roles: [ResortManager, ResaleAgent, ComplianceOfficer]
    code: 200
    input: ["resort_id?"]
    output: "Owner[]"
    side_effects: []

  # --- InventoryUnit ---
  - method: POST
    path: "/inventory-units"
    description: "Create an InventoryUnit"
    roles: [ResortManager]
    code: 201
    input: [resort_id, unit_label, week_number, season]
    output: InventoryUnit
    side_effects: ["status=AVAILABLE", "points_value computed from season + resort.points_per_week_base"]

  - method: GET
    path: "/inventory-units/{unitId}"
    description: "Get an InventoryUnit"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: []
    output: InventoryUnit
    side_effects: []

  - method: GET
    path: "/inventory-units"
    description: "List InventoryUnits (filter by resort/status)"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: ["resort_id?", "status?"]
    output: "InventoryUnit[]"
    side_effects: []

  # --- Contract ---
  - method: POST
    path: "/contracts"
    description: "Create a Contract (PENDING_RESCISSION, signed_at = resort.current_utc)"
    roles: [ResortManager, ResaleAgent]
    code: 201
    input: [resort_id, owner_id, ownership_type, inventory_model, "annual_points_allotment?", "fixed_unit_id?", "rtu_expiry_use_year?"]
    output: Contract
    side_effects: ["status=PENDING_RESCISSION", "signed_at set"]

  - method: GET
    path: "/contracts/{contractId}"
    description: "Get a Contract"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: GET
    path: "/contracts"
    description: "List Contracts (filter by resort/owner/status/fixed_unit/superseded)"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: ["resort_id?", "owner_id?", "status?", "fixed_unit_id?", "superseded_by_contract_id?"]
    output: "Contract[]"
    side_effects: []

  - method: POST
    path: "/contracts/{contractId}/activate"
    description: "Activate a contract after the rescission window has elapsed"
    roles: [ResortManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["status -> ACTIVE", "open PointsAccount (POINTS) or reserve fixed unit (FIXED_WEEK)", "increments Contract.version by 1"]

  - method: POST
    path: "/contracts/{contractId}/rescind"
    description: "Rescind a contract inside the cooling-off window"
    roles: [Owner, ComplianceOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: ["status -> RESCINDED", "write off this contract's DRAFT/ISSUED invoices", "increments Contract.version by 1"]

  # --- PointsAccount ---
  - method: GET
    path: "/points-accounts/{accountId}"
    description: "Get a PointsAccount (computed available_points etc.)"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: []
    output: PointsAccount
    side_effects: []

  - method: GET
    path: "/points-accounts"
    description: "List PointsAccounts (filter by contract/use_year) — reverse-reachability for PointsAccount.contract_id"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: ["contract_id?", "use_year?"]
    output: "PointsAccount[]"
    side_effects: []

  - method: POST
    path: "/points-accounts/{accountId}/bank"
    description: "Bank points from this account forward into next use-year (banked_out)"
    roles: [Owner, ResortManager]
    code: 200
    input: [points, expected_points_account_version]
    output: PointsAccount
    side_effects:
      - "banked_out_points += points (available_points decreases by points)"
      - "next-year account (use_year+1) for this contract gets banked_in_points += points; created if absent"
      - "increments PointsAccount.version by 1"

  # --- Reservation ---
  - method: POST
    path: "/reservations"
    description: "Create a HELD reservation, pricing points_cost (with optional borrow) against the source PointsAccount"
    roles: [Owner]
    code: 201
    input: [contract_id, inventory_unit_id, use_year, expected_points_account_version]
    output: Reservation
    side_effects:
      - "status=HELD"
      - "points_cost + borrowed_points computed via reservation_points_cost"
      - "source_use_year_account_id resolved to the contract's use_year account"
      - "borrow_source_account_id resolved to the contract's use_year+1 account, lazily created (allotment_points = contract.annual_points_allotment) when borrowed_points > 0 and absent"
      - "increments PointsAccount.version by 1 (the source use_year account)"

  - method: GET
    path: "/reservations/{reservationId}"
    description: "Get a Reservation"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: GET
    path: "/reservations"
    description: "List Reservations (filter by contract/status/use_year/inventory_unit/source-or-borrow account) — reverse-reachability for Reservation.contract_id, inventory_unit_id, source_use_year_account_id, borrow_source_account_id"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: ["contract_id?", "inventory_unit_id?", "source_use_year_account_id?", "borrow_source_account_id?", "status?", "use_year?"]
    output: "Reservation[]"
    side_effects: []

  - method: POST
    path: "/reservations/{reservationId}/confirm"
    description: "Confirm a HELD reservation, committing points and reserving the unit"
    roles: [Owner]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status -> CONFIRMED", "InventoryUnit -> RESERVED", "committed_points / borrowed_out_points updated"]

  - method: POST
    path: "/reservations/{reservationId}/cancel"
    description: "Cancel a HELD or CONFIRMED reservation (compensating points release if CONFIRMED)"
    roles: [Owner, ResortManager]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status -> CANCELLED", "release committed_points/borrowed_out_points if was CONFIRMED", "InventoryUnit -> AVAILABLE if was CONFIRMED"]

  - method: POST
    path: "/reservations/{reservationId}/complete"
    description: "Mark a CONFIRMED reservation COMPLETED (stay consumed)"
    roles: [ResortManager]
    code: 200
    input: []
    output: Reservation
    side_effects: ["status -> COMPLETED", "InventoryUnit -> AVAILABLE", "committed_points decremented (consumed)"]

  - method: POST
    path: "/reservations/{reservationId}/deposit-exchange"
    description: "Deposit a CONFIRMED reservation into an external exchange (RCI/II) for credits"
    roles: [Owner]
    code: 201
    input: [exchange_network]
    output: ExchangeDeposit
    side_effects: ["Reservation -> DEPOSITED_TO_EXCHANGE", "InventoryUnit -> DEPOSITED_TO_EXCHANGE", "ExchangeDeposit created with exchange_credits"]

  # --- ExchangeDeposit ---
  - method: GET
    path: "/exchange-deposits/{depositId}"
    description: "Get an ExchangeDeposit"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: []
    output: ExchangeDeposit
    side_effects: []

  - method: GET
    path: "/exchange-deposits"
    description: "List ExchangeDeposits (filter by reservation) — reverse-reachability for ExchangeDeposit.reservation_id and contract_id"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: ["reservation_id?", "contract_id?", "status?"]
    output: "ExchangeDeposit[]"
    side_effects: []

  - method: POST
    path: "/exchange-deposits/{depositId}/redeem"
    description: "Redeem exchange credits (consume the deposit)"
    roles: [Owner]
    code: 200
    input: []
    output: ExchangeDeposit
    side_effects: ["status -> REDEEMED"]

  - method: POST
    path: "/exchange-deposits/{depositId}/recall"
    description: "Recall a deposited reservation back from the exchange"
    roles: [Owner]
    code: 200
    input: []
    output: ExchangeDeposit
    side_effects: ["status -> RECALLED", "Reservation -> CONFIRMED", "InventoryUnit -> RESERVED"]

  # --- MaintenanceFeeInvoice ---
  - method: POST
    path: "/invoices"
    description: "Create a DRAFT MaintenanceFeeInvoice for a contract (ANNUAL)"
    roles: [ResortManager]
    code: 201
    input: [contract_id, source_type, use_year, due_date, "special_assessment_id?"]
    output: MaintenanceFeeInvoice
    side_effects: ["status=DRAFT", "amount_cents provisionally computed via maintenance_fee_proration"]

  - method: GET
    path: "/invoices/{invoiceId}"
    description: "Get a MaintenanceFeeInvoice"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: []
    output: MaintenanceFeeInvoice
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List MaintenanceFeeInvoices (filter) — reverse-reachability for invoice.contract_id / owner_id / special_assessment_id"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: ["contract_id?", "owner_id?", "status?", "use_year?", "special_assessment_id?"]
    output: "MaintenanceFeeInvoice[]"
    side_effects: []

  - method: POST
    path: "/invoices/{invoiceId}/issue"
    description: "Issue a DRAFT invoice (finalize amount_cents)"
    roles: [ResortManager]
    code: 200
    input: []
    output: MaintenanceFeeInvoice
    side_effects: ["status -> ISSUED", "amount_cents finalized"]

  - method: POST
    path: "/invoices/{invoiceId}/mark-delinquent"
    description: "Mark an ISSUED invoice DELINQUENT once grace elapsed; opens a DelinquencyCase"
    roles: [ResortManager]
    code: 200
    input: []
    output: MaintenanceFeeInvoice
    side_effects: ["status -> DELINQUENT", "open DelinquencyCase (NOTICE) if none open"]

  # --- Payment ---
  - method: POST
    path: "/payments"
    description: "Create an INITIATED Payment against a contract"
    roles: [ResortManager, Owner]
    code: 201
    input: [contract_id, amount_cents, "invoice_id?"]
    output: Payment
    side_effects: ["status=INITIATED"]

  - method: GET
    path: "/payments/{paymentId}"
    description: "Get a Payment"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "List Payments (filter by contract/invoice/status) — reverse-reachability for Payment.contract_id and Payment.invoice_id"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: ["contract_id?", "invoice_id?", "status?"]
    output: "Payment[]"
    side_effects: []

  - method: POST
    path: "/payments/{paymentId}/clear"
    description: "Clear a Payment, allocate to invoices, cascade PAID and possible CURE"
    roles: [ResortManager]
    code: 200
    input: []
    output: Payment
    side_effects: ["status -> CLEARED", "allocate across invoices oldest-due-first", "invoices -> PAID; DelinquencyCase -> CURED when last DELINQUENT clears"]

  - method: POST
    path: "/payments/{paymentId}/fail"
    description: "Mark an INITIATED Payment FAILED"
    roles: [ResortManager]
    code: 200
    input: []
    output: Payment
    side_effects: ["status -> FAILED"]

  - method: POST
    path: "/payments/{paymentId}/reverse"
    description: "Reverse a CLEARED Payment, undo allocations, re-open cases"
    roles: [ResortManager]
    code: 200
    input: []
    output: Payment
    side_effects: ["status -> REVERSED", "undo allocations; revert invoice status; re-open CURED case"]

  # --- SpecialAssessment ---
  - method: POST
    path: "/special-assessments"
    description: "Create a DRAFT SpecialAssessment"
    roles: [ResortManager]
    code: 201
    input: [resort_id, reason, total_amount_cents, use_year]
    output: SpecialAssessment
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/special-assessments/{assessmentId}"
    description: "Get a SpecialAssessment"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: []
    output: SpecialAssessment
    side_effects: []

  - method: GET
    path: "/special-assessments"
    description: "List SpecialAssessments (filter by resort)"
    roles: [ResortManager, ResaleAgent, ComplianceOfficer]
    code: 200
    input: ["resort_id?", "status?"]
    output: "SpecialAssessment[]"
    side_effects: []

  - method: POST
    path: "/special-assessments/{assessmentId}/levy"
    description: "Levy the assessment: distribute via special_assessment_proration, create per-contract DRAFT invoices"
    roles: [ResortManager]
    code: 200
    input: [due_date]
    output: SpecialAssessment
    side_effects: ["status -> LEVIED", "create SPECIAL_ASSESSMENT DRAFT invoices per ACTIVE contract"]

  # --- ResaleTransfer ---
  - method: POST
    path: "/resale-transfers"
    description: "Initiate a resale transfer of a contract (PENDING_RESCISSION; signed_at set)"
    roles: [ResaleAgent]
    code: 201
    input: [source_contract_id, buyer_owner_id, sale_price_cents, transfer_use_year, transfer_day_of_year]
    output: ResaleTransfer
    side_effects: ["status=PENDING_RESCISSION", "signed_at set"]

  - method: GET
    path: "/resale-transfers/{transferId}"
    description: "Get a ResaleTransfer"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: []
    output: ResaleTransfer
    side_effects: []

  - method: GET
    path: "/resale-transfers"
    description: "List ResaleTransfers (filter) — reverse-reachability for source_contract_id / buyer_owner_id / new_contract_id"
    roles: [ResortManager, Owner, ResaleAgent, ComplianceOfficer]
    code: 200
    input: ["source_contract_id?", "buyer_owner_id?", "new_contract_id?", "resort_id?", "status?"]
    output: "ResaleTransfer[]"
    side_effects: []

  - method: POST
    path: "/resale-transfers/{transferId}/complete"
    description: "Complete a resale transfer after rescission; mint buyer contract, resale-split invoice"
    roles: [ResaleAgent]
    code: 200
    input: []
    output: ResaleTransfer
    side_effects: ["status -> COMPLETED", "source Contract -> TRANSFERRED", "mint buyer Contract", "resale-split annual invoice"]

  - method: POST
    path: "/resale-transfers/{transferId}/rescind"
    description: "Rescind a pending resale transfer inside the cooling-off window"
    roles: [Owner, ComplianceOfficer]
    code: 200
    input: []
    output: ResaleTransfer
    side_effects: ["status -> RESCINDED (source contract unchanged)"]

  # --- DelinquencyCase ---
  - method: GET
    path: "/delinquency-cases/{caseId}"
    description: "Get a DelinquencyCase"
    roles: [ResortManager, ComplianceOfficer, Owner]
    code: 200
    input: []
    output: DelinquencyCase
    side_effects: []

  - method: GET
    path: "/delinquency-cases"
    description: "List DelinquencyCases (filter) — reverse-reachability for case.contract_id / owner_id / trigger_invoice_id"
    roles: [ResortManager, ComplianceOfficer, Owner]
    code: 200
    input: ["contract_id?", "owner_id?", "trigger_invoice_id?", "status?"]
    output: "DelinquencyCase[]"
    side_effects: []

  - method: POST
    path: "/delinquency-cases/{caseId}/escalate"
    description: "Escalate a case (NOTICE -> LIEN, or LIEN -> LIEN); apply late charges; suspend contract on LIEN"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DelinquencyCase
    side_effects: ["status -> LIEN (first time)", "escalation_periods += 1", "apply delinquency_late_charge", "Contract -> SUSPENDED on first LIEN"]

  - method: POST
    path: "/delinquency-cases/{caseId}/foreclose"
    description: "Foreclose (DEEDED) or terminate (RIGHT_TO_USE) an eligible LIEN case"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DelinquencyCase
    side_effects: ["status -> FORECLOSURE | TERMINATION", "Contract -> FORECLOSED | TERMINATED", "write off DELINQUENT invoices"]

  # --- Test-driving (clock) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the resort clock (current_utc) to drive rescission and delinquency windows"
    roles: [ResortManager, System]
    code: 200
    input: [resort_id, to_iso8601]
    output: Resort
    side_effects: ["resort.current_utc = to_iso8601"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or not a valid role"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role is valid but not permitted for this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Owner X-User-ID does not match the owner_id of the contract the resource belongs to"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path resource id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, non-positive amount/points, invalid enum, week_number out of 1..52, transfer_day_of_year out of 1..365"
  - id: ERR_CROSS_RESORT_REFERENCE
    http: 409
    condition: "A referenced FK target exists but belongs to a different resort"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a valid from-state for the requested transition"
  - id: ERR_RESCISSION_WINDOW_OPEN
    http: 409
    condition: "Activate/complete attempted while the rescission cooling-off window is still open"
  - id: ERR_RESCISSION_WINDOW_CLOSED
    http: 409
    condition: "Rescind attempted after the cooling-off window has closed"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "Operation requires the owning contract be ACTIVE (or ACTIVE/SUSPENDED for issue) but it is not"
  - id: ERR_UNIT_NOT_AVAILABLE
    http: 409
    condition: "Reservation confirm on a unit that is not AVAILABLE (already RESERVED or DEPOSITED_TO_EXCHANGE)"
  - id: ERR_CONTRACT_DELINQUENT
    http: 409
    condition: "Resale transfer blocked: source contract has an open DelinquencyCase in {NOTICE, LIEN}"
  - id: ERR_GRACE_PERIOD_ACTIVE
    http: 409
    condition: "mark-delinquent attempted before due_date + grace days has elapsed"
  - id: ERR_FORECLOSURE_NOT_ELIGIBLE
    http: 409
    condition: "Foreclose attempted when case is not LIEN or escalation_periods < foreclosure_threshold_periods"
  - id: ERR_OWNERSHIP_TYPE_MISMATCH
    http: 409
    condition: "Foreclose branch does not match contract.ownership_type (DEEDED forecloses, RIGHT_TO_USE terminates)"
  - id: ERR_INSUFFICIENT_POINTS
    http: 409
    condition: "Reservation borrow exceeds use_year+1 available_points, or banking exceeds available_points"
  - id: ERR_ALREADY_DEPOSITED
    http: 409
    condition: "Reservation already has an ExchangeDeposit in {DEPOSITED, REDEEMED}"
  - id: ERR_NO_ELIGIBLE_CONTRACTS
    http: 409
    condition: "Levy attempted but no ACTIVE contracts exist at the resort"
  - id: ERR_NO_DELINQUENT_INVOICE
    http: 409
    condition: "Escalate attempted but the contract has no remaining DELINQUENT invoice"
  - id: ERR_INVOICE_NOT_PAYABLE
    http: 409
    condition: "mark-delinquent on an invoice whose amount_due_cents is 0"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_points_account_version does not match the current PointsAccount.version"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ResortManager
    description: "Resort operator: creates resorts/owners/units/contracts/invoices/assessments, activates, issues, marks delinquent, clears/reverses payments, completes reservations, runs rollover."
    identity: opaque
    exclusive_operations:
      - "POST /resorts — Create resort"
      - "POST /owners — Create owner"
      - "POST /inventory-units — Create inventory unit"
      - "POST /resorts/{id}/rollover-use-year — Advance use-year"
      - "POST /contracts/{id}/activate — Activate contract"
      - "POST /invoices — Create invoice"
      - "POST /invoices/{id}/issue — Issue invoice"
      - "POST /invoices/{id}/mark-delinquent — Mark delinquent"
      - "POST /payments/{id}/clear — Clear payment"
      - "POST /payments/{id}/fail — Fail payment"
      - "POST /payments/{id}/reverse — Reverse payment"
      - "POST /reservations/{id}/complete — Complete reservation"
      - "POST /special-assessments — Create assessment"
      - "POST /special-assessments/{id}/levy — Levy assessment"
    shared_operations:
      - "POST /reservations/{id}/cancel — shared with Owner"
      - "POST /points-accounts/{id}/bank — shared with Owner"
      - "POST /payments — shared with Owner"
      - "POST /contracts — shared with ResaleAgent"
      - "GET endpoints — shared read"

  - name: Owner
    description: "Timeshare owner acting on their own contracts: books/confirms/cancels reservations, banks points, deposits/redeems/recalls exchanges, pays invoices, rescinds within window."
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /reservations — Create reservation"
      - "POST /reservations/{id}/confirm — Confirm reservation"
      - "POST /reservations/{id}/deposit-exchange — Deposit to exchange"
      - "POST /exchange-deposits/{id}/redeem — Redeem exchange"
      - "POST /exchange-deposits/{id}/recall — Recall exchange"
    shared_operations:
      - "POST /reservations/{id}/cancel — shared with ResortManager"
      - "POST /points-accounts/{id}/bank — shared with ResortManager"
      - "POST /payments — shared with ResortManager"
      - "POST /contracts/{id}/rescind — shared with ComplianceOfficer"
      - "POST /resale-transfers/{id}/rescind — shared with ComplianceOfficer"
      - "GET endpoints — shared read"

  - name: ResaleAgent
    description: "Brokers secondary-market transfers: creates resale contracts, initiates and completes resale transfers."
    identity: opaque
    exclusive_operations:
      - "POST /resale-transfers — Initiate transfer"
      - "POST /resale-transfers/{id}/complete — Complete transfer"
    shared_operations:
      - "POST /contracts — shared with ResortManager"
      - "GET endpoints — shared read"

  - name: ComplianceOfficer
    description: "Regulatory officer: drives delinquency escalation and foreclosure/termination, can rescind on behalf of owners."
    identity: opaque
    exclusive_operations:
      - "POST /delinquency-cases/{id}/escalate — Escalate case"
      - "POST /delinquency-cases/{id}/foreclose — Foreclose/terminate"
    shared_operations:
      - "POST /contracts/{id}/rescind — shared with Owner"
      - "POST /resale-transfers/{id}/rescind — shared with Owner"
      - "GET endpoints — shared read"

  - name: System
    description: "Automation actor for clock-driven rollover and system-initiated transitions (cascades, deemed delinquency)."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /resorts/{id}/rollover-use-year — shared with ResortManager"
      - "POST /_clock/set_current_utc — shared with ResortManager"
