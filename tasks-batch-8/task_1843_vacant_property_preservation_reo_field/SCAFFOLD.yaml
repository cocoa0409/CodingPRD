  # --- Invoice / ExpenseLine ---
  - method: GET
    path: "/preservation/invoices/{invoiceId}"
    description: "Get an invoice"
    roles: [Servicer, VendorAdmin, Dispatcher, FieldCrew, QualityReviewer]
    code: 200
    input: []
