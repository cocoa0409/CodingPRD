            - "hop 2: FreshOrder.${foH_id}.status == CANCELLED and DeliveryWindow.${dwH_id}.reserved_units == 0"
            - "hop 3: Settlement.${setH_id}.status == FINALIZED"
            - "hop 4: DrawAdvance.${drH_id}.status == PARTIALLY_RECOVERED and DrawAdvance.${drH_id}.recovered_cents == 150000.00"
            - "Franchisee.${fH_id}.draw_outstanding_cents == 450000.00"
            - "FranchiseAgreement.${agH_id}.status == TERMINATED"
