            - call: "POST /claims/${claim_id}/routing-decisions"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimAdjuster
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/accept"
