        test_recipe:
          setup: ["members A and B exist"]
          setup_api_calls:
            - { call: "POST /v1/members", payload: { email: "a@x.edu", full_name: "M A", affiliation: "STUDENT" }, as: RecAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
