              as: ComplianceOfficer
              captures: { e_missing: $.data.error_id }
            - call: "PUT /farm-policies/${pol_id}/labor-profile"
              payload: { full_time_count: 4, seasonal_count: 4, migrant_h2a_count: 0, wc_carrier_name: "Prairie Mutual WC", wc_policy_number: "WC-2026-0001", wc_expiry_date: "2026-08-10" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { lab6_v2: $.data.version }
            - call: "POST /labor-profiles/${lab6_id}/wc-verification"
              payload: { note: "stale certificate" }
              as: ComplianceOfficer
              captures: { e_expired: $.data.error_id }
            - call: "PUT /farm-policies/${pol_id}/labor-profile"
              payload: { full_time_count: 4, seasonal_count: 4, migrant_h2a_count: 0, wc_carrier_name: "Prairie Mutual WC", wc_policy_number: "WC-2026-0002", wc_expiry_date: "2027-08-31" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { lab6_v3: $.data.version }
            - call: "POST /labor-profiles/${lab6_id}/wc-verification"
              payload: { note: "certificate on file" }
              as: ComplianceOfficer
              captures: { ver_status: $.data.coordination_status }
          assert:
            - "the profile computed labor_exposure_units 6.00 with wc_required true and coordination_status PENDING_PROOF on the very first PUT"
            - "call 1 returns HTTP 422 ERR_WC_PROOF_MISSING — the priority-13 completeness check fires before the priority-14 expiry check"
            - "call 3 returns HTTP 422 ERR_WC_PROOF_EXPIRED because wc_expiry_date 2026-08-10 is before the clock date 2026-08-15"
            - "call 5 succeeds: coordination_status VERIFIED, verified_at 2026-08-15T00:00:00Z and verified_by_user_id set to the compliance officer"
            - "LaborProfile.${lab6_id}.version == 4 (three PUTs plus the verification) and the row is the only labor profile of the policy — PUT upserts in place"
            - "FarmPolicy.${pol_id}.uw_status is still DRAFT and no premium figure moved"

  - section: calculations
    instances:

      - name: corner_property_premium_ignores_removed_items
        claim_type: input_set_filtering
        grounds: ["calculations.property_premium", "calculations.exposed_tiv", "entities.ScheduledItem.fields.status"]
        distinguishing_aspect: "Only status == ACTIVE items feed property_premium and exposed_tiv: a REMOVED combine keeps its insured_value_cents on the row but contributes neither premium nor TIV."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one DRAFT policy with an RC DWELLING at 40000000 and an ACV EQUIPMENT combine (stated 30001000, age 12, grade B -> insured 11040368)"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "EQUIPMENT", description: "Combine", valuation_basis: "ACV", stated_value_cents: 30001000, age_years: 12, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it_eq: $.data.id, eq_iv: $.data.insured_value_cents }
            - call: "PATCH /scheduled-items/${it_eq}"
              payload: { status: "REMOVED" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { eq_status: $.data.status }
            - *k_rate_get
          trigger:
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { filt_prop: $.data.property_premium_cents, filt_tiv: $.data.exposed_tiv_cents }
          assert:
            - "ScheduledItem.${it_eq}.insured_value_cents is still 11040368 and status is REMOVED"
            - "property_premium_cents == 144000 — the 89427 EQUIPMENT line is not written"
            - "exposed_tiv_cents == 40000000 and the HAIL reservation amount is 20000000, not 25520184"
            - "total_premium_cents == 269200 and the ledger holds only BASE_PROPERTY 144000 and CAT_LOAD 125200"
            - "GET /farm-policies/${pol_id}/scheduled-items?status=ACTIVE returns 1 row while the unfiltered list returns 2"

      - name: corner_deductible_credit_bands_at_their_edges
        claim_type: constants_applied
        grounds: ["calculations.property_premium.constants.DEDUCTIBLE_CREDIT_BANDS", "complexity_profile.complexity_layers.rate_threshold_triggers"]
        distinguishing_aspect: "Three policies with the identical 40000000 DWELLING and deductibles 99999 / 100000 / 1000000 pick the 1.00 / 0.95 / 0.85 bands, giving 160000 / 152000 / 136000 — the band edges are half-open upward, so exactly 100000 already loses the full credit."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, three FarmAccounts of one Agent in zone ZN-1, one policy each with a single RC DWELLING at 40000000 and deductibles 99999 / 100000 / 1000000"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - call: "POST /farm-accounts"
              payload: { legal_name: "Band A Farms", state_code: "KS", county_name: "Reno", cat_zone_code: "ZN-1", acreage: 1200, operation_type: "MIXED" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { acct_a: $.data.id }
            - call: "POST /farm-policies"
              payload: { account_id: "${acct_a}", term_start_date: "2026-09-01", term_end_date: "2027-08-31", deductible_cents: 99999 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { pol_a: $.data.id, pol_a_v: $.data.version }
            - call: "POST /farm-policies/${pol_a}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
