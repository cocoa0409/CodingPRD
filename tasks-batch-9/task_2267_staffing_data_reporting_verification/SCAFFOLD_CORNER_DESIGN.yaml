              as: AppealsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /vendor-submissions/${batch}/submit"
              payload: {}
              as: VendorRepresentative
              as_user_id: "${vend}"
          assert:
            - "PlatformAdmin created the facility, period and job categories in setup, and StaffingCoordinator's validate returns 200 with status VALIDATED and validated_by_worker_id == ${w_coord}"
            - "FacilityAdministrator's submit returns 200 with status SUBMITTED and attested_by_worker_id == ${w_admin}, and StateAuditor's accept returns 200 with status ACCEPTED and audit_support_score == 100.00"
            - "CmsPublisher's compute and publish return 201 and 200 with StaffingMeasure.${meas}.staffing_rating == 1 and publication_status == PUBLISHED"
            - "FacilityAdministrator's appeal returns 201 with status SUBMITTED and AppealsReviewer's deny returns 200 with status DENIED"
            - "VendorRepresentative's batch submit returns 200 with VendorHourSubmission.${batch}.status == SUBMITTED"

      - name: a_role_cannot_perform_another_roles_exclusive_operation
        claim_type: role_denied_operations
        grounds:
          - rbac
          - validations[priority 4 ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Peer roles are strictly partitioned with no hierarchical override: the auditor cannot validate, the publisher cannot accept, the administrator cannot key hours, and the reviewer cannot compute a measure."
        test_recipe:
          setup:
            - "A SUBMITTED 2026Q2 submission with one SUPPORTED 8.00-hour RN shift and one RECONCILED census day, plus one registered vendor"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_vend
            - *k_pr_0401
            - *k_entry_0401
            - *k_census_0401
            - *k_reconcile_c1
            - *k_verify_e1
            - *k_validate
            - *k_submit
          trigger:
            - call: "POST /submissions/${sub}/accept"
              payload: {}
              as: CmsPublisher
              as_user_id: "publisher-01"
            - call: "POST /submissions/${sub}/validate"
              payload: {}
              as: StateAuditor
              as_user_id: "auditor-accept-01"
            - call: "POST /hour-entries"
              payload: { submission_id: "${sub}", worker_id: "${w_rn}", job_category_id: "${jc_rn}", work_date: "2026-04-08", shift_start: "07:00", shift_end: "15:00", allocations: [{ job_category_id: "${jc_rn}", percent: 100.00 }], expected_submission_version: "${sv2}" }
              as: FacilityAdministrator
              as_user_id: "${w_admin}"
            - call: "POST /staffing-measures"
              payload: { submission_id: "${sub}" }
              as: AppealsReviewer
              as_user_id: "reviewer-01"
            - call: "GET /facilities"
              payload: { state_code: "TX", limit: 10, offset: 0 }
              as: VendorRepresentative
              as_user_id: "${vend}"
          assert:
            - "all five calls return 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "the role check precedes every state and payload check, so the AppealsReviewer call is not reported as ERR_SUBMISSION_STATE_INVALID"
            - "QuarterlySubmission.${sub}.status is still SUBMITTED with version unchanged, and GET /hour-entries with submission_id ${sub} returns total_count == 1"
            - "GET /staffing-measures with submission_id ${sub} returns total_count == 0"

      - name: unauthorized_or_terminated_worker_cannot_act
        claim_type: role_denied_operations
        grounds:
          - validations[priority 5 ERR_WORKER_ROLE_NOT_AUTHORIZED]
          - validations[priority 6 ERR_ACTOR_INACTIVE]
          - entities.Worker.authorized_roles
        distinguishing_aspect: "For the two entity-backed roles the header role is not enough: the acting Worker must carry the role in authorized_roles and must still be ACTIVE, and the two guards are separately observable in priority order."
        test_recipe:
          setup:
            - "A DRAFT 2026Q2 submission, an RN worker with an empty authorized_roles array, and one census day so the census guard cannot pre-empt"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_census_0401
          trigger:
            - call: "POST /submissions/${sub}/validate"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_rn}"
            - call: "POST /workers/${w_coord}/terminate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /submissions/${sub}/validate"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
          assert:
            - "the first validate returns 403 with data.error_id == ERR_WORKER_ROLE_NOT_AUTHORIZED, since Worker.${w_rn}.authorized_roles is []"
            - "the terminate returns 200 with Worker.${w_coord}.status == TERMINATED"
            - "the second validate returns 403 with data.error_id == ERR_ACTOR_INACTIVE, not ERR_WORKER_ROLE_NOT_AUTHORIZED, because ${w_coord} does carry STAFFING_COORDINATOR"
            - "QuarterlySubmission.${sub}.status is still DRAFT with validated_by_worker_id == null"

      - name: cross_facility_and_cross_vendor_actors_cannot_reach_foreign_rows
        claim_type: role_denied_operations
        grounds:
          - validations[priority 7 ERR_FACILITY_SCOPE_VIOLATION]
          - validations[priority 8 ERR_VENDOR_SCOPE_VIOLATION]
        distinguishing_aspect: "Scope is checked against the target row's owning facility or vendor rather than against the header alone, so a fully authorized coordinator at another facility and a second vendor at the same facility are both refused."
        test_recipe:
          setup:
            - "Facility 675001 with a DRAFT submission, one census day and a DRAFT Northgate batch, plus facility 675002 with its own authorized coordinator, plus a second vendor Southgate at 675001"
          setup_api_calls:
            - *k_fac
            - *k_per
            - *k_jc_rn
            - *k_jc_split
            - *k_jc_admin
            - *k_w_coord
            - *k_w_admin
            - *k_w_rn
            - *k_sub
            - *k_census_0401
            - *k_vend
            - *k_w_ag
            - *k_batch
            - *k_fac2
            - call: "POST /workers"
              payload: { facility_id: "${fac2}", full_name: "Noel Othercoord", worker_type: "EMPLOYEE", primary_job_category_id: "${jc_admin}", hire_date: "2026-01-01", authorized_roles: ["STAFFING_COORDINATOR"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { w_coord2: $.data.id }
            - call: "POST /vendors"
              payload: { facility_id: "${fac}", vendor_name: "Southgate Agency Staffing", tax_id: "74-3310077", attestation_contact: "ops@southgate.example" }
              as: PlatformAdmin
