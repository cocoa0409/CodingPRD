            - call: "POST /site-utility/unforeseen-conditions"
              payload: { project_id: "${p_id}", condition_type: ROCK, stop_work_required: false, description: "rock" }
              as: ProjectManager
              captures: { uc_id: $.data.id }
          trigger:
            - call: "POST /site-utility/change-orders"
              payload: { project_id: "${p_id}", unforeseen_condition_id: "${uc_id}", utility_owner_id: "${o_id}", labor_hours: 1.0, labor_rate_cents: 15000, equipment_hours: 0.0, equipment_rate_cents: 1, material_cost_cents: 0, expected_project_version: "${p_v}" }
              as: ProjectManager
              captures: { co1_id: $.data.id }
            - call: "POST /site-utility/change-orders"
              payload: { project_id: "${p_id}", unforeseen_condition_id: "${uc_id}", utility_owner_id: "${o_id}", labor_hours: 2.0, labor_rate_cents: 15000, equipment_hours: 0.0, equipment_rate_cents: 1, material_cost_cents: 0, expected_project_version: "${p_v}" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION (http 412)"
            - "ChangeOrder.${co1_id}.status stays DRAFT (the failed create did not supersede it) and Project.${p_id}.version == 2"

      - name: co_supersede_replaces_open_draft
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ChangeOrder.DRAFT_to_SUPERSEDED
          - state_machines.ChangeOrder.SUBMITTED_to_SUPERSEDED
        distinguishing_aspect: "Create-with-supersede: a fresh-version create for the same condition auto-supersedes the existing open CO (SUBMITTED -> SUPERSEDED) while the new CO starts at DRAFT revision 1."
        test_recipe:
          setup: ["Project P (version 1); owner O; condition C OPEN; CO1 SUBMITTED (created then submitted)"]
          setup_api_calls:
            - call: "POST /site-utility/projects"
              payload: { name: "P-SUP", contract_ref: "C-802", soil_class_default: SOIL_B, contingency_cents: 100000000, single_co_cap_cents: 5000000 }
              as: ProjectManager
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /site-utility/utility-owners"
              payload: { name: "City Water", owner_type: WATER, min_notice_hours: 48, max_shutdown_hours: 8 }
              as: OpsAdmin
              captures: { o_id: $.data.id }
            - call: "POST /site-utility/unforeseen-conditions"
              payload: { project_id: "${p_id}", condition_type: ROCK, stop_work_required: false, description: "rock" }
              as: ProjectManager
              captures: { uc_id: $.data.id }
            - call: "POST /site-utility/change-orders"
              payload: { project_id: "${p_id}", unforeseen_condition_id: "${uc_id}", utility_owner_id: "${o_id}", labor_hours: 1.0, labor_rate_cents: 15000, equipment_hours: 0.0, equipment_rate_cents: 1, material_cost_cents: 0, expected_project_version: "${p_v}" }
              as: ProjectManager
              captures: { co1_id: $.data.id }
            - call: "POST /site-utility/change-orders/${co1_id}/submit"
              payload: {}
              as: ProjectManager
              as_user_id: "pm-1"
            - call: "GET /site-utility/projects/${p_id}"
              payload: {}
              as: ProjectManager
              captures: { p_v2: $.data.version }
          trigger:
            - call: "POST /site-utility/change-orders"
              payload: { project_id: "${p_id}", unforeseen_condition_id: "${uc_id}", utility_owner_id: "${o_id}", labor_hours: 5.0, labor_rate_cents: 15000, equipment_hours: 1.0, equipment_rate_cents: 20000, material_cost_cents: 5000, expected_project_version: "${p_v2}" }
              as: ProjectManager
              captures: { co2_id: $.data.id }
          assert:
            - "ChangeOrder.${co1_id}.status == SUPERSEDED (side effect of the fresh create)"
            - "ChangeOrder.${co2_id}.status == DRAFT and revision == 1 and provisional_price_cents == 115000 (direct 75000 + 20000 + 5000 = 100000; markup 15000 = 15% of 100000)"
            - "Project.${p_id}.version advanced twice from its create value ${p_v}"

      - name: stop_work_blocks_segment_actions
        claim_type: cascading_side_effects
        grounds:
          - validations[priority=7]
          - entities.Project.fields.work_posture
        distinguishing_aspect: "While posture is STOPPED, even an otherwise-eligible segment action (start-install on READY with ACTIVE ticket) is rejected ERR_PROJECT_STOPPED; resolving the condition restores the path."
        test_recipe:
          setup: ["Project P; owner O; ticket ACTIVE (clock 2026-08-03); pothole VERIFIED; segment S READY; then condition C OPEN with stop_work_required=true"]
