        distinguishing_aspect: "Activating a DENSITY_BASED program while a CLASS_BASED one is ACTIVE retires the incumbent in the same call and repoints Customer.active_program_type — at most one ACTIVE program per customer is maintained by transition, never by rejection."
        test_recipe:
          setup:
            - "Logical clock 2026-01-10T08:00:00Z; customer ACME; RP1 CLASS_BASED already ACTIVE; RP2 DENSITY_BASED created and APPROVED."
