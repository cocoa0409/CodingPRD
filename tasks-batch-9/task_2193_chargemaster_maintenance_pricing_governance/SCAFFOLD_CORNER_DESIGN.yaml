          - endpoints[GET /chargemaster/missing-charge-findings/{finding_id}]
          - endpoints[GET /chargemaster/missing-charge-findings]
        distinguishing_aspect: "MissingChargeFinding has two terminal states reachable from different sources — DISMISSED from OPEN and RESOLVED only from CONFIRMED — so RESOLVE on an OPEN finding is a state error even though the recovery line is perfectly valid, and both terminals reject every further action. The leakage arithmetic is checked from below the 500000 hold boundary: only the CONFIRMED finding's 240000 lands in unresolved_finding_amount_cents (the DISMISSED one contributes nothing), so capture_hold stays false and the batch can still be closed."
