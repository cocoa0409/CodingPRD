              payload: { sample_seq: 5, elapsed_seconds: 960, instantaneous_leakage_cfm: 75.0, injection_pressure_pa: 800.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { r5: $.data.seal_rate_cfm_per_min }
            - call: "GET /duct-sealing/seal-jobs/${job_id}"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { tr_after: $.data.target_reached, cur_after: $.data.current_leakage_cfm, st_after: $.data.status }
            - call: "POST /duct-sealing/seal-jobs/${job_id}/complete-seal"
              payload: { sealant_lbs_used: 2.4 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { st_sealed: $.data.status }
            - call: "GET /duct-sealing/duct-systems/${ds1_id}"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { ds_work: $.data.working_leakage_cfm25, ds_red: $.data.sealed_leakage_reduction_cfm }
          assert:
            - "${r1} == null and ${r2} == null: seal_rate_cfm_per_min stays null while sample_seq < STALL_WINDOW_SAMPLES (3)"
            - "${r3} == 0.13: (300.0 - 299.0) / ((480 - 0) / 60.0) = 0.125, round_half_up to 2 dp — and 0.13 < MIN_SEAL_RATE_CFM_PER_MIN 0.50"
            - "${st_stalled} == PAUSED, ${f_stalled} == true, ${pc_stalled} == 0 and ${tr_stalled} == false: the stall auto-pause is a system transition, so pause_count (which counts explicit pauses) is untouched"
            - "${st_resumed} == INJECTING and ${f_resumed} == false: resume is the reset for stall_flag"
            - "${r4} == 28.75: the 3-sample window compares seq 4 against seq 2, (290.0 - 60.0) / ((720 - 240) / 60.0)"
            - "${tr_hit} == true with ${cur_hit} == 60.0: the latch fires at instantaneous_leakage_cfm == target_leakage_cfm exactly (<=, not <)"
            - "${r5} == 28.00: (299.0 - 75.0) / ((960 - 480) / 60.0) — the window uses seq 3 even though that sample stalled the run"
            - "${tr_after} == true with ${cur_after} == 75.0 and ${st_after} == INJECTING: target_reached is latched and never cleared, even though the current reading is now above target"
            - "${st_sealed} == SEALED: complete-seal passes its target_reached precondition at 75.0 CFM against a 60.0 target"
            - "${ds_work} == 75.00 and ${ds_red} == 225.00 (300.00 - 75.00): close-out uses the LAST sample, not the best one"

