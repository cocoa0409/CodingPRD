        grounds:
          - calculations.freezer_excursion_assessment
          - state_machines.StorageUnit.OPERATIONAL_to_WARNING
        distinguishing_aspect: |
          Metric: temperature versus warn_threshold_c, endpoint POST
          /temperature-readings. The rule is strictly-greater: a reading of
          exactly -70.0 leaves the unit OPERATIONAL, while -69.9 flips it to
          WARNING.
        test_recipe:
          setup:
            - "Unit FRZ-BND OPERATIONAL with warn_threshold_c -70.0, fail_threshold_c -60.0"
          setup_api_calls:
            - { call: "POST /biobank/storage-units", payload: { unit_code: "FRZ-BND", setpoint_c: -80.0, warn_threshold_c: -70.0, fail_threshold_c: -60.0 }, as: BiobankAdmin, captures: { u_id: "$.data.id" } }
          trigger:
            - { call: "POST /biobank/storage-units/${u_id}/temperature-readings", payload: { recorded_at: "2026-05-01T00:00:00Z", temp_c: -70.0 }, as: LabTechnician }
            - { call: "POST /biobank/storage-units/${u_id}/temperature-readings", payload: { recorded_at: "2026-05-01T01:00:00Z", temp_c: -69.9 }, as: LabTechnician }
          assert:
            - "After the exactly -70.0 reading: GET /biobank/storage-units/${u_id} -> posture == OPERATIONAL (strict > did not fire)"
            - "After the -69.9 reading: posture == WARNING"
            - "peak_excursion_c == 0.1 (round_half_up(-69.9 - -70.0, 2))"

      - name: quorum_exact_approval
        grounds:
          - calculations.committee_quorum
          - state_machines.SampleRequest.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Metric: integer vote count versus QUORUM_COUNT 3, endpoint POST
          /votes (different metric and endpoint from the temperature instance).
          The >= boundary is inclusive: two approvals leave the request
          UNDER_REVIEW and the third approval flips it to APPROVED.
        test_recipe:
          setup:
            - "Agreement AG ACTIVE; request RQ-Q (5.0ml) UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /biobank/sharing-agreements", payload: { recipient_institution: "Uni Q", scope_uses: ["GENERAL_RESEARCH"], total_committed_volume_ml: 100.0, effective_from: "2026-04-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }, as: BiobankAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements/${ag_id}/activate", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/sample-requests", payload: { title: "RQ-Q", required_uses: ["GENERAL_RESEARCH"], specimen_type: "BLOOD", volume_needed_ml: 5.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-1", captures: { rq_id: "$.data.id" } }
            - { call: "POST /biobank/sample-requests/${rq_id}/submit", payload: {}, as: Researcher, as_user_id: "researcher-1" }
          trigger:
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale one" }, as: CommitteeReviewer, as_user_id: "rev-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale two" }, as: CommitteeReviewer, as_user_id: "rev-2" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale three" }, as: CommitteeReviewer, as_user_id: "rev-3" }
          assert:
            - "After vote 2: GET /biobank/sample-requests/${rq_id} -> votes_for == 2 and status == UNDER_REVIEW (2 < 3)"
            - "After vote 3: votes_for == 3 and status == APPROVED (3 >= 3, inclusive boundary)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: accession_requires_kit_returned
        grounds:
          - state_machines.CollectionKit.DISTRIBUTED_to_RETURNED
          - validations[priority=4]
          - errors[ERR_KIT_NOT_RETURNED]
        distinguishing_aspect: |
          Entity pair Specimen <- CollectionKit: specimen accession is gated on
          the kit being RETURNED; while the kit is merely DISTRIBUTED the
          accession fails with ERR_KIT_NOT_RETURNED and succeeds only after
          receive-return.
        test_recipe:
          setup:
            - "Donor D with ACTIVE consent; kit K distributed to D but not yet returned"
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-CE1" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
          trigger:
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 50.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { err: "$.data.error_id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 50.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { sp_id: "$.data.id" } }
          assert:
            - "First accession -> 409 error_id == ERR_KIT_NOT_RETURNED"
            - "After receive-return the identical accession -> 201 and the specimen exists with lifecycle_status == ACCESSIONED (no slot provided)"

      - name: checkout_requires_unit_operational
        grounds:
          - state_machines.StorageUnit.OPERATIONAL_to_WARNING
          - validations[priority=18]
          - errors[ERR_UNIT_NOT_OPERATIONAL]
        distinguishing_aspect: |
          Entity pair Aliquot <- StorageUnit (different pair from the kit
          instance): checkout of a properly RESERVED aliquot is gated on the
          housing unit's posture being OPERATIONAL; a WARNING posture alone
          (no aliquot state change) blocks checkout with
          ERR_UNIT_NOT_OPERATIONAL.
        test_recipe:
          setup:
            - "Standard chain through fulfill: aliquot AL RESERVED for APPROVED request RQ; then a -69.9 reading puts the unit into WARNING"
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-CE2" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/storage-units", payload: { unit_code: "FRZ-CE2", setpoint_c: -80.0, warn_threshold_c: -70.0, fail_threshold_c: -60.0 }, as: BiobankAdmin, captures: { u_id: "$.data.id" } }
            - { call: "POST /biobank/storage-units/${u_id}/slots", payload: { slot_code: "A1", capacity_ml: 500 }, as: BiobankAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 100.0, collected_at: "2026-05-02T00:00:00Z", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { sp_id: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /biobank/specimens/${sp_id}/aliquots", payload: { initial_volume_ml: 40.0, expected_specimen_version: "${sp_v}", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { a_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements", payload: { recipient_institution: "Uni E", scope_uses: ["GENERAL_RESEARCH"], total_committed_volume_ml: 1000.0, effective_from: "2026-04-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }, as: BiobankAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements/${ag_id}/activate", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/sample-requests", payload: { title: "RQ-CE2", required_uses: ["GENERAL_RESEARCH"], specimen_type: "BLOOD", volume_needed_ml: 40.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-1", captures: { rq_id: "$.data.id" } }
            - { call: "POST /biobank/sample-requests/${rq_id}/submit", payload: {}, as: Researcher, as_user_id: "researcher-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale one" }, as: CommitteeReviewer, as_user_id: "rev-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale two" }, as: CommitteeReviewer, as_user_id: "rev-2" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale three" }, as: CommitteeReviewer, as_user_id: "rev-3" }
            - { call: "POST /biobank/sample-requests/${rq_id}/fulfill", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/storage-units/${u_id}/temperature-readings", payload: { recorded_at: "2026-05-03T00:00:00Z", temp_c: -69.9 }, as: LabTechnician }
          trigger:
            - { call: "POST /biobank/aliquots/${a_id}/checkout", payload: { request_id: "${rq_id}" }, as: LabTechnician, captures: { err: "$.data.error_id" } }
          assert:
            - "Checkout response -> 409 error_id == ERR_UNIT_NOT_OPERATIONAL"
            - "GET /biobank/aliquots/${a_id} -> status remains RESERVED (the WARNING posture did not quarantine it)"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: slot_reservation_half_open_adjacency
        grounds:
          - validations[priority=11]
          - errors[ERR_SLOT_RESERVATION_OVERLAP]
          - entities.SlotReservation.fields.ends_at
        distinguishing_aspect: |
          Resource StorageSlot with HALF-OPEN [starts_at, ends_at) semantics: a
          reservation starting exactly at the existing reservation's ends_at is
          allowed (adjacency is not overlap), while one starting one minute
          before ends_at conflicts.
        test_recipe:
          setup:
            - "Unit FRZ-OV1 OPERATIONAL with slot A1; existing BOOKED reservation 2026-06-01T10:00..2026-06-01T12:00"
          setup_api_calls:
            - { call: "POST /biobank/storage-units", payload: { unit_code: "FRZ-OV1", setpoint_c: -80.0 }, as: BiobankAdmin, captures: { u_id: "$.data.id" } }
            - { call: "POST /biobank/storage-units/${u_id}/slots", payload: { slot_code: "A1", capacity_ml: 500 }, as: BiobankAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /biobank/storage-slots/${s_id}/reservations", payload: { starts_at: "2026-06-01T10:00:00Z", ends_at: "2026-06-01T12:00:00Z", purpose: "MAINTENANCE" }, as: LabTechnician, captures: { res1: "$.data.id" } }
          trigger:
            - { call: "POST /biobank/storage-slots/${s_id}/reservations", payload: { starts_at: "2026-06-01T12:00:00Z", ends_at: "2026-06-01T14:00:00Z", purpose: "AUDIT" }, as: LabTechnician, captures: { res2: "$.data.id" } }
            - { call: "POST /biobank/storage-slots/${s_id}/reservations", payload: { starts_at: "2026-06-01T11:59:00Z", ends_at: "2026-06-01T13:00:00Z", purpose: "TRANSFER_HOLD" }, as: LabTechnician, captures: { err: "$.data.error_id" } }
          assert:
            - "Adjacent reservation (12:00 start == existing 12:00 end) -> 201 with id captured (half-open adjacency allowed)"
            - "Overlapping reservation (11:59 start < 12:00 end) -> 409 error_id == ERR_SLOT_RESERVATION_OVERLAP"
            - "GET /biobank/storage-slots/${s_id}/reservations -> exactly 2 BOOKED reservations"

      - name: key_grant_closed_interval_with_buffer
        grounds:
          - validations[priority=12]
          - errors[ERR_GRANT_WINDOW_CONFLICT]
          - entities.KeyAccessGrant.fields.ends_at
        distinguishing_aspect: |
          Resource DeidentificationKey with CLOSED [starts_at, ends_at]
          semantics PLUS a 24h mandatory buffer — a different interval geometry
          from the half-open slot rule: a grant starting exactly at the
          existing grant's ends_at CONFLICTS (touching counts), a gap of 23
          hours conflicts, and only a gap of exactly 24 hours is accepted.
        test_recipe:
          setup:
            - "Specimen SP-K with DeidentificationKey KEY; existing grant [2026-06-01T09:00, 2026-06-01T17:00] (closed)"
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-OV2" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z", allow_reidentification: true }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 50.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { sp_id: "$.data.id" } }
            - { call: "POST /biobank/deidentification-keys", payload: { specimen_id: "${sp_id}" }, as: ConsentCoordinator, captures: { key_id: "$.data.id" } }
            - { call: "POST /biobank/deidentification-keys/${key_id}/grants", payload: { grantee_user_id: "officer-a", starts_at: "2026-06-01T09:00:00Z", ends_at: "2026-06-01T17:00:00Z", purpose: "audit follow-up" }, as: ConsentCoordinator, captures: { g1: "$.data.id" } }
          trigger:
            - { call: "POST /biobank/deidentification-keys/${key_id}/grants", payload: { grantee_user_id: "officer-b", starts_at: "2026-06-01T17:00:00Z", ends_at: "2026-06-01T19:00:00Z", purpose: "touching window" }, as: ConsentCoordinator, captures: { err_touch: "$.data.error_id" } }
            - { call: "POST /biobank/deidentification-keys/${key_id}/grants", payload: { grantee_user_id: "officer-b", starts_at: "2026-06-02T16:00:00Z", ends_at: "2026-06-02T18:00:00Z", purpose: "23 hour gap" }, as: ConsentCoordinator, captures: { err_gap: "$.data.error_id" } }
            - { call: "POST /biobank/deidentification-keys/${key_id}/grants", payload: { grantee_user_id: "officer-b", starts_at: "2026-06-02T17:00:00Z", ends_at: "2026-06-03T09:00:00Z", purpose: "exactly 24 hour gap" }, as: ConsentCoordinator, captures: { g2: "$.data.id" } }
          assert:
            - "Touching grant (starts == existing ends) -> 409 ERR_GRANT_WINDOW_CONFLICT (closed intervals: endpoints touch = overlap)"
            - "23h-gap grant -> 409 ERR_GRANT_WINDOW_CONFLICT (gap < 24h buffer)"
            - "Exactly-24h-gap grant -> 201 with id captured (buffer satisfied at equality)"
            - "GET /biobank/deidentification-keys/${key_id}/grants -> exactly 2 ACTIVE grants"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: aliquot_create_void_volume_invariant
        grounds:
          - calculations.specimen_volume_reconciliation
          - state_machines.Aliquot.IN_STORAGE_to_VOID
        distinguishing_aspect: |
          Conserved quantity: physical specimen volume. Invariant
          initial_volume_ml == residual_volume_ml + SUM(child aliquot
          initial_volume_ml where status != VOID) must hold after BOTH the
          forward action (create: 100 == 60 + 40) and its compensating action
          (void: 100 == 100 + 0), with no drift.
        test_recipe:
          setup:
            - "Specimen SP-V 100.0ml ACCESSIONED (no slot); no aliquots yet"
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-CI1" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 100.0, collected_at: "2026-05-02T00:00:00Z" }, as: LabTechnician, captures: { sp_id: "$.data.id", sp_v: "$.data.version" } }
          trigger:
            - { call: "POST /biobank/specimens/${sp_id}/aliquots", payload: { initial_volume_ml: 40.0, expected_specimen_version: "${sp_v}" }, as: LabTechnician, captures: { a_id: "$.data.id" } }
            - { call: "POST /biobank/aliquots/${a_id}/void", payload: {}, as: LabTechnician }
          assert:
            - "After create: GET /biobank/specimens/${sp_id} -> residual_volume_ml == 60.0 (invariant: 100.0 == 60.0 + 40.0)"
            - "After void: residual_volume_ml == 100.0 (invariant restored: 100.0 == 100.0 + 0; VOID aliquot excluded from the sum)"
            - "GET /biobank/aliquots/${a_id} -> status == VOID and remaining_volume_ml == 0.0"

      - name: fulfill_cancel_quota_invariant
        grounds:
          - calculations.fulfillment_quota_charge
          - state_machines.Aliquot.RESERVED_to_IN_STORAGE
          - state_machines.SampleRequest.APPROVED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: contractual quota volume (a different conserved
          type from physical specimen volume). Invariant total_committed ==
          remaining + reserved + fulfilled must hold after BOTH the forward
          fulfill (1000 == 960 + 40 + 0) and its compensating cancel
          (1000 == 1000 + 0 + 0).
        test_recipe:
          setup:
            - "Standard chain: specimen SP-Q 100ml with aliquot AL-Q 40ml; agreement AG-Q ACTIVE total 1000.0; request RQ-Q APPROVED"
          setup_api_calls:
            - { call: "POST /biobank/donors", payload: { donor_reference_code: "D-CI2" }, as: ConsentCoordinator, captures: { d_id: "$.data.id" } }
            - { call: "POST /biobank/donors/${d_id}/consent-records", payload: { permitted_uses: ["GENERAL_RESEARCH"], effective_from: "2026-05-01T00:00:00Z" }, as: ConsentCoordinator, captures: { c_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits", payload: { kit_type: "BLOOD", expires_at: "2027-01-01T00:00:00Z" }, as: ConsentCoordinator, captures: { k_id: "$.data.id" } }
            - { call: "POST /biobank/collection-kits/${k_id}/distribute", payload: { donor_id: "${d_id}" }, as: ConsentCoordinator }
            - { call: "POST /biobank/collection-kits/${k_id}/receive-return", payload: {}, as: ConsentCoordinator }
            - { call: "POST /biobank/storage-units", payload: { unit_code: "FRZ-CI2", setpoint_c: -80.0 }, as: BiobankAdmin, captures: { u_id: "$.data.id" } }
            - { call: "POST /biobank/storage-units/${u_id}/slots", payload: { slot_code: "A1", capacity_ml: 500 }, as: BiobankAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /biobank/specimens", payload: { donor_id: "${d_id}", kit_id: "${k_id}", consent_record_id: "${c_id}", specimen_type: "BLOOD", initial_volume_ml: 100.0, collected_at: "2026-05-02T00:00:00Z", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { sp_id: "$.data.id", sp_v: "$.data.version" } }
            - { call: "POST /biobank/specimens/${sp_id}/aliquots", payload: { initial_volume_ml: 40.0, expected_specimen_version: "${sp_v}", storage_slot_id: "${s_id}" }, as: LabTechnician, captures: { a_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements", payload: { recipient_institution: "Uni I", scope_uses: ["GENERAL_RESEARCH"], total_committed_volume_ml: 1000.0, effective_from: "2026-04-01T00:00:00Z", effective_to: "2027-04-01T00:00:00Z" }, as: BiobankAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /biobank/sharing-agreements/${ag_id}/activate", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/sample-requests", payload: { title: "RQ-Q2", required_uses: ["GENERAL_RESEARCH"], specimen_type: "BLOOD", volume_needed_ml: 40.0, sharing_agreement_id: "${ag_id}" }, as: Researcher, as_user_id: "researcher-1", captures: { rq_id: "$.data.id" } }
            - { call: "POST /biobank/sample-requests/${rq_id}/submit", payload: {}, as: Researcher, as_user_id: "researcher-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale one" }, as: CommitteeReviewer, as_user_id: "rev-1" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale two" }, as: CommitteeReviewer, as_user_id: "rev-2" }
            - { call: "POST /biobank/sample-requests/${rq_id}/votes", payload: { decision: "APPROVE", rationale: "committee approval rationale three" }, as: CommitteeReviewer, as_user_id: "rev-3" }
          trigger:
            - { call: "POST /biobank/sample-requests/${rq_id}/fulfill", payload: {}, as: BiobankAdmin }
            - { call: "POST /biobank/sample-requests/${rq_id}/cancel", payload: {}, as: Researcher, as_user_id: "researcher-1" }
          assert:
            - "After fulfill: GET /biobank/sharing-agreements/${ag_id} -> remaining_volume_ml == 960.0 and reserved_volume_ml == 40.0 and fulfilled_volume_ml == 0.0 (1000 == 960 + 40 + 0)"
