    output: FundingAgreement[]
    side_effects: []
  - method: GET
    path: "/stations/{id}"
    description: "Read one station with every derived posture, inventory, supply and metering field"
    roles: [PlatformAdmin, StationOperator, ComplianceAdmin, SafetyOfficer, LogisticsDispatcher, ProgramAuditor]
    code: 200
    input: []
    output: Station
    side_effects: []
