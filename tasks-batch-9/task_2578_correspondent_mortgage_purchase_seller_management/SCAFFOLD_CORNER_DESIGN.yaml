      - name: missing_x_user_headers_are_unauthenticated_while_an_unknown_role_is_forbidden
        claim_type: authentication_and_role_resolution
        grounds:
          - validations[priority 1]
          - validations[priority 2]
        distinguishing_aspect: |
          The two header failures are kept apart: a request with NO X-User-Role
          and a request with NO X-User-ID both answer ERR_UNAUTHENTICATED (401)
          before any routing, while a syntactically present but unrecognised
          role value ("Auditor") gets past authentication and lands on
          ERR_FORBIDDEN_ROLE (403) because it appears on no endpoint's role
          list.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z and one product ${p_conf} so the target endpoints have real data behind them"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/products"
              payload: { product_code: "CONF30F", base_price_pct: 101.250, min_fico: 680, max_ltv_pct: 95.0, max_loan_amount_cents: 76650000, allowed_commitment_types: ["MANDATORY", "BEST_EFFORTS"], allowed_occupancies: ["PRIMARY", "SECOND_HOME"], srp_pct: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
              captures: { p_conf: $.data.id }
          trigger:
            - call: "GET /correspondent/products/${p_conf}"
              payload: {}
              as: "<X-User-Role header omitted entirely>"
              as_user_id: "u-adm-1"
              captures: { e_no_role: $.data.error_id }
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Nameless Lending LLC", tin: "500000001", seller_type: "BANK" }
              as: CounterpartyAnalyst
              as_user_id: "<X-User-ID header omitted entirely>"
              captures: { e_no_user: $.data.error_id }
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Nameless Lending LLC", tin: "500000001", seller_type: "BANK" }
              as: "<X-User-Role: empty string>"
              as_user_id: "u-ca-1"
              captures: { e_empty_role: $.data.error_id }
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Nameless Lending LLC", tin: "500000001", seller_type: "BANK" }
              as: Auditor
              as_user_id: "u-au-1"
              captures: { e_unknown_role: $.data.error_id }
          assert:
            - "${e_no_role} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${e_no_user} == ERR_UNAUTHENTICATED with HTTP 401 and no Seller row is created"
            - "${e_empty_role} == ERR_UNAUTHENTICATED with HTTP 401 — an empty header is treated as missing, not as an unknown role"
            - "${e_unknown_role} == ERR_FORBIDDEN_ROLE with HTTP 403 — authenticated but on no endpoint's role list"
            - "no Seller row exists after all four calls"

