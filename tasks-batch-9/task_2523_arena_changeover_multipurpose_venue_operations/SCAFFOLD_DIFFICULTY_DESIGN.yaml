  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: condensation_score_of_exactly_40_00_blocks_covering_while_39_99_passes_on_a_three_hundredths_dehum_change
        grounds:
          - calculations.condensation_risk_score
          - validations[priority=60]
          - validations[priority=62]
          - state_machines.IceSheet.IN_SERVICE_to_COVERED
          - entities.IceSheet.fields.condensation_risk_score
          - errors.ERR_CONDENSATION_RISK_TOO_HIGH
        distinguishing_aspect: |
          The sheet is installed at exactly the MIN_DEHUM_FRACTION floor — 30 lph against a pinned
          demand of 120 — which passes the >= dehumidification gate yet lands the weighted score on
          exactly CONDENSATION_BLOCK_THRESHOLD 40.00, and because the cover gate is strict (<
          40.00) the covering call is refused; raising the applied rate by three hundredths of a
          litre to 30.03 moves the unrounded score to 39.98875, which round_half_up to 2 decimals
          renders 39.99 and admits the identical call, so an implementation that rounds to whole
          numbers, uses <= on the threshold, or recomputes required_dehumidification_lph from the
          profile instead of the install-time snapshot flips one of the two outcomes.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Lakeside Arena registered with PROFILE ICE declared (dehumidification_required_lph 120)."
            - "An IceSheet installed from PROFILE ICE with dehumidification_lph_applied exactly 30 (0.25 * 120) and sheet_thickness_mm 24, giving dehum_deficit 0.75, thickness_deficit 0.25, cover_load 0 and condensation_risk_score exactly 40.00."
