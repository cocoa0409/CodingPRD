          - entities.HedgeInstrument.fields.margin_requirement_usd
          - entities.Counterparty.fields.utilized_credit_usd
          - validations[priority=22]
        distinguishing_aspect: |
          Margin is a self-referential composition: each trade's requirement is scaled by
          a concentration add-on keyed on the counterparty exposure that EXCLUDES that
          trade, so four identical-rate SWAPs against a 300000.00 limit produce
          180000.00 (add-on 0.00), 66000.00 (add-on 0.10 at concentration 60.00),
          37500.00 (add-on 0.25 at 82.00) and a fourth request of 18000.00 that tips the
          total to 301500.00 and is rejected - a sequence no single multiplicative
          formula over notional gallons can produce.
