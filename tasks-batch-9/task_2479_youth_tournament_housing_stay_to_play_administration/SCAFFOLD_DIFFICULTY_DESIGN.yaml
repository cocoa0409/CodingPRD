  - rule_id: transitive_cascade
    instances:
      - name: cascade_confirm_depth_four_booking_to_housing_pressure
        grounds:
          - state_machines.Booking (ROOMING_LIST_SUBMITTED -> CONFIRMED)
          - state_machines.RoomBlock (OPEN -> RESTRICTED)
          - calculations.registration_compliance_status
          - calculations.block_utilization_posture
          - calculations.contract_block_posture
          - calculations.tournament_housing_pressure
        distinguishing_aspect: |
          Depth 4, triggered by POST /housing/bookings/{id}/confirm. Each link exists only
          because the previous link changed a value, not because one trigger fanned out:
          link 1 recomputes TeamRegistration.committed_rooms (0 -> 5, status PENDING_HOUSING ->
          HOUSING_COMPLIANT); link 2 recomputes the block counters from the same commit epoch,
          taking utilization_pct to 1.0 and firing OPEN -> RESTRICTED; link 3 reads the block's
          new RESTRICTED status and flips HotelContract.block_posture to SOLD_OUT; link 4 reads
          the contract's new posture and flips Tournament.housing_pressure NORMAL ->
          CONSTRAINED. Removing link 2 (for instance by counting DRAFT bookings at creation
          time) silently kills links 3 and 4.
        test_recipe:
          setup:
            - "Tournament posture OPEN, housing_pressure NORMAL, sold_out_contract_count 0."
            - "Exactly one EXECUTED HotelContract with exactly one RoomBlock of 5 rooms, so the contract's whole live-block set can go RESTRICTED at once."
            - "One registration with 13 players and 3 staff: required_rooms_registered 6, minimum_rooms_for_compliance 4, effective_required_rooms 4."
            - "A ROOMING_LIST_SUBMITTED booking for all 5 rooms across all 3 nights, which has NOT yet moved the block counters."
