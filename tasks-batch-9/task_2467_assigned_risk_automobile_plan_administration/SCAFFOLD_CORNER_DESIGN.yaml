      - name: a_licensing_amendment_replaces_the_filed_set_wholesale
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /plan/carriers/{id}/licensing-amendment].side_effects
          - errors[ERR_CARRIER_NOT_ACTIVE]
          - calculations.carrier_performance_and_posture
          - entities.Carrier.fields.licensed_territories
        distinguishing_aspect: |
          The amendment is a replacement, not a merge: filing ["T03"] over ["T02","T05"] must leave the
          carrier writable in T03 alone. It bumps the version and re-derives posture, yet it must not
          touch quota_target_units - the ACTIVE carrier set and the bps denominator did not move - and
          it must not touch the book already placed. A withdrawing carrier may not amend at all.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Atlas Mutual is licensed in T02 and T05; Beacon Casualty in T02. Both are ACTIVE with posture OPEN and version 1."
            - "Period 2026-P3 is OPEN with no certified applications, so both carriers hold quota_target_units 0."
          setup_api_calls:
            - call: "POST /plan/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /plan/carriers"
              payload: { name: "Atlas Mutual", naic_code: "11111", voluntary_market_share_bps: 6000, licensed_territories: ["T02", "T05"] }
              as: PlanAdministrator
              captures: { c1_id: $.data.id }
            - call: "POST /plan/carriers"
              payload: { name: "Beacon Casualty", naic_code: "22222", voluntary_market_share_bps: 4000, licensed_territories: ["T02"] }
              as: PlanAdministrator
              captures: { c2_id: $.data.id }
            - call: "POST /plan/producers"
              payload: { name: "Harbor Agency", license_number: "PL-4471", appointed_territories: ["T01", "T02", "T03"] }
              as: PlanAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /plan/plan-periods"
              payload: { period_code: "2026-P3", window_start: "2026-09-01T00:00:00Z", window_end: "2026-11-30T00:00:00Z", underserved_territories: ["T03"] }
              as: PlanAdministrator
              captures: { pp_id: $.data.id }
          trigger:
            - call: "POST /plan/carriers/${c1_id}/licensing-amendment"
              payload: { licensed_territories: ["T03"] }
              as: PlanAdministrator
            - call: "GET /plan/carriers/${c1_id}"
              as: PlanAdministrator
            - call: "POST /plan/carriers/${c2_id}/exit-notice"
              payload: { exit_effective_date: "2026-12-14T00:00:00Z" }
