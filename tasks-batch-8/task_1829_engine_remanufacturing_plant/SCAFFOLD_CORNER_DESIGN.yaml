            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /build-specs/${s1}/retire"
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_STATE"
            - "BuildSpec.${s1}.status == ACTIVE"

      - name: double_seal_rejected_idempotency
        claim_type: idempotency
        grounds: [state_machines.RemanEngine.DYNO_PASSED_to_SEALED, "errors[ERR_DYNO_NOT_PASSED]"]
        distinguishing_aspect: "Sealing is a one-shot transition: a second seal on an already SEALED engine is rejected (via the ERR_DYNO_NOT_PASSED state gate) and sealed_at/sealed_by are unchanged."
        test_recipe:
