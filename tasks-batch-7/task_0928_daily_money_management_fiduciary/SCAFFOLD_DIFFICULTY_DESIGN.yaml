              captures: { acct_id: $.data.id }
            - call: "POST /dmm/payees"
              payload: { client_id: "${cl_id}", payee_name: "City Power", payee_type: "RECURRING_BILLER", remittance_reference: "ACC-77" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { payee_id: $.data.id }
            - call: "POST /dmm/budget-categories"
              payload: { client_id: "${cl_id}", category_name: "UTILITIES", budget_month: "2026-06", allocation_cents: 300000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cat_id: $.data.id }
            - call: "GET /dmm/accounts/${acct_id}"
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_v: $.data.version }
            - call: "POST /dmm/payments"
              payload: { account_id: "${acct_id}", payee_id: "${payee_id}", authorization_id: "${auth_id}", budget_category_id: "${cat_id}", amount_cents: 80000, channel: "ACH", expected_account_version: "${acct_v}" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { pay_id: $.data.id }
            - call: "POST /dmm/payments/${pay_id}/release"
              payload: {}
              as: BillPaySpecialist
              as_user_id: "u-spec"
            - call: "POST /dmm/payments/${pay_id}/settlement-event"
              payload: { event: "SETTLE" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
            - call: "POST /dmm/disputes"
              payload: { payment_id: "${pay_id}", reason_code: "UNAUTHORIZED", disputed_amount_cents: 50000 }
              as: ComplianceOfficer
              as_user_id: "u-comp"
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /dmm/disputes/${disp_id}/provisional-credit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp"
            - call: "POST /dmm/disputes/${disp_id}/resolve"
              payload: { outcome: "DENIED", resolution_note: "Carrier evidence shows the client authorised the debit." }
              as: ComplianceOfficer
              as_user_id: "u-comp"
          assert:
            - "immediately after the provisional credit, ClientAccount.${acct_id}.cleared_balance_cents == 4969500"
            - "after the denial, ClientAccount.${acct_id}.cleared_balance_cents == 4919500"
            - "after the denial, ClientAccount.${acct_id}.available_balance_cents == 4919500"
            - "Dispute.${disp_id}.status == DENIED"
            - "Dispute.${disp_id}.provisional_credit_cents == 50000"
            - "exactly 4 LedgerEntry rows exist for account ${acct_id} with entry_types DISBURSEMENT, SERVICE_FEE, DISPUTE_PROVISIONAL_CREDIT and DISPUTE_CREDIT_REVERSAL"
            - "the signed sum of those 4 LedgerEntry.amount_cents == -80500"

      - name: schedule_then_cancel_conserves_organization_wide_bond_exposure
        grounds:
          - calculations.bond_exposure
          - state_machines.Payment.settlement_status.SCHEDULED_to_CANCELLED
          - entities.SuretyBond.fields.exposure_committed_cents
          - entities.SuretyBond.fields.headroom_committed_cents
        distinguishing_aspect: |
          Conserved quantity 3 - SuretyBond.exposure_committed_cents, an
          ORGANIZATION-WIDE aggregate rather than an account-scoped balance or
          a ledger sum. A second payment stays scheduled throughout, so the
          quantity is non-zero on both sides of the round trip and the test
          proves the cancellation released exactly its own 80000 cents and no
          more.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T09:00:00Z, one IN_FORCE bond with 100000000 cents of coverage"
            - "one ACTIVE client, one ACTIVE FULL_AGENCY authorization, one account with 5000000 cents"
            - "two RECURRING_BILLER payees and a UTILITIES budget line for 2026-06 allocated 300000 cents"
            - "one SCHEDULED ACH payment of 50000 cents to payee two that is never touched"
            - "one SCHEDULED ACH payment of 80000 cents to payee one"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/surety-bonds"
              payload: { carrier_name: "Atlas Surety", bond_number: "SB-2026-001", coverage_cents: 100000000, effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { bond_id: $.data.id }
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-9027" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
            - call: "POST /dmm/clients/${cl_id}/capacity-determination"
              payload: { determination: "RETAINS_CAPACITY", determined_on: "2026-05-15" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/clients/${cl_id}/status-change"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/authorizations"
              payload: { client_id: "${cl_id}", scope_tier: "FULL_AGENCY", instrument_reference: "AGR-2026-32", effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { auth_id: $.data.id }
            - call: "POST /dmm/authorizations/${auth_id}/status"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/accounts"
              payload: { client_id: "${cl_id}", institution_name: "First Community Bank", account_label: "Operating", account_type: "CHECKING", opening_balance_cents: 5000000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_id: $.data.id }
            - call: "POST /dmm/payees"
              payload: { client_id: "${cl_id}", payee_name: "City Power", payee_type: "RECURRING_BILLER", remittance_reference: "ACC-77" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { payee_1: $.data.id }
            - call: "POST /dmm/payees"
              payload: { client_id: "${cl_id}", payee_name: "Northside Gas", payee_type: "RECURRING_BILLER", remittance_reference: "NG-31" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { payee_2: $.data.id }
            - call: "POST /dmm/budget-categories"
              payload: { client_id: "${cl_id}", category_name: "UTILITIES", budget_month: "2026-06", allocation_cents: 300000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cat_id: $.data.id }
            - call: "GET /dmm/accounts/${acct_id}"
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_v1: $.data.version }
            - call: "POST /dmm/payments"
              payload: { account_id: "${acct_id}", payee_id: "${payee_2}", authorization_id: "${auth_id}", budget_category_id: "${cat_id}", amount_cents: 50000, channel: "ACH", expected_account_version: "${acct_v1}" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { pay_keep: $.data.id }
            - call: "GET /dmm/accounts/${acct_id}"
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_v2: $.data.version }
            - call: "POST /dmm/payments"
              payload: { account_id: "${acct_id}", payee_id: "${payee_1}", authorization_id: "${auth_id}", budget_category_id: "${cat_id}", amount_cents: 80000, channel: "ACH", expected_account_version: "${acct_v2}" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { pay_cancel: $.data.id }
          trigger:
            - call: "POST /dmm/payments/${pay_cancel}/cancel"
              payload: { reason: "Duplicate of a payment the family already made." }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "GET /dmm/surety-bonds/${bond_id}"
              as: ComplianceOfficer
              as_user_id: "u-comp"
          assert:
            - "immediately after both payments were scheduled, SuretyBond.${bond_id}.exposure_committed_cents == 130000"
            - "after the cancellation, SuretyBond.${bond_id}.exposure_committed_cents == 50000"
            - "after the cancellation, SuretyBond.${bond_id}.headroom_committed_cents == 99950000"
            - "Payment.${pay_keep}.settlement_status == SCHEDULED"
            - "Payment.${pay_cancel}.settlement_status == CANCELLED"
            - "ClientAccount.${acct_id}.committed_disbursements_cents == 50500"
            - "BudgetCategory.${cat_id}.committed_cents == 50000"
