scaffold_corner_design:
  # ============================ Entities ============================
  - section: entities
    instances:
      - name: create_property_returns_201_with_zeroed_computed_fields
        claim_type: Creation
        grounds:
          - entities.Property
          - endpoints
        distinguishing_aspect: "POST /properties with all required fields returns 201, a server-minted id, zone_count == 0 and total_treatable_sqft == 0."
        test_recipe:
          setup:
            - "One AccountHolder exists."
          setup_api_calls:
            - call: "POST /account-holders"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "1 Way", lot_size_sqft: 6000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
          assert:
            - "Response code is 201"
            - "Property ${prop_id}.zone_count == 0"
            - "Property ${prop_id}.total_treatable_sqft == 0"
            - "Property ${prop_id}.version == 1"

      - name: get_property_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Property
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /properties/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /properties/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Response error_id == ERR_NOT_FOUND (404)"

      - name: create_subscription_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Subscription.fields.billing_mode
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /subscriptions omitting billing_mode returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "An AccountHolder, a ServicePlan, and a Property with one ACTIVE zone exist."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", visit_interval_days: 21, per_visit_price_cents: 5000, seasonal_price_cents: 30000, includes_tick_barrier: false, retreat_guarantee_days: 7 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /account-holders"
              payload: { email: "c2@x.com", full_name: "C Two" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "2 Way", lot_size_sqft: 6000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", season_start_date: "2026-05-01", season_end_date: "2026-08-31" }
              as: AccountHolder
              as_user_id: "${ah_id}"
          assert:
            - "Response error_id == ERR_INVALID_REQUEST (422)"

      - name: create_zone_invalid_enum_zone_type_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.TreatmentZone.fields.zone_type
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /properties/{id}/zones with zone_type not in {TURF, PERIMETER, WATER_FEATURE, WOODLINE} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "An AccountHolder and Property exist."
          setup_api_calls:
            - call: "POST /account-holders"
              payload: { email: "c3@x.com", full_name: "C Three" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "3 Way", lot_size_sqft: 6000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Bad", zone_type: "DRIVEWAY", area_sqft: 1000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
          assert:
            - "Response error_id == ERR_INVALID_REQUEST (422)"

      - name: zone_count_and_total_treatable_sqft_recompute_on_zone_add
        claim_type: Computed Fields
        grounds:
          - entities.Property.fields.zone_count
          - entities.Property.fields.total_treatable_sqft
          - endpoints
        distinguishing_aspect: "After adding TURF 4000 and PERIMETER 2000, Property.zone_count == 2 and total_treatable_sqft == 6000 (derived-field reconciliation, input ignored)."
        test_recipe:
          setup:
            - "An AccountHolder and Property exist."
          setup_api_calls:
            - call: "POST /account-holders"
              payload: { email: "c4@x.com", full_name: "C Four" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "4 Way", lot_size_sqft: 6000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Turf", zone_type: "TURF", area_sqft: 4000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
          trigger:
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Perim", zone_type: "PERIMETER", area_sqft: 2000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
          assert:
            - "Property ${prop_id}.zone_count == 2"
            - "Property ${prop_id}.total_treatable_sqft == 6000"

      - name: excluded_zone_drops_out_of_total_treatable_sqft
        claim_type: Computed Fields
        grounds:
          - entities.TreatmentZone.fields.status
          - entities.Property.fields.total_treatable_sqft
          - endpoints
        distinguishing_aspect: "Excluding the PERIMETER 2000 zone drops total_treatable_sqft from 6000 to 4000 while zone_count stays 2 (EXCLUDED zone still counted but not summed)."
        test_recipe:
          setup:
            - "A Property with ACTIVE zones TURF 4000 and PERIMETER 2000."
          setup_api_calls:
            - call: "POST /account-holders"
              payload: { email: "c5@x.com", full_name: "C Five" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "5 Way", lot_size_sqft: 6000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Turf", zone_type: "TURF", area_sqft: 4000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Perim", zone_type: "PERIMETER", area_sqft: 2000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { z_perim_id: $.data.id }
          trigger:
            - call: "POST /zones/${z_perim_id}/exclude"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
          assert:
            - "TreatmentZone ${z_perim_id}.status == EXCLUDED"
            - "Property ${prop_id}.zone_count == 2"
            - "Property ${prop_id}.total_treatable_sqft == 4000"

      - name: application_log_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.ApplicationLog
        distinguishing_aspect: "ApplicationLog has common_fields: false — it carries only id and created_at, no version, and exposes no update/delete endpoint (append-only log)."
        test_recipe:
          setup:
            - "A DISPATCHED visit with one ApplicationLog recorded."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", visit_interval_days: 21, per_visit_price_cents: 5000, seasonal_price_cents: 30000, includes_tick_barrier: false, retreat_guarantee_days: 7 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /account-holders"
              payload: { email: "c6@x.com", full_name: "C Six" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /crews"
              payload: { tech_name: "CT1", home_region_code: "NE01", daily_capacity: 4 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "6 Way", lot_size_sqft: 6000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Yard", zone_type: "TURF", area_sqft: 4000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { z_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", billing_mode: "PER_VISIT", season_start_date: "2026-05-01", season_end_date: "2026-08-31", auto_renew: false }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "GET /subscriptions/${sub_id}/visits"
              payload: {}
              as: Dispatcher
              captures: { v1_id: "$.data[0].id"}
            - call: "POST /crew-routes"
              payload: { crew_id: "${crew_id}", region_code: "NE01", route_date: "2026-05-01" }
              as: Dispatcher
              captures: { r_id: $.data.id, r_ver: $.data.version }
            - call: "POST /crew-routes/${r_id}/dispatch-visit"
              payload: { visit_id: "${v1_id}", expected_crewroute_version: "${r_ver}" }
              as: Dispatcher
          trigger:
            - call: "POST /visits/${v1_id}/application-logs"
              payload: { treatment_zone_id: "${z_id}", product_code: "BIFEN_IT", gallons_applied: 2.0, logged_by_tech_id: "${crew_id}" }
              as: CrewTech
              as_user_id: "${crew_id}"
              captures: { log_id: $.data.id }
            - call: "GET /visits/${v1_id}/application-logs"
              payload: {}
              as: CrewTech
              as_user_id: "${crew_id}"
          assert:
            - "ApplicationLog response contains id and created_at and no version field"
            - "GET /visits/${v1_id}/application-logs total_count == 1"

  # ========================= State Machines =========================
  - section: state_machines
    instances:
      - name: subscription_new_starts_in_draft
        claim_type: Initial State
        grounds:
          - state_machines.Subscription
          - entities.Subscription.fields.status
        distinguishing_aspect: "A newly created Subscription has status == DRAFT before activation."
        test_recipe:
          setup:
            - "An AccountHolder, ServicePlan and Property with one zone exist."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", visit_interval_days: 21, per_visit_price_cents: 5000, seasonal_price_cents: 30000, includes_tick_barrier: false, retreat_guarantee_days: 7 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /account-holders"
              payload: { email: "c7@x.com", full_name: "C Seven" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "7 Way", lot_size_sqft: 6000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Yard", zone_type: "TURF", area_sqft: 4000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
          trigger:
            - call: "POST /subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", billing_mode: "PER_VISIT", season_start_date: "2026-05-01", season_end_date: "2026-08-31", auto_renew: false }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { sub_id: $.data.id }
          assert:
            - "Subscription ${sub_id}.status == DRAFT"

      - name: activate_already_active_subscription_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Subscription.DRAFT_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activating an already ACTIVE subscription a second time returns ERR_INVALID_STATE (409); no second schedule is generated."
        test_recipe:
          setup:
            - "An ACTIVE PER_VISIT subscription (season 2026-05-01..2026-08-31)."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", visit_interval_days: 21, per_visit_price_cents: 5000, seasonal_price_cents: 30000, includes_tick_barrier: false, retreat_guarantee_days: 7 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /account-holders"
              payload: { email: "c8@x.com", full_name: "C Eight" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "8 Way", lot_size_sqft: 6000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Yard", zone_type: "TURF", area_sqft: 4000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "POST /subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", billing_mode: "PER_VISIT", season_start_date: "2026-05-01", season_end_date: "2026-08-31", auto_renew: false }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
          assert:
            - "Response error_id == ERR_INVALID_STATE (409)"

      - name: cancel_terminal_cancelled_subscription_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Subscription.DRAFT_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "From the terminal CANCELLED state, a second cancel returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A DRAFT subscription that has been cancelled."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", visit_interval_days: 21, per_visit_price_cents: 5000, seasonal_price_cents: 30000, includes_tick_barrier: false, retreat_guarantee_days: 7 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /account-holders"
              payload: { email: "c9@x.com", full_name: "C Nine" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "9 Way", lot_size_sqft: 6000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Yard", zone_type: "TURF", area_sqft: 4000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "POST /subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", billing_mode: "PER_VISIT", season_start_date: "2026-05-01", season_end_date: "2026-08-31", auto_renew: false }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
          assert:
            - "Response error_id == ERR_INVALID_STATE (409)"

      - name: complete_recurring_visit_bubbles_visits_completed_count
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Visit.DISPATCHED_to_COMPLETED
          - entities.Subscription.fields.visits_completed_count
        distinguishing_aspect: "Completing a RECURRING visit bumps the owning Subscription.visits_completed_count from 0 to 1 (bubble-up derived recompute)."
        test_recipe:
          setup:
            - "An ACTIVE PER_VISIT subscription with first visit DISPATCHED and one application log recorded."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", visit_interval_days: 21, per_visit_price_cents: 5000, seasonal_price_cents: 30000, includes_tick_barrier: false, retreat_guarantee_days: 7 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /account-holders"
              payload: { email: "c10@x.com", full_name: "C Ten" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /crews"
              payload: { tech_name: "CT2", home_region_code: "NE01", daily_capacity: 4 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "10 Way", lot_size_sqft: 6000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Yard", zone_type: "TURF", area_sqft: 4000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { z_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", billing_mode: "PER_VISIT", season_start_date: "2026-05-01", season_end_date: "2026-08-31", auto_renew: false }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/visits"
              payload: {}
              as: Dispatcher
              captures: { v1_id: "$.data[0].id"}
            - call: "POST /crew-routes"
              payload: { crew_id: "${crew_id}", region_code: "NE01", route_date: "2026-05-01" }
              as: Dispatcher
              captures: { r_id: $.data.id, r_ver: $.data.version }
            - call: "POST /crew-routes/${r_id}/dispatch-visit"
              payload: { visit_id: "${v1_id}", expected_crewroute_version: "${r_ver}" }
              as: Dispatcher
            - call: "POST /visits/${v1_id}/application-logs"
              payload: { treatment_zone_id: "${z_id}", product_code: "BIFEN_IT", gallons_applied: 2.0, logged_by_tech_id: "${crew_id}" }
              as: CrewTech
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /visits/${v1_id}/complete"
              payload: {}
              as: CrewTech
              as_user_id: "${crew_id}"
            - call: "GET /subscriptions/${sub_id}"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
          assert:
            - "Visit ${v1_id}.status == COMPLETED and completed_at_date == 2026-05-01"
            - "Subscription ${sub_id}.visits_completed_count == 1"

      - name: close_retreat_completes_guarantee_loop
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Visit.RETREAT_SCHEDULED_to_COMPLETED
          - state_machines.Visit.COMPLETED_to_RETREAT_REQUESTED
          - entities.Visit.fields.parent_visit_id
        distinguishing_aspect: "The full re-treat guarantee loop COMPLETED->RETREAT_REQUESTED->RETREAT_SCHEDULED, then completing the child RETREAT visit and closing it, returns the parent to COMPLETED; the child RETREAT visit's parent_visit_id == the parent visit id."
        test_recipe:
          setup:
            - "A RECURRING visit COMPLETED at 2026-05-01 within guarantee window; retreat requested and scheduled; child RETREAT visit dispatched, logged, completed."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "BASIC", visit_interval_days: 21, per_visit_price_cents: 5000, seasonal_price_cents: 30000, includes_tick_barrier: false, retreat_guarantee_days: 7 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /account-holders"
              payload: { email: "c11@x.com", full_name: "C Eleven" }
              as: PlatformAdmin
              captures: { ah_id: $.data.id }
            - call: "POST /crews"
              payload: { tech_name: "CT3", home_region_code: "NE01", daily_capacity: 4 }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /properties"
              payload: { account_holder_id: "${ah_id}", street_address: "11 Way", lot_size_sqft: 6000, service_region_code: "NE01" }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/zones"
              payload: { label: "Yard", zone_type: "TURF", area_sqft: 4000 }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { z_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", billing_mode: "PER_VISIT", season_start_date: "2026-05-01", season_end_date: "2026-08-31", auto_renew: false }
              as: AccountHolder
              as_user_id: "${ah_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${ah_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/visits"
              payload: {}
              as: Dispatcher
              captures: { v1_id: "$.data[0].id"}
            - call: "POST /crew-routes"
              payload: { crew_id: "${crew_id}", region_code: "NE01", route_date: "2026-05-01" }
              as: Dispatcher
              captures: { r1_id: $.data.id, r1_ver: $.data.version }
            - call: "POST /crew-routes/${r1_id}/dispatch-visit"
              payload: { visit_id: "${v1_id}", expected_crewroute_version: "${r1_ver}" }
