      - name: application_patch_bumps_version_and_refuses_unknown_field
        claim_type: Standard CRUD
        grounds:
          - endpoints.PATCH_/op/event-applications/{id}
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "The patch endpoint mutates only expected_headcount and scheduled_date, advancing EventApplication.version, and rejects an undeclared field such as tier at request-shape priority."
        test_recipe:
          setup:
