              as: HRAdmin
            - call: "GET /engagement/survey-cycles/${rcyc_id}"
              payload: {}
              as: HRAdmin
              captures: { rcyc_v: $.data.version }
            - call: "POST /engagement/survey-cycles/${rcyc_id}/configure"
              payload: { expected_cycle_version: "${rcyc_v}" }
              as: HRAdmin
            - call: "POST /engagement/survey-cycles/${rcyc_id}/open"
