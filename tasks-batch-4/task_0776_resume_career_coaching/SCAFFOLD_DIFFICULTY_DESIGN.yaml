      - name: client_halfopen_overlap
        grounds:
          - validations[priority=9]
          - entities.CoachingSession.fields.client_id
          - errors[ERR_CLIENT_SLOT_CONFLICT]
        distinguishing_aspect: |
          Client resource uses half-open [start,end) semantics: a strictly overlapping session
          on a DIFFERENT coach (10:30 inside 10:00-11:00) is rejected with ERR_CLIENT_SLOT_CONFLICT,
          but a back-to-back session touching at 11:00 is accepted — distinct interval semantics
          from the coach buffer rule, on a different resource.
        test_recipe:
          setup:
            - "Plan with 3 included sessions; confirmed order; two coaches (coach1, coach2). One session booked on coach1 10:00-11:00 for the client."
          setup_api_calls:
