            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-4", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 3, thickness_range_max_mm: 25, test_report_id: "TR-4" }
              as: QCManager
              captures: { pqr_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
