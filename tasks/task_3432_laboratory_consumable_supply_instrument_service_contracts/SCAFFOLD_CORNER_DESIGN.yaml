              captures: { sr: $.data.id }
          trigger:
            - call: "POST /lab/service-requests/${sr}/dispatch"
              payload: {}
              as: ServiceDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "dispatch fails with error_id == ERR_NO_ELIGIBLE_ENGINEER (HTTP 422)"
            - "ServiceRequest.${sr} remains OPEN"

      - name: loaner_empty_pool_rejected
        claim_type: selector_policy
        grounds: ["state_machines.LoanerUnit.AVAILABLE_to_RESERVED", "errors[ERR_NO_LOANER_AVAILABLE]"]
        distinguishing_aspect: "Loaner empty-pool fallback: eligibility gates pass (GOLD contract, HIGH BREAK_FIX) but no AVAILABLE unit matches the instrument model, so reserve fails 422 ERR_NO_LOANER_AVAILABLE — distinct from the eligibility failure."
        test_recipe:
          setup: ["GOLD-contracted installed instrument (model SEQ-5000); HIGH BREAK_FIX request; the only loaner unit is a different model (GC-200)."]
          setup_api_calls:
            - call: "POST /lab/accounts"
