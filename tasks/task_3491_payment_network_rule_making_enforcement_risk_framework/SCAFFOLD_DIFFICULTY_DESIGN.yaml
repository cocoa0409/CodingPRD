        distinguishing_aspect: "Depth-3 cascade triggered by the UPHELD transition: action -> Participant SUSPENDED -> its APPROVED Originator SUSPENDED -> that originator's ORIGINATED entry CANCELLED with exposure release; each link is caused by the previous link, not by the admin's call."
