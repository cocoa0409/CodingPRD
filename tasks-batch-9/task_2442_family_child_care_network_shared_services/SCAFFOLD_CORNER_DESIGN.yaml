            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
