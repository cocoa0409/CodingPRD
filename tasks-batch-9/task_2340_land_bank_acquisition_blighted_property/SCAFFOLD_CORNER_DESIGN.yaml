# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Domain: county-land-bank-authority   (scenario 2340)
# Taxonomy: references/claim-extraction-guide.md - the nine sections below are
# its nine tables; every claim_type is a row from the matching table.
# The logical clock starts at its mandatory default 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: property_create_returns_prospect_registry_row
        claim_type: creation
        grounds:
          - entities.Property
          - endpoints["POST /land-bank/properties"]
        distinguishing_aspect: "A registry parcel is created with all eight input fields and comes back 201 with custody_status PROSPECT, title_status CLOUDED, secured false, intake_blight_score null and current_blight_score 0 - the registry entry precedes any acquisition."
        test_recipe:
          setup:
            - "Empty database at the default clock; no funding source is needed because registration commits nothing."
          setup_api_calls: []
          trigger:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-200001", address: "1 Alder St", situs_ward: 3, lot_area_sqft: 6400, assessed_value_cents: 420000, structure_present: true, structure_condition_grade: "D", vacancy_months: 14 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id, custody: $.data.custody_status, title: $.data.title_status, ver: $.data.version }
          assert:
            - "HTTP 201 and ${custody} == PROSPECT and ${title} == CLOUDED"
            - "Property.${p_id}.parcel_id == 'APN-200001' and Property.${p_id}.lot_area_sqft == 6400 and Property.${p_id}.structure_condition_grade == D"
            - "Property.${p_id}.secured == false and Property.${p_id}.intake_blight_score == null and Property.${p_id}.current_blight_score == 0"
            - "Property.${p_id}.acquired_at == null and Property.${p_id}.acquisition_channel == null and Property.${p_id}.acquisition_cost_cents == 0"
            - "Property.${p_id}.nuisance_complaint_count == 0 and Property.${p_id}.open_code_violation_count == 0 and Property.${p_id}.delinquent_tax_balance_cents == 0"
            - "${ver} == 1"

      - name: property_get_returns_stored_registry_fields
        claim_type: retrieval
        grounds:
          - endpoints["GET /land-bank/properties/{id}"]
        distinguishing_aspect: "A follow-up GET returns the same stored values the create response reported, including the code-enforcement snapshot posted afterwards - the read path is not a second computation."
        test_recipe:
          setup:
            - "One PROSPECT parcel with a code-enforcement snapshot of 3 complaints and 1 open violation."
          setup_api_calls:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-200002", address: "2 Alder St", situs_ward: 3, lot_area_sqft: 6400, assessed_value_cents: 420000, structure_present: true, structure_condition_grade: "D", vacancy_months: 14 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/properties/${p_id}/code-violation-report"
              payload: { open_code_violation_count: 1, nuisance_complaint_count: 3 }
              as: IntakeOfficer
              as_user_id: "intake-1"
          trigger:
            - call: "GET /land-bank/properties/${p_id}"
              payload: {}
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { addr: $.data.address, viol: $.data.open_code_violation_count, comp: $.data.nuisance_complaint_count, score: $.data.current_blight_score }
          assert:
            - "HTTP 200 and ${addr} == '2 Alder St' and ${viol} == 1 and ${comp} == 3"
            - "${score} == 37.5  # 30 grade D + min(60,14)*0.25 = 3.5 + min(12, 1.5*3) = 4.5 + min(15, 3*1) = 3, hold 0"
            - "Property.${p_id}.situs_ward == 3 and Property.${p_id}.assessed_value_cents == 420000"

      - name: property_list_filters_by_ward_and_paginates
        claim_type: listing
        grounds:
          - endpoints["GET /land-bank/properties"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Filter, limit and offset compose: three ward-3 PROSPECT parcels and one ward-4 parcel exist, and a ward-3 query with limit 2 returns exactly 2 rows with total_count 3 and has_more true."
        test_recipe:
          setup:
            - "Three PROSPECT parcels in situs_ward 3 and one in situs_ward 4, created in a known order."
          setup_api_calls:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-200010", address: "10 Birch St", situs_ward: 3, lot_area_sqft: 5000, assessed_value_cents: 100000, structure_present: false, structure_condition_grade: "C", vacancy_months: 1 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p1_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-200011", address: "11 Birch St", situs_ward: 3, lot_area_sqft: 5000, assessed_value_cents: 100000, structure_present: false, structure_condition_grade: "C", vacancy_months: 1 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p2_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-200012", address: "12 Birch St", situs_ward: 3, lot_area_sqft: 5000, assessed_value_cents: 100000, structure_present: false, structure_condition_grade: "C", vacancy_months: 1 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p3_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-200013", address: "13 Cedar St", situs_ward: 4, lot_area_sqft: 5000, assessed_value_cents: 100000, structure_present: false, structure_condition_grade: "C", vacancy_months: 1 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p4_id: $.data.id }
          trigger:
            - call: "GET /land-bank/properties"
              payload: { custody_status: "PROSPECT", situs_ward: 3, limit: 2, offset: 0 }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { first_parcel: "$.data[0].parcel_id", total: $.meta.total_count, more: $.meta.has_more }
          assert:
            - "HTTP 200 and exactly 2 rows are returned"
            - "${total} == 3 and ${more} == true  # the ward-4 parcel is filtered out"
            - "${first_parcel} == 'APN-200010'"
            - "the ward-4 parcel ${p4_id} does not appear in the returned rows"

      - name: property_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=40]
          - errors.ERR_PROPERTY_NOT_FOUND
        distinguishing_aspect: "A syntactically valid UUID that matches no Property row yields 404 ERR_PROPERTY_NOT_FOUND rather than an empty object or a 500."
        test_recipe:
          setup:
            - "Empty database; no parcel with the requested id has ever been created."
          setup_api_calls: []
          trigger:
            - call: "GET /land-bank/properties/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 and ${err_id} == ERR_PROPERTY_NOT_FOUND"

      - name: property_create_missing_lot_area_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=30]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "lot_area_sqft has source input and no default, so omitting it must fail at priority 30 with ERR_INVALID_REQUEST and persist nothing - it cannot silently default to 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-200020", address: "20 Dogwood St", situs_ward: 3, assessed_value_cents: 100000, structure_present: false, structure_condition_grade: "C", vacancy_months: 1 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 and ${err_id} == ERR_INVALID_REQUEST"
            - "no Property row with parcel_id 'APN-200020' exists afterwards"

      - name: contractor_create_defaults_debarred_to_false
        claim_type: defaults
        grounds:
          - entities.Contractor.fields.debarred
          - endpoints["POST /land-bank/contractors"]
        distinguishing_aspect: "debarred is the only optional input on contractor creation; omitting it must yield false (so the contractor is usable) rather than null or true."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /land-bank/contractors"
              payload: { name: "Default Debarment Test Co", license_expires_on: "2027-12-31T00:00:00Z", max_concurrent_crews: 2, specialties: ["MOW", "SECURE", "DEMOLITION"] }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { ctr_id: $.data.id, deb: $.data.debarred }
          assert:
            - "HTTP 201 and ${deb} == false"
            - "Contractor.${ctr_id}.max_concurrent_crews == 2 and Contractor.${ctr_id}.specialties == [MOW, SECURE, DEMOLITION]"

      - name: property_acquisition_fields_computed_at_packet_close
        claim_type: computed_fields
        grounds:
          - entities.Property.fields.acquisition_cost_cents
          - entities.Property.fields.acquisition_channel
          - entities.Property.fields.acquired_at
          - state_machines.Property.custody_status.PROSPECT_to_ACQUIRED
        distinguishing_aspect: "acquisition_cost_cents, acquisition_channel and acquired_at are computed fields on Property with no input path at all: they appear only after the packet closes and equal offer 20000 + fee 10000, the packet's channel, and the logical clock."
        test_recipe:
          setup:
            - "One ACTIVE ACQUISITION_ONLY funding source authorized 500000 cents."
            - "One PROSPECT parcel and a NEGOTIATED_PURCHASE packet offering 20000 cents with a 10000-cent title search fee, board-approved and closed by a second officer."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Acquisition Revolving Line", source_type: "GENERAL_FUND", authorized_cents: 500000, restriction: "ACQUISITION_ONLY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-200030", address: "30 Elder St", situs_ward: 3, lot_area_sqft: 5000, assessed_value_cents: 200000, structure_present: false, structure_condition_grade: "C", vacancy_months: 2 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p_id}", funding_source_id: "${fs_id}", channel: "NEGOTIATED_PURCHASE", offer_price_cents: 20000, title_search_fee_cents: 10000 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk_id}/board-approval"
              payload: { resolution_no: "R-2026-301" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { committed: $.data.committed_cents }
          trigger:
            - call: "POST /land-bank/acquisition-packets/${pk_id}/close"
              payload: { deed_reference: "BK-4500-PG-01" }
              as: IntakeOfficer
              as_user_id: "intake-2"
              captures: { pk_status: $.data.status, closer: $.data.closed_by_user_id }
          assert:
            - "${committed} == 30000 and ${pk_status} == CLOSED and ${closer} == 'intake-2'"
            - "Property.${p_id}.acquisition_cost_cents == 30000 and Property.${p_id}.acquisition_channel == NEGOTIATED_PURCHASE"
            - "Property.${p_id}.acquired_at == 2026-08-01T00:00:00Z and Property.${p_id}.custody_status == ACQUIRED"
            - "Property.${p_id}.intake_blight_score == 18.5  # 18 grade C + min(60,2)*0.25 = 0.5, stamped once at close"
            - "FundingSource.${fs_id}.committed_cents == 0 and FundingSource.${fs_id}.disbursed_cents == 30000 and FundingSource.${fs_id}.available_cents == 470000"

      - name: funding_source_create_mints_system_fields
        claim_type: system_fields
        grounds:
          - entities.FundingSource
          - endpoints["POST /land-bank/funding-sources"]
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted: the create response carries a bare UUID with no type prefix and version exactly 1, and the ledger fields are initialized by the server rather than supplied."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "System Field Grant", source_type: "GRANT", authorized_cents: 800000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id, ver: $.data.version, created: $.data.created_at, avail: $.data.available_cents }
          assert:
            - "HTTP 201 and ${ver} == 1"
            - "${fs_id} is a bare UUID string with no type prefix (no 'fs_' or 'src_' segment)"
            - "${created} is ISO 8601 UTC with three fractional digits"
            - "${avail} == 800000 and FundingSource.${fs_id}.committed_cents == 0 and FundingSource.${fs_id}.disbursed_cents == 0"
            - "FundingSource.${fs_id}.reserve_floor_cents == 40000 and FundingSource.${fs_id}.status == ACTIVE and FundingSource.${fs_id}.open_run_count == 0 and FundingSource.${fs_id}.recaptured_cents == 0"

      - name: funding_source_unknown_source_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.FundingSource.fields.source_type
          - validations[priority=30]
        distinguishing_aspect: "source_type is closed over {GRANT, TIF_RECAPTURE, GENERAL_FUND}; a plausible-sounding fourth value must be rejected at priority 30 instead of being stored verbatim."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Endowment Line", source_type: "ENDOWMENT", authorized_cents: 100000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 and ${err_id} == ERR_INVALID_REQUEST"
            - "no FundingSource row named 'Endowment Line' exists afterwards"

      - name: parcel_adjacency_is_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.ParcelAdjacency
          - endpoints["POST /land-bank/parcel-adjacencies"]
          - endpoints["GET /land-bank/properties/{id}/adjacencies"]
        distinguishing_aspect: "ParcelAdjacency declares common_fields false, so the created edge carries id and created_at but no version or updated_at field, and §1.5 exposes no PUT, PATCH or DELETE for it - a mis-recorded edge can only be superseded, never edited."
        test_recipe:
          setup:
            - "Two PROSPECT parcels that share a 40-foot boundary."
          setup_api_calls:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-200040", address: "40 Fir St", situs_ward: 3, lot_area_sqft: 5000, assessed_value_cents: 100000, structure_present: false, structure_condition_grade: "C", vacancy_months: 1 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_a_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-200041", address: "41 Fir St", situs_ward: 3, lot_area_sqft: 5000, assessed_value_cents: 100000, structure_present: false, structure_condition_grade: "C", vacancy_months: 1 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_b_id: $.data.id }
          trigger:
            - call: "POST /land-bank/parcel-adjacencies"
              payload: { property_id: "${p_a_id}", adjacent_property_id: "${p_b_id}", shared_boundary_feet: 40 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { edge_id: $.data.id, edge_created: $.data.created_at, recorder: $.data.recorded_by_user_id }
          assert:
            - "HTTP 201 and ${edge_id} is a bare UUID and ${edge_created} is present"
            - "the response carries no version field and no updated_at field (ParcelAdjacency.common_fields == false)"
            - "ParcelAdjacency.${edge_id}.shared_boundary_feet == 40 and ${recorder} == 'intake-1'"
            - "§1.5 declares no PUT, PATCH or DELETE route whose path contains parcel-adjacencies"

      - name: title_action_under_unknown_parcel_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.TitleAction.fields.property_id
          - validations[priority=40]
          - errors.ERR_PROPERTY_NOT_FOUND
        distinguishing_aspect: "TitleAction declares parent Property and is only reachable through the nested route, so an unknown parent id must produce 404 ERR_PROPERTY_NOT_FOUND before any state or uniqueness rule is considered."
        test_recipe:
          setup:
            - "Empty database; the parent parcel id in the path was never created."
          setup_api_calls: []
          trigger:
            - call: "POST /land-bank/properties/00000000-0000-4000-8000-000000000002/title-actions"
              payload: { action_type: "QUIET_TITLE_SUIT" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 and ${err_id} == ERR_PROPERTY_NOT_FOUND"
            - "no TitleAction row exists afterwards"

      - name: parcel_adjacency_edge_readable_from_both_endpoints
        claim_type: parent_relationships
        grounds:
          - complexity_profile.entity_topology
          - entities.ParcelAdjacency
          - endpoints["GET /land-bank/properties/{id}/adjacencies"]
        distinguishing_aspect: "The graph topology is undirected: one POST creates a single edge row, and the sub-resource listing on the *adjacent* parcel returns that same row with property_id still pointing at the first parcel - the edge is not duplicated per direction."
        test_recipe:
          setup:
            - "Two PROSPECT parcels A and B joined by exactly one recorded edge A-B with a 40-foot shared boundary."
          setup_api_calls:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-200050", address: "50 Gorse St", situs_ward: 3, lot_area_sqft: 5000, assessed_value_cents: 100000, structure_present: false, structure_condition_grade: "C", vacancy_months: 1 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_a_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-200051", address: "51 Gorse St", situs_ward: 3, lot_area_sqft: 5000, assessed_value_cents: 100000, structure_present: false, structure_condition_grade: "C", vacancy_months: 1 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_b_id: $.data.id }
            - call: "POST /land-bank/parcel-adjacencies"
              payload: { property_id: "${p_a_id}", adjacent_property_id: "${p_b_id}", shared_boundary_feet: 40 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { edge_id: $.data.id }
          trigger:
            - call: "GET /land-bank/properties/${p_b_id}/adjacencies"
              payload: {}
              as: DispositionOfficer
              as_user_id: "disp-1"
              captures: { row_prop: "$.data[0].property_id", row_adj: "$.data[0].adjacent_property_id", row_feet: "$.data[0].shared_boundary_feet" }
          assert:
            - "HTTP 200 and exactly 1 row is returned for the adjacent parcel"
            - "${row_prop} == ${p_a_id} and ${row_adj} == ${p_b_id} and ${row_feet} == 40"
            - "GET /land-bank/properties/${p_a_id}/adjacencies also returns exactly 1 row, the same edge ${edge_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: acquisition_packet_starts_in_due_diligence
        claim_type: initial_state
        grounds:
          - state_machines.AcquisitionPacket.initial_state
          - endpoints["POST /land-bank/acquisition-packets"]
        distinguishing_aspect: "A freshly created packet is DUE_DILIGENCE with committed_cents 0, hold_reason null and resolution_no null - creation reserves nothing against the funding source, only board approval does."
        test_recipe:
          setup:
            - "One ACTIVE ANY funding source authorized 500000 cents and one PROSPECT parcel."
          setup_api_calls:
            - call: "POST /land-bank/funding-sources"
              payload: { name: "Initial State Line", source_type: "GENERAL_FUND", authorized_cents: 500000, restriction: "ANY", expires_on: "2029-12-31T00:00:00Z" }
              as: BoardClerk
              as_user_id: "clerk-1"
              captures: { fs_id: $.data.id }
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-201001", address: "1001 Hazel St", situs_ward: 3, lot_area_sqft: 6000, assessed_value_cents: 300000, structure_present: true, structure_condition_grade: "C", vacancy_months: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p_id}", funding_source_id: "${fs_id}", channel: "NEGOTIATED_PURCHASE", offer_price_cents: 40000, title_search_fee_cents: 5000 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk_id: $.data.id, pk_status: $.data.status, pk_committed: $.data.committed_cents, initiator: $.data.initiated_by_user_id }
          assert:
            - "HTTP 201 and ${pk_status} == DUE_DILIGENCE and ${pk_committed} == 0"
            - "${initiator} == 'intake-1' and AcquisitionPacket.${pk_id}.hold_reason == null and AcquisitionPacket.${pk_id}.resolution_no == null and AcquisitionPacket.${pk_id}.closed_by_user_id == null"
            - "FundingSource.${fs_id}.committed_cents == 0 and FundingSource.${fs_id}.available_cents == 500000  # creation commits nothing"
            - "Property.${p_id}.custody_status == PROSPECT  # unchanged by packet creation"

      - name: defect_remains_adjudication_reclouds_title_and_reopens_round_two
        claim_type: valid_transition
        grounds:
          - state_machines.Property.title_status.QUIET_TITLE_FILED_to_CLOUDED
          - state_machines.TitleAction.FILED_to_DEFECT_REMAINS
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "An unsuccessful adjudication drives the title dimension back to CLOUDED and the DEFECT_REMAINS action is terminal, so a new filing is allowed and it is round_no 2 - the loop counter is the count of prior actions, not a reuse of the old row."
        test_recipe:
          setup:
            - "One PROSPECT parcel with one FILED TitleAction (round_no 1)."
          setup_api_calls:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-201010", address: "1010 Ivy St", situs_ward: 3, lot_area_sqft: 6000, assessed_value_cents: 300000, structure_present: true, structure_condition_grade: "C", vacancy_months: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
            - call: "POST /land-bank/properties/${p_id}/title-actions"
              payload: { action_type: "QUIET_TITLE_SUIT" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { ta1_id: $.data.id, ta1_round: $.data.round_no, ta1_status: $.data.status }
          trigger:
            - call: "POST /land-bank/title-actions/${ta1_id}/adjudicate"
              payload: { outcome: "DEFECT_REMAINS", defect_count: 3 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { ta1_final: $.data.status, ta1_defects: $.data.defect_count, ta1_adj: $.data.adjudicated_at }
            - call: "POST /land-bank/properties/${p_id}/title-actions"
              payload: { action_type: "TAX_DEED_CONFIRMATION" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { ta2_id: $.data.id, ta2_round: $.data.round_no, ta2_status: $.data.status }
          assert:
