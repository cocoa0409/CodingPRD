          assert:
            - "the PATCH returns 200 with per_transaction_fee_cents 20 and ${mv2} == ${mv1} + 1"
            - "${e1} == ERR_STALE_MERCHANT_VERSION with HTTP 412"
            - "after the 412: Merchant.${m1}.owning_agent_id is still ${a1}, version is still ${mv2}, and GET /agents/${a1}/portfolio-summary still reports portfolio_merchant_count 1 / active_merchant_count 1"
            - "the retry with ${mv2} returns 200 with owning_agent_id ${a2} and ${mv3} == ${mv2} + 1"
            - "the cascade fires only on the success: GET /agents/${a2}/portfolio-summary reports portfolio_merchant_count 1 and portfolio_attrition_bps 0, and A1 drops to portfolio_merchant_count 0"

      - name: occ_statement_version_guards_adjustment_proposals
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[adjustment-create-stale-statement]
          - endpoints[POST /agent-statements/{id}/adjustments].side_effects
          - endpoints[POST /statement-adjustments/{id}/approve].side_effects
        distinguishing_aspect: "Adjustments coexist by design, so the second proposal is refused only by the version guard — and the version moves for two different reasons: a mere PROPOSED sibling bumps it without moving any money, and an approval bumps it again while recomputing net_payable_cents. A client holding the version it read before either event is stale."
