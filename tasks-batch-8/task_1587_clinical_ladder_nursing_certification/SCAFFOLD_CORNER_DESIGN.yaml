        test_recipe:
          setup: ["Nurse RA1 with one PENDING event and an OPEN review"]
          setup_api_calls:
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-RA1", full_name: "Ra One", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
