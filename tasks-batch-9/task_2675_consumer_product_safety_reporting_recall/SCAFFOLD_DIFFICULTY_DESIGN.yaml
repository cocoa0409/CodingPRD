  - rule_id: boundary_precision_check
    instances:

      - name: section_report_submitted_at_exactly_report_due_at_is_not_late
        grounds:
          - calculations.section_report_lateness
          - entities.SectionReport.fields.days_late
          - entities.SectionReport.fields.late_surcharge_cents
          - endpoints["POST /product-safety/section-reports/{id}/submit"]
        distinguishing_aspect: |
          Metric: the LATENESS boundary in cents/days on the /section-reports/{id}/submit
          endpoint. submitted_at is set to exactly report_due_at 2026-03-11T00:00:00Z,
          the single instant at which late_seconds is 0. Because days_late is
          ceil(late_seconds / 86400), any implementation that uses a strict-versus-
          non-strict comparison the wrong way round, or that ceils a zero to one,
          bills 250000 cents for an on-time filing.
        test_recipe:
          setup:
            - "a REPORTABLE ReportabilityEvaluation whose report_due_at is 2026-03-11T00:00:00Z (determined_at 2026-03-01T00:00:00Z + REPORT_WINDOW_HOURS 240)"
            - "a DRAFT SectionReport on that evaluation"
            - "logical clock set to exactly 2026-03-11T00:00:00Z"
