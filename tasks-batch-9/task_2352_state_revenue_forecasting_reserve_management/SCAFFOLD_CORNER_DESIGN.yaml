      - name: actual_collection_without_a_certified_forecast_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority 44 ERR_NO_CERTIFIED_FORECAST]
          - calculations.forecast_error_metrics
        distinguishing_aspect: |
          Error scoring has no baseline to score against when no cycle of that fiscal year reached
          CERTIFIED or SUPERSEDED: an FY2026 actual at the default clock clears the fiscal-year-close
          gate (2026-08-01 > 2026-06-30) and then fails the referential rule with
          ERR_NO_CERTIFIED_FORECAST 422 — the FY2027 cycle that exists is the wrong year and is only
          DRAFT.
        test_recipe:
          setup:
            - "One ACTIVE PIT source and one DRAFT FY2027 cycle. Clock at 2026-08-01T00:00:00Z, so FY2026 is closed but no FY2026 forecast was ever certified."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1" }
          trigger:
            - { call: "POST /actual-collections", payload: { source_id: "${src_pit}", fiscal_year: 2026, actual_amount_cents: 1200000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 422 and ${err} == ERR_NO_CERTIFIED_FORECAST"
            - "GET /actual-collections with fiscal_year 2026 returns total_count == 0"
            - "RevenueSource.${src_pit}.posted_actual_count == 0 and mape_bps == 0"

      - name: revision_cycle_naming_an_uncertified_supersede_target_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority 45 ERR_INVALID_SUPERSEDE_TARGET]
          - entities.ForecastCycle.fields.supersedes_cycle_id
          - endpoints[POST /forecast-cycles]
        distinguishing_aspect: |
          A REVISION may only supersede a CERTIFIED cycle of the same fiscal year, and a BASELINE may
          name no target at all — so the same field is rejected three ways:
          REVISION -> DRAFT target, REVISION -> no target, and BASELINE -> a target, each returning
          ERR_INVALID_SUPERSEDE_TARGET 422.
        test_recipe:
          setup:
            - "One DRAFT FY2027 BASELINE cycle, never certified, used as the (illegal) supersede target."
          setup_api_calls:
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_draft: $.data.id } }
          trigger:
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "REVISION", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000, supersedes_cycle_id: "${cyc_draft}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { err_draft_target: $.data.error_id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "REVISION", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { err_no_target: $.data.error_id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2028, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1700000000, prior_recurring_baseline_cents: 1600000000, supersedes_cycle_id: "${cyc_draft}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { err_baseline_target: $.data.error_id } }
          assert:
            - "all three triggers: HTTP 422 with error_id ERR_INVALID_SUPERSEDE_TARGET (${err_draft_target}, ${err_no_target}, ${err_baseline_target})"
            - "GET /forecast-cycles returns total_count == 1 (only the DRAFT baseline survives)"
            - "ForecastCycle.${cyc_draft}.supersedes_cycle_id == null and status == DRAFT"

      - name: reversal_that_would_overdraw_the_fund_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority 58 ERR_REVERSAL_WOULD_OVERDRAW]
        excluded_because:
          difficulty_instance: compensating_invariant / fund_ledger_identity_conserved_across_withdrawal_and_reversal
          rationale: "The fiscal-year roll that leaves the fund unable to absorb the reversal of its own certification deposit is asserted by the named §1.8 instance."

      - name: publish_of_a_stale_briefing_without_refresh_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority 40 ERR_ADEQUACY_STALE]
          - validations[priority 29 ERR_BRIEFING_COOLING_PERIOD]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / briefing_publication_depends_on_reserve_fund_version_being_current
          rationale: "Both the 48-hour blackout and the stale-snapshot refusal are triggered and separated by the named §1.8 instance."

      - name: close_vote_before_the_tally_is_meaningful_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority 27 ERR_VOTE_STILL_OPEN]
          - validations[priority 35 ERR_QUORUM_NOT_MET]
          - validations[priority 36 ERR_SUPERMAJORITY_NOT_MET]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / vote_still_open_at_priority_27_masks_quorum_shortfall_at_priority_35
          rationale: "All three ballot-closing errors, and the masking order between them, are asserted by the named §1.8 instance."

      - name: execute_before_approval_and_after_the_deadline_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority 21 ERR_REQUEST_NOT_APPROVED]
          - validations[priority 22 ERR_AUTHORIZATION_LAPSED]
          - validations[priority 56 ERR_ANNUAL_CAP_EXCEEDED]
          - validations[priority 57 ERR_INSUFFICIENT_RESERVE_BALANCE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / lapsed_authorization_at_priority_22_masks_both_fiscal_ceilings
          rationale: "The execution ladder — not-approved, lapsed, then the two fiscal ceilings — is asserted end to end by the named §1.8 instance."

      - name: cooling_off_window_blocks_a_second_execution
        claim_type: error_triggerable
        grounds:
          - validations[priority 28 ERR_COOLING_OFF_ACTIVE]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / cooling_off_window_is_closed_at_its_boundary_and_fy_cap_aggregates
          rationale: "The closed cooling-off boundary (rejected AT the boundary instant, accepted one second later) is asserted by the named §1.8 instance."

      - name: consensus_round_creation_on_a_draft_cycle_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority 10 ERR_CYCLE_NOT_LOCKED]
          - validations[priority 7 ERR_STALE_CYCLE_VERSION]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / consensus_round_open_depends_on_forecast_cycle_being_locked
          rationale: "ERR_CYCLE_NOT_LOCKED on a DRAFT cycle and the OCC guard on the same endpoint are asserted by the named §1.8 instance."

  # ===========================================================================
  # SECTION 7 — RBAC
  # ===========================================================================
  - section: rbac
    instances:
      - name: legislative_economist_cannot_certify_the_cycle
        claim_type: cannot_perform_other_exclusive_operations
        grounds:
          - roles.ForecastDirector.exclusive_operations
          - roles.LegislativeEconomist
          - validations[priority 3 ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Certification is exclusive to ForecastDirector, and the RBAC gate at priority 3 fires ahead
          of every state rule: the legislative economist's certify on a CONSENSUS_REACHED cycle — a
          call that would otherwise have succeeded — returns ERR_UNAUTHORIZED 403, and no aggregate
          is written.
        test_recipe:
          setup:
            - "SHORT chain in CONSENSUS_REACHED with a RATIFIED round, i.e. certification is legal for the right role."
          setup_api_calls:
            - { call: "POST /revenue-sources", payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }, as: ForecastDirector, as_user_id: "dir-1", captures: { src_pit: $.data.id } }
            - { call: "POST /forecast-cycles", payload: { fiscal_year: 2027, cycle_type: "BASELINE", reconciliation_policy: "MIDPOINT_AVERAGE", enacted_appropriation_cents: 1650000000, prior_recurring_baseline_cents: 1500000000 }, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc: $.data.id } }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "BASELINE", weight_bps: 6000, employment_growth_bps: 150, wage_income_bps: 400, retail_sales_bps: 300, asset_market_return_bps: 600 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "OPTIMISTIC", weight_bps: 2500, employment_growth_bps: 300, wage_income_bps: 700, retail_sales_bps: 600, asset_market_return_bps: 1500 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/scenarios", payload: { label: "PESSIMISTIC", weight_bps: 1500, employment_growth_bps: -100, wage_income_bps: 100, retail_sales_bps: -200, asset_market_return_bps: -1000 }, as: ForecastDirector, as_user_id: "dir-1" }
            - { call: "POST /forecast-cycles/${cyc}/lock-inputs", payload: {}, as: ForecastDirector, as_user_id: "dir-1", captures: { cyc_v: $.data.version } }
            - { call: "POST /consensus-rounds", payload: { cycle_id: "${cyc}", variance_tolerance_bps: 150, per_source_tolerance_bps: 150, expected_cycle_version: "${cyc_v}" }, as: ForecastDirector, as_user_id: "dir-1", captures: { rnd: $.data.id } }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /source-estimates", payload: { round_id: "${rnd}", source_id: "${src_pit}" }, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: ExecutiveEconomist, as_user_id: "exec-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/submit", payload: {}, as: LegislativeEconomist, as_user_id: "leg-eco-1" }
            - { call: "POST /consensus-rounds/${rnd}/ratify", payload: {}, as: ForecastDirector, as_user_id: "dir-1" }
          trigger:
            - { call: "POST /forecast-cycles/${cyc}/certify", payload: {}, as: LegislativeEconomist, as_user_id: "leg-eco-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 403 and ${err} == ERR_UNAUTHORIZED"
            - "ForecastCycle.${cyc}.status == CONSENSUS_REACHED, certified_at == null, certified_total_cents == null"
            - "the same call as ForecastDirector / dir-1 would return HTTP 200 — only the role differs"

      - name: rating_analyst_cannot_publish_a_briefing
