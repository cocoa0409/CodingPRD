      - name: list_endpoints_return_the_paginated_envelope_with_declared_filters
        claim_type: Listing
        grounds: "§1.0 response envelope (meta.api_request_id, meta.api_request_timestamp, response_type, data) and pagination_fields [limit, offset, total_count, has_more] with defaults {limit 10, min 1, max 100, offset 0}; §1.5 GET /channels, GET /playlists/{id}/items, GET /multiplexes"
        distinguishing_aspect: "A list read must return response_type=array with total_count reflecting the FILTERED set (not the table size) and has_more computed against limit/offset; an implementation that returns a bare JSON array, or that reports total_count after slicing, fails."
        test_recipe:
          setup: "Base graph through ch2 plus MUX-B/20.1, so three channels exist across two multiplexes."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *tx1
            - *mux1
            - *ch1
            - *mux1_read_v2
            - *ch2
            - *mux2
            - *ch_other
          trigger:
            - call: "GET /channels"
              payload: { multiplex_id: "${mux1_id}" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "GET /channels"
              payload: { multiplex_id: "${mux1_id}", air_status: DARK, posture: NORMAL }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "GET /multiplexes"
              payload: { transmitter_id: "${tx1_id}" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
          assert:
            - "each response has status 200, response_type array, and meta.api_request_id + meta.api_request_timestamp present"
            - "GET /channels?multiplex_id=${mux1_id} returns total_count 2, limit 10, offset 0, has_more false, and data contains ${ch1_id} and ${ch2_id} but never ${ch_other_id}"
            - "GET /channels?multiplex_id=${mux1_id}&air_status=DARK&posture=NORMAL still returns total_count 2 (both channels are DARK/NORMAL) — filters combine with AND"
            - "GET /multiplexes?transmitter_id=${tx1_id} returns total_count 2 (MUX-A and MUX-B)"
            - "repeating GET /channels?multiplex_id=${mux1_id}&limit=1&offset=0 returns exactly 1 element with total_count 2 and has_more true; the same read at offset=1 returns 1 element with has_more false"
            - "limit=0 and limit=101 are rejected with ERR_INVALID_FIELD_VALUE (422) because the declared bounds are min 1 / max 100"

      - name: every_entity_id_returns_its_own_not_found_error
        claim_type: Not Found
        grounds: "§1.4 priority 11 (per-path-segment existence map) and §1.6 the thirteen *_NOT_FOUND ids; §1.5 every GET /{id} endpoint"
        distinguishing_aspect: "Each of the thirteen addressable entities must answer a syntactically valid but unknown UUID with its OWN 404 id (ERR_TRANSMITTER_NOT_FOUND, ERR_MULTIPLEX_NOT_FOUND, ERR_CHANNEL_NOT_FOUND, ERR_OPERATOR_NOT_FOUND, ERR_ASSET_NOT_FOUND, ERR_QC_REPORT_NOT_FOUND, ERR_PLAYLIST_NOT_FOUND, ERR_PLAYLIST_ITEM_NOT_FOUND, ERR_SPOT_ORDER_NOT_FOUND, ERR_FEED_WINDOW_NOT_FOUND, ERR_OVERRIDE_NOT_FOUND, ERR_FAULT_NOT_FOUND, ERR_NOTIFICATION_NOT_FOUND); a single generic 404 id fails the claim."
        test_recipe:
          setup: "Clock at 2026-08-01T09:00:00Z and a StationAdmin caller; the database contains no row with the probe UUID."
          setup_api_calls:
            - *clk_t0
          trigger:
            - call: "GET /transmitters/00000000-0000-4000-8000-000000000001"
              as: StationAdmin
              captures: { e404_tx: "$.data.error_id" }
            - call: "GET /multiplexes/00000000-0000-4000-8000-000000000002"
              as: StationAdmin
              captures: { e404_mux: "$.data.error_id" }
            - call: "GET /channels/00000000-0000-4000-8000-000000000003"
              as: StationAdmin
              captures: { e404_ch: "$.data.error_id" }
            - call: "GET /operators/00000000-0000-4000-8000-000000000004"
              as: StationAdmin
              captures: { e404_op: "$.data.error_id" }
            - call: "GET /assets/00000000-0000-4000-8000-000000000005"
              as: StationAdmin
              captures: { e404_as: "$.data.error_id" }
            - call: "GET /qc-reports/00000000-0000-4000-8000-000000000006"
              as: StationAdmin
              captures: { e404_qc: "$.data.error_id" }
            - call: "GET /playlists/00000000-0000-4000-8000-000000000007"
              as: StationAdmin
              captures: { e404_pl: "$.data.error_id" }
            - call: "GET /playlist-items/00000000-0000-4000-8000-000000000008"
              as: StationAdmin
              captures: { e404_it: "$.data.error_id" }
            - call: "GET /spot-orders/00000000-0000-4000-8000-000000000009"
              as: StationAdmin
              captures: { e404_ord: "$.data.error_id" }
            - call: "GET /network-feed-windows/00000000-0000-4000-8000-00000000000a"
              as: StationAdmin
              captures: { e404_fw: "$.data.error_id" }
            - call: "GET /emergency-overrides/00000000-0000-4000-8000-00000000000b"
              as: StationAdmin
              captures: { e404_ov: "$.data.error_id" }
            - call: "GET /technical-faults/00000000-0000-4000-8000-00000000000c"
              as: StationAdmin
              captures: { e404_flt: "$.data.error_id" }
