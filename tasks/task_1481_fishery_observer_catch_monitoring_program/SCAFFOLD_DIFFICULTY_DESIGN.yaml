# =============================================================================
# §1.8 SCAFFOLD DIFFICULTY DESIGN — Fishery Observer & Catch Monitoring Program
# Test Targeting Index: 9 Difficulty Rules cross-referenced against
# SCAFFOLD.yaml §1.1–§1.7. Difficulty target: HARDER THAN EXPERT — every rule
# carries the §0.5 minimum of 2 instances, and the structurally hardest rules
# (dual-variant calc, transitive cascade, cross-entity dependency) carry a
# third instance to push coverage past the Expert ceiling.
# Active instances: 21 (rules 1,4,7 carry 3; rules 2,3,5,6,8,9 carry 2).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc: dual-variant calculations on DIFFERENT entity
  # domains. Instance 1: CoveragePlan coverage requirement (PROVISIONAL vs
  # FINAL). Instance 2: Invoice fee variant (STANDARD vs SMALL_VESSEL keyed on
  # Vessel.length_ft). Instance 3 (ceiling): EMTrip progress — the same
  # accumulated reviewed_hours feed two pinned variant outputs (reviewed_pct
  # at 4-decimal precision vs estimated_total_catch_kg extrapolation at 2).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: coverage_requirement_provisional_vs_final_diverge_on_actuals
        grounds:
          - calculations.coverage_requirement_calculation
          - state_machines.CoveragePlan.DRAFT_to_PUBLISHED
          - state_machines.CoveragePlan.SELECTION_COMPLETED_to_CLOSED
          - entities.CoveragePlan.fields.required_observer_sea_days
          - entities.CoveragePlan.fields.final_required_observer_sea_days
          - entities.CoveragePlan.fields.coverage_attainment_pct
        distinguishing_aspect: |
          One calculation on the CoveragePlan domain with two pinned variants:
          PROVISIONAL runs at publish over projected inputs (projected_fleet_effort_days
          / projected_em_effort_days) while FINAL runs at close over actual inputs
          (actual_fleet_effort_days / actual_em_sea_days). With projections 1000/300
          and actuals 1200/0 at coverage_target_pct 0.30, PROVISIONAL yields 210 and
          FINAL yields 360 for the SAME plan row — the variants diverge purely because
          the input variant switched.
        test_recipe:
          setup:
            - "Fishery F with coverage_target_pct 0.30, status ACTIVE"
            - "CoveragePlan P under F, period 2026-09-01..2026-12-31, projected_fleet_effort_days=1000, projected_em_effort_days=300"
            - "P published: required_observer_sea_days = ceil(max(0,1000-min(300,floor(1000*0.40)))*0.30) = ceil(700*0.30) = 210"
            - "One selection run executed so P reaches SELECTION_COMPLETED (eligible pool empty -> vessels_selected=0 is NOT an error per selection_run_sizing)"
            - "P closed with actual_fleet_effort_days=1200; actual_em_sea_days=0 (no EMTrips accepted)"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-PLK", name: "BSAI Pollock", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
            - call: "POST /observer-program/coverage-plans"
              payload: { fishery_id: "${fish_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", projected_fleet_effort_days: 1000, projected_em_effort_days: 300 }
              as: ProgramCoordinator
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /observer-program/coverage-plans/${plan_id}/publish"
              payload: {}
              as: ProgramCoordinator
              captures: { plan_v2: $.data.version, prov_days: $.data.required_observer_sea_days }
            - call: "POST /observer-program/coverage-plans/${plan_id}/selection-runs"
              payload: { notice_response_deadline: "2026-09-20T00:00:00Z", expected_coverage_plan_version: "${plan_v2}" }
              as: ProgramCoordinator
            - call: "POST /observer-program/coverage-plans/${plan_id}/close"
              payload: { actual_fleet_effort_days: 1200 }
              as: ProgramCoordinator
              captures: { final_days: $.data.final_required_observer_sea_days, attain: $.data.coverage_attainment_pct }
          trigger:
            - call: "GET /observer-program/coverage-plans/${plan_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { final_days2: $.data.final_required_observer_sea_days, prov_days2: $.data.required_observer_sea_days, attain2: $.data.coverage_attainment_pct }
          assert:
            - "CoveragePlan.${plan_id}.required_observer_sea_days == 210 (PROVISIONAL variant at publish over 1000/300)"
            - "CoveragePlan.${plan_id}.final_required_observer_sea_days == 360 (FINAL variant at close over 1200/0)"
            - "CoveragePlan.${plan_id}.final_required_observer_sea_days != CoveragePlan.${plan_id}.required_observer_sea_days (variants diverge on identical plan)"
            - "CoveragePlan.${plan_id}.coverage_attainment_pct == 0.0000 (actual_observer_sea_days == 0 over final 360)"

      - name: cost_recovery_fee_standard_vs_small_vessel_variant
        grounds:
          - calculations.cost_recovery_fee_calculation
          - entities.Invoice.fields.fee_variant
          - entities.Invoice.fields.amount_due_cents
          - entities.Vessel.fields.length_ft
        distinguishing_aspect: |
          One calculation on the Invoice domain with two pinned variants keyed on
          Vessel.length_ft: STANDARD (length_ft >= 40, variant_factor 1) vs
          SMALL_VESSEL (length_ft < 40, variant_factor 0.5 applied to the line
          subtotal BEFORE the 3.7% surcharge). For an identical 10-day CLOSED
          deployment pattern the STANDARD invoice totals 413,763 cents while the
          SMALL_VESSEL invoice totals 206,882 cents — different entity domain
          (Invoice/Vessel billing) from the CoveragePlan coverage instance.
        test_recipe:
          setup:
            - "Fishery F (target 0.30), operator OP (GOOD), observers OBS (LEAD), debriefer DEB"
            - "Vessel VA length_ft 50 (STANDARD) and vessel VB length_ft 30 (SMALL_VESSEL), both ACTIVE in F"
            - "CoveragePlan P (projected_fleet_effort_days=200, projected_em=0 -> required=60 -> top-2 vessels selected) published; selection run creates notices for VA and VB (both accepted)"
            - "Each vessel completes a 10-day deployment (departure 2026-09-10, return 2026-09-19) that reaches CLOSED (safety PASS, board, return 2026-09-19, one haul sample 100/500, submit-data, assign debriefer, verify sample, validate-data, close)"
            - "Invoice generation run over P"
