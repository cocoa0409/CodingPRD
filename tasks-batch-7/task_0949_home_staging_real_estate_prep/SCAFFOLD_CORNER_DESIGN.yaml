        grounds: ["state_machines.Consultation.SCHEDULED_to_HELD", "validations[priority=34]", "errors[ERR_EVENT_TOO_EARLY]"]
        distinguishing_aspect: "Holding a consultation whose scheduled_at is a month ahead of the logical clock returns ERR_EVENT_TOO_EARLY (422) and leaves state SCHEDULED with pipeline still unset."
        test_recipe:
          setup: ["Clock at 2026-06-01T00:00:00Z and a consultation scheduled for 2026-07-01T09:00:00Z."]
          setup_api_calls: &listing_ready_2
            - call: "POST /staging/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
