  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: register_gated_by_record_state
        grounds:
          - state_machines.TermEnrollment.PENDING_to_REGISTERED
          - errors[ERR_RECORD_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair TermEnrollment->SevisRecord: register is rejected while the
          student's record is DRAFT and succeeds once the record reaches
          INITIAL — enrollment transitions are gated on record state.
        test_recipe:
          setup:
            - "Clock 2026-08-01; UG student; record DRAFT (no I-20 yet); FALL enrollment PENDING 12 credits"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_id}", term_code: "2026-FALL", term_start_date: "2026-08-24", term_end_date: "2026-12-11", enrolled_credits: 12 }, as: DSO, captures: { enr_id: $.data.id } }
          trigger:
            - { call: "POST /sevis/term-enrollments/${enr_id}/register", payload: {}, as: DSO, captures: { err: $.data.error_id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_id: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_id}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_id}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments/${enr_id}/register", payload: {}, as: DSO, captures: { reg: $.data.status } }
            - { call: "GET /sevis/students/${stu_id}/sevis-records", payload: {}, as: DSO, captures: { rec_status: "$.data[0].status" } }
          assert:
            - "register while record DRAFT: data.error_id == ERR_RECORD_NOT_ACTIVE (HTTP 409)"
            - "after record reaches INITIAL: register succeeds, enrollment status == REGISTERED"
            - "first registration flips SevisRecord to ACTIVE"

      - name: reinstatement_recommendation_gated_by_record_terminated
        grounds:
          - state_machines.StatusViolation.OPEN_to_REINSTATEMENT_PENDING
          - errors[ERR_RECORD_NOT_TERMINATED]
        distinguishing_aspect: |
          Pair StatusViolation->SevisRecord (different pair than
          enrollment->record): RECOMMEND_REINSTATEMENT requires the record to
          be TERMINATED; on an ACTIVE record it fails with
          ERR_RECORD_NOT_TERMINATED, and after termination it drives the record
          into REINSTATEMENT_PENDING.
        test_recipe:
          setup:
            - "Clock 2026-08-01; UG student ACTIVE; OPEN StatusViolation (UNAUTHORIZED_EMPLOYMENT)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_id: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_id}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_id}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_id}", term_code: "2026-FALL", term_start_date: "2026-08-24", term_end_date: "2026-12-11", enrolled_credits: 12 }, as: DSO, captures: { enr_id: $.data.id } }
            - { call: "POST /sevis/term-enrollments/${enr_id}/register", payload: {}, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/status-violations", payload: { violation_type: "UNAUTHORIZED_EMPLOYMENT", description: "Off-campus work" }, as: DSO, captures: { viol_id: $.data.id } }
          trigger:
            - { call: "POST /sevis/status-violations/${viol_id}/transition", payload: { action: "RECOMMEND_REINSTATEMENT" }, as: DSO, captures: { err: $.data.error_id } }
            - { call: "POST /sevis/sevis-records/${rec_id}/terminate", payload: { termination_reason: "Unauthorized employment" }, as: PDSO }
            - { call: "POST /sevis/status-violations/${viol_id}/transition", payload: { action: "RECOMMEND_REINSTATEMENT" }, as: DSO, captures: { viol_status: $.data.status } }
            - { call: "GET /sevis/students/${stu_id}/sevis-records", payload: {}, as: DSO, captures: { rec_status: "$.data[0].status" } }
          assert:
            - "recommend while record ACTIVE: data.error_id == ERR_RECORD_NOT_TERMINATED (HTTP 409)"
            - "after termination: StatusViolation.${viol_id}.status == REINSTATEMENT_PENDING"
            - "SevisRecord.status == REINSTATEMENT_PENDING (side effect of the recommendation)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: employment_period_day_coverage_adjacency
        grounds:
          - validations[priority=6]
          - errors[ERR_EMPLOYMENT_PERIOD_OVERLAP]
          - calculations.unemployment_days
        distinguishing_aspect: |
          Day-coverage semantics on EmploymentAuthorization periods: sharing a
          calendar day is rejected, but zero-gap adjacency (next period starts
          the day after the previous ends) is allowed; covered-day union then
          reconciles unemployment_days_settled to 17.
        test_recipe:
          setup:
            - "UG student ACTIVE; OPT_POST APPROVED 2026-12-19..2027-12-18; clock 2027-03-05"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2025-08-25", program_end_date: "2026-12-18" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_id: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_id}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_id}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_id}", term_code: "2026-FALL", term_start_date: "2026-08-24", term_end_date: "2026-12-11", enrolled_credits: 12 }, as: DSO, captures: { enr_id: $.data.id } }
            - { call: "POST /sevis/term-enrollments/${enr_id}/register", payload: {}, as: DSO }
            - { call: "POST /sevis/employment-authorizations", payload: { student_id: "${stu_id}", auth_type: "OPT_POST", hours_per_week: 40, start_date: "2026-12-19", end_date: "2027-12-18" }, as: DSO, captures: { auth_id: $.data.id } }
            - { call: "POST /sevis/employment-authorizations/${auth_id}/transition", payload: { action: "RECOMMEND" }, as: DSO }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/employment-authorizations/${auth_id}/transition", payload: { action: "FILE", uscis_receipt_number: "IOE1234567890" }, as: Student, as_user_id: "${stu_id}" }
            - { call: "POST /sevis/employment-authorizations/${auth_id}/transition", payload: { action: "ADJUDICATE", outcome: "APPROVED" }, as: DSO }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-03-05T00:00:00Z" }, as: PDSO }
          trigger:
            - { call: "POST /sevis/employment-authorizations/${auth_id}/employment-periods", payload: { employer_name: "Acme Corp", start_date: "2027-01-01", end_date: "2027-01-31", hours_per_week: 40 }, as: Student, as_user_id: "${stu_id}", captures: { p1: $.data.id } }
            - { call: "POST /sevis/employment-authorizations/${auth_id}/employment-periods", payload: { employer_name: "Beta LLC", start_date: "2027-01-15", end_date: "2027-02-15", hours_per_week: 40 }, as: Student, as_user_id: "${stu_id}", captures: { err_overlap: $.data.error_id } }
            - { call: "POST /sevis/employment-authorizations/${auth_id}/employment-periods", payload: { employer_name: "Beta LLC", start_date: "2027-02-01", end_date: "2027-02-28", hours_per_week: 40 }, as: Student, as_user_id: "${stu_id}", captures: { p3: $.data.id } }
            - { call: "GET /sevis/employment-authorizations/${auth_id}", payload: {}, as: DSO, captures: { settled: $.data.unemployment_days_settled } }
          assert:
            - "period 2027-01-01..2027-01-31 accepted (201)"
            - "period 2027-01-15..2027-02-15 rejected: data.error_id == ERR_EMPLOYMENT_PERIOD_OVERLAP (shares Jan 15-31)"
            - "period 2027-02-01..2027-02-28 accepted (zero-gap adjacency allowed: start == prior end + 1 day)"
            - "EmploymentAuthorization.${auth_id}.unemployment_days_settled == 17 (elapsed 76 days 2026-12-19..2027-03-04 minus 59 covered days)"

      - name: endorsement_window_closed_touch_rejected
        grounds:
          - validations[priority=6]
          - errors[ERR_ENDORSEMENT_WINDOW_OVERLAP]
          - concurrency_rules[endorsement-issue-stale-i20]
        distinguishing_aspect: |
          Closed-interval semantics on TravelEndorsement windows of one I20Form
          (different resource and different geometry than employment periods):
          a new departure exactly equal to an existing ACTIVE endorsement's
          return counts as overlap and is rejected, while a departure one day
          later is accepted.
        test_recipe:
          setup:
            - "Clock 2026-08-01; UG student ACTIVE; I-20 ISSUED; endorsement E1 ACTIVE for 2026-12-12..2027-01-10"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_id: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_id}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_id}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_id}", term_code: "2026-FALL", term_start_date: "2026-08-24", term_end_date: "2026-12-11", enrolled_credits: 12 }, as: DSO, captures: { enr_id: $.data.id } }
            - { call: "POST /sevis/term-enrollments/${enr_id}/register", payload: {}, as: DSO }
            - { call: "GET /sevis/i20-forms/${i20_id}", payload: {}, as: DSO, captures: { i20_v1: $.data.version } }
            - { call: "POST /sevis/i20-forms/${i20_id}/travel-endorsements", payload: { expected_i20_form_version: "${i20_v1}", travel_departure_date: "2026-12-12", travel_return_date: "2027-01-10" }, as: DSO, captures: { e1: $.data.id } }
          trigger:
            - { call: "GET /sevis/i20-forms/${i20_id}", payload: {}, as: DSO, captures: { i20_v2: $.data.version } }
            - { call: "POST /sevis/i20-forms/${i20_id}/travel-endorsements", payload: { expected_i20_form_version: "${i20_v2}", travel_departure_date: "2027-01-10", travel_return_date: "2027-01-20" }, as: DSO, captures: { err_touch: $.data.error_id } }
            - { call: "POST /sevis/i20-forms/${i20_id}/travel-endorsements", payload: { expected_i20_form_version: "${i20_v2}", travel_departure_date: "2027-01-11", travel_return_date: "2027-01-20" }, as: DSO, captures: { e3: $.data.id } }
          assert:
            - "departure 2027-01-10 (== E1 return) rejected: data.error_id == ERR_ENDORSEMENT_WINDOW_OVERLAP (closed-interval touch counts as overlap)"
            - "departure 2027-01-11 accepted (201): TravelEndorsement created ACTIVE"
            - "rejected request did not bump I20Form.version (second attempt reuses the same expected version successfully)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: issued_i20_count_conserved_under_supersede
        grounds:
          - state_machines.I20Form.DRAFT_to_ISSUED
          - state_machines.I20Form.ISSUED_to_SUPERSEDED
          - entities.I20Form.fields.supersedes_i20_form_id
        distinguishing_aspect: |
          Conserved quantity: the count of ISSUED I20Forms per SevisRecord.
          The paired supersede(old -> SUPERSEDED) + issue(new DRAFT -> ISSUED)
          in one issuance action leaves the count at exactly 1 before and
          after; the replacement is the sole ISSUED form.
        test_recipe:
          setup:
            - "Clock 2026-08-01; UG student ACTIVE; I-20 F1 ISSUED (program Mechanical Engineering); exactly one ISSUED form for the record"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/sevis-records", payload: { program_start_date: "2026-08-24", program_end_date: "2027-05-31" }, as: DSO, captures: { rec_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 2000000, issue_date: "2026-07-01" }, as: DSO, captures: { doc_a: $.data.id } }
            - { call: "POST /sevis/financial-documents/${doc_a}/review", payload: { decision: "VERIFIED" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Mechanical Engineering", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000 }, as: DSO, captures: { i20_old: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_old}/issue", payload: {}, as: DSO }
            - { call: "POST /sevis/sevis-records/${rec_id}/initialize", payload: {}, as: DSO }
            - { call: "POST /sevis/term-enrollments", payload: { student_id: "${stu_id}", term_code: "2026-FALL", term_start_date: "2026-08-24", term_end_date: "2026-12-11", enrolled_credits: 12 }, as: DSO, captures: { enr_id: $.data.id } }
            - { call: "POST /sevis/term-enrollments/${enr_id}/register", payload: {}, as: DSO }
          trigger:
            - { call: "POST /sevis/students/${stu_id}/i20-forms", payload: { sevis_record_id: "${rec_id}", program_name: "Computer Science", tuition_cents: 1200000, living_cents: 600000, insurance_cents: 120000, other_cents: 60000, supersedes_i20_form_id: "${i20_old}" }, as: DSO, captures: { i20_new: $.data.id } }
            - { call: "POST /sevis/i20-forms/${i20_new}/issue", payload: {}, as: DSO }
            - { call: "GET /sevis/i20-forms?sevis_record_id=${rec_id}&status=ISSUED", payload: {}, as: DSO, captures: { issued_id: "$.data[0].id" } }
            - { call: "GET /sevis/i20-forms/${i20_old}", payload: {}, as: DSO, captures: { old_status: $.data.status } }
          assert:
            - "program-change reissue: new form ${i20_new} ISSUED with program_name Computer Science"
            - "old form ${i20_old}.status == SUPERSEDED"
            - "GET /sevis/i20-forms?sevis_record_id=${rec_id}&status=ISSUED returns exactly 1 form and it is ${i20_new} (issued-count invariant: 1 before, 1 after)"

      - name: unemployment_budget_conserved_under_period_add_remove
        grounds:
          - calculations.unemployment_days
          - entities.EmploymentPeriod.fields.authorization_id
        distinguishing_aspect: |
          Conserved quantity: the settled elapsed-day budget of an OPT_POST
          authorization (elapsed == covered + unemployed). Reporting then
          deleting a 31-day employment period moves settled unemployment
          76 -> 45 -> 76, ending exactly where it started — no drift in the
          conserved day budget; a different conserved quantity than the I-20
          count invariant.
        test_recipe:
          setup:
            - "UG student ACTIVE; OPT_POST APPROVED 2026-12-19..2027-12-18; clock 2027-03-05 (settled horizon 2027-03-04, elapsed 76 days)"
          setup_api_calls:
