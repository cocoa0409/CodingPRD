            - "ProjectSpecification.${spec_id}.status == 'ISSUED'"
            - "Project.${proj_id}.version == proj_v0 + 1 (OCC success advanced the parent version)"
            - "ProjectSpecification.${spec_id}.pinned_spec_revision == 1"

