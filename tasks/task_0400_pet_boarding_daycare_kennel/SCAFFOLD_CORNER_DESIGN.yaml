              as: FacilityManager
              captures: { res: $.data.id, res_v0: $.data.version }
            - call: "POST /reservations/${res}/assignments"
              payload: { run_id: "${run1}", expected_reservation_version: "${res_v0}" }
              as: FacilityManager
          trigger:
            - call: "POST /reservations/${res}/assignments"
