              as: Conservator
              as_user_id: con-01
            - call: "POST /material-specs/${matE}/submit-for-conservation"
              payload: {}
              as: FabricationLead
              as_user_id: fab-01
          assert:
            - "${matA_v} == CONSERVATION_SAFE - 0.05 <= 0.05, 0.02 <= 0.02 and 21 >= 21, three simultaneous equalities on the safe branch"
            - "${matB_v} == CONDITIONAL_SAFE - identical chemistry with cure_days 20, one day short of the 21-day minimum, drops out of branch 2 into branch 3"
            - "${matC_v} == CONDITIONAL_SAFE - 0.10 is exactly 2 * 0.05, and the UNSAFE branch tests strictly greater than twice the limit"
            - "${matD_v} == UNSAFE - 0.11 > 0.10"
            - "${matE_v} == UNSAFE - an UNTESTED Oddy result short-circuits branch 1 even though 0.01 and 0.001 are far inside the limits and cure_days is 60"
            - "${matF_v} == CONSERVATION_SAFE - the same 0.10 / 0.02 / 21 numbers that were only CONDITIONAL_SAFE for a CASE_INTERIOR are safe for a GRAPHIC, because the limit map is keyed on used_in"
            - "${aSt} == APPROVED; the APPROVE on matC fails with ERR_OFFGASSING_LIMIT_EXCEEDED (422) and the APPROVE_WITH_CONDITIONS then succeeds with ${cSt} == CONDITIONAL"
            - "both decisions on matD fail with ERR_OFFGASSING_LIMIT_EXCEEDED - an UNSAFE verdict cannot be waived by fiat, only REJECT is available"
            - "the submit on matE fails with ERR_INVALID_MATERIAL_STATE (409), because an UNTESTED spec may not enter conservator review at all"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: the_drawing_decision_branch_is_selected_by_the_material_specs_status
        grounds:
          - validations.priority_72
          - state_machines.ShopDrawing.UNDER_REVIEW_to_APPROVED
          - state_machines.ShopDrawing.UNDER_REVIEW_to_APPROVED_AS_NOTED
          - state_machines.MaterialSpec.CONSERVATOR_REVIEW_to_CONDITIONAL
          - calculations.fabrication_cost_estimate
        distinguishing_aspect: |
          Whether a shop drawing may be approved is decided by a row the request
          never mentions: the MaterialSpec named at creation. A SUBMITTED spec
          blocks the drawing at creation time, a CONDITIONAL spec allows creation
          and then permits exactly ONE of the two approval branches, and the two
          branches have IDENTICAL money effects - the same 137500 cents move to
          committed_fabrication_cents either way - so nothing in the ledger
          reveals which branch ran. Only the sheet's recorded conservation status
          differs. Implementations that treat APPROVE and APPROVE_AS_NOTED as
          synonyms let a conditionally cleared material be signed off as
          unconditionally approved, which is the whole point of the distinction.
        test_recipe:
          setup:
            - "project in phase FABRICATION with case C-01 APPROVED and interactive INT-STRATA carrying the second objective"
            - "material spec matS created and left in status SUBMITTED (never sent to conservation)"
            - "material spec matC created, submitted, and cleared with APPROVE_WITH_CONDITIONS, so its verdict is CONSERVATION_SAFE but its status is CONDITIONAL"
