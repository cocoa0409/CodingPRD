# =============================================================================
# §1.9 Scaffold Corner Design — Breadth Audit of §1.1–§1.7
# Task 2351 — Emergency Food Assistance Commodity Allocation
#
# One walk of references/claim-extraction-guide.md against this scaffold. Rows
# whose only interesting instance is already carried by §1.8 appear as
# `excluded_because` stubs citing that instance by exact name. Every literal in
# an assert was produced by running the §1.3 formula on the pinned fixtures.
#
# Shared fixture vocabulary used across recipes below:
#   clock            2026-08-01T00:00:00Z unless a recipe moves it
#   BULK_RICE        DRY, 20.0 lb/case, 50 cases/pallet, 1200c/case, 900 d, ceiling 500
#   FROZEN_CHICKEN   FROZEN, 30.125 lb/case, 45 cases/pallet, 2600c/case, 365 d, ceiling 400
#   WH North         2 docks, dry 100 / cold 50 / frozen 20 pallets, TURNOVER_BASED
#   users            adm-1, adm-2 (StateAdmin), rev-1, rev-2 (ComplianceReviewer),
#                    AgencyCoordinator X-User-ID == agency_id,
#                    StateWarehouseOperator X-User-ID == warehouse_id
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section 1 — Entities (§1.1). entity_topology: flat, so FK validation and
  # cross-reference integrity are the topology-specific rows.
  # ===========================================================================
  - section: entities
    instances:

      - name: create_commodity_with_all_declared_inputs_returns_201_and_echoes_every_field
        claim_type: creation
        grounds:
          - entities.Commodity
          - endpoints.POST_/efap/commodities
        distinguishing_aspect: "Commodity is the one entity with common_fields false, so a successful creation must return id, code, name, storage_class, net_weight_lbs_per_case, cases_per_pallet, entitlement_value_cents_per_case, shelf_life_days and excess_case_ceiling with 201 — and must NOT return a version field."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. No other rows."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "POST /efap/commodities"
              payload: { code: "BULK_RICE", name: "Bulk Rice", storage_class: "DRY", net_weight_lbs_per_case: 20.0, cases_per_pallet: 50, entitlement_value_cents_per_case: 1200, shelf_life_days: 900, excess_case_ceiling: 500 }
              as: StateAdmin
              captures: { cm_rice: $.data.id }
          assert:
            - "HTTP 201"
            - "response.data.code == BULK_RICE and response.data.storage_class == DRY"
            - "response.data.net_weight_lbs_per_case == 20.0 and response.data.cases_per_pallet == 50"
            - "response.data.entitlement_value_cents_per_case == 1200 and response.data.shelf_life_days == 900 and response.data.excess_case_ceiling == 500"
            - "response.data.id is a non-empty string"
            - "response.meta.api_request_id and response.meta.api_request_timestamp are present and response_type == object"

      - name: get_inventory_lot_returns_the_stored_row_with_its_computed_entitlement_value
        claim_type: retrieval
        grounds:
          - entities.InventoryLot
          - endpoints.GET_/efap/inventory-lots/{inventory_lot_id}
        distinguishing_aspect: "Retrieval of a RECEIVED lot must show the receipt-time computed money field (100 cases * 1200 cents == 120000) while every movement counter is still zero — cases_on_hand stays 0 until the lot is posted, so retrieval must not pre-credit inventory."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "BULK_RICE commodity, WH North warehouse, one lot of 100 cases, not posted."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/commodities"
              payload: { code: "BULK_RICE", name: "Bulk Rice", storage_class: "DRY", net_weight_lbs_per_case: 20.0, cases_per_pallet: 50, entitlement_value_cents_per_case: 1200, shelf_life_days: 900, excess_case_ceiling: 500 }
              as: StateAdmin
              captures: { cm_rice: $.data.id }
            - call: "POST /efap/warehouses"
              payload: { name: "WH North", dock_count: 2, dry_pallet_capacity: 100, cold_pallet_capacity: 50, frozen_pallet_capacity: 20, monitor_policy: "TURNOVER_BASED" }
              as: StateAdmin
              captures: { wh: $.data.id }
            - call: "POST /efap/inventory-lots"
              payload: { commodity_id: "${cm_rice}", warehouse_id: "${wh}", federal_lot_code: "FL-1001", cases_received: 100, pack_date: "2026-07-01", best_by_date: "2028-01-01" }
              as: StateAdmin
              captures: { lot1: $.data.id }
          trigger:
            - call: "GET /efap/inventory-lots/${lot1}"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "rev-1"
          assert:
            - "HTTP 200"
            - "response.data.entitlement_value_cents == 120000"
            - "response.data.cases_received == 100 and cases_on_hand == 0 and cases_committed == 0 and cases_shipped_to_date == 0"
            - "response.data.status == RECEIVED and monitor_flag == NONE and slow_moving_index == 0.0"
            - "response.data.posted_at == null and last_monitored_at == null and hold_recall_id == null"
            - "response.data.version == 1"

      - name: list_agencies_paginates_with_total_count_has_more_and_created_at_order
        claim_type: listing
        grounds:
          - endpoints.GET_/efap/agencies
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three agencies with limit 2 must report total_count 3 with has_more true on page one and has_more false on page two, and the two pages must partition the set in created_at ASC order with no id-based tie-break; limit 101 exceeds the declared max of 100 and is refused."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One service area hosting three agencies created in the order Alpha, Bravo, Charlie."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/service-areas"
              payload: { name: "Area North", county_code: "C001", poverty_population: 40000, urban_rural: "URBAN" }
              as: StateAdmin
              captures: { sa: $.data.id }
            - call: "POST /efap/agencies"
              payload: { name: "Agency Alpha", service_area_id: "${sa}", cold_storage_pallet_capacity: 10 }
              as: StateAdmin
              captures: { ag1: $.data.id }
            - call: "POST /efap/agencies"
              payload: { name: "Agency Bravo", service_area_id: "${sa}", cold_storage_pallet_capacity: 10 }
              as: StateAdmin
              captures: { ag2: $.data.id }
            - call: "POST /efap/agencies"
              payload: { name: "Agency Charlie", service_area_id: "${sa}", cold_storage_pallet_capacity: 0 }
              as: StateAdmin
              captures: { ag3: $.data.id }
          trigger:
            - call: "GET /efap/agencies"
              payload: { limit: 2, offset: 0 }
              as: StateAdmin
            - call: "GET /efap/agencies"
              payload: { limit: 2, offset: 2 }
              as: StateAdmin
            - call: "GET /efap/agencies"
              payload: { service_area_id: "${sa}", eligibility_posture: "INELIGIBLE" }
              as: StateAdmin
            - call: "GET /efap/agencies"
              payload: { limit: 101 }
              as: StateAdmin
              captures: { e_limit: "$.data.error_id" }
          assert:
            - "page one: HTTP 200, response_type == array, total_count == 3, has_more == true, limit == 2, offset == 0, exactly 2 rows"
            - "page one rows are [${ag1}, ${ag2}] in created_at ASC order"
            - "page two: total_count == 3, has_more == false, exactly 1 row, that row is ${ag3}"
            - "filtered read: total_count == 3 (all three agencies are INELIGIBLE with no agreement and no training)"
            - "limit 101: HTTP 422 ERR_INVALID_REQUEST — the declared pagination max is 100"

      - name: get_agency_with_unknown_id_returns_agency_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_AGENCY_NOT_FOUND
          - validations.priority_3
        distinguishing_aspect: "A syntactically valid but unstored agency id resolves to 404 ERR_AGENCY_NOT_FOUND from the path-resolution pass at priority 3, not to 422 or an empty 200 envelope."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. No agency rows at all."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "GET /efap/agencies/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: StateAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "response.data.error_id == ERR_AGENCY_NOT_FOUND"
            - "response.response_type == error and response.data.message is a non-empty string"

      - name: create_agency_without_cold_storage_capacity_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Agency.fields.cold_storage_pallet_capacity
          - validations.priority_4
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "cold_storage_pallet_capacity is a required input with no default (unlike prior_period_pounds_distributed and prior_period_allocated_cases, which do have defaults), so omitting it is a 422 ERR_INVALID_REQUEST rather than a silently-zeroed agency ceiling."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, one service area."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/service-areas"
              payload: { name: "Area North", county_code: "C001", poverty_population: 40000, urban_rural: "URBAN" }
              as: StateAdmin
              captures: { sa: $.data.id }
          trigger:
            - call: "POST /efap/agencies"
              payload: { name: "Agency Alpha", service_area_id: "${sa}" }
              as: StateAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "no Agency row was created: GET /efap/agencies returns total_count == 0"

      - name: omitting_optional_inputs_applies_the_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ServiceArea.fields.urban_rural
          - entities.Agency.fields.prior_period_pounds_distributed
          - entities.Agency.fields.prior_period_allocated_cases
          - entities.Warehouse.fields.monitor_policy
        distinguishing_aspect: "Four distinct declared defaults must materialise from omission in one pass: ServiceArea.urban_rural MIXED, Warehouse.monitor_policy TURNOVER_BASED, Agency.prior_period_pounds_distributed 0.0 and Agency.prior_period_allocated_cases 0 — the last two being the numerator and the hold-harmless base, so a wrong default silently biases every later allocation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. No rows."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "POST /efap/service-areas"
              payload: { name: "Area North", county_code: "C001", poverty_population: 40000 }
              as: StateAdmin
              captures: { sa: $.data.id }
            - call: "POST /efap/agencies"
              payload: { name: "Agency Alpha", service_area_id: "${sa}", cold_storage_pallet_capacity: 10 }
              as: StateAdmin
              captures: { ag: $.data.id }
            - call: "POST /efap/warehouses"
              payload: { name: "WH North", dock_count: 2, dry_pallet_capacity: 100, cold_pallet_capacity: 50, frozen_pallet_capacity: 20 }
              as: StateAdmin
              captures: { wh: $.data.id }
          assert:
            - "ServiceArea.${sa}.urban_rural == MIXED and eligible_agency_count == 0"
            - "Agency.${ag}.prior_period_pounds_distributed == 0.0 and prior_period_allocated_cases == 0"
            - "Agency.${ag}.agreement_status == PENDING and training_status == REQUIRED and eligibility_posture == INELIGIBLE"
            - "Warehouse.${wh}.monitor_policy == TURNOVER_BASED"

      - name: inventory_lot_entitlement_value_is_computed_and_client_supplied_value_is_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.InventoryLot.fields.entitlement_value_cents
          - endpoints.POST_/efap/inventory-lots
        distinguishing_aspect: "entitlement_value_cents is source computed and absent from the creation input list, so a client-supplied 999999 must be discarded and the field written as cases_received * Commodity.entitlement_value_cents_per_case == 40 * 2600 == 104000."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "FROZEN_CHICKEN commodity at 2600 cents per case and WH North."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/commodities"
              payload: { code: "FROZEN_CHICKEN", name: "Frozen Chicken", storage_class: "FROZEN", net_weight_lbs_per_case: 30.125, cases_per_pallet: 45, entitlement_value_cents_per_case: 2600, shelf_life_days: 365, excess_case_ceiling: 400 }
              as: StateAdmin
              captures: { cm_chix: $.data.id }
            - call: "POST /efap/warehouses"
              payload: { name: "WH North", dock_count: 2, dry_pallet_capacity: 100, cold_pallet_capacity: 50, frozen_pallet_capacity: 20, monitor_policy: "TURNOVER_BASED" }
              as: StateAdmin
              captures: { wh: $.data.id }
          trigger:
            - call: "POST /efap/inventory-lots"
              payload: { commodity_id: "${cm_chix}", warehouse_id: "${wh}", federal_lot_code: "FL-2001", cases_received: 40, pack_date: "2026-07-15", best_by_date: "2027-07-15", entitlement_value_cents: 999999 }
              as: StateAdmin
              captures: { lot: $.data.id }
          assert:
            - "HTTP 201"
            - "InventoryLot.${lot}.entitlement_value_cents == 104000 (not 999999)"
            - "InventoryLot.${lot}.cases_received == 40 and status == RECEIVED"

      - name: service_area_identity_and_timestamps_are_server_generated_and_client_values_input_ignored
        claim_type: system_fields
        grounds:
          - entities.ServiceArea
          - endpoints.POST_/efap/service-areas
        distinguishing_aspect: "id, created_at, updated_at and version are system fields: a creation body carrying id, created_at and version must ignore all three, and the row's created_at must equal the logical clock 2026-08-01T00:00:00Z rather than any wall clock or the submitted 1999 value."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "POST /efap/service-areas"
              payload: { name: "Area North", county_code: "C001", poverty_population: 40000, id: "sa-client-chosen", created_at: "1999-01-01T00:00:00Z", version: 77 }
              as: StateAdmin
              captures: { sa: $.data.id }
          assert:
            - "HTTP 201 and response.data.id != sa-client-chosen"
            - "response.data.created_at == 2026-08-01T00:00:00Z and updated_at == 2026-08-01T00:00:00Z"
            - "response.data.version == 1 (not 77)"
            - "GET /efap/service-areas/sa-client-chosen returns 404 ERR_SERVICE_AREA_NOT_FOUND"

      - name: enum_and_range_constraints_are_enforced_with_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Commodity.fields.storage_class
          - entities.AllocationCycle.fields.order_window_close_at
          - entities.HouseholdDistribution.fields.household_size
          - validations.priority_4
        distinguishing_aspect: "Three different shapes of §1.1 constraint all funnel into 422 ERR_INVALID_REQUEST at priority 4, before any existence or state check: an out-of-list enum (storage_class CHILLED), a violated cross-field ordering (order_window_close_at at the open instant, which must be strictly greater), and an out-of-range integer (household_size 21 against the 1..20 bound)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. No other rows needed — priority 4 precedes existence checks."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "POST /efap/commodities"
              payload: { code: "CHILLED_MILK", name: "Chilled Milk", storage_class: "CHILLED", net_weight_lbs_per_case: 40.0, cases_per_pallet: 30, entitlement_value_cents_per_case: 900, shelf_life_days: 20, excess_case_ceiling: 100 }
              as: StateAdmin
              captures: { e1: "$.data.error_id" }
            - call: "POST /efap/allocation-cycles"
              payload: { cycle_code: "FY27BAD", formula_variant: "STANDARD", allocatable_cases: 100, admin_funds_pool_cents: 100000, offered_commodity_codes: ["BULK_RICE"], order_window_open_at: "2026-08-05T00:00:00Z", order_window_close_at: "2026-08-05T00:00:00Z" }
              as: StateAdmin
              captures: { e2: "$.data.error_id" }
            - call: "POST /efap/household-distributions"
              payload: { agency_id: "00000000-0000-0000-0000-000000000000", cycle_id: "00000000-0000-0000-0000-000000000000", commodity_id: "00000000-0000-0000-0000-000000000000", household_size: 21, declared_monthly_income_cents: 100000, self_declaration_signed: true, cases_distributed: 1, distribution_date: "2026-08-01" }
              as: AgencyCoordinator
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { e3: "$.data.error_id" }
          assert:
            - "all three calls: HTTP 422 with response.data.error_id == ERR_INVALID_REQUEST"
            - "the third call returns ERR_INVALID_REQUEST and NOT ERR_AGENCY_NOT_FOUND, proving priority 4 runs before the body-FK pass at priority 5"
            - "no Commodity, AllocationCycle or HouseholdDistribution row exists after the three calls"

      - name: commodity_is_immutable_with_no_update_endpoint_and_no_version_field
        claim_type: immutability
        grounds:
          - entities.Commodity.common_fields_false
          - endpoints.GET_/efap/commodities/{commodity_id}
        distinguishing_aspect: "Commodity is the only entity declared common_fields false: §1.5 exposes POST, list and detail but no PATCH, and the detail payload must omit version and updated_at, so downstream money math (entitlement_value_cents_per_case) can never be revised under a live allocation."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, one BULK_RICE commodity."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/commodities"
              payload: { code: "BULK_RICE", name: "Bulk Rice", storage_class: "DRY", net_weight_lbs_per_case: 20.0, cases_per_pallet: 50, entitlement_value_cents_per_case: 1200, shelf_life_days: 900, excess_case_ceiling: 500 }
              as: StateAdmin
              captures: { cm_rice: $.data.id }
          trigger:
            - call: "GET /efap/commodities/${cm_rice}"
              payload: {}
              as: StateWarehouseOperator
              as_user_id: "wh-anon"
          assert:
            - "HTTP 200 and response.data has no version key and no updated_at key"
            - "response.data.entitlement_value_cents_per_case == 1200"
            - "§1.5 declares no PATCH or DELETE under /efap/commodities, so the commodity catalogue is append-only"

      - name: duplicate_code_creations_are_refused_across_all_five_unique_keys
        claim_type: parent_relationships
        grounds:
          - validations.priority_24
          - errors.ERR_DUPLICATE_CODE
          - entities.InventoryLot.fields.federal_lot_code
        distinguishing_aspect: "Flat topology means uniqueness is per-key rather than per-parent: Commodity.code, Warehouse.name and ServiceArea.county_code are globally unique, while InventoryLot.federal_lot_code is unique only per warehouse_id — so the same federal lot code succeeds at a second warehouse and fails at the first."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "BULK_RICE commodity, warehouses WH North and WH South, and lot FL-1001 at WH North."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/commodities"
              payload: { code: "BULK_RICE", name: "Bulk Rice", storage_class: "DRY", net_weight_lbs_per_case: 20.0, cases_per_pallet: 50, entitlement_value_cents_per_case: 1200, shelf_life_days: 900, excess_case_ceiling: 500 }
              as: StateAdmin
              captures: { cm_rice: $.data.id }
            - call: "POST /efap/warehouses"
              payload: { name: "WH North", dock_count: 2, dry_pallet_capacity: 100, cold_pallet_capacity: 50, frozen_pallet_capacity: 20, monitor_policy: "TURNOVER_BASED" }
              as: StateAdmin
              captures: { wh: $.data.id }
            - call: "POST /efap/warehouses"
              payload: { name: "WH South", dock_count: 1, dry_pallet_capacity: 50, cold_pallet_capacity: 0, frozen_pallet_capacity: 0, monitor_policy: "TURNOVER_BASED" }
              as: StateAdmin
              captures: { wh2: $.data.id }
            - call: "POST /efap/inventory-lots"
              payload: { commodity_id: "${cm_rice}", warehouse_id: "${wh}", federal_lot_code: "FL-1001", cases_received: 100, pack_date: "2026-07-01", best_by_date: "2028-01-01" }
              as: StateAdmin
              captures: { lot1: $.data.id }
          trigger:
            - call: "POST /efap/inventory-lots"
              payload: { commodity_id: "${cm_rice}", warehouse_id: "${wh}", federal_lot_code: "FL-1001", cases_received: 20, pack_date: "2026-07-02", best_by_date: "2028-01-02" }
              as: StateAdmin
              captures: { e1: "$.data.error_id" }
            - call: "POST /efap/inventory-lots"
              payload: { commodity_id: "${cm_rice}", warehouse_id: "${wh2}", federal_lot_code: "FL-1001", cases_received: 20, pack_date: "2026-07-02", best_by_date: "2028-01-02" }
              as: StateAdmin
              captures: { lot2: $.data.id }
            - call: "POST /efap/warehouses"
              payload: { name: "WH North", dock_count: 3, dry_pallet_capacity: 10, cold_pallet_capacity: 0, frozen_pallet_capacity: 0, monitor_policy: "TURNOVER_BASED" }
              as: StateAdmin
              captures: { e2: "$.data.error_id" }
          assert:
            - "first call: HTTP 409 ERR_DUPLICATE_CODE (same federal_lot_code at the same warehouse)"
            - "second call: HTTP 201 — the same federal_lot_code at WH South is accepted because the key is scoped per warehouse_id"
            - "third call: HTTP 409 ERR_DUPLICATE_CODE (Warehouse.name is globally unique)"
            - "GET /efap/inventory-lots with warehouse_id ${wh} returns total_count == 1"

      - name: create_agency_under_unknown_service_area_returns_service_area_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_5
          - errors.ERR_SERVICE_AREA_NOT_FOUND
          - entities.Agency.fields.service_area_id
        distinguishing_aspect: "Under flat topology the parent arrives as a body FK rather than a URL segment, so an unstored service_area_id must be caught by the priority-5 body-FK pass with 404 ERR_SERVICE_AREA_NOT_FOUND — not by a foreign-key exception surfaced as 500 and not by creating an orphan agency."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. No ServiceArea rows."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "POST /efap/agencies"
              payload: { name: "Agency Orphan", service_area_id: "00000000-0000-0000-0000-000000000000", cold_storage_pallet_capacity: 5 }
              as: StateAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and response.data.error_id == ERR_SERVICE_AREA_NOT_FOUND"
            - "GET /efap/agencies returns total_count == 0"

  # ===========================================================================
  # Section 2 — State machines (§1.2). shape: parallel (Agency's two axes) with
  # compound (AllocationCycle.draw_posture) and cyclic (order revision) regions.
  # ===========================================================================
  - section: state_machines
    instances:

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Agency.initial_state
          - state_machines.AllocationCycle.initial_state
          - state_machines.InventoryLot.initial_state
          - entities.AllocationCycle.fields.draw_posture
        distinguishing_aspect: "Five machines must all start cold in one pass: Agency at PENDING on the agreement axis AND REQUIRED on the training axis (two independent initial states on one row), AllocationCycle at DRAFT with draw_posture NOT_STARTED, and InventoryLot at RECEIVED with cases_on_hand 0 — a lot that starts AVAILABLE would make un-posted federal receipts orderable."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, BULK_RICE commodity and WH North warehouse."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/commodities"
              payload: { code: "BULK_RICE", name: "Bulk Rice", storage_class: "DRY", net_weight_lbs_per_case: 20.0, cases_per_pallet: 50, entitlement_value_cents_per_case: 1200, shelf_life_days: 900, excess_case_ceiling: 500 }
              as: StateAdmin
              captures: { cm_rice: $.data.id }
            - call: "POST /efap/warehouses"
              payload: { name: "WH North", dock_count: 2, dry_pallet_capacity: 100, cold_pallet_capacity: 50, frozen_pallet_capacity: 20, monitor_policy: "TURNOVER_BASED" }
              as: StateAdmin
              captures: { wh: $.data.id }
            - call: "POST /efap/service-areas"
              payload: { name: "Area North", county_code: "C001", poverty_population: 40000, urban_rural: "URBAN" }
              as: StateAdmin
              captures: { sa: $.data.id }
          trigger:
            - call: "POST /efap/agencies"
              payload: { name: "Agency Alpha", service_area_id: "${sa}", cold_storage_pallet_capacity: 10 }
              as: StateAdmin
              captures: { ag: $.data.id }
            - call: "POST /efap/inventory-lots"
              payload: { commodity_id: "${cm_rice}", warehouse_id: "${wh}", federal_lot_code: "FL-1001", cases_received: 100, pack_date: "2026-07-01", best_by_date: "2028-01-01" }
              as: StateAdmin
              captures: { lot1: $.data.id }
            - call: "POST /efap/allocation-cycles"
              payload: { cycle_code: "FY27A", formula_variant: "STANDARD", allocatable_cases: 1000, admin_funds_pool_cents: 5000000, offered_commodity_codes: ["BULK_RICE"], order_window_open_at: "2026-08-05T00:00:00Z", order_window_close_at: "2026-08-20T00:00:00Z" }
              as: StateAdmin
              captures: { cy: $.data.id }
          assert:
            - "Agency.${ag}.agreement_status == PENDING and training_status == REQUIRED and eligibility_posture == INELIGIBLE"
            - "Agency.${ag}.agency_cases_on_hand == 0 and delivered_cases_ytd == 0 and renewal_count == 0"
            - "InventoryLot.${lot1}.status == RECEIVED and cases_on_hand == 0 and posted_at == null"
            - "AllocationCycle.${cy}.status == DRAFT and draw_posture == NOT_STARTED and total_allocated_cases == 0 and eligible_agency_count == 0"
            - "every row returns version == 1"

      - name: posting_a_received_lot_moves_it_to_available_and_seeds_cases_on_hand
        claim_type: valid_transition
        grounds:
          - state_machines.InventoryLot.RECEIVED_to_AVAILABLE
          - endpoints.POST_/efap/inventory-lots/{inventory_lot_id}/post
        distinguishing_aspect: "The post transition is the only writer of cases_on_hand from cases_received and of posted_at from the logical clock: after posting a 100-case lot, cases_on_hand is 100 while cases_shipped_to_date stays 0, posted_at equals the clock instant 2026-08-02T09:00:00Z (not the creation instant), and version goes 1 -> 2."
        test_recipe:
          setup:
            - "Lot created at 2026-08-01T00:00:00Z, then the clock advanced to 2026-08-02T09:00:00Z before posting."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/commodities"
              payload: { code: "BULK_RICE", name: "Bulk Rice", storage_class: "DRY", net_weight_lbs_per_case: 20.0, cases_per_pallet: 50, entitlement_value_cents_per_case: 1200, shelf_life_days: 900, excess_case_ceiling: 500 }
              as: StateAdmin
              captures: { cm_rice: $.data.id }
            - call: "POST /efap/warehouses"
              payload: { name: "WH North", dock_count: 2, dry_pallet_capacity: 100, cold_pallet_capacity: 50, frozen_pallet_capacity: 20, monitor_policy: "TURNOVER_BASED" }
              as: StateAdmin
              captures: { wh: $.data.id }
            - call: "POST /efap/inventory-lots"
              payload: { commodity_id: "${cm_rice}", warehouse_id: "${wh}", federal_lot_code: "FL-1001", cases_received: 100, pack_date: "2026-07-01", best_by_date: "2028-01-01" }
              as: StateAdmin
              captures: { lot1: $.data.id }
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: StateAdmin
          trigger:
            - call: "POST /efap/inventory-lots/${lot1}/post"
              payload: {}
              as: StateAdmin
          assert:
            - "HTTP 200 and InventoryLot.${lot1}.status == AVAILABLE"
            - "InventoryLot.${lot1}.cases_on_hand == 100 and cases_committed == 0 and cases_shipped_to_date == 0"
            - "InventoryLot.${lot1}.posted_at == 2026-08-02T09:00:00Z"
            - "InventoryLot.${lot1}.version == 2"
            - "monitor_flag is still NONE and slow_moving_index is still 0.0 (posting does not score the lot)"

      - name: posting_an_already_posted_lot_returns_invalid_lot_state
        claim_type: idempotency
        grounds:
          - state_machines.InventoryLot.RECEIVED_to_AVAILABLE
          - errors.ERR_INVALID_LOT_STATE
          - validations.priority_8
        distinguishing_aspect: "Posting is not idempotent: the second post must fail with 409 ERR_INVALID_LOT_STATE and must leave cases_on_hand at 100 rather than re-seeding it to 200, so a duplicated ops action cannot double the state's inventory."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one 100-case BULK_RICE lot already posted at WH North."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/commodities"
              payload: { code: "BULK_RICE", name: "Bulk Rice", storage_class: "DRY", net_weight_lbs_per_case: 20.0, cases_per_pallet: 50, entitlement_value_cents_per_case: 1200, shelf_life_days: 900, excess_case_ceiling: 500 }
              as: StateAdmin
              captures: { cm_rice: $.data.id }
            - call: "POST /efap/warehouses"
              payload: { name: "WH North", dock_count: 2, dry_pallet_capacity: 100, cold_pallet_capacity: 50, frozen_pallet_capacity: 20, monitor_policy: "TURNOVER_BASED" }
              as: StateAdmin
              captures: { wh: $.data.id }
            - call: "POST /efap/inventory-lots"
              payload: { commodity_id: "${cm_rice}", warehouse_id: "${wh}", federal_lot_code: "FL-1001", cases_received: 100, pack_date: "2026-07-01", best_by_date: "2028-01-01" }
              as: StateAdmin
              captures: { lot1: $.data.id }
            - call: "POST /efap/inventory-lots/${lot1}/post"
              payload: {}
              as: StateAdmin
          trigger:
            - call: "POST /efap/inventory-lots/${lot1}/post"
              payload: {}
              as: StateAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409 and response.data.error_id == ERR_INVALID_LOT_STATE"
            - "InventoryLot.${lot1}.cases_on_hand == 100 (unchanged) and status == AVAILABLE"
            - "InventoryLot.${lot1}.version == 2 (the refused write did not bump the version)"

      - name: open_window_on_a_draft_cycle_returns_invalid_cycle_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.AllocationCycle.ALLOCATED_to_OPEN
          - errors.ERR_INVALID_CYCLE_STATE
        distinguishing_aspect: "DRAFT admits only compute-allocations: open-window, close-window and finalize on a DRAFT cycle must each return 409 ERR_INVALID_CYCLE_STATE and leave status DRAFT, so a window can never open over an un-computed entitlement table."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one DRAFT cycle, no compute-allocations run."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/commodities"
              payload: { code: "BULK_RICE", name: "Bulk Rice", storage_class: "DRY", net_weight_lbs_per_case: 20.0, cases_per_pallet: 50, entitlement_value_cents_per_case: 1200, shelf_life_days: 900, excess_case_ceiling: 500 }
              as: StateAdmin
              captures: { cm_rice: $.data.id }
            - call: "POST /efap/allocation-cycles"
              payload: { cycle_code: "FY27A", formula_variant: "STANDARD", allocatable_cases: 1000, admin_funds_pool_cents: 5000000, offered_commodity_codes: ["BULK_RICE"], order_window_open_at: "2026-08-05T00:00:00Z", order_window_close_at: "2026-08-20T00:00:00Z" }
              as: StateAdmin
              captures: { cy: $.data.id }
          trigger:
            - call: "POST /efap/allocation-cycles/${cy}/open-window"
              payload: {}
              as: StateAdmin
              captures: { e1: "$.data.error_id" }
            - call: "POST /efap/allocation-cycles/${cy}/close-window"
              payload: {}
              as: StateAdmin
              captures: { e2: "$.data.error_id" }
            - call: "POST /efap/allocation-cycles/${cy}/finalize"
              payload: {}
              as: StateAdmin
              captures: { e3: "$.data.error_id" }
          assert:
            - "all three calls: HTTP 409 with response.data.error_id == ERR_INVALID_CYCLE_STATE"
            - "AllocationCycle.${cy}.status == DRAFT and allocation_locked_at == null and version == 1"
            - "GET /efap/allocation-cycles/${cy}/allocations returns total_count == 0"

      - name: a_cancelled_order_cannot_be_submitted_or_cancelled_again
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.CommodityOrder.terminal_states
          - errors.ERR_INVALID_ORDER_STATE
        distinguishing_aspect: "CANCELLED is terminal for CommodityOrder: submit, return-for-revision, approve and a second cancel must all return 409 ERR_INVALID_ORDER_STATE, and cancel_reason must stay at the value written by the first cancel (WITHDRAWN) rather than being overwritten by the second attempt (DUPLICATE)."
        test_recipe:
          setup:
            - "Cycle OPEN at clock 2026-08-06T00:00:00Z with one ELIGIBLE agency; one DRAFT order carrying a 10-case BULK_RICE line, then cancelled with reason WITHDRAWN."
