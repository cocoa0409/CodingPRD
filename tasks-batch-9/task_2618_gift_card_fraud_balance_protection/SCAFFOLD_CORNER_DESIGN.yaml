          assert:
            - "${p_state0} == OPEN and ${p_state1} == CLOSED and ${prov1} == 0"
            - "${pv1} == ${pv0} + 1"
            - "first trigger call: HTTP status == 412 and ${err1} == ERR_STALE_PERIOD_VERSION"
            - "after the first rejection, LiabilityPeriod.${period_id}.state == CLOSED and restatement_count == 0 and version == ${pv1}"
            - "second trigger call: HTTP status == 200 and ${p_state2} == RESTATED and ${rc2} == 1 and ${final2} == 0"
            - "${pv2} == ${pv1} + 1"
            - "third trigger call: HTTP status == 412 and ${err2} == ERR_STALE_PERIOD_VERSION — the same version that just worked is now superseded"
            - "fourth trigger call: HTTP status == 200 and ${p_state3} == RESTATED and ${rc3} == 2 — the self-loop is legal, the stale read was not"
            - "${pv3} == ${pv2} + 1"
            - "LiabilityPeriod.${period_id}.provisional_reserve_cents == 0 — restatement never overwrites the provisional figure"

      - name: inquiry_velocity_window_resets_once_the_clock_slides_past_it
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.inquiry_velocity_count
          - calculations.card_drain_risk_score
          - entities.RiskPolicy.fields.inquiry_velocity_window_minutes
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The velocity counter is a sliding window, not a lifetime tally: four inquiries at 00:00 report counts 1,2,3,4 and drive the posture to WATCH at a score of 48, but after the clock moves to 02:00 — beyond inquiry_velocity_window_minutes 60 — the fifth inquiry reports velocity 1 and a score of 12, still fires no alert, and does not walk the posture back down because scoring never de-escalates."
        test_recipe:
          setup:
            - "One RetailStore, one INTACT CardRack, one ACTIVE PHYSICAL GiftCard with face value 10000 cents and no redemptions, so drawdown_ratio is 0.00 and distinct_merchant_count is 0 and the inquiry score reduces to 12 * velocity_count."
