        distinguishing_aspect: |
          WarrantyClaim is CYCLIC: SUBMITTED -> INFO_REQUESTED -> SUBMITTED runs twice and
          the third entry is refused with ERR_INFO_REQUEST_LIMIT at info_request_count == 2,
          so the loop terminates on a counter rather than on a state.
