scaffold_corner_design:

  # =====================================================================
  # SECTION: entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_customer_missing_required_email_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Customer.fields.email
          - endpoints[POST /customers]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=19]
        distinguishing_aspect: "POST /customers without `email` in payload rejects with ERR_INVALID_REQUEST (priority 19)."
        test_recipe:
          setup:
            - "Clock at 2026-03-01T00:00:00Z (default startup)."
          setup_api_calls: []
          trigger:
            - call: "POST /api/customers"
              payload: { full_name: "Missing Email" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_REQUEST'"

      - name: get_sku_non_existent_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /skus/{id}]
          - errors[ERR_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET /skus/{id} with a well-formed UUID that no Sku row uses returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Clock at default."
          setup_api_calls: []
          trigger:
            - call: "GET /api/skus/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_NOT_FOUND'"

      - name: create_sku_computed_on_hand_qty_defaults_to_zero_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Sku.fields.on_hand_qty
          - endpoints[POST /skus]
        distinguishing_aspect: "on_hand_qty is source=computed; a client cannot POST it — the created SKU always has on_hand_qty=0 regardless of any client-attempted value (unknown-field rejected by input schema)."
        test_recipe:
          setup:
            - "Clock at default."
          setup_api_calls: []
          trigger:
            - call: "POST /api/skus"
              payload: { sku_code: "COMP-01", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { on_hand: $.data.on_hand_qty, reserved: $.data.reserved_qty, clearance: $.data.is_clearance }
          assert:
            - "on_hand == 0"
            - "reserved == 0"
            - "clearance == false"

      - name: create_sku_invalid_enum_category_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Sku.fields.category
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "category value outside declared enum rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Clock at default."
          setup_api_calls: []
          trigger:
            - call: "POST /api/skus"
              payload: { sku_code: "BAD-01", category: "SNACKS", unit_price_cents: 100 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_REQUEST'"

  # =====================================================================
  # SECTION: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: reserve_from_reserved_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Order.DRAFT_to_RESERVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Reserving an already-RESERVED Order returns ERR_INVALID_STATE (from-state mismatch)."
        test_recipe:
          setup:
            - "Clock at 2026-06-15T10:00:00Z. Customer + SKU + Order with one line reserved successfully."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "aa@ex.com", full_name: "AA" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "S-A", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku: $.data.id }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 5 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust}", channel: "IN_STORE", lines: [{ sku_id: "${sku}", qty: 1 }] }
              as: StoreClerk
              captures: { ord: $.data.id, ord_v: $.data.version }
            - call: "POST /api/orders/${ord}/reserve"
              payload: { expected_order_version: "${ord_v}" }
              as: StoreClerk
              captures: { ord_v_after: $.data.version }
          trigger:
            - call: "POST /api/orders/${ord}/reserve"
              payload: { expected_order_version: "${ord_v_after}" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"

      - name: cancel_from_cancelled_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Order
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an already-CANCELLED Order rejects — CANCELLED is terminal."
        test_recipe:
          setup:
            - "Order DRAFT then cancelled."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "bb@ex.com", full_name: "BB" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "S-B", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku: $.data.id }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 5 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust}", channel: "IN_STORE", lines: [{ sku_id: "${sku}", qty: 1 }] }
              as: StoreClerk
              captures: { ord: $.data.id }
            - call: "POST /api/orders/${ord}/cancel"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /api/orders/${ord}/cancel"
              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_STATE'"

      - name: order_initial_state_is_draft_unpaid
        claim_type: initial_state
        grounds:
          - state_machines.Order
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.payment_status
        distinguishing_aspect: "Newly-created Order has fulfillment_status=DRAFT and payment_status=UNPAID."
        test_recipe:
          setup:
            - "Clock at 2026-03-01T00:00:00Z. Customer + SKU exist."
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "cc@ex.com", full_name: "CC" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "S-C", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku: $.data.id }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 5 }
              as: StoreManager
          trigger:
            - call: "POST /api/orders"
              payload: { customer_id: "${cust}", channel: "IN_STORE", lines: [{ sku_id: "${sku}", qty: 1 }] }
              as: StoreClerk
              captures: { f: $.data.fulfillment_status, p: $.data.payment_status }
          assert:
            - "f == 'DRAFT'"
            - "p == 'UNPAID'"

      - name: no_show_sweep_cancels_ready_orders_past_pickup_deadline
        claim_type: side_effect_execution
        grounds:
          - state_machines.Order.READY_FOR_PICKUP_to_CANCELLED
          - endpoints[POST /_clock/set_current_utc]
          - entities.Order.fields.pickup_deadline
        distinguishing_aspect: "Advancing clock past Order.pickup_deadline triggers the no-show sweep: fulfillment_status flips READY_FOR_PICKUP -> CANCELLED and payment_status flips to REFUNDED."
        test_recipe:
          setup:
            - "BOPIS Order reserved + paid FULL + start-picking + mark-ready. pickup_window_end=2026-06-15T18:00:00Z → pickup_deadline=2026-06-17T18:00:00Z. Clock is 2026-06-15."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "dd@ex.com", full_name: "DD" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "S-D", category: "DECOR", unit_price_cents: 300 }
              as: StoreManager
              captures: { sku: $.data.id }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 5 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust}", channel: "BOPIS", lines: [{ sku_id: "${sku}", qty: 1 }], pickup_window_start: "2026-06-15T14:00:00Z", pickup_window_end: "2026-06-15T18:00:00Z" }
              as: StoreClerk
              captures: { ord: $.data.id, ord_v: $.data.version }
            - call: "POST /api/orders/${ord}/reserve"
              payload: { expected_order_version: "${ord_v}" }
              as: StoreClerk
            - call: "POST /api/orders/${ord}/pay"
              payload: { mode: "FULL" }
              as: StoreClerk
            - call: "POST /api/orders/${ord}/start-picking"
              payload: {}
              as: StoreClerk
            - call: "POST /api/orders/${ord}/mark-ready"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-18T00:00:00Z" }
              as: StoreClerk
            - call: "GET /api/orders/${ord}"
              payload: {}
              as: StoreClerk
              captures: { after_sweep_ff: $.data.fulfillment_status, after_sweep_pay: $.data.payment_status }
          assert:
            - "after_sweep_ff == 'CANCELLED'"
            - "after_sweep_pay == 'REFUNDED'"

      - name: cyclic_revision_limit_exceeded_returns_revision_limit
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CustomPrintOrder.PROOF_SENT_to_REVISION_REQUESTED
          - validations[priority=16]
          - errors[ERR_REVISION_LIMIT]
        distinguishing_aspect: "Fourth request-revision attempt (revision_count already 3) is rejected."
        test_recipe:
          setup:
            - "Clock at 2026-06-15. Customer + Order + CustomPrintOrder banner=8. Order paid FULL. Loop send-proof / request-revision three times → revision_count=3, status=REVISION_REQUESTED after last request-revision. Then send-proof again to reach PROOF_SENT with revision_count=3."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "ee@ex.com", full_name: "EE" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "S-E", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku: $.data.id }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 5 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust}", channel: "IN_STORE", lines: [{ sku_id: "${sku}", qty: 1 }] }
              as: StoreClerk
              captures: { ord: $.data.id, ord_v: $.data.version }
            - call: "POST /api/orders/${ord}/custom-print"
              payload: { art_reference: "https://a", banner_length_ft: 8 }
              as: StoreClerk
              captures: { cpo: $.data.id }
            - call: "POST /api/orders/${ord}/reserve"
              payload: { expected_order_version: "${ord_v}" }
              as: StoreClerk
            - call: "POST /api/orders/${ord}/pay"
              payload: { mode: "FULL" }
              as: StoreClerk
            - call: "POST /api/custom-print-orders/${cpo}/send-proof"
              payload: {}
              as: StoreClerk
            - call: "POST /api/custom-print-orders/${cpo}/request-revision"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /api/custom-print-orders/${cpo}/send-proof"
              payload: {}
              as: StoreClerk
            - call: "POST /api/custom-print-orders/${cpo}/request-revision"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /api/custom-print-orders/${cpo}/send-proof"
              payload: {}
              as: StoreClerk
            - call: "POST /api/custom-print-orders/${cpo}/request-revision"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /api/custom-print-orders/${cpo}/send-proof"
              payload: {}
              as: StoreClerk
              captures: { revs_now: $.data.revision_count, status_now: $.data.status }
          trigger:
            - call: "POST /api/custom-print-orders/${cpo}/request-revision"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "revs_now == 3"
            - "status_now == 'PROOF_SENT'"
            - "err == 'ERR_REVISION_LIMIT'"

      - name: unclear_sku_flips_is_clearance_and_zeroes_pct
        claim_type: side_effect_execution
        grounds:
          - state_machines.Sku
          - entities.Sku.fields.is_clearance
          - entities.Sku.fields.clearance_pct
        distinguishing_aspect: "POST /skus/{id}/unclear transitions is_clearance=true -> false and clearance_pct back to 0."
        test_recipe:
          setup:
            - "Clock at default. One SKU marked clearance pct=0.15."
          setup_api_calls:
            - call: "POST /api/skus"
              payload: { sku_code: "CL-01", category: "DECOR", unit_price_cents: 500 }
              as: StoreManager
              captures: { sku: $.data.id }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 5 }
              as: StoreManager
              captures: { sku_v1: $.data.version }
            - call: "POST /api/skus/${sku}/clearance"
              payload: { pct: 0.15, expected_sku_version: "${sku_v1}" }
              as: StoreManager
              captures: { sku_v2: $.data.version, is_cl_before: $.data.is_clearance, pct_before: $.data.clearance_pct }
          trigger:
            - call: "POST /api/skus/${sku}/unclear"
              payload: {}
              as: StoreManager
              captures: { is_cl_after: $.data.is_clearance, pct_after: $.data.clearance_pct }
          assert:
            - "is_cl_before == true"
            - "pct_before == 0.15"
            - "is_cl_after == false"
            - "pct_after == 0"

      - name: event_forfeit_sweep_at_less_than_7_days_lead
        claim_type: side_effect_execution
        grounds:
          - state_machines.EventBooking
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Advancing clock past (event_date - 7 days) with an EventBooking still HELD triggers the FORFEITED sweep."
        test_recipe:
          setup:
            - "Clock 2026-06-15. Customer + Order + EventBooking HELD for event_date 2026-06-25 (10 days ahead)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "ff@ex.com", full_name: "FF" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "S-F", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku: $.data.id }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 5 }
              as: StoreManager
            - call: "POST /api/event-packages"
              payload: { package_code: "GALA-50", base_price_cents: 30000, deposit_pct: 0.25, min_lead_days: 7 }
              as: StoreManager
              captures: { pkg: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust}", channel: "IN_STORE", lines: [{ sku_id: "${sku}", qty: 1 }] }
              as: StoreClerk
              captures: { ord: $.data.id }
            - call: "POST /api/event-bookings"
              payload: { order_id: "${ord}", event_package_id: "${pkg}", event_date: "2026-06-25T18:00:00Z" }
              as: StoreClerk
              captures: { booking: $.data.id, status_before: $.data.status }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: StoreClerk
            - call: "GET /api/event-bookings/${booking}"
              payload: {}
              as: StoreClerk
              captures: { status_after: $.data.status }
          assert:
            - "status_before == 'HELD'"
            - "status_after == 'FORFEITED'"

  # =====================================================================
  # SECTION: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: event_deposit_pinned_at_creation_matches_pct_formula
        claim_type: correct_result
        grounds:
          - calculations.event_deposit
          - entities.EventBooking.fields.deposit_cents
        distinguishing_aspect: "For base_price=20000, deposit_pct=0.30, deposit_cents == 6000 pinned at creation."
        test_recipe:
          setup:
            - "Clock 2026-06-15. Customer + SKU + Order + EventPackage (base=20000, pct=0.30)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "gg@ex.com", full_name: "GG" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "S-G", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku: $.data.id }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 5 }
              as: StoreManager
            - call: "POST /api/event-packages"
              payload: { package_code: "GRAD-20", base_price_cents: 20000, deposit_pct: 0.30, min_lead_days: 7 }
              as: StoreManager
              captures: { pkg: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust}", channel: "IN_STORE", lines: [{ sku_id: "${sku}", qty: 1 }] }
              as: StoreClerk
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /api/event-bookings"
              payload: { order_id: "${ord}", event_package_id: "${pkg}", event_date: "2026-07-30T18:00:00Z" }
              as: StoreClerk
              captures: { dep: $.data.deposit_cents }
          assert:
            - "dep == 6000"

      - name: delivery_fee_weekend_with_setup_included
        claim_type: correct_result
        grounds:
          - calculations.delivery_fee
          - calculations.delivery_fee.constants.BASE_FEE_CENTS
          - calculations.delivery_fee.constants.SETUP_FEE_CENTS
          - calculations.delivery_fee.constants.WEEKEND_SURCHARGE_CENTS
        distinguishing_aspect: "For a Sunday DeliverySlot with setup_included=true: base 2500 + setup 1500 + weekend 1000 = 5000."
        test_recipe:
          setup:
            - "Clock 2026-06-15. Customer + SKU. Create a Sunday DeliverySlot 2026-06-21T10:00Z–12:00Z on van V-SUN with setup_included=true."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: StoreManager
            - call: "POST /api/customers"
              payload: { email: "hh@ex.com", full_name: "HH" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "S-H", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku: $.data.id }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 5 }
              as: StoreManager
            - call: "POST /api/delivery-slots"
              payload: { window_start: "2026-06-21T10:00:00Z", window_end: "2026-06-21T12:00:00Z", van_id: "V-SUN", setup_included: true }
              as: StoreClerk
              captures: { slot: $.data.id }
            - call: "POST /api/orders"
              payload: { customer_id: "${cust}", channel: "DELIVERY", lines: [{ sku_id: "${sku}", qty: 1 }], delivery_slot_id: "${slot}" }
              as: StoreClerk
              captures: { ord: $.data.id, ord_v: $.data.version }
          trigger:
            - call: "POST /api/orders/${ord}/reserve"
              payload: { expected_order_version: "${ord_v}" }
              as: StoreClerk
              captures: { fee: $.data.delivery_fee_cents }
          assert:
            - "fee == 5000"

      - name: helium_waterfall_allocates_oldest_active_tank_first
        claim_type: correct_result
        grounds:
          - calculations.helium_tank_waterfall_allocation
          - entities.HeliumOrder.fields.helium_tank_ids
          - entities.HeliumTank.fields.remaining_cubic_ft
        distinguishing_aspect: "Two ACTIVE tanks: tank T1 created first (capacity 10), tank T2 created second (capacity 50). HeliumOrder needing 20 cu.ft consumes ALL 10 from T1 first, then 10 from T2. helium_tank_ids order reflects created_at ASC."
        test_recipe:
          setup:
            - "Clock 2026-06-15. Two tanks created in order — T1 capacity 10 at 2026-06-15T09:00Z, T2 capacity 50 at 2026-06-15T09:30Z."
            - "Order DRAFT with HeliumOrder latex=20, foil=4 → required 20*0.5 + 4*1.5 = 16 cu.ft; but for a cleaner test use latex=20, foil=6 → 20*0.5 + 6*1.5 = 19 (still doesn't neatly split)."
            - "Author-computed values: latex=40, foil=0 → required = 20 cu.ft. T1 drains fully (10), T2 drains 10 → T1 remaining=0, T2 remaining=40."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T09:00:00Z" }
              as: StoreManager
            - call: "POST /api/helium-tanks"
              payload: { tank_code: "T1", capacity_cubic_ft: 10 }
              as: StoreManager
              captures: { t1: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T09:30:00Z" }
              as: StoreManager
            - call: "POST /api/helium-tanks"
              payload: { tank_code: "T2", capacity_cubic_ft: 50 }
              as: StoreManager
              captures: { t2: $.data.id }
            - call: "POST /api/customers"
              payload: { email: "ii@ex.com", full_name: "II" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /api/skus"
              payload: { sku_code: "S-I", category: "DECOR", unit_price_cents: 100 }
              as: StoreManager
              captures: { sku: $.data.id }
            - call: "POST /api/skus/${sku}/restock"
              payload: { delta: 5 }
              as: StoreManager
            - call: "POST /api/orders"
              payload: { customer_id: "${cust}", channel: "IN_STORE", lines: [{ sku_id: "${sku}", qty: 1 }] }
              as: StoreClerk
              captures: { ord: $.data.id, ord_v: $.data.version }
