              as_user_id: st_1
              captures: { rep1: "$.data.id" }
            - call: "POST /api/locals/${loc}/per-capita-reports"
              payload: { period: "2026-08", expected_local_version: "${loc_v}" }
              as: SecretaryTreasurer
              as_user_id: st_1
              captures: { err: "$.data.error_id" }
          assert:
            - "first create succeeds: ${rep1} is a UUID (Local.version now 2)"
            - "stale replay with ${loc_v} == 1: ${err} == ERR_STALE_LOCAL_VERSION (412)"

      - name: percapita_draft_supersede_with_fresh_version
        claim_type: optimistic_concurrency
        grounds: [state_machines.PerCapitaReport.DRAFT_to_SUPERSEDED, "concurrency_rules[percapita-report-create-stale-local]"]
        distinguishing_aspect: "The create-with-supersede semantic itself: with a FRESH Local.version the second DRAFT for the same period succeeds and the first DRAFT flips to SUPERSEDED."
        test_recipe:
          setup: ["PCT local; first DRAFT report for 2026-08 created (Local.version now 2)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ParentBodyAdmin }
            - call: "POST /api/locals"
