        grounds: [calculations.studio_kit_ledger]
        excluded_because:
          difficulty_instance: compensating_invariant / ci_kit_conservation_on_void
          rationale: "Kit-ledger recompute on consume and on void-restore is asserted by the named §1.8 kit-conservation instance."

      - name: ccl_cascading_side_effects_license_suspend
        claim_type: cascading_side_effects
        grounds: [state_machines.Technician.LICENSE_ACTIVE_to_LICENSE_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / tc_license_suspend_void_kit_deposit_posture_depth3
          rationale: "The 3-level cascade (suspend -> void -> kit/deposit/posture) is the named §1.8 transitive-cascade instance."

