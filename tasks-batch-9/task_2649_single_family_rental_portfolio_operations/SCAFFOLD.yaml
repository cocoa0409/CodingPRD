scenario: |
  Generate task harder than expert level!

  2649. Single-Family Rental Portfolio Operations (Invitation Homes style operator): acquisition
  underwriting on scattered-site homes with renovation scope and rent estimates, renovation project
  management across many vendors with standardized scopes, leasing through self-showing technology
  with identity verification and fraud controls, resident screening, pet policy and lease terms
  standardized across markets, maintenance dispatch with in-house technicians versus vendor networks
  and cost benchmarking, turn management with make-ready cycle time targets, property tax appeals,
  insurance and homeowner association compliance across thousands of properties, disposition
  decisions on individual assets versus portfolio sales

domain_name: sfr-portfolio-ops
api_prefix: "/"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Peer entities linked by foreign keys plus a many-to-many trade-certification fabric
  # (Vendor x certification_code x ScopeTemplate.certification_code) and a self-referential
  # ComplianceObligation renewal chain (supersedes_obligation_id). No single ownership tree:
  # Home, Vendor, Prospect and ScopeTemplate are independent roots that meet inside WorkOrder,
  # ShowingSlot, RentalApplication and ComplianceObligation.

  state_machine_shape: cyclic
  # UnderwritingCase cycles SUBMITTED -> REVISION_REQUESTED -> DRAFT -> SUBMITTED (bounded by
  # revision_round), ComplianceObligation cycles RESOLUTION_SUBMITTED -> RESOLUTION_REJECTED ->
  # PLANNED -> RESOLUTION_SUBMITTED, Home.occupancy_status cycles VACANT -> RESERVED -> VACANT,
  # ShowingSlot cycles AVAILABLE -> BLOCKED_BY_POSTURE -> AVAILABLE, and WorkOrder forks at
  # dispatch (VENDOR -> DISPATCHED vs IN_HOUSE -> IN_PROGRESS) then rejoins at COMPLETED.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The AcquisitionAnalyst X-User-ID that submitted an UnderwritingCase may not appear as the
  # InvestmentCommittee X-User-ID on its decision; the ComplianceOfficer X-User-ID that submitted
  # an obligation resolution may not review it. Peer ownership is layered on top: Vendor acts only
  # on WorkOrders assigned to its own vendor row, Prospect only on its own bookings/applications.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Market
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Short market code such as ATL
        constraints: unique across Market; 2-6 uppercase letters
      - name: name
        type: string
        source: input
        description: Human readable market name
      - name: tax_jurisdiction_code
        type: string
        source: input
        description: Taxing authority code used on property tax appeals
      - name: millage_bps
        type: integer
        source: input
        description: Annual property tax rate in basis points applied to Home.assessed_value_cents
        constraints: 1..3000
      - name: rent_index_cents
        type: integer
        source: input
        description: Market median monthly rent in cents; default asking rent and the income-coverage denominator basis
        constraints: ">= 1"
      - name: cost_index_bps
        type: integer
        source: input
        description: Market cost multiplier in basis points applied to ScopeTemplate.benchmark_unit_cost_cents
        constraints: 5000..20000
      - name: cost_variance_tolerance_bps
        type: integer
        source: input
        description: Maximum allowed WorkOrder.variance_bps above benchmark before the work order is rejected
        constraints: 0..10000
      - name: make_ready_target_days
        type: integer
        source: input
        description: Target make-ready cycle time in whole days from turn_started_on to rent_ready_on
        constraints: ">= 1"
      - name: turn_holdback_cap_bps
        type: integer
        source: input
        description: Cap on turn holdback expressed in basis points of RenovationProject.gross_turn_cost_cents
        constraints: 0..10000
      - name: showing_buffer_minutes
        type: integer
        source: input
        description: Lockbox re-code buffer in minutes appended after every ShowingSlot interval for overlap arithmetic
        constraints: 0..240
      - name: min_showing_duration_minutes
        type: integer
        source: input
        description: Minimum ShowingSlot duration in minutes (ends_at minus starts_at)
        constraints: ">= 5"
      - name: pet_deposit_per_pet_cents
        type: integer
        source: input
        description: Pet deposit charged per pet before the cap is applied
      - name: pet_deposit_cap_cents
        type: integer
        source: input
        description: Hard cap on total pet deposit regardless of pet count
      - name: max_pets
        type: integer
        source: input
        description: Maximum pets permitted per RentalApplication in this market
        constraints: ">= 0"
      - name: restricted_breeds
        type: array
        source: input
        description: Array of uppercase breed tokens forbidden by the standardized market pet policy
      - name: standard_lease_term_months
        type: integer
        source: input
        description: Standardized lease term used when RentalApplication.lease_term_months is omitted
        constraints: ">= 1"
      - name: fraud_block_threshold_bps
        type: integer
        source: input
        description: Prospect.fraud_risk_score_bps strictly above this value blocks self-showing booking and screening approval
        constraints: 0..10000
      - name: rent_to_income_max_bps
        type: integer
        source: input
        description: Maximum rent-to-income ratio in basis points accepted by screening
        constraints: 0..10000
      - name: vacancy_loss_bps
        type: integer
        source: input
        description: Vacancy loss deducted from gross annual rent when computing effective gross income
        constraints: 0..10000
      - name: bad_debt_bps
        type: integer
        source: input
        description: Bad debt loss deducted from gross annual rent when computing effective gross income
        constraints: 0..10000
      - name: mgmt_fee_bps
        type: integer
        source: input
        description: Property management fee in basis points of effective gross income
        constraints: 0..10000
      - name: underwriting_yield_floor_bps
        type: integer
        source: input
        description: Minimum underwritten_yield_on_cost_bps required to approve an UnderwritingCase
        constraints: 0..10000
      - name: disposition_yield_floor_bps
        type: integer
        source: input
        description: Realized yield floor below which a Home is flagged for disposition review
        constraints: 0..10000
      - name: max_rent_concession_bps
        type: integer
        source: input
        description: Maximum discount in basis points a Lease monthly rent may sit below Home.asking_rent_cents
        constraints: 0..10000

  - name: ScopeTemplate
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Standardized scope code such as PAINT_INT or HVAC_REPLACE
        constraints: unique across ScopeTemplate
      - name: name
        type: string
        source: input
        description: Human readable scope name
      - name: certification_code
        type: string
        source: input
        description: Trade certification token a Vendor must hold (matched against VendorCertification.certification_code) to receive this scope
      - name: unit
        type: enum
        source: input
        description: Quantity unit for this scope
        constraints: HOME | SYSTEM | SQFT | EACH
      - name: benchmark_unit_cost_cents
        type: integer
        source: input
        description: National benchmark cost per unit in cents before the market cost index is applied
        constraints: ">= 1"
      - name: default_crew_size
        type: integer
        source: input
        description: Default number of crew members per day for this scope
        constraints: ">= 1"
      - name: default_crew_days
        type: integer
        source: input
        description: Default number of on-site days for this scope
        constraints: ">= 1"
      - name: safety_critical
        type: boolean
        source: input
        description: When true the scope may not be fulfilled by the IN_HOUSE channel and requires a certified vendor
        default: false

  - name: Home
    parent: null
    common_fields: true
    fields:
      - name: market_id
        type: string
        source: input
        description: FK -> Market.id; the market whose standardized policy, benchmarks and tax millage govern this home
      - name: address_line1
        type: string
        source: input
        description: Street address of the scattered-site home
      - name: city
        type: string
        source: input
        description: City
      - name: state_code
        type: string
        source: input
        description: Two-letter state code
      - name: postal_code
        type: string
        source: input
        description: Postal code
      - name: bedrooms
        type: integer
        source: input
        description: Bedroom count
      - name: bathrooms
        type: number
        source: input
        description: Bathroom count, halves allowed
      - name: square_feet
        type: integer
        source: input
        description: Heated square footage
      - name: year_built
        type: integer
        source: input
        description: Year of construction
      - name: assessed_value_cents
        type: integer
        source: input
        description: Current assessed value used for property tax; overwritten when a PROPERTY_TAX_APPEAL obligation resolves
      - name: asking_rent_cents
        type: integer
        source: input
        description: Published asking rent; defaults to Market.rent_index_cents when omitted at creation
      - name: insurance_carrier_name
        type: string
        source: input
        description: Current property insurance carrier
      - name: insurance_annual_premium_cents
        type: integer
        source: input
        description: Annual insurance premium in cents, an operating expense in yield-on-cost
      - name: insurance_binder_expires_on
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) on which the insurance binder lapses; a lapsed binder forces leasing_posture FROZEN
      - name: hoa_name
        type: string
        source: input
        description: Homeowner association name, empty string when the home is not in an association
        default: ""
      - name: hoa_annual_cents
        type: integer
        source: input
        description: Annual HOA dues in cents, an operating expense in yield-on-cost
        default: 0
      - name: property_tax_annual_cents
        type: integer
        source: computed
        description: round_half_up(assessed_value_cents * Market.millage_bps / 10000); recomputed whenever assessed_value_cents changes
      - name: asset_status
        type: enum
        source: system
        description: Acquisition/disposition lifecycle dimension, independent of occupancy_status
        default: PIPELINE
        constraints: PIPELINE | PASSED | ACQUIRED | RENOVATING | STABILIZED | DISPOSITION_APPROVED | DISPOSED
      - name: occupancy_status
        type: enum
        source: system
        description: Occupancy lifecycle dimension, independent of asset_status
        default: VACANT
        constraints: VACANT | RESERVED | OCCUPIED
      - name: leasing_posture
        type: enum
        source: computed
        description: Derived gate over the whole leasing funnel, recomputed by calculations.home_leasing_posture on every mutation of its inputs and re-derived at read time
        constraints: OPEN | RESTRICTED | FROZEN
      - name: booked_showing_count
        type: integer
        source: computed
        description: Count of ShowingSlot rows on this home whose status is BOOKED
        default: 0
      - name: disposition_mode
        type: enum
        source: system
        description: Disposition channel chosen by the investment committee, NONE until a sale is approved
        default: NONE
        constraints: NONE | INDIVIDUAL | PORTFOLIO_LOT
      - name: lot_code
        type: string
        source: input
        description: Portfolio sale lot grouping code; empty string unless disposition_mode is PORTFOLIO_LOT
        default: ""
      - name: bpo_value_cents
        type: integer
        source: input
        description: Broker price opinion value recorded when a sale is approved; 0 before that
        default: 0
      - name: net_sale_proceeds_cents
        type: integer
        source: input
        description: Net proceeds recorded when the sale closes; 0 before that
        default: 0
      - name: realized_gain_cents
        type: integer
        source: computed
        description: net_sale_proceeds_cents minus the approved UnderwritingCase all_in_basis_cents, written when asset_status becomes DISPOSED
        default: 0
      - name: hold_sell_score_bps
        type: integer
        source: computed
        description: realized_yield_on_cost_bps of the home's APPROVED UnderwritingCase minus Market.disposition_yield_floor_bps; null while no APPROVED case exists
      - name: disposition_flagged
        type: boolean
        source: computed
        description: True when the APPROVED UnderwritingCase realized_yield_on_cost_bps is strictly below Market.disposition_yield_floor_bps
        default: false

  - name: UnderwritingCase
    parent: null
    common_fields: true
    fields:
      - name: home_id
        type: string
        source: input
        description: FK -> Home.id; the scattered-site home being underwritten
      - name: purchase_price_cents
        type: integer
        source: input
        description: Contract purchase price in cents
        constraints: ">= 1"
      - name: acquisition_closing_costs_cents
        type: integer
        source: input
        description: Title, transfer and diligence costs capitalized into basis
        constraints: ">= 0"
      - name: estimated_monthly_rent_cents
        type: integer
        source: input
        description: Analyst rent estimate used by the underwritten yield variant
        constraints: ">= 1"
      - name: turn_reserve_annual_cents
        type: integer
        source: input
        description: Annual make-ready/turn reserve treated as an operating expense
        constraints: ">= 0"
      - name: planned_scope_lines
        type: array
        source: input
        description: Ordered array of objects { scope_template_id, quantity } describing the planned renovation scope; order is the array order supplied by the analyst and fixes the per-line rounding sequence
        constraints: length >= 1; every scope_template_id must resolve to a ScopeTemplate
      - name: planned_renovation_budget_cents
        type: integer
        source: computed
        description: Output of calculations.scope_benchmark_total over planned_scope_lines (per-line round then sum)
      - name: underwritten_effective_gross_income_cents
        type: integer
        source: computed
        description: Effective gross income of the underwritten variant of calculations.yield_on_cost
      - name: underwritten_noi_cents
        type: integer
        source: computed
        description: Net operating income of the underwritten variant of calculations.yield_on_cost
      - name: underwritten_all_in_basis_cents
        type: integer
        source: computed
        description: purchase_price_cents + planned_renovation_budget_cents + acquisition_closing_costs_cents
      - name: underwritten_yield_on_cost_bps
        type: integer
        source: computed
        description: Yield on cost in basis points from the underwritten (forward-looking) variant
      - name: realized_renovation_cost_cents
        type: integer
        source: computed
        description: Chronological sum of actual_cost_cents over the home's COMPLETED renovation and turn work orders; null until at least one such work order is COMPLETED
      - name: realized_noi_cents
        type: integer
        source: computed
        description: Net operating income of the realized variant of calculations.yield_on_cost; null while realized_renovation_cost_cents is null
      - name: realized_all_in_basis_cents
        type: integer
        source: computed
        description: purchase_price_cents + realized_renovation_cost_cents + acquisition_closing_costs_cents; null while realized_renovation_cost_cents is null
      - name: realized_yield_on_cost_bps
        type: integer
        source: computed
        description: Yield on cost in basis points from the realized (chronological) variant; null while realized_renovation_cost_cents is null
      - name: status
        type: enum
        source: system
        description: Underwriting workflow state
        default: DRAFT
        constraints: DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | REJECTED | SUPERSEDED
      - name: revision_round
        type: integer
        source: computed
        description: Number of completed REVISION_REQUESTED -> DRAFT loops; incremented on each revise call
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the AcquisitionAnalyst that last called submit; empty string while never submitted. Compared against the deciding InvestmentCommittee X-User-ID for segregation of duties
        default: ""
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the InvestmentCommittee operator that recorded the terminal decision; empty string while undecided
        default: ""
      - name: decision_note
        type: string
        source: input
        description: Free-text committee note captured on the decision call
        default: ""

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Vendor legal entity name
      - name: market_id
        type: string
        source: input
        description: FK -> Market.id; the single market this vendor serves
      - name: daily_crew_capacity
        type: integer
        source: input
        description: Maximum crew members this vendor can field on any single calendar date across all of its non-terminal work orders
        constraints: ">= 1"
      - name: cost_index_bps
        type: integer
        source: input
        description: Vendor price multiplier in basis points applied to WorkOrder.benchmark_total_cents to produce the ranked effective bid
        constraints: 5000..20000
      - name: quality_score_bps
        type: integer
        source: input
        description: Vendor quality score in basis points; the second ranking key in vendor selection
        constraints: 0..10000
      - name: insurance_expires_on
        type: string
        source: input
        description: ISO date on which the vendor's general liability coverage lapses; a lapsed vendor is ineligible for dispatch
      - name: status
        type: enum
        source: system
        description: Vendor availability state
        default: ACTIVE
        constraints: ACTIVE | SUSPENDED
      - name: suspension_reason
        type: string
        source: input
        description: Reason recorded when the vendor was suspended
        default: ""
      - name: committed_crew_days
        type: integer
        source: computed
        description: Sum of WorkOrder.crew_days over this vendor's work orders whose status is in {DISPATCHED, ACCEPTED, IN_PROGRESS}
        default: 0

  - name: VendorCertification
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: FK -> Vendor.id; the certified vendor
      - name: certification_code
        type: string
        source: input
        description: Trade certification token matched against ScopeTemplate.certification_code
      - name: effective_on
        type: string
        source: input
        description: ISO date from which the certification is honored, inclusive
      - name: expires_on
        type: string
        source: input
        description: ISO date through which the certification is honored, inclusive
        constraints: must be >= effective_on

  - name: RenovationProject
    parent: null
    common_fields: true
    fields:
      - name: home_id
        type: string
        source: input
        description: FK -> Home.id; the home under renovation or turn
      - name: project_type
        type: enum
        source: input
        description: Whether this is an acquisition renovation or a resident turn
        constraints: ACQUISITION_RENOVATION | TURN
      - name: approved_budget_cents
        type: integer
        source: input
        description: Hard budget ceiling against which work order quotes are committed
        constraints: ">= 1"
      - name: committed_cost_cents
        type: integer
        source: computed
        description: Sum of quoted_cost_cents over this project's work orders whose status is in {PENDING_DISPATCH, DISPATCHED, ACCEPTED, IN_PROGRESS, COMPLETED}
        default: 0
      - name: budget_remaining_cents
        type: integer
        source: computed
        description: approved_budget_cents minus committed_cost_cents; the conserved money quantity of the renovation ledger
      - name: turn_started_on
        type: string
        source: input
        description: ISO date the make-ready clock starts, supplied on lock-scope; empty string while status is SCOPING
        default: ""
      - name: rent_ready_on
        type: string
        source: system
        description: ISO logical-clock date on which the project auto-transitioned to RENT_READY; empty string before that
        default: ""
      - name: turn_days
        type: integer
        source: computed
        description: Whole days from turn_started_on (inclusive) to rent_ready_on (exclusive); null before RENT_READY
      - name: overage_days
        type: integer
        source: computed
        description: max(0, turn_days - Market.make_ready_target_days); null before RENT_READY
      - name: gross_turn_cost_cents
        type: integer
        source: computed
        description: Sum of actual_cost_cents over this project's COMPLETED work orders; null before RENT_READY
      - name: holdback_rate_bps
        type: integer
        source: computed
        description: Tier selected by calculations.turn_holdback keyed on gross_turn_cost_cents; null before RENT_READY
      - name: vendor_holdback_cents
        type: integer
        source: computed
        description: Make-ready cycle-time holdback after the market cap is applied; null before RENT_READY
      - name: net_turn_cost_cents
        type: integer
        source: computed
        description: gross_turn_cost_cents minus vendor_holdback_cents; null before RENT_READY
      - name: status
        type: enum
        source: system
        description: Project state; RENT_READY is derived from the aggregate state of the project's work orders
        default: SCOPING
        constraints: SCOPING | IN_PROGRESS | RENT_READY

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: home_id
        type: string
        source: input
        description: FK -> Home.id; the home the work is performed on
      - name: project_id
        type: string
        source: input
        description: FK -> RenovationProject.id; empty string for standalone RESIDENT_MAINTENANCE work orders that are not part of a project
        default: ""
      - name: vendor_id
        type: string
        source: system
        description: FK -> Vendor.id; empty string until dispatch, and permanently empty for the IN_HOUSE channel
        default: ""
      - name: scope_template_id
        type: string
        source: input
        description: FK -> ScopeTemplate.id; the standardized scope being executed
      - name: work_type
        type: enum
        source: input
        description: Programme the work order belongs to
        constraints: RENOVATION | TURN | RESIDENT_MAINTENANCE
      - name: quantity
        type: integer
        source: input
        description: Quantity in the scope template's unit
        constraints: ">= 1"
      - name: crew_size
        type: integer
        source: input
        description: Crew members required on each scheduled date; consumes vendor daily capacity
        constraints: ">= 1"
      - name: scheduled_start_date
        type: string
        source: input
        description: ISO date the work starts, inclusive
      - name: scheduled_end_date
        type: string
        source: input
        description: ISO date the work ends, inclusive; must be >= scheduled_start_date
      - name: crew_days
        type: integer
        source: computed
        description: crew_size * (scheduled_end_date - scheduled_start_date + 1 day), the conserved labour quantity of vendor capacity
      - name: fulfillment_channel
        type: enum
        source: input
        description: Whether an in-house technician crew or the vendor network performs the work
        constraints: IN_HOUSE | VENDOR
      - name: quoted_cost_cents
        type: integer
        source: input
        description: Quoted cost committed against the project budget
        constraints: ">= 1"
      - name: benchmark_total_cents
        type: integer
        source: computed
        description: Single-line output of calculations.scope_benchmark_total for this work order's scope_template_id and quantity
      - name: variance_bps
        type: integer
        source: computed
        description: round_half_up((quoted_cost_cents - benchmark_total_cents) * 10000 / benchmark_total_cents); may be negative
      - name: actual_cost_cents
        type: integer
        source: input
        description: Invoiced cost recorded at completion; 0 while not COMPLETED
        default: 0
      - name: completed_on
        type: string
        source: input
        description: ISO date the work was completed, recorded at completion; empty string while not COMPLETED
        default: ""
      - name: void_reason
        type: string
        source: input
        description: Reason recorded when the work order was voided
        default: ""
      - name: status
        type: enum
        source: system
        description: Work order state; the dispatch fork sends VENDOR channel to DISPATCHED and IN_HOUSE channel straight to IN_PROGRESS
        default: PENDING_DISPATCH
        constraints: PENDING_DISPATCH | DISPATCHED | ACCEPTED | IN_PROGRESS | COMPLETED | VOIDED

  - name: Prospect
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Contact email
        constraints: unique across Prospect
      - name: full_name
        type: string
        source: input
        description: Legal name as entered on the self-service portal
      - name: phone
        type: string
        source: input
        description: Contact phone
      - name: market_id
        type: string
        source: input
        description: FK -> Market.id; the market whose fraud threshold and pet policy govern this prospect
      - name: declared_monthly_income_cents
        type: integer
        source: input
        description: Self-declared monthly income used by the pre_verification fraud variant
        constraints: ">= 0"
      - name: verified_monthly_income_cents
        type: integer
        source: input
        description: Income confirmed by the verification payload; 0 while identity_status is UNVERIFIED
        default: 0
      - name: credit_tier
        type: enum
        source: input
        description: Bureau tier supplied by the screening vendor
        constraints: A | B | C | D
      - name: prior_eviction_count
        type: integer
        source: input
        description: Count of prior eviction filings
        default: 0
      - name: document_type
        type: enum
        source: input
        description: Identity document presented at verification; NONE while unverified
        default: NONE
        constraints: NONE | DRIVERS_LICENSE | PASSPORT | STATE_ID
      - name: document_match_score_bps
        type: integer
        source: input
        description: Document authenticity match score from the last verification attempt
        default: 0
      - name: selfie_liveness_pass
        type: boolean
        source: input
        description: Whether the last verification attempt passed selfie liveness
        default: false
      - name: device_reputation_bps
        type: integer
        source: input
        description: Device reputation score from the last verification attempt; higher is safer
        default: 0
      - name: ip_geo_distance_km
        type: integer
        source: input
        description: Distance in km between the verification IP geolocation and the target market centroid
        default: 0
      - name: fraud_risk_score_bps
        type: integer
        source: computed
        description: Output of calculations.prospect_fraud_risk_score; higher is riskier
      - name: fraud_score_variant
        type: enum
        source: computed
        description: Which variant of calculations.prospect_fraud_risk_score produced the current fraud_risk_score_bps
        default: PRE_VERIFICATION
        constraints: PRE_VERIFICATION | POST_VERIFICATION
      - name: identity_status
        type: enum
        source: system
        description: Identity verification state; may cycle between VERIFIED and REJECTED across re-verification attempts
        default: UNVERIFIED
        constraints: UNVERIFIED | VERIFIED | REJECTED
      - name: verification_attempt_count
        type: integer
        source: computed
        description: Number of identity verification calls accepted for this prospect
        default: 0

  - name: ShowingSlot
    parent: null   # graph topology: linked to Home by FK only, created at a flat collection
    common_fields: true
    fields:
      - name: home_id
        type: string
        source: input
        description: FK -> Home.id; the home the self-showing occupies
      - name: prospect_id
        type: string
        source: system
        description: FK -> Prospect.id; empty string while the slot is not BOOKED
        default: ""
      - name: starts_at
        type: datetime
        source: input
        description: Interval start, inclusive (ISO 8601 UTC, three fractional digits)
      - name: ends_at
        type: datetime
        source: input
        description: Interval end, exclusive (ISO 8601 UTC, three fractional digits)
      - name: access_mode
        type: enum
        source: input
        description: How the prospect enters the home
        constraints: SMART_LOCK | LOCKBOX | AGENT_ESCORT
      - name: status
        type: enum
        source: system
        description: Slot state; AVAILABLE and BLOCKED_BY_POSTURE cycle as the home's leasing_posture changes
        default: AVAILABLE
        constraints: AVAILABLE | BOOKED | BLOCKED_BY_POSTURE | CANCELLED
      - name: cancel_reason
        type: string
        source: input
        description: Reason recorded on the last cancel call
        default: ""

  - name: RentalApplication
    parent: null
    common_fields: true
    fields:
      - name: prospect_id
        type: string
        source: input
        description: FK -> Prospect.id; the applicant
      - name: home_id
        type: string
        source: input
        description: FK -> Home.id; the home applied for
      - name: requested_move_in_date
        type: string
        source: input
        description: ISO date requested for move-in
      - name: lease_term_months
        type: integer
        source: input
        description: Requested lease term; defaults to Market.standard_lease_term_months when omitted
      - name: pet_count
        type: integer
        source: input
        description: Number of pets declared
        default: 0
      - name: pet_breeds
        type: array
        source: input
        description: Array of uppercase breed tokens declared, checked against Market.restricted_breeds
        default: []
      - name: rent_to_income_bps
        type: integer
        source: computed
        description: round_half_up(Home.asking_rent_cents * 10000 / Prospect.verified_monthly_income_cents), written at screening
      - name: security_deposit_cents
        type: integer
        source: computed
        description: Risk-adjusted security deposit written at screening; 0 when DENIED
        default: 0
      - name: pet_deposit_cents
        type: integer
        source: computed
        description: Capped pet deposit written at screening; 0 when DENIED
        default: 0
      - name: total_move_in_deposit_cents
        type: integer
        source: computed
        description: security_deposit_cents + pet_deposit_cents; the amount a Lease must have collected before execution
        default: 0
      - name: risk_multiplier_bps
        type: integer
        source: computed
        description: Deposit multiplier selected by calculations.screening_decision; 10000 for APPROVED
        default: 0
      - name: adverse_action_reason
        type: enum
        source: computed
        description: Machine-readable denial reason written when status becomes DENIED
        default: NONE
        constraints: NONE | FRAUD_RISK | EVICTION_HISTORY | RENT_TO_INCOME
      - name: status
        type: enum
        source: system
        description: Screening state; the screen call forks into three terminal outcomes with divergent side-effect sets
        default: SUBMITTED
        constraints: SUBMITTED | APPROVED | CONDITIONAL_APPROVED | DENIED

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> RentalApplication.id; the approved application this lease implements
      - name: home_id
        type: string
        source: computed
        description: FK -> Home.id; copied from the application at creation
      - name: start_date
        type: string
        source: input
        description: ISO lease start date
      - name: term_months
        type: integer
        source: input
        description: Lease term in months; must equal Market.standard_lease_term_months
      - name: monthly_rent_cents
        type: integer
        source: input
        description: Contract monthly rent; may not sit below the market concession floor
        constraints: ">= 1"
      - name: required_deposit_cents
        type: integer
        source: computed
        description: Copied from RentalApplication.total_move_in_deposit_cents at creation
      - name: deposit_paid_cents
        type: integer
        source: computed
        description: Cumulative sum of accepted deposit payment amounts
        default: 0
      - name: signed_on
        type: string
        source: input
        description: ISO date recorded at execution; empty string before that
        default: ""
      - name: void_reason
        type: string
        source: input
        description: Reason recorded when the draft lease was voided
        default: ""
      - name: status
        type: enum
        source: system
        description: Lease state
        default: DRAFT
        constraints: DRAFT | EXECUTED | VOIDED

  - name: ComplianceObligation
    parent: null   # graph topology: linked to Home by FK only, created at a flat collection
    common_fields: true
    fields:
      - name: home_id
        type: string
        source: input
        description: FK -> Home.id; the property the obligation attaches to
      - name: supersedes_obligation_id
        type: string
        source: input
        description: FK -> ComplianceObligation.id; the prior-cycle obligation this one renews, empty string when this is the first cycle
        default: ""
      - name: work_order_id
        type: string
        source: input
        description: FK -> WorkOrder.id; the remediation work order attached at planning time, empty string when the cure needs no field work
        default: ""
      - name: obligation_type
        type: enum
        source: input
        description: Which compliance programme this obligation belongs to; drives conditional field requirements on submit-resolution
        constraints: HOA_VIOLATION | INSURANCE_DEFICIENCY | PROPERTY_TAX_APPEAL
      - name: severity
        type: enum
        source: input
        description: Severity driving the home's leasing_posture; CRITICAL freezes the funnel, MAJOR restricts it
        constraints: MINOR | MAJOR | CRITICAL
      - name: description
        type: string
        source: input
        description: Narrative of the violation, coverage gap or assessment dispute
      - name: due_on
        type: string
        source: input
        description: ISO date the obligation must be resolved by
      - name: planned_resolution_on
        type: string
        source: input
        description: ISO date the cure/hearing is planned for, set on plan; empty string while OPEN
        default: ""
      - name: evidence_ref
        type: string
        source: input
        description: Evidence document reference supplied on submit-resolution for HOA_VIOLATION and INSURANCE_DEFICIENCY
        default: ""
      - name: assessed_value_cents
        type: integer
        source: input
        description: Assessed value under appeal; required for PROPERTY_TAX_APPEAL, 0 otherwise
        default: 0
      - name: target_value_cents
        type: integer
        source: input
        description: Value the appeal targets; required for PROPERTY_TAX_APPEAL, 0 otherwise
        default: 0
      - name: settled_value_cents
        type: integer
        source: input
        description: Value agreed with the jurisdiction, supplied on submit-resolution for PROPERTY_TAX_APPEAL; 0 otherwise
        default: 0
      - name: consultant_fee_bps
        type: integer
        source: input
        description: Contingency fee in basis points of annual tax savings owed to the appeal consultant
        default: 0
      - name: annual_tax_savings_cents
        type: integer
        source: computed
        description: Output of calculations.tax_appeal_savings, written when a PROPERTY_TAX_APPEAL resolves
        default: 0
      - name: consultant_fee_cents
        type: integer
        source: computed
        description: round_half_up(annual_tax_savings_cents * consultant_fee_bps / 10000)
        default: 0
      - name: net_tax_benefit_cents
        type: integer
        source: computed
        description: annual_tax_savings_cents - consultant_fee_cents
        default: 0
      - name: resolution_round
        type: integer
        source: computed
        description: Number of completed RESOLUTION_REJECTED -> PLANNED loops
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that last called submit-resolution; compared against the reviewing officer for segregation of duties
        default: ""
      - name: status
        type: enum
        source: system
        description: Obligation state; RESOLUTION_REJECTED loops back to PLANNED for another cure round
        default: OPEN
        constraints: OPEN | PLANNED | RESOLUTION_SUBMITTED | RESOLUTION_REJECTED | RESOLVED | WAIVED

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Home, dimension 1 of 2: asset_status (acquisition/disposition axis) -------------
  - entity: Home
    state_field: asset_status
    initial_state: PIPELINE
    terminal_states: [PASSED, DISPOSED]
    transitions:
      - from: PIPELINE
        to: ACQUIRED
        trigger: "POST /underwriting-cases/{caseId}/decision with decision=APPROVE (cascade hop 2 of the underwriting approval chain)"
        actor: system
        preconditions:
          - "the deciding UnderwritingCase.home_id equals this Home.id"
          - "Home.asset_status == PIPELINE"
        side_effects:
          - "Home.asset_status := ACQUIRED"
          - "Home.leasing_posture recomputed by calculations.home_leasing_posture (PIPELINE and ACQUIRED both keep it RESTRICTED unless a FROZEN input applies)"
          - "increments Home.version by 1"
        note: "occupancy_status is untouched by this transition; the two dimensions advance independently."
      - from: PIPELINE
        to: PASSED
        trigger: "POST /underwriting-cases/{caseId}/decision with decision=REJECT"
        actor: system
        preconditions:
          - "Home.asset_status == PIPELINE"
        side_effects:
          - "Home.asset_status := PASSED"
          - "Home.leasing_posture := FROZEN (PASSED is a FROZEN input of calculations.home_leasing_posture)"
          - "every ShowingSlot on this Home whose status == AVAILABLE transitions to BLOCKED_BY_POSTURE"
          - "increments Home.version by 1"
      - from: ACQUIRED
        to: RENOVATING
        trigger: "POST /renovation-projects/{projectId}/lock-scope (cascade hop 2 of the scope-lock chain)"
        actor: system
        preconditions:
          - "the locking RenovationProject.home_id equals this Home.id"
          - "Home.asset_status == ACQUIRED"
        side_effects:
          - "Home.asset_status := RENOVATING"
          - "Home.leasing_posture recomputed to FROZEN (RENOVATING is a FROZEN input of calculations.home_leasing_posture)"
          - "increments Home.version by 1"
      - from: RENOVATING
        to: STABILIZED
        trigger: "POST /work-orders/{workOrderId}/complete on the last non-terminal work order of the home's project (cascade hop 3 of the make-ready chain)"
        actor: system
        preconditions:
          - "the project that just reached RENT_READY has project.home_id == this Home.id"
          - "Home.asset_status == RENOVATING"
        side_effects:
          - "Home.asset_status := STABILIZED"
          - "Home.leasing_posture recomputed; with no CRITICAL/MAJOR obligation in {OPEN, PLANNED, RESOLUTION_SUBMITTED, RESOLUTION_REJECTED} and an unexpired binder this yields OPEN"
          - "hop 4a: because leasing_posture left FROZEN/RESTRICTED and is now OPEN, every ShowingSlot on this Home whose status == BLOCKED_BY_POSTURE transitions to AVAILABLE"
          - "hop 4b: because Home.asset_status changed, the home's UnderwritingCase whose status == APPROVED has realized_renovation_cost_cents, realized_all_in_basis_cents, realized_noi_cents and realized_yield_on_cost_bps recomputed by the realized variant of calculations.yield_on_cost, then Home.hold_sell_score_bps and Home.disposition_flagged recomputed"
          - "increments Home.version by 1"
      - from: STABILIZED
        to: DISPOSITION_APPROVED
        trigger: "POST /homes/{homeId}/disposition-decision with decision=APPROVE_SALE"
        actor: InvestmentCommittee
        preconditions:
          - "Home.asset_status == STABILIZED"
          - "Home.leasing_posture != FROZEN"
          - "if disposition_mode == INDIVIDUAL then Home.occupancy_status == VACANT; PORTFOLIO_LOT accepts occupancy_status in {VACANT, RESERVED, OCCUPIED}"
        side_effects:
          - "Home.asset_status := DISPOSITION_APPROVED"
          - "Home.disposition_mode := payload disposition_mode; Home.bpo_value_cents := payload bpo_value_cents; Home.lot_code := payload lot_code (empty string for INDIVIDUAL)"
          - "increments Home.version by 1"
        note: "occupancy_status is deliberately left alone: a PORTFOLIO_LOT sale of an OCCUPIED home is the parallel-dimension case."
      - from: DISPOSITION_APPROVED
        to: DISPOSED
        trigger: "POST /homes/{homeId}/disposition-decision with decision=CLOSE_SALE"
        actor: InvestmentCommittee
        preconditions:
          - "Home.asset_status == DISPOSITION_APPROVED"
          - "payload net_sale_proceeds_cents is present"
        side_effects:
          - "Home.asset_status := DISPOSED"
          - "Home.net_sale_proceeds_cents := payload net_sale_proceeds_cents"
          - "Home.realized_gain_cents := net_sale_proceeds_cents - (the APPROVED UnderwritingCase realized_all_in_basis_cents when non-null, otherwise its underwritten_all_in_basis_cents)"
          - "Home.leasing_posture := FROZEN (DISPOSED is a FROZEN input)"
          - "every ShowingSlot on this Home whose status == AVAILABLE transitions to BLOCKED_BY_POSTURE"
          - "increments Home.version by 1"

  # --- Home, dimension 2 of 2: occupancy_status (leasing axis) -------------------------
  - entity: Home
    state_field: occupancy_status
    initial_state: VACANT
    terminal_states: [OCCUPIED]
    transitions:
      - from: VACANT
        to: RESERVED
        trigger: "POST /rental-applications/{applicationId}/screen resolving to APPROVED or CONDITIONAL_APPROVED"
        actor: system
        preconditions:
          - "Home.occupancy_status == VACANT"
          - "the screened RentalApplication.home_id equals this Home.id"
        side_effects:
          - "Home.occupancy_status := RESERVED"
          - "increments Home.version by 1"
        note: "asset_status is untouched; a RESERVED home may still be STABILIZED or DISPOSITION_APPROVED."
      - from: RESERVED
        to: VACANT
        trigger: "POST /leases/{leaseId}/void"
        actor: system
        preconditions:
          - "the voided Lease.home_id equals this Home.id"
          - "Home.occupancy_status == RESERVED"
        side_effects:
          - "Home.occupancy_status := VACANT"
          - "increments Home.version by 1"
        note: "compensating hop that restores the occupancy dimension so the home can be re-reserved (VACANT -> RESERVED -> VACANT cycle)."
      - from: RESERVED
        to: OCCUPIED
        trigger: "POST /leases/{leaseId}/execute"
        actor: system
        preconditions:
          - "the executed Lease.home_id equals this Home.id"
          - "Home.occupancy_status == RESERVED"
        side_effects:
          - "Home.occupancy_status := OCCUPIED"
          - "every ShowingSlot on this Home whose status == AVAILABLE transitions to CANCELLED with cancel_reason 'HOME_LEASED'"
          - "increments Home.version by 1"

  # --- UnderwritingCase: cyclic revision loop with bounded rounds ---------------------
  - entity: UnderwritingCase
    state_field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /underwriting-cases/{caseId}/submit"
        actor: AcquisitionAnalyst
        preconditions:
          - "UnderwritingCase.status == DRAFT"
          - "UnderwritingCase.planned_scope_lines length >= 1"
        side_effects:
          - "UnderwritingCase.status := SUBMITTED"
          - "UnderwritingCase.submitted_by_user_id := X-User-ID of the caller"
          - "planned_renovation_budget_cents, underwritten_effective_gross_income_cents, underwritten_noi_cents, underwritten_all_in_basis_cents and underwritten_yield_on_cost_bps recomputed by the underwritten variant of calculations.yield_on_cost"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /underwriting-cases/{caseId}/decision with decision=APPROVE"
        actor: InvestmentCommittee
        preconditions:
          - "UnderwritingCase.status == SUBMITTED"
          - "X-User-ID != UnderwritingCase.submitted_by_user_id (segregation of duties)"
          - "UnderwritingCase.underwritten_yield_on_cost_bps >= Market.underwriting_yield_floor_bps"
        side_effects:
          - "UnderwritingCase.status := APPROVED; decided_by_user_id := X-User-ID; decision_note := payload note"
          - "hop 2: Home.asset_status PIPELINE -> ACQUIRED (see the Home asset_status machine), which itself recomputes Home.leasing_posture"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /underwriting-cases/{caseId}/decision with decision=REJECT"
        actor: InvestmentCommittee
        preconditions:
          - "UnderwritingCase.status == SUBMITTED"
          - "X-User-ID != UnderwritingCase.submitted_by_user_id"
        side_effects:
          - "UnderwritingCase.status := REJECTED; decided_by_user_id := X-User-ID"
          - "hop 2: Home.asset_status PIPELINE -> PASSED, which sets Home.leasing_posture := FROZEN and hop 3 blocks the home's AVAILABLE showing slots"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /underwriting-cases/{caseId}/decision with decision=REQUEST_REVISION"
        actor: InvestmentCommittee
        preconditions:
          - "UnderwritingCase.status == SUBMITTED"
          - "X-User-ID != UnderwritingCase.submitted_by_user_id"
          - "UnderwritingCase.revision_round <= 1 (a third revision request is refused with ERR_REVISION_LIMIT_EXCEEDED)"
        side_effects:
          - "UnderwritingCase.status := REVISION_REQUESTED; decision_note := payload note"
          - "Home.asset_status is NOT changed"
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /underwriting-cases/{caseId}/revise"
        actor: AcquisitionAnalyst
        preconditions:
          - "UnderwritingCase.status == REVISION_REQUESTED"
        side_effects:
          - "UnderwritingCase.status := DRAFT"
          - "UnderwritingCase.revision_round := revision_round + 1"
          - "any field present in the payload overwrites its stored counterpart; planned_renovation_budget_cents and every underwritten_* field are recomputed immediately"
          - "UnderwritingCase.submitted_by_user_id := \"\" (the next submit re-stamps it)"
        note: "closes the SUBMITTED -> REVISION_REQUESTED -> DRAFT -> SUBMITTED cycle."
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /underwriting-cases creating a newer case for the same home_id"
        actor: system
        preconditions:
          - "UnderwritingCase.status in {DRAFT, SUBMITTED, REVISION_REQUESTED}"
        side_effects:
          - "UnderwritingCase.status := SUPERSEDED"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /underwriting-cases creating a newer case for the same home_id"
        actor: system
        preconditions:
          - "UnderwritingCase.status in {DRAFT, SUBMITTED, REVISION_REQUESTED}"
        side_effects:
          - "UnderwritingCase.status := SUPERSEDED"
      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "POST /underwriting-cases creating a newer case for the same home_id"
        actor: system
        preconditions:
          - "UnderwritingCase.status in {DRAFT, SUBMITTED, REVISION_REQUESTED}"
        side_effects:
          - "UnderwritingCase.status := SUPERSEDED"

  # --- RenovationProject: compound state derived from its work orders -----------------
  - entity: RenovationProject
    state_field: status
    initial_state: SCOPING
    terminal_states: [RENT_READY]
    transitions:
      - from: SCOPING
        to: IN_PROGRESS
        trigger: "POST /renovation-projects/{projectId}/lock-scope"
        actor: OperationsManager
        preconditions:
          - "RenovationProject.status == SCOPING"
          - "count of WorkOrder rows with project_id == this project and status in {PENDING_DISPATCH, DISPATCHED, ACCEPTED, IN_PROGRESS, COMPLETED} is >= 1"
          - "Home.asset_status == ACQUIRED"
        side_effects:
          - "RenovationProject.status := IN_PROGRESS; turn_started_on := payload turn_started_on"
          - "hop 2: Home.asset_status ACQUIRED -> RENOVATING, which recomputes Home.leasing_posture to FROZEN"
          - "hop 3: because the recomputed posture is FROZEN, every ShowingSlot on the home whose status == AVAILABLE transitions to BLOCKED_BY_POSTURE"
      - from: IN_PROGRESS
        to: RENT_READY
        trigger: "system, evaluated at the end of POST /work-orders/{workOrderId}/complete and POST /work-orders/{workOrderId}/void"
        actor: system
        preconditions:
          - "RenovationProject.status == IN_PROGRESS"
          - "no WorkOrder with project_id == this project has status in {PENDING_DISPATCH, DISPATCHED, ACCEPTED, IN_PROGRESS}"
          - "at least one WorkOrder with project_id == this project has status == COMPLETED"
        side_effects:
          - "RenovationProject.status := RENT_READY; rent_ready_on := logical clock date"
          - "turn_days, overage_days, gross_turn_cost_cents, holdback_rate_bps, vendor_holdback_cents and net_turn_cost_cents written by calculations.turn_holdback"
          - "hop 3: Home.asset_status RENOVATING -> STABILIZED (see the Home asset_status machine), which in hop 4 unblocks BLOCKED_BY_POSTURE showing slots and recomputes the APPROVED UnderwritingCase realized_* fields"

  # --- WorkOrder: dispatch fork by channel, rejoin at COMPLETED ----------------------
  - entity: WorkOrder
    state_field: status
    initial_state: PENDING_DISPATCH
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: PENDING_DISPATCH
        to: DISPATCHED
        trigger: "POST /work-orders/{workOrderId}/dispatch when WorkOrder.fulfillment_channel == VENDOR"
        actor: OperationsManager
        preconditions:
          - "WorkOrder.status == PENDING_DISPATCH"
          - "WorkOrder.fulfillment_channel == VENDOR"
          - "the vendor (payload vendor_id, or the winner of calculations.vendor_dispatch_selection when vendor_id is omitted) has status == ACTIVE"
          - "that vendor's insurance_expires_on >= logical clock date"
          - "that vendor's market_id == Home.market_id"
          - "a VendorCertification exists with vendor_id == that vendor, certification_code == ScopeTemplate.certification_code, effective_on <= clock date and expires_on >= clock date"
          - "for every calendar date D in [scheduled_start_date, scheduled_end_date] inclusive, the vendor's existing crew load on D plus this work order's crew_size is <= vendor.daily_crew_capacity"
        side_effects:
          - "WorkOrder.status := DISPATCHED; WorkOrder.vendor_id := selected vendor id"
          - "Vendor.committed_crew_days := committed_crew_days + WorkOrder.crew_days"
      - from: PENDING_DISPATCH
        to: IN_PROGRESS
        trigger: "POST /work-orders/{workOrderId}/dispatch when WorkOrder.fulfillment_channel == IN_HOUSE"
        actor: OperationsManager
        preconditions:
          - "WorkOrder.status == PENDING_DISPATCH"
          - "WorkOrder.fulfillment_channel == IN_HOUSE"
          - "ScopeTemplate.safety_critical == false"
          - "payload vendor_id is absent"
        side_effects:
          - "WorkOrder.status := IN_PROGRESS; WorkOrder.vendor_id stays the empty string"
          - "no Vendor.committed_crew_days is touched and no vendor capacity is consumed"
        note: "divergent side-effect set versus the VENDOR branch; the two branches rejoin at COMPLETED."
      - from: DISPATCHED
        to: ACCEPTED
        trigger: "POST /work-orders/{workOrderId}/accept"
        actor: Vendor
        preconditions:
          - "WorkOrder.status == DISPATCHED"
          - "X-User-ID == WorkOrder.vendor_id"
        side_effects:
          - "WorkOrder.status := ACCEPTED"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /work-orders/{workOrderId}/complete"
        actor: Vendor
        preconditions:
          - "WorkOrder.status == ACCEPTED"
          - "X-User-ID == WorkOrder.vendor_id"
          - "payload completed_on >= WorkOrder.scheduled_start_date"
        side_effects:
          - "hop 1: WorkOrder.status := COMPLETED; actual_cost_cents and completed_on written; Vendor.committed_crew_days := committed_crew_days - WorkOrder.crew_days"
          - "hop 2: if project_id is non-empty and the project's precondition set for IN_PROGRESS -> RENT_READY now holds, RenovationProject auto-transitions to RENT_READY and calculations.turn_holdback runs"
          - "hop 3: that project transition drives Home.asset_status RENOVATING -> STABILIZED and recomputes Home.leasing_posture"
          - "hop 4: the new posture unblocks every BLOCKED_BY_POSTURE ShowingSlot on the home and recomputes the APPROVED UnderwritingCase realized_* fields, then Home.hold_sell_score_bps and Home.disposition_flagged"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{workOrderId}/complete"
        actor: OperationsManager
        preconditions:
          - "WorkOrder.status == IN_PROGRESS"
          - "WorkOrder.fulfillment_channel == IN_HOUSE"
          - "payload completed_on >= WorkOrder.scheduled_start_date"
        side_effects:
          - "WorkOrder.status := COMPLETED; actual_cost_cents and completed_on written; no vendor capacity is released because none was consumed"
          - "the same hop 2/3/4 project, home and underwriting cascade as the ACCEPTED -> COMPLETED branch"
      - from: PENDING_DISPATCH
        to: VOIDED
        trigger: "POST /work-orders/{workOrderId}/void"
        actor: OperationsManager
        preconditions:
          - "WorkOrder.status == PENDING_DISPATCH"
        side_effects:
          - "WorkOrder.status := VOIDED; void_reason written"
          - "RenovationProject.committed_cost_cents := committed_cost_cents - WorkOrder.quoted_cost_cents and budget_remaining_cents recomputed, restoring the money invariant committed_cost_cents + budget_remaining_cents == approved_budget_cents"
      - from: DISPATCHED
        to: VOIDED
        trigger: "POST /work-orders/{workOrderId}/void"
        actor: OperationsManager
        preconditions:
          - "WorkOrder.status == DISPATCHED"
        side_effects:
          - "WorkOrder.status := VOIDED; void_reason written"
          - "Vendor.committed_crew_days := committed_crew_days - WorkOrder.crew_days, restoring the labour invariant"
          - "RenovationProject.committed_cost_cents and budget_remaining_cents restored as in the PENDING_DISPATCH branch"
          - "if the project's IN_PROGRESS -> RENT_READY precondition set now holds, the project auto-transitions"
      - from: ACCEPTED
        to: VOIDED
        trigger: "POST /work-orders/{workOrderId}/void"
        actor: OperationsManager
        preconditions:
          - "WorkOrder.status == ACCEPTED"
        side_effects:
          - "same side-effect set as the DISPATCHED -> VOIDED branch"
      - from: IN_PROGRESS
        to: VOIDED
        trigger: "POST /work-orders/{workOrderId}/void"
        actor: OperationsManager
        preconditions:
          - "WorkOrder.status == IN_PROGRESS"
        side_effects:
          - "WorkOrder.status := VOIDED; void_reason written"
          - "RenovationProject.committed_cost_cents and budget_remaining_cents restored; no crew days to release for the IN_HOUSE channel"

  # --- Prospect identity: cyclic re-verification -------------------------------------
  - entity: Prospect
    state_field: identity_status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /prospects/{prospectId}/identity-verifications with selfie_liveness_pass=true and document_match_score_bps >= 5000"
        actor: Anonymous
        preconditions:
          - "payload expected_prospect_version == Prospect.version"
        side_effects:
          - "identity_status := VERIFIED; verification_attempt_count := verification_attempt_count + 1"
          - "document_type, document_match_score_bps, selfie_liveness_pass, verified_monthly_income_cents, device_reputation_bps and ip_geo_distance_km overwritten from the payload"
          - "fraud_risk_score_bps recomputed by the post_verification variant of calculations.prospect_fraud_risk_score; fraud_score_variant := POST_VERIFICATION"
          - "increments Prospect.version by 1"
      - from: UNVERIFIED
        to: REJECTED
        trigger: "POST /prospects/{prospectId}/identity-verifications with selfie_liveness_pass=false or document_match_score_bps < 5000"
        actor: Anonymous
        preconditions:
          - "payload expected_prospect_version == Prospect.version"
        side_effects:
          - "identity_status := REJECTED; verification_attempt_count incremented; same field overwrite and post_verification rescore as the VERIFIED branch"
          - "increments Prospect.version by 1"
      - from: REJECTED
        to: VERIFIED
        trigger: "POST /prospects/{prospectId}/identity-verifications with a passing payload"
        actor: Anonymous
        preconditions:
          - "payload expected_prospect_version == Prospect.version"
        side_effects:
          - "same side-effect set as UNVERIFIED -> VERIFIED"
        note: "retry loop; combined with VERIFIED -> REJECTED this dimension is cyclic."
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /prospects/{prospectId}/identity-verifications with a failing payload"
        actor: Anonymous
        preconditions:
          - "payload expected_prospect_version == Prospect.version"
        side_effects:
          - "same side-effect set as UNVERIFIED -> REJECTED"
          - "every ShowingSlot with prospect_id == this prospect and status == BOOKED transitions to AVAILABLE with prospect_id cleared, and Home.booked_showing_count for each affected home decrements by 1"
      - from: VERIFIED
        to: VERIFIED
        trigger: "POST /prospects/{prospectId}/identity-verifications with a passing payload on an already VERIFIED prospect"
        actor: Anonymous
        preconditions:
          - "payload expected_prospect_version == Prospect.version"
        side_effects:
          - "fields overwritten and fraud_risk_score_bps recomputed; identity_status stays VERIFIED; increments Prospect.version by 1"
        note: "self-loop; this is the re-verification supersede case that concurrency_rules.identity-verification-stale-prospect guards."

  # --- ShowingSlot: posture cycle plus booking release --------------------------------
  - entity: ShowingSlot
    state_field: status
    initial_state: AVAILABLE
    terminal_states: [CANCELLED]
    transitions:
      - from: AVAILABLE
        to: BOOKED
        trigger: "POST /showing-slots/{slotId}/book"
        actor: Prospect
        preconditions:
          - "ShowingSlot.status == AVAILABLE"
          - "X-User-ID == payload prospect_id"
          - "Prospect.market_id == Home.market_id"
          - "Prospect.identity_status == VERIFIED"
          - "Prospect.fraud_risk_score_bps <= Market.fraud_block_threshold_bps"
          - "Home.leasing_posture in {OPEN, RESTRICTED}"
        side_effects:
          - "ShowingSlot.status := BOOKED; prospect_id := payload prospect_id"
          - "Home.booked_showing_count := booked_showing_count + 1"
      - from: BOOKED
        to: AVAILABLE
        trigger: "POST /showing-slots/{slotId}/cancel"
        actor: Prospect
        preconditions:
          - "ShowingSlot.status == BOOKED"
          - "when the caller role is Prospect, X-User-ID == ShowingSlot.prospect_id"
        side_effects:
          - "ShowingSlot.status := AVAILABLE; prospect_id := \"\"; cancel_reason := payload reason"
          - "Home.booked_showing_count := booked_showing_count - 1, restoring the count invariant"
      - from: AVAILABLE
        to: CANCELLED
        trigger: "POST /showing-slots/{slotId}/cancel"
        actor: LeasingAgent
        preconditions:
          - "ShowingSlot.status == AVAILABLE"
          - "caller role is LeasingAgent"
        side_effects:
          - "ShowingSlot.status := CANCELLED; cancel_reason := payload reason"
          - "the slot's interval stops occupying the home's showing calendar, so a new slot may be created over it"
      - from: AVAILABLE
        to: BLOCKED_BY_POSTURE
        trigger: "system, whenever a mutation recomputes Home.leasing_posture to a value other than OPEN or RESTRICTED, or to a value that forbids showings"
        actor: system
        preconditions:
          - "ShowingSlot.status == AVAILABLE"
          - "Home.leasing_posture == FROZEN after recomputation"
        side_effects:
          - "ShowingSlot.status := BLOCKED_BY_POSTURE"
        note: "conditional cascade: slots whose status is BOOKED are deliberately left untouched so scheduled tours are not silently cancelled."
      - from: BLOCKED_BY_POSTURE
        to: AVAILABLE
        trigger: "system, whenever a mutation recomputes Home.leasing_posture to OPEN or RESTRICTED"
        actor: system
        preconditions:
          - "ShowingSlot.status == BLOCKED_BY_POSTURE"
          - "Home.leasing_posture in {OPEN, RESTRICTED} after recomputation"
        side_effects:
          - "ShowingSlot.status := AVAILABLE"
        note: "closes the AVAILABLE -> BLOCKED_BY_POSTURE -> AVAILABLE cycle."
      - from: AVAILABLE
        to: CANCELLED
        trigger: "POST /leases/{leaseId}/execute on a lease for this home (cascade)"
        actor: system
        preconditions:
          - "ShowingSlot.status == AVAILABLE"
          - "the executed Lease.home_id equals ShowingSlot.home_id"
        side_effects:
          - "ShowingSlot.status := CANCELLED; cancel_reason := \"HOME_LEASED\""

  # --- RentalApplication: three-way fork with divergent side effects -------------------
  - entity: RentalApplication
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, CONDITIONAL_APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /rental-applications/{applicationId}/screen when calculations.screening_decision returns APPROVED"
        actor: LeasingAgent
        preconditions:
          - "RentalApplication.status == SUBMITTED"
          - "Home.leasing_posture in {OPEN, RESTRICTED}"
          - "Home.occupancy_status == VACANT"
          - "Prospect.identity_status == VERIFIED"
        side_effects:
          - "status := APPROVED; rent_to_income_bps, risk_multiplier_bps (10000), security_deposit_cents, pet_deposit_cents and total_move_in_deposit_cents written"
          - "Home.occupancy_status VACANT -> RESERVED"
          - "adverse_action_reason stays NONE"
      - from: SUBMITTED
        to: CONDITIONAL_APPROVED
        trigger: "POST /rental-applications/{applicationId}/screen when calculations.screening_decision returns CONDITIONAL_APPROVED"
        actor: LeasingAgent
        preconditions:
          - "RentalApplication.status == SUBMITTED"
          - "Home.leasing_posture in {OPEN, RESTRICTED}"
          - "Home.occupancy_status == VACANT"
          - "Prospect.identity_status == VERIFIED"
        side_effects:
          - "status := CONDITIONAL_APPROVED; risk_multiplier_bps set from the credit_tier tier table, so security_deposit_cents exceeds the APPROVED branch for identical rent"
          - "Home.occupancy_status VACANT -> RESERVED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /rental-applications/{applicationId}/screen when calculations.screening_decision returns DENIED"
        actor: LeasingAgent
        preconditions:
          - "RentalApplication.status == SUBMITTED"
          - "Home.leasing_posture in {OPEN, RESTRICTED}"
          - "Prospect.identity_status == VERIFIED"
        side_effects:
          - "status := DENIED; rent_to_income_bps written; adverse_action_reason set to FRAUD_RISK, EVICTION_HISTORY or RENT_TO_INCOME by the first matching denial clause in calculations.screening_decision"
          - "security_deposit_cents, pet_deposit_cents and total_move_in_deposit_cents stay 0"
          - "Home.occupancy_status is NOT changed - the divergence from both approval branches"

  # --- Lease -------------------------------------------------------------------------
  - entity: Lease
    state_field: status
    initial_state: DRAFT
    terminal_states: [EXECUTED, VOIDED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /leases/{leaseId}/execute"
        actor: LeasingAgent
        preconditions:
          - "Lease.status == DRAFT"
          - "Home.leasing_posture == OPEN (strictly OPEN; RESTRICTED is not sufficient for execution)"
          - "Lease.deposit_paid_cents >= Lease.required_deposit_cents"
        side_effects:
          - "Lease.status := EXECUTED; signed_on := payload signed_on"
          - "Home.occupancy_status RESERVED -> OCCUPIED"
          - "every ShowingSlot on the home whose status == AVAILABLE transitions to CANCELLED with cancel_reason 'HOME_LEASED'"
          - "the home's APPROVED UnderwritingCase realized_* fields recomputed because the realized variant now reads Lease.monthly_rent_cents instead of estimated_monthly_rent_cents, then Home.hold_sell_score_bps and Home.disposition_flagged recomputed"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /leases/{leaseId}/void"
        actor: LeasingAgent
        preconditions:
          - "Lease.status == DRAFT"
        side_effects:
          - "Lease.status := VOIDED; void_reason := payload reason"
          - "Home.occupancy_status RESERVED -> VACANT (compensating hop that reopens the occupancy dimension)"

  # --- ComplianceObligation: cyclic cure loop, three programmes -----------------------
  - entity: ComplianceObligation
    state_field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: OPEN
        to: PLANNED
        trigger: "POST /compliance-obligations/{obligationId}/plan"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceObligation.status in {OPEN, RESOLUTION_REJECTED}"
          - "payload planned_resolution_on <= ComplianceObligation.due_on"
          - "when payload work_order_id is present, that WorkOrder.home_id == this obligation's home_id and its status is not VOIDED"
        side_effects:
          - "status := PLANNED; planned_resolution_on and work_order_id written"
          - "Home.leasing_posture recomputed (PLANNED remains a blocking status for CRITICAL and MAJOR severities)"
      - from: RESOLUTION_REJECTED
        to: PLANNED
        trigger: "POST /compliance-obligations/{obligationId}/plan"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceObligation.status == RESOLUTION_REJECTED"
          - "payload planned_resolution_on <= ComplianceObligation.due_on"
        side_effects:
          - "status := PLANNED; resolution_round := resolution_round + 1; planned_resolution_on rewritten"
        note: "closes the PLANNED -> RESOLUTION_SUBMITTED -> RESOLUTION_REJECTED -> PLANNED cycle."
      - from: PLANNED
        to: RESOLUTION_SUBMITTED
        trigger: "POST /compliance-obligations/{obligationId}/submit-resolution"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceObligation.status == PLANNED"
          - "when obligation_type == PROPERTY_TAX_APPEAL: payload settled_value_cents is present and 1 <= settled_value_cents <= assessed_value_cents"
          - "when obligation_type in {HOA_VIOLATION, INSURANCE_DEFICIENCY}: payload evidence_ref is a non-empty string"
        side_effects:
          - "status := RESOLUTION_SUBMITTED; submitted_by_user_id := X-User-ID; evidence_ref and/or settled_value_cents written"
      - from: RESOLUTION_SUBMITTED
        to: RESOLVED
        trigger: "POST /compliance-obligations/{obligationId}/review-resolution with decision=ACCEPT"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceObligation.status == RESOLUTION_SUBMITTED"
          - "X-User-ID != ComplianceObligation.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "hop 1: status := RESOLVED; for obligation_type == PROPERTY_TAX_APPEAL, annual_tax_savings_cents, consultant_fee_cents and net_tax_benefit_cents written by calculations.tax_appeal_savings"
          - "hop 2 (PROPERTY_TAX_APPEAL only): because the appeal resolved, Home.assessed_value_cents := settled_value_cents and Home.property_tax_annual_cents recomputed"
          - "hop 3: because Home.property_tax_annual_cents changed, the home's UnderwritingCase whose status == APPROVED has realized_noi_cents and realized_yield_on_cost_bps recomputed by the realized variant of calculations.yield_on_cost"
          - "hop 4: because realized_yield_on_cost_bps changed, Home.hold_sell_score_bps and Home.disposition_flagged recomputed against Market.disposition_yield_floor_bps"
          - "independently, Home.leasing_posture is recomputed because this obligation left its blocking status set, which may unblock BLOCKED_BY_POSTURE showing slots"
      - from: RESOLUTION_SUBMITTED
        to: RESOLUTION_REJECTED
        trigger: "POST /compliance-obligations/{obligationId}/review-resolution with decision=REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceObligation.status == RESOLUTION_SUBMITTED"
          - "X-User-ID != ComplianceObligation.submitted_by_user_id"
        side_effects:
          - "status := RESOLUTION_REJECTED; submitted_by_user_id := \"\""
          - "Home.leasing_posture unchanged in value because RESOLUTION_REJECTED is still a blocking status for CRITICAL and MAJOR severities"
      - from: RESOLUTION_SUBMITTED
        to: WAIVED
        trigger: "POST /compliance-obligations/{obligationId}/review-resolution with decision=WAIVE"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceObligation.status == RESOLUTION_SUBMITTED"
          - "X-User-ID != ComplianceObligation.submitted_by_user_id"
          - "obligation_type == HOA_VIOLATION"
          - "severity in {MINOR, MAJOR} - a CRITICAL obligation can never be waived"
        side_effects:
          - "status := WAIVED"
          - "Home.leasing_posture recomputed; a waived MAJOR obligation stops restricting the home"
          - "every ShowingSlot on the home whose status == BLOCKED_BY_POSTURE transitions to AVAILABLE when the recomputed posture is OPEN or RESTRICTED"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# =============================================================================
concurrency_rules:
  - rule_id: underwriting-case-create-stale-home
    parent_entity: Home
    write_endpoint: "POST /underwriting-cases"
    occ_field: "expected_home_version"
    description: |
      Creating an UnderwritingCase against a Home whose version has advanced since the client last
      read it is rejected. Re-underwriting a scattered-site home is legitimate at any time and the
      new case supersedes the prior non-terminal case for that home, so a second create observing
      the same stored state would otherwise succeed on its own product semantics; the stale-version
      check is what makes the supersede deterministic.
    error_id: ERR_STALE_HOME_VERSION
    http_status: 412

  - rule_id: identity-verification-stale-prospect
    parent_entity: Prospect
    write_endpoint: "POST /prospects/{prospectId}/identity-verifications"
    occ_field: "expected_prospect_version"
    description: |
      Recording an identity verification against a Prospect whose version has advanced since the
      client last read it is rejected. Re-verification is always permitted and legitimately
      supersedes the stored document, device and income signals, so the check is expressed purely as
      a stale-version comparison on Prospect.version rather than on any workflow status.
    error_id: ERR_STALE_PROSPECT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:

  # ---------------------------------------------------------------- C1 --------
  - name: scope_benchmark_total
    entity: WorkOrder
    also_writes: [UnderwritingCase, RenovationProject]
    algorithm_type: aggregation
    trigger: >
      Runs on POST /work-orders (writing WorkOrder.benchmark_total_cents and
      WorkOrder.variance_bps), on POST /underwriting-cases and
      POST /underwriting-cases/{caseId}/revise (writing
      UnderwritingCase.planned_renovation_budget_cents from planned_scope_lines), and on
      GET /renovation-projects/{projectId}/benchmark-summary.
    inputs:
      - "each scope line: { scope_template_id, quantity }"
      - "ScopeTemplate.benchmark_unit_cost_cents for the referenced scope_template_id"
      - "Market.cost_index_bps of the home's market"
      - "WorkOrder.quoted_cost_cents (variance only)"
      - "Market.cost_variance_tolerance_bps (variance only)"
    constants:
      BPS_DENOMINATOR: 10000
    formula: |
      Per scope line, in the array order supplied in planned_scope_lines:
        line_benchmark_cents(i) =
            round_half_up(ScopeTemplate.benchmark_unit_cost_cents(i) * quantity(i) * Market.cost_index_bps / 10000)
      scope_benchmark_total_cents = SUM over i of line_benchmark_cents(i)

      MANDATORY EVALUATION ORDER: the market cost index is applied and rounded to whole cents
      PER LINE, and only the already-rounded per-line results are summed. Summing the raw
      unindexed line costs first and applying the index once to the sum is a DIFFERENT number.

      For a single work order (which carries exactly one scope_template_id and one quantity):
        WorkOrder.benchmark_total_cents = line_benchmark_cents for that single line
        WorkOrder.variance_bps =
            round_half_up((WorkOrder.quoted_cost_cents - benchmark_total_cents) * 10000 / benchmark_total_cents)
        A work order is over benchmark when variance_bps > Market.cost_variance_tolerance_bps
        (strictly greater; a variance landing exactly on the tolerance is accepted).
    output_fields:
      - "WorkOrder.benchmark_total_cents"
      - "WorkOrder.variance_bps"
      - "UnderwritingCase.planned_renovation_budget_cents"
    precision: "integer cents; round_half_up at each per-line boundary; basis points are integers rounded half-up"
    worked_example: |
      Market ATL cost_index_bps = 10250. Scope lines:
        FLOOR_LVP  base 475      quantity 1150 -> round_half_up(475*1150*10250/10000)      = 559906
        HVAC_REPLACE base 612450 quantity 1    -> round_half_up(612450*10250/10000)        = 627761
        PAINT_INT  base 285050   quantity 1    -> round_half_up(285050*10250/10000)        = 292176
      scope_benchmark_total_cents = 559906 + 627761 + 292176 = 1479843
      Index-the-sum instead: (475*1150 + 612450 + 285050) = 1443750;
        round_half_up(1443750*10250/10000) = 1479844  -- one cent higher, and WRONG.
      Variance on the PAINT_INT work order quoted at 300000:
        round_half_up((300000-292176)*10000/292176) = 268 bps, which is <= tolerance 1000, accepted.
      Quoted 321394 -> exactly 1000 bps, accepted (the check is strictly greater than).
      Quoted 330000 -> 1295 bps, rejected with ERR_COST_VARIANCE_EXCEEDED.

  # ---------------------------------------------------------------- C2 --------
  - name: yield_on_cost
    entity: UnderwritingCase
    algorithm_type: threshold
    variants:
      - name: underwritten
        applies_when: "the case is priced from planned scope and estimated rent"
        selected_at: "POST /underwriting-cases, POST /underwriting-cases/{caseId}/revise, POST /underwriting-cases/{caseId}/submit"
      - name: realized
        applies_when: "the home has an APPROVED case and post-acquisition facts exist"
        selected_at: >
          POST /work-orders/{workOrderId}/complete (via the project RENT_READY cascade),
          POST /leases/{leaseId}/execute, and
          POST /compliance-obligations/{obligationId}/review-resolution with decision=ACCEPT on a
          PROPERTY_TAX_APPEAL obligation
    trigger: "see variants.selected_at; the two variants write disjoint field groups on the same row"
    inputs:
      - "UnderwritingCase.purchase_price_cents"
      - "UnderwritingCase.acquisition_closing_costs_cents"
      - "UnderwritingCase.turn_reserve_annual_cents"
      - "UnderwritingCase.estimated_monthly_rent_cents (underwritten variant only)"
      - "UnderwritingCase.planned_renovation_budget_cents (underwritten variant only)"
      - "actual_cost_cents of every WorkOrder with status == COMPLETED belonging to any RenovationProject of the home (realized variant only)"
      - "Lease.monthly_rent_cents of the home's Lease with status == EXECUTED (realized variant only)"
      - "Home.assessed_value_cents, Home.insurance_annual_premium_cents, Home.hoa_annual_cents"
      - "Market.vacancy_loss_bps, Market.bad_debt_bps, Market.mgmt_fee_bps, Market.millage_bps"
    constants:
      MONTHS_PER_YEAR: 12
      BPS_DENOMINATOR: 10000
    formula: |
      Shared skeleton, evaluated in exactly this order:
        (1) basis_cents          = purchase_price_cents + acquisition_closing_costs_cents + renovation_cents
        (2) gross_potential_rent = rent_basis_cents * 12
        (3) vacancy_loss_cents   = round_half_up(gross_potential_rent * Market.vacancy_loss_bps / 10000)
        (4) bad_debt_cents       = round_half_up(gross_potential_rent * Market.bad_debt_bps / 10000)
        (5) egi_cents            = gross_potential_rent - vacancy_loss_cents - bad_debt_cents
        (6) mgmt_fee_cents       = round_half_up(egi_cents * Market.mgmt_fee_bps / 10000)
        (7) property_tax_cents   = round_half_up(Home.assessed_value_cents * Market.millage_bps / 10000)
        (8) opex_cents           = mgmt_fee_cents + property_tax_cents
                                 + Home.insurance_annual_premium_cents + Home.hoa_annual_cents
                                 + turn_reserve_annual_cents
        (9) noi_cents            = egi_cents - opex_cents
       (10) yield_on_cost_bps    = round_half_up(noi_cents * 10000 / basis_cents)

      VARIANT underwritten:
        renovation_cents = UnderwritingCase.planned_renovation_budget_cents
                           (= calculations.scope_benchmark_total over planned_scope_lines)
        rent_basis_cents = UnderwritingCase.estimated_monthly_rent_cents
        writes: underwritten_all_in_basis_cents, underwritten_effective_gross_income_cents,
                underwritten_noi_cents, underwritten_yield_on_cost_bps

      VARIANT realized:
        renovation_cents = SUM of actual_cost_cents over WorkOrder rows whose status == COMPLETED
                           and whose project_id names any RenovationProject of the home
                           (VOIDED, PENDING_DISPATCH, DISPATCHED, ACCEPTED and IN_PROGRESS
                           work orders are excluded from the input set)
        rent_basis_cents = Lease.monthly_rent_cents of the home's Lease with status == EXECUTED,
                           falling back to UnderwritingCase.estimated_monthly_rent_cents when the
                           home has no EXECUTED lease
        Home.assessed_value_cents is read at recomputation time, so a RESOLVED
        PROPERTY_TAX_APPEAL that lowered the assessment feeds straight into step (7)
        writes: realized_renovation_cost_cents, realized_all_in_basis_cents, realized_noi_cents,
                realized_yield_on_cost_bps

      Downstream of the realized variant:
        Home.hold_sell_score_bps = (realized_yield_on_cost_bps when the case has been realized at
                                    least once, otherwise underwritten_yield_on_cost_bps)
                                   - Market.disposition_yield_floor_bps
        Home.disposition_flagged = (hold_sell_score_bps < 0)
    output_fields:
      - "UnderwritingCase.underwritten_all_in_basis_cents / _effective_gross_income_cents / _noi_cents / _yield_on_cost_bps"
      - "UnderwritingCase.realized_renovation_cost_cents / realized_all_in_basis_cents / realized_noi_cents / realized_yield_on_cost_bps"
      - "Home.hold_sell_score_bps"
      - "Home.disposition_flagged"
    precision: "integer cents throughout; every ratio rounded half-up to whole basis points"
    worked_example: |
      Market ATL: vacancy_loss_bps 500, bad_debt_bps 100, mgmt_fee_bps 800, millage_bps 125,
      underwriting_yield_floor_bps 500, disposition_yield_floor_bps 540.
      Home H1: assessed_value_cents 28000000, insurance 180000, hoa 60000.
      Case UC1: purchase 25000000, closing 750000, turn_reserve 120000,
                estimated_monthly_rent_cents 215000, planned_renovation_budget_cents 1479843.

      underwritten: basis 27229843; gpr 2580000; vacancy 129000; bad_debt 25800; egi 2425200;
        mgmt_fee 194016; tax 350000; opex 904016; noi 1521184; yield 559 bps
        (559 >= floor 500, so the case may be APPROVED).

      realized after three COMPLETED work orders costing 310000 + 640000 + 570000 = 1520000 and an
      EXECUTED lease at 208000/month: basis 27270000; gpr 2496000; vacancy 124800; bad_debt 24960;
        egi 2346240; mgmt_fee 187699; tax 350000; opex 897699; noi 1448541; yield 531 bps.
        SAME HOME, SAME CASE, 28 bps below the underwritten variant.
        hold_sell_score_bps = 531 - 540 = -9, disposition_flagged = true.

      realized again after the PROPERTY_TAX_APPEAL settles the assessment at 24800000:
        tax 310000; opex 857699; noi 1488541; yield 546 bps;
        hold_sell_score_bps = 546 - 540 = 6, disposition_flagged = false.

      Low-yield rejection case: purchase 30000000, closing 900000, same scope and rent ->
        basis 32379843, noi 1521184, yield 470 bps < floor 500 -> submit/approve blocked with
        ERR_YIELD_BELOW_FLOOR.

  # ---------------------------------------------------------------- C3 --------
  - name: prospect_fraud_risk_score
    entity: Prospect
    algorithm_type: weighted_scoring
    variants:
      - name: pre_verification
        applies_when: "Prospect.verification_attempt_count == 0"
        selected_at: "POST /prospects"
      - name: post_verification
        applies_when: "Prospect.verification_attempt_count >= 1"
        selected_at: "POST /prospects/{prospectId}/identity-verifications"
    trigger: "recomputed on every write that touches the prospect's signals; writes Prospect.fraud_risk_score_bps and Prospect.fraud_score_variant"
    inputs:
      - "Prospect.declared_monthly_income_cents (pre_verification variant)"
      - "Prospect.verified_monthly_income_cents (post_verification variant)"
      - "Prospect.credit_tier"
      - "Prospect.prior_eviction_count"
      - "Prospect.document_match_score_bps, Prospect.selfie_liveness_pass (post_verification variant)"
      - "Prospect.device_reputation_bps, Prospect.ip_geo_distance_km (post_verification variant)"
      - "Market.rent_index_cents of the prospect's market"
    constants:
      IDENTITY_WEIGHT_BPS: 3500
      INCOME_WEIGHT_BPS: 3000
      HISTORY_WEIGHT_BPS: 2000
      DEVICE_WEIGHT_BPS: 1500
      CREDIT_RISK_POINTS_BPS: {A: 500, B: 1500, C: 3000, D: 5000}
      EVICTION_PENALTY_BPS: 2500
      INCOME_COVERAGE_MULTIPLE: 3
      IDENTITY_DOC_MATCH_MIN_BPS: 5000
      UNVERIFIED_IDENTITY_FACTOR_BPS: 10000
      UNVERIFIED_DEVICE_FACTOR_BPS: 7000
      GEO_DISTANCE_THRESHOLD_KM: 100
      GEO_DISTANCE_PENALTY_BPS: 2000
      MAX_FACTOR_BPS: 10000
    formula: |
      The four weights sum to exactly 10000. Every factor is clamped into [0, 10000] BEFORE it is
      weighted, and the four weighted products are summed as raw integers and rounded ONCE at the
      end - never rounded per factor.

        income_coverage_denominator_cents = Market.rent_index_cents * 3
        income_factor_bps = max(0, 10000 - round_half_up(income_cents * 10000 / income_coverage_denominator_cents))
        history_factor_bps = min(10000, CREDIT_RISK_POINTS_BPS[credit_tier] + prior_eviction_count * 2500)

      VARIANT pre_verification:
        income_cents        = Prospect.declared_monthly_income_cents
        identity_factor_bps = 10000        (nothing has been proven yet)
        device_factor_bps   = 7000         (no device telemetry yet)
        writes fraud_score_variant = PRE_VERIFICATION

      VARIANT post_verification:
        income_cents        = Prospect.verified_monthly_income_cents
        identity_factor_bps = 10000 when selfie_liveness_pass == false,
                              otherwise max(0, 10000 - document_match_score_bps)
        device_factor_bps   = min(10000, max(0, 10000 - device_reputation_bps)
                                        + (2000 when ip_geo_distance_km > 100 else 0))
        writes fraud_score_variant = POST_VERIFICATION

      fraud_risk_score_bps = round_half_up(
            (3500 * identity_factor_bps + 3000 * income_factor_bps
           + 2000 * history_factor_bps  + 1500 * device_factor_bps) / 10000 )

      Booking a showing slot requires fraud_risk_score_bps <= Market.fraud_block_threshold_bps
      (a score landing exactly on the threshold is allowed).
      Identity verification succeeds only when selfie_liveness_pass == true AND
      document_match_score_bps >= IDENTITY_DOC_MATCH_MIN_BPS (5000), so a prospect can be
      VERIFIED and still be blocked for fraud - the two gates are independent.
    output_fields:
      - "Prospect.fraud_risk_score_bps"
      - "Prospect.fraud_score_variant"
    precision: "one round_half_up at the final division; factors are whole basis points"
    worked_example: |
      Market ATL rent_index_cents 210000 -> income_coverage_denominator_cents 630000.
      fraud_block_threshold_bps 6000.

      P1 pre_verification (declared 700000, credit B, 0 evictions):
        identity 10000, income max(0, 10000-11111) = 0, history 1500, device 7000
        -> (35000000 + 0 + 3000000 + 10500000)/10000 = 4850 bps
      P1 post_verification (doc 9200, liveness true, verified income 560000, device_rep 8800, 15 km):
        identity 800, income 10000-8889 = 1111, history 1500, device 1200
        -> (2800000 + 3333000 + 3000000 + 1800000)/10000 = 1093 bps
        Same prospect, same market: 3757 bps of divergence between the two variants.

      P2 pre (declared 250000, credit D, 1 eviction): identity 10000, income 6032, history 7500,
        device 7000 -> 78596000/10000 = 7859.6 -> 7860 bps
      P2 post (doc 6000, liveness true, verified 240000, device_rep 3000, 400 km):
        identity 4000, income 6190, history 7500, device 7000+2000 = 9000
        -> 61070000/10000 = 6107 bps -> VERIFIED but above threshold 6000, booking blocked with
        ERR_PROSPECT_FRAUD_BLOCKED.

      P3 post (doc 6000, liveness true, verified 157500, credit D, 0 evictions, device_rep 3000, 400 km):
        identity 4000, income 7500, history 5000, device 9000
        -> (14000000 + 22500000 + 10000000 + 13500000)/10000 = 6000 bps exactly -> booking ALLOWED.
      P4 post (doc 9600, liveness true, verified 800000, credit A, 0 evictions, device_rep 9200, 5 km):
        identity 400, income 0 (clamped from -2698), history 500, device 800 -> 360 bps.
      P7 post (liveness false, doc 9200, verified 560000, credit B, 0, device_rep 8800, 15 km):
        identity 10000 (liveness override beats the 9200 document score), income 1111,
        history 1500, device 1200 -> 4313 bps, identity_status REJECTED.

  # ---------------------------------------------------------------- C4 --------
  - name: home_leasing_posture
    entity: Home
    algorithm_type: constraint_propagation
    trigger: >
      Recomputed at the end of every mutation that changes Home.asset_status,
      Home.insurance_binder_expires_on, or the status/severity set of the home's
      ComplianceObligation rows, and on POST /_clock/set_current_utc for the homes read afterwards.
    inputs:
      - "Home.asset_status"
      - "Home.insurance_binder_expires_on"
      - "status and severity of every ComplianceObligation with home_id == this Home.id"
      - "the current logical clock date"
    constants:
      BLOCKING_OBLIGATION_STATUSES: [OPEN, PLANNED, RESOLUTION_SUBMITTED, RESOLUTION_REJECTED]
      FROZEN_ASSET_STATUSES: [PASSED, RENOVATING, DISPOSED]
      RESTRICTED_ASSET_STATUSES: [PIPELINE, ACQUIRED]
    formula: |
      First matching clause wins; clauses are evaluated in this exact order:
        (1) asset_status in {PASSED, RENOVATING, DISPOSED}                          -> FROZEN
        (2) insurance_binder_expires_on < current logical clock date                -> FROZEN
        (3) exists ComplianceObligation with severity == CRITICAL and status in
            BLOCKING_OBLIGATION_STATUSES                                            -> FROZEN
        (4) exists ComplianceObligation with severity == MAJOR and status in
            BLOCKING_OBLIGATION_STATUSES                                            -> RESTRICTED
        (5) asset_status in {PIPELINE, ACQUIRED}                                    -> RESTRICTED
        (6) otherwise (asset_status in {STABILIZED, DISPOSITION_APPROVED})          -> OPEN

      Obligations with severity == MINOR never affect posture, in any status.
      Obligations with status in {RESOLVED, WAIVED} never affect posture, at any severity.
      Clause (1) beating clause (2) matters: a DISPOSED home with a live binder is still FROZEN,
      and a RENOVATING home is FROZEN for the whole make-ready window no matter how clean its
      obligations are - which is what makes the RENOVATING -> STABILIZED unblock cascade observable.
      Clause (3) beating clause (4) matters: a home carrying both a CRITICAL and a MAJOR open
      obligation is FROZEN, not RESTRICTED, and resolving only the MAJOR one leaves it FROZEN.

      Posture gates, used by validations:
        showing slots may be booked when posture in {OPEN, RESTRICTED}
        applications may be screened when posture in {OPEN, RESTRICTED}
        leases may be executed ONLY when posture == OPEN
      Whenever the recomputed posture is FROZEN, every ShowingSlot on the home with status
      == AVAILABLE moves to BLOCKED_BY_POSTURE; whenever it returns to OPEN or RESTRICTED, every
      ShowingSlot with status == BLOCKED_BY_POSTURE moves back to AVAILABLE. Slots with status
      == BOOKED are never touched by posture recomputation.
    output_fields:
      - "Home.leasing_posture"
    precision: "not applicable (enumeration)"
    worked_example: |
      H1 asset_status STABILIZED, binder expires 2027-06-30, clock 2026-08-01, one MINOR HOA
      obligation OPEN -> clauses 1-5 all miss (MINOR is not blocking) -> OPEN.
      Add a MAJOR INSURANCE_DEFICIENCY obligation in status OPEN -> clause 4 -> RESTRICTED,
      and the home's AVAILABLE slots stay AVAILABLE (RESTRICTED still permits showings).
      Add a CRITICAL HOA_VIOLATION obligation in status OPEN -> clause 3 -> FROZEN, and every
      AVAILABLE slot moves to BLOCKED_BY_POSTURE. Lease execution now fails with
      ERR_HOME_LEASING_FROZEN.
      Resolve the CRITICAL obligation -> clause 4 still matches on the MAJOR one -> RESTRICTED,
      and the BLOCKED_BY_POSTURE slots return to AVAILABLE.

  # ---------------------------------------------------------------- C5 --------
  - name: screening_decision
    entity: RentalApplication
    algorithm_type: threshold
    trigger: "POST /rental-applications/{applicationId}/screen"
    inputs:
      - "Home.asking_rent_cents"
      - "Prospect.verified_monthly_income_cents"
      - "Prospect.credit_tier, Prospect.prior_eviction_count, Prospect.fraud_risk_score_bps"
      - "RentalApplication.pet_count"
      - "Market.rent_to_income_max_bps, Market.fraud_block_threshold_bps"
      - "Market.pet_deposit_per_pet_cents, Market.pet_deposit_cap_cents"
    constants:
      APPROVED_RISK_MULTIPLIER_BPS: 10000
      CONDITIONAL_RISK_MULTIPLIER_BPS: {A: 15000, B: 15000, C: 20000, D: 25000}
      CLEAN_TIER_RTI_CEILING_BPS: 3000
      HARD_EVICTION_COUNT: 2
    formula: |
      (1) rent_to_income_bps = round_half_up(Home.asking_rent_cents * 10000
                                             / Prospect.verified_monthly_income_cents)
      (2) decision, by first matching clause:
            (a) Prospect.fraud_risk_score_bps > Market.fraud_block_threshold_bps
                  -> DENIED, adverse_action_reason = FRAUD_RISK
            (b) Prospect.prior_eviction_count >= 2
                  -> DENIED, adverse_action_reason = EVICTION_HISTORY
            (c) rent_to_income_bps > Market.rent_to_income_max_bps
                  -> DENIED, adverse_action_reason = RENT_TO_INCOME
            (d) credit_tier == A and prior_eviction_count == 0 and rent_to_income_bps <= 3000
                  -> APPROVED, risk_multiplier_bps = 10000
            (e) otherwise
                  -> CONDITIONAL_APPROVED,
                     risk_multiplier_bps = CONDITIONAL_RISK_MULTIPLIER_BPS[credit_tier]
      (3) on DENIED: security_deposit_cents = 0, pet_deposit_cents = 0,
                     total_move_in_deposit_cents = 0, risk_multiplier_bps = 0
          otherwise:
            security_deposit_cents = round_half_up(Home.asking_rent_cents * risk_multiplier_bps / 10000)
            pet_deposit_cents      = min(RentalApplication.pet_count * Market.pet_deposit_per_pet_cents,
                                         Market.pet_deposit_cap_cents)
            total_move_in_deposit_cents = security_deposit_cents + pet_deposit_cents

      Clause order is load-bearing: a prospect who is both over the fraud threshold and over the
      rent-to-income ceiling is denied for FRAUD_RISK, never RENT_TO_INCOME.
      Clause (c) is strictly greater-than, so a ratio landing exactly on
      Market.rent_to_income_max_bps passes and lands in clause (d) or (e).
    output_fields:
      - "RentalApplication.status"
      - "RentalApplication.rent_to_income_bps"
      - "RentalApplication.risk_multiplier_bps"
      - "RentalApplication.security_deposit_cents"
      - "RentalApplication.pet_deposit_cents"
      - "RentalApplication.total_move_in_deposit_cents"
      - "RentalApplication.adverse_action_reason"
    precision: "integer cents; rent_to_income_bps rounded half-up to whole basis points"
    worked_example: |
      Market ATL: rent_to_income_max_bps 4000, fraud_block_threshold_bps 6000,
      pet_deposit_per_pet_cents 30000, pet_deposit_cap_cents 50000. Home H1 asking_rent 215000.

      P1 (verified income 560000, credit B, 0 evictions, fraud 1093, 1 pet):
        rti = round_half_up(215000*10000/560000) = 3839, clauses a-d miss (credit B) -> clause e
        CONDITIONAL_APPROVED, multiplier 15000, security 322500, pet 30000, total 352500.
      P4 (verified income 800000, credit A, 0 evictions, fraud 360, 0 pets):
        rti = round_half_up(2687.5) = 2688 -> clause d -> APPROVED, multiplier 10000,
        security 215000, pet 0, total 215000.
      Boundary: verified income 537500 -> rti exactly 4000, clause c does not fire (not >),
        -> CONDITIONAL_APPROVED. Verified income 537000 -> rti 4004 -> DENIED / RENT_TO_INCOME.
      Pet cap: same P1 with pet_count 2 -> raw 60000, capped to 50000, total 372500.

  # ---------------------------------------------------------------- C6 --------
  - name: turn_holdback
    entity: RenovationProject
    algorithm_type: tiered_pricing
    trigger: "the system transition RenovationProject IN_PROGRESS -> RENT_READY, evaluated at the end of POST /work-orders/{workOrderId}/complete and POST /work-orders/{workOrderId}/void"
    inputs:
      - "RenovationProject.turn_started_on"
      - "RenovationProject.rent_ready_on (the logical clock date at the moment of the transition)"
      - "actual_cost_cents of every WorkOrder with project_id == this project and status == COMPLETED"
      - "Market.make_ready_target_days"
      - "Market.turn_holdback_cap_bps"
    constants:
      HOLDBACK_TIERS_BPS:
        - {overage_days_from: 0, overage_days_to: 0, rate_bps: 0}
        - {overage_days_from: 1, overage_days_to: 3, rate_bps: 1000}
        - {overage_days_from: 4, overage_days_to: 7, rate_bps: 2000}
        - {overage_days_from: 8, overage_days_to: null, rate_bps: 3000}
    formula: |
      MANDATORY EVALUATION ORDER - every step reads the output of the previous step and no step
      may be reordered:
        (1) gross_turn_cost_cents = SUM of actual_cost_cents over WorkOrder rows with
            project_id == this project and status == COMPLETED
            (VOIDED work orders contribute nothing, even if they were once ACCEPTED)
        (2) turn_days      = rent_ready_on - turn_started_on, counted in whole days
        (3) overage_days   = max(0, turn_days - Market.make_ready_target_days)
        (4) holdback_rate_bps = the single HOLDBACK_TIERS_BPS row whose
            [overage_days_from, overage_days_to] band contains overage_days (flat, not marginal)
        (5) raw_holdback_cents = round_half_up(gross_turn_cost_cents * holdback_rate_bps / 10000)
        (6) holdback_cap_cents = round_half_up(gross_turn_cost_cents * Market.turn_holdback_cap_bps / 10000)
            -- the cap is a percentage of the GROSS cost from step (1), never of any net figure
        (7) vendor_holdback_cents = min(raw_holdback_cents, holdback_cap_cents)
        (8) net_turn_cost_cents   = gross_turn_cost_cents - vendor_holdback_cents

      Computing the cap in step (6) against (gross - raw_holdback) instead of against gross is the
      classic reordering error and produces a smaller holdback whenever the cap binds.
    output_fields:
      - "RenovationProject.turn_days"
      - "RenovationProject.overage_days"
      - "RenovationProject.gross_turn_cost_cents"
      - "RenovationProject.holdback_rate_bps"
      - "RenovationProject.vendor_holdback_cents"
      - "RenovationProject.net_turn_cost_cents"
    precision: "integer cents; round_half_up on both step (5) and step (6)"
    worked_example: |
      Market ATL: make_ready_target_days 30, turn_holdback_cap_bps 1500.
      Three COMPLETED work orders at 310000 + 640000 + 570000 -> gross_turn_cost_cents 1520000.

      turn_started_on 2026-08-05, rent_ready_on 2026-09-06 -> turn_days 32, overage_days 2,
        tier 1000 bps, raw 152000, cap 228000, holdback 152000, net 1368000. Cap does not bind.
      turn_started_on 2026-08-05, rent_ready_on 2026-09-08 -> turn_days 34, overage_days 4,
        tier 2000 bps, raw 304000, cap 228000, holdback 228000 (CAP BINDS), net 1292000.
        Capping against (1520000 - 304000) instead would give 182400 - wrong by 45600 cents.
      turn_started_on 2026-08-05, rent_ready_on 2026-09-04 -> turn_days 30, overage_days 0,
        tier 0 bps, holdback 0, net 1520000.

  # ---------------------------------------------------------------- C7 --------
  - name: tax_appeal_savings
    entity: ComplianceObligation
    algorithm_type: threshold
    trigger: "POST /compliance-obligations/{obligationId}/review-resolution with decision=ACCEPT on an obligation whose obligation_type == PROPERTY_TAX_APPEAL"
    inputs:
      - "Home.assessed_value_cents at the moment of acceptance"
      - "ComplianceObligation.settled_value_cents"
      - "ComplianceObligation.consultant_fee_bps"
      - "Market.millage_bps"
    constants:
      BPS_DENOMINATOR: 10000
    formula: |
      (1) annual_tax_savings_cents =
            round_half_up((Home.assessed_value_cents - ComplianceObligation.settled_value_cents)
                          * Market.millage_bps / 10000)
      (2) consultant_fee_cents =
            round_half_up(annual_tax_savings_cents * ComplianceObligation.consultant_fee_bps / 10000)
            -- the fee is a share of the SAVINGS, not of the assessment reduction
      (3) net_tax_benefit_cents = annual_tax_savings_cents - consultant_fee_cents
      (4) Home.assessed_value_cents := ComplianceObligation.settled_value_cents
      (5) Home.property_tax_annual_cents :=
            round_half_up(Home.assessed_value_cents * Market.millage_bps / 10000)
      Steps (4) and (5) then drive calculations.yield_on_cost (realized variant) and
      Home.hold_sell_score_bps / Home.disposition_flagged.
      A settled_value_cents equal to Home.assessed_value_cents yields zero savings and a zero fee
      and is accepted; a settled_value_cents greater than the assessment is rejected at submission.
    output_fields:
      - "ComplianceObligation.annual_tax_savings_cents"
      - "ComplianceObligation.consultant_fee_cents"
      - "ComplianceObligation.net_tax_benefit_cents"
      - "Home.assessed_value_cents"
      - "Home.property_tax_annual_cents"
    precision: "integer cents; round_half_up at steps (1), (2) and (5)"
    worked_example: |
      H1 assessed_value_cents 28000000, Market millage_bps 125 -> property_tax_annual_cents 350000.
      Appeal settles at 24800000 with consultant_fee_bps 3000:
        savings = round_half_up(3200000*125/10000) = 40000
        fee     = round_half_up(40000*3000/10000)  = 12000
        net     = 28000
        Home.assessed_value_cents := 24800000, property_tax_annual_cents := 310000.
      Cascade: UC1 realized_noi_cents 1448541 -> 1488541 and realized_yield_on_cost_bps 531 -> 546,
      so hold_sell_score_bps -9 -> 6 and disposition_flagged true -> false.

  # ---------------------------------------------------------------- C8 --------
  - name: vendor_dispatch_selection
    entity: WorkOrder
    algorithm_type: chronological
    trigger: "POST /work-orders/{workOrderId}/dispatch when fulfillment_channel == VENDOR and the payload omits vendor_id; also exposed read-only by GET /work-orders/{workOrderId}/vendor-ranking"
    inputs:
      - "every Vendor row with market_id == Home.market_id"
      - "Vendor.status, Vendor.insurance_expires_on, Vendor.cost_index_bps, Vendor.quality_score_bps, Vendor.daily_crew_capacity, Vendor.committed_crew_days, Vendor.created_at"
      - "VendorCertification rows for those vendors"
      - "ScopeTemplate.certification_code of the work order's scope template"
      - "WorkOrder.benchmark_total_cents, WorkOrder.crew_size, WorkOrder.scheduled_start_date, WorkOrder.scheduled_end_date"
      - "the current logical clock date"
    constants:
      BPS_DENOMINATOR: 10000
    formula: |
      (1) eligibility filter, all clauses required:
            Vendor.status == ACTIVE
            Vendor.market_id == Home.market_id
            Vendor.insurance_expires_on >= current logical clock date
            a VendorCertification exists with vendor_id == Vendor.id,
              certification_code == ScopeTemplate.certification_code,
              effective_on <= clock date and expires_on >= clock date
            for EVERY calendar date D in [WorkOrder.scheduled_start_date,
              WorkOrder.scheduled_end_date] inclusive:
                (sum of crew_size over that vendor's WorkOrder rows whose status is in
                 {DISPATCHED, ACCEPTED} and whose [scheduled_start_date, scheduled_end_date]
                 contains D) + WorkOrder.crew_size <= Vendor.daily_crew_capacity
      (2) bid_cents = round_half_up(WorkOrder.benchmark_total_cents * Vendor.cost_index_bps / 10000)
      (3) ranking, applied in this exact order:
            bid_cents ASC, then quality_score_bps DESC, then created_at ASC
          The winner is the first row. Price beats quality: a cheaper vendor with a worse quality
          score is selected over a pricier vendor with a better one.
      (4) if the eligible set is empty -> ERR_NO_ELIGIBLE_VENDOR
    output_fields:
      - "WorkOrder.vendor_id"
    precision: "integer cents; round_half_up on the bid"
    worked_example: |
      PAINT_INT work order on H1, benchmark_total_cents 292176, crew_size 3, window 2026-08-10..08-12.
      V1 cost_index_bps 9800, quality 8600 -> bid round_half_up(292176*9800/10000) = 286332
      V2 cost_index_bps 10100, quality 9400 -> bid 295098
      V1 wins on bid_cents ASC even though V2 scores 800 bps better on quality.
      Add V3 cost_index_bps 9800, quality 9500, created later than V1 -> bid ties at 286332, so
      quality_score_bps DESC breaks the tie and V3 wins. A fourth vendor V4 with the same 9800
      index and the same 9500 quality loses to V3 on created_at ASC.

  # ---------------------------------------------------------------- C9 --------
  - name: work_order_crew_days
    entity: WorkOrder
    algorithm_type: interval_merge
    trigger: "POST /work-orders (writes crew_days); consumed by POST /work-orders/{workOrderId}/dispatch and released by complete/void"
    inputs:
      - "WorkOrder.crew_size"
      - "WorkOrder.scheduled_start_date, WorkOrder.scheduled_end_date"
      - "Vendor.daily_crew_capacity, Vendor.committed_crew_days"
    constants:
      WINDOW_BOUNDS: closed_inclusive
    formula: |
      (1) window_days = (scheduled_end_date - scheduled_start_date) in whole days + 1
          The work-order window is CLOSED-INCLUSIVE on both ends, so a single-day work order has
          window_days 1 and two work orders sharing one boundary date DO overlap on that date.
      (2) crew_days = crew_size * window_days
      (3) on a successful VENDOR dispatch: Vendor.committed_crew_days += crew_days
          on complete or void of a DISPATCHED / ACCEPTED work order:
            Vendor.committed_crew_days -= crew_days
          IN_HOUSE work orders never touch Vendor.committed_crew_days.
      (4) invariant: for every vendor, committed_crew_days equals the sum of crew_days over its
          WorkOrder rows whose status is in {DISPATCHED, ACCEPTED}, at all times.
      Per-date capacity is checked independently of crew_days: the aggregate of crew_size over
      overlapping DISPATCHED / ACCEPTED work orders on each date in the window plus this work
      order's crew_size must not exceed Vendor.daily_crew_capacity.
    output_fields:
      - "WorkOrder.crew_days"
      - "Vendor.committed_crew_days"
    precision: "whole days and whole crew-days; no rounding"
    worked_example: |
      Vendor V2 daily_crew_capacity 4, committed_crew_days 0.
      WO_A crew_size 3, 2026-08-10..2026-08-12 -> window_days 3, crew_days 9. Dispatch to V2 ->
        committed_crew_days 9; V2 carries 3 crew on each of 08-10, 08-11 and 08-12.
      WO_B crew_size 2, 2026-08-12..2026-08-14 -> crew_days 6. Dispatching to V2 fails: on
        2026-08-12 the load would be 3 + 2 = 5 > 4 -> ERR_VENDOR_CAPACITY_EXCEEDED. The shared
        boundary date alone causes the conflict.
      WO_B rescoped to crew_size 1 -> on 2026-08-12 the load is 3 + 1 = 4, exactly the capacity,
        so the dispatch succeeds; crew_days 3 and committed_crew_days 9 -> 12.
      Voiding WO_B returns committed_crew_days to 9, satisfying the invariant in step (4).

# =============================================================================
# 1.4 Validation Rules (evaluated in ascending priority; the FIRST violated rule
#     is the only one reported, and evaluation stops there)
# =============================================================================
validations:

  # ---- structural (10-49) ---------------------------------------------------
  - id: V010
    priority: 10
    category: structural
    applies_to: ["every write endpoint"]
    condition: >
      A required input field is absent, an input field has the wrong JSON type, an enum-typed field
      carries a value outside its declared set, a money or count field is negative, a *_bps field is
      outside [0, 1000000], a field violates the numeric range printed in its section 1.1
      `constraints:` entry, or a date / timestamp field is not a valid ISO-8601 value.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
  - id: V012
    priority: 12
    category: structural
    applies_to: ["POST /work-orders", "POST /showing-slots", "POST /leases", "POST /vendor-certifications", "POST /renovation-projects/{projectId}/lock-scope"]
    condition: >
      An interval is inverted or degenerate: scheduled_start_date > scheduled_end_date,
      starts_at >= ends_at, term_months < 1, or
      effective_on > expires_on.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
  - id: V020
    priority: 20
    category: structural
    applies_to: ["every endpoint"]
    condition: "The X-Role header is absent or carries a value that is not one of the roles in section 1.7."
    error_id: ERR_INVALID_ROLE
    http_status: 400
  - id: V030
    priority: 30
    category: permission
    applies_to: ["every endpoint except POST /_clock/set_current_utc"]
    condition: "The X-User-ID header is absent or an empty string."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
  - id: V040
    priority: 40
    category: permission
    applies_to: ["every endpoint"]
    condition: "The X-Role header carries a valid role that is not listed in the endpoint's roles set."
    error_id: ERR_UNAUTHORIZED
    http_status: 403

  # ---- existence (50-99) ----------------------------------------------------
  - id: V050
    priority: 50
    category: existence
    applies_to: ["GET /markets/{marketId}", "POST /homes", "POST /prospects", "POST /vendors"]
    condition: "The path marketId or the payload market_id does not identify a stored Market."
    error_id: ERR_MARKET_NOT_FOUND
    http_status: 404
  - id: V052
    priority: 52
    category: existence
    applies_to: ["GET /scope-templates/{scopeTemplateId}", "POST /work-orders", "POST /underwriting-cases", "POST /underwriting-cases/{caseId}/revise"]
    condition: "A referenced scope_template_id, or a scope_template_id inside planned_scope_lines, does not identify a stored ScopeTemplate."
    error_id: ERR_SCOPE_TEMPLATE_NOT_FOUND
    http_status: 404
  - id: V054
    priority: 54
    category: existence
    applies_to: ["every endpoint carrying homeId in the path or home_id in the payload"]
    condition: "The referenced home does not exist."
    error_id: ERR_HOME_NOT_FOUND
    http_status: 404
  - id: V056
    priority: 56
    category: existence
    applies_to: ["GET /underwriting-cases/{caseId}", "POST /underwriting-cases/{caseId}/submit", "POST /underwriting-cases/{caseId}/decision", "POST /underwriting-cases/{caseId}/revise"]
    condition: "The referenced underwriting case does not exist."
    error_id: ERR_UNDERWRITING_CASE_NOT_FOUND
    http_status: 404
  - id: V058
    priority: 58
    category: existence
    applies_to: ["GET /vendors/{vendorId}", "POST /vendors/{vendorId}/status", "POST /vendor-certifications", "POST /work-orders/{workOrderId}/dispatch"]
    condition: "The referenced vendor_id does not identify a stored Vendor."
    error_id: ERR_VENDOR_NOT_FOUND
    http_status: 404
  - id: V060
    priority: 60
    category: existence
    applies_to: ["GET /vendor-certifications/{certificationId}", "POST /vendor-certifications/{certificationId}/revoke"]
    condition: "The referenced vendor certification does not exist."
    error_id: ERR_VENDOR_CERTIFICATION_NOT_FOUND
    http_status: 404
  - id: V062
    priority: 62
    category: existence
    applies_to: ["GET /renovation-projects/{projectId}", "POST /renovation-projects/{projectId}/lock-scope", "POST /renovation-projects/{projectId}/budget", "GET /renovation-projects/{projectId}/benchmark-summary", "POST /work-orders"]
    condition: "The referenced project_id does not identify a stored RenovationProject."
    error_id: ERR_RENOVATION_PROJECT_NOT_FOUND
    http_status: 404
  - id: V064
    priority: 64
    category: existence
    applies_to: ["every endpoint carrying workOrderId in the path or work_order_id in the payload"]
    condition: "The referenced work order does not exist."
    error_id: ERR_WORK_ORDER_NOT_FOUND
    http_status: 404
  - id: V066
    priority: 66
    category: existence
    applies_to: ["GET /prospects/{prospectId}", "POST /prospects/{prospectId}/identity-verifications", "POST /showing-slots/{slotId}/book", "POST /rental-applications"]
    condition: "The referenced prospect_id does not identify a stored Prospect."
    error_id: ERR_PROSPECT_NOT_FOUND
    http_status: 404
  - id: V068
    priority: 68
    category: existence
    applies_to: ["GET /showing-slots/{slotId}", "POST /showing-slots/{slotId}/book", "POST /showing-slots/{slotId}/cancel"]
    condition: "The referenced showing slot does not exist."
    error_id: ERR_SHOWING_SLOT_NOT_FOUND
    http_status: 404
  - id: V070
    priority: 70
    category: existence
    applies_to: ["GET /rental-applications/{applicationId}", "POST /rental-applications/{applicationId}/screen", "POST /leases"]
    condition: "The referenced application_id does not identify a stored RentalApplication."
    error_id: ERR_RENTAL_APPLICATION_NOT_FOUND
    http_status: 404
  - id: V072
    priority: 72
    category: existence
    applies_to: ["GET /leases/{leaseId}", "POST /leases/{leaseId}/execute", "POST /leases/{leaseId}/void", "POST /leases/{leaseId}/deposit-payments"]
    condition: "The referenced lease does not exist."
    error_id: ERR_LEASE_NOT_FOUND
    http_status: 404
  - id: V074
    priority: 74
    category: existence
    applies_to: ["GET /compliance-obligations/{obligationId}", "POST /compliance-obligations/{obligationId}/plan", "POST /compliance-obligations/{obligationId}/submit-resolution", "POST /compliance-obligations/{obligationId}/review-resolution", "POST /compliance-obligations"]
    condition: "The referenced obligationId, or a supersedes_obligation_id in the payload, does not identify a stored ComplianceObligation."
    error_id: ERR_COMPLIANCE_OBLIGATION_NOT_FOUND
    http_status: 404

  # ---- optimistic concurrency (100-119) -------------------------------------
  - id: V100
    priority: 100
    category: concurrency
    applies_to: ["POST /underwriting-cases"]
    condition: "payload expected_home_version != Home.version of the referenced home."
    error_id: ERR_STALE_HOME_VERSION
    http_status: 412
  - id: V102
    priority: 102
    category: concurrency
    applies_to: ["POST /prospects/{prospectId}/identity-verifications"]
    condition: "payload expected_prospect_version != Prospect.version of the referenced prospect."
    error_id: ERR_STALE_PROSPECT_VERSION
    http_status: 412

  # ---- uniqueness and referential coherence (150-199) -----------------------
  - id: V150
    priority: 150
    category: business_constraint
    applies_to: ["POST /markets"]
    condition: "A Market with the same code already exists."
    error_id: ERR_DUPLICATE_MARKET_CODE
    http_status: 409
  - id: V152
    priority: 152
    category: business_constraint
    applies_to: ["POST /scope-templates"]
    condition: "A ScopeTemplate with the same code already exists."
    error_id: ERR_DUPLICATE_SCOPE_TEMPLATE_CODE
    http_status: 409
  - id: V154
    priority: 154
    category: business_constraint
    applies_to: ["POST /renovation-projects"]
    condition: >
      A RenovationProject already exists for the payload home_id with status in
      {SCOPING, IN_PROGRESS} - i.e. an open project. A home whose earlier project already reached
      RENT_READY may open a later TURN project.
    error_id: ERR_DUPLICATE_PROJECT_FOR_HOME
    http_status: 409
  - id: V156
    priority: 156
    category: business_constraint
    applies_to: ["POST /vendor-certifications"]
    condition: "A VendorCertification with the same vendor_id and certification_code already exists with status == ACTIVE."
    error_id: ERR_DUPLICATE_CERTIFICATION
    http_status: 409
  - id: V158
    priority: 158
    category: business_constraint
    applies_to: ["POST /rental-applications"]
    condition: "A RentalApplication already exists for the same prospect_id and home_id with status == SUBMITTED."
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
  - id: V160
    priority: 160
    category: business_constraint
    applies_to: ["POST /rental-applications", "POST /showing-slots/{slotId}/book", "POST /work-orders/{workOrderId}/dispatch"]
    condition: >
      A cross-market reference: Prospect.market_id != Home.market_id on an application or booking,
      or the explicitly supplied Vendor.market_id != Home.market_id on a dispatch.
    error_id: ERR_MARKET_MISMATCH
    http_status: 422

  # ---- structural integrity of the acting row (250-299) ----------------------
  - id: V250
    priority: 250
    category: business_constraint
    applies_to: ["POST /work-orders/{workOrderId}/accept", "POST /work-orders/{workOrderId}/complete"]
    condition: >
      WorkOrder.fulfillment_channel == VENDOR and WorkOrder.vendor_id is the empty string. A
      vendor-channel work order with nobody assigned is structurally incomplete, so this check runs
      BEFORE the state guard V300: completing or accepting such a row reports
      ERR_WORK_ORDER_NOT_ASSIGNED rather than ERR_INVALID_STATE, no matter which status the row sits
      in.
    error_id: ERR_WORK_ORDER_NOT_ASSIGNED
    http_status: 409

  # ---- state machine guards (300-349) ---------------------------------------
  - id: V300
    priority: 300
    category: state
    applies_to: ["every transition endpoint listed in section 1.2"]
    condition: >
      The entity's current state is not a declared `from` state for the requested transition,
      including every attempt from a terminal state.
    error_id: ERR_INVALID_STATE
    http_status: 409
  - id: V302
    priority: 302
    category: state
    applies_to: ["POST /showing-slots/{slotId}/book"]
    condition: "ShowingSlot.status != AVAILABLE (it is BOOKED, BLOCKED_BY_POSTURE or CANCELLED)."
    error_id: ERR_SHOWING_SLOT_NOT_AVAILABLE
    http_status: 409
    note: >
      Deliberately at a LOWER priority than V420 ERR_PROSPECT_IDENTITY_UNVERIFIED, so a booking that
      is both on a taken slot and from an unverified prospect reports the slot state, not the
      prospect state.
  - id: V304
    priority: 304
    category: state
    applies_to: ["POST /work-orders"]
    condition: "The referenced RenovationProject.status == RENT_READY, which no longer accepts new work orders."
    error_id: ERR_PROJECT_SCOPE_LOCKED
    http_status: 409
  - id: V306
    priority: 306
    category: state
    applies_to: ["POST /renovation-projects"]
    condition: >
      The payload home_id has no UnderwritingCase with status == APPROVED, so the home was never
      acquired and cannot be renovated.
    error_id: ERR_CASE_NOT_APPROVED
    http_status: 409
  - id: V308
    priority: 308
    category: state
    applies_to: ["POST /leases"]
    condition: "The referenced RentalApplication.status is not in {APPROVED, CONDITIONAL_APPROVED}."
    error_id: ERR_APPLICATION_NOT_APPROVED
    http_status: 409
  - id: V310
    priority: 310
    category: state
    applies_to: ["POST /leases"]
    condition: "The application's home already has a Lease with status in {DRAFT, EXECUTED}."
    error_id: ERR_LEASE_ALREADY_EXISTS
    http_status: 409
  - id: V312
    priority: 312
    category: state
    applies_to: ["POST /rental-applications/{applicationId}/screen"]
    condition: "Home.occupancy_status != VACANT."
    error_id: ERR_HOME_NOT_VACANT
    http_status: 409

  # ---- authority and segregation of duties (350-399) ------------------------
  - id: V350
    priority: 350
    category: permission
    applies_to: ["POST /underwriting-cases/{caseId}/decision", "POST /compliance-obligations/{obligationId}/review-resolution"]
    condition: >
      X-User-ID equals UnderwritingCase.submitted_by_user_id, or equals
      ComplianceObligation.submitted_by_user_id.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
  - id: V352
    priority: 352
    category: permission
    applies_to: ["POST /work-orders/{workOrderId}/accept", "POST /work-orders/{workOrderId}/complete"]
    condition: "The caller role is Vendor and X-User-ID != WorkOrder.vendor_id."
    error_id: ERR_NOT_ASSIGNED_VENDOR
    http_status: 403
  - id: V354
    priority: 354
    category: permission
    applies_to: ["POST /showing-slots/{slotId}/cancel", "POST /rental-applications/{applicationId}/screen"]
    condition: >
      The caller role is Prospect and X-User-ID != ShowingSlot.prospect_id, or the caller role is
      Prospect on an application whose prospect_id is not X-User-ID.
    error_id: ERR_NOT_SLOT_OWNER
    http_status: 403
  - id: V356
    priority: 356
    category: business_constraint
    applies_to: ["POST /underwriting-cases/{caseId}/decision"]
    condition: "decision == REQUEST_REVISION and UnderwritingCase.revision_round >= 2."
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 422

  # ---- cross-entity state dependencies (400-449) ---------------------------
  - id: V400
    priority: 400
    category: business_constraint
    applies_to: ["POST /renovation-projects/{projectId}/lock-scope"]
    condition: "Home.asset_status != ACQUIRED for the project's home."
    error_id: ERR_HOME_NOT_ACQUIRED
    http_status: 409
  - id: V402
    priority: 402
    category: business_constraint
    applies_to: ["POST /renovation-projects/{projectId}/lock-scope"]
    condition: >
      The project has zero WorkOrder rows whose status is in
      {PENDING_DISPATCH, DISPATCHED, ACCEPTED, IN_PROGRESS, COMPLETED} - i.e. an empty or
      fully-voided scope set.
    error_id: ERR_PROJECT_SCOPE_EMPTY
    http_status: 422
  - id: V404
    priority: 404
    category: business_constraint
    applies_to: ["POST /work-orders/{workOrderId}/dispatch"]
    condition: "The selected or supplied Vendor.status != ACTIVE."
    error_id: ERR_VENDOR_INACTIVE
    http_status: 422
  - id: V406
    priority: 406
    category: business_constraint
    applies_to: ["POST /work-orders/{workOrderId}/dispatch"]
    condition: "The selected or supplied Vendor.insurance_expires_on < the current logical clock date."
    error_id: ERR_VENDOR_INSURANCE_EXPIRED
    http_status: 422
  - id: V408
    priority: 408
    category: business_constraint
    applies_to: ["POST /work-orders/{workOrderId}/dispatch"]
    condition: >
      No VendorCertification exists for the supplied vendor with certification_code equal to the
      work order's ScopeTemplate.certification_code, status == ACTIVE, effective_on <= clock date
      and expires_on >= clock date.
    error_id: ERR_VENDOR_NOT_CERTIFIED
    http_status: 422
  - id: V410
    priority: 410
    category: business_constraint
    applies_to: ["POST /work-orders/{workOrderId}/dispatch"]
    condition: >
      The payload omits vendor_id and calculations.vendor_dispatch_selection produces an empty
      eligible set.
    error_id: ERR_NO_ELIGIBLE_VENDOR
    http_status: 422
  - id: V414
    priority: 414
    category: business_constraint
    applies_to: ["POST /compliance-obligations/{obligationId}/plan"]
    condition: >
      The payload work_order_id references a WorkOrder whose home_id differs from the obligation's
      home_id, or whose status == VOIDED.
    error_id: ERR_OBLIGATION_WORK_ORDER_MISMATCH
    http_status: 422
  - id: V416
    priority: 416
    category: business_constraint
    applies_to: ["POST /compliance-obligations/{obligationId}/plan"]
    condition: "payload planned_resolution_on > ComplianceObligation.due_on."
    error_id: ERR_OBLIGATION_PAST_DUE
    http_status: 422
  - id: V420
    priority: 420
    category: business_constraint
    applies_to: ["POST /showing-slots/{slotId}/book", "POST /rental-applications/{applicationId}/screen", "POST /rental-applications"]
    condition: "Prospect.identity_status != VERIFIED."
    error_id: ERR_PROSPECT_IDENTITY_UNVERIFIED
    http_status: 422
    note: >
      Deliberately at a HIGHER priority than V302 ERR_SHOWING_SLOT_NOT_AVAILABLE: the pair
      (V302, V420) is the state-versus-business-constraint priority conflict on slot booking.
  - id: V422
    priority: 422
    category: business_constraint
    applies_to: ["POST /showing-slots/{slotId}/book"]
    condition: "Prospect.fraud_risk_score_bps > Market.fraud_block_threshold_bps (strictly greater)."
    error_id: ERR_PROSPECT_FRAUD_BLOCKED
    http_status: 422

  # ---- temporal and capacity (450-499) -------------------------------------
  - id: V450
    priority: 450
    category: business_constraint
    applies_to: ["POST /showing-slots"]
    condition: >
      (ends_at - starts_at) in whole minutes < Market.min_showing_duration_minutes.
    error_id: ERR_SLOT_DURATION_INVALID
    http_status: 422
  - id: V452
    priority: 452
    category: business_constraint
    applies_to: ["POST /showing-slots"]
    condition: "starts_at < the current logical clock instant."
    error_id: ERR_SLOT_IN_PAST
    http_status: 422
  - id: V454
    priority: 454
    category: business_constraint
    applies_to: ["POST /showing-slots"]
    condition: >
      For the same home_id, an existing ShowingSlot with status in {AVAILABLE, BOOKED,
      BLOCKED_BY_POSTURE} has a half-open interval [starts_at, ends_at) that either
      overlaps the new interval, or is separated from it by strictly fewer than
      Market.showing_buffer_minutes whole minutes on either side. CANCELLED slots are ignored.
    error_id: ERR_SHOWING_SLOT_OVERLAP
    http_status: 409
  - id: V456
    priority: 456
    category: business_constraint
    applies_to: ["POST /work-orders/{workOrderId}/dispatch"]
    condition: >
      For at least one calendar date D in the closed-inclusive window
      [scheduled_start_date, scheduled_end_date], the sum of crew_size over the vendor's WorkOrder
      rows with status in {DISPATCHED, ACCEPTED} whose closed-inclusive windows contain D, plus
      this work order's crew_size, exceeds Vendor.daily_crew_capacity.
    error_id: ERR_VENDOR_CAPACITY_EXCEEDED
    http_status: 409

  # ---- business safety (500-549) ------------------------------------------
  - id: V500
    priority: 500
    category: business_safety
    applies_to: ["POST /showing-slots/{slotId}/book", "POST /rental-applications/{applicationId}/screen"]
    condition: "calculations.home_leasing_posture yields FROZEN for the home."
    error_id: ERR_HOME_SHOWINGS_BLOCKED
    http_status: 422
  - id: V502
    priority: 502
    category: business_safety
    applies_to: ["POST /leases/{leaseId}/execute"]
    condition: "calculations.home_leasing_posture yields anything other than OPEN for the home."
    error_id: ERR_HOME_LEASING_FROZEN
    http_status: 422
    note: >
      Deliberately at a LOWER priority than V602 ERR_DEPOSIT_NOT_FUNDED: the pair (V502, V602) is
      the safety-versus-fiscal priority conflict on lease execution. A lease that is both on a
      RESTRICTED home and short on deposit reports ERR_HOME_LEASING_FROZEN.
  - id: V504
    priority: 504
    category: business_safety
    applies_to: ["POST /work-orders/{workOrderId}/dispatch"]
    condition: "WorkOrder.fulfillment_channel == IN_HOUSE and the work order's ScopeTemplate.safety_critical == true."
    error_id: ERR_IN_HOUSE_SAFETY_CRITICAL
    http_status: 422
  - id: V506
    priority: 506
    category: business_safety
    applies_to: ["POST /rental-applications"]
    condition: "Any entry of the payload pet_breeds array appears in Market.restricted_breeds."
    error_id: ERR_RESTRICTED_BREED
    http_status: 422
  - id: V508
    priority: 508
    category: business_safety
    applies_to: ["POST /rental-applications"]
    condition: "payload pet_count > Market.max_pets, or pet_breeds length != pet_count."
    error_id: ERR_PET_COUNT_EXCEEDED
    http_status: 422
  - id: V510
    priority: 510
    category: business_safety
    applies_to: ["POST /compliance-obligations/{obligationId}/review-resolution"]
    condition: >
      decision == WAIVE and either ComplianceObligation.severity == CRITICAL or
      ComplianceObligation.obligation_type != HOA_VIOLATION.
    error_id: ERR_CRITICAL_OBLIGATION_NOT_WAIVABLE
    http_status: 422
  - id: V512
    priority: 512
    category: business_safety
    applies_to: ["POST /homes/{homeId}/disposition-decision"]
    condition: >
      decision == APPROVE_SALE, disposition_mode == INDIVIDUAL and Home.occupancy_status != VACANT.
      A PORTFOLIO_LOT sale is permitted at any occupancy_status.
    error_id: ERR_DISPOSITION_NOT_ELIGIBLE
    http_status: 422

  # ---- business fiscal (600-699) ------------------------------------------
  - id: V600
    priority: 600
    category: business_fiscal
    applies_to: ["POST /underwriting-cases/{caseId}/submit", "POST /underwriting-cases/{caseId}/decision"]
    condition: >
      UnderwritingCase.underwritten_yield_on_cost_bps < Market.underwriting_yield_floor_bps.
      Evaluated on submit and re-evaluated on an APPROVE decision.
    error_id: ERR_YIELD_BELOW_FLOOR
    http_status: 422
  - id: V602
    priority: 602
    category: business_fiscal
    applies_to: ["POST /leases/{leaseId}/execute"]
    condition: "Lease.deposit_paid_cents < Lease.required_deposit_cents."
    error_id: ERR_DEPOSIT_NOT_FUNDED
    http_status: 422
  - id: V604
    priority: 604
    category: business_fiscal
    applies_to: ["POST /work-orders"]
    condition: >
      calculations.scope_benchmark_total yields variance_bps > Market.cost_variance_tolerance_bps
      (strictly greater) for the quoted_cost_cents in the payload.
    error_id: ERR_COST_VARIANCE_EXCEEDED
    http_status: 422
  - id: V606
    priority: 606
    category: business_fiscal
    applies_to: ["POST /work-orders"]
    condition: >
      RenovationProject.committed_cost_cents + payload quoted_cost_cents >
      RenovationProject.approved_budget_cents (strictly greater; landing exactly on the approved
      budget is allowed).
    error_id: ERR_PROJECT_BUDGET_EXCEEDED
    http_status: 422
  - id: V608
    priority: 608
    category: business_fiscal
    applies_to: ["POST /leases"]
    condition: >
      payload monthly_rent_cents < Home.asking_rent_cents
      - round_half_up(Home.asking_rent_cents * Market.max_rent_concession_bps / 10000).
    error_id: ERR_RENT_CONCESSION_EXCEEDED
    http_status: 422
  - id: V610
    priority: 610
    category: business_fiscal
    applies_to: ["POST /leases"]
    condition: >
      payload term_months != Market.standard_lease_term_months and the caller role is not
      RegionalDirector.
    error_id: ERR_LEASE_TERM_INVALID
    http_status: 422
  - id: V612
    priority: 612
    category: business_fiscal
    applies_to: ["POST /leases/{leaseId}/deposit-payments"]
    condition: "Lease.deposit_paid_cents + payload amount_cents > Lease.required_deposit_cents."
    error_id: ERR_DEPOSIT_OVERPAYMENT
    http_status: 422
  - id: V614
    priority: 614
    category: business_fiscal
    applies_to: ["POST /compliance-obligations/{obligationId}/submit-resolution"]
    condition: >
      obligation_type == PROPERTY_TAX_APPEAL and payload settled_value_cents is absent, or is
      less than 1, or is greater than Home.assessed_value_cents.
    error_id: ERR_SETTLED_VALUE_INVALID
    http_status: 422
  - id: V616
    priority: 616
    category: business_fiscal
    applies_to: ["POST /compliance-obligations/{obligationId}/submit-resolution"]
    condition: >
      obligation_type is in {HOA_VIOLATION, INSURANCE_DEFICIENCY} and payload evidence_ref is
      absent or an empty string.
    error_id: ERR_EVIDENCE_REQUIRED
    http_status: 422
  - id: V618
    priority: 618
    category: business_fiscal
    applies_to: ["POST /renovation-projects/{projectId}/budget"]
    condition: >
      payload approved_budget_cents < RenovationProject.committed_cost_cents - lowering the
      approved budget below money already committed to work orders would break the invariant
      committed_cost_cents + budget_remaining_cents == approved_budget_cents.
    error_id: ERR_BUDGET_BELOW_COMMITTED
    http_status: 422

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- test-driving utility -------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    purpose: >
      Sets the server's logical clock, which every date and timestamp comparison in this API reads.
      Default value at boot is 2026-08-01T00:00:00Z.
    roles: [System]
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "Sets the logical clock instant. Values already stored are not rewritten; every subsequent read of Home.leasing_posture and every vendor-eligibility / slot-window comparison uses the new instant."
  - method: GET
    path: /_clock
    purpose: Reads the current logical clock instant.
    roles: [System, PortfolioAdmin, OperationsManager, LeasingAgent, ComplianceOfficer, VendorManager, AcquisitionAnalyst, InvestmentCommittee, RegionalDirector, Vendor, Prospect, Anonymous]
    input: []
    output: "{ current_utc: string }"
    side_effects: []

  # ---- Market ---------------------------------------------------------------
  - method: POST
    path: /markets
    purpose: Registers a market with its standardized pricing, pet, lease and underwriting policy.
    roles: [PortfolioAdmin]
    input: [code, name, tax_jurisdiction_code, millage_bps, rent_index_cents, cost_index_bps, cost_variance_tolerance_bps, make_ready_target_days, turn_holdback_cap_bps, showing_buffer_minutes, min_showing_duration_minutes, pet_deposit_per_pet_cents, pet_deposit_cap_cents, max_pets, restricted_breeds, standard_lease_term_months, fraud_block_threshold_bps, rent_to_income_max_bps, vacancy_loss_bps, bad_debt_bps, mgmt_fee_bps, underwriting_yield_floor_bps, disposition_yield_floor_bps, max_rent_concession_bps]
    output: Market
    side_effects:
      - "Creates the Market with version 1."
  - method: GET
    path: /markets/{marketId}
    purpose: Reads one market.
    roles: [PortfolioAdmin, OperationsManager, LeasingAgent, ComplianceOfficer, VendorManager, AcquisitionAnalyst, InvestmentCommittee, RegionalDirector]
    input: []
    output: Market
    side_effects: []
  - method: GET
    path: /markets
    purpose: Lists markets.
    roles: [PortfolioAdmin, OperationsManager, LeasingAgent, ComplianceOfficer, VendorManager, AcquisitionAnalyst, InvestmentCommittee, RegionalDirector]
    input: ["code?", "limit?", "offset?"]
    output: Market[]
    side_effects: []

  # ---- ScopeTemplate --------------------------------------------------------
  - method: POST
    path: /scope-templates
    purpose: Publishes a standardized renovation scope with its national benchmark unit cost.
    roles: [PortfolioAdmin]
    input: [code, name, certification_code, unit, benchmark_unit_cost_cents, default_crew_size, default_crew_days, safety_critical]
    output: ScopeTemplate
    side_effects:
      - "Creates the ScopeTemplate. The row is immutable after creation; there is no update endpoint."
  - method: GET
    path: /scope-templates/{scopeTemplateId}
    purpose: Reads one scope template.
    roles: [PortfolioAdmin, OperationsManager, AcquisitionAnalyst, VendorManager, InvestmentCommittee, RegionalDirector, Vendor]
    input: []
    output: ScopeTemplate
    side_effects: []
  - method: GET
    path: /scope-templates
    purpose: Lists scope templates.
    roles: [PortfolioAdmin, OperationsManager, AcquisitionAnalyst, VendorManager, InvestmentCommittee, RegionalDirector, Vendor]
    input: ["code?", "certification_code?", "safety_critical?", "limit?", "offset?"]
    output: ScopeTemplate[]
    side_effects: []

  # ---- Home -----------------------------------------------------------------
  - method: POST
    path: /homes
    purpose: Adds a scattered-site home to the acquisition pipeline.
    roles: [AcquisitionAnalyst, PortfolioAdmin]
    input: [market_id, address_line1, city, state_code, postal_code, bedrooms, bathrooms, square_feet, year_built, assessed_value_cents, asking_rent_cents, insurance_carrier_name, insurance_annual_premium_cents, insurance_binder_expires_on, "hoa_name?", "hoa_annual_cents?"]
    output: Home
    side_effects:
      - "Creates the Home with asset_status PIPELINE, occupancy_status VACANT, booked_showing_count 0, disposition_mode NONE, version 1."
      - "property_tax_annual_cents computed as round_half_up(assessed_value_cents * Market.millage_bps / 10000)."
      - "leasing_posture computed by calculations.home_leasing_posture (RESTRICTED for a PIPELINE home with a live binder and no blocking obligation)."
      - "hold_sell_score_bps 0 and disposition_flagged false until an underwriting case is realized."
  - method: GET
    path: /homes/{homeId}
    purpose: Reads one home with its posture and disposition fields.
    roles: [PortfolioAdmin, OperationsManager, LeasingAgent, ComplianceOfficer, AcquisitionAnalyst, InvestmentCommittee, RegionalDirector, VendorManager]
    input: []
    output: Home
    side_effects: []
  - method: GET
    path: /homes
    purpose: Lists homes, filterable across both state dimensions and the disposition flag.
    roles: [PortfolioAdmin, OperationsManager, LeasingAgent, ComplianceOfficer, AcquisitionAnalyst, InvestmentCommittee, RegionalDirector, VendorManager]
    input: ["market_id?", "asset_status?", "occupancy_status?", "leasing_posture?", "disposition_flagged?", "lot_code?", "limit?", "offset?"]
    output: Home[]
    side_effects: []
  - method: PATCH
    path: /homes/{homeId}
    purpose: Updates the mutable underwriting, insurance and HOA facts of a home.
    roles: [PortfolioAdmin, AcquisitionAnalyst]
    input: ["asking_rent_cents?", "assessed_value_cents?", "insurance_carrier_name?", "insurance_annual_premium_cents?", "insurance_binder_expires_on?", "hoa_name?", "hoa_annual_cents?"]
    output: Home
    side_effects:
      - "Overwrites only the supplied fields; asset_status, occupancy_status and every computed field are ignored if present in the payload."
      - "Recomputes property_tax_annual_cents whenever assessed_value_cents changes."
      - "Recomputes leasing_posture whenever insurance_binder_expires_on changes, which may move AVAILABLE showing slots to BLOCKED_BY_POSTURE or back."
      - "Increments version by 1."
  - method: GET
    path: /homes/{homeId}/leasing-posture
    purpose: Computed read of the home's posture together with the clause that produced it and the obligations that are blocking.
    roles: [PortfolioAdmin, OperationsManager, LeasingAgent, ComplianceOfficer, RegionalDirector]
    input: []
    output: "{ home_id: string, leasing_posture: string, deciding_clause: integer, blocking_obligation_ids: string[], binder_expired: boolean }"
    side_effects: []
  - method: POST
    path: /homes/{homeId}/disposition-decision
    purpose: Approves or closes an individual-asset or portfolio-lot sale of a home.
    roles: [InvestmentCommittee]
    input: [decision, "disposition_mode?", "bpo_value_cents?", "lot_code?", "net_sale_proceeds_cents?"]
    output: Home
    side_effects:
      - "decision APPROVE_SALE: asset_status STABILIZED -> DISPOSITION_APPROVED; disposition_mode, bpo_value_cents and lot_code stored."
      - "decision CLOSE_SALE: asset_status DISPOSITION_APPROVED -> DISPOSED; net_sale_proceeds_cents stored; realized_gain_cents computed against the case basis; leasing_posture becomes FROZEN and AVAILABLE slots move to BLOCKED_BY_POSTURE."
      - "Increments version by 1."

  # ---- UnderwritingCase -----------------------------------------------------
  - method: POST
    path: /underwriting-cases
    purpose: Opens an acquisition underwriting case with planned renovation scope and a rent estimate.
    roles: [AcquisitionAnalyst]
    input: [home_id, expected_home_version, purchase_price_cents, acquisition_closing_costs_cents, estimated_monthly_rent_cents, turn_reserve_annual_cents, planned_scope_lines]
    output: UnderwritingCase
    side_effects:
      - "Rejects with ERR_STALE_HOME_VERSION (412) when expected_home_version != Home.version."
      - "Moves every prior UnderwritingCase for the same home whose status is in {DRAFT, SUBMITTED, REVISION_REQUESTED} to SUPERSEDED."
      - "Creates the case in DRAFT with revision_round 0, submitted_by_user_id and decided_by_user_id empty."
      - "planned_renovation_budget_cents computed by calculations.scope_benchmark_total; every underwritten_* field computed by the underwritten variant of calculations.yield_on_cost."
  - method: GET
    path: /underwriting-cases/{caseId}
    purpose: Reads one underwriting case with both underwritten and realized field groups.
    roles: [AcquisitionAnalyst, InvestmentCommittee, PortfolioAdmin, RegionalDirector, OperationsManager]
    input: []
    output: UnderwritingCase
    side_effects: []
  - method: GET
    path: /underwriting-cases
    purpose: Lists underwriting cases.
    roles: [AcquisitionAnalyst, InvestmentCommittee, PortfolioAdmin, RegionalDirector, OperationsManager]
    input: ["home_id?", "status?", "limit?", "offset?"]
    output: UnderwritingCase[]
    side_effects: []
  - method: POST
    path: /underwriting-cases/{caseId}/submit
    purpose: Submits a drafted case to the investment committee.
    roles: [AcquisitionAnalyst]
    input: []
    output: UnderwritingCase
    side_effects:
      - "status DRAFT -> SUBMITTED; submitted_by_user_id stamped from X-User-ID."
      - "Recomputes planned_renovation_budget_cents and the underwritten_* group before the yield floor is checked."
      - "Rejects with ERR_YIELD_BELOW_FLOOR when underwritten_yield_on_cost_bps < Market.underwriting_yield_floor_bps."
  - method: POST
    path: /underwriting-cases/{caseId}/decision
    purpose: Records the investment committee's approve, reject or revision decision.
    roles: [InvestmentCommittee]
    input: [decision, "decision_note?"]
    output: UnderwritingCase
    side_effects:
      - "APPROVE: status SUBMITTED -> APPROVED; decided_by_user_id stamped; cascades Home.asset_status PIPELINE -> ACQUIRED and recomputes Home.leasing_posture."
      - "REJECT: status SUBMITTED -> REJECTED; cascades Home.asset_status PIPELINE -> PASSED, Home.leasing_posture -> FROZEN, and AVAILABLE showing slots -> BLOCKED_BY_POSTURE."
      - "REQUEST_REVISION: status SUBMITTED -> REVISION_REQUESTED; Home is untouched; refused with ERR_REVISION_LIMIT_EXCEEDED once revision_round has reached 2."
      - "Refused with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals submitted_by_user_id."
  - method: POST
    path: /underwriting-cases/{caseId}/revise
    purpose: Reworks a case the committee sent back, reopening the revision cycle.
    roles: [AcquisitionAnalyst]
    input: ["purchase_price_cents?", "acquisition_closing_costs_cents?", "estimated_monthly_rent_cents?", "turn_reserve_annual_cents?", "planned_scope_lines?"]
    output: UnderwritingCase
    side_effects:
      - "status REVISION_REQUESTED -> DRAFT; revision_round incremented by 1; submitted_by_user_id cleared."
      - "Overwrites only the supplied fields, then recomputes planned_renovation_budget_cents and the whole underwritten_* group."

  # ---- Vendor ---------------------------------------------------------------
  - method: POST
    path: /vendors
    purpose: Onboards a renovation or maintenance vendor into one market.
    roles: [VendorManager]
    input: [legal_name, market_id, daily_crew_capacity, cost_index_bps, quality_score_bps, insurance_expires_on]
    output: Vendor
    side_effects:
      - "Creates the Vendor with status ACTIVE, committed_crew_days 0, suspension_reason empty."
  - method: GET
    path: /vendors/{vendorId}
    purpose: Reads one vendor with its live crew-day commitment.
    roles: [VendorManager, OperationsManager, PortfolioAdmin, RegionalDirector, Vendor]
    input: []
    output: Vendor
    side_effects: []
  - method: GET
    path: /vendors
    purpose: Lists vendors.
    roles: [VendorManager, OperationsManager, PortfolioAdmin, RegionalDirector]
    input: ["market_id?", "status?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []
  - method: PATCH
    path: /vendors/{vendorId}
    purpose: Updates a vendor's commercial and capacity parameters.
    roles: [VendorManager]
    input: ["daily_crew_capacity?", "cost_index_bps?", "quality_score_bps?", "insurance_expires_on?"]
    output: Vendor
    side_effects:
      - "Overwrites only the supplied fields; committed_crew_days and status are never writable here."
      - "Lowering daily_crew_capacity does not retroactively invalidate already DISPATCHED or ACCEPTED work orders; it only affects the next dispatch."
      - "Increments version by 1."
  - method: POST
    path: /vendors/{vendorId}/status
    purpose: Suspends or reactivates a vendor.
    roles: [VendorManager]
    input: [status, "suspension_reason?"]
    output: Vendor
    side_effects:
      - "Sets status to ACTIVE or SUSPENDED and stores suspension_reason."
      - "A SUSPENDED vendor is excluded from calculations.vendor_dispatch_selection and cannot be named explicitly on a dispatch, but its already ACCEPTED work orders may still be completed."

  # ---- VendorCertification --------------------------------------------------
  - method: POST
    path: /vendor-certifications
    purpose: Records a dated trade certification that qualifies a vendor for scope templates carrying the same certification_code.
    roles: [VendorManager]
    input: [vendor_id, certification_code, effective_on, expires_on]
    output: VendorCertification
    side_effects:
      - "Creates the certification with status ACTIVE."
      - "Rejects with ERR_DUPLICATE_CERTIFICATION when the vendor already holds an ACTIVE certification with the same certification_code."
  - method: GET
    path: /vendor-certifications/{certificationId}
    purpose: Reads one vendor certification.
    roles: [VendorManager, OperationsManager, PortfolioAdmin, RegionalDirector, Vendor]
    input: []
    output: VendorCertification
    side_effects: []
  - method: GET
    path: /vendor-certifications
    purpose: Lists vendor certifications, filterable by vendor.
    roles: [VendorManager, OperationsManager, PortfolioAdmin, RegionalDirector, Vendor]
    input: ["vendor_id?", "certification_code?", "status?", "limit?", "offset?"]
    output: VendorCertification[]
    side_effects: []
  - method: POST
    path: /vendor-certifications/{certificationId}/revoke
    purpose: Revokes a certification, immediately disqualifying the vendor for that trade.
    roles: [VendorManager]
    input: [reason]
    output: VendorCertification
    side_effects:
      - "Sets status to REVOKED. Future dispatches of scope templates with that certification_code fail with ERR_VENDOR_NOT_CERTIFIED; existing DISPATCHED and ACCEPTED work orders are not disturbed."

  # ---- RenovationProject ----------------------------------------------------
  - method: POST
    path: /renovation-projects
    purpose: Opens the make-ready or turn project for an acquired home.
    roles: [OperationsManager]
    input: [home_id, project_type, approved_budget_cents]
    output: RenovationProject
    side_effects:
      - "Creates the project in SCOPING with committed_cost_cents 0, budget_remaining_cents = approved_budget_cents, and every turn_* / holdback field 0."
      - "Refused with ERR_CASE_NOT_APPROVED when the home has no UnderwritingCase in status APPROVED."
      - "Refused with ERR_DUPLICATE_PROJECT_FOR_HOME when the home already has a project in status SCOPING or IN_PROGRESS; a home whose previous project reached RENT_READY may open a later TURN project, which then has to satisfy V400 on lock-scope."
  - method: GET
    path: /renovation-projects/{projectId}
    purpose: Reads one project with its budget ledger and turn metrics.
    roles: [OperationsManager, PortfolioAdmin, RegionalDirector, AcquisitionAnalyst, LeasingAgent]
    input: []
    output: RenovationProject
    side_effects: []
  - method: GET
    path: /renovation-projects
    purpose: Lists renovation projects.
    roles: [OperationsManager, PortfolioAdmin, RegionalDirector, AcquisitionAnalyst, LeasingAgent]
    input: ["home_id?", "status?", "project_type?", "limit?", "offset?"]
    output: RenovationProject[]
    side_effects: []
  - method: POST
    path: /renovation-projects/{projectId}/budget
    purpose: Revises the approved budget of a project.
    roles: [OperationsManager, RegionalDirector]
    input: [approved_budget_cents]
    output: RenovationProject
    side_effects:
      - "Sets approved_budget_cents and recomputes budget_remaining_cents = approved_budget_cents - committed_cost_cents."
      - "Refused with ERR_BUDGET_BELOW_COMMITTED when the new budget is below committed_cost_cents."
      - "Increments version by 1."
  - method: POST
    path: /renovation-projects/{projectId}/lock-scope
    purpose: Freezes the scope set and starts the make-ready clock.
    roles: [OperationsManager]
    input: [turn_started_on]
    output: RenovationProject
    side_effects:
      - "status SCOPING -> IN_PROGRESS; turn_started_on stored."
      - "Refused with ERR_PROJECT_SCOPE_EMPTY when the project has zero work orders in a non-VOIDED status."
      - "Refused with ERR_HOME_NOT_ACQUIRED when Home.asset_status != ACQUIRED."
      - "Cascade hop 2: Home.asset_status ACQUIRED -> RENOVATING and Home.leasing_posture recomputed to FROZEN."
      - "Cascade hop 3: every ShowingSlot on the home with status AVAILABLE moves to BLOCKED_BY_POSTURE, because a RENOVATING home is FROZEN. Slots already BOOKED are left untouched."
  - method: GET
    path: /renovation-projects/{projectId}/benchmark-summary
    purpose: Computed read of the project's per-line benchmark, the sum of the rounded per-line benchmarks, and the naive index-the-sum figure for comparison.
    roles: [OperationsManager, PortfolioAdmin, RegionalDirector, AcquisitionAnalyst]
    input: []
    output: "{ project_id: string, line_count: integer, per_line_benchmark_cents: integer[], scope_benchmark_total_cents: integer, index_the_sum_total_cents: integer, quoted_total_cents: integer, committed_cost_cents: integer, budget_remaining_cents: integer }"
    side_effects: []

  # ---- WorkOrder ------------------------------------------------------------
  - method: POST
    path: /work-orders
    purpose: Creates a standardized-scope work order for a home, optionally inside a renovation project.
    roles: [OperationsManager]
    input: [home_id, scope_template_id, work_type, quantity, crew_size, scheduled_start_date, scheduled_end_date, fulfillment_channel, quoted_cost_cents, "project_id?"]
    output: WorkOrder
    side_effects:
      - "Creates the work order in PENDING_DISPATCH with vendor_id empty."
      - "benchmark_total_cents and variance_bps computed by calculations.scope_benchmark_total; crew_days computed by calculations.work_order_crew_days."
      - "Refused with ERR_COST_VARIANCE_EXCEEDED when variance_bps > Market.cost_variance_tolerance_bps."
      - "When project_id is supplied: RenovationProject.committed_cost_cents += quoted_cost_cents and budget_remaining_cents -= quoted_cost_cents, refused with ERR_PROJECT_BUDGET_EXCEEDED when the new committed total would exceed approved_budget_cents."
      - "Refused with ERR_PROJECT_SCOPE_LOCKED when the referenced project is already RENT_READY."
  - method: GET
    path: /work-orders/{workOrderId}
    purpose: Reads one work order with its benchmark and variance.
    roles: [OperationsManager, PortfolioAdmin, RegionalDirector, VendorManager, Vendor, ComplianceOfficer]
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: /work-orders
    purpose: Lists work orders, filterable by home, project, vendor and scope template.
    roles: [OperationsManager, PortfolioAdmin, RegionalDirector, VendorManager, Vendor, ComplianceOfficer]
    input: ["home_id?", "project_id?", "vendor_id?", "scope_template_id?", "status?", "work_type?", "fulfillment_channel?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: GET
    path: /work-orders/{workOrderId}/vendor-ranking
    purpose: Computed read of the eligible-vendor ranking that a dispatch without an explicit vendor_id would use.
    roles: [OperationsManager, PortfolioAdmin, RegionalDirector, VendorManager]
    input: []
    output: "{ work_order_id: string, eligible_vendor_ids: string[], bid_cents: integer[], excluded_vendor_ids: string[], exclusion_reasons: string[], winning_vendor_id: string }"
    side_effects: []
    note: >
      eligible_vendor_ids is ordered by the ranking of calculations.vendor_dispatch_selection and
      bid_cents is positionally aligned with it; winning_vendor_id is the first element, or the empty
      string when the eligible set is empty. excluded_vendor_ids lists every same-market vendor that
      failed the eligibility filter and exclusion_reasons is positionally aligned with it, each entry
      being the error_id of the first eligibility clause that vendor failed: ERR_VENDOR_INACTIVE,
      ERR_VENDOR_INSURANCE_EXPIRED, ERR_VENDOR_NOT_CERTIFIED or ERR_VENDOR_CAPACITY_EXCEEDED.
  - method: POST
    path: /work-orders/{workOrderId}/dispatch
    purpose: Dispatches the work order to a vendor crew or to the in-house technician bench.
    roles: [OperationsManager]
    input: ["vendor_id?"]
    output: WorkOrder
    side_effects:
      - "fulfillment_channel VENDOR: status PENDING_DISPATCH -> DISPATCHED; vendor_id set from the payload or from the winner of calculations.vendor_dispatch_selection; Vendor.committed_crew_days += crew_days."
      - "fulfillment_channel IN_HOUSE: status PENDING_DISPATCH -> IN_PROGRESS; vendor_id stays empty; no vendor capacity consumed; refused with ERR_IN_HOUSE_SAFETY_CRITICAL when the scope template is safety_critical."
      - "Vendor eligibility failures surface as ERR_VENDOR_INACTIVE, ERR_VENDOR_INSURANCE_EXPIRED, ERR_VENDOR_NOT_CERTIFIED, ERR_MARKET_MISMATCH, ERR_VENDOR_CAPACITY_EXCEEDED or ERR_NO_ELIGIBLE_VENDOR."
  - method: POST
    path: /work-orders/{workOrderId}/accept
    purpose: The assigned vendor accepts the dispatched work order.
    roles: [Vendor]
    input: []
    output: WorkOrder
    side_effects:
      - "status DISPATCHED -> ACCEPTED. Refused with ERR_NOT_ASSIGNED_VENDOR when X-User-ID != vendor_id."
  - method: POST
    path: /work-orders/{workOrderId}/complete
    purpose: Closes out the work order with its actual cost, driving the project, home and underwriting cascade.
    roles: [Vendor, OperationsManager]
    input: [actual_cost_cents, completed_on]
    output: WorkOrder
    side_effects:
      - "Hop 1: status ACCEPTED -> COMPLETED (vendor channel) or IN_PROGRESS -> COMPLETED (in-house channel); actual_cost_cents and completed_on stored; Vendor.committed_crew_days -= crew_days for the vendor channel only."
      - "Hop 2: when the project has no work order left in {PENDING_DISPATCH, DISPATCHED, ACCEPTED, IN_PROGRESS} and at least one COMPLETED, RenovationProject IN_PROGRESS -> RENT_READY and calculations.turn_holdback writes turn_days, overage_days, gross_turn_cost_cents, holdback_rate_bps, vendor_holdback_cents and net_turn_cost_cents."
      - "Hop 3: Home.asset_status RENOVATING -> STABILIZED and Home.leasing_posture recomputed."
      - "Hop 4a: every ShowingSlot on the home with status BLOCKED_BY_POSTURE returns to AVAILABLE when the recomputed posture is OPEN or RESTRICTED."
      - "Hop 4b: the home's APPROVED UnderwritingCase realized_* group recomputed by the realized variant of calculations.yield_on_cost, then Home.hold_sell_score_bps and Home.disposition_flagged recomputed."
  - method: POST
    path: /work-orders/{workOrderId}/void
    purpose: Cancels a work order and returns its money and crew days.
    roles: [OperationsManager]
    input: [void_reason]
    output: WorkOrder
    side_effects:
      - "status -> VOIDED from PENDING_DISPATCH, DISPATCHED, ACCEPTED or IN_PROGRESS."
      - "RenovationProject.committed_cost_cents -= quoted_cost_cents and budget_remaining_cents += quoted_cost_cents, restoring committed_cost_cents + budget_remaining_cents == approved_budget_cents."
      - "Vendor.committed_crew_days -= crew_days when the work order was DISPATCHED or ACCEPTED; no crew-day change for PENDING_DISPATCH or IN_PROGRESS."
      - "Re-evaluates the project's RENT_READY precondition set and may trigger the same hop 2/3/4 cascade as complete."

  # ---- Prospect -------------------------------------------------------------
  - method: POST
    path: /prospects
    purpose: Registers a self-showing prospect with declared, unverified financials.
    roles: [Anonymous, LeasingAgent]
    input: [email, full_name, phone, market_id, declared_monthly_income_cents, credit_tier, prior_eviction_count]
    output: Prospect
    side_effects:
      - "Creates the prospect with identity_status UNVERIFIED, verification_attempt_count 0, verified_monthly_income_cents 0, document_match_score_bps 0, selfie_liveness_pass false, device_reputation_bps 0, ip_geo_distance_km 0."
      - "fraud_risk_score_bps computed by the pre_verification variant of calculations.prospect_fraud_risk_score; fraud_score_variant PRE_VERIFICATION."
  - method: GET
    path: /prospects/{prospectId}
    purpose: Reads one prospect with the live fraud score and the variant that produced it.
    roles: [LeasingAgent, PortfolioAdmin, RegionalDirector, Prospect]
    input: []
    output: Prospect
    side_effects: []
  - method: GET
    path: /prospects
    purpose: Lists prospects.
    roles: [LeasingAgent, PortfolioAdmin, RegionalDirector]
    input: ["market_id?", "identity_status?", "credit_tier?", "limit?", "offset?"]
    output: Prospect[]
    side_effects: []
  - method: POST
    path: /prospects/{prospectId}/identity-verifications
    purpose: Submits an identity-verification attempt carrying document, liveness, income, device and geo signals.
    roles: [Anonymous, Prospect]
    input: [expected_prospect_version, document_type, document_match_score_bps, selfie_liveness_pass, verified_monthly_income_cents, device_reputation_bps, ip_geo_distance_km]
    output: Prospect
    side_effects:
      - "Rejects with ERR_STALE_PROSPECT_VERSION (412) when expected_prospect_version != Prospect.version."
      - "identity_status becomes VERIFIED when selfie_liveness_pass is true and document_match_score_bps >= 5000, otherwise REJECTED. Re-verification is permitted from any status, including VERIFIED -> VERIFIED."
      - "verification_attempt_count incremented; every supplied signal overwritten."
      - "fraud_risk_score_bps recomputed by the post_verification variant; fraud_score_variant POST_VERIFICATION."
      - "On a VERIFIED -> REJECTED transition, every BOOKED ShowingSlot of this prospect returns to AVAILABLE with prospect_id cleared and Home.booked_showing_count decremented."
      - "Increments version by 1."

  # ---- ShowingSlot ----------------------------------------------------------
  - method: POST
    path: /showing-slots
    purpose: Publishes a self-showing window on a home's access calendar.
    roles: [LeasingAgent]
    input: [home_id, starts_at, ends_at, access_mode]
    output: ShowingSlot
    side_effects:
      - "Creates the slot in AVAILABLE with prospect_id and cancel_reason empty."
      - "Refused with ERR_SLOT_DURATION_INVALID when the window is shorter than Market.min_showing_duration_minutes."
      - "Refused with ERR_SLOT_IN_PAST when starts_at is before the logical clock instant."
      - "Refused with ERR_SHOWING_SLOT_OVERLAP when the half-open interval [starts_at, ends_at) overlaps, or sits closer than Market.showing_buffer_minutes to, an existing AVAILABLE / BOOKED / BLOCKED_BY_POSTURE slot on the same home."
  - method: GET
    path: /showing-slots/{slotId}
    purpose: Reads one showing slot.
    roles: [LeasingAgent, PortfolioAdmin, RegionalDirector, Prospect]
    input: []
    output: ShowingSlot
    side_effects: []
  - method: GET
    path: /showing-slots
    purpose: Lists showing slots, filterable by home and by the prospect who booked them.
    roles: [LeasingAgent, PortfolioAdmin, RegionalDirector, Prospect]
    input: ["home_id?", "prospect_id?", "status?", "access_mode?", "limit?", "offset?"]
    output: ShowingSlot[]
    side_effects: []
  - method: POST
    path: /showing-slots/{slotId}/book
    purpose: A verified prospect books a self-showing window.
    roles: [Prospect]
    input: [prospect_id]
    output: ShowingSlot
    side_effects:
      - "status AVAILABLE -> BOOKED; prospect_id stored; Home.booked_showing_count += 1."
      - "Refused with ERR_SHOWING_SLOT_NOT_AVAILABLE (priority 302) when the slot is not AVAILABLE."
      - "Refused with ERR_PROSPECT_IDENTITY_UNVERIFIED (priority 420) when identity_status != VERIFIED, and with ERR_PROSPECT_FRAUD_BLOCKED (priority 422) when fraud_risk_score_bps > Market.fraud_block_threshold_bps."
      - "Refused with ERR_HOME_SHOWINGS_BLOCKED (priority 500) when calculations.home_leasing_posture yields FROZEN."
  - method: POST
    path: /showing-slots/{slotId}/cancel
    purpose: Releases a booked slot back to the calendar, or withdraws an unbooked slot entirely.
    roles: [Prospect, LeasingAgent]
    input: [reason]
    output: ShowingSlot
    side_effects:
      - "From BOOKED: status -> AVAILABLE, prospect_id cleared, Home.booked_showing_count -= 1."
      - "From AVAILABLE and called by a LeasingAgent: status -> CANCELLED, and the interval stops blocking new slots."
      - "Refused with ERR_NOT_SLOT_OWNER when the caller role is Prospect and X-User-ID != prospect_id."

  # ---- RentalApplication ----------------------------------------------------
  - method: POST
    path: /rental-applications
    purpose: Submits a rental application against one home under the market's standardized pet and lease policy.
    roles: [Prospect, LeasingAgent]
    input: [prospect_id, home_id, requested_move_in_date, lease_term_months, pet_count, pet_breeds]
    output: RentalApplication
    side_effects:
      - "Creates the application in SUBMITTED with every deposit and score field 0 and adverse_action_reason NONE."
      - "Refused with ERR_PROSPECT_IDENTITY_UNVERIFIED when identity_status != VERIFIED, ERR_MARKET_MISMATCH on a cross-market prospect, ERR_RESTRICTED_BREED on a breed in Market.restricted_breeds, ERR_PET_COUNT_EXCEEDED when pet_count > Market.max_pets or pet_breeds length != pet_count, and ERR_DUPLICATE_APPLICATION on a second SUBMITTED application for the same pair."
  - method: GET
    path: /rental-applications/{applicationId}
    purpose: Reads one application with its screening outcome and deposit stack.
    roles: [LeasingAgent, PortfolioAdmin, RegionalDirector, Prospect]
    input: []
    output: RentalApplication
    side_effects: []
  - method: GET
    path: /rental-applications
    purpose: Lists rental applications, filterable by prospect and home.
    roles: [LeasingAgent, PortfolioAdmin, RegionalDirector, Prospect]
    input: ["prospect_id?", "home_id?", "status?", "adverse_action_reason?", "limit?", "offset?"]
    output: RentalApplication[]
    side_effects: []
  - method: POST
    path: /rental-applications/{applicationId}/screen
    purpose: Runs resident screening, producing the three-way approval fork and the deposit stack.
    roles: [LeasingAgent]
    input: []
    output: RentalApplication
    side_effects:
      - "status SUBMITTED -> APPROVED, CONDITIONAL_APPROVED or DENIED per calculations.screening_decision."
      - "Writes rent_to_income_bps, risk_multiplier_bps, security_deposit_cents, pet_deposit_cents, total_move_in_deposit_cents and adverse_action_reason."
      - "APPROVED and CONDITIONAL_APPROVED cascade Home.occupancy_status VACANT -> RESERVED; DENIED does not touch the home."
      - "Refused with ERR_HOME_NOT_VACANT when occupancy_status != VACANT and with ERR_HOME_SHOWINGS_BLOCKED when posture is FROZEN."

  # ---- Lease ----------------------------------------------------------------
  - method: POST
    path: /leases
    purpose: Drafts the standardized lease for an approved application.
    roles: [LeasingAgent, RegionalDirector]
    input: [application_id, start_date, term_months, monthly_rent_cents]
    output: Lease
    side_effects:
      - "Creates the lease in DRAFT; home_id copied from the application; required_deposit_cents copied from RentalApplication.total_move_in_deposit_cents; deposit_paid_cents 0."
      - "Refused with ERR_APPLICATION_NOT_APPROVED, ERR_LEASE_ALREADY_EXISTS, ERR_RENT_CONCESSION_EXCEEDED (monthly_rent_cents below the market concession floor) and ERR_LEASE_TERM_INVALID (term_months != Market.standard_lease_term_months unless the caller is RegionalDirector)."
  - method: GET
    path: /leases/{leaseId}
    purpose: Reads one lease with its deposit funding position.
    roles: [LeasingAgent, PortfolioAdmin, RegionalDirector, Prospect]
    input: []
    output: Lease
    side_effects: []
  - method: GET
    path: /leases
    purpose: Lists leases, filterable by application and home.
    roles: [LeasingAgent, PortfolioAdmin, RegionalDirector, Prospect]
    input: ["application_id?", "home_id?", "status?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []
  - method: POST
    path: /leases/{leaseId}/deposit-payments
    purpose: Records a move-in deposit payment against a drafted lease. This is a funding ledger entry only and never moves the lease's status.
    roles: [LeasingAgent]
    input: [amount_cents]
    output: Lease
    side_effects:
      - "deposit_paid_cents += amount_cents. The lease stays in DRAFT no matter how much has been paid."
      - "Refused with ERR_DEPOSIT_OVERPAYMENT when deposit_paid_cents + amount_cents > required_deposit_cents."
      - "Increments version by 1."
  - method: POST
    path: /leases/{leaseId}/execute
    purpose: Executes a fully funded lease on an OPEN home.
    roles: [LeasingAgent]
    input: [signed_on]
    output: Lease
    side_effects:
      - "status DRAFT -> EXECUTED; signed_on stored."
      - "Refused with ERR_HOME_LEASING_FROZEN (priority 502) when calculations.home_leasing_posture is not exactly OPEN, and with ERR_DEPOSIT_NOT_FUNDED (priority 602) when deposit_paid_cents < required_deposit_cents. When both hold, ERR_HOME_LEASING_FROZEN wins."
      - "Cascades Home.occupancy_status RESERVED -> OCCUPIED and cancels every AVAILABLE ShowingSlot on the home with cancel_reason HOME_LEASED."
      - "Recomputes the home's APPROVED UnderwritingCase realized_* group off the executed rent, then Home.hold_sell_score_bps and Home.disposition_flagged."
  - method: POST
    path: /leases/{leaseId}/void
    purpose: Voids a drafted lease and releases the home's occupancy dimension.
    roles: [LeasingAgent, RegionalDirector]
    input: [reason]
    output: Lease
    side_effects:
      - "status DRAFT -> VOIDED; void_reason stored."
      - "Compensating cascade: Home.occupancy_status RESERVED -> VACANT, so the home can be re-reserved by another application."

  # ---- ComplianceObligation -------------------------------------------------
  - method: POST
    path: /compliance-obligations
    purpose: Opens an HOA violation, insurance deficiency or property tax appeal against a home.
    roles: [ComplianceOfficer]
    input: [home_id, obligation_type, severity, description, due_on, "assessed_value_cents?", "target_value_cents?", "consultant_fee_bps?", "supersedes_obligation_id?"]
    output: ComplianceObligation
    side_effects:
      - "Creates the obligation in OPEN with resolution_round 0 and submitted_by_user_id empty."
      - "assessed_value_cents is the appeal's starting basis: required for PROPERTY_TAX_APPEAL, and 0 for HOA_VIOLATION and INSURANCE_DEFICIENCY."
      - "Recomputes Home.leasing_posture: a CRITICAL obligation drives FROZEN and moves AVAILABLE showing slots to BLOCKED_BY_POSTURE; a MAJOR obligation drives RESTRICTED; a MINOR obligation changes nothing."
  - method: GET
    path: /compliance-obligations/{obligationId}
    purpose: Reads one obligation with its tax-appeal economics.
    roles: [ComplianceOfficer, PortfolioAdmin, RegionalDirector, OperationsManager, LeasingAgent]
    input: []
    output: ComplianceObligation
    side_effects: []
  - method: GET
    path: /compliance-obligations
    purpose: Lists obligations, filterable by home, superseded predecessor and remediation work order.
    roles: [ComplianceOfficer, PortfolioAdmin, RegionalDirector, OperationsManager, LeasingAgent]
    input: ["home_id?", "supersedes_obligation_id?", "work_order_id?", "obligation_type?", "severity?", "status?", "limit?", "offset?"]
    output: ComplianceObligation[]
    side_effects: []
  - method: POST
    path: /compliance-obligations/{obligationId}/plan
    purpose: Commits a cure plan, optionally attaching the remediation work order.
    roles: [ComplianceOfficer]
    input: [planned_resolution_on, "work_order_id?"]
    output: ComplianceObligation
    side_effects:
      - "status OPEN -> PLANNED, or RESOLUTION_REJECTED -> PLANNED with resolution_round incremented by 1."
      - "Refused with ERR_OBLIGATION_PAST_DUE when planned_resolution_on > due_on and with ERR_OBLIGATION_WORK_ORDER_MISMATCH when the work order belongs to another home or is VOIDED."
  - method: POST
    path: /compliance-obligations/{obligationId}/submit-resolution
    purpose: Submits evidence, or the negotiated assessment, for review.
    roles: [ComplianceOfficer]
    input: ["evidence_ref?", "settled_value_cents?"]
    output: ComplianceObligation
    side_effects:
      - "status PLANNED -> RESOLUTION_SUBMITTED; submitted_by_user_id stamped from X-User-ID."
      - "PROPERTY_TAX_APPEAL requires settled_value_cents in [1, Home.assessed_value_cents] or fails with ERR_SETTLED_VALUE_INVALID; HOA_VIOLATION and INSURANCE_DEFICIENCY require a non-empty evidence_ref or fail with ERR_EVIDENCE_REQUIRED."
  - method: POST
    path: /compliance-obligations/{obligationId}/review-resolution
    purpose: Accepts, rejects or waives a submitted resolution, driving the tax-appeal cascade.
    roles: [ComplianceOfficer, RegionalDirector]
    input: [decision, "review_note?"]
    output: ComplianceObligation
    side_effects:
      - "ACCEPT: status -> RESOLVED. For PROPERTY_TAX_APPEAL, hop 1 writes annual_tax_savings_cents, consultant_fee_cents and net_tax_benefit_cents; hop 2 sets Home.assessed_value_cents := settled_value_cents and recomputes Home.property_tax_annual_cents; hop 3 recomputes the home's APPROVED UnderwritingCase realized_noi_cents and realized_yield_on_cost_bps; hop 4 recomputes Home.hold_sell_score_bps and Home.disposition_flagged."
      - "REJECT: status -> RESOLUTION_REJECTED and submitted_by_user_id cleared, reopening the cure cycle."
      - "WAIVE: status -> WAIVED, permitted only for HOA_VIOLATION obligations whose severity is MINOR or MAJOR, otherwise ERR_CRITICAL_OBLIGATION_NOT_WAIVABLE."
      - "Every branch recomputes Home.leasing_posture and may move BLOCKED_BY_POSTURE slots back to AVAILABLE."
      - "Refused with ERR_SEGREGATION_OF_DUTIES when X-User-ID equals submitted_by_user_id."

