              captures: { err: $.data.error_id }
          assert:
            - "The trigger sends X-User-Role: ShiftLeader with NO X-User-ID header at all (empty as_user_id)"
            - "HTTP 401 and ${err} == ERR_UNAUTHENTICATED"
            - "${err} != ERR_STAFF_SCOPE_MISMATCH and != ERR_UNAUTHORIZED — authentication precedes both authorisation and scope resolution"
