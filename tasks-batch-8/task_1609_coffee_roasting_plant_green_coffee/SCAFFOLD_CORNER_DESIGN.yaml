            - call: "POST /roastery/recipes/${r1_ora}/components"
              payload: { required_grade: "SHB", component_pct: 1.0 }
              as: HeadRoaster
            - call: "POST /roastery/recipes/${r1_ora}/approve"
              payload: { expected_product_version: "${prod_ora_v0}" }
              as: HeadRoaster
            - call: "POST /roastery/products/${prod_ora}/recipes"
              as: HeadRoaster
              captures: { r2_ora: $.data.id }
            - call: "POST /roastery/recipes/${r2_ora}/components"
              payload: { required_grade: "HG", component_pct: 1.0 }
              as: HeadRoaster
          trigger:
            - call: "POST /roastery/recipes/${r2_ora}/approve"
              payload: { expected_product_version: "${prod_ora_v0}" }
              as: HeadRoaster
              captures: { ora_err: $.data.error_id }
          assert:
            - "ora_err == ERR_STALE_VERSION (first approve already advanced Product.version)"
            - "HTTP status == 412"

      - name: derived_field_position_open_to_sell_reconciles_on_void
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.calc_warehouse_position"
          - "complexity_profile.complexity_layers"
        distinguishing_aspect: "WarehousePosition.open_to_sell_lbs is derived from GreenLot, RoastInputAllocation, FinancingReserve; a batch void releases the allocation and the derived field reconciles immediately (immediate consistency)."
        test_recipe:
          setup: ["RELEASED lot 2000 lbs; batch scheduled for 700 lbs commits them; then void releases."]
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-DF", legal_name: "DerivedF", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
