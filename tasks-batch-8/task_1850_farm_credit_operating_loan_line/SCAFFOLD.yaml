# =============================================================================
# Task 1850: Farm Credit Operating Loan & Line — scaffold seed tables
# =============================================================================

scenario: |
  1850. Farm Credit Operating Loan & Line (Farm Credit System association): borrowing
  base from crop budget & collateral, seasonal draw/repayment cycle tied to harvest,
  crop insurance assignment & lender loss payee, chattel/real-estate security & UCC
  filing, covenant (working capital) monitoring, restructure on bad crop year,
  patronage dividend from lender co-op, disaster/deferral request

domain_name: farm-credit-operating-loan-line
api_prefix: ""

# =============================================================================
# Complexity Profile (Step 0)
# =============================================================================
complexity_profile:
  primary_archetype: quota / allocation        # finite, time-varying borrowing base competed for by draws, reserved on approval, released on deny/cancel/rescind
  secondary_archetype: compliance / audit      # insurance loss-payee gating, UCC perfection windows, covenant monitoring, segregation of duties
  complexity_layers:
    - optimistic_concurrency                   # OCC on LoanAccount.version (budget supersede, plan supersede) and Collateral.version (appraisal supersede)
    - cascading_side_effects                   # claim-payment and filing-lapse cascades span 3+ entities
    - dual_variant_calculation                 # borrowing base provisional vs harvest true-up; restructure annuity vs balloon
    - ops_run_checkpoint                       # POST /associations/{id}/run_periodic_review advances review_index, lapses filings, activates/expires deferrals, recomputes posture
  entity_topology: flat                        # peer entities joined by FK references; no URL nesting
  state_machine_shape: cyclic                  # restructure revision loop, claim appeal loop, cure loops; LoanAccount carries two independent state dimensions (status x payment_posture)
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties            # recorder vs waver on covenants; creator vs approver on restructures; adjuster vs lender on claims
  consistency_model: immediate                 # every mutation's effects visible in the same response
  entity_count: 15
  state_machine_count: 15
  calculation_count: 10
  endpoint_count: 86
  error_code_count: 34
  role_count: 6

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Association
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Association display name" }
      - { name: charter_number, type: string, source: input, description: "Farm Credit System charter number" }
      - { name: review_index, type: integer, source: system, default: 0, description: "Monotonic ops-run counter, increments by 1 on each run_periodic_review" }
      - { name: active_disaster_declarations, type: array, source: system, default: [], description: "List of { disaster_ref, counties[], start_date, end_date }; appended by declare_disaster, never mutated" }
      - { name: current_fiscal_year, type: integer, source: computed, description: "Calendar year of the logical clock (UTC year component)" }

  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id; owning association" }
      - { name: legal_name, type: string, source: input, description: "Farm operation legal name" }
      - { name: tax_id, type: string, source: input, description: "Tax identification number" }
      - { name: county, type: string, source: input, description: "Primary county; matched against disaster declaration counties" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED; derived per suspension rule in state machine" }
      - { name: patronage_eligible, type: boolean, source: system, default: true, description: "False once borrower TERMINATED or any of its loans reaches CHARGED_OFF" }
      - { name: active_covenant_breach_count, type: integer, source: computed, default: 0, description: "Count of CovenantEvaluation rows with outcome=BREACH and status=RECORDED for this borrower" }

  - name: LoanAccount
    parent: null
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id; borrowing operation" }
      - { name: association_id, type: string, source: system, description: "FK -> Association.id; denormalized from Borrower at creation" }
      - { name: requested_commitment_cents, type: integer, source: input, description: "Commitment requested on application" }
      - { name: approved_commitment_cents, type: integer, source: system, description: "Commitment set at approve; null until APPROVED" }
      - { name: rate_bps, type: integer, source: input, description: "Annual interest rate in basis points (700 = 7.00%)" }
      - { name: season_year, type: integer, source: input, description: "Crop season year this line finances" }
      - { name: maturity_date, type: datetime, source: input, description: "Line maturity; activation requires clock strictly before this instant" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | ACTIVE | RESTRUCTURING | PAID_OFF | CHARGED_OFF | FORECLOSED" }
      - { name: payment_posture, type: enum, source: system, description: "CURRENT | WATCH | DELINQUENT | DEFAULT; independent dimension derived from coverage bands (see calculations.coverage_band_posture)" }
      - { name: consecutive_delinquent_reviews, type: integer, source: system, default: 0, description: "Reviews in a row ending DELINQUENT; reset to 0 whenever posture recomputes to non-DELINQUENT" }
      - { name: outstanding_principal_cents, type: integer, source: system, default: 0, description: "Disbursed less repaid/rescinded principal plus capitalized interest at restructure execute" }
      - { name: accrued_interest_cents, type: integer, source: system, default: 0, description: "Interest accrued per calculations.interest_accrual, not yet paid or capitalized" }
      - { name: last_accrual_date, type: datetime, source: system, description: "Date portion of last accrual event; set at activate; null before" }
      - { name: borrowing_base_cents, type: integer, source: computed, default: 0, description: "Per calculations.borrowing_base; recomputed on budget approve/actuals, filing perfect/lapse/terminate, appraise, release" }
      - { name: pending_draw_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over DrawRequests of this loan in status APPROVED" }

  - name: CropBudget
    parent: null
    common_fields: true
    fields:
      - { name: loan_account_id, type: string, source: input, description: "FK -> LoanAccount.id" }
      - { name: season_year, type: integer, source: input, description: "Must equal loan season_year" }
      - { name: crop_type, type: string, source: input, description: "Crop code, e.g. CORN" }
      - { name: acres, type: integer, source: input, description: "Planted acres" }
      - { name: projected_revenue_cents, type: integer, source: input, description: "Projected gross crop revenue" }
      - { name: projected_expenses_cents, type: integer, source: input, description: "Projected operating expenses" }
      - { name: actual_revenue_cents, type: integer, source: input, description: "Actual harvest revenue; null until record_actuals" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | SUPERSEDED | ACTUALIZED" }

  - name: Collateral
    parent: null
    common_fields: true
    fields:
      - { name: loan_account_id, type: string, source: input, description: "FK -> LoanAccount.id" }
      - { name: collateral_type, type: enum, source: input, description: "CHATTEL_CROP | EQUIPMENT | REAL_ESTATE; selects advance rate" }
      - { name: description, type: string, source: input, description: "Collateral description" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Current appraised value; superseded via appraise action" }
      - { name: prior_lien_cents, type: integer, source: input, default: 0, description: "Senior lien balance reducing net collateral value" }
      - { name: status, type: enum, source: system, description: "PLEDGED | RELEASED" }
      - { name: perfection_state, type: enum, source: computed, description: "PERFECTED iff exists UCCFiling of this collateral with status FILED or CONTINUED; else UNPERFECTED" }

  - name: UCCFiling
    parent: null
    common_fields: true
    fields:
      - { name: collateral_id, type: string, source: input, description: "FK -> Collateral.id" }
      - { name: filing_number, type: string, source: input, description: "Unique across the association" }
      - { name: jurisdiction, type: string, source: input, description: "Filing office / jurisdiction" }
      - { name: filed_date, type: datetime, source: input, description: "Effective filing date" }
      - { name: lapse_date, type: datetime, source: computed, description: "filed_date + 5 calendar years; +5 years per successful continuation" }
      - { name: status, type: enum, source: system, description: "FILED | CONTINUED | LAPSED | TERMINATED" }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id" }
      - { name: assigned_loan_id, type: string, source: system, description: "FK -> LoanAccount.id; null until assign" }
      - { name: policy_number, type: string, source: input, description: "Unique per borrower" }
      - { name: crop_type, type: string, source: input, description: "Insured crop" }
      - { name: county, type: string, source: input, description: "Insured county" }
      - { name: coverage_start, type: datetime, source: input, description: "Half-open coverage window start (inclusive)" }
      - { name: coverage_end, type: datetime, source: input, description: "Half-open coverage window end (exclusive)" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Policy coverage ceiling" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED" }
      - { name: assignment_status, type: enum, source: system, description: "UNASSIGNED | ASSIGNED (lender is loss payee) | RELEASED" }

  - name: InsuranceClaim
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> InsurancePolicy.id" }
      - { name: loan_account_id, type: string, source: input, description: "FK -> LoanAccount.id; must equal policy.assigned_loan_id" }
      - { name: claimed_loss_cents, type: integer, source: input, description: "Grower-claimed loss" }
      - { name: adjuster_approved_cents, type: integer, source: system, description: "Adjuster-approved indemnity; null until adjuster_report" }
      - { name: indemnity_to_lender_cents, type: integer, source: computed, description: "min(adjuster_approved_cents, coverage remaining); set at pay" }
      - { name: applied_interest_cents, type: integer, source: computed, description: "Portion applied to accrued interest at pay" }
      - { name: applied_principal_cents, type: integer, source: computed, description: "Portion applied to principal at pay" }
      - { name: remitted_to_borrower_cents, type: integer, source: computed, description: "Indemnity exceeding total debt; remitted to borrower" }
      - { name: status, type: enum, source: system, description: "REPORTED | ADJUSTED | APPROVED | UNDER_APPEAL | PAID | DENIED" }

  - name: DrawRequest
    parent: null
    common_fields: true
    fields:
      - { name: loan_account_id, type: string, source: input, description: "FK -> LoanAccount.id" }
      - { name: amount_cents, type: integer, source: input, description: "Requested advance amount" }
      - { name: purpose, type: enum, source: input, description: "SEED | FERTILIZER | FUEL | LABOR | EQUIPMENT_REPAIR | LIVING_EXPENSE" }
      - { name: disbursement_date, type: datetime, source: system, description: "Logical-clock timestamp at disburse; null until DISBURSED" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | CANCELLED | DISBURSED | RESCINDED" }

  - name: Repayment
    parent: null
    common_fields: true
    fields:
      - { name: loan_account_id, type: string, source: input, description: "FK -> LoanAccount.id" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount, applied in full at creation" }
      - { name: source, type: enum, source: input, description: "HARVEST_PROCEEDS | INSURANCE_INDEMNITY | OTHER" }
      - { name: applied_interest_cents, type: integer, source: computed, description: "Waterfall portion to accrued interest" }
      - { name: applied_principal_cents, type: integer, source: computed, description: "Waterfall portion to principal" }
      - { name: status, type: enum, source: system, description: "APPLIED | REVERSED" }

  - name: CovenantEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: loan_account_id, type: string, source: input, description: "FK -> LoanAccount.id" }
      - { name: borrower_id, type: string, source: system, description: "FK -> Borrower.id; denormalized from loan" }
      - { name: as_of_date, type: datetime, source: input, description: "Financial statement date" }
      - { name: current_assets_cents, type: integer, source: input, description: "Reported current assets" }
      - { name: current_liabilities_cents, type: integer, source: input, description: "Reported current liabilities" }
      - { name: working_capital_cents, type: integer, source: computed, description: "current_assets_cents - current_liabilities_cents" }
      - { name: current_ratio_milli, type: integer, source: computed, description: "floor(current_assets*1000/current_liabilities); 0 when liabilities==0 and assets==0; 999999999 when liabilities==0 and assets>0" }
      - { name: required_ratio_milli, type: integer, source: computed, description: "Tier by approved_commitment_cents: <=25000000 -> 1100; <=100000000 -> 1250; else 1400" }
      - { name: outcome, type: enum, source: computed, description: "COMPLIANT | BREACH per calculations.working_capital_covenant (exact cross-multiplication, no rounding)" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of recording LoanOfficer (segregation-of-duties anchor)" }
      - { name: status, type: enum, source: system, description: "RECORDED | WAIVED | VOIDED" }

  - name: RestructurePlan
    parent: null
    common_fields: true
    fields:
      - { name: loan_account_id, type: string, source: input, description: "FK -> LoanAccount.id" }
      - { name: plan_type, type: enum, source: input, description: "STANDARD | DISASTER; DISASTER requires active disaster declaration and a recent deferral" }
      - { name: amortization_style, type: enum, source: input, description: "EQUAL_INSTALLMENT | BALLOON" }
      - { name: extension_months, type: integer, source: input, description: "Months added to maturity at execute" }
      - { name: new_rate_bps, type: integer, source: input, description: "Post-restructure annual rate in basis points" }
      - { name: capitalize_interest, type: boolean, source: input, description: "If true, accrued interest folds into principal at execute and into base_balance_cents at create" }
      - { name: base_balance_cents, type: integer, source: computed, description: "Frozen at create: outstanding_principal_cents + (capitalize_interest ? accrued_interest_cents : 0)" }
      - { name: new_installment_cents, type: integer, source: computed, description: "Per calculations.restructure_schedule over base_balance_cents" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creating LoanOfficer (segregation-of-duties anchor)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | COMMITTEE_REVIEW | APPROVED | REJECTED | EXECUTED | SUPERSEDED | WITHDRAWN" }

  - name: DeferralRequest
    parent: null
    common_fields: true
    fields:
      - { name: loan_account_id, type: string, source: input, description: "FK -> LoanAccount.id" }
      - { name: disaster_ref, type: string, source: input, description: "Must match an entry in association.active_disaster_declarations covering borrower county with end_date >= clock" }
      - { name: requested_start, type: datetime, source: input, description: "Deferral window start (inclusive); must be >= clock date" }
      - { name: requested_end, type: datetime, source: input, description: "Deferral window end (exclusive); must be > requested_start" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | IN_EFFECT | EXPIRED | ENDED_EARLY" }

  - name: PatronageDistribution
    parent: null
    common_fields: true
    fields:
      - { name: association_id, type: string, source: input, description: "FK -> Association.id" }
      - { name: fiscal_year, type: integer, source: input, description: "Must equal current_fiscal_year - 1 at declaration" }
      - { name: pool_cents, type: integer, source: input, description: "Declared patronage pool" }
      - { name: allocated_cents, type: integer, source: computed, default: 0, description: "Sum of non-clawed-back final shares" }
      - { name: undistributed_cents, type: integer, source: computed, description: "pool_cents - allocated_cents; equals pool_cents at DECLARED" }
      - { name: allocation_lines, type: array, source: computed, default: [], description: "Per-borrower { borrower_id, interest_paid_cents, raw_share_cents, final_share_cents, clawed_back }" }
      - { name: status, type: enum, source: system, description: "DECLARED | ALLOCATED | PAID" }

  - name: MarginCallNotice
    parent: null
    common_fields: true
    fields:
      - { name: loan_account_id, type: string, source: system, description: "FK -> LoanAccount.id; created by system when deficiency > 0" }
      - { name: deficiency_cents, type: integer, source: computed, description: "outstanding_principal_cents - min(approved_commitment_cents, borrowing_base_cents) at creation; positive" }
      - { name: status, type: enum, source: system, description: "ISSUED | CURED | ESCALATED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Borrower
    field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (derived: active_covenant_breach_count >= 2, OR any of its loans payment_posture in {DELINQUENT, DEFAULT}, OR any MarginCallNotice ESCALATED on its loans)"
        actor: system
        preconditions: []
        side_effects:
          - "Blocks borrower-initiated creation of DrawRequest, CropBudget, DeferralRequest (ERR_BORROWER_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (re-evaluated after every posture change, covenant record/waive/void, margin-call escalate/cure: no suspending condition holds)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /borrowers/{id}/terminate"
        actor: CreditCommittee
        preconditions:
          - "All borrower loans in terminal state (PAID_OFF | CHARGED_OFF | FORECLOSED), else ERR_INVALID_STATE_TRANSITION"
        side_effects:
          - "patronage_eligible = false"

  - entity: LoanAccount
    field: status
    initial_state: DRAFT
    terminal_states: [PAID_OFF, CHARGED_OFF, FORECLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /loan-accounts/{id}/submit"
        actor: LoanOfficer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /loan-accounts/{id}/approve"
        actor: CreditCommittee
        preconditions:
          - "approved_commitment_cents > 0 and <= requested_commitment_cents (ERR_INVALID_REQUEST)"
        side_effects:
          - "approved_commitment_cents set"
          - "borrowing_base_cents recomputed (cap applies once commitment known)"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /loan-accounts/{id}/activate"
        actor: LoanOfficer
        preconditions:
          - "business_safety: at least one InsurancePolicy with status ACTIVE and assignment_status ASSIGNED to this loan (ERR_INSURANCE_NOT_ASSIGNED)"
          - "business_safety: at least one Collateral status PLEDGED with perfection_state PERFECTED (ERR_COLLATERAL_UNPERFECTED)"
          - "business_temporal: logical clock strictly before maturity_date (ERR_MATURITY_PASSED)"
          - "business_constraint: an APPROVED CropBudget exists for this loan and season (ERR_BUDGET_NOT_APPROVED)"
        side_effects:
          - "last_accrual_date = clock date"
      - from: ACTIVE
        to: RESTRUCTURING
        trigger: "system (side effect of POST /restructure-plans creation)"
        actor: system
        preconditions: []
        side_effects:
          - "Draw approvals blocked while RESTRUCTURING (ERR_LOAN_NOT_ACTIVE)"
      - from: RESTRUCTURING
        to: ACTIVE
        trigger: "system (side effect of restructure-plan execute, or of reject/withdraw of the open plan)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: PAID_OFF
        trigger: "system (repayment or claim pay reduces outstanding_principal_cents and accrued_interest_cents both to exactly 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CHARGED_OFF
        trigger: "POST /loan-accounts/{id}/charge_off"
        actor: CreditCommittee
        preconditions:
          - "payment_posture == DEFAULT (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Borrower.patronage_eligible = false"
          - "Borrower status re-evaluated (DEFAULT loan keeps borrower SUSPENDED)"
      - from: ACTIVE
        to: FORECLOSED
        trigger: "POST /loan-accounts/{id}/foreclose"
        actor: CreditCommittee
        preconditions:
          - "An ESCALATED MarginCallNotice exists for this loan (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "All PLEDGED Collateral of this loan -> RELEASED"
          - "All FILED/CONTINUED UCCFilings of that collateral -> TERMINATED"

  - entity: LoanAccount
    field: payment_posture
    initial_state: CURRENT
    terminal_states: []
    note: "Independent second state dimension on LoanAccount; recomputed after every balance- or borrowing-base-affecting event and at run_periodic_review. coverage_cents = min(approved_commitment_cents, borrowing_base_cents) - outstanding_principal_cents."
    transitions:
      - from: CURRENT
        to: WATCH
        trigger: "system recompute: 0 <= coverage_cents AND coverage_cents * 10 < approved_commitment_cents"
        actor: system
        preconditions: []
        side_effects: ["Borrower.status re-evaluated"]
      - from: WATCH
        to: CURRENT
        trigger: "system recompute: coverage_cents * 10 >= approved_commitment_cents"
        actor: system
        preconditions: []
        side_effects: ["Borrower.status re-evaluated", "consecutive_delinquent_reviews = 0"]
      - from: CURRENT
        to: DELINQUENT
        trigger: "system recompute: coverage_cents < 0"
        actor: system
        preconditions: []
        side_effects: ["Borrower.status re-evaluated"]
      - from: WATCH
        to: DELINQUENT
        trigger: "system recompute: coverage_cents < 0"
        actor: system
        preconditions: []
        side_effects: ["Borrower.status re-evaluated"]
      - from: DELINQUENT
        to: WATCH
        trigger: "system recompute: 0 <= coverage_cents AND coverage_cents * 10 < approved_commitment_cents"
        actor: system
        preconditions: []
        side_effects: ["Borrower.status re-evaluated", "consecutive_delinquent_reviews = 0"]
      - from: DELINQUENT
        to: CURRENT
        trigger: "system recompute: coverage_cents * 10 >= approved_commitment_cents"
        actor: system
        preconditions: []
        side_effects: ["Borrower.status re-evaluated", "consecutive_delinquent_reviews = 0"]
      - from: DELINQUENT
        to: DEFAULT
        trigger: "system (run_periodic_review closes a review with posture already DELINQUENT so consecutive_delinquent_reviews reaches 2, OR MarginCallNotice escalated)"
        actor: system
        preconditions: []
        side_effects: ["Borrower.status re-evaluated"]
      - from: DEFAULT
        to: CURRENT
        trigger: "system (only via restructure-plan execute)"
        actor: system
        preconditions: []
        side_effects: ["Borrower.status re-evaluated", "consecutive_delinquent_reviews = 0"]

  - entity: CropBudget
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, ACTUALIZED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /crop-budgets/{id}/approve"
        actor: LoanOfficer
        preconditions:
          - "No other APPROVED budget for the same loan that was created after this one (supersede ordering handled atomically below)"
        side_effects:
          - "Any other APPROVED CropBudget of the same loan -> SUPERSEDED"
          - "borrowing_base_cents recomputed (provisional variant uses projected_revenue_cents)"
          - "posture recompute + margin deficiency check"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (approval of a newer CropBudget for the same loan)"
        actor: system
        preconditions: []
        side_effects: ["borrowing_base_cents recomputed from the superseding budget"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (creation of a newer DRAFT budget for the same loan supersedes an existing DRAFT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: ACTUALIZED
        trigger: "POST /crop-budgets/{id}/record_actuals"
        actor: Borrower | LoanOfficer
        preconditions: []
        side_effects:
          - "borrowing_base_cents recomputed (harvest true-up variant uses actual_revenue_cents)"
          - "posture recompute + margin deficiency check"

  - entity: Collateral
    field: status
    initial_state: PLEDGED
    terminal_states: [RELEASED]
    transitions:
      - from: PLEDGED
        to: RELEASED
        trigger: "POST /collateral/{id}/release OR system (loan FORECLOSED cascade)"
        actor: LoanOfficer | system
        preconditions:
          - "Manual: after removal the recomputed borrowing base must still cover outstanding principal (ERR_RELEASE_WOULD_CREATE_DEFICIENCY)"
        side_effects:
          - "Any FILED/CONTINUED UCCFiling of this collateral -> TERMINATED"
          - "borrowing_base_cents recomputed; posture recompute + margin deficiency check"

  - entity: UCCFiling
    field: status
    initial_state: FILED
    terminal_states: [LAPSED, TERMINATED]
    transitions:
      - from: FILED
        to: CONTINUED
        trigger: "POST /ucc-filings/{id}/continue"
        actor: LoanOfficer
        preconditions:
          - "logical clock within continuation window [lapse_date - 180 days, lapse_date) (ERR_CONTINUATION_WINDOW_NOT_OPEN)"
        side_effects:
          - "lapse_date += 5 calendar years"
      - from: CONTINUED
        to: CONTINUED
        trigger: "POST /ucc-filings/{id}/continue"
        actor: LoanOfficer
        preconditions:
          - "logical clock within continuation window [lapse_date - 180 days, lapse_date) (ERR_CONTINUATION_WINDOW_NOT_OPEN)"
        side_effects:
          - "lapse_date += 5 calendar years"
      - from: FILED
        to: LAPSED
        trigger: "system (run_periodic_review where lapse_date <= clock)"
        actor: system
        preconditions: []
        side_effects:
          - "Collateral.perfection_state recomputed -> UNPERFECTED when no other FILED/CONTINUED filing exists"
          - "borrowing_base_cents recomputed (collateral drops out); posture recompute; margin deficiency check may create MarginCallNotice"
      - from: CONTINUED
        to: LAPSED
        trigger: "system (run_periodic_review where lapse_date <= clock)"
        actor: system
        preconditions: []
        side_effects:
          - "Collateral.perfection_state recomputed -> UNPERFECTED when no other FILED/CONTINUED filing exists"
          - "borrowing_base_cents recomputed; posture recompute; margin deficiency check"
      - from: FILED
        to: TERMINATED
        trigger: "POST /ucc-filings/{id}/terminate OR system (collateral release / foreclosure cascade)"
        actor: LoanOfficer | system
        preconditions: []
        side_effects:
          - "Collateral.perfection_state recomputed"
          - "borrowing_base_cents recomputed; posture recompute; margin deficiency check"
      - from: CONTINUED
        to: TERMINATED
        trigger: "POST /ucc-filings/{id}/terminate OR system (collateral release / foreclosure cascade)"
        actor: LoanOfficer | system
        preconditions: []
        side_effects:
          - "Collateral.perfection_state recomputed"
          - "borrowing_base_cents recomputed; posture recompute; margin deficiency check"

  - entity: InsurancePolicy
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /insurance-policies/{id}/cancel"
        actor: Borrower | LoanOfficer
        preconditions:
          - "No InsuranceClaim of this policy in REPORTED | ADJUSTED | APPROVED | UNDER_APPEAL (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "assignment_status ASSIGNED -> RELEASED (assigned_loan_id cleared)"

  - entity: InsurancePolicy
    field: assignment_status
    initial_state: UNASSIGNED
    terminal_states: []
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /insurance-policies/{id}/assign"
        actor: LoanOfficer
        preconditions:
          - "Policy status ACTIVE (ERR_POLICY_NOT_ACTIVE)"
          - "Policy not already ASSIGNED (ERR_POLICY_ALREADY_ASSIGNED)"
          - "Loan and policy belong to the same association (ERR_CROSS_ASSOCIATION_REFERENCE)"
          - "Coverage window [coverage_start, coverage_end) contains the loan season: coverage_start <= clock and coverage_end >= loan maturity_date (ERR_INVALID_REQUEST)"
        side_effects:
          - "assigned_loan_id set; association recorded as loss payee"
      - from: ASSIGNED
        to: RELEASED
        trigger: "system (policy cancel)"
        actor: system
        preconditions: []
        side_effects: ["assigned_loan_id cleared"]

  - entity: InsuranceClaim
    field: status
    initial_state: REPORTED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: REPORTED
        to: ADJUSTED
        trigger: "POST /insurance-claims/{id}/adjuster_report"
        actor: InsuranceAdjuster
        preconditions:
          - "adjuster_approved_cents <= policy coverage remaining (coverage_amount_cents minus sum of indemnity_to_lender_cents over this policy's PAID claims) else ERR_CLAIM_EXCEEDS_COVERAGE"
        side_effects: ["adjuster_approved_cents set"]
      - from: UNDER_APPEAL
        to: ADJUSTED
        trigger: "POST /insurance-claims/{id}/adjuster_report"
        actor: InsuranceAdjuster
        preconditions:
          - "Same coverage-remaining check (ERR_CLAIM_EXCEEDS_COVERAGE)"
        side_effects: ["adjuster_approved_cents overwritten"]
      - from: ADJUSTED
        to: APPROVED
        trigger: "POST /insurance-claims/{id}/approve"
        actor: InsuranceAdjuster
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: UNDER_APPEAL
        trigger: "POST /insurance-claims/{id}/appeal"
        actor: Borrower | LoanOfficer
        preconditions: []
        side_effects: []
      - from: REPORTED
        to: DENIED
        trigger: "POST /insurance-claims/{id}/deny"
        actor: InsuranceAdjuster
        preconditions: []
        side_effects: []
      - from: ADJUSTED
        to: DENIED
        trigger: "POST /insurance-claims/{id}/deny"
        actor: InsuranceAdjuster
        preconditions: []
        side_effects: []
      - from: UNDER_APPEAL
        to: DENIED
        trigger: "POST /insurance-claims/{id}/deny"
        actor: InsuranceAdjuster
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /insurance-claims/{id}/pay"
        actor: LoanOfficer
        preconditions:
          - "Loan status in {ACTIVE, RESTRUCTURING} (ERR_LOAN_NOT_ACTIVE)"
        side_effects:
          - "indemnity_to_lender_cents = min(adjuster_approved_cents, coverage remaining)"
          - "Waterfall per calculations.insurance_indemnity_waterfall: accrued interest first, then principal, remainder remitted to borrower"
          - "Loan balances reduced; if both reach exactly 0 the loan auto-transitions ACTIVE -> PAID_OFF"
          - "posture recompute; margin deficiency check (may CURE an ISSUED notice); Borrower.status re-evaluated"

  - entity: DrawRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [DENIED, CANCELLED, RESCINDED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /draw-requests/{id}/approve"
        actor: LoanOfficer
        preconditions:
          - "Loan status == ACTIVE (ERR_LOAN_NOT_ACTIVE)"
          - "Loan payment_posture not in {DELINQUENT, DEFAULT} (ERR_LOAN_POSTURE_BLOCKS_DRAWS)"
          - "At least one InsurancePolicy ASSIGNED and ACTIVE for this loan (ERR_INSURANCE_NOT_ASSIGNED)"
          - "amount_cents <= available credit (ERR_DRAW_EXCEEDS_AVAILABILITY)"
        side_effects:
          - "pending_draw_cents += amount_cents (availability reserved)"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /draw-requests/{id}/disburse"
        actor: LoanOfficer
        preconditions: []
        side_effects:
          - "Accrue interest to clock date first (calculations.interest_accrual)"
          - "outstanding_principal_cents += amount_cents; pending_draw_cents -= amount_cents"
          - "disbursement_date = clock; posture recompute; margin deficiency check"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /draw-requests/{id}/deny"
        actor: LoanOfficer
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /draw-requests/{id}/cancel"
        actor: Borrower
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /draw-requests/{id}/cancel"
        actor: Borrower
        preconditions: []
        side_effects: ["pending_draw_cents -= amount_cents (reservation released)"]
      - from: DISBURSED
        to: RESCINDED
        trigger: "POST /draw-requests/{id}/rescind"
        actor: LoanOfficer
        preconditions:
          - "Clock UTC date equals disbursement_date UTC date (ERR_RESCIND_WINDOW_CLOSED)"
        side_effects:
          - "outstanding_principal_cents -= amount_cents (same-day rescind: zero interest accrued on this draw, compensation is exact)"
          - "posture recompute; margin deficiency check"

  - entity: Repayment
    field: status
    initial_state: APPLIED
    terminal_states: [REVERSED]
    transitions:
      - from: APPLIED
        to: REVERSED
        trigger: "POST /repayments/{id}/reverse"
        actor: LoanOfficer
        preconditions:
          - "Loan not in terminal state (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Accrue interest to clock date first (calculations.interest_accrual)"
          - "accrued_interest_cents += applied_interest_cents; outstanding_principal_cents += applied_principal_cents"
          - "posture recompute; margin deficiency check; Borrower.status re-evaluated"

  - entity: CovenantEvaluation
    field: status
    initial_state: RECORDED
    terminal_states: [WAIVED, VOIDED]
    transitions:
      - from: RECORDED
        to: WAIVED
        trigger: "POST /covenant-evaluations/{id}/waive"
        actor: CreditCommittee
        preconditions:
          - "Caller X-User-ID != recorded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "If outcome == BREACH: Borrower.active_covenant_breach_count -= 1; Borrower.status re-evaluated"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /covenant-evaluations/{id}/void"
        actor: LoanOfficer
        preconditions: []
        side_effects:
          - "If outcome == BREACH: Borrower.active_covenant_breach_count -= 1; Borrower.status re-evaluated"

  - entity: RestructurePlan
    field: status
    initial_state: PROPOSED
    terminal_states: [EXECUTED, SUPERSEDED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: COMMITTEE_REVIEW
        trigger: "POST /restructure-plans/{id}/submit"
        actor: LoanOfficer
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: COMMITTEE_REVIEW
        trigger: "POST /restructure-plans/{id}/submit (revision resubmission)"
        actor: LoanOfficer
        preconditions: []
        side_effects:
          - "Loan status ACTIVE -> RESTRUCTURING (revision reopens the restructuring)" 
      - from: COMMITTEE_REVIEW
        to: APPROVED
        trigger: "POST /restructure-plans/{id}/approve"
        actor: CreditCommittee
        preconditions:
          - "Caller X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: COMMITTEE_REVIEW
        to: REJECTED
        trigger: "POST /restructure-plans/{id}/reject"
        actor: CreditCommittee
        preconditions: []
        side_effects:
          - "Loan status RESTRUCTURING -> ACTIVE when no other non-terminal plan exists for the loan"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /restructure-plans/{id}/execute"
        actor: LoanOfficer
        preconditions: []
        side_effects:
          - "If capitalize_interest: outstanding_principal_cents = base_balance_cents and accrued_interest_cents = 0"
          - "rate_bps = new_rate_bps; maturity_date += extension_months"
          - "Loan status RESTRUCTURING -> ACTIVE; payment_posture = CURRENT; consecutive_delinquent_reviews = 0"
          - "posture recompute skipped once (reset is authoritative until next balance/base event)"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (creation of a newer RestructurePlan for the same loan)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMMITTEE_REVIEW
        to: SUPERSEDED
        trigger: "system (creation of a newer RestructurePlan for the same loan)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (creation of a newer RestructurePlan for the same loan)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /restructure-plans/{id}/withdraw"
        actor: LoanOfficer
        preconditions: []
        side_effects:
          - "Loan status RESTRUCTURING -> ACTIVE when no other non-terminal plan exists for the loan"

  - entity: DeferralRequest
    field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, EXPIRED, ENDED_EARLY]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /deferral-requests/{id}/approve"
        actor: CreditCommittee
        preconditions:
          - "No other APPROVED or IN_EFFECT deferral of the same loan with overlapping window (ERR_DEFERRAL_OVERLAP)"
          - "Gap between windows of APPROVED/IN_EFFECT deferrals of the same loan must be >= 30 days in both directions (ERR_DEFERRAL_GAP_TOO_SMALL)"
        side_effects: []
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /deferral-requests/{id}/deny"
        actor: CreditCommittee
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: IN_EFFECT
        trigger: "system (run_periodic_review where requested_start <= clock < requested_end)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_EFFECT
        to: EXPIRED
        trigger: "system (run_periodic_review where requested_end <= clock)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system (run_periodic_review where requested_end <= clock, never activated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_EFFECT
        to: ENDED_EARLY
        trigger: "POST /deferral-requests/{id}/end_early"
        actor: LoanOfficer
        preconditions: []
        side_effects: []

  - entity: PatronageDistribution
    field: status
    initial_state: DECLARED
    terminal_states: []
    transitions:
      - from: DECLARED
        to: ALLOCATED
        trigger: "POST /patronage-distributions/{id}/allocate"
        actor: AssociationBoard
        preconditions:
          - "Total eligible interest weight > 0 (ERR_NO_ELIGIBLE_PATRONAGE_BASE)"
        side_effects:
          - "allocation_lines computed per calculations.patronage_allocation; allocated_cents and undistributed_cents set"
      - from: ALLOCATED
        to: PAID
        trigger: "POST /patronage-distributions/{id}/pay"
        actor: AssociationBoard
        preconditions: []
        side_effects: ["Shares recorded as paid in cash; no effect on loan balances"]

  - entity: MarginCallNotice
    field: status
    initial_state: ISSUED
    terminal_states: [CURED, ESCALATED]
    transitions:
      - from: ISSUED
        to: CURED
        trigger: "system (margin deficiency check after any balance/base event finds deficiency <= 0)"
        actor: system
        preconditions: []
        side_effects: ["Borrower.status re-evaluated"]
      - from: ISSUED
        to: ESCALATED
        trigger: "POST /margin-call-notices/{id}/escalate"
        actor: CreditCommittee
        preconditions: []
        side_effects:
          - "Loan payment_posture -> DEFAULT; consecutive_delinquent_reviews = 2"
          - "Borrower.status re-evaluated (SUSPENDED)"

# =============================================================================
# 1.2.1 Concurrency Rules (true create-with-supersede races, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: budget-create-stale-loan
    parent_entity: LoanAccount
    write_endpoint: "POST /crop-budgets"
    occ_field: "expected_loan_version"
    description: |
      Creating a CropBudget against a LoanAccount whose version has advanced
      since the client last observed it is rejected. A newer budget supersedes
      an existing DRAFT and the loan's borrowing base anchors to the newest
      budget, so a writer holding a stale loan version would silently build on
      a superseded projection.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: plan-create-stale-loan
    parent_entity: LoanAccount
    write_endpoint: "POST /restructure-plans"
    occ_field: "expected_loan_version"
    description: |
      Creating a RestructurePlan against a LoanAccount whose version has
      advanced since the client last observed it is rejected. A new plan
      legitimately supersedes the prior non-terminal plan and moves the loan
      to RESTRUCTURING, so a stale writer would unknowingly supersede terms it
      never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: appraisal-stale-collateral
    parent_entity: Collateral
    write_endpoint: "POST /collateral/{id}/appraise"
    occ_field: "expected_collateral_version"
    description: |
      Recording an appraisal against a Collateral whose version has advanced
      since the client last observed it is rejected. Each new appraisal
      legitimately supersedes the prior value and immediately reshapes the
      borrowing base, so an appraisal keyed to a stale base must not land.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: borrowing_base
    trigger: "budget approve, budget record_actuals, UCC filing create/lapse/terminate, collateral appraise, collateral release, loan approve (cap becomes known)"
    algorithm: tiered_pricing
    formula: |
      collateral_component = SUM over Collateral c of loan where c.status == PLEDGED
                             AND c.perfection_state == PERFECTED:
          line_c = floor_to_cent( c.appraised_value_cents * ADVANCE_RATE_BP[c.collateral_type] / 10000 )
          contribution_c = max(0, line_c - c.prior_lien_cents)
      crop_component = CROP: let b = the CropBudget of this loan that feeds the base
          provisional variant: b == the unique APPROVED budget (none -> crop_component = 0)
                                 crop_component = floor_to_cent( b.projected_revenue_cents * CROP_ADVANCE_BP / 10000 )
          true-up variant:     once b is ACTUALIZED:
                                 crop_component = floor_to_cent( b.actual_revenue_cents * CROP_ADVANCE_BP / 10000 )
      raw_base = collateral_component + crop_component
      borrowing_base_cents = (approved_commitment_cents IS NULL) ? raw_base
                           : min(approved_commitment_cents, raw_base)
      Evaluation order is pinned: per-collateral floors first, then sum, then the
      commitment cap last. floor_to_cent is identity on integer-cent inputs times
      integer bp — the floor matters only because bp products are integral.
    input_set: "Collateral of the loan with status PLEDGED and perfection_state PERFECTED (UNPERFECTED and RELEASED excluded); the loan's APPROVED (provisional) or ACTUALIZED (true-up) CropBudget; DRAFT and SUPERSEDED budgets excluded"
    constants:
      ADVANCE_RATE_BP_CHATTEL_CROP: 7500
      ADVANCE_RATE_BP_EQUIPMENT: 7000
      ADVANCE_RATE_BP_REAL_ESTATE: 8000
      CROP_ADVANCE_BP: 6000
    precision: "integer cents; per-collateral multiplication floored to cents before summing; cap applied last"
    variants:
      - name: provisional
        when: "Loan not yet harvest-settled; the feeding budget is APPROVED"
        difference: "Uses projected_revenue_cents from the APPROVED budget"
      - name: harvest_trueup
        when: "After record_actuals; the feeding budget is ACTUALIZED"
        difference: "Uses actual_revenue_cents; identical collateral and commitment produce a different base whenever actual != projected"

  - name: draw_availability
    trigger: "draw approve (checked), financial_summary (reported)"
    algorithm: aggregation
    formula: |
      available_credit_cents = min(approved_commitment_cents, borrowing_base_cents)
                               - outstanding_principal_cents - pending_draw_cents
      Draw approvable iff amount_cents <= available_credit_cents (equality passes).
    input_set: "pending_draw_cents = SUM of amount_cents over this loan's DrawRequests in status APPROVED exactly (REQUESTED, DENIED, CANCELLED, DISBURSED, RESCINDED excluded)"
    precision: "integer cents"

  - name: interest_accrual
    trigger: "every balance-mutating event (draw disburse, repayment create/reverse, claim pay, restructure execute) and run_periodic_review sweep: accrue BEFORE applying the event's own balance change"
    algorithm: chronological
    formula: |
      Segment accrual between consecutive events. For a segment with constant
      principal P lasting d whole UTC days (from last_accrual_date to clock date):
          daily_cents = round_half_up( P * rate_bps / 3_600_000 )     # bps/10000/360, ACT/360
          segment_accrual = daily_cents * d
      accrued_interest_cents += segment_accrual; last_accrual_date = clock date.
      ROUNDING ORDER IS PINNED: round each segment's daily charge to whole cents
      FIRST, then multiply by days. The alternative (accumulate raw fraction over
      the segment, round once) yields different cents and is non-conformant.
      Same-day disburse-then-rescind spans d = 0 days on the draw amount, so a
      same-day rescission reverses principal with zero interest drift.
    input_set: "Loans with status in {ACTIVE, RESTRUCTURING}; terminal loans do not accrue"
    precision: "integer cents, round_half_up per segment-day, then summed"
    constants:
      DAY_COUNT_DENOMINATOR: 360

  - name: coverage_band_posture
    trigger: "after every event that changes outstanding_principal_cents, borrowing_base_cents, or approved_commitment_cents; and at run_periodic_review"
    algorithm: threshold
    formula: |
      coverage_cents = min(approved_commitment_cents, borrowing_base_cents) - outstanding_principal_cents
      Bands (exact integer comparisons, no float):
        coverage_cents * 10 >= approved_commitment_cents   -> CURRENT
        0 <= coverage_cents < commitment/10 band           -> WATCH
        coverage_cents < 0                                  -> DELINQUENT
      DEFAULT is NOT band-derived: it requires consecutive_delinquent_reviews == 2
      at a review close, or a MarginCallNotice escalation. DEFAULT is sticky: the
      only exit is restructure execute (-> CURRENT) or terminal payoff.
      Boundary: coverage exactly one tenth of commitment is CURRENT (>=).
    input_set: "the single loan under recompute"
    precision: "integer cents"

  - name: working_capital_covenant
    trigger: "POST /covenant-evaluations (computed at record time)"
    algorithm: threshold
    formula: |
      required_ratio_milli = tier(approved_commitment_cents):
          <= 25_000_000  -> 1100
          <= 100_000_000 -> 1250
          else           -> 1400
      working_capital_cents = current_assets_cents - current_liabilities_cents
      Outcome uses EXACT cross-multiplication (no rounding of the ratio):
        if current_liabilities_cents == 0:
            outcome = (current_assets_cents > 0) ? COMPLIANT : BREACH
        else:
            outcome = (current_assets_cents * 1000 >= required_ratio_milli * current_liabilities_cents)
                      ? COMPLIANT : BREACH
      Display ratio current_ratio_milli = floor(current_assets*1000/current_liabilities)
      is computed independently and never feeds the outcome.
      Side effects on BREACH (status RECORDED): borrower.active_covenant_breach_count += 1;
      borrower status re-evaluated. On COMPLIANT (status RECORDED): count reset to 0;
      borrower status re-evaluated.
    input_set: "the recorded evaluation only"
    precision: "integer cross-multiplication; display ratio floored to milli"
    constants:
      TIER1_CAP_CENTS: 25000000
      TIER2_CAP_CENTS: 100000000
      TIER1_MILLI: 1100
      TIER2_MILLI: 1250
      TIER3_MILLI: 1400

  - name: repayment_waterfall
    trigger: "POST /repayments (applied in full at creation)"
    algorithm: waterfall_allocation
    formula: |
      Accrue interest to clock date first (interest_accrual).
      If amount_cents > accrued_interest_cents + outstanding_principal_cents:
          reject ERR_PAYMENT_EXCEEDS_OUTSTANDING (no partial application)
      applied_interest_cents  = min(amount_cents, accrued_interest_cents)
      applied_principal_cents = amount_cents - applied_interest_cents
      accrued_interest_cents -= applied_interest_cents
      outstanding_principal_cents -= applied_principal_cents
      If both reach exactly 0: loan auto-transitions to PAID_OFF (from ACTIVE).
      Then posture recompute + margin deficiency check + borrower re-evaluation.
    input_set: "single repayment against its loan"
    precision: "integer cents"

  - name: insurance_indemnity_waterfall
    trigger: "POST /insurance-claims/{id}/pay"
    algorithm: waterfall_allocation
    formula: |
      coverage_remaining = policy.coverage_amount_cents
          - SUM(indemnity_to_lender_cents over this policy's claims in status PAID)
      indemnity_to_lender_cents = min(adjuster_approved_cents, coverage_remaining)
      Accrue interest to clock date first (interest_accrual).
      applied_interest_cents  = min(indemnity, accrued_interest_cents)
      applied_principal_cents = min(indemnity - applied_interest, outstanding_principal_cents)
      remitted_to_borrower_cents = indemnity - applied_interest - applied_principal
      Balances reduced; PAID_OFF auto-transition when both reach 0; posture
      recompute; margin deficiency check; borrower re-evaluation.
    input_set: "the paying claim, its policy's PAID claims, its loan"
    precision: "integer cents"

  - name: restructure_schedule
    trigger: "POST /restructure-plans (computed and frozen on the plan at creation)"
    algorithm: tiered_pricing
    formula: |
      base_balance_cents = outstanding_principal_cents
                           + (capitalize_interest ? accrued_interest_cents : 0)   # accrue-to-date applied first
      monthly_rate = new_rate_bps / 1_200_000   # annual bps -> monthly decimal
      EQUAL_INSTALLMENT variant (annuity, n = extension_months):
          new_installment_cents = round_half_up(
              base_balance_cents * r * (1+r)^n / ((1+r)^n - 1) )
          (final installment absorbs residual; not modeled on the plan)
      BALLOON variant (interest-only monthly, principal due at end):
          new_installment_cents = round_half_up( base_balance_cents * monthly_rate )
      The two variants are both valid servicing constructs and yield different
      installments for identical base, rate, and term.
    input_set: "the loan's balances at plan creation (frozen thereafter)"
    precision: "integer cents, round_half_up"
    variants:
      - name: equal_installment
        when: "amortization_style == EQUAL_INSTALLMENT"
        difference: "Fully amortizing annuity payment over extension_months"
      - name: balloon
        when: "amortization_style == BALLOON"
        difference: "Interest-only monthly amount; identical inputs produce a much smaller installment than the annuity"

  - name: patronage_allocation
    trigger: "POST /patronage-distributions/{id}/allocate"
    algorithm: waterfall_allocation
    formula: |
      EVALUATION ORDER IS PINNED (circular-looking dependency made explicit):
      Step 1 (weights): for each Borrower of the association with
          patronage_eligible == true AND status != TERMINATED:
          weight_i = SUM(Repayment.applied_interest_cents) over repayments where
              repayment.loan.borrower_id == borrower.id
              AND repayment.status == APPLIED
              AND fiscal_year-01-01T00:00:00Z <= repayment.created_at < (fiscal_year+1)-01-01T00:00:00Z
          Borrowers with weight_i == 0 are excluded from lines.
      Step 2 (raw shares): total_weight = SUM(weight_i);
          raw_share_i = pool_cents * weight_i / total_weight   (exact rational)
      Step 3 (cap first): capped_i = min(raw_share_i, CAP_BP * weight_i / 10000)
          i.e. a borrower's dividend never exceeds 25% of the interest it paid.
      Step 4 (floor then largest remainder over the UNCAPPED remainder only):
          floor_i = floor(capped_i)
          remainder = pool_cents - SUM(floor_i) ... NOT redistributed: any cents
          left after capping and flooring stay in undistributed_cents, EXCEPT
          fractional-cent remainders when no cap binds: lines ranked by
          fractional part of raw_share_i DESC, tie-break Borrower.created_at ASC,
          each receiving +1 cent until pool_cents - SUM(floor_i) cents are given
          out or the fractional parts are exhausted.
      allocated_cents = SUM(final_share_i); undistributed_cents = pool_cents - allocated_cents.
      Invariant: allocated_cents + undistributed_cents == pool_cents after
      allocate and after every clawback.
    input_set: "Repayments of the association's borrowers, status APPLIED, created_at inside the half-open fiscal-year window; REVERSED repayments excluded; insurance-indemnity applications are not Repayments and never count"
    precision: "integer cents; floor per line; remainder cents assigned by fractional-part rank, tie-break created_at ASC"
    constants:
      CAP_BP: 2500

  - name: margin_deficiency_check
    trigger: "after every event that recomputes borrowing_base_cents or changes outstanding_principal_cents, and at run_periodic_review"
    algorithm: threshold
    formula: |
      deficiency = outstanding_principal_cents - min(approved_commitment_cents, borrowing_base_cents)
      If deficiency > 0 and no ISSUED MarginCallNotice exists for the loan:
          create MarginCallNotice(ISSUED, deficiency_cents = deficiency)
      If deficiency <= 0 and an ISSUED notice exists: that notice -> CURED
      ESCALATED notices are never auto-cured.
    input_set: "the single loan under recompute"
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority — lower number wins when a
#     single request violates multiple rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role listed in endpoint roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Ownership: when caller role is Borrower, X-User-ID must equal the id of the Borrower that owns the target resource chain (draw/repayment/budget/deferral/claim create against own loans; own policy cancel; own draw cancel)"
    error_id: ERR_RESOURCE_NOT_OWNED
    http_status: 403
    applies_to: "Borrower-role write endpoints"
  - priority: 4
    category: business_constraint
    check: "Request shape: required fields present, enum values in range, amounts positive integers, window fields with start < end, approved_commitment_cents within (0, requested_commitment_cents]"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: existence
    check: "Path ids and body-supplied FK ids (loan_account_id, borrower_id, collateral_id, policy_id, association_id) exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 6
    category: existence
    check: "OCC: expected_<parent>_version in body equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /crop-budgets, POST /restructure-plans, POST /collateral/{id}/appraise"
  - priority: 7
    category: state
    check: "Generic state preconditions: transition listed for the entity's current state; terminal states accept no transitions"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: state
    check: "Loan-level gates: draw approve/disburse/rescind, plan create and deferral create require loan status ACTIVE; repayment create and claim pay require status in {ACTIVE, RESTRUCTURING}; violations yield ERR_LOAN_NOT_ACTIVE. Draw approve additionally requires payment_posture not in {DELINQUENT, DEFAULT} (ERR_LOAN_POSTURE_BLOCKS_DRAWS). Borrower-role creation of draws, crop budgets or deferrals while the borrower is SUSPENDED yields ERR_BORROWER_SUSPENDED. Crop-budget create is permitted in any non-terminal, non-RESTRUCTURING loan status (the budget must exist before activation can gate on it)."
    error_id: ERR_LOAN_NOT_ACTIVE
    http_status: 409
    applies_to: "draw approve/disburse/rescind, plan create, deferral create, repayment create, claim pay, Borrower-role creation endpoints"
  - priority: 9
    category: business_safety
    check: "Insurance and perfection gates: activate and draw approve require an ASSIGNED ACTIVE policy (ERR_INSURANCE_NOT_ASSIGNED); activate requires a PLEDGED PERFECTED collateral (ERR_COLLATERAL_UNPERFECTED); insurance check precedes collateral check within this category"
    error_id: ERR_INSURANCE_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /loan-accounts/{id}/activate, POST /draw-requests/{id}/approve"
  - priority: 10
    category: business_temporal
    check: "Window rules: activate before maturity (ERR_MATURITY_PASSED); UCC continuation inside [lapse-180d, lapse) (ERR_CONTINUATION_WINDOW_NOT_OPEN); policy coverage windows for same (borrower, crop_type, county) must not overlap, adjacency allowed (ERR_COVERAGE_OVERLAP); deferral windows on one loan must neither overlap (ERR_DEFERRAL_OVERLAP) nor sit closer than 30 days (ERR_DEFERRAL_GAP_TOO_SMALL; overlap checked first); rescind only on disbursement UTC date (ERR_RESCIND_WINDOW_CLOSED)"
    error_id: ERR_MATURITY_PASSED
    http_status: 409
    applies_to: "activate, ucc continue, policy create, deferral approve, draw rescind"
  - priority: 11
    category: business_constraint
    check: "Uniqueness and duty rules: filing_number unique per association (ERR_FILING_NUMBER_TAKEN); policy_number unique per borrower (ERR_POLICY_NUMBER_TAKEN); assign only UNASSIGNED policies (ERR_POLICY_ALREADY_ASSIGNED); covenant waive and plan approve reject caller == recorded_by/created_by (ERR_SEGREGATION_OF_DUTIES); DISASTER plans need an active matching disaster declaration plus an APPROVED/IN_EFFECT/EXPIRED deferral on the loan (ERR_DISASTER_REQUIRED); plan create needs posture DELINQUENT/DEFAULT or an ISSUED/ESCALATED margin call (ERR_RESTRUCTURE_GATE_NOT_MET); one distribution per (association, fiscal_year) (ERR_DISTRIBUTION_EXISTS); fiscal_year == current_fiscal_year - 1 (ERR_INVALID_FISCAL_YEAR); activate needs an APPROVED budget (ERR_BUDGET_NOT_APPROVED)"
    error_id: ERR_FILING_NUMBER_TAKEN
    http_status: 409
    applies_to: "ucc create, policy create, policy assign, covenant waive, plan create/approve, distribution create, activate"
  - priority: 12
    category: business_referential
    check: "Cross-aggregate integrity: loan and policy/budget/collateral/claim references must share one association (ERR_CROSS_ASSOCIATION_REFERENCE); claim's loan_account_id must equal policy.assigned_loan_id and policy must be ASSIGNED (ERR_POLICY_NOT_ASSIGNED_TO_LOAN); deferral disaster_ref must name an active declaration covering the borrower's county (ERR_DISASTER_NOT_FOUND)"
    error_id: ERR_CROSS_ASSOCIATION_REFERENCE
    http_status: 422
    applies_to: "policy assign, claim create, deferral create, collateral create, budget create"
  - priority: 13
    category: business_fiscal
    check: "Money ceilings: draw amount <= available credit (ERR_DRAW_EXCEEDS_AVAILABILITY); repayment <= accrued interest + principal (ERR_PAYMENT_EXCEEDS_OUTSTANDING); adjuster approval <= policy coverage remaining (ERR_CLAIM_EXCEEDS_COVERAGE); collateral release must not open a deficiency (ERR_RELEASE_WOULD_CREATE_DEFICIENCY); patronage allocate needs positive total weight (ERR_NO_ELIGIBLE_PATRONAGE_BASE)"
    error_id: ERR_DRAW_EXCEEDS_AVAILABILITY
    http_status: 422
    applies_to: "draw approve, repayment create, adjuster report, collateral release, patronage allocate"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time. All date-sensitive rules (maturity, lapse, windows, accrual days, fiscal year) read this clock."
    roles: [System]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["current_utc set; no entity mutation; time-driven transitions fire only at the next run_periodic_review"]

  # --- Association ---
  - method: POST
    path: "/associations"
    description: "Create a Farm Credit association"
    roles: [AssociationBoard]
    code: 201
    input: [name, charter_number]
    output: Association
    side_effects: ["review_index=0, active_disaster_declarations=[]"]
  - method: GET
    path: "/associations/{id}"
    description: "Get an association"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: Association
    side_effects: []
  - method: POST
    path: "/associations/{id}/declare_disaster"
    description: "Declare a disaster covering counties for a date range"
    roles: [AssociationBoard]
    code: 200
    input: [disaster_ref, counties, start_date, end_date]
    output: Association
    side_effects: ["Appends { disaster_ref, counties, start_date, end_date } to active_disaster_declarations"]
  - method: POST
    path: "/associations/{id}/run_periodic_review"
    description: "Ops-run checkpoint: review_index += 1; interest accrual sweep to clock date for all non-terminal loans; lapse UCC filings whose lapse_date <= clock; activate deferrals whose window contains clock; expire deferrals past end; coverage-band posture recompute with consecutive-delinquency escalation to DEFAULT; margin deficiency sweep"
    roles: [System, LoanOfficer]
    code: 200
    output: Association
    input: []
    side_effects:
      - "review_index += 1"
      - "UCCFiling FILED/CONTINUED with lapse_date <= clock -> LAPSED (collateral/base/posture cascade)"
      - "DeferralRequest APPROVED with start <= clock < end -> IN_EFFECT; APPROVED/IN_EFFECT with end <= clock -> EXPIRED"
      - "Posture recompute per calculations.coverage_band_posture; DELINQUENT at review close increments consecutive_delinquent_reviews, reaching 2 -> DEFAULT"
      - "margin deficiency check per loan (issue/CURE notices)"

  # --- Borrower ---
  - method: POST
    path: "/borrowers"
    description: "Create a borrower (farm operation)"
    roles: [LoanOfficer]
    code: 201
    input: [association_id, legal_name, tax_id, county]
    output: Borrower
    side_effects: ["status=ACTIVE, patronage_eligible=true, active_covenant_breach_count=0"]
  - method: GET
    path: "/borrowers/{id}"
    description: "Get a borrower"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: Borrower
    side_effects: []
  - method: GET
    path: "/borrowers"
    description: "List borrowers"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: ["association_id?", "status?", "limit?", "offset?"]
    output: "Borrower[]"
    side_effects: []
  - method: POST
    path: "/borrowers/{id}/terminate"
    description: "Terminate a borrower whose loans are all terminal"
    roles: [CreditCommittee]
    code: 200
    input: []
    output: Borrower
    side_effects: ["status -> TERMINATED, patronage_eligible=false"]

  # --- LoanAccount ---
  - method: POST
    path: "/loan-accounts"
    description: "Create a loan application (DRAFT)"
    roles: [LoanOfficer]
    code: 201
    input: [borrower_id, requested_commitment_cents, rate_bps, season_year, maturity_date]
    output: LoanAccount
    side_effects: ["status=DRAFT, payment_posture=CURRENT, balances 0, association denormalized from borrower"]
  - method: GET
    path: "/loan-accounts/{id}"
    description: "Get a loan"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: LoanAccount
    side_effects: []
  - method: GET
    path: "/loan-accounts"
    description: "List loans"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: ["borrower_id?", "association_id?", "status?", "limit?", "offset?"]
    output: "LoanAccount[]"
    side_effects: []
  - method: POST
    path: "/loan-accounts/{id}/submit"
    description: "Submit application for committee review"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LoanAccount
    side_effects: ["status DRAFT -> SUBMITTED; increments LoanAccount.version by 1"]
  - method: POST
    path: "/loan-accounts/{id}/approve"
    description: "Committee approves with a commitment amount"
    roles: [CreditCommittee]
    code: 200
    input: [approved_commitment_cents]
    output: LoanAccount
    side_effects: ["status SUBMITTED -> APPROVED; approved_commitment_cents set; borrowing_base_cents recomputed; increments LoanAccount.version by 1"]
  - method: POST
    path: "/loan-accounts/{id}/activate"
    description: "Activate the line once insurance, perfection, maturity, and budget gates pass"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: LoanAccount
    side_effects: ["status APPROVED -> ACTIVE; last_accrual_date = clock date; increments LoanAccount.version by 1"]
  - method: POST
    path: "/loan-accounts/{id}/charge_off"
    description: "Charge off a DEFAULT loan"
    roles: [CreditCommittee]
    code: 200
    input: []
    output: LoanAccount
    side_effects: ["status ACTIVE -> CHARGED_OFF; borrower patronage_eligible=false; borrower re-evaluated; increments LoanAccount.version by 1"]
  - method: POST
    path: "/loan-accounts/{id}/foreclose"
    description: "Foreclose a loan with an ESCALATED margin call"
    roles: [CreditCommittee]
    code: 200
    input: []
    output: LoanAccount
    side_effects: ["status ACTIVE -> FORECLOSED; collateral released; filings terminated; increments LoanAccount.version by 1"]
  - method: GET
    path: "/loan-accounts/{id}/financial_summary"
    description: "Computed read of derived loan fields"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: "{ outstanding_principal_cents: integer, accrued_interest_cents: integer, borrowing_base_cents: integer, pending_draw_cents: integer, available_credit_cents: integer, coverage_cents: integer, payment_posture: string, status: string }"
    side_effects: []

  # --- CropBudget ---
  - method: POST
    path: "/crop-budgets"
    description: "Create a crop budget (DRAFT); supersedes an existing DRAFT budget of the same loan; OCC-guarded on the loan version"
    roles: [Borrower]
    code: 201
    input: [loan_account_id, season_year, crop_type, acres, projected_revenue_cents, projected_expenses_cents, expected_loan_version]
    output: CropBudget
    side_effects: ["existing DRAFT budget of same loan -> SUPERSEDED; increments LoanAccount.version by 1"]
  - method: GET
    path: "/crop-budgets/{id}"
    description: "Get a crop budget"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: CropBudget
    side_effects: []
  - method: GET
    path: "/crop-budgets"
    description: "List crop budgets"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: ["loan_account_id?", "status?", "limit?", "offset?"]
    output: "CropBudget[]"
    side_effects: []
  - method: POST
    path: "/crop-budgets/{id}/approve"
    description: "Officer approves budget; supersedes any other APPROVED budget of the loan and recomputes the borrowing base (provisional variant)"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: CropBudget
    side_effects: ["status DRAFT -> APPROVED; other APPROVED budget -> SUPERSEDED; borrowing_base recompute + posture + margin check; increments LoanAccount.version by 1"]
  - method: POST
    path: "/crop-budgets/{id}/record_actuals"
    description: "Record actual harvest revenue; switches borrowing base to harvest true-up variant"
    roles: [Borrower, LoanOfficer]
    code: 200
    input: [actual_revenue_cents]
    output: CropBudget
    side_effects: ["status APPROVED -> ACTUALIZED; borrowing_base recompute (true-up) + posture + margin check; increments LoanAccount.version by 1"]

  # --- Collateral ---
  - method: POST
    path: "/collateral"
    description: "Pledge collateral to a loan"
    roles: [LoanOfficer]
    code: 201
    input: [loan_account_id, collateral_type, description, appraised_value_cents, "prior_lien_cents?"]
    output: Collateral
    side_effects: ["status=PLEDGED, perfection_state=UNPERFECTED (no borrowing-base effect until perfected)"]
  - method: GET
    path: "/collateral/{id}"
    description: "Get collateral"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: Collateral
    side_effects: []
  - method: GET
    path: "/collateral"
    description: "List collateral"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: ["loan_account_id?", "collateral_type?", "status?", "limit?", "offset?"]
    output: "Collateral[]"
    side_effects: []
  - method: POST
    path: "/collateral/{id}/appraise"
    description: "Record a superseding appraisal; OCC-guarded on the collateral version"
    roles: [LoanOfficer]
    code: 200
    input: [appraised_value_cents, expected_collateral_version]
    output: Collateral
    side_effects: ["appraised_value_cents updated; increments Collateral.version by 1; borrowing_base recompute + posture + margin check"]
  - method: POST
    path: "/collateral/{id}/release"
    description: "Release pledged collateral (blocked if it would open a deficiency)"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: Collateral
    side_effects: ["status -> RELEASED; its FILED/CONTINUED filings -> TERMINATED; borrowing_base recompute + posture + margin check; increments LoanAccount.version by 1"]

  # --- UCCFiling ---
  - method: POST
    path: "/ucc-filings"
    description: "File a UCC-1 financing statement perfecting a collateral (created directly in FILED status)"
    roles: [LoanOfficer]
    code: 201
    input: [collateral_id, filing_number, jurisdiction, filed_date]
    output: UCCFiling
    side_effects: ["status=FILED; lapse_date = filed_date + 5 years; collateral perfection_state -> PERFECTED; borrowing_base recompute + posture + margin check; increments LoanAccount.version by 1"]
  - method: GET
    path: "/ucc-filings/{id}"
    description: "Get a UCC filing"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: UCCFiling
    side_effects: []
  - method: GET
    path: "/ucc-filings"
    description: "List UCC filings"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: ["collateral_id?", "status?", "limit?", "offset?"]
    output: "UCCFiling[]"
    side_effects: []
  - method: POST
    path: "/ucc-filings/{id}/continue"
    description: "File a continuation statement within the statutory window"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: UCCFiling
    side_effects: ["status -> CONTINUED; lapse_date += 5 years"]
  - method: POST
    path: "/ucc-filings/{id}/terminate"
    description: "Terminate a filing (releases perfection)"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: UCCFiling
    side_effects: ["status -> TERMINATED; collateral perfection_state recompute; borrowing_base recompute + posture + margin check; increments LoanAccount.version by 1"]

  # --- InsurancePolicy ---
  - method: POST
    path: "/insurance-policies"
    description: "Record a crop insurance policy (ACTIVE, UNASSIGNED); coverage windows for the same (borrower, crop_type, county) are half-open [coverage_start, coverage_end): overlap rejected, adjacency allowed"
    roles: [Borrower, LoanOfficer]
    code: 201
    input: [borrower_id, policy_number, crop_type, county, coverage_start, coverage_end, coverage_amount_cents]
    output: InsurancePolicy
    side_effects: ["status=ACTIVE, assignment_status=UNASSIGNED"]
  - method: GET
    path: "/insurance-policies/{id}"
    description: "Get a policy"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []
  - method: GET
    path: "/insurance-policies"
    description: "List policies"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: ["borrower_id?", "assigned_loan_id?", "status?", "limit?", "offset?"]
    output: "InsurancePolicy[]"
    side_effects: []
  - method: POST
    path: "/insurance-policies/{id}/assign"
    description: "Assign policy to a loan with the association as loss payee"
    roles: [LoanOfficer]
    code: 200
    input: [loan_account_id]
    output: InsurancePolicy
    side_effects: ["assignment_status UNASSIGNED -> ASSIGNED; assigned_loan_id set"]
  - method: POST
    path: "/insurance-policies/{id}/cancel"
    description: "Cancel a policy; releases any assignment"
    roles: [Borrower, LoanOfficer]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: ["status -> CANCELLED; assignment_status ASSIGNED -> RELEASED; assigned_loan_id cleared"]

  # --- InsuranceClaim ---
  - method: POST
    path: "/insurance-claims"
    description: "Report a claim under an assigned policy"
    roles: [Borrower, LoanOfficer]
    code: 201
    input: [policy_id, loan_account_id, claimed_loss_cents]
    output: InsuranceClaim
    side_effects: ["status=REPORTED"]
  - method: GET
    path: "/insurance-claims/{id}"
    description: "Get a claim"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []
  - method: GET
    path: "/insurance-claims"
    description: "List claims"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: ["policy_id?", "loan_account_id?", "status?", "limit?", "offset?"]
    output: "InsuranceClaim[]"
    side_effects: []
  - method: POST
    path: "/insurance-claims/{id}/adjuster_report"
    description: "Adjuster files the approved-loss report (REPORTED or UNDER_APPEAL -> ADJUSTED)"
    roles: [InsuranceAdjuster]
    code: 200
    input: [adjuster_approved_cents]
    output: InsuranceClaim
    side_effects: ["status -> ADJUSTED; adjuster_approved_cents set"]
  - method: POST
    path: "/insurance-claims/{id}/approve"
    description: "Adjuster approves the indemnity"
    roles: [InsuranceAdjuster]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["status ADJUSTED -> APPROVED"]
  - method: POST
    path: "/insurance-claims/{id}/deny"
    description: "Adjuster denies the claim"
    roles: [InsuranceAdjuster]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["status -> DENIED"]
  - method: POST
    path: "/insurance-claims/{id}/appeal"
    description: "Appeal an approved claim amount (opens the appeal loop)"
    roles: [Borrower, LoanOfficer]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["status APPROVED -> UNDER_APPEAL"]
  - method: POST
    path: "/insurance-claims/{id}/pay"
    description: "Record indemnity receipt; waterfall applies it to the loan as loss payee"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["status -> PAID; indemnity waterfall per calculations.insurance_indemnity_waterfall; loan balances, posture, margin, borrower cascades; increments LoanAccount.version by 1"]

  # --- DrawRequest ---
  - method: POST
    path: "/draw-requests"
    description: "Request an advance against the line (borrower-initiated, or officer on the borrower's behalf)"
    roles: [Borrower, LoanOfficer]
    code: 201
    input: [loan_account_id, amount_cents, purpose]
    output: DrawRequest
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/draw-requests/{id}"
    description: "Get a draw request"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: DrawRequest
    side_effects: []
  - method: GET
    path: "/draw-requests"
    description: "List draw requests"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: ["loan_account_id?", "status?", "limit?", "offset?"]
    output: "DrawRequest[]"
    side_effects: []
  - method: POST
    path: "/draw-requests/{id}/approve"
    description: "Officer approves a draw; reserves availability (state > posture > insurance > fiscal gate order)"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: DrawRequest
    side_effects: ["status REQUESTED -> APPROVED; pending_draw_cents += amount_cents"]
  - method: POST
    path: "/draw-requests/{id}/disburse"
    description: "Disburse an approved draw"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: DrawRequest
    side_effects: ["status -> DISBURSED; interest accrued to date; outstanding += amount; pending_draw_cents -= amount; disbursement_date set; posture/margin cascade; increments LoanAccount.version by 1"]
  - method: POST
    path: "/draw-requests/{id}/deny"
    description: "Deny a requested draw"
    roles: [LoanOfficer]
    code: 200
    input: ["reason?"]
    output: DrawRequest
    side_effects: ["status REQUESTED -> DENIED"]
  - method: POST
    path: "/draw-requests/{id}/cancel"
    description: "Borrower cancels a requested or approved draw"
    roles: [Borrower]
    code: 200
    input: []
    output: DrawRequest
    side_effects: ["status -> CANCELLED; pending reservation released when APPROVED"]
  - method: POST
    path: "/draw-requests/{id}/rescind"
    description: "Same-day rescission of a disbursed draw (exact compensation)"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: DrawRequest
    side_effects: ["status DISBURSED -> RESCINDED; outstanding -= amount; posture/margin cascade; increments LoanAccount.version by 1"]

  # --- Repayment ---
  - method: POST
    path: "/repayments"
    description: "Borrower makes a repayment, applied in full via the waterfall at creation"
    roles: [Borrower]
    code: 201
    input: [loan_account_id, amount_cents, source]
    output: Repayment
    side_effects: ["status=APPLIED; accrue-to-date then waterfall per calculations.repayment_waterfall; PAID_OFF auto-transition at exact zero; posture/margin/borrower cascades; increments LoanAccount.version by 1"]
  - method: GET
    path: "/repayments/{id}"
    description: "Get a repayment"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: Repayment
    side_effects: []
  - method: GET
    path: "/repayments"
    description: "List repayments"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: ["loan_account_id?", "status?", "limit?", "offset?"]
    output: "Repayment[]"
    side_effects: []
  - method: POST
    path: "/repayments/{id}/reverse"
    description: "Reverse an applied repayment (restores balances)"
    roles: [LoanOfficer]
    code: 200
    input: ["reason?"]
    output: Repayment
    side_effects: ["status -> REVERSED; balances restored; posture/margin/borrower cascades; increments LoanAccount.version by 1"]

  # --- CovenantEvaluation ---
  - method: POST
    path: "/covenant-evaluations"
    description: "Record borrower financials and evaluate the working-capital covenant"
    roles: [LoanOfficer]
    code: 201
    input: [loan_account_id, as_of_date, current_assets_cents, current_liabilities_cents]
    output: CovenantEvaluation
    side_effects: ["outcome computed per calculations.working_capital_covenant; BREACH increments borrower.active_covenant_breach_count, COMPLIANT resets it to 0; borrower status re-evaluated"]
  - method: GET
    path: "/covenant-evaluations/{id}"
    description: "Get a covenant evaluation"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: CovenantEvaluation
    side_effects: []
  - method: GET
    path: "/covenant-evaluations"
    description: "List covenant evaluations"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: ["loan_account_id?", "borrower_id?", "status?", "limit?", "offset?"]
    output: "CovenantEvaluation[]"
    side_effects: []
  - method: POST
    path: "/covenant-evaluations/{id}/waive"
    description: "Committee waives a recorded breach (segregated from the recorder)"
    roles: [CreditCommittee]
    code: 200
    input: []
    output: CovenantEvaluation
    side_effects: ["status RECORDED -> WAIVED; breach count -= 1 when outcome BREACH; borrower re-evaluated"]
  - method: POST
    path: "/covenant-evaluations/{id}/void"
    description: "Void a mis-recorded evaluation"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: CovenantEvaluation
    side_effects: ["status RECORDED -> VOIDED; breach count -= 1 when outcome BREACH; borrower re-evaluated"]

  # --- RestructurePlan ---
  - method: POST
    path: "/restructure-plans"
    description: "Propose a restructure for a distressed loan; supersedes the prior non-terminal plan and moves the loan to RESTRUCTURING; OCC-guarded on the loan version"
    roles: [LoanOfficer]
    code: 201
    input: [loan_account_id, plan_type, amortization_style, extension_months, new_rate_bps, capitalize_interest, expected_loan_version]
    output: RestructurePlan
    side_effects: ["prior PROPOSED/COMMITTEE_REVIEW/APPROVED plan of loan -> SUPERSEDED; loan status ACTIVE -> RESTRUCTURING; base_balance_cents and new_installment_cents computed frozen; increments LoanAccount.version by 1"]
  - method: GET
    path: "/restructure-plans/{id}"
    description: "Get a restructure plan"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: RestructurePlan
    side_effects: []
  - method: GET
    path: "/restructure-plans"
    description: "List restructure plans"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: ["loan_account_id?", "status?", "limit?", "offset?"]
    output: "RestructurePlan[]"
    side_effects: []
  - method: POST
    path: "/restructure-plans/{id}/submit"
    description: "Submit (or resubmit after rejection) to the credit committee"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: RestructurePlan
    side_effects: ["status PROPOSED|REJECTED -> COMMITTEE_REVIEW"]
  - method: POST
    path: "/restructure-plans/{id}/approve"
    description: "Committee approves the plan (segregated from its creator)"
    roles: [CreditCommittee]
    code: 200
    input: []
    output: RestructurePlan
    side_effects: ["status COMMITTEE_REVIEW -> APPROVED"]
  - method: POST
    path: "/restructure-plans/{id}/reject"
    description: "Committee rejects the plan; loan leaves RESTRUCTURING if no other open plan"
    roles: [CreditCommittee]
    code: 200
    input: ["reason?"]
    output: RestructurePlan
    side_effects: ["status COMMITTEE_REVIEW -> REJECTED; loan RESTRUCTURING -> ACTIVE when no other non-terminal plan; increments LoanAccount.version by 1"]
  - method: POST
    path: "/restructure-plans/{id}/execute"
    description: "Execute an approved plan: capitalize, re-rate, extend maturity, reset posture"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: RestructurePlan
    side_effects: ["status APPROVED -> EXECUTED; loan balances/rate/maturity rewritten from frozen plan numbers; loan RESTRUCTURING -> ACTIVE; posture CURRENT; increments LoanAccount.version by 1"]
  - method: POST
    path: "/restructure-plans/{id}/withdraw"
    description: "Withdraw a proposed plan"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: RestructurePlan
    side_effects: ["status PROPOSED -> WITHDRAWN; loan RESTRUCTURING -> ACTIVE when no other non-terminal plan; increments LoanAccount.version by 1"]

  # --- DeferralRequest ---
  - method: POST
    path: "/deferral-requests"
    description: "Borrower requests a disaster-linked payment deferral window"
    roles: [Borrower]
    code: 201
    input: [loan_account_id, disaster_ref, requested_start, requested_end]
    output: DeferralRequest
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/deferral-requests/{id}"
    description: "Get a deferral request"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: DeferralRequest
    side_effects: []
  - method: GET
    path: "/deferral-requests"
    description: "List deferral requests"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: ["loan_account_id?", "status?", "limit?", "offset?"]
    output: "DeferralRequest[]"
    side_effects: []
  - method: POST
    path: "/deferral-requests/{id}/approve"
    description: "Committee approves a deferral; overlap and 30-day buffer rules enforced here"
    roles: [CreditCommittee]
    code: 200
    input: []
    output: DeferralRequest
    side_effects: ["status SUBMITTED -> APPROVED"]
  - method: POST
    path: "/deferral-requests/{id}/deny"
    description: "Committee denies a deferral"
    roles: [CreditCommittee]
    code: 200
    input: []
    output: DeferralRequest
    side_effects: ["status SUBMITTED -> DENIED"]
  - method: POST
    path: "/deferral-requests/{id}/end_early"
    description: "End an in-effect deferral early"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: DeferralRequest
    side_effects: ["status IN_EFFECT -> ENDED_EARLY"]

  # --- PatronageDistribution ---
  - method: POST
    path: "/patronage-distributions"
    description: "Board declares the annual patronage pool for the prior fiscal year"
    roles: [AssociationBoard]
    code: 201
    input: [association_id, fiscal_year, pool_cents]
    output: PatronageDistribution
    side_effects: ["status=DECLARED; allocated_cents=0; undistributed_cents=pool_cents; allocation_lines=[]"]
  - method: GET
    path: "/patronage-distributions/{id}"
    description: "Get a distribution"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: PatronageDistribution
    side_effects: []
  - method: GET
    path: "/patronage-distributions"
    description: "List distributions"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: ["association_id?", "status?", "limit?", "offset?"]
    output: "PatronageDistribution[]"
    side_effects: []
  - method: POST
    path: "/patronage-distributions/{id}/allocate"
    description: "Compute per-borrower allocations from fiscal-year interest weights"
    roles: [AssociationBoard]
    code: 200
    input: []
    output: PatronageDistribution
    side_effects: ["status DECLARED -> ALLOCATED; allocation_lines, allocated_cents, undistributed_cents computed per calculations.patronage_allocation"]
  - method: POST
    path: "/patronage-distributions/{id}/pay"
    description: "Pay the allocated shares in cash"
    roles: [AssociationBoard]
    code: 200
    input: []
    output: PatronageDistribution
    side_effects: ["status ALLOCATED -> PAID"]
  - method: POST
    path: "/patronage-distributions/{id}/clawback"
    description: "Claw back one borrower's share after payment (eligibility reversal)"
    roles: [AssociationBoard]
    code: 200
    input: [borrower_id]
    output: PatronageDistribution
    side_effects: ["That borrower's line clawed_back=true; allocated_cents -= final_share; undistributed_cents += final_share; status remains PAID"]

  # --- MarginCallNotice (system-created) ---
  - method: GET
    path: "/margin-call-notices/{id}"
    description: "Get a margin call notice"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: []
    output: MarginCallNotice
    side_effects: []
  - method: GET
    path: "/margin-call-notices"
    description: "List margin call notices"
    roles: [Borrower, LoanOfficer, CreditCommittee, InsuranceAdjuster, AssociationBoard, System]
    code: 200
    input: ["loan_account_id?", "status?", "limit?", "offset?"]
    output: "MarginCallNotice[]"
    side_effects: []
  - method: POST
    path: "/margin-call-notices/{id}/escalate"
    description: "Committee escalates an uncured margin call; loan posture forced to DEFAULT"
    roles: [CreditCommittee]
    code: 200
    input: []
    output: MarginCallNotice
    side_effects: ["status ISSUED -> ESCALATED; loan posture -> DEFAULT; borrower re-evaluated"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role undeclared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_RESOURCE_NOT_OWNED, http: 403, condition: "Borrower-role caller acts on a resource chain owned by a different borrower" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum value, non-positive amount, start >= end window, or approved commitment out of range" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition not listed for the entity's current state, or entity is terminal" }
  - { id: ERR_LOAN_NOT_ACTIVE, http: 409, condition: "Loan status is not ACTIVE where ACTIVE is required (draw approve, claim pay, budget create, plan create)" }
  - { id: ERR_LOAN_POSTURE_BLOCKS_DRAWS, http: 409, condition: "Draw approve while payment_posture is DELINQUENT or DEFAULT" }
  - { id: ERR_BORROWER_SUSPENDED, http: 409, condition: "Borrower-initiated creation while borrower status is SUSPENDED" }
  - { id: ERR_INSURANCE_NOT_ASSIGNED, http: 409, condition: "No InsurancePolicy with status ACTIVE and assignment_status ASSIGNED for this loan" }
  - { id: ERR_COLLATERAL_UNPERFECTED, http: 409, condition: "No PLEDGED collateral with perfection_state PERFECTED at activation" }
  - { id: ERR_MATURITY_PASSED, http: 409, condition: "Logical clock is at or after maturity_date at activation" }
  - { id: ERR_BUDGET_NOT_APPROVED, http: 409, condition: "No APPROVED CropBudget for this loan at activation" }
  - { id: ERR_DRAW_EXCEEDS_AVAILABILITY, http: 422, condition: "Draw amount strictly greater than available credit" }
  - { id: ERR_PAYMENT_EXCEEDS_OUTSTANDING, http: 422, condition: "Repayment amount greater than accrued interest plus outstanding principal" }
  - { id: ERR_RESCIND_WINDOW_CLOSED, http: 409, condition: "Rescind attempted on a UTC date after the disbursement date" }
  - { id: ERR_COVERAGE_OVERLAP, http: 409, condition: "Policy coverage window overlaps an existing ACTIVE policy for the same (borrower, crop_type, county); adjacency is allowed" }
  - { id: ERR_POLICY_NUMBER_TAKEN, http: 409, condition: "policy_number already in use for this borrower" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "Assign or claim against a CANCELLED policy" }
  - { id: ERR_POLICY_ALREADY_ASSIGNED, http: 409, condition: "Assign a policy whose assignment_status is not UNASSIGNED" }
  - { id: ERR_POLICY_NOT_ASSIGNED_TO_LOAN, http: 409, condition: "Claim's loan_account_id differs from policy.assigned_loan_id or policy not ASSIGNED" }
  - { id: ERR_CLAIM_EXCEEDS_COVERAGE, http: 422, condition: "adjuster_approved_cents exceeds the policy's remaining coverage" }
  - { id: ERR_FILING_NUMBER_TAKEN, http: 409, condition: "filing_number already exists within the association" }
  - { id: ERR_CONTINUATION_WINDOW_NOT_OPEN, http: 409, condition: "Continuation outside [lapse_date - 180 days, lapse_date)" }
  - { id: ERR_CROSS_ASSOCIATION_REFERENCE, http: 422, condition: "Body references join entities belonging to different associations" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Caller X-User-ID equals recorded_by_user_id (covenant waive) or created_by_user_id (plan approve)" }
  - { id: ERR_DEFERRAL_OVERLAP, http: 409, condition: "Deferral window overlaps another APPROVED/IN_EFFECT deferral of the same loan (checked before the gap rule)" }
  - { id: ERR_DEFERRAL_GAP_TOO_SMALL, http: 409, condition: "Deferral window closer than 30 days to another APPROVED/IN_EFFECT deferral of the same loan" }
  - { id: ERR_DISASTER_NOT_FOUND, http: 409, condition: "disaster_ref absent from active_disaster_declarations, expired, or not covering the borrower's county" }
  - { id: ERR_DISASTER_REQUIRED, http: 409, condition: "DISASTER plan without an active disaster declaration covering the borrower, or without any APPROVED/IN_EFFECT/EXPIRED deferral on the loan" }
  - { id: ERR_RESTRUCTURE_GATE_NOT_MET, http: 409, condition: "Plan create while posture is CURRENT/WATCH and no ISSUED/ESCALATED margin call exists" }
  - { id: ERR_RELEASE_WOULD_CREATE_DEFICIENCY, http: 422, condition: "Collateral release would push outstanding principal above min(commitment, recomputed borrowing base)" }
  - { id: ERR_DISTRIBUTION_EXISTS, http: 409, condition: "A PatronageDistribution already exists for this (association, fiscal_year)" }
  - { id: ERR_INVALID_FISCAL_YEAR, http: 409, condition: "fiscal_year differs from current_fiscal_year - 1 at declaration" }
  - { id: ERR_NO_ELIGIBLE_PATRONAGE_BASE, http: 422, condition: "Allocate with total eligible interest weight equal to zero" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Borrower
    description: "Farm operation; acts only on its own loans, budgets, draws, repayments, deferrals, claims, and policies"
    identity: "entity_backed:Borrower"
    exclusive_operations:
      - "POST /crop-budgets — submit crop budget"
      - "POST /draw-requests — request an advance (shared with LoanOfficer)"
      - "POST /draw-requests/{id}/cancel — cancel own draw"
      - "POST /repayments — make a repayment"
      - "POST /deferral-requests — request disaster deferral"
    shared_operations:
      - "POST /crop-budgets/{id}/record_actuals (with LoanOfficer)"
      - "POST /insurance-policies, POST /insurance-policies/{id}/cancel (with LoanOfficer)"
      - "POST /insurance-claims (with LoanOfficer)"
      - "POST /insurance-claims/{id}/appeal (with LoanOfficer)"
      - "GET read endpoints (with all roles)"
  - name: LoanOfficer
    description: "Association lending staff; originates and services loans, files UCC statements, records evaluations, disburses draws"
    identity: "opaque"
    exclusive_operations:
      - "POST /borrowers — create borrower"
      - "POST /loan-accounts, submit, activate"
      - "POST /crop-budgets/{id}/approve"
      - "POST /collateral, appraise, release"
      - "POST /ucc-filings, continue, terminate"
      - "POST /insurance-policies/{id}/assign"
      - "POST /insurance-claims/{id}/pay"
      - "POST /draw-requests/{id}/approve, disburse, deny, rescind"
      - "POST /draw-requests (with Borrower)"
      - "POST /repayments/{id}/reverse"
      - "POST /covenant-evaluations, void"
      - "POST /restructure-plans, submit, execute, withdraw"
      - "POST /deferral-requests/{id}/end_early"
    shared_operations:
      - "POST /associations/{id}/run_periodic_review (with System)"
      - "POST /insurance-policies, cancel (with Borrower)"
      - "POST /insurance-claims (with Borrower)"
      - "POST /insurance-claims/{id}/appeal (with Borrower)"
      - "POST /crop-budgets/{id}/record_actuals (with Borrower)"
      - "GET read endpoints (with all roles)"
  - name: CreditCommittee
    description: "Credit approval authority; approves loans, restructures, deferrals; waives covenants; escalates margin calls"
    identity: "opaque"
    exclusive_operations:
      - "POST /loan-accounts/{id}/approve, charge_off, foreclose"
      - "POST /borrowers/{id}/terminate"
      - "POST /covenant-evaluations/{id}/waive"
      - "POST /restructure-plans/{id}/approve, reject"
      - "POST /deferral-requests/{id}/approve, deny"
      - "POST /margin-call-notices/{id}/escalate"
    shared_operations:
      - "GET read endpoints (with all roles)"
  - name: InsuranceAdjuster
    description: "Crop insurance adjuster; files loss reports and approves or denies indemnities"
    identity: "opaque"
    exclusive_operations:
      - "POST /insurance-claims/{id}/adjuster_report"
      - "POST /insurance-claims/{id}/approve"
      - "POST /insurance-claims/{id}/deny"
    shared_operations:
      - "GET read endpoints (with all roles)"
  - name: AssociationBoard
    description: "Co-op board; governs the association, declares disasters, declares and pays patronage"
    identity: "opaque"
    exclusive_operations:
      - "POST /associations"
      - "POST /associations/{id}/declare_disaster"
      - "POST /patronage-distributions, allocate, pay, clawback"
    shared_operations:
      - "GET read endpoints (with all roles)"
  - name: System
    description: "Automation role for the logical clock and ops-run checkpoint"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /associations/{id}/run_periodic_review (with LoanOfficer)"
      - "GET read endpoints (with all roles)"
