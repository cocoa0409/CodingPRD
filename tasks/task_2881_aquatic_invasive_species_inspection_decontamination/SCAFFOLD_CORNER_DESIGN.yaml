      - name: parallel_dimensions_of_a_record_advance_independently
        claim_type: valid_transition
        grounds:
          - state_machines.InspectionRecord.inspection_status
          - state_machines.InspectionRecord.enforcement_status
        excluded_because:
          difficulty_instance: inspection_record_two_dimensions_advance_independently
          rationale: "The §1.8 instance already drives both dimensions of one record through their full independent sequences in a single scenario and asserts the cross-product, so a breadth restatement of 'two dimensions move separately' would add no distinct claim."

      - name: compensating_transition_dismissal_restores_the_pre_referral_posture
        claim_type: side_effect_execution
        grounds:
          - state_machines.InspectionRecord.enforcement_status.REFERRED_to_DISMISSED
          - invariants.compliance_strike_conservation
        excluded_because:
          difficulty_instance: compliance_strikes_conserved_when_a_referral_is_dismissed
          rationale: "The §1.8 instance already asserts the full compensating side-effect set of DISMISS - strike decrement, watchlist re-derivation and mandatory_decon_flag restoration - against the conservation invariant, which strictly contains what a breadth probe of this transition's side effects would check."

      - name: guarded_transition_record_creation_requires_an_open_station
        claim_type: precondition_enforcement
        grounds:
          - state_machines.InspectionRecord.creation_precondition
          - errors.ERR_STATION_NOT_OPEN
        excluded_because:
          difficulty_instance: record_creation_depends_on_station_being_open
          rationale: "The §1.8 cross-entity-state instance already walks the station through PLANNED, OPEN, SUSPENDED and CLOSED and asserts which of those permit POST /inspection-records, covering the guard in both the positive and negative direction."

      - name: ledger_synchronised_cascade_on_decon_abandonment
        claim_type: conditional_cascade
        grounds:
          - state_machines.DeconOrder.TREATED_to_ABANDONED
          - state_machines.InspectionRecord.DECON_REQUIRED_to_DECON_FAILED_ABANDONED
          - invariants.fee_ledger_conservation
        excluded_because:
          difficulty_instance: fee_ledger_conserved_when_an_abandonment_refunds_the_treatment_charge
          rationale: "The §1.8 compensating-invariant instance already asserts the abandonment cascade's exact ledger arithmetic on both the record and the station, including the pre-computed refund amount; the corner retained above is the complementary one where that same cascade must NOT fire."

  - section: calculations
    instances:
      - name: correct_result_certification_level_from_credited_hours_and_endorsement
        claim_type: correct_result
        grounds:
          - calculations.inspector_certification_level
          - state_machines.Inspector.PROBATIONARY_to_ACTIVE
        distinguishing_aspect: "The whole ladder in one scenario: 8.00 credited hours reach exactly CERT_LEVEL1_HOURS and give LEVEL_1 with the PROBATIONARY -> ACTIVE promotion, and 40.00 hours reach exactly CERT_LEVEL2_HOURS and give DECON_CERTIFIED only because decon_endorsement is true - the same 40.00 hours without the endorsement give LEVEL_2."
        test_recipe:
          setup:
            - "Two inspectors at one station: insp_b with decon_endorsement true, insp_c with the default false."
            - "Clock 2026-08-01T00:00:00Z for the first module, then 2026-08-02T00:00:00Z for the second, to show certification_expires_at is stamped only at the first promotion."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Polson Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}", hot_water_capable: true }
              as: ProgramAdmin
              captures: { st_id: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Ben Steam", home_station_id: "${st_id}", decon_endorsement: true }
              as: ProgramAdmin
              captures: { insp_b: $.data.id }
            - call: "POST /inspectors"
              payload: { full_name: "Cara Verify", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_c: $.data.id }
            - call: "POST /inspectors/${insp_b}/training-records"
              payload: { module_code: "AIS-101", hours: 8, passed: true }
              as: TrainingOfficer
            - call: "GET /inspectors/${insp_b}"
              payload: {}
              as: ProgramAdmin
              captures: { insp_b_expiry: $.data.certification_expires_at }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /inspectors/${insp_b}/training-records"
              payload: { module_code: "AIS-DECON-200", hours: 32, passed: true }
              as: TrainingOfficer
          assert:
            - "after the 8-hour module Inspector.${insp_b}.training_hours_total == 8.00, certification_level == LEVEL_1, status == ACTIVE, certification_expires_at == 2027-08-01T00:00:00Z (2026-08-01T00:00:00Z + CERT_VALID_HOURS 8760)"
            - "the trigger returns 201 and Inspector.${insp_b}.training_hours_total == 40.00 with certification_level == DECON_CERTIFIED"
            - "Inspector.${insp_b}.certification_expires_at is still ${insp_b_expiry} == 2027-08-01T00:00:00Z, NOT re-stamped to 2027-08-02T00:00:00Z"
            - "control: giving insp_c a single 40-hour passed module yields training_hours_total 40.00 with certification_level LEVEL_2, because decon_endorsement is false"
            - "both inspectors sit at exactly the >= thresholds, so 8.00 must not be read as TRAINEE and 40.00 must not be read as LEVEL_1"

      - name: input_set_filtering_failed_training_modules_credit_no_hours
        claim_type: input_set_filtering
        grounds:
          - calculations.inspector_certification_level.input_set
          - entities.TrainingRecord.fields.passed
        distinguishing_aspect: "The aggregation sums only rows with passed == true: a persisted 100-hour FAILED module leaves training_hours_total at 8.00 and certification_level at LEVEL_1, even though the row itself is listed by the child collection."
        test_recipe:
          setup:
            - "insp_a with one passed 8-hour module, so training_hours_total is 8.00 and certification_level is LEVEL_1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
