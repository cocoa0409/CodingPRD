scenario: |
  Indoor Waterpark Resort Capacity, Wristband Access & Package Rates (Great Wolf Lodge):
  room package pricing that bundles waterpark passes by occupancy with day-pass capacity
  limits, wristband issuance encoding room charging privileges, waterpark access and
  attraction entitlements, daily attendance capacity management balancing hotel guests
  against limited day passes, attraction staffing with lifeguard certification, rotation
  schedules and audit compliance, upsell attraction packages for arcade credits, activities
  and character experiences with tiered pricing, arrival day access before check-in and
  departure day access after checkout affecting capacity, water quality monitoring and pool
  closure protocols, group and birthday bookings with cabana and party room inventory

domain_name: "waterpark-resort-capacity"
api_prefix: "/resorts/{resort_id}"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - "optimistic concurrency"
    - "cascading side effects"
    - "dual-variant calculation"
    - "rate / threshold triggers"
  entity_topology: "flat"
  state_machine_shape: "parallel"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "cross_aggregate"
  role_model: "hierarchical_override"
  consistency_model: "immediate"

entities:

  - name: Resort
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Resort property name"
      - name: park_capacity_occupancy_units
        type: integer
        source: input
        description: "Maximum concurrent rolled-up attendance (occupancy units) permitted inside the waterpark"
        constraints: ">= 1"
      - name: day_pass_cap_units
        type: integer
        source: input
        description: "Maximum occupancy units per service date that day-pass guests may consume"
        constraints: ">= 0 and <= park_capacity_occupancy_units"
      - name: day_pass_reserved_units
        type: computed
        description: "Occupancy units reserved by DayPass purchases on a service date; scoped per service_date, not stored on the Resort row"
      - name: arcade_credit_rate_cents_per_unit
        type: integer
        source: input
        description: "Arcade credit cents granted per occupancy unit per night on a booked stay"
      - name: manager_override_used
        type: boolean
        source: system
        description: "Set true when a capacity manager override is applied for the current service date"
        default: false
      - name: pool_posture
        type: enum
        source: computed
        description: "OPEN | CLOSED — derived from the Resort's non-terminal WaterQualityLog rows"
        constraints: "OPEN | CLOSED"
      - name: ops_run_index
        type: integer
        source: system
        description: "Monotonic counter incremented by each run_ops housekeeping pass"
        default: 0
      - name: managers
        type: array
        source: system
        description: "Array of staffing-roster entries, each a string of the form \"<role>:<name>\". Read by the lifeguard_attraction_status calculation as the rotation roster; mutated only by POST /resorts/{resort_id}/managers"
        default: []

  - name: RoomType
    parent: Resort
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only"
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC with three fractional digits"
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; owning property"
      - name: code
        type: string
        source: input
        description: "Short room-type code, e.g. WOLF_SUITE"
      - name: max_occupancy
        type: integer
        source: input
        description: "Maximum guests the room type may sleep"
        constraints: ">= 1"
      - name: base_rate_cents
        type: integer
        source: input
        description: "Nightly room rate before package surcharges and seasonal multipliers"
      - name: is_cabana
        type: boolean
        source: input
        description: "True when this room type is a poolside cabana rather than a sleeping room"
        default: false

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; property being booked"
      - name: room_type_id
        type: string
        source: input
        description: "FK -> RoomType.id; booked room type"
      - name: booking_status
        type: enum
        source: system
        description: "RESERVED | CHECKED_OUT | CANCELLED"
        constraints: "RESERVED | CHECKED_OUT | CANCELLED"
      - name: stay_status
        type: enum
        source: system
        description: "NOT_STARTED | IN_HOUSE | DEPARTED"
        constraints: "NOT_STARTED | IN_HOUSE | DEPARTED"
      - name: guest_count
        type: integer
        source: input
        description: "Number of registered guests declared on the booking"
        constraints: ">= 1 and <= RoomType.max_occupancy"
      - name: arrival_date
        type: string
        source: input
        description: "Service date (YYYY-MM-DD) on which guests may enter the waterpark before check-in"
      - name: departure_date
        type: string
        source: input
        description: "Service date (YYYY-MM-DD) on which guests retain waterpark access after checkout"
      - name: nights
        type: integer
        source: computed
        description: "Number of nights between arrival_date and departure_date"
      - name: waterpark_included_units
        type: integer
        source: computed
        description: "Occupancy units bundled into the room package; always equals guest_count"
      - name: reserved_units
        type: integer
        source: computed
        description: "Occupancy units this booking consumes on its current service date"
      - name: package_rate_total_cents
        type: integer
        source: computed
        description: "Total package price; result of the package_rate calculation"
      - name: package_rate_withheld_cents
        type: integer
        source: computed
        description: "Total package price under the withheld-authorization interpretation; result of the package_rate_authorization calculation"
      - name: credited_arcade_cents
        type: integer
        source: computed
        description: "Arcade credit cents granted to the booking once check-in completes"
      - name: checked_in_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp of check-in; null until checked in"
      - name: checked_out_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp of checkout; null until checked out"

  - name: DayPass
    parent: null
    common_fields: true
    fields:
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; property the day pass admits to"
      - name: service_date
        type: string
        source: input
        description: "Service date (YYYY-MM-DD) the day pass admits a guest"
      - name: units_requested
        type: integer
        source: input
        description: "Occupancy units requested; one unit per guest admitted"
        constraints: ">= 1"
      - name: day_pass_status
        type: enum
        source: system
        description: "RESERVED | ADMITTED | VOID | EXPIRED"
        constraints: "RESERVED | ADMITTED | VOID | EXPIRED"
      - name: price_total_cents
        type: integer
        source: computed
        description: "Total day-pass price; result of the day_pass_price calculation"

  - name: Wristband
    parent: null
    common_fields: true
    fields:
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; issuing property"
      - name: holder_type
        type: enum
        source: input
        description: "RESERVATION_GUEST | DAY_PASS_GUEST | GROUP_MEMBER"
        constraints: "RESERVATION_GUEST | DAY_PASS_GUEST | GROUP_MEMBER"
      - name: reservation_id
        type: string
        source: input
        description: "FK -> Reservation.id; owning booking when holder_type=RESERVATION_GUEST, null otherwise"
      - name: day_pass_id
        type: string
        source: input
        description: "FK -> DayPass.id; owning day pass when holder_type=DAY_PASS_GUEST, null otherwise"
      - name: owner_name
        type: string
        source: input
        description: "Printed name on the wristband"
      - name: wristband_status
        type: enum
        source: system
        description: "ISSUED | ACTIVE | REVOKED | EXPIRED | REISSUED"
        constraints: "ISSUED | ACTIVE | REVOKED | EXPIRED | REISSUED"
      - name: access_status
        type: enum
        source: system
        description: "PENDING | GRANTED | DENIED"
        constraints: "PENDING | GRANTED | DENIED"
      - name: room_charge_enabled
        type: boolean
        source: system
        description: "True when the wristband may post charges to the linked Reservation's folio"
        default: false
      - name: arcade_credit_limit_cents
        type: integer
        source: system
        description: "Ceiling on room-posted arcade charges for this wristband"
        default: 0
      - name: arcade_credit_spent_cents
        type: integer
        source: computed
        description: "Sum of SUCCEEDED ArcadeCreditGrant.amount_cents for this wristband"
      - name: arcade_credit_remaining_cents
        type: integer
        source: computed
        description: "arcade_credit_limit_cents - arcade_credit_spent_cents, floored at 0"
      - name: access_denied_reason
        type: string
        source: system
        description: "Reason text stamped when access_status=DENIED; null otherwise"
      - name: valid_on_service_date
        type: string
        source: computed
        description: "Service date this wristband currently admits; equals Reservation.arrival_date on the arrival-day issue"
      - name: superseded_by_wristband_id
        type: string
        source: system
        description: "FK -> Wristband.id; successor band when this band was re-issued, null otherwise"

  - name: Attraction
    parent: Resort
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only"
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC with three fractional digits"
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; owning property"
      - name: name
        type: string
        source: input
        description: "Attraction display name"
      - name: min_occupancy_units
        type: integer
        source: input
        description: "Floor on concurrent occupancy units required to open the attraction"
        constraints: ">= 0"
      - name: required_certification
        type: enum
        source: input
        description: "LIFEGUARD | NONE — certification a staffer must hold to be posted here"
        constraints: "LIFEGUARD | NONE"
      - name: attraction_status
        type: enum
        source: system
        description: "OPEN | LIMITED | CLOSED"
        constraints: "OPEN | LIMITED | CLOSED"

  - name: LifeguardShift
    parent: null
    common_fields: true
    fields:
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; property the shift belongs to"
      - name: attraction_id
        type: string
        source: input
        description: "FK -> Attraction.id; posted attraction"
      - name: staffer_name
        type: string
        source: input
        description: "Name of the posted staffer"
      - name: certification_code
        type: enum
        source: input
        description: "LIFEGUARD | NONE — the staffer's held certification"
        constraints: "LIFEGUARD | NONE"
      - name: shift_date
        type: string
        source: input
        description: "Service date (YYYY-MM-DD) of the shift"
      - name: start_minute
        type: integer
        source: input
        description: "Minutes after midnight the shift begins; inclusive lower bound"
        constraints: ">= 0 and <= 1439"
      - name: end_minute
        type: integer
        source: input
        description: "Minutes after midnight the shift ends; exclusive upper bound"
        constraints: "> start_minute and <= 1440"
      - name: rotation_minutes
        type: integer
        source: input
        description: "Maximum consecutive posted minutes allowed before a rotation break"
        constraints: ">= 1"
      - name: shift_status
        type: enum
        source: system
        description: "SCHEDULED | ON_DUTY | ROTATED | COMPLETED"
        constraints: "SCHEDULED | ON_DUTY | ROTATED | COMPLETED"

  - name: WaterQualityLog
    parent: null
    common_fields: true
    fields:
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; property the reading belongs to"
      - name: attraction_id
        type: string
        source: input
        description: "FK -> Attraction.id; body of water sampled"
      - name: sampled_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the sample was taken"
      - name: ph_reading
        type: number
        source: input
        description: "Measured pH of the water sample"
      - name: free_chlorine_ppm
        type: number
        source: input
        description: "Measured free chlorine concentration in parts per million"
      - name: turbidity_ntu
        type: number
        source: input
        description: "Measured turbidity in nephelometric turbidity units"
      - name: log_status
        type: enum
        source: system
        description: "PASS | FAIL"
        constraints: "PASS | FAIL"
      - name: closure_reason
        type: string
        source: system
        description: "Reason text stamped when the log drives a pool closure; null on PASS"
      - name: superseded_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant a later PASS log at the same instant replaced this reading; null while the reading stands. A FAIL reading whose superseded_at is non-null no longer holds the pool closed (ERR_DUPLICATE_READING_AT_INSTANT guards the collision)."

  - name: AdmissionEvent
    parent: null
    common_fields: true
    fields:
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; property admitting the guest"
      - name: wristband_id
        type: string
        source: input
        description: "FK -> Wristband.id; the band presented at the gate"
      - name: service_date
        type: string
        source: input
        description: "Service date (YYYY-MM-DD) the admission is posted against"
      - name: direction
        type: enum
        source: input
        description: "IN | OUT"
        constraints: "IN | OUT"
      - name: event_status
        type: enum
        source: system
        description: "ACCEPTED | REJECTED"
        constraints: "ACCEPTED | REJECTED"
      - name: units_delta
        type: integer
        source: computed
        description: "+wristband holder units on IN, -wristband holder units on OUT, 0 when REJECTED"

  - name: ArcadeCreditGrant
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only"
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC with three fractional digits"
      - name: wristband_id
        type: string
        source: input
        description: "FK -> Wristband.id; the band the credits are attached to"
      - name: reservation_id
        type: string
        source: input
        description: "FK -> Reservation.id; the folio the credits settle against"
      - name: amount_cents
        type: integer
        source: input
        description: "Requested arcade credit amount in cents"
        constraints: ">= 1"
      - name: grant_status
        type: enum
        source: system
        description: "PENDING | SUCCEEDED | DECLINED"
        constraints: "PENDING | SUCCEEDED | DECLINED"
      - name: decline_reason
        type: string
        source: system
        description: "Reason text stamped when grant_status=DECLINED; null otherwise"

  - name: Cabana
    parent: null
    common_fields: true
    fields:
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; owning property"
      - name: cabana_label
        type: string
        source: input
        description: "Human label for the cabana or party room, unique per resort"
      - name: cabana_kind
        type: enum
        source: input
        description: "CABANA | PARTY_ROOM"
        constraints: "CABANA | PARTY_ROOM"
      - name: capacity_units
        type: integer
        source: input
        description: "Occupancy units the cabana or party room may hold"
        constraints: ">= 1"
      - name: cabana_status
        type: enum
        source: system
        description: "AVAILABLE | HELD | BOOKED | RELEASED"
        constraints: "AVAILABLE | HELD | BOOKED | RELEASED"

  - name: CabanaBooking
    parent: null
    common_fields: true
    fields:
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; owning property"
      - name: cabana_id
        type: string
        source: input
        description: "FK -> Cabana.id; the cabana or party room being occupied"
      - name: group_booking_id
        type: string
        source: input
        description: "FK -> GroupBooking.id; the group this booking belongs to"
      - name: service_date
        type: string
        source: input
        description: "Service date (YYYY-MM-DD) of the occupation"
      - name: start_minute
        type: integer
        source: input
        description: "Minutes after midnight the occupation begins; inclusive lower bound"
        constraints: ">= 0 and <= 1439"
      - name: end_minute
        type: integer
        source: input
        description: "Minutes after midnight the occupation ends; exclusive upper bound"
        constraints: "> start_minute and <= 1440"
      - name: hold_expires_at
        type: datetime
        source: system
        description: "ISO 8601 UTC instant a HELD occupation lapses; null when BOOKED"
      - name: members
        type: array
        source: system
        description: "Array of member object ids newly admitted by this booking; empty when the booking is HELD or members already admitted"
      - name: member_units
        type: integer
        source: input
        description: "Occupancy units the group intends to seat in the cabana"
        constraints: ">= 1 and <= Cabana.capacity_units"
      - name: cabana_booking_status
        type: enum
        source: system
        description: "HELD | BOOKED | CANCELLED | EXPIRED | COMPLETED"
        constraints: "HELD | BOOKED | CANCELLED | EXPIRED | COMPLETED"

  - name: GroupBooking
    parent: null
    common_fields: true
    fields:
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; property hosting the group"
      - name: group_kind
        type: enum
        source: input
        description: "BIRTHDAY | SCHOOL | FAMILY_REUNION | CORPORATE"
        constraints: "BIRTHDAY | SCHOOL | FAMILY_REUNION | CORPORATE"
      - name: group_status
        type: enum
        source: system
        description: "PENDING_DEPOSIT | CONFIRMED | CANCELLED"
        constraints: "PENDING_DEPOSIT | CONFIRMED | CANCELLED"
      - name: service_date
        type: string
        source: input
        description: "Service date (YYYY-MM-DD) of the group visit"
      - name: member_count
        type: integer
        source: input
        description: "Total guests declared in the group"
        constraints: ">= 1"
      - name: deposit_paid_cents
        type: integer
        source: input
        description: "Deposit amount already settled for the group"
        default: 0
      - name: group_reserved_units
        type: computed
        description: "Occupancy units this group consumes on its service date"

  - name: GroupMember
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only"
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC with three fractional digits"
      - name: group_booking_id
        type: string
        source: input
        description: "FK -> GroupBooking.id; owning group"
      - name: member_name
        type: string
        source: input
        description: "Name of the group member"
      - name: member_units
        type: integer
        source: input
        description: "Occupancy units this member consumes"
        default: 1
        constraints: ">= 1"
      - name: checked_in
        type: boolean
        source: system
        description: "True once the member has been admitted to the waterpark"
        default: false

  - name: ActivitySession
    parent: Resort
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, identity only"
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC with three fractional digits"
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; owning property"
      - name: name
        type: string
        source: input
        description: "Activity or character-experience name"
      - name: tier_code
        type: enum
        source: input
        description: "STANDARD | PREMIUM | VIP — tiered pricing band for the session"
        constraints: "STANDARD | PREMIUM | VIP"
      - name: base_price_cents
        type: integer
        source: input
        description: "Per-attendee price at tier STANDARD before multipliers"
      - name: capacity_units
        type: integer
        source: input
        description: "Maximum occupancy units the session may seat"
        constraints: ">= 1"
      - name: opt_in_ratio
        type: number
        source: computed
        description: "ActivitySession.capacity_units / denominator_units, stamped at the instant the session is created"
      - name: opt_in_ratio_strict
        type: number
        source: computed
        description: "Strict-division reading: capacity_units / denominator_units, stamped at creation; null when denominator_units == 0"
      - name: opt_in_ratio_inclusive
        type: number
        source: computed
        description: "Self-inclusive reading: capacity_units / (denominator_units + capacity_units), stamped at creation"
      - name: opt_in_gate
        type: enum
        source: computed
        description: "ADMIT | HOLD — ADMIT when opt_in_ratio_strict >= OPT_IN_RATIO_THRESHOLD or denominator_units == 0, HOLD otherwise"
        constraints: "ADMIT | HOLD"

  - name: ActivityBooking
    parent: null
    common_fields: true
    fields:
      - name: resort_id
        type: string
        source: input
        description: "FK -> Resort.id; owning property"
      - name: activity_session_id
        type: string
        source: input
        description: "FK -> ActivitySession.id; the session being booked"
      - name: group_booking_id
        type: string
        source: input
        description: "FK -> GroupBooking.id; the group booking the session is attached to"
      - name: attendees
        type: integer
        source: input
        description: "Number of attendees booked into the session"
        constraints: ">= 1"
      - name: reservation_id
        type: string
        source: input
        description: "FK -> Reservation.id; the folio the activity charge settles against"
      - name: activity_booking_status
        type: enum
        source: system
        description: "PENDING_PAYMENT | CONFIRMED | CANCELLED — a cancelled booking settles its refund in the same transition"
        constraints: "PENDING_PAYMENT | CONFIRMED | CANCELLED"
      - name: activity_rate_total_cents
        type: integer
        source: computed
        description: "Total activity price; result of the activity_rate calculation"
      - name: activity_rate_refund_cents
        type: integer
        source: computed
        description: "Refundable portion when the booking is CANCELLED; result of the activity_refund_variant calculation"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

state_machines:

  - entity: Reservation
    field: booking_status
    initial_state: RESERVED
    terminal_states: [CHECKED_OUT, CANCELLED]
    transitions:
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /reservations/{reservation_id}/cancel"
        actor: "FrontDesk"
        preconditions:
          - "Reservation.booking_status == RESERVED"
          - "No Wristband with wristband_status IN {ISSUED, ACTIVE} references this Reservation.id"
        side_effects:
          - "booking_status → CANCELLED; stay_status → DEPARTED"
          - "room_units_reserved for the reservation's current service date decrements by Reservation.reserved_units"
          - "Recomputes Resort.day_pass_reserved_units for affected service dates"
          - "Increments Reservation.version by 1"
        note: "The PRD model omits HOLD and EXPIRED booking states; arrival-day-to-departure-day access remains reachable through stay_status and service-date-scoped unit reservation."

      - from: RESERVED
        to: CHECKED_OUT
        trigger: "POST /reservations/{reservation_id}/check_out"
        actor: "FrontDesk"
        preconditions:
          - "Reservation.stay_status == IN_HOUSE"
        side_effects:
          - "booking_status → CHECKED_OUT; stay_status → DEPARTED; checked_out_at stamped"
          - "Every Wristband with holder_type=RESERVATION_GUEST and reservation_id == Reservation.id → wristband_status=EXPIRED, access_status=DENIED"
          - "Every Wristband with room_charge_enabled=true linked to this Reservation → room_charge_enabled=false"
          - "Every ArcadeCreditGrant whose wristband_id is one of those expired bands and whose grant_status == SUCCEEDED → DECLINED with decline_reason='RESERVATION_CLOSED'"
          - "room_units_reserved for departure_date decrements by Reservation.reserved_units"
          - "Resort.pool_posture recomputed from non-terminal WaterQualityLog rows"
          - "Increments Reservation.version by 1"

  - entity: Reservation
    field: stay_status
    initial_state: NOT_STARTED
    terminal_states: [DEPARTED]
    transitions:
      - from: NOT_STARTED
        to: IN_HOUSE
        trigger: "POST /reservations/{reservation_id}/check_in"
        actor: "FrontDesk"
        preconditions:
          - "Reservation.booking_status == RESERVED"
          - "Reservation.stay_status == NOT_STARTED"
        side_effects:
          - "stay_status → IN_HOUSE; checked_in_at stamped"
          - "Reservation.reserved_units set to Reservation.waterpark_included_units"
          - "room_units_reserved for arrival_date increments by Reservation.waterpark_included_units"
          - "Resort.day_pass_reserved_units recomputed for arrival_date and departure_date"
          - "Reservation.credited_arcade_cents set to the arcade_credit_accrual calculation output"
          - "Every Wristband with holder_type=DAY_PASS_GUEST and valid_on_service_date == Reservation.arrival_date → wristband_status=REVOKED, access_status=DENIED"
          - "Every Wristband with holder_type=RESERVATION_GUEST and reservation_id == Reservation.id → room_charge_enabled=true, arcade_credit_limit_cents = Resort.arcade_credit_rate_cents_per_unit * Reservation.waterpark_included_units"
          - "Increments Reservation.version by 1"

      - from: IN_HOUSE
        to: DEPARTED
        trigger: "system (POST /reservations/{reservation_id}/check_out, or a check-out posted against an already CHECKED_OUT booking)"
        actor: "system"
        preconditions:
          - "Reservation.stay_status == IN_HOUSE"
        side_effects:
          - "stay_status → DEPARTED; checked_out_at stamped"
          - "Departure-day waterpark access is retained: wristbands are expired only on the next non-departure service date"
          - "Increments Reservation.version by 1"

  - entity: Wristband
    field: wristband_status
    initial_state: ISSUED
    terminal_states: [EXPIRED, REISSUED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /wristbands/{wristband_id}/activate"
        actor: "FrontDesk"
        preconditions:
          - "Wristband.wristband_status == ISSUED"
          - "Wristband.holder_type == RESERVATION_GUEST implies linked Reservation.stay_status == IN_HOUSE"
          - "Wristband.holder_type == DAY_PASS_GUEST implies linked DayPass.day_pass_status == RESERVED"
          - "Resort.pool_posture == OPEN"
          - "Resort.day_pass_reserved_units + Resort.group_reserved_units + Resort.room_units_reserved <= Resort.park_capacity_occupancy_units"
        side_effects:
          - "wristband_status → ACTIVE"
          - "Resort.room_units_reserved recomputed for valid_on_service_date"
          - "Resort.pool_posture recomputed from non-terminal WaterQualityLog rows"
          - "Increments Wristband.version by 1"

      - from: ISSUED
        to: REVOKED
        trigger: "system (Reservation check-in on the band's valid_on_service_date, or a FAIL WaterQualityLog preceded by a check-in on the same service date)"
        actor: "system"
        preconditions:
          - "Wristband.wristband_status == ISSUED"
        side_effects:
          - "wristband_status → REVOKED; access_status → DENIED"
          - "room_charge_enabled → false; arcade_credit_limit_cents → 0"
          - "Resort.room_units_reserved recomputed for valid_on_service_date"
          - "Increments Wristband.version by 1"
        note: "Check-in revokes day-pass bands on the arrival date; a closure revokes guest bands on a pooled service date. Both are ISSUED→REVOKED and are discriminated by trigger, not by status."

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /wristbands/{wristband_id}/revoke"
        actor: "FrontDesk"
        preconditions:
          - "Wristband.wristband_status == ACTIVE"
          - "Either the band's valid_on_service_date has not yet begun, or the band has no ACCEPTED AdmissionEvent with direction=IN on valid_on_service_date"
        side_effects:
          - "wristband_status → REVOKED; access_status → DENIED"
          - "room_charge_enabled → false; arcade_credit_limit_cents → 0"
          - "Every ArcadeCreditGrant with wristband_id == Wristband.id and grant_status=SUCCEEDED → DECLINED with decline_reason='WRISTBAND_REVOKED'"
          - "Increments Wristband.version by 1"

      - from: ACTIVE
        to: ISSUED
        trigger: "POST /wristbands/{wristband_id}/reissue"
        actor: "FrontDesk"
        preconditions:
          - "Wristband.wristband_status == ACTIVE"
          - "Wristband.arcade_credit_spent_cents == 0"
          - "Issuing a successor band would not push Resort.room_units_reserved + Resort.group_reserved_units + Resort.day_pass_reserved_units above Resort.park_capacity_occupancy_units"
        side_effects:
          - "Old band: wristband_status → REISSUED, access_status → DENIED, room_charge_enabled → false, arcade_credit_limit_cents → 0"
          - "Old band: superseded_by_wristband_id set to the new band's id"
          - "Successor Wristband created with wristband_status=ISSUED, access_status=PENDING, arcade_credit_limit_cents equal to the old band's limit, arcade_credit_spent_cents=0"
          - "Recomputes Reservation.reserved_units (successor occupies the same service date)"
          - "Recomputes Resort.room_units_reserved for the successor's valid_on_service_date"
          - "Increments the old band's version by 1"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock advanced past valid_on_service_date via POST /_clock/set_current_utc)"
        actor: "system"
        preconditions:
          - "Wristband.wristband_status == ACTIVE"
          - "Wristband.valid_on_service_date + 1 day is strictly before the resort's current service date"
        side_effects:
          - "wristband_status → EXPIRED; access_status → DENIED"
          - "access_denied_reason → 'SERVICE_DATE_EXPIRED'"
          - "Increments Wristband.version by 1"

  - entity: DayPass
    field: day_pass_status
    initial_state: RESERVED
    terminal_states: [VOID, EXPIRED]
    transitions:
      - from: RESERVED
        to: ADMITTED
        trigger: "POST /admissions (an IN AdmissionEvent accepted for a wristband whose holder_type == DAY_PASS_GUEST)"
        actor: "GateAttendant"
        preconditions:
          - "DayPass.day_pass_status == RESERVED"
          - "Resort.day_pass_reserved_units for DayPass.service_date <= Resort.day_pass_cap_units"
          - "Resort.room_units_reserved + Resort.group_reserved_units + Resort.day_pass_reserved_units <= Resort.park_capacity_occupancy_units"
        side_effects:
          - "day_pass_status → ADMITTED"
          - "Resort.day_pass_reserved_units recomputed for DayPass.service_date"
          - "Resort.pool_posture recomputed from non-terminal WaterQualityLog rows"
          - "Increments DayPass.version by 1"

      - from: RESERVED
        to: VOID
        trigger: "POST /day-passes/{day_pass_id}/void"
        actor: "FrontDesk"
        preconditions:
          - "DayPass.day_pass_status == RESERVED"
          - "No Wristband with holder_type=DAY_PASS_GUEST and day_pass_id == DayPass.id carries wristband_status IN {ISSUED, ACTIVE}"
        side_effects:
          - "day_pass_status → VOID"
          - "Resort.day_pass_reserved_units recomputed for DayPass.service_date"
          - "Increments DayPass.version by 1"

      - from: RESERVED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc"
        actor: "system"
        preconditions:
          - "DayPass.day_pass_status == RESERVED"
        side_effects:
          - "day_pass_status → EXPIRED"
          - "Resort.day_pass_reserved_units recomputed for DayPass.service_date"
          - "Increments DayPass.version by 1"

  - entity: Cabana
    field: cabana_status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: HELD
        trigger: "POST /cabana-bookings (the created booking initially holds)"
        actor: "Group"
        preconditions:
          - "Cabana.cabana_status == AVAILABLE"
          - "No CabanaBooking with cabana_booking_status IN {HELD, BOOKED} occupies the same Cabana.id and service_date with an overlapping [start_minute, end_minute)"
        side_effects:
          - "cabana_status → HELD"
          - "Increments Cabana.version by 1"

      - from: HELD
        to: AVAILABLE
        trigger: "POST /cabana-bookings/{cabana_booking_id}/cancel"
        actor: "Group"
        preconditions:
          - "Cabana.cabana_status == HELD"
        side_effects:
          - "cabana_status → AVAILABLE"
          - "Increments Cabana.version by 1"

      - from: HELD
        to: AVAILABLE
        trigger: "POST /cabana-bookings/expire_holds"
        actor: "system"
        preconditions:
          - "Cabana.cabana_status == HELD"
          - "Every CabanaBooking on this Cabana.id with cabana_booking_status == HELD has hold_expires_at <= 2026-09-01T00:00:00Z"
        side_effects:
          - "cabana_status → AVAILABLE"
          - "Increments Cabana.version by 1"

      - from: [HELD, BOOKED]
        to: AVAILABLE
        trigger: "system (clock advanced past the hold expiry via POST /_clock/set_current_utc)"
        actor: "system"
        preconditions:
          - "Cabana.cabana_status IN {HELD, BOOKED}"
          - "The CabanaBooking occupying this Cabana.id has hold_expires_at <= 2026-09-01T00:00:00Z"
        side_effects:
          - "cabana_status → AVAILABLE"
          - "Increments Cabana.version by 1"

      - from: AVAILABLE
        to: BOOKED
        trigger: "POST /cabana-bookings/{cabana_booking_id}/confirm"
        actor: "Group"
        preconditions:
          - "Cabana.cabana_status == AVAILABLE"
          - "The CabanaBooking's GroupBooking.group_status == CONFIRMED"
        side_effects:
          - "cabana_status → BOOKED"
          - "Increments Cabana.version by 1"

      - from: BOOKED
        to: HELD
        trigger: "POST /cabana-bookings/{cabana_booking_id}/release"
        actor: "platform_ops"
        preconditions:
          - "Cabana.cabana_status == BOOKED"
          - "The CabanaBooking on this Cabana.id carries cabana_booking_status == BOOKED"
        side_effects:
          - "cabana_status → HELD"
          - "On the occupying CabanaBooking: cabana_booking_status → HELD and members → []"
          - "Zeroes the linked GroupBooking.group_reserved_units"
          - "If the released booking's GroupBooking.group_status == CONFIRMED and no other CabanaBooking with cabana_booking_status IN {HELD, BOOKED} references that GroupBooking.id: linked GroupMember rows with checked_in=true → checked_in=false"
          - "Increments Cabana.version by 1"

  - entity: CabanaBooking
    field: cabana_booking_status
    initial_state: HELD
    terminal_states: [CANCELLED, EXPIRED, COMPLETED]
    transitions:
      - from: HELD
        to: BOOKED
        trigger: "POST /cabana-bookings/{cabana_booking_id}/confirm"
        actor: "Group"
        preconditions:
          - "CabanaBooking.cabana_booking_status == HELD"
          - "Linked GroupBooking.group_status == CONFIRMED"
        side_effects:
          - "Members are admitted: linked GroupMember rows with checked_in=false → checked_in=true; CabanaBooking.members set to those member object ids"
          - "GroupBooking.group_reserved_units set to the sum of member_units over linked GroupMember rows with checked_in=true"
          - "CabanaBooking.hold_expires_at → null"
          - "Increments CabanaBooking.version by 1"

      - from: HELD
        to: EXPIRED
        trigger: "POST /cabana-bookings/expire_holds"
        actor: "system"
        preconditions:
          - "CabanaBooking.cabana_booking_status == HELD"
          - "CabanaBooking.hold_expires_at <= 2026-09-01T00:00:00Z"
        side_effects:
          - "cabana_booking_status → EXPIRED"
          - "Occupying Cabana.cabana_status → AVAILABLE"
          - "Increments CabanaBooking.version by 1"

      - from: [HELD, BOOKED]
        to: CANCELLED
        trigger: "POST /cabana-bookings/{cabana_booking_id}/cancel"
        actor: "Group"
        preconditions:
          - "CabanaBooking.cabana_booking_status IN {HELD, BOOKED}"
          - "CabanaBooking.members is empty"
        side_effects:
          - "cabana_booking_status → CANCELLED"
          - "Occupying Cabana.cabana_status → AVAILABLE"
          - "Increments CabanaBooking.version by 1"

      - from: BOOKED
        to: COMPLETED
        trigger: "system (POST /attractions/{attraction_id}/run_ops advancing past the booking's service date)"
        actor: "system"
        preconditions:
          - "CabanaBooking.cabana_booking_status == BOOKED"
        side_effects:
          - "cabana_booking_status → COMPLETED"
          - "Occupying Cabana.cabana_status → AVAILABLE"
          - "Increments CabanaBooking.version by 1"

  - entity: GroupBooking
    field: group_status
    initial_state: PENDING_DEPOSIT
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_DEPOSIT
        to: CONFIRMED
        trigger: "POST /group-bookings/{group_booking_id}/confirm"
        actor: "Group"
        preconditions:
          - "GroupBooking.group_status == PENDING_DEPOSIT"
          - "GroupBooking.deposit_paid_cents >= GroupBooking.member_count * GROUP_DEPOSIT_PER_MEMBER_CENTS"
        side_effects:
          - "group_status → CONFIRMED"
          - "Increments GroupBooking.version by 1"

      - from: [PENDING_DEPOSIT, CONFIRMED]
        to: CANCELLED
        trigger: "POST /group-bookings/{group_booking_id}/cancel"
        actor: "Group or platform_ops"
        preconditions:
          - "GroupBooking.group_status IN {PENDING_DEPOSIT, CONFIRMED}"
        side_effects:
          - "group_status → CANCELLED"
          - "Linked CabanaBooking rows with cabana_booking_status IN {HELD, BOOKED} → CANCELLED"
          - "Every occupied Cabana linked to a cancelled CabanaBooking → cabana_status=AVAILABLE"
          - "group_reserved_units → 0"
          - "Increments GroupBooking.version by 1"


  - entity: ActivityBooking
    field: activity_booking_status
    initial_state: PENDING_PAYMENT
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_PAYMENT
        to: CONFIRMED
        trigger: "POST /activity-bookings/{activity_booking_id}/confirm"
        actor: "Group"
        preconditions:
          - "ActivityBooking.activity_booking_status == PENDING_PAYMENT"
          - "Linked GroupBooking.group_status == CONFIRMED"
        side_effects:
          - "activity_booking_status → CONFIRMED"
          - "Increments ActivityBooking.version by 1"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /activity-bookings/{activity_booking_id}/cancel"
        actor: "Group or platform_ops"
        preconditions:
          - "ActivityBooking.activity_booking_status == CONFIRMED"
        side_effects:
          - "activity_booking_status → CANCELLED"
          - "activity_rate_refund_cents set to the activity_refund_variant calculation output"
          - "Increments ActivityBooking.version by 1"

      - from: [PENDING_PAYMENT, CONFIRMED]
        to: CANCELLED
        trigger: "system (linked GroupBooking cancelled)"
        actor: "system"
        preconditions: []
        side_effects:
          - "activity_booking_status → CANCELLED"
          - "Increments ActivityBooking.version by 1"


  - entity: LifeguardShift
    field: shift_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: ON_DUTY
        trigger: "POST /lifeguard-shifts/{shift_id}/start"
        actor: "AquaticsManager"
        preconditions:
          - "LifeguardShift.shift_status == SCHEDULED"
          - "LifeguardShift.certification_code == Attraction.required_certification"
          - "No LifeguardShift for the same staffer_name and shift_date carries shift_status IN {ON_DUTY, ROTATED} with an overlapping [start_minute, end_minute); violation raises ERR_SHIFT_ROTATION_VIOLATION"
          - "end_minute - start_minute <= rotation_minutes + LIFEGUARD_MAX_CONSECUTIVE_MINUTES; violation raises ERR_SHIFT_ROTATION_VIOLATION"
          - "Every LifeguardShift for the same staffer_name and shift_date with shift_status == COMPLETED is separated from this shift's [start_minute, end_minute) window by at least LIFEGUARD_ROTATION_BUFFER_MINUTES minutes; violation raises ERR_SHIFT_ROTATION_VIOLATION"
        side_effects:
          - "shift_status → ON_DUTY"
          - "Linked Attraction.attraction_status recomputed (lifeguard_attraction_status)"
          - "Increments LifeguardShift.version by 1"

      - from: ON_DUTY
        to: ROTATED
        trigger: "POST /lifeguard-shifts/{shift_id}/rotate"
        actor: "AquaticsManager"
        preconditions:
          - "LifeguardShift.shift_status == ON_DUTY"
          - "No LifeguardShift for the same staffer_name and shift_date carries shift_status == ROTATED with an overlapping [start_minute, end_minute)"
          - "No LifeguardShift for the same staffer_name and shift_date carries shift_status == ON_DUTY with start_minute < LifeguardShift.end_minute"
        side_effects:
          - "shift_status → ROTATED"
          - "Linked Attraction.attraction_status unchanged (ROTATED counts as covered)"
          - "Increments LifeguardShift.version by 1"

      - from: ROTATED
        to: ON_DUTY
        trigger: "POST /lifeguard-shifts/{shift_id}/resume"
        actor: "AquaticsManager"
        preconditions:
          - "LifeguardShift.shift_status == ROTATED"
          - "No LifeguardShift for the same staffer_name and shift_date carries shift_status == ON_DUTY with an overlapping [start_minute, end_minute)"
          - "Every WaterQualityLog with attraction_id == the linked Attraction.id and sampled_at within [start_minute, end_minute) of the shift's shift_date has log_status == PASS"
        side_effects:
          - "shift_status → ON_DUTY"
          - "Linked Attraction.attraction_status recomputed"
          - "Increments LifeguardShift.version by 1"

      - from: [ON_DUTY, ROTATED]
        to: COMPLETED
        trigger: "POST /lifeguard-shifts/{shift_id}/complete"
        actor: "AquaticsManager"
        preconditions:
          - "LifeguardShift.shift_status IN {ON_DUTY, ROTATED}"
        side_effects:
          - "shift_status → COMPLETED"
          - "Linked Attraction.attraction_status recomputed (lifeguard_attraction_status): LIMITED when a rostered staffer remains under LIFEGUARD_DAILY_SHIFT_CAP, CLOSED when every rostered staffer has reached it"
          - "Increments LifeguardShift.version by 1"

concurrency_rules:

  - rule_id: day-pass-create-stale-resort
    parent_entity: Resort
    write_endpoint: "POST /day-passes"
    occ_field: "expected_resort_version"
    description: |
      Creating a DayPass against a Resort whose version has advanced since the
      client last observed it is rejected, because the client's view of the
      Resort's park capacity and day-pass ceiling is stale.
    error_id: ERR_STALE_RESORT_VERSION
    http_status: 412

  - rule_id: cabana-booking-create-stale-cabana
    parent_entity: Cabana
    write_endpoint: "POST /cabana-bookings"
    occ_field: "expected_cabana_version"
    description: |
      Creating a CabanaBooking against a Cabana whose version has advanced since
      the client last observed it is rejected, because the client's view of
      whether the cabana is AVAILABLE is stale.
    error_id: ERR_STALE_CABANA_VERSION
    http_status: 412

calculations:

  - name: package_rate
    trigger: "Reservation create and guest_count or room_type_id edit"
    algorithm: tiered_pricing
    formula: |
      underwritten_total = included_arcade_cents + room_subtotal_cents + package_surcharge_cents
      room_subtotal_cents = nights * RoomType.base_rate_cents
      included_arcade_cents = RoomType.base_rate_cents * 2 * nights
      at_par_or_below = waterpark_included_units <= RoomType.max_occupancy - 2
      package_surcharge_cents = 0 if at_par_or_below else floor(waterpark_included_units / 4) * ROOM_FEE_ACTUATION_CENTS
      debit_authorization_cents = underwritten_total + package_surcharge_cents
      package_rate_total_cents = debit_authorization_cents
      Evaluation order is pinned: waterpark_included_units is read from the
      requested guest_count before any surcharge term is evaluated, and
      package_surcharge_cents is not fed back into the at_par_or_below predicate.
    input_set: "Reservations with booking_status IN {RESERVED, CHECKED_OUT}"
    constants:
      ROOM_FEE_ACTUATION_CENTS: 1400
    precision: "whole cents, round_half_up"
    variants:
      - name: withheld_authorization
        when: "Package priced with the room fee withheld from the authorization hold"
        difference: |
          withdraw_authorization_cents = underwritten_total
          package_rate_withheld_cents = withdraw_authorization_cents
          Differs from package_rate_total_cents by package_surcharge_cents; the
          two are equal only when waterpark_included_units <= RoomType.max_occupancy - 2.

  - name: package_rate_authorization
    trigger: "Reservation create and guest_count or room_type_id edit"
    algorithm: forward_looking
    formula: |
      withdraw_authorization_cents = included_arcade_cents + room_subtotal_cents
      room_subtotal_cents = nights * RoomType.base_rate_cents
      included_arcade_cents = RoomType.base_rate_cents * 2 * nights
      package_rate_withheld_cents = withdraw_authorization_cents
      Debiting runs after the room fee is posted; the same Reservation therefore
      carries package_rate_withheld_cents during the stay and package_rate_total_cents
      at check-out, and the two differ by package_surcharge_cents.
    input_set: "Reservations with booking_status == RESERVED"
    constants:
      ROOM_FEE_ACTUATION_CENTS: 1400
    precision: "whole cents, round_half_up"
    variants:
      - name: collected_at_checkout
        when: "Debiting runs after the room fee is posted at check-out"
        difference: "Equals package_rate_total_cents for the same Reservation"

  - name: day_pass_price
    trigger: "DayPass create and units_requested edit"
    algorithm: aggregation
    formula: |
      day_pass_price_total_cents = units_requested * DAY_PASS_BASE_CENTS
        + floor(max(units_requested - DAY_PASS_VOLUME_THRESHOLD_UNITS, 0) / DAY_PASS_VOLUME_BLOCK_UNITS) * DAY_PASS_VOLUME_BLOCK_CENTS
      The floor yields a discontinuous staircase: each complete 10-unit block above
      the 10-unit base allowance adds exactly 1000 cents, and a partial block adds
      nothing. The scaffold pins per-unit-plus-block-surcharge: at 12 units the total
      is 12 * 4200 + floor(2 / 10) * 1000 = 50400 cents. Reading the block as a
      replacement rate, 10 * 4200 + 2 * 1000, yields 44000 cents instead.
    input_set: "DayPass rows with day_pass_status IN {RESERVED, ADMITTED}"
    constants:
      DAY_PASS_BASE_CENTS: 4200
      DAY_PASS_VOLUME_THRESHOLD_UNITS: 10
      DAY_PASS_VOLUME_BLOCK_UNITS: 10
      DAY_PASS_VOLUME_BLOCK_CENTS: 1000
    precision: "whole cents, round_half_up"

  - name: activity_rate
    trigger: "ActivityBooking create and attendees edit"
    algorithm: tiered_pricing
    formula: |
      tier_units = attendees * ACTIVITY_TIER_UNIT_MULTIPLIER[ActivitySession.tier_code]
      subtotal_cents = ActivitySession.base_price_cents * tier_units
      bulk_discount_cents = 0 if attendees < 10 else floor(attendees / 5) * ACTIVITY_BULK_DISCOUNT_CENTS
      activity_rate_total_cents = subtotal_cents - bulk_discount_cents
      ACTIVITY_TIER_UNIT_MULTIPLIER = { STANDARD: 1, PREMIUM: 2, VIP: 3 }
      Flooring the bulk discount before subtracting pins the per-booking total,
      while summing floored per-attendee discounts across the same bookings
      yields a larger total.
    input_set: "ActivityBooking rows with activity_booking_status IN {PENDING_PAYMENT, CONFIRMED}"
    constants:
      ACTIVITY_BULK_DISCOUNT_CENTS: 500
    precision: "whole cents, round_half_up"

  - name: activity_refund_variant
    trigger: "ActivityBooking cancel"
    algorithm: aggregation
    formula: |
      refundable_attendees = number of attendees with joined_at < the linked GroupBooking.service_date
      gross_cents = refundable_attendees * ActivitySession.base_price_cents * ACTIVITY_REFUND_RATE
      activity_rate_refund_cents = round_half_up(gross_cents)
      ACTIVITY_REFUND_RATE = 0.375 produces a half-cent for any odd base_price_cents:
      at base_price_cents = 3900 one attendee rounds to 1463 cents and two attendees
      round as a pair to 2925 cents. Rounding each attendee first and summing yields
      2926 cents, one cent more. The scaffold pins sum-then-round.
    input_set: "ActivityBooking rows with activity_booking_status == CANCELLED"
    constants:
      ACTIVITY_REFUND_RATE: 0.375
    precision: "whole cents, round_half_up"
    variants:
      - name: per_attendee_rounding
        when: "Each attendee's refund is rounded before the attendees are summed"
        difference: "Yields 2926 cents for two attendees at base_price_cents = 3900, one cent above the base variant's 2925 cents"

  - name: arcade_credit_accrual
    trigger: "Reservation check-in"
    algorithm: aggregation
    formula: |
      credited_arcade_cents = Resort.arcade_credit_rate_cents_per_unit * Reservation.waterpark_included_units
    input_set: "Reservations with stay_status == IN_HOUSE"
    precision: "whole cents, round_half_up"

  - name: room_units_reserved
    trigger: "Reservation create, check-in, cancel, check-out; Wristband activate, revoke, re-issue"
    algorithm: aggregation
    formula: |
      For a service date d:
        room_units_reserved(d) = sum over Reservations of Reservation.reserved_units
          where the Reservation is non-terminal AND d >= Reservation.arrival_date AND d < Reservation.departure_date
      Reservation.reserved_units equals waterpark_included_units on every service date in
      [arrival_date, departure_date), inclusive of arrival_date and exclusive of departure_date.
      A RESERVED booking consumes those units from the moment it is booked, so arrival-day
      access is reserved before check-in as well as after it.
      A booking with booking_status == CANCELLED consumes 0 units on every date.
      A CHECKED_OUT booking consumes 0 units on departure_date.
      Sort key when the sum is materialised: Reservation.created_at ASC;
      tie-break: Reservation.id is NOT used.
    input_set: "Reservations with booking_status IN {RESERVED, CHECKED_OUT}"

  - name: day_pass_reserved_units
    trigger: "DayPass create, admit, void, expire"
    algorithm: aggregation
    formula: |
      day_pass_reserved_units(d) = sum of DayPass.units_requested
        for DayPass rows with service_date == d and day_pass_status IN {RESERVED, ADMITTED}
      DayPass rows with day_pass_status IN {VOID, EXPIRED} are excluded from the sum.
    input_set: "DayPass rows with day_pass_status IN {RESERVED, ADMITTED}"

  - name: group_reserved_units
    trigger: "GroupBooking create, confirm, cancel, complete; GroupMember check-in"
    algorithm: aggregation
    formula: |
      group_reserved_units = sum of GroupMember.member_units
        for GroupMember rows with group_booking_id == GroupBooking.id and checked_in == true
      A GroupBooking whose group_status has left CONFIRMED contributes 0 units, whatever its
      members' checked_in flags still say.
      A GroupBooking with no checked-in members contributes 0 units.
    input_set: "GroupMember rows with checked_in == true"
    constants:
      GROUP_DEPOSIT_PER_MEMBER_CENTS: 500
      BIRTHDAY_PARTY_MINIMUM_MEMBERS: 1

  - name: pool_posture
    trigger: "POST /water-quality-logs; Reservation check-out; Wristband activate; DayPass admit"
    algorithm: constraint_propagation
    formula: |
      pool_posture = CLOSED if there exists at least one WaterQualityLog with
        resort_id == Resort.id, log_status == FAIL and superseded_at IS NULL
      pool_posture = OPEN if every WaterQualityLog with resort_id == Resort.id
        and log_status == FAIL has superseded_at non-null

  - name: opt_in_ratio
    trigger: "POST /activities (session create) and ActivityBooking create"
    algorithm: threshold
    formula: |
      denominator_units = room_units_reserved + day_pass_reserved_units + group_reserved_units over exactly the current_utc service date
      opt_in_ratio = ActivitySession.capacity_units / denominator_units
      opt_in_ratio_strict = ActivitySession.capacity_units / denominator_units
        when denominator_units > 0; when denominator_units == 0 the value is null
      opt_in_ratio_inclusive = ActivitySession.capacity_units / (denominator_units + ActivitySession.capacity_units)
      Denominator window is the closed-open interval [current_utc service date, current_utc service date + 1 minute),
      resolved at the instant the call executes. Both values are stamped on the ActivitySession at that
      instant and are not recomputed by later reads.
    precision: "4 decimal places, round_half_up"
    input_set: "Reservations with booking_status IN {RESERVED, CHECKED_OUT}; DayPass rows with day_pass_status IN {RESERVED, ADMITTED}; GroupMember rows with checked_in == true"

  - name: lifeguard_attraction_status
    trigger: "LifeguardShift start, rotate, resume, complete"
    algorithm: constraint_propagation
    formula: |
      A staffer is on the rotation roster when Resort.managers holds an entry equal to
      "<ActorRole>:<staffer_name>" for the (name, shift_date) in question.
      staffer_count(attraction) = count of LifeguardShift rows with attraction_id == Attraction.id,
        shift_status IN {ON_DUTY, ROTATED}, and a rotation-roster entry for its staffer_name
      completed_today(name, d) = count of LifeguardShift rows with staffer_name == name,
        shift_date == d and shift_status == COMPLETED
      exhausted(name, d) = completed_today(name, d) >= LIFEGUARD_DAILY_SHIFT_CAP
      effective_min = 1 when Attraction.min_occupancy_units == 0 else Attraction.min_occupancy_units
      attraction_status = OPEN when staffer_count >= effective_min
      attraction_status = LIMITED when 1 <= staffer_count < effective_min
      attraction_status = LIMITED when staffer_count == 0 and at least one rostered staffer posts
        exhausted(name, d) == false
      attraction_status = CLOSED when staffer_count == 0 and every rostered staffer posts
        exhausted(name, d) == true
      When a FAIL WaterQualityLog stands for this attraction's service date, staffer_count is read
      as 0, so the attraction lands CLOSED even though its posted staffer count is unchanged.
      Note: an attraction whose min_occupancy_units exceeds 1 can never leave LIMITED while staffed,
      because one staffer is the most a single attraction may post at a time.
    constants:
      LIFEGUARD_MAX_CONSECUTIVE_MINUTES: 120
      LIFEGUARD_DAILY_SHIFT_CAP: 3
      LIFEGUARD_ROTATION_BUFFER_MINUTES: 30

  - name: activity_session_eligibility
    trigger: "POST /activity-bookings"
    algorithm: threshold
    formula: |
      Seats fit when ActivityBooking.attendees <= ActivitySession.capacity_units - seats_taken,
      where seats_taken = sum of ActivityBooking.attendees over bookings with
      activity_booking_status IN {PENDING_PAYMENT, CONFIRMED} on the same session.
      At exact equality the booking is accepted; one attendee more is rejected. The session is
      named by activity_session_id in the request, so no candidate ranking applies.

  - name: cabana_day_units
    trigger: "CabanaBooking confirm and cancel"
    algorithm: aggregation
    formula: |
      cabana_day_units(d) = sum of CabanaBooking.member_units for CabanaBooking rows
        with service_date == d and cabana_booking_status IN {HELD, BOOKED}
      A cabana whose advance holds have all lapsed therefore surrenders its units
      while the same cabana's walk-up hold still counts.
    input_set: "CabanaBooking rows with cabana_booking_status IN {HELD, BOOKED}"

  - name: resort_park_occupancy
    trigger: "Any unit-consuming mutation; read via GET /resorts/{resort_id}/capacity"
    algorithm: threshold
    formula: |
      occupancy_units(d) = room_units_reserved(d) + day_pass_reserved_units(d) + group_reserved_units(d) + cabana_day_units(d)
      capacity_remaining_units(d) = park_capacity_occupancy_units - occupancy_units(d)
      capacity_remaining_units is never negative: an admission that would push
      occupancy_units(d) above park_capacity_occupancy_units is rejected with
      ERR_PARK_CAPACITY_EXCEEDED.
      At exact equality the admission is accepted; one unit more is rejected.

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and the role is recognised; request bodies carrying fields not declared in the endpoint's input are refused with ERR_INVALID_REQUEST"
    error_id: ERR_UNAUTHENTICATED, ERR_INVALID_REQUEST
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation; entity-backed roles must own the resource they mutate"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Referenced resources exist, validated left-to-right along the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a path id or an FK input"

  - priority: 4
    category: business_temporal
    check: "service_date is not more than 365 days after the resort's current service date"
    error_id: ERR_SERVICE_DATE_OUT_OF_RANGE
    http_status: 409
    applies_to: "POST /day-passes, POST /group-bookings"

  - priority: 5
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 6
    category: state
    check: "Resort.pool_posture is OPEN"
    error_id: ERR_POOL_CLOSED
    http_status: 409
    applies_to: "POST /admissions, POST /wristbands/{wristband_id}/activate"

  - priority: 7
    category: business_safety
    check: "Attraction is OPEN and posts at least Attraction.min_occupancy_units staffers"
    error_id: ERR_ATTRACTION_NOT_OPEN
    http_status: 409
    applies_to: "POST /admissions, POST /activities"

  - priority: 8
    category: business_safety
    check: "Submitted reading is physically plausible: pH in [0, 14], free chlorine in [0, 10] ppm, turbidity in [0, 50] NTU. Values inside this window are accepted and then classified PASS or FAIL against the safe window [7.2, 7.8] pH, [1.0, 3.0] ppm, <= 1.0 NTU, which drives the closure protocol rather than an error"
    error_id: ERR_WATER_QUALITY_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /water-quality-logs"

  - priority: 9
    category: business_constraint
    check: "No CabanaBooking with cabana_booking_status IN {HELD, BOOKED} occupies the same Cabana.id and service_date with an overlapping [start_minute, end_minute), and member_units fits Cabana.capacity_units"
    error_id: ERR_CABANA_DOUBLE_BOOKED, ERR_CABANA_UNITS_UNAVAILABLE
    http_status: 409
    applies_to: "POST /cabana-bookings"

  - priority: 10
    category: business_constraint
    check: "Requested day-pass units fit within the resort's day-pass ceiling for the service date"
    error_id: ERR_DAY_PASS_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /day-passes, POST /admissions"

  - priority: 11
    category: business_constraint
    check: "Total occupancy units for the service date fit within the resort's park capacity"
    error_id: ERR_PARK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /admissions, POST /wristbands/{wristband_id}/activate"

  - priority: 12
    category: business_constraint
    check: "Wristband arcade posts fit under arcade_credit_limit_cents"
    error_id: ERR_ARCADE_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /wristbands/{wristband_id}/arcade-grants"

  - priority: 13
    category: business_constraint
    check: "A BIRTHDAY group booking declares member_count of at least BIRTHDAY_PARTY_MINIMUM_MEMBERS"
    error_id: ERR_GROUP_MINIMUM_NOT_MET
    http_status: 409
    applies_to: "POST /group-bookings"

  - priority: 14
    category: business_fiscal
    check: "Deposit amount plus the already-paid total meets or exceeds member_count * GROUP_DEPOSIT_PER_MEMBER_CENTS, and the external payment reference is accepted"
    error_id: ERR_PAYMENT_DECLINED
    http_status: 409
    applies_to: "POST /group-bookings/{group_booking_id}/deposits"

endpoints:

  # --- Resort ---
  - method: POST
    path: "/resorts"
    description: "Create a resort property"
    roles: [platform_ops]
    code: 201
    input: [name, park_capacity_occupancy_units, day_pass_cap_units, arcade_credit_rate_cents_per_unit]
    output: Resort
    side_effects:
      - "pool_posture=OPEN, ops_run_index=0, manager_override_used=false, managers=[]"

  - method: GET
    path: "/resorts/{resort_id}"
    description: "Get resort details"
    roles: [platform_ops, FrontDesk, AquaticsManager, GateAttendant, Group, Anonymous]
    code: 200
    input: []
    output: Resort
    side_effects: []

  - method: PUT
    path: "/resorts/{resort_id}"
    description: "Edit resort capacity ceilings; requires an expected version"
    roles: [platform_ops]
    code: 200
    input: [expected_resort_version, "park_capacity_occupancy_units?", "day_pass_cap_units?", "arcade_credit_rate_cents_per_unit?"]
    output: Resort
    side_effects:
      - "Recomputes Resort.day_pass_reserved_units for every open service date"
      - "Increments Resort.version by 1"

  - method: POST
    path: "/resorts/{resort_id}/managers"
    description: "Add a staffing-roster entry for the rotation roster"
    roles: [platform_ops]
    code: 201
    input: [async_role, async_name]
    output: Resort
    side_effects:
      - "Appends \"<async_role>:<async_name>\" to Resort.managers"
      - "Increments Resort.version by 1"

  - method: GET
    path: "/resorts/{resort_id}/capacity"
    description: "Capacity ledger for one service date"
    roles: [platform_ops, FrontDesk, AquaticsManager, GateAttendant, Group]
    code: 200
    input: [service_date]
    output: { service_date: string, room_units_reserved: integer, day_pass_reserved_units: integer, group_reserved_units: integer, cabana_day_units: integer, occupancy_units: integer, park_capacity_occupancy_units: integer, day_pass_cap_units: integer, capacity_remaining_units: integer }
    side_effects:
      - "Read-only; recomputes resort_park_occupancy for the requested service date"

  - method: GET
    path: "/resorts/{resort_id}/attendance-capacity"
    description: "Occupancy-unit ledger for one service date; alias of the capacity ledger used by the attendance console"
    roles: [platform_ops, FrontDesk, AquaticsManager, GateAttendant]
    code: 200
    input: [service_date]
    output: { service_date: string, occupancy_units: integer, capacity_remaining_units: integer }
    side_effects:
      - "Read-only; recomputes resort_park_occupancy for the requested service date"

  # --- Room types ---
  - method: POST
    path: "/resorts/{resort_id}/room-types"
    description: "Create a room type"
    roles: [platform_ops]
    code: 201
    input: [code, max_occupancy, base_rate_cents, "is_cabana?"]
    output: RoomType
    side_effects: []

  - method: GET
    path: "/resorts/{resort_id}/room-types"
    description: "List room types"
    roles: [platform_ops, FrontDesk, Group, Anonymous]
    code: 200
    input: ["resort_id?", "limit?", "offset?"]
    output: RoomType[]
    side_effects: []

  - method: GET
    path: "/resorts/{resort_id}/room-types/{room_type_id}"
    description: "Get room type details"
    roles: [platform_ops, FrontDesk, Group, Anonymous]
    code: 200
    input: []
    output: RoomType
    side_effects: []

  # --- Reservations ---
  - method: POST
    path: "/resorts/{resort_id}/reservations"
    description: "Book a room package"
    roles: [Group, FrontDesk]
    code: 201
    input: [room_type_id, guest_count, arrival_date, departure_date]
    output: Reservation
    side_effects:
      - "booking_status=RESERVED, stay_status=NOT_STARTED"
      - "waterpark_included_units = guest_count; reserved_units = waterpark_included_units"
      - "package_rate_total_cents and package_rate_withheld_cents recomputed (package_rate, package_rate_authorization)"
      - "room_units_reserved recomputed for every service date in [arrival_date, departure_date)"

  - method: GET
    path: "/resorts/{resort_id}/reservations"
    description: "List reservations, optionally filtered by room type"
    roles: [platform_ops, FrontDesk, Group]
    code: 200
    input: ["room_type_id?", "resort_id?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/resorts/{resort_id}/reservations/{reservation_id}"
    description: "Get reservation details"
    roles: [platform_ops, FrontDesk, Group, Anonymous]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: PUT
    path: "/resorts/{resort_id}/reservations/{reservation_id}"
    description: "Edit a RESERVED booking's dates, room type, or guest count"
    roles: [FrontDesk]
    code: 200
    input: ["room_type_id?", "guest_count?", "arrival_date?", "departure_date?"]
    output: Reservation
    side_effects:
      - "Recomputes package_rate_total_cents and package_rate_withheld_cents"
      - "Recomputes room_units_reserved for the old and new service-date spans"
      - "Increments Reservation.version by 1"

  - method: POST
    path: "/resorts/{resort_id}/reservations/{reservation_id}/check_in"
    description: "Check in a booking; opens arrival-day waterpark access"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "stay_status → IN_HOUSE; checked_in_at stamped"
      - "credited_arcade_cents recomputed (arcade_credit_accrual)"
      - "Every guest wristband gains room_charge_enabled=true and arcade_credit_limit_cents = Resort.arcade_credit_rate_cents_per_unit * Reservation.waterpark_included_units"
      - "Day-pass wristbands on arrival_date → REVOKED; group-member room charge privileges on arrival_date → disabled"
      - "room_units_reserved recomputed for arrival_date and departure_date"
      - "Increments Reservation.version by 1"

  - method: POST
    path: "/resorts/{resort_id}/reservations/{reservation_id}/check_out"
    description: "Check out a booking; departure-day access is retained. A booking whose outstanding arcade spend is still posted is refused with ERR_ACCOUNT_LIEN_OUTSTANDING"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "booking_status → CHECKED_OUT; stay_status → DEPARTED; checked_out_at stamped"
      - "linked guest wristbands → EXPIRED with access_denied_reason='CHECKED_OUT'"
      - "room_charge_enabled → false on every linked guest wristband"
      - "Every SUCCEEDED arcade credit grant on those bands → DECLINED with decline_reason='RESERVATION_CLOSED'"
      - "room_units_reserved recomputed for departure_date"
      - "Increments Reservation.version by 1"

  - method: POST
    path: "/resorts/{resort_id}/reservations/{reservation_id}/cancel"
    description: "Cancel a RESERVED booking"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "booking_status → CANCELLED; stay_status → DEPARTED"
      - "room_units_reserved recomputed for every service date in the booking's span"
      - "Increments Reservation.version by 1"

  - method: POST
    path: "/resorts/{resort_id}/reservations/{reservation_id}/arcade-credits"
    description: "Post an arcade credit grant against a wristband's room-charge line"
    roles: [FrontDesk, Anonymous]
    code: 201
    input: [wristband_id, amount_cents]
    output: ArcadeCreditGrant
    side_effects:
      - "grant_status=SUCCEEDED when room_charge_enabled=true and the amount fits arcade_credit_remaining_cents"
      - "Rejects with ERR_ROOM_CHARGE_DISABLED when room_charge_enabled=false"
      - "Rejects with ERR_ARCADE_LIMIT_EXCEEDED when the amount exceeds arcade_credit_remaining_cents"
      - "Recomputes Wristband.arcade_credit_spent_cents and arcade_credit_remaining_cents"

  - method: GET
    path: "/resorts/{resort_id}/reservations/{reservation_id}/wristbands"
    description: "List wristbands issued against a reservation"
    roles: [platform_ops, FrontDesk, AquaticsManager]
    code: 200
    input: []
    output: Wristband[]
    side_effects: []

  - method: GET
    path: "/resorts/{resort_id}/reservations/{reservation_id}/activity-bookings"
    description: "List activity bookings settled against a reservation folio"
    roles: [platform_ops, FrontDesk, Group]
    code: 200
    input: []
    output: ActivityBooking[]
    side_effects: []

  # --- Day passes ---
  - method: POST
    path: "/resorts/{resort_id}/day-passes"
    description: "Sell day passes for a service date; requires an expected resort version"
    roles: [platform_ops, FrontDesk]
    code: 201
    input: [service_date, units_requested, expected_resort_version]
    output: DayPass
    side_effects:
      - "day_pass_status=RESERVED"
      - "price_total_cents recomputed (day_pass_price)"
      - "day_pass_reserved_units recomputed for service_date"
      - "Increments Resort.version by 1"

  - method: GET
    path: "/resorts/{resort_id}/day-passes"
    description: "List day passes"
    roles: [platform_ops, FrontDesk]
    code: 200
    input: ["resort_id?", "limit?", "offset?"]
    output: DayPass[]
    side_effects: []

  - method: GET
    path: "/resorts/{resort_id}/day-passes/{day_pass_id}"
    description: "Get day pass details, including its issued wristband"
    roles: [platform_ops, FrontDesk, Anonymous]
    code: 200
    input: []
    output: DayPass
    side_effects: []

  - method: POST
    path: "/resorts/{resort_id}/day-passes/{day_pass_id}/void"
    description: "Void a RESERVED day pass"
    roles: [FrontDesk]
    code: 200
    input: []
    output: DayPass
    side_effects:
      - "day_pass_status → VOID"
      - "day_pass_reserved_units recomputed for service_date"
      - "Increments DayPass.version by 1"

  - method: GET
    path: "/resorts/{resort_id}/day-passes/{day_pass_id}/wristbands"
    description: "List wristbands issued against a day pass"
    roles: [platform_ops, FrontDesk, Anonymous]
    code: 200
    input: []
    output: Wristband[]
    side_effects: []

  # --- Wristbands ---
  - method: POST
    path: "/resorts/{resort_id}/wristbands"
    description: "Issue a wristband for a booking, day pass, or group member"
    roles: [platform_ops, FrontDesk]
    code: 201
    input: [holder_type, owner_name, "reservation_id?", "day_pass_id?", "group_member_id?", "valid_on_service_date?"]
    output: Wristband
    side_effects:
      - "wristband_status=ISSUED, access_status=PENDING"
      - "room_charge_enabled=false and arcade_credit_limit_cents=0 when holder_type != RESERVATION_GUEST, or when the linked Reservation.stay_status != IN_HOUSE"
      - "room_charge_enabled=true and arcade_credit_limit_cents = Resort.arcade_credit_rate_cents_per_unit * linked Reservation.waterpark_included_units when holder_type=RESERVATION_GUEST and the linked Reservation.stay_status == IN_HOUSE"
      - "valid_on_service_date defaults to the holder's arrival_date or service_date"

  - method: GET
    path: "/resorts/{resort_id}/wristbands"
    description: "List wristbands, optionally filtered by holder type"
    roles: [platform_ops, FrontDesk, AquaticsManager, Anonymous]
    code: 200
    input: ["holder_type?", "reservation_id?", "day_pass_id?", "superseded_by_wristband_id?", "resort_id?", "limit?", "offset?"]
    output: Wristband[]
    side_effects: []

  - method: GET
    path: "/resorts/{resort_id}/wristbands/{wristband_id}"
    description: "Get wristband details, including its static access code"
    roles: [platform_ops, FrontDesk, AquaticsManager, GateAttendant, Anonymous]
    code: 200
    input: []
    output: Wristband
    side_effects: []

  - method: POST
    path: "/resorts/{resort_id}/wristbands/{wristband_id}/activate"
    description: "Activate an issued wristband and reserve its occupancy units; a band that is not ISSUED is refused with ERR_WRISTBAND_NOT_ACTIVE"
    roles: [FrontDesk, GateAttendant]
    code: 200
    input: []
    output: Wristband
    side_effects:
      - "wristband_status → ACTIVE; access_status → GRANTED"
      - "room_units_reserved recomputed for valid_on_service_date"
      - "Increments Wristband.version by 1"

  - method: POST
    path: "/resorts/{resort_id}/wristbands/{wristband_id}/revoke"
    description: "Revoke an active wristband and unwind its outstanding credits"
    roles: [FrontDesk, AquaticsManager]
    code: 200
    input: []
    output: Wristband
    side_effects:
      - "wristband_status → REVOKED; access_status → DENIED"
      - "room_charge_enabled → false, arcade_credit_limit_cents → 0"
      - "Every SUCCEEDED ArcadeCreditGrant on this wristband → DECLINED with decline_reason='WRISTBAND_REVOKED'"
      - "Downgrades the linked Attraction.attraction_status to CLOSED when removing this band drops the linked attraction's occupant count below min_occupancy_units"
      - "Increments Wristband.version by 1"

  - method: POST
    path: "/resorts/{resort_id}/wristbands/{wristband_id}/reissue"
    description: "Re-issue a wristband and mark the presented band REISSUED; the response is the presented (old) band, whose superseded_by_wristband_id names the successor. A band not in ACTIVE is refused with ERR_WRISTBAND_NOT_ACTIVE"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Wristband
    side_effects:
      - "Old band: wristband_status → REISSUED, access_status → DENIED, room_charge_enabled → false, arcade_credit_limit_cents → 0"
      - "A band carrying a non-null superseded_by_wristband_id is refused with ERR_WRISTBAND_ALREADY_REISSUED"
      - "A band whose arcade_credit_spent_cents is greater than 0 is refused with ERR_HELD_UNITS_NOT_RELEASABLE"
      - "Old band: superseded_by_wristband_id set to the new band's id"
      - "Successor wristband created in ISSUED carrying the old band's arcade_credit_limit_cents unchanged, with arcade_credit_spent_cents = 0"
      - "Increments the old band's version by 1"

  - method: POST
    path: "/resorts/{resort_id}/wristbands/{wristband_id}/arcade-grants"
