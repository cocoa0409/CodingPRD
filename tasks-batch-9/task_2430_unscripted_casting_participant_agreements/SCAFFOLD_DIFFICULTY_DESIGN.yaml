      - name: execute_rollup_restricts_posture_closes_open_calls_depth4
        grounds:
          - state_machines.ParticipantAgreement.SENT_to_EXECUTED
          - calculations.production_stipend_rollup
          - calculations.casting_posture_derivation
          - state_machines.CastingCall.PUBLISHED_to_CLOSED
          - entities.CastingCall.fields.closed_reason
          - calculations.post_obligation_fee_allocation
        distinguishing_aspect: |
          Depth-4 chain triggered by the agreement execute transition: (1) FINAL stipend
          9,000,000 is written on the agreement, which (2) forces
          production_stipend_rollup to 9,000,000, which (3) makes
          casting_posture_derivation return RESTRICTED at exactly 90% utilisation, which
