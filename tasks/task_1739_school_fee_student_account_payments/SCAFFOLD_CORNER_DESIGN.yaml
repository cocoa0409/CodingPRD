              payload: { name: "F1", amount_cents: 10001, department_id: "${d_id}", waiverable: true, refundable: true }
              as: Bookkeeper
              captures: { f_id: $.data.id }
            - call: "POST /students"
              payload: { external_ref: "S-1", full_name: "Ada", grade_level: 10, family_id: "fam-a" }
              as: Bookkeeper
              captures: { s_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s_id}" }
              as: Bookkeeper
              captures: { a_id: $.data.id }
            - call: "POST /student-accounts/${a_id}/fee-assessments"
              payload: { fee_item_id: "${f_id}", assessed_amount_cents: 10001 }
              as: Bookkeeper
            - call: "GET /student-accounts/${a_id}"
              as: Bookkeeper
              captures: { a_v: $.data.version }
          trigger:
            - call: "POST /student-accounts/${a_id}/payment-plans"
              payload: { installment_count: 3, first_due_date: "2026-09-05", interval_days: 30, expected_account_version: "${a_v}" }
              as: Bookkeeper
              captures: { plan_id: $.data.id, covered: $.data.covered_amount_cents }
            - call: "GET /student-accounts/${a_id}/payment-plans/${plan_id}/installments"
