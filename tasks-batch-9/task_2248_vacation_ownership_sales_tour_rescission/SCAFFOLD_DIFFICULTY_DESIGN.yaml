              as: GalleryManager
              captures: { r1: $.data.id }
            - call: "POST /tour-channels"
              payload: { name: "Strict Qualification Desk", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 70 }
              as: MarketingManager
              captures: { ch1: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Okafor Household", primary_age: 30, household_income_cents: 7500000, marital_status: "MARRIED" }
              as: MarketingManager
              captures: { pa: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Nakamura Household", primary_age: 30, household_income_cents: 7499999, marital_status: "MARRIED" }
              as: MarketingManager
              captures: { pb: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Delgado Household", primary_age: 29, household_income_cents: 7500000, marital_status: "MARRIED" }
              as: MarketingManager
              captures: { pc: $.data.id }
          trigger:
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${pb}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-14T07:00:00Z" }
              as: MarketingManager
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${pc}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-14T07:00:00Z" }
              as: MarketingManager
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${pa}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-14T07:00:00Z" }
              as: MarketingManager
              captures: { b_ok: $.data.id }
          assert:
            - "trigger 1 returns 422 with error_id ERR_PROSPECT_NOT_QUALIFIED (income 7499999 falls to the 15-point tier: 15 + 25 + 20 = 60 < 70)"
            - "trigger 2 returns 422 with error_id ERR_PROSPECT_BELOW_MINIMUM_CRITERIA (age 29 < min_age 30, evaluated before scoring)"
            - "trigger 3 returns 201"
            - "TourBooking.${b_ok}.qualification_score == 70 (income 25 + age 25 + marital 20)"
            - "TourBooking.${b_ok}.qualification_penalty_points == 0"
            - "TourChannel.${ch1}.booked_count == 1 (neither refused call incremented it)"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: funding_requires_approved_financing_application_on_other_entity
        grounds:
          - validations[priority=35]
          - validations[priority=36]
          - calculations.financing_underwriting
          - state_machines[FinancingApplication]
          - errors[ERR_FINANCING_NOT_APPROVED]
          - errors[ERR_FINANCING_AMOUNT_SHORTFALL]
        distinguishing_aspect: |
          The byte-identical POST /purchase-agreements/{id}/fund call returns four different
          outcomes driven purely by the state of a DIFFERENT entity: 409
          ERR_FINANCING_NOT_APPROVED with no application, 409 again while the application is
          SUBMITTED, 422 ERR_FINANCING_AMOUNT_SHORTFALL once an APPROVED application caps at
          3005982 (fico 700 -> ltv 0.90), and 200 only after a superseding fico-760
          application approves 3019980. Nothing about the agreement changes between the
          first three attempts.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "One FL agreement executed 2026-08-14T09:00:00Z, purchase_price 3200000, down_payment 320000, financed_amount_cents 3019980, closing_cost_fee_cents 139980."
            - "Clock advanced past 2026-08-24T23:59:59.999Z and the sweep run, so rescission_status is EXPIRED and the priority-9 gate is already satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-galleries"
              payload: { name: "Orlando Sales Gallery", site_code: "ORLGAL", concurrent_tour_capacity: 4, presentation_minutes: 120, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g1: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Dana Reyes", license_number: "FL-SL-410077", rotation_position: 1 }
              as: GalleryManager
              captures: { r1: $.data.id }
            - call: "POST /tour-channels"
              payload: { name: "Off-Property Contact", channel_code: "OFF_PROPERTY_CONTACT", incentive_gift_value_cents: 12500, min_age: 30, min_household_income_cents: 5000000, min_qualification_score: 55 }
              as: MarketingManager
              captures: { ch1: $.data.id }
            - call: "POST /prospects"
              payload: { household_name: "Alvarez Household", primary_age: 45, household_income_cents: 10000000, marital_status: "MARRIED" }
              as: MarketingManager
              captures: { p1: $.data.id }
            - call: "POST /tour-bookings"
              payload: { channel_id: "${ch1}", prospect_id: "${p1}", gallery_id: "${g1}", scheduled_start_utc: "2026-08-14T07:00:00Z" }
              as: MarketingManager
              captures: { b1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T07:00:00Z" }
              as: PlatformAdmin
