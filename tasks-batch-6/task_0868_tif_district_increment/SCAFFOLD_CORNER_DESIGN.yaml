              as: MunicipalAdmin
              captures: { obA: $.data.id }
            - call: "POST /obligations/${obA}/submit"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /obligations"
              payload: { district_id: "${d_id}", obligation_type: "BOND", principal_cents: 6000000, interest_rate_bps: 0, issue_tax_year: 2026, final_maturity_tax_year: 2035 }
              as: MunicipalAdmin
              captures: { obB: $.data.id }
            - call: "POST /obligations/${obB}/submit"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /obligations/${obA}/register"
              payload: { priority_rank: 1, expected_district_version: "${d_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /obligations/${obB}/register"
              payload: { priority_rank: 2, expected_district_version: "${d_ver}" }
              as: MunicipalAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_DISTRICT_VERSION"
            - "response HTTP status == 412"

  # ===========================================================================
  # Endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: developer_obligations_reverse_lookup
        claim_type: Computed read
        grounds: [endpoints, entities.Obligation.fields.developer_id]
        distinguishing_aspect: "GET /developers/{id}/obligations returns the developer's obligations as an array (FK reverse reachability for Obligation.developer_id)."
        test_recipe:
          setup: ["Certified district; a developer with one proposed note."]
          setup_api_calls:
            - call: "POST /tif-districts"
              payload: { name: "Rev TIF", municipality_name: "Town", base_tax_year: 2025, base_eav_cents: 100000000, term_years: 23 }
              as: MunicipalAdmin
              captures: { d_id: $.data.id }
            - call: "POST /tif-districts/${d_id}/taxing-bodies"
              payload: { name: "School", body_type: "SCHOOL", tax_rate: 0.05 }
              as: MunicipalAdmin
            - call: "POST /tif-districts/${d_id}/certify"
              payload: {}
              as: MunicipalAdmin
            - call: "POST /developers"
              payload: { legal_name: "Rev Dev", contact_email: "r@x.com" }
              as: MunicipalAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /obligations"
              payload: { district_id: "${d_id}", developer_id: "${dev_id}", obligation_type: "DEVELOPER_NOTE", principal_cents: 3000000, interest_rate_bps: 0, issue_tax_year: 2026, final_maturity_tax_year: 2035 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { ob_id: $.data.id }
          trigger:
            - call: "GET /developers/${dev_id}/obligations"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
          assert:
            - "response.data is an array containing an Obligation whose id == ${ob_id} and developer_id == ${dev_id}"

