          setup: ["contractor C-H on HOLD after two heel-shortfall returns of cylinder CYL-H1; second cylinder CYL-H2 IN_STOCK"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Hold Co", license_number: "LIC-C600" }
              as: DistributorAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /api/v1/refrigerant-cylinders"
              payload: { cylinder_tag: "CYL-H1", refrigerant_type: "R410A", tare_weight_lbs: 20.00, full_weight_lbs: 50.00 }
              as: DistributorAdmin
              captures: { cyh1_id: $.data.id }
            - call: "POST /api/v1/refrigerant-cylinders"
              payload: { cylinder_tag: "CYL-H2", refrigerant_type: "R410A", tare_weight_lbs: 20.00, full_weight_lbs: 50.00 }
              as: DistributorAdmin
              captures: { cyh2_id: $.data.id }
            - call: "POST /api/v1/refrigerant-cylinders/${cyh1_id}/issue"
              payload: { contractor_id: "${ch_id}" }
              as: DistributorAdmin
            - call: "POST /api/v1/refrigerant-cylinders/${cyh1_id}/return"
              payload: { returned_weight_lbs: 44.00 }
              as: DistributorAdmin
            - call: "POST /api/v1/refrigerant-cylinders/${cyh1_id}/refill"
              payload: {}
              as: DistributorAdmin
            - call: "POST /api/v1/refrigerant-cylinders/${cyh1_id}/issue"
              payload: { contractor_id: "${ch_id}" }
              as: DistributorAdmin
            - call: "POST /api/v1/refrigerant-cylinders/${cyh1_id}/return"
              payload: { returned_weight_lbs: 44.00 }
              as: DistributorAdmin
          trigger:
            - call: "POST /api/v1/refrigerant-cylinders/${cyh2_id}/issue"
