              as: TravelFinanceLead
              captures: { ledger: $.data }
          assert:
            - "PerDiemLedger.${ledger}.base_amount_cents == 6500"
            - "PerDiemLedger.${ledger}.deduction_cents == 0"
            - "PerDiemLedger.${ledger}.net_amount_cents == 6500 (no floor-clamp needed at zero)"

  # =====================================================================
  # Rule 7: cross_entity_state_dependency (>=2 instances, different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: flight_leg_book_requires_contract_team_executed
        grounds:
          - state_machines.FlightLeg.transitions
          - entities.CharterContract.fields.status
        distinguishing_aspect: |
          Entity pair FlightLeg -> CharterContract: a charter leg's PLANNED ->
          BOOKED transition is gated on the referenced CharterContract.status
          being in {TEAM_EXECUTED, ACTIVE}. A leg referencing a contract still
          in VENDOR_COUNTERSIGNED must be rejected with
          ERR_CONTRACT_NOT_EXECUTABLE.
        test_recipe:
          setup:
            - "Charter contract exists but only VENDOR_COUNTERSIGNED (not yet TEAM_EXECUTED)"
            - "Charter leg referencing it attempts to book"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "PHI", display_name: "Philadelphia", league_rest_policy: "STANDARD" }
