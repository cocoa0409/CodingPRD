      - name: trim_hold_sweep_releases_in_created_order
        claim_type: priority_ordering
        grounds: [state_machines.ProductionOrder.TRIM_HOLD_to_MATERIALS_OK, calculations.trim_grossing]
        distinguishing_aspect: "Selector determinism: the receive sweep walks held orders in created_at ASC with all-or-nothing coverage — earlier-held order C (needs 5) flips first, later D (needs 4) stays TRIM_HOLD when 2 units remain."
        test_recipe:
          setup: ["TI on_hand 10; pack req units 1 w 0; orders B(8), C(5), D(4) planned in that order: B reserved 8, C and D TRIM_HOLD"]
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-V15", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /trim-items", payload: { sku_code: "TI1", description: "button", origin_country: "US", unit_cost_cents: 10 }, as: MaterialsPlanner, captures: { ti: $.data.id } }
            - { call: "POST /trim-items/${ti}/receive", payload: { qty: 10 }, as: MaterialsPlanner }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser }
            - { call: "POST /trim-requirements", payload: { tech_pack_id: "${tp}", trim_item_id: "${ti}", units_per_garment: 1, wastage_pct: 0 }, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "cB", size_quantities: [{ size: "M", qty: 8 }] }, as: ProductionPlanner, captures: { poB: $.data.id } }
            - { call: "POST /production-orders/${poB}/plan", payload: { tech_pack_id: "${tp}" }, as: ProductionPlanner }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "cC", size_quantities: [{ size: "M", qty: 5 }] }, as: ProductionPlanner, captures: { poC: $.data.id } }
            - { call: "POST /production-orders/${poC}/plan", payload: { tech_pack_id: "${tp}" }, as: ProductionPlanner }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "cD", size_quantities: [{ size: "M", qty: 4 }] }, as: ProductionPlanner, captures: { poD: $.data.id } }
            - { call: "POST /production-orders/${poD}/plan", payload: { tech_pack_id: "${tp}" }, as: ProductionPlanner }
          trigger:
            - { call: "POST /trim-items/${ti}/receive", payload: { qty: 5 }, as: MaterialsPlanner }
          assert:
            - "before receive: B MATERIALS_OK (reserved 8, available 2); C and D TRIM_HOLD with populated trim_shortages"
            - "after receive +5 (on_hand 15, available 7): C flips MATERIALS_OK (reserved +5 -> available 2); D stays TRIM_HOLD (needs 4 > 2)"
            - "TrimItem.${ti}.qty_on_hand == 15, qty_reserved == 13, qty_available == 2"

