  - rule_id: non_linear_state_machine
    instances:
      - name: preference_offer_negotiation_and_good_faith_dimensions_advance_independently
        grounds:
          - state_machines.PreferenceOffer.UNREVIEWED_to_UNDER_REVIEW
          - state_machines.PreferenceOffer.IN_NEGOTIATION_to_IN_NEGOTIATION
          - entities.PreferenceOffer.fields.negotiation_status
          - entities.PreferenceOffer.fields.good_faith_status
          - calculations.good_faith_compliance_score
        distinguishing_aspect: |
          The non-linear entity is PreferenceOffer: negotiation_status and
          good_faith_status are two INDEPENDENT dimensions on the same row, so
          opening the compliance review (UNREVIEWED -> UNDER_REVIEW) leaves
          negotiation_status at IN_NEGOTIATION and does not block the
          IN_NEGOTIATION -> IN_NEGOTIATION round self-loop, which then fires
          again and moves officer_round_count 1 -> 2 and
          interim_good_faith_score 15 -> 30 while good_faith_status stays
          UNDER_REVIEW.
        test_recipe:
          setup:
            - "One custodian Agency and one HOUSING_AUTHORITY Agency registered as an AFFORDABLE_HOUSING preference entity."
            - "One Parcel with book_value_cents 70000000, one TitleCurativeItem resolved CURED at 250000 and an ACCEPTED Appraisal at 100000000, so ah_minimum_price_cents is 64750000."
            - "One ADOPTED SurplusDeclaration in status NOTICED whose notice was answered EXPRESS_INTEREST at clock 2026-08-01T00:00:00Z, creating a PreferenceOffer with negotiation_status OPEN, good_faith_status UNREVIEWED and negotiation_deadline_at 2026-10-30T00:00:00Z."
            - "One CUSTODIAN_AGENCY NegotiationRound at price_offered_cents 80000000 with no responded_to_round_number, so negotiation_status is IN_NEGOTIATION, officer_round_count 1, timely_response_count 0 and interim_good_faith_score 15."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /agencies"
