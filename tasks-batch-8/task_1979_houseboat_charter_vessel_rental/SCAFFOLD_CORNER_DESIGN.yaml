              payload: {}
              as: Renter
              as_user_id: "${r1_id}"
              captures: { b_v: $.data.version }
            - call: "POST /renters"
              payload: { full_name: "Sneak Er", email: "sneak@x.com", date_of_birth: "1990-02-03" }
              as: Renter
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/cancel"
