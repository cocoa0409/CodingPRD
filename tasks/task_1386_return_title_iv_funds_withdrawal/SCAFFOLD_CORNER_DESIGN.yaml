              as: RegistrarClerk
              captures: { ed: $.data.id }
          trigger:
            - call: "POST /r2t4/enrollments/${ed}/payments"
              payload: { amount_cents: 50000 }
              as: BursarClerk
              captures: { pay_type: $.data.entry_type, pay_amt: $.data.amount_cents }
            - call: "GET /r2t4/enrollments/${ed}"
              payload: {}
              as: BursarClerk
              captures: { ed_bal: $.data.balance_cents }
          assert:
            - "Payment entry: entry_type == PAYMENT, amount_cents == -50000"
            - "Enrollment.${ed}.balance_cents == 550000"

      - name: zero_aid_withdrawal_auto_closes_case
        claim_type: input_set_filtering
        grounds:
          - "calculations.r2t4_earned_unearned"
          - "state_machines.WithdrawalCase.CALCULATED_to_CLOSED"
        distinguishing_aspect: "Empty-set edge: with no awards at all, earned == disbursed == 0 produces neither obligations nor offers, and the case auto-closes at calculate (notification sent because balance 600000 > 0)."
        test_recipe:
          setup: ["Term T1; enrollment charges 600000, no awards; withdraw OFFICIAL 2026-10-25"]
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "SE", full_name: "Stu E", email: "se@x.edu" }
              as: RegistrarClerk
              captures: { se: $.data.id }
            - call: "POST /r2t4/students/${se}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
