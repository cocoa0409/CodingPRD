  - rule_id: boundary_precision_check
    instances:
      - name: sla_breach_at_exact_due_instant_ticket_expiry
        grounds:
          - state_machines.LocateTicket.SUBMITTED_to_EXPIRED
          - calculations.response_posture
          - entities.LocateTicket.fields.sla_due_at
        distinguishing_aspect: |
          Boundary on the ticket-response deadline: advancing the clock to exactly sla_due_at
          (2026-05-01T02:00:00Z for an EMERGENCY submitted at default) does NOT expire the ticket
          (posture stays AWAITING_RESPONSES), because the rule is clock > sla_due_at (strict). One
          second past does. Reachable via POST /_clock/set_current_utc.
        test_recipe:
          setup:
            - "EMERGENCY ticket submitted at default clock with one PENDING notification; sla_due_at=2026-05-01T02:00:00Z."
          setup_api_calls:
            - call: "POST /excavators"
