            - call: "GET /permit-applications/${app_id}/reviews"
              payload: {}
              as: PermitOfficer
              captures: { rp: "$.data[0].id", rf: "$.data[1].id", re: "$.data[2].id", rw: "$.data[3].id" }
            - call: "POST /permit-applications/${app_id}/reviews/${rp}/approve"
              payload: { planned_personnel: 4, planned_hours: 8, hourly_rate: 50 }
              as: DepartmentReviewer
              as_user_id: "POLICE"
            - call: "POST /permit-applications/${app_id}/reviews/${rf}/approve"
              payload: { planned_personnel: 2, planned_hours: 6, hourly_rate: 60 }
              as: DepartmentReviewer
              as_user_id: "FIRE"
            - call: "POST /permit-applications/${app_id}/reviews/${re}/approve"
              payload: { planned_personnel: 1, planned_hours: 8, hourly_rate: 45 }
              as: DepartmentReviewer
              as_user_id: "EMS"
            - call: "POST /permit-applications/${app_id}/reviews/${rw}/approve"
              payload: { planned_personnel: 3, planned_hours: 4, hourly_rate: 40 }
              as: DepartmentReviewer
              as_user_id: "PUBLIC_WORKS"
            - call: "POST /permit-applications/${app_id}/deposit"
              payload: { amount: 500 }
              as: Applicant
              as_user_id: "${u}"
              captures: { deposit_id: $.data.id }
          trigger:
            - call: "POST /permit-applications/${app_id}/cancel"
              payload: {}
              as: Applicant
              as_user_id: "${u}"
            - call: "GET /permit-applications/${app_id}/route-segments/${seg_id}"
              payload: {}
              as: PermitOfficer
          assert:
            - "PermitApplication.${app_id}.status == CANCELLED"
            - "Deposit.${deposit_id}.status == REFUNDED, refunded_amount == 500.00, forfeited_amount == 0.00"
            - "RouteSegment.${seg_id}.status == RELEASED"

  # ==========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_fee_after_segment_add
        claim_type: immediate
        grounds: [calculations.application_fee_calc, endpoints]
        distinguishing_aspect: "Adding a route segment to a DRAFT app immediately reflects the +75 closure fee in the same GET (immediate consistency): 400.00 -> 475.00."
        test_recipe:
          setup: ["A DRAFT MEDIUM app (attendance 3000, fee 400.00, 0 segments)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V", venue_type: "STREET_CORRIDOR", max_capacity: 6000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /closure-schedules"
              payload: { corridor_name: "JJ St", min_gap_minutes: 30 }
              as: PermitOfficer
              captures: { sched_id: $.data.id }
            - call: "POST /applicants"
              payload: { org_name: "Org IMM", contact_email: "imm@x.com" }
              as: PermitOfficer
              captures: { u: $.data.id }
            - call: "POST /permit-applications"
              payload: { applicant_org: "Org IMM", venue_id: "${venue_id}", event_kind: "RACE", expected_attendance: 3000, occupy_start: "2026-07-20T08:00:00Z", occupy_end: "2026-07-20T16:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /permit-applications/${app_id}/route-segments"
              payload: { closure_schedule_id: "${sched_id}", segment_label: "JJ 1", closure_start: "2026-07-20T10:00:00Z", closure_end: "2026-07-20T12:00:00Z" }
              as: Applicant
              as_user_id: "${u}"
            - call: "GET /permit-applications/${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${u}"
              captures: { fee: $.data.application_fee }
          assert:
            - "PermitApplication.${app_id}.application_fee == 475.00 (400 + 1*75) in the same GET"
