      - name: second_submit_of_in_review_family_returns_family_state_invalid
        claim_type: idempotency
        grounds:
          - state_machines.FareFamily.status.DRAFT_to_IN_REVIEW
          - validations.priority_8
          - errors[ERR_FAMILY_STATE_INVALID]
        distinguishing_aspect: "Submitting twice is not idempotent-by-silence: the second submit is refused with ERR_FAMILY_STATE_INVALID because status is already IN_REVIEW, and the valuation is not recomputed a second time."
        test_recipe:
          setup:
            - "family ECO_LITE with one ACTIVE INCLUDED BAG_CHECKED_1 attribute has been submitted once and sits IN_REVIEW"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
