          rationale: "ERR_NO_OPENINGS is exercised through the employer-suspension §1.9 instance (employer_suspend_blocks_new_applications_and_offer_issuance); the fiscal-openings path shares the same validation row (priority 10)."

      - name: err_duplicate_license_number_per_state
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DUPLICATE_RESOURCE
          - validations[priority=11]
        distinguishing_aspect: "Two verifications with the same license_number in the SAME license_state are rejected, while the same license_number in a DIFFERENT state is accepted — uniqueness is scoped per (license_state)."
        test_recipe:
          setup:
            - "Two DRAFT nurses; nurse A has a PENDING verification RN-CA-100 in CA."
          setup_api_calls:
            - *k_clock
            - *k_nurse
            - *k_lic
            - call: "POST /marketplace/nurses"
              payload: { full_name: "Dup Lic", email: "dup@x.com", home_state: "CA", primary_specialty: "ICU", years_experience: 3, desired_shift: "DAY", desired_hourly_rate_cents: 7000, max_commute_miles: 40, current_employer_name: "" }
              as: Candidate
              as_user_id: "seed-dup"
              captures: { nurse_d: $.data.id }
          trigger:
            - call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${nurse_d}", license_number: "RN-CA-100", license_state: "CA", expiry_date: "2028-01-01" }
              as: Candidate
              as_user_id: "${nurse_d}"
              captures: { err_duplic: $.data.error_id }
            - call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${nurse_d}", license_number: "RN-CA-100", license_state: "OR", expiry_date: "2028-01-01" }
              as: Candidate
              as_user_id: "${nurse_d}"
          assert:
            - "err_duplic == ERR_DUPLICATE_RESOURCE (same number, same state)"
            - "the OR submission with the same number returns 201 (uniqueness is per-state)"

