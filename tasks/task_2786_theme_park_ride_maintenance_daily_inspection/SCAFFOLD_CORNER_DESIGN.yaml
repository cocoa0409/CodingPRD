              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${a1}", part_number: "PN-XREF", quantity: 2, unit_cost_cents: 30000, needed_by_date: "2026-08-20", downtime_event_id: "${d2}", bulletin_action_id: "${act1}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
            - call: "POST /park-ops/part-requisitions"
              payload: { attraction_id: "${a1}", part_number: "PN-XREF", quantity: 2, unit_cost_cents: 30000, needed_by_date: "2026-08-20", bulletin_action_id: "${act1}" }
              as: MaintenanceTechnician
              as_user_id: "tech-1"
              captures: { r_ok: "$.data.id" }
          assert:
            - "Call 1: HTTP 400 with error_id == \"ERR_INVALID_REQUEST\" (the event belongs to ${a2}, not ${a1})"
            - "Call 2: HTTP 400 with error_id == \"ERR_INVALID_REQUEST\" (both polymorphic links supplied)"
            - "Call 3: HTTP 201; PartRequisition.${r_ok}.status == \"REQUESTED\" and total_cost_cents == 60000 and bulletin_action_id == \"${act1}\" and downtime_event_id is null"
