        distinguishing_aspect: "The two program roles are peers, not a hierarchy: GovAffairsDirector can read every registration and log activity against it but cannot move its lifecycle, so file and terminate both return 403 ERR_FORBIDDEN_ROLE while the GET on the same id returns 200."
