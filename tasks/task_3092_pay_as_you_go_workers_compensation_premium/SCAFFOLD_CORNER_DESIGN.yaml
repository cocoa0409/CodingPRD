# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3092_pay_as_you_go_workers_compensation_premium
#
# Breadth probe over §1.1–§1.7 claims not already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Corners §1.8 covers appear as
# excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: employer_create_round_trips_all_fields_with_system_defaults
        claim_type: Creation
        grounds: ['entities.Employer', 'endpoints.POST_/wc/employers']
        distinguishing_aspect: "POST with the four required inputs returns 201 with status defaulted to ACTIVE, version 1, and system-minted id/created_at/updated_at — status is never client-supplied."
        test_recipe:
          setup: ["Logical clock at startup default 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /wc/employers"
              payload: { legal_name: "Acme Anvils", fein: "10-0000001", contact_email: "ops@acme.example", home_state: "CA" }
              as: PlatformAdmin
              captures: { emp_acme_id: $.data.id }
          assert:
            - "response status 201 and response_type object"
            - "Employer.${emp_acme_id}.status == ACTIVE (default applied)"
            - "Employer.${emp_acme_id}.version == 1 and id/created_at/updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: employer_create_missing_contact_email_returns_invalid_request
        claim_type: Required Fields
        grounds: ['entities.Employer.fields.contact_email', 'validations.priority-4', 'errors.ERR_INVAL{id}_REQUEST']
        distinguishing_aspect: "contact_email is a required input with no default; omitting it fails with ERR_INVALID_REQUEST (400) before any persistence."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /wc/employers"
              payload: { legal_name: "No Email Co", fein: "10-0000002", home_state: "CA" }
              as: PlatformAdmin
              captures: { ne_err: $.data.error_id }
          assert:
            - "response status 400 with error_id ERR_INVALID_REQUEST"

      - name: policy_computed_aggregates_ignore_client_input
        claim_type: Computed Fields
        grounds: ['entities.Policy.fields.cumulative_billed_cents', 'entities.Policy.fields.cumulative_collected_cents']
        distinguishing_aspect: "cumulative_billed_cents / cumulative_collected_cents are computed; sending them in the create body is ignored (rejected as unknown or disregarded) and both read back 0 on a fresh policy."
        test_recipe:
          setup: ["Clock default. CA table exists; employer exists."]
          setup_api_calls:
            - &cd_ca
              call: "POST /wc/state-rating-tables"
              payload: { state_code: "CA", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", monopolistic: false, per_capita_admin_fee_cents: 250, expense_constant_cents: 30000, min_payroll_threshold_cents: 10000, state_minimum_premium_cents: 50000, ot_basis: "NET", class_rates: [{class_code: "8810", rate_per_100_cents: 125}, {class_code: "5645", rate_per_100_cents: 890}, {class_code: "8812", rate_per_100_cents: 160}], max_payroll_per_executive_cents: 250000 }
              as: PlatformAdmin
            - &cd_emp
              call: "POST /wc/employers"
              payload: { legal_name: "Computed Fields Co", fein: "10-0000003", contact_email: "c@computed.example", home_state: "CA" }
              as: PlatformAdmin
              captures: { cd_emp_id: $.data.id }
          trigger:
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-CMP-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { cd_pol_id: $.data.id }
          assert:
            - "Policy.${cd_pol_id}.cumulative_billed_cents == 0 and cumulative_collected_cents == 0"
            - "Policy.${cd_pol_id}.coverage_status == PENDING, reporting_status == COMPLIANT, billing_status == CURRENT (initial states)"
            - "Policy.${cd_pol_id}.consecutive_missed_cycles == 0 (default)"

      - name: get_policy_with_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds: ['endpoints.GET_/wc/policies/{id}', 'errors.ERR_NOT_FOUND', 'validations.priority-3']
        distinguishing_aspect: "A well-formed but absent policy id returns 404 ERR_NOT_FOUND — existence is validated at priority 3 before state checks."
        test_recipe:
          setup: ["Clock default. Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /wc/policies/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Underwriter
              captures: { nf_err: $.data.error_id }
          assert:
            - "response status 404 with error_id ERR_NOT_FOUND"

      - name: policies_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: ['endpoints.GET_/wc/policies', 'response_envelope.pagination_fields', 'response_envelope.pagination_defaults']
        distinguishing_aspect: "With three policies and limit=2, page 1 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false — total_count reflects the whole filtered set."
        test_recipe:
          setup: ["Clock default. CA table; one employer; three policies created."]
          setup_api_calls:
            - *cd_ca
            - *cd_emp
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-PAG-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 100000}] }
              as: Underwriter
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-PAG-002", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 100000}] }
              as: Underwriter
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-PAG-003", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 100000}] }
              as: Underwriter
          trigger:
            - call: "GET /wc/policies?limit=2&offset=0"
              as: Underwriter
            - call: "GET /wc/policies?limit=2&offset=2"
              as: Underwriter
          assert:
            - "page 1 returns 2 items with total_count == 3 and has_more == true"
            - "page 2 returns 1 item with total_count == 3 and has_more == false"

      - name: state_rating_table_invalid_enum_ot_basis_rejected
        claim_type: Type Constraints
        grounds: ['entities.StateRatingTable.fields.ot_basis', 'validations.priority-4']
        distinguishing_aspect: "ot_basis is an enum {GROSS, NET}; any other value (e.g. 'HALF') fails ERR_INVALID_REQUEST at priority 4."
        test_recipe:
          setup: ["Clock default."]
          setup_api_calls: []
          trigger:
            - call: "POST /wc/state-rating-tables"
              payload: { state_code: "CA", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", monopolistic: false, per_capita_admin_fee_cents: 250, expense_constant_cents: 30000, min_payroll_threshold_cents: 10000, state_minimum_premium_cents: 50000, ot_basis: "HALF", class_rates: [{class_code: "8810", rate_per_100_cents: 125}], max_payroll_per_executive_cents: 250000 }
              as: PlatformAdmin
              captures: { enum_err: $.data.error_id }
          assert:
            - "response status 400 with error_id ERR_INVALID_REQUEST"

      - name: policy_class_code_child_listing_under_parent
        claim_type: Parent Relationships
        grounds: ['entities.PolicyClassCode', 'endpoints.GET_/wc/policies/{id}/class-codes']
        distinguishing_aspect: "PolicyClassCode is a child of Policy: created implicitly with the policy and reachable via the sub-resource GET, returning one row per declared class with assignment_status ACTIVE and effective_from equal to the policy effective_date."
        test_recipe:
          setup: ["Clock default. CA table; employer; policy with two CA classes created."]
          setup_api_calls:
            - *cd_ca
            - *cd_emp
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-CHD-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 500000}, {state_code: "CA", class_code: "5645", estimated_annual_payroll_cents: 700000}] }
              as: Underwriter
              captures: { cd_chd_pol: $.data.id }
          trigger:
            - call: "GET /wc/policies/${cd_chd_pol}/class-codes"
              as: Underwriter
          assert:
            - "exactly 2 PolicyClassCode rows, both assignment_status == ACTIVE"
            - "both rows have policy_id == ${cd_chd_pol} and effective_from == 2026-09-01T00:00:00Z"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: bind_transitions_policy_to_active_and_creates_integration
        claim_type: Valid Transition
        grounds: ['state_machines.Policy.coverage_status.PENDING_to_ACTIVE', 'endpoints.POST_/wc/policies/{id}/bind']
        distinguishing_aspect: "Bind moves coverage_status PENDING -> ACTIVE and materializes the 1:1 PayrollIntegration in CONNECTED — both observable through declared GETs."
        test_recipe:
          setup: ["Clock default. CA table; employer; policy with CA/8810 created."]
          setup_api_calls:
            - *cd_ca
            - *cd_emp
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-BND-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { cd_bind_pol: $.data.id }
          trigger:
            - call: "POST /wc/policies/${cd_bind_pol}/bind"
              payload: {}
              as: Underwriter
            - call: "GET /wc/policies/${cd_bind_pol}/integration"
              as: Underwriter
              captures: { cd_integ_status: "$.data[0].connection_status" }
          assert:
            - "Policy.${cd_bind_pol}.coverage_status == ACTIVE"
            - "the integration list has exactly 1 row with connection_status == CONNECTED"

      - name: double_bind_returns_invalid_state
        claim_type: Idempotency
        grounds: ['state_machines.Policy.coverage_status', 'errors.ERR_INVAL{id}_STATE']
        distinguishing_aspect: "Bind is not declared from ACTIVE; repeating the trigger on an ACTIVE policy fails 409 ERR_INVALID_STATE and changes nothing."
        test_recipe:
          setup: ["Bound policy exists."]
          setup_api_calls:
            - *cd_ca
            - *cd_emp
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-DBL-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { cd_dbl_pol: $.data.id }
            - call: "POST /wc/policies/${cd_dbl_pol}/bind"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /wc/policies/${cd_dbl_pol}/bind"
              payload: {}
              as: Underwriter
              captures: { cd_dbl_err: $.data.error_id }
          assert:
            - "response status 409 with error_id ERR_INVALID_STATE"
            - "Policy.${cd_dbl_pol}.coverage_status remains ACTIVE"

      - name: cancel_voids_draft_denies_disputes_waives_audits
        claim_type: Side Effect Execution
        grounds: ['state_machines.Policy.coverage_status.ACTIVE_to_CANCELLED', 'state_machines.ClassCodeDispute', 'state_machines.AuditReconciliation.OPEN_to_WAIVED']
        distinguishing_aspect: "Underwriter cancel fans out: open dispute (FILED) is force-DENIED with resolution_reason policy_cancelled and the open audit is WAIVED — a conditional cascade affecting only non-terminal children."
        test_recipe:
          setup: ["Bound policy with a FILED dispute and an OPEN audit."]
          setup_api_calls:
            - *cd_ca
            - *cd_emp
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-CXL-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { cd_cxl_pol: $.data.id }
            - call: "POST /wc/policies/${cd_cxl_pol}/bind"
              payload: {}
              as: Underwriter
            - call: "GET /wc/policies/${cd_cxl_pol}/class-codes"
              as: Underwriter
              captures: { cd_cxl_pcc: "$.data[0].id" }
            - call: "POST /wc/disputes"
              payload: { policy_id: "${cd_cxl_pol}", policy_class_code_id: "${cd_cxl_pcc}", requested_class_code: "8812", effective_from: "2026-09-01T00:00:00Z" }
              as: EmployerAdmin
              as_user_id: "${cd_emp_id}"
              captures: { cd_cxl_disp: $.data.id }
            - call: "POST /wc/audits"
              payload: { policy_id: "${cd_cxl_pol}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: Auditor
              captures: { cd_cxl_audit: $.data.id }
          trigger:
            - call: "POST /wc/policies/${cd_cxl_pol}/cancel"
              payload: {}
              as: Underwriter
          assert:
            - "Policy.${cd_cxl_pol}.coverage_status == CANCELLED"
            - "ClassCodeDispute.${cd_cxl_disp}.status == DENIED and resolution_reason == policy_cancelled"
            - "AuditReconciliation.${cd_cxl_audit}.status == WAIVED"

      - name: cancelled_policy_locks_all_transitions
        claim_type: Terminal State Lockdown
        grounds: ['state_machines.Policy.coverage_status', 'errors.ERR_INVAL{id}_STATE']
        distinguishing_aspect: "CANCELLED is terminal: a further cancel attempt fails 409 ERR_INVALID_STATE and payroll submissions fail 409 ERR_POLICY_NOT_ACTIVE."
        test_recipe:
          setup: ["Policy cancelled."]
          setup_api_calls:
            - *cd_ca
            - *cd_emp
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-TRM-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { cd_trm_pol: $.data.id }
            - call: "POST /wc/policies/${cd_trm_pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /wc/policies/${cd_trm_pol}/cancel"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /wc/policies/${cd_trm_pol}/cancel"
              payload: {}
              as: Underwriter
              captures: { cd_trm_err1: $.data.error_id }
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${cd_trm_pol}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", idempotency_key: "trm-run-1", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 10000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
              captures: { cd_trm_err2: $.data.error_id }
          assert:
            - "second cancel fails 409 ERR_INVALID_STATE"
            - "payroll submission fails 409 ERR_POLICY_NOT_ACTIVE"

      - name: open_review_marks_class_assignment_disputed_but_reportable
        claim_type: Side Effect Execution
        grounds: ['state_machines.ClassCodeDispute.FILED_to_UNDER_REVIEW', 'validations.priority-9']
        distinguishing_aspect: "Opening review flips the PolicyClassCode to DISPUTED — a cross-entity side effect — while payroll under that class is STILL accepted (DISPUTED is in the accepted-status set), distinguishing it from REASSIGNED."
        test_recipe:
          setup: ["Bound policy; dispute filed; review opened."]
          setup_api_calls:
            - *cd_ca
            - *cd_emp
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-DSP-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { cd_dsp_pol: $.data.id }
            - call: "POST /wc/policies/${cd_dsp_pol}/bind"
              payload: {}
              as: Underwriter
            - call: "GET /wc/policies/${cd_dsp_pol}/class-codes"
              as: Underwriter
              captures: { cd_dsp_pcc: "$.data[0].id" }
            - call: "POST /wc/disputes"
              payload: { policy_id: "${cd_dsp_pol}", policy_class_code_id: "${cd_dsp_pcc}", requested_class_code: "8812", effective_from: "2026-09-01T00:00:00Z" }
              as: EmployerAdmin
              as_user_id: "${cd_emp_id}"
              captures: { cd_dsp_id: $.data.id }
          trigger:
            - call: "POST /wc/disputes/${cd_dsp_id}/open-review"
              payload: {}
              as: Underwriter
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${cd_dsp_pol}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", idempotency_key: "dsp-run-1", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 10000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
              captures: { cd_dsp_rep_status: $.data.status }
            - call: "GET /wc/policies/${cd_dsp_pol}/class-codes"
              as: Underwriter
          assert:
            - "the disputed PolicyClassCode assignment_status == DISPUTED"
            - "the payroll report under the disputed class is ACCEPTED (DISPUTED does not block reporting)"

      - name: auto_cancel_after_35_days_non_reporting
        claim_type: Valid Transition
        grounds: ['state_machines.Policy.coverage_status.ACTIVE_to_CANCELLED', 'calculations.cancellation_clock']
        distinguishing_aspect: "System path: integration BROKEN at day 0 makes the policy NON_REPORTING at day 21 (>= boundary inclusive), and coverage auto-CANCELLS at day 56 (21 + 35) — a system-triggered transition with no API call on the policy."
        test_recipe:
          setup:
            - "Bound policy with integration; heartbeat BROKEN on 2026-09-01."
          setup_api_calls:
            - *cd_ca
            - *cd_emp
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-AUT-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { cd_aut_pol: $.data.id }
            - call: "POST /wc/policies/${cd_aut_pol}/bind"
              payload: {}
              as: Underwriter
            - call: "GET /wc/policies/${cd_aut_pol}/integration"
              as: PayrollProvider
              captures: { cd_aut_integ: "$.data[0].id" }
            - call: "POST /wc/integrations/${cd_aut_integ}/heartbeat"
              payload: { outcome: "BROKEN" }
              as: PayrollProvider
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-22T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /wc/policies/${cd_aut_pol}"
              as: Underwriter
              captures: { cd_aut_rep21: $.data.reporting_status, cd_aut_cov21: $.data.coverage_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-27T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /wc/policies/${cd_aut_pol}"
              as: Underwriter
              captures: { cd_aut_cov56: $.data.coverage_status }
          assert:
            - "at 2026-09-22 (21 broken days, inclusive boundary) reporting_status == NON_REPORTING and coverage_status == ACTIVE"
            - "at 2026-10-27 (56 broken days = 21 + 35) coverage_status == CANCELLED via the system sweep"

      - name: expiry_opens_full_term_audit
        claim_type: Side Effect Execution
        grounds: ['state_machines.Policy.coverage_status.ACTIVE_to_EXPIRED', 'state_machines.AuditReconciliation']
        distinguishing_aspect: "Reaching expiry_date auto-EXPIRES the policy and opens an AuditReconciliation covering [effective_date, expiry_date) with status OPEN — bubble-up bookkeeping with no direct audit creation call."
        test_recipe:
          setup: ["Bound policy with term ending 2026-10-01."]
          setup_api_calls:
            - *cd_ca
            - *cd_emp
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-EXP-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2026-10-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 500000}] }
              as: Underwriter
              captures: { cd_exp_pol: $.data.id }
            - call: "POST /wc/policies/${cd_exp_pol}/bind"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /wc/policies/${cd_exp_pol}/audits"
              as: Auditor
          assert:
            - "Policy.${cd_exp_pol}.coverage_status == EXPIRED (expiry boundary is inclusive: clock == expiry_date expires)"
            - "exactly one audit exists with period_start == 2026-09-01T00:00:00Z, period_end == 2026-10-01T00:00:00Z, status == OPEN"

  # ===========================================================================
  - section: calculations
    instances:

      - name: invoice_total_combines_all_components_with_pinned_literals
        claim_type: Correct Result
        grounds: ['calculations.invoice_total', 'calculations.manual_premium', 'calculations.remuneration_basis']
        distinguishing_aspect: "End-to-end pinned arithmetic on the two-state fixture: manual 20260 (1250 + 16910 + 2100), post-mod subtotals 19976 + 2310 with no minimum substitution (19976 >= 10000; NV threshold unreachable), per-capita 1650, expense constant = max(30000, 45000) = 45000 charged ONCE, total 68936."
        test_recipe:
          setup: ["Divergence Construction fixture: CA+NV policy mod 1.1, one report with three lines."]
          setup_api_calls:
            - call: "POST /wc/state-rating-tables"
