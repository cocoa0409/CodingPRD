  - rule_id: compensating_invariant
    instances:

      - name: compensating_invoice_void_unwinds_client_balance_and_speaker_payable
        grounds:
          - state_machines.Invoice.ISSUED_to_VOID
          - state_machines.Remittance.PENDING_to_VOIDED
          - state_machines.Engagement.INVOICED_to_WRITTEN_OFF
          - entities.Client.fields.outstanding_balance_cents
          - entities.Speaker.fields.pending_remittance_cents
        distinguishing_aspect: |
          Voiding compensates a three-row ledger fan-out in one call: the client's receivable,
          the engagement's settlement lane and the speaker's payable must all return to their
          pre-issuance values, and the sibling Remittance must be VOIDED rather than left
          PENDING against a dead invoice. Reversing only the invoice status leaves 1282500
          stranded in speaker.pending_remittance_cents.
        test_recipe:
          setup:
            - "Engagement DELIVERED with quoted_fee_cents 1275000, recording_fee_cents 350000, one APPROVED travel expense reimbursing 63750 and commission_pct_snapshot 0.25"
            - "Invoice ISSUED with amount_due_cents 1718304 and amount_paid_cents 0; client.outstanding_balance_cents 1718304"
            - "Remittance PENDING with net_payable_cents 1282500; speaker.pending_remittance_cents 1282500"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /speakers"
              payload: { full_name: "Dana Reyes", topics: ["AI_STRATEGY", "LEADERSHIP"], fee_floor_cents: 1000000, fee_ceiling_cents: 2000000, travel_class: "PREMIUM", travel_buffer_days: 1, tax_form_status: "ON_FILE" }
              as: BureauAdmin
