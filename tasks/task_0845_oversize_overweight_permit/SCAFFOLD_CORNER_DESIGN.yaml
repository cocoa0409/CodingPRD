        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[permit-edit-stale-version]
          - errors[ERR_STALE_PERMIT_VERSION]
        distinguishing_aspect: "PATCH /permits with expected_permit_version 1 after a route-segment add advanced version to 2 returns ERR_STALE_PERMIT_VERSION (412)."
        test_recipe:
          setup: ["A DRAFT permit (version 1) with a route segment added (version now 2)."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "OCC Co", usdot_number: "USDOT-O1" }
              as: DOTAdmin
              captures: { cid: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${cid}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { pid: $.data.id, v1: $.data.version }
            - call: "POST /permits/${pid}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10 }
              as: Carrier
              as_user_id: "${cid}"
          trigger:
            - call: "PATCH /permits/${pid}"
              payload: { expected_permit_version: "${v1}", width_in: 110 }
              as: Carrier
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_PERMIT_VERSION"
            - "response HTTP status == 412"

      - name: occ_fresh_permit_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[permit-edit-stale-version]
          - entities.Permit.fields.width_in
        distinguishing_aspect: "PATCH /permits carrying the current version (2) succeeds, updates width_in to 110, and bumps version to 3."
        test_recipe:
          setup: ["A DRAFT permit with a route segment (version now 2), current version re-read."]
          setup_api_calls:
            - call: "POST /carriers"
              payload: { legal_name: "OCC2 Co", usdot_number: "USDOT-O2" }
              as: DOTAdmin
              captures: { cid: $.data.id }
            - call: "POST /permits"
              payload: { carrier_id: "${cid}", permit_type: "SINGLE_TRIP", length_in: 900, width_in: 100, height_in: 100, gross_weight_lbs: 120000, num_axles: 9, valid_from: "2026-06-01T00:00:00Z", valid_until: "2026-06-30T00:00:00Z" }
              as: Carrier
              as_user_id: "${cid}"
              captures: { pid: $.data.id }
            - call: "POST /permits/${pid}/route-segments"
              payload: { sequence_index: 1, highway_id: "I-80", from_milepost: 0, to_milepost: 10 }
              as: Carrier
              as_user_id: "${cid}"
            - call: "GET /permits/${pid}"
              payload: {}
              as: Carrier
              as_user_id: "${cid}"
              captures: { vcur: $.data.version }
          trigger:
            - call: "PATCH /permits/${pid}"
              payload: { expected_permit_version: "${vcur}", width_in: 110 }
              as: Carrier
              as_user_id: "${cid}"
              captures: { neww: $.data.width_in, newv: $.data.version }
          assert:
            - "Permit.${pid}.width_in == 110"
            - "Permit.${pid}.version == 3"

