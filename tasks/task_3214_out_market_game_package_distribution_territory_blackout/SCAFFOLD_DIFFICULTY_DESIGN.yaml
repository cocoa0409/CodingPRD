              payload: { season_id: "${season_id}", week_index: 4, away_team_code: "KC", home_team_code: "DAL", kickoff_at: "2026-08-30T17:00:00Z", home_market_code: "DAL" }
              as: LeagueOps
              captures: { game_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", plan_tier: "BASE", base_price_cents: 20000, includes_multiview: false, includes_companion: false, valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { offer_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "led@x.com", full_name: "Led Ger", account_kind: "RESIDENTIAL", billing_zip: "75001" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", offer_id: "${offer_id}" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /_payments/simulate"
              payload: { subscription_id: "${sub_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /complaint-cases"
              payload: { account_id: "${acct_id}", subscription_id: "${sub_id}", game_id: "${game_id}", category: "BLACKOUT_DISPUTE", detail: "blocked" }
              as: Subscriber
              as_user_id: "${acct_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /complaint-cases/${case_id}/resolve"
              payload: { decision: "APPROVE", note: "refund approved" }
              as: SupportAgent
              as_user_id: "sa-jane"
              captures: { refund: $.data.refund_amount_cents }
            - call: "GET /subscriptions/${sub_id}/payments"
              payload: {}
              as: SupportAgent
              as_user_id: "sa-jane"
              captures: { charge_amt: "$.data[0].amount_cents", refund_amt: "$.data[1].amount_cents" }
            - call: "GET /subscriptions/${sub_id}"
              payload: {}
              as: SupportAgent
              as_user_id: "sa-jane"
              captures: { paid_final: $.data.paid_amount_cents }
          assert:
            - "ComplaintCase.${case_id}.refund_amount_cents == 1111 (weekly_value = round_half_up(16667/15))"
            - "Payment ledger holds exactly 2 rows: CHARGE 16667 then REFUND 1111"
            - "Subscription.${sub_id}.paid_amount_cents == 15556 == 16667 - 1111 (ledger conservation: paid == CHARGE sum - REFUND sum)"

      - name: selection_move_entitlement_count_conservation
        grounds:
          - state_machines.WeekSlate.PRELIMINARY_to_PRELIMINARY
