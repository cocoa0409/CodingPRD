            - { call: "POST /api/volunteers", payload: { full_name: "Vol D", phone: "555-1801" }, as: ProgramCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /api/volunteers/${v_id}/begin-training", payload: {}, as: ProgramCoordinator }
