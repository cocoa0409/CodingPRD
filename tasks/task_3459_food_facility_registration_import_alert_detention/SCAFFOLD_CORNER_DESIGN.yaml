              as: PlatformAdmin
              captures: { swept: $.data.auto_refused_entry_ids }
          assert:
            - "at exactly the deadline (2026-09-11T00:00:00Z) the reconditioning request succeeds (deadline inclusive; the sweep grace keeps the entry DETAINED)"
            - "bond_1 == 15100 (per-lot bond 100 + storage 10 days x 1500)"
            - "at deadline + 1h: err_late == ERR_DETENTION_RESPONSE_DEADLINE_PASSED (http 422) and ImportEntry.${ent_2}.disposition_status is still DETAINED (sweep grace)"
            - "at deadline + 24h + 1s: swept contains both ${ent_1} and ${ent_2}; both entries REFUSED with units_refused == 10"
            - "Facility.${fac_id}.open_detention_count == 0 and violation_count == 2"

      - name: petition_scope_mismatch_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=8]
          - errors.ERR_ALERT_SCOPE_MISMATCH
        distinguishing_aspect: "For a FIRM alert the filing facility must be the alerted facility: a different facility's petition fails 422 ERR_ALERT_SCOPE_MISMATCH even though it is a registered facility with a valid alert version."
        test_recipe:
          setup: ["Default clock; facilities F-A (alerted) and F-B (unrelated); FIRM alert on F-A."]
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Osaka Kombu", facility_kind: "FOREIGN", country_code: "JP", ufi: "UFI-JP-2309" }
              as: FacilityOwner
              captures: { fac_a: $.data.id }
            - call: "POST /registry/facilities"
              payload: { legal_name: "Nagano Miso", facility_kind: "FOREIGN", country_code: "JP", ufi: "UFI-JP-2310" }
              as: FacilityOwner
              captures: { fac_b: $.data.id }
            - call: "POST /registry/import-alerts"
              payload: { scope_type: "FIRM", facility_id: "${fac_a}", reason: "Undeclared allergen" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { alert_id: $.data.id, alert_v: $.data.version }
          trigger:
            - call: "POST /registry/import-alerts/${alert_id}/petitions"
              payload: { expected_import_alert_version: "${alert_v}", evidence_links: ["doc-x"] }
              as: FacilityOwner
              as_user_id: "${fac_b}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ALERT_SCOPE_MISMATCH (http 422)"
            - "GET /registry/import-alerts/${alert_id}/petitions returns 0 rows and the alert version is unchanged"

      - name: alert_creator_cannot_adjudicate_own_alert
        claim_type: conditional_validation
        grounds:
          - validations[priority=9]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.ImportAlert.fields.created_by_user_id
        distinguishing_aspect: "Segregation of duties: the ComplianceOfficer whose X-User-ID created the alert may not adjudicate its petition (403 ERR_SEGREGATION_OF_DUTIES), while a different ComplianceOfficer may — checked before streak sufficiency, so it fires even with a zero streak."
        test_recipe:
          setup: ["Default clock; facility; FIRM alert created by co-1; petition filed by the facility with evidence."]
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Limerick Dairies", facility_kind: "FOREIGN", country_code: "IE", ufi: "UFI-IE-2311" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/import-alerts"
              payload: { scope_type: "FIRM", facility_id: "${fac_id}", reason: "Antibiotics" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { alert_id: $.data.id, alert_v: $.data.version }
            - call: "POST /registry/import-alerts/${alert_id}/petitions"
              payload: { expected_import_alert_version: "${alert_v}", evidence_links: ["doc-y"] }
              as: FacilityOwner
              as_user_id: "${fac_id}"
              captures: { pet_id: $.data.id }
          trigger:
            - call: "POST /registry/alert-petitions/${pet_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
            - call: "POST /registry/alert-petitions/${pet_id}/adjudicate"
              payload: { decision: "DENY" }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { st: $.data.status }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES (http 403) for the creator co-1 (streak is 0, yet SoD fires first)"
            - "the same petition adjudicated by co-2 succeeds: st == DENIED"

      - name: reconditioning_units_must_sum_to_held
        claim_type: violation_to_error
        grounds:
          - calculations.entry_units_conservation
          - errors.ERR_UNITS_ACCOUNTING_MISMATCH
        distinguishing_aspect: "The reconditioning outcome must account for every held unit: units_passed 6 + units_failed 3 against units_held 10 fails 422 ERR_UNITS_ACCOUNTING_MISMATCH and moves nothing."
        test_recipe:
          setup: ["Default clock; facility, importer; entry (declared_units 10) detained by FIRM alert; reconditioning requested (bond posted)."]
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Casablanca Sardines", facility_kind: "FOREIGN", country_code: "MA", ufi: "UFI-MA-2312" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Gulf Shrimp Co", account_code: "IMP-2312" }
              as: PlatformAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-SAR-01", product_risk_class: "LOW", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 10, unit_value_cents: 100, port_code: "US-HOU" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn_id: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_id}" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { ent_id: $.data.id }
            - call: "POST /registry/import-alerts"
              payload: { scope_type: "FIRM", facility_id: "${fac_id}", reason: "Decomposition" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /registry/entries/${ent_id}/request-reconditioning"
              payload: { lots: [ { quantity: 10, unit_value_cents: 100 } ] }
              as: Importer
              as_user_id: "${imp_id}"
          trigger:
            - call: "POST /registry/entries/${ent_id}/record-reconditioning-outcome"
              payload: { units_passed: 6, units_failed: 3 }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNITS_ACCOUNTING_MISMATCH (http 422)"
            - "ImportEntry.${ent_id}: units_held == 10, units_released == 0, units_destroyed == 0, disposition_status == DETAINED (nothing moved)"

      - name: recall_terminate_below_threshold_then_at_threshold
        claim_type: aggregate_validation
        grounds:
          - calculations.recall_effectiveness
          - errors.ERR_EFFECTIVENESS_THRESHOLD_NOT_MET
          - errors.ERR_UNITS_ACCOUNTING_MISMATCH
        distinguishing_aspect: "CLASS_III termination needs effectiveness_pct >= 90.0: at 89.0 the terminate fails 422 ERR_EFFECTIVENESS_THRESHOLD_NOT_MET; an effectiveness delta larger than quantity_outstanding fails ERR_UNITS_ACCOUNTING_MISMATCH; at exactly 90.0 termination succeeds."
        test_recipe:
          setup:
            - "Default clock; DOMESTIC facility; recall (quantity_distributed 100) classified CLASS_III; 89 units recovered (outstanding 11, pct 89.0)"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Boulder Granola", facility_kind: "DOMESTIC", country_code: "US", ufi: "UFI-US-2313" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/recalls"
              payload: { facility_id: "${fac_id}", product_code: "PC-GRA-01", quantity_distributed: 100 }
              as: RecallCoordinator
              as_user_id: "rc-1"
              captures: { rec_id: $.data.id }
            - call: "POST /registry/recalls/${rec_id}/classify"
              payload: { classification: "CLASS_III" }
              as: RecallCoordinator
              as_user_id: "rc-1"
            - call: "POST /registry/recalls/${rec_id}/record-effectiveness"
              payload: { delta_recovered: 89, delta_corrected: 0, delta_destroyed: 0, consignees_contacted: 5, consignees_total: 5 }
              as: RecallCoordinator
              as_user_id: "rc-1"
          trigger:
            - call: "POST /registry/recalls/${rec_id}/terminate"
              payload: {}
              as: RecallCoordinator
              as_user_id: "rc-1"
              captures: { err_term: $.data.error_id }
            - call: "POST /registry/recalls/${rec_id}/record-effectiveness"
              payload: { delta_recovered: 12, delta_corrected: 0, delta_destroyed: 0, consignees_contacted: 0, consignees_total: 5 }
              as: RecallCoordinator
              as_user_id: "rc-1"
              captures: { err_delta: $.data.error_id }
            - call: "POST /registry/recalls/${rec_id}/record-effectiveness"
              payload: { delta_recovered: 1, delta_corrected: 0, delta_destroyed: 0, consignees_contacted: 0, consignees_total: 5 }
              as: RecallCoordinator
              as_user_id: "rc-1"
              captures: { pct: $.data.effectiveness_pct }
            - call: "POST /registry/recalls/${rec_id}/terminate"
              payload: {}
              as: RecallCoordinator
              as_user_id: "rc-1"
              captures: { st: $.data.status }
          assert:
            - "at effectiveness_pct 89.0: err_term == ERR_EFFECTIVENESS_THRESHOLD_NOT_MET (http 422)"
            - "delta exceeding outstanding (12 > 11): err_delta == ERR_UNITS_ACCOUNTING_MISMATCH (http 422)"
            - "after the +1 round: pct == 90.0 (round_half_up(100 x 90 / 100, 1)) and the final terminate succeeds: st == TERMINATED (90.0 >= 90.0, inclusive)"
            - "quantity_outstanding == 10 after the +1 round and the invariant 90 + 0 + 0 + 10 == 100 holds"
      - name: renewal_window_closed_for_registered_facility
        claim_type: temporal_validation
        grounds:
          - calculations.facility_registration_expiry
          - errors.ERR_RENEWAL_WINDOW_CLOSED
        distinguishing_aspect: "Pure temporal failure (the §1.8 priority instance covered state-beats-temporal on a SUSPENDED facility): a facility that stayed REGISTERED into the grace period and past it (expiry sweep flips it EXPIRED at 2028-08-31) cannot renew at 2028-10-15T00:00:00Z — 422 ERR_RENEWAL_WINDOW_CLOSED."
        test_recipe:
          setup:
            - "Facility registered at default clock; clock advanced to 2028-10-15T00:00:00Z (past grace end 2028-09-30T00:00:00Z); facility is EXPIRED (sweep), version 2"
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Cusco Cafe", facility_kind: "FOREIGN", country_code: "PE", ufi: "UFI-PE-2314" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /registry/facilities/${fac_id}"
              payload: {}
              as: PlatformAdmin
              captures: { fac_v: $.data.version }
          trigger:
            - call: "POST /registry/facilities/${fac_id}/renew"
              payload: { expected_facility_version: "${fac_v}" }
              as: FacilityOwner
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RENEWAL_WINDOW_CLOSED (http 422) — state precondition (EXPIRED is renewable) passes, the temporal window fails"
            - "Facility.${fac_id}.registration_status remains EXPIRED"

      - name: inspection_on_domestic_facility_returns_foreign_required
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=8]
          - errors.ERR_INSPECTION_REQUIRES_FOREIGN_FACILITY
        distinguishing_aspect: "Foreign-facility inspections apply only to FOREIGN facilities: scheduling against a DOMESTIC facility fails 422 ERR_INSPECTION_REQUIRES_FOREIGN_FACILITY."
        test_recipe:
          setup: ["Default clock; DOMESTIC facility exists."]
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Fresno Raisin Packers", facility_kind: "DOMESTIC", country_code: "US", ufi: "UFI-US-2315" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /registry/inspections"
              payload: { facility_id: "${fac_id}", scheduled_start_at: "2026-10-10T09:00:00Z", scheduled_end_at: "2026-10-10T17:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INSPECTION_REQUIRES_FOREIGN_FACILITY (http 422)"

