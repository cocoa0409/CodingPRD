      - name: calc_aggregation_qualified_lot_count_every_clause_at_its_inclusive_bound
        claim_type: aggregation
        grounds:
          - calculations.qualified_resin_lot_count
          - calculations.qualified_resin_lot_count.variants.RELEASE_GATE
          - calculations.qualified_resin_lot_count.variants.UNBLOCK_SWEEP
        distinguishing_aspect: "Six lots each fail exactly one qualification clause so the release gate counts zero and blocks the order, and a seventh lot sitting on EVERY inclusive bound at once (delta-E 1.50, melt 2.50, regrind 30.00, expiry equal to today, available_kg equal to the 19.000 threshold) counts as one and unblocks it."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, so clock_date(now) is 2026-08-01."
            - "ProductModel PM-CVI requires resin_grade HDPE_XL, additive UV12, master colour SEAFOAM with max_color_delta_e 1.50, melt index 2.50..6.00, max_regrind_pct 30.00, nominal_charge_kg 20.000 and charge_tolerance_pct 5.00, so the minimum qualifying mass is round(20.000 * 0.95, 3) = 19.000."
            - "Five lots exist, each a single-clause near miss: LOT-CVI-GRADE is MDPE, LOT-CVI-ADD carries UV11, LOT-CVI-COLOR is TIDEWATER at delta-E 1.51, LOT-CVI-MELT sits at 6.01 and LOT-CVI-REGRIND at 30.01. Every other attribute on all five is fully qualifying."
            - "Warehouse WH-CVA is empty, so its posture is NORMAL and no order can be diverted to BLOCKED_WAREHOUSE."
          setup_api_calls:
            - *cvA_clock
            - call: "POST /product-models"
              payload: { model_code: "PM-CVI", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_XL", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 20.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 1.2000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 150000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-CVI-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 20.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - *cvA_wh
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVI-GRADE", resin_grade: "MDPE", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 200, received_kg: 50.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_grade: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVI-ADD", resin_grade: "HDPE_XL", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV11", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 200, received_kg: 50.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_add: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVI-COLOR", resin_grade: "HDPE_XL", melt_index_g10min: 4.00, color_code: "TIDEWATER", color_delta_e: 1.51, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 200, received_kg: 50.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_color: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVI-MELT", resin_grade: "HDPE_XL", melt_index_g10min: 6.01, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 200, received_kg: 50.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_melt: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVI-REGRIND", resin_grade: "HDPE_XL", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 30.01, cost_cents_per_kg: 200, received_kg: 50.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_regrind: $.data.id }
            - call: "POST /production-orders"
              payload: { order_code: "PO-CVI", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 1 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
          trigger:
            - call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVI-MASS", resin_grade: "HDPE_XL", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 200, received_kg: 18.999, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_mass: $.data.id }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVI-EDGE", resin_grade: "HDPE_XL", melt_index_g10min: 2.50, color_code: "TIDEWATER", color_delta_e: 1.50, additive_package_code: "UV12", regrind_pct_by_mass: 30.00, cost_cents_per_kg: 200, received_kg: 19.000, expires_on: "2026-08-01" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_edge: $.data.id }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "the release returns 200 but ProductionOrder.${po}.status == BLOCKED_RESIN with blocked_reason == NO_QUALIFIED_RESIN_LOT — the RELEASE_GATE variant counted 0 qualifying lots among the five near misses and did not raise an error"
            - "each of the five near misses fails exactly one conjunct: grade is an exact enum match so MDPE never qualifies for an HDPE_XL model; UV11 fails the additive equality; TIDEWATER at delta-E 1.51 fails BOTH branches of the colour OR because 1.51 > 1.50; 6.01 is outside the inclusive 2.50..6.00 band; 30.01 exceeds max_regrind_pct 30.00"
            - "after LOT-CVI-MASS is created the order is STILL BLOCKED_RESIN with blocked_reason NO_QUALIFIED_RESIN_LOT — available_kg 18.999 is one thousandth below the threshold round(20.000 * (1 - 5.00/100), 3) = 19.000, and the threshold is rounded to 3 dp BEFORE the >= comparison"
            - "after LOT-CVI-EDGE is created ProductionOrder.${po}.status == READY_TO_SCHEDULE with blocked_reason == null — the UNBLOCK_SWEEP variant counted 1"
            - "LOT-CVI-EDGE qualifies while sitting on every inclusive bound simultaneously: colour differs from SEAFOAM but color_delta_e == max_color_delta_e 1.50, melt_index == min_melt_index_g10min 2.50, regrind_pct_by_mass == max_regrind_pct 30.00, expires_on == the clock date 2026-08-01 and available_kg == 19.000 exactly. Any one of those comparisons implemented as strict would leave the order blocked"
            - "the order lands in READY_TO_SCHEDULE and not BLOCKED_WAREHOUSE because WH-CVA holds nothing and its posture is NORMAL — the UNBLOCK_SWEEP variant's two destinations are distinguished by warehouse posture, not by the lot count"

