              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_CONTINUANCE_ALREADY_PENDING"
            - "ContinuanceRequest.${cont1}.status remains PENDING"

      - name: continuance_decide_twice_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_CONTINUANCE_NOT_PENDING
        distinguishing_aspect: "A decided continuance is terminal: re-deciding a GRANTED request is a 409 ERR_CONTINUANCE_NOT_PENDING and does not create a second superseding hearing."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Docketed case with a master hearing and a continuance already GRANTED."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master_late
            - call: "POST /eoir/continuance-requests"
              payload: { case_id: "${case_id}", hearing_id: "${h_l}", reason_code: "EVIDENCE_GATHERING" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { cont1: $.data.id }
            - call: "POST /eoir/continuance-requests/${cont1}/decide"
              payload: { decision: "GRANTED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
          trigger:
            - call: "POST /eoir/continuance-requests/${cont1}/decide"
              payload: { decision: "DENIED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_CONTINUANCE_NOT_PENDING"
            - "GET /eoir/hearings?case_id=${case_id} returns exactly 2 rows (one CONTINUED, one SCHEDULED) — the rejected re-decision created nothing"

      - name: venue_motion_decide_twice_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_VENUE_MOTION_NOT_PENDING
        distinguishing_aspect: "A denied venue motion is terminal: the second decide call is a 409 ERR_VENUE_MOTION_NOT_PENDING."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Docketed case at court A; court B exists; the venue motion to B was already DENIED."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-VB", name: "Venue B", city: "Duluth", annual_completion_goal: 100, detained_daily_hearing_capacity: 1 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_b: $.data.id }
            - *c_judge
            - *c_case_eng
            - *c_assign
            - call: "POST /eoir/venue-motions"
              payload: { case_id: "${case_id}", destination_court_id: "${court_b}", reason: "respondent moved" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { vm1: $.data.id }
            - call: "POST /eoir/venue-motions/${vm1}/decide"
              payload: { decision: "DENIED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
          trigger:
            - call: "POST /eoir/venue-motions/${vm1}/decide"
              payload: { decision: "GRANTED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_VENUE_MOTION_NOT_PENDING"
            - "ChangeOfVenueMotion.${vm1}.status remains DENIED and Case.${case_id}.court_id remains ${court_id}"

      - name: motion_decide_twice_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_MOTION_NOT_PENDING
        distinguishing_aspect: "A denied motion to reopen is terminal: the second decide call is a 409 ERR_MOTION_NOT_PENDING and the in-absentia order stands."
        test_recipe:
          setup: ["Logical clock 2026-09-01. In-absentia order entered; an EXCEPTIONAL_CIRCUMSTANCES motion filed 2026-09-06 and already DENIED."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_hearing_ns
            - *c_notice
            - *c_clock_ns
            - *c_noshow
            - *c_get_dec
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/motions-to-reopen"
              payload: { case_id: "${case_id}", decision_id: "${ia_dec}", basis: "EXCEPTIONAL_CIRCUMSTANCES" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { mot1: $.data.id }
            - call: "POST /eoir/motions-to-reopen/${mot1}/decide"
              payload: { decision: "DENIED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
          trigger:
            - call: "POST /eoir/motions-to-reopen/${mot1}/decide"
              payload: { decision: "GRANTED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_MOTION_NOT_PENDING"
            - "MotionToReopen.${mot1}.status remains DENIED and Decision.${ia_dec}.status remains ISSUED"

      - name: detained_daily_capacity_reached
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DETAINED_DAILY_CAPACITY_REACHED
          - calculations.detained_scheduling_rules
        distinguishing_aspect: "Detained prioritization is capacity-bounded per court-day: with cap 1, the first detained hearing on 2026-09-10 succeeds and the second (adjacent, no judge conflict) is rejected purely on the aggregate daily count."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Court with detained_daily_hearing_capacity 1; one judge; two DETAINED PRO_SE English cases docketed."]
          setup_api_calls:
            - *c_clock
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-DC", name: "Detained Cap Court", city: "Laredo", annual_completion_goal: 100, detained_daily_hearing_capacity: 1 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_id: $.data.id }
            - *c_judge
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "DC-1", respondent_full_name: "R One", custody_status: "DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { d1: $.data.id }
            - call: "POST /eoir/cases/${d1}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { d1_v2: $.data.version }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "DC-2", respondent_full_name: "R Two", custody_status: "DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { d2: $.data.id }
            - call: "POST /eoir/cases/${d2}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { d2_v2: $.data.version }
          trigger:
            - call: "POST /eoir/hearings"
              payload: { case_id: "${d1}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-10T10:00:00Z", is_remote: true, expected_case_version: "${d1_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_d1: $.data.id }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${d2}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-10T10:30:00Z", is_remote: true, expected_case_version: "${d2_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "the first detained hearing on 2026-09-10 succeeds (Hearing.${h_d1} created)"
            - "the second fails 409 ERR_DETAINED_DAILY_CAPACITY_REACHED (count 1 >= cap 1 on that UTC date) even though the judge is free at 10:30"

      - name: motion_against_rescinded_decision_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DECISION_NOT_RESCINDABLE
        distinguishing_aspect: "Rescindability is a per-decision state check that runs after linkage: after a reopen grant rescinded decision D1 and the case later returned to IN_ABSENTIA via a second no-show (fresh decision D2), a motion naming the RESCINDED D1 is a 409 ERR_DECISION_NOT_RESCINDABLE while D2 remains rescindable."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Case reaches IN_ABSENTIA (decision D1, 2026-09-05T11:00); its notice is marked defective; a NOTICE_DEFECTIVE motion is granted (D1 RESCINDED, case back to CALENDAR, auto hearing at 2026-09-26T11:00); the case then reaches IN_ABSENTIA a SECOND time via no-show at the auto hearing (decision D2, 2026-09-26T11:30)."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_hearing_ns
            - *c_notice
            - *c_clock_ns
            - *c_noshow
            - *c_get_dec
            - call: "POST /eoir/notices/${notice_id}/mark-defective"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/motions-to-reopen"
              payload: { case_id: "${case_id}", decision_id: "${ia_dec}", basis: "NOTICE_DEFECTIVE" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { mot1: $.data.id }
            - call: "POST /eoir/motions-to-reopen/${mot1}/decide"
              payload: { decision: "GRANTED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-26T11:30:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "GET /eoir/hearings"
              payload: { case_id: "${case_id}", status: "SCHEDULED" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_auto: "$.data[0].id" }
            - call: "POST /eoir/notices"
              payload: { hearing_id: "${h_auto}", service_method: "MAIL", served_at: "2026-09-06T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/hearings/${h_auto}/record-no-show"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
          trigger:
            - call: "POST /eoir/motions-to-reopen"
              payload: { case_id: "${case_id}", decision_id: "${ia_dec}", basis: "NOTICE_DEFECTIVE" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
            - call: "GET /eoir/decisions"
              payload: { case_id: "${case_id}", status: "ISSUED" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { d2: "$.data[0].id" }
          assert:
            - "the motion naming rescinded D1 fails 409 ERR_DECISION_NOT_RESCINDABLE"
            - "Decision.${ia_dec}.status == RESCINDED (from the earlier grant) and the fresh decision ${d2} is ISSUED with issued_at == \"2026-09-26T11:30:00Z\""
            - "Case.${case_id}.status == IN_ABSENTIA and exactly one motion (the granted ${mot1}) exists for the case"


  # ===========================================================================
  - section: errors
    instances:

      - name: not_found_sweep_read_endpoints
        claim_type: violation_to_error
        grounds:
          - errors.ERR_COURT_NOT_FOUND
          - errors.ERR_HEARING_NOT_FOUND
          - errors.ERR_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "Every single-resource GET resolves its id or returns the pinned 404: entity-specific codes for Court and Hearing, and the generic ERR_NOT_FOUND exactly for LegalOrientationProgram, CaseReassignment, and DocketReview."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /eoir/courts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { e1: $.data.error_id }
            - call: "GET /eoir/hearings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { e2: $.data.error_id }
            - call: "GET /eoir/orientation-programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { e3: $.data.error_id }
            - call: "GET /eoir/case-reassignments/00000000-0000-4000-8000-000000000000"
