              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-ROOT", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}" }
              as: PlatformAdmin
              captures: { u_root_id: "$.data.id", prog_v2: "$.data.id" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-CHILD", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", parent_unit_id: "${u_root_id}" }
              as: PlatformAdmin
              captures: { u_child_id: "$.data.id", prog_v3: "$.data.id" }
          trigger:
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-BAD", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v3}", parent_unit_id: "${u_child_id}" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "the child unit created under the root exists and its parent_unit_id equals the root id, which is the cross-reference working"
            - "creating a third unit whose parent is the child is accepted, because a two level tree is not a cycle"
            - "creating a unit whose parent chain closes back onto itself returns ERR_SPEC_UNIT_CYCLE at status 409"
            - "a unit whose parent_unit_id names a non-existent unit is refused rather than silently treated as a root"

