              payload: { bench_code: "LAB_BENCH_7", window_start: "2026-09-03T09:00:00Z", window_end: "2026-09-03T17:00:00Z" }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { lb1: $.data.id }
          trigger:
            - call: "POST /device-models/${m2}/lab-bookings"
              payload: { bench_code: "LAB_BENCH_7", window_start: "2026-09-03T17:00:00Z", window_end: "2026-09-03T20:00:00Z" }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { err_adjacent: $.data.error_id }
            - call: "POST /device-models/${m2}/lab-bookings"
              payload: { bench_code: "LAB_BENCH_7", window_start: "2026-09-04T16:00:00Z", window_end: "2026-09-04T18:00:00Z" }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { err_buffer: $.data.error_id }
            - call: "POST /device-models/${m2}/lab-bookings"
              payload: { bench_code: "LAB_BENCH_7", window_start: "2026-09-04T17:00:00Z", window_end: "2026-09-04T20:00:00Z" }
              as: TvManufacturer
              as_user_id: "${mfr}"
              captures: { lb2: $.data.id }
          assert:
            - "err_adjacent == ERR_BENCH_OVERLAP: start == prior window_end conflicts under closed-interval semantics (forbidden adjacency)"
            - "err_buffer == ERR_BENCH_OVERLAP: 2026-09-04T16:00 is inside the 24h post-buffer of window_end 2026-09-03T17:00"
            - "Booking ${lb2} succeeds (201): 2026-09-04T17:00 is exactly 24h after the prior window_end — the buffered windows touch but do not intersect under <=/>= on the closed buffered bounds (buffer end exclusive of the next window start)"
            - "DeviceModel.${m2}.cert_status == LAB_TESTING after the successful booking"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: slot_conservation_across_resplit_under_standing_penalty
        grounds:
          - calculations.ad_slot_split
          - concurrency_rules[grant-resplit-stale-grant]
          - entities.AdSlotGrant.fields.platform_slots
        distinguishing_aspect: |
          Conserved quantity: total ad slots. Forward action (create split) and
          compensating re-action (resplit after standing change) must leave
          publisher_slots + platform_slots == total_slots invariant: 1001 slots
          split 700/301 at 7000 bps, resplit to 650/351 at the SUSPENDED
          penalty of 6500 bps — sum unchanged at 1001 on both sides.
        test_recipe:
          setup:
            - "Clock default. Publisher P (ad bps 7000, GOOD), channel C PUBLISHED, grant G for 2026-09 total_slots 1001 (publisher 700 / platform 301)."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Inv Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Inv Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ad-slot-grants"
              payload: { channel_id: "${ch}", period: "2026-09", total_slots: 1001 }
              as: PlatformAdmin
              captures: { grant: $.data.id, grant_v: $.data.version }
            - call: "POST /publishers/${pub}/standing"
              payload: { to_standing: "SUSPENDED", reason: "audit" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ad-slot-grants/${grant}/resplit"
              payload: { expected_grant_version: "${grant_v}" }
              as: PlatformAdmin
          assert:
            - "Before resplit: AdSlotGrant.${grant} had publisher_slots 700 + platform_slots 301 == total_slots 1001"
            - "After resplit: publisher_slots == 650 (floor(1001 * 6500/10000) = floor(650.65)) and platform_slots == 351"
            - "650 + 351 == 1001 — INV-SLOT conserved across the compensating resplit"
            - "AdSlotGrant.${grant}.publisher_share_bps still == 7000 (snapshot at creation unchanged; the penalty applies only to the resplit computation)"

      - name: statement_money_conservation_across_post_finalize_refund
        grounds:
          - calculations.subscription_payout
          - calculations.statement_net_payout
          - state_machines.Subscription.ACTIVE_to_REFUNDED
        distinguishing_aspect: |
          Conserved quantity: billed subscription money — every cent is exactly
          partitioned into publisher payout plus platform fee across periods.
          Forward action: 10000-cent subscription billed and finalized in period
          2026-09 (payout 8000, fee 2000). Compensating action: refund in period
          2026-10 produces a negative base whose payout and fee exactly cancel
          period 1: cumulative base == 0, cumulative payout == 0, cumulative fee == 0.
        test_recipe:
          setup:
            - "Clock default 2026-09-01. Publisher P (GROSS_SHARE, ad bps 7000), channel C PUBLISHED, viewer V with subscription S price 10000 created in 2026-09. Statement 2026-09 generated and FINALIZED. Clock advanced to 2026-10-01."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Money Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Money Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /viewer-accounts"
              payload: { email: "mv@x.com" }
              as: PlatformAdmin
              captures: { vw: $.data.id }
            - call: "POST /subscriptions"
              payload: { channel_id: "${ch}", price_cents: 10000 }
              as: Viewer
              as_user_id: "${vw}"
              captures: { sub: $.data.id }
            - call: "POST /statements/generate"
              payload: { period: "2026-09" }
              as: PlatformAdmin
            - call: "GET /statements"
              payload: { publisher_id: "${pub}", period: "2026-09" }
              as: PlatformAdmin
              captures: { st1: "$.data[0].id" }
            - call: "POST /statements/${st1}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subscriptions/${sub}/refund"
              payload: {}
              as: PlatformAdmin
            - call: "POST /statements/generate"
              payload: { period: "2026-10" }
              as: PlatformAdmin
            - call: "GET /statements"
              payload: { publisher_id: "${pub}", period: "2026-10" }
              as: PlatformAdmin
              captures: { st2: "$.data[0].id" }
            - call: "POST /statements/${st2}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /statements/${st2}/settle"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Statement.${st1}: subscription_gross_cents == 10000, refund_cents == 0, sub_payout_cents == 8000, platform_sub_fee_cents == 2000 (8000 + 2000 == 10000)"
            - "Statement.${st2}: subscription_gross_cents == 0, refund_cents == 10000, sub_payout_cents == -8000, platform_sub_fee_cents == -2000 (compensating negatives)"
            - "Cumulative invariant: (10000 + 0 - 0 - 10000) == 0 == (8000 - 8000) == (2000 - 2000) — every billed cent partitioned across periods with zero drift"
            - "Publisher.${pub}.outstanding_balance_cents == 8000 after ${st2} finalizes (negative net 8000 accrues), and == 0 after the settle call"
