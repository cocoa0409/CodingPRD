            - call: "POST /staffing-shifts/${shift_id}/activate"
              payload: {}
              as: CommandCenterLead
              captures: { shift_status: $.data.status }
          assert:
            - "the first activate returns 409 and error_id == ERR_INVALID_STATE (Staff.${clear_1}.status was PROFICIENCY_VERIFIED)"
            - "after issue-credential Staff.${clear_1}.status == CREDENTIALED"
            - "the second activate returns 200 and StaffingShift.${shift_id}.status == ACTIVE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: r8_cutover_task_interval_overlap_on_resource
        grounds:
          - validations[priority=16]
          - errors[ERR_TEMPORAL_OVERLAP]
          - endpoints.POST_/facilities/{id}/cutover-tasks
        distinguishing_aspect: "Interval-semantics A (half-open [start, end) with a 30-minute handoff buffer on the facility's cutover timeline): a paper-backfill step planned to start 15 minutes before the prior step's end is rejected, while one starting exactly at the prior step's end is accepted because the buffer is zero and adjacency is allowed."
        test_recipe:
          setup:
            - "A program, facility and a single DOWNTIME_PREP cutover task planned 2026-11-30T22:00Z to 2026-11-30T23:00Z."
          setup_api_calls:
            - *clk
            - *prog
            - *fac
            - call: "POST /facilities/${fac_id}/cutover-tasks"
              payload: { task_class: "DOWNTIME_PREP", sequence_index: 1, planned_start_utc: "2026-11-30T22:00:00Z", planned_end_utc: "2026-11-30T23:00:00Z" }
              as: CutoverLead
              captures: { task_1: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_id}/cutover-tasks"
              payload: { task_class: "ORDER_RECONCILIATION", sequence_index: 2, planned_start_utc: "2026-11-30T22:45:00Z", planned_end_utc: "2026-11-30T23:30:00Z" }
              as: CutoverLead
              captures: { err_overlap: $.data.error_id }
            - call: "POST /facilities/${fac_id}/cutover-tasks"
              payload: { task_class: "ORDER_RECONCILIATION", sequence_index: 2, planned_start_utc: "2026-11-30T23:00:00Z", planned_end_utc: "2026-11-30T23:30:00Z" }
              as: CutoverLead
              captures: { task_adjacent: $.data.id }
          assert:
            - "the overlapping create returns 409 and error_id == ERR_TEMPORAL_OVERLAP"
            - "the adjacent create returns 201 and CutoverTask.${task_adjacent}.duration_minutes == 30"
            - "GET /facilities/${fac_id}/cutover-tasks returns exactly 2 tasks"

      - name: r8_staffing_shift_overlap_on_assigned_person
        grounds:
          - validations[priority=24]
          - errors[ERR_SHIFT_OVERLAP]
          - endpoints.POST_/staffing-shifts
        distinguishing_aspect: "Interval-semantics B (half-open [start, end) intervals scoped to one assigned person rather than to a facility timeline): a second shift for the same staffer overlapping the first is rejected, but a back-to-back shift starting exactly at the first shift's end is accepted; the overlap is per-person resource capacity, a different arithmetic scope from the facility cutover timeline."
        test_recipe:
          setup:
            - "A program and facility; one credentialled staffer with a shift scheduled 2026-09-03T06:00Z to 2026-09-03T12:00Z."
          setup_api_calls:
            - *clk
            - *prog
            - *fac
            - *dept
            - *trainer_seed
            - call: "POST /staffs/${trainer_id}/credentialed-trainers"
              payload: { application_code: "CLN", certification_level: "STANDARD", observation_hours: 8, expected_staff_version: "${trainer_v0}" }
              as: TrainingCoordinator
              captures: { tr_rec_id: $.data.id }
            - call: "POST /credentialed-trainers/${tr_rec_id}/certify"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /staffs/${clear_1}/training-assignments"
              payload: { curriculum_code: "CLN100", application_code: "CLN", required_hours: 40, due_utc: "2026-10-01T00:00:00Z" }
              as: TrainingCoordinator
              captures: { clear_1_ta: $.data.id }
            - call: "POST /training-assignments/${clear_1_ta}/log-hours"
              payload: { hours: 40 }
              as: TrainingCoordinator
            - call: "POST /training-assignments/${clear_1_ta}/complete"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /staffs/${clear_1}/proficiency-exams"
              payload: { application_code: "CLN", proctored_by_trainer_id: "${tr_rec_id}" }
              as: TrainingCoordinator
              captures: { clear_1_exam: $.data.id }
            - call: "POST /proficiency-exams/${clear_1_exam}/record-result"
              payload: { exam_score: 90 }
              as: CredentialedTrainer
              as_user_id: "${tr_rec_id}"
            - call: "POST /staffs/${clear_1}/issue-credential"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /staffing-shifts"
              payload: { staff_id: "${clear_1}", facility_id: "${fac_id}", support_role: "AT_THE_ELBOW", start_utc: "2026-09-03T06:00:00Z", end_utc: "2026-09-03T12:00:00Z" }
              as: CommandCenterLead
              captures: { shift_1: $.data.id }
          trigger:
            - call: "POST /staffing-shifts"
              payload: { staff_id: "${clear_1}", facility_id: "${fac_id}", support_role: "AT_THE_ELBOW", start_utc: "2026-09-03T11:00:00Z", end_utc: "2026-09-03T17:00:00Z" }
              as: CommandCenterLead
              captures: { err_overlap: $.data.error_id }
            - call: "POST /staffing-shifts"
              payload: { staff_id: "${clear_1}", facility_id: "${fac_id}", support_role: "AT_THE_ELBOW", start_utc: "2026-09-03T12:00:00Z", end_utc: "2026-09-03T18:00:00Z" }
              as: CommandCenterLead
              captures: { shift_2: $.data.id }
          assert:
            - "the overlapping shift returns 409 and error_id == ERR_SHIFT_OVERLAP"
            - "the back-to-back shift returns 201 and StaffingShift.${shift_2}.status == SCHEDULED"
            - "GET /staffing-shifts?staff_id=${clear_1} returns exactly 2 shifts"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: r9_reconcile_backfill_pair_preserves_order_balance
        grounds:
          - state_machines.PatientOrder.CONVERTED_to_RECONCILED
          - state_machines.PatientOrder.PAPER_BACKFILL_REQUIRED_to_RECONCILED
          - calculations.order_reconciliation_balance
          - entities.EhrImplementation.fields.order_reconciliation_balance
          - endpoints.POST_/patient-orders/{id}/reconcile
        distinguishing_aspect: "Conserved quantity A (an order-unit balance): a forward reconcile debits nothing net while a compensating paper backfill credits one unit; performing reconcile then backfill on the program leaves order_reconciliation_balance unchanged at 0.00 (0 + 1 - 1), demonstrating the ledger returns to its pre-pair value."
        test_recipe:
          setup:
            - "A program and a facility holding one converted LAB order."
          setup_api_calls:
            - *clk
            - *prog
            - *fac
            - call: "POST /facilities/${fac_id}/patient-orders"
              payload: { patient_mrn: "MRN-7001", order_type: "LAB", encounter_utc: "2026-08-29T00:00:00Z", legacy_charge_cents: 10000 }
              as: ConversionAnalyst
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /patient-orders/${order_id}/reconcile"
              payload: {}
              as: OrderReconciler
            - call: "GET /ehr-implementations/${prog_id}"
              payload: {}
              as: ImplementationDirector
              captures: { bal_after_forward: $.data.order_reconciliation_balance }
            - call: "POST /patient-orders/${order_id}/backfill-paper-order"
              payload: {}
              as: OrderReconciler
            - call: "GET /ehr-implementations/${prog_id}"
              payload: {}
              as: ImplementationDirector
              captures: { bal_after_pair: $.data.order_reconciliation_balance }
          assert:
            - "EhrImplementation.${prog_id}.order_reconciliation_balance is 0.00 before the pair"
            - "after the forward reconcile alone the balance is 1 (one net reconciled order)"
            - "after the compensating paper backfill the balance returns to 0"
            - "PatientOrder.${order_id}.paper_backfill_count == 1 and clinical_state == RECONCILED"

      - name: r9_trainer_certify_revoke_pair_preserves_net_trainer_count
        grounds:
          - state_machines.CredentialedTrainer.PENDING_OBSERVATION_to_CERTIFIED
          - state_machines.CredentialedTrainer.CERTIFIED_to_REVOKED
          - entities.EhrImplementation.fields.net_trainer_count
          - endpoints.POST_/credentialed-trainers/{id}/revoke
        distinguishing_aspect: "Conserved quantity B (a headcount, a different conserved type from the order-unit balance): one staffer certified twice and revoked twice leaves net_trainer_count unchanged at 0 (two forward certifications minus two compensating revocations), proving the trainer-count ledger nets to its starting value across the pair."
        test_recipe:
          setup:
            - "A program and one staffer with two trainer records, both certified."
          setup_api_calls:
            - *clk
            - *prog
            - *fac
            - *dept
            - *trainer_seed
            - call: "POST /staffs/${trainer_id}/credentialed-trainers"
              payload: { application_code: "CLN", certification_level: "STANDARD", observation_hours: 8, expected_staff_version: "${trainer_v0}" }
              as: TrainingCoordinator
              captures: { tr_a: $.data.id }
            - call: "POST /credentialed-trainers/${tr_a}/certify"
              payload: {}
              as: TrainingCoordinator
            - call: "GET /staffs/${trainer_id}"
              payload: {}
              as: TrainingCoordinator
              captures: { tv1: $.data.version }
            - call: "POST /staffs/${trainer_id}/credentialed-trainers"
              payload: { application_code: "CLN-ADV", certification_level: "ADVANCED", observation_hours: 12, expected_staff_version: "${tv1}" }
              as: TrainingCoordinator
              captures: { tr_b: $.data.id }
            - call: "POST /credentialed-trainers/${tr_b}/certify"
              payload: {}
              as: TrainingCoordinator
            - call: "GET /ehr-implementations/${prog_id}"
              payload: {}
              as: ImplementationDirector
              captures: { net_before: $.data.net_trainer_count }
          trigger:
            - call: "POST /credentialed-trainers/${tr_a}/revoke"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /credentialed-trainers/${tr_b}/revoke"
              payload: {}
              as: TrainingCoordinator
            - call: "GET /ehr-implementations/${prog_id}"
              payload: {}
              as: ImplementationDirector
              captures: { net_after: $.data.net_trainer_count }
          assert:
            - "EhrImplementation.${prog_id}.net_trainer_count == 2 after the two certifications"
            - "CredentialedTrainer.${tr_a}.status == REVOKED and CredentialedTrainer.${tr_b}.status == REVOKED"
            - "after both revocations EhrImplementation.${prog_id}.net_trainer_count returns to 0"
            - "the certify/revoke pair leaves net_trainer_count at its pre-pair value (0 before, 0 after)"
