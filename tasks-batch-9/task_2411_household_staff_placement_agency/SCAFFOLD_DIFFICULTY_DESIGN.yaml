      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: H. Belgrave
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      - call: POST /fee-schedules
        as: AgencyPrincipal
        payload:
          role_type: HOUSEKEEPER
          comp_band_floor_cents: 0
          fee_percent_bps: 1800
          guarantee_window_days: 60
          effective_from: '2026-01-01'
      - call: POST /role-requisitions
        as: PlacementConsultant
        payload:
          client_id: ${client_id}
          role_type: HOUSEKEEPER
          first_year_compensation_cents: 6500000
          schedule_pattern: FIVE_TWO
          live_in_required: false
        captures:
          req_id: $.data.id
      - call: POST /role-requisitions/${req_id}/scope
        as: PlacementConsultant
        payload:
          scope_note: Town house, no live-in.
      - call: POST /role-requisitions/${req_id}/finalize-scope
        as: PlacementConsultant
        payload:
          note: Scope agreed with the household.
      - call: POST /candidates
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          full_name: T. Marchetti
          contact_email: tm@mail.example
          primary_role_type: HOUSEKEEPER
          years_experience: 10
          live_in_willing: false
        captures:
          cand_id: $.data.id
      - call: POST /candidates/${cand_id}/reference-checks
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          principal_employer_name: Cadogan Family
          relationship_type: PRINCIPAL_EMPLOYER
          employment_start_month: 2023-01
          employment_end_month: 2023-12
          contact_email: cadogan@mail.example
        captures:
          ref1_id: $.data.id
      - call: POST /candidates/${cand_id}/reference-checks
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          principal_employer_name: Latimer Family
          relationship_type: PRINCIPAL_EMPLOYER
          employment_start_month: 2024-01
          employment_end_month: 2024-04
          contact_email: latimer@mail.example
          prior_reference_id: ${ref1_id}
        captures:
          ref2_id: $.data.id
      - call: POST /candidates/${cand_id}/reference-checks
        as: VettingSpecialist
        as_user: u_vet_1
        payload:
          principal_employer_name: Ellesmere Family
          relationship_type: PRINCIPAL_EMPLOYER
          employment_start_month: 2021-01
          employment_end_month: 2021-06
          contact_email: ellesmere@mail.example
        captures:
          ref3_id: $.data.id
      - call: POST /reference-checks/${ref1_id}/verify
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          outcome: VERIFIED
          verification_note: Spoke with the principal.
      - call: POST /reference-checks/${ref2_id}/verify
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          outcome: VERIFIED
          verification_note: Spoke with the principal.
      - call: POST /reference-checks/${ref3_id}/verify
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          outcome: DISPUTED
          verification_note: Dates contested by the family.
      - call: POST /candidates/${cand_id}/background-verifications
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          provider_reference: BV-2001
          scope_items:
          - IDENTITY
          - CRIMINAL
        captures:
          bgv_id: $.data.id
      - call: POST /background-verifications/${bgv_id}/record-result
        as: VettingSpecialist
        as_user: u_vet_2
        payload:
          result: CLEARED
          findings_note: No adverse findings.
      - call: GET /candidates/${cand_id}
        as: PlacementConsultant
        captures:
          screen: $.data.screening_score
          ready: $.data.placement_ready_score
      - call: POST /role-requisitions/${req_id}/trial-engagements
        as: PlacementConsultant
        payload:
          candidate_id: ${cand_id}
          engagement_type: WORKING_INTERVIEW
          start_at: '2026-08-11T09:00:00Z'
          end_at: '2026-08-11T15:00:00Z'
          day_rate_cents: 30000
        captures:
          trial_id: $.data.id
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-11T15:00:00Z'
      - call: POST /trial-engagements/${trial_id}/start
        as: PlacementConsultant
        payload:
          note: Household received the candidate.
      - call: POST /trial-engagements/${trial_id}/record-outcome
        as: PlacementConsultant
        payload:
          outcome: PASSED
          outcome_note: Household satisfied.
      - call: GET /role-requisitions/${req_id}
        as: PlacementConsultant
        captures:
          req_v: $.data.version
      trigger:
      - call: POST /placements
        as: PlacementConsultant
        payload:
          requisition_id: ${req_id}
          candidate_id: ${cand_id}
          start_date: '2026-09-01'
          base_salary_cents: 6000000
          guaranteed_bonus_cents: 300000
          accommodation_imputed_cents: 0
          overtime_allowance_cents: 200000
          expected_requisition_version: ${req_v}
        captures:
          err: $.data.error_id
      asserts:
      - GET /candidates/${cand_id} in setup returns screening_score == 70 and placement_ready_score == 75
      - the DISPUTED reference contributes 0 coverage months to both variants, so the 5-point gap between the variants
        is exactly 20 (CLEARED background) minus 15 (one DISPUTED row)
      - vetting_status == CLEARED and availability_status == ON_TRIAL at the moment of the trigger, so neither ERR_CANDIDATE_NOT_VETTED
        nor ERR_CANDIDATE_UNAVAILABLE can be the answer
      - the trial engagement booked in setup returned 201 - the SCREENING gate of 70 was satisfied with no margin
      - the trigger returns 422 with error_id == ERR_CANDIDATE_SCORE_BELOW_THRESHOLD
      - no Placement row exists for ${req_id} after the trigger and RoleRequisition.status is still TRIALING
- rule_id: combinatorial_formula
  instances:
  - name: final_fee_rounds_each_component_before_summing_mode_b
    grounds: calculations.placement_fee_computation variant FINAL (rounding applied per component, then summed); entities.Placement.base_salary_cents
      / guaranteed_bonus_cents / accommodation_imputed_cents / overtime_allowance_cents
    mode: b - order of rounding versus aggregation
    mechanism: 'FINAL rounds each of the four components at 2233 bps and then sums the four rounded figures. With
      components 4002500 / 3502500 / 2502500 / 4992500 every product ends in .25 of a cent, so each component loses
      a quarter cent: 893758 + 782108 + 558808 + 1114825 = 3349499, while rounding the 15000000 aggregate once gives
      3349500.'
    naive_implementation: Sum the four components first and round once, or round-half-up the sum of the unrounded
      per-component products.
    distinguishing_aspect: fee_cents is 3349499, one cent below the aggregate-then-round answer of 3349500, on a component
      split entirely different from the other fee instance.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
