          trigger:
            - { call: "POST /redemption-submissions", payload: { market_day_id: "${day}", token_ids: ["${t0}"] }, as: Vendor, as_user_id: "${vend}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TOKEN_FLAGGED (business_safety, priority 16) — NOT ERR_SUBMISSION_WINDOW_CLOSED (business_temporal, priority 22)"

      - name: forbidden_role_beats_not_found_on_approve
        grounds:
          - validations[priority=2]
          - validations[priority=5]
        distinguishing_aspect: |
          Category pair auth vs existence (third distinct pair): a BoothOperator calls approve on a
          NON-EXISTENT vendor id; authorization (priority 2) must win over existence (priority 5) — the server
          must not leak existence through role filtering.
        test_recipe:
          setup:
            - "Program and market exist; no vendor with id 00000000-0000-0000-0000-000000000000"
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "P", season_start: "2026-08-01T00:00:00Z", season_end: "2026-09-01T00:00:00Z", match_pool_budget_cents: 100000 }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /markets", payload: { program_id: "${prog}", name: "M", city: "C" }, as: ProgramAdmin, captures: { mkt: $.data.id } }
          trigger:
            - { call: "POST /vendors/00000000-0000-0000-0000-000000000000/approve", payload: {}, as: BoothOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (403, auth priority 2) — NOT ERR_NOT_FOUND (404, existence priority 5)"

