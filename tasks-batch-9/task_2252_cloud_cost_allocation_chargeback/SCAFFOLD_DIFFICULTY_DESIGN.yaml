  - rule_id: resource_temporal_overlap
    instances:
      - name: allocation_run_periods_half_open_adjacency_allowed
        grounds:
          - validations[priority=70].ERR_ALLOCATION_PERIOD_OVERLAP
          - entities.AllocationRun.fields.period_start
          - entities.AllocationRun.fields.period_end
          - entities.AllocationRun.fields.mode
        distinguishing_aspect: |
          Half-open [period_start, period_end) semantics keyed by (mode, scope_business_unit_id): a run starting
          exactly where the previous one ends is legal, a run straddling the boundary is not, and switching mode
          releases the constraint entirely. The 2026-08-01T00:00:00Z instant belongs to the later run only, so the
          adjacency case and the overlap case differ by nothing but which side of that instant they extend into.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One ACTIVE BusinessUnit (Ops BU); no scope is set on any run, so every run shares the same null scope key."
            - "One existing DRAFT CHARGEBACK run covering 2026-07-01T00:00:00Z..2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /finops/business-units"
              payload: { name: "Ops BU", cost_center_code: "CC-400", chargeback_enabled: true, headcount: 10 }
              as: PlatformAdmin
              captures: { bu_id: "$.data.id" }
            - call: "POST /finops/allocation-runs"
              payload: { mode: "CHARGEBACK", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { run_july_id: "$.data.id" }
          trigger:
            - call: "POST /finops/allocation-runs"
              payload: { mode: "CHARGEBACK", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { run_aug_id: "$.data.id" }
            - call: "POST /finops/allocation-runs"
              payload: { mode: "CHARGEBACK", period_start: "2026-07-15T00:00:00Z", period_end: "2026-08-15T00:00:00Z" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /finops/allocation-runs"
              payload: { mode: "CHARGEBACK", period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { run_june_id: "$.data.id" }
            - call: "POST /finops/allocation-runs"
              payload: { mode: "CHARGEBACK", period_start: "2026-07-31T23:59:59Z", period_end: "2026-08-01T00:00:00Z" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /finops/allocation-runs"
              payload: { mode: "SHOWBACK", period_start: "2026-07-15T00:00:00Z", period_end: "2026-08-15T00:00:00Z" }
              as: FinOpsAnalyst
              as_user_id: "analyst-1"
              captures: { run_showback_id: "$.data.id" }
          assert:
            - "The adjacency-after case (2026-08-01..2026-09-01) succeeds with 201: AllocationRun.${run_aug_id}.status == DRAFT"
            - "The straddling case (2026-07-15..2026-08-15) returns ERR_ALLOCATION_PERIOD_OVERLAP with HTTP 409 - it overlaps both the July run and the August run"
            - "The adjacency-before case (2026-06-01..2026-07-01) succeeds with 201: AllocationRun.${run_june_id}.status == DRAFT"
            - "The one-second-tail case (2026-07-31T23:59:59Z..2026-08-01T00:00:00Z) returns ERR_ALLOCATION_PERIOD_OVERLAP - a single overlapping instant is enough"
            - "The SHOWBACK case with the same straddling period succeeds: AllocationRun.${run_showback_id}.mode == SHOWBACK, because the constraint is keyed on mode"
            - "GET /finops/allocation-runs?mode=CHARGEBACK returns total_count == 3 (June, July, August)"

      - name: commitment_terms_closed_interval_with_twenty_four_hour_buffer
        grounds:
          - validations[priority=71].ERR_COMMITMENT_WINDOW_CONFLICT
          - entities.Commitment.fields.term_start
          - entities.Commitment.fields.term_end
          - entities.Commitment.fields.region
        distinguishing_aspect: |
          The opposite interval convention on a second entity, deliberately contrasted with the allocation-run rule:
          commitment terms are compared as closed intervals after a COMMITMENT_BUFFER_HOURS (24) pad is applied to
          both ends, so abutting terms that would be legal for runs are rejected here. term_start 2026-08-01 sits
          inside the raw term, 2026-08-02T00:00:00Z touches the padded end and is still rejected, and only
          2026-08-02T00:00:01Z clears it - while a different region escapes the rule at any date.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One PENDING SAVINGS_PLAN commitment in region us-east-1 with term 2026-06-30T00:00:00Z..2026-08-01T00:00:00Z, hourly_commit_cents 50; its padded window is 2026-06-29T00:00:00Z..2026-08-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /finops/commitments"
              payload: { commitment_type: "SAVINGS_PLAN", region: "us-east-1", term_start: "2026-06-30T00:00:00Z", term_end: "2026-08-01T00:00:00Z", hourly_commit_cents: 50, coverage_target_pct: 80.00, utilization_target_pct: 80.00 }
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { com_base_id: "$.data.id" }
          trigger:
            - call: "POST /finops/commitments"
              payload: { commitment_type: "SAVINGS_PLAN", region: "us-east-1", term_start: "2026-08-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", hourly_commit_cents: 50 }
              as: FinOpsController
              as_user_id: "controller-1"
            - call: "POST /finops/commitments"
              payload: { commitment_type: "SAVINGS_PLAN", region: "us-east-1", term_start: "2026-08-02T00:00:00Z", term_end: "2026-10-01T00:00:00Z", hourly_commit_cents: 50 }
              as: FinOpsController
              as_user_id: "controller-1"
            - call: "POST /finops/commitments"
              payload: { commitment_type: "SAVINGS_PLAN", region: "us-east-1", term_start: "2026-08-02T00:00:01Z", term_end: "2026-10-01T00:00:00Z", hourly_commit_cents: 50 }
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { com_ok_id: "$.data.id" }
            - call: "POST /finops/commitments"
              payload: { commitment_type: "SAVINGS_PLAN", region: "us-west-2", term_start: "2026-08-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", hourly_commit_cents: 50 }
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { com_west_id: "$.data.id" }
            - call: "POST /finops/commitments"
              payload: { commitment_type: "RESERVED_INSTANCE", region: "us-east-1", term_start: "2026-08-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z", hourly_commit_cents: 50 }
              as: FinOpsController
              as_user_id: "controller-1"
              captures: { com_ri_id: "$.data.id" }
          assert:
            - "The 2026-08-01T00:00:00Z start returns ERR_COMMITMENT_WINDOW_CONFLICT with HTTP 409 - inside the raw term"
            - "The 2026-08-02T00:00:00Z start also returns ERR_COMMITMENT_WINDOW_CONFLICT - it touches the padded end, and the interval is closed, so unlike allocation runs adjacency is not allowed"
            - "The 2026-08-02T00:00:01Z start succeeds with 201: Commitment.${com_ok_id}.status == PENDING and committed_capacity_cents == 36000"
            - "The us-west-2 case succeeds (Commitment.${com_west_id}) - the rule is keyed on region"
            - "The RESERVED_INSTANCE case in us-east-1 succeeds (Commitment.${com_ri_id}) - the rule is keyed on commitment_type"
            - "Commitment.${com_base_id} is unchanged and still PENDING after all five attempts"
  - rule_id: compensating_invariant
    instances:
      - name: reopen_then_recompute_preserves_allocated_equals_effective_identity
        grounds:
          - state_machines.AllocationRun.PUBLISHED_to_REOPENED
          - state_machines.AllocationRun.REOPENED_to_COMPUTED_FINAL
          - state_machines.ChargebackInvoice.ISSUED_to_VOIDED
