        distinguishing_aspect: "The optimistic-concurrency gate sits at priority 7, one step above the target's own state gate at priority 8: re-scoping a CLOSED event with the version captured at creation returns 412 ERR_STALE_VERSION, and only once the caller supplies the current version does the same call surface 409 ERR_EVENT_TERMINAL."
