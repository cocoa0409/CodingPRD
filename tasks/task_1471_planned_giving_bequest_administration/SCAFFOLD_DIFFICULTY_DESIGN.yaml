          setup:
            - "Donor D; 5% ACTIVE rate table"
            - "CGA for D (gift 10000000, 600bps, QUARTERLY, age 80, funding_month 2026-08) EXECUTED -> FUNDED -> ACTIVE with 80 payments @150000, total_scheduled 12000000; reserve balance 6570148 against booked target 7570148 -> posture RESERVE_DEFICIENT"
