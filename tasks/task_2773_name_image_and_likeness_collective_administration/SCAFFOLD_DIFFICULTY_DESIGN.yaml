            - "DealContract.${ic_id}.deliverable_value_total_cents == 200000"
            - "Deliverable.${del_individual_post_id}.payout_basis == STRICT_UNIT_BASIS"
            - "Deliverable.${del_individual_post_id}.payout_eligible_cents == 200000"
            - "Deliverable.${del_roster_post_id}.unit_value_cents == 200000 and Deliverable.${del_individual_post_id}.unit_value_cents == 200000, yet payout_eligible_cents differs by exactly 22222 cents."
            - "Deliverable.${del_roster_appearance_id}.payout_eligible_cents == 0 because its status is still PENDING."

  - rule_id: combinatorial_formula
    instances:

      - name: nra_treaty_ceiling_withholding_switch
        mode: a
        grounds:
          - calculations.calc_release_withholding
          - global_constants.NRA_STATUTORY_PCT
          - global_constants.TREATY_EXEMPT_CEILING_CENTS
          - entities.PaymentRelease.fields.withholding_basis
          - entities.Athlete.fields.tax_form_required
        distinguishing_aspect: |
          Mode (a): the input set of calc_release_withholding is filtered by an
          eligibility predicate on the requested amount. Two CONTRACT_ADVANCE
          releases one cent apart across the 300000-cent treaty ceiling take
          different branches — 300000 is inside the ceiling and withholds nothing,
          300001 falls out of the exemption entirely and withholds the full
          statutory 30 percent of the whole amount (90000), not 30 percent of the
          one-cent excess. Including or excluding the boundary release changes the
          result by 90000 cents.
        test_recipe:
          setup:
            - "A collective with 682470 cents of settled UNRESTRICTED net funds (gross 700000, fee 17530)."
            - "A NONRESIDENT_ALIEN athlete whose tax profile is patched to W8BEN with treaty_exempt_claimed true."
            - "One ACTIVE INDIVIDUAL contract worth exactly 600001 cents with funding_designation UNRESTRICTED, so the two advances 300000 + 300001 exactly exhaust total_value_cents and validation priority 37 is never violated."
            - "Both releases are CONTRACT_ADVANCE, so no Deliverable is involved and validation priorities 36, 45 and 22 do not apply."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Golden Bear NIL", institution_name: "California Institution", institution_ipeds_code: "003300", home_state_code: "CA", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T1", tier_name: "Bronze", annual_dues_cents: 25000, benefit_rank: 1 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Nora Nra-Funder", email: "nora@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 700000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: CollectiveDirector
              captures: { contrib_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Ivan Import", portal_user_id: "ath-ivan", sport: "BASEBALL", class_year: 2027, tax_person_kind: "NONRESIDENT_ALIEN" }
              as: ComplianceOfficer
              captures: { ath_id: $.data.id }
            - call: "PATCH /nil/athletes/${ath_id}/tax-profile"
              payload: { taxpayer_doc_on_file: "W8BEN", treaty_exempt_claimed: true }
              as: ComplianceOfficer
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 600001, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z", funding_designation: "UNRESTRICTED" }
              as: CollectiveDirector
              captures: { dc_id: $.data.id }
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-submissions"
              payload: { state_law_citation: "CA-AB131", association_rule_citation: "NCAA-2024-12.5" }
              as: CollectiveDirector
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-decisions"
              payload: { decision: "ACCEPT" }
              as: InstitutionReviewer
            - call: "POST /nil/deal-contracts/${dc_id}/activation"
              payload: {}
              as: CollectiveDirector
            - call: "GET /nil/deal-contracts/${dc_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { dc_ver1: $.data.version }
          trigger:
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", release_kind: "CONTRACT_ADVANCE", requested_amount_cents: 300000, expected_deal_contract_version: "${dc_ver1}" }
              as: TreasuryOfficer
              as_user_id: "treasury-1"
              captures: { rel1_id: $.data.id }
            - call: "GET /nil/deal-contracts/${dc_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { dc_ver2: $.data.version }
            - call: "POST /nil/payment-releases"
              payload: { deal_contract_id: "${dc_id}", release_kind: "CONTRACT_ADVANCE", requested_amount_cents: 300001, expected_deal_contract_version: "${dc_ver2}" }
              as: TreasuryOfficer
              as_user_id: "treasury-1"
              captures: { rel2_id: $.data.id }
          assert:
            - "PaymentRelease.${rel1_id}.withholding_basis == NONE"
            - "PaymentRelease.${rel1_id}.withholding_amount_cents == 0"
            - "PaymentRelease.${rel1_id}.net_payable_cents == 300000"
            - "PaymentRelease.${rel2_id}.withholding_basis == NRA_STATUTORY"
            - "PaymentRelease.${rel2_id}.withholding_amount_cents == 90000"
            - "PaymentRelease.${rel2_id}.net_payable_cents == 210001"
            - "Athlete.${ath_id}.tax_year_gross_paid_cents == 600001"
            - "Athlete.${ath_id}.tax_year_withheld_cents == 90000"
            - "Athlete.${ath_id}.tax_form_required == FORM_1042_S"
            - "DealContract.${dc_id}.released_total_cents == 600001"
            - "DealContract.${dc_id}.payment_status == FULLY_PAID"
            - "DealContract.${dc_id}.lifecycle_status == ACTIVE because the contract has no Deliverable rows, so the COMPLETED bubble-up does not fire."
            - "A one-cent change to the second request (300000 instead of 300001) would move withholding_amount_cents from 90000 to 0, a 90000-cent swing from including versus excluding one boundary member of the withholding input set."

      - name: payout_share_floor_before_late_penalty_order_pinned
        mode: b
        grounds:
          - calculations.calc_deliverable_payout_eligible
          - global_constants.LATE_PENALTY_PCT
          - determinism_conventions.rounding
          - entities.Deliverable.fields.late_flag
        distinguishing_aspect: |
          Mode (b): the formula composes two non-commuting operations and the
          scaffold pins their order. The mandated order is share-floor first, then
          the 15 percent late penalty on the floored share:
          floor(333333*200000/300000) = 222222, then 222222 - round_half_up(222222*15/100)
          = 222222 - 33333 = 188889. The rejected order — penalty on the contract
          value first, then the floor — gives
          floor((333333 - round_half_up(333333*15/100)) * 200000 / 300000)
          = floor(283333*200000/300000) = 188888. The assertion is the resulting
          one-cent difference, which no reordered implementation can reproduce.
        test_recipe:
          setup:
            - "A collective with 1958000 cents of settled ROSTER_POOL net funds (gross 2000000, fee 42000)."
            - "Three ENROLLED FOOTBALL athletes with default roster_weight 1 and Athlete.sequence_no 1, 2, 3."
            - "One EQUAL_SHARE roster batch B1 over a 1000000-cent pool, so the second athlete's ROSTER_SHARE contract is worth exactly 333333."
            - "That contract is ACTIVE with two deliverables (SOCIAL_POST 200000 and APPEARANCE 100000), so deliverable_value_total_cents is 300000."
            - "The logical clock is advanced to 2026-09-15 and the SOCIAL_POST is submitted with performed_at 2026-09-01, which is after its 2026-08-20 due_at, so late_flag becomes true."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Scarlet Share Collective", institution_name: "Ohio Institution", institution_ipeds_code: "004400", home_state_code: "OH", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T4", tier_name: "Platinum", annual_dues_cents: 400000, benefit_rank: 4 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Paula Pool", email: "paula@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 2000000, source_kind: "ONE_TIME_GIFT", designation: "ROSTER_POOL", processor_outcome: "APPROVE" }
              as: CollectiveDirector
              captures: { contrib_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Dee Delta", portal_user_id: "ath-delta", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath1_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Eli Echo", portal_user_id: "ath-echo", sport: "FOOTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath2_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Fay Foxtrot", portal_user_id: "ath-foxtrot", sport: "FOOTBALL", class_year: 2029 }
              as: CollectiveDirector
              captures: { ath3_id: $.data.id }
            - call: "GET /nil/collectives/${col_id}"
              payload: {}
              as: CollectiveDirector
              captures: { col_ver: $.data.version }
            - call: "POST /nil/deal-contracts/roster-allocations"
