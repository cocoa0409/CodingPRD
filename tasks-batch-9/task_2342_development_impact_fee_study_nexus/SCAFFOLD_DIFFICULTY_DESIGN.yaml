              as: NexusAnalyst
              as_user_id: "analyst-1"
              captures: { comp_parks_id: $.data.id }
            - call: "POST /nexus-components"
              payload: { fee_study_id: "${study_b_id}", facility_category_id: "${cat_parks_id}", horizon_start_year: 2026, horizon_end_year: 2030, projected_new_dwelling_units: 1200, projected_new_nonres_sqft: 0, demand_units_per_dwelling: 2.5000, demand_units_per_1000_nonres_sqft: 0.0000, planned_facility_cost_cents: 500000000, planned_growth_share_bp: 8000, planned_capacity_demand_units: 3500, planned_other_funding_cents: 50000000, existing_tax_credit_per_unit_cents: 15000 }
