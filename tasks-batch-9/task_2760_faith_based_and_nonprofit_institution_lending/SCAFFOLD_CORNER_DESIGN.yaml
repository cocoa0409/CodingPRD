        claim_type: cross_entity
        excluded_because:
          difficulty_instance: pledge_lapse_cascade_flags_pledge_advance_application_for_revision
          rationale: "The cross-entity cascade Pledge ACTIVE -> LAPSED -> campaign OPEN -> UNDERPERFORMING -> PLEDGE_ADVANCE application UNDERWRITING -> REVISION_REQUESTED is already asserted end to end, including the maturity gate that keeps the campaign OPEN below 90% pledged."

  - section: calculations
