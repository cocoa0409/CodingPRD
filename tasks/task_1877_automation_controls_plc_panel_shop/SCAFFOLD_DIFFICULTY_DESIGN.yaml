              as: QAManager
              captures: { c_ov: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "PS-10", component_class: "POWER_SUPPLY", unit_cost_cents: 30000, lead_time_days: 10, sccr_ka: 10, heat_dissipation_w: 40 }
              as: QAManager
