  # ---------------------------------------------------------------- rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: ballot_draft_submit_recall_cycle
        grounds:
          - state_machines.Ballot.DRAFT_to_SUBMITTED
          - state_machines.Ballot.SUBMITTED_to_DRAFT
          - state_machines.Ballot.SUBMITTED_to_VERIFIED
          - state_machines.Pairing.BALLOT_SUBMITTED_to_BALLOT_RELEASED
        distinguishing_aspect: |
          Cyclic machine on Ballot (SUBMITTED -> DRAFT recall loop) with mirrored cyclic
          reverts on Pairing — distinct entity from the Tournament parallel-axes instance.
          The cycle is observable: after recall, both ballot and pairing return to their
          pre-submit states, and a second submit succeeds.
        test_recipe:
          setup:
            - "Tournament (prelim_round_count 2) with DEBATE/CX/VARSITY division; schools A-D with 1 confirmed entry each; school E with 2 committed judges; all schools CONFIRMED; locked; round 1 (2026-08-12 14:00-15:30) paired -> (A1,B1) and (C1,D1), both staffed with E judges; ballots open (pairings BALLOT_RELEASED)."
