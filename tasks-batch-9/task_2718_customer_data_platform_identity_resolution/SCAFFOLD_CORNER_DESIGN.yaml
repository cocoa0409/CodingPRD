        distinguishing_aspect: "resume is conditional on the CURRENT consent state, not on the state captured at dispatch: after the only audience member opts out, the resume recomputes an audience of zero and is refused with 422 ERR_EMPTY_AUDIENCE while the activation stays PAUSED and the quota stays refunded."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem and one PROMOTED batch of a single fully valid record with an EMAIL/MARKETING OPT_IN signal."
            - "One ACTIVE EMAIL Destination (daily_hash_quota 300, min_audience_size 1, min_match_rate 0.10) and one APPROVED Segment with an Activation dispatched to it, so 1 hash is consumed."
            - "A later EMAIL OPT_OUT capture cascades the activation to PAUSED with paused_reason CONSENT_WITHDRAWN and refunds the hash."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
