        claim_type: weighted_scoring
        grounds: ["calculations.job_family_risk_score", "entities.JobFamily.fields.family_headcount", "entities.JobFamily.fields.risk_tier"]
        distinguishing_aspect: "One tiny high-risk job (position_risk 84, 1 incumbent) beside one large low-risk job (position_risk 40, 20 incumbents) must weight by incumbent_count: (84*1 + 40*20) / 21 is 42.0952, plus the SCREENING premium 12 rounds to 54 and bands MEDIUM. A plain per-position average would give 62 + 12 = 74 and band HIGH, so both the number and the tier catch the wrong roll-up."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; StateRule CA with floor 132000 (so 1.15x is 151800)."
            - "AuditProject in FIELDWORK with one JobFamily holding exactly two Positions and no interviews at all, so both are PENDING and the family scores under SCREENING."
            - "Position A: annual 5500000 (weekly 105769, below the floor -> salary_risk 30), avg_weekly_hours 47 (hours_risk 14), primary_duty_pct 0.0 (duty_risk clamped at 40) -> position_risk 84, incumbent_count 1."
