            - "Consumer.${consumer_id}.consent_status == NOT_REQUIRED"
            - "Consumer.${consumer_id}.collection_status == ACTIVE"
            - "Consumer.${consumer_id}.version == 1"
            - "GET /brokers/${broker_id}/audit-events?event_type=CONSENT_CHANGED reports total_count == 0"

      - name: inquiry_close_attempted_from_open_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.RegulatorInquiry.transitions.RESPONDED_to_CLOSED
          - validations.priority_24.ERR_INQUIRY_INVALID_STATE
        distinguishing_aspect: >
          CLOSED is reachable only from RESPONDED, so closing an OPEN inquiry must return
          ERR_INQUIRY_INVALID_STATE at HTTP 409 — the check is on the state machine and must fire
          before the adequacy_verdict check that produces ERR_RESPONSE_INADEQUATE.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, one DataBroker, and one OPEN RegulatorInquiry with response_due_at 2026-10-01T00:00:00Z and adequacy_verdict UNRATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /regulator-inquiries"
              payload: { broker_id: "${broker_id}", scope_note: "Produce evidence of your deletion request handling for the current registration period.", response_due_at: "2026-10-01T00:00:00Z" }
              as: Regulator
              as_user_id: "regulator-ca"
              captures: { inquiry_id: $.data.id }
          trigger:
            - call: "POST /regulator-inquiries/${inquiry_id}/close"
              payload: {}
              as: Regulator
              as_user_id: "regulator-ca"
              expect_error: { error_id: ERR_INQUIRY_INVALID_STATE, http_status: 409 }
          assert:
            - "the response carries data.error_id == ERR_INQUIRY_INVALID_STATE with HTTP 409"
            - "the response does not carry data.error_id == ERR_RESPONSE_INADEQUATE"
            - "RegulatorInquiry.${inquiry_id}.status == OPEN"
            - "RegulatorInquiry.${inquiry_id}.adequacy_verdict == UNRATED"
            - "RegulatorInquiry.${inquiry_id}.responded_at == null"

      - name: deny_from_received_moves_the_broker_request_counters
        claim_type: side_effect_execution
        grounds:
          - state_machines.DeletionRequest.transitions.RECEIVED_to_DENIED
          - entities.DataBroker.fields.request_open_count
          - entities.DataBroker.fields.request_terminated_count
        distinguishing_aspect: >
          Denial is a ledger-sync side effect on the broker: request_open_count must drop from 1 to
          0 and request_terminated_count must rise from 0 to 1 while request_intake_total stays 1
          and request_completed_count stays 0 — a denied request is terminated, never completed.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, one DataBroker, one CA Consumer, and one DeletionRequest of that consumer in RECEIVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:deny0001deny0001", state_code: "CA", source_label: "OWNERSHIP_FEED_D", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { consumer_id: $.data.id, consumer_v1: $.data.version }
            - call: "POST /deletion-requests"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_id}", intake_channel: "EMAIL", requested_scope: "DELETE_ALL", expected_consumer_version: "${consumer_v1}" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /deletion-requests/${req_id}/deny"
              payload: { denial_reason_code: "EXEMPT_RECORD" }
              as: PrivacyReviewer
              as_user_id: "reviewer-alpha"
          assert:
            - "the response returns HTTP 200"
            - "DeletionRequest.${req_id}.status == DENIED"
            - "DeletionRequest.${req_id}.denial_reason_code == EXEMPT_RECORD"
            - "DataBroker.${broker_id}.request_intake_total == 1"
            - "DataBroker.${broker_id}.request_open_count == 0"
            - "DataBroker.${broker_id}.request_terminated_count == 1"
            - "DataBroker.${broker_id}.request_completed_count == 0"
            - "GET /brokers/${broker_id}/audit-events?event_type=DELETION_DENIED reports total_count == 1"

      - name: registration_rejected_returns_to_draft_on_disclosure_revision
        claim_type: valid_transition
        grounds:
          - state_machines.Registration.transitions.REJECTED_to_DRAFT
        excluded_because:
          difficulty_instance: registration_reject_to_draft_revision_cycle_reassesses_both_fee_variants
          rationale: >
            The §1.8 non_linear_state_machine instance already drives SUBMITTED -> REJECTED ->
            DRAFT -> SUBMITTED -> ACCEPTED and asserts revision_count plus both fee variants across
            the loop, which subsumes the plain cyclic-transition claim.

      - name: consumer_collection_and_consent_dimensions_are_independent
        claim_type: valid_transition
        grounds:
          - complexity_profile.state_machine_shape_parallel
          - state_machines.Consumer.collection_dimension
          - state_machines.Consumer.consent_dimension
        excluded_because:
          difficulty_instance: consumer_collection_and_consent_dimensions_advance_independently
          rationale: >
            The §1.8 instance already advances the two Consumer dimensions against each other and
            asserts the full combined-state matrix, so a separate parallel-shape probe would repeat
            it verbatim.

      - name: request_join_cascades_down_to_consumer_and_suppression
        claim_type: side_effect_execution
        grounds:
          - state_machines.DeletionRequest.transitions.EXECUTING_to_COMPLETED
        excluded_because:
          difficulty_instance: final_ack_completes_request_purges_consumer_mints_suppression_supersedes_sibling
          rationale: >
            The §1.8 transitive_cascade instance already asserts all four cascade links from the
            final ack — request COMPLETED, consumer PURGED, SuppressionEntry minted, sibling request
            SUPERSEDED — together with the pinned audit-event ordering.

  - section: calculations
    instances:
      - name: assurance_evidence_points_capped_at_four_lands_exactly_on_the_pass_threshold
        claim_type: constants_applied
        grounds:
          - calculations.identity_assurance_score.constants.MAX_EVIDENCE_POINTS_COUNTED
          - calculations.identity_assurance_score.constants.ATTEMPT_PASS_THRESHOLD
        distinguishing_aspect: >
          A TWO_DATA_POINTS attempt offering 5 evidence points with document_quality_score 50 must
          credit only 4 points: 30.00 + 7.5*4 + 0.2*50 = 70.00, exactly ATTEMPT_PASS_THRESHOLD, so
          the outcome is PASS. Crediting all 5 points yields 77.50 and hides the boundary; treating
          the threshold as strict turns the PASS into INCONCLUSIVE.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, one DataBroker, one CA Consumer, and one DeletionRequest of that consumer with intake_channel DIRECT_PORTAL in RECEIVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:cap00001cap00001", state_code: "CA", source_label: "OWNERSHIP_FEED_D", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { consumer_id: $.data.id, consumer_v1: $.data.version }
            - call: "POST /deletion-requests"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_id}", intake_channel: "DIRECT_PORTAL", requested_scope: "DELETE_ALL", expected_consumer_version: "${consumer_v1}" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /deletion-requests/${req_id}/verification-attempts"
              payload: { method: "TWO_DATA_POINTS", evidence_points_count: 5, document_quality_score: 50 }
              as: IntakeAgent
              captures: { attempt_id: $.data.id }
          assert:
            - "the response returns HTTP 201"
            - "VerificationAttempt.${attempt_id}.variant_applied == FRAUD_WEIGHTED"
            - "VerificationAttempt.${attempt_id}.raw_score == 70.00"
            - "VerificationAttempt.${attempt_id}.fraud_penalty_applied == 0.00"
            - "VerificationAttempt.${attempt_id}.assurance_score == 70.00"
            - "VerificationAttempt.${attempt_id}.outcome == PASS"
            - "DeletionRequest.${req_id}.identity_assurance_score == 70.00"
            - "DeletionRequest.${req_id}.verification_attempt_count == 1"
            - "DeletionRequest.${req_id}.failed_attempt_count == 0"
            - "DeletionRequest.${req_id}.status == VERIFICATION_PENDING"

      - name: assurance_fraud_penalty_uses_prior_fails_observed_before_scoring
        claim_type: correct_result
        grounds:
          - calculations.identity_assurance_score.constants.FRAUD_PENALTY_PER_PRIOR_FAIL
          - calculations.identity_assurance_score.outcome_bands
          - state_machines.DeletionRequest.transitions.VERIFICATION_PENDING_to_VERIFICATION_PENDING
        distinguishing_aspect: >
          Across three attempts the penalty must use failed_attempt_count as observed before the
          attempt being scored: 45.50 FAIL, then 45.50 - 12.00 = 33.50 FAIL, then a strong GOVT_ID
          attempt worth 93.50 raw drops to 93.50 - 24.00 = 69.50 and lands INCONCLUSIVE, one
          hundredth below the pass line. Counting the attempt's own failure would give 57.50, and
          counting no prior failures would give 93.50 PASS.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, one DataBroker, one CA Consumer, and one DeletionRequest of that consumer with intake_channel DIRECT_PORTAL in RECEIVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:frd00001frd00001", state_code: "CA", source_label: "OWNERSHIP_FEED_D", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { consumer_id: $.data.id, consumer_v1: $.data.version }
            - call: "POST /deletion-requests"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_id}", intake_channel: "DIRECT_PORTAL", requested_scope: "DELETE_ALL", expected_consumer_version: "${consumer_v1}" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /deletion-requests/${req_id}/verification-attempts"
              payload: { method: "TWO_DATA_POINTS", evidence_points_count: 1, document_quality_score: 40 }
              as: IntakeAgent
              captures: { attempt_one_id: $.data.id }
            - call: "POST /deletion-requests/${req_id}/verification-attempts"
              payload: { method: "TWO_DATA_POINTS", evidence_points_count: 1, document_quality_score: 40 }
              as: IntakeAgent
              captures: { attempt_two_id: $.data.id }
            - call: "POST /deletion-requests/${req_id}/verification-attempts"
              payload: { method: "GOVT_ID", evidence_points_count: 3, document_quality_score: 80 }
              as: IntakeAgent
              captures: { attempt_three_id: $.data.id }
          assert:
            - "VerificationAttempt.${attempt_one_id}.raw_score == 45.50 with fraud_penalty_applied == 0.00, assurance_score == 45.50 and outcome == FAIL"
            - "VerificationAttempt.${attempt_two_id}.raw_score == 45.50 with fraud_penalty_applied == 12.00, assurance_score == 33.50 and outcome == FAIL"
            - "VerificationAttempt.${attempt_three_id}.raw_score == 93.50 with fraud_penalty_applied == 24.00, assurance_score == 69.50 and outcome == INCONCLUSIVE"
            - "DeletionRequest.${req_id}.verification_attempt_count == 3"
            - "DeletionRequest.${req_id}.failed_attempt_count == 2"
            - "DeletionRequest.${req_id}.identity_assurance_score == 69.50"
            - "DeletionRequest.${req_id}.status == VERIFICATION_PENDING"

      - name: disclosure_completeness_counts_optional_categories_at_declared_weights
        claim_type: correct_result
        grounds:
          - calculations.disclosure_completeness_score.constants.CATEGORY_WEIGHTS
          - calculations.disclosure_completeness_score.constants.MIN_CONTENT_CHARS
          - calculations.filing_fee_assessment.constants.CATEGORY_SURCHARGE_CENTS
        distinguishing_aspect: >
          All six categories filed at full length must sum to exactly 100.00 — the two optional
          categories contribute their declared 12.00 and 8.00 and are not ignored — and the
          PROVISIONAL_AT_SUBMIT fee must be 40000 + 20500 = 60500 cents, the base plus every
          per-category surcharge with no sensitive multiplier.
