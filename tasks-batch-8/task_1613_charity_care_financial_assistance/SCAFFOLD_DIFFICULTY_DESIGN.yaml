  # =================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: writeoff_reverse_pair_conserves_account_balance
        grounds:
          - state_machines.AccountAdjustment
          - state_machines.DiscountDetermination.FINAL_to_REVERSED
          - entities.PatientAccount.fields.adjusted_balance_cents
        distinguishing_aspect: |
          Conserved quantity = per-account adjusted_balance_cents. Invariant:
          adjusted_balance_cents == patient_responsibility_cents - sum(POSTED WRITE_OFF amounts).
          Posting a 75% write-off (750000 on responsibility 1000000) then reversing the determination must
          restore adjusted_balance_cents to exactly 1000000 — the forward/compensating pair leaves zero drift.
        test_recipe:
          setup:
            - "ACTIVE policy FAP-2026; account resp 1000000; STANDARD application APPROVED via FINAL determination (TAX_RETURN 3750000 => 75.00) covering the account; WRITE_OFF 750000 posted"
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /charity-care/policies"
              payload: { policy_code: "FAP-2026", fpl_base_cents: 1500000, fpl_increment_cents: 500000, full_discount_max_fpl_pct: 200, partial_discount_max_fpl_pct: 300, partial_discount_floor_pct: 50.0, asset_limit_cents: 2500000, retroactive_window_days: 240, notification_period_days: 120, eca_notice_days: 30, doc_response_days: 30, presumptive_partial_score_threshold: 70.0, presumptive_full_score_threshold: 90.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { pol_id: $.data.id }
            - call: "POST /charity-care/policies/${pol_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /charity-care/patients"
              payload: { full_name: "Conserve Connie", date_of_birth: "1986-07-07", ssn_last4: "1717", mrn: "MRN-CONS-1" }
              as: FinancialCounselor
              captures: { pat: $.data.id }
            - call: "POST /charity-care/accounts"
              payload: { patient_id: "${pat}", encounter_date: "2026-01-10", total_charges_cents: 1000000, insurance_paid_cents: 0 }
              as: BillingAdministrator
              captures: { acc: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_id: "${pat}", screening_source: "STANDARD", reported_annual_income_cents: 3750000, reported_liquid_assets_cents: 0 }
              as: FinancialCounselor
              captures: { app: $.data.id }
            - call: "POST /charity-care/applications/${app}/members"
              payload: { full_name: "Conserve Connie", relationship: "SELF", age: 39 }
              as: FinancialCounselor
              captures: { mem: $.data.id }
            - call: "POST /charity-care/applications/${app}/submit"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/begin-review"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/documents"
              payload: { doc_type: "TAX_RETURN", period_start: "2025-01-01", period_end: "2025-12-31", amount_cents: 3750000, household_member_id: "${mem}" }
              as: FinancialCounselor
              captures: { d1: $.data.id }
            - call: "POST /charity-care/documents/${d1}/verify"
              payload: {}
              as: FinancialCounselor
            - call: "POST /charity-care/applications/${app}/documents"
              payload: { doc_type: "IDENTITY", period_start: "2026-01-01", period_end: "2026-01-01", amount_cents: 0, household_member_id: "${mem}" }
              as: FinancialCounselor
              captures: { d2: $.data.id }
            - call: "POST /charity-care/documents/${d2}/verify"
              payload: {}
              as: FinancialCounselor
            - call: "GET /charity-care/applications/${app}"
              as: FinancialCounselor
              captures: { app_v: $.data.version }
            - call: "POST /charity-care/determinations"
              payload: { application_id: "${app}", basis: "VERIFIED_APPLICATION", covered_account_ids: ["${acc}"], expected_application_version: "${app_v}" }
              as: AssistanceReviewer
              captures: { det: $.data.id }
            - call: "POST /charity-care/determinations/${det}/finalize"
              payload: {}
              as: AssistanceReviewer
            - call: "GET /charity-care/accounts/${acc}"
              as: BillingAdministrator
              captures: { acc_v: $.data.version }
            - call: "POST /charity-care/accounts/${acc}/adjustments"
              payload: { determination_id: "${det}", expected_account_version: "${acc_v}" }
              as: BillingAdministrator
              captures: { adj: $.data.id }
          trigger:
            - call: "POST /charity-care/determinations/${det}/reverse"
              payload: { reason: "post-payment audit" }
              as: ComplianceOfficer
          assert:
            - "after posting: AccountAdjustment.${adj}.amount_cents == 750000 was observed (75.00% of 1000000)"
            - "after reversal: AccountAdjustment.${adj}.status == REVERSED"
            - "PatientAccount.${acc}.adjusted_balance_cents == 1000000 exactly — forward + compensating pair conserves the balance"
            - "PatientAccount.${acc}.amount_outstanding_cents == 1000000"

      - name: report_reversal_recompute_cycle_conserves_filed_totals
        grounds:
