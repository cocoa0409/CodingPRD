        distinguishing_aspect: |
          Category pair business_safety vs business_constraint (distinct from
          the state-vs-fiscal instance): a create violating both a stale waiver
          (72) and a full window (90) MUST return ERR_WAIVER_STALE.
        test_recipe:
          setup:
            - "Weekday 2026-08-04; window capacity 30 filled exactly by a party-30 session (waiver covers 30)"
            - "Manager then bumps waiver_text via /config, raising current_waiver_version to 2 and staling the first waiver; a second 1-name waiver signed under v1 is also stale"
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 650, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager, captures: { pol_id: $.data.id } }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_id: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_id}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /farm/field-day-windows/${w_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["P1","P2","P3","P4","P5","P6","P7","P8","P9","P10","P11","P12","P13","P14","P15","P16","P17","P18","P19","P20","P21","P22","P23","P24","P25","P26","P27","P28","P29","P30"] }, as: Anonymous, captures: { wv_big: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_big}", party_size: 30, container_count: 0, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_fill: $.data.id } }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Solo", signer_email: "solo@x.com", party_member_names: ["Solo"] }, as: Anonymous, captures: { wv_solo: $.data.id } }
            - { call: "POST /farm/seasons/${s_id}/config", payload: { waiver_text: "WAIVER-V2" }, as: FarmManager }
          trigger:
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_solo}", party_size: 1, container_count: 0, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_WAIVER_STALE (business_safety, priority 72) — NOT ERR_WINDOW_CAPACITY_FULL (business_constraint, priority 90), even though booked_slots 30 + 1 > 30 also holds"
            - "HTTP status == 422"

