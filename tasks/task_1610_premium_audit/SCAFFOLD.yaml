    path: "/certificates/{id}/verify"
    description: "Verify a certificate (coverage flag must match policy line; window must intersect audit period)"
    roles: [Auditor]
    code: 200
    input: []
    output: CertificateOfInsurance
    side_effects: ["status -> VERIFIED", "exposure included_dollars recomputed", "AuditWorkOrder.total_premium_base_dollars recomputed"]
  - method: POST
    path: "/certificates/{id}/reject"
    description: "Reject a certificate with a reason"
    roles: [Auditor]
    code: 200
    input: [reason]
    output: CertificateOfInsurance
    side_effects: ["status -> REJECTED; rejection_reason set", "exposure included_dollars recomputed", "AuditWorkOrder.total_premium_base_dollars recomputed"]

  # --- AuditResult / Dispute ---
  - method: GET
    path: "/audit-results/{id}"
    description: "Get an audit result"
    roles: [Insured, Auditor, AuditManager, Underwriter, BillingClerk]
    code: 200
    input: []
    output: AuditResult
    side_effects: []
  - method: POST
    path: "/audit-results/{id}/disputes"
    description: "Insured files a dispute against an ISSUED result (30-day window)"
    roles: [Insured]
    code: 201
    input: [grounds]
    output: Dispute
    side_effects: ["Dispute FILED", "result -> DISPUTED", "work order -> DISPUTED", "AuditWorkOrder.version increments"]
  - method: GET
    path: "/audit-results/{id}/disputes"
    description: "List disputes of a result (FK reverse reachability)"
    roles: [Insured, Auditor, AuditManager, Underwriter]
    code: 200
    input: []
    output: Dispute[]
    side_effects: []
  - method: GET
    path: "/audit-results/{id}/billing-transactions"
    description: "List billing transactions of a result (FK reverse reachability)"
    roles: [Insured, AuditManager, Underwriter, BillingClerk]
    code: 200
    input: []
    output: BillingTransaction[]
    side_effects: []
  - method: GET
    path: "/disputes/{id}"
    description: "Get a dispute"
    roles: [Insured, AuditManager, Underwriter]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: POST
    path: "/disputes/{id}/start-review"
    description: "Start reviewing a dispute (SoD: reviewer != result issuer)"
    roles: [AuditManager]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> UNDER_REVIEW", "reviewed_by_user_id = caller"]
  - method: POST
    path: "/disputes/{id}/uphold"
    description: "Uphold a dispute: supersedes result, cancels its billings, spawns a REAUDIT work order"
    roles: [AuditManager]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> UPHELD", "result -> SUPERSEDED", "result's open billings -> CANCELLED", "work order -> SUPERSEDED_BY_REAUDIT", "new REAUDIT work order created SELECTED"]
  - method: POST
    path: "/disputes/{id}/overrule"
    description: "Overrule a dispute: result and work order return to their billed states"
    roles: [AuditManager]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> OVERRULED", "result -> ISSUED", "work order -> BILLED or ESTIMATED_BILLED by variant"]

  # --- Billing ---
  - method: GET
    path: "/billing-transactions/{id}"
    description: "Get a billing transaction"
    roles: [Insured, AuditManager, Underwriter, BillingClerk]
    code: 200
    input: []
    output: BillingTransaction
    side_effects: []
  - method: POST
    path: "/billing-transactions/{id}/record-payment"
    description: "Record a payment (invoice) or credit application (return premium); overpayment rejected"
    roles: [BillingClerk]
    code: 200
    input: [amount_cents]
    output: BillingTransaction
    side_effects: ["paid_cents += amount_cents", "status -> PAID (invoice) or APPLIED (credit) when paid_cents == amount_cents"]

  # --- ModRevision ---
  - method: POST
    path: "/mod-revisions/{id}/apply"
    description: "Apply a mod revision to the policy (experience modification impact)"
    roles: [Underwriter]
    code: 200
    input: []
    output: ModRevision
    side_effects: ["status -> APPLIED", "Policy.experience_mod_factor = revised_mod_factor", "Policy.version increments"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, bad enum, bad date ordering, negative amount, undeclared field, GL policy with mod != 1.00, WC mod outside [0.75, 1.50], minimum premium above estimated premium" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_FORBIDDEN_SCOPE, http: 403, condition: "Entity-backed caller outside its scope: Insured touching another policy's graph; Auditor mutating children of a work order not assigned to them" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempting both sides of a controlled step: noncompliance marker approving the estimate; result issuer reviewing/upholding/overruling its dispute" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "Policy id does not exist" }
  - { id: ERR_AUDITOR_NOT_FOUND, http: 404, condition: "Auditor id does not exist" }
  - { id: ERR_CLASS_CODE_NOT_FOUND, http: 404, condition: "ClassificationCode id does not exist (path or FK input)" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "AuditWorkOrder id does not exist" }
  - { id: ERR_RECORDS_REQUEST_NOT_FOUND, http: 404, condition: "RecordsRequest id does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "AuditAppointment id does not exist" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "PayrollAllocation id does not exist" }
  - { id: ERR_SUB_EXPOSURE_NOT_FOUND, http: 404, condition: "SubcontractorExposure id does not exist" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "CertificateOfInsurance id does not exist" }
  - { id: ERR_AUDIT_RESULT_NOT_FOUND, http: 404, condition: "AuditResult id does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "Dispute id does not exist" }
  - { id: ERR_BILLING_NOT_FOUND, http: 404, condition: "BillingTransaction id does not exist" }
  - { id: ERR_MOD_REVISION_NOT_FOUND, http: 404, condition: "ModRevision id does not exist" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Transition not permitted from the resource's current state, including terminal-state lockdown and close preconditions" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_work_order_version does not match current AuditWorkOrder.version (OCC)" }
  - { id: ERR_APPOINTMENT_OUTSIDE_WINDOW, http: 409, condition: "scheduled_start not within (audit_period_end, audit_period_end + 60 days]" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED, http: 409, condition: "Dispute filed after result.issued_at + 30 days" }
  - { id: ERR_APPOINTMENT_OVERLAP, http: 409, condition: "Half-open overlap with another SCHEDULED/CONFIRMED appointment of the same auditor" }
  - { id: ERR_ALLOCATION_PERIOD_OVERLAP, http: 409, condition: "Closed-interval overlap with a non-REJECTED allocation of the same class code on the same work order (shared boundary day conflicts)" }
  - { id: ERR_OPEN_RECORDS_REQUESTS, http: 409, condition: "submit-draft while a RecordsRequest is OPEN or OVERDUE" }
  - { id: ERR_DRAFT_ALLOCATIONS_PENDING, http: 409, condition: "issue-result while a PayrollAllocation is still DRAFT" }
  - { id: ERR_RESCHEDULE_LIMIT_EXCEEDED, http: 409, condition: "Appointment creation when no_show_count >= 2" }
  - { id: ERR_CERT_INSUFFICIENT_COVERAGE, http: 409, condition: "Certificate lacks the coverage flag required by the policy's coverage line" }
  - { id: ERR_CERT_WINDOW_INSUFFICIENT, http: 409, condition: "Certificate coverage interval disjoint from the audit period" }
  - { id: ERR_AUDITOR_TERRITORY_MISMATCH, http: 409, condition: "Assigned auditor's territory_states does not include the policy's state_code" }
  - { id: ERR_NO_NONCOMPLIANCE_BASIS, http: 409, condition: "mark-noncompliant with no OVERDUE records request on the work order" }
  - { id: ERR_DUPLICATE_RECORDS_REQUEST, http: 409, condition: "A non-terminal RecordsRequest of the same request_type already exists on the work order" }
  - { id: ERR_DUPLICATE_POLICY_NUMBER, http: 409, condition: "policy_number already in use" }
  - { id: ERR_DUPLICATE_CLASS_CODE, http: 409, condition: "(code, state_code, coverage_line) already exists" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment exceeds remaining balance (amount_cents - paid_cents) of the billing transaction" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Insured
    description: "The policyholder; acts on its own policy's audit graph (uploads certificates, confirms appointments, files disputes)"
    identity: "entity_backed:Policy"
    exclusive_operations: ["POST /audit-results/{id}/disputes", "POST /appointments/{id}/confirm (shared with Auditor)", "POST /subcontractor-exposures/{id}/certificates (shared with Auditor)"]
    shared_operations: ["GET endpoints for own policy graph (scoped by X-User-ID == Policy.id)"]
  - name: Auditor
    description: "Field auditor; performs records intake, appointments, allocations, certificate review, draft submission on assigned work orders only"
    identity: "entity_backed:Auditor"
    exclusive_operations: ["POST /audit-work-orders/{id}/appointments", "POST /audit-work-orders/{id}/payroll-allocations", "POST /audit-work-orders/{id}/subcontractor-exposures", "POST /audit-work-orders/{id}/submit-draft", "POST /records-requests/{id}/receive", "POST /appointments/{id}/complete", "POST /appointments/{id}/no-show", "POST /payroll-allocations/{id}/verify", "POST /payroll-allocations/{id}/reject", "POST /certificates/{id}/verify", "POST /certificates/{id}/reject"]
    shared_operations: ["POST /appointments/{id}/confirm", "POST /subcontractor-exposures/{id}/certificates", "GET endpoints"]
  - name: AuditManager
    description: "Audit operations manager; runs selection, assigns auditors, manages records requests, escalates non-compliance, issues results, reviews disputes, closes audits"
    identity: "opaque"
    exclusive_operations: ["POST /_clock/set_current_utc", "POST /auditors", "POST /audit-selection-runs", "POST /audit-work-orders/{id}/assign", "POST /audit-work-orders/{id}/records-requests", "POST /records-requests/{id}/waive", "POST /audit-work-orders/{id}/mark-noncompliant", "POST /audit-work-orders/{id}/approve-estimated", "POST /audit-work-orders/{id}/issue-result", "POST /audit-work-orders/{id}/close", "POST /disputes/{id}/start-review", "POST /disputes/{id}/uphold", "POST /disputes/{id}/overrule"]
    shared_operations: ["GET endpoints"]
  - name: Underwriter
    description: "Carrier underwriter; owns policies, classification codes, cancellations, and experience-mod application"
    identity: "opaque"
    exclusive_operations: ["POST /policies", "POST /policies/{id}/cancel", "POST /classification-codes", "POST /mod-revisions/{id}/apply"]
    shared_operations: ["GET endpoints"]
  - name: BillingClerk
    description: "Premium billing clerk; records payments and credit applications"
    identity: "opaque"
    exclusive_operations: ["POST /billing-transactions/{id}/record-payment"]
    shared_operations: ["GET endpoints"]
