              payload: { expected_campaign_version: "${camp_2_v}" }
              as: Scheduler
              captures: { c2_status: $.data.status }
            - call: "POST /mills/${mill_id}/campaigns/${camp_3}/commit"
              payload: { expected_campaign_version: "${camp_3_v} + 1" }
              as: Scheduler
              captures: { c3_err: $.data.error_id }
          assert:
            - "C2 touching C1 at the exact boundary commits: c2_status == COMMITTED (half-open semantics allow adjacency)"
            - "C3 genuinely overlapping C1 rejects: c3_err == ERR_CAMPAIGN_OVERLAP"
            - "C3 remains OPEN"

      - name: energy_event_adjacency_gap
        grounds:
          - validations[priority=15]
          - calculations.campaign_window_conflict
          - errors.ERR_EVENT_OVERLAP
        distinguishing_aspect: |
          EnergyEvent interval semantics differ from campaigns: a minimum gap
          of 15 minutes is required between a prior event's released_at and the
          next event's called_at — adjacency (gap == 0) is FORBIDDEN, and gap
          == exactly 15 minutes is allowed. Resource: mill grid interconnection.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. Mill."
            - "EV1 called 2026-09-09T12:00Z released 2026-09-09T14:00Z, activated and released."
            - "EV2 called 2026-09-09T14:10Z (gap 10 min < 15) — DECLARED."
            - "EV3 called 2026-09-09T14:15Z (gap exactly 15 min) — DECLARED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
