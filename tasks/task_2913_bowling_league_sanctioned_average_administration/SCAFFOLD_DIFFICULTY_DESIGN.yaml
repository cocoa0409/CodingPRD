            - "League.${lg_id}.total_weeks is still 0 and League.${lg_id}.status is still BYLAWS_ADOPTED after the rejection"
            - "the two-match request succeeds with 201 and creates exactly 2 Match rows on the same lane pair ${lp1_id}"
            - "weeks 1 and 2 touch at exactly 2026-08-12T03:00:00Z and do NOT conflict, because priority 27 compares half-open [starts_at, ends_at) windows"
            - "Match.${mt1_id}.status == DRAFT with home_points == 0.0, away_points == 0.0, home_team_handicap_per_game == 0 and away_team_handicap_per_game == 0"
