              as_user_id: "${u_id}"
            - call: "POST /interconnection-applications/${a1_id}/reserve-capacity"
              payload: {}
              as: UtilityPlanner
              as_user_id: "${u_id}"
            - call: "POST /interconnection-applications/${a1_id}/withdraw"
              payload: { withdrawal_reason: "Utility upgrade cost exceeded the phase budget." }
              as: SiteScreeningAnalyst
          assert:
            - "at screen time CandidateSite.${s1_id}.site_capital_commitment_usd == 0"
            - "after the application create it is 360000.00 (300 MW * 1200 USD/MW) while the application is still DRAFT"
            - "after the reservation it is 27305136.00 == 360000.00 + 26945136.00"
            - "InterconnectionApplication.${a1_id}.study_fee_usd == 360000.00 and network_upgrade_cost_usd == 26945136.00"
            - "after the withdrawal it is 0 again and InterconnectionApplication.${a1_id}.status == WITHDRAWN with reserved_mw == 0"
            - "Utility.${u_id}.reserved_capacity_mw == 0 and available_capacity_mw == 500.0 after the withdrawal"
            - "CandidateSite.${s1_id}.status == SCREENED throughout, and after the withdrawal energization_risk_tier == ON_TRACK (no live application, but available_capacity_mw 500.0 is not below the 300 MW target, so the AT_RISK branch does not fire)"
            - "SitingProgram.${p_id}.committed_load_mw == 0 and program_status == SCREENING throughout"

      - name: multi_level_cascade_from_one_request
        claim_type: cascading_side_effects
        grounds:
          - state_machines.CandidateSite.SCREENED_to_DISQUALIFIED
          - calculations.utility_capacity_ledger
        excluded_because:
          difficulty_instance: transitive_cascade / site_disqualification_releases_queue_and_retiers_sibling
          rationale: "The named §1.8 instance verifies the five-level chain end to end from a single disqualify call, which is exactly this layer's claim."

