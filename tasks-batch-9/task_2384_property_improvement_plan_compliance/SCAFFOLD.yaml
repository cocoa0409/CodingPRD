scenario: "2384. Property Improvement Plan Compliance (hotel owner and brand compliance): plan issuance following inspection or at transaction with scoped items, standards references and cost estimates, item prioritization across life safety, guest-facing and back-of-house work with deadlines by category, extension request submission with business justification and brand approval or denial, capital budgeting, financing and reserve fund draw coordination for the work, renovation execution with phased room closures and displacement revenue impact, brand inspection at completion with punch list and sign-off, non-completion consequences including default notice and franchise termination, disputes over scope reasonableness and cost"
domain_name: property-improvement-plan-compliance
api_prefix: /pip

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Fifteen peer entities linked by explicit foreign keys; no nesting in URL paths.
  # Every resource lives at /pip/<collection>/{id} and children are discovered
  # through filtered list endpoints, never through nested routes.

  state_machine_shape: cyclic
  # ExtensionRequest revision loop (SUBMITTED -> NEEDS_MORE_JUSTIFICATION -> SUBMITTED),
  # PunchListItem reopen loop (REMEDIATED -> OPEN -> REMEDIATED), PipItem deferral loop
  # (SCOPED -> DEFERRED_PENDING_EXTENSION -> SCOPED) and PipItem punch loop
  # (WORK_COMPLETE -> PUNCH_FAIL -> WORK_COMPLETE). PipPlan additionally carries two
  # independent state dimensions (status x dispute_state) on one row, and
  # PipPlan.status IN_EXECUTION -> READY_FOR_COMPLETION_INSPECTION is compound
  # (derived from the aggregate status of its PipItem children).

  relationship_patterns:
    - one_to_many          # PipPlan -> PipItem, RenovationPhase, BrandInspection, ScopeDispute, DefaultNotice
    - self_referential     # PipItem.predecessor_item_id -> PipItem.id (sequencing DAG)
    - cross_aggregate      # ReserveDraw joins Property (reserve corpus) with CapitalBudget and PipItem
    - many_to_many         # ContractorBooking is the junction of Contractor x RenovationPhase

  role_model: segregation_of_duties
  # The BrandManager user id that issues a PipPlan is barred from signing off its
  # COMPLETION inspection; the inspector user id assigned to a BrandInspection is the
  # only user id that may perform or sign off that inspection.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: FranchiseeAccount
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the franchisee entity
        constraints: "1..200 chars, required"
      - name: contact_email
        type: string
        source: input
        description: notice address for plan issuance and default notices
        constraints: "must contain '@', 1..200 chars"
      - name: portfolio_property_count
        type: integer
        source: computed
        description: count of Property rows whose franchisee_id equals this account id
        default: 0
      - name: standing
        type: enum
        source: computed
        description: >-
          cross-entity rollup of the franchisee's portfolio; TERMINATED_PORTFOLIO if any
          owned Property has compliance_posture == TERMINATED, else DEFAULT if any owned
          Property has compliance_posture == IN_DEFAULT, else WATCH if any owned Property
          has compliance_posture == AT_RISK, else GOOD
        default: GOOD
        constraints: "one of {GOOD, WATCH, DEFAULT, TERMINATED_PORTFOLIO}"

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: franchisee_id
        type: string
        source: input
        description: "FK -> FranchiseeAccount.id; the franchisee that holds the franchise agreement and whose id a FranchiseeOwner presents in X-User-ID"
        constraints: "required, must reference an existing FranchiseeAccount"
      - name: brand_code
        type: string
        source: input
        description: brand flag the property operates under
        constraints: "1..20 chars, required"
      - name: name
        type: string
        source: input
        description: property trade name
        constraints: "1..200 chars, required"
      - name: room_count
        type: integer
        source: input
        description: total keys in the property; denominator of the out-of-service ratio
        constraints: ">= 1, required"
      - name: adr_baseline_cents
        type: integer
        source: input
        description: baseline average daily rate in cents used for displacement revenue math
        constraints: ">= 0, required"
      - name: occupancy_baseline_pct
        type: number
        source: input
        description: baseline occupancy as a decimal fraction used for displacement revenue math
        constraints: "0 <= value <= 1, exactly 2 decimal places, required"
      - name: reserve_balance_cents
        type: integer
        source: input
        description: >-
          current FF&E reserve fund cash balance in cents; debited on ReserveDraw
          disbursement, credited on ReserveDraw reversal and on reserve contributions
        constraints: ">= 0, required at create"
      - name: minimum_retention_cents
        type: integer
        source: input
        description: contractual floor the reserve balance may never be drawn below
        constraints: ">= 0, required"
      - name: reserve_contributed_total_cents
        type: integer
        source: computed
        description: cumulative sum of all reserve contribution amounts credited after create
        default: 0
      - name: initial_reserve_balance_cents
        type: integer
        source: system
        description: reserve_balance_cents as supplied at create; immutable anchor for the reserve-corpus invariant
      - name: rooms_out_of_service_current
        type: integer
        source: computed
        description: sum of rooms_out_of_service over RenovationPhase rows of this property's plans whose status == ACTIVE
        default: 0
      - name: franchise_agreement_status
        type: enum
        source: computed
        description: >-
          ACTIVE at create; DEFAULT_NOTICED while any DefaultNotice on any of this
          property's plans has status == ISSUED; back to ACTIVE when every such notice
          is CURED; TERMINATED once a DefaultNotice escalates to termination
        default: ACTIVE
        constraints: "one of {ACTIVE, DEFAULT_NOTICED, TERMINATED}"
      - name: compliance_risk_score
        type: integer
        source: computed
        description: as_of_snapshot variant of calculations.compliance_risk_score, 0..100
        default: 100
      - name: compliance_posture
        type: enum
        source: computed
        description: posture derived from compliance_risk_score plus notice/termination overrides per calculations.compliance_posture_derivation
        default: COMPLIANT
        constraints: "one of {COMPLIANT, AT_RISK, IN_DEFAULT, TERMINATED}"
      - name: open_plan_count
        type: integer
        source: computed
        description: count of PipPlan rows of this property with status IN {ISSUED, OWNER_ACKNOWLEDGED, IN_EXECUTION, READY_FOR_COMPLETION_INSPECTION}
        default: 0

  - name: PipPlan
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property the improvement plan is issued against"
        constraints: "required"
      - name: trigger_type
        type: enum
        source: input
        description: event that caused the plan to be scoped
        constraints: "one of {POST_INSPECTION, TRANSACTION_CHANGE_OF_OWNERSHIP, RELICENSING}, required"
      - name: standards_edition
        type: string
        source: input
        description: brand standards manual edition pinned to this plan; item standards_reference values are read against it
        constraints: "1..40 chars, required"
      - name: status
        type: enum
        source: computed
        description: lifecycle dimension; evolves independently of dispute_state
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, OWNER_ACKNOWLEDGED, IN_EXECUTION, READY_FOR_COMPLETION_INSPECTION, COMPLETED, TERMINATED, WITHDRAWN}"
      - name: dispute_state
        type: enum
        source: computed
        description: >-
          scope-dispute dimension carried on the same row and evolving independently of
          status; DISPUTE_OPEN while any ScopeDispute of this plan has status == FILED,
          otherwise the terminal state of the most recently resolved dispute
        default: NONE
        constraints: "one of {NONE, DISPUTE_OPEN, DISPUTE_RESOLVED_UPHELD, DISPUTE_RESOLVED_REVISED, DISPUTE_RESOLVED_REMOVED}"
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the BrandManager that executed the issue transition; null while DRAFT
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant of the issue transition; null while DRAFT
      - name: life_safety_deadline_date
        type: string
        source: computed
        description: date(issued_at) + LIFE_SAFETY_DEADLINE_DAYS, ISO date; null while DRAFT
      - name: guest_facing_deadline_date
        type: string
        source: computed
        description: date(issued_at) + GUEST_FACING_DEADLINE_DAYS, ISO date; null while DRAFT
      - name: back_of_house_deadline_date
        type: string
        source: computed
        description: date(issued_at) + BACK_OF_HOUSE_DEADLINE_DAYS, ISO date; null while DRAFT
      - name: scope_item_count
        type: integer
        source: computed
        description: count of PipItem rows of this plan with status NOT IN {REMOVED_BY_DISPUTE, VOIDED}
        default: 0
      - name: brand_scoped_total_cents
        type: integer
        source: computed
        description: brand_scoped variant of calculations.plan_scope_cost
        default: 0
      - name: owner_claimed_total_cents
        type: integer
        source: computed
        description: owner_claimed variant of calculations.plan_scope_cost
        default: 0
      - name: funding_requirement_cents
        type: integer
        source: computed
        description: output of calculations.funding_requirement (per-item rounding then sum)
        default: 0
      - name: funding_gap_cents
        type: integer
        source: computed
        description: max(0, funding_requirement_cents - active CapitalBudget.total_authorized_cents); 0 when no active budget exists
        default: 0
      - name: overdue_item_count
        type: integer
        source: computed
        description: count of PipItem rows of this plan whose is_overdue == true
        default: 0

  - name: PipItem
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> PipPlan.id; the plan this scoped item belongs to"
        constraints: "required"
      - name: predecessor_item_id
        type: string
        source: input
        description: "FK -> PipItem.id; optional sequencing predecessor that must reach WORK_COMPLETE, ACCEPTED or REMOVED_BY_DISPUTE before this item may start; must belong to the same plan"
        default: null
      - name: category
        type: enum
        source: input
        description: work category that fixes the deadline offset, escalation factor and priority band
        constraints: "one of {LIFE_SAFETY, GUEST_FACING, BACK_OF_HOUSE}, required"
      - name: standards_reference
        type: string
        source: input
        description: clause in the plan's standards_edition that the item is scoped against
        constraints: "1..40 chars, required"
      - name: brand_estimated_cost_cents
        type: integer
        source: input
        description: brand's cost estimate for the item in cents
        constraints: ">= 0, required"
      - name: owner_claimed_cost_cents
        type: integer
        source: computed
        description: claimed_cost_cents of the most recently filed ScopeDispute on this item; null while no dispute has been filed
        default: null
      - name: approved_cost_cents
        type: integer
        source: computed
        description: revised_cost_cents of the latest RESOLVED_REVISED ScopeDispute on this item, else brand_estimated_cost_cents
      - name: item_funding_cents
        type: integer
        source: computed
        description: per-item rounded funding figure from calculations.funding_requirement
        default: 0
      - name: status
        type: enum
        source: computed
        description: item execution state
        default: SCOPED
        constraints: "one of {SCOPED, DEFERRED_PENDING_EXTENSION, IN_PROGRESS, WORK_COMPLETE, PUNCH_FAIL, ACCEPTED, REMOVED_BY_DISPUTE, VOIDED}"
      - name: room_impacting
        type: boolean
        source: input
        description: whether the work requires taking keys out of service
        constraints: "required"
      - name: rooms_affected_count
        type: integer
        source: input
        description: keys the item takes out of service while in progress
        default: 0
        constraints: ">= 0; must be 0 when room_impacting == false; must be >= 1 when room_impacting == true"
      - name: extension_days_granted
        type: integer
        source: computed
        description: cumulative days granted across all approved ExtensionRequest rows on this item
        default: 0
      - name: deadline_date
        type: string
        source: computed
        description: plan category deadline for this item's category plus extension_days_granted, ISO date; null while the plan is DRAFT
      - name: priority_rank
        type: integer
        source: computed
        description: 1-based rank from calculations.item_priority_ranking; null while the plan is DRAFT
      - name: is_overdue
        type: boolean
        source: computed
        description: true when deadline_date is non-null and date(logical clock) > deadline_date and status NOT IN {WORK_COMPLETE, ACCEPTED, REMOVED_BY_DISPUTE, VOIDED}
        default: false

  - name: ExtensionRequest
    parent: null
    common_fields: true
    fields:
      - name: item_id
        type: string
        source: input
        description: "FK -> PipItem.id; the scoped item whose deadline the owner asks to move"
        constraints: "required"
      - name: requested_days
        type: integer
        source: input
        description: additional calendar days requested on the current submission round
        constraints: ">= 1, required"
      - name: business_justification
        type: string
        source: input
        description: owner's written justification; brand rejects submissions below the minimum length
        constraints: ">= JUSTIFICATION_MIN_CHARS characters, required"
      - name: round_number
        type: integer
        source: computed
        description: submission round; 1 at create, incremented by each resubmit
        default: 1
      - name: status
        type: enum
        source: computed
        description: brand review state; NEEDS_MORE_JUSTIFICATION returns to SUBMITTED on resubmit
        default: SUBMITTED
        constraints: "one of {SUBMITTED, NEEDS_MORE_JUSTIFICATION, APPROVED, APPROVED_PARTIAL, DENIED}"
      - name: granted_days
        type: integer
        source: computed
        description: clamped grant from calculations.extension_grant_cap; 0 until a decision is recorded
        default: 0
      - name: pressure_ratio_at_decision
        type: number
        source: computed
        description: step-1 pressure_ratio of calculations.extension_grant_cap as evaluated at decision time, 4 decimal places
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the BrandManager that recorded the decision; null before decision
        default: null
      - name: decision_note
        type: string
        source: input
        description: brand's written decision rationale, stored from the decide call
        default: null

  - name: CapitalBudget
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> PipPlan.id; the plan this capital budget funds"
        constraints: "required"
      - name: total_authorized_cents
        type: integer
        source: input
        description: total capital authorized by the owner for the plan
        constraints: ">= 1, required"
      - name: contingency_pct
        type: number
        source: input
        description: contingency uplift applied per item in calculations.funding_requirement
        constraints: "0 <= value <= 0.50, at most 4 decimal places, required"
      - name: financing_source
        type: enum
        source: input
        description: how the authorized capital is financed
        constraints: "one of {RESERVE_DRAW, TERM_LOAN, OWNER_EQUITY, MIXED}, required"
      - name: status
        type: enum
        source: computed
        description: budget lifecycle; UNDERFUNDED is entered from LOCKED when a cost revision pushes funding_requirement above total_authorized_cents
        default: DRAFT
        constraints: "one of {DRAFT, APPROVED, LOCKED, UNDERFUNDED, SUPERSEDED, CLOSED}"
      - name: committed_cents
        type: integer
        source: computed
        description: sum of amount_cents over ReserveDraw rows of this budget with status == DISBURSED
        default: 0
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the BrandManager that consented to the budget; null before approval
        default: null

  - name: ReserveDraw
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property whose FF&E reserve is drawn against"
        constraints: "required"
      - name: capital_budget_id
        type: string
        source: input
        description: "FK -> CapitalBudget.id; the budget the draw is committed to"
        constraints: "required"
      - name: purpose_item_id
        type: string
        source: input
        description: "FK -> PipItem.id; the scoped item the draw funds; must belong to the same plan as capital_budget_id"
        constraints: "required"
      - name: amount_cents
        type: integer
        source: input
        description: requested draw amount in cents
        constraints: ">= 1, required"
      - name: status
        type: enum
        source: computed
        description: draw lifecycle; REVERSED is the compensating state of DISBURSED
        default: REQUESTED
        constraints: "one of {REQUESTED, BRAND_CONSENTED, REJECTED, DISBURSED, REVERSED}"
      - name: consented_by_user_id
        type: string
        source: system
        description: X-User-ID of the BrandManager that recorded the consent decision; null before decision
        default: null
      - name: disbursed_at
        type: datetime
        source: system
        description: logical-clock instant the draw debited the reserve balance; null unless the draw reached DISBURSED
        default: null

  - name: RenovationPhase
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> PipPlan.id; the plan whose room closures this phase schedules"
        constraints: "required"
      - name: phase_number
        type: integer
        source: input
        description: owner-assigned phase sequence number, unique within the plan
        constraints: ">= 1, required"
      - name: start_date
        type: string
        source: input
        description: first closure date, inclusive, ISO date
        constraints: "required, ISO date"
      - name: end_date
        type: string
        source: input
        description: last closure date, inclusive, ISO date
        constraints: "required, ISO date, >= start_date"
      - name: rooms_out_of_service
        type: integer
        source: input
        description: keys held out of service for the whole closed interval
        constraints: ">= 1, required"
      - name: status
        type: enum
        source: computed
        description: phase lifecycle
        default: PLANNED
        constraints: "one of {PLANNED, ACTIVE, CLOSED_OUT, CANCELLED}"
      - name: displacement_revenue_impact_cents
        type: integer
        source: computed
        description: output of calculations.displacement_revenue_impact, recomputed at create and at activate against the property's then-current baselines
        default: 0
      - name: ooo_pct_at_activation
        type: number
        source: computed
        description: rooms_out_of_service / Property.room_count as evaluated by the activate transition, 4 decimal places; null while PLANNED
        default: null

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: contractor legal name
        constraints: "1..200 chars, required"
      - name: trade
        type: enum
        source: input
        description: primary trade the contractor is engaged for
        constraints: "one of {FIRE_PROTECTION, FF_AND_E, MEP, GENERAL}, required"
      - name: brand_approved
        type: boolean
        source: input
        description: whether the brand has vetted this contractor for work on plans carrying open life-safety scope
        default: false
      - name: max_concurrent_bookings
        type: integer
        source: input
        description: number of BOOKED bookings this contractor may have occupying any one instant
        default: 1
        constraints: ">= 1"

  - name: ContractorBooking
    parent: null
    common_fields: true
    fields:
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; the crew provider whose capacity the booking occupies"
        constraints: "required"
      - name: phase_id
        type: string
        source: input
        description: "FK -> RenovationPhase.id; the phase window the booking must sit inside"
        constraints: "required"
      - name: start_datetime
        type: datetime
        source: input
        description: inclusive start of the occupied half-open interval
        constraints: "required, ISO 8601 UTC"
      - name: end_datetime
        type: datetime
        source: input
        description: exclusive end of the occupied half-open interval
        constraints: "required, ISO 8601 UTC, > start_datetime"
      - name: crew_size
        type: integer
        source: input
        description: number of workers committed for the interval
        constraints: ">= 1, required"
      - name: status
        type: enum
        source: computed
        description: booking lifecycle; CANCELLED and COMPLETED are only reached through RenovationPhase cascades
        default: BOOKED
        constraints: "one of {BOOKED, CANCELLED, COMPLETED}"

  - name: BrandInspection
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> PipPlan.id; the plan being inspected"
        constraints: "required"
      - name: inspection_type
        type: enum
        source: input
        description: purpose of the visit; only COMPLETION inspections may be signed off
        constraints: "one of {SCOPING, PROGRESS, COMPLETION, RE_INSPECTION}, required"
      - name: inspector_user_id
        type: string
        source: input
        description: opaque BrandInspector user id assigned to this visit; the only user id allowed to perform or sign off this inspection
        constraints: "1..64 chars, required"
      - name: scheduled_date
        type: string
        source: input
        description: planned visit date, ISO date
        constraints: "required, ISO date"
      - name: performed_at
        type: datetime
        source: system
        description: logical-clock instant of the perform transition; null while SCHEDULED
        default: null
      - name: signed_off_at
        type: datetime
        source: system
        description: logical-clock instant of the sign-off transition; null unless SIGNED_OFF
        default: null
      - name: signed_off_by_user_id
        type: string
        source: system
        description: X-User-ID that recorded the sign-off; null unless SIGNED_OFF
        default: null
      - name: status
        type: enum
        source: computed
        description: inspection lifecycle
        default: SCHEDULED
        constraints: "one of {SCHEDULED, PERFORMED, SIGNED_OFF}"
      - name: punch_open_count
        type: integer
        source: computed
        description: count of PunchListItem rows of this inspection with status IN {OPEN, REMEDIATED}
        default: 0

  - name: PunchListItem
    parent: null
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> BrandInspection.id; the inspection that raised the defect"
        constraints: "required"
      - name: pip_item_id
        type: string
        source: input
        description: "FK -> PipItem.id; the scoped item the defect is charged against; must belong to the inspection's plan"
        constraints: "required"
      - name: defect_note
        type: string
        source: input
        description: inspector's description of the defect
        constraints: "1..500 chars, required"
      - name: severity
        type: enum
        source: input
        description: defect severity; MAJOR and CRITICAL knock the charged PipItem back to PUNCH_FAIL and penalise the risk score
        constraints: "one of {MINOR, MAJOR, CRITICAL}, required"
      - name: cure_deadline_date
        type: string
        source: computed
        description: date(logical clock at creation) + PUNCH_CURE_DAYS, ISO date
      - name: status
        type: enum
        source: computed
        description: defect lifecycle; REMEDIATED returns to OPEN when the inspector reopens
        default: OPEN
        constraints: "one of {OPEN, REMEDIATED, VERIFIED_CLOSED, WAIVED}"
      - name: verification_note
        type: string
        source: input
        description: inspector's note recorded by the verify call
        default: null

  - name: ScopeDispute
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> PipPlan.id; the plan whose scope or cost is contested"
        constraints: "required"
      - name: item_id
        type: string
        source: input
        description: "FK -> PipItem.id; the contested scoped item; must belong to plan_id"
        constraints: "required"
      - name: dispute_basis
        type: enum
        source: input
        description: ground on which the owner contests the item
        constraints: "one of {SCOPE_REASONABLENESS, COST_ESTIMATE, STANDARDS_APPLICABILITY}, required"
      - name: claimed_cost_cents
        type: integer
        source: input
        description: owner's own cost figure for the item, published as PipItem.owner_claimed_cost_cents
        constraints: ">= 0, required"
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the FranchiseeOwner that filed the dispute
      - name: status
        type: enum
        source: computed
        description: dispute lifecycle
        default: FILED
        constraints: "one of {FILED, RESOLVED_UPHELD, RESOLVED_REVISED, RESOLVED_REMOVED}"
      - name: revised_cost_cents
        type: integer
        source: input
        description: brand-determined replacement cost recorded by a REVISE resolution; null otherwise
        default: null
      - name: panel_decision_note
        type: string
        source: input
        description: brand's written resolution rationale
        default: null

  - name: DefaultNotice
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> PipPlan.id; the plan whose non-completion is noticed"
        constraints: "required"
      - name: cure_period_days
        type: integer
        source: input
        description: days the owner is given to cure, counted from the notice date
        constraints: "1..CURE_MAX_DAYS, required"
      - name: cure_deadline_date
        type: string
        source: computed
        description: date(logical clock at issuance) + cure_period_days, ISO date
      - name: breached_item_ids
        type: array
        source: computed
        description: ids of the PipItem rows that were is_overdue == true at issuance, ordered by priority_rank ascending
      - name: liquidated_damages_cents
        type: integer
        source: computed
        description: output of calculations.liquidated_damages (sum then round once)
        default: 0
      - name: status
        type: enum
        source: computed
        description: notice lifecycle
        default: ISSUED
        constraints: "one of {ISSUED, CURED, ESCALATED_TO_TERMINATION}"
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the BrandManager that issued the notice

  - name: ComplianceLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: plan_id
        type: string
        source: system
        description: "FK -> PipPlan.id; the plan the entry belongs to"
      - name: item_id
        type: string
        source: system
        description: "FK -> PipItem.id; the scoped item the entry concerns, null for plan-level entries"
        default: null
      - name: entry_type
        type: enum
        source: system
        description: append-only audit event kind
        constraints: "one of {SCOPE_ISSUED, COST_REVISED, ITEM_REMOVED, EXTENSION_GRANTED, DRAW_DISBURSED, DRAW_REVERSED, PUNCH_WAIVED, DEFAULT_ISSUED, DEFAULT_CURED, PLAN_COMPLETED, PLAN_TERMINATED}"
      - name: delta_cents
        type: integer
        source: system
        description: signed cash or cost delta the event carries; 0 for events with no monetary effect
        default: 0
      - name: memo
        type: string
        source: system
        description: human-readable description minted by the triggering transition
      - name: recorded_at_clock
        type: datetime
        source: system
        description: logical-clock instant at which the entry was appended

state_machines:
  - entity: PipPlan
    dimension: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /pip/plans/{id}/issue"
        actor: BrandManager
        preconditions:
          - "plan.status == DRAFT"
          - "count of PipItem rows with plan_id == plan.id and status == SCOPED is >= 1, else ERR_PLAN_HAS_NO_ITEMS"
          - "Property.franchise_agreement_status != TERMINATED, else ERR_FRANCHISE_TERMINATED"
        side_effects:
          - "sets plan.issued_by_user_id = X-User-ID and plan.issued_at = logical clock"
          - "sets life_safety_deadline_date / guest_facing_deadline_date / back_of_house_deadline_date = date(issued_at) + the category offset constants of calculations.category_deadline_schedule"
          - "sets deadline_date on every PipItem of the plan to its category deadline (extension_days_granted is 0 at this point)"
          - "runs calculations.item_priority_ranking and writes priority_rank 1..N on every PipItem with status NOT IN {REMOVED_BY_DISPUTE, VOIDED}"
          - "recomputes plan.brand_scoped_total_cents and plan.owner_claimed_total_cents per calculations.plan_scope_cost, plan.scope_item_count, plan.funding_requirement_cents per calculations.funding_requirement and plan.funding_gap_cents (0 while no active CapitalBudget exists)"
          - "appends ComplianceLedgerEntry {entry_type: SCOPE_ISSUED, item_id: null, delta_cents: plan.brand_scoped_total_cents}"
          - "recomputes Property.open_plan_count, Property.compliance_risk_score and Property.compliance_posture per calculations.compliance_risk_score (as_of_snapshot variant), then recomputes FranchiseeAccount.standing from the owner's property postures"
          - "increments PipPlan.version by 1"
      - from: ISSUED
        to: OWNER_ACKNOWLEDGED
        trigger: "POST /pip/plans/{id}/acknowledge"
        actor: FranchiseeOwner
        preconditions:
          - "plan.status == ISSUED"
          - "X-User-ID == Property.franchisee_id for the plan's property, else ERR_NOT_PROPERTY_FRANCHISEE"
        side_effects:
          - "increments PipPlan.version by 1"
        note: "acknowledgement is the owner's contractual receipt; no cost or deadline recomputation occurs."
      - from: OWNER_ACKNOWLEDGED
        to: IN_EXECUTION
        trigger: "system: first PipItem of the plan leaves SCOPED via POST /pip/items/{id}/start"
        actor: system
        preconditions:
          - "plan.status == OWNER_ACKNOWLEDGED"
        side_effects:
          - "cascade link 2 of the item-start chain: plan.status = IN_EXECUTION and PipPlan.version increments by 1"
          - "cascade link 3: because plan.status changed, Property.compliance_risk_score and Property.compliance_posture are recomputed"
      - from: IN_EXECUTION
        to: READY_FOR_COMPLETION_INSPECTION
        trigger: "system: aggregate PipItem status check after POST /pip/items/{id}/complete-work or POST /pip/punch-list-items/{id}/verify"
        actor: system
        preconditions:
          - "plan.scope_item_count >= 1"
          - "every PipItem of the plan with status NOT IN {REMOVED_BY_DISPUTE, VOIDED} has status IN {WORK_COMPLETE, ACCEPTED}"
        side_effects:
          - "plan.status = READY_FOR_COMPLETION_INSPECTION and PipPlan.version increments by 1"
        note: "compound transition: the parent state is a function of the aggregate child state."
      - from: READY_FOR_COMPLETION_INSPECTION
        to: IN_EXECUTION
        trigger: "system: a PunchListItem with severity IN {MAJOR, CRITICAL} is created against a PipItem of the plan via POST /pip/punch-list-items"
        actor: system
        preconditions:
          - "plan.status == READY_FOR_COMPLETION_INSPECTION"
          - "the charged PipItem transitions WORK_COMPLETE -> PUNCH_FAIL"
        side_effects:
          - "plan.status = IN_EXECUTION and PipPlan.version increments by 1"
        note: "reverse edge of the compound transition; the plan re-opens whenever the aggregate child condition stops holding."
      - from: READY_FOR_COMPLETION_INSPECTION
        to: COMPLETED
        trigger: "POST /pip/inspections/{id}/sign-off"
        actor: BrandInspector
        preconditions:
          - "plan.status == READY_FOR_COMPLETION_INSPECTION"
          - "plan.dispute_state != DISPUTE_OPEN, else ERR_DISPUTE_OPEN_BLOCKS_SIGNOFF"
        side_effects:
          - "every PipItem of the plan with status == WORK_COMPLETE becomes ACCEPTED"
          - "every RenovationPhase of the plan with status == ACTIVE becomes CLOSED_OUT, which returns its rooms_out_of_service to Property.rooms_out_of_service_current and marks its BOOKED ContractorBooking rows COMPLETED"
          - "the plan's active CapitalBudget (status IN {APPROVED, LOCKED, UNDERFUNDED}) becomes CLOSED"
          - "appends ComplianceLedgerEntry {entry_type: PLAN_COMPLETED, item_id: null, delta_cents: 0}"
          - "recomputes Property.open_plan_count, compliance_risk_score, compliance_posture, then FranchiseeAccount.standing"
          - "increments PipPlan.version by 1"
      - from: ISSUED
        to: TERMINATED
        trigger: "POST /pip/default-notices/{id}/escalate"
        actor: BrandManager
        preconditions:
          - "the escalating DefaultNotice.plan_id == plan.id and its status == ISSUED"
        side_effects:
          - "see the OWNER_ACKNOWLEDGED -> TERMINATED transition; the cascade is identical"
      - from: OWNER_ACKNOWLEDGED
        to: TERMINATED
        trigger: "POST /pip/default-notices/{id}/escalate"
        actor: BrandManager
        preconditions:
          - "the escalating DefaultNotice.plan_id == plan.id and its status == ISSUED"
        side_effects:
          - "cascade link 1: plan.status = TERMINATED, PipPlan.version increments by 1"
          - "cascade link 2 (caused by link 1): every PipItem of the plan with status IN {SCOPED, DEFERRED_PENDING_EXTENSION, IN_PROGRESS, WORK_COMPLETE, PUNCH_FAIL} becomes VOIDED; every RenovationPhase of the plan with status IN {PLANNED, ACTIVE} becomes CANCELLED; the plan's active CapitalBudget becomes CLOSED"
          - "cascade link 3 (caused by link 2): for each phase that became CANCELLED, its ContractorBooking rows with status == BOOKED become CANCELLED, and for each phase that was ACTIVE its rooms_out_of_service is subtracted from Property.rooms_out_of_service_current"
          - "cascade link 4 (caused by link 1): Property.franchise_agreement_status = TERMINATED"
          - "cascade link 5 (caused by link 4): Property.compliance_posture = TERMINATED and FranchiseeAccount.standing = TERMINATED_PORTFOLIO"
          - "appends ComplianceLedgerEntry {entry_type: PLAN_TERMINATED, item_id: null, delta_cents: 0}"
      - from: IN_EXECUTION
        to: TERMINATED
        trigger: "POST /pip/default-notices/{id}/escalate"
        actor: BrandManager
        preconditions:
          - "the escalating DefaultNotice.plan_id == plan.id and its status == ISSUED"
        side_effects:
          - "see the OWNER_ACKNOWLEDGED -> TERMINATED transition; the cascade is identical"
      - from: READY_FOR_COMPLETION_INSPECTION
        to: TERMINATED
        trigger: "POST /pip/default-notices/{id}/escalate"
        actor: BrandManager
        preconditions:
          - "the escalating DefaultNotice.plan_id == plan.id and its status == ISSUED"
        side_effects:
          - "see the OWNER_ACKNOWLEDGED -> TERMINATED transition; the cascade is identical"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /pip/plans/{id}/withdraw"
        actor: BrandManager
        preconditions:
          - "plan.status IN {DRAFT, ISSUED}"
        side_effects:
          - "every PipItem of the plan with status IN {SCOPED, DEFERRED_PENDING_EXTENSION} becomes VOIDED"
          - "recomputes Property.open_plan_count, compliance_risk_score, compliance_posture, then FranchiseeAccount.standing"
          - "increments PipPlan.version by 1"
      - from: ISSUED
        to: WITHDRAWN
        trigger: "POST /pip/plans/{id}/withdraw"
        actor: BrandManager
        preconditions:
          - "plan.status IN {DRAFT, ISSUED}"
        side_effects:
          - "same as the DRAFT -> WITHDRAWN transition"

  - entity: PipPlan
    dimension: dispute_state
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: DISPUTE_OPEN
        trigger: "POST /pip/disputes"
        actor: FranchiseeOwner
        preconditions:
          - "the created ScopeDispute.plan_id == plan.id"
        side_effects:
          - "plan.dispute_state = DISPUTE_OPEN independently of plan.status, which is untouched"
          - "sets PipItem.owner_claimed_cost_cents = dispute.claimed_cost_cents on the contested item and recomputes plan.owner_claimed_total_cents"
          - "increments PipPlan.version by 1"
      - from: DISPUTE_OPEN
        to: DISPUTE_RESOLVED_UPHELD
        trigger: "POST /pip/disputes/{id}/resolve with resolution == UPHOLD"
        actor: BrandManager
        preconditions:
          - "no other ScopeDispute of this plan remains in status FILED"
        side_effects:
          - "plan.dispute_state = DISPUTE_RESOLVED_UPHELD; plan.status unchanged"
          - "increments PipPlan.version by 1"
      - from: DISPUTE_OPEN
        to: DISPUTE_RESOLVED_REVISED
        trigger: "POST /pip/disputes/{id}/resolve with resolution == REVISE"
        actor: BrandManager
        preconditions:
          - "no other ScopeDispute of this plan remains in status FILED"
        side_effects:
          - "plan.dispute_state = DISPUTE_RESOLVED_REVISED; plan.status unchanged"
          - "drives the four-link cost-revision cascade documented on state_machines.ScopeDispute.FILED_to_RESOLVED_REVISED"
      - from: DISPUTE_OPEN
        to: DISPUTE_RESOLVED_REMOVED
        trigger: "POST /pip/disputes/{id}/resolve with resolution == REMOVE"
        actor: BrandManager
        preconditions:
          - "no other ScopeDispute of this plan remains in status FILED"
        side_effects:
          - "plan.dispute_state = DISPUTE_RESOLVED_REMOVED; plan.status unchanged"
          - "the contested PipItem becomes REMOVED_BY_DISPUTE, which drops it out of every plan aggregate"
      - from: DISPUTE_RESOLVED_UPHELD
        to: DISPUTE_OPEN
        trigger: "POST /pip/disputes"
        actor: FranchiseeOwner
        preconditions:
          - "the created ScopeDispute.plan_id == plan.id"
        side_effects:
          - "plan.dispute_state returns to DISPUTE_OPEN for the newly filed dispute; plan.status unchanged"
          - "increments PipPlan.version by 1"
      - from: DISPUTE_RESOLVED_REVISED
        to: DISPUTE_OPEN
        trigger: "POST /pip/disputes"
        actor: FranchiseeOwner
        preconditions:
          - "the created ScopeDispute.plan_id == plan.id"
        side_effects:
          - "plan.dispute_state returns to DISPUTE_OPEN for the newly filed dispute; plan.status unchanged"
          - "increments PipPlan.version by 1"
      - from: DISPUTE_RESOLVED_REMOVED
        to: DISPUTE_OPEN
        trigger: "POST /pip/disputes"
        actor: FranchiseeOwner
        preconditions:
          - "the created ScopeDispute.plan_id == plan.id"
        side_effects:
          - "plan.dispute_state returns to DISPUTE_OPEN for the newly filed dispute; plan.status unchanged"
          - "increments PipPlan.version by 1"

  - entity: PipItem
    initial_state: SCOPED
    terminal_states: [ACCEPTED, REMOVED_BY_DISPUTE, VOIDED]
    transitions:
      - from: SCOPED
        to: IN_PROGRESS
        trigger: "POST /pip/items/{id}/start"
        actor: FranchiseeOwner
        preconditions:
          - "item.status == SCOPED, else ERR_ITEM_NOT_STARTABLE"
          - "plan.status IN {OWNER_ACKNOWLEDGED, IN_EXECUTION}, else ERR_PLAN_NOT_IN_EXECUTION_WINDOW"
          - "X-User-ID == Property.franchisee_id, else ERR_NOT_PROPERTY_FRANCHISEE"
          - "the plan's active CapitalBudget (status IN {DRAFT, APPROVED, LOCKED, UNDERFUNDED}) exists and its status == LOCKED, else ERR_BUDGET_NOT_LOCKED"
          - "item.predecessor_item_id is null OR the predecessor's status IN {WORK_COMPLETE, ACCEPTED, REMOVED_BY_DISPUTE}, else ERR_PREDECESSOR_NOT_SATISFIED"
          - "if item.category != LIFE_SAFETY then no PipItem of the plan with category == LIFE_SAFETY has is_overdue == true, else ERR_LIFE_SAFETY_PRIORITY_VIOLATION"
          - "if item.room_impacting == true then a RenovationPhase of the plan exists with status == ACTIVE, start_date <= date(logical clock) <= end_date and rooms_out_of_service >= item.rooms_affected_count, else ERR_NO_ACTIVE_PHASE_FOR_ROOM_WORK"
        side_effects:
          - "cascade link 1: item.status = IN_PROGRESS, PipItem.version increments by 1"
          - "cascade link 2 (caused by link 1): if plan.status == OWNER_ACKNOWLEDGED the plan transitions to IN_EXECUTION"
          - "cascade link 3 (caused by link 2): Property.compliance_risk_score and Property.compliance_posture are recomputed, then FranchiseeAccount.standing"
      - from: IN_PROGRESS
        to: WORK_COMPLETE
        trigger: "POST /pip/items/{id}/complete-work"
        actor: FranchiseeOwner
        preconditions:
          - "item.status == IN_PROGRESS, else ERR_ITEM_NOT_IN_PROGRESS"
          - "X-User-ID == Property.franchisee_id, else ERR_NOT_PROPERTY_FRANCHISEE"
        side_effects:
          - "item.status = WORK_COMPLETE, PipItem.version increments by 1"
          - "item.is_overdue is recomputed to false"
          - "the plan re-evaluates the compound READY_FOR_COMPLETION_INSPECTION condition"
          - "Property.compliance_risk_score and Property.compliance_posture are recomputed, then FranchiseeAccount.standing"
      - from: SCOPED
        to: DEFERRED_PENDING_EXTENSION
        trigger: "system: POST /pip/extension-requests creates a request on this item"
        actor: system
        preconditions:
          - "item.status == SCOPED"
        side_effects:
          - "item.status = DEFERRED_PENDING_EXTENSION; deadline_date is NOT changed while the request is pending"
          - "increments PipItem.version by 1"
      - from: DEFERRED_PENDING_EXTENSION
        to: SCOPED
        trigger: "system: POST /pip/extension-requests/{id}/decide records APPROVE, DENY or a partial grant on the item's pending request"
        actor: system
        preconditions:
          - "item.status == DEFERRED_PENDING_EXTENSION"
          - "the deciding call resolves the request to APPROVED, APPROVED_PARTIAL or DENIED (REQUEST_MORE_JUSTIFICATION leaves the item DEFERRED_PENDING_EXTENSION)"
        side_effects:
          - "item.status = SCOPED"
          - "on APPROVED / APPROVED_PARTIAL: item.extension_days_granted += request.granted_days and item.deadline_date = plan category deadline + item.extension_days_granted"
          - "on DENIED: extension_days_granted and deadline_date are unchanged"
          - "item.is_overdue, plan.overdue_item_count, Property.compliance_risk_score, Property.compliance_posture and FranchiseeAccount.standing are recomputed"
      - from: WORK_COMPLETE
        to: PUNCH_FAIL
        trigger: "system: POST /pip/punch-list-items creates a defect with severity IN {MAJOR, CRITICAL} charged to this item"
        actor: system
        preconditions:
          - "item.status == WORK_COMPLETE"
          - "the new PunchListItem.severity IN {MAJOR, CRITICAL} (MINOR defects leave the item WORK_COMPLETE)"
        side_effects:
          - "item.status = PUNCH_FAIL, PipItem.version increments by 1"
          - "the plan re-evaluates the compound condition and reverts READY_FOR_COMPLETION_INSPECTION -> IN_EXECUTION"
          - "Property.compliance_risk_score is recomputed with the open-defect penalties"
      - from: PUNCH_FAIL
        to: WORK_COMPLETE
        trigger: "system: POST /pip/punch-list-items/{id}/verify closes or waives the last non-closed defect charged to this item"
        actor: system
        preconditions:
          - "item.status == PUNCH_FAIL"
          - "every PunchListItem with pip_item_id == item.id has status IN {VERIFIED_CLOSED, WAIVED}"
        side_effects:
          - "item.status = WORK_COMPLETE, PipItem.version increments by 1"
          - "the plan re-evaluates the compound READY_FOR_COMPLETION_INSPECTION condition"
          - "Property.compliance_risk_score is recomputed"
      - from: WORK_COMPLETE
        to: ACCEPTED
        trigger: "system: POST /pip/inspections/{id}/sign-off on the plan's COMPLETION inspection"
        actor: system
        preconditions:
          - "item.status == WORK_COMPLETE"
        side_effects:
          - "item.status = ACCEPTED, PipItem.version increments by 1"
      - from: SCOPED
        to: REMOVED_BY_DISPUTE
        trigger: "system: POST /pip/disputes/{id}/resolve with resolution == REMOVE"
        actor: system
        preconditions:
          - "item.status IN {SCOPED, DEFERRED_PENDING_EXTENSION, IN_PROGRESS}"
        side_effects:
          - "item.status = REMOVED_BY_DISPUTE; the item leaves every plan aggregate (scope_item_count, brand_scoped_total_cents, owner_claimed_total_cents, funding_requirement_cents)"
          - "appends ComplianceLedgerEntry {entry_type: ITEM_REMOVED, item_id: item.id, delta_cents: -1 * item.approved_cost_cents}"
          - "calculations.item_priority_ranking re-runs over the remaining items"
      - from: DEFERRED_PENDING_EXTENSION
        to: REMOVED_BY_DISPUTE
        trigger: "system: POST /pip/disputes/{id}/resolve with resolution == REMOVE"
        actor: system
        preconditions:
          - "item.status IN {SCOPED, DEFERRED_PENDING_EXTENSION, IN_PROGRESS}"
        side_effects:
          - "same as the SCOPED -> REMOVED_BY_DISPUTE transition"
      - from: IN_PROGRESS
        to: REMOVED_BY_DISPUTE
        trigger: "system: POST /pip/disputes/{id}/resolve with resolution == REMOVE"
        actor: system
        preconditions:
          - "item.status IN {SCOPED, DEFERRED_PENDING_EXTENSION, IN_PROGRESS}"
        side_effects:
          - "same as the SCOPED -> REMOVED_BY_DISPUTE transition"
      - from: SCOPED
        to: VOIDED
        trigger: "system: PipPlan reaches TERMINATED or WITHDRAWN"
        actor: system
        preconditions:
          - "item.status NOT IN {ACCEPTED, REMOVED_BY_DISPUTE, VOIDED}"
        side_effects:
          - "item.status = VOIDED; the item leaves every plan aggregate"
      - from: IN_PROGRESS
        to: VOIDED
        trigger: "system: PipPlan reaches TERMINATED"
        actor: system
        preconditions:
          - "item.status NOT IN {ACCEPTED, REMOVED_BY_DISPUTE, VOIDED}"
        side_effects:
          - "item.status = VOIDED; the item leaves every plan aggregate"
      - from: WORK_COMPLETE
        to: VOIDED
        trigger: "system: PipPlan reaches TERMINATED"
        actor: system
        preconditions:
          - "item.status NOT IN {ACCEPTED, REMOVED_BY_DISPUTE, VOIDED}"
        side_effects:
          - "item.status = VOIDED; the item leaves every plan aggregate"

  - entity: ExtensionRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, APPROVED_PARTIAL, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /pip/extension-requests/{id}/decide with decision == APPROVE"
        actor: BrandManager
        preconditions:
          - "request.status == SUBMITTED, else ERR_EXTENSION_NOT_DECIDABLE"
          - "calculations.extension_grant_cap yields granted_days == the effective request amount (body granted_days when supplied, else request.requested_days)"
          - "granted_days >= 1, else ERR_EXTENSION_CAP_EXHAUSTED"
        side_effects:
          - "sets request.granted_days, request.pressure_ratio_at_decision, request.decided_by_user_id = X-User-ID and request.decision_note"
          - "item.extension_days_granted += granted_days and item.deadline_date moves out by the same number of days; item returns to SCOPED"
          - "appends ComplianceLedgerEntry {entry_type: EXTENSION_GRANTED, item_id: item.id, delta_cents: 0}"
          - "recomputes item.is_overdue, plan.overdue_item_count, Property.compliance_risk_score and Property.compliance_posture, then FranchiseeAccount.standing"
      - from: SUBMITTED
        to: APPROVED_PARTIAL
        trigger: "POST /pip/extension-requests/{id}/decide with decision == APPROVE"
        actor: BrandManager
        preconditions:
          - "request.status == SUBMITTED"
          - "calculations.extension_grant_cap clamps the grant so that 1 <= granted_days < the effective request amount"
        side_effects:
          - "identical to the SUBMITTED -> APPROVED transition, with the clamped granted_days"
        note: "the server, not the brand, decides between APPROVED and APPROVED_PARTIAL: the status records whether the clamp bit."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /pip/extension-requests/{id}/decide with decision == DENY"
        actor: BrandManager
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "sets request.granted_days = 0, request.pressure_ratio_at_decision, request.decided_by_user_id and request.decision_note"
          - "item returns to SCOPED with deadline_date and extension_days_granted unchanged"
      - from: SUBMITTED
        to: NEEDS_MORE_JUSTIFICATION
        trigger: "POST /pip/extension-requests/{id}/decide with decision == REQUEST_MORE_JUSTIFICATION"
        actor: BrandManager
        preconditions:
          - "request.status == SUBMITTED"
          - "request.round_number <= MAX_EXTENSION_ROUNDS"
        side_effects:
          - "sets request.decision_note and request.decided_by_user_id; the charged item stays DEFERRED_PENDING_EXTENSION"
      - from: NEEDS_MORE_JUSTIFICATION
        to: SUBMITTED
        trigger: "POST /pip/extension-requests/{id}/resubmit"
        actor: FranchiseeOwner
        preconditions:
          - "request.status == NEEDS_MORE_JUSTIFICATION, else ERR_EXTENSION_NOT_RESUBMITTABLE"
          - "request.round_number < MAX_EXTENSION_ROUNDS, else ERR_EXTENSION_ROUNDS_EXHAUSTED"
          - "body business_justification length >= JUSTIFICATION_MIN_CHARS, else ERR_JUSTIFICATION_INSUFFICIENT"
          - "X-User-ID == Property.franchisee_id, else ERR_NOT_PROPERTY_FRANCHISEE"
        side_effects:
          - "request.round_number += 1, business_justification and requested_days are replaced, request.status = SUBMITTED"
        note: "the revision loop: SUBMITTED -> NEEDS_MORE_JUSTIFICATION -> SUBMITTED, bounded by MAX_EXTENSION_ROUNDS."

  - entity: CapitalBudget
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CLOSED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /pip/capital-budgets/{id}/approve"
        actor: BrandManager
        preconditions:
          - "budget.status == DRAFT, else ERR_BUDGET_NOT_APPROVABLE"
          - "plan.status IN {ISSUED, OWNER_ACKNOWLEDGED, IN_EXECUTION}, else ERR_PLAN_NOT_IN_EXECUTION_WINDOW"
        side_effects:
          - "sets budget.approved_by_user_id = X-User-ID"
          - "increments CapitalBudget.version by 1"
      - from: APPROVED
        to: LOCKED
        trigger: "POST /pip/capital-budgets/{id}/lock"
        actor: FranchiseeOwner
        preconditions:
          - "budget.status == APPROVED, else ERR_BUDGET_NOT_LOCKABLE"
          - "X-User-ID == Property.franchisee_id, else ERR_NOT_PROPERTY_FRANCHISEE"
          - "plan.funding_gap_cents == 0, else ERR_BUDGET_UNDERFUNDED"
        side_effects:
          - "budget.status = LOCKED, which is the gate PipItem.SCOPED -> IN_PROGRESS reads"
          - "increments CapitalBudget.version by 1"
      - from: LOCKED
        to: UNDERFUNDED
        trigger: "system: a cost revision raises plan.funding_requirement_cents above budget.total_authorized_cents"
        actor: system
        preconditions:
          - "budget.status == LOCKED"
          - "recomputed plan.funding_gap_cents > 0"
        side_effects:
          - "cascade link 3 of the cost-revision chain: budget.status = UNDERFUNDED, CapitalBudget.version increments by 1"
          - "cascade link 4 (caused by link 3): Property.compliance_risk_score is recomputed with the tiered funding-gap penalty and Property.compliance_posture is re-derived"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: POST /pip/capital-budgets creates a newer budget for the same plan_id"
        actor: system
        preconditions:
          - "budget.status IN {DRAFT, APPROVED, LOCKED, UNDERFUNDED}"
        side_effects:
          - "budget.status = SUPERSEDED and it stops being the plan's active budget"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: POST /pip/capital-budgets creates a newer budget for the same plan_id"
        actor: system
        preconditions:
          - "budget.status IN {DRAFT, APPROVED, LOCKED, UNDERFUNDED}"
        side_effects:
          - "budget.status = SUPERSEDED and it stops being the plan's active budget"
      - from: LOCKED
        to: SUPERSEDED
        trigger: "system: POST /pip/capital-budgets creates a newer budget for the same plan_id"
        actor: system
        preconditions:
          - "budget.status IN {DRAFT, APPROVED, LOCKED, UNDERFUNDED}"
        side_effects:
          - "budget.status = SUPERSEDED; because the plan no longer has a LOCKED budget, no further PipItem may start until the new budget is locked"
      - from: UNDERFUNDED
        to: SUPERSEDED
        trigger: "system: POST /pip/capital-budgets creates a newer budget for the same plan_id"
        actor: system
        preconditions:
          - "budget.status IN {DRAFT, APPROVED, LOCKED, UNDERFUNDED}"
        side_effects:
          - "budget.status = SUPERSEDED; the replacement budget carries the higher authorization that closes the funding gap"
      - from: LOCKED
        to: CLOSED
        trigger: "system: PipPlan reaches COMPLETED or TERMINATED"
        actor: system
        preconditions:
          - "budget.status IN {APPROVED, LOCKED, UNDERFUNDED}"
        side_effects:
          - "budget.status = CLOSED; committed_cents is frozen at its current value"
      - from: UNDERFUNDED
        to: CLOSED
        trigger: "system: PipPlan reaches COMPLETED or TERMINATED"
        actor: system
        preconditions:
          - "budget.status IN {APPROVED, LOCKED, UNDERFUNDED}"
        side_effects:
          - "budget.status = CLOSED; committed_cents is frozen at its current value"
      - from: APPROVED
        to: CLOSED
        trigger: "system: PipPlan reaches COMPLETED or TERMINATED"
        actor: system
        preconditions:
          - "budget.status IN {APPROVED, LOCKED, UNDERFUNDED}"
        side_effects:
          - "budget.status = CLOSED; committed_cents is frozen at its current value"

  - entity: ReserveDraw
    initial_state: REQUESTED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: REQUESTED
        to: BRAND_CONSENTED
        trigger: "POST /pip/reserve-draws/{id}/consent with decision == CONSENT"
        actor: BrandManager
        preconditions:
          - "draw.status == REQUESTED, else ERR_DRAW_NOT_DECIDABLE"
          - "the draw's CapitalBudget.status IN {APPROVED, LOCKED, UNDERFUNDED}, else ERR_BUDGET_NOT_FUNDABLE"
        side_effects:
          - "sets draw.consented_by_user_id = X-User-ID; the amount stays encumbered against the reserve"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /pip/reserve-draws/{id}/consent with decision == REJECT"
        actor: BrandManager
        preconditions:
          - "draw.status == REQUESTED, else ERR_DRAW_NOT_DECIDABLE"
        side_effects:
          - "sets draw.consented_by_user_id = X-User-ID; the amount stops being encumbered, raising calculations.reserve_availability"
      - from: BRAND_CONSENTED
        to: DISBURSED
        trigger: "POST /pip/reserve-draws/{id}/disburse"
        actor: FranchiseeOwner
        preconditions:
          - "draw.status == BRAND_CONSENTED, else ERR_DRAW_NOT_DISBURSABLE"
          - "X-User-ID == Property.franchisee_id, else ERR_NOT_PROPERTY_FRANCHISEE"
          - "Property.reserve_balance_cents - draw.amount_cents >= Property.minimum_retention_cents, else ERR_INSUFFICIENT_RESERVE"
        side_effects:
          - "Property.reserve_balance_cents -= draw.amount_cents and Property.version increments by 1"
          - "draw.disbursed_at = logical clock"
          - "the draw's CapitalBudget.committed_cents += draw.amount_cents"
          - "appends ComplianceLedgerEntry {entry_type: DRAW_DISBURSED, item_id: draw.purpose_item_id, delta_cents: draw.amount_cents}"
      - from: DISBURSED
        to: REVERSED
        trigger: "POST /pip/reserve-draws/{id}/reverse"
        actor: FranchiseeOwner
        preconditions:
          - "draw.status == DISBURSED, else ERR_DRAW_NOT_REVERSIBLE"
          - "X-User-ID == Property.franchisee_id, else ERR_NOT_PROPERTY_FRANCHISEE"
          - "the draw's CapitalBudget.status != CLOSED, else ERR_BUDGET_CLOSED"
        side_effects:
          - "compensating action: Property.reserve_balance_cents += draw.amount_cents and Property.version increments by 1"
          - "the draw's CapitalBudget.committed_cents -= draw.amount_cents"
          - "appends ComplianceLedgerEntry {entry_type: DRAW_REVERSED, item_id: draw.purpose_item_id, delta_cents: -1 * draw.amount_cents}"
          - "the reserve-corpus invariant of calculations.reserve_corpus_invariant holds exactly after the pair"

  - entity: RenovationPhase
    initial_state: PLANNED
    terminal_states: [CLOSED_OUT, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /pip/renovation-phases/{id}/activate"
        actor: FranchiseeOwner
        preconditions:
          - "phase.status == PLANNED, else ERR_PHASE_NOT_ACTIVATABLE"
          - "plan.status IN {OWNER_ACKNOWLEDGED, IN_EXECUTION}, else ERR_PLAN_NOT_IN_EXECUTION_WINDOW"
          - "X-User-ID == Property.franchisee_id, else ERR_NOT_PROPERTY_FRANCHISEE"
          - "re-evaluated at activation: (Property.rooms_out_of_service_current + phase.rooms_out_of_service) / Property.room_count <= MAX_OOO_PCT, else ERR_OOO_CAP_EXCEEDED"
        side_effects:
          - "phase.status = ACTIVE"
          - "Property.rooms_out_of_service_current += phase.rooms_out_of_service and Property.version increments by 1"
          - "phase.ooo_pct_at_activation and phase.displacement_revenue_impact_cents are recomputed per calculations.displacement_revenue_impact against the property's current adr_baseline_cents and occupancy_baseline_pct"
      - from: ACTIVE
        to: CLOSED_OUT
        trigger: "POST /pip/renovation-phases/{id}/close-out"
        actor: FranchiseeOwner
        preconditions:
          - "phase.status == ACTIVE, else ERR_PHASE_NOT_CLOSEABLE"
          - "X-User-ID == Property.franchisee_id, else ERR_NOT_PROPERTY_FRANCHISEE"
          - "no PipItem of the plan with room_impacting == true has status == IN_PROGRESS, else ERR_ROOM_WORK_STILL_IN_PROGRESS"
        side_effects:
          - "phase.status = CLOSED_OUT"
          - "Property.rooms_out_of_service_current -= phase.rooms_out_of_service and Property.version increments by 1; the room-inventory invariant of calculations.room_inventory_invariant is restored"
          - "every ContractorBooking of the phase with status == BOOKED becomes COMPLETED"
      - from: PLANNED
        to: CANCELLED
        trigger: "system: PipPlan reaches TERMINATED"
        actor: system
        preconditions:
          - "phase.status IN {PLANNED, ACTIVE}"
        side_effects:
          - "phase.status = CANCELLED"
          - "every ContractorBooking of the phase with status == BOOKED becomes CANCELLED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system: PipPlan reaches TERMINATED"
        actor: system
        preconditions:
          - "phase.status IN {PLANNED, ACTIVE}"
        side_effects:
          - "phase.status = CANCELLED"
          - "Property.rooms_out_of_service_current -= phase.rooms_out_of_service, restoring the room-inventory invariant"
          - "every ContractorBooking of the phase with status == BOOKED becomes CANCELLED"

  - entity: ContractorBooking
    initial_state: BOOKED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "system: the booking's RenovationPhase reaches CANCELLED"
        actor: system
        preconditions:
          - "booking.status == BOOKED"
        side_effects:
          - "booking.status = CANCELLED; the interval stops occupying Contractor capacity for calculations.contractor_capacity_overlap"
      - from: BOOKED
        to: COMPLETED
        trigger: "system: the booking's RenovationPhase reaches CLOSED_OUT"
        actor: system
        preconditions:
          - "booking.status == BOOKED"
        side_effects:
          - "booking.status = COMPLETED; the interval stops occupying Contractor capacity"

  - entity: BrandInspection
    initial_state: SCHEDULED
    terminal_states: [SIGNED_OFF]
    transitions:
      - from: SCHEDULED
        to: PERFORMED
        trigger: "POST /pip/inspections/{id}/perform"
        actor: BrandInspector
        preconditions:
          - "inspection.status == SCHEDULED, else ERR_INSPECTION_NOT_PERFORMABLE"
          - "X-User-ID == inspection.inspector_user_id, else ERR_NOT_ASSIGNED_INSPECTOR"
          - "date(logical clock) >= inspection.scheduled_date, else ERR_INSPECTION_TOO_EARLY"
        side_effects:
          - "inspection.performed_at = logical clock"
          - "inspection.punch_open_count is recomputed (0 until defects are filed)"
      - from: PERFORMED
        to: SIGNED_OFF
        trigger: "POST /pip/inspections/{id}/sign-off"
        actor: BrandInspector
        preconditions:
          - "inspection.status == PERFORMED, else ERR_INSPECTION_NOT_SIGNABLE"
          - "inspection.inspection_type == COMPLETION, else ERR_INSPECTION_TYPE_NOT_SIGNABLE"
          - "X-User-ID == inspection.inspector_user_id, else ERR_NOT_ASSIGNED_INSPECTOR"
          - "X-User-ID != plan.issued_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "plan.status == READY_FOR_COMPLETION_INSPECTION, else ERR_PLAN_NOT_READY_FOR_SIGNOFF"
          - "plan.dispute_state != DISPUTE_OPEN, else ERR_DISPUTE_OPEN_BLOCKS_SIGNOFF"
          - "inspection.punch_open_count == 0, else ERR_PUNCH_LIST_OPEN"
        side_effects:
          - "inspection.signed_off_at = logical clock, inspection.signed_off_by_user_id = X-User-ID"
          - "drives the PipPlan READY_FOR_COMPLETION_INSPECTION -> COMPLETED cascade in full"

  - entity: PunchListItem
    initial_state: OPEN
    terminal_states: [VERIFIED_CLOSED, WAIVED]
    transitions:
      - from: OPEN
        to: REMEDIATED
        trigger: "POST /pip/punch-list-items/{id}/remediate"
        actor: FranchiseeOwner
        preconditions:
          - "punch.status == OPEN, else ERR_PUNCH_NOT_REMEDIABLE"
          - "X-User-ID == Property.franchisee_id, else ERR_NOT_PROPERTY_FRANCHISEE"
        side_effects:
          - "punch.status = REMEDIATED; the defect still counts toward inspection.punch_open_count and toward the risk-score defect penalties"
      - from: REMEDIATED
        to: VERIFIED_CLOSED
        trigger: "POST /pip/punch-list-items/{id}/verify with outcome == CLOSE"
        actor: BrandInspector
        preconditions:
          - "punch.status == REMEDIATED, else ERR_PUNCH_NOT_VERIFIABLE"
          - "X-User-ID == the inspection's inspector_user_id, else ERR_NOT_ASSIGNED_INSPECTOR"
        side_effects:
          - "punch.status = VERIFIED_CLOSED and inspection.punch_open_count decreases by 1"
          - "if every defect charged to the same PipItem is now VERIFIED_CLOSED or WAIVED, the item returns PUNCH_FAIL -> WORK_COMPLETE and the plan re-evaluates the compound READY_FOR_COMPLETION_INSPECTION condition"
          - "Property.compliance_risk_score and Property.compliance_posture are recomputed"
      - from: REMEDIATED
        to: OPEN
        trigger: "POST /pip/punch-list-items/{id}/verify with outcome == REOPEN"
        actor: BrandInspector
        preconditions:
          - "punch.status == REMEDIATED, else ERR_PUNCH_NOT_VERIFIABLE"
          - "X-User-ID == the inspection's inspector_user_id, else ERR_NOT_ASSIGNED_INSPECTOR"
        side_effects:
          - "punch.status = OPEN; the reopen loop may run any number of times and inspection.punch_open_count is unchanged"
      - from: OPEN
        to: WAIVED
        trigger: "POST /pip/punch-list-items/{id}/verify with outcome == WAIVE"
        actor: BrandInspector
        preconditions:
          - "punch.status IN {OPEN, REMEDIATED}"
          - "X-User-ID == the inspection's inspector_user_id, else ERR_NOT_ASSIGNED_INSPECTOR"
          - "punch.severity != CRITICAL, else ERR_CRITICAL_DEFECT_NOT_WAIVABLE"
        side_effects:
          - "punch.status = WAIVED, inspection.punch_open_count decreases by 1"
          - "appends ComplianceLedgerEntry {entry_type: PUNCH_WAIVED, item_id: punch.pip_item_id, delta_cents: 0}"
          - "if every defect charged to the same PipItem is now VERIFIED_CLOSED or WAIVED, the item returns PUNCH_FAIL -> WORK_COMPLETE"
      - from: REMEDIATED
        to: WAIVED
        trigger: "POST /pip/punch-list-items/{id}/verify with outcome == WAIVE"
        actor: BrandInspector
        preconditions:
          - "punch.status IN {OPEN, REMEDIATED}"
          - "X-User-ID == the inspection's inspector_user_id, else ERR_NOT_ASSIGNED_INSPECTOR"
          - "punch.severity != CRITICAL, else ERR_CRITICAL_DEFECT_NOT_WAIVABLE"
        side_effects:
          - "same as the OPEN -> WAIVED transition"

  - entity: ScopeDispute
    initial_state: FILED
    terminal_states: [RESOLVED_UPHELD, RESOLVED_REVISED, RESOLVED_REMOVED]
    transitions:
      - from: FILED
        to: RESOLVED_UPHELD
        trigger: "POST /pip/disputes/{id}/resolve with resolution == UPHOLD"
        actor: BrandManager
        preconditions:
          - "dispute.status == FILED, else ERR_DISPUTE_NOT_RESOLVABLE"
          - "body revised_cost_cents is absent, else ERR_REVISION_NOT_ALLOWED_FOR_RESOLUTION"
        side_effects:
          - "dispute.status = RESOLVED_UPHELD; the item's approved_cost_cents stays at brand_estimated_cost_cents"
          - "plan.dispute_state = DISPUTE_RESOLVED_UPHELD; plan.status untouched"
      - from: FILED
        to: RESOLVED_REVISED
        trigger: "POST /pip/disputes/{id}/resolve with resolution == REVISE"
        actor: BrandManager
        preconditions:
          - "dispute.status == FILED, else ERR_DISPUTE_NOT_RESOLVABLE"
          - "body revised_cost_cents is present and >= 0, else ERR_REVISION_COST_REQUIRED"
        side_effects:
          - "cascade link 1: dispute.status = RESOLVED_REVISED, dispute.revised_cost_cents is stored, and the contested PipItem.approved_cost_cents becomes revised_cost_cents"
          - "cascade link 2 (caused by link 1): because the item's approved_cost_cents changed, plan.funding_requirement_cents is recomputed by calculations.funding_requirement, calculations.item_priority_ranking re-runs and rewrites priority_rank on every item of the plan, and plan.dispute_state = DISPUTE_RESOLVED_REVISED"
          - "cascade link 3 (caused by link 2): because plan.funding_requirement_cents changed, plan.funding_gap_cents is recomputed and the plan's active CapitalBudget transitions LOCKED -> UNDERFUNDED when the gap becomes positive"
          - "cascade link 4 (caused by link 3): because the budget went UNDERFUNDED, Property.compliance_risk_score is recomputed with the tiered funding-gap penalty and Property.compliance_posture is re-derived"
          - "cascade link 5 (caused by link 4): because Property.compliance_posture changed, FranchiseeAccount.standing is recomputed from the postures of all properties of that franchisee"
          - "appends ComplianceLedgerEntry {entry_type: COST_REVISED, item_id: dispute.item_id, delta_cents: revised_cost_cents - previous approved_cost_cents}"
      - from: FILED
        to: RESOLVED_REMOVED
        trigger: "POST /pip/disputes/{id}/resolve with resolution == REMOVE"
        actor: BrandManager
        preconditions:
          - "dispute.status == FILED, else ERR_DISPUTE_NOT_RESOLVABLE"
          - "the contested PipItem.status IN {SCOPED, DEFERRED_PENDING_EXTENSION, IN_PROGRESS}, else ERR_ITEM_NOT_REMOVABLE"
        side_effects:
          - "dispute.status = RESOLVED_REMOVED and the contested item becomes REMOVED_BY_DISPUTE"
          - "plan.scope_item_count, brand_scoped_total_cents, owner_claimed_total_cents, funding_requirement_cents, funding_gap_cents and every priority_rank are recomputed over the surviving items"
          - "plan.dispute_state = DISPUTE_RESOLVED_REMOVED; plan.status untouched"

  - entity: DefaultNotice
    initial_state: ISSUED
    terminal_states: [CURED, ESCALATED_TO_TERMINATION]
    transitions:
      - from: ISSUED
        to: CURED
        trigger: "POST /pip/default-notices/{id}/cure"
        actor: BrandManager
        preconditions:
          - "notice.status == ISSUED, else ERR_NOTICE_NOT_ACTIONABLE"
          - "every PipItem id in notice.breached_item_ids now has status IN {WORK_COMPLETE, ACCEPTED, REMOVED_BY_DISPUTE}, else ERR_BREACH_NOT_CURED"
        side_effects:
          - "notice.status = CURED"
          - "Property.franchise_agreement_status returns to ACTIVE when no other DefaultNotice of the property remains ISSUED"
          - "Property.compliance_risk_score and Property.compliance_posture are recomputed, then FranchiseeAccount.standing"
          - "appends ComplianceLedgerEntry {entry_type: DEFAULT_CURED, item_id: null, delta_cents: 0}"
      - from: ISSUED
        to: ESCALATED_TO_TERMINATION
        trigger: "POST /pip/default-notices/{id}/escalate"
        actor: BrandManager
        preconditions:
          - "notice.status == ISSUED, else ERR_NOTICE_NOT_ACTIONABLE"
          - "date(logical clock) > notice.cure_deadline_date, else ERR_CURE_PERIOD_NOT_ELAPSED"
          - "at least one PipItem id in notice.breached_item_ids still has status NOT IN {WORK_COMPLETE, ACCEPTED, REMOVED_BY_DISPUTE}, else ERR_BREACH_ALREADY_CURED"
        side_effects:
          - "notice.status = ESCALATED_TO_TERMINATION"
          - "drives the five-link termination cascade documented on state_machines.PipPlan.OWNER_ACKNOWLEDGED_to_TERMINATED"

concurrency_rules:
  - rule_id: budget-create-stale-plan
    parent_entity: PipPlan
    write_endpoint: "POST /pip/capital-budgets"
    occ_field: "expected_plan_version"
    description: |
      Creating a CapitalBudget against a PipPlan whose version has advanced since the
      client last read it is rejected. A new budget legitimately supersedes the plan's
      prior budget (state_machines.CapitalBudget.LOCKED_to_SUPERSEDED), so a second
      create is not blocked by any state precondition; the stale-version check is what
      stops a writer whose view of the plan's scope, cost totals or existing budget is
      out of date from silently replacing a budget it never saw.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
  - rule_id: draw-create-stale-property
    parent_entity: Property
    write_endpoint: "POST /pip/reserve-draws"
    occ_field: "expected_property_version"
    description: |
      Creating a ReserveDraw against a Property whose version has advanced since the
      client last read it is rejected. Two draws that each fit inside
      calculations.reserve_availability are both legitimate, so no state precondition
      rejects the second; the stale-version check stops a writer whose view of the
      reserve balance, minimum retention or encumbrances is out of date.
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412
  - rule_id: item-scope-revise-stale-plan
    parent_entity: PipPlan
    write_endpoint: "PATCH /pip/items/{id}"
    occ_field: "expected_plan_version"
    description: |
      Revising a DRAFT plan's scoped item when the plan's version has advanced since the
      client last read it is rejected. Repeated scope revisions on a DRAFT plan are all
      legitimate and each one rewrites the plan's cost aggregates, so the stale-version
      check is the only thing that prevents a revision computed against superseded
      aggregates from landing.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

calculations:
  - name: category_deadline_schedule
    trigger: "PipPlan DRAFT -> ISSUED, and on every recomputation of PipItem.deadline_date"
    algorithm: threshold
    formula: |
      plan.life_safety_deadline_date   = date(plan.issued_at) + LIFE_SAFETY_DEADLINE_DAYS
      plan.guest_facing_deadline_date  = date(plan.issued_at) + GUEST_FACING_DEADLINE_DAYS
      plan.back_of_house_deadline_date = date(plan.issued_at) + BACK_OF_HOUSE_DEADLINE_DAYS

      base_deadline(item) = plan.life_safety_deadline_date   if item.category == LIFE_SAFETY
                            plan.guest_facing_deadline_date  if item.category == GUEST_FACING
                            plan.back_of_house_deadline_date if item.category == BACK_OF_HOUSE
      item.deadline_date = base_deadline(item) + item.extension_days_granted   # calendar days

      item.is_overdue = item.deadline_date is not null
                        AND date(logical_clock) > item.deadline_date
                        AND item.status NOT IN {WORK_COMPLETE, ACCEPTED, REMOVED_BY_DISPUTE, VOIDED}
    input_set: "all PipItem rows of the plan; items of a DRAFT plan have deadline_date == null and is_overdue == false"
    constants:
      LIFE_SAFETY_DEADLINE_DAYS: 90
      GUEST_FACING_DEADLINE_DAYS: 270
      BACK_OF_HOUSE_DEADLINE_DAYS: 450
    precision: "whole calendar days on UTC dates; is_overdue uses strict > so an item is not overdue on its deadline date itself"

  - name: item_priority_ranking
    trigger: "PipPlan DRAFT -> ISSUED; and again whenever an item's approved_cost_cents changes or an item leaves the plan aggregate (ScopeDispute REVISE / REMOVE resolutions, PipItem -> VOIDED)"
    algorithm: chronological
    formula: |
      candidates = PipItem rows with plan_id == plan.id AND status NOT IN {REMOVED_BY_DISPUTE, VOIDED}
      sort candidates by:
        1. CATEGORY_RANK[category]      ascending   (LIFE_SAFETY 1, GUEST_FACING 2, BACK_OF_HOUSE 3)
        2. approved_cost_cents          descending
        3. created_at                   ascending   (tie-break; never id)
      assign priority_rank = 1, 2, 3, ... in that order
      items excluded from candidates keep priority_rank at its last assigned value and are ignored downstream
    input_set: "PipItem rows of one plan with status NOT IN {REMOVED_BY_DISPUTE, VOIDED}; the ranking is recomputed from scratch, never patched incrementally"
    constants:
      CATEGORY_RANK: "{ LIFE_SAFETY: 1, GUEST_FACING: 2, BACK_OF_HOUSE: 3 }"
    precision: "integer ranks starting at 1, contiguous, no gaps"

  - name: plan_scope_cost
    trigger: "PipPlan DRAFT -> ISSUED; ScopeDispute creation and resolution; PipItem status changes into or out of {REMOVED_BY_DISPUTE, VOIDED}; PATCH /pip/items/{id}; and on every GET /pip/plans/{id}/cost-summary"
    algorithm: aggregation
    formula: |
      included = PipItem rows with plan_id == plan.id AND status NOT IN {REMOVED_BY_DISPUTE, VOIDED}

      brand_scoped_total_cents  = sum over included of item.brand_estimated_cost_cents
      owner_claimed_total_cents = sum over included of
                                    (item.owner_claimed_cost_cents if item.owner_claimed_cost_cents is not null
                                     else item.brand_estimated_cost_cents)
      variance_cents = owner_claimed_total_cents - brand_scoped_total_cents
      variance_pct   = 0.00                                             if brand_scoped_total_cents == 0
                       else round_half_up(variance_cents * 100 / brand_scoped_total_cents, 2)
    input_set: "PipItem rows of one plan with status NOT IN {REMOVED_BY_DISPUTE, VOIDED}; an empty included set yields 0 for both totals, 0 variance and 0.00 variance_pct"
    constants: {}
    precision: "integer cents for the totals; variance_pct is 2 decimal places, round_half_up"
    variants:
      - name: brand_scoped
        when: "the brand's own scoping figure, published as PipPlan.brand_scoped_total_cents and used as the sole input to calculations.funding_requirement"
        difference: "always reads item.brand_estimated_cost_cents and ignores every owner claim"
      - name: owner_claimed
        when: "the owner's contested figure, published as PipPlan.owner_claimed_total_cents and used for dispute reporting only"
        difference: "substitutes item.owner_claimed_cost_cents wherever a ScopeDispute has been filed, so the same item set yields a different total; the two variants diverge the instant any dispute exists and never feed each other"

  - name: funding_requirement
    trigger: "PipPlan DRAFT -> ISSUED; ScopeDispute REVISE / REMOVE resolutions; CapitalBudget creation (a different contingency_pct re-bases the figure); PATCH /pip/items/{id}"
    algorithm: tiered_pricing
    formula: |
      contingency = active_budget.contingency_pct
                    if a CapitalBudget of the plan has status IN {DRAFT, APPROVED, LOCKED, UNDERFUNDED}
                    else DEFAULT_CONTINGENCY_PCT
      # "active_budget" = the CapitalBudget of the plan whose status IN {DRAFT, APPROVED, LOCKED,
      # UNDERFUNDED}; at most one such row exists because creation supersedes the prior one.

      for each included item (status NOT IN {REMOVED_BY_DISPUTE, VOIDED}):
        raw_item = item.approved_cost_cents * (1 + contingency) * CATEGORY_ESCALATION[item.category]
        item.item_funding_cents = round_half_up(raw_item, 0)          # STEP 1: round EACH item to whole cents

      plan.funding_requirement_cents = sum over included of item.item_funding_cents   # STEP 2: then sum

      plan.funding_gap_cents = 0                                              if no active_budget exists
                               else max(0, plan.funding_requirement_cents - active_budget.total_authorized_cents)
    input_set: "PipItem rows of one plan with status NOT IN {REMOVED_BY_DISPUTE, VOIDED}, read through approved_cost_cents (which equals brand_estimated_cost_cents unless a dispute was resolved REVISE)"
    constants:
      CATEGORY_ESCALATION: "{ LIFE_SAFETY: 1.00, GUEST_FACING: 1.075, BACK_OF_HOUSE: 1.035 }"
      DEFAULT_CONTINGENCY_PCT: 0.10
    precision: >-
      ROUNDING ORDER IS PINNED: round per item to whole cents with round_half_up FIRST, then sum the
      rounded item figures. The sum-then-round order is explicitly NOT used and produces a different
      total (three LIFE_SAFETY items of 100005 cents at contingency 0.10 give 330018 per-item-then-sum
      versus 330017 sum-then-round). Note the deliberate contrast with calculations.liquidated_damages,
      which pins the opposite order.

  - name: displacement_revenue_impact
    trigger: "POST /pip/renovation-phases (projection at create) and RenovationPhase PLANNED -> ACTIVE (recomputed against the property's then-current baselines)"
    algorithm: threshold
    formula: |
      nights                = date_diff(phase.end_date, phase.start_date) + 1        # closed interval
      displaced_room_nights = phase.rooms_out_of_service * nights
      ooo_pct               = phase.rooms_out_of_service / property.room_count        # exact rational
      compression_recapture_pct = 0.30   if ooo_pct <  0.10
                                  0.15   if 0.10 <= ooo_pct < 0.25
                                  0.00   if ooo_pct >= 0.25
      gross_displacement_cents = round_half_up(displaced_room_nights
                                               * property.adr_baseline_cents
                                               * property.occupancy_baseline_pct, 0)   # ROUND 1
      phase.displacement_revenue_impact_cents = round_half_up(gross_displacement_cents
                                               * (1 - compression_recapture_pct), 0)    # ROUND 2
      phase.ooo_pct_at_activation = round_half_up(ooo_pct, 4)      # written only by the activate transition
    input_set: "one RenovationPhase plus the Property baselines (adr_baseline_cents, occupancy_baseline_pct, room_count) as they stand at the moment of evaluation"
    constants:
      RECAPTURE_TIER_LOW_BOUND: 0.10
      RECAPTURE_TIER_HIGH_BOUND: 0.25
      RECAPTURE_PCT_BELOW_LOW: 0.30
      RECAPTURE_PCT_MID: 0.15
      RECAPTURE_PCT_AT_OR_ABOVE_HIGH: 0.00
    precision: >-
      Two-stage rounding, order pinned: round the gross figure to whole cents first, then apply the
      recapture factor and round again. Tier selection uses >= on the lower edge of each band, so
      ooo_pct exactly 0.25 lands in the 0.00-recapture band while the MAX_OOO_PCT validation still
      admits it (that validation rejects only ratios strictly greater than 0.25).

  - name: extension_grant_cap
    trigger: "POST /pip/extension-requests/{id}/decide with decision == APPROVE"
    algorithm: constraint_propagation
    formula: |
      # The cap looks circular: granted_days moves an item's deadline_date, and deadline_dates are
      # what the schedule-pressure ratio is measured from. The evaluation order below is PINNED, so
      # the value is well defined: step 1 reads the deadlines as they stand BEFORE this grant.
      effective_request_days = body.granted_days if body.granted_days is supplied else request.requested_days

      step 1: pressure_numerator   = count of PipItem rows of the item's plan with
                                       status IN {SCOPED, DEFERRED_PENDING_EXTENSION, IN_PROGRESS}
                                       AND deadline_date <= date(logical_clock) + PRESSURE_HORIZON_DAYS
              pressure_denominator = count of PipItem rows of the item's plan with
                                       status NOT IN {REMOVED_BY_DISPUTE, VOIDED, ACCEPTED}
              pressure_ratio = 0.0000 if pressure_denominator == 0
                               else round_half_up(pressure_numerator / pressure_denominator, 4)
      step 2: pressure_multiplier = 0.5 if pressure_ratio >= PRESSURE_CLAMP_RATIO else 1.0
      step 3: raw_cap_days        = floor(CATEGORY_MAX_EXT_DAYS[item.category] * pressure_multiplier)
      step 4: remaining_days      = CATEGORY_MAX_EXT_DAYS[item.category] - item.extension_days_granted
      step 5: granted_days        = min(effective_request_days, raw_cap_days, remaining_days)
      step 6: if granted_days <= 0 -> reject the APPROVE with ERR_EXTENSION_CAP_EXHAUSTED
              elif granted_days == effective_request_days -> request.status = APPROVED
              else                                        -> request.status = APPROVED_PARTIAL
      step 7: request.pressure_ratio_at_decision = the step-1 pressure_ratio
              item.extension_days_granted += granted_days
              item.deadline_date = base category deadline + item.extension_days_granted
              # only now do deadlines move, so the NEXT request's step 1 sees the new value
    input_set: "PipItem rows of the requesting item's plan; the requesting item itself is included in both counts while it sits in DEFERRED_PENDING_EXTENSION"
    constants:
      PRESSURE_HORIZON_DAYS: 60
      PRESSURE_CLAMP_RATIO: 0.60
      CATEGORY_MAX_EXT_DAYS: "{ LIFE_SAFETY: 30, GUEST_FACING: 120, BACK_OF_HOUSE: 180 }"
    precision: "pressure_ratio to 4 decimal places round_half_up, compared with >= against 0.60; raw_cap_days floored to whole days; granted_days is a whole number of days"

  - name: compliance_risk_score
    trigger: "every transition that changes a PipItem status, PipItem deadline_date, PunchListItem status, CapitalBudget status, DefaultNotice status or PipPlan status; POST /pip/plans/{id}/compliance-sweep; and on every GET /pip/properties/{id}/risk-summary"
    algorithm: weighted_scoring
    formula: |
      open_plans = PipPlan rows of the property with status IN
                   {ISSUED, OWNER_ACKNOWLEDGED, IN_EXECUTION, READY_FOR_COMPLETION_INSPECTION}
      scored_items = PipItem rows of those open_plans with status NOT IN {REMOVED_BY_DISPUTE, VOIDED}
      open_defects = PunchListItem rows charged to scored_items with status IN {OPEN, REMEDIATED}

      overdue(item)  = per the variant selected below
      ls_overdue     = count of scored_items with category == LIFE_SAFETY   and overdue(item)
      gf_overdue     = count of scored_items with category == GUEST_FACING  and overdue(item)
      boh_overdue    = count of scored_items with category == BACK_OF_HOUSE and overdue(item)

      total_gap  = sum over open_plans of plan.funding_gap_cents
      total_req  = sum over open_plans of plan.funding_requirement_cents
      gap_ratio  = 0 if total_req == 0 else total_gap / total_req
      funding_gap_penalty = 0    if total_gap == 0
                            10   if 0 < gap_ratio <= FUNDING_GAP_TIER_RATIO
                            25   if gap_ratio > FUNDING_GAP_TIER_RATIO

      raw = 100
            - min(LIFE_SAFETY_PENALTY_CAP, LS_PENALTY_PER_ITEM * ls_overdue)
            - GF_PENALTY_PER_ITEM  * gf_overdue
            - BOH_PENALTY_PER_ITEM * boh_overdue
            - funding_gap_penalty
            - MAJOR_DEFECT_PENALTY    * count(open_defects with severity == MAJOR)
            - CRITICAL_DEFECT_PENALTY * count(open_defects with severity == CRITICAL)
      score = max(0, min(100, raw))
    input_set: "only PipPlan rows in the four open statuses contribute; COMPLETED, TERMINATED, WITHDRAWN and DRAFT plans and their items and defects are excluded entirely; MINOR defects carry no penalty"
    constants:
      LS_PENALTY_PER_ITEM: 25
      LIFE_SAFETY_PENALTY_CAP: 50
      GF_PENALTY_PER_ITEM: 8
      BOH_PENALTY_PER_ITEM: 3
      MAJOR_DEFECT_PENALTY: 5
      CRITICAL_DEFECT_PENALTY: 12
      FUNDING_GAP_TIER_RATIO: 0.10
      PROJECTION_HORIZON_DAYS: 30
    precision: "integer score clamped to 0..100; the life-safety penalty saturates at 50, so a third overdue life-safety item changes nothing"
    variants:
      - name: as_of_snapshot
        when: "written to Property.compliance_risk_score by every triggering transition and by the compliance sweep; the only variant that drives Property.compliance_posture"
        difference: "overdue(item) == item.is_overdue, i.e. strictly date(logical_clock) > item.deadline_date"
      - name: projected_at_deadline
        when: "returned as projected_score by GET /pip/properties/{id}/risk-summary and never persisted"
        difference: >-
          overdue(item) == item.is_overdue OR (item.status IN {SCOPED, DEFERRED_PENDING_EXTENSION}
          AND item.deadline_date <= date(logical_clock) + PROJECTION_HORIZON_DAYS); unstarted work due
          inside the horizon is treated as already missed, so the same data yields a strictly lower
          score than as_of_snapshot whenever such an item exists

  - name: compliance_posture_derivation
    trigger: "immediately after every recomputation of Property.compliance_risk_score"
    algorithm: threshold
    formula: |
      posture = TERMINATED   if property.franchise_agreement_status == TERMINATED
                IN_DEFAULT   elif any DefaultNotice of any plan of the property has status == ISSUED
                AT_RISK      elif property.compliance_risk_score < COMPLIANT_MIN_SCORE
                COMPLIANT    else
      # the score bands: COMPLIANT requires score >= 80; AT_RISK covers score < 80; the notice and
      # termination overrides win over the score bands regardless of how high the score is.
      franchisee.standing = TERMINATED_PORTFOLIO if any property of the franchisee has posture == TERMINATED
                            DEFAULT              elif any has posture == IN_DEFAULT
                            WATCH                elif any has posture == AT_RISK
                            GOOD                 else
    input_set: "one Property plus all DefaultNotice rows of its plans; then all Property rows of the franchisee for the standing rollup"
    constants:
      COMPLIANT_MIN_SCORE: 80
    precision: "score compared with >=, so a score of exactly 80 is COMPLIANT and 79 is AT_RISK"

  - name: liquidated_damages
    trigger: "POST /pip/default-notices (issuance)"
    algorithm: aggregation
    formula: |
      breached = PipItem rows of the plan with is_overdue == true, ordered by priority_rank ascending
      notice.breached_item_ids = the ids of breached in that order
      exact_total = sum over breached of (item.approved_cost_cents * LD_RATE[item.category])   # exact rationals
      notice.liquidated_damages_cents = round_half_up(exact_total, 0)                          # ROUND ONCE, at the end
    input_set: "PipItem rows of the noticed plan whose is_overdue == true at the instant of issuance; items already WORK_COMPLETE, ACCEPTED, REMOVED_BY_DISPUTE or VOIDED are never overdue and never enter the sum"
    constants:
      LD_RATE: "{ LIFE_SAFETY: 0.15, GUEST_FACING: 0.08, BACK_OF_HOUSE: 0.03 }"
    precision: >-
      ROUNDING ORDER IS PINNED THE OTHER WAY ROUND from calculations.funding_requirement: sum the exact
      per-item products first and round the total once. An overdue LIFE_SAFETY item of 1000010 cents
      plus an overdue BACK_OF_HOUSE item of 555550 cents give 166668 (sum-then-round) where the
      per-item-then-sum order would give 166669.

  - name: reserve_availability
    trigger: "POST /pip/reserve-draws (creation) and ReserveDraw BRAND_CONSENTED -> DISBURSED"
    algorithm: waterfall_allocation
    formula: |
      encumbered_cents = sum of amount_cents over ReserveDraw rows of the property
                         with status IN {REQUESTED, BRAND_CONSENTED}
      available_for_draw_cents = max(0, property.reserve_balance_cents
                                        - property.minimum_retention_cents
                                        - encumbered_cents)
      # creation gate: the new amount_cents must be <= available_for_draw_cents, else ERR_INSUFFICIENT_RESERVE
      # disbursement gate: property.reserve_balance_cents - amount_cents >= property.minimum_retention_cents
      budget_headroom_cents = active_or_locked_budget.total_authorized_cents
                              - budget.committed_cents
                              - sum of amount_cents over other ReserveDraw rows of the same budget
                                with status IN {REQUESTED, BRAND_CONSENTED}
      # creation gate: the new amount_cents must be <= budget_headroom_cents, else ERR_DRAW_EXCEEDS_BUDGET
    input_set: "ReserveDraw rows of one property (for the reserve gate) and of one CapitalBudget (for the headroom gate); REJECTED and REVERSED draws release their encumbrance, DISBURSED draws have already left the balance"
    constants: {}
    precision: "integer cents; both gates use <= so a draw that consumes the availability exactly is admitted"

  - name: reserve_corpus_invariant
    trigger: "asserted after every ReserveDraw disbursement and after its compensating reversal"
    algorithm: aggregation
    formula: |
      corpus_in_cents = property.initial_reserve_balance_cents + property.reserve_contributed_total_cents
      outstanding_disbursed_cents = sum of amount_cents over ReserveDraw rows of the property
                                    with status == DISBURSED
      INVARIANT: property.reserve_balance_cents + outstanding_disbursed_cents == corpus_in_cents
      # A forward disbursement moves amount_cents from reserve_balance_cents into
      # outstanding_disbursed_cents; the compensating reversal moves it back and drops the draw out of
      # the DISBURSED set, so the named quantity is unchanged by the pair and no cent drifts.
    input_set: "one Property and every ReserveDraw row referencing it, in any status"
    constants: {}
    precision: "exact integer cents; conserved quantity: reserve cash corpus"

  - name: room_inventory_invariant
    trigger: "asserted after every RenovationPhase activation and after its compensating close-out or cancellation"
    algorithm: aggregation
    formula: |
      INVARIANT: property.rooms_out_of_service_current
                 == sum of rooms_out_of_service over RenovationPhase rows of the property's plans
                    with status == ACTIVE
      AND        property.rooms_out_of_service_current + rooms_sellable == property.room_count
                 where rooms_sellable is the derived count of keys available for sale
      # Activation debits rooms_sellable and credits rooms_out_of_service_current; close-out and
      # cancellation are the two compensating actions and both restore the split exactly, so the
      # conserved quantity (physical key inventory) never drifts even across a cancel cascade.
    input_set: "one Property and every RenovationPhase row of its plans, in any status"
    constants: {}
    precision: "exact integer key counts; conserved quantity: physical room inventory"

  - name: phase_window_conflict
    trigger: "POST /pip/renovation-phases (creation)"
    algorithm: interval_merge
    formula: |
      # Resource: the PipPlan's closure calendar. Intervals are CLOSED on both ends and are expanded
      # by a mandatory changeover buffer on the END side only; capacity is exactly one phase.
      for each other RenovationPhase p of the SAME plan_id with status IN {PLANNED, ACTIVE}:
        conflict = (new.start_date <= add_days(p.end_date, CHANGEOVER_BUFFER_DAYS))
                   AND (p.start_date <= add_days(new.end_date, CHANGEOVER_BUFFER_DAYS))
        if conflict -> ERR_PHASE_WINDOW_CONFLICT
      # Consequence: a phase ending 2026-09-10 admits a successor starting 2026-09-13 but rejects one
      # starting 2026-09-12. Adjacency is FORBIDDEN, unlike the contractor rule.
    input_set: "RenovationPhase rows of the same plan with status IN {PLANNED, ACTIVE}; CLOSED_OUT and CANCELLED phases free their window"
    constants:
      CHANGEOVER_BUFFER_DAYS: 2
    precision: "whole UTC dates, closed intervals, buffer applied to both candidates' end dates"

  - name: contractor_capacity_overlap
    trigger: "POST /pip/contractor-bookings (creation)"
    algorithm: interval_merge
    formula: |
      # Resource: the Contractor's crew capacity. Intervals are HALF-OPEN [start, end), no buffer, and
      # capacity is contractor.max_concurrent_bookings rather than one.
      occupants = count of ContractorBooking rows with contractor_id == new.contractor_id
                  AND status == BOOKED
                  AND new.start_datetime < existing.end_datetime
                  AND existing.start_datetime < new.end_datetime
      if occupants >= contractor.max_concurrent_bookings -> ERR_CONTRACTOR_DOUBLE_BOOKED
      # Consequence: a booking starting exactly at another's end_datetime does NOT overlap and is
      # always admitted, and a contractor with max_concurrent_bookings 2 admits a second genuinely
      # overlapping booking but rejects the third.
      # Containment gate (separate rule): new.start_datetime >= phase.start_date at 00:00:00Z AND
      # new.end_datetime <= add_days(phase.end_date, 1) at 00:00:00Z, else ERR_BOOKING_OUTSIDE_PHASE_WINDOW
    input_set: "ContractorBooking rows of one contractor with status == BOOKED; CANCELLED and COMPLETED bookings free their capacity"
    constants: {}
    precision: "ISO 8601 UTC instants, half-open intervals, strict < on both sides so touching endpoints never collide"

validations:
  # ---- 1..4 authentication and authorization ------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role header is present on every /pip/* request"
    error_id: ERR_MISSING_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of {FranchiseeOwner, BrandManager, BrandInspector}"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "X-User-ID header is present and 1..64 characters"
    error_id: ERR_MISSING_USER_ID
    http_status: 401
    applies_to: "all"
  - priority: 4
    category: auth
    check: "the presented X-User-Role appears in the endpoint's roles list in section 1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  # ---- 10..12 existence, path left-to-right then body FKs -----------------
  - priority: 10
    category: existence
    check: >-
      the {id} in the path resolves to an existing row of that collection, checked before any
      body field is read: ERR_FRANCHISEE_NOT_FOUND, ERR_PROPERTY_NOT_FOUND, ERR_PLAN_NOT_FOUND,
      ERR_ITEM_NOT_FOUND, ERR_EXTENSION_REQUEST_NOT_FOUND, ERR_BUDGET_NOT_FOUND,
      ERR_DRAW_NOT_FOUND, ERR_PHASE_NOT_FOUND, ERR_CONTRACTOR_NOT_FOUND,
      ERR_BOOKING_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_PUNCH_NOT_FOUND,
      ERR_DISPUTE_NOT_FOUND, ERR_NOTICE_NOT_FOUND, ERR_LEDGER_ENTRY_NOT_FOUND
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a path {id}"
  - priority: 11
    category: existence
    check: >-
      every FK supplied in the request body resolves to an existing row, in body-field
      declaration order (franchisee_id, property_id, plan_id, item_id / pip_item_id /
      purpose_item_id, predecessor_item_id, capital_budget_id, contractor_id, phase_id,
      inspection_id), each yielding that parent's NOT_FOUND error
    error_id: ERR_PROPERTY_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints that carry FK fields"
  - priority: 12
    category: existence
    check: "filter values supplied to a list endpoint that do not resolve yield an empty page, never a 404"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all GET list endpoints"

  # ---- 20..31 request shape, types, ranges and uniqueness -----------------
  - priority: 20
    category: business_constraint
    check: "every field marked required in section 1.1 is present and non-null"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST and PATCH endpoints"
  - priority: 21
    category: business_constraint
    check: "every enum-typed input field carries a value from its declared enum set"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST and PATCH endpoints"
  - priority: 22
    category: business_constraint
    check: >-
      numeric inputs respect their declared bounds: room_count >= 1, adr_baseline_cents >= 0,
      0 <= occupancy_baseline_pct <= 1, reserve_balance_cents >= 0, minimum_retention_cents >= 0,
      brand_estimated_cost_cents >= 0, requested_days >= 1, total_authorized_cents >= 1,
      amount_cents >= 1, rooms_out_of_service >= 1, crew_size >= 1, max_concurrent_bookings >= 1
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST and PATCH endpoints"
  - priority: 23
    category: business_constraint
    check: "pagination limit is 1..100 and offset is >= 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all GET list endpoints"
  - priority: 24
    category: business_constraint
    check: "start_date and end_date parse as ISO dates and end_date >= start_date"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /pip/renovation-phases"
  - priority: 25
    category: business_constraint
    check: "start_datetime and end_datetime parse as ISO 8601 UTC instants and end_datetime > start_datetime (a zero-length booking is rejected)"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /pip/contractor-bookings"
  - priority: 26
    category: business_constraint
    check: "rooms_affected_count == 0 when room_impacting == false, and rooms_affected_count >= 1 when room_impacting == true"
    error_id: ERR_ROOM_IMPACT_MISMATCH
    http_status: 422
    applies_to: "POST /pip/items, PATCH /pip/items/{id}"
  - priority: 27
    category: business_constraint
    check: "0 <= contingency_pct <= 0.50 with at most 4 decimal places"
    error_id: ERR_CONTINGENCY_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /pip/capital-budgets"
  - priority: 28
    category: business_constraint
    check: "1 <= cure_period_days <= CURE_MAX_DAYS (60)"
    error_id: ERR_CURE_PERIOD_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /pip/default-notices"
  - priority: 29
    category: business_constraint
    check: "business_justification length >= JUSTIFICATION_MIN_CHARS (40) after trimming"
    error_id: ERR_JUSTIFICATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /pip/extension-requests, POST /pip/extension-requests/{id}/resubmit"
  - priority: 30
    category: business_constraint
    check: "phase_number is unique among RenovationPhase rows of the same plan_id whose status != CANCELLED"
    error_id: ERR_PHASE_NUMBER_DUPLICATE
    http_status: 409
    applies_to: "POST /pip/renovation-phases"
  - priority: 31
    category: business_constraint
    check: "revised_cost_cents is present and >= 0 when resolution == REVISE, and absent when resolution IN {UPHOLD, REMOVE}"
    error_id: ERR_REVISION_COST_REQUIRED
    http_status: 422
    applies_to: "POST /pip/disputes/{id}/resolve"

  # ---- 34..41 state preconditions -----------------------------------------
  - priority: 34
    category: state
    check: >-
      the target row is in a state from which the requested action is declared in section 1.2:
      ERR_PLAN_NOT_ISSUABLE, ERR_PLAN_NOT_ACKNOWLEDGEABLE, ERR_PLAN_NOT_WITHDRAWABLE,
      ERR_ITEM_NOT_STARTABLE, ERR_ITEM_NOT_IN_PROGRESS, ERR_EXTENSION_NOT_DECIDABLE,
      ERR_EXTENSION_NOT_RESUBMITTABLE, ERR_BUDGET_NOT_APPROVABLE, ERR_BUDGET_NOT_LOCKABLE,
      ERR_DRAW_NOT_DECIDABLE, ERR_DRAW_NOT_DISBURSABLE, ERR_DRAW_NOT_REVERSIBLE,
      ERR_PHASE_NOT_ACTIVATABLE, ERR_PHASE_NOT_CLOSEABLE, ERR_INSPECTION_NOT_PERFORMABLE,
      ERR_INSPECTION_NOT_SIGNABLE, ERR_PUNCH_NOT_REMEDIABLE, ERR_PUNCH_NOT_VERIFIABLE,
      ERR_DISPUTE_NOT_RESOLVABLE, ERR_NOTICE_NOT_ACTIONABLE
    error_id: ERR_ITEM_NOT_STARTABLE
    http_status: 409
    applies_to: "all action endpoints"
    note: >-
      PRIORITY CONFLICT (A), higher half: on POST /pip/capital-budgets/{id}/lock a budget that is
      still DRAFT fails this state check at priority 34 while ALSO failing the fiscal
      funding-gap check at priority 90; the response is ERR_BUDGET_NOT_LOCKABLE (409), never
      ERR_BUDGET_UNDERFUNDED.
  - priority: 35
    category: state
    check: "the governing PipPlan.status is in the window the action requires (execution actions need OWNER_ACKNOWLEDGED or IN_EXECUTION)"
    error_id: ERR_PLAN_NOT_IN_EXECUTION_WINDOW
    http_status: 409
    applies_to: "POST /pip/items/{id}/start, POST /pip/renovation-phases/{id}/activate, POST /pip/capital-budgets/{id}/approve"
  - priority: 36
    category: state
    check: "scope edits require the plan to be DRAFT"
    error_id: ERR_PLAN_NOT_DRAFT
    http_status: 409
    applies_to: "POST /pip/items, PATCH /pip/items/{id}"
  - priority: 37
    category: state
    check: "the plan's Property.franchise_agreement_status != TERMINATED"
    error_id: ERR_FRANCHISE_TERMINATED
    http_status: 409
    applies_to: "POST /pip/plans, POST /pip/plans/{id}/issue, POST /pip/items, POST /pip/capital-budgets, POST /pip/renovation-phases, POST /pip/reserve-draws"
  - priority: 38
    category: state
    check: "no other ScopeDispute on the same item_id is still in status FILED"
    error_id: ERR_DISPUTE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /pip/disputes"
  - priority: 39
    category: state
    check: "the plan has no ScopeDispute in status FILED other than the one being resolved"
    error_id: ERR_DISPUTE_OPEN_BLOCKS_SIGNOFF
    http_status: 409
    applies_to: "POST /pip/disputes/{id}/resolve"
  - priority: 40
    category: state
    check: "the contested PipItem.status IN {SCOPED, DEFERRED_PENDING_EXTENSION, IN_PROGRESS} when resolution == REMOVE"
    error_id: ERR_ITEM_NOT_REMOVABLE
    http_status: 409
    applies_to: "POST /pip/disputes/{id}/resolve"
  - priority: 41
    category: state
    check: "only a COMPLETION inspection may be signed off; SCOPING, PROGRESS and RE_INSPECTION visits stop at PERFORMED"
    error_id: ERR_INSPECTION_TYPE_NOT_SIGNABLE
    http_status: 409
    applies_to: "POST /pip/inspections/{id}/sign-off"

  # ---- 44..45 optimistic concurrency (section 1.2.1) ----------------------
  - priority: 44
    category: state
    check: "body expected_plan_version equals the current PipPlan.version"
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /pip/capital-budgets, PATCH /pip/items/{id}"
  - priority: 45
    category: state
    check: "body expected_property_version equals the current Property.version"
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412
    applies_to: "POST /pip/reserve-draws"

  # ---- 50..57 safety and brand-standard compliance ------------------------
  - priority: 50
    category: business_safety
    check: >-
      a non-LIFE_SAFETY item may not start while any LIFE_SAFETY item of the same plan has
      is_overdue == true
    error_id: ERR_LIFE_SAFETY_PRIORITY_VIOLATION
    http_status: 409
    applies_to: "POST /pip/items/{id}/start"
    note: >-
      PRIORITY CONFLICT (B), higher half: a GUEST_FACING item whose predecessor is still
      IN_PROGRESS AND whose plan has an overdue LIFE_SAFETY item violates this rule at priority
      50 and the referential predecessor rule at priority 71; the response is
      ERR_LIFE_SAFETY_PRIORITY_VIOLATION (409), never ERR_PREDECESSOR_NOT_SATISFIED.
  - priority: 51
    category: business_safety
    check: >-
      an item with room_impacting == true may only start while a RenovationPhase of its plan is
      ACTIVE, covers the logical clock date inside its closed interval, and holds
      rooms_out_of_service >= item.rooms_affected_count
    error_id: ERR_NO_ACTIVE_PHASE_FOR_ROOM_WORK
    http_status: 409
    applies_to: "POST /pip/items/{id}/start"
  - priority: 52
    category: business_safety
    check: >-
      the property-wide out-of-service ratio may not exceed MAX_OOO_PCT (0.25): at phase creation
      (Property.rooms_out_of_service_current + new.rooms_out_of_service) / Property.room_count
      <= 0.25 and the same ratio is re-evaluated at activation against the then-current
      rooms_out_of_service_current; the comparison is <=, so a ratio of exactly 0.25 is admitted
      and only a ratio strictly greater than 0.25 is rejected
    error_id: ERR_OOO_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /pip/renovation-phases, POST /pip/renovation-phases/{id}/activate"
  - priority: 53
    category: business_safety
    check: "a PunchListItem with severity == CRITICAL may never be waived, only remediated and verified closed"
    error_id: ERR_CRITICAL_DEFECT_NOT_WAIVABLE
    http_status: 409
    applies_to: "POST /pip/punch-list-items/{id}/verify"
  - priority: 54
    category: business_safety
    check: "inspection.punch_open_count == 0 (no PunchListItem of the inspection is OPEN or REMEDIATED) before sign-off"
    error_id: ERR_PUNCH_LIST_OPEN
    http_status: 409
    applies_to: "POST /pip/inspections/{id}/sign-off"
  - priority: 55
    category: business_safety
    check: >-
      when at least one overdue item of the noticed plan has category == LIFE_SAFETY, the notice's
      cure_period_days may not exceed LIFE_SAFETY_CURE_MAX_DAYS (10)
    error_id: ERR_CURE_PERIOD_TOO_LONG_FOR_LIFE_SAFETY
    http_status: 422
    applies_to: "POST /pip/default-notices"
  - priority: 56
    category: business_safety
    check: >-
      a Contractor with trade == FIRE_PROTECTION may only be booked when contractor.brand_approved
      == true; the same applies to any contractor booked onto a phase of a plan that still has a
      LIFE_SAFETY item with status IN {SCOPED, DEFERRED_PENDING_EXTENSION, IN_PROGRESS}
    error_id: ERR_CONTRACTOR_NOT_BRAND_APPROVED
    http_status: 409
    applies_to: "POST /pip/contractor-bookings"
  - priority: 57
    category: business_safety
    check: "no PipItem of the phase's plan with room_impacting == true is still IN_PROGRESS when the phase is closed out"
    error_id: ERR_ROOM_WORK_STILL_IN_PROGRESS
    http_status: 409
    applies_to: "POST /pip/renovation-phases/{id}/close-out"

  # ---- 60..67 temporal windows and interval conflicts ---------------------
  - priority: 60
    category: business_temporal
    check: "date(logical clock) >= inspection.scheduled_date"
    error_id: ERR_INSPECTION_TOO_EARLY
    http_status: 409
    applies_to: "POST /pip/inspections/{id}/perform"
  - priority: 61
    category: business_temporal
    check: "date(logical clock) is strictly greater than notice.cure_deadline_date; on the deadline date itself escalation is refused"
    error_id: ERR_CURE_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /pip/default-notices/{id}/escalate"
  - priority: 62
    category: business_temporal
    check: >-
      the new phase's closed date interval, expanded by CHANGEOVER_BUFFER_DAYS (2) on the end
      side, must not intersect any PLANNED or ACTIVE phase of the SAME plan per
      calculations.phase_window_conflict; adjacency is forbidden
    error_id: ERR_PHASE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /pip/renovation-phases"
  - priority: 63
    category: business_temporal
    check: >-
      the count of BOOKED ContractorBooking rows of the same contractor whose half-open interval
      strictly overlaps the new one must be < contractor.max_concurrent_bookings per
      calculations.contractor_capacity_overlap; touching endpoints do not overlap
    error_id: ERR_CONTRACTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /pip/contractor-bookings"
  - priority: 64
    category: business_temporal
    check: >-
      the booking interval sits inside its phase's closure window: start_datetime >=
      phase.start_date at 00:00:00Z and end_datetime <= (phase.end_date + 1 day) at 00:00:00Z
    error_id: ERR_BOOKING_OUTSIDE_PHASE_WINDOW
    http_status: 422
    applies_to: "POST /pip/contractor-bookings"
  - priority: 65
    category: business_temporal
    check: >-
      for a plan that has been issued, a new phase's end_date may not fall after
      plan.back_of_house_deadline_date; for a DRAFT plan (no deadlines yet) the check is skipped
    error_id: ERR_PHASE_OUTSIDE_PLAN_HORIZON
    http_status: 422
    applies_to: "POST /pip/renovation-phases"
  - priority: 66
    category: business_temporal
    check: "at least one PipItem of the plan has is_overdue == true at the instant the notice is issued"
    error_id: ERR_NO_BREACH_TO_NOTICE
    http_status: 409
    applies_to: "POST /pip/default-notices"
  - priority: 67
    category: business_temporal
    check: >-
      an extension may only be requested while date(logical clock) <= item.deadline_date; once the
      item is already overdue the deadline can no longer be moved
    error_id: ERR_EXTENSION_AFTER_DEADLINE
    http_status: 409
    applies_to: "POST /pip/extension-requests"

  # ---- 70..80 referential coherence and duty separation -------------------
  - priority: 70
    category: business_referential
    check: "predecessor_item_id, when supplied, references a PipItem with the same plan_id"
    error_id: ERR_PREDECESSOR_PLAN_MISMATCH
    http_status: 422
    applies_to: "POST /pip/items, PATCH /pip/items/{id}"
  - priority: 71
    category: business_referential
    check: "item.predecessor_item_id is null or the predecessor's status IN {WORK_COMPLETE, ACCEPTED, REMOVED_BY_DISPUTE}"
    error_id: ERR_PREDECESSOR_NOT_SATISFIED
    http_status: 409
    applies_to: "POST /pip/items/{id}/start"
    note: "PRIORITY CONFLICT (B), lower half: loses to the life-safety rule at priority 50."
  - priority: 72
    category: business_referential
    check: "predecessor_item_id does not equal the item's own id and does not close a cycle in the predecessor chain"
    error_id: ERR_PREDECESSOR_CYCLE
    http_status: 422
    applies_to: "POST /pip/items, PATCH /pip/items/{id}"
  - priority: 73
    category: business_referential
    check: "the contested item_id belongs to the supplied plan_id"
    error_id: ERR_ITEM_PLAN_MISMATCH
    http_status: 422
    applies_to: "POST /pip/disputes"
  - priority: 74
    category: business_referential
    check: "pip_item_id belongs to the plan of the supplied inspection_id"
    error_id: ERR_ITEM_PLAN_MISMATCH
    http_status: 422
    applies_to: "POST /pip/punch-list-items"
  - priority: 75
    category: business_referential
    check: "purpose_item_id belongs to the same plan_id as capital_budget_id"
    error_id: ERR_DRAW_ITEM_PLAN_MISMATCH
    http_status: 422
    applies_to: "POST /pip/reserve-draws"
  - priority: 76
    category: business_referential
    check: "property_id equals the property_id of the plan that capital_budget_id funds"
    error_id: ERR_DRAW_PROPERTY_MISMATCH
    http_status: 422
    applies_to: "POST /pip/reserve-draws"
  - priority: 77
    category: business_referential
    check: "X-User-ID equals the Property.franchisee_id of the governing property for every owner-side action"
    error_id: ERR_NOT_PROPERTY_FRANCHISEE
    http_status: 403
    applies_to: "POST /pip/plans/{id}/acknowledge, POST /pip/items/{id}/start, POST /pip/items/{id}/complete-work, POST /pip/capital-budgets/{id}/lock, POST /pip/reserve-draws/{id}/disburse, POST /pip/reserve-draws/{id}/reverse, POST /pip/renovation-phases/{id}/activate, POST /pip/renovation-phases/{id}/close-out, POST /pip/punch-list-items/{id}/remediate, POST /pip/extension-requests/{id}/resubmit"
  - priority: 78
    category: business_referential
    check: "X-User-ID equals inspection.inspector_user_id (for punch verification, the inspector_user_id of the defect's inspection)"
    error_id: ERR_NOT_ASSIGNED_INSPECTOR
    http_status: 403
    applies_to: "POST /pip/inspections/{id}/perform, POST /pip/inspections/{id}/sign-off, POST /pip/punch-list-items/{id}/verify"
  - priority: 79
    category: business_referential
    check: >-
      segregation of duties: the X-User-ID signing off a COMPLETION inspection must differ from
      plan.issued_by_user_id, so the user who issued the plan can never certify its completion
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /pip/inspections/{id}/sign-off"
  - priority: 80
    category: business_referential
    check: "plan.dispute_state != DISPUTE_OPEN at sign-off"
    error_id: ERR_DISPUTE_OPEN_BLOCKS_SIGNOFF
    http_status: 409
    applies_to: "POST /pip/inspections/{id}/sign-off"

  # ---- 84..87 aggregate and quota constraints ----------------------------
  - priority: 84
    category: business_constraint
    check: "the item has no ExtensionRequest with status IN {SUBMITTED, NEEDS_MORE_JUSTIFICATION}"
    error_id: ERR_EXTENSION_ALREADY_PENDING
    http_status: 409
    applies_to: "POST /pip/extension-requests"
  - priority: 85
    category: business_constraint
    check: "request.round_number < MAX_EXTENSION_ROUNDS (3) before a resubmission is accepted"
    error_id: ERR_EXTENSION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /pip/extension-requests/{id}/resubmit"
  - priority: 86
    category: business_constraint
    check: >-
      calculations.extension_grant_cap yields granted_days >= 1; a request whose category budget
      is already consumed (item.extension_days_granted == CATEGORY_MAX_EXT_DAYS) or whose
      schedule-pressure clamp leaves no room is refused rather than granted zero days
    error_id: ERR_EXTENSION_CAP_EXHAUSTED
    http_status: 409
    applies_to: "POST /pip/extension-requests/{id}/decide"
  - priority: 87
    category: business_constraint
    check: "the plan carries at least one PipItem with status == SCOPED at issuance"
    error_id: ERR_PLAN_HAS_NO_ITEMS
    http_status: 409
    applies_to: "POST /pip/plans/{id}/issue"

  # ---- 90..97 fiscal capacity, checked last ------------------------------
  - priority: 90
    category: business_fiscal
    check: "plan.funding_gap_cents == 0 before an APPROVED budget may be locked"
    error_id: ERR_BUDGET_UNDERFUNDED
    http_status: 409
    applies_to: "POST /pip/capital-budgets/{id}/lock"
    note: "PRIORITY CONFLICT (A), lower half: loses to the state check at priority 34."
  - priority: 92
    category: business_fiscal
    check: "the plan's active CapitalBudget exists and its status == LOCKED before any item may start"
    error_id: ERR_BUDGET_NOT_LOCKED
    http_status: 409
    applies_to: "POST /pip/items/{id}/start"
  - priority: 93
    category: business_fiscal
    check: "the draw's CapitalBudget.status IN {APPROVED, LOCKED, UNDERFUNDED} at consent time"
    error_id: ERR_BUDGET_NOT_FUNDABLE
    http_status: 409
    applies_to: "POST /pip/reserve-draws/{id}/consent"
  - priority: 94
    category: business_fiscal
    check: >-
      amount_cents <= calculations.reserve_availability.available_for_draw_cents, i.e. the reserve
      balance less minimum_retention_cents less the amounts already encumbered by REQUESTED and
      BRAND_CONSENTED draws; two individually affordable draws that collectively breach the floor
      are caught here
    error_id: ERR_INSUFFICIENT_RESERVE
    http_status: 409
    applies_to: "POST /pip/reserve-draws"
  - priority: 95
    category: business_fiscal
    check: "amount_cents <= calculations.reserve_availability.budget_headroom_cents for the referenced CapitalBudget"
    error_id: ERR_DRAW_EXCEEDS_BUDGET
    http_status: 409
    applies_to: "POST /pip/reserve-draws"
  - priority: 96
    category: business_fiscal
    check: "Property.reserve_balance_cents - draw.amount_cents >= Property.minimum_retention_cents, re-evaluated at disbursement"
    error_id: ERR_INSUFFICIENT_RESERVE
    http_status: 409
    applies_to: "POST /pip/reserve-draws/{id}/disburse"
  - priority: 97
    category: business_fiscal
    check: "the draw's CapitalBudget.status != CLOSED before a disbursement may be reversed"
    error_id: ERR_BUDGET_CLOSED
    http_status: 409
    applies_to: "POST /pip/reserve-draws/{id}/reverse"

endpoints:
  # ---- FranchiseeAccount --------------------------------------------------
  - method: POST
    path: "/pip/franchisee-accounts"
    description: "Register a franchisee entity. The returned id is the value a FranchiseeOwner presents in X-User-ID."
    roles: [BrandManager]
    code: 201
    input: [legal_name, contact_email]
    output: FranchiseeAccount
    side_effects: ["standing initialised to GOOD", "portfolio_property_count initialised to 0"]
  - method: GET
    path: "/pip/franchisee-accounts/{id}"
    description: "Read one franchisee account including its computed portfolio standing."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: FranchiseeAccount
    side_effects: []
  - method: GET
    path: "/pip/franchisee-accounts"
    description: "Paginated list of franchisee accounts, optionally filtered by computed standing."
    roles: [BrandManager, BrandInspector]
    code: 200
    input: ["standing?", "limit?", "offset?"]
    output: FranchiseeAccount[]
    side_effects: []

  # ---- Property -----------------------------------------------------------
  - method: POST
    path: "/pip/properties"
    description: "Register a property under a franchisee, with its room count, revenue baselines and FF&E reserve position."
    roles: [BrandManager]
    code: 201
    input: [franchisee_id, brand_code, name, room_count, adr_baseline_cents, occupancy_baseline_pct, reserve_balance_cents, minimum_retention_cents]
    output: Property
    side_effects:
      - "initial_reserve_balance_cents is pinned to the supplied reserve_balance_cents and never changes again"
      - "franchise_agreement_status ACTIVE, compliance_risk_score 100, compliance_posture COMPLIANT, rooms_out_of_service_current 0"
      - "increments FranchiseeAccount.portfolio_property_count by 1"
  - method: GET
    path: "/pip/properties/{id}"
    description: "Read one property, including reserve_balance_cents, rooms_out_of_service_current, compliance_risk_score, compliance_posture and version. This is the read a client uses before an expected_property_version write."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/pip/properties"
    description: "Paginated list of properties, optionally filtered by owning franchisee or computed posture."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: ["franchisee_id?", "compliance_posture?", "limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: PATCH
    path: "/pip/properties/{id}"
    description: "Brand-side correction of a property's revenue baselines or reserve retention floor. Does not retroactively rewrite displacement figures already computed on ACTIVE or CLOSED_OUT phases."
    roles: [BrandManager]
    code: 200
    input: ["adr_baseline_cents?", "occupancy_baseline_pct?", "minimum_retention_cents?", "room_count?"]
    output: Property
    side_effects:
      - "increments Property.version by 1"
      - "later phase activations read the new baselines, so calculations.displacement_revenue_impact yields a different figure than the create-time projection"
  - method: POST
    path: "/pip/properties/{id}/reserve-contributions"
    description: "Credit a monthly FF&E reserve contribution to the property's reserve fund."
    roles: [FranchiseeOwner]
    code: 200
    input: [amount_cents]
    output: Property
    side_effects:
      - "reserve_balance_cents += amount_cents and reserve_contributed_total_cents += amount_cents, so the reserve-corpus invariant of calculations.reserve_corpus_invariant still balances"
      - "increments Property.version by 1"
  - method: GET
    path: "/pip/properties/{id}/risk-summary"
    description: "Computed read returning both variants of calculations.compliance_risk_score side by side plus the inputs that produced them."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: "{ property_id: string, snapshot_score: integer, snapshot_posture: enum, projected_score: integer, projected_posture: enum, projection_horizon_days: integer, overdue_life_safety_count: integer, overdue_guest_facing_count: integer, overdue_back_of_house_count: integer, projected_life_safety_count: integer, projected_guest_facing_count: integer, projected_back_of_house_count: integer, funding_gap_cents: integer, funding_gap_penalty: integer, open_major_defect_count: integer, open_critical_defect_count: integer, open_plan_count: integer }"
    side_effects: []

  # ---- PipPlan ------------------------------------------------------------
  - method: POST
    path: "/pip/plans"
    description: "Scope a new property improvement plan in DRAFT against a property, pinned to a standards edition."
    roles: [BrandManager]
    code: 201
    input: [property_id, trigger_type, standards_edition]
    output: PipPlan
    side_effects: ["status DRAFT, dispute_state NONE, all deadline dates null, all cost aggregates 0"]
  - method: GET
    path: "/pip/plans/{id}"
    description: "Read one plan, including status, dispute_state, the three category deadlines, the cost aggregates and version. This is the read a client uses before an expected_plan_version write."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: PipPlan
    side_effects: []
  - method: GET
    path: "/pip/plans"
    description: "Paginated list of plans, optionally filtered by property, lifecycle status or dispute dimension."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: ["property_id?", "status?", "dispute_state?", "limit?", "offset?"]
    output: PipPlan[]
    side_effects: []
  - method: POST
    path: "/pip/plans/{id}/issue"
    description: "Issue the plan to the owner: freezes the scope, stamps the three category deadlines and publishes the cost and funding aggregates."
    roles: [BrandManager]
    code: 200
    input: []
    output: PipPlan
    side_effects:
      - "PipPlan DRAFT -> ISSUED; issued_by_user_id = X-User-ID (the id barred from signing off the completion inspection); issued_at = logical clock"
      - "runs calculations.category_deadline_schedule, calculations.item_priority_ranking, calculations.plan_scope_cost (both variants) and calculations.funding_requirement"
      - "appends a SCOPE_ISSUED ComplianceLedgerEntry"
      - "recomputes Property.open_plan_count, compliance_risk_score, compliance_posture and FranchiseeAccount.standing"
      - "increments PipPlan.version by 1"
  - method: POST
    path: "/pip/plans/{id}/acknowledge"
    description: "Owner records contractual receipt of the issued plan, opening the execution window."
    roles: [FranchiseeOwner]
    code: 200
    input: []
    output: PipPlan
    side_effects: ["PipPlan ISSUED -> OWNER_ACKNOWLEDGED", "increments PipPlan.version by 1"]
  - method: POST
    path: "/pip/plans/{id}/withdraw"
    description: "Brand withdraws a DRAFT or ISSUED plan; every still-open item is voided."
    roles: [BrandManager]
    code: 200
    input: []
    output: PipPlan
    side_effects:
      - "PipPlan -> WITHDRAWN and every PipItem in {SCOPED, DEFERRED_PENDING_EXTENSION} -> VOIDED"
      - "recomputes Property.open_plan_count, compliance_risk_score, compliance_posture and FranchiseeAccount.standing"
      - "increments PipPlan.version by 1"
  - method: GET
    path: "/pip/plans/{id}/cost-summary"
    description: "Computed read returning both variants of calculations.plan_scope_cost together with the funding figures derived from the brand variant only."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: "{ plan_id: string, included_item_count: integer, brand_scoped_total_cents: integer, owner_claimed_total_cents: integer, variance_cents: integer, variance_pct: number, contingency_pct_applied: number, funding_requirement_cents: integer, authorized_cents: integer, funding_gap_cents: integer, funding_gap_pct: number }"
    side_effects: []
  - method: POST
    path: "/pip/plans/{id}/compliance-sweep"
    description: "Brand-side sweep that re-evaluates every deadline of the plan against the current logical clock and republishes the derived compliance fields. This is the operator action that turns the passage of logical time into recorded overdue state."
    roles: [BrandManager]
    code: 200
    input: []
    output: PipPlan
    side_effects:
      - "recomputes PipItem.is_overdue on every item of the plan and plan.overdue_item_count"
      - "recomputes Property.compliance_risk_score (as_of_snapshot variant) and Property.compliance_posture, then FranchiseeAccount.standing"
      - "increments PipPlan.version by 1"

  # ---- PipItem ------------------------------------------------------------
  - method: POST
    path: "/pip/items"
    description: "Add a scoped item to a DRAFT plan, with its category, standards clause, brand estimate and room impact."
    roles: [BrandManager]
    code: 201
    input: [plan_id, category, standards_reference, brand_estimated_cost_cents, room_impacting, "rooms_affected_count?", "predecessor_item_id?"]
    output: PipItem
    side_effects:
      - "status SCOPED; approved_cost_cents = brand_estimated_cost_cents; deadline_date and priority_rank stay null while the plan is DRAFT"
      - "recomputes plan.scope_item_count and both variants of calculations.plan_scope_cost"
      - "increments PipPlan.version by 1"
  - method: GET
    path: "/pip/items/{id}"
    description: "Read one scoped item, including approved_cost_cents, item_funding_cents, deadline_date, priority_rank and is_overdue."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: PipItem
    side_effects: []
  - method: GET
    path: "/pip/items"
    description: "Paginated list of scoped items, filterable by plan, by sequencing predecessor, by category, by status or by overdue flag."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: ["plan_id?", "predecessor_item_id?", "category?", "status?", "is_overdue?", "limit?", "offset?"]
    output: PipItem[]
    side_effects: []
  - method: PATCH
    path: "/pip/items/{id}"
    description: "Revise a scoped item while its plan is still DRAFT. Guarded by expected_plan_version because each revision rewrites the plan's cost aggregates and a revision computed against superseded aggregates must not land."
    roles: [BrandManager]
    code: 200
    input: [expected_plan_version, "brand_estimated_cost_cents?", "standards_reference?", "category?", "room_impacting?", "rooms_affected_count?", "predecessor_item_id?"]
    output: PipItem
    side_effects:
      - "rewrites the supplied fields and re-derives approved_cost_cents from brand_estimated_cost_cents"
      - "recomputes plan.scope_item_count, both variants of calculations.plan_scope_cost and calculations.funding_requirement"
      - "increments PipItem.version by 1 and increments PipPlan.version by 1"
  - method: POST
    path: "/pip/items/{id}/start"
    description: "Owner starts work on a scoped item. This is the most heavily guarded action in the domain: budget lock, sequencing predecessor, life-safety precedence and room-closure coverage are all checked."
    roles: [FranchiseeOwner]
    code: 200
    input: []
    output: PipItem
    side_effects:
      - "PipItem SCOPED -> IN_PROGRESS"
      - "cascades PipPlan OWNER_ACKNOWLEDGED -> IN_EXECUTION on the first started item, then recomputes Property.compliance_risk_score, Property.compliance_posture and FranchiseeAccount.standing"
      - "increments PipItem.version by 1"
  - method: POST
    path: "/pip/items/{id}/complete-work"
    description: "Owner reports the item's work finished, clearing its overdue flag and possibly making the whole plan ready for the completion inspection."
    roles: [FranchiseeOwner]
    code: 200
    input: []
    output: PipItem
    side_effects:
      - "PipItem IN_PROGRESS -> WORK_COMPLETE and is_overdue -> false"
      - "re-evaluates the compound PipPlan IN_EXECUTION -> READY_FOR_COMPLETION_INSPECTION condition"
      - "recomputes Property.compliance_risk_score, Property.compliance_posture and FranchiseeAccount.standing"
      - "increments PipItem.version by 1"

  # ---- ExtensionRequest ---------------------------------------------------
  - method: POST
    path: "/pip/extension-requests"
    description: "Owner asks the brand to move a scoped item's deadline, with a written business justification."
    roles: [FranchiseeOwner]
    code: 201
    input: [item_id, requested_days, business_justification]
    output: ExtensionRequest
    side_effects:
      - "status SUBMITTED, round_number 1, granted_days 0"
      - "the charged PipItem moves SCOPED -> DEFERRED_PENDING_EXTENSION without its deadline_date changing"
      - "increments PipItem.version by 1"
  - method: GET
    path: "/pip/extension-requests/{id}"
    description: "Read one extension request, including granted_days and the pressure ratio recorded at decision time."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: ExtensionRequest
    side_effects: []
  - method: GET
    path: "/pip/extension-requests"
    description: "Paginated list of extension requests, filterable by the item whose deadline they target."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: ["item_id?", "status?", "limit?", "offset?"]
    output: ExtensionRequest[]
    side_effects: []
  - method: POST
    path: "/pip/extension-requests/{id}/decide"
    description: "Brand approves, denies or sends the request back for more justification. On APPROVE the grant is clamped by calculations.extension_grant_cap, and the server -- not the caller -- decides between APPROVED and APPROVED_PARTIAL."
    roles: [BrandManager]
    code: 200
    input: [decision, "granted_days?", "decision_note?"]
    output: ExtensionRequest
    side_effects:
      - "runs calculations.extension_grant_cap in its pinned six-step order and stores granted_days and pressure_ratio_at_decision"
      - "on APPROVED / APPROVED_PARTIAL: item.extension_days_granted += granted_days, item.deadline_date moves out by the same number of days, and an EXTENSION_GRANTED ComplianceLedgerEntry is appended"
      - "the charged PipItem returns DEFERRED_PENDING_EXTENSION -> SCOPED on APPROVE and DENY, and stays DEFERRED_PENDING_EXTENSION on REQUEST_MORE_JUSTIFICATION"
      - "recomputes item.is_overdue, plan.overdue_item_count, Property.compliance_risk_score, Property.compliance_posture and FranchiseeAccount.standing"
  - method: POST
    path: "/pip/extension-requests/{id}/resubmit"
    description: "Owner strengthens a request the brand sent back, consuming one of the bounded revision rounds."
    roles: [FranchiseeOwner]
    code: 200
    input: [requested_days, business_justification]
    output: ExtensionRequest
    side_effects:
      - "ExtensionRequest NEEDS_MORE_JUSTIFICATION -> SUBMITTED with round_number += 1 and the replacement justification and day count stored"

  # ---- CapitalBudget ------------------------------------------------------
  - method: POST
    path: "/pip/capital-budgets"
    description: "Owner authorises capital for the plan. A new budget legitimately supersedes the plan's prior budget, so this create is guarded by expected_plan_version rather than by a state precondition."
    roles: [FranchiseeOwner]
    code: 201
    input: [plan_id, total_authorized_cents, contingency_pct, financing_source, expected_plan_version]
    output: CapitalBudget
    side_effects:
      - "any existing budget of the plan in {DRAFT, APPROVED, LOCKED, UNDERFUNDED} becomes SUPERSEDED"
      - "recomputes calculations.funding_requirement with the new contingency_pct, then plan.funding_gap_cents"
      - "increments PipPlan.version by 1"
  - method: GET
    path: "/pip/capital-budgets/{id}"
    description: "Read one capital budget, including committed_cents and status."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: CapitalBudget
    side_effects: []
  - method: GET
    path: "/pip/capital-budgets"
    description: "Paginated list of capital budgets, filterable by the plan they fund."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: ["plan_id?", "status?", "financing_source?", "limit?", "offset?"]
    output: CapitalBudget[]
    side_effects: []
  - method: POST
    path: "/pip/capital-budgets/{id}/approve"
    description: "Brand consents to the owner's authorised capital."
    roles: [BrandManager]
    code: 200
    input: []
    output: CapitalBudget
    side_effects: ["CapitalBudget DRAFT -> APPROVED with approved_by_user_id = X-User-ID", "increments CapitalBudget.version by 1"]
  - method: POST
    path: "/pip/capital-budgets/{id}/lock"
    description: "Owner locks the approved budget, which is the gate every item start reads. Refused while the plan carries a funding gap."
    roles: [FranchiseeOwner]
    code: 200
    input: []
    output: CapitalBudget
    side_effects: ["CapitalBudget APPROVED -> LOCKED", "increments CapitalBudget.version by 1"]

  # ---- ReserveDraw --------------------------------------------------------
  - method: POST
    path: "/pip/reserve-draws"
    description: "Owner requests a draw on the FF&E reserve for a specific scoped item. Two draws that each fit inside the available headroom are both legitimate, so this create is guarded by expected_property_version."
    roles: [FranchiseeOwner]
    code: 201
    input: [property_id, capital_budget_id, purpose_item_id, amount_cents, expected_property_version]
    output: ReserveDraw
    side_effects:
      - "status REQUESTED; the amount becomes encumbered and lowers calculations.reserve_availability for the next draw"
      - "increments Property.version by 1"
  - method: GET
    path: "/pip/reserve-draws/{id}"
    description: "Read one reserve draw, including its status and disbursement instant."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: ReserveDraw
    side_effects: []
  - method: GET
    path: "/pip/reserve-draws"
    description: "Paginated list of reserve draws, filterable by property, by funding budget or by the scoped item the draw pays for."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: ["property_id?", "capital_budget_id?", "purpose_item_id?", "status?", "limit?", "offset?"]
    output: ReserveDraw[]
    side_effects: []
  - method: POST
    path: "/pip/reserve-draws/{id}/consent"
    description: "Brand consents to or rejects a requested draw on the reserve."
    roles: [BrandManager]
    code: 200
    input: [decision]
    output: ReserveDraw
    side_effects:
      - "ReserveDraw REQUESTED -> BRAND_CONSENTED or REQUESTED -> REJECTED with consented_by_user_id = X-User-ID"
      - "a REJECTED draw stops being encumbered, raising calculations.reserve_availability"
  - method: POST
    path: "/pip/reserve-draws/{id}/disburse"
    description: "Owner draws the consented amount out of the reserve fund and commits it against the budget."
    roles: [FranchiseeOwner]
    code: 200
    input: []
    output: ReserveDraw
    side_effects:
      - "ReserveDraw BRAND_CONSENTED -> DISBURSED with disbursed_at = logical clock"
      - "Property.reserve_balance_cents -= amount_cents and CapitalBudget.committed_cents += amount_cents"
      - "appends a DRAW_DISBURSED ComplianceLedgerEntry"
      - "increments Property.version by 1"
  - method: POST
    path: "/pip/reserve-draws/{id}/reverse"
    description: "Compensating action for a disbursement booked in error: the cash returns to the reserve and the budget commitment is released."
    roles: [FranchiseeOwner]
    code: 200
    input: []
    output: ReserveDraw
    side_effects:
      - "ReserveDraw DISBURSED -> REVERSED"
      - "Property.reserve_balance_cents += amount_cents and CapitalBudget.committed_cents -= amount_cents, restoring calculations.reserve_corpus_invariant exactly"
      - "appends a DRAW_REVERSED ComplianceLedgerEntry"
      - "increments Property.version by 1"

  # ---- RenovationPhase ----------------------------------------------------
  - method: POST
    path: "/pip/renovation-phases"
    description: "Owner schedules a phased room closure for the plan. The closed date interval plus a two-day changeover buffer may not collide with another phase of the same plan, and the property-wide out-of-service cap is checked here and again at activation."
    roles: [FranchiseeOwner]
    code: 201
    input: [plan_id, phase_number, start_date, end_date, rooms_out_of_service]
    output: RenovationPhase
    side_effects:
      - "status PLANNED; ooo_pct_at_activation stays null"
      - "projects displacement_revenue_impact_cents per calculations.displacement_revenue_impact against the property's current baselines"
  - method: GET
    path: "/pip/renovation-phases/{id}"
    description: "Read one renovation phase, including its displacement revenue impact and activation ratio."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: RenovationPhase
    side_effects: []
  - method: GET
    path: "/pip/renovation-phases"
    description: "Paginated list of renovation phases, filterable by the plan whose closures they schedule."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: ["plan_id?", "status?", "limit?", "offset?"]
    output: RenovationPhase[]
    side_effects: []
  - method: POST
    path: "/pip/renovation-phases/{id}/activate"
    description: "Owner takes the phase's keys out of service. The out-of-service cap is re-evaluated against the property's current position, not against the projection made at creation."
    roles: [FranchiseeOwner]
    code: 200
    input: []
    output: RenovationPhase
    side_effects:
      - "RenovationPhase PLANNED -> ACTIVE"
      - "Property.rooms_out_of_service_current += rooms_out_of_service, holding calculations.room_inventory_invariant"
      - "recomputes displacement_revenue_impact_cents and writes ooo_pct_at_activation"
      - "increments Property.version by 1"
  - method: POST
    path: "/pip/renovation-phases/{id}/close-out"
    description: "Owner returns the phase's keys to inventory and completes the crews booked onto it."
    roles: [FranchiseeOwner]
    code: 200
    input: []
    output: RenovationPhase
    side_effects:
      - "RenovationPhase ACTIVE -> CLOSED_OUT"
      - "Property.rooms_out_of_service_current -= rooms_out_of_service, restoring calculations.room_inventory_invariant"
      - "every BOOKED ContractorBooking of the phase becomes COMPLETED, freeing that contractor's capacity"
      - "increments Property.version by 1"

  # ---- Contractor and ContractorBooking -----------------------------------
  - method: POST
    path: "/pip/contractors"
    description: "Register a contractor with its trade, brand vetting flag and concurrent-crew capacity."
    roles: [BrandManager]
    code: 201
    input: [name, trade, "brand_approved?", "max_concurrent_bookings?"]
    output: Contractor
    side_effects: ["brand_approved defaults to false and max_concurrent_bookings defaults to 1"]
  - method: GET
    path: "/pip/contractors/{id}"
    description: "Read one contractor, including its concurrent-booking capacity."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: Contractor
    side_effects: []
  - method: GET
    path: "/pip/contractors"
    description: "Paginated list of contractors, filterable by trade and brand vetting."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: ["trade?", "brand_approved?", "limit?", "offset?"]
    output: Contractor[]
    side_effects: []
  - method: POST
    path: "/pip/contractor-bookings"
    description: "Book a contractor crew onto a phase for a half-open time interval. Capacity is the contractor's max_concurrent_bookings, and touching endpoints do not collide."
    roles: [FranchiseeOwner]
    code: 201
    input: [contractor_id, phase_id, start_datetime, end_datetime, crew_size]
    output: ContractorBooking
    side_effects:
      - "status BOOKED; the interval starts occupying contractor capacity for calculations.contractor_capacity_overlap"
  - method: GET
    path: "/pip/contractor-bookings/{id}"
    description: "Read one contractor booking."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: ContractorBooking
    side_effects: []
  - method: GET
    path: "/pip/contractor-bookings"
    description: "Paginated list of bookings, filterable by contractor or by the phase whose window they sit inside. This is the only channel through which cascade-created CANCELLED and COMPLETED bookings can be observed."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: ["contractor_id?", "phase_id?", "status?", "limit?", "offset?"]
    output: ContractorBooking[]
    side_effects: []

  # ---- BrandInspection ----------------------------------------------------
  - method: POST
    path: "/pip/inspections"
    description: "Schedule a brand inspection against the plan and assign the inspector user id that alone may perform and sign it off."
    roles: [BrandManager]
    code: 201
    input: [plan_id, inspection_type, inspector_user_id, scheduled_date]
    output: BrandInspection
    side_effects: ["status SCHEDULED, punch_open_count 0"]
  - method: GET
    path: "/pip/inspections/{id}"
    description: "Read one inspection, including punch_open_count and sign-off stamps."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: BrandInspection
    side_effects: []
  - method: GET
    path: "/pip/inspections"
    description: "Paginated list of inspections, filterable by the plan being inspected."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: ["plan_id?", "inspection_type?", "status?", "limit?", "offset?"]
    output: BrandInspection[]
    side_effects: []
  - method: POST
    path: "/pip/inspections/{id}/perform"
    description: "Assigned inspector records the visit as performed, on or after its scheduled date."
    roles: [BrandInspector]
    code: 200
    input: []
    output: BrandInspection
    side_effects: ["BrandInspection SCHEDULED -> PERFORMED with performed_at = logical clock", "recomputes punch_open_count"]
  - method: POST
    path: "/pip/inspections/{id}/sign-off"
    description: "Assigned inspector certifies a COMPLETION inspection, which completes the plan. Refused to the user id that issued the plan, refused while any defect is open and refused while a scope dispute is open."
    roles: [BrandInspector]
    code: 200
    input: []
    output: BrandInspection
    side_effects:
      - "BrandInspection PERFORMED -> SIGNED_OFF with signed_off_at and signed_off_by_user_id"
      - "PipPlan READY_FOR_COMPLETION_INSPECTION -> COMPLETED, every WORK_COMPLETE item -> ACCEPTED, every ACTIVE phase -> CLOSED_OUT with its keys returned and its bookings COMPLETED, and the active CapitalBudget -> CLOSED"
      - "appends a PLAN_COMPLETED ComplianceLedgerEntry"
      - "recomputes Property.open_plan_count, compliance_risk_score, compliance_posture and FranchiseeAccount.standing"

  # ---- PunchListItem ------------------------------------------------------
  - method: POST
    path: "/pip/punch-list-items"
    description: "Inspector raises a punch-list defect against a scoped item of the inspected plan. Its cure deadline is date(logical clock) + PUNCH_CURE_DAYS (14)."
    roles: [BrandInspector]
    code: 201
    input: [inspection_id, pip_item_id, defect_note, severity]
    output: PunchListItem
    side_effects:
      - "status OPEN and cure_deadline_date = date(logical clock) + 14 days"
      - "inspection.punch_open_count += 1"
      - "a MAJOR or CRITICAL defect knocks the charged PipItem WORK_COMPLETE -> PUNCH_FAIL and reverts PipPlan READY_FOR_COMPLETION_INSPECTION -> IN_EXECUTION; a MINOR defect does neither"
      - "recomputes Property.compliance_risk_score and Property.compliance_posture"
  - method: GET
    path: "/pip/punch-list-items/{id}"
    description: "Read one punch-list defect."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: PunchListItem
    side_effects: []
  - method: GET
    path: "/pip/punch-list-items"
    description: "Paginated list of defects, filterable by the raising inspection or by the scoped item they are charged against."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: ["inspection_id?", "pip_item_id?", "severity?", "status?", "limit?", "offset?"]
    output: PunchListItem[]
    side_effects: []
  - method: POST
    path: "/pip/punch-list-items/{id}/remediate"
    description: "Owner reports the defect fixed and ready for re-verification. The defect still counts as open until the inspector acts."
    roles: [FranchiseeOwner]
    code: 200
    input: []
    output: PunchListItem
    side_effects: ["PunchListItem OPEN -> REMEDIATED; punch_open_count and the risk-score defect penalty are unchanged"]
  - method: POST
    path: "/pip/punch-list-items/{id}/verify"
    description: "Inspector closes, reopens or waives a defect. CRITICAL defects can never be waived, and the reopen loop may run any number of times."
    roles: [BrandInspector]
    code: 200
    input: [outcome, "verification_note?"]
    output: PunchListItem
    side_effects:
      - "CLOSE: -> VERIFIED_CLOSED and punch_open_count -= 1; REOPEN: -> OPEN with punch_open_count unchanged; WAIVE: -> WAIVED, punch_open_count -= 1 and a PUNCH_WAIVED ComplianceLedgerEntry appended"
      - "when every defect charged to the same PipItem is VERIFIED_CLOSED or WAIVED, the item returns PUNCH_FAIL -> WORK_COMPLETE and the plan re-evaluates the compound READY_FOR_COMPLETION_INSPECTION condition"
      - "recomputes Property.compliance_risk_score and Property.compliance_posture"

  # ---- ScopeDispute -------------------------------------------------------
  - method: POST
    path: "/pip/disputes"
    description: "Owner contests a scoped item's reasonableness or cost, publishing its own cost figure and opening the plan's dispute dimension without touching its lifecycle dimension."
    roles: [FranchiseeOwner]
    code: 201
    input: [plan_id, item_id, dispute_basis, claimed_cost_cents]
    output: ScopeDispute
    side_effects:
      - "status FILED with filed_by_user_id = X-User-ID"
      - "PipPlan.dispute_state -> DISPUTE_OPEN while PipPlan.status is untouched"
      - "PipItem.owner_claimed_cost_cents = claimed_cost_cents, so the owner_claimed variant of calculations.plan_scope_cost diverges from the brand_scoped variant"
      - "increments PipPlan.version by 1"
  - method: GET
    path: "/pip/disputes/{id}"
    description: "Read one scope dispute, including any revised cost the brand determined."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: ScopeDispute
    side_effects: []
  - method: GET
    path: "/pip/disputes"
    description: "Paginated list of scope disputes, filterable by plan or by the contested item."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: ["plan_id?", "item_id?", "dispute_basis?", "status?", "limit?", "offset?"]
    output: ScopeDispute[]
    side_effects: []
  - method: POST
    path: "/pip/disputes/{id}/resolve"
    description: "Brand upholds its own scoping, revises the item's cost, or removes the item from scope. REVISE drives the deepest cascade in the domain."
    roles: [BrandManager]
    code: 200
    input: [resolution, "revised_cost_cents?", "panel_decision_note?"]
    output: ScopeDispute
    side_effects:
      - "UPHOLD: -> RESOLVED_UPHELD and PipPlan.dispute_state -> DISPUTE_RESOLVED_UPHELD with no cost movement"
      - "REVISE: -> RESOLVED_REVISED, item.approved_cost_cents = revised_cost_cents, then the five-link cascade item cost -> plan funding_requirement and priority_rank -> CapitalBudget LOCKED -> UNDERFUNDED -> Property.compliance_risk_score and posture -> FranchiseeAccount.standing, plus a COST_REVISED ComplianceLedgerEntry"
      - "REMOVE: -> RESOLVED_REMOVED, the item becomes REMOVED_BY_DISPUTE and drops out of every plan aggregate, priority ranks are recomputed over the survivors, and an ITEM_REMOVED ComplianceLedgerEntry is appended"
      - "increments PipPlan.version by 1"

  # ---- DefaultNotice ------------------------------------------------------
  - method: POST
    path: "/pip/default-notices"
    description: "Brand issues a notice of default over the plan's overdue items, fixing the cure deadline and the liquidated damages. Requires at least one item to be overdue at issuance."
    roles: [BrandManager]
    code: 201
    input: [plan_id, cure_period_days]
    output: DefaultNotice
    side_effects:
      - "status ISSUED with issued_by_user_id = X-User-ID and cure_deadline_date = date(logical clock) + cure_period_days"
      - "breached_item_ids is snapshotted from the overdue items in priority_rank order and liquidated_damages_cents is computed by calculations.liquidated_damages"
      - "Property.franchise_agreement_status -> DEFAULT_NOTICED, Property.compliance_posture -> IN_DEFAULT and FranchiseeAccount.standing -> DEFAULT"
      - "appends a DEFAULT_ISSUED ComplianceLedgerEntry"
  - method: GET
    path: "/pip/default-notices/{id}"
    description: "Read one default notice, including its breached item snapshot and liquidated damages."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: DefaultNotice
    side_effects: []
  - method: GET
    path: "/pip/default-notices"
    description: "Paginated list of default notices, filterable by the plan whose non-completion they notice."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: ["plan_id?", "status?", "limit?", "offset?"]
    output: DefaultNotice[]
    side_effects: []
  - method: POST
    path: "/pip/default-notices/{id}/cure"
    description: "Brand records the breach as cured once every snapshotted item has been completed, accepted or removed from scope."
    roles: [BrandManager]
    code: 200
    input: []
    output: DefaultNotice
    side_effects:
      - "DefaultNotice ISSUED -> CURED"
      - "Property.franchise_agreement_status returns to ACTIVE once no notice of the property remains ISSUED, and posture and standing are re-derived"
      - "appends a DEFAULT_CURED ComplianceLedgerEntry"
  - method: POST
    path: "/pip/default-notices/{id}/escalate"
    description: "Brand terminates the franchise for non-completion, strictly after the cure deadline has passed and only while a snapshotted breach remains uncured."
    roles: [BrandManager]
    code: 200
    input: []
    output: DefaultNotice
    side_effects:
      - "DefaultNotice ISSUED -> ESCALATED_TO_TERMINATION"
      - "drives the five-link termination cascade: PipPlan -> TERMINATED, items -> VOIDED, phases -> CANCELLED and budget -> CLOSED, bookings -> CANCELLED and keys returned, Property.franchise_agreement_status -> TERMINATED, posture -> TERMINATED and FranchiseeAccount.standing -> TERMINATED_PORTFOLIO"
      - "appends a PLAN_TERMINATED ComplianceLedgerEntry"

  # ---- ComplianceLedgerEntry (append-only, read-only surface) -------------
  - method: GET
    path: "/pip/compliance-ledger-entries/{id}"
    description: "Read one append-only compliance ledger entry. The ledger has no update or delete surface and its rows carry no version field."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: []
    output: ComplianceLedgerEntry
    side_effects: []
  - method: GET
    path: "/pip/compliance-ledger-entries"
    description: "Paginated list of ledger entries, filterable by plan or by the scoped item the entry concerns. This is the only channel through which cascade-appended entries can be observed."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: ["plan_id?", "item_id?", "entry_type?", "limit?", "offset?"]
    output: ComplianceLedgerEntry[]
    side_effects: []

  # ---- Test-driving endpoint ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary UTC instant. Every deadline, overdue flag, cure window and interval check in this domain reads this clock instead of wall-clock time. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z, and it MUST NOT fall back to real wall-clock time."
    roles: [FranchiseeOwner, BrandManager, BrandInspector]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["subsequent requests evaluate every date comparison against the new instant; no stored row is recomputed until an endpoint that recomputes it is called"]

errors:
  # ---- authentication and authorization -----------------------------------
  - id: ERR_MISSING_ROLE
    http: 401
    condition: "X-User-Role header absent"
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of FranchiseeOwner, BrandManager, BrandInspector"
  - id: ERR_MISSING_USER_ID
    http: 401
    condition: "X-User-ID header absent or outside 1..64 characters"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the presented role is not listed on the endpoint (e.g. a FranchiseeOwner calling POST /pip/plans/{id}/issue)"
  - id: ERR_VALIDATION
    http: 422
    condition: "a required field is missing, an enum value is unknown, a numeric bound is breached or a pagination parameter is out of range"

  # ---- existence ----------------------------------------------------------
  - id: ERR_FRANCHISEE_NOT_FOUND
    http: 404
    condition: "franchisee account id in the path or in franchisee_id does not exist"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "property id in the path or in property_id does not exist"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "plan id in the path or in plan_id does not exist"
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "scoped item id in the path or in item_id, pip_item_id, purpose_item_id or predecessor_item_id does not exist"
  - id: ERR_EXTENSION_REQUEST_NOT_FOUND
    http: 404
    condition: "extension request id in the path does not exist"
  - id: ERR_BUDGET_NOT_FOUND
    http: 404
    condition: "capital budget id in the path or in capital_budget_id does not exist"
  - id: ERR_DRAW_NOT_FOUND
    http: 404
    condition: "reserve draw id in the path does not exist"
  - id: ERR_PHASE_NOT_FOUND
    http: 404
    condition: "renovation phase id in the path or in phase_id does not exist"
  - id: ERR_CONTRACTOR_NOT_FOUND
    http: 404
    condition: "contractor id in the path or in contractor_id does not exist"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "contractor booking id in the path does not exist"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "inspection id in the path or in inspection_id does not exist"
  - id: ERR_PUNCH_NOT_FOUND
    http: 404
    condition: "punch-list item id in the path does not exist"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "scope dispute id in the path does not exist"
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "default notice id in the path does not exist"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "compliance ledger entry id in the path does not exist"

  # ---- request shape and uniqueness ---------------------------------------
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "phase end_date earlier than start_date, or booking end_datetime not strictly after start_datetime"
  - id: ERR_ROOM_IMPACT_MISMATCH
    http: 422
    condition: "rooms_affected_count non-zero while room_impacting is false, or zero while room_impacting is true"
  - id: ERR_CONTINGENCY_OUT_OF_RANGE
    http: 422
    condition: "contingency_pct outside 0..0.50 or carrying more than 4 decimal places"
  - id: ERR_CURE_PERIOD_OUT_OF_RANGE
    http: 422
    condition: "cure_period_days outside 1..60"
  - id: ERR_JUSTIFICATION_INSUFFICIENT
    http: 422
    condition: "business_justification shorter than 40 characters after trimming"
  - id: ERR_PHASE_NUMBER_DUPLICATE
    http: 409
    condition: "another non-cancelled phase of the same plan already uses that phase_number"
  - id: ERR_REVISION_COST_REQUIRED
    http: 422
    condition: "resolution == REVISE without a revised_cost_cents >= 0"
  - id: ERR_REVISION_NOT_ALLOWED_FOR_RESOLUTION
    http: 422
    condition: "revised_cost_cents supplied on an UPHOLD or REMOVE resolution"

  # ---- state preconditions ------------------------------------------------
  - id: ERR_PLAN_NOT_ISSUABLE
    http: 409
    condition: "issue attempted on a plan whose status is not DRAFT (including a second issue of the same plan)"
  - id: ERR_PLAN_NOT_ACKNOWLEDGEABLE
    http: 409
    condition: "acknowledge attempted on a plan whose status is not ISSUED"
  - id: ERR_PLAN_NOT_WITHDRAWABLE
    http: 409
    condition: "withdraw attempted on a plan whose status is not DRAFT or ISSUED"
  - id: ERR_PLAN_NOT_DRAFT
    http: 409
    condition: "item creation or item revision attempted while the plan is no longer DRAFT"
  - id: ERR_PLAN_NOT_IN_EXECUTION_WINDOW
    http: 409
    condition: "execution action attempted while the plan is outside {OWNER_ACKNOWLEDGED, IN_EXECUTION} (budget approval also admits ISSUED)"
  - id: ERR_PLAN_NOT_READY_FOR_SIGNOFF
    http: 409
    condition: "completion sign-off attempted while the plan is not READY_FOR_COMPLETION_INSPECTION"
  - id: ERR_FRANCHISE_TERMINATED
    http: 409
    condition: "any new plan, item, budget, phase or draw attempted on a property whose franchise_agreement_status is TERMINATED"
  - id: ERR_ITEM_NOT_STARTABLE
    http: 409
    condition: "start attempted on an item whose status is not SCOPED"
  - id: ERR_ITEM_NOT_IN_PROGRESS
    http: 409
    condition: "complete-work attempted on an item whose status is not IN_PROGRESS"
  - id: ERR_ITEM_NOT_REMOVABLE
    http: 409
    condition: "REMOVE resolution attempted while the contested item is outside {SCOPED, DEFERRED_PENDING_EXTENSION, IN_PROGRESS}"
  - id: ERR_EXTENSION_NOT_DECIDABLE
    http: 409
    condition: "decide attempted on a request whose status is not SUBMITTED"
  - id: ERR_EXTENSION_NOT_RESUBMITTABLE
    http: 409
    condition: "resubmit attempted on a request whose status is not NEEDS_MORE_JUSTIFICATION"
  - id: ERR_BUDGET_NOT_APPROVABLE
    http: 409
    condition: "approve attempted on a budget whose status is not DRAFT"
  - id: ERR_BUDGET_NOT_LOCKABLE
    http: 409
    condition: "lock attempted on a budget whose status is not APPROVED"
  - id: ERR_DRAW_NOT_DECIDABLE
    http: 409
    condition: "consent attempted on a draw whose status is not REQUESTED"
  - id: ERR_DRAW_NOT_DISBURSABLE
    http: 409
    condition: "disburse attempted on a draw whose status is not BRAND_CONSENTED"
  - id: ERR_DRAW_NOT_REVERSIBLE
    http: 409
    condition: "reverse attempted on a draw whose status is not DISBURSED"
  - id: ERR_PHASE_NOT_ACTIVATABLE
    http: 409
    condition: "activate attempted on a phase whose status is not PLANNED"
  - id: ERR_PHASE_NOT_CLOSEABLE
    http: 409
    condition: "close-out attempted on a phase whose status is not ACTIVE"
  - id: ERR_INSPECTION_NOT_PERFORMABLE
    http: 409
    condition: "perform attempted on an inspection whose status is not SCHEDULED"
  - id: ERR_INSPECTION_NOT_SIGNABLE
    http: 409
    condition: "sign-off attempted on an inspection whose status is not PERFORMED"
  - id: ERR_INSPECTION_TYPE_NOT_SIGNABLE
    http: 409
    condition: "sign-off attempted on a SCOPING, PROGRESS or RE_INSPECTION visit"
  - id: ERR_PUNCH_NOT_REMEDIABLE
    http: 409
    condition: "remediate attempted on a defect whose status is not OPEN"
  - id: ERR_PUNCH_NOT_VERIFIABLE
    http: 409
    condition: "verify with CLOSE or REOPEN attempted on a defect whose status is not REMEDIATED"
  - id: ERR_DISPUTE_NOT_RESOLVABLE
    http: 409
    condition: "resolve attempted on a dispute whose status is not FILED"
  - id: ERR_DISPUTE_ALREADY_OPEN
    http: 409
    condition: "a second dispute filed on an item that already has a FILED dispute"
  - id: ERR_NOTICE_NOT_ACTIONABLE
    http: 409
    condition: "cure or escalate attempted on a notice whose status is not ISSUED"

  # ---- optimistic concurrency (section 1.2.1) -----------------------------
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_plan_version does not equal the current PipPlan.version on POST /pip/capital-budgets or PATCH /pip/items/{id}"
  - id: ERR_STALE_PROPERTY_VERSION
    http: 412
    condition: "expected_property_version does not equal the current Property.version on POST /pip/reserve-draws"

  # ---- safety and brand-standard compliance -------------------------------
  - id: ERR_LIFE_SAFETY_PRIORITY_VIOLATION
    http: 409
    condition: "a non-life-safety item start attempted while a life-safety item of the same plan is overdue"
  - id: ERR_NO_ACTIVE_PHASE_FOR_ROOM_WORK
    http: 409
    condition: "a room-impacting item start attempted without an ACTIVE phase covering the clock date and holding enough keys out of service"
  - id: ERR_OOO_CAP_EXCEEDED
    http: 409
    condition: "phase creation or activation would push the property's out-of-service ratio strictly above 0.25"
  - id: ERR_CRITICAL_DEFECT_NOT_WAIVABLE
    http: 409
    condition: "WAIVE attempted on a CRITICAL punch-list defect"
  - id: ERR_PUNCH_LIST_OPEN
    http: 409
    condition: "completion sign-off attempted while the inspection still has OPEN or REMEDIATED defects"
  - id: ERR_CURE_PERIOD_TOO_LONG_FOR_LIFE_SAFETY
    http: 422
    condition: "cure_period_days above 10 on a notice whose overdue items include a LIFE_SAFETY item"
  - id: ERR_CONTRACTOR_NOT_BRAND_APPROVED
    http: 409
    condition: "booking a FIRE_PROTECTION contractor, or any contractor onto a plan with open life-safety scope, while brand_approved is false"
  - id: ERR_ROOM_WORK_STILL_IN_PROGRESS
    http: 409
    condition: "phase close-out attempted while a room-impacting item of the plan is still IN_PROGRESS"

  # ---- temporal windows and interval conflicts ----------------------------
  - id: ERR_INSPECTION_TOO_EARLY
    http: 409
    condition: "perform attempted before the inspection's scheduled_date"
  - id: ERR_CURE_PERIOD_NOT_ELAPSED
    http: 409
    condition: "escalate attempted on or before the notice's cure_deadline_date"
  - id: ERR_PHASE_WINDOW_CONFLICT
    http: 409
    condition: "the new phase's closed interval, expanded by the two-day changeover buffer, intersects another PLANNED or ACTIVE phase of the same plan"
  - id: ERR_CONTRACTOR_DOUBLE_BOOKED
    http: 409
    condition: "the contractor already has max_concurrent_bookings BOOKED intervals strictly overlapping the requested half-open interval"
  - id: ERR_BOOKING_OUTSIDE_PHASE_WINDOW
    http: 422
    condition: "the booking interval falls outside its phase's closure window"
  - id: ERR_PHASE_OUTSIDE_PLAN_HORIZON
    http: 422
    condition: "a phase of an issued plan ends after the plan's back-of-house deadline"
  - id: ERR_NO_BREACH_TO_NOTICE
    http: 409
    condition: "default notice issuance attempted while no item of the plan is overdue"
  - id: ERR_EXTENSION_AFTER_DEADLINE
    http: 409
    condition: "extension requested after the item's deadline_date has already passed"
  - id: ERR_BREACH_NOT_CURED
    http: 409
    condition: "cure attempted while a snapshotted breached item is not yet WORK_COMPLETE, ACCEPTED or REMOVED_BY_DISPUTE"
  - id: ERR_BREACH_ALREADY_CURED
    http: 409
    condition: "escalate attempted after every snapshotted breached item has been completed, accepted or removed"

  # ---- referential coherence and duty separation --------------------------
  - id: ERR_PREDECESSOR_PLAN_MISMATCH
    http: 422
    condition: "predecessor_item_id references an item of a different plan"
  - id: ERR_PREDECESSOR_NOT_SATISFIED
    http: 409
    condition: "item start attempted while its predecessor is not WORK_COMPLETE, ACCEPTED or REMOVED_BY_DISPUTE"
  - id: ERR_PREDECESSOR_CYCLE
    http: 422
    condition: "predecessor_item_id points at the item itself or closes a cycle in the sequencing chain"
  - id: ERR_ITEM_PLAN_MISMATCH
    http: 422
    condition: "the contested item does not belong to the supplied plan, or the charged item does not belong to the inspection's plan"
  - id: ERR_DRAW_ITEM_PLAN_MISMATCH
    http: 422
    condition: "purpose_item_id belongs to a different plan than the budget being drawn against"
  - id: ERR_DRAW_PROPERTY_MISMATCH
    http: 422
    condition: "property_id is not the property of the plan the budget funds"
  - id: ERR_NOT_PROPERTY_FRANCHISEE
    http: 403
    condition: "an owner-side action presented an X-User-ID other than the property's franchisee_id"
  - id: ERR_NOT_ASSIGNED_INSPECTOR
    http: 403
    condition: "an inspection or verification action presented an X-User-ID other than the inspection's inspector_user_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID signing off a completion inspection is the same id that issued the plan"
  - id: ERR_DISPUTE_OPEN_BLOCKS_SIGNOFF
    http: 409
    condition: "completion sign-off attempted while plan.dispute_state is DISPUTE_OPEN, or a resolve attempted while another dispute of the plan is still FILED"

  # ---- aggregate and quota constraints ------------------------------------
  - id: ERR_EXTENSION_ALREADY_PENDING
    http: 409
    condition: "a second extension request filed while one is SUBMITTED or NEEDS_MORE_JUSTIFICATION on the same item"
  - id: ERR_EXTENSION_ROUNDS_EXHAUSTED
    http: 409
    condition: "resubmit attempted when round_number has already reached MAX_EXTENSION_ROUNDS (3)"
  - id: ERR_EXTENSION_CAP_EXHAUSTED
    http: 409
    condition: "the clamped grant from calculations.extension_grant_cap would be zero or negative days"
  - id: ERR_PLAN_HAS_NO_ITEMS
    http: 409
    condition: "issue attempted on a plan with no SCOPED item"

  # ---- fiscal capacity ----------------------------------------------------
  - id: ERR_BUDGET_UNDERFUNDED
    http: 409
    condition: "lock attempted while plan.funding_gap_cents is greater than 0"
  - id: ERR_BUDGET_NOT_LOCKED
    http: 409
    condition: "item start attempted while the plan has no LOCKED capital budget (never locked, superseded, or knocked to UNDERFUNDED by a cost revision)"
  - id: ERR_BUDGET_NOT_FUNDABLE
    http: 409
    condition: "draw consent attempted while the budget is outside {APPROVED, LOCKED, UNDERFUNDED}"
  - id: ERR_INSUFFICIENT_RESERVE
    http: 409
    condition: "the requested or disbursing amount would take the reserve balance below minimum_retention_cents once existing encumbrances are counted"
  - id: ERR_DRAW_EXCEEDS_BUDGET
    http: 409
    condition: "the requested amount exceeds the budget's uncommitted, unencumbered headroom"
  - id: ERR_BUDGET_CLOSED
    http: 409
    condition: "reverse attempted after the funding budget has been CLOSED by plan completion or termination"

roles:
  - name: FranchiseeOwner
    description: >-
      The hotel owner that holds the franchise agreement. Executes the plan: acknowledges
      issuance, authorises and locks capital, requests and disburses reserve draws, schedules and
      activates phased room closures, books contractors, starts and completes item work,
      remediates defects and files scope disputes. Every owner-side action is checked against the
      governing property's franchisee_id, so one owner can never act on another owner's property.
    identity: "entity_backed:FranchiseeAccount"
    exclusive_operations:
      - "POST /pip/plans/{id}/acknowledge"
      - "POST /pip/items/{id}/start"
      - "POST /pip/items/{id}/complete-work"
      - "POST /pip/extension-requests"
      - "POST /pip/extension-requests/{id}/resubmit"
      - "POST /pip/capital-budgets"
      - "POST /pip/capital-budgets/{id}/lock"
      - "POST /pip/reserve-draws"
      - "POST /pip/reserve-draws/{id}/disburse"
      - "POST /pip/reserve-draws/{id}/reverse"
      - "POST /pip/renovation-phases"
      - "POST /pip/renovation-phases/{id}/activate"
      - "POST /pip/renovation-phases/{id}/close-out"
      - "POST /pip/contractor-bookings"
      - "POST /pip/punch-list-items/{id}/remediate"
      - "POST /pip/disputes"
      - "POST /pip/properties/{id}/reserve-contributions"
    shared_operations:
      - "every GET under /pip except GET /pip/franchisee-accounts, the brand-wide franchisee roster (an owner may still read its own account by id at GET /pip/franchisee-accounts/{id})"
      - "GET /pip/plans/{id}/cost-summary"
      - "GET /pip/properties/{id}/risk-summary"
      - "POST /_clock/set_current_utc"

  - name: BrandManager
    description: >-
      The brand's compliance and franchising operator. Scopes and issues plans, revises scope
      while a plan is DRAFT, approves capital budgets, consents to reserve draws, decides
      extension requests, resolves scope disputes, registers properties and contractors, runs
      compliance sweeps, and issues, cures or escalates default notices up to franchise
      termination. X-User-ID is an operator identifier, but the specific id that issues a plan is
      recorded and barred from later signing off that plan's completion inspection.
    identity: "opaque"
    exclusive_operations:
      - "POST /pip/franchisee-accounts"
      - "POST /pip/properties"
      - "PATCH /pip/properties/{id}"
      - "POST /pip/plans"
      - "POST /pip/plans/{id}/issue"
      - "POST /pip/plans/{id}/withdraw"
      - "POST /pip/plans/{id}/compliance-sweep"
      - "POST /pip/items"
      - "PATCH /pip/items/{id}"
      - "POST /pip/extension-requests/{id}/decide"
      - "POST /pip/capital-budgets/{id}/approve"
      - "POST /pip/reserve-draws/{id}/consent"
      - "POST /pip/contractors"
      - "POST /pip/inspections"
      - "POST /pip/disputes/{id}/resolve"
      - "POST /pip/default-notices"
      - "POST /pip/default-notices/{id}/cure"
      - "POST /pip/default-notices/{id}/escalate"
    shared_operations:
      - "every GET under /pip"
      - "GET /pip/plans/{id}/cost-summary"
      - "GET /pip/properties/{id}/risk-summary"
      - "POST /_clock/set_current_utc"

  - name: BrandInspector
    description: >-
      The brand's field inspector. Performs the scheduled visit, raises punch-list defects,
      verifies, reopens or waives them, and certifies completion. Only the inspector_user_id
      assigned to a given inspection may act on it, and that id must differ from the id that
      issued the plan. An inspector can neither scope nor issue a plan, nor decide extensions,
      budgets, draws, disputes or notices.
    identity: "opaque"
    exclusive_operations:
      - "POST /pip/inspections/{id}/perform"
      - "POST /pip/inspections/{id}/sign-off"
      - "POST /pip/punch-list-items"
      - "POST /pip/punch-list-items/{id}/verify"
    shared_operations:
      - "every GET under /pip"
      - "GET /pip/plans/{id}/cost-summary"
      - "GET /pip/properties/{id}/risk-summary"
      - "POST /_clock/set_current_utc"
