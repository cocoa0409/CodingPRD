            - { call: "POST /youth-ministry/scholarship-applications", payload: {registration_id: "${reg2}", requested_cents: 6000}, as: Guardian, as_user_id: "guardian-2", captures: {e_dup: $.data.error_id} }
            - { call: "POST /youth-ministry/scholarship-applications", payload: {registration_id: "${reg3}", requested_cents: 5000}, as: Guardian, as_user_id: "guardian-3", captures: {app3: $.data.id} }
            - { call: "POST /youth-ministry/scholarship-applications/${app3}/decide", payload: {decision: "APPROVE"}, as: ScholarshipReviewer, as_user_id: "reviewer-1", captures: {e_zero: $.data.error_id} }
          assert:
            - "e_state == ERR_REGISTRATION_STATE_FORBIDS_ACTION (SUBMITTED is not {APPROVED, CONFIRMED})"
            - "e_dup == ERR_DUPLICATE_ACTIVE_APPLICATION (one application in {UNDER_REVIEW, APPROVED} per registration)"
            - "e_zero == ERR_AWARD_WOULD_BE_ZERO (422): need_score 0 -> need_cap 0 -> award 0 -> rejected, and the application stays UNDER_REVIEW"

      - name: apply_credit_zero_available_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_CREDIT_AVAILABLE]
        distinguishing_aspect: "apply-credit on an account whose available_credit_cents == 0 (no donations) is rejected — zero-quantity edge, distinct from the account-closed gate."
