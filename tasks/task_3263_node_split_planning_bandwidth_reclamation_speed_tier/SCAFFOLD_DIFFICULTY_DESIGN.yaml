              as: NetworkPlanner
          trigger:
            - call: "POST /capacity-actions/${ca}/migration-waves"
              payload: { wave_code: "W2", window_start: "2026-10-04T00:00:00Z", window_end: "2026-10-05T00:00:00Z", target_cpe_ids: ["${cpe2}"] }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "trigger responds 409 ERR_WAVE_GAP_VIOLATION even though [10-04,10-05] does not overlap [10-01,10-03] at all — the 7-day buffer rule is stricter than half-open overlap"
            - "no wave W2 is created (GET /capacity-actions/${ca}/migration-waves returns exactly 1 wave)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: homes_conserved_across_split_cutover
        grounds:
          - calculations.node_split_homes_allocation
          - calculations.franchise_obligation_progress
          - state_machines.NodeSplitProject.IN_CONSTRUCTION_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity = homes passed: the cutover forward action paired with
          the parent retirement leaves sum(ServiceGroup.homes_passed over non-retired
          groups in the franchise area) unchanged at 1000 (0 on parent + 333+333+334
          on children); FranchiseArea.homes_built_progress reads 1000 before and after.
        test_recipe:
          setup:
            - "Node NE-C1: 1000 homes, spectrum 48 = DATA 48; SG-C1 1000 homes; NODE_SPLIT action IN_PROGRESS; project child_count 3 min 200 max 400, IN_CONSTRUCTION"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /franchise-areas"
              payload: { name: "Metro East", region_code: "ME", obligation_homes_required: 5000, obligation_deadline: "2027-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-C1", homes_passed: 1000, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-C1", homes_passed: 1000, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id, sg_v: $.data.version }
            - call: "POST /service-groups/${sg}/capacity-actions"
              payload: { action_type: "NODE_SPLIT", expected_service_group_version: "${sg_v}" }
              as: NetworkPlanner
              captures: { ca: $.data.id }
            - call: "POST /capacity-actions/${ca}/approve"
              as: CapacityEngineer
            - call: "POST /capacity-actions/${ca}/node-split-projects"
              payload: { child_count: 3, min_homes_per_child: 200, max_homes_per_child: 400 }
              as: NetworkPlanner
              captures: { nsp: $.data.id }
            - call: "POST /node-split-projects/${nsp}/adjudicate-permit"
              payload: { decision: "GRANTED" }
              as: FranchiseAdmin
              captures: { nsp_v: $.data.version }
            - call: "POST /node-split-projects/${nsp}/schedule"
              payload: { window_start: "2026-11-01T00:00:00Z", window_end: "2026-11-10T00:00:00Z", expected_node_split_project_version: "${nsp_v}" }
              as: NetworkPlanner
            - call: "POST /capacity-actions/${ca}/begin"
              as: CapacityEngineer
            - call: "POST /node-split-projects/${nsp}/begin-construction"
              as: FieldOpsCoordinator
          trigger:
            - call: "POST /node-split-projects/${nsp}/cutover"
              as: FieldOpsCoordinator
            - call: "GET /franchise-areas/${fa}"
              as: Any
          assert:
            - "FranchiseArea.${fa}.homes_built_progress == 1000 after cutover (identical to before: 333+333+334 children + 0 retired parent)"
            - "ServiceGroup.${sg}.homes_passed == 0 and posture == SPLIT_RETIRED"
            - "sum over the 3 child service groups' homes_passed == 1000 exactly — no home is created or destroyed"

      - name: provisioned_mbps_activate_then_cancel_leaves_no_drift
        grounds:
          - state_machines.ProvisioningRequest.VALIDATED_to_ACTIVE
          - state_machines.ProvisioningRequest.ACTIVE_to_CANCELLED
          - entities.CustomerPremise.fields.provisioned_downstream_mbps
          - entities.ServiceGroup.fields.provisioned_downstream_mbps
        distinguishing_aspect: |
          Conserved quantity = provisioned downstream Mbps (a different quantity than
          homes): activating a DS-200 request then cancelling it must leave both
          CustomerPremise.provisioned_downstream_mbps and the service group's
          provisioned_downstream_mbps at exactly 0 — forward/compensating pair with
          zero drift.
        test_recipe:
          setup:
            - "Node NE-Z: spectrum 48 = DATA 48 (capacity 304); SG-Z no load; tier PRO DS 200 min D31; premise with D31 modem; request validated"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /franchise-areas"
              payload: { name: "Metro East", region_code: "ME", obligation_homes_required: 5000, obligation_deadline: "2027-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-Z", homes_passed: 300, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-Z", homes_passed: 100, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id }
            - call: "POST /speed-tiers"
              payload: { tier_code: "PRO", downstream_mbps: 200, upstream_mbps: 20, min_capability_class: "D31", min_upstream_config: "LEGACY" }
              as: PlatformAdmin
              captures: { tier: $.data.id }
            - call: "POST /service-groups/${sg}/customer-premises"
              payload: { premise_ref: "P-Z1", address: "3 Pine St" }
              as: ProvisioningAgent
              captures: { cp: $.data.id, cp_v: $.data.version }
            - call: "POST /customer-premises/${cp}/equipment"
              payload: { model: "SB8200", docsis_version: "3.1", capability_class: "D31", max_downstream_mbps: 400, video_legacy: false }
              as: ProvisioningAgent
            - call: "POST /customer-premises/${cp}/provisioning-requests"
              payload: { speed_tier_id: "${tier}", expected_customer_premise_version: "${cp_v}" }
              as: ProvisioningAgent
              captures: { pr: $.data.id }
            - call: "POST /provisioning-requests/${pr}/validate"
              as: ProvisioningAgent
          trigger:
            - call: "POST /provisioning-requests/${pr}/activate"
              as: ProvisioningAgent
            - call: "GET /service-groups/${sg}"
              as: Any
            - call: "POST /provisioning-requests/${pr}/cancel"
              as: ProvisioningAgent
            - call: "GET /customer-premises/${cp}"
              as: Any
            - call: "GET /service-groups/${sg}"
              as: Any
          assert:
            - "after activate: CustomerPremise.${cp}.provisioned_downstream_mbps == 200 and ServiceGroup.${sg}.provisioned_downstream_mbps == 200"
            - "after cancel: ProvisioningRequest.${pr}.status == CANCELLED"
            - "after cancel: CustomerPremise.${cp}.provisioned_downstream_mbps == 0 and current_tier_id == null"
            - "after cancel: ServiceGroup.${sg}.provisioned_downstream_mbps == 0 — the activate/cancel pair leaves the conserved quantity unchanged"
