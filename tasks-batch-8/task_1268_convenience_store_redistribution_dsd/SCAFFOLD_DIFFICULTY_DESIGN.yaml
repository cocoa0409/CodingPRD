  - rule_id: transitive_cascade
    instances:
      - name: short_credit_releases_credit_hold
        grounds:
          - state_machines.CreditMemo.DRAFT_to_POSTED
          - state_machines.PurchaseOrder.CLOSED_to_DELIVERED
          - calculations.credit_exposure_calc
          - entities.DeliveryException.fields.credit_amount_cents
          - entities.Retailer.fields.credit_status
        distinguishing_aspect: |
          Depth-3 chain from the delivery-exception trigger: exception POST auto-creates and
          posts a CreditMemo (link 1), posting reduces Invoice.balance_cents (link 2), the
          invoice reduction lowers Retailer.ar_balance_cents/exposure (link 3), which flips
          Retailer.credit_status CREDIT_HOLD -> GOOD_STANDING (link 4).
        test_recipe:
          setup:
            - "Retailer R (limit initially 10000000) with the promoted 50xP1 + 20xQ1 order delivered: invoice 57779"
            - "Credit limit lowered to 55000 while exposure is 58500, forcing CREDIT_HOLD; after invoicing exposure is 57779 (> 55000, still HOLD)"
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
