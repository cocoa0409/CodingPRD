          - entities.PayerContract.fields.terminates_on
        distinguishing_aspect: |
          A coverage term whose terminates_on precedes its effective_on is an
          inverted interval and is refused with ERR_INVALID_REQUEST before the
          overlap check at priority 31 ever runs, so no unusable term is persisted.
        test_recipe:
          setup:
