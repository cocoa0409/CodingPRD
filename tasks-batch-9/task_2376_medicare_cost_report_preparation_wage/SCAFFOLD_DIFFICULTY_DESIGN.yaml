              payload: { provider_id: "${provider_id}", expected_provider_version: "${provider_version_2}", basis_cost_report_id: "${report_id}", projected_discharges: 500, trend_factor: 0.1000, effective_from: "2027-10-01", effective_to: "2028-09-30" }
              as: ReimbursementManager
            - call: "POST /interim-rate-requests"
              payload: { provider_id: "${provider_id}", expected_provider_version: "${provider_version_2}", basis_cost_report_id: "${report_id}", projected_discharges: 500, trend_factor: 0.1000, effective_from: "2027-11-01", effective_to: "2028-10-31" }
              as: ReimbursementManager
              captures: { irr_second: $.data.id }
          assert:
            - "the first trigger call returns 409 with $.data.error_id == 'ERR_INTERIM_PERIOD_OVERLAP': 2027-10-01 falls on or before 2027-09-30 + 30 days == 2027-10-30, so the buffer is violated even though the closed intervals [2026-10-01, 2027-09-30] and [2027-10-01, 2028-09-30] do not intersect"
            - "immediately after the rejected call InterimRateRequest.${irr_first}.status == 'PENDING' (not SUPERSEDED) and Provider.${provider_id}.version == ${provider_version_2}"
            - "the second trigger call returns 201 because 2027-11-01 is 32 days after 2027-09-30, clear of the 30-day buffer"
            - "InterimRateRequest.${irr_second}.status == 'PENDING' and effective_from == '2027-11-01' and effective_to == '2028-10-31'"
            - "InterimRateRequest.${irr_first}.status == 'SUPERSEDED' and decision_note == 'SUPERSEDED_BY_NEWER_REQUEST'"
            - "GET /interim-rate-requests?provider_id=${provider_id} returns total_count == 2"
            - "CostReport.${report_id}.allowable_cost_per_discharge_cents == 600000 and InterimRateRequest.${irr_second}.projected_cost_per_discharge_cents == 660000 and approved_rate_cents == 550000"
            - "Provider.${provider_id}.current_interim_rate_cents == 500000 (no request has been approved)"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reclassification_reversal_conserves_mapped_direct_cost_in_cents
        grounds:
          - calculations.trial_balance_mapping_rollup
          - entities.WorkpaperEntry.fields.status
          - entities.CostCenter.fields.post_reclass_direct_cost_cents
          - entities.CostReport.fields.total_direct_cost_cents
        distinguishing_aspect: |
          Conserved quantity 'mapped_direct_cost' in DOLLARS (integer cents):
          SUM(CostCenter.post_reclass_direct_cost_cents) == 420000000 == SUM of the report's MAPPED
          TrialBalanceLine.amount_cents both before the reclassification, after it, and after its
          reversal, and every per-center figure returns to its exact pre-create value.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a DRAFT CostReport for FY 2025-07-01..2026-06-30 with cost centers 00100 (GENERAL_SERVICE), 03000 (ROUTINE), 05000 (ANCILLARY)"
            - "three MAPPED trial balance lines: 100000000 to 00100, 200000000 to 03000, 120000000 to 05000, so total_direct_cost_cents == 420000000 and unmapped_tb_total_cents == 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_ag: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "05000", name: "Operating Room", center_type: "ANCILLARY", statistics: { SQUARE_FEET: 2000 } }
              as: ReimbursementAnalyst
              captures: { cc_ancillary: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6000", description: "Administration salaries", amount_cents: 100000000, mapped_cost_center_id: "${cc_ag}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6200", description: "Nursing salaries", amount_cents: 200000000, mapped_cost_center_id: "${cc_routine}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6300", description: "Operating room supplies", amount_cents: 120000000, mapped_cost_center_id: "${cc_ancillary}" }
              as: ReimbursementAnalyst
          trigger:
            - call: "POST /cost-reports/${report_id}/workpaper-entries"
              payload: { entry_type: "RECLASSIFICATION", code: "A6-4", description: "Move administration effort to nursing and surgery", legs: [ { cost_center_id: "${cc_ag}", amount_cents: -30000000 }, { cost_center_id: "${cc_routine}", amount_cents: 20000000 }, { cost_center_id: "${cc_ancillary}", amount_cents: 10000000 } ] }
              as: ReimbursementAnalyst
              captures: { we_id: $.data.id }
            - call: "POST /workpaper-entries/${we_id}/reverse"
              payload: {}
              as: ReimbursementAnalyst
          assert:
            - "before the trigger chain: CostCenter post_reclass_direct_cost_cents are 100000000 / 200000000 / 120000000 summing to 420000000 and CostReport.${report_id}.total_direct_cost_cents == 420000000"
            - "after the create: CostCenter.${cc_ag}.reclassified_amount_cents == -30000000 and post_reclass_direct_cost_cents == 70000000"
            - "after the create: CostCenter.${cc_routine}.post_reclass_direct_cost_cents == 220000000 and CostCenter.${cc_ancillary}.post_reclass_direct_cost_cents == 130000000"
            - "after the create: 70000000 + 220000000 + 130000000 == 420000000 — the conserved quantity is unchanged by the reclassification"
            - "after the reverse: WorkpaperEntry.${we_id}.status == 'REVERSED' and reversed_at == '2026-08-01T00:00:00Z'"
            - "after the reverse: CostCenter.${cc_ag}.reclassified_amount_cents == 0 and post_reclass_direct_cost_cents == 100000000"
            - "after the reverse: CostCenter.${cc_routine}.post_reclass_direct_cost_cents == 200000000 and CostCenter.${cc_ancillary}.post_reclass_direct_cost_cents == 120000000 — exactly the pre-create values, no residual cent"
            - "after the reverse: SUM of the three post_reclass_direct_cost_cents == 420000000 and CostReport.${report_id}.total_direct_cost_cents == 420000000"
            - "after the reverse: CostCenter direct_cost_cents remain 100000000 / 200000000 / 120000000 (the reversal touches only the reclassification layer)"

      - name: rotation_void_conserves_resident_fte_days
        grounds:
          - calculations.gme_fte_rolling_average
          - state_machines.RotationAssignment.ACTIVE_to_VOID
          - entities.Resident.fields.assigned_fte_days
          - entities.CostReport.fields.unweighted_fte_days_total
        distinguishing_aspect: |
          A different type of conserved quantity — FTE-DAYS (time-weighted, 4-dp, not money):
          unweighted_fte_days_total moves 110.4000 -> 125.9000 -> 110.4000 across create and void, and
          the derived resident_fte returns to exactly 0.3025 with no 0.0001 drift, which a dollar-based
          conservation check could never detect.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with fte_cap 2.00 and a DRAFT CostReport for FY 2025-07-01..2026-06-30 (365 period days), no prior FINAL_SETTLED report for this provider"
            - "cost center 03000 (ROUTINE) as the rotation site"
            - "Resident 'Dana Okafor' (WITHIN_IRP) with one ACTIVE rotation [2025-07-01, 2026-01-01) at 0.6000 FTE, i.e. 110.4000 fte_days"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /providers/${provider_id}/residents"
              payload: { full_name: "Dana Okafor", program: "Internal Medicine", irp_status: "WITHIN_IRP" }
              as: ReimbursementAnalyst
              captures: { resident_id: $.data.id }
            - call: "POST /residents/${resident_id}/rotation-assignments"
              payload: { cost_center_id: "${cc_routine}", start_date: "2025-07-01", end_date: "2026-01-01", fte_fraction: 0.6000 }
              as: ReimbursementAnalyst
              captures: { rot_base: $.data.id }
          trigger:
            - call: "POST /residents/${resident_id}/rotation-assignments"
              payload: { cost_center_id: "${cc_routine}", start_date: "2026-01-01", end_date: "2026-02-01", fte_fraction: 0.5000 }
              as: ReimbursementAnalyst
              captures: { rot_extra: $.data.id }
            - call: "POST /rotation-assignments/${rot_extra}/void"
              payload: {}
              as: ReimbursementAnalyst
          assert:
            - "before the trigger chain: Resident.${resident_id}.assigned_fte_days == 110.4000 and CostReport.${report_id}.unweighted_fte_days_total == 110.4000"
            - "before the trigger chain: GET /cost-reports/${report_id}/gme-summary returns period_days == 365, unweighted_fte_total == 0.30, capped_unweighted_fte == 0.30, weighted_fte_total == 0.30, rolling_average_fte == 0.30, prior_period_count == 0"
            - "after the create: RotationAssignment.${rot_extra}.overlap_days == 31 and fte_days == 15.5000"
            - "after the create: Resident.${resident_id}.assigned_fte_days == 125.9000 and CostReport.${report_id}.unweighted_fte_days_total == 125.9000"
            - "after the create: GET /cost-reports/${report_id}/gme-summary returns unweighted_fte_total == 0.34 and rolling_average_fte == 0.34"
            - "after the void: RotationAssignment.${rot_extra}.status == 'VOID' and fte_days == 0.0000 (overlap_days remains 31)"
            - "after the void: Resident.${resident_id}.assigned_fte_days == 110.4000 — exactly the pre-create figure, not 110.4001 or 110.3999"
            - "after the void: CostReport.${report_id}.unweighted_fte_days_total == 110.4000 and equals SUM of fte_days over ACTIVE assignments (only ${rot_base}, at 110.4000)"
            - "after the void: GET /cost-reports/${report_id}/gme-summary returns unweighted_fte_total == 0.30, capped_unweighted_fte == 0.30, weighted_fte_total == 0.30, rolling_average_fte == 0.30 — every derived figure back at its pre-create value"
            - "RotationAssignment.${rot_base}.status == 'ACTIVE' and fte_days == 110.4000 throughout"
