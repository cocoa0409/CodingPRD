            - "the FL report has the same requested_at but due_at 2026-08-04T00:00:00.000Z (72 hours) — a different row of the same table"
            - "each report snapshots state_code from its inspection's property ('TX' / 'FL') and closing_date '2026-09-15'"
            - "both are status DRAFT with issued_at null, turnaround_hours null, sla_breached false and amendment_count 0 — nothing is computed at request time"
