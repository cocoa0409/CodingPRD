            - "the storage-accounts listing returns HTTP 200 with data == [] and total_count == 0 (an empty FK set is not a 404)"

  - section: state_machines
    instances:
      - name: corner_enrollment_starts_on_both_axes_at_their_initial_states
        claim_type: initial_state
        grounds: "§1.2 Enrollment/lifecycle_status initial_state CONSENT_PENDING and Enrollment/consent_status initial_state PENDING; §1.2 CollectionKit initial_state DISPATCHED."
        distinguishing_aspect: "Initial state on a two-axis entity: both axes must be seeded independently, and the kit machine's initial state is asserted at creation rather than reached by a transition."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Avery Lin", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_id: "$.data.id" }
          assert:
            - "data.lifecycle_status == CONSENT_PENDING (lifecycle axis at its declared initial_state)"
            - "data.consent_status == PENDING (consent axis at its declared initial_state, independent of the lifecycle axis)"
            - "data.consent_signed_at == null and data.consent_version == 0"

      - name: corner_kit_creation_drives_enrollment_active_to_kit_dispatched
        claim_type: valid_transition
        grounds: "§1.2 Enrollment lifecycle ACTIVE -> KIT_DISPATCHED on POST /cbb/collection-kits with side effect 'CollectionKit created with status DISPATCHED, dispatched_at := clock, expires_at := clock + KIT_SHELF_LIFE_DAYS days'."
        distinguishing_aspect: "A transition whose trigger is the creation of a different entity: the kit POST advances the enrollment axis and stamps the kit's shelf life from the logical clock."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One PRIVATE_FAMILY enrollment with lifecycle_status ACTIVE, consent_status CONSENTED, consent_version 1, version 2, and no kit yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Avery Lin", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_id: "$.data.id" }
            - call: "POST /cbb/enrollments/${enr_id}/consent"
              payload: { consent_document_hash: "hash-aaa" }
              as: ParentGuardian
              as_user_id: "${enr_id}"
          trigger:
            - call: "POST /cbb/collection-kits"
              payload: { enrollment_id: "${enr_id}", kit_lot_code: "LOT-1", courier_tracking_code: "TRK-1" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { kit_id: "$.data.id" }
            - call: "GET /cbb/enrollments/${enr_id}"
              as: IntakeCoordinator
              as_user_id: "ic-001"
          assert:
            - "kit HTTP 201 with data.status == DISPATCHED, data.dispatched_at == 2026-08-01T00:00:00Z, data.expires_at == 2026-11-29T00:00:00Z, data.hold_reason_code == null"
            - "enrollment lifecycle_status == KIT_DISPATCHED and consent_status is still CONSENTED (the consent axis did not move)"
            - "enrollment consent_version == 1 and version == 3 (create, consent, kit dispatch)"

      - name: corner_collection_on_a_returned_kit_violates_the_edge_precondition
        claim_type: precondition_enforcement
        grounds: "§1.2 Enrollment KIT_DISPATCHED -> COLLECTED requires 'CollectionKit.status == DISPATCHED AND clock <= expires_at' and 'consent_status == CONSENTED'; the withdraw cascade sets the kit to RETURNED; §1.4 priority 9 -> ERR_INVALID_KIT_STATE (409) outranks the consent rule at priority 11."
        distinguishing_aspect: "Violates two preconditions of the same edge at once and pins which one answers: the withdrawal cascade breaks both the kit-status and the consent precondition, and the priority ladder makes the kit-state code the observable outcome."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T06:00:00Z."
            - "One PRIVATE_FAMILY enrollment that was consented, issued a kit, then withdrawn — lifecycle WITHDRAWN, consent REVOKED, and the kit RETURNED by the withdrawal cascade."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Avery Lin", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { enr_id: "$.data.id" }
            - call: "POST /cbb/enrollments/${enr_id}/consent"
              payload: { consent_document_hash: "hash-aaa" }
              as: ParentGuardian
              as_user_id: "${enr_id}"
            - call: "POST /cbb/collection-kits"
              payload: { enrollment_id: "${enr_id}", kit_lot_code: "LOT-1", courier_tracking_code: "TRK-1" }
              as: IntakeCoordinator
              as_user_id: "ic-001"
              captures: { kit_id: "$.data.id" }
            - call: "POST /cbb/enrollments/${enr_id}/withdraw"
              payload: { withdrawal_reason_code: "PARENT_REQUEST" }
              as: ParentGuardian
              as_user_id: "${enr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T06:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cbb/collections"
              payload: { kit_id: "${kit_id}", collected_at: "2026-08-10T05:00:00Z", collection_volume_ml: 130.0, anticoagulant_volume_ml: 25.0, delivery_mode: "VAGINAL" }
              as: CollectionSite
              as_user_id: "cs-001"
          assert:
            - "HTTP 409 with error.error_id == ERR_INVALID_KIT_STATE — the withdrawal cascade already moved the kit DISPATCHED -> RETURNED, and priority 9 outranks the consent rule at priority 11"
            - "GET /cbb/collection-kits/${kit_id} shows status == RETURNED and hold_reason_code == null"
            - "GET /cbb/enrollments/${enr_id} shows lifecycle_status == WITHDRAWN, consent_status == REVOKED, withdrawal_reason_code == PARENT_REQUEST"
            - "no Collection row exists: GET /cbb/collection-kits/${kit_id}/collections returns total_count == 0"

      - name: corner_consent_amendment_holds_the_kit_and_reconsent_releases_it
        claim_type: side_effect_execution
        grounds: "§1.2 consent_status CONSENTED -> AMENDMENT_PENDING side effect 'every CollectionKit with status == DISPATCHED := HELD with hold_reason_code CONSENT_AMENDMENT_PENDING' and AMENDMENT_PENDING -> CONSENTED side effect 'every HELD kit with clock <= expires_at := DISPATCHED with hold_reason_code := null'."
        distinguishing_aspect: "Traverses the consent cycle once and asserts both directions of the kit side effect, including that the lifecycle axis never moves and that consent_version increments only on the re-consent leg."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One PRIVATE_FAMILY enrollment with lifecycle KIT_DISPATCHED, consent CONSENTED, consent_version 1, consent_amendment_count 0."
            - "One DISPATCHED kit with hold_reason_code null and expires_at 2026-11-29T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cbb/enrollments"
              payload: { program_type: "PRIVATE_FAMILY", primary_parent_name: "Avery Lin", expected_delivery_date: "2026-08-10T00:00:00Z", collection_site_code: "SITE-01" }
