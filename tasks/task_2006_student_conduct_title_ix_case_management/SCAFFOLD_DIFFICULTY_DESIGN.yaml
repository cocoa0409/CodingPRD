          assert:
            - "DETERMINATION-target appeal rejected ERR_APPEAL_TARGET_INVALID (no ISSUED determination on the case)"
            - "DISMISSAL-target appeal on the same case accepted: Appeal.${app_id}.status == FILED - gating is by target entity state, not by case state"

  # ==========================================================================
  # Rule 8 - resource_temporal_overlap (2 instances, different interval semantics)
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: directive_supersede_truncates_overlapping_window
        grounds:
          - state_machines.NoContactDirective.ACTIVE_to_SUPERSEDED
          - validations[priority=6]
          - entities.NoContactDirective.fields.superseded_by_directive_id
        distinguishing_aspect: |
          Semantics 1 - half-open intervals on the (case, party-scope) resource: an overlapping
          RESPONDENT-scope create is rejected without supersede_existing, but with supersede_existing
          the incumbent's effective_to is TRUNCATED to the newcomer's effective_from and its status
          flips to SUPERSEDED with superseded_by_directive_id set - arithmetic on the interval endpoint,
          not a boolean conflict flag.
        test_recipe:
          setup:
            - "Case [DATING_VIOLENCE] with directive D1 RESPONDENT scope [2026-08-01T00:00:00Z, 2026-08-10T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["DATING_VIOLENCE"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "ONLINE_FORM" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id, v0: $.data.version }
            - call: "POST /api/cases/${case_id}/no-contact-directives"
              payload: { party_side: "RESPONDENT", restrictions: ["IN_PERSON"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-10T00:00:00Z", expected_case_version: "${v0}" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { d1_id: $.data.id }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { v1: $.data.version } }
            - call: "POST /api/cases/${case_id}/no-contact-directives"
              payload: { party_side: "RESPONDENT", restrictions: ["ELECTRONIC"], effective_from: "2026-08-05T00:00:00Z", effective_to: "2026-08-20T00:00:00Z", expected_case_version: "${v1}" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { err: $.data.error_id }
          trigger:
            - call: "POST /api/cases/${case_id}/no-contact-directives"
              payload: { party_side: "RESPONDENT", restrictions: ["ELECTRONIC"], effective_from: "2026-08-05T00:00:00Z", effective_to: "2026-08-20T00:00:00Z", supersede_existing: true, expected_case_version: "${v1}" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { d2_id: $.data.id }
            - { call: "GET /api/no-contact-directives/${d1_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { d1_status: $.data.status, d1_to: $.data.effective_to, d1_sup_by: $.data.superseded_by_directive_id } }
