        distinguishing_aspect: "Grant last_season 2029 beyond contract term_last_season 2028 fails ERR_GRANT_OUTSIDE_TERM 422 at create."
        test_recipe:
          setup: ["Venue V; ACTIVE sponsor S; DRAFT contract C term 2026-2028"]
          setup_api_calls:
            - { call: "POST /venues", payload: { display_name: "Vector Arena", city: "Austin" }, as: VenueAdmin, captures: { v_id: $.data.id } }
