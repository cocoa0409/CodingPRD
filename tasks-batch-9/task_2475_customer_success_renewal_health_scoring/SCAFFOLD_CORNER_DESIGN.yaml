            - "Account.${acct_id}.lifecycle_state == \"ADOPTING\" (the first COMPLETE closed onboarding; the replay changed nothing)."
            - "Account.${acct_id}.ttv_breach_flag == false and contractual_ttv_days is null (no GO_LIVE milestone exists)."

      - name: outcome_goal_in_progress_self_edge_is_repeatable
        claim_type: valid_transition
        grounds:
          - state_machines.OutcomeGoal.IN_PROGRESS_to_IN_PROGRESS
          - calculations.outcome_attainment_index
          - entities.OutcomeGoal.fields.attainment_pct
        distinguishing_aspect: "IN_PROGRESS -> IN_PROGRESS is a legal self-edge: a second progress report moves attainment_pct 40.00 -> 55.00 and snapshot_health_score 38.75 -> 42.50 without leaving IN_PROGRESS."
        test_recipe:
          setup:
            - "One ACTIVE HIGH_TOUCH Csm with capacity_units_total 40."
            - "One ENTERPRISE Account with no signals and no sponsors (A = 0.00, S = 100.00, E = 25.00)."
            - "One OutcomeGoal with weight_bp 10000, target_value 100.00, actual_value 40.00, driven DEFINED -> IN_PROGRESS at actual_value 40.00 (index 40.00, snapshot 38.75)."
