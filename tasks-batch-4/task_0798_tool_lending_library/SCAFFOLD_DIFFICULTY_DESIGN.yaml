            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loan_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
