            - { call: "POST /meter-sets/${ms_y}/size", payload: {}, as: DesignEngineer, as_user_id: "eng-1" }
          assert:
            - "ServiceApplication.${app_x}.diversity_adjusted_load_cfph == 425.0 and MeterSet.${ms_x}.meter_model == AL_425 (equality selects, does not bump) with regulator_model == R_325"
            - "ServiceApplication.${app_y}.diversity_adjusted_load_cfph == 637.5 and MeterSet.${ms_y}.meter_model == AL_800 with regulator_model == R_750"
            - "both meter sets are in status SIZED"

      - name: meter_size_unavailable_rejected
        claim_type: threshold_overflow
        grounds: [calculations.meter_sizing, "errors[ERR_METER_SIZE_UNAVAILABLE]"]
        distinguishing_aspect: "One row with quantity 90 × 100000 btuh = 9000.0 CFPH connected; n=1 keeps factor 1.00 → 9000.0 exceeds the largest model (AL_5000 at LOW) → 422 ERR_METER_SIZE_UNAVAILABLE and the meter set stays PLANNED."
