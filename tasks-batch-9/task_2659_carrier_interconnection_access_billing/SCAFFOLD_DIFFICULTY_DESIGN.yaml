- rule_id: resource_temporal_overlap
  instances:
  - name: tariff_rate_windows_may_touch_but_never_overlap
    grounds:
    - validations[priority=22]
    - errors[ERR_TARIFF_WINDOW_OVERLAP]
    - entities.TariffFiling.fields.effective_date
    - entities.TariffFiling.fields.expiry_date
    distinguishing_aspect: |
      Interval semantics: HALF-OPEN [effective_date, expiry_date) over the shared resource "the rate element LOCAL_RECIPROCAL_COMP", so a window starting exactly where the incumbent ends is ACCEPTED and a window that overlaps by even one instant is rejected. This is the opposite convention, on a different resource entity, from the CLOSED buffered installation windows contended over TrunkAugmentOrder crews at a point of interconnection.
    test_recipe:
      setup:
      - One EFFECTIVE LOCAL_RECIPROCAL_COMP filing at 0.061250 covering [2026-08-01, 2027-01-01).
      - Logical clock at the 2026-08-01T00:00:00Z default.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-LOC-001
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.061250
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_loc_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_loc_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      trigger:
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2027-LOC-002
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.055000
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2027-01-01T00:00:00.000Z'
          expiry_date: '2027-07-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_next_id: $.data.id
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2027-LOC-003
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.050000
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-12-01T00:00:00.000Z'
          expiry_date: '2027-03-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures: *id004
      assert:
      - 'The touching filing is accepted: TariffFiling.${tf_next_id}.status == FILED with effective_date 2027-01-01T00:00:00Z, sharing the incumbent''s expiry instant'
      - The overlapping filing is rejected with 409 and error_id ERR_TARIFF_WINDOW_OVERLAP
      - No TariffFiling row exists with filing_docket TF-2027-LOC-003
      - GET /interconnection/tariff-filings for rate_element LOCAL_RECIPROCAL_COMP returns total_count 2
      - TariffFiling.${tf_loc_id}.status is still EFFECTIVE with expiry_date 2027-01-01T00:00:00Z and superseded_by_filing_id null
  - name: buffered_augment_install_windows_collide_when_they_touch
    grounds:
    - validations[priority=22]
    - errors[ERR_AUGMENT_WINDOW_COLLISION]
    - calculations.augment_install_window
    - state_machines.TrunkAugmentOrder.PENDING_to_ACCEPTED
    - entities.TrunkAugmentOrder.fields.install_window_start
    distinguishing_aspect: |
      Interval semantics: CLOSED install windows [committed_due_date - 5 days, committed_due_date] padded by 24 hours on both edges and compared with <= on both sides, so buffered windows that merely TOUCH at one instant collide. The contended resource is the single installation crew at a point of interconnection, shared by TrunkAugmentOrder rows, which is a different resource entity under the opposite (touch-forbidding) convention from the half-open TariffFiling rate windows.
    test_recipe:
      setup:
      - An EFFECTIVE agreement with poi_facility_capacity_trunks 192.
      - Two IN_SERVICE TWO_WAY trunk groups at the SAME point of interconnection DLLSTXCTDS0, 48 trunks each, forecast 1200.00 CCS.
      - A 3.00% blocking measurement on each trunk group has produced one PENDING augment order per group for 24 additional trunks.
      - The first order is ACCEPTED with committed_due_date 2026-09-15, so its buffered window is [2026-09-09, 2026-09-16].
      - Logical clock at the 2026-08-01T00:00:00Z default, well before every committed date.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-LOC-001
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.061250
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_loc_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_loc_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
          agreement_label: ICA-NORTHSTAR-2026
          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          transit_traffic_allowed: false
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
          agr_v0: $.data.version
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v0}
          offer_type: PROPOSAL
          reciprocal_rate_per_mou_usd: 0.061250
          term_months: 36
          poi_financial_responsibility: SHARED
          transit_traffic_allowed: false
        as: InterconnectionManager
        captures:
          offer1_id: $.data.id
      - call: POST /interconnection/negotiation-offers/${offer1_id}/accept
        payload: {}
        as: CarrierRepresentative
        as_user_id: ${car_id}
      - call: POST /interconnection/agreements/${agr_id}/activate
        payload: {}
        as: InterconnectionManager
      - *id001
      - *id002
      - *id003
      - *id005
      - *id006
      - *id007
      - call: POST /interconnection/trunk-groups/${tg1_id}/traffic-measurements
        payload:
          measurement_period_start: '2026-07-01T00:00:00.000Z'
          measurement_period_end: '2026-07-31T00:00:00.000Z'
          offered_calls: 10000
          blocked_calls: 300
          busy_hour_ccs: 2100.00
        as: NetworkPlanner
      - call: POST /interconnection/trunk-groups/${tg2_id}/traffic-measurements
        payload:
          measurement_period_start: '2026-07-01T00:00:00.000Z'
          measurement_period_end: '2026-07-31T00:00:00.000Z'
          offered_calls: 10000
          blocked_calls: 300
          busy_hour_ccs: 2100.00
        as: NetworkPlanner
      - call: GET /interconnection/trunk-augment-orders
        payload:
          trunk_group_id: ${tg1_id}
          status: PENDING
        as: NetworkPlanner
        captures:
          o1_id: $.data[0].id
      - call: GET /interconnection/trunk-augment-orders
        payload:
          trunk_group_id: ${tg2_id}
          status: PENDING
        as: NetworkPlanner
        captures:
          o2_id: $.data[0].id
      - call: POST /interconnection/trunk-augment-orders/${o1_id}/accept
        payload:
          committed_due_date: '2026-09-15T00:00:00.000Z'
        as: CarrierRepresentative
        as_user_id: ${car_id}
      trigger:
      - call: POST /interconnection/trunk-augment-orders/${o2_id}/accept
        payload:
          committed_due_date: '2026-09-22T00:00:00.000Z'
        as: CarrierRepresentative
        as_user_id: ${car_id}
        captures: *id004
      - call: POST /interconnection/trunk-augment-orders/${o2_id}/accept
        payload:
          committed_due_date: '2026-09-23T00:00:00.000Z'
        as: CarrierRepresentative
        as_user_id: ${car_id}
      assert:
      - 'The 2026-09-22 acceptance is rejected with 409 and error_id ERR_AUGMENT_WINDOW_COLLISION: its buffered window starts 2026-09-16, exactly where the first order''s buffered window ends'
      - After the rejection TrunkAugmentOrder.${o2_id}.status is still PENDING with committed_due_date null, install_window_start null and install_window_end null
      - The 2026-09-23 acceptance returns 200 with TrunkAugmentOrder.${o2_id}.status == ACCEPTED
      - TrunkAugmentOrder.${o2_id}.install_window_start == 2026-09-18T00:00:00Z and install_window_end == 2026-09-23T00:00:00Z, so its buffered window [2026-09-17, 2026-09-24] clears the peer by one day
      - TrunkAugmentOrder.${o1_id}.status == ACCEPTED with install_window_start 2026-09-10T00:00:00Z and install_window_end 2026-09-15T00:00:00Z, untouched by either attempt
      - InterconnectionAgreement.${agr_id}.poi_augment_pending_count == 2
- rule_id: compensating_invariant
  instances:
  - name: dispute_withdrawal_returns_the_disputed_reserve_to_zero
    grounds:
    - calculations.reserve_provision
    - state_machines.BillingDispute.UNDER_REVIEW_to_WITHDRAWN
    - entities.ReserveLedgerEntry.fields.amount_usd
    - entities.Carrier.fields.disputed_reserve_balance_usd
    distinguishing_aspect: |
      Conserved quantity: RESERVE DOLLARS. Every reserve movement is mirrored by a signed ReserveLedgerEntry, so the ledger sum per bucket always equals the persisted balance, and withdrawing the only dispute returns both buckets to their pre-dispute values (DISPUTED_REVENUE to exactly 0.00, UNCOLLECTIBLE back to 1.62) rather than leaving a residue. The other instance of this rule conserves physical trunk counts, not money.
    test_recipe:
      setup:
      - A carrier with one ISSUED invoice of 32.47 and no payments.
      - One dispute of 10.00 filed and acknowledged, so disputed_reserve_balance_usd is 10.00 and the uncollectible bucket has been re-tiered down to 0.45.
      - Logical clock at 2026-09-01T00:00:00Z, still inside the 30-day RATE_APPLICATION SLA.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-INT-001
          rate_element: INTERSTATE_SWITCHED_ACCESS
          rate_per_mou_usd: 0.512500
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_int_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_int_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-IST-001
          rate_element: INTRASTATE_SWITCHED_ACCESS
          rate_per_mou_usd: 0.487500
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_ist_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_ist_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-LOC-001
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.061250
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_loc_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_loc_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/traffic-factor-filings
        payload:
          carrier_id: ${car_id}
          expected_carrier_version: ${car_v0}
          quarter: 2026Q3
          reported_piu_pct: 50.00
          reported_plu_pct: 10.00
        as: AccessBillingAnalyst
        captures:
          ff_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          target_utc: '2026-09-01T00:00:00.000Z'
        as: PlatformAdmin
      - call: POST /interconnection/usage-batches
        payload:
          carrier_id: ${car_id}
          period_start: '2026-08-01T00:00:00.000Z'
          period_end: '2026-08-31T00:00:00.000Z'
          direction: TERMINATING_TO_US
          exchange_reference: EXG-2026-08-IN
        as: AccessBillingAnalyst
        captures:
          batch_id: $.data.id
      - call: POST /interconnection/usage-batches/${batch_id}/call-detail-records
        payload:
          originating_npanxx: '214555'
          terminating_npanxx: '214777'
          duration_seconds: 180
          signaling_cpn_present: true
          originating_state_code: TX
          terminating_state_code: TX
          same_local_calling_area: true
        as: AccessBillingAnalyst
      - call: POST /interconnection/usage-batches/${batch_id}/call-detail-records
        payload:
          originating_npanxx: '214555'
          terminating_npanxx: '405222'
          duration_seconds: 61
          signaling_cpn_present: true
          originating_state_code: TX
          terminating_state_code: OK
          same_local_calling_area: false
        as: AccessBillingAnalyst
      - call: POST /interconnection/usage-batches/${batch_id}/call-detail-records
        payload:
          originating_npanxx: '214555'
          terminating_npanxx: '713444'
          duration_seconds: 300
          signaling_cpn_present: true
          originating_state_code: TX
          terminating_state_code: TX
          same_local_calling_area: false
        as: AccessBillingAnalyst
      - call: POST /interconnection/usage-batches/${batch_id}/call-detail-records
        payload:
          originating_npanxx: '214555'
          terminating_npanxx: '713444'
          duration_seconds: 120
          signaling_cpn_present: false
          originating_state_code: TX
          terminating_state_code: TX
          same_local_calling_area: false
        as: AccessBillingAnalyst
      - call: POST /interconnection/usage-batches/${batch_id}/call-detail-records
        payload:
          originating_npanxx: '682555'
          terminating_npanxx: '713444'
          duration_seconds: 3600
          signaling_cpn_present: false
          terminating_state_code: TX
          same_local_calling_area: false
        as: AccessBillingAnalyst
      - call: POST /interconnection/usage-batches/${batch_id}/call-detail-records
        payload:
          originating_npanxx: '682555'
          terminating_npanxx: '713444'
          duration_seconds: 30
          signaling_cpn_present: true
          terminating_state_code: TX
          same_local_calling_area: false
        as: AccessBillingAnalyst
      - call: POST /interconnection/usage-batches/${batch_id}/jurisdictionalize
        payload: {}
        as: AccessBillingAnalyst
      - call: POST /interconnection/usage-batches/${batch_id}/rate
        payload: {}
        as: AccessBillingAnalyst
      - call: POST /interconnection/access-invoices
        payload:
          usage_batch_id: ${batch_id}
          due_date: '2026-10-01T00:00:00.000Z'
        as: AccessBillingAnalyst
        captures:
          inv_id: $.data.id
      - call: POST /interconnection/access-invoices/${inv_id}/issue
        payload: {}
        as: AccessBillingAnalyst
        as_user_id: u-billing-01
      - call: POST /interconnection/billing-disputes
        payload:
          invoice_id: ${inv_id}
          disputed_amount_usd: 10.00
          reason_code: RATE_APPLICATION
          supporting_detail: Interstate rate element applied to intrastate minutes on 4 records
        as: CarrierRepresentative
        as_user_id: ${car_id}
        captures:
          disp_id: $.data.id
      - call: POST /interconnection/billing-disputes/${disp_id}/acknowledge
        payload: {}
        as: DisputeResolutionOfficer
        as_user_id: u-dispute-07
      trigger:
      - call: POST /interconnection/billing-disputes/${disp_id}/withdraw
        payload:
          withdrawal_reason: Carrier re-ran its own signaling sample and accepts the jurisdiction
        as: CarrierRepresentative
        as_user_id: ${car_id}
      - call: GET /interconnection/reserve-ledger-entries
        payload:
          carrier_id: ${car_id}
          reserve_bucket: DISPUTED_REVENUE
        as: RevenueAssuranceController
      - call: GET /interconnection/reserve-ledger-entries
        payload:
          carrier_id: ${car_id}
          reserve_bucket: UNCOLLECTIBLE
        as: RevenueAssuranceController
      - call: GET /interconnection/carriers/${car_id}/reserve-summary
        payload: {}
        as: RevenueAssuranceController
      assert:
      - BillingDispute.${disp_id}.status == WITHDRAWN and credited_amount_usd == 0.00
      - AccessInvoice.${inv_id}.dispute_status == NONE, disputed_amount_usd == 0.00, open_balance_usd == 32.47
      - 'The DISPUTED_REVENUE ledger holds exactly 2 entries: +10.00 with balance_after_usd 10.00, then -10.00 with balance_after_usd 0.00'
      - The signed DISPUTED_REVENUE amounts sum to 0.00, exactly Carrier.${car_id}.disputed_reserve_balance_usd
      - 'The UNCOLLECTIBLE ledger holds exactly 3 entries: +1.62 (balance_after 1.62), -1.17 (balance_after 0.45), +1.17 (balance_after 1.62)'
      - The signed UNCOLLECTIBLE amounts sum to 1.62, exactly Carrier.${car_id}.uncollectible_reserve_balance_usd
      - reserve-summary reports net_receivable_usd 32.47, tier_pct 5.00, regulatory_disputed_reserve_usd 0.00, gaap_disputed_reserve_usd 0.00 and disputed_reserve_basis_delta_usd 0.00
  - name: augment_reversal_restores_the_in_service_trunk_inventory
    grounds:
    - state_machines.TrunkAugmentOrder.COMPLETED_to_REVERSED
    - state_machines.TrunkGroup.AUGMENT_ORDERED_to_GROOMING_REVIEW
    - entities.TrunkGroup.fields.provisioned_trunks
    - entities.InterconnectionAgreement.fields.total_in_service_trunks
    distinguishing_aspect: |
      Conserved quantity: PHYSICAL TRUNK COUNT. The agreement's total_in_service_trunks always equals the sum of provisioned_trunks over its IN_SERVICE trunk groups, so a completed 24-trunk augment that is later reversed must give the 24 trunks back at both levels and return the group to a quiescent augment_status, leaving inventory exactly as it started. The other instance of this rule conserves reserve dollars, not trunks.
    test_recipe:
      setup:
      - An EFFECTIVE agreement with poi_facility_capacity_trunks 192 and one IN_SERVICE TWO_WAY trunk group at DLLSTXCTDS0 with 48 provisioned trunks.
      - A 3.00% blocking measurement has ordered a 24-trunk augment, the carrier accepted it for 2026-09-15, and the install completed with 24 trunks, so provisioned_trunks is 72.
      - Logical clock at the 2026-08-01T00:00:00Z default.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-LOC-001
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.061250
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_loc_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_loc_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
          agreement_label: ICA-NORTHSTAR-2026
          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          transit_traffic_allowed: false
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
          agr_v0: $.data.version
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v0}
          offer_type: PROPOSAL
          reciprocal_rate_per_mou_usd: 0.061250
          term_months: 36
          poi_financial_responsibility: SHARED
          transit_traffic_allowed: false
        as: InterconnectionManager
        captures:
          offer1_id: $.data.id
      - call: POST /interconnection/negotiation-offers/${offer1_id}/accept
        payload: {}
        as: CarrierRepresentative
        as_user_id: ${car_id}
      - call: POST /interconnection/agreements/${agr_id}/activate
        payload: {}
        as: InterconnectionManager
      - *id001
      - *id002
      - *id003
      - call: POST /interconnection/trunk-groups/${tg1_id}/traffic-measurements
        payload:
          measurement_period_start: '2026-07-01T00:00:00.000Z'
          measurement_period_end: '2026-07-31T00:00:00.000Z'
          offered_calls: 10000
          blocked_calls: 300
          busy_hour_ccs: 2100.00
        as: NetworkPlanner
      - call: GET /interconnection/trunk-augment-orders
        payload:
          trunk_group_id: ${tg1_id}
          status: PENDING
        as: NetworkPlanner
        captures:
          o1_id: $.data[0].id
      - call: POST /interconnection/trunk-augment-orders/${o1_id}/accept
        payload:
          committed_due_date: '2026-09-15T00:00:00.000Z'
        as: CarrierRepresentative
        as_user_id: ${car_id}
      - call: POST /interconnection/trunk-augment-orders/${o1_id}/complete
        payload:
          installed_trunks: 24
        as: NetworkPlanner
      trigger:
      - call: POST /interconnection/trunk-augment-orders/${o1_id}/reverse
        payload:
          reversal_reason: The installed DS1 failed acceptance testing and was pulled back out
        as: NetworkPlanner
      - call: GET /interconnection/trunk-groups/${tg1_id}
        payload: {}
        as: NetworkPlanner
      - call: GET /interconnection/agreements/${agr_id}
        payload: {}
        as: InterconnectionManager
      assert:
      - Immediately before the reversal TrunkGroup.${tg1_id}.provisioned_trunks was 72 and InterconnectionAgreement.${agr_id}.total_in_service_trunks was 72
      - TrunkAugmentOrder.${o1_id}.status == REVERSED and installed_trunks == 24 is retained as the audit record of what was undone
      - TrunkGroup.${tg1_id}.provisioned_trunks == 48, exactly the pre-augment inventory
      - TrunkGroup.${tg1_id}.augment_status == GROOMING_REVIEW and open_augment_order_count == 0 and service_status == IN_SERVICE
      - InterconnectionAgreement.${agr_id}.total_in_service_trunks == 48, equal to the sum of provisioned_trunks over its IN_SERVICE trunk groups
      - InterconnectionAgreement.${agr_id}.poi_augment_pending_count == 0 and capacity_posture == NORMAL
