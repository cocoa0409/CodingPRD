            - "CarrierAccount.${carr}.activation_state == PENDING"
            - "PayoffQuote.${quote}.status == ISSUED with quote_type == EARLY_CANCELLATION, consumed_at == null, issued_at == 2026-08-01T00:00:00Z, expires_at == 2026-08-08T00:00:00Z and paid_installment_count_at_quote == 0"

      - name: trade_in_receipt_returns_device_and_deactivates_the_line
        claim_type: valid_transition
        grounds:
          - state_machines.TradeIn.DECLARED_to_RECEIVED
          - state_machines.DeviceUnit.possession_status.RETURN_PENDING_to_RETURNED
          - state_machines.DeviceUnit.activation_status.ACTIVATED_to_DEACTIVATED
          - endpoints.POST_/trade-ins/{id}/receipt
        distinguishing_aspect: |
          POST /trade-ins/{id}/receipt moves the TradeIn DECLARED -> RECEIVED, stamps
          received_at from the logical clock, drives the handset's possession dimension
          RETURN_PENDING -> RETURNED, and the RETURNED possession state cascades the
          activation dimension ACTIVATED -> DEACTIVATED with activated_at cleared — while
          the unlock dimension stays LOCKED and the UpgradeRequest stays TRADE_IN_DECLARED
          (grading has not happened yet).
