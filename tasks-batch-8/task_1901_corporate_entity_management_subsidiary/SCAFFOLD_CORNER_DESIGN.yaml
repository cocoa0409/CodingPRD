              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { e1: "$.data.id" }
          trigger:
            - call: "PATCH /api/entities/${e1}"
              payload: { authorized_shares: 25000 }
              as: CorporateSecretary
              as_user_id: "sec-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409 and data.error_id == ERR_ENTITY_NOT_ACTIVE"
