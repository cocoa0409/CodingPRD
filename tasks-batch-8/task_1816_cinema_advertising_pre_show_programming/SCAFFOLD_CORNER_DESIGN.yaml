  - section: calculations
    instances:
      - name: forecast_opening_boundary_day7_vs_day8
        claim_type: boundary_edge
        grounds: ["calculations.forecast_attendance"]
        distinguishing_aspect: "Opening window is inclusive at day 7: 2026-08-17 (exactly release+7d) still yields the 1.25x variant (132), while 2026-08-18 drops to standard (105) — the only difference is the calendar date."
        test_recipe:
          setup: ["MAJOR_METRO theater, 200-seat screen, PG13 feature released 2026-08-10"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
          trigger:
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-17T19:00:00Z" }, as: NetworkOps, captures: { st7: "$.data.id", fc7: "$.data.forecast_attendance" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-18T19:00:00Z" }, as: NetworkOps, captures: { fc8: "$.data.forecast_attendance" } }
          assert:
            - "day-7 showtime forecast_attendance == 132 (opening multiplier still applies, inclusive boundary)"
            - "day-8 showtime forecast_attendance == 105 (standard variant)"

