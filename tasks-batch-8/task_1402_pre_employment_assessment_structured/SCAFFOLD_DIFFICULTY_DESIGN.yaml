# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Pre-Employment Assessment & Structured Interview
# 24 instances across the nine Difficulty Rules of SKILL.md §0.5.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: adverse_impact_provisional_vs_final_divergence
        grounds:
          - calculations.adverse_impact_ratio
          - entities.AdverseImpactSnapshot.fields.snapshot_type
          - entities.CandidateAssessment.fields.admin_status
        distinguishing_aspect: |
          Same cycle data, two snapshot_type variants on the AdverseImpactSnapshot/Cycle domain:
          PROVISIONAL counts SCHEDULED/NO_SHOW applicants and composite-projected selections
          (flagged=true, GROUP_B ratio 0.0000), while FINAL counts COMPLETED-only applicants,
          shrinking both groups below MIN_GROUP_N=2 (ratios null, flagged=false). Divergence is
          driven purely by variant input-set/selection-predicate, not by any data change.
        test_recipe:
          setup:
            - "Vendor/instrument VALIDATED (window evidence), guide APPROVED (COMM 0.6/5, ANAL 0.4/5, RAW), requisition hm-1, cycle ACTIVE window 2026-08-10..2026-08-20"
            - "a1 GROUP_A COMPLETED composite 0.7413 (raw 72, scorecard COMM4/ANAL5); a2 GROUP_A SCHEDULED only"
            - "b1 GROUP_B COMPLETED composite 0.3933 (raw 45, scorecard COMM3/ANAL3); b2 GROUP_B NO_SHOW"
            - "No HiringDecisions exist"
          setup_api_calls:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments", security_clearance_tier: "TIER_1" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "COG-A", instrument_type: "COGNITIVE_ABILITY", title: "Cognitive Battery A", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin, captures: { i: $.data.id } }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CRITERION", title: "Criterion validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CONTENT", title: "Content validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/submit-validation-review", as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/validate", as: TalentAssessmentAdmin }
            - { call: "POST /talent/interview-guides", payload: { title: "Structured Guide v1", rubric_items: [{ competency_code: "COMM", weight: 0.6, scale_max: 5 }, { competency_code: "ANAL", weight: 0.4, scale_max: 5 }], scoring_mode: "RAW" }, as: TalentAssessmentAdmin, as_user_id: admin-1, captures: { g: $.data.id } }
            - { call: "POST /talent/interview-guides/${g}/pilot", as: TalentAssessmentAdmin, as_user_id: admin-1 }
            - { call: "POST /talent/interview-guides/${g}/approve", as: TalentAssessmentAdmin, as_user_id: admin-2 }
            - { call: "POST /talent/requisitions", payload: { title: "Senior Analyst", department: "Risk", openings_count: 2, retention_days: 730 }, as: HiringManager, as_user_id: hm-1, captures: { r: $.data.id } }
            - { call: "POST /talent/requisitions/${r}/cycles", payload: { instrument_id: "${i}", guide_id: "${g}", label: "Fall Cycle", administration_window_start: "2026-08-10T00:00:00Z", administration_window_end: "2026-08-20T00:00:00Z", max_sessions_per_day: 8 }, as: HiringManager, as_user_id: hm-1, captures: { cy: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/activate", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/interviewers", payload: { full_name: "Ivy One", email: "ivy1@x.com", department: "Risk" }, as: TalentAssessmentAdmin, captures: { iv1: $.data.id } }
            - { call: "POST /talent/interviewers/${iv1}/calibrations", payload: { guide_id: "${g}" }, as: TalentAssessmentAdmin, captures: { cal1: $.data.id } }
            - { call: "POST /talent/calibrations/${cal1}/certify", payload: { practice_score: 0.85 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/candidates", payload: { external_ref: "C-A1", full_name: "Cand A1", email: "ca1@x.com", group_code: "GROUP_A" }, as: HiringManager, as_user_id: hm-1, captures: { ca1: $.data.id } }
            - { call: "POST /talent/candidates", payload: { external_ref: "C-A2", full_name: "Cand A2", email: "ca2@x.com", group_code: "GROUP_A" }, as: HiringManager, as_user_id: hm-1, captures: { ca2: $.data.id } }
            - { call: "POST /talent/candidates", payload: { external_ref: "C-B1", full_name: "Cand B1", email: "cb1@x.com", group_code: "GROUP_B" }, as: HiringManager, as_user_id: hm-1, captures: { cb1: $.data.id } }
            - { call: "POST /talent/candidates", payload: { external_ref: "C-B2", full_name: "Cand B2", email: "cb2@x.com", group_code: "GROUP_B" }, as: HiringManager, as_user_id: hm-1, captures: { cb2: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/invitations", payload: { candidate_id: "${ca1}" }, as: HiringManager, as_user_id: hm-1, captures: { a1: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/invitations", payload: { candidate_id: "${ca2}" }, as: HiringManager, as_user_id: hm-1, captures: { a2: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/invitations", payload: { candidate_id: "${cb1}" }, as: HiringManager, as_user_id: hm-1, captures: { b1: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/invitations", payload: { candidate_id: "${cb2}" }, as: HiringManager, as_user_id: hm-1, captures: { b2: $.data.id } }
            - { call: "POST /talent/assessments/${a1}/schedule", payload: { scheduled_for: "2026-08-10T09:00:00Z" }, as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/assessments/${a2}/schedule", payload: { scheduled_for: "2026-08-10T09:00:00Z" }, as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/assessments/${b1}/schedule", payload: { scheduled_for: "2026-08-10T09:00:00Z" }, as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/assessments/${b2}/schedule", payload: { scheduled_for: "2026-08-10T09:00:00Z" }, as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/assessments/${a1}/start", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/assessments/${a1}/complete", payload: { raw_score: 72 }, as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/assessments/${b1}/start", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/assessments/${b1}/complete", payload: { raw_score: 45 }, as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/assessments/${b2}/mark-no-show", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/cycles/${cy}/sessions", payload: { candidate_id: "${ca1}", interviewer_id: "${iv1}", guide_id: "${g}", scheduled_start: "2026-08-12T10:00:00Z", scheduled_end: "2026-08-12T11:00:00Z" }, as: HiringManager, as_user_id: hm-1, captures: { s1: $.data.id } }
            - { call: "POST /talent/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T11:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/sessions/${s1}/complete", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/sessions/${s1}/scorecards", payload: { ratings: [{ competency_code: "COMM", rating: 4 }, { competency_code: "ANAL", rating: 5 }], overall_recommendation: "YES" }, as: Interviewer, as_user_id: "${iv1}", captures: { sc1: $.data.id } }
            - { call: "POST /talent/scorecards/${sc1}/submit", as: Interviewer, as_user_id: "${iv1}" }
            - { call: "POST /talent/cycles/${cy}/sessions", payload: { candidate_id: "${cb1}", interviewer_id: "${iv1}", guide_id: "${g}", scheduled_start: "2026-08-13T10:00:00Z", scheduled_end: "2026-08-13T11:00:00Z" }, as: HiringManager, as_user_id: hm-1, captures: { s2: $.data.id } }
            - { call: "POST /talent/_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T11:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/sessions/${s2}/complete", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/sessions/${s2}/scorecards", payload: { ratings: [{ competency_code: "COMM", rating: 3 }, { competency_code: "ANAL", rating: 3 }], overall_recommendation: "NO" }, as: Interviewer, as_user_id: "${iv1}", captures: { sc2: $.data.id } }
            - { call: "POST /talent/scorecards/${sc2}/submit", as: Interviewer, as_user_id: "${iv1}" }
          trigger:
            - { call: "POST /talent/cycles/${cy}/adverse-impact-snapshots", payload: { snapshot_type: "PROVISIONAL" }, as: ComplianceOfficer, captures: { snap_p: $.data.id } }
            - { call: "POST /talent/cycles/${cy}/adverse-impact-snapshots", payload: { snapshot_type: "FINAL" }, as: ComplianceOfficer, captures: { snap_f: $.data.id } }
          assert:
            - "Snapshot ${snap_p}.flagged == true (PROVISIONAL: applicants A=2/B=2, selected A=1/B=0, rates 0.5000/0.0000, ratio_B 0.0000 < 0.8000)"
            - "Snapshot ${snap_p}.group_breakdowns[GROUP_B].impact_ratio == 0.0000"
            - "Snapshot ${snap_f}.flagged == false (FINAL: applicants A=1/B=1, both < MIN_GROUP_N=2)"
            - "Snapshot ${snap_f}.group_breakdowns[GROUP_A].selection_rate == null AND excluded_reason == INSUFFICIENT_N"
            - "Snapshot ${snap_f}.highest_rate_group_code == null"
            - "Cycle ${cy}.posture == ACTIVE (FINAL not flagged -> no freeze)"
      - name: calibration_index_raw_vs_leniency_adjusted
        grounds:
          - calculations.interviewer_calibration_index
          - entities.InterviewGuide.fields.scoring_mode
          - entities.CalibrationRecord.fields.calibration_index
        distinguishing_aspect: |
          Dual-variant calculation on the Interviewer/CalibrationRecord domain (distinct from the
          snapshot domain of adverse_impact_provisional_vs_final_divergence): identical scorecard
          history under two guides differing only in scoring_mode yields calibration_index 0.6875
          (RAW) vs 0.6768 (LENIENCY_ADJUSTED) — the leniency factor (1 - 0.5*0.03125) strictly lowers it.
        test_recipe:
          setup:
            - "Instrument VALIDATED; guide G_RAW (scoring_mode RAW) APPROVED; guide G_ADJ (scoring_mode LENIENCY_ADJUSTED) APPROVED; identical rubric COMM 0.6/5 + ANAL 0.4/5"
            - "Cycle CY_RAW pins G_RAW; cycle CY_ADJ pins G_ADJ; both ACTIVE, window 2026-08-10..2026-08-20, capacity 8"
            - "Interviewers iv1, iv2 CALIBRATED for BOTH guides (4 CalibrationRecords, practice_score 0.85)"
            - "Per cycle: candidates x1, x2 COMPLETED (raw 50); sessions iv1+iv2 per candidate; SUBMITTED scorecards — x1: iv1 COMM4/ANAL5, iv2 COMM5/ANAL3; x2: iv1 COMM3/ANAL3, iv2 COMM4/ANAL4"
            - "Deviations for iv1 vs peers: |4-5|,|5-3|,|3-4|,|3-4| -> mean_abs_dev 1.25, scale 4"
          setup_api_calls:
            - { call: "POST /talent/vendors", payload: { name: "Acme Assessments" }, as: TalentAssessmentAdmin, captures: { v: $.data.id } }
            - { call: "POST /talent/instruments", payload: { vendor_id: "${v}", code: "COG-A", instrument_type: "COGNITIVE_ABILITY", title: "Cognitive Battery A", max_score: 100, pass_floor: 40 }, as: TalentAssessmentAdmin, captures: { i: $.data.id } }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CRITERION", title: "Criterion validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/evidence", payload: { evidence_type: "CONTENT", title: "Content validity study", issuer: "IO Psych Lab", effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-08-01T00:00:00Z" }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/submit-validation-review", as: TalentAssessmentAdmin }
            - { call: "POST /talent/instruments/${i}/validate", as: TalentAssessmentAdmin }
            - { call: "POST /talent/interview-guides", payload: { title: "Guide RAW", rubric_items: [{ competency_code: "COMM", weight: 0.6, scale_max: 5 }, { competency_code: "ANAL", weight: 0.4, scale_max: 5 }], scoring_mode: "RAW" }, as: TalentAssessmentAdmin, as_user_id: admin-1, captures: { g_raw: $.data.id } }
            - { call: "POST /talent/interview-guides/${g_raw}/pilot", as: TalentAssessmentAdmin, as_user_id: admin-1 }
            - { call: "POST /talent/interview-guides/${g_raw}/approve", as: TalentAssessmentAdmin, as_user_id: admin-2 }
            - { call: "POST /talent/interview-guides", payload: { title: "Guide ADJ", rubric_items: [{ competency_code: "COMM", weight: 0.6, scale_max: 5 }, { competency_code: "ANAL", weight: 0.4, scale_max: 5 }], scoring_mode: "LENIENCY_ADJUSTED" }, as: TalentAssessmentAdmin, as_user_id: admin-1, captures: { g_adj: $.data.id } }
            - { call: "POST /talent/interview-guides/${g_adj}/pilot", as: TalentAssessmentAdmin, as_user_id: admin-1 }
            - { call: "POST /talent/interview-guides/${g_adj}/approve", as: TalentAssessmentAdmin, as_user_id: admin-2 }
            - { call: "POST /talent/requisitions", payload: { title: "Senior Analyst", department: "Risk", openings_count: 10 }, as: HiringManager, as_user_id: hm-1, captures: { r: $.data.id } }
            - { call: "POST /talent/requisitions/${r}/cycles", payload: { instrument_id: "${i}", guide_id: "${g_raw}", label: "Cycle RAW", administration_window_start: "2026-08-10T00:00:00Z", administration_window_end: "2026-08-20T00:00:00Z", max_sessions_per_day: 8 }, as: HiringManager, as_user_id: hm-1, captures: { cy_raw: $.data.id } }
            - { call: "POST /talent/requisitions/${r}/cycles", payload: { instrument_id: "${i}", guide_id: "${g_adj}", label: "Cycle ADJ", administration_window_start: "2026-08-10T00:00:00Z", administration_window_end: "2026-08-20T00:00:00Z", max_sessions_per_day: 8 }, as: HiringManager, as_user_id: hm-1, captures: { cy_adj: $.data.id } }
            - { call: "POST /talent/cycles/${cy_raw}/activate", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/cycles/${cy_adj}/activate", as: HiringManager, as_user_id: hm-1 }
            - { call: "POST /talent/interviewers", payload: { full_name: "Ivy One", email: "ivy1@x.com", department: "Risk" }, as: TalentAssessmentAdmin, captures: { iv1: $.data.id } }
            - { call: "POST /talent/interviewers", payload: { full_name: "Ivy Two", email: "ivy2@x.com", department: "Risk" }, as: TalentAssessmentAdmin, captures: { iv2: $.data.id } }
            - { call: "POST /talent/interviewers/${iv1}/calibrations", payload: { guide_id: "${g_raw}" }, as: TalentAssessmentAdmin, captures: { cal1r: $.data.id } }
            - { call: "POST /talent/calibrations/${cal1r}/certify", payload: { practice_score: 0.85 }, as: TalentAssessmentAdmin }
            - { call: "POST /talent/interviewers/${iv2}/calibrations", payload: { guide_id: "${g_raw}" }, as: TalentAssessmentAdmin, captures: { cal2r: $.data.id } }
