            - { call: "POST /screening-events/${e2}/publish", payload: { expected_event_version: "${e2v}" }, as: ProgramManager }
            - { call: "POST /appointments", payload: { event_id: "${e2}", participant_id: "${pb}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager, captures: { ab3: $.data.id } }
            - { call: "POST /screening-events/${e2}/close", payload: {}, as: ProgramManager }
            - { call: "POST /appointments/${ab3}/mark-no-show", payload: {}, as: ProgramManager }
          trigger:
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${pb}", slot_start_min: 570, slot_duration_min: 30 }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_PARTICIPANT_BLOCKED"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: grant_depletion_boundary_remaining_exactly_zero
        grounds:
          - calculations.grant_depletion
          - entities.Grant.fields.is_depleted
          - endpoints.GET./grants/{id}
        distinguishing_aspect: "Numeric-threshold metric on GET /grants/{id}: is_depleted flips at remaining_cents <= DEPLETION_FLOOR_CENTS(0); a grant driven to exactly remaining_cents=0 by commitments is is_depleted=true (<=, not strictly <)."
        test_recipe:
          setup:
            - "GRANT sponsor + Grant total_budget_cents=8000; one GRANT participant screened on a blood panel (list 8000) so grant_covered_cents=8000, committed_cents=8000, remaining_cents=0."
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Phleb P", role_type: "PHLEBOTOMIST", modality: "BLOOD_PANEL" }, as: ProgramManager }
            - { call: "POST /sponsors", payload: { name: "GrantBody", sponsor_type: "GRANT", viewer_user_id: "sv2" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /grants", payload: { sponsor_id: "${sponsor_id}", name: "Fund", total_budget_cents: 8000 }, as: ProgramManager, captures: { grant_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L2", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "Pat G", date_of_birth: "1975-01-01", pay_type: "GRANT", grant_id: "${grant_id}" }, as: ProgramManager, captures: { part_id: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${part_id}", slot_start_min: 560, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/check-in", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/screen", payload: {}, as: ClinicalStaff }
          trigger:
            - { call: "GET /grants/${grant_id}", payload: {}, as: BillingClerk, captures: { remaining: $.data.remaining_cents, depleted: $.data.is_depleted } }
          assert:
            - "Grant.${grant_id}.remaining_cents == 0"
            - "Grant.${grant_id}.is_depleted == true"

      - name: event_full_boundary_booked_equals_capacity
        grounds:
          - validations[priority=12]
          - entities.ScreeningEvent.fields.booked_count
          - endpoints.POST./appointments
        distinguishing_aspect: "Collection/count metric on POST /appointments (different endpoint from the grant boundary): the (booked_count >= daily_capacity) guard rejects the booking that would make the second appointment on a capacity=1 event; the first booking (booked_count 0 < 1) succeeds, the second (booked_count 1 >= 1) returns ERR_EVENT_FULL."
        test_recipe:
          setup:
            - "One PUBLISHED blood-panel event on a daily_capacity=1 unit, already at booked_count=1 with one ACTIVE participant. A second ACTIVE participant attempts to book a non-overlapping slot."
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 1 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p1: $.data.id } }
            - { call: "POST /participants", payload: { full_name: "P2", date_of_birth: "1981-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p2: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p1}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager }
          trigger:
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p2}", slot_start_min: 600, slot_duration_min: 30 }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_EVENT_FULL"
            - "HTTP status == 409"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: checkin_requires_event_published
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CHECKED_IN
          - validations[priority=8]
        distinguishing_aspect: "Entity pair Appointment->ScreeningEvent: an Appointment can move SCHEDULED->CHECKED_IN only while its parent event is PUBLISHED; after the event is CLOSED the same check-in returns ERR_EVENT_NOT_PUBLISHED even though the appointment itself is a valid SCHEDULED."
        test_recipe:
          setup:
            - "One CLOSED blood-panel event holding one SCHEDULED, consent-signed appointment (event was published, appointment booked+consented, then event closed with the appointment still SCHEDULED)."
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p1: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p1}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /screening-events/${event_id}/close", payload: {}, as: ProgramManager }
          trigger:
            - { call: "POST /appointments/${appt_id}/check-in", payload: {}, as: ClinicalStaff, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_EVENT_NOT_PUBLISHED"
            - "Appointment.${appt_id}.status == SCHEDULED"

      - name: close_abnormal_appointment_requires_referral_terminal
        grounds:
          - state_machines.Appointment.RESULT_READY_to_CLOSED
          - state_machines.Referral.OPEN_to_CONTACTED
          - validations[priority=8]
        distinguishing_aspect: "Entity pair Appointment->Referral (different from Appointment->ScreeningEvent): a RESULT_READY appointment with an ABNORMAL result cannot CLOSE while its linked Referral is still OPEN/CONTACTED/SCHEDULED_FOLLOWUP; ERR_REFERRAL_UNRESOLVED until the referral is RESOLVED or LOST_TO_FOLLOWUP."
        test_recipe:
          setup:
            - "One RESULT_READY mammography appointment with result ABNORMAL and its linked Referral still OPEN."
          setup_api_calls:
