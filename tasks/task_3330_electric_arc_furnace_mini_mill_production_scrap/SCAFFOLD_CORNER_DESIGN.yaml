  # ===========================================================================
  - section: validations
    instances:

      - name: existence_beats_state_on_terminal_order_confirm
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors.ERR_ORDER_NOT_FOUND
        distinguishing_aspect: "Existence (priority 4) precedes state (priority 5): confirming a non-existent order id returns 404 ERR_ORDER_NOT_FOUND even though a confirm on a CANCELLED order would be a 409 — the 404 must win."
        test_recipe:
          setup: ["Default logical clock. One mill with one account, no orders."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Crawfordsville Bar Mill", division: "CONSTRUCTION", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts"
              payload: { name: "Contract Builders Inc", market: "CONSTRUCTION", pricing_mode: "CONTRACT" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders"
              payload: { product_family: "REBAR", grade_id: "${grade_id}", tons: 5, fulfillment_month: "2026-09", base_price_cents_per_ton: 25000 }
              as: AccountManager
              captures: { ord_real: $.data.id, ord_real_v: $.data.version }
          trigger:
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders/00000000-0000-4000-8000-000000000009/confirm"
              payload: { expected_order_version: "${ord_real_v}" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_ORDER_NOT_FOUND"
            - "err != ERR_INVALID_STATE"

      - name: posture_gate_vs_stale_version_priority_on_order_confirm
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=7]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / credit_fiscal_beats_nothing_but_blocked_vs_stale_version
          rationale: "Priority conflicts involving the OCC row (priority 6) are exercised by the §1.8 pair-conflict instances."

      - name: index_missing_is_fiscal_not_state
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors.ERR_INDEX_MISSING
        distinguishing_aspect: "Confirming an order whose pricing month has no PUBLISHED index yields 422 ERR_INDEX_MISSING (fiscal), and the order remains QUOTED — a missing price feed is not a state-machine fault."
        test_recipe:
          setup: ["Default logical clock 2026-09-01. Mill, grade (BILLET→SHREDDED), CONTRACT account, order fulfillment 2026-11. NO index published for 2026-11."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Crawfordsville Bar Mill", division: "CONSTRUCTION", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts"
              payload: { name: "Contract Builders Inc", market: "CONSTRUCTION", pricing_mode: "CONTRACT" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders"
              payload: { product_family: "REBAR", grade_id: "${grade_id}", tons: 5, fulfillment_month: "2026-11", base_price_cents_per_ton: 25000 }
              as: AccountManager
              captures: { ord_id: $.data.id, ord_v: $.data.version }
          trigger:
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v}" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_INDEX_MISSING"
            - "Order.${ord_id}.status remains QUOTED"

      - name: lot_depleted_and_contract_not_open_referential_checks
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors.ERR_LOT_DEPLETED
          - errors.ERR_CONTRACT_NOT_OPEN
        distinguishing_aspect: "Two referential guards on charge apply: drawing more than remaining_tons is ERR_LOT_DEPLETED, and drawing from a lot on a CLOSED contract is ERR_CONTRACT_NOT_OPEN — different error ids for different referential faults on the same endpoint."
        test_recipe:
          setup: ["Default logical clock. Mill, contract C1 FIXED with lot L1 (10t dry). Contract C2 FIXED committed 10t with lot L2 (10t dry), then C2 CLOSED. Grade, heat CHARGED with 2t from L1 (remaining 8)."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_1: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_1}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 10, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_1: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "Closeout Scrap", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 38000, committed_tons: 10 }
              as: ProcurementOfficer
              captures: { contract_2: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_2}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 10, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_2: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_2}/close"
              payload: {}
              as: ProcurementOfficer
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-REF", grade_id: "${grade_id}", target_tap_weight_tons: 8, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { heat_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_1}", tons: 2 }
              as: MillOperator
          trigger:
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_1}", tons: 9 }
              as: MillOperator
              captures: { err_depleted: $.data.error_id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_2}", tons: 1 }
              as: MillOperator
              captures: { err_closed: $.data.error_id }
          assert:
            - "drawing 9t against remaining 8t: err_depleted == ERR_LOT_DEPLETED"
            - "drawing from the CLOSED contract's lot: err_closed == ERR_CONTRACT_NOT_OPEN"
            - "ScrapLot.${lot_1}.remaining_tons is still 8 after both rejections"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: heats_list_paginates_and_filters_by_status
        claim_type: Listing
        grounds:
          - endpoints.GET_/mills/{millId}/heats
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three heats (two PLANNED, one CHARGED), limit=2 returns total_count 3 and has_more true; the status=CHARGED filter returns exactly 1 row; defaults are limit 10 / offset 0."
        test_recipe:
          setup: ["Default logical clock. Mill, contract, lot 20t, grade. Heats H1, H2 PLANNED (taps 2h apart); H3 charged (CHARGED)."]
          setup_api_calls:
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 40, moisture_pct: 0.0, cu_pct: 0.001, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_id: $.data.id }
