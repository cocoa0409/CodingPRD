              as: TerminalSuperintendent
            - call: "POST /rail/car-events"
              payload: { shipment_id: "${s}", yard_id: "${yA}", event_type: "TRAIN_DEPARTURE", occurred_at: "2026-09-01T08:00:00Z", car_count: 3 }
              as: TerminalSuperintendent
