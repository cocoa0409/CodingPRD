            - "the later APPROVE returns 409 with data.error_id == 'ERR_ACCOMMODATION_NOT_PENDING'"
            - "the resubmission returns 409 with data.error_id == 'ERR_ACCOMMODATION_NOT_INFO_REQUESTED'"
            - "GET /accommodation-requests/${ar} reports data.status == 'DENIED' and data.granted_format == null"

      - name: outcome_certification_repeated_rejected
        claim_type: idempotency
        grounds:
          - state_machines.OutcomeRecord.transitions.RECORDED_to_CERTIFIED
          - validations[priority=30]
          - errors[ERR_OUTCOME_NOT_CERTIFIABLE]
        distinguishing_aspect: |
          Only RECORDED outcomes are certifiable: the second CERTIFY is 409 ERR_OUTCOME_NOT_CERTIFIABLE
          and certified_by_user_id keeps the first certifier, so certification cannot be reassigned by
          replaying the call.
        test_recipe:
          setup:
            - "One OPEN funding period and one RECORDED EMPLOYMENT_Q2 outcome recorded by 'coordinator-1'."
          setup_api_calls:
            - call: "POST /funding-periods"
              payload: { label: "PY26-Q1", start_date: "2026-07-01", end_date: "2026-09-30", rate_cents_per_weight: 10000, total_cents: 500000 }
              as: StateAuthority
              as_user_id: "state-1"
              captures: { fp: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Hana Bright", email: "hana.bright@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              as_user_id: "coordinator-1"
              captures: { s: $.data.id }
            - call: "POST /outcome-records"
              payload: { student_id: "${s}", funding_period_id: "${fp}", measure_type: "EMPLOYMENT_Q2", evidence_ref: "wage-record-h1" }
              as: ProgramCoordinator
              as_user_id: "coordinator-1"
              captures: { oc: $.data.id }
            - call: "POST /outcome-records/${oc}/certification"
              payload: { decision: "CERTIFY" }
              as: StateAuthority
              as_user_id: "state-1"
          trigger:
            - call: "POST /outcome-records/${oc}/certification"
              payload: { decision: "CERTIFY" }
              as: StateAuthority
              as_user_id: "state-2"
              captures: { e1: $.data.error_id }
            - call: "GET /outcome-records/${oc}"
              payload: {}
              as: StateAuthority
              as_user_id: "state-2"
          assert:
            - "the first certification returned 200 with data.status == 'CERTIFIED', data.certified_by_user_id == 'state-1', data.weight == 1.25, data.allocation_status == 'UNALLOCATED', data.allocated_cents == 0"
            - "the second certification returns 409 with data.error_id == 'ERR_OUTCOME_NOT_CERTIFIABLE'"
            - "GET /outcome-records/${oc} returns data.certified_by_user_id == 'state-1' and data.recorded_by_user_id == 'coordinator-1'"

      - name: outcome_reject_decision_records_the_rejecting_user
        claim_type: valid_transition
        grounds:
          - state_machines.OutcomeRecord.transitions.RECORDED_to_REJECTED
          - endpoints[POST /outcome-records/{outcomeId}/certification]
        distinguishing_aspect: |
          REJECT is the sibling edge of CERTIFY and still stamps certified_by_user_id (the field records
          who adjudicated, not who approved); the outcome stays UNALLOCATED with allocated_cents 0 and
          the funding pool is untouched.
        test_recipe:
          setup:
            - "One OPEN funding period with total_cents 500000 and one RECORDED POSTSECONDARY_ENROLLMENT outcome."
          setup_api_calls:
            - call: "POST /funding-periods"
              payload: { label: "PY26-Q2", start_date: "2026-10-01", end_date: "2026-12-31", rate_cents_per_weight: 10000, total_cents: 500000 }
              as: StateAuthority
              as_user_id: "state-1"
              captures: { fp: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Ivo Sandu", email: "ivo.sandu@example.org", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              as_user_id: "coordinator-1"
              captures: { s: $.data.id }
            - call: "POST /outcome-records"
              payload: { student_id: "${s}", funding_period_id: "${fp}", measure_type: "POSTSECONDARY_ENROLLMENT", evidence_ref: "clearinghouse-i1" }
              as: ProgramCoordinator
              as_user_id: "coordinator-1"
              captures: { oc: $.data.id }
          trigger:
            - call: "POST /outcome-records/${oc}/certification"
              payload: { decision: "REJECT" }
              as: StateAuthority
              as_user_id: "state-9"
            - call: "GET /funding-periods/${fp}"
              payload: {}
              as: StateAuthority
              as_user_id: "state-9"
          assert:
            - "the certification call returns 200 with data.status == 'REJECTED', data.certified_by_user_id == 'state-9', data.weight == 1.40"
            - "data.allocation_status == 'UNALLOCATED' and data.allocated_cents == 0"
            - "GET /funding-periods/${fp} returns data.committed_cents == 0, data.available_cents == 500000, data.allocation_run_count == 0"

      - name: funding_period_close_is_terminal_for_run_and_close
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.FundingPeriod.terminal_states
          - state_machines.FundingPeriod.transitions.OPEN_to_CLOSED
          - errors[ERR_FUNDING_PERIOD_CLOSED]
        distinguishing_aspect: |
          CLOSED is terminal for BOTH outbound triggers - the self-transition allocation-run and a
          second close - and the closed period's version does not move again, so a stale-version retry
          cannot slip past the closure either.
        test_recipe:
          setup:
            - "One OPEN funding period, closed with no outcomes attached."
          setup_api_calls:
            - call: "POST /funding-periods"
              payload: { label: "PY26-Q3", start_date: "2027-01-01", end_date: "2027-03-31", rate_cents_per_weight: 10000, total_cents: 300000 }
              as: StateAuthority
              as_user_id: "state-1"
              captures: { fp: $.data.id }
