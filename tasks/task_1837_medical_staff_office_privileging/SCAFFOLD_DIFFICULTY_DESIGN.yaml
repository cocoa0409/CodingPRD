scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fppe_provisional_vs_final_boundary_metric
        grounds:
          - calculations.fppe_composite_score
          - entities.PerformanceReview.fields.provisional_composite_score
          - entities.PerformanceReview.fields.final_composite_score
        distinguishing_aspect: |
          Same review, same two ACTIVE metrics: the provisional variant INCLUDES a metric
          collected at exactly period_end (boundary-inclusive) while the final variant EXCLUDES
          it (half-open), producing provisional_composite_score == 91.00 but
          final_composite_score == 45.00 from identical stored data.
        test_recipe:
          setup:
            - "Member M1 exists with an INITIAL application APPROVED through the full board pipeline so member is ACTIVE with one PrivilegeGrant G1 (CARD-CATH) in PROVISIONAL"
            - "SpecialtyCriteria CARD/CARD-CATH exists with min_training_months=24, min_case_volume_24mo=50, required_board_cert=true, fppe_case_count=5, tier table [{BASIC,50,0.10},{ADVANCED,200,0.25},{EXPERT,500,0.40}]"
            - "Member holds a CURRENT BOARD_CERT credential expiring 2027-08-01"
            - "FPPE PerformanceReview R1 on G1 with period [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z), status PROVISIONAL_RESULT"
            - "Metric A: CLINICAL_QUALITY raw 2.0 collected 2026-09-10T00:00:00Z weight 0.5 (normalized 90.00)"
            - "Metric B: PATIENT_SAFETY raw 1.0 collected exactly 2026-10-01T00:00:00Z weight 0.5 (normalized 92.00)"
          setup_api_calls:
            - call: "POST /mso/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/specialty-criteria"
              payload: { specialty_code: "CARD", privilege_line: "CARD-CATH", min_training_months: 24, min_case_volume_24mo: 50, required_board_cert: true, fppe_case_count: 5, volume_tier_table: [{tier_name: "BASIC", min_cases: 50, score_multiplier: 0.10}, {tier_name: "ADVANCED", min_cases: 200, score_multiplier: 0.25}, {tier_name: "EXPERT", min_cases: 500, score_multiplier: 0.40}] }
              as: MedicalStaffCoordinator
            - call: "POST /mso/members"
              payload: { full_name: "Dr. A", npdb_subject_id: "NPDB-A", primary_specialty_code: "CARD" }
              as: MedicalStaffCoordinator
              captures: { m1_id: $.data.id, m1_v: $.data.version }
            - call: "POST /mso/expirable-credentials"
              payload: { member_id: "${m1_id}", credential_kind: "BOARD_CERT", credential_number: "BC-1", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/applications"
              payload: { member_id: "${m1_id}", application_kind: "INITIAL", expected_member_version: "${m1_v}" }
              as: MedicalStaffCoordinator
              captures: { app1_id: $.data.id, app1_v: $.data.version }
            - call: "POST /mso/verification-items"
              payload: { application_id: "${app1_id}", item_kind: "MEDICAL_SCHOOL", is_primary_source: true }
              as: MedicalStaffCoordinator
              captures: { vi1_id: $.data.id }
            - call: "POST /mso/delineations"
              payload: { application_id: "${app1_id}", privilege_line: "CARD-CATH", documented_training_months: 30, documented_cases_24mo: 250, expected_application_version: "${app1_v}" }
              as: MedicalStaffCoordinator
              captures: { del1_id: $.data.id }
            - call: "POST /mso/applications/${app1_id}/submit"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/verification-items/${vi1_id}/mark-received"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/verification-items/${vi1_id}/verify"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/delineations/${del1_id}/evaluate"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/applications/${app1_id}/advance-to-committee"
              payload: {}
              as: CredentialsCommitteeChair
            - call: "GET /mso/agenda-items"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { ag1_id: "$.data[0].id" }
            - call: "POST /mso/agenda-items/${ag1_id}/committee-vote"
              payload: { votes_for: 3, votes_against: 0 }
              as: CredentialsCommitteeChair
            - call: "POST /mso/agenda-items/${ag1_id}/mec-endorse"
              payload: { voter_id: "mec-user-1" }
              as: MedicalExecutiveCommitteeChair
            - call: "POST /mso/agenda-items/${ag1_id}/board-ratify"
              payload: {}
              as: BoardMember
            - call: "GET /mso/privilege-grants"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { g1_id: "$.data[0].id" }
            - call: "POST /mso/performance-reviews"
              payload: { member_id: "${m1_id}", privilege_grant_id: "${g1_id}", review_kind: "FPPE", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: MedicalStaffCoordinator
              captures: { r1_id: $.data.id }
            - call: "POST /mso/performance-metrics"
              payload: { review_id: "${r1_id}", metric_domain: "CLINICAL_QUALITY", raw_value: 2.0, domain_weight: 0.5, collected_at: "2026-09-10T00:00:00Z", passed_fppe_case: true }
              as: MedicalStaffCoordinator
            - call: "POST /mso/performance-metrics"
              payload: { review_id: "${r1_id}", metric_domain: "PATIENT_SAFETY", raw_value: 1.0, domain_weight: 0.5, collected_at: "2026-10-01T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/performance-reviews/${r1_id}/close-collection"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/performance-reviews/${r1_id}/compute-provisional"
              payload: {}
              as: MedicalStaffCoordinator
          trigger:
            - call: "POST /mso/performance-reviews/${r1_id}/finalize"
              payload: {}
              as: CredentialsCommitteeChair
              captures: { r1_prov: $.data.provisional_composite_score, r1_fin: $.data.final_composite_score }
          assert:
            - "PerformanceReview.${r1_id}.provisional_composite_score == 91.00"
            - "PerformanceReview.${r1_id}.final_composite_score == 45.00"
            - "provisional_composite_score != final_composite_score for identical stored metrics (boundary metric included vs excluded)"

      - name: credential_risk_forward_vs_chronological
        grounds:
          - calculations.credential_expiry_risk_window
          - entities.MedicalStaffMember.fields.credential_expiry_risk_score
        distinguishing_aspect: |
          Same member, same credential: the forward-looking variant computed at clock
          2026-08-01 scores the MALPRACTICE_INSURANCE credential (24 days to expiry, critical
          kind) at 75.00, while the chronological as-of variant at 2026-07-01 excludes the
          credential entirely (issued_on 2026-07-15 > as_of) and returns 0.00.
        test_recipe:
          setup:
            - "Member M2 exists (APPLICANT); logical clock is 2026-08-01T00:00:00Z"
            - "M2 holds one MALPRACTICE_INSURANCE credential issued 2026-07-15, expiring 2026-08-25 (24 days from clock), credential_number MI-9"
          setup_api_calls:
            - call: "POST /mso/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/members"
              payload: { full_name: "Dr. B", npdb_subject_id: "NPDB-B", primary_specialty_code: "EMED" }
              as: MedicalStaffCoordinator
              captures: { m2_id: $.data.id }
            - call: "POST /mso/expirable-credentials"
              payload: { member_id: "${m2_id}", credential_kind: "MALPRACTICE_INSURANCE", credential_number: "MI-9", issued_on: "2026-07-15T00:00:00Z", expires_on: "2026-08-25T00:00:00Z" }
              as: MedicalStaffCoordinator
          trigger:
            - call: "GET /mso/members/${m2_id}/credential-risk"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { risk_now: $.data.risk_score }
            - call: "GET /mso/members/${m2_id}/credential-risk?as_of=2026-07-01T00:00:00Z"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { risk_asof: $.data.risk_score }
          assert:
            - "forward-looking risk_score == 75.00 (50 points * 1.5 critical-kind multiplier for 24-day window)"
            - "chronological as_of=2026-07-01 risk_score == 0.00 (credential not yet issued at as_of)"
            - "risk_now != risk_asof"

  # =================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) and (b))
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: delineation_tiered_scoring_with_nested_minmax
        grounds:
          - calculations.privilege_delineation_satisfaction
          - entities.PrivilegeDelineation.fields.satisfaction_score
        distinguishing_aspect: |
          Mode (a): the formula combines 3+ inputs (training months, case volume, board-cert
          presence) through tiered-rate selection (volume_tier_table walk) plus nested
          min/max (training bonus capped at 24 months, case score capped at 1000) — inputs
          30 months / 250 cases with board cert yield tier ADVANCED and score exactly 65.50,
          while 49 cases fails volume_ok and pins tier UNMET regardless of the same training.
        test_recipe:
          setup:
            - "SpecialtyCriteria CARD/CARD-CATH exists (min_training 24, min_cases 50, board cert required, tiers BASIC/50/0.10, ADVANCED/200/0.25, EXPERT/500/0.40)"
            - "Member M3 with CURRENT BOARD_CERT; application APP3 in SUBMITTED with delineation D-A (training 30, cases 250)"
            - "Member M4 with CURRENT BOARD_CERT; application APP4 in SUBMITTED with delineation D-B (training 30, cases 49)"
          setup_api_calls:
            - call: "POST /mso/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/specialty-criteria"
              payload: { specialty_code: "CARD", privilege_line: "CARD-CATH", min_training_months: 24, min_case_volume_24mo: 50, required_board_cert: true, fppe_case_count: 5, volume_tier_table: [{tier_name: "BASIC", min_cases: 50, score_multiplier: 0.10}, {tier_name: "ADVANCED", min_cases: 200, score_multiplier: 0.25}, {tier_name: "EXPERT", min_cases: 500, score_multiplier: 0.40}] }
              as: MedicalStaffCoordinator
            - call: "POST /mso/members"
              payload: { full_name: "Dr. C", npdb_subject_id: "NPDB-C", primary_specialty_code: "CARD" }
              as: MedicalStaffCoordinator
              captures: { m3_id: $.data.id, m3_v: $.data.version }
            - call: "POST /mso/expirable-credentials"
              payload: { member_id: "${m3_id}", credential_kind: "BOARD_CERT", credential_number: "BC-3", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/applications"
              payload: { member_id: "${m3_id}", application_kind: "INITIAL", expected_member_version: "${m3_v}" }
              as: MedicalStaffCoordinator
              captures: { app3_id: $.data.id, app3_v: $.data.version }
            - call: "POST /mso/verification-items"
              payload: { application_id: "${app3_id}", item_kind: "MEDICAL_SCHOOL", is_primary_source: true }
              as: MedicalStaffCoordinator
            - call: "POST /mso/delineations"
              payload: { application_id: "${app3_id}", privilege_line: "CARD-CATH", documented_training_months: 30, documented_cases_24mo: 250, expected_application_version: "${app3_v}" }
              as: MedicalStaffCoordinator
              captures: { delA_id: $.data.id }
            - call: "POST /mso/applications/${app3_id}/submit"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/members"
              payload: { full_name: "Dr. D", npdb_subject_id: "NPDB-D", primary_specialty_code: "CARD" }
              as: MedicalStaffCoordinator
              captures: { m4_id: $.data.id, m4_v: $.data.version }
            - call: "POST /mso/expirable-credentials"
              payload: { member_id: "${m4_id}", credential_kind: "BOARD_CERT", credential_number: "BC-4", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/applications"
              payload: { member_id: "${m4_id}", application_kind: "INITIAL", expected_member_version: "${m4_v}" }
              as: MedicalStaffCoordinator
              captures: { app4_id: $.data.id, app4_v: $.data.version }
            - call: "POST /mso/verification-items"
              payload: { application_id: "${app4_id}", item_kind: "MEDICAL_SCHOOL", is_primary_source: true }
              as: MedicalStaffCoordinator
            - call: "POST /mso/delineations"
              payload: { application_id: "${app4_id}", privilege_line: "CARD-CATH", documented_training_months: 30, documented_cases_24mo: 49, expected_application_version: "${app4_v}" }
              as: MedicalStaffCoordinator
              captures: { delB_id: $.data.id }
            - call: "POST /mso/applications/${app4_id}/submit"
              payload: {}
              as: MedicalStaffCoordinator
          trigger:
            - call: "POST /mso/delineations/${delA_id}/evaluate"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/delineations/${delB_id}/evaluate"
              payload: {}
              as: MedicalStaffCoordinator
          assert:
            - "PrivilegeDelineation.${delA_id}.delineation_status == CRITERIA_MET"
            - "PrivilegeDelineation.${delA_id}.satisfaction_tier == ADVANCED"
            - "PrivilegeDelineation.${delA_id}.satisfaction_score == 65.50"
            - "PrivilegeDelineation.${delB_id}.delineation_status == CRITERIA_UNMET (49 < 50 fails volume_ok despite identical training and board cert)"
            - "PrivilegeDelineation.${delB_id}.satisfaction_tier == UNMET"

      - name: fppe_per_domain_rounding_order_pinned
        grounds:
          - calculations.fppe_composite_score
          - entities.PerformanceMetric.fields.normalized_value
        distinguishing_aspect: |
          Mode (b): rounding order is pinned per-domain-first — DOCUMENTATION metrics with
          raw 91.005 and 92.335 round per-metric to 91.01 and 92.34, then average-and-round
          to 91.68; the reversed order (average raw then round) yields 91.67. The scaffold
          pins per-domain-first, so provisional composite over the single DOCUMENTATION
          domain with weight 1.0 must equal 91.68 exactly.
        test_recipe:
          setup:
            - "Member M5 ACTIVE with grant G5 (via full pipeline, EMED/EMED-GEN criteria with required_board_cert=false)"
            - "OPPE review R5 on G5, period [2026-09-01, 2026-10-01), two DOCUMENTATION metrics raw 91.005 (collected 2026-09-05) and 92.335 (collected 2026-09-06), each domain_weight 1.0"
            - "Review advanced to EVALUATION"
          setup_api_calls:
            - call: "POST /mso/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/specialty-criteria"
              payload: { specialty_code: "EMED", privilege_line: "EMED-GEN", min_training_months: 12, min_case_volume_24mo: 10, required_board_cert: false, fppe_case_count: 3, volume_tier_table: [{tier_name: "BASIC", min_cases: 10, score_multiplier: 0.10}] }
              as: MedicalStaffCoordinator
            - call: "POST /mso/members"
              payload: { full_name: "Dr. E", npdb_subject_id: "NPDB-E", primary_specialty_code: "EMED" }
              as: MedicalStaffCoordinator
              captures: { m5_id: $.data.id, m5_v: $.data.version }
            - call: "POST /mso/applications"
              payload: { member_id: "${m5_id}", application_kind: "INITIAL", expected_member_version: "${m5_v}" }
              as: MedicalStaffCoordinator
              captures: { app5_id: $.data.id, app5_v: $.data.version }
            - call: "POST /mso/verification-items"
              payload: { application_id: "${app5_id}", item_kind: "WORK_HISTORY", is_primary_source: false }
              as: MedicalStaffCoordinator
              captures: { vi5_id: $.data.id }
            - call: "POST /mso/delineations"
              payload: { application_id: "${app5_id}", privilege_line: "EMED-GEN", documented_training_months: 24, documented_cases_24mo: 100, expected_application_version: "${app5_v}" }
              as: MedicalStaffCoordinator
              captures: { del5_id: $.data.id }
            - call: "POST /mso/applications/${app5_id}/submit"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/verification-items/${vi5_id}/mark-received"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/verification-items/${vi5_id}/verify"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/delineations/${del5_id}/evaluate"
              payload: {}
              as: MedicalStaffCoordinator
            - call: "POST /mso/applications/${app5_id}/advance-to-committee"
              payload: {}
              as: CredentialsCommitteeChair
            - call: "GET /mso/agenda-items"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { ag5_id: "$.data[0].id" }
            - call: "POST /mso/agenda-items/${ag5_id}/committee-vote"
              payload: { votes_for: 3, votes_against: 0 }
              as: CredentialsCommitteeChair
            - call: "POST /mso/agenda-items/${ag5_id}/mec-endorse"
              payload: { voter_id: "mec-user-5" }
              as: MedicalExecutiveCommitteeChair
            - call: "POST /mso/agenda-items/${ag5_id}/board-ratify"
              payload: {}
              as: BoardMember
            - call: "GET /mso/privilege-grants"
              payload: {}
              as: MedicalStaffCoordinator
              captures: { g5_id: "$.data[0].id" }
            - call: "POST /mso/performance-reviews"
              payload: { member_id: "${m5_id}", privilege_grant_id: "${g5_id}", review_kind: "OPPE", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: MedicalStaffCoordinator
              captures: { r5_id: $.data.id }
            - call: "POST /mso/performance-metrics"
              payload: { review_id: "${r5_id}", metric_domain: "DOCUMENTATION", raw_value: 91.005, domain_weight: 1.0, collected_at: "2026-09-05T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/performance-metrics"
              payload: { review_id: "${r5_id}", metric_domain: "DOCUMENTATION", raw_value: 92.335, domain_weight: 1.0, collected_at: "2026-09-06T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/performance-reviews/${r5_id}/close-collection"
              payload: {}
              as: MedicalStaffCoordinator
          trigger:
            - call: "POST /mso/performance-reviews/${r5_id}/compute-provisional"
              payload: {}
              as: MedicalStaffCoordinator
          assert:
            - "PerformanceReview.${r5_id}.provisional_composite_score == 91.68 (per-metric round 91.01/92.34 then domain average round; NOT 91.67 from averaging raw values first)"

  # =================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: adverse_case_remand_cycle_loops
        grounds:
          - state_machines.AdverseActionCase.HEARING_HELD_to_REMANDED
          - state_machines.AdverseActionCase.REMANDED_to_HEARING_REQUESTED
        distinguishing_aspect: |
          Cyclic machine on AdverseActionCase: HEARING_HELD -> REMANDED -> HEARING_REQUESTED
          -> HEARING_HELD is a loop that may repeat; each remand extends
          hearing_request_deadline by 30 days from the remand instant, and the case never
          leaves the cycle until a UPHELD/OVERTURNED decision.
        test_recipe:
          setup:
            - "Member S1 ACTIVE (full pipeline) and DepartmentChief P1 (member record) proposes SUSPENSION case C1 at clock 2026-08-01; case endorsed; hearing requested on time; 3 eligible panelists seated; hearing held"
          setup_api_calls:
            - call: "POST /mso/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
            - call: "POST /mso/specialty-criteria"
              payload: { specialty_code: "EMED", privilege_line: "EMED-GEN", min_training_months: 12, min_case_volume_24mo: 10, required_board_cert: false, fppe_case_count: 3, volume_tier_table: [{tier_name: "BASIC", min_cases: 10, score_multiplier: 0.10}] }
              as: MedicalStaffCoordinator
            - call: "POST /mso/members"
              payload: { full_name: "Dr. Subject", npdb_subject_id: "NPDB-S1", primary_specialty_code: "EMED" }
              as: MedicalStaffCoordinator
              captures: { s1_id: $.data.id, s1_v: $.data.version }
            - call: "POST /mso/applications"
