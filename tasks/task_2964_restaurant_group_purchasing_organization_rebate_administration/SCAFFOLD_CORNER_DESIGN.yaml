            - "call 2: 409 with error_id == ERR_LOA_NOT_ACTIVE, and PurchaseBatch.${b1_id}.line_count is still 0"
            - "call 3: 201 — the same batch still accepts Pier 9's line, so the gate is per member, not per batch; line_count == 1 and total_cases_ingested == 40"
            - "call 4: 409 with error_id == ERR_INVALID_STATE — REVOKED is terminal, and the counters do not go negative (Distributor.${dist_id}.active_letter_count is still 1)"
            - "GET /authorization-letters with member_id == ${m1_id} and status == ACTIVE returns total_count == 0 while an unfiltered list returns total_count == 1"

  - section: errors
    instances:

      - name: missing_or_unknown_auth_headers_return_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          Four different header defects must all produce the same 401 before any
          business logic runs: no X-User-Role, no X-User-ID, a role name that is
          not one of the six, and a role name whose spelling is right but whose
          case is wrong. The blank cases send an EMPTY string, not a space, so a
          server that trims-then-checks and one that checks-then-trims agree.
        test_recipe:
          setup:
            - "One ProgramTier exists so that a correctly authenticated read has something to return."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
          trigger:
            - call: "GET /program-tiers"
              as: ""
              as_user_id: "admin-01"
              captures: { e1: $.data.error_id }
            - call: "GET /program-tiers"
              as: GpoAdmin
              as_user_id: ""
              captures: { e2: $.data.error_id }
            - call: "GET /program-tiers"
              as: "Auditor"
              as_user_id: "admin-01"
              captures: { e3: $.data.error_id }
            - call: "GET /program-tiers"
              as: "gpoadmin"
              as_user_id: "admin-01"
              captures: { e4: $.data.error_id }
            - call: "GET /program-tiers"
              as: GpoAdmin
              as_user_id: "admin-01"
          assert:
            - "call 1: 401 with error_id == ERR_UNAUTHENTICATED — X-User-Role is sent as an empty string"
            - "call 2: 401 with error_id == ERR_UNAUTHENTICATED — X-User-ID is sent as an empty string, and the role alone is not enough"
            - "call 3: 401 with error_id == ERR_UNAUTHENTICATED — Auditor is not one of the six declared roles, so this is 401 and NOT 403 ERR_FORBIDDEN_ROLE"
            - "call 4: 401 with error_id == ERR_UNAUTHENTICATED — role matching is exact-case, so gpoadmin fails"
            - "every rejection still carries the standard envelope: meta.api_request_id, meta.api_request_timestamp, response_type == error and a non-empty data.message"
            - "call 5: 200 with total_count == 1 — the same URL works once both headers are well formed"
            - "no rejected call created or mutated anything: GET /program-tiers still reports total_count == 1 and ProgramTier.${tier_id}.version == 1"

      - name: pagination_arguments_outside_their_declared_bounds_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - response_envelope.pagination
          - errors.ERR_INVALID_PAGINATION
        distinguishing_aspect: |
          limit is bounded 1..100 inclusive and offset must be >= 0, so 0 and 101
          fail while 1 and 100 succeed and a non-integer limit fails as a
          pagination error rather than as a generic body error. Because this is a
          query-string rule it must fire even though the request has no body.
        test_recipe:
          setup:
            - "ProgramTier ELITE and two Members exist, so an unpaginated list would return 2 rows."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Pier 9 Oyster Bar Inc", tier_id: "${tier_id}", committed_annual_spend_cents: 9000000 }
              as: GpoAdmin
              captures: { m2_id: $.data.id }
          trigger:
            - call: "GET /members"
              payload: { limit: 0 }
              as: GpoAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /members"
              payload: { limit: 101 }
              as: GpoAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /members"
              payload: { offset: -1 }
              as: GpoAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /members"
              payload: { limit: "ten" }
              as: GpoAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /members"
              payload: { limit: 1, offset: 1 }
              as: GpoAdmin
            - call: "GET /members"
              payload: { limit: 100, offset: 0 }
              as: GpoAdmin
          assert:
            - "calls 1 through 4: 400 with error_id == ERR_INVALID_PAGINATION"
            - "call 1 pins the lower bound as inclusive-of-1: limit 0 is invalid, not silently defaulted to 10"
            - "call 2 pins the upper bound as inclusive-of-100: 101 is invalid"
            - "call 4 is still ERR_INVALID_PAGINATION and not ERR_INVALID_REQUEST — the rule owns query arguments even though there is no request body"
            - "call 5: 200 with limit == 1, offset == 1, total_count == 2, has_more == false and exactly one row in data"
            - "call 6: 200 with limit == 100, offset == 0, total_count == 2, has_more == false and two rows in data"
            - "GET /members with no pagination arguments at all returns limit == 10 and offset == 0, the declared defaults"

      - name: duplicate_business_keys_are_rejected_within_their_declared_scope
        claim_type: violation_to_error
        grounds:
          - validations[priority=31]
          - validations[priority=32]
          - validations[priority=33]
        distinguishing_aspect: |
          Three uniqueness rules with three different scopes are exercised
          side by side: tier_code and deal_code are global, manufacturer_sku is
          unique only within one deal, and source_reference only within one
          distributor. The two positive controls (same SKU under another deal,
          same source_reference under another distributor) are what distinguish
          a correctly scoped index from a global one.
        test_recipe:
          setup:
            - "ProgramTier ELITE, Distributors METRO-01 and SYSCO-02, Deals PBC-2026 and RVL-2026 all exist."
            - "ContractedItem PBC-PATTY-4OZ belongs to PBC-2026; PurchaseBatch METRO-2026-06 belongs to METRO-01."
