              captures: { err_id: $.data.error_id }
          assert:
            - "trigger returns 403 with error_id ERR_FORBIDDEN_ROLE"

  # =========================================================================
  # Cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_endorsement_happy_path_version_increments
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[policy-endorse-stale-version]"]
        distinguishing_aspect: "A correct expected_policy_version succeeds and increments Policy.version by exactly 1, making the previously correct version stale for the next endorsement."
