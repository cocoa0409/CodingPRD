            - { call: "POST /replacement-campaigns", payload: { campaign_name: "Init Check", quota: 5 }, as: MeterOpsAdmin, captures: { camp: $.data.campaign_status } }
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-08-02T00:00:00Z" }, as: MeterOpsAdmin, captures: { snap: $.data.snapshot_status } }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "C43", period_start_date: "2026-09-01", period_end_date: "2026-09-30", read_window_open_date: "2026-09-03", read_window_close_date: "2026-09-07", bill_run_date: "2026-09-30" }, as: MeterOpsAdmin, captures: { per: $.data.period_status } }
