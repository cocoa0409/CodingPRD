              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dev_id: $.data.id }
            - call: "POST /clinical-engineering/recall-notices"
              payload: { facility_id: "${f_id}", device_model_id: "${m2_id}", source_reference: "FDA-2026-5001", hazard_class: "CLASS_II", response_due_at: "2026-10-01T00:00:00Z" }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { r_id: $.data.id }
            - call: "POST /clinical-engineering/recall-notices/${r_id}/publish"
              payload: {}
              as: CEManager
              as_user_id: "ce-mgr-01"
            - call: "GET /clinical-engineering/recall-matches"
              payload: { recall_notice_id: "${r_id}" }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { rm_id: "$.data[0].id" }
            - call: "POST /clinical-engineering/recall-matches/${rm_id}/disposition"
              payload: { disposition: "EXEMPTED" }
              as: CEManager
              as_user_id: "ce-mgr-01"
          trigger:
            - call: "POST /clinical-engineering/recall-matches/${rm_id}/disposition"
              payload: { disposition: "REMOVED" }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_INVALID_RECALL_MATCH_STATE"
            - "RecallMatch.${rm_id}.disposition == EXEMPTED"
            - "Device.${dev_id}.operational_state == IN_SERVICE"
            - "RecallNotice.${r_id}.pending_match_count == 0"

  # ===========================================================================
  - section: rbac
    instances:

      - name: biomed_tech_cannot_create_a_facility
        claim_type: role_denial
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED]"
          - "roles.CEManager.exclusive_operations"
        distinguishing_aspect: "POST /facilities is exclusive to CEManager, so a BiomedTech attempt returns 403 ERR_UNAUTHORIZED and no facility exists afterwards."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Rogue Campus", facility_code: "RGE-01", pm_compliance_target_pct: 90.00 }
              as: BiomedTech
              as_user_id: "tech-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403 and data.error_id == ERR_UNAUTHORIZED"

      - name: dept_steward_cannot_close_a_work_order
        claim_type: role_denial
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED]"
          - "roles.CEManager.exclusive_operations"
        distinguishing_aspect: "close is exclusive to CEManager; a DeptSteward acting as the owning department still gets 403 ERR_UNAUTHORIZED, and no debit reaches the department."
        test_recipe:
          setup: ["A verified in-house repair on the steward's own department's device."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { f_id: $.data.id }
            - call: "POST /clinical-engineering/departments"
              payload: { facility_id: "${f_id}", name: "Telemetry Unit", cost_center_code: "CC-5200", downtime_budget_cents: 5000000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dept_id: $.data.id }
            - call: "POST /clinical-engineering/device-models"
              payload: { manufacturer: "GE", model_number: "CAM-500", device_family: "PATIENT_MONITOR", expected_life_years: 10, replacement_cost_cents: 1500000 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { m2_id: $.data.id }
            - call: "POST /clinical-engineering/devices"
              payload: { facility_id: "${f_id}", department_id: "${dept_id}", device_model_id: "${m2_id}", serial_number: "SN-2001", acquisition_date: "2019-03-01", acquisition_cost_cents: 1400000, function_code: 5, physical_risk_code: 3, maintenance_requirement_code: 2, condition_score: 4 }
              as: CEManager
              as_user_id: "ce-mgr-01"
              captures: { dev_id: $.data.id }
            - call: "POST /clinical-engineering/work-orders"
              payload: { device_id: "${dev_id}", reported_severity: "ROUTINE", problem_summary: "Steward-reported fault" }
              as: DeptSteward
              as_user_id: "${dept_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /clinical-engineering/work-orders/${wo_id}/assign"
              payload: { service_mode: "IN_HOUSE" }
              as: BiomedTech
              as_user_id: "tech-alpha"
            - call: "POST /clinical-engineering/work-orders/${wo_id}/complete-repair"
              payload: { labor_minutes: 60, parts_cost_cents: 0 }
              as: BiomedTech
              as_user_id: "tech-alpha"
            - call: "POST /clinical-engineering/work-orders/${wo_id}/verify"
              payload: { result: "PASS" }
              as: BiomedTech
              as_user_id: "tech-bravo"
            - call: "GET /clinical-engineering/departments/${dept_id}"
              payload: {}
              as: DeptSteward
              as_user_id: "${dept_id}"
              captures: { dept_v: $.data.version }
          trigger:
            - call: "POST /clinical-engineering/work-orders/${wo_id}/close"
              payload: { expected_department_version: "${dept_v}" }
              as: DeptSteward
              as_user_id: "${dept_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403 and data.error_id == ERR_UNAUTHORIZED"
            - "WorkOrder.${wo_id}.status == VERIFIED"
            - "Department.${dept_id}.downtime_spend_cents == 0"

      - name: biomed_tech_cannot_change_device_security_state
        claim_type: role_denial
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED]"
          - "roles.SecurityOfficer.exclusive_operations"
        distinguishing_aspect: "The cyber dimension is exclusive to SecurityOfficer: a BiomedTech attempting to move a device to ASSESSED_OK gets 403 ERR_UNAUTHORIZED and security_state stays UNASSESSED."
        test_recipe:
          setup: ["One device at security_state UNASSESSED."]
          setup_api_calls:
            - call: "POST /clinical-engineering/facilities"
              payload: { name: "Riverbend Medical Center", facility_code: "RMC-01", pm_compliance_target_pct: 90.00 }
