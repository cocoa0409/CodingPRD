  - section: calculations
    instances:
      - name: channel_settlement_total_applies_ota_commission_at_ticketing
        claim_type: correct_result
        grounds:
          - calculations.channel_settlement_total
          - entities.Booking.fields.commission_cents
          - entities.Booking.fields.channel_settlement_total_cents
          - entities.DistributionChannel.fields.commission_bp
        distinguishing_aspect: "With fare_component_cents 14000, zero ancillary gross and OTA_SKYDEAL at commission_bp 900, the settlement is commission 1260, provisional 15260, incentive tier 0 bp (15260 < 30000) and channel_settlement_total_cents 15260."
        test_recipe:
          setup:
            - "family ECO_LITE (base 12000, bundle 14000) carries one ACTIVE INCLUDED BAG_CHECKED_1 and is PUBLISHED IN_PARITY on OTA_SKYDEAL (commission_bp 900, markup_bp 500, max_ancillary_price 6000)"
            - "booking SETL01 on flight AC520 is HELD with disclosure_state ACKNOWLEDGED and no ancillary purchases at all"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_LITE", name: "Economy Lite", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_lite_id: $.data.id }
            - call: "POST /fare-families/${f_lite_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_lite_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_lite_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: PricingApprover
              as_user_id: "pa-001"
              captures: { f_ver: $.data.version }
            - call: "POST /distribution-channels"
              payload: { channel_code: "OTA_SKYDEAL", channel_type: "OTA", commission_bp: 900, markup_bp: 500, max_ancillary_price_cents: 6000, supported_categories: ["BAGGAGE", "SEAT", "CHANGE", "BOARDING", "ONBOARD"], parity_required: true }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { ch_ota_id: $.data.id }
            - call: "POST /channel-publications"
              payload: { fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_ota_id}", expected_fare_family_version: "${f_ver}" }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { pub_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC520", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /bookings"
              payload: { record_locator: "SETL01", flight_id: "${fl_id}", fare_family_id: "${f_lite_id}", distribution_channel_id: "${ch_ota_id}", passenger_name: "Ada Lovelace" }
              as: ChannelPartner
              as_user_id: "${ch_ota_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/disclosure"
              payload: {}
              as: ChannelPartner
