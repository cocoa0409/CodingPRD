        distinguishing_aspect: "MARK_PARTS_ONLY is gated on the obligation window having fully elapsed: at 2020 it fails ERR_INVALID_STATE; past 2025-01-01 it succeeds and RETIRE closes the machine."
        test_recipe:
          setup: ["model GX-LEG discontinued at clock 2018-01-01 (support_obligation_until 2025-01-01T00:00:00Z); no seasons involved"]
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2018-01-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/models", payload: { model_code: "GX-LEG", model_family: "GX", model_year: 2017, base_price_cents: 40000, demand_share_bp: 1000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/models/${m_id}/lifecycle", payload: { action: "DISCONTINUE" }, as: PlannerAdmin, captures: { disc: "$.data.discontinued_at", until: "$.data.support_obligation_until" } }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2020-06-01T00:00:00Z" }, as: PlannerAdmin }
          trigger:
            - { call: "POST /grillops/models/${m_id}/lifecycle", payload: { action: "MARK_PARTS_ONLY" }, as: PlannerAdmin, captures: { e1: "$.data.error_id" } }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2025-01-02T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/models/${m_id}/lifecycle", payload: { action: "MARK_PARTS_ONLY" }, as: PlannerAdmin, captures: { st1: "$.data.status" } }
            - { call: "POST /grillops/models/${m_id}/lifecycle", payload: { action: "RETIRE" }, as: PlannerAdmin, captures: { st2: "$.data.status" } }
            - { call: "POST /grillops/models/${m_id}/lifecycle", payload: { action: "DISCONTINUE" }, as: PlannerAdmin, captures: { e2: "$.data.error_id" } }
          assert:
            - "captured disc == 2018-01-01T00:00:00Z and until == 2025-01-01T00:00:00Z"
            - "captured e1 == ERR_INVALID_STATE (2020-06-01 <= 2025-01-01: obligation still running)"
            - "captured st1 == PARTS_ONLY (clock past obligation) and st2 == RETIRED"
            - "captured e2 == ERR_INVALID_STATE (RETIRED is terminal)"

      - name: assembler_suspend_and_reinstate_with_score_gate
        claim_type: precondition_enforcement
        grounds: [state_machines.Assembler.CERTIFIED_to_SUSPENDED, state_machines.Assembler.SUSPENDED_to_CERTIFIED, calculations.calc_assembler_quality]
        distinguishing_aspect: "Reinstatement is score-gated: with one no-show (provisional 8800 >= 7000) SUSPEND then CERTIFY succeeds; DECERTIFY at official 8800 > 4000 is refused."
        test_recipe:
          setup: ["Season 2026 IN_SEASON; DIRECT allocation 10; one sale; assembler ASM-S certified with exactly one NO_SHOW on record"]
