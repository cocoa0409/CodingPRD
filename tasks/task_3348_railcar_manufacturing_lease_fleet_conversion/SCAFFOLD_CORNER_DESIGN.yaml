- section: cross_cutting_complexity_layers
  instances:
  - name: occ_lease_amendment_redraft_stale_version_returns_412
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[amendment-redraft-stale-contract]
    - POST /api/v1/lease-contracts/{id}/amendments
    - validations[priority=7]
    - errors[ERR_STALE_VERSION]
    - entities.LeaseContract.fields.version
    distinguishing_aspect: The amendment redraft is refused 412 ERR_STALE_VERSION when it carries the
      version observed before the first draft, while the same body carrying the post-draft version succeeds
      — the two writes are distinguished only by the observed version, exactly as concurrency_rules[amendment-redraft-stale-contract]
      declares.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - One lessee and one FULL_SERVICE contract whose term [2026-01-01, 2027-12-31) closes after the
        clock date; the contract is activated so it stands ACTIVE with a captured version.
      - No assignment exists, so the activate overlap precondition is vacuous and every version bump in
        this instance comes from the amendment endpoints alone.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/lessees
        payload:
          legal_name: LESS-OCC-1
          credit_tier: A
          utilization_threshold_pct: 50
          credit_ceiling_cents: 5000000
        as: LeaseAdministrator
        captures:
          ls_id: $.data.id
      - call: POST /api/v1/lease-contracts
        payload:
          lessee_id: ${ls_id}
          lease_type: FULL_SERVICE
          per_diem_rate_cents: 10000
          liability_bearer: LESSOR
          term_start_date: '2026-01-01'
          term_end_date: '2027-12-31'
          fleet_car_cap: 10
        as: LeaseAdministrator
        captures:
          lc_id: $.data.id
      - call: POST /api/v1/lease-contracts/${lc_id}/activate
        payload: {}
        as: LeaseAdministrator
        captures:
          lc_v_observed: $.data.version
      trigger:
      - call: POST /api/v1/lease-contracts/${lc_id}/amendments
        payload:
          per_diem_rate_cents: 12000
          liability_bearer: LESSEE
          expected_lease_version: ${lc_v_observed}
        as: LeaseAdministrator
        captures:
          lc_status_drafted: $.data.status
          lc_v_after_draft: $.data.version
          lc_rate_drafted: $.data.per_diem_rate_cents
      - call: POST /api/v1/lease-contracts/${lc_id}/amendments
        payload:
          per_diem_rate_cents: 13000
          liability_bearer: LESSOR
          expected_lease_version: ${lc_v_observed}
        as: LeaseAdministrator
        captures:
          err_id: $.data.error_id
      - call: GET /api/v1/lease-contracts/${lc_id}
        payload: {}
        as: LeaseAdministrator
        captures:
          lc_status_final: $.data.status
          lc_v_final: $.data.version
          lc_rate_final: $.data.per_diem_rate_cents
      assert:
      - 'The first draft with the observed version succeeds: HTTP 200 with data.status == ${lc_status_drafted}
        == "AMENDMENT_DRAFTED" and data.version == ${lc_v_after_draft} == ${lc_v_observed} + 1'
      - 'The draft stores its own terms: data.per_diem_rate_cents == ${lc_rate_drafted} == 12000'
      - The redraft carrying the stale version ${lc_v_observed} returns HTTP 412 with data.error_id ==
        ${err_id} == "ERR_STALE_VERSION"
      - 'The stale redraft wrote nothing: the contract still reads data.status == ${lc_status_final} ==
        "AMENDMENT_DRAFTED", data.version == ${lc_v_final} == ${lc_v_after_draft} and data.per_diem_rate_cents
        == ${lc_rate_final} == 12000'
      - The rejection is priority 7, governed by concurrency_rules[amendment-redraft-stale-contract] whose
        occ_field is expected_lease_version and whose http_status is 412
  - name: occ_lease_amendment_correct_version_redraft_and_ratify_succeed
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[amendment-redraft-stale-contract]
    - POST /api/v1/lease-contracts/{id}/amendments
    - POST /api/v1/lease-contracts/{id}/amendments/ratify
    - entities.LeaseContract.fields.amendment_seq
    distinguishing_aspect: Redrafting with the version the first draft produced is accepted and supersedes
      the earlier terms, and ratifying with the redraft's own version advances amendment_seq to 1 — the
      contract's version rises by exactly one on each of the draft, redraft and ratify writes.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - One lessee and one FULL_SERVICE contract over [2026-01-01, 2027-12-31), activated and standing
        ACTIVE with amendment_seq 0 and no live assignment.
      - The contract is the only entity written after activation, so every version bump below is attributable
        to one amendment endpoint.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/lessees
        payload:
          legal_name: LESS-OCC-2
          credit_tier: A
          utilization_threshold_pct: 50
          credit_ceiling_cents: 5000000
        as: LeaseAdministrator
        captures:
          ls_id: $.data.id
      - call: POST /api/v1/lease-contracts
        payload:
          lessee_id: ${ls_id}
          lease_type: FULL_SERVICE
          per_diem_rate_cents: 10000
          liability_bearer: LESSOR
          term_start_date: '2026-01-01'
          term_end_date: '2027-12-31'
          fleet_car_cap: 10
        as: LeaseAdministrator
        captures:
          lc_id: $.data.id
          lc_v0: $.data.version
      - call: POST /api/v1/lease-contracts/${lc_id}/activate
        payload: {}
        as: LeaseAdministrator
        captures:
          lc_v1: $.data.version
      - call: POST /api/v1/lease-contracts/${lc_id}/amendments
        payload:
          per_diem_rate_cents: 12000
          liability_bearer: LESSEE
          expected_lease_version: ${lc_v1}
        as: LeaseAdministrator
        captures:
          lc_v2: $.data.version
          lc_rate_first: $.data.per_diem_rate_cents
      trigger:
      - call: POST /api/v1/lease-contracts/${lc_id}/amendments
        payload:
          per_diem_rate_cents: 13000
          liability_bearer: LESSOR
          expected_lease_version: ${lc_v2}
        as: LeaseAdministrator
        captures:
          lc_v3: $.data.version
          lc_rate_redraft: $.data.per_diem_rate_cents
          lc_status_redraft: $.data.status
      - call: POST /api/v1/lease-contracts/${lc_id}/amendments/ratify
        payload:
          expected_lease_version: ${lc_v3}
        as: LeaseAdministrator
        captures:
          lc_v4: $.data.version
          lc_seq_after: $.data.amendment_seq
          lc_status_ratified: $.data.status
          lc_rate_ratified: $.data.per_diem_rate_cents
      assert:
      - 'The redraft carrying the version the first draft produced succeeds: HTTP 200 with data.status
        == ${lc_status_redraft} == "AMENDMENT_DRAFTED" and data.per_diem_rate_cents == ${lc_rate_redraft}
        == 13000, superseding the first draft''s 12000'
      - 'The redraft advances the contract version by exactly one: data.version == ${lc_v3} == ${lc_v2}
        + 1'
      - 'The ratify carrying the redraft''s own version succeeds: HTTP 200 with data.status == ${lc_status_ratified}
        == "ACTIVE"'
      - 'Ratification counts the amendment once: data.amendment_seq == ${lc_seq_after} == 1, up from the
        0 the contract was created with'
      - 'The ratified rate is the redrafted one, not the superseded one: data.per_diem_rate_cents == ${lc_rate_ratified}
        == 13000'
      - 'Every write advanced the version by one: ${lc_v1} == ${lc_v0} + 1, ${lc_v2} == ${lc_v1} + 1,
        ${lc_v3} == ${lc_v2} + 1 and ${lc_v4} == ${lc_v3} + 1'
  - name: occ_endorsement_create_stale_production_order_version_returns_412
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[endorsement-supersede-stale-order]
    - POST /api/v1/substitution-endorsements
    - validations[priority=7]
    - errors[ERR_STALE_VERSION]
    - entities.ProductionOrder.fields.version
    distinguishing_aspect: The first endorsement's own creation bumps the order's version, so a second
      endorsement reusing the pre-creation version is refused 412 ERR_STALE_VERSION even though its body
      is identical in shape — the two writes differ only in the version the writer observed.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - Car type CT-OCC-3 with WHEELSET WS-OCC-3A and its substitute WS-OCC-3B in the catalogue, and one
        DRAFT order of 1 car whose version is captured before any endorsement exists.
      - No BOM row and no reservation exist, so nothing else in the system can bump the order's version
        between the two endorsement writes.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
        payload:
          model_code: CT-OCC-3
          car_class: BOXCAR
          build_hours: 1
          regulatory_life_years: 25
          line_count_family: LINE-OCC3
        as: ProductionPlanner
        captures:
          ct_id: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-OCC-3A
          component_class: WHEELSET
          unit_cost_cents: 1000
          lead_time_days: 5
        as: SupplyChainCoordinator
        captures:
          ws_a: $.data.id
      - call: POST /api/v1/components
        payload:
          part_number: WS-OCC-3B
          component_class: WHEELSET
          unit_cost_cents: 1100
          lead_time_days: 4
        as: SupplyChainCoordinator
        captures:
          ws_b: $.data.id
      - call: POST /api/v1/production-orders
        payload:
          car_type_id: ${ct_id}
          quantity: 1
          planned_shop_days: 1
          disposition: RETAINED
          priority_rank: 1
          order_date: '2026-09-01'
          required_delivery_date: '2026-09-20'
        as: ProductionPlanner
        captures:
          po_id: $.data.id
          po_v_observed: $.data.version
      trigger:
      - call: POST /api/v1/substitution-endorsements
        payload:
          production_order_id: ${po_id}
          original_component_id: ${ws_a}
          substitute_component_id: ${ws_b}
          substitute_qty_per_car: 1
          decides_material: false
          expected_production_order_version: ${po_v_observed}
        as: ProductionPlanner
        captures:
          se1_id: $.data.id
          se1_status: $.data.status
      - call: POST /api/v1/substitution-endorsements
        payload:
          production_order_id: ${po_id}
          original_component_id: ${ws_a}
          substitute_component_id: ${ws_b}
          substitute_qty_per_car: 1
          decides_material: false
          expected_production_order_version: ${po_v_observed}
        as: ProductionPlanner
        captures:
          err_id: $.data.error_id
      - call: GET /api/v1/production-orders/${po_id}
        payload: {}
        as: ProductionPlanner
        captures:
          po_v_after: $.data.version
      - call: GET /api/v1/substitution-endorsements?production_order_id=${po_id}
        payload: {}
        as: ProductionPlanner
        captures:
          live_count: $.data
      assert:
      - The first endorsement with the observed version returns HTTP 201 with data.id == ${se1_id} and
        data.status == ${se1_status} == "PENDING"
      - 'That creation bumped the parent order: data.version == ${po_v_after} == ${po_v_observed} + 1'
      - The second endorsement reusing ${po_v_observed} returns HTTP 412 with data.error_id == ${err_id}
        == "ERR_STALE_VERSION"
      - 'The stale write left no endorsement behind: GET /substitution-endorsements?production_order_id=${po_id}
        still holds exactly the first row ${se1_id}'
      - The rejection is priority 7 under concurrency_rules[endorsement-supersede-stale-order], whose
        write_endpoint is POST /substitution-endorsements, occ_field is expected_production_order_version
        and http_status is 412
