  # ---- MaterialSpec -------------------------------------------------------
  - method: POST
    path: "/exhibit-projects/{id}/material-specs"
    description: "Submit a material for conservation-safety screening. The off-gassing verdict is derived immediately from the chamber numbers and the assembly the material is used in."
    roles: [FabricationLead, Conservator]
    code: 201
    input: [material_name, used_in, oddy_test_result, voc_mg_per_m2_day, formaldehyde_ppm, cure_days]
    output: MaterialSpec
    side_effects:
      - "runs calculations.material_offgassing_verdict, storing verdict"
      - "sets status = SUBMITTED"
      - "increments ExhibitProject.pending_material_count and recomputes calculations.project_readiness_posture (a fresh submission alone is enough to make the project RESTRICTED)"
      - "increments ExhibitProject.version by 1"

  - method: GET
    path: "/exhibit-projects/{id}/material-specs"
    description: "List the project's material specifications, oldest first by created_at ASC."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: ["status?", "verdict?", "used_in?"]
    output: MaterialSpec[]
    side_effects: []

  - method: GET
    path: "/material-specs/{id}"
    description: "Read one material specification with its derived off-gassing verdict."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: []
    output: MaterialSpec
    side_effects: []

  - method: GET
    path: "/material-specs/{id}/shop-drawings"
    description: "List the shop drawings built from this material, oldest first by created_at ASC. The blast radius of a material rejection is visible here."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: ["status?"]
    output: ShopDrawing[]
    side_effects: []

  - method: POST
    path: "/material-specs/{id}/submit-for-conservation"
    description: "Move a submitted, previously rejected, or already cleared material into conservator review. Re-submitting an APPROVED or CONDITIONAL spec re-opens it for a new production lot, which is the only way a spec that already carries issued shop drawings can later be rejected."
    roles: [FabricationLead, ProjectManager]
    code: 200
    input: []
    output: MaterialSpec
    side_effects:
      - "re-runs calculations.material_offgassing_verdict so a spec resubmitted after re-testing is judged on current data"
      - "transitions status SUBMITTED, REJECTED, APPROVED or CONDITIONAL -> CONSERVATOR_REVIEW"
      - "raises ExhibitProject.pending_material_count, so a re-review pushes an OPEN project to RESTRICTED"
      - "leaves every ShopDrawing issued from the spec at its current status; the drawings are only voided if the re-review ends in REJECT"
      - "recomputes ExhibitProject.pending_material_count, conservation_block_count and calculations.project_readiness_posture"
      - "increments MaterialSpec.version and ExhibitProject.version by 1 each"

  - method: POST
    path: "/material-specs/{id}/conservator-decision"
    description: "Conservator ruling on a material. REJECT triggers the deepest cascade in the system: every drawing built from the material is voided, every case those drawings detail falls back to DRAFT and gives up its zone slot, every artifact in those cases is released, and the project freezes."
    roles: [Conservator]
    code: 200
    input: [decision, "conditions?"]
    output: MaterialSpec
    side_effects:
      - "APPROVE -> status APPROVED; APPROVE_WITH_CONDITIONS -> status CONDITIONAL with conditions stored; REJECT -> status REJECTED"
      - "sets decided_at to the logical clock instant"
      - "on REJECT, cascade link 1: every ShopDrawing with material_spec_id == spec.id and status != VOID transitions to VOID with void_reason = MATERIAL_REJECTED, processed in ascending created_at order"
      - "on REJECT, cascade link 2: for each voided drawing that had committed money, actual_cost_cents is released from ExhibitProject.committed_fabrication_cents back into uncommitted_cents"
      - "on REJECT, cascade link 3: every ArtifactCase named by a voided drawing's subject_case_id whose status IN {APPROVED, CONDITIONALLY_APPROVED} reverts to DRAFT, gives its zone slot back (reserved_case_slots decremented, available_case_slots incremented), and its mount_status falls back from MOUNT_FABRICATED to MOUNT_DESIGN"
      - "on REJECT, cascade link 4: every Artifact RESERVED in such a case returns to UNPLACED with assigned_case_id cleared, the case's placed_artifact_count is zeroed and its envelope recomputed to null bounds"
      - "recomputes ExhibitProject.pending_material_count, conservation_block_count, conditional_case_count and calculations.project_readiness_posture, so a REJECT lands the project in FROZEN_CONSERVATION"
      - "increments MaterialSpec.version, every touched ShopDrawing.version, ArtifactCase.version, Artifact.version, GalleryZone.version and ExhibitProject.version by 1 each"

  # ---- ShopDrawing --------------------------------------------------------
  - method: POST
    path: "/shop-drawings"
    description: "Issue a shop drawing against a conservation-cleared material, detailing either a case or an interactive. The schematic cost estimate is computed at issue."
    roles: [FabricationLead]
    code: 201
    input: [project_id, material_spec_id, drawing_number, complexity_tier, shop_hours, material_area_m2, finish_grade, "revision?", "subject_case_id?", "subject_interactive_id?"]
    output: ShopDrawing
    side_effects:
      - "exactly one of subject_case_id / subject_interactive_id must be present; supplying both or neither is ERR_INVALID_REQUEST"
      - "runs calculations.fabrication_cost_estimate variant schematic_estimate, storing estimate_labor_cents, estimate_material_cents, estimate_finishing_cents and estimate_total_cents"
      - "sets revision to the supplied value or 1, status = SUBMITTED, submitted_by_user_id from X-User-ID"
      - "does not move any money - the estimate is advisory"

  - method: GET
    path: "/shop-drawings"
    description: "List shop drawings filtered by any combination of owning project, source material, subject case or subject interactive; oldest first by created_at ASC. Reverse-reachability channel for subject_case_id and subject_interactive_id."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: ["project_id?", "material_spec_id?", "subject_case_id?", "subject_interactive_id?", "status?"]
    output: ShopDrawing[]
    side_effects: []

  - method: GET
    path: "/exhibit-projects/{id}/shop-drawings"
    description: "List the project's shop drawings, oldest first by created_at ASC."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: ["status?"]
    output: ShopDrawing[]
    side_effects: []

  - method: GET
    path: "/shop-drawings/{id}"
    description: "Read one shop drawing with both its estimated and (once decided) actual cost breakdown."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: []
    output: ShopDrawing
    side_effects: []

  - method: POST
    path: "/shop-drawings/{id}/start-review"
    description: "Take a submitted shop drawing into review."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ShopDrawing
    side_effects:
      - "transitions status SUBMITTED -> UNDER_REVIEW"
      - "increments ShopDrawing.version by 1"

  - method: POST
    path: "/shop-drawings/{id}/decision"
    description: "Rule on a shop drawing under review. APPROVE and APPROVE_AS_NOTED recompute the cost from the shop's actual hours and waste factor and commit that amount against the project ledger. actual_shop_hours and actual_waste_factor are required when decision IN {APPROVE, APPROVE_AS_NOTED} and ignored on REJECT."
    roles: [ProjectManager]
    code: 200
    input: [decision, "actual_shop_hours?", "actual_waste_factor?", "note?"]
    output: ShopDrawing
    side_effects:
      - "APPROVE -> status APPROVED; APPROVE_AS_NOTED -> status APPROVED_AS_NOTED; REJECT -> status REJECTED with no ledger movement"
      - "on APPROVE or APPROVE_AS_NOTED: runs calculations.fabrication_cost_estimate variant shop_drawing_actual, storing actual_labor_cents, actual_material_cents, actual_finishing_cents and actual_cost_cents"
      - "on APPROVE or APPROVE_AS_NOTED: moves actual_cost_cents from ExhibitProject.uncommitted_cents into ExhibitProject.committed_fabrication_cents, preserving the five-bucket money identity"
      - "increments ShopDrawing.version by 1 and ExhibitProject.version by 1 when money moved"

  - method: POST
    path: "/shop-drawings/{id}/void"
    description: "Void a shop drawing. Any money it committed is released back to uncommitted, and a case it details falls back to DRAFT - the compensating half of the approval."
    roles: [ProjectManager, FabricationLead]
    code: 200
    input: [void_reason]
    output: ShopDrawing
    side_effects:
      - "transitions status SUBMITTED, UNDER_REVIEW, APPROVED or APPROVED_AS_NOTED -> VOID with void_reason stored"
      - "when actual_cost_cents is non-null, releases it from ExhibitProject.committed_fabrication_cents back into ExhibitProject.uncommitted_cents (compensating action; no drift)"
      - "when subject_case_id is set and that case is APPROVED or CONDITIONALLY_APPROVED, reverts it to DRAFT, returns its zone case slot, falls mount_status back from MOUNT_FABRICATED to MOUNT_DESIGN, and releases every RESERVED artifact to UNPLACED"
      - "recomputes ExhibitProject.conditional_case_count and calculations.project_readiness_posture"
      - "increments ShopDrawing.version, and the version of every touched ArtifactCase, Artifact, GalleryZone and ExhibitProject, by 1 each"

  # ---- InstallWindow ------------------------------------------------------
  - method: POST
    path: "/install-windows"
    description: "Request an installation window on a zone. Permitted in phase FABRICATION or INSTALLATION. Buffers and effective bounds are computed at request time; conflicts are only enforced at approval."
    roles: [FabricationLead, ProjectManager]
    code: 201
    input: [project_id, zone_id, work_class, noise_dba, starts_at, ends_at, "requires_gallery_closure?"]
    output: InstallWindow
    side_effects:
      - "runs calculations.zone_window_conflict_geometry, storing pre_access_buffer_minutes, settling_buffer_minutes, effective_start_at and effective_end_at"
      - "sets status = REQUESTED, requires_gallery_closure to the supplied value or false, requested_by_user_id from X-User-ID"
      - "does not reserve the zone - a REQUESTED window does occupy the zone for conflict purposes but does not change occupancy_state"

  - method: GET
    path: "/exhibit-projects/{id}/install-windows"
    description: "List the project's install windows, ascending by starts_at then created_at."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: ["status?", "zone_id?", "requires_gallery_closure?"]
    output: InstallWindow[]
    side_effects: []

  - method: GET
    path: "/install-windows/{id}"
    description: "Read one install window with its computed buffers and effective bounds."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: []
    output: InstallWindow
    side_effects: []

  - method: POST
    path: "/install-windows/{id}/decision"
    description: "Museum operations rules on a requested window. Approval runs the noise, zone-availability, buffered per-zone overlap and project-wide closure-capacity checks in that priority order."
    roles: [MuseumOperations]
    code: 200
    input: [decision, "denial_reason?"]
    output: InstallWindow
    side_effects:
      - "APPROVE -> status APPROVED; DENY -> status DENIED with denial_reason stored"
      - "on APPROVE, re-runs calculations.zone_window_conflict_geometry against the current zone calendar and calculations.project_closure_capacity_peak when requires_gallery_closure is true"
      - "increments InstallWindow.version by 1"

  - method: POST
    path: "/install-windows/{id}/start"
    description: "Open the approved window for work; the zone changes occupancy state for its duration."
    roles: [MuseumOperations]
    code: 200
    input: []
    output: InstallWindow
    side_effects:
      - "transitions status APPROVED -> IN_PROGRESS"
      - "sets GalleryZone.occupancy_state = CLOSED when requires_gallery_closure is true, else PARTIAL_CLOSURE"
      - "increments InstallWindow.version and GalleryZone.version by 1 each"

  - method: POST
    path: "/install-windows/{id}/complete"
    description: "Close out the window. Every reserved artifact in the zone's cases becomes physically PLACED, which is only permitted once the mounts are installed."
    roles: [MuseumOperations]
    code: 200
    input: []
    output: InstallWindow
    side_effects:
      - "transitions status IN_PROGRESS -> COMPLETED"
      - "every Artifact with placement_status == RESERVED whose assigned_case_id names a case in this window's zone transitions to PLACED, processed in ascending (ArtifactCase.created_at, Artifact.created_at) order"
      - "sets GalleryZone.occupancy_state back to OPERATING"
      - "increments InstallWindow.version, GalleryZone.version and every touched Artifact.version by 1 each"

  - method: POST
    path: "/install-windows/{id}/cancel"
    description: "Withdraw a requested or approved window, freeing the zone calendar."
    roles: [MuseumOperations, FabricationLead]
    code: 200
    input: ["denial_reason?"]
    output: InstallWindow
    side_effects:
      - "transitions status REQUESTED or APPROVED -> CANCELLED"
      - "the window stops occupying the zone for conflict purposes, so a previously conflicting window can now be approved"
      - "increments InstallWindow.version by 1"

  # ---- PunchItem ----------------------------------------------------------
  - method: POST
    path: "/exhibit-projects/{id}/punch-items"
    description: "Raise a commissioning punch-list defect against an interactive, a case, or the exhibit at large."
    roles: [MuseumOperations, Curator, ProjectManager, AccessibilitySpecialist]
    code: 201
    input: [severity, description, "interactive_id?", "case_id?"]
    output: PunchItem
    side_effects:
      - "at most one of interactive_id / case_id may be supplied; supplying both is ERR_INVALID_REQUEST"
      - "sets status = OPEN, raised_by_role from X-Role and raised_by_user_id from X-User-ID"
      - "when severity == BLOCKING, increments ExhibitProject.blocking_punch_count and recomputes calculations.project_readiness_posture"
      - "increments ExhibitProject.version by 1"

  - method: GET
    path: "/exhibit-projects/{id}/punch-items"
    description: "List the project's punch items, oldest first by created_at ASC."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: ["status?", "severity?"]
    output: PunchItem[]
    side_effects: []

  - method: GET
    path: "/punch-items"
    description: "List punch items filtered by owning project, subject interactive or subject case; oldest first by created_at ASC. Reverse-reachability channel for interactive_id and case_id."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: ["project_id?", "interactive_id?", "case_id?", "status?", "severity?"]
    output: PunchItem[]
    side_effects: []

  - method: GET
    path: "/punch-items/{id}"
    description: "Read one punch item."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: []
    output: PunchItem
    side_effects: []

  - method: POST
    path: "/punch-items/{id}/verify"
    description: "Verify that a raised defect has been corrected. The verifier may not be the person who raised it."
    roles: [FabricationLead, ProjectManager]
    code: 200
    input: [verification_note]
    output: PunchItem
    side_effects:
      - "transitions status OPEN -> VERIFIED, storing verification_note, verified_by_user_id from X-User-ID and verified_at from the logical clock"
      - "when severity == BLOCKING, decrements ExhibitProject.blocking_punch_count and recomputes calculations.project_readiness_posture"
      - "increments PunchItem.version and ExhibitProject.version by 1 each"

  - method: POST
    path: "/punch-items/{id}/waive"
    description: "Waive a non-blocking defect with a documented reason. BLOCKING defects can never be waived."
    roles: [ProjectManager]
    code: 200
    input: [waiver_reason]
    output: PunchItem
    side_effects:
      - "transitions status OPEN -> WAIVED, storing waiver_reason, verified_by_user_id from X-User-ID and verified_at from the logical clock"
      - "increments PunchItem.version and ExhibitProject.version by 1 each"

  # ---- Test-driving endpoint (§1.5 priority ladder step 3) ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an explicit ISO 8601 UTC instant. Every deadline, sweep and timestamp in this API reads this clock and never the real wall clock. The server's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads 2026-08-01T00:00:00Z, which sits at or before every fixture date, so an unset clock is a fixed earliest instant rather than a drifting wall-clock value."
    roles: [ProjectManager, Curator, Conservator, AccessibilitySpecialist, FabricationLead, MuseumOperations]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "sets the logical clock; no entity is mutated and no sweep is triggered as a side effect (use POST /exhibit-projects/{id}/review-sweep for that)"

errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-Role header absent or not one of the six declared roles, or X-User-ID absent/blank on a mutating request"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the deciding X-User-ID equals the submitting/raising/requesting X-User-ID on a shop-drawing decision, prototype decision, punch verification or waiver, or install-window decision"
  - id: ERR_VOTER_NOT_ON_PANEL
    http: 403
    condition: "the caller's role is not in round.panel_roles"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, undeclared enum value, out-of-domain number, unparseable datetime, both or neither of subject_case_id / subject_interactive_id on a shop drawing, both interactive_id and case_id on a punch item, or missing actual_shop_hours / actual_waste_factor on an approving shop-drawing decision"

  # --- existence ---
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "no ExhibitProject with the referenced id"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "no DesignPackage with the referenced id"
  - id: ERR_ROUND_NOT_FOUND
    http: 404
    condition: "no ReviewRound with the referenced id"
  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "no GalleryZone with the referenced id"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "no ArtifactCase with the referenced id"
  - id: ERR_ARTIFACT_NOT_FOUND
    http: 404
    condition: "no Artifact with the referenced id"
  - id: ERR_INTERACTIVE_NOT_FOUND
    http: 404
    condition: "no Interactive with the referenced id"
  - id: ERR_MATERIAL_NOT_FOUND
    http: 404
    condition: "no MaterialSpec with the referenced id"
  - id: ERR_DRAWING_NOT_FOUND
    http: 404
    condition: "no ShopDrawing with the referenced id"
  - id: ERR_WINDOW_NOT_FOUND
    http: 404
    condition: "no InstallWindow with the referenced id"
  - id: ERR_PUNCH_ITEM_NOT_FOUND
    http: 404
    condition: "no PunchItem with the referenced id"

  # --- referential integrity ---
  - id: ERR_CROSS_PROJECT_REFERENCE
    http: 409
    condition: "a referenced row exists but belongs to a different ExhibitProject than the primary resource"
  - id: ERR_ARTIFACT_NOT_IN_CASE
    http: 409
    condition: "the artifact named on a placement removal is not currently assigned to that case with placement_status IN {RESERVED, PLACED}"

  # --- optimistic concurrency ---
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not equal the stored ExhibitProject.version at design-package creation"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not equal the stored ArtifactCase.version at placement creation"

  # --- uniqueness and single-instance constraints ---
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "zone_code, case_code, accession_number, interactive code, material_name, or the (drawing_number, revision) pair over non-VOID drawings already exists within the project"
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "the caller's panel role already cast a vote in this round"
  - id: ERR_ROUND_ALREADY_OPEN
    http: 409
    condition: "the package already has a ReviewRound with status OPEN"

  # --- temporal ---
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "ends_at is not strictly after starts_at"
  - id: ERR_DEADLINE_IN_PAST
    http: 422
    condition: "decision_deadline_at is at or before the current logical-clock instant"
  - id: ERR_ROUND_DEADLINE_PASSED
    http: 409
    condition: "a vote arrives when the logical clock is at or after round.decision_deadline_at"
  - id: ERR_ZONE_WINDOW_CONFLICT
    http: 409
    condition: "the window's buffered half-open interval overlaps another REQUESTED, APPROVED or IN_PROGRESS window on the same zone"
  - id: ERR_CLOSURE_CAPACITY_EXCEEDED
    http: 409
    condition: "approving a closure window would push the project's closed-interval concurrent-closure peak above max_concurrent_closures"

  # --- state preconditions ---
  - id: ERR_INVALID_PROJECT_PHASE
    http: 409
    condition: "the project's phase does not permit this operation, or to_phase is not the immediate successor of the current phase"
  - id: ERR_INVALID_PACKAGE_STATE
    http: 409
    condition: "the design package is not in DRAFT or REVISION_REQUESTED when opening a review round"
  - id: ERR_INVALID_ROUND_STATE
    http: 409
    condition: "the review round is no longer OPEN"
  - id: ERR_INVALID_CASE_STATE
    http: 409
    condition: "the artifact case's status dimension does not permit this operation"
  - id: ERR_INVALID_MOUNT_STATE
    http: 409
    condition: "to_mount_status is not the immediate successor of the stored mount_status, or the case is not approved yet for mount fabrication/installation"
  - id: ERR_INVALID_MATERIAL_STATE
    http: 409
    condition: "the material spec's status does not permit this operation"
  - id: ERR_INVALID_DRAWING_STATE
    http: 409
    condition: "the shop drawing's status does not permit this operation, including voiding an already-VOID sheet"
  - id: ERR_INVALID_INTERACTIVE_STATE
    http: 409
    condition: "the interactive's status does not permit this operation"
  - id: ERR_INVALID_WINDOW_STATE
    http: 409
    condition: "the install window's status does not permit this operation"
  - id: ERR_INVALID_PUNCH_STATE
    http: 409
    condition: "the punch item is not OPEN, or a BLOCKING item is being waived"

  # --- project posture gates ---
  - id: ERR_PROJECT_FROZEN_CONSERVATION
    http: 409
    condition: "ExhibitProject.posture == FROZEN_CONSERVATION (a REJECTED case, a REJECTED material spec, or a recorded conservation veto)"
  - id: ERR_PROJECT_POSTURE_RESTRICTED
    http: 409
    condition: "ExhibitProject.posture == RESTRICTED at a gate that demands OPEN (advance to INSTALLATION, or closeout)"

  # --- conservation and business safety ---
  - id: ERR_ACCESSIBILITY_REQUIREMENTS_UNMET
    http: 422
    condition: "the design package fails egress width, wheelchair turning radius, or the minimum flow capacity score"
  - id: ERR_ARTIFACT_ALREADY_PLACED
    http: 409
    condition: "the artifact's placement_status is not UNPLACED"
  - id: ERR_ARTIFACT_CONDITION_UNSTABLE
    http: 422
    condition: "the artifact's condition_status is UNSTABLE"
  - id: ERR_SECURITY_TIER_INSUFFICIENT
    http: 422
    condition: "the case's security tier ranks below the artifact's security class"
  - id: ERR_ENV_ENVELOPE_INFEASIBLE
    http: 422
    condition: "including the artifact makes the case's RH band empty, pushes the case set points outside the strictest artifact band, exceeds the strictest allowed_lux, or breaches the UV ceiling"
  - id: ERR_CASE_HAS_NO_ARTIFACTS
    http: 422
    condition: "a case with placed_artifact_count == 0 is submitted for conservation review"
  - id: ERR_OFFGASSING_LIMIT_EXCEEDED
    http: 422
    condition: "a conservator tries to APPROVE or APPROVE_WITH_CONDITIONS a material whose derived verdict is UNSAFE"
  - id: ERR_MATERIAL_NOT_CONSERVATION_APPROVED
    http: 422
    condition: "a shop drawing names a material whose status is not APPROVED or CONDITIONAL"
  - id: ERR_PROTOTYPE_NOT_APPROVED
    http: 409
    condition: "a shop drawing names an interactive whose prototype has not been approved yet"
  - id: ERR_WARRANTY_TERM_TOO_SHORT
    http: 422
    condition: "warranty_months is below the minimum required for the interactive's maintenance_tier at commissioning"
  - id: ERR_MOUNT_NOT_INSTALLED
    http: 409
    condition: "a window is completed while a loaded case in its zone still has mount_status != MOUNT_INSTALLED"
  - id: ERR_OBJECTIVE_NOT_ADDRESSED
    http: 422
    condition: "a learning objective code on the project is not carried by any ArtifactCase or Interactive at the advance to FABRICATION"
  - id: ERR_BLOCKING_PUNCH_ITEMS_OPEN
    http: 409
    condition: "blocking_punch_count > 0 at the advance from COMMISSIONING to CLOSEOUT"
  - id: ERR_INVALID_PANEL_COMPOSITION
    http: 422
    condition: "panel_roles has fewer than 3 or more than 5 entries, contains duplicates or unknown roles, or omits Curator or Conservator"
  - id: ERR_NOISE_LIMIT_EXCEEDED
    http: 422
    condition: "the window's noise_dba exceeds the zone's max_noise_dba while requires_gallery_closure is false"
  - id: ERR_ZONE_CLOSED_FOR_WORK
    http: 422
    condition: "the zone's occupancy_state is CLOSED, or a closure is requested on a zone whose closure_allowed is false"
  - id: ERR_ZONE_CASE_SLOTS_EXHAUSTED
    http: 409
    condition: "the zone has available_case_slots == 0 when a case approval would reserve one"

  # --- fiscal ---
  - id: ERR_FABRICATION_BUDGET_EXCEEDED
    http: 402
    condition: "the drawing's actual_cost_cents exceeds ExhibitProject.uncommitted_cents"
  - id: ERR_NOTHING_TO_SETTLE
    http: 409
    condition: "closeout is attempted while committed_fabrication_cents == 0"

roles:
  - name: ProjectManager
    description: "Owns the commission end to end: opens the project, advances phases, opens review rounds, rules on shop drawings and prototypes, sweeps lapsed deadlines, waives non-blocking defects and settles closeout."
    identity: opaque
    exclusive_operations:
      - "POST /exhibit-projects"
      - "POST /exhibit-projects/{id}/advance-phase"
      - "POST /exhibit-projects/{id}/closeout"
      - "POST /exhibit-projects/{id}/review-sweep"
      - "POST /design-packages/{id}/review-rounds"
      - "POST /shop-drawings/{id}/start-review"
      - "POST /shop-drawings/{id}/decision"
      - "POST /interactives/{id}/commission"
      - "POST /punch-items/{id}/waive"
    shared_operations:
      - "POST /exhibit-projects/{id}/design-packages (with AccessibilitySpecialist)"
      - "POST /exhibit-projects/{id}/gallery-zones (with MuseumOperations)"
      - "POST /exhibit-projects/{id}/artifact-cases (with Curator)"
      - "POST /artifact-cases/{id}/submit-for-conservation (with Curator)"
      - "POST /material-specs/{id}/submit-for-conservation (with FabricationLead)"
      - "POST /interactives/{id}/prototype-decision (with Conservator)"
      - "POST /shop-drawings/{id}/void (with FabricationLead)"
      - "POST /install-windows (with FabricationLead)"
      - "POST /punch-items/{id}/verify (with FabricationLead)"
      - "POST /exhibit-projects/{id}/punch-items (with MuseumOperations, Curator, AccessibilitySpecialist)"
      - "POST /review-rounds/{id}/votes (with every other panel role)"
      - "every GET endpoint and POST /_clock/set_current_utc"

  - name: Curator
    description: "Owns interpretive content and the collection: registers artifacts, designs cases with the project manager, and holds one of the two vetoes on the review panel."
    identity: opaque
    exclusive_operations:
      - "POST /exhibit-projects/{id}/artifacts"
    shared_operations:
      - "POST /exhibit-projects/{id}/artifact-cases (with ProjectManager)"
      - "POST /artifact-cases/{id}/submit-for-conservation (with ProjectManager)"
      - "POST /artifact-cases/{id}/placements and DELETE /artifact-cases/{id}/placements/{artifact_id} (with Conservator)"
      - "POST /exhibit-projects/{id}/interactives (with FabricationLead)"
      - "POST /exhibit-projects/{id}/punch-items (with MuseumOperations, ProjectManager, AccessibilitySpecialist)"
      - "POST /review-rounds/{id}/votes (with every other panel role)"
      - "every GET endpoint and POST /_clock/set_current_utc"

  - name: Conservator
    description: "Guards the objects: rules on case environmental envelopes and material off-gassing, drives mount making, and holds the second veto on the review panel."
    identity: opaque
    exclusive_operations:
      - "POST /artifact-cases/{id}/conservator-decision"
      - "POST /artifact-cases/{id}/mount-advance"
      - "POST /material-specs/{id}/conservator-decision"
    shared_operations:
      - "POST /artifact-cases/{id}/placements and DELETE /artifact-cases/{id}/placements/{artifact_id} (with Curator)"
      - "POST /exhibit-projects/{id}/material-specs (with FabricationLead)"
      - "POST /interactives/{id}/prototype-decision (with ProjectManager)"
      - "POST /review-rounds/{id}/votes (with every other panel role)"
      - "every GET endpoint and POST /_clock/set_current_utc"

  - name: AccessibilitySpecialist
    description: "Reviews visitor flow, egress and accessibility; may author design packages and sits on the review panel without a veto."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /exhibit-projects/{id}/design-packages (with ProjectManager)"
      - "POST /exhibit-projects/{id}/punch-items (with MuseumOperations, Curator, ProjectManager)"
      - "POST /review-rounds/{id}/votes (with every other panel role)"
      - "every GET endpoint and POST /_clock/set_current_utc"

  - name: FabricationLead
    description: "Runs the shop: specifies interactives and materials, issues shop drawings, submits prototypes, requests install windows and verifies punch items. Never rules on its own submissions."
    identity: opaque
    exclusive_operations:
      - "POST /shop-drawings"
      - "POST /interactives/{id}/submit-prototype"
      - "POST /interactives/{id}/mark-fabricated"
    shared_operations:
      - "POST /exhibit-projects/{id}/interactives (with Curator)"
      - "POST /exhibit-projects/{id}/material-specs (with Conservator)"
      - "POST /material-specs/{id}/submit-for-conservation (with ProjectManager)"
      - "POST /shop-drawings/{id}/void (with ProjectManager)"
      - "POST /install-windows (with ProjectManager)"
      - "POST /install-windows/{id}/cancel (with MuseumOperations)"
      - "POST /punch-items/{id}/verify (with ProjectManager)"
      - "POST /review-rounds/{id}/votes (with every other panel role)"
      - "every GET endpoint and POST /_clock/set_current_utc"

  - name: MuseumOperations
    description: "Speaks for the operating museum: owns the gallery calendar and rules on every install window, noise limit and closure request. Not on the review panel."
    identity: opaque
    exclusive_operations:
      - "POST /install-windows/{id}/decision"
      - "POST /install-windows/{id}/start"
      - "POST /install-windows/{id}/complete"
    shared_operations:
      - "POST /exhibit-projects/{id}/gallery-zones (with ProjectManager)"
      - "POST /install-windows/{id}/cancel (with FabricationLead)"
      - "POST /exhibit-projects/{id}/punch-items (with Curator, ProjectManager, AccessibilitySpecialist)"
      - "every GET endpoint and POST /_clock/set_current_utc"
