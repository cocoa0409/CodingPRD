            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-P1", ownership: "SHOP", condition_status: "SERVICEABLE", custody_status: "IN_POOL", total_cycles: 3000, cycles_since_overhaul: 50, manufactured_at: "2014-03-01" }, as: CustomerServiceRep }
            - { call: "POST /mro/exchange-agreements", payload: { customer_id: "${c_id}", part_id: "${p_id}" }, as: CustomerServiceRep, captures: { ex: $.data.id } }
          trigger:
            - { call: "POST /mro/exchange-agreements/${ex}/fulfill", payload: {}, as: CustomerServiceRep, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_CUSTOMER_CREDIT_HOLD' with HTTP 402; agreement remains OPEN and the pool unit stays IN_POOL"
      - name: create_customer_missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
