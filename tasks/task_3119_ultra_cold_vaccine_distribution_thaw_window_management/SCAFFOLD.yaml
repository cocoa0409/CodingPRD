    input: ["storage_site_id?", "status?", "equipment_type?", "limit?", "offset?"]
    output: "SiteEquipmentVerification[]"
    side_effects: []
  - method: GET
    path: "/vaccine-distribution/site-equipment-verifications/{id}"
    description: "Get one site equipment verification"
    roles: [RegulatoryAffairsOfficer, ColdChainReviewer, DistributionPlanner, SiteCoordinator]
    code: 200
    input: []
    output: SiteEquipmentVerification
    side_effects: []

  # --- SiteOrder ---
  - method: POST
    path: "/vaccine-distribution/site-orders"
    description: "Draft an order for cartons against an entitlement"
    roles: [SiteCoordinator]
    code: 201
    input: [allocation_entitlement_id, storage_site_id, requested_cartons, requested_doses]
    output: SiteOrder
    side_effects: ["order_status = DRAFT", "payment_status = NOT_DUE"]
  - method: GET
    path: "/vaccine-distribution/site-orders"
    description: "List site orders"
    roles: [RegulatoryAffairsOfficer, DistributionPlanner, SiteCoordinator, LogisticsOperator, ColdChainReviewer]
    code: 200
    input: ["allocation_entitlement_id?", "storage_site_id?", "order_status?", "limit?", "offset?"]
    output: "SiteOrder[]"
    side_effects: []
  - method: GET
    path: "/vaccine-distribution/site-orders/{id}"
    description: "Get one site order"
    roles: [RegulatoryAffairsOfficer, DistributionPlanner, SiteCoordinator, LogisticsOperator, ColdChainReviewer]
    code: 200
    input: []
    output: SiteOrder
    side_effects: []
  - method: POST
    path: "/vaccine-distribution/site-orders/{id}/submit"
    description: "Submit a drafted order into the acceptance window"
    roles: [SiteCoordinator]
    code: 200
    input: []
    output: SiteOrder
    side_effects:
      - "order_status = SUBMITTED"
      - "submitted_at = logical clock"
      - "requested_cartons_snapshot = requested_cartons"
      - "requested_doses accepted as supplied, even when it disagrees with requested_cartons"
      - "increments site_order.version by 1"
  - method: POST
    path: "/vaccine-distribution/site-orders/{id}/accept"
    description: "Accept an order, setting the carton quantity the program will ship"
    roles: [DistributionPlanner]
    code: 200
    input: [accepted_cartons, deliver_at, expected_allocation_window_version]
    output: SiteOrder
    side_effects:
      - "order_status = ACCEPTED or PARTIALLY_ACCEPTED"
      - "accepted_doses recomputed; rejected_cartons recomputed; rounding fields recomputed"
      - "allocation_entitlement.held_cartons and .accepted_cartons updated"
      - "an OrderRejection plus an EntitlementRelease are recorded when cartons are dropped"
      - "increments allocation_window.version by 1"
      - "increments site_order.version by 1"
  - method: POST
    path: "/vaccine-distribution/site-orders/{id}/reject"
    description: "Reject an order outright and return its cartons to the entitlement"
    roles: [DistributionPlanner]
    code: 200
    input: [rejected_cartons, reason_code]
    output: SiteOrder
    side_effects:
      - "order_status = REJECTED"
      - "OrderRejection recorded and held cartons released"
      - "increments site_order.version by 1"
  - method: POST
    path: "/vaccine-distribution/site-orders/{id}/fulfillment/reverse"
    description: "Compensating action that returns a fulfilled order to ACCEPTED"
    roles: [DistributionPlanner]
    code: 200
    input: []
    output: SiteOrder
    side_effects:
      - "order_status = ACCEPTED and payment_status = NOT_DUE"
      - "one REVERSE ledger entry written per RELEASE entry on each carton of the order"
      - "allocation_entitlement.held_cartons incremented by the accepted cartons"
      - "cumulative_released_doses on each carton decreases by exactly the reversed quantity"
  - method: GET
    path: "/vaccine-distribution/order-rejections"
    description: "List order rejections, filtered by order"
    roles: [RegulatoryAffairsOfficer, DistributionPlanner, ColdChainReviewer]
    code: 200
    input: ["site_order_id?", "reason_code?", "limit?", "offset?"]
    output: "OrderRejection[]"
    side_effects: []

  # --- DispatchOrder ---
  - method: POST
    path: "/vaccine-distribution/dispatches"
    description: "Draft a dispatch for an accepted site order, choosing the cold-chain entry route"
    roles: [LogisticsOperator]
    code: 201
    input: [site_order_id, storage_site_id, entry_route]
    output: DispatchOrder
    side_effects: ["status = DRAFT", "staging_site_id selected when entry_route is THAW_AT_HUB"]
  - method: GET
    path: "/vaccine-distribution/dispatches"
    description: "List dispatches"
    roles: [RegulatoryAffairsOfficer, DistributionPlanner, SiteCoordinator, LogisticsOperator, ColdChainReviewer]
    code: 200
    input: ["site_order_id?", "storage_site_id?", "status?", "limit?", "offset?"]
    output: "DispatchOrder[]"
    side_effects: []
  - method: GET
    path: "/vaccine-distribution/dispatches/{id}"
    description: "Get one dispatch"
    roles: [RegulatoryAffairsOfficer, DistributionPlanner, SiteCoordinator, LogisticsOperator, ColdChainReviewer]
    code: 200
    input: []
    output: DispatchOrder
    side_effects: []
  - method: POST
    path: "/vaccine-distribution/dispatches/{id}/pack"
    description: "Move the dispatch into packing and resolve its cold-chain route"
    roles: [LogisticsOperator]
    code: 200
    input: []
    output: DispatchOrder
    side_effects:
      - "status = PACKED"
      - "freeze_required recomputed from the destination's reported entry type"
      - "min_order_shortfall_cartons recomputed against the batch product's pack size"
      - "increments dispatch_order.version by 1"
  - method: POST
    path: "/vaccine-distribution/dispatches/{id}/dispatch"
    description: "Send a packed dispatch on its scheduled route"
    roles: [LogisticsOperator]
    code: 200
    input: []
    output: DispatchOrder
    side_effects:
      - "status = IN_TRANSIT with dispatched_at and eta_at set"
      - "one RELEASE ledger entry per carton on the dispatch"
      - "each carton on the dispatch → IN_TRANSIT"
      - "cold_chain_shipper.packing_status = IN_TRANSIT"
      - "increments dispatch_order.version by 1"
  - method: POST
    path: "/vaccine-distribution/dispatches/{id}/deliver"
    description: "Record arrival at the destination and re-base each carton's storage state"
    roles: [SiteCoordinator]
    code: 200
    input: [arrived_at]
    output: DispatchOrder
    side_effects:
      - "status = DELIVERED"
      - "cartons on a THAW_AT_HUB route → REFRIGERATED with the capped beyond-use date; cartons on a DIRECT_ULTRA_COLD route return to ULTRA_COLD unless the destination cannot hold ultra-cold, in which case they park PALLET_STAGED"
      - "destination open_excursion_count and inventory_status recomputed"
      - "site_order.order_status = FULFILLED with payment_status = DUE"
      - "cold_chain_shipper.packing_status = RECEIVED when a reading exists inside the grace window"
      - "increments dispatch_order.version by 1"
  - method: POST
    path: "/vaccine-distribution/dispatches/{id}/reject-at-dock"
    description: "Refuse a shipment at the receiving dock"
    roles: [SiteCoordinator]
    code: 200
    input: [reason_code]
    output: DispatchOrder
    side_effects:
      - "status = REJECTED_AT_DOCK"
      - "site_order.payment_status = DISPUTED"
      - "route cartons remain IN_TRANSIT and are re-consigned to the staging site"
      - "increments dispatch_order.version by 1"

