              payload: { adopting_employer_id: "${emp_q_id}", exit_type: "TRANSFER_TO_OTHER_PEP", requested_exit_date: "2026-09-20", blackout_start_date: "2026-09-16", blackout_end_date: "2026-09-19" }
              as: AdoptingEmployer
              as_user_id: "${emp_q_id}"
              captures: { exit_q_id: $.data.id }
          trigger:
            - call: "POST /pep/exit-transfers/${exit_p_id}/approve"
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
            - call: "POST /pep/exit-transfers/${exit_q_id}/approve"
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              expect_error: ERR_BLACKOUT_WINDOW_CONFLICT
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: RegulatorOps
            - call: "POST /pep/exit-transfers/${exit_p_id}/settle"
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
            - call: "POST /pep/exit-transfers/${exit_q_id}/approve"
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              expect_error: ERR_BLACKOUT_WINDOW_CONFLICT
            - call: "POST /pep/exit-transfers/${exit_p_id}/reverse"
              payload: { reversal_reason: "Successor trustee declined the transfer of assets." }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
            - call: "POST /pep/exit-transfers/${exit_q_id}/approve"
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
          assert:
            - "Palisade's approve returns 200 with ExitTransfer.${exit_p_id}.status == APPROVED and AdoptingEmployer.${emp_p_id}.adoption_status == SPINOFF_IN_PROGRESS"
            - "attempt 1 on Quarry returns 409 ERR_BLACKOUT_WINDOW_CONFLICT even though [2026-09-16, 2026-09-19] does not intersect [2026-09-01, 2026-09-15]: the one-day gap is inside the 5-day buffer"
            - "attempt 2 on Quarry still returns 409 after Palisade's transfer has SETTLED, because the rule excludes only REVERSED transfers"
            - "ExitTransfer.${exit_p_id}.status == REVERSED after the reversal and AdoptingEmployer.${emp_p_id}.adoption_status == SPINOFF_IN_PROGRESS with exited_at cleared"
            - "attempt 3 on Quarry returns 200 with ExitTransfer.${exit_q_id}.status == APPROVED and approved_at set from the logical clock 2026-09-16T00:00:00Z"
            - "every failed approve left ExitTransfer.${exit_q_id}.status == REQUESTED and its version unchanged"
          falsification: |
            The buffer boundary is exercised by re-running the same setup with only Palisade's
            window [2026-09-01, 2026-09-15] approved and Quarry's window shifted: a window
            starting 2026-09-20, exactly BLACKOUT_BUFFER_DAYS (5) calendar days after the
            incumbent's blackout_end_date, is still refused with 409
            ERR_BLACKOUT_WINDOW_CONFLICT, while the same window starting one day later on
            2026-09-21 is approved with 200. An implementation that tests only for interval
            intersection admits both; one that measures the gap as strictly greater than 5
            calendar days admits only the second.

  - rule_id: compensating_invariant
    instances:

      - name: deposit_reversal_restores_contribution_control_delta_to_zero
        grounds:
          - state_machines.RemittanceDeposit.POSTED_to_REVERSED
          - state_machines.PayrollBatch.REMITTED_to_VALIDATED
          - calculations.plan_control_totals
          - entities.PlanDocument.fields.contribution_control_delta_cents
          - validations[priority=18]
        distinguishing_aspect: |
          Posting a deposit moves the same cents across four different plan aggregates at once —
          it leaves total_validated_contributions_cents alone, drains
          aggregate_receivable_cents, fills total_assets_cents, and may suspend an employer.
          Reversal has to undo every one of those in the opposite direction so that
          contribution_control_delta_cents is exactly 0 again, with no drift, and it must also
          unwind the suspension it caused. The compensation is then closed off: once a
          correction has been computed the deposit is no longer reversible, so the ledger can
          only move forward from there.
