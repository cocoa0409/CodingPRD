# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x instances; every chain replayable from empty DB via §1.5 endpoints.
# Logical clock default is 2026-08-01T00:00:00Z unless a chain sets it.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: sea_service_provisional_vs_verified_day_credit
        grounds:
          - calculations.sea_service_day_credit
          - entities.SeaServiceRecord.fields.provisional_days
          - entities.SeaServiceRecord.fields.verified_days
        distinguishing_aspect: |
          Dual variant on the SeaServiceRecord domain: identical records yield provisional
          totals over {SUBMITTED, VERIFIED} with NO factors (30 + 10 = 40.0) but verified
          totals over {VERIFIED} with region x watch factors (30x1.0x1.5 + 10x0.5x1.0 = 50.0).
        test_recipe:
          setup:
            - "Mariner M (no activation needed) and Vessel V exist"
            - "R1: OCEAN TWELVE_HOUR 2025-01-01..2025-01-30 (30 calendar days) -> provisional 30.0, verified 45.0"
            - "R2: INLAND EIGHT_HOUR 2025-02-01..2025-02-10 (10 calendar days) -> provisional 10.0, verified 5.0"
            - "Both records SUBMITTED then VERIFIED (recorder is the mariner, verifier a different officer)"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Variant One", mariner_reference_number: "MRN-DV1-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /vessels", payload: { vessel_name: "SS Variant", imo_number: "IMO-DV1", vessel_class: "CONTAINER", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/sea-service-records", payload: { vessel_id: "${v_id}", position_code: "AB", rank_track: "DECK", rank_grade: 5, service_region: "OCEAN", watch_schedule: "TWELVE_HOUR", start_date: "2025-01-01T00:00:00Z", end_date: "2025-01-30T00:00:00Z" }, as: Mariner, as_user_id: "${m_id}", captures: { r1_id: $.data.id, r1_prov: $.data.provisional_days } }
            - { call: "POST /mariners/${m_id}/sea-service-records", payload: { vessel_id: "${v_id}", position_code: "AB", rank_track: "DECK", rank_grade: 5, service_region: "INLAND", watch_schedule: "EIGHT_HOUR", start_date: "2025-02-01T00:00:00Z", end_date: "2025-02-10T00:00:00Z" }, as: Mariner, as_user_id: "${m_id}", captures: { r2_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/sea-service-records/${r1_id}/submit", payload: {}, as: Mariner, as_user_id: "${m_id}" }
            - { call: "POST /mariners/${m_id}/sea-service-records/${r2_id}/submit", payload: {}, as: Mariner, as_user_id: "${m_id}" }
            - { call: "POST /mariners/${m_id}/sea-service-records/${r1_id}/verify", payload: {}, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/sea-service-records/${r2_id}/verify", payload: {}, as: CredentialingOfficer }
          trigger:
            - { call: "GET /mariners/${m_id}/sea-service-summary", as: CredentialingOfficer, captures: { sum_prov: $.data.provisional_days_total, sum_ver: $.data.verified_days_total } }
            - { call: "GET /mariners/${m_id}/sea-service-records/${r1_id}", as: CredentialingOfficer, captures: { r1_ver: $.data.verified_days } }
          assert:
            - "r1_prov == 30.0 (provisional: raw inclusive calendar days, no factors)"
            - "r1_ver == 45.0 (verified: 30 x 1.0 OCEAN x 1.5 TWELVE_HOUR)"
            - "sum_prov == 40.0 (30 + 10; both records included as VERIFIED members of the provisional input set)"
            - "sum_ver == 50.0 (45.0 + 5.0; INLAND EIGHT_HOUR 10 days -> 5.0)"
            - "provisional variant and verified variant disagree on identical stored rows: 40.0 != 50.0"
      - name: training_reimbursement_provisional_vs_final_receipt
        grounds:
          - calculations.training_reimbursement
          - entities.TrainingEnrollment.fields.provisional_amount_cents
          - entities.TrainingEnrollment.fields.reimbursed_amount_cents
          - entities.TrainingBudget.fields.used_cents
        distinguishing_aspect: |
          Dual variant on the TrainingEnrollment domain (different entity domain than the
          sea-service instance): provisional reservation = round_half_up(min(cost, cap) x 0.80)
          = 160000 for a DIRECT mariner on a 250000-cent course; final settlement against a
          150000-cent receipt = min(receipt, provisional) = 150000. Identical course cost,
          different amount, and the 10000 delta is released from the budget reservation.
        test_recipe:
          setup:
            - "DIRECT mariner activated (medical, credential, NEGATIVE drug test, activate)"
            - "Course cost_cents 250000 (above PER_COURSE_CAP 200000), capacity 5, start 2026-09-01"
            - "Enrollment approved (channel_snapshot DIRECT), then enrolled: provisional 160000, budget reserved 160000"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Variant Two", mariner_reference_number: "MRN-DV2-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "POST /training-courses", payload: { course_code: "DV2-C1", title: "Advanced Ship Handling", provider: "MaritimeEd", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-05T00:00:00Z", seat_capacity: 5, cost_cents: 250000 }, as: FleetAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /training-courses/${course_id}/enrollments", payload: {}, as: Mariner, as_user_id: "${m_id}", captures: { e_id: $.data.id } }
            - { call: "POST /training-enrollments/${e_id}/approve", payload: {}, as: CrewingManager, as_user_id: "cm-001" }
            - { call: "POST /training-enrollments/${e_id}/enroll", payload: {}, as: FleetAdmin, captures: { e_prov: $.data.provisional_amount_cents } }
            - { call: "POST /training-enrollments/${e_id}/record-completion", payload: { outcome: "COMPLETED" }, as: FleetAdmin }
          trigger:
            - { call: "POST /training-enrollments/${e_id}/reimburse", payload: { receipt_amount_cents: 150000 }, as: FleetAdmin, as_user_id: "fa-001", captures: { e_reimb: $.data.reimbursed_amount_cents } }
            - { call: "GET /mariners/${m_id}/training-budgets", as: FleetAdmin, captures: { b_used: "$.data[0].used_cents", b_res: "$.data[0].reserved_cents", b_avail: "$.data[0].available_cents" } }
          assert:
            - "e_prov == 160000 (provisional: min(250000, 200000) x 0.80 DIRECT)"
            - "e_reimb == 150000 (final: min(receipt 150000, provisional 160000))"
            - "b_used == 150000"
            - "b_res == 0 (full 160000 reservation released; 10000 delta returned)"
            - "b_avail == 350000 (500000 - 150000 used - 0 reserved)"
            - "provisional != final on identical course cost: 160000 != 150000"

  - rule_id: combinatorial_formula
    instances:
      - name: reimbursement_min_nesting_with_channel_branch
        grounds:
          - calculations.training_reimbursement
          - entities.TrainingEnrollment.fields.channel_snapshot
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (course cost, PER_COURSE_CAP, channel percent,
          budget availability) with nested min() and a conditional branch on channel_snapshot.
          Same 180000-cent course: UNION_HALL mariner provisional 180000 (x1.00), DIRECT
          mariner provisional 144000 (x0.80); identical 190000 receipt settles to 180000 vs
          144000 respectively (min(receipt, provisional) bites only the union case at receipt).
        test_recipe:
          setup:
            - "Mariner MU hire_channel UNION_HALL, activated; Mariner MD hire_channel DIRECT, activated"
            - "Course cost 180000 (below cap), capacity 5, start 2026-09-01"
            - "Both enrolled (approved + enrolled); provisional 180000 vs 144000"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Union One", mariner_reference_number: "MRN-CF1-U", home_port_code: "SFO", hire_channel: "UNION_HALL", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { mu_id: $.data.id } }
            - { call: "POST /mariners/${mu_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${mu_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${mu_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dtu_id: $.data.id } }
            - { call: "POST /mariners/${mu_id}/drug-tests/${dtu_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${mu_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "POST /mariners", payload: { full_name: "Direct One", mariner_reference_number: "MRN-CF1-D", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { md_id: $.data.id } }
            - { call: "POST /mariners/${md_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${md_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${md_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dtd_id: $.data.id } }
            - { call: "POST /mariners/${md_id}/drug-tests/${dtd_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${md_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "POST /training-courses", payload: { course_code: "CF1-C1", title: "Radar Observer", provider: "MaritimeEd", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-05T00:00:00Z", seat_capacity: 5, cost_cents: 180000 }, as: FleetAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /training-courses/${course_id}/enrollments", payload: {}, as: Mariner, as_user_id: "${mu_id}", captures: { eu_id: $.data.id } }
            - { call: "POST /training-courses/${course_id}/enrollments", payload: {}, as: Mariner, as_user_id: "${md_id}", captures: { ed_id: $.data.id } }
            - { call: "POST /training-enrollments/${eu_id}/approve", payload: {}, as: CrewingManager, as_user_id: "cm-002" }
            - { call: "POST /training-enrollments/${ed_id}/approve", payload: {}, as: CrewingManager, as_user_id: "cm-002" }
            - { call: "POST /training-enrollments/${eu_id}/enroll", payload: {}, as: FleetAdmin, captures: { eu_prov: $.data.provisional_amount_cents } }
            - { call: "POST /training-enrollments/${ed_id}/enroll", payload: {}, as: FleetAdmin, captures: { ed_prov: $.data.provisional_amount_cents } }
            - { call: "POST /training-enrollments/${eu_id}/record-completion", payload: { outcome: "COMPLETED" }, as: FleetAdmin }
            - { call: "POST /training-enrollments/${ed_id}/record-completion", payload: { outcome: "COMPLETED" }, as: FleetAdmin }
          trigger:
            - { call: "POST /training-enrollments/${eu_id}/reimburse", payload: { receipt_amount_cents: 190000 }, as: FleetAdmin, as_user_id: "fa-002", captures: { eu_reimb: $.data.reimbursed_amount_cents } }
            - { call: "POST /training-enrollments/${ed_id}/reimburse", payload: { receipt_amount_cents: 190000 }, as: FleetAdmin, as_user_id: "fa-002", captures: { ed_reimb: $.data.reimbursed_amount_cents } }
          assert:
            - "eu_prov == 180000 (min(180000, 200000) x 1.00 UNION_HALL)"
            - "ed_prov == 144000 (min(180000, 200000) x 0.80 DIRECT)"
            - "eu_reimb == 180000 (min(190000 receipt, 180000 provisional) — provisional cap bites)"
            - "ed_reimb == 144000 (min(190000, 144000) — channel branch bites twice)"
            - "identical course cost and identical receipt diverge solely by channel_snapshot"
      - name: travel_fare_per_leg_rounding_order
        grounds:
          - calculations.travel_fare_total
          - entities.TravelBooking.fields.total_fare_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: two legs of 9990 cents at 1550 bps markup each compute
          11538.45 per leg. Pinned order round-per-leg-then-sum yields 11538 + 11538 = 23076;
          the alternative sum-then-round yields round_half_up(23076.90) = 23077. The scaffold
          pins per-leg-then-sum, so 23076 is the only correct total.
        test_recipe:
          setup:
            - "DIRECT mariner activated; vessel ACTIVE with AB slot; rotation plan 2026-08-01..2027-08-01 max_handover 3"
            - "Assignment CONFIRMED sign_on 2026-08-10 relief 2026-11-10 (local_join false -> travel PENDING)"
            - "JOIN booking with two legs (9990 base, 1550 bps markup each)"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Fare One", mariner_reference_number: "MRN-CF2-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "POST /vessels", payload: { vessel_name: "SS Fare", imo_number: "IMO-CF2", vessel_class: "CONTAINER", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/manning-slots", payload: { position_code: "AB", rank_track: "DECK", min_rank_grade: 2, required_endorsement_code: "DECK_AB", is_critical_position: false, standard_tour_days: 90 }, as: PortCaptain, captures: { s_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/activate", payload: {}, as: FleetAdmin, captures: { v_ver: $.data.version } }
            - { call: "POST /vessels/${v_id}/rotation-plans", payload: { effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", standard_tour_days: 90, max_handover_overlap_days: 3, expected_vessel_version: "${v_ver}" }, as: CrewingManager }
            - { call: "POST /assignments", payload: { mariner_id: "${m_id}", manning_slot_id: "${s_id}", assignment_channel: "DIRECT_HIRE", sign_on_date: "2026-08-10T00:00:00Z", planned_relief_date: "2026-11-10T00:00:00Z", local_join: false }, as: CrewingManager, captures: { a_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/confirm", payload: {}, as: CrewingManager }
            - { call: "POST /assignments/${a_id}/travel-bookings", payload: { direction: "JOIN", payer: "VESSEL_OWNER", legs: [ { carrier: "UA", from_port: "SFO", to_port: "SIN", depart_at: "2026-08-09T10:00:00Z", arrive_at: "2026-08-10T02:00:00Z", base_fare_cents: 9990, markup_bps: 1550 }, { carrier: "SQ", from_port: "SIN", to_port: "JKT", depart_at: "2026-08-10T06:00:00Z", arrive_at: "2026-08-10T08:00:00Z", base_fare_cents: 9990, markup_bps: 1550 } ] }, as: CrewingManager, captures: { tb_id: $.data.id } }
            - { call: "POST /assignments/${a_id}/travel-bookings/${tb_id}/book", payload: {}, as: CrewingManager }
          trigger:
            - { call: "POST /assignments/${a_id}/travel-bookings/${tb_id}/ticket", payload: {}, as: CrewingManager, captures: { tb_total: $.data.total_fare_cents } }
            - { call: "GET /assignments/${a_id}", as: CrewingManager, captures: { a_travel: $.data.travel_status } }
          assert:
            - "tb_total == 23076 (11538 + 11538; per-leg round_half_up(11538.45) = 11538 THEN sum)"
            - "tb_total != 23077 (the sum-then-round alternative round_half_up(23076.90))"
            - "a_travel == READY (JOIN ticketed bubbles the parallel travel dimension)"
      - name: readiness_posture_evaluation_order_snapshot
        grounds:
          - calculations.mariner_readiness_posture
          - entities.Mariner.fields.readiness_posture
          - entities.Mariner.fields.readiness_reasons
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: Assignment confirm gates on posture, posture is
          derived from credential/medical/drug children, and confirm's own writes feed Mariner
          state. The scaffold pins evaluation order: posture is computed from the pre-transition
          committed snapshot in gate order 1..5, collecting ALL applicable reasons; a RESTRICTED
          mariner (medical 19d + credential 24d from clock, drug 155d) may confirm only with
          planned_relief_date <= earliest restricting expiry (medical, 2026-08-20).
        test_recipe:
          setup:
            - "Mariner MR activated with medical expiry 2026-08-20 (19d) and credential expiry 2026-08-25 (24d), drug until 2027-01-02 (155d): posture RESTRICTED, reasons [MEDICAL_EXPIRING_SOON, CREDENTIAL_EXPIRING_SOON]"
            - "Vessel/slot/plan ready; MR has PROPOSED assignment A-ok (relief 2026-08-19 <= 2026-08-20) and A-bad (relief 2026-08-21 > 2026-08-20)"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Restricted One", mariner_reference_number: "MRN-CF3-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2026-08-20T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2026-08-25T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "POST /vessels", payload: { vessel_name: "SS Posture", imo_number: "IMO-CF3", vessel_class: "BULK", flag_state: "US" }, as: FleetAdmin, captures: { v_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/manning-slots", payload: { position_code: "AB", rank_track: "DECK", min_rank_grade: 2, required_endorsement_code: "DECK_AB", is_critical_position: false, standard_tour_days: 90 }, as: PortCaptain, captures: { s1_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/manning-slots", payload: { position_code: "OS", rank_track: "DECK", min_rank_grade: 1, required_endorsement_code: "DECK_AB", is_critical_position: false, standard_tour_days: 90 }, as: PortCaptain, captures: { s2_id: $.data.id } }
            - { call: "POST /vessels/${v_id}/activate", payload: {}, as: FleetAdmin, captures: { v_ver: $.data.version } }
            - { call: "POST /vessels/${v_id}/rotation-plans", payload: { effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", standard_tour_days: 90, max_handover_overlap_days: 3, expected_vessel_version: "${v_ver}" }, as: CrewingManager }
            - { call: "POST /assignments", payload: { mariner_id: "${m_id}", manning_slot_id: "${s1_id}", assignment_channel: "DIRECT_HIRE", sign_on_date: "2026-08-10T00:00:00Z", planned_relief_date: "2026-08-19T00:00:00Z", local_join: true }, as: CrewingManager, captures: { a_ok: $.data.id } }
            - { call: "POST /assignments", payload: { mariner_id: "${m_id}", manning_slot_id: "${s2_id}", assignment_channel: "DIRECT_HIRE", sign_on_date: "2026-08-20T00:00:00Z", planned_relief_date: "2026-08-21T00:00:00Z", local_join: true }, as: CrewingManager, captures: { a_bad: $.data.id } }
          trigger:
            - { call: "GET /mariners/${m_id}", as: CrewingManager, captures: { m_posture: $.data.readiness_posture, m_reasons: $.data.readiness_reasons } }
            - { call: "POST /assignments/${a_ok}/confirm", payload: {}, as: CrewingManager, captures: { a_ok_status: $.data.assignment_status } }
            - { call: "POST /assignments/${a_bad}/confirm", payload: {}, as: CrewingManager, captures: { err: $.data.error_id } }
          assert:
            - "m_posture == RESTRICTED"
            - "m_reasons contains MEDICAL_EXPIRING_SOON and CREDENTIAL_EXPIRING_SOON and NOT DRUG_CURRENCY_EXPIRING_SOON"
            - "a_ok_status == CONFIRMED (relief 2026-08-19 <= earliest restricting expiry 2026-08-20)"
            - "err == ERR_RESTRICTED_WINDOW_EXCEEDED (relief 2026-08-21 > 2026-08-20; earliest expiry = medical, not the later credential 2026-08-25)"
            - "posture was evaluated from the pre-confirm snapshot: the successful confirm of A-ok did not alter m_posture"
  - rule_id: non_linear_state_machine
    instances:
      - name: credential_renewal_cycle_loops
        grounds:
          - state_machines.Credential.VALID_to_RENEWAL_PENDING
          - state_machines.Credential.RENEWAL_PENDING_to_VALID
          - state_machines.Credential.EXPIRED_to_RENEWAL_PENDING
          - state_machines.Credential.VALID_to_EXPIRED
        distinguishing_aspect: |
          Cyclic machine on Credential (not a linear pipeline): VALID -> RENEWAL_PENDING ->
          VALID (deny keeps old dates), VALID -> RENEWAL_PENDING -> VALID (approve sets new
          dates, renewal_count 1), then clock sweep VALID -> EXPIRED -> RENEWAL_PENDING (late
          renewal inside the 180d grace) -> VALID (renewal_count 2). The entity revisits VALID
          three times through three different edges.
        test_recipe:
          setup:
            - "Mariner with one MMC_BASE credential C, issue 2026-01-01 expiry 2027-01-01"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Cycle One", mariner_reference_number: "MRN-NL1-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: CredentialingOfficer, captures: { c_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/credentials/${c_id}/submit-renewal", payload: {}, as: Mariner, as_user_id: "${m_id}" }
            - { call: "POST /mariners/${m_id}/credentials/${c_id}/deny-renewal", payload: { reason: "paperwork incomplete" }, as: CredentialingOfficer, captures: { c_after_deny: $.data.status, c_count_deny: $.data.renewal_count, c_expiry_deny: $.data.expiry_date } }
            - { call: "POST /mariners/${m_id}/credentials/${c_id}/submit-renewal", payload: {}, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials/${c_id}/approve-renewal", payload: { new_issue_date: "2026-08-02T00:00:00Z", new_expiry_date: "2031-08-02T00:00:00Z" }, as: CredentialingOfficer, captures: { c_count_1: $.data.renewal_count, c_expiry_1: $.data.expiry_date } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2031-09-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "GET /credentials/${c_id}", as: CredentialingOfficer, captures: { c_after_sweep: $.data.status } }
          trigger:
            - { call: "POST /mariners/${m_id}/credentials/${c_id}/submit-renewal", payload: {}, as: CredentialingOfficer, captures: { c_late: $.data.status } }
            - { call: "POST /mariners/${m_id}/credentials/${c_id}/approve-renewal", payload: { new_issue_date: "2031-09-02T00:00:00Z", new_expiry_date: "2032-09-02T00:00:00Z" }, as: CredentialingOfficer, captures: { c_final: $.data.status, c_count_2: $.data.renewal_count, c_expiry_2: $.data.expiry_date } }
          assert:
            - "c_after_deny == VALID and c_count_deny == 0 and c_expiry_deny == 2027-01-01T00:00:00Z (deny loop-back preserves old dates)"
            - "c_count_1 == 1 and c_expiry_1 == 2031-08-02T00:00:00Z (approve loop-forward replaces dates)"
            - "c_after_sweep == EXPIRED (clock 2031-09-01 past expiry 2031-08-02; still inside 180d grace so NOT LAPSED)"
            - "c_late == RENEWAL_PENDING (EXPIRED -> RENEWAL_PENDING late renewal edge)"
            - "c_final == VALID and c_count_2 == 2 and c_expiry_2 == 2032-09-02T00:00:00Z"
      - name: assignment_parallel_travel_dimensions
        grounds:
          - state_machines.Assignment.assignment_status
          - state_machines.Assignment.travel_status
          - state_machines.Assignment.repatriation_status
          - state_machines.TravelBooking.QUOTED_to_TICKETED
        distinguishing_aspect: |
          Parallel state dimensions on the Assignment entity (not a cycle on another entity):
          assignment_status (PROPOSED->CONFIRMED->ONBOARD->RELIEVED) evolves independently of
          travel_status (PENDING->READY, driven by JOIN bookings) and repatriation_status
          (NOT_DUE->DUE, driven by relieve). Travel reaching READY does not advance the
          lifecycle; relieve flips repatriation without touching travel_status.
        test_recipe:
          setup:
            - "M1 activated; vessel ACTIVE with AB slot; rotation plan; A1 CONFIRMED sign_on 2026-08-10 relief 2026-11-10 (local_join false)"
            - "M2 activated; A2 incoming on same slot sign_on 2026-11-08 relief 2027-02-08 local_join true (2d handover <= 3), CONFIRMED"
