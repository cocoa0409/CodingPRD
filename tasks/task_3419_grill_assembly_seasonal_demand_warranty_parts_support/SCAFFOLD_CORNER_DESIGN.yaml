            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 10, expected_season_version: "${s_v2}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${ch_id}" }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "IN_SEASON" }, as: PlannerAdmin }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1 }, as: ChannelRep, as_user_id: "${ch_id}", captures: { sale_id: "$.data.id" } }
            - { call: "POST /grillops/parts", payload: { part_number: "BRN-A", component: "BURNER", compatible_model_codes: ["GX-100"], supersession_chain_id: "CH-S", chain_position: 1, unit_cost_cents: 3200, stock_quantity: 5 }, as: PlannerAdmin, captures: { pA: "$.data.id" } }
            - { call: "POST /grillops/parts", payload: { part_number: "GRT-Z", component: "GRATE", compatible_model_codes: ["GX-100"], supersession_chain_id: "CH-OTHER", chain_position: 1, unit_cost_cents: 2400, stock_quantity: 5 }, as: PlannerAdmin, captures: { pZ: "$.data.id" } }
            - { call: "POST /grillops/parts", payload: { part_number: "BRN-B", component: "BURNER", compatible_model_codes: ["GX-100"], supersession_chain_id: "CH-S", chain_position: 2, unit_cost_cents: 3400, stock_quantity: 0 }, as: PlannerAdmin, captures: { pB: "$.data.id" } }
          trigger:
            - { call: "POST /grillops/parts/${pA}/transition", payload: { action: "SUPERSEDE", successor_part_id: "${pZ}" }, as: PlannerAdmin, captures: { e1: "$.data.error_id" } }
            - { call: "POST /grillops/parts/${pA}/transition", payload: { action: "SUPERSEDE", successor_part_id: "${pB}" }, as: PlannerAdmin, captures: { ok_st: "$.data.status" } }
            - { call: "POST /grillops/parts-orders", payload: { part_id: "${pA}", sale_id: "${sale_id}", quantity: 1, fulfillment_type: "PAID" }, as: ServiceAgent, captures: { e2: "$.data.error_id" } }
          assert:
            - "captured e1 == ERR_VALIDATION (successor GRT-Z is in chain CH-OTHER, not CH-S)"
            - "captured ok_st == SUPERSEDED (in-chain, higher position)"
            - "captured e2 == ERR_PART_UNAVAILABLE (walk finds BRN-B EXHAUSTED, chain ends, requested part SUPERSEDED so no backorder fallback)"

      - name: channel_exposure_reconciles_on_accept_and_release
        claim_type: derived_field_reconciliation
        grounds: [entities.ChannelAccount.fields.outstanding_exposure_cents, calculations.calc_allocation_credit]
        distinguishing_aspect: "Derived-field lifecycle: exposure is 0 while OFFERED, becomes (10 - 0) x 100000 == 1000000 on ACCEPT, and returns to 0 on RELEASE — recomputed on every allocation mutation, never drifting."
        test_recipe:
          setup: ["Season 2026 in ALLOCATION; channel BigBox credit 100000000; one OFFERED allocation of 10 units (base 100000)"]
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "BigBox", channel_type: "HOME_CENTER", allocation_priority: 10, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 20 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { sv: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 10, expected_season_version: "${sv}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
          trigger:
            - { call: "GET /grillops/channels/${ch_id}", as: PlannerAdmin, captures: { ex0: "$.data.outstanding_exposure_cents" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { a_v2: "$.data.version" } }
            - { call: "GET /grillops/channels/${ch_id}", as: PlannerAdmin, captures: { ex1: "$.data.outstanding_exposure_cents" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "RELEASE", expected_allocation_version: "${a_v2}" }, as: ChannelRep, as_user_id: "${ch_id}" }
            - { call: "GET /grillops/channels/${ch_id}", as: PlannerAdmin, captures: { ex2: "$.data.outstanding_exposure_cents" } }
          assert:
            - "captured ex0 == 0 (OFFERED allocations carry no exposure)"
            - "captured ex1 == 1000000 ((10 allocated - 0 committed) x 100000)"
            - "captured ex2 == 0 (RELEASE returns the reservation)"

      - name: same_tuple_allocation_create_supersedes_and_recaptures
        claim_type: cascade_side_effect
        grounds: [state_machines.Allocation.OFFERED_to_SUPERSEDED, entities.Allocation, calculations.calc_allocation_waterfall]
        distinguishing_aspect: "Create-with-supersede (the OCC rule's raison d'etre): a second POST for the same (season, channel, model) SUPERSEDES the first offer, recaptures its 8 units BEFORE the capacity check, so 5 new units fit into a lot showing only 2 available."
        test_recipe:
          setup: ["Season 2026 in ALLOCATION; channel BigBox; lot 10; alloc-1 OFFERED 8 units (availability 2)"]
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "BigBox", channel_type: "HOME_CENTER", allocation_priority: 10, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 10 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { sv1: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 8, expected_season_version: "${sv1}" }, as: PlannerAdmin, captures: { a1: "$.data.id" } }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { sv2: "$.data.version" } }
          trigger:
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 5, expected_season_version: "${sv2}" }, as: PlannerAdmin, captures: { a2: "$.data.id", a2_st: "$.data.status" } }
            - { call: "GET /grillops/allocations/${a1}", as: PlannerAdmin, captures: { a1_st: "$.data.status", a1_units: "$.data.allocated_units" } }
            - { call: "GET /grillops/seasons/${s_id}/lots", as: PlannerAdmin, captures: { avail: "$.data[0].units_available" } }
          assert:
            - "captured a2_st == OFFERED (5 units fit ONLY because the supersede recapture ran before the capacity check)"
            - "captured a1_st == SUPERSEDED and a1_units == 0 (allocated := committed == 0)"
            - "captured avail == 5 (10 built - 5 newly reserved)"

      - name: clearance_waterfall_cascade_stub
        claim_type: cascade_side_effect
        grounds: [state_machines.Season.IN_SEASON_to_CLEARANCE]
        excluded_because:
          difficulty_instance: clearance_waterfall_snapshot_evaluation_order
          rationale: "The offer-expiry + recapture + redistribution cascade (and its exact unit math) is the assert core of the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: created_model_immediately_readable
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, "endpoints.GET /grillops/models/{id}"]
        distinguishing_aspect: "Immediate consistency: the POST /grillops/models response and a subsequent GET return identical field values — no replication lag anywhere in the read path."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id", v0: "$.data.version" } }
          trigger:
            - { call: "GET /grillops/models/${m_id}", as: PlannerAdmin, captures: { v1: "$.data.version", code1: "$.data.model_code", until1: "$.data.support_obligation_until" } }
          assert:
            - "captured v1 == v0 (no mutation between write and read)"
            - "captured code1 == GX-100 and until1 == null (computed field present and stable on first read)"

