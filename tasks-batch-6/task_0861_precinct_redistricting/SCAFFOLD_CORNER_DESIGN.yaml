              payload: {}
              as: CommissionChair
          trigger:
            - call: "POST /plans/${pid}/reject"
              payload: {}
              as: CommissionChair
          assert: ["response error_id == ERR_INVALID_STATE"]

  # ---------------------------------------------------------------- Validations
  - section: validations
    instances:
      - name: block_assignment_district_plan_mismatch
        claim_type: Cross-entity validation
        grounds:
          - 'validations[priority=6]'
          - 'errors[ERR_DISTRICT_PLAN_MISMATCH]'
        distinguishing_aspect: "Assigning with a district_id that belongs to a different plan -> 422 ERR_DISTRICT_PLAN_MISMATCH."
        test_recipe:
          setup: ["two plans P1 and P2 in the same jurisdiction; district DX belongs to P2"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jdm", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "A", population: 1000, voting_age_population: 800, minority_vap: 200, registered_voters: 600 }
              as: Cartographer
              captures: { blkA: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "P1" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { p1: $.data.id, pv1: $.data.version }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "P2" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { p2: $.data.id }
            - call: "POST /plans/${p2}/districts"
              payload: { district_number: 1 }
              as: Cartographer
              captures: { dx: $.data.id }
          trigger:
            - call: "POST /plans/${p1}/block-assignments"
              payload: { district_id: "${dx}", census_block_id: "${blkA}", expected_plan_version: "${pv1}" }
              as: Cartographer
          assert: ["response error_id == ERR_DISTRICT_PLAN_MISMATCH"]

      - name: block_assignment_cross_jurisdiction_block
        claim_type: Cross-entity validation
        grounds:
          - 'validations[priority=6]'
          - 'errors[ERR_BLOCK_JURISDICTION_MISMATCH]'
        distinguishing_aspect: "Assigning a census block from jurisdiction J2 into a plan in J1 -> 422 ERR_BLOCK_JURISDICTION_MISMATCH."
        test_recipe:
          setup: ["J1 with plan P1 and District 1; J2 with block Z"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J1", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { j1: $.data.id }
            - call: "POST /jurisdictions"
              payload: { name: "J2", state_code: "NV", target_district_count: 1 }
              as: Cartographer
              captures: { j2: $.data.id }
            - call: "POST /jurisdictions/${j2}/census-blocks"
              payload: { geoid: "Z", population: 1000, voting_age_population: 800, minority_vap: 200, registered_voters: 600 }
              as: Cartographer
              captures: { blkZ: $.data.id }
            - call: "POST /jurisdictions/${j1}/plans"
