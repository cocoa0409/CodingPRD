# =============================================================================
# §1.9 Scaffold Corner Design — task_2707 Shelf Label & Price Accuracy Compliance
#
# Breadth probe over §1.1–§1.7 of SCAFFOLD.yaml. Sections and claim_type values
# are taken verbatim from references/claim-extraction-guide.md; no category is
# invented. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are
# emitted as `excluded_because:` stubs naming the covering §1.8 instance.
#
# Standing conventions used by every recipe below:
#   * The logical clock starts at 2026-08-01T00:00:00Z; any instance that needs
#     a different instant sets it explicitly via POST /price-integrity/_clock/set_current_utc.
#   * Opaque roles (PricingAdmin, ComplianceOfficer, CustomerServiceDesk) never
#     pass as_user_id; entity_backed roles (StoreManager, LabelAssociate,
#     PriceAuditor) always do, and their Associate.role_code matches the role.
#   * The literal id 00000000-0000-0000-0000-000000000000 is used as the
#     guaranteed-absent identifier in every not-found probe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: Entities
    instances:
      - name: corner_create_jurisdiction_returns_declared_fields_and_envelope
        claim_type: creation
        grounds:
          - entities.Jurisdiction
          - endpoints.POST_/price-integrity/jurisdictions
          - response_envelope
        distinguishing_aspect: "POST /price-integrity/jurisdictions with every required field returns HTTP 201, a `data` object carrying all 17 declared input fields plus id/created_at/updated_at/version, a `meta` object, and a null `error`."
        test_recipe:
          setup:
            - "Empty database; clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
          trigger:
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", unit_price_required: true, unit_price_uom_rule: "PER_UNIT_MEASURE_CANONICAL", unit_price_decimal_places: 2, unit_price_rounding: "ROUND_HALF_UP", scanner_error_rate_threshold_pct: 25.0, default_rate_variant: "GROSS_MISMATCH", overcharge_refund_policy: "REFUND_DIFFERENCE_PLUS_FIXED", refund_fixed_bonus_cents: 500, refund_cap_cents: 5000, refund_budget_per_audit_cents: 100000, penalty_per_violation_cents: 5000, penalty_max_cents: 2000000, signage_disclosure_codes: ["UNIT_PRICE", "EXPIRY_DATE"], grace_period_hours: 48, accountability_variant: "OCCURRENCE_WEIGHTED" }
              as: PricingAdmin
              captures: { jur_a: $.data.id, jur_v: $.data.version }
          assert:
            - "HTTP 201 and the body has exactly the keys data, meta and error; error is null"
            - "Jurisdiction.${jur_a}.code == US-CA, name == California, unit_price_required == true, unit_price_uom_rule == PER_UNIT_MEASURE_CANONICAL, unit_price_decimal_places == 2, unit_price_rounding == ROUND_HALF_UP"
            - "Jurisdiction.${jur_a}.scanner_error_rate_threshold_pct == 25.0, default_rate_variant == GROSS_MISMATCH, overcharge_refund_policy == REFUND_DIFFERENCE_PLUS_FIXED, refund_fixed_bonus_cents == 500, refund_cap_cents == 5000, refund_budget_per_audit_cents == 100000"
            - "Jurisdiction.${jur_a}.penalty_per_violation_cents == 5000, penalty_max_cents == 2000000, signage_disclosure_codes == [UNIT_PRICE, EXPIRY_DATE], grace_period_hours == 48, accountability_variant == OCCURRENCE_WEIGHTED"
            - "${jur_v} == 1 and created_at == updated_at == 2026-08-01T00:00:00Z (the logical clock, not wall time)"
            - "GET /price-integrity/jurisdictions/${jur_a} as ComplianceOfficer returns the identical field values"

      - name: corner_default_values_applied_when_optional_jurisdiction_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.Jurisdiction.fields.unit_price_required
          - entities.Jurisdiction.fields.scanner_error_rate_threshold_pct
          - entities.Jurisdiction.fields.refund_cap_cents
          - entities.Jurisdiction.fields.accountability_variant
        distinguishing_aspect: "Creating a jurisdiction with only code and name applies every declared default, so scanner_error_rate_threshold_pct == 2.0, refund_cap_cents == 5000, penalty_max_cents == 2000000, signage_disclosure_codes == [] and grace_period_hours == 48 without the client sending them."
        test_recipe:
          setup:
            - "Empty database; clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
          trigger:
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-MIN", name: "Bare Minimum State" }
              as: PricingAdmin
              captures: { jur_min: $.data.id }
          assert:
            - "Jurisdiction.${jur_min}.unit_price_required == true"
            - "Jurisdiction.${jur_min}.unit_price_uom_rule == PER_UNIT_MEASURE_CANONICAL, unit_price_decimal_places == 2, unit_price_rounding == ROUND_HALF_UP"
            - "Jurisdiction.${jur_min}.scanner_error_rate_threshold_pct == 2.0 and default_rate_variant == GROSS_MISMATCH"
            - "Jurisdiction.${jur_min}.overcharge_refund_policy == REFUND_DIFFERENCE_ONLY, refund_fixed_bonus_cents == 0, refund_cap_cents == 5000, refund_budget_per_audit_cents == 100000"
            - "Jurisdiction.${jur_min}.penalty_per_violation_cents == 5000 and penalty_max_cents == 2000000"
            - "Jurisdiction.${jur_min}.signage_disclosure_codes == [] and grace_period_hours == 48 and accountability_variant == OCCURRENCE_WEIGHTED"
            - "A PromoSignage posted in this jurisdiction with disclosure_codes [] is COMPLIANT, proving the empty default is a real empty requirement set and not a null"

      - name: corner_missing_required_fields_rejected_with_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_25_ERR_INVALID_REQUEST
          - endpoints.POST_/price-integrity/stores
          - endpoints.POST_/price-integrity/price-change-files
        distinguishing_aspect: "Omitting any field declared in an endpoint's `input:` without a default returns HTTP 400 ERR_INVALID_REQUEST and persists nothing — checked on stores (jurisdiction_id absent) and on price change files (scope_store_ids absent)."
        test_recipe:
          setup:
            - "One jurisdiction exists so the only defect in each trigger is the missing field."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
          trigger:
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street" }
              as: PricingAdmin
              captures: { err_store: $.data.error_id }
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-1001", jurisdiction_id: "${jur_a}", effective_date: "2026-08-03T00:00:00Z" }
              as: PricingAdmin
              captures: { err_file: $.data.error_id }
          assert:
            - "Missing jurisdiction_id: HTTP 400 with ${err_store} == ERR_INVALID_REQUEST"
            - "Missing scope_store_ids: HTTP 400 with ${err_file} == ERR_INVALID_REQUEST"
            - "Both responses carry a null data and a populated error object with error_id and message"
            - "GET /price-integrity/stores as PricingAdmin returns total_count 0 and GET /price-integrity/price-change-files returns total_count 0 — nothing was persisted"

      - name: corner_type_constraints_reject_bad_enum_and_malformed_window
        claim_type: type_constraints
        grounds:
          - validations.priority_25_ERR_INVALID_REQUEST
          - validations.priority_58_ERR_INVALID_WINDOW
          - entities.Associate.fields.role_code
          - entities.ScannerAudit.fields.scan_window_start
        distinguishing_aspect: "A value outside a declared enum set is a 400 ERR_INVALID_REQUEST (shape failure), while a well-typed but inverted interval is a 422 ERR_INVALID_WINDOW (semantic failure) — the two are distinct rules at priorities 25 and 58, not one catch-all."
        test_recipe:
          setup:
            - "One jurisdiction, one store, one aisle and one CERTIFIED PRICE_AUDITOR exist."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
          trigger:
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-BAD", full_name: "Bad Role", role_code: "CASHIER" }
              as: PricingAdmin
              captures: { err_enum: $.data.error_id }
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T10:00:00Z", scan_window_end: "2026-08-01T08:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { err_window: $.data.error_id }
          assert:
            - "role_code CASHIER is not in {LABEL_ASSOCIATE, PRICE_AUDITOR, STORE_MANAGER}: HTTP 400 with ${err_enum} == ERR_INVALID_REQUEST"
            - "scan_window_start 10:00 after scan_window_end 08:00: HTTP 422 with ${err_window} == ERR_INVALID_WINDOW"
            - "GET /price-integrity/stores/${store_a}/associates returns total_count 1 (only the auditor) and GET /price-integrity/scanner-audits?store_id=${store_a} returns total_count 0"
            - "An identical audit request with scan_window_start 08:00 and scan_window_end 10:00 succeeds with HTTP 201, proving only the ordering was at fault"

      - name: corner_computed_and_system_fields_ignore_client_supplied_values
        claim_type: computed_fields
        grounds:
          - entities.PriceChangeLine.fields.unit_price_display_cents
          - entities.PriceChangeLine.fields.line_status
          - entities.Store.fields.compliance_posture
          - calculations.unit_price_display
        distinguishing_aspect: "Fields declared source computed or system are never accepted from the client: unit_price_display_cents, unit_price_basis_qty and line_status are absent from the endpoint's `input:`, so a line created from item data alone still comes back with unit_price_display_cents == 1333 for a 12 OZ / 1000c item under PER_UNIT_MEASURE_CANONICAL."
        test_recipe:
          setup:
            - "Jurisdiction US-CA with unit_price_uom_rule PER_UNIT_MEASURE_CANONICAL, unit_price_decimal_places 2, unit_price_rounding ROUND_HALF_UP."
            - "One store and one DRAFT price change file."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", unit_price_uom_rule: "PER_UNIT_MEASURE_CANONICAL", unit_price_decimal_places: 2, unit_price_rounding: "ROUND_HALF_UP" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-1001", jurisdiction_id: "${jur_a}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_a}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_a: $.data.id }
          trigger:
            - call: "POST /price-integrity/price-change-files/${file_a}/lines"
              payload: { item_upc: "00000000002001", item_description: "Cheese 12oz", category_code: "DAIRY", old_retail_cents: 1199, new_retail_cents: 1000, net_content_qty: 12, net_content_uom: "OZ" }
              as: PricingAdmin
              captures: { line_1: $.data.id, line_v: $.data.version }
          assert:
            - "PriceChangeLine.${line_1}.unit_price_basis_qty == 0.75 (12 / OZ_PER_LB 16, stored unrounded) and unit_price_basis_uom == LB"
            - "PriceChangeLine.${line_1}.unit_price_display_cents == 1333 (1000 / 0.75 == 1333.333..., ROUND_HALF_UP at cents_places 0)"
            - "PriceChangeLine.${line_1}.line_status == PENDING — the initial state came from §1.2, not from any client field"
            - "PriceChangeLine.${line_1}.id is server-minted, created_at == updated_at == 2026-08-01T00:00:00Z, and ${line_v} == 1"
            - "PriceChangeFile.${file_a}.line_count == 1 and verified_line_count == 0, both recomputed rather than supplied"
            - "Store.${store_a}.compliance_posture == OPEN and label_backlog_count == 0 at creation, with no client input for either"

      - name: corner_retrieval_and_listing_with_filter_and_pagination_metadata
        claim_type: retrieval
        grounds:
          - endpoints.GET_/price-integrity/stores/{id}
          - endpoints.GET_/price-integrity/stores
          - endpoints.GET_/price-integrity/price-change-files
          - response_envelope.meta
        distinguishing_aspect: "A single-entity GET echoes stored values byte-for-byte, and the collection GET returns a `meta` block whose total_count is the count matching the filter (not the page size) with has_more true only while unreturned rows remain."
        test_recipe:
          setup:
            - "Two jurisdictions; three stores in US-CA and one in US-NY."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-NY", name: "New York" }
              as: PricingAdmin
              captures: { jur_b: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S002", name: "Market Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_b: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S003", name: "Mission Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_c: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S004", name: "Broadway", jurisdiction_id: "${jur_b}" }
              as: PricingAdmin
              captures: { store_d: $.data.id }
          trigger:
            - call: "GET /price-integrity/stores/${store_b}"
              as: ComplianceOfficer
              captures: { got_number: $.data.store_number }
            - call: "GET /price-integrity/stores"
              payload: { jurisdiction_id: "${jur_a}", limit: 2, offset: 0 }
              as: PricingAdmin
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /price-integrity/stores"
              payload: { jurisdiction_id: "${jur_a}", limit: 2, offset: 2 }
              as: PricingAdmin
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "${got_number} == S002 and the retrieved store's jurisdiction_id == ${jur_a}"
            - "First page: len(data) == 2, meta.total_count == 3, meta.has_more == true"
            - "Second page: len(data) == 1, meta.total_count == 3, meta.has_more == false"
            - "${page1_first} != ${page2_first} and ${store_d} appears on neither page — the jurisdiction filter is applied before pagination"

      - name: corner_absent_identifiers_return_entity_specific_not_found
        claim_type: not_found
        grounds:
          - validations.priority_30_ERR_ENTITY_NOT_FOUND
          - errors.ERR_JURISDICTION_NOT_FOUND
          - errors.ERR_STORE_NOT_FOUND
          - errors.ERR_AISLE_NOT_FOUND
          - errors.ERR_ASSOCIATE_NOT_FOUND
          - errors.ERR_PRICE_CHANGE_FILE_NOT_FOUND
          - errors.ERR_PRICE_CHANGE_LINE_NOT_FOUND
          - errors.ERR_LABEL_TASK_NOT_FOUND
          - errors.ERR_SCANNER_AUDIT_NOT_FOUND
          - errors.ERR_SCAN_LINE_NOT_FOUND
          - errors.ERR_PROMO_SIGNAGE_NOT_FOUND
          - errors.ERR_REGULATORY_INSPECTION_NOT_FOUND
          - errors.ERR_INSPECTION_FINDING_NOT_FOUND
          - errors.ERR_REFUND_CLAIM_NOT_FOUND
          - errors.ERR_EXCEPTION_REPORT_NOT_FOUND
          - errors.ERR_ACCOUNTABILITY_ACTION_NOT_FOUND
        distinguishing_aspect: "Each of the fifteen single-resource GETs answers a syntactically valid but absent UUID with its own entity-specific 404 id — the catalog has fifteen distinct NOT_FOUND codes, so a shared generic ERR_NOT_FOUND fails this test."
        test_recipe:
          setup:
            - "Empty database. All fifteen probes use the literal absent id 00000000-0000-0000-0000-000000000000."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
          trigger:
            - call: "GET /price-integrity/jurisdictions/00000000-0000-0000-0000-000000000000"
              as: PricingAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /price-integrity/stores/00000000-0000-0000-0000-000000000000"
              as: PricingAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /price-integrity/aisles/00000000-0000-0000-0000-000000000000"
              as: PricingAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /price-integrity/associates/00000000-0000-0000-0000-000000000000"
              as: PricingAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /price-integrity/price-change-files/00000000-0000-0000-0000-000000000000"
              as: PricingAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /price-integrity/price-change-lines/00000000-0000-0000-0000-000000000000"
              as: PricingAdmin
              captures: { e6: $.data.error_id }
            - call: "GET /price-integrity/label-tasks/00000000-0000-0000-0000-000000000000"
              as: PricingAdmin
              captures: { e7: $.data.error_id }
            - call: "GET /price-integrity/scanner-audits/00000000-0000-0000-0000-000000000000"
              as: PricingAdmin
              captures: { e8: $.data.error_id }
            - call: "GET /price-integrity/scan-lines/00000000-0000-0000-0000-000000000000"
              as: PricingAdmin
              captures: { e9: $.data.error_id }
            - call: "GET /price-integrity/promo-signage/00000000-0000-0000-0000-000000000000"
              as: PricingAdmin
              captures: { e10: $.data.error_id }
            - call: "GET /price-integrity/regulatory-inspections/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { e11: $.data.error_id }
            - call: "GET /price-integrity/inspection-findings/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { e12: $.data.error_id }
            - call: "GET /price-integrity/refund-claims/00000000-0000-0000-0000-000000000000"
              as: CustomerServiceDesk
              captures: { e13: $.data.error_id }
            - call: "GET /price-integrity/exception-reports/00000000-0000-0000-0000-000000000000"
              as: ComplianceOfficer
              captures: { e14: $.data.error_id }
            - call: "GET /price-integrity/accountability-actions/00000000-0000-0000-0000-000000000000"
              as: PricingAdmin
              captures: { e15: $.data.error_id }
          assert:
            - "Every one of the fifteen calls returns HTTP 404 with a null data payload and a populated error object"
            - "${e1} == ERR_JURISDICTION_NOT_FOUND, ${e2} == ERR_STORE_NOT_FOUND, ${e3} == ERR_AISLE_NOT_FOUND, ${e4} == ERR_ASSOCIATE_NOT_FOUND, ${e5} == ERR_PRICE_CHANGE_FILE_NOT_FOUND"
            - "${e6} == ERR_PRICE_CHANGE_LINE_NOT_FOUND, ${e7} == ERR_LABEL_TASK_NOT_FOUND, ${e8} == ERR_SCANNER_AUDIT_NOT_FOUND, ${e9} == ERR_SCAN_LINE_NOT_FOUND, ${e10} == ERR_PROMO_SIGNAGE_NOT_FOUND"
            - "${e11} == ERR_REGULATORY_INSPECTION_NOT_FOUND, ${e12} == ERR_INSPECTION_FINDING_NOT_FOUND, ${e13} == ERR_REFUND_CLAIM_NOT_FOUND, ${e14} == ERR_EXCEPTION_REPORT_NOT_FOUND, ${e15} == ERR_ACCOUNTABILITY_ACTION_NOT_FOUND"
            - "The fifteen returned error_id values are pairwise distinct"

      - name: corner_nested_creation_under_absent_parent_is_not_found_before_body_checks
        claim_type: parent_relationships
        grounds:
          - validations.priority_30_ERR_ENTITY_NOT_FOUND
          - validations.priority_32_ERR_ENTITY_NOT_FOUND
          - endpoints.POST_/price-integrity/stores/{id}/aisles
          - endpoints.POST_/price-integrity/price-change-files/{id}/lines
        distinguishing_aspect: "Priority 30 (path params, left to right) runs before priority 32 (body FKs) and before priority 40 state checks: a nested create whose URL parent is absent AND whose body FK is absent returns the path parent's 404, never the body FK's."
        test_recipe:
          setup:
            - "One jurisdiction and one store exist, so only the ids named in the triggers are absent."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
          trigger:
            - call: "POST /price-integrity/stores/00000000-0000-0000-0000-000000000000/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY", assigned_associate_id: "00000000-0000-0000-0000-000000000000" }
              as: PricingAdmin
              captures: { err_parent: $.data.error_id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY", assigned_associate_id: "00000000-0000-0000-0000-000000000000" }
              as: PricingAdmin
              captures: { err_body: $.data.error_id }
            - call: "POST /price-integrity/price-change-files/00000000-0000-0000-0000-000000000000/lines"
              payload: { item_upc: "00000000002001", item_description: "Cheese 12oz", category_code: "DAIRY", old_retail_cents: 1199, new_retail_cents: 1000, net_content_qty: 12, net_content_uom: "OZ" }
              as: PricingAdmin
              captures: { err_file: $.data.error_id }
          assert:
            - "Absent store in the path plus absent associate in the body: HTTP 404 with ${err_parent} == ERR_STORE_NOT_FOUND (priority 30 wins over priority 32)"
            - "Valid store in the path, absent associate in the body: HTTP 404 with ${err_body} == ERR_ASSOCIATE_NOT_FOUND"
            - "Absent file in the path: HTTP 404 with ${err_file} == ERR_PRICE_CHANGE_FILE_NOT_FOUND"
            - "GET /price-integrity/stores/${store_a}/aisles returns total_count 0 — no partially linked child survived any of the three failures"

      - name: corner_immutable_scan_line_has_no_version_and_no_mutator
        claim_type: immutability
        grounds:
          - entities.ScanLine.common_fields_false
          - endpoints.GET_/price-integrity/scan-lines/{id}
          - endpoints.POST_/price-integrity/scanner-audits/{id}/scan-lines
        distinguishing_aspect: "ScanLine is declared common_fields: false, so its representation carries id and scanned_at but no version and no updated_at, and §1.5 exposes no PATCH or delete for it — a captured scan is evidence and can only be superseded by reopening the audit."
        test_recipe:
          setup:
            - "A CLOSED-eligible audit with one scan line: jurisdiction, store, aisle, certified auditor, OPEN audit."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_a1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T09:00:00Z", scan_window_end: "2026-08-01T10:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_1: $.data.id }
          trigger:
            - call: "POST /price-integrity/scanner-audits/${audit_1}/scan-lines"
              payload: { item_upc: "00000000002001", shelf_price_cents: 1000, register_price_cents: 1199 }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { sl_1: $.data.id }
            - call: "GET /price-integrity/scan-lines/${sl_1}"
              as: ComplianceOfficer
              captures: { sl_class: $.data.classification }
          assert:
            - "ScanLine.${sl_1} exposes id, scanner_audit_id, item_upc, shelf_price_cents, register_price_cents, variance_cents, classification, category_code and scanned_at"
            - "ScanLine.${sl_1} has no version field and no updated_at field (common_fields: false)"
            - "${sl_class} == OVERCHARGE and variance_cents == 199 (1199 - 1000), both computed at capture time"
            - "category_code == DAIRY, copied from the audit's aisle rather than supplied by the scanner"
            - "§1.5 declares no PATCH or DELETE whose path template is /price-integrity/scan-lines/{id} — the only write path is POST under the parent audit"

      - name: corner_flat_topology_cross_reference_integrity_is_enforced
        claim_type: foreign_key_validation
        grounds:
          - complexity_profile.entity_topology_flat
          - validations.priority_66_ERR_AISLE_STORE_MISMATCH
          - validations.priority_67_ERR_ASSOCIATE_STORE_MISMATCH
          - validations.priority_68_ERR_STORE_OUT_OF_FILE_SCOPE
        distinguishing_aspect: "With a flat topology every FK is independently resolvable, so referential existence is not enough: an aisle belonging to another store (66), an associate belonging to another store (67) and a store outside the file's scope_store_ids (68) each fail with their own id in that fixed priority order."
        test_recipe:
          setup:
            - "Two stores S001 and S002 in US-CA; aisle A01 and certified LABEL_ASSOCIATE la1 belong to S001; aisle B01 and certified la2 belong to S002; a DISTRIBUTED file scoped to S001 only, with one line."
