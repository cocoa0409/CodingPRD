- rule_id: non_linear_state_machine
  instances:
  - name: agreement_negotiation_cycles_proposed_countered_proposed
    grounds:
    - state_machines.InterconnectionAgreement.DRAFT_to_PROPOSED
    - state_machines.InterconnectionAgreement.PROPOSED_to_COUNTERED
    - state_machines.InterconnectionAgreement.COUNTERED_to_PROPOSED
    - state_machines.InterconnectionAgreement.PROPOSED_to_EXECUTED
    - calculations.negotiation_term_pinning
    - concurrency_rules[offer-create-stale-agreement]
    distinguishing_aspect: |
      The non-linearity is a genuine cycle on InterconnectionAgreement.status: PROPOSED -> COUNTERED -> PROPOSED re-enters a state it already occupied, with negotiation_round advancing 1 -> 2 -> 3 and each hop superseding the standing offer. The entity is InterconnectionAgreement, distinct from the AccessInvoice row carrying this rule's parallel-dimensions instance.
    test_recipe:
      setup:
      - A carrier and an EFFECTIVE LOCAL_RECIPROCAL_COMP tariff filing.
      - One DRAFT agreement whose opening ask is 0.061250 per MOU over 36 months and negotiation_round 0.
      - Logical clock at the 2026-08-01T00:00:00Z default.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-LOC-001
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.061250
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_loc_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_loc_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
          agreement_label: ICA-NORTHSTAR-2026
          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          transit_traffic_allowed: false
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
          agr_v0: $.data.version
      trigger:
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v0}
          offer_type: PROPOSAL
          reciprocal_rate_per_mou_usd: 0.061250
          term_months: 36
          poi_financial_responsibility: SHARED
          transit_traffic_allowed: false
        as: InterconnectionManager
        captures:
          offer1_id: $.data.id
      - call: GET /interconnection/agreements/${agr_id}
        payload: {}
        as: InterconnectionManager
        captures:
          agr_v1: $.data.version
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v1}
          offer_type: COUNTER
          reciprocal_rate_per_mou_usd: 0.085000
          term_months: 24
          poi_financial_responsibility: COUNTERPARTY_BEARS
          transit_traffic_allowed: false
        as: CarrierRepresentative
        as_user_id: ${car_id}
        captures:
          offer2_id: $.data.id
      - call: GET /interconnection/agreements/${agr_id}
        payload: {}
        as: InterconnectionManager
        captures:
          agr_v2: $.data.version
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v2}
          offer_type: COUNTER
          reciprocal_rate_per_mou_usd: 0.070000
          term_months: 30
          poi_financial_responsibility: SHARED
          transit_traffic_allowed: false
        as: InterconnectionManager
        captures:
          offer3_id: $.data.id
      - call: POST /interconnection/negotiation-offers/${offer3_id}/accept
        payload: {}
        as: CarrierRepresentative
        as_user_id: ${car_id}
      assert:
      - InterconnectionAgreement.${agr_id}.status transitioned DRAFT -> PROPOSED -> COUNTERED -> PROPOSED -> EXECUTED, so PROPOSED was occupied twice
      - InterconnectionAgreement.${agr_id}.negotiation_round == 3
      - NegotiationOffer.${offer1_id}.status == SUPERSEDED and offering_party == CLEC_SIDE and round_number == 1
      - NegotiationOffer.${offer2_id}.status == SUPERSEDED and offering_party == COUNTERPARTY_SIDE and round_number == 2
      - NegotiationOffer.${offer3_id}.status == ACCEPTED and offering_party == CLEC_SIDE and round_number == 3
      - InterconnectionAgreement.${agr_id}.reciprocal_rate_per_mou_usd == 0.070000 and term_months == 30 and poi_financial_responsibility == SHARED
      - InterconnectionAgreement.${agr_id}.proposed_reciprocal_rate_per_mou_usd is still 0.061250 and proposed_term_months is still 36
      - InterconnectionAgreement.${agr_id}.executed_at == 2026-08-01T00:00:00Z
  - name: invoice_payment_and_dispute_dimensions_move_independently
    grounds:
    - state_machines.AccessInvoice.UNPAID_to_PARTIALLY_PAID
    - state_machines.AccessInvoice.NONE_to_DISPUTED
    - state_machines.AccessInvoice.DISPUTED_to_RESOLVED
    - state_machines.BillingDispute.UNDER_REVIEW_to_RESOLVED_DENIED
    - entities.AccessInvoice.fields.dispute_status
    distinguishing_aspect: |
      The non-linearity is two parallel state dimensions on one AccessInvoice row: payment_status walks UNPAID -> PARTIALLY_PAID while dispute_status independently walks NONE -> DISPUTED -> RESOLVED, and neither move perturbs the other or the lifecycle_status, which stays ISSUED because payment_status never reaches PAID. The entity is AccessInvoice, distinct from the cyclic InterconnectionAgreement instance of this rule.
