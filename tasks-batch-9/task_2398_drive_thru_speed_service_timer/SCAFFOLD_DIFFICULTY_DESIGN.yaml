  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_over_fiscal_on_deployment_activate
        grounds:
          - validations.priority_12_ERR_INVALID_DEPLOYMENT_STATE
          - validations.priority_13_ERR_STAFF_NOT_AVAILABLE
          - validations.priority_33_ERR_LABOR_BUDGET_EXCEEDED
          - state_machines.OrderTakerDeployment.PLANNED_to_ACTIVE
          - calculations.labor_minutes_ledger
        distinguishing_aspect: |
          Three rules from three different categories are violated by one re-activation request —
          state (priority 12), cross-entity gate (priority 13) and business_fiscal (priority 33) —
          and the response must be the state error ERR_INVALID_DEPLOYMENT_STATE, proving the state
          check runs before both the staff-availability gate and the labor-budget charge.
        test_recipe:
          setup:
            - "Four VolumeTierPolicy bands; one SINGLE-lane Restaurant with labor_minutes_budget 30 (exactly one 30-minute deployment fits); one StaffMember with oot_certified true and max_consecutive_deployment_minutes 90; one ACTIVE LUNCH DaypartProfile."
            - "One OrderTakerDeployment at OOT_LANE_A for 11:00:00Z..11:30:00Z (planned_minutes 30) that has already been ACTIVATED: deployment_state ACTIVE, StaffMember.staff_state DEPLOYED, labor_minutes_committed 30, labor_minutes_available 0."
