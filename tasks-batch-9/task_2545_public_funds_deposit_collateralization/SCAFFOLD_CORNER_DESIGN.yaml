            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /public-units"
              payload: { name: "Ridge County", unit_type: "COUNTY", jurisdiction_state: "OH", statutory_max_deposit_cents: 100000000 }
              as: StateRegulator
