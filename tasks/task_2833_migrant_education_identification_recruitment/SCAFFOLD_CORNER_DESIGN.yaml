            - "every one of the twelve calls returns HTTP 404"
            - "the error_id values are, in call order, ERR_AREA_NOT_FOUND, ERR_RECRUITER_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_MOVE_NOT_FOUND, ERR_INTERVIEW_NOT_FOUND, ERR_COE_NOT_FOUND, ERR_QC_REVIEW_NOT_FOUND, ERR_TERM_NOT_FOUND, ERR_TRANSFER_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_DELIVERY_NOT_FOUND"
