- rule_id: transitive_cascade
  instances:
  - name: past_due_subscription_suspends_entitlements_and_posture_chain
    grounds:
    - state_machines.Subscription.ACTIVE_to_PAST_DUE
    - state_machines.Entitlement.ACTIVE_to_SUSPENDED
    - calculations.org_compliance_posture
    distinguishing_aspect: "Depth-3 chain triggered by a clock sweep: Subscription ACTIVE->PAST_DUE mutates each\nseat's Entitlement ACTIVE->SUSPENDED, and that suspension itself forces\nOrganization.compliance_posture\
      \ recomputation \u2014 each hop caused by the previous one.\n"
    test_recipe:
      setup:
      - Bootstrap B0/BA0; org O6 TEAM ACTIVE; admin OA6; plan P6 TEAM MONTHLY storage 20; subscription S6 1 seat ACTIVE; seat SE6 assigned to U6; device D6 for U6; entitlement EN6 ACTIVE on D6
