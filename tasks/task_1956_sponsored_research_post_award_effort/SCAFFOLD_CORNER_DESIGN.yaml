        claim_type: valid_transition
        grounds: [state_machines.ModificationRequest, entities.GrantAward.fields.nce_count]
        distinguishing_aspect: "Conditional routing on nce_count: the first NCE (6 months, nce_count 0) is grantee-approved at internal-approve (current_end_date 2026-12-31 -> 2027-06-30); the second NCE (3 months, nce_count 1) requires sponsor and only applies after sponsor-decision (end 2027-09-30)."
        test_recipe:
          setup: ["ACTIVE award N1: TRAVEL 100000 (obligated 150000), end 2026-12-31; default clock 2026-08-01 < end"]
          setup_api_calls:
            - { call: "POST /api/sponsors", payload: { name: "NSF-LOC", sponsor_type: "FEDERAL", payment_method: "LETTER_OF_CREDIT", salary_cap_annual_cents: 20000000, f_and_a_rate_bps: 5000 }, as: SponsoredProgramsOfficer, captures: { sp: $.data.id } }
