# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3087_private_label_co_brand_retail_credit_program
#
# Breadth probe over the unchanged §1.1-§1.7 surface. Corners already exercised
# by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs with no
# test_recipe. Reusable setup fragments are defined once as YAML anchors.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: partner_create_returns_every_declared_field_and_starts_active
        claim_type: Creation
        grounds:
          - entities.RetailPartner
          - endpoints.POST_/servicing/partners
        distinguishing_aspect: "A partner created with retailer_name and loyalty_program_code comes back 201 with partner_status ACTIVE, loyalty_link_enabled true, version 1 and a computed partner_portfolio_exposure_cents of 0."
        test_recipe:
          setup:
            - "Logical clock default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - &c_partner
              call: "POST /servicing/partners"
              payload: { retailer_name: "Anchorline Outfitters", loyalty_program_code: "ANCHORLINE" }
              as: ProgramAdmin
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "POST /servicing/partners"
              payload: { retailer_name: "Bellwether Home", loyalty_program_code: "BELLWETHER", loyalty_link_enabled: false }
              as: ProgramAdmin
              captures: { p2_id: "$.data.id", p2_status: "$.data.partner_status", p2_v: "$.data.version" }
          assert:
            - "the response status is 201 and response_type is object"
            - "RetailPartner.${p2_id}.partner_status == ACTIVE"
            - "RetailPartner.${p2_id}.loyalty_link_enabled == false"
            - "RetailPartner.${p2_id}.version == 1 and partner_portfolio_exposure_cents == 0"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: credit_program_get_round_trips_declared_fields
        claim_type: Retrieval
        grounds:
          - entities.CreditProgram
          - endpoints.GET_/servicing/credit-programs/{id}
        distinguishing_aspect: "The program's cycle_day round-trips exactly, supersedes_program_id reads back null for a first-generation program, and the three computed rollups read 0 on a program with no accounts."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One partner and ACTIVE agreement, one program."
          setup_api_calls:
            - *c_clock
            - &c_partner_b
              call: "POST /servicing/partners"
              payload: { retailer_name: "Coldgate Marine", loyalty_program_code: "COLDGATE" }
              as: ProgramAdmin
              captures: { p_id: "$.data.id" }
            - &c_agreement
              call: "POST /servicing/agreements"
              payload: { partner_id: "${p_id}", revenue_share_rate: 0.12, promo_subsidy_rate: 0.30, promo_term_months: 12 }
              as: ProgramAdmin
              captures: { ag_id: "$.data.id", ag_v0: "$.data.version" }
            - &c_neg
              call: "POST /servicing/agreements/${ag_id}/open-negotiation"
              payload: {}
              as: ProgramAdmin
              captures: { ag_v_neg: "$.data.version" }
            - &c_exec
              call: "POST /servicing/agreements/${ag_id}/execute"
              payload: { expected_agreement_version: "${ag_v_neg}" }
              as: ProgramAdmin
              captures: { ag_v: "$.data.version" }
            - &c_program
              call: "POST /servicing/credit-programs"
              payload: { partner_id: "${p_id}", agreement_id: "${ag_id}", cycle_day: 15 }
              as: ProgramAdmin
              captures: { g_id: "$.data.id", g_v0: "$.data.version" }
          trigger:
            - call: "GET /servicing/credit-programs/${g_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the response status is 200"
            - "CreditProgram.${g_id}.cycle_day == 15 and program_status == ACTIVE"
            - "CreditProgram.${g_id}.supersedes_program_id is null"
            - "CreditProgram.${g_id}.outstanding_receivable_cents == 0 and free_look_exposure_cents == 0 and program_profitability_cents == 0"

      - name: promo_plans_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/servicing/promo-plans
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three promo plans on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true while offset=2 returns the last row with has_more false — total_count counts the whole filtered set."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One program and account with three promo purchases."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - &c_app
              call: "POST /servicing/applications"
              payload: { program_id: "${g_id}", source_channel: "DIGITAL", requested_credit_limit_cents: 900000 }
              as: Applicant
              captures: { app_id: "$.data.id" }
            - &c_decide
              call: "POST /servicing/applications/${app_id}/decide"
              payload: {}
              as: Underwriter
            - &c_acct
              call: "GET /servicing/accounts?program_id=${g_id}"
              payload: {}
              as: ProgramAdmin
              captures: { acct_id: "$.data[0].id" }
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Ropes", amount_cents: 40000, transaction_channel: "IN_STORE", promo_requested: true, promo_term_months: 6 }
              as: Cardholder
              as_user_id: "${acct_id}"
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Fenders", amount_cents: 50000, transaction_channel: "DIGITAL", promo_requested: true, promo_term_months: 12 }
              as: Cardholder
              as_user_id: "${acct_id}"
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Anchors", amount_cents: 60000, transaction_channel: "IN_STORE", promo_requested: true, promo_term_months: 18 }
              as: Cardholder
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /servicing/promo-plans"
              payload: { program_id: "${g_id}", limit: 2, offset: 0 }
              as: ProgramAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /servicing/promo-plans?program_id=${g_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /servicing/promo-plans?program_id=${g_id} with no limit defaults to limit 10 and offset 0"
            - "GET /servicing/promo-plans?account_id=${acct_id} returns 3 rows"

      - name: account_get_with_unknown_id_returns_resource_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/servicing/accounts/{id}
          - errors.ERR_RESOURCE_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on the account path segment yields 404 ERR_RESOURCE_NOT_FOUND, not 400 and not a 409."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. No account has been created."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /servicing/accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 404 and error_id == ERR_RESOURCE_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: transaction_create_missing_required_account_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Transaction.fields.account_id
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "account_id is a required input on POST /transactions with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check rather than any 422 business error."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One program, agreement and account."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
          trigger:
            - call: "POST /servicing/transactions"
              payload: { merchant_name: "Coldgate Bumpers", amount_cents: 5000, transaction_channel: "IN_STORE" }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_CREDIT_LIMIT_EXCEEDED"
            - "GET /servicing/transactions?account_id=${acct_id} returns 0 rows"

      - name: agreement_create_omitting_optional_economics_applies_defaults
        claim_type: Defaults
        grounds:
          - entities.ProgramAgreement.fields.minimum_charge_cents
          - entities.ProgramAgreement.fields.settlement_terms_days
          - entities.ProgramAgreement.fields.purchase_right_rate
        distinguishing_aspect: "minimum_charge_cents, settlement_terms_days, dispute_grace_days, renewal_notice_days and purchase_right_rate each declare a default, so omitting them stores 29900 / 30 / 0 / 90 / 1.04 rather than null."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One partner."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
          trigger:
            - call: "POST /servicing/agreements"
              payload: { partner_id: "${p_id}", revenue_share_rate: 0.20, promo_subsidy_rate: 0.25, promo_term_months: 18 }
              as: ProgramAdmin
              captures: { ag2_id: "$.data.id" }
          assert:
            - "ProgramAgreement.${ag2_id}.minimum_charge_cents == 29900"
            - "ProgramAgreement.${ag2_id}.settlement_terms_days == 30 and dispute_grace_days == 0"
            - "ProgramAgreement.${ag2_id}.renewal_notice_days == 90 and purchase_right_rate == 1.04"
            - "ProgramAgreement.${ag2_id}.agreement_status == DRAFT"

      - name: agreement_create_ignores_client_supplied_system_fields
        claim_type: System Fields
        grounds:
          - entities.ProgramAgreement.fields.agreement_status
          - endpoints.POST_/servicing/agreements
        distinguishing_aspect: "agreement_status and version are not accepted inputs — a client-supplied agreement_status ACTIVE and version 9 are ignored and the stored row is DRAFT at version 1."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One partner."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
          trigger:
            - call: "POST /servicing/agreements"
              payload: { partner_id: "${p_id}", revenue_share_rate: 0.18, promo_subsidy_rate: 0.22, promo_term_months: 12 }
              as: ProgramAdmin
              captures: { ag3_id: "$.data.id", ag3_status: "$.data.agreement_status", ag3_v: "$.data.version" }
          assert:
            - "ProgramAgreement.${ag3_id}.agreement_status == DRAFT"
            - "ProgramAgreement.${ag3_id}.version == 1"
            - "the non-null created_at and updated_at are server-stamped and equal at creation"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: agreement_execute_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ProgramAgreement.transitions.DRAFT_to_NEGOTIATION
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "DRAFT -> ACTIVE is not in the ProgramAgreement transition table, so executing a still-drafted agreement fails ERR_INVALID_STATE rather than silently skipping the negotiation state."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One partner and one DRAFT agreement."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - call: "POST /servicing/agreements"
              payload: { partner_id: "${p_id}", revenue_share_rate: 0.12, promo_subsidy_rate: 0.30, promo_term_months: 12 }
              as: ProgramAdmin
              captures: { ag_id: "$.data.id", ag_v0: "$.data.version" }
          trigger:
            - call: "POST /servicing/agreements/${ag_id}/execute"
              payload: { expected_agreement_version: "${ag_v0}" }
              as: ProgramAdmin
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "ProgramAgreement.${ag_id}.agreement_status == DRAFT"
            - "ProgramAgreement.${ag_id}.version == 1 (the rejected transition left no side effect)"

      - name: dispute_resolve_from_open_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DisputeCase.transitions.OPEN_to_UNDER_REVIEW
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Resolving an OPEN dispute skips the mandatory review state, so it fails ERR_INVALID_STATE on a second, different state machine than the agreement case."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One program, account and posted transaction with an OPEN dispute."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Radios", amount_cents: 40000, transaction_channel: "DIGITAL", promo_requested: false }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { tx_id: "$.data.id" }
            - call: "POST /servicing/disputes"
              payload: { transaction_id: "${tx_id}", account_id: "${acct_id}", dispute_reason: "DUPLICATE_CHARGE" }
              as: CardholderService
              captures: { d_id: "$.data.id" }
          trigger:
            - call: "POST /servicing/disputes/${d_id}/resolve"
              payload: { resolution_outcome: "CARDHOLDER" }
              as: CardholderService
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "DisputeCase.${d_id}.case_status == OPEN"
            - "DisputeCase.${d_id}.chargeback_amount_cents is null (no resolution side effect fired)"

      - name: agreement_execute_replayed_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.ProgramAgreement.transitions.NEGOTIATION_to_ACTIVE
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Replaying the execute trigger after the agreement is already ACTIVE is rejected because ACTIVE has no execute edge — the second call is an invalid transition, not a duplicate success."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One partner and one ACTIVE agreement."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - call: "POST /servicing/agreements"
              payload: { partner_id: "${p_id}", revenue_share_rate: 0.12, promo_subsidy_rate: 0.30, promo_term_months: 12 }
              as: ProgramAdmin
              captures: { ag_id: "$.data.id", ag_v0: "$.data.version" }
            - call: "POST /servicing/agreements/${ag_id}/open-negotiation"
              payload: {}
              as: ProgramAdmin
              captures: { ag_v_neg: "$.data.version" }
            - call: "POST /servicing/agreements/${ag_id}/execute"
              payload: { expected_agreement_version: "${ag_v_neg}" }
              as: ProgramAdmin
              captures: { ag_v: "$.data.version" }
          trigger:
            - call: "POST /servicing/agreements/${ag_id}/execute"
              payload: { expected_agreement_version: "${ag_v}" }
              as: ProgramAdmin
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "ProgramAgreement.${ag_id}.agreement_status == ACTIVE"
            - "ProgramAgreement.${ag_id}.version == ${ag_v} (the replay did not bump the version)"

      - name: program_create_starts_active_at_version_one
        claim_type: Initial State
        grounds:
          - state_machines.CreditProgram.initial_state
          - endpoints.POST_/servicing/credit-programs
        distinguishing_aspect: "A newly issued program starts ACTIVE at version 1 with its rollups at 0, so the initial_state declaration is the state a GET observes immediately."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One partner and ACTIVE agreement."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
          trigger:
            - call: "POST /servicing/credit-programs"
              payload: { partner_id: "${p_id}", agreement_id: "${ag_id}", cycle_day: 31 }
              as: ProgramAdmin
              captures: { g2_id: "$.data.id" }
          assert:
            - "the response status is 201"
            - "CreditProgram.${g2_id}.program_status == ACTIVE"
            - "CreditProgram.${g2_id}.version == 1 and cycle_day == 31"
            - "CreditProgram.${g2_id}.outstanding_receivable_cents == 0"

      - name: closed_credit_program_is_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CreditProgram.terminal_states
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Once CLOSED, both open-renewal and close are refused — the terminal state admits no further transition and the close replay reports ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A program wound down, transferred and CLOSED."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
            - call: "POST /servicing/accounts/${acct_id}/post-payment"
              payload: { payment_amount_cents: 100 }
              as: Cardholder
              as_user_id: "${acct_id}"
            - call: "POST /servicing/credit-programs/${g_id}/open-renewal"
              payload: { expected_program_version: "${g_v0}", to_status: "WINDING_DOWN" }
              as: ProgramAdmin
              captures: { g_v1: "$.data.version" }
            - call: "POST /servicing/transfer-agreements"
              payload: { program_id: "${g_id}", buyer_role: "RETAILER" }
              as: ProgramAdmin
              captures: { t_id: "$.data.id" }
            - call: "POST /servicing/transfer-agreements/${t_id}/accept"
              payload: { accepted_by_role: "RETAILER" }
              as: ProgramAdmin
            - call: "POST /servicing/transfer-agreements/${t_id}/execute"
              payload: {}
              as: ProgramAdmin
            - call: "POST /servicing/credit-programs/${g_id}/close"
              payload: { expected_program_version: "${g_v1}" }
              as: ProgramAdmin
              captures: { g_v2: "$.data.version" }
          trigger:
            - call: "POST /servicing/credit-programs/${g_id}/open-renewal"
              payload: { expected_program_version: "${g_v2}", to_status: "RENEWAL_NEGOTIATION" }
              as: ProgramAdmin
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "CreditProgram.${g_id}.program_status == CLOSED"
            - "CreditProgram.${g_id}.version == ${g_v2}"

      - name: benefit_posting_rejected_when_partner_loyalty_link_disabled
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=17]
          - errors.ERR_LOYALTY_LINK_DISABLED
          - entities.RetailPartner.fields.loyalty_link_enabled
        distinguishing_aspect: "The partner-level loyalty_link_enabled false gates a post-posting operation, so the 422 fires from a cross-entity precondition rather than from the BenefitPosting row itself."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A partner with loyalty_link_enabled false, one program, account and transaction."
          setup_api_calls:
            - *c_clock
            - call: "POST /servicing/partners"
              payload: { retailer_name: "Dunmar Cycle", loyalty_program_code: "DUNMAR", loyalty_link_enabled: false }
              as: ProgramAdmin
              captures: { p_id: "$.data.id" }
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Dunmar Helmets", amount_cents: 40000, transaction_channel: "IN_STORE", promo_requested: false }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { tx_id: "$.data.id" }
          trigger:
            - call: "POST /servicing/benefit-postings"
              payload: { account_id: "${acct_id}", transaction_id: "${tx_id}", posting_reason: "PURCHASE_EARN", points_amount: 800, posts_to_retailer_loyalty: true }
              as: CardholderService
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_LOYALTY_LINK_DISABLED"
            - "GET /servicing/benefit-postings?transaction_id=${tx_id} returns 0 rows"
            - "Account.${acct_id}.linked_loyalty_balance == 0"

      - name: transfer_execute_before_accounts_settled_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.WindDownTransfer.transitions.AGREEMENT_REACHED_to_COMPLETED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Executing a transfer is blocked while any account on the program is still neither PAID_OFF nor TRANSFERRED, a cross-entity precondition on the transfer's own transition."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A program in WINDING_DOWN with a DELINQUENT (unsettled) account and an AGREEMENT_REACHED transfer."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
            - call: "POST /servicing/accounts/${acct_id}/balances"
              payload: { principal_balance_cents: 80000, balance_bucket: "PRINCIPAL" }
              as: ProgramAdmin
            - call: "POST /servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /servicing/credit-programs/${g_id}/open-renewal"
              payload: { expected_program_version: "${g_v0}", to_status: "WINDING_DOWN" }
              as: ProgramAdmin
              captures: { g_v1: "$.data.version" }
            - call: "POST /servicing/transfer-agreements"
              payload: { program_id: "${g_id}", buyer_role: "RETAILER" }
              as: ProgramAdmin
              captures: { t_id: "$.data.id" }
            - call: "POST /servicing/transfer-agreements/${t_id}/accept"
              payload: { accepted_by_role: "RETAILER" }
              as: ProgramAdmin
          trigger:
            - call: "POST /servicing/transfer-agreements/${t_id}/execute"
              payload: {}
              as: ProgramAdmin
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "WindDownTransfer.${t_id}.transfer_status == AGREEMENT_REACHED"
            - "Account.${acct_id}.account_status == ACTIVE (not TRANSFERRED)"

      - name: promo_expire_before_expiry_boundary_rejected
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=20]
          - errors.ERR_PROMO_NOT_EXPIRED
          - entities.PromoPlan.fields.promo_expires_at
        distinguishing_aspect: "Expiring a plan whose promo_expires_at is still in the future is rejected — the boundary is the clock reaching promo_expires_at, not merely the plan being ACTIVE."
        test_recipe:
          setup:
