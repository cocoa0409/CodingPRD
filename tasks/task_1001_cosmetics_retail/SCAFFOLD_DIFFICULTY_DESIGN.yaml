scaffold_difficulty_design:

  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_provisional_vs_final_diverge_on_short_pick
        grounds:
          - calculations.order_pricing
          - state_machines.Order.DRAFT_to_RESERVED
          - entities.Order.fields.pricing_variant
          - entities.Order.fields.gwp_eligible
        distinguishing_aspect: |
          The dual variant lives on the Order money domain: PROVISIONAL prices the REQUESTED
          quantities (subtotal 7500, gwp_eligible true) while FINAL prices the CLIPPED quantities
          after the inventory draw (subtotal 5000, gwp_eligible false, no gift line) — identical
          request payload, different cents and a different set of line rows.
        test_recipe:
          setup:
            - "Store SEP-CA ACTIVE. Product LIP (MAKEUP, SEALED, base 2500) with variant V_SALE priced 2500."
            - "Gift product GIFT (SKINCARE, SEALED, base 0) with variant V_GIFT priced 0, stocked 10 units."
            - "InventoryLot for V_SALE at SEP-CA holds only 2 units_received."
            - "ACTIVE GWP promotion with threshold_cents 7500 gifting 1 unit of V_GIFT."
            - "Customer C is INSIDER (tier discount 0%)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA", bopis_slot_capacity: 2 }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Velvet Lip", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Warm Sand", shade_code: "WS-01", finish: "MATTE", undertone: "WARM", depth_index: 6, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_sale_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Mini Serum", brand: "Aurea", category: "SKINCARE", hygiene_class: "SEALED", base_price_cents: 0 }
              as: MerchandisingAdmin
              captures: { gift_prod_id: "$.data.id"}
            - call: "POST /products/${gift_prod_id}/variants"
              payload: { shade_name: "Universal", shade_code: "UNI-00", finish: "DEWY", undertone: "NEUTRAL", depth_index: 6, price_cents: 0 }
              as: MerchandisingAdmin
              captures: { v_gift_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_sale_id}", units_received: 2 }
              as: MerchandisingAdmin
              captures: { lot_sale_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_gift_id}", units_received: 10 }
              as: MerchandisingAdmin
            - call: "POST /promotions"
              payload: { name: "GWP 75", promo_type: "GWP", threshold_cents: 7500, gift_variant_id: "${v_gift_id}", gift_quantity: 1, priority: 10, status: "ACTIVE" }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "c1@x.com", name: "C One" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", allow_partial: true, lines: [ { variant_id: "${v_sale_id}", quantity: 3 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id", prov_subtotal: "$.data.subtotal_cents", prov_gwp: "$.data.gwp_eligible"}
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
              captures: { final_subtotal: "$.data.subtotal_cents"}
          assert:
            - "${prov_subtotal} == 7500"
            - "${prov_gwp} == true"
            - "Order.${order_id}.pricing_variant == FINAL after reserve"
            - "${final_subtotal} == 5000"
            - "Order.${order_id}.gwp_eligible == false"
            - "Order.${order_id}.total_due_cents == 5000"
            - "GET /order-lines?order_id=${order_id} returns exactly 1 line (no GWP line was materialised)"
            - "InventoryLot.${lot_sale_id}.reserved_units == 2 and on_hand_units == 0"

      - name: tier_evaluation_rolling_keeps_vib_checkpoint_downgrades_to_insider
        grounds:
          - calculations.tier_evaluation
          - state_machines.Customer.VIB_to_INSIDER
          - entities.Customer.fields.qualifying_spend_cents
          - endpoints[POST /customers/{id}/tier-checkpoint]
        distinguishing_aspect: |
          The second dual variant lives on the Customer loyalty domain (not on Order money): with
          qualifying_spend_cents == 0 the ROLLING variant leaves the customer at VIB (upgrades only)
          while the CHECKPOINT variant re-derives the same number into INSIDER — same input field,
          opposite tier.
        test_recipe:
          setup:
            - "Customer C starts INSIDER with 0 qualifying spend."
            - "A 40000-cent MAKEUP/SEALED order is shipped, pushing qualifying_spend_cents to 40000 and ROLLING-upgrading C to VIB (400 EARN points)."
            - "The whole line is returned and approved, refunding 40000 and dropping qualifying_spend_cents back to 0; ROLLING refuses to downgrade, so C is still VIB."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Palette", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 40000 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Studio", shade_code: "ST-01", finish: "MATTE", undertone: "NEUTRAL", depth_index: 6, price_cents: 40000 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 5 }
              as: MerchandisingAdmin
              captures: { lot_id: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "c2@x.com", name: "C Two" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "AUTHORIZE" }
              as: StoreAssociate
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "CAPTURE" }
              as: StoreAssociate
            - call: "POST /orders/${order_id}/fulfillment"
              payload: { action: "SHIP" }
              as: StoreAssociate
            - call: "GET /order-lines"
              payload: {}
              as: StoreAssociate
              captures: { line_id: "$.data[0].id"}
            - call: "POST /return-requests"
              payload: { order_line_id: "${line_id}", quantity: 1, reason: "CHANGED_MIND" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rr_id: "$.data.id"}
            - call: "POST /return-requests/${rr_id}/decision"
              payload: { decision: "APPROVE" }
              as: StoreAssociate
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: MerchandisingAdmin
              captures: { tier_before_checkpoint: "$.data.tier", spend_before_checkpoint: "$.data.qualifying_spend_cents"}
          trigger:
            - call: "POST /customers/${cust_id}/tier-checkpoint"
              payload: {}
              as: MerchandisingAdmin
              captures: { tier_after: "$.data.tier"}
          assert:
            - "${tier_before_checkpoint} == VIB"
            - "${spend_before_checkpoint} == 0"
            - "${tier_after} == INSIDER"
            - "Customer.${cust_id}.qualifying_spend_cents == 0"
            - "Customer.${cust_id}.points_balance == 0"

  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: bundle_discount_rounded_per_line_then_summed_not_summed_then_rounded
        grounds:
          - calculations.order_pricing
          - entities.OrderLine.fields.line_discount_cents
          - entities.Promotion.fields.bundle_discount_pct
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters: three 350-cent lines at a 15% bundle
          discount give round_half_up(52.5)=53 per line (159 total, subtotal 891); rounding the
          summed 1050*0.15=157.5 once gives 158 (subtotal 892). The scaffold pins per-line-then-sum,
          so 891 is the only correct answer.
        test_recipe:
          setup:
            - "Three MAKEUP/SEALED variants each priced 350 cents, all stocked."
            - "One ACTIVE BUNDLE promotion listing all three variants at bundle_discount_pct 0.15."
            - "Customer is INSIDER (tier discount 0%), so nothing else perturbs the cents."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-NY", region_code: "NY" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Mini Trio", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 350 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Trio A", shade_code: "TA", finish: "MATTE", undertone: "WARM", depth_index: 4, price_cents: 350 }
              as: MerchandisingAdmin
              captures: { va_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Trio B", shade_code: "TB", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 350 }
              as: MerchandisingAdmin
              captures: { vb_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Trio C", shade_code: "TC", finish: "DEWY", undertone: "NEUTRAL", depth_index: 6, price_cents: 350 }
              as: MerchandisingAdmin
              captures: { vc_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${va_id}", units_received: 5 }
              as: MerchandisingAdmin
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${vb_id}", units_received: 5 }
              as: MerchandisingAdmin
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${vc_id}", units_received: 5 }
              as: MerchandisingAdmin
            - call: "POST /promotions"
              payload: { name: "Trio Bundle 15", promo_type: "BUNDLE", bundle_variant_ids: [ "${va_id}", "${vb_id}", "${vc_id}" ], bundle_discount_pct: 0.15, priority: 5, status: "ACTIVE" }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "c3@x.com", name: "C Three" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${va_id}", quantity: 1 }, { variant_id: "${vb_id}", quantity: 1 }, { variant_id: "${vc_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id", subtotal: "$.data.subtotal_cents"}
          assert:
            - "${subtotal} == 891"
            - "Order.${order_id}.subtotal_cents != 892"
            - "Order.${order_id}.tier_discount_cents == 0"
            - "Order.${order_id}.total_due_cents == 891"
            - "every OrderLine in GET /order-lines?order_id=${order_id} has line_discount_cents == 53 and line_net_cents == 297"

      - name: points_accrual_nested_floor_multiplier_bonus_and_cap
        grounds:
          - calculations.points_accrual
          - state_machines.Order.RESERVED_to_SHIPPED
          - entities.Order.fields.points_earned
        distinguishing_aspect: |
          Mode (a) — a four-input non-linear formula: floor(total_due/100) -> floor(x * tier
          multiplier 1.5) -> conditional +50 SKINCARE bonus gated on a per-line net >= 5000 -> min()
          against the 5000-point cap. For total_due 7200 the only correct result is
          floor(floor(72)*1.5)=108 plus 50 = 158; multiplying before flooring gives 158 too only by
          luck of a different path, and skipping the line-level bonus gate gives 108.
        test_recipe:
          setup:
            - "Customer is seeded at tier VIB (multiplier 1.5, tier discount 10%)."
            - "Order carries a SKINCARE line of 6000 cents (>= the 5000 bonus floor) and a MAKEUP line of 2000 cents."
            - "subtotal 8000 -> tier_discount 800 -> discounted_subtotal 7200 -> no points redeemed -> total_due 7200."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-TX", region_code: "TX" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Repair Serum", brand: "Aurea", category: "SKINCARE", hygiene_class: "SEALED", base_price_cents: 6000 }
              as: MerchandisingAdmin
              captures: { sk_prod_id: "$.data.id"}
            - call: "POST /products/${sk_prod_id}/variants"
              payload: { shade_name: "Serum 30ml", shade_code: "SR-30", finish: "DEWY", undertone: "NEUTRAL", depth_index: 6, price_cents: 6000 }
              as: MerchandisingAdmin
              captures: { v_sk_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Blush", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2000 }
              as: MerchandisingAdmin
              captures: { mk_prod_id: "$.data.id"}
            - call: "POST /products/${mk_prod_id}/variants"
              payload: { shade_name: "Peach", shade_code: "PC-01", finish: "SATIN", undertone: "WARM", depth_index: 5, price_cents: 2000 }
              as: MerchandisingAdmin
              captures: { v_mk_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_sk_id}", units_received: 5 }
              as: MerchandisingAdmin
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_mk_id}", units_received: 5 }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "c4@x.com", name: "C Four", initial_tier: "VIB" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "SHIP_FROM_STORE", lines: [ { variant_id: "${v_sk_id}", quantity: 1 }, { variant_id: "${v_mk_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "AUTHORIZE" }
              as: StoreAssociate
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "CAPTURE" }
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${order_id}/fulfillment"
              payload: { action: "SHIP" }
              as: StoreAssociate
              captures: { earned: "$.data.points_earned", total: "$.data.total_due_cents"}
          assert:
            - "${total} == 7200"
            - "${earned} == 158"
            - "Order.${order_id}.tier_discount_cents == 800"
            - "Order.${order_id}.tier_at_reserve == VIB"
            - "Customer.${cust_id}.points_balance == 158"
            - "GET /points-ledger?customer_id=${cust_id} contains exactly one EARN entry with delta_points == 158 and balance_after == 158"

  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_payment_and_fulfillment_dimensions_advance_independently
        grounds:
          - state_machines.Order.RESERVED_to_READY_FOR_PICKUP
          - state_machines.Order.UNPAID_to_AUTHORIZED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Non-linearity type: PARALLEL dimensions on the Order entity. payment_status advances
          UNPAID->AUTHORIZED without touching fulfillment_status, MARK_READY advances
          fulfillment_status to READY_FOR_PICKUP while payment stays AUTHORIZED, and HAND_OVER is
          then blocked by the OTHER dimension (ERR_PAYMENT_NOT_CAPTURED) even though the fulfilment
          dimension is in a perfectly legal from-state.
        test_recipe:
          setup:
            - "Store SEP-CA with bopis_slot_capacity 2; one 2500-cent SEALED variant stocked 5 units."
            - "A BOPIS order for 1 unit at pickup slot 2026-06-05T14:00:00Z is RESERVED and UNPAID."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA", bopis_slot_capacity: 2 }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /products"
              payload: { name: "Lipstick", brand: "Aurea", category: "MAKEUP", hygiene_class: "SEALED", base_price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { prod_id: "$.data.id"}
            - call: "POST /products/${prod_id}/variants"
              payload: { shade_name: "Rose", shade_code: "RS-01", finish: "SATIN", undertone: "COOL", depth_index: 5, price_cents: 2500 }
              as: MerchandisingAdmin
              captures: { v_id: "$.data.id"}
            - call: "POST /inventory-lots"
              payload: { store_id: "${store_id}", variant_id: "${v_id}", units_received: 5 }
              as: MerchandisingAdmin
            - call: "POST /customers"
              payload: { email: "c5@x.com", name: "C Five" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", channel: "BOPIS", pickup_slot_start: "2026-06-05T14:00:00Z", lines: [ { variant_id: "${v_id}", quantity: 1 } ] }
              as: StoreAssociate
              captures: { order_id: "$.data.id"}
            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "AUTHORIZE" }
              as: StoreAssociate
              captures: { pay_1: "$.data.payment_status", ful_1: "$.data.fulfillment_status"}
            - call: "POST /orders/${order_id}/fulfillment"
              payload: { action: "MARK_READY" }
              as: StoreAssociate
              captures: { pay_2: "$.data.payment_status", ful_2: "$.data.fulfillment_status"}
            - call: "POST /orders/${order_id}/fulfillment"
              payload: { action: "HAND_OVER" }
              as: StoreAssociate
              captures: { blocked_err: "$.data.error_id"}
          assert:
            - "${pay_1} == AUTHORIZED and ${ful_1} == RESERVED"
            - "${pay_2} == AUTHORIZED and ${ful_2} == READY_FOR_PICKUP"
            - "${blocked_err} == ERR_PAYMENT_NOT_CAPTURED (HTTP 409)"
            - "Order.${order_id}.fulfillment_status is still READY_FOR_PICKUP (the blocked hand-over changed nothing)"

      - name: booking_reschedule_cycle_returns_to_confirmed_twice
        grounds:
          - state_machines.ServiceBooking.CONFIRMED_to_RESCHEDULE_PENDING
          - state_machines.ServiceBooking.RESCHEDULE_PENDING_to_CONFIRMED
          - entities.ServiceBooking.fields.reschedule_count
        distinguishing_aspect: |
          Non-linearity type: CYCLE on the ServiceBooking entity (a different entity from Order).
          CONFIRMED -> RESCHEDULE_PENDING -> CONFIRMED traverses the same state twice, and each
          completed loop increments reschedule_count (0 -> 1 -> 2) while start_at is overwritten by
          proposed_start_at only at the confirm hop.
        test_recipe:
          setup:
            - "Store SEP-CA with artist A (skills BROW, MAKEOVER)."
            - "Customer C holds a CONFIRMED BROW booking at 2026-06-05T10:00:00Z (30 minutes)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "SEP-CA", region_code: "CA" }
              as: MerchandisingAdmin
              captures: { store_id: "$.data.id"}
            - call: "POST /artists"
              payload: { store_id: "${store_id}", name: "Ada", skills: [ "BROW", "MAKEOVER" ] }
              as: MerchandisingAdmin
              captures: { artist_id: "$.data.id"}
            - call: "POST /customers"
              payload: { email: "c6@x.com", name: "C Six" }
              as: MerchandisingAdmin
              captures: { cust_id: "$.data.id"}
            - call: "POST /service-bookings"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", artist_id: "${artist_id}", service_type: "BROW", start_at: "2026-06-05T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: "$.data.id"}
          trigger:
            - call: "POST /service-bookings/${bk_id}/reschedule"
              payload: { proposed_start_at: "2026-06-05T13:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st_1: "$.data.status"}
            - call: "POST /service-bookings/${bk_id}/confirm"
              payload: {}
              as: BeautyArtist
              as_user_id: "${artist_id}"
              captures: { st_2: "$.data.status", rc_2: "$.data.reschedule_count"}
            - call: "POST /service-bookings/${bk_id}/reschedule"
              payload: { proposed_start_at: "2026-06-05T16:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /service-bookings/${bk_id}/confirm"
              payload: {}
              as: BeautyArtist
              as_user_id: "${artist_id}"
              captures: { st_3: "$.data.status", rc_3: "$.data.reschedule_count", start_3: "$.data.start_at"}
          assert:
            - "${st_1} == RESCHEDULE_PENDING"
            - "${st_2} == CONFIRMED and ${rc_2} == 1"
            - "${st_3} == CONFIRMED and ${rc_3} == 2"
            - "${start_3} == 2026-06-05T16:00:00Z"
            - "ServiceBooking.${bk_id}.proposed_start_at is null after each confirm"

  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_reserved_order_cascades_inventory_launch_pool_points_and_balance
        grounds:
          - state_machines.Order.RESERVED_to_CANCELLED
          - calculations.launch_allocation_draw
          - entities.InventoryLot.fields.launch_reserved_units
          - entities.PointsLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /orders/{id}/cancel: (1) the order flips to CANCELLED, which
          (2) releases the InventoryLot reservation and pushes the 2 launch-pool units back into
          launch_reserved_units, which (3) restores the customer's per_customer_cap headroom, and
          separately (3') appends a REVERSAL PointsLedgerEntry, which (4) is what actually moves
          Customer.points_balance back to 500. Each hop is caused by the previous one, not by the
          cancel call directly.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-05-03T00:00:00Z so the limited variant has reached launch_status PUBLIC."
            - "Limited variant V_LTD (2500 cents, per_customer_cap 2) at SEP-CA in a lot of 5 units_received with launch_reserved_units 3."
            - "Customer C seeded with 500 points, INSIDER."
            - "Order O: 2 units of V_LTD, points_redeemed 300 -> subtotal 5000, tier_discount 0, points_value 1500, total_due 3500; RESERVED (lot: on_hand 3, reserved 2, launch_reserved 1; balance 200)."
          setup_api_calls:
