  - section: errors
    instances:
      - name: risk_delta_above_cap_blocks_the_pilot_decision
        claim_type: error_triggerable
        grounds:
          - errors.ERR_RISK_DELTA_ABOVE_CAP
          - validations.priority_28
          - calculations.lightweighting_economics
        distinguishing_aspect: |
          Dropping a 400.00 ml container from 190.00 g to 100.00 g lifts the risk index from 12.00 to the
          capped 100.00, a delta of 88.00 that blocks PILOT with 422 even though the economics are healthy
          (gross 45000.00, reserve 5814.00 at rate 0.12920, net 39186.00, rebate 7837.20).
        test_recipe:
          setup:
            - "Customer CUST-X1 with APPROVED design BD-X1 (400.00 ml, 190.00 g, wall 1.80 mm, 250.00 bpm, 8 cavities; breakage_risk_index 12.00)"
            - "LightweightingProgram LW-X1 (target 100.00 g, 1000000 units/yr, 0.5000 USD/kg) already risk-assessed"
          setup_api_calls:
            - call: "POST /glass-plant/customers"
              payload: { name: "Upsilon Filling", account_code: "CUST-X1", palletization_standard: "EURO_1200x800", complaint_ppm_threshold: 5000.00 }
              as: PlantManager
              captures: { c: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs"
              payload: { customer_id: "${c}", code: "BD-X1", color: "FLINT", capacity_ml: 400.00, nominal_weight_g: 190.00, min_wall_thickness_mm: 1.80, cavity_count: 8, target_line_speed_bpm: 250.00, container_price_usd: 0.1500, mold_owner: "CUSTOMER" }
              as: MoldEngineer
              captures: { d: "$.data.id" }
            - call: "POST /glass-plant/bottle-designs/${d}/submit"
              payload: {}
              as: MoldEngineer
            - call: "POST /glass-plant/bottle-designs/${d}/risk-signoff"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /glass-plant/bottle-designs/${d}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "GET /glass-plant/bottle-designs/${d}"
              payload: {}
              as: QualityEngineer
              captures: { dv: "$.data.version" }
            - call: "POST /glass-plant/lightweighting-programs"
              payload: { baseline_design_id: "${d}", code: "LW-X1", target_weight_g: 100.00, annual_volume_units: 1000000, resin_free_glass_price_per_kg: 0.5000, expected_design_version: "${dv}" }
              as: QualityEngineer
              captures: { p: "$.data.id" }
            - call: "POST /glass-plant/lightweighting-programs/${p}/assess-risk"
              payload: {}
              as: QualityEngineer
          trigger:
            - call: "POST /glass-plant/lightweighting-programs/${p}/customer-decision"
              payload: { decision: "PILOT" }
              as: CustomerRep
              as_user_id: "${c}"
          assert:
            - "HTTP 422 and data.error_id == ERR_RISK_DELTA_ABOVE_CAP"
            - "LightweightingProgram.${p}.status == RISK_ASSESSED and version == 2 and pilot_decided_by_user_id is null"
            - "LightweightingProgram.${p}.breakage_risk_delta == 88.00 (100.00 capped target index minus 12.00 baseline)"
            - "LightweightingProgram.${p}.gross_savings_usd == 45000.00 and savings_tier == TIER_A"
            - "LightweightingProgram.${p}.risk_reserve_usd == 5814.00, net_savings_usd == 39186.00 and customer_rebate_usd == 7837.20"
            - "the same call with decision REJECT returns 200 with status REJECTED and version 3"

      - name: program_target_weight_not_lighter_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TARGET_WEIGHT_NOT_LIGHTER
          - validations.priority_31
          - concurrency_rules.program-create-stale-design
        distinguishing_aspect: |
          The comparison is strictly less-than against the baseline 190.00 g: a 200.00 g target is a 422 that
          leaves the design at version 4, while 189.00 g is accepted and the successful create is what bumps
          the design to version 5.
        test_recipe:
          setup:
            - "Customer CUST-X2 with APPROVED design BD-X2 (500.00 ml, 190.00 g, wall 1.80 mm, 500.00 bpm, 8 cavities) at version 4"
          setup_api_calls:
