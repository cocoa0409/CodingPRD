# =============================================================================
# 1.9 Scaffold Corner Design - breadth coverage for
# task_2316 School Capacity Study & Portable Classroom Allocation
#
# Walk of references/claim-extraction-guide.md's nine sections against this
# scaffold's SS1.1-SS1.7. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# carry `excluded_because:` stubs and no test_recipe.
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  # SECTION 1 - entities
  # =========================================================================
  - section: entities
    instances:

      - name: school_create_returns_all_declared_fields
        claim_type: creation
        grounds: [entities.School, "endpoints[POST /facilities/schools]"]
        distinguishing_aspect: "A campus is created with every required input; the response must carry the input echo, the three system fields, the version counter and the three computed reliance fields at their initial values inside the fixed success envelope."
        test_recipe:
          setup: ["empty database; logical clock pinned so created_at is deterministic"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
          trigger:
            call: "POST /facilities/schools"
            payload: { name: "Northside Middle", grade_configuration: "MIDDLE_68", site_acreage: 12.5, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 60, sewer_spare_connections: 2, consecutive_reliance_years: 3 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          assert:
            - "response status is 201"
            - "response_type == \"object\" and meta.api_request_id is a non-empty string and meta.api_request_timestamp is present"
            - "data.name == \"Northside Middle\""
            - "data.grade_configuration == \"MIDDLE_68\""
            - "data.site_acreage == 12.5"
            - "data.fire_lane_clear_width_ft == 24"
            - "data.electrical_spare_capacity_kw == 60"
            - "data.sewer_spare_connections == 2"
            - "data.consecutive_reliance_years == 3"
            - "data.hosted_portable_seats == 0"
            - "data.reliance_flag == \"NONE\""
            - "data.certified_study_id == null"
            - "data.version == 1"
            - "data.id is a non-empty string and data.created_at == \"2027-03-01T00:00:00Z\" and data.updated_at == \"2027-03-01T00:00:00Z\""

      - name: room_retrieval_returns_stored_values
        claim_type: retrieval
        grounds: [entities.Room, "endpoints[GET /facilities/rooms/{id}]"]
        distinguishing_aspect: "The single-room read must return the stored area and type unchanged, not a recomputed or defaulted value; the FK to the campus is echoed."
        test_recipe:
          setup: ["one campus with one science lab room"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/schools"
              payload: { name: "Northside Middle", grade_configuration: "MIDDLE_68", site_acreage: 12.5, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 60, sewer_spare_connections: 2 }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { school_id: id }
            - call: "POST /facilities/rooms"
              payload: { school_id: "${school_id}", room_number: "S-12", room_type: "SCIENCE_LAB", area_sqft: 1000 }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { room_id: id }
          trigger:
            call: "GET /facilities/rooms/${room_id}"
            payload: {}
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          assert:
            - "response status is 200"
            - "data.id == \"${room_id}\""
            - "data.school_id == \"${school_id}\""
            - "data.room_number == \"S-12\""
            - "data.room_type == \"SCIENCE_LAB\""
            - "data.area_sqft == 1000"
            - "data.status == \"IN_SERVICE\""

      - name: portable_unit_listing_returns_pagination_envelope
        claim_type: listing
        grounds: [entities.PortableUnit, "endpoints[GET /facilities/portable-units]", response_envelope.pagination_fields]
        distinguishing_aspect: "Three units exist and the list is read with limit 2, so total_count must be 3 while only 2 rows come back and has_more is true; the second page returns the remaining row with has_more false. Defaults must be limit 10 and offset 0 when both are omitted."
        test_recipe:
          setup: ["three portable units in inventory"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/portable-units"
              payload: { asset_tag: "PU-L001", size_class: "SINGLE_24x40", condition_grade: "B", acquisition_cost_cents: 9600000, in_service_year: 2019 }
              as: AssetManager
              as_user_id: "assets-3"
            - call: "POST /facilities/portable-units"
              payload: { asset_tag: "PU-L002", size_class: "DOUBLE_28x64", condition_grade: "A", acquisition_cost_cents: 15000000, in_service_year: 2021 }
              as: AssetManager
              as_user_id: "assets-3"
            - call: "POST /facilities/portable-units"
              payload: { asset_tag: "PU-L003", size_class: "SINGLE_24x40", condition_grade: "C", acquisition_cost_cents: 9600000, in_service_year: 2009 }
              as: AssetManager
              as_user_id: "assets-3"
          trigger:
            call: "GET /facilities/portable-units"
            payload: { limit: 2, offset: 0 }
            as: AssetManager
            as_user_id: "assets-3"
          assert:
            - "response status is 200"
            - "response_type == \"array\""
            - "meta.limit == 2 and meta.offset == 0 and meta.total_count == 3 and meta.has_more == true"
            - "len(data) == 2"
            - "second page: GET /facilities/portable-units with limit 2 and offset 2 returns len(data) == 1, meta.total_count == 3 and meta.has_more == false"
            - "defaults: GET /facilities/portable-units with no query parameters returns meta.limit == 10, meta.offset == 0, meta.total_count == 3 and meta.has_more == false"
            - "filtering: GET /facilities/portable-units with size_class SINGLE_24x40 returns meta.total_count == 2"

      - name: capacity_study_get_unknown_id_returns_study_not_found
        claim_type: not_found
        grounds: ["errors[ERR_STUDY_NOT_FOUND]", "endpoints[GET /facilities/capacity-studies/{id}]", "validations[4]"]
        distinguishing_aspect: "A syntactically valid but unknown study id must return the entity-specific 404 error_id, not a generic not-found and not an empty 200 body."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
          trigger:
            call: "GET /facilities/capacity-studies/00000000-0000-4000-8000-000000000000"
            payload: {}
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          assert:
            - "response status is 404"
            - "response_type == \"error\""
            - "data.error_id == \"ERR_STUDY_NOT_FOUND\""
            - "data.message is a non-empty string"

      - name: placement_site_create_missing_pad_code_rejected
        claim_type: required_fields
        grounds: [entities.PlacementSite, "validations[6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "pad_code has source input and no default, so omitting it must fail with ERR_INVALID_REQUEST at 422 and create nothing; the optional sewer and ADA booleans may still be omitted in the accepted control."
        test_recipe:
          setup: ["one campus"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/schools"
              payload: { name: "Northside Middle", grade_configuration: "MIDDLE_68", site_acreage: 12.5, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 60, sewer_spare_connections: 2 }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { school_id: id }
          trigger:
            call: "POST /facilities/placement-sites"
            payload: { school_id: "${school_id}", pad_length_ft: 60, pad_width_ft: 34, distance_to_fire_lane_ft: 40, electrical_drop_available_kw: 20 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          assert:
            - "response status is 422"
            - "data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /facilities/placement-sites with school_id ${school_id} returns meta.total_count == 0"
            - "control: the same body plus pad_code \"PAD-A\" returns 201 with data.sewer_connection_available == false and data.ada_path_of_travel_compliant == false"

      - name: portable_unit_create_omitting_optional_fields_applies_defaults
        claim_type: defaults
        grounds: [entities.PortableUnit, "endpoints[POST /facilities/portable-units]"]
        distinguishing_aspect: "condition_grade, ada_ramp_installed and replaced_unit_id are the only optional inputs; when all three are omitted the unit must read grade B, no ramp and no predecessor, with both dimension statuses and both lifetime counters at their initial values rather than null."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
          trigger:
            call: "POST /facilities/portable-units"
            payload: { asset_tag: "PU-D999", size_class: "SINGLE_24x40", acquisition_cost_cents: 9600000, in_service_year: 2019 }
            as: AssetManager
            as_user_id: "assets-3"
          assert:
            - "response status is 201"
            - "data.condition_grade == \"B\""
            - "data.ada_ramp_installed == false"
            - "data.replaced_unit_id == null"
            - "data.condition_status == \"SERVICEABLE\""
            - "data.allocation_status == \"IN_STORAGE\""
            - "data.current_school_id == null"
            - "data.lifetime_relocation_count == 0"
            - "data.accumulated_relocation_cost_cents == 0"
            - "school-side default: POST /facilities/schools without consecutive_reliance_years returns data.consecutive_reliance_years == 0"

      - name: portable_unit_rated_seats_derived_from_size_class
        claim_type: computed_fields
        grounds: [entities.PortableUnit.rated_seats, calculations.program_capacity_seats.constants]
        distinguishing_aspect: "rated_seats has source computed and is keyed only to size_class - 24, 48 and 60 for single, double and triple wides. A client-supplied rated_seats must be ignored rather than stored, which a naive pass-through implementation would fail."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/portable-units"
              payload: { asset_tag: "PU-C201", size_class: "SINGLE_24x40", acquisition_cost_cents: 9600000, in_service_year: 2019 }
              as: AssetManager
              as_user_id: "assets-3"
              captures: { single_unit_id: id }
            - call: "POST /facilities/portable-units"
              payload: { asset_tag: "PU-C203", size_class: "TRIPLE_36x64", acquisition_cost_cents: 22000000, in_service_year: 2021 }
              as: AssetManager
              as_user_id: "assets-3"
              captures: { triple_unit_id: id }
          trigger:
            call: "POST /facilities/portable-units"
            payload: { asset_tag: "PU-C202", size_class: "DOUBLE_28x64", acquisition_cost_cents: 15000000, in_service_year: 2021, rated_seats: 999 }
            as: AssetManager
            as_user_id: "assets-3"
          assert:
            - "response status is 201"
            - "data.rated_seats == 48"
            - "GET /facilities/portable-units/${single_unit_id} returns data.rated_seats == 24"
            - "GET /facilities/portable-units/${triple_unit_id} returns data.rated_seats == 60"

      - name: room_system_fields_are_server_assigned_and_input_ignored
        claim_type: system_fields
        grounds: [entities.Room.status, response_envelope]
        distinguishing_aspect: "Room.status has source system with default IN_SERVICE and id, created_at, updated_at and version are common fields, so a create that supplies all five must have every one of them overwritten by the server."
        test_recipe:
          setup: ["one campus"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/schools"
              payload: { name: "Northside Middle", grade_configuration: "MIDDLE_68", site_acreage: 12.5, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 60, sewer_spare_connections: 2 }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { school_id: id }
          trigger:
            call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "R201", room_type: "STANDARD_CLASSROOM", area_sqft: 900, status: "DECOMMISSIONED", id: "client-supplied-id", version: 77, created_at: "2000-01-01T00:00:00Z" }
            as: DistrictAdmin
            as_user_id: "admin-1"
          assert:
            - "response status is 201"
            - "data.status == \"IN_SERVICE\""
            - "data.id != \"client-supplied-id\""
            - "data.version == 1"
            - "data.created_at == \"2027-03-01T00:00:00Z\""
            - "data.updated_at == \"2027-03-01T00:00:00Z\""

      - name: room_create_invalid_room_type_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Room.room_type, "validations[6]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "room_type is a closed enum; a plausible but undeclared member such as PORTABLE must be rejected at 422 rather than stored, and a non-positive area must be rejected by the same rule."
        test_recipe:
          setup: ["one campus"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/schools"
              payload: { name: "Northside Middle", grade_configuration: "MIDDLE_68", site_acreage: 12.5, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 60, sewer_spare_connections: 2 }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { school_id: id }
          trigger:
            call: "POST /facilities/rooms"
            payload: { school_id: "${school_id}", room_number: "R301", room_type: "PORTABLE", area_sqft: 900 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          assert:
            - "response status is 422"
            - "data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /facilities/rooms with school_id ${school_id} returns meta.total_count == 0"
            - "numeric range: the same body with room_type STANDARD_CLASSROOM and area_sqft 0 returns 422 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "grade range: POST /facilities/enrollment-projections with grade_level 13 returns 422 with data.error_id == \"ERR_INVALID_REQUEST\""

      - name: enrollment_projection_is_immutable_and_versionless
        claim_type: immutability
        grounds: [entities.EnrollmentProjection, entities.ClassSizePolicy, entities.DisposalRecord]
        distinguishing_aspect: "The three ledger-like entities carry common_fields false, so they must expose no version field and there must be no update endpoint for them anywhere in the surface; a correction is expressed by creating a superseding projection for the same grade, which the study's source filter then resolves by created_at."
        test_recipe:
          setup: ["one campus with one projection"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/schools"
              payload: { name: "Northside Middle", grade_configuration: "MIDDLE_68", site_acreage: 12.5, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 60, sewer_spare_connections: 2 }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { school_id: id }
            - call: "POST /facilities/enrollment-projections"
              payload: { school_id: "${school_id}", school_year: "2027-28", grade_level: 6, projected_students: 44, source: "COHORT_SURVIVAL", confidence_tier: "HIGH" }
              as: FacilitiesPlanner
              as_user_id: "planner-1"
              captures: { projection_id: id }
          trigger:
            call: "GET /facilities/enrollment-projections/${projection_id}"
            payload: {}
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          assert:
            - "response status is 200"
            - "data has no version field"
            - "data.projected_students == 44"
            - "no update endpoint exists: SS1.5 declares no PATCH or PUT under /facilities/enrollment-projections, /facilities/class-size-policies or /facilities/disposal-records"
            - "correction by supersession: POST /facilities/enrollment-projections for the same school_id, school_year and grade_level with projected_students 52 returns 201, and GET /facilities/enrollment-projections/${projection_id} still returns data.projected_students == 44"

      - name: room_create_with_unknown_school_returns_school_not_found
        claim_type: parent_relationships
        grounds: [entities.Room.school_id, "validations[5]", "errors[ERR_SCHOOL_NOT_FOUND]"]
        distinguishing_aspect: "The body FK is resolved before any field validation runs, so an unknown school_id combined with an otherwise valid room body must yield ERR_SCHOOL_NOT_FOUND at 404 rather than ERR_INVALID_REQUEST at 422."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
          trigger:
            call: "POST /facilities/rooms"
            payload: { school_id: "00000000-0000-4000-8000-000000000000", room_number: "R101", room_type: "STANDARD_CLASSROOM", area_sqft: 900 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          assert:
            - "response status is 404"
            - "data.error_id == \"ERR_SCHOOL_NOT_FOUND\""
            - "existence outranks field validation: the same unknown school_id with room_type PORTABLE still returns 404 with data.error_id == \"ERR_SCHOOL_NOT_FOUND\""

      - name: placement_request_body_foreign_keys_resolved_before_version_check
        claim_type: flat
        grounds: [complexity_profile.entity_topology, "validations[5]", "validations[9]", "endpoints[POST /facilities/placement-requests]"]
        distinguishing_aspect: "A placement request carries four body FKs into three different aggregates. Each unknown id must surface its own 404 error_id, and because existence sits at priority 5 while the study-version guard sits at priority 9, an unknown budget id paired with a deliberately stale expected_study_version must still return ERR_BUDGET_NOT_FOUND rather than the 412."
        test_recipe:
          setup: ["one campus with a submitted study, an assessed pad, a serviceable unit and an appropriation"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/class-size-policies"
              payload: { grade_band: "G7_8", effective_school_year: "2027-28", max_class_size: 28, min_area_sqft_per_seat: 30, lab_area_premium_sqft: 20 }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { policy_id: id }
            - call: "POST /facilities/schools"
              payload: { name: "Northside Middle", grade_configuration: "MIDDLE_68", site_acreage: 10.0, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 40, sewer_spare_connections: 1 }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { school_id: id, school_version_1: version }
            - call: "POST /facilities/rooms"
              payload: { school_id: "${school_id}", room_number: "R101", room_type: "STANDARD_CLASSROOM", area_sqft: 900 }
              as: DistrictAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/rooms"
              payload: { school_id: "${school_id}", room_number: "R102", room_type: "STANDARD_CLASSROOM", area_sqft: 900 }
              as: DistrictAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/enrollment-projections"
              payload: { school_id: "${school_id}", school_year: "2027-28", grade_level: 6, projected_students: 20, source: "COHORT_SURVIVAL", confidence_tier: "HIGH" }
              as: FacilitiesPlanner
              as_user_id: "planner-1"
            - call: "POST /facilities/enrollment-projections"
              payload: { school_id: "${school_id}", school_year: "2027-28", grade_level: 7, projected_students: 20, source: "COHORT_SURVIVAL", confidence_tier: "HIGH" }
              as: FacilitiesPlanner
              as_user_id: "planner-1"
            - call: "POST /facilities/enrollment-projections"
              payload: { school_id: "${school_id}", school_year: "2027-28", grade_level: 8, projected_students: 20, source: "COHORT_SURVIVAL", confidence_tier: "HIGH" }
              as: FacilitiesPlanner
              as_user_id: "planner-1"
            - call: "POST /facilities/capital-budgets"
              payload: { fiscal_year: "2027-28", authorized_cents: 500000000 }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { budget_id: id }
            - call: "POST /facilities/placement-sites"
              payload: { school_id: "${school_id}", pad_code: "PAD-A", pad_length_ft: 60, pad_width_ft: 34, distance_to_fire_lane_ft: 40, electrical_drop_available_kw: 20, sewer_connection_available: false, ada_path_of_travel_compliant: true }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { site_id: id }
            - call: "POST /facilities/portable-units"
              payload: { asset_tag: "PU-F101", size_class: "SINGLE_24x40", condition_grade: "B", ada_ramp_installed: true, acquisition_cost_cents: 9600000, in_service_year: 2019 }
              as: AssetManager
              as_user_id: "assets-3"
              captures: { unit_id: id }
            - call: "POST /facilities/capacity-studies"
              payload: { school_id: "${school_id}", class_size_policy_id: "${policy_id}", school_year: "2027-28", method: "DISTRICT_POLICY", expected_school_version: "${school_version_1}" }
              as: FacilitiesPlanner
              as_user_id: "planner-1"
              captures: { study_id: id }
            - call: "POST /facilities/capacity-studies/${study_id}/submit"
              payload: {}
              as: FacilitiesPlanner
              as_user_id: "planner-1"
              captures: { study_version: version }
          trigger:
            call: "POST /facilities/placement-requests"
            payload: { capacity_study_id: "${study_id}", placement_site_id: "${site_id}", capital_budget_id: "00000000-0000-4000-8000-000000000000", requested_window_start: "2027-06-15", requested_window_end: "2027-06-25", haul_miles: 10, portable_unit_id: "${unit_id}", expected_study_version: 999 }
            as: FacilitiesPlanner
            as_user_id: "planner-1"
          assert:
            - "response status is 404"
            - "data.error_id == \"ERR_BUDGET_NOT_FOUND\""
            - "GET /facilities/placement-requests with capacity_study_id ${study_id} returns meta.total_count == 0"
            - "GET /facilities/portable-units/${unit_id} returns data.allocation_status == \"IN_STORAGE\" - the rejected create reserved nothing"
            - "each FK reports its own code: an unknown placement_site_id returns 404 ERR_SITE_NOT_FOUND, an unknown capacity_study_id returns 404 ERR_STUDY_NOT_FOUND and an unknown portable_unit_id returns 404 ERR_UNIT_NOT_FOUND"
