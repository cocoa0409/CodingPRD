              captures: { err: $.data.error_id }
          assert:
            - "Response 401 with data.error_id == ERR_UNAUTHENTICATED (X-User-Role 'Anonymous' is not a declared role)"

  # ===========================================================================
  # Section: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_period_version_on_meter_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[meter-stale-period]
          - errors[ERR_STALE_PERIOD_VERSION]
          - endpoints.POST./periods/{id}/meter
        distinguishing_aspect: "Two sequential meter writes: first succeeds and bumps BillingPeriod.version; the second carrying the pre-bump version (captured then decremented) → 412 ERR_STALE_PERIOD_VERSION."
        test_recipe:
          setup:
            - "An OPEN period whose first meter write has already advanced its version."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P32", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /periods"
              payload: { project_id: "${proj_id}", period_month: "2027-02", forecast_production_kwh: 1000 }
              as: GridOperator
              captures: { per_id: $.data.id, per_ver: $.data.version }
            - call: "POST /periods/${per_id}/meter"
              payload: { metered_production_kwh: 1000, expected_period_version: "${per_ver}" }
              as: GridOperator
              captures: { per_ver2: $.data.version }
          trigger:
            - call: "POST /periods/${per_id}/meter"
              payload: { metered_production_kwh: 1100, expected_period_version: "${per_ver2} - 1" }
              as: GridOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response 412 with data.error_id == ERR_STALE_PERIOD_VERSION (stale version rejected)"

      - name: occ_version_increments_on_each_write
        claim_type: optimistic_concurrency
        grounds:
          - entities.SolarProject.fields.version
          - endpoints.POST./projects/{id}/carve-out-adjustments
        distinguishing_aspect: "SolarProject.version starts at 1 and increments by 1 after a carve-out adjustment (a version-bumping write)."
        test_recipe:
          setup:
            - "A freshly created project (version 1)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P33", state_code: "NY", nameplate_capacity_kw: 100, carve_out_pct: 0.40, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/carve-out-adjustments"
              payload: { new_carve_out_pct: 0.50, reason: "expand" }
              as: ProgramAdmin
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: GridOperator
              captures: { v2: $.data.version }
          assert:
            - "SolarProject.version == 1 at creation and == 2 after the carve-out adjustment"

      - name: occ_stale_project_version_on_transfer_corner
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[transfer-stale-project]
        excluded_because:
          difficulty_instance: compensating_invariant / transfer_conserves_project_committed_kw
          rationale: "The transfer endpoint's OCC on SolarProject.version is exercised (with a fresh captured version) by the named §1.8 instance; the stale-version negative path mirrors occ_stale_period_version_on_meter_returns_412."

      - name: derived_field_committed_kw_reconciles_after_activate_and_cancel
        claim_type: derived_field_reconciliation
        grounds:
          - entities.SolarProject.fields.committed_kw
          - entities.SolarProject.fields.available_kw
          - state_machines.Enrollment.APPROVED_to_ACTIVATED
          - state_machines.Subscription.ACTIVE_to_CANCELLED
        distinguishing_aspect: "committed_kw is 5 after activating a share-5 enrollment, then 0 after cancelling that subscription; available_kw mirrors it (95 then 100)."
        test_recipe:
          setup:
            - "An ACTIVE share-5.0 subscription on a nameplate-100 project."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P34", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Df Sub", utility_account_no: "ACC-C30", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { subscription_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: GridOperator
              captures: { committed_after_activate: $.data.committed_kw }
          trigger:
            - call: "POST /subscriptions/${subscription_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: GridOperator
              captures: { committed_after_cancel: $.data.committed_kw, avail_after_cancel: $.data.available_kw }
          assert:
            - "SolarProject.committed_kw == 5 after activation"
            - "SolarProject.committed_kw == 0 and available_kw == 100 after cancellation"

      - name: cascade_reconcile_depth3_corner
        claim_type: cascading_side_effects
        grounds:
          - state_machines.BillingPeriod.METERED_to_RECONCILED
        excluded_because:
          difficulty_instance: transitive_cascade / reconcile_period_to_allocation_to_reconciliation_to_rec_depth3
          rationale: "The depth-3 reconcile cascade (allocation→reconciliation→REC) is asserted end-to-end by the named §1.8 instance."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: activate_response_immediately_reflects_committed_capacity
        claim_type: immediate
        grounds:
          - entities.SolarProject.fields.committed_kw
          - state_machines.Enrollment.APPROVED_to_ACTIVATED
        distinguishing_aspect: "Per the immediate consistency model, a GET on the project right after activate (same client, next request) already shows committed_kw 5 — no asynchronous lag."
        test_recipe:
          setup:
            - "An APPROVED share-5.0 enrollment on a nameplate-100 project."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P35", state_code: "NY", nameplate_capacity_kw: 100, credit_rate_cents_per_kwh: 10 }
              as: GridOperator
              captures: { proj_id: $.data.id }
            - call: "POST /subscribers"
              payload: { full_name: "Imm Sub", utility_account_no: "ACC-C31", state_code: "NY", annual_usage_kwh: 1000000 }
              as: ProgramAdmin
              captures: { sub_id: $.data.id }
            - call: "POST /enrollments"
              payload: { project_id: "${proj_id}", subscriber_id: "${sub_id}", requested_share_kw: 5.0 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /enrollments/${enr_id}/approve"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: GridOperator
              captures: { committed: $.data.committed_kw }
          assert:
            - "SolarProject.committed_kw == 5 on the very next GET (immediate consistency, no lag)"
