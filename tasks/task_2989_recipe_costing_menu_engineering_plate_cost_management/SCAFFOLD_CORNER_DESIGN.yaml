      - name: proposal_revision_loop_termination
        claim_type: cyclic
        grounds:
          - state_machines[PriceChangeProposal] SUBMITTED -> REVISION_REQUESTED -> SUBMITTED
          - constants.MAX_REVISION_ROUNDS
        excluded_because:
          difficulty_instance: proposal_revision_cycle_terminates_at_two_rounds
          rationale: "The bounded revision cycle, the round counter and the terminating fourth call are the whole subject of that §1.8 instance, which walks all three laps and the post-REJECTED rejection."
      - name: spec_change_order_two_independent_state_dimensions
        claim_type: parallel
        grounds:
          - state_machines[SpecChangeOrder].approval_status
          - state_machines[SpecChangeOrder].propagation_status
        excluded_because:
          difficulty_instance: spec_change_order_approval_and_propagation_dimensions_advance_independently
          rationale: "That instance drives both axes in both orders and asserts the FULLY_PROPAGATED join plus the rollback's reset of the propagation axis alone."
      - name: price_feed_publication_cascades_down_five_levels
        claim_type: cascade_down
        grounds:
          - state_machines[PriceFeed] HOP 1..HOP 5
        excluded_because:
          difficulty_instance: price_feed_publication_five_hop_invalidation_from_ingredient_to_margin_class
          rationale: "The full ingredient-to-margin_class chain, its per-hop counters and its ordering sensitivity are asserted hop by hop there; this section keeps only the conditional-cascade counter-case where the chain stops at an already-STALE recipe."
      - name: spec_change_rollback_reverses_every_side_effect
        claim_type: compensation
        grounds:
          - state_machines[SpecChangeOrder] APPROVED -> ROLLED_BACK
        excluded_because:
          difficulty_instance: spec_change_rollback_restores_the_batch_cost_identity_exactly
          rationale: "That instance replays approve, an intervening roll-up and the rollback, and asserts the restored snapshots, the momentarily broken batch-cost identity and the STALE marker that is its only trace."
      - name: menu_item_activation_is_guarded_by_the_recipe_status
        claim_type: guarded_transitions
        grounds:
          - state_machines[MenuItem] DRAFT -> ACTIVE
          - errors[ERR_RECIPE_INVALID_STATE]
        excluded_because:
          difficulty_instance: menu_item_activation_requires_backing_recipe_active
          rationale: "The cross-entity guard on menu-item activation, including the DRAFT and RETIRED arms of the backing recipe, is exactly that instance's subject."

  - section: calculations
    instances:
      - name: plate_cost_applies_the_regional_uplift_and_waste_factor_sequentially
        claim_type: constants_applied
        grounds:
          - calculations.plate_cost_and_food_cost
          - constants.REGION_FREIGHT_UPLIFT_BPS
          - constants.PLATE_WASTE_BPS
        distinguishing_aspect: "Two menu items on ONE recipe differ only by region: MW (uplift 0) reports plate_cost_micros 1004259 and NE (uplift 600) reports 1064515. Collapsing the uplift and the waste factor into a single 10800-bps multiplier would report 1063333 for NE — a difference invisible in cents (both round to 106) and only detectable in micros, which is why the micro figure is asserted."
        test_recipe:
          setup:
            - "GRILL WORLD's recipe rolled up to portion_cost_micros 970018 and left in DRAFT (plate-cost recomputation is deliberately not gated on either status), with two DRAFT menu items on it at current_price_cents 400: MI-GRILL-MW in region MW and MI-GRILL-NE in region NE."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { portion: $.data.portion_cost_micros }
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-MW", name: "Grilled Cheese MW", recipe_id: "${grill_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_mw: $.data.id }
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-NE", name: "Grilled Cheese NE", recipe_id: "${grill_id}", region_code: "NE", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_ne: $.data.id }
          trigger:
            - call: "POST /culinary/menu-items/${mi_mw}/plate-cost"
              as: CostAnalyst
              captures: { mw_micros: $.data.plate_cost_micros, mw_cents: $.data.plate_cost_cents, mw_fc: $.data.food_cost_bps, mw_cm: $.data.contribution_margin_cents, mw_state: $.data.plate_cost_state, mw_basis: $.data.cost_basis, mw_mask: $.data.allergen_mask, mw_sod: $.data.sodium_mcg_per_portion, mw_class: $.data.margin_class }
            - call: "POST /culinary/menu-items/${mi_ne}/plate-cost"
              as: CostAnalyst
              captures: { ne_micros: $.data.plate_cost_micros, ne_cents: $.data.plate_cost_cents, ne_fc: $.data.food_cost_bps, ne_cm: $.data.contribution_margin_cents }
          assert:
            - "${portion} == 970018"
            - "${mw_micros} == 1004259: s1 == 970018 (uplift 0), s2 == round_half_up(970018*10200/10000) == 989418, garnish == max(8000, 14841) == 14841"
            - "${mw_cents} == 100 == round_half_up(1004259/10000), ${mw_fc} == 2500 and ${mw_cm} == 300"
            - "${ne_micros} == 1064515: s1 == 1028219, s2 == 1048783, garnish == 15732 — NOT 1063333, which is what a single 10800-bps multiplier produces"
            - "${ne_cents} == 106, ${ne_fc} == 2650 == round_half_up(106*10000/400) and ${ne_cm} == 294"
            - "${mw_state} == FRESH, ${mw_basis} == LATEST_PUBLISHED, ${mw_mask} == 1 and ${mw_sod} == 620000 — copied from the recipe by this calculation"
            - "${mw_class} == UNCLASSIFIED — plate costing never classifies, and both items are still DRAFT"

      - name: plate_cost_garnish_allowance_is_clamped_by_the_floor_on_a_cheap_portion
        claim_type: precision
        grounds:
          - calculations.plate_cost_and_food_cost
          - constants.GARNISH_FLOOR_MICROS
          - constants.GARNISH_BPS
        distinguishing_aspect: "The garnish term is max(GARNISH_FLOOR_MICROS, proportional): on a 100000-micro portion the proportional term is only 1530, so the floor of 8000 applies and plate_cost_micros is 110000 for a reported 11 cents. Using the proportional term unclamped gives 103530, which rounds to 10 cents — the clamp is visible in the cents figure, so the plate cost is provably non-linear in the portion cost."
        test_recipe:
          setup:
            - "SALT-KOSHER at pack_base_units 1000 and pack_cost_micros 1000000 in MW (so one base unit costs exactly 1000 micros), and SIDE-SALT (PLATED, EACH, batch_yield 1, portions_per_batch 1) with a single SALT component at ep 100 -> ap 100, extended 100000, batch 100000, portion 100000. MenuItem MI-SALT-MW in MW at current_price_cents 400."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "SALT-KOSHER", name: "Kosher Salt", base_uom: "GRAM", pack_base_units: 1000, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 0, kcal_per_base_unit_micros: 0, sodium_mcg_per_base_unit: 390 }
              as: RecipeDeveloper
              captures: { salt_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${salt_id}", pack_cost_micros: 1000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "SIDE-SALT", name: "Salted Side", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 1, portions_per_batch: 1 }
              as: RecipeDeveloper
              captures: { salt_rec: $.data.id, salt_v0: $.data.version }
            - call: "POST /culinary/recipes/${salt_rec}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${salt_id}", ep_quantity_base_units: 100, sequence_no: 1, expected_recipe_version: "${salt_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${salt_rec}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { batch: $.data.batch_cost_micros, portion: $.data.portion_cost_micros }
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-SALT-MW", name: "Salted Side", recipe_id: "${salt_rec}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 0 }
              as: RecipeDeveloper
              captures: { mi_salt: $.data.id }
          trigger:
            - call: "POST /culinary/menu-items/${mi_salt}/plate-cost"
              as: CostAnalyst
              captures: { micros: $.data.plate_cost_micros, cents: $.data.plate_cost_cents, fc: $.data.food_cost_bps, cm: $.data.contribution_margin_cents, sod: $.data.sodium_mcg_per_portion }
          assert:
            - "${batch} == 100000 and ${portion} == 100000"
            - "${micros} == 110000: s1 == 100000, s2 == 102000, proportional garnish == round_half_up(102000*150/10000) == 1530, clamped up to GARNISH_FLOOR_MICROS 8000"
            - "${cents} == 11 == round_half_up(110000/10000) — the unclamped 103530 would report 10, so the clamp changes the published figure"
            - "${fc} == 275 == round_half_up(11*10000/400) and ${cm} == 389"
            - "${sod} == 39000 — copied from the recipe alongside the plate cost"
            - "for contrast, GRILL WORLD's 970018-micro portion in the same region takes the proportional arm (14841 > 8000), so the two items exercise both sides of the clamp"

      - name: count_sheet_expected_usage_reaches_fixed_point_through_the_sub_recipe_graph
        claim_type: correct_result
        grounds:
          - calculations.count_sheet_expected_usage
          - complexity_profile.complexity_layers
          - endpoints[POST /culinary/menu-period-reviews/{period_review_id}/count-lines]
        distinguishing_aspect: "The expected usage of PEANUT-OIL is non-zero even though the plated recipe never references the oil: the propagation walks 100 sold portions -> the parent's ACTIVE component set -> the SUB-SAUCE child's own component set, giving 5000000 micros of oil per portion and expected_base_units 500, while CHEDDAR (referenced directly) gives 80000000 micros per portion and 8000. The two divisors are different (the child's batch yield and the parent's portion count) and both must be applied."
        test_recipe:
          setup:
            - "One Unit STORE-001 (MW). CHEDDAR-BLOCK at 22000000 and PEANUT-OIL (pack_base_units 946, allergen_mask 8, kcal 8000000, sodium 0) at 12000000, both PUBLISHED in MW on one feed."
            - "SUB-SAUCE (SUB_RECIPE, GRAM, batch_yield 2000, portions 20) with PEANUT-OIL at ep 100 -> batch round_half_up(100*12000000/946) == 1268499, ACTIVE."
            - "PLATE-CHEESE (PLATED, EACH, batch_yield 5, portions 5) with CHEDDAR at ep 400 and SUB-SAUCE at ep 500 -> cheddar extended 3880071, sub-recipe extended round_half_up(500*1268499/2000) == 317125, batch 4197196, portion 839439, allergen_mask 9, depth 1; ACTIVE."
            - "MI-CHEESE-MW (MW, price 400, declared_allergen_mask 9) plate-costed to 87 cents and ACTIVE; one OPEN SALES_MIX_BASED review on STORE-001 for [2026-07-01, 2026-08-01) carrying a single mix line of 100 units at 40000 cents."
