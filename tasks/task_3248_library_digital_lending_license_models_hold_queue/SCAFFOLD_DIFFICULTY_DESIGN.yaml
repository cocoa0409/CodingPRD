            - call: "POST /lending/acquisition-orders"
              payload: { library_id: "${lib2_id}", budget_fund_id: "${fund2_id}", title_id: "${titlem_id}", model: "METERED_TIME", expected_budget_fund_version: "${fund2_v}" }
              as: LibraryAdmin
              as_user_id: "${lib2_id}"
              captures: { orderm_id: $.data.id }
            - call: "POST /lending/acquisition-orders/${orderm_id}/propose"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib2_id}"
            - call: "POST /lending/acquisition-orders/${orderm_id}/approve"
