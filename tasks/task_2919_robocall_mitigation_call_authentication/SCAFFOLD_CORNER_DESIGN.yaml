              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "2025551401", ownership_evidence: "DIRECT_ALLOCATION", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect: { status: 422, error_id: ERR_INVALID_NUMBER_FORMAT }
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "+12025551401", ownership_evidence: "DIRECT_ALLOCATION", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect: { status: 422, error_id: ERR_INVALID_INTERVAL }
            - call: "POST /rmd/certificates"
              payload: { provider_id: "${prov_id}", spc_token: "SPC-2201", public_key_fingerprint: "fp-2201", not_before: "2026-09-01T00:00:00Z", not_after: "2026-09-01T00:00:00Z" }
              as: PolicyAdministrator
