              payload: {}
              as: BusinessOwner
              as_user_id: "bo-1"
          trigger:
            - call: "POST /privacy/assessments/${pia}/approve"
              payload: {}
              as: LegalCounsel
              as_user_id: "bo-1"
              captures: { err: $.data.error_id }
            - call: "POST /privacy/assessments/${pia}/approve"
