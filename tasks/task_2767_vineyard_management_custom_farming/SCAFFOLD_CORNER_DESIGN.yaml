            - call: "POST /farming-plans"
              payload: { block_id: "${b1_id}", plan_year: 2026, quality_target: "STANDARD", pruning_budget_per_acre: 300.00, canopy_budget_per_acre: 200.00, irrigation_budget_per_acre: 150.00, pest_budget_per_acre: 200.00, seasonal_water_cap_inches: 12.000 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { dup_error: $.data.error_id }
            - call: "POST /farming-plans"
              payload: { block_id: "${b1_id}", plan_year: 2027, quality_target: "STANDARD", pruning_budget_per_acre: 300.00, canopy_budget_per_acre: 200.00, irrigation_budget_per_acre: 150.00, pest_budget_per_acre: 200.00, seasonal_water_cap_inches: 12.000 }
