    side_effects: []
  - method: GET
    path: "/shop/skus/{id}"
    description: "Read a Sku, including computed reserved units."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: Sku
    side_effects: ["run calc sku_available_units for the response"]
  - method: GET
    path: "/shop/skus"
    description: "List Skus (paginated, filterable by category)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: Sku[]
    side_effects: []
  - method: POST
    path: "/shop/skus/{id}/restock"
    description: "Add units to a Sku's on_hand."
    roles: [ShopManager]
    code: 200
    input: ["units"]
    output: Sku
    side_effects: ["increase Sku.on_hand by units", "increment Sku.version by 1", "run calc sku_available_units"]
  - method: GET
    path: "/shop/skus/{id}/reservations"
    description: "List Reservations drawing on this Sku (reverse-reachability for Reservation.sku_id)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["status?"]
    output: Reservation[]
    side_effects: []
  - method: GET
    path: "/shop/skus/{id}/recalls"
    description: "List RecallNotices on this Sku (reverse-reachability for RecallNotice.sku_id)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: RecallNotice[]
    side_effects: []

  # ---- TuneUpTier ----
  - method: POST
    path: "/shop/tune-up-tiers"
    description: "Create a tune-up tier."
    roles: [ShopManager]
    code: 201
    input: ["code", "base_labor_cents", "turnaround_hours", "rush_multiplier_bps?"]
    output: TuneUpTier
    side_effects: []
  - method: GET
    path: "/shop/tune-up-tiers/{id}"
    description: "Read a tune-up tier."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: TuneUpTier
    side_effects: []
  - method: GET
    path: "/shop/tune-up-tiers"
    description: "List tune-up tiers."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: TuneUpTier[]
    side_effects: []

  # ---- ServiceTicket ----
  - method: POST
    path: "/shop/service-tickets"
    description: "Open a service ticket (status INTAKE)."
    roles: [ServiceAdvisor]
    code: 201
    input: ["customer_id", "tier_id", "is_rush?", "warranty_claim_id?"]
    output: ServiceTicket
    side_effects: []
  - method: GET
    path: "/shop/service-tickets/{id}"
    description: "Read a service ticket."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []
  - method: GET
    path: "/shop/service-tickets"
    description: "List service tickets (filterable by customer_id, tier_id, warranty_claim_id)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["customer_id?", "tier_id?", "warranty_claim_id?", "limit?", "offset?"]
    output: ServiceTicket[]
    side_effects: []
  - method: POST
    path: "/shop/service-tickets/{id}/quote"
    description: "Quote the ticket (INTAKE -> AWAITING_APPROVAL); computes labor and promised_ready_at."
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["run calc ticket_quote", "increment ServiceTicket.version by 1"]
  - method: POST
    path: "/shop/service-tickets/{id}/approve"
    description: "Customer approves the quote (AWAITING_APPROVAL -> IN_PROGRESS)."
    roles: [Customer]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["increment ServiceTicket.version by 1"]
  - method: POST
    path: "/shop/service-tickets/{id}/complete"
    description: "Mark work complete (IN_PROGRESS -> READY_FOR_PICKUP)."
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["increment ServiceTicket.version by 1"]
  - method: POST
    path: "/shop/service-tickets/{id}/close"
    description: "Close at pickup (READY_FOR_PICKUP -> CLOSED); resolves a linked APPROVED_REPAIR warranty claim."
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["if warranty_claim_id set: WarrantyClaim APPROVED_REPAIR -> RESOLVED (cross-entity cascade)", "increment ServiceTicket.version by 1"]
  - method: POST
    path: "/shop/service-tickets/{id}/cancel"
    description: "Cancel a non-started ticket (INTAKE/AWAITING_APPROVAL -> CANCELLED)."
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["increment ServiceTicket.version by 1"]

  # ---- LaborLine ----
  - method: POST
    path: "/shop/labor-lines"
    description: "Add a labor line to a ticket. If ticket is IN_PROGRESS this sets added_after_approval=true and cycles the ticket back to AWAITING_APPROVAL."
    roles: [ServiceAdvisor]
    code: 201
    input: ["ticket_id", "menu_code", "labor_cents"]
    output: LaborLine
    side_effects: ["if ticket IN_PROGRESS: set added_after_approval=true, ticket IN_PROGRESS -> AWAITING_APPROVAL, increment ticket.revision_count", "run calc ticket_quote", "increment ServiceTicket.version by 1"]
  - method: GET
    path: "/shop/labor-lines/{id}"
    description: "Read a labor line."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: []
    output: LaborLine
    side_effects: []
  - method: GET
    path: "/shop/labor-lines"
    description: "List labor lines (reverse-reachability for LaborLine.ticket_id via ticket_id filter)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["ticket_id?", "limit?", "offset?"]
    output: LaborLine[]
    side_effects: []

  # ---- ServiceBay ----
  - method: POST
    path: "/shop/service-bays"
    description: "Create a service bay."
    roles: [ShopManager]
    code: 201
    input: ["name", "is_active?"]
    output: ServiceBay
    side_effects: []
  - method: GET
    path: "/shop/service-bays/{id}"
    description: "Read a service bay."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: []
    output: ServiceBay
    side_effects: []
  - method: GET
    path: "/shop/service-bays"
    description: "List service bays."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceBay[]
    side_effects: []
  - method: GET
    path: "/shop/service-bays/{id}/bookings"
    description: "List bookings on a bay (reverse-reachability for BayBooking.bay_id)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["status?"]
    output: BayBooking[]
    side_effects: []

  # ---- BayBooking ----
  - method: POST
    path: "/shop/bay-bookings"
    description: "Book a bay for a ticket over a half-open [start_at, end_at) interval. Rejected on overlap with another BOOKED interval on the same bay."
    roles: [ServiceAdvisor]
    code: 201
    input: ["bay_id", "ticket_id", "start_at", "end_at"]
    output: BayBooking
    side_effects: []
  - method: GET
    path: "/shop/bay-bookings/{id}"
    description: "Read a bay booking."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: []
    output: BayBooking
    side_effects: []
  - method: GET
    path: "/shop/bay-bookings"
    description: "List bay bookings (reverse-reachability for BayBooking.bay_id and .ticket_id via filters)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["bay_id?", "ticket_id?", "status?", "limit?", "offset?"]
    output: BayBooking[]
    side_effects: []
  - method: POST
    path: "/shop/bay-bookings/{id}/release"
    description: "Release a booking (BOOKED -> RELEASED), freeing the interval for re-booking."
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: BayBooking
    side_effects: ["set status=RELEASED", "increment BayBooking.version by 1"]

  # ---- SalesOrder ----
  - method: POST
    path: "/shop/sales-orders"
    description: "Create an empty sales order (PENDING|UNPAID)."
    roles: [SalesAssociate, ShopManager]
    code: 201
    input: ["customer_id"]
    output: SalesOrder
    side_effects: []
  - method: GET
    path: "/shop/sales-orders/{id}"
    description: "Read a sales order with both status axes and computed totals."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["run calc order_total for the response"]
  - method: GET
    path: "/shop/sales-orders"
    description: "List sales orders (filterable by customer_id)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: SalesOrder[]
    side_effects: []
  - method: POST
    path: "/shop/sales-orders/{id}/reserve"
    description: "Reserve stock for all lines (PENDING -> RESERVED). OCC on the order's primary Sku."
    roles: [SalesAssociate, ShopManager]
    code: 200
    input: ["expected_sku_version"]
    output: SalesOrder
    side_effects: ["create ACTIVE Reservation per OrderLine", "run calc sku_available_units (Sku.reserved += qty)", "increment Sku.version by 1", "increment SalesOrder.version by 1"]
  - method: POST
    path: "/shop/sales-orders/{id}/deliver"
    description: "Deliver the order (RESERVED -> DELIVERED); applies store credit, requires PAID."
    roles: [SalesAssociate, ShopManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["run calc apply_store_credit", "commit reservations (Sku.on_hand and Sku.reserved decremented)", "run calc order_total", "increment SalesOrder.version by 1"]
  - method: POST
    path: "/shop/sales-orders/{id}/cancel"
    description: "Cancel the order (PENDING/RESERVED -> CANCELLED); releases reservations and refunds/compensates."
    roles: [SalesAssociate, ShopManager]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["release reservations (Sku.reserved -= qty)", "if paid: payment_status=REFUNDED, void Payments, restore store credit", "increment SalesOrder.version by 1"]

  # ---- OrderLine ----
  - method: POST
    path: "/shop/order-lines"
    description: "Add a line to a PENDING sales order; snapshots unit_price_cents from the Sku."
    roles: [SalesAssociate, ShopManager]
    code: 201
    input: ["order_id", "sku_id", "qty"]
    output: OrderLine
    side_effects: ["snapshot unit_price_cents = Sku.list_price_cents", "run calc order_total"]
  - method: GET
    path: "/shop/order-lines/{id}"
    description: "Read an order line."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: GET
    path: "/shop/order-lines"
    description: "List order lines (reverse-reachability for OrderLine.order_id and .sku_id via filters)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["order_id?", "sku_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  # ---- Reservation (read-only externally; created via holder transitions) ----
  - method: GET
    path: "/shop/reservations/{id}"
    description: "Read a reservation."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  - method: GET
    path: "/shop/reservations"
    description: "List reservations (reverse-reachability for Reservation.sku_id via sku_id filter; filterable by holder)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["sku_id?", "holder_type?", "holder_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  # ---- LayawayPlan ----
  - method: POST
    path: "/shop/layaway-plans"
    description: "Open a layaway plan; reserves one+ units immediately. OCC on the Sku."
    roles: [SalesAssociate, ShopManager]
    code: 201
    input: ["customer_id", "sku_id", "qty?", "expected_sku_version"]
    output: LayawayPlan
    side_effects: ["snapshot price_cents = Sku.list_price_cents * qty", "create ACTIVE Reservation (holder_type=LAYAWAY_PLAN)", "run calc sku_available_units (Sku.reserved += qty)", "increment Sku.version by 1"]
  - method: GET
    path: "/shop/layaway-plans/{id}"
    description: "Read a layaway plan."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: LayawayPlan
    side_effects: []
  - method: GET
    path: "/shop/layaway-plans"
    description: "List layaway plans (filterable by customer_id, sku_id)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["customer_id?", "sku_id?", "limit?", "offset?"]
    output: LayawayPlan[]
    side_effects: []
  - method: POST
    path: "/shop/layaway-plans/{id}/fulfill"
    description: "Fulfill a fully-paid plan (ACTIVE -> FULFILLED); commits the reservation."
    roles: [SalesAssociate, ShopManager]
    code: 200
    input: []
    output: LayawayPlan
    side_effects: ["commit reservation (Sku.on_hand and Sku.reserved decremented)", "increment LayawayPlan.version by 1"]
  - method: POST
    path: "/shop/layaway-plans/{id}/forfeit"
    description: "Forfeit a plan (ACTIVE -> FORFEITED); releases reservation, withholds restocking fee, credits refund to store credit."
    roles: [ShopManager]
    code: 200
    input: []
    output: LayawayPlan
    side_effects: ["release reservation (Sku.reserved -= qty)", "run calc layaway_settlement (forfeit variant)", "credit refund_cents to Customer.store_credit_cents", "increment LayawayPlan.version by 1"]
  - method: POST
    path: "/shop/layaway-plans/{id}/cancel"
    description: "Cancel a plan (ACTIVE -> CANCELLED); full deposit refunded to store credit."
    roles: [SalesAssociate, ShopManager]
    code: 200
    input: []
    output: LayawayPlan
    side_effects: ["release reservation (Sku.reserved -= qty)", "run calc layaway_settlement (cancel variant)", "credit refund_cents to Customer.store_credit_cents", "increment LayawayPlan.version by 1"]

  # ---- SpecialOrder ----
  - method: POST
    path: "/shop/special-orders"
    description: "Create a special order (QUOTED); computes required deposit."
    roles: [SalesAssociate, ShopManager]
    code: 201
    input: ["customer_id", "sku_id", "qty"]
    output: SpecialOrder
    side_effects: ["snapshot list price; run calc special_order_deposit (deposit_required_cents)"]
  - method: GET
    path: "/shop/special-orders/{id}"
    description: "Read a special order."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []
  - method: GET
    path: "/shop/special-orders"
    description: "List special orders (filterable by customer_id, sku_id)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["customer_id?", "sku_id?", "limit?", "offset?"]
    output: SpecialOrder[]
    side_effects: []
  - method: POST
    path: "/shop/special-orders/{id}/confirm"
    description: "Confirm a deposited order (QUOTED -> CONFIRMED)."
    roles: [SalesAssociate, ShopManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["increment SpecialOrder.version by 1"]
  - method: POST
    path: "/shop/special-orders/{id}/receive"
    description: "Receive goods into stock (CONFIRMED -> ARRIVED); restocks and reserves."
    roles: [SalesAssociate, ShopManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["increase Sku.on_hand by qty", "create ACTIVE Reservation (holder_type=SPECIAL_ORDER)", "run calc sku_available_units", "increment SpecialOrder.version by 1"]
  - method: POST
    path: "/shop/special-orders/{id}/fulfill"
    description: "Hand over goods (ARRIVED -> FULFILLED); commits the reservation."
    roles: [SalesAssociate, ShopManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["commit reservation (Sku.on_hand and Sku.reserved decremented)", "increment SpecialOrder.version by 1"]
  - method: POST
    path: "/shop/special-orders/{id}/cancel"
    description: "Cancel a special order (QUOTED/CONFIRMED -> CANCELLED)."
    roles: [SalesAssociate, ShopManager]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["if reserved, release reservation; deposit non-refundable once CONFIRMED", "increment SpecialOrder.version by 1"]

  # ---- BuildJob ----
  - method: POST
    path: "/shop/build-jobs"
    description: "Create a build job (DRAFT) on a BIKE frame Sku."
    roles: [ServiceAdvisor]
    code: 201
    input: ["customer_id", "frame_sku_id", "required_part_count"]
    output: BuildJob
    side_effects: []
  - method: GET
    path: "/shop/build-jobs/{id}"
    description: "Read a build job, including computed reserved_part_count."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: BuildJob
    side_effects: ["run calc build_readiness for the response"]
  - method: GET
    path: "/shop/build-jobs"
    description: "List build jobs (filterable by customer_id, frame_sku_id)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["customer_id?", "frame_sku_id?", "limit?", "offset?"]
    output: BuildJob[]
    side_effects: []
  - method: POST
    path: "/shop/build-jobs/{id}/reserve-part"
    description: "Reserve one part Sku for a DRAFT build (creates an ACTIVE Reservation holder_type=BUILD_JOB)."
    roles: [ServiceAdvisor]
    code: 200
    input: ["sku_id", "qty?"]
    output: BuildJob
    side_effects: ["create ACTIVE Reservation (holder_type=BUILD_JOB)", "run calc sku_available_units", "run calc build_readiness (reserved_part_count += 1)", "increment Sku.version by 1", "increment BuildJob.version by 1"]
  - method: POST
    path: "/shop/build-jobs/{id}/reserve-frame"
    description: "Reserve the frame Sku for a DRAFT build (creates an ACTIVE Reservation holder_type=BUILD_JOB for the frame)."
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: BuildJob
    side_effects: ["create ACTIVE Reservation (holder_type=BUILD_JOB) for frame_sku_id", "run calc sku_available_units", "increment Sku.version by 1", "increment BuildJob.version by 1"]
  - method: POST
    path: "/shop/build-jobs/{id}/mark-parts-reserved"
    description: "Advance DRAFT -> PARTS_RESERVED once readiness is met."
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: BuildJob
    side_effects: ["increment BuildJob.version by 1"]
  - method: POST
    path: "/shop/build-jobs/{id}/start"
    description: "Begin assembly (PARTS_RESERVED -> ASSEMBLING); computes build_fee."
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: BuildJob
    side_effects: ["run calc build_fee", "increment BuildJob.version by 1"]
  - method: POST
    path: "/shop/build-jobs/{id}/complete"
    description: "Finish build (ASSEMBLING -> COMPLETED); commits all reservations."
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: BuildJob
    side_effects: ["commit all reservations (Sku.on_hand and Sku.reserved decremented)", "increment BuildJob.version by 1"]
  - method: POST
    path: "/shop/build-jobs/{id}/cancel"
    description: "Cancel build (DRAFT/PARTS_RESERVED/ASSEMBLING -> CANCELLED); releases reservations."
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: BuildJob
    side_effects: ["release all reservations (Sku.reserved -= qty)", "increment BuildJob.version by 1"]

  # ---- WarrantyClaim ----
  - method: POST
    path: "/shop/warranty-claims"
    description: "Submit a warranty claim (SUBMITTED)."
    roles: [ServiceAdvisor, Customer]
    code: 201
    input: ["customer_id", "sku_id", "source_order_line_id", "defect_part"]
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/shop/warranty-claims/{id}"
    description: "Read a warranty claim."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/shop/warranty-claims"
    description: "List warranty claims (filterable by customer_id, sku_id, source_order_line_id, resolution_sku_id)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["customer_id?", "sku_id?", "source_order_line_id?", "resolution_sku_id?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/shop/warranty-claims/{id}/review"
    description: "Begin review (SUBMITTED -> UNDER_REVIEW)."
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["increment WarrantyClaim.version by 1"]
  - method: POST
    path: "/shop/warranty-claims/{id}/approve"
    description: "Approve as REPAIR or REPLACE (UNDER_REVIEW -> APPROVED_REPAIR | APPROVED_REPLACE)."
    roles: [ServiceAdvisor]
    code: 200
    input: ["resolution", "resolution_sku_id?"]
    output: WarrantyClaim
    side_effects: ["if REPLACE: create ACTIVE Reservation for resolution Sku, run calc sku_available_units, increment resolution Sku.version", "increment WarrantyClaim.version by 1"]
  - method: POST
    path: "/shop/warranty-claims/{id}/deny"
    description: "Deny a claim (UNDER_REVIEW -> DENIED)."
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["increment WarrantyClaim.version by 1"]
  - method: POST
    path: "/shop/warranty-claims/{id}/resolve"
    description: "Resolve a REPLACE claim (APPROVED_REPLACE -> RESOLVED); commits replacement reservation."
    roles: [ServiceAdvisor]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["commit replacement reservation (Sku.on_hand and Sku.reserved decremented)", "increment WarrantyClaim.version by 1"]

  # ---- TradeIn ----
  - method: POST
    path: "/shop/trade-ins"
    description: "Record a trade-in appraisal (APPRAISED)."
    roles: [SalesAssociate, ShopManager]
    code: 201
    input: ["customer_id", "description", "condition_grade", "appraised_value_cents", "apply_to?"]
    output: TradeIn
    side_effects: []
  - method: GET
    path: "/shop/trade-ins/{id}"
    description: "Read a trade-in."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: TradeIn
    side_effects: []
  - method: GET
    path: "/shop/trade-ins"
    description: "List trade-ins (filterable by customer_id)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: TradeIn[]
    side_effects: []
  - method: POST
    path: "/shop/trade-ins/{id}/accept"
    description: "Accept the trade-in (APPRAISED -> ACCEPTED); computes offer, credits store credit if applicable."
    roles: [ShopManager]
    code: 200
    input: []
    output: TradeIn
    side_effects: ["run calc tradein_offer", "if apply_to=STORE_CREDIT: credit offer_cents to Customer.store_credit_cents", "increment TradeIn.version by 1"]
  - method: POST
    path: "/shop/trade-ins/{id}/reject"
    description: "Reject the trade-in (APPRAISED -> REJECTED)."
    roles: [ShopManager]
    code: 200
    input: []
    output: TradeIn
    side_effects: ["increment TradeIn.version by 1"]

  # ---- Payment ----
  - method: POST
    path: "/shop/payments"
    description: "Capture a payment against a SALES_ORDER, LAYAWAY_PLAN, or SPECIAL_ORDER target."
    roles: [SalesAssociate, ShopManager]
    code: 201
    input: ["target_type", "target_id", "amount_cents"]
    output: Payment
    side_effects: ["create CAPTURED Payment", "recompute target totals (order_total for SALES_ORDER; deposit_cents for LAYAWAY_PLAN; deposit_paid_cents for SPECIAL_ORDER)", "increment target.version by 1"]
  - method: GET
    path: "/shop/payments"
    description: "List payments (reverse-reachability for Payment.target_id via target_type+target_id filter)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["target_type?", "target_id?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- RecallNotice ----
  - method: POST
    path: "/shop/recall-notices"
    description: "Publish a recall notice on a Sku."
    roles: [ShopManager]
    code: 201
    input: ["sku_id", "severity", "remedy"]
    output: RecallNotice
    side_effects: ["recompute open_recall_count for affected customers"]
  - method: GET
    path: "/shop/recall-notices/{id}"
    description: "Read a recall notice."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: RecallNotice
    side_effects: []
  - method: GET
    path: "/shop/recall-notices"
    description: "List recall notices (filterable by sku_id)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: ["sku_id?", "limit?", "offset?"]
    output: RecallNotice[]
    side_effects: []

  # ---- RecallAck ----
  - method: POST
    path: "/shop/recall-acks"
    description: "Customer acknowledges a recall notice."
    roles: [Customer, ServiceAdvisor, ShopManager]
    code: 201
    input: ["recall_id", "customer_id"]
    output: RecallAck
    side_effects: ["recompute Customer.open_recall_count"]
  - method: GET
    path: "/shop/recall-acks/{id}"
    description: "Read a recall ack."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: RecallAck
    side_effects: []
  - method: GET
    path: "/shop/recall-acks"
    description: "List recall acks (reverse-reachability for RecallAck.recall_id and .customer_id via filters)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: ["recall_id?", "customer_id?", "limit?", "offset?"]
    output: RecallAck[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock (test-driving; governs promised_ready_at)."
    roles: [ShopManager]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["set server current_utc to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID header."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this endpoint."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Customer acting on a resource whose customer_id != X-User-ID."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced path id or body FK does not resolve."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing/ill-typed field, enum out of domain, integer out of range, or malformed email."
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "Customer email already in use (case-insensitive)."
  - id: ERR_NOT_PURCHASED
    http: 409
    condition: "Warranty source_order_line_id is not a DELIVERED purchase by the claim's customer."
  - id: ERR_WARRANTY_NOT_COVERED
    http: 409
    condition: "defect_part not covered by the Sku's warranty_class / serialization."
  - id: ERR_FRAME_NOT_BIKE
    http: 409
    condition: "BuildJob frame_sku_id Sku.category != BIKE."
  - id: ERR_BUILD_NOT_READY
    http: 409
    condition: "BuildJob reserved_part_count < required_part_count or frame not reserved when marking parts reserved."
  - id: ERR_RECALL_BLOCK
    http: 409
    condition: "A MANDATORY RecallNotice exists on a Sku being reserved/received/laid away."
  - id: ERR_INSUFFICIENT_STOCK
    http: 409
    condition: "available units (on_hand - reserved) < requested qty."
  - id: ERR_NOT_FULLY_PAID
    http: 409
    condition: "SalesOrder deliver attempted while payment_status != PAID."
  - id: ERR_DEPOSIT_SHORT
    http: 409
    condition: "SpecialOrder confirm attempted while deposit_paid_cents < deposit_required_cents."
  - id: ERR_LAYAWAY_NOT_PAID_OFF
    http: 409
    condition: "LayawayPlan fulfill attempted while deposit_cents < price_cents."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_sku_version does not match current Sku.version on a reserve/layaway-open call."
  - id: ERR_TARGET_NOT_PAYABLE
    http: 409
    condition: "Payment against a target whose lifecycle no longer accepts payments."
  - id: ERR_ALREADY_ACKNOWLEDGED
    http: 409
    condition: "Customer already acknowledged this RecallNotice."
  - id: ERR_BAY_DOUBLE_BOOKED
    http: 409
    condition: "New bay booking interval overlaps an existing BOOKED interval on the same bay, or end_at <= start_at."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit/offset out of allowed bounds (limit 1..100, offset >= 0)."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SalesAssociate
    description: "Front-of-house sales staff: manages customers, sales orders, layaway, special orders, trade-in intake, payments."
    identity: opaque
    exclusive_operations:
      - "POST /shop/sales-orders, /reserve, /deliver"
      - "POST /shop/order-lines"
      - "POST /shop/layaway-plans, /fulfill, /cancel"
      - "POST /shop/special-orders and all special-order transitions"
      - "POST /shop/trade-ins (intake)"
      - "POST /shop/payments"
    shared_operations:
      - "POST /shop/customers (with ShopManager)"
      - "POST /shop/sales-orders/{id}/cancel (with ShopManager)"
      - "GET reads across customers, skus, orders, tickets, reservations, recalls"
  - name: ServiceAdvisor
    description: "Service desk: manages service tickets, labor lines, build jobs, and warranty claims."
    identity: opaque
    exclusive_operations:
      - "POST /shop/service-tickets and all ticket transitions except approve"
      - "POST /shop/labor-lines"
      - "POST /shop/bay-bookings, /release"
      - "POST /shop/build-jobs and all build transitions"
      - "POST /shop/warranty-claims review/approve/deny/resolve"
    shared_operations:
      - "POST /shop/warranty-claims (submit; with Customer)"
      - "POST /shop/recall-acks (with Customer, ShopManager)"
      - "GET reads"
  - name: ShopManager
    description: "Hierarchical override: catalog (skus, tiers, recalls), trade-in accept/reject, layaway forfeit, and may perform any SalesAssociate operation."
    identity: opaque
    exclusive_operations:
      - "POST /shop/skus, /restock"
      - "POST /shop/tune-up-tiers"
      - "POST /shop/service-bays"
      - "POST /shop/recall-notices"
      - "POST /shop/trade-ins/{id}/accept, /reject"
      - "POST /shop/layaway-plans/{id}/forfeit"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all SalesAssociate sales/layaway/special-order/payment operations"
      - "POST /shop/customers"
  - name: Customer
    description: "Entity-backed end customer: reads own resources, approves own service-ticket quotes, submits warranty claims, acknowledges recalls."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /shop/service-tickets/{id}/approve (own ticket only)"
    shared_operations:
      - "POST /shop/warranty-claims (submit; with ServiceAdvisor)"
      - "POST /shop/recall-acks (with ServiceAdvisor, ShopManager)"
      - "GET reads of own resources"
