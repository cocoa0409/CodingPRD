              captures: { ccl_id: $.data.id }
            - call: "POST /fleet/depots/${dm_id}/bay-slots"
              payload: { service_type: "CLEAN", bay_index: 1, start_utc: "2026-06-01T01:00:00Z", duration_seconds: 1800, vehicle_id: "${v1_id}", cycle_id: "${ccl_id}" }
              as: DepotTechnician
              captures: { bscl_id: $.data.id }
            - call: "POST /fleet/depots/${dm_id}/cycles/${ccl_id}/schedule"
              payload: { bay_slot_id: "${bscl_id}" }
              as: DepotTechnician
            - call: "GET /fleet/vehicles/${v1_id}"
              payload: {}
              as: FleetOperations
              captures: { pre_status: $.data.service_status, pre_v: $.data.version }
          trigger:
            - call: "POST /fleet/depots/${dm_id}/cycles/${ccl_id}/start"
              payload: {}
              as: DepotTechnician
            - call: "POST /fleet/depots/${dm_id}/cycles/${ccl_id}/abort"
              payload: {}
              as: DepotTechnician
            - call: "POST /fleet/vehicles/${v1_id}/return-to-service"
              payload: {}
              as: FleetOperations
              captures: { err: $.data.error_id }
          assert:
            - "Vehicle.${v1_id}.battery_pct == 100 (the completed CHARGE effect stands)"
            - "Vehicle.${v1_id}.cleanliness_score == 40, calib_valid == false and software_version == \"sw-2026.0\" — unchanged by the aborted CLEAN cycle"
            - "Vehicle.${v1_id}.service_status == UNAVAILABLE, identical to the pre-abort value ${pre_status}"
            - "the return-to-service response error_id == ERR_VEHICLE_NOT_SERVICE_READY and http == 409"
            - "BaySlot.${bscl_id}.status == RELEASED"
      - name: if_match_bayslot_release_restores_occupancy_invariant
        grounds:
          - state_machines.DepotCycle.transitions.IN_PROGRESS_to_ABORTED
          - calculations.depot_posture
          - entities.DepotSite.fields.occupancy_pct
        distinguishing_aspect: "The conserved quantity is the depot's occupied-bay count rather than a vehicle readiness tuple: reserving a second bay drives occupancy to 2 and posture to LOCKDOWN, and releasing it returns both to the pre-reservation literal, leaving no residual occupancy."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. Territory ACTIVE, Depot N with two SOFTWARE bay positions, two DRAFT vehicles V1 and V2, cycle CZ1 (V1) holding RESERVED slot SL1 on bay 1 for [2026-06-01T00:00:00Z, +1800s), and cycle CZ2 (V2) with no slot."
          setup_api_calls:
            - *clock_call
            - *territory_call
            - call: "POST /fleet/territories/${t_id}/depots"
              payload: { name: "Depot N", charge_positions: 0, cleaning_positions: 0, calib_positions: 0, software_positions: 2 }
              as: TerritoryPlanner
              captures: { dn_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0001", battery_pct: 90, cleanliness_score: 90, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v1_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/vehicles"
              payload: { vin: "VIN-0002", battery_pct: 90, cleanliness_score: 90, software_version: "sw-2026.1", target_software_version: "sw-2026.1" }
              as: FleetOperations
              captures: { v2_id: $.data.id }
            - call: "POST /fleet/depots/${dn_id}/cycles"
              payload: { vehicle_id: "${v1_id}", service_kind: "SOFTWARE" }
              as: DepotTechnician
              captures: { cz1_id: $.data.id }
            - call: "POST /fleet/depots/${dn_id}/cycles"
              payload: { vehicle_id: "${v2_id}", service_kind: "SOFTWARE" }
              as: DepotTechnician
              captures: { cz2_id: $.data.id }
            - call: "POST /fleet/depots/${dn_id}/bay-slots"
              payload: { service_type: "SOFTWARE", bay_index: 1, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 1800, vehicle_id: "${v1_id}", cycle_id: "${cz1_id}" }
              as: DepotTechnician
              captures: { sl1_id: $.data.id }
            - call: "GET /fleet/depots/${dn_id}"
              payload: {}
              as: DepotTechnician
              captures: { pre_occ: $.data.occupancy_pct, pre_posture: $.data.posture }
          trigger:
            - call: "POST /fleet/depots/${dn_id}/bay-slots"
              payload: { service_type: "SOFTWARE", bay_index: 2, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 1800, vehicle_id: "${v2_id}", cycle_id: "${cz2_id}" }
              as: DepotTechnician
              captures: { sl2_id: $.data.id }
            - call: "GET /fleet/depots/${dn_id}"
              payload: {}
              as: DepotTechnician
              captures: { mid_occ: $.data.occupancy_pct, mid_posture: $.data.posture }
            - call: "POST /fleet/depots/${dn_id}/bay-slots/${sl2_id}/release"
              payload: {}
              as: DepotTechnician
          assert:
            - "DepotSite.${dn_id}.occupancy_pct == ${pre_occ} == 50 and posture == ${pre_posture} == OPEN"
            - "the two-bay state read mid_occ == ${mid_occ} == 100 with mid_posture == LOCKDOWN"
            - "after release, DepotSite.${dn_id}.posture returns to OPEN with occupancy_pct 50, so the create/release pair conserves occupancy"
