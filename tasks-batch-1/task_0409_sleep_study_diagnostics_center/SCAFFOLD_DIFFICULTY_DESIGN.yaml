          - endpoints.POST./study-orders/{studyOrderId}/score
        distinguishing_aspect: |
          Boundary on the ahi metric at the /score endpoint: ahi exactly 5.0
          (480 min, 40 events) lands in MILD (>= 5), not NONE. The >= boundary
          is the falsifiable distinction; a `>` reading would yield NONE.
        test_recipe:
          setup:
