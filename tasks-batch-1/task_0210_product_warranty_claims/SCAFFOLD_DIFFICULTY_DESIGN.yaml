              as: Owner
              as_user_id: "${o1_id}"
              captures: { proof_id: $.data.id }
            - call: "POST /proofs/${proof_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /claims"
