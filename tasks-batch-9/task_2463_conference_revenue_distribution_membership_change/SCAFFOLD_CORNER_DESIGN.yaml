            - "DistributionRun.${rr_run_id}.net_pool_cents == 596000000 and .reserve_draw_cents == 13500000, the shortfall clamp on the 89400000 uncapped 1500 bps sweep"
            - "DistributionRun.${rr_run_id}.distributable_cents == 582500000 and .total_weight_bps == 40000"
            - "each of the four lines has gross_share_cents == 145625000, withheld_cents == 0, governance_fee_cents == 1250000 and net_payable_cents == 144375000"
