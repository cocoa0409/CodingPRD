            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${k_plan_np_id}", imaging_study_id: "${k_img_future_id}", encounter_datetime: "2026-08-15T00:00:00Z", expected_treatment_plan_version: "${k_plan_np_v}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_stale_future: $.data.error_id }
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${k_plan_np_id}", imaging_study_id: "${k_img_np_id}", encounter_datetime: "2026-08-15T00:00:00Z", expected_treatment_plan_version: "${k_plan_np_v}" }
              as: RetinaSpecialist
