# =============================================================================
# Task 1202 - Manufacturer Patient Assistance Program (pharma patient
# assistance foundation) - scaffold seed tables.
# =============================================================================

scenario: |
  1202. Manufacturer Patient Assistance Program (pharma patient assistance foundation): eligibility screening (income/insurance status) & documentation, application review & approval period, product shipment to provider or patient, re-enrollment cycle & change-in-circumstance, inventory & dispensing reconciliation, interaction with copay programs & duplication prevention, appeals & exceptions, program budget & utilization reporting

domain_name: manufacturer-patient-assistance-program
api_prefix: /pap

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; all linkage via FK fields)
# =============================================================================
entities:
  - name: AssistanceProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: product_name, type: string, source: input, description: "Covered drug product (one product per program)" }
      - { name: unit_cost_per_unit, type: string, source: input, description: "Reference unit cost, decimal dollars with exactly 4 fraction digits, e.g. '100.0000'; used only for benefit-cap computation" }
      - { name: max_units_per_enrollment, type: integer, source: input, description: "Hard unit cap per enrollment period" }
      - { name: max_units_per_shipment, type: integer, source: input, description: "Hard unit cap per shipment request" }
      - { name: max_annual_benefit_cents, type: integer, source: input, description: "Money-axis cap per enrollment, integer cents" }
      - { name: enrollment_duration_days, type: integer, source: input, description: "Approval period length; end_date = start_date + enrollment_duration_days - 1" }
      - { name: screening_validity_days, type: integer, source: input, description: "Screening stays usable through verified_date + screening_validity_days inclusive" }
      - { name: appeal_window_days, type: integer, source: input, description: "Appeal allowed while today <= decided_date + appeal_window_days" }
      - { name: renewal_window_days, type: integer, source: input, description: "Renewal allowed while end_date - renewal_window_days <= today <= end_date" }
      - { name: lot_expiry_buffer_days, type: integer, source: input, description: "FEFO eligibility requires expiry_date > today + lot_expiry_buffer_days" }
      - { name: allow_patient_direct_shipment, type: boolean, source: input, description: "When false, destination PATIENT is rejected" }
      - { name: posture, type: enum, source: computed, default: OPEN, description: "OPEN | RESTRICTED | EXHAUSTED, derived from utilization_committed_basis (see calculations.program_utilization_and_posture)", constraints: "OPEN | RESTRICTED | EXHAUSTED" }
      - { name: total_allocated_cents, type: integer, source: computed, default: 0, description: "Sum of allocated_cents over all BudgetPeriods of this program regardless of period status" }
      - { name: total_committed_cents, type: integer, source: computed, default: 0, description: "Sum over Enrollments with status in {ACTIVE, SUSPENDED} of (benefit_cap_cents - disbursed_cents)" }
      - { name: total_disbursed_cents, type: integer, source: computed, default: 0, description: "Sum over ALL Enrollments of disbursed_cents" }

  - name: BudgetPeriod
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AssistanceProgram.id; owning program" }
      - { name: period_start, type: string, source: input, description: "ISO date YYYY-MM-DD, closed interval start" }
      - { name: period_end, type: string, source: input, description: "ISO date YYYY-MM-DD, closed interval end; must be >= period_start" }
      - { name: allocated_cents, type: integer, source: input, description: "Budget allocated to this period, >= 0" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Remaining commitment of enrollments whose commitment_budget_period_id = this period" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "Delivered shipment value attributed to this period" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> CLOSED (one-way)", constraints: "OPEN | CLOSED" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: state_code, type: string, source: input, description: "US state, 2 letters" }

  - name: Prescriber
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Prescriber name" }
      - { name: npi_number, type: string, source: input, description: "National Provider Identifier" }
      - { name: state_code, type: string, source: input, description: "US state, 2 letters" }

  - name: EligibilityScreening
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; screened patient" }
      - { name: program_id, type: string, source: input, description: "FK -> AssistanceProgram.id; program screened for" }
      - { name: household_size, type: integer, source: input, description: "Household members, >= 1" }
      - { name: income_basis, type: enum, source: input, description: "Selects the annualization variant", constraints: "YTD_ANNUALIZED | PRIOR_YEAR" }
      - { name: ytd_income_cents, type: integer, source: input, description: "Required iff income_basis == YTD_ANNUALIZED" }
      - { name: ytd_months_elapsed, type: integer, source: input, description: "Required iff income_basis == YTD_ANNUALIZED; 1..12" }
      - { name: prior_year_income_cents, type: integer, source: input, description: "Required iff income_basis == PRIOR_YEAR" }
      - { name: insurance_status, type: enum, source: input, description: "Current coverage", constraints: "UNINSURED | UNDERINSURED | INSURED_COMMERCIAL | MEDICARE | MEDICAID" }
      - { name: insurance_coverage_pct, type: string, source: input, description: "Required iff insurance_status == UNDERINSURED; decimal 0.00..0.99, e.g. '0.60'" }
      - { name: annualized_income_cents, type: integer, source: computed, description: "Set at creation per calculations.annualized_household_income" }
      - { name: fpl_limit_cents, type: integer, source: computed, description: "FPL_BASE_CENTS + FPL_ADDITIONAL_CENTS * (household_size - 1)" }
      - { name: fpl_percent, type: string, source: computed, description: "Decimal 2dp round_half_up, e.g. '191.69'" }
      - { name: eligibility_determination, type: enum, source: computed, description: "Computed at verification", constraints: "ELIGIBLE | INELIGIBLE", default: null }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SUBMITTED -> VERIFIED | REJECTED; REJECTED -> DRAFT; VERIFIED -> STALE (sweep)", constraints: "DRAFT | SUBMITTED | VERIFIED | REJECTED | STALE" }
      - { name: verified_at, type: datetime, source: system, description: "Logical clock at VERIFIED decision; null until verified" }
      - { name: rejection_reason, type: string, source: system, description: "Required on REJECTED decision" }

  - name: ScreeningDocument
    parent: null
    common_fields: true
    fields:
      - { name: screening_id, type: string, source: input, description: "FK -> EligibilityScreening.id; owning screening (from path)" }
      - { name: doc_type, type: enum, source: input, description: "Document category", constraints: "PROOF_OF_INCOME | IDENTITY | INSURANCE_VERIFICATION | OTHER" }
      - { name: file_reference, type: string, source: input, description: "Opaque storage handle" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> ACCEPTED | REJECTED", constraints: "PENDING | ACCEPTED | REJECTED" }
      - { name: review_note, type: string, source: system, description: "Caseworker note from review" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; applicant" }
      - { name: program_id, type: string, source: input, description: "FK -> AssistanceProgram.id; program applied to" }
      - { name: screening_id, type: string, source: input, description: "FK -> EligibilityScreening.id; backing screening" }
      - { name: renewal_of_enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; set only for renewal applications created via POST /pap/enrollments/{id}/renewal-applications; null for fresh applications" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> UNDER_REVIEW -> APPROVED | DENIED | MORE_INFO_REQUESTED; MORE_INFO_REQUESTED -> UNDER_REVIEW; DENIED -> APPROVED via appeal; renewal chain -> SUPERSEDED", constraints: "SUBMITTED | UNDER_REVIEW | MORE_INFO_REQUESTED | APPROVED | DENIED | SUPERSEDED" }
      - { name: reviewer_id, type: string, source: system, description: "X-User-ID of claiming CaseWorker; null until claimed; retained across info-request cycle" }
      - { name: info_request_note, type: string, source: system, description: "Note supplied at MORE_INFO_REQUESTED" }
      - { name: decision_reason, type: string, source: system, description: "Required on DENIED" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock of APPROVED/DENIED decision" }
      - { name: approved_via_appeal, type: boolean, source: system, default: false, description: "True when APPROVED reached via appeal OVERTURNED" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; enrollment created on approval; null until APPROVED" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; from application" }
      - { name: program_id, type: string, source: system, description: "FK -> AssistanceProgram.id; from application" }
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; approving application" }
      - { name: commitment_budget_period_id, type: string, source: system, description: "FK -> BudgetPeriod.id; OPEN period containing approval date; holds this enrollment's commitment and all its disbursements" }
      - { name: start_date, type: string, source: system, description: "ISO date; approval date, or prior enrollment end_date + 1 for renewals" }
      - { name: end_date, type: string, source: system, description: "ISO date; start_date + enrollment_duration_days - 1 (pinned at approval, never recomputed on program config change)" }
      - { name: benefit_cap_cents, type: integer, source: computed, description: "Pinned at approval per calculations.enrollment_benefit_cap_cents" }
      - { name: cap_units, type: integer, source: computed, description: "= program.max_units_per_enrollment pinned at approval" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "Sum of value_cents over this enrollment's DELIVERED shipments" }
      - { name: remaining_units, type: integer, source: computed, description: "= cap_units - units on shipments with status in {RESERVED, DISPATCHED, DELIVERED, RETURNED}; CANCELLED restores" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> SUSPENDED | TERMINATED | EXPIRED | CLOSED_RENEWED; SUSPENDED -> ACTIVE | TERMINATED | EXPIRED", constraints: "ACTIVE | SUSPENDED | TERMINATED | EXPIRED | CLOSED_RENEWED" }
      - { name: status_reason, type: string, source: system, description: "Reason text from terminate/suspend trigger" }

  - name: ChangeOfCircumstance
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; affected enrollment (from path)" }
      - { name: circumstance_type, type: enum, source: input, description: "Change category", constraints: "INCOME_CHANGE | INSURANCE_CHANGE | HOUSEHOLD_CHANGE" }
      - { name: new_annual_income_cents, type: integer, source: input, description: "Required iff circumstance_type == INCOME_CHANGE" }
      - { name: new_household_size, type: integer, source: input, description: "Required iff circumstance_type == HOUSEHOLD_CHANGE" }
      - { name: new_insurance_status, type: enum, source: input, description: "Required iff circumstance_type == INSURANCE_CHANGE", constraints: "UNINSURED | UNDERINSURED | INSURED_COMMERCIAL | MEDICARE | MEDICAID" }
      - { name: note, type: string, source: input, description: "Optional free text" }
      - { name: reported_by, type: string, source: system, description: "X-User-ID of reporter" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED -> APPLIED | DISMISSED", constraints: "REPORTED | APPLIED | DISMISSED" }
      - { name: outcome, type: enum, source: system, description: "Set when APPLIED", constraints: "SUSPENDED | TERMINATED" }
      - { name: review_note, type: string, source: system, description: "Caseworker note" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; appealed application (from path)" }
      - { name: grounds, type: string, source: input, description: "Appeal grounds, non-empty" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED -> UPHELD | OVERTURNED", constraints: "FILED | UPHELD | OVERTURNED" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of AppealsOfficer" }
      - { name: decision_reason, type: string, source: system, description: "Decision rationale" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock at decision" }

  - name: CopayCard
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; card holder" }
      - { name: program_id, type: string, source: input, description: "FK -> AssistanceProgram.id; same product family as the PAP program (duplication-of-benefits anchor)" }
      - { name: coverage_start, type: string, source: input, description: "ISO date, closed interval start" }
      - { name: coverage_end, type: string, source: input, description: "ISO date, closed interval end; must be >= coverage_start" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> SUSPENDED -> TERMINATED; ACTIVE -> TERMINATED", constraints: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: termination_reason, type: string, source: system, description: "Optional reason text" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AssistanceProgram.id; owning program" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot number; unique per program" }
      - { name: quantity_received, type: integer, source: input, description: "Units received, >= 1" }
      - { name: unit_cost_per_unit, type: string, source: input, description: "Acquisition unit cost, decimal dollars 4dp; drives shipment/dispense valuation" }
      - { name: expiry_date, type: string, source: input, description: "ISO date; lot expires after this date" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE -> QUARANTINED | EXPIRED | UNDER_INVESTIGATION (all one-way)", constraints: "ACTIVE | QUARANTINED | EXPIRED | UNDER_INVESTIGATION" }
      - { name: quantity_on_hand, type: integer, source: computed, description: "received - reserved - shipped - dispensed - quarantined" }
      - { name: quantity_reserved, type: integer, source: computed, default: 0, description: "Units on RESERVED shipment lines" }
      - { name: quantity_shipped, type: integer, source: computed, default: 0, description: "Units on DISPATCHED/DELIVERED lines not yet dispensed" }
      - { name: quantity_dispensed, type: integer, source: computed, default: 0, description: "Units recorded by DispenseEvents" }
      - { name: quantity_quarantined, type: integer, source: computed, default: 0, description: "Returned or sweep-expired units (never restocked)" }
      - { name: status_reason, type: string, source: system, description: "Reason from quarantine/investigation trigger" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; funding enrollment" }
      - { name: destination, type: enum, source: input, description: "Ship-to class", constraints: "PROVIDER | PATIENT" }
      - { name: prescriber_id, type: string, source: input, description: "FK -> Prescriber.id; required iff destination == PROVIDER, null otherwise" }
      - { name: quantity_units, type: integer, source: input, description: ">= 1, <= program.max_units_per_shipment, <= enrollment.remaining_units" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "RESERVED -> DISPATCHED -> DELIVERED; RESERVED -> CANCELLED; DISPATCHED -> RETURNED", constraints: "RESERVED | DISPATCHED | DELIVERED | CANCELLED | RETURNED" }
      - { name: value_cents, type: integer, source: computed, description: "Sum over lines of round_half_up(quantity * lot.unit_cost_per_unit * 100); per-line rounding pinned" }
      - { name: dispensed_value_cents, type: integer, source: computed, default: 0, description: "Sum over dispense events of their per-event rounded value_cents" }
      - { name: idempotency_key, type: string, source: system, description: "From required Idempotency-Key header" }
      - { name: requested_by, type: string, source: system, description: "X-User-ID of creator" }
      - { name: status_reason, type: string, source: system, description: "Cancel/return reason" }

  - name: ShipmentLine
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id; owning shipment" }
      - { name: lot_id, type: string, source: system, description: "FK -> InventoryLot.id; allocated lot (FEFO)" }
      - { name: quantity, type: integer, source: system, description: "Units allocated from this lot" }
      - { name: value_cents, type: integer, source: computed, description: "round_half_up(quantity * lot.unit_cost_per_unit * 100)" }
      - { name: dispensed_quantity, type: integer, source: computed, default: 0, description: "Sum of DispenseEvent.quantity for this (shipment, lot)" }

  - name: DispenseEvent
    parent: null
    common_fields: false
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; dispensed shipment (from path)" }
      - { name: lot_id, type: string, source: input, description: "FK -> InventoryLot.id; lot actually dispensed; must appear among the shipment's lines" }
      - { name: quantity, type: integer, source: input, description: ">= 1; cumulative per (shipment, lot) must stay <= line quantity" }
      - { name: dispensed_at, type: datetime, source: input, description: "Optional; defaults to logical clock now" }
      - { name: value_cents, type: integer, source: computed, description: "round_half_up(quantity * lot.unit_cost_per_unit * 100); per-EVENT rounding pinned" }
      - { name: dispenser_id, type: string, source: system, description: "X-User-ID of PharmacyDispenser" }

  - name: ReconciliationRun
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AssistanceProgram.id; reconciled program" }
      - { name: budget_period_id, type: string, source: input, description: "FK -> BudgetPeriod.id; must be CLOSED" }
      - { name: status, type: enum, source: system, description: "Computed at creation: CLEAN iff every line variance == 0 else VARIANCE_FLAGGED", constraints: "CLEAN | VARIANCE_FLAGGED" }
      - { name: lines, type: array, source: computed, description: "Per-lot results: [{lot_id, book_on_hand, actual_on_hand, variance_units, variance_value_cents}]" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EligibilityScreening
    initial_state: DRAFT
    terminal_states: [STALE]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pap/screenings/{id}/submit"
        actor: Patient
        preconditions:
          - "status == DRAFT (ERR_SCREENING_NOT_DRAFT)"
          - "caller owns screening (screening.patient_id == X-User-ID; ERR_OWNERSHIP_VIOLATION)"
          - "every required doc type has >= 1 uploaded ScreeningDocument: {PROOF_OF_INCOME, IDENTITY} always, plus INSURANCE_VERIFICATION iff insurance_status != UNINSURED (ERR_DOCUMENTS_INCOMPLETE)"
        side_effects: []
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /pap/screenings/{id}/decision {decision: VERIFIED}"
        actor: CaseWorker
        preconditions:
          - "status == SUBMITTED (ERR_SCREENING_NOT_SUBMITTED)"
          - "every uploaded ScreeningDocument has status ACCEPTED (ERR_DOCUMENTS_NOT_ACCEPTED)"
          - "computed eligibility_determination == ELIGIBLE per calculations.fpl_percent_and_eligibility (ERR_PATIENT_INELIGIBLE)"
        side_effects:
          - "verified_at = logical clock now"
          - "eligibility_determination persisted as ELIGIBLE"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /pap/screenings/{id}/decision {decision: REJECTED}"
        actor: CaseWorker
        preconditions:
          - "status == SUBMITTED (ERR_SCREENING_NOT_SUBMITTED)"
          - "rejection_reason present (ERR_INVALID_REQUEST)"
        side_effects:
          - "rejection_reason stored"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /pap/screenings/{id}/revise"
        actor: Patient
        preconditions:
          - "status == REJECTED (ERR_SCREENING_NOT_DRAFT fires for any other non-DRAFT source on submit; revise requires REJECTED: ERR_SCREENING_NOT_REJECTED)"
          - "caller owns screening (ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "verified_at cleared; previously uploaded documents retained with their statuses"
        note: "Revision loop: patient may upload replacement documents in DRAFT, then resubmit."
      - from: VERIFIED
        to: STALE
        trigger: "system sweep (POST /_system/run-daily-sweep) when today > verified_at_date + program.screening_validity_days"
        actor: system
        preconditions:
          - "status == VERIFIED and today > verified_at_date + screening_validity_days"
        side_effects: []

  - entity: ScreeningDocument
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /pap/documents/{id}/review {decision: ACCEPTED}"
        actor: CaseWorker
        preconditions:
          - "status == PENDING (ERR_DOCUMENT_NOT_PENDING)"
        side_effects: ["review_note stored if supplied"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /pap/documents/{id}/review {decision: REJECTED}"
        actor: CaseWorker
        preconditions:
          - "status == PENDING (ERR_DOCUMENT_NOT_PENDING)"
        side_effects: ["review_note stored if supplied"]

  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /pap/applications/{id}/claim"
        actor: CaseWorker
        preconditions:
          - "status == SUBMITTED (ERR_APPLICATION_NOT_SUBMITTED)"
        side_effects:
          - "reviewer_id = X-User-ID of claiming CaseWorker"
      - from: UNDER_REVIEW
        to: MORE_INFO_REQUESTED
        trigger: "POST /pap/applications/{id}/request-info"
        actor: CaseWorker
        preconditions:
          - "status == UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW)"
          - "X-User-ID == reviewer_id (ERR_REVIEWER_MISMATCH)"
        side_effects:
          - "info_request_note stored"
      - from: MORE_INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /pap/applications/{id}/resubmit"
        actor: Patient
        preconditions:
          - "status == MORE_INFO_REQUESTED (ERR_APPLICATION_NOT_AWAITING_INFO)"
          - "caller owns application (application.patient_id == X-User-ID; ERR_OWNERSHIP_VIOLATION)"
        side_effects:
          - "reviewer_id retained (same CaseWorker continues)"
        note: "Info-request cycle: UNDER_REVIEW -> MORE_INFO_REQUESTED -> UNDER_REVIEW may repeat."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /pap/applications/{id}/decision {decision: APPROVED}"
        actor: CaseWorker
        preconditions:
          - "status == UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW) and X-User-ID == reviewer_id (ERR_REVIEWER_MISMATCH)"
          - "screening.status == VERIFIED (ERR_SCREENING_NOT_VERIFIED)"
          - "today <= verified_at_date + program.screening_validity_days (ERR_SCREENING_STALE)"
          - "no Enrollment with status in {ACTIVE, SUSPENDED} for (patient_id, program_id) other than the one named by renewal_of_enrollment_id (ERR_DUPLICATE_BENEFIT_ACTIVE)"
          - "no CopayCard with status == ACTIVE for (patient_id, program_id) whose [coverage_start, coverage_end] intersects the new enrollment [start_date, end_date] (ERR_DUPLICATE_BENEFIT_ACTIVE); SUSPENDED cards do NOT block"
          - "if renewal_of_enrollment_id set: that enrollment.status == ACTIVE (ERR_ENROLLMENT_NOT_ACTIVE)"
          - "program.posture != EXHAUSTED (ERR_PROGRAM_BUDGET_EXHAUSTED)"
          - "program.posture != RESTRICTED when renewal_of_enrollment_id is null; renewals are exempt (ERR_PROGRAM_RESTRICTED)"
          - "an OPEN BudgetPeriod containing today exists (ERR_NO_OPEN_BUDGET_PERIOD)"
          - "program.total_committed_cents + total_disbursed_cents + benefit_cap_cents <= total_allocated_cents (ERR_INSUFFICIENT_PROGRAM_BUDGET); for renewals the prior enrollment's remaining commitment is RELEASED as part of the same approval BEFORE this sufficiency check is evaluated (a renewal replaces, not adds to, the commitment)"
        side_effects:
          - "create Enrollment: start_date = today (fresh) or prior end_date + 1 day (renewal); end_date = start_date + enrollment_duration_days - 1; benefit_cap_cents per calculations.enrollment_benefit_cap_cents; commitment_budget_period_id = containing OPEN period"
          - "if renewal: prior enrollment -> CLOSED_RENEWED, releasing its remaining commitment (benefit_cap_cents - disbursed_cents) from program and period totals"
          - "BudgetPeriod.committed_cents += new enrollment benefit_cap_cents; program totals and posture recomputed per calculations.program_utilization_and_posture"
          - "application.decided_at = now; application.enrollment_id set"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /pap/applications/{id}/decision {decision: DENIED}"
        actor: CaseWorker
        preconditions:
          - "status == UNDER_REVIEW (ERR_APPLICATION_NOT_UNDER_REVIEW) and X-User-ID == reviewer_id (ERR_REVIEWER_MISMATCH)"
          - "decision_reason present (ERR_INVALID_REQUEST)"
        side_effects:
          - "decided_at = now; decision_reason stored"
      - from: DENIED
        to: APPROVED
        trigger: "system (Appeal decision OVERTURNED)"
        actor: system
        preconditions:
          - "same approval precondition set re-evaluated at appeal-decision time (duplication, posture, budget, open period)"
        side_effects:
          - "approved_via_appeal = true; enrollment created and budget committed exactly as in UNDER_REVIEW -> APPROVED"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a newer renewal application for the same enrollment is created)"
        actor: system
        preconditions: ["application is a renewal application (renewal_of_enrollment_id set) for that enrollment"]
        side_effects: []
      - from: UNDER_REVIEW
        to: SUPERSEDED
        trigger: "system (a newer renewal application for the same enrollment is created)"
        actor: system
        preconditions: ["application is a renewal application for that enrollment"]
        side_effects: []
      - from: MORE_INFO_REQUESTED
        to: SUPERSEDED
        trigger: "system (a newer renewal application for the same enrollment is created)"
        actor: system
        preconditions: ["application is a renewal application for that enrollment"]
        side_effects: []

  - entity: Enrollment
    initial_state: ACTIVE
    terminal_states: [TERMINATED, EXPIRED, CLOSED_RENEWED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (ChangeOfCircumstance review decision APPLIED_SUSPEND)"
        actor: system
        preconditions: ["enrollment.status == ACTIVE"]
        side_effects:
          - "status_reason = circumstance review_note"
          - "every Shipment of this enrollment with status RESERVED -> CANCELLED, and each such cancellation releases its lot reservations (lot.quantity_reserved -= q, lot.quantity_on_hand += q) and restores enrollment.remaining_units"
        note: "Suspension does NOT release budget commitment; the benefit stays reserved."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /pap/enrollments/{id}/terminate OR system (ChangeOfCircumstance review decision APPLIED_TERMINATE)"
        actor: CaseWorker | system
        preconditions: ["enrollment.status in {ACTIVE, SUSPENDED} (ERR_ENROLLMENT_NOT_ACTIVE)"]
        side_effects:
          - "every Shipment with status RESERVED -> CANCELLED with lot reservation release and remaining_units restoration"
          - "release remaining commitment: program.total_committed_cents and commitment period committed_cents decrease by (benefit_cap_cents - disbursed_cents); posture recomputed"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /pap/enrollments/{id}/terminate"
        actor: CaseWorker
        preconditions: ["enrollment.status in {ACTIVE, SUSPENDED} (ERR_ENROLLMENT_NOT_ACTIVE)"]
        side_effects:
          - "release remaining commitment (benefit_cap_cents - disbursed_cents); posture recomputed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /pap/enrollments/{id}/reinstate"
        actor: CaseWorker
        preconditions:
          - "enrollment.status == SUSPENDED (ERR_ENROLLMENT_NOT_SUSPENDED)"
          - "screening_id references a screening of enrollment.patient_id and enrollment.program_id (ERR_SCREENING_MISMATCH)"
          - "that screening.status == VERIFIED (ERR_SCREENING_NOT_VERIFIED)"
          - "today <= verified_at_date + screening_validity_days (ERR_SCREENING_STALE)"
        side_effects: []
        note: "Reinstatement carries no budget effect: suspension never released the commitment."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep (POST /_system/run-daily-sweep) when today > end_date"
        actor: system
        preconditions: ["status in {ACTIVE, SUSPENDED} and today > end_date"]
        side_effects:
          - "RESERVED shipments -> CANCELLED with lot release and remaining_units restoration (as in termination)"
          - "release remaining commitment; posture recomputed"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system sweep (POST /_system/run-daily-sweep) when today > end_date"
        actor: system
        preconditions: ["status in {ACTIVE, SUSPENDED} and today > end_date"]
        side_effects: ["release remaining commitment; posture recomputed"]
      - from: ACTIVE
        to: CLOSED_RENEWED
        trigger: "system (renewal Application decision APPROVED)"
        actor: system
        preconditions: ["the approved application.renewal_of_enrollment_id == this enrollment.id"]
        side_effects:
          - "release remaining commitment; new enrollment created with start_date = this.end_date + 1; posture recomputed"

  - entity: ChangeOfCircumstance
    initial_state: REPORTED
    terminal_states: [APPLIED, DISMISSED]
    transitions:
      - from: REPORTED
        to: APPLIED
        trigger: "POST /pap/circumstances/{id}/review {decision: APPLIED_SUSPEND | APPLIED_TERMINATE}"
        actor: CaseWorker
        preconditions:
          - "status == REPORTED (ERR_CIRCUMSTANCE_NOT_REPORTED)"
          - "enrollment.status in {ACTIVE, SUSPENDED} (ERR_ENROLLMENT_NOT_ACTIVE)"
        side_effects:
          - "decision APPLIED_SUSPEND -> enrollment ACTIVE->SUSPENDED cascade; decision APPLIED_TERMINATE -> enrollment ->TERMINATED cascade (see Enrollment transitions)"
          - "outcome field set to SUSPENDED or TERMINATED accordingly"
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /pap/circumstances/{id}/review {decision: DISMISSED}"
        actor: CaseWorker
        preconditions:
          - "status == REPORTED (ERR_CIRCUMSTANCE_NOT_REPORTED)"
        side_effects: []

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, OVERTURNED]
    transitions:
      - from: FILED
        to: UPHELD
        trigger: "POST /pap/appeals/{id}/decision {decision: UPHELD}"
        actor: AppealsOfficer
        preconditions:
          - "status == FILED (ERR_APPEAL_NOT_FILED)"
          - "X-User-ID != application.reviewer_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["decided_by/decided_at/decision_reason stored"]
      - from: FILED
        to: OVERTURNED
        trigger: "POST /pap/appeals/{id}/decision {decision: OVERTURNED}"
        actor: AppealsOfficer
        preconditions:
          - "status == FILED (ERR_APPEAL_NOT_FILED)"
          - "X-User-ID != application.reviewer_id (ERR_SEGREGATION_OF_DUTIES)"
          - "full approval precondition set re-evaluated NOW: no duplicate benefit (ERR_DUPLICATE_BENEFIT_ACTIVE), posture != EXHAUSTED (ERR_PROGRAM_BUDGET_EXHAUSTED), posture != RESTRICTED for non-renewal (ERR_PROGRAM_RESTRICTED), OPEN period containing today (ERR_NO_OPEN_BUDGET_PERIOD), budget sufficiency (ERR_INSUFFICIENT_PROGRAM_BUDGET)"
        side_effects:
          - "application DENIED -> APPROVED (approved_via_appeal = true)"
          - "Enrollment created; BudgetPeriod and program committed/posture recomputed (see Application approval)"
        note: "Cascade depth 4: appeal -> application -> enrollment -> budget period/program posture."

  - entity: CopayCard
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /pap/copay-cards/{id}/suspend"
        actor: CaseWorker
        preconditions: ["status == ACTIVE (ERR_COPAY_CARD_NOT_ACTIVE)"]
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /pap/copay-cards/{id}/terminate"
        actor: CaseWorker
        preconditions: ["status in {ACTIVE, SUSPENDED} (ERR_COPAY_CARD_TERMINATED)"]
        side_effects: ["termination_reason stored if supplied"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /pap/copay-cards/{id}/terminate"
        actor: CaseWorker
        preconditions: ["status in {ACTIVE, SUSPENDED} (ERR_COPAY_CARD_TERMINATED)"]
        side_effects: ["termination_reason stored if supplied"]

  - entity: Shipment
    initial_state: RESERVED
    terminal_states: [DELIVERED, CANCELLED, RETURNED]
    transitions:
      - from: RESERVED
        to: DISPATCHED
        trigger: "POST /pap/shipments/{id}/dispatch"
        actor: CaseWorker
        preconditions:
          - "status == RESERVED (ERR_SHIPMENT_NOT_RESERVED)"
          - "every line lot has status == ACTIVE (ERR_LOT_NOT_ACTIVE)"
        side_effects:
          - "per line: lot.quantity_reserved -= q; lot.quantity_shipped += q"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /pap/shipments/{id}/deliver"
        actor: "CaseWorker | Prescriber (only when destination == PROVIDER and X-User-ID == shipment.prescriber_id, else ERR_PRESCRIBER_MISMATCH) | Patient (only when destination == PATIENT and X-User-ID == enrollment.patient_id, else ERR_OWNERSHIP_VIOLATION)"
        preconditions:
          - "status == DISPATCHED (ERR_SHIPMENT_NOT_DISPATCHED)"
        side_effects:
          - "enrollment.disbursed_cents += shipment.value_cents"
          - "commitment BudgetPeriod.disbursed_cents += value_cents; program totals and posture recomputed (total_committed_cents is derived as cap - disbursed over open enrollments, so delivery shifts committed -> disbursed)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /pap/shipments/{id}/cancel OR system (enrollment suspend/terminate/expire cascade)"
        actor: CaseWorker | system
        preconditions: ["status == RESERVED (ERR_SHIPMENT_NOT_CANCELLABLE)"]
        side_effects:
          - "per line: lot.quantity_reserved -= q; lot.quantity_on_hand += q (compensation of reservation)"
          - "enrollment.remaining_units restored by quantity_units"
      - from: DISPATCHED
        to: RETURNED
        trigger: "POST /pap/shipments/{id}/return"
        actor: CaseWorker
        preconditions: ["status == DISPATCHED (ERR_SHIPMENT_NOT_DISPATCHED)"]
        side_effects:
          - "per line: lot.quantity_shipped -= q; lot.quantity_quarantined += q (product may not be restocked)"
          - "enrollment.remaining_units NOT restored (units consumed); no money movement (never delivered)"

  - entity: InventoryLot
    initial_state: ACTIVE
    terminal_states: [QUARANTINED, EXPIRED, UNDER_INVESTIGATION]
    transitions:
      - from: ACTIVE
        to: QUARANTINED
        trigger: "POST /pap/inventory-lots/{id}/quarantine"
        actor: ProgramAdministrator
        preconditions: ["status == ACTIVE (ERR_LOT_NOT_ACTIVE)"]
        side_effects: ["status_reason stored; lot excluded from FEFO; existing RESERVED lines unaffected"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep when today > expiry_date"
        actor: system
        preconditions: ["status == ACTIVE and today > expiry_date"]
        side_effects: ["lot.quantity_on_hand -> lot.quantity_quarantined (on_hand set to 0); existing RESERVED lines remain reserved (dispatch will fail ERR_LOT_NOT_ACTIVE until the shipment is cancelled)"]
      - from: ACTIVE
        to: UNDER_INVESTIGATION
        trigger: "system (ReconciliationRun created with non-zero variance on this lot)"
        actor: system
        preconditions: ["status == ACTIVE"]
        side_effects: ["lot excluded from FEFO"]

  - entity: BudgetPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /pap/budget-periods/{id}/close"
        actor: ProgramAdministrator
        preconditions: ["status == OPEN (ERR_BUDGET_PERIOD_NOT_OPEN)"]
        side_effects: []

  - entity: ReconciliationRun
    initial_state: CLEAN
    terminal_states: [CLEAN, VARIANCE_FLAGGED]
    transitions: []
    note: "Outcome state is computed atomically at creation: CLEAN iff every line variance_units == 0, else VARIANCE_FLAGGED (and each flagged lot -> UNDER_INVESTIGATION). No further transitions."

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-renewal-create-occ
    parent_entity: Enrollment
    write_endpoint: "POST /pap/enrollments/{id}/renewal-applications"
    occ_field: expected_enrollment_version
    description: |
      Creating a renewal Application against an Enrollment whose version has
      advanced since the client last observed it is rejected. A prior renewal
      creation legitimately supersedes older non-terminal renewal applications
      and advances Enrollment.version, so a writer holding a stale version is
      acting on an out-of-date view of the enrollment.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: program-config-update-occ
    parent_entity: AssistanceProgram
    write_endpoint: "PUT /pap/programs/{id}"
    occ_field: expected_program_version
    description: |
      Updating AssistanceProgram configuration with an expected_program_version
      that no longer matches the program's current version is rejected, because
      another accepted update has already advanced the version and the stale
      writer's configuration delta was computed against a superseded baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: annualized_household_income
    trigger: "EligibilityScreening creation"
    algorithm: forward_looking
    formula: |
      if income_basis == YTD_ANNUALIZED:
        annualized_income_cents = round_half_up(ytd_income_cents / ytd_months_elapsed * 12)
      if income_basis == PRIOR_YEAR:
        annualized_income_cents = prior_year_income_cents
    input_set: "The screening's own income fields only"
    precision: "integer cents, round_half_up on the YTD division"
    variants:
      - name: ytd_annualized
        when: "income_basis == YTD_ANNUALIZED"
        difference: "Projects current-year run-rate; a mid-year raise produces a HIGHER annualized figure than the prior-year tax return for the same patient."
      - name: prior_year_tax_return
        when: "income_basis == PRIOR_YEAR"
        difference: "Uses filed prior-year total verbatim; no projection. Same household data can be ELIGIBLE under one basis and INELIGIBLE under the other."

  - name: fpl_percent_and_eligibility
    trigger: "EligibilityScreening creation (fpl computed) and verification decision (determination made)"
    algorithm: threshold
    formula: |
      fpl_limit_cents = FPL_BASE_CENTS + FPL_ADDITIONAL_CENTS * (household_size - 1)
      fpl_percent = round_half_up(annualized_income_cents * 100 / fpl_limit_cents, 2 decimal places)
      eligibility_determination:
        insurance_status == UNINSURED    -> ELIGIBLE iff fpl_percent <= FPL_THRESHOLD_UNINSURED_PCT (400.00, inclusive)
        insurance_status == UNDERINSURED -> ELIGIBLE iff fpl_percent <= FPL_THRESHOLD_UNDERINSURED_PCT (500.00, inclusive) and insurance_coverage_pct < 1.00
        INSURED_COMMERCIAL | MEDICARE | MEDICAID -> INELIGIBLE (must use copay programs instead)
      The comparison uses the ROUNDED 2-decimal fpl_percent value.
    input_set: "Single screening"
    constants:
      FPL_BASE_CENTS: 1565000
      FPL_ADDITIONAL_CENTS: 550000
      FPL_THRESHOLD_UNINSURED_PCT: "400.00"
      FPL_THRESHOLD_UNDERINSURED_PCT: "500.00"
    precision: "fpl_percent pinned at 2 decimal places, round_half_up; threshold comparison on the rounded value"

  - name: enrollment_benefit_cap_cents
    trigger: "Application approval (incl. appeal overturn); result pinned on the Enrollment and never recomputed on later program config changes"
    algorithm: tiered_pricing
    formula: |
      unit_cents = round_half_up(program.unit_cost_per_unit * 100)
      product_axis_cents = program.max_units_per_enrollment * unit_cents
      base_cap = min(program.max_annual_benefit_cents, product_axis_cents)
      if screening.insurance_status == UNDERINSURED:
        cap = round_half_up(base_cap * (1 - screening.insurance_coverage_pct))
      else:
        cap = base_cap
      Evaluation order pinned: unit conversion -> product axis -> min with annual cap -> underinsured scaling last.
    input_set: "Approving program config + the screening backing the application"
    precision: "integer cents, round_half_up"

  - name: fefo_lot_allocation
    trigger: "POST /pap/shipments (reservation at creation)"
    algorithm: waterfall_allocation
    formula: |
      eligible(lot) = lot.program_id == enrollment.program_id
                      AND lot.status == ACTIVE
                      AND lot.quantity_on_hand > 0
                      AND lot.expiry_date > today + program.lot_expiry_buffer_days   (strict >; expiry exactly on the buffered date is EXCLUDED)
      candidate set = all eligible lots
      if candidate set empty -> ERR_NO_ELIGIBLE_INVENTORY
      rank: expiry_date ASC, tie-break created_at ASC (never id)
      allocate greedily: fill from the earliest-expiry lot, overflow to the next
      if sum(quantity_on_hand over candidates) < quantity_units -> reject the WHOLE request with ERR_INSUFFICIENT_INVENTORY (no partial reservation)
    input_set: "InventoryLots of the enrollment's program"
    precision: "integer units"

  - name: shipment_value_cents
    trigger: "Shipment creation (per line) and delivery (aggregate)"
    algorithm: aggregation
    formula: |
      per ShipmentLine: line.value_cents = round_half_up(line.quantity * lot.unit_cost_per_unit * 100)
      shipment.value_cents = sum(line.value_cents over all lines)   # sum of PER-LINE rounded values
    input_set: "ShipmentLines of the shipment"
    precision: "round per line first, then sum; rounding order is pinned and MUST NOT be reversed"

  - name: dispense_event_value_cents
    trigger: "DispenseEvent creation"
    algorithm: aggregation
    formula: |
      per DispenseEvent: event.value_cents = round_half_up(event.quantity * lot.unit_cost_per_unit * 100)
      shipment.dispensed_value_cents = sum(event.value_cents)       # sum of PER-EVENT rounded values
      lot dispensed value for reporting = sum of per-event value_cents over that lot
    input_set: "DispenseEvents of the shipment / lot"
    precision: "round per event first, then sum. For lot cost '12.3456' and two events of 3 units: 3704 + 3704 = 7408 cents, whereas sum-then-round of 6 units would give 7407 cents; the per-event order is the pinned one and the two values deliberately differ."
    variants:
      - name: per_event_rounding
        when: "always (pinned)"
        difference: "Sum of per-event round_half_up values; diverges from aggregate-then-round by cents whenever unit cost has sub-cent precision."

  - name: program_utilization_and_posture
    trigger: "After any commitment/disbursement mutation (approval, renewal, termination, expiry, delivery, appeal overturn) and on every read of GET /pap/programs/{id}/utilization"
    algorithm: aggregation
    formula: |
      total_allocated_cents = sum(allocated_cents over ALL BudgetPeriods of the program, any status)
      total_disbursed_cents = sum(disbursed_cents over ALL Enrollments of the program, any status)
      total_committed_cents = sum(benefit_cap_cents - disbursed_cents over Enrollments with status in {ACTIVE, SUSPENDED})
      utilization_committed_basis_pct = round_half_up((total_committed_cents + total_disbursed_cents) * 100 / total_allocated_cents, 2)   # 0.00 when total_allocated_cents == 0
      utilization_disbursed_basis_pct = round_half_up(total_disbursed_cents * 100 / total_allocated_cents, 2)
      posture: committed_basis >= 100.00 -> EXHAUSTED; committed_basis >= 90.00 -> RESTRICTED; else OPEN
      Boundary is INCLUSIVE: exactly 90.00 -> RESTRICTED; exactly 100.00 -> EXHAUSTED.
    input_set: "All BudgetPeriods and Enrollments of the program"
    constants:
      RESTRICTED_THRESHOLD_PCT: "90.00"
      EXHAUSTED_THRESHOLD_PCT: "100.00"
    precision: "2 decimal places, round_half_up; comparisons against the rounded 2dp value"
    variants:
      - name: committed_basis_forward_looking
        when: "posture derivation and approval gating"
        difference: "Includes remaining commitments of ACTIVE/SUSPENDED enrollments; jumps to 90.00 immediately after an approval with zero shipments."
      - name: disbursed_basis_chronological
        when: "utilization reporting only"
        difference: "Counts delivered actuals only; for identical data it reads 0.00 right after approval, diverging from the committed basis until deliveries occur."

  - name: enrollment_commitment_release
    trigger: "Enrollment transition to TERMINATED, EXPIRED, or CLOSED_RENEWED"
    algorithm: aggregation
    formula: |
      released_cents = benefit_cap_cents - disbursed_cents
      commitment_period.committed_cents -= released_cents
      program totals and posture recomputed per program_utilization_and_posture
      Conserved quantity: for the whole program, total_allocated_cents ==
      total_committed_cents + total_disbursed_cents + unallocated_available_cents at all times.
    input_set: "The transitioning enrollment"

  - name: reconciliation_variance
    trigger: "POST /pap/reconciliation-runs"
    algorithm: aggregation
    formula: |
      coverage requirement: counts[] must include every InventoryLot of the program with status == ACTIVE
      and (quantity_on_hand + quantity_reserved + quantity_shipped) > 0 (ERR_RECONCILIATION_COUNTS_MISSING)
      per counted lot:
        book_on_hand = lot.quantity_on_hand
        variance_units = actual_on_hand - book_on_hand
        variance_value_cents = round_half_up(variance_units * lot.unit_cost_per_unit * 100)   # per-lot rounding
      run.status = CLEAN iff every variance_units == 0 else VARIANCE_FLAGGED
      every lot with variance_units != 0 -> UNDER_INVESTIGATION
    input_set: "Program's lots vs submitted physical counts"
    precision: "integer units; per-lot value round_half_up to cents"

  - name: temporal_window_checks
    trigger: "Application create / renewal create / appeal create / sweep"
    algorithm: threshold
    formula: |
      All dates are logical-clock UTC dates. All windows are CLOSED intervals.
      screening usable:    today <= verified_at_date + program.screening_validity_days
      appeal allowed:      today <= application.decided_at_date + program.appeal_window_days
      renewal allowed:     enrollment.end_date - program.renewal_window_days <= today <= enrollment.end_date
      enrollment expiry:   today > enrollment.end_date  (sweep)
      lot expiry:          today > lot.expiry_date      (sweep)
      budget period overlap (same program): new period [s, e] conflicts with existing [s2, e2] iff NOT (e < s2 OR s > e2); adjacency s == e2 + 1 day is DISJOINT and allowed; a shared single day (s == e2) is an OVERLAP and rejected.
    input_set: "The referenced entity windows"
    precision: "date granularity; inclusive bounds as written"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins on
#     dual failure)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 2.5
    category: existence
    check: "Request schema: required fields present, types match, enums valid, date ranges sane (coverage_end >= coverage_start, period_end >= period_start, actual_on_hand >= 0), conditional inputs present (ytd fields iff YTD_ANNUALIZED; prior_year_income_cents iff PRIOR_YEAR; insurance_coverage_pct iff UNDERINSURED; circumstance-type-specific new_* field); Idempotency-Key header present on POST /pap/shipments"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: Patient role may act only on own resources (patient_id == X-User-ID on screening/application/appeal/circumstance creation, screening submit/revise, application resubmit, renewal creation, own-enrollment PATIENT shipment, PATIENT-destination delivery); Prescriber role may request only PROVIDER shipments to self and deliver only own PROVIDER shipments"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "patient/prescriber-scoped endpoints"
  - priority: 4
    category: existence
    check: "Every id in path and body references an existing resource (program, budget period, patient, prescriber, screening, document, application, appeal, enrollment, circumstance, copay card, lot, shipment, reconciliation run)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4.5
    category: state
    check: "OCC: expected_enrollment_version / expected_program_version equals the parent entity's current version (checked immediately after existence, before all business rules)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pap/enrollments/{id}/renewal-applications; PUT /pap/programs/{id}"
  - priority: 5
    category: state
    check: "Source entity in the required state for the transition (screening DRAFT/SUBMITTED/REJECTED as applicable, document PENDING, application SUBMITTED/UNDER_REVIEW/MORE_INFO_REQUESTED, appeal FILED, enrollment ACTIVE/SUSPENDED, circumstance REPORTED, copay card ACTIVE/not TERMINATED, shipment RESERVED/DISPATCHED/DELIVERED per action, lot ACTIVE, budget period OPEN/CLOSED per action)"
    error_id: "ERR_SCREENING_NOT_DRAFT | ERR_SCREENING_NOT_SUBMITTED | ERR_SCREENING_NOT_REJECTED | ERR_DOCUMENT_NOT_PENDING | ERR_APPLICATION_NOT_SUBMITTED | ERR_APPLICATION_NOT_UNDER_REVIEW | ERR_APPLICATION_NOT_AWAITING_INFO | ERR_APPEAL_NOT_FILED | ERR_ENROLLMENT_NOT_ACTIVE | ERR_ENROLLMENT_NOT_SUSPENDED | ERR_CIRCUMSTANCE_NOT_REPORTED | ERR_COPAY_CARD_NOT_ACTIVE | ERR_COPAY_CARD_TERMINATED | ERR_SHIPMENT_NOT_RESERVED | ERR_SHIPMENT_NOT_DISPATCHED | ERR_SHIPMENT_NOT_CANCELLABLE | ERR_SHIPMENT_NOT_DELIVERED | ERR_LOT_NOT_ACTIVE | ERR_BUDGET_PERIOD_NOT_OPEN"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: business_safety
    check: "Duplication of benefits: no overlapping ACTIVE copay card and no other ACTIVE/SUSPENDED enrollment for (patient, program) at approval/appeal-overturn; no ACTIVE/SUSPENDED enrollment overlapping coverage at copay-card creation. Segregation of duties: appeal decider must differ from application reviewer_id."
    error_id: "ERR_DUPLICATE_BENEFIT_ACTIVE | ERR_SEGREGATION_OF_DUTIES"
    http_status: 409
    applies_to: "POST /pap/applications/{id}/decision; POST /pap/appeals/{id}/decision; POST /pap/copay-cards"
  - priority: 7
    category: business_temporal
    check: "Window rules: screening not stale at application create/approval/reinstate (ERR_SCREENING_STALE); renewal within renewal window (ERR_OUTSIDE_RENEWAL_WINDOW); appeal within appeal window (ERR_APPEAL_WINDOW_EXPIRED); budget period interval geometry disjoint (ERR_BUDGET_PERIOD_OVERLAP)"
    error_id: "ERR_SCREENING_STALE | ERR_OUTSIDE_RENEWAL_WINDOW | ERR_APPEAL_WINDOW_EXPIRED | ERR_BUDGET_PERIOD_OVERLAP"
    http_status: 409
    applies_to: "POST /pap/applications; POST /pap/applications/{id}/decision; POST /pap/enrollments/{id}/renewal-applications; POST /pap/enrollments/{id}/reinstate; POST /pap/applications/{id}/appeals; POST /pap/budget-periods"
  - priority: 8
    category: business_constraint
    check: "Constraint satisfaction: one non-terminal application per (patient, program) for fresh applications (ERR_APPLICATION_ALREADY_EXISTS); one FILED appeal per application (ERR_APPEAL_ALREADY_EXISTS); lot_number unique per program (ERR_LOT_NUMBER_DUPLICATE); copay cards of same patient+program never overlap unless TERMINATED (ERR_COPAY_CARD_OVERLAP); document completeness at submit and acceptance at verify (ERR_DOCUMENTS_INCOMPLETE / ERR_DOCUMENTS_NOT_ACCEPTED); computed eligibility at verify (ERR_PATIENT_INELIGIBLE); idempotency-key reuse with different body (ERR_IDEMPOTENCY_CONFLICT); shipment quantity bounds and FEFO pool (ERR_INVALID_QUANTITY, ERR_SHIPMENT_QUANTITY_LIMIT_EXCEEDED, ERR_NO_ELIGIBLE_INVENTORY, ERR_INSUFFICIENT_INVENTORY); destination rules (ERR_INVALID_DESTINATION, ERR_PRESCRIBER_REQUIRED); dispense line membership and cumulative quantity (ERR_LOT_NOT_IN_SHIPMENT, ERR_DISPENSE_EXCEEDS_RESERVED); reconciliation coverage and lot-program match (ERR_RECONCILIATION_COUNTS_MISSING, ERR_RECONCILIATION_LOT_MISMATCH)"
    error_id: "ERR_APPLICATION_ALREADY_EXISTS | ERR_APPEAL_ALREADY_EXISTS | ERR_LOT_NUMBER_DUPLICATE | ERR_COPAY_CARD_OVERLAP | ERR_DOCUMENTS_INCOMPLETE | ERR_DOCUMENTS_NOT_ACCEPTED | ERR_PATIENT_INELIGIBLE | ERR_IDEMPOTENCY_CONFLICT | ERR_INVALID_QUANTITY | ERR_SHIPMENT_QUANTITY_LIMIT_EXCEEDED | ERR_NO_ELIGIBLE_INVENTORY | ERR_INSUFFICIENT_INVENTORY | ERR_INVALID_DESTINATION | ERR_PRESCRIBER_REQUIRED | ERR_LOT_NOT_IN_SHIPMENT | ERR_DISPENSE_EXCEEDS_RESERVED | ERR_RECONCILIATION_COUNTS_MISSING | ERR_RECONCILIATION_LOT_MISMATCH"
    http_status: 409
    applies_to: "resource creation and action endpoints as named"
  - priority: 9
    category: business_referential
    check: "Cross-references must agree: screening.patient_id == application.patient_id AND screening.program_id == application.program_id (fresh and renewal applications, and reinstatement screening) (ERR_SCREENING_MISMATCH); shipment.prescriber_id required and resolvable for PROVIDER destination"
    error_id: "ERR_SCREENING_MISMATCH | ERR_PRESCRIBER_REQUIRED"
    http_status: 422
    applies_to: "POST /pap/applications; POST /pap/enrollments/{id}/renewal-applications; POST /pap/enrollments/{id}/reinstate; POST /pap/shipments"
  - priority: 10
    category: business_fiscal
    check: "Fiscal gates in fixed order: posture EXHAUSTED blocks all approvals (ERR_PROGRAM_BUDGET_EXHAUSTED); posture RESTRICTED blocks fresh (non-renewal) approvals (ERR_PROGRAM_RESTRICTED); committed + disbursed + new cap <= allocated (ERR_INSUFFICIENT_PROGRAM_BUDGET); an OPEN budget period containing today must exist (ERR_NO_OPEN_BUDGET_PERIOD)"
    error_id: "ERR_PROGRAM_BUDGET_EXHAUSTED | ERR_PROGRAM_RESTRICTED | ERR_INSUFFICIENT_PROGRAM_BUDGET | ERR_NO_OPEN_BUDGET_PERIOD"
    http_status: 402
    applies_to: "POST /pap/applications/{id}/decision {APPROVED}; POST /pap/appeals/{id}/decision {OVERTURNED}"
    note: "HTTP statuses within a priority differ per error id; ordering, not status, resolves dual failures."

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Programs ---
  - method: POST
    path: "/pap/programs"
    description: "Create an AssistanceProgram (posture starts OPEN, totals 0, version 1)"
    roles: [ProgramAdministrator]
    code: 201
    input: [name, product_name, unit_cost_per_unit, max_units_per_enrollment, max_units_per_shipment, max_annual_benefit_cents, enrollment_duration_days, screening_validity_days, appeal_window_days, renewal_window_days, lot_expiry_buffer_days, allow_patient_direct_shipment]
    output: AssistanceProgram
    side_effects: []
  - method: GET
    path: "/pap/programs"
    description: "List programs (pagination envelope)"
    roles: &ALL_ROLES [ProgramAdministrator, CaseWorker, AppealsOfficer, Patient, Prescriber, PharmacyDispenser]
    code: 200
    input: ["limit?", "offset?"]
    output: "AssistanceProgram[]"
    side_effects: []
  - method: GET
    path: "/pap/programs/{id}"
    description: "Get one program (computed posture/totals current as of read)"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: AssistanceProgram
    side_effects: []
  - method: PUT
    path: "/pap/programs/{id}"
    description: "Update program configuration. OCC-guarded. Changes apply prospectively only: existing enrollments keep pinned caps/dates."
    roles: [ProgramAdministrator]
    code: 200
    input: [expected_program_version, "name?", "product_name?", "unit_cost_per_unit?", "max_units_per_enrollment?", "max_units_per_shipment?", "max_annual_benefit_cents?", "enrollment_duration_days?", "screening_validity_days?", "appeal_window_days?", "renewal_window_days?", "lot_expiry_buffer_days?", "allow_patient_direct_shipment?"]
    output: AssistanceProgram
    side_effects: ["increments AssistanceProgram.version by 1"]
  - method: GET
    path: "/pap/programs/{id}/utilization"
    description: "Computed budget & utilization report for the program"
    roles: *ALL_ROLES
    code: 200
    input: []
    output:
      allocated_cents: integer
      committed_cents: integer
      disbursed_cents: integer
      utilization_committed_basis_pct: string
      utilization_disbursed_basis_pct: string
      posture: string
      active_enrollment_count: integer
      open_application_count: integer
    side_effects: []

  # --- Budget periods ---
  - method: POST
    path: "/pap/budget-periods"
    description: "Create a budget period; closed-interval overlap with sibling periods rejected (adjacency start == other.end + 1 day allowed)"
    roles: [ProgramAdministrator]
    code: 201
    input: [program_id, period_start, period_end, allocated_cents]
    output: BudgetPeriod
    side_effects: ["program.total_allocated_cents recomputed"]
  - method: GET
    path: "/pap/budget-periods"
    description: "List budget periods, filterable"
    roles: *ALL_ROLES
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "BudgetPeriod[]"
    side_effects: []
  - method: GET
    path: "/pap/budget-periods/{id}"
    description: "Get one budget period"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: BudgetPeriod
    side_effects: []
  - method: POST
    path: "/pap/budget-periods/{id}/close"
    description: "Close an OPEN budget period"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: BudgetPeriod
    side_effects: ["status -> CLOSED"]

  # --- Patients / Prescribers ---
  - method: POST
    path: "/pap/patients"
    description: "Register a patient (intake)"
    roles: [CaseWorker, ProgramAdministrator]
    code: 201
    input: [full_name, date_of_birth, state_code]
    output: Patient
    side_effects: []
  - method: GET
    path: "/pap/patients/{id}"
    description: "Get a patient"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: POST
    path: "/pap/prescribers"
    description: "Register a prescriber"
    roles: [CaseWorker, ProgramAdministrator]
    code: 201
    input: [full_name, npi_number, state_code]
    output: Prescriber
    side_effects: []
  - method: GET
    path: "/pap/prescribers/{id}"
    description: "Get a prescriber"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Prescriber
    side_effects: []

  # --- Screenings ---
  - method: POST
    path: "/pap/screenings"
    description: "Create an eligibility screening in DRAFT; annualized income and fpl_percent computed immediately"
    roles: [Patient]
    code: 201
    input: [patient_id, program_id, household_size, income_basis, "ytd_income_cents?", "ytd_months_elapsed?", "prior_year_income_cents?", insurance_status, "insurance_coverage_pct?"]
    output: EligibilityScreening
    side_effects: ["annualized_income_cents, fpl_limit_cents, fpl_percent computed"]
  - method: GET
    path: "/pap/screenings"
    description: "List screenings, filterable"
    roles: *ALL_ROLES
    code: 200
    input: ["patient_id?", "program_id?", "status?", "limit?", "offset?"]
    output: "EligibilityScreening[]"
    side_effects: []
  - method: GET
    path: "/pap/screenings/{id}"
    description: "Get a screening"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: EligibilityScreening
    side_effects: []
  - method: POST
    path: "/pap/screenings/{id}/submit"
    description: "Submit a DRAFT screening (required doc types must be uploaded)"
    roles: [Patient]
    code: 200
    input: []
    output: EligibilityScreening
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/pap/screenings/{id}/decision"
    description: "Caseworker verification decision"
    roles: [CaseWorker]
    code: 200
    input: [decision, "rejection_reason?"]
    output: EligibilityScreening
    side_effects: ["status -> VERIFIED | REJECTED; verified_at set on VERIFIED"]
  - method: POST
    path: "/pap/screenings/{id}/revise"
    description: "Return a REJECTED screening to DRAFT (revision loop)"
    roles: [Patient]
    code: 200
    input: []
    output: EligibilityScreening
    side_effects: ["status -> DRAFT; verified_at cleared; documents retained"]

  # --- Screening documents ---
  - method: POST
    path: "/pap/screenings/{id}/documents"
    description: "Upload a supporting document to a screening (allowed while DRAFT or SUBMITTED)"
    roles: [Patient]
    code: 201
    input: [doc_type, file_reference]
    output: ScreeningDocument
    side_effects: []
  - method: GET
    path: "/pap/screenings/{id}/documents"
    description: "List a screening's documents"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "ScreeningDocument[]"
    side_effects: []
  - method: POST
    path: "/pap/documents/{id}/review"
    description: "Caseworker accepts or rejects a PENDING document"
    roles: [CaseWorker]
    code: 200
    input: [decision, "review_note?"]
    output: ScreeningDocument
    side_effects: ["status -> ACCEPTED | REJECTED"]

  # --- Applications ---
  - method: POST
    path: "/pap/applications"
    description: "Create a fresh (non-renewal) application in SUBMITTED"
    roles: [Patient]
    code: 201
    input: [patient_id, program_id, screening_id]
    output: Application
    side_effects: []
  - method: GET
    path: "/pap/applications"
    description: "List applications, filterable"
    roles: *ALL_ROLES
    code: 200
    input: ["patient_id?", "program_id?", "screening_id?", "enrollment_id?", "renewal_of_enrollment_id?", "status?", "limit?", "offset?"]
    output: "Application[]"
    side_effects: []
  - method: GET
    path: "/pap/applications/{id}"
    description: "Get an application"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: "/pap/applications/{id}/claim"
    description: "Caseworker claims a SUBMITTED application"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> UNDER_REVIEW; reviewer_id = X-User-ID"]
  - method: POST
    path: "/pap/applications/{id}/request-info"
    description: "Reviewer requests more information"
    roles: [CaseWorker]
    code: 200
    input: [info_request_note]
    output: Application
    side_effects: ["status -> MORE_INFO_REQUESTED"]
  - method: POST
    path: "/pap/applications/{id}/resubmit"
    description: "Patient answers the info request; reviewer retained"
    roles: [Patient]
    code: 200
    input: ["resubmission_note?"]
    output: Application
    side_effects: ["status -> UNDER_REVIEW"]
  - method: POST
    path: "/pap/applications/{id}/decision"
    description: "Reviewer approves or denies; approval creates the Enrollment and commits budget"
    roles: [CaseWorker]
    code: 200
    input: [decision, "decision_reason?"]
    output: Application
    side_effects: ["status -> APPROVED | DENIED; on APPROVED: Enrollment created, budget committed, posture recomputed; renewal approval closes prior enrollment"]
  - method: POST
    path: "/pap/applications/{id}/appeals"
    description: "Patient files an appeal of a DENIED application within the appeal window"
    roles: [Patient]
    code: 201
    input: [grounds]
    output: Appeal
    side_effects: []

  # --- Appeals ---
  - method: GET
    path: "/pap/appeals"
    description: "List appeals, filterable"
    roles: *ALL_ROLES
    code: 200
    input: ["application_id?", "status?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []
  - method: GET
    path: "/pap/appeals/{id}"
    description: "Get an appeal"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/pap/appeals/{id}/decision"
    description: "AppealsOfficer upholds or overturns; overturn re-runs approval gates and creates the Enrollment"
    roles: [AppealsOfficer]
    code: 200
    input: [decision, "decision_reason?"]
    output: Appeal
    side_effects: ["status -> UPHELD | OVERTURNED; on OVERTURNED: application DENIED -> APPROVED, Enrollment created, budget committed, posture recomputed"]

  # --- Enrollments ---
  - method: GET
    path: "/pap/enrollments"
    description: "List enrollments, filterable"
    roles: *ALL_ROLES
    code: 200
    input: ["patient_id?", "program_id?", "application_id?", "commitment_budget_period_id?", "status?", "limit?", "offset?"]
    output: "Enrollment[]"
    side_effects: []
  - method: GET
    path: "/pap/enrollments/{id}"
    description: "Get an enrollment"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: POST
    path: "/pap/enrollments/{id}/renewal-applications"
    description: "Patient files a renewal application inside the renewal window; supersedes prior non-terminal renewal applications of this enrollment; OCC-guarded"
    roles: [Patient]
    code: 201
    input: [screening_id, expected_enrollment_version]
    output: Application
    side_effects: ["creates Application with renewal_of_enrollment_id = enrollment.id; supersedes that enrollment's non-terminal renewal applications; increments Enrollment.version by 1"]
  - method: POST
    path: "/pap/enrollments/{id}/terminate"
    description: "Terminate an ACTIVE or SUSPENDED enrollment; releases remaining commitment and cancels RESERVED shipments"
    roles: [CaseWorker]
    code: 200
    input: [termination_reason]
    output: Enrollment
    side_effects: ["status -> TERMINATED; RESERVED shipments -> CANCELLED with lot release; remaining commitment released; posture recomputed"]
  - method: POST
    path: "/pap/enrollments/{id}/reinstate"
    description: "Reinstate a SUSPENDED enrollment with a fresh VERIFIED screening"
    roles: [CaseWorker]
    code: 200
    input: [screening_id]
    output: Enrollment
    side_effects: ["status -> ACTIVE"]

  # --- Changes of circumstance ---
  - method: POST
    path: "/pap/enrollments/{id}/circumstances"
    description: "Report a change of circumstance on an ACTIVE or SUSPENDED enrollment"
    roles: [Patient, CaseWorker]
    code: 201
    input: [circumstance_type, "new_annual_income_cents?", "new_household_size?", "new_insurance_status?", "note?"]
    output: ChangeOfCircumstance
    side_effects: []
  - method: GET
    path: "/pap/circumstances"
    description: "List circumstances, filterable"
    roles: *ALL_ROLES
    code: 200
    input: ["enrollment_id?", "status?", "limit?", "offset?"]
    output: "ChangeOfCircumstance[]"
    side_effects: []
  - method: GET
    path: "/pap/circumstances/{id}"
    description: "Get a circumstance"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: ChangeOfCircumstance
    side_effects: []
  - method: POST
    path: "/pap/circumstances/{id}/review"
    description: "Caseworker applies (suspend/terminate) or dismisses the circumstance"
    roles: [CaseWorker]
    code: 200
    input: [decision, "review_note?"]
    output: ChangeOfCircumstance
    side_effects: ["status -> APPLIED | DISMISSED; on APPLIED_*: enrollment cascade per Enrollment transitions"]

  # --- Copay cards ---
  - method: POST
    path: "/pap/copay-cards"
    description: "Issue a copay card (duplication-of-benefits and card-overlap checks)"
    roles: [CaseWorker]
    code: 201
    input: [patient_id, program_id, coverage_start, coverage_end]
    output: CopayCard
    side_effects: []
  - method: GET
    path: "/pap/copay-cards"
    description: "List copay cards, filterable"
    roles: *ALL_ROLES
    code: 200
    input: ["patient_id?", "program_id?", "status?", "limit?", "offset?"]
    output: "CopayCard[]"
    side_effects: []
  - method: GET
    path: "/pap/copay-cards/{id}"
    description: "Get a copay card"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: CopayCard
    side_effects: []
  - method: POST
    path: "/pap/copay-cards/{id}/suspend"
    description: "Suspend an ACTIVE copay card (a SUSPENDED card does not block PAP approval)"
    roles: [CaseWorker]
    code: 200
    input: []
    output: CopayCard
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/pap/copay-cards/{id}/terminate"
    description: "Terminate an ACTIVE or SUSPENDED copay card"
    roles: [CaseWorker]
    code: 200
    input: ["reason?"]
    output: CopayCard
    side_effects: ["status -> TERMINATED"]

  # --- Inventory ---
  - method: POST
    path: "/pap/inventory-lots"
    description: "Receive an inventory lot"
    roles: [ProgramAdministrator]
    code: 201
    input: [program_id, lot_number, quantity_received, unit_cost_per_unit, expiry_date]
    output: InventoryLot
    side_effects: ["quantity_on_hand = quantity_received"]
  - method: GET
    path: "/pap/inventory-lots"
    description: "List lots, filterable"
    roles: *ALL_ROLES
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "InventoryLot[]"
    side_effects: []
  - method: GET
    path: "/pap/inventory-lots/{id}"
    description: "Get a lot"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: InventoryLot
    side_effects: []
  - method: POST
    path: "/pap/inventory-lots/{id}/quarantine"
    description: "Quarantine an ACTIVE lot (excluded from FEFO; existing reservations unaffected)"
    roles: [ProgramAdministrator]
    code: 200
    input: [reason]
    output: InventoryLot
    side_effects: ["status -> QUARANTINED"]
  - method: GET
    path: "/pap/inventory-lots/{id}/lines"
    description: "List shipment lines allocated from this lot"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "ShipmentLine[]"
    side_effects: []
  - method: GET
    path: "/pap/inventory-lots/{id}/dispense-events"
    description: "List dispense events recorded against this lot"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "DispenseEvent[]"
    side_effects: []

  # --- Shipments ---
  - method: POST
    path: "/pap/shipments"
    description: "Request a shipment; reserves inventory via FEFO at creation. Idempotency-Key header REQUIRED (may alternatively be supplied as body field idempotency_key): same key + same body replays the original 201 response without side effects; same key + different body -> ERR_IDEMPOTENCY_CONFLICT."
    roles: [CaseWorker, Patient, Prescriber]
    code: 201
    input: [enrollment_id, quantity_units, destination, "prescriber_id?", "idempotency_key?"]
    output: Shipment
    side_effects: ["ShipmentLines created; lot on_hand -> reserved per line; enrollment.remaining_units -= quantity_units; value_cents computed per line"]
  - method: GET
    path: "/pap/shipments"
    description: "List shipments, filterable"
    roles: *ALL_ROLES
    code: 200
    input: ["enrollment_id?", "prescriber_id?", "status?", "limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []
  - method: GET
    path: "/pap/shipments/{id}"
    description: "Get a shipment"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/pap/shipments/{id}/lines"
    description: "List a shipment's allocation lines"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "ShipmentLine[]"
    side_effects: []
  - method: POST
    path: "/pap/shipments/{id}/dispatch"
    description: "Dispatch a RESERVED shipment (all line lots must still be ACTIVE)"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> DISPATCHED; per line lot reserved -> shipped"]
  - method: POST
    path: "/pap/shipments/{id}/deliver"
    description: "Confirm delivery; moves value from committed to disbursed on enrollment and budget period"
    roles: [CaseWorker, Prescriber, Patient]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> DELIVERED; enrollment.disbursed_cents += value_cents; commitment period disbursed += value_cents; posture recomputed"]
  - method: POST
    path: "/pap/shipments/{id}/cancel"
    description: "Cancel a RESERVED shipment (compensates the reservation)"
    roles: [CaseWorker]
    code: 200
    input: ["reason?"]
    output: Shipment
    side_effects: ["status -> CANCELLED; per line lot reserved -> on_hand; enrollment.remaining_units restored"]
  - method: POST
    path: "/pap/shipments/{id}/return"
    description: "Return a DISPATCHED shipment; units quarantined, not restocked"
    roles: [CaseWorker]
    code: 200
    input: ["reason?"]
    output: Shipment
    side_effects: ["status -> RETURNED; per line lot shipped -> quarantined; remaining_units NOT restored"]

  # --- Dispensing ---
  - method: POST
    path: "/pap/shipments/{id}/dispense-events"
    description: "Record dispensing of a DELIVERED shipment, per lot"
    roles: [PharmacyDispenser]
    code: 201
    input: [lot_id, quantity, "dispensed_at?"]
    output: DispenseEvent
    side_effects: ["lot quantity_shipped -> quantity_dispensed; line.dispensed_quantity += quantity; shipment.dispensed_value_cents += per-event rounded value"]
  - method: GET
    path: "/pap/shipments/{id}/dispense-events"
    description: "List dispense events of a shipment"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "DispenseEvent[]"
    side_effects: []

  # --- Reconciliation ---
  - method: POST
    path: "/pap/reconciliation-runs"
    description: "Reconcile physical counts against book inventory for a CLOSED budget period; bulk per-lot results; flagged lots go UNDER_INVESTIGATION"
    roles: [ProgramAdministrator]
    code: 201
    input: [program_id, budget_period_id, counts]
    output: ReconciliationRun
    side_effects: ["status computed CLEAN | VARIANCE_FLAGGED; lots with variance != 0 -> UNDER_INVESTIGATION"]
  - method: GET
    path: "/pap/reconciliation-runs"
    description: "List reconciliation runs, filterable"
    roles: *ALL_ROLES
    code: 200
    input: ["program_id?", "budget_period_id?", "status?", "limit?", "offset?"]
    output: "ReconciliationRun[]"
    side_effects: []
  - method: GET
    path: "/pap/reconciliation-runs/{id}"
    description: "Get a reconciliation run with per-lot lines"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: ReconciliationRun
    side_effects: []

  # --- Test-driving endpoints (outside the public business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-05-01T00:00:00Z; the clock NEVER falls back to wall-clock time. All date windows (screening validity, appeal window, renewal window, expiries, budget-period containment) read this clock."
    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: string
    side_effects: ["logical clock set"]
  - method: POST
    path: "/_system/run-daily-sweep"
    description: "Run the daily system sweep in pinned order: (1) VERIFIED screenings past validity -> STALE; (2) ACTIVE/SUSPENDED enrollments past end_date -> EXPIRED (with shipment-cancellation and commitment-release cascades); (3) ACTIVE lots past expiry_date -> EXPIRED (on_hand -> quarantined)"
    roles: [ProgramAdministrator]
    code: 200
    input: ["program_id?"]
    output:
      staled_screening_ids: string[]
      expired_enrollment_ids: string[]
      expired_lot_ids: string[]
      cancelled_shipment_ids: string[]
    side_effects: ["sweep transitions per state machines"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-User-Role header missing or role not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Caller role not permitted on this endpoint" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Entity-backed caller (Patient/Prescriber) acting on a resource it does not own" }
  # --- request / existence / concurrency ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum, invalid date range, missing conditional input, missing Idempotency-Key header on shipment creation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_enrollment_version / expected_program_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "Idempotency-Key reused with a different request body" }
  # --- screening ---
  - { id: ERR_SCREENING_NOT_DRAFT, http: 409, condition: "Submit requires status DRAFT" }
  - { id: ERR_SCREENING_NOT_SUBMITTED, http: 409, condition: "Verification decision requires status SUBMITTED" }
  - { id: ERR_SCREENING_NOT_REJECTED, http: 409, condition: "Revise requires status REJECTED" }
  - { id: ERR_SCREENING_NOT_VERIFIED, http: 409, condition: "Screening backing an application/reinstatement must have status VERIFIED" }
  - { id: ERR_SCREENING_STALE, http: 409, condition: "today > verified_at_date + screening_validity_days at application create / approval / reinstatement" }
  - { id: ERR_SCREENING_MISMATCH, http: 422, condition: "Screening patient_id/program_id does not match the application's (or enrollment's) patient/program" }
  - { id: ERR_DOCUMENTS_INCOMPLETE, http: 409, condition: "Submit lacks an uploaded document for a required doc_type" }
  - { id: ERR_DOCUMENTS_NOT_ACCEPTED, http: 409, condition: "VERIFIED decision while any uploaded document is not ACCEPTED" }
  - { id: ERR_DOCUMENT_NOT_PENDING, http: 409, condition: "Document review requires status PENDING" }
  - { id: ERR_PATIENT_INELIGIBLE, http: 422, condition: "Computed eligibility_determination is INELIGIBLE (fpl above threshold or insurance status not assistance-eligible)" }
  # --- application / appeal ---
  - { id: ERR_APPLICATION_ALREADY_EXISTS, http: 409, condition: "A non-terminal fresh application already exists for (patient, program)" }
  - { id: ERR_APPLICATION_NOT_SUBMITTED, http: 409, condition: "Claim requires status SUBMITTED" }
  - { id: ERR_APPLICATION_NOT_UNDER_REVIEW, http: 409, condition: "Decision/request-info requires status UNDER_REVIEW" }
  - { id: ERR_APPLICATION_NOT_AWAITING_INFO, http: 409, condition: "Resubmit requires status MORE_INFO_REQUESTED" }
  - { id: ERR_REVIEWER_MISMATCH, http: 403, condition: "Only the claiming CaseWorker (reviewer_id) may request info or decide" }
  - { id: ERR_APPLICATION_NOT_DENIED, http: 409, condition: "Appeal requires application status DENIED" }
  - { id: ERR_APPEAL_ALREADY_EXISTS, http: 409, condition: "A FILED appeal already exists for this application" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 409, condition: "today > decided_at_date + appeal_window_days" }
  - { id: ERR_APPEAL_NOT_FILED, http: 409, condition: "Appeal decision requires status FILED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Appeal decider X-User-ID equals the application's reviewer_id" }
  # --- duplication / copay ---
  - { id: ERR_DUPLICATE_BENEFIT_ACTIVE, http: 409, condition: "Overlapping ACTIVE copay card or another ACTIVE/SUSPENDED enrollment for (patient, program) blocks approval; symmetric check blocks copay card issuance over an overlapping ACTIVE/SUSPENDED enrollment" }
  - { id: ERR_COPAY_CARD_OVERLAP, http: 409, condition: "Another non-TERMINATED copay card for (patient, program) overlaps the requested coverage interval" }
  - { id: ERR_COPAY_CARD_NOT_ACTIVE, http: 409, condition: "Suspend requires status ACTIVE" }
  - { id: ERR_COPAY_CARD_TERMINATED, http: 409, condition: "Action on a TERMINATED copay card" }
  # --- enrollment ---
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Action requires enrollment status ACTIVE (or ACTIVE/SUSPENDED where noted); fired for terminated/expired/closed enrollments and for shipments against SUSPENDED enrollments" }
  - { id: ERR_ENROLLMENT_NOT_SUSPENDED, http: 409, condition: "Reinstate requires status SUSPENDED" }
  - { id: ERR_OUTSIDE_RENEWAL_WINDOW, http: 409, condition: "Renewal application outside [end_date - renewal_window_days, end_date]" }
  - { id: ERR_CIRCUMSTANCE_NOT_REPORTED, http: 409, condition: "Circumstance review requires status REPORTED" }
  # --- fiscal ---
  - { id: ERR_PROGRAM_BUDGET_EXHAUSTED, http: 402, condition: "Program posture EXHAUSTED (committed basis >= 100.00) blocks every approval" }
  - { id: ERR_PROGRAM_RESTRICTED, http: 403, condition: "Program posture RESTRICTED (committed basis >= 90.00) blocks fresh (non-renewal) approvals" }
  - { id: ERR_INSUFFICIENT_PROGRAM_BUDGET, http: 402, condition: "committed + disbursed + new benefit cap would exceed total allocated" }
  - { id: ERR_NO_OPEN_BUDGET_PERIOD, http: 409, condition: "No OPEN budget period contains today's date at approval/overturn time" }
  - { id: ERR_BUDGET_PERIOD_OVERLAP, http: 409, condition: "New period's closed interval intersects an existing period of the same program (same-day touch is an overlap; adjacency of exactly one day is allowed)" }
  - { id: ERR_BUDGET_PERIOD_NOT_OPEN, http: 409, condition: "Close requires status OPEN" }
  - { id: ERR_BUDGET_PERIOD_NOT_CLOSED, http: 409, condition: "Reconciliation run requires a CLOSED budget period" }
  # --- shipment / inventory / dispensing ---
  - { id: ERR_INVALID_QUANTITY, http: 400, condition: "quantity < 1 (or actual_on_hand < 0 in reconciliation counts)" }
  - { id: ERR_SHIPMENT_QUANTITY_LIMIT_EXCEEDED, http: 422, condition: "quantity_units exceeds program.max_units_per_shipment or enrollment.remaining_units" }
  - { id: ERR_INVALID_DESTINATION, http: 400, condition: "destination PATIENT while program.allow_patient_direct_shipment is false" }
  - { id: ERR_PRESCRIBER_REQUIRED, http: 400, condition: "destination PROVIDER without prescriber_id (or prescriber_id supplied for PATIENT destination)" }
  - { id: ERR_PRESCRIBER_MISMATCH, http: 403, condition: "Prescriber caller is not the shipment's prescriber_id (delivery) or requested a PROVIDER shipment to another prescriber (creation)" }
  - { id: ERR_NO_ELIGIBLE_INVENTORY, http: 409, condition: "FEFO candidate set is empty (no ACTIVE lot of the program with on_hand > 0 and expiry beyond the buffer)" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Sum of on_hand over eligible lots is below quantity_units; whole request rejected, no partial reservation" }
  - { id: ERR_LOT_NUMBER_DUPLICATE, http: 409, condition: "lot_number already exists within the program" }
  - { id: ERR_LOT_NOT_ACTIVE, http: 409, condition: "Dispatch requires every line lot ACTIVE; quarantine requires ACTIVE" }
  - { id: ERR_LOT_NOT_IN_SHIPMENT, http: 409, condition: "Dispense event references a lot that is not among the shipment's lines" }
  - { id: ERR_DISPENSE_EXCEEDS_RESERVED, http: 409, condition: "Cumulative dispensed quantity for (shipment, lot) would exceed the line quantity" }
  - { id: ERR_SHIPMENT_NOT_RESERVED, http: 409, condition: "Dispatch requires status RESERVED" }
  - { id: ERR_SHIPMENT_NOT_DISPATCHED, http: 409, condition: "Deliver/return requires status DISPATCHED" }
  - { id: ERR_SHIPMENT_NOT_CANCELLABLE, http: 409, condition: "Cancel requires status RESERVED" }
  - { id: ERR_SHIPMENT_NOT_DELIVERED, http: 409, condition: "Dispense events require shipment status DELIVERED" }
  # --- reconciliation ---
  - { id: ERR_RECONCILIATION_COUNTS_MISSING, http: 422, condition: "counts[] omits an ACTIVE lot with book units (on_hand + reserved + shipped) > 0" }
  - { id: ERR_RECONCILIATION_LOT_MISMATCH, http: 422, condition: "counts[] references a lot that does not belong to the run's program" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdministrator
    description: "Foundation operations administrator: program configuration, budget periods, inventory lots, reconciliation, logical clock and sweeps"
    identity: opaque
    exclusive_operations:
      - "POST /pap/programs; PUT /pap/programs/{id}"
      - "POST /pap/budget-periods; POST /pap/budget-periods/{id}/close"
      - "POST /pap/inventory-lots; POST /pap/inventory-lots/{id}/quarantine"
      - "POST /pap/reconciliation-runs"
      - "POST /_clock/set_current_utc; POST /_system/run-daily-sweep"
    shared_operations:
      - "POST /pap/patients; POST /pap/prescribers (intake, shared with CaseWorker)"
      - "All GET endpoints"
  - name: CaseWorker
    description: "Foundation caseworker: intake, document review, screening decisions, application review/decisions, circumstance review, copay card administration, shipment lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /pap/documents/{id}/review; POST /pap/screenings/{id}/decision"
      - "POST /pap/applications/{id}/claim; /request-info; /decision"
      - "POST /pap/circumstances/{id}/review"
      - "POST /pap/copay-cards; /copay-cards/{id}/suspend; /terminate"
      - "POST /pap/enrollments/{id}/terminate; /reinstate"
      - "POST /pap/shipments/{id}/dispatch; /cancel; /return"
    shared_operations:
      - "POST /pap/patients; POST /pap/prescribers; POST /pap/enrollments/{id}/circumstances; POST /pap/shipments; POST /pap/shipments/{id}/deliver"
      - "All GET endpoints"
  - name: AppealsOfficer
    description: "Independent appeal reviewer; MUST NOT be the same X-User-ID as the application's reviewer_id (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /pap/appeals/{id}/decision"
    shared_operations:
      - "All GET endpoints"
  - name: Patient
    description: "Applicant/enrollee acting on their own records only (ownership: patient_id == X-User-ID)"
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /pap/screenings; /screenings/{id}/submit; /revise; /screenings/{id}/documents"
      - "POST /pap/applications; /applications/{id}/resubmit; /applications/{id}/appeals"
      - "POST /pap/enrollments/{id}/renewal-applications"
    shared_operations:
      - "POST /pap/enrollments/{id}/circumstances; POST /pap/shipments (own ACTIVE enrollment, destination PATIENT only); POST /pap/shipments/{id}/deliver (own PATIENT-destination shipment)"
      - "All GET endpoints"
  - name: Prescriber
    description: "Treating provider receiving PROVIDER-destination shipments (ownership: prescriber_id == X-User-ID)"
    identity: "entity_backed:Prescriber"
    exclusive_operations: []
    shared_operations:
      - "POST /pap/shipments (destination PROVIDER to self only); POST /pap/shipments/{id}/deliver (own PROVIDER-destination shipment)"
      - "All GET endpoints"
  - name: PharmacyDispenser
    description: "Dispensing pharmacist recording dispense events"
    identity: opaque
    exclusive_operations:
      - "POST /pap/shipments/{id}/dispense-events"
    shared_operations:
      - "All GET endpoints"
