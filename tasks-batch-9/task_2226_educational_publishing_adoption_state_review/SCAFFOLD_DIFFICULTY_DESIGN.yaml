  # ===========================================================================
  # Rule 3 - non-linear state-machine shapes on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: submission_parallel_review_and_pricing_dimensions
        grounds:
          - state_machines.Submission.review_status=FILED_to_review_status=DRAFT
          - state_machines.Submission.pricing_status=PRICE_FILED_to_pricing_status=PRICE_APPROVED
          - entities.Submission.fields.review_status
          - entities.Submission.fields.pricing_status
        distinguishing_aspect: |
          Submission carries two independent dimensions on one row: withdrawing with reason REVISE
          walks review_status FILED -> DRAFT while pricing_status stays PRICE_APPROVED and the
          PricingProposal stays APPROVED, so the review axis moved backwards without touching the
          pricing axis.
        test_recipe:
          setup:
            - "State OK is OPEN_TERRITORY with sampling_copies_required 0 and min_verified_coverage_pct 50.00"
            - "Cycle 2027 is OPEN at clock 2026-09-15 and the submission is FILED"
            - "A PricingProposal on that submission has been APPROVED by the state, so pricing_status is PRICE_APPROVED"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "OK", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_ok_id: $.data.id }
            - call: "POST /state-profiles/${st_ok_id}/standards"
              payload: { subject: "MATH", standard_code: "OK.M.5.1", grade_low: 5, grade_high: 5, weight: 3 }
              as: StateAdoptionOfficer
              as_user_id: "${st_ok_id}"
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_ok_id}", subject: "MATH", cycle_year: 2027, submission_open_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-01T00:00:00Z", committee_review_at: "2026-10-15T00:00:00Z", public_comment_start_at: "2026-11-01T00:00:00Z", public_comment_end_at: "2026-11-15T00:00:00Z", adoption_decision_at: "2026-12-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_ok_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000000901", subject: "MATH", grade_low: 5, grade_high: 5, copyright_year: 2026, content_tags: ["FRACTION_FLUENCY"], page_count: 300, signature_page_capacity: 384, list_price_cents: 9500 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "OK.M.5.1", depth_level: "MASTERY", page_reference: "pp. 20-48", evidence_citation: "Unit 2 teaches and assesses the standard to mastery." }
              as: PublisherEditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_ok_id}"
            - call: "POST /submissions/${sub_id}/file"
              payload: {}
              as: PublisherEditor
            - call: "GET /submissions/${sub_id}"
              payload: {}
              as: PricingManager
              captures: { sub_v1: $.data.version }
            - call: "POST /pricing-proposals"
              payload: { submission_id: "${sub_id}", base_price_cents: 9500, term_years: 2, annual_escalator_bps: 0, projected_adoption_units: 500, digital_seat_price_cents: 1400, expected_submission_version: "${sub_v1}" }
              as: PricingManager
              captures: { prop_id: $.data.id }
            - call: "POST /pricing-proposals/${prop_id}/decision"
              payload: { verdict: "APPROVE" }
              as: StateAdoptionOfficer
              as_user_id: "${st_ok_id}"
          trigger:
            - call: "POST /submissions/${sub_id}/withdraw"
              payload: { reason: "REVISE" }
              as: PublisherEditor
          assert:
            - "Submission.${sub_id}.review_status == DRAFT"
            - "Submission.${sub_id}.pricing_status == PRICE_APPROVED"
            - "Submission.${sub_id}.pinned_content_revision == null"
            - "PricingProposal.${prop_id}.status == APPROVED"
            - "AdoptionCycle.${cyc_id}.submission_count == 0"

      - name: content_edit_reject_resubmit_cycle_hits_revision_ceiling
        grounds:
          - state_machines.ContentEdit.PROPOSED_to_REJECTED
          - state_machines.ContentEdit.REJECTED_to_PROPOSED
          - validations[priority=57]
          - entities.ContentEdit.fields.revision_round
        distinguishing_aspect: |
          ContentEdit is cyclic on a different entity from Submission: PROPOSED -> REJECTED ->
          PROPOSED runs three times, revision_round reaches exactly 3, and the fourth resubmit is
          refused with ERR_EDIT_REVISION_LIMIT_REACHED (409) because revision_round is no longer
          < MAX_REVISION_ROUNDS.
        test_recipe:
          setup:
            - "State ID is OPEN_TERRITORY and requires the topic FINANCIAL_LITERACY"
            - "Title ID-SS-9 is DRAFT with content_tags [CIVIC_DUTY]"
            - "Editor ed-1 proposed a content edit; director dir-1 rejected it three times and ed-1 resubmitted twice, leaving revision_round 3 and status REJECTED"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "ID", adoption_model: "OPEN_TERRITORY", required_topics: ["FINANCIAL_LITERACY"] }
              as: PlatformAdmin
              captures: { st_id_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000001001", subject: "SOCIAL_STUDIES", grade_low: 9, grade_high: 9, copyright_year: 2026, content_tags: ["CIVIC_DUTY"], page_count: 300, signature_page_capacity: 384, list_price_cents: 9100 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /content-edits"
              payload: { title_id: "${ttl_id}", state_id: "${st_id_id}", edit_type: "ADD_REQUIRED_TOPIC", topic_code: "FINANCIAL_LITERACY", pages_delta: 24, rationale: "Adds the state-required personal finance lessons to unit 4." }
              as: PublisherEditor
              as_user_id: "ed-1"
              captures: { ce_id: $.data.id }
            - call: "POST /content-edits/${ce_id}/review"
              payload: { verdict: "REJECT", rejection_reason: "Lesson sequence conflicts with the pacing guide." }
              as: EditorialDirector
              as_user_id: "dir-1"
            - call: "POST /content-edits/${ce_id}/resubmit"
              payload: { rationale: "Re-sequenced the finance lessons after unit 3." }
              as: PublisherEditor
              as_user_id: "ed-1"
            - call: "POST /content-edits/${ce_id}/review"
              payload: { verdict: "REJECT", rejection_reason: "Page budget impact still understated." }
              as: EditorialDirector
              as_user_id: "dir-1"
            - call: "POST /content-edits/${ce_id}/resubmit"
              payload: { pages_delta: 16, rationale: "Trimmed the insert to sixteen pages." }
              as: PublisherEditor
              as_user_id: "ed-1"
            - call: "POST /content-edits/${ce_id}/review"
              payload: { verdict: "REJECT", rejection_reason: "Art program not yet cleared." }
              as: EditorialDirector
              as_user_id: "dir-1"
          trigger:
            - call: "POST /content-edits/${ce_id}/resubmit"
              payload: { rationale: "Art clearance now attached to the file." }
              as: PublisherEditor
              as_user_id: "ed-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_EDIT_REVISION_LIMIT_REACHED"
            - "ContentEdit.${ce_id}.revision_round == 3"
            - "ContentEdit.${ce_id}.status == REJECTED"
            - "ContentEdit.${ce_id}.pages_delta == 16"

      - name: slot_tally_branches_diverge_on_same_panel
        grounds:
          - state_machines.PresentationSlot.PRESENTED_to_TALLIED
          - calculations.committee_tally
          - entities.PresentationSlot.fields.tally_outcome
          - entities.PricingProposal.fields.contract_locked
          - entities.Title.fields.adopted_state_codes
