# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3093_advisory_loss_cost_filing_standard_form_licensing
#
# Depth probe: two instances per §0.5 Difficulty Rule (18 total). Every grounds
# entry resolves into SCAFFOLD.yaml §1.1–§1.7; every setup_api_calls chain is
# replayable from empty-DB using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (LossCostFiling indication vs MemberInsurer quality score).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: filing_indication_exponential_vs_linear_diverge_on_identical_cells
        grounds:
          - calculations.trend_factor
          - calculations.indicated_change
          - state_machines.LossCostFiling.IN_ACTUARIAL_REVIEW_to_REVIEWED
        distinguishing_aspect: |
          On identical cell data, EXPONENTIAL_LEAST_SQUARES compounds the trend
          ((1+0.04)^2.5) while LINEAR_LEAST_SQUARES applies it flat (1+0.04*2.5),
          so the same filing body yields indicated_change_pct 1.1102 under
          exponential and 0.8333 under linear — a dual-variant divergence on the
          LossCostFiling domain.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z (never set)."
            - "Two single-cell filings identical except trend_selection: F_EXP exponential, F_LIN linear; each cell earned_premium_cents=1000000, incurred_loss_cents=550000, weight_pct=100, current_loss_cost_cents=120000."
          setup_api_calls:
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-001", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "EXPONENTIAL_LEAST_SQUARES", effective_date: "2027-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { f_exp: $.data.id }
            - call: "POST /bureau/filings/${f_exp}/cells"
              payload: { class_code: "C1", earned_premium_cents: 1000000, incurred_loss_cents: 550000, weight_pct: 100, current_loss_cost_cents: 120000 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_exp}/submit-review"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-002", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "LINEAR_LEAST_SQUARES", effective_date: "2027-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { f_lin: $.data.id }
            - call: "POST /bureau/filings/${f_lin}/cells"
              payload: { class_code: "C1", earned_premium_cents: 1000000, incurred_loss_cents: 550000, weight_pct: 100, current_loss_cost_cents: 120000 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_lin}/submit-review"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/filings/${f_exp}/complete-review"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/filings/${f_lin}/complete-review"
              payload: {}
              as: BureauActuary
          assert:
            - "LossCostFiling.${f_exp}.indicated_change_pct == 1.1102"
            - "LossCostFiling.${f_lin}.indicated_change_pct == 0.8333"
            - "LossCostFiling.${f_exp}.indicated_change_pct != LossCostFiling.${f_lin}.indicated_change_pct"
            - "LossCostFiling.${f_exp}.filing_status == REVIEWED and LossCostFiling.${f_lin}.filing_status == REVIEWED"

      - name: insurer_quality_score_recency_decay_vs_flat_average_diverge
        grounds:
          - calculations.submission_quality_score
          - state_machines.StatisticalSubmission.EDITING_to_REJECTED
          - state_machines.StatisticalSubmission.EDITING_to_ACCEPTED_WITH_WARNINGS
          - entities.MemberInsurer.fields.quality_score_bps
        distinguishing_aspect: |
          The pinned recency-decay variant (geometric weights 1, 0.5 by recency
          rank) yields quality_score_bps 9733 for a two-disposition history
          (recent ACCEPTED_WITH_WARNINGS 9900 points, older REJECTED 9400
          points), while the rejected flat-average variant would yield 9650 —
          a dual-variant divergence on the MemberInsurer domain, distinct from
          the LossCostFiling indication domain of the sibling instance.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "One ACTIVE insurer, one ACTIVE statistical plan; insurer has two terminal submissions: older REJECTED with 3 ERROR findings (9400 points), most recent ACCEPTED_WITH_WARNINGS with 2 WARNING findings (9900 points)."
          setup_api_calls:
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-Q1", legal_name: "Quality One Mutual" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /bureau/statistical-plans"
              payload: { plan_code: "SP-CP", line_of_business: "COMMERCIAL_PROPERTY", min_premium_cents: 10000, max_record_age_months: 60 }
              as: BureauAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /bureau/statistical-plans/${plan_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/submissions"
              payload: { insurer_id: "${ins_id}", plan_id: "${plan_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", record_count: 100, written_premium_cents: 5000000 }
              as: InsurerUser
              as_user_id: "${ins_id}"
              captures: { sub1: $.data.id }
            - call: "POST /bureau/submissions/${sub1}/begin-edit"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/submissions/${sub1}/findings"
              payload: { edit_code: "E-101", severity: "ERROR", affected_records: 1 }
              as: BureauAdmin
            - call: "POST /bureau/submissions/${sub1}/findings"
              payload: { edit_code: "E-102", severity: "ERROR", affected_records: 1 }
              as: BureauAdmin
            - call: "POST /bureau/submissions/${sub1}/findings"
              payload: { edit_code: "E-103", severity: "ERROR", affected_records: 1 }
              as: BureauAdmin
            - call: "POST /bureau/submissions/${sub1}/dispose"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/submissions"
              payload: { insurer_id: "${ins_id}", plan_id: "${plan_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", record_count: 50, written_premium_cents: 2000000 }
              as: InsurerUser
              as_user_id: "${ins_id}"
              captures: { sub2: $.data.id }
            - call: "POST /bureau/submissions/${sub2}/begin-edit"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/submissions/${sub2}/findings"
              payload: { edit_code: "W-201", severity: "WARNING", affected_records: 1 }
              as: BureauAdmin
            - call: "POST /bureau/submissions/${sub2}/findings"
              payload: { edit_code: "W-202", severity: "WARNING", affected_records: 1 }
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/submissions/${sub2}/dispose"
              payload: {}
              as: BureauAdmin
          assert:
            - "StatisticalSubmission.${sub2}.submission_status == ACCEPTED_WITH_WARNINGS"
            - "MemberInsurer.${ins_id}.quality_score_bps == 9733"
            - "MemberInsurer.${ins_id}.quality_score_bps != 9650"
            - "StatisticalSubmission.${sub2}.accepted_record_count == 50 and error_finding_count == 0 and warning_finding_count == 2"

  # ===========================================================================
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes —
  # mode (a) tiered/normalized weighted aggregation, mode (b) nested rounding
  # order.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: indicated_change_weight_normalization_above_100
        grounds:
          - calculations.indicated_change
          - calculations.trend_factor
        distinguishing_aspect: |
          Mode (a) combinatorial: the formula takes >=3 inputs (per-cell raw
          ratios, weights, trend selection) with non-linear interaction —
          weights summing to 120 force the scale-down branch (factor 100/120),
          and the result 14.8979 differs from both the unscaled blend (17.8775)
          and the residual-branch blend (9.1608 when weights sum to 80).
        test_recipe:
          setup:
            - "Logical clock at default. One exponential filing with two cells: C1 earned 2000000/incurred 1100000/weight 60 (indication 1.1102 unscaled), C2 earned 1000000/incurred 700000/weight 60 (indication 28.6857 unscaled); weight_sum 120 > 100 engages the normalization branch."
          setup_api_calls:
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-010", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "EXPONENTIAL_LEAST_SQUARES", effective_date: "2027-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { f_id: $.data.id }
            - call: "POST /bureau/filings/${f_id}/cells"
              payload: { class_code: "C1", earned_premium_cents: 2000000, incurred_loss_cents: 1100000, weight_pct: 60, current_loss_cost_cents: 120000 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/cells"
              payload: { class_code: "C2", earned_premium_cents: 1000000, incurred_loss_cents: 700000, weight_pct: 60, current_loss_cost_cents: 80000 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/submit-review"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/filings/${f_id}/complete-review"
              payload: {}
              as: BureauActuary
          assert:
            - "LossCostFiling.${f_id}.indicated_change_pct == 14.8979"
            - "LossCostFiling.${f_id}.indicated_change_pct != 17.8775"
            - "LossCostFiling.${f_id}.filing_status == REVIEWED"

      - name: lcm_premium_per_cell_round_then_sum_beats_sum_then_round
        grounds:
          - calculations.lcm_premium
          - state_machines.LossCostMultiplierAdoption.PENDING_to_AUTHORIZED
        distinguishing_aspect: |
          Mode (b) nested rounding: three cells of 101 cents at multiplier 150
          give 151.5 cents per cell; the pinned per-cell-round-then-sum order
          yields 456, while sum-then-round yields 455 — a one-cent delta the
          test must pin to the declared rounding order.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z."
            - "EFFECTIVE TX filing with three cells of current_loss_cost_cents=101 each; ACTIVE insurer with a covering LicenseAgreement; TX department with max_lcm_deviation_pct=100 (150 is within band)."
          setup_api_calls:
            - call: "POST /bureau/departments"
              payload: { state_code: "TX", department_name: "Texas Department of Insurance", objection_window_days: 30, max_lcm_deviation_pct: 100 }
              as: BureauAdmin
              captures: { dept_tx: $.data.id }
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-L1", legal_name: "LCM One Insurance" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /bureau/agreements"
              payload: { insurer_id: "${ins_id}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-12-31T00:00:00Z", royalty_rate_bps: 250 }
              as: BureauAdmin
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-020", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "EXPONENTIAL_LEAST_SQUARES", effective_date: "2026-09-02T00:00:00Z" }
              as: BureauAdmin
              captures: { f_id: $.data.id }
            - call: "POST /bureau/filings/${f_id}/cells"
              payload: { class_code: "C1", earned_premium_cents: 1000000, incurred_loss_cents: 550000, weight_pct: 40, current_loss_cost_cents: 101 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/cells"
              payload: { class_code: "C2", earned_premium_cents: 1000000, incurred_loss_cents: 550000, weight_pct: 30, current_loss_cost_cents: 101 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/cells"
              payload: { class_code: "C3", earned_premium_cents: 1000000, incurred_loss_cents: 550000, weight_pct: 30, current_loss_cost_cents: 101 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/submit-review"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/complete-review"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/filings/${f_id}/file"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/finalize"
              payload: {}
              as: BureauAdmin
              captures: { f_v: $.data.version }
            - call: "POST /bureau/adoptions"
              payload: { insurer_id: "${ins_id}", filing_id: "${f_id}", multiplier_pct: 150, expected_filing_version: "${f_v}" }
              as: InsurerUser
              as_user_id: "${ins_id}"
              captures: { ad_id: $.data.id }
          trigger:
            - call: "POST /bureau/adoptions/${ad_id}/authorize"
              payload: {}
              as: BureauAdmin
          assert:
            - "LossCostMultiplierAdoption.${ad_id}.adoption_status == AUTHORIZED"
            - "LossCostMultiplierAdoption.${ad_id}.authorized_premium_cents == 456"
            - "LossCostMultiplierAdoption.${ad_id}.authorized_premium_cents != 455"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine: cyclic version-chain machine on
  # LossCostFiling vs parallel-dimension machine on FormVariant (different
  # entities).
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: filing_objection_resubmission_cycle_advances_version_chain
        grounds:
          - state_machines.LossCostFiling.FILED_to_OBJECTED
          - state_machines.LossCostFiling.OBJECTED_to_DRAFT
          - concurrency_rules[filing-resubmission-stale-superseded]
        distinguishing_aspect: |
          Cyclic machine: DRAFT->...->FILED->OBJECTED loops back to DRAFT on a
          NEW chain node (filing_version 2) while the objected node is
          compensated to WITHDRAWN — a cycle across the self-referential
          supersedes chain, on LossCostFiling.
        test_recipe:
          setup:
            - "Logical clock at default. TX department (window 30 days); a TX filing carried to FILED, then objected within window."
          setup_api_calls:
            - call: "POST /bureau/departments"
              payload: { state_code: "TX", department_name: "Texas Department of Insurance", objection_window_days: 30, max_lcm_deviation_pct: 25 }
              as: BureauAdmin
              captures: { dept_tx: $.data.id }
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-030", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "LINEAR_LEAST_SQUARES", effective_date: "2027-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { f1: $.data.id, f1_v: $.data.version }
            - call: "POST /bureau/filings/${f1}/cells"
              payload: { class_code: "C1", earned_premium_cents: 1000000, incurred_loss_cents: 550000, weight_pct: 100, current_loss_cost_cents: 120000 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f1}/submit-review"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/filings/${f1}/complete-review"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/filings/${f1}/file"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/filings/${f1}/objections"
              payload: { department_id: "${dept_tx}", objection_code: "R-01", objection_text: "Trend selection inadequately justified" }
              as: RegulatorAnalyst
              as_user_id: "${dept_tx}"
              captures: { f1_v_obj: $.data.id }
            - call: "GET /bureau/filings/${f1}"
              payload: {}
              as: BureauAdmin
              captures: { f1_v_after_obj: $.data.version }
          trigger:
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-030", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "EXPONENTIAL_LEAST_SQUARES", effective_date: "2027-03-01T00:00:00Z", supersedes_filing_id: "${f1}", expected_superseded_version: "${f1_v_after_obj}" }
              as: BureauAdmin
              captures: { f2: $.data.id }
          assert:
            - "LossCostFiling.${f2}.filing_version == 2 and filing_status == DRAFT"
            - "LossCostFiling.${f2}.supersedes_filing_id == ${f1}"
            - "LossCostFiling.${f1}.filing_status == WITHDRAWN"
            - "LossCostFiling.${f1}.version == ${f1_v_after_obj} + 1"

      - name: form_variant_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.FormVariant
          - state_machines.PolicyForm.IN_REVIEW_to_APPROVED
          - state_machines.PolicyForm.APPROVED_to_PUBLISHED
        distinguishing_aspect: |
          Parallel-dimension machine on FormVariant: review_status
          (PENDING->CLEARED) and publication_status
          (UNPUBLISHED->SCHEDULED->LIVE) advance on independent triggers —
          clear moves only the review dimension; circular publish moves only
          the publication dimension; the clock moves SCHEDULED->LIVE — a
          non-linear shape on a different entity than the sibling instance's
          LossCostFiling cycle.
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z. One POLICY_FORM with a single CW variant; form carried to APPROVED; one DRAFT circular listing the form with implementation_date 2026-10-01."
          setup_api_calls:
            - call: "POST /bureau/forms"
              payload: { form_number: "CP-00-01", form_title: "Commercial Property Coverage Form", form_kind: "POLICY_FORM" }
              as: BureauAdmin
              captures: { form_id: $.data.id }
            - call: "POST /bureau/forms/${form_id}/variants"
              payload: { state_code: "CW", variant_text_ref: "txt/cp0001/cw", effective_from: "2026-10-01T00:00:00Z", effective_to: null }
              as: BureauAdmin
              captures: { var_id: $.data.id }
            - call: "POST /bureau/forms/${form_id}/submit-review"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/variants/${var_id}/clear"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/forms/${form_id}/approve"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/circulars"
              payload: { circular_number: "CIR-2026-07", subject: "Publication of CP-00-01", implementation_date: "2026-10-01T00:00:00Z", form_ids: ["${form_id}"] }
              as: BureauAdmin
              captures: { circ_id: $.data.id }
          trigger:
            - call: "POST /bureau/circulars/${circ_id}/publish"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: BureauAdmin
            - call: "GET /bureau/variants/${var_id}"
              payload: {}
              as: BureauAdmin
          assert:
            - "after clear and before publish: FormVariant.${var_id}.review_status == CLEARED and publication_status == UNPUBLISHED (review dimension moved alone)"
            - "after publish: FormVariant.${var_id}.publication_status == SCHEDULED while review_status stays CLEARED"
            - "after clock reaches implementation_date: FormVariant.${var_id}.publication_status == LIVE"
            - "PolicyForm.${form_id}.form_status == PUBLISHED"

  # ===========================================================================
  # Rule 4 — transitive_cascade: depth-3 cascade from circular publish vs
  # depth-2 cascade from agreement terminate (different triggers).
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: circular_publish_cascades_form_then_variant
        grounds:
          - state_machines.Circular.DRAFT_to_PUBLISHED
          - state_machines.PolicyForm.APPROVED_to_PUBLISHED
          - state_machines.FormVariant.publication_status=UNPUBLISHED_to_publication_status=SCHEDULED
        distinguishing_aspect: |
          Depth-3 chain: publishing Circular mutates PolicyForm
          (APPROVED->PUBLISHED); that mutation itself triggers the FormVariant
          cascade (UNPUBLISHED->SCHEDULED) — the variant change is caused by
          the form change, not directly by the publish call.
        test_recipe:
          setup:
            - "Logical clock at default. One form with one CLEARED CW variant, form APPROVED; one DRAFT circular listing the form, implementation_date in the future."
          setup_api_calls:
            - call: "POST /bureau/forms"
              payload: { form_number: "CP-00-02", form_title: "Causes of Loss Form", form_kind: "POLICY_FORM" }
              as: BureauAdmin
              captures: { form_id: $.data.id }
            - call: "POST /bureau/forms/${form_id}/variants"
              payload: { state_code: "CW", variant_text_ref: "txt/cp0002/cw", effective_from: "2026-11-01T00:00:00Z", effective_to: null }
              as: BureauAdmin
              captures: { var_id: $.data.id }
            - call: "POST /bureau/forms/${form_id}/submit-review"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/variants/${var_id}/clear"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/forms/${form_id}/approve"
              payload: {}
              as: BureauActuary
            - call: "POST /bureau/circulars"
              payload: { circular_number: "CIR-2026-11", subject: "Publication of CP-00-02", implementation_date: "2026-11-01T00:00:00Z", form_ids: ["${form_id}"] }
              as: BureauAdmin
              captures: { circ_id: $.data.id }
          trigger:
            - call: "POST /bureau/circulars/${circ_id}/publish"
              payload: {}
              as: BureauAdmin
          assert:
            - "Circular.${circ_id}.circular_status == PUBLISHED"
            - "PolicyForm.${form_id}.form_status == PUBLISHED"
            - "FormVariant.${var_id}.publication_status == SCHEDULED"
            - "FormVariant.${var_id}.review_status == CLEARED"

      - name: agreement_terminate_cascades_to_pending_adoption_withdrawal
        grounds:
          - state_machines.LicenseAgreement.ACTIVE_to_TERMINATED
          - state_machines.LossCostMultiplierAdoption.PENDING_to_WITHDRAWN
        distinguishing_aspect: |
          Depth-2 chain from a different trigger than the sibling instance:
          terminating LicenseAgreement mutates the insurer's PENDING
          LossCostMultiplierAdoption rows to WITHDRAWN (reason
          LICENCE_TERMINATED) — a cascade originating at agreement terminate,
          not at circular publish.
        test_recipe:
          setup:
            - "Logical clock at default. EFFECTIVE TX filing; ACTIVE insurer with ACTIVE agreement and one PENDING adoption against the filing."
          setup_api_calls:
            - call: "POST /bureau/departments"
              payload: { state_code: "TX", department_name: "Texas Department of Insurance", objection_window_days: 30, max_lcm_deviation_pct: 25 }
              as: BureauAdmin
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-T1", legal_name: "Terminate One Mutual" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /bureau/agreements"
              payload: { insurer_id: "${ins_id}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-12-31T00:00:00Z", royalty_rate_bps: 250 }
              as: BureauAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /bureau/filings"
              payload: { filing_code: "LC-TX-CP-040", state_code: "TX", line_of_business: "COMMERCIAL_PROPERTY", trend_selection: "LINEAR_LEAST_SQUARES", effective_date: "2026-09-02T00:00:00Z" }
              as: BureauAdmin
              captures: { f_id: $.data.id }
            - call: "POST /bureau/filings/${f_id}/cells"
              payload: { class_code: "C1", earned_premium_cents: 1000000, incurred_loss_cents: 550000, weight_pct: 100, current_loss_cost_cents: 120000 }
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/submit-review"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/filings/${f_id}/complete-review"
              payload: {}
