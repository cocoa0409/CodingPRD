  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_start_blocked_by_lazily_expired_agreement
        grounds:
          - validations[priority=18]
          - state_machines.ConfidentialityAgreement.EXECUTED_to_EXPIRED
          - errors[ERR_CONFIDENTIALITY_NOT_EXECUTED]
          - entities.Matter.fields.staffed_reviewer_count
        distinguishing_aspect: "The gate lives on a DIFFERENT entity than the target and is TIME-DERIVED: Assignment.start is refused because the ConfidentialityAgreement row silently becomes EXPIRED when the clock passes coverage_end_utc, with no write ever touching the agreement."
        test_recipe:
          setup:
            - "the staffed IN_REVIEW core matter with Reviewer A's agreement EXECUTED over [2026-08-01, 2026-10-31]"
            - "Batch 1 (400 documents) is ASSIGNED to Reviewer A and Assignment a1 is still ASSIGNED"
            - "the logical clock is then advanced to 2026-11-01T00:00:00Z, one day past coverage_end_utc"
          setup_api_calls:
            - *k_clock
            - *k_client
            - *k_matter
            - *k_proto
            - *k_proto_submit
            - *k_proto_approve
            - *k_rev_a
            - *k_rev_a_verify
            - *k_screen_a
            - *k_screen_a_clear
            - *k_ca_a
            - *k_ca_a_exec
            - *k_sess_a
            - *k_sess_a_active
            - *k_batch1
            - *k_assign_a1
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: EngagementManager
          trigger:
            - call: "POST /assignments/${a1_id}/start"
              payload: {}
              as: Reviewer
              as_user_id: "${ra_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with response.data.error_id == \"ERR_CONFIDENTIALITY_NOT_EXECUTED\", not ERR_CREDENTIAL_NOT_VERIFIED and not ERR_INVALID_STATE"
            - "ConfidentialityAgreement.${caa_id}.status == EXPIRED — lazy expiry applied while the request evaluated the gate"
            - "Matter.${m_id}.staffed_reviewer_count == 0 and Matter.${m_id}.status == STAFFING"
            - "Assignment.${a1_id}.status == ASSIGNED with committed_amount_cents 85200 — expiry voids nothing"
            - "Matter.${m_id}.committed_spend_cents == 85200"
            - "Reviewer.${ra_id}.credential_status == VERIFIED and engagement_status == ENGAGED"

      - name: qc_sample_validator_must_not_hold_batch_assignment
        grounds:
          - validations[priority=21]
          - errors[ERR_QC_VALIDATOR_CONFLICT]
          - entities.QCSample.fields.validated_by_reviewer_id
        distinguishing_aspect: "A SEGREGATION dependency between two sibling rows rather than a time-derived parent state: the QCSample is refused because the named validator holds a non-VOIDED Assignment on the very batch being sampled, and the identical call with an unassigned reviewer succeeds."
        test_recipe:
          setup:
            - "the staffed IN_REVIEW core matter with Batch 1 (400 documents) coded and SUBMITTED by Reviewer A"
            - "Reviewer C is VERIFIED but holds no assignment anywhere"
          setup_api_calls:
            - *k_clock
            - *k_client
            - *k_matter
            - *k_proto
            - *k_proto_submit
            - *k_proto_approve
            - *k_rev_a
            - *k_rev_a_verify
            - *k_screen_a
            - *k_screen_a_clear
            - *k_ca_a
            - *k_ca_a_exec
            - *k_sess_a
            - *k_sess_a_active
            - *k_batch1
            - *k_assign_a1
            - *k_start_a1
            - *k_progress_a1_full
            - *k_submit_a1
            - *k_rev_c
          trigger:
            - call: "POST /batches/${b1_id}/qc-samples"
              payload: { validated_by_reviewer_id: "${ra_id}" }
              as: QCLead
              captures: { err: $.data.error_id }
            - call: "POST /batches/${b1_id}/qc-samples"
              payload: { validated_by_reviewer_id: "${rc_id}" }
              as: QCLead
              captures: { ok_sample_id: $.data.id }
          assert:
            - "first trigger call: HTTP 409 with response.data.error_id == \"ERR_QC_VALIDATOR_CONFLICT\""
            - "second trigger call: HTTP 201 with response.data.validated_by_reviewer_id == ${rc_id} and sampled_document_count == 40"
            - "GET /qc-samples?batch_id=${b1_id} returns exactly 1 row, whose outcome is PENDING"
            - "Batch.${b1_id}.status == QC_SAMPLING both before and after the refused call"
            - "Assignment.${a1_id}.status == SUBMITTED and billable_amount_cents == 85200"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: onsite_seat_overlap_is_half_open
        grounds:
          - validations[priority=31]
          - calculations.onsite_seat_occupancy
          - errors[ERR_ONSITE_SEATS_EXHAUSTED]
          - entities.Matter.fields.onsite_seat_count
        distinguishing_aspect: "The seat interval is HALF-OPEN: a third window that genuinely straddles both held seats is refused, while a window starting at the exact instant the second seat's window ends is admitted — touching endpoints do NOT collide for seats."
        test_recipe:
          setup:
            - "the core matter with onsite_seat_count 2, protocol APPROVED"
            - "Reviewers A, B and E are each VERIFIED, CLEARED and EXECUTED on the matter with coverage [2026-08-01, 2026-10-31]"
            - "Reviewer A holds a SCHEDULED ONSITE_SECURE window [2026-08-01, 2026-08-05)"
            - "Reviewer B holds a SCHEDULED ONSITE_SECURE window [2026-08-03, 2026-08-07)"
