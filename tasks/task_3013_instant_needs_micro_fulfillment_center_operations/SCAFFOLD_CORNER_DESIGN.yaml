          trigger:
            - call: "POST /mfc/replenish-orders"
              payload: { site_id: "${site_id}", reference: "PO-IDEM", lines: [ { product_id: "${prod_chips}", qty: 7, unit_cost_cents: 200 } ], expected_at: "2026-09-11T08:00:00Z", idempotency_key: "same-key-1" }
