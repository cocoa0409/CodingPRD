            - "after the second trigger: BeverageProduct.${prod_id}.registration_state == REGISTERED"
            - "after the second trigger: BeverageProduct.${prod_id}.registered_at == 2026-08-05T09:00:00Z"
            - "after the second trigger: BeverageProduct.${prod_id}.rejection_reason == null and version == 3"
            - "both trigger responses have status 200"

