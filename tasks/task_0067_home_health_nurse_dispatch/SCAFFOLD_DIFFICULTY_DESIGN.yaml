  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: episode_not_active_beats_discipline_mismatch
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        distinguishing_aspect: |
          Scheduling a visit on a DRAFT episode with a discipline that also mismatches the clinician fails
          state (ERR_EPISODE_NOT_ACTIVE, priority 6) before business_safety (ERR_DISCIPLINE_MISMATCH, priority 8):
          a state vs business_safety category pair.
        test_recipe:
          setup:
            - "Clock 2026-02-01; WOUND config active."
            - "Episode left in DRAFT (not activated); an RN clinician exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-01T08:00:00Z" }
