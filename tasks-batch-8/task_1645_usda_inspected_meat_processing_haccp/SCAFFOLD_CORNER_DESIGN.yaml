        claim_type: valid_transition
        grounds: [state_machines.LabelApproval.REJECTED_to_SUBMITTED]
        distinguishing_aspect: "Label cyclic path: DRAFT -> SUBMITTED -> REJECTED -> SUBMITTED -> APPROVED, with approved_formulation_version pinned at approval."
        test_recipe:
          setup: ["plant; label DRAFT with claims [GRASS_FED] and one substantiation ref"]
          setup_api_calls:
