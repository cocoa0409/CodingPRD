  # ---------------------------------------------------------------------------
  # Rule 4: transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: notice_serve_cascade_lease_offer_concession
        grounds:
          - state_machines.NonRenewalNotice.DRAFT_to_SERVED
          - state_machines.Lease.RENEWAL_PENDING_to_NON_RENEWAL_NOTICED
          - state_machines.RenewalOffer.COUNTERED_to_WITHDRAWN
          - state_machines.ConcessionApproval.SUBMITTED_to_VOIDED
        distinguishing_aspect: |
          Depth-3 chain triggered by the notice serve endpoint: serve mutates the lease
          RENEWAL_PENDING -> NON_RENEWAL_NOTICED (link 1); the lease leaving an issuable status
          withdraws the COUNTERED offer (link 2, caused by the lease mutation); the offer's
          withdrawal voids its SUBMITTED ConcessionApproval (link 3, caused by the offer
          transition, not by the serve directly).
        test_recipe:
          setup:
            - "Policy CA-OAK; property band [18,18]; unit market 220000; lease rent 200000, 2026-06-01 + 12mo"
            - "Offer BALANCED (proposed 210800) issued; resident counters 205000 -> COUNTERED; concession for 205000 (275 bps) SUBMITTED by user_la_1"
            - "Notice OWNER_OCCUPANCY effective 2027-06-01 created by user_la_1 at default clock 2026-05-01 (lead 396 days >= 60; effective >= term_end)"
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /properties"
              payload: { name: "Serve Cascade House", rent_cap_policy_id: "${pol}", min_term_months: 18, max_term_months: 18 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "702", bedrooms: 2, current_market_rent_cents: 220000 }
              as: PlatformAdmin
              captures: { unit: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Ana Sousa", email: "ana.sousa@x.com" }
              as: PlatformAdmin
              captures: { res: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: $.data.id, lease_v: $.data.version }
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "BALANCED", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { offer: $.data.id }
            - call: "POST /renewal-offers/${offer}/issue"
              payload: {}
              as: LeasingAgent
            - call: "POST /renewal-offers/${offer}/respond"
              payload: { response_type: "COUNTER", counter_rent_cents: 205000 }
              as: Resident
              as_user_id: "${res}"
            - call: "POST /renewal-offers/${offer}/concession-approvals"
              payload: { requested_rent_cents: 205000, reason: "long tenure" }
              as: LeasingAgent
              as_user_id: "user_la_1"
              captures: { conc: $.data.id, conc_bps: $.data.concession_bps }
            - call: "POST /leases/${lease}/non-renewal-notices"
              payload: { cause_type: "OWNER_OCCUPANCY", effective_date: "2027-06-01" }
              as: LeasingAgent
              as_user_id: "user_la_1"
              captures: { notice: $.data.id }
          trigger:
            - call: "POST /non-renewal-notices/${notice}/serve"
              payload: {}
              as: PropertyManager
              as_user_id: "user_pm_1"
            - call: "GET /leases/${lease}"
              as: PropertyManager
              captures: { l_status: $.data.status }
            - call: "GET /renewal-offers/${offer}"
              as: PropertyManager
              captures: { o_status: $.data.status }
            - call: "GET /concession-approvals/${conc}"
              as: PropertyManager
              captures: { c_status: $.data.status }
          assert:
            - "conc_bps == 275 (round_half_up(5800/210800*10000))"
            - "link 1: l_status == NON_RENEWAL_NOTICED"
            - "link 2: o_status == WITHDRAWN (caused by the lease leaving an issuable status)"
            - "link 3: c_status == VOIDED (caused by the offer withdrawal, not the serve itself)"

      - name: offer_create_supersede_cascade
        grounds:
          - state_machines.RenewalOffer.COUNTERED_to_SUPERSEDED
          - state_machines.ConcessionApproval.SUBMITTED_to_VOIDED
          - concurrency_rules[offer-create-stale-lease]
        distinguishing_aspect: |
          Depth-2 chain from a different trigger than the sibling (offer creation with supersede,
          not notice serve): creating offer B supersedes the open offer A (link 1); A's supersession
          voids A's SUBMITTED ConcessionApproval (link 2, caused by A's transition, not by the
          create directly); the new offer records supersedes_offer_id == A and the lease stays
          RENEWAL_PENDING because B is itself open.
        test_recipe:
          setup:
            - "Policy CA-OAK; property band [18,18]; unit market 220000; lease rent 200000, 2026-06-01 + 12mo"
            - "Offer A BALANCED (proposed 210800) issued; resident counters 205000 -> COUNTERED; concession for 205000 (275 bps) SUBMITTED by user_la_1"
            - "Lease version re-read immediately before the trigger (issue bumped it to 3)"
          setup_api_calls:
            - call: "POST /rent-cap-policies"
              payload: { jurisdiction_code: "CA-OAK", base_cap_bps: 400, cpi_adjustment_bps: 150, hard_ceiling_bps: 900, high_increase_threshold_bps: 500, notice_days_low: 60, notice_days_high: 90, non_renewal_notice_days: 60 }
              as: PlatformAdmin
              captures: { pol: $.data.id }
            - call: "POST /properties"
              payload: { name: "Supersede Court", rent_cap_policy_id: "${pol}", min_term_months: 18, max_term_months: 18 }
              as: PlatformAdmin
              captures: { prop: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop}", unit_number: "703", bedrooms: 2, current_market_rent_cents: 220000 }
              as: PlatformAdmin
              captures: { unit: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Ben Okafor", email: "ben.okafor@x.com" }
              as: PlatformAdmin
              captures: { res: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${unit}", resident_id: "${res}", term_start_date: "2026-06-01", term_months: 12, monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease: $.data.id, lease_v: $.data.version }
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "BALANCED", expected_lease_version: "${lease_v}" }
              as: LeasingAgent
              captures: { offer_a: $.data.id }
            - call: "POST /renewal-offers/${offer_a}/issue"
              payload: {}
              as: LeasingAgent
            - call: "POST /renewal-offers/${offer_a}/respond"
              payload: { response_type: "COUNTER", counter_rent_cents: 205000 }
              as: Resident
              as_user_id: "${res}"
            - call: "POST /renewal-offers/${offer_a}/concession-approvals"
              payload: { requested_rent_cents: 205000, reason: "retention" }
              as: LeasingAgent
              as_user_id: "user_la_1"
              captures: { conc: $.data.id }
            - call: "GET /leases/${lease}"
              as: PropertyManager
              captures: { lease_v3: $.data.version }
          trigger:
            - call: "POST /leases/${lease}/renewal-offers"
              payload: { rate_strategy: "CONSERVATIVE", expected_lease_version: "${lease_v3}" }
              as: LeasingAgent
              captures: { offer_b: $.data.id, sup: $.data.supersedes_offer_id }
            - call: "GET /renewal-offers/${offer_a}"
              as: PropertyManager
              captures: { a_status: $.data.status }
            - call: "GET /concession-approvals/${conc}"
              as: PropertyManager
              captures: { c_status: $.data.status }
            - call: "GET /leases/${lease}"
              as: PropertyManager
              captures: { l_status: $.data.status }
          assert:
            - "offer B created with sup == ${offer_a} (link 1: A SUPERSEDED by the create)"
            - "a_status == SUPERSEDED"
            - "link 2: c_status == VOIDED (caused by A's supersession, not by the create directly)"
            - "l_status == RENEWAL_PENDING (no revert: B is itself an open offer)"

  # ---------------------------------------------------------------------------
  # Rule 5: validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_cap_on_revise_wrong_state
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_OFFER_NOT_COUNTERED]
          - errors[ERR_RENT_CAP_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (P7) vs business_safety (P8): one revise request violates both —
          the offer is ISSUED not COUNTERED (state) and 212000 implies 600 bps > cap 550 (safety).
          The state error ERR_OFFER_NOT_COUNTERED (409) must win because P7 precedes P8.
        test_recipe:
          setup:
            - "Policy CA-OAK (cap 550); property band [18,18]; unit market 220000; lease rent 200000"
            - "Offer BALANCED proposed 210800, ISSUED (never countered)"
          setup_api_calls:
