# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth walk over SCAFFOLD.yaml §1.1–§1.7 per the claim-extraction guide.
# claim_type values follow the guide's per-section rows; sections are the
# guide's nine. Instances already exercised by §1.8 appear as
# excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  # ------------------------------------------------------------- entities ---
  - section: entities
    instances:
      - name: payer_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Payer.fields.status, entities.Payer.fields.appeal_policy_review_required]
        distinguishing_aspect: "Omitting status on create yields ACTIVE, appeal_policy_review_required false, version 1, server-minted UUID id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "MEDICARE", default_timely_filing_days: 90 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id, p_status: $.data.status, p_flag: $.data.appeal_policy_review_required, p_v: $.data.version }
          assert:
            - "create response status == ACTIVE, appeal_policy_review_required == false, version == 1"
            - "id is a server-minted UUID (no type prefix), created_at/updated_at present"

      - name: denial_intake_derives_computed_fields
        claim_type: computed_fields
        grounds: [entities.DenialCase.fields.category, entities.DenialCase.fields.next_appeal_deadline, calculations.appeal_deadline_schedule]
        distinguishing_aspect: "Intake derives category from the remittance code and the level-1 deadline from the payer policy (remit 2026-08-01 + 60 days = 2026-09-30); open balance equals the denied amount and priority is 0.00/LOW while RECEIVED."
        test_recipe:
          setup: ["payer A with level-1 policy (60d)", "code CO-16 (category CODING, default department CODING)"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
          trigger:
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2001", patient_account_number: "PA-2001", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id, d_cat: $.data.category, d_dl: $.data.next_appeal_deadline, d_open: $.data.open_balance_cents, d_status: $.data.status, d_score: $.data.priority_score, d_bucket: $.data.queue_bucket }
          assert:
            - "status == RECEIVED (initial state) and category == CODING (copied from the remittance code)"
            - "next_appeal_deadline == 2026-09-30 (2026-08-01 + 60 days)"
            - "open_balance_cents == 250000, recovered_amount_cents == 0, written_off_cents == 0, current_appeal_level == 0"
            - "priority_score == 0.00 and queue_bucket == LOW (RECEIVED is outside the scored input set)"

      - name: denial_intake_missing_payer_id_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required payer_id field is rejected with ERR_VALIDATION (400) before any existence check runs."
        test_recipe:
          setup: ["code CO-16 registered"]
          setup_api_calls:
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
          trigger:
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2002", patient_account_number: "PA-2002", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"
            - "GET /rcm/denial-cases afterwards returns an empty data array"

      - name: denial_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_DENIAL_NOT_FOUND]"]
        distinguishing_aspect: "Reading a well-formed but nonexistent denial id yields ERR_DENIAL_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /rcm/denial-cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: DenialsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DENIAL_NOT_FOUND and http status 404"

      - name: denial_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more per the fixed pagination envelope (defaults limit 10)."
        test_recipe:
          setup: ["payer A, code CO-16, three denials CLM-2003/2004/2005 recorded"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2003", patient_account_number: "PA-2003", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2004", patient_account_number: "PA-2004", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2005", patient_account_number: "PA-2005", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
          trigger:
            - call: "GET /rcm/denial-cases"
              payload: { limit: 2, offset: 0 }
              as: DenialsSpecialist
            - call: "GET /rcm/denial-cases"
              payload: { limit: 2, offset: 2 }
              as: DenialsSpecialist
          assert:
            - "first page: exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page: exactly 1 row, total_count == 3, has_more == false"

      - name: denial_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.DenialCase.fields.status]
        distinguishing_aspect: "Client-supplied id/created_at/updated_at/version in the create body are ignored; the server mints its own values."
        test_recipe:
          setup: ["payer A, code CO-16"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
          trigger:
            - call: "POST /rcm/denial-cases"
              payload: { id: "11111111-2222-3333-4444-555555555555", created_at: "1999-01-01T00:00:00.000Z", updated_at: "1999-01-01T00:00:00.000Z", version: 99, claim_number: "CLM-2006", patient_account_number: "PA-2006", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d_id: $.data.id, d_v: $.data.version }
          assert:
            - "response id != 11111111-2222-3333-4444-555555555555 (server-minted UUID)"
            - "version == 1 and created_at reflects the logical clock, not the supplied 1999 timestamp"

      - name: appeal_level_chain_self_reference
        claim_type: parent_relationships
        grounds: [entities.Appeal.fields.previous_appeal_id]
        distinguishing_aspect: "The level-2 appeal's previous_appeal_id points at the level-1 appeal (self-referential FK), and the filtered list GET /rcm/appeals?previous_appeal_id= resolves the child."
        test_recipe:
          setup: ["payer A with level-1 (60d) and level-2 (45d) policies; code CO-16; denial CLM-2007 (denied 100000) QUEUED; level-1 appeal submitted and UPHELD at 2026-08-10"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 2, timely_filing_days: 45, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2007", patient_account_number: "PA-2007", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 120000, denied_amount_cents: 100000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { ap1: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap1}", document_type: "CLINICAL_NOTES", file_reference: "doc-2007-notes" }
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/generate-letter"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RevenueCycleDirector
            - call: "POST /rcm/appeals/${ap1}/submit"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/record-outcome"
              payload: { outcome: "UPHELD", recovered_amount_cents: 0 }
              as: DenialsSpecialist
          trigger:
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { ap2: $.data.id, ap2_prev: $.data.previous_appeal_id, ap2_level: $.data.level_number }
            - call: "GET /rcm/appeals"
              payload: { previous_appeal_id: "${ap1}" }
              as: DenialsManager
              captures: { child0: "$.data[0].id" }
          assert:
            - "level-2 appeal: level_number == 2 and previous_appeal_id == the level-1 appeal id"
            - "GET /rcm/appeals?previous_appeal_id=<level-1 id> returns exactly the level-2 appeal"
            - "denial current_appeal_level == 2 and next_appeal_deadline == 2026-09-24 (outcome 2026-08-10 + 45 days)"

  # -------------------------------------------------------- state machines ---
  - section: state_machines
    instances:
      - name: triage_on_triaged_denial_rejected
        claim_type: invalid_transition
        grounds: [state_machines.DenialCase.RECEIVED_to_TRIAGED, "errors[ERR_DENIAL_INVALID_STATE]"]
        distinguishing_aspect: "Triage is only legal from RECEIVED; a second triage on a TRIAGED denial fails with ERR_DENIAL_INVALID_STATE and mutates nothing."
        test_recipe:
          setup: ["payer A, code CO-16, denial CLM-2101 already triaged"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2101", patient_account_number: "PA-2101", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
          trigger:
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: true }
              as: DenialsSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DENIAL_INVALID_STATE (409)"
            - "denial remains TRIAGED and preventable_flag remains false (no partial mutation)"

      - name: resolved_paid_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DenialCase.IN_APPEAL_to_RESOLVED_PAID, "errors[ERR_DENIAL_INVALID_STATE]"]
        distinguishing_aspect: "RESOLVED_PAID is terminal: triage, assign, and appeal creation all fail against it."
        test_recipe:
          setup: ["payer A with level-1 policy; code CO-16; denial CLM-2102 (denied 100000) fully overturned at level 1 -> RESOLVED_PAID"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2102", patient_account_number: "PA-2102", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 120000, denied_amount_cents: 100000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { ap1: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap1}", document_type: "CLINICAL_NOTES", file_reference: "doc-2102-notes" }
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/generate-letter"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/submit"
              payload: {}
              as: DenialsSpecialist
            - call: "POST /rcm/appeals/${ap1}/record-outcome"
              payload: { outcome: "OVERTURNED", recovered_amount_cents: 100000 }
              as: DenialsSpecialist
          trigger:
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { err1: $.data.error_id }
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { err2: $.data.error_id }
          assert:
            - "triage on RESOLVED_PAID: error_id == ERR_DENIAL_INVALID_STATE"
            - "appeal create on RESOLVED_PAID: error_id == ERR_DENIAL_INVALID_STATE"
            - "denial status remains RESOLVED_PAID"

      - name: record_outcome_before_submit_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Appeal.SUBMITTED_to_OVERTURNED, "errors[ERR_APPEAL_INVALID_STATE]"]
        distinguishing_aspect: "record-outcome requires SUBMITTED; attempting it on a LETTER_GENERATED appeal fails with ERR_APPEAL_INVALID_STATE."
        test_recipe:
          setup: ["payer A with level-1 policy; code CO-16; denial CLM-2103 QUEUED; appeal created and letter generated (not submitted)"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2103", patient_account_number: "PA-2103", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { ap1: $.data.id }
            - call: "POST /rcm/appeals/${ap1}/generate-letter"
              payload: {}
              as: DenialsSpecialist
          trigger:
            - call: "POST /rcm/appeals/${ap1}/record-outcome"
              payload: { outcome: "UPHELD", recovered_amount_cents: 0 }
              as: DenialsSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_APPEAL_INVALID_STATE (409); appeal stays LETTER_GENERATED"

      - name: submit_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Appeal.LETTER_GENERATED_to_SUBMITTED, "errors[ERR_APPEAL_INVALID_STATE]"]
        distinguishing_aspect: "Submit requires a generated letter; a DRAFT appeal cannot be submitted even when its attachments satisfy the policy."
        test_recipe:
          setup: ["payer A with level-1 policy; code CO-16; denial CLM-2104 QUEUED; appeal in DRAFT with CLINICAL_NOTES attached"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
              captures: { p_a: $.data.id }
            - call: "POST /rcm/payer-appeal-policies"
              payload: { payer_id: "${p_a}", level_number: 1, timely_filing_days: 60, response_window_days: 30, required_attachment_types: ["CLINICAL_NOTES"], effective_from: "2026-01-01" }
              as: RevenueCycleDirector
            - call: "POST /rcm/remittance-codes"
              payload: { code: "CO-16", category: "CODING", default_department: "CODING", appealable: true }
              as: RevenueCycleDirector
              captures: { rc_coding: $.data.id }
            - call: "POST /rcm/denial-cases"
              payload: { claim_number: "CLM-2104", patient_account_number: "PA-2104", payer_id: "${p_a}", remittance_code_id: "${rc_coding}", billed_amount_cents: 300000, denied_amount_cents: 250000, service_date: "2026-07-10", remittance_received_date: "2026-08-01" }
              as: DenialsSpecialist
              captures: { d1: $.data.id }
            - call: "POST /rcm/denial-cases/${d1}/triage"
              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v: $.data.version }
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v}" }
              as: DenialsManager
            - call: "POST /rcm/appeals"
              payload: { denial_case_id: "${d1}" }
              as: DenialsSpecialist
              captures: { ap1: $.data.id }
            - call: "POST /rcm/appeal-attachments"
              payload: { appeal_id: "${ap1}", document_type: "CLINICAL_NOTES", file_reference: "doc-2104-notes" }
              as: DenialsSpecialist
          trigger:
            - call: "POST /rcm/appeals/${ap1}/submit"
              payload: {}
              as: DenialsSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_APPEAL_INVALID_STATE (state gate precedes the attachment check, which would have passed)"

      - name: withdraw_returns_denial_to_queue
        claim_type: side_effect_execution
        grounds: [state_machines.Appeal.DRAFT_to_WITHDRAWN, state_machines.DenialCase.IN_APPEAL_to_QUEUED]
        distinguishing_aspect: "Withdrawing the only appeal recomputes current_appeal_level to 0 and reverts the denial IN_APPEAL -> QUEUED; the WITHDRAWN appeal is then terminal (second withdraw rejected)."
        test_recipe:
          setup: ["payer A with level-1 policy; code CO-16; denial CLM-2105 QUEUED; one appeal in DRAFT"]
          setup_api_calls:
