            - call: "POST /inspection/pathogen-samples/${s5}/record-result"
              payload: { result: "NEGATIVE" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspection/pathogen-samples/${s6}/record-result"
              payload: { result: "NEGATIVE" }
              as: Inspector
