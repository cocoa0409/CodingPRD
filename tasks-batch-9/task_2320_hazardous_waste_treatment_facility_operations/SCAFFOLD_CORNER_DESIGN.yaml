              as: Generator
              as_user_id: "${gen_id}"
              captures: { profB_id: $.data.id }
            - call: "POST /tsdf/waste-profiles/${profB_id}/submit"
              payload: {}
              as: Generator
              as_user_id: "${gen_id}"
              captures: { profB_v1: $.data.version }
            - call: "POST /tsdf/waste-profiles/${profB_id}/samples"
              payload: { sample_type: "FINGERPRINT", measured_constituent_ppm: 12500.0, measured_flash_point_c: 43.0, measured_ph: 7.2, expected_waste_profile_version: "${profB_v1}" }
              as: WasteApprovalChemist
