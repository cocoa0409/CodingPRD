        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "Pagination envelope: with three policies, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; limit=2&offset=2 returns 1 row with has_more false; rows are in created_at ascending order."
        test_recipe:
          setup: ["Three policies for three different host countries (no overlap rules trigger)"]
          setup_api_calls:
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-01-01", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000 }, as: MobilityAdmin, captures: { pol1: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "SG", host_country_code: "SG", effective_from: "2026-01-01", effective_to: "2027-01-01", per_diem_daily_cents: 6333, housing_monthly_cap_cents: 250000 }, as: MobilityAdmin, captures: { pol2: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "DE", host_country_code: "DE", effective_from: "2026-01-01", effective_to: "2027-01-01", per_diem_daily_cents: 5000, housing_monthly_cap_cents: 200000 }, as: MobilityAdmin, captures: { pol3: "$.data.id" } }
          trigger:
            - { call: "GET /mobility/allowance-policies?limit=2&offset=0", as: MobilityAdmin, captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" } }
            - { call: "GET /mobility/allowance-policies?limit=2&offset=2", as: MobilityAdmin, captures: { page2_first: "$.data[0].id" } }
          assert:
            - "Page 1: data length 2, total_count == 3, has_more == true, rows are [pol1, pol2] in created_at ascending order"
            - "Page 2: data length 1, total_count == 3, has_more == false, row is pol3"
            - "Omitting limit/offset applies the envelope defaults (limit 10, offset 0)"

      - name: shadow_record_list_filters_by_assignment_and_status
        claim_type: listing
        grounds: [endpoints, entities.ShadowPayrollRecord.fields.status]
        distinguishing_aspect: "Filtered list: GET /mobility/shadow-payroll-records?assignment_id=..&status=POSTED returns only the POSTED rows of that assignment — the DRAFT row of the same assignment and the POSTED row of another assignment are both excluded."
        test_recipe:
          setup: ["Two activated assignments (two employees, totalization false); A1 has one POSTED (Sep) and one DRAFT (Oct); A2 has one POSTED (Sep)"]
          setup_api_calls:
            - { call: "POST /mobility/programs", payload: { name: "GM Program", home_country_code: "US" }, as: MobilityAdmin, captures: { prog_id: "$.data.id" } }
            - { call: "POST /mobility/allowance-policies", payload: { policy_name: "JP Standard", host_country_code: "JP", effective_from: "2026-01-01", effective_to: "2027-12-31", per_diem_daily_cents: 7500, housing_monthly_cap_cents: 300000, cola_pct: 15 }, as: MobilityAdmin, captures: { pol_id: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1001", full_name: "A One", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp1: "$.data.id" } }
            - { call: "POST /mobility/employees", payload: { employee_ref: "E1002", full_name: "B Two", home_country_code: "US", family_size: 2, annual_base_salary_cents: 10800000 }, as: MobilityAdmin, captures: { emp2: "$.data.id" } }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp1}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-TOKYO", assignment_type: "LONG_TERM", totalization_applies: false, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg1: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg1}", letter_title: "L1", home_base_annual_cents: 10800000 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg1: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg1}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/compensation-packages/${pkg1}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg1}", home_payroll_pct: 60, host_payroll_pct: 40 }, as: PayrollSpecialist, captures: { spl1: "$.data.id" } }
            - { call: "POST /mobility/payroll-splits/${spl1}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/assignments/${asg1}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
            - { call: "POST /mobility/assignments/${asg1}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1" }
            - { call: "POST /mobility/assignments/${asg1}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/assignments", payload: { program_id: "${prog_id}", employee_id: "${emp2}", policy_id: "${pol_id}", host_country_code: "JP", host_business_unit: "BU-OSAKA", assignment_type: "LONG_TERM", totalization_applies: false, start_date: "2026-09-01", planned_end_date: "2027-08-31" }, as: MobilityAdmin, captures: { asg2: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages", payload: { assignment_id: "${asg2}", letter_title: "L2", home_base_annual_cents: 10800000 }, as: PayrollSpecialist, as_user_id: "ps-1", captures: { pkg2: "$.data.id" } }
            - { call: "POST /mobility/compensation-packages/${pkg2}/submit", as: PayrollSpecialist, as_user_id: "ps-1" }
            - { call: "POST /mobility/compensation-packages/${pkg2}/approve", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/payroll-splits", payload: { assignment_id: "${asg2}", home_payroll_pct: 60, host_payroll_pct: 40 }, as: PayrollSpecialist, captures: { spl2: "$.data.id" } }
            - { call: "POST /mobility/payroll-splits/${spl2}/activate", as: PayrollSpecialist }
            - { call: "POST /mobility/assignments/${asg2}/submit", as: MobilityAdmin, as_user_id: "adm-1" }
            - { call: "POST /mobility/assignments/${asg2}/approve-bu", as: BusinessUnitApprover, as_user_id: "bu-1" }
            - { call: "POST /mobility/assignments/${asg2}/approve-mobility", as: MobilityApprover, as_user_id: "ma-9" }
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg1}", tax_year: 2026, period_month: 9, total_gross_cents: 900000, per_diem_days: 0, housing_receipts_cents: 0 }, as: PayrollSpecialist, captures: { rec_a1_sep: "$.data.id" } }
            - { call: "POST /mobility/shadow-payroll-records/${rec_a1_sep}/post", as: PayrollSpecialist }
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg1}", tax_year: 2026, period_month: 10, total_gross_cents: 900000, per_diem_days: 0, housing_receipts_cents: 0 }, as: PayrollSpecialist, captures: { rec_a1_oct: "$.data.id" } }
            - { call: "POST /mobility/shadow-payroll-records", payload: { assignment_id: "${asg2}", tax_year: 2026, period_month: 9, total_gross_cents: 700000, per_diem_days: 0, housing_receipts_cents: 0 }, as: PayrollSpecialist, captures: { rec_a2_sep: "$.data.id" } }
            - { call: "POST /mobility/shadow-payroll-records/${rec_a2_sep}/post", as: PayrollSpecialist }
          trigger:
