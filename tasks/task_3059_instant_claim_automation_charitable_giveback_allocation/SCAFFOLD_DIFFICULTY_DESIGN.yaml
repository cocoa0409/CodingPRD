              as: UnderwritingAdmin
            - call: "POST /fee-configs/${fc_vt}/retire"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /policyholders"
              payload: { email: "vt@x.com", full_name: "V T", state_code: "VT" }
              as: Anonymous
              captures: { ph: $.data.id }
            - call: "POST /quotes"
