              as: CampaignManager
              captures: { sat_job_id: $.data.id }
            - call: "POST /mail/mail-jobs/${sat_job_id}/eddm-routes"
              payload: { route_code: "C001", total_deliveries: 6, residential_piece_count: 4, business_piece_count: 2 }
              as: CampaignManager
            - call: "POST /mail/mail-jobs/${sat_job_id}/eddm-routes"
              payload: { route_code: "C002", total_deliveries: 6, residential_piece_count: 4, business_piece_count: 2 }
              as: CampaignManager
            - call: "POST /mail/mail-jobs"
              payload: { campaign_id: "${camp_id}", template_id: "${tpl_id}", job_kind: "EDDM", mail_class: "EDDM", eddm_rate_variant: "HIGH_DENSITY_PLUS" }
              as: CampaignManager
