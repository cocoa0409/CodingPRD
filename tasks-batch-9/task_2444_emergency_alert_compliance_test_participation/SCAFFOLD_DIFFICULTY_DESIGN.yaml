              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "run-log-review returns 200 with last_log_review_at == 2026-08-19T00:00:00Z"
            - "phase 2 swept te2: GET /test-events/${te2} shows status == FAILED_UNFILED (was READY, now > filing_deadline_at 2026-08-18T01:00:00Z)"
            - "te1 is unaffected by the sweep because its status is FILED, which is not in {READY, LOGGED}"
            - "phase 1 flagged nothing: silent_assignment_count == 0, because the RECEIPT line set the PEP assignment's last_receipt_at to 2026-08-12T00:30:00Z and now - 8 d == 2026-08-11T00:00:00Z is earlier than that"
            - "summary: compliance_variant_applied == 'CERTIFIED', unfiled_test_count == 1, penalty_points_total == 0.94, missing_source_count == 0, outage_breach_count == 0"
            - "compliance_score == 79.06 == round(100.00 - d5 20.00 - d6 0.94, 2) and compliance_posture == 'WATCH' (79.06 >= WATCH_MIN_SCORE 75.00 but < 90.00)"
            - "the PROVISIONAL counterfactual is 100.00 / COMPLIANT on exactly this data, so accepting one filing cost the station 20.94 points"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: accessibility_nested_min_max_with_both_caps_binding
        grounds:
          - "§1.3 calculations.accessibility_pass_evaluation, formula lines coupled_points = min(CRAWL_COUPLING_CAP, ...) and round(min(DEFICIENCY_CAP, ...), 2)"
          - "§1.3 constants CRAWL_MIN_SECONDS=60, TARGET_LUFS=-24.0, LOUDNESS_TOLERANCE_LU=2.0, CRAWL_POINT_RATE=0.05, LOUDNESS_POINT_RATE=0.10, COUPLING_RATE=0.01, CRAWL_COUPLING_CAP=3.00, DEFICIENCY_CAP=8.00, ACCESSIBILITY_PASS_MAX_POINTS=1.00"
          - "§1.5 POST /alert-events/{id}/verify-accessibility (input visual_crawl_seconds, audio_loudness_lufs, caption_interaction)"
          - "§1.1 AlertEvent.accessibility_deficiency_points / accessibility_state"
        distinguishing_aspect: "Combinatorial mode (a): three inputs feed a non-linear coupling product that is itself capped inside an outer capped sum, so the worst-case measurement lands on 8.00 — an implementation that drops the inner CRAWL_COUPLING_CAP still reports 8.00 by luck, but the companion measurement in the same trigger (30 s / -18.0 LUFS / CRAWL_OVERLAP) yields 5.10 where neither cap binds, and only code carrying both caps produces 8.00 and 5.10 together."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 activated; station KWEA registered. No RelayRule rows exist, so the relay dimension of each alert lands in UNMATCHED_OPTIONAL and never interferes with the accessibility dimension."
            - "Two alerts are logged at the default clock 2026-08-01T00:00:00Z with DIFFERENT originator_sequence values so phase A of duplicate_suppression_window (same station + sequence + event_code) cannot suppress either one."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSACC-0001", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert_capped: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSACC-0002", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert_uncapped: "$.data.id" }
          trigger:
            - call: "POST /alert-events/${alert_capped}/verify-accessibility"
              as: StationEngineer
              as_user_id: eng-1
              payload: { visual_crawl_seconds: 0, audio_loudness_lufs: -60.0, caption_interaction: "CAPTION_SUPPRESSED" }
            - call: "POST /alert-events/${alert_uncapped}/verify-accessibility"
              as: StationEngineer
              as_user_id: eng-1
              payload: { visual_crawl_seconds: 30, audio_loudness_lufs: -18.0, caption_interaction: "CRAWL_OVERLAP" }
          assert:
            - "capped alert: crawl_shortfall_seconds = max(0, 60 - 0) = 60; loudness_excess_lu = max(0.0, abs(-60.0 - -24.0) - 2.0) = 34.0"
            - "capped alert: raw coupled term 60 * 34.0 * 0.01 = 20.40 is clamped by the INNER cap to 3.00"
            - "capped alert: base_points = 60 * 0.05 + 34.0 * 0.10 = 3.00 + 3.40 = 6.40; caption_penalty_points = 1.50"
            - "capped alert: 6.40 + 3.00 + 1.50 = 10.90 is clamped by the OUTER DEFICIENCY_CAP, so accessibility_deficiency_points == 8.00 (not 10.90, and not the no-caps value 28.30)"
            - "capped alert: accessibility_state == ACCESSIBILITY_FAILED (8.00 > ACCESSIBILITY_PASS_MAX_POINTS 1.00) and relay_state is still UNMATCHED_OPTIONAL"
            - "uncapped alert: crawl_shortfall_seconds = 30, loudness_excess_lu = max(0.0, abs(-18.0 - -24.0) - 2.0) = 4.0, coupled = min(3.00, 30 * 4.0 * 0.01) = 1.20 (inner cap does NOT bind)"
            - "uncapped alert: base_points = 30 * 0.05 + 4.0 * 0.10 = 1.50 + 0.40 = 1.90; caption 2.00; total 1.90 + 1.20 + 2.00 = 5.10 < 8.00 so the outer cap does NOT bind"
            - "uncapped alert: accessibility_deficiency_points == 5.10 and accessibility_state == ACCESSIBILITY_FAILED"

      - name: filing_penalty_pinned_round_per_entry_then_sum
        grounds:
          - "§1.3 calculations.filing_penalty_points, 'PINNED ROUNDING ORDER — round each entry to 2dp FIRST, then sum'"
          - "§1.3 constants PER_ENTRY_LATE_RATE=0.065, LATE_DAY_POINTS=0.75, UNCONFIRMED_RELAY_POINTS=0.50, PENALTY_CAP=25.00, FILING_DUE_DAYS=5"
          - "§1.1 FilingRecord.late_days / entry_subtotal_points / lateness_points / unconfirmed_relay_points / penalty_points"
          - "§1.5 POST /filing-records"
        distinguishing_aspect: "entry_subtotal_points must be 0.19 (round(0.117)=0.12 plus round(0.065)=0.07, per the pinned per-entry rounding) and must NOT be 0.18 (the rejected round(0.117 + 0.065) = round(0.182)); the one-cent gap propagates into penalty_points 0.94 vs 0.93 and into Station.penalty_points_total."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 requiring only PEP; station KWEA with dev1 READY and one ACTIVE PEP assignment."
            - "TestEvent te1 WEEKLY [2026-08-12T00:00Z, 2026-08-12T01:00Z) -> filing_deadline_at = window_end_at + FILING_DUE_DAYS 5 d = 2026-08-17T01:00:00Z."
            - "Exactly two log entries: one TRANSMISSION (kind_weight 1.8) and one RECEIPT/WXPEP (kind_weight 1.0). The RECEIPT also satisfies §1.4 priority 9 coverage for the single required source type."
            - "Clock 2026-08-17T02:00:00Z -> filed_at is 1 h past the deadline, so late_days = ceil(3600 / 86400) = 1."
            - "No AlertEvent rows exist, so the unconfirmed mandatory relay pool is empty."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: ["EAN"] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
