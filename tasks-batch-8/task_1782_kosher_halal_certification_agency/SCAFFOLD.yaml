    code: 200
    input: ["facility_id?", "inspector_user_id?", "status?", "visit_type?", "limit?", "offset?"]
    output: "SupervisionVisit[]"
    side_effects: []
  - method: GET
    path: "/api/visits/{id}"
    description: "Get one visit; an UNANNOUNCED visit is 404 for ClientContact"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: []
    output: SupervisionVisit
    side_effects: []
  - method: GET
    path: "/api/facilities/{id}/visits"
    description: "List a facility's visits; UNANNOUNCED hidden from ClientContact"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: ["limit?", "offset?"]
    output: "SupervisionVisit[]"
    side_effects: []
  - method: POST
    path: "/api/visits/{id}/start"
    description: "SCHEDULED -> IN_PROGRESS; assigned inspector only; scheduled_start <= now <= scheduled_end (inclusive)"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: SupervisionVisit
    side_effects: []
  - method: POST
    path: "/api/visits/{id}/complete"
    description: "IN_PROGRESS -> COMPLETED; assigned inspector only"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: SupervisionVisit
    side_effects: []
  - method: POST
    path: "/api/visits/{id}/no-access"
    description: "SCHEDULED/IN_PROGRESS -> NO_ACCESS; auto-creates a CRITICAL finding (deadline now+7d) and fires the facility suspension cascade"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: SupervisionVisit
    side_effects: ["auto CRITICAL finding (origin AUTO_NO_ACCESS)", "open_nc_score +8", "facility APPROVED -> SUSPENDED -> certificates -> client cascade", "facility equipment lines -> COMPROMISED"]
  - method: POST
    path: "/api/visits/{id}/cancel"
    description: "SCHEDULED -> CANCELLED"
    roles: [AccountManager]
    code: 200
    input: []
    output: SupervisionVisit
    side_effects: []

  # --- InspectionFinding ---
  - method: POST
    path: "/api/visits/{id}/findings"
    description: "Raise a finding while the visit is IN_PROGRESS; CRITICAL fires the facility suspension cascade; open_nc_score recomputed"
    roles: [FieldSupervisor]
    code: 201
    input: [severity, description, remediation_deadline]
    output: InspectionFinding
    side_effects: ["open_nc_score += weight", "CRITICAL: facility APPROVED -> SUSPENDED -> in-scope ACTIVE certificates -> SUSPENDED -> client recompute; facility lines -> COMPROMISED"]
  - method: GET
    path: "/api/visits/{id}/findings"
    description: "List a visit's findings"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: ["limit?", "offset?"]
    output: "InspectionFinding[]"
    side_effects: []
  - method: GET
    path: "/api/findings"
    description: "List findings"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: ["facility_id?", "visit_id?", "status?", "severity?", "limit?", "offset?"]
    output: "InspectionFinding[]"
    side_effects: []
  - method: GET
    path: "/api/findings/{id}"
    description: "Get one finding"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: []
    output: InspectionFinding
    side_effects: []
  - method: POST
    path: "/api/findings/{id}/submit-remediation"
    description: "OPEN/REOPENED/ESCALATED -> REMEDIATION_SUBMITTED; open_nc_score recomputed (finding leaves the counted set)"
    roles: [ClientContact]
    code: 200
    input: [remediation_notes]
    output: InspectionFinding
    side_effects: ["open_nc_score -= weight"]
  - method: POST
    path: "/api/findings/{id}/verify"
    description: "REMEDIATION_SUBMITTED -> VERIFIED_CLOSED (outcome=CLOSED) or -> REOPENED (outcome=FAILED, requires new_remediation_deadline > now). Verifier must differ from the visit's inspector"
    roles: [FieldSupervisor]
    code: 200
    input: [outcome, "new_remediation_deadline?"]
    output: InspectionFinding
    side_effects: ["FAILED: remediation_deadline updated; open_nc_score += weight"]

  # --- CertificationAgreement ---
  - method: POST
    path: "/api/agreements"
    description: "Create an agreement (DRAFT). OCC: expected_client_version must match client.version (412 on mismatch). On success the client's previous ACTIVE agreement -> SUPERSEDED and client.version increments by 1. term_end_date: ANNIVERSARY = term_start + 12 months - 1 day; CALENDAR_YEAR = Dec 31 of term_start year"
    roles: [AccountManager]
    code: 201
    input: [client_id, scheme, billing_cycle, term_start_date, per_product_fee_cents, expected_client_version]
    output: CertificationAgreement
    side_effects: ["previous ACTIVE agreement of this client -> SUPERSEDED", "increments AgencyClient.version by 1"]
  - method: GET
    path: "/api/agreements"
    description: "List agreements"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: "CertificationAgreement[]"
    side_effects: []
  - method: GET
    path: "/api/agreements/{id}"
    description: "Get one agreement"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: []
    output: CertificationAgreement
    side_effects: []
  - method: POST
    path: "/api/agreements/{id}/activate"
    description: "DRAFT -> ACTIVE; client must be APPLICANT/CERTIFIED; no other ACTIVE agreement for the client; freezes annual_fee_snapshot_cents"
    roles: [AccountManager]
    code: 200
    input: []
    output: CertificationAgreement
    side_effects: ["annual_fee_snapshot_cents computed (activation_snapshot variant)"]

  # --- Invoice ---
  - method: POST
    path: "/api/invoices"
    description: "Issue an invoice. Only ANNUAL_CERTIFICATION and REINSTATEMENT are creatable here (PRODUCT_ADDITION/RENEWAL are auto-created by certificate add-products / renew; passing them -> ERR_INVALID_REQUEST). ANNUAL_CERTIFICATION: requires agreement_id of an ACTIVE agreement; amount = annual_fee_snapshot_cents; at most one non-VOID per agreement (ERR_DUPLICATE_ANNUAL_INVOICE). REINSTATEMENT: flat REINSTATEMENT_FEE_CENTS=50000; only while client SUSPENDED (ERR_CLIENT_INVALID_STATE). Zero-total invoices are created directly PAID with paid_recorded_by='system'. due_date = now + 30d"
    roles: [AccountManager]
    code: 201
    input: [client_id, invoice_type, "agreement_id?"]
    output: Invoice
    side_effects: ["client.total_billed_cents recomputed", "zero-total -> status PAID immediately"]
  - method: GET
    path: "/api/invoices"
    description: "List invoices"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: ["client_id?", "agreement_id?", "related_certificate_id?", "status?", "invoice_type?", "limit?", "offset?"]
    output: "Invoice[]"
    side_effects: []
  - method: GET
    path: "/api/invoices/{id}"
    description: "Get one invoice"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/api/invoices/{id}/record-payment"
    description: "ISSUED/OVERDUE -> PAID; records paid_recorded_by = X-User-ID"
    roles: [AccountManager]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/api/invoices/{id}/void"
    description: "ISSUED/OVERDUE -> VOID; compensates the billed ledger"
    roles: [AccountManager]
    code: 200
    input: []
    output: Invoice
    side_effects: ["client.total_billed_cents recomputed (invoice leaves billed set)"]

  # --- Certificate / CertificateProduct ---
  - method: POST
    path: "/api/certificates"
    description: "Create a DRAFT certificate with multi-site scope (facility_ids may mix OWNED and CO_PACKER) and initial product list (entries INCLUDED). SEASONAL requires holiday_window_id whose facility is in facility_ids"
    roles: [CertificateOfficer]
    code: 201
    input: [client_id, scheme, term_type, facility_ids, product_ids, "holiday_window_id?"]
    output: Certificate
    side_effects: ["CertificateProduct entries created INCLUDED"]
  - method: GET
    path: "/api/certificates"
    description: "List certificates"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: ["client_id?", "status?", "scheme?", "holiday_window_id?", "renews_certificate_id?", "facility_ids?", "limit?", "offset?"]
    output: "Certificate[]"
    side_effects: []
  - method: GET
    path: "/api/certificates/{id}"
    description: "Get one certificate"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: []
    output: Certificate
    side_effects: []
  - method: GET
    path: "/api/certificates/{id}/products"
    description: "List a certificate's CertificateProduct entries"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: ["limit?", "offset?"]
    output: "CertificateProduct[]"
    side_effects: []
  - method: POST
    path: "/api/certificates/{id}/issue"
    description: "DRAFT -> ACTIVE under the full gate chain (state -> client state -> seasonal window -> facilities APPROVED -> products CERTIFIABLE/INCLUDED -> agreement/scheme -> fee PAID -> paid_recorded_by != issuer). Sets issued_at/valid_until; renewal issuance supersedes the parent; first issuance promotes client APPLICANT -> CERTIFIED"
    roles: [CertificateOfficer]
    code: 200
    input: []
    output: Certificate
    side_effects: ["valid_until per certificate_valid_until variant", "renewal parent -> SUPERSEDED", "client APPLICANT -> CERTIFIED on first issuance"]
  - method: POST
    path: "/api/certificates/{id}/products"
    description: "Add one or more CERTIFIABLE products to an ACTIVE certificate (atomic: any failure rejects the whole call). Auto-creates ONE PRODUCT_ADDITION invoice with one prorated line per product, in request order (per-line rounding then sum, volume discount on pre-discount subtotal)"
    roles: [CertificateOfficer]
    code: 201
    input: [product_ids]
    output: "CertificateProduct[]"
    side_effects: ["PRODUCT_ADDITION invoice created (ISSUED, or PAID if total 0)", "active_product_count += number of added products", "client.total_billed_cents recomputed"]
  - method: DELETE
    path: "/api/certificate-products/{id}"
    description: "Remove a certificate entry (-> REMOVED); no fee refund"
    roles: [CertificateOfficer]
    code: 200
    input: []
    output: CertificateProduct
    side_effects: ["active_product_count recomputed"]
  - method: POST
    path: "/api/certificates/{id}/suspend"
    description: "ACTIVE -> SUSPENDED (manual); client bubble-up recompute"
    roles: [CertificateOfficer]
    code: 200
    input: []
    output: Certificate
    side_effects: ["client recompute: zero ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/api/certificates/{id}/reinstate"
    description: "SUSPENDED -> ACTIVE; facilities APPROVED, no open MAJOR+ findings in scope, no OVERDUE invoices; valid_until NOT extended; client bubble-up"
    roles: [CertificateOfficer]
    code: 200
    input: []
    output: Certificate
    side_effects: ["client SUSPENDED -> CERTIFIED"]
  - method: POST
    path: "/api/certificates/{id}/revoke"
    description: "ACTIVE/SUSPENDED -> REVOKED; client bubble-up recompute"
    roles: [CertificateOfficer]
    code: 200
    input: []
    output: Certificate
    side_effects: ["client recompute: zero ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/api/certificates/{id}/renew"
    description: "ACTIVE ANNUAL certificate -> creates renewal-child DRAFT (renews_certificate_id set, facilities/products copied). Window [valid_until-60d, valid_until] inclusive; risk_tier != HIGH; no FROZEN entries; no other live renewal child. Auto-creates the RENEWAL invoice (renewal_recompute variant)"
    roles: [CertificateOfficer]
    code: 201
    input: []
    output: Certificate
    side_effects: ["RENEWAL invoice created (ISSUED)", "client.total_billed_cents recomputed"]

  # --- HolidayProductionWindow ---
  - method: POST
    path: "/api/holiday-windows"
    description: "Request a seasonal supervised production window. Half-open [window_start, window_end) overlap with any REQUESTED/CONFIRMED window at the SAME facility is rejected; touching endpoints (end == start) are allowed"
    roles: [ClientContact]
    code: 201
    input: [facility_id, holiday_code, window_start, window_end]
    output: HolidayProductionWindow
    side_effects: []
  - method: GET
    path: "/api/holiday-windows/{id}"
    description: "Get one window"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: []
    output: HolidayProductionWindow
    side_effects: []
  - method: GET
    path: "/api/facilities/{id}/holiday-windows"
    description: "List a facility's holiday windows"
    roles: [AgencyAdmin, AccountManager, CertificationReviewer, FieldSupervisor, CertificateOfficer, ClientContact]
    code: 200
    input: ["limit?", "offset?"]
    output: "HolidayProductionWindow[]"
    side_effects: []
  - method: POST
    path: "/api/holiday-windows/{id}/confirm"
    description: "REQUESTED -> CONFIRMED; facility APPROVED; scheme-covering ACTIVE certificate exists; supervisor conflict (SUPERVISION_BUFFER_HOURS=24): reject iff new_start < existing_end + 24h AND new_end > existing_start - 24h against any OTHER CONFIRMED window of the supervisor at ANY facility — STRICT inequalities, so starting exactly at existing_end + 24h is allowed"
    roles: [CertificationReviewer]
    code: 200
    input: [assigned_supervisor_id]
    output: HolidayProductionWindow
    side_effects: ["assigned_supervisor_id set"]
  - method: POST
    path: "/api/holiday-windows/{id}/complete"
    description: "CONFIRMED -> COMPLETED; assigned supervisor only; current_utc >= window_end"
    roles: [FieldSupervisor]
    code: 200
    input: []
    output: HolidayProductionWindow
    side_effects: []
  - method: POST
    path: "/api/holiday-windows/{id}/cancel"
    description: "REQUESTED/CONFIRMED -> CANCELLED; blocked while referenced by a live (DRAFT/ACTIVE/SUSPENDED) certificate"
    roles: [ClientContact, CertificationReviewer]
    code: 200
    input: []
    output: HolidayProductionWindow
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth (400/403)
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/unknown" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, illegal enum member, unparseable datetime, end <= start, new_remediation_deadline <= now, SEASONAL certificate without holiday_window_id" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in endpoint's roles (incl. AccountManager attempting an UNANNOUNCED visit)" }
  - { id: ERR_CLIENT_SCOPE_VIOLATION, http: 403, condition: "ClientContact touching a resource whose owning client_id != X-User-ID" }
  - { id: ERR_NOT_ASSIGNED_INSPECTOR, http: 403, condition: "FieldSupervisor acting on a visit/window assigned to a different supervisor" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VERIFICATION, http: 403, condition: "Finding verifier equals the visit's inspector_user_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES_ISSUANCE, http: 403, condition: "Certificate issuer equals paid_recorded_by of the fee invoice (evaluated after the PAID-invoice check)" }
  # existence (404)
  - { id: ERR_NOT_FOUND, http: 404, condition: "Any path/body id not found; UNANNOUNCED visit requested by a ClientContact" }
  # concurrency (412)
  - { id: ERR_STALE_CLIENT_VERSION, http: 412, condition: "expected_client_version != client.version on POST /api/agreements" }
  # state (409)
  - { id: ERR_CLIENT_INVALID_STATE, http: 409, condition: "Client not in the required status (e.g. submit-application on non-PROSPECT; issue/activate while SUSPENDED/WITHDRAWN/TERMINATED)" }
  - { id: ERR_FACILITY_INVALID_STATE, http: 409, condition: "Facility not in the required status (approve on non-PENDING_REVIEW; suspend on non-APPROVED; INITIAL visit on non-PENDING_REVIEW; kosherization on non-APPROVED facility)" }
  - { id: ERR_INGREDIENT_INVALID_STATE, http: 409, condition: "Ingredient transition from a wrong status" }
  - { id: ERR_PRODUCT_INVALID_STATE, http: 409, condition: "Product transition from a wrong status" }
  - { id: ERR_PRODUCT_INGREDIENT_INVALID_STATE, http: 409, condition: "Junction already REMOVED" }
  - { id: ERR_VISIT_INVALID_STATE, http: 409, condition: "Visit transition from a wrong status" }
  - { id: ERR_FINDING_INVALID_STATE, http: 409, condition: "Finding transition from a wrong status (incl. verify on non-REMEDIATION_SUBMITTED)" }
  - { id: ERR_AGREEMENT_INVALID_STATE, http: 409, condition: "Agreement transition from a wrong status" }
  - { id: ERR_INVOICE_INVALID_STATE, http: 409, condition: "Payment/void on PAID or VOID invoice" }
  - { id: ERR_CERTIFICATE_INVALID_STATE, http: 409, condition: "Certificate transition from a wrong status (issue on non-DRAFT; suspend on non-ACTIVE; reinstate on non-SUSPENDED; revoke on terminal; renew on non-ACTIVE)" }
  - { id: ERR_CERTIFICATE_PRODUCT_INVALID_STATE, http: 409, condition: "Entry already REMOVED" }
  - { id: ERR_WINDOW_INVALID_STATE, http: 409, condition: "Window transition from a wrong status; SEASONAL issue with non-CONFIRMED window" }
  - { id: ERR_EQUIPMENT_LINE_INVALID_STATE, http: 409, condition: "Assess on assessed line; kosherize a VALID line; compromise a COMPROMISED line" }
  # business_safety (422/403/409)
  - { id: ERR_ANIMAL_SOURCE_DOCUMENTATION_REQUIRED, http: 422, condition: "Approving an ANIMAL ingredient with has_species_documentation == false" }
  - { id: ERR_INITIAL_VISIT_REQUIRED, http: 409, condition: "Facility approval without any COMPLETED INITIAL visit" }
  - { id: ERR_OPEN_MAJOR_FINDINGS, http: 409, condition: "Facility approve/reinstate or certificate reinstate with MAJOR/CRITICAL findings in {OPEN, REMEDIATION_SUBMITTED, REOPENED, ESCALATED}" }
  - { id: ERR_EQUIPMENT_UNASSESSED, http: 409, condition: "Facility approve/reinstate with an UNASSESSED line or a COMPROMISED line" }
  - { id: ERR_FACILITY_NOT_APPROVED, http: 409, condition: "Certificate issue/reinstate or window confirm with an in-scope facility not APPROVED" }
  - { id: ERR_PRODUCT_NOT_CERTIFIABLE, http: 409, condition: "Certificate issue with an entry not INCLUDED or a product not CERTIFIABLE" }
  - { id: ERR_CLIENT_HIGH_RISK, http: 403, condition: "Renewal attempted while client risk_tier == HIGH (open_nc_score >= 8)" }
  - { id: ERR_NO_COVERING_CERTIFICATE, http: 409, condition: "Holiday-window confirm without an ACTIVE certificate whose facility_ids contains the facility and whose scheme covers the holiday_code" }
  # business_referential (422/409)
  - { id: ERR_CROSS_CLIENT_REFERENCE, http: 422, condition: "Body-referenced facility/product/ingredient/window owned by a different client" }
  - { id: ERR_INGREDIENT_NOT_APPROVED, http: 409, condition: "Linking an ingredient that is not APPROVED (product create/add-ingredient; certify-eligible)" }
  - { id: ERR_PRODUCT_ALREADY_CERTIFIED, http: 409, condition: "Adding a product already listed (INCLUDED/FROZEN) on the certificate" }
  - { id: ERR_DUPLICATE_PRODUCT_INGREDIENT, http: 409, condition: "Adding an ingredient that already has a non-REMOVED junction on the product" }
  - { id: ERR_SCHEME_MISMATCH, http: 422, condition: "Agreement scheme not covered by client scheme; certificate scheme not covered by client scheme or by the ACTIVE agreement scheme" }
  - { id: ERR_NO_ACTIVE_AGREEMENT, http: 409, condition: "Fee-bearing operation (issue, add-product, ANNUAL invoice) without an ACTIVE agreement for the client" }
  # business_temporal (409)
  - { id: ERR_VISIT_WINDOW_NOT_ACTIVE, http: 409, condition: "Visit start outside [scheduled_start, scheduled_end]; holiday window completion before window_end" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 409, condition: "Renew outside [valid_until - 60d, valid_until]" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "New holiday window's half-open interval intersects a REQUESTED/CONFIRMED window at the same facility" }
  - { id: ERR_INSPECTOR_SCHEDULE_CONFLICT, http: 409, condition: "New visit intersects an inspector's SCHEDULED/IN_PROGRESS visit expanded by +/-2h" }
  - { id: ERR_SUPERVISOR_WINDOW_CONFLICT, http: 409, condition: "Confirm would give the supervisor two CONFIRMED windows intersecting under +/-24h expansion" }
  # business_constraint (409/422)
  - { id: ERR_ACTIVE_AGREEMENT_EXISTS, http: 409, condition: "Activating an agreement while the client has another ACTIVE agreement" }
  - { id: ERR_RENEWAL_ALREADY_EXISTS, http: 409, condition: "A certificate with renews_certificate_id == parent already exists in {DRAFT, ACTIVE, SUSPENDED}" }
  - { id: ERR_CERTIFICATE_SCOPE_EMPTY, http: 422, condition: "Issue with facility_ids empty" }
  - { id: ERR_PRODUCT_HAS_NO_INGREDIENTS, http: 422, condition: "submit-review with zero ACTIVE junctions" }
  - { id: ERR_WINDOW_REFERENCED_BY_CERTIFICATE, http: 409, condition: "Cancelling a window referenced by a DRAFT/ACTIVE/SUSPENDED certificate" }
  - { id: ERR_CERTIFICATE_NOT_RENEWABLE, http: 409, condition: "Renew on a SEASONAL certificate" }
  - { id: ERR_DUPLICATE_ANNUAL_INVOICE, http: 409, condition: "Second non-VOID ANNUAL_CERTIFICATION invoice for the same agreement" }
  # business_fiscal (402)
  - { id: ERR_CERTIFICATION_FEE_UNPAID, http: 402, condition: "Issue without a PAID fee invoice (ANNUAL_CERTIFICATION or RENEWAL); reinstate with any OVERDUE invoice on the client" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AgencyAdmin
    description: "Agency platform operator; drives the logical clock (compliance deadline engine)"
    identity: opaque
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: AccountManager
    description: "Commercial owner: client onboarding, facilities/equipment registration support, visit scheduling (except UNANNOUNCED), agreements, invoices, payments"
    identity: opaque
    exclusive_operations:
      - "POST /api/clients"
      - "POST /api/agreements, POST /api/agreements/{id}/activate"
      - "POST /api/invoices, POST /api/invoices/{id}/record-payment, POST /api/invoices/{id}/void"
      - "POST /api/visits/{id}/cancel"
    shared_operations:
      - "POST /api/facilities, POST /api/equipment-lines (with ClientContact)"
      - "POST /api/visits for visit_type IN {INITIAL, ROUTINE, SPECIAL_HOLIDAY} (with CertificationReviewer)"
      - "All GET endpoints"

  - name: CertificationReviewer
    description: "Compliance reviewer: facility approval/suspension, ingredient review decisions, equipment assessment, product certification eligibility, unannounced inspections, holiday window confirmation"
    identity: opaque
    exclusive_operations:
      - "POST /api/facilities/{id}/approve, /suspend, /reinstate"
      - "POST /api/ingredients/{id}/start-review, /approve, /reject"
      - "POST /api/equipment-lines/{id}/assess"
      - "POST /api/products/{id}/certify-eligible"
      - "POST /api/visits with visit_type == UNANNOUNCED"
      - "POST /api/holiday-windows/{id}/confirm"
    shared_operations:
      - "POST /api/visits for any visit_type (with AccountManager for non-UNANNOUNCED)"
      - "POST /api/holiday-windows/{id}/cancel (with ClientContact)"
      - "All GET endpoints"

  - name: FieldSupervisor
    description: "Field inspector (mashgiach/murabbi style): executes assigned visits, raises findings, verifies remediations (never their own visits), records kosherization events and compromises, completes assigned holiday supervision"
    identity: opaque
    exclusive_operations:
      - "POST /api/visits/{id}/start, /complete, /no-access (assigned inspector only)"
      - "POST /api/visits/{id}/findings (assigned inspector only)"
      - "POST /api/findings/{id}/verify (must differ from the visit's inspector)"
      - "POST /api/equipment-lines/{id}/kosherization-events, /report-compromise"
      - "POST /api/holiday-windows/{id}/complete (assigned supervisor only)"
    shared_operations:
      - "All GET endpoints"

  - name: CertificateOfficer
    description: "Certificate authority: drafts, issues, suspends, reinstates, revokes, renews certificates; manages certificate product lists; terminates clients. Segregated from fee collection (cannot issue against an invoice it recorded as paid — it never records payments at all)"
    identity: opaque
    exclusive_operations:
      - "POST /api/certificates, /issue, /suspend, /reinstate, /revoke, /renew, /products"
      - "DELETE /api/certificate-products/{id}"
      - "POST /api/clients/{id}/terminate"
    shared_operations:
      - "All GET endpoints"

  - name: ClientContact
    description: "The certified company itself (X-User-ID == AgencyClient.id): submits application, ingredients, change notices, resubmissions, products and recipes, remediations, holiday window requests; decommissions its facilities; withdraws"
    identity: "entity_backed:AgencyClient"
    exclusive_operations:
      - "POST /api/clients/{id}/submit-application, /withdraw"
      - "POST /api/ingredients, /change-notices, /resubmit"
      - "POST /api/products, /products/{id}/ingredients, /submit-review, /withdraw"
      - "DELETE /api/product-ingredients/{id}"
      - "POST /api/findings/{id}/submit-remediation"
      - "POST /api/holiday-windows"
      - "POST /api/facilities/{id}/decommission"
    shared_operations:
      - "POST /api/facilities, POST /api/equipment-lines (with AccountManager)"
      - "POST /api/holiday-windows/{id}/cancel (with CertificationReviewer)"
      - "All GET endpoints (UNANNOUNCED visits hidden)"
