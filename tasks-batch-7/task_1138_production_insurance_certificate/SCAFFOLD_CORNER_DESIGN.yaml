          setup:
            - "Production ACTIVE with BOUND GL policy, no open claims → posture BOUND_PARTIAL (only GL bound of GL+EQUIPMENT required for COMMERCIAL)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-CC"
                title: "Cascade Claim"
                production_type: "COMMERCIAL"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-06-15T00:00:00Z"
                budget_cents: 100000000
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "GENERAL_LIABILITY"
                carrier_code: "AIG"
                policy_number: "AIG-GL-CC"
                limit_cents: 100000000
                aggregate_limit_cents: 200000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 10000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/activate"
              payload: {}
              as: BrokerAgent
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { posture_before: $.data.coverage_posture }
          trigger:
            - call: "POST /productions/${prod_id}/claims"
              payload:
                policy_id: "${pol_id}"
                claim_type: "INJURY"
                occurrence_date: "2026-06-05T00:00:00Z"
                loss_amount_cents: 500000
              as: ProductionManager
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { posture_after: $.data.coverage_posture, reasons: $.data.posture_reasons }
          assert:
            - "Production.coverage_posture == RESTRICTED after INJURY claim submitted"
            - "posture_reasons contains 'OPEN_INJURY_CLAIM'"

  # ============================================================
  # Section: consistency-model
  # ============================================================
  - section: consistency_model
    instances:
      - name: endorsee_immediately_visible_after_issue
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "After POST /cast-endorsements/{id}/issue returns 200, immediate GET shows status=ISSUED (no lag)."
        test_recipe:
          setup:
            - "Production DRAFT with cast exam CLEARED, CAST policy BOUND, endorsement DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /productions"
              payload:
                production_code: "PRD-IC"
                title: "Immediate Consistency"
                production_type: "FEATURE"
                principal_photography_start: "2026-06-01T00:00:00Z"
                principal_photography_end: "2026-08-01T00:00:00Z"
                budget_cents: 100000000
              as: BrokerAgent
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/cast-members"
              payload: { full_name: "Principal F", role_tier: "PRINCIPAL", weekly_salary_cents: 1000000, essential_element: true }
              as: ProductionManager
              captures: { cm_id: $.data.id }
            - call: "POST /productions/${prod_id}/cast-members/${cm_id}/physical-exam"
              payload: { outcome: "CLEARED" }
              as: UnderwriterAgent
            - call: "POST /productions/${prod_id}/policies"
              payload:
                coverage_line: "CAST"
                carrier_code: "CHUBB"
                policy_number: "CHU-CAST-IC"
                limit_cents: 50000000
                aggregate_limit_cents: 100000000
                deductible_cents: 100000
                effective_date: "2026-05-01T00:00:00Z"
                expiry_date: "2026-12-31T00:00:00Z"
                payroll_basis_cents: 100000000
              as: BrokerAgent
              captures: { pol_id: $.data.id }
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: BrokerAgent
              captures: { prod_v: $.data.version }
            - call: "POST /productions/${prod_id}/policies/${pol_id}/bind"
              payload: { expected_production_version: "${prod_v}" }
              as: BrokerAgent
            - call: "POST /productions/${prod_id}/cast-endorsements"
              payload:
                cast_member_id: "${cm_id}"
                policy_id: "${pol_id}"
                endorsement_type: "ESSENTIAL_ELEMENT"
              as: UnderwriterAgent
              captures: { endo_id: $.data.id }
          trigger:
            - call: "POST /productions/${prod_id}/cast-endorsements/${endo_id}/issue"
              payload: {}
              as: UnderwriterAgent
            - call: "GET /productions/${prod_id}/cast-endorsements/${endo_id}"
              payload: {}
              as: UnderwriterAgent
              captures: { status: $.data.status }
          assert:
            - "CastEndorsement.status == ISSUED (immediate consistency, no lag)"
