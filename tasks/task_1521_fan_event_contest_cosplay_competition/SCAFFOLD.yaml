scenario: |
  Fan Event Contest & Cosplay Competition Operations (fan convention programming team):
  contest registration & category/skill division, pre-judging schedule & craftsmanship
  review, stage performance order & tech cues, judging rubric & tabulation,
  prop/weapon-safety policy check at check-in, prize distribution & tax reporting,
  photography/media rights consent, accessibility & green room logistics

domain_name: fan-contest-cosplay-ops
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ContestEvent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable contest name" }
      - { name: start_at, type: datetime, source: input, description: "Contest window start (ISO8601 UTC); pre-judging slots must fall inside [start_at, end_at]" }
      - { name: end_at, type: datetime, source: input, description: "Contest window end (ISO8601 UTC); must be strictly after start_at" }
      - { name: prize_budget_cents, type: integer, source: input, description: "Total prize budget in cents; >= 0" }
      - { name: max_entries_per_contestant, type: integer, source: input, default: 2, description: "Cap on non-terminal entries per contestant per contest; >= 1" }
      - { name: status, type: enum, source: system, description: "SETUP | REGISTRATION_OPEN | REGISTRATION_CLOSED | JUDGING | TABULATION | COMPLETED | CANCELLED" }
      - { name: budget_reserved_cents, type: integer, source: computed, description: "Sum of value_cents over PrizeAwards of this contest with status IN {PENDING, APPROVED, DISBURSED, TAX_REPORTED}" }
      - { name: budget_available_cents, type: integer, source: computed, description: "prize_budget_cents - budget_reserved_cents; invariant: budget == reserved + available" }

  - name: Category
    parent: null
    common_fields: true
    fields:
      - { name: contest_id, type: string, source: input, description: "FK -> ContestEvent.id; immutable after creation" }
      - { name: name, type: string, source: input, description: "Category name (e.g. Armor, Needlework)" }
      - { name: skill_division, type: enum, source: input, description: "JUNIOR | NOVICE | JOURNEYMAN | MASTERS" }
      - { name: max_entries, type: integer, source: input, description: "Entry quota for this category; >= 1" }
      - { name: tabulation_method, type: enum, source: input, description: "WEIGHTED_MEAN | TRIMMED_MEAN — selects entry_final_score variant" }
      - { name: prize_purse_cents, type: integer, source: input, description: "Category purse split across ranks 1-3 per category_purse_split; >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | SCORING | TABULATED" }
      - { name: entry_count, type: integer, source: computed, description: "Entries in this category with status NOT IN {WITHDRAWN, DISQUALIFIED}" }
      - { name: prize_rank1_cents, type: integer, source: computed, description: "round_half_up(prize_purse_cents * 0.50) to integer cents" }
      - { name: prize_rank2_cents, type: integer, source: computed, description: "round_half_up(prize_purse_cents * 0.30) to integer cents" }
      - { name: prize_rank3_cents, type: integer, source: computed, description: "prize_purse_cents - prize_rank1_cents - prize_rank2_cents (remainder absorbs rounding)" }

  - name: Contestant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal or badge name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across contestants" }
      - { name: birth_date, type: string, source: input, description: "YYYY-MM-DD; drives junior_age_eligibility against contest start date" }
      - { name: accessibility_needs, type: array, source: input, default: [], description: "Free-form list, e.g. [WHEELCHAIR, ASL_INTERPRETER]" }
      - { name: consents, type: array, source: system, description: "Media-consent items {scope, status, updated_at}; scope IN {PHOTOGRAPHY, VIDEO, LIVESTREAM}; status IN {GRANTED, REVOKED}; at most one item per scope" }

  - name: Judge
    parent: null
    common_fields: true
    fields:
      - { name: contest_id, type: string, source: input, description: "FK -> ContestEvent.id; judge panel of this contest" }
      - { name: display_name, type: string, source: input, description: "Judge display name" }
      - { name: category_ids, type: array, source: input, description: "Category ids this judge may score; must be non-empty" }
      - { name: linked_contestant_id, type: string, source: input, default: null, description: "FK -> Contestant.id; nullable — set when the judge also competes, drives ERR_JUDGE_CONFLICT" }

  - name: Entry
    parent: null
    common_fields: true
    fields:
      - { name: contestant_id, type: string, source: input, description: "FK -> Contestant.id; must equal caller X-User-ID" }
      - { name: category_id, type: string, source: input, description: "FK -> Category.id; immutable after creation" }
      - { name: contest_id, type: string, source: computed, description: "FK -> ContestEvent.id; denormalized from category at creation" }
      - { name: title, type: string, source: input, description: "Entry title / costume name" }
      - { name: character_source, type: string, source: input, default: "", description: "Source media of the character" }
      - { name: prop_declarations, type: array, source: input, description: "Declared prop types, e.g. [FOAM_WEAPON, ARMOR]; BANNED_PROP_TYPES rejected at input" }
      - { name: requires_prejudging, type: boolean, source: input, default: true, description: "If true, entry must reach PREJUDGED before it can be stage-queued" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SAFETY_REJECTED | SAFETY_APPROVED | PREJUDGED | STAGE_QUEUED | PERFORMED | PLACED | WITHDRAWN | DISQUALIFIED" }
      - { name: safety_status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED — result of the latest safety check" }
      - { name: rejected_props, type: array, source: system, default: [], description: "Prop types rejected by the latest REJECTED safety check" }
      - { name: placement_rank, type: integer, source: system, default: null, description: "1-based rank assigned at tabulation; null until PLACED" }
      - { name: final_score, type: number, source: computed, default: null, description: "entry_final_score over LOCKED scoresheets; set at tabulation" }
      - { name: craftsmanship_mean, type: number, source: computed, default: null, description: "Mean of craftsmanship criterion over LOCKED sheets; tie-break for placement" }

  - name: PreJudgingSlot
    parent: null
    common_fields: true
    fields:
      - { name: category_id, type: string, source: input, description: "FK -> Category.id; slot belongs to this category's judge panel" }
      - { name: panel_name, type: string, source: input, description: "Judge panel identifier; overlap is checked per (category_id, panel_name)" }
      - { name: start_at, type: datetime, source: input, description: "Slot start (ISO8601 UTC); must be >= contest start_at" }
      - { name: end_at, type: datetime, source: input, description: "Slot end; must be > start_at and <= contest end_at" }
      - { name: status, type: enum, source: system, description: "OPEN | BOOKED | COMPLETED" }
      - { name: booked_entry_id, type: string, source: system, default: null, description: "FK -> Entry.id; null while OPEN" }

  - name: ScoreSheet
    parent: null
    common_fields: true
    fields:
      - { name: entry_id, type: string, source: input, description: "FK -> Entry.id; the scored entry" }
      - { name: judge_id, type: string, source: computed, description: "FK -> Judge.id; set from caller X-User-ID" }
      - { name: category_id, type: string, source: computed, description: "FK -> Category.id; denormalized from entry at creation" }
      - { name: phase, type: enum, source: input, description: "CRAFTSMANSHIP | STAGE" }
      - { name: craftsmanship, type: integer, source: input, description: "Criterion score 0..10 inclusive" }
      - { name: accuracy, type: integer, source: input, description: "Criterion score 0..10 inclusive" }
      - { name: presentation, type: integer, source: input, description: "Criterion score 0..10 inclusive" }
      - { name: sheet_total, type: number, source: computed, description: "round_half_up(0.5*craftsmanship + 0.3*accuracy + 0.2*presentation, 2)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | LOCKED | VOID" }

  - name: PerformanceSlot
    parent: null
    common_fields: true
    fields:
      - { name: entry_id, type: string, source: input, description: "FK -> Entry.id; entry occupying this stage slot" }
      - { name: contest_id, type: string, source: computed, description: "FK -> ContestEvent.id; denormalized from entry at creation" }
      - { name: sequence_number, type: integer, source: input, description: "1-based stage order within the contest; unique among status IN {QUEUED, ON_STAGE}" }
      - { name: duration_seconds, type: integer, source: input, description: "Planned stage duration; >= 1" }
      - { name: tech_cues, type: string, source: input, default: "", description: "Lighting/audio cue notes for the stage crew" }
      - { name: status, type: enum, source: system, description: "QUEUED | ON_STAGE | COMPLETED | SKIPPED" }

  - name: PrizeAward
    parent: null
    common_fields: true
    fields:
      - { name: category_id, type: string, source: input, description: "FK -> Category.id; must be TABULATED at creation" }
      - { name: contest_id, type: string, source: computed, description: "FK -> ContestEvent.id; denormalized from category" }
      - { name: rank, type: integer, source: input, description: "Placement rank being awarded; 1..3" }
      - { name: entry_id, type: string, source: computed, description: "FK -> Entry.id; selector: PLACED entry of category with placement_rank == rank" }
      - { name: value_cents, type: integer, source: computed, description: "Category.prize_rankN_cents for this rank at creation time" }
      - { name: tax_reportable, type: boolean, source: computed, description: "value_cents >= TAX_THRESHOLD_CENTS (60000); boundary is inclusive" }
      - { name: tax_form_received, type: boolean, source: system, default: false, description: "W-9 on file, captured at disburse" }
      - { name: withheld_cents, type: integer, source: system, default: null, description: "Backup withholding at disburse: 0 if tax_form_received else round_half_up(value_cents * 0.24)" }
      - { name: net_payout_cents, type: integer, source: system, default: null, description: "value_cents - withheld_cents; set at disburse" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DISBURSED | TAX_REPORTED | REVOKED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creating Treasurer (SoD maker)" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of approving Treasurer (SoD checker); must differ from created_by_user_id" }

  - name: GreenRoomBooking
    parent: null
    common_fields: true
    fields:
      - { name: contestant_id, type: string, source: input, description: "FK -> Contestant.id; must equal caller X-User-ID" }
      - { name: contest_id, type: string, source: input, description: "FK -> ContestEvent.id" }
      - { name: room_name, type: enum, source: input, description: "NORTH | SOUTH | EAST; only EAST is accessibility-equipped (ACCESSIBLE_ROOMS)" }
      - { name: start_at, type: datetime, source: input, description: "Booking start; must not be in the past vs logical clock" }
      - { name: end_at, type: datetime, source: input, description: "Booking end; must be > start_at" }
      - { name: requires_accessibility_setup, type: boolean, source: input, default: false, description: "If true, room_name must be in ACCESSIBLE_ROOMS" }
      - { name: status, type: enum, source: system, description: "BOOKED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ContestEvent
    initial_state: SETUP
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SETUP
        to: REGISTRATION_OPEN
        trigger: "POST /contest-events/{id}/transition {to: REGISTRATION_OPEN}"
        actor: ContestLead
        preconditions:
          - "At least one Category exists for this contest (ERR_INVALID_STATE)"
        side_effects:
          - "Every Category of this contest in DRAFT -> OPEN (bumps each category.version)"
      - from: REGISTRATION_OPEN
        to: REGISTRATION_CLOSED
        trigger: "POST /contest-events/{id}/transition {to: REGISTRATION_CLOSED}"
        actor: ContestLead
        preconditions: []
        side_effects: []
      - from: REGISTRATION_CLOSED
        to: JUDGING
        trigger: "POST /contest-events/{id}/transition {to: JUDGING}"
        actor: ContestLead
        preconditions: []
        side_effects:
          - "Every Category of this contest in OPEN -> SCORING (bumps each category.version)"
      - from: JUDGING
        to: TABULATION
        trigger: "POST /contest-events/{id}/transition {to: TABULATION}"
        actor: ContestLead
        preconditions:
          - "Every Category of this contest has status == TABULATED (ERR_INVALID_STATE)"
        side_effects: []
      - from: TABULATION
        to: COMPLETED
        trigger: "POST /contest-events/{id}/transition {to: COMPLETED}"
        actor: ContestLead
        preconditions: []
        side_effects: []
      - from: TABULATION
        to: JUDGING
        trigger: "system (automatic: a Category leaves TABULATED via tabulation reopen cascade)"
        actor: system
        preconditions:
          - "Some Category of this contest reverted TABULATED -> SCORING"
        side_effects: []
      - from: SETUP
        to: CANCELLED
        trigger: "POST /contest-events/{id}/transition {to: CANCELLED}"
        actor: ContestLead
        preconditions: []
        side_effects:
          - "All Entries NOT IN {WITHDRAWN, DISQUALIFIED} -> WITHDRAWN; their BOOKED PreJudgingSlots -> OPEN (booked_entry_id cleared); their QUEUED PerformanceSlots -> SKIPPED (no resequence — contest is cancelled)"
          - "All GreenRoomBookings of this contest in BOOKED -> CANCELLED"
      - from: REGISTRATION_OPEN
        to: CANCELLED
        trigger: "POST /contest-events/{id}/transition {to: CANCELLED}"
        actor: ContestLead
        preconditions: []
        side_effects:
          - "Same cascade as SETUP -> CANCELLED"
      - from: REGISTRATION_CLOSED
        to: CANCELLED
        trigger: "POST /contest-events/{id}/transition {to: CANCELLED}"
        actor: ContestLead
        preconditions: []
        side_effects:
          - "Same cascade as SETUP -> CANCELLED"

  - entity: Category
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "system (cascade of ContestEvent SETUP -> REGISTRATION_OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: SCORING
        trigger: "system (cascade of ContestEvent REGISTRATION_CLOSED -> JUDGING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCORING
        to: TABULATED
        trigger: "POST /categories/{id}/tabulate"
        actor: ContestLead
        preconditions:
          - "No ScoreSheet of any entry in this category remains in DRAFT or SUBMITTED (ERR_SCORESHEETS_NOT_LOCKED)"
          - "At least one entry of this category has status == PERFORMED (ERR_NO_ELIGIBLE_ENTRIES)"
        side_effects:
          - "For every PERFORMED entry: compute final_score + craftsmanship_mean per entry_final_score (variant = this.tabulation_method), assign placement_rank per placement_rank_assignment, entry -> PLACED"
          - "Non-PERFORMED, non-terminal entries keep their status and get placement_rank null"
      - from: TABULATED
        to: SCORING
        trigger: "system (tabulation reopen cascade: a scoresheet of a category entry is reopened, or a PLACED entry of this category is disqualified)"
        actor: system
        preconditions: []
        side_effects:
          - "All PLACED entries of this category revert PLACED -> PERFORMED with placement_rank null, final_score null, craftsmanship_mean null"
          - "If parent ContestEvent.status == TABULATION, contest auto-reverts TABULATION -> JUDGING (bubble-up)"

  - entity: Entry
    initial_state: SUBMITTED
    terminal_states: [WITHDRAWN, DISQUALIFIED]
    transitions:
      - from: SUBMITTED
        to: SAFETY_APPROVED
        trigger: "POST /entries/{id}/safety-check {verdict: APPROVED}"
        actor: SafetyOfficer
        preconditions:
          - "Entry.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "safety_status := APPROVED; rejected_props := []"
      - from: SUBMITTED
        to: SAFETY_REJECTED
        trigger: "POST /entries/{id}/safety-check {verdict: REJECTED}"
        actor: SafetyOfficer
        preconditions:
          - "Entry.status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "safety_status := REJECTED; rejected_props := request rejected_props (may be empty)"
      - from: SAFETY_APPROVED
        to: SAFETY_REJECTED
        trigger: "POST /entries/{id}/safety-check {verdict: REJECTED} (re-inspection; stage-queued/prejudged entries must be pulled from stage/review first)"
        actor: SafetyOfficer
        preconditions:
          - "Entry.status == SAFETY_APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "safety_status := REJECTED; rejected_props := request rejected_props"
          - "Any BOOKED PreJudgingSlot for this entry -> OPEN (booked_entry_id cleared)"
      - from: SAFETY_REJECTED
        to: SUBMITTED
        trigger: "PATCH /entries/{id} (prop_declarations changed)"
        actor: Contestant
        preconditions:
          - "Entry.status IN {SUBMITTED, SAFETY_REJECTED} (ERR_INVALID_STATE)"
          - "prop_declarations present in body and different from current (else status unchanged)"
        side_effects:
          - "safety_status := PENDING; rejected_props := []; status := SUBMITTED"
      - from: SAFETY_APPROVED
        to: PREJUDGED
        trigger: "POST /prejudging-slots/{id}/complete"
        actor: ContestLead
        preconditions:
          - "Slot status == BOOKED and slot.booked_entry_id == this entry"
        side_effects:
          - "Entry.status := PREJUDGED"
      - from: SAFETY_APPROVED
        to: STAGE_QUEUED
        trigger: "POST /performance-slots (entry.requires_prejudging == false)"
        actor: StageManager
        preconditions:
          - "Entry.status == SAFETY_APPROVED and requires_prejudging == false"
        side_effects:
          - "Entry.status := STAGE_QUEUED"
      - from: PREJUDGED
        to: STAGE_QUEUED
        trigger: "POST /performance-slots"
        actor: StageManager
        preconditions:
          - "Entry.status == PREJUDGED"
        side_effects:
          - "Entry.status := STAGE_QUEUED"
      - from: STAGE_QUEUED
        to: PERFORMED
        trigger: "POST /performance-slots/{id}/advance {to: COMPLETED}"
        actor: StageManager
        preconditions:
          - "Slot status == ON_STAGE and slot.entry_id == this entry"
        side_effects:
          - "Entry.status := PERFORMED"
      - from: STAGE_QUEUED
        to: PREJUDGED
        trigger: "POST /performance-slots/{id}/advance {to: SKIPPED}"
        actor: StageManager
        preconditions:
          - "Slot.entry_id == this entry and entry.requires_prejudging == true"
        side_effects:
          - "Entry.status := PREJUDGED (requeue allowed)"
      - from: STAGE_QUEUED
        to: SAFETY_APPROVED
        trigger: "POST /performance-slots/{id}/advance {to: SKIPPED}"
        actor: StageManager
        preconditions:
          - "Slot.entry_id == this entry and entry.requires_prejudging == false"
        side_effects:
          - "Entry.status := SAFETY_APPROVED"
      - from: PERFORMED
        to: PLACED
        trigger: "POST /categories/{id}/tabulate"
        actor: ContestLead
        preconditions:
          - "Entry is PERFORMED in a SCORING category passing tabulate preconditions"
        side_effects:
          - "placement_rank, final_score, craftsmanship_mean assigned"
      - from: PLACED
        to: PERFORMED
        trigger: "system (tabulation reopen cascade on Category)"
        actor: system
        preconditions: []
        side_effects:
          - "placement_rank := null; final_score := null; craftsmanship_mean := null"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /entries/{id}/withdraw"
        actor: Contestant
        preconditions:
          - "Entry.status IN {SUBMITTED, SAFETY_REJECTED, SAFETY_APPROVED, PREJUDGED, STAGE_QUEUED} (ERR_INVALID_STATE)"
        side_effects:
          - "WITHDRAW cascade: BOOKED PreJudgingSlot for this entry -> OPEN (booked_entry_id cleared); QUEUED/ON_STAGE PerformanceSlot for this entry -> SKIPPED; then stage_sequence_compaction resequences remaining QUEUED slots of the contest"
      - from: SAFETY_REJECTED
        to: WITHDRAWN
        trigger: "POST /entries/{id}/withdraw"
        actor: Contestant
        preconditions: []
        side_effects: ["WITHDRAW cascade as above"]
      - from: SAFETY_APPROVED
        to: WITHDRAWN
        trigger: "POST /entries/{id}/withdraw"
        actor: Contestant
        preconditions: []
        side_effects: ["WITHDRAW cascade as above"]
      - from: PREJUDGED
        to: WITHDRAWN
        trigger: "POST /entries/{id}/withdraw"
        actor: Contestant
        preconditions: []
        side_effects: ["WITHDRAW cascade as above"]
      - from: STAGE_QUEUED
        to: WITHDRAWN
        trigger: "POST /entries/{id}/withdraw"
        actor: Contestant
        preconditions: []
        side_effects: ["WITHDRAW cascade as above"]
      - from: SUBMITTED
        to: DISQUALIFIED
        trigger: "POST /entries/{id}/disqualify"
        actor: ContestLead
        preconditions:
          - "Entry.status NOT IN {WITHDRAWN, DISQUALIFIED} (ERR_INVALID_STATE)"
        side_effects:
          - "DISQUALIFY cascade link 1 (Entry -> ScoreSheet): all ScoreSheets of this entry IN {SUBMITTED, LOCKED, DRAFT} -> VOID"
          - "DISQUALIFY cascade link 2 (ScoreSheet -> Category): voiding scoresheets breaks the locked-sheet completeness of a TABULATED category -> Category auto-reverts TABULATED -> SCORING and clears sibling placements"
          - "DISQUALIFY cascade link 3 (Category -> ContestEvent): category leaving TABULATED breaks the all-categories-tabulated invariant of a TABULATION contest -> ContestEvent auto-reverts TABULATION -> JUDGING"
          - "Fan-out (direct from Entry): BOOKED PreJudgingSlot -> OPEN; QUEUED/ON_STAGE PerformanceSlot -> SKIPPED + stage_sequence_compaction; PrizeAward of this entry IN {PENDING, APPROVED} -> REVOKED with budget restore (DISBURSED/TAX_REPORTED awards are left untouched)"
      - from: SAFETY_REJECTED
        to: DISQUALIFIED
        trigger: "POST /entries/{id}/disqualify"
        actor: ContestLead
        preconditions: []
        side_effects: ["DISQUALIFY cascade as above"]
      - from: SAFETY_APPROVED
        to: DISQUALIFIED
        trigger: "POST /entries/{id}/disqualify"
        actor: ContestLead
        preconditions: []
        side_effects: ["DISQUALIFY cascade as above"]
      - from: PREJUDGED
        to: DISQUALIFIED
        trigger: "POST /entries/{id}/disqualify"
        actor: ContestLead
        preconditions: []
        side_effects: ["DISQUALIFY cascade as above"]
      - from: STAGE_QUEUED
        to: DISQUALIFIED
        trigger: "POST /entries/{id}/disqualify"
        actor: ContestLead
        preconditions: []
        side_effects: ["DISQUALIFY cascade as above"]
      - from: PERFORMED
        to: DISQUALIFIED
        trigger: "POST /entries/{id}/disqualify"
        actor: ContestLead
        preconditions: []
        side_effects: ["DISQUALIFY cascade as above"]
      - from: PLACED
        to: DISQUALIFIED
        trigger: "POST /entries/{id}/disqualify"
        actor: ContestLead
        preconditions: []
        side_effects: ["DISQUALIFY cascade as above (title stripped: placement_rank cleared)"]

  - entity: PreJudgingSlot
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: OPEN
        to: BOOKED
        trigger: "POST /prejudging-slots/{id}/book"
        actor: Contestant
        preconditions:
          - "Slot.status == OPEN (ERR_INVALID_STATE)"
          - "Entry.status IN {SAFETY_APPROVED} (ERR_INVALID_STATE — safety must clear before craftsmanship review)"
          - "Entry.category_id == slot.category_id (ERR_ENTRY_CATEGORY_MISMATCH)"
          - "Entry has no other BOOKED PreJudgingSlot (ERR_INVALID_STATE)"
        side_effects:
          - "booked_entry_id := entry_id"
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /prejudging-slots/{id}/complete"
        actor: ContestLead
        preconditions:
          - "Slot.status == BOOKED (ERR_INVALID_STATE)"
        side_effects:
          - "Booked entry: SAFETY_APPROVED -> PREJUDGED"
      - from: BOOKED
        to: OPEN
        trigger: "POST /prejudging-slots/{id}/release (contestant cancel / lead no-show) or WITHDRAW/DISQUALIFY cascade"
        actor: Contestant | ContestLead | system
        preconditions:
          - "Slot.status == BOOKED (ERR_INVALID_STATE)"
          - "Contestant caller must own the booked entry (ERR_NOT_OWNER)"
        side_effects:
          - "booked_entry_id := null; entry keeps its own status (may rebook)"

  - entity: ScoreSheet
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /scoresheets/{id}/submit"
        actor: Judge
        preconditions:
          - "ScoreSheet.status == DRAFT (ERR_INVALID_STATE)"
          - "Caller X-User-ID == scoresheet.judge_id (ERR_NOT_OWNER)"
        side_effects: []
      - from: SUBMITTED
        to: LOCKED
        trigger: "POST /categories/{id}/lock-scoresheets (bulk)"
        actor: ContestLead
        preconditions:
          - "Category.status == SCORING (ERR_INVALID_STATE)"
        side_effects:
          - "All SUBMITTED scoresheets of entries in the category -> LOCKED"
      - from: LOCKED
        to: SUBMITTED
        trigger: "POST /scoresheets/{id}/reopen"
        actor: ContestLead
        preconditions:
          - "ScoreSheet.status == LOCKED (ERR_INVALID_STATE)"
        side_effects:
          - "Reopen cascade: if the sheet's category was TABULATED, Category auto-reverts TABULATED -> SCORING (placements cleared), which in turn reverts a TABULATION contest to JUDGING"
      - from: DRAFT
        to: VOID
        trigger: "system (entry disqualified)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: VOID
        trigger: "system (entry disqualified)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOCKED
        to: VOID
        trigger: "system (entry disqualified)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PerformanceSlot
    initial_state: QUEUED
    terminal_states: [COMPLETED, SKIPPED]
    transitions:
      - from: QUEUED
        to: ON_STAGE
        trigger: "POST /performance-slots/{id}/advance {to: ON_STAGE}"
        actor: StageManager
        preconditions:
          - "Slot.status == QUEUED (ERR_INVALID_STATE)"
          - "No other PerformanceSlot of this contest currently ON_STAGE (ERR_INVALID_STATE)"
          - "Entry.status == STAGE_QUEUED and entry.safety_status == APPROVED (ERR_SAFETY_NOT_APPROVED)"
          - "Entry's contestant has consents item {scope: LIVESTREAM, status: GRANTED} (ERR_CONSENT_REQUIRED)"
        side_effects: []
      - from: ON_STAGE
        to: COMPLETED
        trigger: "POST /performance-slots/{id}/advance {to: COMPLETED}"
        actor: StageManager
        preconditions:
          - "Slot.status == ON_STAGE (ERR_INVALID_STATE)"
        side_effects:
          - "Entry STAGE_QUEUED -> PERFORMED"
      - from: QUEUED
        to: SKIPPED
        trigger: "POST /performance-slots/{id}/advance {to: SKIPPED} or WITHDRAW/DISQUALIFY cascade"
        actor: StageManager | system
        preconditions: []
        side_effects:
          - "Entry regresses STAGE_QUEUED -> PREJUDGED (or SAFETY_APPROVED when requires_prejudging == false)"
          - "stage_sequence_compaction resequences remaining QUEUED slots of the contest"
      - from: ON_STAGE
        to: SKIPPED
        trigger: "POST /performance-slots/{id}/advance {to: SKIPPED}"
        actor: StageManager
        preconditions: []
        side_effects:
          - "Same entry regression + resequence as QUEUED -> SKIPPED"

  - entity: PrizeAward
    initial_state: PENDING
    terminal_states: [TAX_REPORTED, REVOKED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /prize-awards/{id}/approve"
        actor: Treasurer
        preconditions:
          - "Award.status == PENDING (ERR_INVALID_STATE)"
          - "Caller X-User-ID != award.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approved_by_user_id := caller X-User-ID"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /prize-awards/{id}/disburse"
        actor: Treasurer
        preconditions:
          - "Award.status == APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "tax_form_received := request flag; withheld_cents + net_payout_cents computed per prize_payout_net"
      - from: DISBURSED
        to: TAX_REPORTED
        trigger: "POST /prize-awards/{id}/mark-tax-reported"
        actor: Treasurer
        preconditions:
          - "Award.status == DISBURSED (ERR_INVALID_STATE)"
          - "Award.tax_reportable == true (ERR_INVALID_STATE — sub-threshold prizes are never reported)"
          - "Award.tax_form_received == true (ERR_TAX_FORM_REQUIRED — a 1099 cannot be filed without a W-9)"
        side_effects: []
      - from: PENDING
        to: REVOKED
        trigger: "POST /prize-awards/{id}/revoke or DISQUALIFY cascade"
        actor: ContestLead | system
        preconditions:
          - "Award.status IN {PENDING, APPROVED} (ERR_INVALID_STATE)"
        side_effects:
          - "ContestEvent.budget_reserved_cents -= value_cents (budget restore; budget == reserved + available invariant)"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /prize-awards/{id}/revoke or DISQUALIFY cascade"
        actor: ContestLead | system
        preconditions: []
        side_effects:
          - "Same budget restore as PENDING -> REVOKED"

  - entity: GreenRoomBooking
    initial_state: BOOKED
    terminal_states: [CANCELLED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /green-room-bookings/{id}/cancel or contest CANCELLED cascade"
        actor: Contestant | system
        preconditions:
          - "Booking.status == BOOKED (ERR_INVALID_STATE)"
          - "Contestant caller must own the booking (ERR_NOT_OWNER)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: category-update-stale-version
    parent_entity: Category
    write_endpoint: "PATCH /categories/{id}"
    occ_field: "expected_category_version"
    description: |
      Updating a Category whose version has advanced since the caller last
      observed it (e.g. another lead changed max_entries or tabulation_method,
      or a contest transition cascade bumped the category) is rejected with a
      stale-version error rather than silently overwriting the newer config.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: entry-update-stale-version
    parent_entity: Entry
    write_endpoint: "PATCH /entries/{id}"
    occ_field: "expected_entry_version"
    description: |
      Updating an Entry whose version has advanced since the caller last
      observed it (e.g. a safety re-inspection rejected the props in the
      meantime) is rejected with a stale-version error so the contestant
      re-reads the current state before editing prop declarations.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: entry_final_score
    trigger: "POST /categories/{id}/tabulate, once per PERFORMED entry of the category"
    algorithm: weighted_scoring
    formula: |
      For each ScoreSheet s: sheet_total = round_half_up(0.5*s.craftsmanship + 0.3*s.accuracy + 0.2*s.presentation, 2)
      Input set S = scoresheets with entry_id == entry AND status == LOCKED (DRAFT, SUBMITTED, VOID excluded).
      Variant WEIGHTED_MEAN: final_score = round_half_up(mean(sheet_total over S), 2)
      Variant TRIMMED_MEAN: if |S| >= 3, drop exactly one highest and one lowest sheet_total
      (ties: drop one instance only), then final_score = round_half_up(mean(remainder), 2);
      if |S| < 3, TRIMMED_MEAN falls back to the WEIGHTED_MEAN result (panel-size branch).
      craftsmanship_mean = round_half_up(mean(s.craftsmanship over S), 2) — tie-break field.
    input_set: "ScoreSheets of the entry with status == LOCKED; both phases pooled with equal weight per sheet"
    constants:
      W_CRAFTSMANSHIP: 0.5
      W_ACCURACY: 0.3
      W_PRESENTATION: 0.2
      TRIM_MIN_PANEL: 3
    precision: "2 decimal places, round_half_up, applied per sheet_total then per mean"
    variants:
      - name: WEIGHTED_MEAN
        when: "Category.tabulation_method == WEIGHTED_MEAN"
        difference: "Plain mean over all LOCKED sheets"
      - name: TRIMMED_MEAN
        when: "Category.tabulation_method == TRIMMED_MEAN"
        difference: "Drops one max and one min sheet_total when >= 3 sheets; identical to WEIGHTED_MEAN below 3 sheets — identical sheet set yields a different final_score whenever |S| >= 3 and extremes are non-degenerate"

  - name: placement_rank_assignment
    trigger: "POST /categories/{id}/tabulate, after all final_score values are computed"
    algorithm: aggregation
    formula: |
      Candidate set = entries of the category with status == PERFORMED (after scoring).
      Sort key 1: final_score DESC. Sort key 2 (tie): craftsmanship_mean DESC.
      Sort key 3 (further tie): created_at ASC. id is NEVER used as a tie-break.
      placement_rank = 1..N in that order; ranked entries -> PLACED.
      The same selector resolves PrizeAward creation: the PLACED entry of the
      category whose placement_rank == requested rank; empty set -> ERR_PLACEMENT_NOT_FOUND.
    input_set: "PERFORMED entries of the category at tabulate time"
    constants: {}
    precision: "ranks are integers 1..N, gap-free"

  - name: category_purse_split
    trigger: "On Category create and on PATCH /categories/{id} touching prize_purse_cents; consumed by PrizeAward creation"
    algorithm: waterfall_allocation
    formula: |
      PINNED ROUNDING ORDER (rank 1, then rank 2, then remainder):
      prize_rank1_cents = round_half_up(prize_purse_cents * 0.50)   [to integer cents]
      prize_rank2_cents = round_half_up(prize_purse_cents * 0.30)   [to integer cents]
      prize_rank3_cents = prize_purse_cents - prize_rank1_cents - prize_rank2_cents
      The naive alternative (rounding rank 3 independently as purse*0.20) is FORBIDDEN:
      e.g. purse 9999 -> pinned 5000/3000/1999, naive would give 5000/3000/2000 (sum 10000 > purse).
      Ranks beyond 3 receive no purse. prize_rankN_cents is snapshotted onto PrizeAward.value_cents at award creation.
    input_set: "The category's own prize_purse_cents"
    constants:
      RANK1_SHARE: 0.50
      RANK2_SHARE: 0.30
    precision: "integer cents, round_half_up"

  - name: prize_payout_net
    trigger: "POST /prize-awards/{id}/disburse"
    algorithm: threshold
    formula: |
      tax_reportable = (value_cents >= TAX_THRESHOLD_CENTS)   # boundary is INCLUSIVE: exactly 60000 is reportable
      Variant WITH_W9 (request tax_form_received == true):
        withheld_cents = 0; net_payout_cents = value_cents
      Variant BACKUP_WITHHOLDING (tax_form_received == false):
        withheld_cents = round_half_up(value_cents * BACKUP_WITHHOLDING_RATE)
        net_payout_cents = value_cents - withheld_cents
      Identical value_cents yields different net_payout_cents across the two variants.
    input_set: "The single PrizeAward being disbursed"
    constants:
      TAX_THRESHOLD_CENTS: 60000
      BACKUP_WITHHOLDING_RATE: 0.24
    precision: "integer cents, round_half_up"
    variants:
      - name: WITH_W9
        when: "disburse request has tax_form_received == true"
        difference: "No withholding; net == gross"
      - name: BACKUP_WITHHOLDING
        when: "disburse request has tax_form_received == false"
        difference: "24% withheld; net == gross - round_half_up(gross*0.24)"

  - name: contest_tax_summary
    trigger: "GET /contest-events/{id}/tax-summary"
    algorithm: aggregation
    formula: |
      Input set = PrizeAwards of the contest with status IN {DISBURSED, TAX_REPORTED}
      (PENDING, APPROVED, REVOKED excluded — money not yet / never out the door).
      total_prize_value_cents = sum(value_cents)
      total_withheld_cents  = sum(withheld_cents)   # per-award amounts already rounded at disburse; never re-rounded here
      reportable_award_count = count(awards with tax_reportable == true)
      disbursed_award_count  = count(input set)
    input_set: "PrizeAwards of the contest IN {DISBURSED, TAX_REPORTED}"
    constants: {}
    precision: "integer cents; no additional rounding at aggregation time"

  - name: junior_age_eligibility
    trigger: "POST /entries when target category.skill_division == JUNIOR"
    algorithm: threshold
    formula: |
      age = full calendar years between contestant.birth_date and the contest's start date
      (date part of ContestEvent.start_at); a birthday ON the contest date has already occurred.
      Eligible iff age < JUNIOR_AGE_LIMIT.
      Boundary: birth_date exactly 16 years before the contest date -> age 16 -> NOT eligible.
    input_set: "The registering contestant and the category's contest"
    constants:
      JUNIOR_AGE_LIMIT: 16
    precision: "whole years"

  - name: stage_sequence_compaction
    trigger: "After a PerformanceSlot leaves QUEUED for SKIPPED (withdraw cascade, disqualify cascade, or manual skip)"
    algorithm: chronological
    formula: |
      Remaining slots = PerformanceSlots of the contest with status == QUEUED.
      Order by sequence_number ASC, tie-break created_at ASC (id NEVER used).
      Reassign sequence_number := 1..N gap-free in that order. Each reassignment bumps the slot's version.
    input_set: "QUEUED PerformanceSlots of the contest"
    constants: {}
    precision: "integers, gap-free from 1"

  - name: green_room_overlap_count
    trigger: "POST /green-room-bookings"
    algorithm: interval_merge
    formula: |
      Overlap predicate (half-open on BOTH ends): existing overlaps new iff
      NOT (existing.end_at <= new.start_at OR existing.start_at >= new.end_at).
      Input set = GreenRoomBookings with room_name == new.room_name AND status == BOOKED.
      Reject with ERR_GREEN_ROOM_FULL iff overlap_count >= GREEN_ROOM_CAPACITY.
      Boundary: exactly GREEN_ROOM_CAPACITY overlapping bookings is legal; capacity+1 is rejected.
      Adjacent bookings (existing.end_at == new.start_at) do NOT count as overlap.
    input_set: "BOOKED GreenRoomBookings in the same room"
    constants:
      GREEN_ROOM_CAPACITY: 4
      ACCESSIBLE_ROOMS: ["EAST"]
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a known role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's roles list", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Required fields present, types correct, enums valid, ranges valid (score 0..10, end_at > start_at, rank 1..3)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path ids then body FK ids resolve, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "Ownership: Contestant acts only on own entries/consents/bookings (body contestant_id must equal X-User-ID; path resource must belong to caller); Judge acts only on own scoresheets", error_id: ERR_NOT_OWNER, http_status: 403, applies_to: "PATCH/withdraw on entries, consents, prejudging book/release, green-room create/cancel, scoresheet submit" }
  - { priority: 6, category: state, check: "State-machine preconditions of the target resource (incl. terminal lockdown, registration window, contest phase gates, tabulate/approve/disburse ordering)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "Entry creation only while contest REGISTRATION_OPEN and category OPEN", error_id: ERR_REGISTRATION_NOT_OPEN, http_status: 409, applies_to: "POST /entries" }
  - { priority: 6, category: state, check: "Prize creation requires the category to be TABULATED", error_id: ERR_CATEGORY_NOT_TABULATED, http_status: 409, applies_to: "POST /prize-awards" }
  - { priority: 6, category: state, check: "Award selector: a PLACED entry with placement_rank == rank must exist in the category", error_id: ERR_PLACEMENT_NOT_FOUND, http_status: 409, applies_to: "POST /prize-awards" }
  - { priority: 7, category: business_safety, check: "prop_declarations contain no BANNED_PROP_TYPES {LIVE_STEEL, FIREARM, PYROTECHNICS}", error_id: ERR_PROP_BANNED, http_status: 422, applies_to: "POST /entries, PATCH /entries/{id}" }
  - { priority: 7, category: business_safety, check: "Stage access requires entry.safety_status == APPROVED", error_id: ERR_SAFETY_NOT_APPROVED, http_status: 409, applies_to: "POST /performance-slots, POST /performance-slots/{id}/advance" }
  - { priority: 7, category: business_safety, check: "Stage access requires contestant consent item {scope: LIVESTREAM, status: GRANTED}", error_id: ERR_CONSENT_REQUIRED, http_status: 409, applies_to: "POST /performance-slots, POST /performance-slots/{id}/advance" }
  - { priority: 8, category: business_referential, check: "Judge.category_ids contains entry.category_id", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "POST /scoresheets" }
  - { priority: 8, category: business_referential, check: "Judge linked_contestant_id has no entry in the scoresheet entry's category", error_id: ERR_JUDGE_CONFLICT, http_status: 409, applies_to: "POST /scoresheets" }
  - { priority: 8, category: business_referential, check: "No non-VOID scoresheet exists for (judge_id, entry_id, phase)", error_id: ERR_DUPLICATE_SCORESHEET, http_status: 409, applies_to: "POST /scoresheets" }
  - { priority: 8, category: business_referential, check: "PreJudgingSlot.category_id == entry.category_id on book", error_id: ERR_ENTRY_CATEGORY_MISMATCH, http_status: 409, applies_to: "POST /prejudging-slots/{id}/book" }
  - { priority: 9, category: business_constraint, check: "Category entry_count < max_entries (>= boundary: count == max_entries rejects)", error_id: ERR_CATEGORY_FULL, http_status: 409, applies_to: "POST /entries" }
  - { priority: 9, category: business_constraint, check: "Contestant has < max_entries_per_contestant non-terminal entries in this contest; no non-terminal entry already in this category", error_id: ERR_DUPLICATE_ENTRY, http_status: 409, applies_to: "POST /entries" }
  - { priority: 9, category: business_constraint, check: "JUNIOR division: junior_age_eligibility satisfied", error_id: ERR_DIVISION_AGE_INELIGIBLE, http_status: 422, applies_to: "POST /entries" }
  - { priority: 9, category: business_constraint, check: "sequence_number unique among QUEUED/ON_STAGE slots of the contest; entry has no other QUEUED/ON_STAGE slot", error_id: ERR_SEQUENCE_CONFLICT, http_status: 409, applies_to: "POST /performance-slots, PATCH /performance-slots/{id}" }
  - { priority: 9, category: business_constraint, check: "requires_accessibility_setup == true implies room_name IN ACCESSIBLE_ROOMS", error_id: ERR_GREEN_ROOM_INACCESSIBLE, http_status: 422, applies_to: "POST /green-room-bookings" }
  - { priority: 9, category: business_constraint, check: "PrizeAward approve: caller != created_by_user_id (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /prize-awards/{id}/approve" }
  - { priority: 10, category: business_temporal, check: "PreJudgingSlot [start_at, end_at] within contest [start_at, end_at]", error_id: ERR_SLOT_OUTSIDE_WINDOW, http_status: 422, applies_to: "POST /prejudging-slots" }
  - { priority: 10, category: business_temporal, check: "GreenRoomBooking.start_at >= logical clock now", error_id: ERR_BOOKING_IN_PAST, http_status: 422, applies_to: "POST /green-room-bookings" }
  - { priority: 11, category: business_temporal, check: "PreJudgingSlot overlap per (category_id, panel_name), half-open adjacency allowed", error_id: ERR_SLOT_OVERLAP, http_status: 409, applies_to: "POST /prejudging-slots" }
  - { priority: 11, category: business_temporal, check: "Green-room overlap count < GREEN_ROOM_CAPACITY per green_room_overlap_count", error_id: ERR_GREEN_ROOM_FULL, http_status: 409, applies_to: "POST /green-room-bookings" }
  - { priority: 12, category: business_fiscal, check: "Contest budget: budget_reserved_cents + new award value_cents <= prize_budget_cents", error_id: ERR_PRIZE_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /prize-awards" }
  - { priority: 12, category: business_fiscal, check: "mark-tax-reported requires tax_form_received == true", error_id: ERR_TAX_FORM_REQUIRED, http_status: 409, applies_to: "POST /prize-awards/{id}/mark-tax-reported" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/contest-events", description: "Create a contest (starts SETUP)", roles: [ContestLead], code: 201, input: [name, start_at, end_at, prize_budget_cents, "max_entries_per_contestant?"], output: ContestEvent, side_effects: [] }
  - { method: GET, path: "/contest-events/{id}", description: "Read one contest incl. computed budget fields", roles: [ContestLead, Treasurer, StageManager, Judge, SafetyOfficer, Contestant], code: 200, input: [], output: ContestEvent, side_effects: [] }
  - { method: POST, path: "/contest-events/{id}/transition", description: "Advance/revert contest status per ContestEvent machine; cascades per §1.2", roles: [ContestLead], code: 200, input: [to], output: ContestEvent, side_effects: ["category DRAFT->OPEN or OPEN->SCORING cascades", "CANCELLED cascades to entries/slots/bookings", "increments ContestEvent.version"] }
  - { method: GET, path: "/contest-events/{id}/tax-summary", description: "Computed read per contest_tax_summary", roles: [Treasurer, ContestLead], code: 200, input: [], output: { total_prize_value_cents: integer, total_withheld_cents: integer, reportable_award_count: integer, disbursed_award_count: integer }, side_effects: [] }
  - { method: GET, path: "/contest-events/{id}/categories", description: "FK reverse: categories of a contest", roles: [ContestLead, Treasurer, StageManager, Judge, SafetyOfficer, Contestant], code: 200, input: [], output: "Category[]", side_effects: [] }
  - { method: GET, path: "/contest-events/{id}/judges", description: "FK reverse: judges of a contest", roles: [ContestLead, Judge], code: 200, input: [], output: "Judge[]", side_effects: [] }

  - { method: POST, path: "/categories", description: "Create a category in a contest (DRAFT); computes purse split", roles: [ContestLead], code: 201, input: [contest_id, name, skill_division, max_entries, tabulation_method, prize_purse_cents], output: Category, side_effects: ["category_purse_split"] }
  - { method: GET, path: "/categories/{id}", description: "Read one category", roles: [ContestLead, Treasurer, StageManager, Judge, SafetyOfficer, Contestant], code: 200, input: [], output: Category, side_effects: [] }
  - { method: PATCH, path: "/categories/{id}", description: "Edit category config; only while parent contest is SETUP; OCC-guarded", roles: [ContestLead], code: 200, input: ["name?", "skill_division?", "max_entries?", "tabulation_method?", "prize_purse_cents?", expected_category_version], output: Category, side_effects: ["category_purse_split if purse changed", "increments Category.version"] }
  - { method: POST, path: "/categories/{id}/tabulate", description: "Compute final scores, assign ranks, category -> TABULATED", roles: [ContestLead], code: 200, input: [], output: { placed_entry_count: integer, category_id: string }, side_effects: ["entry_final_score", "placement_rank_assignment", "entries PERFORMED -> PLACED"] }
  - { method: POST, path: "/categories/{id}/lock-scoresheets", description: "Bulk: all SUBMITTED scoresheets of the category's entries -> LOCKED", roles: [ContestLead], code: 200, input: [], output: { locked_count: integer }, side_effects: ["ScoreSheet SUBMITTED -> LOCKED"] }

  - { method: POST, path: "/contestants", description: "Self-register a contestant profile", roles: [Anonymous], code: 201, input: [full_name, email, birth_date, "accessibility_needs?"], output: Contestant, side_effects: [] }
  - { method: GET, path: "/contestants/{id}", description: "Read a contestant (self or lead)", roles: [Contestant, ContestLead], code: 200, input: [], output: Contestant, side_effects: [] }
  - { method: POST, path: "/contestants/{id}/consents", description: "Grant (granted=true) or revoke (granted=false) one media-consent scope; cyclic upsert of the scope's consent item", roles: [Contestant], code: 200, input: [scope, granted], output: Contestant, side_effects: ["upsert consents item", "increments Contestant.version"] }
  - { method: GET, path: "/contestants/{id}/judges", description: "FK reverse: judges linked to this contestant", roles: [ContestLead], code: 200, input: [], output: "Judge[]", side_effects: [] }

  - { method: POST, path: "/judges", description: "Onboard a judge to a contest panel", roles: [ContestLead], code: 201, input: [contest_id, display_name, category_ids, "linked_contestant_id?"], output: Judge, side_effects: [] }

  - { method: POST, path: "/entries", description: "Register an entry (SUBMITTED); safety_status starts PENDING", roles: [Contestant], code: 201, input: [contestant_id, category_id, title, prop_declarations, "character_source?", "requires_prejudging?"], output: Entry, side_effects: ["category entry_count recompute"] }
  - { method: GET, path: "/entries", description: "List entries; filters are FK reverse channels", roles: [ContestLead, Treasurer, StageManager, Judge, SafetyOfficer, Contestant], code: 200, input: ["category_id?", "contestant_id?", "contest_id?", "status?"], output: "Entry[]", side_effects: [] }
  - { method: GET, path: "/entries/{id}", description: "Read one entry", roles: [ContestLead, Treasurer, StageManager, Judge, SafetyOfficer, Contestant], code: 200, input: [], output: Entry, side_effects: [] }
  - { method: PATCH, path: "/entries/{id}", description: "Edit title/props while SUBMITTED or SAFETY_REJECTED; prop change on SAFETY_REJECTED resubmits (cycle to SUBMITTED); OCC-guarded", roles: [Contestant], code: 200, input: ["title?", "character_source?", "prop_declarations?", expected_entry_version], output: Entry, side_effects: ["SAFETY_REJECTED -> SUBMITTED when prop_declarations changed", "increments Entry.version"] }
  - { method: POST, path: "/entries/{id}/withdraw", description: "Contestant withdraws; WITHDRAW cascade per §1.2", roles: [Contestant], code: 200, input: [], output: Entry, side_effects: ["slot release", "performance skip + stage_sequence_compaction"] }
  - { method: POST, path: "/entries/{id}/disqualify", description: "Lead disqualifies; DISQUALIFY cascade per §1.2 (sheets VOID -> category revert -> contest revert; award revoke; slot/perf release)", roles: [ContestLead], code: 200, input: ["reason?"], output: Entry, side_effects: ["full disqualify cascade"] }
  - { method: POST, path: "/entries/{id}/safety-check", description: "Prop/weapon policy check at check-in; verdict APPROVED|REJECTED; re-inspection of SAFETY_APPROVED/PREJUDGED/STAGE_QUEUED entries allowed (REJECTED regresses entry)", roles: [SafetyOfficer], code: 200, input: [verdict, "rejected_props?"], output: Entry, side_effects: ["entry safety transitions per §1.2"] }

  - { method: POST, path: "/prejudging-slots", description: "Define a craftsmanship-review slot for a category panel", roles: [ContestLead], code: 201, input: [category_id, panel_name, start_at, end_at], output: PreJudgingSlot, side_effects: [] }
  - { method: GET, path: "/prejudging-slots", description: "List slots; FK reverse filters", roles: [ContestLead, Treasurer, StageManager, Judge, SafetyOfficer, Contestant], code: 200, input: ["category_id?", "booked_entry_id?", "status?"], output: "PreJudgingSlot[]", side_effects: [] }
  - { method: GET, path: "/prejudging-slots/{id}", description: "Read one slot", roles: [ContestLead, Treasurer, StageManager, Judge, SafetyOfficer, Contestant], code: 200, input: [], output: PreJudgingSlot, side_effects: [] }
  - { method: POST, path: "/prejudging-slots/{id}/book", description: "Book an OPEN slot for own SAFETY_APPROVED entry", roles: [Contestant], code: 200, input: [entry_id], output: PreJudgingSlot, side_effects: ["slot OPEN -> BOOKED"] }
  - { method: POST, path: "/prejudging-slots/{id}/release", description: "Release a BOOKED slot (contestant owner or lead no-show)", roles: [Contestant, ContestLead], code: 200, input: [], output: PreJudgingSlot, side_effects: ["slot BOOKED -> OPEN, booked_entry_id cleared"] }
  - { method: POST, path: "/prejudging-slots/{id}/complete", description: "Mark craftsmanship review done; booked entry -> PREJUDGED", roles: [ContestLead], code: 200, input: [], output: PreJudgingSlot, side_effects: ["entry SAFETY_APPROVED -> PREJUDGED"] }

  - { method: POST, path: "/scoresheets", description: "Judge creates a rubric scoresheet (DRAFT) for an entry+phase. Phase gate (pri 6): CRAFTSMANSHIP requires entry PREJUDGED; STAGE requires entry IN {STAGE_QUEUED, PERFORMED}", roles: [Judge], code: 201, input: [entry_id, phase, craftsmanship, accuracy, presentation], output: ScoreSheet, side_effects: ["sheet_total computed"] }
  - { method: GET, path: "/scoresheets", description: "List scoresheets; FK reverse filters", roles: [ContestLead, Judge], code: 200, input: ["entry_id?", "judge_id?", "category_id?", "status?"], output: "ScoreSheet[]", side_effects: [] }
  - { method: GET, path: "/scoresheets/{id}", description: "Read one scoresheet", roles: [ContestLead, Judge], code: 200, input: [], output: ScoreSheet, side_effects: [] }
  - { method: POST, path: "/scoresheets/{id}/submit", description: "Judge submits own DRAFT sheet", roles: [Judge], code: 200, input: [], output: ScoreSheet, side_effects: ["DRAFT -> SUBMITTED"] }
  - { method: POST, path: "/scoresheets/{id}/reopen", description: "Lead reopens a LOCKED sheet for correction; cascades tabulation reopen if category was TABULATED", roles: [ContestLead], code: 200, input: [], output: ScoreSheet, side_effects: ["LOCKED -> SUBMITTED", "tabulation reopen cascade"] }

  - { method: POST, path: "/performance-slots", description: "Queue an entry onto the stage order with tech cues. State gate (pri 6): entry.status IN {SUBMITTED, SAFETY_REJECTED, SAFETY_APPROVED, PREJUDGED} AND (requires_prejudging == false OR status == PREJUDGED); then safety gate (pri 7): entry.safety_status == APPROVED; then consent gate (pri 7): LIVESTREAM consent GRANTED; then constraint (pri 9): sequence uniqueness", roles: [StageManager], code: 201, input: [entry_id, sequence_number, duration_seconds, "tech_cues?"], output: PerformanceSlot, side_effects: ["entry SAFETY_APPROVED|PREJUDGED -> STAGE_QUEUED"] }
  - { method: GET, path: "/performance-slots", description: "List stage slots; FK reverse filters", roles: [ContestLead, StageManager, Judge, Contestant], code: 200, input: ["contest_id?", "entry_id?", "status?"], output: "PerformanceSlot[]", side_effects: [] }
  - { method: GET, path: "/performance-slots/{id}", description: "Read one slot", roles: [ContestLead, StageManager, Judge, Contestant], code: 200, input: [], output: PerformanceSlot, side_effects: [] }
  - { method: PATCH, path: "/performance-slots/{id}", description: "Update sequence/tech cues while QUEUED", roles: [StageManager], code: 200, input: ["sequence_number?", "duration_seconds?", "tech_cues?"], output: PerformanceSlot, side_effects: ["increments PerformanceSlot.version"] }
  - { method: POST, path: "/performance-slots/{id}/advance", description: "Stage walk: QUEUED -> ON_STAGE -> COMPLETED, or -> SKIPPED", roles: [StageManager], code: 200, input: [to], output: PerformanceSlot, side_effects: ["entry transitions per §1.2", "stage_sequence_compaction on SKIPPED"] }

  - { method: POST, path: "/prize-awards", description: "Create award for a category rank; entry auto-selected from tabulated placements; value snapshotted from purse split", roles: [Treasurer], code: 201, input: [category_id, rank], output: PrizeAward, side_effects: ["budget reservation: budget_reserved_cents += value_cents"] }
  - { method: GET, path: "/prize-awards", description: "List awards; FK reverse filters", roles: [Treasurer, ContestLead], code: 200, input: ["category_id?", "entry_id?", "contest_id?", "status?"], output: "PrizeAward[]", side_effects: [] }
  - { method: GET, path: "/prize-awards/{id}", description: "Read one award", roles: [Treasurer, ContestLead], code: 200, input: [], output: PrizeAward, side_effects: [] }
  - { method: POST, path: "/prize-awards/{id}/approve", description: "Checker approval; creator may not approve (SoD)", roles: [Treasurer], code: 200, input: [], output: PrizeAward, side_effects: ["PENDING -> APPROVED"] }
  - { method: POST, path: "/prize-awards/{id}/disburse", description: "Pay the award; prize_payout_net computes withholding variant", roles: [Treasurer], code: 200, input: [tax_form_received], output: PrizeAward, side_effects: ["APPROVED -> DISBURSED", "withheld_cents + net_payout_cents set"] }
  - { method: POST, path: "/prize-awards/{id}/mark-tax-reported", description: "Mark 1099 filed; requires tax_reportable and W-9 on file", roles: [Treasurer], code: 200, input: [], output: PrizeAward, side_effects: ["DISBURSED -> TAX_REPORTED"] }
  - { method: POST, path: "/prize-awards/{id}/revoke", description: "Revoke a PENDING/APPROVED award; restores contest budget", roles: [ContestLead], code: 200, input: [], output: PrizeAward, side_effects: ["budget_reserved_cents -= value_cents"] }

  - { method: POST, path: "/green-room-bookings", description: "Book green-room time; capacity + accessibility rules per green_room_overlap_count", roles: [Contestant], code: 201, input: [contestant_id, contest_id, room_name, start_at, end_at, "requires_accessibility_setup?"], output: GreenRoomBooking, side_effects: [] }
  - { method: GET, path: "/green-room-bookings", description: "List bookings; FK reverse filters", roles: [Contestant, ContestLead], code: 200, input: ["contestant_id?", "contest_id?", "room_name?", "status?"], output: "GreenRoomBooking[]", side_effects: [] }
  - { method: GET, path: "/green-room-bookings/{id}", description: "Read one booking", roles: [Contestant, ContestLead], code: 200, input: [], output: GreenRoomBooking, side_effects: [] }
  - { method: POST, path: "/green-room-bookings/{id}/cancel", description: "Cancel own booking", roles: [Contestant], code: 200, input: [], output: GreenRoomBooking, side_effects: ["BOOKED -> CANCELLED"] }

  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving logical clock. Server default before any set call is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time.", roles: [ContestLead], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["sets logical clock used by ERR_BOOKING_IN_PAST and timestamps"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or judge not assigned to entry's category" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Caller does not own the targeted entry/slot booking/consent/green-room booking/scoresheet" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, bad type/enum/range (score outside 0..10, end_at <= start_at, rank outside 1..3, prop_declarations not a list)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine precondition failed (wrong from-state, terminal lockdown, phase gate, duplicate active slot/perf slot, tabulate on non-SCORING, etc.)" }
  - { id: ERR_REGISTRATION_NOT_OPEN, http: 409, condition: "Entry creation while contest not REGISTRATION_OPEN or category not OPEN" }
  - { id: ERR_PROP_BANNED, http: 422, condition: "prop_declarations include a banned type (LIVE_STEEL, FIREARM, PYROTECHNICS)" }
  - { id: ERR_SAFETY_NOT_APPROVED, http: 409, condition: "Stage queue/advance while entry.safety_status != APPROVED" }
  - { id: ERR_CONSENT_REQUIRED, http: 409, condition: "Stage queue/advance without GRANTED LIVESTREAM consent" }
  - { id: ERR_JUDGE_CONFLICT, http: 409, condition: "Judge's linked_contestant_id has a non-terminal entry in the same category" }
  - { id: ERR_DUPLICATE_SCORESHEET, http: 409, condition: "Non-VOID scoresheet already exists for (judge_id, entry_id, phase)" }
  - { id: ERR_DUPLICATE_ENTRY, http: 409, condition: "Contestant already has a non-terminal entry in this category, or reached max_entries_per_contestant in the contest" }
  - { id: ERR_ENTRY_CATEGORY_MISMATCH, http: 409, condition: "Booked entry's category differs from slot's category" }
  - { id: ERR_CATEGORY_FULL, http: 409, condition: "Category entry_count == max_entries (>= boundary rejects)" }
  - { id: ERR_DIVISION_AGE_INELIGIBLE, http: 422, condition: "JUNIOR category but contestant age at contest date >= 16" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "PreJudgingSlot time overlap within same (category_id, panel_name); back-to-back allowed" }
  - { id: ERR_SEQUENCE_CONFLICT, http: 409, condition: "sequence_number taken by another QUEUED/ON_STAGE slot of the contest" }
  - { id: ERR_SLOT_OUTSIDE_WINDOW, http: 422, condition: "Slot outside contest [start_at, end_at]" }
  - { id: ERR_BOOKING_IN_PAST, http: 422, condition: "Green-room booking start_at before logical now" }
  - { id: ERR_GREEN_ROOM_INACCESSIBLE, http: 422, condition: "requires_accessibility_setup with room outside ACCESSIBLE_ROOMS" }
  - { id: ERR_GREEN_ROOM_FULL, http: 409, condition: "Overlap count == GREEN_ROOM_CAPACITY in that room" }
  - { id: ERR_PRIZE_BUDGET_EXCEEDED, http: 422, condition: "Award value would push budget_reserved_cents above prize_budget_cents" }
  - { id: ERR_TAX_FORM_REQUIRED, http: 409, condition: "mark-tax-reported without tax_form_received" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Treasurer approving own created award" }
  - { id: ERR_SCORESHEETS_NOT_LOCKED, http: 409, condition: "Tabulate while DRAFT/SUBMITTED sheets remain in the category" }
  - { id: ERR_CATEGORY_NOT_TABULATED, http: 409, condition: "Prize creation before category TABULATED" }
  - { id: ERR_PLACEMENT_NOT_FOUND, http: 409, condition: "No PLACED entry at requested rank in the category" }
  - { id: ERR_NO_ELIGIBLE_ENTRIES, http: 409, condition: "Tabulate with zero PERFORMED entries" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public caller; may only self-register a contestant profile"
    identity: opaque
    exclusive_operations: ["POST /contestants"]
    shared_operations: []
  - name: Contestant
    description: "Competing cosplayer; owns entries, consents, green-room bookings, slot bookings"
    identity: "entity_backed:Contestant"
    exclusive_operations: ["POST /entries", "PATCH /entries/{id}", "POST /entries/{id}/withdraw", "POST /contestants/{id}/consents", "POST /prejudging-slots/{id}/book", "POST /green-room-bookings", "POST /green-room-bookings/{id}/cancel"]
    shared_operations: ["GET reads of contests/categories/entries/slots", "POST /prejudging-slots/{id}/release (own bookings; shared with ContestLead)"]
  - name: ContestLead
    description: "Programming-team lead; configures contest/categories/judges, runs tabulation, disqualifies, revokes awards"
    identity: opaque
    exclusive_operations: ["POST /contest-events", "POST /contest-events/{id}/transition", "POST /categories", "PATCH /categories/{id}", "POST /categories/{id}/tabulate", "POST /categories/{id}/lock-scoresheets", "POST /judges", "POST /entries/{id}/disqualify", "POST /prejudging-slots", "POST /prejudging-slots/{id}/complete", "POST /scoresheets/{id}/reopen", "POST /prize-awards/{id}/revoke", "POST /_clock/set_current_utc"]
    shared_operations: ["GET reads", "POST /prejudging-slots/{id}/release"]
  - name: Judge
    description: "Panel judge; creates and submits own scoresheets for assigned categories"
    identity: "entity_backed:Judge"
    exclusive_operations: ["POST /scoresheets", "POST /scoresheets/{id}/submit"]
    shared_operations: ["GET reads of contests/categories/entries/slots/scoresheets"]
  - name: SafetyOfficer
    description: "Check-in prop/weapon policy inspector"
    identity: opaque
    exclusive_operations: ["POST /entries/{id}/safety-check"]
    shared_operations: ["GET reads of contests/categories/entries/slots"]
  - name: StageManager
    description: "Stage crew lead; owns performance order, tech cues, stage walk"
    identity: opaque
    exclusive_operations: ["POST /performance-slots", "PATCH /performance-slots/{id}", "POST /performance-slots/{id}/advance"]
    shared_operations: ["GET reads"]
  - name: Treasurer
    description: "Prize finance; creates/disburses/reports awards. Segregation of duties: the creating Treasurer (X-User-ID on created_by_user_id) may not approve the same award"
    identity: opaque
    exclusive_operations: ["POST /prize-awards", "POST /prize-awards/{id}/approve", "POST /prize-awards/{id}/disburse", "POST /prize-awards/{id}/mark-tax-reported"]
    shared_operations: ["GET /contest-events/{id}/tax-summary (shared with ContestLead)", "GET reads of awards"]
