scenario: |
  2940. Surcharge & Cash Discount Program Compliance (merchant payment program): state law variance on surcharging permissibility and cap amounts, network rule compliance for registration, disclosure signage and receipt line item, credit-only surcharging with debit exclusion enforcement at the terminal, cash discount versus surcharge program structure and price posting requirements, brand-level and product-level surcharging consistency rules, cap of the surcharge at the merchant discount cost with documentation, complaint and enforcement response from networks and attorneys general, program disablement in prohibited jurisdictions
domain_name: surcharge-cash-discount-compliance
api_prefix: ""

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  difficulty_level: Expert
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at its own top-level collection
  # (/merchants, /surcharge-programs, /terminals, /transactions, ...) and linked
  # only by explicit foreign-key fields carried in request bodies. No entity is
  # nested more than one segment deep in any URL; creation sub-paths
  # (POST /surcharge-programs/{id}/rate-rules) exist only to name the parent
  # whose `version` the write guards, never to establish ownership hierarchy.

  state_machine_shape: cyclic
  # SurchargeProgram is cyclic (ACTIVE -> SUSPENDED -> ACTIVE,
  # ACTIVE -> REMEDIATION -> ACTIVE, DISABLED -> SUSPENDED -> ACTIVE);
  # ComplaintCase carries two independent state dimensions on one row
  # (investigation_state x remediation_state); NetworkRegistration branches
  # (SUBMITTED -> {ACKNOWLEDGED, REJECTED}); Terminal is cyclic with a
  # conditional restore branch (QUARANTINED -> ENFORCING | CONFIGURED).

  relationship_patterns:
    - one_to_many        # Merchant -> CostDocumentation / SurchargeProgram / Terminal
    - cross_aggregate    # Terminal.program_id and Transaction.program_id cross the merchant aggregate
    - polymorphic_none   # no polymorphic references
    # no self_referential entity in this domain

  role_model: segregation_of_duties
  # The ComplianceOfficer user who attested a program's disclosure artifacts may
  # not be the ComplianceOfficer who activates that program; the officer who
  # created a remediation refund may not be the officer who issues it.
  # NetworkAuditor and StateRegulator own disjoint complaint sources.

  consistency_model: immediate

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: state_code
        type: string
        source: input
        description: Two-letter US state postal code governing surcharge law for merchants in this jurisdiction.
        constraints: "exactly 2 uppercase letters; unique across all Jurisdiction rows (ERR_DUPLICATE_JURISDICTION_STATE)"
      - name: surcharge_permitted
        type: boolean
        source: input
        description: True when state law permits credit-card surcharging.
      - name: surcharge_cap_pct
        type: number
        source: input
        description: Statutory maximum surcharge percentage; null when surcharge_permitted is false.
        constraints: "null OR 0 < value <= 100, 4 decimal places; REQUIRED non-null when surcharge_permitted is true (ERR_JURISDICTION_CAP_REQUIRED); MUST be null when surcharge_permitted is false"
      - name: cash_discount_permitted
        type: boolean
        source: input
        description: True when state law permits a cash-discount program structure.
      - name: price_posting_required
        type: boolean
        source: input
        description: True when state law requires a posted dual-price list for cash-discount programs.
      - name: disclosure_signage_required
        type: boolean
        source: input
        description: True when state law requires entry and point-of-sale disclosure signage.
      - name: receipt_line_item_required
        type: boolean
        source: input
        description: True when state law requires the surcharge to appear as its own receipt line item.
      - name: ag_enforcement_posture
        type: enum
        source: input
        description: Attorney-general enforcement posture used as the AG_METHOD exposure multiplier.
        constraints: "one of {PERMISSIVE, MONITORED, RESTRICTIVE}"
      - name: law_change_count
        type: integer
        source: computed
        description: Number of POST /jurisdictions/{id}/law-changes applied to this jurisdiction.
        default: 0
      - name: last_law_change_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent law change; null before the first one.
        default: null

  - name: Merchant
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: FK -> Jurisdiction.id; the state whose surcharge law governs every program of this merchant.
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the merchant.
        constraints: "1..200 characters"
      - name: mcc
        type: string
        source: input
        description: Four-digit merchant category code.
        constraints: "exactly 4 digits"
      - name: gross_surcharge_collected_cents
        type: integer
        source: computed
        description: "Sum of Transaction.surcharge_amount_cents over transactions whose terminal_id belongs to this merchant and whose outcome == APPROVED_WITH_SURCHARGE; never decreases."
        default: 0
      - name: net_surcharge_collected_cents
        type: integer
        source: computed
        description: "gross_surcharge_collected_cents minus the sum of RemediationRefund.refund_amount_cents in state ISSUED for this merchant's transactions."
        default: 0
      - name: enforcing_terminal_count
        type: integer
        source: computed
        description: "Count of Terminal rows with merchant_id == this Merchant.id and state == ENFORCING."
        default: 0
      - name: active_cost_documentation_id
        type: string
        source: computed
        description: Identifier of this merchant's single CostDocumentation whose state == ACTIVE; null when the merchant has none.
        default: null

  - name: CostDocumentation
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: merchant_id
        type: string
        source: input
        description: FK -> Merchant.id; merchant whose merchant-discount cost this document evidences.
      - name: base_mdr_pct
        type: number
        source: input
        description: Documented base merchant-discount rate percentage charged by the acquirer.
        constraints: "0 <= value <= 100, up to 4 decimal places"
      - name: assessment_pct
        type: number
        source: input
        description: Documented network assessment percentage.
        constraints: "0 <= value <= 100, up to 4 decimal places"
      - name: per_item_fee_cents
        type: integer
        source: input
        description: Documented fixed per-transaction fee in cents.
        constraints: "0 <= value <= 100000"
      - name: evidence_uri
        type: string
        source: input
        description: Location of the acquirer statement evidencing the documented cost.
        constraints: "1..300 characters"
      - name: average_ticket_cents
        type: integer
        source: computed
        description: "Average Transaction.base_amount_cents over this merchant's transactions, frozen at creation time by the average_ticket_snapshot calculation; DEFAULT_AVERAGE_TICKET_CENTS when the merchant has no transactions."
      - name: documented_cost_pct
        type: number
        source: computed
        description: "base_mdr_pct + assessment_pct + (per_item_fee_cents / average_ticket_cents * 100), rounded to 4 decimal places half-up; frozen at creation."
      - name: attested_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who filed this document.
      - name: effective_from
        type: datetime
        source: system
        description: Logical-clock instant at which this document was filed.
      - name: state
        type: enum
        source: computed
        description: ACTIVE until a newer CostDocumentation for the same merchant is filed, then SUPERSEDED.
        constraints: "one of {ACTIVE, SUPERSEDED}"
        default: ACTIVE
      - name: superseded_at
        type: datetime
        source: system
        description: Logical-clock instant at which this document was superseded; null while ACTIVE.
        default: null

  - name: SurchargeProgram
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: merchant_id
        type: string
        source: input
        description: FK -> Merchant.id; merchant operating this program.
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; MUST equal Merchant.jurisdiction_id at creation (ERR_JURISDICTION_SCOPE_MISMATCH)."
      - name: cost_documentation_id
        type: string
        source: input
        description: "FK -> CostDocumentation.id; pinned cost evidence, MUST be state == ACTIVE and belong to merchant_id at pin time."
      - name: program_type
        type: enum
        source: input
        description: SURCHARGE adds a card-acceptance fee on top of the posted price; CASH_DISCOUNT posts the card price and deducts a discount for cash.
        constraints: "one of {SURCHARGE, CASH_DISCOUNT}; immutable after creation"
      - name: consistency_scope
        type: enum
        source: input
        description: BRAND_LEVEL requires every rate rule to carry product_tier == ALL; PRODUCT_LEVEL requires every rate rule to name a specific credit tier.
        constraints: "one of {BRAND_LEVEL, PRODUCT_LEVEL}"
      - name: status
        type: enum
        source: computed
        description: Program lifecycle state.
        constraints: "one of {DRAFT, PENDING_REGISTRATION, ACTIVE, SUSPENDED, REMEDIATION, DISABLED, WITHDRAWN}"
        default: DRAFT
      - name: disable_reason
        type: enum
        source: computed
        description: Why the program left ACTIVE; reset to NONE by every transition back into ACTIVE.
        constraints: "one of {NONE, JURISDICTION_PROHIBITION, REGISTRATION_REVOKED, REMEDIATION_ORDER, OPERATOR_SUSPENSION}"
        default: NONE
      - name: effective_cap_pct
        type: number
        source: computed
        description: "Recomputed by the effective_surcharge_cap calculation on every mutation of this program; for SURCHARGE programs min(CostDocumentation.documented_cost_pct, Jurisdiction.surcharge_cap_pct, NETWORK_MAX_SURCHARGE_PCT), for CASH_DISCOUNT programs CASH_DISCOUNT_MAX_PCT."
      - name: disclosure_ready
        type: boolean
        source: computed
        description: "Recomputed by the disclosure_readiness calculation; true when every artifact_type required by this program_type and this jurisdiction's flags has a DisclosureArtifact in state ATTESTED whose window contains the logical clock."
        default: false
      - name: network_exposure_score
        type: number
        source: computed
        description: "NETWORK_METHOD variant of compliance_exposure_score over this program's ComplaintCase rows, 2 decimal places."
        default: 0
      - name: ag_exposure_score
        type: number
        source: computed
        description: "AG_METHOD variant of compliance_exposure_score over this program's ComplaintCase rows, 2 decimal places."
        default: 0
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent transition into ACTIVE; null before first activation.
        default: null
      - name: activated_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who performed the most recent activation; null before first activation.
        default: null
      - name: cost_documentation_pinned_at
        type: datetime
        source: system
        description: Logical-clock instant at which cost_documentation_id was last set or re-pinned.

  - name: BrandRateRule
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> SurchargeProgram.id; program whose rate table contains this rule.
      - name: brand
        type: enum
        source: input
        description: Card brand this rule prices.
        constraints: "one of {VISA, MASTERCARD, DISCOVER, AMEX}"
      - name: product_tier
        type: enum
        source: input
        description: Credit product tier this rule prices; ALL means every credit product of the brand.
        constraints: "one of {ALL, CONSUMER_CREDIT, COMMERCIAL_CREDIT, REWARDS_CREDIT}"
      - name: rate_pct
        type: number
        source: input
        description: Surcharge (or cash-discount) percentage applied to Transaction.base_amount_cents.
        constraints: "0 < value <= 100, up to 4 decimal places"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of this rule's closed effectivity interval.
      - name: effective_to
        type: datetime
        source: input
        description: "Inclusive end of this rule's closed effectivity interval; MUST be strictly after effective_from."
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who filed this rule.

  - name: NetworkRegistration
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> SurchargeProgram.id; program being registered with the network.
      - name: network
        type: enum
        source: input
        description: Card network receiving the surcharge-program registration.
        constraints: "one of {VISA, MASTERCARD, DISCOVER, AMEX}; at most one non-REJECTED, non-REVOKED registration per (program_id, network)"
      - name: registration_ref
        type: string
        source: input
        description: Network-issued registration reference string supplied by the filing officer.
        constraints: "1..64 characters"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant at which the registration was submitted.
      - name: notice_days
        type: integer
        source: computed
        description: NOTICE_PERIOD_DAYS constant copied onto the row at submission.
      - name: earliest_effective_at
        type: datetime
        source: computed
        description: "submitted_at plus notice_days days; effectuation is rejected while the logical clock is strictly before this instant."
      - name: state
        type: enum
        source: computed
        description: Registration lifecycle state.
        constraints: "one of {SUBMITTED, ACKNOWLEDGED, EFFECTIVE, REJECTED, REVOKED}"
        default: SUBMITTED
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the NetworkAuditor who acknowledged, rejected, or revoked; null while SUBMITTED.
        default: null
      - name: decision_note
        type: string
        source: input
        description: Free-text note captured on the acknowledge/reject/revoke decision; null while SUBMITTED.
        default: null
      - name: effective_at
        type: datetime
        source: system
        description: Logical-clock instant at which the registration became EFFECTIVE; null otherwise.
        default: null
      - name: revoked_at
        type: datetime
        source: system
        description: Logical-clock instant at which the registration was REVOKED; null otherwise.
        default: null

  - name: DisclosureArtifact
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> SurchargeProgram.id; program this disclosure evidences.
      - name: artifact_type
        type: enum
        source: input
        description: Which mandated disclosure this artifact satisfies.
        constraints: "one of {ENTRY_SIGNAGE, POS_SIGNAGE, RECEIPT_TEMPLATE, PRICE_LIST_POSTING}"
      - name: content_hash
        type: string
        source: input
        description: SHA-256 hex digest of the signage or receipt-template artifact as filed by the merchant.
        constraints: "exactly 64 lowercase hex characters"
      - name: state
        type: enum
        source: computed
        description: Artifact lifecycle state.
        constraints: "one of {DRAFT, ATTESTED, EXPIRED}"
        default: DRAFT
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the attested window; supplied on POST /disclosure-artifacts/{id}/attest, null while DRAFT."
        default: null
      - name: expires_at
        type: datetime
        source: input
        description: "Exclusive end of the attested window; supplied on attest and MUST be strictly after effective_from."
        default: null
      - name: attested_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who attested this artifact; null while DRAFT.
        default: null
      - name: attested_at
        type: datetime
        source: system
        description: Logical-clock instant of attestation; null while DRAFT.
        default: null
      - name: expired_reason
        type: enum
        source: computed
        description: Why an ATTESTED artifact was forced to EXPIRED by a cascade.
        constraints: "one of {NONE, REMEDIATION_ORDER, PROGRAM_WITHDRAWN}"
        default: NONE

  - name: Terminal
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: merchant_id
        type: string
        source: input
        description: FK -> Merchant.id; merchant that owns this point-of-sale terminal.
      - name: program_id
        type: string
        source: input
        description: "FK -> SurchargeProgram.id; program whose rate table this terminal enforces, set by POST /terminals/{id}/configure; null while PROVISIONED."
        default: null
      - name: serial_number
        type: string
        source: input
        description: Manufacturer serial number of the terminal.
        constraints: "1..40 characters; unique per merchant_id (ERR_DUPLICATE_TERMINAL_SERIAL)"
      - name: debit_exclusion_enabled
        type: boolean
        source: input
        description: "True when the terminal's BIN table excludes debit and prepaid BINs from surcharging; set by configure."
        default: false
      - name: bin_table_version
        type: string
        source: input
        description: "Version tag of the BIN table loaded on the terminal; set by configure, null while PROVISIONED."
        default: null
      - name: state
        type: enum
        source: computed
        description: Terminal lifecycle state.
        constraints: "one of {PROVISIONED, CONFIGURED, ENFORCING, QUARANTINED, DISABLED}"
        default: PROVISIONED
      - name: quarantine_reason
        type: enum
        source: computed
        description: Why the terminal was quarantined; reset to NONE on every transition into ENFORCING or CONFIGURED.
        constraints: "one of {NONE, PROGRAM_SUSPENDED, PROGRAM_DISABLED, DISCLOSURE_EXPIRED, OPERATOR_ACTION}"
        default: NONE
      - name: last_configured_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent configure call; null while PROVISIONED.
        default: null

  - name: Transaction
    parent: null
    common_fields: false
    entity_kind: event
    fields:
      - name: terminal_id
        type: string
        source: input
        description: FK -> Terminal.id; terminal that captured this sale.
      - name: program_id
        type: string
        source: input
        description: "FK -> SurchargeProgram.id; program the terminal claims to be enforcing, MUST equal Terminal.program_id (ERR_TERMINAL_PROGRAM_MISMATCH)."
      - name: card_brand
        type: enum
        source: input
        description: Card brand presented at the terminal.
        constraints: "one of {VISA, MASTERCARD, DISCOVER, AMEX}"
      - name: card_funding
        type: enum
        source: input
        description: Funding type resolved from the terminal's BIN table.
        constraints: "one of {CREDIT, DEBIT, PREPAID}"
      - name: product_tier
        type: enum
        source: input
        description: "Credit product tier resolved from the BIN table; MUST be NOT_APPLICABLE when card_funding != CREDIT."
        constraints: "one of {CONSUMER_CREDIT, COMMERCIAL_CREDIT, REWARDS_CREDIT, NOT_APPLICABLE}"
      - name: base_amount_cents
        type: integer
        source: input
        description: Posted price of the goods before any surcharge or cash discount.
        constraints: "1 <= value <= 100000000"
      - name: requested_surcharge_cents
        type: integer
        source: input
        description: "Surcharge the terminal computed locally; MUST equal the server's surcharge_amount_cents (ERR_SURCHARGE_AMOUNT_MISMATCH)."
        constraints: "0 <= value <= 100000000"
      - name: receipt_line_present
        type: boolean
        source: input
        description: True when the printed receipt carried a separate surcharge line item.
      - name: applied_rate_pct
        type: number
        source: computed
        description: rate_pct of the BrandRateRule selected by the rate_rule_selection policy; 0 when no surcharge applies.
      - name: surcharge_amount_cents
        type: integer
        source: computed
        description: Surcharge collected on this sale; always 0 for CASH_DISCOUNT programs and for non-CREDIT funding.
      - name: cash_discount_amount_cents
        type: integer
        source: computed
        description: Cash discount that would apply off the posted price; always 0 for SURCHARGE programs.
      - name: cash_price_cents
        type: integer
        source: computed
        description: "base_amount_cents minus cash_discount_amount_cents; equals base_amount_cents for SURCHARGE programs."
      - name: total_amount_cents
        type: integer
        source: computed
        description: Amount actually charged to the card, base_amount_cents plus surcharge_amount_cents.
      - name: outcome
        type: enum
        source: computed
        description: Which arm of the transaction_price_resolution calculation produced this row.
        constraints: "one of {APPROVED_WITH_SURCHARGE, APPROVED_NO_SURCHARGE, APPROVED_CASH_DISCOUNT}"
      - name: refunded_surcharge_cents
        type: integer
        source: computed
        description: "Sum of RemediationRefund.refund_amount_cents in state ISSUED referencing this transaction; recomputed on read."
        default: 0
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock instant at which the sale was captured.

  - name: ComplaintCase
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> SurchargeProgram.id; program the complaint targets.
      - name: source
        type: enum
        source: input
        description: Who filed the complaint; determines which role may substantiate or dismiss it and the response window.
        constraints: "one of {NETWORK, ATTORNEY_GENERAL, CARDHOLDER}"
      - name: allegation_type
        type: enum
        source: input
        description: Substance of the allegation.
        constraints: "one of {UNDISCLOSED_SURCHARGE, DEBIT_SURCHARGED, CAP_EXCEEDED, MISSING_RECEIPT_LINE, PROHIBITED_JURISDICTION, PRICE_POSTING_MISSING}"
      - name: narrative
        type: string
        source: input
        description: Complaint narrative as filed.
        constraints: "1..2000 characters"
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the NetworkAuditor or StateRegulator who filed the case.
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant at which the complaint was received.
      - name: response_due_at
        type: datetime
        source: computed
        description: "received_at plus RESPONSE_WINDOW_DAYS[source] days, per the response_window_assignment calculation."
      - name: investigation_state
        type: enum
        source: computed
        description: First of the two independent state dimensions on this row.
        constraints: "one of {OPEN, UNDER_REVIEW, SUBSTANTIATED, DISMISSED}"
        default: OPEN
      - name: remediation_state
        type: enum
        source: computed
        description: Second of the two independent state dimensions on this row; advances only after investigation_state == SUBSTANTIATED.
        constraints: "one of {NONE, PLAN_REQUIRED, PLAN_SUBMITTED, PLAN_ACCEPTED, CLOSED}"
        default: NONE
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who moved the case to UNDER_REVIEW; null before review.
        default: null
      - name: plan_summary
        type: string
        source: input
        description: Remediation plan text supplied with the SUBMIT_PLAN action; null before submission.
        default: null
      - name: refund_total_cents
        type: integer
        source: computed
        description: "Sum of RemediationRefund.refund_amount_cents in state ISSUED attached to this case."
        default: 0

  - name: RemediationRefund
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: complaint_case_id
        type: string
        source: input
        description: FK -> ComplaintCase.id; case whose accepted remediation plan this refund executes.
      - name: transaction_id
        type: string
        source: input
        description: "FK -> Transaction.id; transaction whose surcharge is being refunded; at most one non-VOIDED refund per (complaint_case_id, transaction_id)."
      - name: refund_amount_cents
        type: integer
        source: input
        description: Surcharge amount refunded to the cardholder in cents.
        constraints: "1 <= value <= Transaction.surcharge_amount_cents minus Transaction.refunded_surcharge_cents"
      - name: state
        type: enum
        source: computed
        description: Refund lifecycle state.
        constraints: "one of {PENDING, ISSUED, VOIDED}"
        default: PENDING
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who created the refund row.
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who issued the refund; MUST differ from created_by_user_id (ERR_SEGREGATION_OF_DUTIES)."
        default: null
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant at which the refund was issued; null otherwise.
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: Logical-clock instant at which the refund was voided; null otherwise.
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SurchargeProgram
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: PENDING_REGISTRATION
        trigger: "POST /surcharge-programs/{id}/network-registrations"
        actor: ComplianceOfficer
        preconditions:
          - "program.program_type == SURCHARGE"
          - "program.status == DRAFT"
          - "Jurisdiction.surcharge_permitted == true for program.jurisdiction_id"
        side_effects:
          - "creates NetworkRegistration in state SUBMITTED with notice_days = NOTICE_PERIOD_DAYS and earliest_effective_at = submitted_at + NOTICE_PERIOD_DAYS days"
          - "increments SurchargeProgram.version by 1"
        note: "CASH_DISCOUNT programs never enter PENDING_REGISTRATION; network registration does not apply to them."

      - from: DRAFT
        to: ACTIVE
        trigger: "POST /surcharge-programs/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "program.program_type == CASH_DISCOUNT"
          - "Jurisdiction.cash_discount_permitted == true"
          - "X-User-ID differs from every DisclosureArtifact.attested_by_user_id of this program (ERR_SEGREGATION_OF_DUTIES)"
          - "CostDocumentation referenced by program.cost_documentation_id is in state ACTIVE"
          - "disclosure_readiness calculation yields true for the CASH_DISCOUNT required-artifact set"
          - "when Jurisdiction.price_posting_required == true, a PRICE_LIST_POSTING DisclosureArtifact is ATTESTED with the clock inside its window (ERR_PRICE_POSTING_REQUIRED)"
          - "at least one BrandRateRule whose closed [effective_from, effective_to] interval contains the logical clock exists"
        side_effects:
          - "sets activated_at and activated_by_user_id from the logical clock and X-User-ID"
          - "sets disable_reason = NONE"
          - "recomputes SurchargeProgram.effective_cap_pct via effective_surcharge_cap (CASH_DISCOUNT arm)"
          - "recomputes SurchargeProgram.disclosure_ready via disclosure_readiness"
          - "increments SurchargeProgram.version by 1"
        note: "Cash-discount branch of the fork: no NetworkRegistration is consulted and no brand-coverage check runs."

      - from: PENDING_REGISTRATION
        to: ACTIVE
        trigger: "POST /surcharge-programs/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "program.program_type == SURCHARGE"
          - "Jurisdiction.surcharge_permitted == true (ERR_SURCHARGE_PROHIBITED_JURISDICTION)"
          - "X-User-ID differs from every DisclosureArtifact.attested_by_user_id of this program (ERR_SEGREGATION_OF_DUTIES)"
          - "CostDocumentation referenced by program.cost_documentation_id is in state ACTIVE (ERR_COST_DOCUMENTATION_STALE)"
          - "at least one NetworkRegistration of this program is in state EFFECTIVE (ERR_REGISTRATION_NOT_EFFECTIVE)"
          - "every network with an EFFECTIVE NetworkRegistration has a BrandRateRule for that brand whose closed interval contains the logical clock (ERR_BRAND_CONSISTENCY_VIOLATION)"
          - "disclosure_readiness calculation yields true for the SURCHARGE required-artifact set (ERR_DISCLOSURE_INCOMPLETE)"
        side_effects:
          - "sets activated_at and activated_by_user_id from the logical clock and X-User-ID"
          - "sets disable_reason = NONE"
          - "recomputes SurchargeProgram.effective_cap_pct via effective_surcharge_cap (SURCHARGE arm)"
          - "recomputes SurchargeProgram.disclosure_ready via disclosure_readiness"
          - "increments SurchargeProgram.version by 1"
        note: "Surcharge branch of the fork: registration effectiveness and brand coverage are both required, unlike the CASH_DISCOUNT branch."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /surcharge-programs/{id}/status-actions with action = SUSPEND"
        actor: ComplianceOfficer | NetworkAuditor
        preconditions:
          - "program.status == ACTIVE"
        side_effects:
          - "sets disable_reason = OPERATOR_SUSPENSION"
          - "CASCADE STEP 1: every Terminal with program_id == this program and state == ENFORCING transitions to QUARANTINED with quarantine_reason = PROGRAM_SUSPENDED"
          - "CASCADE STEP 2: each such terminal transition recomputes Merchant.enforcing_terminal_count for its merchant_id"
          - "increments SurchargeProgram.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /surcharge-programs/{id}/status-actions with action = RESUME"
        actor: ComplianceOfficer
        preconditions:
          - "program.status == SUSPENDED"
          - "Jurisdiction.surcharge_permitted == true when program_type == SURCHARGE, Jurisdiction.cash_discount_permitted == true when program_type == CASH_DISCOUNT"
          - "no NetworkRegistration of this program is in state REVOKED when program_type == SURCHARGE (ERR_REGISTRATION_NOT_EFFECTIVE)"
          - "disclosure_readiness calculation yields true (ERR_DISCLOSURE_INCOMPLETE)"
        side_effects:
          - "sets disable_reason = NONE"
          - "sets activated_at and activated_by_user_id from the logical clock and X-User-ID"
          - "recomputes SurchargeProgram.effective_cap_pct via effective_surcharge_cap"
          - "recomputes SurchargeProgram.disclosure_ready via disclosure_readiness"
          - "increments SurchargeProgram.version by 1"
        note: "Closes the ACTIVE -> SUSPENDED -> ACTIVE cycle; quarantined terminals are NOT auto-restored, POST /terminals/{id}/state-actions RESTORE is required."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade from POST /network-registrations/{id}/decision with decision = REVOKE"
        actor: system
        preconditions:
          - "the revoked NetworkRegistration was in state EFFECTIVE"
          - "program.status == ACTIVE"
        side_effects:
          - "sets disable_reason = REGISTRATION_REVOKED"
          - "CASCADE STEP 1: every Terminal with program_id == this program and state == ENFORCING transitions to QUARANTINED with quarantine_reason = PROGRAM_SUSPENDED"
          - "CASCADE STEP 2: each such terminal transition recomputes Merchant.enforcing_terminal_count for its merchant_id"
          - "increments SurchargeProgram.version by 1"

      - from: ACTIVE
        to: REMEDIATION
        trigger: "system cascade from POST /complaint-cases/{id}/investigation-actions with action = SUBSTANTIATE"
        actor: system
        preconditions:
          - "the case's investigation_state just became SUBSTANTIATED"
          - "program.status == ACTIVE"
          - "recomputed SurchargeProgram.network_exposure_score >= REMEDIATION_EXPOSURE_THRESHOLD"
        side_effects:
          - "sets disable_reason = REMEDIATION_ORDER"
          - "CASCADE STEP 1: every DisclosureArtifact of this program in state ATTESTED transitions to EXPIRED with expired_reason = REMEDIATION_ORDER"
          - "CASCADE STEP 2: because every attested artifact is gone, SurchargeProgram.disclosure_ready is recomputed to false"
          - "CASCADE STEP 3: because disclosure_ready is false, every Terminal with program_id == this program and state == ENFORCING transitions to QUARANTINED with quarantine_reason = DISCLOSURE_EXPIRED"
          - "CASCADE STEP 4: each such terminal transition recomputes Merchant.enforcing_terminal_count for its merchant_id"
          - "increments SurchargeProgram.version by 1"

      - from: REMEDIATION
        to: ACTIVE
        trigger: "system bubble-up from POST /complaint-cases/{id}/remediation-actions with action = CLOSE"
        actor: system
        preconditions:
          - "the closing case reached remediation_state == CLOSED"
          - "no other ComplaintCase of this program has investigation_state == SUBSTANTIATED with remediation_state != CLOSED"
          - "disclosure_readiness calculation yields true again (a fresh DisclosureArtifact set has been attested)"
        side_effects:
          - "sets disable_reason = NONE"
          - "recomputes SurchargeProgram.disclosure_ready via disclosure_readiness"
          - "increments SurchargeProgram.version by 1"
        note: "Closes the ACTIVE -> REMEDIATION -> ACTIVE cycle. When disclosure_readiness is still false the program stays in REMEDIATION and only the case closes."

      - from: DRAFT | PENDING_REGISTRATION | ACTIVE | SUSPENDED | REMEDIATION
        to: DISABLED
        trigger: "system cascade from POST /jurisdictions/{id}/law-changes that sets surcharge_permitted = false"
        actor: system
        preconditions:
          - "program.jurisdiction_id == the changed Jurisdiction.id"
          - "program.program_type == SURCHARGE"
          - "program.status != WITHDRAWN and program.status != DISABLED"
        side_effects:
          - "sets disable_reason = JURISDICTION_PROHIBITION"
          - "CASCADE STEP 1: every Terminal with program_id == this program and state IN {CONFIGURED, ENFORCING} transitions to QUARANTINED with quarantine_reason = PROGRAM_DISABLED"
          - "CASCADE STEP 2: each such terminal transition recomputes Merchant.enforcing_terminal_count for its merchant_id"
          - "increments SurchargeProgram.version by 1"
        note: "Conditional cascade: CASH_DISCOUNT programs in the same jurisdiction are untouched by a surcharge prohibition."

      - from: DISABLED
        to: SUSPENDED
        trigger: "system cascade from POST /jurisdictions/{id}/law-changes that sets surcharge_permitted = true"
        actor: system
        preconditions:
          - "program.disable_reason == JURISDICTION_PROHIBITION"
          - "program.status == DISABLED"
        side_effects:
          - "sets disable_reason = OPERATOR_SUSPENSION"
          - "recomputes SurchargeProgram.effective_cap_pct via effective_surcharge_cap using the new Jurisdiction.surcharge_cap_pct"
          - "increments SurchargeProgram.version by 1"
        note: "Re-permission never re-activates automatically; an officer must RESUME, closing the DISABLED -> SUSPENDED -> ACTIVE cycle."

      - from: DRAFT | PENDING_REGISTRATION | ACTIVE | SUSPENDED | REMEDIATION | DISABLED
        to: WITHDRAWN
        trigger: "POST /surcharge-programs/{id}/status-actions with action = WITHDRAW"
        actor: ComplianceOfficer
        preconditions:
          - "program.status != WITHDRAWN"
        side_effects:
          - "every DisclosureArtifact of this program in state ATTESTED transitions to EXPIRED with expired_reason = PROGRAM_WITHDRAWN"
          - "every NetworkRegistration of this program in state {SUBMITTED, ACKNOWLEDGED, EFFECTIVE} transitions to REVOKED with revoked_at = logical clock"
          - "every Terminal with program_id == this program and state != DISABLED transitions to DISABLED"
          - "recomputes Merchant.enforcing_terminal_count for the program's merchant"
          - "increments SurchargeProgram.version by 1"

  - entity: NetworkRegistration
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVOKED]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /network-registrations/{id}/decision with decision = ACKNOWLEDGE"
        actor: NetworkAuditor
        preconditions:
          - "registration.state == SUBMITTED"
        side_effects:
          - "sets decided_by_user_id from X-User-ID and decision_note from the request"
          - "increments NetworkRegistration.version by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /network-registrations/{id}/decision with decision = REJECT"
        actor: NetworkAuditor
        preconditions:
          - "registration.state == SUBMITTED"
        side_effects:
          - "sets decided_by_user_id from X-User-ID and decision_note from the request"
          - "the owning program stays in PENDING_REGISTRATION; no program field changes"
          - "increments NetworkRegistration.version by 1"
        note: "Reject arm of the fork: divergent side-effect set from the ACKNOWLEDGE arm - the program can never reach ACTIVE through this registration."

      - from: ACKNOWLEDGED
        to: EFFECTIVE
        trigger: "POST /network-registrations/{id}/effectuate"
        actor: ComplianceOfficer
        preconditions:
          - "registration.state == ACKNOWLEDGED"
          - "logical clock >= registration.earliest_effective_at (ERR_NOTICE_PERIOD_NOT_ELAPSED)"
        side_effects:
          - "sets effective_at to the logical clock"
          - "increments NetworkRegistration.version by 1"

      - from: EFFECTIVE
        to: REVOKED
        trigger: "POST /network-registrations/{id}/decision with decision = REVOKE"
        actor: NetworkAuditor
        preconditions:
          - "registration.state == EFFECTIVE"
        side_effects:
          - "sets revoked_at to the logical clock, decided_by_user_id from X-User-ID, decision_note from the request"
          - "CROSS-ENTITY: when the owning SurchargeProgram.status == ACTIVE it transitions to SUSPENDED with disable_reason = REGISTRATION_REVOKED, quarantining that program's ENFORCING terminals and recomputing Merchant.enforcing_terminal_count"
          - "increments NetworkRegistration.version by 1"

  - entity: DisclosureArtifact
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    shape: linear
    transitions:
      - from: DRAFT
        to: ATTESTED
        trigger: "POST /disclosure-artifacts/{id}/attest"
        actor: ComplianceOfficer
        preconditions:
          - "artifact.state == DRAFT"
          - "expires_at is strictly after effective_from (ERR_INVALID_REQUEST)"
          - "no other DisclosureArtifact of the same program_id and artifact_type in state ATTESTED has a half-open [effective_from, expires_at) window intersecting the requested window (ERR_DISCLOSURE_WINDOW_OVERLAP)"
        side_effects:
          - "sets attested_at to the logical clock and attested_by_user_id from X-User-ID"
          - "recomputes SurchargeProgram.disclosure_ready via disclosure_readiness for artifact.program_id"
          - "increments SurchargeProgram.version by 1 for artifact.program_id"
          - "increments DisclosureArtifact.version by 1"

      - from: ATTESTED
        to: EXPIRED
        trigger: "system cascade from SurchargeProgram ACTIVE -> REMEDIATION, or from SurchargeProgram -> WITHDRAWN"
        actor: system
        preconditions:
          - "artifact.state == ATTESTED"
        side_effects:
          - "sets expired_reason = REMEDIATION_ORDER for the remediation cascade, PROGRAM_WITHDRAWN for the withdrawal cascade"
          - "recomputes SurchargeProgram.disclosure_ready via disclosure_readiness"
          - "increments DisclosureArtifact.version by 1"

  - entity: Terminal
    initial_state: PROVISIONED
    terminal_states: [DISABLED]
    shape: cyclic
    transitions:
      - from: PROVISIONED
        to: CONFIGURED
        trigger: "POST /terminals/{id}/configure"
        actor: MerchantOperator
        preconditions:
          - "terminal.state IN {PROVISIONED, CONFIGURED, QUARANTINED}"
          - "X-User-ID == terminal.merchant_id (ERR_MERCHANT_OWNERSHIP_REQUIRED)"
          - "the referenced SurchargeProgram.merchant_id == terminal.merchant_id (ERR_TERMINAL_PROGRAM_MISMATCH)"
          - "the referenced SurchargeProgram.status != WITHDRAWN (ERR_INVALID_PROGRAM_STATE)"
        side_effects:
          - "sets program_id, debit_exclusion_enabled, bin_table_version from the request"
          - "sets last_configured_at to the logical clock and quarantine_reason = NONE"
          - "recomputes Merchant.enforcing_terminal_count when the terminal left ENFORCING"
          - "increments Terminal.version by 1"
        note: "Re-configuring a QUARANTINED terminal is allowed and returns it to CONFIGURED, part of the CONFIGURED -> ENFORCING -> QUARANTINED -> CONFIGURED cycle."

      - from: CONFIGURED
        to: ENFORCING
        trigger: "POST /terminals/{id}/state-actions with action = ENFORCE"
        actor: MerchantOperator
        preconditions:
          - "terminal.state == CONFIGURED"
          - "X-User-ID == terminal.merchant_id (ERR_MERCHANT_OWNERSHIP_REQUIRED)"
          - "CROSS-ENTITY: the referenced SurchargeProgram.status == ACTIVE (ERR_INVALID_PROGRAM_STATE)"
          - "CROSS-ENTITY: the referenced SurchargeProgram.disclosure_ready == true (ERR_DISCLOSURE_INCOMPLETE)"
          - "when the program's program_type == SURCHARGE, terminal.debit_exclusion_enabled == true (ERR_DEBIT_EXCLUSION_NOT_ENABLED)"
        side_effects:
          - "sets quarantine_reason = NONE"
          - "recomputes Merchant.enforcing_terminal_count for terminal.merchant_id"
          - "increments Terminal.version by 1"

      - from: ENFORCING
        to: QUARANTINED
        trigger: "POST /terminals/{id}/state-actions with action = QUARANTINE, or system cascade from a SurchargeProgram leaving ACTIVE"
        actor: MerchantOperator | ComplianceOfficer | system
        preconditions:
          - "terminal.state == ENFORCING"
        side_effects:
          - "sets quarantine_reason = OPERATOR_ACTION for the explicit action, PROGRAM_SUSPENDED / PROGRAM_DISABLED / DISCLOSURE_EXPIRED for the cascades"
          - "recomputes Merchant.enforcing_terminal_count for terminal.merchant_id"
          - "increments Terminal.version by 1"

      - from: QUARANTINED
        to: ENFORCING
        trigger: "POST /terminals/{id}/state-actions with action = RESTORE"
        actor: MerchantOperator
        preconditions:
          - "terminal.state == QUARANTINED"
          - "X-User-ID == terminal.merchant_id (ERR_MERCHANT_OWNERSHIP_REQUIRED)"
          - "the referenced SurchargeProgram.status == ACTIVE and disclosure_ready == true"
          - "when program_type == SURCHARGE, terminal.debit_exclusion_enabled == true (ERR_DEBIT_EXCLUSION_NOT_ENABLED)"
        side_effects:
          - "sets quarantine_reason = NONE"
          - "recomputes Merchant.enforcing_terminal_count for terminal.merchant_id"
          - "increments Terminal.version by 1"
        note: "Restore branch A: the compensating action for a quarantine cascade, restoring enforcing_terminal_count to its pre-cascade value."

      - from: QUARANTINED
        to: CONFIGURED
        trigger: "POST /terminals/{id}/state-actions with action = RESTORE"
        actor: MerchantOperator
        preconditions:
          - "terminal.state == QUARANTINED"
          - "X-User-ID == terminal.merchant_id (ERR_MERCHANT_OWNERSHIP_REQUIRED)"
          - "the referenced SurchargeProgram.status != ACTIVE OR disclosure_ready == false"
          - "the referenced SurchargeProgram.status NOT IN {DISABLED, WITHDRAWN} (ERR_INVALID_PROGRAM_STATE)"
        side_effects:
          - "sets quarantine_reason = NONE"
          - "Merchant.enforcing_terminal_count is unchanged because the terminal does not reach ENFORCING"
          - "increments Terminal.version by 1"
        note: "Restore branch B: same trigger and same from-state as branch A, divergent target state and divergent side-effect set, selected by the program's current status."

      - from: PROVISIONED | CONFIGURED | ENFORCING | QUARANTINED
        to: DISABLED
        trigger: "system cascade from SurchargeProgram -> WITHDRAWN"
        actor: system
        preconditions:
          - "terminal.program_id == the withdrawn program's id"
        side_effects:
          - "recomputes Merchant.enforcing_terminal_count for terminal.merchant_id"
          - "increments Terminal.version by 1"

  - entity: ComplaintCase
    initial_state: "investigation_state = OPEN, remediation_state = NONE"
    terminal_states: [DISMISSED, "SUBSTANTIATED + CLOSED"]
    shape: parallel
    note: |
      Two independent state dimensions live on the same ComplaintCase row.
      investigation_state is driven only by POST /complaint-cases/{id}/investigation-actions;
      remediation_state is driven only by POST /complaint-cases/{id}/remediation-actions.
      remediation_state stays NONE forever when investigation_state ends at DISMISSED,
      and the two dimensions never read each other except through the single
      SUBSTANTIATED -> PLAN_REQUIRED coupling declared below.
    transitions:
      - dimension: investigation_state
        from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /complaint-cases/{id}/investigation-actions with action = REVIEW"
        actor: ComplianceOfficer
        preconditions:
          - "case.investigation_state == OPEN"
        side_effects:
          - "sets reviewed_by_user_id from X-User-ID"
          - "remediation_state is untouched (stays NONE)"
          - "recomputes SurchargeProgram.ag_exposure_score via compliance_exposure_score AG_METHOD (UNDER_REVIEW cases score OPEN_CASE_POINTS)"
          - "increments ComplaintCase.version by 1"

      - dimension: investigation_state
        from: OPEN | UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /complaint-cases/{id}/investigation-actions with action = SUBSTANTIATE"
        actor: NetworkAuditor | StateRegulator
        preconditions:
          - "case.investigation_state IN {OPEN, UNDER_REVIEW}"
          - "the acting role matches case.source: NetworkAuditor for {NETWORK, CARDHOLDER}, StateRegulator for ATTORNEY_GENERAL (ERR_COMPLAINT_SOURCE_ROLE_MISMATCH)"
        side_effects:
          - "sets remediation_state = PLAN_REQUIRED (the only coupling between the two dimensions)"
          - "recomputes SurchargeProgram.network_exposure_score and SurchargeProgram.ag_exposure_score via compliance_exposure_score"
          - "CASCADE STEP 1: when the recomputed network_exposure_score >= REMEDIATION_EXPOSURE_THRESHOLD and program.status == ACTIVE, the program transitions ACTIVE -> REMEDIATION with disable_reason = REMEDIATION_ORDER"
          - "CASCADE STEP 2: that program transition expires every ATTESTED DisclosureArtifact of the program with expired_reason = REMEDIATION_ORDER"
          - "CASCADE STEP 3: the resulting disclosure_ready = false quarantines every ENFORCING Terminal of the program with quarantine_reason = DISCLOSURE_EXPIRED"
          - "CASCADE STEP 4: each quarantine recomputes Merchant.enforcing_terminal_count"
          - "increments ComplaintCase.version by 1"

      - dimension: investigation_state
        from: OPEN | UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /complaint-cases/{id}/investigation-actions with action = DISMISS"
        actor: NetworkAuditor | StateRegulator
        preconditions:
          - "case.investigation_state IN {OPEN, UNDER_REVIEW}"
          - "the acting role matches case.source: NetworkAuditor for {NETWORK, CARDHOLDER}, StateRegulator for ATTORNEY_GENERAL (ERR_COMPLAINT_SOURCE_ROLE_MISMATCH)"
        side_effects:
          - "remediation_state stays NONE and no remediation action ever becomes available on this case"
          - "recomputes SurchargeProgram.network_exposure_score and SurchargeProgram.ag_exposure_score via compliance_exposure_score (a DISMISSED case contributes zero to both variants)"
          - "increments ComplaintCase.version by 1"

      - dimension: remediation_state
        from: PLAN_REQUIRED
        to: PLAN_SUBMITTED
        trigger: "POST /complaint-cases/{id}/remediation-actions with action = SUBMIT_PLAN"
        actor: ComplianceOfficer
        preconditions:
          - "case.remediation_state == PLAN_REQUIRED"
          - "plan_summary is present in the request (ERR_INVALID_REQUEST)"
        side_effects:
          - "sets plan_summary from the request"
          - "investigation_state is untouched (stays SUBSTANTIATED)"
          - "increments ComplaintCase.version by 1"

      - dimension: remediation_state
        from: PLAN_SUBMITTED
        to: PLAN_ACCEPTED
        trigger: "POST /complaint-cases/{id}/remediation-actions with action = ACCEPT_PLAN"
        actor: NetworkAuditor | StateRegulator
        preconditions:
          - "case.remediation_state == PLAN_SUBMITTED"
          - "the acting role matches case.source: NetworkAuditor for {NETWORK, CARDHOLDER}, StateRegulator for ATTORNEY_GENERAL (ERR_COMPLAINT_SOURCE_ROLE_MISMATCH)"
        side_effects:
          - "unlocks POST /complaint-cases/{id}/refunds for this case"
          - "increments ComplaintCase.version by 1"

      - dimension: remediation_state
        from: PLAN_ACCEPTED
        to: CLOSED
        trigger: "POST /complaint-cases/{id}/remediation-actions with action = CLOSE"
        actor: NetworkAuditor | StateRegulator
        preconditions:
          - "case.remediation_state == PLAN_ACCEPTED"
          - "no RemediationRefund of this case is in state PENDING (ERR_REMEDIATION_REFUNDS_PENDING)"
          - "the acting role matches case.source (ERR_COMPLAINT_SOURCE_ROLE_MISMATCH)"
        side_effects:
          - "recomputes ComplaintCase.refund_total_cents"
          - "BUBBLE-UP: when the owning program.status == REMEDIATION, no other case of that program has investigation_state == SUBSTANTIATED with remediation_state != CLOSED, and disclosure_readiness now yields true, the program transitions REMEDIATION -> ACTIVE with disable_reason = NONE"
          - "increments ComplaintCase.version by 1"

  - entity: RemediationRefund
    initial_state: PENDING
    terminal_states: [VOIDED]
    shape: linear_with_compensation
    transitions:
      - from: PENDING
        to: ISSUED
        trigger: "POST /remediation-refunds/{id}/issue"
        actor: ComplianceOfficer
        preconditions:
          - "refund.state == PENDING"
          - "X-User-ID != refund.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "the owning case.remediation_state == PLAN_ACCEPTED (ERR_INVALID_COMPLAINT_STATE)"
        side_effects:
          - "sets issued_at to the logical clock and issued_by_user_id from X-User-ID"
          - "decreases Merchant.net_surcharge_collected_cents by refund_amount_cents (gross_surcharge_collected_cents is unchanged)"
          - "increases Transaction.refunded_surcharge_cents by refund_amount_cents"
          - "recomputes ComplaintCase.refund_total_cents"
          - "increments RemediationRefund.version by 1"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /remediation-refunds/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "refund.state == ISSUED"
          - "the owning case.remediation_state != CLOSED (ERR_INVALID_COMPLAINT_STATE)"
        side_effects:
          - "sets voided_at to the logical clock"
          - "COMPENSATION: increases Merchant.net_surcharge_collected_cents by refund_amount_cents, restoring it to its pre-issue value"
          - "COMPENSATION: decreases Transaction.refunded_surcharge_cents by refund_amount_cents"
          - "recomputes ComplaintCase.refund_total_cents"
          - "increments RemediationRefund.version by 1"

      - from: PENDING
        to: VOIDED
        trigger: "POST /remediation-refunds/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "refund.state == PENDING"
        side_effects:
          - "sets voided_at to the logical clock"
          - "no ledger field changes because the refund was never issued"
          - "increments RemediationRefund.version by 1"

  - entity: CostDocumentation
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    shape: linear
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system cascade from POST /merchants/{id}/cost-documentations creating a newer document for the same merchant"
        actor: system
        preconditions:
          - "document.state == ACTIVE"
          - "document.merchant_id == the new document's merchant_id"
        side_effects:
          - "sets superseded_at to the logical clock"
          - "sets Merchant.active_cost_documentation_id to the new document's id"
          - "increments CostDocumentation.version by 1"
        note: "Any SurchargeProgram still pinned to this document now fails ERR_COST_DOCUMENTATION_STALE on rate-rule creation and activation until it is re-pinned via PATCH /surcharge-programs/{id}."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: rate-rule-create-stale-program
    parent_entity: SurchargeProgram
    write_endpoint: "POST /surcharge-programs/{id}/rate-rules"
    occ_field: "expected_program_version"
    description: |
      Filing a BrandRateRule against a SurchargeProgram whose version has
      advanced since the client last read it is rejected. Every rate rule is
      validated against the program's pinned effective_cap_pct and
      consistency_scope, both of which change when another writer files a
      rule, re-pins the cost documentation, or the program changes status; a
      request carrying a stale expected_program_version was therefore
      validated by the client against a cap that no longer holds.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

  - rule_id: cost-doc-create-stale-merchant
    parent_entity: Merchant
    write_endpoint: "POST /merchants/{id}/cost-documentations"
    occ_field: "expected_merchant_version"
    description: |
      Filing a CostDocumentation against a Merchant whose version has advanced
      since the client last read it is rejected. A new document legitimately
      supersedes the merchant's ACTIVE document, so the write would otherwise
      succeed on its own merits; the stale-version check captures the case where
      the merchant's ledger or active document has already moved on and the
      filer's superseding decision was made against an obsolete view.
    error_id: ERR_STALE_MERCHANT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: average_ticket_snapshot
    trigger: "POST /merchants/{id}/cost-documentations, evaluated as STEP 1 of the cost/cap chain before documented_cost_pct"
    algorithm: aggregation
    formula: |
      rows = Transaction rows T where Terminal[T.terminal_id].merchant_id == merchant.id
             AND T.outcome IN {APPROVED_WITH_SURCHARGE, APPROVED_NO_SURCHARGE, APPROVED_CASH_DISCOUNT}
             AND T.occurred_at <= logical_clock
      if len(rows) == 0:
          average_ticket_cents = DEFAULT_AVERAGE_TICKET_CENTS
      else:
          average_ticket_cents = round_half_up(sum(T.base_amount_cents for T in rows) / len(rows), 0)
      # frozen onto the CostDocumentation row at creation; never recomputed afterwards
    input_set: |
      Every Transaction of the merchant regardless of outcome arm, counted once, using
      base_amount_cents ONLY. surcharge_amount_cents and cash_discount_amount_cents are
      deliberately excluded so the ticket average cannot feed back into the surcharge it
      helps to cap. No status filter beyond the three APPROVED_* outcomes (they are the
      only outcomes a Transaction row can carry) and no time window other than
      occurred_at <= logical_clock (inclusive upper bound, no lower bound).
    constants:
      DEFAULT_AVERAGE_TICKET_CENTS: 5000
    precision: "integer cents, round_half_up on the mean"
    order_note: "No ordering dependency - the mean is order-insensitive; the empty-set arm is the fallback, never an error."

  - name: cost_documentation_evaluation
    trigger: "POST /merchants/{id}/cost-documentations, evaluated as STEP 2 of the cost/cap chain, immediately after average_ticket_snapshot"
    algorithm: constraint_propagation
    formula: |
      # STEP 2 of a chain that LOOKS circular: the merchant discount cost depends on the
      # average ticket, the average ticket depends on transactions, and transactions are
      # priced by the very rate this cost caps. The circle is cut by pinning the order and
      # by freezing both derived numbers on the CostDocumentation row:
      #   STEP 1  average_ticket_cents  <- average_ticket_snapshot (base_amount_cents only)
      #   STEP 2  per_item_component_pct = round_half_up(per_item_fee_cents / average_ticket_cents * 100, 4)
      #           documented_cost_pct    = round_half_up(base_mdr_pct + assessment_pct + per_item_component_pct, 4)
      #   STEP 3  SurchargeProgram.effective_cap_pct <- effective_surcharge_cap (uses the FROZEN documented_cost_pct)
      #   STEP 4  BrandRateRule.rate_pct is validated against the frozen effective_cap_pct
      # A later transaction never retroactively changes documented_cost_pct; only a NEW
      # CostDocumentation (which supersedes this one) picks up the newer average ticket.
      documented_cost_pct = round_half_up(base_mdr_pct + assessment_pct
                            + round_half_up(per_item_fee_cents / average_ticket_cents * 100, 4), 4)
    input_set: "The three input cost components on this CostDocumentation plus its own frozen average_ticket_cents. No other document, program, or transaction participates."
    constants: {}
    precision: "4 decimal places, round_half_up, applied to the per-item component FIRST and then to the sum (order pinned)"

  - name: effective_surcharge_cap
    trigger: "STEP 3 of the cost/cap chain; runs on SurchargeProgram create, on PATCH /surcharge-programs/{id}, on POST /surcharge-programs/{id}/activate, on POST /surcharge-programs/{id}/status-actions RESUME, and on the DISABLED -> SUSPENDED law-change cascade"
    algorithm: threshold
    formula: |
      doc = CostDocumentation[program.cost_documentation_id]        # frozen documented_cost_pct
      jur = Jurisdiction[program.jurisdiction_id]
      if program.program_type == CASH_DISCOUNT:
          effective_cap_pct = CASH_DISCOUNT_MAX_PCT
      else:
          # three-way nested minimum: acquirer cost, statutory cap, network ceiling
          effective_cap_pct = min(doc.documented_cost_pct,
                                  jur.surcharge_cap_pct,
                                  NETWORK_MAX_SURCHARGE_PCT)
      # A BrandRateRule is admissible when rate_pct <= effective_cap_pct (equality PASSES).
    input_set: "Exactly one CostDocumentation (the pinned one, in any state - staleness is a separate validation) and exactly one Jurisdiction (the program's)."
    constants:
      NETWORK_MAX_SURCHARGE_PCT: 3.0
      CASH_DISCOUNT_MAX_PCT: 10.0
    precision: "4 decimal places; the minimum is taken over already-rounded 4-decimal inputs so no further rounding occurs"
    order_note: "Whichever of the three inputs is smallest binds; the test suite pins one case where documented_cost_pct binds (2.19) and one where NETWORK_MAX_SURCHARGE_PCT binds (3.0 against a documented 3.05)."

  - name: rate_rule_selection
    trigger: "POST /transactions, before transaction_price_resolution"
    algorithm: topological
    formula: |
      # CREDIT-ONLY GUARD: a SURCHARGE program never prices a DEBIT or PREPAID sale, so
      # no rule is selected and ERR_NO_RATE_RULE_IN_EFFECT is NOT raised for those rows.
      if program.program_type == SURCHARGE and body.card_funding != CREDIT:
          applied_rate_pct = 0
          return
      candidates = BrandRateRule rows R where R.program_id == body.program_id
                   AND R.brand == body.card_brand
                   AND R.effective_from <= logical_clock <= R.effective_to     # CLOSED interval, both ends inclusive
                   AND (R.product_tier == body.product_tier OR R.product_tier == ALL)
      if candidates is empty: reject with ERR_NO_RATE_RULE_IN_EFFECT
      rank: product_tier == body.product_tier ranks strictly above product_tier == ALL
      tie_break: among candidates of equal rank, the row with the LATEST effective_from wins;
                 if effective_from also ties, the row with the EARLIEST created_at wins
      selected = first row after ranking and tie-break
      applied_rate_pct = selected.rate_pct
    input_set: "BrandRateRule rows of the transaction's program and card brand whose closed effectivity interval contains the logical clock. Rows of other programs, other brands, or non-containing intervals are excluded."
    constants: {}
    precision: "rate_pct carried through at 4 decimal places, no rounding at selection time"
    order_note: "created_at is the only common-field fallback used; `id` is never consulted."

  - name: transaction_price_resolution
    trigger: "POST /transactions"
    algorithm: tiered_pricing
    formula: |
      rate = applied_rate_pct from rate_rule_selection
      if program.program_type == SURCHARGE and card_funding == CREDIT:
          surcharge_amount_cents      = round_half_up(base_amount_cents * rate / 100, 0)
          cash_discount_amount_cents  = 0
          cash_price_cents            = base_amount_cents
          total_amount_cents          = base_amount_cents + surcharge_amount_cents
          outcome                     = APPROVED_WITH_SURCHARGE
      elif program.program_type == SURCHARGE:                  # DEBIT or PREPAID
          surcharge_amount_cents      = 0                       # credit-only surcharging
          cash_discount_amount_cents  = 0
          cash_price_cents            = base_amount_cents
          total_amount_cents          = base_amount_cents
          outcome                     = APPROVED_NO_SURCHARGE
      else:                                                     # CASH_DISCOUNT program
          surcharge_amount_cents      = 0
          cash_discount_amount_cents  = round_half_up(base_amount_cents * rate / 100, 0)
          cash_price_cents            = base_amount_cents - cash_discount_amount_cents
          total_amount_cents          = base_amount_cents       # the card price IS the posted price
          outcome                     = APPROVED_CASH_DISCOUNT
    input_set: "One Transaction request body, the one BrandRateRule chosen by rate_rule_selection, and the program's program_type. No other transaction participates."
    constants: {}
    precision: "integer cents, round_half_up, applied ONCE per transaction line"
    variants:
      - name: surcharge_add_on
        when: "program.program_type == SURCHARGE"
        difference: "The percentage is ADDED to the posted price: total_amount_cents = base + round_half_up(base*rate/100) and surcharge_amount_cents is non-zero, so the cardholder pays more than the posted price and Merchant.gross_surcharge_collected_cents grows."
      - name: cash_discount_deduct
        when: "program.program_type == CASH_DISCOUNT"
        difference: "The percentage is DEDUCTED from the posted price for cash payers: total_amount_cents == base (the card price), surcharge_amount_cents == 0, cash_price_cents == base - round_half_up(base*rate/100), and Merchant.gross_surcharge_collected_cents does not move. Identical base_amount_cents and identical rate_pct therefore produce a different total_amount_cents (10219 vs 10000 for base 10000 at 2.19%)."

  - name: program_settlement_reconciliation
    trigger: "GET /surcharge-programs/{id}/settlement-summary"
    algorithm: aggregation
    formula: |
      rows = Transaction rows T where T.program_id == program.id
             AND (from_iso8601 is absent OR T.occurred_at >= from_iso8601)      # inclusive lower bound
             AND (to_iso8601   is absent OR T.occurred_at <  to_iso8601)        # EXCLUSIVE upper bound
      # ROUNDING ORDER IS PINNED: round per transaction line FIRST, then sum.
      per_line_rounded_surcharge_cents = sum(T.surcharge_amount_cents for T in rows)
      # The pooled reference is published only so the divergence is observable; it is
      # NEVER the settled figure.
      pooled_rounding_reference_cents  = round_half_up(
          sum(T.base_amount_cents for T in rows where T.outcome == APPROVED_WITH_SURCHARGE)
          * program_weighted_rate_pct / 100, 0)
      where program_weighted_rate_pct = the applied_rate_pct shared by those rows
            (rows carrying different applied_rate_pct values are grouped by rate,
             each group pooled separately, and the group results summed)
      rounding_divergence_cents = per_line_rounded_surcharge_cents - pooled_rounding_reference_cents
      base_amount_total_cents   = sum(T.base_amount_cents for T in rows)
      refunded_surcharge_cents  = sum(R.refund_amount_cents for RemediationRefund R
                                      where R.state == ISSUED and R.transaction_id IN rows)
      net_surcharge_cents       = per_line_rounded_surcharge_cents - refunded_surcharge_cents
      transaction_count         = len(rows)
    input_set: |
      Transaction rows of this program only, filtered by the half-open window
      [from_iso8601, to_iso8601). All three outcome arms are counted in
      transaction_count and base_amount_total_cents; only APPROVED_WITH_SURCHARGE rows
      carry a non-zero surcharge and only they enter the pooled reference.
      RemediationRefund rows are included only in state ISSUED (PENDING and VOIDED are excluded).
    constants: {}
    precision: "integer cents, round_half_up; the per-line rounding already happened at POST /transactions time and is NOT redone"
    order_note: |
      Pinned order: per-line-then-sum. For bases 1234, 5678, 9012 at 2.19% the per-line
      figures are 27, 124, 197 -> 348, whereas pooling first gives
      round_half_up(15924 * 2.19 / 100) = 349. The settled figure is 348 and
      rounding_divergence_cents is -1.

  - name: compliance_exposure_score
    trigger: "recomputed on every ComplaintCase investigation-action; exposed by GET /surcharge-programs/{id}/exposure-summary"
    algorithm: weighted_scoring
    formula: |
      cases = ComplaintCase rows C where C.program_id == program.id
      # ---- NETWORK_METHOD (persisted as SurchargeProgram.network_exposure_score) ----
      network_exposure_score = min(SCORE_CEILING, round_half_up(
          sum(SUBSTANTIATED_BASE_POINTS * SOURCE_MULTIPLIER[C.source]
              for C in cases if C.investigation_state == SUBSTANTIATED), 2))
      # ---- AG_METHOD (persisted as SurchargeProgram.ag_exposure_score) ----
      ag_exposure_score = min(SCORE_CEILING, round_half_up(
          POSTURE_MULTIPLIER[Jurisdiction[program.jurisdiction_id].ag_enforcement_posture]
          * sum(SUBSTANTIATED_BASE_POINTS if C.investigation_state == SUBSTANTIATED
                else OPEN_CASE_POINTS
                for C in cases if C.investigation_state IN {OPEN, UNDER_REVIEW, SUBSTANTIATED}), 2))
    input_set: |
      NETWORK_METHOD counts ONLY cases with investigation_state == SUBSTANTIATED and weights
      each by its filing source. AG_METHOD counts SUBSTANTIATED, OPEN and UNDER_REVIEW cases
      (source is ignored) and scales the whole sum by the jurisdiction's enforcement posture.
      DISMISSED cases contribute zero to both variants. Cases of other programs are excluded.
    constants:
      SUBSTANTIATED_BASE_POINTS: 20
      OPEN_CASE_POINTS: 8
      SCORE_CEILING: 100
      REMEDIATION_EXPOSURE_THRESHOLD: 30
      SOURCE_MULTIPLIER: { NETWORK: 1.5, ATTORNEY_GENERAL: 2.0, CARDHOLDER: 1.0 }
      POSTURE_MULTIPLIER: { PERMISSIVE: 0.5, MONITORED: 1.0, RESTRICTIVE: 2.0 }
    precision: "2 decimal places, round_half_up, ceiling applied AFTER rounding"
    variants:
      - name: network_method
        when: "gating the ACTIVE -> REMEDIATION cascade and reported as network_exposure_score"
        difference: "Substantiated-only, source-weighted, posture-blind. One SUBSTANTIATED NETWORK case scores 20 * 1.5 = 30.00 and therefore trips REMEDIATION_EXPOSURE_THRESHOLD; one SUBSTANTIATED CARDHOLDER case scores 20 * 1.0 = 20.00 and does not."
      - name: ag_method
        when: "reported as ag_exposure_score and used in attorney-general correspondence"
        difference: "Counts unresolved cases too (OPEN and UNDER_REVIEW at OPEN_CASE_POINTS), ignores the filing source, and multiplies by the jurisdiction posture. The same data set of one SUBSTANTIATED NETWORK case plus one OPEN ATTORNEY_GENERAL case in a MONITORED state scores 30.00 under NETWORK_METHOD but 1.0 * (20 + 8) = 28.00 under AG_METHOD."

  - name: disclosure_readiness
    trigger: "recomputed on POST /disclosure-artifacts/{id}/attest, on every DisclosureArtifact expiry cascade, on POST /surcharge-programs/{id}/activate, and on POST /surcharge-programs/{id}/status-actions RESUME"
    algorithm: aggregation
    formula: |
      jur = Jurisdiction[program.jurisdiction_id]
      required = empty set
      if program.program_type == SURCHARGE:
          if jur.disclosure_signage_required: required += {ENTRY_SIGNAGE, POS_SIGNAGE}
          if jur.receipt_line_item_required:  required += {RECEIPT_TEMPLATE}
      else:                                   # CASH_DISCOUNT
          if jur.disclosure_signage_required: required += {POS_SIGNAGE}
      # PRICE_LIST_POSTING is deliberately NOT part of `required`: the posted dual-price
      # list is enforced by its own validation row (priority 100,
      # ERR_PRICE_POSTING_REQUIRED) so that a program which has attested its signage but
      # not its price list fails with the price-posting error rather than being masked by
      # ERR_DISCLOSURE_INCOMPLETE at priority 99. Both errors stay independently reachable.
      satisfied = { A.artifact_type for DisclosureArtifact A
                    where A.program_id == program.id
                    AND A.state == ATTESTED
                    AND A.effective_from <= logical_clock < A.expires_at }   # half-open window
      disclosure_ready = required is a subset of satisfied
      # An empty `required` set yields disclosure_ready = true (vacuous truth) - the case of a
      # jurisdiction with every disclosure flag false.
    input_set: "DisclosureArtifact rows of this program only, in state ATTESTED only, whose half-open [effective_from, expires_at) window contains the logical clock. DRAFT and EXPIRED artifacts never satisfy a requirement."
    constants: {}
    precision: "boolean"
    order_note: "Set containment, order-insensitive. The zero-attested-artifact case is the empty-collection boundary: required is non-empty and satisfied is empty, so disclosure_ready is false and activation fails with ERR_DISCLOSURE_INCOMPLETE."

  - name: response_window_assignment
    trigger: "POST /complaint-cases"
    algorithm: interval_merge
    formula: |
      response_due_at = received_at + RESPONSE_WINDOW_DAYS[source] days
    input_set: "The single case being filed; source determines the window length."
    constants:
      RESPONSE_WINDOW_DAYS: { NETWORK: 10, ATTORNEY_GENERAL: 20, CARDHOLDER: 30 }
    precision: "ISO 8601 UTC with three fractional digits; day arithmetic is exact 24-hour multiples"

  - name: merchant_surcharge_ledger
    trigger: "POST /transactions (increase), POST /remediation-refunds/{id}/issue (decrease), POST /remediation-refunds/{id}/void on an ISSUED refund (restore)"
    algorithm: aggregation
    formula: |
      gross_surcharge_collected_cents = sum(T.surcharge_amount_cents
          for Transaction T where Terminal[T.terminal_id].merchant_id == merchant.id
          AND T.outcome == APPROVED_WITH_SURCHARGE)
      issued_refunds_cents = sum(R.refund_amount_cents for RemediationRefund R
          where R.state == ISSUED
          AND Terminal[Transaction[R.transaction_id].terminal_id].merchant_id == merchant.id)
      net_surcharge_collected_cents = gross_surcharge_collected_cents - issued_refunds_cents
      # CONSERVED QUANTITY (money):
      #   net_surcharge_collected_cents + issued_refunds_cents == gross_surcharge_collected_cents
      # must hold after every single mutation, and gross must never decrease.
    input_set: "APPROVED_WITH_SURCHARGE transactions of the merchant's terminals (all time, no window) and RemediationRefund rows in state ISSUED only; PENDING and VOIDED refunds are excluded."
    constants: {}
    precision: "integer cents, no rounding (all inputs are already integers)"

  - name: enforcing_terminal_census
    trigger: "every Terminal transition into or out of ENFORCING, including the quarantine cascades and POST /terminals/{id}/configure"
    algorithm: aggregation
    formula: |
      enforcing_terminal_count = count(Terminal T where T.merchant_id == merchant.id
                                       AND T.state == ENFORCING)
      # CONSERVED QUANTITY (terminal census): a quarantine cascade followed by the
      # matching RESTORE actions must return enforcing_terminal_count to its
      # pre-cascade value; DISABLED terminals leave the census permanently smaller.
    input_set: "Terminal rows of this merchant only, state == ENFORCING only. CONFIGURED, PROVISIONED, QUARANTINED and DISABLED terminals are excluded."
    constants: {}
    precision: "non-negative integer"

  - name: rate_window_separation
    trigger: "POST /surcharge-programs/{id}/rate-rules, before the cap check at priority 110"
    algorithm: interval_merge
    formula: |
      peers = BrandRateRule rows R where R.program_id == body.program_id
              AND R.brand == body.brand
              AND R.product_tier == body.product_tier
      # CLOSED intervals on both the candidate and every peer: [effective_from, effective_to].
      for each P in peers:
          if body.effective_from > P.effective_to:
              gap_days = (body.effective_from - P.effective_to) / 86400
          elif P.effective_from > body.effective_to:
              gap_days = (P.effective_from - body.effective_to) / 86400
          else:
              gap_days = 0            # the two closed intervals intersect
          if gap_days < RATE_CHANGE_BUFFER_DAYS: reject ERR_RATE_WINDOW_BUFFER_VIOLATION
      # ADJACENCY IS REJECTED here (gap_days == 0 fails), which is the opposite of the
      # half-open DisclosureArtifact window where exact adjacency is ACCEPTED.
    input_set: "BrandRateRule rows of the same (program_id, brand, product_tier) triple only; rules of another brand or another product tier never constrain the candidate."
    constants: { RATE_CHANGE_BUFFER_DAYS: 30 }
    precision: "gap_days computed as an exact multiple of 86400 seconds; the comparison is a strict less-than against RATE_CHANGE_BUFFER_DAYS"

  - name: registration_notice_window
    trigger: "POST /surcharge-programs/{id}/network-registrations (stamps the window) and POST /network-registrations/{id}/effectuate (enforces it)"
    algorithm: threshold
    formula: |
      # stamped at submission and frozen on the row:
      notice_days           = NOTICE_PERIOD_DAYS
      earliest_effective_at = submitted_at + NOTICE_PERIOD_DAYS days
      # enforced at effectuation, INCLUSIVE lower bound (equality PASSES):
      if logical_clock < earliest_effective_at: reject ERR_NOTICE_PERIOD_NOT_ELAPSED
      # With the default clock 2026-08-01T00:00:00Z, earliest_effective_at is
      # 2026-08-31T00:00:00Z: effectuating at 2026-08-30T23:59:59Z fails and
      # effectuating at exactly 2026-08-31T00:00:00Z succeeds.
    input_set: "the single NetworkRegistration row named in the path; sibling registrations of the same program impose no notice constraint on each other."
    constants: { NOTICE_PERIOD_DAYS: 30 }
    precision: "ISO 8601 UTC with three fractional digits; day arithmetic is exact 24-hour multiples"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority - lowest number wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "X-User-Role appears in the endpoint's roles list in 1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 30
    category: auth
    check: "On multi-action endpoints the acting role is permitted for the requested action: status-actions SUSPEND allows ComplianceOfficer and NetworkAuditor while RESUME and WITHDRAW allow ComplianceOfficer only; terminal state-actions ENFORCE and RESTORE allow MerchantOperator only while QUARANTINE allows MerchantOperator and ComplianceOfficer; investigation-actions REVIEW allows ComplianceOfficer only while SUBSTANTIATE and DISMISS allow NetworkAuditor and StateRegulator only; remediation-actions SUBMIT_PLAN allows ComplianceOfficer only while ACCEPT_PLAN and CLOSE allow NetworkAuditor and StateRegulator only"
    error_id: ERR_ACTION_ROLE_FORBIDDEN
    http_status: 403
    applies_to: "POST /surcharge-programs/{id}/status-actions, POST /terminals/{id}/state-actions, POST /complaint-cases/{id}/investigation-actions, POST /complaint-cases/{id}/remediation-actions"

  - priority: 40
    category: existence
    check: "Every id in the path exists, validated left to right"
    error_id: "ERR_JURISDICTION_NOT_FOUND | ERR_MERCHANT_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_ARTIFACT_NOT_FOUND | ERR_TERMINAL_NOT_FOUND | ERR_TRANSACTION_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_REFUND_NOT_FOUND | ERR_COST_DOCUMENTATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 50
    category: auth
    check: "MerchantOperator X-User-ID equals the merchant_id of the target resource (the merchant in the path, or Terminal.merchant_id, or SurchargeProgram.merchant_id for a disclosure-artifact draft)"
    error_id: ERR_MERCHANT_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "POST /merchants/{id}/terminals, POST /terminals/{id}/configure, POST /terminals/{id}/state-actions, POST /surcharge-programs/{id}/disclosure-artifacts"

  - priority: 52
    category: auth
    check: "TerminalAgent X-User-ID equals the body terminal_id"
    error_id: ERR_TERMINAL_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /transactions"

  - priority: 55
    category: auth
    check: "The acting role owns the complaint's source channel: NetworkAuditor may file and decide {NETWORK, CARDHOLDER} cases, StateRegulator may file and decide ATTORNEY_GENERAL cases"
    error_id: ERR_COMPLAINT_SOURCE_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /complaint-cases, POST /complaint-cases/{id}/investigation-actions, POST /complaint-cases/{id}/remediation-actions"

  - priority: 60
    category: business_constraint
    check: "Request body shape: required fields present, enum members valid, numbers inside their declared ranges, ISO 8601 instants parseable, base_amount_cents >= 1, refund_amount_cents >= 1, requested_surcharge_cents >= 0, DisclosureArtifact expires_at strictly after effective_from, BrandRateRule effective_to strictly after effective_from, and product_tier == NOT_APPLICABLE exactly when card_funding != CREDIT"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 62
    category: business_fiscal
    check: "A Jurisdiction with surcharge_permitted true carries a non-null surcharge_cap_pct, and a Jurisdiction with surcharge_permitted false carries surcharge_cap_pct null"
    error_id: ERR_JURISDICTION_CAP_REQUIRED
    http_status: 422
    applies_to: "POST /jurisdictions, POST /jurisdictions/{id}/law-changes"

  - priority: 65
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_JURISDICTION_NOT_FOUND | ERR_MERCHANT_NOT_FOUND | ERR_COST_DOCUMENTATION_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_TERMINAL_NOT_FOUND | ERR_TRANSACTION_NOT_FOUND"
    http_status: 404
    applies_to: "POST /merchants, POST /surcharge-programs, PATCH /surcharge-programs/{id}, POST /terminals/{id}/configure, POST /transactions, POST /complaint-cases, POST /complaint-cases/{id}/refunds"

  - priority: 68
    category: business_constraint
    check: "Uniqueness: Jurisdiction.state_code is unique; Terminal.serial_number is unique per merchant_id; at most one NetworkRegistration per (program_id, network) in state {SUBMITTED, ACKNOWLEDGED, EFFECTIVE}"
    error_id: "ERR_DUPLICATE_JURISDICTION_STATE | ERR_DUPLICATE_TERMINAL_SERIAL | ERR_DUPLICATE_NETWORK_REGISTRATION"
    http_status: 409
    applies_to: "POST /jurisdictions, POST /merchants/{id}/terminals, POST /surcharge-programs/{id}/network-registrations"

  - priority: 70
    category: state
    check: "expected_program_version equals SurchargeProgram.version (OCC), or expected_merchant_version equals Merchant.version"
    error_id: "ERR_STALE_PROGRAM_VERSION | ERR_STALE_MERCHANT_VERSION"
    http_status: 412
    applies_to: "POST /surcharge-programs/{id}/rate-rules, PATCH /surcharge-programs/{id}, POST /merchants/{id}/cost-documentations"

  - priority: 75
    category: state
    check: "The target resource is in a state from which the requested transition is declared in 1.2"
    error_id: "ERR_INVALID_PROGRAM_STATE | ERR_INVALID_REGISTRATION_STATE | ERR_INVALID_ARTIFACT_STATE | ERR_INVALID_TERMINAL_STATE | ERR_INVALID_COMPLAINT_STATE | ERR_INVALID_REFUND_STATE"
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 76
    category: state
    check: "The capturing Terminal is in state ENFORCING; a PROVISIONED, CONFIGURED, QUARANTINED or DISABLED terminal may not book a sale"
    error_id: ERR_INVALID_TERMINAL_STATE
    http_status: 409
    applies_to: "POST /transactions"

  - priority: 78
    category: auth
    check: "Segregation of duties: the ComplianceOfficer activating a program is not any DisclosureArtifact.attested_by_user_id of that program, and the ComplianceOfficer issuing a refund is not that refund's created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /surcharge-programs/{id}/activate, POST /remediation-refunds/{id}/issue"

  - priority: 80
    category: business_safety
    check: "Jurisdiction.surcharge_permitted is true for a SURCHARGE program being created, re-pinned, activated, resumed, or transacted against"
    error_id: ERR_SURCHARGE_PROHIBITED_JURISDICTION
    http_status: 422
    applies_to: "POST /surcharge-programs, POST /surcharge-programs/{id}/activate, POST /surcharge-programs/{id}/status-actions, POST /transactions"

  - priority: 81
    category: business_safety
    check: "Jurisdiction.cash_discount_permitted is true for a CASH_DISCOUNT program being created, activated, or resumed"
    error_id: ERR_CASH_DISCOUNT_PROHIBITED_JURISDICTION
    http_status: 422
    applies_to: "POST /surcharge-programs, POST /surcharge-programs/{id}/activate, POST /surcharge-programs/{id}/status-actions"

  - priority: 82
    category: business_safety
    check: "Credit-only surcharging: requested_surcharge_cents is 0 whenever card_funding is DEBIT or PREPAID"
    error_id: ERR_DEBIT_SURCHARGE_FORBIDDEN
    http_status: 422
    applies_to: "POST /transactions"

  - priority: 83
    category: business_safety
    check: "A terminal enforcing a SURCHARGE program has debit_exclusion_enabled true"
    error_id: ERR_DEBIT_EXCLUSION_NOT_ENABLED
    http_status: 422
    applies_to: "POST /terminals/{id}/state-actions"

  - priority: 84
    category: business_safety
    check: "The program a transaction is booked against is not in status DISABLED (jurisdictional prohibition) or WITHDRAWN"
    error_id: ERR_PROGRAM_DISABLED_BY_PROHIBITION
    http_status: 422
    applies_to: "POST /transactions"

  - priority: 86
    category: business_referential
    check: "Terminal.program_id equals the body program_id"
    error_id: ERR_TERMINAL_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /transactions, POST /terminals/{id}/configure"

  - priority: 87
    category: business_referential
    check: "SurchargeProgram.jurisdiction_id equals Merchant.jurisdiction_id"
    error_id: ERR_JURISDICTION_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /surcharge-programs"

  - priority: 88
    category: business_referential
    check: "The pinned CostDocumentation.merchant_id equals the program's merchant_id"
    error_id: ERR_COST_DOCUMENTATION_MERCHANT_MISMATCH
    http_status: 422
    applies_to: "POST /surcharge-programs, PATCH /surcharge-programs/{id}"

  - priority: 89
    category: business_referential
    check: "The RemediationRefund's transaction belongs to the merchant of the complaint case's program"
    error_id: ERR_REFUND_TRANSACTION_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /complaint-cases/{id}/refunds"

  - priority: 90
    category: business_constraint
    check: "The program's pinned CostDocumentation is in state ACTIVE"
    error_id: ERR_COST_DOCUMENTATION_STALE
    http_status: 409
    applies_to: "POST /surcharge-programs/{id}/rate-rules, POST /surcharge-programs/{id}/activate"

  - priority: 92
    category: business_temporal
    check: "A new BrandRateRule's closed [effective_from, effective_to] interval is separated from every existing rule of the same (program_id, brand, product_tier) by at least RATE_CHANGE_BUFFER_DAYS days on both sides; touching or adjacent intervals are rejected"
    error_id: ERR_RATE_WINDOW_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /surcharge-programs/{id}/rate-rules"

  - priority: 93
    category: business_temporal
    check: "A newly attested DisclosureArtifact's half-open [effective_from, expires_at) window does not intersect any ATTESTED artifact of the same (program_id, artifact_type); exact adjacency (new.effective_from == existing.expires_at) is accepted"
    error_id: ERR_DISCLOSURE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /disclosure-artifacts/{id}/attest"

  - priority: 94
    category: business_temporal
    check: "The logical clock is at or after NetworkRegistration.earliest_effective_at"
    error_id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /network-registrations/{id}/effectuate"

  - priority: 96
    category: business_constraint
    check: "product_tier == ALL exactly when the program's consistency_scope is BRAND_LEVEL, and product_tier != ALL exactly when it is PRODUCT_LEVEL"
    error_id: ERR_PRODUCT_TIER_SCOPE_VIOLATION
    http_status: 422
    applies_to: "POST /surcharge-programs/{id}/rate-rules"

  - priority: 97
    category: business_constraint
    check: "Every network holding an EFFECTIVE NetworkRegistration has a BrandRateRule for that brand whose closed interval contains the logical clock"
    error_id: ERR_BRAND_CONSISTENCY_VIOLATION
    http_status: 422
    applies_to: "POST /surcharge-programs/{id}/activate"

  - priority: 98
    category: business_constraint
    check: "At least one NetworkRegistration of a SURCHARGE program is in state EFFECTIVE, and no registration is in state REVOKED when resuming"
    error_id: ERR_REGISTRATION_NOT_EFFECTIVE
    http_status: 409
    applies_to: "POST /surcharge-programs/{id}/activate, POST /surcharge-programs/{id}/status-actions"

  - priority: 99
    category: business_constraint
    check: "disclosure_readiness yields true for the program's required artifact set"
    error_id: ERR_DISCLOSURE_INCOMPLETE
    http_status: 422
    applies_to: "POST /surcharge-programs/{id}/activate, POST /surcharge-programs/{id}/status-actions, POST /terminals/{id}/state-actions"

  - priority: 100
    category: business_constraint
    check: "A CASH_DISCOUNT program in a jurisdiction with price_posting_required true has an ATTESTED PRICE_LIST_POSTING artifact whose window contains the clock"
    error_id: ERR_PRICE_POSTING_REQUIRED
    http_status: 422
    applies_to: "POST /surcharge-programs/{id}/activate"

  - priority: 101
    category: business_constraint
    check: "rate_rule_selection finds at least one candidate BrandRateRule for every capture that needs a rate, namely a SURCHARGE program with card_funding == CREDIT or any CASH_DISCOUNT capture; DEBIT and PREPAID captures on a SURCHARGE program are exempt by the credit-only guard"
    error_id: ERR_NO_RATE_RULE_IN_EFFECT
    http_status: 422
    applies_to: "POST /transactions, POST /surcharge-programs/{id}/activate"

  - priority: 102
    category: business_constraint
    check: "receipt_line_present is true whenever the computed surcharge_amount_cents is greater than 0 and the jurisdiction has receipt_line_item_required true"
    error_id: ERR_RECEIPT_LINE_ITEM_REQUIRED
    http_status: 422
    applies_to: "POST /transactions"

  - priority: 110
    category: business_fiscal
    check: "BrandRateRule.rate_pct <= SurchargeProgram.effective_cap_pct (equality passes)"
    error_id: ERR_SURCHARGE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /surcharge-programs/{id}/rate-rules"

  - priority: 112
    category: business_fiscal
    check: "requested_surcharge_cents equals the server-computed surcharge_amount_cents"
    error_id: ERR_SURCHARGE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /transactions"

  - priority: 114
    category: business_fiscal
    check: "refund_amount_cents <= Transaction.surcharge_amount_cents - Transaction.refunded_surcharge_cents"
    error_id: ERR_REFUND_AMOUNT_EXCEEDS_SURCHARGE
    http_status: 422
    applies_to: "POST /complaint-cases/{id}/refunds"

  - priority: 116
    category: business_constraint
    check: "At most one non-VOIDED RemediationRefund exists per (complaint_case_id, transaction_id)"
    error_id: ERR_REFUND_DUPLICATE_TRANSACTION
    http_status: 409
    applies_to: "POST /complaint-cases/{id}/refunds"

  - priority: 118
    category: business_constraint
    check: "No RemediationRefund of the case is still in state PENDING when the case is closed"
    error_id: ERR_REMEDIATION_REFUNDS_PENDING
    http_status: 409
    applies_to: "POST /complaint-cases/{id}/remediation-actions"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- Jurisdiction
  - method: POST
    path: "/jurisdictions"
    description: Register a state jurisdiction with its surcharge-law variance profile.
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, surcharge_permitted, "surcharge_cap_pct?", cash_discount_permitted, price_posting_required, disclosure_signage_required, receipt_line_item_required, ag_enforcement_posture]
    output: Jurisdiction
    side_effects: ["none beyond row creation with law_change_count = 0"]

  - method: GET
    path: "/jurisdictions/{id}"
    description: Read one jurisdiction's law profile.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: "/jurisdictions"
    description: List jurisdictions with pagination.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: ["state_code?", "surcharge_permitted?", "limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []

  - method: POST
    path: "/jurisdictions/{id}/law-changes"
    description: Apply a statutory change to the jurisdiction's surcharge-law profile; the entry point of the prohibition cascade.
    roles: [StateRegulator]
    code: 200
    input: [surcharge_permitted, "surcharge_cap_pct?", "cash_discount_permitted?", "price_posting_required?", "disclosure_signage_required?", "receipt_line_item_required?", "ag_enforcement_posture?"]
    output: Jurisdiction
    side_effects:
      - "increments Jurisdiction.law_change_count and sets last_law_change_at to the logical clock"
      - "when surcharge_permitted flips to false: every SURCHARGE SurchargeProgram of this jurisdiction not already DISABLED or WITHDRAWN transitions to DISABLED with disable_reason = JURISDICTION_PROHIBITION, which quarantines that program's CONFIGURED and ENFORCING terminals with quarantine_reason = PROGRAM_DISABLED, which recomputes Merchant.enforcing_terminal_count"
      - "when surcharge_permitted flips to true: every DISABLED program of this jurisdiction whose disable_reason == JURISDICTION_PROHIBITION transitions to SUSPENDED with disable_reason = OPERATOR_SUSPENSION and recomputes effective_cap_pct"
      - "increments Jurisdiction.version by 1 and SurchargeProgram.version by 1 for every cascaded program"

  # -------------------------------------------------------------------- Merchant
  - method: POST
    path: "/merchants"
    description: Onboard a merchant into a jurisdiction.
    roles: [PlatformAdmin]
    code: 201
    input: [jurisdiction_id, legal_name, mcc]
    output: Merchant
    side_effects: ["initialises gross_surcharge_collected_cents, net_surcharge_collected_cents and enforcing_terminal_count to 0 and active_cost_documentation_id to null"]

  - method: GET
    path: "/merchants/{id}"
    description: Read one merchant including its surcharge ledger and terminal census.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: []
    output: Merchant
    side_effects: []

  - method: GET
    path: "/merchants"
    description: List merchants, optionally filtered by jurisdiction.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: ["jurisdiction_id?", "mcc?", "limit?", "offset?"]
    output: Merchant[]
    side_effects: []

  - method: POST
    path: "/merchants/{id}/cost-documentations"
    description: File merchant-discount cost documentation; supersedes the merchant's current ACTIVE document. Guarded by OCC on Merchant.version.
    roles: [ComplianceOfficer]
    code: 201
    input: [base_mdr_pct, assessment_pct, per_item_fee_cents, evidence_uri, expected_merchant_version]
    output: CostDocumentation
    side_effects:
      - "runs average_ticket_snapshot and freezes average_ticket_cents on the new row"
      - "runs cost_documentation_evaluation and freezes documented_cost_pct on the new row"
      - "transitions the merchant's previous ACTIVE CostDocumentation to SUPERSEDED with superseded_at set"
      - "sets Merchant.active_cost_documentation_id to the new document id"
      - "increments Merchant.version by 1"

  - method: GET
    path: "/cost-documentations/{id}"
    description: Read one cost-documentation record.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: []
    output: CostDocumentation
    side_effects: []

  - method: GET
    path: "/cost-documentations"
    description: List cost-documentation records, optionally by merchant and state.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: ["merchant_id?", "state?", "limit?", "offset?"]
    output: CostDocumentation[]
    side_effects: []

  # ------------------------------------------------------------ SurchargeProgram
  - method: POST
    path: "/surcharge-programs"
    description: Create a surcharge or cash-discount program in DRAFT, pinning the merchant's cost documentation.
    roles: [ComplianceOfficer]
    code: 201
    input: [merchant_id, jurisdiction_id, cost_documentation_id, program_type, consistency_scope]
    output: SurchargeProgram
    side_effects:
      - "runs effective_surcharge_cap and stores SurchargeProgram.effective_cap_pct"
      - "sets cost_documentation_pinned_at to the logical clock"
      - "sets status = DRAFT, disable_reason = NONE, disclosure_ready = false, network_exposure_score = 0, ag_exposure_score = 0"

  - method: GET
    path: "/surcharge-programs/{id}"
    description: Read one program including its cap, readiness flag and both exposure scores.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: []
    output: SurchargeProgram
    side_effects: []

  - method: GET
    path: "/surcharge-programs"
    description: List programs, optionally filtered by merchant, jurisdiction, pinned cost documentation, or status.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: ["merchant_id?", "jurisdiction_id?", "cost_documentation_id?", "status?", "program_type?", "limit?", "offset?"]
    output: SurchargeProgram[]
    side_effects: []

  - method: PATCH
    path: "/surcharge-programs/{id}"
    description: Re-pin the program's cost documentation or change its consistency scope while it is not yet ACTIVE. Guarded by OCC on SurchargeProgram.version.
    roles: [ComplianceOfficer]
    code: 200
    input: ["cost_documentation_id?", "consistency_scope?", expected_program_version]
    output: SurchargeProgram
    side_effects:
      - "recomputes SurchargeProgram.effective_cap_pct via effective_surcharge_cap"
      - "sets cost_documentation_pinned_at to the logical clock when cost_documentation_id changed"
      - "increments SurchargeProgram.version by 1"

  - method: POST
    path: "/surcharge-programs/{id}/activate"
    description: Activate the program. Divergent preconditions per program_type, and the activating officer may not be an attesting officer.
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SurchargeProgram
    side_effects:
      - "transitions DRAFT -> ACTIVE for CASH_DISCOUNT or PENDING_REGISTRATION -> ACTIVE for SURCHARGE"
      - "sets activated_at, activated_by_user_id, disable_reason = NONE"
      - "recomputes effective_cap_pct and disclosure_ready"
      - "increments SurchargeProgram.version by 1"

  - method: POST
    path: "/surcharge-programs/{id}/status-actions"
    description: "Apply a lifecycle action to the program: SUSPEND, RESUME or WITHDRAW."
    roles: [ComplianceOfficer, NetworkAuditor]
    code: 200
    input: [action, "reason?"]
    output: SurchargeProgram
    side_effects:
      - "SUSPEND: ACTIVE -> SUSPENDED with disable_reason = OPERATOR_SUSPENSION, quarantines the program's ENFORCING terminals with quarantine_reason = PROGRAM_SUSPENDED, recomputes Merchant.enforcing_terminal_count"
      - "RESUME: SUSPENDED -> ACTIVE with disable_reason = NONE, recomputes effective_cap_pct and disclosure_ready; quarantined terminals stay quarantined"
      - "WITHDRAW: any non-terminal state -> WITHDRAWN, expires ATTESTED artifacts with expired_reason = PROGRAM_WITHDRAWN, revokes live registrations, disables the program's terminals, recomputes Merchant.enforcing_terminal_count"
      - "increments SurchargeProgram.version by 1"

  - method: GET
    path: "/surcharge-programs/{id}/exposure-summary"
    description: Computed read exposing both variants of compliance_exposure_score side by side.
    roles: [PlatformAdmin, ComplianceOfficer, NetworkAuditor, StateRegulator]
    code: 200
    input: []
    output: { program_id: string, network_exposure_score: number, ag_exposure_score: number, substantiated_case_count: integer, unresolved_case_count: integer, posture_multiplier: number, remediation_threshold: number }
    side_effects: []

  - method: GET
    path: "/surcharge-programs/{id}/settlement-summary"
    description: Computed read exposing the pinned per-line rounding total alongside the pooled reference figure it deliberately diverges from.
    roles: [PlatformAdmin, ComplianceOfficer, NetworkAuditor, StateRegulator]
    code: 200
    input: ["from_iso8601?", "to_iso8601?"]
    output: { program_id: string, transaction_count: integer, base_amount_total_cents: integer, per_line_rounded_surcharge_cents: integer, pooled_rounding_reference_cents: integer, rounding_divergence_cents: integer, refunded_surcharge_cents: integer, net_surcharge_cents: integer }
    side_effects: []

  # --------------------------------------------------------------- BrandRateRule
  - method: POST
    path: "/surcharge-programs/{id}/rate-rules"
    description: File a brand or product-tier rate rule with a closed effectivity interval. Guarded by OCC on SurchargeProgram.version.
    roles: [ComplianceOfficer]
    code: 201
    input: [brand, product_tier, rate_pct, effective_from, effective_to, expected_program_version]
    output: BrandRateRule
    side_effects:
      - "validates rate_pct against SurchargeProgram.effective_cap_pct and the RATE_CHANGE_BUFFER_DAYS separation rule"
      - "sets created_by_user_id from X-User-ID"
      - "increments SurchargeProgram.version by 1"

  - method: GET
    path: "/brand-rate-rules/{id}"
    description: Read one rate rule.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: []
    output: BrandRateRule
    side_effects: []

  - method: GET
    path: "/brand-rate-rules"
    description: List rate rules, optionally filtered by program, brand or product tier.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: ["program_id?", "brand?", "product_tier?", "limit?", "offset?"]
    output: BrandRateRule[]
    side_effects: []

  # ---------------------------------------------------------- NetworkRegistration
  - method: POST
    path: "/surcharge-programs/{id}/network-registrations"
    description: Submit a surcharge-program registration to a card network; moves a DRAFT SURCHARGE program to PENDING_REGISTRATION.
    roles: [ComplianceOfficer]
    code: 201
    input: [network, registration_ref]
    output: NetworkRegistration
    side_effects:
      - "sets submitted_at to the logical clock, notice_days = NOTICE_PERIOD_DAYS and earliest_effective_at = submitted_at + NOTICE_PERIOD_DAYS days"
      - "transitions the program DRAFT -> PENDING_REGISTRATION on the first registration"
      - "increments SurchargeProgram.version by 1"

  - method: GET
    path: "/network-registrations/{id}"
    description: Read one network registration.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: []
    output: NetworkRegistration
    side_effects: []

  - method: GET
    path: "/network-registrations"
    description: List network registrations, optionally filtered by program, network or state.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: ["program_id?", "network?", "state?", "limit?", "offset?"]
    output: NetworkRegistration[]
    side_effects: []

  - method: POST
    path: "/network-registrations/{id}/decision"
    description: "Network decision on a registration: ACKNOWLEDGE, REJECT or REVOKE."
    roles: [NetworkAuditor]
    code: 200
    input: [decision, "decision_note?"]
    output: NetworkRegistration
    side_effects:
      - "ACKNOWLEDGE: SUBMITTED -> ACKNOWLEDGED"
      - "REJECT: SUBMITTED -> REJECTED, program stays PENDING_REGISTRATION"
      - "REVOKE: EFFECTIVE -> REVOKED with revoked_at set; when the program is ACTIVE it transitions to SUSPENDED with disable_reason = REGISTRATION_REVOKED, quarantining its ENFORCING terminals and recomputing Merchant.enforcing_terminal_count"
      - "increments NetworkRegistration.version by 1"

  - method: POST
    path: "/network-registrations/{id}/effectuate"
    description: Make an acknowledged registration effective once the notice period has elapsed.
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: NetworkRegistration
    side_effects:
      - "ACKNOWLEDGED -> EFFECTIVE with effective_at set to the logical clock"
      - "increments NetworkRegistration.version by 1"

  # ---------------------------------------------------------- DisclosureArtifact
  - method: POST
    path: "/surcharge-programs/{id}/disclosure-artifacts"
    description: The merchant files a draft disclosure artifact (signage, receipt template or posted price list) for the program.
    roles: [MerchantOperator]
    code: 201
    input: [artifact_type, content_hash]
    output: DisclosureArtifact
    side_effects: ["creates the artifact in state DRAFT with effective_from, expires_at, attested_at and attested_by_user_id all null"]

  - method: POST
    path: "/disclosure-artifacts/{id}/attest"
    description: A compliance officer attests a draft artifact for a half-open effectivity window.
    roles: [ComplianceOfficer]
    code: 200
    input: [effective_from, expires_at]
    output: DisclosureArtifact
    side_effects:
      - "DRAFT -> ATTESTED with attested_at and attested_by_user_id set"
      - "recomputes SurchargeProgram.disclosure_ready for the artifact's program"
      - "increments SurchargeProgram.version by 1 and DisclosureArtifact.version by 1"

  - method: GET
    path: "/disclosure-artifacts/{id}"
    description: Read one disclosure artifact.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: []
    output: DisclosureArtifact
    side_effects: []

  - method: GET
    path: "/disclosure-artifacts"
    description: List disclosure artifacts, optionally filtered by program, type or state.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: ["program_id?", "artifact_type?", "state?", "limit?", "offset?"]
    output: DisclosureArtifact[]
    side_effects: []

  # -------------------------------------------------------------------- Terminal
  - method: POST
    path: "/merchants/{id}/terminals"
    description: Provision a point-of-sale terminal for the merchant.
    roles: [MerchantOperator]
    code: 201
    input: [serial_number]
    output: Terminal
    side_effects: ["creates the terminal in state PROVISIONED with program_id null, debit_exclusion_enabled false and bin_table_version null"]

  - method: POST
    path: "/terminals/{id}/configure"
    description: Bind the terminal to a program and load its BIN table and debit-exclusion setting.
    roles: [MerchantOperator]
    code: 200
    input: [program_id, debit_exclusion_enabled, bin_table_version]
    output: Terminal
    side_effects:
      - "sets program_id, debit_exclusion_enabled, bin_table_version, last_configured_at and quarantine_reason = NONE"
      - "moves the terminal to CONFIGURED from PROVISIONED, CONFIGURED or QUARANTINED"
      - "recomputes Merchant.enforcing_terminal_count when the terminal left ENFORCING"
      - "increments Terminal.version by 1"

  - method: POST
    path: "/terminals/{id}/state-actions"
    description: "Apply a terminal action: ENFORCE, QUARANTINE or RESTORE. RESTORE branches to ENFORCING or CONFIGURED depending on the program's current status and readiness."
    roles: [MerchantOperator, ComplianceOfficer]
    code: 200
    input: [action, "note?"]
    output: Terminal
    side_effects:
      - "ENFORCE: CONFIGURED -> ENFORCING, recomputes Merchant.enforcing_terminal_count"
      - "QUARANTINE: ENFORCING -> QUARANTINED with quarantine_reason = OPERATOR_ACTION, recomputes Merchant.enforcing_terminal_count"
      - "RESTORE: QUARANTINED -> ENFORCING when the program is ACTIVE and disclosure_ready (recomputing Merchant.enforcing_terminal_count), otherwise QUARANTINED -> CONFIGURED leaving the census unchanged"
      - "increments Terminal.version by 1"

  - method: GET
    path: "/terminals/{id}"
    description: Read one terminal.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: []
    output: Terminal
    side_effects: []

  - method: GET
    path: "/terminals"
    description: List terminals, optionally filtered by merchant, program or state.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: ["merchant_id?", "program_id?", "state?", "limit?", "offset?"]
    output: Terminal[]
    side_effects: []

  # ----------------------------------------------------------------- Transaction
  - method: POST
    path: "/transactions"
    description: The terminal books a sale; the server prices it through rate_rule_selection and transaction_price_resolution and refuses non-compliant captures.
    roles: [TerminalAgent]
    code: 201
    input: [terminal_id, program_id, card_brand, card_funding, product_tier, base_amount_cents, requested_surcharge_cents, receipt_line_present]
    output: Transaction
    side_effects:
      - "computes applied_rate_pct, surcharge_amount_cents, cash_discount_amount_cents, cash_price_cents, total_amount_cents and outcome"
      - "sets occurred_at to the logical clock"
      - "increases Merchant.gross_surcharge_collected_cents and Merchant.net_surcharge_collected_cents by surcharge_amount_cents via merchant_surcharge_ledger"
      - "increments Merchant.version by 1"

  - method: GET
    path: "/transactions/{id}"
    description: Read one captured transaction with its computed pricing fields.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: []
    output: Transaction
    side_effects: []

  - method: GET
    path: "/transactions"
    description: List transactions, optionally filtered by terminal, program or outcome.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: ["terminal_id?", "program_id?", "outcome?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []

  # --------------------------------------------------------------- ComplaintCase
  - method: POST
    path: "/complaint-cases"
    description: A network or an attorney general files a complaint against a program.
    roles: [NetworkAuditor, StateRegulator]
    code: 201
    input: [program_id, source, allegation_type, narrative]
    output: ComplaintCase
    side_effects:
      - "sets received_at to the logical clock, filed_by_user_id from X-User-ID, investigation_state = OPEN and remediation_state = NONE"
      - "computes response_due_at via response_window_assignment"
      - "recomputes SurchargeProgram.ag_exposure_score via compliance_exposure_score AG_METHOD"

  - method: POST
    path: "/complaint-cases/{id}/investigation-actions"
    description: "Advance the investigation dimension: REVIEW, SUBSTANTIATE or DISMISS."
    roles: [ComplianceOfficer, NetworkAuditor, StateRegulator]
    code: 200
    input: [action, "note?"]
    output: ComplaintCase
    side_effects:
      - "REVIEW: OPEN -> UNDER_REVIEW with reviewed_by_user_id set; remediation_state untouched"
      - "SUBSTANTIATE: -> SUBSTANTIATED, sets remediation_state = PLAN_REQUIRED, recomputes both exposure scores, and when network_exposure_score >= REMEDIATION_EXPOSURE_THRESHOLD drives the program ACTIVE -> REMEDIATION, expiring its ATTESTED artifacts, quarantining its ENFORCING terminals and recomputing Merchant.enforcing_terminal_count"
      - "DISMISS: -> DISMISSED, recomputes both exposure scores, remediation_state stays NONE"
      - "increments ComplaintCase.version by 1"

  - method: POST
    path: "/complaint-cases/{id}/remediation-actions"
    description: "Advance the remediation dimension: SUBMIT_PLAN, ACCEPT_PLAN or CLOSE."
    roles: [ComplianceOfficer, NetworkAuditor, StateRegulator]
    code: 200
    input: [action, "plan_summary?"]
    output: ComplaintCase
    side_effects:
      - "SUBMIT_PLAN: PLAN_REQUIRED -> PLAN_SUBMITTED with plan_summary stored"
      - "ACCEPT_PLAN: PLAN_SUBMITTED -> PLAN_ACCEPTED, unlocking refund creation"
      - "CLOSE: PLAN_ACCEPTED -> CLOSED, recomputes refund_total_cents, and bubbles the program REMEDIATION -> ACTIVE when no other case blocks and disclosure_readiness is true again"
      - "increments ComplaintCase.version by 1"

  - method: GET
    path: "/complaint-cases/{id}"
    description: Read one complaint case with both state dimensions.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: []
    output: ComplaintCase
    side_effects: []

  - method: GET
    path: "/complaint-cases"
    description: List complaint cases, optionally filtered by program, source or investigation state.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: ["program_id?", "source?", "investigation_state?", "remediation_state?", "limit?", "offset?"]
    output: ComplaintCase[]
    side_effects: []

  # ----------------------------------------------------------- RemediationRefund
  - method: POST
    path: "/complaint-cases/{id}/refunds"
    description: Create a pending surcharge refund under an accepted remediation plan.
    roles: [ComplianceOfficer]
    code: 201
    input: [transaction_id, refund_amount_cents]
    output: RemediationRefund
    side_effects: ["creates the refund in state PENDING with created_by_user_id set from X-User-ID; no ledger field moves yet"]

  - method: POST
    path: "/remediation-refunds/{id}/issue"
    description: Issue a pending refund. The issuing officer may not be the officer who created it.
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RemediationRefund
    side_effects:
      - "PENDING -> ISSUED with issued_at and issued_by_user_id set"
      - "decreases Merchant.net_surcharge_collected_cents by refund_amount_cents while gross_surcharge_collected_cents is unchanged"
      - "increases Transaction.refunded_surcharge_cents and ComplaintCase.refund_total_cents by refund_amount_cents"
      - "increments Merchant.version by 1 and RemediationRefund.version by 1"

  - method: POST
    path: "/remediation-refunds/{id}/void"
    description: Void a pending or issued refund; voiding an issued refund is the compensating action that restores the merchant ledger.
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: RemediationRefund
    side_effects:
      - "PENDING -> VOIDED with no ledger movement, or ISSUED -> VOIDED restoring Merchant.net_surcharge_collected_cents and decreasing Transaction.refunded_surcharge_cents and ComplaintCase.refund_total_cents"
      - "increments Merchant.version by 1 (issued case only) and RemediationRefund.version by 1"

  - method: GET
    path: "/remediation-refunds/{id}"
    description: Read one remediation refund.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: []
    output: RemediationRefund
    side_effects: []

  - method: GET
    path: "/remediation-refunds"
    description: List remediation refunds, optionally filtered by case, transaction or state.
    roles: [PlatformAdmin, ComplianceOfficer, MerchantOperator, NetworkAuditor, StateRegulator, TerminalAgent]
    code: 200
    input: ["complaint_case_id?", "transaction_id?", "state?", "limit?", "offset?"]
    output: RemediationRefund[]
    side_effects: []

  # -------------------------------------------------------- test-driving surface
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every deadline, notice period, effectivity window and expiry is evaluated against that fixed instant and NEVER against real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["no entity state changes; subsequent requests evaluate every temporal rule against the new logical clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_ACTION_ROLE_FORBIDDEN
    http: 403
    condition: "The acting role is allowed on the endpoint but not for the specific action value in the body (for example NetworkAuditor requesting action = RESUME on status-actions)"
  - id: ERR_MERCHANT_OWNERSHIP_REQUIRED
    http: 403
    condition: "MerchantOperator X-User-ID differs from the target resource's merchant_id"
  - id: ERR_TERMINAL_IDENTITY_MISMATCH
    http: 403
    condition: "TerminalAgent X-User-ID differs from the body terminal_id on POST /transactions"
  - id: ERR_COMPLAINT_SOURCE_ROLE_MISMATCH
    http: 403
    condition: "NetworkAuditor acting on an ATTORNEY_GENERAL case, or StateRegulator acting on a NETWORK or CARDHOLDER case"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The activating officer attested one of the program's disclosure artifacts, or the issuing officer created the refund"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum member, out-of-range number, unparseable instant, inverted interval, or product_tier inconsistent with card_funding"

  # ---- existence ----
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "jurisdiction id in the path or body does not exist"
  - id: ERR_MERCHANT_NOT_FOUND
    http: 404
    condition: "merchant id in the path or body does not exist"
  - id: ERR_COST_DOCUMENTATION_NOT_FOUND
    http: 404
    condition: "cost_documentation_id in the path or body does not exist"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "surcharge program id in the path or body does not exist"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "network registration id in the path does not exist"
  - id: ERR_ARTIFACT_NOT_FOUND
    http: 404
    condition: "disclosure artifact id in the path does not exist"
  - id: ERR_TERMINAL_NOT_FOUND
    http: 404
    condition: "terminal id in the path or body does not exist"
  - id: ERR_TRANSACTION_NOT_FOUND
    http: 404
    condition: "transaction id in the path or body does not exist"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "complaint case id in the path does not exist"
  - id: ERR_REFUND_NOT_FOUND
    http: 404
    condition: "remediation refund id in the path does not exist"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not equal the program's current version on rate-rule creation or PATCH"
  - id: ERR_STALE_MERCHANT_VERSION
    http: 412
    condition: "expected_merchant_version does not equal the merchant's current version on cost-documentation filing"

  # ---- state preconditions ----
  - id: ERR_INVALID_PROGRAM_STATE
    http: 409
    condition: "The program's current status has no declared transition for the requested action (activating an ACTIVE program, resuming a DRAFT program, filing a rate rule on a WITHDRAWN program, configuring a terminal against a WITHDRAWN program)"
  - id: ERR_INVALID_REGISTRATION_STATE
    http: 409
    condition: "Acknowledging a non-SUBMITTED registration, effectuating a non-ACKNOWLEDGED registration, or revoking a non-EFFECTIVE registration"
  - id: ERR_INVALID_ARTIFACT_STATE
    http: 409
    condition: "Attesting an artifact that is not in state DRAFT"
  - id: ERR_INVALID_TERMINAL_STATE
    http: 409
    condition: "ENFORCE on a terminal that is not CONFIGURED, QUARANTINE on a terminal that is not ENFORCING, RESTORE on a terminal that is not QUARANTINED, any action on a DISABLED terminal, or POST /transactions from a terminal whose state is not ENFORCING"
  - id: ERR_INVALID_COMPLAINT_STATE
    http: 409
    condition: "An investigation action from a terminal investigation_state, a remediation action from the wrong remediation_state, refund creation before remediation_state == PLAN_ACCEPTED, or refund issue after the case closed"
  - id: ERR_INVALID_REFUND_STATE
    http: 409
    condition: "Issuing a refund that is not PENDING, or voiding a refund that is already VOIDED"

  # ---- compliance / safety ----
  - id: ERR_SURCHARGE_PROHIBITED_JURISDICTION
    http: 422
    condition: "A SURCHARGE program is created, activated, resumed, or transacted against in a jurisdiction whose surcharge_permitted is false"
  - id: ERR_CASH_DISCOUNT_PROHIBITED_JURISDICTION
    http: 422
    condition: "A CASH_DISCOUNT program is created, activated, or resumed in a jurisdiction whose cash_discount_permitted is false"
  - id: ERR_PROGRAM_DISABLED_BY_PROHIBITION
    http: 422
    condition: "A transaction is booked against a program in status DISABLED or WITHDRAWN"
  - id: ERR_DEBIT_SURCHARGE_FORBIDDEN
    http: 422
    condition: "requested_surcharge_cents is greater than 0 while card_funding is DEBIT or PREPAID"
  - id: ERR_DEBIT_EXCLUSION_NOT_ENABLED
    http: 422
    condition: "ENFORCE or RESTORE-to-ENFORCING on a terminal bound to a SURCHARGE program while debit_exclusion_enabled is false"

  # ---- referential integrity ----
  - id: ERR_TERMINAL_PROGRAM_MISMATCH
    http: 422
    condition: "Terminal.program_id differs from the body program_id, or a terminal is configured against a program owned by another merchant"
  - id: ERR_JURISDICTION_SCOPE_MISMATCH
    http: 422
    condition: "A program's jurisdiction_id differs from its merchant's jurisdiction_id"
  - id: ERR_COST_DOCUMENTATION_MERCHANT_MISMATCH
    http: 422
    condition: "The pinned cost documentation belongs to a different merchant than the program"
  - id: ERR_REFUND_TRANSACTION_SCOPE_MISMATCH
    http: 422
    condition: "The refunded transaction belongs to a merchant other than the one owning the complaint case's program"

  # ---- documentation / temporal ----
  - id: ERR_COST_DOCUMENTATION_STALE
    http: 409
    condition: "The program's pinned CostDocumentation is in state SUPERSEDED when a rate rule is filed or the program is activated"
  - id: ERR_RATE_WINDOW_BUFFER_VIOLATION
    http: 409
    condition: "A new rate rule's closed interval is less than RATE_CHANGE_BUFFER_DAYS days away from an existing rule of the same program, brand and product tier, including exact adjacency"
  - id: ERR_DISCLOSURE_WINDOW_OVERLAP
    http: 409
    condition: "A newly attested artifact's half-open window intersects an existing ATTESTED artifact of the same program and type"
  - id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http: 422
    condition: "Effectuation attempted while the logical clock is strictly before earliest_effective_at"

  # ---- program-structure consistency ----
  - id: ERR_PRODUCT_TIER_SCOPE_VIOLATION
    http: 422
    condition: "A rate rule's product_tier contradicts the program's consistency_scope"
  - id: ERR_BRAND_CONSISTENCY_VIOLATION
    http: 422
    condition: "Activation attempted while some network with an EFFECTIVE registration has no rate rule in effect for its brand"
  - id: ERR_REGISTRATION_NOT_EFFECTIVE
    http: 409
    condition: "A SURCHARGE program is activated with no EFFECTIVE registration, or resumed while a registration is REVOKED"
  - id: ERR_DISCLOSURE_INCOMPLETE
    http: 422
    condition: "disclosure_readiness is false for the program's required artifact set (including the zero-attested-artifact case)"
  - id: ERR_PRICE_POSTING_REQUIRED
    http: 422
    condition: "A CASH_DISCOUNT program is activated without an ATTESTED PRICE_LIST_POSTING artifact in a jurisdiction requiring posted prices"
  - id: ERR_NO_RATE_RULE_IN_EFFECT
    http: 422
    condition: "rate_rule_selection finds no candidate rule for the program, brand and clock position"
  - id: ERR_RECEIPT_LINE_ITEM_REQUIRED
    http: 422
    condition: "A surcharged transaction is captured with receipt_line_present false in a jurisdiction requiring a separate receipt line item"

  # ---- uniqueness ----
  - id: ERR_DUPLICATE_JURISDICTION_STATE
    http: 409
    condition: "A jurisdiction already exists for the supplied state_code"
  - id: ERR_DUPLICATE_TERMINAL_SERIAL
    http: 409
    condition: "The merchant already has a terminal with the supplied serial_number"
  - id: ERR_DUPLICATE_NETWORK_REGISTRATION
    http: 409
    condition: "The program already has a SUBMITTED, ACKNOWLEDGED or EFFECTIVE registration for that network"

  # ---- fiscal ----
  - id: ERR_JURISDICTION_CAP_REQUIRED
    http: 422
    condition: "surcharge_permitted true with a null surcharge_cap_pct, or surcharge_permitted false with a non-null surcharge_cap_pct"
  - id: ERR_SURCHARGE_CAP_EXCEEDED
    http: 422
    condition: "rate_pct is strictly greater than the program's effective_cap_pct"
  - id: ERR_SURCHARGE_AMOUNT_MISMATCH
    http: 422
    condition: "requested_surcharge_cents differs from the server-computed surcharge_amount_cents"
  - id: ERR_REFUND_AMOUNT_EXCEEDS_SURCHARGE
    http: 422
    condition: "refund_amount_cents exceeds the transaction's unrefunded surcharge"
  - id: ERR_REFUND_DUPLICATE_TRANSACTION
    http: 409
    condition: "A non-VOIDED refund already exists for that case and transaction"
  - id: ERR_REMEDIATION_REFUNDS_PENDING
    http: 409
    condition: "CLOSE requested while at least one refund of the case is still PENDING"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: Platform operator who seeds jurisdictions and merchants and controls the logical clock.
    identity: opaque
    exclusive_operations:
      - "POST /jurisdictions"
      - "POST /merchants"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"

  - name: ComplianceOfficer
    description: Payment-compliance officer who builds, documents, registers, activates and remediates programs. Two distinct officer user ids are required by the segregation-of-duties rules.
    identity: opaque
    exclusive_operations:
      - "POST /merchants/{id}/cost-documentations"
      - "POST /surcharge-programs"
      - "PATCH /surcharge-programs/{id}"
      - "POST /surcharge-programs/{id}/rate-rules"
      - "POST /surcharge-programs/{id}/network-registrations"
      - "POST /surcharge-programs/{id}/activate"
      - "POST /network-registrations/{id}/effectuate"
      - "POST /disclosure-artifacts/{id}/attest"
      - "POST /surcharge-programs/{id}/status-actions with action RESUME or WITHDRAW"
      - "POST /complaint-cases/{id}/investigation-actions with action REVIEW"
      - "POST /complaint-cases/{id}/remediation-actions with action SUBMIT_PLAN"
      - "POST /complaint-cases/{id}/refunds"
      - "POST /remediation-refunds/{id}/issue"
      - "POST /remediation-refunds/{id}/void"
    shared_operations:
      - "POST /surcharge-programs/{id}/status-actions with action SUSPEND (shared with NetworkAuditor)"
      - "POST /terminals/{id}/state-actions with action QUARANTINE (shared with MerchantOperator)"
      - "every GET endpoint"

  - name: MerchantOperator
    description: The merchant itself, acting through the portal on its own terminals and its own draft disclosure artifacts.
    identity: "entity_backed:Merchant"
    exclusive_operations:
      - "POST /merchants/{id}/terminals"
      - "POST /terminals/{id}/configure"
      - "POST /terminals/{id}/state-actions with action ENFORCE or RESTORE"
      - "POST /surcharge-programs/{id}/disclosure-artifacts"
    shared_operations:
      - "POST /terminals/{id}/state-actions with action QUARANTINE (shared with ComplianceOfficer)"
      - "every GET endpoint"

  - name: NetworkAuditor
    description: Card-network compliance auditor who decides registrations, files network and cardholder complaints, and rules on their remediation.
    identity: opaque
    exclusive_operations:
      - "POST /network-registrations/{id}/decision"
      - "POST /complaint-cases with source NETWORK or CARDHOLDER"
      - "POST /complaint-cases/{id}/investigation-actions with action SUBSTANTIATE or DISMISS on a NETWORK or CARDHOLDER case"
      - "POST /complaint-cases/{id}/remediation-actions with action ACCEPT_PLAN or CLOSE on a NETWORK or CARDHOLDER case"
    shared_operations:
      - "POST /surcharge-programs/{id}/status-actions with action SUSPEND (shared with ComplianceOfficer)"
      - "every GET endpoint except GET /surcharge-programs/{id}/exposure-summary and GET /surcharge-programs/{id}/settlement-summary, which exclude MerchantOperator and TerminalAgent"

  - name: StateRegulator
    description: State attorney-general office that changes the surcharge law and pursues attorney-general complaints.
    identity: opaque
    exclusive_operations:
      - "POST /jurisdictions/{id}/law-changes"
      - "POST /complaint-cases with source ATTORNEY_GENERAL"
      - "POST /complaint-cases/{id}/investigation-actions with action SUBSTANTIATE or DISMISS on an ATTORNEY_GENERAL case"
      - "POST /complaint-cases/{id}/remediation-actions with action ACCEPT_PLAN or CLOSE on an ATTORNEY_GENERAL case"
    shared_operations:
      - "every GET endpoint except the merchant-facing summaries noted above"

  - name: TerminalAgent
    description: The point-of-sale terminal itself, authenticating as its own Terminal id to capture sales.
    identity: "entity_backed:Terminal"
    exclusive_operations:
      - "POST /transactions"
    shared_operations:
      - "every GET endpoint except GET /surcharge-programs/{id}/exposure-summary and GET /surcharge-programs/{id}/settlement-summary"
