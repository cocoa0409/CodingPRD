    side_effects: []
  - method: GET
    path: "/referrals"
    description: "List referrals"
    roles: [Provider, FrontDesk]
    code: 200
    input: ["patient_id?", "referring_provider_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: POST
    path: "/referrals/{id}/authorize"
    description: "Authorize a referral (requires patient PCP bound; sets expiry)"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Referral
    side_effects: ["authorization_expires_at set via referral_auth_window", "increments Referral.version by 1"]
  - method: POST
    path: "/referrals/{id}/deny"
    description: "Deny a requested referral"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Referral
    side_effects: ["increments Referral.version by 1"]
  - method: POST
    path: "/referrals/{id}/schedule"
    description: "Schedule an authorized referral before its window expires"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Referral
    side_effects: ["increments Referral.version by 1"]
  - method: POST
    path: "/referrals/{id}/expire"
    description: "System sweep: expire an authorized referral past its window"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Referral
    side_effects: ["increments Referral.version by 1"]
  - method: POST
    path: "/referrals/{id}/complete"
    description: "Complete a scheduled referral"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Referral
    side_effects: ["increments Referral.version by 1"]
  - method: POST
    path: "/referrals/{id}/cancel"
    description: "Cancel a referral (by the referring provider)"
    roles: [Provider]
    code: 200
    input: []
    output: Referral
    side_effects: ["increments Referral.version by 1"]

  # ---- PortalAccount ----
  - method: POST
    path: "/portal-accounts"
    description: "Invite a patient to the portal"
    roles: [FrontDesk]
    code: 201
    input: [patient_id, login_email]
    output: PortalAccount
    side_effects: ["PortalAccount created in INVITED with activation_token issued"]
  - method: GET
    path: "/portal-accounts/{id}"
    description: "Fetch a portal account"
    roles: [FrontDesk, Patient]
    code: 200
    input: []
    output: PortalAccount
    side_effects: []
  - method: POST
    path: "/portal-accounts/{id}/activate"
    description: "Activate via token (wrong token may auto-suspend at lockout threshold)"
    roles: [Patient]
    code: 200
    input: [activation_token]
    output: PortalAccount
    side_effects: ["on success ACTIVE + failed_login_count reset", "on wrong token failed_login_count incremented; auto-SUSPEND at threshold", "increments PortalAccount.version by 1"]
  - method: POST
    path: "/portal-accounts/{id}/suspend"
    description: "Suspend an active portal account"
    roles: [FrontDesk]
    code: 200
    input: []
    output: PortalAccount
    side_effects: ["increments PortalAccount.version by 1"]
  - method: POST
    path: "/portal-accounts/{id}/reinstate"
    description: "Reinstate a suspended portal account (cyclic)"
    roles: [FrontDesk]
    code: 200
    input: []
    output: PortalAccount
    side_effects: ["failed_login_count reset", "increments PortalAccount.version by 1"]
  - method: POST
    path: "/portal-accounts/{id}/deactivate"
    description: "Permanently deactivate a portal account"
    roles: [FrontDesk]
    code: 200
    input: []
    output: PortalAccount
    side_effects: ["increments PortalAccount.version by 1"]

  # ---- HedisMeasure ----
  - method: POST
    path: "/hedis-measures"
    description: "Create a HEDIS measure row for a patient (eligibility computed)"
    roles: [QualityAnalyst]
    code: 201
    input: [patient_id, measure_type, measurement_year, "method?", "chart_confirmed?"]
    output: HedisMeasure
    side_effects: ["eligible computed via hedis_eligibility", "status GAP (or EXCLUDED if ineligible)"]
  - method: GET
    path: "/hedis-measures/{id}"
    description: "Fetch a HEDIS measure"
    roles: [QualityAnalyst, Provider, FrontDesk]
    code: 200
    input: []
    output: HedisMeasure
    side_effects: []
  - method: POST
    path: "/hedis-measures/{id}/exclude"
    description: "Mark a measure EXCLUDED (removes it from the denominator)"
    roles: [QualityAnalyst]
    code: 200
    input: []
    output: HedisMeasure
    side_effects: ["status -> EXCLUDED", "Patient.open_care_gaps recomputed", "increments HedisMeasure.version by 1"]
  - method: GET
    path: "/hedis/rate"
    description: "Computed read: compliance rate over the eligible population for a measure_type + year + method"
    roles: [QualityAnalyst]
    code: 200
    input: [measure_type, measurement_year, method]
    output: "{ measure_type: string, measurement_year: integer, method: string, numerator: integer, denominator: integer, rate_pct: number }"
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server clock for temporal logic (auth windows, no-show, vaccine interval)"
    roles: [FrontDesk, QualityAnalyst, Biller, Provider]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["server clock set to the given instant"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role not permitted for this operation per §1.7"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed actor is not the owner/authorized provider of the target resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "A body foreign key (patient_id, provider_id, visit_id, cpt_code) does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, bad type, out-of-range value, or enum not in declared set"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state"
  - id: ERR_EPCS_REQUIREMENTS_NOT_MET
    http: 422
    condition: "Controlled-substance signing without epcs_enrolled, dea_number, or two_factor_token"
  - id: ERR_VACCINE_INTERVAL_VIOLATION
    http: 409
    condition: "Vaccination check-in within VACCINE_MIN_INTERVAL_DAYS of a prior dose of the same vaccine_code"
  - id: ERR_SLOT_OVERLAP
    http: 409
    condition: "Scheduled visit window overlaps an existing non-cancelled visit of the same provider (half-open)"
  - id: ERR_NO_PCP_BOUND
    http: 409
    condition: "Referral authorization attempted for a patient with no bound PCP"
  - id: ERR_PANEL_AT_CAPACITY
    http: 409
    condition: "Panel bind would make panel_size >= panel_capacity"
  - id: ERR_REFERRAL_EXPIRED
    http: 409
    condition: "Scheduling an authorized referral whose authorization window has elapsed (clock >= authorization_expires_at)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_provider_version does not match the live Provider.version on panel bind"
  - id: ERR_PATIENT_HAS_OPEN_VISITS
    http: 409
    condition: "Patient deactivation attempted while a non-terminal visit exists"
  - id: ERR_DUPLICATE_PORTAL_ACCOUNT
    http: 409
    condition: "A PortalAccount already exists for the patient, or the login_email is already in use"
  - id: ERR_DUPLICATE_NPI
    http: 409
    condition: "Provider npi already registered"
  - id: ERR_DUPLICATE_CPT_CODE
    http: 409
    condition: "CptCode.code already registered"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: FrontDesk
    description: "Registration, scheduling, panel binding, check-in, referral workflow, portal administration"
    identity: "opaque"
    exclusive_operations:
      - "POST /providers"
      - "POST /patients"
      - "POST /providers/{id}/panel"
      - "POST /providers/{id}/deactivate"
      - "POST /patients/{id}/deactivate"
      - "POST /visits"
      - "POST /visits/{id}/check-in"
      - "POST /visits/{id}/cancel"
      - "POST /visits/{id}/no-show"
      - "POST /referrals/{id}/authorize"
      - "POST /referrals/{id}/deny"
      - "POST /referrals/{id}/schedule"
      - "POST /referrals/{id}/expire"
      - "POST /referrals/{id}/complete"
      - "POST /portal-accounts"
      - "POST /portal-accounts/{id}/suspend"
      - "POST /portal-accounts/{id}/reinstate"
      - "POST /portal-accounts/{id}/deactivate"
    shared_operations:
      - "GET endpoints on providers, patients, visits, referrals, prescriptions, cpt-codes, portal-accounts, hedis-measures"

  - name: Provider
    description: "Clinician: conducts visits, codes, prescribes and signs EPCS, requests/cancels referrals"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /visits/{id}/start"
      - "POST /visits/{id}/code"
      - "POST /visits/{id}/reopen"
      - "POST /visits/{id}/charge-lines"
      - "POST /prescriptions"
      - "POST /prescriptions/{id}/submit"
      - "POST /prescriptions/{id}/revise"
      - "POST /prescriptions/{id}/sign"
      - "POST /prescriptions/{id}/transmit"
      - "POST /prescriptions/{id}/dispense"
      - "POST /prescriptions/{id}/void"
      - "POST /referrals"
      - "POST /referrals/{id}/cancel"
    shared_operations:
      - "GET endpoints on providers, patients, visits, referrals, prescriptions, cpt-codes, hedis-measures"

  - name: Biller
    description: "Billing: defines CPT codes, finalizes visits, records payments"
    identity: "opaque"
    exclusive_operations:
      - "POST /cpt-codes"
      - "POST /visits/{id}/finalize"
      - "POST /patients/{id}/payments"
    shared_operations:
      - "GET endpoints on providers, patients, visits, cpt-codes"

  - name: QualityAnalyst
    description: "HEDIS quality reporting: creates/excludes measures and reads compliance rates"
    identity: "opaque"
    exclusive_operations:
      - "POST /hedis-measures"
      - "POST /hedis-measures/{id}/exclude"
      - "GET /hedis/rate"
    shared_operations:
      - "GET endpoints on providers, patients, hedis-measures"

  - name: Patient
    description: "Portal self-service: activates portal, reads own records"
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /portal-accounts/{id}/activate"
    shared_operations:
      - "GET on own patient record, visits, prescriptions, referrals, portal-account"
