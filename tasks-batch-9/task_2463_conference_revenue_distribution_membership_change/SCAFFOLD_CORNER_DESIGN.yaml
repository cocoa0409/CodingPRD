            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - *c_bp
            - *c_bp_open
            - *c_bal_n
            - *c_bal_s
            - *c_bal_e
            - *c_bal_w
            - *c_bp_close
            - *c_mc
          trigger:
            - call: "POST /membership-actions"
              payload: { conference_id: "${conf_id}", member_id: "${m_c_id}", action_type: "ADMIT", effective_fiscal_year: 2027, entry_fee_cents: 0, rationale: "same-year admission" }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /members/${m_n_id}/withdrawal-notice"
              payload: { withdrawal_effective_fiscal_year: 2027, notice_days: 400, reason: "same-year exit" }
              as: Commissioner
              as_user_id: "u_com_1"
            - *c_ma_admit
            - call: "POST /members/${m_n_id}/withdrawal-notice"
              payload: { withdrawal_effective_fiscal_year: 2028, notice_days: 400, reason: "orderly exit" }
              as: Commissioner
              as_user_id: "u_com_1"
          assert:
            - "the 2027 ADMIT proposal returns HTTP 422 with error.error_id == ERR_INVALID_EFFECTIVE_YEAR and creates no MembershipAction"
            - "the 2027 withdrawal notice returns HTTP 422 with error.error_id == ERR_INVALID_EFFECTIVE_YEAR and Member.${m_n_id}.status is still \"FULL_SHARE\" with voting_weight_bps 10000"
            - "the 2028 ADMIT proposal returns HTTP 201 as ${ma_id} in status \"PROPOSED\" with amend_count 0 and version 1"
            - "the 2028 withdrawal notice returns HTTP 200 with Member.${m_n_id}.status == \"WITHDRAWAL_NOTICED\", .withdrawal_effective_fiscal_year == 2028, .notice_days == 400 and .voting_weight_bps == 0"

      - name: corner_ineligible_and_duplicate_ballots_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority 46]
          - validations[priority 47]
          - errors.ERR_MEMBER_NOT_ELIGIBLE_TO_VOTE
          - errors.ERR_DUPLICATE_BALLOT
        distinguishing_aspect: |
          The subject of an ADMIT action carries voting_weight_bps 0 while
          PETITIONED, so Central voting on its own admission is refused 409 at
