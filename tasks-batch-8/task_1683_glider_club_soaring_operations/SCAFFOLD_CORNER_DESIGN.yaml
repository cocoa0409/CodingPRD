              payload: { tier_code: "IM", monthly_dues_cents: 0, tow_fee_discount_pct: 0.10, included_tows_per_month: 0 }
              as: ClubAdmin
              captures: { tim: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Imm Pilot", tier_id: "${tim}" }
              as: ClubAdmin
              captures: { mi5: $.data.id }
            - call: "POST /soaring/members"
              payload: { full_name: "Imm Tow", tier_id: "${tim}", is_tow_pilot: true }
              as: ClubAdmin
              captures: { ti5: $.data.id }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N026G", kind: "GLIDER", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { gi5: $.data.id, gi5_ver: $.data.version }
            - call: "POST /soaring/aircraft"
              payload: { registration: "N027T", kind: "TOW_PLANE", annual_due_date: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { tpi5: $.data.id }
            - call: "POST /soaring/tow-slots"
              payload: { tow_plane_id: "${tpi5}", tow_pilot_id: "${ti5}", start_at: "2026-08-31T09:00:00Z", end_at: "2026-08-31T18:00:00Z", capacity: 2 }
              as: ClubAdmin
              captures: { si5: $.data.id, si5_ver: $.data.version }
            - call: "POST /soaring/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T10:00:00Z" }
              as: ClubAdmin
            - call: "POST /soaring/reservations"
              payload: { aircraft_id: "${gi5}", member_id: "${mi5}", start_at: "2026-08-31T09:30:00Z", end_at: "2026-08-31T14:00:00Z", expected_aircraft_version: "${gi5_ver}" }
              as: Member
              as_user_id: "${mi5}"
              captures: { ri5: $.data.id }
            - call: "POST /soaring/reservations/${ri5}/checkout"
              payload: {}
              as: Member
              as_user_id: "${mi5}"
            - call: "POST /soaring/flights"
              payload: { reservation_id: "${ri5}", tow_slot_id: "${si5}", release_altitude_ft: 1500, takeoff_at: "2026-08-31T10:05:00Z", expected_tow_slot_version: "${si5_ver}" }
              as: Member
              as_user_id: "${mi5}"
              captures: { fi5: $.data.id }
          trigger:
            - call: "POST /soaring/flights/${fi5}/land"
              payload: { landed_at: "2026-08-31T10:35:00Z" }
              as: Member
              as_user_id: "${mi5}"
              captures: { landed_status: $.data.status, landed_fee: $.data.final_fee_cents }
            - call: "GET /soaring/members/${mi5}"
              as: ClubAdmin
              captures: { bal5: $.data.account_balance_cents }
          assert:
            - "land response: status == LANDED, flight_minutes == 30, final_fee_cents == 2700 (30 min <= 60 free minutes, no surcharge; base 3000 * 0.9)"
            - "immediate GET: Member.${mi5}.account_balance_cents == 2700 (provisional 2700 replaced by final 2700, net 0 delta visible in the same read-after-write)"
