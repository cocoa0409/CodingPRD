  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: label_submit_without_substantiation_returns_claim_error
        claim_type: violation_to_error
        grounds: ["validations[priority=34]", "errors[ERR_CLAIM_SUBSTANTIATION_MISSING]"]
        distinguishing_aspect: "A label with one claim and zero substantiation refs cannot be submitted; adding the ref satisfies the rule."
        test_recipe:
          setup: ["plant; label with claims [ORGANIC] and empty substantiation_doc_refs"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-24", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/label-approvals", payload: { product_name: "Organic Ground Beef", claims: ["ORGANIC"], substantiation_doc_refs: [], formulation_version: 1 }, as: QAManager, captures: { label_id: $.data.id } }
          trigger:
            - { call: "POST /label-approvals/${label_id}/submit", payload: {}, as: QAManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_SUBSTANTIATION_MISSING and HTTP status == 422"
            - "GET /label-approvals/${label_id} status remains DRAFT"

      - name: ccp_min_greater_than_max_returns_limit_invalid
        claim_type: violation_to_error
        grounds: ["validations[priority=28]", "errors[ERR_CCP_LIMIT_INVALID]"]
        distinguishing_aspect: "critical_limit_min_f >= critical_limit_max_f is rejected at CCP creation."
        test_recipe:
          setup: ["plant; DRAFT plan"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-25", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
          trigger:
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-X", hazard_category: "BIOLOGICAL", description: "Inverted limits", critical_limit_min_f: 50.0, critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CCP_LIMIT_INVALID and HTTP status == 422"
            - "GET /ccps?haccp_plan_id=${plan_id} returns an empty list"

      - name: duplicate_draft_plan_same_process_returns_duplicate_active_plan
        claim_type: violation_to_error
        grounds: ["validations[priority=30]", "errors[ERR_DUPLICATE_ACTIVE_PLAN]"]
        distinguishing_aspect: "A second DRAFT for the same (plant, process_type) is rejected; a different process_type is accepted."
        test_recipe:
          setup: ["plant; DRAFT plan for RAW_GROUND exists"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-26", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan1: $.data.id } }
          trigger:
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { err: $.data.error_id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "COOKED_RTE" }, as: QAManager, captures: { plan2: $.data.id } }
          assert:
            - "duplicate same-process create: error_id == ERR_DUPLICATE_ACTIVE_PLAN and HTTP status == 422"
            - "different-process create succeeds (201) with status == DRAFT"

      - name: duplicate_production_day_same_date_returns_duplicate_day
        claim_type: violation_to_error
        grounds: ["validations[priority=31]", "errors[ERR_DUPLICATE_PRODUCTION_DAY]"]
        distinguishing_aspect: "At most one non-CLOSED day per (plant, production_date): same date rejected, next date accepted."
        test_recipe:
          setup: ["plant; PLANNED day for 2026-08-01 exists"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-27", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day1: $.data.id } }
          trigger:
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "SLAUGHTER" }, as: ProductionManager, captures: { err: $.data.error_id } }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-02", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day2: $.data.id } }
          assert:
            - "same-date create: error_id == ERR_DUPLICATE_PRODUCTION_DAY and HTTP status == 422 (even with a different process_type)"
            - "different-date create succeeds (201) with status == PLANNED"

      - name: observation_on_superseded_plan_returns_plan_not_effective
        claim_type: violation_to_error
        grounds: ["validations[priority=25]", "errors[ERR_PLAN_NOT_EFFECTIVE]"]
        distinguishing_aspect: "With an OPEN day present (temporal check passes), observing on a SUPERSEDED plan's CCP surfaces the referential error in isolation."
        test_recipe:
          setup: ["plant with plan v1 EFFECTIVE-then-SUPERSEDED by v2; inspector ON_PREMISE; OPEN day on 2026-08-01"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-28", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan1: $.data.id } }
            - { call: "POST /haccp-plans/${plan1}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager, captures: { ccp1: $.data.id } }
            - { call: "POST /haccp-plans/${plan1}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan1}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan1}/activate", payload: {}, as: QAManager }
            - { call: "POST /plants/${plant_id}/inspector-shifts", payload: { inspector_user_id: "insp-01", scheduled_start: "2026-08-01T06:00:00Z", scheduled_end: "2026-08-01T18:00:00Z" }, as: PlantAdmin, captures: { shift_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:00:00Z" }, as: PlantAdmin }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /plants/${plant_id}/production-days", payload: { production_date: "2026-08-01", process_type: "RAW_GROUND" }, as: ProductionManager, captures: { day_id: $.data.id } }
            - { call: "POST /production-days/${day_id}/open", payload: {}, as: ProductionManager }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan2: $.data.id } }
            - { call: "POST /haccp-plans/${plan2}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler v2", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 30 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan2}/submit", payload: {}, as: QAManager }
            - { call: "POST /haccp-plans/${plan2}/approve", payload: {}, as: Inspector, as_user_id: "insp-01" }
            - { call: "POST /haccp-plans/${plan2}/activate", payload: {}, as: QAManager }
          trigger:
            - { call: "POST /ccps/${ccp1}/observations", payload: { observed_value_f: 39.0 }, as: QATech, as_user_id: "qa-tech-1", captures: { err: $.data.error_id } }
          assert:
