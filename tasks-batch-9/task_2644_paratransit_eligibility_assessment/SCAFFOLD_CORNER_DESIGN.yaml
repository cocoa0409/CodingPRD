      - name: determination_draft_checks_signoff_before_the_category_condition_rules
        claim_type: cascading_validation
        grounds:
          - validations.priority_50.ERR_ASSESSMENT_NOT_SIGNED_OFF
          - validations.priority_51.ERR_CONDITIONAL_REQUIRES_CONDITIONS
          - validations.priority_51.ERR_UNCONDITIONAL_FORBIDS_CONDITIONS
        distinguishing_aspect: "Check 50 must run before check 51: a CONDITIONAL draft with zero trip_conditions posted while the assessment is only SCORED returns ERR_ASSESSMENT_NOT_SIGNED_OFF, and the identical payload after sign-off returns ERR_CONDITIONAL_REQUIRES_CONDITIONS — while an UNCONDITIONAL draft carrying one condition is the mirror-image ERR_UNCONDITIONAL_FORBIDS_CONDITIONS."
        test_recipe:
          setup:
            - "CHAIN to an ATTENDED, SCORED (not yet signed off) assessment at clock 2026-08-05T09:30:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Hedda Lindgren", date_of_birth: "1964-04-24", residence_zone: "IN_SERVICE_AREA", mobility_aid: "WALKER" }
