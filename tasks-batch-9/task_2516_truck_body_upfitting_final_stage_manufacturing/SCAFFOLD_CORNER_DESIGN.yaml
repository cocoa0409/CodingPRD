            - "UpfitOrder.${uo}.build_status is still \"ENGINEERING_REVIEW\" and invoice_total_cents is still 0 — a refused release stamps nothing"
            - "the weight gates all passed on the way in: GET /upfit/upfit-orders/${uo}/weight-projection?basis=AS_DESIGNED reports front 4219, rear 5681, gvw 9900 and payload 3685, well inside 5000 / 9450 / 14000"
