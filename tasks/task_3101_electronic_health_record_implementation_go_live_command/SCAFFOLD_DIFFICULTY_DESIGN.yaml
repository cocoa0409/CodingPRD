  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: r7a_facility_validation_requires_department_gate_and_defects_clear
        grounds:
          - state_machines.Facility.BUILD_CONFIGURED_to_VALIDATED
          - state_machines.Department.TRAINING_IN_PROGRESS_to_READY_FOR_GO_LIVE
          - entities.Department.fields.proficiency_gate_open
          - entities.Department.fields.build_blocking_defect_count
