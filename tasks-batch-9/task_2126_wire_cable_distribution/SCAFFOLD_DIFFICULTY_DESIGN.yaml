          setup:
            - "One branch with cut capacity 1, one customer with a credit_limit_cents of exactly 27000, product P1, index CI1 at 450 c/lb, one truck and one 1000 ft reel."
            - "Quote A carries two CUT lines of 137 ft (quoted total 26974) and is converted to order A; quote B carries one CUT line of 137 ft (quoted total 17737) and is converted to order B, which stays PENDING_ALLOCATION; quote C carries one CUT line of 137 ft and is left ISSUED."
            - "Order A is allocated from the 1000 ft reel, both allocations are cut in non-colliding windows so order A is STAGED, and its run is dispatched."
            - "Index CI3 at 460 c/lb effective 2026-08-03 is published -- a 2.22% move, below the 3% tolerance, so no quote is voided for index shock -- and the clock is moved to 2026-08-07T09:00:00Z."
