                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_v: "$.data.version" }
          trigger:
            - call: "POST /residencies/${res}/trainings"
              payload: { training_type: "HAZMAT_HANDLING" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_TRAINING_TYPE_NOT_REQUIRED: HAZMAT_HANDLING is a legal training_type in the abstract but is not a member of this residency's required_training_types"
            - "the refusal wrote nothing: GET /residencies/${res} reads completed_training_types == [], compliance_status still 'TRAINING_PENDING', and version still ${res_v}"
            - "the derived vocabulary is exactly two entries: required_training_types == ['EQUIPMENT_WELDING', 'SAFETY_ORIENTATION'], one per capability tag plus the universal orientation"
            - "both members are accepted: recording EQUIPMENT_WELDING then SAFETY_ORIENTATION each return 200, and after the second the residency auto-clears to compliance_status 'CLEARED'"
            - "an equipment training for a tag this discipline does not have is refused: EQUIPMENT_KILN returns 422 ERR_TRAINING_TYPE_NOT_REQUIRED on this residency, while a residency in a KILN discipline accepts it"
            - "the hazmat member appears only under the conjunction: on a residency whose discipline has requires_hazmat_review true AND whose source application declared hazardous materials, required_training_types contains HAZMAT_HANDLING and the same call returns 200"
            - "an outright unknown token takes the other error: training_type 'BASKET_WEAVING' returns 400 ERR_VALIDATION (P9 enum), not the 422"

      - name: pagination_bounds_are_rejected_before_any_row_is_returned
        claim_type: error_triggerable
        grounds: ["errors[ERR_VALIDATION]", "validations[priority 10]", "pagination.pagination_defaults", "endpoints[GET /applications]"]
        distinguishing_aspect: "P10 is the only rule that fires on a pure read, and its bounds are asymmetric: limit must be in [1,100] so 0 and 101 both fail while 1 and 100 both pass, and offset must be >= 0 with no upper bound at all - an offset past the end is a legal empty page, not an error. Every list endpoint shares the rule, so the check cannot live in one handler."
        test_recipe:
          setup: ["An OPEN cycle with three applications, so the list endpoint has real rows to page over."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art1: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Kell Osei", email: "kell.osei@example.org",
                         affiliation_org: "Press Room East", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2200000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art2: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art1}", discipline_id: "${disc}",
                         requested_session_length_weeks: 8, project_statement: "One", fee_waiver_requested: true }
              as: Applicant
              as_user_id: "${art1}"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art2}", discipline_id: "${disc}",
                         requested_session_length_weeks: 5, project_statement: "Two", fee_waiver_requested: false }
              as: Applicant
              as_user_id: "${art2}"
          trigger:
            - call: "GET /applications"
              payload: { cycle_id: "${cyc}", limit: 101 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "limit above the maximum is refused: 400 ERR_VALIDATION, with no data array in the response body"
            - "the upper bound itself is legal: limit 100 returns 200 with total_count == 2"
            - "the lower bound is 1, not 0: limit 0 returns 400 ERR_VALIDATION while limit 1 returns 200 with exactly one row and has_more true"
            - "offset has a floor but no ceiling: offset -1 returns 400 ERR_VALIDATION, while offset 99 returns 200 with an empty data array, total_count 2 and has_more false"
            - "the defaults apply when the params are omitted: GET /applications?cycle_id=${cyc} returns 200 with limit 10 and offset 0 semantics - both rows, has_more false"
            - "the rule is shared by every list endpoint, not just this one: limit 101 on GET /cycles, GET /residencies, GET /studios, GET /housing-assignments, GET /stipend-disbursements and GET /obligations each return 400 ERR_VALIDATION"
            - "auth still precedes it: GET /stipend-disbursements?limit=101 as Funder returns 403 ERR_UNAUTHORIZED, since the role check runs above the pagination check"

  # ===================================================================================
  # From Table 7 (RBAC)
  # ===================================================================================
  - section: rbac
    instances:

      - name: studio_configuration_is_exclusive_to_facilities_while_creation_is_shared
        claim_type: exclusive_operations
        grounds: ["rbac.FacilitiesManager.exclusive_operations", "rbac.ProgramAdmin.shared_operations", "errors[ERR_UNAUTHORIZED]", "endpoints[PATCH /studios/{id}]"]
        distinguishing_aspect: "ProgramAdmin is the broadest role and may CREATE a studio, yet PATCH /studios/{id} is the FacilitiesManager's single exclusive operation - so the same principal that created the row cannot reconfigure it. A role table that treats ProgramAdmin as a superuser passes every other RBAC claim and fails this one."
        test_recipe:
          setup: ["One studio S-A created by ProgramAdmin through the shared create endpoint."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { code: "S-A", capability_tags: ["WELDING"], ventilation_class: "LOCAL", max_concurrent_residents: 1, status: "AVAILABLE" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { s_a: "$.data.id", s_a_v0: "$.data.version" }
          trigger:
            - call: "PATCH /studios/${s_a}"
              payload: { max_concurrent_residents: 3 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { err: "$.data.error_id" }
          assert:
            - "the creator cannot reconfigure: 403 ERR_UNAUTHORIZED, with GET /studios/${s_a} still reading max_concurrent_residents 1 and version ${s_a_v0}"
            - "the exclusive holder can: the identical PATCH as FacilitiesManager returns 200 with max_concurrent_residents 3 and version ${s_a_v0} + 1"
            - "the create endpoint really is shared: POST /studios as FacilitiesManager also returns 201, so the split is per-operation and not per-entity"
            - "the other studio operations stay shared: POST /studio-assignments and POST /studio-assignments/{id}/release each return their success code for ProgramAdmin and for FacilitiesManager alike"
            - "roles outside the pair are refused on both: PATCH /studios/${s_a} and POST /studios as FinanceOfficer, VisaCoordinator, Panelist, Applicant or Funder each return 403 ERR_UNAUTHORIZED"
            - "the read side is wider than the write side: GET /studios/${s_a} returns 200 for ProgramAdmin, FacilitiesManager and Funder, while only FacilitiesManager may write the row"
            - "role checking precedes existence: PATCH /studios/{unknown-uuid} as ProgramAdmin returns 403 ERR_UNAUTHORIZED, not 404"

      - name: applicant_shared_operations_are_scoped_to_the_artists_own_rows
        claim_type: shared_operations
        grounds: ["rbac.Applicant.shared_operations", "validations[priority 14]", "errors[ERR_UNAUTHORIZED]", "endpoints[POST /applications/{id}/submit]"]
        distinguishing_aspect: "Applicant holds no exclusive operations at all - every one of its operations is shared with ProgramAdmin - so its whole authorisation surface is OWNERSHIP, enforced by X-User-ID against the row's applicant_id. The same call with the same role and the same payload succeeds or fails purely on which artist is acting, while ProgramAdmin performing it for anyone is unconstrained."
        test_recipe:
          setup: ["An OPEN cycle with a SCULPT discipline and two applicants. Artist A holds a fully submittable DRAFT application (fee WAIVED, one IMAGE item); artist B holds nothing."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art_a: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Kell Osei", email: "kell.osei@example.org",
                         affiliation_org: "Press Room East", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2200000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art_b: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc}", applicant_id: "${art_a}", discipline_id: "${disc}",
                         requested_session_length_weeks: 8, project_statement: "Welded steel forms",
                         fee_waiver_requested: true }
              as: Applicant
              as_user_id: "${art_a}"
              captures: { app_a: "$.data.id", app_a_v: "$.data.version" }
            - call: "POST /applications/${app_a}/fee-resolution"
              payload: { action: "WAIVE", reason: "income below ceiling" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /portfolio-items"
              payload: { application_id: "${app_a}", media_type: "IMAGE", title: "Plate I", file_size_mb: 12.5 }
              as: Applicant
              as_user_id: "${art_a}"
          trigger:
            - call: "POST /applications/${app_a}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${art_b}"
              captures: { err: "$.data.error_id" }
          assert:
            - "the wrong artist is refused even though the application is perfectly submittable: 403 ERR_UNAUTHORIZED, status still 'DRAFT'"
            - "the owner succeeds with the identical call: the same submit as ${art_a} returns 200 with status 'SUBMITTED'"
            - "the operation is genuinely shared, not delegated: ProgramAdmin submitting the same application returns 200 too, because P14 constrains only an ACTING Applicant"
            - "ownership is checked on every Applicant-facing write: POST /portfolio-items against ${app_a} as ${art_b}, DELETE of one of A's portfolio items as ${art_b}, PATCH /applications/${app_a} as ${art_b} and POST /applications/${app_a}/offer-response as ${art_b} each return 403 ERR_UNAUTHORIZED"
            - "profile writes are scoped the same way: PATCH /applicants/${art_a} as ${art_b} returns 403, while PATCH /applicants/${art_b} as ${art_b} returns 200"
            - "the residency leg is scoped by applicant_id too: an Applicant may only WITHDRAW their own residency, so POST /residencies/{id}/lifecycle with action=WITHDRAW as the other artist returns 403, and any other action from an Applicant is refused"
            - "an unresolvable identity fails before ownership: X-User-Role Applicant with an X-User-ID that is not an Applicant row returns 403 ERR_UNAUTHORIZED"
            - "a rejected write leaves the row untouched: Application ${app_a}.version is still ${app_a_v} after all the 403s above"

      - name: a_chair_who_reviewed_in_the_cycle_cannot_lock_its_slate
        claim_type: segregation_of_duties
        grounds: ["validations[priority 59]", "errors[ERR_SEGREGATION_OF_DUTIES]", "state_machines.Cycle[PANEL_REVIEW -> SLATE_LOCKED]", "rbac.PanelChair.exclusive_operations"]
