      - name: duplicate_ballot_same_meeting_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_BALLOT_ALREADY_CAST_IN_CHAIN]"]
        distinguishing_aspect: "One ballot per member per chain: a second cast on the SAME meeting is rejected (the cross-meeting chain case is covered by the §1.8 compensating-invariant instance)."
