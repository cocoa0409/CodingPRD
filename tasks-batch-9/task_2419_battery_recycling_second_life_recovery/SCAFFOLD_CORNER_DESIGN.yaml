      - name: second_identify_chemistry_is_rejected_while_a_second_discharge_is_a_self_loop
        claim_type: idempotency
        grounds:
          - state_machines.Intake.custody_state.RECEIVED_to_IDENTIFIED
          - state_machines.Intake.custody_state.DISCHARGED_to_DISCHARGED
          - errors[ERR_INVALID_CUSTODY_STATE]
        distinguishing_aspect: "Replaying identify-chemistry is refused with ERR_INVALID_CUSTODY_STATE because RECEIVED -> IDENTIFIED is one-shot, whereas replaying discharge is the one declared self-loop and succeeds with a fresh version - so 'same trigger twice' has opposite outcomes in the same dimension."
        test_recipe:
          setup:
            - "Clock 2026-07-10T00:00:00.000Z, one campus, one supplier, one NMC622 intake of net 100.0 kg."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
              as: PlatformAdmin
              captures: { fac_id: "$.data.id" }
            - call: "POST /recycling/suppliers"
              payload: { legal_name: "Northstar Automotive", channel: "AUTOMAKER", credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /recycling/intakes"
              payload: { supplier_id: "${sup_id}", facility_id: "${fac_id}", declared_chemistry: "NMC622", gross_mass_kg: 110.0, packaging_tare_kg: 10.0, declared_ni_pct: 12.0 }
              as: IntakeClerk
              captures: { i_id: "$.data.id" }
            - call: "POST /recycling/intakes/${i_id}/identify-chemistry"
              payload: { identified_chemistry: "NMC622" }
              as: IntakeClerk
              captures: { v2: "$.data.version" }
          trigger:
            - call: "POST /recycling/intakes/${i_id}/identify-chemistry"
              payload: { identified_chemistry: "LFP" }
              as: IntakeClerk
            - call: "POST /recycling/intakes/${i_id}/discharge"
              payload: { soc_pct: 18.0 }
              as: PlantOperator
              captures: { soc1: "$.data.soc_pct", v3: "$.data.version" }
            - call: "POST /recycling/intakes/${i_id}/discharge"
              payload: { soc_pct: 9.0 }
              as: PlantOperator
              captures: { soc2: "$.data.soc_pct", cust: "$.data.custody_state", v4: "$.data.version" }
          assert:
            - "The replayed identify call returns HTTP 409 with data.error_id == ERR_INVALID_CUSTODY_STATE"
            - "Intake.${i_id}.identified_chemistry == NMC622 - the rejected replay did not overwrite it with LFP - and version == ${v2}"
            - "The first discharge returns HTTP 200 with ${soc1} == 18.0 and ${v3} == 3"
            - "The replayed discharge returns HTTP 200 with ${soc2} == 9.0, ${cust} == DISCHARGED and ${v4} == 4 - the self-loop is idempotent in state but not in version or payload"

