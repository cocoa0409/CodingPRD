  # ===========================================================================
  # Section: Errors
  # ===========================================================================
  - section: Errors
    instances:
      - claim_type: Triggerable
        name: unknown_identifier_probes_cover_the_remaining_not_found_codes
        grounds:
          - validations[priority=3]
          - errors.ERR_OPERATOR_NOT_FOUND
          - errors.ERR_MANUFACTURER_NOT_FOUND
          - errors.ERR_CONTRACT_TIER_NOT_FOUND
          - errors.ERR_DC_COVERAGE_NOT_FOUND
          - errors.ERR_SUBSTITUTION_RULE_NOT_FOUND
          - errors.ERR_PRICE_CHANGE_NOTICE_NOT_FOUND
          - errors.ERR_BILL_BACK_CLAIM_NOT_FOUND
          - errors.ERR_BILL_BACK_REMITTANCE_NOT_FOUND
          - errors.ERR_PRICING_DISPUTE_NOT_FOUND
        distinguishing_aspect: |
          Each single-resource read returns its own entity-specific 404 code rather than a
          generic one, on an otherwise empty database, so the nine codes not already
          exercised elsewhere in this design are each shown to be reachable.
        test_recipe:
          setup:
            - "An empty database. No call in this recipe creates anything."
          setup_api_calls: []
          trigger:
            - call: "GET /nac/operators/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SystemAdmin
              captures: { e_op: $.data.error_id }
            - call: "GET /nac/manufacturers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SystemAdmin
              captures: { e_mfg: $.data.error_id }
            - call: "GET /nac/contract-tiers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NationalAccountManager
              captures: { e_tier: $.data.error_id }
            - call: "GET /nac/dc-coverages/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NationalAccountManager
              captures: { e_cov: $.data.error_id }
            - call: "GET /nac/substitution-rules/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NationalAccountManager
              captures: { e_rule: $.data.error_id }
            - call: "GET /nac/price-change-notices/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PricingAnalyst
              captures: { e_notice: $.data.error_id }
            - call: "GET /nac/bill-back-claims/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RebateAccountant
              captures: { e_claim: $.data.error_id }
            - call: "GET /nac/bill-back-remittances/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: RebateAccountant
              captures: { e_rem: $.data.error_id }
            - call: "GET /nac/pricing-disputes/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ContractAuditor
              captures: { e_disp: $.data.error_id }
          assert:
            - "${e_op} == ERR_OPERATOR_NOT_FOUND with HTTP 404"
            - "${e_mfg} == ERR_MANUFACTURER_NOT_FOUND with HTTP 404"
            - "${e_tier} == ERR_CONTRACT_TIER_NOT_FOUND with HTTP 404"
            - "${e_cov} == ERR_DC_COVERAGE_NOT_FOUND with HTTP 404"
            - "${e_rule} == ERR_SUBSTITUTION_RULE_NOT_FOUND with HTTP 404"
            - "${e_notice} == ERR_PRICE_CHANGE_NOTICE_NOT_FOUND with HTTP 404"
            - "${e_claim} == ERR_BILL_BACK_CLAIM_NOT_FOUND with HTTP 404"
            - "${e_rem} == ERR_BILL_BACK_REMITTANCE_NOT_FOUND with HTTP 404"
            - "${e_disp} == ERR_PRICING_DISPUTE_NOT_FOUND with HTTP 404"
            - "every response body carries success false, data null and a non-null error object holding error_id and message"

  # ===========================================================================
  # Section: RBAC
  # ===========================================================================
  - section: RBAC
    instances:
      - claim_type: Exclusive Operation Denial
        name: exclusive_operations_are_denied_to_other_roles
        grounds:
          - roles
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          Each write is bound to exactly the role that declares it: a PricingAnalyst
          cannot create a contract or a tier, a NationalAccountManager cannot create a
          deviation or a product, an OperatorBuyer cannot open a rebate period and a
          ContractAuditor cannot move the clock, and every refusal is ERR_UNAUTHORIZED 403
          rather than a validation error.
        test_recipe:
          setup:
            - "One operator, one manufacturer, one DC, one product and one DRAFT contract exist."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10 lb", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4000, avg_cost_cents: 4000, replacement_cost_cents: 4000 }
              as: SystemAdmin
              captures: { chkn_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id, ct_ver: $.data.version }
          trigger:
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2027", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { e_contract: $.data.error_id }
            - call: "POST /nac/deviation-agreements"
              payload: { contract_id: "${ct_id}", product_id: "${chkn_id}", manufacturer_id: "${mfg_id}", bill_back_basis: "FIXED_NET_PRICE", requested_net_price_cents: 4200, max_operator_price_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", expected_contract_version: "${ct_ver}" }
              as: NationalAccountManager
              as_user_id: "nam-1"
              captures: { e_dev: $.data.error_id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 25.00, min_case_volume: 0 }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { e_tier: $.data.error_id }
            - call: "POST /nac/rebate-periods"
              payload: { contract_id: "${ct_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { e_period: $.data.error_id }
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ContractAuditor
              as_user_id: "auditor-1"
              captures: { e_clock: $.data.error_id }
            - call: "POST /nac/products"
              payload: { sku: "P-BEEF", description: "Beef Chuck 4/10 lb", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4000, avg_cost_cents: 4000, replacement_cost_cents: 4000 }
              as: NationalAccountManager
              as_user_id: "nam-1"
              captures: { e_product: $.data.error_id }
          assert:
            - "${e_contract}, ${e_dev}, ${e_tier}, ${e_period}, ${e_clock} and ${e_product} are all ERR_UNAUTHORIZED with HTTP 403"
            - "the denial precedes every business check: the deviation attempt carried a valid payload and a fresh expected_contract_version yet still returned 403"
            - "GET /nac/contracts returns exactly 1 row and GET /nac/products returns exactly 1 row, so no denied call wrote anything"
            - "the logical clock is still 2026-08-01T00:00:00Z after the denied clock call"

      - claim_type: Exclusive Operation Denial
        name: missing_or_unknown_role_header_is_rejected
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
          - response_envelope
        distinguishing_aspect: |
          Authentication precedes authorization: a request with no X-User-Role header and
          a request naming a role outside the declared seven both return
          ERR_UNAUTHENTICATED 401, not the 403 that a wrong-but-known role would give.
        test_recipe:
          setup:
            - "One operator and one manufacturer exist."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
          trigger:
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: "(no X-User-Role header sent)"
              captures: { e_missing: $.data.error_id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: "Wholesaler"
              captures: { e_unknown: $.data.error_id }
            - call: "GET /nac/contracts"
              payload: { limit: 10, offset: 0 }
              as: "(no X-User-Role header sent)"
              captures: { e_list: $.data.error_id }
          assert:
            - "${e_missing} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${e_unknown} == ERR_UNAUTHENTICATED with HTTP 401, because Wholesaler is not one of the seven declared roles"
            - "${e_list} == ERR_UNAUTHENTICATED with HTTP 401: reads are authenticated too"
            - "each body is success false, data null and error holding error_id and message, and no Contract row exists afterwards"

      - claim_type: Exclusive Operation Denial
        name: entity_backed_buyer_cannot_act_for_another_operator
        grounds:
          - roles.OperatorBuyer
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
          - state_machines.Contract.PENDING_SIGNATURE_to_ACTIVE
        distinguishing_aspect: |
          OperatorBuyer is entity_backed:Operator, so ownership is checked against the
