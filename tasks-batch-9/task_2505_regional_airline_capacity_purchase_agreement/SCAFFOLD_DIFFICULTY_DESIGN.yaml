          assert:
            - "Immediately after the cancel: ScheduleCycle.${cyc}.cancelled_controllable_count == 1, metric_completed_departures == 9, departure_ledger_total == 10, open_leg_count == 0"
            - "After the reinstate: HTTP 200, FlightLeg.${l2}.status == SCHEDULED, reinstate_count == 1, cancel_cause_code == null"
            - "ScheduleCycle.${cyc}.cancelled_controllable_count == 0 and metric_completed_departures == 10 — exactly the pre-cancel values"
            - "ScheduleCycle.${cyc}.departure_ledger_total == 10 at every observation, equal to published_departures both before, between and after the two calls"
            - "ScheduleCycle.${cyc}.open_leg_count == 1"
