              payload: { grower_id: "${g}", season: "2026", ticket_number: "T-1", module_tag: "MT-RB", gross_weight_lbs: 11000, tare_weight_lbs: 1000, moisture_pct: 8.0, foreign_matter_pct: 4.0 }
              as: GinOperator
              captures: { m: $.data.id }
            - call: "POST /gin-ops/modules/${m}/queue"
              payload: { gin_shift_id: "${s}" }
              as: GinOperator
            - call: "POST /gin-ops/modules/${m}/start-ginning"
