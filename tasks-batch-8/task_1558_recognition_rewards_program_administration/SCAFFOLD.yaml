  # --- AccrualRun ---
  - method: POST
    path: "/api/accrual-runs"
    description: "Create and execute the monthly accrual + chargeback run for a program; computes department_breakdown with the configured accrual variant and pinned per-line chargeback rounding"
    roles: [FinanceAdmin]
    code: 201
    input: [program_id, period_year, period_month]
    output: AccrualRun
    side_effects: ["status=OPEN", "department_breakdown computed (accrual_cents per variant; net_chargeback_cents per chargeback_calculation)", "ERR_DUPLICATE_ACCRUAL_RUN when a non-VOIDED run exists for (program, year, month)"]

  - method: GET
    path: "/api/accrual-runs/{accrualRunId}"
    description: "Get an accrual run"
    roles: [HRAdmin, FinanceAdmin, PayrollSpecialist, Manager, Employee, VendorOps]
    code: 200
    input: []
    output: AccrualRun
    side_effects: []

  - method: GET
    path: "/api/accrual-runs"
    description: "List accrual runs with filters"
    roles: [HRAdmin, FinanceAdmin, PayrollSpecialist, Manager, Employee, VendorOps]
    code: 200
    input: ["program_id?", "period_year?", "status?"]
    output: "AccrualRun[]"
    side_effects: []

  - method: POST
    path: "/api/accrual-runs/{accrualRunId}/reconcile"
    description: "Recompute the period's net chargeback and reconcile; variance must be 0"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: AccrualRun
    side_effects: ["status OPEN -> RECONCILED when variance_cents == 0", "ERR_ACCRUAL_VARIANCE when recomputation differs (e.g. a late-settling order landed in the period after run creation)", "increments AccrualRun.version by 1"]

  - method: POST
    path: "/api/accrual-runs/{accrualRunId}/close"
    description: "Close a RECONCILED run; the period then counts toward the tax-year finalization gate"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: AccrualRun
    side_effects: ["status -> CLOSED", "increments AccrualRun.version by 1"]

  - method: POST
    path: "/api/accrual-runs/{accrualRunId}/void"
    description: "Void an OPEN run (e.g. after a variance failure) so a corrected run can be created"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: AccrualRun
    side_effects: ["status -> VOIDED", "increments AccrualRun.version by 1"]

