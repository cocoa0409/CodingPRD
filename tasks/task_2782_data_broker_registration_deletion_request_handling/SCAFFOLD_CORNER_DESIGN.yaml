# =============================================================================
# §1.9 Scaffold Corner Design — task 2782
# Data Broker Registration & Deletion Request Handling
#
# Breadth probe over SCAFFOLD.yaml's §1.1-§1.7 surface. Section names and
# claim_type values are taken from references/claim-extraction-guide.md; no
# categories are invented here. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs naming the
# covering §1.8 instance.
#
# Every recipe drives an empty database with the clock pinned at
# 2026-09-01T00:00:00Z unless the corner is explicitly time-gated.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: broker_creation_initialises_ledger_counters_and_delinquent_standing
        claim_type: creation
        grounds:
          - endpoints.POST_brokers
          - entities.DataBroker.fields.registry_standing
          - entities.DataBroker.fields.delinquent_since
          - entities.DataBroker.fields.fee_credit_cents
          - calculations.registry_standing_derivation
        distinguishing_aspect: >
          A brand-new DataBroker must come back with every cents counter and every request
          counter at 0, version 1, registry_standing DELINQUENT and delinquent_since equal to the
          clock instant — never COMPLIANT, because it holds no ACCEPTED filing yet.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /brokers"
              payload: { legal_name: "Fernhollow Data Services", primary_contact_email: "office@fernhollow.example", home_state_code: "CA", operating_state_codes: ["CA", "TX"], business_description: "Assembles consumer contact and lifestyle attributes for regional marketing agencies." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
          assert:
            - "the response returns HTTP 201 with response_type == object"
            - "DataBroker.${broker_id}.version == 1"
            - "DataBroker.${broker_id}.registry_standing == DELINQUENT"
            - "DataBroker.${broker_id}.delinquent_since == 2026-09-01T00:00:00Z"
            - "DataBroker.${broker_id}.fee_deposited_cents == 0"
            - "DataBroker.${broker_id}.fee_paid_cents == 0"
            - "DataBroker.${broker_id}.fee_credit_cents == 0"
            - "DataBroker.${broker_id}.open_breach_count == 0"
            - "DataBroker.${broker_id}.request_intake_total == 0"
            - "DataBroker.${broker_id}.request_open_count == 0"
            - "DataBroker.${broker_id}.operating_state_codes == [CA, TX]"

      - name: broker_retrieval_returns_the_stored_projection_unchanged
        claim_type: retrieval
        grounds:
          - endpoints.GET_brokers_id
          - entities.DataBroker.fields.legal_name
        distinguishing_aspect: >
          A read-only GET must return the same field values the create response carried and must
          not advance version or re-derive registry_standing.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z and one DataBroker operating in CA and TX, created but otherwise untouched."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Fernhollow Data Services", primary_contact_email: "office@fernhollow.example", home_state_code: "CA", operating_state_codes: ["CA", "TX"], business_description: "Assembles consumer contact and lifestyle attributes for regional marketing agencies." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
          trigger:
            - call: "GET /brokers/${broker_id}"
              payload: {}
              as: Regulator
              as_user_id: "regulator-ca"
          assert:
            - "the response returns HTTP 200"
            - "DataBroker.${broker_id}.legal_name == Fernhollow Data Services"
            - "DataBroker.${broker_id}.home_state_code == CA"
            - "DataBroker.${broker_id}.version == 1"
            - "DataBroker.${broker_id}.registry_standing == DELINQUENT"

      - name: consumer_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_consumers
          - response_envelope.pagination_fields
        distinguishing_aspect: >
          With three consumers stored and limit 2, the first page must carry exactly 2 items,
          total_count 3 and has_more true; offset 2 must carry 1 item and has_more false.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, one DataBroker, and exactly three Consumers of that broker with distinct identity hashes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Fernhollow Data Services", primary_contact_email: "office@fernhollow.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Assembles consumer contact and lifestyle attributes for regional marketing agencies." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:page0001", state_code: "CA", source_label: "AGENCY_FEED_A", derived_profile_count: 0 }
              as: IntakeAgent
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:page0002", state_code: "CA", source_label: "AGENCY_FEED_A", derived_profile_count: 0 }
              as: IntakeAgent
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:page0003", state_code: "CA", source_label: "AGENCY_FEED_A", derived_profile_count: 0 }
              as: IntakeAgent
          trigger:
            - call: "GET /consumers"
              payload: { broker_id: "${broker_id}", limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /consumers"
              payload: { broker_id: "${broker_id}", limit: 2, offset: 2 }
              as: PlatformAdmin
          assert:
            - "the first page returns HTTP 200 with response_type == array and exactly 2 items in data"
            - "the first page reports total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the second page carries exactly 1 item and reports total_count == 3, offset == 2 and has_more == false"

      - name: unknown_ids_return_the_entity_specific_not_found_error
        claim_type: not_found
        grounds:
          - validations.priority_5.ERR_BROKER_NOT_FOUND
          - validations.priority_6.ERR_REGISTRATION_NOT_FOUND
          - validations.priority_7.ERR_CONSUMER_NOT_FOUND
          - validations.priority_8.ERR_DELETION_REQUEST_NOT_FOUND
          - validations.priority_9.ERR_PROPAGATION_TASK_NOT_FOUND
          - validations.priority_10.ERR_RECIPIENT_NOT_FOUND
          - validations.priority_11.ERR_SUPPRESSION_ENTRY_NOT_FOUND
          - validations.priority_12.ERR_INQUIRY_NOT_FOUND
        distinguishing_aspect: >
          Each of the eight addressable entity families must answer an unknown UUID with its own
          error_id at HTTP 404 — a shared generic ERR_NOT_FOUND, or a 404 with the wrong family's
          code, fails eight distinct assertions.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-09-01T00:00:00Z; no entity of any family exists, so the UUID 00000000-0000-4000-8000-000000000999 resolves to nothing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /brokers/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: PlatformAdmin
              expect_error: { error_id: ERR_BROKER_NOT_FOUND, http_status: 404 }
            - call: "GET /registrations/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: PlatformAdmin
              expect_error: { error_id: ERR_REGISTRATION_NOT_FOUND, http_status: 404 }
            - call: "GET /consumers/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: PlatformAdmin
              expect_error: { error_id: ERR_CONSUMER_NOT_FOUND, http_status: 404 }
            - call: "GET /deletion-requests/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: PlatformAdmin
              expect_error: { error_id: ERR_DELETION_REQUEST_NOT_FOUND, http_status: 404 }
            - call: "GET /propagation-tasks/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: PlatformAdmin
              expect_error: { error_id: ERR_PROPAGATION_TASK_NOT_FOUND, http_status: 404 }
            - call: "GET /downstream-recipients/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: PlatformAdmin
              expect_error: { error_id: ERR_RECIPIENT_NOT_FOUND, http_status: 404 }
            - call: "GET /suppression-entries/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: PlatformAdmin
              expect_error: { error_id: ERR_SUPPRESSION_ENTRY_NOT_FOUND, http_status: 404 }
            - call: "GET /regulator-inquiries/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: PlatformAdmin
              expect_error: { error_id: ERR_INQUIRY_NOT_FOUND, http_status: 404 }
          assert:
            - "every one of the eight responses returns HTTP 404 with response_type == error"
            - "the /brokers response carries data.error_id == ERR_BROKER_NOT_FOUND"
            - "the /registrations response carries data.error_id == ERR_REGISTRATION_NOT_FOUND"
            - "the /consumers response carries data.error_id == ERR_CONSUMER_NOT_FOUND"
            - "the /deletion-requests response carries data.error_id == ERR_DELETION_REQUEST_NOT_FOUND"
            - "the /propagation-tasks response carries data.error_id == ERR_PROPAGATION_TASK_NOT_FOUND"
            - "the /downstream-recipients response carries data.error_id == ERR_RECIPIENT_NOT_FOUND"
            - "the /suppression-entries response carries data.error_id == ERR_SUPPRESSION_ENTRY_NOT_FOUND"
            - "the /regulator-inquiries response carries data.error_id == ERR_INQUIRY_NOT_FOUND"

      - name: registration_create_without_state_code_rejected_as_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_15.ERR_INVALID_REQUEST
          - endpoints.POST_registrations
        distinguishing_aspect: >
          state_code has source input and no default, so omitting it must produce
          ERR_INVALID_REQUEST at HTTP 400 before any coverage-period or fee rule is consulted,
          and no Registration row may be created.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z and one DataBroker operating in CA with 500000 cents of credit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Fernhollow Data Services", primary_contact_email: "office@fernhollow.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Assembles consumer contact and lifestyle attributes for regional marketing agencies." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokers/${broker_id}/fee-deposits"
              payload: { amount_cents: 500000 }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              captures: { broker_v1: $.data.version }
          trigger:
            - call: "POST /registrations"
              payload: { broker_id: "${broker_id}", coverage_period_start: "2026-09-01T00:00:00Z", coverage_period_end: "2027-03-01T00:00:00Z", business_description: "California registry filing with the state code deliberately omitted.", expected_broker_version: "${broker_v1}" }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
              expect_error: { error_id: ERR_INVALID_REQUEST, http_status: 400 }
          assert:
            - "the response carries data.error_id == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /registrations?broker_id=${broker_id} reports total_count == 0"
            - "DataBroker.${broker_id}.version == 2"

      - name: broker_create_with_a_non_two_letter_state_code_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_15.ERR_INVALID_REQUEST
          - entities.DataBroker.fields.home_state_code
        distinguishing_aspect: >
          home_state_code is constrained to a 2-uppercase-letter code, so the spelled-out value
          "California" must be refused with ERR_INVALID_REQUEST at HTTP 400 rather than stored.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /brokers"
              payload: { legal_name: "Fernhollow Data Services", primary_contact_email: "office@fernhollow.example", home_state_code: "California", operating_state_codes: ["California"], business_description: "Assembles consumer contact and lifestyle attributes for regional marketing agencies." }
              as: PlatformAdmin
              expect_error: { error_id: ERR_INVALID_REQUEST, http_status: 400 }
          assert:
            - "the response carries data.error_id == ERR_INVALID_REQUEST with HTTP 400"
            - "no DataBroker row is created"

      - name: deletion_request_requested_scope_defaults_to_delete_all
        claim_type: defaults
        grounds:
          - endpoints.POST_deletion_requests
          - entities.DeletionRequest.fields.requested_scope
          - entities.DeletionRequest.fields.status
        distinguishing_aspect: >
          requested_scope is optional with default DELETE_ALL, so omitting it must store
          DELETE_ALL — not null and not the narrower DELETE_SENSITIVE_ONLY scope — and the request
          must land in its initial state RECEIVED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, one DataBroker, and one CA Consumer of that broker at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Fernhollow Data Services", primary_contact_email: "office@fernhollow.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Assembles consumer contact and lifestyle attributes for regional marketing agencies." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:default0001", state_code: "CA", source_label: "AGENCY_FEED_A", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { consumer_id: $.data.id, consumer_v1: $.data.version }
          trigger:
            - call: "POST /deletion-requests"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_id}", intake_channel: "EMAIL", expected_consumer_version: "${consumer_v1}" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
          assert:
            - "the response returns HTTP 201"
            - "DeletionRequest.${req_id}.requested_scope == DELETE_ALL"
            - "DeletionRequest.${req_id}.status == RECEIVED"
            - "DeletionRequest.${req_id}.attempt_count == 0"
            - "DeletionRequest.${req_id}.identity_assurance_score == 0.00"
            - "DataBroker.${broker_id}.request_intake_total == 1"
            - "DataBroker.${broker_id}.request_open_count == 1"

      - name: suppression_entry_window_defaults_to_the_clock_and_seven_hundred_thirty_days
        claim_type: defaults
        grounds:
          - endpoints.POST_suppression_entries
          - calculations.temporal_default_derivation.constants.SUPPRESSION_DEFAULT_DAYS
          - entities.SuppressionEntry.fields.window_end
        distinguishing_aspect: >
          Omitting both window fields must yield window_start equal to the clock instant
          (2026-09-01) and window_end exactly 730 days later (2028-08-31), a span that crosses the
          2028 leap day — a naive two-calendar-year offset lands on 2028-09-01 and fails.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, one DataBroker, one CA Consumer, and one DeletionRequest of that consumer in RECEIVED to serve as the originating request."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Fernhollow Data Services", primary_contact_email: "office@fernhollow.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Assembles consumer contact and lifestyle attributes for regional marketing agencies." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:default0002", state_code: "CA", source_label: "AGENCY_FEED_A", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { consumer_id: $.data.id, consumer_v1: $.data.version }
            - call: "POST /deletion-requests"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_id}", intake_channel: "EMAIL", requested_scope: "DELETE_ALL", expected_consumer_version: "${consumer_v1}" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /suppression-entries"
              payload: { broker_id: "${broker_id}", consumer_id: "${consumer_id}", originating_request_id: "${req_id}", source_scope: "ALL_SOURCES" }
              as: PrivacyReviewer
              as_user_id: "reviewer-alpha"
              captures: { supp_id: $.data.id }
          assert:
            - "the response returns HTTP 201"
            - "SuppressionEntry.${supp_id}.window_start == 2026-09-01T00:00:00Z"
            - "SuppressionEntry.${supp_id}.window_end == 2028-08-31T00:00:00Z"
            - "SuppressionEntry.${supp_id}.status == ACTIVE"
            - "SuppressionEntry.${supp_id}.blocked_recollection_count == 0"
            - "SuppressionEntry.${supp_id}.lift_justification == null"

      - name: consumer_system_fields_are_server_generated_and_client_values_ignored
        claim_type: system_fields
        grounds:
          - entities.Consumer.fields.collection_status
          - entities.Consumer.fields.consent_status
          - entities.Consumer.fields.collection_event_count
          - endpoints.POST_consumers
        distinguishing_aspect: >
          A Consumer created with no sensitive categories must be stamped version 1, created_at
          equal to the clock instant, collection_status ACTIVE, consent_status NOT_REQUIRED and
          collection_event_count 1 from the creating collection event — none of which the client
          supplies.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z and one DataBroker operating in CA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Fernhollow Data Services", primary_contact_email: "office@fernhollow.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Assembles consumer contact and lifestyle attributes for regional marketing agencies." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
          trigger:
            - call: "POST /consumers"
              payload: { broker_id: "${broker_id}", identity_hash: "sha256:system0001", state_code: "CA", source_label: "AGENCY_FEED_A", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { consumer_id: $.data.id }
          assert:
            - "the response returns HTTP 201"
            - "Consumer.${consumer_id}.version == 1"
            - "Consumer.${consumer_id}.created_at == 2026-09-01T00:00:00Z"
            - "Consumer.${consumer_id}.collection_status == ACTIVE"
            - "Consumer.${consumer_id}.consent_status == NOT_REQUIRED"
            - "Consumer.${consumer_id}.collection_event_count == 1"
            - "Consumer.${consumer_id}.opt_out_sale == false"
            - "Consumer.${consumer_id}.opt_out_sharing == false"
            - "Consumer.${consumer_id}.last_purged_at == null"

      - name: audit_events_are_append_only_and_carry_no_version_field
        claim_type: immutability
        grounds:
          - entities.AuditEvent.common_fields_false
          - entities.AuditEvent.fields.sequence_no
          - entities.AuditEvent.fields.retention_expires_at
          - calculations.temporal_default_derivation.constants.AUDIT_RETENTION_DAYS
          - endpoints.GET_brokers_id_audit_events
        distinguishing_aspect: >
          AuditEvent is declared common_fields false, so §1.5 exposes no create, update or delete
          route for it and its rows carry no version field; the first event of a broker must be
          BROKER_REGISTERED at sequence_no 1 with retention_expires_at 2555 days out (2033-08-30).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z and one freshly created DataBroker, whose creation appended its first AuditEvent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Fernhollow Data Services", primary_contact_email: "office@fernhollow.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Assembles consumer contact and lifestyle attributes for regional marketing agencies." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
          trigger:
            - call: "GET /brokers/${broker_id}/audit-events"
              payload: { event_type: "BROKER_REGISTERED" }
              as: Regulator
              as_user_id: "regulator-ca"
              captures: { ae_id: "$.data[0].id" }
          assert:
            - "the response returns HTTP 200 and reports total_count == 1"
            - "AuditEvent.${ae_id}.event_type == BROKER_REGISTERED"
            - "AuditEvent.${ae_id}.sequence_no == 1"
            - "AuditEvent.${ae_id}.subject_kind == BROKER"
            - "AuditEvent.${ae_id}.subject_id == ${broker_id}"
            - "AuditEvent.${ae_id}.broker_id == ${broker_id}"
            - "AuditEvent.${ae_id}.retention_expires_at == 2033-08-30T00:00:00Z"
            - "the returned AuditEvent object exposes no version field, and §1.5 declares no POST, PATCH or DELETE route addressing an audit event"

      - name: deletion_request_referencing_another_brokers_consumer_rejected
        claim_type: parent_relationships
        grounds:
          - validations.priority_14.ERR_CROSS_BROKER_REFERENCE
          - entities.DeletionRequest.fields.consumer_id
          - complexity_profile.entity_topology_flat
        distinguishing_aspect: >
          Both the broker_id and the consumer_id resolve to existing rows, so no 404 applies; the
          request must still be refused with ERR_CROSS_BROKER_REFERENCE at HTTP 422 because the
          consumer belongs to the other broker. Tenant integrity is checked after existence but
          before any state rule.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z and two unrelated DataBrokers, Alpha and Beta."
            - "One CA Consumer belongs to Beta; Alpha has no consumers at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Alpha Attribute Works", primary_contact_email: "office@alpha.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Builds purchase propensity attributes for national retail advertising buyers." }
              as: PlatformAdmin
              captures: { alpha_id: $.data.id }
            - call: "POST /brokers"
              payload: { legal_name: "Beta Household Index", primary_contact_email: "office@beta.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Publishes household composition indices licensed to insurance marketing partners." }
              as: PlatformAdmin
              captures: { beta_id: $.data.id }
            - call: "POST /consumers"
              payload: { broker_id: "${beta_id}", identity_hash: "sha256:cross0001", state_code: "CA", source_label: "BETA_FEED", derived_profile_count: 0 }
              as: IntakeAgent
              captures: { beta_consumer_id: $.data.id, beta_consumer_v1: $.data.version }
          trigger:
            - call: "POST /deletion-requests"
              payload: { broker_id: "${alpha_id}", consumer_id: "${beta_consumer_id}", intake_channel: "EMAIL", requested_scope: "DELETE_ALL", expected_consumer_version: "${beta_consumer_v1}" }
              as: IntakeAgent
              expect_error: { error_id: ERR_CROSS_BROKER_REFERENCE, http_status: 422 }
          assert:
            - "the response carries data.error_id == ERR_CROSS_BROKER_REFERENCE with HTTP 422"
            - "GET /deletion-requests?broker_id=${alpha_id} reports total_count == 0"
