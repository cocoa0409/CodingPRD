      - name: unauthenticated_requests_are_refused_before_any_role_check
        claim_type: Role boundary
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - rbac[*].identity
        distinguishing_aspect: >
          Priority 1 fires on the headers alone: a missing X-User-Role, a missing X-User-ID and a role
          string outside the six declared roles all answer 401 ERR_UNAUTHENTICATED — never 403 — even on a
          read endpoint that every declared role may call, and even when the path id does not exist (401
          precedes the 404).
        test_recipe:
          setup:
            - "Any existing production lot L-RB05 plus one id that resolves to nothing."
          trigger:
            - "GET /production-lots/{L-RB05 id} with the X-User-Role header omitted entirely."
            - "GET /production-lots/{L-RB05 id} with X-User-Role: QualityInspector but no X-User-ID header."
            - "GET /production-lots/{L-RB05 id} with X-User-Role: Auditor and X-User-ID: aud-1 — a role outside the declared six."
            - "POST /production-lots/{unknown uuid}/hold with both headers omitted."
          assert:
            - "All four requests return 401 with error_id ERR_UNAUTHENTICATED"
            - "The Auditor request is 401, not 403 ERR_ROLE_NOT_PERMITTED — an undeclared role fails authentication, not authorisation"
            - "The unknown-uuid request is 401, not 404 ERR_PRODUCTION_LOT_NOT_FOUND — priority 1 precedes priority 4"
            - "No entity version changes and no lot is placed on hold"

      - name: same_inspector_cannot_sign_the_certificate_for_its_own_test
        claim_type: Segregation of duties
        excluded_because:
          difficulty_instance: segregation_of_duties_error_precedes_risk_ceiling_error_at_issue
          rationale: >
            The §1.8 instance already drives ERR_SEGREGATION_OF_DUTIES at issue with the acting X-User-ID
            equal to LotTest.performed_by_user_id and pins its precedence over the priority 16 risk
            ceiling, which subsumes the plain role-identity corner.

  - section: complexity_layers
    instances:
      - name: stale_wire_lot_version_is_refused_before_the_press_window_check
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[production-lot-create-stale-wire-lot]
          - validations[priority=7, error_id=ERR_STALE_WIRE_LOT_VERSION]
          - validations[priority=15, error_id=ERR_TOOL_WINDOW_CONFLICT]
        distinguishing_aspect: >
          Opening the first lot bumps the wire lot to version 3, so the second lot presenting the version
          it read before that (2) is refused with 412 ERR_STALE_WIRE_LOT_VERSION even though its press
          window also overlaps — the OCC check at priority 7 runs before the temporal check at priority 15,
          and the refusal leaves the wire ledger and the version untouched so the same value succeeds once
          refreshed and the window is moved.
        test_recipe:
          setup:
            - "Verified heat, wire lot W-1 released (version 2, available 500.000 kg), die DIE-4S-001 mounted on PRESS-3, part NP-M8-088 with blank 20.0 g."
