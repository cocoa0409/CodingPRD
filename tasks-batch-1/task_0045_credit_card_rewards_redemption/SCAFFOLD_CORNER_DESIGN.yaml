scaffold_corner_design:
  # =====================================================================
  # Entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_card_product_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.CardProduct, endpoints]
        distinguishing_aspect: "POST /products with all required fields returns 201 and echoes name, base_earn_rate_bps, status ACTIVE, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 10000, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "HTTP 201"
            - "CardProduct.${prod_id}.status == ACTIVE and CardProduct.${prod_id}.version == 1 and CardProduct.${prod_id}.base_earn_rate_bps == 100"

      - name: get_account_returns_stored_and_computed_fields
        claim_type: Retrieval
        grounds: [entities.CardAccount, endpoints]
        distinguishing_aspect: "GET /accounts/{id} returns the account with computed points_balance, pending_points, current_tier_index defaults at open."
        test_recipe:
          setup: ["A freshly created PENDING account."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "CardAccount.${acct_id}.status == PENDING"
            - "CardAccount.${acct_id}.points_balance == 0 and CardAccount.${acct_id}.pending_points == 0 and CardAccount.${acct_id}.current_tier_index == 0"

      - name: list_products_paginated_envelope
        claim_type: Listing
        grounds: [entities.CardProduct, endpoints]
        distinguishing_aspect: "GET /products returns response_type array with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Two products created."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "P1", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "P2", base_earn_rate_bps: 200, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
          trigger:
            - call: "GET /products?limit=1&offset=0"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response_type == array, meta.total_count == 2, meta.has_more == true, data length == 1"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.CardAccount, 'errors[ERR_RESOURCE_NOT_FOUND]']
        distinguishing_aspect: "GET /accounts with a non-existent UUID returns ERR_RESOURCE_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404, error_id == ERR_RESOURCE_NOT_FOUND"

      - name: create_transaction_missing_amount_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Transaction.fields.amount_cents, 'errors[ERR_INVALID_REQUEST]', 'validations[priority=5]']
        distinguishing_aspect: "POST /transactions omitting required amount_cents returns ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["ACTIVE account."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400, error_id == ERR_INVALID_REQUEST"

      - name: product_status_defaults_active
        claim_type: Defaults
        grounds: [entities.CardProduct.fields.status]
        distinguishing_aspect: "Omitting status on product create yields the default ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { st: $.data.status }
          assert:
            - "data.status == ACTIVE"

      - name: account_id_and_opened_at_system_minted_input_ignored
        claim_type: System Fields
        grounds: [entities.CardAccount.fields.opened_at]
        distinguishing_aspect: "id and opened_at are server-minted; client cannot set them — opened_at equals the clock at create regardless of any client value."
        test_recipe:
          setup: ["Clock fixed at 2026-07-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id, opened: $.data.opened_at }
          assert:
            - "data.opened_at == 2026-07-01T00:00:00.000Z (server clock) and data.id is a UUID without type prefix"

      - name: transaction_invalid_enum_category_handled
        claim_type: Type Constraints
        grounds: [entities.Transaction.fields.category_code, 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "A category_code that matches no CashbackCategory/QuarterlyCategory still earns base rate (free-text MCC, not an enum); negative-amount (amount_cents <= 0) is rejected ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["ACTIVE account."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 0, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400, error_id == ERR_INVALID_REQUEST (amount_cents must be >= 1)"

      - name: points_lot_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.PointsLot]
        distinguishing_aspect: "PointsLot has common_fields:false — only id and created_at; no version field, no PUT/PATCH endpoint; mutated only via cascade side-effects."
        test_recipe:
          setup: ["ACTIVE account with one POSTED txn that minted an EARN lot."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 100000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/post"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "GET /points-lots?card_account_id=${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Exactly one PointsLot with lot_type == EARN, original_points == 1000, status == ACTIVE; the lot exposes id and created_at but no version field"

      - name: create_account_under_nonexistent_product_404
        claim_type: Parent Relationships
        grounds: [entities.CardAccount.fields.card_product_id, 'errors[ERR_RESOURCE_NOT_FOUND]']
        distinguishing_aspect: "Opening an account whose card_product_id references no product returns ERR_RESOURCE_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB (no product)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /accounts"
              payload: { card_product_id: "00000000-0000-4000-8000-000000000000", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404, error_id == ERR_RESOURCE_NOT_FOUND"

      - name: open_account_under_retired_product_rejected
        claim_type: Type Constraints
        grounds: [entities.CardProduct.fields.status, 'errors[ERR_CROSS_PRODUCT_MISMATCH]', 'validations[priority=8]']
        distinguishing_aspect: "Opening an account under a RETIRED product is rejected with ERR_CROSS_PRODUCT_MISMATCH (product must be ACTIVE at open)."
        test_recipe:
          setup: ["A product that has been retired."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Old Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/retire"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422, error_id == ERR_CROSS_PRODUCT_MISMATCH"

  # =====================================================================
  # State Machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: account_initial_state_is_pending
        claim_type: Initial State
        grounds: [state_machines.CardAccount, entities.CardAccount.fields.status]
        distinguishing_aspect: "A newly created account starts in PENDING and cannot accept transactions until activated."
        test_recipe:
          setup: ["A product exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { st: $.data.status }
          assert:
            - "data.status == PENDING"

      - name: transaction_on_pending_account_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Transaction, 'validations[priority=7]', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Recording a transaction against a PENDING (not yet ACTIVE) account is rejected with ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A PENDING (un-activated) account."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 100000, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 5000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_INVALID_STATE"

      - name: decline_already_posted_transaction_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Transaction.PENDING_to_DECLINED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Declining a transaction already POSTED (not PENDING) is rejected with ERR_INVALID_STATE 409; no side effects fire."
        test_recipe:
          setup: ["A POSTED transaction."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 50000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/post"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/decline"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_INVALID_STATE"
            - "Transaction.${txn_id}.status remains POSTED"

      - name: refunded_transaction_is_terminal
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Transaction, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "From terminal REFUNDED, no further transition (re-refund) is possible; returns ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A REFUNDED transaction."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 50000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions/${txn_id}/refund"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /transactions/${txn_id}/refund"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409, error_id == ERR_INVALID_STATE"

      - name: confirm_redemption_twice_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.Redemption.PENDING_to_CONFIRMED, 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Confirming an already CONFIRMED redemption a second time is rejected with ERR_INVALID_STATE 409; points not double-consumed."
        test_recipe:
          setup: ["A CONFIRMED redemption of 200 points on an account with balance 1000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 100000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/post"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { v1: $.data.version }
            - call: "POST /redemptions"
              payload: { card_account_id: "${acct_id}", redemption_type: "STATEMENT_CREDIT", points_requested: 200, expected_card_account_version: "${v1}" }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { red_id: $.data.id }
            - call: "POST /redemptions/${red_id}/confirm"
              payload: {}
              as: RewardsOps
          trigger:
            - call: "POST /redemptions/${red_id}/confirm"
              payload: {}
              as: RewardsOps
              captures: { err: $.data.error_id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "HTTP 409, error_id == ERR_INVALID_STATE"
            - "CardAccount.${acct_id}.points_balance == 800 (consumed exactly once)"

      - name: close_account_cascades_lot_forfeiture
        claim_type: Cascade down
        grounds: [state_machines.CardAccount.ACTIVE_to_CLOSED, entities.PointsLot.fields.status, calculations.points_conservation]
        distinguishing_aspect: "Closing an ACTIVE account forfeits unredeemed points: all ACTIVE lots -> EXPIRED, points_balance -> 0."
        test_recipe:
          setup: ["ACTIVE account with points_balance 1000 from one POSTED txn."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /products"
              payload: { name: "Cash Visa", base_earn_rate_bps: 100, signup_bonus_points: 0, signup_bonus_spend_threshold_cents: 999999, signup_bonus_window_days: 90, tier_thresholds: [], points_expiry_months: 24 }
              as: ProgramAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /accounts"
              payload: { card_product_id: "${prod_id}", cardholder_name: "Ada" }
              as: ProgramAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /transactions"
              payload: { card_account_id: "${acct_id}", amount_cents: 100000, category_code: "OTHER", transacted_at: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/post"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /accounts/${acct_id}/close"
              payload: {}
              as: ProgramAdmin
            - call: "GET /points-lots?card_account_id=${acct_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "CardAccount.${acct_id}.status == CLOSED and CardAccount.${acct_id}.points_balance == 0"
            - "The account's EARN PointsLot has status == EXPIRED"

