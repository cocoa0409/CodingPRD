        claim_type: violation_to_error
        grounds: ["errors[ERR_VENDOR_NOT_ASSIGNED]", "validations[priority=5]"]
        distinguishing_aspect: "A Vendor role whose X-User-ID is a DIFFERENT vendor than the assignment's vendor_id is rejected 403 ERR_VENDOR_NOT_ASSIGNED (ownership check after existence, before state)."
