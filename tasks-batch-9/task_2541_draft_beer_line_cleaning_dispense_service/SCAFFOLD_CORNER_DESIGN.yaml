            - "${count_after_reopen} == 2"
            - "QualityComplaint.${cmp1}.diagnostic_round == 0 and .reported_at == 2026-08-10T09:00:00Z (frozen across the reopen)"

      - name: corner_disputing_a_signature_reverses_every_side_effect
        claim_type: Compensation
        grounds:
          - state_machines.ServiceVisit.verification_status.SIGNED_to_DISPUTED
          - state_machines.BrewerProgram.EXHAUSTED_to_ACTIVE
        excluded_because:
          difficulty_instance: compensating_invariant / disputing_a_signature_rewinds_the_exhausted_program_and_both_accounts_billing_modes
          rationale: "Asserted end-to-end by the named §1.8 instance: the DISPUTE reverses the ledger, revives the EXHAUSTED program and restores both accounts' billing_mode with no drift."

      - name: corner_voiding_a_cycle_reverses_its_lot_and_projection_side_effects
        claim_type: Compensation
        grounds:
          - state_machines.CleaningCycle.POSTED_to_VOIDED
          - state_machines.ChemicalLot.DEPLETED_to_AVAILABLE
          - calculations.line_compliance_projection
        excluded_because:
          difficulty_instance: compensating_invariant / voiding_the_newest_cycle_restores_lot_volume_and_replays_the_lines_due_projection
          rationale: "Asserted end-to-end by the named §1.8 instance, including the DEPLETED -> AVAILABLE revival and the replayed next_due_at / days_overdue projection."

      - name: corner_failed_cycle_cascade_only_fires_on_a_non_pass_result
        claim_type: Conditional cascade
        grounds:
          - state_machines.BeerLine.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.ServiceAccount.ACTIVE_to_SUSPENDED
          - state_machines.ServiceVisit.work_status.SCHEDULED_to_ABANDONED
        excluded_because:
          difficulty_instance: transitive_cascade / failed_cycle_takes_line_out_then_suspends_account_contract_and_abandons_scheduled_visit
          rationale: "The named §1.8 instance drives the whole conditional chain (compliance_result != PASS -> line out -> threshold -> account SUSPENDED -> contract SUSPENDED -> visit ABANDONED) and asserts each hop."

      - name: corner_contract_activation_is_guarded_by_its_brewer_programs_state
        claim_type: guarded transitions
        grounds:
          - state_machines.ServiceContract.DRAFT_to_ACTIVE
          - state_machines.BrewerProgram.ACTIVE_to_ENDED
          - validations[26].ERR_PROGRAM_NOT_ACTIVE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / contract_activation_blocked_because_its_brewer_program_was_ended
          rationale: "The cross-entity guard on DRAFT_to_ACTIVE is the whole subject of the named §1.8 instance."

      - name: corner_complaint_loops_between_diagnosing_and_awaiting_parts
        claim_type: cyclic
        grounds:
          - state_machines.QualityComplaint.DIAGNOSING_to_AWAITING_PARTS
          - state_machines.QualityComplaint.AWAITING_PARTS_to_DIAGNOSING
          - validations[49].ERR_DIAGNOSTIC_ROUNDS_EXHAUSTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / complaint_alternates_diagnosing_and_awaiting_parts_until_round_cap_then_reopens
          rationale: "The loop, its MAX_DIAGNOSTIC_ROUNDS termination condition and the reopen-driven counter reset are all asserted by the named §1.8 instance."

  # ===========================================================================
  # SECTION 3 — calculations
  # Seven rules. Table 3's Correct Result row plus the per-algorithm rows for
  # threshold, aggregation, constraint_propagation, weighted_scoring,
  # waterfall_allocation, projection and forward_looking are all already carried
  # by §1.8 instances and appear as stubs; what remains genuinely uncovered is
  # inclusion-set filtering, one constant, and the rounding discipline.
  # ===========================================================================
  - section: calculations
    instances:
      - name: corner_charge_inclusion_set_skips_voided_cycles_and_unreplaced_parts
        claim_type: Input Set Filtering
        grounds:
          - calculations.visit_charge_settlement
          - entities.ServiceVisit.fields.serviced_line_count
          - entities.ServiceVisit.fields.parts_charge_cents
          - entities.ComponentInspection.fields.part_charge_cents
          - endpoints.POST_component_inspections
          - endpoints.POST_cleaning_cycles_void
        distinguishing_aspect: |
          Both inclusion sets are filtered by state, not by existence: a VOIDED
          cycle on line #2 keeps serviced_line_count at 1 (cleaning_subtotal
          4593, not 9186), and of three ComponentInspection rows only the
          REPLACED one contributes, so parts_charge_cents is 1450 — the
          action_taken CLEANED row that names FAUCET-88 contributes 0 and leaves
          that SKU's stock_on_hand at 5.
        test_recipe:
          setup:
            - "ServiceAccount 'Anchor Alehouse' ACTIVE with an ACTIVE contract (cleaning_frequency_days 21 -> multiplier 1.10, 4 lines, per_line_rate_cents 4175, visit_base_fee_cents 7500, no brewer program)."
            - "BeerLine #1 and #2 both 32ft/4ft/0.375in (ALE and LAGER), 12.0 and 10.0 L/day."
            - "PartCatalogItem FAUCET-88 (FAUCET, 3195 cents, stock 5) and COUPLER-12 (COUPLER, 1450 cents, stock 5)."
            - "CAUSTIC lot C-2001, 45.0 pct stock, 20.0 L."
            - "Visit IN_PROGRESS on 2026-08-05 with a PASS cycle on each line; line #2's cycle is then VOIDED, restoring the lot to 19.690."
