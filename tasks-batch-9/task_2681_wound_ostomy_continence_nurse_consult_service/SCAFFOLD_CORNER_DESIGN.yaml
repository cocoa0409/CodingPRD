      - name: nurse_lapse_then_recertify_cycles_back_to_certified
        claim_type: cyclic
        grounds:
          - state_machines.WocNurse.CERTIFIED_to_LAPSED
          - state_machines.WocNurse.LAPSED_to_CERTIFIED
          - global_constants.MAX_LOAD_BY_CERT
        distinguishing_aspect: "The WocNurse machine has no terminal state at all: LAPSED is fully reversible. max_consult_load must track the certification dimension in both directions (8 -> 0 -> 8) while certification_eligibility_score, which depends only on credits/signoffs/mentoring, stays flat at 64.00."
        test_recipe:
          setup:
            - "Unit 3E exists; nurse Nina reached CERTIFIED via the CERTIFY-A-NURSE idiom with ce_credits 30 and two signoffs at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 250000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "TRIAGE" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/certify"
