# =============================================================================
# PRD Benchmark Seed Tables — Mobile Dentistry (schools / SNF)
# §1.0–§1.7 live in this file. §1.8 and §1.9 live in their sibling files.
# =============================================================================

scenario: |
  926. Mobile Dentistry (schools/SNF): site & consent roster, portable-equipment & staff scheduling,
  screening/exam & varnish/sealant, treatment-plan & referral, insurance/Medicaid & sliding fee,
  parent/facility report, follow-up, program reporting

domain_name: mobile-dentistry
api_prefix: /mobile-dentistry

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: "beyond Expert"
  notes: |
    Density comes from four interlocking seams, not from entity count:
    (1) one Consent entity carrying two regimes (school guardian vs SNF responsible-party)
        with different required fields, different expiry arithmetic, and an ordered scope-tier
        ladder whose downgrade retro-invalidates already-planned procedures;
    (2) a portable-unit sterilization/calibration cycle whose spore indicator is PENDING for a
        fixed incubation window and whose FAILED result retroactively taints every procedure
        performed on that unit since the last PASSED load;
    (3) three pricing regimes on one encounter (Medicaid encounter-rate, commercial fee-schedule,
        uninsured sliding fee) that must all satisfy one money conservation identity;
    (4) a program-period freeze that acts as a single high-priority global write gate over
        clinical/financial writes, with an explicitly named and justified exclusion set so that
        every rung below it stays reachable.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ProgramPeriod
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human label for the program period, e.g. 'SY2025-26'."
        constraints: "1..120 chars, required"
      - name: starts_on
        type: string
        source: input
        description: "First calendar date (YYYY-MM-DD) covered by the period."
        constraints: "ISO date, required, must be strictly before ends_on"
      - name: ends_on
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD) covered by the period."
        constraints: "ISO date, required"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state of the period; SUBMITTED and CLOSED arm the global write gate."
        default: OPEN
        constraints: "one of OPEN, REPORTING, SUBMITTED, CLOSED"
      - name: frozen_at
        type: datetime
        source: system
        description: "UTC instant the period first entered SUBMITTED; cleared when it returns to REPORTING."
        default: null
      - name: state_submission_ref
        type: string
        source: input
        description: "State agency submission reference recorded when the program report is submitted."
        default: null

  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Site name (school or skilled-nursing facility)."
        constraints: "1..160 chars, required"
      - name: site_type
        type: enum
        source: input
        description: "Which consent regime and which triage-band variant this site runs under."
        constraints: "one of SCHOOL, SNF; required"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code the site sits in; staff licences are matched against it."
        constraints: "exactly 2 uppercase letters, required"
      - name: status
        type: enum
        source: system
        description: "ACTIVE normally; SUSPENDED while at least one SiteHold is ACTIVE."
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED"
      - name: roster_disclosure_level
        type: enum
        source: input
        description: "How much per-resident/per-student detail a FACILITY_ROSTER report may expose for this site."
        default: SUMMARY_ONLY
        constraints: "one of SUMMARY_ONLY, CLINICAL_DETAIL"
      - name: facility_contact_name
        type: string
        source: input
        description: "Named site contact for facility reports."
        default: null
      - name: active_hold_count
        type: integer
        source: computed
        description: "Count of SiteHold rows for this site whose hold_status == ACTIVE."
        default: 0

  - name: SiteHold
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site this hold suspends."
        constraints: "required, must reference an existing Site"
      - name: hold_type
        type: enum
        source: input
        description: "Reason class for the suspension."
        constraints: "one of WEATHER_CLOSURE, OUTBREAK_LOCKDOWN, ADMINISTRATIVE; required"
      - name: starts_at
        type: datetime
        source: input
        description: "UTC instant the hold window opens (inclusive)."
        constraints: "ISO 8601 UTC, required"
      - name: ends_at
        type: datetime
        source: input
        description: "UTC instant the hold window closes (exclusive); must be strictly after starts_at."
        constraints: "ISO 8601 UTC, required"
      - name: hold_status
        type: enum
        source: system
        description: "ACTIVE at creation; RELEASED once the release endpoint runs."
        default: ACTIVE
        constraints: "one of ACTIVE, RELEASED"
      - name: reason
        type: string
        source: input
        description: "Free-text justification recorded on the hold."
        default: null
      - name: released_at
        type: datetime
        source: system
        description: "UTC instant the hold was released."
        default: null
      - name: blocked_visit_count
        type: integer
        source: computed
        description: "Number of SiteVisit rows this hold moved into HOLD_BLOCKED when it was created."
        default: 0

  - name: Patient
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the school or SNF the patient is rostered at."
        constraints: "required, must reference an existing Site"
      - name: patient_type
        type: enum
        source: input
        description: "STUDENT for SCHOOL sites, RESIDENT for SNF sites; must agree with Site.site_type."
        constraints: "one of STUDENT, RESIDENT; required"
      - name: external_ref
        type: string
        source: input
        description: "School student number or SNF resident number."
        constraints: "required, unique within site_id"
      - name: first_name
        type: string
        source: input
        description: "Given name."
        constraints: "required"
      - name: last_name
        type: string
        source: input
        description: "Family name."
        constraints: "required"
      - name: date_of_birth
        type: string
        source: input
        description: "Birth date (YYYY-MM-DD)."
        constraints: "ISO date, required"
      - name: grade_level
        type: string
        source: input
        description: "School grade label; only meaningful for STUDENT patients."
        default: null
      - name: room_number
        type: string
        source: input
        description: "SNF room label; only meaningful for RESIDENT patients."
        default: null
      - name: household_size
        type: integer
        source: input
        description: "Number of people in the patient's household; drives the sliding-fee FPL threshold."
        default: 1
        constraints: "integer >= 1"
      - name: annual_household_income_cents
        type: integer
        source: input
        description: "Annual household income in cents; required before an UNINSURED coverage can be verified."
        default: null
        constraints: "integer >= 0 when present"
      - name: capacity_determination
        type: enum
        source: input
        description: "Decision-making capacity finding; SNF consent requires a value other than NOT_ASSESSED."
        default: NOT_ASSESSED
        constraints: "one of NOT_ASSESSED, HAS_CAPACITY, LACKS_CAPACITY"
      - name: capacity_determined_at
        type: datetime
        source: system
        description: "UTC instant capacity_determination was last set to a value other than NOT_ASSESSED."
        default: null
      - name: varnish_applications_in_period
        type: integer
        source: computed
        description: "Count of PERFORMED D1206 procedures for this patient inside the currently referenced ProgramPeriod."
        default: 0
      - name: last_varnish_date
        type: string
        source: computed
        description: "Calendar date (YYYY-MM-DD) of the most recent PERFORMED D1206 procedure, else null."
        default: null

  - name: Consent
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient this consent authorises treatment for."
        constraints: "required, must reference an existing Patient"
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; denormalised site of the patient, fixed at creation."
        constraints: "required, must equal Patient.site_id"
      - name: program_period_id
        type: string
        source: input
        description: "FK -> ProgramPeriod.id; the period a SCHOOL_GUARDIAN consent is scoped to."
        constraints: "required, must reference an existing ProgramPeriod"
      - name: regime
        type: enum
        source: input
        description: "Consent regime; must be SCHOOL_GUARDIAN at SCHOOL sites and SNF_RESPONSIBLE_PARTY at SNF sites."
        constraints: "one of SCHOOL_GUARDIAN, SNF_RESPONSIBLE_PARTY; required"
      - name: scope_tier
        type: enum
        source: input
        description: "Ordered permission tier; a procedure is permitted only when its required tier rank is <= this tier's rank."
        constraints: "one of SCREENING_ONLY, SCREENING_FLUORIDE, SCREENING_FLUORIDE_SEALANT, FULL_WITH_RADIOGRAPHS; required"
      - name: status
        type: enum
        source: system
        description: "Consent lifecycle state."
        default: PENDING_VERIFICATION
        constraints: "one of PENDING_VERIFICATION, ACTIVE, REVOKED, EXPIRED, SUPERSEDED"
      - name: guardian_name
        type: string
        source: input
        description: "Parent/guardian name; required when regime == SCHOOL_GUARDIAN."
        default: null
      - name: guardian_relationship
        type: string
        source: input
        description: "Relationship of the signer to the student; required when regime == SCHOOL_GUARDIAN."
        default: null
      - name: responsible_party_name
        type: string
        source: input
        description: "Responsible party / POA name; required when regime == SNF_RESPONSIBLE_PARTY."
        default: null
      - name: responsible_party_authority
        type: enum
        source: input
        description: "Legal basis the responsible party signs under; required when regime == SNF_RESPONSIBLE_PARTY."
        default: null
        constraints: "one of DURABLE_POA, HEALTHCARE_PROXY, COURT_GUARDIAN, SELF"
      - name: poa_document_ref
        type: string
        source: input
        description: "Reference to the filed POA/proxy document; required when regime == SNF_RESPONSIBLE_PARTY and responsible_party_authority != SELF."
        default: null
      - name: signed_at
        type: datetime
        source: input
        description: "UTC instant the consent form was signed; the SNF reaffirmation clock starts here."
        constraints: "ISO 8601 UTC, required"
      - name: expires_at
        type: datetime
        source: computed
        description: "Computed expiry instant; see calculation consent_expires_at (dual-variant by regime)."
        default: null
      - name: reaffirmation_due_at
        type: datetime
        source: computed
        description: "Equal to expires_at for SNF_RESPONSIBLE_PARTY consents, null for SCHOOL_GUARDIAN consents."
        default: null
      - name: superseded_by_consent_id
        type: string
        source: system
        description: "FK -> Consent.id; set on the old row when a tier amendment mints a replacement consent."
        default: null
      - name: revoked_at
        type: datetime
        source: system
        description: "UTC instant the consent was revoked."
        default: null
      - name: revoke_reason
        type: string
        source: input
        description: "Free-text reason captured at revocation."
        default: null
      - name: expired_at
        type: datetime
        source: system
        description: "UTC instant the lazy expiry sweep flipped this consent to EXPIRED."
        default: null
      - name: invalidated_procedure_count
        type: integer
        source: computed
        description: "Number of PLANNED procedures this consent's tier downgrade moved to INELIGIBLE."
        default: 0

  - name: PortableUnit
    parent: null
    common_fields: true
    fields:
      - name: unit_code
        type: string
        source: input
        description: "Asset code of the portable operatory unit."
        constraints: "required, unique"
      - name: status
        type: enum
        source: system
        description: "Assignability state of the unit."
        default: AVAILABLE
        constraints: "one of AVAILABLE, IN_SERVICE, QUARANTINED"
      - name: last_calibrated_on
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD) of the most recent calibration."
        default: null
      - name: calibration_due_on
        type: string
        source: computed
        description: "last_calibrated_on + UNIT_CALIBRATION_VALID_DAYS, as YYYY-MM-DD; null when never calibrated."
        default: null
      - name: calibration_status
        type: enum
        source: computed
        description: "Derived from calibration_due_on versus the logical clock; see calculation unit_calibration_status."
        default: EXPIRED
        constraints: "one of CURRENT, DUE, EXPIRED"
      - name: last_passed_load_at
        type: datetime
        source: system
        description: "cycle_completed_at of the most recent SterilizationLoad on this unit whose spore_result == PASSED."
        default: null
      - name: quarantined_at
        type: datetime
        source: system
        description: "UTC instant the unit most recently entered QUARANTINED."
        default: null

  - name: SterilizationLoad
    parent: PortableUnit
    common_fields: true
    fields:
      - name: portable_unit_id
        type: string
        source: input
        description: "FK -> PortableUnit.id; the unit whose instrument load this is."
        constraints: "required, must reference an existing PortableUnit"
      - name: site_visit_id
        type: string
        source: input
        description: "FK -> SiteVisit.id; the visit this load was run for, when known."
        default: null
      - name: loaded_by_staff_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the staff member who ran the sterilizer cycle."
        constraints: "required, must reference an existing StaffMember"
      - name: result_recorded_by_staff_id
        type: string
        source: system
        description: "FK -> StaffMember.id; the staff member who read the spore indicator; must differ from loaded_by_staff_id."
        default: null
      - name: load_number
        type: string
        source: input
        description: "Sterilizer cycle/load label."
        constraints: "required"
      - name: cycle_completed_at
        type: datetime
        source: input
        description: "UTC instant the sterilizer cycle finished; starts the biological-indicator incubation clock."
        constraints: "ISO 8601 UTC, required"
      - name: incubation_ends_at
        type: datetime
        source: computed
        description: "cycle_completed_at + SPORE_INCUBATION_HOURS."
      - name: spore_result
        type: enum
        source: system
        description: "Biological indicator outcome."
        default: PENDING
        constraints: "one of PENDING, PASSED, FAILED"
      - name: result_recorded_at
        type: datetime
        source: system
        description: "UTC instant the spore result was recorded (explicitly or by the lazy incubation-timeout sweep)."
        default: null
      - name: auto_failed
        type: boolean
        source: system
        description: "True when the load was flipped to FAILED by the lazy incubation-timeout sweep rather than by an operator."
        default: false
      - name: tainted_procedure_count
        type: integer
        source: computed
        description: "Number of Procedure rows this load's FAILED result moved from PERFORMED to TAINTED."
        default: 0

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Staff member's name."
        constraints: "required"
      - name: staff_role
        type: enum
        source: input
        description: "Clinical role; drives the supervision matrix lookup."
        constraints: "one of DENTIST, HYGIENIST, PUBLIC_HEALTH_HYGIENIST, DENTAL_ASSISTANT; required"
      - name: license_number
        type: string
        source: input
        description: "State licence number."
        constraints: "required"
      - name: license_state
        type: string
        source: input
        description: "Two-letter state code the licence is issued in; must equal Site.state_code to work a visit."
        constraints: "exactly 2 uppercase letters, required"
      - name: supervision_level
        type: enum
        source: input
        description: "Supervision authorisation the staff member holds; ranked by SUPERVISION_RANK."
        constraints: "one of DIRECT, INDIRECT, GENERAL, SELF; required"
      - name: credential_status
        type: enum
        source: input
        description: "Credential standing; only ACTIVE staff may perform or supervise."
        default: ACTIVE
        constraints: "one of ACTIVE, LAPSED, INACTIVE"
      - name: credential_expires_on
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the credential lapses."
        default: null

  - name: SiteVisit
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the site being visited."
        constraints: "required, must reference an existing Site"
      - name: program_period_id
        type: string
        source: input
        description: "FK -> ProgramPeriod.id; the reporting period this visit rolls up into."
        constraints: "required, must reference an existing ProgramPeriod"
      - name: portable_unit_id
        type: string
        source: input
        description: "FK -> PortableUnit.id; the portable operatory assigned to the visit."
        constraints: "required, must reference an existing PortableUnit"
      - name: lead_staff_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the clinician leading the visit."
        constraints: "required, must reference an existing StaffMember"
      - name: onsite_dentist_staff_id
        type: string
        source: input
        description: "FK -> StaffMember.id; dentist physically present at the site, when one is assigned."
        default: null
      - name: remote_dentist_staff_id
        type: string
        source: input
        description: "FK -> StaffMember.id; teledentistry reviewing dentist, when one is assigned."
        default: null
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "UTC instant the visit is scheduled to start."
        constraints: "ISO 8601 UTC, required"
      - name: scheduled_end_at
        type: datetime
        source: input
        description: "UTC instant the visit is scheduled to end; must be strictly after scheduled_start_at."
        constraints: "ISO 8601 UTC, required"
      - name: chair_count
        type: integer
        source: input
        description: "Number of portable chairs staffed for this visit."
        default: 1
        constraints: "integer >= 1"
      - name: capacity_chair_minutes
        type: integer
        source: computed
        description: "floor(chair_count * scheduled duration in minutes * CHAIR_UTILIZATION_CAP_PCT)."
        default: 0
      - name: booked_chair_minutes
        type: integer
        source: computed
        description: "Sum of Procedure.chair_minutes over this visit's procedures whose status is PLANNED or PERFORMED."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Visit lifecycle state."
        default: SCHEDULED
        constraints: "one of SCHEDULED, HOLD_BLOCKED, IN_PROGRESS, COMPLETED, CANCELLED"
      - name: reschedule_count
        type: integer
        source: system
        description: "How many times this visit has been rescheduled; capped by VISIT_RESCHEDULE_MAX_COUNT."
        default: 0
      - name: started_at
        type: datetime
        source: system
        description: "UTC instant the visit moved to IN_PROGRESS."
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: "UTC instant the visit moved to COMPLETED."
        default: null
      - name: cancelled_at
        type: datetime
        source: system
        description: "UTC instant the visit moved to CANCELLED."
        default: null

  - name: Coverage
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient this coverage belongs to."
        constraints: "required, must reference an existing Patient"
      - name: payer_type
        type: enum
        source: input
        description: "Pricing regime selector for every encounter that cites this coverage."
        constraints: "one of MEDICAID_MCO, COMMERCIAL_FFS, UNINSURED; required"
      - name: payer_name
        type: string
        source: input
        description: "Plan or MCO name; null for UNINSURED."
        default: null
      - name: member_id
        type: string
        source: input
        description: "Member/subscriber identifier; required when payer_type != UNINSURED."
        default: null
      - name: verification_status
        type: enum
        source: system
        description: "Eligibility verification state."
        default: UNVERIFIED
        constraints: "one of UNVERIFIED, VERIFIED, EXPIRED"
      - name: verified_through_date
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD) the verification is good for."
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: "UTC instant the coverage was last verified."
        default: null
      - name: fpl_percent
        type: number
        source: computed
        description: "Household income as a percent of the federal poverty threshold, 1 decimal place; UNINSURED only."
        default: null
      - name: sliding_fee_band
        type: enum
        source: computed
        description: "Sliding-fee band derived from fpl_percent; UNINSURED only."
        default: null
        constraints: "one of A, B, C, D, E"
      - name: determination_date
        type: string
        source: computed
        description: "Calendar date (YYYY-MM-DD) the sliding-fee band was determined; equals the logical clock date at verification."
        default: null

  - name: Encounter
    parent: SiteVisit
    common_fields: true
    fields:
      - name: site_visit_id
        type: string
        source: input
        description: "FK -> SiteVisit.id; the visit this encounter happened at."
        constraints: "required, must reference an existing SiteVisit"
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient seen."
        constraints: "required, must reference an existing Patient"
      - name: consent_id
        type: string
        source: input
        description: "FK -> Consent.id; the consent authorising this encounter."
        constraints: "required, must reference an existing Consent"
      - name: coverage_id
        type: string
        source: input
        description: "FK -> Coverage.id; the coverage the encounter is priced against."
        default: null
      - name: clinical_status
        type: enum
        source: system
        description: "Clinical axis of the encounter; evolves independently of billing_status."
        default: REGISTERED
        constraints: "one of REGISTERED, SCREENED, EXAMINED, TREATED, CLOSED, DEFERRED, NO_SHOW"
      - name: billing_status
        type: enum
        source: system
        description: "Billing axis of the encounter; evolves independently of clinical_status."
        default: UNBILLED
        constraints: "one of UNBILLED, PRICED, CLAIMED, PAID, DENIED"
      - name: triage_band
        type: enum
        source: computed
        description: "Screening urgency classification; see calculation triage_band (dual-variant by site type)."
        default: null
        constraints: "one of URGENT, EARLY_CARE_NEEDED, NO_OBVIOUS_PROBLEM"
      - name: cavitated_lesion_count
        type: integer
        source: input
        description: "Screening finding: number of cavitated carious lesions observed."
        default: null
      - name: pain_reported
        type: boolean
        source: input
        description: "Screening finding: patient reported dental pain."
        default: null
      - name: abscess_or_swelling
        type: boolean
        source: input
        description: "Screening finding: abscess or facial swelling present."
        default: null
      - name: untreated_decay_present
        type: boolean
        source: input
        description: "Screening finding: any untreated decay present."
        default: null
      - name: denture_problem
        type: boolean
        source: input
        description: "Screening finding: ill-fitting or missing denture; only scored by the SNF variant."
        default: null
      - name: oral_hygiene_score
        type: integer
        source: input
        description: "Screening finding: 0 (good) to 4 (very poor); only scored by the SNF variant."
        default: null
      - name: medical_complexity_count
        type: integer
        source: input
        description: "Screening finding: count of complicating medical conditions; only scored by the SNF variant."
        default: null
      - name: exam_modality
        type: enum
        source: input
        description: "How the dentist exam was delivered."
        default: null
        constraints: "one of ONSITE, TELEDENTISTRY"
      - name: teledentistry_reviewed_at
        type: datetime
        source: input
        description: "UTC instant the remote dentist reviewed the case; required when exam_modality == TELEDENTISTRY."
        default: null
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of Procedure.charge_cents over this encounter's PERFORMED procedures."
        default: 0
      - name: supply_surcharge_cents
        type: integer
        source: computed
        description: "Flat per-encounter supply surcharge selected by a tier keyed on subtotal_cents."
        default: 0
      - name: total_charge_cents
        type: integer
        source: computed
        description: "subtotal_cents + supply_surcharge_cents."
        default: 0
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: "Amount the payer regime recognises; dual-variant, see calculation encounter_allowed_amount_cents."
        default: 0
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: "Patient's share; dual-variant, see calculation patient_responsibility_cents."
        default: 0
      - name: plan_paid_cents
        type: integer
        source: computed
        description: "allowed_amount_cents - patient_responsibility_cents."
        default: 0
      - name: write_off_cents
        type: integer
        source: computed
        description: "total_charge_cents - allowed_amount_cents."
        default: 0
      - name: pricing_regime
        type: enum
        source: computed
        description: "Which pricing branch produced the money fields; pinned at the moment of pricing."
        default: null
        constraints: "one of MEDICAID_ENCOUNTER_RATE, COMMERCIAL_FEE_SCHEDULE, UNINSURED_SLIDING_FEE"
      - name: tainted_procedure_count
        type: integer
        source: computed
        description: "Number of this encounter's procedures currently in status TAINTED."
        default: 0
      - name: deferred_reason
        type: string
        source: system
        description: "Why the encounter was deferred (operator reason, or SITE_HOLD / CONSENT_TIER_DOWNGRADE from a cascade)."
        default: null
      - name: denial_reason
        type: string
        source: input
        description: "Payer denial reason recorded at adjudication."
        default: null

  - name: Procedure
    parent: Encounter
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK -> Encounter.id; the encounter this procedure belongs to."
        constraints: "required, must reference an existing Encounter"
      - name: treatment_plan_id
        type: string
        source: input
        description: "FK -> TreatmentPlan.id; the plan this procedure realises, when planned from one."
        default: null
      - name: sterilization_load_id
        type: string
        source: input
        description: "FK -> SterilizationLoad.id; the instrument load used; recorded when the procedure is performed."
        default: null
      - name: performing_staff_id
        type: string
        source: system
        description: "FK -> StaffMember.id; the staff member who performed the procedure."
        default: null
      - name: procedure_code
        type: enum
        source: input
        description: "ADA-style procedure code; keys the fee schedule, chair minutes, and required consent tier."
        constraints: "one of D0190, D0150, D1206, D1351, D0272; required"
      - name: tooth_number
        type: integer
        source: input
        description: "Universal tooth number; required for D1351."
        default: null
        constraints: "integer 1..32 when present"
      - name: surface
        type: enum
        source: input
        description: "Tooth surface; required for D1351."
        default: null
        constraints: "one of O, B, L, M, D"
      - name: required_tier
        type: enum
        source: computed
        description: "Consent scope tier this procedure_code demands, from PROCEDURE_REQUIRED_TIER."
        constraints: "one of SCREENING_ONLY, SCREENING_FLUORIDE, SCREENING_FLUORIDE_SEALANT, FULL_WITH_RADIOGRAPHS"
      - name: chair_minutes
        type: integer
        source: computed
        description: "Chair time this procedure books, from PROCEDURE_CHAIR_MINUTES."
      - name: charge_cents
        type: integer
        source: computed
        description: "Billed charge from PROCEDURE_FEE_SCHEDULE_CENTS, fixed at creation."
      - name: status
        type: enum
        source: system
        description: "Procedure lifecycle state."
        default: PLANNED
        constraints: "one of PLANNED, PERFORMED, INELIGIBLE, VOIDED, TAINTED"
      - name: performed_at
        type: datetime
        source: system
        description: "UTC instant the procedure was performed."
        default: null
      - name: taint_reason
        type: string
        source: system
        description: "Why the procedure was tainted (always SPORE_TEST_FAILED)."
        default: null
      - name: void_reason
        type: string
        source: input
        description: "Operator reason recorded at void, or CONSENT_TIER_DOWNGRADE when set by cascade."
        default: null

  - name: TreatmentPlan
    parent: Encounter
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: "FK -> Encounter.id; the encounter that produced this plan."
        constraints: "required, must reference an existing Encounter"
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; denormalised patient of the encounter."
        constraints: "required, must equal Encounter.patient_id"
      - name: authoring_staff_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the clinician who authored the plan."
        constraints: "required, must reference an existing StaffMember"
      - name: plan_status
        type: enum
        source: system
        description: "Plan lifecycle state."
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE, COMPLETED, SUPERSEDED, CANCELLED"
      - name: urgency_band
        type: enum
        source: computed
        description: "Copied from Encounter.triage_band at plan creation; drives referral SLA and follow-up cadence."
        constraints: "one of URGENT, EARLY_CARE_NEEDED, NO_OBVIOUS_PROBLEM"
      - name: planned_procedure_codes
        type: array
        source: input
        description: "Procedure codes the plan recommends; informational, not auto-instantiated."
        default: []
      - name: activated_on
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD) the plan moved to ACTIVE; the follow-up cadence starts here."
        default: null
      - name: follow_up_due_date
        type: string
        source: computed
        description: "Calendar date (YYYY-MM-DD) the next follow-up contact is due; see calculation follow_up_due_date."
        default: null
      - name: follow_up_status
        type: enum
        source: computed
        description: "Derived from follow_up_due_date, last_contact_at and the logical clock; see calculation follow_up_status."
        default: NOT_DUE
        constraints: "one of NOT_DUE, DUE, OVERDUE, CONTACTED"
      - name: last_contact_at
        type: datetime
        source: system
        description: "UTC instant of the most recent recorded follow-up contact."
        default: null
      - name: contact_attempt_count
        type: integer
        source: system
        description: "How many follow-up contacts have been recorded on this plan."
        default: 0
      - name: superseded_reason
        type: string
        source: system
        description: "Why the plan was superseded or cancelled (SPORE_TEST_FAILED or CONSENT_TIER_DOWNGRADE)."
        default: null

  - name: Referral
    parent: TreatmentPlan
    common_fields: true
    fields:
      - name: treatment_plan_id
        type: string
        source: input
        description: "FK -> TreatmentPlan.id; the plan this referral executes."
        constraints: "required, must reference an existing TreatmentPlan"
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; denormalised patient of the plan."
        constraints: "required, must equal TreatmentPlan.patient_id"
      - name: dental_home_name
        type: string
        source: input
        description: "Name of the receiving dental home."
        constraints: "required"
      - name: status
        type: enum
        source: system
        description: "Referral loop state."
        default: OPEN
        constraints: "one of OPEN, SENT, ACCEPTED, DECLINED, NO_RESPONSE, COMPLETED, ABANDONED"
      - name: attempt_count
        type: integer
        source: system
        description: "How many times the referral has been SENT; capped at REFERRAL_MAX_ATTEMPTS."
        default: 0
      - name: due_at
        type: datetime
        source: computed
        description: "Referral SLA deadline; see calculation referral_due_at (dual-variant by site type)."
        default: null
      - name: last_sent_at
        type: datetime
        source: system
        description: "UTC instant of the most recent send."
        default: null
      - name: next_eligible_send_at
        type: datetime
        source: computed
        description: "last_sent_at + REFERRAL_NO_RESPONSE_DAYS; a re-send before this instant is refused."
        default: null
      - name: abandoned_at
        type: datetime
        source: system
        description: "UTC instant the referral was abandoned."
        default: null
      - name: abandon_reason
        type: string
        source: system
        description: "ATTEMPT_CAP_REACHED or PLAN_SUPERSEDED."
        default: null
      - name: case_management_opened_at
        type: datetime
        source: system
        description: "UTC instant case-management escalation was opened; set together with abandoned_at."
        default: null

  - name: Report
    parent: ProgramPeriod
    common_fields: true
    fields:
      - name: program_period_id
        type: string
        source: input
        description: "FK -> ProgramPeriod.id; the period the report covers."
        constraints: "required, must reference an existing ProgramPeriod"
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; required for FACILITY_ROSTER and PARENT reports, null for PROGRAM_PERIOD."
        default: null
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; required for PARENT reports, null otherwise."
        default: null
      - name: report_type
        type: enum
        source: input
        description: "Audience class; decides the confidentiality wall and the payload shape."
        constraints: "one of PARENT, FACILITY_ROSTER, PROGRAM_PERIOD; required"
      - name: recipient_user_id
        type: string
        source: input
        description: "Opaque X-User-ID the PARENT report is addressed to; required for PARENT reports."
        default: null
      - name: status
        type: enum
        source: system
        description: "Report lifecycle state."
        default: DRAFT
        constraints: "one of DRAFT, GENERATED, STALE, SUBMITTED"
      - name: payload
        type: object
        source: computed
        description: "Generated report body; shape depends on report_type and, for FACILITY_ROSTER, on Site.roster_disclosure_level."
        default: null
      - name: generated_at
        type: datetime
        source: system
        description: "UTC instant the payload was last generated."
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "UTC instant a PROGRAM_PERIOD report was submitted to the state."
        default: null
      - name: stale_reason
        type: string
        source: system
        description: "Why the report went STALE (always PERIOD_DATA_CHANGED)."
        default: null

# =============================================================================
# §1.2 State Machine Table — 13 axes, all non-linear
# Axis inventory (entity / state_field / shape):
#   1  ProgramPeriod.status          cyclic (REPORTING <-> OPEN, SUBMITTED -> REPORTING)
#   2  Site.status                   cyclic (ACTIVE <-> SUSPENDED)
#   3  Consent.status                self-loop + three-way terminal fan-out
#   4  PortableUnit.status           cyclic (AVAILABLE <-> IN_SERVICE, <-> QUARANTINED)
#   5  SterilizationLoad.spore_result branching fork with divergent side-effect sets
#   6  SiteVisit.status              self-loop + fan-out + revert
#   7  Encounter.clinical_status     branching fan-out  (parallel axis A)
#   8  Encounter.billing_status      cyclic revert      (parallel axis B)
#   9  Procedure.status              three-way terminal fan-out
#   10 TreatmentPlan.plan_status     self-loop + three-way terminal fan-out
#   11 Referral.status               capped cycle
#   12 Coverage.verification_status  cyclic (VERIFIED -> EXPIRED -> VERIFIED)
#   13 Report.status                 self-loop + cycle through STALE
# =============================================================================
state_machines:

  - entity: ProgramPeriod
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: cyclic
    transitions:
      - from: OPEN
        to: REPORTING
        trigger: "POST /mobile-dentistry/program-periods/{id}/status with to_status=REPORTING"
        actor: ProgramAdmin
        preconditions:
          - "program_period.status == OPEN"
        side_effects:
          - "increments ProgramPeriod.version by 1"
          - "refreshes ProgramPeriod.updated_at"
      - from: REPORTING
        to: OPEN
        trigger: "POST /mobile-dentistry/program-periods/{id}/status with to_status=OPEN"
        actor: ProgramAdmin
        preconditions:
          - "program_period.status == REPORTING"
        side_effects:
          - "increments ProgramPeriod.version by 1"
        note: "Revert leg; lets a period be reopened for late data entry before submission."
      - from: REPORTING
        to: SUBMITTED
        trigger: "system event: cascade link 2 of POST /mobile-dentistry/reports/{id}/submit on a PROGRAM_PERIOD report"
        actor: system
        preconditions:
          - "program_period.status == REPORTING"
        side_effects:
          - "sets ProgramPeriod.frozen_at to the logical clock instant"
          - "arms the global write gate (validation priority 8) for every entity resolving to this period"
          - "cascade link 3: every SiteVisit with program_period_id == this period and status == SCHEDULED moves to CANCELLED with cancelled_at stamped"
          - "increments ProgramPeriod.version by 1"
      - from: SUBMITTED
        to: REPORTING
        trigger: "POST /mobile-dentistry/program-periods/{id}/status with to_status=REPORTING"
        actor: ProgramAdmin
        preconditions:
          - "program_period.status == SUBMITTED"
        side_effects:
          - "clears ProgramPeriod.frozen_at to null"
          - "disarms the global write gate for this period"
          - "increments ProgramPeriod.version by 1"
        note: "Amendment leg; the state agency rejected or returned the submission. This is what keeps the freeze reversible and every gated rung reachable."
      - from: SUBMITTED
        to: CLOSED
        trigger: "POST /mobile-dentistry/program-periods/{id}/status with to_status=CLOSED"
        actor: ProgramAdmin
        preconditions:
          - "program_period.status == SUBMITTED"
        side_effects:
          - "keeps the global write gate armed permanently for this period"
          - "increments ProgramPeriod.version by 1"

  - entity: Site
    state_field: status
    initial_state: ACTIVE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: cascade link 1 of POST /mobile-dentistry/site-holds"
        actor: system
        preconditions:
          - "site.status == ACTIVE"
        side_effects:
          - "increments Site.active_hold_count by 1"
          - "cascade link 2: every SiteVisit for this site with status == SCHEDULED whose [scheduled_start_at, scheduled_end_at) intersects [hold.starts_at, hold.ends_at) moves to HOLD_BLOCKED"
          - "increments Site.version by 1"
      - from: SUSPENDED
        to: SUSPENDED
        trigger: "system event: cascade link 1 of POST /mobile-dentistry/site-holds while another hold is already ACTIVE"
        actor: system
        preconditions:
          - "site.status == SUSPENDED"
        side_effects:
          - "increments Site.active_hold_count by 1"
          - "cascade link 2 runs identically for the newly-created hold's window"
          - "increments Site.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mobile-dentistry/site-holds/{id}/release"
        actor: ProgramAdmin
        preconditions:
          - "site_hold.hold_status == ACTIVE"
          - "site.active_hold_count == 1 (this is the last remaining ACTIVE hold on the site)"
        side_effects:
          - "decrements Site.active_hold_count to 0"
          - "every SiteVisit for this site with status == HOLD_BLOCKED and no remaining intersecting ACTIVE hold returns to SCHEDULED"
          - "increments Site.version by 1"
        note: "Encounters already moved to DEFERRED by the hold are NOT restored; the release leg is deliberately asymmetric and is documented as such."

  - entity: Consent
    state_field: status
    initial_state: PENDING_VERIFICATION
    terminal_states: [REVOKED, EXPIRED, SUPERSEDED]
    shape: branching_with_self_loop
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /mobile-dentistry/consents/{id}/verify"
        actor: SiteCoordinator
        preconditions:
          - "consent.status == PENDING_VERIFICATION"
          - "consent.expires_at > logical clock instant"
          - "when consent.regime == SNF_RESPONSIBLE_PARTY: patient.capacity_determination != NOT_ASSESSED"
        side_effects:
          - "recomputes Consent.expires_at and Consent.reaffirmation_due_at per calculation consent_expires_at"
          - "increments Consent.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /mobile-dentistry/consents/{id}/verify (annual reaffirmation)"
        actor: SiteCoordinator
        preconditions:
          - "consent.status == ACTIVE"
          - "consent.regime == SNF_RESPONSIBLE_PARTY"
          - "patient.capacity_determination != NOT_ASSESSED"
        side_effects:
          - "sets Consent.signed_at to the logical clock instant"
          - "recomputes Consent.expires_at = signed_at + CONSENT_SNF_REAFFIRMATION_DAYS and mirrors it into reaffirmation_due_at"
          - "increments Consent.version by 1"
        note: "Self-loop. A SCHOOL_GUARDIAN consent in ACTIVE has no re-verify leg and is refused by the state gate with ERR_INVALID_STATE."
      - from: PENDING_VERIFICATION
        to: EXPIRED
        trigger: "system event: lazy expiry sweep at validation priority 23"
        actor: system
        preconditions:
          - "consent.status == PENDING_VERIFICATION"
          - "consent.expires_at <= logical clock instant"
        side_effects:
          - "sets Consent.expired_at to the logical clock instant"
          - "increments Consent.version by 1"
          - "the triggering request is then refused with ERR_CONSENT_EXPIRED (mutate-then-reject)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: lazy expiry sweep at validation priority 23"
        actor: system
        preconditions:
          - "consent.status == ACTIVE"
          - "consent.expires_at <= logical clock instant"
        side_effects:
          - "sets Consent.expired_at to the logical clock instant"
          - "increments Consent.version by 1"
          - "the triggering request is then refused with ERR_CONSENT_EXPIRED (mutate-then-reject)"
        note: "When the consent is ALREADY in EXPIRED, priority 23 still surfaces ERR_CONSENT_EXPIRED but performs no write and does not bump Consent.version."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /mobile-dentistry/consents/{id}/revoke"
        actor: SiteCoordinator
        preconditions:
          - "consent.status == ACTIVE"
        side_effects:
          - "sets Consent.revoked_at and Consent.revoke_reason"
          - "every Procedure with status == PLANNED under an Encounter citing this consent moves to INELIGIBLE"
          - "each such procedure's chair_minutes are released from SiteVisit.booked_chair_minutes"
          - "increments Consent.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /mobile-dentistry/consents/{id}/amend-tier"
        actor: SiteCoordinator
        preconditions:
          - "consent.status == ACTIVE"
          - "payload expected_patient_version == patient.version"
        side_effects:
          - "cascade link 1: mints a replacement Consent row in ACTIVE at new_scope_tier, copying patient_id, site_id, program_period_id, regime, regime-specific signer fields and signed_at; sets this row's superseded_by_consent_id to the new row's id"
          - "cascade link 2 (caused by link 1, downgrade only): every Procedure with status == PLANNED under an Encounter citing the superseded consent whose required_tier rank exceeds the new tier rank moves to INELIGIBLE with void_reason CONSENT_TIER_DOWNGRADE, and Consent.invalidated_procedure_count on the OLD row is set to that count"
          - "cascade link 3 (caused by link 2): each affected SiteVisit.booked_chair_minutes is decremented by the released chair_minutes, and any Encounter left with zero PLANNED-or-PERFORMED procedures whose clinical_status is EXAMINED or TREATED moves to DEFERRED with deferred_reason CONSENT_TIER_DOWNGRADE; any ACTIVE TreatmentPlan on such an encounter moves to CANCELLED with superseded_reason CONSENT_TIER_DOWNGRADE"
          - "increments Patient.version by 1"
          - "increments Consent.version by 1 on the superseded row"

  - entity: PortableUnit
    state_field: status
    initial_state: AVAILABLE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: AVAILABLE
        to: IN_SERVICE
        trigger: "POST /mobile-dentistry/site-visits/{id}/start"
        actor: FieldDentist
        preconditions:
          - "portable_unit.status == AVAILABLE"
          - "portable_unit.calibration_status IN {CURRENT, DUE}"
        side_effects:
          - "increments PortableUnit.version by 1"
      - from: IN_SERVICE
        to: AVAILABLE
        trigger: "POST /mobile-dentistry/site-visits/{id}/complete"
        actor: FieldDentist
        preconditions:
          - "portable_unit.status == IN_SERVICE"
        side_effects:
          - "increments PortableUnit.version by 1"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /mobile-dentistry/sterilization-loads/{id}/spore-result with result=FAILED, or the lazy incubation-timeout sweep at validation priority 14"
        actor: system
        preconditions:
          - "portable_unit.status == AVAILABLE"
        side_effects:
          - "sets PortableUnit.quarantined_at to the logical clock instant"
          - "increments PortableUnit.version by 1"
      - from: IN_SERVICE
        to: QUARANTINED
        trigger: "POST /mobile-dentistry/sterilization-loads/{id}/spore-result with result=FAILED"
        actor: system
        preconditions:
          - "portable_unit.status == IN_SERVICE"
        side_effects:
          - "sets PortableUnit.quarantined_at to the logical clock instant"
          - "increments PortableUnit.version by 1"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /mobile-dentistry/sterilization-loads/{id}/spore-result with result=PASSED"
        actor: DentalAssistant
        preconditions:
          - "portable_unit.status == QUARANTINED"
          - "sterilization_load.portable_unit_id == portable_unit.id"
        side_effects:
          - "sets PortableUnit.last_passed_load_at to the load's cycle_completed_at"
          - "clears PortableUnit.quarantined_at to null"
          - "increments PortableUnit.version by 1"

  - entity: SterilizationLoad
    state_field: spore_result
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    shape: branching_fork_with_divergent_side_effects
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /mobile-dentistry/sterilization-loads/{id}/spore-result with result=PASSED"
        actor: DentalAssistant
        preconditions:
          - "sterilization_load.spore_result == PENDING"
          - "logical clock instant >= sterilization_load.incubation_ends_at"
          - "acting staff id != sterilization_load.loaded_by_staff_id"
        side_effects:
          - "sets SterilizationLoad.result_recorded_at and result_recorded_by_staff_id"
          - "sets PortableUnit.last_passed_load_at to this load's cycle_completed_at"
          - "if the unit was QUARANTINED, it returns to AVAILABLE"
          - "increments SterilizationLoad.version by 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /mobile-dentistry/sterilization-loads/{id}/spore-result with result=FAILED (or the lazy incubation-timeout sweep, which additionally sets auto_failed=true)"
        actor: DentalAssistant
        preconditions:
          - "sterilization_load.spore_result == PENDING"
          - "logical clock instant >= sterilization_load.incubation_ends_at"
          - "acting staff id != sterilization_load.loaded_by_staff_id (operator path only; the lazy sweep has no acting staff and sets result_recorded_by_staff_id to null)"
        side_effects:
          - "cascade link 1: sets SterilizationLoad.spore_result = FAILED and result_recorded_at"
          - "cascade link 2 (caused by link 1): every Procedure whose sterilization_load_id is in the tainted load set of calculation spore_taint_set and whose status == PERFORMED moves to TAINTED with taint_reason SPORE_TEST_FAILED; SterilizationLoad.tainted_procedure_count is set to that count; each affected Patient.varnish_applications_in_period and last_varnish_date are recomputed"
          - "cascade link 3 (caused by link 2): every Encounter owning at least one newly TAINTED procedure has tainted_procedure_count, subtotal_cents, supply_surcharge_cents and total_charge_cents recomputed, and if its billing_status == PRICED it reverts to UNBILLED with allowed_amount_cents, patient_responsibility_cents, plan_paid_cents, write_off_cents and pricing_regime cleared to 0/null"
          - "cascade link 4 (caused by link 3): every TreatmentPlan with plan_status == ACTIVE on such an encounter moves to SUPERSEDED with superseded_reason SPORE_TEST_FAILED and follow_up_due_date cleared to null"
          - "cascade link 5 (caused by link 4): every Referral on such a plan whose status IN {OPEN, SENT} moves to ABANDONED with abandon_reason PLAN_SUPERSEDED, abandoned_at and case_management_opened_at stamped, and attempt_count frozen"
          - "the unit moves to QUARANTINED"
          - "increments SterilizationLoad.version by 1"
        note: "Depth-5 cascade. The PASSED leg's side-effect set is disjoint from this one, which is what makes the fork non-linear."

  - entity: SiteVisit
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    shape: self_loop_with_fan_out_and_revert
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /mobile-dentistry/site-visits/{id}/reschedule"
        actor: SiteCoordinator
        preconditions:
          - "site_visit.status == SCHEDULED"
          - "site_visit.reschedule_count < VISIT_RESCHEDULE_MAX_COUNT"
          - "new scheduled_start_at is within VISIT_RESCHEDULE_WINDOW_DAYS of the current scheduled_start_at"
          - "the new window passes the unit overlap rule (priority 29) and the staff overlap rule (priority 30)"
        side_effects:
          - "replaces scheduled_start_at and scheduled_end_at"
          - "recomputes capacity_chair_minutes"
          - "increments SiteVisit.reschedule_count by 1"
          - "increments SiteVisit.version by 1"
      - from: SCHEDULED
        to: HOLD_BLOCKED
        trigger: "system event: cascade link 2 of POST /mobile-dentistry/site-holds"
        actor: system
        preconditions:
          - "site_visit.status == SCHEDULED"
          - "[scheduled_start_at, scheduled_end_at) intersects [hold.starts_at, hold.ends_at)"
        side_effects:
          - "increments SiteHold.blocked_visit_count by 1"
          - "cascade link 3 (caused by link 2): every Encounter on this visit whose clinical_status IN {REGISTERED, SCREENED} moves to DEFERRED with deferred_reason SITE_HOLD"
          - "increments SiteVisit.version by 1"
      - from: HOLD_BLOCKED
        to: SCHEDULED
        trigger: "POST /mobile-dentistry/site-holds/{id}/release"
        actor: ProgramAdmin
        preconditions:
          - "site_visit.status == HOLD_BLOCKED"
          - "no remaining ACTIVE SiteHold on the site intersects the visit window"
        side_effects:
          - "increments SiteVisit.version by 1"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /mobile-dentistry/site-visits/{id}/start"
        actor: FieldDentist
        preconditions:
          - "site_visit.status == SCHEDULED"
          - "site.status == ACTIVE"
          - "portable_unit.status == AVAILABLE"
          - "portable_unit.calibration_status IN {CURRENT, DUE}"
          - "no SterilizationLoad on the unit is PENDING inside its incubation window"
          - "lead staff credential_status == ACTIVE and license_state == site.state_code"
        side_effects:
          - "sets started_at to the logical clock instant"
          - "moves the PortableUnit from AVAILABLE to IN_SERVICE"
          - "increments SiteVisit.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /mobile-dentistry/site-visits/{id}/cancel, or cascade link 3 of a PROGRAM_PERIOD report submission"
        actor: SiteCoordinator
        preconditions:
          - "site_visit.status == SCHEDULED"
        side_effects:
          - "sets cancelled_at"
          - "every Encounter on this visit whose clinical_status == REGISTERED moves to NO_SHOW"
          - "increments SiteVisit.version by 1"
      - from: HOLD_BLOCKED
        to: CANCELLED
        trigger: "POST /mobile-dentistry/site-visits/{id}/cancel"
        actor: SiteCoordinator
        preconditions:
          - "site_visit.status == HOLD_BLOCKED"
        side_effects:
          - "sets cancelled_at"
          - "increments SiteVisit.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /mobile-dentistry/site-visits/{id}/complete"
        actor: FieldDentist
        preconditions:
          - "site_visit.status == IN_PROGRESS"
          - "no Procedure on this visit is still in status PLANNED"
        side_effects:
          - "sets completed_at"
          - "moves the PortableUnit from IN_SERVICE back to AVAILABLE"
          - "every Encounter on this visit whose clinical_status IN {EXAMINED, TREATED} moves to CLOSED"
          - "every Encounter on this visit whose clinical_status == REGISTERED moves to NO_SHOW"
          - "increments SiteVisit.version by 1"

  - entity: Encounter
    state_field: clinical_status
    initial_state: REGISTERED
    terminal_states: [CLOSED, DEFERRED, NO_SHOW]
    shape: branching_fan_out
    note: "Parallel axis A. Evolves independently of billing_status; an encounter can be CLOSED and still UNBILLED, or TREATED and already PAID."
    transitions:
      - from: REGISTERED
        to: SCREENED
        trigger: "POST /mobile-dentistry/encounters/{id}/screen"
        actor: FieldHygienist
        preconditions:
          - "encounter.clinical_status == REGISTERED"
          - "site_visit.status == IN_PROGRESS"
          - "consent.status == ACTIVE and consent.expires_at > logical clock instant"
          - "the screening staff member passes the supervision matrix for D0190"
        side_effects:
          - "records the seven screening findings on the encounter"
          - "computes Encounter.triage_band per calculation triage_band"
          - "creates a Procedure row: procedure_code D0190, status PERFORMED, performed_at = logical clock instant, performing_staff_id = the screening staff, sterilization_load_id = the most recent SterilizationLoad on the visit's portable unit, selected by cycle_completed_at DESC with created_at DESC as tie-break, regardless of its spore_result (null when the unit has no load) — the instruments actually on the tray come from the latest cycle, which is what makes a later FAILED indicator able to taint them"
          - "increments SiteVisit.booked_chair_minutes by PROCEDURE_CHAIR_MINUTES.D0190"
          - "increments Encounter.version by 1"
      - from: REGISTERED
        to: NO_SHOW
        trigger: "POST /mobile-dentistry/site-visits/{id}/cancel or /complete cascade"
        actor: system
        preconditions:
          - "encounter.clinical_status == REGISTERED"
        side_effects:
          - "increments Encounter.version by 1"
      - from: REGISTERED
        to: DEFERRED
        trigger: "system event: cascade link 3 of POST /mobile-dentistry/site-holds"
        actor: system
        preconditions:
          - "encounter.clinical_status == REGISTERED"
        side_effects:
          - "sets deferred_reason to SITE_HOLD"
          - "increments Encounter.version by 1"
      - from: SCREENED
        to: DEFERRED
        trigger: "system event: cascade link 3 of POST /mobile-dentistry/site-holds"
        actor: system
        preconditions:
          - "encounter.clinical_status == SCREENED"
        side_effects:
          - "sets deferred_reason to SITE_HOLD"
          - "increments Encounter.version by 1"
      - from: SCREENED
        to: EXAMINED
        trigger: "POST /mobile-dentistry/encounters/{id}/exam"
        actor: FieldDentist
        preconditions:
          - "encounter.clinical_status == SCREENED"
          - "site_visit.status == IN_PROGRESS"
          - "consent.status == ACTIVE"
          - "the examining staff member passes the supervision matrix for D0150"
          - "when exam_modality == TELEDENTISTRY: teledentistry_reviewed_at falls inside [site_visit.scheduled_start_at, site_visit.scheduled_start_at + TELEDENTISTRY_REVIEW_WINDOW_HOURS]"
        side_effects:
          - "sets exam_modality and, for teledentistry, teledentistry_reviewed_at"
          - "creates a Procedure row: procedure_code D0150, status PERFORMED, performed_at = logical clock instant, performing_staff_id = the examining staff, sterilization_load_id = the most recent SterilizationLoad on the visit's portable unit, selected by cycle_completed_at DESC with created_at DESC as tie-break, regardless of its spore_result (null when the unit has no load) — the instruments actually on the tray come from the latest cycle, which is what makes a later FAILED indicator able to taint them"
          - "increments SiteVisit.booked_chair_minutes by PROCEDURE_CHAIR_MINUTES.D0150"
          - "increments Encounter.version by 1"
      - from: EXAMINED
        to: TREATED
        trigger: "POST /mobile-dentistry/procedures/{id}/perform"
        actor: FieldHygienist
        preconditions:
          - "encounter.clinical_status == EXAMINED"
          - "the performed procedure belongs to this encounter"
        side_effects:
          - "increments Encounter.version by 1"
      - from: EXAMINED
        to: DEFERRED
        trigger: "system event: cascade link 3 of POST /mobile-dentistry/consents/{id}/amend-tier (downgrade)"
        actor: system
        preconditions:
          - "encounter.clinical_status == EXAMINED"
          - "the encounter has zero procedures left in status PLANNED or PERFORMED other than the auto-created D0190/D0150 rows"
        side_effects:
          - "sets deferred_reason to CONSENT_TIER_DOWNGRADE"
          - "increments Encounter.version by 1"
      - from: EXAMINED
        to: CLOSED
        trigger: "POST /mobile-dentistry/encounters/{id}/close, or cascade of POST /mobile-dentistry/site-visits/{id}/complete"
        actor: FieldDentist
        preconditions:
          - "encounter.clinical_status == EXAMINED"
          - "no Procedure on this encounter is still in status PLANNED"
        side_effects:
          - "increments Encounter.version by 1"
      - from: TREATED
        to: CLOSED
        trigger: "POST /mobile-dentistry/encounters/{id}/close, or cascade of POST /mobile-dentistry/site-visits/{id}/complete"
        actor: FieldDentist
        preconditions:
          - "encounter.clinical_status == TREATED"
          - "no Procedure on this encounter is still in status PLANNED"
        side_effects:
          - "increments Encounter.version by 1"

  - entity: Encounter
    state_field: billing_status
    initial_state: UNBILLED
    terminal_states: [PAID]
    shape: cyclic_with_revert
    note: "Parallel axis B on the same row as clinical_status."
    transitions:
      - from: UNBILLED
        to: PRICED
        trigger: "POST /mobile-dentistry/encounters/{id}/price"
        actor: BillingSpecialist
        preconditions:
          - "encounter.billing_status == UNBILLED"
          - "encounter.clinical_status IN {EXAMINED, TREATED, CLOSED}"
          - "encounter.coverage_id is not null and that coverage.verification_status == VERIFIED"
          - "when the coverage is UNINSURED: coverage.sliding_fee_band is not null"
        side_effects:
          - "runs calculations encounter_subtotal_cents, encounter_supply_surcharge_cents, encounter_total_charge_cents, encounter_allowed_amount_cents, patient_responsibility_cents, encounter_money_split"
          - "pins Encounter.pricing_regime"
          - "increments Encounter.version by 1"
      - from: PRICED
        to: UNBILLED
        trigger: "system event: cascade link 3 of a FAILED spore result, or POST /mobile-dentistry/procedures/{id}/void"
        actor: system
        preconditions:
          - "encounter.billing_status == PRICED"
        side_effects:
          - "clears allowed_amount_cents, patient_responsibility_cents, plan_paid_cents, write_off_cents to 0 and pricing_regime to null"
          - "recomputes subtotal_cents, supply_surcharge_cents and total_charge_cents from the surviving PERFORMED procedures"
          - "increments Encounter.version by 1"
      - from: PRICED
        to: CLAIMED
        trigger: "POST /mobile-dentistry/encounters/{id}/claim"
        actor: BillingSpecialist
        preconditions:
          - "encounter.billing_status == PRICED"
          - "when pricing_regime == MEDICAID_ENCOUNTER_RATE: patient_responsibility_cents == 0"
        side_effects:
          - "increments Encounter.version by 1"
      - from: CLAIMED
        to: PAID
        trigger: "POST /mobile-dentistry/encounters/{id}/adjudicate with outcome=PAID"
        actor: BillingSpecialist
        preconditions:
          - "encounter.billing_status == CLAIMED"
        side_effects:
          - "increments Encounter.version by 1"
      - from: CLAIMED
        to: DENIED
        trigger: "POST /mobile-dentistry/encounters/{id}/adjudicate with outcome=DENIED"
        actor: BillingSpecialist
        preconditions:
          - "encounter.billing_status == CLAIMED"
        side_effects:
          - "records denial_reason"
          - "increments Encounter.version by 1"
      - from: DENIED
        to: CLAIMED
        trigger: "POST /mobile-dentistry/encounters/{id}/claim (resubmission)"
        actor: BillingSpecialist
        preconditions:
          - "encounter.billing_status == DENIED"
        side_effects:
          - "clears denial_reason to null"
          - "increments Encounter.version by 1"
        note: "Cycle leg; a denied claim can be resubmitted without repricing."

  - entity: Procedure
    state_field: status
    initial_state: PLANNED
    terminal_states: [INELIGIBLE, VOIDED]
    shape: three_way_terminal_fan_out
    transitions:
      - from: PLANNED
        to: PERFORMED
        trigger: "POST /mobile-dentistry/procedures/{id}/perform"
        actor: FieldHygienist
        preconditions:
          - "procedure.status == PLANNED"
          - "site_visit.status == IN_PROGRESS"
          - "the performing staff member passes the supervision matrix for procedure_code"
          - "for D1206: the varnish interval and per-period cap rules pass"
          - "for D1351: the tooth number and surface are eligible"
        side_effects:
          - "sets performed_at, performing_staff_id and sterilization_load_id"
          - "for D1206: increments Patient.varnish_applications_in_period by 1 and sets Patient.last_varnish_date"
          - "moves the Encounter's clinical_status from EXAMINED to TREATED when it is EXAMINED"
          - "increments Procedure.version by 1"
      - from: PLANNED
        to: INELIGIBLE
        trigger: "system event: cascade link 2 of POST /mobile-dentistry/consents/{id}/amend-tier (downgrade), or of POST /mobile-dentistry/consents/{id}/revoke"
        actor: system
        preconditions:
          - "procedure.status == PLANNED"
          - "procedure.required_tier rank > the surviving consent's scope_tier rank, or the consent was revoked"
        side_effects:
          - "sets void_reason to CONSENT_TIER_DOWNGRADE"
          - "decrements SiteVisit.booked_chair_minutes by procedure.chair_minutes"
          - "increments Procedure.version by 1"
      - from: PLANNED
        to: VOIDED
        trigger: "POST /mobile-dentistry/procedures/{id}/void"
        actor: FieldDentist
        preconditions:
          - "procedure.status == PLANNED"
        side_effects:
          - "sets void_reason from the payload"
          - "decrements SiteVisit.booked_chair_minutes by procedure.chair_minutes"
          - "increments Procedure.version by 1"
      - from: PERFORMED
        to: VOIDED
        trigger: "POST /mobile-dentistry/procedures/{id}/void"
        actor: FieldDentist
        preconditions:
          - "procedure.status == PERFORMED"
        side_effects:
          - "sets void_reason from the payload"
          - "decrements SiteVisit.booked_chair_minutes by procedure.chair_minutes"
          - "for D1206: decrements Patient.varnish_applications_in_period by 1 and recomputes Patient.last_varnish_date"
          - "recomputes the Encounter's subtotal_cents, supply_surcharge_cents and total_charge_cents; if billing_status == PRICED it reverts to UNBILLED"
          - "increments Procedure.version by 1"
      - from: PERFORMED
        to: TAINTED
        trigger: "system event: cascade link 2 of a FAILED spore result"
        actor: system
        preconditions:
          - "procedure.status == PERFORMED"
          - "procedure.sterilization_load_id is in the tainted load set"
        side_effects:
          - "sets taint_reason to SPORE_TEST_FAILED"
          - "decrements SiteVisit.booked_chair_minutes by procedure.chair_minutes (the booking ledger tracks only PLANNED and PERFORMED rows)"
          - "for D1206: decrements Patient.varnish_applications_in_period by 1 and recomputes Patient.last_varnish_date"
          - "increments Procedure.version by 1"
        note: "TAINTED leaves the PLANNED-or-PERFORMED booking set, exactly like VOIDED and INELIGIBLE, so the chair-minute conservation identity is preserved without special-casing."
      - from: TAINTED
        to: VOIDED
        trigger: "POST /mobile-dentistry/procedures/{id}/void"
        actor: FieldDentist
        preconditions:
          - "procedure.status == TAINTED"
        side_effects:
          - "sets void_reason from the payload"
          - "decrements SiteVisit.booked_chair_minutes by procedure.chair_minutes"
          - "increments Procedure.version by 1"

  - entity: TreatmentPlan
    state_field: plan_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, SUPERSEDED, CANCELLED]
    shape: self_loop_with_three_way_terminal_fan_out
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /mobile-dentistry/treatment-plans/{id}/activate"
        actor: FieldDentist
        preconditions:
          - "treatment_plan.plan_status == DRAFT"
          - "encounter.clinical_status IN {EXAMINED, TREATED, CLOSED}"
        side_effects:
          - "sets activated_on to the logical clock date"
          - "computes follow_up_due_date per calculation follow_up_due_date"
          - "sets follow_up_status per calculation follow_up_status"
          - "increments TreatmentPlan.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /mobile-dentistry/treatment-plans/{id}/follow-up-contact"
        actor: SiteCoordinator
        preconditions:
          - "treatment_plan.plan_status == ACTIVE"
        side_effects:
          - "sets last_contact_at to the logical clock instant"
          - "increments contact_attempt_count by 1"
          - "recomputes follow_up_due_date from the contact date using the same band cadence"
          - "sets follow_up_status to CONTACTED"
          - "increments TreatmentPlan.version by 1"
        note: "Self-loop; the follow-up cadence restarts from each recorded contact."
      - from: ACTIVE
        to: COMPLETED
        trigger: "system event: POST /mobile-dentistry/referrals/{id}/record-response with outcome=COMPLETED"
        actor: system
        preconditions:
          - "treatment_plan.plan_status == ACTIVE"
          - "the referral's status == ACCEPTED"
        side_effects:
          - "clears follow_up_due_date to null and sets follow_up_status to CONTACTED"
          - "increments TreatmentPlan.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: cascade link 4 of a FAILED spore result"
        actor: system
        preconditions:
          - "treatment_plan.plan_status == ACTIVE"
          - "the plan's encounter gained at least one TAINTED procedure"
        side_effects:
          - "sets superseded_reason to SPORE_TEST_FAILED"
          - "clears follow_up_due_date to null"
          - "increments TreatmentPlan.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system event: cascade link 3 of POST /mobile-dentistry/consents/{id}/amend-tier (downgrade)"
        actor: system
        preconditions:
          - "treatment_plan.plan_status == ACTIVE"
          - "the plan's encounter moved to DEFERRED with deferred_reason CONSENT_TIER_DOWNGRADE"
        side_effects:
          - "sets superseded_reason to CONSENT_TIER_DOWNGRADE"
          - "clears follow_up_due_date to null"
          - "increments TreatmentPlan.version by 1"

  - entity: Referral
    state_field: status
    initial_state: OPEN
    terminal_states: [COMPLETED, ABANDONED]
    shape: capped_cycle
    transitions:
      - from: OPEN
        to: SENT
        trigger: "POST /mobile-dentistry/referrals/{id}/send"
        actor: FieldDentist
        preconditions:
          - "referral.status == OPEN"
          - "treatment_plan.plan_status == ACTIVE"
        side_effects:
          - "increments attempt_count by 1"
          - "sets last_sent_at to the logical clock instant"
          - "computes due_at per calculation referral_due_at on the first send only"
          - "computes next_eligible_send_at = last_sent_at + REFERRAL_NO_RESPONSE_DAYS"
          - "increments Referral.version by 1"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /mobile-dentistry/referrals/{id}/record-response with outcome=ACCEPTED"
        actor: FieldDentist
        preconditions:
          - "referral.status == SENT"
        side_effects:
          - "increments Referral.version by 1"
      - from: SENT
        to: DECLINED
        trigger: "POST /mobile-dentistry/referrals/{id}/record-response with outcome=DECLINED"
        actor: FieldDentist
        preconditions:
          - "referral.status == SENT"
        side_effects:
          - "increments Referral.version by 1"
      - from: SENT
        to: NO_RESPONSE
        trigger: "POST /mobile-dentistry/referrals/{id}/record-response with outcome=NO_RESPONSE"
        actor: FieldDentist
        preconditions:
          - "referral.status == SENT"
        side_effects:
          - "increments Referral.version by 1"
        note: |
          Deliberately carries NO timing precondition: the dental home simply did not answer, and the
          clinic may record that at any moment. The waiting period lives on the RE-SEND leg (validation
          priority 33), which is what makes ERR_REFERRAL_NOT_DUE reachable at all — if entry into
          NO_RESPONSE itself required next_eligible_send_at to have passed, no request could ever be
          in NO_RESPONSE and still be too early to re-send.
      - from: NO_RESPONSE
        to: SENT
        trigger: "POST /mobile-dentistry/referrals/{id}/send (re-refer)"
        actor: FieldDentist
        preconditions:
          - "referral.status == NO_RESPONSE"
          - "referral.attempt_count < REFERRAL_MAX_ATTEMPTS"
          - "logical clock instant >= referral.next_eligible_send_at"
        side_effects:
          - "increments attempt_count by 1"
          - "sets last_sent_at and recomputes next_eligible_send_at"
          - "leaves due_at unchanged (the SLA clock runs from the first send)"
          - "increments Referral.version by 1"
        note: "Cycle leg."
      - from: DECLINED
        to: SENT
        trigger: "POST /mobile-dentistry/referrals/{id}/send (re-refer to another dental home)"
        actor: FieldDentist
        preconditions:
          - "referral.status == DECLINED"
          - "referral.attempt_count < REFERRAL_MAX_ATTEMPTS"
        side_effects:
          - "replaces dental_home_name when the payload supplies one"
          - "increments attempt_count by 1"
          - "sets last_sent_at and recomputes next_eligible_send_at"
          - "increments Referral.version by 1"
        note: "Cycle leg; a DECLINED referral has no waiting period, unlike NO_RESPONSE."
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /mobile-dentistry/referrals/{id}/record-response with outcome=COMPLETED"
        actor: FieldDentist
        preconditions:
          - "referral.status == ACCEPTED"
        side_effects:
          - "moves the TreatmentPlan from ACTIVE to COMPLETED"
          - "increments Referral.version by 1"
      - from: NO_RESPONSE
        to: ABANDONED
        trigger: "POST /mobile-dentistry/referrals/{id}/send when attempt_count has already reached REFERRAL_MAX_ATTEMPTS"
        actor: system
        preconditions:
          - "referral.status == NO_RESPONSE"
          - "referral.attempt_count == REFERRAL_MAX_ATTEMPTS"
          - "logical clock instant >= referral.next_eligible_send_at"
        side_effects:
          - "sets abandoned_at, case_management_opened_at and abandon_reason ATTEMPT_CAP_REACHED"
          - "leaves attempt_count at REFERRAL_MAX_ATTEMPTS"
          - "increments Referral.version by 1"
          - "the triggering request is then refused with ERR_REFERRAL_CAP_REACHED (mutate-then-reject)"
        note: "Once the referral is ALREADY ABANDONED, the state gate at priority 10 pre-empts and the same send surfaces ERR_INVALID_STATE, not ERR_REFERRAL_CAP_REACHED, with no further write."
      - from: DECLINED
        to: ABANDONED
        trigger: "POST /mobile-dentistry/referrals/{id}/send when attempt_count has already reached REFERRAL_MAX_ATTEMPTS"
        actor: system
        preconditions:
          - "referral.status == DECLINED"
          - "referral.attempt_count == REFERRAL_MAX_ATTEMPTS"
        side_effects:
          - "sets abandoned_at, case_management_opened_at and abandon_reason ATTEMPT_CAP_REACHED"
          - "increments Referral.version by 1"
          - "the triggering request is then refused with ERR_REFERRAL_CAP_REACHED (mutate-then-reject)"
      - from: OPEN
        to: ABANDONED
        trigger: "system event: cascade link 5 of a FAILED spore result"
        actor: system
        preconditions:
          - "referral.status == OPEN"
          - "the referral's TreatmentPlan moved to SUPERSEDED"
        side_effects:
          - "sets abandoned_at, case_management_opened_at and abandon_reason PLAN_SUPERSEDED"
          - "increments Referral.version by 1"
      - from: SENT
        to: ABANDONED
        trigger: "system event: cascade link 5 of a FAILED spore result"
        actor: system
        preconditions:
          - "referral.status == SENT"
          - "the referral's TreatmentPlan moved to SUPERSEDED"
        side_effects:
          - "sets abandoned_at, case_management_opened_at and abandon_reason PLAN_SUPERSEDED"
          - "freezes attempt_count at its current value"
          - "increments Referral.version by 1"

  - entity: Coverage
    state_field: verification_status
    initial_state: UNVERIFIED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /mobile-dentistry/coverages/{id}/verify"
        actor: BillingSpecialist
        preconditions:
          - "coverage.verification_status == UNVERIFIED"
          - "verified_through_date >= the logical clock date"
          - "when payer_type == UNINSURED: patient.annual_household_income_cents is not null"
        side_effects:
          - "sets verified_at and verified_through_date"
          - "when payer_type == UNINSURED: computes fpl_percent, sliding_fee_band and determination_date"
          - "increments Coverage.version by 1"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system event: lazy coverage-expiry sweep at validation priority 34"
        actor: system
        preconditions:
          - "coverage.verification_status == VERIFIED"
          - "coverage.verified_through_date < the logical clock date"
        side_effects:
          - "increments Coverage.version by 1"
          - "the triggering pricing request is then refused with ERR_COVERAGE_UNVERIFIED (mutate-then-reject)"
        note: "When the coverage is ALREADY EXPIRED or UNVERIFIED, priority 34 surfaces the same ERR_COVERAGE_UNVERIFIED without any write and without bumping Coverage.version."
      - from: EXPIRED
        to: VERIFIED
        trigger: "POST /mobile-dentistry/coverages/{id}/verify (re-verification)"
        actor: BillingSpecialist
        preconditions:
          - "coverage.verification_status == EXPIRED"
          - "verified_through_date >= the logical clock date"
        side_effects:
          - "sets verified_at and the new verified_through_date"
          - "when payer_type == UNINSURED: recomputes fpl_percent, sliding_fee_band and determination_date"
          - "increments Coverage.version by 1"
        note: "Cycle leg."

  - entity: Report
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUBMITTED]
    shape: self_loop_with_cycle
    transitions:
      - from: DRAFT
        to: GENERATED
        trigger: "POST /mobile-dentistry/reports/{id}/generate"
        actor: ProgramAdmin
        preconditions:
          - "report.status == DRAFT"
        side_effects:
          - "builds Report.payload per calculation report_payload"
          - "sets generated_at"
          - "increments Report.version by 1"
      - from: GENERATED
        to: GENERATED
        trigger: "POST /mobile-dentistry/reports/{id}/generate (regeneration)"
        actor: ProgramAdmin
        preconditions:
          - "report.status == GENERATED"
        side_effects:
          - "rebuilds Report.payload and refreshes generated_at"
          - "increments Report.version by 1"
        note: "Self-loop."
      - from: GENERATED
        to: STALE
        trigger: "system event: any write listed in PERIOD_GATED_ENDPOINTS succeeds on an entity resolving to this report's program_period_id"
        actor: system
        preconditions:
          - "report.status == GENERATED"
          - "report.report_type == PROGRAM_PERIOD"
        side_effects:
          - "sets stale_reason to PERIOD_DATA_CHANGED"
          - "increments Report.version by 1"
      - from: STALE
        to: GENERATED
        trigger: "POST /mobile-dentistry/reports/{id}/generate"
        actor: ProgramAdmin
        preconditions:
          - "report.status == STALE"
        side_effects:
          - "rebuilds Report.payload, refreshes generated_at and clears stale_reason to null"
          - "increments Report.version by 1"
        note: "Cycle leg."
      - from: GENERATED
        to: SUBMITTED
        trigger: "POST /mobile-dentistry/reports/{id}/submit"
        actor: ProgramAdmin
        preconditions:
          - "report.status == GENERATED"
          - "report.report_type == PROGRAM_PERIOD"
          - "program_period.status == REPORTING"
        side_effects:
          - "sets submitted_at and ProgramPeriod.state_submission_ref"
          - "cascade link 2: moves the ProgramPeriod from REPORTING to SUBMITTED and stamps frozen_at"
          - "cascade link 3: every SiteVisit in the period with status == SCHEDULED moves to CANCELLED"
          - "increments Report.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:

  - rule_id: consent-amend-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /mobile-dentistry/consents/{id}/amend-tier"
    occ_field: "expected_patient_version"
    description: |
      Amending a consent's scope tier mints a replacement Consent that legitimately supersedes
      the prior one for the same patient. A caller whose view of the Patient is stale — its
      version has advanced since the caller last read it, for example because an earlier
      amendment already superseded the consent it is holding — is rejected on the version
      check rather than being allowed to write a second superseding consent over the first.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: encounter-create-stale-visit
    parent_entity: SiteVisit
    write_endpoint: "POST /mobile-dentistry/encounters"
    occ_field: "expected_site_visit_version"
    description: |
      Registering a patient at a site visit is priced against the visit's remaining chair
      capacity, which the caller reads from the SiteVisit before deciding to register. A
      caller whose SiteVisit version has advanced since that read — another registration or
      a reschedule has changed the capacity picture — is rejected on the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: procedure-plan-stale-encounter
    parent_entity: Encounter
    write_endpoint: "POST /mobile-dentistry/procedures"
    occ_field: "expected_encounter_version"
    description: |
      Planning a procedure is decided against the encounter's consent tier and the visit's
      remaining chair minutes, both read from the Encounter. A caller whose Encounter version
      has advanced since that read — the consent was amended, a sibling procedure was planned,
      or the encounter was repriced — is rejected on the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: consent_expires_at
    trigger: "on POST /mobile-dentistry/consents and on every Consent verify transition (PENDING_VERIFICATION_to_ACTIVE, ACTIVE_to_ACTIVE)"
    algorithm: threshold
    formula: |
      if consent.regime == "SCHOOL_GUARDIAN":
          expires_at          = program_period.ends_on + "T23:59:59Z"
          reaffirmation_due_at = null
      else:  # SNF_RESPONSIBLE_PARTY
          expires_at          = consent.signed_at + CONSENT_SNF_REAFFIRMATION_DAYS days
          reaffirmation_due_at = expires_at
    input_set: "The Consent row itself plus its referenced ProgramPeriod. No other rows participate."
    constants:
      CONSENT_SNF_REAFFIRMATION_DAYS: 365
    precision: "ISO 8601 UTC with three fractional digits on output; date arithmetic is exact calendar-day addition"
    variants:
      - name: school_year_scoped
        when: "consent.regime == SCHOOL_GUARDIAN"
        difference: "Expiry is pinned to the ProgramPeriod's ends_on at 23:59:59Z and is completely independent of signed_at; a consent signed on the last day of the period expires that same night."
      - name: snf_standing_with_annual_reaffirmation
        when: "consent.regime == SNF_RESPONSIBLE_PARTY"
        difference: "Expiry is signed_at + 365 days and is completely independent of the ProgramPeriod; each reaffirmation resets signed_at to the clock and slides the expiry forward another 365 days."

  - name: triage_band
    trigger: "on the Encounter clinical transition REGISTERED_to_SCREENED"
    algorithm: threshold
    formula: |
      f = the seven screening findings recorded on the encounter
      if site.site_type == "SCHOOL":
          if f.abscess_or_swelling == true:                                              band = "URGENT"
          elif f.pain_reported == true and f.cavitated_lesion_count >= SCHOOL_URGENT_LESION_THRESHOLD:
                                                                                          band = "URGENT"
          elif f.cavitated_lesion_count >= 1 or f.untreated_decay_present == true:        band = "EARLY_CARE_NEEDED"
          else:                                                                           band = "NO_OBVIOUS_PROBLEM"
      else:  # SNF
          if f.abscess_or_swelling == true or f.pain_reported == true:                    band = "URGENT"
          elif f.cavitated_lesion_count >= 1 and f.medical_complexity_count >= SNF_MEDICAL_COMPLEXITY_THRESHOLD:
                                                                                          band = "URGENT"
          elif f.cavitated_lesion_count >= 1 or f.denture_problem == true
               or f.oral_hygiene_score >= SNF_ORAL_HYGIENE_POOR_THRESHOLD:                band = "EARLY_CARE_NEEDED"
          else:                                                                           band = "NO_OBVIOUS_PROBLEM"
    input_set: "Only the findings supplied on the screen request and Site.site_type of the visit's site."
    constants:
      SCHOOL_URGENT_LESION_THRESHOLD: 1
      SNF_MEDICAL_COMPLEXITY_THRESHOLD: 3
      SNF_ORAL_HYGIENE_POOR_THRESHOLD: 3
    precision: "exact enum selection, first matching branch wins"
    variants:
      - name: school_criteria
        when: "site.site_type == SCHOOL"
        difference: "Pain alone never reaches URGENT — it must be paired with at least one cavitated lesion. medical_complexity_count, denture_problem and oral_hygiene_score are ignored entirely."
      - name: snf_criteria
        when: "site.site_type == SNF"
        difference: "Pain alone reaches URGENT on its own; medical complexity of 3 or more escalates a single cavitated lesion to URGENT; denture_problem and oral_hygiene_score can each raise a finding-free mouth to EARLY_CARE_NEEDED."

  - name: unit_calibration_status
    trigger: "recomputed on every read of a PortableUnit and on every validation that consults it (priority 15)"
    algorithm: threshold
    formula: |
      if unit.last_calibrated_on is null:                                    status = "EXPIRED"
      else:
          due = unit.last_calibrated_on + UNIT_CALIBRATION_VALID_DAYS days
          unit.calibration_due_on = due
          today = the logical clock date
          if today > due:                                                    status = "EXPIRED"
          elif today >= due - UNIT_CALIBRATION_DUE_WARNING_DAYS days:        status = "DUE"
          else:                                                              status = "CURRENT"
    input_set: "The PortableUnit row and the logical clock only."
    constants:
      UNIT_CALIBRATION_VALID_DAYS: 180
      UNIT_CALIBRATION_DUE_WARNING_DAYS: 30
    precision: "calendar-date comparison, no time-of-day component"

  - name: spore_taint_set
    trigger: "on the SterilizationLoad transition PENDING_to_FAILED"
    algorithm: chronological
    formula: |
      unit    = the failed load's portable unit
      cutoff_by_pass  = unit.last_passed_load_at            # may be null
      cutoff_by_window = failed_load.cycle_completed_at - SPORE_TAINT_LOOKBACK_DAYS days
      cutoff = max(cutoff_by_pass, cutoff_by_window) if cutoff_by_pass is not null else cutoff_by_window
      tainted_loads = every SterilizationLoad L on this unit with
                          L.cycle_completed_at >  cutoff
                      and L.cycle_completed_at <= failed_load.cycle_completed_at
                      and L.spore_result != "PASSED"
      # ties on cycle_completed_at are ordered by created_at ASC; the order is observable
      # because tainted_procedure_count is stamped on the failed load in that order
      tainted_procedures = every Procedure P with P.sterilization_load_id in tainted_loads
                           and P.status == "PERFORMED"
    input_set: "SterilizationLoad rows on the failing unit only; loads on other units are never in scope. Procedures already VOIDED, INELIGIBLE, PLANNED or TAINTED are excluded."
    constants:
      SPORE_TAINT_LOOKBACK_DAYS: 14
      SPORE_INCUBATION_HOURS: 24
    precision: "instant comparison at millisecond resolution; the lower cutoff is exclusive and the upper bound is inclusive"

  - name: procedure_static_attributes
    trigger: "on POST /mobile-dentistry/procedures and on each cascade-created procedure inside the screen and exam transitions"
    algorithm: aggregation
    formula: |
      procedure.required_tier  = PROCEDURE_REQUIRED_TIER[procedure_code]
      procedure.chair_minutes  = PROCEDURE_CHAIR_MINUTES[procedure_code]
      procedure.charge_cents   = PROCEDURE_FEE_SCHEDULE_CENTS[procedure_code]
    input_set: "The procedure_code alone; nothing else participates."
    constants:
      PROCEDURE_REQUIRED_TIER:
        D0190: SCREENING_ONLY
        D0150: SCREENING_ONLY
        D1206: SCREENING_FLUORIDE
        D1351: SCREENING_FLUORIDE_SEALANT
        D0272: FULL_WITH_RADIOGRAPHS
      PROCEDURE_CHAIR_MINUTES:
        D0190: 10
        D0150: 15
        D1206: 8
        D1351: 12
        D0272: 10
      PROCEDURE_FEE_SCHEDULE_CENTS:
        D0190: 3475
        D0150: 5825
        D1206: 4525
        D1351: 6350
        D0272: 4150
      CONSENT_TIER_RANK:
        SCREENING_ONLY: 1
        SCREENING_FLUORIDE: 2
        SCREENING_FLUORIDE_SEALANT: 3
        FULL_WITH_RADIOGRAPHS: 4
    precision: "integer cents and integer minutes, no rounding"

  - name: site_visit_capacity_chair_minutes
    trigger: "on POST /mobile-dentistry/site-visits and on the SiteVisit self-loop SCHEDULED_to_SCHEDULED"
    algorithm: threshold
    formula: |
      duration_minutes       = (scheduled_end_at - scheduled_start_at) in whole minutes
      capacity_chair_minutes = floor(chair_count * duration_minutes * CHAIR_UTILIZATION_CAP_PCT)
    input_set: "The SiteVisit row's own scheduling fields only."
    constants:
      CHAIR_UTILIZATION_CAP_PCT: 0.85
    precision: "floor to whole minutes"

  - name: site_visit_booked_chair_minutes
    trigger: "on every Procedure creation, void, ineligibility cascade, and on the screen and exam transitions"
    algorithm: aggregation
    formula: |
      booked_chair_minutes = sum of Procedure.chair_minutes over every Procedure P where
          P.encounter_id is an encounter of this site visit
          and P.status in {"PLANNED", "PERFORMED"}
      # TAINTED, VOIDED and INELIGIBLE procedures are excluded: TAINTED procedures keep the
      # chair time they really consumed only in the historical record, not in the booking ledger
    input_set: "Procedures under encounters of this site visit; status filter {PLANNED, PERFORMED}."
    constants: {}
    precision: "integer minutes; recomputed in full on every mutation, never incrementally patched"

  - name: sliding_fee_band
    trigger: "on the Coverage transitions UNVERIFIED_to_VERIFIED and EXPIRED_to_VERIFIED when payer_type == UNINSURED"
    algorithm: threshold
    formula: |
      threshold_cents = FPL_BASE_ANNUAL_CENTS + FPL_PER_ADDITIONAL_PERSON_CENTS * (patient.household_size - 1)
      fpl_percent     = round_half_up(patient.annual_household_income_cents / threshold_cents * 100, 1)
      if   fpl_percent <= SLIDING_FEE_BAND_A_MAX_FPL_PCT: band = "A"
      elif fpl_percent <= SLIDING_FEE_BAND_B_MAX_FPL_PCT: band = "B"
      elif fpl_percent <= SLIDING_FEE_BAND_C_MAX_FPL_PCT: band = "C"
      elif fpl_percent <= SLIDING_FEE_BAND_D_MAX_FPL_PCT: band = "D"
      else:                                               band = "E"
      determination_date = the logical clock date
      # every band boundary is INCLUSIVE of its upper bound: fpl_percent exactly 100.0 is band A,
      # exactly 138.0 is band B, exactly 175.0 is band C, exactly 200.0 is band D
    input_set: "The Patient's household_size and annual_household_income_cents at the instant of verification; later edits do not retroactively re-band a verified coverage."
    constants:
      FPL_BASE_ANNUAL_CENTS: 1560000
      FPL_PER_ADDITIONAL_PERSON_CENTS: 550000
      SLIDING_FEE_BAND_A_MAX_FPL_PCT: 100.0
      SLIDING_FEE_BAND_B_MAX_FPL_PCT: 138.0
      SLIDING_FEE_BAND_C_MAX_FPL_PCT: 175.0
      SLIDING_FEE_BAND_D_MAX_FPL_PCT: 200.0
    precision: "fpl_percent to 1 decimal place, round_half_up, computed once and stored"

  - name: encounter_subtotal_cents
    trigger: "on the Encounter billing transition UNBILLED_to_PRICED, and on every recompute caused by a procedure void or taint"
    algorithm: aggregation
    formula: |
      subtotal_cents = sum of Procedure.charge_cents over every Procedure P where
          P.encounter_id == encounter.id and P.status == "PERFORMED"
      # PLANNED, TAINTED, VOIDED and INELIGIBLE procedures contribute nothing
    input_set: "Procedures of this encounter with status exactly PERFORMED."
    constants: {}
    precision: "integer cents; no rounding occurs at this step"

  - name: encounter_supply_surcharge_cents
    trigger: "immediately after encounter_subtotal_cents, inside the same pricing pass"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED and is the whole point of this rule: the surcharge tier is
      # keyed on subtotal_cents (the PRE-surcharge figure) and is computed exactly once. It is
      # never re-evaluated against total_charge_cents even though total_charge_cents contains it.
      if   subtotal_cents == 0:                                         supply_surcharge_cents = 0
      elif subtotal_cents <= SUPPLY_SURCHARGE_TIER1_MAX_SUBTOTAL_CENTS: supply_surcharge_cents = SUPPLY_SURCHARGE_TIER1_CENTS
      elif subtotal_cents <= SUPPLY_SURCHARGE_TIER2_MAX_SUBTOTAL_CENTS: supply_surcharge_cents = SUPPLY_SURCHARGE_TIER2_CENTS
      else:                                                             supply_surcharge_cents = SUPPLY_SURCHARGE_TIER3_CENTS
      total_charge_cents = subtotal_cents + supply_surcharge_cents
    input_set: "encounter.subtotal_cents only."
    constants:
      SUPPLY_SURCHARGE_TIER1_MAX_SUBTOTAL_CENTS: 5000
      SUPPLY_SURCHARGE_TIER2_MAX_SUBTOTAL_CENTS: 15000
      SUPPLY_SURCHARGE_TIER1_CENTS: 500
      SUPPLY_SURCHARGE_TIER2_CENTS: 1200
      SUPPLY_SURCHARGE_TIER3_CENTS: 2000
    precision: "integer cents; tier bounds are inclusive of their upper limit"

  - name: encounter_allowed_amount_cents
    trigger: "on the Encounter billing transition UNBILLED_to_PRICED"
    algorithm: tiered_pricing
    formula: |
      regime = MEDICAID_ENCOUNTER_RATE   if coverage.payer_type == "MEDICAID_MCO"
             = COMMERCIAL_FEE_SCHEDULE   if coverage.payer_type == "COMMERCIAL_FFS"
             = UNINSURED_SLIDING_FEE     if coverage.payer_type == "UNINSURED"

      if regime == MEDICAID_ENCOUNTER_RATE:
          allowed_amount_cents = 0 if performed_count == 0
                                 else min(MEDICAID_ENCOUNTER_RATE_CENTS, total_charge_cents)
      elif regime == COMMERCIAL_FEE_SCHEDULE:
          allowed_amount_cents = sum over PERFORMED procedures P of
                                     min(P.charge_cents, COMMERCIAL_ALLOWED_SCHEDULE_CENTS[P.procedure_code])
      else:  # UNINSURED_SLIDING_FEE
          allowed_amount_cents = patient_responsibility_cents   # self-pay: the allowed amount IS the patient's share
    input_set: "The encounter's PERFORMED procedures and the coverage's payer_type. The surcharge is inside total_charge_cents for the Medicaid cap but is NOT itself allowable under the commercial schedule."
    constants:
      MEDICAID_ENCOUNTER_RATE_CENTS: 18500
      COMMERCIAL_ALLOWED_SCHEDULE_CENTS:
        D0190: 2600
        D0150: 4300
        D1206: 3375
        D1351: 4725
        D0272: 3100
    precision: "integer cents"
    variants:
      - name: medicaid_encounter_rate
        when: "coverage.payer_type == MEDICAID_MCO"
        difference: "One all-inclusive per-visit rate capped by the encounter's own total charge, so procedure mix is invisible: an encounter totalling 9200 cents is allowed 9200, and an encounter totalling 30875 cents is allowed only 18500."
      - name: commercial_fee_schedule
        when: "coverage.payer_type == COMMERCIAL_FFS"
        difference: "Per-line minimum of billed charge and the contracted schedule, summed; the supply surcharge is never allowable. The same 9200-cent encounter is allowed 5975, not 9200."

  - name: patient_responsibility_cents
    trigger: "on the Encounter billing transition UNBILLED_to_PRICED"
    algorithm: waterfall_allocation
    formula: |
      performed = the encounter's PERFORMED procedures, ordered by created_at ASC
      if len(performed) == 0:
          patient_responsibility_cents = 0
      elif coverage.payer_type == "MEDICAID_MCO":
          patient_responsibility_cents = 0            # balance billing is prohibited
      elif coverage.payer_type == "COMMERCIAL_FFS":
          patient_responsibility_cents = round_half_up(allowed_amount_cents * COMMERCIAL_COINSURANCE_PCT)
      else:  # UNINSURED
          discount = SLIDING_FEE_DISCOUNT[coverage.sliding_fee_band]
          # ROUNDING ORDER IS PINNED: round EACH procedure's discounted amount to the cent with
          # round_half_up FIRST, THEN sum. Summing first and rounding once is a different number.
          per_line = [ round_half_up(P.charge_cents * (1 - discount)) for P in performed ]
          discounted_total = sum(per_line)
          if coverage.sliding_fee_band == "E":
              patient_responsibility_cents = discounted_total
          else:
              patient_responsibility_cents = max(discounted_total, SLIDING_FEE_NOMINAL_FEE_CENTS)

      # Manual override. When the price request supplies manual_patient_responsibility_cents and the
      # coverage is NOT MEDICAID_MCO (priority 37 refuses that combination outright), the supplied
      # value REPLACES the computed share, and the allowed amount follows:
      #   UNINSURED       -> allowed_amount_cents = manual_patient_responsibility_cents
      #   COMMERCIAL_FFS  -> allowed_amount_cents is unchanged; only plan_paid_cents absorbs the delta
      # The conservation identity in encounter_money_split still has to close afterwards.
    input_set: "PERFORMED procedures only, ordered by created_at ASC; the supply surcharge is never part of the patient's sliding-fee share."
    constants:
      COMMERCIAL_COINSURANCE_PCT: 0.20
      SLIDING_FEE_NOMINAL_FEE_CENTS: 2500
      SLIDING_FEE_DISCOUNT:
        A: 1.00
        B: 0.75
        C: 0.55
        D: 0.35
        E: 0.00
    precision: "round_half_up to whole cents, applied per line before summation"
    variants:
      - name: insured_cost_share
        when: "coverage.payer_type IN {MEDICAID_MCO, COMMERCIAL_FFS}"
        difference: "A single coinsurance multiplication against the allowed amount (or a flat zero for Medicaid); the patient's household size and income never enter, and the nominal-fee floor never applies."
      - name: uninsured_sliding_fee
        when: "coverage.payer_type == UNINSURED"
        difference: "A per-line discount keyed on the FPL band with a nominal-fee floor; the allowed amount plays no part, and the floor can RAISE the patient's share above the discounted total (band A yields 0 discounted but 2500 owed)."

  - name: encounter_money_split
    trigger: "immediately after encounter_allowed_amount_cents and patient_responsibility_cents, inside the same pricing pass"
    algorithm: aggregation
    formula: |
      plan_paid_cents = allowed_amount_cents - patient_responsibility_cents
      write_off_cents = total_charge_cents  - allowed_amount_cents
      # CONSERVATION INVARIANT (money):
      #   total_charge_cents == plan_paid_cents + patient_responsibility_cents + write_off_cents
      # holds for all three regimes and is re-established after every void or taint recompute.
    input_set: "The four money fields already computed on this encounter."
    constants: {}
    precision: "integer cents; no rounding, the identity must close exactly"

  - name: referral_due_at
    trigger: "on the Referral transition OPEN_to_SENT (first send only)"
    algorithm: interval_merge
    formula: |
      base = the logical clock instant at the first send
      band = treatment_plan.urgency_band
      if site.site_type == "SCHOOL":
          n = REFERRAL_SLA_SCHOOL_URGENT_BUSINESS_DAYS  if band == "URGENT"
            = REFERRAL_SLA_SCHOOL_EARLY_BUSINESS_DAYS   if band == "EARLY_CARE_NEEDED"
            = REFERRAL_SLA_SCHOOL_ROUTINE_BUSINESS_DAYS if band == "NO_OBVIOUS_PROBLEM"
          due_at = base advanced by n BUSINESS days: step forward one calendar day at a time,
                   counting only days whose weekday is Monday..Friday; the time-of-day is preserved
                   and no holiday calendar is applied
      else:  # SNF
          due_at = base + REFERRAL_SLA_SNF_URGENT_HOURS hours            if band == "URGENT"
                 = base + REFERRAL_SLA_SNF_EARLY_CALENDAR_DAYS days      if band == "EARLY_CARE_NEEDED"
                 = base + REFERRAL_SLA_SNF_ROUTINE_CALENDAR_DAYS days    if band == "NO_OBVIOUS_PROBLEM"
    input_set: "The plan's urgency_band and the site's site_type; re-sends never move due_at."
    constants:
      REFERRAL_SLA_SCHOOL_URGENT_BUSINESS_DAYS: 3
      REFERRAL_SLA_SCHOOL_EARLY_BUSINESS_DAYS: 15
      REFERRAL_SLA_SCHOOL_ROUTINE_BUSINESS_DAYS: 45
      REFERRAL_SLA_SNF_URGENT_HOURS: 48
      REFERRAL_SLA_SNF_EARLY_CALENDAR_DAYS: 10
      REFERRAL_SLA_SNF_ROUTINE_CALENDAR_DAYS: 45
    precision: "ISO 8601 UTC with three fractional digits"
    variants:
      - name: school_business_days
        when: "site.site_type == SCHOOL"
        difference: "Weekend days are skipped, so an URGENT referral first sent on a Monday 14:00Z is due Thursday 14:00Z, and the same referral first sent on a Friday would land the following Wednesday."
      - name: snf_calendar_clock
        when: "site.site_type == SNF"
        difference: "URGENT is measured in HOURS (48) rather than days and weekends are counted, so the identical Monday 14:00Z send is due Wednesday 14:00Z — a full calendar day earlier than the school variant."

  - name: follow_up_due_date
    trigger: "on the TreatmentPlan transitions DRAFT_to_ACTIVE and ACTIVE_to_ACTIVE"
    algorithm: threshold
    formula: |
      anchor_date = plan.last_contact_at date if last_contact_at is not null else plan.activated_on
      n = FOLLOW_UP_URGENT_DAYS  if plan.urgency_band == "URGENT"
        = FOLLOW_UP_EARLY_DAYS   if plan.urgency_band == "EARLY_CARE_NEEDED"
        = FOLLOW_UP_ROUTINE_DAYS if plan.urgency_band == "NO_OBVIOUS_PROBLEM"
      follow_up_due_date = anchor_date + n calendar days
    input_set: "The plan's own urgency_band, activated_on and last_contact_at."
    constants:
      FOLLOW_UP_URGENT_DAYS: 7
      FOLLOW_UP_EARLY_DAYS: 30
      FOLLOW_UP_ROUTINE_DAYS: 180
    precision: "calendar-date arithmetic, YYYY-MM-DD"

  - name: follow_up_status
    trigger: "recomputed on every read of a TreatmentPlan and on both plan transitions that touch follow_up_due_date"
    algorithm: threshold
    formula: |
      today = the logical clock date
      if plan.follow_up_due_date is null:                                  status = "NOT_DUE"
      elif plan.last_contact_at is not null
           and today < plan.follow_up_due_date:                            status = "CONTACTED"
      elif today <  plan.follow_up_due_date:                               status = "NOT_DUE"
      elif today <= plan.follow_up_due_date + FOLLOW_UP_GRACE_DAYS days:   status = "DUE"
      else:                                                               status = "OVERDUE"
    input_set: "The plan row and the logical clock only."
    constants:
      FOLLOW_UP_GRACE_DAYS: 14
    precision: "calendar-date comparison; the DUE window is inclusive of both endpoints"

  - name: varnish_eligibility
    trigger: "at validation priorities 27 and 28 on POST /mobile-dentistry/procedures/{id}/perform when procedure_code == D1206"
    algorithm: threshold
    formula: |
      today = the logical clock date
      # interval rule (priority 27)
      if patient.last_varnish_date is not null:
          days_since = today - patient.last_varnish_date, in whole calendar days
          eligible_by_interval = (days_since >= VARNISH_MIN_INTERVAL_DAYS)      # >= , not >
      else:
          eligible_by_interval = true
      # period cap rule (priority 28)
      eligible_by_cap = (patient.varnish_applications_in_period < VARNISH_MAX_APPLICATIONS_PER_PERIOD)
    input_set: "PERFORMED D1206 procedures for this patient whose encounter's site visit carries the same program_period_id as the visit being worked; VOIDED, TAINTED and INELIGIBLE rows are excluded from both the date and the counter."
    constants:
      VARNISH_MIN_INTERVAL_DAYS: 90
      VARNISH_MAX_APPLICATIONS_PER_PERIOD: 2
    precision: "whole calendar days; exactly 90 days elapsed is ELIGIBLE, 89 is not"

  - name: sealant_surface_eligibility
    trigger: "at validation priority 26 on POST /mobile-dentistry/procedures and POST /mobile-dentistry/procedures/{id}/perform when procedure_code == D1351"
    algorithm: constraint_propagation
    formula: |
      if procedure.tooth_number is null or procedure.surface is null:      eligible = false
      elif procedure.tooth_number not in SEALANT_ELIGIBLE_TOOTH_NUMBERS:   eligible = false
      elif procedure.surface not in SEALANT_ELIGIBLE_SURFACES:             eligible = false
      else:
          blocking = every Procedure Q for the SAME patient with
                        Q.procedure_code == "D1351"
                    and Q.tooth_number == procedure.tooth_number
                    and Q.surface      == procedure.surface
                    and Q.status in {"PLANNED", "PERFORMED"}
                    and Q.id != procedure.id
          eligible = (len(blocking) == 0)     # the empty-set case is the eligible case
    input_set: "D1351 procedures for the same patient across all encounters and all periods, filtered to statuses PLANNED and PERFORMED."
    constants:
      SEALANT_ELIGIBLE_TOOTH_NUMBERS: [2, 3, 14, 15, 18, 19, 30, 31]
      SEALANT_ELIGIBLE_SURFACES: [O, B, L]
    precision: "exact set membership; a tooth/surface pair is occupied by at most one live sealant"

  - name: supervision_permitted
    trigger: "at validation priority 19 on the screen and exam transitions and on POST /mobile-dentistry/procedures/{id}/perform"
    algorithm: weighted_scoring
    formula: |
      required = SUPERVISION_MATRIX[procedure_code][staff.staff_role]
      if required == "NOT_PERMITTED":
          permitted = false
      elif SUPERVISION_RANK[staff.supervision_level] < SUPERVISION_RANK[required]:
          permitted = false
      else:
          # presence requirement is keyed on `required`, never on the staff member's own level
          if required in {"DIRECT", "INDIRECT"}:
              d = site_visit.onsite_dentist_staff_id
              permitted = (d is not null and StaffMember[d].credential_status == "ACTIVE"
                           and StaffMember[d].staff_role == "DENTIST")
          elif required == "GENERAL":
              d = site_visit.onsite_dentist_staff_id or site_visit.remote_dentist_staff_id
              permitted = (d is not null and StaffMember[d].credential_status == "ACTIVE"
                           and StaffMember[d].staff_role == "DENTIST")
          else:  # SELF
              permitted = true
    input_set: "The procedure_code, the acting StaffMember's staff_role and supervision_level, and the SiteVisit's two dentist assignment slots. Three independent inputs interact non-linearly: a staff member can clear the rank test and still fail on presence, and a higher-ranked staff member can be permitted where a lower-ranked one is not for the identical code."
    constants:
      SUPERVISION_RANK:
        DIRECT: 1
        INDIRECT: 2
        GENERAL: 3
        SELF: 4
      SUPERVISION_MATRIX:
        D0190:
          DENTIST: SELF
          HYGIENIST: GENERAL
          PUBLIC_HEALTH_HYGIENIST: GENERAL
          DENTAL_ASSISTANT: NOT_PERMITTED
        D0150:
          DENTIST: SELF
          HYGIENIST: NOT_PERMITTED
          PUBLIC_HEALTH_HYGIENIST: GENERAL
          DENTAL_ASSISTANT: NOT_PERMITTED
        D1206:
          DENTIST: SELF
          HYGIENIST: INDIRECT
          PUBLIC_HEALTH_HYGIENIST: GENERAL
          DENTAL_ASSISTANT: DIRECT
        D1351:
          DENTIST: SELF
          HYGIENIST: INDIRECT
          PUBLIC_HEALTH_HYGIENIST: GENERAL
          DENTAL_ASSISTANT: NOT_PERMITTED
        D0272:
          DENTIST: SELF
          HYGIENIST: DIRECT
          PUBLIC_HEALTH_HYGIENIST: DIRECT
          DENTAL_ASSISTANT: NOT_PERMITTED
    precision: "exact table lookup and integer rank comparison"

  - name: resource_overlap_detection
    trigger: "at validation priorities 29 and 30 on POST /mobile-dentistry/site-visits and on the SiteVisit self-loop SCHEDULED_to_SCHEDULED"
    algorithm: interval_merge
    formula: |
      candidates = every SiteVisit V with status in {"SCHEDULED", "HOLD_BLOCKED", "IN_PROGRESS"}
                   and V.id != the visit being written
      # ---- unit rule (priority 29): HALF-OPEN intervals plus a symmetric transport buffer
      for V in candidates where V.portable_unit_id == new.portable_unit_id:
          collides = ( new.scheduled_start_at < V.scheduled_end_at   + UNIT_TRANSPORT_BUFFER_MINUTES
                       and V.scheduled_start_at < new.scheduled_end_at + UNIT_TRANSPORT_BUFFER_MINUTES )
      # ---- staff rule (priority 30): CLOSED intervals, zero buffer, adjacency DOES collide
      new_staff = {new.lead_staff_id, new.onsite_dentist_staff_id, new.remote_dentist_staff_id} minus nulls
      for V in candidates where {V.lead_staff_id, V.onsite_dentist_staff_id, V.remote_dentist_staff_id}
                                 intersects new_staff:
          collides = ( new.scheduled_start_at <= V.scheduled_end_at
                       and V.scheduled_start_at <= new.scheduled_end_at )
    input_set: "SiteVisit rows in statuses SCHEDULED, HOLD_BLOCKED and IN_PROGRESS; COMPLETED and CANCELLED visits never block."
    constants:
      UNIT_TRANSPORT_BUFFER_MINUTES: 90
    precision: |
      Deliberately different geometry per resource. On the unit, back-to-back visits are legal only
      once 90 minutes of transport time separate them, and a new visit starting exactly 90 minutes
      after the previous end does NOT collide (strict <). On staff, no buffer applies at all but the
      intervals are closed, so a new visit starting at the exact instant a previous one ends DOES
      collide (non-strict <=).

  - name: report_payload
    trigger: "on the Report transitions DRAFT_to_GENERATED, GENERATED_to_GENERATED and STALE_to_GENERATED"
    algorithm: aggregation
    formula: |
      period = report.program_period_id
      in_period_encounters = every Encounter E whose SiteVisit.program_period_id == period
      if report.report_type == "PROGRAM_PERIOD":
          payload = {
            patients_screened_count:     count of DISTINCT E.patient_id over in_period_encounters
                                         with E.clinical_status in {SCREENED, EXAMINED, TREATED, CLOSED},
            urgent_count:                count of those encounters with triage_band == "URGENT",
            early_care_count:            count with triage_band == "EARLY_CARE_NEEDED",
            no_problem_count:            count with triage_band == "NO_OBVIOUS_PROBLEM",
            varnish_applications_count:  count of Procedure rows in period with procedure_code D1206 and status PERFORMED,
            sealant_teeth_count:         count of Procedure rows in period with procedure_code D1351 and status PERFORMED,
            referrals_sent_count:        count of Referral rows on plans of in-period encounters with attempt_count >= 1,
            referrals_abandoned_count:   count of those Referral rows with status == "ABANDONED",
            total_charge_cents:          sum of E.total_charge_cents over in_period_encounters with billing_status in {PRICED, CLAIMED, PAID, DENIED},
            total_plan_paid_cents:       sum of E.plan_paid_cents over the same set,
            total_patient_responsibility_cents: sum of E.patient_responsibility_cents over the same set,
            total_write_off_cents:       sum of E.write_off_cents over the same set
          }
      elif report.report_type == "FACILITY_ROSTER":
          lines = one entry per Patient of report.site_id having at least one in-period encounter,
                  ordered by Patient.created_at ASC
          if site.roster_disclosure_level == "CLINICAL_DETAIL":
              each line = { patient_id, external_ref, triage_band, procedure_codes_performed, follow_up_due_date }
          else:  # SUMMARY_ONLY
              each line = { patient_id, external_ref, seen: true }
              # triage_band, procedure_codes_performed and follow_up_due_date are OMITTED entirely,
              # not nulled, because the facility is not entitled to them
          payload = { site_id, roster_disclosure_level, patient_line_count: len(lines), lines: lines,
                      urgent_count, early_care_count, no_problem_count }
      else:  # PARENT
          payload = { patient_id, external_ref, triage_band, procedure_codes_performed,
                      follow_up_due_date, patient_responsibility_cents }
          # exactly one patient appears; a PARENT report never carries a `lines` array
    input_set: "Encounters, procedures, referrals and plans whose site visit rolls up into report.program_period_id, with the status filters written above."
    constants: {}
    precision: "integer counts and integer cents; ordering of roster lines is Patient.created_at ASC"

# =============================================================================
# Conservation invariants — each names a quantity that a forward action and its
# compensating action must leave in exact agreement with its defining formula.
# =============================================================================
conservation_invariants:

  - id: money_split_closes
    quantity: "encounter money (cents)"
    formula: "Encounter.total_charge_cents == Encounter.plan_paid_cents + Encounter.patient_responsibility_cents + Encounter.write_off_cents"
    holds_when: "Encounter.billing_status IN {PRICED, CLAIMED, PAID, DENIED}"
    forward_action: "POST /mobile-dentistry/encounters/{id}/price"
    compensating_action: "POST /mobile-dentistry/procedures/{id}/void, which reverts billing_status to UNBILLED and zeroes the four money fields, followed by a re-price"
    note: "The identity must close for all three pricing regimes and again after every void/taint-driven recompute; zero drift is permitted."

  - id: chair_minute_ledger
    quantity: "site visit chair minutes"
    formula: "SiteVisit.booked_chair_minutes == sum of Procedure.chair_minutes over procedures of this visit's encounters whose status IN {PLANNED, PERFORMED}"
    holds_when: "always"
    forward_action: "POST /mobile-dentistry/procedures (debits chair minutes) and the screen/exam cascade-created procedures"
    compensating_action: "POST /mobile-dentistry/procedures/{id}/void, the consent-downgrade INELIGIBLE cascade, and the spore TAINTED cascade (each credits exactly the same chair_minutes back)"

  - id: varnish_application_counter
    quantity: "per-patient varnish application count in a program period"
    formula: "Patient.varnish_applications_in_period == count of Procedure rows for this patient with procedure_code == D1206, status == PERFORMED, and encounter.site_visit.program_period_id == the period in question"
    holds_when: "always"
    forward_action: "POST /mobile-dentistry/procedures/{id}/perform on a D1206"
    compensating_action: "POST /mobile-dentistry/procedures/{id}/void on that D1206, or the spore taint cascade moving it to TAINTED — both decrement the counter by exactly one and recompute last_varnish_date"

  - id: consent_tier_coverage
    quantity: "count of live procedures exceeding their consent's tier"
    formula: "for every Encounter E, count of Procedure rows under E with status IN {PLANNED, PERFORMED} whose CONSENT_TIER_RANK[required_tier] > CONSENT_TIER_RANK[E.consent.scope_tier] == 0"
    holds_when: "always, evaluated against the consent currently referenced by the encounter"
    forward_action: "POST /mobile-dentistry/consents/{id}/amend-tier with a lower new_scope_tier"
    compensating_action: "the same call's cascade link 2, which moves every over-tier PLANNED procedure to INELIGIBLE so the count returns to zero"

# =============================================================================
# Global constants used by §1.2 transitions and §1.4 validations that do not
# belong to any single §1.3 calculation. Every named constant in this scaffold
# has a value either here or in a calculation's `constants:` block.
# =============================================================================
global_constants:
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"
  SPORE_INCUBATION_HOURS: 24
  TELEDENTISTRY_REVIEW_WINDOW_HOURS: 72
  REFERRAL_MAX_ATTEMPTS: 3
  REFERRAL_NO_RESPONSE_DAYS: 21
  VISIT_RESCHEDULE_MAX_COUNT: 2
  VISIT_RESCHEDULE_WINDOW_DAYS: 30

# Request-body enum fields that are NOT persisted entity fields. Declared here so
# validation priority 7 has a closed value set for each of them and no downstream
# generator has to infer it from prose.
request_enums:
  "POST /mobile-dentistry/program-periods/{id}/status":
    to_status: [REPORTING, OPEN, CLOSED]
  "POST /mobile-dentistry/sterilization-loads/{id}/spore-result":
    result: [PASSED, FAILED]
  "POST /mobile-dentistry/encounters/{id}/exam":
    exam_modality: [ONSITE, TELEDENTISTRY]
  "POST /mobile-dentistry/encounters/{id}/adjudicate":
    outcome: [PAID, DENIED]
  "POST /mobile-dentistry/referrals/{id}/record-response":
    outcome: [ACCEPTED, DECLINED, NO_RESPONSE, COMPLETED]
  "POST /mobile-dentistry/consents/{id}/amend-tier":
    new_scope_tier: [SCREENING_ONLY, SCREENING_FLUORIDE, SCREENING_FLUORIDE_SEALANT, FULL_WITH_RADIOGRAPHS]

# =============================================================================
# §1.4 Validation Rules Table — 38 rungs, evaluated strictly in priority order.
# The first rung whose check fails decides the response; no later rung runs.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present, and X-User-Role names a role declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role appears in the target endpoint's roles list in §1.5."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id in the path, then every foreign key in the body, resolves to an existing row — validated strictly left-to-right in the path and then in the order the fields are listed in the endpoint's input."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Confidentiality wall. When the acting role is Guardian on GET /mobile-dentistry/reports/{id}, the report must satisfy report_type == PARENT AND recipient_user_id == X-User-ID. Any other report — a FACILITY_ROSTER, a PROGRAM_PERIOD, or another family's PARENT report — is reported as ERR_NOT_FOUND, NOT as ERR_UNAUTHORIZED, so that the existence of other families' reports is never revealed."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "GET /mobile-dentistry/reports/{id}"

  - priority: 5
    category: auth
    check: "Site scoping. When the acting role is SiteCoordinator on GET /mobile-dentistry/reports/{id} or GET /mobile-dentistry/reports, every returned report's site_id must equal the coordinator's X-User-ID (SiteCoordinator is entity_backed:Site). A PROGRAM_PERIOD report, whose site_id is null, is refused for a SiteCoordinator with ERR_UNAUTHORIZED — a deliberately different outcome from the Guardian wall one rung above."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "GET /mobile-dentistry/reports/{id}, GET /mobile-dentistry/reports"

  - priority: 6
    category: business_constraint
    check: "Every required input field for the endpoint is present and carries the declared JSON type; integer ranges (household_size >= 1, chair_count >= 1, tooth_number 1..32, oral_hygiene_score 0..4, manual_patient_responsibility_cents 0..total_charge_cents, limit 1..100, offset >= 0), ISO 8601 datetime and ISO date formats, and start-before-end ordering (ProgramPeriod.starts_on < ends_on, SiteHold.starts_at < ends_at, SiteVisit.scheduled_start_at < scheduled_end_at) are all checked here."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints and all list endpoints"

  - priority: 7
    category: business_constraint
    check: |
      Enum membership. EXACTLY these request fields route to ERR_INVALID_ENUM and no other field
      routes here: Site.site_type, Site.roster_disclosure_level, SiteHold.hold_type,
      Patient.patient_type, Patient.capacity_determination, Consent.regime, Consent.scope_tier,
      Consent.responsible_party_authority, amend-tier new_scope_tier, StaffMember.staff_role,
      StaffMember.supervision_level, StaffMember.credential_status, Coverage.payer_type,
      Procedure.procedure_code, Procedure.surface, exam-modality exam_modality,
      adjudicate outcome, record-response outcome, program-period status to_status,
      Report.report_type, spore-result result. Everything else that is malformed is ERR_VALIDATION.
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 8
    category: business_constraint
    check: "Consent regime field completeness. SCHOOL_GUARDIAN requires guardian_name and guardian_relationship and forbids responsible_party_name; SNF_RESPONSIBLE_PARTY requires responsible_party_name and responsible_party_authority, additionally requires poa_document_ref when responsible_party_authority != SELF, and forbids guardian_name. The regime must also agree with Site.site_type (SCHOOL sites take SCHOOL_GUARDIAN only, SNF sites take SNF_RESPONSIBLE_PARTY only)."
    error_id: ERR_CONSENT_REGIME_FIELDS
    http_status: 400
    applies_to: "POST /mobile-dentistry/consents"

  - priority: 9
    category: state
    check: |
      GLOBAL WRITE GATE — program period freeze. The request is refused when the entity it writes
      resolves to a ProgramPeriod whose status is SUBMITTED or CLOSED. Resolution paths:
      SiteVisit -> program_period_id; Encounter -> site_visit.program_period_id;
      Procedure -> encounter.site_visit.program_period_id;
      TreatmentPlan -> encounter.site_visit.program_period_id;
      SterilizationLoad -> site_visit.program_period_id when site_visit_id is non-null.
      The gated endpoint set is PERIOD_GATED_ENDPOINTS. Everything else is outside the gate by
      construction, and the exclusions are enumerated with their reasons in
      PERIOD_FREEZE_EXCLUDED_ENDPOINTS so that every rung below stays reachable.
    error_id: ERR_PERIOD_FROZEN
    http_status: 409
    applies_to: "PERIOD_GATED_ENDPOINTS"

  - priority: 10
    category: state
    check: "Site hold gate. A write that schedules, reschedules, starts or registers against a SiteVisit is refused when the visit's Site.status == SUSPENDED, or when the visit window intersects any ACTIVE SiteHold on that site."
    error_id: ERR_SITE_ON_HOLD
    http_status: 409
    applies_to: "POST /mobile-dentistry/site-visits, POST /mobile-dentistry/site-visits/{id}/reschedule, POST /mobile-dentistry/site-visits/{id}/start, POST /mobile-dentistry/encounters"

  - priority: 11
    category: state
    check: "The target row is in a state from which the requested transition is declared in §1.2 (including the parent-state guards: screening/exam/perform require site_visit.status == IN_PROGRESS; plan activation requires the encounter to be EXAMINED, TREATED or CLOSED; report submission requires the period to be REPORTING)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint (all POSTs under an /{id}/ path segment) and every create whose parent must be in a given state"

  - priority: 12
    category: business_safety
    check: "The encounter carries no procedure currently in status TAINTED (tainted_procedure_count == 0). A tainted encounter must have its tainted procedures voided before it can be priced or claimed."
    error_id: ERR_PROCEDURE_TAINTED
    http_status: 409
    applies_to: "POST /mobile-dentistry/encounters/{id}/price, POST /mobile-dentistry/encounters/{id}/claim"

  - priority: 13
    category: business_constraint
    check: "Optimistic concurrency. The supplied expected_<parent>_version equals the current version of the parent named in the matching §1.2.1 rule."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /mobile-dentistry/consents/{id}/amend-tier, POST /mobile-dentistry/encounters, POST /mobile-dentistry/procedures"

  - priority: 14
    category: business_safety
    check: "Segregation of duties. The staff member reading the biological indicator (result_recorded_by_staff_id in the payload) must not be the staff member who ran the load (SterilizationLoad.loaded_by_staff_id)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /mobile-dentistry/sterilization-loads/{id}/spore-result"

  - priority: 15
    category: business_safety
    check: |
      Unit quarantine gate, with a lazy incubation-timeout sweep in front of it (mutate-then-reject).
      Step 1 — sweep: if the unit's most recent SterilizationLoad has spore_result == PENDING and the
      logical clock has reached its incubation_ends_at, that load is written to FAILED with
      auto_failed = true, the full depth-5 taint cascade runs, and the unit is moved to QUARANTINED.
      Step 2 — gate: if the unit is now (or was already) QUARANTINED, the request is refused with
      ERR_UNIT_QUARANTINED. When the unit was ALREADY QUARANTINED before the request, step 1 finds
      nothing to sweep, no row is written, PortableUnit.version does not change, and the same
      ERR_UNIT_QUARANTINED is returned — the two cases are distinguished by the version and by
      SterilizationLoad.spore_result, not by the error id.
    error_id: ERR_UNIT_QUARANTINED
    http_status: 409
    applies_to: "POST /mobile-dentistry/site-visits, POST /mobile-dentistry/site-visits/{id}/start"

  - priority: 16
    category: business_safety
    check: "The assigned PortableUnit's calibration_status is CURRENT or DUE; EXPIRED (including a unit that has never been calibrated) is refused."
    error_id: ERR_UNIT_CALIBRATION_EXPIRED
    http_status: 409
    applies_to: "POST /mobile-dentistry/site-visits, POST /mobile-dentistry/site-visits/{id}/start"

  - priority: 17
    category: business_safety
    check: |
      Two disjoint clauses share this rung.
      (a) On POST /mobile-dentistry/site-visits/{id}/start: no SterilizationLoad on the assigned
          portable unit may be PENDING with the logical clock still before its incubation_ends_at.
      (b) On POST /mobile-dentistry/sterilization-loads/{id}/spore-result: THIS load's own
          incubation_ends_at must have been reached by the logical clock. Sibling loads on the same
          unit are irrelevant to clause (b) — otherwise a unit could never clear a backlog of loads.
    error_id: ERR_SPORE_RESULT_PENDING
    http_status: 409
    applies_to: "POST /mobile-dentistry/site-visits/{id}/start, POST /mobile-dentistry/sterilization-loads/{id}/spore-result"

  - priority: 18
    category: business_safety
    check: "Every StaffMember the request relies on — the visit's lead staff and assigned dentists, the screening/examining clinician, the performing clinician — has credential_status == ACTIVE."
    error_id: ERR_CREDENTIAL_LAPSED
    http_status: 409
    applies_to: "POST /mobile-dentistry/site-visits, POST /mobile-dentistry/site-visits/{id}/start, POST /mobile-dentistry/encounters/{id}/screen, POST /mobile-dentistry/encounters/{id}/exam, POST /mobile-dentistry/procedures/{id}/perform"

  - priority: 19
    category: business_safety
    check: "Every StaffMember the request relies on has license_state equal to the Site.state_code of the visit's site."
    error_id: ERR_LICENSE_STATE_MISMATCH
    http_status: 422
    applies_to: "POST /mobile-dentistry/site-visits, POST /mobile-dentistry/site-visits/{id}/start, POST /mobile-dentistry/encounters/{id}/screen, POST /mobile-dentistry/encounters/{id}/exam, POST /mobile-dentistry/procedures/{id}/perform"

  - priority: 20
    category: business_safety
    check: "Calculation supervision_permitted returns true for (procedure_code, acting staff role, acting staff supervision_level, visit dentist assignments). D0190 is evaluated for screen, D0150 for exam, and the procedure's own code for perform."
    error_id: ERR_SUPERVISION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /mobile-dentistry/encounters/{id}/screen, POST /mobile-dentistry/encounters/{id}/exam, POST /mobile-dentistry/procedures/{id}/perform"

  - priority: 21
    category: business_temporal
    check: "When exam_modality == TELEDENTISTRY, teledentistry_reviewed_at is present and falls inside the closed interval [site_visit.scheduled_start_at, site_visit.scheduled_start_at + TELEDENTISTRY_REVIEW_WINDOW_HOURS]."
    error_id: ERR_TELEDENTISTRY_REVIEW_WINDOW
    http_status: 422
    applies_to: "POST /mobile-dentistry/encounters/{id}/exam"

  - priority: 22
    category: business_referential
    check: "The cited Consent belongs to the same patient as the encounter (consent.patient_id == encounter.patient_id) and to the same site as the visit (consent.site_id == site_visit.site_id)."
    error_id: ERR_CONSENT_MISSING
    http_status: 422
    applies_to: "POST /mobile-dentistry/encounters"

  - priority: 23
    category: business_referential
    check: "The cited Consent's status is not REVOKED and not SUPERSEDED."
    error_id: ERR_CONSENT_REVOKED
    http_status: 409
    applies_to: "POST /mobile-dentistry/encounters, POST /mobile-dentistry/encounters/{id}/screen, POST /mobile-dentistry/encounters/{id}/exam, POST /mobile-dentistry/procedures, POST /mobile-dentistry/procedures/{id}/perform"

  - priority: 24
    category: business_temporal
    check: |
      Consent expiry, with a lazy expiry sweep in front of it (mutate-then-reject).
      If the cited Consent's status is PENDING_VERIFICATION or ACTIVE and its expires_at has been
      reached by the logical clock, the row is first written to EXPIRED with expired_at stamped and
      Consent.version incremented, and the request is THEN refused with ERR_CONSENT_EXPIRED.
      If the Consent is ALREADY in status EXPIRED, the same ERR_CONSENT_EXPIRED is returned with no
      write at all and no version change. Note that POST /consents/{id}/revoke and
      POST /consents/{id}/verify target the consent itself, so for those two endpoints the state gate
      at priority 11 pre-empts this rung and surfaces ERR_INVALID_STATE instead.
    error_id: ERR_CONSENT_EXPIRED
    http_status: 409
    applies_to: "POST /mobile-dentistry/encounters, POST /mobile-dentistry/encounters/{id}/screen, POST /mobile-dentistry/encounters/{id}/exam, POST /mobile-dentistry/procedures, POST /mobile-dentistry/procedures/{id}/perform"

  - priority: 25
    category: business_safety
    check: "SNF capacity determination. Verifying a consent whose regime is SNF_RESPONSIBLE_PARTY requires the patient's capacity_determination to be HAS_CAPACITY or LACKS_CAPACITY; NOT_ASSESSED is refused."
    error_id: ERR_CAPACITY_DETERMINATION_REQUIRED
    http_status: 422
    applies_to: "POST /mobile-dentistry/consents/{id}/verify"

  - priority: 26
    category: business_referential
    check: "Consent tier sufficiency. CONSENT_TIER_RANK[procedure.required_tier] <= CONSENT_TIER_RANK[consent.scope_tier] for the encounter's currently cited consent. D0190 is evaluated on screen and D0150 on exam under the same rule."
    error_id: ERR_CONSENT_TIER_INSUFFICIENT
    http_status: 422
    applies_to: "POST /mobile-dentistry/procedures, POST /mobile-dentistry/procedures/{id}/perform, POST /mobile-dentistry/encounters/{id}/screen, POST /mobile-dentistry/encounters/{id}/exam"

  - priority: 27
    category: business_constraint
    check: "Calculation sealant_surface_eligibility returns true for a D1351 procedure — tooth_number and surface are both present, the tooth is in SEALANT_ELIGIBLE_TOOTH_NUMBERS, the surface is in SEALANT_ELIGIBLE_SURFACES, and no PLANNED-or-PERFORMED D1351 already occupies that tooth/surface pair for this patient."
    error_id: ERR_SURFACE_INELIGIBLE
    http_status: 422
    applies_to: "POST /mobile-dentistry/procedures, POST /mobile-dentistry/procedures/{id}/perform"

  - priority: 28
    category: business_temporal
    check: "Varnish minimum interval. For D1206, whole calendar days since Patient.last_varnish_date must be >= VARNISH_MIN_INTERVAL_DAYS. Exactly 90 days passes; 89 fails."
    error_id: ERR_VARNISH_INTERVAL
    http_status: 422
    applies_to: "POST /mobile-dentistry/procedures/{id}/perform"

  - priority: 29
    category: business_constraint
    check: "Varnish per-period cap. For D1206, Patient.varnish_applications_in_period must be strictly less than VARNISH_MAX_APPLICATIONS_PER_PERIOD before the application."
    error_id: ERR_VARNISH_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /mobile-dentistry/procedures/{id}/perform"

  - priority: 30
    category: business_temporal
    check: "Portable unit overlap with transport buffer, per calculation resource_overlap_detection (half-open intervals widened by UNIT_TRANSPORT_BUFFER_MINUTES on both sides)."
    error_id: ERR_UNIT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /mobile-dentistry/site-visits, POST /mobile-dentistry/site-visits/{id}/reschedule"

  - priority: 31
    category: business_temporal
    check: "Staff overlap, per calculation resource_overlap_detection (closed intervals, zero buffer, touching endpoints collide) across lead_staff_id, onsite_dentist_staff_id and remote_dentist_staff_id."
    error_id: ERR_STAFF_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /mobile-dentistry/site-visits, POST /mobile-dentistry/site-visits/{id}/reschedule"

  - priority: 32
    category: business_constraint
    check: "Chair-minute capacity. site_visit.booked_chair_minutes + the new procedure's chair_minutes must be <= site_visit.capacity_chair_minutes."
    error_id: ERR_CHAIR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /mobile-dentistry/procedures, POST /mobile-dentistry/encounters/{id}/screen, POST /mobile-dentistry/encounters/{id}/exam"

  - priority: 33
    category: business_temporal
    check: "Referral re-send waiting period. A send from status NO_RESPONSE requires the logical clock to have reached referral.next_eligible_send_at. A send from DECLINED has no waiting period."
    error_id: ERR_REFERRAL_NOT_DUE
    http_status: 422
    applies_to: "POST /mobile-dentistry/referrals/{id}/send"

  - priority: 34
    category: business_constraint
    check: |
      Referral attempt cap (mutate-then-reject). When a send is requested from status NO_RESPONSE or
      DECLINED and attempt_count has already reached REFERRAL_MAX_ATTEMPTS, the referral is first
      written to ABANDONED with abandoned_at, case_management_opened_at and abandon_reason
      ATTEMPT_CAP_REACHED, Referral.version is incremented, and the request is THEN refused with
      ERR_REFERRAL_CAP_REACHED. Once the referral is ALREADY ABANDONED, the state gate at priority 11
      pre-empts this rung entirely: the same send returns ERR_INVALID_STATE and writes nothing.
      Priority 33 also pre-empts this rung, so a fourth attempt inside the waiting period returns
      ERR_REFERRAL_NOT_DUE and does NOT abandon the referral.
    error_id: ERR_REFERRAL_CAP_REACHED
    http_status: 409
    applies_to: "POST /mobile-dentistry/referrals/{id}/send"

  - priority: 35
    category: business_fiscal
    check: |
      Coverage verification (mutate-then-reject). The encounter must cite a coverage whose
      verification_status is VERIFIED. If the status is VERIFIED but verified_through_date has
      already passed on the logical clock, the coverage is first written to EXPIRED with
      Coverage.version incremented, and the request is THEN refused with ERR_COVERAGE_UNVERIFIED.
      If it is already UNVERIFIED or EXPIRED, the same error is returned with no write.
    error_id: ERR_COVERAGE_UNVERIFIED
    http_status: 422
    applies_to: "POST /mobile-dentistry/encounters/{id}/price"

  - priority: 36
    category: business_fiscal
    check: "Sliding-fee determination inputs. Verifying an UNINSURED coverage requires the patient's annual_household_income_cents to be non-null so that fpl_percent and sliding_fee_band can be determined."
    error_id: ERR_SLIDING_FEE_MISSING
    http_status: 422
    applies_to: "POST /mobile-dentistry/coverages/{id}/verify"

  - priority: 37
    category: business_fiscal
    check: "Medicaid balance-billing prohibition. A manual_patient_responsibility_cents override may not be supplied when the encounter's coverage payer_type is MEDICAID_MCO."
    error_id: ERR_MEDICAID_BALANCE_BILL
    http_status: 422
    applies_to: "POST /mobile-dentistry/encounters/{id}/price"

  - priority: 38
    category: business_fiscal
    check: "A PROGRAM_PERIOD report whose status is STALE cannot be submitted; it must be regenerated first."
    error_id: ERR_REPORT_STALE
    http_status: 409
    applies_to: "POST /mobile-dentistry/reports/{id}/submit"

validation_gate_scopes:
  PERIOD_GATED_ENDPOINTS:
    - "POST /mobile-dentistry/site-visits"
    - "POST /mobile-dentistry/site-visits/{id}/reschedule"
    - "POST /mobile-dentistry/site-visits/{id}/start"
    - "POST /mobile-dentistry/site-visits/{id}/complete"
    - "POST /mobile-dentistry/site-visits/{id}/cancel"
    - "POST /mobile-dentistry/encounters"
    - "POST /mobile-dentistry/encounters/{id}/screen"
    - "POST /mobile-dentistry/encounters/{id}/exam"
    - "POST /mobile-dentistry/encounters/{id}/close"
    - "POST /mobile-dentistry/encounters/{id}/price"
    - "POST /mobile-dentistry/encounters/{id}/claim"
    - "POST /mobile-dentistry/encounters/{id}/adjudicate"
    - "POST /mobile-dentistry/procedures"
    - "POST /mobile-dentistry/procedures/{id}/perform"
    - "POST /mobile-dentistry/procedures/{id}/void"
    - "POST /mobile-dentistry/treatment-plans"
    - "POST /mobile-dentistry/treatment-plans/{id}/activate"
    - "POST /mobile-dentistry/sterilization-loads"
    - "POST /mobile-dentistry/sterilization-loads/{id}/spore-result"
  PERIOD_FREEZE_EXCLUDED_ENDPOINTS:
    - endpoint: "every GET endpoint"
      why: "Reads are never gated; a frozen period must stay fully inspectable, and the reporting workflow depends on reading it."
    - endpoint: "POST /_clock/set_current_utc"
      why: "Test-driving clock control is not a clinical or financial write and gating it would make every time-dependent rung untestable after a freeze."
    - endpoint: "POST /mobile-dentistry/program-periods and POST /mobile-dentistry/program-periods/{id}/status"
      why: "These are the gate's own controls. Gating them would strand the period in SUBMITTED forever, making CLOSED unreachable and the freeze irreversible."
    - endpoint: "POST /mobile-dentistry/reports, POST /mobile-dentistry/reports/{id}/generate, POST /mobile-dentistry/reports/{id}/submit"
      why: "Reporting is what causes the freeze; it must keep running afterwards so that PARENT and FACILITY_ROSTER reports over frozen data remain obtainable."
    - endpoint: "POST /mobile-dentistry/patients, POST /mobile-dentistry/consents, POST /mobile-dentistry/consents/{id}/verify, POST /mobile-dentistry/consents/{id}/revoke, POST /mobile-dentistry/consents/{id}/amend-tier"
      why: "Roster and consent records span periods. A student's consent for the next program period must be recordable while the previous period is frozen, and a mid-program revocation is a safety action that no reporting deadline may block."
    - endpoint: "POST /mobile-dentistry/coverages, POST /mobile-dentistry/coverages/{id}/verify"
      why: "Eligibility administration is period-independent; a coverage verified today is used by encounters in whichever period is currently open."
    - endpoint: "POST /mobile-dentistry/referrals, POST /mobile-dentistry/referrals/{id}/send, POST /mobile-dentistry/referrals/{id}/record-response, POST /mobile-dentistry/treatment-plans/{id}/follow-up-contact"
      why: "Referral and follow-up outreach is post-period case management, not a clinical or financial write on an encounter. Keeping it outside the gate is what keeps the referral-cap rungs (33, 34) and the follow-up cadence reachable after a freeze."
    - endpoint: "POST /mobile-dentistry/sites, POST /mobile-dentistry/site-holds, POST /mobile-dentistry/site-holds/{id}/release"
      why: "Site safety operations — weather closures and outbreak lockdowns — must never be blocked by a reporting freeze."
    - endpoint: "POST /mobile-dentistry/portable-units, POST /mobile-dentistry/portable-units/{id}/calibrate, POST /mobile-dentistry/staff-members, PATCH /mobile-dentistry/staff-members/{id}"
      why: "Asset and credential administration is period-independent, and calibrating a unit or lapsing a licence must stay possible while any period is frozen."

# =============================================================================
# §1.5 API Endpoint Table — 70 endpoints
# =============================================================================
endpoints:

  # ---- logical clock (test-driving) -----------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z and never falls back to real wall-clock time. Every expiry, incubation, SLA and cadence rule in this scaffold reads this clock."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advances the logical clock; no rows are written"]

  # ---- program periods ------------------------------------------------------
  - method: POST
    path: "/mobile-dentistry/program-periods"
    description: "Creates a program (school-year) reporting period in status OPEN."
    roles: [ProgramAdmin]
    code: 201
    input: [name, starts_on, ends_on]
    output: ProgramPeriod
    side_effects: ["creates a ProgramPeriod in status OPEN with version 1"]

  - method: GET
    path: "/mobile-dentistry/program-periods/{id}"
    description: "Reads one program period."
    roles: [ProgramAdmin, SiteCoordinator, BillingSpecialist, FieldDentist]
    code: 200
    input: []
    output: ProgramPeriod
    side_effects: []

  - method: POST
    path: "/mobile-dentistry/program-periods/{id}/status"
    description: "Drives the ProgramPeriod status axis: OPEN->REPORTING, REPORTING->OPEN, SUBMITTED->REPORTING, SUBMITTED->CLOSED. Outside the period freeze gate by design."
    roles: [ProgramAdmin]
    code: 200
    input: [to_status]
    output: ProgramPeriod
    side_effects:
      - "applies the declared ProgramPeriod transition"
      - "clears frozen_at when moving SUBMITTED->REPORTING, disarming the global write gate"
      - "increments ProgramPeriod.version by 1"

  # ---- sites ----------------------------------------------------------------
  - method: POST
    path: "/mobile-dentistry/sites"
    description: "Registers a school or SNF site."
    roles: [ProgramAdmin]
    code: 201
    input: [name, site_type, state_code, "roster_disclosure_level?", "facility_contact_name?"]
    output: Site
    side_effects: ["creates a Site in status ACTIVE with active_hold_count 0"]

  - method: GET
    path: "/mobile-dentistry/sites"
    description: "Lists sites with pagination."
    roles: [ProgramAdmin, SiteCoordinator, BillingSpecialist]
    code: 200
    input: ["site_type?", "status?", "limit?", "offset?"]
    output: Site[]
    side_effects: []

  - method: GET
    path: "/mobile-dentistry/sites/{id}"
    description: "Reads one site."
    roles: [ProgramAdmin, SiteCoordinator, BillingSpecialist, FieldDentist, FieldHygienist, DentalAssistant]
    code: 200
    input: []
    output: Site
    side_effects: []

  # ---- site holds -----------------------------------------------------------
  - method: POST
    path: "/mobile-dentistry/site-holds"
    description: "Opens a weather / outbreak / administrative hold on a site. Outside the period freeze gate by design."
    roles: [ProgramAdmin]
    code: 201
    input: [site_id, hold_type, starts_at, ends_at, "reason?"]
    output: SiteHold
    side_effects:
      - "cascade link 1: moves the Site to SUSPENDED and increments Site.active_hold_count"
      - "cascade link 2: moves every intersecting SCHEDULED SiteVisit to HOLD_BLOCKED and records blocked_visit_count"
      - "cascade link 3: moves every REGISTERED or SCREENED Encounter on those visits to DEFERRED with deferred_reason SITE_HOLD"

  - method: GET
    path: "/mobile-dentistry/site-holds"
    description: "Lists site holds, optionally filtered by site."
    roles: [ProgramAdmin, SiteCoordinator]
    code: 200
    input: ["site_id?", "hold_status?", "limit?", "offset?"]
    output: SiteHold[]
    side_effects: []

  - method: GET
    path: "/mobile-dentistry/site-holds/{id}"
    description: "Reads one site hold."
    roles: [ProgramAdmin, SiteCoordinator]
    code: 200
    input: []
    output: SiteHold
    side_effects: []

  - method: POST
    path: "/mobile-dentistry/site-holds/{id}/release"
    description: "Releases a hold. When it is the site's last ACTIVE hold the site returns to ACTIVE and HOLD_BLOCKED visits with no remaining intersecting hold return to SCHEDULED. Encounters already DEFERRED are deliberately NOT restored."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: SiteHold
    side_effects:
      - "sets hold_status RELEASED and released_at"
      - "decrements Site.active_hold_count and, at zero, returns the Site to ACTIVE"
      - "returns eligible HOLD_BLOCKED SiteVisits to SCHEDULED"

  # ---- patients -------------------------------------------------------------
  - method: POST
    path: "/mobile-dentistry/patients"
    description: "Adds a student or resident to a site roster. Outside the period freeze gate by design."
    roles: [ProgramAdmin, SiteCoordinator]
    code: 201
    input: [site_id, patient_type, external_ref, first_name, last_name, date_of_birth, "grade_level?", "room_number?", "household_size?", "annual_household_income_cents?", "capacity_determination?"]
    output: Patient
    side_effects: ["creates a Patient with varnish_applications_in_period 0", "stamps capacity_determined_at when capacity_determination is supplied and is not NOT_ASSESSED"]

  - method: GET
    path: "/mobile-dentistry/patients"
    description: "Lists patients, optionally filtered by site."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, FieldHygienist, DentalAssistant, BillingSpecialist]
    code: 200
    input: ["site_id?", "patient_type?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  - method: GET
    path: "/mobile-dentistry/patients/{id}"
    description: "Reads one patient, including the live varnish counter."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, FieldHygienist, DentalAssistant, BillingSpecialist]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # ---- consents -------------------------------------------------------------
  - method: POST
    path: "/mobile-dentistry/consents"
    description: "Records a consent form in PENDING_VERIFICATION under one of the two regimes. Outside the period freeze gate by design."
    roles: [ProgramAdmin, SiteCoordinator]
    code: 201
    input: [patient_id, site_id, program_period_id, regime, scope_tier, signed_at, "guardian_name?", "guardian_relationship?", "responsible_party_name?", "responsible_party_authority?", "poa_document_ref?"]
    output: Consent
    side_effects: ["computes expires_at and reaffirmation_due_at per calculation consent_expires_at"]

  - method: GET
    path: "/mobile-dentistry/consents"
    description: "Lists consents with FK filters; the superseded_by_consent_id filter finds the row a given consent replaced."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, FieldHygienist, DentalAssistant]
    code: 200
    input: ["patient_id?", "site_id?", "program_period_id?", "superseded_by_consent_id?", "status?", "limit?", "offset?"]
    output: Consent[]
    side_effects: []

  - method: GET
    path: "/mobile-dentistry/consents/{id}"
    description: "Reads one consent."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, FieldHygienist, DentalAssistant]
    code: 200
    input: []
    output: Consent
    side_effects: []

  - method: POST
    path: "/mobile-dentistry/consents/{id}/verify"
    description: "Verifies a PENDING_VERIFICATION consent into ACTIVE, or reaffirms an ACTIVE SNF_RESPONSIBLE_PARTY consent (self-loop). A SCHOOL_GUARDIAN consent already in ACTIVE has no verify leg."
    roles: [ProgramAdmin, SiteCoordinator]
    code: 200
    input: []
    output: Consent
    side_effects:
      - "recomputes expires_at and reaffirmation_due_at"
      - "on the SNF self-loop, resets signed_at to the logical clock instant"
      - "increments Consent.version by 1"

  - method: POST
    path: "/mobile-dentistry/consents/{id}/revoke"
    description: "Revokes an ACTIVE consent mid-program and invalidates its still-PLANNED procedures."
    roles: [ProgramAdmin, SiteCoordinator]
    code: 200
    input: ["revoke_reason?"]
    output: Consent
    side_effects:
      - "sets status REVOKED, revoked_at and revoke_reason"
      - "moves every PLANNED Procedure under an Encounter citing this consent to INELIGIBLE and releases its chair minutes"

  - method: POST
    path: "/mobile-dentistry/consents/{id}/amend-tier"
    description: "Mints a replacement Consent at a new scope tier and supersedes this one. OCC-guarded on the Patient's version."
    roles: [ProgramAdmin, SiteCoordinator]
    code: 201
    input: [new_scope_tier, expected_patient_version, "amend_reason?"]
    output: Consent
    side_effects:
      - "creates the replacement Consent in ACTIVE and returns it"
      - "sets the old row's status SUPERSEDED and superseded_by_consent_id"
      - "on a downgrade, runs the depth-3 tier cascade (INELIGIBLE procedures, released chair minutes, DEFERRED encounters, CANCELLED plans)"
      - "increments Patient.version by 1"

  # ---- portable units -------------------------------------------------------
  - method: POST
    path: "/mobile-dentistry/portable-units"
    description: "Registers a portable operatory unit. It starts AVAILABLE with calibration_status EXPIRED until first calibrated."
    roles: [ProgramAdmin]
    code: 201
    input: [unit_code]
    output: PortableUnit
    side_effects: ["creates a PortableUnit in status AVAILABLE with last_calibrated_on null"]

  - method: GET
    path: "/mobile-dentistry/portable-units/{id}"
    description: "Reads one portable unit with its freshly recomputed calibration_status."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, DentalAssistant]
    code: 200
    input: []
    output: PortableUnit
    side_effects: []

  - method: POST
    path: "/mobile-dentistry/portable-units/{id}/calibrate"
    description: "Records a calibration, resetting the 180-day validity window. Outside the period freeze gate by design."
    roles: [ProgramAdmin, DentalAssistant]
    code: 200
    input: [calibrated_on]
    output: PortableUnit
    side_effects: ["sets last_calibrated_on, recomputes calibration_due_on and calibration_status", "increments PortableUnit.version by 1"]

  # ---- sterilization loads --------------------------------------------------
  - method: POST
    path: "/mobile-dentistry/sterilization-loads"
    description: "Records a sterilizer cycle for a unit; the biological indicator starts PENDING for SPORE_INCUBATION_HOURS."
    roles: [ProgramAdmin, DentalAssistant, FieldHygienist]
    code: 201
    input: [portable_unit_id, loaded_by_staff_id, load_number, cycle_completed_at, "site_visit_id?"]
    output: SterilizationLoad
    side_effects: ["computes incubation_ends_at = cycle_completed_at + SPORE_INCUBATION_HOURS"]

  - method: GET
    path: "/mobile-dentistry/sterilization-loads"
    description: "Lists sterilization loads with FK filters."
    roles: [ProgramAdmin, DentalAssistant, FieldHygienist, FieldDentist]
    code: 200
    input: ["portable_unit_id?", "site_visit_id?", "loaded_by_staff_id?", "result_recorded_by_staff_id?", "spore_result?", "limit?", "offset?"]
    output: SterilizationLoad[]
    side_effects: []

  - method: GET
    path: "/mobile-dentistry/sterilization-loads/{id}"
    description: "Reads one sterilization load."
    roles: [ProgramAdmin, DentalAssistant, FieldHygienist, FieldDentist]
    code: 200
    input: []
    output: SterilizationLoad
    side_effects: []

  - method: POST
    path: "/mobile-dentistry/sterilization-loads/{id}/spore-result"
    description: "Records the biological indicator reading after the incubation window. A FAILED result launches the depth-5 taint cascade; a PASSED result releases a quarantined unit. Segregation of duties applies."
    roles: [DentalAssistant, FieldHygienist, FieldDentist]
    code: 200
    input: [result, result_recorded_by_staff_id]
    output: SterilizationLoad
    side_effects:
      - "PASSED: sets PortableUnit.last_passed_load_at and returns a QUARANTINED unit to AVAILABLE"
      - "FAILED: quarantines the unit and runs cascade links 2-5 (TAINTED procedures, encounter repricing revert, SUPERSEDED plans, ABANDONED referrals)"
      - "increments SterilizationLoad.version by 1"

  # ---- staff ----------------------------------------------------------------
  - method: POST
    path: "/mobile-dentistry/staff-members"
    description: "Registers a clinician or assistant with a licence state and a supervision authorisation."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, staff_role, license_number, license_state, supervision_level, "credential_status?", "credential_expires_on?"]
    output: StaffMember
    side_effects: ["creates a StaffMember, defaulting credential_status to ACTIVE"]

  - method: GET
    path: "/mobile-dentistry/staff-members/{id}"
    description: "Reads one staff member."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, FieldHygienist, DentalAssistant]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  - method: PATCH
    path: "/mobile-dentistry/staff-members/{id}"
    description: "Updates credential standing, supervision authorisation or licence state. Outside the period freeze gate by design."
    roles: [ProgramAdmin]
    code: 200
    input: ["credential_status?", "supervision_level?", "license_state?", "credential_expires_on?"]
    output: StaffMember
    side_effects: ["applies the supplied fields", "increments StaffMember.version by 1"]

  # ---- site visits ----------------------------------------------------------
  - method: POST
    path: "/mobile-dentistry/site-visits"
    description: "Schedules a mobile visit: a site, a period, a portable unit and a staff assignment over a time window. Period-gated."
    roles: [ProgramAdmin, SiteCoordinator]
    code: 201
    input: [site_id, program_period_id, portable_unit_id, lead_staff_id, scheduled_start_at, scheduled_end_at, "onsite_dentist_staff_id?", "remote_dentist_staff_id?", "chair_count?"]
    output: SiteVisit
    side_effects:
      - "computes capacity_chair_minutes per calculation site_visit_capacity_chair_minutes"
      - "creates the SiteVisit in status SCHEDULED with booked_chair_minutes 0"

  - method: GET
    path: "/mobile-dentistry/site-visits"
    description: "Lists site visits with FK filters."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, FieldHygienist, DentalAssistant, BillingSpecialist]
    code: 200
    input: ["site_id?", "program_period_id?", "portable_unit_id?", "lead_staff_id?", "onsite_dentist_staff_id?", "remote_dentist_staff_id?", "status?", "limit?", "offset?"]
    output: SiteVisit[]
    side_effects: []

  - method: GET
    path: "/mobile-dentistry/site-visits/{id}"
    description: "Reads one site visit including its live chair-minute ledger."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, FieldHygienist, DentalAssistant, BillingSpecialist]
    code: 200
    input: []
    output: SiteVisit
    side_effects: []

  - method: POST
    path: "/mobile-dentistry/site-visits/{id}/reschedule"
    description: "Moves a SCHEDULED visit to a new window (self-loop), re-running both overlap rules. Period-gated."
    roles: [ProgramAdmin, SiteCoordinator]
    code: 200
    input: [scheduled_start_at, scheduled_end_at]
    output: SiteVisit
    side_effects:
      - "replaces the window, recomputes capacity_chair_minutes, increments reschedule_count"
      - "increments SiteVisit.version by 1"

  - method: POST
    path: "/mobile-dentistry/site-visits/{id}/start"
    description: "Starts a visit; this is where the unit quarantine, calibration, spore-pending, credential, licence and site-hold gates all bite. Period-gated."
    roles: [FieldDentist, FieldHygienist, DentalAssistant]
    code: 200
    input: []
    output: SiteVisit
    side_effects:
      - "sets started_at and moves the PortableUnit from AVAILABLE to IN_SERVICE"
      - "may first run the lazy incubation-timeout sweep (priority 15) which can FAIL a load and taint procedures before refusing the start"
      - "increments SiteVisit.version by 1"

  - method: POST
    path: "/mobile-dentistry/site-visits/{id}/complete"
    description: "Completes an IN_PROGRESS visit, closes its examined/treated encounters and no-shows the unseen ones. Period-gated."
    roles: [FieldDentist, FieldHygienist, DentalAssistant]
    code: 200
    input: []
    output: SiteVisit
    side_effects:
      - "sets completed_at and returns the PortableUnit to AVAILABLE"
      - "moves EXAMINED and TREATED encounters to CLOSED and REGISTERED encounters to NO_SHOW"
      - "increments SiteVisit.version by 1"

  - method: POST
    path: "/mobile-dentistry/site-visits/{id}/cancel"
    description: "Cancels a SCHEDULED or HOLD_BLOCKED visit. Period-gated."
    roles: [ProgramAdmin, SiteCoordinator]
    code: 200
    input: ["cancel_reason?"]
    output: SiteVisit
    side_effects:
      - "sets cancelled_at and moves REGISTERED encounters to NO_SHOW"
      - "increments SiteVisit.version by 1"

  # ---- encounters -----------------------------------------------------------
  - method: POST
    path: "/mobile-dentistry/encounters"
    description: "Registers a patient at a visit. OCC-guarded on the SiteVisit's version. Period-gated."
    roles: [DentalAssistant, FieldHygienist, FieldDentist, SiteCoordinator]
    code: 201
    input: [site_visit_id, patient_id, consent_id, expected_site_visit_version, "coverage_id?"]
    output: Encounter
    side_effects:
      - "creates the Encounter with clinical_status REGISTERED and billing_status UNBILLED"
      - "increments SiteVisit.version by 1"

  - method: GET
    path: "/mobile-dentistry/encounters"
    description: "Lists encounters with FK filters."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, FieldHygienist, DentalAssistant, BillingSpecialist]
    code: 200
    input: ["site_visit_id?", "patient_id?", "consent_id?", "coverage_id?", "clinical_status?", "billing_status?", "limit?", "offset?"]
    output: Encounter[]
    side_effects: []

  - method: GET
    path: "/mobile-dentistry/encounters/{id}"
    description: "Reads one encounter with both status axes and every money field."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, FieldHygienist, DentalAssistant, BillingSpecialist]
    code: 200
    input: []
    output: Encounter
    side_effects: []

  - method: POST
    path: "/mobile-dentistry/encounters/{id}/screen"
    description: "Records the screening findings, computes the triage band and auto-creates the PERFORMED D0190 procedure. Period-gated."
    roles: [FieldHygienist, FieldDentist]
    code: 200
    input: [performing_staff_id, cavitated_lesion_count, pain_reported, abscess_or_swelling, untreated_decay_present, "denture_problem?", "oral_hygiene_score?", "medical_complexity_count?"]
    output: Encounter
    side_effects:
      - "computes triage_band per calculation triage_band"
      - "creates a PERFORMED D0190 Procedure and books its chair minutes"
      - "moves clinical_status REGISTERED -> SCREENED"

  - method: POST
    path: "/mobile-dentistry/encounters/{id}/exam"
    description: "Records the dentist exam (onsite or teledentistry) and auto-creates the PERFORMED D0150 procedure. A public-health hygienist may record a TELEDENTISTRY exam under general supervision, which is why FieldHygienist appears here; the supervision matrix at priority 20 is what actually decides who may sign it. Period-gated."
    roles: [FieldDentist, FieldHygienist]
    code: 200
    input: [performing_staff_id, exam_modality, "teledentistry_reviewed_at?"]
    output: Encounter
    side_effects:
      - "creates a PERFORMED D0150 Procedure and books its chair minutes"
      - "moves clinical_status SCREENED -> EXAMINED"

  - method: POST
    path: "/mobile-dentistry/encounters/{id}/close"
    description: "Closes an EXAMINED or TREATED encounter once no procedure is still PLANNED. Period-gated."
    roles: [FieldDentist, FieldHygienist]
    code: 200
    input: []
    output: Encounter
    side_effects: ["moves clinical_status to CLOSED", "increments Encounter.version by 1"]

  - method: POST
    path: "/mobile-dentistry/encounters/{id}/price"
    description: "Prices the encounter under one of the three regimes and pins every money field. Period-gated."
    roles: [BillingSpecialist]
    code: 200
    input: ["manual_patient_responsibility_cents?"]
    output: Encounter
    side_effects:
      - "runs encounter_subtotal_cents, encounter_supply_surcharge_cents, encounter_allowed_amount_cents, patient_responsibility_cents and encounter_money_split"
      - "pins pricing_regime and moves billing_status UNBILLED -> PRICED"
      - "may first run the lazy coverage-expiry sweep (priority 35) which can EXPIRE the coverage before refusing the pricing"

  - method: POST
    path: "/mobile-dentistry/encounters/{id}/claim"
    description: "Submits or resubmits the claim (PRICED -> CLAIMED, DENIED -> CLAIMED). Period-gated."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Encounter
    side_effects: ["moves billing_status to CLAIMED and clears denial_reason", "increments Encounter.version by 1"]

  - method: POST
    path: "/mobile-dentistry/encounters/{id}/adjudicate"
    description: "Records the payer's decision on a CLAIMED encounter. Period-gated."
    roles: [BillingSpecialist]
    code: 200
    input: [outcome, "denial_reason?"]
    output: Encounter
    side_effects: ["moves billing_status to PAID or DENIED", "increments Encounter.version by 1"]

  # ---- procedures -----------------------------------------------------------
  - method: POST
    path: "/mobile-dentistry/procedures"
    description: "Plans a procedure on an encounter, booking its chair minutes. OCC-guarded on the Encounter's version. Period-gated."
    roles: [FieldDentist, FieldHygienist]
    code: 201
    input: [encounter_id, procedure_code, expected_encounter_version, "tooth_number?", "surface?", "treatment_plan_id?"]
    output: Procedure
    side_effects:
      - "sets required_tier, chair_minutes and charge_cents from the code tables"
      - "increments SiteVisit.booked_chair_minutes by chair_minutes"
      - "increments Encounter.version by 1"

  - method: GET
    path: "/mobile-dentistry/procedures"
    description: "Lists procedures with FK filters; this is the only discovery channel for the D0190/D0150 rows created by screen and exam."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, FieldHygienist, DentalAssistant, BillingSpecialist]
    code: 200
    input: ["encounter_id?", "treatment_plan_id?", "sterilization_load_id?", "performing_staff_id?", "procedure_code?", "status?", "limit?", "offset?"]
    output: Procedure[]
    side_effects: []

  - method: GET
    path: "/mobile-dentistry/procedures/{id}"
    description: "Reads one procedure."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, FieldHygienist, DentalAssistant, BillingSpecialist]
    code: 200
    input: []
    output: Procedure
    side_effects: []

  - method: POST
    path: "/mobile-dentistry/procedures/{id}/perform"
    description: "Performs a PLANNED procedure. Supervision, licence, credential, consent-tier, sealant-surface, varnish-interval and varnish-cap rungs all bite here. Period-gated."
    roles: [FieldDentist, FieldHygienist]
    code: 200
    input: [performing_staff_id, sterilization_load_id]
    output: Procedure
    side_effects:
      - "sets status PERFORMED, performed_at, performing_staff_id and sterilization_load_id"
      - "for D1206 increments Patient.varnish_applications_in_period and sets last_varnish_date"
      - "moves the Encounter's clinical_status EXAMINED -> TREATED"

  - method: POST
    path: "/mobile-dentistry/procedures/{id}/void"
    description: "Voids a PLANNED, PERFORMED or TAINTED procedure, releasing its chair minutes and reverting a PRICED encounter to UNBILLED. Period-gated."
    roles: [FieldDentist]
    code: 200
    input: ["void_reason?"]
    output: Procedure
    side_effects:
      - "sets status VOIDED and releases chair minutes"
      - "reverses the varnish counter for D1206"
      - "recomputes the encounter's subtotal/surcharge/total and reverts PRICED to UNBILLED"

  # ---- treatment plans ------------------------------------------------------
  - method: POST
    path: "/mobile-dentistry/treatment-plans"
    description: "Creates a DRAFT treatment plan from an examined encounter, copying its triage band as the plan's urgency band. Period-gated."
    roles: [FieldDentist, FieldHygienist]
    code: 201
    input: [encounter_id, patient_id, authoring_staff_id, "planned_procedure_codes?"]
    output: TreatmentPlan
    side_effects: ["copies Encounter.triage_band into urgency_band", "creates the plan in DRAFT with follow_up_status NOT_DUE"]

  - method: GET
    path: "/mobile-dentistry/treatment-plans"
    description: "Lists treatment plans with FK filters."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, FieldHygienist, BillingSpecialist]
    code: 200
    input: ["encounter_id?", "patient_id?", "authoring_staff_id?", "plan_status?", "follow_up_status?", "limit?", "offset?"]
    output: TreatmentPlan[]
    side_effects: []

  - method: GET
    path: "/mobile-dentistry/treatment-plans/{id}"
    description: "Reads one treatment plan with its freshly recomputed follow_up_status."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, FieldHygienist, BillingSpecialist]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []

  - method: POST
    path: "/mobile-dentistry/treatment-plans/{id}/activate"
    description: "Activates a DRAFT plan and starts the band-driven follow-up cadence. Period-gated."
    roles: [FieldDentist]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects:
      - "sets activated_on and computes follow_up_due_date per calculation follow_up_due_date"
      - "increments TreatmentPlan.version by 1"

  - method: POST
    path: "/mobile-dentistry/treatment-plans/{id}/follow-up-contact"
    description: "Records a follow-up contact on an ACTIVE plan (self-loop), restarting the cadence. Outside the period freeze gate by design."
    roles: [SiteCoordinator, FieldDentist, FieldHygienist]
    code: 200
    input: ["contact_note?"]
    output: TreatmentPlan
    side_effects:
      - "sets last_contact_at, increments contact_attempt_count, recomputes follow_up_due_date and sets follow_up_status CONTACTED"
      - "increments TreatmentPlan.version by 1"

  # ---- referrals ------------------------------------------------------------
  - method: POST
    path: "/mobile-dentistry/referrals"
    description: "Opens a referral to a dental home for an ACTIVE plan. Outside the period freeze gate by design."
    roles: [FieldDentist, SiteCoordinator]
    code: 201
    input: [treatment_plan_id, patient_id, dental_home_name]
    output: Referral
    side_effects: ["creates the Referral in OPEN with attempt_count 0"]

  - method: GET
    path: "/mobile-dentistry/referrals"
    description: "Lists referrals with FK filters."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, BillingSpecialist]
    code: 200
    input: ["treatment_plan_id?", "patient_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: GET
    path: "/mobile-dentistry/referrals/{id}"
    description: "Reads one referral with its SLA deadline and attempt ledger."
    roles: [ProgramAdmin, SiteCoordinator, FieldDentist, BillingSpecialist]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: POST
    path: "/mobile-dentistry/referrals/{id}/send"
    description: "Sends or re-sends the referral. The (K+1)-th attempt abandons the referral first and then refuses. Outside the period freeze gate by design."
    roles: [FieldDentist, SiteCoordinator]
    code: 200
    input: ["dental_home_name?"]
    output: Referral
    side_effects:
      - "increments attempt_count, sets last_sent_at and next_eligible_send_at"
      - "computes due_at on the first send only, per calculation referral_due_at"
      - "at the cap: writes ABANDONED with case_management_opened_at and THEN refuses with ERR_REFERRAL_CAP_REACHED"

  - method: POST
    path: "/mobile-dentistry/referrals/{id}/record-response"
    description: "Records the dental home's response, or marks the completion that closes the plan. Outside the period freeze gate by design."
    roles: [FieldDentist, SiteCoordinator]
    code: 200
    input: [outcome]
    output: Referral
    side_effects:
      - "moves the referral to ACCEPTED, DECLINED, NO_RESPONSE or COMPLETED"
      - "on COMPLETED, moves the TreatmentPlan from ACTIVE to COMPLETED"

  # ---- coverage -------------------------------------------------------------
  - method: POST
    path: "/mobile-dentistry/coverages"
    description: "Records a patient's coverage in UNVERIFIED. Outside the period freeze gate by design."
    roles: [BillingSpecialist, SiteCoordinator, ProgramAdmin]
    code: 201
    input: [patient_id, payer_type, "payer_name?", "member_id?"]
    output: Coverage
    side_effects: ["creates the Coverage in verification_status UNVERIFIED"]

  - method: GET
    path: "/mobile-dentistry/coverages"
    description: "Lists coverages, optionally filtered by patient."
    roles: [ProgramAdmin, SiteCoordinator, BillingSpecialist]
    code: 200
    input: ["patient_id?", "payer_type?", "verification_status?", "limit?", "offset?"]
    output: Coverage[]
    side_effects: []

  - method: GET
    path: "/mobile-dentistry/coverages/{id}"
    description: "Reads one coverage including the sliding-fee determination."
    roles: [ProgramAdmin, SiteCoordinator, BillingSpecialist]
    code: 200
    input: []
    output: Coverage
    side_effects: []

  - method: POST
    path: "/mobile-dentistry/coverages/{id}/verify"
    description: "Verifies or re-verifies eligibility; for UNINSURED coverage this is where the FPL percent and sliding-fee band are determined. Outside the period freeze gate by design."
    roles: [BillingSpecialist]
    code: 200
    input: [verified_through_date]
    output: Coverage
    side_effects:
      - "sets verification_status VERIFIED, verified_at and verified_through_date"
      - "for UNINSURED, computes fpl_percent, sliding_fee_band and determination_date"
      - "increments Coverage.version by 1"

  # ---- reports --------------------------------------------------------------
  - method: POST
    path: "/mobile-dentistry/reports"
    description: "Creates a DRAFT report of one of the three audience types. Outside the period freeze gate by design."
    roles: [ProgramAdmin, SiteCoordinator]
    code: 201
    input: [program_period_id, report_type, "site_id?", "patient_id?", "recipient_user_id?"]
    output: Report
    side_effects: ["creates the Report in DRAFT with payload null"]

  - method: GET
    path: "/mobile-dentistry/reports"
    description: "Lists reports with FK filters. A SiteCoordinator sees only reports whose site_id equals their own id."
    roles: [ProgramAdmin, SiteCoordinator]
    code: 200
    input: ["program_period_id?", "site_id?", "patient_id?", "report_type?", "status?", "limit?", "offset?"]
    output: Report[]
    side_effects: []

  - method: GET
    path: "/mobile-dentistry/reports/{id}"
    description: "Reads one report. This is where the confidentiality wall lives: a Guardian may read only a PARENT report addressed to their own X-User-ID, and anything else is reported as ERR_NOT_FOUND rather than ERR_UNAUTHORIZED."
    roles: [ProgramAdmin, SiteCoordinator, Guardian]
    code: 200
    input: []
    output: Report
    side_effects: []

  - method: POST
    path: "/mobile-dentistry/reports/{id}/generate"
    description: "Builds or rebuilds the report payload per calculation report_payload. Outside the period freeze gate by design."
    roles: [ProgramAdmin, SiteCoordinator]
    code: 200
    input: []
    output: Report
    side_effects:
      - "sets payload and generated_at, clears stale_reason"
      - "moves status DRAFT -> GENERATED, GENERATED -> GENERATED, or STALE -> GENERATED"

  - method: POST
    path: "/mobile-dentistry/reports/{id}/submit"
    description: "Submits a GENERATED PROGRAM_PERIOD report to the state. This is what arms the global write gate. Outside the period freeze gate by design."
    roles: [ProgramAdmin]
    code: 200
    input: [state_submission_ref]
    output: Report
    side_effects:
      - "sets submitted_at and ProgramPeriod.state_submission_ref"
      - "cascade link 2: moves the ProgramPeriod REPORTING -> SUBMITTED and stamps frozen_at"
      - "cascade link 3: cancels every SCHEDULED SiteVisit in the period"

# =============================================================================
# §1.6 Error Code Catalog — 36 codes
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, or X-User-Role is not a declared role (validation priority 1)."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role is not listed on the endpoint (priority 2), or a SiteCoordinator reads a report belonging to another site or a PROGRAM_PERIOD report (priority 5)."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path id or body foreign key does not resolve (priority 3), or a Guardian reads a report that is not their own PARENT report (confidentiality wall, priority 4)."
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, wrong JSON type, out-of-range integer, malformed ISO date/datetime, or reversed start/end ordering (priority 6)."
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "One of the enumerated request fields listed in priority 7 carries a value outside its declared set."
  - id: ERR_CONSENT_REGIME_FIELDS
    http: 400
    condition: "Consent creation is missing a field its regime requires, carries a field the other regime owns, or names a regime that disagrees with Site.site_type (priority 8)."
  - id: ERR_PERIOD_FROZEN
    http: 409
    condition: "A PERIOD_GATED_ENDPOINTS write resolves to a ProgramPeriod in status SUBMITTED or CLOSED (priority 9)."
  - id: ERR_SITE_ON_HOLD
    http: 409
    condition: "A visit-scheduling or registration write targets a SUSPENDED site or a window intersecting an ACTIVE SiteHold (priority 10)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row is not in a state from which the requested transition is declared (priority 11). This is also what an already-ABANDONED referral send and an already-EXPIRED consent revoke surface."
  - id: ERR_PROCEDURE_TAINTED
    http: 409
    condition: "Pricing or claiming an encounter whose tainted_procedure_count is greater than zero (priority 12)."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_patient_version, expected_site_visit_version or expected_encounter_version does not match the parent's current version (priority 13)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "The staff member reading a spore indicator is the same one who ran the load (priority 14)."
  - id: ERR_UNIT_QUARANTINED
    http: 409
    condition: "The assigned portable unit is QUARANTINED, including the case where the lazy incubation-timeout sweep just quarantined it (priority 15)."
  - id: ERR_UNIT_CALIBRATION_EXPIRED
    http: 409
    condition: "The assigned portable unit's calibration_status is EXPIRED (priority 16)."
  - id: ERR_SPORE_RESULT_PENDING
    http: 409
    condition: "A load on the unit is still PENDING inside its incubation window, or a spore result is recorded before incubation_ends_at (priority 17)."
  - id: ERR_CREDENTIAL_LAPSED
    http: 409
    condition: "A staff member the request relies on has credential_status other than ACTIVE (priority 18)."
  - id: ERR_LICENSE_STATE_MISMATCH
    http: 422
    condition: "A staff member's license_state differs from the site's state_code (priority 19)."
  - id: ERR_SUPERVISION_NOT_PERMITTED
    http: 422
    condition: "Calculation supervision_permitted returns false for the code/role/level/presence combination (priority 20)."
  - id: ERR_TELEDENTISTRY_REVIEW_WINDOW
    http: 422
    condition: "A teledentistry exam's teledentistry_reviewed_at is absent or outside the 72-hour review window (priority 21)."
  - id: ERR_CONSENT_MISSING
    http: 422
    condition: "The cited consent belongs to a different patient or a different site than the encounter being created (priority 22)."
  - id: ERR_CONSENT_REVOKED
    http: 409
    condition: "The cited consent is REVOKED or SUPERSEDED (priority 23)."
  - id: ERR_CONSENT_EXPIRED
    http: 409
    condition: "The cited consent has passed expires_at, whether it was already EXPIRED or is flipped to EXPIRED by the lazy sweep in this same request (priority 24)."
  - id: ERR_CAPACITY_DETERMINATION_REQUIRED
    http: 422
    condition: "Verifying an SNF_RESPONSIBLE_PARTY consent for a patient whose capacity_determination is NOT_ASSESSED (priority 25)."
  - id: ERR_CONSENT_TIER_INSUFFICIENT
    http: 422
    condition: "The procedure's required_tier outranks the encounter consent's scope_tier (priority 26)."
  - id: ERR_SURFACE_INELIGIBLE
    http: 422
    condition: "A D1351 sealant names a tooth or surface outside the eligible sets, omits either, or targets a tooth/surface pair already carrying a live sealant (priority 27)."
  - id: ERR_VARNISH_INTERVAL
    http: 422
    condition: "Fewer than VARNISH_MIN_INTERVAL_DAYS whole days have elapsed since the patient's last varnish (priority 28)."
  - id: ERR_VARNISH_CAP_EXCEEDED
    http: 422
    condition: "The patient has already reached VARNISH_MAX_APPLICATIONS_PER_PERIOD varnish applications in the period (priority 29)."
  - id: ERR_UNIT_DOUBLE_BOOKED
    http: 409
    condition: "The portable unit's buffered interval collides with another live visit (priority 30)."
  - id: ERR_STAFF_DOUBLE_BOOKED
    http: 409
    condition: "An assigned staff member's closed interval collides with another live visit, including exact endpoint adjacency (priority 31)."
  - id: ERR_CHAIR_CAPACITY_EXCEEDED
    http: 422
    condition: "Booking this procedure would push booked_chair_minutes past capacity_chair_minutes (priority 32)."
  - id: ERR_REFERRAL_NOT_DUE
    http: 422
    condition: "A re-send from NO_RESPONSE is attempted before next_eligible_send_at (priority 33)."
  - id: ERR_REFERRAL_CAP_REACHED
    http: 409
    condition: "A send is attempted once attempt_count has reached REFERRAL_MAX_ATTEMPTS; the referral is abandoned first and then the request is refused (priority 34)."
  - id: ERR_COVERAGE_UNVERIFIED
    http: 422
    condition: "Pricing an encounter whose coverage is missing, UNVERIFIED, or expired — including the case where the lazy sweep just expired it (priority 35)."
  - id: ERR_SLIDING_FEE_MISSING
    http: 422
    condition: "Verifying an UNINSURED coverage for a patient with no annual_household_income_cents (priority 36)."
  - id: ERR_MEDICAID_BALANCE_BILL
    http: 422
    condition: "A manual_patient_responsibility_cents override is supplied on an encounter whose coverage payer_type is MEDICAID_MCO (priority 37)."
  - id: ERR_REPORT_STALE
    http: 409
    condition: "Submitting a PROGRAM_PERIOD report whose status is STALE (priority 38)."

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Runs the program: periods, sites, holds, units, staff, calibration, reporting and the logical clock. Deliberately NOT a superset — it cannot screen, examine, perform, price, claim or adjudicate."
    identity: "opaque"
    exclusive_operations:
      - "POST /mobile-dentistry/program-periods"
      - "POST /mobile-dentistry/program-periods/{id}/status"
      - "POST /mobile-dentistry/sites"
      - "POST /mobile-dentistry/site-holds"
      - "POST /mobile-dentistry/site-holds/{id}/release"
      - "POST /mobile-dentistry/portable-units"
      - "POST /mobile-dentistry/staff-members"
      - "PATCH /mobile-dentistry/staff-members/{id}"
      - "POST /mobile-dentistry/reports/{id}/submit"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /mobile-dentistry/patients"
      - "POST /mobile-dentistry/consents"
