  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: start_repair_requires_approved_quote
        grounds:
          - state_machines.RepairOrder.AUTHORIZED_to_IN_REPAIR
          - state_machines.Quote.ISSUED_to_APPROVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair Quote -> RepairOrder: start-repair is rejected while no
          APPROVED quote exists for the repair order (RO still QUOTE_IN_PROGRESS
          with only a DRAFT quote) — a different entity pair than the
          CapacityWindow -> Quote dependency instance.
        test_recipe:
          setup:
            - "Customer, GENERAL_VALVE asset, window capacity 1000"
            - "RO driven to QUOTE_IN_PROGRESS; quote exists but only in DRAFT (never issued/approved)"
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Pine Bluff Paper", account_number: "PB-940", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: false }, as: ServiceManager, captures: { cust: $.data.id } }
