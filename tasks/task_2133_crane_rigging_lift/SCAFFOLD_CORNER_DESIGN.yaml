              as: SafetyManager
            - call: "GET /rigging-gear/${gear_id}"
              payload: {}
              as: SafetyManager
              captures: { ewll2: $.data.effective_wll_lb }
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "REPAIR_PASS", inspector_note: "repair 3" }
              as: SafetyManager
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "REPAIR_PASS", inspector_note: "repair 4" }
              as: SafetyManager
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "REPAIR_PASS", inspector_note: "repair 5" }
              as: SafetyManager
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "REPAIR_PASS", inspector_note: "repair 6" }
              as: SafetyManager
            - call: "GET /rigging-gear/${gear_id}"
              payload: {}
              as: SafetyManager
              captures: { ewll6: $.data.effective_wll_lb, rc6: $.data.repair_count }
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "REPAIR_PASS", inspector_note: "repair 7" }
              as: SafetyManager
            - call: "GET /rigging-gear/${gear_id}"
              payload: {}
              as: SafetyManager
              captures: { ewll7: $.data.effective_wll_lb, rc7: $.data.repair_count, rated: $.data.rated_wll_lb }
          assert:
            - "${ewll0} == 30000"
            - "${ewll1} == 28500"
            - "${ewll2} == 27000"
            - "${ewll6} == 21000 and ${rc6} == 6"
            - "${ewll7} == 21000 and ${rc7} == 7   (the 0.70 floor holds)"
            - "${rated} == 30000   (the rated limit never changes)"

