# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3038_real_estate_rent_based_franchise_economics
#
# Breadth probe across the claim-extraction-guide taxonomy. Corners already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: site_create_returns_defaults_and_common_fields
        claim_type: Creation
        grounds:
          - entities.Site
          - endpoints.POST_/franchise-system/sites
        distinguishing_aspect: "A FEE_SIMPLE site created with site_code+address returns 201 with holding_status HELD, version 1, system id/created_at/updated_at — holding_status is never client-supplied."
        test_recipe:
          setup: ["Clock at default 2026-09-01T00:00:00Z. Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /franchise-system/sites"
              payload: { site_code: "CS1", address: "100 Corner St", acquisition_type: "FEE_SIMPLE" }
              as: FranchisorAdmin
              captures: { cs1: $.data.id }
          assert:
            - "status 201, response_type object"
            - "Site.${cs1}.holding_status == HELD and version == 1"
            - "response data carries non-null id, created_at, updated_at"
            - "meta.api_request_id and meta.api_request_timestamp present"

      - name: ground_lease_site_requires_expiry_field
        claim_type: Required Fields
        grounds:
          - entities.Site.fields.ground_lease_expiry
          - endpoints.POST_/franchise-system/sites
        distinguishing_aspect: "GROUND_LEASE without ground_lease_expiry is rejected 400 ERR_INVALID_REQUEST; FEE_SIMPLE WITH ground_lease_expiry is also rejected (field forbidden)."
        test_recipe:
          setup: ["Clock default. Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /franchise-system/sites"
              payload: { site_code: "CS2", address: "102 Corner St", acquisition_type: "GROUND_LEASE" }
              as: FranchisorAdmin
              captures: { e1: $.data.error_id }
          assert:
            - "status 400 and error_id == ERR_INVALID_REQUEST (missing required ground_lease_expiry for GROUND_LEASE)"

      - name: operator_defaults_null_capacity_before_review
        claim_type: Defaults
        grounds:
          - entities.Operator.fields.capacity_score
          - entities.Operator.fields.max_stores
        distinguishing_aspect: "A freshly registered operator has capacity_score null, capacity_grade null, max_stores 0, stores_operated_count 0, delinquency_balance_cents 0, escrow_balance_cents 0."
        test_recipe:
          setup: ["Clock default. Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /franchise-system/operators"
              payload: { legal_name: "Corner Op LLC", fy_net_worth_cents: 50000000, fy_operating_income_cents: 1000000 }
              as: FranchisorAdmin
              captures: { cop: $.data.id }
          assert:
            - "Operator.${cop}.status == CANDIDATE"
            - "Operator.${cop}.capacity_score is null and capacity_grade is null"
            - "Operator.${cop}.max_stores == 0 and stores_operated_count == 0"
            - "Operator.${cop}.delinquency_balance_cents == 0 and escrow_balance_cents == 0"

      - name: agreement_term_end_date_computed_from_term
        claim_type: Computed Fields
        grounds:
          - entities.FranchiseAgreement.fields.term_end_date
        distinguishing_aspect: "term_end_date is computed (term_start_date + term_years - 1 day), never client-set; a client-supplied term_end_date in the create payload is ignored."
        test_recipe:
          setup: ["Clock default. Site, approved strong operator, store SETUP."]
          setup_api_calls:
            - call: "POST /franchise-system/sites"
              payload: { site_code: "CS3", address: "103 Corner St", acquisition_type: "FEE_SIMPLE" }
              as: FranchisorAdmin
              captures: { csite3: $.data.id }
            - call: "POST /franchise-system/operators"
              payload: { legal_name: "Corner Op3 LLC", fy_net_worth_cents: 400000000, fy_operating_income_cents: 100000000 }
              as: FranchisorAdmin
              captures: { cop3: $.data.id }
            - call: "POST /franchise-system/capacity-reviews"
              payload: { operator_id: "${cop3}", review_period: "2026" }
              as: FranchiseFinance
              captures: { ccr3: $.data.id }
            - call: "POST /franchise-system/capacity-reviews/${ccr3}/submit"
              payload: {}
              as: FranchiseFinance
            - call: "POST /franchise-system/operators/${cop3}/approve"
              payload: {}
              as: FranchisorAdmin
            - call: "GET /franchise-system/operators/${cop3}"
              payload: {}
              as: FranchiseFinance
              captures: { cop3_v: $.data.version }
            - call: "POST /franchise-system/stores"
              payload: { store_code: "CST3", site_id: "${csite3}", operator_id: "${cop3}", expected_operator_version: "${cop3_v}" }
              as: FranchisorAdmin
              captures: { cst3: $.data.id }
          trigger:
            - call: "POST /franchise-system/agreements"
              payload: { store_id: "${cst3}", operator_id: "${cop3}", initial_fee_cents: 4500000, royalty_rate: 0.04, ad_fund_rate: 0.02, occupancy_allocation_pct: 0.60, term_years: 5, term_start_date: "2026-04-01" }
              as: FranchisorAdmin
              captures: { cag3: $.data.id }
          assert:
            - "FranchiseAgreement.${cag3}.term_end_date == 2031-03-31 (5 years from 2026-04-01 minus one day)"
            - "FranchiseAgreement.${cag3}.status == DRAFT"

      - name: site_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/franchise-system/sites/{siteId}
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID produces 404 ERR_RESOURCE_NOT_FOUND, not a generic 400."
        test_recipe:
          setup: ["Clock default. Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /franchise-system/sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: FranchisorAdmin
              captures: { e2: $.data.error_id }
          assert:
            - "status 404 and error_id == ERR_RESOURCE_NOT_FOUND"

