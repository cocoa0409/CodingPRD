          The four buckets are consumed in a fixed order and the FIRST failing bucket decides the
          reported reason. The day is deliberately built so a 9 guest, 3 vehicle DAY_TICKET party busts
          both parking (3 > 2 free stalls) and the non-season pool (9 > 8): it must report PARKING, not
