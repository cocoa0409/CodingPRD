      - name: integrity_report_submission_is_gated_only_for_the_integrity_report_type
        claim_type: violation_to_error
        grounds:
          - validations.priority_39_ERR_OPEN_INTEGRITY_FINDINGS
          - errors.ERR_OPEN_INTEGRITY_FINDINGS
          - entities.RegulatoryReport.fields.open_finding_count
          - entities.RegulatoryReport.fields.report_type
          - calculations.report_variance
        distinguishing_aspect: |
          open_finding_count is snapshotted on BOTH report types but gates only one: with a single OPEN
          RemediationProgram on the field, the INVENTORY_VERIFICATION report submits successfully while
          the INTEGRITY_PROGRAM_STATUS report is refused with ERR_OPEN_INTEGRITY_FINDINGS (422). The
          count is also re-evaluated at submission rather than trusted from preparation, so closing the
          program lets the very same report through without re-preparing it.
        test_recipe:
          setup:
            - "Field F_MINI with two wells; MINI-1 fails a PRESSURE_TEST recorded by eng-a at clock 2026-08-02T07:00:00Z, leaving one OPEN RemediationProgram P1."
            - "officer-a prepares two reports on F_MINI for 2026-08-01..2026-08-31 with measured_inventory_dth 250000: one INVENTORY_VERIFICATION and one INTEGRITY_PROGRAM_STATUS."
