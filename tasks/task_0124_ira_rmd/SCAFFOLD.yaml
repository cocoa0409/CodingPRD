scenario: |
  IRA Management & RMD Calculation: Traditional/Roth, annual contribution cap (including catch-up),
  Backdoor Roth conversion, tax form 1099-R, age-based RMD, SECURE Act 10-year rule

domain_name: ira-rmd
api_prefix: /participants

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation        # RMD divisor: Uniform Lifetime vs Single Life Expectancy
    - rate_threshold_triggers         # $7,000 + $1,000 catch-up cap, RMD age 73, 10-year SECURE window
    - cascading_side_effects          # excess contrib -> 6% penalty -> 1099-R + ledger debit
    - scheduled_deferred_actions      # year-end RMD deadline, 10-year inheritance window
    - derived_field_reconciliation    # Account.ytd_contribution_total stays in sync with ledger

  entity_topology: hybrid
  # Strict parent-child for Participant -> Account -> ContributionEvent, but cross-cutting
  # BeneficiaryClaim references Account across the tree and Form1099R is polymorphic on
  # source event type.

  state_machine_shape: branching
  # ConversionRequest has fork-join (PENDING -> {APPROVED, REJECTED} -> COMPLETED),
  # BeneficiaryClaim cycles (CLAIMED <-> SUSPENDED), Account is posture-driven
  # (OPEN, FROZEN, CLOSED). Multiple non-linear shapes spread across entities.

  relationship_patterns:
    - one_to_many       # Participant -> Account, Account -> ContributionEvent
    - cross_aggregate   # Form1099R references ContributionEvent OR DistributionEvent
    - polymorphic       # Form1099R.source_event_type in {DISTRIBUTION, EXCESS_PENALTY, CONVERSION}

  role_model: segregation_of_duties
  # Custodian approves conversions; Participant initiates them. Compliance officer
  # issues 1099-Rs; cannot also be the participant. Auditor is read-only.

  consistency_model: immediate
  # All ledger entries, posture updates, and 1099-R issuance happen atomically within
  # the triggering API call.

# =============================================================================
# 1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Account holder legal name"
        constraints: "1..120 chars, non-empty after trim"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO-8601 date (YYYY-MM-DD); used to derive age for cap + RMD logic"
        constraints: "Must be a real past date; participant must be at least 18 on creation"
      - name: tax_status
        type: enum
        source: input
        description: "IRS filing status influencing future MAGI-gated logic"
        constraints: "Values: SINGLE | MARRIED_JOINT | MARRIED_SEPARATE | HEAD_OF_HOUSEHOLD"
      - name: is_deceased
        type: boolean
        source: system
        default: false
        description: "Set true via POST /participants/{id}/decease; locks all owned accounts"
      - name: date_of_death
        type: string
        source: system
        description: "ISO-8601 date set by /decease endpoint; null while alive"

  - name: Account
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK to Participant.id; immutable after creation"
      - name: account_type
        type: enum
        source: input
        description: "IRA flavor governing contribution + distribution rules"
        constraints: "Values: TRADITIONAL | ROTH"
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: "Posture; gates contributions, conversions, distributions"
        constraints: "Values: OPEN | FROZEN | CLOSED"
      - name: balance_cents
        type: integer
        source: computed
        default: 0
        description: "Current balance in whole cents; updated atomically by every ledger event"
      - name: ytd_contribution_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of all ContributionEvent.amount_cents in current tax_year where status=POSTED; reset by clock /advance-year"
      - name: tax_year
        type: integer
        source: system
        description: "Current contribution tax year tracked by the system clock; defaults to clock year on create"
      - name: prior_year_end_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Frozen snapshot of balance_cents at last year-end advance; RMD divisor input"
      - name: inherited_from_participant_id
        type: string
        source: input
        description: "If non-null, this account is an Inherited IRA; SECURE Act 10-year rule applies"
        default: null
      - name: inheritance_start_date
        type: string
        source: system
        description: "ISO-8601 date set when inherited_from_participant_id is supplied; defines start of 10-year window"
        default: null

  - name: ContributionEvent
    parent: Account
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK to Account.id"
      - name: amount_cents
        type: integer
        source: input
        description: "Positive integer cents; max single contribution 1,000,000 cents per call"
        constraints: ">= 1"
      - name: contribution_type
        type: enum
        source: input
        description: "Regular vs catch-up vs backdoor"
        constraints: "Values: REGULAR | CATCHUP | BACKDOOR_NONDEDUCTIBLE"
      - name: tax_year
        type: integer
        source: system
        description: "Tax year captured from system clock at posting time"
      - name: status
        type: enum
        source: computed
        default: POSTED
        description: "POSTED until reversed; REVERSED via excess-removal endpoint"
        constraints: "Values: POSTED | REVERSED"
      - name: reversed_at
        type: datetime
        source: system
        description: "Set when status flips to REVERSED"
        default: null

  - name: DistributionEvent
    parent: Account
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK to Account.id"
      - name: gross_amount_cents
        type: integer
        source: input
        description: "Requested withdrawal in cents"
        constraints: ">= 1"
      - name: distribution_reason
        type: enum
        source: input
        description: "IRS distribution code mapped to 1099-R box 7"
        constraints: "Values: NORMAL | EARLY | RMD | DEATH | CONVERSION | EXCESS_REMOVAL"
      - name: federal_withholding_cents
        type: integer
        source: computed
        description: "Computed by withholding rule; see calculations.compute_federal_withholding"
      - name: net_amount_cents
        type: integer
        source: computed
        description: "gross_amount_cents - federal_withholding_cents"
      - name: tax_year
        type: integer
        source: system
        description: "Captured from system clock at distribution time"
      - name: settled_at
        type: datetime
        source: system
        description: "Atomic with creation; immutable thereafter"

  - name: ConversionRequest
    parent: Participant
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK to Participant.id"
      - name: source_account_id
        type: string
        source: input
        description: "FK to Account.id; must be TRADITIONAL and owned by participant"
      - name: destination_account_id
        type: string
        source: input
        description: "FK to Account.id; must be ROTH and owned by participant"
      - name: amount_cents
        type: integer
        source: input
        description: "Amount to convert in cents; <= source.balance_cents at approval time"
        constraints: ">= 1"
      - name: backdoor_flag
        type: boolean
        source: input
        default: false
        description: "True iff source account contains only BACKDOOR_NONDEDUCTIBLE contributions for the current tax_year and no other postings; enables Backdoor Roth path"
      - name: status
        type: enum
        source: computed
        default: PENDING
        description: "Workflow state"
        constraints: "Values: PENDING | APPROVED | REJECTED | COMPLETED | CANCELED"
      - name: approver_role_id
        type: string
        source: system
        description: "X-User-ID of the Custodian who approved; null while PENDING"
        default: null
      - name: completed_distribution_id
        type: string
        source: system
        description: "FK to DistributionEvent.id created on completion; null until COMPLETED"
        default: null

  - name: BeneficiaryClaim
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK to Account.id of the inherited (decedent's) account"
      - name: beneficiary_participant_id
        type: string
        source: input
        description: "FK to the inheriting Participant.id"
      - name: claim_date
        type: string
        source: system
        description: "ISO-8601 date of claim creation; used as deadline_date = claim_date + 10 years"
      - name: deadline_date
        type: string
        source: computed
        description: "claim_date + 10 calendar years; SECURE Act drain deadline"
      - name: status
        type: enum
        source: computed
        default: CLAIMED
        description: "Lifecycle of the claim"
        constraints: "Values: CLAIMED | SUSPENDED | DRAINED | FORFEITED"
      - name: drained_amount_cents
        type: integer
        source: computed
        default: 0
        description: "Cumulative distributions taken against this claim"

  - name: Form1099R
    parent: null
    common_fields: false
    fields:
      - name: tax_year
        type: integer
        source: system
        description: "Reporting tax year"
      - name: recipient_participant_id
        type: string
        source: system
        description: "Participant receiving the form"
      - name: source_event_type
        type: enum
        source: system
        description: "Which event spawned this form (polymorphic)"
        constraints: "Values: DISTRIBUTION | EXCESS_PENALTY | CONVERSION"
      - name: source_event_id
        type: string
        source: system
        description: "id of DistributionEvent or ExcessPenalty backing this form"
      - name: box1_gross_distribution_cents
        type: integer
        source: computed
        description: "Box 1 gross distribution"
      - name: box2a_taxable_amount_cents
        type: integer
        source: computed
        description: "Box 2a taxable portion; for Backdoor conversions only earnings are taxable"
      - name: box4_federal_withholding_cents
        type: integer
        source: computed
        description: "Box 4 federal income tax withheld"
      - name: box7_distribution_code
        type: enum
        source: computed
        description: "IRS distribution code"
        constraints: "Values: 1 | 2 | 7 | 4 | G | 8"
      - name: status
        type: enum
        source: computed
        default: ISSUED
        description: "Lifecycle"
        constraints: "Values: ISSUED | CORRECTED | VOIDED"

  - name: ExcessPenalty
    parent: Account
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK to Account.id assessed the penalty"
      - name: tax_year
        type: integer
        source: system
        description: "Year of the excess contribution"
      - name: excess_amount_cents
        type: integer
        source: computed
        description: "ytd_contribution_cents - applicable_cap_cents at assessment time"
      - name: penalty_amount_cents
        type: integer
        source: computed
        description: "6% of excess_amount_cents, rounded half-up to whole cents"
      - name: assessed_at
        type: datetime
        source: system
        description: "Timestamp the penalty was assessed (year-end sweep or manual trigger)"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "POST /accounts/{id}/freeze"
        actor: Custodian
        preconditions:
          - "Account.status == OPEN"
        side_effects:
          - "Block new ContributionEvent creation under this account"
          - "Block new DistributionEvent creation under this account except those with distribution_reason=RMD"
        note: "Custodian may freeze for compliance review; only RMDs still permitted"

      - from: FROZEN
        to: OPEN
        trigger: "POST /accounts/{id}/unfreeze"
        actor: Custodian
        preconditions:
          - "Account.status == FROZEN"
          - "Participant.is_deceased == false"
        side_effects:
          - "Restore full contribution + distribution capability"

      - from: OPEN
        to: FROZEN
        trigger: "POST /participants/{id}/decease (cascade onto every owned Account)"
        actor: Custodian
        preconditions:
          - "Participant.is_deceased == false on input, becomes true"
        side_effects:
          - "Cascade depth 1: every Account owned by participant flips OPEN→FROZEN"
          - "Cascade depth 2: every PENDING ConversionRequest on those accounts auto-transitions PENDING→CANCELED"
          - "Cascade depth 3: Form1099R with status=ISSUED for current year ledger entries on those accounts becomes immutable (VOIDED operation blocked)"
        note: "Three-link cascade demonstrating Rule 4"

      - from: OPEN
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: Custodian
        preconditions:
          - "Account.balance_cents == 0"
          - "No PENDING ConversionRequest referencing this account as source or destination"
          - "No BeneficiaryClaim with status=CLAIMED referencing this account"
        side_effects:
          - "Set Account.status=CLOSED"
          - "Future contributions and distributions rejected with ERR_ACCOUNT_CLOSED"

      - from: FROZEN
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: Custodian
        preconditions:
          - "Account.balance_cents == 0"
          - "No PENDING ConversionRequest"
        side_effects:
          - "Set Account.status=CLOSED"

  - entity: ConversionRequest
    initial_state: PENDING
    terminal_states: [REJECTED, COMPLETED, CANCELED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /conversion-requests/{id}/approve"
        actor: Custodian
        preconditions:
          - "ConversionRequest.status == PENDING"
          - "source_account.status == OPEN"
          - "destination_account.status == OPEN"
          - "Participant.is_deceased == false"
          - "If backdoor_flag=true: source_account.balance_cents == sum of POSTED BACKDOOR_NONDEDUCTIBLE ContributionEvent.amount_cents for current tax_year (no earnings, no other contributions)"
        side_effects:
          - "Record approver_role_id = X-User-ID"
          - "Note: serial fork — approval does not yet move funds"
        note: "Branching: PENDING -> {APPROVED, REJECTED}"

      - from: PENDING
        to: REJECTED
        trigger: "POST /conversion-requests/{id}/reject"
        actor: Custodian
        preconditions:
          - "ConversionRequest.status == PENDING"
        side_effects:
          - "Set status=REJECTED; no ledger movement"

      - from: PENDING
        to: CANCELED
        trigger: "POST /conversion-requests/{id}/cancel OR cascade from participant decease"
        actor: Participant | system
        preconditions:
          - "ConversionRequest.status == PENDING"
          - "If actor=Participant: X-User-ID == ConversionRequest.participant_id"
        side_effects:
          - "Set status=CANCELED"

      - from: APPROVED
        to: COMPLETED
        trigger: "POST /conversion-requests/{id}/complete"
        actor: Custodian
        preconditions:
          - "ConversionRequest.status == APPROVED"
          - "source_account.balance_cents >= amount_cents"
        side_effects:
          - "Cascade depth 1: create DistributionEvent(account_id=source, reason=CONVERSION, gross_amount_cents=amount_cents, federal_withholding_cents=0)"
          - "Cascade depth 2: that DistributionEvent debits source.balance_cents and credits destination.balance_cents via ledger_apply_conversion"
          - "Cascade depth 3: a Form1099R is auto-issued with source_event_type=CONVERSION, box7_distribution_code=G; if backdoor_flag=true then box2a_taxable_amount_cents=0, else box2a_taxable_amount_cents=box1_gross_distribution_cents"
          - "Set completed_distribution_id"
        note: "Second three-link cascade demonstrating Rule 4 from a different trigger"

  - entity: BeneficiaryClaim
    initial_state: CLAIMED
    terminal_states: [DRAINED, FORFEITED]
    transitions:
      - from: CLAIMED
        to: SUSPENDED
        trigger: "POST /beneficiary-claims/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "BeneficiaryClaim.status == CLAIMED"
        side_effects:
          - "Block new DistributionEvent against the inherited Account while SUSPENDED"

      - from: SUSPENDED
        to: CLAIMED
        trigger: "POST /beneficiary-claims/{id}/resume"
        actor: ComplianceOfficer
        preconditions:
          - "BeneficiaryClaim.status == SUSPENDED"
          - "current_date <= deadline_date"
        side_effects:
          - "Unblock distributions"
        note: "Cycle: CLAIMED <-> SUSPENDED demonstrates Rule 3 non-linear shape"

      - from: CLAIMED
        to: DRAINED
        trigger: "POST /accounts/{id}/distributions when residual balance hits zero"
        actor: Participant | Custodian
        preconditions:
          - "Account.balance_cents becomes 0 after the distribution"
          - "BeneficiaryClaim.status == CLAIMED"
        side_effects:
          - "Set status=DRAINED, drained_amount_cents += distribution amount"

      - from: CLAIMED
        to: FORFEITED
        trigger: "POST /_clock/advance triggers sweep when current_date > deadline_date and balance > 0"
        actor: system
        preconditions:
          - "current_date > BeneficiaryClaim.deadline_date"
          - "Account.balance_cents > 0"
          - "BeneficiaryClaim.status == CLAIMED"
        side_effects:
          - "Set status=FORFEITED"
          - "Account.status flips to FROZEN"
          - "Issue ExcessPenalty with excess_amount_cents=Account.balance_cents and penalty_amount_cents=25% of balance (SECURE Act 25% excise) — rounded half-up"
          - "Issue Form1099R with source_event_type=EXCESS_PENALTY, box7=8"
        note: "Time-gated, reachable via POST /_clock/advance"

      - from: SUSPENDED
        to: FORFEITED
        trigger: "POST /_clock/advance triggers sweep when current_date > deadline_date and balance > 0"
        actor: system
        preconditions:
          - "current_date > BeneficiaryClaim.deadline_date"
          - "Account.balance_cents > 0"
        side_effects:
          - "Same as CLAIMED->FORFEITED"

  - entity: Form1099R
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: CORRECTED
        trigger: "POST /forms-1099r/{id}/correct"
        actor: ComplianceOfficer
        preconditions:
          - "Form1099R.status == ISSUED"
          - "Recipient participant is alive (Participant.is_deceased == false)"
        side_effects:
          - "Recompute box2a_taxable_amount_cents from the latest snapshot of the source event"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /forms-1099r/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "Form1099R.status == ISSUED"
          - "Underlying source_event_id is REVERSED (only possible for EXCESS_PENALTY whose ContributionEvent was reversed)"
        side_effects:
          - "Set status=VOIDED"
      - from: CORRECTED
        to: VOIDED
        trigger: "POST /forms-1099r/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "Form1099R.status == CORRECTED"
          - "Source event REVERSED"
        side_effects:
          - "Set status=VOIDED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two contributions arrive simultaneously and the second would push ytd_contribution_cents over the cap"
    guarantee: "Both are sequentialized on Account.id; whichever order persists, the first POSTED is accepted and the second is rejected"
    error_id: ERR_CONTRIBUTION_CAP_EXCEEDED
    http_status: 422
    serialization: "First-writer-wins on Account.ytd_contribution_cents update"

  - scenario: "Approve and reject on the same ConversionRequest fire simultaneously"
    guarantee: "Exactly one transitions PENDING -> {APPROVED|REJECTED}; loser sees ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on ConversionRequest.status"

  - scenario: "Participant decease and a fresh ContributionEvent on one of their accounts race"
    guarantee: "If decease wins first, the contribution is rejected with ERR_ACCOUNT_FROZEN"
    error_id: ERR_ACCOUNT_FROZEN
    http_status: 409
    serialization: "First-writer-wins on Account.status"

  - scenario: "Two RMD distributions for the same RMD year race"
    guarantee: "At most one RMD-coded DistributionEvent per Account per tax_year; second returns ERR_RMD_ALREADY_TAKEN"
    error_id: ERR_RMD_ALREADY_TAKEN
    http_status: 409
    serialization: "First-writer-wins on (Account.id, tax_year, distribution_reason=RMD)"

  - scenario: "PATCH on Participant with stale version while another PATCH has already advanced version"
    guarantee: "OCC stale write detected; loser sees ERR_VERSION_CONFLICT"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "Version monotonic increment per row"

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: compute_applicable_contribution_cap
    trigger: "Pre-validation of POST /accounts/{id}/contributions"
    algorithm: threshold
    formula: |
      participant_age_on_dec31 = clock_year - year(Participant.date_of_birth)
      base_cap_cents = REGULAR_CAP_CENTS  # 700000 (= $7,000.00)
      catchup_cap_cents = CATCHUP_CAP_CENTS if participant_age_on_dec31 >= CATCHUP_AGE else 0
      applicable_cap_cents = base_cap_cents + catchup_cap_cents
      # Returns cap in cents; consumer compares against Account.ytd_contribution_cents + request.amount_cents
    input_set: "Single Participant; constants from §1.3.constants. Inclusion: ytd_contribution_cents is sum of ContributionEvent where status=POSTED AND tax_year=clock_year, EXCLUDING REVERSED."
    constants:
      REGULAR_CAP_CENTS: 700000      # $7,000
      CATCHUP_CAP_CENTS: 100000      # $1,000
      CATCHUP_AGE: 50
    precision: "Whole cents (integer arithmetic). No rounding required at cap-check step."

  - name: compute_rmd_amount
    trigger: "GET /accounts/{id}/rmd?tax_year=YYYY or pre-validation of POST /accounts/{id}/distributions where distribution_reason=RMD"
    algorithm: tiered_pricing
    formula: |
      # SECURE Act 2.0: RMD age = 73
      participant_age_on_dec31 = tax_year - year(Participant.date_of_birth)
      if Account.account_type == ROTH and Account.inherited_from_participant_id IS NULL:
          required_amount_cents = 0   # Roth IRAs for original owner have no lifetime RMD
          return required_amount_cents
      if participant_age_on_dec31 < RMD_AGE and Account.inherited_from_participant_id IS NULL:
          required_amount_cents = 0
          return required_amount_cents
      divisor = lookup_divisor(participant_age_on_dec31, Account.inherited_from_participant_id IS NOT NULL)
      raw_amount = Account.prior_year_end_balance_cents / divisor
      # Round HALF_UP to whole cents
      required_amount_cents = round_half_up(raw_amount)
      return required_amount_cents
    input_set: "Account.prior_year_end_balance_cents snapshot at last /_clock/advance-year; Participant.date_of_birth; tax_year argument."
    constants:
      RMD_AGE: 73
      # Uniform Lifetime Table (abridged for ages 73..78 to bound benchmark scope; richer table extended via piecewise lookup)
      UNIFORM_LIFETIME_TABLE:
        73: 26.5
        74: 25.5
        75: 24.6
        76: 23.7
        77: 22.9
        78: 22.0
      # Single Life Expectancy Table (for inherited IRAs under SECURE 10-year rule, used only when beneficiary takes annual)
      SINGLE_LIFE_TABLE:
        40: 45.7
        45: 41.0
        50: 36.2
        55: 31.6
        60: 27.1
        65: 22.9
        70: 18.8
    precision: "Whole cents (integer). Divide cents by divisor (float), round HALF_UP to integer cents."
    variants:
      - name: uniform_lifetime
        when: "Account.inherited_from_participant_id IS NULL (original owner, age >= 73)"
        difference: "Use UNIFORM_LIFETIME_TABLE; divisor based on participant's age at end of distribution tax_year"
      - name: single_life_expectancy
        when: "Account.inherited_from_participant_id IS NOT NULL (Inherited IRA under SECURE Act); annual RMD requested before deadline_date"
        difference: "Use SINGLE_LIFE_TABLE; divisor based on beneficiary's age at year-of-claim and decremented by 1 each subsequent year"

  - name: compute_federal_withholding
    trigger: "Inside POST /accounts/{id}/distributions before persisting DistributionEvent"
    algorithm: threshold
    formula: |
      # Layered: distribution_reason determines mandatory rate; participant age changes threshold (early w/h adder)
      participant_age = clock_year - year(Participant.date_of_birth)
      if distribution_reason == CONVERSION:
          withholding_rate = 0.00       # G-coded conversions: no mandatory withholding
      elif distribution_reason == RMD:
          withholding_rate = MANDATORY_RMD_RATE   # 0.10
      elif distribution_reason == EARLY and participant_age < EARLY_PENALTY_AGE:
          withholding_rate = MANDATORY_NORMAL_RATE + EARLY_ADDER   # 0.10 + 0.10 = 0.20
      elif distribution_reason == NORMAL:
          withholding_rate = MANDATORY_NORMAL_RATE   # 0.10
      elif distribution_reason == DEATH:
          withholding_rate = 0.00
      elif distribution_reason == EXCESS_REMOVAL:
          withholding_rate = 0.00
      federal_withholding_cents = round_half_up(gross_amount_cents * withholding_rate)
      net_amount_cents = gross_amount_cents - federal_withholding_cents
    input_set: "gross_amount_cents (input), distribution_reason (input), Participant.date_of_birth, clock_year"
    constants:
      EARLY_PENALTY_AGE: 59          # threshold uses < (strictly less than 59 = early)
      MANDATORY_NORMAL_RATE: 0.10
      MANDATORY_RMD_RATE: 0.10
      EARLY_ADDER: 0.10
    precision: "round_half_up to whole cents on the withholding step. Net is then exact subtraction."
    variants:
      - name: standard
        when: "Standard distribution reasons"
        difference: "Single rounding step on withholding"
      - name: early_with_adder
        when: "distribution_reason=EARLY AND participant_age < 59"
        difference: "Combined rate (0.20) applied once then rounded; NOT 0.10 rounded + 0.10 rounded (which would double-round)"

  - name: assess_excess_contribution_penalty
    trigger: "POST /accounts/{id}/excess-sweep OR auto-fires inside POST /_clock/advance-year before tax_year increments"
    algorithm: aggregation
    formula: |
      # Step 1 (always): sum POSTED contributions in current tax_year
      ytd = sum(ContributionEvent.amount_cents
               WHERE account_id = A.id
                 AND status = POSTED
                 AND tax_year = clock_year)
      # Step 2: cap from compute_applicable_contribution_cap (age uses Dec 31 of clock_year)
      cap = compute_applicable_contribution_cap(participant, clock_year)
      excess = max(0, ytd - cap)
      if excess == 0:
          return null   # no penalty assessed
      # Step 3: penalty = 6% of excess, rounded HALF_UP
      penalty = round_half_up(excess * EXCESS_PENALTY_RATE)
      return ExcessPenalty{
          excess_amount_cents = excess,
          penalty_amount_cents = penalty
      }
      # Cascade: also debit Account.balance_cents by penalty,
      # then issue Form1099R(source_event_type=EXCESS_PENALTY, box7=8)
    input_set: "All POSTED ContributionEvent rows for the account in the current tax_year; REVERSED rows EXCLUDED. Sort key for tie-breaking on simultaneous postings: (created_at ASC, id ASC) but irrelevant once aggregated."
    constants:
      EXCESS_PENALTY_RATE: 0.06
    precision: "round_half_up to whole cents on the penalty step. Excess is exact integer subtraction."

  - name: tax_year_aggregate_for_form1099r
    trigger: "GET /participants/{id}/forms-1099r?tax_year=YYYY (read-time projection)"
    algorithm: projection
    formula: |
      # Per-event projection (no cross-event aggregation), but field assembly is order-sensitive
      for each Form1099R F WHERE recipient_participant_id = P.id AND tax_year = YYYY:
          if F.status == VOIDED: skip
          if F.status == CORRECTED and F.source_event_type == EXCESS_PENALTY:
              # Replay underlying ExcessPenalty
              ep = ExcessPenalty(F.source_event_id)
              F.box1_gross_distribution_cents = ep.excess_amount_cents
              F.box2a_taxable_amount_cents = ep.excess_amount_cents   # all taxable
              F.box4_federal_withholding_cents = 0
              F.box7_distribution_code = 8
          elif F.source_event_type == DISTRIBUTION:
              d = DistributionEvent(F.source_event_id)
              F.box1_gross_distribution_cents = d.gross_amount_cents
              if d.distribution_reason == EARLY:
                  F.box7_distribution_code = 1
              elif d.distribution_reason == NORMAL:
                  F.box7_distribution_code = 7
              elif d.distribution_reason == DEATH:
                  F.box7_distribution_code = 4
              elif d.distribution_reason == RMD:
                  F.box7_distribution_code = 7
              F.box2a_taxable_amount_cents = d.gross_amount_cents if source_account.account_type == TRADITIONAL else 0
              F.box4_federal_withholding_cents = d.federal_withholding_cents
          elif F.source_event_type == CONVERSION:
              cr = ConversionRequest holding this completed_distribution_id
              F.box1_gross_distribution_cents = cr.amount_cents
              F.box7_distribution_code = "G"
              F.box2a_taxable_amount_cents = 0 if cr.backdoor_flag else cr.amount_cents
              F.box4_federal_withholding_cents = 0
      return sorted Form1099Rs by source_event_id ASC
    input_set: "All Form1099R for the participant in the requested tax_year. VOIDED forms excluded from totals (omitted from list)."
    constants: {}
    precision: "Pass-through; no new rounding."

  - name: project_inherited_drawdown
    trigger: "GET /beneficiary-claims/{id}/projection?as_of_date=YYYY-MM-DD"
    algorithm: forward_looking
    formula: |
      # Provisional view used by the beneficiary to plan ahead.
      # Sum future-scheduled RMDs from as_of_date through deadline_date assuming
      # constant balance (does NOT recompute prior_year_end_balance year over year).
      remaining_years = floor((deadline_date - as_of_date).days / 365)
      projected_rmd_cents = compute_rmd_amount(Account, current tax_year, variant=single_life_expectancy)
      projected_total_drawdown_cents = projected_rmd_cents * remaining_years
      return {
          remaining_years,
          projected_rmd_cents,
          projected_total_drawdown_cents
      }
    input_set: "BeneficiaryClaim.deadline_date, as_of_date input, current RMD divisor lookup."
    constants: {}
    precision: "round_half_up at the RMD step only; multiplication is exact integer × integer."
    variants:
      - name: provisional_forward_looking
        when: "Returned by /projection endpoint"
        difference: "Uses today's prior_year_end_balance frozen; ignores future contributions, future ledger movement, and future divisor changes"
      - name: final_chronological
        when: "Realized when /_clock/advance-year fires; RMDs are taken year-by-year against the actual prior_year_end_balance for that year"
        difference: "Recomputes balance + divisor every year; final cumulative drawdown can differ materially from provisional"

  - name: snapshot_prior_year_end_balance
    trigger: "POST /_clock/advance-year"
    algorithm: aggregation
    formula: |
      for each Account A:
          A.prior_year_end_balance_cents = A.balance_cents  # snapshot before clock increments
      then increment clock_year by 1
      then for each Account A: A.ytd_contribution_cents = 0 (reset)
    input_set: "All Account rows (any status). Ordering immaterial; assignment is per-row."
    constants: {}
    precision: "Integer assignment."

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of {Participant, Custodian, ComplianceOfficer, Auditor}"
    error_id: ERR_AUTH_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Role is in endpoints[].roles for the requested route"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Path parameters resolve left-to-right: participant exists, then account exists, then conversion exists, then form exists"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "Cross-tenant: Account.participant_id == path participant_id for /participants/{pid}/accounts/{aid} routes"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "/participants/{participant_id}/accounts/{account_id}/*"

  - priority: 6
    category: state
    check: "Account.status == OPEN for any non-RMD contribution or distribution"
    error_id: ERR_ACCOUNT_FROZEN
    http_status: 409
    applies_to: "POST /accounts/{id}/contributions, POST /accounts/{id}/distributions where distribution_reason != RMD"

  - priority: 7
    category: state
    check: "Account.status != CLOSED for any mutation"
    error_id: ERR_ACCOUNT_CLOSED
    http_status: 409
    applies_to: "all mutating /accounts/{id}/* endpoints"

  - priority: 8
    category: state
    check: "ConversionRequest.status matches the required precondition state for the transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "/conversion-requests/{id}/{approve|reject|complete|cancel}"

  - priority: 9
    category: state
    check: "Participant.is_deceased == false for any non-RMD, non-DEATH operation"
    error_id: ERR_PARTICIPANT_DECEASED
    http_status: 409
    applies_to: "POST /accounts/{id}/contributions, POST /conversion-requests, POST /conversion-requests/{id}/approve"

  - priority: 10
    category: business_safety
    check: "BeneficiaryClaim.status != FORFEITED for any distribution against an inherited account"
    error_id: ERR_INHERITED_CLAIM_FORFEITED
    http_status: 409
    applies_to: "POST /accounts/{id}/distributions where Account.inherited_from_participant_id IS NOT NULL"

  - priority: 11
    category: business_constraint
    check: "BeneficiaryClaim.deadline_date >= current_date for new distributions on inherited accounts"
    error_id: ERR_SECURE_DEADLINE_EXPIRED
    http_status: 422
    applies_to: "POST /accounts/{id}/distributions where Account.inherited_from_participant_id IS NOT NULL"

  - priority: 12
    category: business_constraint
    check: "ConversionRequest.source_account.account_type == TRADITIONAL AND destination_account.account_type == ROTH"
    error_id: ERR_INVALID_CONVERSION_PAIR
    http_status: 422
    applies_to: "POST /conversion-requests"

  - priority: 13
    category: business_constraint
    check: "ConversionRequest.source_account.participant_id == ConversionRequest.destination_account.participant_id == path participant_id"
    error_id: ERR_CROSS_PARTICIPANT_CONVERSION
    http_status: 422
    applies_to: "POST /conversion-requests"

  - priority: 14
    category: business_safety
    check: "Custodian cannot approve their own participant-initiated request (segregation of duties: approver_role_id != participant_id-mapped Custodian)"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "POST /conversion-requests/{id}/approve"

  - priority: 15
    category: business_fiscal
    check: "Contribution amount_cents + Account.ytd_contribution_cents <= compute_applicable_contribution_cap(participant, clock_year)"
    error_id: ERR_CONTRIBUTION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /accounts/{id}/contributions"

  - priority: 16
    category: business_fiscal
    check: "If contribution_type == CATCHUP, participant must be age >= 50 on Dec 31 of clock_year"
    error_id: ERR_CATCHUP_AGE_INELIGIBLE
    http_status: 422
    applies_to: "POST /accounts/{id}/contributions"

  - priority: 17
    category: business_fiscal
    check: "DistributionEvent.gross_amount_cents <= Account.balance_cents"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 422
    applies_to: "POST /accounts/{id}/distributions"

  - priority: 18
    category: business_fiscal
    check: "When distribution_reason == RMD: gross_amount_cents == compute_rmd_amount(account, tax_year)"
    error_id: ERR_RMD_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /accounts/{id}/distributions where distribution_reason == RMD"

  - priority: 19
    category: business_referential
    check: "If backdoor_flag == true: source account contains ONLY POSTED BACKDOOR_NONDEDUCTIBLE contributions for the current tax_year and source.balance_cents == sum of those amounts (no earnings, no rolled-over balance)"
    error_id: ERR_BACKDOOR_PRECONDITION_VIOLATED
    http_status: 422
    applies_to: "POST /conversion-requests/{id}/approve where backdoor_flag == true"

  - priority: 20
    category: business_temporal
    check: "RMD for current tax_year must be taken on or before deadline (Dec 31 of clock_year), enforced by /_clock/advance-year sweep that creates an ExcessPenalty if missed"
    error_id: ERR_RMD_PERIOD_CLOSED
    http_status: 409
    applies_to: "POST /accounts/{id}/distributions where distribution_reason == RMD AND tax_year < clock_year"

  - priority: 21
    category: business_temporal
    check: "OCC: request.version == resource.version on PATCH endpoints that accept version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /participants/{participant_id}"

  - priority: 22
    category: business_constraint
    check: "Schema: required body fields present, types correct, enums in declared set, integers non-negative where stated"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Clock control (test driving endpoints) ----------
  - method: POST
    path: "/_clock/advance"
    description: "Advance system clock by a specified number of days; fires inherited-claim FORFEITED sweep if deadlines pass"
    roles: [Auditor, Custodian, ComplianceOfficer]
    code: 200
    input: [days]
    output: ClockState
    side_effects:
      - "If any BeneficiaryClaim has deadline_date < new current_date and Account.balance_cents > 0, run forfeit sweep"

  - method: POST
    path: "/_clock/advance-year"
    description: "Advance system clock to Jan 1 of next year; snapshots prior_year_end_balance, runs excess-contribution sweep, runs missed-RMD sweep"
    roles: [Auditor, Custodian, ComplianceOfficer]
    code: 200
    input: []
    output: ClockState
    side_effects:
      - "snapshot_prior_year_end_balance on every Account"
      - "Reset Account.ytd_contribution_cents to 0"
      - "Run assess_excess_contribution_penalty per Account; cascade: debit balance, issue Form1099R(EXCESS_PENALTY)"
      - "If any Account with participant age >= 73 (Traditional, or any Inherited) has no RMD-coded DistributionEvent for the closing tax_year, assess ExcessPenalty at 25% rate (SECURE 2.0 reduced rate)"

  - method: GET
    path: "/_clock"
    description: "Read current system clock state"
    roles: [Auditor, Custodian, ComplianceOfficer, Participant]
    code: 200
    input: []
    output: ClockState

  # ---------- Participants ----------
  - method: POST
    path: "/participants"
    description: "Create a participant"
    roles: [Custodian]
    code: 201
    input: [full_name, date_of_birth, tax_status]
    output: Participant
    side_effects: []

  - method: GET
    path: "/participants/{participant_id}"
    description: "Read participant"
    roles: [Custodian, ComplianceOfficer, Auditor, Participant]
    code: 200
    input: []
    output: Participant

  - method: PATCH
    path: "/participants/{participant_id}"
    description: "Update participant fields (full_name, tax_status only); OCC via version"
    roles: [Custodian]
    code: 200
    input: ["full_name?", "tax_status?", "version"]
    output: Participant

  - method: POST
    path: "/participants/{participant_id}/decease"
    description: "Mark participant deceased; cascades through accounts and conversions"
    roles: [Custodian]
    code: 200
    input: [date_of_death]
    output: Participant
    side_effects:
      - "Set Participant.is_deceased=true"
      - "Cascade: every owned Account flips OPEN->FROZEN; every PENDING ConversionRequest -> CANCELED; Form1099R for current year becomes VOID-blocked"

  # ---------- Accounts ----------
  - method: POST
    path: "/participants/{participant_id}/accounts"
    description: "Open a Traditional or Roth IRA account for a participant; optionally as Inherited IRA"
    roles: [Custodian]
    code: 201
    input: [account_type, "inherited_from_participant_id?"]
    output: Account
    side_effects:
      - "If inherited_from_participant_id is set, create BeneficiaryClaim with claim_date=current_date and deadline_date=claim_date+10y"

  - method: GET
    path: "/participants/{participant_id}/accounts/{account_id}"
    description: "Read account"
    roles: [Custodian, ComplianceOfficer, Auditor, Participant]
    code: 200
    input: []
    output: Account

  - method: POST
    path: "/accounts/{account_id}/freeze"
    description: "Freeze account (Custodian compliance hold)"
    roles: [Custodian, ComplianceOfficer]
    code: 200
    input: []
    output: Account

  - method: POST
    path: "/accounts/{account_id}/unfreeze"
    description: "Unfreeze previously frozen account"
    roles: [Custodian, ComplianceOfficer]
    code: 200
    input: []
    output: Account

  - method: POST
    path: "/accounts/{account_id}/close"
    description: "Close an account with zero balance"
    roles: [Custodian]
    code: 200
    input: []
    output: Account

  # ---------- Contributions ----------
  - method: POST
    path: "/accounts/{account_id}/contributions"
    description: "Post a contribution; runs cap + catch-up validations"
    roles: [Participant, Custodian]
    code: 201
    input: [amount_cents, contribution_type]
    output: ContributionEvent
    side_effects:
      - "Increment Account.ytd_contribution_cents"
      - "Increment Account.balance_cents"

  - method: POST
    path: "/contributions/{contribution_id}/reverse"
    description: "Reverse an excess contribution (within current tax_year); creates an EXCESS_REMOVAL DistributionEvent equal to amount_cents"
    roles: [Custodian]
    code: 200
    input: []
    output: ContributionEvent
    side_effects:
      - "Set ContributionEvent.status=REVERSED, reversed_at=now"
      - "Decrement Account.ytd_contribution_cents and Account.balance_cents by amount_cents"
      - "Create DistributionEvent(distribution_reason=EXCESS_REMOVAL, gross_amount_cents=amount_cents, federal_withholding_cents=0)"

  # ---------- Distributions ----------
  - method: POST
    path: "/accounts/{account_id}/distributions"
    description: "Take a distribution (NORMAL, EARLY, RMD, DEATH, CONVERSION, EXCESS_REMOVAL)"
    roles: [Participant, Custodian]
    code: 201
    input: [gross_amount_cents, distribution_reason]
    output: DistributionEvent
    side_effects:
      - "compute_federal_withholding"
      - "Debit Account.balance_cents by gross_amount_cents"
      - "Issue Form1099R(source_event_type=DISTRIBUTION)"
      - "If inherited account and balance hits 0: BeneficiaryClaim CLAIMED->DRAINED"

  - method: GET
    path: "/accounts/{account_id}/rmd"
    description: "Read required RMD amount for a tax_year (uses Uniform Lifetime or Single Life table per account type)"
    roles: [Participant, Custodian, ComplianceOfficer, Auditor]
    code: 200
    input: [tax_year]
    output: RMDQuote

  - method: POST
    path: "/accounts/{account_id}/excess-sweep"
    description: "Manually trigger an excess-contribution assessment for the current tax_year (Custodian)"
    roles: [Custodian]
    code: 200
    input: []
    output: ExcessPenalty
    side_effects:
      - "assess_excess_contribution_penalty"
      - "If penalty > 0: debit Account.balance_cents and issue Form1099R(EXCESS_PENALTY)"

  # ---------- Conversion Requests ----------
  - method: POST
    path: "/conversion-requests"
    description: "Participant requests a Traditional->Roth conversion (optionally a Backdoor Roth)"
    roles: [Participant]
    code: 201
    input: [source_account_id, destination_account_id, amount_cents, "backdoor_flag?"]
    output: ConversionRequest

  - method: GET
    path: "/conversion-requests/{conversion_id}"
    description: "Read conversion request"
    roles: [Participant, Custodian, ComplianceOfficer, Auditor]
    code: 200
    input: []
    output: ConversionRequest

  - method: POST
    path: "/conversion-requests/{conversion_id}/approve"
    description: "Custodian approves a pending conversion (segregation of duties enforced)"
    roles: [Custodian]
    code: 200
    input: []
    output: ConversionRequest

  - method: POST
    path: "/conversion-requests/{conversion_id}/reject"
    description: "Custodian rejects a pending conversion"
    roles: [Custodian]
    code: 200
    input: []
    output: ConversionRequest

  - method: POST
    path: "/conversion-requests/{conversion_id}/cancel"
    description: "Participant cancels their own pending conversion"
    roles: [Participant]
    code: 200
    input: []
    output: ConversionRequest

  - method: POST
    path: "/conversion-requests/{conversion_id}/complete"
    description: "Custodian moves funds; creates DistributionEvent + Form1099R(CONVERSION)"
    roles: [Custodian]
    code: 200
    input: []
    output: ConversionRequest

  # ---------- Beneficiary Claims ----------
  - method: GET
    path: "/beneficiary-claims/{claim_id}"
    description: "Read a beneficiary claim"
    roles: [Participant, Custodian, ComplianceOfficer, Auditor]
    code: 200
    input: []
    output: BeneficiaryClaim

  - method: POST
    path: "/beneficiary-claims/{claim_id}/suspend"
    description: "Compliance suspends drawdown"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BeneficiaryClaim

  - method: POST
    path: "/beneficiary-claims/{claim_id}/resume"
    description: "Compliance resumes a suspended claim"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: BeneficiaryClaim

  - method: GET
    path: "/beneficiary-claims/{claim_id}/projection"
    description: "Forward-looking projected drawdown given remaining years to deadline_date"
    roles: [Participant, Custodian, ComplianceOfficer, Auditor]
    code: 200
    input: [as_of_date]
    output: DrawdownProjection

  # ---------- Forms 1099-R ----------
  - method: GET
    path: "/participants/{participant_id}/forms-1099r"
    description: "List a participant's 1099-R forms for a tax_year"
    roles: [Participant, Custodian, ComplianceOfficer, Auditor]
    code: 200
    input: ["limit?", "offset?", "tax_year"]
    output: Form1099R[]

  - method: POST
    path: "/forms-1099r/{form_id}/correct"
    description: "Issue a corrected form replaying the underlying event"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Form1099R

  - method: POST
    path: "/forms-1099r/{form_id}/void"
    description: "Void a form whose source event has been reversed"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Form1099R

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-ID or X-User-Role header is missing or empty"

  - id: ERR_AUTH_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of {Participant, Custodian, ComplianceOfficer, Auditor}"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks authorization for the requested endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource does not exist or violates left-to-right scope (e.g., account.participant_id mismatch)"

  - id: ERR_VALIDATION
    http: 400
    condition: "Request body fails schema validation (missing field, wrong type, unknown enum)"

  - id: ERR_ACCOUNT_FROZEN
    http: 409
    condition: "Operation requires Account.status == OPEN but it is FROZEN"

  - id: ERR_ACCOUNT_CLOSED
    http: 409
    condition: "Operation attempted on a CLOSED account"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in the required state for this transition (covers ConversionRequest, Form1099R)"

  - id: ERR_PARTICIPANT_DECEASED
    http: 409
    condition: "Operation cannot proceed because Participant.is_deceased == true"

  - id: ERR_INHERITED_CLAIM_FORFEITED
    http: 409
    condition: "Distribution attempted against an Account whose BeneficiaryClaim has been FORFEITED"

  - id: ERR_SECURE_DEADLINE_EXPIRED
    http: 422
    condition: "Distribution attempted past BeneficiaryClaim.deadline_date"

  - id: ERR_INVALID_CONVERSION_PAIR
    http: 422
    condition: "Conversion source is not TRADITIONAL or destination is not ROTH"

  - id: ERR_CROSS_PARTICIPANT_CONVERSION
    http: 422
    condition: "Conversion source and destination accounts belong to different participants"

  - id: ERR_SEGREGATION_VIOLATION
    http: 403
    condition: "Custodian X-User-ID equals the requesting participant id (segregation of duties)"

  - id: ERR_CONTRIBUTION_CAP_EXCEEDED
    http: 422
    condition: "Posting this contribution would push Account.ytd_contribution_cents above the applicable cap"

  - id: ERR_CATCHUP_AGE_INELIGIBLE
    http: 422
    condition: "contribution_type=CATCHUP but participant's age on Dec 31 of clock_year is < 50"

  - id: ERR_INSUFFICIENT_BALANCE
    http: 422
    condition: "DistributionEvent.gross_amount_cents exceeds Account.balance_cents"

  - id: ERR_RMD_AMOUNT_MISMATCH
    http: 422
    condition: "RMD-coded distribution amount does not equal compute_rmd_amount(account, tax_year)"

  - id: ERR_BACKDOOR_PRECONDITION_VIOLATED
    http: 422
    condition: "backdoor_flag=true approval attempted but source account contains non-BACKDOOR contributions or earnings"

  - id: ERR_RMD_PERIOD_CLOSED
    http: 409
    condition: "Attempting to file an RMD for a prior tax_year that has been swept"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Optimistic concurrency: supplied version does not match current resource version"

  - id: ERR_RMD_ALREADY_TAKEN
    http: 409
    condition: "RMD-coded DistributionEvent already exists for this Account.id, tax_year"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Participant
    description: "The IRA account holder; can contribute, request conversions, take distributions on their own accounts"
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /conversion-requests"
      - "POST /conversion-requests/{id}/cancel"
    shared_operations:
      - "POST /accounts/{id}/contributions (shared with Custodian)"
      - "POST /accounts/{id}/distributions (shared with Custodian)"
      - "GET /participants/{id} (self only)"
      - "GET /participants/{id}/accounts/{account_id} (self only)"
      - "GET /accounts/{id}/rmd (self only)"
      - "GET /beneficiary-claims/{id} (self only)"
      - "GET /beneficiary-claims/{id}/projection (self only)"
      - "GET /participants/{id}/forms-1099r (self only)"
      - "GET /_clock"

  - name: Custodian
    description: "Financial institution officer who creates accounts, freezes/unfreezes, approves conversions, runs sweeps. Segregation: a Custodian cannot also act as Participant on the same operation."
    identity: "opaque"
    exclusive_operations:
      - "POST /participants"
      - "PATCH /participants/{id}"
      - "POST /participants/{id}/decease"
      - "POST /participants/{id}/accounts"
      - "POST /accounts/{id}/close"
      - "POST /accounts/{id}/excess-sweep"
      - "POST /contributions/{id}/reverse"
      - "POST /conversion-requests/{id}/approve"
      - "POST /conversion-requests/{id}/reject"
      - "POST /conversion-requests/{id}/complete"
    shared_operations:
      - "POST /accounts/{id}/freeze (shared with ComplianceOfficer)"
      - "POST /accounts/{id}/unfreeze (shared with ComplianceOfficer)"
      - "POST /accounts/{id}/contributions (shared with Participant)"
      - "POST /accounts/{id}/distributions (shared with Participant)"
      - "All GETs and the clock endpoints"

  - name: ComplianceOfficer
    description: "Compliance/regulatory officer. Can freeze accounts, suspend beneficiary claims, issue corrections to 1099-R."
    identity: "opaque"
    exclusive_operations:
      - "POST /beneficiary-claims/{id}/suspend"
      - "POST /beneficiary-claims/{id}/resume"
      - "POST /forms-1099r/{id}/correct"
      - "POST /forms-1099r/{id}/void"
    shared_operations:
      - "POST /accounts/{id}/freeze (shared with Custodian)"
      - "POST /accounts/{id}/unfreeze (shared with Custodian)"
      - "All GETs"
      - "POST /_clock/advance, POST /_clock/advance-year (shared with Custodian and Auditor)"

  - name: Auditor
    description: "Read-only; can also drive the test clock to inspect projections without altering ledger ownership"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "All GETs"
      - "POST /_clock/advance"
      - "POST /_clock/advance-year"
