        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / delinquent_invoice_and_waived_adt_publisher_returns_conformance_error_not_fee_error
          rationale: "That instance violates priorities 21 and 32 in one request, asserts ERR_SUBSCRIPTION_CONFORMANCE_MISSING, then clears it to expose ERR_PARTICIPATION_FEE_DELINQUENT."
      - name: consent_policy_interval_overlap_is_refused_while_adjacency_is_accepted
