        distinguishing_aspect: "Half-open aggregate semantics mean w.ends_at == new.starts_at is not an intersection, so a 10-slot POOL_A window starting exactly at 2026-09-01T00:00:00Z - the instant the 5-slot window ends - is created with 201 instead of being refused as 15 concurrent slots."
