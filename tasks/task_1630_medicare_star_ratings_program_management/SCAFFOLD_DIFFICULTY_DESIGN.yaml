# =============================================================================
# §1.8 Scaffold Difficulty Design — Medicare Star Ratings Program Management
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. 2 instances per rule.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: published_vs_draft_star_banding
        grounds:
          - calculations.measure_star_banding
          - entities.MeasurePerformance.fields.published_star
          - entities.MeasurePerformance.fields.draft_star
        distinguishing_aspect: |
          Same MeasurePerformance raw_value (0.85) bands to published_star == 3
          against the PUBLISHED set (band_4_floor 0.90) but draft_star == 4
          against the DRAFT set (band_4_floor 0.85) — two valid cut point bases
          produce different stars for identical data on the MeasurePerformance
          domain.
        test_recipe:
          setup:
            - "Cycle in CUTPOINT_REVIEW; measure M (PROCESS w1, HIGHER_BETTER, HEDIS) ACTIVE"
            - "DRAFT set D with M floors 0.60/0.72/0.85/0.94; set P with M floors 0.62/0.75/0.90/0.95 published"
            - "Performance for M: numerator 17, denominator 20 (raw 0.85), LOCKED"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "official-2028", rows: [ { measure_id: "${m_id}", band_2_floor: 0.62, band_3_floor: 0.75, band_4_floor: 0.90, band_5_floor: 0.95 } ] }
              as: StarsAnalyst
              captures: { set_p_id: $.data.id }
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "draft-2028", rows: [ { measure_id: "${m_id}", band_2_floor: 0.60, band_3_floor: 0.72, band_4_floor: 0.85, band_5_floor: 0.94 } ] }
              as: StarsAnalyst
              captures: { set_d_id: $.data.id }
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 17, denominator: 20 }
              as: QualityOps
              captures: { perf_id: $.data.id }
            - call: "POST /api/measure-performances/${perf_id}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${perf_id}/transition"
              payload: { to_state: LOCKED }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: CUTPOINT_REVIEW }
              as: StarsAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /api/cutpoint-sets/${set_p_id}/publish"
              payload: { expected_rating_cycle_version: "${cyc_v}" }
              as: StarsAdmin
          trigger:
            - call: "GET /api/measure-performances/${perf_id}"
              as: StarsAnalyst
          assert:
            - "MeasurePerformance.${perf_id}.raw_value == 0.85"
            - "MeasurePerformance.${perf_id}.published_star == 3"
            - "MeasurePerformance.${perf_id}.draft_star == 4"
            - "MeasurePerformance.${perf_id}.published_star != MeasurePerformance.${perf_id}.draft_star"

      - name: incentive_payout_variant_divergence
        grounds:
          - calculations.incentive_payout_amount
          - entities.ProviderGroup.fields.program_type
          - entities.IncentivePayout.fields.amount
        distinguishing_aspect: |
          Identical underlying cycle data yields amount == 8000.00 for an
          ATTAINMENT group (max_pool 10000.00 x published_star 4 / target_star 5)
          but amount == 750.00 for a GAP_CLOSURE group (unit 250.00 x 3 closed
          gaps) — two valid payout algorithms diverge on the
          ProviderGroup/IncentivePayout domain, a different entity domain than
          published_vs_draft_star_banding.
        test_recipe:
          setup:
            - "Cycle in CUTPOINT_REVIEW with PUBLISHED set; measure MA (HEDIS OUTCOME, HIGHER_BETTER) published_star == 4; measure MG (PHARMACY_PDE) with exactly 3 CLOSED gaps"
            - "Group GA: ATTAINMENT, linked MA, target_star 5, max_pool 10000.00; group GG: GAP_CLOSURE, linked MG, unit 250.00, max_pool 10000.00"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { ma_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "SPD", title: "Statin Adherence", domain: DRUG_SAFETY, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: PHARMACY_PDE, improvement_eligible: false }
              as: StarsAnalyst
              captures: { mg_id: $.data.id }
            - call: "POST /api/measures/${ma_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/measures/${mg_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "official-2028", rows: [ { measure_id: "${ma_id}", band_2_floor: 0.60, band_3_floor: 0.72, band_4_floor: 0.85, band_5_floor: 0.94 }, { measure_id: "${mg_id}", band_2_floor: 0.70, band_3_floor: 0.78, band_4_floor: 0.85, band_5_floor: 0.92 } ] }
              as: StarsAnalyst
              captures: { set_p_id: $.data.id }
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${ma_id}", numerator: 17, denominator: 20 }
              as: QualityOps
              captures: { pa_id: $.data.id }
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${mg_id}", numerator: 0, denominator: 0 }
              as: QualityOps
              captures: { pg_id: $.data.id }
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem1: $.data.id }
            - call: "POST /api/members"
              payload: { member_ref: "MBR-2", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem2: $.data.id }
            - call: "POST /api/members"
              payload: { member_ref: "MBR-3", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem3: $.data.id }
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem1}", measure_id: "${mg_id}", gap_type: PHARMACY_ADHERENCE }
              as: QualityOps
              captures: { g1: $.data.id }
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem2}", measure_id: "${mg_id}", gap_type: PHARMACY_ADHERENCE }
              as: QualityOps
              captures: { g2: $.data.id }
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem3}", measure_id: "${mg_id}", gap_type: PHARMACY_ADHERENCE }
              as: QualityOps
              captures: { g3: $.data.id }
            - call: "POST /api/care-gaps/${g1}/transition"
              payload: { to_state: CLOSED }
              as: QualityOps
            - call: "POST /api/care-gaps/${g2}/transition"
              payload: { to_state: CLOSED }
              as: QualityOps
            - call: "POST /api/care-gaps/${g3}/transition"
              payload: { to_state: CLOSED }
              as: QualityOps
            - call: "POST /api/measure-performances/${pa_id}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${pa_id}/transition"
              payload: { to_state: LOCKED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${pg_id}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${pg_id}/transition"
              payload: { to_state: LOCKED }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: CUTPOINT_REVIEW }
              as: StarsAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /api/cutpoint-sets/${set_p_id}/publish"
              payload: { expected_rating_cycle_version: "${cyc_v}" }
              as: StarsAdmin
            - call: "POST /api/provider-groups"
              payload: { name: "Group A", program_type: ATTAINMENT, linked_measure_id: "${ma_id}", target_star: 5, unit_reward_per_gap: 100.0, max_pool_amount: 10000.0 }
              as: IncentiveManager
              captures: { grp_a: $.data.id }
            - call: "POST /api/provider-groups"
              payload: { name: "Group G", program_type: GAP_CLOSURE, linked_measure_id: "${mg_id}", target_star: 5, unit_reward_per_gap: 250.0, max_pool_amount: 10000.0 }
              as: IncentiveManager
              captures: { grp_g: $.data.id }
          trigger:
            - call: "POST /api/incentive-payouts"
              payload: { provider_group_id: "${grp_a}" }
              as: IncentiveManager
              as_user_id: "im-1"
              captures: { pay_a: $.data.id, amt_a: $.data.amount }
            - call: "POST /api/incentive-payouts"
              payload: { provider_group_id: "${grp_g}" }
              as: IncentiveManager
              as_user_id: "im-1"
              captures: { pay_g: $.data.id, amt_g: $.data.amount }
          assert:
            - "IncentivePayout.${pay_a}.amount == 8000.00"
            - "IncentivePayout.${pay_g}.amount == 750.00"
            - "IncentivePayout.${pay_a}.amount != IncentivePayout.${pay_g}.amount"
            - "IncentivePayout.${pay_a}.basis_snapshot.published_star == 4"
            - "IncentivePayout.${pay_g}.basis_snapshot.closed_gap_count == 3"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: round_then_band_ordering_pinned
        grounds:
          - calculations.measure_star_banding
          - entities.MeasurePerformance.fields.raw_value
        distinguishing_aspect: |
          Mode (b) nested rounding: raw 2123/2500 = 0.8492 is rounded to 0.85
          BEFORE banding, so it clears band_4_floor 0.85 (draft_star == 4);
          banding the unrounded ratio (0.8492 < 0.85) would yield 3 — the
          scaffold pins round-then-band and this instance falsifies the
          opposite order.
        test_recipe:
          setup:
            - "Cycle in DATA_COLLECTION; measure M (OUTCOME, HIGHER_BETTER, PHARMACY_PDE) ACTIVE"
            - "DRAFT set with M floors 0.70/0.78/0.85/0.92"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "SPD", title: "Statin Adherence", domain: DRUG_SAFETY, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: PHARMACY_PDE, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "draft-2028", rows: [ { measure_id: "${m_id}", band_2_floor: 0.70, band_3_floor: 0.78, band_4_floor: 0.85, band_5_floor: 0.92 } ] }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
          trigger:
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 2123, denominator: 2500 }
              as: QualityOps
              captures: { perf_id: $.data.id }
          assert:
            - "MeasurePerformance.${perf_id}.raw_value == 0.85"
            - "MeasurePerformance.${perf_id}.draft_star == 4"
            - "MeasurePerformance.${perf_id}.published_star == null"

      - name: rebate_tiered_projection_multi_input
        grounds:
          - calculations.rebate_projection
          - calculations.weighted_overall_stars
          - calculations.improvement_measure
        distinguishing_aspect: |
          Mode (a) >= 3 inputs with non-linear interaction: projected stars
          (weighted mean 65/16 = 4.0625 half-star-rounded to 4.0) select rebate
          tier 0.040 from a 5-band tiered lookup, then multiply by
          member_months 24 and benchmark 950.00 — a different combinatorial
          mode than round_then_band_ordering_pinned.
        test_recipe:
          setup:
            - "Cycle with 4 ACTIVE measures (weights 1/3/4/3); draft set bands them 4/4/3/4; published set bands them 3/3/3/3"
            - "M1 improvement_eligible prior 3; M2 improvement_eligible prior 4; M3/M4 not eligible"
            - "All 4 performances VALIDATED then LOCKED; set P published; 2 ENROLLED members x 12 months"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: true, prior_cycle_star: 3 }
              as: StarsAnalyst
              captures: { m1: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "SPD", title: "Statin Adherence", domain: DRUG_SAFETY, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: PHARMACY_PDE, improvement_eligible: true, prior_cycle_star: 4 }
              as: StarsAnalyst
              captures: { m2: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "CNC", title: "Getting Needed Care", domain: MEMBER_EXPERIENCE, measure_type: PATIENT_EXPERIENCE, direction: HIGHER_BETTER, data_source: CAHPS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m3: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "CMP", title: "Complaints Rate", domain: MEMBER_COMPLAINTS, measure_type: OUTCOME, direction: LOWER_BETTER, data_source: COMPLAINTS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m4: $.data.id }
            - call: "POST /api/measures/${m1}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/measures/${m2}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/measures/${m3}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/measures/${m4}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "official-2028", rows: [ { measure_id: "${m1}", band_2_floor: 0.62, band_3_floor: 0.75, band_4_floor: 0.90, band_5_floor: 0.95 }, { measure_id: "${m2}", band_2_floor: 0.72, band_3_floor: 0.80, band_4_floor: 0.88, band_5_floor: 0.93 }, { measure_id: "${m3}", band_2_floor: 0.55, band_3_floor: 0.65, band_4_floor: 0.78, band_5_floor: 0.90 }, { measure_id: "${m4}", band_5_floor: 0.15, band_4_floor: 0.40, band_3_floor: 0.80, band_2_floor: 1.20 } ] }
              as: StarsAnalyst
              captures: { set_p: $.data.id }
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "draft-2028", rows: [ { measure_id: "${m1}", band_2_floor: 0.60, band_3_floor: 0.72, band_4_floor: 0.85, band_5_floor: 0.94 }, { measure_id: "${m2}", band_2_floor: 0.70, band_3_floor: 0.78, band_4_floor: 0.85, band_5_floor: 0.92 }, { measure_id: "${m3}", band_2_floor: 0.55, band_3_floor: 0.65, band_4_floor: 0.75, band_5_floor: 0.88 }, { measure_id: "${m4}", band_5_floor: 0.20, band_4_floor: 0.50, band_3_floor: 0.90, band_2_floor: 1.50 } ] }
              as: StarsAnalyst
              captures: { set_d: $.data.id }
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m1}", numerator: 17, denominator: 20 }
              as: QualityOps
              captures: { p1: $.data.id }
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m2}", numerator: 2123, denominator: 2500 }
              as: QualityOps
              captures: { p2: $.data.id }
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m3}", numerator: 33, denominator: 50 }
              as: QualityOps
              captures: { p3: $.data.id }
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m4}", numerator: 9, denominator: 20 }
              as: QualityOps
              captures: { p4: $.data.id }
            - call: "POST /api/measure-performances/${p1}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${p2}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${p3}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${p4}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${p1}/transition"
              payload: { to_state: LOCKED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${p2}/transition"
              payload: { to_state: LOCKED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${p3}/transition"
              payload: { to_state: LOCKED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${p4}/transition"
              payload: { to_state: LOCKED }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: CUTPOINT_REVIEW }
              as: StarsAdmin
              captures: { cyc_v: $.data.version }
            - call: "POST /api/cutpoint-sets/${set_p}/publish"
              payload: { expected_rating_cycle_version: "${cyc_v}" }
              as: StarsAdmin
            - call: "POST /api/members"
              payload: { member_ref: "MBR-A", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
            - call: "POST /api/members"
              payload: { member_ref: "MBR-B", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
          trigger:
            - call: "POST /api/rating-forecasts"
              payload: { rating_cycle_id: "${cyc_id}", basis: DRAFT_CUTPOINTS }
              as: StarsAnalyst
              captures: { fc_id: $.data.id }
          assert:
            - "RatingForecast.${fc_id}.measures_included == 4"
            - "RatingForecast.${fc_id}.measures_eligible == 2"
            - "RatingForecast.${fc_id}.measures_improved == 1"
            - "RatingForecast.${fc_id}.measures_declined == 0"
            - "RatingForecast.${fc_id}.improvement_score == 0.5"
            - "RatingForecast.${fc_id}.improvement_star == 5"
            - "RatingForecast.${fc_id}.projected_overall_stars == 4.0"
            - "RatingForecast.${fc_id}.member_months_used == 24"
            - "RatingForecast.${fc_id}.rebate_tier_rate == 0.04"
            - "RatingForecast.${fc_id}.projected_rebate_amount == 912.00"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: caregap_reopen_cycle_oscillation
        grounds:
          - state_machines.CareGap.OPEN_to_CLOSED
          - state_machines.CareGap.CLOSED_to_REOPENED
          - state_machines.CareGap.REOPENED_to_CLOSED
        distinguishing_aspect: |
          CareGap walks the cycle OPEN -> CLOSED -> REOPENED -> CLOSED and the
          linked performance numerator oscillates 10 -> 11 -> 10 -> 11 while
          the denominator stays 21 — a true cyclic machine on CareGap.
        test_recipe:
          setup:
            - "Cycle in DATA_COLLECTION; HEDIS measure ACTIVE; performance 10/20 REPORTED; 1 ENROLLED member; 1 OPEN gap (denominator raised to 21)"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 10, denominator: 20 }
              as: QualityOps
              captures: { perf_id: $.data.id }
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem1: $.data.id }
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem1}", measure_id: "${m_id}", gap_type: SCREENING }
              as: QualityOps
              captures: { gap_id: $.data.id }
          trigger:
            - call: "POST /api/care-gaps/${gap_id}/transition"
              payload: { to_state: CLOSED }
              as: QualityOps
            - call: "POST /api/care-gaps/${gap_id}/transition"
              payload: { to_state: REOPENED }
              as: QualityOps
              captures: { st_re: $.data.status }
            - call: "GET /api/measure-performances/${perf_id}"
              as: QualityOps
              captures: { num_mid: $.data.numerator }
            - call: "POST /api/care-gaps/${gap_id}/transition"
              payload: { to_state: CLOSED }
              as: QualityOps
          assert:
            - "CareGap.${gap_id}.status == CLOSED"
            - "intermediate REOPENED state observed == REOPENED"
            - "numerator after reopen (num_mid) == 10"
            - "MeasurePerformance.${perf_id}.numerator == 11"
            - "MeasurePerformance.${perf_id}.denominator == 21"

      - name: complaint_resolution_branching_divergence
        grounds:
          - state_machines.ComplaintCase.FILED_to_RESOLVED_VALID
          - state_machines.ComplaintCase.FILED_to_RESOLVED_INVALID
        distinguishing_aspect: |
          ComplaintCase forks FILED -> {RESOLVED_VALID, RESOLVED_INVALID} with
          divergent side effects: only the VALID branch increments the
          complaints measure numerator (9 -> 10); the INVALID branch leaves it
          at 10 — a branching machine on ComplaintCase, a different entity than
          caregap_reopen_cycle_oscillation.
        test_recipe:
          setup:
            - "Cycle in DATA_COLLECTION; COMPLAINTS measure (LOWER_BETTER) ACTIVE with performance 9/20 REPORTED; member ENROLLED; two FILED complaints"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "CMP", title: "Complaints Rate", domain: MEMBER_COMPLAINTS, measure_type: OUTCOME, direction: LOWER_BETTER, data_source: COMPLAINTS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 9, denominator: 20 }
              as: QualityOps
              captures: { perf_id: $.data.id }
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem1: $.data.id }
            - call: "POST /api/complaint-cases"
              payload: { rating_cycle_id: "${cyc_id}", member_id: "${mem1}", category: BILLING, filed_at: "2026-08-05T00:00:00Z" }
              as: ComplaintsAuditor
              captures: { c1: $.data.id }
            - call: "POST /api/complaint-cases"
              payload: { rating_cycle_id: "${cyc_id}", member_id: "${mem1}", category: ENROLLMENT, filed_at: "2026-08-06T00:00:00Z" }
              as: ComplaintsAuditor
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /api/complaint-cases/${c1}/transition"
              payload: { to_state: RESOLVED_VALID }
              as: ComplaintsAuditor
            - call: "POST /api/complaint-cases/${c2}/transition"
              payload: { to_state: RESOLVED_INVALID }
              as: ComplaintsAuditor
            - call: "GET /api/measure-performances/${perf_id}"
              as: ComplaintsAuditor
          assert:
            - "ComplaintCase.${c1}.status == RESOLVED_VALID"
            - "ComplaintCase.${c2}.status == RESOLVED_INVALID"
            - "MeasurePerformance.${perf_id}.numerator == 10"
            - "MeasurePerformance.${perf_id}.raw_value == 0.5"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: disenrollment_cascade_depth3
        grounds:
          - state_machines.Member.ENROLLED_to_DISENROLLED
          - state_machines.CareGap.OPEN_to_EXCLUDED
          - calculations.measure_star_banding
          - calculations.weighted_overall_stars
        distinguishing_aspect: |
          Depth-3 chain from member disenrollment: Member -> DISENROLLED
          mutates the OPEN CareGap to EXCLUDED (link 1); that exclusion
          decrements MeasurePerformance.denominator 21 -> 20 and recomputes
          raw 0.60 and draft_star 2 -> 3 (link 2); that star recompute
          refreshes RatingCycle.live_weighted_stars 2.0 -> 3.0 (link 3). Each
          link is caused by the previous link.
        test_recipe:
          setup:
            - "Cycle in DATA_COLLECTION; OUTCOME (w3) HIGHER_BETTER measure ACTIVE; DRAFT set floors 0.50/0.60/0.70/0.80"
            - "Performance 12/20 VALIDATED (draft_star 3, live 3.0); member with 1 OPEN gap on the measure (denominator 21, raw 0.57, draft_star 2, live 2.0)"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "draft-2028", rows: [ { measure_id: "${m_id}", band_2_floor: 0.50, band_3_floor: 0.60, band_4_floor: 0.70, band_5_floor: 0.80 } ] }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 12, denominator: 20 }
              as: QualityOps
              captures: { perf_id: $.data.id }
            - call: "POST /api/measure-performances/${perf_id}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem1: $.data.id }
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem1}", measure_id: "${m_id}", gap_type: SCREENING }
              as: QualityOps
              captures: { gap_id: $.data.id }
            - call: "GET /api/rating-cycles/${cyc_id}"
              as: QualityOps
              captures: { live_pre: $.data.live_weighted_stars }
          trigger:
            - call: "POST /api/members/${mem1}/transition"
              payload: { to_state: DISENROLLED }
              as: QualityOps
            - call: "GET /api/care-gaps/${gap_id}"
              as: QualityOps
              captures: { gap_st: $.data.status }
            - call: "GET /api/measure-performances/${perf_id}"
              as: QualityOps
              captures: { denom_post: $.data.denominator, star_post: $.data.draft_star }
            - call: "GET /api/rating-cycles/${cyc_id}"
              as: QualityOps
              captures: { live_post: $.data.live_weighted_stars }
          assert:
            - "live before disenrollment (live_pre) == 2.0"
            - "CareGap.${gap_id}.status == EXCLUDED"
            - "MeasurePerformance.${perf_id}.denominator == 20"
            - "MeasurePerformance.${perf_id}.raw_value == 0.6"
            - "MeasurePerformance.${perf_id}.draft_star == 3"
            - "RatingCycle.${cyc_id}.live_weighted_stars == 3.0"

      - name: cutpoint_publish_cascade_depth2
        grounds:
          - state_machines.CutPointSet.DRAFT_to_PUBLISHED
          - state_machines.CutPointSet.PUBLISHED_to_SUPERSEDED
          - concurrency_rules[cutpoint-publish-stale-cycle]
        distinguishing_aspect: |
          Depth-2 chain from publishing a second set: publish P2 supersedes P1
          and recomputes every performance's published_star 3 -> 4 (link 1);
          each star recompute refreshes RatingCycle.live_weighted_stars 3.0 ->
          4.0 (link 2). Different triggering transition than
          disenrollment_cascade_depth3.
        test_recipe:
          setup:
            - "Cycle in CUTPOINT_REVIEW; measure (PROCESS w1, HIGHER_BETTER) ACTIVE with LOCKED performance 17/20"
            - "Set P1 (f4 0.90) PUBLISHED (published_star 3, live 3.0); set P2 (f4 0.85) in DRAFT"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 17, denominator: 20 }
              as: QualityOps
              captures: { perf_id: $.data.id }
            - call: "POST /api/measure-performances/${perf_id}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${perf_id}/transition"
              payload: { to_state: LOCKED }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: CUTPOINT_REVIEW }
              as: StarsAdmin
              captures: { cyc_v1: $.data.version }
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "official-a", rows: [ { measure_id: "${m_id}", band_2_floor: 0.62, band_3_floor: 0.75, band_4_floor: 0.90, band_5_floor: 0.95 } ] }
              as: StarsAnalyst
              captures: { set_p1: $.data.id }
            - call: "POST /api/cutpoint-sets/${set_p1}/publish"
              payload: { expected_rating_cycle_version: "${cyc_v1}" }
              as: StarsAdmin
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "official-b", rows: [ { measure_id: "${m_id}", band_2_floor: 0.60, band_3_floor: 0.72, band_4_floor: 0.85, band_5_floor: 0.94 } ] }
              as: StarsAnalyst
              captures: { set_p2: $.data.id }
            - call: "GET /api/rating-cycles/${cyc_id}"
              as: StarsAdmin
              captures: { cyc_v2: $.data.version }
          trigger:
            - call: "POST /api/cutpoint-sets/${set_p2}/publish"
              payload: { expected_rating_cycle_version: "${cyc_v2}" }
              as: StarsAdmin
            - call: "GET /api/cutpoint-sets/${set_p1}"
              as: StarsAdmin
              captures: { p1_st: $.data.status }
            - call: "GET /api/measure-performances/${perf_id}"
              as: StarsAdmin
              captures: { pub_star: $.data.published_star }
            - call: "GET /api/rating-cycles/${cyc_id}"
              as: StarsAdmin
              captures: { live_post: $.data.live_weighted_stars, pub_set: $.data.published_cutpoint_set_id }
          assert:
            - "CutPointSet.${set_p1}.status == SUPERSEDED"
            - "CutPointSet.${set_p2}.status == PUBLISHED"
            - "MeasurePerformance.${perf_id}.published_star == 4"
            - "RatingCycle.${cyc_id}.published_cutpoint_set_id == ${set_p2}"
            - "RatingCycle.${cyc_id}.live_weighted_stars == 4.0"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_payout_propose
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_GROUP_NOT_ACTIVE]
          - errors[ERR_INCENTIVE_POOL_EXCEEDED]
        distinguishing_aspect: |
          Pair {state, business_fiscal}: proposing a payout against a CLOSED
          group whose computed amount (100.00 = min(100.00 pool, 250.00 x 1
          closed gap)) would also exceed remaining_amount (0.00, fully paid
          out before closure) returns ERR_GROUP_NOT_ACTIVE (priority 7), not
          ERR_INCENTIVE_POOL_EXCEEDED (priority 12).
        test_recipe:
          setup:
            - "Cycle in DATA_COLLECTION; PHARMACY_PDE measure ACTIVE with performance 0/0; 1 member with 1 CLOSED gap"
            - "GAP_CLOSURE group: unit 250.00, max_pool 100.00; a first payout (100.00) approved and PAID, so remaining_amount == 0.00; group then CLOSED (no open payouts)"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "SPD", title: "Statin Adherence", domain: DRUG_SAFETY, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: PHARMACY_PDE, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 0, denominator: 0 }
              as: QualityOps
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem1: $.data.id }
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem1}", measure_id: "${m_id}", gap_type: PHARMACY_ADHERENCE }
              as: QualityOps
              captures: { gap_id: $.data.id }
            - call: "POST /api/care-gaps/${gap_id}/transition"
              payload: { to_state: CLOSED }
              as: QualityOps
            - call: "POST /api/provider-groups"
              payload: { name: "Group X", program_type: GAP_CLOSURE, linked_measure_id: "${m_id}", target_star: 5, unit_reward_per_gap: 250.0, max_pool_amount: 100.0 }
              as: IncentiveManager
              captures: { grp_id: $.data.id }
            - call: "POST /api/incentive-payouts"
              payload: { provider_group_id: "${grp_id}" }
              as: IncentiveManager
              as_user_id: "im-1"
              captures: { pay1: $.data.id }
            - call: "POST /api/incentive-payouts/${pay1}/transition"
              payload: { to_state: APPROVED }
              as: IncentiveManager
              as_user_id: "im-2"
            - call: "POST /api/incentive-payouts/${pay1}/transition"
              payload: { to_state: PAID }
              as: IncentiveManager
              as_user_id: "im-2"
            - call: "POST /api/provider-groups/${grp_id}/transition"
              payload: { to_state: CLOSED }
              as: IncentiveManager
          trigger:
            - call: "POST /api/incentive-payouts"
              payload: { provider_group_id: "${grp_id}" }
              as: IncentiveManager
              as_user_id: "im-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_GROUP_NOT_ACTIVE"
            - "error_id != ERR_INCENTIVE_POOL_EXCEEDED"
            - "HTTP status == 409"
            - "ProviderGroup.${grp_id}.remaining_amount == 0.00 (fiscal rule would also have failed)"

      - name: constraint_beats_temporal_on_wave_create
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_INVALID_WINDOW]
          - errors[ERR_SURVEY_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Pair {business_constraint, business_temporal}: a new CAHPS wave whose
          window_start (2026-09-20) exceeds its window_end (2026-09-10) AND
          whose raw bounds intersect an existing wave's window returns
          ERR_INVALID_WINDOW (priority 9), not ERR_SURVEY_WINDOW_OVERLAP
          (priority 10) — a different error-category pair than
          state_beats_fiscal_on_payout_propose.
        test_recipe:
          setup:
            - "Cycle exists; vendor with capacity 5; existing CAHPS wave W1 [2026-09-01, 2026-10-01) PLANNED"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/survey-vendors"
              payload: { name: "Vendor V", max_concurrent_waves: 5 }
              as: SurveyCoordinator
              captures: { vend_id: $.data.id }
            - call: "POST /api/survey-waves"
              payload: { rating_cycle_id: "${cyc_id}", survey_type: CAHPS, vendor_id: "${vend_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", sample_size: 100 }
              as: SurveyCoordinator
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /api/survey-waves"
              payload: { rating_cycle_id: "${cyc_id}", survey_type: CAHPS, vendor_id: "${vend_id}", window_start: "2026-09-20T00:00:00Z", window_end: "2026-09-10T00:00:00Z", sample_size: 100 }
              as: SurveyCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_WINDOW"
            - "error_id != ERR_SURVEY_WINDOW_OVERLAP"
            - "HTTP status == 400"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: lower_better_cutpoint_equality_boundary
        grounds:
          - calculations.measure_star_banding
          - entities.Measure.fields.direction
        distinguishing_aspect: |
          LOWER_BETTER metric boundary: raw_value exactly equal to band_4_floor
          (0.50) counts via <= and earns 4 stars, not 3 — the >= / <= (not > /
          <) boundary on the measure-banding metric, exercised through
          POST /api/measure-performances.
        test_recipe:
          setup:
            - "Cycle in DATA_COLLECTION; COMPLAINTS measure (LOWER_BETTER) ACTIVE; DRAFT set floors b5 0.20 / b4 0.50 / b3 0.90 / b2 1.50"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "CMP", title: "Complaints Rate", domain: MEMBER_COMPLAINTS, measure_type: OUTCOME, direction: LOWER_BETTER, data_source: COMPLAINTS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "draft-2028", rows: [ { measure_id: "${m_id}", band_5_floor: 0.20, band_4_floor: 0.50, band_3_floor: 0.90, band_2_floor: 1.50 } ] }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
          trigger:
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 10, denominator: 20 }
              as: QualityOps
              captures: { perf_id: $.data.id }
          assert:
            - "MeasurePerformance.${perf_id}.raw_value == 0.5"
            - "MeasurePerformance.${perf_id}.draft_star == 4"

      - name: improvement_empty_eligible_zero_edge
        grounds:
          - calculations.improvement_measure
          - calculations.weighted_overall_stars
          - entities.RatingForecast.fields.improvement_star
        distinguishing_aspect: |
          Zero-count edge on the eligible-measure metric: with zero
          improvement-eligible measures, improvement_star is null and the
          weight-5 term is ABSENT from the weighted average (denominator stays
          4, giving exactly 2.5 stars) — a different metric (set cardinality)
          and endpoint (POST /api/rating-forecasts) than
          lower_better_cutpoint_equality_boundary.
        test_recipe:
          setup:
            - "Cycle in DATA_COLLECTION; measures MA (PROCESS w1, imp ineligible) draft_star 4 and MB (OUTCOME w3, imp ineligible) draft_star 2, both VALIDATED; DRAFT set present"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { ma: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "COB", title: "Controlling Blood Pressure", domain: CHRONIC_CARE, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { mb: $.data.id }
            - call: "POST /api/measures/${ma}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/measures/${mb}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "draft-2028", rows: [ { measure_id: "${ma}", band_2_floor: 0.50, band_3_floor: 0.60, band_4_floor: 0.70, band_5_floor: 0.80 }, { measure_id: "${mb}", band_2_floor: 0.50, band_3_floor: 0.60, band_4_floor: 0.70, band_5_floor: 0.80 } ] }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${ma}", numerator: 7, denominator: 10 }
              as: QualityOps
              captures: { pa: $.data.id }
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${mb}", numerator: 11, denominator: 20 }
              as: QualityOps
              captures: { pb: $.data.id }
            - call: "POST /api/measure-performances/${pa}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${pb}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
          trigger:
            - call: "POST /api/rating-forecasts"
              payload: { rating_cycle_id: "${cyc_id}", basis: DRAFT_CUTPOINTS }
              as: StarsAnalyst
              captures: { fc_id: $.data.id }
          assert:
            - "RatingForecast.${fc_id}.measures_eligible == 0"
            - "RatingForecast.${fc_id}.improvement_score == null"
            - "RatingForecast.${fc_id}.improvement_star == null"
            - "RatingForecast.${fc_id}.projected_overall_stars == 2.5"
            - "RatingForecast.${fc_id}.rebate_tier_rate == 0.0"
            - "RatingForecast.${fc_id}.projected_rebate_amount == 0.00"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: gap_close_blocked_by_locked_performance
        grounds:
          - state_machines.CareGap.OPEN_to_CLOSED
          - state_machines.MeasurePerformance.VALIDATED_to_LOCKED
          - validations[priority=7]
        distinguishing_aspect: |
          CareGap -> MeasurePerformance pair: closing an OPEN gap while its
          linked performance is LOCKED is rejected with ERR_PERFORMANCE_LOCKED
          and the numerator is unchanged.
        test_recipe:
          setup:
            - "Cycle in DATA_COLLECTION; HEDIS measure ACTIVE; performance 5/10 LOCKED; member with 1 OPEN gap on the measure"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 5, denominator: 10 }
              as: QualityOps
              captures: { perf_id: $.data.id }
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem1: $.data.id }
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem1}", measure_id: "${m_id}", gap_type: SCREENING }
              as: QualityOps
              captures: { gap_id: $.data.id }
            - call: "POST /api/measure-performances/${perf_id}/transition"
              payload: { to_state: VALIDATED }
              as: StarsAnalyst
            - call: "POST /api/measure-performances/${perf_id}/transition"
              payload: { to_state: LOCKED }
              as: StarsAnalyst
          trigger:
            - call: "POST /api/care-gaps/${gap_id}/transition"
              payload: { to_state: CLOSED }
              as: QualityOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PERFORMANCE_LOCKED"
            - "CareGap.${gap_id}.status == OPEN"
            - "MeasurePerformance.${perf_id}.numerator == 5"

      - name: cutpoint_publish_requires_review_state
        grounds:
          - state_machines.CutPointSet.DRAFT_to_PUBLISHED
          - state_machines.RatingCycle
          - validations[priority=7]
        distinguishing_aspect: |
          CutPointSet -> RatingCycle pair (different pair than
          gap_close_blocked_by_locked_performance): publishing a DRAFT set
          while the cycle is in DATA_COLLECTION is rejected with
          ERR_CYCLE_STATE_FORBIDS and the set stays DRAFT.
        test_recipe:
          setup:
            - "Cycle in DATA_COLLECTION; measure ACTIVE; DRAFT cut point set with one row"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: PROCESS, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/cutpoint-sets"
              payload: { rating_cycle_id: "${cyc_id}", label: "official-2028", rows: [ { measure_id: "${m_id}", band_2_floor: 0.62, band_3_floor: 0.75, band_4_floor: 0.90, band_5_floor: 0.95 } ] }
              as: StarsAnalyst
              captures: { set_id: $.data.id }
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "GET /api/rating-cycles/${cyc_id}"
              as: StarsAdmin
              captures: { cyc_v: $.data.version }
          trigger:
            - call: "POST /api/cutpoint-sets/${set_id}/publish"
              payload: { expected_rating_cycle_version: "${cyc_v}" }
              as: StarsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CYCLE_STATE_FORBIDS"
            - "CutPointSet.${set_id}.status == DRAFT"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: survey_lane_halfopen_adjacency_allowed
        grounds:
          - validations[priority=10]
          - entities.SurveyWave.fields.window_start
          - entities.SurveyWave.fields.window_end
        distinguishing_aspect: |
          Half-open interval semantics on the (cycle, survey_type) SurveyWave
          lane: a wave starting exactly at the predecessor's window_end
          (2026-10-01) is ACCEPTED (adjacency permitted), while a wave starting
          one day earlier (2026-09-30) is rejected with
          ERR_SURVEY_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Cycle exists; vendor capacity 5; CAHPS wave W1 [2026-09-01, 2026-10-01) PLANNED"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/survey-vendors"
              payload: { name: "Vendor V", max_concurrent_waves: 5 }
              as: SurveyCoordinator
              captures: { vend_id: $.data.id }
            - call: "POST /api/survey-waves"
              payload: { rating_cycle_id: "${cyc_id}", survey_type: CAHPS, vendor_id: "${vend_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", sample_size: 100 }
              as: SurveyCoordinator
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /api/survey-waves"
              payload: { rating_cycle_id: "${cyc_id}", survey_type: CAHPS, vendor_id: "${vend_id}", window_start: "2026-09-30T00:00:00Z", window_end: "2026-10-30T00:00:00Z", sample_size: 100 }
              as: SurveyCoordinator
              captures: { err_overlap: $.data.error_id }
            - call: "POST /api/survey-waves"
              payload: { rating_cycle_id: "${cyc_id}", survey_type: CAHPS, vendor_id: "${vend_id}", window_start: "2026-10-01T00:00:00Z", window_end: "2026-11-01T00:00:00Z", sample_size: 100 }
              as: SurveyCoordinator
              captures: { w3: $.data.id }
          assert:
            - "overlapping wave rejected with ERR_SURVEY_WINDOW_OVERLAP"
            - "adjacent wave created: SurveyWave.${w3}.status == PLANNED"

      - name: vendor_capacity_aggregate_intersection
        grounds:
          - validations[priority=10]
          - entities.SurveyVendor.fields.max_concurrent_waves
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the SurveyVendor resource
          (different resource than the survey-type lane): with
          max_concurrent_waves 1, an HOS wave overlapping the vendor's existing
          CAHPS wave is rejected with ERR_VENDOR_CAPACITY_EXCEEDED even though
          it passes the per-lane pairwise rule; an adjacent (non-intersecting)
          HOS wave counts 0 against capacity and is accepted.
        test_recipe:
          setup:
            - "Cycle exists; vendor capacity 1; CAHPS wave W1 [2026-09-01, 2026-10-01) PLANNED on that vendor"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/survey-vendors"
              payload: { name: "Vendor Solo", max_concurrent_waves: 1 }
              as: SurveyCoordinator
              captures: { vend_id: $.data.id }
            - call: "POST /api/survey-waves"
              payload: { rating_cycle_id: "${cyc_id}", survey_type: CAHPS, vendor_id: "${vend_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", sample_size: 100 }
              as: SurveyCoordinator
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /api/survey-waves"
              payload: { rating_cycle_id: "${cyc_id}", survey_type: HOS, vendor_id: "${vend_id}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-10-15T00:00:00Z", sample_size: 80 }
              as: SurveyCoordinator
              captures: { err_cap: $.data.error_id }
            - call: "POST /api/survey-waves"
              payload: { rating_cycle_id: "${cyc_id}", survey_type: HOS, vendor_id: "${vend_id}", window_start: "2026-10-01T00:00:00Z", window_end: "2026-11-01T00:00:00Z", sample_size: 80 }
              as: SurveyCoordinator
              captures: { w3: $.data.id }
          assert:
            - "overlapping HOS wave rejected with ERR_VENDOR_CAPACITY_EXCEEDED"
            - "adjacent HOS wave created: SurveyWave.${w3}.status == PLANNED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: pool_conservation_propose_then_deny
        grounds:
          - state_machines.IncentivePayout
          - entities.ProviderGroup.fields.remaining_amount
          - calculations.incentive_payout_amount
        distinguishing_aspect: |
          Conserved quantity: incentive pool dollars. Propose (reserve 500.00)
          followed by deny (release 500.00) restores the group to
          paid_total == 0.00, reserved_total == 0.00, remaining_amount ==
          10000.00; invariant max_pool_amount == paid_total + reserved_total +
          remaining_amount holds before, between, and after.
        test_recipe:
          setup:
            - "Cycle in DATA_COLLECTION; PHARMACY_PDE measure ACTIVE with performance 0/0; 2 members each with a CLOSED gap (closed_gap_count 2)"
            - "GAP_CLOSURE group: unit 250.00, max_pool 10000.00, ACTIVE"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "SPD", title: "Statin Adherence", domain: DRUG_SAFETY, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: PHARMACY_PDE, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 0, denominator: 0 }
              as: QualityOps
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem1: $.data.id }
            - call: "POST /api/members"
              payload: { member_ref: "MBR-2", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem2: $.data.id }
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem1}", measure_id: "${m_id}", gap_type: PHARMACY_ADHERENCE }
              as: QualityOps
              captures: { g1: $.data.id }
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem2}", measure_id: "${m_id}", gap_type: PHARMACY_ADHERENCE }
              as: QualityOps
              captures: { g2: $.data.id }
            - call: "POST /api/care-gaps/${g1}/transition"
              payload: { to_state: CLOSED }
              as: QualityOps
            - call: "POST /api/care-gaps/${g2}/transition"
              payload: { to_state: CLOSED }
              as: QualityOps
            - call: "POST /api/provider-groups"
              payload: { name: "Group G", program_type: GAP_CLOSURE, linked_measure_id: "${m_id}", target_star: 5, unit_reward_per_gap: 250.0, max_pool_amount: 10000.0 }
              as: IncentiveManager
              captures: { grp_id: $.data.id }
          trigger:
            - call: "POST /api/incentive-payouts"
              payload: { provider_group_id: "${grp_id}" }
              as: IncentiveManager
              as_user_id: "im-1"
              captures: { pay_id: $.data.id }
            - call: "GET /api/provider-groups/${grp_id}"
              as: IncentiveManager
              captures: { res_mid: $.data.reserved_total, rem_mid: $.data.remaining_amount }
            - call: "POST /api/incentive-payouts/${pay_id}/transition"
              payload: { to_state: DENIED }
              as: IncentiveManager
              as_user_id: "im-2"
            - call: "GET /api/provider-groups/${grp_id}"
              as: IncentiveManager
              captures: { res_end: $.data.reserved_total, rem_end: $.data.remaining_amount, paid_end: $.data.paid_total }
          assert:
            - "IncentivePayout.${pay_id}.amount == 500.00"
            - "after propose: reserved_total == 500.00 and remaining_amount == 9500.00"
            - "after deny: ProviderGroup.${grp_id}.paid_total == 0.00"
            - "after deny: ProviderGroup.${grp_id}.reserved_total == 0.00"
            - "after deny: ProviderGroup.${grp_id}.remaining_amount == 10000.00"
            - "invariant: max_pool_amount 10000.00 == paid_total + reserved_total + remaining_amount"

      - name: population_conservation_close_then_reopen
        grounds:
          - state_machines.CareGap.OPEN_to_CLOSED
          - state_machines.CareGap.CLOSED_to_REOPENED
          - entities.MeasurePerformance.fields.numerator
        distinguishing_aspect: |
          Conserved quantity: measure population counts (different conserved
          quantity than incentive dollars). Gap close (numerator +1) paired
          with reopen (numerator -1) restores numerator to its pre-close value
          while denominator is untouched by the whole close/reopen pair.
        test_recipe:
          setup:
            - "Cycle in DATA_COLLECTION; HEDIS measure ACTIVE; performance 2123/2500 REPORTED; member with 1 OPEN gap (denominator 2501)"
          setup_api_calls:
            - call: "POST /api/rating-cycles"
              payload: { measurement_year: 2026, rating_year: 2028, benchmark_pmpm: 950.0 }
              as: StarsAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/measures"
              payload: { rating_cycle_id: "${cyc_id}", code: "BCS", title: "Breast Cancer Screening", domain: STAYING_HEALTHY, measure_type: OUTCOME, direction: HIGHER_BETTER, data_source: HEDIS, improvement_eligible: false }
              as: StarsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /api/measures/${m_id}/transition"
              payload: { to_state: ACTIVE }
              as: StarsAnalyst
            - call: "POST /api/rating-cycles/${cyc_id}/transition"
              payload: { to_state: DATA_COLLECTION }
              as: StarsAdmin
            - call: "POST /api/measure-performances"
              payload: { rating_cycle_id: "${cyc_id}", measure_id: "${m_id}", numerator: 2123, denominator: 2500 }
              as: QualityOps
              captures: { perf_id: $.data.id }
            - call: "POST /api/members"
              payload: { member_ref: "MBR-1", plan_contract: "H1234", enrolled_months: 12 }
              as: QualityOps
              captures: { mem1: $.data.id }
            - call: "POST /api/care-gaps"
              payload: { member_id: "${mem1}", measure_id: "${m_id}", gap_type: SCREENING }
              as: QualityOps
              captures: { gap_id: $.data.id }
            - call: "GET /api/measure-performances/${perf_id}"
              as: QualityOps
              captures: { num_pre: $.data.numerator, den_pre: $.data.denominator }
          trigger:
            - call: "POST /api/care-gaps/${gap_id}/transition"
              payload: { to_state: CLOSED }
              as: QualityOps
            - call: "POST /api/care-gaps/${gap_id}/transition"
              payload: { to_state: REOPENED }
              as: QualityOps
            - call: "GET /api/measure-performances/${perf_id}"
              as: QualityOps
              captures: { num_post: $.data.numerator, den_post: $.data.denominator }
          assert:
            - "numerator before close (num_pre) == 2123"
            - "denominator before close (den_pre) == 2501"
            - "numerator after reopen (num_post) == 2123"
            - "denominator after reopen (den_post) == 2501"
            - "invariant: close+reopen leaves numerator and denominator unchanged"
