            - call: "POST /glean/distributions"
              payload: { glean_event_id: "${event_id}", agency_id: "${ag_id}", planned_lbs: 50.0, delivery_date: "2026-08-12T10:00:00Z", expected_event_version: "${ev_ver}" }
              as: ProgramCoordinator
              captures: { err_id: $.data.error_id }
