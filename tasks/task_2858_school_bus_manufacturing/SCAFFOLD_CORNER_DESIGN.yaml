              payload: { campaign_code: "RC-SHORT", affected_bus_model_id: "${model_c_id}", affected_propulsion_type: "DIESEL", defect_category: "BRAKE", build_window_start: "2026-05-01", build_window_end: "2026-06-30", kits_per_unit: 2, total_kits: 3 }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
