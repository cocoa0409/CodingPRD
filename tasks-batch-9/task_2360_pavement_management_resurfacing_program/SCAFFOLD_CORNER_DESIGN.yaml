              as: PavementEngineer
            - call: "POST /pavement/projects/${p1}/award"
              payload: { contractor_id: "${ctr}", award_amount_cents: 11817655 }
              as: BudgetOfficer
              as_user_id: "officer-award-1"
            - call: "POST /pavement/project-segments/${ps1}/notice"
              payload: { action: "SCHEDULE", parking_restriction_start: "2026-09-01T00:00:00Z", parking_restriction_end: "2026-09-30T00:00:00Z", driveway_access_plan: "MAINTAINED" }
              as: PavementEngineer
            - call: "POST /pavement/project-segments/${ps1}/notice"
              payload: { action: "DELIVER" }
              as: PavementEngineer
            - call: "POST /pavement/projects/${p1}/advance"
              payload: { action: "START_CONSTRUCTION" }
              as: PavementEngineer
            - call: "POST /pavement/acceptance-tests"
              payload: { project_segment_id: "${ps1}", core_density_pct: 96.0, iri_in_per_mi: 60.0, thickness_in: 2.0, witness_inspector_user_id: "insp-witness-1" }
              as: Inspector
              as_user_id: "insp-witness-1"
              captures: { t1: "$.data.id" }
            - call: "POST /pavement/acceptance-tests/${t1}/decide"
              payload: { decision: "PASS", decision_note: "test decision recorded" }
              as: Inspector
              as_user_id: "insp-decider-1"
            - call: "GET /pavement/contractors/${ctr}/scorecard"
              payload: {}
              as: PavementEngineer
              captures: { pre_score: "$.data.interim_performance_score", pre_sched: "$.data.interim_schedule_component" }
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: PavementEngineer
          trigger:
            - call: "POST /pavement/projects/${p1}/substantial-completion"
              payload: {}
              as: Contractor
              as_user_id: "${ctr}"
              captures: { d_st: "$.data.delivery_status", sc_at: "$.data.substantial_completion_at", late: "$.data.days_late" }
            - call: "GET /pavement/contractors/${ctr}/scorecard"
              payload: {}
              as: PavementEngineer
              captures: { s_score: "$.data.interim_performance_score", s_q: "$.data.interim_quality_component", s_sched: "$.data.interim_schedule_component", s_rem: "$.data.interim_remediation_component", s_fin: "$.data.final_performance_score", s_late: "$.data.days_late_total", s_acc: "$.data.accepted_project_count", s_pass: "$.data.passed_test_count" }
            - call: "GET /pavement/contractors/${ctr}"
              payload: {}
              as: PavementEngineer
              captures: { c_standing: "$.data.standing", c_int: "$.data.interim_performance_score", c_late: "$.data.days_late_total" }
          assert:
            - "HTTP 200 with delivery_status 'SUBSTANTIALLY_COMPLETE', substantial_completion_at '2026-10-05T00:00:00Z' and days_late == 5."
            - "${pre_score} == 100.0 and ${pre_sched} == 100.00 before the completion — an in-flight project charges 0 late days even though the clock had already passed planned_end_date."
            - "After: interim_quality_component == 100.00 (1 passed / 0 failed), interim_schedule_component == 87.50 (100.0 - 2.5*5), interim_remediation_component == 100.00."
            - "interim_performance_score == 96.3 — round_half_up(0.45*100.00 + 0.30*87.50 + 0.25*100.00, 1) = round_half_up(96.25, 1); components round to 2 dp FIRST."
            - "standing is still 'GOOD_STANDING' (96.3 >= 80.0) and passed_test_count == 1."
            - "days_late_total == 0 and accepted_project_count == 0 and final_performance_score == null — the ACCEPTED-only fields have not moved."
            - "The Contractor row's own interim_performance_score and days_late_total agree with the scorecard projection (96.3 and 0)."

      - name: one_decision_propagates_through_four_entity_types
        claim_type: cascade_depth
        grounds: ["complexity_profile.cross_cutting_complexity_layers.cascading_side_effects"]
        distinguishing_aspect: "A single write must update AcceptanceTest, ProjectSegment, ResurfacingProject and Contractor in one request; §1.8 pins the whole chain with literals at every hop."
        excluded_because:
          difficulty_instance: "test_fail_cascades_line_to_project_quality_to_contractor_standing"
          rationale: "That §1.8 transitive_cascade instance issues one FAIL decision and asserts test_status FAILED, the line REMEDIATION_REQUIRED, the project quality_status REMEDIATION_REQUIRED with open_remediation_count 1, and the contractor's failed_test_count / remediation_event_count / interim_performance_score 53.0 / standing SUSPENDED. Any separate cascading-side-effects corner test would assert a strict subset."

      - name: scenario_publishes_two_horizon_projections_side_by_side
        claim_type: dual_variant
        grounds: ["complexity_profile.cross_cutting_complexity_layers.dual_variant_calculation"]
        distinguishing_aspect: "One run computes both the funded and the do-nothing network condition at the horizon and stores them in two fields; §1.8 pins both numbers and their divergence."
        excluded_because:
          difficulty_instance: "scenario_projection_funded_arm_vs_do_nothing_arm"
          rationale: "That §1.8 dual_variant_calc instance runs one scenario and asserts projected_network_pci and do_nothing_network_pci as distinct literals over the same horizon and pool, including the treatment-gain arm applied only to FUNDED allocations. A corner test for the layer would restate it."


  # consistency_model — immediate visibility, no settlement step
  - section: consistency_model
    instances:
      - name: award_ledger_is_visible_to_the_next_reader_with_no_settlement_step
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model", "state_machines.ResurfacingProject.BID_READY_to_AWARDED", "endpoints.GET /pavement/budget-scenarios/{id}"]
        distinguishing_aspect: "Consistency is immediate and cross-entity: the very next read — by a DIFFERENT role, of a DIFFERENT entity than the one addressed — already shows committed_cents 11,817,655 and uncommitted_cents 8,182,345, with the scenario's version bumped in the same request. There is no /settle, /recompute or /refresh endpoint anywhere in §1.5, so no test may poll or retry for these values."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "The Maple St Z1 project is BID_READY with project_total_estimate_cents 11,817,655."
            - "The ADOPTED scenario is funded at 20,000,000 with committed_cents 0 and uncommitted_cents 20,000,000; its version is captured immediately before the award."
            - "Ace Paving LLC is GOOD_STANDING with max_concurrent_projects 2 and no other awards."
            - "The award is issued by officer-award-1, who is not the adopter."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
