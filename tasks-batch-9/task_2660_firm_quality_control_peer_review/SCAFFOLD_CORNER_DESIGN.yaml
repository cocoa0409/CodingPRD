              as_user_id: "${mp_id}"
          assert:
            - "HTTP 201"
            - "data.risk_score == 40 (not 56)"
            - "data.eqr_required == false"
            - "data.prior_finding_count_3y == 9 and data.workflow_state == \"PLANNING\""

      - name: must_select_coverage_excludes_unreleased_engagements
        claim_type: Input Set Filtering
        grounds:
          - calculations.must_select_coverage_pct
          - calculations.inspection_engagement_selection
        distinguishing_aspect: >-
          The eligible pool is REPORT_RELEASED engagements only. An ERISA_AUDIT
          engagement parked in PLANNING is therefore invisible to the selector:
          must_select_eligible_count is 0 (not 1), coverage is the empty-set
          boundary 100.00, and only the released REVIEW engagement is selected.
        test_recipe:
          setup:
            - "Firm with one released REVIEW engagement and one ERISA_AUDIT engagement still in PLANNING."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
