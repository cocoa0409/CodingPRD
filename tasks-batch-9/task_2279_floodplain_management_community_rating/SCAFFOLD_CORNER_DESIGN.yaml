# =============================================================================
# task_2279 — §1.9 Scaffold Corner Design (Claim Coverage Index)
# Breadth probe: references/claim-extraction-guide.md walked row by row against
# SCAFFOLD.yaml §1.1–§1.7. Every numeric assert was executed against the
# declared formulas and constants and is written as a literal. Corners already
# owned by §1.8 carry `excluded_because:` and no test_recipe.
#
# Canonical base fixture reused by most recipes (all literals verified):
#   community "Bayou City" TX/480001, freeboard_ft 1.5, cumulative_period_years 10
#   FirmPanel 48001C0100-H, zone AE, BFE 12.0, effective 2020-01-01 -> EFFECTIVE
#   Property P-0001 (mapped_area_code RLA-1), RESIDENTIAL structure,
#   market_value_usd 200000.00, highest_adjacent_grade_ft 10.0
#   => permit requirement = 12.0 + max(1.5, 1.0) = 13.5 ft
#   logical clock stays at the 2026-08-01T00:00:00Z startup default unless a
#   recipe advances it with POST /floodplain/_clock/set_current_utc
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: community_creation_returns_declared_and_computed_fields
        claim_type: creation
        grounds:
          - endpoints."POST /floodplain/communities"
          - entities.Community.fields
          - calculations.sanction_risk_and_posture
        distinguishing_aspect: |
          A community created with every optional field supplied echoes the four input
          fields verbatim and initialises all six computed fields plus version in the
          201 body: sanction_risk_points 0, compliance_posture GOOD_STANDING, crs_class 10
          (the WORST_CRS_CLASS floor, not 1), both credit totals 0, version 1, and
          standards_adopted_at stamped from the logical clock rather than wall time.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to the 2026-08-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /floodplain/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          trigger:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 2.0, cumulative_period_years: 15 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Community.${comm_id}.name == 'Bayou City'"
            - "Community.${comm_id}.state_code == 'TX'"
            - "Community.${comm_id}.cid_number == '480001'"
            - "Community.${comm_id}.freeboard_ft == 2.0"
            - "Community.${comm_id}.cumulative_period_years == 15"
            - "Community.${comm_id}.sanction_risk_points == 0"
            - "Community.${comm_id}.compliance_posture == GOOD_STANDING"
            - "Community.${comm_id}.crs_class == 10"
            - "Community.${comm_id}.crs_credit_points_claimed == 0"
            - "Community.${comm_id}.crs_credit_points_verified == 0"
            - "Community.${comm_id}.standards_adopted_at == '2026-08-01T00:00:00Z'"
            - "Community.${comm_id}.version == 1"

      - name: community_omitted_optional_fields_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Community.fields.freeboard_ft
          - entities.Community.fields.cumulative_period_years
          - endpoints."POST /floodplain/communities"
        distinguishing_aspect: |
          Omitting freeboard_ft and cumulative_period_years yields exactly 1.0 and 10 —
          not null and not 0 — so the community immediately satisfies the
          A430_CUMULATIVE_SI prerequisite (period >= 10) while A430_FREEBOARD is capped
          at floor(100 * 1.0) = 100 points.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /floodplain/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          trigger:
            - call: "POST /floodplain/communities"
              payload: { name: "Default Ville", state_code: "LA", cid_number: "220001" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Community.${comm_id}.freeboard_ft == 1.0"
            - "Community.${comm_id}.cumulative_period_years == 10"
            - "Community.${comm_id}.crs_class == 10"

      - name: structure_retrieval_returns_stored_and_zeroed_aggregate_fields
        claim_type: retrieval
        grounds:
          - endpoints."GET /floodplain/structures/{structureId}"
          - entities.Structure.fields
          - calculations.structure_improvement_aggregates
        distinguishing_aspect: |
          A freshly created non-pre-FIRM structure reads back with compliance_status
          PENDING_CERTIFICATE, substantial_status NONE, lowest_floor_elevation_ft null,
          anchor_record_id null and all three aggregates at 0 / 0.00 — the empty-ledger
          branch of structure_improvement_aggregates, never a division by zero.
        test_recipe:
          setup:
            - "Canonical base fixture through the structure."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
          trigger:
            - call: "GET /floodplain/structures/${struct_id}"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 200"
            - "Structure.${struct_id}.property_id == ${prop_id}"
            - "Structure.${struct_id}.structure_use == RESIDENTIAL"
            - "Structure.${struct_id}.pre_firm == false"
            - "Structure.${struct_id}.market_value_usd == 200000.00"
            - "Structure.${struct_id}.highest_adjacent_grade_ft == 10.0"
            - "Structure.${struct_id}.lowest_floor_elevation_ft == null"
            - "Structure.${struct_id}.compliance_status == PENDING_CERTIFICATE"
            - "Structure.${struct_id}.substantial_status == NONE"
            - "Structure.${struct_id}.anchor_record_id == null"
            - "Structure.${struct_id}.cumulative_counted_cost_usd == 0"
            - "Structure.${struct_id}.cumulative_improvement_pct == 0.00"
            - "Structure.${struct_id}.single_event_improvement_pct == 0.00"
            - "Structure.${struct_id}.version == 1"

      - name: pre_firm_structure_starts_on_the_pre_firm_existing_branch
        claim_type: computed_fields
        grounds:
          - endpoints."POST /floodplain/structures"
          - state_machines.Structure.PENDING_CERTIFICATE_to_PRE_FIRM_EXISTING
          - entities.Structure.fields.compliance_status
        distinguishing_aspect: |
          pre_firm = true routes compliance_status to PRE_FIRM_EXISTING at creation instead
          of PENDING_CERTIFICATE, while substantial_status still starts at NONE — the two
          parallel axes are set independently by the same create call.
        test_recipe:
          setup:
            - "Canonical base fixture through the property."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "NON_RESIDENTIAL", pre_firm: true, construction_year: 1962, market_value_usd: 150000.00, highest_adjacent_grade_ft: 9.5 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Structure.${struct_id}.compliance_status == PRE_FIRM_EXISTING"
            - "Structure.${struct_id}.substantial_status == NONE"
            - "Structure.${struct_id}.lowest_floor_elevation_ft == null"
            - "Structure.${struct_id}.version == 1"

      - name: permit_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints."GET /floodplain/permits"
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three DRAFT permits on one property, limit 2 / offset 0 returns exactly two
          rows with total_count 3 and has_more true; total_count counts the filtered set,
          not the returned page.
        test_recipe:
          setup:
            - "Canonical base fixture through the structure, then three DRAFT permits filed by the owner."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/permits"
              payload: { property_id: "${prop_id}", structure_id: "${struct_id}", project_type: "NEW_CONSTRUCTION", declared_project_cost_usd: 20000.00, proposed_lowest_floor_elevation_ft: 20.0 }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { permit_1_id: $.data.id }
            - call: "POST /floodplain/permits"
              payload: { property_id: "${prop_id}", structure_id: "${struct_id}", project_type: "IMPROVEMENT", declared_project_cost_usd: 30000.00, proposed_lowest_floor_elevation_ft: 20.0 }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { permit_2_id: $.data.id }
            - call: "POST /floodplain/permits"
              payload: { property_id: "${prop_id}", structure_id: "${struct_id}", project_type: "REPAIR", declared_project_cost_usd: 40000.00, proposed_lowest_floor_elevation_ft: 20.0 }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { permit_3_id: $.data.id }
          trigger:
            - call: "GET /floodplain/permits"
              payload: { property_id: "${prop_id}", limit: 2, offset: 0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 200"
            - "response_type == 'array'"
            - "data length == 2"
            - "total_count == 3"
            - "has_more == true"
            - "limit == 2"
            - "offset == 0"

      - name: certificate_list_filter_by_status_excludes_other_statuses
        claim_type: listing
        grounds:
          - endpoints."GET /floodplain/elevation-certificates"
          - entities.ElevationCertificate.fields.status
          - state_machines.ElevationCertificate.SUBMITTED_to_DEFICIENT
        distinguishing_aspect: |
          The record-retention inventory filtered by status = DEFICIENT returns exactly the
          one deficient certificate and total_count 1, even though two certificates exist
          for the same permit; the SUBMITTED sibling is excluded by the filter, not merely
          sorted later.
        test_recipe:
          setup:
            - "Canonical base fixture; permit taken to ISSUED (requirement 13.5)."
            - "Certificate A filed at 12.0 ft NAVD88 and reviewed DEFICIENT; certificate B filed at 14.0 ft NAVD88 and left SUBMITTED."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/permits"
              payload: { property_id: "${prop_id}", structure_id: "${struct_id}", project_type: "NEW_CONSTRUCTION", declared_project_cost_usd: 20000.00, proposed_lowest_floor_elevation_ft: 20.0 }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /floodplain/permits/${permit_id}/submit"
              as: PropertyOwner
              as_user_id: "${prop_id}"
            - call: "POST /floodplain/permits/${permit_id}/review"
              payload: { decision: "APPROVE" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/permits/${permit_id}/issue"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/elevation-certificates"
              payload: { permit_id: "${permit_id}", structure_id: "${struct_id}", certificate_type: "BUILDING_UNDER_CONSTRUCTION", datum: "NAVD88", measured_lowest_floor_ft: 12.0, measured_bfe_ft: 12.0 }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { cert_a_id: $.data.id }
            - call: "POST /floodplain/elevation-certificates/${cert_a_id}/review"
              payload: { decision: "DEFICIENT", deficiency_codes: ["LOW_FLOOR"] }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/elevation-certificates"
              payload: { permit_id: "${permit_id}", structure_id: "${struct_id}", certificate_type: "FINISHED_CONSTRUCTION", datum: "NAVD88", measured_lowest_floor_ft: 14.0, measured_bfe_ft: 12.0, surveyor_license_no: "TX-5511" }
              as: PropertyOwner
              as_user_id: "${prop_id}"
              captures: { cert_b_id: $.data.id }
          trigger:
            - call: "GET /floodplain/elevation-certificates"
              payload: { permit_id: "${permit_id}", status: "DEFICIENT" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 200"
            - "data length == 1"
            - "total_count == 1"
            - "has_more == false"
            - "data[0].id == ${cert_a_id}"
            - "data[0].status == DEFICIENT"
            - "data[0].deficiency_codes == ['LOW_FLOOR']"

      - name: structure_get_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations.priority_10
          - errors.ERR_STRUCTURE_NOT_FOUND
          - endpoints."GET /floodplain/structures/{structureId}"
        distinguishing_aspect: |
          A syntactically valid but unregistered structure id resolves to 404
          ERR_STRUCTURE_NOT_FOUND — the entity-specific 404 from the priority-10 row, not
          the generic ERR_COMMUNITY_NOT_FOUND placeholder printed as that row's error_id.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /floodplain/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          trigger:
            - call: "GET /floodplain/structures/99999999-9999-4999-8999-999999999999"
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 404"
            - "data.error_id == 'ERR_STRUCTURE_NOT_FOUND'"

      - name: structure_create_without_market_value_is_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_20
          - errors.ERR_INVALID_REQUEST
          - entities.Structure.fields.market_value_usd
        distinguishing_aspect: |
          market_value_usd has source input with no default, so omitting it fails the
          priority-20 schema check with 400 ERR_INVALID_REQUEST before any structure row is
          written — it is never defaulted to 0, which would make every later ratio a
          division by zero.
        test_recipe:
          setup:
            - "Canonical base fixture through the property."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 400"
            - "data.error_id == 'ERR_INVALID_REQUEST'"

      - name: community_freeboard_above_declared_maximum_is_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_20
          - entities.Community.fields.freeboard_ft
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          freeboard_ft is constrained to [0.0, 6.0]; 6.5 is rejected with 400
          ERR_INVALID_REQUEST rather than silently clamped to 6.0 or to the
          A430_FREEBOARD_CAP_FT of 5.0 used by the credit ceiling.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /floodplain/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          trigger:
            - call: "POST /floodplain/communities"
              payload: { name: "Too High", state_code: "MS", cid_number: "280001", freeboard_ft: 6.5 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          assert:
            - "HTTP status == 400"
            - "data.error_id == 'ERR_INVALID_REQUEST'"

      - name: permit_issue_stamps_system_timestamps_and_derived_expiry
        claim_type: system_fields
        grounds:
          - endpoints."POST /floodplain/permits/{permitId}/issue"
          - calculations.derived_deadlines_and_loop_limits
          - entities.DevelopmentPermit.fields.expires_at
        distinguishing_aspect: |
          Issuance stamps issued_at from the logical clock (2026-08-01T00:00:00Z) and
          derives expires_at as exactly issued_at + 365 days = 2027-08-01T00:00:00Z; both
          are system/computed fields the applicant cannot supply.
        test_recipe:
          setup:
            - "Canonical base fixture; permit APPROVED with proposed elevation 20.0 against a requirement of 13.5."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
