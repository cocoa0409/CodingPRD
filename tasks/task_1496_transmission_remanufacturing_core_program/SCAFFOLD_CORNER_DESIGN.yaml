  # ===========================================================================
  # Section: validations (auth, priority, ranges)
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers is rejected 400 before role, existence, or state checks."
        test_recipe:
          setup: ["one MIN model exists"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              captures: { err: "$.data.error_id" }
          assert:
            - "status == 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: booking_state_beats_past_window
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=8]", "errors[ERR_ORDER_NOT_IN_DYNO_QUEUE]", "errors[ERR_BOOKING_IN_PAST]"]
        distinguishing_aspect: "A dyno booking for an order in CALIBRATION AND with a past window violates both state (priority 6) and temporal (priority 8): the state error ERR_ORDER_NOT_IN_DYNO_QUEUE wins."
        test_recipe:
          setup: ["one MIN order in CALIBRATION (calibration not yet verified)"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o_id}/complete-assembly"
              as: RemanTechnician
          trigger:
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-07-01T10:00:00Z", end_utc: "2026-07-01T11:00:00Z" }
              as: RemanTechnician
              captures: { err: "$.data.error_id" }
          assert:
            - "status == 409 and error_id == ERR_ORDER_NOT_IN_DYNO_QUEUE (not ERR_BOOKING_IN_PAST)"

