            - "assigning the fourth order returns HTTP 409 with error_id ERR_LOAD_CAPACITY_EXCEEDED, because it would take assigned_weight_kg to 25641.6 against the 21000 limit and assigned_cube_m3 to 73.8 against the 62.0 limit"
            - "the load is unchanged after the rejection - order_count 3, assigned_weight_kg 19231.2, assigned_cube_m3 55.35"
