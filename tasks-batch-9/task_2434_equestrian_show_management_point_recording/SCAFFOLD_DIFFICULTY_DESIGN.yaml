            - "the case is created with status OPEN and finding null, and the finding call returns 200 with ComplianceCase.${case_id}.status == SUBSTANTIATED and finding == POSITIVE"
            - "link 1: Horse.${horse1_id}.eligibility_status == SUSPENDED; Horse.${horse2_id}.eligibility_status is still ELIGIBLE"
            - "link 2: ClassEntry.${ce1_id}.status == DISQUALIFIED with prize_cents == 0 and placing == null"
            - "link 3: ShowClass.${class_id}.status == JUDGED — a backward edge out of RESULTS_POSTED — with awarded_prize_cents == 0 and placed_count == 3"
            - "link 3 also zeroes the untouched winners: ClassEntry.${ce2_id}.status is still COMPLETED with placing 2, but prize_cents == 0"
            - "link 4: Show.${show_id}.allocated_prize_cents == 0 and Show.${show_id}.unallocated_prize_cents == 750000, with prize_money_pool_cents unchanged at 750000"
            - "Show.${show_id}.welfare_strike_count == 0 — a DRUG_TEST POSITIVE is not a welfare strike"
            - "a second POST /compliance-cases/${case_id}/finding returns 409 ERR_CASE_ALREADY_ADJUDICATED and no cascade link re-runs"
            - "POST /classes/${class_id}/void-results now returns 409 ERR_CLASS_RESULTS_NOT_POSTED, because link 3 already moved the class out of RESULTS_POSTED"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: class_not_open_outranks_coggins_expired
        grounds:
          - validations.priority_10
          - validations.priority_21
          - errors.ERR_CLASS_NOT_OPEN
          - errors.ERR_COGGINS_EXPIRED
          - state_machines.ShowClass.PLANNED_to_OPEN
        distinguishing_aspect: |
          One request body violates a priority-10 state rule and a priority-21
          business_safety rule at once, and the pair straddles the state/safety category
          boundary as well as the 409/422 status boundary. The identical call returns
          409 ERR_CLASS_NOT_OPEN before the class is opened and 422 ERR_COGGINS_EXPIRED
          after, so only ordering — not the request — explains the difference.
        test_recipe:
          setup:
            - "One APPROVED show starting 2026-09-10T13:00:00Z."
            - "One JUMPER division and class 101, deliberately left in PLANNED (never opened)."
            - "One rider with ACTIVE membership."
            - "One horse whose Coggins was drawn 2025-06-01T00:00:00Z, so coggins_expires_on is 2026-06-01T00:00:00Z — earlier than the show start."
            - "One Entry for that rider/horse pair, still RECEIVED (entry submission does not gate on Coggins)."
          setup_api_calls:
            - call: "POST /shows"
              payload: { name: "Autumn Classic", federation_show_id: "FED-2434", venue: "Ridgeline Park", competition_level: "LOCAL", start_utc: "2026-09-10T13:00:00Z", end_utc: "2026-09-13T22:00:00Z", entry_close_utc: "2026-09-01T00:00:00Z", prize_money_pool_cents: 750000, stall_capacity: 40, stall_fee_cents: 7500 }
              as: ShowSecretary
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/divisions"
              payload: { name: "Open Jumper", discipline: "JUMPER", age_group: "OPEN", min_jump_height_cm: 100, max_jump_height_cm: 130, division_share_bp: 3333, jumpoff_enabled: true }
              as: ShowSecretary
              captures: { div_j_id: $.data.id }
            - call: "POST /divisions/${div_j_id}/classes"
              payload: { class_number: 101, name: "Open Jumper 1.20m", jump_height_cm: 120, entry_fee_cents: 25000, class_share_bp: 1669, max_entries: 30 }
              as: ShowSecretary
              captures: { class_id: $.data.id }
            - call: "POST /shows/${show_id}/license-submission"
              payload: {}
              as: ShowSecretary
            - call: "POST /shows/${show_id}/license-decision"
              payload: { decision: "APPROVE" }
              as: FederationOfficer
            - call: "POST /riders"
              payload: { federation_member_number: "M-1001", full_name: "Ada Rider", membership_expires_on: "2027-06-30T00:00:00Z", trainer_name: "Bluegrass Barn" }
              as: FederationOfficer
              captures: { rider1_id: $.data.id }
            - call: "POST /horses"
              payload: { federation_registration_number: "H-2009", name: "Stale Coggins", owner_name: "Ada Rider", coggins_drawn_on: "2025-06-01T00:00:00Z" }
              as: FederationOfficer
              captures: { horse_stale_id: $.data.id }
            - call: "POST /shows/${show_id}/entries"
              payload: { rider_id: "${rider1_id}", horse_id: "${horse_stale_id}", requested_stall_count: 0 }
              as: Exhibitor
              as_user_id: "${rider1_id}"
              captures: { entry1_id: $.data.id }
          trigger:
            - call: "POST /class-entries"
              payload: { entry_id: "${entry1_id}", class_id: "${class_id}" }
              as: Exhibitor
              as_user_id: "${rider1_id}"
            - call: "POST /classes/${class_id}/open"
              payload: {}
              as: ShowSecretary
            - call: "POST /class-entries"
              payload: { entry_id: "${entry1_id}", class_id: "${class_id}" }
              as: Exhibitor
              as_user_id: "${rider1_id}"
          assert:
            - "Horse.${horse_stale_id}.coggins_expires_on == 2026-06-01T00:00:00Z (2025-06-01 + COGGINS_VALIDITY_DAYS 365) and Horse.${horse_stale_id}.eligibility_status == ELIGIBLE, so priority 22 is NOT in play"
            - "the first POST /class-entries returns 409 with error id ERR_CLASS_NOT_OPEN — the priority-10 state rule wins even though the priority-21 Coggins rule is also violated by the same body"
            - "the first POST /class-entries returns exactly one error id; ERR_COGGINS_EXPIRED does not appear anywhere in the response"
            - "no ClassEntry row is created by the first call and ShowClass.${class_id}.entry_count == 0"
            - "the identical third call, after the class is OPEN, returns 422 with error id ERR_COGGINS_EXPIRED — proving the lower-priority rule was live all along and was merely outranked"
            - "ShowClass.${class_id}.entry_count is still 0 after the third call"

      - name: official_license_outranks_time_conflict
        grounds:
          - validations.priority_23
          - validations.priority_43
          - errors.ERR_OFFICIAL_LICENSE_INSUFFICIENT
          - errors.ERR_OFFICIAL_TIME_CONFLICT
          - calculations.official_load_ledger
        distinguishing_aspect: |
          A second pair drawn from a different pair of categories — business_safety 23 against
          business_temporal 43 — on a different endpoint, and separated by a control official
          rather than by a state change: the same two slots that yield 422
          ERR_OFFICIAL_LICENSE_INSUFFICIENT for a HUNTER-only official yield 409
