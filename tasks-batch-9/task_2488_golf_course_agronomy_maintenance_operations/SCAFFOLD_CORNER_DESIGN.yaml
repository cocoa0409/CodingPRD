            - call: "POST /plan-tasks/${task_fert_id}/schedule"
              payload: { maintenance_window_id: "${w_fert_id}", expected_plan_version: "${plan_v_fresh}" }
              as: Agronomist
              as_user_id: "agro-1"
          assert:
            - "${task_fert_commitment} == 4.68 (round(0.85 * 5.5, 2) on the exact decimal 4.675) and the aeration task's commitment_lb == 0"
            - "${plan_v_active} == 3 (create 1, submit 2, approve 3)"
            - "the aeration scheduling returns HTTP 200 with ${task_aer_status} == SCHEDULED and leaves AgronomicPlan.${plan_id}.version == 4 with committed_nitrogen_lb == 0.00"
            - "the fertility scheduling on the now-stale token returns HTTP 412 with ${err_id} == ERR_STALE_PLAN_VERSION"
            - "after the refusal PlanTask.${task_fert_id}.status == PLANNED and version == 1, MaintenanceWindow.${w_fert_id}.plan_task_id == null and version == 1, and TurfArea.${green12_id}.nitrogen_projected_lb_per_1000 is unchanged at 0.850"
            - "${plan_v_fresh} == 4 and ${committed_before} == 0.00"
            - "the retry with the refetched version returns HTTP 200: PlanTask.${task_fert_id}.status == SCHEDULED, AgronomicPlan.${plan_id}.committed_nitrogen_lb == 4.68 and AgronomicPlan.${plan_id}.version == 5"

      - name: occ_stale_plan_version_blocks_plan_approval
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-approve-stale-plan]
          - validations[priority=26]
          - errors[ERR_STALE_PLAN_VERSION]
        distinguishing_aspect: "Covers concurrency_rules.plan-approve-stale-plan on POST /agronomic-plans/{id}/approve: the version the approver read at the FIRST submission is stale after a return and a re-submission even though the plan is once again SUBMITTED, so a naive state-only guard would approve the wrong revision."
        test_recipe:
          setup:
            - "One course, one 5500 sq ft GREEN on hole 12."
            - "One 2026 plan with a 40.00 lb budget and one FERTILITY task at 0.85 lb/1000, submitted, returned once and submitted again."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 12, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 60, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green12_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 40.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green12_id}", task_type: "FERTILITY", nitrogen_lb_per_1000: 0.85, planned_window_start: "2026-08-01T00:00:00Z", planned_window_end: "2026-08-31T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task_fert_id: $.data.id }
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_first_submit: $.data.version }
            - call: "POST /agronomic-plans/${plan_id}/return"
              payload: { return_note: "Split the August fertility into two applications." }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_second_submit: $.data.version }
          trigger:
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v_first_submit}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v_second_submit}" }
              as: Superintendent
              as_user_id: "super-1"
          assert:
            - "${plan_v_first_submit} == 2 and ${plan_v_second_submit} == 4 (create 1, submit 2, return 3, submit 4)"
            - "the approval on the first-submission token returns HTTP 412 with ${err_id} == ERR_STALE_PLAN_VERSION, not ERR_PLAN_STATE_INVALID: the plan really is SUBMITTED, only the revision is wrong"
            - "after the refusal AgronomicPlan.${plan_id}.status == SUBMITTED, version == 4 and return_count == 1"
            - "the approval on the second-submission token returns HTTP 200 with status == ACTIVE and version == 5"
            - "PlanTask.${task_fert_id}.status == PLANNED and AgronomicPlan.${plan_id}.committed_nitrogen_lb == 0.00: approval commits nothing by itself"

      - name: occ_stale_course_version_blocks_weather_declaration
        claim_type: optimistic_concurrency
        grounds:
