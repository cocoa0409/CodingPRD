          - entities.EventDivision.fields.per_school_entry_cap
        distinguishing_aspect: |
          Metric: per-school non-WITHDRAWN entry count in a division against cap 4 (exact
          boundary: count 4 == cap is allowed, the create that would make 5 is rejected).
          Endpoint: POST /entries — distinct endpoint and metric from the break-threshold instance.
        test_recipe:
          setup:
            - "Tournament, DEBATE/CX/VARSITY division with default per_school_entry_cap 4, school Alpha, registration open."
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "Districts EC", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
