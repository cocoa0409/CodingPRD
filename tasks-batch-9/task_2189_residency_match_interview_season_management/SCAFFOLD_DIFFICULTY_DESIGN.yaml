      - name: contract_activation_gated_by_every_mandatory_credential_item
        grounds:
          - validations.priority_11.ERR_CREDENTIALS_INCOMPLETE
          - state_machines.Contract.SIGNED_to_ACTIVE
          - state_machines.CredentialItem.SUBMITTED_to_VERIFIED
          - calculations.credential_packet_composition
        dependency: |
          Contract.status may leave SIGNED for ACTIVE only when
          Contract.verified_credential_count == Contract.mandatory_credential_count. For an IM
          program and a US_CITIZEN applicant the packet is STATE_LICENSE, BLS and DEA, all
          mandatory, so mandatory_credential_count is 3 and the Contract cannot activate until all
          three CredentialItem rows — a different entity, each with its own state machine — reach
          VERIFIED.
        distinguishing_aspect: |
          The blocking condition is the state of the child rows, not their existence: all three
          items exist from the moment the contract is created, and two of them are already VERIFIED
          at the first attempt. An implementation that checks only that the packet was composed, or
          that counts SUBMITTED items as satisfied, activates one credential too early.
        test_recipe:
          setup:
            - "a Program with quota_positions 1 driven through the season to MATCH_COMPLETE"
            - "a SIGNED contract whose packet is STATE_LICENSE, BLS and DEA, all mandatory"
            - "STATE_LICENSE and BLS submitted and VERIFIED; DEA still PENDING"
          setup_api_calls:
