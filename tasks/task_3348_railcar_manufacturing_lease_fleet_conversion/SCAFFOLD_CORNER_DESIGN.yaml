        as: SupplyChainCoordinator
        captures:
          po_ws2: $.data.id
      - call: POST /api/v1/component-purchase-orders/${po_ws2}/confirm
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/component-receipts
        payload:
          component_purchase_order_id: ${po_ws2}
          component_id: ${ws2_id}
          qty_received: 100
          receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          rc_ws2: $.data.id
      - call: POST /api/v1/component-receipts/${rc_ws2}/receive
        payload: {}
        as: SupplyChainCoordinator
      - call: POST /api/v1/production-orders
        payload:
