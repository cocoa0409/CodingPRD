              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${sh_agr}/activate"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${sh_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
              captures: { sh_a1: $.data.id }
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${sh_org}", name: "a2", external_ref: "e2" }
              as: OrgAdmin
              captures: { sh_a2: $.data.id }
            - call: "POST /api/commitment-plans"
              payload: { org_id: "${sh_org}", agreement_id: "${sh_agr}", type: "SAVINGS_PLAN", instance_family: "COMPUTE", units: 0, hourly_commitment_cents: 100, plan_discount_rate: 0.30, term_start: "2026-09-01T00:00:00Z", term_end: "2026-10-01T00:00:00Z" }
              as: OrgAdmin
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${sh_a2}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 80 }
              as: LinkedAccountManager
              as_user_id: "${sh_a2}"
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${sh_a1}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 80 }
              as: LinkedAccountManager
              as_user_id: "${sh_a1}"
          trigger:
            - call: "POST /api/invoices/generate"
              payload: { org_id: "${sh_org}", period_index: 0 }
              as: OrgAdmin
              captures: { sh_inv: $.data.id }
            - call: "GET /api/invoices/${sh_inv}/lines"
              payload: {}
              as: OrgAdmin
          assert:
            - "a1's line (created first) has plan_covered_cents == 80 and plan_discount_cents == 24"
            - "a2's line has plan_covered_cents == 20 and plan_discount_cents == 6 — even though a2's usage was ingested first"
            - "a1 net: 80 - 24 = 56, tier 10% -> 50 (round_half_up of 50.4); a2 net: 80 - 6 = 74, tier -> 67 (round_half_up of 66.6); invoice total_due_cents == 117"

      - name: forecast_window_insufficient_rejected_with_three_period_rule
        claim_type: correct_result
        grounds: [calculations.renewal_forecast, "errors[ERR_FORECAST_WINDOW_INSUFFICIENT]"]
        distinguishing_aspect: "With only 2 closed periods carrying usage, both variants are rejected 409 ERR_FORECAST_WINDOW_INSUFFICIENT; the rule is on closed periods WITH usage, not on the raw period counter."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement ACTIVE with COMPUTE tier; account; usage in periods 0 and 1 only; two period closes."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Fw Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { fw_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${fw_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { fw_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${fw_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${fw_agr}/activate"
              payload: {}
              as: OrgAdmin
            - call: "POST /api/linked-accounts"
              payload: { org_id: "${fw_org}", name: "a1", external_ref: "e1" }
              as: OrgAdmin
              captures: { fw_acct: $.data.id }
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${fw_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T00:00:00Z", list_price_cents: 1000 }
              as: LinkedAccountManager
              as_user_id: "${fw_acct}"
            - call: "POST /api/billing-orgs/${fw_org}/run-period-close"
              payload: {}
              as: PlatformBillingOperator
            - call: "POST /api/usage-records"
              payload: { linked_account_id: "${fw_acct}", service_family: "COMPUTE", usage_hour_start: "2026-09-01T01:00:00Z", list_price_cents: 1000 }
              as: LinkedAccountManager
              as_user_id: "${fw_acct}"
            - call: "POST /api/billing-orgs/${fw_org}/run-period-close"
              payload: {}
              as: PlatformBillingOperator
          trigger:
            - call: "POST /api/renewal-forecasts"
              payload: { agreement_id: "${fw_agr}", variant: "LINEAR" }
