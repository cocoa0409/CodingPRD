  - name: board_quorum_counts_abstentions_but_the_majority_test_does_not
    claim_type: constants_applied
    grounds:
    - calculations.board_vote_outcome
    - validations[priority=74]
    - validations[priority=75]
    - errors[ERR_QUORUM_NOT_MET]
    - errors[ERR_MAJORITY_NOT_MET]
    - entities.AdoptionRecord.fields.supermajority_required
    distinguishing_aspect: Three votes on the SAME board-ready scenario separate the two arithmetic rules. 3-1-0 of nine seats is a strict majority but only four ballots against a quorum threshold of ceil(9/2) == 5, so quorum fails. 3-3-1 of seven clears quorum precisely BECAUSE the abstention counts as a cast ballot, then fails the majority test because abstentions are excluded from its denominator (3 * 2 == 6 is not > 6). 4-3-0 of seven passes both. Scenario A reassigns nobody, so students_reassigned_pct is 0.00 and supermajority_required is false throughout.
