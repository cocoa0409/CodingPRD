  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_lot_version_on_adjust_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.lot-adjust-stale-lot
          - entities.InventoryLot.fields.version
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Two sequential adjusts: first succeeds (lot.version 1→2); a second carrying expected_lot_version=${lot_v_pre}-1 (the stale value) → 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Store S, Product P, lot with quantity_on_hand=10 (version 1)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-OCC", name: "P", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { store_id: "${s_id}", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 10, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /inventory-lots/${lot_id}/adjust"
              payload: { delta: 5, expected_lot_version: "${lot_v}" }
              as: InventoryManager
              captures: { lot_v2: $.data.version }
          trigger:
            - call: "POST /inventory-lots/${lot_id}/adjust"
              payload: { delta: 3, expected_lot_version: "${lot_v}" }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: occ_correct_lot_version_adjust_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.lot-adjust-stale-lot
          - entities.InventoryLot.fields.quantity_on_hand
          - entities.InventoryLot.fields.version
        distinguishing_aspect: "adjust with the current expected_lot_version succeeds: quantity_on_hand 10→15 and version increments 1→2."
        test_recipe:
          setup: ["Store S, Product P, lot quantity_on_hand=10 (version 1)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-OCC2", name: "P", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { store_id: "${s_id}", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 10, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
              captures: { lot_id: $.data.id, lot_v: $.data.version }
          trigger:
            - call: "POST /inventory-lots/${lot_id}/adjust"
              payload: { delta: 5, expected_lot_version: "${lot_v}" }
              as: InventoryManager
              captures: { new_v: $.data.version }
          assert:
            - "InventoryLot.${lot_id}.quantity_on_hand == 15"
            - "InventoryLot.${lot_id}.version == 2"

      - name: derived_recall_state_two_open_recalls_resolve_one_stays_recalled
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Product.fields.recall_state
          - state_machines.Recall.OPEN_to_RESOLVED
        distinguishing_aspect: "With two OPEN recalls covering P, resolving one leaves product.recall_state==RECALLED (the other still covers it); the lot stays QUARANTINED."
        test_recipe:
          setup: ["Store S, Product P, one AVAILABLE lot; two OPEN recalls issued for P."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-2R", name: "P", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { store_id: "${s_id}", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 10, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
              captures: { lot_id: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${p_id}", severity: "ADVISORY" }
              as: InventoryManager
              captures: { r1_id: $.data.id }
            - call: "POST /recalls"
              payload: { product_id: "${p_id}", severity: "MANDATORY" }
              as: InventoryManager
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /recalls/${r1_id}/resolve"
              payload: {}
              as: InventoryManager
          assert:
            - "Product.${p_id}.recall_state == RECALLED"
            - "InventoryLot.${lot_id}.status == QUARANTINED"
            - "Recall.${r1_id}.status == RESOLVED"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: filtered_list_subscriptions_by_customer
        claim_type: Computed read
        grounds:
          - endpoints
          - entities.Subscription.fields.customer_id
        distinguishing_aspect: "GET /subscriptions?customer_id=${c_id} returns only that customer's subscriptions (FK reverse-reachability filtered list)."
        test_recipe:
          setup: ["Two customers each with one subscription."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C1", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C2", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c2_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${c1_id}", product_id: "${p_id}", store_id: "${s_id}", quantity_per_cycle: 1, cycle_days: 30, next_ship_at: "2026-02-01T00:00:00Z" }
              as: Customer
              as_user_id: "${c1_id}"
            - call: "POST /subscriptions"
              payload: { customer_id: "${c2_id}", product_id: "${p_id}", store_id: "${s_id}", quantity_per_cycle: 1, cycle_days: 30, next_ship_at: "2026-02-01T00:00:00Z" }
              as: Customer
              as_user_id: "${c2_id}"
          trigger:
            - call: "GET /subscriptions?customer_id=${c1_id}"
              payload: {}
              as: StoreClerk
          assert:
            - "response.data length == 1"
            - "response.data[0].customer_id == ${c1_id}"

      - name: special_order_fulfill_consumes_reserved_units
        claim_type: Action endpoint
        grounds:
          - endpoints
          - state_machines.SpecialOrder.ALLOCATED_to_FULFILLED
          - entities.InventoryLot.fields.quantity_on_hand
          - entities.InventoryLot.fields.quantity_reserved
        distinguishing_aspect: "Fulfilling an ALLOCATED order of qty=3 against a lot (on_hand 10, reserved 3) drops on_hand to 7 and reserved to 0; order → FULFILLED."
        test_recipe:
          setup: ["Store S, Product P, lot on_hand 10; ALLOCATED special order qty 3 (reserved 3)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-FUL", name: "P", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { store_id: "${s_id}", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 10, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
              captures: { lot_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity: 3, deposit_pct: 0.25 }
              as: StoreClerk
              captures: { so_id: $.data.id }
            - call: "POST /special-orders/${so_id}/allocate"
              payload: {}
              as: InventoryManager
          trigger:
            - call: "POST /special-orders/${so_id}/fulfill"
              payload: {}
              as: StoreClerk
          assert:
            - "SpecialOrder.${so_id}.status == FULFILLED"
            - "InventoryLot.${lot_id}.quantity_on_hand == 7"
            - "InventoryLot.${lot_id}.quantity_reserved == 0"

  # ===========================================================================
  - section: errors
    instances:
      - name: placement_return_already_returned_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PLACEMENT_NOT_RETURNABLE]
          - state_machines.LivestockBatch.sale=RESERVED_to_sale=ON_FLOOR
        distinguishing_aspect: "Returning a placement already RETURNED → 409 ERR_PLACEMENT_NOT_RETURNABLE."
        test_recipe:
          setup: ["Event with a placement that has already been RETURNED once."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /livestock-batches"
              payload: { store_id: "${s_id}", species: "rabbit", animal_class: "SMALL_ANIMAL", head_count: 4, unit_price_cents: 3000, intake_at: "2026-01-01T00:00:00Z", quarantine_days: 5 }
              as: LivestockKeeper
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/clear-quarantine"
              payload: {}
              as: LivestockKeeper
            - call: "POST /livestock-batches/${b_id}/list-on-floor"
              payload: {}
              as: LivestockKeeper
            - call: "POST /adoption-events"
              payload: { store_id: "${s_id}", partner_name: "R", event_date: "2026-01-15T00:00:00Z", capacity: 10 }
              as: StoreClerk
              captures: { e_id: $.data.id }
            - call: "POST /adoption-events/${e_id}/open"
              payload: {}
              as: StoreClerk
            - call: "POST /adoption-placements"
              payload: { event_id: "${e_id}", batch_id: "${b_id}", head: 4 }
              as: LivestockKeeper
              captures: { pl_id: $.data.id }
            - call: "POST /adoption-placements/${pl_id}/return"
              payload: {}
              as: LivestockKeeper
          trigger:
            - call: "POST /adoption-placements/${pl_id}/return"
              payload: {}
              as: LivestockKeeper
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PLACEMENT_NOT_RETURNABLE"

      - name: prescription_issue_from_booked_appointment_not_eligible
        claim_type: violation_to_error
        grounds:
          - errors[ERR_APPOINTMENT_NOT_ELIGIBLE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / prescription_issue_requires_completed_vet_exam
          rationale: "The eligible-COMPLETED-VET_EXAM path is the positive of the §1.8 cross-entity instance; the BOOKED-rejection is its direct negative and is asserted there."

      - name: product_recalled_blocks_run_shipment_error
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PRODUCT_RECALLED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / recall_safety_beats_inventory_fiscal_on_run_shipment
          rationale: "ERR_PRODUCT_RECALLED on run-shipment is asserted as the winning error of the named §1.8 priority-conflict instance."

      - name: stale_subscription_version_on_run_shipment_error
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules.shipment-run-stale-subscription
        distinguishing_aspect: "Two sequential run-shipments: the first fulfills the due cycle (sub.version bumps); the second carrying the original ${sub_v} → 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["ACTIVE subscription due now (qty 1), lot stocked with 10 units."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-SV", name: "P", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { store_id: "${s_id}", product_id: "${p_id}", lot_code: "L1", quantity_on_hand: 10, received_at: "2026-01-02T00:00:00Z", expiry_date: "2026-12-01T00:00:00Z" }
              as: InventoryManager
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C", home_store_id: "${s_id}" }
              as: StoreClerk
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: StoreClerk
            - call: "POST /subscriptions"
              payload: { customer_id: "${c_id}", product_id: "${p_id}", store_id: "${s_id}", quantity_per_cycle: 1, cycle_days: 30, next_ship_at: "2026-02-01T00:00:00Z" }
              as: StoreClerk
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /subscriptions/${sub_id}/run-shipment"
              payload: { expected_subscription_version: "${sub_v}" }
              as: StoreClerk
          trigger:
            - call: "POST /subscriptions/${sub_id}/run-shipment"
              payload: { expected_subscription_version: "${sub_v}" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
