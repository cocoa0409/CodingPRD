  - section: Errors
    instances:
      - name: every_not_found_error_in_the_catalog_is_reachable_by_an_unknown_id
        claim_type: triggerability
        grounds:
          - errors.ERR_CONFORMANCE_TEST_NOT_FOUND
          - errors.ERR_THRESHOLD_CONFIG_NOT_FOUND
          - errors.ERR_PATIENT_RECORD_NOT_FOUND
          - errors.ERR_CLUSTER_NOT_FOUND
          - errors.ERR_MATCH_LINK_NOT_FOUND
          - errors.ERR_DIRECTIVE_NOT_FOUND
          - errors.ERR_QUERY_NOT_FOUND
          - errors.ERR_AUDIT_ENTRY_NOT_FOUND
          - errors.ERR_BREAK_GLASS_NOT_FOUND
          - errors.ERR_SUBSCRIPTION_NOT_FOUND
          - errors.ERR_DATA_FEED_NOT_FOUND
          - errors.ERR_INVOICE_NOT_FOUND
          - validations.priority_7
        distinguishing_aspect: |
          Priority 7 resolves the path id against the entity that owns the route, so each read must
          return its own entity-specific 404 rather than a generic one. Twelve reads on an empty store
          must produce twelve distinct error_ids, all at HTTP 404, proving the catalog is not collapsed
          onto a single ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty store; none of the 00000000-0000-4000-8000-0000000000?? ids below exist."
          setup_api_calls: []
          trigger:
            - call: "GET /hie/conformance-tests/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: HieAdmin
              captures: { errN_ct: $.data.error_id }
            - call: "GET /hie/match-threshold-configs/00000000-0000-4000-8000-000000000002"
