      - call: POST /rights-assets
        payload:
          asset_code: NBA-2026
          competition_name: NBA
          season_label: 2026-27
          season_start_date: '2026-10-01T00:00:00Z'
          season_end_date: '2027-04-30T23:59:59Z'
          total_package_pool: 4
          guaranteed_rating_basis_points: 6000
        as: RightsManager
        captures:
          asset_id: $.data.id
      - call: POST /broadcasters
        payload:
          legal_name: ESPN Inc
          home_territory: US
          platform_classes:
          - LINEAR_TV
          credit_rating: INVESTMENT_GRADE
        as: RightsManager
        captures:
          b_id: $.data.id
      - call: POST /broadcasters/${b_id}/accredit
        payload: {}
        as: RightsManager
      - call: POST /packages
        payload:
          package_code: NBA-US-A
          territory_code: US
          platform_class: LINEAR_TV
          window_start: '2026-10-01T00:00:00Z'
          window_end: '2027-04-30T23:59:59Z'
          exclusivity_class: EXCLUSIVE
          minimum_bid_cents: 40000000
          games_committed: 20
          asset_id: ${asset_id}
        as: RightsManager
        captures:
          pkg_id: $.data.id
      - call: POST /rights-assets/${asset_id}/lock-packages
        payload: {}
        as: RightsManager
      - call: POST /packages/${pkg_id}/bids
        payload:
          bidder_id: ${b_id}
          offered_fee_cents: 50000000
          upfront_pct: 0.1
          escalator_rate_pct: 0.05
          minimum_growth_pct: 0.02
          fee_cap_cents: 80000000
          production_commitment_games: 20
          audience_commitment_pct: 0.7
          exclusivity_request: MATCH_PACKAGE
        as: BidCoordinator
        as_user_id: ${b_id}
        captures:
          bid_id: $.data.id
      - call: POST /packages/${pkg_id}/bids/${bid_id}/submit
        payload: {}
        as: BidCoordinator
        as_user_id: ${b_id}
      - call: POST /packages/${pkg_id}/bids/${bid_id}/start-review
        payload: {}
        as: RightsManager
      - call: POST /packages/${pkg_id}/bids/${bid_id}/shortlist
        payload: {}
        as: RightsManager
      - call: GET /packages/${pkg_id}
        as: RightsManager
        captures:
          pkg_v: $.data.version
      - call: POST /packages/${pkg_id}/bids/${bid_id}/accept
        payload:
          expected_package_version: ${pkg_v}
        as: RightsManager
        captures:
          deal_id: $.data.id
      - call: POST /deals/${deal_id}/payment-milestones
        payload:
          season_index: 1
          sequence_in_season: 1
          due_date: '2026-10-15T00:00:00Z'
          milestone_weight: 1.0
        as: FinanceController
      - call: POST /deals/${deal_id}/production-obligations
        payload:
          season_index: 1
        as: ProductionAuditor
        captures:
          ob_id: $.data.id
      - call: GET /deals/${deal_id}
        as: RightsManager
        captures:
          deal_v: $.data.version
      - call: POST /deals/${deal_id}/execute
        payload:
          expected_deal_version: ${deal_v}
          term_start: '2026-10-01T00:00:00Z'
          term_end: '2027-04-30T23:59:59Z'
        as: RightsManager
      - call: POST /deals/${deal_id}/broadcast-events
        payload:
          obligation_id: ${ob_id}
          event_code: EV1
          scheduled_kickoff_utc: '2026-11-01T00:00:00Z'
        as: ProductionAuditor
        captures:
          ev1: $.data.id
      - call: POST /deals/${deal_id}/broadcast-events/${ev1}/mark-delivered
        payload:
          actual_air_start_utc: '2026-11-01T01:00:00Z'
        as: ProductionAuditor
      - call: POST /deals/${deal_id}/broadcast-events
        payload:
          obligation_id: ${ob_id}
          event_code: EV2
          scheduled_kickoff_utc: '2026-11-05T00:00:00Z'
        as: ProductionAuditor
        captures:
          ev2: $.data.id
      - call: POST /deals/${deal_id}/broadcast-events/${ev2}/mark-delivered
        payload:
          actual_air_start_utc: '2026-11-05T01:00:00Z'
        as: ProductionAuditor
      - call: POST /deals/${deal_id}/broadcast-events
        payload:
          obligation_id: ${ob_id}
          event_code: EV3
          scheduled_kickoff_utc: '2026-11-08T00:00:00Z'
        as: ProductionAuditor
        captures:
          ev3: $.data.id
      - call: POST /deals/${deal_id}/broadcast-events/${ev3}/mark-delivered
        payload:
          actual_air_start_utc: '2026-11-08T01:00:00Z'
        as: ProductionAuditor
      - call: POST /deals/${deal_id}/broadcast-events
        payload:
          obligation_id: ${ob_id}
          event_code: EV4
          scheduled_kickoff_utc: '2026-11-12T00:00:00Z'
        as: ProductionAuditor
        captures:
          ev4: $.data.id
      - call: POST /deals/${deal_id}/broadcast-events/${ev4}/mark-delivered
        payload:
          actual_air_start_utc: '2026-11-12T01:00:00Z'
        as: ProductionAuditor
      - call: POST /deals/${deal_id}/broadcast-events
        payload:
          obligation_id: ${ob_id}
          event_code: EV5
          scheduled_kickoff_utc: '2026-11-15T00:00:00Z'
        as: ProductionAuditor
        captures:
          ev5: $.data.id
      - call: POST /deals/${deal_id}/broadcast-events/${ev5}/mark-delivered
        payload:
          actual_air_start_utc: '2026-11-15T01:00:00Z'
        as: ProductionAuditor
      - call: POST /deals/${deal_id}/broadcast-events
        payload:
          obligation_id: ${ob_id}
          event_code: EV6
          scheduled_kickoff_utc: '2026-11-19T00:00:00Z'
        as: ProductionAuditor
        captures:
          ev6: $.data.id
      - call: POST /deals/${deal_id}/broadcast-events/${ev6}/mark-delivered
        payload:
          actual_air_start_utc: '2026-11-19T01:00:00Z'
        as: ProductionAuditor
      - call: POST /deals/${deal_id}/broadcast-events
        payload:
          obligation_id: ${ob_id}
          event_code: EV7
          scheduled_kickoff_utc: '2026-11-22T00:00:00Z'
        as: ProductionAuditor
        captures:
          ev7: $.data.id
      - call: POST /deals/${deal_id}/broadcast-events/${ev7}/mark-delivered
        payload:
          actual_air_start_utc: '2026-11-22T01:00:00Z'
        as: ProductionAuditor
      - call: POST /deals/${deal_id}/broadcast-events
        payload:
          obligation_id: ${ob_id}
          event_code: EV8
          scheduled_kickoff_utc: '2026-11-26T00:00:00Z'
        as: ProductionAuditor
        captures:
          ev8: $.data.id
      - call: POST /deals/${deal_id}/broadcast-events/${ev8}/mark-delivered
        payload:
          actual_air_start_utc: '2026-11-26T01:00:00Z'
        as: ProductionAuditor
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2027-05-15T00:00:00Z'
        as: RightsManager
      trigger:
      - call: POST /deals/${deal_id}/production-obligations/${ob_id}/declare-shortfall
        payload: {}
        as: ProductionAuditor
      assert:
      - ProductionObligation.shortfall_games == 12 (20 - 8)
      - 'Season-1 escalated fee: fee_1 = min(50000000, 80000000) = 50000000 (escalated_rights_fee
        on Deal domain)'
      - per_game_cents = round_half_up(50000000 / 20) = 2500000
      - base_credit = 12 * 2500000 = 30000000
      - 'aggravation ratio = 12/20 = 0.60 > 0.20 → multiplier 1.5 applied: 30000000
        * 1.5 = 45000000'
      - 'Cap: min(45000000, 50000000) = 45000000'
      - ProductionObligation.make_good_credit_cents == 45000000 (make_good_credit
        on Obligation domain)
      - Deal.accrued_make_good_credit_cents == 45000000
      - escalated_rights_fee (50000000) != make_good_credit_cents (45000000) — different
        domains produce different outputs on the same deal
- rule_id: combinatorial_formula
  instances:
  - name: escalated_rights_fee_three_input_nested_max_min
    grounds:
    - calculations.escalated_rights_fee
    distinguishing_aspect: 'Mode (a) — formula with ≥3 inputs and non-linear interaction:

      nested max(compounded, floor) then min(pre_cap, cap), conditional

      branch on season_index == 1, and tiered rate selection via

      escalator. Three inputs (base_fee, escalator_rate, min_growth) all

      interact non-linearly; changing min_growth from 0 to 0.10 alters

      which branch of the max() fires and changes downstream cap behavior.

      '
    test_recipe:
      setup:
      - Deal with base_fee_cents = 100000000, escalator_rate_pct = 0.03, minimum_growth_pct
        = 0.10, fee_cap_cents = 120000000
      - Season 1 executed; PaymentMilestones for season 1 created with escalated_amount_cents
        = 100000000 (capped from base)
      setup_api_calls:
      - call: POST /rights-assets
        payload:
          asset_code: NFL-2026
          competition_name: NFL
          season_label: 2026-27
          season_start_date: '2026-09-01T00:00:00Z'
          season_end_date: '2027-02-15T23:59:59Z'
          total_package_pool: 3
          guaranteed_rating_basis_points: 7000
        as: RightsManager
        captures:
          asset_id: $.data.id
      - call: POST /broadcasters
        payload:
          legal_name: Fox Sports
          home_territory: US
          platform_classes:
          - LINEAR_TV
          credit_rating: INVESTMENT_GRADE
        as: RightsManager
        captures:
          b_id: $.data.id
      - call: POST /broadcasters/${b_id}/accredit
        payload: {}
        as: RightsManager
      - call: POST /packages
        payload:
          package_code: NFL-US-A
          territory_code: US
          platform_class: LINEAR_TV
          window_start: '2026-09-01T00:00:00Z'
          window_end: '2027-02-15T23:59:59Z'
          exclusivity_class: EXCLUSIVE
          minimum_bid_cents: 100000000
          games_committed: 5
          asset_id: ${asset_id}
        as: RightsManager
        captures:
          pkg_id: $.data.id
      - call: POST /rights-assets/${asset_id}/lock-packages
        payload: {}
        as: RightsManager
      - call: POST /packages/${pkg_id}/bids
        payload:
          bidder_id: ${b_id}
          offered_fee_cents: 100000000
          upfront_pct: 0.2
          escalator_rate_pct: 0.03
          minimum_growth_pct: 0.1
          fee_cap_cents: 120000000
          production_commitment_games: 5
          audience_commitment_pct: 0.8
          exclusivity_request: MATCH_PACKAGE
        as: BidCoordinator
        as_user_id: ${b_id}
        captures:
          bid_id: $.data.id
      - call: POST /packages/${pkg_id}/bids/${bid_id}/submit
        payload: {}
        as: BidCoordinator
        as_user_id: ${b_id}
      - call: POST /packages/${pkg_id}/bids/${bid_id}/start-review
        payload: {}
        as: RightsManager
      - call: POST /packages/${pkg_id}/bids/${bid_id}/shortlist
        payload: {}
        as: RightsManager
      - call: GET /packages/${pkg_id}
        as: RightsManager
        captures:
          pkg_v: $.data.version
      - call: POST /packages/${pkg_id}/bids/${bid_id}/accept
        payload:
          expected_package_version: ${pkg_v}
        as: RightsManager
        captures:
          deal_id: $.data.id
      - call: POST /deals/${deal_id}/payment-milestones
        payload:
          season_index: 1
          sequence_in_season: 1
          due_date: '2026-09-15T00:00:00Z'
          milestone_weight: 1.0
        as: FinanceController
        captures:
          ms1: $.data.id
      - call: POST /deals/${deal_id}/production-obligations
        payload:
          season_index: 1
        as: ProductionAuditor
      - call: GET /deals/${deal_id}
        as: RightsManager
        captures:
          deal_v: $.data.version
      - call: POST /deals/${deal_id}/execute
        payload:
          expected_deal_version: ${deal_v}
          term_start: '2026-09-01T00:00:00Z'
          term_end: '2029-02-15T23:59:59Z'
        as: RightsManager
      trigger:
      - call: POST /deals/${deal_id}/payment-milestones
        payload:
          season_index: 2
          sequence_in_season: 1
          due_date: '2027-09-15T00:00:00Z'
          milestone_weight: 1.0
        as: FinanceController
        captures:
          ms2: $.data.id
      assert:
      - 'Season 1: fee_1 = min(100000000, 120000000) = 100000000 (no escalation for
        n=1)'
      - 'Season 2: compounded = 100000000 * 1.03^1 = 103000000; floor = 100000000
        * 1.10 = 110000000; pre_cap = max(103000000, 110000000) = 110000000 (min_growth
        dominates); fee_2 = min(110000000, 120000000) = 110000000'
      - PaymentMilestone.${ms2}.base_amount_cents == 110000000 (min_growth_pct wins
        over compound escalator because 0.10 > 0.03 in season 2)
      - If min_growth had been 0.0, season 2 would have been 103000000 — the non-linear
        branch switch is observable
  - name: payment_schedule_allocation_nested_rounding
    grounds:
    - calculations.payment_schedule_allocation
    distinguishing_aspect: 'Mode (b) — nested rounding where order matters: per-milestone

      round_half_up then sum, vs sum-then-round. The scaffold pins

      per-milestone rounding followed by remainder reconciliation. If

      implementation instead summed raw floats then rounded once, the

      season total would differ from sum of milestone base_amount_cents.

      Three milestones with weights 0.333, 0.333, 0.334 expose the

      rounding trap.

      '
    test_recipe:
      setup:
      - Deal executed with base_fee_cents = 100000000, escalator 0.0, min_growth 0.0,
        cap 200000000 (so fee_1 = 100000000)
      - Three PaymentMilestones for season 1 with weights 0.333, 0.333, 0.334 (sum
        = 1.0)
