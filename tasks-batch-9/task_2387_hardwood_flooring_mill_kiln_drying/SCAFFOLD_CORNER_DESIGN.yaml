            - "Duplicate chamber: status 409 with data.error_id == \"ERR_DUPLICATE_CODE\"; the existing K1 still shows capacity_board_feet == 12000."
            - "K2: status 201 with data.chamber_code == \"K2\" and data.status == \"AVAILABLE\"; GET /mill/kiln-chambers returns total_count 2."

