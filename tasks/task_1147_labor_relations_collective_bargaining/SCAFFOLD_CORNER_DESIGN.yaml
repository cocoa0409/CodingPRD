# =============================================================================
# 1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Labor Relations & Collective Bargaining Administration (task 1147)
# Sections follow references/claim-extraction-guide.md. Instances already
# exercised by §1.8 appear as excluded_because stubs.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: union_create_defaults_and_system_fields
        claim_type: defaults
        grounds: [entities.Union.fields.status, entities.Union.fields.open_information_request_count]
        distinguishing_aspect: "Union create applies server defaults: status ACTIVE, open_information_request_count 0, version 1, server-minted UUID id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union CA", union_code: "UCA-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
          trigger:
            - call: "GET /labor-relations/unions/${u_id}"
              payload: {}
              as: LRAdmin
          assert:
            - "Union.${u_id}.status == ACTIVE"
            - "Union.${u_id}.open_information_request_count == 0"
            - "Union.${u_id}.version == 1 and id is a server-minted UUID"

      - name: agreement_create_computed_defaults
        claim_type: computed_fields
        grounds: [entities.CollectiveAgreement.fields.posture, entities.CollectiveAgreement.fields.envelope_committed_cents, entities.CollectiveAgreement.fields.deadline_mode]
        distinguishing_aspect: "Agreement create computes posture NEGOTIATING from DRAFT, zeroes envelope_committed_cents and extension_count, and defaults deadline_mode to BUSINESS when omitted."
        test_recipe:
          setup: ["union U exists"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union CB", union_code: "UCB-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA CB", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
          assert:
            - "CollectiveAgreement.${a_id}.status == DRAFT and posture == NEGOTIATING"
            - "CollectiveAgreement.${a_id}.envelope_committed_cents == 0 and extension_count == 0"
            - "CollectiveAgreement.${a_id}.deadline_mode == BUSINESS (default applied)"

      - name: proposal_create_round_number_input_ignored
        claim_type: system_fields
        grounds: [entities.Proposal.fields.round_number, entities.Proposal.fields.submitted_by_user_id]
        distinguishing_aspect: "Client-supplied system fields are ignored on create: posting round_number 99 still yields round_number 1, and submitted_by_user_id comes from the X-User-ID header."
        test_recipe:
          setup: ["union U and DRAFT agreement A exist"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union CC", union_code: "UCC-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA CC", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "EMPLOYER", title: "Draft", proposal_type: "NON_ECONOMIC", round_number: 99 }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { p_id: $.data.id }
          assert:
            - "Proposal.${p_id}.round_number == 1 (input ignored)"
            - "Proposal.${p_id}.submitted_by_user_id == neg-1 (system-sourced from header)"

      - name: get_missing_agreement_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "Reading a well-formed but nonexistent agreement id returns the 404 envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /labor-relations/agreements/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: LRAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND and http status == 404"

      - name: proposal_missing_required_returns_400
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "Omitting the required field title on proposal create returns ERR_INVALID_REQUEST before any state work."
        test_recipe:
          setup: ["union U and DRAFT agreement A exist"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union CD", union_code: "UCD-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA CD", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "EMPLOYER", proposal_type: "NON_ECONOMIC" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (missing title)"

      - name: proposal_side_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: [entities.Proposal.fields.side, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An enum value outside {EMPLOYER, UNION} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["union U and DRAFT agreement A exist"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union CE", union_code: "UCE-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA CE", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "MIDDLE", title: "Bad enum", proposal_type: "NON_ECONOMIC" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: proposal_wage_pct_range_boundary
        claim_type: type_constraints
        grounds: [entities.Proposal.fields.wage_increase_pct, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "wage_increase_pct 0.25 is the inclusive upper bound (accepted); 0.26 exceeds it and is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["union U and DRAFT agreement A exist"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union CF", union_code: "UCF-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA CF", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "EMPLOYER", title: "Max ok", proposal_type: "ECONOMIC", wage_increase_pct: 0.25, affected_headcount: 10 }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { p_id: $.data.id }
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "EMPLOYER", title: "Too big", proposal_type: "ECONOMIC", wage_increase_pct: 0.26, affected_headcount: 10 }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { err: $.data.error_id }
          assert:
            - "Proposal.${p_id} created with wage_increase_pct 0.25 (inclusive bound)"
            - "err == ERR_INVALID_REQUEST for 0.26"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: rejected_proposal_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Proposal.ON_TABLE_to_REJECTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal: any further transition attempt on the proposal fails with ERR_INVALID_STATE and leaves rejection_reason intact."
        test_recipe:
          setup: ["union U ACTIVE; DRAFT agreement A; UNION proposal ON_TABLE"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union CG", union_code: "UCG-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA CG", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "UNION", title: "Union ask", proposal_type: "NON_ECONOMIC" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
              captures: { p_id: $.data.id }
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "TENDERED" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ON_TABLE" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "REJECTED", reason: "Out of scope" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
          trigger:
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "WITHDRAWN" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Proposal.${p_id}.status == REJECTED and rejection_reason == Out of scope"

      - name: archived_agreement_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.CollectiveAgreement.EXPIRED_to_ARCHIVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ARCHIVED is terminal for lifecycle writes: extend on an ARCHIVED agreement fails with ERR_INVALID_STATE even when the OCC version presented is current."
        test_recipe:
          setup: ["union U; agreement A activated then swept to EXPIRED (expiration 2026-06-30, clock 2026-07-01), then archived"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union CH", union_code: "UCH-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA CH", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-06-30T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/agreements/${a_id}/activate"
              payload: {}
              as: LRAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: LRAdmin
            - call: "POST /labor-relations/agreements/${a_id}/archive"
              payload: {}
              as: LRAdmin
            - call: "GET /labor-relations/agreements/${a_id}"
              payload: {}
              as: LRAdmin
              captures: { a_v: $.data.version }
          trigger:
            - call: "POST /labor-relations/agreements/${a_id}/extend"
              payload: { new_expiration_date: "2027-06-30T00:00:00Z", expected_agreement_version: "${a_v}" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (ARCHIVED is not an extendable from-state)"
            - "CollectiveAgreement.${a_id}.status == ARCHIVED and posture == CLOSED"

      - name: completed_session_cannot_reopen
        claim_type: invalid_transition
        grounds: [state_machines.BargainingSession.IN_SESSION_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal: reopening a completed session (IN_SESSION transition) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["union U; DRAFT agreement A; session S opened (clock 2026-06-01T10:30 within window) and completed with a summary"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union CI", union_code: "UCI-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA CI", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/sessions"
              payload: { agreement_id: "${a_id}", mediator_id: "med-c", lead_negotiator_id: "ln-c", location: "Room 1", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:30:00Z" }
              as: LRAdmin
            - call: "POST /labor-relations/sessions/${s_id}/state"
              payload: { to_status: "IN_SESSION" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/sessions/${s_id}/state"
              payload: { to_status: "COMPLETED", summary_note: "Exchanged economics" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
          trigger:
            - call: "POST /labor-relations/sessions/${s_id}/state"
              payload: { to_status: "IN_SESSION" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "BargainingSession.${s_id}.status == COMPLETED and summary_note preserved"

      - name: decertified_union_no_return
        claim_type: terminal_lockdown
        grounds: [state_machines.Union.ACTIVE_to_DECERTIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DECERTIFIED is terminal for the union: a subsequent TRUSTEED transition is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["union U decertified"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union CJ", union_code: "UCJ-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/unions/${u_id}/state"
              payload: { to_status: "DECERTIFIED" }
              as: LRAdmin
          trigger:
            - call: "POST /labor-relations/unions/${u_id}/state"
              payload: { to_status: "TRUSTEED" }
              as: LRAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "Union.${u_id}.status == DECERTIFIED"

      - name: info_request_objection_cycle
        claim_type: valid_transition
        grounds: [state_machines.InformationRequest.IN_PROGRESS_to_OBJECTED, state_machines.InformationRequest.OBJECTED_to_IN_PROGRESS]
        distinguishing_aspect: "The objection cycle OBJECTED -> IN_PROGRESS (objection withdrawn by LegalCounsel) loops without losing objection_basis, and terminal fulfillment decrements the union's open count to 0."
        test_recipe:
          setup: ["union U; agreement A (BUSINESS); information request IR received 2026-05-01T09:00:00Z"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union CK", union_code: "UCK-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA CK", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000, deadline_mode: "BUSINESS" }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/information-requests"
              payload: { union_id: "${u_id}", agreement_id: "${a_id}", subject: "Seniority list", received_at: "2026-05-01T09:00:00Z" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
              captures: { ir_id: $.data.id }
            - call: "POST /labor-relations/information-requests/${ir_id}/state"
              payload: { to_status: "ACKNOWLEDGED" }
              as: LRManager
              as_user_id: "mgr-1"
            - call: "POST /labor-relations/information-requests/${ir_id}/state"
              payload: { to_status: "IN_PROGRESS" }
              as: LRManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /labor-relations/information-requests/${ir_id}/state"
              payload: { to_status: "OBJECTED", objection_basis: "Confidential trade secret" }
              as: LegalCounsel
              as_user_id: "lc-1"
            - call: "POST /labor-relations/information-requests/${ir_id}/state"
              payload: { to_status: "IN_PROGRESS" }
              as: LegalCounsel
              as_user_id: "lc-1"
            - call: "POST /labor-relations/information-requests/${ir_id}/state"
              payload: { to_status: "FULFILLED", response_note: "Records shipped" }
              as: LRManager
              as_user_id: "mgr-1"
            - call: "GET /labor-relations/unions/${u_id}"
              payload: {}
              as: LRManager
              as_user_id: "mgr-1"
              captures: { open_count: $.data.open_information_request_count }
          assert:
            - "InformationRequest.${ir_id}.status == FULFILLED after RECEIVED -> ACKNOWLEDGED -> IN_PROGRESS -> OBJECTED -> IN_PROGRESS -> FULFILLED"
            - "InformationRequest.${ir_id}.objection_basis == Confidential trade secret (retained for audit)"
            - "open_count == 0 (create +1 then fulfill -1 conserves the union counter)"

      - name: practice_abandon_notice_sweep
        claim_type: side_effect_execution
        grounds: [state_machines.PastPractice.VERIFIED_to_NOTICE_GIVEN, state_machines.PastPractice.NOTICE_GIVEN_to_ABANDONED]
        distinguishing_aspect: "NOTICE_GIVEN schedules abandonment at clock + 30 days; the sweep flips the practice to ABANDONED exactly at abandon_effective_date (>= boundary, inclusive)."
        test_recipe:
          setup: ["union U; practice PP VERIFIED (occurrence_count 8, last_observed 2025-05-01, default clock 2026-05-01)"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union CL", union_code: "UCL-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/past-practices"
              payload: { union_id: "${u_id}", title: "Premium", description: "December premium", first_observed_date: "2023-05-01T00:00:00Z", last_observed_date: "2025-05-01T00:00:00Z", occurrence_count: 8 }
              as: LRManager
              as_user_id: "mgr-1"
              captures: { pp_id: $.data.id }
            - call: "POST /labor-relations/past-practices/${pp_id}/state"
              payload: { to_status: "DOCUMENTED" }
              as: LRManager
              as_user_id: "mgr-1"
            - call: "POST /labor-relations/past-practices/${pp_id}/state"
              payload: { to_status: "VERIFIED" }
              as: LegalCounsel
              as_user_id: "lc-1"
          trigger:
            - call: "POST /labor-relations/past-practices/${pp_id}/state"
              payload: { to_status: "NOTICE_GIVEN" }
              as: LRManager
              as_user_id: "mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-31T00:00:00Z" }
              as: LRAdmin
          assert:
            - "PastPractice.${pp_id}.abandon_effective_date == 2026-05-31T00:00:00Z (notice at default clock 2026-05-01 + 30 days)"
            - "PastPractice.${pp_id}.status == ABANDONED at clock == abandon_effective_date (inclusive boundary)"

      - name: session_no_show_sweep_boundary
        claim_type: side_effect_execution
        grounds: [state_machines.BargainingSession.SCHEDULED_to_NO_SHOW]
        distinguishing_aspect: "The no-show sweep uses a strict clock > end_at test: at clock == end_at the session stays SCHEDULED; one second later it becomes NO_SHOW."
        test_recipe:
          setup: ["union U; DRAFT agreement A; session S SCHEDULED (2026-06-01 10:00-11:00)"]
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union CM", union_code: "UCM-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA CM", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/sessions"
              payload: { agreement_id: "${a_id}", mediator_id: "med-d", lead_negotiator_id: "ln-d", location: "Room 1", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T11:00:00Z" }
              as: LRAdmin
            - call: "GET /labor-relations/sessions/${s_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-1"
              captures: { at_end: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T11:00:01Z" }
              as: LRAdmin
          assert:
            - "at_end == SCHEDULED (clock == end_at is not past)"
            - "BargainingSession.${s_id}.status == NO_SHOW one second later"

