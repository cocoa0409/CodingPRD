      - name: headnote_retraction_survives_order_reversal
        claim_type: compensation
        grounds: [state_machines.Headnote.PUBLISHED_to_RETRACTED, state_machines.PrimaryDocument.SEALED_to_PUBLIC]
        distinguishing_aspect: "The removal reverse path compensates references and citator signal but NOT headnotes: a headnote retracted by the apply cascade stays RETRACTED after reversal (asymmetric compensation is pinned in the state machine)."
        test_recipe:
          setup:
            - "published document with a PUBLISHED headnote; SEAL order applied then reversed"
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "OH", document_type: CASE, title: "Asym v. Retract", raw_citation_string: "50 N.E.3d 9", decision_date: "2026-01-01"}
              as: ContentIngester
              captures: {doc_id: $.data.id}
            - {call: "POST /legal-research/documents/${doc_id}/publish", payload: {references: []}, as: ContentIngester}
            - call: "POST /legal-research/documents/${doc_id}/headnotes"
