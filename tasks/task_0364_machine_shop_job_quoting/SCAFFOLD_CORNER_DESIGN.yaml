# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Machine Shop / Job Shop Quoting & Production
# Breadth probe across the claim-extraction-guide's nine sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_rfq_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.RFQ, endpoints]
        distinguishing_aspect: "POST /rfqs with required fields returns 201; status defaults to DRAFT, part_line_count to 0, incoterm to EXW, version to 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rfqs"
              payload: { customer_name: "Acme", customer_id: "C-1", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id, st: $.data.status, plc: $.data.part_line_count, inc: $.data.incoterm, v: $.data.version }
          assert:
            - "RFQ.${rfq_id}.status == DRAFT"
            - "RFQ.${rfq_id}.part_line_count == 0"
            - "RFQ.${rfq_id}.incoterm == EXW"
            - "RFQ.${rfq_id}.version == 1"

      - name: get_rfq_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.RFQ, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /rfqs/{id} with a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /rfqs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_part_line_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.PartLine, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /rfqs/{id}/part-lines without material_spec (a required input field) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A DRAFT RFQ exists."]
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "Acme", customer_id: "C-2", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
          trigger:
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-1", drawing_rev: "A", quantity: 5 }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_part_line_invalid_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.PartLine.fields.material_spec, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST part-line with material_spec='COPPER' (not in AL_6061/SS_304/TI_6AL4V/BRASS_360) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A DRAFT RFQ exists."]
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "Acme", customer_id: "C-3", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
          trigger:
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-1", drawing_rev: "A", material_spec: "COPPER", quantity: 5, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_part_line_quantity_zero_rejected
        claim_type: Type Constraints
        grounds: [entities.PartLine.fields.quantity, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST part-line with quantity=0 violates the >=1 numeric constraint and returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A DRAFT RFQ exists."]
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "Acme", customer_id: "C-4", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
          trigger:
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-1", drawing_rev: "A", material_spec: "AL_6061", quantity: 0, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: part_line_default_tolerance_class_standard
        claim_type: Defaults
        grounds: [entities.PartLine.fields.tolerance_class]
        distinguishing_aspect: "Omitting tolerance_class on part-line create applies default STANDARD."
        test_recipe:
          setup: ["A DRAFT RFQ exists."]
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "Acme", customer_id: "C-5", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
          trigger:
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-1", drawing_rev: "A", material_spec: "AL_6061", quantity: 5 }
              as: ShopAdmin
              captures: { tc: $.data.tolerance_class }
          assert:
            - "PartLine.tolerance_class == STANDARD"

      - name: rfq_part_line_count_derived_field_recomputes
        claim_type: Computed Fields
        grounds: [entities.RFQ.fields.part_line_count]
        distinguishing_aspect: "After adding two PartLines, RFQ.part_line_count == 2 (derived-field reconciliation on create)."
        test_recipe:
          setup: ["A DRAFT RFQ exists."]
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "Acme", customer_id: "C-6", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-1", drawing_rev: "A", material_spec: "AL_6061", quantity: 5, tolerance_class: "STANDARD" }
              as: ShopAdmin
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-2", drawing_rev: "A", material_spec: "SS_304", quantity: 3, tolerance_class: "STANDARD" }
              as: ShopAdmin
          trigger:
            - call: "GET /rfqs/${rfq_id}"
              payload: {}
              as: ShopAdmin
              captures: { plc: $.data.part_line_count }
          assert:
            - "RFQ.${rfq_id}.part_line_count == 2"

      - name: inspection_station_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.InspectionStation]
        distinguishing_aspect: "InspectionStation has common_fields:false — created with id + created_at only, no version field, and no update endpoint exists."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /inspection-stations"
              payload: { name: "CMM-1", supports_mode: "FAI", buffer_min: 20 }
              as: Inspector
              captures: { st_id: $.data.id, nm: $.data.name, buf: $.data.buffer_min }
          assert:
            - "InspectionStation.${st_id}.name == 'CMM-1'"
            - "InspectionStation.${st_id}.buffer_min == 20"

      - name: list_rfqs_pagination_envelope
        claim_type: Listing
        grounds: [entities.RFQ, endpoints]
        distinguishing_aspect: "GET /rfqs returns an array response_type with pagination fields total_count and has_more present."
        test_recipe:
          setup: ["Two RFQs exist."]
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "A", customer_id: "C-7a", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /rfqs"
              payload: { customer_name: "B", customer_id: "C-7b", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
          trigger:
            - call: "GET /rfqs"
              payload: { limit: 1, offset: 0 }
              as: ShopAdmin
          assert:
            - "response_type == array"
            - "meta and pagination fields total_count, has_more present; has_more == true with limit 1 and 2 RFQs"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_rfq_with_zero_part_lines_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.RFQ.DRAFT_to_SUBMITTED, "errors[ERR_RFQ_NO_PART_LINES]"]
        distinguishing_aspect: "Submitting a DRAFT RFQ that has no PartLine fails ERR_RFQ_NO_PART_LINES (409); status stays DRAFT."
        test_recipe:
          setup: ["A DRAFT RFQ with zero part lines."]
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "Empty", customer_id: "C-8", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
          trigger:
            - call: "POST /rfqs/${rfq_id}/submit"
              payload: {}
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_RFQ_NO_PART_LINES"

      - name: price_quote_without_routing_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Quote.DRAFT_to_PRICED, "errors[ERR_QUOTE_NO_ROUTING]"]
        distinguishing_aspect: "Pricing a DRAFT Quote with zero RoutingOps fails ERR_QUOTE_NO_ROUTING (409)."
        test_recipe:
          setup: ["A SUBMITTED RFQ with a PartLine and a DRAFT Quote that has no routing ops."]
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "NoRt", customer_id: "C-9", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-1", drawing_rev: "A", material_spec: "AL_6061", quantity: 3, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/submit"
              payload: {}
              as: ShopAdmin
            - call: "POST /quotes"
              payload: { rfq_id: "${rfq_id}", part_line_id: "${pl_id}", material_unit_cost_cents: 800, scrap_allowance_pct: 0 }
              as: Estimator
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /quotes/${q_id}/price"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_QUOTE_NO_ROUTING"

      - name: approve_quote_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Quote.PRICED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a Quote still in DRAFT (not PRICED) fails ERR_INVALID_STATE (409) before any OCC check."
        test_recipe:
          setup: ["A SUBMITTED RFQ with a DRAFT Quote that has a routing op but has not been priced."]
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "DApp", customer_id: "C-10", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-1", drawing_rev: "A", material_spec: "AL_6061", quantity: 3, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/submit"
              payload: {}
              as: ShopAdmin
            - call: "POST /quotes"
              payload: { rfq_id: "${rfq_id}", part_line_id: "${pl_id}", material_unit_cost_cents: 800, scrap_allowance_pct: 0 }
              as: Estimator
              captures: { q_id: $.data.id, q_v: $.data.version }
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 1, machine_class: "MILL_3AX", estimated_cycle_min: 4.0, setup_fee_cents: 1000 }
              as: Estimator
          trigger:
            - call: "POST /quotes/${q_id}/approve"
              payload: { expected_quote_version: "${q_v}" }
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: pay_invoice_twice_second_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Invoice.ISSUED_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Paying an already-PAID Invoice a second time fails ERR_INVALID_STATE (409); no double side effect."
        test_recipe:
          setup: ["A COMPLETED+SHIPPED WO with a SHIPPED shipment, an ISSUED invoice, then paid once."]
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "Pay2", customer_id: "C-11", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-1", drawing_rev: "A", material_spec: "AL_6061", quantity: 10, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/submit"
              payload: {}
              as: ShopAdmin
            - call: "POST /quotes"
              payload: { rfq_id: "${rfq_id}", part_line_id: "${pl_id}", material_unit_cost_cents: 1500, scrap_allowance_pct: 5 }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 1, machine_class: "MILL_3AX", estimated_cycle_min: 12.5, setup_fee_cents: 8000 }
              as: Estimator
              captures: { op1_id: $.data.id }
            - call: "POST /quotes/${q_id}/price"
              payload: {}
              as: Estimator
              captures: { q_v: $.data.version }
            - call: "POST /quotes/${q_id}/approve"
              payload: { expected_quote_version: "${q_v}" }
              as: Estimator
            - call: "POST /material-lots"
              payload: { material_spec: "AL_6061", heat_number: "H-Pay", qty_received: 10, unit_cost_cents: 1500, received_at: "2026-06-01T00:00:00Z" }
              as: MaterialController
              captures: { lot_id: $.data.id }
            - call: "POST /work-orders"
              payload: { quote_id: "${q_id}", part_line_id: "${pl_id}", qty_ordered: 10, qty_started: 10 }
              as: ShopAdmin
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/allocate-material"
              payload: {}
              as: MaterialController
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/release"
              payload: { expected_work_order_version: "${wo_v}" }
              as: ShopAdmin
            - call: "POST /machine-slots"
              payload: { machine_class: "MILL_3AX", machine_code: "VF2-Pay", routing_op_id: "${op1_id}", start_min: 0, end_min: 150 }
              as: Scheduler
            - call: "POST /inspection-stations"
              payload: { name: "CMM-Pay", supports_mode: "ALL", buffer_min: 15 }
              as: Inspector
              captures: { st_id: $.data.id }
            - call: "POST /inspections"
              payload: { work_order_id: "${wo_id}", inspection_station_id: "${st_id}", mode: "FINAL", window_start_min: 200, window_end_min: 260 }
              as: Inspector
              captures: { insp_id: $.data.id }
            - call: "POST /inspections/${insp_id}/disposition"
              payload: { qty_inspected: 10, qty_accepted: 10, qty_rework: 0, qty_scrap: 0 }
              as: Inspector
            - call: "POST /shipments"
              payload: { work_order_id: "${wo_id}", qty_shipped: 10, promised_date: "2026-07-01T00:00:00Z", actual_ship_date: "2026-06-30T00:00:00Z" }
              as: ShopAdmin
              captures: { ship_id: $.data.id }
            - call: "POST /invoices"
              payload: { shipment_id: "${ship_id}" }
              as: ShopAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: ShopAdmin
          trigger:
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: cancel_terminal_rfq_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.RFQ.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED RFQ fails ERR_INVALID_STATE (409) — terminal states accept no transitions."
        test_recipe:
          setup: ["A CANCELLED RFQ."]
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "Term", customer_id: "C-12", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/cancel"
              payload: {}
              as: ShopAdmin
          trigger:
            - call: "POST /rfqs/${rfq_id}/cancel"
              payload: {}
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: cancel_submitted_rfq_with_approved_quote_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.RFQ.SUBMITTED_to_CANCELLED, "errors[ERR_RFQ_HAS_APPROVED_QUOTE]"]
        distinguishing_aspect: "Cancelling a SUBMITTED RFQ that already has an APPROVED Quote fails ERR_RFQ_HAS_APPROVED_QUOTE (409)."
        test_recipe:
          setup: ["A SUBMITTED RFQ whose single PartLine has an APPROVED Quote."]
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "AppQ", customer_id: "C-13", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-1", drawing_rev: "A", material_spec: "AL_6061", quantity: 3, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/submit"
              payload: {}
              as: ShopAdmin
            - call: "POST /quotes"
              payload: { rfq_id: "${rfq_id}", part_line_id: "${pl_id}", material_unit_cost_cents: 800, scrap_allowance_pct: 0 }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 1, machine_class: "MILL_3AX", estimated_cycle_min: 4.0, setup_fee_cents: 1000 }
              as: Estimator
            - call: "POST /quotes/${q_id}/price"
              payload: {}
              as: Estimator
              captures: { q_v: $.data.version }
            - call: "POST /quotes/${q_id}/approve"
              payload: { expected_quote_version: "${q_v}" }
              as: Estimator
          trigger:
            - call: "POST /rfqs/${rfq_id}/cancel"
              payload: {}
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_RFQ_HAS_APPROVED_QUOTE"

      - name: reopen_quote_on_non_submitted_rfq_rejected
        claim_type: guarded transitions
        grounds: [state_machines.Quote.REJECTED_to_DRAFT, "errors[ERR_RFQ_NOT_SUBMITTED]"]
        distinguishing_aspect: "Reopening a REJECTED Quote whose RFQ is CANCELLED fails ERR_RFQ_NOT_SUBMITTED (409) — cross-entity guard."
        test_recipe:
          setup: ["A REJECTED Quote whose RFQ was subsequently cancelled (the cancel from SUBMITTED rejects the quote, then RFQ is CANCELLED)."]
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "Reopen", customer_id: "C-14", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-1", drawing_rev: "A", material_spec: "AL_6061", quantity: 3, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/submit"
              payload: {}
              as: ShopAdmin
            - call: "POST /quotes"
              payload: { rfq_id: "${rfq_id}", part_line_id: "${pl_id}", material_unit_cost_cents: 800, scrap_allowance_pct: 0 }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 1, machine_class: "MILL_3AX", estimated_cycle_min: 4.0, setup_fee_cents: 1000 }
              as: Estimator
            - call: "POST /quotes/${q_id}/price"
              payload: {}
              as: Estimator
            - call: "POST /rfqs/${rfq_id}/cancel"
              payload: {}
              as: ShopAdmin
          trigger:
            - call: "POST /quotes/${q_id}/reopen"
              payload: {}
              as: Estimator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_RFQ_NOT_SUBMITTED"

      - name: rfq_close_blocked_when_wo_not_shipped
        claim_type: Precondition Enforcement
        grounds: [state_machines.RFQ.QUOTED_to_CLOSED, state_machines.WorkOrder]
        distinguishing_aspect: "Closing a QUOTED RFQ whose WorkOrder is still PLANNED fails ERR_INVALID_STATE (409) — the RFQ close precondition requires all derived WOs in SHIPPED/CLOSED."
        test_recipe:
          setup: ["An RFQ in QUOTED (its single part line has an APPROVED quote), with a PLANNED WorkOrder derived from that quote."]
          setup_api_calls:
            - call: "POST /rfqs"
              payload: { customer_name: "CloseB", customer_id: "C-15", requested_due_date: "2026-09-01T00:00:00Z" }
              as: ShopAdmin
              captures: { rfq_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/part-lines"
              payload: { part_number: "P-1", drawing_rev: "A", material_spec: "AL_6061", quantity: 3, tolerance_class: "STANDARD" }
              as: ShopAdmin
              captures: { pl_id: $.data.id }
            - call: "POST /rfqs/${rfq_id}/submit"
              payload: {}
              as: ShopAdmin
            - call: "POST /quotes"
              payload: { rfq_id: "${rfq_id}", part_line_id: "${pl_id}", material_unit_cost_cents: 800, scrap_allowance_pct: 0 }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /quotes/${q_id}/routing-ops"
              payload: { seq: 1, machine_class: "MILL_3AX", estimated_cycle_min: 4.0, setup_fee_cents: 1000 }
              as: Estimator
            - call: "POST /quotes/${q_id}/price"
