        claim_type: Standard CRUD
        grounds: ["entities.FeedLog.fields.cohort_id", "endpoints"]
        distinguishing_aspect: "GET /cohorts/{id}/feed-logs returns the FeedLog[] created via POST /cohorts/{id}/feed-logs (reverse-reachability of FeedLog.cohort_id)."
        test_recipe:
          setup: ["Cohort C1 with one feed log."]
