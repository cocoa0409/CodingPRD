            - { call: "POST /air-ambulance/patients", payload: { full_name: "Amy Acute", date_of_birth: "1975-11-02", weight_kg: 65 }, as: Dispatcher, captures: { pat_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests", payload: { patient_id: "${pat_id}", transport_class: "EMERGENCY_SCENE", origin_facility: "Mile 42 I-10", destination_facility: "County General", reported_cardio: 8, reported_resp: 6, reported_neuro: 5, reported_interventions: 3, onset_iso: "2026-07-31T23:00:00Z" }, as: Dispatcher, captures: { req_id: "$.data.id" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/triage", payload: { verified_cardio: 8, verified_resp: 6, verified_neuro: 5, verified_interventions: 3 }, as: MedicalDirector }
          trigger:
            - { call: "POST /air-ambulance/mission-requests/${req_id}/request-info", payload: { info_note: "Need updated vitals trend" }, as: MedicalDirector, captures: { s1: "$.data.status" } }
            - { call: "POST /air-ambulance/mission-requests/${req_id}/provide-info", payload: { updated_cardio: 9, updated_resp: 7, updated_neuro: 5, updated_interventions: 3, info_note: "Worsening respiratory status" }, as: Dispatcher, captures: { s2: "$.data.status" } }
          assert:
            - "s1 == PENDING_INFO (loop state reached from TRIAGED)"
            - "s2 == TRIAGED (cycle closed back)"
            - "MissionRequest.${req_id}.acceptance_acuity_score == 8.4 (9*.25+7*.35+5*.25+3*.15 = 6.4, + 2.0 bonus) and acuity_tier == CCT"

      - name: invoice_parallel_claim_and_member_dimensions
        grounds:
          - state_machines.Invoice.DRAFT_to_FINALIZED
          - state_machines.Invoice.SUBMITTED_to_PAID
          - state_machines.Invoice.MEMBER_PROTECTED_to_WRITEOFF_POSTED
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity (different non-linear shape
          from mission_request_info_cycle's cycle): claim_status advances
          FINALIZED -> SUBMITTED -> PAID while member_adjustment_status stays
          pinned at MEMBER_PROTECTED, and only the member-writeoff action
