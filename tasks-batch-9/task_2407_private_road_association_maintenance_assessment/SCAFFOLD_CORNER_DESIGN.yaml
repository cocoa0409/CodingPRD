        grounds:
          - concurrency_rules.bid-submit-stale-project
          - validations[priority=9]
          - validations[priority=22]
        distinguishing_aspect: "A bid written against the pre-award project version reports ERR_STALE_PROJECT_VERSION (412) rather than ERR_PROJECT_NOT_IN_SOLICITATION (409); resubmitting with the refreshed version then reaches the state guard, which is how the OCC check is shown to run first."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one GRADING project created by rc-1 with a single bonded bid of 500,000 from c-1, awarded by rc-2 so the project version has advanced."
          setup_api_calls:
