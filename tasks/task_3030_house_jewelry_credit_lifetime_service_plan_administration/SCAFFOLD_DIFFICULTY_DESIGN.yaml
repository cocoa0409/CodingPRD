          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store 0142 OPEN and ACTIVE in state ZZ, for which NO ServicePlanRegulation row exists. Customer Nina has a PENDING application asking for 2000000 with no registry row registered."
