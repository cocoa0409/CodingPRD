      - name: cmp_effective_tier_escalation_order_pinned
        grounds:
          - calculations.civil_money_penalty
          - state_machines.SanctionCase.NOTICE_SERVED_to_CMP_ELECTED
          - state_machines.SanctionCase.CMP_ELECTED_to_CLOSED
          - concurrency_rules[sanction-open-stale-vendor]
        distinguishing_aspect: |
          Mode (c) — pinned single-pass evaluation order that breaks an apparent
          circularity, unlike mode (a)'s step ordering and mode (b)'s rounding order:
          case_points must come from base_tier 2 (2 points) even though the escalation
          lifts effective_tier to 3; re-deriving points from the effective tier would
          give 4 points, a second escalation step and tier 4, and the penalty would
          land on 12 months / 720000 instead of 12 months / 180000.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; ACTIVE peer group PG-SMALL-C (SMALL_GROCERY, band [0, 999999])"
            - "Vendor v3 with reported_monthly_redemption_cents 120000, so avg_monthly_redemption_cents resolves to 120000 (no adjudicated claims)"
            - "One prior CLASS_C sanction case already CLOSED via civil money penalty, leaving Vendor.sanction_points == 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /peer-groups"
              payload: { code: "PG-SMALL-C", store_type: "SMALL_GROCERY", min_monthly_redemption_cents: 0, max_monthly_redemption_cents: 999999, mar_method: "LOWEST_HALF_AVG", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.0 }
              as: VendorUnitSupervisor
              captures: { pg_c: $.data.id }
            - call: "POST /vendors"
              payload: { store_name: "Hotel Corner Store", store_type: "SMALL_GROCERY", reported_monthly_redemption_cents: 120000 }
              as: VendorUnitAnalyst
              captures: { v3: $.data.id }
            - call: "GET /vendors/${v3}"
              payload: {}
              as: ComplianceInvestigator
              captures: { v3_v0: $.data.version }
            - call: "POST /sanction-cases"
              payload: { vendor_id: "${v3}", violation_code: "CLASS_C", narrative: "First stocking violation confirmed on review", expected_vendor_version: "${v3_v0}" }
              as: ComplianceInvestigator
              as_user_id: "inv-001"
              captures: { case1: $.data.id }
            - call: "POST /sanction-cases/${case1}/serve-notice"
              payload: {}
              as: ComplianceInvestigator
              as_user_id: "inv-001"
            - call: "POST /sanction-cases/${case1}/elect-cmp"
              payload: {}
              as: VendorOperator
              as_user_id: "${v3}"
            - call: "POST /sanction-cases/${case1}/close"
              payload: { cmp_payment_cents: 36000 }
              as: VendorUnitSupervisor
              as_user_id: "sup-001"
            - call: "GET /vendors/${v3}"
              payload: {}
              as: ComplianceInvestigator
              captures: { v3_v1: $.data.version }
          trigger:
            - call: "POST /sanction-cases"
              payload: { vendor_id: "${v3}", violation_code: "CLASS_C", narrative: "Second stocking violation within the cycle", expected_vendor_version: "${v3_v1}" }
              as: ComplianceInvestigator
              as_user_id: "inv-002"
              captures: { case2: $.data.id }
          assert:
            - "SanctionCase.${case1}.base_tier == 2, case_points == 2, cumulative_points_at_open == 0, effective_tier == 2, disqualification_months == 6, cmp_amount_cents == 36000 (120000 * 0.10 * 3)"
            - "SanctionCase.${case1}.status == CLOSED, resolution == CMP, cmp_paid_cents == 36000; Vendor.${v3}.sanction_points == 2"
            - "SanctionCase.${case2}.cumulative_points_at_open == 2 and case_points == 2 (from base_tier, not from effective_tier)"
            - "SanctionCase.${case2}.base_tier == 2 and effective_tier == 3 (2 + 2 == 4 clears the first escalation threshold of 4 but not the second of 8)"
            - "SanctionCase.${case2}.disqualification_months == 12 and cmp_amount_cents == 180000 (120000 * 0.25 * 6)"
            - "SanctionCase.${case2}.cmp_amount_cents != 720000 (the value produced by iterating points from the effective tier) and != 5625000 (the cap does not bind here)"
            - "Vendor.${v3}.sanction_points is still 2 immediately after the open — points are added only at CLOSED or at disqualification"

