# =============================================================================
# task_2202 — Recycled Paper Mill Operations (seed tables §1.0–§1.7)
# =============================================================================

scenario: |
  2202. Recycled Paper Mill Operations (recycled containerboard and tissue mill): recovered fiber
  procurement by grade with contamination limits and pricing indexed to published markets, pulping,
  screening and cleaning with reject handling and contaminant removal, deinking and bleaching for
  grades requiring brightness with chemical usage optimization, paper machine operation with basis
  weight, moisture and strength property control, grade change scheduling with transition waste and
  customer order sequencing, converting or roll finishing with slitting, winding and wrapping to
  customer specifications, water treatment, effluent permitting and sludge disposal, energy
  management including cogeneration and steam balance across the mill

domain_name: recycled-paper-mill-operations
api_prefix: "/"   # flat multi-collection surface: every collection hangs off the root

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  # PaperMachine → ProductionRun → RollSet is a strict spine; FiberGrade is self-referential
  # (downgrade target); RollSet↔CustomerOrder and PulpBatch↔FiberInventoryLot are cross-aggregate
  # associations; EffluentPermit posture cuts across the whole mill.

  state_machine_shape: parallel
  # ProductionRun carries two independent axes (run_status × quality_status); PulpBatch and RollSet
  # carry rework cycles; FiberReceipt is a fork-join with divergent side-effect sets per branch;
  # EffluentPermit.compliance_posture is a derived posture that gates child operations.

  relationship_patterns:
    - one_to_many        # PaperMachine → ProductionRun → RollSet; FiberPurchaseOrder → FiberReceipt
    - many_to_many       # PulpBatch ↔ FiberInventoryLot via furnish_lines; RollSet ↔ CustomerOrder
    - self_referential   # FiberGrade.downgrade_target_grade_code -> FiberGrade.grade_code
    - cross_aggregate    # ProductionRun consumes PulpBatch; SludgeManifest consumes RejectStream
    - polymorphic        # RejectStream.source_ref_id references PulpBatch or ProductionRun

  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- parties ---
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer legal name", constraints: "1..120 chars" }
      - { name: allocation_priority_tier, type: enum, source: input, description: "P1 | P2 | P3 — lower number wins roll allocation ranking", default: "P3" }
      - { name: max_roll_diameter_mm, type: integer, source: input, description: "Maximum finished roll diameter this customer accepts", constraints: "800..1800" }
      - { name: max_roll_width_mm, type: integer, source: input, description: "Maximum slit width this customer accepts", constraints: "400..2800" }
      - { name: wrap_spec, type: enum, source: input, description: "KRAFT_ONLY | POLY_COATED | STRETCH_HOOD", default: "KRAFT_ONLY" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — SUSPENDED customers cannot submit orders", default: "ACTIVE" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Recovered-fiber supplier name", constraints: "1..120 chars" }
      - { name: freight_per_ton, type: number, source: input, description: "Contracted inbound freight in USD per delivered ton", constraints: ">= 0, 2dp" }
      - { name: contamination_strike_count, type: integer, source: computed, description: "Count of FiberReceipt rows for this supplier with status IN {DOWNGRADED, REJECTED} AND dispositioned_by_user_id != null", default: 0 }
      - { name: qualification_status, type: enum, source: computed, description: "QUALIFIED | PROBATION | SUSPENDED — derived by calculations.supplier_qualification_posture from contamination_strike_count", default: "QUALIFIED" }
      - { name: probation_entered_at, type: datetime, source: system, description: "UTC instant qualification_status last became PROBATION; null while QUALIFIED" }

  # ------------------------------------------------------ fiber procurement ---
  - name: FiberGrade
    parent: null
    common_fields: false
    fields:
      - { name: grade_code, type: string, source: input, description: "Business key, e.g. OCC_11 | DLK_37 | SOP_37 | ONP_58", constraints: "unique, ^[A-Z]{2,4}_[0-9]{2}$" }
      - { name: index_symbol, type: enum, source: input, description: "PPI_OCC | PPI_DLK | PPI_SOP | PPI_ONP — published market symbol used for pricing" }
      - { name: max_contamination_pct, type: number, source: input, description: "Outthrow+prohibitive limit; receipts above this are not ACCEPTED at this grade", constraints: "0..25, 2dp" }
      - { name: max_moisture_pct, type: number, source: input, description: "Moisture ceiling before weight deduction applies", constraints: "0..20, 2dp" }
      - { name: nominal_yield_pct, type: number, source: input, description: "Book yield used by the provisional pulp-yield variant", constraints: "40..95, 2dp" }
      - { name: deink_required, type: boolean, source: input, description: "True when pulp from this grade must pass a DeinkRun before APPROVED" }
      - { name: downgrade_target_grade_code, type: string, source: input, description: "FK -> FiberGrade.grade_code; self-referential fallback grade a rejected-at-grade receipt may be accepted as; null means no fallback" }
      - { name: rank_order, type: integer, source: input, description: "Deterministic ordering key for grade cascades and furnish ranking; unique", constraints: "1..99, unique" }

  - name: MarketIndexQuote
    parent: null
    common_fields: false
    fields:
      - { name: index_symbol, type: enum, source: input, description: "PPI_OCC | PPI_DLK | PPI_SOP | PPI_ONP" }
      - { name: effective_month, type: string, source: input, description: "Publication month in YYYY-MM; unique per index_symbol", constraints: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
      - { name: published_price_per_ton, type: number, source: input, description: "Published USD/ton for the symbol in that month", constraints: "> 0, 2dp" }
      - { name: superseded, type: boolean, source: system, description: "True when a later quote for the same (index_symbol, effective_month) replaced this row", default: false }

  - name: FiberPurchaseOrder
    parent: Supplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id" }
      - { name: fiber_grade_code, type: string, source: input, description: "FK -> FiberGrade.grade_code; contracted grade" }
      - { name: contracted_tons, type: number, source: input, description: "Contracted delivered tons", constraints: "> 0, <= 5000, 2dp" }
      - { name: index_basis, type: enum, source: input, description: "PRIOR_MONTH | CURRENT_MONTH — which MarketIndexQuote.effective_month the price is drawn from relative to priced_for_month" }
      - { name: priced_for_month, type: string, source: input, description: "YYYY-MM the pricing run is anchored on", constraints: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
      - { name: negotiated_delta_per_ton, type: number, source: input, description: "Signed USD/ton adjustment layered on the index price", constraints: "-80..80, 2dp" }
      - { name: quoted_unit_price_per_ton, type: number, source: computed, description: "Output of calculations.indexed_fiber_unit_price; null until PRICED" }
      - { name: fuel_surcharge_per_ton, type: number, source: computed, description: "Output of calculations.indexed_fiber_unit_price step 4; null until PRICED" }
      - { name: extended_contract_value, type: number, source: computed, description: "Output of calculations.indexed_fiber_unit_price step 5; null until PRICED" }
      - { name: index_quote_month_used, type: string, source: computed, description: "The MarketIndexQuote.effective_month actually resolved at PRICED time" }
      - { name: pricing_revision_count, type: integer, source: system, description: "Increments on every PRICED -> DRAFT reprice loop", default: 0 }
      - { name: received_net_tons, type: number, source: computed, description: "Sum of FiberReceipt.net_tons for this PO with status IN {ACCEPTED, DOWNGRADED}", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | PRICED | CONFIRMED | PARTIALLY_RECEIVED | CLOSED | CANCELLED", default: "DRAFT" }

  - name: FiberReceipt
    parent: FiberPurchaseOrder
    common_fields: true
    fields:
      - { name: purchase_order_id, type: string, source: input, description: "FK -> FiberPurchaseOrder.id" }
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; denormalized from the parent purchase order at creation" }
      - { name: truck_reference, type: string, source: input, description: "Inbound truck/rail reference", constraints: "1..40 chars" }
      - { name: sublots, type: array, source: input, description: "Array of objects { sublot_no:int, gross_tons:number(3dp), tare_tons:number(3dp), moisture_pct:number(2dp), contamination_pct:number(2dp) }; 1..12 entries, sublot_no unique ascending" }
      - { name: declared_grade_code, type: string, source: system, description: "FK -> FiberGrade.grade_code; copied from the parent purchase order at creation" }
      - { name: net_tons, type: number, source: computed, description: "Output of calculations.receipt_net_tons (per-sublot rounding order pinned)" }
      - { name: weighted_contamination_pct, type: number, source: computed, description: "Output of calculations.receipt_net_tons step 3; tonnage-weighted contamination across sublots" }
      - { name: weighted_moisture_pct, type: number, source: computed, description: "Output of calculations.receipt_net_tons step 2; tonnage-weighted moisture across sublots" }
      - { name: moisture_deduction_tons, type: number, source: computed, description: "Output of calculations.receipt_net_tons step 4" }
      - { name: accepted_grade_code, type: string, source: computed, description: "FK -> FiberGrade.grade_code; equals declared_grade_code when ACCEPTED, the downgrade target when DOWNGRADED, null when REJECTED" }
      - { name: sampled_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the QualityLab operator that recorded the sample; segregation-of-duties key" }
      - { name: dispositioned_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the QualityLab operator that dispositioned the receipt; must differ from sampled_by_user_id" }
      - { name: status, type: enum, source: system, description: "SAMPLED | ACCEPTED | DOWNGRADED | REJECTED", default: "SAMPLED" }

  - name: FiberInventoryLot
    parent: FiberReceipt
    common_fields: true
    fields:
      - { name: receipt_id, type: string, source: system, description: "FK -> FiberReceipt.id; created by the ACCEPTED / DOWNGRADED disposition" }
      - { name: grade_code, type: string, source: system, description: "FK -> FiberGrade.grade_code; equals FiberReceipt.accepted_grade_code" }
      - { name: contamination_pct, type: number, source: system, description: "Copied from FiberReceipt.weighted_contamination_pct; drives furnish blend contamination" }
      - { name: tons_received, type: number, source: system, description: "Copied from FiberReceipt.net_tons at lot creation; immutable" }
      - { name: tons_consumed, type: number, source: computed, description: "Sum of PulpBatch.furnish_lines[].tons_charged over PulpBatch rows with status NOT IN {CANCELLED}", default: 0 }
      - { name: tons_available, type: number, source: computed, description: "= tons_received - tons_consumed, rounded to 3dp; never negative" }
      - { name: status, type: enum, source: computed, description: "AVAILABLE | DEPLETED | QUARANTINED — DEPLETED when tons_available == 0.000; QUARANTINED set by supplier suspension cascade" }

  - name: PulpBatch
    parent: null
    common_fields: true
    fields:
      - { name: pulper_line, type: enum, source: input, description: "OCC_LINE | DIP_LINE — DIP_LINE is the only line that can run deinking" }
      - { name: target_product_code, type: string, source: input, description: "FK -> PaperGradeSpec.product_code; the paper grade this furnish is destined for" }
      - { name: furnish_lines, type: array, source: input, description: "Array of objects { inventory_lot_id:string (FK -> FiberInventoryLot.id), tons_charged:number(3dp) }; 1..6 entries, inventory_lot_id unique within the batch" }
      - { name: charged_tons, type: number, source: computed, description: "Sum of furnish_lines[].tons_charged, 3dp" }
      - { name: blend_contamination_pct, type: number, source: computed, description: "Tonnage-weighted FiberInventoryLot.contamination_pct across furnish_lines, 3dp" }
      - { name: provisional_accepted_tons, type: number, source: computed, description: "Output of calculations.pulp_yield_provisional (book-yield variant); pinned at PULPING entry" }
      - { name: measured_reject_tons, type: number, source: input, description: "Screening+cleaning reject dry tons weighed at the reject press; recorded on the CLEANED transition", constraints: ">= 0, 3dp" }
      - { name: final_accepted_tons, type: number, source: computed, description: "Output of calculations.pulp_yield_final (measured-reject variant); pinned at APPROVED" }
      - { name: yield_variance_tons, type: number, source: computed, description: "= final_accepted_tons - provisional_accepted_tons, 3dp; signed" }
      - { name: consumed_tons, type: number, source: computed, description: "Sum of ProductionRun.pulp_draw_tons for runs referencing this batch with run_status NOT IN {ABORTED}", default: 0 }
      - { name: available_tons, type: number, source: computed, description: "= final_accepted_tons - consumed_tons when status == APPROVED, else 0.000" }
      - { name: caustic_kg, type: number, source: input, description: "NaOH charge for the current deink pass; 0 when no deink pass has run", default: 0 }
      - { name: peroxide_kg, type: number, source: input, description: "H2O2 charge for the current deink pass", default: 0 }
      - { name: surfactant_kg, type: number, source: input, description: "Collector surfactant charge for the current deink pass", default: 0 }
      - { name: deink_pass_count, type: integer, source: system, description: "Number of completed deink passes; increments on each DEINK_HOLD -> DEINKING re-entry", default: 0 }
      - { name: brightness_iso, type: number, source: input, description: "Measured ISO brightness after the latest deink pass; null before any pass", constraints: "0..100, 1dp" }
      - { name: cumulative_chemical_cost, type: number, source: computed, description: "Output of calculations.deink_chemical_cost accumulated across all passes, 2dp", default: 0 }
      - { name: status, type: enum, source: system, description: "QUEUED | PULPING | SCREENED | CLEANED | DEINKING | DEINK_HOLD | APPROVED | DIVERTED | CANCELLED", default: "QUEUED" }

  - name: RejectStream
    parent: null
    common_fields: false
    fields:
      - { name: source_kind, type: enum, source: system, description: "PULP_REJECT | DEINK_SLUDGE | MACHINE_BROKE | TRANSITION_WASTE" }
      - { name: source_ref_id, type: string, source: system, description: "FK -> PulpBatch.id when source_kind IN {PULP_REJECT, DEINK_SLUDGE}; FK -> ProductionRun.id when source_kind == MACHINE_BROKE; FK -> GradeChange.id when source_kind == TRANSITION_WASTE (polymorphic, discriminated by source_kind)" }
      - { name: dry_solids_tons, type: number, source: system, description: "Dry solids tonnage entering the solids ledger, 3dp", constraints: ">= 0" }
      - { name: disposition, type: enum, source: system, description: "PENDING | MANIFESTED | REPULPED — PENDING until a SludgeManifest claims it; REPULPED for MACHINE_BROKE returned to the pulper", default: "PENDING" }
      - { name: manifest_id, type: string, source: system, description: "FK -> SludgeManifest.id; null while disposition == PENDING" }
      - { name: reversal_of_id, type: string, source: system, description: "FK -> RejectStream.id; set on the compensating negative-tonnage row emitted when a source event is voided; null otherwise" }

  # ------------------------------------------------------- machine + product ---
  - name: PaperMachine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Machine designation, e.g. PM1", constraints: "unique, 1..20 chars" }
      - { name: wire_width_mm, type: integer, source: input, description: "Trimmed deckle width; caps RollSet slit width sum", constraints: "1000..8000" }
      - { name: max_tons_per_hour, type: number, source: input, description: "Nameplate production rate", constraints: "> 0, 2dp" }
      - { name: changeover_buffer_minutes, type: integer, source: input, description: "Mandatory idle buffer that must separate two ProductionRun windows on this machine; adjacency inside the buffer is a collision", constraints: "0..240" }
      - { name: steam_tph_per_ton, type: number, source: input, description: "Steam tonnes-per-hour consumed per production ton, used by the steam balance", constraints: "> 0, 3dp" }
      - { name: current_product_code, type: string, source: system, description: "FK -> PaperGradeSpec.product_code; product of the most recently COMPLETED run on this machine; null when none" }
      - { name: status, type: enum, source: system, description: "RUNNABLE | DOWN — DOWN blocks new run scheduling and starting", default: "RUNNABLE" }

  - name: PaperGradeSpec
    parent: null
    common_fields: false
    fields:
      - { name: product_code, type: string, source: input, description: "Business key, e.g. TL_140 | MED_112 | TIS_16", constraints: "unique, ^[A-Z]{2,4}_[0-9]{2,3}$" }
      - { name: family, type: enum, source: input, description: "CONTAINERBOARD | TISSUE — family crossings cost more transition waste" }
      - { name: basis_weight_gsm, type: number, source: input, description: "Target basis weight in g/m2", constraints: "12..400, 1dp" }
      - { name: target_moisture_pct, type: number, source: input, description: "Target reel moisture", constraints: "2..12, 2dp" }
      - { name: moisture_tolerance_pct, type: number, source: input, description: "Half-width of the acceptable moisture band around target_moisture_pct", constraints: "0.1..3, 2dp" }
      - { name: min_sct_kn_m, type: number, source: input, description: "Minimum short-span compressive strength in kN/m", constraints: ">= 0, 2dp" }
      - { name: min_brightness_iso, type: number, source: input, description: "Minimum ISO brightness; null when the grade has no brightness requirement", constraints: "0..100, 1dp" }
      - { name: requires_deink_pulp, type: boolean, source: input, description: "True when only APPROVED PulpBatch rows that completed at least one deink pass may feed runs of this product" }
      - { name: rank_order, type: integer, source: input, description: "Deterministic ordering key used for grade-change sequencing and tie-breaks; unique", constraints: "1..99, unique" }

  # ------------------------------------------------- orders and machine runs ---
  - name: CustomerOrder
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: product_code, type: string, source: input, description: "FK -> PaperGradeSpec.product_code; ordered paper grade" }
      - { name: ordered_tons, type: number, source: input, description: "Ordered tonnage", constraints: "> 0, <= 2000, 2dp" }
      - { name: requested_ship_date, type: datetime, source: input, description: "Requested ship instant (UTC); drives allocation ranking" }
      - { name: roll_width_mm, type: integer, source: input, description: "Required slit width; must be <= Customer.max_roll_width_mm", constraints: "400..2800" }
      - { name: roll_diameter_mm, type: integer, source: input, description: "Required roll diameter; must be <= Customer.max_roll_diameter_mm", constraints: "800..1800" }
      - { name: wrap_spec, type: enum, source: input, description: "KRAFT_ONLY | POLY_COATED | STRETCH_HOOD; must equal Customer.wrap_spec" }
      - { name: allocated_tons, type: number, source: computed, description: "Sum of RollSet.net_tons for RollSet rows whose allocated_order_id == this order and status IN {ALLOCATED, SHIPPED}, 3dp", default: 0 }
      - { name: shipped_tons, type: number, source: computed, description: "Sum of RollSet.net_tons for RollSet rows whose allocated_order_id == this order and status == SHIPPED, 3dp", default: 0 }
      - { name: shortfall_tons, type: number, source: computed, description: "= max(0, ordered_tons - allocated_tons), 3dp; frozen at SHORT_CLOSED" }
      - { name: scheduled_run_id, type: string, source: system, description: "FK -> ProductionRun.id; the run this order was sequenced onto; null while SUBMITTED" }
      - { name: deschedule_count, type: integer, source: system, description: "Increments on every SCHEDULED -> SUBMITTED deschedule loop", default: 0 }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SCHEDULED | IN_PRODUCTION | PARTIALLY_ALLOCATED | ALLOCATED | SHIPPED | SHORT_CLOSED | CANCELLED", default: "SUBMITTED" }

  - name: ProductionRun
    parent: PaperMachine
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: system, description: "FK -> PaperMachine.id; parent machine from the path" }
      - { name: product_code, type: string, source: input, description: "FK -> PaperGradeSpec.product_code; product being made" }
      - { name: pulp_batch_id, type: string, source: input, description: "FK -> PulpBatch.id; the approved furnish this run draws from" }
      - { name: window_start, type: datetime, source: input, description: "Planned run start (UTC, inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Planned run end (UTC, inclusive) — machine occupancy is a CLOSED interval widened by PaperMachine.changeover_buffer_minutes on both sides" }
      - { name: pulp_draw_tons, type: number, source: input, description: "Furnish tonnage reserved from the pulp batch for this run", constraints: "> 0, 3dp" }
      - { name: produced_tons, type: number, source: computed, description: "Sum of RollSet.net_tons for this run over RollSet rows with status NOT IN {REWOUND}, 3dp", default: 0 }
      - { name: broke_tons, type: number, source: input, description: "Off-spec broke weighed at run completion; emitted as a MACHINE_BROKE RejectStream row", default: 0 }
      - { name: reel_readings, type: array, source: input, description: "Array of objects { reel_no:int, reel_tons:number(3dp), basis_weight_gsm:number(1dp), moisture_pct:number(2dp), sct_kn_m:number(2dp) }; 1..10 entries, reel_no unique ascending; recorded on the RUNNING -> COMPLETED transition" }
      - { name: provisional_quality_index, type: number, source: computed, description: "Output of calculations.run_quality_index_provisional (unweighted first-reel-and-last-reel variant), 2dp" }
      - { name: certified_quality_index, type: number, source: computed, description: "Output of calculations.run_quality_index_certified (tonnage-weighted all-reel variant), 2dp; null until CERTIFIED" }
      - { name: off_spec_reel_count, type: integer, source: computed, description: "Count of reel_readings entries breaching any PaperGradeSpec limit; see calculations.run_quality_index_certified step 2", default: 0 }
      - { name: started_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the MachineOperator that started the run; segregation-of-duties key" }
      - { name: certified_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the QualityLab operator that certified quality; must differ from started_by_user_id" }
      - { name: run_status, type: enum, source: system, description: "Axis 1 of 2 (independent of quality_status): SCHEDULED | RUNNING | COMPLETED | ABORTED", default: "SCHEDULED" }
      - { name: quality_status, type: enum, source: system, description: "Axis 2 of 2 (independent of run_status): PENDING | PROVISIONAL | HELD | REWORK | CERTIFIED | CONDEMNED", default: "PENDING" }

  - name: GradeChange
    parent: PaperMachine
    common_fields: true
    fields:
      - { name: machine_id, type: string, source: system, description: "FK -> PaperMachine.id; parent machine from the path" }
      - { name: from_run_id, type: string, source: input, description: "FK -> ProductionRun.id; the outgoing run on this machine" }
      - { name: to_run_id, type: string, source: input, description: "FK -> ProductionRun.id; the incoming run on this machine" }
      - { name: from_product_code, type: string, source: system, description: "FK -> PaperGradeSpec.product_code; copied from the outgoing run" }
      - { name: to_product_code, type: string, source: system, description: "FK -> PaperGradeSpec.product_code; copied from the incoming run" }
      - { name: transition_waste_tons, type: number, source: computed, description: "Output of calculations.grade_change_transition_waste, 3dp" }
      - { name: transition_minutes, type: integer, source: computed, description: "Output of calculations.grade_change_transition_waste step 5; must fit inside the gap between the two run windows" }
      - { name: status, type: enum, source: system, description: "PLANNED | EXECUTED | VOIDED", default: "PLANNED" }

  - name: RollSet
    parent: ProductionRun
    common_fields: true
    fields:
      - { name: production_run_id, type: string, source: system, description: "FK -> ProductionRun.id; parent run from the path" }
      - { name: slit_width_mm, type: integer, source: input, description: "Slit width of each roll in the set", constraints: "400..2800" }
      - { name: diameter_mm, type: integer, source: input, description: "Wound diameter of each roll in the set", constraints: "800..1800" }
      - { name: roll_count, type: integer, source: input, description: "Number of rolls in the set", constraints: "1..40" }
      - { name: net_tons, type: number, source: input, description: "Net tonnage of the whole set", constraints: "> 0, 3dp" }
      - { name: wrap_spec, type: enum, source: input, description: "KRAFT_ONLY | POLY_COATED | STRETCH_HOOD applied at wrapping" }
      - { name: allocated_order_id, type: string, source: system, description: "FK -> CustomerOrder.id; null until ALLOCATED" }
      - { name: rewind_count, type: integer, source: system, description: "Increments on each QUARANTINED -> REWOUND -> WOUND rework loop", default: 0 }
      - { name: quarantine_reason, type: enum, source: system, description: "SPEC_MISMATCH | RUN_HELD | PERMIT_EXCEEDANCE | null" }
      - { name: status, type: enum, source: system, description: "WOUND | WRAPPED | QUARANTINED | REWOUND | ALLOCATED | SHIPPED | SCRAPPED", default: "WOUND" }

  # ------------------------------------------------ environment and utilities ---
  - name: EffluentPermit
    parent: null
    common_fields: true
    fields:
      - { name: permit_number, type: string, source: input, description: "Regulatory permit identifier", constraints: "unique, 1..40 chars" }
      - { name: bod_limit_kg_per_day, type: number, source: input, description: "Rolling-average BOD load limit", constraints: "> 0, 2dp" }
      - { name: tss_limit_kg_per_day, type: number, source: input, description: "Rolling-average TSS load limit", constraints: "> 0, 2dp" }
      - { name: flow_limit_m3_per_day, type: number, source: input, description: "Single-day hydraulic flow limit", constraints: "> 0, 2dp" }
      - { name: rolling_window_days, type: integer, source: input, description: "Width of the rolling averaging window; window is the last N calendar days INCLUSIVE of the newest reading date", default: 30, constraints: "7..30" }
      - { name: rolling_bod_kg_per_day, type: number, source: computed, description: "Output of calculations.effluent_rolling_compliance step 2, 3dp" }
      - { name: rolling_tss_kg_per_day, type: number, source: computed, description: "Output of calculations.effluent_rolling_compliance step 3, 3dp" }
      - { name: exceedance_day_count, type: integer, source: computed, description: "Count of non-voided EffluentReading rows inside the window whose flow_m3 > flow_limit_m3_per_day", default: 0 }
      - { name: compliance_posture, type: enum, source: computed, description: "COMPLIANT | WATCH | EXCEEDANCE — derived posture that gates production-run starts and sludge manifest signing", default: "COMPLIANT" }
      - { name: posture_changed_at, type: datetime, source: system, description: "UTC instant compliance_posture last changed" }

  - name: EffluentReading
    parent: EffluentPermit
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> EffluentPermit.id; parent permit from the path" }
      - { name: reading_date, type: string, source: input, description: "Calendar day of the reading in YYYY-MM-DD; unique per permit among non-voided rows", constraints: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
      - { name: flow_m3, type: number, source: input, description: "Discharged flow that day", constraints: ">= 0, 2dp" }
      - { name: bod_kg, type: number, source: input, description: "BOD load that day", constraints: ">= 0, 2dp" }
      - { name: tss_kg, type: number, source: input, description: "TSS load that day", constraints: ">= 0, 2dp" }
      - { name: logged_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the EnvironmentalOfficer that logged the reading; segregation-of-duties key" }
      - { name: voided, type: boolean, source: system, description: "True when a correction voided this reading; voided rows leave the rolling window", default: false }

  - name: SludgeManifest
    parent: null
    common_fields: true
    fields:
      - { name: manifest_number, type: string, source: input, description: "Hauler manifest identifier", constraints: "unique, 1..40 chars" }
      - { name: destination, type: enum, source: input, description: "LANDFILL | LAND_APPLICATION | FUEL — LAND_APPLICATION is barred while the permit posture is EXCEEDANCE" }
      - { name: reject_stream_ids, type: array, source: input, description: "Array of RejectStream.id strings claimed by this manifest; 1..20 entries, unique" }
      - { name: total_dry_solids_tons, type: number, source: computed, description: "Sum of RejectStream.dry_solids_tons over reject_stream_ids, 3dp" }
      - { name: prepared_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the EnvironmentalOfficer that created the manifest" }
      - { name: signed_by_user_id, type: string, source: system, description: "Opaque X-User-ID of the EnvironmentalOfficer that signed the manifest; must differ from prepared_by_user_id and from every logged_by_user_id inside the signing window" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED | VOIDED", default: "DRAFT" }

  - name: SteamAllocation
    parent: null
    common_fields: true
    fields:
      - { name: consumer_kind, type: enum, source: input, description: "PAPER_MACHINE | DEINK_PLANT | EVAPORATOR" }
      - { name: consumer_ref_id, type: string, source: input, description: "FK -> PaperMachine.id when consumer_kind == PAPER_MACHINE; null for DEINK_PLANT and EVAPORATOR" }
      - { name: window_start, type: datetime, source: input, description: "Steam-header occupancy start (UTC, inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Steam-header occupancy end (UTC, EXCLUSIVE) — back-to-back allocations sharing an endpoint do NOT collide" }
      - { name: demand_tph, type: number, source: input, description: "Requested steam tonnes per hour", constraints: "> 0, <= 200, 3dp" }
      - { name: priority_rank, type: integer, source: input, description: "Waterfall priority; 1 is served first", constraints: "1..3" }
      - { name: granted_tph, type: number, source: computed, description: "Output of calculations.steam_waterfall_dispatch, 3dp" }
      - { name: curtailed_tph, type: number, source: computed, description: "= demand_tph - granted_tph, 3dp" }
      - { name: cogen_credit_usd, type: number, source: computed, description: "Output of calculations.cogen_credit, 2dp" }
      - { name: status, type: enum, source: system, description: "REQUESTED | GRANTED | CURTAILED | RELEASED", default: "REQUESTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- 1. FiberPurchaseOrder: cyclic (PRICED -> DRAFT reprice loop) -----------
  - entity: FiberPurchaseOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /fiber-purchase-orders/{id}/price"
        actor: FiberBuyer
        preconditions:
          - "status == DRAFT"
          - "Supplier.qualification_status != SUSPENDED"
          - "a MarketIndexQuote row exists with superseded == false for (FiberGrade.index_symbol of fiber_grade_code, resolved month per index_basis); resolved month = priced_for_month when index_basis == CURRENT_MONTH, else the calendar month immediately preceding priced_for_month"
        side_effects:
          - "sets quoted_unit_price_per_ton, fuel_surcharge_per_ton, extended_contract_value via calculations.indexed_fiber_unit_price"
          - "sets index_quote_month_used to the resolved month"
          - "increments FiberPurchaseOrder.version by 1"
        note: "When two non-superseded quotes exist for the same (index_symbol, effective_month) the newer one always carries superseded == false; see §1.4 priority 22."
      - from: PRICED
        to: DRAFT
        trigger: "POST /fiber-purchase-orders/{id}/withdraw-pricing"
        actor: FiberBuyer
        preconditions:
          - "status == PRICED"
          - "pricing_revision_count < 2"
        side_effects:
          - "increments pricing_revision_count by 1"
          - "clears quoted_unit_price_per_ton, fuel_surcharge_per_ton, extended_contract_value, index_quote_month_used to null"
          - "increments FiberPurchaseOrder.version by 1"
        note: "Cycle: DRAFT -> PRICED -> DRAFT. The third withdrawal attempt (pricing_revision_count == 2) is rejected with ERR_REPRICE_LIMIT_REACHED."
      - from: PRICED
        to: CONFIRMED
        trigger: "POST /fiber-purchase-orders/{id}/confirm"
        actor: Supplier
        preconditions:
          - "status == PRICED"
          - "X-User-ID == supplier_id"
          - "Supplier.qualification_status == QUALIFIED, OR (Supplier.qualification_status == PROBATION AND contracted_tons <= 500.00)"
        side_effects:
          - "increments FiberPurchaseOrder.version by 1"
      - from: CONFIRMED
        to: PARTIALLY_RECEIVED
        trigger: "system — FiberReceipt reaches ACCEPTED or DOWNGRADED and received_net_tons < contracted_tons * 0.98"
        actor: system
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "recomputes received_net_tons"
          - "increments FiberPurchaseOrder.version by 1"
      - from: PARTIALLY_RECEIVED
        to: CLOSED
        trigger: "system — FiberReceipt reaches ACCEPTED or DOWNGRADED and received_net_tons >= contracted_tons * 0.98"
        actor: system
        preconditions:
          - "status == PARTIALLY_RECEIVED"
        side_effects:
          - "recomputes received_net_tons"
          - "increments FiberPurchaseOrder.version by 1"
        note: "Boundary is inclusive: received_net_tons exactly equal to contracted_tons * 0.98 CLOSES the order."
      - from: CONFIRMED
        to: CLOSED
        trigger: "system — first FiberReceipt disposition already satisfies received_net_tons >= contracted_tons * 0.98"
        actor: system
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "recomputes received_net_tons"
          - "increments FiberPurchaseOrder.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /fiber-purchase-orders/{id}/cancel"
        actor: FiberBuyer
        preconditions:
          - "status IN {DRAFT, PRICED, CONFIRMED}"
          - "received_net_tons == 0.00 (zero-tonnage boundary; any accepted or downgraded receipt blocks cancellation)"
        side_effects:
          - "cancels every FiberReceipt of this order still in SAMPLED by setting status = REJECTED with accepted_grade_code = null (no Supplier strike is charged for this administrative rejection)"
          - "increments FiberPurchaseOrder.version by 1"

  # --- 2. FiberReceipt: fork-join, divergent side-effect sets per branch ------
  - entity: FiberReceipt
    initial_state: SAMPLED
    terminal_states: [ACCEPTED, DOWNGRADED, REJECTED]
    transitions:
      - from: SAMPLED
        to: ACCEPTED
        trigger: "POST /fiber-receipts/{id}/disposition with disposition = ACCEPT"
        actor: QualityLab
        preconditions:
          - "status == SAMPLED"
          - "X-User-ID != sampled_by_user_id (segregation of duties)"
          - "weighted_contamination_pct <= FiberGrade(declared_grade_code).max_contamination_pct"
          - "parent FiberPurchaseOrder.status IN {CONFIRMED, PARTIALLY_RECEIVED}"
        side_effects:
          - "sets accepted_grade_code = declared_grade_code and dispositioned_by_user_id = X-User-ID"
          - "creates one FiberInventoryLot with grade_code = accepted_grade_code, tons_received = net_tons, contamination_pct = weighted_contamination_pct, status = AVAILABLE"
          - "adds net_tons into FiberPurchaseOrder.received_net_tons, which drives the PO auto-transition to PARTIALLY_RECEIVED or CLOSED"
          - "Supplier.contamination_strike_count unchanged"
      - from: SAMPLED
        to: DOWNGRADED
        trigger: "POST /fiber-receipts/{id}/disposition with disposition = DOWNGRADE"
        actor: QualityLab
        preconditions:
          - "status == SAMPLED"
          - "X-User-ID != sampled_by_user_id (segregation of duties)"
          - "weighted_contamination_pct > FiberGrade(declared_grade_code).max_contamination_pct"
          - "FiberGrade(declared_grade_code).downgrade_target_grade_code != null"
          - "weighted_contamination_pct <= FiberGrade(downgrade_target_grade_code).max_contamination_pct"
        side_effects:
          - "sets accepted_grade_code = FiberGrade(declared_grade_code).downgrade_target_grade_code and dispositioned_by_user_id = X-User-ID"
          - "creates one FiberInventoryLot at the downgrade target grade with tons_received = net_tons, status = AVAILABLE"
          - "adds net_tons into FiberPurchaseOrder.received_net_tons (PO auto-transition may follow)"
          - "CASCADE hop 1: increments Supplier.contamination_strike_count by 1 and recomputes Supplier.qualification_status via calculations.supplier_qualification_posture"
          - "CASCADE hop 2 (caused by hop 1 only when qualification_status became SUSPENDED): every FiberInventoryLot whose receipt chain resolves to this supplier and whose status == AVAILABLE flips to QUARANTINED (including the lot just created)"
          - "CASCADE hop 3 (caused by hop 2): every PulpBatch with status == QUEUED holding a furnish_lines entry pointing at any lot quarantined in hop 2 flips to CANCELLED, releasing its reservation so those lots' tons_consumed drop back"
          - "CASCADE hop 4 (caused by hop 3): every ProductionRun with run_status == SCHEDULED whose pulp_batch_id is a batch cancelled in hop 3 flips run_status = ABORTED and quality_status = CONDEMNED, and its scheduled CustomerOrder returns SCHEDULED -> SUBMITTED with deschedule_count incremented"
      - from: SAMPLED
        to: REJECTED
        trigger: "POST /fiber-receipts/{id}/disposition with disposition = REJECT"
        actor: QualityLab
        preconditions:
          - "status == SAMPLED"
          - "X-User-ID != sampled_by_user_id (segregation of duties)"
          - "weighted_contamination_pct > FiberGrade(declared_grade_code).max_contamination_pct AND (FiberGrade(declared_grade_code).downgrade_target_grade_code == null OR weighted_contamination_pct > FiberGrade(downgrade_target_grade_code).max_contamination_pct), OR weighted_moisture_pct > FiberGrade(declared_grade_code).max_moisture_pct + 5.00"
        side_effects:
          - "sets accepted_grade_code = null and dispositioned_by_user_id = X-User-ID"
          - "creates NO FiberInventoryLot and leaves FiberPurchaseOrder.received_net_tons unchanged (branch differs from ACCEPTED and DOWNGRADED here)"
          - "CASCADE hop 1: increments Supplier.contamination_strike_count by 1 and recomputes Supplier.qualification_status"
          - "CASCADE hop 2/3/4: identical quarantine -> batch-cancel -> run-abort chain as the DOWNGRADED branch when the recomputed posture is SUSPENDED"

  # --- 3. PulpBatch: cyclic deink rework loop --------------------------------
  - entity: PulpBatch
    initial_state: QUEUED
    terminal_states: [APPROVED, DIVERTED, CANCELLED]
    transitions:
      - from: QUEUED
        to: PULPING
        trigger: "POST /pulp-batches/{id}/start"
        actor: MachineOperator
        preconditions:
          - "status == QUEUED"
          - "every furnish_lines[].inventory_lot_id resolves to a FiberInventoryLot with status == AVAILABLE"
          - "for every furnish line, FiberInventoryLot.tons_available >= tons_charged (inclusive: exactly equal is allowed)"
          - "blend_contamination_pct <= 3.500"
          - "pulper_line == DIP_LINE when PaperGradeSpec(target_product_code).requires_deink_pulp == true"
        side_effects:
          - "adds each furnish line's tons_charged into that FiberInventoryLot.tons_consumed and recomputes tons_available"
          - "flips any furnish lot whose recomputed tons_available == 0.000 to status = DEPLETED"
          - "sets provisional_accepted_tons via calculations.pulp_yield_provisional"
      - from: PULPING
        to: SCREENED
        trigger: "POST /pulp-batches/{id}/screen"
        actor: MachineOperator
        preconditions: ["status == PULPING"]
        side_effects: ["refreshes updated_at only"]
      - from: SCREENED
        to: CLEANED
        trigger: "POST /pulp-batches/{id}/clean with measured_reject_tons"
        actor: MachineOperator
        preconditions:
          - "status == SCREENED"
          - "measured_reject_tons <= charged_tons * 0.40"
        side_effects:
          - "stores measured_reject_tons"
          - "appends one RejectStream row with source_kind = PULP_REJECT, source_ref_id = this batch id, dry_solids_tons = measured_reject_tons, disposition = PENDING"
      - from: CLEANED
        to: APPROVED
        trigger: "POST /pulp-batches/{id}/approve"
        actor: QualityLab
        preconditions:
          - "status == CLEANED"
          - "PaperGradeSpec(target_product_code).requires_deink_pulp == false"
        side_effects:
          - "sets final_accepted_tons via calculations.pulp_yield_final and yield_variance_tons = final_accepted_tons - provisional_accepted_tons"
          - "sets available_tons = final_accepted_tons (consumed_tons is still 0.000)"
      - from: CLEANED
        to: DEINKING
        trigger: "POST /pulp-batches/{id}/deink with caustic_kg, peroxide_kg, surfactant_kg"
        actor: MachineOperator
        preconditions:
          - "status == CLEANED"
          - "pulper_line == DIP_LINE"
          - "PaperGradeSpec(target_product_code).requires_deink_pulp == true"
        side_effects:
          - "stores the three chemical charges for the pass in flight"
      - from: DEINKING
        to: APPROVED
        trigger: "POST /pulp-batches/{id}/brightness with brightness_iso — measured value >= PaperGradeSpec(target_product_code).min_brightness_iso"
        actor: QualityLab
        preconditions:
          - "status == DEINKING"
        side_effects:
          - "increments deink_pass_count by 1"
          - "adds this pass's cost into cumulative_chemical_cost via calculations.deink_chemical_cost"
          - "appends one RejectStream row with source_kind = DEINK_SLUDGE, source_ref_id = this batch id, dry_solids_tons = calculations.deink_chemical_cost step 5 sludge output, disposition = PENDING"
          - "sets final_accepted_tons via calculations.pulp_yield_final and yield_variance_tons"
      - from: DEINKING
        to: DEINK_HOLD
        trigger: "POST /pulp-batches/{id}/brightness with brightness_iso — measured value < PaperGradeSpec(target_product_code).min_brightness_iso"
        actor: QualityLab
        preconditions:
          - "status == DEINKING"
        side_effects:
          - "increments deink_pass_count by 1"
          - "adds this pass's cost into cumulative_chemical_cost via calculations.deink_chemical_cost"
          - "appends one RejectStream row with source_kind = DEINK_SLUDGE for this pass's sludge, disposition = PENDING"
      - from: DEINK_HOLD
        to: DEINKING
        trigger: "POST /pulp-batches/{id}/deink with a fresh chemical charge set"
        actor: MachineOperator
        preconditions:
          - "status == DEINK_HOLD"
          - "deink_pass_count < 3"
        side_effects:
          - "replaces caustic_kg, peroxide_kg, surfactant_kg with the new pass charges"
        note: "Cycle: DEINKING -> DEINK_HOLD -> DEINKING. The pass that would be the 4th (deink_pass_count == 3) is rejected with ERR_DEINK_PASS_LIMIT."
      - from: DEINK_HOLD
        to: DIVERTED
        trigger: "POST /pulp-batches/{id}/divert"
        actor: MillPlanner
        preconditions:
          - "status == DEINK_HOLD"
        side_effects:
          - "sets final_accepted_tons = 0.000 and available_tons = 0.000"
          - "CASCADE hop 1: every ProductionRun with pulp_batch_id == this batch and run_status == SCHEDULED flips run_status = ABORTED, quality_status = CONDEMNED"
          - "CASCADE hop 2 (caused by hop 1): each CustomerOrder whose scheduled_run_id is an aborted run returns to SUBMITTED, clears scheduled_run_id and increments deschedule_count by 1"
          - "CASCADE hop 3 (caused by hop 2): each such CustomerOrder recomputes shortfall_tons = max(0, ordered_tons - allocated_tons) and its Customer-facing status bubbles to SUBMITTED, releasing the run window on PaperMachine so the machine's occupancy interval no longer blocks new scheduling"
      - from: QUEUED
        to: CANCELLED
        trigger: "system — furnish lot quarantined by the Supplier suspension cascade (§1.2 FiberReceipt hop 3), or POST /pulp-batches/{id}/cancel"
        actor: system
        preconditions:
          - "status == QUEUED"
        side_effects:
          - "no furnish tonnage was consumed while QUEUED, so no FiberInventoryLot.tons_consumed adjustment is made"
      - from: PULPING
        to: CANCELLED
        trigger: "POST /pulp-batches/{id}/cancel"
        actor: MillPlanner
        preconditions:
          - "status == PULPING"
        side_effects:
          - "subtracts each furnish line's tons_charged back out of FiberInventoryLot.tons_consumed (compensating action for the PULPING reservation) and flips any lot that leaves DEPLETED back to AVAILABLE"

  # --- 4. ProductionRun: two independent axes (run_status x quality_status) ---
  - entity: ProductionRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /paper-machines/{machine_id}/runs/{run_id}/start"
        actor: MachineOperator
        preconditions:
          - "run_status == SCHEDULED"
          - "PaperMachine.status == RUNNABLE"
          - "the EffluentPermit with the lowest rank by permit_number (exactly one permit exists per mill) has compliance_posture IN {COMPLIANT, WATCH} — EXCEEDANCE blocks every run start"
          - "PulpBatch(pulp_batch_id).status == APPROVED and PulpBatch.available_tons >= pulp_draw_tons"
          - "PulpBatch(pulp_batch_id).deink_pass_count >= 1 when PaperGradeSpec(product_code).requires_deink_pulp == true"
          - "every GradeChange with to_run_id == this run has status == EXECUTED or no such GradeChange exists"
        side_effects:
          - "adds pulp_draw_tons into PulpBatch.consumed_tons and recomputes PulpBatch.available_tons"
          - "sets started_by_user_id = X-User-ID"
          - "each CustomerOrder with scheduled_run_id == this run moves SCHEDULED -> IN_PRODUCTION"
          - "increments PaperMachine.version by 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /paper-machines/{machine_id}/runs/{run_id}/complete with reel_readings and broke_tons"
        actor: MachineOperator
        preconditions:
          - "run_status == RUNNING"
          - "reel_readings has 1..10 entries with unique ascending reel_no"
        side_effects:
          - "stores reel_readings and broke_tons; recomputes off_spec_reel_count"
          - "sets provisional_quality_index via calculations.run_quality_index_provisional and moves quality_status PENDING -> PROVISIONAL (the only point where the two axes touch)"
          - "appends one RejectStream row with source_kind = MACHINE_BROKE, source_ref_id = this run id, dry_solids_tons = broke_tons, disposition = PENDING (skipped when broke_tons == 0.000)"
          - "sets PaperMachine.current_product_code = product_code"
          - "every GradeChange with from_run_id == this run and status == PLANNED flips to EXECUTED and appends a RejectStream row with source_kind = TRANSITION_WASTE, dry_solids_tons = transition_waste_tons"
          - "increments PaperMachine.version by 1"
      - from: RUNNING
        to: ABORTED
        trigger: "POST /paper-machines/{machine_id}/runs/{run_id}/abort"
        actor: MillPlanner
        preconditions:
          - "run_status == RUNNING"
        side_effects:
          - "subtracts pulp_draw_tons back out of PulpBatch.consumed_tons and recomputes available_tons (compensating action: total fiber tonnage is conserved)"
          - "every RollSet of this run with status IN {WOUND, WRAPPED} flips to SCRAPPED and appends a RejectStream row with source_kind = MACHINE_BROKE, dry_solids_tons = RollSet.net_tons"
          - "sets quality_status = CONDEMNED regardless of its current value"
          - "each CustomerOrder with scheduled_run_id == this run returns to SUBMITTED with deschedule_count incremented and scheduled_run_id cleared"
          - "increments PaperMachine.version by 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "system — PulpBatch DIVERTED cascade hop 1, or FiberReceipt suspension cascade hop 4"
        actor: system
        preconditions: ["run_status == SCHEDULED"]
        side_effects:
          - "sets quality_status = CONDEMNED; no PulpBatch.consumed_tons adjustment is needed because nothing was drawn while SCHEDULED"
          - "increments PaperMachine.version by 1"
      - from: PENDING
        to: PROVISIONAL
        trigger: "system — axis 2 advance fired by the RUNNING -> COMPLETED transition on axis 1"
        actor: system
        preconditions: ["quality_status == PENDING", "run_status == COMPLETED"]
        side_effects: ["sets provisional_quality_index"]
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /paper-machines/{machine_id}/runs/{run_id}/certify"
        actor: QualityLab
        preconditions:
          - "quality_status == PROVISIONAL"
          - "X-User-ID != started_by_user_id (segregation of duties)"
          - "off_spec_reel_count == 0"
          - "certified_quality_index >= 85.00"
        side_effects:
          - "sets certified_quality_index and certified_by_user_id = X-User-ID"
          - "makes every WRAPPED RollSet of this run eligible for allocation"
      - from: PROVISIONAL
        to: HELD
        trigger: "POST /paper-machines/{machine_id}/runs/{run_id}/hold"
        actor: QualityLab
        preconditions:
          - "quality_status == PROVISIONAL"
          - "off_spec_reel_count >= 1 OR certified_quality_index < 85.00"
        side_effects:
          - "sets certified_quality_index"
          - "CASCADE hop 1: every RollSet of this run with status IN {WOUND, WRAPPED, ALLOCATED} flips to QUARANTINED with quarantine_reason = RUN_HELD and allocated_order_id cleared"
          - "CASCADE hop 2 (caused by hop 1): each CustomerOrder that lost rolls in hop 1 recomputes allocated_tons and shortfall_tons"
          - "CASCADE hop 3 (caused by hop 2): each such CustomerOrder whose recomputed allocated_tons < ordered_tons and whose status was ALLOCATED falls back to PARTIALLY_ALLOCATED, and its version increments"
      - from: HELD
        to: REWORK
        trigger: "POST /paper-machines/{machine_id}/runs/{run_id}/rework"
        actor: MillPlanner
        preconditions: ["quality_status == HELD"]
        side_effects:
          - "every RollSet of this run with status == QUARANTINED flips to REWOUND with rewind_count incremented"
      - from: REWORK
        to: PROVISIONAL
        trigger: "POST /paper-machines/{machine_id}/runs/{run_id}/resubmit-quality with corrected reel_readings"
        actor: QualityLab
        preconditions:
          - "quality_status == REWORK"
          - "every RollSet of this run has status IN {WOUND, SCRAPPED} (all rewinds finished)"
        side_effects:
          - "replaces reel_readings, recomputes off_spec_reel_count and provisional_quality_index"
        note: "Cycle: PROVISIONAL -> HELD -> REWORK -> PROVISIONAL, independent of run_status which stays COMPLETED throughout."
      - from: HELD
        to: CONDEMNED
        trigger: "POST /paper-machines/{machine_id}/runs/{run_id}/condemn"
        actor: MillPlanner
        preconditions: ["quality_status == HELD"]
        side_effects:
          - "every RollSet of this run with status IN {QUARANTINED, REWOUND, WOUND, WRAPPED} flips to SCRAPPED and appends a RejectStream row with source_kind = MACHINE_BROKE, dry_solids_tons = RollSet.net_tons"
          - "recomputes produced_tons to 0.000 for this run"

  # --- 5. CustomerOrder: cyclic (SCHEDULED -> SUBMITTED deschedule loop) ------
  - entity: CustomerOrder
    initial_state: SUBMITTED
    terminal_states: [SHIPPED, SHORT_CLOSED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: SCHEDULED
        trigger: "POST /customer-orders/{id}/schedule with run_id"
        actor: MillPlanner
        preconditions:
          - "status == SUBMITTED"
          - "Customer.status == ACTIVE"
          - "ProductionRun(run_id).run_status == SCHEDULED"
          - "ProductionRun(run_id).product_code == this order's product_code"
          - "sum of ordered_tons over CustomerOrder rows already holding scheduled_run_id == run_id, plus this order's ordered_tons, <= ProductionRun.pulp_draw_tons"
        side_effects:
          - "sets scheduled_run_id = run_id"
          - "increments CustomerOrder.version by 1"
      - from: SCHEDULED
        to: SUBMITTED
        trigger: "POST /customer-orders/{id}/deschedule, or system deschedule from a run abort / batch divert cascade"
        actor: MillPlanner
        preconditions:
          - "status == SCHEDULED"
          - "deschedule_count < 3"
        side_effects:
          - "clears scheduled_run_id and increments deschedule_count by 1"
          - "increments CustomerOrder.version by 1"
        note: "Cycle: SUBMITTED -> SCHEDULED -> SUBMITTED. The fourth deschedule (deschedule_count == 3) is rejected with ERR_DESCHEDULE_LIMIT."
      - from: SCHEDULED
        to: IN_PRODUCTION
        trigger: "system — ProductionRun(scheduled_run_id) SCHEDULED -> RUNNING"
        actor: system
        preconditions: ["status == SCHEDULED"]
        side_effects: ["increments CustomerOrder.version by 1"]
      - from: IN_PRODUCTION
        to: PARTIALLY_ALLOCATED
        trigger: "system — a RollSet is allocated and recomputed allocated_tons < ordered_tons"
        actor: system
        preconditions: ["status == IN_PRODUCTION"]
        side_effects:
          - "recomputes allocated_tons and shortfall_tons"
          - "increments CustomerOrder.version by 1"
      - from: PARTIALLY_ALLOCATED
        to: ALLOCATED
        trigger: "system — a RollSet is allocated and recomputed allocated_tons >= ordered_tons"
        actor: system
        preconditions: ["status == PARTIALLY_ALLOCATED"]
        side_effects:
          - "recomputes allocated_tons and sets shortfall_tons = 0.000"
          - "increments CustomerOrder.version by 1"
        note: "Inclusive boundary: allocated_tons exactly equal to ordered_tons reaches ALLOCATED."
      - from: IN_PRODUCTION
        to: ALLOCATED
        trigger: "system — the first allocated RollSet already covers ordered_tons"
        actor: system
        preconditions: ["status == IN_PRODUCTION"]
        side_effects:
          - "recomputes allocated_tons, sets shortfall_tons = 0.000"
          - "increments CustomerOrder.version by 1"
      - from: ALLOCATED
        to: PARTIALLY_ALLOCATED
        trigger: "system — ProductionRun quality hold cascade hop 3 removed rolls from this order"
        actor: system
        preconditions: ["status == ALLOCATED"]
        side_effects:
          - "recomputes allocated_tons and shortfall_tons"
          - "increments CustomerOrder.version by 1"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /customer-orders/{id}/ship"
        actor: MillPlanner
        preconditions:
          - "status == ALLOCATED"
          - "every RollSet with allocated_order_id == this order has status == ALLOCATED"
          - "ProductionRun(scheduled_run_id).quality_status == CERTIFIED"
        side_effects:
          - "every RollSet with allocated_order_id == this order flips ALLOCATED -> SHIPPED"
          - "recomputes shipped_tons"
          - "increments CustomerOrder.version by 1"
      - from: PARTIALLY_ALLOCATED
        to: SHORT_CLOSED
        trigger: "POST /customer-orders/{id}/short-close"
        actor: MillPlanner
        preconditions:
          - "status == PARTIALLY_ALLOCATED"
          - "shortfall_tons > 0.000"
        side_effects:
          - "freezes shortfall_tons at its current value"
          - "every RollSet with allocated_order_id == this order flips ALLOCATED -> SHIPPED"
          - "increments CustomerOrder.version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /customer-orders/{id}/cancel"
        actor: Customer
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID == customer_id"
          - "allocated_tons == 0.000"
        side_effects: ["increments CustomerOrder.version by 1"]

  # --- 6. RollSet: cyclic rework (QUARANTINED -> REWOUND -> WOUND) -----------
  - entity: RollSet
    initial_state: WOUND
    terminal_states: [SHIPPED, SCRAPPED]
    transitions:
      - from: WOUND
        to: WRAPPED
        trigger: "POST /roll-sets/{id}/wrap with wrap_spec"
        actor: MachineOperator
        preconditions:
          - "status == WOUND"
          - "ProductionRun(production_run_id).run_status == COMPLETED"
          - "slit_width_mm <= PaperMachine.wire_width_mm"
        side_effects: ["stores wrap_spec"]
      - from: WRAPPED
        to: ALLOCATED
        trigger: "POST /roll-sets/{id}/allocate with order_id and expected_order_version"
        actor: MillPlanner
        preconditions:
          - "status == WRAPPED"
          - "ProductionRun(production_run_id).quality_status == CERTIFIED"
          - "CustomerOrder(order_id).status IN {IN_PRODUCTION, PARTIALLY_ALLOCATED}"
          - "CustomerOrder(order_id).product_code == ProductionRun.product_code"
          - "slit_width_mm == CustomerOrder.roll_width_mm AND diameter_mm <= CustomerOrder.roll_diameter_mm AND wrap_spec == CustomerOrder.wrap_spec"
          - "expected_order_version == CustomerOrder.version"
        side_effects:
          - "sets allocated_order_id = order_id"
          - "recomputes CustomerOrder.allocated_tons and shortfall_tons, driving the order's IN_PRODUCTION / PARTIALLY_ALLOCATED / ALLOCATED auto-transition"
          - "increments CustomerOrder.version by 1"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "system — CustomerOrder ship or short-close"
        actor: system
        preconditions: ["status == ALLOCATED"]
        side_effects: ["recomputes CustomerOrder.shipped_tons"]
      - from: WRAPPED
        to: QUARANTINED
        trigger: "POST /roll-sets/{id}/quarantine with quarantine_reason, or system from ProductionRun hold cascade hop 1"
        actor: QualityLab
        preconditions: ["status IN {WOUND, WRAPPED}"]
        side_effects: ["sets quarantine_reason"]
      - from: ALLOCATED
        to: QUARANTINED
        trigger: "system — ProductionRun PROVISIONAL -> HELD cascade hop 1"
        actor: system
        preconditions: ["status == ALLOCATED"]
        side_effects:
          - "clears allocated_order_id and sets quarantine_reason = RUN_HELD"
          - "recomputes the former CustomerOrder.allocated_tons (bubble-up to PARTIALLY_ALLOCATED)"
      - from: QUARANTINED
        to: REWOUND
        trigger: "POST /roll-sets/{id}/rewind, or system from ProductionRun HELD -> REWORK"
        actor: MachineOperator
        preconditions:
          - "status == QUARANTINED"
          - "rewind_count < 2"
        side_effects: ["increments rewind_count by 1"]
      - from: REWOUND
        to: WOUND
        trigger: "POST /roll-sets/{id}/rewind-complete with slit_width_mm, diameter_mm, roll_count, net_tons"
        actor: MachineOperator
        preconditions:
          - "status == REWOUND"
          - "net_tons <= the pre-rewind net_tons (rewinding never creates fibre)"
        side_effects:
          - "replaces slit_width_mm, diameter_mm, roll_count, net_tons; clears quarantine_reason"
          - "appends one RejectStream row with source_kind = MACHINE_BROKE, source_ref_id = production_run_id, dry_solids_tons = (pre-rewind net_tons - new net_tons) when that difference > 0.000 (solids conservation across the rewind)"
          - "recomputes ProductionRun.produced_tons"
        note: "Cycle: WOUND -> WRAPPED -> QUARANTINED -> REWOUND -> WOUND. The third rewind (rewind_count == 2) is rejected with ERR_REWIND_LIMIT."
      - from: QUARANTINED
        to: SCRAPPED
        trigger: "POST /roll-sets/{id}/scrap, or system from ProductionRun HELD -> CONDEMNED"
        actor: MillPlanner
        preconditions: ["status IN {QUARANTINED, REWOUND}"]
        side_effects:
          - "appends one RejectStream row with source_kind = MACHINE_BROKE, source_ref_id = production_run_id, dry_solids_tons = net_tons"
          - "recomputes ProductionRun.produced_tons"

  # --- 7. EffluentPermit.compliance_posture: derived posture gate ------------
  - entity: EffluentPermit
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: WATCH
        trigger: "system — recomputation after POST /effluent-permits/{id}/readings or POST /effluent-readings/{id}/void"
        actor: system
        preconditions:
          - "calculations.effluent_rolling_compliance yields posture WATCH: max(rolling_bod_kg_per_day / bod_limit_kg_per_day, rolling_tss_kg_per_day / tss_limit_kg_per_day) >= 0.90 and both ratios <= 1.00 and exceedance_day_count <= 1"
        side_effects:
          - "sets posture_changed_at to the logical clock instant"
          - "no child operations are blocked in WATCH; SludgeManifest destination LAND_APPLICATION is still permitted"
      - from: WATCH
        to: EXCEEDANCE
        trigger: "system — recomputation after a reading is logged or voided"
        actor: system
        preconditions:
          - "calculations.effluent_rolling_compliance yields posture EXCEEDANCE: either ratio > 1.00, OR exceedance_day_count >= 2"
        side_effects:
          - "sets posture_changed_at"
          - "CASCADE hop 1: every SludgeManifest with status == DRAFT and destination == LAND_APPLICATION flips to VOIDED"
          - "CASCADE hop 2 (caused by hop 1): every RejectStream row whose manifest_id points at a manifest voided in hop 1 has manifest_id cleared and disposition returned to PENDING"
          - "CASCADE hop 3 (caused by hop 2): each affected RejectStream row re-enters the unmanifested solids pool, so the mill's unmanifested_dry_solids_tons figure returned by GET /reject-streams/summary increases by exactly the voided manifests' total_dry_solids_tons"
          - "run starts are blocked while posture == EXCEEDANCE (ProductionRun SCHEDULED -> RUNNING precondition)"
      - from: COMPLIANT
        to: EXCEEDANCE
        trigger: "system — a single logged reading pushes a ratio above 1.00 without ever resting in WATCH"
        actor: system
        preconditions: ["calculations.effluent_rolling_compliance yields posture EXCEEDANCE"]
        side_effects: ["same cascade hops 1-3 as WATCH -> EXCEEDANCE"]
      - from: EXCEEDANCE
        to: WATCH
        trigger: "system — recomputation after voiding a reading or after the rolling window advances past an offending day"
        actor: system
        preconditions: ["calculations.effluent_rolling_compliance yields posture WATCH"]
        side_effects:
          - "sets posture_changed_at; voided manifests are NOT restored (the compensating action is manual re-manifesting)"
      - from: WATCH
        to: COMPLIANT
        trigger: "system — recomputation drops both ratios below 0.90 with exceedance_day_count == 0"
        actor: system
        preconditions: ["calculations.effluent_rolling_compliance yields posture COMPLIANT"]
        side_effects: ["sets posture_changed_at"]
      - from: EXCEEDANCE
        to: COMPLIANT
        trigger: "system — recomputation drops both ratios below 0.90 with exceedance_day_count == 0 in one step"
        actor: system
        preconditions: ["calculations.effluent_rolling_compliance yields posture COMPLIANT"]
        side_effects: ["sets posture_changed_at"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: roll-allocate-stale-order
    parent_entity: CustomerOrder
    write_endpoint: "POST /roll-sets/{id}/allocate"
    occ_field: "expected_order_version"
    description: |
      Allocating a RollSet to a CustomerOrder whose version has advanced since the
      client last read it is rejected. A prior allocation of a different roll set to
      the same order legitimately succeeds and moves the order's allocated_tons and
      status, so a writer still carrying the pre-allocation version holds a stale
      view of how much tonnage the order still needs.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: run-schedule-stale-machine
    parent_entity: PaperMachine
    write_endpoint: "POST /paper-machines/{id}/runs"
    occ_field: "expected_machine_version"
    description: |
      Creating a ProductionRun against a PaperMachine whose version has advanced
      since the client last read it is rejected. Run creation, starting, completing
      and aborting all bump the machine version, so a scheduler working from a stale
      machine read would be planning against an occupancy picture that no longer holds.
    error_id: ERR_STALE_MACHINE_VERSION
    http_status: 412

  - rule_id: po-reprice-stale-order
    parent_entity: FiberPurchaseOrder
    write_endpoint: "POST /fiber-purchase-orders/{id}/price"
    occ_field: "expected_purchase_order_version"
    description: |
      Pricing a FiberPurchaseOrder whose version has advanced since the client last
      read it is rejected. A withdraw-pricing call legitimately supersedes an earlier
      price and bumps the version, so a buyer re-pricing from a stale read would
      overwrite a revision it never observed.
    error_id: ERR_STALE_PURCHASE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- 1. indexed fiber pricing: circular-looking, evaluation order pinned ----
  - name: indexed_fiber_unit_price
    trigger: "FiberPurchaseOrder DRAFT -> PRICED (POST /fiber-purchase-orders/{id}/price)"
    algorithm: tiered_pricing
    formula: |
      # Step 0 — resolve the market quote (selector; no random field participates)
      symbol        = FiberGrade(fiber_grade_code).index_symbol
      target_month  = priced_for_month              if index_basis == CURRENT_MONTH
                      else calendar month immediately preceding priced_for_month
      candidates    = MarketIndexQuote rows with index_symbol == symbol
                        AND effective_month == target_month
                        AND superseded == false
      # exactly one row survives (see §1.4 priority 22); empty set -> ERR_INDEX_QUOTE_MISSING
      P             = candidates[0].published_price_per_ton
      index_quote_month_used = target_month

      # Step 1 — base price
      base_price    = round(P + negotiated_delta_per_ton, 2)            # round_half_up

      # Step 2 — PROVISIONAL extended value (freight and surcharge NOT included)
      provisional_extended = round(base_price * contracted_tons, 2)

      # Step 3 — volume discount tier keyed on provisional_extended ONLY
      volume_discount_pct = 0.000   if provisional_extended <  100000.00
                            0.015   if provisional_extended >= 100000.00 and provisional_extended < 250000.00
                            0.030   if provisional_extended >= 250000.00

      # Step 4 — fuel surcharge, derived from supplier freight
      F                        = Supplier.freight_per_ton
      fuel_surcharge_per_ton   = round(F * FUEL_SURCHARGE_RATE, 2)

      # Step 5 — unit price then FINAL extended value
      quoted_unit_price_per_ton = round(base_price * (1 - volume_discount_pct)
                                        + F + fuel_surcharge_per_ton, 2)
      extended_contract_value   = round(quoted_unit_price_per_ton * contracted_tons, 2)
    input_set: |
      Exactly one MarketIndexQuote (superseded == false) for the resolved (index_symbol, month);
      the Supplier row reached through FiberPurchaseOrder.supplier_id; no other PO participates.
    constants:
      FUEL_SURCHARGE_RATE: 0.185
      TIER1_CEILING_USD: 100000.00
      TIER2_CEILING_USD: 250000.00
      TIER1_DISCOUNT_PCT: 0.000
      TIER2_DISCOUNT_PCT: 0.015
      TIER3_DISCOUNT_PCT: 0.030
    precision: "money 2 decimal places, round_half_up; discount percentages are exact 3-decimal literals"
    variants:
      - name: pinned_provisional_tier
        when: "always — this is the pinned evaluation order"
        difference: |
          The discount tier is selected from provisional_extended (step 2) and is NEVER
          re-derived from extended_contract_value (step 5), even when adding freight and
          fuel surcharge pushes the final value across TIER1_CEILING_USD or
          TIER2_CEILING_USD. The apparent circularity (value -> tier -> price -> value) is
          broken at step 3 and only there.

  # --- 2. receipt net tons: rounding ORDER decides the answer ----------------
  - name: receipt_net_tons
    trigger: "POST /fiber-purchase-orders/{id}/receipts (creation), recomputed never afterwards"
    algorithm: aggregation
    formula: |
      MAXM = FiberGrade(declared_grade_code).max_moisture_pct
      for each sublot i in sublots (ascending sublot_no):
        wet_i  = round(sublot_i.gross_tons - sublot_i.tare_tons, 3)
        exc_i  = max(0.00, sublot_i.moisture_pct - MAXM)
        ded_i  = round(wet_i * exc_i / 100, 3)          # PER-SUBLOT rounding, 3dp
        dry_i  = round(wet_i - ded_i, 3)
      moisture_deduction_tons  = round(sum(ded_i), 3)
      net_tons                 = round(sum(dry_i), 2)   # sum of ALREADY-ROUNDED dry_i, then 2dp
      weighted_moisture_pct      = round(sum(wet_i * sublot_i.moisture_pct)      / sum(wet_i), 2)
      weighted_contamination_pct = round(sum(wet_i * sublot_i.contamination_pct) / sum(wet_i), 2)
    input_set: "All sublots[] entries of this receipt; no other receipt or lot participates. Weights are the PRE-deduction wet_i values, not dry_i."
    constants:
      MOISTURE_DEDUCTION_DIVISOR: 100
    precision: "tonnage 3 decimal places internally, net_tons 2 decimal places; percentages 2 decimal places; round_half_up everywhere"
    variants:
      - name: per_sublot_then_sum
        when: "always — this is the pinned order"
        difference: |
          Rounding happens per sublot (ded_i and dry_i each to 3dp) BEFORE summation, and
          only the final sum is rounded to 2dp. Summing raw unrounded deductions first and
          rounding once at the end yields a different net_tons in the third decimal for
          multi-sublot trucks; that alternative is explicitly NOT used.

  # --- 3+4. dual-variant pulp yield (same batch, two valid answers) ----------
  - name: pulp_yield_provisional
    trigger: "PulpBatch QUEUED -> PULPING (POST /pulp-batches/{id}/start); sets provisional_accepted_tons"
    algorithm: forward_looking
    formula: |
      for each furnish line L (ascending FiberInventoryLot.created_at, then rank_order of grade):
        lot        = FiberInventoryLot(L.inventory_lot_id)
        nominal    = FiberGrade(lot.grade_code).nominal_yield_pct
        eff_yield  = max(YIELD_FLOOR_PCT, nominal - CONTAM_PENALTY_FACTOR * lot.contamination_pct)
        line_tons  = round(L.tons_charged * eff_yield / 100, 3)
      provisional_accepted_tons = round(sum(line_tons), 3)
      charged_tons              = round(sum(L.tons_charged), 3)
      blend_contamination_pct   = round(sum(L.tons_charged * lot.contamination_pct)
                                        / charged_tons, 3)
    input_set: "Only the furnish_lines[] of this batch, each resolved to a FiberInventoryLot with status == AVAILABLE at start time. Book yields only — no measured reject weight exists yet."
    constants:
      CONTAM_PENALTY_FACTOR: 1.8
      YIELD_FLOOR_PCT: 45.00
    precision: "3 decimal places, round_half_up"

  - name: pulp_yield_final
    trigger: "PulpBatch CLEANED -> APPROVED, or DEINKING -> APPROVED; sets final_accepted_tons and yield_variance_tons"
    algorithm: chronological
    formula: |
      deink_sludge_total = sum of RejectStream.dry_solids_tons over rows with
                             source_kind == DEINK_SLUDGE
                             AND source_ref_id == this batch id
                             AND reversal_of_id == null
                             (all passes, in created_at ascending order)
      final_accepted_tons  = round(charged_tons - measured_reject_tons - deink_sludge_total, 3)
      yield_variance_tons  = round(final_accepted_tons - provisional_accepted_tons, 3)
      available_tons       = round(final_accepted_tons - consumed_tons, 3)
    input_set: "charged_tons as pinned at PULPING, the single measured_reject_tons recorded at CLEANED, and every non-reversal DEINK_SLUDGE RejectStream row of this batch."
    constants: {}
    precision: "3 decimal places, round_half_up"
    variants:
      - name: book_yield_vs_measured_reject
        when: "both variants exist on every batch: provisional at PULPING, final at APPROVED"
        difference: |
          pulp_yield_provisional derives accepted tonnage from FiberGrade.nominal_yield_pct
          discounted by lot contamination (a projection), while pulp_yield_final subtracts
          the physically weighed reject and deink sludge tonnage from charged_tons. For
          identical furnish the two numbers differ, and yield_variance_tons is the signed
          gap; nothing in the system reconciles them back together.

  # --- 5. deink chemistry: >=3 inputs, nested min/max, per-pass decay --------
  - name: deink_chemical_cost
    trigger: "PulpBatch DEINKING -> APPROVED and DEINKING -> DEINK_HOLD (POST /pulp-batches/{id}/brightness)"
    algorithm: decay_function
    formula: |
      pass_index    = deink_pass_count + 1                    # the pass being closed now
      raw_cost      = round(caustic_kg   * CAUSTIC_USD_PER_KG
                          + peroxide_kg  * PEROXIDE_USD_PER_KG
                          + surfactant_kg * SURFACTANT_USD_PER_KG, 2)
      pass_cost     = round(raw_cost * TISSUE_PREMIUM, 2)
                        if PaperGradeSpec(target_product_code).family == TISSUE
                        else raw_cost
      effectiveness = round(PASS_DECAY ** (pass_index - 1), 4)
      removal_frac  = round(min(MAX_REMOVAL_FRACTION,
                                (BASE_REMOVAL
                                 + SURFACTANT_SENSITIVITY
                                   * (surfactant_kg / max(1.000, charged_tons)))
                                * effectiveness), 4)
      sludge_dry_tons          = round(charged_tons * INK_LOAD_PCT / 100 * removal_frac, 3)
      cumulative_chemical_cost = round(previous cumulative_chemical_cost + pass_cost, 2)
    input_set: "The three chemical charges of the pass in flight, charged_tons, deink_pass_count before the increment, and the target PaperGradeSpec.family."
    constants:
      CAUSTIC_USD_PER_KG: 0.62
      PEROXIDE_USD_PER_KG: 1.15
      SURFACTANT_USD_PER_KG: 3.40
      TISSUE_PREMIUM: 1.10
      PASS_DECAY: 0.65
      BASE_REMOVAL: 0.35
      SURFACTANT_SENSITIVITY: 0.08
      MAX_REMOVAL_FRACTION: 0.95
      INK_LOAD_PCT: 4.50
    precision: "money 2 decimal places; fractions 4 decimal places; tonnage 3 decimal places; round_half_up"
    variants:
      - name: family_conditional_premium
        when: "PaperGradeSpec(target_product_code).family == TISSUE"
        difference: "pass_cost carries a 10% premium; the containerboard branch does not, so the same chemical charges cost different money on different target products."

  # --- 6. grade change waste: tiered + direction-sensitive -------------------
  - name: grade_change_transition_waste
    trigger: "POST /paper-machines/{id}/grade-changes (creation); frozen at GradeChange PLANNED -> EXECUTED"
    algorithm: threshold
    formula: |
      f  = PaperGradeSpec(from_product_code)
      t  = PaperGradeSpec(to_product_code)
      bw_delta = abs(t.basis_weight_gsm - f.basis_weight_gsm)
      bw_tier  = BW_TIER1_TONS if bw_delta <= 10.0
                 BW_TIER2_TONS if bw_delta >  10.0 and bw_delta <= 40.0
                 BW_TIER3_TONS if bw_delta >  40.0
      family_mult = 1.00 if t.family == f.family else FAMILY_CROSS_MULT
      bright_pen  = BRIGHTNESS_STEP_TONS
                      if t.min_brightness_iso != null
                         and (f.min_brightness_iso == null
                              or t.min_brightness_iso > f.min_brightness_iso)
                    else 0.000
      direction_mult = UPSEQUENCE_MULT if t.rank_order < f.rank_order else 1.00
      transition_waste_tons = round(min(MAX_WASTE_TONS,
                                        (bw_tier + bright_pen) * family_mult * direction_mult), 3)
      transition_minutes    = ceil(transition_waste_tons / PaperMachine.max_tons_per_hour * 60)
                              + PaperMachine.changeover_buffer_minutes
    input_set: "The two PaperGradeSpec rows of the outgoing and incoming runs plus the parent PaperMachine. No other run participates."
    constants:
      BW_TIER1_TONS: 0.800
      BW_TIER2_TONS: 2.500
      BW_TIER3_TONS: 5.000
      FAMILY_CROSS_MULT: 2.20
      BRIGHTNESS_STEP_TONS: 1.500
      UPSEQUENCE_MULT: 1.15
      MAX_WASTE_TONS: 12.000
    precision: "tonnage 3 decimal places round_half_up; transition_minutes is an integer via ceil AFTER the tonnage rounding"
    variants:
      - name: sequence_direction
        when: "to_product_code.rank_order < from_product_code.rank_order"
        difference: "Running the sequence backwards (toward a lower rank_order) costs an extra 15% waste, so A->B and B->A on the same pair of products produce different transition_waste_tons."

  # --- 7+8. dual-variant run quality index (ProductionRun domain) ------------
  - name: run_quality_index_provisional
    trigger: "ProductionRun RUNNING -> COMPLETED and REWORK -> PROVISIONAL; sets provisional_quality_index and off_spec_reel_count"
    algorithm: weighted_scoring
    formula: |
      spec = PaperGradeSpec(product_code)
      define reel_score(r):
        bw_dev_pct = abs(r.basis_weight_gsm - spec.basis_weight_gsm) / spec.basis_weight_gsm * 100
        moist_dev  = abs(r.moisture_pct - spec.target_moisture_pct)
        sct_ratio  = 1.0000 if spec.min_sct_kn_m == 0.00
                     else r.sct_kn_m / spec.min_sct_kn_m
        p_bw    = BW_PENALTY_PER_PCT   * bw_dev_pct
        p_moist = MOIST_PENALTY_PER_PCT * max(0.00, moist_dev - spec.moisture_tolerance_pct)
        p_sct   = SCT_PENALTY_FULL      * max(0.0000, 1 - sct_ratio)
        return round(max(0.00, 100.00 - p_bw - p_moist - p_sct), 2)   # per-reel round FIRST

      first = reel_readings entry with the smallest reel_no
      last  = reel_readings entry with the largest  reel_no
      provisional_quality_index = round((reel_score(first) + reel_score(last)) / 2, 2)

      off_spec_reel_count = count of reel_readings entries r where
          abs(r.basis_weight_gsm - spec.basis_weight_gsm) / spec.basis_weight_gsm * 100 > OFF_SPEC_BW_PCT
          OR abs(r.moisture_pct - spec.target_moisture_pct) > spec.moisture_tolerance_pct
          OR r.sct_kn_m < spec.min_sct_kn_m
    input_set: "Exactly two reel_readings entries — smallest and largest reel_no — regardless of how many reels the run produced. A single-reel run uses that reel twice."
    constants:
      BW_PENALTY_PER_PCT: 4.0
      MOIST_PENALTY_PER_PCT: 12.0
      SCT_PENALTY_FULL: 30.0
      OFF_SPEC_BW_PCT: 5.00
    precision: "2 decimal places, round_half_up; per-reel scores are rounded to 2dp BEFORE averaging"

  - name: run_quality_index_certified
    trigger: "ProductionRun PROVISIONAL -> CERTIFIED and PROVISIONAL -> HELD; sets certified_quality_index"
    algorithm: weighted_scoring
    formula: |
      # reel_score(r) is the identical helper defined in run_quality_index_provisional
      certified_quality_index = round( sum over ALL reel_readings r of (r.reel_tons * reel_score(r))
                                       / sum over ALL reel_readings r of r.reel_tons, 2)
    input_set: "EVERY reel_readings entry of the run, weighted by reel_tons; the ascending reel_no order is irrelevant because the weighted mean is order-free, but the per-reel rounding is not."
    constants: {}
    precision: "2 decimal places, round_half_up; each reel_score is rounded to 2dp BEFORE weighting, then the weighted mean is rounded to 2dp"
    variants:
      - name: endpoints_unweighted_vs_all_reels_weighted
        when: "both exist on every completed run: provisional at COMPLETED, certified at CERTIFIED or HELD"
        difference: |
          provisional uses the arithmetic mean of the FIRST and LAST reel only; certified uses
          the tonnage-weighted mean of ALL reels. A run whose middle reels are off-spec but whose
          first and last reels are on-spec has provisional_quality_index >= 85.00 while
          certified_quality_index < 85.00, so the same reel data certifies under one variant and
          is HELD under the other. The two indexes are stored side by side and never reconciled.

  # --- 9. supplier qualification posture ------------------------------------
  - name: supplier_qualification_posture
    trigger: "FiberReceipt SAMPLED -> DOWNGRADED and SAMPLED -> REJECTED (cascade hop 1)"
    algorithm: threshold
    formula: |
      strikes = count of FiberReceipt rows with supplier_id == this supplier
                  AND status IN {DOWNGRADED, REJECTED}
                  AND dispositioned_by_user_id != null
      qualification_status = SUSPENDED  if strikes >= SUSPEND_STRIKES
                             PROBATION  if strikes >= PROBATION_STRIKES and strikes < SUSPEND_STRIKES
                             QUALIFIED  otherwise
      probation_entered_at = logical clock instant when the value first becomes PROBATION;
                             left unchanged while it stays PROBATION; set to null on QUALIFIED
    input_set: "FiberReceipt rows of this supplier across every purchase order with status IN {DOWNGRADED, REJECTED} AND dispositioned_by_user_id != null. Receipts flipped to REJECTED by the FiberPurchaseOrder cancel cascade carry dispositioned_by_user_id == null and are excluded from the strike count."
    constants:
      PROBATION_STRIKES: 2
      SUSPEND_STRIKES: 4
    precision: "integer counts; boundaries are inclusive (>=)"

  # --- 10. effluent rolling compliance posture -------------------------------
  - name: effluent_rolling_compliance
    trigger: "POST /effluent-permits/{id}/readings and POST /effluent-readings/{id}/void; sets rolling_bod_kg_per_day, rolling_tss_kg_per_day, exceedance_day_count, compliance_posture"
    algorithm: interval_merge
    formula: |
      rows      = EffluentReading rows of this permit with voided == false
      if rows is empty:
        rolling_bod_kg_per_day = 0.000; rolling_tss_kg_per_day = 0.000
        exceedance_day_count   = 0;     compliance_posture = COMPLIANT
      else:
        d_max   = max(reading_date) over rows                       # a calendar date
        d_min   = d_max - (rolling_window_days - 1) days            # BOTH ends inclusive
        window  = rows with d_min <= reading_date <= d_max
        n       = count(window)                                     # days WITHOUT a reading do
                                                                    # NOT enter the denominator
        rolling_bod_kg_per_day = round(sum(window.bod_kg) / n, 3)
        rolling_tss_kg_per_day = round(sum(window.tss_kg) / n, 3)
        exceedance_day_count   = count of window rows with flow_m3 > flow_limit_m3_per_day
        bod_ratio = rolling_bod_kg_per_day / bod_limit_kg_per_day
        tss_ratio = rolling_tss_kg_per_day / tss_limit_kg_per_day
        compliance_posture =
          EXCEEDANCE  if bod_ratio > 1.00 or tss_ratio > 1.00 or exceedance_day_count >= 2
          WATCH       if max(bod_ratio, tss_ratio) >= WATCH_RATIO
          COMPLIANT   otherwise
    input_set: "Non-voided EffluentReading rows of the permit inside the inclusive rolling window anchored on the newest non-voided reading_date. Voiding the newest reading moves the anchor and can shrink the window."
    constants:
      WATCH_RATIO: 0.90
      EXCEEDANCE_DAY_TRIGGER: 2
    precision: "loads 3 decimal places, ratios compared unrounded against the literal thresholds"
    variants:
      - name: ratio_exactly_one
        when: "bod_ratio or tss_ratio evaluates to exactly 1.00"
        difference: "Exactly 1.00 is NOT an exceedance (the comparison is strict >), so the posture lands on WATCH; only a ratio strictly above 1.00 reaches EXCEEDANCE. The flow test is the mirror image: flow_m3 exactly equal to flow_limit_m3_per_day does not count as an exceedance day."

  # --- 11. steam header waterfall (half-open intervals, aggregate capacity) ---
  - name: steam_waterfall_dispatch
    trigger: "POST /steam-allocations (creation) and POST /steam-allocations/{id}/release (recompute of survivors)"
    algorithm: waterfall_allocation
    formula: |
      # candidate set: allocations that OVERLAP the requested half-open window
      overlapping = SteamAllocation rows with status IN {GRANTED, CURTAILED}
                      AND window_start < requested.window_end
                      AND window_end   > requested.window_start
      # deterministic waterfall order over entity fields only
      ordered  = overlapping sorted by (priority_rank ASC, window_start ASC, created_at ASC)
      consumed = round(sum over ordered of granted_tph, 3)
      remaining = round(HEADER_CAPACITY_TPH - consumed, 3)
      if remaining <= 0.000:                      -> reject with ERR_STEAM_HEADER_SATURATED
      elif remaining >= requested.demand_tph:     granted_tph = requested.demand_tph; status = GRANTED
      elif remaining <  MIN_VIABLE_TPH:           -> reject with ERR_STEAM_HEADER_SATURATED
      else:                                       granted_tph = remaining;           status = CURTAILED
      curtailed_tph = round(requested.demand_tph - granted_tph, 3)
    input_set: "Only SteamAllocation rows in status GRANTED or CURTAILED whose half-open window [window_start, window_end) strictly intersects the requested window. Touching endpoints (a.window_end == b.window_start) do NOT overlap and consume nothing."
    constants:
      HEADER_CAPACITY_TPH: 180.000
      MIN_VIABLE_TPH: 5.000
    precision: "3 decimal places, round_half_up"
    variants:
      - name: half_open_vs_closed
        when: "a new allocation begins exactly at another allocation's window_end"
        difference: "The steam header uses HALF-OPEN intervals, so back-to-back allocations never contend; the PaperMachine occupancy check (§1.4 priority 24) uses CLOSED intervals widened by changeover_buffer_minutes on both sides, so back-to-back runs DO collide. The same two timestamps therefore conflict on a machine and coexist on the header."

  # --- 12. cogeneration credit (marginal tiering, per-tier rounding pinned) ---
  - name: cogen_credit
    trigger: "POST /steam-allocations (creation, after steam_waterfall_dispatch) — sets cogen_credit_usd on the new allocation"
    algorithm: tiered_pricing
    formula: |
      duration_hours = round((window_end - window_start) in seconds / 3600, 4)
      export_tph     = round(max(0.000, HEADER_CAPACITY_TPH - consumed - granted_tph), 3)
      # marginal tiers over export_tph
      t1 = min(export_tph, 30.000)
      t2 = min(max(export_tph - 30.000, 0.000), 30.000)
      t3 = max(export_tph - 60.000, 0.000)
      c1 = round(t1 * TIER1_USD_PER_TPH_HOUR * duration_hours, 4)
      c2 = round(t2 * TIER2_USD_PER_TPH_HOUR * duration_hours, 4)
      c3 = round(t3 * TIER3_USD_PER_TPH_HOUR * duration_hours, 4)
      cogen_credit_usd = round(c1 + c2 + c3, 2)
    input_set: "The `consumed` and `granted_tph` figures produced by steam_waterfall_dispatch for this same request, plus this allocation's own window."
    constants:
      TIER1_USD_PER_TPH_HOUR: 4.10
      TIER2_USD_PER_TPH_HOUR: 6.75
      TIER3_USD_PER_TPH_HOUR: 9.20
      TIER1_BAND_TPH: 30.000
      TIER2_BAND_TPH: 30.000
    precision: "per-tier products rounded to 4 decimal places FIRST, summed, then the total rounded to 2 decimal places, round_half_up"
    variants:
      - name: per_tier_then_total
        when: "always — this is the pinned rounding order"
        difference: "Rounding each tier product to 4dp before summing and rounding the sum to 2dp is pinned; summing the three unrounded products and rounding once produces a different cent on fractional-hour windows and is explicitly NOT used."

  # --- 13. conserved-quantity ledgers ---------------------------------------
  - name: mill_fiber_balance
    trigger: "GET /mill/fiber-balance; recomputed on every FiberInventoryLot mutation"
    algorithm: aggregation
    formula: |
      total_received_tons  = round(sum of FiberInventoryLot.tons_received  over ALL lots, 3)
      total_consumed_tons  = round(sum of FiberInventoryLot.tons_consumed  over ALL lots, 3)
      total_available_tons = round(sum of FiberInventoryLot.tons_available over ALL lots, 3)
      imbalance_tons       = round(total_received_tons - total_consumed_tons
                                   - total_available_tons, 3)
      INVARIANT: imbalance_tons == 0.000 at every observable instant, including after
      PulpBatch PULPING -> CANCELLED releases a reservation and after ProductionRun
      RUNNING -> ABORTED returns pulp_draw_tons to PulpBatch.available_tons.
    input_set: "Every FiberInventoryLot row regardless of status, including QUARANTINED and DEPLETED lots."
    constants: {}
    precision: "3 decimal places, round_half_up"

  - name: solids_ledger_balance
    trigger: "GET /reject-streams/summary; recomputed on every RejectStream, SludgeManifest mutation"
    algorithm: aggregation
    formula: |
      gross_solids_tons       = round(sum dry_solids_tons where reversal_of_id == null, 3)
      reversed_solids_tons    = round(sum dry_solids_tons where reversal_of_id != null, 3)
      net_solids_tons         = round(gross_solids_tons - reversed_solids_tons, 3)
      manifested_dry_solids_tons   = round(sum dry_solids_tons where reversal_of_id == null
                                             and disposition == MANIFESTED, 3)
      unmanifested_dry_solids_tons = round(sum dry_solids_tons where reversal_of_id == null
                                             and disposition == PENDING, 3)
      repulped_dry_solids_tons     = round(sum dry_solids_tons where reversal_of_id == null
                                             and disposition == REPULPED, 3)
      INVARIANT: net_solids_tons == round(manifested_dry_solids_tons
                                          + unmanifested_dry_solids_tons, 3)
      because every REPULPED row is matched by exactly one reversal row of equal tonnage.
      The invariant holds across the SIGN / VOID compensating pair on a SludgeManifest:
      signing moves tonnage PENDING -> MANIFESTED, voiding moves it back, and
      net_solids_tons is identical before and after.
    input_set: "Every RejectStream row of every source_kind, including reversal rows."
    constants: {}
    precision: "3 decimal places, round_half_up"

  - name: order_allocation_ledger
    trigger: "RollSet WRAPPED -> ALLOCATED, ALLOCATED -> QUARANTINED, ALLOCATED -> SHIPPED; recomputed on CustomerOrder read"
    algorithm: aggregation
    formula: |
      allocated_tons = round(sum of RollSet.net_tons over rows with
                               allocated_order_id == this order
                               AND status IN {ALLOCATED, SHIPPED}, 3)
      shipped_tons   = round(sum of RollSet.net_tons over rows with
                               allocated_order_id == this order AND status == SHIPPED, 3)
      shortfall_tons = round(max(0.000, ordered_tons - allocated_tons), 3)
      INVARIANT: for every CustomerOrder, allocated_tons equals the summed net_tons of the
      RollSet rows currently pointing at it in status ALLOCATED or SHIPPED. The quality-hold
      cascade (RollSet ALLOCATED -> QUARANTINED, which clears allocated_order_id) is the
      compensating action for allocation: after allocate-then-hold the order's allocated_tons
      returns to exactly its pre-allocation value and no tonnage is stranded.
    input_set: "RollSet rows with allocated_order_id == this order; QUARANTINED, REWOUND, WOUND, WRAPPED and SCRAPPED rows contribute nothing."
    constants: {}
    precision: "3 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order)
# =============================================================================
validations:
  # ---- authentication / authorization (1-5) --------------------------------
  - { priority: 1,  category: auth, check: "X-User-Role and X-User-ID headers are both present and non-empty", error_id: ERR_MISSING_AUTH_HEADERS, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth, check: "X-User-Role is one of the eight roles declared in §1.7", error_id: ERR_UNKNOWN_ROLE, http_status: 401, applies_to: "all" }
  - { priority: 3,  category: auth, check: "for entity_backed roles, X-User-ID resolves to an existing row of the backing entity (Supplier for Supplier, Customer for Customer)", error_id: ERR_IDENTITY_NOT_FOUND, http_status: 401, applies_to: "all endpoints callable by Supplier or Customer" }
  - { priority: 4,  category: auth, check: "the acting role appears in the endpoint's roles list in §1.5", error_id: ERR_ROLE_NOT_PERMITTED, http_status: 403, applies_to: "all" }
  - { priority: 5,  category: auth, check: "for entity_backed roles, X-User-ID equals the resource's owning foreign key (FiberPurchaseOrder.supplier_id for Supplier; CustomerOrder.customer_id and Customer.id for Customer)", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "POST /fiber-purchase-orders/{id}/confirm, POST /customer-orders, POST /customer-orders/{id}/cancel, GET /customers/{id}, GET /customer-orders" }

  # ---- path existence, left-to-right (6-19) --------------------------------
  - { priority: 6,  category: existence, check: "path {id} resolves to a Supplier", error_id: ERR_SUPPLIER_NOT_FOUND, http_status: 404, applies_to: "GET /suppliers/{id}" }
  - { priority: 7,  category: existence, check: "path {id} resolves to a Customer", error_id: ERR_CUSTOMER_NOT_FOUND, http_status: 404, applies_to: "GET /customers/{id}, PATCH /customers/{id}/status" }
  - { priority: 8,  category: existence, check: "path {id} resolves to a FiberPurchaseOrder", error_id: ERR_PURCHASE_ORDER_NOT_FOUND, http_status: 404, applies_to: "all /fiber-purchase-orders/{id}/** endpoints" }
  - { priority: 9,  category: existence, check: "path {id} resolves to a FiberReceipt", error_id: ERR_RECEIPT_NOT_FOUND, http_status: 404, applies_to: "GET /fiber-receipts/{id}, POST /fiber-receipts/{id}/disposition" }
  - { priority: 10, category: existence, check: "path {id} resolves to a FiberInventoryLot", error_id: ERR_INVENTORY_LOT_NOT_FOUND, http_status: 404, applies_to: "GET /fiber-inventory-lots/{id}" }
  - { priority: 11, category: existence, check: "path {id} resolves to a PulpBatch", error_id: ERR_PULP_BATCH_NOT_FOUND, http_status: 404, applies_to: "all /pulp-batches/{id}/** endpoints" }
  - { priority: 12, category: existence, check: "path {machine_id} resolves to a PaperMachine (checked before {run_id})", error_id: ERR_MACHINE_NOT_FOUND, http_status: 404, applies_to: "all /paper-machines/{id}/** endpoints" }
  - { priority: 13, category: existence, check: "path {run_id} resolves to a ProductionRun whose machine_id equals the resolved {machine_id}", error_id: ERR_RUN_NOT_FOUND, http_status: 404, applies_to: "all /paper-machines/{machine_id}/runs/{run_id}/** endpoints, GET /production-runs/{id}, POST /production-runs/{id}/roll-sets" }
  - { priority: 14, category: existence, check: "path {id} resolves to a GradeChange", error_id: ERR_GRADE_CHANGE_NOT_FOUND, http_status: 404, applies_to: "GET /grade-changes/{id}, POST /grade-changes/{id}/void" }
  - { priority: 15, category: existence, check: "path {id} resolves to a RollSet", error_id: ERR_ROLL_SET_NOT_FOUND, http_status: 404, applies_to: "all /roll-sets/{id}/** endpoints" }
  - { priority: 16, category: existence, check: "path {id} resolves to a CustomerOrder", error_id: ERR_ORDER_NOT_FOUND, http_status: 404, applies_to: "all /customer-orders/{id}/** endpoints" }
  - { priority: 17, category: existence, check: "path {id} resolves to an EffluentPermit, or to an EffluentReading for reading endpoints", error_id: ERR_PERMIT_NOT_FOUND, http_status: 404, applies_to: "GET /effluent-permits/{id}, POST /effluent-permits/{id}/readings, GET /effluent-permits/{id}/readings" }
  - { priority: 18, category: existence, check: "path {id} resolves to an EffluentReading, SludgeManifest or RejectStream as the collection dictates", error_id: ERR_ENV_RECORD_NOT_FOUND, http_status: 404, applies_to: "GET /effluent-readings/{id}, POST /effluent-readings/{id}/void, GET /sludge-manifests/{id}, POST /sludge-manifests/{id}/sign, POST /sludge-manifests/{id}/void, GET /reject-streams/{id}, POST /reject-streams/{id}/reverse" }
  - { priority: 19, category: existence, check: "path {id} resolves to a SteamAllocation", error_id: ERR_STEAM_ALLOCATION_NOT_FOUND, http_status: 404, applies_to: "GET /steam-allocations/{id}, POST /steam-allocations/{id}/release" }

  # ---- body-referenced existence (20-24) -----------------------------------
  - { priority: 20, category: business_referential, check: "body fiber_grade_code resolves to a FiberGrade; body target_product_code / product_code resolves to a PaperGradeSpec", error_id: ERR_GRADE_CODE_NOT_FOUND, http_status: 404, applies_to: "POST /fiber-purchase-orders, POST /pulp-batches, POST /paper-machines/{id}/runs, POST /customer-orders" }
  - { priority: 21, category: business_referential, check: "body supplier_id / customer_id resolves to the named entity", error_id: ERR_PARTY_NOT_FOUND, http_status: 404, applies_to: "POST /fiber-purchase-orders, POST /customer-orders" }
  - { priority: 22, category: business_referential, check: "every furnish_lines[].inventory_lot_id resolves to a FiberInventoryLot, and body pulp_batch_id resolves to a PulpBatch", error_id: ERR_FURNISH_REFERENCE_NOT_FOUND, http_status: 404, applies_to: "POST /pulp-batches, POST /paper-machines/{id}/runs" }
  - { priority: 23, category: business_referential, check: "body run_id / from_run_id / to_run_id resolves to a ProductionRun on the addressed machine, and body order_id resolves to a CustomerOrder", error_id: ERR_LINK_TARGET_NOT_FOUND, http_status: 404, applies_to: "POST /customer-orders/{id}/schedule, POST /paper-machines/{id}/grade-changes, POST /roll-sets/{id}/allocate" }
  - { priority: 24, category: business_referential, check: "every reject_stream_ids[] entry resolves to a RejectStream with reversal_of_id == null", error_id: ERR_REJECT_STREAM_REFERENCE_INVALID, http_status: 404, applies_to: "POST /sludge-manifests" }

  # ---- request shape (25-27) ----------------------------------------------
  - { priority: 25, category: business_constraint, check: "limit is an integer in 1..100 and offset is an integer >= 0", error_id: ERR_INVALID_PAGINATION, http_status: 400, applies_to: "all list endpoints" }
  - { priority: 26, category: business_constraint, check: "required body fields are present, types and ranges match §1.1 constraints, enum members are declared values, ISO 8601 datetimes parse, arrays respect their min/max cardinality and unique-key rules (sublots.sublot_no, reel_readings.reel_no, furnish_lines.inventory_lot_id, reject_stream_ids)", error_id: ERR_VALIDATION, http_status: 422, applies_to: "all write endpoints" }
  - { priority: 27, category: business_constraint, check: "window_end > window_start for ProductionRun and SteamAllocation windows; rewind-complete net_tons <= pre-rewind net_tons", error_id: ERR_INVALID_WINDOW, http_status: 422, applies_to: "POST /paper-machines/{id}/runs, POST /steam-allocations, POST /roll-sets/{id}/rewind-complete" }

  # ---- state preconditions (28-36) ----------------------------------------
  - { priority: 28, category: state, check: "FiberPurchaseOrder.status matches the transition's from-state (DRAFT for price, PRICED for withdraw-pricing and confirm, DRAFT/PRICED/CONFIRMED for cancel, CONFIRMED or PARTIALLY_RECEIVED for receipt creation)", error_id: ERR_PURCHASE_ORDER_INVALID_STATE, http_status: 409, applies_to: "all /fiber-purchase-orders/{id}/** write endpoints" }
  - { priority: 29, category: state, check: "FiberReceipt.status == SAMPLED", error_id: ERR_RECEIPT_INVALID_STATE, http_status: 409, applies_to: "POST /fiber-receipts/{id}/disposition" }
  - { priority: 30, category: state, check: "PulpBatch.status matches the transition's from-state (QUEUED start, PULPING screen, SCREENED clean, CLEANED approve/deink, DEINKING brightness, DEINK_HOLD deink/divert, QUEUED or PULPING cancel)", error_id: ERR_PULP_BATCH_INVALID_STATE, http_status: 409, applies_to: "all /pulp-batches/{id}/** write endpoints" }
  - { priority: 31, category: state, check: "ProductionRun.run_status matches the axis-1 transition's from-state (SCHEDULED start, RUNNING complete, RUNNING abort) and PaperMachine.status == RUNNABLE for start", error_id: ERR_RUN_INVALID_STATE, http_status: 409, applies_to: "POST /paper-machines/{machine_id}/runs/{run_id}/start, /complete, /abort, POST /production-runs/{id}/roll-sets" }
  - { priority: 32, category: state, check: "ProductionRun.quality_status matches the axis-2 transition's from-state (PROVISIONAL certify/hold, HELD rework/condemn, REWORK resubmit-quality) — the two axes are checked independently, so a COMPLETED run with quality_status HELD rejects /certify on this rule, not on priority 31", error_id: ERR_QUALITY_INVALID_STATE, http_status: 409, applies_to: "POST /paper-machines/{machine_id}/runs/{run_id}/certify, /hold, /rework, /resubmit-quality, /condemn" }
  - { priority: 33, category: state, check: "CustomerOrder.status matches the transition's from-state (SUBMITTED schedule/cancel, SCHEDULED deschedule, ALLOCATED ship, PARTIALLY_ALLOCATED short-close) and Customer.status == ACTIVE for order creation and scheduling", error_id: ERR_ORDER_INVALID_STATE, http_status: 409, applies_to: "POST /customer-orders, all /customer-orders/{id}/** write endpoints" }
  - { priority: 34, category: state, check: "RollSet.status matches the transition's from-state (WOUND wrap, WRAPPED allocate, WOUND/WRAPPED quarantine, QUARANTINED rewind, REWOUND rewind-complete, QUARANTINED/REWOUND scrap)", error_id: ERR_ROLL_SET_INVALID_STATE, http_status: 409, applies_to: "all /roll-sets/{id}/** write endpoints" }
  - { priority: 35, category: state, check: "SludgeManifest.status == DRAFT for sign, DRAFT or SIGNED for void; EffluentReading.voided == false for void; RejectStream.disposition == PENDING for reverse; SteamAllocation.status IN {GRANTED, CURTAILED} for release; GradeChange.status == PLANNED for void", error_id: ERR_ENV_RECORD_INVALID_STATE, http_status: 409, applies_to: "POST /sludge-manifests/{id}/sign, POST /sludge-manifests/{id}/void, POST /effluent-readings/{id}/void, POST /reject-streams/{id}/reverse, POST /steam-allocations/{id}/release, POST /grade-changes/{id}/void" }
  - { priority: 36, category: state, check: "the cross-entity gate on the target's parent holds: RollSet allocate requires ProductionRun.quality_status == CERTIFIED; CustomerOrder ship requires ProductionRun(scheduled_run_id).quality_status == CERTIFIED; RollSet wrap requires ProductionRun.run_status == COMPLETED", error_id: ERR_RUN_NOT_CERTIFIED, http_status: 409, applies_to: "POST /roll-sets/{id}/allocate, POST /roll-sets/{id}/wrap, POST /customer-orders/{id}/ship" }

  # ---- optimistic concurrency (37-39) — after state, before business rules --
  - { priority: 37, category: state, check: "expected_order_version equals CustomerOrder.version", error_id: ERR_STALE_ORDER_VERSION, http_status: 412, applies_to: "POST /roll-sets/{id}/allocate, POST /customer-orders/{id}/schedule" }
  - { priority: 38, category: state, check: "expected_machine_version equals PaperMachine.version", error_id: ERR_STALE_MACHINE_VERSION, http_status: 412, applies_to: "POST /paper-machines/{id}/runs, POST /paper-machines/{id}/grade-changes, PATCH /paper-machines/{id}/status" }
  - { priority: 39, category: state, check: "expected_purchase_order_version equals FiberPurchaseOrder.version", error_id: ERR_STALE_PURCHASE_ORDER_VERSION, http_status: 412, applies_to: "POST /fiber-purchase-orders/{id}/price, POST /fiber-purchase-orders/{id}/withdraw-pricing" }

  # ---- business_safety: environmental, segregation of duties, contamination (40-49)
  - { priority: 40, category: business_safety, check: "the EffluentPermit's compliance_posture is COMPLIANT or WATCH — EXCEEDANCE blocks every ProductionRun start (loses to priority 31 when the run is not SCHEDULED, wins over priority 67 when pulp is also short)", error_id: ERR_PERMIT_EXCEEDANCE_BLOCK, http_status: 409, applies_to: "POST /paper-machines/{machine_id}/runs/{run_id}/start" }
  - { priority: 41, category: business_safety, check: "destination != LAND_APPLICATION while any EffluentPermit.compliance_posture == EXCEEDANCE", error_id: ERR_LAND_APPLICATION_BARRED, http_status: 409, applies_to: "POST /sludge-manifests, POST /sludge-manifests/{id}/sign" }
  - { priority: 42, category: business_safety, check: "X-User-ID != FiberReceipt.sampled_by_user_id (the operator who sampled a truck cannot disposition it)", error_id: ERR_SOD_SAME_SAMPLER, http_status: 409, applies_to: "POST /fiber-receipts/{id}/disposition" }
  - { priority: 43, category: business_safety, check: "X-User-ID != ProductionRun.started_by_user_id (the operator who started a run cannot certify its quality)", error_id: ERR_SOD_SAME_OPERATOR, http_status: 409, applies_to: "POST /paper-machines/{machine_id}/runs/{run_id}/certify" }
  - { priority: 44, category: business_safety, check: "X-User-ID != SludgeManifest.prepared_by_user_id AND X-User-ID is not the logged_by_user_id of any non-voided EffluentReading inside the permit's current rolling window", error_id: ERR_SOD_SAME_ENV_OFFICER, http_status: 409, applies_to: "POST /sludge-manifests/{id}/sign" }
  - { priority: 45, category: business_safety, check: "the requested disposition matches the measured contamination: ACCEPT requires weighted_contamination_pct <= FiberGrade(declared_grade_code).max_contamination_pct; DOWNGRADE requires it above that ceiling, a non-null downgrade_target_grade_code, and weighted_contamination_pct <= the target grade's ceiling; REJECT requires no acceptable grade or weighted_moisture_pct > max_moisture_pct + 5.00", error_id: ERR_DISPOSITION_NOT_PERMITTED, http_status: 409, applies_to: "POST /fiber-receipts/{id}/disposition" }
  - { priority: 46, category: business_safety, check: "every furnish_lines[].inventory_lot_id resolves to a FiberInventoryLot with status == AVAILABLE (QUARANTINED or DEPLETED lots are barred; this precedes the tonnage check at priority 66)", error_id: ERR_LOT_NOT_AVAILABLE, http_status: 409, applies_to: "POST /pulp-batches/{id}/start" }
  - { priority: 47, category: business_safety, check: "blend_contamination_pct <= 3.500 (inclusive: exactly 3.500 passes)", error_id: ERR_FURNISH_CONTAMINATION_EXCEEDED, http_status: 409, applies_to: "POST /pulp-batches/{id}/start" }
  - { priority: 48, category: business_safety, check: "PulpBatch.deink_pass_count >= 1 when PaperGradeSpec(product_code).requires_deink_pulp == true", error_id: ERR_DEINK_PULP_REQUIRED, http_status: 409, applies_to: "POST /paper-machines/{machine_id}/runs/{run_id}/start" }
  - { priority: 49, category: business_safety, check: "pulper_line == DIP_LINE whenever the target PaperGradeSpec.requires_deink_pulp == true, and every deink pass runs on DIP_LINE", error_id: ERR_WRONG_PULPER_LINE, http_status: 409, applies_to: "POST /pulp-batches/{id}/start, POST /pulp-batches/{id}/deink" }

  # ---- business_constraint: qualification, cycle limits, uniqueness, specs (50-62)
  - { priority: 50, category: business_constraint, check: "Supplier.qualification_status != SUSPENDED", error_id: ERR_SUPPLIER_SUSPENDED, http_status: 409, applies_to: "POST /fiber-purchase-orders, POST /fiber-purchase-orders/{id}/price" }
  - { priority: 51, category: business_constraint, check: "Supplier.qualification_status == QUALIFIED, or == PROBATION with contracted_tons <= 500.00 (inclusive boundary)", error_id: ERR_SUPPLIER_NOT_QUALIFIED, http_status: 409, applies_to: "POST /fiber-purchase-orders/{id}/confirm" }
  - { priority: 52, category: business_constraint, check: "exactly one MarketIndexQuote with superseded == false exists for the resolved (index_symbol, month) pair", error_id: ERR_INDEX_QUOTE_MISSING, http_status: 422, applies_to: "POST /fiber-purchase-orders/{id}/price" }
  - { priority: 53, category: business_constraint, check: "pricing_revision_count < 2", error_id: ERR_REPRICE_LIMIT_REACHED, http_status: 409, applies_to: "POST /fiber-purchase-orders/{id}/withdraw-pricing" }
  - { priority: 54, category: business_constraint, check: "deink_pass_count < 3", error_id: ERR_DEINK_PASS_LIMIT, http_status: 409, applies_to: "POST /pulp-batches/{id}/deink from DEINK_HOLD" }
  - { priority: 55, category: business_constraint, check: "deschedule_count < 3", error_id: ERR_DESCHEDULE_LIMIT, http_status: 409, applies_to: "POST /customer-orders/{id}/deschedule" }
  - { priority: 56, category: business_constraint, check: "rewind_count < 2", error_id: ERR_REWIND_LIMIT, http_status: 409, applies_to: "POST /roll-sets/{id}/rewind" }
  - { priority: 57, category: business_constraint, check: "uniqueness: PaperMachine.name, FiberGrade.grade_code, PaperGradeSpec.product_code, EffluentPermit.permit_number, SludgeManifest.manifest_number, FiberGrade.rank_order, PaperGradeSpec.rank_order, and (permit_id, reading_date) among EffluentReading rows with voided == false", error_id: ERR_DUPLICATE_KEY, http_status: 409, applies_to: "POST /paper-machines, POST /fiber-grades, POST /paper-grade-specs, POST /effluent-permits, POST /sludge-manifests, POST /effluent-permits/{id}/readings" }
  - { priority: 58, category: business_constraint, check: "RollSet.slit_width_mm == CustomerOrder.roll_width_mm AND RollSet.diameter_mm <= CustomerOrder.roll_diameter_mm AND RollSet.wrap_spec == CustomerOrder.wrap_spec", error_id: ERR_ROLL_SPEC_MISMATCH, http_status: 409, applies_to: "POST /roll-sets/{id}/allocate" }
  - { priority: 59, category: business_constraint, check: "roll_width_mm <= Customer.max_roll_width_mm AND roll_diameter_mm <= Customer.max_roll_diameter_mm AND wrap_spec == Customer.wrap_spec", error_id: ERR_CUSTOMER_SPEC_VIOLATION, http_status: 422, applies_to: "POST /customer-orders" }
  - { priority: 60, category: business_constraint, check: "slit_width_mm <= PaperMachine.wire_width_mm", error_id: ERR_WIDTH_EXCEEDS_DECKLE, http_status: 409, applies_to: "POST /production-runs/{id}/roll-sets, POST /roll-sets/{id}/rewind-complete, POST /roll-sets/{id}/wrap" }
  - { priority: 61, category: business_constraint, check: "measured_reject_tons <= charged_tons * 0.40", error_id: ERR_REJECT_TONS_IMPLAUSIBLE, http_status: 422, applies_to: "POST /pulp-batches/{id}/clean" }
  - { priority: 62, category: business_constraint, check: "CustomerOrder.product_code == ProductionRun(run_id).product_code, and PulpBatch(pulp_batch_id).target_product_code == the run's product_code", error_id: ERR_PRODUCT_MISMATCH, http_status: 409, applies_to: "POST /customer-orders/{id}/schedule, POST /paper-machines/{id}/runs" }

  # ---- business_temporal: interval geometry (63-65) -------------------------
  - { priority: 63, category: business_temporal, check: "the requested run window, widened by PaperMachine.changeover_buffer_minutes on BOTH ends, must not intersect the (unwidened) CLOSED window of any other ProductionRun on the same machine with run_status IN {SCHEDULED, RUNNING} — touching endpoints collide because the interval is closed", error_id: ERR_MACHINE_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /paper-machines/{id}/runs" }
  - { priority: 64, category: business_temporal, check: "the gap between ProductionRun(from_run_id).window_end and ProductionRun(to_run_id).window_start, in whole minutes, must be >= the computed transition_minutes (inclusive)", error_id: ERR_TRANSITION_GAP_TOO_SHORT, http_status: 409, applies_to: "POST /paper-machines/{id}/grade-changes" }
  - { priority: 65, category: business_temporal, check: "reading_date is not later than the logical clock's calendar date; SteamAllocation.window_start is not earlier than the logical clock instant", error_id: ERR_DATE_OUT_OF_RANGE, http_status: 422, applies_to: "POST /effluent-permits/{id}/readings, POST /steam-allocations" }

  # ---- business_fiscal: tonnage, capacity, energy (66-71) -------------------
  - { priority: 66, category: business_fiscal, check: "for every furnish line, FiberInventoryLot.tons_available >= tons_charged (inclusive: exactly equal passes and depletes the lot)", error_id: ERR_INSUFFICIENT_FIBER, http_status: 409, applies_to: "POST /pulp-batches/{id}/start" }
  - { priority: 67, category: business_fiscal, check: "PulpBatch.available_tons >= pulp_draw_tons and PulpBatch.status == APPROVED", error_id: ERR_INSUFFICIENT_PULP, http_status: 409, applies_to: "POST /paper-machines/{machine_id}/runs/{run_id}/start" }
  - { priority: 68, category: business_fiscal, check: "sum of ordered_tons over CustomerOrder rows already holding scheduled_run_id == run_id, plus this order's ordered_tons, <= ProductionRun.pulp_draw_tons", error_id: ERR_RUN_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /customer-orders/{id}/schedule" }
  - { priority: 69, category: business_fiscal, check: "the steam header has headroom for the request per calculations.steam_waterfall_dispatch (remaining > 0.000 and remaining >= MIN_VIABLE_TPH when a curtailed grant would result)", error_id: ERR_STEAM_HEADER_SATURATED, http_status: 409, applies_to: "POST /steam-allocations" }
  - { priority: 70, category: business_fiscal, check: "FiberPurchaseOrder.received_net_tons == 0.00 for cancellation, and CustomerOrder.allocated_tons == 0.000 for cancellation (zero-tonnage boundary)", error_id: ERR_TONNAGE_ALREADY_BOOKED, http_status: 409, applies_to: "POST /fiber-purchase-orders/{id}/cancel, POST /customer-orders/{id}/cancel" }
  - { priority: 71, category: business_fiscal, check: "shortfall_tons > 0.000 (an order with nothing outstanding cannot be short-closed)", error_id: ERR_NO_SHORTFALL, http_status: 409, applies_to: "POST /customer-orders/{id}/short-close" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- logical clock (test-driving, /_ namespace) --------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and NEVER falls back to real wall-clock time; every deadline, rolling window and posture recomputation reads this clock."
    roles: [MillPlanner, EnvironmentalOfficer, EnergyManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["recomputes no entity state; subsequent writes stamp created_at / updated_at / posture_changed_at from the new instant"]

  # ---- parties and configuration ------------------------------------------
  - method: POST
    path: "/customers"
    description: "Registers a paper customer with its roll-spec envelope."
    roles: [MillPlanner]
    code: 201
    input: [name, allocation_priority_tier, max_roll_diameter_mm, max_roll_width_mm, wrap_spec]
    output: Customer
    side_effects: ["Customer.status initialised to ACTIVE"]
  - method: GET
    path: "/customers/{id}"
    description: "Reads one customer."
    roles: [MillPlanner, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: PATCH
    path: "/customers/{id}/status"
    description: "Suspends or reinstates a customer."
    roles: [MillPlanner]
    code: 200
    input: [status]
    output: Customer
    side_effects: ["SUSPENDED customers can no longer create or schedule orders (§1.4 priority 33)"]
  - method: POST
    path: "/suppliers"
    description: "Registers a recovered-fiber supplier."
    roles: [FiberBuyer]
    code: 201
    input: [name, freight_per_ton]
    output: Supplier
    side_effects: ["contamination_strike_count = 0, qualification_status = QUALIFIED"]
  - method: GET
    path: "/suppliers/{id}"
    description: "Reads one supplier including its strike count and qualification posture."
    roles: [FiberBuyer, MillPlanner, Supplier]
    code: 200
    input: []
    output: Supplier
    side_effects: []
  - method: POST
    path: "/fiber-grades"
    description: "Declares a recovered-fiber grade with its contamination and moisture ceilings and its downgrade fallback."
    roles: [FiberBuyer]
    code: 201
    input: [grade_code, index_symbol, max_contamination_pct, max_moisture_pct, nominal_yield_pct, deink_required, "downgrade_target_grade_code?", rank_order]
    output: FiberGrade
    side_effects: []
  - method: GET
    path: "/fiber-grades"
    description: "Lists recovered-fiber grades."
    roles: [FiberBuyer, MillPlanner, QualityLab, MachineOperator]
    code: 200
    input: ["grade_code?", "index_symbol?", "limit?", "offset?"]
    output: FiberGrade[]
    side_effects: []
  - method: POST
    path: "/market-index-quotes"
    description: "Publishes a market index price for a symbol and month. A second quote for the same (index_symbol, effective_month) flips the earlier row's superseded to true."
    roles: [FiberBuyer]
    code: 201
    input: [index_symbol, effective_month, published_price_per_ton]
    output: MarketIndexQuote
    side_effects: ["sets superseded = true on any existing non-superseded row with the same (index_symbol, effective_month)"]
  - method: GET
    path: "/market-index-quotes"
    description: "Lists published index quotes."
    roles: [FiberBuyer, MillPlanner]
    code: 200
    input: ["index_symbol?", "effective_month?", "superseded?", "limit?", "offset?"]
    output: MarketIndexQuote[]
    side_effects: []
  - method: POST
    path: "/paper-grade-specs"
    description: "Declares a finished paper grade with basis weight, moisture, strength and brightness targets."
    roles: [MillPlanner]
    code: 201
    input: [product_code, family, basis_weight_gsm, target_moisture_pct, moisture_tolerance_pct, min_sct_kn_m, "min_brightness_iso?", requires_deink_pulp, rank_order]
    output: PaperGradeSpec
    side_effects: []
  - method: GET
    path: "/paper-grade-specs"
    description: "Lists finished paper grade specs."
    roles: [MillPlanner, MachineOperator, QualityLab, Customer]
    code: 200
    input: ["product_code?", "family?", "limit?", "offset?"]
    output: PaperGradeSpec[]
    side_effects: []
  - method: POST
    path: "/paper-machines"
    description: "Registers a paper machine with its deckle, rate, changeover buffer and steam intensity."
    roles: [MillPlanner]
    code: 201
    input: [name, wire_width_mm, max_tons_per_hour, changeover_buffer_minutes, steam_tph_per_ton]
    output: PaperMachine
    side_effects: ["status initialised to RUNNABLE, version = 1"]
  - method: GET
    path: "/paper-machines/{id}"
    description: "Reads one paper machine including its version for OCC use."
    roles: [MillPlanner, MachineOperator, EnergyManager]
    code: 200
    input: []
    output: PaperMachine
    side_effects: []
  - method: PATCH
    path: "/paper-machines/{id}/status"
    description: "Takes a machine down or returns it to service."
    roles: [MillPlanner]
    code: 200
    input: [status, expected_machine_version]
    output: PaperMachine
    side_effects: ["increments PaperMachine.version by 1", "DOWN blocks run starts (§1.4 priority 31)"]

  # ---- fiber procurement --------------------------------------------------
  - method: POST
    path: "/fiber-purchase-orders"
    description: "Creates a DRAFT recovered-fiber purchase order against a supplier and grade."
    roles: [FiberBuyer]
    code: 201
    input: [supplier_id, fiber_grade_code, contracted_tons, index_basis, priced_for_month, negotiated_delta_per_ton]
    output: FiberPurchaseOrder
    side_effects: ["status = DRAFT, pricing_revision_count = 0, received_net_tons = 0.00, version = 1"]
  - method: GET
    path: "/fiber-purchase-orders/{id}"
    description: "Reads one purchase order including its priced fields and version."
    roles: [FiberBuyer, MillPlanner, Supplier]
    code: 200
    input: []
    output: FiberPurchaseOrder
    side_effects: []
  - method: GET
    path: "/fiber-purchase-orders"
    description: "Lists purchase orders, filterable by supplier, grade and status."
    roles: [FiberBuyer, MillPlanner, Supplier]
    code: 200
    input: ["supplier_id?", "fiber_grade_code?", "status?", "limit?", "offset?"]
    output: FiberPurchaseOrder[]
    side_effects: []
  - method: POST
    path: "/fiber-purchase-orders/{id}/price"
    description: "Prices a DRAFT purchase order off the published index."
    roles: [FiberBuyer]
    code: 200
    input: [expected_purchase_order_version]
    output: FiberPurchaseOrder
    side_effects: ["runs calculations.indexed_fiber_unit_price", "status DRAFT -> PRICED", "increments FiberPurchaseOrder.version by 1"]
  - method: POST
    path: "/fiber-purchase-orders/{id}/withdraw-pricing"
    description: "Returns a PRICED order to DRAFT so it can be repriced against a newer index quote."
    roles: [FiberBuyer]
    code: 200
    input: [expected_purchase_order_version]
    output: FiberPurchaseOrder
    side_effects: ["status PRICED -> DRAFT", "increments pricing_revision_count by 1", "clears the three priced fields and index_quote_month_used", "increments FiberPurchaseOrder.version by 1"]
  - method: POST
    path: "/fiber-purchase-orders/{id}/confirm"
    description: "Supplier accepts the priced order."
    roles: [Supplier]
    code: 200
    input: []
    output: FiberPurchaseOrder
    side_effects: ["status PRICED -> CONFIRMED", "increments FiberPurchaseOrder.version by 1"]
  - method: POST
    path: "/fiber-purchase-orders/{id}/cancel"
    description: "Cancels an order that has taken no accepted tonnage."
    roles: [FiberBuyer]
    code: 200
    input: []
    output: FiberPurchaseOrder
    side_effects: ["status -> CANCELLED", "flips every SAMPLED FiberReceipt of the order to REJECTED with dispositioned_by_user_id left null (no supplier strike)", "increments FiberPurchaseOrder.version by 1"]
  - method: POST
    path: "/fiber-purchase-orders/{id}/receipts"
    description: "Records an inbound truck with its per-sublot weights and lab sample results."
    roles: [QualityLab]
    code: 201
    input: [truck_reference, sublots]
    output: FiberReceipt
    side_effects: ["runs calculations.receipt_net_tons", "status = SAMPLED", "sets sampled_by_user_id = X-User-ID", "copies supplier_id and declared_grade_code from the parent order"]
  - method: GET
    path: "/fiber-receipts/{id}"
    description: "Reads one receipt with its computed net tonnage and weighted sample results."
    roles: [QualityLab, FiberBuyer, Supplier, MillPlanner]
    code: 200
    input: []
    output: FiberReceipt
    side_effects: []
  - method: GET
    path: "/fiber-receipts"
    description: "Lists receipts, filterable by purchase order, supplier and status."
    roles: [QualityLab, FiberBuyer, Supplier, MillPlanner]
    code: 200
    input: ["purchase_order_id?", "supplier_id?", "status?", "limit?", "offset?"]
    output: FiberReceipt[]
    side_effects: []
  - method: POST
    path: "/fiber-receipts/{id}/disposition"
    description: "Accepts, downgrades or rejects a sampled truck. Fires the supplier-strike cascade on DOWNGRADE and REJECT."
    roles: [QualityLab]
    code: 200
    input: [disposition]
    output: FiberReceipt
    side_effects: ["status SAMPLED -> ACCEPTED | DOWNGRADED | REJECTED", "creates a FiberInventoryLot on ACCEPTED and DOWNGRADED", "updates FiberPurchaseOrder.received_net_tons and may auto-close it", "runs calculations.supplier_qualification_posture on DOWNGRADED and REJECTED, then the quarantine -> batch-cancel -> run-abort cascade"]
  - method: GET
    path: "/fiber-inventory-lots/{id}"
    description: "Reads one fiber inventory lot with its tonnage ledger."
    roles: [MachineOperator, MillPlanner, QualityLab]
    code: 200
    input: []
    output: FiberInventoryLot
    side_effects: []
  - method: GET
    path: "/fiber-inventory-lots"
    description: "Lists fiber inventory lots, filterable by receipt, grade and status."
    roles: [MachineOperator, MillPlanner, QualityLab]
    code: 200
    input: ["receipt_id?", "grade_code?", "status?", "limit?", "offset?"]
    output: FiberInventoryLot[]
    side_effects: []

  # ---- pulping, screening, cleaning, deinking ------------------------------
  - method: POST
    path: "/pulp-batches"
    description: "Queues a pulper charge with its furnish recipe."
    roles: [MachineOperator]
    code: 201
    input: [pulper_line, target_product_code, furnish_lines]
    output: PulpBatch
    side_effects: ["status = QUEUED", "computes charged_tons and blend_contamination_pct from the referenced lots"]
  - method: GET
    path: "/pulp-batches/{id}"
    description: "Reads one pulp batch with both yield figures and its chemical ledger."
    roles: [MachineOperator, QualityLab, MillPlanner]
    code: 200
    input: []
    output: PulpBatch
    side_effects: []
  - method: GET
    path: "/pulp-batches"
    description: "Lists pulp batches, filterable by status, target product and consumed lot."
    roles: [MachineOperator, QualityLab, MillPlanner]
    code: 200
    input: ["status?", "target_product_code?", "inventory_lot_id?", "pulper_line?", "limit?", "offset?"]
    output: PulpBatch[]
    side_effects: []
  - method: POST
    path: "/pulp-batches/{id}/start"
    description: "Charges the pulper: reserves furnish tonnage and pins the provisional yield."
    roles: [MachineOperator]
    code: 200
    input: []
    output: PulpBatch
    side_effects: ["status QUEUED -> PULPING", "adds tons_charged into each FiberInventoryLot.tons_consumed and may flip lots to DEPLETED", "runs calculations.pulp_yield_provisional"]
  - method: POST
    path: "/pulp-batches/{id}/screen"
    description: "Marks screening complete."
    roles: [MachineOperator]
    code: 200
    input: []
    output: PulpBatch
    side_effects: ["status PULPING -> SCREENED"]
  - method: POST
    path: "/pulp-batches/{id}/clean"
    description: "Records the weighed screening and cleaning reject."
    roles: [MachineOperator]
    code: 200
    input: [measured_reject_tons]
    output: PulpBatch
    side_effects: ["status SCREENED -> CLEANED", "appends a PULP_REJECT RejectStream row with dry_solids_tons = measured_reject_tons and disposition = PENDING"]
  - method: POST
    path: "/pulp-batches/{id}/deink"
    description: "Starts a deink and bleach pass with a chemical charge set."
    roles: [MachineOperator]
    code: 200
    input: [caustic_kg, peroxide_kg, surfactant_kg]
    output: PulpBatch
    side_effects: ["status CLEANED -> DEINKING or DEINK_HOLD -> DEINKING", "stores the pass charges"]
  - method: POST
    path: "/pulp-batches/{id}/brightness"
    description: "Records the measured ISO brightness of the pass in flight; passes or holds the batch."
    roles: [QualityLab]
    code: 200
    input: [brightness_iso]
    output: PulpBatch
    side_effects: ["increments deink_pass_count", "runs calculations.deink_chemical_cost and appends a DEINK_SLUDGE RejectStream row", "status DEINKING -> APPROVED when brightness_iso >= PaperGradeSpec.min_brightness_iso, else DEINKING -> DEINK_HOLD", "runs calculations.pulp_yield_final on the APPROVED branch"]
  - method: POST
    path: "/pulp-batches/{id}/approve"
    description: "Approves a cleaned batch that needs no deinking."
    roles: [QualityLab]
    code: 200
    input: []
    output: PulpBatch
    side_effects: ["status CLEANED -> APPROVED", "runs calculations.pulp_yield_final and sets yield_variance_tons and available_tons"]
  - method: POST
    path: "/pulp-batches/{id}/divert"
    description: "Diverts a batch that failed brightness after its allowed passes; aborts every run scheduled on it."
    roles: [MillPlanner]
    code: 200
    input: []
    output: PulpBatch
    side_effects: ["status DEINK_HOLD -> DIVERTED", "zeroes final_accepted_tons and available_tons", "cascade: SCHEDULED runs on this batch -> ABORTED / CONDEMNED, their orders -> SUBMITTED with deschedule_count incremented, machine windows released"]
  - method: POST
    path: "/pulp-batches/{id}/cancel"
    description: "Cancels a queued or pulping batch, releasing any furnish reservation."
    roles: [MillPlanner]
    code: 200
    input: []
    output: PulpBatch
    side_effects: ["status -> CANCELLED", "on the PULPING branch subtracts tons_charged back out of each FiberInventoryLot.tons_consumed and flips DEPLETED lots back to AVAILABLE"]

  # ---- paper machine runs --------------------------------------------------
  - method: POST
    path: "/paper-machines/{id}/runs"
    description: "Schedules a production run on a machine window against an approved pulp batch."
    roles: [MillPlanner]
    code: 201
    input: [product_code, pulp_batch_id, window_start, window_end, pulp_draw_tons, expected_machine_version]
    output: ProductionRun
    side_effects: ["run_status = SCHEDULED, quality_status = PENDING", "checks the closed buffered occupancy interval (§1.4 priority 63)", "increments PaperMachine.version by 1"]
  - method: GET
    path: "/paper-machines/{id}/runs"
    description: "Lists the runs scheduled on one machine."
    roles: [MillPlanner, MachineOperator, QualityLab]
    code: 200
    input: ["run_status?", "quality_status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []
  - method: GET
    path: "/production-runs/{id}"
    description: "Reads one production run with both status axes and both quality indexes."
    roles: [MillPlanner, MachineOperator, QualityLab, Customer]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: GET
    path: "/production-runs"
    description: "Lists production runs, filterable by machine, pulp batch, product and either status axis."
    roles: [MillPlanner, MachineOperator, QualityLab]
    code: 200
    input: ["machine_id?", "pulp_batch_id?", "product_code?", "run_status?", "quality_status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []
  - method: POST
    path: "/paper-machines/{machine_id}/runs/{run_id}/start"
    description: "Starts a scheduled run: draws pulp, gates on the effluent permit posture."
    roles: [MachineOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["run_status SCHEDULED -> RUNNING", "adds pulp_draw_tons into PulpBatch.consumed_tons", "sets started_by_user_id = X-User-ID", "scheduled CustomerOrders move SCHEDULED -> IN_PRODUCTION", "increments PaperMachine.version by 1"]
  - method: POST
    path: "/paper-machines/{machine_id}/runs/{run_id}/complete"
    description: "Completes a run with its reel readings and broke tonnage; opens the quality axis."
    roles: [MachineOperator]
    code: 200
    input: [reel_readings, broke_tons]
    output: ProductionRun
    side_effects: ["run_status RUNNING -> COMPLETED", "quality_status PENDING -> PROVISIONAL with provisional_quality_index and off_spec_reel_count set", "appends a MACHINE_BROKE RejectStream row when broke_tons > 0.000", "sets PaperMachine.current_product_code", "flips PLANNED GradeChange rows with from_run_id == this run to EXECUTED and appends their TRANSITION_WASTE RejectStream row", "increments PaperMachine.version by 1"]
  - method: POST
    path: "/paper-machines/{machine_id}/runs/{run_id}/abort"
    description: "Aborts a running run, returning drawn pulp and scrapping produced rolls."
    roles: [MillPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["run_status RUNNING -> ABORTED, quality_status -> CONDEMNED", "subtracts pulp_draw_tons back out of PulpBatch.consumed_tons", "WOUND and WRAPPED RollSets -> SCRAPPED with a MACHINE_BROKE RejectStream row each", "scheduled orders return to SUBMITTED with deschedule_count incremented", "increments PaperMachine.version by 1"]
  - method: POST
    path: "/paper-machines/{machine_id}/runs/{run_id}/certify"
    description: "Certifies run quality from the tonnage-weighted all-reel index."
    roles: [QualityLab]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["quality_status PROVISIONAL -> CERTIFIED", "runs calculations.run_quality_index_certified", "sets certified_by_user_id = X-User-ID", "makes WRAPPED roll sets allocatable"]
  - method: POST
    path: "/paper-machines/{machine_id}/runs/{run_id}/hold"
    description: "Holds run quality; quarantines every roll set of the run and unwinds allocations."
    roles: [QualityLab]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["quality_status PROVISIONAL -> HELD", "runs calculations.run_quality_index_certified", "cascade: roll sets -> QUARANTINED with allocated_order_id cleared, affected orders recompute allocated_tons and fall back ALLOCATED -> PARTIALLY_ALLOCATED"]
  - method: POST
    path: "/paper-machines/{machine_id}/runs/{run_id}/rework"
    description: "Sends a held run to rework, rewinding its quarantined roll sets."
    roles: [MillPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["quality_status HELD -> REWORK", "QUARANTINED roll sets -> REWOUND with rewind_count incremented"]
  - method: POST
    path: "/paper-machines/{machine_id}/runs/{run_id}/resubmit-quality"
    description: "Resubmits corrected reel readings after rework, returning the run to the provisional quality state."
    roles: [QualityLab]
    code: 200
    input: [reel_readings]
    output: ProductionRun
    side_effects: ["quality_status REWORK -> PROVISIONAL", "replaces reel_readings and recomputes off_spec_reel_count and provisional_quality_index"]
  - method: POST
    path: "/paper-machines/{machine_id}/runs/{run_id}/condemn"
    description: "Condemns a held run; every roll set is scrapped into the solids ledger."
    roles: [MillPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["quality_status HELD -> CONDEMNED", "all roll sets -> SCRAPPED, each appending a MACHINE_BROKE RejectStream row", "recomputes produced_tons to 0.000"]

  # ---- grade changes ------------------------------------------------------
  - method: POST
    path: "/paper-machines/{id}/grade-changes"
    description: "Plans a grade transition between two runs on the machine and computes its waste and duration."
    roles: [MillPlanner]
    code: 201
    input: [from_run_id, to_run_id, expected_machine_version]
    output: GradeChange
    side_effects: ["status = PLANNED", "runs calculations.grade_change_transition_waste", "increments PaperMachine.version by 1"]
  - method: GET
    path: "/grade-changes/{id}"
    description: "Reads one planned or executed grade change."
    roles: [MillPlanner, MachineOperator]
    code: 200
    input: []
    output: GradeChange
    side_effects: []
  - method: GET
    path: "/grade-changes"
    description: "Lists grade changes, filterable by machine and by either linked run."
    roles: [MillPlanner, MachineOperator]
    code: 200
    input: ["machine_id?", "from_run_id?", "to_run_id?", "status?", "limit?", "offset?"]
    output: GradeChange[]
    side_effects: []
  - method: POST
    path: "/grade-changes/{id}/void"
    description: "Voids a planned grade change."
    roles: [MillPlanner]
    code: 200
    input: []
    output: GradeChange
    side_effects: ["status PLANNED -> VOIDED; no RejectStream row is appended because none was created at planning time"]

  # ---- roll finishing -----------------------------------------------------
  - method: POST
    path: "/production-runs/{id}/roll-sets"
    description: "Records a wound roll set produced by the run."
    roles: [MachineOperator]
    code: 201
    input: [slit_width_mm, diameter_mm, roll_count, net_tons]
    output: RollSet
    side_effects: ["status = WOUND", "recomputes ProductionRun.produced_tons"]
  - method: GET
    path: "/roll-sets/{id}"
    description: "Reads one roll set including its allocation and rewind history."
    roles: [MachineOperator, MillPlanner, QualityLab, Customer]
    code: 200
    input: []
    output: RollSet
    side_effects: []
  - method: GET
    path: "/roll-sets"
    description: "Lists roll sets, filterable by producing run, allocated order and status."
    roles: [MachineOperator, MillPlanner, QualityLab, Customer]
    code: 200
    input: ["production_run_id?", "allocated_order_id?", "status?", "limit?", "offset?"]
    output: RollSet[]
    side_effects: []
  - method: POST
    path: "/roll-sets/{id}/wrap"
    description: "Wraps a wound roll set to a wrap specification."
    roles: [MachineOperator]
    code: 200
    input: [wrap_spec]
    output: RollSet
    side_effects: ["status WOUND -> WRAPPED", "stores wrap_spec"]
  - method: POST
    path: "/roll-sets/{id}/allocate"
    description: "Allocates a wrapped roll set from a certified run to a customer order."
    roles: [MillPlanner]
    code: 200
    input: [order_id, expected_order_version]
    output: RollSet
    side_effects: ["status WRAPPED -> ALLOCATED, sets allocated_order_id", "recomputes CustomerOrder.allocated_tons and shortfall_tons via calculations.order_allocation_ledger and drives the order's status bubble-up", "increments CustomerOrder.version by 1"]
  - method: POST
    path: "/roll-sets/{id}/quarantine"
    description: "Quarantines a wound or wrapped roll set."
    roles: [QualityLab]
    code: 200
    input: [quarantine_reason]
    output: RollSet
    side_effects: ["status -> QUARANTINED", "recomputes ProductionRun.produced_tons"]
  - method: POST
    path: "/roll-sets/{id}/rewind"
    description: "Sends a quarantined roll set to the rewinder."
    roles: [MachineOperator]
    code: 200
    input: []
    output: RollSet
    side_effects: ["status QUARANTINED -> REWOUND", "increments rewind_count by 1"]
  - method: POST
    path: "/roll-sets/{id}/rewind-complete"
    description: "Finishes a rewind with the new roll geometry and net tonnage; the lost tonnage enters the solids ledger."
    roles: [MachineOperator]
    code: 200
    input: [slit_width_mm, diameter_mm, roll_count, net_tons]
    output: RollSet
    side_effects: ["status REWOUND -> WOUND", "appends a MACHINE_BROKE RejectStream row for the tonnage lost in the rewind when that difference > 0.000", "recomputes ProductionRun.produced_tons"]
  - method: POST
    path: "/roll-sets/{id}/scrap"
    description: "Scraps a quarantined or rewound roll set."
    roles: [MillPlanner]
    code: 200
    input: []
    output: RollSet
    side_effects: ["status -> SCRAPPED", "appends a MACHINE_BROKE RejectStream row with dry_solids_tons = net_tons", "recomputes ProductionRun.produced_tons"]

  # ---- customer orders ----------------------------------------------------
  - method: POST
    path: "/customer-orders"
    description: "Customer submits an order for a paper grade with a roll specification."
    roles: [Customer]
    code: 201
    input: [customer_id, product_code, ordered_tons, requested_ship_date, roll_width_mm, roll_diameter_mm, wrap_spec]
    output: CustomerOrder
    side_effects: ["status = SUBMITTED, allocated_tons = 0.000, shortfall_tons = ordered_tons, version = 1"]
  - method: GET
    path: "/customer-orders/{id}"
    description: "Reads one order with its allocation ledger and version."
    roles: [Customer, MillPlanner]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: []
  - method: GET
    path: "/customer-orders"
    description: "Lists orders, filterable by customer, scheduled run and status."
    roles: [Customer, MillPlanner]
    code: 200
    input: ["customer_id?", "scheduled_run_id?", "product_code?", "status?", "limit?", "offset?"]
    output: CustomerOrder[]
    side_effects: []
  - method: POST
    path: "/customer-orders/{id}/schedule"
    description: "Sequences an order onto a scheduled production run."
    roles: [MillPlanner]
    code: 200
    input: [run_id, expected_order_version]
    output: CustomerOrder
    side_effects: ["status SUBMITTED -> SCHEDULED, sets scheduled_run_id", "increments CustomerOrder.version by 1"]
  - method: POST
    path: "/customer-orders/{id}/deschedule"
    description: "Removes an order from its run and returns it to the unscheduled pool."
    roles: [MillPlanner]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: ["status SCHEDULED -> SUBMITTED, clears scheduled_run_id, increments deschedule_count by 1", "increments CustomerOrder.version by 1"]
  - method: POST
    path: "/customer-orders/{id}/ship"
    description: "Ships a fully allocated order from a certified run."
    roles: [MillPlanner]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: ["status ALLOCATED -> SHIPPED", "every allocated RollSet -> SHIPPED", "recomputes shipped_tons", "increments CustomerOrder.version by 1"]
  - method: POST
    path: "/customer-orders/{id}/short-close"
    description: "Closes a partially allocated order short, freezing its shortfall."
    roles: [MillPlanner]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: ["status PARTIALLY_ALLOCATED -> SHORT_CLOSED", "freezes shortfall_tons", "allocated RollSets -> SHIPPED", "increments CustomerOrder.version by 1"]
  - method: POST
    path: "/customer-orders/{id}/cancel"
    description: "Customer cancels an unallocated order."
    roles: [Customer]
    code: 200
    input: []
    output: CustomerOrder
    side_effects: ["status SUBMITTED -> CANCELLED", "increments CustomerOrder.version by 1"]

  # ---- water treatment, effluent permitting, sludge -----------------------
  - method: POST
    path: "/effluent-permits"
    description: "Registers the mill's discharge permit with its rolling-average limits."
    roles: [EnvironmentalOfficer]
    code: 201
    input: [permit_number, bod_limit_kg_per_day, tss_limit_kg_per_day, flow_limit_m3_per_day, rolling_window_days]
    output: EffluentPermit
    side_effects: ["compliance_posture = COMPLIANT with all rolling figures 0.000"]
  - method: GET
    path: "/effluent-permits/{id}"
    description: "Reads the permit with its rolling loads and derived posture."
    roles: [EnvironmentalOfficer, MillPlanner, MachineOperator]
    code: 200
    input: []
    output: EffluentPermit
    side_effects: []
  - method: POST
    path: "/effluent-permits/{id}/readings"
    description: "Logs one calendar day of discharge and recomputes the rolling compliance posture."
    roles: [EnvironmentalOfficer]
    code: 201
    input: [reading_date, flow_m3, bod_kg, tss_kg]
    output: EffluentReading
    side_effects: ["sets logged_by_user_id = X-User-ID", "runs calculations.effluent_rolling_compliance", "posture transitions may fire the LAND_APPLICATION manifest void cascade"]
  - method: GET
    path: "/effluent-permits/{id}/readings"
    description: "Lists the readings logged against one permit."
    roles: [EnvironmentalOfficer, MillPlanner]
    code: 200
    input: ["voided?", "limit?", "offset?"]
    output: EffluentReading[]
    side_effects: []
  - method: GET
    path: "/effluent-readings/{id}"
    description: "Reads one effluent reading."
    roles: [EnvironmentalOfficer, MillPlanner]
    code: 200
    input: []
    output: EffluentReading
    side_effects: []
  - method: POST
    path: "/effluent-readings/{id}/void"
    description: "Voids a mis-recorded reading, removing it from the rolling window."
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: EffluentReading
    side_effects: ["sets voided = true", "reruns calculations.effluent_rolling_compliance, which may recover the posture to WATCH or COMPLIANT"]
  - method: POST
    path: "/sludge-manifests"
    description: "Prepares a hauler manifest claiming pending reject and sludge tonnage."
    roles: [EnvironmentalOfficer]
    code: 201
    input: [manifest_number, destination, reject_stream_ids]
    output: SludgeManifest
    side_effects: ["status = DRAFT", "sets prepared_by_user_id = X-User-ID", "computes total_dry_solids_tons; the claimed RejectStream rows stay PENDING until signing"]
  - method: GET
    path: "/sludge-manifests/{id}"
    description: "Reads one sludge manifest."
    roles: [EnvironmentalOfficer, MillPlanner]
    code: 200
    input: []
    output: SludgeManifest
    side_effects: []
  - method: POST
    path: "/sludge-manifests/{id}/sign"
    description: "Signs a manifest, moving its claimed tonnage from pending to manifested."
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: SludgeManifest
    side_effects: ["status DRAFT -> SIGNED", "sets signed_by_user_id = X-User-ID", "each claimed RejectStream row gets manifest_id set and disposition PENDING -> MANIFESTED"]
  - method: POST
    path: "/sludge-manifests/{id}/void"
    description: "Voids a manifest, returning its tonnage to the pending pool."
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: SludgeManifest
    side_effects: ["status -> VOIDED", "each claimed RejectStream row has manifest_id cleared and disposition returned to PENDING (compensating action for signing; net_solids_tons unchanged)"]
  - method: GET
    path: "/reject-streams/{id}"
    description: "Reads one reject, sludge, broke or transition-waste row."
    roles: [EnvironmentalOfficer, MillPlanner, QualityLab]
    code: 200
    input: []
    output: RejectStream
    side_effects: []
  - method: GET
    path: "/reject-streams"
    description: "Lists solids-ledger rows, filterable by source, manifest, reversal linkage, kind and disposition."
    roles: [EnvironmentalOfficer, MillPlanner, QualityLab]
    code: 200
    input: ["source_ref_id?", "manifest_id?", "reversal_of_id?", "source_kind?", "disposition?", "limit?", "offset?"]
    output: RejectStream[]
    side_effects: []
  - method: POST
    path: "/reject-streams/{id}/reverse"
    description: "Reverses a pending solids row that was weighed in error by appending a compensating negative row."
    roles: [EnvironmentalOfficer]
    code: 201
    input: []
    output: RejectStream
    side_effects: ["appends a new RejectStream row with reversal_of_id = the addressed row and the same dry_solids_tons, which counts NEGATIVE in every solids aggregation", "flips the addressed row's disposition PENDING -> REPULPED", "net_solids_tons drops by exactly the reversed tonnage while the ledger invariant holds"]
  - method: GET
    path: "/reject-streams/summary"
    description: "Mill-wide solids ledger with the manifested / unmanifested split."
    roles: [EnvironmentalOfficer, MillPlanner]
    code: 200
    input: []
    output: { gross_solids_tons: number, reversed_solids_tons: number, net_solids_tons: number, manifested_dry_solids_tons: number, unmanifested_dry_solids_tons: number, repulped_dry_solids_tons: number }
    side_effects: []
  - method: GET
    path: "/mill/fiber-balance"
    description: "Mill-wide recovered-fiber tonnage ledger and its imbalance figure."
    roles: [MillPlanner, FiberBuyer, MachineOperator]
    code: 200
    input: []
    output: { total_received_tons: number, total_consumed_tons: number, total_available_tons: number, imbalance_tons: number }
    side_effects: []

  # ---- energy: steam balance and cogeneration -----------------------------
  - method: POST
    path: "/steam-allocations"
    description: "Requests steam header capacity for a half-open window; grants, curtails or rejects it by the waterfall."
    roles: [EnergyManager]
    code: 201
    input: [consumer_kind, "consumer_ref_id?", window_start, window_end, demand_tph, priority_rank]
    output: SteamAllocation
    side_effects: ["runs calculations.steam_waterfall_dispatch to set granted_tph, curtailed_tph and status", "runs calculations.cogen_credit to set cogen_credit_usd"]
  - method: GET
    path: "/steam-allocations/{id}"
    description: "Reads one steam allocation with its grant, curtailment and cogeneration credit."
    roles: [EnergyManager, MillPlanner]
    code: 200
    input: []
    output: SteamAllocation
    side_effects: []
  - method: GET
    path: "/steam-allocations"
    description: "Lists steam allocations, filterable by consumer and status."
    roles: [EnergyManager, MillPlanner]
    code: 200
    input: ["consumer_ref_id?", "consumer_kind?", "status?", "limit?", "offset?"]
    output: SteamAllocation[]
    side_effects: []
  - method: POST
    path: "/steam-allocations/{id}/release"
    description: "Releases a granted or curtailed allocation, freeing header capacity."
    roles: [EnergyManager]
    code: 200
    input: []
    output: SteamAllocation
    side_effects: ["status -> RELEASED with granted_tph set to 0.000 and curtailed_tph set to demand_tph", "released capacity is available to later requests but existing allocations are NOT re-dispatched"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- authentication / authorization --------------------------------------
  - { id: ERR_MISSING_AUTH_HEADERS, http: 401, condition: "X-User-Role or X-User-ID header absent or empty" }
  - { id: ERR_UNKNOWN_ROLE, http: 401, condition: "X-User-Role is not one of the eight declared roles" }
  - { id: ERR_IDENTITY_NOT_FOUND, http: 401, condition: "X-User-ID does not resolve to a row of the entity backing an entity_backed role" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "acting role is not listed in the endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Supplier acts on a purchase order it does not own, or Customer acts on another customer's order or profile" }
  # ---- existence -----------------------------------------------------------
  - { id: ERR_SUPPLIER_NOT_FOUND, http: 404, condition: "supplier id in the path does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customer id in the path does not exist" }
  - { id: ERR_PURCHASE_ORDER_NOT_FOUND, http: 404, condition: "purchase order id in the path does not exist" }
  - { id: ERR_RECEIPT_NOT_FOUND, http: 404, condition: "fiber receipt id in the path does not exist" }
  - { id: ERR_INVENTORY_LOT_NOT_FOUND, http: 404, condition: "fiber inventory lot id in the path does not exist" }
  - { id: ERR_PULP_BATCH_NOT_FOUND, http: 404, condition: "pulp batch id in the path does not exist" }
  - { id: ERR_MACHINE_NOT_FOUND, http: 404, condition: "paper machine id in the path does not exist" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "production run id in the path does not exist, or is not a run of the addressed machine" }
  - { id: ERR_GRADE_CHANGE_NOT_FOUND, http: 404, condition: "grade change id in the path does not exist" }
  - { id: ERR_ROLL_SET_NOT_FOUND, http: 404, condition: "roll set id in the path does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "customer order id in the path does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "effluent permit id in the path does not exist" }
  - { id: ERR_ENV_RECORD_NOT_FOUND, http: 404, condition: "effluent reading, sludge manifest or reject stream id in the path does not exist" }
  - { id: ERR_STEAM_ALLOCATION_NOT_FOUND, http: 404, condition: "steam allocation id in the path does not exist" }
  - { id: ERR_GRADE_CODE_NOT_FOUND, http: 404, condition: "body fiber_grade_code, target_product_code or product_code does not resolve to a declared grade or spec" }
  - { id: ERR_PARTY_NOT_FOUND, http: 404, condition: "body supplier_id or customer_id does not resolve" }
  - { id: ERR_FURNISH_REFERENCE_NOT_FOUND, http: 404, condition: "a furnish_lines[].inventory_lot_id or body pulp_batch_id does not resolve" }
  - { id: ERR_LINK_TARGET_NOT_FOUND, http: 404, condition: "body run_id, from_run_id, to_run_id or order_id does not resolve to a row of the required type" }
  - { id: ERR_REJECT_STREAM_REFERENCE_INVALID, http: 404, condition: "a reject_stream_ids[] entry does not resolve, or resolves to a reversal row" }
  # ---- request shape -------------------------------------------------------
  - { id: ERR_INVALID_PAGINATION, http: 400, condition: "limit outside 1..100 or offset negative or non-integer" }
  - { id: ERR_VALIDATION, http: 422, condition: "missing required field, wrong type, out-of-range number, undeclared enum member, unparseable datetime, or array cardinality / unique-key violation" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window_end is not strictly after window_start, or rewind-complete net_tons exceeds the pre-rewind net_tons" }
  # ---- state ---------------------------------------------------------------
  - { id: ERR_PURCHASE_ORDER_INVALID_STATE, http: 409, condition: "purchase order is not in the from-state the requested transition needs" }
  - { id: ERR_RECEIPT_INVALID_STATE, http: 409, condition: "fiber receipt is not SAMPLED when a disposition is requested" }
  - { id: ERR_PULP_BATCH_INVALID_STATE, http: 409, condition: "pulp batch is not in the from-state the requested pulping step needs" }
  - { id: ERR_RUN_INVALID_STATE, http: 409, condition: "production run's run_status axis is not in the required from-state, or the machine is DOWN" }
  - { id: ERR_QUALITY_INVALID_STATE, http: 409, condition: "production run's quality_status axis is not in the required from-state" }
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "customer order is not in the required from-state, or the customer is SUSPENDED" }
  - { id: ERR_ROLL_SET_INVALID_STATE, http: 409, condition: "roll set is not in the required from-state" }
  - { id: ERR_ENV_RECORD_INVALID_STATE, http: 409, condition: "manifest, reading, reject row, steam allocation or grade change is not in the required from-state" }
  - { id: ERR_RUN_NOT_CERTIFIED, http: 409, condition: "roll allocation, wrapping or order shipping attempted while the producing run's quality axis is not CERTIFIED (or run_status is not COMPLETED for wrapping)" }
  # ---- optimistic concurrency ---------------------------------------------
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version does not match CustomerOrder.version" }
  - { id: ERR_STALE_MACHINE_VERSION, http: 412, condition: "expected_machine_version does not match PaperMachine.version" }
  - { id: ERR_STALE_PURCHASE_ORDER_VERSION, http: 412, condition: "expected_purchase_order_version does not match FiberPurchaseOrder.version" }
  # ---- business_safety: environment, segregation of duties, contamination ---
  - { id: ERR_PERMIT_EXCEEDANCE_BLOCK, http: 409, condition: "run start attempted while the effluent permit posture is EXCEEDANCE" }
  - { id: ERR_LAND_APPLICATION_BARRED, http: 409, condition: "LAND_APPLICATION manifest prepared or signed while the permit posture is EXCEEDANCE" }
  - { id: ERR_SOD_SAME_SAMPLER, http: 409, condition: "the operator who sampled a truck attempts to disposition it" }
  - { id: ERR_SOD_SAME_OPERATOR, http: 409, condition: "the operator who started a run attempts to certify its quality" }
  - { id: ERR_SOD_SAME_ENV_OFFICER, http: 409, condition: "manifest signer prepared the manifest, or logged a reading inside the permit's current rolling window" }
  - { id: ERR_DISPOSITION_NOT_PERMITTED, http: 409, condition: "requested receipt disposition contradicts the measured contamination or moisture results" }
  - { id: ERR_LOT_NOT_AVAILABLE, http: 409, condition: "a furnish lot is QUARANTINED or DEPLETED at pulper charge time" }
  - { id: ERR_FURNISH_CONTAMINATION_EXCEEDED, http: 409, condition: "blend_contamination_pct above 3.500 at pulper charge time" }
  - { id: ERR_DEINK_PULP_REQUIRED, http: 409, condition: "run start on a product requiring deinked pulp with a batch whose deink_pass_count is 0" }
  - { id: ERR_WRONG_PULPER_LINE, http: 409, condition: "deink-required furnish charged on OCC_LINE, or a deink pass attempted off DIP_LINE" }
  # ---- business_constraint -------------------------------------------------
  - { id: ERR_SUPPLIER_SUSPENDED, http: 409, condition: "purchase order created or priced for a SUSPENDED supplier" }
  - { id: ERR_SUPPLIER_NOT_QUALIFIED, http: 409, condition: "confirmation attempted by a PROBATION supplier on a contract above 500.00 tons" }
  - { id: ERR_INDEX_QUOTE_MISSING, http: 422, condition: "no non-superseded market index quote exists for the resolved symbol and month" }
  - { id: ERR_REPRICE_LIMIT_REACHED, http: 409, condition: "third withdraw-pricing attempt on the same purchase order" }
  - { id: ERR_DEINK_PASS_LIMIT, http: 409, condition: "fourth deink pass attempted on the same batch" }
  - { id: ERR_DESCHEDULE_LIMIT, http: 409, condition: "fourth deschedule attempted on the same order" }
  - { id: ERR_REWIND_LIMIT, http: 409, condition: "third rewind attempted on the same roll set" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "uniqueness violation on a business key, rank_order, or (permit_id, reading_date) among non-voided readings" }
  - { id: ERR_ROLL_SPEC_MISMATCH, http: 409, condition: "roll set geometry or wrap does not satisfy the target order's roll specification" }
  - { id: ERR_CUSTOMER_SPEC_VIOLATION, http: 422, condition: "order roll specification exceeds the customer's declared envelope" }
  - { id: ERR_WIDTH_EXCEEDS_DECKLE, http: 409, condition: "roll slit width exceeds the producing machine's wire width" }
  - { id: ERR_REJECT_TONS_IMPLAUSIBLE, http: 422, condition: "measured_reject_tons above 40% of charged_tons" }
  - { id: ERR_PRODUCT_MISMATCH, http: 409, condition: "order product differs from the run's product, or the pulp batch's target product differs from the run's product" }
  # ---- business_temporal ---------------------------------------------------
  - { id: ERR_MACHINE_WINDOW_CONFLICT, http: 409, condition: "requested run window, widened by the machine's changeover buffer, intersects another scheduled or running window on that machine" }
  - { id: ERR_TRANSITION_GAP_TOO_SHORT, http: 409, condition: "gap between the outgoing and incoming run windows is shorter than the computed transition_minutes" }
  - { id: ERR_DATE_OUT_OF_RANGE, http: 422, condition: "reading_date after the logical clock's date, or steam window starting before the logical clock instant" }
  # ---- business_fiscal ----------------------------------------------------
  - { id: ERR_INSUFFICIENT_FIBER, http: 409, condition: "a furnish line charges more tons than the lot's tons_available" }
  - { id: ERR_INSUFFICIENT_PULP, http: 409, condition: "run start draws more pulp than the batch's available_tons, or the batch is not APPROVED" }
  - { id: ERR_RUN_CAPACITY_EXCEEDED, http: 409, condition: "scheduling this order would push the run's sequenced tonnage above pulp_draw_tons" }
  - { id: ERR_STEAM_HEADER_SATURATED, http: 409, condition: "steam header has no headroom, or only a sub-viable remainder, for the requested window" }
  - { id: ERR_TONNAGE_ALREADY_BOOKED, http: 409, condition: "cancellation attempted on a purchase order with accepted tonnage or an order with allocated tonnage" }
  - { id: ERR_NO_SHORTFALL, http: 409, condition: "short-close attempted on an order whose shortfall_tons is 0.000" }

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: MillPlanner
    description: "Owns scheduling: machines, paper grade specs, customers, run windows, grade changes, order sequencing, diversion and condemnation decisions."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers, PATCH /customers/{id}/status, POST /paper-grade-specs"
      - "POST /paper-machines, PATCH /paper-machines/{id}/status"
      - "POST /paper-machines/{id}/runs, POST /paper-machines/{id}/grade-changes, POST /grade-changes/{id}/void"
      - "POST /paper-machines/{machine_id}/runs/{run_id}/abort, /rework, /condemn"
      - "POST /pulp-batches/{id}/divert, POST /pulp-batches/{id}/cancel"
      - "POST /roll-sets/{id}/allocate, POST /roll-sets/{id}/scrap"
      - "POST /customer-orders/{id}/schedule, /deschedule, /ship, /short-close"
    shared_operations:
      - "GET reads across suppliers, purchase orders, receipts, lots, batches, runs, roll sets, orders, permits, solids ledger, steam allocations"
      - "POST /_clock/set_current_utc (with EnvironmentalOfficer and EnergyManager)"
  - name: FiberBuyer
    description: "Owns recovered-fiber procurement: grades, index quotes, purchase orders and their pricing lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /fiber-grades, POST /market-index-quotes"
      - "POST /suppliers"
      - "POST /fiber-purchase-orders, /price, /withdraw-pricing, /cancel"
    shared_operations:
      - "GET /suppliers/{id}, GET /fiber-purchase-orders, GET /fiber-receipts, GET /fiber-grades, GET /market-index-quotes, GET /mill/fiber-balance"
  - name: QualityLab
    description: "Owns sampling and quality judgement: truck sampling and disposition, pulp approval and brightness, run certification and holds, roll quarantine."
    identity: "opaque"
    exclusive_operations:
      - "POST /fiber-purchase-orders/{id}/receipts, POST /fiber-receipts/{id}/disposition"
      - "POST /pulp-batches/{id}/approve, POST /pulp-batches/{id}/brightness"
      - "POST /paper-machines/{machine_id}/runs/{run_id}/certify, /hold, /resubmit-quality"
      - "POST /roll-sets/{id}/quarantine"
    shared_operations:
      - "GET reads across receipts, lots, batches, runs, roll sets, grades and specs"
    note: "Segregation of duties: the QualityLab user id that sampled a truck cannot disposition it, and the id that started a run cannot certify it."
  - name: MachineOperator
    description: "Runs the equipment: pulper charging, screening, cleaning, deink passes, run start and completion, winding, wrapping and rewinding."
    identity: "opaque"
    exclusive_operations:
      - "POST /pulp-batches, /start, /screen, /clean, /deink"
      - "POST /paper-machines/{machine_id}/runs/{run_id}/start, /complete"
      - "POST /production-runs/{id}/roll-sets, POST /roll-sets/{id}/wrap, /rewind, /rewind-complete"
    shared_operations:
      - "GET reads across machines, runs, batches, lots, roll sets, specs and the fiber balance"
  - name: EnvironmentalOfficer
    description: "Owns water treatment and residuals: permits, discharge readings, reading voids, sludge manifests and solids-ledger reversals."
    identity: "opaque"
    exclusive_operations:
      - "POST /effluent-permits, POST /effluent-permits/{id}/readings, POST /effluent-readings/{id}/void"
      - "POST /sludge-manifests, /sign, /void"
      - "POST /reject-streams/{id}/reverse"
    shared_operations:
      - "GET reads across permits, readings, manifests, reject streams and the solids summary"
      - "POST /_clock/set_current_utc (with MillPlanner and EnergyManager)"
    note: "Segregation of duties: a manifest signer must differ from its preparer and from every officer who logged a reading inside the permit's current rolling window."
  - name: EnergyManager
    description: "Owns the steam header and cogeneration: allocation requests, curtailment and releases."
    identity: "opaque"
    exclusive_operations:
      - "POST /steam-allocations, POST /steam-allocations/{id}/release"
    shared_operations:
      - "GET /steam-allocations, GET /steam-allocations/{id}, GET /paper-machines/{id}"
      - "POST /_clock/set_current_utc (with MillPlanner and EnvironmentalOfficer)"
  - name: Supplier
    description: "External recovered-fiber supplier; confirms priced purchase orders and reads its own orders and receipts."
    identity: "entity_backed:Supplier"
    exclusive_operations:
      - "POST /fiber-purchase-orders/{id}/confirm"
    shared_operations:
      - "GET /suppliers/{id}, GET /fiber-purchase-orders, GET /fiber-purchase-orders/{id}, GET /fiber-receipts, GET /fiber-receipts/{id} — restricted to rows whose supplier_id equals X-User-ID"
  - name: Customer
    description: "External paper customer; submits and cancels its own orders and tracks their allocation."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /customer-orders, POST /customer-orders/{id}/cancel"
    shared_operations:
      - "GET /customers/{id}, GET /customer-orders, GET /customer-orders/{id}, GET /roll-sets, GET /production-runs/{id}, GET /paper-grade-specs — restricted to rows whose customer_id equals X-User-ID where the resource carries one"
