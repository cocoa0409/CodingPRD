  # --------------------------------------------------------- Consistency model
  - section: consistency_model
    instances:
      - name: petition_immediately_readable_after_create
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "A petition created via POST is immediately retrievable via GET in a subsequent request with identical field values."
        test_recipe:
          setup: ["A petitioner with one record."]
          setup_api_calls:
            - { call: "POST /expungement/petitioners", payload: { full_name: "Imm P", date_of_birth: "1990-01-01T00:00:00Z", annual_income_cents: 9000000, household_size: 1 }, as: Clerk, captures: { p: "$.data.id" } }
            - { call: "POST /expungement/criminal-records", payload: { petitioner_id: "${p}", offense_code: "PC-1", offense_class: "MISDEMEANOR", disposition: "CONVICTED", disposition_date: "2019-06-01T00:00:00Z", sentence_completion_date: "2020-01-01T00:00:00Z" }, as: Clerk, captures: { r: "$.data.id" } }
            - { call: "POST /expungement/petitions", payload: { petitioner_id: "${p}", jurisdiction_code: "CA-01", record_ids: ["${r}"] }, as: Clerk, captures: { pet: "$.data.id" } }
          trigger:
            - { call: "GET /expungement/petitions/${pet}", payload: {}, as: Clerk, captures: { st: "$.data.status", jc: "$.data.jurisdiction_code" } }
          assert:
            - "Petition.${pet}.status == DRAFT and jurisdiction_code == CA-01 immediately after creation"
