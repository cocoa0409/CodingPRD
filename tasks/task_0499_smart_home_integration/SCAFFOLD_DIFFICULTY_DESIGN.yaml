  - rule_id: boundary_precision_check
    instances:
      - name: rack_ru_capacity_exact_fit_vs_one_over
        grounds:
          - calculations.rack_units_used
          - state_machines.Device.REGISTERED_to_PROVISIONED
          - validations[priority=13]
          - entities.Rack.fields.rack_units_total
        distinguishing_aspect: |
          Boundary on rack RU using <=: a rack of 4 RU with 2 RU already used (one PROVISIONED device of 2 RU)
          accepts a second 2 RU device (2+2==4, exact fit) but a third 2 RU device (used 4, 4+2=6 > 4) is
          rejected ERR_RACK_CAPACITY_EXCEEDED. Metric: rack-unit sum, endpoint: device provision.
        test_recipe:
          setup:
            - "A PROVISIONING project with a rack of rack_units_total=4 and subnet 10.20.0.0/24; three REGISTERED ACCESSORY devices each rack_units=2."
