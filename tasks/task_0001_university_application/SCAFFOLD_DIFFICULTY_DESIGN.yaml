            - "A subsequent attempt at clock == 2030-10-02T00:00:00Z (delta == 86_400_000 ms exactly) would succeed — closed lower bound is inclusive at the boundary"

  # --------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # --------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:

      - name: enrollment_ledger_invariant_under_accept_then_revoke
        grounds:
          - state_machines.Application.transitions.ADMITTED_to_ENROLLED
          - state_machines.Application.transitions.ENROLLED_to_DECLINED_OFFER
          - entities.School.fields.confirmed_enrollment_count
          - entities.School.fields.posture
        distinguishing_aspect: |
          Conserved quantity = School.confirmed_enrollment_count over all schools.
          Invariant: School.confirmed_enrollment_count == count(Application WHERE
          school_id==School.id AND status==ENROLLED), pinned at every moment. accept-offer
          increments by 1; revoke-enrollment compensates by decrementing by 1, restoring
          the invariant. Quantity type = INTEGER ENROLLMENT COUNT per school.
        test_recipe:
          setup:
            - "School with target_class_size=5, confirmed_enrollment_count=0, posture=OPEN"
            - "Applicant with READY profile and ADMITTED Application (plan=REGULAR so no ED cascade)"
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "INV-1", target_class_size: 5, ed_deadline_iso: "2030-11-01T00:00:00Z", ea_deadline_iso: "2030-11-15T00:00:00Z", rd_deadline_iso: "2031-01-01T00:00:00Z", rolling_open: false, requires_css_profile: false, cooldown_ms: 86400000 }
              as: PlatformAdmin
              captures: { school_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2030-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applicants/register"
              payload: { email: "inv1@x.com", full_name: "INV1", gpa: 3.7, sat_total: 1400 }
              as: Anonymous
              captures: { applicant_id: $.data.id }
            - call: "POST /recommenders"
              payload: { applicant_id: "${applicant_id}", email: "inv1r@x.com", full_name: "INV1R", relationship: "TEACHER" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /recommenders/${rec_id}/accept"
              payload: {}
              as: Anonymous
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", school_id: "${school_id}", plan: "REGULAR" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /essay-submissions"
              payload: { application_id: "${app_id}", prompt_code: "P", body: "essay" }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /recommendation-letters"
              payload: { application_id: "${app_id}", recommender_id: "${rec_id}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { letter_id: $.data.id }
            - call: "POST /recommendation-letters/${letter_id}/start"
              payload: {}
              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /recommendation-letters/${letter_id}/submit"
              payload: { body: "Recommendation letter body extending beyond two hundred characters with substantive observations of the applicant's academic record, intellectual curiosity, and engagement with coursework across the year." }
              as: Recommender
              as_user_id: "${rec_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/start-review"
              payload: {}
              as: AdmissionsOfficer
              captures: { v_review: $.data.version }
            - call: "POST /applications/${app_id}/decide"
              payload: { decision: "ADMIT", expected_application_version: "${v_review}" }
              as: AdmissionsOfficer
              captures: { v_admitted: $.data.version }
            - call: "GET /schools/${school_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c0: $.data.confirmed_enrollment_count, p0: $.data.posture }
          trigger:
            - call: "POST /applications/${app_id}/accept-offer"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "GET /schools/${school_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c1: $.data.confirmed_enrollment_count, p1: $.data.posture }
            - call: "POST /applications/${app_id}/revoke-enrollment"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "GET /schools/${school_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c2: $.data.confirmed_enrollment_count, p2: $.data.posture }
          assert:
            - "Before accept: c0 == 0; after accept: c1 == 1; after revoke: c2 == 0  (invariant restored)"
            - "Before accept: p0 == 'OPEN'; after accept: p1 == 'OPEN' (still <5); after revoke: p2 == 'OPEN' (restored)"
            - "Application.${app_id}.status == 'DECLINED_OFFER' after revoke (compensating action lands)"
            - "School.${school_id}.confirmed_enrollment_count equals count of Applications with school_id==${school_id} AND status==ENROLLED at every step (invariant holds)"

      - name: waitlist_rank_sequence_invariant_under_waitlist_then_withdraw
        grounds:
          - state_machines.Application.transitions.UNDER_REVIEW_to_WAITLISTED
          - state_machines.Application.transitions.WAITLISTED_to_WITHDRAWN
          - entities.Application.fields.waitlist_rank
          - entities.Application.fields.waitlist_added_at
        distinguishing_aspect: |
          Conserved quantity = the WAITLIST RANK SEQUENCE: the multiset of waitlist_rank
          values across {Applications WHERE school_id==X AND status==WAITLISTED} MUST equal
          {1, 2, …, n} (no gaps, no duplicates), at every moment. Adding to the waitlist
          appends; withdrawing compensates by recomputing so the remaining ranks form a
          contiguous 1..n-1 sequence. Distinct conserved quantity type (rank sequence) from
          the enrollment-count invariant above.
