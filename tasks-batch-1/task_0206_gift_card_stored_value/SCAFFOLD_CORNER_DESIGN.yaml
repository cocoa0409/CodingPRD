        distinguishing_aspect: "All cards ACTIVE but total available 8500 < requested 9000 → ERR_INSUFFICIENT_BALANCE (409); no debits posted."
        test_recipe:
          setup: ["three ACTIVE cards A=3000,B=1500,C=4000 (total 8500); a DRAFT redemption for 9000 over [A,B,C]"]
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
