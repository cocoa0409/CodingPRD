  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_approve_edit
        grounds:
          - validations[priority=10]
          - validations[priority=22]
          - state_machines.Episode.REVIEW_to_MASTERED
        distinguishing_aspect: |
          Error-category pair = state (priority 10, ERR_INVALID_STATE) vs
          business_safety (priority 22, ERR_LOUDNESS_OUT_OF_SPEC). approve-edit on
          an Episode that is in EDITING (not REVIEW) AND whose accepted MASTER_AUDIO
          loudness is out of spec must return the lower-priority ERR_INVALID_STATE
          (state precondition wins over the safety check).
        test_recipe:
          setup:
            - "Episode E in EDITING (assets not yet submitted) — wrong state for approve-edit."
            - "Its MASTER_AUDIO deliverable would also be loudness-out-of-spec, but state check fires first."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Pri1 S", format: "SOLO", billing_model: "PER_EPISODE", target_loudness_lufs: -16.0 }
