            - "QualityPeriod.${qp_proc}.adenoma_positive_count == 1"
            - "QualityPeriod.${qp_proc}.adr_pct == 0.5000"
            - "QualityPeriod.${qp_proc}.benchmark_result == MET"
            - "QualityPeriod.${qp_path}.screening_colonoscopy_count == 1"
            - "QualityPeriod.${qp_path}.adenoma_positive_count == 1"
            - "QualityPeriod.${qp_path}.adr_pct == 1.0000"
            - "QualityPeriod.${qp_path}.benchmark_result == MET"
            - "QualityPeriod.${qp_proc}.benchmark_pct == 0.25 and QualityPeriod.${qp_path}.benchmark_pct == 0.25"

  - rule_id: combinatorial_formula
    instances:
      - name: surveillance_interval_nested_min_selects_60_months
        grounds:
          - calculations.surveillance_interval_months
          - entities.SurveillanceRecommendation.fields.computed_interval_months
          - entities.ScreeningEpisode.fields.risk_tier_snapshot
          - entities.PathologyReport.fields.sessile_serrated_count
        distinguishing_aspect: |
          Composition mode (a) - three nested min/max stages whose ORDER is load bearing: the findings
          tier must fall through four earlier branches to reach the sessile-serrated branch at 60,
          then the INCREASED risk cap of 60 must be applied, then the prep cap must not fire. A model
          that tests the general base-84 branch before the sessile-serrated branch yields 84 months
          and a next_due_date five years too late.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "Patient with family_history_crc true so risk_tier is INCREASED (cap 60 months)"
            - "SCREENING_AVERAGE_RISK episode, so risk_tier_snapshot freezes as INCREASED"
            - "Booking on 2026-09-15 completed with prep_quality_bbps 7 (above the poor-prep ceiling of 5) and 4 specimens"
            - "Specimens: three tubular adenomas at 6mm, 4mm and 3mm plus one sessile serrated lesion at 8mm - adenoma_count 3, sessile_serrated_count 1, largest_adenoma_mm 6, no villous component, no high-grade dysplasia"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /insurance-plans"
              payload: { plan_code: "P1", payer_name: "Meridian Health", preventive_coverage_pct: 1.00, diagnostic_coinsurance_pct: 0.20, deductible_cents: 150000, out_of_pocket_max_cents: 400000, polypectomy_carveout: "DIAGNOSTIC_CONVERTED", modifier_33_honored: true, anesthesia_bundled: false }
              as: PracticeAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "1000000001", full_name: "Dr Ada Ng", clinician_type: "ENDOSCOPIST", adr_benchmark_pct: 0.25 }
              as: PracticeAdmin
              captures: { endo_id: $.data.id }
            - call: "POST /clinicians"
              payload: { npi: "2000000001", full_name: "Dr Bo Reyes", clinician_type: "ANESTHESIA", max_overlapping_rooms: 1 }
              as: PracticeAdmin
              captures: { anes_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", birth_date: "1975-04-10", insurance_plan_id: "${plan_id}", family_history_crc: true, asa_class: 2 }
              as: PracticeAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /endoscopy-sessions"
              payload: { room_code: "ENDO-1", session_date: "2026-09-15", window_start_utc: "2026-09-15T13:00:00Z", window_end_utc: "2026-09-15T21:00:00Z", lead_endoscopist_id: "${endo_id}", anesthesia_mode: "MAC", turnover_minutes: 15, max_procedures: 8 }
              as: PracticeAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /endoscopy-sessions/${sess_id}/status-actions"
              payload: { action: "PUBLISH" }
              as: PracticeAdmin
            - call: "POST /endoscopy-sessions/${sess_id}/anesthesia-coverage"
              payload: { anesthesia_clinician_id: "${anes_id}", coverage_start_utc: "2026-09-15T13:00:00Z", coverage_end_utc: "2026-09-15T21:00:00Z" }
              as: PracticeAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /screening-episodes"
              payload: { patient_id: "${pt_id}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_id: $.data.id, snap: $.data.risk_tier_snapshot }
            - call: "GET /endoscopy-sessions/${sess_id}"
              payload: {}
              as: PracticeAdmin
              captures: { sess_v: $.data.version }
            - call: "POST /endoscopy-sessions/${sess_id}/procedure-bookings"
              payload: { episode_id: "${ep_id}", performing_endoscopist_id: "${endo_id}", slot_start_utc: "2026-09-15T13:00:00Z", duration_minutes: 45, expected_session_version: "${sess_v}" }
              as: ReferralCoordinator
              captures: { bk_id: $.data.id }
            - call: "POST /screening-episodes/${ep_id}/outreach"
              payload: { channel: "PHONE", acknowledged: true }
              as: PatientNavigator
            - call: "POST /screening-episodes/${ep_id}/prep-attestation"
              payload: { regimen_completed: true }
              as: Patient
              as_user_id: "${pt_id}"
            - call: "POST /procedure-bookings/${bk_id}/check-in"
              payload: {}
              as: PatientNavigator
            - call: "POST /procedure-bookings/${bk_id}/start"
              payload: {}
              as: Endoscopist
              as_user_id: "${endo_id}"
            - call: "POST /procedure-bookings/${bk_id}/complete"
              payload: { prep_quality_bbps: 7, polyps_removed_count: 3, largest_polyp_mm: 8, specimen_count: 4 }
              as: Endoscopist
              as_user_id: "${endo_id}"
            - call: "POST /procedure-bookings/${bk_id}/pathology-reports"
              payload: { accession_number: "ACC-0001", specimens: [ { label: "A", histology: "TUBULAR_ADENOMA", size_mm: 6 }, { label: "B", histology: "TUBULAR_ADENOMA", size_mm: 4 }, { label: "C", histology: "TUBULAR_ADENOMA", size_mm: 3 }, { label: "D", histology: "SESSILE_SERRATED_LESION", size_mm: 8 } ], high_grade_dysplasia: false }
              as: Pathologist
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /pathology-reports/${rep_id}/finalize"
              payload: {}
              as: Pathologist
            - call: "GET /surveillance-recommendations"
              payload: { episode_id: "${ep_id}", status: "ACTIVE" }
              as: Endoscopist
              as_user_id: "${endo_id}"
              captures: { rec_id: "$.data[0].id", rec_months: "$.data[0].computed_interval_months", rec_due: "$.data[0].next_due_date" }
          assert:
            - "${snap} == INCREASED"
            - "PathologyReport.${rep_id}.adenoma_count == 3"
            - "PathologyReport.${rep_id}.sessile_serrated_count == 1"
            - "PathologyReport.${rep_id}.largest_adenoma_mm == 6"
            - "PathologyReport.${rep_id}.villous_component == false"
            - "${rec_months} == 60"
            - "${rec_due} == 2031-09-15"
            - "SurveillanceRecommendation.${rec_id}.assigned_interval_months == 60"
            - "SurveillanceRecommendation.${rec_id}.basis == GUIDELINE"
            - "SurveillanceRecommendation.${rec_id}.pathology_report_id == ${rep_id}"
            - "ScreeningEpisode.${ep_id}.assigned_interval_months == 60"
            - "ScreeningEpisode.${ep_id}.due_date == 2031-09-15"
      - name: claim_per_line_rounding_yields_39367
        grounds:
          - calculations.claim_pricing
          - entities.BillingClaim.fields.coinsurance_cents
          - entities.InsurancePlan.fields.diagnostic_coinsurance_pct
          - entities.BillingClaim.fields.line_items
        distinguishing_aspect: |
          Composition mode (b) - rounding placement inside a three-line waterfall rather than nested
          stage ordering. At a coinsurance rate of 0.175 each of the three lines lands on a half cent
          (22618.75, 9668.75, 7078.75); rounding half-up per line and then summing gives 39367, while
          rounding the summed 224950 * 0.175 = 39366.25 gives 39366. The plan carries a zero
          deductible so the waterfall cannot mask the one-cent difference.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "Plan P3: diagnostic_coinsurance_pct 0.175, deductible_cents 0, out_of_pocket_max_cents 500000, polypectomy_carveout DIAGNOSTIC_CONVERTED, anesthesia_bundled false"
            - "MAC block on 2026-09-15, one 45-minute booking, patient risk AVERAGE"
            - "Exam completed with exactly one polyp removed, so the final variant flips classification to DIAGNOSTIC"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /insurance-plans"
