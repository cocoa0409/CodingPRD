              as: BrokerPlacementLead
              captures: { e_again: $.data.error_id }
            - call: "GET /programs/${prog_b}"
              payload: {}
              as: BrokerPlacementLead
              captures: { b_reason_final: $.data.withdrawal_reason }
          assert:
            - "${prog_a_state0} == DRAFT with ${prog_a_reason0} == null before the call"
            - "${a_state} == WITHDRAWN with ${a_reason} == Cedent placed direct and ${a_doc} == NOT_STARTED — a DRAFT program with no children is a single status write"
            - "${b_state} == WITHDRAWN with ${b_reason} == Cedent deferred the renewal"
            - "${market_layer_state} == LAPSED and ${quiet_layer_state} == LAPSED — both the layer that went to market and the layer that never did are lapsed by the same cascade"
            - "${q_a_state} == LAPSED — the live quote is lapsed, it is not left dangling on a lapsed layer"
            - "${ms_a_state} == CLOSED and ${ms_b_state} == CLOSED — the quoted submission and the still-unanswered submission both close"
            - "${alpha_committed} == 0 and ${lines_on_layer} is an empty array with total_count 0 — no line was ever created, so the capacity recomputation has nothing to release and still lands on the zero"
            - "${e_again} == ERR_PROGRAM_STATE_INVALID with HTTP 409 — WITHDRAWN is not in the precondition set {DRAFT, SUBMISSION_READY, IN_MARKET, FIRM_ORDER}, so withdraw is not idempotent"
            - "${b_reason_final} == Cedent deferred the renewal — the refused second call did not overwrite the recorded reason"

      - name: every_declared_read_surface_answers_from_one_fully_walked_placement
        claim_type: Cross-reference link
        grounds:
          - endpoints GET /exposure-submissions, GET /contract-documents, GET /contract-documents/{document_id}
          - endpoints GET /brokerage-disclosures, GET /renewal-reports, GET /renewal-reports/{report_id}
          - endpoints GET /claim-advocacies, GET /cession-disputes
          - endpoints GET /programs/{program_id}/contract-documents, /brokerage-disclosures, /renewal-reports
          - endpoints GET /layers/{layer_id}/claim-advocacies, GET /market-submissions/{market_submission_id}/quotes, GET /claim-advocacies/{claim_advocacy_id}/cession-disputes
        distinguishing_aspect: |
          Every child collection is reachable two ways — through its parent's nested path and through
          the flat root collection carrying the same foreign key as a filter — and the two must
          return the same rows with the same total_count. That equivalence is what makes the FK graph
          navigable, and it is the part an implementation half-builds: the nested route is wired to
          the parent while the root route quietly ignores its filter and returns the whole table, or
          the singleton read of a child returns a shape that disagrees with the row inside the list.
          The corner drives one placement all the way from exposure packaging to a disputed cession
          so that every one of these read surfaces has exactly one row to find, then reads each of
          them both ways and pins the singleton reads against the list rows.
