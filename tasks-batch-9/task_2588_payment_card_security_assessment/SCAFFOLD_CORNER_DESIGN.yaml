        excluded_because:
          difficulty_instance: requirement_parallel_dimensions_diverge_after_remediation
          rationale: "That §1.8 instance already walks both dimensions of the same row to a combined state (test_status IN_PLACE with remediation_status GAP_REMEDIATED) that neither dimension reaches alone, and asserts each dimension separately at every step."

