              as: HousingDeveloper
              captures: { err: $.data.error_id }
          assert:
            - "C2 [06-30, 07-30) created successfully — touching endpoints are disjoint under half-open semantics (${c2} exists)"
            - "C3 [06-29, 07-15) rejected with ERR_CAMPAIGN_WINDOW_OVERLAP — one day of genuine intersection with C1"

