        grounds:
          - state_machines.Batch.MILLING_to_MILLING
          - state_machines.Batch.QC_PENDING_to_REWORK
          - state_machines.Batch.REWORK_to_MILLING
        distinguishing_aspect: |
          Batch machine is cyclic: a failed grind reading self-loops MILLING ->
          MILLING (dispersion_cycles increments), and a QC rejection drives
          QC_PENDING -> REWORK -> MILLING -> TINTING -> QC_PENDING, a full revision
          loop that closes only when a later cycle's match is approved.
