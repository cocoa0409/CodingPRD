# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3408_rideshare_payload_manifest_launch_slot_assignment_range
#
# Breadth probe over §1.1–§1.7 claims not already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Anchors defined at first use and reused
# downstream in this file only.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: customer_create_version_input_ignored_and_defaults_applied
        claim_type: Creation
        grounds:
          - entities.Customer
          - entities.Customer.fields.default_rebookings
          - endpoints.POST_/rideshare/customers
        distinguishing_aspect: "A customer created with only org_name and contact_email comes back 201 with default_rebookings defaulted to 1 and system-minted id/created_at/updated_at/version=1; a client-supplied version field is not part of the endpoint contract and is ignored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (server default, restated). Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rideshare/customers"
              payload: { org_name: "Umbra Orbital Labs", contact_email: "ops@umbra.example", version: 99 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Customer.${c_id}.default_rebookings == 1 (default applied when omitted)"
            - "Customer.${c_id}.version == 1 (client-supplied version ignored)"
            - "the response data carries non-null id, created_at, updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: contract_create_missing_payloads_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.LaunchContract
          - endpoints.POST_/rideshare/contracts
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "payloads is a required input with no default; omitting it entirely is a 400 ERR_INVALID_REQUEST and no contract row is persisted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer exists."
          setup_api_calls:
            - *k_clock
            - &k_customer
              call: "POST /rideshare/customers"
              payload: { org_name: "Acme SmallSat Ventures", contact_email: "ops@acme-ssv.example", default_rebookings: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z" }
              as: ContractManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /rideshare/contracts returns 0 rows (nothing persisted)"

      - name: contract_create_with_one_invalid_payload_persists_nothing
        claim_type: Creation
        grounds:
          - endpoints.POST_/rideshare/contracts
          - entities.Payload.fields.mass_kg
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "The payloads array is atomic: the second entry has mass_kg 0 (violates the > 0 domain), so the whole create fails 400 ERR_INVALID_REQUEST and neither the contract nor the first, valid payload is persisted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer exists."
          setup_api_calls:
            - *k_clock
            - *k_customer
          trigger:
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "FLAT", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "GoodSat", mass_kg: 100, volume_m3: 2.0, interface_class: "RING_15", required_orbit: "SSO" }, { payload_name: "ZeroSat", mass_kg: 0, volume_m3: 1.0, interface_class: "CUBESAT", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /rideshare/contracts returns 0 rows"
            - "GET /rideshare/contracts with any filter continues to return 0 payloads because the contract itself was never created"

      - name: unknown_ids_return_typed_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_MISSION_NOT_FOUND
          - errors.ERR_CONTRACT_NOT_FOUND
          - errors.ERR_ASSIGNMENT_NOT_FOUND
          - errors.ERR_LICENSE_NOT_FOUND
          - errors.ERR_RANGE_SLOT_NOT_FOUND
          - errors.ERR_SEPARATION_EVENT_NOT_FOUND
          - errors.ERR_ANOMALY_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "A syntactically valid but unallocated id on each resource produces its entity-specific 404 (ERR_MISSION_NOT_FOUND, ERR_CONTRACT_NOT_FOUND, ...), never a bare 404 or a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer exists; no other rows."
          setup_api_calls:
            - *k_clock
            - *k_customer
          trigger:
            - call: "GET /rideshare/missions/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: MissionOps
              captures: { e_mission: $.data.error_id }
            - call: "GET /rideshare/contracts/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ContractManager
              captures: { e_contract: $.data.error_id }
            - call: "GET /rideshare/assignments/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: MissionOps
              captures: { e_assignment: $.data.error_id }
            - call: "GET /rideshare/licenses/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: Regulator
              captures: { e_license: $.data.error_id }
            - call: "POST /rideshare/range-slots/00000000-0000-4000-8000-000000000005/reserve"
              payload: {}
              as: RangeOfficer
              captures: { e_slot: $.data.error_id }
            - call: "POST /rideshare/separation-events/00000000-0000-4000-8000-000000000006/report-outcome"
              payload: { outcome: "EXECUTED" }
              as: MissionOps
              captures: { e_event: $.data.error_id }
            - call: "POST /rideshare/anomalies/00000000-0000-4000-8000-000000000007/transition"
              payload: { to_state: "UNDER_INVESTIGATION" }
              as: MissionOps
              captures: { e_anomaly: $.data.error_id }
          assert:
            - "e_mission == ERR_MISSION_NOT_FOUND (404)"
            - "e_contract == ERR_CONTRACT_NOT_FOUND (404)"
            - "e_assignment == ERR_ASSIGNMENT_NOT_FOUND (404)"
            - "e_license == ERR_LICENSE_NOT_FOUND (404)"
            - "e_slot == ERR_RANGE_SLOT_NOT_FOUND (404)"
            - "e_event == ERR_SEPARATION_EVENT_NOT_FOUND (404)"
            - "e_anomaly == ERR_ANOMALY_NOT_FOUND (404)"

      - name: license_and_exclusion_window_shape_incoherence_rejected
        claim_type: Type Constraints
        grounds:
          - entities.RegulatoryLicense.fields.subject_type
          - entities.RegulatoryLicense.fields.kind
          - entities.ExclusionWindow.fields.kind
          - entities.ExclusionWindow.fields.scope_type
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Subject/kind and kind/scope coherence is shape-level (priority 4, before existence): a MISSION subject with kind PAYLOAD_OPERATOR, a CUSTOMER subject with kind LAUNCH_AUTHORIZATION, and a WEATHER window scoped to an ORBIT are all 400 ERR_INVALID_REQUEST even though the referenced ids need not exist."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer exists."
          setup_api_calls:
            - *k_clock
            - *k_customer
          trigger:
            - call: "POST /rideshare/licenses"
              payload: { subject_type: "MISSION", kind: "PAYLOAD_OPERATOR", mission_id: "00000000-0000-4000-8000-000000000010", valid_until: "2027-01-01T00:00:00Z", debris_score: 80, spectrum_score: 80, operator_history_score: 80 }
              as: MissionOps
              captures: { e1: $.data.error_id }
            - call: "POST /rideshare/licenses"
              payload: { subject_type: "CUSTOMER", kind: "LAUNCH_AUTHORIZATION", customer_id: "${c_id}", valid_until: "2027-01-01T00:00:00Z", debris_score: 80, spectrum_score: 80, operator_history_score: 80 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { e2: $.data.error_id }
            - call: "POST /rideshare/exclusion-windows"
              payload: { scope_type: "ORBIT", scope_value: "SSO", kind: "WEATHER", start_utc: "2026-10-15T00:00:00Z", end_utc: "2026-10-16T00:00:00Z" }
              as: RangeOfficer
              captures: { e3: $.data.error_id }
          assert:
            - "e1 == ERR_INVALID_REQUEST (400): PAYLOAD_OPERATOR cannot attach to a MISSION subject"
            - "e2 == ERR_INVALID_REQUEST (400): LAUNCH_AUTHORIZATION cannot attach to a CUSTOMER subject"
            - "e3 == ERR_INVALID_REQUEST (400): WEATHER windows must be RANGE-scoped"
            - "GET /rideshare/licenses returns 0 rows"

      - name: payloads_listed_under_parent_contract_in_declaration_order
        claim_type: Parent Relationships
        grounds:
          - entities.Payload.fields.contract_id
          - endpoints.GET_/rideshare/contracts/{id}/payloads
        distinguishing_aspect: "The reverse-reachability list returns exactly the contract's payloads in the order they were declared in the create array, and scoping by a different contract id returns only that contract's payloads."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer with two contracts: contract-2pl (AlphaSat 10 kg RING_15, BetaSat 20 kg CUBESAT) and contract-1pl (PL1 100 kg RING_15, signed)."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "AlphaSat", mass_kg: 10, volume_m3: 0.5, interface_class: "RING_15", required_orbit: "SSO" }, { payload_name: "BetaSat", mass_kg: 20, volume_m3: 0.6, interface_class: "CUBESAT", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct2_id: $.data.id }
            - &k_contract_1pl
              call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "PL1", mass_kg: 100, volume_m3: 2.0, interface_class: "RING_15", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_id: $.data.id }
            - &k_sign
              call: "POST /rideshare/contracts/${ct_id}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { ct_v: $.data.version }
            - &k_payloads_1
              call: "GET /rideshare/contracts/${ct_id}/payloads"
              payload: {}
              as: MissionOps
              captures: { pl1: "$.data[0].id" }
          trigger:
            - call: "GET /rideshare/contracts/${ct2_id}/payloads"
              payload: {}
              as: ContractManager
          assert:
            - "the response returns exactly 2 rows"
            - "row[0].payload_name == AlphaSat and row[1].payload_name == BetaSat (declaration order preserved)"
            - "both rows carry contract_id == ${ct2_id} and status == REGISTERED"
            - "GET /rideshare/contracts/${ct_id}/payloads returns exactly 1 row (PL1), no leakage from contract-2pl"

      - name: interface_verification_records_are_immutable_after_create
        claim_type: Immutability
        grounds:
          - entities.InterfaceVerification
          - endpoints.POST_/rideshare/assignments/{id}/verifications
          - endpoints.GET_/rideshare/assignments/{id}/verifications
        distinguishing_aspect: "InterfaceVerification declares common_fields: false — the created record carries id and created_at only (no version, no updated_at), the response records created_by_user_id from the caller header, and re-reading the list returns the identical row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Mission with DSP-A; contract-1pl signed; A1 = PL1 on DSP-A (PROVISIONAL)."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - &k_mission
              call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-X1", target_orbit: "SSO", window_open_utc: "2026-10-10T00:00:00Z", window_close_utc: "2026-10-20T00:00:00Z", mass_capacity_kg: 300, volume_capacity_m3: 6.0 }
              as: MissionOps
              captures: { m_id: $.data.id }
            - &k_port_a
              call: "POST /rideshare/missions/${m_id}/dispenser-ports"
              payload: { port_code: "DSP-A", stack_position: 4, max_mass_kg: 150, supported_interface_classes: ["RING_15", "RING_24"] }
              as: MissionOps
              captures: { p_a: $.data.id }
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - &k_getm1
              call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - &k_assign_a1
              call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /rideshare/assignments/${a1}/verifications"
              payload: { check_type: "MECHANICAL", outcome: "PASSED", notes: "bolt pattern ok" }
              as: IntegrationEngineer
              as_user_id: "eng-1"
              captures: { ver_id: $.data.id }
            - call: "GET /rideshare/assignments/${a1}/verifications"
              payload: {}
              as: SafetyOfficer
            - call: "POST /rideshare/assignments/${a1}/verifications"
              payload: { check_type: "MECHANICAL", outcome: "PASSED", notes: "bolt pattern ok" }
              as: IntegrationEngineer
              as_user_id: "eng-1"
            - call: "GET /rideshare/assignments/${a1}/verifications"
              payload: { check_type: "MECHANICAL" }
              as: SafetyOfficer
          assert:
            - "the create returns 201 and the record carries id and created_at but NO version and NO updated_at keys"
            - "InterfaceVerification.${ver_id}.created_by_user_id == eng-1 (from X-User-ID)"
            - "the first list returns exactly 1 row, identical in check_type MECHANICAL and outcome PASSED"
            - "the second identical POST creates a second row (append-only log), so the filtered list then returns 2 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: double_confirm_rejected_as_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ManifestAssignment.PROVISIONAL_to_CONFIRMED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CONFIRMED is not a from-state of any assignment transition except to INTEGRATED (system) or REMOVED; a second confirm of an already-CONFIRMED assignment is 409 ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A1 fully verified, safety-approved, license GRANTED, and already CONFIRMED."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - &k_lic_c
              call: "POST /rideshare/licenses"
              payload: { subject_type: "CUSTOMER", kind: "PAYLOAD_OPERATOR", customer_id: "${c_id}", valid_until: "2027-01-01T00:00:00Z", debris_score: 80, spectrum_score: 90, operator_history_score: 80 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { lic_c_id: $.data.id }
            - &k_lic_c_grant
              call: "POST /rideshare/licenses/${lic_c_id}/transition"
              payload: { to_state: "GRANTED" }
              as: Regulator
            - *k_getm1
            - *k_assign_a1
            - &k_ver_mech
              call: "POST /rideshare/assignments/${a1}/verifications"
              payload: { check_type: "MECHANICAL", outcome: "PASSED" }
              as: IntegrationEngineer
              as_user_id: "eng-1"
            - &k_ver_elec
              call: "POST /rideshare/assignments/${a1}/verifications"
              payload: { check_type: "ELECTRICAL", outcome: "PASSED" }
              as: IntegrationEngineer
              as_user_id: "eng-1"
            - &k_safety_ok
              call: "POST /rideshare/assignments/${a1}/safety-reviews"
              payload: { decision: "APPROVE", rationale: "interfaces nominal" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - &k_confirm_a1
              call: "POST /rideshare/assignments/${a1}/confirm"
              payload: {}
              as: MissionOps
          trigger:
            - call: "POST /rideshare/assignments/${a1}/confirm"
              payload: {}
              as: MissionOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the second confirm returns 409 and error_id == ERR_INVALID_STATE"
            - "ManifestAssignment.${a1}.status remains CONFIRMED and its version is unchanged by the rejected call"

      - name: manual_remove_of_integrated_assignment_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ManifestAssignment.INTEGRATED_to_REMOVED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Manual remove is gated to PROVISIONAL/CONFIRMED; once lock-manifest has flipped the assignment to INTEGRATED, only the delay/license-revoke/scrub cascades may remove it — a direct remove is 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A1 CONFIRMED and the mission locked, so A1 is INTEGRATED."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - *k_lic_c
            - *k_lic_c_grant
            - *k_getm1
            - *k_assign_a1
            - *k_ver_mech
            - *k_ver_elec
            - *k_safety_ok
            - *k_confirm_a1
            - &k_lock
              call: "POST /rideshare/missions/${m_id}/lock-manifest"
              payload: {}
              as: MissionOps
          trigger:
            - call: "POST /rideshare/assignments/${a1}/remove"
              payload: { reason_code: "CUSTOMER_REQUEST" }
              as: MissionOps
              captures: { error_id: $.data.error_id }
          assert:
            - "the remove returns 409 and error_id == ERR_INVALID_STATE"
            - "ManifestAssignment.${a1}.status remains INTEGRATED"
            - "Mission.${m_id}.committed_mass_kg remains 100 (no capacity release)"

      - name: scrub_releases_slot_reverts_contract_and_locks_terminal
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Mission.RANGE_SCHEDULED_to_SCRUBBED
          - state_machines.RangeSlot.CONFIRMED_to_RELEASED
          - state_machines.LaunchContract.MANIFESTED_to_SIGNED
        distinguishing_aspect: "Scrub executes the full compensation chain (slot RELEASED, assignment REMOVED, payload REGISTERED, contract SIGNED with rebook_eligible=true) and then the mission is terminally locked — a subsequent delay attempt is 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Fully scheduled mission: A1 INTEGRATED, launch license GRANTED, CCAFS slot [2026-10-10, 2026-10-20] CONFIRMED, mission RANGE_SCHEDULED."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - *k_lic_c
            - *k_lic_c_grant
            - *k_getm1
            - *k_assign_a1
            - *k_ver_mech
            - *k_ver_elec
            - *k_safety_ok
            - *k_confirm_a1
            - *k_lock
            - &k_lic_m
              call: "POST /rideshare/licenses"
              payload: { subject_type: "MISSION", kind: "LAUNCH_AUTHORIZATION", mission_id: "${m_id}", valid_until: "2026-12-31T00:00:00Z", debris_score: 90, spectrum_score: 80, operator_history_score: 90 }
              as: MissionOps
              captures: { lic_m_id: $.data.id }
            - &k_lic_m_grant
              call: "POST /rideshare/licenses/${lic_m_id}/transition"
              payload: { to_state: "GRANTED" }
              as: Regulator
            - &k_slot
              call: "POST /rideshare/range-slots"
              payload: { mission_id: "${m_id}", range_code: "CCAFS", window_open_utc: "2026-10-10T00:00:00Z", window_close_utc: "2026-10-20T00:00:00Z" }
              as: RangeOfficer
              captures: { s1: $.data.id }
            - &k_reserve
              call: "POST /rideshare/range-slots/${s1}/reserve"
              payload: {}
              as: RangeOfficer
            - &k_confirm_slot
              call: "POST /rideshare/range-slots/${s1}/confirm"
              payload: {}
              as: RangeOfficer
          trigger:
            - call: "POST /rideshare/missions/${m_id}/scrub"
              payload: { reason_code: "VEHICLE_GROUNDED" }
              as: MissionOps
            - call: "POST /rideshare/missions/${m_id}/delay"
              payload: { new_window_open_utc: "2026-11-01T00:00:00Z", new_window_close_utc: "2026-11-10T00:00:00Z", reason_code: "TOO_LATE" }
              as: MissionOps
              captures: { error_id: $.data.error_id }
          assert:
            - "scrub returns 200 and Mission.${m_id}.status == SCRUBBED"
            - "RangeSlot.${s1}.status == RELEASED (via GET /rideshare/missions/${m_id}/range-slots)"
            - "ManifestAssignment.${a1}.status == REMOVED and Payload.${pl1}.status == REGISTERED"
            - "LaunchContract.${ct_id}.status == SIGNED and rebook_eligible == true"
            - "Mission.${m_id}.committed_mass_kg == 0"
            - "the post-scrub delay returns 409 and error_id == ERR_INVALID_STATE (terminal lockdown)"

      - name: anomalous_event_reexecution_gated_by_anomaly_resolution
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SeparationEvent.ANOMALOUS_to_EXECUTED
          - state_machines.AnomalyReport
          - errors.ERR_ANOMALIES_UNRESOLVED
        distinguishing_aspect: "A separation event in ANOMALOUS cannot be reported EXECUTED while any anomaly on the mission is unresolved (cross-entity guard SeparationEvent -> AnomalyReport); after the anomaly walks OPEN -> UNDER_INVESTIGATION -> ESCALATED -> UNDER_INVESTIGATION -> RESOLVED with a disposition, the same report-outcome succeeds."
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-10-15T12:00:00Z (inside the window). Mission LAUNCHED with exactly one SeparationEvent PLANNED."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - *k_mission
            - *k_port_a
            - *k_contract_1pl
            - *k_sign
            - *k_payloads_1
            - *k_lic_c
            - *k_lic_c_grant
            - *k_getm1
            - *k_assign_a1
            - *k_ver_mech
            - *k_ver_elec
            - *k_safety_ok
            - *k_confirm_a1
            - *k_lock
            - *k_lic_m
            - *k_lic_m_grant
            - *k_slot
            - *k_reserve
            - *k_confirm_slot
            - &k_clock_launch
