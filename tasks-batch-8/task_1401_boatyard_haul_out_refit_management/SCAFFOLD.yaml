# =============================================================================
# PRD Benchmark Scaffold — Boatyard Haul-Out & Refit Management
# =============================================================================

scenario: |
  Boatyard Haul-Out & Refit Management (full-service boatyard): lift scheduling & block/stand assignment, yard storage rate & work-in-progress lay days, work order (bottom/paint/mechanical) & subcontractor labor, owner-supplied parts & yard policy, environmental compliance on sanding/washdown, insurance & yard liability, splash scheduling & sea trial, seasonal winterization & shrink-wrap

domain_name: boatyard-refit
api_prefix: /yard

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Vessel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vessel name" }
      - { name: owner_name, type: string, source: input, description: "Owner display name" }
      - { name: owner_user_id, type: string, source: input, description: "Opaque X-User-ID of the Owner role allowed to act on this vessel (ownership scope)" }
      - { name: loa_ft, type: number, source: input, description: "Length overall in feet; drives storage billing", constraints: "> 0" }
      - { name: beam_ft, type: number, source: input, description: "Beam in feet", constraints: "> 0" }
      - { name: hull_type, type: enum, source: input, description: "POWER | SAIL" }
      - { name: displacement_tons, type: number, source: input, description: "Vessel displacement in tons; checked against lift capacity", constraints: "> 0" }

  - name: InsuranceCertificate
    parent: Vessel
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id" }
      - { name: provider, type: string, source: input, description: "Insurer name" }
      - { name: policy_no, type: string, source: input, description: "Policy number" }
      - { name: liability_coverage_cents, type: integer, source: input, description: "Liability coverage in cents; must be >= 100000000 to qualify", constraints: "> 0" }
      - { name: effective_date, type: string, source: input, description: "Coverage start date (YYYY-MM-DD, inclusive)" }
      - { name: expiry_date, type: string, source: input, description: "Coverage end date (YYYY-MM-DD); cert covers a scheduled operation only when expiry_date is strictly after the operation date" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXPIRED; EXPIRED set by daily close when expiry_date < current date" }

  - name: RefitJob
    parent: Vessel
    common_fields: true
    fields:
      - { name: vessel_id, type: string, source: input, description: "FK -> Vessel.id" }
      - { name: billing_mode, type: enum, source: input, default: DAILY, description: "DAILY | MONTHLY_CONTRACT; selects storage_accrual variant; locked once hauled" }
      - { name: scope_notes, type: string, source: input, description: "Free-text scope summary", constraints: "optional" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | INTAKE | HAUL_SCHEDULED | ON_HARD | WORK_IN_PROGRESS | READY_FOR_SPLASH | AWAITING_TRIAL | COMPLETE | CLOSED | CANCELLED" }
      - { name: hauled_at, type: string, source: system, description: "Calendar date (YYYY-MM-DD) the haul-out completed; lay day 1", constraints: "null until ON_HARD" }
      - { name: splashed_at, type: string, source: system, description: "Date the splash lift completed", constraints: "null until AWAITING_TRIAL" }
      - { name: lay_days, type: integer, source: computed, default: 0, description: "Count of accrued lay days (calendar dates from hauled_at through last_accrual_date, inclusive)" }
      - { name: last_accrual_date, type: string, source: system, description: "Most recent calendar date for which storage was accrued; idempotency guard for daily close", constraints: "null until first accrual" }
      - { name: open_hold_count, type: integer, source: computed, default: 0, description: "Number of ComplianceHold rows with status OPEN for this job" }
      - { name: completed_at, type: string, source: system, description: "Date sea trial passed", constraints: "null until COMPLETE" }
      - { name: closed_at, type: string, source: system, description: "Date job financially closed", constraints: "null until CLOSED" }

  - name: LiftSlot
    parent: RefitJob
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> RefitJob.id" }
      - { name: kind, type: enum, source: input, description: "HAUL_OUT | SPLASH" }
      - { name: scheduled_start, type: datetime, source: input, description: "Slot window start (ISO8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Slot window end (ISO8601 UTC); must be strictly after scheduled_start" }
      - { name: vessel_displacement_tons, type: number, source: input, description: "Declared displacement for the lift; must be <= 60 tons", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: BOOKED, description: "BOOKED | COMPLETED | CANCELLED | NO_SHOW" }

  - name: YardRow
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Row code, unique across the yard (e.g. 'A')", constraints: "unique" }
      - { name: total_stands, type: integer, source: input, description: "Total blocking stands in the row", constraints: "> 0" }
      - { name: stands_in_use, type: integer, source: computed, default: 0, description: "Sum of stands_used over ACTIVE StandAssignments of this row" }

  - name: StandAssignment
    parent: RefitJob
    common_fields: true
    fields:
      - { name: row_id, type: string, source: input, description: "FK -> YardRow.id" }
      - { name: job_id, type: string, source: input, description: "FK -> RefitJob.id" }
      - { name: stands_used, type: integer, source: input, description: "Number of stands occupied", constraints: "> 0" }
      - { name: start_date, type: string, source: input, description: "Occupancy start (YYYY-MM-DD, inclusive — closed interval)" }
      - { name: end_date, type: string, source: input, description: "Occupancy end (YYYY-MM-DD, inclusive — closed interval); must be >= start_date" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RELEASED" }

  - name: WorkOrder
    parent: RefitJob
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> RefitJob.id" }
      - { name: type, type: enum, source: input, description: "BOTTOM_PAINT | MECHANICAL | ELECTRICAL | RIGGING | FIBERGLASS | WINTERIZATION | SHRINK_WRAP" }
      - { name: description, type: string, source: input, description: "Work description" }
      - { name: quoted_hours, type: number, source: input, description: "Quoted labor hours", constraints: ">= 0" }
      - { name: quoted_rate_cents, type: integer, source: input, description: "Quoted labor rate per hour in cents", constraints: ">= 0" }
      - { name: quoted_parts_cents, type: integer, source: input, description: "Quoted parts allowance in cents", constraints: ">= 0" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "= round_half_up(quoted_hours x quoted_rate_cents) + quoted_parts_cents" }
      - { name: actual_cost_cents, type: integer, source: computed, default: 0, description: "Sum of line_cost_cents over all LaborEntries of this work order (per-line rounding)" }
      - { name: revision, type: integer, source: system, default: 0, description: "Quote revision number; incremented by requote" }
      - { name: change_note, type: string, source: system, description: "Note from the most recent request-change", constraints: "null until first change request" }
      - { name: status, type: enum, source: system, default: ESTIMATE, description: "ESTIMATE | APPROVED | IN_PROGRESS | ON_HOLD | CHANGE_REQUESTED | COMPLETE | CANCELLED" }

  - name: LaborEntry
    parent: WorkOrder
    common_fields: false
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: worker_type, type: enum, source: input, description: "YARD_CREW | SUBCONTRACTOR" }
      - { name: hours, type: number, source: input, description: "Hours worked", constraints: "> 0" }
      - { name: rate_cents, type: integer, source: input, description: "Hourly rate in cents", constraints: "> 0" }
      - { name: subcontractor_name, type: string, source: input, description: "Subcontractor firm name; required iff worker_type == SUBCONTRACTOR", constraints: "required when SUBCONTRACTOR" }
      - { name: line_cost_cents, type: integer, source: computed, description: "= round_half_up(hours x rate_cents x (1.15 if SUBCONTRACTOR else 1.0))" }

  - name: Part
    parent: RefitJob
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> RefitJob.id" }
      - { name: description, type: string, source: input, description: "Part description" }
      - { name: category, type: enum, source: input, description: "BOTTOM_PAINT | MECHANICAL | ELECTRICAL | RIGGING | OTHER" }
      - { name: owner_supplied, type: boolean, source: input, description: "True when the owner supplies the part (yard policy applies)" }
      - { name: declared_value_cents, type: integer, source: input, description: "Declared value in cents; basis of the owner-supplied handling fee", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: EXPECTED, description: "EXPECTED | RECEIVED | REJECTED" }
      - { name: inspect_note, type: string, source: system, description: "Note recorded at inspection", constraints: "null until inspected" }

  - name: EnvironmentalEvent
    parent: RefitJob
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> RefitJob.id" }
      - { name: kind, type: enum, source: input, description: "WASHDOWN | SANDING | PAINT_SPRAY" }
      - { name: containment_used, type: boolean, source: input, description: "Whether containment (tarp/boom/vacuum) was used" }
      - { name: runoff_tss_ppm, type: number, source: input, description: "Measured runoff total suspended solids in ppm", constraints: ">= 0" }
      - { name: occurred_at, type: string, source: system, description: "Calendar date of the event from the logical clock" }
      - { name: status, type: enum, source: computed, description: "LOGGED (ppm < 50) | ADVISORY (50 <= ppm < 100) | VIOLATION_FLAGGED (ppm >= 100) | REMEDIATED" }
      - { name: remediation_note, type: string, source: system, description: "Note recorded at remediation", constraints: "null until remediated" }

  - name: ComplianceHold
    parent: RefitJob
    common_fields: true
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> RefitJob.id" }
      - { name: kind, type: enum, source: input, description: "ENVIRONMENTAL | PAYMENT" }
      - { name: note, type: string, source: input, description: "Hold reason" }
      - { name: source, type: enum, source: system, default: MANUAL, description: "MANUAL | AUTO_VIOLATION (created by an environmental violation cascade)" }
      - { name: source_event_id, type: string, source: system, description: "EnvironmentalEvent that created this hold (AUTO_VIOLATION only)", constraints: "null for MANUAL" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | RELEASED" }

  - name: LedgerEntry
    parent: RefitJob
    common_fields: false
    fields:
      - { name: job_id, type: string, source: input, description: "FK -> RefitJob.id" }
      - { name: kind, type: enum, source: input, description: "PAYMENT | CREDIT | DEPOSIT via API; CHARGE is system-created only", constraints: "CHARGE rejected from API input" }
      - { name: category, type: enum, source: system, description: "STORAGE | LABOR | PARTS_HANDLING | OTHER; OTHER for all API-created entries" }
      - { name: amount_cents, type: integer, source: input, description: "Amount in cents, always positive; sign derives from kind", constraints: "> 0" }
      - { name: memo, type: string, source: input, description: "Free-text memo", constraints: "optional" }
      - { name: status, type: enum, source: system, default: POSTED, description: "POSTED | VOIDED" }
      - { name: source_work_order_id, type: string, source: system, description: "WorkOrder whose completion created this CHARGE (LABOR)", constraints: "null unless system LABOR charge" }
      - { name: source_part_id, type: string, source: system, description: "Part whose receipt created this CHARGE (PARTS_HANDLING)", constraints: "null unless system PARTS_HANDLING charge" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RefitJob
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: INTAKE
        trigger: "POST /yard/refit-jobs/{jobId}/submit"
        actor: ServiceWriter
        preconditions:
          - "Vessel has a qualifying certificate per active_certificate_selection (else ERR_INSURANCE_MISSING)"
        side_effects: []

      - from: INTAKE
        to: HAUL_SCHEDULED
        trigger: "system (automatic when a HAUL_OUT LiftSlot is booked for this job)"
        actor: system
        preconditions: []
        side_effects: []

      - from: HAUL_SCHEDULED
        to: ON_HARD
        trigger: "system (automatic when the HAUL_OUT LiftSlot is completed)"
        actor: system
        preconditions:
          - "Job has an ACTIVE StandAssignment (checked at slot completion; else ERR_STAND_ASSIGNMENT_MISSING)"
        side_effects:
          - "hauled_at = current calendar date; lay_days = 0; last_accrual_date = null"

      - from: HAUL_SCHEDULED
        to: INTAKE
        trigger: "system (automatic when the HAUL_OUT LiftSlot becomes CANCELLED or NO_SHOW)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Rebooking loop — job returns to INTAKE so a new haul slot can be booked"

      - from: ON_HARD
        to: WORK_IN_PROGRESS
        trigger: "system (automatic when the first WorkOrder enters IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ON_HARD
        to: READY_FOR_SPLASH
        trigger: "system (readiness re-evaluation)"
        actor: system
        preconditions:
          - "At least one WorkOrder is COMPLETE"
          - "Every WorkOrder of the job is in {COMPLETE, CANCELLED}"
          - "open_hold_count == 0"
        side_effects: []
        note: "Evaluated on every WorkOrder completion and every hold release"

      - from: WORK_IN_PROGRESS
        to: READY_FOR_SPLASH
        trigger: "system (readiness re-evaluation; same condition as ON_HARD -> READY_FOR_SPLASH)"
        actor: system
        preconditions:
          - "At least one WorkOrder is COMPLETE"
          - "Every WorkOrder of the job is in {COMPLETE, CANCELLED}"
          - "open_hold_count == 0"
        side_effects: []

      - from: READY_FOR_SPLASH
        to: WORK_IN_PROGRESS
        trigger: "system (automatic when readiness breaks: a ComplianceHold opens or a WorkOrder leaves {COMPLETE, CANCELLED})"
        actor: system
        preconditions: []
        side_effects:
          - "Every BOOKED SPLASH LiftSlot of this job becomes CANCELLED (hop 3 of the violation/hold cascade)"

      - from: READY_FOR_SPLASH
        to: AWAITING_TRIAL
        trigger: "system (automatic when the SPLASH LiftSlot is completed)"
        actor: system
        preconditions: []
        side_effects:
          - "splashed_at = current calendar date"
          - "The job's ACTIVE StandAssignment becomes RELEASED; row.stands_in_use -= stands_used; row.version += 1"

      - from: AWAITING_TRIAL
        to: COMPLETE
        trigger: "POST /yard/refit-jobs/{jobId}/record-sea-trial with outcome=PASS"
        actor: YardManager
        preconditions: []
        side_effects:
          - "completed_at = current calendar date"

      - from: AWAITING_TRIAL
        to: WORK_IN_PROGRESS
        trigger: "POST /yard/refit-jobs/{jobId}/record-sea-trial with outcome=FAIL"
        actor: YardManager
        preconditions:
          - "failed_work_order_id references a WorkOrder of this job in COMPLETE (else ERR_INVALID_STATE)"
        side_effects:
          - "The referenced WorkOrder becomes CHANGE_REQUESTED (hop 2 of the sea-trial-fail cascade)"

      - from: COMPLETE
        to: CLOSED
        trigger: "system (automatic at daily close when ledger_balance(job) <= 0)"
        actor: system
        preconditions: []
        side_effects:
          - "closed_at = current calendar date"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /yard/refit-jobs/{jobId}/cancel"
        actor: ServiceWriter
        preconditions: []
        side_effects:
          - "BOOKED LiftSlots become CANCELLED"
          - "ACTIVE StandAssignments become RELEASED (row.stands_in_use decremented, row.version incremented)"
          - "Non-terminal WorkOrders ({ESTIMATE, APPROVED, IN_PROGRESS, ON_HOLD, CHANGE_REQUESTED}) become CANCELLED"
          - "Ledger entries are NOT voided; posted charges remain due"

      - from: INTAKE
        to: CANCELLED
        trigger: "POST /yard/refit-jobs/{jobId}/cancel"
        actor: ServiceWriter
        preconditions: []
        side_effects:
          - "Same compensation set as DRAFT -> CANCELLED"

      - from: HAUL_SCHEDULED
        to: CANCELLED
        trigger: "POST /yard/refit-jobs/{jobId}/cancel"
        actor: ServiceWriter
        preconditions: []
        side_effects:
          - "Same compensation set as DRAFT -> CANCELLED (includes the BOOKED HAUL_OUT slot)"

      - from: ON_HARD
        to: CANCELLED
        trigger: "POST /yard/refit-jobs/{jobId}/cancel"
        actor: ServiceWriter
        preconditions: []
        side_effects:
          - "Same compensation set as DRAFT -> CANCELLED"

      - from: WORK_IN_PROGRESS
        to: CANCELLED
        trigger: "POST /yard/refit-jobs/{jobId}/cancel"
        actor: ServiceWriter
        preconditions: []
        side_effects:
          - "Same compensation set as DRAFT -> CANCELLED"

      - from: READY_FOR_SPLASH
        to: CANCELLED
        trigger: "POST /yard/refit-jobs/{jobId}/cancel"
        actor: ServiceWriter
        preconditions: []
        side_effects:
          - "Same compensation set as DRAFT -> CANCELLED (includes any BOOKED SPLASH slot)"

  - entity: WorkOrder
    initial_state: ESTIMATE
    terminal_states: [CANCELLED]
    transitions:
      - from: ESTIMATE
        to: APPROVED
        trigger: "POST /yard/work-orders/{workOrderId}/approve"
        actor: Owner
        preconditions:
          - "Acting Owner's X-User-ID equals the job's vessel.owner_user_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects: []

      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /yard/work-orders/{workOrderId}/start"
        actor: ServiceWriter
        preconditions:
          - "job.status is ON_HARD or WORK_IN_PROGRESS (else ERR_INVALID_STATE)"
          - "job.open_hold_count == 0 (else ERR_OPEN_COMPLIANCE_HOLD)"
        side_effects:
          - "If job.status == ON_HARD: job becomes WORK_IN_PROGRESS"

      - from: IN_PROGRESS
        to: CHANGE_REQUESTED
        trigger: "POST /yard/work-orders/{workOrderId}/request-change"
        actor: Owner | ServiceWriter
        preconditions: []
        side_effects:
          - "change_note recorded"

      - from: CHANGE_REQUESTED
        to: ESTIMATE
        trigger: "POST /yard/work-orders/{workOrderId}/requote"
        actor: ServiceWriter
        preconditions: []
        side_effects:
          - "quoted_hours / quoted_rate_cents / quoted_parts_cents replaced; quoted_total_cents recomputed"
          - "revision += 1"
        note: "Change-order cycle: ESTIMATE -> APPROVED -> IN_PROGRESS -> CHANGE_REQUESTED -> ESTIMATE"

      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "system (automatic when a ComplianceHold opens on the job)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "system (automatic when the job's open_hold_count returns to 0)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /yard/work-orders/{workOrderId}/complete"
        actor: ServiceWriter
        preconditions: []
        side_effects:
          - "If actual_cost_cents > 0: create LedgerEntry kind=CHARGE category=LABOR amount=actual_cost_cents status=POSTED source_work_order_id=this work order"
          - "Job readiness re-evaluation (may drive job to READY_FOR_SPLASH)"

      - from: COMPLETE
        to: CHANGE_REQUESTED
        trigger: "system (automatic via sea-trial FAIL cascade on the parent job)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ESTIMATE
        to: CANCELLED
        trigger: "system (job cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: CANCELLED
        trigger: "system (job cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (job cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ON_HOLD
        to: CANCELLED
        trigger: "system (job cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CHANGE_REQUESTED
        to: CANCELLED
        trigger: "system (job cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LiftSlot
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /yard/lift-slots/{slotId}/complete"
        actor: YardManager
        preconditions:
          - "Current logical time is within [scheduled_start, scheduled_end] inclusive (else ERR_INVALID_STATE)"
          - "HAUL_OUT: the job has an ACTIVE StandAssignment (else ERR_STAND_ASSIGNMENT_MISSING)"
        side_effects:
          - "HAUL_OUT: job HAUL_SCHEDULED -> ON_HARD (hauled_at set)"
          - "SPLASH: job READY_FOR_SPLASH -> AWAITING_TRIAL; job's ACTIVE StandAssignment RELEASED (row freed)"

      - from: BOOKED
        to: CANCELLED
        trigger: "POST /yard/lift-slots/{slotId}/cancel OR system cascades (hold-open cancels BOOKED SPLASH slots; job cancel cancels all BOOKED slots)"
        actor: YardManager | system
        preconditions: []
        side_effects:
          - "HAUL_OUT: job HAUL_SCHEDULED -> INTAKE"

      - from: BOOKED
        to: NO_SHOW
        trigger: "system (daily close when scheduled_end < current logical time and slot still BOOKED)"
        actor: system
        preconditions: []
        side_effects:
          - "HAUL_OUT: job HAUL_SCHEDULED -> INTAKE"

  - entity: StandAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /yard/stand-assignments/{assignmentId}/release OR system cascades (splash completion, job cancel)"
        actor: YardManager | system
        preconditions: []
        side_effects:
          - "row.stands_in_use -= stands_used; row.version += 1 (compensating invariant: stands_in_use returns to pre-assignment value)"

  - entity: Part
    initial_state: EXPECTED
    terminal_states: [RECEIVED, REJECTED]
    transitions:
      - from: EXPECTED
        to: RECEIVED
        trigger: "POST /yard/parts/{partId}/inspect with outcome=RECEIVED"
        actor: ServiceWriter
        preconditions: []
        side_effects:
          - "If owner_supplied: create LedgerEntry kind=CHARGE category=PARTS_HANDLING amount=round_half_up(0.10 x declared_value_cents) status=POSTED source_part_id=this part"
          - "inspect_note recorded"

      - from: EXPECTED
        to: REJECTED
        trigger: "POST /yard/parts/{partId}/inspect with outcome=REJECTED"
        actor: ServiceWriter
        preconditions: []
        side_effects:
          - "inspect_note recorded; no handling fee charged"

  - entity: EnvironmentalEvent
    initial_state: LOGGED
    terminal_states: [LOGGED, ADVISORY, REMEDIATED]
    transitions:
      - from: VIOLATION_FLAGGED
        to: REMEDIATED
        trigger: "POST /yard/environmental-events/{eventId}/remediate"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects:
          - "The AUTO_VIOLATION ComplianceHold created by this event becomes RELEASED (job.open_hold_count -= 1)"
          - "If job.open_hold_count returns to 0: ON_HOLD WorkOrders become IN_PROGRESS and readiness re-evaluation runs"
        note: "Initial status is computed at creation: ppm < 50 -> LOGGED; 50 <= ppm < 100 -> ADVISORY; ppm >= 100 -> VIOLATION_FLAGGED plus the violation cascade (see ComplianceHold creation)"

  - entity: ComplianceHold
    initial_state: OPEN
    terminal_states: [RELEASED]
    transitions:
      - from: OPEN
        to: RELEASED
        trigger: "POST /yard/compliance-holds/{holdId}/release (MANUAL source only) OR system (remediate of the source EnvironmentalEvent for AUTO_VIOLATION)"
        actor: "EnvironmentalOfficer (kind=ENVIRONMENTAL) | Accountant (kind=PAYMENT) | system"
        preconditions:
          - "source == MANUAL for the endpoint path (AUTO_VIOLATION holds reject manual release with ERR_INVALID_STATE)"
          - "Role matches hold kind: ENVIRONMENTAL -> EnvironmentalOfficer, PAYMENT -> Accountant (else ERR_UNAUTHORIZED)"
        side_effects:
          - "job.open_hold_count -= 1"
          - "If open_hold_count returns to 0: ON_HOLD WorkOrders become IN_PROGRESS; readiness re-evaluation runs"
        note: "Hold creation side effects (both MANUAL and AUTO_VIOLATION): job.open_hold_count += 1; if job was READY_FOR_SPLASH it becomes WORK_IN_PROGRESS and its BOOKED SPLASH LiftSlots are CANCELLED; every IN_PROGRESS WorkOrder becomes ON_HOLD"

  - entity: InsuranceCertificate
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (daily close when expiry_date < current calendar date)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LedgerEntry
    initial_state: POSTED
    terminal_states: [VOIDED]
    transitions:
      - from: POSTED
        to: VOIDED
        trigger: "POST /yard/ledger-entries/{entryId}/void"
        actor: Accountant
        preconditions: []
        side_effects:
          - "Entry excluded from ledger_balance and statement aggregates (compensating invariant: post-then-void leaves balance unchanged)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: job-patch-stale-version
    parent_entity: RefitJob
    write_endpoint: "PATCH /yard/refit-jobs/{jobId}"
    occ_field: "expected_refit_job_version"
    description: |
      Updating a RefitJob (billing_mode or scope_notes) with an
      expected_refit_job_version that no longer matches the job's current
      version is rejected. This captures the case where another writer has
      mutated the job since the client last observed it, making the client's
      edit basis stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: stand-assign-stale-row
    parent_entity: YardRow
    write_endpoint: "POST /yard/stand-assignments"
    occ_field: "expected_yard_row_version"
    description: |
      Creating a StandAssignment against a YardRow whose version has advanced
      since the client last observed it is rejected. The capacity decision
      (stands_in_use) must be based on a current view of the row; a stale
      version means another assignment or release has landed since the read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quoted_total
    trigger: "WorkOrder creation and requote"
    algorithm: aggregation
    formula: |
      quoted_total_cents = round_half_up(quoted_hours x quoted_rate_cents) + quoted_parts_cents
    input_set: "The WorkOrder's own quoted fields"
    precision: "0 decimal places (integer cents), round_half_up on the labor product only"

  - name: labor_line_cost
    trigger: "LaborEntry creation"
    algorithm: aggregation
    formula: |
      markup = 1.15 if worker_type == SUBCONTRACTOR else 1.0
      line_cost_cents = round_half_up(hours x rate_cents x markup)
    input_set: "The LaborEntry's own fields"
    constants:
      SUBCONTRACTOR_MARKUP: 1.15
    precision: "0 decimal places (integer cents), round_half_up per line"

  - name: work_order_cost
    trigger: "ESTIMATE variant quoted at creation/requote; ACTUAL variant recomputed on every LaborEntry creation and charged at WorkOrder completion"
    algorithm: aggregation
    formula: |
      # ACTUAL variant (pinned rounding order: round each line first, then sum):
      actual_cost_cents = sum(line_cost_cents for every LaborEntry of the work order)
      # ESTIMATE variant:
      quoted_total_cents = round_half_up(quoted_hours x quoted_rate_cents) + quoted_parts_cents
      # The two variants intentionally diverge: subcontractor markup exists ONLY
      # in the ACTUAL variant, and quoted hours/parts need not match logged lines.
    input_set: "All LaborEntry rows of the work order (any worker_type); no state filter — entries are append-only"
    constants:
      SUBCONTRACTOR_MARKUP: 1.15
    precision: "0 decimal places (integer cents); per-line round_half_up THEN sum — never sum-then-round"
    variants:
      - name: estimate_quoted
        when: "Quotation time (creation, requote) and deposit requirement basis"
        difference: "Flat quoted product with no subcontractor markup; ignores logged labor"
      - name: actual_labor
        when: "Billing time (completion charge, statement labor_charges_cents)"
        difference: "Sum of per-line-rounded logged labor including the 1.15 subcontractor markup"

  - name: storage_accrual
    trigger: "POST /yard/ops/run-daily-close — for each job in {ON_HARD, WORK_IN_PROGRESS, READY_FOR_SPLASH}, accrue every calendar date from (last_accrual_date + 1 day) or hauled_at (when last_accrual_date is null) through the current date, inclusive; skip when last_accrual_date == current date (same-day close is idempotent)"
    algorithm: tiered_pricing
    formula: |
      # DAILY variant — for each accrued date d with lay-day index i (1-based, i == lay_days + offset):
      #   tier_rate = 50 if i <= 7; 65 if 8 <= i <= 30; 85 if i >= 31   (cents per LOA foot)
      #   winter    = 0.85 if month-day(d) in [11-01 .. 03-31] else 1.0
      #   day_charge = round_half_up(loa_ft x tier_rate x winter)        (per-day rounding pinned)
      #   post one LedgerEntry kind=CHARGE category=STORAGE amount=day_charge per accrued date
      # MONTHLY_CONTRACT variant:
      #   if (i - 1) mod 30 == 0:
      #     post one LedgerEntry CHARGE/STORAGE amount = round_half_up(loa_ft x 1400)
      #   other accrued dates post nothing
      # After the sweep: lay_days += (number of accrued dates); last_accrual_date = current date.
    input_set: "Jobs with status in {ON_HARD, WORK_IN_PROGRESS, READY_FOR_SPLASH}; each accrued calendar date from max(hauled_at, last_accrual_date + 1) through current date inclusive"
    constants:
      TIER1_CENTS_PER_FT: 50
      TIER1_MAX_DAY: 7
      TIER2_CENTS_PER_FT: 65
      TIER2_MAX_DAY: 30
      TIER3_CENTS_PER_FT: 85
      WINTER_MULTIPLIER: 0.85
      WINTER_WINDOW: "11-01..03-31 (month-day, inclusive)"
      MONTHLY_BLOCK_CENTS_PER_FT: 1400
      MONTHLY_BLOCK_DAYS: 30
    precision: "0 decimal places (integer cents); DAILY rounds each day half-up before summing — never sum-then-round"
    variants:
      - name: daily_accrual
        when: "RefitJob.billing_mode == DAILY"
        difference: "Marginal per-day tier rate with winter multiplier, rounded per day; short stays pay less than a monthly block"
      - name: monthly_block
        when: "RefitJob.billing_mode == MONTHLY_CONTRACT"
        difference: "Flat 30-day block charged on lay-day indexes 1, 31, 61, ...; identical lay days produce a different total than DAILY"

  - name: runoff_compliance_check
    trigger: "EnvironmentalEvent creation"
    algorithm: threshold
    formula: |
      if runoff_tss_ppm >= 100.0:
        status = VIOLATION_FLAGGED and fire the violation cascade:
          1. create ComplianceHold kind=ENVIRONMENTAL source=AUTO_VIOLATION source_event_id=this event, status=OPEN (job.open_hold_count += 1)
          2. readiness re-evaluation: if job.status == READY_FOR_SPLASH -> WORK_IN_PROGRESS
          3. because the job left READY_FOR_SPLASH: every BOOKED SPLASH LiftSlot of the job -> CANCELLED
          4. every IN_PROGRESS WorkOrder of the job -> ON_HOLD
      else if runoff_tss_ppm >= 50.0:
        status = ADVISORY
      else:
        status = LOGGED
    input_set: "The event's own runoff_tss_ppm"
    constants:
      VIOLATION_PPM: 100.0
      ADVISORY_PPM: 50.0
    precision: "1 decimal place comparison; boundary rule is >= (100.0 exactly IS a violation)"

  - name: lift_slot_overlap
    trigger: "LiftSlot creation"
    algorithm: interval_merge
    formula: |
      # The yard has a single travel lift: every non-terminal slot (status BOOKED
      # or COMPLETED) competes for it. A 30-minute turnaround buffer applies.
      # New slot [s, e) conflicts with existing slot [s2, e2) iff:
      #   s < e2 + 30 minutes  AND  s2 < e + 30 minutes
      # Adjacency is allowed: e2 + 30min == s exactly does NOT conflict.
      # CANCELLED and NO_SHOW slots occupy nothing.
    input_set: "All LiftSlots with status in {BOOKED, COMPLETED}, any job"
    constants:
      LIFT_BUFFER_MINUTES: 30
    precision: "minute precision; strict inequality — exact buffer adjacency passes"

  - name: stand_occupancy
    trigger: "StandAssignment creation"
    algorithm: aggregation
    formula: |
      # Row capacity under closed-interval occupancy. An ACTIVE assignment covers
      # every date d with start_date <= d <= end_date (both ends inclusive).
      # Two assignments' windows intersect iff a.start_date <= b.end_date AND
      # b.start_date <= a.end_date  (touching dates DO intersect — closed intervals).
      # projected = sum(stands_used over ACTIVE assignments of the row whose window
      #             intersects the new window)
      # reject with ERR_STANDS_EXHAUSTED iff projected + stands_used > total_stands
      # (exactly-full == total_stands is ALLOWED)
    input_set: "ACTIVE StandAssignments of the target YardRow only"
    precision: "integer stand counts; boundary rule is > (projected + requested == total_stands passes)"

  - name: ledger_balance
    trigger: "Statement read, daily-close completion sweep, deposit sufficiency check"
    algorithm: aggregation
    formula: |
      balance_cents =
          sum(amount_cents where kind == CHARGE and status == POSTED)
        - sum(amount_cents where kind in {PAYMENT, CREDIT, DEPOSIT} and status == POSTED)
      # VOIDED entries contribute nothing. Invariant: posting then voiding the
      # same entry leaves balance_cents unchanged.
    input_set: "All LedgerEntry rows of the job with status == POSTED; VOIDED excluded"
    precision: "integer cents, exact"

  - name: deposit_requirement
    trigger: "SPLASH LiftSlot booking (fiscal gate) and statement read"
    algorithm: threshold
    formula: |
      required_deposit_cents = round_half_up(0.25 x sum(quoted_total_cents over
          WorkOrders of the job with status in {APPROVED, IN_PROGRESS, ON_HOLD, COMPLETE}))
      deposits_posted_cents = sum(amount_cents over LedgerEntries kind=DEPOSIT status=POSTED)
      deposit_satisfied = deposits_posted_cents >= required_deposit_cents
      # SPLASH booking rejected with ERR_DEPOSIT_SHORTFALL iff not satisfied.
      # Boundary: deposits == required exactly IS satisfied (>=).
    input_set: "WorkOrders of the job in {APPROVED, IN_PROGRESS, ON_HOLD, COMPLETE}; LedgerEntries kind=DEPOSIT status=POSTED"
    constants:
      DEPOSIT_PCT: 0.25
    precision: "0 decimal places (integer cents), round_half_up; >= boundary"

  - name: active_certificate_selection
    trigger: "RefitJob submit and LiftSlot booking (insurance checks)"
    algorithm: aggregation
    formula: |
      # Selector for the vessel's qualifying certificate at a reference date D:
      #   candidates = InsuranceCertificates of the vessel with
      #     status == ACTIVE AND effective_date <= D AND expiry_date > D
      #   ranking  = expiry_date DESC
      #   tie-break = created_at DESC (never id)
      #   empty candidate set -> no qualifying certificate (ERR_INSURANCE_MISSING)
      # Submit uses D = current date; slot booking additionally requires the
      # selected certificate's expiry_date > scheduled_start's date and
      # liability_coverage_cents >= 100000000.
    input_set: "InsuranceCertificates of the vessel (any status input; filtered as above)"
    constants:
      INSURANCE_MIN_LIABILITY_CENTS: 100000000
    precision: "date granularity"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles; includes kind-conditional role rules (compliance-hold create/release: kind ENVIRONMENTAL requires EnvironmentalOfficer, kind PAYMENT requires Accountant; mismatch rejects)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Ownership scope: an Owner may act only on resources whose vessel.owner_user_id equals X-User-ID (work-order approve/request-change, part creation, job/statement/part/work-order reads)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "Owner-role endpoints on vessel-scoped resources"

  - priority: 4
    category: existence
    check: "Path and body-referenced ids exist (vessel, job, slot, row, assignment, work order, part, event, hold, entry); validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: state
    check: "Request shape: required fields present, types valid, enum membership valid, scheduled_end > scheduled_start, end_date >= start_date, amounts positive; kind=CHARGE via POST /yard/ledger-entries; subcontractor_name missing on SUBCONTRACTOR labor"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_refit_job_version == job.version; expected_yard_row_version == row.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /yard/refit-jobs/{jobId}; POST /yard/stand-assignments"

  - priority: 7
    category: state
    check: "Entity state allows the transition: wrong from-state -> ERR_INVALID_STATE; from a terminal state -> ERR_ALREADY_TERMINAL; SPLASH booking requires job.status == READY_FOR_SPLASH -> ERR_JOB_NOT_READY_FOR_SPLASH; sea-trial FAIL requires the referenced work order COMPLETE -> ERR_INVALID_STATE"
    error_id: "ERR_INVALID_STATE / ERR_ALREADY_TERMINAL / ERR_JOB_NOT_READY_FOR_SPLASH"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_safety
    check: "Environmental moratorium: no HAUL_OUT slot may have scheduled_start whose month-day falls in [04-01, 05-31] inclusive"
    error_id: ERR_ENV_MORATORIUM
    http_status: 409
    applies_to: "POST /yard/lift-slots (kind HAUL_OUT)"

  - priority: 9
    category: business_safety
    check: "Lift capacity: vessel_displacement_tons <= 60"
    error_id: ERR_LIFT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /yard/lift-slots"

  - priority: 10
    category: business_safety
    check: "Insurance: submit requires a qualifying certificate today; slot booking requires the selected certificate's expiry_date > scheduled_start date and liability_coverage_cents >= 100000000"
    error_id: ERR_INSURANCE_MISSING
    http_status: 409
    applies_to: "POST /yard/refit-jobs/{jobId}/submit; POST /yard/lift-slots"

  - priority: 11
    category: business_safety
    check: "Compliance gate: work order start rejected while the job has any OPEN ComplianceHold"
    error_id: ERR_OPEN_COMPLIANCE_HOLD
    http_status: 409
    applies_to: "POST /yard/work-orders/{workOrderId}/start"

  - priority: 12
    category: business_constraint
    check: "Travel-lift temporal conflict per lift_slot_overlap (30-minute buffer, half-open adjacency allowed)"
    error_id: ERR_LIFT_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /yard/lift-slots"

  - priority: 13
    category: business_constraint
    check: "Stand row capacity per stand_occupancy (closed-interval intersection; projected + requested > total rejects; == total allowed)"
    error_id: ERR_STANDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /yard/stand-assignments"

  - priority: 14
    category: business_constraint
    check: "HAUL_OUT completion requires an ACTIVE StandAssignment on the job"
    error_id: ERR_STAND_ASSIGNMENT_MISSING
    http_status: 409
    applies_to: "POST /yard/lift-slots/{slotId}/complete"

  - priority: 15
    category: business_constraint
    check: "Yard policy: owner-supplied parts with category BOTTOM_PAINT are prohibited"
    error_id: ERR_OWNER_PARTS_PROHIBITED
    http_status: 422
    applies_to: "POST /yard/parts"

  - priority: 16
    category: business_constraint
    check: "Seasonal window: WorkOrders of type WINTERIZATION or SHRINK_WRAP may be created only when the current month-day is in [09-15, 12-15] inclusive"
    error_id: ERR_WINTERIZATION_WINDOW
    http_status: 422
    applies_to: "POST /yard/work-orders"

  - priority: 17
    category: business_constraint
    check: "Yard policy: subcontractor labor is prohibited on BOTTOM_PAINT work orders (environmental liability)"
    error_id: ERR_SUBCONTRACTOR_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /yard/labor-entries"

  - priority: 18
    category: business_constraint
    check: "One active job per vessel: creating a RefitJob while the vessel has a job in any non-terminal state rejects"
    error_id: ERR_DUPLICATE_ACTIVE_JOB
    http_status: 409
    applies_to: "POST /yard/refit-jobs"

  - priority: 19
    category: business_fiscal
    check: "Deposit sufficiency per deposit_requirement before a SPLASH slot may be booked"
    error_id: ERR_DEPOSIT_SHORTFALL
    http_status: 409
    applies_to: "POST /yard/lift-slots (kind SPLASH)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Vessels ---
  - method: POST
    path: "/yard/vessels"
    description: "Register a vessel"
    roles: [ServiceWriter]
    code: 201
    input: [name, owner_name, owner_user_id, loa_ft, beam_ft, hull_type, displacement_tons]
    output: Vessel
    side_effects: []

  - method: GET
    path: "/yard/vessels/{vesselId}"
    description: "Get a vessel"
    roles: [ServiceWriter, YardManager, Accountant, EnvironmentalOfficer, Owner]
    code: 200
    input: []
    output: Vessel
    side_effects: []

  - method: GET
    path: "/yard/vessels"
    description: "List vessels (paginated; optional owner filter)"
    roles: [ServiceWriter, YardManager, Accountant, EnvironmentalOfficer, Owner]
    code: 200
    input: ["limit?", "offset?", "owner_user_id?"]
    output: Vessel[]
    side_effects: []

  # --- Insurance ---
  - method: POST
    path: "/yard/insurance-certificates"
    description: "Add an insurance certificate to a vessel (status ACTIVE)"
    roles: [ServiceWriter]
    code: 201
    input: [vessel_id, provider, policy_no, liability_coverage_cents, effective_date, expiry_date]
    output: InsuranceCertificate
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/yard/vessels/{id}/insurance-certificates"
    description: "List certificates of a vessel"
    roles: [ServiceWriter, YardManager, Owner]
    code: 200
    input: ["limit?", "offset?"]
    output: InsuranceCertificate[]
    side_effects: []

  # --- Refit jobs ---
  - method: POST
    path: "/yard/refit-jobs"
    description: "Open a refit job for a vessel (DRAFT)"
    roles: [ServiceWriter]
    code: 201
    input: [vessel_id, "billing_mode?", "scope_notes?"]
    output: RefitJob
    side_effects: ["status = DRAFT; rejects when vessel has a non-terminal job (ERR_DUPLICATE_ACTIVE_JOB)"]

  - method: GET
    path: "/yard/refit-jobs/{jobId}"
    description: "Get a refit job"
    roles: [ServiceWriter, YardManager, Owner, Accountant, EnvironmentalOfficer]
    code: 200
    input: []
    output: RefitJob
    side_effects: []

  - method: GET
    path: "/yard/vessels/{id}/refit-jobs"
    description: "List refit jobs of a vessel"
    roles: [ServiceWriter, YardManager, Owner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RefitJob[]
    side_effects: []

  - method: PATCH
    path: "/yard/refit-jobs/{jobId}"
    description: "Update billing_mode / scope_notes before haul (OCC-guarded)"
    roles: [ServiceWriter]
    code: 200
    input: [expected_refit_job_version, "billing_mode?", "scope_notes?"]
    output: RefitJob
    side_effects: ["increments RefitJob.version by 1; allowed only while status in {DRAFT, INTAKE} (else ERR_INVALID_STATE)"]

  - method: POST
    path: "/yard/refit-jobs/{jobId}/submit"
    description: "Submit job to intake (requires qualifying insurance)"
    roles: [ServiceWriter]
    code: 200
    input: []
    output: RefitJob
    side_effects: ["status DRAFT -> INTAKE"]

  - method: POST
    path: "/yard/refit-jobs/{jobId}/cancel"
    description: "Cancel a non-terminal job with compensation"
    roles: [ServiceWriter]
    code: 200
    input: ["reason?"]
    output: RefitJob
    side_effects: ["status -> CANCELLED; BOOKED slots CANCELLED; ACTIVE stand assignments RELEASED; non-terminal work orders CANCELLED; ledger untouched"]

  - method: GET
    path: "/yard/refit-jobs/{jobId}/statement"
    description: "Computed billing statement for the job"
    roles: [ServiceWriter, Accountant, Owner]
    code: 200
    input: []
    output: "{ job_id: string, billing_mode: string, status: string, lay_days: integer, storage_charges_cents: integer, labor_charges_cents: integer, parts_handling_charges_cents: integer, total_charges_cents: integer, payments_cents: integer, credits_cents: integer, deposits_cents: integer, balance_cents: integer, required_deposit_cents: integer, deposit_satisfied: boolean }"
    side_effects: []

  - method: POST
    path: "/yard/refit-jobs/{jobId}/record-sea-trial"
    description: "Record sea trial outcome (PASS -> COMPLETE; FAIL -> WORK_IN_PROGRESS + work order cascade)"
    roles: [YardManager]
    code: 200
    input: [outcome, "failed_work_order_id?", "notes?"]
    output: RefitJob
    side_effects: ["PASS: status -> COMPLETE; FAIL: status -> WORK_IN_PROGRESS and referenced COMPLETE work order -> CHANGE_REQUESTED"]

  # --- Lift slots ---
  - method: POST
    path: "/yard/lift-slots"
    description: "Book a travel-lift slot (HAUL_OUT or SPLASH)"
    roles: [YardManager]
    code: 201
    input: [job_id, kind, scheduled_start, scheduled_end, vessel_displacement_tons]
    output: LiftSlot
    side_effects: ["status = BOOKED; HAUL_OUT: job INTAKE -> HAUL_SCHEDULED"]

  - method: GET
    path: "/yard/refit-jobs/{id}/lift-slots"
    description: "List lift slots of a job"
    roles: [YardManager, ServiceWriter]
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: LiftSlot[]
    side_effects: []

  - method: POST
    path: "/yard/lift-slots/{slotId}/complete"
    description: "Complete a booked slot within its window"
    roles: [YardManager]
    code: 200
    input: []
    output: LiftSlot
    side_effects: ["HAUL_OUT: job -> ON_HARD (hauled_at set); SPLASH: job -> AWAITING_TRIAL, stand assignment released"]

  - method: POST
    path: "/yard/lift-slots/{slotId}/cancel"
    description: "Cancel a booked slot"
    roles: [YardManager]
    code: 200
    input: []
    output: LiftSlot
    side_effects: ["HAUL_OUT: job HAUL_SCHEDULED -> INTAKE"]

  # --- Yard rows & stands ---
  - method: POST
    path: "/yard/yard-rows"
    description: "Create a blocking row"
    roles: [YardManager]
    code: 201
    input: [code, total_stands]
    output: YardRow
    side_effects: ["stands_in_use = 0"]

  - method: GET
    path: "/yard/yard-rows/{rowId}"
    description: "Get a yard row"
    roles: [YardManager, ServiceWriter]
    code: 200
    input: []
    output: YardRow
    side_effects: []

  - method: POST
    path: "/yard/stand-assignments"
    description: "Assign blocking stands to a hauled (or to-be-hauled) job (OCC-guarded on the row)"
    roles: [YardManager]
    code: 201
    input: [row_id, job_id, stands_used, start_date, end_date, expected_yard_row_version]
    output: StandAssignment
    side_effects: ["status = ACTIVE; row.stands_in_use += stands_used; increments YardRow.version by 1; job must be in {INTAKE, HAUL_SCHEDULED, ON_HARD, WORK_IN_PROGRESS} (else ERR_INVALID_STATE)"]

  - method: GET
    path: "/yard/stand-assignments/{assignmentId}"
    description: "Get a stand assignment"
    roles: [YardManager, ServiceWriter]
    code: 200
    input: []
    output: StandAssignment
    side_effects: []

  - method: GET
    path: "/yard/stand-assignments"
    description: "List stand assignments (filter by row and/or job)"
    roles: [YardManager, ServiceWriter]
    code: 200
    input: ["row_id?", "job_id?", "status?", "limit?", "offset?"]
    output: StandAssignment[]
    side_effects: []

  - method: POST
    path: "/yard/stand-assignments/{assignmentId}/release"
    description: "Release an active stand assignment"
    roles: [YardManager]
    code: 200
    input: []
    output: StandAssignment
    side_effects: ["status -> RELEASED; row.stands_in_use -= stands_used; increments YardRow.version by 1"]

  # --- Work orders & labor ---
  - method: POST
    path: "/yard/work-orders"
    description: "Create a work order (ESTIMATE) on a job"
    roles: [ServiceWriter]
    code: 201
    input: [job_id, type, description, quoted_hours, quoted_rate_cents, quoted_parts_cents]
    output: WorkOrder
    side_effects: ["status = ESTIMATE; quoted_total_cents computed; job must be in {DRAFT, INTAKE, HAUL_SCHEDULED, ON_HARD, WORK_IN_PROGRESS} (else ERR_INVALID_STATE); WINTERIZATION/SHRINK_WRAP gated by seasonal window"]

  - method: GET
    path: "/yard/work-orders/{workOrderId}"
    description: "Get a work order"
    roles: [ServiceWriter, YardManager, Owner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/yard/refit-jobs/{id}/work-orders"
    description: "List work orders of a job"
    roles: [ServiceWriter, YardManager, Owner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/yard/work-orders/{workOrderId}/approve"
    description: "Owner approves the estimate"
    roles: [Owner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status ESTIMATE -> APPROVED"]

  - method: POST
    path: "/yard/work-orders/{workOrderId}/start"
    description: "Start an approved work order"
    roles: [ServiceWriter]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status APPROVED -> IN_PROGRESS; job ON_HARD -> WORK_IN_PROGRESS if first"]

  - method: POST
    path: "/yard/work-orders/{workOrderId}/request-change"
    description: "Request a scope change on an in-progress work order"
    roles: [Owner, ServiceWriter]
    code: 200
    input: [change_note]
    output: WorkOrder
    side_effects: ["status IN_PROGRESS -> CHANGE_REQUESTED"]

  - method: POST
    path: "/yard/work-orders/{workOrderId}/requote"
    description: "Re-quote a change-requested work order (revision += 1)"
    roles: [ServiceWriter]
    code: 200
    input: [quoted_hours, quoted_rate_cents, quoted_parts_cents]
    output: WorkOrder
    side_effects: ["status CHANGE_REQUESTED -> ESTIMATE; quoted fields replaced; revision incremented"]

  - method: POST
    path: "/yard/work-orders/{workOrderId}/complete"
    description: "Complete an in-progress work order"
    roles: [ServiceWriter]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status IN_PROGRESS -> COMPLETE; posts LABOR charge when actual_cost_cents > 0; job readiness re-evaluation"]

  - method: POST
    path: "/yard/labor-entries"
    description: "Log a labor line on an in-progress work order"
    roles: [ServiceWriter]
    code: 201
    input: [work_order_id, worker_type, hours, rate_cents, "subcontractor_name?"]
    output: LaborEntry
    side_effects: ["line_cost_cents computed (per-line rounding); work order actual_cost_cents recomputed; work order must be IN_PROGRESS (else ERR_INVALID_STATE)"]

  - method: GET
    path: "/yard/work-orders/{id}/labor-entries"
    description: "List labor entries of a work order"
    roles: [ServiceWriter, YardManager, Accountant]
    code: 200
    input: ["limit?", "offset?"]
    output: LaborEntry[]
    side_effects: []

  # --- Parts ---
  - method: POST
    path: "/yard/parts"
    description: "Register a part for a job (owner-supplied or yard-supplied)"
    roles: [Owner, ServiceWriter]
    code: 201
    input: [job_id, description, category, owner_supplied, declared_value_cents]
    output: Part
    side_effects: ["status = EXPECTED; owner-supplied BOTTOM_PAINT rejected (ERR_OWNER_PARTS_PROHIBITED); job must be in {INTAKE, HAUL_SCHEDULED, ON_HARD, WORK_IN_PROGRESS, READY_FOR_SPLASH} (else ERR_INVALID_STATE)"]

  - method: GET
    path: "/yard/refit-jobs/{id}/parts"
    description: "List parts of a job"
    roles: [ServiceWriter, YardManager, Owner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Part[]
    side_effects: []

  - method: POST
    path: "/yard/parts/{partId}/inspect"
    description: "Inspect an expected part (RECEIVED applies the owner-supplied handling fee)"
    roles: [ServiceWriter]
    code: 200
    input: [outcome, "inspect_note?"]
    output: Part
    side_effects: ["RECEIVED: owner-supplied parts post a PARTS_HANDLING charge of round_half_up(0.10 x declared_value_cents); REJECTED: no fee"]

  # --- Environmental & holds ---
  - method: POST
    path: "/yard/environmental-events"
    description: "Log a washdown/sanding/spray event; status computed from runoff ppm; violations cascade"
    roles: [EnvironmentalOfficer]
    code: 201
    input: [job_id, kind, containment_used, runoff_tss_ppm]
    output: EnvironmentalEvent
    side_effects: ["status per runoff_compliance_check; VIOLATION_FLAGGED fires the hold cascade (hold creation -> readiness revocation -> splash slot cancellation; IN_PROGRESS work orders -> ON_HOLD); job must be in {ON_HARD, WORK_IN_PROGRESS, READY_FOR_SPLASH} (else ERR_INVALID_STATE)"]

  - method: GET
    path: "/yard/refit-jobs/{id}/environmental-events"
    description: "List environmental events of a job"
    roles: [EnvironmentalOfficer, YardManager, ServiceWriter]
    code: 200
    input: ["limit?", "offset?"]
    output: EnvironmentalEvent[]
    side_effects: []

  - method: POST
    path: "/yard/environmental-events/{eventId}/remediate"
    description: "Remediate a flagged violation (releases its auto hold)"
    roles: [EnvironmentalOfficer]
    code: 200
    input: [remediation_note]
    output: EnvironmentalEvent
    side_effects: ["status VIOLATION_FLAGGED -> REMEDIATED; AUTO_VIOLATION hold RELEASED; open_hold_count decremented; work orders resume; readiness re-evaluation"]

  - method: POST
    path: "/yard/compliance-holds"
    description: "Place a manual hold (kind ENVIRONMENTAL by EnvironmentalOfficer, kind PAYMENT by Accountant)"
    roles: [Accountant, EnvironmentalOfficer]
    code: 201
    input: [job_id, kind, note]
    output: ComplianceHold
    side_effects: ["status = OPEN, source = MANUAL; open_hold_count += 1; readiness revoked; BOOKED SPLASH slots CANCELLED; IN_PROGRESS work orders -> ON_HOLD; job must not be terminal (else ERR_INVALID_STATE)"]

  - method: GET
    path: "/yard/refit-jobs/{id}/compliance-holds"
    description: "List holds of a job"
    roles: [ServiceWriter, YardManager, Accountant, EnvironmentalOfficer, Owner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ComplianceHold[]
    side_effects: []

  - method: POST
    path: "/yard/compliance-holds/{holdId}/release"
    description: "Release a manual hold (role must match hold kind)"
    roles: [Accountant, EnvironmentalOfficer]
    code: 200
    input: []
    output: ComplianceHold
    side_effects: ["status OPEN -> RELEASED; open_hold_count -= 1; work orders resume at zero holds; readiness re-evaluation"]

  # --- Ledger ---
  - method: POST
    path: "/yard/ledger-entries"
    description: "Post a manual financial entry (PAYMENT, CREDIT, or DEPOSIT)"
    roles: [Accountant]
    code: 201
    input: [job_id, kind, amount_cents, "memo?"]
    output: LedgerEntry
    side_effects: ["status = POSTED immediately; category = OTHER; job must not be CANCELLED or CLOSED (else ERR_INVALID_STATE)"]

  - method: GET
    path: "/yard/refit-jobs/{id}/ledger-entries"
    description: "List ledger entries of a job"
    roles: [Accountant, ServiceWriter, Owner]
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: POST
    path: "/yard/ledger-entries/{entryId}/void"
    description: "Void a posted entry (compensation)"
    roles: [Accountant]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: ["status POSTED -> VOIDED; excluded from balance and statement aggregates"]

  # --- Ops & clock ---
  - method: POST
    path: "/yard/ops/run-daily-close"
    description: "Operations checkpoint: (1) expire certificates whose expiry_date < current date; (2) BOOKED slots with scheduled_end in the past become NO_SHOW (HAUL_OUT reverts job to INTAKE); (3) accrue storage for on-hard jobs per storage_accrual; (4) COMPLETE jobs with balance_cents <= 0 become CLOSED"
    roles: [YardManager]
    code: 200
    input: []
    output: "{ closed_date: string, storage_entries_posted: integer, expired_certificate_ids: string[], no_show_slot_ids: string[], closed_job_ids: string[] }"
    side_effects: ["Steps run in the pinned order 1-2-3-4; same-day re-run accrues no additional storage (idempotent per last_accrual_date)"]

  - method: POST
    path: "/yard/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time"
    roles: [YardManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["All date-sensitive rules (insurance windows, moratorium, seasonal windows, slot windows, accrual) read this clock"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers, or undeclared role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the endpoint, or hold kind/role mismatch on compliance-hold create or release" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Owner role acting on a resource whose vessel.owner_user_id differs from X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, bad type, invalid enum, non-positive amounts, scheduled_end <= scheduled_start, end_date < start_date, CHARGE kind via API, SUBCONTRACTOR labor without subcontractor_name" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is in a non-terminal state that does not allow the requested transition (incl. wrong job phase for child creation, slot completed outside its window, AUTO_VIOLATION hold manually released, sea-trial FAIL referencing a non-COMPLETE work order)" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Target entity is in a terminal state (CANCELLED/CLOSED job, COMPLETED/CANCELLED/NO_SHOW slot, RELEASED assignment/hold, RECEIVED/REJECTED part, VOIDED entry, REMEDIATED event)" }
  - { id: ERR_ENV_MORATORIUM, http: 409, condition: "HAUL_OUT slot scheduled_start falls inside the environmental moratorium month-day window [04-01, 05-31]" }
  - { id: ERR_LIFT_CAPACITY_EXCEEDED, http: 409, condition: "vessel_displacement_tons exceeds the 60-ton lift rating" }
  - { id: ERR_INSURANCE_MISSING, http: 409, condition: "No qualifying certificate (ACTIVE, effective, unexpired, coverage >= 100000000) for the operation date" }
  - { id: ERR_OPEN_COMPLIANCE_HOLD, http: 409, condition: "Work order start blocked while the job has an OPEN ComplianceHold" }
  - { id: ERR_LIFT_SLOT_CONFLICT, http: 409, condition: "Slot window plus 30-minute buffer intersects an existing BOOKED or COMPLETED slot" }
  - { id: ERR_STANDS_EXHAUSTED, http: 409, condition: "Stand row projected occupancy plus requested stands exceeds total_stands" }
  - { id: ERR_STAND_ASSIGNMENT_MISSING, http: 409, condition: "HAUL_OUT completion attempted without an ACTIVE StandAssignment on the job" }
  - { id: ERR_OWNER_PARTS_PROHIBITED, http: 422, condition: "Owner-supplied part with category BOTTOM_PAINT violates yard policy" }
  - { id: ERR_WINTERIZATION_WINDOW, http: 422, condition: "WINTERIZATION or SHRINK_WRAP work order created outside the [09-15, 12-15] seasonal window" }
  - { id: ERR_SUBCONTRACTOR_NOT_ALLOWED, http: 422, condition: "Subcontractor labor logged on a BOTTOM_PAINT work order" }
  - { id: ERR_DUPLICATE_ACTIVE_JOB, http: 409, condition: "Vessel already has a refit job in a non-terminal state" }
  - { id: ERR_JOB_NOT_READY_FOR_SPLASH, http: 409, condition: "SPLASH booking attempted while job.status != READY_FOR_SPLASH" }
  - { id: ERR_DEPOSIT_SHORTFALL, http: 409, condition: "SPLASH booking attempted while posted deposits are below 25% of the quoted total of non-estimate work orders" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ServiceWriter
    description: "Yard service writer — intake, estimates, work orders, labor, parts inspection"
    identity: opaque
    exclusive_operations:
      - "POST /yard/vessels"
      - "POST /yard/insurance-certificates"
      - "POST /yard/refit-jobs (+ submit, cancel, PATCH)"
      - "POST /yard/work-orders (+ start, requote, complete)"
      - "POST /yard/labor-entries"
      - "POST /yard/parts/{partId}/inspect"
    shared_operations:
      - "GET reads on vessels, jobs, slots, work orders, parts, events, holds, ledger"
      - "POST /yard/work-orders/{workOrderId}/request-change (shared with Owner)"
      - "POST /yard/parts (shared with Owner)"

  - name: YardManager
    description: "Yard operations manager — lift schedule, rows and stands, sea trials, daily close, clock"
    identity: opaque
    exclusive_operations:
      - "POST /yard/lift-slots (+ complete, cancel)"
      - "POST /yard/yard-rows"
      - "POST /yard/stand-assignments (+ release)"
      - "POST /yard/refit-jobs/{jobId}/record-sea-trial"
      - "POST /yard/ops/run-daily-close"
      - "POST /yard/_clock/set_current_utc"
    shared_operations:
      - "GET reads on vessels, jobs, slots, rows, assignments, work orders, labor, parts, events, holds"

  - name: EnvironmentalOfficer
    description: "Compliance officer — environmental logging, violation remediation, environmental holds (segregated from yard operations)"
    identity: opaque
    exclusive_operations:
      - "POST /yard/environmental-events"
      - "POST /yard/environmental-events/{eventId}/remediate"
    shared_operations:
      - "POST /yard/compliance-holds and POST /yard/compliance-holds/{holdId}/release restricted to kind=ENVIRONMENTAL (shared surface with Accountant, kind-segregated)"
      - "GET reads on vessels, jobs, events, holds"

  - name: Accountant
    description: "Yard accountant — payments, credits, deposits, voids, payment holds (segregated from estimating)"
    identity: opaque
    exclusive_operations:
      - "POST /yard/ledger-entries"
      - "POST /yard/ledger-entries/{entryId}/void"
    shared_operations:
      - "POST /yard/compliance-holds and POST /yard/compliance-holds/{holdId}/release restricted to kind=PAYMENT (shared surface with EnvironmentalOfficer, kind-segregated)"
      - "GET reads on vessels, jobs, statements, labor, holds, ledger"

  - name: Owner
    description: "Vessel owner — approves estimates, requests changes, registers owner-supplied parts; scoped to vessels where vessel.owner_user_id == X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /yard/work-orders/{workOrderId}/approve"
    shared_operations:
      - "POST /yard/work-orders/{workOrderId}/request-change (shared with ServiceWriter)"
      - "POST /yard/parts (shared with ServiceWriter)"
      - "GET reads on own vessels, jobs, statements, work orders, parts, holds, ledger"
