            - "the three holds remain PLACED (skip-the-line did not disturb the queue)"

      - name: hold_ready_expiry_at_pickup_window_boundary
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Hold.READY_to_EXPIRED
          - entities.Hold.fields.ready_until
        distinguishing_aspect: "Pickup-window boundary: one second before ready_until the claim still succeeds; an epoch run exactly at ready_until expires the hold (ready_until <= now) and promotes the next hold."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; pickup_window_hours 72. Library L, fund, patrons P0/P1/P2, title T, OCOU copies 1."
            - "P0 borrows, P1 and P2 hold, P0 returns -> P1 READY (ready_until 2026-09-04T00:00:00Z)."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - *k_fund
            - *k_p0
            - call: "POST /lending/libraries/${lib_id}/patrons"
