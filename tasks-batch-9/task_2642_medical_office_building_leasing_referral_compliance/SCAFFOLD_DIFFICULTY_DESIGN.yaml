              payload: { attestation_type: "SIGNED_LEASE", on_file: true, document_reference: "LSE-2642-0015" }
              as: LeasingAgent
            - call: "POST /leases/${l15_id}/execute"
              payload: { execution_note: "Executed" }
              as: LeasingAgent
            - call: "POST /ti-projects/${tp15_id}/transitions"
              payload: { action: "START_CONSTRUCTION", note: "Identical retry with the lease EXECUTED" }
              as: LeasingAgent
          assert:
            - "Before the trigger, TenantImprovementProject.${tp15_id}.status == PERMITTED with both shielding_review_status and utility_review_status APPROVED"
            - "The first START_CONSTRUCTION returns 409 ERR_TI_PROJECT_NOT_COMPLETE and the project stays PERMITTED"
            - "Lease.${l15_id}.status moves DRAFT -> PENDING_FMV_REVIEW -> FMV_CERTIFIED -> EXECUTED with no call touching the project"
