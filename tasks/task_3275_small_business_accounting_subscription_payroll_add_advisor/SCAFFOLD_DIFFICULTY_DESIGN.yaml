              as_user_id: "${company_q_admin_id}"
              captures: { payroll_q_id: $.data.id, payroll_q_v: $.data.version }
            - &k_emp_q
              call: "POST /api/companies/${company_q_id}/payroll/employees"
              payload: { payroll_addon_id: "${payroll_q_id}", legal_name: "Emp Q", hire_date: "2026-09-01T00:00:00Z" }
              as: CompanyUser
              as_user_id: "${company_q_admin_id}"
              captures: { emp_q_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
