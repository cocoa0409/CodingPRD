              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /proofs"
              payload: { registration_id: "${reg_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { proof_id: $.data.id }
            - call: "POST /proofs/${proof_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /claims"
              payload: { registration_id: "${reg_id}", defect_category: "MANUFACTURING", reported_date: "2024-02-01T00:00:00Z" }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { claim1_id: $.data.id }
          trigger:
            - call: "POST /claims"
              payload: { registration_id: "${reg_id}", defect_category: "MANUFACTURING", reported_date: "2024-02-20T00:00:00Z" }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CLAIM_COOLDOWN"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: transfer_fee_debit_reversed_conserves_remaining_coverage
        grounds:
          - state_machines.Registration.ACTIVE_to_TRANSFER_PENDING
          - state_machines.Registration.TRANSFER_PENDING_to_ACTIVE
          - calculations.remaining_coverage_reconciliation
        distinguishing_aspect: |
          Conserved quantity = Registration.remaining_coverage_cents. transfer (DEBIT TRANSFER_FEE 1500)
          then transfer/reject (CREDIT REVERSAL 1500) returns remaining_coverage to its pre-transfer
          value (20000); net ledger movement is exactly zero.
        test_recipe:
          setup:
            - "Clock 2024-01-15. ELECTRONICS product, BASE tier cap 20000."
            - "Owner O1 ACTIVE validated registration (remaining_coverage 20000). Owner O2 recipient."
            - "Transfer initiated at elapsed 5 months (clock 2024-06-15) -> fee 1500, remaining 18500, status TRANSFER_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "POST /products"
              payload: { model_number: "ELX-16", category: "ELECTRONICS", msrp_cents: 60000, base_warranty_months: 12, serviceable_lifespan_months: 48 }
              as: WarrantyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /coverage-tiers"
              payload: { product_id: "${prod_id}", tier_name: "BASE", extension_months: 0, price_cents: 0, coverage_cap_cents: 20000, depreciation_method: "STRAIGHT_LINE" }
              as: WarrantyAdmin
            - call: "POST /owners"
              payload: { full_name: "Owner One", email: "o1q@x.com" }
              as: WarrantyAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /owners"
              payload: { full_name: "Owner Two", email: "o2q@x.com" }
              as: WarrantyAdmin
              captures: { o2_id: $.data.id }
            - call: "POST /registrations"
              payload: { product_id: "${prod_id}", serial_number: "SN-INV1", owner_user_id: "${o1_id}", purchase_date: "2024-01-15T00:00:00Z", purchase_price_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /proofs"
              payload: { registration_id: "${reg_id}", document_type: "RECEIPT", stated_purchase_date: "2024-01-15T00:00:00Z", stated_amount_cents: 50000 }
              as: Owner
              as_user_id: "${o1_id}"
              captures: { proof_id: $.data.id }
            - call: "POST /proofs/${proof_id}/validate"
              payload: {}
              as: WarrantyAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-06-15T00:00:00Z" }
              as: WarrantyAdmin
            - call: "GET /registrations/${reg_id}"
              payload: {}
              as: Owner
              as_user_id: "${o1_id}"
              captures: { reg_v: $.data.version }
            - call: "POST /registrations/${reg_id}/transfer"
              payload: { to_owner_user_id: "${o2_id}", expected_registration_version: "${reg_v}" }
              as: Owner
              as_user_id: "${o1_id}"
          trigger:
            - call: "POST /registrations/${reg_id}/transfer/reject"
              payload: {}
              as: Owner
              as_user_id: "${o2_id}"
              captures: { final_status: $.data.status }
          assert:
            - "Registration.${reg_id}.remaining_coverage_cents == 20000"
            - "Registration.${reg_id}.status == ACTIVE"
            - "Registration.${reg_id}.owner_user_id == ${o1_id}"

      - name: extension_purchase_then_cancel_conserves_warranty_duration_months
        grounds:
          - state_machines.ExtendedWarranty.ACTIVE_to_CANCELLED
          - entities.Registration.fields.warranty_end_date
          - entities.Product.fields.base_warranty_months
        distinguishing_aspect: |
          Conserved quantity = warranty duration in months (warranty_end_date - purchase_date). Buying a
