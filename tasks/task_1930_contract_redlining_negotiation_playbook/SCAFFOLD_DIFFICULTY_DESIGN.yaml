        grounds:
          - state_machines.Negotiation
          - state_machines.Negotiation.REDLINING_to_REDLINING
        distinguishing_aspect: |
          Negotiation.draft_status is CYCLIC: REDLINING -> REDLINING via
          close-round + open-round, with current_round_index monotonically
          increasing. Each cycle creates a new NegotiationRound and supersedes
          the previous (round_status CLOSED). Three loops produce
          total_rounds == 3.
        test_recipe:
