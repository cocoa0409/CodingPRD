              as_user_id: "ca-1"
            - call: "POST /exposure-assessments/${ea_id}/transitions"
              payload: { to_status: "VOID", void_reason: "Plaintiff theory abandoned after counsel review." }
              as: ComplianceApprover
              as_user_id: "ca-1"
          assert:
            - "Before: ComplianceProgram.${prog_id}.pra_exposure_cents == 0 and posture == RESTRICTED"
            - "After FINAL: ExposureAssessment.${ea_id}.status == FINAL, exposure_cents == 875000, ComplianceProgram.${prog_id}.pra_exposure_cents == 875000"
            - "After FINAL the posture is FROZEN because 875000 * 100 == 80 * 1093750 exactly (the inclusive 80% freeze boundary)"
            - "After VOID: ExposureAssessment.${ea_id}.status == VOID and ComplianceProgram.${prog_id}.pra_exposure_cents == 0 — bit-for-bit the pre-finalization value, no residue"
            - "After VOID the posture is back to RESTRICTED (consent gaps remain) and a fresh DRAFT assessment for (${prog_id}, ${il_id}) is once again permitted"
            - "ExposureAssessment.${ea_id}.exposure_cents is still 875000 after voiding — the void reverses the ledger, not the recorded figure"

