scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: stepdown_single_vs_double_apportionment_divergence
        grounds:
          - calculations.stepdown_allocation
          - entities.StepdownRun.fields.method
          - entities.CostReport.fields.total_allowable_cost_cents
          - state_machines.StepdownRun.QUEUED_to_COMPLETED
          - concurrency_rules[stepdown-run-create-stale-report]
        distinguishing_aspect: |
          This dual variant lives in the cost-accounting domain (CostCenter x StepdownRun): the same
          five cost centers and the same five mapped ledger lines settle to total_allowable_cost_cents
          448666667 under SINGLE_APPORTIONMENT and 449047620 under DOUBLE_APPORTIONMENT, a 380953-cent
          divergence caused purely by whether closed general-service centers may receive cost.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with a DRAFT CostReport for FY 2025-07-01..2026-06-30, total_charges_cents 400000000"
            - "five cost centers: 00100 A&G (GENERAL_SERVICE, SQUARE_FEET, order 1), 00200 Laundry (GENERAL_SERVICE, POUNDS_LAUNDRY, order 2), 03000 Routine, 05000 Ancillary, 09000 Nonreimbursable"
            - "five mapped trial balance lines giving direct cost 100000000 / 40000000 / 200000000 / 120000000 / 10000000 (total 470000000, unmapped 0)"
            - "one COMPLETED StepdownRun with method SINGLE_APPORTIONMENT, so allocation_status == CURRENT and total_allowable_cost_cents == 448666667"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0, POUNDS_LAUNDRY: 500 } }
              as: ReimbursementAnalyst
              captures: { cc_ag: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00200", name: "Laundry and Linen", center_type: "GENERAL_SERVICE", allocation_basis: "POUNDS_LAUNDRY", stepdown_order: 2, statistics: { SQUARE_FEET: 1000, POUNDS_LAUNDRY: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_laundry: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000, POUNDS_LAUNDRY: 6000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "05000", name: "Operating Room", center_type: "ANCILLARY", statistics: { SQUARE_FEET: 2000, POUNDS_LAUNDRY: 2000 } }
              as: ReimbursementAnalyst
              captures: { cc_ancillary: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "09000", name: "Gift Shop", center_type: "NONREIMBURSABLE", statistics: { SQUARE_FEET: 0, POUNDS_LAUNDRY: 2000 } }
              as: ReimbursementAnalyst
              captures: { cc_nonreimb: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6000", description: "Administration salaries", amount_cents: 100000000, mapped_cost_center_id: "${cc_ag}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6100", description: "Laundry salaries", amount_cents: 40000000, mapped_cost_center_id: "${cc_laundry}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6200", description: "Nursing salaries", amount_cents: 200000000, mapped_cost_center_id: "${cc_routine}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6300", description: "Operating room supplies", amount_cents: 120000000, mapped_cost_center_id: "${cc_ancillary}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6400", description: "Gift shop operating cost", amount_cents: 10000000, mapped_cost_center_id: "${cc_nonreimb}" }
              as: ReimbursementAnalyst
            - call: "GET /cost-reports/${report_id}"
              payload: {}
              as: ReimbursementAnalyst
              captures: { report_version_1: $.data.version }
            - call: "POST /cost-reports/${report_id}/stepdown-runs"
              payload: { expected_cost_report_version: "${report_version_1}", method: "SINGLE_APPORTIONMENT" }
              as: ReimbursementAnalyst
              captures: { run_single_id: $.data.id }
            - call: "GET /cost-reports/${report_id}"
              payload: {}
              as: ReimbursementAnalyst
              captures: { report_version_2: $.data.version }
          trigger:
            - call: "POST /cost-reports/${report_id}/stepdown-runs"
              payload: { expected_cost_report_version: "${report_version_2}", method: "DOUBLE_APPORTIONMENT" }
              as: ReimbursementAnalyst
              captures: { run_double_id: $.data.id }
          assert:
            - "StepdownRun.${run_single_id}.total_allocated_cents == 156666667"
            - "StepdownRun.${run_double_id}.total_allocated_cents == 158571429"
            - "StepdownRun.${run_double_id}.status == COMPLETED and StepdownRun.${run_double_id}.method == DOUBLE_APPORTIONMENT"
            - "StepdownRun.${run_single_id}.status == STALE and StepdownRun.${run_single_id}.stale_reason == SUPERSEDED_BY_NEWER_RUN"
            - "CostReport.${report_id}.total_allowable_cost_cents == 449047620 (it was 448666667 immediately after the SINGLE_APPORTIONMENT run)"
            - "CostReport.${report_id}.total_allowable_cost_cents - 448666667 == 380953"
            - "CostReport.${report_id}.cost_to_charge_ratio == 1.122619 (it was 1.121667 after the SINGLE_APPORTIONMENT run)"
            - "CostCenter.${cc_ancillary}.allocated_total_cost_cents == 165047620 (it was 164666667 after the SINGLE_APPORTIONMENT run)"
            - "CostCenter.${cc_nonreimb}.allocated_total_cost_cents == 20952380 (it was 21333333 after the SINGLE_APPORTIONMENT run)"
            - "CostCenter.${cc_routine}.allocated_total_cost_cents == 284000000 under both variants"
            - "CostCenter.${cc_routine}.allocated_total_cost_cents + CostCenter.${cc_ancillary}.allocated_total_cost_cents + CostCenter.${cc_nonreimb}.allocated_total_cost_cents == 470000000 under both variants"
            - "StepdownRun.${run_double_id}.residual_unallocated_cents == 0"

      - name: wage_index_unadjusted_vs_occ_mix_adjusted_hourly_wage
        grounds:
          - calculations.average_hourly_wage
          - entities.WageIndexSubmission.fields.unadjusted_ahw_cents
          - entities.WageIndexSubmission.fields.occ_mix_adjusted_ahw_cents
          - entities.OccMixResponse.fields.category_ahw_cents
          - state_machines.WageIndexSubmission.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          This dual variant lives in the wage-index domain (WageIndexSubmission x OccMixResponse), a
          different entity domain and a different metric than the stepdown instance: the identical
          submission yields unadjusted_ahw_cents 3128 versus occ_mix_adjusted_ahw_cents 3240 because
          the adjusted variant reweights per-category hourly wages by renormalized national targets.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with a DRAFT CostReport for FY 2025-07-01..2026-06-30"
            - "a DRAFT WageIndexSubmission with salaries 5000000000, paid hours 2000000.00, wage-related costs 1500000000 (above the 25% cap of 1250000000), contract labor 200000000 over 80000.00 hours, excluded-area 100000000 over 50000.00 hours"
            - "five OccMixResponse rows: RN 1200000.00h/4200000000, LPN 200000.00h/400000000, NURSE_AIDE 500000.00h/750000000, MEDICAL_ASSISTANT 0.00h/0, NURSE_PRACTITIONER 100000.00h/650000000 — reported hours sum to exactly 2000000.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/wage-index-submissions"
              payload: { total_salaries_cents: 5000000000, total_paid_hours: 2000000.00, wage_related_costs_cents: 1500000000, contract_labor_cents: 200000000, contract_labor_hours: 80000.00, excluded_area_salaries_cents: 100000000, excluded_area_hours: 50000.00 }
              as: ReimbursementAnalyst
              captures: { wis_id: $.data.id }
            - call: "POST /wage-index-submissions/${wis_id}/occ-mix-responses"
              payload: { category: "RN", reported_hours: 1200000.00, reported_salaries_cents: 4200000000 }
              as: ReimbursementAnalyst
              captures: { omr_rn: $.data.id }
            - call: "POST /wage-index-submissions/${wis_id}/occ-mix-responses"
              payload: { category: "LPN", reported_hours: 200000.00, reported_salaries_cents: 400000000 }
              as: ReimbursementAnalyst
              captures: { omr_lpn: $.data.id }
            - call: "POST /wage-index-submissions/${wis_id}/occ-mix-responses"
              payload: { category: "NURSE_AIDE", reported_hours: 500000.00, reported_salaries_cents: 750000000 }
              as: ReimbursementAnalyst
              captures: { omr_aide: $.data.id }
            - call: "POST /wage-index-submissions/${wis_id}/occ-mix-responses"
              payload: { category: "MEDICAL_ASSISTANT", reported_hours: 0.00, reported_salaries_cents: 0 }
              as: ReimbursementAnalyst
              captures: { omr_ma: $.data.id }
            - call: "POST /wage-index-submissions/${wis_id}/occ-mix-responses"
              payload: { category: "NURSE_PRACTITIONER", reported_hours: 100000.00, reported_salaries_cents: 650000000 }
              as: ReimbursementAnalyst
              captures: { omr_np: $.data.id }
          trigger:
            - call: "POST /wage-index-submissions/${wis_id}/submit"
              payload: {}
              as: ReimbursementManager
          assert:
            - "WageIndexSubmission.${wis_id}.allowed_wage_related_costs_cents == 1250000000"
            - "WageIndexSubmission.${wis_id}.unadjusted_ahw_cents == 3128"
            - "WageIndexSubmission.${wis_id}.occ_mix_adjusted_ahw_cents == 3240"
            - "WageIndexSubmission.${wis_id}.effective_ahw_cents == 3240"
            - "WageIndexSubmission.${wis_id}.occ_mix_adjusted_ahw_cents != WageIndexSubmission.${wis_id}.unadjusted_ahw_cents"
            - "WageIndexSubmission.${wis_id}.occ_mix_category_count == 4"
            - "WageIndexSubmission.${wis_id}.reported_hours_total == 2000000.00"
            - "OccMixResponse.${omr_rn}.category_ahw_cents == 3500"
            - "OccMixResponse.${omr_lpn}.category_ahw_cents == 2000"
            - "OccMixResponse.${omr_aide}.category_ahw_cents == 1500"
            - "OccMixResponse.${omr_np}.category_ahw_cents == 6500"
            - "OccMixResponse.${omr_ma}.category_ahw_cents == null and MEDICAL_ASSISTANT is excluded from the weighting, its 0.0400 national target redistributed over the remaining 0.9600"
            - "WageIndexSubmission.${wis_id}.status == SUBMITTED and CostReport.${report_id}.wage_data_status == COLLECTED"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: stepdown_floor_then_remainder_rounding_order_with_created_at_tie_break
        grounds:
          - calculations.stepdown_allocation
          - entities.StepdownRun.fields.allocation_lines
          - entities.StepdownRun.fields.total_allocated_cents
          - entities.CostCenter.fields.statistics
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER is pinned: each receiver's share is floored first and
          the leftover cents are then spread by fractional part DESC with created_at ASC as tie-break,
          so cost center 05000 gets 7619048 and 09000 gets 7619047 from an identical 0.619 fraction;
          summing exact shares and rounding the total instead would move those cents.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with a DRAFT CostReport for FY 2025-07-01..2026-06-30, total_charges_cents 400000000"
            - "the same five cost centers and five mapped trial balance lines as stepdown_single_vs_double_apportionment_divergence, created in code order 00100, 00200, 03000, 05000, 09000 so created_at ASC == code ASC"
            - "no stepdown run has executed yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0, POUNDS_LAUNDRY: 500 } }
              as: ReimbursementAnalyst
              captures: { cc_ag: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00200", name: "Laundry and Linen", center_type: "GENERAL_SERVICE", allocation_basis: "POUNDS_LAUNDRY", stepdown_order: 2, statistics: { SQUARE_FEET: 1000, POUNDS_LAUNDRY: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_laundry: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000, POUNDS_LAUNDRY: 6000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "05000", name: "Operating Room", center_type: "ANCILLARY", statistics: { SQUARE_FEET: 2000, POUNDS_LAUNDRY: 2000 } }
              as: ReimbursementAnalyst
              captures: { cc_ancillary: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "09000", name: "Gift Shop", center_type: "NONREIMBURSABLE", statistics: { SQUARE_FEET: 0, POUNDS_LAUNDRY: 2000 } }
              as: ReimbursementAnalyst
              captures: { cc_nonreimb: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6000", description: "Administration salaries", amount_cents: 100000000, mapped_cost_center_id: "${cc_ag}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6100", description: "Laundry salaries", amount_cents: 40000000, mapped_cost_center_id: "${cc_laundry}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6200", description: "Nursing salaries", amount_cents: 200000000, mapped_cost_center_id: "${cc_routine}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6300", description: "Operating room supplies", amount_cents: 120000000, mapped_cost_center_id: "${cc_ancillary}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6400", description: "Gift shop operating cost", amount_cents: 10000000, mapped_cost_center_id: "${cc_nonreimb}" }
              as: ReimbursementAnalyst
            - call: "GET /cost-reports/${report_id}"
              payload: {}
              as: ReimbursementAnalyst
              captures: { report_version_1: $.data.version }
          trigger:
            - call: "POST /cost-reports/${report_id}/stepdown-runs"
              payload: { expected_cost_report_version: "${report_version_1}", method: "DOUBLE_APPORTIONMENT" }
              as: ReimbursementAnalyst
              captures: { run_id: $.data.id }
          assert:
            - "StepdownRun.${run_id}.allocation_lines has exactly 12 entries: 7 with pass == 1 and 5 with pass == 2"
            - "the pass-1 allocation_line from ${cc_laundry} to ${cc_ancillary} has amount_cents == 7619048 and the pass-1 line from ${cc_laundry} to ${cc_nonreimb} has amount_cents == 7619047 — identical 0.619 fractional parts broken by created_at ASC (05000 created before 09000)"
            - "the pass-1 allocation_line from ${cc_ag} to ${cc_laundry} has amount_cents == 16666667, i.e. floor 16666666 plus the run's single remainder cent awarded on the largest fractional part 0.667"
            - "the pass-1 allocation_line from ${cc_ag} to ${cc_routine} has amount_cents == 50000000 and to ${cc_ancillary} == 33333333"
            - "the pass-1 allocation_line from ${cc_laundry} to ${cc_ag} has amount_cents == 1904762 and to ${cc_routine} == 22857143"
            - "the pass-2 allocation_line from ${cc_ag} to ${cc_routine} has amount_cents == 1142857 and to ${cc_ancillary} == 761905"
            - "the pass-2 allocation_line from ${cc_laundry} to ${cc_routine} has amount_cents == 10000000, to ${cc_ancillary} == 3333334, to ${cc_nonreimb} == 3333333"
            - "StepdownRun.${run_id}.total_allocated_cents == 158571429 and equals the sum of all 12 allocation_lines amount_cents"
            - "every allocation_line amount_cents is an integer number of cents and StepdownRun.${run_id}.residual_unallocated_cents == 0"
            - "CostReport.${report_id}.total_allowable_cost_cents == 449047620"

      - name: interim_rate_variance_measured_before_cap_is_applied
        grounds:
          - calculations.interim_rate_projection
          - entities.InterimRateRequest.fields.variance_ratio
          - entities.InterimRateRequest.fields.approved_rate_cents
          - validations[priority=14]
          - concurrency_rules[interim-rate-request-create-stale-provider]
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency whose evaluation order is pinned: the eligibility
          gate reads variance_ratio while variance_ratio must be measured on the UNCAPPED projection,
          so this request stores variance_ratio 0.1975 and approved_rate_cents 990000; measuring the
          variance after the 1.10 cap instead would store 0.1000 and collapse every capped request.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "Provider 450123 with current_interim_rate_cents 900000 and no prior interim rate request"
            - "a FINAL_SETTLED CostReport for FY 2025-07-01..2026-06-30 whose allowable_cost_per_discharge_cents == 898095 (total_allowable_cost_cents 449047620 over 500 Medicare discharges, DOUBLE_APPORTIONMENT basis)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
