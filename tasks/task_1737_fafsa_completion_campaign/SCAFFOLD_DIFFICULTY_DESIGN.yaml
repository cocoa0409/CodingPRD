            - { call: "POST /fafsa/aid-records", as: DataImporter, payload: { campaign_id: "${camp}", external_ref: "EXT1", full_name: "Ana Lee", dob: "2009-03-04", school_code: "SC99", district_code: "D01", initial_status: "STARTED", effective_date: "2027-01-10" }, captures: { ar: $.data.id } }
            - { call: "POST /fafsa/match-links", as: MatchReviewer, payload: { senior_record_id: "${sr}", aid_record_id: "${ar}", expected_senior_record_version: "${sr_v}" }, captures: { lk: $.data.id } }
          trigger:
            - { call: "POST /fafsa/match-links/${lk}/confirm", as: MatchReviewer }
            - { call: "GET /fafsa/senior-records/${sr}", as: CampaignAdmin, captures: { ms: $.data.match_status, fs: $.data.fafsa_status } }
            - { call: "GET /fafsa/document-checklists?senior_record_id=${sr}", as: CampaignAdmin, captures: { cl: "$.data[0].id", cl_lang: "$.data[0].language", cl_tpl: "$.data[0].template_key", cl_st: "$.data[0].status" } }
