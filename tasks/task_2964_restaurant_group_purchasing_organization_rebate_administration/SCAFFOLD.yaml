# =============================================================================
# PRD Benchmark Scaffold — task_2964
# Restaurant Group Purchasing Organization & Rebate Administration
# Sections §1.0–§1.7. Difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml
#                      Corner design   → SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  2964. Restaurant Group Purchasing Organization & Rebate Administration (Buyers Edge Platform): member enrollment with distributor authorization letters, contracted manufacturer deals and item-level rebate rate cards, purchase data ingestion from distributors and normalization to contracted items, rebate accrual, validation against manufacturer claims and dispute resolution, member share versus GPO retention split by program tier, distributor cost-plus markup audit and overbilling recovery, contract compliance thresholds and deal loss on non-purchase, member reporting on savings realized versus opportunity

domain_name: gpo-rebate-administration

# Empty prefix: the topology is FLAT — every resource is its own top-level
# collection addressed by a foreign key in the request body, never by URL nesting.
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every create is a flat POST to the child's own collection with the parent id
  # in the body (POST /purchase-lines carries purchase_batch_id). The only
  # multi-segment paths are action verbs (POST /accruals/{id}/validate) and one
  # computed read (GET /members/{id}/savings-report) — no resource nesting.

  state_machine_shape: parallel
  # PurchaseBatch carries two independent state dimensions on the same row:
  # normalization_status (RECEIVED→NORMALIZED→ACCRUED, with a compensating
  # ACCRUED→RECEIVED renormalize edge) and audit_status (NOT_AUDITED→
  # AUDIT_OVERBILLED→RECOVERY_REQUESTED→RECOVERED|WRITTEN_OFF). RebateAccrual
  # and RebateDispute add revision cycles; AuthorizationLetter and
  # ManufacturerClaim reconciliation add branching fork points.

  relationship_patterns:
    - one_to_many          # ManufacturerDeal → ContractedItem → RateCard
    - many_to_many         # PurchaseLine joins Member × ContractedItem
    - self_referential     # RateCard.supersedes_rate_card_id -> RateCard.id
    - cross_aggregate      # RebateAccrual spans PurchaseLine, RateCard, Member

  role_model: segregation_of_duties
  # The operator who accrued a batch or validated an accrual may not decide the
  # dispute raised against it; enforced on X-User-ID, not on role name.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 13 entities / 61 endpoints / 52 error codes / 10 calculations (2 with
  # divergent variants) / 13 state-machine dimensions across 10 entities
  # (2 cyclic, 1 entity with 2 parallel dimensions, 4 branch points) /
  # 41 ordered validations / 2 OCC races.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ProgramTier
    parent: null
    common_fields: true
    fields:
      - name: tier_code
        type: enum
        source: input
        description: "GPO program tier this configuration row defines."
        constraints: "one of {CORE, PLUS, ELITE}; unique across ProgramTier rows"
      - name: member_share_bps
        type: integer
        source: input
        description: "Share of net distributable rebate paid to the member, in basis points."
        constraints: "0..10000"
      - name: gpo_retention_bps
        type: integer
        source: input
        description: "Share of net distributable rebate retained by the GPO, in basis points."
        constraints: "0..10000; member_share_bps + gpo_retention_bps MUST equal 10000"
      - name: admin_fee_bps_low
        type: integer
        source: input
        description: "Admin fee in basis points applied when the member's ytd_net_snapshot_cents < ADMIN_FEE_BAND_BREAK_CENTS."
        constraints: "0..10000"
      - name: admin_fee_bps_high
        type: integer
        source: input
        description: "Admin fee in basis points applied when the member's ytd_net_snapshot_cents >= ADMIN_FEE_BAND_BREAK_CENTS."
        constraints: "0..10000"
      - name: compliance_min_ratio_bps
        type: integer
        source: input
        description: "Minimum purchase-to-commitment ratio in basis points for a ComplianceReview to return PASS."
        constraints: "0..10000"
      - name: markup_cap_bps
        type: integer
        source: input
        description: "Maximum cost-plus markup in basis points the GPO permits any distributor to bill this tier's members."
        constraints: "0..10000"
      - name: dispute_window_days
        type: integer
        source: input
        description: "Number of whole days after RebateAccrual.created_at during which a dispute may still be opened (inclusive)."
        constraints: ">= 1"
      - name: reversal_posture_limit
        type: integer
        source: input
        default: 2
        description: "Number of dispute-driven accrual reversals at which the member's reconciliation_posture flips to RESTRICTED."
        constraints: ">= 1"

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Distributor legal/trade name."
        constraints: "1..200 chars"
      - name: dba_code
        type: string
        source: input
        description: "Short operating code used on purchase feeds."
        constraints: "unique across Distributor; 3..20 chars, uppercase letters, digits and hyphen only"
      - name: contracted_markup_bps
        type: integer
        source: input
        description: "Cost-plus markup in basis points this distributor is contracted to bill above its reported base cost."
        constraints: "0..10000"
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: "Distributor standing; SUSPENDED distributors may not open new PurchaseBatches."
        constraints: "one of {ACTIVE, SUSPENDED}; SUSPENDED is produced only by a WRITTEN_OFF recovery settlement"
      - name: active_letter_count
        type: integer
        source: computed
        default: 0
        description: "Count of AuthorizationLetter rows for this distributor with status == ACTIVE."
      - name: overbilled_recovered_cents
        type: integer
        source: computed
        default: 0
        description: "Lifetime sum of recovered_cents across this distributor's PurchaseBatch rows with audit_status == RECOVERED."

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Restaurant operator legal name."
        constraints: "1..200 chars"
      - name: tier_id
        type: string
        source: input
        description: "FK -> ProgramTier.id; pins the split, admin-fee band, markup cap, dispute window and posture limit applied to this member."
      - name: committed_annual_spend_cents
        type: integer
        source: input
        description: "Annual contracted-spend commitment the member signed, in cents; prorated per ComplianceReview window."
        constraints: ">= 1"
      - name: enrollment_status
        type: enum
        source: computed
        default: PENDING
        description: "Enrollment lifecycle; only ACTIVE members may have purchase lines ingested or disputes opened."
        constraints: "one of {PENDING, ACTIVE, SUSPENDED, TERMINATED}"
      - name: reconciliation_posture
        type: enum
        source: computed
        default: CLEAR
        description: "Derived posture; flips to RESTRICTED once dispute_reversal_count reaches the tier's reversal_posture_limit. One-way."
        constraints: "one of {CLEAR, RESTRICTED}"
      - name: payout_hold
        type: boolean
        source: computed
        default: false
        description: "When true, accruals for this member may not be validated and are never marked PAID at period close."
      - name: active_letter_count
        type: integer
        source: computed
        default: 0
        description: "Count of this member's AuthorizationLetter rows with status == ACTIVE."
      - name: accrued_member_share_cents
        type: integer
        source: computed
        default: 0
        description: "Running sum of member_share_cents over this member's RebateAccrual rows with status IN {ACCRUED, VALIDATED, FLAGGED, DISPUTED, PAID}."
      - name: attributed_gpo_retention_cents
        type: integer
        source: computed
        default: 0
        description: "Running sum of gpo_retention_cents over the same accrual set as accrued_member_share_cents."
      - name: attributed_admin_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Running sum of admin_fee_cents over the same accrual set as accrued_member_share_cents."
      - name: ytd_net_snapshot_cents
        type: integer
        source: computed
        default: 0
        description: "Frozen snapshot of this member's net_distributable_cents total, rewritten only by close-period; selects the admin-fee band for later accruals."
      - name: dispute_reversal_count
        type: integer
        source: computed
        default: 0
        description: "Count of this member's RebateAccrual rows that reached REVERSED with reversal_reason == DISPUTE_UPHELD."
      - name: recovery_credit_cents
        type: integer
        source: computed
        default: 0
        description: "Lifetime sum of overbilling recovery allocated to this member by settle-recovery."

  - name: AuthorizationLetter
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the operator granting the distributor permission to release its purchase data to the GPO."
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; the distributor authorized to release data."
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start instant of the authorization window. ISO 8601 UTC with exactly three fractional digits, e.g. 2026-01-01T00:00:00.000Z."
      - name: effective_to
        type: datetime
        source: input
        description: "EXCLUSIVE end instant of the authorization window (half-open [effective_from, effective_to)). Same ISO 8601 UTC format."
        constraints: "MUST be strictly after effective_from"
      - name: signatory_name
        type: string
        source: input
        description: "Name of the member officer who signed the letter."
        constraints: "1..120 chars"
      - name: scope
        type: enum
        source: input
        description: "Data-release scope; only PURCHASE_DATA_AND_PRICING letters make the member's lines eligible for cost-plus markup audit."
        constraints: "one of {PURCHASE_DATA_ONLY, PURCHASE_DATA_AND_PRICING}"
      - name: status
        type: enum
        source: computed
        default: SUBMITTED
        description: "Letter lifecycle."
        constraints: "one of {SUBMITTED, ACTIVE, DECLINED, REVOKED, EXPIRED}"
      - name: countersigned_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the distributor countersigned; null until then."

  - name: ManufacturerDeal
    parent: null
    common_fields: true
    fields:
      - name: manufacturer_name
        type: string
        source: input
        description: "Manufacturer the GPO contracted with."
        constraints: "1..200 chars"
      - name: deal_code
        type: string
        source: input
        description: "Contract identifier printed on rate cards and manufacturer claims."
        constraints: "unique across ManufacturerDeal; 3..30 chars"
      - name: effective_from
        type: string
        source: input
        description: "Inclusive first calendar date the deal covers, format YYYY-MM-DD."
      - name: effective_to
        type: string
        source: input
        description: "Inclusive last calendar date the deal covers, format YYYY-MM-DD."
        constraints: "MUST be >= effective_from"
      - name: required_purchase_window_days
        type: integer
        source: input
        description: "A ComplianceReview window at least this many days long with zero deal-wide contracted spend causes deal loss."
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Deal lifecycle; LOST is terminal."
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED, LOST}"
      - name: contracted_item_count
        type: integer
        source: computed
        default: 0
        description: "Count of ContractedItem rows for this deal with status == ACTIVE."
      - name: last_purchase_date
        type: string
        source: computed
        description: "Greatest PurchaseLine.invoice_date among lines matched to this deal's items (YYYY-MM-DD); null when none."

  - name: ContractedItem
    parent: null
    common_fields: true
    fields:
      - name: deal_id
        type: string
        source: input
        description: "FK -> ManufacturerDeal.id; the deal that contracts this item."
      - name: manufacturer_sku
        type: string
        source: input
        description: "Manufacturer's own item number."
        constraints: "unique per (deal_id, manufacturer_sku); 1..40 chars"
      - name: normalized_item_key
        type: string
        source: input
        description: "Canonical cross-distributor item key that purchase lines are normalized against."
        constraints: "1..60 chars, uppercase letters, digits and hyphen only"
      - name: pack_size
        type: integer
        source: input
        description: "Selling units per case."
        constraints: ">= 1"
      - name: baseline_unit_cost_cents
        type: integer
        source: input
        description: "Pre-GPO reference cost per case, used as the savings baseline."
        constraints: ">= 1"
      - name: contract_unit_cost_cents
        type: integer
        source: input
        description: "Negotiated cost per case under the deal, used as the savings-opportunity target."
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        default: ACTIVE
        description: "Item standing; DELISTED items are ineligible for normalization."
        constraints: "one of {ACTIVE, DELISTED}"
      - name: approved_rate_card_count
        type: integer
        source: computed
        default: 0
        description: "Count of RateCard rows for this item with status == APPROVED."

  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - name: contracted_item_id
        type: string
        source: input
        description: "FK -> ContractedItem.id; the item this rate card prices."
      - name: supersedes_rate_card_id
        type: string
        source: computed
        description: "FK -> RateCard.id; set when this card was created with supersede == true, pointing at the card it truncated. Null otherwise."
      - name: rate_type
        type: enum
        source: input
        description: "Rebate mechanic."
        constraints: "one of {PER_CASE, PERCENT_OF_SPEND, TIERED_VOLUME}"
      - name: flat_rate_cents_per_case
        type: integer
        source: input
        description: "Rebate cents per case; required when rate_type == PER_CASE, MUST be null otherwise."
        constraints: ">= 1 when present"
      - name: percent_bps
        type: integer
        source: input
        description: "Rebate as basis points of invoiced extended cost; required when rate_type == PERCENT_OF_SPEND, MUST be null otherwise."
        constraints: "1..10000 when present"
      - name: tier_breaks
        type: array
        source: input
        description: "Ordered volume tiers [{min_cases, rate_cents_per_case}, ...]; required when rate_type == TIERED_VOLUME, MUST be null otherwise."
        constraints: ">= 2 entries; first min_cases MUST be 0; min_cases strictly increasing; every rate_cents_per_case >= 1"
      - name: effective_from
        type: string
        source: input
        description: "Inclusive first calendar date this card prices, format YYYY-MM-DD."
      - name: effective_to
        type: string
        source: input
        description: "INCLUSIVE last calendar date this card prices (closed interval [effective_from, effective_to]), format YYYY-MM-DD."
        constraints: "MUST be >= effective_from"
      - name: status
        type: enum
        source: computed
        default: PROPOSED
        description: "Rate card lifecycle."
        constraints: "one of {PROPOSED, APPROVED, SUPERSEDED, EXPIRED}"
      - name: pinned_item_version
        type: integer
        source: computed
        description: "ContractedItem.version observed at the moment this card was APPROVED; null while PROPOSED."

  - name: PurchaseBatch
    parent: null
    common_fields: true
    fields:
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; the distributor that submitted this purchase feed."
      - name: period_start
        type: string
        source: input
        description: "Inclusive first calendar date covered by the feed, format YYYY-MM-DD."
      - name: period_end
        type: string
        source: input
        description: "Inclusive last calendar date covered by the feed, format YYYY-MM-DD."
        constraints: "MUST be >= period_start"
      - name: source_reference
        type: string
        source: input
        description: "Distributor's own file reference for this feed."
        constraints: "unique per (distributor_id, source_reference); 3..40 chars"
      - name: normalization_status
        type: enum
        source: computed
        default: RECEIVED
        description: "First independent state dimension: item-normalization / accrual progress of the feed."
        constraints: "one of {RECEIVED, NORMALIZED, ACCRUED}"
      - name: audit_status
        type: enum
        source: computed
        default: NOT_AUDITED
        description: "Second independent state dimension: cost-plus markup audit and overbilling recovery progress of the same feed."
        constraints: "one of {NOT_AUDITED, AUDIT_CLEAN, AUDIT_OVERBILLED, RECOVERY_REQUESTED, RECOVERED, WRITTEN_OFF}"
      - name: line_count
        type: integer
        source: computed
        default: 0
        description: "Count of PurchaseLine rows in this batch."
      - name: total_cases_ingested
        type: integer
        source: computed
        default: 0
        description: "Sum of PurchaseLine.cases_shipped over every line in this batch; never changed by normalization or accrual."
      - name: matched_cases
        type: integer
        source: computed
        default: 0
        description: "Sum of cases_shipped over this batch's lines with match_status == MATCHED."
      - name: unmatched_cases
        type: integer
        source: computed
        default: 0
        description: "total_cases_ingested - matched_cases; covers UNMATCHED, AMBIGUOUS and EXCLUDED lines."
      - name: overbilled_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of PurchaseLine.overbilled_cents over this batch, written by audit-markup."
      - name: recovered_cents
        type: integer
        source: computed
        default: 0
        description: "Cents actually recovered from the distributor by settle-recovery; 0 when written off."
      - name: accrued_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the RebateAnalyst who last ran accrue on this batch; null before the first accrue. Segregation-of-duties input."
      - name: payout_hold
        type: boolean
        source: computed
        default: false
        description: "Set true when a member holding accruals in this batch reaches RESTRICTED posture."

  - name: PurchaseLine
    parent: null
    common_fields: true
    fields:
      - name: purchase_batch_id
        type: string
        source: input
        description: "FK -> PurchaseBatch.id; the feed this line arrived on."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the operator that bought the goods."
      - name: contracted_item_id
        type: string
        source: computed
        description: "FK -> ContractedItem.id; written by normalization or manual mapping. Null while UNMATCHED, AMBIGUOUS or EXCLUDED."
      - name: distributor_sku
        type: string
        source: input
        description: "Distributor's own item number as billed."
        constraints: "1..40 chars"
      - name: vendor_item_description
        type: string
        source: input
        description: "Free-text item description from the invoice."
        constraints: "1..200 chars"
      - name: normalized_item_key_reported
        type: string
        source: input
        description: "Canonical item key the distributor asserts for this line; matched against ContractedItem.normalized_item_key."
        constraints: "1..60 chars, uppercase letters, digits and hyphen only"
      - name: cases_shipped
        type: integer
        source: input
        description: "Cases delivered on this line."
        constraints: ">= 1"
      - name: invoice_unit_cost_cents
        type: integer
        source: input
        description: "Cost per case actually billed to the member."
        constraints: ">= 1"
      - name: distributor_base_cost_cents
        type: integer
        source: input
        description: "Distributor's declared base (pre-markup) cost per case; the cost-plus audit basis."
        constraints: ">= 1"
      - name: invoice_date
        type: string
        source: input
        description: "Calendar date of the invoice, format YYYY-MM-DD; MUST fall inside the batch's closed [period_start, period_end]."
      - name: invoice_extended_cents
        type: integer
        source: computed
        description: "cases_shipped * invoice_unit_cost_cents, exact integer."
      - name: match_status
        type: enum
        source: computed
        default: UNMATCHED
        description: "Normalization outcome for this line."
        constraints: "one of {UNMATCHED, MATCHED, AMBIGUOUS, EXCLUDED}"
      - name: accrual_block_reason
        type: enum
        source: computed
        default: NONE
        description: "Why this line produced no accrual."
        constraints: "one of {NONE, NO_RATE_CARD, DEAL_NOT_ACTIVE, ITEM_DELISTED}"
      - name: overbilled_cents
        type: integer
        source: computed
        default: 0
        description: "Cost-plus overbilling on this line, written by audit-markup; 0 for lines whose member has no PURCHASE_DATA_AND_PRICING letter."

  - name: RebateAccrual
    parent: null
    common_fields: true
    fields:
      - name: purchase_line_id
        type: string
        source: computed
        description: "FK -> PurchaseLine.id; the matched line this accrual monetizes. One accrual per line at most."
      - name: member_id
        type: string
        source: computed
        description: "FK -> Member.id; copied from the purchase line."
      - name: rate_card_id
        type: string
        source: computed
        description: "FK -> RateCard.id; the APPROVED card selected for the line's invoice_date."
      - name: basis
        type: enum
        source: computed
        default: MARGINAL_BATCH
        description: "Which variant of the tiered-volume rebate produced the current gross_rebate_cents."
        constraints: "one of {MARGINAL_BATCH, BLENDED_PERIOD}"
      - name: accrued_cases
        type: integer
        source: computed
        description: "Cases credited on this accrual; equals the line's cases_shipped."
      - name: gross_rebate_cents
        type: integer
        source: computed
        description: "Manufacturer-funded rebate earned on the line before any split."
      - name: admin_fee_bps_applied
        type: integer
        source: computed
        description: "Admin-fee basis points frozen at accrual time from the member's ytd_net_snapshot_cents band; reused verbatim when close-period rebases the gross."
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "GPO administration fee withheld from gross_rebate_cents."
      - name: net_distributable_cents
        type: integer
        source: computed
        description: "gross_rebate_cents - admin_fee_cents."
      - name: member_share_cents
        type: integer
        source: computed
        description: "Member's cut of net_distributable_cents per the tier split."
      - name: gpo_retention_cents
        type: integer
        source: computed
        description: "net_distributable_cents - member_share_cents; absorbs the rounding remainder so the split is exact."
      - name: final_adjustment_cents
        type: integer
        source: computed
        default: 0
        description: "Signed delta applied to gross_rebate_cents when close-period switched this accrual to BLENDED_PERIOD."
      - name: status
        type: enum
        source: computed
        default: ACCRUED
        description: "Accrual lifecycle; REVERSED and PAID are terminal."
        constraints: "one of {ACCRUED, VALIDATED, FLAGGED, DISPUTED, REVERSED, PAID}"
      - name: reversal_reason
        type: enum
        source: computed
        default: NONE
        description: "Why the accrual was reversed."
        constraints: "one of {NONE, DISPUTE_UPHELD, RENORMALIZED}"
      - name: validated_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the RebateAnalyst who validated this accrual; null before validation. Segregation-of-duties input."

  - name: ManufacturerClaim
    parent: null
    common_fields: true
    fields:
      - name: deal_id
        type: string
        source: input
        description: "FK -> ManufacturerDeal.id; the deal the manufacturer is claiming against."
      - name: period_start
        type: string
        source: input
        description: "Inclusive first calendar date of the claimed period, format YYYY-MM-DD."
      - name: period_end
        type: string
        source: input
        description: "Inclusive last calendar date of the claimed period, format YYYY-MM-DD."
        constraints: "MUST be >= period_start"
      - name: claimed_units
        type: integer
        source: input
        description: "Cases the manufacturer says it funded rebate on."
        constraints: ">= 0"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: "Rebate cents the manufacturer says it owes for the period."
        constraints: ">= 0"
      - name: accrued_amount_cents
        type: integer
        source: computed
        default: 0
        description: "GPO-side accrued gross for the same deal and period, written by reconcile."
      - name: variance_bps
        type: integer
        source: computed
        default: 0
        description: "Absolute claim-vs-accrual variance in basis points of accrued_amount_cents, written by reconcile."
      - name: status
        type: enum
        source: computed
        default: SUBMITTED
        description: "Claim lifecycle; RECONCILED and SUPERSEDED are terminal."
        constraints: "one of {SUBMITTED, RECONCILED, VARIANCE_FLAGGED, SUPERSEDED}"
      - name: reconciled_at
        type: datetime
        source: computed
        description: "Logical-clock instant of reconciliation; null before."

  - name: RebateDispute
    parent: null
    common_fields: true
    fields:
      - name: accrual_id
        type: string
        source: input
        description: "FK -> RebateAccrual.id; the accrual whose amount the member contests."
      - name: claim_id
        type: string
        source: input
        description: "FK -> ManufacturerClaim.id; the manufacturer claim the member cites as evidence. Optional, null when omitted."
      - name: reason_code
        type: enum
        source: input
        description: "Dispute grounds."
        constraints: "one of {RATE_MISMATCH, UNITS_MISMATCH, ITEM_MISMATCH, TIER_MISMATCH}"
      - name: disputed_amount_cents
        type: integer
        source: input
        description: "Cents the member claims were short-paid."
        constraints: ">= 1 and <= the accrual's member_share_cents"
      - name: opened_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the MemberOperator who opened the dispute."
      - name: accrual_status_before
        type: enum
        source: computed
        description: "RebateAccrual.status observed at the instant this dispute was opened; a REJECTED decision restores the accrual to exactly this status."
        constraints: "one of {ACCRUED, VALIDATED, FLAGGED}"
      - name: evidence_round_count
        type: integer
        source: computed
        default: 0
        description: "Number of completed request-evidence / submit-evidence cycles on this dispute."
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: "Dispute lifecycle; UPHELD and REJECTED are terminal."
        constraints: "one of {OPEN, EVIDENCE_REQUESTED, UPHELD, REJECTED}"
      - name: decided_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the DisputeArbiter who decided; null before decision."
      - name: decision_note
        type: string
        source: computed
        description: "Free-text rationale captured at decision time; null before decision."

  - name: ComplianceReview
    parent: null
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member whose commitment is being reviewed."
      - name: deal_id
        type: string
        source: input
        description: "FK -> ManufacturerDeal.id; the deal whose purchase requirement is being reviewed."
      - name: window_start
        type: string
        source: input
        description: "Inclusive first calendar date of the review window, format YYYY-MM-DD."
      - name: window_end
        type: string
        source: input
        description: "Inclusive last calendar date of the review window, format YYYY-MM-DD."
        constraints: "MUST be >= window_start and MUST NOT be after the logical clock's current date"
      - name: window_days
        type: integer
        source: computed
        description: "(window_end - window_start) in days + 1, i.e. both endpoints counted."
      - name: committed_spend_prorated_cents
        type: integer
        source: computed
        description: "Member's committed_annual_spend_cents prorated to window_days over a 365-day year."
      - name: contracted_spend_cents
        type: integer
        source: computed
        description: "This member's matched contracted spend against this deal inside the window."
      - name: deal_wide_contracted_spend_cents
        type: integer
        source: computed
        description: "Matched contracted spend against this deal inside the window across ALL members; drives deal loss."
      - name: purchase_ratio_bps
        type: integer
        source: computed
        description: "floor(contracted_spend_cents * 10000 / committed_spend_prorated_cents); 0 when the prorated commitment is 0."
      - name: result
        type: enum
        source: computed
        description: "Review verdict."
        constraints: "one of {PASS, WARN, BREACH, DEAL_LOST}"
      - name: triggered_deal_loss
        type: boolean
        source: computed
        default: false
        description: "True exactly when result == DEAL_LOST and this review moved the deal from ACTIVE to LOST."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Member
    dimension: enrollment_status
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /members/{member_id}/activate"
        actor: GpoAdmin
        preconditions:
          - "member.enrollment_status == PENDING"
          - "member.active_letter_count >= 1"
        side_effects:
          - "set enrollment_status = ACTIVE"
          - "increments Member.version by 1 and refreshes updated_at"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /members/{member_id}/activate (reinstatement after a compliance breach)"
        actor: GpoAdmin
        preconditions:
          - "member.enrollment_status == SUSPENDED"
          - "member.active_letter_count >= 1"
        side_effects:
          - "set enrollment_status = ACTIVE"
          - "set payout_hold = false"
          - "increments Member.version by 1"
        note: "reconciliation_posture is NOT cleared by reinstatement; RESTRICTED is one-way."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: POST /compliance-reviews produced result == BREACH for this member"
        actor: system
        preconditions:
          - "review.result == BREACH"
          - "member.enrollment_status == ACTIVE"
        side_effects:
          - "set enrollment_status = SUSPENDED"
          - "set payout_hold = true"
          - "increments Member.version by 1"
      - from: PENDING
        to: TERMINATED
        trigger: "POST /members/{member_id}/terminate"
        actor: GpoAdmin
        preconditions: ["member.enrollment_status != TERMINATED"]
        side_effects:
          - "set enrollment_status = TERMINATED; set payout_hold = true"
          - "cascade hop 1: every AuthorizationLetter with member_id == member.id and status == ACTIVE transitions ACTIVE -> REVOKED"
          - "cascade hop 2 (caused by hop 1): Member.active_letter_count and each affected Distributor.active_letter_count are recomputed as the count of that side's letters with status == ACTIVE"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /members/{member_id}/terminate"
        actor: GpoAdmin
        preconditions: ["member.enrollment_status != TERMINATED"]
        side_effects:
          - "set enrollment_status = TERMINATED; set payout_hold = true"
          - "cascade hop 1: every AuthorizationLetter with member_id == member.id and status == ACTIVE transitions ACTIVE -> REVOKED"
          - "cascade hop 2 (caused by hop 1): Member.active_letter_count and each affected Distributor.active_letter_count are recomputed"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /members/{member_id}/terminate"
        actor: GpoAdmin
        preconditions: ["member.enrollment_status != TERMINATED"]
        side_effects:
          - "set enrollment_status = TERMINATED; set payout_hold = true"
          - "cascade hop 1: every AuthorizationLetter with member_id == member.id and status == ACTIVE transitions ACTIVE -> REVOKED"
          - "cascade hop 2 (caused by hop 1): active_letter_count recomputed on the member and on each affected distributor"

  - entity: Member
    dimension: reconciliation_posture
    initial_state: CLEAR
    terminal_states: [RESTRICTED]
    transitions:
      - from: CLEAR
        to: RESTRICTED
        trigger: "system: a RebateAccrual of this member reached REVERSED with reversal_reason == DISPUTE_UPHELD and dispute_reversal_count then reached ProgramTier.reversal_posture_limit"
        actor: system
        preconditions:
          - "member.reconciliation_posture == CLEAR"
          - "member.dispute_reversal_count >= tier.reversal_posture_limit"
        side_effects:
          - "set reconciliation_posture = RESTRICTED"
          - "cascade (caused by the posture flip): set Member.payout_hold = true"
          - "cascade (caused by the posture flip): every PurchaseBatch that holds at least one PurchaseLine of this member and whose normalization_status == ACCRUED gets payout_hold = true and version incremented"

  - entity: AuthorizationLetter
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [DECLINED, REVOKED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /authorization-letters/{letter_id}/countersign with decision == ACCEPT"
        actor: DistributorFeed
        preconditions:
          - "letter.status == SUBMITTED"
          - "distributor.status == ACTIVE"
          - "X-User-ID == letter.distributor_id"
        side_effects:
          - "set status = ACTIVE; set countersigned_at = logical clock now"
          - "increments Member.active_letter_count by 1 and Distributor.active_letter_count by 1"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /authorization-letters/{letter_id}/countersign with decision == DECLINE"
        actor: DistributorFeed
        preconditions:
          - "letter.status == SUBMITTED"
          - "X-User-ID == letter.distributor_id"
        side_effects:
          - "set status = DECLINED; countersigned_at remains null"
          - "no counter changes on Member or Distributor"
        note: "Branch point: ACCEPT and DECLINE fork from the same trigger with disjoint side-effect sets."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /authorization-letters/{letter_id}/revoke"
        actor: MemberOperator
        preconditions: ["letter.status == ACTIVE"]
        side_effects:
          - "set status = REVOKED"
          - "decrements Member.active_letter_count by 1 and Distributor.active_letter_count by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "system: cascade from POST /members/{member_id}/terminate"
        actor: system
        preconditions: ["letter.status == ACTIVE", "letter.member_id == the terminated member"]
        side_effects:
          - "set status = REVOKED"
          - "active_letter_count recomputed on both sides"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advanced the clock to or past letter.effective_to"
        actor: system
        preconditions: ["letter.status == ACTIVE", "new clock instant >= letter.effective_to"]
        side_effects:
          - "set status = EXPIRED"
          - "decrements Member.active_letter_count by 1 and Distributor.active_letter_count by 1"

  - entity: Distributor
    dimension: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: POST /purchase-batches/{batch_id}/settle-recovery with outcome == WRITTEN_OFF"
        actor: system
        preconditions: ["distributor.status == ACTIVE"]
        side_effects:
          - "set status = SUSPENDED (contract review); the distributor can no longer open PurchaseBatches or countersign letters"
          - "increments Distributor.version by 1"

  - entity: ManufacturerDeal
    dimension: status
    initial_state: DRAFT
    terminal_states: [LOST]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /manufacturer-deals/{deal_id}/activate"
        actor: GpoAdmin
        preconditions:
          - "deal.status == DRAFT"
          - "at least one ContractedItem with deal_id == deal.id has status == ACTIVE and approved_rate_card_count >= 1"
        side_effects:
          - "set status = ACTIVE"
          - "recomputes contracted_item_count as the count of this deal's items with status == ACTIVE"
          - "increments ManufacturerDeal.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /manufacturer-deals/{deal_id}/suspend"
        actor: GpoAdmin
        preconditions: ["deal.status == ACTIVE"]
        side_effects:
          - "set status = SUSPENDED"
          - "increments ManufacturerDeal.version by 1"
        note: "Items stay ACTIVE but become normalization-ineligible, so later normalize runs mark their lines EXCLUDED / DEAL_NOT_ACTIVE."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /manufacturer-deals/{deal_id}/resume"
        actor: GpoAdmin
        preconditions: ["deal.status == SUSPENDED"]
        side_effects:
          - "set status = ACTIVE"
          - "increments ManufacturerDeal.version by 1"
        note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE may repeat any number of times."
      - from: ACTIVE
        to: LOST
        trigger: "system: POST /compliance-reviews produced result == DEAL_LOST"
        actor: system
        preconditions:
          - "deal.status == ACTIVE"
          - "review.deal_wide_contracted_spend_cents == 0"
          - "review.window_days >= deal.required_purchase_window_days"
        side_effects:
          - "cascade hop 1: set deal.status = LOST and review.triggered_deal_loss = true"
          - "cascade hop 2 (caused by hop 1 - the deal left ACTIVE): every ContractedItem with deal_id == deal.id and status == ACTIVE transitions ACTIVE -> DELISTED; deal.contracted_item_count becomes 0"
          - "cascade hop 3 (caused by hop 2 - those items became DELISTED): every RateCard whose contracted_item_id is one of those items and whose status IN {PROPOSED, APPROVED} transitions to EXPIRED, and each item's approved_rate_card_count becomes 0"
          - "cascade hop 3b (also caused by hop 2): every PurchaseLine whose contracted_item_id is one of those items and whose batch has normalization_status == NORMALIZED transitions MATCHED -> EXCLUDED with accrual_block_reason = ITEM_DELISTED and contracted_item_id cleared"
          - "cascade hop 4 (caused by hop 3b - those lines left MATCHED): each affected PurchaseBatch recomputes matched_cases and unmatched_cases; total_cases_ingested is NOT touched"

  - entity: ContractedItem
    dimension: status
    initial_state: ACTIVE
    terminal_states: [DELISTED]
    transitions:
      - from: ACTIVE
        to: DELISTED
        trigger: "system: cascade hop 2 of the ManufacturerDeal ACTIVE -> LOST transition"
        actor: system
        preconditions: ["item.status == ACTIVE", "item.deal_id == the lost deal"]
        side_effects:
          - "set status = DELISTED"
          - "increments ContractedItem.version by 1"
          - "triggers cascade hops 3 and 3b on the item's RateCards and matched PurchaseLines"

  - entity: RateCard
    dimension: status
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /rate-cards/{rate_card_id}/approve"
        actor: GpoAdmin
        preconditions:
          - "card.status == PROPOSED"
          - "the card's ContractedItem has status == ACTIVE"
          - "that item's ManufacturerDeal has status IN {DRAFT, ACTIVE}"
        side_effects:
          - "set status = APPROVED; set pinned_item_version = ContractedItem.version observed at this instant"
          - "increments ContractedItem.approved_rate_card_count by 1"
          - "increments ContractedItem.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: POST /rate-cards with supersede == true created a newer card for the same contracted_item_id"
        actor: system
        preconditions:
          - "incumbent.status == APPROVED"
          - "incumbent.effective_to >= new_card.effective_from"
        side_effects:
          - "set incumbent.effective_to = new_card.effective_from minus one calendar day; set incumbent.status = SUPERSEDED"
          - "set new_card.supersedes_rate_card_id = incumbent.id"
          - "decrements ContractedItem.approved_rate_card_count by 1"
          - "the POST /rate-cards call that caused this transition increments ContractedItem.version by exactly 1 in total, not once per affected card"
      - from: APPROVED
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advanced the clock past card.effective_to"
        actor: system
        preconditions: ["card.status == APPROVED", "new clock calendar date > card.effective_to"]
        side_effects:
          - "set status = EXPIRED"
          - "decrements ContractedItem.approved_rate_card_count by 1"
      - from: PROPOSED
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advanced the clock past card.effective_to"
        actor: system
        preconditions: ["card.status == PROPOSED", "new clock calendar date > card.effective_to"]
        side_effects:
          - "set status = EXPIRED"
          - "approved_rate_card_count unchanged (the card was never approved)"
      - from: APPROVED
        to: EXPIRED
        trigger: "system: cascade hop 3 of the ManufacturerDeal ACTIVE -> LOST transition"
        actor: system
        preconditions: ["card.status == APPROVED", "the card's ContractedItem just became DELISTED"]
        side_effects:
          - "set status = EXPIRED"
          - "sets ContractedItem.approved_rate_card_count to 0"

  - entity: PurchaseBatch
    dimension: normalization_status
    initial_state: RECEIVED
    terminal_states: []
    note: "Dimension A of two independent state dimensions on the same PurchaseBatch row. Advancing this dimension never reads or writes audit_status."
    transitions:
      - from: RECEIVED
        to: NORMALIZED
        trigger: "POST /purchase-batches/{batch_id}/normalize"
        actor: RebateAnalyst
        preconditions:
          - "batch.normalization_status == RECEIVED"
          - "batch.line_count >= 1"
        side_effects:
          - "runs calculation normalization_match over every line with match_status == UNMATCHED, writing each line's match_status, contracted_item_id and accrual_block_reason"
          - "recomputes batch.matched_cases and batch.unmatched_cases"
          - "refreshes ManufacturerDeal.last_purchase_date for every deal that gained a MATCHED line"
      - from: NORMALIZED
        to: ACCRUED
        trigger: "POST /purchase-batches/{batch_id}/accrue"
        actor: RebateAnalyst
        preconditions:
          - "batch.normalization_status == NORMALIZED"
          - "at least one line has match_status == MATCHED and a resolvable APPROVED RateCard for its invoice_date"
        side_effects:
          - "creates one RebateAccrual per accruable line, writing gross_rebate_cents from calculation rebate_gross variant MARGINAL_BATCH and basis = MARGINAL_BATCH"
          - "writes admin_fee_bps_applied, admin_fee_cents, net_distributable_cents, member_share_cents and gpo_retention_cents from calculation rebate_split"
          - "increments Member.accrued_member_share_cents, Member.attributed_gpo_retention_cents and Member.attributed_admin_fee_cents by the accrual's respective components"
          - "sets lines that matched but resolved no APPROVED card to accrual_block_reason = NO_RATE_CARD"
          - "sets batch.accrued_by_user_id = the caller's X-User-ID"
      - from: NORMALIZED
        to: RECEIVED
        trigger: "POST /purchase-batches/{batch_id}/renormalize"
        actor: RebateAnalyst
        preconditions:
          - "batch.normalization_status == NORMALIZED"
          - "batch.audit_status IN {NOT_AUDITED, AUDIT_CLEAN, AUDIT_OVERBILLED}"
        side_effects:
          - "resets every line to match_status = UNMATCHED, contracted_item_id = null, accrual_block_reason = NONE"
          - "sets matched_cases = 0 and unmatched_cases = total_cases_ingested; total_cases_ingested is NOT recomputed"
          - "resets audit_status to NOT_AUDITED, batch.overbilled_cents = 0 and every line.overbilled_cents = 0"
      - from: ACCRUED
        to: RECEIVED
        trigger: "POST /purchase-batches/{batch_id}/renormalize (compensating action for accrue)"
        actor: RebateAnalyst
        preconditions:
          - "batch.normalization_status == ACCRUED"
          - "no RebateAccrual of this batch has status IN {VALIDATED, DISPUTED, PAID}"
          - "batch.audit_status IN {NOT_AUDITED, AUDIT_CLEAN, AUDIT_OVERBILLED}"
        side_effects:
          - "every RebateAccrual of this batch with status IN {ACCRUED, FLAGGED} transitions to REVERSED with reversal_reason = RENORMALIZED"
          - "decrements Member.accrued_member_share_cents, Member.attributed_gpo_retention_cents and Member.attributed_admin_fee_cents by each reversed accrual's exact member_share_cents, gpo_retention_cents and admin_fee_cents"
          - "resets every line to match_status = UNMATCHED, contracted_item_id = null, accrual_block_reason = NONE"
          - "sets matched_cases = 0, unmatched_cases = total_cases_ingested, accrued_by_user_id = null"
          - "resets audit_status to NOT_AUDITED, batch.overbilled_cents = 0 and every line.overbilled_cents = 0"
        note: "Cycle RECEIVED -> NORMALIZED -> ACCRUED -> RECEIVED may repeat any number of times."

  - entity: PurchaseBatch
    dimension: audit_status
    initial_state: NOT_AUDITED
    terminal_states: [AUDIT_CLEAN, RECOVERED, WRITTEN_OFF]
    note: "Dimension B. Guarded by dimension A only at entry (audit-markup needs a normalized feed); afterwards the two dimensions advance independently, and dimension A's renormalize is in turn blocked once dimension B passed RECOVERY_REQUESTED."
    transitions:
      - from: NOT_AUDITED
        to: AUDIT_CLEAN
        trigger: "POST /purchase-batches/{batch_id}/audit-markup when the computed batch.overbilled_cents == 0"
        actor: RebateAnalyst
        preconditions:
          - "batch.audit_status == NOT_AUDITED"
          - "batch.normalization_status IN {NORMALIZED, ACCRUED}"
        side_effects:
          - "runs calculation markup_overbilling, writing every line.overbilled_cents and batch.overbilled_cents"
          - "set audit_status = AUDIT_CLEAN"
      - from: NOT_AUDITED
        to: AUDIT_OVERBILLED
        trigger: "POST /purchase-batches/{batch_id}/audit-markup when the computed batch.overbilled_cents > 0"
        actor: RebateAnalyst
        preconditions:
          - "batch.audit_status == NOT_AUDITED"
          - "batch.normalization_status IN {NORMALIZED, ACCRUED}"
        side_effects:
          - "runs calculation markup_overbilling, writing every line.overbilled_cents and batch.overbilled_cents"
          - "set audit_status = AUDIT_OVERBILLED"
        note: "Branch point: the same trigger forks to AUDIT_CLEAN or AUDIT_OVERBILLED on a computed threshold, with different downstream state sets."
      - from: AUDIT_OVERBILLED
        to: RECOVERY_REQUESTED
        trigger: "POST /purchase-batches/{batch_id}/request-recovery"
        actor: RebateAnalyst
        preconditions:
          - "batch.audit_status == AUDIT_OVERBILLED"
          - "the batch's Distributor has status == ACTIVE"
        side_effects:
          - "set audit_status = RECOVERY_REQUESTED"
          - "increments PurchaseBatch.version by 1"
      - from: RECOVERY_REQUESTED
        to: RECOVERED
        trigger: "POST /purchase-batches/{batch_id}/settle-recovery with outcome == RECOVERED"
        actor: GpoAdmin
        preconditions:
          - "batch.audit_status == RECOVERY_REQUESTED"
          - "payload recovered_cents <= batch.overbilled_cents"
        side_effects:
          - "set recovered_cents = payload recovered_cents; set audit_status = RECOVERED"
          - "runs calculation recovery_allocation and increments each affected Member.recovery_credit_cents by its allocation"
          - "increments Distributor.overbilled_recovered_cents by recovered_cents"
      - from: RECOVERY_REQUESTED
        to: WRITTEN_OFF
        trigger: "POST /purchase-batches/{batch_id}/settle-recovery with outcome == WRITTEN_OFF"
        actor: GpoAdmin
        preconditions: ["batch.audit_status == RECOVERY_REQUESTED"]
        side_effects:
          - "set recovered_cents = 0; set audit_status = WRITTEN_OFF"
          - "no Member.recovery_credit_cents changes"
          - "cascade (caused by the write-off): the batch's Distributor transitions ACTIVE -> SUSPENDED"
        note: "Branch point: RECOVERED and WRITTEN_OFF fork from the same trigger with disjoint side-effect sets."
      - from: AUDIT_CLEAN
        to: NOT_AUDITED
        trigger: "POST /purchase-batches/{batch_id}/renormalize"
        actor: RebateAnalyst
        preconditions: ["batch.audit_status == AUDIT_CLEAN"]
        side_effects: ["set audit_status = NOT_AUDITED; clear batch.overbilled_cents and every line.overbilled_cents to 0"]
      - from: AUDIT_OVERBILLED
        to: NOT_AUDITED
        trigger: "POST /purchase-batches/{batch_id}/renormalize"
        actor: RebateAnalyst
        preconditions: ["batch.audit_status == AUDIT_OVERBILLED"]
        side_effects: ["set audit_status = NOT_AUDITED; clear batch.overbilled_cents and every line.overbilled_cents to 0"]

  - entity: PurchaseLine
    dimension: match_status
    initial_state: UNMATCHED
    terminal_states: []
    transitions:
      - from: UNMATCHED
        to: MATCHED
        trigger: "POST /purchase-batches/{batch_id}/normalize with exactly one eligible ContractedItem candidate"
        actor: RebateAnalyst
        preconditions: ["line.match_status == UNMATCHED", "the eligible candidate set has exactly one element"]
        side_effects: ["set contracted_item_id to that candidate; set match_status = MATCHED; accrual_block_reason stays NONE"]
      - from: UNMATCHED
        to: AMBIGUOUS
        trigger: "POST /purchase-batches/{batch_id}/normalize with two or more eligible ContractedItem candidates"
        actor: RebateAnalyst
        preconditions: ["line.match_status == UNMATCHED", "the eligible candidate set has two or more elements"]
        side_effects: ["set match_status = AMBIGUOUS; contracted_item_id stays null; accrual_block_reason stays NONE"]
        note: "The server never auto-picks among equally eligible candidates."
      - from: UNMATCHED
        to: EXCLUDED
        trigger: "POST /purchase-batches/{batch_id}/normalize where key candidates exist but none is eligible"
        actor: RebateAnalyst
        preconditions: ["line.match_status == UNMATCHED", "key-candidate set non-empty", "eligible candidate set empty"]
        side_effects:
          - "set match_status = EXCLUDED"
          - "set accrual_block_reason = ITEM_DELISTED when every key candidate has status == DELISTED, otherwise DEAL_NOT_ACTIVE"
      - from: AMBIGUOUS
        to: MATCHED
        trigger: "POST /purchase-lines/{line_id}/map"
        actor: RebateAnalyst
        preconditions:
          - "line.match_status == AMBIGUOUS"
          - "the batch's normalization_status == NORMALIZED"
          - "the payload contracted_item_id is a member of the line's eligible candidate set"
        side_effects: ["set contracted_item_id; set match_status = MATCHED", "recomputes batch.matched_cases and batch.unmatched_cases"]
      - from: MATCHED
        to: EXCLUDED
        trigger: "system: cascade hop 3b of the ManufacturerDeal ACTIVE -> LOST transition"
        actor: system
        preconditions: ["line.match_status == MATCHED", "line's item just became DELISTED", "the line's batch.normalization_status == NORMALIZED"]
        side_effects: ["set match_status = EXCLUDED, accrual_block_reason = ITEM_DELISTED, contracted_item_id = null", "triggers cascade hop 4 recompute of the batch's matched_cases / unmatched_cases"]
      - from: MATCHED
        to: UNMATCHED
        trigger: "POST /purchase-batches/{batch_id}/renormalize"
        actor: RebateAnalyst
        preconditions: ["the batch is being renormalized"]
        side_effects: ["set match_status = UNMATCHED, contracted_item_id = null, accrual_block_reason = NONE"]
      - from: AMBIGUOUS
        to: UNMATCHED
        trigger: "POST /purchase-batches/{batch_id}/renormalize"
        actor: RebateAnalyst
        preconditions: ["the batch is being renormalized"]
        side_effects: ["set match_status = UNMATCHED, accrual_block_reason = NONE"]
      - from: EXCLUDED
        to: UNMATCHED
        trigger: "POST /purchase-batches/{batch_id}/renormalize"
        actor: RebateAnalyst
        preconditions: ["the batch is being renormalized"]
        side_effects: ["set match_status = UNMATCHED, accrual_block_reason = NONE"]

  - entity: RebateAccrual
    dimension: status
    initial_state: ACCRUED
    terminal_states: [REVERSED, PAID]
    transitions:
      - from: ACCRUED
        to: VALIDATED
        trigger: "POST /accruals/{accrual_id}/validate where the accrual-level variance against the cited claim is <= VARIANCE_TOLERANCE_BPS"
        actor: RebateAnalyst
        preconditions:
          - "accrual.status == ACCRUED"
          - "the cited ManufacturerClaim has status == RECONCILED"
          - "the accrual's Member has payout_hold == false"
        side_effects:
          - "set status = VALIDATED; set validated_by_user_id = the caller's X-User-ID"
          - "no money fields change"
      - from: ACCRUED
        to: FLAGGED
        trigger: "POST /accruals/{accrual_id}/validate where the accrual-level variance against the cited claim is > VARIANCE_TOLERANCE_BPS"
        actor: RebateAnalyst
        preconditions:
          - "accrual.status == ACCRUED"
          - "the cited ManufacturerClaim has status == RECONCILED"
          - "the accrual's Member has payout_hold == false"
        side_effects:
          - "set status = FLAGGED; set validated_by_user_id = the caller's X-User-ID"
          - "no money fields change"
        note: "Branch point: the same trigger forks to VALIDATED or FLAGGED on a computed basis-point threshold; only VALIDATED accruals can later be PAID."
      - from: ACCRUED
        to: DISPUTED
        trigger: "POST /disputes citing this accrual"
        actor: MemberOperator
        preconditions:
          - "accrual.status IN {ACCRUED, VALIDATED, FLAGGED}"
          - "no other RebateDispute for this accrual has status IN {OPEN, EVIDENCE_REQUESTED}"
        side_effects:
          - "set status = DISPUTED"
          - "the new dispute records accrual_status_before = ACCRUED"
      - from: VALIDATED
        to: DISPUTED
        trigger: "POST /disputes citing this accrual"
        actor: MemberOperator
        preconditions:
          - "accrual.status IN {ACCRUED, VALIDATED, FLAGGED}"
          - "no other RebateDispute for this accrual has status IN {OPEN, EVIDENCE_REQUESTED}"
        side_effects:
          - "set status = DISPUTED"
          - "the new dispute records accrual_status_before = VALIDATED"
      - from: FLAGGED
        to: DISPUTED
        trigger: "POST /disputes citing this accrual"
        actor: MemberOperator
        preconditions:
          - "accrual.status IN {ACCRUED, VALIDATED, FLAGGED}"
          - "no other RebateDispute for this accrual has status IN {OPEN, EVIDENCE_REQUESTED}"
        side_effects:
          - "set status = DISPUTED"
          - "the new dispute records accrual_status_before = FLAGGED"
      - from: DISPUTED
        to: ACCRUED
        trigger: "POST /disputes/{dispute_id}/decide with decision == REJECT where dispute.accrual_status_before == ACCRUED"
        actor: DisputeArbiter
        preconditions: ["accrual.status == DISPUTED", "dispute.status == OPEN"]
        side_effects:
          - "restore status to exactly dispute.accrual_status_before (ACCRUED)"
          - "no money fields change and no member counters change"
        note: "Revision cycle: ACCRUED -> DISPUTED -> ACCRUED may repeat while the tier's dispute window is still open."
      - from: DISPUTED
        to: VALIDATED
        trigger: "POST /disputes/{dispute_id}/decide with decision == REJECT where dispute.accrual_status_before == VALIDATED"
        actor: DisputeArbiter
        preconditions: ["accrual.status == DISPUTED", "dispute.status == OPEN"]
        side_effects:
          - "restore status to exactly dispute.accrual_status_before (VALIDATED); validated_by_user_id is preserved"
          - "no money fields change and no member counters change"
      - from: DISPUTED
        to: FLAGGED
        trigger: "POST /disputes/{dispute_id}/decide with decision == REJECT where dispute.accrual_status_before == FLAGGED"
        actor: DisputeArbiter
        preconditions: ["accrual.status == DISPUTED", "dispute.status == OPEN"]
        side_effects:
          - "restore status to exactly dispute.accrual_status_before (FLAGGED)"
          - "no money fields change and no member counters change"
      - from: DISPUTED
        to: REVERSED
        trigger: "POST /disputes/{dispute_id}/decide with decision == UPHOLD"
        actor: DisputeArbiter
        preconditions:
          - "accrual.status == DISPUTED"
          - "dispute.status == OPEN"
          - "X-User-ID != accrual.validated_by_user_id and X-User-ID != the accrual's batch.accrued_by_user_id"
        side_effects:
          - "cascade hop 1: set dispute.status = UPHELD, decided_by_user_id and decision_note"
          - "cascade hop 2 (caused by hop 1): set accrual.status = REVERSED and accrual.reversal_reason = DISPUTE_UPHELD"
          - "cascade hop 3 (caused by hop 2): decrement Member.accrued_member_share_cents by accrual.member_share_cents, Member.attributed_gpo_retention_cents by accrual.gpo_retention_cents and Member.attributed_admin_fee_cents by accrual.admin_fee_cents; increment Member.dispute_reversal_count by 1"
          - "cascade hop 4 (caused by hop 3 reaching the tier's reversal_posture_limit): Member.reconciliation_posture CLEAR -> RESTRICTED, Member.payout_hold = true, and every ACCRUED-dimension batch holding a line of this member gets payout_hold = true"
        note: "Compensating transition: hop 3 reverses the accrue side effects component-for-component, so the money triple invariant still holds afterwards."
      - from: ACCRUED
        to: REVERSED
        trigger: "POST /purchase-batches/{batch_id}/renormalize on the accrual's batch"
        actor: RebateAnalyst
        preconditions: ["accrual.status IN {ACCRUED, FLAGGED}", "the batch's normalization_status == ACCRUED"]
        side_effects:
          - "set status = REVERSED and reversal_reason = RENORMALIZED"
          - "decrement Member.accrued_member_share_cents, Member.attributed_gpo_retention_cents and Member.attributed_admin_fee_cents by this accrual's exact components"
          - "Member.dispute_reversal_count is NOT incremented and reconciliation_posture is NOT touched"
      - from: FLAGGED
        to: REVERSED
        trigger: "POST /purchase-batches/{batch_id}/renormalize on the accrual's batch"
        actor: RebateAnalyst
        preconditions: ["accrual.status IN {ACCRUED, FLAGGED}", "the batch's normalization_status == ACCRUED"]
        side_effects:
          - "set status = REVERSED and reversal_reason = RENORMALIZED"
          - "decrement the three Member money counters by this accrual's exact components"
      - from: VALIDATED
        to: PAID
        trigger: "POST /manufacturer-deals/{deal_id}/close-period"
        actor: GpoAdmin
        preconditions:
          - "accrual.status == VALIDATED"
          - "the accrual's rate card belongs to a ContractedItem of this deal and its line's invoice_date is inside the closed period"
          - "the accrual's Member has payout_hold == false"
        side_effects:
          - "the accrual is first rebased to variant BLENDED_PERIOD: gross_rebate_cents is recomputed by calculation rebate_gross variant BLENDED_PERIOD, final_adjustment_cents = new gross - old gross, basis = BLENDED_PERIOD"
          - "the split is recomputed from the rebased gross REUSING the frozen admin_fee_bps_applied, rewriting admin_fee_cents, net_distributable_cents, member_share_cents and gpo_retention_cents"
          - "each Member money counter is adjusted by the signed delta between the new and old component"
          - "set status = PAID"
          - "Member.ytd_net_snapshot_cents is rewritten to the member's post-close attributed net total"
        note: "Dual-variant reconciliation: the accrue-time MARGINAL_BATCH figure is replaced by the close-time BLENDED_PERIOD figure and the delta is pushed to the member ledger."

  - entity: ManufacturerClaim
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [RECONCILED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: RECONCILED
        trigger: "POST /manufacturer-claims/{claim_id}/reconcile where the computed variance_bps <= VARIANCE_TOLERANCE_BPS"
        actor: RebateAnalyst
        preconditions:
          - "claim.status == SUBMITTED"
          - "no PurchaseBatch overlapping the claim period has normalization_status IN {RECEIVED, NORMALIZED}"
        side_effects:
          - "runs calculation claim_reconciliation_variance, writing accrued_amount_cents and variance_bps"
          - "set status = RECONCILED; set reconciled_at = logical clock now"
      - from: SUBMITTED
        to: VARIANCE_FLAGGED
        trigger: "POST /manufacturer-claims/{claim_id}/reconcile where the computed variance_bps > VARIANCE_TOLERANCE_BPS"
        actor: RebateAnalyst
        preconditions:
          - "claim.status == SUBMITTED"
          - "no PurchaseBatch overlapping the claim period has normalization_status IN {RECEIVED, NORMALIZED}"
        side_effects:
          - "runs calculation claim_reconciliation_variance, writing accrued_amount_cents and variance_bps"
          - "set status = VARIANCE_FLAGGED; reconciled_at stays null"
        note: "Branch point on a basis-point threshold. Only a RECONCILED claim can back an accrual validation, so a VARIANCE_FLAGGED claim must be restated."
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: POST /manufacturer-claims created a restatement for the same (deal_id, period_start, period_end)"
        actor: system
        preconditions: ["incumbent.status IN {SUBMITTED, VARIANCE_FLAGGED}", "the new claim carries the same deal and period"]
        side_effects:
          - "set incumbent.status = SUPERSEDED"
          - "the POST /manufacturer-claims call that caused this transition increments ManufacturerDeal.version by exactly 1 in total"
      - from: VARIANCE_FLAGGED
        to: SUPERSEDED
        trigger: "system: POST /manufacturer-claims created a restatement for the same (deal_id, period_start, period_end)"
        actor: system
        preconditions: ["incumbent.status IN {SUBMITTED, VARIANCE_FLAGGED}", "the new claim carries the same deal and period"]
        side_effects:
          - "set incumbent.status = SUPERSEDED"
          - "the POST /manufacturer-claims call that caused this transition increments ManufacturerDeal.version by exactly 1 in total"

  - entity: RebateDispute
    dimension: status
    initial_state: OPEN
    terminal_states: [UPHELD, REJECTED]
    transitions:
      - from: OPEN
        to: EVIDENCE_REQUESTED
        trigger: "POST /disputes/{dispute_id}/request-evidence"
        actor: DisputeArbiter
        preconditions:
          - "dispute.status == OPEN"
          - "X-User-ID != dispute.opened_by_user_id"
        side_effects:
          - "set status = EVIDENCE_REQUESTED"
          - "the cited accrual stays DISPUTED"
      - from: EVIDENCE_REQUESTED
        to: OPEN
        trigger: "POST /disputes/{dispute_id}/submit-evidence"
        actor: MemberOperator
        preconditions:
          - "dispute.status == EVIDENCE_REQUESTED"
          - "X-User-ID == the accrual's member_id"
        side_effects:
          - "set status = OPEN"
          - "increments evidence_round_count by 1"
        note: "Revision cycle: OPEN -> EVIDENCE_REQUESTED -> OPEN may repeat any number of times; only the OPEN state accepts a decision."
      - from: OPEN
        to: UPHELD
        trigger: "POST /disputes/{dispute_id}/decide with decision == UPHOLD"
        actor: DisputeArbiter
        preconditions:
          - "dispute.status == OPEN"
          - "X-User-ID != dispute.opened_by_user_id"
          - "X-User-ID != the accrual's validated_by_user_id and X-User-ID != the accrual's batch.accrued_by_user_id"
        side_effects:
          - "set status = UPHELD, decided_by_user_id = X-User-ID, decision_note = the payload note"
          - "starts the 4-hop dispute-upheld cascade documented on RebateAccrual DISPUTED -> REVERSED"
      - from: OPEN
        to: REJECTED
        trigger: "POST /disputes/{dispute_id}/decide with decision == REJECT"
        actor: DisputeArbiter
        preconditions:
          - "dispute.status == OPEN"
          - "X-User-ID != dispute.opened_by_user_id"
          - "X-User-ID != the accrual's validated_by_user_id and X-User-ID != the accrual's batch.accrued_by_user_id"
        side_effects:
          - "set status = REJECTED, decided_by_user_id = X-User-ID, decision_note = the payload note"
          - "restores the accrual to exactly dispute.accrual_status_before; no money or counter changes anywhere"
        note: "Branch point: UPHOLD triggers a 4-hop ledger cascade, REJECT triggers a pure state restore."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:

  - rule_id: rate-card-create-stale-item
    parent_entity: ContractedItem
    write_endpoint: "POST /rate-cards"
    occ_field: "expected_contracted_item_version"
    description: |
      Creating a RateCard against a ContractedItem whose version has advanced
      since the client last read it is rejected. A rate-card create carrying
      supersede == true legitimately truncates the incumbent APPROVED card for
      the same item and advances ContractedItem.version, so a writer holding an
      older view of the item would otherwise silently price the item on top of a
      card layout that no longer exists.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

  - rule_id: claim-restatement-stale-deal
    parent_entity: ManufacturerDeal
    write_endpoint: "POST /manufacturer-claims"
    occ_field: "expected_deal_version"
    description: |
      Submitting a ManufacturerClaim against a ManufacturerDeal whose version
      has advanced since the client last read it is rejected. A claim covering a
      (deal, period) that already has a SUBMITTED or VARIANCE_FLAGGED claim is a
      restatement that supersedes the incumbent and advances
      ManufacturerDeal.version, so a writer holding a stale deal view would
      otherwise restate against a claim generation it never observed.
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: line_extended_cost
    description: "Invoiced extended cost of a single purchase line, in whole cents."
    trigger: "On POST /purchase-lines, before any state or match evaluation."
    algorithm: aggregation
    inputs: ["PurchaseLine.cases_shipped", "PurchaseLine.invoice_unit_cost_cents"]
    formula: |
      invoice_extended_cents = cases_shipped * invoice_unit_cost_cents
    input_set: "The single line being created; no other rows are read."
    constants: {}
    precision: "Exact integer cents; both operands are integers so no rounding occurs."

  - name: normalization_match
    description: "Resolves each UNMATCHED purchase line to at most one ACTIVE ContractedItem, or classifies why it cannot be resolved."
    trigger: "On POST /purchase-batches/{batch_id}/normalize, for every line whose match_status == UNMATCHED, processed in ascending PurchaseLine.created_at."
    algorithm: constraint_propagation
    inputs:
      - "PurchaseLine.normalized_item_key_reported"
      - "PurchaseLine.invoice_date"
      - "ContractedItem.normalized_item_key"
      - "ContractedItem.status"
      - "ManufacturerDeal.status, ManufacturerDeal.effective_from, ManufacturerDeal.effective_to"
    formula: |
      key_candidates = all ContractedItem rows with
          normalized_item_key == line.normalized_item_key_reported
      eligible = [ item for item in key_candidates if
          item.status == ACTIVE
          and deal(item).status == ACTIVE
          and deal(item).effective_from <= line.invoice_date <= deal(item).effective_to ]

      if len(eligible) == 1:
          line.contracted_item_id = eligible[0].id
          line.match_status       = MATCHED
          line.accrual_block_reason = NONE
      elif len(eligible) >= 2:
          line.match_status = AMBIGUOUS        # server never auto-picks
          line.contracted_item_id = null
          line.accrual_block_reason = NONE
      elif len(key_candidates) == 0:
          line.match_status = UNMATCHED        # unknown key, stays unmatched
          line.accrual_block_reason = NONE
      else:
          line.match_status = EXCLUDED
          line.accrual_block_reason =
              ITEM_DELISTED   if every item in key_candidates has status == DELISTED
              else DEAL_NOT_ACTIVE
      # after every line: batch.matched_cases   = sum(cases_shipped where MATCHED)
      #                   batch.unmatched_cases = batch.total_cases_ingested - batch.matched_cases
    input_set: |
      Only ContractedItem rows sharing the exact reported key participate. Both the item's own
      status and its deal's status AND date coverage gate eligibility, so an ACTIVE item under a
      SUSPENDED deal is a key candidate but never eligible.
    constants: {}
    precision: "Not applicable (selector, not arithmetic)."

  - name: rate_card_selection
    description: "Picks the one RateCard that prices a matched line on its invoice date."
    trigger: "On POST /purchase-batches/{batch_id}/accrue, once per MATCHED line."
    algorithm: chronological
    inputs: ["PurchaseLine.contracted_item_id", "PurchaseLine.invoice_date", "RateCard.status", "RateCard.effective_from", "RateCard.effective_to", "RateCard.created_at"]
    formula: |
      candidates = [ card for card in RateCard
          if card.contracted_item_id == line.contracted_item_id
          and card.status == APPROVED
          and card.effective_from <= line.invoice_date <= card.effective_to ]   # CLOSED interval, both ends inclusive
      if candidates is empty:
          line.accrual_block_reason = NO_RATE_CARD; no accrual is created
      else:
          sort candidates by (effective_from DESC, created_at ASC)
          selected = candidates[0]
    input_set: "APPROVED cards only. PROPOSED, SUPERSEDED and EXPIRED cards are never selectable, even when their date window covers the invoice date."
    constants: {}
    precision: "Not applicable (selector). Tie-break is created_at ASC — never id."

  - name: rebate_gross
    description: "Manufacturer-funded gross rebate earned on one matched line under the selected rate card."
    trigger: "On POST /purchase-batches/{batch_id}/accrue (variant MARGINAL_BATCH) and again on POST /manufacturer-deals/{deal_id}/close-period (variant BLENDED_PERIOD)."
    algorithm: tiered_pricing
    inputs: ["RateCard.rate_type", "RateCard.flat_rate_cents_per_case", "RateCard.percent_bps", "RateCard.tier_breaks", "PurchaseLine.cases_shipped", "PurchaseLine.invoice_extended_cents"]
    formula: |
      if rate_type == PER_CASE:
          gross = cases_shipped * flat_rate_cents_per_case
      elif rate_type == PERCENT_OF_SPEND:
          gross = round_half_up(invoice_extended_cents * percent_bps / 10000)
      else:  # TIERED_VOLUME
          gross = tiered(cases_shipped, tier_breaks, cumulative_cases)   # see variants
    input_set: "The single line and its selected card. TIERED_VOLUME additionally reads a cumulative case count whose scope is exactly what the two variants disagree about."
    constants:
      BPS_DENOMINATOR: 10000
    precision: "Whole cents, round_half_up applied once to the final gross; never to intermediate per-tier products."
    variants:
      - name: MARGINAL_BATCH
        when: "At accrue time. cumulative_cases is scoped to the accruing PurchaseBatch only: lines of the batch are walked in ascending (invoice_date, created_at) and each line's cases are laid into the tier ladder on top of the cases already laid by earlier lines OF THE SAME BATCH for the same contracted item."
        difference: |
          Marginal: a line straddling a tier break is split, each slice paid at its own
          rate_cents_per_case, and the running ladder resets to 0 for every new batch.
      - name: BLENDED_PERIOD
        when: "At close-period time. cumulative_cases is the total MATCHED cases for the same (member, contracted item) across EVERY batch whose lines fall inside the closed period."
        difference: |
          Blended: one single rate is chosen from the ladder using the period-wide case total
          and applied to ALL of the line's cases (no straddle split), so a member whose volume
          only reaches an upper tier when batches are combined is paid that upper rate on the
          whole period. gross_BLENDED - gross_MARGINAL is written to final_adjustment_cents.

  - name: rebate_split
    description: "Splits one accrual's gross rebate into GPO admin fee, member share and GPO retention."
    trigger: "Immediately after rebate_gross, on accrue and again on close-period."
    algorithm: waterfall_allocation
    inputs: ["RebateAccrual.gross_rebate_cents", "Member.ytd_net_snapshot_cents", "ProgramTier.admin_fee_bps_low", "ProgramTier.admin_fee_bps_high", "ProgramTier.member_share_bps"]
    formula: |
      # step 1 — band selection reads the FROZEN snapshot, never the live running total
      admin_fee_bps_applied = tier.admin_fee_bps_low
                              if member.ytd_net_snapshot_cents < ADMIN_FEE_BAND_BREAK_CENTS
                              else tier.admin_fee_bps_high
      # step 2 — admin fee off the top
      admin_fee_cents        = round_half_up(gross_rebate_cents * admin_fee_bps_applied / 10000)
      # step 3 — net after the fee
      net_distributable_cents = gross_rebate_cents - admin_fee_cents
      # step 4 — member share of the net
      member_share_cents      = round_half_up(net_distributable_cents * tier.member_share_bps / 10000)
      # step 5 — retention absorbs the remainder, so the three parts sum to gross exactly
      gpo_retention_cents     = net_distributable_cents - member_share_cents
    input_set: |
      Exactly one accrual. The admin-fee band depends on Member.ytd_net_snapshot_cents, which is
      rewritten ONLY by close-period — the band therefore cannot move while a period is open, which
      is what breaks the otherwise circular dependency (fee depends on net, net depends on fee).
    constants:
      ADMIN_FEE_BAND_BREAK_CENTS: 5000000
      BPS_DENOMINATOR: 10000
    precision: |
      Whole cents, round_half_up, applied in EXACTLY the pinned order above (fee first, then net,
      then member share, then retention as the residual). Deriving the member share directly from
      gross, or rounding the retention independently, is wrong.

  - name: markup_overbilling
    description: "Cost-plus audit: how much a distributor billed above the lower of its contracted markup and the member tier's markup cap."
    trigger: "On POST /purchase-batches/{batch_id}/audit-markup."
    algorithm: threshold
    inputs: ["PurchaseLine.distributor_base_cost_cents", "PurchaseLine.invoice_unit_cost_cents", "PurchaseLine.cases_shipped", "Distributor.contracted_markup_bps", "ProgramTier.markup_cap_bps", "AuthorizationLetter.scope"]
    formula: |
      for each line in batch, in ascending (invoice_date, created_at):
          if the line's member has NO AuthorizationLetter with status == ACTIVE,
             scope == PURCHASE_DATA_AND_PRICING and distributor_id == batch.distributor_id:
              line.overbilled_cents = 0            # pricing not authorized -> not auditable
              continue
          allowed_markup_bps = min(distributor.contracted_markup_bps, tier(line.member).markup_cap_bps)
          allowed_unit_cents = line.distributor_base_cost_cents
                             + round_half_up(line.distributor_base_cost_cents * allowed_markup_bps / 10000)
          excess_unit_cents  = max(0, line.invoice_unit_cost_cents - allowed_unit_cents)
          line.overbilled_cents = excess_unit_cents * line.cases_shipped
      batch.overbilled_cents = sum(line.overbilled_cents for line in batch)
    input_set: |
      Every line of the batch regardless of match_status — overbilling is a pricing question, not a
      rebate question — but only lines whose member has an ACTIVE PURCHASE_DATA_AND_PRICING letter
      for THIS distributor are auditable.
    constants:
      BPS_DENOMINATOR: 10000
    precision: |
      round_half_up on the allowed markup PER LINE, then multiply by cases, then sum. Rounding the
      batch-level total instead of each line's allowed unit cost produces a different answer whenever
      two lines' base costs round in opposite directions.

  - name: recovery_allocation
    description: "Distributes cents actually recovered from a distributor back to the overbilled members."
    trigger: "On POST /purchase-batches/{batch_id}/settle-recovery with outcome == RECOVERED."
    algorithm: waterfall_allocation
    inputs: ["PurchaseBatch.recovered_cents", "PurchaseBatch.overbilled_cents", "PurchaseLine.overbilled_cents", "PurchaseLine.member_id", "Member.created_at"]
    formula: |
      member_overbilled[m] = sum(line.overbilled_cents for lines of this batch with member_id == m)
      total = batch.overbilled_cents
      for each member m with member_overbilled[m] > 0:
          alloc[m] = floor(recovered_cents * member_overbilled[m] / total)
      remainder = recovered_cents - sum(alloc.values())
      order members by (member_overbilled DESC, Member.created_at ASC)
      give 1 extra cent to each of the first `remainder` members in that order
      Member.recovery_credit_cents += alloc[m]
    input_set: "Only members with strictly positive overbilling on this batch. Members whose lines audited clean receive nothing, even if they have other lines in the batch."
    constants: {}
    precision: "Floor per member, then distribute the remainder one cent at a time; sum(alloc) == recovered_cents exactly. Tie-break is Member.created_at ASC — never id."

  - name: compliance_purchase_ratio
    description: "Ratio of a member's actual contracted spend to its prorated commitment over a review window, and the resulting verdict."
    trigger: "On POST /compliance-reviews."
    algorithm: threshold
    inputs: ["Member.committed_annual_spend_cents", "ComplianceReview.window_start", "ComplianceReview.window_end", "PurchaseLine.invoice_extended_cents", "PurchaseLine.match_status", "ProgramTier.compliance_min_ratio_bps", "ManufacturerDeal.required_purchase_window_days"]
    formula: |
      window_days = days_between(window_start, window_end) + 1          # both endpoints counted
      committed_spend_prorated_cents = round_half_up(
          member.committed_annual_spend_cents * window_days / 365)
      contracted_spend_cents = sum(line.invoice_extended_cents
          for lines with member_id == member.id
          and match_status == MATCHED
          and item(line).deal_id == review.deal_id
          and window_start <= line.invoice_date <= window_end)
      deal_wide_contracted_spend_cents = the same sum WITHOUT the member_id filter
      purchase_ratio_bps = 0 if committed_spend_prorated_cents == 0
          else floor(contracted_spend_cents * 10000 / committed_spend_prorated_cents)

      if deal_wide_contracted_spend_cents == 0
         and window_days >= deal.required_purchase_window_days
         and deal.status == ACTIVE:
          result = DEAL_LOST                                  # evaluated FIRST
      elif purchase_ratio_bps >= tier.compliance_min_ratio_bps:
          result = PASS
      elif purchase_ratio_bps >= tier.compliance_min_ratio_bps - WARN_BAND_BPS:
          result = WARN
      else:
          result = BREACH
    input_set: |
      MATCHED lines only, and only those whose contracted item belongs to the reviewed deal.
      AMBIGUOUS, EXCLUDED and UNMATCHED lines contribute nothing even when their reported key
      names a contracted item.
    constants:
      DAYS_PER_YEAR: 365
      WARN_BAND_BPS: 500
      BPS_DENOMINATOR: 10000
    precision: |
      round_half_up on the prorated commitment; FLOOR on the ratio (so 7999.9 bps is 7999 and does
      not reach an 8000 bps minimum). PASS requires ratio >= minimum: exactly at the minimum passes.

  - name: claim_reconciliation_variance
    description: "Two-level comparison of manufacturer-claimed rebate against GPO-accrued rebate."
    trigger: "Deal-period level on POST /manufacturer-claims/{claim_id}/reconcile; accrual level on POST /accruals/{accrual_id}/validate."
    algorithm: aggregation
    inputs: ["ManufacturerClaim.claimed_amount_cents", "ManufacturerClaim.claimed_units", "RebateAccrual.gross_rebate_cents", "RebateAccrual.accrued_cases", "RebateAccrual.status"]
    formula: |
      # LEVEL 1 — deal-period, written by reconcile
      accrued_amount_cents = sum(accrual.gross_rebate_cents
          for accruals whose rate card's contracted item belongs to claim.deal_id
          and whose line.invoice_date is inside [claim.period_start, claim.period_end]
          and whose status IN {ACCRUED, VALIDATED, FLAGGED, PAID})     # REVERSED excluded
      variance_bps = 0      if accrued_amount_cents == 0 and claimed_amount_cents == 0
                     10000  if accrued_amount_cents == 0 and claimed_amount_cents > 0
                     else floor(abs(claimed_amount_cents - accrued_amount_cents) * 10000
                                / accrued_amount_cents)
      status = RECONCILED if variance_bps <= VARIANCE_TOLERANCE_BPS else VARIANCE_FLAGGED

      # LEVEL 2 — per accrual, evaluated by validate against a RECONCILED claim
      claim_implied_cents = 0 if claim.claimed_units == 0 else round_half_up(
          claim.claimed_amount_cents * accrual.accrued_cases / claim.claimed_units)
      accrual_variance_bps = 10000 if accrual.gross_rebate_cents == 0 else floor(
          abs(claim_implied_cents - accrual.gross_rebate_cents) * 10000 / accrual.gross_rebate_cents)
      accrual.status = VALIDATED if accrual_variance_bps <= VARIANCE_TOLERANCE_BPS else FLAGGED
    input_set: "REVERSED accruals are excluded from both levels; PAID accruals are included at level 1."
    constants:
      VARIANCE_TOLERANCE_BPS: 200
      BPS_DENOMINATOR: 10000
    precision: "FLOOR on both variance figures, so a variance of exactly 200 bps is inside tolerance and 201 bps is outside."

  - name: savings_realized_vs_opportunity
    description: "Member-facing report of savings actually realized against the savings available under contract."
    trigger: "On GET /members/{member_id}/savings-report."
    algorithm: aggregation
    inputs: ["PurchaseLine.cases_shipped", "PurchaseLine.invoice_unit_cost_cents", "PurchaseLine.match_status", "ContractedItem.baseline_unit_cost_cents", "ContractedItem.contract_unit_cost_cents", "RebateAccrual.member_share_cents"]
    formula: |
      # over the member's lines with invoice_date inside [period_start, period_end]
      realized_cents = sum over MATCHED lines of
            (item.baseline_unit_cost_cents - line.invoice_unit_cost_cents) * line.cases_shipped
          + sum(accrual.member_share_cents for that member's accruals in the period
                with status IN {ACCRUED, VALIDATED, FLAGGED, DISPUTED, PAID})
      opportunity_cents = sum over the basis line set of
            (item.baseline_unit_cost_cents - item.contract_unit_cost_cents) * line.cases_shipped
      missed_opportunity_cents = max(0, opportunity_cents - realized_cents)
      capture_rate_bps = 0 if opportunity_cents <= 0
          else floor(realized_cents * 10000 / opportunity_cents)
      # the remaining report fields, pinned so the response shape is unambiguous
      matched_cases   = sum(line.cases_shipped for the member's period lines with match_status == MATCHED)
      unmatched_cases = sum(line.cases_shipped for the member's period lines with match_status IN {UNMATCHED, AMBIGUOUS, EXCLUDED})
      invoice_spend_cents = sum(line.invoice_extended_cents for ALL the member's period lines, any match_status)
      rebate_member_share_cents = the accrual member_share_cents term of realized_cents above
      recovery_credit_cents = Member.recovery_credit_cents as stored (lifetime, NOT period-scoped)
    input_set: "Only the member's own lines; only lines whose invoice_date falls inside the requested closed period. REVERSED accruals never count toward realized_cents."
    constants:
      BPS_DENOMINATOR: 10000
    precision: "Exact integer cents throughout; FLOOR on capture_rate_bps only."
    variants:
      - name: AS_PURCHASED
        when: "basis == AS_PURCHASED (the default). The opportunity basis line set is the MATCHED lines only."
        difference: |
          Opportunity is measured only where the member actually bought on contract, so an
          unmatched or excluded line contributes nothing to either side of the ratio.
      - name: FULL_BASKET
        when: "basis == FULL_BASKET."
        difference: |
          The opportunity basis line set additionally includes AMBIGUOUS and EXCLUDED lines,
          priced against the contracted item named by the line's reported key (the lowest
          contract_unit_cost_cents among that key's items when several share the key). Those
          lines add to opportunity_cents but never to realized_cents, so capture_rate_bps
          falls and missed_opportunity_cents rises on identical data.

# =============================================================================
# §1.4 Validation Rules Table — evaluated in strict ascending priority order.
#      The FIRST rule that fails determines the response; no later rule runs.
# =============================================================================
validations:

  # --- authentication / authorization ---------------------------------------
  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared role names (exact case)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  # --- existence of path resources -----------------------------------------
  - priority: 4
    category: existence
    check: "Every id in the path resolves to a stored row, checked left to right"
    error_id: "ERR_MEMBER_NOT_FOUND | ERR_DISTRIBUTOR_NOT_FOUND | ERR_PROGRAM_TIER_NOT_FOUND | ERR_LETTER_NOT_FOUND | ERR_DEAL_NOT_FOUND | ERR_CONTRACTED_ITEM_NOT_FOUND | ERR_RATE_CARD_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_PURCHASE_LINE_NOT_FOUND | ERR_ACCRUAL_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_COMPLIANCE_REVIEW_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  # --- identity scoping (entity-backed roles) -------------------------------
  - priority: 5
    category: auth
    check: "When X-User-Role == MemberOperator, X-User-ID equals the Member id that owns the target resource (letter.member_id, accrual.member_id, dispute -> accrual.member_id, the {member_id} path segment)"
    error_id: ERR_MEMBER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /authorization-letters, POST /authorization-letters/{letter_id}/revoke, POST /disputes, POST /disputes/{dispute_id}/submit-evidence, GET /members/{member_id}/savings-report"
  - priority: 6
    category: auth
    check: "When X-User-Role == DistributorFeed, X-User-ID equals the Distributor id that owns the target resource (letter.distributor_id, batch.distributor_id, the distributor_id in the body)"
    error_id: ERR_DISTRIBUTOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /authorization-letters/{letter_id}/countersign, POST /purchase-batches, POST /purchase-lines"

  # --- request shape --------------------------------------------------------
  - priority: 7
    category: existence
    check: "Request body parses, every required field is present with the declared JSON type, every enum value is a declared member, and no unknown field is supplied"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 8
    category: existence
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

  # --- existence of body foreign keys --------------------------------------
  - priority: 9
    category: existence
    check: "Every foreign key in the request body resolves to a stored row, checked in the field order declared by the endpoint's input list"
    error_id: "ERR_PROGRAM_TIER_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_DISTRIBUTOR_NOT_FOUND | ERR_DEAL_NOT_FOUND | ERR_CONTRACTED_ITEM_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_ACCRUAL_NOT_FOUND | ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints whose input contains a foreign key"

  # --- optimistic concurrency ----------------------------------------------
  - priority: 10
    category: state
    check: "The supplied expected_<parent>_version equals the parent row's current version"
    error_id: ERR_STALE_PARENT_VERSION
    http_status: 412
    applies_to: "POST /rate-cards, POST /manufacturer-claims"

  # --- state preconditions on the transitioning row ------------------------
  - priority: 11
    category: state
    check: "The target row is in a state from which the requested transition is declared in §1.2; for a create whose container must still be open (POST /purchase-lines requires batch.normalization_status == RECEIVED), the container is in that accepting state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint that transitions a state dimension, plus POST /purchase-lines"

  # --- cross-entity state gates -------------------------------------------
  - priority: 12
    category: state
    check: "The referenced Member has enrollment_status == ACTIVE"
    error_id: ERR_MEMBER_NOT_ENROLLED
    http_status: 409
    applies_to: "POST /purchase-lines, POST /disputes"
  - priority: 13
    category: state
    check: "The referenced Distributor has status == ACTIVE"
    error_id: ERR_DISTRIBUTOR_SUSPENDED
    http_status: 409
    applies_to: "POST /purchase-batches, POST /authorization-letters/{letter_id}/countersign, POST /purchase-batches/{batch_id}/request-recovery"
  - priority: 14
    category: state
    check: "The referenced ManufacturerDeal has status IN {DRAFT, ACTIVE}"
    error_id: ERR_DEAL_NOT_OPEN_FOR_CHANGES
    http_status: 409
    applies_to: "POST /contracted-items, POST /rate-cards, POST /rate-cards/{rate_card_id}/approve, POST /manufacturer-claims"
  - priority: 15
    category: state
    check: "The line's Member has at least one AuthorizationLetter with status == ACTIVE for the batch's Distributor whose half-open [effective_from, effective_to) window contains the logical clock instant"
    error_id: ERR_LOA_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /purchase-lines"
  - priority: 16
    category: business_referential
    check: "The cited ManufacturerClaim has status == RECONCILED"
    error_id: ERR_CLAIM_NOT_RECONCILED
    http_status: 409
    applies_to: "POST /accruals/{accrual_id}/validate"
  - priority: 17
    category: business_referential
    check: "The contracted_item_id supplied to map is a member of the line's eligible candidate set (same normalized key, item ACTIVE, deal ACTIVE and covering the invoice date)"
    error_id: ERR_ITEM_NOT_A_CANDIDATE
    http_status: 422
    applies_to: "POST /purchase-lines/{line_id}/map"

  # --- segregation of duties ----------------------------------------------
  - priority: 18
    category: business_safety
    check: "X-User-ID differs from every user id already recorded on the workflow being decided (dispute.opened_by_user_id, accrual.validated_by_user_id, batch.accrued_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /disputes/{dispute_id}/request-evidence, POST /disputes/{dispute_id}/decide"

  # --- temporal overlap ---------------------------------------------------
  - priority: 19
    category: business_temporal
    check: "No existing AuthorizationLetter for the same (member_id, distributor_id) with status IN {SUBMITTED, ACTIVE} overlaps the requested window under HALF-OPEN semantics: new.effective_from < existing.effective_to AND existing.effective_from < new.effective_to. Exactly touching windows do NOT overlap."
    error_id: ERR_LOA_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /authorization-letters"
  - priority: 20
    category: business_temporal
    check: "No existing RateCard for the same contracted_item_id with status IN {PROPOSED, APPROVED} overlaps the requested window under CLOSED-INTERVAL semantics: new.effective_from <= existing.effective_to AND existing.effective_from <= new.effective_to. Windows that merely touch at one calendar date DO overlap. Skipped when supersede == true."
    error_id: ERR_RATE_CARD_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /rate-cards"
  - priority: 21
    category: business_referential
    check: "When supersede == true, the item has exactly one RateCard with status == APPROVED whose effective_to >= the new card's effective_from"
    error_id: ERR_NO_INCUMBENT_RATE_CARD
    http_status: 409
    applies_to: "POST /rate-cards"

  # --- temporal / window shape -------------------------------------------
  - priority: 22
    category: business_temporal
    check: "period_end >= period_start (PurchaseBatch, ManufacturerClaim) and effective_to > effective_from (AuthorizationLetter) and effective_to >= effective_from (ManufacturerDeal, RateCard) and window_end >= window_start (ComplianceReview)"
    error_id: ERR_PERIOD_BOUNDS_INVALID
    http_status: 422
    applies_to: "POST /purchase-batches, POST /manufacturer-claims, POST /authorization-letters, POST /manufacturer-deals, POST /rate-cards, POST /compliance-reviews"
  - priority: 23
    category: business_temporal
    check: "invoice_date falls inside the batch's closed [period_start, period_end]"
    error_id: ERR_INVOICE_DATE_OUT_OF_PERIOD
    http_status: 422
    applies_to: "POST /purchase-lines"
  - priority: 24
    category: business_temporal
    check: "The logical clock's calendar date is at most ProgramTier.dispute_window_days whole days after the accrual's created_at calendar date (inclusive boundary)"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /disputes"
  - priority: 25
    category: business_temporal
    check: "window_end is not after the logical clock's current calendar date"
    error_id: ERR_REVIEW_WINDOW_IN_FUTURE
    http_status: 422
    applies_to: "POST /compliance-reviews"
  - priority: 26
    category: business_temporal
    check: "No ManufacturerClaim with status == RECONCILED already exists for the same (deal_id, period_start, period_end)"
    error_id: ERR_CLAIM_PERIOD_ALREADY_RECONCILED
    http_status: 409
    applies_to: "POST /manufacturer-claims"

  # --- constraint satisfaction -------------------------------------------
  - priority: 27
    category: business_constraint
    check: "member_share_bps + gpo_retention_bps == 10000"
    error_id: ERR_TIER_SPLIT_NOT_BALANCED
    http_status: 422
    applies_to: "POST /program-tiers"
  - priority: 28
    category: business_constraint
    check: "Exactly the rate fields matching rate_type are present: PER_CASE requires flat_rate_cents_per_case and forbids the other two; PERCENT_OF_SPEND requires percent_bps and forbids the other two; TIERED_VOLUME requires tier_breaks with >= 2 entries, first min_cases == 0, strictly increasing min_cases and every rate_cents_per_case >= 1, and forbids the other two"
    error_id: ERR_RATE_CARD_SHAPE_INVALID
    http_status: 422
    applies_to: "POST /rate-cards"
  - priority: 29
    category: business_constraint
    check: "cases_shipped >= 1, invoice_unit_cost_cents >= 1 and distributor_base_cost_cents >= 1"
    error_id: ERR_INVALID_CASE_QUANTITY
    http_status: 422
    applies_to: "POST /purchase-lines"
  - priority: 30
    category: business_constraint
    check: "dba_code is not already used by another Distributor"
    error_id: ERR_DUPLICATE_DBA_CODE
    http_status: 409
    applies_to: "POST /distributors"
  - priority: 31
    category: business_constraint
    check: "deal_code is not already used by another ManufacturerDeal; tier_code is not already used by another ProgramTier"
    error_id: "ERR_DUPLICATE_DEAL_CODE | ERR_DUPLICATE_TIER_CODE"
    http_status: 409
    applies_to: "POST /manufacturer-deals, POST /program-tiers"
  - priority: 32
    category: business_constraint
    check: "manufacturer_sku is not already used by another ContractedItem of the same deal_id"
    error_id: ERR_DUPLICATE_ITEM_SKU
    http_status: 409
    applies_to: "POST /contracted-items"
  - priority: 33
    category: business_constraint
    check: "source_reference is not already used by another PurchaseBatch of the same distributor_id"
    error_id: ERR_DUPLICATE_BATCH_REFERENCE
    http_status: 409
    applies_to: "POST /purchase-batches"

  # --- readiness / completeness ------------------------------------------
  - priority: 34
    category: business_constraint
    check: "The deal has at least one ACTIVE ContractedItem with approved_rate_card_count >= 1"
    error_id: ERR_DEAL_HAS_NO_APPROVED_RATES
    http_status: 422
    applies_to: "POST /manufacturer-deals/{deal_id}/activate"
  - priority: 35
    category: business_constraint
    check: "The member has active_letter_count >= 1"
    error_id: ERR_MEMBER_HAS_NO_ACTIVE_LOA
    http_status: 422
    applies_to: "POST /members/{member_id}/activate"
  - priority: 36
    category: business_constraint
    check: "At least one line of the batch has match_status == MATCHED and resolves an APPROVED RateCard for its invoice_date"
    error_id: ERR_NO_ACCRUABLE_LINES
    http_status: 422
    applies_to: "POST /purchase-batches/{batch_id}/accrue"
  - priority: 37
    category: business_constraint
    check: "No PurchaseBatch whose period overlaps the claim period has normalization_status IN {RECEIVED, NORMALIZED}"
    error_id: ERR_PERIOD_HAS_UNACCRUED_BATCHES
    http_status: 409
    applies_to: "POST /manufacturer-claims/{claim_id}/reconcile, POST /manufacturer-deals/{deal_id}/close-period"

  - priority: 38
    category: business_constraint
    check: "No other RebateDispute for the same accrual_id has status IN {OPEN, EVIDENCE_REQUESTED}"
    error_id: ERR_DUPLICATE_OPEN_DISPUTE
    http_status: 409
    applies_to: "POST /disputes"

  # --- fiscal checks (last) ----------------------------------------------
  - priority: 39
    category: business_fiscal
    check: "recovered_cents <= batch.overbilled_cents when outcome == RECOVERED"
    error_id: ERR_RECOVERY_EXCEEDS_OVERBILLING
    http_status: 422
    applies_to: "POST /purchase-batches/{batch_id}/settle-recovery"
  - priority: 40
    category: business_fiscal
    check: "disputed_amount_cents >= 1 and <= the cited accrual's member_share_cents"
    error_id: ERR_DISPUTE_AMOUNT_EXCEEDS_SHARE
    http_status: 422
    applies_to: "POST /disputes"
  - priority: 41
    category: business_fiscal
    check: "The accrual's Member has payout_hold == false"
    error_id: ERR_MEMBER_PAYOUT_HELD
    http_status: 409
    applies_to: "POST /accruals/{accrual_id}/validate"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --------------------------------------------------------------- ProgramTier
  - method: POST
    path: "/program-tiers"
    description: "Create a GPO program tier configuration (split, admin-fee bands, compliance minimum, markup cap, dispute window, posture limit)."
    roles: [GpoAdmin]
    code: 201
    input: [tier_code, member_share_bps, gpo_retention_bps, admin_fee_bps_low, admin_fee_bps_high, compliance_min_ratio_bps, markup_cap_bps, dispute_window_days, "reversal_posture_limit?"]
    output: ProgramTier
    side_effects: ["Stores the tier with version = 1. reversal_posture_limit defaults to 2 when omitted."]
  - method: GET
    path: "/program-tiers/{tier_id}"
    description: "Fetch one program tier."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, MemberOperator, DistributorFeed, ManufacturerRep]
    code: 200
    input: []
    output: ProgramTier
    side_effects: []
  - method: GET
    path: "/program-tiers"
    description: "List program tiers, newest first by created_at DESC."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, MemberOperator, DistributorFeed, ManufacturerRep]
    code: 200
    input: ["tier_code?", "limit?", "offset?"]
    output: ProgramTier[]
    side_effects: []

  # --------------------------------------------------------------- Distributor
  - method: POST
    path: "/distributors"
    description: "Register a distributor that will submit purchase feeds."
    roles: [GpoAdmin]
    code: 201
    input: [name, dba_code, contracted_markup_bps]
    output: Distributor
    side_effects: ["Stores the distributor with status = ACTIVE, active_letter_count = 0, overbilled_recovered_cents = 0."]
  - method: GET
    path: "/distributors/{distributor_id}"
    description: "Fetch one distributor."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, MemberOperator, DistributorFeed, ManufacturerRep]
    code: 200
    input: []
    output: Distributor
    side_effects: []
  - method: GET
    path: "/distributors"
    description: "List distributors, created_at DESC."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, MemberOperator, DistributorFeed, ManufacturerRep]
    code: 200
    input: ["status?", "dba_code?", "limit?", "offset?"]
    output: Distributor[]
    side_effects: []

  # -------------------------------------------------------------------- Member
  - method: POST
    path: "/members"
    description: "Enroll a restaurant operator into a program tier; the member starts PENDING."
    roles: [GpoAdmin]
    code: 201
    input: [legal_name, tier_id, committed_annual_spend_cents]
    output: Member
    side_effects: ["Stores the member with enrollment_status = PENDING, reconciliation_posture = CLEAR, payout_hold = false and every money counter at 0."]
  - method: GET
    path: "/members/{member_id}"
    description: "Fetch one member with its live ledger counters."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter, MemberOperator]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/members"
    description: "List members, created_at DESC; filterable by tier and lifecycle."
    roles: [GpoAdmin, RebateAnalyst, DisputeArbiter]
    code: 200
    input: ["tier_id?", "enrollment_status?", "reconciliation_posture?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: POST
    path: "/members/{member_id}/activate"
    description: "Activate a PENDING member, or reinstate a SUSPENDED one."
    roles: [GpoAdmin]
    code: 200
    input: []
    output: Member
    side_effects:
      - "PENDING -> ACTIVE, or SUSPENDED -> ACTIVE with payout_hold cleared."
      - "reconciliation_posture is never cleared."
      - "increments Member.version by 1."
  - method: POST
    path: "/members/{member_id}/terminate"
    description: "Terminate a member; revokes every ACTIVE authorization letter."
    roles: [GpoAdmin]
    code: 200
    input: []
    output: Member
    side_effects:
      - "enrollment_status -> TERMINATED, payout_hold = true."
      - "cascade: every ACTIVE AuthorizationLetter of this member -> REVOKED; Member.active_letter_count and each affected Distributor.active_letter_count recomputed."
      - "increments Member.version by 1."

