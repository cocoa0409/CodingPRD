  # =========================================================================
  - section: Validations
    instances:

      - name: requests_with_no_role_or_no_user_header_are_unauthenticated_before_every_other_check
        claim_type: Violation → Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]", response_envelope.error_shape]
        distinguishing_aspect: "Priority 1 outranks the whole ladder: a body that is also malformed and a role that would also be unauthorized still produce ERR_UNAUTHENTICATED (401), and both halves of the header pair are enforced — an unknown role string and an empty X-User-ID fail the same way."
        test_recipe:
          setup:
            - "Empty database; no fixture is needed because authentication is decided before any lookup."
          setup_api_calls: []
          trigger:
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED" }
              as: NO_ROLE_HEADER
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "NOT_A_TIER_CLASS" }
              as: NOT_A_DECLARED_ROLE
            - call: "GET /interpreters"
              payload: {}
              as: ProgramAdmin
              as_user_id: ""
          assert:
            - "every trigger returns HTTP 401 with data.error_id == ERR_UNAUTHENTICATED and a non-empty data.message"
            - "the second trigger returns ERR_UNAUTHENTICATED, not ERR_INVALID_REQUEST, even though tier_class is outside the declared enum"
            - "each error response still carries meta.api_request_id and meta.api_request_timestamp and response_type == error"
            - "GET /languages as ProgramAdmin with a valid X-User-ID returns total_count == 0 — no row was created by any refused call"

      - name: wrong_role_with_a_malformed_body_cannot_reach_the_shape_check
        claim_type: Priority Ordering
        grounds: ["validations[priority=2]", "validations[priority=3]", "errors[ERR_UNAUTHORIZED]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "The same request body produces two different errors depending only on the caller's role: a CredentialingOfficer is stopped at priority 2 with ERR_UNAUTHORIZED (403) and never learns the body is malformed, while the SchedulingCoordinator reaches priority 3 and gets ERR_INVALID_REQUEST (400) for scheduled_end <= scheduled_start."
        test_recipe:
          setup:
            - "Language spa and courthouse CH_MAIN exist so that the only defects in the body are the inverted window and the missing case_number."
          setup_api_calls:
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /courthouses"
              payload: { name: "Capitol Main Courthouse", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 1, pay_budget_cents: 5000000 }
              as: ProgramAdmin
              captures: { ch_main: "$.data.id" }
          trigger:
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_spa}", hearing_type: "MOTION", in_custody: false, scheduled_start: "2026-08-25T11:00:00.000Z", scheduled_end: "2026-08-25T10:00:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: CredentialingOfficer
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_spa}", hearing_type: "MOTION", in_custody: false, scheduled_start: "2026-08-25T11:00:00.000Z", scheduled_end: "2026-08-25T10:00:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
          assert:
            - "first trigger returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "second trigger returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST (the window is inverted and case_number is absent)"
            - "GET /hearings as SchedulingCoordinator returns total_count == 0"

      - name: invalid_payload_outranks_an_unknown_path_id_on_the_ladder
        claim_type: Cascading validation
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors[ERR_CREDENTIAL_NOT_FOUND]"]
        distinguishing_aspect: "Shape is checked before existence: the same unknown credential id returns ERR_INVALID_REQUEST (400) when exam_type is outside the enum and ERR_CREDENTIAL_NOT_FOUND (404) once the body is well formed."
        test_recipe:
          setup:
            - "Empty database; the credential id 00000000-0000-4000-8000-00000000c0de is guaranteed absent."
          setup_api_calls: []
          trigger:
            - call: "POST /credentials/00000000-0000-4000-8000-00000000c0de/exam-attempts"
              payload: { exam_type: "SIGHT_TRANSLATION", score: 84, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/00000000-0000-4000-8000-00000000c0de/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 84, taken_on: "2026-08-01" }
              as: CredentialingOfficer
            - call: "POST /credentials/00000000-0000-4000-8000-00000000c0de/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 140, taken_on: "2026-08-01" }
              as: CredentialingOfficer
          assert:
            - "first trigger returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "second trigger returns HTTP 404 with data.error_id == ERR_CREDENTIAL_NOT_FOUND"
            - "third trigger returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST — score 140 breaches the declared 0..100 range and is caught before existence"

      - name: aggregate_budget_accepts_the_exact_remainder_then_rejects_the_next_confirm
        claim_type: Aggregate validation
        grounds: ["validations[priority=36]", "errors[ERR_COURTHOUSE_BUDGET_EXCEEDED]", calculations.courthouse_encumbrance_ledger.constants]
