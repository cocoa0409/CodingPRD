  - name: trial_cancellation_returns_the_candidate_and_the_requisition_to_their_prior_state
    grounds: state_machines.TrialEngagement.SCHEDULED -> CANCELLED; state_machines.Candidate ON_TRIAL -> AVAILABLE
      (slot conservation); state_machines.RoleRequisition.TRIALING -> SOURCING; entities.RoleRequisition.active_trial_count
    mechanism: Booking a trial takes a candidate slot and promotes the requisition; cancelling it must give both back.
      The cancellation stamps cancel_reason, returns the candidate to AVAILABLE because it holds no other live trial,
      and refolds active_trial_count to 0, which demotes the requisition to SOURCING - exactly the state pair that
      existed before the booking.
    naive_implementation: Mark the trial CANCELLED and stop there, leaving the candidate stuck at ON_TRIAL and the
      requisition at TRIALING with active_trial_count 1, so the candidate can never be presented again.
    distinguishing_aspect: The candidate's availability_status and the requisition's status/active_trial_count are
      identical before the booking and after the cancellation, while both rows' version fields have advanced - the
      state is restored, not the history.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
