scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: time_limit_committed_vs_statutory_on_application
        grounds:
          - calculations.derive_application_deadline
          - entities.MatterVersion.fields.statutory_time_limit_days
          - entities.MatterVersion.fields.committed_time_limit_days
          - entities.Application.fields.deadline_at
          - endpoints["GET /applications/{id}/sla"]
        distinguishing_aspect: |
          Operates on the Application/MatterVersion entity domain. The committed variant
          drives Application.deadline_at and warning thresholds; the statutory variant only
          drives the SLA-performance report and never causes a state transition. Identical
          inputs (clock_started_at, total_paused_seconds) produce two different deadlines
          when statutory > committed, and the two consumers pick different variants.
        test_recipe:
          setup:
            - "Create Department D1, MatterVersion with committed=10 days, statutory=15 days, fee=0, single-stage routing on D1"
            - "MaterialTemplate M1 PUBLISHED, CertificateTemplate C1 PUBLISHED"
            - "Submit Application A from Applicant covering M1; identity-verified event posted"
          trigger:
            - "GET /applications/{A}/sla immediately after UNDER_REVIEW transition"
            - "GET /reports/sla-performance?matter_id={Matter}"
          assert:
            - "/applications/{A}/sla returns deadline tied to committed=10 days (10*28800=288000 seconds after clock_started_at) and committed-variant warning_pct"
            - "/reports/sla-performance reports the same Application's statutory budget = 15 days (15*28800=432000 seconds), distinct from the committed budget"

      - name: certificate_fee_provisional_vs_final_on_application
        grounds:
          - calculations.certificate_fee_breakdown
          - entities.Application.fields.review_status
          - entities.Application.fields.correction_round
          - entities.MatterVersion.fields.fee_amount_cents
          - endpoints["GET /applications/{id}"]
        distinguishing_aspect: |
          Operates on the fiscal-cost domain (fee), distinct from the time-deadline domain
          above. Provisional variant reflects the running correction_round live; final
          variant is frozen at the correction_round value at terminal transition and never
          recomputes. Identical Application data mid-flight (with correction_round=1) and
          after APPROVED report identical total_cents at the moment of approval, but a
          later correction-round bump (which the provisional variant would respect if it
          were still active) cannot mutate the final variant — the two variants therefore
          diverge for any timeline where another correction would have been issued.
        test_recipe:
          setup:
            - "MatterVersion with fee_amount_cents=1000, max_correction_rounds=2"
            - "Application A submitted, identity-verified, fee paid (PAID), enters UNDER_REVIEW"
            - "Reviewer issues one CorrectionNotice; Application.correction_round = 1"
          trigger:
            - "GET /applications/{A} (provisional variant, since review_status=AWAITING_CORRECTION) capture total_cents"
            - "Applicant resubmits, reviewer AGREES, Application -> APPROVED"
            - "GET /applications/{A} (final variant, since review_status=APPROVED) capture total_cents"
          assert:
            - "Provisional total_cents == 1545 (1000 + ceil(1000*200/10000)=20 + 500 + ceil(500*500/10000)=25)"
            - "Final total_cents == 1545 at moment of approval AND remains 1545 in any subsequent read (the variant is frozen)"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: opinion_aggregation_three_input_branching
        grounds:
          - calculations.opinion_aggregation
          - entities.ReviewTask.fields.status
          - entities.ReviewTask.fields.is_lead
          - entities.Application.fields.pinned_routing_snapshot
          - state_machines.Application.UNDER_REVIEW_to_APPROVED
          - state_machines.Application.UNDER_REVIEW_to_REJECTED
        distinguishing_aspect: |
          Mode (a): formula has three structural inputs (mode, aggregation_rule,
          per-task statuses) with non-linear interaction — for PARALLEL+MAJORITY, the
          verdict depends on tie-break vs absolute counts and only resolves once every
          non-SKIPPED task has decided; for PARALLEL+LEAD_DECIDES it short-circuits on
          the lead task alone. Two AGREED + two DISAGREED produces DISAGREED under
          MAJORITY (tie-break: AGREED count must STRICTLY exceed DISAGREED count) but
          could be AGREED under LEAD_DECIDES if the lead is on the AGREED side.
        test_recipe:
          setup:
            - "Two MatterVersions V_maj (PARALLEL/MAJORITY) and V_lead (PARALLEL/LEAD_DECIDES) over depts D1..D4 with D1 as lead"
            - "Two Applications A_maj and A_lead each in UNDER_REVIEW with all four ReviewTasks IN_PROGRESS"
            - "On both, D1 and D2 file AGREED; D3 and D4 file DISAGREED"
          trigger:
            - "Inspect Application.review_status after the fourth decision on each"
          assert:
            - "A_maj.review_status == 'REJECTED' (MAJORITY: 2 AGREED == 2 DISAGREED, AGREED not strictly greater -> DISAGREED)"
            - "A_lead.review_status == 'APPROVED' (LEAD_DECIDES: D1=AGREED is the lead)"

      - name: certificate_fee_pinned_rounding_order
        grounds:
          - calculations.certificate_fee_breakdown
          - entities.MatterVersion.fields.fee_amount_cents
          - entities.Application.fields.correction_round
        distinguishing_aspect: |
          Mode (b): two percentage-fee LINES (handling_line at 2.00% over base_fee,
          admin_overhead at 5.00% over the surcharge subtotal) are each ceil()-rounded
          to integer cents BEFORE being summed. The naive sum-then-ceil order produces
          a measurably different total. With base_fee_cents=997 and correction_round=1:
          per-line ceil gives handling=20, overhead=25, total=997+20+500+25=1542; the
          wrong sum-first order gives 997+500+ceil(1497*700/10000)=997+500+105=1602.
          The 60-cent gap is the rounding-order distinction.
        test_recipe:
          setup:
            - "MatterVersion with fee_amount_cents = 997, max_correction_rounds=2"
            - "Application A in AWAITING_CORRECTION with correction_round=1 (one notice already issued)"
          trigger:
            - "GET /applications/{A} and read the fee breakdown"
          assert:
            - "handling_line_cents == 20 (ceil(997 * 200 / 10000) = ceil(19.94) = 20)"
            - "admin_overhead_cents == 25 (ceil(500 * 500 / 10000) = ceil(25) = 25)"
            - "surcharge_subtotal_cents == 500 (1 round * 500)"
            - "total_cents == 1542 (997 + 20 + 500 + 25)"

  # =====================================================================
  # Rule 3 — Non-linear state machines on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_correction_revision_loop_cyclic
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_AWAITING_CORRECTION
          - state_machines.Application.AWAITING_CORRECTION_to_UNDER_REVIEW
          - state_machines.Application.AWAITING_CORRECTION_to_REJECTED
          - entities.Application.fields.correction_round
          - entities.MatterVersion.fields.max_correction_rounds
        distinguishing_aspect: |
          Application has a true cycle UNDER_REVIEW -> AWAITING_CORRECTION -> UNDER_REVIEW
          repeatable up to max_correction_rounds times. This is not a linear pipeline:
          the same row visits the same state twice, and the count of times traversed
          (correction_round) gates the next traversal.
        test_recipe:
          setup:
            - "MatterVersion with max_correction_rounds=2, correction_window_days=7"
            - "Application A in UNDER_REVIEW"
          trigger:
            - "Reviewer issues correction notice 1 -> A in AWAITING_CORRECTION; applicant resubmits -> A back in UNDER_REVIEW"
            - "Reviewer issues correction notice 2 -> A in AWAITING_CORRECTION; applicant resubmits -> A back in UNDER_REVIEW"
            - "Reviewer attempts to issue correction notice 3"
          assert:
            - "After both round-trips, Application.review_status == 'UNDER_REVIEW' and correction_round == 2"
            - "Third correction issuance returns ERR_MAX_ROUNDS_REACHED (HTTP 409)"

      - name: application_dual_axis_payment_review_parallel_dimensions
        grounds:
          - entities.Application.fields.payment_status
          - entities.Application.fields.review_status
          - state_machines.Application
          - endpoints["POST /_events/emit"]
        distinguishing_aspect: |
          Application carries two independent state dimensions — payment_status
          (PENDING -> PAID -> REFUNDED) and review_status (SUBMITTED -> ... -> APPROVED/
          REJECTED/WITHDRAWN). They evolve independently: identity-verification and
          payment events drive payment_status without touching review_status until the
          UNDER_REVIEW gate (both prerequisites). This is the parallel-dimensions shape,
          a different non-linear shape than the cycle in the previous instance.
        test_recipe:
          setup:
            - "Application A with fee>0; review_status=SUBMITTED, payment_status=PENDING"
          trigger:
            - "POST /_events/emit IDENTITY_VERIFIED only"
            - "Inspect Application; then POST /_events/emit PAYMENT_SETTLED"
          assert:
            - "After identity event: identity_verified=true, payment_status='PENDING', review_status='SUBMITTED'"
            - "After payment event: payment_status='PAID' AND review_status='UNDER_REVIEW' (both axes advanced independently)"

      - name: certificate_branching_with_revert_on_reissue
        grounds:
          - state_machines.Certificate.ACTIVE_to_REISSUED
          - state_machines.Certificate.EXPIRED_to_REISSUED
          - state_machines.Certificate.ACTIVE_to_REVOKED
          - state_machines.Certificate.ACTIVE_to_EXPIRED
          - entities.Certificate.fields.superseded_by_certificate_id
        distinguishing_aspect: |
          Certificate fans out from ACTIVE into three terminal-or-replacement targets
          (EXPIRED, REVOKED, REISSUED) with a divergent side-effect set per branch
          (REISSUED creates a successor and back-pointer; REVOKED writes audit only;
          EXPIRED is silent). Branching fork-join shape on a different entity than the
          two Application instances above.
        test_recipe:
          setup:
            - "Approved Application A with active Certificate C1 (validity_days=1)"
          trigger:
            - "POST /certificates/{C1}/reissue while C1 is ACTIVE -> creates C2"
            - "Inspect C1"
          assert:
            - "C1.status == 'REISSUED' AND C1.superseded_by_certificate_id == C2.id"
            - "C2.status == 'ACTIVE' AND C2.serial_number != C1.serial_number"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: correction_expiry_cascade_depth_three
        grounds:
          - state_machines.CorrectionNotice.OPEN_to_EXPIRED
          - state_machines.Application.AWAITING_CORRECTION_to_REJECTED
          - state_machines.ReviewTask.IN_PROGRESS_to_SKIPPED
          - state_machines.ReviewTask.PENDING_to_SKIPPED
          - endpoints["POST /_sweep/run"]
          - endpoints["POST /_clock/advance"]
        distinguishing_aspect: |
          Chain originates from a system trigger (clock-driven sweep). Hop 1: sweep
          flips CorrectionNotice OPEN -> EXPIRED. Hop 2: that mutation on
          CorrectionNotice itself drives Application AWAITING_CORRECTION -> REJECTED
          (the Application change is caused by the notice change, not by the original
          clock advance). Hop 3: the Application transition cascades into every
          non-terminal ReviewTask, flipping IN_PROGRESS / PENDING -> SKIPPED. Three
          distinct entities, each link caused by the previous link. Depth 3.
        test_recipe:
          setup:
            - "MatterVersion (PARALLEL, 2 stages, correction_window_days=1), Application A in UNDER_REVIEW with both ReviewTasks IN_PROGRESS"
            - "Reviewer of stage_index=0 issues a CorrectionNotice -> A in AWAITING_CORRECTION; both ReviewTasks paused"
          trigger:
            - "POST /_clock/advance seconds=86401"
            - "POST /_sweep/run"
          assert:
            - "CorrectionNotice.status == 'EXPIRED'"
            - "Application.review_status == 'REJECTED'"
            - "Both ReviewTasks have status == 'SKIPPED'"

      - name: matter_version_publish_cascade_depth_two
        grounds:
          - state_machines.MatterVersion.DRAFT_to_PUBLISHED
          - state_machines.MatterVersion.PUBLISHED_to_SUPERSEDED
          - entities.Matter.fields.current_published_version_id
          - entities.Matter.fields.status
        distinguishing_aspect: |
          Chain originates from a user-driven publish API call (different trigger from
          the clock-driven instance above). Hop 1: DRAFT V2 -> PUBLISHED. Hop 2: that
          mutation on V2 itself causes the prior V1 to flip PUBLISHED -> SUPERSEDED
          (caused by V2's status change, not by the original API call's intent to
          publish V2). The Matter pointer update is part of hop 1's side_effects, but
          the SUPERSEDE of V1 is hop 2 — caused by V2's new status. Depth 2.
        test_recipe:
          setup:
            - "Matter M with two DRAFT MatterVersions V1, V2; V1 is published first, becoming PUBLISHED"
          trigger:
            - "POST /matters/{M}/versions/{V2}/publish"
          assert:
            - "V2.status == 'PUBLISHED'"
            - "V1.status == 'SUPERSEDED' (caused by V2's publish, not directly by the request)"
            - "Matter.current_published_version_id == V2.id"

  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_conflict_on_resubmit
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CORRECTION_EXPIRED]
          - errors[ERR_DEFICIENCY_UNRESOLVED]
          - endpoints["POST /applications/{id}/correction-notices/{cid}/resubmit"]
        distinguishing_aspect: |
          Pair: business_temporal (ERR_CORRECTION_EXPIRED, prio 10) vs
          business_referential (ERR_DEFICIENCY_UNRESOLVED, prio 12). When a resubmit is
          (a) past due AND (b) does not address every deficiency, both checks fail.
          ERR_CORRECTION_EXPIRED MUST win because lower priority number runs first.
        test_recipe:
          setup:
            - "Application A in AWAITING_CORRECTION with CorrectionNotice CN listing deficiencies on M1 and M2; correction_window_days=1"
          trigger:
            - "POST /_clock/advance seconds=86401 (now > due_at)"
            - "POST /applications/{A}/correction-notices/{CN}/resubmit submitting nothing for M2"
          assert:
            - "Response error_id == 'ERR_CORRECTION_EXPIRED' (NOT 'ERR_DEFICIENCY_UNRESOLVED'); HTTP 409"

      - name: existence_vs_business_constraint_conflict_on_publish
        grounds:
          - validations[priority=3]
          - validations[priority=13]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_DEPENDENT_TEMPLATE_UNPUBLISHED]
          - endpoints["POST /matters/{matter_id}/versions/{version_id}/publish"]
        distinguishing_aspect: |
          Pair: existence (ERR_NOT_FOUND, prio 3) vs business_constraint
          (ERR_DEPENDENT_TEMPLATE_UNPUBLISHED, prio 13). When a publish request targets
          a non-existent version_id AND the version that does not exist would have
          referenced an unpublished template, ERR_NOT_FOUND MUST win because existence
          is checked left-to-right before business constraints. Different error-category
          pair from the previous instance.
        test_recipe:
          setup:
            - "Matter M exists; MaterialTemplate M1 in DRAFT (not PUBLISHED)"
          trigger:
            - "POST /matters/{M}/versions/00000000-0000-0000-0000-000000000000/publish"
          assert:
            - "Response error_id == 'ERR_NOT_FOUND' (NOT 'ERR_DEPENDENT_TEMPLATE_UNPUBLISHED'); HTTP 404"

  # =====================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: warning_pct_inclusive_boundary_on_sla_endpoint
        grounds:
          - calculations.time_limit_warning_evaluator
          - entities.MatterVersion.fields.warning_threshold_pct
          - endpoints["GET /applications/{id}/sla"]
        distinguishing_aspect: |
          Numeric boundary on a percent metric, reachable via GET /applications/{id}/sla.
          Spec: pct < warning_pct = ON_TRACK; pct >= warning_pct AND < 100 = WARNING.
          With committed=10 days, warning_pct=80, working_day_seconds=28800: 80% of
          288000s == 230400s. At elapsed_active=230399 (pct=79) status='ON_TRACK';
          at elapsed_active=230400 (pct=80) status='WARNING' (>= boundary inclusive).
        test_recipe:
          setup:
            - "Department D, MatterVersion V committed=10 days, warning_threshold_pct=80, fee=0"
            - "Application A in UNDER_REVIEW with clock_started_at=T0, no corrections"
          trigger:
            - "POST /_clock/advance seconds=230399; GET /applications/{A}/sla -> capture status"
            - "POST /_clock/advance seconds=1 (cumulative 230400); GET /applications/{A}/sla -> capture status"
          assert:
            - "First sla.status == 'ON_TRACK'"
            - "Second sla.status == 'WARNING'"

      - name: empty_deficiency_list_rejection_on_correction_endpoint
        grounds:
          - validations[priority=16]
          - errors[ERR_DEFICIENCY_INVALID]
          - endpoints["POST /applications/{id}/correction-notices"]
          - entities.CorrectionNotice.fields.deficiencies
        distinguishing_aspect: |
          Empty-collection edge on a different metric (collection size, not numeric
          percent) and a different endpoint (correction-notices, not sla). Spec demands
          deficiencies non-empty; size==0 is rejected with ERR_DEFICIENCY_INVALID, while
          size==1 is accepted.
        test_recipe:
          setup:
            - "Application A in UNDER_REVIEW; reviewer R authorized to issue corrections"
          trigger:
            - "POST /applications/{A}/correction-notices with deficiencies=[] -> capture response"
            - "POST /applications/{A}/correction-notices with deficiencies=[{material_template_id: M1, reason:'missing'}] -> capture response"
          assert:
            - "First call returns ERR_DEFICIENCY_INVALID (HTTP 422)"
            - "Second call returns 201 with CorrectionNotice.round_number == 1"

  # =====================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: review_task_decide_blocked_by_open_correction_notice_pair
        grounds:
          - state_machines.ReviewTask.IN_PROGRESS_to_AGREED
          - state_machines.ReviewTask.IN_PROGRESS_to_DISAGREED
          - entities.CorrectionNotice.fields.status
          - validations[priority=4]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair: ReviewTask -> CorrectionNotice. ReviewTask cannot transition while any
          CorrectionNotice for the same Application has status==OPEN; the reviewer's
          opinion is paused until the notice is resolved or expired. Different entity
          pair from the next instance (which is MatterVersion -> Matter).
        test_recipe:
          setup:
            - "Application A in UNDER_REVIEW with one IN_PROGRESS ReviewTask RT1"
            - "Reviewer issues a CorrectionNotice CN; A -> AWAITING_CORRECTION; RT1 paused"
          trigger:
            - "POST /review-tasks/{RT1}/decide { decision: AGREED }"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE' (HTTP 409)"
            - "RT1.status remains 'IN_PROGRESS', RT1.decided_at is null"

      - name: matter_version_retire_blocked_by_in_flight_application_pair
        grounds:
          - state_machines.MatterVersion.PUBLISHED_to_RETIRED
          - state_machines.MatterVersion.SUPERSEDED_to_RETIRED
          - entities.Application.fields.review_status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair: MatterVersion -> Application. A MatterVersion cannot retire while any
          Application referencing it has review_status outside the terminal set
          {APPROVED, REJECTED, WITHDRAWN}. Different entity pair from the previous
          instance (which is ReviewTask -> CorrectionNotice).
        test_recipe:
          setup:
            - "Matter M, MatterVersion V PUBLISHED; Application A in UNDER_REVIEW pinned to V"
          trigger:
            - "POST /matters/{M}/versions/{V}/retire"
          assert:
            - "Response error_id == 'ERR_INVALID_STATE' (HTTP 409)"
            - "V.status remains 'PUBLISHED'"

  # =====================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: matter_version_publish_window_supersedes_prior_half_open
        grounds:
          - state_machines.MatterVersion.DRAFT_to_PUBLISHED
          - state_machines.MatterVersion.PUBLISHED_to_SUPERSEDED
          - entities.Matter.fields.current_published_version_id
          - concurrency_rules["Catalog manager publishes version V2 while V1 is being retired"]
        distinguishing_aspect: |
          Resource: Matter (only one PUBLISHED version may occupy the
          [published_at, supersede_or_retire) half-open interval at a time). Interval
          semantics: half-open — the new V2 takes the slot at the same instant the old
          V1 vacates it; no PUBLISHED-PUBLISHED overlap allowed even for one tick.
        test_recipe:
          setup:
            - "Matter M with V1 PUBLISHED and V2 DRAFT"
          trigger:
            - "POST /matters/{M}/versions/{V2}/publish"
            - "GET /matters/{M}/versions/{V1}"
          assert:
            - "V1.status == 'SUPERSEDED' immediately (no overlap window)"
            - "Matter.current_published_version_id == V2.id; never points at both"

      - name: certificate_validity_window_aggregate_capacity_one_per_application
        grounds:
          - state_machines.Certificate.ACTIVE_to_REISSUED
          - state_machines.Certificate.ACTIVE_to_EXPIRED
          - entities.Certificate.fields.expires_at
          - entities.Certificate.fields.superseded_by_certificate_id
          - validations[priority=18]
          - errors[ERR_CERTIFICATE_ALREADY_REISSUED]
        distinguishing_aspect: |
          Resource: Application (aggregate capacity = 1 ACTIVE Certificate at a time per
          Application). Interval semantics differ from the previous instance: this is
          aggregate-capacity over an [issued_at, expires_at] closed interval rather than
          a half-open exclusive lock — two certs CAN exist for the same Application as
          long as the first has been replaced by superseded_by_certificate_id, and a
          repeated reissue against an already-replaced source is rejected.
        test_recipe:
          setup:
            - "Approved Application A with Certificate C1 ACTIVE, validity_days=1"
            - "POST /certificates/{C1}/reissue creates C2; C1 becomes REISSUED"
          trigger:
            - "POST /certificates/{C1}/reissue (second attempt)"
          assert:
            - "Response error_id == 'ERR_CERTIFICATE_ALREADY_REISSUED' (HTTP 409)"
            - "Only one ACTIVE Certificate exists for A at any moment (C2)"

  # =====================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_refund_invariant_on_application_rejection
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_REJECTED
          - state_machines.Application.SUBMITTED_to_WITHDRAWN
          - state_machines.Application.UNDER_REVIEW_to_WITHDRAWN
          - entities.Application.fields.payment_status
          - entities.MatterVersion.fields.fee_amount_cents
          - endpoints["POST /_events/emit"]
        distinguishing_aspect: |
          Conserved quantity: applicant's net cash outflow in cents. Invariant:
          for any Application that ends in REJECTED or WITHDRAWN with fee>0,
          payment_status MUST become REFUNDED, leaving (sum of PAID amounts) -
          (sum of REFUNDED amounts) == 0 across the lifecycle. The forward action
          (PAYMENT_SETTLED -> PAID) plus its compensating action (auto-refund on
          terminal non-APPROVED) keeps net cash unchanged.
        test_recipe:
          setup:
            - "MatterVersion with fee_amount_cents=1000; Application A submitted, identity-verified, payment-settled (PAID), now UNDER_REVIEW"
          trigger:
            - "Cause REJECTED via reviewer DISAGREED on a single-stage routing"
          assert:
            - "Application.payment_status == 'REFUNDED'"
            - "Net invariant: PAID amount (1000) - REFUNDED amount (1000) == 0 cents"

      - name: review_task_capacity_invariant_on_application_terminal
        grounds:
          - state_machines.ReviewTask.IN_PROGRESS_to_SKIPPED
          - state_machines.ReviewTask.PENDING_to_SKIPPED
          - state_machines.Application.AWAITING_CORRECTION_to_REJECTED
          - state_machines.Application.UNDER_REVIEW_to_WITHDRAWN
          - entities.ReviewTask.fields.status
        distinguishing_aspect: |
          Conserved quantity: count of non-terminal ReviewTasks per Application.
          Different from the cash-conservation invariant above. Invariant: once an
          Application reaches any terminal review_status (APPROVED, REJECTED,
          WITHDRAWN), the number of ReviewTask rows with status NOT IN
          {AGREED, DISAGREED, SKIPPED} MUST equal 0. The forward action (creating
          ReviewTask rows on UNDER_REVIEW entry) plus the cascade compensating
          action (SKIPPED on terminal) leaves the count of non-terminal tasks
          conserved at 0 after termination.
        test_recipe:
          setup:
            - "MatterVersion PARALLEL with three stages; Application A in UNDER_REVIEW with three IN_PROGRESS ReviewTasks"
            - "No DISAGREED yet exists"
          trigger:
            - "POST /applications/{A}/withdraw"
          assert:
            - "Application.review_status == 'WITHDRAWN'"
            - "Count of ReviewTasks for A with status NOT IN {AGREED, DISAGREED, SKIPPED} == 0"
            - "Specifically all three flipped IN_PROGRESS -> SKIPPED"
