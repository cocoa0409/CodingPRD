  - section: endpoints
    instances:

      - name: standard_crud_table_create_read_and_paginated_child_list
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/tables
          - endpoints.GET_/tables/{id}
          - endpoints.GET_/restaurants/{id}/tables
        distinguishing_aspect: "The create-read-list triangle round-trips exactly: the omitted turn_buffer_minutes takes its declared default of 15 rather than 0, the single-row GET returns the stored row unchanged, and the child list paginates with total_count and has_more across both pages."
        test_recipe:
          setup:
            - "one restaurant; no service or ticket inventory is needed for this instance"
            - "logical clock pinned at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /restaurants"
              payload: { name: "Corner Table House", service_charge_bp: 725, hold_ttl_minutes: 20, offer_ttl_minutes: 15, max_offer_rounds: 2, goodwill_credit_cap_cents: 20000, prep_lead_minutes: 45, refund_scrutiny_threshold_cents: 300000 }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /tables"
              payload: { restaurant_id: "${r_id}", table_code: "T1", seats_min: 1, seats_max: 4 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { t1_id: $.data.id, t1_buffer: $.data.turn_buffer_minutes }
            - call: "POST /tables"
              payload: { restaurant_id: "${r_id}", table_code: "T2", seats_min: 2, seats_max: 8, turn_buffer_minutes: 0 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /tables"
              payload: { restaurant_id: "${r_id}", table_code: "T3", seats_min: 2, seats_max: 8, turn_buffer_minutes: 30 }
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { t3_id: $.data.id }
            - call: "GET /tables/${t2_id}"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { back_code: $.data.table_code, back_buffer: $.data.turn_buffer_minutes }
            - call: "GET /restaurants/${r_id}/tables?limit=2&offset=0"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /restaurants/${r_id}/tables?limit=2&offset=2"
              payload: {}
              as: RestaurantManager
              as_user_id: "${r_id}"
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /tables/${t1_id}"
              payload: {}
              as: KitchenLead
              as_user_id: "${r_id}"
              captures: { kitchen_code: $.data.table_code }
          assert:
            - "all three POSTs return 201 with a system-generated id, created_at, updated_at and version"
            - "${t1_buffer} == 15: omitting turn_buffer_minutes applies the declared default, not 0"
            - "${back_code} == T2 and ${back_buffer} == 0: an explicit 0 is stored as 0 and is not overwritten by the default"
            - "the first page returns 2 rows with total_count 3 and has_more true, and ${page1_first} == ${t1_id} in creation order"
            - "the second page returns 1 row with total_count 3 and has_more false, and ${page2_first} == ${t3_id}"
            - "${kitchen_code} == T1: GET /tables/{id} is a shared read for PlatformAdmin, RestaurantManager and KitchenLead"
            - "no update or delete endpoint exists for Table anywhere in §1.5, so the create-read-list triangle is the whole surface"

