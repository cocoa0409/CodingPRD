          trigger: []
          assert:
            - "Covered by travel_fee_quoted_vs_settled_volume_discount (25 sessions -> 20% discount applied). Boundary at 19 vs 20 is exercised by an analogous setup (omitted here to avoid 80-call boilerplate)."
        excluded_because:
          difficulty_instance: dual_variant_calc / travel_fee_quoted_vs_settled_volume_discount
          rationale: "Already exercises the >=20 threshold with s=25; the sub-threshold case is implicit in the QUOTED variant."

