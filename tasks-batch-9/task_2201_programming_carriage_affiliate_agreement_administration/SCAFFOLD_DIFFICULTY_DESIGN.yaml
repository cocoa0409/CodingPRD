      - instance_id: CF-3
        name: mfn_rate_floor_overrides_lower_benchmark
        grounds:
          - calculations.mfn_benchmark_rate
          - calculations.agreement_effective_rate
          - entities.MfnClause.fields.rate_floor_cents
          - entities.MfnClause.fields.benchmark_status
          - entities.CarriageAgreement.fields.mfn_capped
        title: "agreement_effective_rate — compounding escalator inside a two-sided clamp where the floor beats the cap"
        calculation: agreement_effective_rate
        rationale: >-
          The effective rate is max(min(escalated, benchmark), floor). Three
          numbers, two comparisons, and the outer max can undo the inner min
          entirely — a contractual rate floor is allowed to leave the operator
          paying more than the MFN benchmark it just won. The escalated input is
          itself a compounding power of a floor-divided contract-year index, not
          a linear function of elapsed time, so the pair (escalator, index)
          cannot be folded into a single multiplier.
        distinguishing_aspect: >-
          benchmark_rate_cents is recorded as 38.7280 and yet
          effective_rate_cents_per_sub == 40.0000 because the clause's
          rate_floor_cents is 40.0000; mfn_capped is still true because 40.0000
          < the escalated 45.4272. An implementation that returns min(escalated,
          benchmark) gives 38.7280; one that treats the floor as replacing the
          benchmark record overwrites benchmark_rate_cents to 40.0000; one that
          sets mfn_capped from (effective == benchmark) reports false.
        test_recipe:
          setup: >-
            The Northgate and Vale fixtures of CF-1, but Northgate's MFN clause
            carries a hard 40.0000 rate floor. The DOMESTIC benchmark is still
            the Vale-derived 38.7280, and Northgate's own escalated rate in
