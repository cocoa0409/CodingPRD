      - name: route_stop_create_with_stale_route_version
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[route-stop-create-stale-route]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "RouteStop create with expected_route_version that no longer matches Route.version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Route created (version=1); another stop added (version=2); now create with stale expected_route_version=1"]
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "OCC1", epa_generator_id: "EPAGEN000142", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cid: "$.data.id" } }
            - { call: "POST /recycle-routes/tank-sites", payload: { customer_id: "${cid}", site_address: "OCC1", density_zone: "URBAN" }, as: RoutePlanner, captures: { sid: "$.data.id" } }
