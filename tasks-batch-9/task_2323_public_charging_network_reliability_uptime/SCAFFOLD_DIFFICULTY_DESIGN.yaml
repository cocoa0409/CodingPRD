  # ===========================================================================
  # RULE 4 — Transitive cascades of DIFFERENT depth from DIFFERENT triggers
  #   instance 1: depth 4, triggered by dispatch completion
  #   instance 2: depth 3, triggered by terminal-certification revocation
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: dispatch_completion_cascades_four_levels_dispatch_outage_port_station
        grounds:
          - endpoints[POST /maintenance-dispatches/{dispatch_id}/complete]
          - state_machines.MaintenanceDispatch.transitions.ON_SITE_to_COMPLETED
          - state_machines.OutageEvent.transitions.DISPATCHED_to_RESOLVED
          - state_machines.ChargingPort.transitions.OUT_OF_SERVICE_to_IN_SERVICE
          - state_machines.Station.transitions.SUSPENDED_to_OPERATIONAL
          - calculations.station_downtime_ledger
        distinguishing_aspect: |
          Depth 4, triggered by ON_SITE -> COMPLETED on MaintenanceDispatch. Each link is
          caused strictly by the previous one and cannot be reached without it: (1) the
          dispatch reaching COMPLETED is what (2) resolves the OutageEvent and stamps
          cleared_at; that cleared_at is what (3) lets the ChargingPort leave
          OUT_OF_SERVICE and its maintenance dimension leave UNDER_REPAIR; the port leaving
          OUT_OF_SERVICE is what (4) drops Station.out_of_service_port_count to 0 and lets
          the AUTOMATIC suspension lift, and only then does the downtime ledger absorb the
          360 minutes. Removing any link strands every link below it.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-12T08:00:00Z."
            - "HostSite HS-C4-1 EXECUTED / ENERGIZED / TOWING_ENFORCED, committed_service_capacity_kw 400.00."
