              as_user_id: "U-AGENT-AA"
              captures: { os_err2: $.data.error_id }
            - call: "POST /insurance-determinations/${os_det_id}/submit-review"
              as: ClaimsAgent
              as_user_id: "U-AGENT-AA"
            - call: "GET /depositor-records/${os_dep_id}"
              as: ClaimsAgent
              captures: { os_ver4: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${os_dep_id}", expected_depositor_record_version: "${os_ver4}" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-AA"
              captures: { os_err3: $.data.error_id }
            - call: "GET /insurance-determinations"
