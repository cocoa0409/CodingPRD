  # ===========================================================================
  # §1.7 RBAC. Table 7 gives two bullets — every role can perform its own
  # exclusive and shared operations, and cannot perform another role's
  # exclusives — plus the role_model row. complexity_profile.role_model is
  # `segregation_of_duties`, so the fourth instance below is mandatory.
  #
  # NOTE ON SHAPE: a deliberately-unauthorised request cannot be written as a
  # structured call, because a structured call's `as:` must be one of the
  # endpoint's declared §1.5 roles. Every 403 arm below is therefore expressed
  # as a prose assert naming the exact header substitution, and the structured
  # calls carry the positive arms plus the baseline the 403 arms are compared
  # against.
  # ===========================================================================
  - section: rbac
    instances:

      - name: corner_rbac_credit_officer_exclusive_ladder_is_permitted
        claim_type: exclusive_operations_allowed
        grounds:
          - roles.CreditOfficer
          - complexity_profile.role_model
          - validations[priority=2]
        distinguishing_aspect: |
          All fifteen CreditOfficer exclusive_operations are exercised end-to-end in one
          facility lifetime — including the three that are easy to leave unreachable
          (facility reinstate, repurchase-demand escalation and manual margin-call issuance)
          — and every one of them is refused to CollateralAnalyst, the role closest to it in
          the matrix. Authorisation is proven to be per-endpoint, not per-tier.
        test_recipe:
          setup:
            - "Canonical facility with a funded DRY CONFORMING advance A1 of 1,960,000,000."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
          trigger:
            - call: "POST /facilities/${fac_id}/investors"
              payload: { investor_name: "Beta Conduit Partners", counterparty_rating: "BBB", concentration_limit_pct: 0.20 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { inv_b_id: "$.data.id" }
            - call: "POST /investors/${inv_b_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /investors/${inv_b_id}/suspend"
              payload: { reason: "Rating downgrade below policy floor" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /margin-calls"
              payload: { facility_id: "${fac_id}", trigger_reason: "COVENANT_BREACH" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { mc_man_id: "$.data.id", mc_man_amt: "$.data.call_amount_cents" }
            - call: "POST /margin-calls/${mc_man_id}/waive"
              payload: { reason: "Sponsor equity contribution received out of band" }
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "POST /facilities/${fac_id}/suspend"
              payload: { reason: "Annual re-underwriting" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /facilities/${fac_id}/reinstate"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /advances/${a1_id}/repurchase-demands"
              payload: { reason: "CUSTODY_EXCEPTION_UNCURED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { rd1_id: "$.data.id" }
            - call: "POST /repurchase-demands/${rd1_id}/escalate"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /custodians/${cust_id}/suspend"
              payload: { reason: "SOC 1 exception outstanding" }
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "setup already exercised seven more CreditOfficer exclusives: POST /facilities (201), POST /facilities/{id}/product-advance-rates (201), POST /facilities/{id}/approve (200), POST /facilities/{id}/custodians (201), POST /facilities/{id}/investors (201), POST /investors/{id}/approve (200) and POST /facilities/{id}/commitments (201) — with the nine triggered calls that is all fifteen"
            - "investor B is approved before it is suspended: priority 44 requires APPROVED for suspend, so the approve at call 2 is a precondition and not a duplicate of the setup's approve of investor A"
            - "mc_man_amt == 196000000 = floor(1960000000 * COVENANT_BREACH_PAYDOWN_PCT 0.10) and MarginCall.${mc_man_id}.issued_by_user_id == \"co_1\""
            - "the waive by co_2 returns HTTP 200, MarginCall.${mc_man_id}.status == WAIVED, waived_by_user_id == \"co_2\", and WarehouseFacility.${fac_id}.status returns RESTRICTED -> ACTIVE"
            - "POST /facilities/${fac_id}/suspend returns 200 with status SUSPENDED, and the immediately following reinstate returns 200 with status ACTIVE — open_margin_call_count is 0, no call is DEFAULTED, last_covenant_status is NOT_TESTED and escalated_demand_count is still 0, so all four reinstate preconditions hold"
            - "RepurchaseDemand.${rd1_id} is created with status OPEN and demand_amount_cents == 1960000000; the escalate returns 200 with status ESCALATED and WarehouseFacility.${fac_id}.escalated_demand_count == 1"
            - "escalated_demand_count 1 leaves the facility ACTIVE — the RESTRICTED trip is at 2, so this instance does not accidentally test the threshold"
            - "DocumentCustodian.${cust_id}.status == SUSPENDED after the last call"
            - "each of the nine triggered calls re-sent with X-User-Role: CollateralAnalyst (and X-User-ID: ca_1) returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED — CollateralAnalyst appears in none of these nine endpoints' §1.5 roles"
            - "each of those nine 403 responses leaves every entity byte-identical: no version increments, no status changes and no LedgerEntry rows are appended"
            - "the same nine calls re-sent as X-User-Role: WireOperator also return 403 — WireOperator has an empty exclusive_operations list and touches only wire decision, fund and three reads"

      - name: corner_rbac_analyst_exclusives_and_cross_role_denials
        claim_type: other_roles_exclusive_denied
        grounds:
          - roles.CollateralAnalyst
          - roles.WireOperator
          - roles.CreditOfficer
          - validations[priority=2]
        distinguishing_aspect: |
          The two CollateralAnalyst exclusives (valuation and ship) succeed for
          CollateralAnalyst and are refused to all five other roles, and the refusal is shown
          to outrank both existence and state: a CreditOfficer valuing a nonexistent advance
          gets 403 rather than 404, and a WireOperator booking an advance gets 403 rather
          than a 422 about its payload. Authorisation is checked at priority 2, above
          everything except header presence.
        test_recipe:
          setup:
            - "Canonical facility with funded advance A1; the advance's version is captured for the OCC input."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - *c_adv_v1
          trigger:
            - call: "POST /advances/${a1_id}/valuation"
              payload: { market_value_cents: 2100000000, expected_advance_version: "${adv_v1}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /advances/${a1_id}/ship"
              payload: { investor_id: "${inv_a_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { bl_id: "$.data.id" }
          assert:
            - "the valuation returns HTTP 200; eligible_collateral_value_cents == 1960000000 = floor(min(2000000000, 2100000000) * 0.98), required_paydown_cents == 0, so no MarginCall is raised and the facility stays ACTIVE"
            - "the ship returns HTTP 201 with BaileeLetter.${bl_id}.status == ISSUED and Advance.${a1_id}.funding_status == SHIPPED"
            - "the identical valuation body re-sent with X-User-Role: CreditOfficer returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED; the same for WireOperator, Borrower (X-User-ID ${fac_id}), Custodian (X-User-ID ${cust_id}) and Investor (X-User-ID ${inv_a_id})"
            - "the identical ship body re-sent with X-User-Role: CreditOfficer, WireOperator, Borrower, Custodian or Investor returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "POST /advances/00000000-0000-4000-8000-000000000000/valuation as X-User-Role: CreditOfficer returns 403 ERR_UNAUTHORIZED, NOT 404 ERR_ADVANCE_NOT_FOUND — priority 2 precedes priority 3"
            - "a POST /advances body identical to the setup's, re-sent with X-User-Role: WireOperator, returns 403 ERR_UNAUTHORIZED and NOT 412 ERR_STALE_FACILITY_VERSION, even though ${fac_v1} is stale by then"
            - "POST /advances/${a1_id}/fund as X-User-Role: CreditOfficer returns 403 ERR_UNAUTHORIZED, NOT 409 ERR_ADVANCE_INVALID_STATE, even though A1 has already left REQUESTED"
            - "the positive control holds in the other direction too: POST /advances/${a1_id}/fund is legal for both CollateralAnalyst and WireOperator, so 403 is never returned merely because a wire-desk role touched a collateral endpoint"

      - name: corner_rbac_entity_backed_identities_are_row_scoped
        claim_type: shared_operations_allowed
        grounds:
          - roles.Borrower
          - roles.Custodian
          - roles.Investor
          - validations[priority=2]
          - validations[priority=4]
        distinguishing_aspect: |
          For the three entity_backed roles X-User-ID is not an opaque token but a primary
          key, and the two failure modes are distinguishable: an X-User-ID that resolves to
          no row of the backing entity fails authorisation with 403 at priority 2, while an
          X-User-ID that resolves to the wrong row of the right entity fails ownership with
          404 ERR_RESOURCE_MISMATCH at priority 4. Collapsing them into one code is the
          natural mistake.
        test_recipe:
          setup:
            - "Canonical facility, funded advance A1, custodian and approved investor A with commitment A."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
          trigger:
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: Borrower
              as_user_id: "${fac_id}"
            - call: "POST /facilities/${fac_id}/covenant-tests"
              payload: { period_end: "2026-06-30", tangible_net_worth_cents: 2000000000, liquidity_cents: 800000000, net_income_cents: 200000000 }
              as: Borrower
              as_user_id: "${fac_id}"
              captures: { ct_pass_id: "$.data.id" }
            - call: "GET /advances/${a1_id}"
              payload: {}
              as: Custodian
              as_user_id: "${cust_id}"
            - call: "GET /custodians/${cust_id}/receipts"
              payload: {}
              as: Custodian
              as_user_id: "${cust_id}"
            - call: "GET /investors/${inv_a_id}/commitments"
              payload: {}
              as: Investor
              as_user_id: "${inv_a_id}"
            - call: "POST /advances/${a1_id}/ship"
              payload: { investor_id: "${inv_a_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "GET /advances/${a1_id}/bailee-letters"
              payload: {}
              as: Investor
              as_user_id: "${inv_a_id}"
            - call: "POST /advances/${a1_id}/purchase"
              payload: { proceeds_reference: "SETL-2026-0801-A1" }
              as: Investor
              as_user_id: "${inv_a_id}"
          assert:
            - "setup already exercised a Custodian shared operation: POST /advances/${a1_id}/receipts was issued with X-User-ID == ${cust_id} and returned 201"
            - "the Borrower read returns 200 with data.id == ${fac_id}, and the Borrower covenant test returns 201 with CovenantTest.${ct_pass_id}.status == PASS (profitability_metric_cents 800000000 via ANNUALIZED_QUARTER, breach_codes [])"
            - "the Custodian read of ${a1_id} returns 200 because Advance.custodian_id == ${cust_id}, and GET /custodians/${cust_id}/receipts returns total_count == 1"
            - "the Investor read returns 200 with total_count == 1 and data[0].id == ${comm_a_id}"
            - "GET /advances/${a1_id}/bailee-letters as Investor ${inv_a_id} returns 200 with one ISSUED letter, and the purchase returns 200 with funding_status PURCHASED"
            - "each of those reads re-sent with X-User-ID: \"not-a-uuid-in-any-table\" and the same X-User-Role returns HTTP 403 with data.error_id == ERR_UNAUTHORIZED — priority 2 fails when an entity-backed X-User-ID resolves to no row"
            - "GET /advances/${a1_id} with X-User-Role: Custodian and X-User-ID: ${inv_a_id} returns 403 ERR_UNAUTHORIZED, because ${inv_a_id} is a TakeoutInvestor id and not a DocumentCustodian id — the row must belong to the role's OWN backing entity"
            - "GET /investors/${inv_a_id}/commitments with X-User-Role: Investor and X-User-ID: a DIFFERENT TakeoutInvestor id returns 404 ERR_RESOURCE_MISMATCH, not 403 — the identity resolves, the ownership does not"
            - "GET /facilities/${fac_id} with X-User-Role: Custodian and X-User-ID: ${cust_id} returns 403 ERR_UNAUTHORIZED: Custodian is not in that endpoint's roles at all, so the scoping rule is never reached"

      - name: corner_rbac_four_eyes_on_fund_approve_and_waive
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - validations[priority=21]
          - validations[priority=46]
          - errors.ERR_DUAL_CONTROL_VIOLATION
          - entities.MarginCall.issued_by_user_id
        distinguishing_aspect: |
          All three four-eyes gates share one error code but three different comparands, and
          the third is conditional: priority 46 is SKIPPED when the comparand is null, which
          is true of every system-issued MarginCall. So co_1 is refused the waive of the call
          it raised by hand and permitted the waive of a call the aging/valuation machinery
          raised — same user, same endpoint, same role, opposite outcomes. A role-only
          implementation passes none of these arms; an unconditional identity check fails the
          system-issued arm.
        test_recipe:
          setup:
            - "Canonical facility; A1's wire is VERIFIED by wo_1 and A1 is still REQUESTED."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - call: "POST /facilities"
              payload:
                borrower_legal_name: "Second Facility For Approval Four Eyes"
                committed_amount_cents: 5000000000
                wet_sublimit_cents: 5000000000
                aged_sublimit_cents: 1000000000
                scratch_and_dent_sublimit_cents: 500000000
                min_tangible_net_worth_cents: 1000000000
                min_liquidity_cents: 250000000
                min_ttm_net_income_cents: 50000000
                max_investor_concentration_pct: 0.35
                bailee_period_days: 30
                unused_line_fee_rate: 0.0025
                settlement_account_last4: "9182"
              as: CreditOfficer
              as_user_id: "co_9"
              captures: { fac2_id: "$.data.id" }
            - call: "POST /facilities/${fac2_id}/product-advance-rates"
              payload: { product_code: "CONFORMING", advance_rate: 0.98, wet_funding_allowed: false, dwell_limit_days: 30 }
              as: CreditOfficer
              as_user_id: "co_9"
          trigger:
            - call: "POST /advances/${a1_id}/fund"
              payload: {}
              as: WireOperator
              as_user_id: "wo_1"
            - call: "POST /advances/${a1_id}/fund"
              payload: {}
              as: WireOperator
              as_user_id: "wo_2"
            - call: "POST /facilities/${fac2_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_9"
            - call: "POST /facilities/${fac2_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_7"
            - call: "POST /margin-calls"
              payload: { facility_id: "${fac_id}", trigger_reason: "COVENANT_BREACH" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fe_mc_id: "$.data.id" }
            - call: "POST /margin-calls/${fe_mc_id}/waive"
              payload: { reason: "Same officer attempts to waive his own call" }
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /margin-calls/${fe_mc_id}/waive"
              payload: { reason: "Independent credit review cleared the exposure" }
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "GET /advances/${a1_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { fe_adv_v: "$.data.version" }
            - call: "POST /advances/${a1_id}/valuation"
              payload: { market_value_cents: 1900000000, expected_advance_version: "${fe_adv_v}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "GET /facilities/${fac_id}/margin-calls"
              payload: { status: "ISSUED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fe_sys_mc_id: "$.data[0].id", fe_sys_mc_amt: "$.data[0].call_amount_cents" }
            - call: "POST /margin-calls/${fe_sys_mc_id}/waive"
              payload: { reason: "Valuation source corrected; decline was a vendor feed error" }
              as: CreditOfficer
              as_user_id: "co_1"
          assert:
            - "GATE 1 (priority 21): the first fund, by wo_1 who is WireInstruction.${w1_id}.decided_by_user_id, returns HTTP 409 with data.error_id == ERR_DUAL_CONTROL_VIOLATION; Advance.${a1_id} is still REQUESTED with advance_amount_cents 0"
            - "the second fund, by wo_2, returns HTTP 200 with advance_amount_cents == 1960000000 — the SAME role succeeded, so this is an identity rule and not a role rule"
            - "priority 21 sits below the wire check at 19: had the wire been PENDING_VERIFICATION, wo_1's call would have returned ERR_WIRE_NOT_VERIFIED instead"
            - "GATE 2 (priority 46): approving ${fac2_id} as co_9, its created_by_user_id, returns HTTP 409 ERR_DUAL_CONTROL_VIOLATION and the facility stays PENDING_APPROVAL with approved_by_user_id null"
            - "the same approve as co_7 returns HTTP 200, status ACTIVE, approved_by_user_id == \"co_7\""
            - "priority 46 is ranked LAST, so a PENDING_APPROVAL facility with zero ProductAdvanceRate rows approved by its own creator returns ERR_NO_ADVANCE_RATES_CONFIGURED (priority 31), not ERR_DUAL_CONTROL_VIOLATION"
            - "GATE 3 (priority 46, manual call): MarginCall.${fe_mc_id}.call_amount_cents == 196000000 and issued_by_user_id == \"co_1\"; the waive by co_1 returns HTTP 409 ERR_DUAL_CONTROL_VIOLATION and the call stays ISSUED with version unchanged"
            - "the waive by co_2 returns HTTP 200 with status WAIVED and waived_by_user_id == \"co_2\""
            - "GATE 3 INVERTED (priority 46 skipped): the valuation drops eligible_collateral_value_cents to 1862000000 = floor(1900000000 * 0.98), so fe_sys_mc_amt == 98000000 = 1960000000 - 1862000000 and MarginCall.${fe_sys_mc_id}.issued_by_user_id is null"
            - "waiving ${fe_sys_mc_id} as co_1 returns HTTP 200 with status WAIVED — the null comparand skips the rule entirely, even though co_1 was refused the waive of ${fe_mc_id} moments earlier in the same test"
            - "the ledger records both waives as MARGIN_CALL_WAIVED CREDIT entries of 196000000 and 98000000 that move neither outstanding_principal_cents nor accrued_fee_balance_cents; outstanding_principal_cents is 1960000000 throughout"
            - "WarehouseFacility.${fac_id}.status ends ACTIVE and open_margin_call_count == 0 — both waives re-evaluated the RESTRICTED -> ACTIVE transition"

  # ===========================================================================
  # Cross-cutting complexity layers. complexity_profile.complexity_layers is
  # [rate_threshold_triggers, cascading_side_effects, dual_variant_calculation,
  # optimistic_concurrency]. The guide's optimistic_concurrency row demands one
  # stale-version test per §1.2.1 concurrency rule, so all three rules get a
  # real instance here; the other three layers are the load-bearing subject of
  # §1.8 instances and are stubbed.
  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: corner_occ_advance_create_stale_facility_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[advance-create-stale-facility]
          - validations[priority=8]
          - errors.ERR_STALE_FACILITY_VERSION
          - endpoints["POST /advances"]
        distinguishing_aspect: |
          The facility token moves on exactly the writes that change the client's view of
          the line and on no others: the booking itself bumps WarehouseFacility.version (it is
          the rule's declared write_endpoint) and so does the funding, while the custodian
          receipt and the wire verification bump only the Advance and the WireInstruction. So
          a client booking two advances in a row MUST re-read between them, and a REJECTED
          booking must bump nothing at all — an implementation that bumps on rejection makes
          every retry fail, and one that never bumps makes the whole rule dead code.
        test_recipe:
          setup:
            - "Canonical facility read at ${fac_v1}, then advance A1 booked, receipted, wire-verified and funded to 1,960,000,000 — two of those four writes (the booking and the funding) touch the facility."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
          trigger:
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 1000000000
                note_rate: 0.0625
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${fac_v1}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { occ_fac_v2: "$.data.version" }
            - call: "POST /advances"
              payload:
                facility_id: "${fac_id}"
                custodian_id: "${cust_id}"
                investor_commitment_id: "${comm_a_id}"
                product_code: "CONFORMING"
                loan_amount_cents: 1000000000
                note_rate: 0.0625
                funding_type: "DRY"
                payee_name: "Summit Title & Escrow"
                payee_account_last4: "4417"
                payee_routing_last4: "0021"
                expected_facility_version: "${occ_fac_v2}"
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { occ_a2_id: "$.data.id" }
          assert:
            - "setup: ${fac_v1} was consumed by ${a1_id}'s own booking — POST /advances is the write_endpoint of the advance-create-stale-facility rule, so that booking itself incremented WarehouseFacility.version and made ${fac_v1} stale for every later caller"
            - "the first triggered booking returns HTTP 412 with data.error_id == ERR_STALE_FACILITY_VERSION and creates no Advance row"
            - "occ_fac_v2 == fac_v1 + 2 exactly: of the four setup writes after the read, POST /advances and POST /advances/{id}/fund each touch the facility while POST /advances/{id}/receipts and POST /wire-instructions/{id}/decision bump only Advance.version and WireInstruction.version"
            - "the 412 itself bumps nothing: occ_fac_v2 is read AFTER the rejected booking and is still exactly fac_v1 + 2, and the token it yields is then accepted, so a rejected booking must leave WarehouseFacility.version untouched"
            - "the second triggered booking, identical except for the version token, returns HTTP 201 with Advance.${occ_a2_id}.funding_status == REQUESTED"
            - "GET /advances returns total_count == 2 — the 412 left no orphan row behind"
            - "priority 8 outranks state: the same stale token sent while the facility is SUSPENDED still returns 412 ERR_STALE_FACILITY_VERSION, not 409 ERR_FACILITY_NOT_ACTIVE"
            - "priority 8 is outranked by schema: the stale token combined with a missing loan_amount_cents returns 422 ERR_VALIDATION (priority 7), not 412"

      - name: corner_occ_valuation_stale_advance_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[valuation-stale-advance]
          - validations[priority=8]
          - errors.ERR_STALE_ADVANCE_VERSION
          - endpoints["POST /advances/{id}/valuation"]
        distinguishing_aspect: |
          The valuation token is scoped to the Advance, not the facility: a successful
          valuation bumps Advance.version and leaves WarehouseFacility.version alone, so the
          two OCC namespaces cannot be conflated. The last arm pins the tier order — a stale
          token against a PURCHASED advance is 412, never the 409 the terminal state would
          otherwise produce.
        test_recipe:
          setup:
            - "Canonical facility with A1 funded to 1,960,000,000; A1's version and the facility's version are both captured before any valuation."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - *c_adv_v1
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { occ2_fac_v: "$.data.version" }
          trigger:
            - call: "POST /advances/${a1_id}/valuation"
              payload: { market_value_cents: 2050000000, expected_advance_version: "${adv_v1}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /advances/${a1_id}/valuation"
              payload: { market_value_cents: 2020000000, expected_advance_version: "${adv_v1}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "GET /advances/${a1_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
              captures: { occ2_adv_v2: "$.data.version", occ2_mkt: "$.data.market_value_cents" }
            - call: "POST /advances/${a1_id}/valuation"
              payload: { market_value_cents: 2020000000, expected_advance_version: "${occ2_adv_v2}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /advances/${a1_id}/ship"
              payload: { investor_id: "${inv_a_id}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /advances/${a1_id}/purchase"
              payload: { proceeds_reference: "SETL-OCC2" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "POST /advances/${a1_id}/valuation"
              payload: { market_value_cents: 1000000000, expected_advance_version: "${adv_v1}" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
          assert:
            - "call 1 returns HTTP 200; min(loan 2000000000, market 2050000000) is the loan, so eligible_collateral_value_cents == 1960000000 = floor(2000000000 * 0.98), required_paydown_cents == 0, no MarginCall is issued and the facility stays ACTIVE"
            - "call 2, replaying ${adv_v1}, returns HTTP 412 with data.error_id == ERR_STALE_ADVANCE_VERSION — NOT ERR_STALE_FACILITY_VERSION, which belongs to a different concurrency rule"
            - "occ2_adv_v2 == adv_v1 + 1 and occ2_mkt == 2050000000: the rejected write stored nothing, not even the market value"
            - "WarehouseFacility.${fac_id}.version is still occ2_fac_v immediately after call 4 — a valuation increments Advance.version only and never touches the facility (the later purchase does, which is why this is asserted before the ship)"
            - "call 4, with the refreshed token, returns HTTP 200 and market_value_cents == 2020000000"
            - "call 7 returns HTTP 412 ERR_STALE_ADVANCE_VERSION and NOT 409 ERR_ADVANCE_INVALID_STATE, even though ${a1_id} is PURCHASED by then — priority 8 precedes priority 11"
            - "the same call 7 body re-sent with the CURRENT advance version returns 409 ERR_ADVANCE_INVALID_STATE, which is what proves the previous assert is about ordering and not about the state check being absent"

      - name: corner_occ_cure_payment_stale_margin_call_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cure-payment-stale-margin-call]
          - validations[priority=8]
          - errors.ERR_STALE_MARGIN_CALL_VERSION
          - endpoints["POST /margin-calls/{id}/cure-payments"]
        distinguishing_aspect: |
          Partial cures are legitimately repeatable, so the second payment can only be
          refused on staleness — there is no state or amount reason to reject it. That makes
          this the one OCC rule whose removal is invisible to every other test: without it the
          replayed payment simply succeeds and over-cures the call. The final arm shows 412
          still winning after the call has reached the terminal CURED state.
        test_recipe:
          setup:
            - "Canonical facility with A1 funded to 1,960,000,000 and a manual facility-level MarginCall of 196,000,000 raised by co_1; accrued_fee_balance_cents is 0 because no aging-run has been executed."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
            - *c_fund_a1
            - call: "POST /margin-calls"
              payload: { facility_id: "${fac_id}", trigger_reason: "COVENANT_BREACH" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { occ3_mc_id: "$.data.id", occ3_mc_v1: "$.data.version", occ3_mc_amt: "$.data.call_amount_cents" }
          trigger:
            - call: "POST /margin-calls/${occ3_mc_id}/cure-payments"
              payload: { amount_cents: 96000000, expected_margin_call_version: "${occ3_mc_v1}" }
              as: Borrower
              as_user_id: "${fac_id}"
              captures: { occ3_cp1_id: "$.data.id" }
            - call: "POST /margin-calls/${occ3_mc_id}/cure-payments"
              payload: { amount_cents: 50000000, expected_margin_call_version: "${occ3_mc_v1}" }
              as: Borrower
              as_user_id: "${fac_id}"
            - call: "GET /margin-calls/${occ3_mc_id}"
              payload: {}
              as: Borrower
              as_user_id: "${fac_id}"
              captures: { occ3_mc_v2: "$.data.version", occ3_cured: "$.data.cured_amount_cents" }
            - call: "GET /margin-calls/${occ3_mc_id}/cure-payments"
              payload: {}
              as: CreditOfficer
              as_user_id: "co_1"
            - call: "POST /margin-calls/${occ3_mc_id}/cure-payments"
              payload: { amount_cents: 100000000, expected_margin_call_version: "${occ3_mc_v2}" }
              as: Borrower
              as_user_id: "${fac_id}"
              captures: { occ3_cp2_id: "$.data.id" }
            - call: "POST /margin-calls/${occ3_mc_id}/cure-payments"
              payload: { amount_cents: 10000000, expected_margin_call_version: "${occ3_mc_v1}" }
              as: Borrower
              as_user_id: "${fac_id}"
          assert:
            - "setup: occ3_mc_amt == 196000000 = floor(1960000000 * 0.10) and WarehouseFacility.${fac_id}.status moved ACTIVE -> RESTRICTED"
            - "call 1 returns HTTP 201; accrued_fee_balance_cents is 0 so the waterfall's first bucket takes nothing and CurePayment.${occ3_cp1_id}.applied_to_fees_cents == 0 with applied_to_principal_cents == 96000000"
            - "after call 1 MarginCall.${occ3_mc_id}.status == PARTIALLY_CURED, cured_amount_cents == 96000000, and Advance.${a1_id}.outstanding_balance_cents == 1864000000"
            - "call 2 returns HTTP 412 with data.error_id == ERR_STALE_MARGIN_CALL_VERSION — 50000000 <= 0 + (196000000 - 96000000) so the amount rule at priority 32 is satisfied and the call is still open, leaving staleness as the only possible ground for refusal"
            - "occ3_mc_v2 == occ3_mc_v1 + 1 and occ3_cured == 96000000: the 412 changed nothing"
            - "call 4 returns total_count == 1 — the rejected payment created no CurePayment row and appended no LedgerEntry"
            - "call 5 returns HTTP 201 with applied_to_principal_cents == 100000000, so cured_amount_cents reaches exactly 196000000, MarginCall.${occ3_mc_id}.status == CURED and WarehouseFacility.${fac_id}.status returns to ACTIVE"
            - "call 5 also incremented WarehouseFacility.version — a cure payment is the one write that bumps the margin call AND the facility"
            - "call 6 returns HTTP 412 ERR_STALE_MARGIN_CALL_VERSION and NOT 409 ERR_MARGIN_CALL_NOT_OPEN and NOT 422 ERR_CURE_PAYMENT_EXCEEDS_OBLIGATION, even though the call is terminal and the remaining obligation is 0 — priority 8 precedes both 14 and 32"
            - "the same 10000000 payment re-sent with the CURRENT version returns 409 ERR_MARGIN_CALL_NOT_OPEN (priority 14), which outranks the amount rule at priority 32"
            - "Advance.${a1_id}.outstanding_balance_cents ends at 1764000000 = 1960000000 - 196000000 and the ledger holds exactly two CURE_PRINCIPAL CREDIT entries of 96000000 and 100000000"

      - name: corner_layer_rate_threshold_triggers_already_covered
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.eligible_collateral_valuation
          - calculations.dwell_and_aging_classification
        excluded_because:
          difficulty_instance: boundary_dwell_limit_thirty_versus_thirty_one_days
          rationale: |
            The dwell limit is this scaffold's only cumulative rate threshold, and the §1.8
            instance already probes it at 29 / 30 / 31 days together with the curtailment
            step it triggers and the reset that a repurchase performs. Repeating the boundary
            here would duplicate the same three clock settings without adding a distinct
            claim.

      - name: corner_layer_cascading_side_effects_already_covered
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines[entity=TakeoutInvestor]
          - state_machines[entity=WarehouseFacility]
        excluded_because:
          difficulty_instance: cascade_investor_suspension_to_facility_restriction
          rationale: |
            The four-hop investor-suspension cascade (investor -> commitments -> advance
            re-valuation at ORPHAN_RATE -> margin calls -> facility RESTRICTED) is exactly the
            end-to-end chain this row asks for, including its ordering sensitivity, and the
            partial-failure arm is covered by the second §1.8 cascade instance
            (cascade_second_covenant_breach_to_wire_block).

      - name: corner_layer_dual_variant_calculation_already_covered
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.advance_amount_determination
          - calculations.covenant_evaluation
        excluded_because:
          difficulty_instance: dual_variant_wet_versus_dry_advance_sizing
          rationale: |
            Both declared variant families are already exercised in depth by §1.8: the
            WET/DRY sizing divergence with its exact delta, and the TTM_ROLLING versus
            ANNUALIZED_QUARTER profitability selection in
            dual_variant_ttm_rolling_versus_annualized_quarter_profitability. A breadth probe
            can only restate them.

  # ===========================================================================
  # Consistency model. complexity_profile.consistency_model is `immediate`, so
  # the single claim is that every write's own response already reflects the
  # full cascade and that no read anywhere in this scaffold needs a retry.
  # ===========================================================================
  - section: consistency model
    instances:

      - name: corner_consistency_immediate_visibility_of_the_whole_funding_cascade
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints["POST /advances/{id}/fund"]
          - calculations.facility_exposure_rollup
          - endpoints["GET /facilities/{id}/exposure-summary"]
        distinguishing_aspect: |
          POST /advances/{id}/fund is the widest write in the scaffold — it touches the
          Advance, the WireInstruction, the InvestorCommitment, the TakeoutInvestor, the
          LedgerEntry table and five facility rollup fields — and under `immediate` every one
          of those effects must be observable in the very next request, with the logical clock
          untouched and no intervening write of any kind. Nothing may be deferred to an
          aging-run, a background sweep or a later read. The fund response body itself must
          already carry the recomputed derived fields rather than the pre-write snapshot.
        test_recipe:
          setup:
            - "Canonical facility with commitment A of 5,000,000,000; advance A1 booked DRY for 2,000,000,000, receipted CLEAR and wire-verified, but NOT yet funded."
          setup_api_calls:
            - *c_clock_aug1
            - *c_facility
            - *c_par_conforming
            - *c_approve_facility
            - *c_custodian
            - *c_investor_a
            - *c_investor_a_approve
            - *c_commitment_a
            - *c_get_fac_v1
            - *c_advance_dry_2b
            - *c_receipt_clear_a1
            - *c_wire_a1
            - *c_verify_w1
          trigger:
            - *c_fund_a1
            - call: "GET /facilities/${fac_id}/exposure-summary"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "GET /commitments/${comm_a_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "GET /investors/${inv_a_id}"
              payload: {}
              as: CollateralAnalyst
              as_user_id: "ca_1"
            - call: "GET /advances/${a1_id}/wire-instructions"
              payload: {}
              as: WireOperator
              as_user_id: "wo_1"
            - call: "GET /facilities/${fac_id}/ledger-entries"
              payload: { entry_type: "ADVANCE_FUNDED" }
              as: CollateralAnalyst
              as_user_id: "ca_1"
          assert:
            - "the fund response body ALONE already contains funding_status FUNDED, advance_amount_cents == 1960000000, provisional_advance_amount_cents == 1960000000, concentration_capped == false, effective_advance_rate == 0.98, eligible_collateral_value_cents == 1960000000, required_paydown_cents == 0, dwell_days == 0 and funded_at == \"2026-08-01T00:00:00Z\" — none of these are null or stale in the writing response"
            - "the exposure-summary read, issued with no intervening write and the clock still at 2026-08-01T00:00:00Z, reports outstanding_principal_cents == 1960000000, availability_cents == 18040000000 = 20000000000 - 1960000000, wet_outstanding_cents == 0 (the advance is DRY), aged_outstanding_cents == 0, scratch_and_dent_outstanding_cents == 0, accrued_fee_balance_cents == 0 and open_margin_call_count == 0"
            - "the same read reports ledger_debit_total_cents == 1960000000, ledger_credit_total_cents == 0 and advance_outstanding_sum_cents == 1960000000, so debit - credit == outstanding_principal_cents holds on the first read after the write"
            - "investor_exposures already contains exactly one row { investor_id: ${inv_a_id}, exposure_cents: 1960000000 }"
            - "InvestorCommitment.${comm_a_id} reads allocated_amount_cents == 1960000000, remaining_amount_cents == 3040000000 and status == PARTIALLY_ALLOCATED — the allocation is not deferred"
            - "TakeoutInvestor.${inv_a_id}.exposure_cents == 1960000000, matching the exposure-summary row exactly"
            - "WireInstruction.${w1_id}.status == RELEASED: the wire's own transition is part of the same request, not a follow-up"
            - "the filtered ledger read returns total_count == 1 with data[0].entry_type == ADVANCE_FUNDED, direction == DEBIT, amount_cents == 1960000000, advance_id == ${a1_id} and posted_at == \"2026-08-01T00:00:00Z\""
            - "no assert in this file or in SCAFFOLD_DIFFICULTY_DESIGN.yaml ever re-reads an entity a second time to let a value settle: every rollup, every derived field and every cascade is asserted on the first read following its write"
            - "the only writes whose effects appear later in logical time are the ones gated on the CLOCK itself (dwell, bailee expiry, cure deadlines) — those are advanced explicitly by POST /_clock/set_current_utc plus POST /facilities/{id}/aging-run and are not eventual consistency"
