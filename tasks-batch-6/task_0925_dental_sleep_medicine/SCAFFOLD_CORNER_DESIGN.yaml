# =============================================================================
# §1.9 Scaffold Corner Design — breadth probe over every testable claim the
# scaffold surface declares that §1.8 does not already cover.
# Nine sections, taken verbatim from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: create_patient_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Patient.fields.records_frozen
          - entities.Patient.fields.deductible_remaining_cents
          - entities.Patient.fields.epworth_score
          - endpoints[POST /patients]
        distinguishing_aspect: |
          Omitting every optional field on POST /patients must yield deductible_remaining_cents 0,
          epworth_score 0, dental_payer_id null, records_frozen false and version 1 — the declared
          defaults, not nulls.
        test_recipe:
          setup:
            - "One MEDICAL payer exists."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "MedFirst", payer_kind: "MEDICAL" }
              as: PlatformAdmin
              captures: { payer_med_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-777", full_name: "Default Dan", date_of_birth: "1980-01-01", medical_payer_id: "${payer_med_id}" }
              as: ClinicCoordinator
              captures: { pat_id: $.data.id }
          assert:
            - "Patient.${pat_id}.deductible_remaining_cents == 0"
            - "Patient.${pat_id}.epworth_score == 0"
            - "Patient.${pat_id}.dental_payer_id == null"
            - "Patient.${pat_id}.records_frozen == false"
            - "Patient.${pat_id}.version == 1"
            - "response HTTP status == 201"

      - name: get_patient_with_unknown_id_returns_patient_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_PATIENT_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: |
          A syntactically valid but unknown patient id on a path resolves to ERR_PATIENT_NOT_FOUND
          with HTTP 404, distinct from the generic ERR_RECORD_NOT_FOUND used for the other twelve
          resource types.
        test_recipe:
          setup:
            - "An empty database apart from one payer."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "MedFirst", payer_kind: "MEDICAL" }
              as: PlatformAdmin
              captures: { payer_med_id: $.data.id }
          trigger:
            - call: "GET /patients/00000000-0000-4000-8000-000000000999"
              payload: {}
              as: ClinicCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_PATIENT_NOT_FOUND with HTTP 404"

      - name: create_patient_with_unknown_payer_returns_record_not_found
        claim_type: Parent Relationships
        grounds:
          - errors[ERR_RECORD_NOT_FOUND]
          - validations[priority=4]
          - entities.Patient.fields.medical_payer_id
        distinguishing_aspect: |
          A body foreign key that does not resolve routes to the generic ERR_RECORD_NOT_FOUND,
          because Payer is one of the twelve resource types that share that id — it is NOT
          ERR_PATIENT_NOT_FOUND even though the endpoint creates a Patient.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
          trigger:
            - call: "POST /patients"
              payload: { mrn: "MRN-778", full_name: "Orphan Olive", date_of_birth: "1980-01-01", medical_payer_id: "00000000-0000-4000-8000-000000000999" }
              as: ClinicCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_RECORD_NOT_FOUND with HTTP 404"
            - "no Patient row is created"

      - name: duplicate_provider_npi_returns_duplicate_identifier
        claim_type: Type Constraints
        grounds:
          - validations[priority=10]
          - errors[ERR_DUPLICATE_IDENTIFIER]
          - entities.Provider.fields.npi
        distinguishing_aspect: |
          npi is one of exactly four identifiers that route a collision to ERR_DUPLICATE_IDENTIFIER;
          the comparison is exact, case-sensitive string equality, so the second registration of
          1000000001 is refused with 409 even though every other field differs.
        test_recipe:
          setup:
            - "One SLEEP_PHYSICIAN already registered with npi 1000000001."
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "1000000001", full_name: "Dr Sleep", provider_type: "SLEEP_PHYSICIAN" }
              as: PlatformAdmin
              captures: { phys_id: $.data.id }
          trigger:
            - call: "POST /providers"
              payload: { npi: "1000000001", full_name: "Dr Other", provider_type: "DENTIST" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_DUPLICATE_IDENTIFIER with HTTP 409"
            - "Provider.${phys_id}.full_name == Dr Sleep unchanged"

      - name: appliance_computed_fields_are_derived_not_supplied
        claim_type: Computed Fields
        grounds:
          - entities.Appliance.fields.appliance_kind
          - entities.Appliance.fields.hcpcs_code
          - entities.Appliance.fields.patient_id
          - entities.Appliance.fields.max_protrusive_mm
        distinguishing_aspect: |
          POST /appliances accepts only lab_order_id, lot_id, serial_number, has_microrecorder and
          replaces_appliance_id; appliance_kind, hcpcs_code, patient_id and max_protrusive_mm are
          copied or derived from the lab order and its referral, and current_advancement_mm stays
          null until delivery.
        test_recipe:
          setup:
            - "An accepted CUSTOM_FABRICATED lab order with max_protrusive_mm 8.00 and a registered lot."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "MedFirst", payer_kind: "MEDICAL", prior_auth_required: false }
              as: PlatformAdmin
              captures: { payer_med_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000001", full_name: "Dr Sleep", provider_type: "SLEEP_PHYSICIAN" }
              as: PlatformAdmin
              captures: { phys_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000002", full_name: "Dr Dent", provider_type: "DENTIST", dme_supplier_number: "DME-001" }
              as: PlatformAdmin
              captures: { dent_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000003", full_name: "ACME Lab", provider_type: "DENTAL_LAB" }
              as: PlatformAdmin
              captures: { lab_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-001", full_name: "Pat One", date_of_birth: "1975-03-02", medical_payer_id: "${payer_med_id}", epworth_score: 14 }
              as: ClinicCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep-studies"
              payload: { patient_id: "${pat_id}", ordering_physician_id: "${phys_id}", modality: "HSAT", study_purpose: "DIAGNOSTIC" }
              as: SleepPhysician
              as_user_id: "${phys_id}"
              captures: { study_id: $.data.id }
            - call: "POST /sleep-studies/${study_id}/results"
              payload: { performed_on: "2026-04-10", respiratory_events: 240, recording_minutes: 480, artifact_pct: 0 }
              as: SleepPhysician
              as_user_id: "${phys_id}"
            - call: "POST /referrals"
              payload: { patient_id: "${pat_id}", referring_physician_id: "${phys_id}", treating_dentist_id: "${dent_id}", diagnostic_study_id: "${study_id}", cpap_history: "FAILURE", cpap_nights_used: 45, cpap_documented_on: "2026-03-01" }
              as: SleepPhysician
              as_user_id: "${phys_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/respond"
              payload: { decision: "ACCEPTED" }
              as: Dentist
              as_user_id: "${dent_id}"
            - call: "POST /lab-orders"
              payload: { referral_id: "${ref_id}", lab_provider_id: "${lab_id}", appliance_kind: "CUSTOM_FABRICATED", capture_method: "DIGITAL_SCAN", max_protrusive_mm: 8.0, promised_turnaround_days: 14 }
              as: Dentist
              as_user_id: "${dent_id}"
              captures: { lo_id: $.data.id }
            - call: "POST /lab-orders/${lo_id}/submit"
              payload: { promised_turnaround_days: 14 }
              as: Dentist
              as_user_id: "${dent_id}"
            - call: "POST /lab-orders/${lo_id}/ship"
              payload: { shipped_on: "2026-05-15" }
              as: LabTechnician
              as_user_id: "${lab_id}"
            - call: "POST /lab-orders/${lo_id}/receive"
              payload: { fit_outcome: "ACCEPTED" }
              as: Dentist
              as_user_id: "${dent_id}"
            - call: "POST /appliance-lots"
              payload: { manufacturer: "SomnoCorp", lot_code: "LOT-A" }
              as: PlatformAdmin
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /appliances"
              payload: { lab_order_id: "${lo_id}", lot_id: "${lot_id}", serial_number: "SN-0001", has_microrecorder: true }
              as: Dentist
              as_user_id: "${dent_id}"
              captures: { app_id: $.data.id }
          assert:
            - "Appliance.${app_id}.appliance_kind == CUSTOM_FABRICATED"
            - "Appliance.${app_id}.hcpcs_code == E0486"
            - "Appliance.${app_id}.patient_id == ${pat_id}"
            - "Appliance.${app_id}.max_protrusive_mm == 8.00"
            - "Appliance.${app_id}.current_advancement_mm == null"
            - "Appliance.${app_id}.lifecycle_status == FABRICATED"
            - "Appliance.${app_id}.device_hold_status == NONE"
            - "Appliance.${app_id}.recall_status == NOT_SCHEDULED"

      - name: adherence_download_is_an_immutable_event_row
        claim_type: Immutability
        grounds:
          - entities.AdherenceDownload
          - endpoints[GET /adherence-downloads]
        distinguishing_aspect: |
          AdherenceDownload is declared common_fields false: the row carries id and created_at only,
          no version and no updated_at, and §1.5 exposes no update or delete endpoint for it — a
          second download for the same window creates a second row rather than mutating the first.
        test_recipe:
          setup:
