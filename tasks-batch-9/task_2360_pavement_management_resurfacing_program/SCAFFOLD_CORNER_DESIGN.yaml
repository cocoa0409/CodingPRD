            - "passed_test_count == 0, failed_test_count == 0, remediation_event_count == 0, days_late_total == 0, accepted_project_count == 0."
            - "${c_ver} == 1: reading the scorecard did not mutate the Contractor row, and the row's own standing / interim_performance_score agree with the projection."

