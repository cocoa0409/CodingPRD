        grounds: ["state_machines.BedRun.CURING_to_RELEASE_READY"]
        excluded_because:
          difficulty_instance: transitive_cascade / release_strength_cascade_set_to_run_to_piece_to_project
          rationale: "The four-hop chain and its per-hop observables are asserted there."

      - name: dual_variant_calculation_produces_divergent_results
        claim_type: dual_variant_calculation
        grounds: ["calculations.cylinder_set_qualified_strength", "calculations.curing_energy_accounting"]
        excluded_because:
          difficulty_instance: dual_variant_calc / metered_vs_modeled_curing_energy
          rationale: "Both variant pairs and their divergent outputs are asserted by the two dual_variant_calc instances."

      - name: rate_threshold_trigger_flips_at_the_breakpoint
        claim_type: rate_threshold_triggers
        grounds: ["calculations.bed_run_cost_allocation"]
        excluded_because:
          difficulty_instance: combinatorial_formula / overhead_tier_keyed_on_direct_subtotal_not_total
          rationale: "The 1000000 cent tier breakpoint and the value it selects are asserted there."

  # =========================================================================
  - section: consistency_model
    instances:

      - name: cascade_effects_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.MixDesign.QUALIFIED_to_SUSPENDED
          - entities.Project.fields.held_piece_count
        distinguishing_aspect: "The consistency model is immediate: the suspend response itself already reflects the mix's new status, and a read issued immediately afterwards in the same test - with no waiting - shows the blocked run, the held piece and the incremented project counter."
        test_recipe:
          setup: ["Run R1 is SCHEDULED with one assigned PENDING piece under QUALIFIED mix M40-STD."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
