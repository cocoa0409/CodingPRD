  - rule_id: resource_temporal_overlap
    instances:
      - name: storage_bay_half_open_interval_overlap_rejected
        grounds:
          - state_machines.StorageAgreement.RESERVED_to_CHECKED_IN
          - errors[ERR_BAY_DOUBLE_BOOKED]
          - entities.StorageAgreement.fields.period_start
          - entities.StorageAgreement.fields.period_end
        distinguishing_aspect: |
          Half-open [start,end) interval semantics on the StorageBay resource: a
          second CHECKED_IN agreement on the same bay whose window strictly overlaps
          an existing CHECKED_IN window is rejected with ERR_BAY_DOUBLE_BOOKED.
          Adjacency where bookB.start == bookA.end does NOT overlap (half-open).
        test_recipe:
          setup:
            - "One StorageBay, two Units, two Customers. Agreement A [2026-01-01,2026-03-01) is CHECKED_IN. Agreement B on the same bay spans [2026-02-15,2026-04-01) (overlaps A)."
