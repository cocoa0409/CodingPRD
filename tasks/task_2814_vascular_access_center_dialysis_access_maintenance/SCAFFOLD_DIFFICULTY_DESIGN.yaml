  - rule_id: cross_entity_state_dependency
    instances:
      - name: triage_legality_depends_on_the_facility_posture_and_is_restored_by_declining_a_sibling
        grounds:
          - validations.priority_22_ERR_FACILITY_SUSPENDED
          - state_machines.DialysisFacility.ACTIVE_to_SUSPENDED
          - state_machines.DialysisFacility.SUSPENDED_to_ACTIVE
          - state_machines.Referral.INFO_REQUESTED_to_DECLINED
          - calculations.facility_partnership_score
        distinguishing_aspect: |
          Whether referral B can be triaged is decided by the state of an entity B does not
          reference: its facility's contract_status, which is itself a function of a DIFFERENT
          referral's missed_treatment_count. Declining referral A removes it from the scoring window
          and lifts the facility from SUSPENDED back to ACTIVE, so the byte-identical triage call on
          B flips from 409 to 200 with no change to B at all. The instance also captures the
          asymmetry of the recovery path: the SUSPENDED -> ACTIVE transition explicitly does NOT
          release the referrals its downward counterpart held.
        test_recipe:
          setup:
            - "one facility, one patient, one IN_USE AVG access with two in-window readings (1000 then 700 / VP 160 / recirc 12.0)"
            - "referral A created with missed_treatment_count 15, which suspends the facility on its own creation and holds itself"
            - "referral B created afterwards with missed_treatment_count 0; because the facility is already SUSPENDED there is no new posture transition, so B stays SUBMITTED"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Northgate Dialysis", facility_code: "NGT-02" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0016", full_name: "Pia Rosales", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
              as: CenterAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVG", laterality: "LEFT", site: "FOREARM", placed_on: "2026-05-01" }
              as: AccessCoordinator
              captures: { acc_id: $.data.id }
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-20T08:00:00Z", access_flow_ml_min: 1000, venous_pressure_mmhg: 120, recirculation_pct: 4.0, kind: "ROUTINE" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-28T08:00:00Z", access_flow_ml_min: 700, venous_pressure_mmhg: 160, recirculation_pct: 12.0, kind: "URGENT" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "chronic non-adherence, many missed sessions", missed_treatment_count: 15 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { refa_id: $.data.id }
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "STENOSIS", clinical_narrative: "clean urgent referral", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { refb_id: $.data.id }
          trigger:
            - call: "POST /referrals/${refb_id}/triage"
              payload: {}
              as: AccessCoordinator
            - call: "POST /referrals/${refa_id}/decline"
              payload: { decline_reason: "facility withdrew the request" }
              as: AccessCoordinator
            - call: "POST /referrals/${refb_id}/triage"
              payload: {}
              as: AccessCoordinator
          assert:
            - "on creation of referral A the facility went ACTIVE -> SUSPENDED: partnership_score == 40, adjusted_missed_count_window == 15, grace_credit_window == 0 (floor(1 * 0.10) against the seeded SILVER tier), partnership_tier == WATCH"
            - "referral A held itself: Referral.${refa_id}.status == INFO_REQUESTED with hold_reason == FACILITY_POSTURE_HOLD and info_request_count == 1"
            - "creating referral B fired no cascade because the facility was already SUSPENDED: Referral.${refb_id}.status == SUBMITTED with hold_reason == null, and the rescore stayed at 40 (volume 2, raw 15, WATCH grace rate 0.00)"
            - "the first triage of B returns 409 ERR_FACILITY_SUSPENDED even though B itself is a perfectly valid SUBMITTED referral with a qualifying reading"
            - "declining A returns 200 with Referral.${refa_id}.status == DECLINED and decline_reason set, and A retains hold_reason == FACILITY_POSTURE_HOLD as audit history"
            - "the decline rescore excludes DECLINED referrals: referral_volume_window == 1, raw_missed_count_window == 0, partnership_score == 100, partnership_tier == GOLD, contract_status == ACTIVE"
            - "the SUSPENDED -> ACTIVE transition released nothing on its own: no held referral was moved back, which is why the test had to decline A rather than wait"
