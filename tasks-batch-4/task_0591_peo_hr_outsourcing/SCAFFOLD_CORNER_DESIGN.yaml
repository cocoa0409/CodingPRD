        distinguishing_aspect: "The first packet creation bumps WorksiteEmployee.version from 1 to 2; a second creation still carrying expected_employee_version 1 is refused with HTTP 412 ERR_STALE_EMPLOYEE_VERSION, and the first packet is NOT voided."
