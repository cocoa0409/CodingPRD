  - rule_id: boundary_precision_check
    instances:
      - name: course_seat_exact_capacity_boundary
        grounds:
          - entities.TrainingCourse.fields.seats_taken
          - entities.TrainingCourse.fields.capacity
          - state_machines.TrainingEnrollment
        distinguishing_aspect: |
          Seat-count boundary on POST enrollments: with capacity == 2 the second
          enrollment (seats_taken would become exactly 2) still lands ENROLLED,
          and only the third (seats_taken == capacity) lands WAITLISTED with
          waitlist_position 1 — the admission predicate is seats_taken < capacity,
          not <=.
        test_recipe:
          setup:
            - "Instructor-certified volunteer instr; TrainingCourse capacity=2, grants CHAINSAW, starts 2026-09-20T09:00:00Z"
            - "Three plain volunteers e1, e2, e3 registered"
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Inez Struct", email: "inez@x.org", home_region: "TX-GULF", skills: [CHAINSAW], instructor_certified: true }
              as: SystemAdmin
              captures: { instr: $.data.id }
            - call: "POST /vdr/training-courses"
              payload: { title: "Chainsaw Ops 101", grants_cert_kind: CHAINSAW, capacity: 2, starts_at: "2026-09-20T09:00:00Z", lead_instructor_volunteer_id: "${instr}" }
              as: TrainingDirector
              captures: { course: $.data.id }
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Enrol One", email: "e1@x.org", home_region: "TX-GULF", skills: [DEBRIS] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Enrol Two", email: "e2@x.org", home_region: "TX-GULF", skills: [DEBRIS] }
              as: SystemAdmin
              captures: { v2: $.data.id }
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Enrol Three", email: "e3@x.org", home_region: "TX-GULF", skills: [DEBRIS] }
              as: SystemAdmin
              captures: { v3: $.data.id }
          trigger:
            - call: "POST /vdr/training-courses/${course}/enrollments"
              payload: { volunteer_id: "${v1}" }
              as: TrainingDirector
              captures: { e1: $.data.id }
            - call: "POST /vdr/training-courses/${course}/enrollments"
              payload: { volunteer_id: "${v2}" }
              as: TrainingDirector
              captures: { e2: $.data.id }
            - call: "POST /vdr/training-courses/${course}/enrollments"
              payload: { volunteer_id: "${v3}" }
              as: TrainingDirector
              captures: { e3: $.data.id }
          assert:
            - "TrainingEnrollment.${e1}.status == ENROLLED"
            - "TrainingEnrollment.${e2}.status == ENROLLED (seat count hits capacity exactly and is still admitted)"
            - "TrainingEnrollment.${e3}.status == WAITLISTED and waitlist_position == 1"
            - "TrainingCourse.${course}.seats_taken == 2"

      - name: cert_expiry_strictly_greater_boundary
        grounds:
          - entities.Certification.fields.expires_at
          - state_machines.Certification.VERIFIED_to_EXPIRED
        distinguishing_aspect: |
          Timestamp boundary on the ops-run expiry sweep via a different metric
          and endpoint than the seat boundary: at current_utc == expires_at the
          cert stays VERIFIED (expiry requires strictly greater), and one second
          later the same sweep flips it to EXPIRED.
        test_recipe:
          setup:
            - "Volunteer with a single CHAINSAW cert, VERIFIED, expires_at 2026-09-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/volunteers"
              payload: { full_name: "Cy Daly", email: "cy@x.org", home_region: "TX-GULF", skills: [CHAINSAW] }
              as: SystemAdmin
              captures: { v1: $.data.id }
            - call: "POST /vdr/volunteers/${v1}/certifications"
              payload: { kind: CHAINSAW, issued_at: "2026-09-01T00:00:00Z", expires_at: "2026-09-05T00:00:00Z" }
              as: TrainingDirector
              captures: { c1: $.data.id }
            - call: "PATCH /vdr/certifications/${c1}"
              payload: { status: VERIFIED }
              as: SafetyOfficer
          trigger:
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /vdr/_ops/run"
              payload: {}
              as: SystemAdmin
            - call: "POST /vdr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:01Z" }
              as: SystemAdmin
            - call: "POST /vdr/_ops/run"
              payload: {}
              as: SystemAdmin
          assert:
            - "After ops run at exactly expires_at: Certification.${c1}.status == VERIFIED"
            - "After ops run at expires_at + 1s: Certification.${c1}.status == EXPIRED"

