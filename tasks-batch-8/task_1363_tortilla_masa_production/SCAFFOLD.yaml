# =============================================================================
# Task 1363: Tortilla & Masa Production — scaffold seed tables
# =============================================================================

scenario: |
  Tortilla & Masa Production (tortilla manufacturer): corn/masa preparation
  (nixtamalization) & yield, line scheduling by product size & count, packaging
  count accuracy & weight control, shelf-life & preservative system, DSD route &
  Hispanic-market channel, foodservice vs retail pack, changeover & allergen
  control, seasonal demand spikes

domain_name: tortilla-masa-production
api_prefix: /plant

# =============================================================================
# Complexity Profile (§0.1–§0.4) — Expert tier, all knobs at maximum
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite line-time windows, masa kg, sealed cases, route capacity, seasonal allotments competed for
  secondary_archetype: compliance_audit      # allergen changeover control, segregation of duties, QC holds, shelf-life gating
  complexity_layers:
    - optimistic_concurrency                 # OCC on ProductionLine.version (run create) and Route.version (stop create)
    - cascading_side_effects                 # batch quarantine -> allocation release -> run demotion -> changeover cancel; window activation -> allotment -> stop shorting -> pack restock
    - dual_variant_calculation               # theoretical vs actual masa yield; AVERAGE_WEIGHT vs COUNT_VERIFY pack verification
    - derived_field_reconciliation           # masa_available_kg, cases_available, committed_cases, line posture recomputed on every source mutation
  entity_topology: graph                     # BatchAllocation is a many-to-many junction (NixtamalBatch x ProductionRun); RouteStop joins Route x CustomerAccount x PackOrder
  state_machine_shape: parallel              # ProductionRun carries production_status x qc_status; NixtamalBatch and ChangeoverRecord are cyclic; PackOrder branches
  relationship_patterns:
    - one_to_many
    - many_to_many                           # BatchAllocation, RouteStop junctions
    - cross_aggregate                        # ChangeoverRecord references Product pair + ProductionRun across aggregates
  role_model: segregation_of_duties          # changeover performer (SanitationTech) can never verify own work; QualityInspector gate
  consistency_model: immediate               # every mutation + cascade visible in the same request response

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: IngredientLot
    parent: null
    common_fields: true
    fields:
      - { name: lot_code, type: string, source: input, description: "Supplier lot code; unique across IngredientLot" }
      - { name: corn_variety, type: enum, source: input, description: "WHITE_CORN | YELLOW_CORN | BLUE_CORN" }
      - { name: received_kg, type: number, source: input, description: "Gross received weight in kg, > 0" }
      - { name: moisture_pct, type: number, source: input, description: "Measured kernel moisture percent at receipt, 0 < moisture_pct < 30" }
      - { name: drawn_kg, type: number, source: computed, description: "Sum of corn_kg over all non-REJECTED NixtamalBatch rows with ingredient_lot_id = this lot" }
      - { name: available_kg, type: number, source: computed, description: "received_kg - drawn_kg; never negative" }
      - { name: lot_status, type: enum, source: system, description: "RECEIVED -> CONDITIONED -> DEPLETED; REJECTED terminal" }

  - name: NixtamalBatch
    parent: null
    common_fields: true
    fields:
      - { name: ingredient_lot_id, type: string, source: input, description: "FK -> IngredientLot.id; corn source lot" }
      - { name: corn_kg, type: number, source: input, description: "Corn drawn from the lot for this batch, > 0" }
      - { name: lime_pct, type: number, source: input, description: "Lime solution percent, 0.1..2.0" }
      - { name: cook_minutes, type: integer, source: input, description: "Required cook duration before steeping may start, >= 30" }
      - { name: steep_target_hours, type: integer, source: input, description: "Required steep duration before evaluation, >= 8" }
      - { name: cook_started_at, type: datetime, source: system, description: "Logical clock timestamp when start-cook succeeded" }
      - { name: steep_started_at, type: datetime, source: system, description: "Logical clock timestamp when start-steep succeeded" }
      - { name: recook_count, type: integer, source: computed, description: "Number of EVALUATION -> COOKING recook loops; starts 0" }
      - { name: theoretical_masa_kg, type: number, source: computed, description: "Provisional yield: corn_kg x variety factor; computed at creation" }
      - { name: actual_masa_kg, type: number, source: computed, description: "Final moisture-corrected yield computed at mill; null until MASA_AVAILABLE" }
      - { name: masa_wasted_kg, type: number, source: system, description: "Waste recorded at mill; informational, already netted inside actual_masa_kg" }
      - { name: masa_available_kg, type: number, source: computed, description: "actual_masa_kg - sum(allocated_kg over BatchAllocation in {RESERVED, CONSUMED}); 0 until MASA_AVAILABLE" }
      - { name: yield_variance_pct, type: number, source: computed, description: "(actual_masa_kg - theoretical_masa_kg) / theoretical_masa_kg * 100, 2dp; null until mill" }
      - { name: batch_status, type: enum, source: system, description: "PLANNED -> COOKING -> STEEPING -> MILLING -> MASA_AVAILABLE -> DEPLETED; STEEPING -> COOKING recook cycle; QUARANTINED <-> MASA_AVAILABLE; REJECTED terminal" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku_code, type: string, source: input, description: "Unique SKU code" }
      - { name: diameter_in, type: enum, source: input, description: "D6 | D8 | D10 | D12 (tortilla diameter inches)" }
      - { name: count_per_pack, type: integer, source: input, description: "Tortillas per retail/foodservice pack, > 0" }
      - { name: packs_per_case, type: integer, source: input, description: "Packs per shipping case, > 0" }
      - { name: unit_weight_g, type: number, source: input, description: "Target weight of one tortilla in grams, > 0" }
      - { name: channel, type: enum, source: input, description: "RETAIL | FOODSERVICE" }
      - { name: preservative_system, type: enum, source: input, description: "NONE | PROPIONATE | FUMARIC_ACID" }
      - { name: shelf_life_days, type: integer, source: computed, description: "Derived from preservative_system: NONE=5, PROPIONATE=20, FUMARIC_ACID=45" }
      - { name: allergen_class, type: enum, source: input, description: "CORN_ONLY (rank 0) | WHEAT_FLOUR (rank 1) | SOY_BLENDED (rank 2)" }
      - { name: weight_tolerance_pct, type: number, source: input, default: 2.0, description: "Allowed avg pack weight deviation percent, > 0" }
      - { name: declared_pack_net_g, type: number, source: computed, description: "round_half_up(unit_weight_g x count_per_pack, 1dp)" }
      - { name: declared_case_net_g, type: number, source: computed, description: "round_half_up(declared_pack_net_g x packs_per_case, 1dp); rounding order pinned per-pack-first" }
      - { name: product_status, type: enum, source: system, description: "ACTIVE -> DISCONTINUED terminal" }

  - name: ProductionLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Unique line code" }
      - { name: allergen_zone, type: enum, source: input, description: "DEDICATED_CORN | SHARED" }
      - { name: cases_per_hour, type: integer, source: input, description: "Rated line throughput, > 0" }
      - { name: current_product_id, type: string, source: system, description: "Product of the most recently started non-CANCELLED run on this line; null until first start" }
      - { name: line_posture, type: enum, source: computed, description: "RUNNING if any run IN_PROGRESS; else CHANGEOVER_PENDING if any ChangeoverRecord in {REQUIRED, IN_PROGRESS, FAILED}; else AVAILABLE" }
      - { name: line_status, type: enum, source: system, description: "ACTIVE | DOWN" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; SKU being run" }
      - { name: line_id, type: string, source: input, description: "FK -> ProductionLine.id; scheduled line" }
      - { name: planned_cases, type: integer, source: input, description: "Planned case output, > 0" }
      - { name: start_at, type: datetime, source: input, description: "Planned window start (half-open, inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Planned window end (half-open, exclusive); must be > start_at" }
      - { name: masa_required_kg, type: number, source: computed, description: "round(planned_cases x packs_per_case x count_per_pack x unit_weight_g / 1000 x MASA_LOSS_FACTOR, 2)" }
      - { name: masa_reserved_kg, type: number, source: computed, description: "Sum of allocated_kg over this run's BatchAllocation in RESERVED" }
      - { name: produced_cases, type: integer, source: computed, description: "Sum of cases_packed over child PackOrder in SEALED; finalized at completion" }
      - { name: production_status, type: enum, source: system, description: "PLANNED -> SCHEDULED -> IN_PROGRESS -> COMPLETED; CANCELLED terminal from PLANNED/SCHEDULED/IN_PROGRESS; SCHEDULED auto-demotes to PLANNED on masa coverage loss" }
      - { name: qc_status, type: enum, source: system, description: "PENDING -> ON_HOLD -> PASSED; independent parallel dimension" }

  - name: BatchAllocation
    parent: null
    common_fields: true
    fields:
      - { name: nixtamal_batch_id, type: string, source: input, description: "FK -> NixtamalBatch.id; masa source" }
      - { name: production_run_id, type: string, source: input, description: "FK -> ProductionRun.id; masa consumer" }
      - { name: allocated_kg, type: number, source: input, description: "Reserved masa kg, > 0, <= batch masa_available_kg at creation" }
      - { name: allocation_status, type: enum, source: system, description: "RESERVED -> CONSUMED | RELEASED; terminal CONSUMED/RELEASED" }

  - name: ChangeoverRecord
    parent: null
    common_fields: true
    fields:
      - { name: line_id, type: string, source: input, description: "FK -> ProductionLine.id; line being changed over" }
      - { name: from_product_id, type: string, source: input, description: "FK -> Product.id; previous product" }
      - { name: to_product_id, type: string, source: input, description: "FK -> Product.id; next product" }
      - { name: production_run_id, type: string, source: system, description: "FK -> ProductionRun.id; run whose start this changeover gates (null for manual records)" }
      - { name: required_level, type: enum, source: computed, description: "FLUSH | WET_WASH | FULL_SANITATION; from allergen-rank/diameter matrix" }
      - { name: required_downtime_min, type: integer, source: computed, description: "Base minutes by level (30/60/120) + 15 when diameter changes and level != FULL_SANITATION" }
      - { name: performed_by, type: string, source: system, description: "X-User-ID of the SanitationTech who called begin" }
      - { name: fail_count, type: integer, source: computed, description: "Number of IN_PROGRESS -> FAILED rework loops; starts 0" }
      - { name: changeover_status, type: enum, source: system, description: "REQUIRED -> IN_PROGRESS -> VERIFIED | FAILED; FAILED -> IN_PROGRESS rework loop; CANCELLED terminal when gated run demotes/cancels" }

  - name: PackOrder
    parent: null
    common_fields: true
    fields:
      - { name: production_run_id, type: string, source: input, description: "FK -> ProductionRun.id; parent run" }
      - { name: cases_planned, type: integer, source: input, description: "Cases to pack, > 0" }
      - { name: verification_method, type: enum, source: input, description: "AVERAGE_WEIGHT | COUNT_VERIFY; immutable after creation" }
      - { name: cases_packed, type: integer, source: system, description: "Packed case count recorded at weight-check" }
      - { name: avg_pack_weight_g, type: number, source: computed, description: "round_half_up(mean(sample_weights_g), 1dp); null until first passing/failing check" }
      - { name: count_accuracy_pct, type: number, source: computed, description: "Share of sampled packs with exact count_per_pack pieces, 2dp; COUNT_VERIFY only" }
      - { name: cases_available, type: integer, source: computed, description: "cases_packed - sum(allocated_cases over RouteStop in {ALLOCATED, DELIVERED}); 0 until SEALED" }
      - { name: sealed_at, type: datetime, source: system, description: "Logical clock timestamp at seal" }
      - { name: expires_on, type: string, source: computed, description: "ISO date: date(sealed_at) + product.shelf_life_days" }
      - { name: pack_status, type: enum, source: system, description: "OPEN -> PACKING -> PASSED -> SEALED; weight-check failure loop PACKING -> HOLD -> PASSED re-test; REJECTED / CANCELLED terminal" }

  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Customer display name" }
      - { name: channel, type: enum, source: input, description: "RETAIL_GROCERY | TORTILLERIA | FOODSERVICE_DIST" }
      - { name: region, type: string, source: input, description: "Delivery region code (e.g. TX-SOUTH)" }
      - { name: base_weekly_cases, type: integer, source: input, description: "Baseline weekly case demand, >= 0" }
      - { name: priority_tier, type: enum, source: input, description: "A | B | C; A served first in seasonal waterfall" }
      - { name: min_shelf_life_pct, type: integer, source: input, description: "Minimum percent of shelf life that must remain on route_date, 1..100" }
      - { name: credit_standing, type: enum, source: system, description: "GOOD | HOLD; GOOD at creation, mutated via set-credit-standing" }

  - name: SeasonalWindow
    parent: null
    common_fields: true
    fields:
      - { name: window_name, type: string, source: input, description: "Season label (e.g. CINCO_DE_MAYO, NAVIDAD_TAMALES)" }
      - { name: starts_on, type: string, source: input, description: "ISO date, inclusive window start" }
      - { name: ends_on, type: string, source: input, description: "ISO date, inclusive window end; >= starts_on" }
      - { name: demand_multiplier, type: number, source: input, description: "Demand spike multiplier, >= 1.0" }
      - { name: forecast_total_cases, type: integer, source: input, description: "Total case pool available to the window, >= 0" }
      - { name: is_strict, type: boolean, source: computed, description: "true when demand_multiplier >= SPIKE_MULTIPLIER_THRESHOLD (1.5); strict windows hard-cap stops by allotment" }
      - { name: window_status, type: enum, source: system, description: "SCHEDULED -> ACTIVE -> CLOSED terminal" }

  - name: SeasonalAllotment
    parent: null
    common_fields: true
    fields:
      - { name: seasonal_window_id, type: string, source: system, description: "FK -> SeasonalWindow.id; owning window" }
      - { name: customer_id, type: string, source: system, description: "FK -> CustomerAccount.id; recipient" }
      - { name: allotted_cases, type: integer, source: computed, description: "Waterfall allotment computed at window activation (foodservice first, then retail tiers A>B>C, created_at ASC tie-break)" }
      - { name: consumed_cases, type: integer, source: computed, description: "Cases consumed by ALLOCATED/DELIVERED stops on routes dated inside the window; refunded on short" }
      - { name: remaining_cases, type: integer, source: computed, description: "allotted_cases - consumed_cases" }
      - { name: allotment_status, type: enum, source: system, description: "ACTIVE -> CLOSED (when parent window closes)" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Unique route code" }
      - { name: route_date, type: string, source: input, description: "ISO delivery date" }
      - { name: region, type: string, source: input, description: "Delivery region code" }
      - { name: vehicle_capacity_cases, type: integer, source: input, description: "Truck capacity in cases, > 0" }
      - { name: committed_cases, type: integer, source: computed, description: "Sum of allocated_cases over stops in {ALLOCATED, DELIVERED}" }
      - { name: open_cases, type: integer, source: computed, description: "vehicle_capacity_cases - committed_cases" }
      - { name: route_status, type: enum, source: system, description: "PLANNED -> DISPATCHED -> COMPLETED; CANCELLED terminal from PLANNED" }

  - name: RouteStop
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; parent route (path-bound)" }
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; delivery target" }
      - { name: pack_order_id, type: string, source: input, description: "FK -> PackOrder.id; sealed stock source" }
      - { name: requested_cases, type: integer, source: input, description: "Cases requested, > 0" }
      - { name: allocated_cases, type: integer, source: computed, description: "Equals requested_cases when all gates pass (allocation is atomic; no partial fills)" }
      - { name: delivered_cases, type: integer, source: system, description: "Cases actually delivered; set at deliver" }
      - { name: shortage_cases, type: integer, source: computed, description: "allocated_cases - delivered_cases at delivery; 0 until then" }
      - { name: stop_status, type: enum, source: system, description: "ALLOCATED -> DELIVERED | SHORTED; terminal DELIVERED/SHORTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: IngredientLot
    initial_state: RECEIVED
    terminal_states: [DEPLETED, REJECTED]
    transitions:
      - from: RECEIVED
        to: CONDITIONED
        trigger: "POST /plant/ingredient-lots/{id}/condition"
        actor: MillerOperator
        preconditions:
          - "lot_status == RECEIVED (ERR_LOT_INVALID_STATE)"
        side_effects: []
      - from: CONDITIONED
        to: DEPLETED
        trigger: "system (automatic when available_kg reaches 0 after a batch draw)"
        actor: system
        preconditions:
          - "available_kg == 0"
        side_effects: []
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /plant/ingredient-lots/{id}/condition with decision=REJECT"
        actor: MillerOperator
        preconditions:
          - "lot_status == RECEIVED (ERR_LOT_INVALID_STATE)"
        side_effects: []

  - entity: NixtamalBatch
    initial_state: PLANNED
    terminal_states: [DEPLETED, REJECTED]
    transitions:
      - from: PLANNED
        to: COOKING
        trigger: "POST /plant/nixtamal-batches/{id}/start-cook"
        actor: MillerOperator
        preconditions:
          - "batch_status == PLANNED (ERR_BATCH_INVALID_STATE)"
          - "ingredient lot lot_status == CONDITIONED (ERR_LOT_INVALID_STATE)"
        side_effects:
          - "cook_started_at = logical clock now"
      - from: COOKING
        to: STEEPING
        trigger: "POST /plant/nixtamal-batches/{id}/start-steep"
        actor: MillerOperator
        preconditions:
          - "batch_status == COOKING (ERR_BATCH_INVALID_STATE)"
          - "clock now >= cook_started_at + cook_minutes (ERR_COOK_INCOMPLETE)"
        side_effects:
          - "steep_started_at = logical clock now"
      - from: STEEPING
        to: MILLING
        trigger: "POST /plant/nixtamal-batches/{id}/evaluate (decision=PASS)"
        actor: QualityInspector
        preconditions:
          - "batch_status == STEEPING (ERR_BATCH_INVALID_STATE)"
          - "clock now >= steep_started_at + steep_target_hours (ERR_STEEP_INCOMPLETE)"
        side_effects: []
      - from: STEEPING
        to: COOKING
        trigger: "POST /plant/nixtamal-batches/{id}/evaluate (decision=RECOOK)"
        actor: QualityInspector
        preconditions:
          - "batch_status == STEEPING (ERR_BATCH_INVALID_STATE)"
          - "clock now >= steep_started_at + steep_target_hours (ERR_STEEP_INCOMPLETE)"
        side_effects:
          - "recook_count += 1"
          - "cook_started_at = logical clock now (steep clock resets on the recook loop)"
      - from: STEEPING
        to: REJECTED
        trigger: "POST /plant/nixtamal-batches/{id}/evaluate (decision=REJECT)"
        actor: QualityInspector
        preconditions:
          - "batch_status == STEEPING (ERR_BATCH_INVALID_STATE)"
          - "clock now >= steep_started_at + steep_target_hours (ERR_STEEP_INCOMPLETE)"
        side_effects: []
      - from: MILLING
        to: MASA_AVAILABLE
        trigger: "POST /plant/nixtamal-batches/{id}/mill"
        actor: MillerOperator
        preconditions:
          - "batch_status == MILLING (ERR_BATCH_INVALID_STATE)"
        side_effects:
          - "actual_masa_kg computed (actual_masa_yield calculation)"
          - "masa_available_kg = actual_masa_kg"
          - "yield_variance_pct computed"
      - from: MASA_AVAILABLE
        to: QUARANTINED
        trigger: "POST /plant/nixtamal-batches/{id}/quarantine"
        actor: QualityInspector
        preconditions:
          - "batch_status == MASA_AVAILABLE (ERR_BATCH_INVALID_STATE)"
        side_effects:
          - "link 1: every BatchAllocation of this batch in RESERVED -> RELEASED (masa_available_kg restored per release)"
          - "link 2: each affected run's masa_reserved_kg recomputed; any run in SCHEDULED whose masa_reserved_kg < masa_required_kg demotes SCHEDULED -> PLANNED"
          - "link 3: each demoted run's ChangeoverRecord in {REQUIRED, IN_PROGRESS, FAILED} -> CANCELLED; owning line line_posture recomputed"
      - from: QUARANTINED
        to: MASA_AVAILABLE
        trigger: "POST /plant/nixtamal-batches/{id}/release-quarantine"
        actor: QualityInspector
        preconditions:
          - "batch_status == QUARANTINED (ERR_BATCH_INVALID_STATE)"
        side_effects: []
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /plant/nixtamal-batches/{id}/evaluate (decision=REJECT from QUARANTINED)"
        actor: QualityInspector
        preconditions:
          - "batch_status == QUARANTINED (ERR_BATCH_INVALID_STATE)"
        side_effects:
          - "same release/demote/changeover-cancel cascade as quarantine (idempotent: already released)"
      - from: MASA_AVAILABLE
        to: DEPLETED
        trigger: "system (automatic when masa_available_kg reaches 0, whether by allocation reserve or consume)"
        actor: system
        preconditions:
          - "masa_available_kg == 0 AND actual_masa_kg > 0"
        side_effects: []

  - entity: Product
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /plant/products/{id}/discontinue"
        actor: PlantManager
        preconditions:
          - "product_status == ACTIVE (ERR_PRODUCT_DISCONTINUED)"
          - "no ProductionRun with product_id = this product in {PLANNED, SCHEDULED, IN_PROGRESS} (ERR_PRODUCT_IN_USE)"
        side_effects: []

  - entity: ProductionLine
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DOWN
        trigger: "POST /plant/lines/{id}/set-status (line_status=DOWN)"
        actor: PlantManager
        preconditions:
          - "no run on this line in IN_PROGRESS (ERR_RUN_INVALID_STATE)"
        side_effects: []
      - from: DOWN
        to: ACTIVE
        trigger: "POST /plant/lines/{id}/set-status (line_status=ACTIVE)"
        actor: PlantManager
        preconditions: []
        side_effects: []
    note: "line_posture is a computed gate (AVAILABLE/RUNNING/CHANGEOVER_PENDING), not a stored state; DOWN blocks new run creation"

  - entity: ProductionRun
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    parallel_dimensions: [production_status, qc_status]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /plant/runs/{id}/schedule"
        actor: LineScheduler
        preconditions:
          - "production_status == PLANNED (ERR_RUN_INVALID_STATE)"
        side_effects: []
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /plant/runs/{id}/start"
        actor: LineScheduler
        preconditions:
          - "production_status == SCHEDULED (ERR_RUN_INVALID_STATE)"
          - "ChangeoverRecord with production_run_id = this run, when one exists, must be VERIFIED (ERR_CHANGEOVER_NOT_VERIFIED)"
          - "masa coverage: sum(allocated_kg over this run's RESERVED BatchAllocation) >= masa_required_kg (ERR_MASA_INSUFFICIENT)"
        side_effects:
          - "every RESERVED BatchAllocation of this run -> CONSUMED"
          - "line.current_product_id = this run's product_id; line.version += 1"
          - "line_posture recomputed (becomes RUNNING)"
      - from: SCHEDULED
        to: PLANNED
        trigger: "system (automatic demotion when masa coverage is lost: quarantine/release cascade leaves masa_reserved_kg < masa_required_kg)"
        actor: system
        preconditions:
          - "production_status == SCHEDULED AND masa_reserved_kg < masa_required_kg"
        side_effects:
          - "ChangeoverRecord gating this run, if in {REQUIRED, IN_PROGRESS, FAILED}, -> CANCELLED"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /plant/runs/{id}/complete"
        actor: LineScheduler
        preconditions:
          - "production_status == IN_PROGRESS (ERR_RUN_INVALID_STATE)"
          - "every child PackOrder in terminal state {SEALED, REJECTED, CANCELLED} (ERR_UNRESOLVED_PACK_ORDERS)"
          - "produced_cases >= ceil(planned_cases x 0.95) (ERR_RUN_CASE_SHORTFALL)"
        side_effects:
          - "produced_cases finalized = sum(cases_packed over SEALED PackOrder)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /plant/runs/{id}/cancel"
        actor: LineScheduler
        preconditions:
          - "production_status in {PLANNED, SCHEDULED, IN_PROGRESS} (ERR_RUN_INVALID_STATE)"
        side_effects:
          - "every RESERVED BatchAllocation of this run -> RELEASED (batch masa_available_kg restored)"
          - "every non-terminal child PackOrder -> CANCELLED"
          - "gating ChangeoverRecord in {REQUIRED, IN_PROGRESS, FAILED} -> CANCELLED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /plant/runs/{id}/cancel"
        actor: LineScheduler
        preconditions:
          - "production_status in {PLANNED, SCHEDULED, IN_PROGRESS} (ERR_RUN_INVALID_STATE)"
        side_effects:
          - "same cascade as PLANNED -> CANCELLED"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /plant/runs/{id}/cancel"
        actor: LineScheduler
        preconditions:
          - "production_status in {PLANNED, SCHEDULED, IN_PROGRESS} (ERR_RUN_INVALID_STATE)"
        side_effects:
          - "same cascade as PLANNED -> CANCELLED (CONSUMED allocations are NOT reversed)"
      - from: "*qc:PENDING"
        to: "*qc:ON_HOLD"
        trigger: "POST /plant/runs/{id}/qc-hold"
        actor: QualityInspector
        preconditions:
          - "qc_status == PENDING (ERR_RUN_INVALID_STATE)"
          - "production_status not in {COMPLETED, CANCELLED} (ERR_RUN_INVALID_STATE)"
        side_effects: []
      - from: "*qc:ON_HOLD"
        to: "*qc:PASSED"
        trigger: "POST /plant/runs/{id}/qc-release"
        actor: QualityInspector
        preconditions:
          - "qc_status == ON_HOLD (ERR_RUN_INVALID_STATE)"
        side_effects: []

  - entity: BatchAllocation
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "POST /plant/allocations/{id}/consume, or system cascade on run start"
        actor: LineScheduler
        preconditions:
          - "allocation_status == RESERVED (ERR_ALLOCATION_INVALID_STATE)"
          - "linked run production_status in {SCHEDULED, IN_PROGRESS} (ERR_RUN_INVALID_STATE)"
        side_effects: []
      - from: RESERVED
        to: RELEASED
        trigger: "POST /plant/allocations/{id}/release, or system cascade (batch quarantine / run cancel)"
        actor: LineScheduler
        preconditions:
          - "allocation_status == RESERVED (ERR_ALLOCATION_INVALID_STATE)"
        side_effects:
          - "batch masa_available_kg += allocated_kg (invariant: actual_masa_kg = masa_available_kg + active allocations)"
          - "run masa_reserved_kg recomputed; SCHEDULED run losing coverage demotes to PLANNED and cancels its gating changeover"

  - entity: ChangeoverRecord
    initial_state: REQUIRED
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: REQUIRED
        to: IN_PROGRESS
        trigger: "POST /plant/changeovers/{id}/begin"
        actor: SanitationTech
        preconditions:
          - "changeover_status in {REQUIRED, FAILED} (ERR_CHANGEOVER_INVALID_STATE)"
        side_effects:
          - "performed_by = X-User-ID"
      - from: FAILED
        to: IN_PROGRESS
        trigger: "POST /plant/changeovers/{id}/begin (rework loop)"
        actor: SanitationTech
        preconditions:
          - "changeover_status in {REQUIRED, FAILED} (ERR_CHANGEOVER_INVALID_STATE)"
        side_effects:
          - "performed_by = X-User-ID"
      - from: IN_PROGRESS
        to: VERIFIED
        trigger: "POST /plant/changeovers/{id}/verify"
        actor: QualityInspector
        preconditions:
          - "changeover_status == IN_PROGRESS (ERR_CHANGEOVER_INVALID_STATE)"
          - "verifier X-User-ID != performed_by (ERR_SOD_VIOLATION)"
        side_effects:
          - "owning line line_posture recomputed"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /plant/changeovers/{id}/fail"
        actor: QualityInspector
        preconditions:
          - "changeover_status == IN_PROGRESS (ERR_CHANGEOVER_INVALID_STATE)"
          - "failing inspector X-User-ID != performed_by (ERR_SOD_VIOLATION)"
        side_effects:
          - "fail_count += 1"
      - from: REQUIRED
        to: CANCELLED
        trigger: "system (gated run cancelled or demoted)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (gated run cancelled or demoted)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FAILED
        to: CANCELLED
        trigger: "system (gated run cancelled or demoted)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PackOrder
    initial_state: OPEN
    terminal_states: [SEALED, REJECTED, CANCELLED]
    transitions:
      - from: OPEN
        to: PACKING
        trigger: "POST /plant/pack-orders/{id}/start-packing"
        actor: PackagingLead
        preconditions:
          - "pack_status == OPEN (ERR_PACK_INVALID_STATE)"
          - "parent run production_status == IN_PROGRESS (ERR_RUN_INVALID_STATE)"
        side_effects: []
      - from: PACKING
        to: PASSED
        trigger: "POST /plant/pack-orders/{id}/weight-check (pass outcome)"
        actor: PackagingLead
        preconditions:
          - "pack_status in {PACKING, HOLD} (ERR_PACK_INVALID_STATE)"
          - "sample cardinality >= SAMPLE_MIN (3) (ERR_WEIGHT_SAMPLE_INVALID)"
        side_effects:
          - "cases_packed, avg_pack_weight_g / count_accuracy_pct computed per verification_method"
      - from: PACKING
        to: HOLD
        trigger: "POST /plant/pack-orders/{id}/weight-check (fail outcome)"
        actor: PackagingLead
        preconditions:
          - "pack_status in {PACKING, HOLD} (ERR_PACK_INVALID_STATE)"
          - "sample cardinality >= SAMPLE_MIN (3) (ERR_WEIGHT_SAMPLE_INVALID)"
        side_effects:
          - "failed metrics still recorded (avg_pack_weight_g / count_accuracy_pct updated)"
      - from: HOLD
        to: PASSED
        trigger: "POST /plant/pack-orders/{id}/weight-check (re-test pass; rework loop)"
        actor: PackagingLead
        preconditions:
          - "pack_status in {PACKING, HOLD} (ERR_PACK_INVALID_STATE)"
        side_effects: []
      - from: HOLD
        to: REJECTED
        trigger: "POST /plant/pack-orders/{id}/reject"
        actor: PackagingLead
        preconditions:
          - "pack_status in {OPEN, PACKING, HOLD} (ERR_PACK_INVALID_STATE)"
        side_effects: []
      - from: PASSED
        to: SEALED
        trigger: "POST /plant/pack-orders/{id}/seal"
        actor: PackagingLead
        preconditions:
          - "pack_status == PASSED (ERR_PACK_INVALID_STATE)"
          - "parent run qc_status != ON_HOLD (ERR_QC_HOLD_ACTIVE)"
        side_effects:
          - "sealed_at = logical clock now; expires_on = date(sealed_at) + product.shelf_life_days"
          - "cases_available = cases_packed"
      - from: OPEN
        to: CANCELLED
        trigger: "system (cascade from parent run cancellation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PACKING
        to: CANCELLED
        trigger: "system (cascade from parent run cancellation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: HOLD
        to: CANCELLED
        trigger: "system (cascade from parent run cancellation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PASSED
        to: CANCELLED
        trigger: "system (cascade from parent run cancellation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SeasonalWindow
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /plant/seasonal-windows/{id}/activate"
        actor: PlantManager
        preconditions:
          - "window_status == SCHEDULED (ERR_WINDOW_INVALID_STATE)"
          - "starts_on <= date(clock now) <= ends_on (ERR_WINDOW_INVALID_STATE)"
        side_effects:
          - "link 1: SeasonalAllotment created for every CustomerAccount with credit_standing == GOOD, allotted_cases per seasonal_allotment_waterfall"
          - "link 2 (strict windows only): enforcement sweep shorts pre-existing ALLOCATED stops on routes dated inside the window that exceed the new allotment (stops processed created_at ASC; atomic short, no partial)"
          - "link 3: each shorted stop restores pack cases_available, refunds route committed_cases and allotment consumed_cases"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /plant/seasonal-windows/{id}/close"
        actor: PlantManager
        preconditions:
          - "window_status == ACTIVE (ERR_WINDOW_INVALID_STATE)"
        side_effects:
          - "every SeasonalAllotment of this window ACTIVE -> CLOSED"

  - entity: SeasonalAllotment
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "system (parent window close cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CustomerAccount
    initial_state: GOOD
    terminal_states: []
    transitions:
      - from: GOOD
        to: HOLD
        trigger: "POST /plant/customers/{id}/set-credit-standing (credit_standing=HOLD)"
        actor: PlantManager
        preconditions: []
        side_effects: []
      - from: HOLD
        to: GOOD
        trigger: "POST /plant/customers/{id}/set-credit-standing (credit_standing=GOOD)"
        actor: PlantManager
        preconditions: []
        side_effects: []
    note: "credit_standing is the state field on CustomerAccount; HOLD blocks new stop allocation (ERR_CUSTOMER_CREDIT_HOLD)"

  - entity: Route
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /plant/routes/{id}/dispatch"
        actor: RouteDispatcher
        preconditions:
          - "route_status == PLANNED (ERR_ROUTE_INVALID_STATE)"
          - "at least one stop in ALLOCATED (ERR_ROUTE_EMPTY)"
        side_effects: []
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /plant/routes/{id}/complete"
        actor: RouteDispatcher
        preconditions:
          - "route_status == DISPATCHED (ERR_ROUTE_INVALID_STATE)"
          - "every stop in {DELIVERED, SHORTED} (ERR_UNRESOLVED_STOPS)"
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /plant/routes/{id}/cancel"
        actor: RouteDispatcher
        preconditions:
          - "route_status == PLANNED (ERR_ROUTE_INVALID_STATE)"
        side_effects:
          - "every ALLOCATED stop -> SHORTED (pack cases_available restored, allotment consumed refunded)"

  - entity: RouteStop
    initial_state: ALLOCATED
    terminal_states: [DELIVERED, SHORTED]
    transitions:
      - from: ALLOCATED
        to: DELIVERED
        trigger: "POST /plant/stops/{id}/deliver"
        actor: RouteDispatcher
        preconditions:
          - "stop_status == ALLOCATED (ERR_STOP_INVALID_STATE)"
          - "parent route route_status == DISPATCHED (ERR_ROUTE_INVALID_STATE)"
          - "delivered_cases <= allocated_cases (ERR_VALIDATION)"
        side_effects:
          - "shortage_cases = allocated_cases - delivered_cases (no restock; route already dispatched)"
      - from: ALLOCATED
        to: SHORTED
        trigger: "POST /plant/stops/{id}/short, or system cascade (window activation sweep / route cancel)"
        actor: RouteDispatcher
        preconditions:
          - "stop_status == ALLOCATED (ERR_STOP_INVALID_STATE)"
          - "parent route route_status == PLANNED (ERR_ROUTE_INVALID_STATE)"
        side_effects:
          - "pack cases_available += allocated_cases"
          - "route committed_cases -= allocated_cases (invariant: cases_packed = cases_available + active allocations)"
          - "seasonal allotment consumed_cases -= allocated_cases when this stop consumed an allotment"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: run-create-stale-line
    parent_entity: ProductionLine
    write_endpoint: "POST /plant/runs"
    occ_field: expected_line_version
    description: |
      Creating a ProductionRun against a ProductionLine whose version has
      advanced since the client last read it is rejected with 412. This
      captures the case where another writer has just scheduled a run or
      changed the line (advancing line.version) and the current writer's
      view of the line schedule is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: stop-create-stale-route
    parent_entity: Route
    write_endpoint: "POST /plant/routes/{id}/stops"
    occ_field: expected_route_version
    description: |
      Adding a RouteStop against a Route whose version has advanced since
      the client last read it is rejected with 412. A prior stop creation
      legitimately advanced route.version, so the current writer's capacity
      view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: theoretical_masa_yield
    trigger: "NixtamalBatch creation (provisional variant of masa yield)"
    algorithm: forward_looking
    formula: |
      theoretical_masa_kg = round(corn_kg * VARIETY_YIELD_FACTOR[corn_variety of linked IngredientLot], 2)
    input_set: "the new batch's corn_kg and its IngredientLot.corn_variety"
    constants:
      VARIETY_YIELD_FACTOR: { WHITE_CORN: 1.70, YELLOW_CORN: 1.65, BLUE_CORN: 1.60 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_theoretical
        when: "at batch creation, before milling"
        difference: "uses variety lookup factor on corn input; no moisture or waste correction"
    note: "dual-variant pair with actual_masa_yield — same batch, different number"

  - name: actual_masa_yield
    trigger: "NixtamalBatch mill (final variant of masa yield)"
    algorithm: aggregation
    formula: |
      net_milled_kg = milled_masa_kg - masa_wasted_kg
      moisture_penalty = max(0, measured_moisture_pct - TARGET_MASA_MOISTURE_PCT) / 100
      actual_masa_kg = round(net_milled_kg * (1 - moisture_penalty), 2)
      masa_available_kg = actual_masa_kg
      yield_variance_pct = round((actual_masa_kg - theoretical_masa_kg) / theoretical_masa_kg * 100, 2)
    input_set: "mill inputs milled_masa_kg, measured_moisture_pct, masa_wasted_kg plus the stored theoretical_masa_kg"
    constants:
      TARGET_MASA_MOISTURE_PCT: 55
    precision: "2 decimal places, round_half_up"
    variants:
      - name: final_actual
        when: "at mill completion"
        difference: "uses measured mill output with waste netting and moisture penalty; diverges from provisional_theoretical for the same batch"

  - name: declared_weight_rounding
    trigger: "Product creation (computed fields declared_pack_net_g, declared_case_net_g)"
    algorithm: aggregation
    formula: |
      declared_pack_net_g = round_half_up(unit_weight_g * count_per_pack, 1)      # ROUND PER-PACK FIRST
      declared_case_net_g = round_half_up(declared_pack_net_g * packs_per_case, 1) # THEN aggregate
      # Forbidden order: round_half_up(unit_weight_g * count_per_pack * packs_per_case, 1)
      # e.g. unit 29.97, count 12, packs 10 -> pinned 359.6 then 3596.0; naive gives 3596.4
    input_set: "unit_weight_g, count_per_pack, packs_per_case of the product"
    precision: "1 decimal place, round_half_up; per-pack-then-per-case order is normative"
    note: "combinatorial mode (b): nested rounding order changes observable cents/grams"

  - name: pack_weight_verification
    trigger: "POST /plant/pack-orders/{id}/weight-check"
    algorithm: threshold
    formula: |
      declared_pack = product.declared_pack_net_g
      lower = declared_pack * (1 - product.weight_tolerance_pct / 100)
      upper = declared_pack * (1 + product.weight_tolerance_pct / 100)
      avg_pack_weight_g = round_half_up(mean(sample_weights_g), 1)
      pass_band = (avg_pack_weight_g >= lower) AND (avg_pack_weight_g <= upper)   # >= / <= inclusive
    input_set: "weight-check payload arrays; only the method declared on the PackOrder is evaluated"
    constants:
      SAMPLE_MIN: 3
    precision: "1 decimal place, round_half_up BEFORE band comparison"
    variants:
      - name: average_weight
        when: "PackOrder.verification_method == AVERAGE_WEIGHT"
        difference: "passes iff avg pack weight inside [lower, upper]; individual piece counts ignored"
      - name: count_verify
        when: "PackOrder.verification_method == COUNT_VERIFY"
        difference: "passes iff EVERY sample_counts entry == product.count_per_pack AND avg weight >= lower (upper band not applied); count_accuracy_pct = share of exact packs"
    note: "dual-variant pair on PackOrder — same physical cartons can pass AVERAGE_WEIGHT and fail COUNT_VERIFY"

  - name: changeover_requirement
    trigger: "ProductionRun creation when the previous run on the line used a different product; also manual POST /plant/changeovers"
    algorithm: constraint_propagation
    formula: |
      rank = { CORN_ONLY: 0, WHEAT_FLOUR: 1, SOY_BLENDED: 2 }
      if from.allergen_class == to.allergen_class:
        level = FLUSH if from.diameter_in == to.diameter_in else WET_WASH
      elif rank[from.allergen_class] > rank[to.allergen_class]:
        level = FULL_SANITATION          # allergen downgrade: stricter cleaning
      else:
        level = WET_WASH                 # allergen upgrade
      base = { FLUSH: 30, WET_WASH: 60, FULL_SANITATION: 120 }[level]
      diameter_penalty = 15 if (from.diameter_in != to.diameter_in AND level != FULL_SANITATION) else 0
      required_downtime_min = base + diameter_penalty
    input_set: "from_product, to_product (allergen_class + diameter_in), line allergen_zone context"
    constants:
      LEVEL_BASE_MIN: { FLUSH: 30, WET_WASH: 60, FULL_SANITATION: 120 }
      DIAMETER_PENALTY_MIN: 15
    note: "combinatorial mode (a): >=3 inputs (from-class, to-class, diameter pair) with non-linear conditional branches"

  - name: line_window_conflict
    trigger: "ProductionRun creation"
    algorithm: interval_merge
    formula: |
      # Half-open intervals [start_at, end_at): adjacency is NOT a conflict.
      overlap(a, b) = a.start_at < b.end_at AND a.end_at > b.start_at
      # Consider only sibling runs on the same line with production_status != CANCELLED.
      # If the immediately-preceding non-CANCELLED run used a different product, additionally require:
      #   new.start_at >= prev.end_at + changeover_requirement.required_downtime_min
      #   (violation -> ERR_CHANGEOVER_WINDOW_INSUFFICIENT)
    input_set: "all ProductionRun rows on the same line with production_status != CANCELLED"
    note: "interval semantics #1: half-open, buffer-augmented when allergen changeover required"

  - name: seasonal_window_overlap
    trigger: "SeasonalWindow creation"
    algorithm: interval_merge
    formula: |
      # CLOSED date intervals [starts_on, ends_on], BOTH ends inclusive:
      overlap(a, b) = a.starts_on <= b.ends_on AND a.ends_on >= b.starts_on
      # Adjacency where a.ends_on + 1 day == b.starts_on is allowed; sharing one calendar day is a conflict.
      # Compared against all windows with window_status in {SCHEDULED, ACTIVE}.
    input_set: "all SeasonalWindow rows with window_status in {SCHEDULED, ACTIVE}"
    note: "interval semantics #2: closed inclusive date intervals — differs from line half-open semantics"

  - name: seasonal_allotment_waterfall
    trigger: "SeasonalWindow activation"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS NORMATIVE (circular-looking dependency pinned):
      # Step 1: foodservice customers FIRST (channel == FOODSERVICE_DIST, credit_standing == GOOD,
      #         ordered created_at ASC):
      #   allotted = ceil(base_weekly_cases * window.demand_multiplier)
      # Step 2: retail_pool = max(0, forecast_total_cases - sum(step 1 allotments))
      # Step 3: retail customers (channel in {RETAIL_GROCERY, TORTILLERIA}, credit_standing == GOOD,
      #         ordered priority_tier A before B before C, tie-break created_at ASC):
      #   request  = ceil(base_weekly_cases * demand_multiplier * TIER_FACTOR[priority_tier])
      #   allotted = min(request, retail_pool); retail_pool -= allotted
      is_strict = demand_multiplier >= SPIKE_MULTIPLIER_THRESHOLD
    input_set: "all CustomerAccount with credit_standing == GOOD at activation time"
    constants:
      TIER_FACTOR: { A: 1.0, B: 0.8, C: 0.6 }
      SPIKE_MULTIPLIER_THRESHOLD: 1.5
    precision: "integer cases, ceil per-customer"
    note: "combinatorial mode (c): retail pool depends on foodservice allotments — evaluation order pinned so the value is well-defined"

  - name: shelf_life_gate
    trigger: "RouteStop creation"
    algorithm: threshold
    formula: |
      remaining_days = (pack.expires_on - route.route_date) in whole days
      pass = remaining_days * 100 >= customer.min_shelf_life_pct * product.shelf_life_days
      # integer comparison, >= inclusive at the exact boundary; violation -> ERR_SHELF_LIFE_INSUFFICIENT
    input_set: "pack order expires_on, route_date, customer min_shelf_life_pct, product shelf_life_days"
    note: "boundary metric for §0.5 rule 6"

  - name: masa_conservation_invariant
    trigger: "allocation create / release / consume / quarantine cascade"
    algorithm: aggregation
    formula: |
      INVARIANT: batch.actual_masa_kg == batch.masa_available_kg
                 + sum(allocated_kg over BatchAllocation in {RESERVED, CONSUMED})
      # allocate moves kg from masa_available_kg into RESERVED; release moves them back;
      # consume re-labels RESERVED -> CONSUMED. Forward+compensating pair leaves the sum unchanged.
    input_set: "one NixtamalBatch and all its BatchAllocation rows"
    note: "§0.5 rule 9 instance 1 — conserved quantity: masa kg"

  - name: case_load_invariant
    trigger: "stop create / short / deliver / route cancel cascade"
    algorithm: aggregation
    formula: |
      INVARIANT: pack.cases_packed == pack.cases_available
                 + sum(allocated_cases over RouteStop in {ALLOCATED, DELIVERED} referencing this pack)
      ROUTE DERIVED: route.committed_cases = sum(allocated_cases over stops in {ALLOCATED, DELIVERED});
                     route.open_cases = vehicle_capacity_cases - committed_cases
      # stop create moves cases from cases_available into ALLOCATED; short moves them back;
      # deliver keeps the label (no restock after dispatch).
    input_set: "one PackOrder and its RouteStop rows; one Route and its stops"
    note: "§0.5 rule 9 instance 2 — conserved quantity: packed cases"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of the seven declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 2, category: auth, check: "Segregation of duties: changeover verify/fail X-User-ID must differ from performed_by", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "POST /plant/changeovers/{id}/verify, POST /plant/changeovers/{id}/fail" }
  - { priority: 3, category: existence, check: "Request body shape: required fields present, types correct, numeric ranges (kg > 0, cases > 0, pct ranges, end_at > start_at, ends_on >= starts_on)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 3, category: existence, check: "Enum fields carry a declared member", error_id: ERR_INVALID_ENUM, http_status: 400, applies_to: "all" }
  - { priority: 3, category: existence, check: "Numeric semantic ranges (delivered_cases <= allocated_cases; lime_pct 0.1..2.0; cook_minutes >= 30; steep_target_hours >= 8)", error_id: ERR_VALIDATION, http_status: 422, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path ids and body FK references exist (ingredient lot, batch, product, line, run, allocation, changeover, pack order, window, customer, route, stop)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "OCC: expected_line_version == ProductionLine.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /plant/runs" }
  - { priority: 5, category: state, check: "OCC: expected_route_version == Route.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /plant/routes/{id}/stops" }
  - { priority: 5, category: state, check: "Target entity in required from-state for the transition", error_id: ERR_BATCH_INVALID_STATE, http_status: 409, applies_to: "all /plant/nixtamal-batches/{id}/* actions" }
  - { priority: 5, category: state, check: "Lot in required state (CONDITIONED for batch start-cook; RECEIVED for condition)", error_id: ERR_LOT_INVALID_STATE, http_status: 409, applies_to: "POST /plant/ingredient-lots/{id}/condition, POST /plant/nixtamal-batches/{id}/start-cook" }
  - { priority: 5, category: state, check: "Run in required production_status / qc_status", error_id: ERR_RUN_INVALID_STATE, http_status: 409, applies_to: "all /plant/runs/{id}/* actions" }
  - { priority: 5, category: state, check: "ProductionLine must be ACTIVE (not DOWN) to accept a new run", error_id: ERR_RUN_INVALID_STATE, http_status: 409, applies_to: "POST /plant/runs" }
  - { priority: 5, category: state, check: "Allocation RESERVED for release/consume", error_id: ERR_ALLOCATION_INVALID_STATE, http_status: 409, applies_to: "POST /plant/allocations/{id}/release, POST /plant/allocations/{id}/consume" }
  - { priority: 5, category: state, check: "Changeover in required status", error_id: ERR_CHANGEOVER_INVALID_STATE, http_status: 409, applies_to: "POST /plant/changeovers/{id}/begin|verify|fail" }
  - { priority: 5, category: state, check: "Pack order in required status", error_id: ERR_PACK_INVALID_STATE, http_status: 409, applies_to: "all /plant/pack-orders/{id}/* actions" }
  - { priority: 5, category: state, check: "Pack order must be SEALED to source a stop", error_id: ERR_PACK_NOT_SEALED, http_status: 409, applies_to: "POST /plant/routes/{id}/stops" }
  - { priority: 5, category: state, check: "Route in required status", error_id: ERR_ROUTE_INVALID_STATE, http_status: 409, applies_to: "all /plant/routes/{id}/* and /plant/stops/{id}/* actions" }
  - { priority: 5, category: state, check: "Stop ALLOCATED for deliver/short", error_id: ERR_STOP_INVALID_STATE, http_status: 409, applies_to: "POST /plant/stops/{id}/deliver, POST /plant/stops/{id}/short" }
  - { priority: 5, category: state, check: "Window in required status and clock date inside [starts_on, ends_on] for activate", error_id: ERR_WINDOW_INVALID_STATE, http_status: 409, applies_to: "POST /plant/seasonal-windows/{id}/activate|close" }
  - { priority: 5, category: state, check: "Product must be ACTIVE at run creation", error_id: ERR_PRODUCT_DISCONTINUED, http_status: 409, applies_to: "POST /plant/runs" }
  - { priority: 6, category: business_safety, check: "Allergen zone: WHEAT_FLOUR or SOY_BLENDED product forbidden on DEDICATED_CORN line", error_id: ERR_ALLERGEN_ZONE_VIOLATION, http_status: 422, applies_to: "POST /plant/runs" }
  - { priority: 6, category: business_safety, check: "Shelf-life gate: remaining_days*100 >= min_shelf_life_pct * shelf_life_days", error_id: ERR_SHELF_LIFE_INSUFFICIENT, http_status: 422, applies_to: "POST /plant/routes/{id}/stops" }
  - { priority: 6, category: business_safety, check: "QC hold: parent run qc_status != ON_HOLD to seal", error_id: ERR_QC_HOLD_ACTIVE, http_status: 409, applies_to: "POST /plant/pack-orders/{id}/seal" }
  - { priority: 6, category: business_safety, check: "Changeover gating this run must be VERIFIED before start", error_id: ERR_CHANGEOVER_NOT_VERIFIED, http_status: 409, applies_to: "POST /plant/runs/{id}/start" }
  - { priority: 7, category: business_temporal, check: "Cook duration elapsed >= cook_minutes", error_id: ERR_COOK_INCOMPLETE, http_status: 409, applies_to: "POST /plant/nixtamal-batches/{id}/start-steep" }
  - { priority: 7, category: business_temporal, check: "Steep duration elapsed >= steep_target_hours", error_id: ERR_STEEP_INCOMPLETE, http_status: 409, applies_to: "POST /plant/nixtamal-batches/{id}/evaluate" }
  - { priority: 7, category: business_temporal, check: "Line window half-open overlap with non-CANCELLED sibling runs", error_id: ERR_LINE_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /plant/runs" }
  - { priority: 7, category: business_temporal, check: "Product-switch buffer: new.start_at >= prev.end_at + required_downtime_min", error_id: ERR_CHANGEOVER_WINDOW_INSUFFICIENT, http_status: 409, applies_to: "POST /plant/runs" }
  - { priority: 7, category: business_temporal, check: "Seasonal window closed-interval date overlap", error_id: ERR_WINDOW_DATE_OVERLAP, http_status: 409, applies_to: "POST /plant/seasonal-windows" }
  - { priority: 8, category: business_constraint, check: "Batch masa_available_kg >= allocated_kg requested", error_id: ERR_MASA_INSUFFICIENT, http_status: 422, applies_to: "POST /plant/allocations" }
  - { priority: 8, category: business_constraint, check: "Run start masa coverage: RESERVED total >= masa_required_kg", error_id: ERR_MASA_INSUFFICIENT, http_status: 422, applies_to: "POST /plant/runs/{id}/start" }
  - { priority: 8, category: business_constraint, check: "Line throughput: planned_cases <= cases_per_hour * window hours", error_id: ERR_LINE_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /plant/runs" }
  - { priority: 8, category: business_constraint, check: "Route open_cases >= requested_cases", error_id: ERR_ROUTE_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /plant/routes/{id}/stops" }
  - { priority: 8, category: business_constraint, check: "Pack cases_available >= requested_cases", error_id: ERR_PACK_STOCK_INSUFFICIENT, http_status: 422, applies_to: "POST /plant/routes/{id}/stops" }
  - { priority: 8, category: business_constraint, check: "Weight-check sample cardinality >= 3 and array matches method (weights vs counts)", error_id: ERR_WEIGHT_SAMPLE_INVALID, http_status: 422, applies_to: "POST /plant/pack-orders/{id}/weight-check" }
  - { priority: 8, category: business_constraint, check: "Uniqueness: sku_code, lot_code, line_code, route_code", error_id: ERR_DUPLICATE_CODE, http_status: 409, applies_to: "POST /plant/products, POST /plant/ingredient-lots, POST /plant/lines, POST /plant/routes" }
  - { priority: 9, category: business_fiscal, check: "Customer credit_standing == GOOD to receive a stop", error_id: ERR_CUSTOMER_CREDIT_HOLD, http_status: 422, applies_to: "POST /plant/routes/{id}/stops" }
  - { priority: 9, category: business_fiscal, check: "Strict seasonal window: allotment remaining_cases >= requested_cases", error_id: ERR_ALLOTMENT_EXCEEDED, http_status: 422, applies_to: "POST /plant/routes/{id}/stops" }
  - { priority: 10, category: business_referential, check: "Run completion: all PackOrder children terminal", error_id: ERR_UNRESOLVED_PACK_ORDERS, http_status: 409, applies_to: "POST /plant/runs/{id}/complete" }
  - { priority: 10, category: business_referential, check: "Run completion: produced_cases >= ceil(planned_cases * 0.95)", error_id: ERR_RUN_CASE_SHORTFALL, http_status: 422, applies_to: "POST /plant/runs/{id}/complete" }
  - { priority: 10, category: business_referential, check: "Route completion: all stops terminal", error_id: ERR_UNRESOLVED_STOPS, http_status: 409, applies_to: "POST /plant/routes/{id}/complete" }
  - { priority: 10, category: business_referential, check: "Product discontinue: no run in {PLANNED, SCHEDULED, IN_PROGRESS}", error_id: ERR_PRODUCT_IN_USE, http_status: 409, applies_to: "POST /plant/products/{id}/discontinue" }
  - { priority: 10, category: business_referential, check: "Route dispatch: at least one ALLOCATED stop", error_id: ERR_ROUTE_EMPTY, http_status: 409, applies_to: "POST /plant/routes/{id}/dispatch" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- logical clock (test-driving; default 2026-08-01T00:00:00Z before first set) ----
  - { method: POST, path: "/plant/_clock/set_current_utc", description: "Advance the logical clock; server startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock", roles: [PlantManager], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["time-gated validations re-evaluate against the new clock"] }

  # ---- IngredientLot ----
  - { method: POST, path: "/plant/ingredient-lots", description: "Receive a corn lot", roles: [PlantManager], code: 201, input: [lot_code, corn_variety, received_kg, moisture_pct], output: IngredientLot, side_effects: ["lot_status = RECEIVED"] }
  - { method: GET, path: "/plant/ingredient-lots", description: "List lots", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["lot_status?", "limit?", "offset?"], output: "IngredientLot[]", side_effects: [] }
  - { method: GET, path: "/plant/ingredient-lots/{id}", description: "Get one lot", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: [], output: IngredientLot, side_effects: [] }
  - { method: POST, path: "/plant/ingredient-lots/{id}/condition", description: "Condition (or reject) a received lot", roles: [MillerOperator], code: 200, input: ["decision?"], output: IngredientLot, side_effects: ["lot_status RECEIVED -> CONDITIONED (default) or REJECTED when decision=REJECT"] }
  - { method: GET, path: "/plant/ingredient-lots/{id}/batches", description: "Batches drawn from this lot", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["limit?", "offset?"], output: "NixtamalBatch[]", side_effects: [] }

  # ---- NixtamalBatch ----
  - { method: POST, path: "/plant/nixtamal-batches", description: "Create a nixtamalization batch (draws corn_kg from the lot)", roles: [MillerOperator], code: 201, input: [ingredient_lot_id, corn_kg, lime_pct, cook_minutes, steep_target_hours], output: NixtamalBatch, side_effects: ["theoretical_masa_kg computed (theoretical_masa_yield)", "lot drawn_kg += corn_kg; lot available_kg recomputed; lot may auto-transition CONDITIONED -> DEPLETED"] }
  - { method: GET, path: "/plant/nixtamal-batches/{id}", description: "Get one batch", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: [], output: NixtamalBatch, side_effects: [] }
  - { method: POST, path: "/plant/nixtamal-batches/{id}/start-cook", description: "Begin cooking", roles: [MillerOperator], code: 200, input: [], output: NixtamalBatch, side_effects: ["batch_status PLANNED -> COOKING; cook_started_at = clock"] }
  - { method: POST, path: "/plant/nixtamal-batches/{id}/start-steep", description: "Begin steeping (cook duration must have elapsed)", roles: [MillerOperator], code: 200, input: [], output: NixtamalBatch, side_effects: ["batch_status COOKING -> STEEPING; steep_started_at = clock"] }
  - { method: POST, path: "/plant/nixtamal-batches/{id}/evaluate", description: "Quality gate: PASS -> MILLING, RECOOK -> COOKING (cycle), REJECT -> REJECTED (also from QUARANTINED)", roles: [QualityInspector], code: 200, input: [decision], output: NixtamalBatch, side_effects: ["decision PASS: STEEPING -> MILLING", "decision RECOOK: STEEPING -> COOKING, recook_count += 1, cook_started_at reset", "decision REJECT: STEEPING|QUARANTINED -> REJECTED"] }
  - { method: POST, path: "/plant/nixtamal-batches/{id}/mill", description: "Mill the batch; computes actual yield", roles: [MillerOperator], code: 200, input: [milled_masa_kg, measured_moisture_pct, masa_wasted_kg], output: NixtamalBatch, side_effects: ["batch_status MILLING -> MASA_AVAILABLE", "actual_masa_kg, masa_available_kg, yield_variance_pct computed (actual_masa_yield)"] }
  - { method: POST, path: "/plant/nixtamal-batches/{id}/quarantine", description: "Quarantine available masa; cascades allocation release -> run demotion -> changeover cancel", roles: [QualityInspector], code: 200, input: [], output: NixtamalBatch, side_effects: ["batch_status MASA_AVAILABLE -> QUARANTINED", "RESERVED allocations -> RELEASED (masa_available_kg restored)", "SCHEDULED runs losing masa coverage demote to PLANNED", "gating changeovers of demoted runs -> CANCELLED; line_posture recomputed"] }
  - { method: POST, path: "/plant/nixtamal-batches/{id}/release-quarantine", description: "Release quarantined masa back to availability", roles: [QualityInspector], code: 200, input: [], output: NixtamalBatch, side_effects: ["batch_status QUARANTINED -> MASA_AVAILABLE"] }
  - { method: GET, path: "/plant/nixtamal-batches/{id}/allocations", description: "Allocations drawing masa from this batch", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["limit?", "offset?"], output: "BatchAllocation[]", side_effects: [] }

  # ---- Product ----
  - { method: POST, path: "/plant/products", description: "Create a SKU configuration", roles: [PlantManager], code: 201, input: [sku_code, diameter_in, count_per_pack, packs_per_case, unit_weight_g, channel, preservative_system, allergen_class, "weight_tolerance_pct?"], output: Product, side_effects: ["shelf_life_days, declared_pack_net_g, declared_case_net_g computed (declared_weight_rounding)"] }
  - { method: GET, path: "/plant/products", description: "List products", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["channel?", "allergen_class?", "product_status?", "limit?", "offset?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/plant/products/{id}", description: "Get one product", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: [], output: Product, side_effects: [] }
  - { method: POST, path: "/plant/products/{id}/discontinue", description: "Discontinue a product (blocked while runs are open)", roles: [PlantManager], code: 200, input: [], output: Product, side_effects: ["product_status ACTIVE -> DISCONTINUED"] }
  - { method: GET, path: "/plant/products/{id}/runs", description: "Runs of this product", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["limit?", "offset?"], output: "ProductionRun[]", side_effects: [] }

  # ---- ProductionLine ----
  - { method: POST, path: "/plant/lines", description: "Create a production line", roles: [PlantManager], code: 201, input: [line_code, allergen_zone, cases_per_hour], output: ProductionLine, side_effects: ["line_status = ACTIVE; line_posture = AVAILABLE"] }
  - { method: GET, path: "/plant/lines", description: "List lines", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["limit?", "offset?"], output: "ProductionLine[]", side_effects: [] }
  - { method: GET, path: "/plant/lines/{id}", description: "Get one line (version source for run-create OCC)", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: [], output: ProductionLine, side_effects: [] }
  - { method: POST, path: "/plant/lines/{id}/set-status", description: "Take a line down or return it to service", roles: [PlantManager], code: 200, input: [line_status], output: ProductionLine, side_effects: ["line_status toggles ACTIVE <-> DOWN; increments ProductionLine.version by 1"] }
  - { method: GET, path: "/plant/lines/{id}/runs", description: "Runs scheduled on this line", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["limit?", "offset?"], output: "ProductionRun[]", side_effects: [] }
  - { method: GET, path: "/plant/lines/{id}/changeovers", description: "Changeovers recorded for this line", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["limit?", "offset?"], output: "ChangeoverRecord[]", side_effects: [] }

  # ---- ProductionRun ----
  - { method: POST, path: "/plant/runs", description: "Create a run on a line (OCC on line version; window, capacity, zone, changeover-buffer checks; auto-creates gating ChangeoverRecord on product switch)", roles: [LineScheduler], code: 201, input: [product_id, line_id, planned_cases, start_at, end_at, expected_line_version], output: ProductionRun, side_effects: ["masa_required_kg computed", "production_status = PLANNED, qc_status = PENDING", "when previous non-CANCELLED run on the line used a different product: ChangeoverRecord auto-created (REQUIRED) with computed required_level/required_downtime_min", "increments ProductionLine.version by 1"] }
  - { method: GET, path: "/plant/runs/{id}", description: "Get one run", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: [], output: ProductionRun, side_effects: [] }
  - { method: POST, path: "/plant/runs/{id}/schedule", description: "Confirm a planned run", roles: [LineScheduler], code: 200, input: [], output: ProductionRun, side_effects: ["production_status PLANNED -> SCHEDULED"] }
  - { method: POST, path: "/plant/runs/{id}/start", description: "Start a scheduled run (requires VERIFIED changeover + full masa coverage)", roles: [LineScheduler], code: 200, input: [], output: ProductionRun, side_effects: ["production_status SCHEDULED -> IN_PROGRESS", "RESERVED allocations of this run -> CONSUMED", "line.current_product_id set; ProductionLine.version += 1; line_posture recomputed"] }
  - { method: POST, path: "/plant/runs/{id}/complete", description: "Complete a run (all pack orders terminal; >=95% case attainment)", roles: [LineScheduler], code: 200, input: [], output: ProductionRun, side_effects: ["production_status IN_PROGRESS -> COMPLETED", "produced_cases finalized from SEALED pack orders"] }
  - { method: POST, path: "/plant/runs/{id}/cancel", description: "Cancel a run; cascades allocation release, pack-order cancel, changeover cancel", roles: [LineScheduler], code: 200, input: [], output: ProductionRun, side_effects: ["production_status -> CANCELLED", "RESERVED allocations -> RELEASED (masa restored)", "non-terminal PackOrder -> CANCELLED", "gating ChangeoverRecord -> CANCELLED"] }
  - { method: POST, path: "/plant/runs/{id}/qc-hold", description: "Place run on QC hold (parallel qc dimension)", roles: [QualityInspector], code: 200, input: [], output: ProductionRun, side_effects: ["qc_status PENDING -> ON_HOLD"] }
  - { method: POST, path: "/plant/runs/{id}/qc-release", description: "Release QC hold", roles: [QualityInspector], code: 200, input: [], output: ProductionRun, side_effects: ["qc_status ON_HOLD -> PASSED"] }
  - { method: GET, path: "/plant/runs/{id}/allocations", description: "Masa allocations feeding this run", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["limit?", "offset?"], output: "BatchAllocation[]", side_effects: [] }
  - { method: GET, path: "/plant/runs/{id}/pack-orders", description: "Pack orders of this run", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["limit?", "offset?"], output: "PackOrder[]", side_effects: [] }
  - { method: GET, path: "/plant/runs/{id}/changeovers", description: "Changeover records gating this run", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["limit?", "offset?"], output: "ChangeoverRecord[]", side_effects: [] }

  # ---- BatchAllocation ----
  - { method: POST, path: "/plant/allocations", description: "Reserve masa from a MASA_AVAILABLE batch for a PLANNED/SCHEDULED run", roles: [LineScheduler], code: 201, input: [nixtamal_batch_id, production_run_id, allocated_kg], output: BatchAllocation, side_effects: ["batch masa_available_kg -= allocated_kg", "run masa_reserved_kg recomputed", "masa_conservation_invariant maintained"] }
  - { method: GET, path: "/plant/allocations/{id}", description: "Get one allocation", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: [], output: BatchAllocation, side_effects: [] }
  - { method: POST, path: "/plant/allocations/{id}/release", description: "Release a reservation (compensating action)", roles: [LineScheduler], code: 200, input: [], output: BatchAllocation, side_effects: ["allocation_status RESERVED -> RELEASED", "batch masa_available_kg += allocated_kg", "run masa_reserved_kg recomputed; SCHEDULED run losing coverage demotes to PLANNED and cancels its gating changeover"] }
  - { method: POST, path: "/plant/allocations/{id}/consume", description: "Mark reserved masa consumed", roles: [LineScheduler], code: 200, input: [], output: BatchAllocation, side_effects: ["allocation_status RESERVED -> CONSUMED", "batch may auto-transition MASA_AVAILABLE -> DEPLETED when masa_available_kg hits 0"] }

  # ---- ChangeoverRecord ----
  - { method: POST, path: "/plant/changeovers", description: "Manually register a changeover (e.g., end-of-shift sanitation without a gated run)", roles: [SanitationTech], code: 201, input: [line_id, from_product_id, to_product_id], output: ChangeoverRecord, side_effects: ["required_level and required_downtime_min computed (changeover_requirement)", "changeover_status = REQUIRED; line_posture recomputed"] }
  - { method: GET, path: "/plant/changeovers", description: "List changeovers with filters", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["line_id?", "from_product_id?", "to_product_id?", "changeover_status?", "limit?", "offset?"], output: "ChangeoverRecord[]", side_effects: [] }
  - { method: GET, path: "/plant/changeovers/{id}", description: "Get one changeover", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: [], output: ChangeoverRecord, side_effects: [] }
  - { method: POST, path: "/plant/changeovers/{id}/begin", description: "Begin sanitation work (records performed_by)", roles: [SanitationTech], code: 200, input: [], output: ChangeoverRecord, side_effects: ["changeover_status REQUIRED|FAILED -> IN_PROGRESS; performed_by = X-User-ID"] }
  - { method: POST, path: "/plant/changeovers/{id}/verify", description: "Verify completed changeover (segregation of duties enforced)", roles: [QualityInspector], code: 200, input: [], output: ChangeoverRecord, side_effects: ["changeover_status IN_PROGRESS -> VERIFIED; line_posture recomputed"] }
  - { method: POST, path: "/plant/changeovers/{id}/fail", description: "Fail a changeover inspection (rework loop)", roles: [QualityInspector], code: 200, input: [], output: ChangeoverRecord, side_effects: ["changeover_status IN_PROGRESS -> FAILED; fail_count += 1"] }

  # ---- PackOrder ----
  - { method: POST, path: "/plant/pack-orders", description: "Open a pack order under a run", roles: [PackagingLead], code: 201, input: [production_run_id, cases_planned, verification_method], output: PackOrder, side_effects: ["pack_status = OPEN"] }
  - { method: GET, path: "/plant/pack-orders/{id}", description: "Get one pack order", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: [], output: PackOrder, side_effects: [] }
  - { method: POST, path: "/plant/pack-orders/{id}/start-packing", description: "Begin packing (run must be IN_PROGRESS)", roles: [PackagingLead], code: 200, input: [], output: PackOrder, side_effects: ["pack_status OPEN -> PACKING"] }
  - { method: POST, path: "/plant/pack-orders/{id}/weight-check", description: "Submit QC sample; pass -> PASSED, fail -> HOLD (rework loop)", roles: [PackagingLead], code: 200, input: [cases_packed, "sample_weights_g?", "sample_counts?"], output: PackOrder, side_effects: ["avg_pack_weight_g / count_accuracy_pct computed per verification_method (pack_weight_verification)", "pack_status -> PASSED on pass, -> HOLD on fail"] }
  - { method: POST, path: "/plant/pack-orders/{id}/seal", description: "Seal passed cases (blocked while run QC ON_HOLD)", roles: [PackagingLead], code: 200, input: [], output: PackOrder, side_effects: ["pack_status PASSED -> SEALED", "sealed_at = clock; expires_on computed; cases_available = cases_packed"] }
  - { method: POST, path: "/plant/pack-orders/{id}/reject", description: "Reject a non-terminal pack order", roles: [PackagingLead], code: 200, input: [], output: PackOrder, side_effects: ["pack_status {OPEN,PACKING,HOLD} -> REJECTED"] }
  - { method: GET, path: "/plant/pack-orders/{id}/stops", description: "Route stops sourcing this pack order", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["limit?", "offset?"], output: "RouteStop[]", side_effects: [] }

  # ---- SeasonalWindow / SeasonalAllotment ----
  - { method: POST, path: "/plant/seasonal-windows", description: "Create a seasonal demand window (inclusive dates; overlap rejected)", roles: [PlantManager], code: 201, input: [window_name, starts_on, ends_on, demand_multiplier, forecast_total_cases], output: SeasonalWindow, side_effects: ["is_strict computed (demand_multiplier >= 1.5)", "window_status = SCHEDULED"] }
  - { method: GET, path: "/plant/seasonal-windows", description: "List windows", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["window_status?", "limit?", "offset?"], output: "SeasonalWindow[]", side_effects: [] }
  - { method: GET, path: "/plant/seasonal-windows/{id}", description: "Get one window", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: [], output: SeasonalWindow, side_effects: [] }
  - { method: POST, path: "/plant/seasonal-windows/{id}/activate", description: "Activate a window: computes allotments (waterfall) and runs the strict-mode shorting sweep", roles: [PlantManager], code: 200, input: [], output: SeasonalWindow, side_effects: ["window_status SCHEDULED -> ACTIVE", "SeasonalAllotment rows created per seasonal_allotment_waterfall", "strict windows: excess pre-existing ALLOCATED stops on in-window dates -> SHORTED (created_at ASC sweep), restoring pack cases_available and route committed_cases"] }
  - { method: POST, path: "/plant/seasonal-windows/{id}/close", description: "Close a window and its allotments", roles: [PlantManager], code: 200, input: [], output: SeasonalWindow, side_effects: ["window_status ACTIVE -> CLOSED", "allotments ACTIVE -> CLOSED"] }
  - { method: GET, path: "/plant/seasonal-windows/{id}/allotments", description: "Allotments of this window", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["limit?", "offset?"], output: "SeasonalAllotment[]", side_effects: [] }
  - { method: GET, path: "/plant/allotments/{id}", description: "Get one allotment", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: [], output: SeasonalAllotment, side_effects: [] }

  # ---- CustomerAccount ----
  - { method: POST, path: "/plant/customers", description: "Register a Hispanic-market channel customer", roles: [PlantManager], code: 201, input: [account_name, channel, region, base_weekly_cases, priority_tier, min_shelf_life_pct], output: CustomerAccount, side_effects: ["credit_standing = GOOD"] }
  - { method: GET, path: "/plant/customers", description: "List customers", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["channel?", "credit_standing?", "limit?", "offset?"], output: "CustomerAccount[]", side_effects: [] }
  - { method: GET, path: "/plant/customers/{id}", description: "Get one customer", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: [], output: CustomerAccount, side_effects: [] }
  - { method: POST, path: "/plant/customers/{id}/set-credit-standing", description: "Set credit standing (GOOD/HOLD)", roles: [PlantManager], code: 200, input: [credit_standing], output: CustomerAccount, side_effects: ["credit_standing updated"] }
  - { method: GET, path: "/plant/customers/{id}/stops", description: "Stops serving this customer", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["limit?", "offset?"], output: "RouteStop[]", side_effects: [] }
  - { method: GET, path: "/plant/customers/{id}/allotments", description: "Seasonal allotments of this customer", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["limit?", "offset?"], output: "SeasonalAllotment[]", side_effects: [] }

  # ---- Route / RouteStop ----
  - { method: POST, path: "/plant/routes", description: "Create a DSD route", roles: [RouteDispatcher], code: 201, input: [route_code, route_date, region, vehicle_capacity_cases], output: Route, side_effects: ["route_status = PLANNED"] }
  - { method: GET, path: "/plant/routes/{id}", description: "Get one route (version source for stop-create OCC)", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: [], output: Route, side_effects: [] }
  - { method: POST, path: "/plant/routes/{id}/dispatch", description: "Dispatch a planned route (requires >= 1 ALLOCATED stop)", roles: [RouteDispatcher], code: 200, input: [], output: Route, side_effects: ["route_status PLANNED -> DISPATCHED"] }
  - { method: POST, path: "/plant/routes/{id}/complete", description: "Complete a dispatched route (all stops terminal)", roles: [RouteDispatcher], code: 200, input: [], output: Route, side_effects: ["route_status DISPATCHED -> COMPLETED"] }
  - { method: POST, path: "/plant/routes/{id}/cancel", description: "Cancel a planned route; shorts all ALLOCATED stops", roles: [RouteDispatcher], code: 200, input: [], output: Route, side_effects: ["route_status PLANNED -> CANCELLED", "ALLOCATED stops -> SHORTED (restock pack, refund allotment)"] }
  - { method: GET, path: "/plant/routes/{id}/stops", description: "Stops on this route", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: ["limit?", "offset?"], output: "RouteStop[]", side_effects: [] }
  - { method: POST, path: "/plant/routes/{id}/stops", description: "Allocate a stop on a planned route (OCC on route version; shelf-life, capacity, stock, credit, allotment gates; atomic full-case allocation)", roles: [RouteDispatcher], code: 201, input: [customer_id, pack_order_id, requested_cases, expected_route_version], output: RouteStop, side_effects: ["allocated_cases = requested_cases", "pack cases_available -= requested_cases", "route committed_cases += requested_cases; increments Route.version by 1", "strict seasonal window covering route_date: allotment consumed_cases += requested_cases"] }
  - { method: GET, path: "/plant/stops/{id}", description: "Get one stop", roles: [PlantManager, MillerOperator, LineScheduler, SanitationTech, QualityInspector, PackagingLead, RouteDispatcher], code: 200, input: [], output: RouteStop, side_effects: [] }
  - { method: POST, path: "/plant/stops/{id}/deliver", description: "Deliver an allocated stop (shortage recorded, not restocked)", roles: [RouteDispatcher], code: 200, input: [delivered_cases], output: RouteStop, side_effects: ["stop_status ALLOCATED -> DELIVERED", "shortage_cases = allocated_cases - delivered_cases"] }
  - { method: POST, path: "/plant/stops/{id}/short", description: "Short an allocated stop pre-dispatch (restocks pack, refunds route + allotment)", roles: [RouteDispatcher], code: 200, input: [], output: RouteStop, side_effects: ["stop_status ALLOCATED -> SHORTED", "pack cases_available += allocated_cases", "route committed_cases -= allocated_cases", "allotment consumed_cases -= allocated_cases when applicable"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/malformed X-User-Role or X-User-ID, or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role not in the endpoint's roles list" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Changeover verify/fail attempted by the same X-User-ID recorded as performed_by" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, or end_at <= start_at / ends_on < starts_on" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field carries an undeclared member" }
  - { id: ERR_VALIDATION, http: 422, condition: "Numeric range violation (kg/cases > 0, pct bounds, delivered_cases <= allocated_cases, cook_minutes >= 30, steep_target_hours >= 8)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_line_version / expected_route_version does not match the parent's current version (OCC)" }
  - { id: ERR_BATCH_INVALID_STATE, http: 409, condition: "NixtamalBatch not in the required from-state for the requested transition" }
  - { id: ERR_LOT_INVALID_STATE, http: 409, condition: "IngredientLot not RECEIVED (condition) or not CONDITIONED (batch start-cook)" }
  - { id: ERR_RUN_INVALID_STATE, http: 409, condition: "ProductionRun production_status / qc_status does not allow the requested action" }
  - { id: ERR_ALLOCATION_INVALID_STATE, http: 409, condition: "BatchAllocation not RESERVED for release/consume" }
  - { id: ERR_CHANGEOVER_INVALID_STATE, http: 409, condition: "ChangeoverRecord not in the required status for begin/verify/fail" }
  - { id: ERR_PACK_INVALID_STATE, http: 409, condition: "PackOrder not in the required status for the requested action" }
  - { id: ERR_PACK_NOT_SEALED, http: 409, condition: "Stop creation references a PackOrder whose pack_status != SEALED" }
  - { id: ERR_ROUTE_INVALID_STATE, http: 409, condition: "Route not in the required status (PLANNED for stop add/short, DISPATCHED for deliver/complete)" }
  - { id: ERR_STOP_INVALID_STATE, http: 409, condition: "RouteStop not ALLOCATED for deliver/short" }
  - { id: ERR_WINDOW_INVALID_STATE, http: 409, condition: "SeasonalWindow not SCHEDULED (activate) / not ACTIVE (close), or clock date outside [starts_on, ends_on] at activation" }
  - { id: ERR_PRODUCT_DISCONTINUED, http: 409, condition: "Run creation references a DISCONTINUED product" }
  - { id: ERR_ALLERGEN_ZONE_VIOLATION, http: 422, condition: "WHEAT_FLOUR or SOY_BLENDED product scheduled on a DEDICATED_CORN line" }
  - { id: ERR_SHELF_LIFE_INSUFFICIENT, http: 422, condition: "Pack remaining shelf life on route_date below customer min_shelf_life_pct" }
  - { id: ERR_QC_HOLD_ACTIVE, http: 409, condition: "Seal attempted while parent run qc_status == ON_HOLD" }
  - { id: ERR_CHANGEOVER_NOT_VERIFIED, http: 409, condition: "Run start gated by a ChangeoverRecord not yet VERIFIED" }
  - { id: ERR_COOK_INCOMPLETE, http: 409, condition: "start-steep before cook_minutes elapsed since cook_started_at" }
  - { id: ERR_STEEP_INCOMPLETE, http: 409, condition: "evaluate before steep_target_hours elapsed since steep_started_at" }
  - { id: ERR_LINE_WINDOW_OVERLAP, http: 409, condition: "Run window overlaps a non-CANCELLED sibling run on the same line (half-open intervals; adjacency allowed)" }
  - { id: ERR_CHANGEOVER_WINDOW_INSUFFICIENT, http: 409, condition: "Product switch without enough gap: new.start_at < prev.end_at + required_downtime_min" }
  - { id: ERR_WINDOW_DATE_OVERLAP, http: 409, condition: "Seasonal window dates overlap an existing SCHEDULED/ACTIVE window (inclusive both ends)" }
  - { id: ERR_MASA_INSUFFICIENT, http: 422, condition: "Allocation exceeds batch masa_available_kg, or run start lacks RESERVED coverage of masa_required_kg" }
  - { id: ERR_LINE_CAPACITY_EXCEEDED, http: 422, condition: "planned_cases exceeds cases_per_hour * window hours" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 422, condition: "requested_cases exceeds route open_cases" }
  - { id: ERR_PACK_STOCK_INSUFFICIENT, http: 422, condition: "requested_cases exceeds pack cases_available" }
  - { id: ERR_WEIGHT_SAMPLE_INVALID, http: 422, condition: "Weight-check sample cardinality < 3, or wrong array for the declared verification_method" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "sku_code / lot_code / line_code / route_code already exists" }
  - { id: ERR_CUSTOMER_CREDIT_HOLD, http: 422, condition: "Stop creation for a customer with credit_standing == HOLD" }
  - { id: ERR_ALLOTMENT_EXCEEDED, http: 422, condition: "Strict seasonal window: requested_cases exceeds allotment remaining_cases" }
  - { id: ERR_UNRESOLVED_PACK_ORDERS, http: 409, condition: "Run completion with non-terminal PackOrder children" }
  - { id: ERR_RUN_CASE_SHORTFALL, http: 422, condition: "Run completion with produced_cases < ceil(planned_cases * 0.95)" }
  - { id: ERR_UNRESOLVED_STOPS, http: 409, condition: "Route completion with non-terminal stops" }
  - { id: ERR_PRODUCT_IN_USE, http: 409, condition: "Discontinue blocked by runs in {PLANNED, SCHEDULED, IN_PROGRESS}" }
  - { id: ERR_ROUTE_EMPTY, http: 409, condition: "Dispatch attempted with zero ALLOCATED stops" }

# =============================================================================
# §1.7 RBAC Matrix (role model: segregation_of_duties over peer-owned resources)
# =============================================================================
roles:
  - name: PlantManager
    description: "Plant administration: products, lines, customers, seasonal windows, corn lot intake, logical clock"
    identity: opaque
    exclusive_operations: ["POST /plant/products", "POST /plant/products/{id}/discontinue", "POST /plant/lines", "POST /plant/lines/{id}/set-status", "POST /plant/seasonal-windows", "POST /plant/seasonal-windows/{id}/activate", "POST /plant/seasonal-windows/{id}/close", "POST /plant/customers", "POST /plant/customers/{id}/set-credit-standing", "POST /plant/ingredient-lots", "POST /plant/_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: MillerOperator
    description: "Nixtamalization floor: lot conditioning and the batch cook/steep/mill lifecycle"
    identity: opaque
    exclusive_operations: ["POST /plant/ingredient-lots/{id}/condition", "POST /plant/nixtamal-batches", "POST /plant/nixtamal-batches/{id}/start-cook", "POST /plant/nixtamal-batches/{id}/start-steep", "POST /plant/nixtamal-batches/{id}/mill"]
    shared_operations: ["all GET endpoints"]
  - name: QualityInspector
    description: "Quality gate: batch evaluation/quarantine, run QC hold/release, changeover verification; never the changeover performer"
    identity: opaque
    exclusive_operations: ["POST /plant/nixtamal-batches/{id}/evaluate", "POST /plant/nixtamal-batches/{id}/quarantine", "POST /plant/nixtamal-batches/{id}/release-quarantine", "POST /plant/runs/{id}/qc-hold", "POST /plant/runs/{id}/qc-release", "POST /plant/changeovers/{id}/verify", "POST /plant/changeovers/{id}/fail"]
    shared_operations: ["all GET endpoints"]
  - name: LineScheduler
    description: "Line scheduling and masa allocation"
    identity: opaque
    exclusive_operations: ["POST /plant/runs", "POST /plant/runs/{id}/schedule", "POST /plant/runs/{id}/start", "POST /plant/runs/{id}/complete", "POST /plant/runs/{id}/cancel", "POST /plant/allocations", "POST /plant/allocations/{id}/release", "POST /plant/allocations/{id}/consume"]
    shared_operations: ["all GET endpoints"]
  - name: SanitationTech
    description: "Performs changeover sanitation; barred by segregation-of-duties from verifying own work"
    identity: opaque
    exclusive_operations: ["POST /plant/changeovers", "POST /plant/changeovers/{id}/begin"]
    shared_operations: ["all GET endpoints"]
  - name: PackagingLead
    description: "Packaging hall: pack orders, weight/count verification, seal/reject"
    identity: opaque
    exclusive_operations: ["POST /plant/pack-orders", "POST /plant/pack-orders/{id}/start-packing", "POST /plant/pack-orders/{id}/weight-check", "POST /plant/pack-orders/{id}/seal", "POST /plant/pack-orders/{id}/reject"]
    shared_operations: ["all GET endpoints"]
  - name: RouteDispatcher
    description: "DSD logistics: routes and stops for retail / tortilleria / foodservice channels"
    identity: opaque
    exclusive_operations: ["POST /plant/routes", "POST /plant/routes/{id}/dispatch", "POST /plant/routes/{id}/complete", "POST /plant/routes/{id}/cancel", "POST /plant/routes/{id}/stops", "POST /plant/stops/{id}/deliver", "POST /plant/stops/{id}/short"]
    shared_operations: ["all GET endpoints"]
