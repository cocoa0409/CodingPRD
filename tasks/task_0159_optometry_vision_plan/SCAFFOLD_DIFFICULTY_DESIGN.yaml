              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
