            - "Logical clock at 2026-09-01T00:00:00Z; one DataBroker operating in CA with a 500000-cent fee deposit."
            - "One SUBMITTED CA Registration covering 2026-09-01T00:00:00Z to 2027-03-01T00:00:00Z with all four required disclosures at full length, so disclosure_completeness_score is 80.00 and charged_fee_cents is the provisional 47000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
              payload: { legal_name: "Silverleaf Data Exchange", primary_contact_email: "compliance@silverleaf.example", home_state_code: "CA", operating_state_codes: ["CA"], business_description: "Resells licensed automotive and household ownership attributes to lead generators." }
              as: PlatformAdmin
              captures: { broker_id: $.data.id }
            - call: "POST /brokers/${broker_id}/fee-deposits"
              payload: { amount_cents: 500000 }
              as: BrokerAdmin
              as_user_id: "${broker_id}"
