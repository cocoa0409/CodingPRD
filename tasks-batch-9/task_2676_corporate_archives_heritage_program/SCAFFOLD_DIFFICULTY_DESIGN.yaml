            - "RecordSeries.${series_id}.disposition_state == SUSPENDED"
            - "RecordSeries.${series_id}.pre_hold_disposition_state == ACTIVE"
            - "RecordSeries.${series_id}.legal_hold_active == true"
            - "RecordSeries.${series_id}.blocked_access_request_count == 1"
            - "AccessRequest.${ar_id}.status == BLOCKED"
            - "AccessRequest.${ar_id}.legal_hold_blocked == true"
            - "ConfidentialityScreening.${scr_id}.status == SUPERSEDED"
            - "ConfidentialityScreening.${scr_id}.superseded_reason == LEGAL_HOLD_BLOCK"

      - name: migration_completion_two_hop_plan_satisfaction_cascade
        grounds:
          - state_machines.MigrationJob.IN_PROGRESS_to_COMPLETED
          - state_machines.ArchivalItem.IN_TREATMENT_to_ACCESSIONED
          - state_machines.PreservationPlan.ACTIVE_to_SATISFIED
          - calculations.at_risk_unit_count
          - calculations.preservation_budget_conservation
        distinguishing_aspect: |
          Depth 2, triggered by completing a migration job. Hop 1 writes
          digital_surrogate_available = true onto the item; ONLY because that flag
          flipped does the plan's at_risk_unit_count recomputation fall to 0, and
          reaching exactly 0 auto-transitions the plan ACTIVE -> SATISFIED (hop 2). The
          plan transition is never requested by any caller. Shallower than the other two
          cascades, different trigger, and it crosses the money ledger
          (committed -> spent) rather than the access chain.
        test_recipe:
          setup:
            - "A COMPLIANT StorageZone whose ONLY at-risk holding is one ACCESSIONED ArchivalItem with original_format MAGNETIC_TAPE, unit_count 10, condition_grade GOOD and digital_surrogate_available false."
            - "An ACTIVE PreservationPlan on the zone with budget_cents 100000; activation set at_risk_unit_count to 10."
            - "One MigrationJob for the whole 10 units, cost 4200*10 = 42000 -> no volume discount -> 42000 -> handling 4000 -> GOOD surcharge 0 -> committed_cost_cents 46000; approved by preserv-b and started."
