      - name: pre_bid_list_precedence_prefers_the_more_specific_entry
        claim_type: constants_applied
        grounds:
          - calculations.pre_bid_placement_decision
          - entities.ListEntry.specificity_rank
          - endpoints[GET /pages/{id}/pre-bid-decision]
        distinguishing_aspect: |
          A PAGE_URL ALLOW entry (specificity_rank 4) must beat a DOMAIN BLOCK
          entry (rank 3) on the page it names, while a sibling page on the same
          domain still falls to the BLOCK. The two candidates come from
          DIFFERENT lists pinned to the same segment, so an implementation that
          evaluates the exclusion list first, or that applies a
          "block-always-wins" rule before comparing specificity, returns BLOCK
          for both pages and silently discards the advertiser's explicit
          allow-listing.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; ACTIVE publisher beacon.example.com."
            - "INCLUSION list with one PAGE_URL entry https://beacon.example.com/x (action ALLOW, specificity_rank 4) and EXCLUSION list with one DOMAIN entry beacon.example.com (action BLOCK, specificity_rank 3); both PUBLISHED."
            - "Segment pins both lists with suitability_floor_tier MEDIUM_RISK and is SYNCED."
            - "Pages /x and /y both exist and are unclassified - the tier gate is never reached, so classification is irrelevant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
