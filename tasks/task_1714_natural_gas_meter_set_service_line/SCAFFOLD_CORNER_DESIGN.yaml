        distinguishing_aspect: "Two 250000-btuh rows → 500.0 × 0.85 = 425.0 CFPH adjusted, EXACTLY AL_425's LOW-pressure capacity: equality selects the smaller tier (capacity >= load). Adding a third row pushes 637.5 → AL_800."
        test_recipe:
          setup: ["application X LOAD_CONFIRMED with two 250000-btuh loads; application Y LOAD_CONFIRMED with three 250000-btuh loads; meter set created for each"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
