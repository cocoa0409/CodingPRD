          assert:
            - "Before the trigger: Production.${prod_id}.status == REHEARSED, readiness_score_certified == 100.00, ShowExecution.${show_id}.readiness_hold == false and air_status == PRE_SHOW"
            - "HTTP 422 with error_id == ERR_VENUE_CURFEW_EXCEEDED (not ERR_READINESS_NOT_CERTIFIED, not ERR_PRODUCTION_STATE_INVALID)"
            - "ShowExecution.${show_id}.air_status is still PRE_SHOW, on_air_at_utc == null, air_minutes_total == 0"
            - "Production.${prod_id}.status is still REHEARSED"

      - name: higher_priority_rule_wins_when_two_are_violated
        claim_type: priority_ordering
        grounds:
          - validations[priority=7]
          - validations[priority=17]
          - validations[priority=37]
          - validations[priority=50]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / path_not_found_outranks_stale_production_version
          rationale: "The four priority_pair_validation_conflict instances cover the ladder pairwise across four different category pairs - existence over state (7 before 17), state over business_fiscal (17 before 50), business_safety over business_fiscal (37 before 50) and state over business_temporal (22 before 31) - each sending one payload that violates both rules and asserting the higher rung's error_id."

      - name: prep_validation_reads_the_feeds_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=25]
          - errors[ERR_FEED_STATE_INVALID]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / prep_validation_depends_on_data_feed_status
          rationale: "That instance tests the same rule from both sides on one feed - validation succeeds while the feed is ACTIVE and the identical call is refused after the feed is suspended."

      - name: rehearsal_signoff_count_depends_on_the_approved_survey
        claim_type: cascading_validation
        grounds:
          - validations[priority=38]
          - errors[ERR_REHEARSAL_SIGNOFF_INCOMPLETE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / rehearsal_completion_depends_on_approved_survey_position_count
          rationale: "That instance shows the priority-38 check reading a value that only exists because an earlier check passed - camera_blocking_positions_cleared must equal the APPROVED survey's camera_position_count - and asserts both the mismatch refusal and the matching success."

      - name: turnaround_gap_exactly_at_the_minimum_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=37]
          - calculations.crew_turnaround_reference
        excluded_because:
          difficulty_instance: resource_temporal_overlap / crew_member_turnaround_directional_gap_from_latest_reference_release
          rationale: "That instance asserts a 600-minute gap is accepted and a 599-minute gap is refused with ERR_CREW_TURNAROUND_VIOLATION on the same member, which is this rule's satisfaction case and its boundary."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: clock_endpoint_sets_the_logical_time_used_for_every_stamp
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /broadcast-ops/_clock/set_current_utc]
          - validations[priority=18]
        distinguishing_aspect: |
          The logical clock is the only source of "now": before any set call it reads
          2026-08-01T00:00:00Z, and after being moved to 2026-08-05T09:30:00Z every subsequently
          minted created_at must use the new instant while rows created earlier keep the old one. A
          malformed instant is refused at priority 18 and must not move the clock.
        test_recipe:
          setup:
            - "Empty database, clock untouched."
          setup_api_calls:
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-EARLY", tier_rating: "TIER_2", camera_channel_capacity: 8, power_draw_amps: 90, home_base_code: "DEN" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { early_truck: $.data.id, early_created: $.data.created_at }
          trigger:
            - call: "POST /broadcast-ops/_clock/set_current_utc"
              payload: { to_iso8601: "not-a-timestamp" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err: $.data.error_id }
            - call: "POST /broadcast-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:30:00Z" }
              as: ProductionManager
              as_user_id: "pm-001"
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-LATE", tier_rating: "TIER_2", camera_channel_capacity: 8, power_draw_amps: 90, home_base_code: "DEN" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { late_truck: $.data.id, late_created: $.data.created_at }
          assert:
            - "ProductionTruck.${early_truck}.created_at == 2026-08-01T00:00:00.000Z (the startup default)"
            - "Malformed instant: HTTP 422 with error_id == ERR_INVALID_REQUEST"
            - "The successful clock call returns HTTP 200 with a null data payload and the standard meta envelope"
            - "ProductionTruck.${late_truck}.created_at == 2026-08-05T09:30:00.000Z while ${early_truck}.created_at is unchanged"

      - name: production_listing_filters_compose_across_truck_and_tier
        claim_type: standard_crud
        grounds:
          - endpoints[GET /broadcast-ops/productions]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three filters over the same collection must each narrow it independently: truck_id returns
          only the production holding that truck, event_tier returns only the TIER_2 event, and
          status=PLANNED returns all three - so an implementation that ignores an unrecognised query
          parameter, or that ANDs filters incorrectly, produces a different count on exactly one of
          the three calls.
        test_recipe:
          setup:
            - "Two TIER_3 productions and one TIER_2 production; the first TIER_3 production holds the only truck."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_a: $.data.id, pva: $.data.version }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Harbor Dome", venue_power_capacity_amps: 400, venue_roof_type: "DOMED", venue_curfew_utc: "2026-08-20T06:00:00Z", scheduled_start_utc: "2026-08-19T18:00:00Z", scheduled_end_utc: "2026-08-19T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_b: $.data.id }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_2", league_code: "NPL", venue_name: "Lakeside Field", venue_power_capacity_amps: 700, venue_roof_type: "RETRACTABLE", venue_curfew_utc: "2026-08-24T06:00:00Z", scheduled_start_utc: "2026-08-23T18:00:00Z", scheduled_end_utc: "2026-08-23T22:00:00Z", labor_budget_total_cents: 4000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_c: $.data.id }
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-01", tier_rating: "TIER_2", camera_channel_capacity: 8, power_draw_amps: 90, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck_id: $.data.id }
            - call: "POST /broadcast-ops/productions/${prod_a}/truck-assignment"
              payload: { truck_id: "${truck_id}", expected_production_version: "${pva}" }
              as: ProductionManager
              as_user_id: "pm-001"
          trigger:
            - call: "GET /broadcast-ops/productions"
              payload: { truck_id: "${truck_id}" }
              as: LeagueOperations
              as_user_id: "lo-001"
              captures: { only_id: "$.data[0].id" }
            - call: "GET /broadcast-ops/productions"
              payload: { event_tier: "TIER_2" }
              as: LeagueOperations
              as_user_id: "lo-001"
              captures: { tier2_id: "$.data[0].id" }
            - call: "GET /broadcast-ops/productions"
              payload: { status: "PLANNED", limit: 2, offset: 2 }
              as: LeagueOperations
              as_user_id: "lo-001"
              captures: { page_id: "$.data[0].id" }
          assert:
            - "truck_id filter: total_count == 1 and data[0].id == ${prod_a}"
            - "event_tier filter: total_count == 1 and data[0].id == ${prod_c}"
            - "status=PLANNED with limit 2 offset 2: total_count == 3, exactly 1 row returned, has_more == false"
            - "Production.${prod_a}.status == PLANNED even though it holds a truck (no approved survey, so provisioning cannot promote it)"

      - name: venue_survey_subresource_listing_is_scoped_to_its_parent
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /broadcast-ops/productions/{id}/venue-surveys]
          - entities.VenueSurvey.fields.production_id
        distinguishing_aspect: |
          Two productions each own one survey; each parent listing must return only its own child even
          though both rows live in one table, and the same child must be reachable by its own id. A
          handler that ignores the path id returns 2 rows for each parent.
        test_recipe:
          setup:
            - "Two TIER_3 productions, each with one DRAFT survey."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_a: $.data.id }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Harbor Dome", venue_power_capacity_amps: 400, venue_roof_type: "DOMED", venue_curfew_utc: "2026-08-20T06:00:00Z", scheduled_start_utc: "2026-08-19T18:00:00Z", scheduled_end_utc: "2026-08-19T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_b: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_a}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_a: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_b}", surveyor_name: "K. Ozawa", fiber_drops_required: 3 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_b: $.data.id }
          trigger:
            - call: "GET /broadcast-ops/productions/${prod_a}/venue-surveys"
              as: UnionSteward
              as_user_id: "us-001"
              captures: { a_first: "$.data[0].id" }
            - call: "GET /broadcast-ops/productions/${prod_b}/venue-surveys"
              payload: { status: "DRAFT" }
              as: UnionSteward
              as_user_id: "us-001"
              captures: { b_first: "$.data[0].id" }
            - call: "GET /broadcast-ops/venue-surveys/${survey_b}"
              as: UnionSteward
              as_user_id: "us-001"
              captures: { b_parent: $.data.production_id }
          assert:
            - "Parent A listing: total_count == 1 and data[0].id == ${survey_a}"
            - "Parent B listing filtered to DRAFT: total_count == 1 and data[0].id == ${survey_b}"
            - "VenueSurvey.${survey_b}.production_id == ${prod_b} and fiber_drops_required == 3"

      - name: production_read_exposes_both_readiness_variants
        claim_type: computed_read
        grounds:
          - endpoints[GET /broadcast-ops/productions/{id}]
          - calculations.production_readiness_score
        excluded_because:
          difficulty_instance: dual_variant_calc / production_readiness_preflight_versus_certified_diverge
          rationale: "That instance reads the production and asserts both readiness_score_preflight and readiness_score_certified against pre-computed literals at two different points in the workflow, which is the computed-read claim for this endpoint."

      - name: show_execution_creation_is_a_conditional_action
        claim_type: conditional_action
        grounds:
          - endpoints[POST /broadcast-ops/show-executions]
          - validations[priority=19]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / show_execution_creation_depends_on_production_stage
          rationale: "That instance fires the same creation payload at PLANNED, SURVEYED and PROVISIONED productions and asserts the two refusals and the one success, which is exactly the conditional-action claim."

  # ===========================================================================
  # Error triggerability. Every id in the 1.6 catalog is reached by some instance in
  # SCAFFOLD_DIFFICULTY_DESIGN.yaml or in this file; the instances below close the ids that no
  # other recipe happens to touch (the not-found family, the pagination bound, ERR_PREP_STATE_INVALID)
  # and the rbac section below closes the four 401/403 ids.
  - section: errors
    instances:
      - name: pagination_bounds_outside_their_range_rejected
        claim_type: error_triggerability
        grounds:
          - validations[priority=1]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          limit and offset are the only query parameters with declared bounds (1..100 and >= 0), and
          both edges must be policed on a listing that would otherwise succeed: limit 100 and offset 0
          are accepted, limit 101 and offset -1 are refused with ERR_INVALID_REQUEST at HTTP 400 rather
          than being silently clamped.
        test_recipe:
          setup:
            - "One truck registered, so the listing is non-empty."
          setup_api_calls:
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-01", tier_rating: "TIER_2", camera_channel_capacity: 8, power_draw_amps: 90, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck_id: $.data.id }
          trigger:
            - call: "GET /broadcast-ops/trucks"
              payload: { limit: 100, offset: 0 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { ok_first: "$.data[0].id" }
            - call: "GET /broadcast-ops/trucks"
              payload: { limit: 101 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err_limit: $.data.error_id }
            - call: "GET /broadcast-ops/trucks"
              payload: { offset: -1 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err_offset: $.data.error_id }
          assert:
            - "limit 100 / offset 0: HTTP 200, total_count == 1, data[0].id == ${truck_id}, has_more == false"
            - "limit 101: HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "offset -1: HTTP 400 with error_id == ERR_INVALID_REQUEST"

      - name: revalidating_an_already_validated_prep_rejected
        claim_type: error_triggerability
        grounds:
          - validations[priority=24]
          - errors[ERR_PREP_STATE_INVALID]
        distinguishing_aspect: |
          validate-feed is the one endpoint that is re-runnable from FAILED but not from VALIDATED, so
          the second call on a VALIDATED prep must be a 409 ERR_PREP_STATE_INVALID and must not
          increment the feed's active_consumer_count a second time - the ledger is the tell for an
          implementation that treats the retry as idempotent instead of refusing it.
        test_recipe:
          setup:
            - "One PLANNED production, one ACTIVE 120 ms feed, one GRAPHICS prep validated once."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/data-feeds"
              payload: { provider_code: "STATSPRO", feed_kind: "LIVE_STATS", latency_ms: 120, contract_expiry_utc: "2026-12-31T00:00:00Z", max_concurrent_consumers: 4 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { feed_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "GRAPHICS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep_id: $.data.id }
            - call: "POST /broadcast-ops/system-preps/${prep_id}/validate-feed"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { st1: $.data.status }
          trigger:
            - call: "POST /broadcast-ops/system-preps/${prep_id}/validate-feed"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err: $.data.error_id }
          assert:
            - "First validation: SystemPrep.${prep_id}.status == VALIDATED with feed_validated_at == 2026-08-01T00:00:00.000Z and DataFeed.${feed_id}.active_consumer_count == 1"
            - "Second validation: HTTP 409 with error_id == ERR_PREP_STATE_INVALID"
            - "DataFeed.${feed_id}.active_consumer_count is still 1 (the refused retry consumed no slot)"
            - "SystemPrep.${prep_id}.feed_validated_at is unchanged"

      - name: unknown_path_ids_return_the_entity_specific_not_found
        claim_type: error_triggerability
        grounds:
          - errors[ERR_PRODUCTION_NOT_FOUND]
          - errors[ERR_TRUCK_NOT_FOUND]
          - errors[ERR_SURVEY_NOT_FOUND]
          - errors[ERR_BOOKING_NOT_FOUND]
          - errors[ERR_CREW_CALL_NOT_FOUND]
          - errors[ERR_FEED_NOT_FOUND]
          - errors[ERR_PREP_NOT_FOUND]
          - errors[ERR_REHEARSAL_NOT_FOUND]
        distinguishing_aspect: |
          Eight different 404 ids share one shape, and a lazy implementation collapses them into a
          single generic not-found. Each read is issued with a syntactically valid UUID that belongs to
          no row, so the only thing distinguishing the responses is the id the handler chooses - and
          the entity family must be inferred from the path, not from the (identical) payload.
        test_recipe:
          setup:
            - "Empty database; no row of any kind exists."
          setup_api_calls: []
          trigger:
            - call: "GET /broadcast-ops/productions/00000000-0000-4000-8000-000000000001"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { e_prod: $.data.error_id }
            - call: "GET /broadcast-ops/trucks/00000000-0000-4000-8000-000000000002"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { e_truck: $.data.error_id }
            - call: "GET /broadcast-ops/venue-surveys/00000000-0000-4000-8000-000000000003"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { e_survey: $.data.error_id }
            - call: "GET /broadcast-ops/path-bookings/00000000-0000-4000-8000-000000000004"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { e_booking: $.data.error_id }
            - call: "GET /broadcast-ops/crew-calls/00000000-0000-4000-8000-000000000005"
              as: UnionSteward
              as_user_id: "us-001"
              captures: { e_call: $.data.error_id }
            - call: "GET /broadcast-ops/data-feeds/00000000-0000-4000-8000-000000000006"
              as: LeagueOperations
              as_user_id: "lo-001"
              captures: { e_feed: $.data.error_id }
            - call: "GET /broadcast-ops/system-preps/00000000-0000-4000-8000-000000000007"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { e_prep: $.data.error_id }
            - call: "GET /broadcast-ops/rehearsals/00000000-0000-4000-8000-000000000008"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { e_reh: $.data.error_id }
          assert:
            - "Every call returns HTTP 404 with the standard error envelope (error_id, message, request_id)"
            - "error_ids in order: ERR_PRODUCTION_NOT_FOUND, ERR_TRUCK_NOT_FOUND, ERR_SURVEY_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_CREW_CALL_NOT_FOUND, ERR_FEED_NOT_FOUND, ERR_PREP_NOT_FOUND, ERR_REHEARSAL_NOT_FOUND"
            - "No single generic not-found id is reused across the eight families - each response carries the id declared for that entity"

  # ===========================================================================
  - section: rbac
    instances:
      - name: technical_director_cannot_assign_the_production_truck
        claim_type: role_exclusive_operation
        grounds:
          - roles.ProductionManager.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Truck assignment sits on the ProductionManager side of the peer split even though the
          TechnicalDirector owns almost every other write against the same production, so the refusal
          must be a 403 ERR_UNAUTHORIZED decided before any body validation - the payload carries a
          perfectly valid truck_id and a perfectly fresh version, and the truck must still be AVAILABLE
          afterwards.
        test_recipe:
          setup:
            - "One PLANNED production and one AVAILABLE TIER_2 truck."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-01", tier_rating: "TIER_2", camera_channel_capacity: 8, power_draw_amps: 90, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck_id: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/productions/${prod_id}/truck-assignment"
              payload: { truck_id: "${truck_id}", expected_production_version: "${pv1}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err: $.data.error_id }
            - call: "POST /broadcast-ops/productions/${prod_id}/truck-assignment"
              payload: { truck_id: "${truck_id}", expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { assigned_truck: $.data.truck_id }
          assert:
            - "TechnicalDirector attempt: HTTP 403 with error_id == ERR_UNAUTHORIZED"
            - "ProductionTruck.${truck_id}.status is still AVAILABLE and Production.${prod_id}.truck_id is still null after the refusal"
            - "Production.${prod_id}.version is still ${pv1} after the refusal (a rejected write must not consume the OCC token)"
            - "The identical ProductionManager call then succeeds with HTTP 200, truck_id == ${truck_id} and version == ${pv1} + 1"

      - name: crew_member_cannot_respond_to_another_members_call
        claim_type: row_scoped_identity
        grounds:
          - roles.CrewMember.identity
          - validations[priority=15]
          - errors[ERR_NOT_CALL_OWNER]
        distinguishing_aspect: |
          CrewMember is the one entity-backed role: X-User-ID is a CrewMember row id, so authorisation
          is per-row rather than per-endpoint. The wrong member holds the right role and is refused
          with ERR_NOT_CALL_OWNER (403), which is distinct from ERR_UNAUTHORIZED, and the call stays
          OFFERED so the rightful member can still accept it afterwards.
        test_recipe:
          setup:
            - "One PLANNED production and two TIER_3-certified staff members; one OFFERED call to member 1."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Dana Reyes", position: "TD", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm1_id: $.data.id }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Milo Fisk", position: "CAM_OP", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm2_id: $.data.id }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T14:00:00Z", scheduled_release_utc: "2026-08-16T00:00:00Z", expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call1_id: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/crew-calls/${call1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: CrewMember
              as_user_id: "${cm2_id}"
              captures: { err: $.data.error_id }
            - call: "POST /broadcast-ops/crew-calls/${call1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: CrewMember
              as_user_id: "${cm1_id}"
              captures: { st: $.data.status }
          assert:
            - "Wrong member: HTTP 403 with error_id == ERR_NOT_CALL_OWNER (not ERR_UNAUTHORIZED - the role itself is permitted on this endpoint)"
            - "CrewCall.${call1_id}.status is still OFFERED after the refusal and Production.${prod_id}.labor_committed_cents is unchanged at 104000"
            - "Rightful member: HTTP 200 with status == ACCEPTED"

      - name: blank_identity_headers_rejected_as_unauthenticated
        claim_type: authentication_required
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Authentication is checked before authorisation and before the 404: a missing or empty
          X-User-ID, or a missing X-User-Role, is a 401 ERR_UNAUTHENTICATED even on a path whose id
          does not exist, while a syntactically present but undeclared role is a 403 ERR_UNAUTHORIZED.
          The ordering is what distinguishes a correct gate from one that resolves the row first.
        test_recipe:
          setup:
            - "One PLANNED production so a legitimate read is available for the control call."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
          trigger:
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: ""
              captures: { e_blank_id: $.data.error_id }
            - call: "GET /broadcast-ops/productions/00000000-0000-4000-8000-000000000009"
              as: ""
              as_user_id: "pm-001"
              captures: { e_blank_role: $.data.error_id }
            - call: "GET /broadcast-ops/productions/00000000-0000-4000-8000-000000000009"
              as: "Producer"
              as_user_id: "pm-001"
              captures: { e_bad_role: $.data.error_id }
          assert:
            - "Empty X-User-ID with a valid role: HTTP 401 with error_id == ERR_UNAUTHENTICATED"
            - "Empty X-User-Role on a non-existent id: HTTP 401 with error_id == ERR_UNAUTHENTICATED (401 precedes the 404)"
            - "Undeclared role Producer on a non-existent id: HTTP 403 with error_id == ERR_UNAUTHORIZED (403 also precedes the 404)"
            - "A whitespace-only X-User-ID behaves exactly like the empty one: HTTP 401 ERR_UNAUTHENTICATED"

      - name: survey_review_by_the_submitting_operator_rejected
        claim_type: segregation_of_duties
        grounds:
          - state_machines.VenueSurvey.SUBMITTED_to_APPROVED.preconditions
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          The segregation check compares X-User-ID across a role boundary: the submitter id belongs to
          a TechnicalDirector and the reviewer must be a LeagueOperations, so an implementation that
          only compares roles never fires this rule. Reviewing with the submitter's id is a 403 even
          though the role is correct, and the survey must remain SUBMITTED and reviewable afterwards.
        test_recipe:
          setup:
            - "A production with a one-position SUBMITTED survey, submitted by td-001."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "CAM-1", position_type: "HARD", cable_run_feet: 150, power_draw_amps: 30 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/submit"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { submitter: $.data.submitted_by_user_id }
          trigger:
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/review"
              payload: { decision: "APPROVE" }
              as: LeagueOperations
              as_user_id: "td-001"
              captures: { err: $.data.error_id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/review"
              payload: { decision: "APPROVE", notes: "Plot cleared." }
              as: LeagueOperations
              as_user_id: "lo-001"
              captures: { st: $.data.status }
          assert:
            - "VenueSurvey.${survey_id}.submitted_by_user_id == td-001 after submit"
            - "Review as td-001: HTTP 403 with error_id == ERR_SEGREGATION_OF_DUTIES"
            - "VenueSurvey.${survey_id}.status is still SUBMITTED and reviewed_by_user_id is still null; Production.${prod_id}.status is still PLANNED"
            - "Review as lo-001: HTTP 200, status == APPROVED, reviewed_by_user_id == lo-001, and Production.${prod_id}.status == SURVEYED"

