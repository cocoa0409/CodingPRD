              payload: {}
              as: RouteOperator
          assert:
            - "Dispatch with zero stops returns ERR_ROUTE_HAS_NO_STOPS"
            - "After adding exactly one stop, dispatch succeeds (status == DISPATCHED)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
