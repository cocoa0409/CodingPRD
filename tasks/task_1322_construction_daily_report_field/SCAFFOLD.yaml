  - { method: POST, path: "/tm-tickets/{id}/submit-for-signature", description: "DRAFT -> PENDING_SIGNATURES (requires total_cents > 0)", roles: [Superintendent], code: 200, input: [], output: TmTicket, side_effects: ["increments DailyReport.version by 1"] }
