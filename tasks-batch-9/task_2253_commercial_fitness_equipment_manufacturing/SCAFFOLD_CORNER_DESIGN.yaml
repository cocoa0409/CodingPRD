    distinguishing_aspect: 'One code, two distinct causes: qualifying at verified 300000 against a 500000 gate is refused, and qualifying at verified 500000 is STILL refused while a RESERVED run is outstanding.
      Aborting that run (its cycles leave the input set) lets the same qualify call succeed.'
    test_recipe:
      setup:
      - Revision T900-R1 (FULL_COMMERCIAL, min_required_cycles 500000) is IN_TESTING on a 2-station rig.
