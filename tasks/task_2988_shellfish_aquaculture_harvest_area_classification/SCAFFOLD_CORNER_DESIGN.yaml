            - "Hatchery H-OK: certificate_expires_on 2027-03-31, pathogen_free_species [CRASSOSTREA_VIRGINICA] only."
            - "Logical clock 2026-08-01T00:00:00Z; DISEASE_CERT_MAX_AGE_DAYS is 30."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
