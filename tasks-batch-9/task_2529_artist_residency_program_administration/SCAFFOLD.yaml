      ACCEPT cascade; this endpoint covers follow-on residencies and re-opened sponsorships."
    roles: [VisaCoordinator, ProgramAdmin]
    code: 201
    input: [residency_id]
    output: VisaCase
    side_effects:
      - "runs calculations.visa_timeline to derive backlog_days, filing_deadline_date and earliest_entry_date"

  - method: GET
    path: "/visa-cases"
    description: "Lists visa cases (reverse reachability for VisaCase.residency_id)."
    roles: [VisaCoordinator, ProgramAdmin]
    code: 200
    input: ["residency_id?", "status?", "case_type?", "limit?", "offset?"]
    output: VisaCase[]
    side_effects: []

  - method: GET
    path: "/visa-cases/{id}"
    description: "Reads one visa case with its live timeline countdown."
    roles: [VisaCoordinator, ProgramAdmin]
    code: 200
    input: []
    output: VisaCase
    side_effects: []

  - method: POST
    path: "/visa-cases/{id}/docs"
    description: "REQUEST documents from the resident or SUBMIT them. Re-requesting after a submission
      opens another request-for-evidence round."
    roles: [VisaCoordinator]
    code: 200
    input: [action, doc_list]
    output: VisaCase
    side_effects:
      - "REQUEST sets requested_doc_list and, from DOCS_SUBMITTED, increments rfe_round"
      - "SUBMIT sets submitted_doc_list after checking it covers requested_doc_list"
      - "increments VisaCase.version by 1"

  - method: POST
    path: "/visa-cases/{id}/adjudication"
    description: "FILE the case with a consulate appointment date, then APPROVE or DENY it."
    roles: [VisaCoordinator]
    code: 200
    input: [action, "consulate_appointment_date?", "reason?"]
    output: VisaCase
    side_effects:
      - "FILE checks the filing deadline and the consulate-date window, and recomputes case_type from the session length"
      - "APPROVE unblocks the residency's CHECK_IN"
      - "increments VisaCase.version by 1"

  # ---------------------------------------------------------------- stipend disbursements
  - method: GET
    path: "/stipend-disbursements"
    description: "Lists disbursements (reverse reachability for StipendDisbursement.residency_id).
      Rows are only ever created by POST /residencies/{id}/stipend-schedule, so this list is their
      sole discovery channel."
    roles: [FinanceOfficer, ProgramAdmin, Applicant]
    code: 200
    input: ["residency_id?", "status?", "period_index?", "limit?", "offset?"]
    output: StipendDisbursement[]
    side_effects: []

  - method: GET
    path: "/stipend-disbursements/{id}"
    description: "Reads one disbursement with its withholding breakdown."
    roles: [FinanceOfficer, ProgramAdmin, Applicant]
    code: 200
    input: []
    output: StipendDisbursement
    side_effects: []

  - method: POST
    path: "/stipend-disbursements/{id}/settlement"
    description: "Settles a disbursement: PAY (withholding computed), VOID or REVERSE. Segregated -
      the payer may not be the scheduler and the reverser may not be the payer."
    roles: [FinanceOfficer]
    code: 200
    input: [action, "paid_on_date?", "reason?"]
    output: StipendDisbursement
    side_effects:
      - "PAY runs the withheld_actual variant of calculations.stipend_withholding, setting withholding_rate, cumulative_taxable_cents, withholding_cents, net_cents, paid_on_date and paid_by_user_id"
      - "PAY recomputes Residency.stipend_paid_gross_cents and withholding_to_date_cents"
      - "REVERSE removes the row from both residency ledgers while keeping its historical tax figures"
      - "increments StipendDisbursement.version by 1 and Residency.version by 1"

  # ---------------------------------------------------------------- obligations
  - method: GET
    path: "/obligations"
    description: "Lists engagement obligations (reverse reachability for Obligation.residency_id).
      Rows are only ever created by POST /residencies/{id}/schedule, so this list is their sole
      discovery channel."
    roles: [ProgramAdmin, Funder, Applicant]
    code: 200
    input: ["residency_id?", "obligation_type?", "status?", "limit?", "offset?"]
    output: Obligation[]
    side_effects: []

  - method: GET
    path: "/obligations/{id}"
    description: "Reads one obligation with its completion and attendance counters."
    roles: [ProgramAdmin, Funder, Applicant]
    code: 200
    input: []
    output: Obligation
    side_effects: []

  - method: POST
    path: "/obligations/{id}/progress"
    description: "LOG_COMPLETION records one delivered event with its attendance; WAIVE excuses the
      obligation entirely."
    roles: [ProgramAdmin]
    code: 200
    input: [action, "attendance?", "waived_reason?"]
    output: Obligation
    side_effects:
      - "LOG_COMPLETION increments completed_count and adds to total_attendance, driving PENDING -> SATISFIED at required_count"
      - "WAIVE sets status = WAIVED and waived_reason, removing the row from both residency obligation sums"
      - "recomputes Residency.obligations_required_total, obligations_completed_total and obligations_breached_count"
      - "increments Obligation.version by 1 and Residency.version by 1"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- authentication / authorization
  - id: ERR_MISSING_USER_ID
    http: 401
    condition: "X-User-ID header absent or empty"
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role header absent, or not one of the eight declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not permitted for the operation, the acting X-User-ID does not resolve to a row of the role's backing entity, or an entity-backed role is acting on a resource it does not own"
  - id: ERR_CHAIR_NOT_ELIGIBLE
    http: 403
    condition: "the acting PanelChair's backing Panelist row has chair_eligible == false"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting user is barred from this step because they performed an incompatible earlier step: a chair who reviewed in the cycle locking its slate, a FinanceOfficer paying a schedule they generated, or a FinanceOfficer reversing a payment they made"

  # ---- existence
  - id: ERR_CYCLE_NOT_FOUND
    http: 404
    condition: "no Cycle with the given id"
  - id: ERR_DISCIPLINE_NOT_FOUND
    http: 404
    condition: "no Discipline with the given id"
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "no Applicant with the given id"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "no Application with the given id"
  - id: ERR_PORTFOLIO_ITEM_NOT_FOUND
    http: 404
    condition: "no PortfolioItem with the given id"
  - id: ERR_PANELIST_NOT_FOUND
    http: 404
    condition: "no Panelist with the given id"
  - id: ERR_PANEL_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no PanelAssignment with the given id"
  - id: ERR_RESIDENCY_NOT_FOUND
    http: 404
    condition: "no Residency with the given id"
  - id: ERR_STUDIO_NOT_FOUND
    http: 404
    condition: "no Studio with the given id"
  - id: ERR_STUDIO_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no StudioAssignment with the given id"
  - id: ERR_HOUSING_UNIT_NOT_FOUND
    http: 404
    condition: "no HousingUnit with the given id"
  - id: ERR_HOUSING_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no HousingAssignment with the given id"
  - id: ERR_VISA_CASE_NOT_FOUND
    http: 404
    condition: "no VisaCase with the given id"
  - id: ERR_DISBURSEMENT_NOT_FOUND
    http: 404
    condition: "no StipendDisbursement with the given id"
  - id: ERR_OBLIGATION_NOT_FOUND
    http: 404
    condition: "no Obligation with the given id"

  # ---- request shape / integrity
  - id: ERR_VALIDATION
    http: 400
    condition: "a required body field is missing, has the wrong type, carries an unknown enum member, violates a declared numeric or string range, or a pagination parameter is out of bounds"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "a business key collides: Cycle.code, Applicant.email, Panelist.email, Studio.code or HousingUnit.code globally, or Discipline.code inside one cycle"
  - id: ERR_DUPLICATE_ASSOCIATION
    http: 409
    condition: "a second Application for the same (cycle_id, applicant_id), or a second PanelAssignment for the same (application_id, panelist_id)"
  - id: ERR_DISCIPLINE_CYCLE_MISMATCH
    http: 422
    condition: "the Discipline named by discipline_id belongs to a different Cycle than cycle_id"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "the supplied expected_residency_version or expected_housing_unit_version does not equal the parent's current version"

  # ---- state preconditions
  - id: ERR_CYCLE_STAGE_INVALID
    http: 409
    condition: "the requested Cycle stage transition is not an edge of the Cycle machine, or the cycle is not in the stage this operation requires (SCREENING for screening decisions, PANEL_REVIEW for panel work, SLATE_LOCKED for offer responses)"
  - id: ERR_CYCLE_NOT_OPEN
    http: 409
    condition: "an Application is created or first submitted, or a Discipline is added, while the Cycle is not in the required stage (OPEN for applications, DRAFT for disciplines)"
  - id: ERR_APPLICATION_STATE_INVALID
    http: 409
    condition: "the requested Application transition is not an edge from its current status, or the application is in a terminal status (REJECTED, ACCEPTED, DECLINED)"
  - id: ERR_APPLICATION_NOT_OFFERED
    http: 409
    condition: "an offer response is recorded on an Application whose status is not OFFERED"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "a REQUEST_REVISION decision on an Application that has already used MAX_REVISION_ROUNDS revision rounds"
  - id: ERR_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "the PanelAssignment, StudioAssignment or HousingAssignment is not in a status from which the requested operation is an edge (scoring a VACATED review, releasing an already RELEASED occupancy)"
  - id: ERR_PANELIST_RECUSED
    http: 409
    condition: "assigning or scoring with a Panelist whose status is RECUSED_FOR_CYCLE"
  - id: ERR_RESIDENCY_NOT_SCHEDULED
    http: 409
    condition: "an operation that requires Residency.status == SCHEDULED with a non-null session_start_date is attempted on a residency that is not scheduled"
  - id: ERR_RESIDENCY_STATE_INVALID
    http: 409
    condition: "the requested Residency lifecycle or compliance action is not an edge from its current status, including any action on a COMPLETED, TERMINATED or WITHDRAWN residency"
  - id: ERR_RESIDENCY_ALREADY_PAID
    http: 409
    condition: "rescheduling a Residency that already has a PAID StipendDisbursement"
  - id: ERR_VISA_STATE_INVALID
    http: 409
    condition: "the requested VisaCase action is not an edge from its current status, including any action on an APPROVED or DENIED case"
  - id: ERR_DISBURSEMENT_STATE_INVALID
    http: 409
    condition: "PAY or VOID on a disbursement that is not SCHEDULED, or REVERSE on one that is not PAID"
  - id: ERR_OBLIGATION_NOT_PENDING
    http: 409
    condition: "logging a completion or waiving an Obligation whose status is not PENDING"
  - id: ERR_FACILITY_UNAVAILABLE
    http: 409
    condition: "the named Studio or HousingUnit is not in status AVAILABLE"

  # ---- safety / compliance
  - id: ERR_TRAINING_TYPE_NOT_REQUIRED
    http: 422
    condition: "the training_type being recorded is not a member of Residency.required_training_types"
  - id: ERR_TRAINING_NOT_COMPLETE
    http: 422
    condition: "check-in on a residency whose compliance_status is not CLEARED, or a REINSTATE while required_training_types is not fully covered"
  - id: ERR_COMPLIANCE_SUSPENDED
    http: 422
    condition: "assigning a studio to, or paying a disbursement of, a residency whose compliance_status is SUSPENDED"
  - id: ERR_STUDIO_CAPABILITY_MISMATCH
    http: 422
    condition: "the studio's capability_tags do not cover the residency discipline's required_capability_tags"
  - id: ERR_VENTILATION_INSUFFICIENT
    http: 422
    condition: "the studio's ventilation_class ranks below the discipline's required_ventilation_class, or below FUME_HOOD when the source application declared hazardous materials"

  # ---- cross-entity referential
  - id: ERR_VISA_NOT_APPROVED
    http: 422
    condition: "checking in an international resident whose VisaCase is not APPROVED"
  - id: ERR_VISA_NOT_REQUIRED
    http: 422
    condition: "opening a VisaCase for a domestic residency, or a second VisaCase for a residency that already has one"
  - id: ERR_VISA_DOCS_INCOMPLETE
    http: 422
    condition: "a SUBMIT docs action whose doc_list does not cover every member of requested_doc_list"
  - id: ERR_PREDECESSOR_NOT_COMPLETED
    http: 422
    condition: "predecessor_residency_id names a Residency that is not COMPLETED, or one belonging to a different applicant"

  # ---- temporal
  - id: ERR_SUBMISSION_WINDOW_CLOSED
    http: 422
    condition: "a first submission outside the inclusive window [Cycle.open_at, Cycle.close_at] on the logical clock"
  - id: ERR_SESSION_LENGTH_NOT_OFFERED
    http: 422
    condition: "a requested or scheduled session length that is not a member of Cycle.session_length_options_weeks"
  - id: ERR_SESSION_START_IN_PAST
    http: 422
    condition: "session_start_date earlier than the logical clock's current date"
  - id: ERR_ASSIGNMENT_OUTSIDE_SESSION
    http: 422
    condition: "a studio or housing window that is not fully contained in the residency's session dates"
  - id: ERR_STUDIO_INTERVAL_CONFLICT
    http: 409
    condition: "the requested window on a single-occupancy studio overlaps an ACTIVE assignment of that studio under closed-interval semantics extended by STUDIO_TURNAROUND_DAYS"
  - id: ERR_HOUSING_INTERVAL_CONFLICT
    http: 409
    condition: "the requested housing window shares a night with the ACTIVE assignment of a single-bed unit under half-open semantics (adjacency is allowed)"
  - id: ERR_VISA_FILING_DEADLINE_PASSED
    http: 422
    condition: "a FILE action after VisaCase.filing_deadline_date on the logical clock"
  - id: ERR_CONSULATE_DATE_OUT_OF_WINDOW
    http: 422
    condition: "consulate_appointment_date is before the current date or after VisaCase.earliest_entry_date"
  - id: ERR_DISBURSEMENT_OUT_OF_ORDER
    http: 409
    condition: "paying a disbursement while a lower period_index of the same residency is still SCHEDULED"

  # ---- domain constraints
  - id: ERR_PORTFOLIO_ITEM_COUNT
    http: 422
    condition: "the application's portfolio item count is outside [portfolio_min_items, portfolio_max_items] at submission, or adding an item would exceed portfolio_max_items"
  - id: ERR_PORTFOLIO_MEDIA_MISSING
    http: 422
    condition: "a member of Discipline.required_media_types is absent from the application's portfolio at submission"
  - id: ERR_FEE_UNSETTLED
    http: 422
    condition: "submitting an application whose fee_status is still PENDING"
  - id: ERR_FEE_WAIVER_NOT_ELIGIBLE
    http: 422
    condition: "a WAIVE fee resolution when the applicant did not request a waiver, or their declared_annual_income_cents exceeds FEE_WAIVER_INCOME_CEILING_CENTS"
  - id: ERR_FEE_ALREADY_SETTLED
    http: 409
    condition: "a second fee resolution on an application whose fee_status is already PAID or WAIVED"
  - id: ERR_MEAL_PLAN_NOT_AVAILABLE
    http: 422
    condition: "meal_plan_selected is true for a HousingUnit whose meal_plan_included is false"
  - id: ERR_AFFILIATION_CONFLICT
    http: 422
    condition: "a Panelist whose affiliation_org equals the Applicant's affiliation_org records scores instead of declaring the conflict"
  - id: ERR_PANEL_REVIEW_INCOMPLETE
    http: 409
    condition: "locking the slate while Cycle.panel_review_complete is false"
  - id: ERR_DISCIPLINE_MINIMUM_UNFILLABLE
    http: 422
    condition: "a Discipline of the cycle has fewer slate-eligible Applications than its cohort_min_slots when the slate is allocated (including the empty-candidate-set case)"
  - id: ERR_ALUMNI_RESERVE_EXCEEDS_COHORT
    http: 422
    condition: "ceil(alumni_reserve_pct * cohort_target_size) exceeds cohort_target_size at slate allocation"
  - id: ERR_COHORT_MINIMUMS_EXCEED_TARGET
    http: 422
    condition: "opening a cycle with no Discipline rows, or whose disciplines' cohort_min_slots sum exceeds cohort_target_size"
  - id: ERR_NO_STUDIO_AVAILABLE
    http: 409
    condition: "no Studio survives the auto-selection eligibility filter when studio_id is omitted"
  - id: ERR_OBLIGATIONS_OUTSTANDING
    http: 422
    condition: "paying the highest-period_index disbursement of a residency whose obligations_breached_count is greater than 0"

  # ---- capacity / fiscal (always the last checks)
  - id: ERR_STUDIO_CAPACITY_EXCEEDED
    http: 409
    condition: "on a shared studio the ACTIVE assignments covering one date of the requested window would exceed Studio.max_concurrent_residents, even though every individual overlap is legal"
  - id: ERR_HOUSING_CAPACITY_EXCEEDED
    http: 409
    condition: "on a multi-bed unit the ACTIVE assignments covering one night of the requested window would reach HousingUnit.bed_count, even though every individual overlap is legal"
  - id: ERR_NO_SLOTS_AVAILABLE
    http: 409
    condition: "accepting an offer or promoting from the waitlist while Cycle.slots_open_count is 0"
  - id: ERR_STIPEND_POOL_EXHAUSTED
    http: 409
    condition: "the stipend the operation would commit exceeds Cycle.stipend_uncommitted_cents"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
# role_model: segregation_of_duties
#   * a Panelist who scored (or declared a conflict) in a cycle cannot chair that cycle's slate lock
#   * the FinanceOfficer who generated a stipend schedule cannot mark its rows PAID
#   * the FinanceOfficer who paid a row cannot reverse it
# PanelChair and Panelist share one backing entity (Panelist); the chair privilege is the
# chair_eligible flag on that row, so a chair is always also a potential reviewer - which is exactly
# what makes the segregation rule bite.
roles:

  - name: ProgramAdmin
    description: "Program staff who configure cycles and disciplines, screen applications, resolve
      application fees, schedule residencies, drive residency lifecycle, provision housing and settle
      engagement obligations."
    identity: opaque
    exclusive_operations:
      - "POST /cycles, PATCH /cycles/{id}, POST /cycles/{id}/stage"
      - "POST /disciplines"
      - "POST /panelists, PATCH /panelists/{id}"
      - "POST /applications/{id}/fee-resolution"
      - "POST /applications/{id}/screening-decision"
      - "POST /residencies, POST /residencies/{id}/schedule"
      - "POST /housing-units, PATCH /housing-units/{id}"
      - "POST /housing-assignments, POST /housing-assignments/{id}/release"
      - "POST /obligations/{id}/progress"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /applicants, PATCH /applicants/{id} (with Applicant)"
      - "POST /applications, PATCH /applications/{id}, POST /applications/{id}/submit, POST /applications/{id}/offer-response (with Applicant)"
      - "POST /portfolio-items, DELETE /portfolio-items/{id} (with Applicant)"
      - "POST /panel-assignments (with PanelChair)"
      - "POST /residencies/{id}/lifecycle (with Applicant, whose only action is WITHDRAW)"
      - "POST /residencies/{id}/compliance, POST /residencies/{id}/trainings (with FacilitiesManager)"
      - "POST /studios, POST /studio-assignments, POST /studio-assignments/{id}/release (with FacilitiesManager)"
      - "POST /visa-cases (with VisaCoordinator)"
      - "all GET endpoints except the panel-scoring reads reserved to reviewers"

  - name: Applicant
    description: "The artist. Self-service only: their own profile, their own application and portfolio,
      their own offer response, and withdrawing from their own residency."
    identity: "entity_backed:Applicant"
    exclusive_operations: []
    shared_operations:
      - "POST /applicants, PATCH /applicants/{id} (own row only)"
      - "POST /applications, PATCH /applications/{id}, POST /applications/{id}/submit, POST /applications/{id}/offer-response (own applications only)"
      - "POST /portfolio-items, DELETE /portfolio-items/{id} (own applications only)"
      - "POST /residencies/{id}/lifecycle with action=WITHDRAW (own residency only)"
      - "GET /disciplines, GET /disciplines/{id}, GET /applicants/{id}, GET /applications, GET /applications/{id}, GET /portfolio-items, GET /portfolio-items/{id}, GET /residencies, GET /residencies/{id}, GET /stipend-disbursements, GET /stipend-disbursements/{id}, GET /obligations, GET /obligations/{id}"

  - name: Panelist
    description: "A selection-panel reviewer. Records rubric scores on their own assignments and declares
      conflicts of interest."
    identity: "entity_backed:Panelist"
    exclusive_operations:
      - "POST /panel-assignments/{id}/scores"
      - "POST /panel-assignments/{id}/declare-conflict"
    shared_operations:
      - "GET /disciplines, GET /disciplines/{id}, GET /applications, GET /applications/{id}, GET /portfolio-items, GET /portfolio-items/{id}, GET /panelists/{id}, GET /panel-assignments, GET /panel-assignments/{id}"

  - name: PanelChair
    description: "A chair-eligible panelist who locks a cycle's slate. Must not have reviewed in the
      cycle they are locking."
    identity: "entity_backed:Panelist"
    exclusive_operations:
      - "POST /cycles/{id}/lock-slate"
    shared_operations:
      - "POST /panel-assignments (with ProgramAdmin)"
      - "GET /cycles, GET /cycles/{id}, GET /disciplines, GET /disciplines/{id}, GET /applicants, GET /applicants/{id}, GET /applications, GET /applications/{id}, GET /portfolio-items, GET /portfolio-items/{id}, GET /panelists, GET /panelists/{id}, GET /panel-assignments, GET /panel-assignments/{id}"

  - name: FinanceOfficer
    description: "Generates stipend schedules and settles disbursements, with the payer and the
      scheduler kept apart and the reverser kept apart from the payer."
    identity: opaque
    exclusive_operations:
      - "POST /residencies/{id}/stipend-schedule"
      - "POST /stipend-disbursements/{id}/settlement"
    shared_operations:
      - "GET /cycles, GET /cycles/{id}, GET /applicants, GET /applicants/{id}, GET /residencies, GET /residencies/{id}, GET /residencies/{id}/tax-report, GET /stipend-disbursements, GET /stipend-disbursements/{id}"

  - name: VisaCoordinator
    description: "Runs visa sponsorship: requests and receives documents, files with the consulate and
      records the adjudication."
    identity: opaque
    exclusive_operations:
      - "POST /visa-cases/{id}/docs"
      - "POST /visa-cases/{id}/adjudication"
    shared_operations:
      - "POST /visa-cases (with ProgramAdmin)"
      - "GET /cycles, GET /cycles/{id}, GET /applicants, GET /applicants/{id}, GET /residencies, GET /residencies/{id}, GET /visa-cases, GET /visa-cases/{id}"

  - name: FacilitiesManager
    description: "Owns studios, studio occupancy, equipment training records and the residency
      compliance axis."
    identity: opaque
    exclusive_operations:
      - "PATCH /studios/{id}"
    shared_operations:
      - "POST /studios, POST /studio-assignments, POST /studio-assignments/{id}/release (with ProgramAdmin)"
      - "POST /residencies/{id}/compliance, POST /residencies/{id}/trainings (with ProgramAdmin)"
      - "GET /cycles, GET /cycles/{id}, GET /disciplines, GET /disciplines/{id}, GET /residencies, GET /residencies/{id}, GET /studios, GET /studios/{id}, GET /studio-assignments, GET /studio-assignments/{id}, GET /housing-units, GET /housing-units/{id}, GET /housing-assignments, GET /housing-assignments/{id}"

  - name: Funder
    description: "Read-only outcome oversight for the funding body. Sees aggregate outcomes and the
      residency record, never the scoring detail and never any money-settlement endpoint."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /cycles, GET /cycles/{id}, GET /cycles/{id}/funder-outcome-report"
      - "GET /disciplines, GET /disciplines/{id}, GET /applications, GET /applications/{id}"
      - "GET /residencies, GET /residencies/{id}, GET /studios, GET /studios/{id}, GET /studio-assignments, GET /studio-assignments/{id}"
      - "GET /obligations, GET /obligations/{id}"
