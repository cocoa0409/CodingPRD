              as: EligibilityOfficer
            - call: "POST /registry/burial-cases/${case_a}/assign-plot"
              payload: { unit_id: "${grv_id}", unit_type: "GRAVESITE", expected_gravesite_version: "${g_v0}" }
              as: SchedulingClerk
          trigger:
            - call: "POST /registry/burial-cases/${case_b}/assign-plot"
              payload: { unit_id: "${grv_id}", unit_type: "GRAVESITE", expected_gravesite_version: "${g_v0}" }
              as: SchedulingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "error_id == ERR_STALE_GRAVESITE_VERSION"

      - name: occ_stale_pmc_version_on_approve
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[preneed-approve-stale-pmc]", "errors[ERR_STALE_PMC_VERSION]"]
        distinguishing_aspect: "A PMC is denied (version advances from ${pmc_v0}). A subsequent approve carrying the pre-deny version ${pmc_v0} is rejected with ERR_STALE_PMC_VERSION (412)."
        test_recipe:
          setup: ["US cemetery; PRE_NEED VETERAN case approved (ELIGIBLE) with a PENDING PMC (version captured at creation). PMC then DENIED."]
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "OccPmc National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "PRE_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
            - call: "POST /registry/pre-need-determinations"
              payload: { burial_case_id: "${case_id}" }
              as: EligibilityOfficer
              captures: { pmc_id: $.data.id, pmc_v0: $.data.version }
            - call: "POST /registry/pre-need-determinations/${pmc_id}/deny"
              payload: {}
              as: EligibilityOfficer
          trigger:
            - call: "POST /registry/pre-need-determinations/${pmc_id}/approve"
              payload: { expected_pmc_version: "${pmc_v0}" }
              as: EligibilityOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "error_id == ERR_STALE_PMC_VERSION"

      - name: preneed_approved_to_reserved_on_interment_complete
        claim_type: cascading_side_effects
        grounds: [state_machines.PreNeedDetermination.APPROVED_to_RESERVED, state_machines.BurialCase.SCHEDULED_to_INTERRED]
        distinguishing_aspect: "Completing the interment of a PRE_NEED case cascades its APPROVED PMC to RESERVED (pre-need reservation fulfilled); assign-plot alone leaves the PMC APPROVED."
        test_recipe:
          setup: ["Clock 2026-05-01. US cemetery, IN_GROUND section + STANDARD gravesite. PRE_NEED VETERAN case approved (ELIGIBLE) with an APPROVED PMC (not expired), then assigned, scheduled, and the interment completed."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: NCA_Admin
            - call: "POST /registry/cemeteries"
              payload: { name: "Reserve National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "PRE_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
            - call: "POST /registry/pre-need-determinations"
              payload: { burial_case_id: "${case_id}" }
              as: EligibilityOfficer
              captures: { pmc_id: $.data.id, pmc_v0: $.data.version }
            - call: "POST /registry/pre-need-determinations/${pmc_id}/approve"
              payload: { expected_pmc_version: "${pmc_v0}" }
              as: EligibilityOfficer
            - call: "POST /registry/burial-cases/${case_id}/assign-plot"
              payload: {}
              as: SchedulingClerk
            - call: "POST /registry/interment-schedules"
              payload: { burial_case_id: "${case_id}", window_start: "2026-06-10T10:00:00Z", window_end: "2026-06-10T12:00:00Z" }
              as: SchedulingClerk
              captures: { sched_id: $.data.id }
          trigger:
            - call: "POST /registry/interment-schedules/${sched_id}/complete"
              payload: {}
              as: SchedulingClerk
          assert:
            - "response status == 200"
            - "BurialCase.${case_id}.status == INTERRED"
            - "Gravesite.${grv_id}.status == OCCUPIED"
            - "PreNeedDetermination.${pmc_id}.status == RESERVED"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: assign_plot_side_effects_visible_in_same_response
        claim_type: immediate
        grounds: [state_machines.BurialCase.ELIGIBLE_to_ASSIGNED, calculations.section_inventory]
        distinguishing_aspect: "assign-plot's response already reflects the case ASSIGNED and, on immediate re-read, Section.available_units decremented — no eventual lag."
        test_recipe:
          setup: ["US cemetery, IN_GROUND section + one STANDARD gravesite (available_units=1); VETERAN case approved (ELIGIBLE)."]
          setup_api_calls:
            - call: "POST /registry/cemeteries"
              payload: { name: "Immediate National", country_code: "US", honors_squad_capacity: 1 }
              as: NCA_Admin
              captures: { cem_id: $.data.id }
            - call: "POST /registry/sections"
              payload: { cemetery_id: "${cem_id}", code: "A", kind: "IN_GROUND" }
              as: NCA_Admin
              captures: { sec_id: $.data.id }
            - call: "POST /registry/gravesites"
              payload: { section_id: "${sec_id}", grid_ref: "R1C1", gravesite_class: "STANDARD", depth_capacity: 1 }
              as: NCA_Admin
              captures: { grv_id: $.data.id }
            - call: "POST /registry/burial-cases"
              payload: { cemetery_id: "${cem_id}", case_type: "AT_NEED", applicant_role: "VETERAN", requested_class: "STANDARD", character_of_discharge: "HONORABLE", service_days: 3650 }
              as: EligibilityOfficer
              captures: { case_id: $.data.id }
            - call: "POST /registry/burial-cases/${case_id}/eligibility"
              payload: {}
              as: EligibilityOfficer
          trigger:
            - call: "POST /registry/burial-cases/${case_id}/assign-plot"
              payload: {}
              as: SchedulingClerk
            - call: "GET /registry/sections/${sec_id}"
              payload: {}
              as: SchedulingClerk
          assert:
            - "assign-plot response: BurialCase.${case_id}.status == ASSIGNED"
            - "Section.${sec_id}.available_units == 0"
            - "Gravesite.${grv_id}.status == RESERVED"

  # ===========================================================================
  # Stubs — corners already exercised as the failure/success path of a §1.8 instance
  # ===========================================================================
  - section: state_machines
    instances:
      - name: preneed_expire_sweep_releases_reserved_unit_stub
        claim_type: Side Effect Execution
        grounds: [state_machines.PreNeedDetermination.APPROVED_to_EXPIRED]
        excluded_because:
          difficulty_instance: transitive_cascade / expire_sweep_release_cascade_depth2
          rationale: "The APPROVED -> EXPIRED transition and its release cascade are the trigger and asserted outcome of the named §1.8 instance."

      - name: complete_interment_bubbles_case_to_interred_stub
        claim_type: Bubble up
        grounds: [state_machines.IntermentSchedule.SCHEDULED_to_COMPLETED, state_machines.BurialCase.SCHEDULED_to_INTERRED]
        excluded_because:
          difficulty_instance: transitive_cascade / complete_interment_cascade_depth3
          rationale: "Case SCHEDULED -> INTERRED bubble-up is asserted in the depth-3 completion cascade."

  - section: calculations
    instances:
      - name: entitlement_score_own_service_stub
        claim_type: Variant Selection
        grounds: [calculations.entitlement_score]
        excluded_because:
          difficulty_instance: dual_variant_calc / entitlement_score_own_vs_sponsor_derived
          rationale: "The own-service vs sponsor-derived variant selection is the core assertion of the named §1.8 dual-variant instance."

      - name: marker_charge_with_emblem_stub
        claim_type: Correct Result
        grounds: [calculations.marker_charge]
        excluded_because:
          difficulty_instance: combinatorial_formula / marker_charge_sum_then_allowance_rounding_order
          rationale: "The emblem + sum-then-allowance charge computation is asserted verbatim (1500 cents) in the named §1.8 instance."
