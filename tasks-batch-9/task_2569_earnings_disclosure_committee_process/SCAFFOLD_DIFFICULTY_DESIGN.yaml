          setup:
            - "An ADOPTED charter (min_quorum_count 2, required_functions [FINANCE, LEGAL]) with one ACTIVE voting FINANCE member and one ACTIVE voting LEGAL member."
            - "A ReportingCycle in CLOSE_OPEN with a DRAFT PERIODIC_FILING document authored by the LEGAL member and one MATCHED TieOutItem prepared by the FINANCE member."
            - "The FINANCE member is then RECUSED, so the seat is unusable while the segregation-of-duties conflict also stands."
