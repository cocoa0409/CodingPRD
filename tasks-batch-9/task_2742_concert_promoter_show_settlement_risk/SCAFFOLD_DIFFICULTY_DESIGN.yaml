              captures: { e2_base: $.data.artist_base_earnings_cents, e2_coop: $.data.artist_coop_contribution_cents, e2_earn: $.data.artist_earnings_cents }
          assert:
            - "Both settlements recognise the SAME marketing expense: Settlement.${e1_st_id}.total_settlement_expense_cents == 200000 and Settlement.${e2_st_id}.total_settlement_expense_cents == 200000, so the co-op SHARE leg is 100000 in both"
            - "${e1_base} == 1000010 and ${e1_coop} == 50001 — the CAP leg binds, and ROUND_HALF_UP(5 * 1000010 / 100) = ROUND_HALF_UP(50000.5) = 50001, not 50000"
            - "${e1_earn} == 950009"
            - "${e2_base} == 5000000 and ${e2_coop} == 100000 — the SHARE leg binds because ROUND_HALF_UP(5 * 5000000 / 100) = 250000 exceeds it"
            - "${e2_earn} == 4900000"
            - "The binding leg switched on the base alone: ${e1_coop} != ${e2_coop} even though the marketing recognition is identical"
            - "Keying the 5% cap on artist_earnings_cents instead of artist_base_earnings_cents would give 47500 for E1 and 245000 for E2; both are rejected by the asserts above"
            - "Settlement.${e1_st_id}.adjusted_gross_cents == 390000, promoter_borne_expense_cents == 200000, venue_share_cents == 100000 (the flat rental fee), promoter_net_cents == -860009, and 390000 == 950009 + 200000 + 100000 + (-860009)"
            - "Settlement.${e2_st_id}.promoter_net_cents == -4810000 and 390000 == 4900000 + 200000 + 100000 + (-4810000)"

  # =====================================================================
  # RULE 3 — non_linear_state_machine
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_negotiation_cycles_submitted_countered_submitted_until_round_limit
        grounds:
          - "state_machines.Offer.SUBMITTED_to_COUNTERED"
          - "state_machines.Offer.COUNTERED_to_SUBMITTED"
          - "state_machines.Offer.SUBMITTED_to_ACCEPTED"
          - "entities.Offer.fields.round_index"
          - "validations[priority=26]"
          - "errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]"
        distinguishing_aspect: |
          The OFFER machine is CYCLIC: SUBMITTED -> COUNTERED -> SUBMITTED revisits an already
          occupied state, and the loop is bounded by a counter carried on the entity itself
          (round_index, incremented only on the COUNTERED -> SUBMITTED edge, capped at
          NEGOTIATION_ROUND_LIMIT = 3). The loop terminates by REJECTING the next counter with
          ERR_NEGOTIATION_ROUNDS_EXHAUSTED while leaving the offer in SUBMITTED so it remains
          acceptable — the cycle does not deadlock.
        test_recipe:
          setup:
            - "Clock pinned at the default 2026-08-01T00:00:00Z for the whole instance, so the 72h OFFER_TTL never fires."
            - "One Market (limit 20000000), one Artist, one Venue and one PLANNED show exist."
            - "One Offer exists in status DRAFT with round_index 1, deal_structure GUARANTEE_PLUS_BACKEND, guarantee_cents 5000000, backend_split_artist_pct 85.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Mid Atlantic", region_code: "MAT", guarantee_exposure_limit_cents: 20000000 }
              as: RiskOfficer
              captures: { n_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Copper Halo", agency: "Beltway Bookings", tier: "ARENA", historical_sellthrough_pct: 76.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { n_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${n_mk_id}", name: "Tidewater Coliseum", gross_capacity: 4000, facility_fee_cents_per_ticket: 200, ticket_tax_pct: 6.00 }
              as: TalentBuyer
              captures: { n_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${n_ar_id}", venue_id: "${n_vn_id}", event_at: "2026-11-14T02:00:00.000Z", load_in_at: "2026-11-13T14:00:00.000Z", load_out_at: "2026-11-14T08:00:00.000Z", announce_at: "2026-09-01T15:00:00.000Z", venue_arrangement: "CO_PROMOTE", copromote_venue_share_pct: 12.00, venue_expense_pct_production: 40.00, venue_expense_pct_marketing: 0, venue_expense_pct_staffing: 100.00, venue_expense_pct_hospitality: 0 }
              as: TalentBuyer
              captures: { n_sh_id: $.data.id, n_sh_v1: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${n_sh_id}", expected_show_version: "${n_sh_v1}", deal_structure: "GUARANTEE_PLUS_BACKEND", guarantee_cents: 5000000, deposit_cents: 1000000, expense_cap_cents: 4000000, backend_split_artist_pct: 85.00 }
              as: TalentBuyer
              captures: { n_of_id: $.data.id }
          trigger:
            - call: "POST /offers/${n_of_id}/submit"
              payload: {}
              as: TalentBuyer
              captures: { r1_status: $.data.status, r1_round: $.data.round_index, r1_expires: $.data.expires_at }
            - call: "POST /offers/${n_of_id}/counter"
              payload: { counter_guarantee_cents: 5500000, counter_backend_split_artist_pct: 90.00, counter_note: "round 1 counter — agency asks 5500000 against 90 percent backend" }
              as: ArtistRep
              as_user_id: "${n_ar_id}"
              captures: { c1_status: $.data.status, c1_round: $.data.round_index }
            - call: "POST /offers/${n_of_id}/submit"
              payload: { guarantee_cents: 5250000, backend_split_artist_pct: 87.00 }
              as: TalentBuyer
              captures: { r2_status: $.data.status, r2_round: $.data.round_index, r2_guarantee: $.data.guarantee_cents }
            - call: "POST /offers/${n_of_id}/counter"
              payload: { counter_guarantee_cents: 5400000, counter_backend_split_artist_pct: 88.00, counter_note: "round 2 counter — split the difference at 5400000" }
              as: ArtistRep
              as_user_id: "${n_ar_id}"
              captures: { c2_status: $.data.status }
            - call: "POST /offers/${n_of_id}/submit"
              payload: { guarantee_cents: 5350000, backend_split_artist_pct: 88.00 }
              as: TalentBuyer
              captures: { r3_status: $.data.status, r3_round: $.data.round_index, r3_guarantee: $.data.guarantee_cents }
            - call: "POST /offers/${n_of_id}/counter"
              payload: { counter_guarantee_cents: 5450000, counter_note: "round 3 counter — must be rejected, the loop is exhausted" }
              as: ArtistRep
              as_user_id: "${n_ar_id}"
              captures: { exhausted_error: $.data.error_id }
            - call: "POST /offers/${n_of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${n_ar_id}"
              captures: { acc_status: $.data.status, acc_guarantee: $.data.guarantee_cents }
          assert:
            - "${r1_status} == SUBMITTED and ${r1_round} == 1 — the DRAFT -> SUBMITTED edge does NOT increment round_index"
            - "${r1_expires} == 2026-08-04T00:00:00.000Z — submitted_at plus OFFER_TTL_HOURS (72)"
            - "${c1_status} == COUNTERED and ${c1_round} == 1 — the SUBMITTED -> COUNTERED edge does NOT increment round_index either"
            - "${r2_status} == SUBMITTED and ${r2_round} == 2 — the cycle edge COUNTERED -> SUBMITTED is the only incrementing edge; the offer has re-entered a state it already occupied"
            - "${r2_guarantee} == 5250000 — the revised terms carried on the re-submission overwrite the deal terms"
            - "${c2_status} == COUNTERED"
            - "${r3_status} == SUBMITTED and ${r3_round} == 3 and ${r3_guarantee} == 5350000"
            - "${exhausted_error} == ERR_NEGOTIATION_ROUNDS_EXHAUSTED with HTTP 409 — the fourth counter is refused because round_index has reached NEGOTIATION_ROUND_LIMIT (3), not because the offer is in a wrong state"
            - "Offer.${n_of_id}.status == SUBMITTED and Offer.${n_of_id}.round_index == 3 immediately after the rejected counter — the refusal left the cycle exactly where it was, with no side effects"
            - "Offer.${n_of_id}.counter_guarantee_cents == 5400000 — the rejected round-3 counter did NOT overwrite the round-2 counter terms"
            - "${acc_status} == ACCEPTED and ${acc_guarantee} == 5350000 — the bounded cycle still exits into its terminal state, so the loop is bounded, not deadlocked"
            - "Show.${n_sh_id}.show_status == CONFIRMED and Show.${n_sh_id}.committed_guarantee_cents == 5350000"
            - "Market.${n_mk_id}.committed_guarantee_cents == 5350000 and Market.${n_mk_id}.exposure_utilization_pct == 26.75"

      - name: show_status_and_sales_status_move_as_independent_parallel_dimensions
        grounds:
          - "state_machines.Show.SELLING_to_PAUSED"
          - "state_machines.Show.PAUSED_to_SELLING"
          - "state_machines.Show.ON_SALE_to_PERFORMED"
          - "entities.Show.fields.show_status"
          - "entities.Show.fields.sales_status"
          - "state_machines.TicketTier.ON_SALE_to_PAUSED"
        distinguishing_aspect: |
          The SHOW entity carries TWO PARALLEL state dimensions on one row: pause-sales and
          resume-sales move sales_status SELLING <-> PAUSED while leaving show_status pinned at
          ON_SALE across both edges, and only the perform trigger advances BOTH dimensions at once
          (ON_SALE -> PERFORMED and any sales_status -> CLOSED). This is a different entity and a
          different non-linearity from the sibling instance's bounded Offer cycle: here the
          non-linearity is dimensional independence plus a shared join trigger, not a loop.
        test_recipe:
          setup:
            - "One Market, Artist, Venue and a CONFIRMED show with one tier GA 500 @ 2000 exist."
            - "The show has been put on sale (show_status ON_SALE, sales_status SELLING, tier ON_SALE) and 100 tickets are sold."
            - "The clock sits at 2026-08-10T15:00:00Z, after announce_at and before event_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Southeast", region_code: "SEA", guarantee_exposure_limit_cents: 10000000 }
              as: RiskOfficer
              captures: { p_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Palmetto Riot", agency: "Lowcountry Talent", tier: "THEATER", historical_sellthrough_pct: 64.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { p_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${p_mk_id}", name: "Magnolia Hall", gross_capacity: 900, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { p_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${p_ar_id}", venue_id: "${p_vn_id}", event_at: "2026-09-20T02:00:00.000Z", load_in_at: "2026-09-19T14:00:00.000Z", load_out_at: "2026-09-20T08:00:00.000Z", announce_at: "2026-08-10T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 100000 }
              as: TalentBuyer
              captures: { p_sh_id: $.data.id, p_sh_v1: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${p_sh_id}", expected_show_version: "${p_sh_v1}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 1000000, deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { p_of_id: $.data.id }
            - call: "POST /offers/${p_of_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${p_of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${p_ar_id}"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${p_sh_id}", tier_name: "GA", price_cents: 2000, allocation_qty: 500 }
              as: TalentBuyer
              captures: { p_ga_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T15:00:00.000Z" }
              as: TalentBuyer
            - call: "POST /shows/${p_sh_id}/on-sale"
              payload: {}
              as: TalentBuyer
            - call: "POST /ticket-tiers/${p_ga_id}/sales"
              payload: { qty: 100 }
              as: TalentBuyer
          trigger:
            - call: "POST /shows/${p_sh_id}/pause-sales"
              payload: { reason: "chargeback pattern on a bulk order under review" }
              as: RiskOfficer
              captures: { pause_show_status: $.data.show_status, pause_sales_status: $.data.sales_status }
            - call: "POST /ticket-tiers/${p_ga_id}/sales"
              payload: { qty: 10 }
              as: TalentBuyer
              captures: { paused_sale_error: $.data.error_id }
            - call: "POST /shows/${p_sh_id}/resume-sales"
              payload: {}
              as: TalentBuyer
              captures: { resume_show_status: $.data.show_status, resume_sales_status: $.data.sales_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T06:00:00.000Z" }
              as: TalentBuyer
            - call: "POST /shows/${p_sh_id}/perform"
              payload: {}
              as: TalentBuyer
              captures: { perf_show_status: $.data.show_status, perf_sales_status: $.data.sales_status }
          assert:
            - "${pause_sales_status} == PAUSED while ${pause_show_status} == ON_SALE — one trigger moved exactly one dimension"
            - "TicketTier.${p_ga_id}.status == PAUSED immediately after pause-sales, and sold_qty is still 100"
            - "${paused_sale_error} == ERR_INVALID_STATE with HTTP 409 — the sales dimension gates ticket sales even though the lifecycle dimension is untouched"
            - "TicketTier.${p_ga_id}.sold_qty == 100 and gross_sold_cents == 200000 after the rejected sale — the refusal had no side effects"
            - "${resume_sales_status} == SELLING while ${resume_show_status} == ON_SALE — the PAUSED -> SELLING edge is the sales dimension's cyclic return, and show_status never moved across the pause/resume round trip"
            - "TicketTier.${p_ga_id}.status == ON_SALE after resume-sales"
            - "${perf_show_status} == PERFORMED and ${perf_sales_status} == CLOSED — perform is the single join trigger that advances BOTH dimensions in one call"
            - "TicketTier.${p_ga_id}.status == CLOSED and available_qty == 0 after perform"
            - "Show.${p_sh_id}.adjusted_gross_cents == 195000 — gross 200000 minus the 2.5% card fee 5000, with zero ticket tax and zero facility fee"

  # =====================================================================
  # RULE 4 — transitive_cascade
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: invoice_approval_cascades_four_levels_invoice_line_show_market
        grounds:
          - "state_machines.VendorInvoice.VERIFIED_to_APPROVED"
          - "state_machines.BudgetLine.WITHIN_TOLERANCE_to_PENDING_APPROVAL"
          - "calculations.budget_line_variance_recognition"
          - "calculations.market_guarantee_exposure"
          - "entities.Show.fields.breakeven_cents"
          - "entities.Show.fields.budget_posture"
          - "entities.Market.fields.at_risk_guarantee_cents"
        distinguishing_aspect: |
          DEPTH 4, triggered by POST /vendor-invoices/{id}/approve. Each link is caused strictly by
          the previous one: (1) the invoice reaching APPROVED is the only status that admits its
          amount into BudgetLine.actual_cents; (2) the refreshed actual_cents produces variance_pct
          30.00 which drives variance_status WITHIN_TOLERANCE -> PENDING_APPROVAL and pins
          settlement_expense_cents to budgeted_cents; (3) that recognised figure is what moves
          Show.breakeven_cents 5000000 -> 5200000 and Show.budget_posture -> VARIANCE_PENDING;
          (4) the new breakeven is what moves Market.at_risk_guarantee_cents 4415000 -> 4615000.
          Cutting any single link freezes every downstream number.
        test_recipe:
          setup:
            - "FIXTURE D: Market limit 10000000; a RENTAL show (rental_fee_cents 100000) at a zero-fee, zero-tax venue; FLAT_GUARANTEE guarantee_cents 5000000, deposit 0, expense_cap_cents 2000000; accepted, on sale, 300 of a 1000-seat tier sold at 2000 so adjusted_gross_cents == 585000."
            - "Exactly one BudgetLine: HOSPITALITY, budgeted_cents 200000, is_artist_deductible true, actual_cents 0, variance_pct -100.00, variance_status WITHIN_TOLERANCE, settlement_expense_cents 0."
            - "Exactly one VendorInvoice on that line for 260000, already VERIFIED by user acct-alice and not yet approved."
            - "Pre-trigger derived state: Show.breakeven_cents == 5000000, Show.budget_posture == ON_BUDGET, Show.total_actual_expense_cents == 0, Market.committed_guarantee_cents == 5000000, Market.at_risk_guarantee_cents == 4415000, Market.exposure_utilization_pct == 50.00, Market.risk_posture == OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Gulf Coast", region_code: "GLF", guarantee_exposure_limit_cents: 10000000 }
              as: RiskOfficer
              captures: { d_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Bayou Kings", agency: "Delta Route Agency", tier: "THEATER", historical_sellthrough_pct: 58.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { d_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${d_mk_id}", name: "Gulf Pavilion", gross_capacity: 1200, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { d_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${d_ar_id}", venue_id: "${d_vn_id}", event_at: "2026-09-26T02:00:00.000Z", load_in_at: "2026-09-25T14:00:00.000Z", load_out_at: "2026-09-26T08:00:00.000Z", announce_at: "2026-08-08T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 100000 }
              as: TalentBuyer
              captures: { d_sh_id: $.data.id, d_sh_v1: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${d_sh_id}", expected_show_version: "${d_sh_v1}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 5000000, deposit_cents: 0, expense_cap_cents: 2000000 }
              as: TalentBuyer
              captures: { d_of_id: $.data.id }
            - call: "POST /offers/${d_of_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${d_of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${d_ar_id}"
            - call: "POST /ticket-tiers"
              payload: { show_id: "${d_sh_id}", tier_name: "GA", price_cents: 2000, allocation_qty: 1000 }
              as: TalentBuyer
              captures: { d_ga_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { show_id: "${d_sh_id}", category: "HOSPITALITY", description: "catering, dressing rooms and runner", budgeted_cents: 200000, is_artist_deductible: true }
              as: TourAccountant
              captures: { d_bl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-08T15:00:00.000Z" }
              as: TalentBuyer
            - call: "POST /shows/${d_sh_id}/on-sale"
              payload: {}
              as: TalentBuyer
            - call: "POST /ticket-tiers/${d_ga_id}/sales"
              payload: { qty: 300 }
              as: TalentBuyer
            - call: "POST /vendor-invoices"
              payload: { show_id: "${d_sh_id}", budget_line_id: "${d_bl_id}", vendor_name: "Crescent Catering", amount_cents: 260000, invoice_date: "2026-09-25", documentation_ref: "INV-D-0001" }
              as: TourAccountant
              as_user_id: "acct-alice"
              captures: { d_inv_id: $.data.id }
            - call: "POST /vendor-invoices/${d_inv_id}/verify"
              payload: {}
              as: TourAccountant
              as_user_id: "acct-alice"
            - call: "GET /markets/${d_mk_id}"
              payload: {}
              as: RiskOfficer
              captures: { d_mk_v_before: $.data.version, d_at_risk_before: $.data.at_risk_guarantee_cents }
            - call: "GET /shows/${d_sh_id}"
              payload: {}
              as: TalentBuyer
              captures: { d_sh_v_before: $.data.version, d_breakeven_before: $.data.breakeven_cents }
            - call: "GET /budget-lines/${d_bl_id}"
              payload: {}
              as: TourAccountant
