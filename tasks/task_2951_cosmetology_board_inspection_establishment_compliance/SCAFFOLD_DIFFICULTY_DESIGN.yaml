  - rule_id: priority_pair_validation_conflict
    instances:
      - name: inspection_status_gate_precedes_practitioner_linkage_gate_on_findings
        grounds:
          - validations.priority_36.ERR_INSPECTION_NOT_IN_PROGRESS
          - validations.priority_72.ERR_PRACTITIONER_NOT_LINKED_TO_ESTABLISHMENT
          - endpoints.POST_/cosmetology/inspections/{id}/findings
        distinguishing_aspect: |
          Pairs a `state` rule (priority 36) against a `business_referential` rule (priority 72) on
          the same call: the request is doubly invalid because the inspection is still SCHEDULED AND
          the attributed practitioner has no booth rental at the establishment, yet only the lower
          number may surface. A naive implementation that resolves foreign keys and their business
          relationships before checking parent state would answer 422
          ERR_PRACTITIONER_NOT_LINKED_TO_ESTABLISHMENT.
        test_recipe:
          setup:
            - "One MAJOR violation code IMP-200 is published."
            - "One establishment 'Tempo Barbers' with license_status PENDING_INSPECTION and zero workstations."
            - "One practitioner 'Rio Vance' exists (license_status STUDENT) with no booth rental anywhere, so she is not linked to any establishment."
            - "One ROUTINE inspection on 'Tempo Barbers' has been scheduled but NOT started, so its status is SCHEDULED, not IN_PROGRESS."
          setup_api_calls:
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "IMP-200", category: "IMPLEMENT_HANDLING", severity: "MAJOR", base_points: 6.0, fine_cents_base: 12000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Tempo Barbers", establishment_type: "BARBERSHOP", county_code: "NCB", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/practitioners"
              payload: { full_name: "Rio Vance", license_type: "BARBER" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { prac_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-12T09:00:00Z", window_end_at: "2026-08-12T17:00:00Z", inspector_user_id: "insp-006" }
              as: Inspector
              as_user_id: "insp-006"
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_id}", observed_count: 1, corrected_on_site: false, attributed_practitioner_id: "${prac_id}" }
              as: Inspector
              as_user_id: "insp-006"
          assert:
            - "HTTP status is 409"
            - "response data.error_id == ERR_INSPECTION_NOT_IN_PROGRESS"
            - "response data.error_id != ERR_PRACTITIONER_NOT_LINKED_TO_ESTABLISHMENT"
            - "Inspection.${insp_id}.status == SCHEDULED"
            - "Inspection.${insp_id}.finding_count == 0"
            - "GET /cosmetology/violation-findings?inspection_id=${insp_id} returns total_count == 0"

      - name: frozen_posture_gate_precedes_delinquent_fine_gate_on_workstation_add
        grounds:
          - validations.priority_60.ERR_POSTURE_FROZEN
          - validations.priority_90.ERR_OUTSTANDING_FINES_BLOCK_EXPANSION
          - calculations.establishment_demerit_and_posture
          - calculations.citation_total_due_cents
          - endpoints.POST_/cosmetology/establishments/{id}/workstations
        distinguishing_aspect: |
          A different error-category pair from the first instance - `business_safety` (60) against
          `business_fiscal` (90) - and both gates are genuinely tripped at once: demerit_balance is
          105.00 (FROZEN) and delinquent_fine_total_cents is 49896. The establishment is deliberately
          left in PROBATION, which is still operable, so the priority-30 operability gate cannot
          shadow the pair, and the cited finding is MAJOR so the delinquency sweep does not suspend
          the licence and collapse the two branches into one.
        test_recipe:
          setup:
            - "One MAJOR violation code IMP-200 (base_points 6.0, fine_cents_base 12000) is published."
            - "One establishment 'Bright Shears' with station_capacity 8 and zero workstations, so capacity never blocks."
            - "A ROUTINE inspection is finalized with a single IMP-200 finding observed 7 times and not corrected on site: 6.0 * 2.5 * 7 * 1.0 * 0.25-free FINAL path gives 105.00, outcome FAIL, and demerit_balance_before_finalize is 0.00."
            - "The finalize cascade leaves demerit_balance 105.00, license_status PROBATION (operable) and compliance_posture FROZEN."
            - "A citation is issued on that inspection at clock 2026-08-01T00:00:00Z: tier 1.00, ESTABLISHMENT factor 1.00, base 12000, excess points 75.00, surcharge 30000, assessed 42000, admin fee 8% = 3360, total 45360, due_at 2026-08-31T00:00:00Z."
            - "The clock is then advanced to 2026-09-01T00:00:00Z so the citation becomes DELINQUENT with a 4536 late penalty, leaving outstanding 49896 and delinquent_fine_total_cents 49896."
          setup_api_calls:
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "IMP-200", category: "IMPLEMENT_HANDLING", severity: "MAJOR", base_points: 6.0, fine_cents_base: 12000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Bright Shears", establishment_type: "SALON", county_code: "NCD", station_capacity: 8 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-05T09:00:00Z", window_end_at: "2026-08-05T17:00:00Z", inspector_user_id: "insp-007" }
              as: Inspector
              as_user_id: "insp-007"
              captures: { insp_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-007"
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_id}", observed_count: 7, corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-007"
            - call: "POST /cosmetology/inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-007"
            - call: "POST /cosmetology/inspections/${insp_id}/finalize"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { insp_v: $.data.version }
            - call: "POST /cosmetology/citations"
              payload: { inspection_id: "${insp_id}", subject_type: "ESTABLISHMENT", expected_inspection_version: "${insp_v}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { cit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /cosmetology/establishments/${est_id}/workstations"
              payload: { station_number: 1, station_type: "STYLING_CHAIR" }
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "HTTP status is 409"
            - "response data.error_id == ERR_POSTURE_FROZEN"
            - "response data.error_id != ERR_OUTSTANDING_FINES_BLOCK_EXPANSION"
            - "Establishment.${est_id}.license_status == PROBATION"
            - "Establishment.${est_id}.compliance_posture == FROZEN"
            - "Establishment.${est_id}.demerit_balance == 105.00"
            - "Establishment.${est_id}.delinquent_fine_total_cents == 49896"
            - "Establishment.${est_id}.station_count == 0"
            - "Citation.${cit_id}.assessed_fine_cents == 42000"
            - "Citation.${cit_id}.administrative_fee_cents == 3360"
            - "Citation.${cit_id}.total_due_cents == 45360"
            - "Citation.${cit_id}.status == DELINQUENT"
            - "Citation.${cit_id}.outstanding_fine_cents == 49896"

  - rule_id: boundary_precision_check
    instances:
      - name: posture_restricted_threshold_is_inclusive_at_exactly_fifty_demerits
        grounds:
          - calculations.establishment_demerit_and_posture
          - calculations.inspection_adjusted_score
          - entities.Establishment.fields.compliance_posture
          - entities.Establishment.fields.demerit_balance
          - endpoints.POST_/cosmetology/inspections/{id}/finalize
        distinguishing_aspect: |
          Metric under test: demerit_balance against RESTRICTED_DEMERIT_THRESHOLD, probed on the
          finalize endpoint. Two establishments land on either side of the boundary by 0.50 - exactly
          50.00 must be RESTRICTED because the comparison is >=, while 49.50 must remain WATCH - and
          the 49.50 case is built from five 9.90-point MINOR findings so an implementation that
          rounds the running sum to whole points would wrongly report 50.00 and flip the band.
        test_recipe:
          setup:
            - "Two violation codes are published: FAC-410 (MAJOR, base_points 10.0) and REC-120 (MINOR, base_points 9.90)."
            - "Establishment A 'Vault Salon' has a PENDING_REVIEW ROUTINE inspection with one FAC-410 finding observed 2 times, not corrected on site: 10.0 * 2.5 * 2 * 1.0 = 50.00 exactly."
            - "Establishment B 'Rivet Salon' has a PENDING_REVIEW ROUTINE inspection with one REC-120 finding observed 5 times, not corrected on site: 9.90 * 1.0 * 5 * 1.0 = 49.50."
            - "Neither establishment has any prior FINALIZED inspection, so every repeat_factor is 1.0 and both pre-finalize demerit balances are 0.00."
          setup_api_calls:
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "FAC-410", category: "FACILITY", severity: "MAJOR", base_points: 10.0, fine_cents_base: 8000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_fac_id: $.data.id }
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "REC-120", category: "RECORDKEEPING", severity: "MINOR", base_points: 9.90, fine_cents_base: 3000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_rec_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Vault Salon", establishment_type: "SALON", county_code: "NCF", station_capacity: 5 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_a_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Rivet Salon", establishment_type: "SALON", county_code: "NCG", station_capacity: 5 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_b_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_a_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-14T09:00:00Z", window_end_at: "2026-08-14T17:00:00Z", inspector_user_id: "insp-008" }
              as: Inspector
              as_user_id: "insp-008"
              captures: { insp_a_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_a_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-008"
            - call: "POST /cosmetology/inspections/${insp_a_id}/findings"
              payload: { violation_code_id: "${vc_fac_id}", observed_count: 2, corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-008"
            - call: "POST /cosmetology/inspections/${insp_a_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-008"
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_b_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-14T09:00:00Z", window_end_at: "2026-08-14T17:00:00Z", inspector_user_id: "insp-009" }
              as: Inspector
              as_user_id: "insp-009"
              captures: { insp_b_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_b_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-009"
            - call: "POST /cosmetology/inspections/${insp_b_id}/findings"
              payload: { violation_code_id: "${vc_rec_id}", observed_count: 5, corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-009"
            - call: "POST /cosmetology/inspections/${insp_b_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-009"
          trigger:
            - call: "POST /cosmetology/inspections/${insp_a_id}/finalize"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/inspections/${insp_b_id}/finalize"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "Inspection.${insp_a_id}.final_adjusted_score == 50.00"
            - "Inspection.${insp_a_id}.final_outcome == FAIL"
            - "Establishment.${est_a_id}.demerit_balance == 50.00"
            - "Establishment.${est_a_id}.compliance_posture == RESTRICTED"
            - "Establishment.${est_a_id}.license_status == PENDING_INSPECTION"
            - "Inspection.${insp_b_id}.final_adjusted_score == 49.50"
            - "Inspection.${insp_b_id}.final_outcome == FAIL"
            - "Establishment.${est_b_id}.demerit_balance == 49.50"
            - "Establishment.${est_b_id}.compliance_posture == WATCH"
            - "Establishment.${est_b_id}.license_status == PENDING_INSPECTION"

      - name: submit_with_empty_finding_set_scores_zero_not_null
        grounds:
          - calculations.inspection_adjusted_score
          - state_machines.Inspection.IN_PROGRESS_to_PENDING_REVIEW
          - entities.Inspection.fields.provisional_adjusted_score
          - entities.Inspection.fields.provisional_outcome
          - endpoints.POST_/cosmetology/inspections/{id}/submit
        distinguishing_aspect: |
          A different metric on a different endpoint from the posture-threshold instance: the empty
          input set of the weighted sum on submit. The lower edge of the PASS band must be produced
          as the numeric literal 0.00 with outcome PASS, not left null and not reported as an
          absent-score special case; finding_count must also be 0 rather than null.
        test_recipe:
          setup:
            - "One establishment 'Quiet Studio' with license_status PENDING_INSPECTION and demerit_balance 0.00."
            - "One ROUTINE inspection on it has been started, so its status is IN_PROGRESS, and no findings have been recorded at all."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Quiet Studio", establishment_type: "ESTHETICS_SPA", county_code: "NCH", station_capacity: 2 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-18T09:00:00Z", window_end_at: "2026-08-18T13:00:00Z", inspector_user_id: "insp-010" }
              as: Inspector
              as_user_id: "insp-010"
              captures: { insp_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-010"
          trigger:
            - call: "POST /cosmetology/inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-010"
          assert:
            - "HTTP status is 200"
            - "Inspection.${insp_id}.status == PENDING_REVIEW"
            - "Inspection.${insp_id}.provisional_adjusted_score == 0.00"
            - "Inspection.${insp_id}.provisional_outcome == PASS"
            - "Inspection.${insp_id}.finding_count == 0"
            - "Inspection.${insp_id}.final_adjusted_score is null"
            - "Inspection.${insp_id}.final_outcome is null"
            - "Establishment.${est_id}.demerit_balance == 0.00"
            - "Establishment.${est_id}.compliance_posture == CLEAR"

      - name: implement_disinfection_contact_time_minimum_is_inclusive_at_ten_minutes
        grounds:
          - validations.priority_63.ERR_DISINFECTANT_CONTACT_TIME_INSUFFICIENT
          - entities.SanitationLog.fields.contact_minutes
          - entities.SanitationLog.fields.occupancy_end_at
          - endpoints.POST_/cosmetology/sanitation-logs
        distinguishing_aspect: |
          A third metric on a third endpoint: wet contact time on sanitation-log creation, where the
          minimum is declared inclusive. contact_minutes 10 must be accepted with 201 and
          contact_minutes 9 must be rejected, so an implementation using a strict `>` comparison
          fails the accepted case while one that truncates to whole minutes from below fails the
          rejected case. occupancy_end_at is also checked to prove the accepted value was stored.
        test_recipe:
          setup:
            - "One school 'Lakeside Institute' with required_clock_hours 16.0 and accreditation_status ACCREDITED."
            - "One ACTIVE NAIL_TECHNICIAN 'Mira Sol' with 16.00 credited school hours, licence issued effective 2026-08-01T00:00:00Z."
            - "One establishment 'Aqua Nails' (license_status PENDING_INSPECTION, posture CLEAR) with NAIL_TABLE workstation number 1."
            - "An ACTIVE booth rental links Mira Sol to that workstation and she is the posted practitioner, so the workstation's posting_status is COMPLIANT and priority-65 cannot pre-empt the contact-time check."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cosmetology/schools"
              payload: { name: "Lakeside Institute", county_code: "NCJ", required_clock_hours: 16.0, accreditation_status: "ACCREDITED", apprenticeship_program_approved: false }
              as: BoardAdmin
              as_user_id: "admin-001"
