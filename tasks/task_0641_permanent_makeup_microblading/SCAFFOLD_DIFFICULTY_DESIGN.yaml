# =============================================================================
# task_0641_permanent_makeup_microblading — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x >=2 instances = 18 instances.
# Every grounds[] resolves into SCAFFOLD.yaml §1.1-§1.7. All money in integer cents.
# Logical clock default = 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_session_price_initial_vs_annual_refresh
        grounds:
          - calculations.session_price
          - entities.Appointment.fields.session_price_cents
          - entities.Appointment.fields.appointment_kind
        distinguishing_aspect: "session_price on the Appointment domain: standard_session (full base+surcharge+uplift) vs annual_refresh_session (50% base only) yield 65000 vs 30000 for the same BROWS+2-pigment formula."
        test_recipe:
          setup:
            - "Studio + LICENSE_ACTIVE technician + BROWS 2-pigment color formula exist."
            - "Client with PROCEDURE_CONSENT (age_verified) and a READ/PASS patch test exists."
            - "An INITIAL BROWS appointment booked, started, finished, paid, completed at 2026-02-01."
            - "Then an ANNUAL_REFRESH booked off the completed appointment (>=365d later, 2027-02-02)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 10 }
              as: StudioAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /technicians"
              payload: { studio_id: "${studio_id}", full_name: "Tech A", license_number: "L1", bbp_cert_expiry: "2030-01-01T00:00:00Z", license_expiry: "2030-01-01T00:00:00Z" }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /color-formulas"
              payload: { studio_id: "${studio_id}", name: "Warm Taupe", procedure_type: "BROWS", pigment_count: 2 }
              as: StudioAdmin
              captures: { cf_id: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${studio_id}", full_name: "Client A", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { client_id: $.data.id }
            - call: "POST /consent-records"
              payload: { client_id: "${client_id}", consent_type: "PROCEDURE_CONSENT", age_verified: true, signed_by_name: "Client A" }
              as: FrontDesk
            - call: "POST /patch-tests"
              payload: { client_id: "${client_id}" }
              as: Technician
              captures: { pt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${pt_id}/read"
              payload: { reaction_grade: 1 }
              as: Technician
            - call: "POST /appointments"
              payload: { client_id: "${client_id}", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt_id}", procedure_type: "BROWS", scheduled_start: "2026-01-06T10:00:00Z" }
              as: FrontDesk
              captures: { appt_id: $.data.id, dep_req: $.data.deposit_required_cents }
            - call: "POST /appointments/${appt_id}/deposit"
              payload: { amount_cents: 13000 }
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/start"
              payload: {}
              as: Technician
            - call: "POST /appointments/${appt_id}/finish-procedure"
              payload: {}
              as: Technician
            - call: "POST /appointments/${appt_id}/pay-balance"
              payload: { amount_cents: 52000 }
              as: FrontDesk
            - call: "POST /healing-logs"
              payload: { appointment_id: "${appt_id}", day_offset: 14, outcome_flag: "GOOD" }
              as: Technician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Technician
              captures: { completed_appt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-02T00:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /appointments/annual-refresh"
              payload: { parent_appointment_id: "${completed_appt_id}", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt_id}", procedure_type: "BROWS", scheduled_start: "2027-02-05T10:00:00Z" }
              as: FrontDesk
              captures: { refresh_appt_id: $.data.id, refresh_price: $.data.session_price_cents }
          assert:
            - "Appointment.${appt_id}.session_price_cents == 65000"
            - "Appointment.${refresh_appt_id}.session_price_cents == 30000"
            - "Appointment.${refresh_appt_id}.deposit_required_cents == 6000"

      - name: dvc_client_risk_provisional_vs_final
        grounds:
          - calculations.client_risk_score
          - entities.Client.fields.risk_score
          - entities.Client.fields.skin_sensitivity_observed
          - state_machines.PatchTest.APPLIED_to_READ
        distinguishing_aspect: "client_risk_score on the Client domain: provisional uses skin_sensitivity_self=2 (score 26 STANDARD); after patch-test READ grade 3 the final variant uses observed=3 (score 31 HIGH_RISK) — a different entity domain than session_price."
        test_recipe:
          setup:
            - "Client created with medical_flag_count=2, prior_adverse_reactions=0, skin_sensitivity_self=2 -> provisional risk_score 26."
            - "Patch test applied then READ with reaction_grade 3 -> observed sensitivity 3 -> final risk_score 31."
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 5 }
              as: StudioAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${studio_id}", full_name: "Client R", date_of_birth: "1990-01-01T00:00:00Z", medical_flag_count: 2, prior_adverse_reactions: 0, skin_sensitivity_self: 2 }
              as: FrontDesk
              captures: { client_id: $.data.id, prov_score: $.data.risk_score }
            - call: "POST /patch-tests"
              payload: { client_id: "${client_id}" }
              as: Technician
              captures: { pt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
          trigger:
            - call: "POST /patch-tests/${pt_id}/read"
              payload: { reaction_grade: 3 }
              as: Technician
            - call: "GET /clients/${client_id}"
              payload: {}
              as: FrontDesk
              captures: { final_score: $.data.risk_score, final_band: $.data.risk_band }
          assert:
            - "Client.${client_id}.risk_score before read == 26"
            - "Client.${client_id}.risk_band before read == STANDARD"
            - "Client.${client_id}.risk_score after read == 31"
            - "Client.${client_id}.risk_band after read == HIGH_RISK"
            - "Client.${client_id}.skin_sensitivity_observed == 3"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cf_package_round_per_line_vs_sum_then_round
        grounds:
          - calculations.package_price
          - entities.PackageOrder.fields.package_price_cents
          - entities.PackageOrder.fields.pricing_mode
        distinguishing_aspect: "Mode (b) nested rounding order: PAYG rounds each 40%-line then sums (26000*2=52000); BUNDLE multiplies-then-applies-15%-discount-then-rounds-once (round_half_up(65000*0.40*2*0.85)=44200). Same sp=65000,n=2 give different cents because rounding order is pinned oppositely."
        test_recipe:
          setup:
            - "A COMPLETED INITIAL BROWS appointment with session_price_cents=65000 exists."
            - "Two packages off it: one PAYG (n=2), one BUNDLE (n=2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 10 }
              as: StudioAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /technicians"
              payload: { studio_id: "${studio_id}", full_name: "Tech A", license_number: "L1", bbp_cert_expiry: "2030-01-01T00:00:00Z", license_expiry: "2030-01-01T00:00:00Z" }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /color-formulas"
              payload: { studio_id: "${studio_id}", name: "Warm Taupe", procedure_type: "BROWS", pigment_count: 2 }
              as: StudioAdmin
              captures: { cf_id: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${studio_id}", full_name: "Client P", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { client_id: $.data.id }
            - call: "POST /consent-records"
              payload: { client_id: "${client_id}", consent_type: "PROCEDURE_CONSENT", age_verified: true, signed_by_name: "Client P" }
              as: FrontDesk
            - call: "POST /patch-tests"
              payload: { client_id: "${client_id}" }
              as: Technician
              captures: { pt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${pt_id}/read"
              payload: { reaction_grade: 1 }
              as: Technician
            - call: "POST /appointments"
              payload: { client_id: "${client_id}", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt_id}", procedure_type: "BROWS", scheduled_start: "2026-01-06T10:00:00Z" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/deposit"
              payload: { amount_cents: 13000 }
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/start"
              payload: {}
              as: Technician
            - call: "POST /appointments/${appt_id}/finish-procedure"
              payload: {}
              as: Technician
            - call: "POST /appointments/${appt_id}/pay-balance"
              payload: { amount_cents: 52000 }
              as: FrontDesk
            - call: "POST /healing-logs"
              payload: { appointment_id: "${appt_id}", day_offset: 14, outcome_flag: "GOOD" }
              as: Technician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Technician
          trigger:
            - call: "POST /packages"
              payload: { client_id: "${client_id}", source_appointment_id: "${appt_id}", included_sessions: 2, pricing_mode: "PAYG" }
              as: FrontDesk
              captures: { payg_pkg_id: $.data.id, payg_price: $.data.package_price_cents }
            - call: "POST /packages"
              payload: { client_id: "${client_id}", source_appointment_id: "${appt_id}", included_sessions: 2, pricing_mode: "BUNDLE" }
              as: FrontDesk
              captures: { bundle_pkg_id: $.data.id, bundle_price: $.data.package_price_cents }
          assert:
            - "PackageOrder.${payg_pkg_id}.package_price_cents == 52000"
            - "PackageOrder.${bundle_pkg_id}.package_price_cents == 44200"

      - name: cf_session_price_three_input_nonlinear
        grounds:
          - calculations.session_price
          - entities.ColorFormula.fields.pigment_count
          - entities.Appointment.fields.is_corrective
        distinguishing_aspect: "Mode (a): session_price combines >=3 inputs with non-linear interaction — tiered color surcharge selection on pigment_count (3-pigment tier 12000) plus a conditional 25%-of-base corrective uplift branch — EYELINER base 50000 + 12000 + round_half_up(50000*0.25)=12500 = 74500. A different combinatorial axis (tier+conditional branch) than the package rounding-order instance."
        test_recipe:
          setup:
            - "Studio + tech + EYELINER 3-pigment formula + consented client + READ/PASS patch test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 10 }
              as: StudioAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /technicians"
              payload: { studio_id: "${studio_id}", full_name: "Tech A", license_number: "L1", bbp_cert_expiry: "2030-01-01T00:00:00Z", license_expiry: "2030-01-01T00:00:00Z" }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /color-formulas"
              payload: { studio_id: "${studio_id}", name: "Jet Liner", procedure_type: "EYELINER", pigment_count: 3 }
              as: StudioAdmin
              captures: { cf_id: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${studio_id}", full_name: "Client C", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { client_id: $.data.id }
            - call: "POST /consent-records"
              payload: { client_id: "${client_id}", consent_type: "PROCEDURE_CONSENT", age_verified: true, signed_by_name: "Client C" }
              as: FrontDesk
            - call: "POST /patch-tests"
              payload: { client_id: "${client_id}" }
              as: Technician
              captures: { pt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${pt_id}/read"
              payload: { reaction_grade: 1 }
              as: Technician
          trigger:
            - call: "POST /appointments"
              payload: { client_id: "${client_id}", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt_id}", procedure_type: "EYELINER", is_corrective: true, scheduled_start: "2026-01-06T10:00:00Z" }
              as: FrontDesk
              captures: { appt_id: $.data.id, sp: $.data.session_price_cents, dep: $.data.deposit_required_cents }
          assert:
            - "Appointment.${appt_id}.session_price_cents == 74500"
            - "Appointment.${appt_id}.deposit_required_cents == 14900"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_appointment_parallel_payment_lifecycle
        grounds:
          - state_machines.Appointment.AWAITING_DEPOSIT_to_DEPOSIT_PAID
          - state_machines.Appointment.BOOKED_to_IN_PROCEDURE
          - entities.Appointment.fields.payment_status
          - entities.Appointment.fields.lifecycle_status
        distinguishing_aspect: "Appointment carries two independent state dimensions: paying the deposit moves payment_status AWAITING_DEPOSIT->DEPOSIT_PAID while lifecycle_status stays BOOKED; only a later /start moves lifecycle BOOKED->IN_PROCEDURE — the two axes evolve independently on the same row."
        test_recipe:
          setup:
            - "A BOOKED, AWAITING_DEPOSIT BROWS appointment exists with a READ/PASS patch test and LICENSE_ACTIVE tech."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studios"
              payload: { name: "Ink Studio", state_code: "CA", sterile_kit_total: 10 }
              as: StudioAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /technicians"
              payload: { studio_id: "${studio_id}", full_name: "Tech A", license_number: "L1", bbp_cert_expiry: "2030-01-01T00:00:00Z", license_expiry: "2030-01-01T00:00:00Z" }
              as: StudioAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /color-formulas"
              payload: { studio_id: "${studio_id}", name: "Warm Taupe", procedure_type: "BROWS", pigment_count: 2 }
              as: StudioAdmin
              captures: { cf_id: $.data.id }
            - call: "POST /clients"
              payload: { studio_id: "${studio_id}", full_name: "Client A", date_of_birth: "1990-01-01T00:00:00Z" }
              as: FrontDesk
              captures: { client_id: $.data.id }
            - call: "POST /consent-records"
              payload: { client_id: "${client_id}", consent_type: "PROCEDURE_CONSENT", age_verified: true, signed_by_name: "Client A" }
              as: FrontDesk
            - call: "POST /patch-tests"
              payload: { client_id: "${client_id}" }
              as: Technician
              captures: { pt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T01:00:00Z" }
              as: StudioAdmin
            - call: "POST /patch-tests/${pt_id}/read"
              payload: { reaction_grade: 1 }
              as: Technician
            - call: "POST /appointments"
              payload: { client_id: "${client_id}", technician_id: "${tech_id}", color_formula_id: "${cf_id}", patch_test_id: "${pt_id}", procedure_type: "BROWS", scheduled_start: "2026-01-06T10:00:00Z" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/deposit"
              payload: { amount_cents: 13000 }
              as: FrontDesk
              captures: { ls_after_dep: $.data.lifecycle_status, ps_after_dep: $.data.payment_status }
            - call: "POST /appointments/${appt_id}/start"
              payload: {}
              as: Technician
              captures: { ls_after_start: $.data.lifecycle_status, ps_after_start: $.data.payment_status }
          assert:
            - "Appointment.${appt_id}.payment_status after deposit == DEPOSIT_PAID"
            - "Appointment.${appt_id}.lifecycle_status after deposit == BOOKED"
            - "Appointment.${appt_id}.lifecycle_status after start == IN_PROCEDURE"
            - "Appointment.${appt_id}.payment_status after start == DEPOSIT_PAID"

      - name: nlsm_redo_request_cycle_completed_back_to_completed
        grounds:
          - state_machines.RedoRequest.APPROVED_to_SCHEDULED
          - state_machines.RedoRequest.SCHEDULED_to_FULFILLED
          - state_machines.Appointment.HEALING_to_COMPLETED
          - entities.RedoRequest.fields.redo_appointment_id
        distinguishing_aspect: "RedoRequest forms a revision cycle on a different entity than Appointment: a COMPLETED+POOR appointment spawns REQUESTED->APPROVED->SCHEDULED which creates a new REDO Appointment that itself reaches COMPLETED, bubbling the RedoRequest SCHEDULED->FULFILLED — a loop back to COMPLETED."
        test_recipe:
          setup:
            - "A COMPLETED BROWS appointment with healing_outcome POOR and an APPROVED RedoRequest exist (within 90d window)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
