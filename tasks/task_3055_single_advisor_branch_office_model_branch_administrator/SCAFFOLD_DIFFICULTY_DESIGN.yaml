        grounds:
          - state_machines.TrainingProgram.MILESTONE_PENDING_to_REMEDIATION
          - state_machines.TrainingProgram.MILESTONE_PENDING_to_COMPLETED
        distinguishing_aspect: |
          Entity: TrainingProgram (distinct from GoodwillTransfer). Cyclic
          remediation loop MILESTONE_PENDING -> REMEDIATION -> MILESTONE_PENDING
          -> COMPLETED; advisor stays TRAINEE through the loop and becomes
          VALIDATED only on the second cycle's PASS.
        test_recipe:
          setup:
