            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "FL", license_number: "RN-FL-GF1", license_class: "APRN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
          trigger:
            - { call: "GET /credentialing/state-licenses/${lic_id}", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          assert:
            - "data.state_code == 'FL', license_number == 'RN-FL-GF1', license_class == 'APRN', multistate_flag == true, issued_on == '2026-06-15', expires_on == '2027-06-30'"
            - "data.status == 'DRAFT', data.created_by_user_id == 'spec-1', data.verified_by_user_id == null, data.version == 1"

