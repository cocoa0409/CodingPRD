scaffold_corner_design:
  - section: entities
    instances:
      - name: partnership_create_returns_draft_row_with_computed_expiry
        claim_type: creation
        grounds:
          - entities.Partnership
          - endpoints[POST /partnerships]
          - entities.Partnership.fields.expiry_date
        distinguishing_aspect: "A POST /partnerships with every required field returns 201 with status DRAFT, version 1 and expiry_date computed as 2033-07-31 from effective_date 2026-08-01 plus term_months 84."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at the startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_ps_create
              call: "POST /partnerships"
              payload:
                university_name: "Riverbend State University"
                university_ipeds_id: "224554"
                partner_org_name: "Cadence Online Partners"
                contract_structure: "REVENUE_SHARE"
                term_months: 84
                effective_date: "2026-08-01"
                revenue_recognition_method: "PERIOD_STRAIGHT_LINE"
                marketing_budget_cents: 4000000
                exclusivity_cip_codes: ["52.0201"]
                bundled_services_exception_claimed: true
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { ps_id: $.data.id }
          assert:
            - "response status == 201"
            - "Partnership.${ps_id}.status == DRAFT"
            - "Partnership.${ps_id}.expiry_date == '2033-07-31'"
            - "Partnership.${ps_id}.version == 1"
            - "Partnership.${ps_id}.collected_tuition_cents == 0"
            - "Partnership.${ps_id}.marketing_budget_remaining_cents == 4000000"
            - "Partnership.${ps_id}.created_at == '2026-08-01T00:00:00Z'"

      - name: partnership_get_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /partnerships/{id}]
          - entities.Partnership
        distinguishing_aspect: "GET /partnerships/{id} echoes the stored row inside the success envelope with response_type object and the same id that creation returned."
        test_recipe:
          setup:
            - "One DRAFT Partnership created by the previous instance's payload."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
          trigger:
            - call: "GET /partnerships/${ps_id}"
              as: UniversityProvost
              as_user_id: "provost-1"
          assert:
            - "response status == 200"
            - "response_type == 'object'"
            - "data.id == ${ps_id}"
            - "data.university_name == 'Riverbend State University'"
            - "data.contract_structure == REVENUE_SHARE"
            - "data.fee_schedule_monthly_cents == 0"

      - name: programs_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /programs]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three Programs under one Partnership, GET /programs?partnership_id=..&limit=2&offset=0 returns exactly 2 rows in created_at ASC order with meta.total_count 3 and meta.has_more true."
        test_recipe:
          setup:
            - "EXECUTED Partnership with three DRAFT Programs created in order: MBA Online, MSN Online, MSIS Online."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - &k_ps_submit
              call: "POST /partnerships/${ps_id}/contract-actions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &k_ps_execute
              call: "POST /partnerships/${ps_id}/contract-actions"
              payload: { action: "EXECUTE", executed_date: "2026-08-01" }
              as: UniversityProvost
              as_user_id: "provost-1"
            - &k_pg_create
              call: "POST /programs"
              payload:
                partnership_id: "${ps_id}"
                program_name: "MBA Online"
                cip_code: "52.0201"
                delivery_modality: "ASYNCHRONOUS"
                credential_level: "MASTERS"
                tuition_per_credit_cents: 62500
                credits_to_complete: 36
                enrollment_cap: 40
                projected_annual_enrollments: 300
                competitor_program_count: 3
                regional_wage_premium_pct: 25.0
                employer_partner_count: 2
                prior_year_inquiry_volume: 1750
                launch_window_start: "2026-08-01"
                launch_window_end: "2026-12-31"
                required_service_domains: ["MARKETING"]
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { pg_id: $.data.id }
            - &k_pg2_create
              call: "POST /programs"
              payload:
                partnership_id: "${ps_id}"
                program_name: "MSN Online"
                cip_code: "51.3801"
                delivery_modality: "ASYNCHRONOUS"
                credential_level: "MASTERS"
                tuition_per_credit_cents: 62500
                credits_to_complete: 36
                enrollment_cap: 40
                projected_annual_enrollments: 300
                competitor_program_count: 3
                regional_wage_premium_pct: 25.0
                employer_partner_count: 2
                prior_year_inquiry_volume: 1750
                launch_window_start: "2026-08-01"
                launch_window_end: "2026-12-31"
                required_service_domains: ["MARKETING"]
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { pg2_id: $.data.id }
            - &k_pg3_create
              call: "POST /programs"
              payload:
                partnership_id: "${ps_id}"
                program_name: "MSIS Online"
                cip_code: "11.0401"
                delivery_modality: "ASYNCHRONOUS"
                credential_level: "MASTERS"
                tuition_per_credit_cents: 62500
                credits_to_complete: 36
                enrollment_cap: 40
                projected_annual_enrollments: 300
                competitor_program_count: 3
                regional_wage_premium_pct: 25.0
                employer_partner_count: 2
                prior_year_inquiry_volume: 1750
                launch_window_start: "2026-08-01"
                launch_window_end: "2026-12-31"
                required_service_domains: ["MARKETING"]
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { pg3_id: $.data.id }
          trigger:
            - call: "GET /programs"
              payload: { partnership_id: "${ps_id}", limit: 2, offset: 0 }
              as: UniversityProvost
              as_user_id: "provost-1"
          assert:
            - "response status == 200"
            - "response_type == 'array'"
            - "meta.total_count == 3"
            - "meta.has_more == true"
            - "meta.limit == 2"
            - "meta.offset == 0"
            - "data length == 2"
            - "data[0].id == ${pg_id}"
            - "data[1].id == ${pg2_id}"

      - name: program_get_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations[priority=7]
          - errors[ERR_PROGRAM_NOT_FOUND]
        distinguishing_aspect: "A GET for a syntactically valid but absent Program id returns 404 ERR_PROGRAM_NOT_FOUND rather than an empty 200 body."
        test_recipe:
          setup:
            - "EXECUTED Partnership with no Programs."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
          trigger:
            - call: "GET /programs/pg-does-not-exist"
              as: UniversityProvost
              as_user_id: "provost-1"
              captures: { e_pg404: $.data.error_id }
          assert:
            - "response status == 404"
            - "${e_pg404} == 'ERR_PROGRAM_NOT_FOUND'"
            - "response_type == 'error'"

      - name: partnership_create_missing_required_contract_structure_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /partnerships]
        distinguishing_aspect: "contract_structure has source input and no default, so omitting it must yield 400 ERR_INVALID_REQUEST and create nothing."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /partnerships"
              payload:
                university_name: "Riverbend State University"
                university_ipeds_id: "224554"
                partner_org_name: "Cadence Online Partners"
                term_months: 84
                effective_date: "2026-08-01"
                revenue_recognition_method: "PERIOD_STRAIGHT_LINE"
                marketing_budget_cents: 4000000
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { e_req: $.data.error_id }
          assert:
            - "response status == 400"
            - "${e_req} == 'ERR_INVALID_REQUEST'"
            - "GET /partnerships returns meta.total_count == 0"

      - name: program_create_omitting_optional_arrays_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Program.fields.required_service_domains
          - entities.Partnership.fields.exclusivity_cip_codes
          - entities.Partnership.fields.fee_schedule_monthly_cents
          - entities.Partnership.fields.bundled_services_exception_claimed
        distinguishing_aspect: "Omitting required_service_domains yields the declared six-domain default list, and omitting the Partnership's optional economics yields fee_schedule_monthly_cents 0, exclusivity_cip_codes [] and bundled_services_exception_claimed false."
        test_recipe:
          setup:
            - "One Partnership created without revenue_share_tiers, fee_schedule_monthly_cents, refund_schedule, exclusivity_cip_codes or bundled_services_exception_claimed, driven to EXECUTED."
          setup_api_calls:
            - *k_clock
            - &k_ps_create_bare
              call: "POST /partnerships"
              payload:
                university_name: "Lakeshore University"
                university_ipeds_id: "224999"
                partner_org_name: "Cadence Online Partners"
                contract_structure: "REVENUE_SHARE"
                term_months: 84
                effective_date: "2026-08-01"
                revenue_recognition_method: "PERIOD_STRAIGHT_LINE"
                marketing_budget_cents: 4000000
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { psb_id: $.data.id }
            - &k_psb_submit
              call: "POST /partnerships/${psb_id}/contract-actions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: PartnerAccountLead
              as_user_id: "${psb_id}"
            - &k_psb_execute
              call: "POST /partnerships/${psb_id}/contract-actions"
              payload: { action: "EXECUTE", executed_date: "2026-08-01" }
              as: UniversityProvost
              as_user_id: "provost-1"
          trigger:
            - call: "POST /programs"
              payload:
                partnership_id: "${psb_id}"
                program_name: "MBA Online"
                cip_code: "52.0201"
                delivery_modality: "ASYNCHRONOUS"
                credential_level: "MASTERS"
                tuition_per_credit_cents: 62500
                credits_to_complete: 36
                enrollment_cap: 40
                projected_annual_enrollments: 300
                competitor_program_count: 3
                regional_wage_premium_pct: 25.0
                employer_partner_count: 2
                prior_year_inquiry_volume: 1750
                launch_window_start: "2026-08-01"
                launch_window_end: "2026-12-31"
              as: PartnerAccountLead
              as_user_id: "${psb_id}"
              captures: { pgd_id: $.data.id }
          assert:
            - "Program.${pgd_id}.required_service_domains == ['MARKETING', 'LEAD_GENERATION', 'ENROLLMENT_COUNSELING', 'COURSE_DESIGN', 'STUDENT_ADVISING', 'ACCESSIBILITY_ACCOMMODATIONS']"
            - "Partnership.${psb_id}.fee_schedule_monthly_cents == 0"
            - "Partnership.${psb_id}.exclusivity_cip_codes == []"
            - "Partnership.${psb_id}.bundled_services_exception_claimed == false"
            - "Partnership.${psb_id}.revenue_share_tiers == [{through_cents: 25000000, partner_rate: 0.575}, {through_cents: 75000000, partner_rate: 0.485}, {through_cents: null, partner_rate: 0.395}]"

      - name: counselor_create_initialises_computed_counters_and_both_state_dimensions
        claim_type: computed_fields
        grounds:
          - entities.EnrollmentCounselor.fields.open_pipeline_count
          - entities.EnrollmentCounselor.fields.conversion_rate
          - entities.EnrollmentCounselor.fields.comp_plan_type
          - entities.EnrollmentCounselor.fields.performance_status
          - entities.EnrollmentCounselor.fields.incentive_eligibility
        distinguishing_aspect: "A freshly onboarded counselor carries every computed counter at 0, conversion_rate 0.0000, comp_plan_type NONE_ON_FILE and the two state dimensions at NOT_RATED / PENDING_COMPLIANCE_REVIEW — no compensation input is accepted at onboarding."
        test_recipe:
          setup:
            - "EXECUTED Partnership."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
          trigger:
            - &k_co_create
              call: "POST /enrollment-counselors"
              payload: { partnership_id: "${ps_id}", full_name: "Rosa Vento", employer: "PARTNER", monthly_base_salary_cents: 500000 }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { co_id: $.data.id }
          assert:
            - "response status == 201"
            - "EnrollmentCounselor.${co_id}.comp_plan_type == NONE_ON_FILE"
            - "EnrollmentCounselor.${co_id}.performance_status == NOT_RATED"
            - "EnrollmentCounselor.${co_id}.incentive_eligibility == PENDING_COMPLIANCE_REVIEW"
            - "EnrollmentCounselor.${co_id}.conversion_rate == 0.0000"
            - "EnrollmentCounselor.${co_id}.open_pipeline_count == 0"
            - "EnrollmentCounselor.${co_id}.rated_lead_count == 0"
            - "EnrollmentCounselor.${co_id}.clawback_pending_cents == 0"
            - "EnrollmentCounselor.${co_id}.annual_base_cents == 0"
            - "EnrollmentCounselor.${co_id}.variable_basis == NONE"

      - name: tuition_payment_system_fields_are_server_generated
        claim_type: system_fields
        grounds:
          - entities.TuitionPayment.fields.generated_by
          - endpoints[POST /enrollments/{id}/tuition-payments]
        distinguishing_aspect: "A bursar-posted payment gets id and created_at from the server and generated_by BURSAR_POST — the client never supplies any of the three, and created_at equals the logical clock instant 2026-09-05T00:00:00Z rather than wall time."
        test_recipe:
          setup:
            - "EXECUTED Partnership, LAUNCHED Program 'MBA Online' with an APPROVED course and the MARKETING scope assigned."
            - "Counselor Rosa Vento with an APPROVED SALARY_PLUS_QUALITATIVE plan; Lead P-1001 converted to Enrollment S-2001 of 9 credits, tuition_charged_cents 562500."
            - "Logical clock advanced to 2026-09-05T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - &k_course_create
              call: "POST /programs/${pg_id}/courses"
              payload:
                course_code: "MBA-501"
                title: "Foundations of Analytics"
                credits: 3
                content_owner: "UNIVERSITY"
                design_cost_cents: 1500000
                required_for_launch: true
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { c1_id: $.data.id }
            - &k_course_start
              call: "POST /courses/${c1_id}/design-actions"
              payload: { action: "START_DESIGN" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &k_course_submit
              call: "POST /courses/${c1_id}/design-actions"
              payload: { action: "SUBMIT_FOR_FACULTY_REVIEW" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &k_course_approve
              call: "POST /courses/${c1_id}/design-actions"
              payload: { action: "APPROVE", faculty_approver_name: "Dr. Imani Osei" }
              as: FacultyChair
              as_user_id: "faculty-1"
            - &k_scope_marketing
              call: "POST /programs/${pg_id}/service-scope-assignments"
              payload: { service_domain: "MARKETING", responsible_party: "PARTNER", sla_response_hours: 24, cost_bearer: "PARTNER" }
              as: UniversityProvost
              as_user_id: "provost-1"
            - &k_pg_submit
              call: "POST /programs/${pg_id}/lifecycle-actions"
              payload: { action: "SUBMIT" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &k_pg_approve
              call: "POST /programs/${pg_id}/lifecycle-actions"
              payload: { action: "APPROVE" }
              as: UniversityProvost
              as_user_id: "provost-1"
            - &k_pg_launch
              call: "POST /programs/${pg_id}/lifecycle-actions"
              payload: { action: "LAUNCH" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - *k_co_create
            - &k_co_plan
              call: "POST /enrollment-counselors/${co_id}/compensation-plan"
              payload: { comp_plan_type: "SALARY_PLUS_QUALITATIVE", annual_base_cents: 6000000, variable_component_cents: 100000, variable_basis: "QUALITATIVE_MULTI_FACTOR" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &k_co_review
              call: "POST /enrollment-counselors/${co_id}/compliance-review"
              payload: { decision: "APPROVE", reviewer_note: "Qualitative multi-factor plan; bundled-services exception documented." }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - &k_lead_create
              call: "POST /leads"
              payload: { program_id: "${pg_id}", counselor_id: "${co_id}", source_channel: "PAID_SEARCH", prospect_external_id: "P-1001" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { ld_id: $.data.id }
            - &k_lead_contact
              call: "POST /leads/${ld_id}/advance"
              payload: { action: "CONTACT", hours_to_first_contact: 6 }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &k_lead_apply
              call: "POST /leads/${ld_id}/advance"
              payload: { action: "APPLY" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
            - &k_enroll
              call: "POST /leads/${ld_id}/enroll"
              payload: { student_external_id: "S-2001", credits_enrolled: 9, term_start_date: "2026-09-01", term_end_date: "2026-12-15" }
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { en_id: $.data.id }
            - &k_clock_sep5
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_pay_full
              call: "POST /enrollments/${en_id}/tuition-payments"
              payload: { entry_type: "PAYMENT", amount_cents: 562500, posted_date: "2026-09-05", reference_note: "Term 1 tuition in full" }
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { pay_id: $.data.id }
          assert:
            - "response status == 201"
            - "TuitionPayment.${pay_id}.generated_by == BURSAR_POST"
            - "TuitionPayment.${pay_id}.created_at == '2026-09-05T00:00:00Z'"
            - "TuitionPayment.${pay_id}.enrollment_id == ${en_id}"
            - "Enrollment.${en_id}.tuition_charged_cents == 562500"
            - "Enrollment.${en_id}.collected_cents == 562500"

      - name: program_create_with_invalid_enum_delivery_modality_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - entities.Program.fields.delivery_modality
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "delivery_modality is a closed enum; the undeclared member SELF_PACED must be refused with 400 ERR_INVALID_REQUEST before any demand score is computed."
        test_recipe:
          setup:
            - "EXECUTED Partnership."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
          trigger:
            - call: "POST /programs"
              payload:
                partnership_id: "${ps_id}"
                program_name: "MBA Online"
                cip_code: "52.0201"
                delivery_modality: "SELF_PACED"
                credential_level: "MASTERS"
                tuition_per_credit_cents: 62500
                credits_to_complete: 36
                enrollment_cap: 40
                projected_annual_enrollments: 300
                competitor_program_count: 3
                regional_wage_premium_pct: 25.0
                employer_partner_count: 2
                prior_year_inquiry_volume: 1750
                launch_window_start: "2026-08-01"
                launch_window_end: "2026-12-31"
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { e_enum: $.data.error_id }
          assert:
            - "response status == 400"
            - "${e_enum} == 'ERR_INVALID_REQUEST'"
            - "GET /programs?partnership_id=${ps_id} returns meta.total_count == 0"

      - name: tuition_payment_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.TuitionPayment
          - entities.MarketingSpendEntry
          - endpoints[GET /enrollments/{id}/tuition-payments]
        distinguishing_aspect: "TuitionPayment is declared common_fields false: the created row exposes id and created_at but no version and no updated_at, §1.5 declares no PATCH or DELETE for it, and corrections are expressed as additional REFUND rows rather than edits."
        test_recipe:
          setup:
            - "The ACTIVE Enrollment S-2001 of the previous instance with one PAYMENT of 562500 cents posted on 2026-09-05."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
            - *k_pg_approve
            - *k_pg_launch
            - *k_co_create
            - *k_co_plan
            - *k_co_review
            - *k_lead_create
            - *k_lead_contact
            - *k_lead_apply
            - *k_enroll
            - *k_clock_sep5
            - *k_pay_full
          trigger:
            - call: "GET /enrollments/${en_id}/tuition-payments"
              payload: { limit: 10, offset: 0 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          assert:
            - "meta.total_count == 1"
            - "data[0].id == ${pay_id}"
            - "data[0] has no field named version"
            - "data[0] has no field named updated_at"
            - "§1.5 declares no PATCH and no DELETE endpoint whose path resolves to a TuitionPayment"

      - name: program_create_under_unknown_partnership_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_PARTNERSHIP_NOT_FOUND]
          - entities.Program.parent
        distinguishing_aspect: "Program declares Partnership as its parent, so a partnership_id that names no row is a 404 ERR_PARTNERSHIP_NOT_FOUND — existence outranks the 403 partnership-scope check and the 409 state check."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /programs"
              payload:
                partnership_id: "ps-does-not-exist"
                program_name: "MBA Online"
                cip_code: "52.0201"
                delivery_modality: "ASYNCHRONOUS"
                credential_level: "MASTERS"
                tuition_per_credit_cents: 62500
                credits_to_complete: 36
                enrollment_cap: 40
                projected_annual_enrollments: 300
                competitor_program_count: 3
                regional_wage_premium_pct: 25.0
                employer_partner_count: 2
                prior_year_inquiry_volume: 1750
                launch_window_start: "2026-08-01"
                launch_window_end: "2026-12-31"
              as: PartnerAccountLead
              as_user_id: "ps-does-not-exist"
              captures: { e_ps404: $.data.error_id }
          assert:
            - "response status == 404"
            - "${e_ps404} == 'ERR_PARTNERSHIP_NOT_FOUND'"

      - name: leads_filtered_by_program_id_reach_the_children_of_that_program
        claim_type: listing
        grounds:
          - endpoints[GET /leads]
          - entities.Lead.fields.program_id
          - entities.Lead.fields.counselor_id
        distinguishing_aspect: "The Lead -> Program and Lead -> EnrollmentCounselor foreign keys are reverse-reachable: GET /leads?program_id= returns only that Program's Leads, and the same list filtered by counselor_id returns the same row, so neither FK is write-only."
        test_recipe:
          setup:
            - "EXECUTED Partnership with LAUNCHED Program 'MBA Online' and one Lead P-1001 in status CONTACTED owned by counselor Rosa Vento."
            - "A second DRAFT Program 'MSN Online' with no Leads."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_pg2_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
            - *k_pg_approve
            - *k_pg_launch
            - *k_co_create
            - *k_co_plan
            - *k_co_review
            - *k_lead_create
            - *k_lead_contact
          trigger:
            - call: "GET /leads"
              payload: { program_id: "${pg_id}", limit: 10, offset: 0 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "GET /leads"
              payload: { counselor_id: "${co_id}", limit: 10, offset: 0 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          assert:
            - "first response meta.total_count == 1"
            - "first response data[0].id == ${ld_id}"
            - "first response data[0].program_id == ${pg_id}"
            - "second response meta.total_count == 1"
            - "second response data[0].counselor_id == ${co_id}"
            - "GET /leads?program_id=${pg2_id} returns meta.total_count == 0"

  - section: state_machines
    instances:
      - name: partnership_starts_in_the_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Partnership.initial_state
          - entities.Partnership.fields.status
        distinguishing_aspect: "A newly registered Partnership is in DRAFT with change_request_count 0 and no executed_date — the declared initial_state, not UNDER_REVIEW."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *k_clock
          trigger:
            - *k_ps_create
          assert:
            - "Partnership.${ps_id}.status == DRAFT"
            - "Partnership.${ps_id}.change_request_count == 0"
            - "Partnership.${ps_id}.executed_date == null"

      - name: submit_for_review_moves_partnership_draft_to_under_review
        claim_type: valid_transition
        grounds:
          - state_machines.Partnership.DRAFT_to_UNDER_REVIEW
          - endpoints[POST /partnerships/{id}/contract-actions]
        distinguishing_aspect: "SUBMIT_FOR_REVIEW moves DRAFT -> UNDER_REVIEW, recomputes expiry_date and bumps version from 1 to 2 — the two declared side effects of that edge."
        test_recipe:
          setup: ["One DRAFT Partnership at version 1."]
          setup_api_calls:
            - *k_clock
            - *k_ps_create
          trigger:
            - *k_ps_submit
          assert:
            - "Partnership.${ps_id}.status == UNDER_REVIEW"
            - "Partnership.${ps_id}.version == 2"
            - "Partnership.${ps_id}.expiry_date == '2033-07-31'"

      - name: request_changes_returns_partnership_to_draft_and_counts_the_round
        claim_type: side_effect_execution
        grounds:
          - state_machines.Partnership.UNDER_REVIEW_to_DRAFT
          - entities.Partnership.fields.change_request_count
        distinguishing_aspect: "REQUEST_CHANGES is the backward edge of the DRAFT <-> UNDER_REVIEW cycle: status returns to DRAFT, change_request_count increments to 1 and version reaches 3."
        test_recipe:
          setup: ["One Partnership in UNDER_REVIEW at version 2 with change_request_count 0."]
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
          trigger:
            - call: "POST /partnerships/${ps_id}/contract-actions"
              payload: { action: "REQUEST_CHANGES", change_request_note: "Revise the marketing envelope." }
              as: UniversityProvost
              as_user_id: "provost-1"
          assert:
            - "Partnership.${ps_id}.status == DRAFT"
            - "Partnership.${ps_id}.change_request_count == 1"
            - "Partnership.${ps_id}.version == 3"

      - name: execute_from_draft_is_rejected_as_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Partnership.UNDER_REVIEW_to_EXECUTED
          - validations[priority=18]
          - errors[ERR_PARTNERSHIP_INVALID_STATE]
        distinguishing_aspect: "EXECUTE is declared only from UNDER_REVIEW, so firing it on a DRAFT Partnership is 409 ERR_PARTNERSHIP_INVALID_STATE and leaves version at 1."
        test_recipe:
          setup: ["One DRAFT Partnership at version 1."]
          setup_api_calls:
            - *k_clock
            - *k_ps_create
          trigger:
            - call: "POST /partnerships/${ps_id}/contract-actions"
              payload: { action: "EXECUTE", executed_date: "2026-08-01" }
              as: UniversityProvost
              as_user_id: "provost-1"
              captures: { e_psstate: $.data.error_id }
          assert:
            - "response status == 409"
            - "${e_psstate} == 'ERR_PARTNERSHIP_INVALID_STATE'"
            - "Partnership.${ps_id}.status == DRAFT"
            - "Partnership.${ps_id}.version == 1"

      - name: closed_out_partnership_is_terminal_and_rejects_further_contract_actions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Partnership.terminal_states
          - state_machines.Partnership.WIND_DOWN_to_CLOSED_OUT
          - errors[ERR_PARTNERSHIP_INVALID_STATE]
        distinguishing_aspect: "CLOSED_OUT is the only terminal state of the Partnership machine: a Partnership with no Programs and no statements can be wound down and closed out, after which even SUBMIT_FOR_REVIEW is refused."
        test_recipe:
          setup:
            - "One EXECUTED Partnership with no Programs, no counselors and no statements."
            - "WIND_DOWN then CLOSE_OUT applied by the provost, so the Partnership is CLOSED_OUT at version 5."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - &k_ps_wind_down
              call: "POST /partnerships/${ps_id}/contract-actions"
              payload: { action: "WIND_DOWN", wind_down_reason: "Partner exit agreed", wind_down_effective_date: "2026-08-15" }
              as: UniversityProvost
              as_user_id: "provost-1"
            - &k_ps_close_out
              call: "POST /partnerships/${ps_id}/contract-actions"
              payload: { action: "CLOSE_OUT" }
              as: UniversityProvost
              as_user_id: "provost-1"
          trigger:
            - call: "POST /partnerships/${ps_id}/contract-actions"
              payload: { action: "SUBMIT_FOR_REVIEW" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { e_term: $.data.error_id }
          assert:
            - "Partnership.${ps_id}.status == CLOSED_OUT"
            - "Partnership.${ps_id}.version == 5"
            - "response status == 409"
            - "${e_term} == 'ERR_PARTNERSHIP_INVALID_STATE'"

      - name: program_submit_twice_second_attempt_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Program.DRAFT_to_SUBMITTED
          - validations[priority=19]
          - errors[ERR_PROGRAM_INVALID_STATE]
        distinguishing_aspect: "SUBMIT is not idempotent: the second SUBMIT on an already SUBMITTED Program is 409 ERR_PROGRAM_INVALID_STATE and must not re-score demand or bump revision_round."
        test_recipe:
          setup: ["EXECUTED Partnership with Program 'MBA Online' holding one APPROVED course and the MARKETING scope, already SUBMITTED."]
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
          trigger:
            - call: "POST /programs/${pg_id}/lifecycle-actions"
              payload: { action: "SUBMIT" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { e_pgstate: $.data.error_id }
          assert:
            - "response status == 409"
            - "${e_pgstate} == 'ERR_PROGRAM_INVALID_STATE'"
            - "Program.${pg_id}.status == SUBMITTED"
            - "Program.${pg_id}.revision_round == 0"

      - name: course_approve_from_in_design_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Course.FACULTY_REVIEW_to_APPROVED
          - validations[priority=20]
          - errors[ERR_COURSE_INVALID_DESIGN_STATE]
        distinguishing_aspect: "APPROVE is declared only from FACULTY_REVIEW, so approving a course still IN_DESIGN is 409 ERR_COURSE_INVALID_DESIGN_STATE and no faculty_approver_name is recorded."
        test_recipe:
          setup: ["EXECUTED Partnership, DRAFT Program, Course MBA-501 in design_status IN_DESIGN."]
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
          trigger:
            - call: "POST /courses/${c1_id}/design-actions"
              payload: { action: "APPROVE", faculty_approver_name: "Dr. Imani Osei" }
              as: FacultyChair
              as_user_id: "faculty-1"
              captures: { e_cstate: $.data.error_id }
          assert:
            - "response status == 409"
            - "${e_cstate} == 'ERR_COURSE_INVALID_DESIGN_STATE'"
            - "Course.${c1_id}.design_status == IN_DESIGN"
            - "Course.${c1_id}.faculty_approver_name == null"

      - name: first_payment_activates_the_enrollment_and_syncs_the_cash_ledger
        claim_type: side_effect_execution
        grounds:
          - state_machines.Enrollment.ENROLLED_to_ACTIVE
          - calculations.cash_position_reconciliation
          - entities.Program.fields.active_enrollment_count
        distinguishing_aspect: "The ENROLLED -> ACTIVE edge fires on the first PAYMENT as a system event, not on an explicit action: collected_cents and Partnership.collected_tuition_cents both reach 562500 in the same request that flips the status."
        test_recipe:
          setup: ["ENROLLED Enrollment S-2001 of 9 credits with collected_cents 0; logical clock 2026-09-05."]
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
            - *k_pg_approve
            - *k_pg_launch
            - *k_co_create
            - *k_co_plan
            - *k_co_review
            - *k_lead_create
            - *k_lead_contact
            - *k_lead_apply
            - *k_enroll
            - *k_clock_sep5
          trigger:
            - *k_pay_full
          assert:
            - "Enrollment.${en_id}.status == ACTIVE"
            - "Enrollment.${en_id}.collected_cents == 562500"
            - "Partnership.${ps_id}.collected_tuition_cents == 562500"
            - "Program.${pg_id}.active_enrollment_count == 1"
            - "Program.${pg_id}.total_enrollment_count == 1"

      - name: disqualified_lead_is_terminal_so_apply_cannot_revive_it
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Lead.terminal_states
          - state_machines.Lead.NEW|CONTACTED|APPLIED_to_DISQUALIFIED
          - errors[ERR_LEAD_INVALID_STATE]
        distinguishing_aspect: "DISQUALIFIED is terminal for Lead: after a manual DISQUALIFY the counselor's open_pipeline_count drops to 0 and a subsequent APPLY is 409 ERR_LEAD_INVALID_STATE."
        test_recipe:
          setup: ["LAUNCHED Program with Lead P-1001 in status CONTACTED, open_pipeline_count 1."]
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
            - *k_pg_approve
            - *k_pg_launch
            - *k_co_create
            - *k_co_plan
            - *k_co_review
            - *k_lead_create
            - *k_lead_contact
            - &k_lead_disqualify
              call: "POST /leads/${ld_id}/advance"
              payload: { action: "DISQUALIFY", disqualification_reason: "NOT_QUALIFIED" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
          trigger:
            - call: "POST /leads/${ld_id}/advance"
