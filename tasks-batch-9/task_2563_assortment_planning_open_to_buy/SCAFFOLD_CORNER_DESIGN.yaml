              payload: { cancel_reason: "buy pulled before commitment" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc_commit: $.data.commit_status, rc_fulfil: $.data.fulfillment_status, rc_cancelled: $.data.cancelled_units, rc_open_cost: $.data.open_cost_cents }
