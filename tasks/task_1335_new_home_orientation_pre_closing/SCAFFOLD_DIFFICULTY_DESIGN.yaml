            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T14:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/start", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items", payload: { home_id: "${h1}", appointment_id: "${a1}", title: "Tile hairline crack A" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { d1: "$.data.id" } }
            - { call: "POST /api/deficiency-items/${d1}/classify", payload: { classification: "WARRANTABLE", estimated_repair_cost_cents: 33333 }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items/${d1}/decide", payload: { resolution: "COMPLETE_AFTER_CLOSING" }, as: CustomerCareManager }
            - { call: "POST /api/deficiency-items", payload: { home_id: "${h1}", appointment_id: "${a1}", title: "Tile hairline crack B" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { d2: "$.data.id" } }
            - { call: "POST /api/deficiency-items/${d2}/classify", payload: { classification: "WARRANTABLE", estimated_repair_cost_cents: 33333 }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items/${d2}/decide", payload: { resolution: "COMPLETE_AFTER_CLOSING" }, as: CustomerCareManager }
            - { call: "POST /api/attendees", payload: { appointment_id: "${a1}", attendee_type: "BUYER", buyer_id: "${b1}" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { at1: "$.data.id" } }
            - { call: "POST /api/attendees/${at1}/decide-verification", payload: { decision: "VERIFIED" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/checklist-items/HVAC/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/PLUMBING/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/ELECTRICAL/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/appointments/${a1}/checklist-items/EXTERIOR/mark", payload: { outcome: "DEMONSTRATED" }, as: CustomerCareRep, as_user_id: "${r1}" }
