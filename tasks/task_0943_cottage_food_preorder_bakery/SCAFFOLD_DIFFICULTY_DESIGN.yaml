              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/recipes"
              payload: { baker_id: "${baker_id}", name: "Brown Butter Cookie" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { r_cookie: $.data.id }
            - call: "POST /bakery/recipes/${r_cookie}/components"
              payload: { component_name: "flour and butter", quantity_grams: 500, declared_allergens: ["wheat", "milk"], ingredient_lot_id: "${lot_flour}" }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/recipes/${r_cookie}/publish"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/menu-items"
              payload: { baker_id: "${baker_id}", recipe_id: "${r_cookie}", name: "Brown Butter Cookie", product_class: "SHELF_STABLE", pricing_basis: "PER_DOZEN_BAKERS", unit_price_cents: 450, dozen_price_cents: 4600, oven_profile: "STANDARD" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { mi_cookie: $.data.id }
            - call: "POST /bakery/menu-items/${mi_cookie}/listing-status"
              payload: { to_status: "LISTED" }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/menu-items"
              payload: { baker_id: "${baker_id}", recipe_id: "${r_cookie}", name: "Country Loaf", product_class: "SHELF_STABLE", pricing_basis: "PER_UNIT", unit_price_cents: 900, dozen_price_cents: 9600, oven_profile: "LONG_BAKE", oven_hours_per_batch: 3.0, yield_units_per_slot: 12 }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { mi_bread: $.data.id }
            - call: "POST /bakery/menu-items/${mi_bread}/listing-status"
              payload: { to_status: "LISTED" }
