        grounds:
          - state_machines.Agreement.DRAFT_to_ACTIVE
          - state_machines.Property.AVAILABLE_to_UNDER_AGREEMENT
          - entities.Property.fields.status
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair Agreement<-Property: Agreement DRAFT->ACTIVE is allowed only when the linked
