      - name: lien_certify_depends_on_account_status
        grounds:
          - state_machines.LienTransfer.CERTIFIED_to_TRANSFERRED
          - state_machines.Account.DELINQUENT_to_LIEN_TRANSFERRED
          - entities.Account.fields.status
        distinguishing_aspect: |
          Certifying a lien transitions the DELINQUENT account to LIEN_TRANSFERRED and
