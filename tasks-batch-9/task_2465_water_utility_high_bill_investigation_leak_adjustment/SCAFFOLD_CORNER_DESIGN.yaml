          The deposit rule is two-sided — a CUSTOMER request must carry exactly 3000 and a UTILITY
          request must carry exactly 0, so 0 and 3000 are each valid for one kind and invalid for the
          other — and the result window is half-open, so a tested_at exactly equal to window_end is
