# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe over §1.1–§1.7 not covered by §1.8)
# claim_type values drawn from references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: bid_create_returns_system_fields
        claim_type: Creation
        grounds:
          - "entities.BusinessImprovementDistrict"
          - "endpoints.\"POST /business-improvement-districts\""
        distinguishing_aspect: "Create returns 201 with status=FORMING, version=1, server-minted id (unprefixed UUID)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /business-improvement-districts"
              payload: { name: "New BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
          trigger:
            - call: "GET /business-improvement-districts/${bid_id}"
              payload: {}
              as: DistrictAdministrator
          assert:
            - "BusinessImprovementDistrict.${bid_id}.status == FORMING"
            - "BusinessImprovementDistrict.${bid_id}.version == 1"
            - "min_assessment_cents defaulted to 50000, max_assessment_cents to 10000000"

      - name: bid_not_found_returns_404
        claim_type: Not Found
        grounds:
          - "errors[ERR_BID_NOT_FOUND]"
        distinguishing_aspect: "GET a non-existent district id returns ERR_BID_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /business-improvement-districts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DistrictAdministrator
              captures: { err: $.data.error_id }
          assert: ["response error_id == ERR_BID_NOT_FOUND"]

      - name: parcel_missing_use_class_rejected
        claim_type: Required Fields
        grounds:
          - "entities.Parcel.fields.use_class"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Creating a parcel without required use_class returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A district exists."]
          setup_api_calls:
            - call: "POST /business-improvement-districts"
              payload: { name: "V BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
          trigger:
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "Z-1", owner_name: "Z", assessed_value_cents: 100000, linear_frontage_ft: 10, building_sqft: 100 }
              as: DistrictAdministrator
              captures: { err: $.data.error_id }
          assert: ["response error_id == ERR_VALIDATION"]

      - name: exempt_parcel_weighted_base_zero
        claim_type: Computed Fields
        grounds:
          - "entities.Parcel.fields.exempt"
          - "entities.Parcel.fields.weighted_base"
          - "calculations.parcel_weighted_base"
        distinguishing_aspect: "A NONPROFIT_EXEMPT parcel is computed exempt=true with weighted_base 0 regardless of value/frontage/sqft."
        test_recipe:
          setup: ["A district exists."]
          setup_api_calls:
            - call: "POST /business-improvement-districts"
              payload: { name: "Ex BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
          trigger:
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "NP-1", owner_name: "Charity", use_class: "NONPROFIT_EXEMPT", assessed_value_cents: 100000000, linear_frontage_ft: 50, building_sqft: 10000 }
              as: DistrictAdministrator
              captures: { pe_id: $.data.id }
          assert:
            - "Parcel.${pe_id}.exempt == true"
            - "Parcel.${pe_id}.weighted_base == 0"

      - name: commercial_parcel_weighted_base_computed
        claim_type: Computed Fields
        grounds:
          - "entities.Parcel.fields.weighted_base"
          - "calculations.parcel_weighted_base"
        distinguishing_aspect: "COMMERCIAL parcel weighted_base = 0.0005*(100000000/100) + 2.0*50 + 0.01*10000 = 700 (multiplier 1.0)."
        test_recipe:
          setup: ["A district with weights value 0.0005, frontage 2.0, sqft 0.01."]
          setup_api_calls:
            - call: "POST /business-improvement-districts"
              payload: { name: "WB BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
          trigger:
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "WB-1", owner_name: "Owner", use_class: "COMMERCIAL", assessed_value_cents: 100000000, linear_frontage_ft: 50, building_sqft: 10000 }
              as: DistrictAdministrator
              captures: { wb_id: $.data.id }
          assert: ["Parcel.${wb_id}.weighted_base == 700"]

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: new_bid_initial_state_forming
        claim_type: Initial State
        grounds:
          - "state_machines.BusinessImprovementDistrict"
          - "entities.BusinessImprovementDistrict.fields.status"
        distinguishing_aspect: "A freshly created district starts in FORMING."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /business-improvement-districts"
              payload: { name: "Init BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
          trigger:
            - call: "GET /business-improvement-districts/${bid_id}"
              payload: {}
              as: DistrictAdministrator
          assert: ["BusinessImprovementDistrict.${bid_id}.status == FORMING"]

      - name: activate_already_active_rejected
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.BusinessImprovementDistrict.FORMING_to_ACTIVE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Activating a district already ACTIVE returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ACTIVE district (activated once)."]
          setup_api_calls:
            - call: "POST /business-improvement-districts"
              payload: { name: "AA BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "AA-1", owner_name: "O", use_class: "COMMERCIAL", assessed_value_cents: 100000000, linear_frontage_ft: 50, building_sqft: 10000 }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts/${bid_id}/activate"
              payload: {}
              as: BoardMember
          trigger:
            - call: "POST /business-improvement-districts/${bid_id}/activate"
              payload: {}
              as: BoardMember
              captures: { err: $.data.error_id }
          assert: ["response error_id == ERR_INVALID_STATE"]

      - name: rewithdraw_parcel_rejected
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Assessment.CERTIFIED_to_CANCELLED"
          - "entities.Parcel.fields.status"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Withdrawing an already-WITHDRAWN parcel returns ERR_INVALID_STATE (terminal parcel status)."
        test_recipe:
          setup: ["A district with one parcel already WITHDRAWN."]
          setup_api_calls:
            - call: "POST /business-improvement-districts"
              payload: { name: "WD BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "WD-1", owner_name: "O", use_class: "COMMERCIAL", assessed_value_cents: 100000000, linear_frontage_ft: 50, building_sqft: 10000 }
              as: DistrictAdministrator
              captures: { p_id: $.data.id }
            - call: "POST /parcels/${p_id}/withdraw"
              payload: {}
              as: DistrictAdministrator
          trigger:
            - call: "POST /parcels/${p_id}/withdraw"
              payload: {}
              as: DistrictAdministrator
              captures: { err: $.data.error_id }
          assert: ["response error_id == ERR_INVALID_STATE"]

      - name: resolve_terminal_dispute_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - "errors[ERR_DISPUTE_NOT_OPEN]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / dispute_resolve_state_beats_fiscal
          rationale: "The §1.8 conflict instance already exercises resolving a terminal (RESOLVED_DENIED) dispute yielding ERR_DISPUTE_NOT_OPEN."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: payment_waterfall_interest_then_penalty
        claim_type: Correct Result
        grounds:
          - "calculations.payment_waterfall_allocation"
          - "entities.Payment.fields.applied_to_interest_cents"
        distinguishing_aspect: "On a delinquent account (interest 80500, penalty 402500), a 100000 payment allocates 80500 interest, 19500 penalty, 0 principal (pinned interest->penalty->principal)."
        test_recipe:
          setup: ["Single-parcel BID certified 4025000; account DELINQUENT at clock due+40 (interest 80500, penalty 402500)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts"
              payload: { name: "WF BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "PX-1", owner_name: "X", use_class: "COMMERCIAL", assessed_value_cents: 100000000, linear_frontage_ft: 50, building_sqft: 10000 }
              as: DistrictAdministrator
              captures: { px_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/activate"
              payload: {}
              as: BoardMember
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2028", start_date: "2027-07-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z", assessment_due_date: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { fy_id: $.data.id }
            - call: "POST /fiscal-years/${fy_id}/budget"
              payload: { total_expenditure_cents: 4025000, other_revenue_cents: 0 }
              as: DistrictAdministrator
              captures: { budget_id: $.data.id }
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "CLEAN", allocated_amount_cents: 4025000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/propose"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/adopt"
              payload: {}
              as: BoardMember
            - call: "GET /assessments"
              payload: { parcel_id: "${px_id}", fiscal_year_id: "${fy_id}" }
              as: DistrictAdministrator
              captures: { ax_id: "$.data[0].id" }
            - call: "GET /assessments/${ax_id}/collection-account"
              payload: {}
              as: TaxCollector
              captures: { acct_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-10T00:00:00Z" }
              as: TaxCollector
            - call: "POST /collection-accounts/${acct_id}/assess-delinquency"
              payload: {}
              as: TaxCollector
          trigger:
            - call: "POST /collection-accounts/${acct_id}/payments"
              payload: { amount_cents: 100000 }
              as: TaxCollector
              captures: { pay_id: $.data.id }
          assert:
            - "Payment.${pay_id}.applied_to_interest_cents == 80500"
            - "Payment.${pay_id}.applied_to_penalty_cents == 19500"
            - "Payment.${pay_id}.applied_to_principal_cents == 0"

      - name: workplan_spend_reconciled_on_resolve
        claim_type: Correct Result
        grounds:
          - "calculations.workplan_spend_reconciliation"
          - "state_machines.ServiceRequest.IN_PROGRESS_to_RESOLVED"
          - "entities.WorkPlanLine.fields.spent_amount_cents"
        distinguishing_aspect: "Resolving a service request with logged_cost_cents 50000 in category CLEAN increments the ADOPTED budget's CLEAN WorkPlanLine.spent_amount_cents to 50000."
        test_recipe:
          setup: ["ACTIVE BID with ADOPTED budget (CLEAN line), an ACTIVE ambassador, and an IN_PROGRESS service request assigned to that ambassador."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts"
              payload: { name: "SR BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "PX-1", owner_name: "X", use_class: "COMMERCIAL", assessed_value_cents: 100000000, linear_frontage_ft: 50, building_sqft: 10000 }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts/${bid_id}/activate"
              payload: {}
              as: BoardMember
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2028", start_date: "2027-07-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z", assessment_due_date: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { fy_id: $.data.id }
            - call: "POST /fiscal-years/${fy_id}/budget"
              payload: { total_expenditure_cents: 4025000, other_revenue_cents: 0 }
              as: DistrictAdministrator
              captures: { budget_id: $.data.id }
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "CLEAN", allocated_amount_cents: 4025000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/propose"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/adopt"
              payload: {}
              as: BoardMember
            - call: "POST /business-improvement-districts/${bid_id}/ambassadors"
              payload: { name: "Amy", service_role: "CLEAN" }
              as: DistrictAdministrator
              captures: { amb_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/service-requests"
              payload: { category: "CLEAN", source: "THREE_ONE_ONE", external_ref: "311-1" }
              as: DistrictAdministrator
              captures: { sr_id: $.data.id }
            - call: "POST /service-requests/${sr_id}/transition"
              payload: { action: "ASSIGN", ambassador_id: "${amb_id}" }
              as: DistrictAdministrator
            - call: "POST /service-requests/${sr_id}/transition"
              payload: { action: "START" }
              as: Ambassador
              as_user_id: "${amb_id}"
          trigger:
            - call: "POST /service-requests/${sr_id}/transition"
              payload: { action: "RESOLVE", logged_cost_cents: 50000, work_plan_category: "CLEAN" }
              as: Ambassador
              as_user_id: "${amb_id}"
            - call: "GET /budgets/${budget_id}/work-plan-lines"
              payload: {}
              as: DistrictAdministrator
              captures: { line_id: "$.data[0].id" }
          assert:
            - "WorkPlanLine.${line_id}.spent_amount_cents == 50000"
            - "ServiceRequest.${sr_id}.status == RESOLVED"

      - name: petition_below_threshold_fails
        claim_type: Correct Result
        grounds:
          - "calculations.petition_weighted_support"
          - "state_machines.RenewalPetition.SUBMITTED_to_FAILED"
        distinguishing_aspect: "With one OPPOSE signature (support_weight 0) weighted_support_pct 0 < 0.50 so verify moves the petition to FAILED."
        test_recipe:
          setup: ["BID_PET certified with two equal parcels; petition with a single OPPOSE signature; submitted."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts"
              payload: { name: "PF BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0, assessment_weight_frontage: 0, assessment_weight_sqft: 1.0, min_assessment_cents: 1, max_assessment_cents: 100000000 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "PA-1", owner_name: "PA", use_class: "COMMERCIAL", assessed_value_cents: 0, linear_frontage_ft: 0, building_sqft: 10000 }
              as: DistrictAdministrator
              captures: { pa_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/parcels"
              payload: { apn: "PB-1", owner_name: "PB", use_class: "COMMERCIAL", assessed_value_cents: 0, linear_frontage_ft: 0, building_sqft: 10000 }
              as: DistrictAdministrator
            - call: "POST /business-improvement-districts/${bid_id}/activate"
              payload: {}
              as: BoardMember
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2028", start_date: "2027-07-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z", assessment_due_date: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { fy_id: $.data.id }
            - call: "POST /fiscal-years/${fy_id}/budget"
              payload: { total_expenditure_cents: 20000000, other_revenue_cents: 0 }
              as: DistrictAdministrator
              captures: { budget_id: $.data.id }
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "CLEAN", allocated_amount_cents: 20000000 }
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/propose"
              payload: {}
              as: DistrictAdministrator
            - call: "POST /budgets/${budget_id}/adopt"
              payload: {}
              as: BoardMember
            - call: "POST /business-improvement-districts/${bid_id}/renewal-petitions"
              payload: { circulation_deadline: "2027-06-20T00:00:00Z", required_threshold_pct: 0.50 }
              as: DistrictAdministrator
              captures: { pet_id: $.data.id }
            - call: "POST /renewal-petitions/${pet_id}/signatures"
              payload: { parcel_id: "${pa_id}", support: false }
              as: PropertyOwner
              as_user_id: "${pa_id}"
            - call: "POST /renewal-petitions/${pet_id}/submit"
              payload: {}
              as: DistrictAdministrator
          trigger:
            - call: "POST /renewal-petitions/${pet_id}/verify"
              payload: {}
              as: BoardMember
              as_user_id: "board-1"
          assert:
            - "RenewalPetition.${pet_id}.status == FAILED"
            - "RenewalPetition.${pet_id}.weighted_support_pct == 0"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: duplicate_workplan_category_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_DUPLICATE_CATEGORY]"
        distinguishing_aspect: "Adding a second CLEAN work-plan line to the same budget returns ERR_DUPLICATE_CATEGORY."
        test_recipe:
          setup: ["A DRAFT budget with one CLEAN line."]
          setup_api_calls:
            - call: "POST /business-improvement-districts"
              payload: { name: "DC BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2028", start_date: "2027-07-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z", assessment_due_date: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { fy_id: $.data.id }
            - call: "POST /fiscal-years/${fy_id}/budget"
              payload: { total_expenditure_cents: 5000000, other_revenue_cents: 0 }
              as: DistrictAdministrator
              captures: { budget_id: $.data.id }
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "CLEAN", allocated_amount_cents: 2000000 }
              as: DistrictAdministrator
          trigger:
            - call: "POST /budgets/${budget_id}/work-plan-lines"
              payload: { category: "CLEAN", allocated_amount_cents: 1000000 }
              as: DistrictAdministrator
              captures: { err: $.data.error_id }
          assert: ["response error_id == ERR_DUPLICATE_CATEGORY"]

      - name: budget_exists_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_BUDGET_EXISTS]"
        distinguishing_aspect: "Creating a second budget for a fiscal year that already has one returns ERR_BUDGET_EXISTS."
        test_recipe:
          setup: ["A fiscal year that already has a budget."]
          setup_api_calls:
            - call: "POST /business-improvement-districts"
              payload: { name: "BE BID", boundary_description: "b", authorization_expires_at: "2031-05-01T00:00:00Z", assessment_weight_value: 0.0005, assessment_weight_frontage: 2.0, assessment_weight_sqft: 0.01 }
              as: DistrictAdministrator
              captures: { bid_id: $.data.id }
            - call: "POST /business-improvement-districts/${bid_id}/fiscal-years"
              payload: { year_label: "FY2028", start_date: "2027-07-01T00:00:00Z", end_date: "2028-07-01T00:00:00Z", assessment_due_date: "2027-08-01T00:00:00Z" }
              as: DistrictAdministrator
              captures: { fy_id: $.data.id }
            - call: "POST /fiscal-years/${fy_id}/budget"
              payload: { total_expenditure_cents: 5000000, other_revenue_cents: 0 }
              as: DistrictAdministrator
          trigger:
            - call: "POST /fiscal-years/${fy_id}/budget"
              payload: { total_expenditure_cents: 6000000, other_revenue_cents: 0 }
              as: DistrictAdministrator
              captures: { err: $.data.error_id }
          assert: ["response error_id == ERR_BUDGET_EXISTS"]

      - name: budget_unbalanced_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_BUDGET_UNBALANCED]"
        distinguishing_aspect: "Proposing a budget whose work-plan lines (3000000) do not sum to total_expenditure_cents (5000000) returns ERR_BUDGET_UNBALANCED."
        test_recipe:
          setup: ["ACTIVE BID with one parcel; DRAFT budget total_expenditure 5000000 but only a 3000000 CLEAN line."]
          setup_api_calls:
            - call: "POST /business-improvement-districts"
