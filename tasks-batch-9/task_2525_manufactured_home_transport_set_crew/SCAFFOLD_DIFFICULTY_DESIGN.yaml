      - name: claim_adjudicate_five_level_chargeback_cascade
        grounds:
          - state_machines.DamageClaim.UNDER_REVIEW_to_ADJUDICATED
          - state_machines.RouteLeg.SCHEDULED_to_HAULER_HOLD
          - calculations.damage_claim_allocation
          - calculations.party_chargeback_ledger
          - calculations.order_posture
          - entities.Hauler.fields.status
        distinguishing_aspect: |
          A single adjudicate call propagates five levels through a DIFFERENT
          entity chain than the permit cascade - claim -> party charge fields ->
          Hauler.chargeback_balance_cents -> Hauler.status crossing
