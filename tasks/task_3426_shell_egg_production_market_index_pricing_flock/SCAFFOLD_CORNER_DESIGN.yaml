              captures: { err_receive: $.data.error_id }
            - call: "POST /api/feed-contracts/${fc_id}/receive"
              payload: { tons: 10, spot_cents_per_ton: 17500 }
              as: ProcurementLead
            - call: "POST /api/feed-contracts/${fc_id}/hedge"
