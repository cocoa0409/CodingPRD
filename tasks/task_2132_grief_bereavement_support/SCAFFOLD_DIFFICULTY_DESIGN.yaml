              as: ReferralSource
              captures: { ref_n_id: $.data.id }
            - call: "POST /bereavement/referrals/${ref_n_id}/screen"
              payload: { eligibility_note: "self referral accepted" }
              as: IntakeCoordinator
            - call: "POST /bereavement/referrals/${ref_n_id}/accept"
              payload: {}
              as: IntakeCoordinator
              captures: { p_n_id: $.data.id }
            - call: "POST /bereavement/participants/${p_n_id}/assessments"
              payload: { kind: "NEEDS", instrument: "ICG_SF", grief_severity: 10, isolation_index: 4, functional_impairment: 4, suicidality_flag: false }
              as: IntakeCoordinator
          trigger:
            - call: "GET /bereavement/participants/${p_n_id}/outcome-summary"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 422"
            - "err == ERR_NO_BASELINE_ASSESSMENT"
            - "Participant.${p_n_id}.baseline_score is null"
            - "Participant.${p_n_id}.latest_score is null"
            - "Participant.${p_n_id}.composite_need_index == 22.50"
            - "Participant.${p_n_id}.risk_tier == LOW"

  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: enrollment_creation_depends_on_cohort_open_enrollment_state
        grounds:
          - state_machines.Enrollment.HELD_to_CONFIRMED
          - state_machines.Cohort.FORMING_to_OPEN_ENROLLMENT
          - errors[ERR_COHORT_NOT_ENROLLING]
          - validations[priority=9]
          - concurrency_rules[enrollment-create-stale-cohort]
        distinguishing_aspect: |
          Entity pair Enrollment -> Cohort: the identical enrollment request fails with
          ERR_COHORT_NOT_ENROLLING (409) while the cohort sits in FORMING and succeeds
          with HTTP 201 once the cohort reaches OPEN_ENROLLMENT, with no change to the
          request other than the refreshed expected_cohort_version.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "MeetingSpace 'Chapel Room' with capacity 20."
            - "Cohort created and left in FORMING (open-enrollment never called), version 1, seats_open 4."
            - "One accepted Participant with a NEEDS Assessment."
          setup_api_calls:
            - call: "POST /bereavement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /bereavement/meeting-spaces"
              payload: { name: "Chapel Room", capacity: 20, turnover_buffer_minutes: 30 }
              as: ProgramDirector
              captures: { sp_id: $.data.id }
            - call: "POST /bereavement/cohorts"
              payload: { name: "Not Yet Open", loss_type: "ANTICIPATED_ILLNESS", meeting_space_id: "${sp_id}", seats_total: 4, min_viable_enrollment: 1, weekday: "TUE", start_minute_utc: 600, duration_minutes: 90, series_start_date: "2026-09-08", sessions_total: 8, direct_cost_cents: 240000 }
              as: ProgramDirector
              captures: { c_id: $.data.id, c_v1: $.data.version }
