          - entities.BondIssue.fields.cumulative_funded_cents
          - entities.BondIssue.fields.undrawn_cents
        excluded_because:
          difficulty_instance: voiding_the_first_funded_draw_rebuilds_the_par_split_and_reprices_the_surviving_draw
          rationale: |
            The §1.8 compensating_invariant instance voids the first of two
            funded draws and asserts the complete reversal: funding_date and
            negative_arbitrage_accrual_cents cleared on the voided draw,
            cumulative_funded_cents and undrawn_cents rebuilt, and the surviving
            draw's accrual recomputed from 344,444 to 861,111 with no drift in
