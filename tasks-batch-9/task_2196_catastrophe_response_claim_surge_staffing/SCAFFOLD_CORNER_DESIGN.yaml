          rationale: "The named §1.8 instance already closes a claim under an EFFECTIVE CANCELLATION_MORATORIUM to observe ERR_MORATORIUM_ACTIVE once the state check passes."

      - name: corner_err_claim_not_inspected_on_close
        claim_type: error_triggerable
        grounds: [errors.ERR_CLAIM_NOT_INSPECTED, validations.priority_19]
        excluded_because:
          difficulty_instance: pair_a_close_claim_state_19_beats_moratorium_safety_21
          rationale: "The named §1.8 instance already violates both rules at once and asserts ERR_CLAIM_NOT_INSPECTED is the returned error, which is exactly this error's trigger."

      - name: corner_err_deployment_window_conflict_inside_rest_buffer
        claim_type: error_triggerable
        grounds: [errors.ERR_DEPLOYMENT_WINDOW_CONFLICT, validations.priority_23]
        excluded_because:
          difficulty_instance: pair_b_confirm_deployment_temporal_23_beats_fiscal_38
          rationale: "The named §1.8 instance already confirms a second deployment inside the 12-hour rest buffer and asserts ERR_DEPLOYMENT_WINDOW_CONFLICT."

      - name: corner_err_housing_capacity_exceeded_on_confirm
        claim_type: error_triggerable
        grounds: [errors.ERR_HOUSING_CAPACITY_EXCEEDED, validations.priority_38]
        excluded_because:
          difficulty_instance: pair_b_confirm_deployment_temporal_23_beats_fiscal_38
          rationale: "The named §1.8 instance already sets up the rooms_available shortfall that fires ERR_HOUSING_CAPACITY_EXCEEDED once the temporal rule is satisfied."

      - name: corner_err_inspection_mode_mismatch_on_schedule
        claim_type: error_triggerable
        grounds: [errors.ERR_INSPECTION_MODE_MISMATCH, validations.priority_29]
        excluded_because:
          difficulty_instance: pair_c_schedule_assignment_referential_29_beats_constraint_32
          rationale: "The named §1.8 instance already schedules with body.mode differing from the claim's computed inspection_mode and asserts ERR_INSPECTION_MODE_MISMATCH."

      - name: corner_err_adjuster_at_capacity_on_schedule
        claim_type: error_triggerable
        grounds: [errors.ERR_ADJUSTER_AT_CAPACITY, validations.priority_32]
        excluded_because:
          difficulty_instance: pair_c_schedule_assignment_referential_29_beats_constraint_32
          rationale: "The named §1.8 instance already drives open_assignment_count to max_open_claims so the same request fires ERR_ADJUSTER_AT_CAPACITY once the mode matches."

      - name: corner_err_assignment_outside_deployment_by_one_second
        claim_type: error_triggerable
        grounds: [errors.ERR_ASSIGNMENT_OUTSIDE_DEPLOYMENT, validations.priority_26]
        excluded_because:
          difficulty_instance: deployment_containment_semantics_inclusive_bounds_one_second_out
          rationale: "The named §1.8 instance already schedules an assignment one second outside the funding deployment's inclusive bounds to fire ERR_ASSIGNMENT_OUTSIDE_DEPLOYMENT."

      - name: corner_err_adjuster_not_available_on_confirm
        claim_type: error_triggerable
        grounds: [errors.ERR_ADJUSTER_NOT_AVAILABLE, state_machines.Deployment.transitions.REQUESTED_to_CONFIRMED]
        excluded_because:
          difficulty_instance: deployment_confirm_gated_by_adjuster_resting_axis
          rationale: "The named §1.8 instance already confirms a deployment whose adjuster is RESTING and asserts ERR_ADJUSTER_NOT_AVAILABLE."

      - name: corner_err_event_not_declared_on_housing_open
        claim_type: error_triggerable
        grounds: [errors.ERR_EVENT_NOT_DECLARED, state_machines.HousingBlock.transitions.PENDING_to_ACTIVE]
        excluded_because:
          difficulty_instance: housing_block_open_gated_by_event_declaration
          rationale: "The named §1.8 instance already opens a block on a MONITORING event and asserts ERR_EVENT_NOT_DECLARED."

      - name: corner_err_vendor_not_activated_on_accept
        claim_type: error_triggerable
        grounds: [errors.ERR_VENDOR_NOT_ACTIVATED, state_machines.VendorAssignment.transitions.DISPATCHED_to_ACCEPTED]
        excluded_because:
          difficulty_instance: vendor_assignment_accept_gated_by_firm_network_status
          rationale: "The named §1.8 instance already accepts a DISPATCHED assignment whose firm is not ACTIVATED and asserts ERR_VENDOR_NOT_ACTIVATED."
# §1.9 corner-design index — PART C (sections: rbac, cross_cutting_complexity_layers, consistency_model)
# Concatenated under the top-level `scaffold_corner_design:` key of SCAFFOLD_CORNER_DESIGN.yaml.
# Claim types taken verbatim from claim-extraction-guide.md "From Table 7 (RBAC)",
# "From Cross-Cutting Complexity Layers" and "From Consistency Model".
  - section: rbac
    instances:
      - name: corner_rbac_deployment_coordinator_denied_claim_triage
        claim_type: peer_roles
        grounds:
          - roles.DeploymentCoordinator
          - roles.ClaimsExaminer
          - endpoints.POST /claims/{claimId}/triage
          - validations.priority_3
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "POST /claims/{claimId}/triage lists only ClaimsExaminer, so a DeploymentCoordinator is refused with ERR_ROLE_NOT_PERMITTED and the claim stays in INTAKE with severity_score 0.00."
        test_recipe:
          setup: ["One DECLARED CatastropheEvent in FL and one INTAKE Claim attached to it; no triage has been attempted."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: CatastropheManager
              as_user_id: "mgr-01"
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-114", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-09-01T00:00:00.000Z", exposure_count: 1000, avg_insured_value: 250000, expected_severity_index: 0.1000 }
              as: CatastropheManager
              as_user_id: "mgr-01"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "mgr-01"
            - call: "POST /claims"
              payload: { policy_number: "POL-1001", loss_state: "FL", loss_date_utc: "2026-09-02T00:00:00.000Z", reported_loss_amount: 8000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 300000, deductible_amount: 5000, estimated_damage_amount: 120000 }], event_id: "${ev}" }
              as: ClaimsExaminer
              as_user_id: "examiner-alice"
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "coord-01"
          assert:
            - "HTTP 403 with data.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "GET /claims/${cl} as ClaimsExaminer returns handling_status == 'INTAKE'"
            - "GET /claims/${cl} as ClaimsExaminer returns severity_score == 0.00 and triage_tier == null"
            - "GET /reserve-entries?claim_id=${cl} as ClaimsExaminer returns total_count == 0 (no INITIAL_CASE entry was appended)"

      - name: corner_rbac_claims_examiner_denied_event_declare
        claim_type: peer_roles
        grounds:
          - roles.ClaimsExaminer
          - roles.CatastropheManager
          - endpoints.POST /catastrophe-events/{eventId}/declare
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "Declaring an event is a CatastropheManager exclusive_operation, so a ClaimsExaminer request returns ERR_ROLE_NOT_PERMITTED and the event remains MONITORING at version 1."
        test_recipe:
          setup: ["One CatastropheEvent created in MONITORING at version 1; nothing else exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: CatastropheManager
              as_user_id: "mgr-01"
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-115", peril_type: "HAIL", jurisdiction_state: "TX", event_start_utc: "2026-09-01T00:00:00.000Z", exposure_count: 500, avg_insured_value: 180000, expected_severity_index: 0.0500 }
              as: CatastropheManager
              as_user_id: "mgr-01"
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "examiner-alice"
          assert:
            - "HTTP 403 with data.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "GET /catastrophe-events/${ev} as CatastropheManager returns status == 'MONITORING', declared_at_utc == null and version == 1"

      - name: corner_rbac_catastrophe_manager_denied_adjuster_registration
        claim_type: peer_roles
        grounds:
          - roles.CatastropheManager
          - roles.DeploymentCoordinator
          - endpoints.POST /adjusters
          - endpoints.GET /adjusters
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "The role model is segregation_of_duties, not hierarchical_override: CatastropheManager is refused POST /adjusters with ERR_ROLE_NOT_PERMITTED even though it holds GET /adjusters as a shared_operation."
        test_recipe:
          setup: ["Empty database with the logical clock set to 2026-09-01T00:00:00.000Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: CatastropheManager
              as_user_id: "mgr-01"
          trigger:
            - call: "POST /adjusters"
              payload: { full_name: "Dana Reyes", employment_type: "STAFF", home_state: "FL", licensed_states: ["FL"], license_expiry_utc: "2027-12-31T00:00:00.000Z", max_open_claims: 5, daily_rate: 700, per_diem_rate: 100, desk_certified: true, aerial_certified: false }
              as: CatastropheManager
              as_user_id: "mgr-01"
          assert:
            - "HTTP 403 with data.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "GET /adjusters as CatastropheManager returns HTTP 200 with total_count == 0 — the shared read is permitted, the exclusive write is not"

      - name: corner_rbac_compliance_officer_denied_advance_payment_issuance
        claim_type: peer_roles
        grounds:
          - roles.ComplianceOfficer
          - roles.ClaimsExaminer
          - endpoints.POST /advance-payments
