      - name: backhaul_empty_candidates_returns_empty
        claim_type: computed_read
        grounds: ["calculations.backhaul_ranking", "endpoints[GET /dispatch/backhaul-candidates]"]
        distinguishing_aspect: "Empty candidate pool is a 200 with an empty array (not an error): no SCREENED/ACCEPTED loads exist."
