            as: LegalReviewer
            as_user_id: "LEGAL-1"
            captures: { d_status3: "$.data.status", d_rev: "$.data.revision_number", d_sub2: "$.data.submitted_by_user_id" }
          assert:
            - "run_stmt_count == 1 and run_paid_total == 0: A gets a statement with gross_commission_cents 0, so net 0 is below min_payout_cents 2500 and payout_status is CARRIED_FORWARD, not PAID"
            - "e_empty == ERR_DISCLOSURE_POPULATION_EMPTY with HTTP 422 for PAID_ONLY, because a run can legitimately pay nobody"
            - "e_stale == ERR_STALE_RUN_VERSION with HTTP 412 when the pre-payment run version is replayed"
            - "the ALL_ENROLLED draft succeeds with d_n == 1, d_zero == 1, d_total == 0, d_median == 0, d_mean == 0, d_p90 == 0 and d_share == 0 (the guard for total_earnings_cents == 0, not a division by zero), buckets [1, 0, 0, 0] with share_bp [10000, 0, 0, 0], and d_status == DRAFT"
            - "e_notreview == ERR_DISCLOSURE_NOT_IN_REVIEW for publishing straight out of DRAFT"
            - "d_status2 == LEGAL_REVIEW with d_sub == ANALYST-1, then e_notdraft == ERR_DISCLOSURE_NOT_DRAFT on a second submit"
            - "e_note == ERR_REVISION_NOTE_REQUIRED with HTTP 422 when REQUEST_REVISION carries no note"
            - "e_sod == ERR_SEGREGATION_OF_DUTIES with HTTP 409 when the LegalReviewer call carries X-User-ID ANALYST-1, the submitter: the correct role is not sufficient"
            - "the noted revision returns d_status3 == DRAFT, d_rev == 1 and d_sub2 == null, so the next submitter is free to be anyone again"

