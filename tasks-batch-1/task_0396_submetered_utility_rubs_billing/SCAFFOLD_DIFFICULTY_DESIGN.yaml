            - "After reopen: TenantStatement ${cist_id}.total_due_cents == 6000 (== pre-resolve value; conserved)"
            - "Dispute ${cidp_id}.status == UNDER_REVIEW and reopen_count == 1"

      # --- instance 2: payment reverse restores amount_paid/balance conserved
      - name: payment_reverse_restores_balance_amount_paid_conserved
        grounds:
          - state_machines.Payment.POSTED_to_REVERSED
          - calculations.statement_totals
          - entities.TenantStatement.fields.amount_paid_cents
          - entities.TenantStatement.fields.balance_due_cents
        distinguishing_aspect: |
          Posting a payment of 4000 then reversing it leaves the conserved quantity
          balance_due_cents identical to its pre-payment value (6000) and
          amount_paid_cents back to 0: invariant balance_due_cents == total_due_cents
          - amount_paid_cents holds with amount_paid restored to 0. Conserved quantity
          is the statement's PAYMENT/balance, distinct from instance 1's credit/total_due
          quantity.
        test_recipe:
          setup:
            - "An ISSUED statement with balance_due_cents=6000; a partial payment of 4000 is posted then reversed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PropertyManager
            - call: "POST /properties"
              payload: { name: "PCP", state_code: "CA", recovery_cap_pct: 0.85, common_area_pct: 0.00 }
              as: PropertyManager
              captures: { pcp_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${pcp_id}", utility_type: "WATER", allocation_method: "RUBS", unit_of_measure: "GAL", monthly_admin_fee_cents: 0 }
              as: PropertyManager
              captures: { ucp_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pcp_id}", unit_number: "CPU", square_feet: 800 }
              as: PropertyManager
              captures: { cpu_id: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${cpu_id}", property_id: "${pcp_id}", tenant_user_id: "tCP", occupant_count: 1, move_in_date: "2026-06-01T00:00:00Z" }
              as: PropertyManager
              captures: { cpl_id: $.data.id }
            - call: "POST /leases/${cpl_id}/activate"
              payload: {}
              as: PropertyManager
            - call: "POST /vendor-bills"
              payload: { property_id: "${pcp_id}", utility_id: "${ucp_id}", period_label: "2026-06", total_cost_cents: 7059 }
              as: PropertyManager
              captures: { cpvb_id: $.data.id }
            - call: "POST /vendor-bills/${cpvb_id}/approve"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles"
              payload: { property_id: "${pcp_id}", utility_id: "${ucp_id}", vendor_bill_id: "${cpvb_id}", period_label: "2026-06", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: PropertyManager
              captures: { cpbc_id: $.data.id }
            - call: "POST /billing-cycles/${cpbc_id}/lock-reads"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${cpbc_id}/allocate"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${cpbc_id}/issue-statements"
              payload: {}
              as: PropertyManager
            - call: "GET /statements"
              payload: { billing_cycle_id: "${cpbc_id}" }
              as: PropertyManager
              captures: { cpst_id: "$.data[0].id", cpst_v: "$.data[0].version" }
            - call: "POST /statements/${cpst_id}/payments"
              payload: { amount_cents: 4000, expected_statement_version: "${cpst_v}" }
              as: Tenant
              as_user_id: "tCP"
              captures: { cppay_id: $.data.id }
          trigger:
            - call: "POST /payments/${cppay_id}/reverse"
              payload: {}
              as: PropertyManager
          assert:
            - "After payment: TenantStatement ${cpst_id}.amount_paid_cents == 4000 and balance_due_cents == 2000 and payment_status == PARTIALLY_PAID"
            - "After reverse: TenantStatement ${cpst_id}.amount_paid_cents == 0 (restored)"
            - "After reverse: TenantStatement ${cpst_id}.balance_due_cents == 6000 (== pre-payment value; conserved) and payment_status == UNPAID"
