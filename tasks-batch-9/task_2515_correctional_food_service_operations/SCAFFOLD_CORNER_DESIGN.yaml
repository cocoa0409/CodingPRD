  # ===========================================================================
  # From Cross-Cutting Complexity Layers
  # layers: cascading_side_effects, dual_variant_calculation,
  #         rate_threshold_triggers, optimistic_concurrency,
  #         derived_field_reconciliation
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_diet_order_create_rejects_stale_inmate_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[diet-order-create-stale-inmate]
          - errors.ERR_STALE_INMATE_VERSION
          - endpoints[POST /cfs/diet-orders]
        distinguishing_aspect: "A HOUSING_CHANGE movement bumps Inmate.version without changing status or diet picture, so the stale create is indistinguishable from a valid one on every business field - only the version token catches it, and it is checked at priority 13, before the window and overlap rules."
        test_recipe:
          setup:
            - "Facility FAC-C01 with one IN_CUSTODY inmate at version 1, then moved to housing unit MEDICAL so its version becomes 2."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-C01", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-C01", name: "North Unit Kitchen", sharps_authorized_count: 12 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-C01", housing_unit: "GENERAL" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { inmate_id: $.data.id, stale_v: $.data.version, stale_status: $.data.status }
            - call: "POST /cfs/inmates/${inmate_id}/movement"
              payload: { movement_type: "HOUSING_CHANGE", housing_unit: "MEDICAL" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { fresh_v: $.data.version, fresh_status: $.data.status, fresh_unit: $.data.housing_unit }
          trigger:
            - call: "POST /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", order_type: "MEDICAL", diet_code: "RENAL", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_inmate_version: "${stale_v}", clinical_indication: "Stage 3 CKD" }
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { stale_error: $.data.error_id }
            - call: "POST /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", order_type: "MEDICAL", diet_code: "RENAL", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_inmate_version: "${fresh_v}", clinical_indication: "Stage 3 CKD" }
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { order_status: $.data.status, order_id: $.data.id }
            - call: "GET /cfs/inmates/${inmate_id}"
              payload: {}
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { after_v: $.data.version, after_count: $.data.active_diet_order_count }
          assert:
            - "${stale_v} == 1 and ${fresh_v} == 2; ${stale_status} == ${fresh_status} == IN_CUSTODY and ${fresh_unit} == MEDICAL"
            - "${stale_error} == ERR_STALE_INMATE_VERSION with HTTP 412 and no DietOrder row written"
            - "The retry with the fresh token returns HTTP 201 with ${order_status} == PENDING_VERIFICATION"
            - "${after_v} == 3 - the accepted create advanced the inmate again, so replaying ${fresh_v} would now fail too"
            - "${after_count} == 1 (PENDING_VERIFICATION counts toward active_diet_order_count, not toward the facility's active_special_diet_count)"

      - name: corner_occ_batch_create_rejects_stale_facility_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[batch-create-stale-facility]
          - errors.ERR_STALE_FACILITY_VERSION
          - endpoints[POST /cfs/production-batches]
        distinguishing_aspect: "The interleaved write is a clean sharps audit: it rewrites sharps_on_board_count and advances Facility.version while leaving kitchen_posture at OPEN and the shortfall at 0, so the batch create sees an identical posture and is stopped only by the version token."
        test_recipe:
          setup:
