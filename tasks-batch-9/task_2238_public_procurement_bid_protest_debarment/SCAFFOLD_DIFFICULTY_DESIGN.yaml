          - calculations.apparent_low_bidder_selection
          - entities.Bid.fields.nonresponsive_reason_codes
        distinguishing_aspect: |
          A DIFFERENT trigger from the corrective-action chain — POST
          /procurement/debarment-proceedings/{id}/decision with outcome DEBARRED — and a
          different hop sequence: DebarmentProceeding/Vendor -> Bid -> Solicitation ->
          Award, four hops, where hop 3 changes apparent_low_bid_id from B8 to B9 and only
          that change causes hop 4's void_reason_code APPARENT_LOW_BIDDER_CHANGED (never
          PROTEST_SUSTAINED).
