        - name: closed_budget_refuses_revise_evaluate_and_close
          claim_type: Terminal State Lockdown
          grounds: "§1.2 Budget terminal_states [CLOSED] with no outgoing transition; §1.4 priority 40 yields ERR_BUDGET_STATE_INVALID (409); §1.4 priority 30 runs the OCC check ahead of the state check."
          distinguishing_aspect: "The revise attempt carries the CORRECT expected_budget_version, so the priority-30 OCC gate passes and the priority-40 terminal-state gate is what must reject it — a stale version would have masked the lockdown behind a 412."
          test_recipe:
            setup:
              - "One CLOSED budget."
            setup_api_calls:
              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400" }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/budgets"
                payload: { business_unit_id: "${bu_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", amount_cents: 10000, forecast_cents: 9000 }
                as: FinOpsController
                as_user_id: "controller-1"
                captures: { bud_id: "$.data.id" }
              - call: "POST /finops/budgets/${bud_id}/activate"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "POST /finops/budgets/${bud_id}/close"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
                captures: { bud_v: "$.data.version" }
            trigger:
              - call: "POST /finops/budgets/${bud_id}/revise"
                payload: { expected_budget_version: "${bud_v}", forecast_cents: 12000 }
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "POST /finops/budgets/${bud_id}/evaluate"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "POST /finops/budgets/${bud_id}/close"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
              - call: "GET /finops/budgets/${bud_id}"
                payload: {}
                as: FinOpsController
                as_user_id: "controller-1"
            assert:
              - "All three action calls: HTTP 409 with data.error_id == \"ERR_BUDGET_STATE_INVALID\" — not 412, because the supplied version matched."
              - "Final read: data.status == \"CLOSED\", data.forecast_cents == 9000, data.revision_count == 0."
              - "Final read: data.version == ${bud_v} — three rejected writes left the version untouched."

        - name: sealing_a_shared_cost_pool_twice_is_rejected
          claim_type: Idempotency
          grounds: "§1.5 POST /finops/shared-cost-pools/{id}/seal sets status SEALED; §1.1 SharedCostPool.status is a two-value system enum OPEN | SEALED; §1.4 priority 40 yields ERR_POOL_STATE_INVALID (409)."
          distinguishing_aspect: "Seal is the scaffold's one-way switch with no un-seal path, so replaying it must be an error rather than a silent no-op, and the version must not creep on the replay."
