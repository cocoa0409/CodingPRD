              as: FranchisorOps
          trigger:
            - call: "GET /kiosk-ops/fish-lots/11111111-1111-4111-8111-111111111111"
              as: FranchiseChef
              as_user_id: "${chef_id}"
              captures: { nf_error: $.data.error_id, nf_message: $.data.message }
          assert:
            - "the response status is 404"
            - "response_type == \"error\" and data.error_id == ERR_SOURCING_RECORD_NOT_FOUND"
            - "data.message is a non-empty string"
            - "GET /kiosk-ops/fish-lots/11111111-1111-4111-8111-111111111111/cold-chain-readings also returns ERR_SOURCING_RECORD_NOT_FOUND with HTTP 404"
            - "no FishLot row is created as a side effect of the lookup"
      - name: pack_lot_create_missing_required_pack_count_returns_invalid_request
