# =============================================================================
# PRD-Bench Scaffold — Task 2816
# Postdoctoral Appointment & Visa Administration
# (university postdoctoral affairs office)
# =============================================================================

scenario: |
  2816. Postdoctoral Appointment & Visa Administration (university postdoctoral
  affairs office): appointment offer with title classification, term limits and
  total-years-in-rank policy, funding source verification and salary minimum
  compliance, visa category selection with sponsorship processing timelines and
  start-date dependency, benefits eligibility differing by employee versus
  fellowship classification, mentoring plan and individual development plan
  requirements from funders, reappointment review, non-renewal notice and
  grievance channels, export control and research security review before lab
  access, exit processing and intellectual property assignment

domain_name: postdoc-appointment-visa-administration

# Flat peer topology: every entity is a root-level collection; children are
# joined by foreign keys rather than nested ownership paths. The api_prefix is
# therefore empty and each collection segment sits directly under the root.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer collections joined by FK: /postdocs, /appointments, /visa-cases,
  # /development-documents, /export-control-reviews, /lab-access-grants,
  # /reappointment-reviews, /grievances, /exit-records. No ownership nesting in
  # URL paths; sub-resource GETs exist only as reverse-lookup read channels.

  state_machine_shape: parallel
  # Appointment carries two independent state dimensions on the same row
  # (appointment_status x compliance_status). VisaCase and DevelopmentDocument
  # are cyclic (RFE loop / revision loop). ReappointmentReview is a branching
  # fork-join with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Appointment -> VisaCase / DevelopmentDocument / ...
    - self_referential     # Appointment.predecessor_appointment_id -> Appointment.id
    - cross_aggregate      # LabAccessGrant spans Appointment and Laboratory

  role_model: segregation_of_duties
  # The officer who prepared an appointment may not approve its salary
  # exception, may not decide its export-control review, and the officer who
  # issued a non-renewal notice may not resolve the resulting grievance.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 39 endpoints / 34 error codes / 8 calculations
  # (3 of them dual-variant) / 9 state machines / 2 OCC rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================

entities:

  - name: Postdoc
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: legal name of the postdoctoral scholar
        constraints: non-empty, max 120 chars
      - name: email
        type: string
        source: input
        description: institutional contact email; unique across all Postdoc rows
        constraints: unique; must contain '@'
      - name: citizenship_country
        type: string
        source: input
        description: ISO-3166 alpha-2 country of citizenship; keys COUNTRY_RISK in export_control_risk_score
        constraints: exactly 2 uppercase letters
      - name: requires_sponsorship
        type: boolean
        source: input
        description: true when the scholar needs institutional visa sponsorship to work
        default: false
      - name: phd_award_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the doctorate was conferred
      - name: prior_external_months_in_rank
        type: integer
        source: input
        description: months already served in postdoctoral rank at other institutions; seeds the total-years-in-rank ledger
        default: 0
        constraints: ">= 0 and <= 60"
      - name: o1_endorsement_on_file
        type: boolean
        source: input
        description: true when an extraordinary-ability endorsement packet is on file; gates O1 eligibility in visa_category_selection
        default: false
      - name: j1_two_year_bar_flag
        type: boolean
        source: input
        description: true when the scholar is subject to the two-year home-residency bar; disqualifies J1_RESEARCH_SCHOLAR in visa_category_selection
        default: false
      - name: restricted_party_flag
        type: boolean
        source: input
        description: true when the scholar appeared on a restricted-party screening list at intake
        default: false
      - name: total_months_in_rank
        type: integer
        source: computed
        description: rank ledger; see calculations.months_in_rank_ledger
      - name: status
        type: enum
        source: system
        description: lifecycle of the person record
        default: PROSPECTIVE
        constraints: one of {PROSPECTIVE, ACTIVE, SEPARATED}

  - name: FacultyMentor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: mentor's legal name
      - name: department
        type: string
        source: input
        description: academic department that owns the mentor appointment
      - name: mentor_training_valid_through
        type: string
        source: input
        description: ISO 8601 date through which mandatory mentor training remains current
      - name: max_concurrent_postdocs
        type: integer
        source: input
        description: institutional cap on simultaneously ACTIVE appointments this mentor may hold
        default: 3
        constraints: ">= 1 and <= 12"
      - name: active_postdoc_count
        type: integer
        source: computed
        description: count of Appointment rows with mentor_id == this mentor and appointment_status == ACTIVE
        default: 0

  - name: FundingSource
    parent: null
    common_fields: true
    fields:
      - name: sponsor_name
        type: string
        source: input
        description: awarding sponsor or fellowship program name
      - name: funding_type
        type: enum
        source: input
        description: award family; keys FUNDING_RISK in export_control_risk_score and the employment-class pairing rule
        constraints: one of {FEDERAL_GRANT, FOUNDATION_GRANT, EXTERNAL_FELLOWSHIP, INSTITUTIONAL_FELLOWSHIP}
      - name: salary_floor_policy
        type: enum
        source: input
        description: which floor table salary_floor_computation reads
        constraints: one of {NIH_SCALE, INSTITUTIONAL_MIN}
      - name: award_start_date
        type: string
        source: input
        description: ISO 8601 first day the award may be charged
      - name: award_end_date
        type: string
        source: input
        description: ISO 8601 last day the award may be charged; truncates the encumbrance overlap window
      - name: annual_budget_usd
        type: number
        source: input
        description: salary-and-fringe budget authority for the award year
        constraints: "> 0, 2 decimal places"
      - name: requires_mentoring_plan
        type: boolean
        source: input
        description: funder mandates a MENTORING_PLAN development document
        default: false
      - name: requires_idp
        type: boolean
        source: input
        description: funder mandates an IDP development document
        default: false
      - name: verification_status
        type: enum
        source: system
        description: funding verification posture set by HRCompensationApprover
        default: UNVERIFIED
        constraints: one of {UNVERIFIED, VERIFIED, SUSPENDED}
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent VERIFY decision; null until then
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the HRCompensationApprover who last verified; null until then
      - name: encumbered_usd
        type: number
        source: computed
        description: sum of encumbrance_usd over held appointments; see calculations.funding_encumbrance
        default: 0
      - name: available_balance_usd
        type: number
        source: computed
        description: round(annual_budget_usd - encumbered_usd, 2)

  - name: Laboratory
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: laboratory space identifier
      - name: biosafety_level
        type: enum
        source: input
        description: containment level of the space; RESTRICTED compliance posture permits BSL1 only
        constraints: one of {BSL1, BSL2, BSL3}
      - name: bench_capacity
        type: integer
        source: input
        description: total bench seats simultaneously occupiable
        constraints: ">= 1 and <= 40"
      - name: decontamination_buffer_days
        type: integer
        source: input
        description: leading-edge buffer applied to every access interval in lab_bench_occupancy
        default: 0
        constraints: ">= 0 and <= 30"
      - name: status
        type: enum
        source: input
        description: whether the space accepts new access grants
        default: OPEN
        constraints: one of {OPEN, CLOSED}

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - name: postdoc_id
        type: string
        source: input
        description: FK -> Postdoc.id; the scholar being appointed
      - name: mentor_id
        type: string
        source: input
        description: FK -> FacultyMentor.id; the supervising mentor of record
      - name: funding_source_id
        type: string
        source: input
        description: FK -> FundingSource.id; award that carries salary and fringe
      - name: predecessor_appointment_id
        type: string
        source: input
        description: FK -> Appointment.id; prior term this appointment continues, or null for a first term
        default: null
      - name: title_classification
        type: enum
        source: input
        description: payroll title; POSTDOC_SCHOLAR_EMPLOYEE carries TITLE_UPLIFT_USD in salary_floor_computation
        constraints: one of {POSTDOC_FELLOW, POSTDOC_SCHOLAR_EMPLOYEE, POSTDOC_ASSOCIATE}
      - name: employment_class
        type: enum
        source: input
        description: employee versus fellowship classification; drives benefits_package and the fringe override
        constraints: one of {EMPLOYEE, FELLOWSHIP}
      - name: term_start_date
        type: string
        source: input
        description: ISO 8601 first day of the term; may be deferred by the visa-approval cascade
      - name: term_end_date
        type: string
        source: input
        description: ISO 8601 last day of the term; may be extended by an untimely non-renewal notice
      - name: annual_salary_usd
        type: number
        source: input
        description: twelve-month salary or stipend rate offered
        constraints: "> 0, 2 decimal places"
      - name: appointment_status
        type: enum
        source: system
        description: offer/employment dimension of the parallel state machine
        default: DRAFT
        constraints: one of {DRAFT, OFFER_ISSUED, OFFER_ACCEPTED, ACTIVE, COMPLETED, WITHDRAWN, NON_RENEWED, TERMINATED}
      - name: compliance_status
        type: enum
        source: system
        description: research-security dimension of the parallel state machine; evolves independently of appointment_status
        default: PENDING_REVIEW
        constraints: one of {PENDING_REVIEW, CLEARED, RESTRICTED, BLOCKED}
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the PostdocAffairsOfficer who created the row; anchor of every segregation-of-duties check
      - name: term_months
        type: integer
        source: computed
        description: calendar term length; see calculations.months_in_rank_ledger
      - name: months_in_rank_at_start
        type: integer
        source: computed
        description: rank months already served when this term begins; see calculations.months_in_rank_ledger
      - name: cumulative_months_in_rank_at_end
        type: integer
        source: computed
        description: months_in_rank_at_start + term_months; checked against TOTAL_MONTHS_IN_RANK_CAP
      - name: salary_floor_usd
        type: number
        source: computed
        description: policy floor; see calculations.salary_floor_computation
      - name: salary_exception_floor_usd
        type: number
        source: system
        description: approved substitute floor written by the salary-exception endpoint; null until approved
        default: null
      - name: salary_exception_approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the HRCompensationApprover who granted the exception; null until approved
        default: null
      - name: benefits_package
        type: enum
        source: computed
        description: eligibility bucket; see calculations.benefits_eligibility
        constraints: one of {EMPLOYEE_FULL, EMPLOYEE_LIMITED, FELLOWSHIP_STIPEND_ONLY, FELLOWSHIP_INSTITUTIONAL, NONE}
      - name: fringe_rate
        type: number
        source: computed
        description: fringe rate selected in calculations.funding_encumbrance step 2
      - name: encumbrance_usd
        type: number
        source: computed
        description: salary + fringe charged against the award; see calculations.funding_encumbrance
        default: 0
      - name: withdraw_reason
        type: enum
        source: system
        description: why the offer stopped; null unless appointment_status == WITHDRAWN
        default: null
        constraints: one of {VISA_DENIED, VISA_DELAY_TERM_TOO_SHORT, CANDIDATE_DECLINED, FUNDING_LOST}
      - name: reinstated_count
        type: integer
        source: system
        description: number of times a sustained grievance has returned this appointment from NON_RENEWED to ACTIVE
        default: 0

  - name: VisaCase
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: FK -> Appointment.id; the sponsored appointment
      - name: visa_category
        type: enum
        source: computed
        description: server-selected category; see calculations.visa_category_selection
        constraints: one of {TN, J1_RESEARCH_SCHOLAR, H1B, O1}
      - name: processing_track
        type: enum
        source: input
        description: sponsorship processing track chosen at offer acceptance
        constraints: one of {STANDARD, PREMIUM}
      - name: status
        type: enum
        source: system
        description: sponsorship pipeline state; SUBMITTED is re-enterable through the RFE loop
        default: DOCS_PENDING
        constraints: one of {DOCS_PENDING, SUBMITTED, RFE_RECEIVED, APPROVED, DENIED, VOIDED}
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent petition submission; null while DOCS_PENDING
      - name: rfe_round_count
        type: integer
        source: system
        description: number of RFE responses filed; capped by RFE_ROUND_LIMIT
        default: 0
      - name: projection_variant
        type: enum
        source: system
        description: which variant of visa_processing_timeline produced projected_decision_date
        default: null
        constraints: one of {INITIAL_FILING, POST_RFE_REFILING}
      - name: projected_decision_date
        type: string
        source: computed
        description: ISO 8601 projected adjudication date; see calculations.visa_processing_timeline
      - name: earliest_lawful_start_date
        type: string
        source: computed
        description: ISO 8601 earliest lawful employment start; gates appointment activation and can defer term_start_date
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the APPROVED or DENIED adjudication; null until then

  - name: DevelopmentDocument
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: FK -> Appointment.id; the appointment the document belongs to
      - name: doc_type
        type: enum
        source: system
        description: which funder mandate this row satisfies; both rows are synthesized by the issue-offer cascade
        constraints: one of {MENTORING_PLAN, IDP}
      - name: status
        type: enum
        source: system
        description: review pipeline with a revision loop back to SUBMITTED
        default: DRAFT
        constraints: one of {DRAFT, SUBMITTED, RETURNED_FOR_REVISION, APPROVED, VOIDED}
      - name: content_summary
        type: string
        source: input
        description: mentor-authored summary of the plan submitted for review
      - name: postdoc_acknowledged
        type: boolean
        source: input
        description: true when the scholar co-signed the document; required before an IDP may be APPROVED
        default: false
      - name: revision_round
        type: integer
        source: system
        description: number of times the document has been returned for revision; capped by REVISION_ROUND_LIMIT
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the FacultyMentor who last submitted; null while DRAFT
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock instant of approval; null until APPROVED

  - name: ExportControlReview
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: FK -> Appointment.id; the appointment under research-security review
      - name: cycle_index
        type: integer
        source: system
        description: 1 for the review synthesized at offer issuance, 2+ for re-screens synthesized at reappointment renewal
        default: 1
      - name: status
        type: enum
        source: system
        description: screening outcome; drives the Appointment.compliance_status dimension
        default: QUEUED
        constraints: one of {QUEUED, CLEARED, CLEARED_WITH_CONDITIONS, DENIED, VOIDED}
      - name: restricted_party_hit
        type: boolean
        source: input
        description: reviewer-attested restricted-party screening result
        default: false
      - name: controlled_technology_flag
        type: boolean
        source: input
        description: reviewer-attested presence of export-controlled technology in the research plan
        default: false
      - name: screening_tier
        type: enum
        source: computed
        description: which variant of export_control_risk_score applies
        default: null
        constraints: one of {TIER_1_STANDARD, TIER_2_ENHANCED}
      - name: risk_score
        type: number
        source: computed
        description: one-decimal research-security score; see calculations.export_control_risk_score
        default: null
      - name: deemed_export_license_required
        type: boolean
        source: computed
        description: controlled_technology_flag AND COUNTRY_RISK[postdoc.citizenship_country] >= 3.0
        default: false
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the ExportControlReviewer who decided; null while QUEUED
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the decision; null while QUEUED

  - name: LabAccessGrant
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: FK -> Appointment.id; appointment whose compliance posture authorizes the access
      - name: laboratory_id
        type: string
        source: input
        description: FK -> Laboratory.id; space whose bench seats are occupied
      - name: bench_seats
        type: integer
        source: input
        description: seats occupied by this grant for every day of its effective occupancy interval
        constraints: ">= 1 and <= 10"
      - name: access_start_date
        type: string
        source: input
        description: ISO 8601 first day of physical access
      - name: access_end_date
        type: string
        source: input
        description: ISO 8601 last day of physical access
      - name: status
        type: enum
        source: system
        description: provisioning state; SUSPENDED and REVOKED are reached only by cascade
        default: PROVISIONED
        constraints: one of {PROVISIONED, SUSPENDED, REVOKED}
      - name: suspension_reason
        type: enum
        source: system
        description: why the grant left PROVISIONED
        default: NONE
        constraints: one of {NONE, COMPLIANCE_REGRESSION, EXIT_PROCESSING}
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the FacultyMentor who requested the grant

  - name: ReappointmentReview
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: FK -> Appointment.id; the term under review
      - name: review_cycle
        type: integer
        source: system
        description: 1-based ordinal of this review among the appointment's reviews
        default: 1
      - name: status
        type: enum
        source: system
        description: branching fork-join review pipeline
        default: OPENED
        constraints: one of {OPENED, RECOMMENDED_RENEW, RECOMMENDED_NON_RENEW, FINALIZED_RENEWED, FINALIZED_NON_RENEWED}
      - name: mentor_recommendation_note
        type: string
        source: input
        description: mentor's written recommendation captured at the recommendation step
      - name: recommended_by_user_id
        type: string
        source: system
        description: X-User-ID of the FacultyMentor who recommended; null while OPENED
      - name: finalized_by_user_id
        type: string
        source: system
        description: X-User-ID of the PostdocAffairsOfficer who finalized; anchor of the grievance segregation-of-duties check
      - name: service_months_at_review
        type: integer
        source: computed
        description: rank months served as of the finalization instant; see calculations.non_renewal_notice_policy
      - name: notice_days_required
        type: integer
        source: computed
        description: notice entitlement in days; see calculations.non_renewal_notice_policy
        default: null
      - name: notice_deadline_date
        type: string
        source: computed
        description: term_end_date minus notice_days_required, as an ISO 8601 date
        default: null
      - name: notice_issued_at
        type: datetime
        source: system
        description: logical-clock instant the non-renewal notice was issued; nulled again if a grievance is sustained
        default: null
      - name: notice_timely
        type: boolean
        source: computed
        description: notice_issued_at date <= notice_deadline_date
        default: null
      - name: term_extension_days
        type: integer
        source: computed
        description: days the term was extended to cure an untimely notice
        default: 0
      - name: pre_notice_term_end_date
        type: string
        source: system
        description: appointment.term_end_date captured immediately before any notice extension; restored on reinstatement
        default: null
      - name: grievance_window_end
        type: datetime
        source: computed
        description: notice_issued_at plus GRIEVANCE_WINDOW_DAYS, clamped to 23:59:59.999Z of that date
        default: null

  - name: Grievance
    parent: null
    common_fields: true
    fields:
      - name: reappointment_review_id
        type: string
        source: input
        description: FK -> ReappointmentReview.id; the non-renewal decision being contested
      - name: category
        type: enum
        source: input
        description: grievance channel selected by the scholar
        constraints: one of {PROCEDURAL, NOTICE_UNTIMELY, RETALIATION}
      - name: narrative
        type: string
        source: input
        description: scholar's written statement
      - name: status
        type: enum
        source: system
        description: adjudication state
        default: FILED
        constraints: one of {FILED, RESOLVED_DENIED, RESOLVED_SUSTAINED}
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant of filing; compared against grievance_window_end
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the filing Postdoc
      - name: resolution_note
        type: string
        source: input
        description: officer's written resolution rationale
        default: null
      - name: resolved_by_user_id
        type: string
        source: system
        description: X-User-ID of the resolving PostdocAffairsOfficer; must differ from the review's finalized_by_user_id
        default: null

  - name: ExitRecord
    parent: null
    common_fields: true
    fields:
      - name: appointment_id
        type: string
        source: input
        description: FK -> Appointment.id; the appointment being closed out
      - name: exit_reason
        type: enum
        source: input
        description: why the appointment is ending
        constraints: one of {TERM_COMPLETION, NON_RENEWAL, RESIGNATION, COMPLIANCE_TERMINATION}
      - name: status
        type: enum
        source: system
        description: exit checklist state; CLOSED is reached only by the auto-close rule
        default: INITIATED
        constraints: one of {INITIATED, IP_ASSIGNMENT_SIGNED, CLOSED}
      - name: initiated_at
        type: datetime
        source: system
        description: logical-clock instant the exit was initiated
      - name: ip_disclosure_count
        type: integer
        source: input
        description: number of invention disclosures assigned to the institution at signature
        default: 0
      - name: ip_assignment_signed_at
        type: datetime
        source: system
        description: logical-clock instant the scholar signed the IP assignment; null until signed
        default: null
      - name: lab_access_cleared
        type: boolean
        source: computed
        description: true when no LabAccessGrant for this appointment_id remains in status PROVISIONED
        default: false
      - name: final_months_posted
        type: integer
        source: system
        description: rank months posted to Postdoc.total_months_in_rank when this exit closed
        default: 0

# =============================================================================
# 1.2 State Machine Table
#
# Cascade chains referenced by side_effects (each link caused by the previous):
#   CH-A  ip-assignment  : ExitRecord CLOSED -> Appointment COMPLETED ->
#                          rank/mentor/funding ledgers -> Postdoc SEPARATED      (depth 4)
#   CH-B  visa APPROVED  : lawful-start recompute -> term_start deferral ->
#                          term/benefit/encumbrance recompute -> funding ledger ->
#                          short-term auto-withdraw                              (depth 5)
#   CH-C  grievance SUSTAINED : review un-non-renews -> appointment reinstated ->
#                          rank ledger reversal + term restore -> funding ledger  (depth 4)
#   CH-D  finalize RENEW : re-screen created -> compliance PENDING_REVIEW ->
#                          lab grants SUSPENDED                                   (depth 3)
#   CH-E  export DENIED  : compliance BLOCKED -> appointment TERMINATED ->
#                          exit record created + lab grants REVOKED               (depth 4)
# =============================================================================

state_machines:

  - entity: Appointment
    dimension: appointment_status
    note: |
      Dimension 1 of 2 on the same row. appointment_status and compliance_status
      advance independently: an appointment may reach OFFER_ACCEPTED while
      compliance_status is still PENDING_REVIEW, and compliance_status may
      regress to PENDING_REVIEW or BLOCKED while appointment_status stays ACTIVE.
      NON_RENEWED -> ACTIVE closes a cycle in this dimension.
    initial_state: DRAFT
    terminal_states: [COMPLETED, WITHDRAWN, TERMINATED]
    transitions:
      - from: DRAFT
        to: OFFER_ISSUED
        trigger: "POST /appointments/{id}/issue-offer"
        actor: PostdocAffairsOfficer
        preconditions:
          - "appointment_status == DRAFT"
          - "FundingSource.verification_status == VERIFIED"
          - "annual_salary_usd >= (salary_exception_floor_usd if not null else salary_floor_usd)"
          - "FundingSource.available_balance_usd >= this appointment's encumbrance_usd"
          - "overlap of [term_start_date, term_end_date] with [award_start_date, award_end_date] is at least 1 day"
        side_effects:
          - "recompute salary_floor_usd, term_months, months_in_rank_at_start, cumulative_months_in_rank_at_end, benefits_package, fringe_rate, encumbrance_usd"
          - "FundingSource.encumbered_usd += encumbrance_usd; FundingSource.available_balance_usd = round(annual_budget_usd - encumbered_usd, 2)"
          - "create ExportControlReview{appointment_id, cycle_index: 1, status: QUEUED}"
          - "create DevelopmentDocument{doc_type: MENTORING_PLAN, status: DRAFT} when FundingSource.requires_mentoring_plan == true"
          - "create DevelopmentDocument{doc_type: IDP, status: DRAFT} when FundingSource.requires_idp == true"
          - "increments Appointment.version by 1"
      - from: OFFER_ISSUED
        to: OFFER_ACCEPTED
        trigger: "POST /appointments/{id}/accept-offer"
        actor: Postdoc
        preconditions:
          - "appointment_status == OFFER_ISSUED"
          - "X-User-ID == postdoc_id"
          - "when Postdoc.requires_sponsorship == true, visa_category_selection yields a non-empty candidate set"
          - "when Postdoc.requires_sponsorship == true and processing_track == PREMIUM, the selected category is in PREMIUM_ELIGIBLE_CATEGORIES"
        side_effects:
          - "create VisaCase{appointment_id, visa_category: selected, processing_track, status: DOCS_PENDING} when Postdoc.requires_sponsorship == true"
          - "increments Appointment.version by 1"
        note: "No VisaCase row is created for a scholar with requires_sponsorship == false."
      - from: OFFER_ACCEPTED
        to: ACTIVE
        trigger: "POST /appointments/{id}/activate"
        actor: PostdocAffairsOfficer
        preconditions:
          - "appointment_status == OFFER_ACCEPTED"
          - "compliance_status IN {CLEARED, RESTRICTED}"
          - "when Postdoc.requires_sponsorship == true: the appointment's VisaCase.status == APPROVED"
          - "when Postdoc.requires_sponsorship == true: term_start_date >= VisaCase.earliest_lawful_start_date"
          - "every DevelopmentDocument for this appointment_id has status == APPROVED"
          - "FacultyMentor.mentor_training_valid_through >= term_start_date"
          - "FacultyMentor.active_postdoc_count < FacultyMentor.max_concurrent_postdocs"
        side_effects:
          - "Postdoc.status: PROSPECTIVE -> ACTIVE"
          - "FacultyMentor.active_postdoc_count += 1"
          - "increments Appointment.version by 1"
      - from: OFFER_ACCEPTED
        to: WITHDRAWN
        trigger: "system event: CH-B link 5 — recomputed term_months < MIN_TERM_MONTHS after the visa-approval term_start deferral"
        actor: system
        preconditions:
          - "the deferral in CH-B link 2 has already been applied"
          - "term_months (recomputed in CH-B link 3) < MIN_TERM_MONTHS"
        side_effects:
          - "withdraw_reason := VISA_DELAY_TERM_TOO_SHORT"
          - "FundingSource.encumbered_usd -= encumbrance_usd; encumbrance_usd := 0.00; available_balance_usd recomputed"
          - "every DevelopmentDocument for this appointment_id with status IN {DRAFT, SUBMITTED, RETURNED_FOR_REVISION} -> VOIDED"
          - "every ExportControlReview for this appointment_id with status == QUEUED -> VOIDED"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /appointments/{id}/withdraw"
        actor: PostdocAffairsOfficer
        preconditions: ["appointment_status == DRAFT"]
        side_effects:
          - "withdraw_reason := request reason"
          - "increments Appointment.version by 1"
      - from: OFFER_ISSUED
        to: WITHDRAWN
        trigger: "POST /appointments/{id}/withdraw"
        actor: PostdocAffairsOfficer
        preconditions: ["appointment_status == OFFER_ISSUED"]
        side_effects:
          - "withdraw_reason := request reason"
          - "FundingSource.encumbered_usd -= encumbrance_usd; encumbrance_usd := 0.00; FundingSource.available_balance_usd recomputed (compensating action of the issue-offer encumbrance)"
          - "every DevelopmentDocument for this appointment_id with status IN {DRAFT, SUBMITTED, RETURNED_FOR_REVISION} -> VOIDED"
          - "every ExportControlReview for this appointment_id with status == QUEUED -> VOIDED"
          - "increments Appointment.version by 1"
      - from: OFFER_ACCEPTED
        to: WITHDRAWN
        trigger: "POST /appointments/{id}/withdraw"
        actor: PostdocAffairsOfficer
        preconditions: ["appointment_status == OFFER_ACCEPTED"]
        side_effects:
          - "withdraw_reason := request reason"
          - "FundingSource.encumbered_usd -= encumbrance_usd; encumbrance_usd := 0.00; FundingSource.available_balance_usd recomputed"
          - "the appointment's VisaCase with status IN {DOCS_PENDING, SUBMITTED, RFE_RECEIVED} -> VOIDED"
          - "every DevelopmentDocument for this appointment_id with status IN {DRAFT, SUBMITTED, RETURNED_FOR_REVISION} -> VOIDED"
          - "every ExportControlReview for this appointment_id with status == QUEUED -> VOIDED"
          - "increments Appointment.version by 1"
      - from: OFFER_ACCEPTED
        to: WITHDRAWN
        trigger: "system event: CH-B variant — VisaCase adjudicated DENIED (link 2 of the denial chain)"
        actor: system
        preconditions: ["appointment_status == OFFER_ACCEPTED", "the appointment's VisaCase.status became DENIED"]
        side_effects:
          - "withdraw_reason := VISA_DENIED"
          - "FundingSource.encumbered_usd -= encumbrance_usd; encumbrance_usd := 0.00; FundingSource.available_balance_usd recomputed"
          - "every DevelopmentDocument for this appointment_id with status IN {DRAFT, SUBMITTED, RETURNED_FOR_REVISION} -> VOIDED"
          - "every ExportControlReview for this appointment_id with status == QUEUED -> VOIDED"
      - from: ACTIVE
        to: NON_RENEWED
        trigger: "system event: CH-C precursor — POST /reappointment-reviews/{id}/finalize with decision NON_RENEW"
        actor: system
        preconditions: ["appointment_status == ACTIVE", "the review being finalized has status == RECOMMENDED_NON_RENEW"]
        side_effects:
          - "when the notice is untimely: term_end_date := notice_issued_at date + notice_days_required; then recompute term_months, cumulative_months_in_rank_at_end, benefits_package, fringe_rate, encumbrance_usd; then FundingSource.encumbered_usd and available_balance_usd recomputed"
          - "Postdoc.total_months_in_rank += term_months (value after any extension recompute)"
      - from: NON_RENEWED
        to: ACTIVE
        trigger: "system event: CH-C link 3 — a Grievance on the finalizing review resolved RESOLVED_SUSTAINED"
        actor: system
        preconditions: ["appointment_status == NON_RENEWED", "the grievance's ReappointmentReview.status became FINALIZED_RENEWED"]
        side_effects:
          - "step 1: Postdoc.total_months_in_rank -= term_months (the exact value posted at NON_RENEWED)"
          - "step 2: term_end_date := ReappointmentReview.pre_notice_term_end_date; ReappointmentReview.term_extension_days := 0"
          - "step 3: recompute term_months, cumulative_months_in_rank_at_end, benefits_package, fringe_rate, encumbrance_usd; then FundingSource.encumbered_usd and available_balance_usd recomputed"
          - "reinstated_count += 1"
        note: "Step order is normative: the rank reversal uses the pre-restore term_months, so the ledger returns to its exact pre-notice value."
      - from: ACTIVE
        to: COMPLETED
        trigger: "system event: CH-A link 2 — the appointment's ExitRecord reached CLOSED"
        actor: system
        preconditions: ["appointment_status == ACTIVE", "the appointment's ExitRecord.status became CLOSED"]
        side_effects:
          - "Postdoc.total_months_in_rank += term_months; ExitRecord.final_months_posted := term_months"
          - "FacultyMentor.active_postdoc_count -= 1"
          - "FundingSource.encumbered_usd -= encumbrance_usd; encumbrance_usd := 0.00; FundingSource.available_balance_usd recomputed"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system event: CH-E link 3 — compliance_status became BLOCKED while appointment_status == ACTIVE"
        actor: system
        preconditions: ["appointment_status == ACTIVE", "compliance_status became BLOCKED"]
        side_effects:
          - "Postdoc.total_months_in_rank += term_months"
          - "FacultyMentor.active_postdoc_count -= 1"
          - "FundingSource.encumbered_usd -= encumbrance_usd; encumbrance_usd := 0.00; FundingSource.available_balance_usd recomputed"
          - "create ExitRecord{appointment_id, exit_reason: COMPLIANCE_TERMINATION, status: INITIATED} when no ExitRecord exists for this appointment_id"
          - "every LabAccessGrant for this appointment_id with status IN {PROVISIONED, SUSPENDED} -> REVOKED with suspension_reason EXIT_PROCESSING"

  - entity: Appointment
    dimension: compliance_status
    note: "Dimension 2 of 2 on the same row; driven exclusively by ExportControlReview outcomes."
    initial_state: PENDING_REVIEW
    terminal_states: []
    transitions:
      - from: PENDING_REVIEW
        to: CLEARED
        trigger: "system event: an ExportControlReview for this appointment reached CLEARED"
        actor: system
        preconditions: ["the appointment has no ExportControlReview in status QUEUED"]
        side_effects: ["lab access requests become admissible for any Laboratory.biosafety_level"]
      - from: PENDING_REVIEW
        to: RESTRICTED
        trigger: "system event: an ExportControlReview for this appointment reached CLEARED_WITH_CONDITIONS"
        actor: system
        preconditions: ["the appointment has no ExportControlReview in status QUEUED"]
        side_effects: ["lab access requests become admissible only for Laboratory.biosafety_level == BSL1 with bench_seats <= RESTRICTED_MAX_BENCH_SEATS"]
      - from: PENDING_REVIEW
        to: BLOCKED
        trigger: "system event: an ExportControlReview for this appointment reached DENIED"
        actor: system
        preconditions: ["the appointment has no ExportControlReview in status QUEUED"]
        side_effects:
          - "CH-E link 3: when appointment_status == ACTIVE the appointment_status dimension advances ACTIVE -> TERMINATED"
          - "every LabAccessGrant for this appointment_id with status == PROVISIONED -> SUSPENDED with suspension_reason COMPLIANCE_REGRESSION"
      - from: CLEARED
        to: PENDING_REVIEW
        trigger: "system event: CH-D link 2 — a re-screen ExportControlReview (cycle_index >= 2) was created in status QUEUED"
        actor: system
        preconditions: ["a new ExportControlReview with status == QUEUED exists for this appointment_id"]
        side_effects: ["CH-D link 3: every LabAccessGrant for this appointment_id with status == PROVISIONED -> SUSPENDED with suspension_reason COMPLIANCE_REGRESSION"]
      - from: RESTRICTED
        to: PENDING_REVIEW
        trigger: "system event: CH-D link 2 — a re-screen ExportControlReview (cycle_index >= 2) was created in status QUEUED"
        actor: system
        preconditions: ["a new ExportControlReview with status == QUEUED exists for this appointment_id"]
        side_effects: ["CH-D link 3: every LabAccessGrant for this appointment_id with status == PROVISIONED -> SUSPENDED with suspension_reason COMPLIANCE_REGRESSION"]
      - from: PENDING_REVIEW
        to: CLEARED
        trigger: "system event: a re-screen ExportControlReview reached CLEARED"
        actor: system
        preconditions: ["the appointment has no ExportControlReview in status QUEUED"]
        side_effects: ["every LabAccessGrant for this appointment_id with status == SUSPENDED and suspension_reason == COMPLIANCE_REGRESSION -> PROVISIONED with suspension_reason NONE"]

  - entity: VisaCase
    note: "Cyclic: SUBMITTED -> RFE_RECEIVED -> SUBMITTED, bounded by RFE_ROUND_LIMIT."
    initial_state: DOCS_PENDING
    terminal_states: [APPROVED, DENIED, VOIDED]
    transitions:
      - from: DOCS_PENDING
        to: SUBMITTED
        trigger: "POST /visa-cases/{id}/submit-petition"
        actor: InternationalScholarAdvisor
        preconditions:
          - "status == DOCS_PENDING"
          - "the appointment's appointment_status == OFFER_ACCEPTED"
        side_effects:
          - "filed_at := logical clock now"
          - "projection_variant := INITIAL_FILING"
          - "recompute projected_decision_date and earliest_lawful_start_date via calculations.visa_processing_timeline variant initial_filing"
      - from: SUBMITTED
        to: RFE_RECEIVED
        trigger: "POST /visa-cases/{id}/adjudication with outcome RFE"
        actor: InternationalScholarAdvisor
        preconditions:
          - "status == SUBMITTED"
          - "rfe_round_count < RFE_ROUND_LIMIT"
        side_effects: ["projected_decision_date and earliest_lawful_start_date are left unchanged until the response is filed"]
      - from: RFE_RECEIVED
        to: SUBMITTED
        trigger: "POST /visa-cases/{id}/submit-petition"
        actor: InternationalScholarAdvisor
        preconditions:
          - "status == RFE_RECEIVED"
          - "rfe_round_count < RFE_ROUND_LIMIT"
        side_effects:
          - "rfe_round_count += 1"
          - "filed_at := logical clock now"
          - "projection_variant := POST_RFE_REFILING"
          - "recompute projected_decision_date and earliest_lawful_start_date via calculations.visa_processing_timeline variant post_rfe_refiling (previously elapsed processing time is discarded, not credited)"
        note: "This closes the cycle: the same endpoint re-enters SUBMITTED from a different from-state with a different projection variant."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /visa-cases/{id}/adjudication with outcome APPROVED"
        actor: InternationalScholarAdvisor
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "decided_at := logical clock now"
          - "CH-B link 1: earliest_lawful_start_date := decided_at date + VISA_ACTIVATION_LEAD_DAYS (the actual decision replaces the projection)"
          - "CH-B link 2: when earliest_lawful_start_date > Appointment.term_start_date, Appointment.term_start_date := earliest_lawful_start_date"
          - "CH-B link 3: because term_start_date moved, recompute Appointment.term_months, cumulative_months_in_rank_at_end, benefits_package, fringe_rate, encumbrance_usd"
          - "CH-B link 4: because encumbrance_usd changed, FundingSource.encumbered_usd and available_balance_usd are recomputed"
          - "CH-B link 5: because the recomputed term_months < MIN_TERM_MONTHS, the appointment_status dimension advances OFFER_ACCEPTED -> WITHDRAWN with withdraw_reason VISA_DELAY_TERM_TOO_SHORT"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /visa-cases/{id}/adjudication with outcome DENIED"
        actor: InternationalScholarAdvisor
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "decided_at := logical clock now"
          - "the appointment_status dimension advances OFFER_ACCEPTED -> WITHDRAWN with withdraw_reason VISA_DENIED"
      - from: DOCS_PENDING
        to: VOIDED
        trigger: "system event: the appointment was withdrawn"
        actor: system
        preconditions: ["status == DOCS_PENDING"]
        side_effects: []
      - from: SUBMITTED
        to: VOIDED
        trigger: "system event: the appointment was withdrawn"
        actor: system
        preconditions: ["status == SUBMITTED"]
        side_effects: []
      - from: RFE_RECEIVED
        to: VOIDED
        trigger: "system event: the appointment was withdrawn"
        actor: system
        preconditions: ["status == RFE_RECEIVED"]
        side_effects: []

  - entity: DevelopmentDocument
    note: "Cyclic: SUBMITTED -> RETURNED_FOR_REVISION -> SUBMITTED, bounded by REVISION_ROUND_LIMIT."
    initial_state: DRAFT
    terminal_states: [APPROVED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /development-documents/{id}/submit"
        actor: FacultyMentor
        preconditions:
          - "status == DRAFT"
          - "X-User-ID == the appointment's mentor_id"
          - "the appointment's appointment_status IN {OFFER_ISSUED, OFFER_ACCEPTED, ACTIVE}"
        side_effects:
          - "content_summary and postdoc_acknowledged := request values"
          - "submitted_by_user_id := X-User-ID"
      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /development-documents/{id}/submit"
        actor: FacultyMentor
        preconditions:
          - "status == RETURNED_FOR_REVISION"
          - "X-User-ID == the appointment's mentor_id"
          - "revision_round < REVISION_ROUND_LIMIT"
        side_effects:
          - "content_summary and postdoc_acknowledged := request values"
          - "submitted_by_user_id := X-User-ID"
        note: "Closes the revision cycle through the same endpoint as the first submission."
      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /development-documents/{id}/review with decision RETURN"
        actor: PostdocAffairsOfficer
        preconditions:
          - "status == SUBMITTED"
          - "revision_round < REVISION_ROUND_LIMIT"
        side_effects: ["revision_round += 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /development-documents/{id}/review with decision APPROVE"
        actor: PostdocAffairsOfficer
        preconditions:
          - "status == SUBMITTED"
          - "when doc_type == IDP: postdoc_acknowledged == true"
        side_effects: ["approved_at := logical clock now"]
      - from: DRAFT
        to: VOIDED
        trigger: "system event: the appointment was withdrawn"
        actor: system
        preconditions: ["status == DRAFT"]
        side_effects: []
      - from: SUBMITTED
        to: VOIDED
        trigger: "system event: the appointment was withdrawn"
        actor: system
        preconditions: ["status == SUBMITTED"]
        side_effects: []
      - from: RETURNED_FOR_REVISION
        to: VOIDED
        trigger: "system event: the appointment was withdrawn"
        actor: system
        preconditions: ["status == RETURNED_FOR_REVISION"]
        side_effects: []

  - entity: ExportControlReview
    note: "Branching: one QUEUED state forks into three outcomes with divergent side-effect sets."
    initial_state: QUEUED
    terminal_states: [CLEARED, CLEARED_WITH_CONDITIONS, DENIED, VOIDED]
    transitions:
      - from: QUEUED
        to: CLEARED
        trigger: "POST /export-control-reviews/{id}/decision — risk_score < CONDITIONS_THRESHOLD and restricted_party_hit == false"
        actor: ExportControlReviewer
        preconditions:
          - "status == QUEUED"
          - "X-User-ID != the appointment's prepared_by_user_id"
          - "X-User-ID != the appointment's mentor_id"
        side_effects:
          - "screening_tier, risk_score, deemed_export_license_required computed per calculations.export_control_risk_score"
          - "reviewer_user_id := X-User-ID; decided_at := logical clock now"
          - "Appointment.compliance_status -> CLEARED"
      - from: QUEUED
        to: CLEARED_WITH_CONDITIONS
        trigger: "POST /export-control-reviews/{id}/decision — CONDITIONS_THRESHOLD <= risk_score < DENIAL_THRESHOLD and restricted_party_hit == false"
        actor: ExportControlReviewer
        preconditions:
          - "status == QUEUED"
          - "X-User-ID != the appointment's prepared_by_user_id"
          - "X-User-ID != the appointment's mentor_id"
        side_effects:
          - "screening_tier, risk_score, deemed_export_license_required computed per calculations.export_control_risk_score"
          - "reviewer_user_id := X-User-ID; decided_at := logical clock now"
          - "Appointment.compliance_status -> RESTRICTED"
      - from: QUEUED
        to: DENIED
        trigger: "POST /export-control-reviews/{id}/decision — restricted_party_hit == true OR risk_score >= DENIAL_THRESHOLD"
        actor: ExportControlReviewer
        preconditions:
          - "status == QUEUED"
          - "X-User-ID != the appointment's prepared_by_user_id"
          - "X-User-ID != the appointment's mentor_id"
        side_effects:
          - "screening_tier, risk_score, deemed_export_license_required computed per calculations.export_control_risk_score"
          - "reviewer_user_id := X-User-ID; decided_at := logical clock now"
          - "CH-E link 2: Appointment.compliance_status -> BLOCKED"
          - "CH-E link 3: because compliance_status became BLOCKED, an ACTIVE appointment advances ACTIVE -> TERMINATED"
          - "CH-E link 4: because the appointment became TERMINATED, an ExitRecord{exit_reason: COMPLIANCE_TERMINATION, status: INITIATED} is created and every LabAccessGrant for the appointment leaves PROVISIONED/SUSPENDED for REVOKED"
      - from: QUEUED
        to: VOIDED
        trigger: "system event: the appointment was withdrawn"
        actor: system
        preconditions: ["status == QUEUED"]
        side_effects: []

  - entity: LabAccessGrant
    note: "Cyclic on the suspension edge: PROVISIONED -> SUSPENDED -> PROVISIONED."
    initial_state: PROVISIONED
    terminal_states: [REVOKED]
    transitions:
      - from: PROVISIONED
        to: SUSPENDED
        trigger: "system event: CH-D link 3 / CH-E — the appointment's compliance_status left {CLEARED, RESTRICTED}"
        actor: system
        preconditions: ["status == PROVISIONED"]
        side_effects: ["suspension_reason := COMPLIANCE_REGRESSION"]
      - from: SUSPENDED
        to: PROVISIONED
        trigger: "system event: a re-screen ExportControlReview reached CLEARED"
        actor: system
        preconditions: ["status == SUSPENDED", "suspension_reason == COMPLIANCE_REGRESSION"]
        side_effects: ["suspension_reason := NONE"]
      - from: PROVISIONED
        to: REVOKED
        trigger: "system event: an ExitRecord for the appointment was created"
        actor: system
        preconditions: ["status == PROVISIONED"]
        side_effects: ["suspension_reason := EXIT_PROCESSING"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "system event: an ExitRecord for the appointment was created"
        actor: system
        preconditions: ["status == SUSPENDED"]
        side_effects: ["suspension_reason := EXIT_PROCESSING"]

  - entity: ReappointmentReview
    note: "Branching fork-join: OPENED forks on the mentor's recommendation, and the two finalization edges carry disjoint side-effect sets."
    initial_state: OPENED
    terminal_states: [FINALIZED_RENEWED, FINALIZED_NON_RENEWED]
    transitions:
      - from: OPENED
        to: RECOMMENDED_RENEW
        trigger: "POST /reappointment-reviews/{id}/recommendation with recommendation RENEW"
        actor: FacultyMentor
        preconditions:
          - "status == OPENED"
          - "X-User-ID == the appointment's mentor_id"
        side_effects: ["recommended_by_user_id := X-User-ID", "mentor_recommendation_note := request value"]
      - from: OPENED
        to: RECOMMENDED_NON_RENEW
        trigger: "POST /reappointment-reviews/{id}/recommendation with recommendation NON_RENEW"
        actor: FacultyMentor
        preconditions:
          - "status == OPENED"
          - "X-User-ID == the appointment's mentor_id"
        side_effects: ["recommended_by_user_id := X-User-ID", "mentor_recommendation_note := request value"]
      - from: RECOMMENDED_RENEW
        to: FINALIZED_RENEWED
        trigger: "POST /reappointment-reviews/{id}/finalize with decision RENEW"
        actor: PostdocAffairsOfficer
        preconditions:
          - "status == RECOMMENDED_RENEW"
          - "the appointment's appointment_status == ACTIVE"
        side_effects:
          - "finalized_by_user_id := X-User-ID; service_months_at_review computed"
          - "CH-D link 1: create ExportControlReview{appointment_id, cycle_index: (max existing cycle_index for the appointment) + 1, status: QUEUED}"
          - "CH-D link 2: because a QUEUED review now exists, Appointment.compliance_status -> PENDING_REVIEW"
          - "CH-D link 3: because compliance_status left {CLEARED, RESTRICTED}, every PROVISIONED LabAccessGrant for the appointment -> SUSPENDED with suspension_reason COMPLIANCE_REGRESSION"
          - "increments Appointment.version by 1"
        note: "The renewal branch touches no notice, term, or ledger field — that asymmetry is the fork-join's divergent side-effect set."
      - from: RECOMMENDED_NON_RENEW
        to: FINALIZED_NON_RENEWED
        trigger: "POST /reappointment-reviews/{id}/finalize with decision NON_RENEW"
        actor: PostdocAffairsOfficer
        preconditions:
          - "status == RECOMMENDED_NON_RENEW"
          - "the appointment's appointment_status == ACTIVE"
          - "when the notice is untimely, the recomputed FundingSource.available_balance_usd after the term extension must be >= 0"
        side_effects:
          - "finalized_by_user_id := X-User-ID; notice_issued_at := logical clock now"
          - "service_months_at_review, notice_days_required, notice_deadline_date, notice_timely, grievance_window_end computed per calculations.non_renewal_notice_policy"
          - "pre_notice_term_end_date := Appointment.term_end_date (captured before any extension)"
          - "when notice_timely == false: term_extension_days computed and Appointment.term_end_date := notice_issued_at date + notice_days_required; then Appointment.term_months / cumulative_months_in_rank_at_end / benefits_package / fringe_rate / encumbrance_usd recomputed; then FundingSource.encumbered_usd and available_balance_usd recomputed"
          - "CH-C precursor: Appointment.appointment_status ACTIVE -> NON_RENEWED, posting term_months to Postdoc.total_months_in_rank"
          - "increments Appointment.version by 1"
      - from: FINALIZED_NON_RENEWED
        to: FINALIZED_RENEWED
        trigger: "system event: CH-C link 2 — a Grievance on this review resolved RESOLVED_SUSTAINED"
        actor: system
        preconditions: ["status == FINALIZED_NON_RENEWED"]
        side_effects:
          - "notice_issued_at := null; notice_timely := null; grievance_window_end := null"
          - "CH-C link 3: Appointment.appointment_status NON_RENEWED -> ACTIVE with the three-step reversal order pinned on that transition"
        note: "This edge makes the review machine non-monotonic: a terminal branch is undone by the grievance channel."

  - entity: Grievance
    initial_state: FILED
    terminal_states: [RESOLVED_DENIED, RESOLVED_SUSTAINED]
    transitions:
      - from: FILED
        to: RESOLVED_DENIED
        trigger: "POST /grievances/{id}/resolution with outcome DENY"
        actor: PostdocAffairsOfficer
        preconditions:
          - "status == FILED"
          - "X-User-ID != the review's finalized_by_user_id"
        side_effects: ["resolved_by_user_id := X-User-ID", "resolution_note := request value"]
      - from: FILED
        to: RESOLVED_SUSTAINED
        trigger: "POST /grievances/{id}/resolution with outcome SUSTAIN"
        actor: PostdocAffairsOfficer
        preconditions:
          - "status == FILED"
          - "X-User-ID != the review's finalized_by_user_id"
          - "the reversal in CH-C link 3 must not drive FundingSource.available_balance_usd below 0"
        side_effects:
          - "resolved_by_user_id := X-User-ID; resolution_note := request value"
          - "CH-C link 2: ReappointmentReview FINALIZED_NON_RENEWED -> FINALIZED_RENEWED"

  - entity: ExitRecord
    note: "Compound: CLOSED is a system auto-transition gated on the computed lab_access_cleared flag."
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: IP_ASSIGNMENT_SIGNED
        trigger: "POST /exit-records/{id}/ip-assignment"
        actor: Postdoc
        preconditions:
          - "status == INITIATED"
          - "X-User-ID == the appointment's postdoc_id"
        side_effects:
          - "ip_assignment_signed_at := logical clock now; ip_disclosure_count := request value"
          - "lab_access_cleared recomputed"
      - from: IP_ASSIGNMENT_SIGNED
        to: CLOSED
        trigger: "system event: CH-A link 1 — auto-close evaluated immediately after the IP assignment is recorded"
        actor: system
        preconditions: ["status == IP_ASSIGNMENT_SIGNED", "lab_access_cleared == true"]
        side_effects:
          - "CH-A link 2: when the appointment_status is ACTIVE it advances ACTIVE -> COMPLETED"
          - "CH-A link 3: because the appointment became COMPLETED, Postdoc.total_months_in_rank += term_months, FacultyMentor.active_postdoc_count -= 1, and FundingSource.encumbered_usd -= encumbrance_usd"
          - "CH-A link 4: because the postdoc now has no appointment in {DRAFT, OFFER_ISSUED, OFFER_ACCEPTED, ACTIVE, NON_RENEWED}, Postdoc.status ACTIVE -> SEPARATED"
        note: "final_months_posted is 0 when the appointment was already terminal (for example TERMINATED by CH-E), so no rank months are posted twice."

  - entity: FundingSource
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /funding-sources/{id}/verification with decision VERIFY"
        actor: HRCompensationApprover
        preconditions:
          - "verification_status == UNVERIFIED"
          - "award_end_date >= logical clock now (date part)"
        side_effects: ["verified_at := logical clock now", "verified_by_user_id := X-User-ID"]
      - from: VERIFIED
        to: SUSPENDED
        trigger: "POST /funding-sources/{id}/verification with decision SUSPEND"
        actor: HRCompensationApprover
        preconditions: ["verification_status == VERIFIED"]
        side_effects: ["no offer may be issued against this award while SUSPENDED; existing encumbrances are untouched"]
      - from: SUSPENDED
        to: VERIFIED
        trigger: "POST /funding-sources/{id}/verification with decision VERIFY"
        actor: HRCompensationApprover
        preconditions:
          - "verification_status == SUSPENDED"
          - "award_end_date >= logical clock now (date part)"
        side_effects: ["verified_at := logical clock now", "verified_by_user_id := X-User-ID"]

  - entity: Postdoc
    initial_state: PROSPECTIVE
    terminal_states: [SEPARATED]
    transitions:
      - from: PROSPECTIVE
        to: ACTIVE
        trigger: "system event: an appointment for this postdoc reached ACTIVE"
        actor: system
        preconditions: ["status == PROSPECTIVE"]
        side_effects: []
      - from: ACTIVE
        to: SEPARATED
        trigger: "system event: CH-A link 4 — the postdoc's last non-terminal appointment left {DRAFT, OFFER_ISSUED, OFFER_ACCEPTED, ACTIVE, NON_RENEWED}"
        actor: system
        preconditions: ["status == ACTIVE"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================

concurrency_rules:
  - rule_id: salary-exception-stale-appointment
    parent_entity: Appointment
    write_endpoint: "POST /appointments/{id}/salary-exception"
    occ_field: "expected_appointment_version"
    description: |
      Approving a salary-minimum exception against an Appointment whose version
      has advanced since the approver last read it is rejected. A later
      exception legitimately supersedes an earlier one (a fresh approval with
      the current version succeeds and overwrites salary_exception_floor_usd),
      so the rejection cannot be expressed as a state precondition: it exists
      only to guarantee the approver priced the exception against the salary,
      floor, and funding posture they actually observed.
    error_id: ERR_STALE_APPOINTMENT_VERSION
    http_status: 412

  - rule_id: lab-grant-stale-appointment
    parent_entity: Appointment
    write_endpoint: "POST /lab-access-grants"
    occ_field: "expected_appointment_version"
    description: |
      Creating a LabAccessGrant against an Appointment whose version has
      advanced since the mentor last read it is rejected. Multiple grants
      against the same appointment are legitimate, so a second create carrying
      the current version succeeds; the check exists because the appointment's
      compliance_status may have regressed between the read and the write, and
      the mentor must re-observe the posture that authorizes bench access.
    error_id: ERR_STALE_APPOINTMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================

calculations:

  - name: months_in_rank_ledger
    trigger: "on POST /appointments (create) and on every recompute listed in the Appointment transitions (issue-offer, CH-B link 3, CH-C link 3, non-renewal extension)"
    algorithm: aggregation
    formula: |
      # (1) calendar term length — pinned month arithmetic, no day-count approximation
      term_months(s, e) =
          (e.year * 12 + e.month) - (s.year * 12 + s.month)
          + (1 if e.day >= s.day else 0)

      # (2) predecessor chain walk (self-referential, linked-list order, no sort needed)
      chain = []
      cursor = this.predecessor_appointment_id
      while cursor is not null:
          p = Appointment[cursor]
          chain.append(p)   # finite: predecessor_appointment_id is set only at
                            # creation and must reference an already-existing
                            # appointment, so the chain cannot contain a cycle

          cursor = p.predecessor_appointment_id

      months_in_rank_at_start =
          Postdoc.prior_external_months_in_rank
          + SUM(term_months(p.term_start_date, p.term_end_date) for p in chain
                where p.appointment_status IN {ACTIVE, COMPLETED, NON_RENEWED, TERMINATED})

      term_months                      = term_months(term_start_date, term_end_date)
      cumulative_months_in_rank_at_end = months_in_rank_at_start + term_months

      # (3) realized rank ledger on the person record (cascade-maintained, see CH-A / CH-C)
      Postdoc.total_months_in_rank ==
          Postdoc.prior_external_months_in_rank
          + SUM(a.term_months for a in Appointment where a.postdoc_id == this.postdoc_id
                and a.appointment_status IN {COMPLETED, NON_RENEWED, TERMINATED})
    input_set: |
      months_in_rank_at_start counts predecessor terms in {ACTIVE, COMPLETED,
      NON_RENEWED, TERMINATED}; DRAFT, OFFER_ISSUED, OFFER_ACCEPTED and
      WITHDRAWN predecessors contribute zero. Postdoc.total_months_in_rank is
      the realized ledger and counts only {COMPLETED, NON_RENEWED, TERMINATED}
      — the two metrics deliberately differ for an in-flight predecessor.
      The chain is walked in linked-list order; no tie-break arises because
      predecessor_appointment_id is single-valued.
    constants:
      TOTAL_MONTHS_IN_RANK_CAP: 60
      MIN_TERM_MONTHS: 12
      MAX_TERM_MONTHS: 36
    precision: "integer months, no rounding"

  - name: salary_floor_computation
    trigger: "on POST /appointments (create) and recomputed on POST /appointments/{id}/issue-offer"
    algorithm: threshold
    formula: |
      # combinatorial mode (a): 4 inputs, tiered band selection, conditional
      # branch on employment_class, additive title uplift, and a hard max floor.
      experience_band = min(months_in_rank_at_start // 12, 4)          # 0..4
      policy_base =
          NIH_SCALE_BY_BAND[experience_band]          if FundingSource.salary_floor_policy == NIH_SCALE
          else INSTITUTIONAL_MIN_BY_BAND[experience_band]
      class_multiplier = 1.00 if employment_class == EMPLOYEE else 0.95
      title_uplift     = TITLE_UPLIFT_USD if title_classification == POSTDOC_SCHOLAR_EMPLOYEE else 0
      raw              = round(policy_base * class_multiplier + title_uplift, 2)
      salary_floor_usd = max(raw, ABSOLUTE_STIPEND_FLOOR_USD)
      # the effective floor enforced at issue-offer:
      effective_floor  = salary_exception_floor_usd if salary_exception_floor_usd is not null
                         else salary_floor_usd
    input_set: "single Appointment row plus its FundingSource.salary_floor_policy; months_in_rank_at_start comes from months_in_rank_ledger and is therefore evaluated first"
    constants:
      NIH_SCALE_BY_BAND: [61008, 61428, 62124, 64536, 67284]
      INSTITUTIONAL_MIN_BY_BAND: [58000, 60000, 62000, 62000, 62000]
      TITLE_UPLIFT_USD: 3000
      ABSOLUTE_STIPEND_FLOOR_USD: 54000.00
    precision: "2 decimal places, round_half_up"

  - name: funding_encumbrance
    trigger: "on POST /appointments/{id}/issue-offer and on every Appointment recompute that changes term_start_date, term_end_date, annual_salary_usd or employment_class (CH-B link 3, CH-C link 3, non-renewal extension); released on WITHDRAWN / COMPLETED / TERMINATED"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 — prorated base over the award-truncated overlap window.
      # Both endpoints are INCLUSIVE, so a one-day overlap counts as 1 day.
      overlap_start = max(term_start_date, FundingSource.award_start_date)
      overlap_end   = min(term_end_date,   FundingSource.award_end_date)
      overlap_days  = (overlap_end - overlap_start).days + 1        # <= 0 means no overlap
      base = round(annual_salary_usd * overlap_days / PRORATION_DAYS_PER_YEAR, 2)

      # STEP 2 — fringe rate. EVALUATION ORDER IS PINNED: the band is keyed on
      # `base` from STEP 1 and NEVER on the total from STEP 4, even though the
      # total is what the band thresholds superficially describe. This resolves
      # the circular-looking dependency total = base + f(total).
      fringe_rate =
          FELLOWSHIP_FRINGE_RATE                     if employment_class == FELLOWSHIP
          else 0.28                                  if base <  FRINGE_BAND_1_CEILING_USD
          else 0.31                                  if base <  FRINGE_BAND_2_CEILING_USD
          else 0.335

      # STEP 3 — ROUNDING ORDER IS PINNED: round the fringe amount to cents
      # BEFORE adding it to the (already rounded) base. Multiplying the
      # unrounded prorated salary by (1 + fringe_rate) and rounding once is a
      # different, forbidden order and can differ by one cent.
      fringe_amount   = round(base * fringe_rate, 2)
      # STEP 4
      encumbrance_usd = round(base + fringe_amount, 2)

      # STEP 5 — award ledger (aggregate over held appointments only)
      FundingSource.encumbered_usd ==
          round(SUM(a.encumbrance_usd for a in Appointment
                    where a.funding_source_id == this.id
                    and a.appointment_status IN {OFFER_ISSUED, OFFER_ACCEPTED, ACTIVE, NON_RENEWED}), 2)
      FundingSource.available_balance_usd = round(annual_budget_usd - encumbered_usd, 2)
    input_set: |
      Held appointments are exactly those with appointment_status IN
      {OFFER_ISSUED, OFFER_ACCEPTED, ACTIVE, NON_RENEWED}; DRAFT, WITHDRAWN,
      COMPLETED and TERMINATED rows contribute 0.00. The sum has no ordering
      sensitivity because every addend is already rounded to cents in STEP 4.
    constants:
      PRORATION_DAYS_PER_YEAR: 365
      FRINGE_BAND_1_CEILING_USD: 40000.00
      FRINGE_BAND_2_CEILING_USD: 65000.00
      FELLOWSHIP_FRINGE_RATE: 0.075
    precision: "2 decimal places, round_half_up, applied per STEP as written"

  - name: benefits_eligibility
    trigger: "on POST /appointments (create) and on every Appointment recompute that changes term_months or employment_class"
    algorithm: constraint_propagation
    formula: |
      benefits_package =
        EMPLOYEE_FULL             if employment_class == EMPLOYEE   and term_months >= BENEFITS_FULL_MIN_MONTHS
        EMPLOYEE_LIMITED          if employment_class == EMPLOYEE   and term_months <  BENEFITS_FULL_MIN_MONTHS
        FELLOWSHIP_STIPEND_ONLY   if employment_class == FELLOWSHIP and FundingSource.funding_type == EXTERNAL_FELLOWSHIP
        FELLOWSHIP_INSTITUTIONAL  if employment_class == FELLOWSHIP and FundingSource.funding_type == INSTITUTIONAL_FELLOWSHIP
        NONE                      otherwise
      # NONE is unreachable while the funding/class pairing validation holds; it
      # is the declared fallback for a FELLOWSHIP class on a grant-type award.
    input_set: "single Appointment row plus its FundingSource.funding_type"
    constants:
      BENEFITS_FULL_MIN_MONTHS: 12
    precision: "enum, no rounding"

  - name: visa_category_selection
    trigger: "on POST /appointments/{id}/accept-offer when Postdoc.requires_sponsorship == true"
    algorithm: topological
    formula: |
      # (a) ELIGIBILITY FILTER — explicit predicate per candidate category
      eligible = {}
      if Postdoc.citizenship_country IN {"CA", "MX"} and employment_class == EMPLOYEE:
          eligible += {TN}
      if Postdoc.j1_two_year_bar_flag == false and term_months <= 60:
          eligible += {J1_RESEARCH_SCHOLAR}
      if employment_class == EMPLOYEE and term_months >= 12:
          eligible += {H1B}
      if Postdoc.o1_endorsement_on_file == true:
          eligible += {O1}

      # (b) RANKING EXPRESSION — ascending CATEGORY_PRIORITY
      selected = argmin(CATEGORY_PRIORITY[c] for c in eligible)

      # (c) TIE-BREAK — CATEGORY_PRIORITY assigns four distinct integers to the
      #     four categories, so the ranking expression cannot tie. No secondary
      #     key is defined or needed; id is never consulted.

      # (d) EMPTY-SET FALLBACK
      if eligible is empty: reject with ERR_NO_ELIGIBLE_VISA_CATEGORY (422)
    input_set: "the accepting Appointment and its Postdoc; no other rows participate"
    constants:
      CATEGORY_PRIORITY: { TN: 1, J1_RESEARCH_SCHOLAR: 2, H1B: 3, O1: 4 }
      PREMIUM_ELIGIBLE_CATEGORIES: [H1B, O1]
    precision: "enum, no rounding"

  - name: visa_processing_timeline
    trigger: "on POST /visa-cases/{id}/submit-petition (both from-states) and re-pinned on APPROVED adjudication"
    algorithm: forward_looking
    formula: |
      base_days =
          PREMIUM_PROCESSING_DAYS[visa_category]   if processing_track == PREMIUM
          else STANDARD_PROCESSING_DAYS[visa_category]

      # variant selection is by from-state, see `variants` below
      projected_decision_date =
          filed_at.date() + base_days                                  # initial_filing
          filed_at.date() + ceil(base_days * RFE_EXTENSION_FACTOR)     # post_rfe_refiling

      earliest_lawful_start_date = projected_decision_date + VISA_ACTIVATION_LEAD_DAYS

      # On APPROVED the projection is replaced by the realized decision:
      earliest_lawful_start_date = decided_at.date() + VISA_ACTIVATION_LEAD_DAYS
    input_set: "the single VisaCase row; filed_at is always the logical clock instant of the submission that produced the current status"
    constants:
      STANDARD_PROCESSING_DAYS: { TN: 10, J1_RESEARCH_SCHOLAR: 21, H1B: 120, O1: 75 }
      PREMIUM_PROCESSING_DAYS: { H1B: 15, O1: 15 }
      RFE_EXTENSION_FACTOR: 1.5
      VISA_ACTIVATION_LEAD_DAYS: 10
      RFE_ROUND_LIMIT: 2
    precision: "whole calendar days; ceil applied to the RFE-extended day count before it is added to the date"
    variants:
      - name: initial_filing
        when: "the submission moved the case DOCS_PENDING -> SUBMITTED (projection_variant := INITIAL_FILING)"
        difference: "projected_decision_date = filed_at.date() + base_days, with no extension factor"
      - name: post_rfe_refiling
        when: "the submission moved the case RFE_RECEIVED -> SUBMITTED (projection_variant := POST_RFE_REFILING)"
        difference: |
          projected_decision_date = filed_at.date() + ceil(base_days * 1.5).
          The processing time already elapsed before the RFE is DISCARDED, not
          credited: for identical category and track the two variants project
          different dates from the same filing instant (J1 STANDARD: +21 days
          versus +32 days).

  - name: export_control_risk_score
    trigger: "on POST /export-control-reviews/{id}/decision"
    algorithm: weighted_scoring
    formula: |
      country_risk = COUNTRY_RISK.get(Postdoc.citizenship_country, COUNTRY_RISK_DEFAULT)
      funding_risk = FUNDING_RISK[FundingSource.funding_type]

      # tier selection (which variant of the score applies)
      screening_tier =
          TIER_2_ENHANCED if (cycle_index >= 2
                              or restricted_party_hit == true
                              or (controlled_technology_flag == true and country_risk >= 3.0))
          else TIER_1_STANDARD

      country_weight = 15.0 if screening_tier == TIER_2_ENHANCED else 12.5

      # ROUNDING ORDER: each component is rounded to 2 dp, the components are
      # then summed, and only the sum is rounded to 1 dp.
      w_country  = round(country_risk * country_weight, 2)
      w_tech     = round(18.75 if controlled_technology_flag else 0.0, 2)
      w_party    = round(40.00 if restricted_party_hit      else 0.0, 2)
      w_funding  = round(funding_risk * 6.25, 2)
      w_duration = round((Appointment.term_months / 12) * 3.125, 2)
                   if screening_tier == TIER_2_ENHANCED else 0.00
      risk_score = round(w_country + w_tech + w_party + w_funding + w_duration, 1)

      deemed_export_license_required = (controlled_technology_flag == true and country_risk >= 3.0)

      outcome =
          DENIED                    if restricted_party_hit == true
          DENIED                    if risk_score >= DENIAL_THRESHOLD
          CLEARED_WITH_CONDITIONS   if risk_score >= CONDITIONS_THRESHOLD
          CLEARED                   otherwise
    input_set: "the single ExportControlReview row plus its Appointment (term_months), that appointment's Postdoc (citizenship_country) and FundingSource (funding_type)"
    constants:
      COUNTRY_RISK: { US: 0.0, CA: 0.5, MX: 0.5, IN: 1.5, CN: 2.5, IR: 4.0 }
      COUNTRY_RISK_DEFAULT: 1.0
      FUNDING_RISK: { FEDERAL_GRANT: 1.0, FOUNDATION_GRANT: 0.5, EXTERNAL_FELLOWSHIP: 1.6, INSTITUTIONAL_FELLOWSHIP: 0.0 }
      CONDITIONS_THRESHOLD: 35.0
      DENIAL_THRESHOLD: 60.0
    precision: "components 2 decimal places round_half_up; risk_score 1 decimal place round_half_up"
    variants:
      - name: tier_1_standard
        when: "screening_tier == TIER_1_STANDARD (first-cycle review, no restricted-party hit, and not controlled tech from a country at risk >= 3.0)"
        difference: "country component uses weight 12.5 and the duration component is omitted entirely (w_duration = 0.00)"
      - name: tier_2_enhanced
        when: "screening_tier == TIER_2_ENHANCED (cycle_index >= 2, or a restricted-party hit, or controlled tech from a country at risk >= 3.0)"
        difference: |
          country component uses weight 15.0 AND the term-duration component is
          added. For identical reviewer inputs the two variants produce
          different scores and can produce different outcomes: CN + controlled
          tech + FEDERAL_GRANT + 24-month term scores 56.3 (CLEARED_WITH_CONDITIONS)
          under tier_1_standard and 68.8 (DENIED) under tier_2_enhanced.

  - name: non_renewal_notice_policy
    trigger: "on POST /reappointment-reviews/{id}/finalize with decision NON_RENEW"
    algorithm: threshold
    formula: |
      # finalized_at is the logical clock instant of the finalize call. It is
      # computed on BOTH finalize branches; on the NON_RENEW branch
      # notice_issued_at := finalized_at.
      finalized_at = logical clock now
      service_months_at_review =
          Appointment.months_in_rank_at_start
          + term_months(Appointment.term_start_date, finalized_at.date())

      notice_days_required =
          30 if service_months_at_review <= NOTICE_TIER_1_MONTHS
          60 if service_months_at_review <= NOTICE_TIER_2_MONTHS
          90 otherwise

      notice_deadline_date = Appointment.term_end_date - notice_days_required     # date arithmetic
      notice_timely        = (notice_issued_at.date() <= notice_deadline_date)

      if notice_timely == false:
          required_end        = notice_issued_at.date() + notice_days_required
          term_extension_days = (required_end - Appointment.term_end_date).days
          Appointment.term_end_date := required_end
      else:
          term_extension_days = 0

      grievance_window_end =
          (notice_issued_at.date() + GRIEVANCE_WINDOW_DAYS) at 23:59:59.999Z
    input_set: "the single ReappointmentReview row and its Appointment; term_months() is the pinned month arithmetic from months_in_rank_ledger"
    constants:
      NOTICE_TIER_1_MONTHS: 12
      NOTICE_TIER_2_MONTHS: 36
      GRIEVANCE_WINDOW_DAYS: 21
    precision: "integer days; grievance_window_end has exactly three fractional second digits"

  - name: lab_bench_occupancy
    trigger: "on POST /lab-access-grants, before the grant row is created"
    algorithm: interval_merge
    formula: |
      # EFFECTIVE OCCUPANCY INTERVAL — the leading edge only is expanded by the
      # laboratory's decontamination buffer; the trailing edge is not.
      eff(g) = [ g.access_start_date - Laboratory.decontamination_buffer_days ,
                 g.access_end_date ]                                # both ends INCLUSIVE

      incumbents = { g : g.laboratory_id == request.laboratory_id
                         and g.status IN {PROVISIONED, SUSPENDED} }

      # AGGREGATE CAPACITY TEST — evaluated per calendar day, not pairwise
      for d in eff(request):
          occupied(d) = SUM(g.bench_seats for g in incumbents if d IN eff(g))
          if occupied(d) + request.bench_seats > Laboratory.bench_capacity:
              reject with ERR_LAB_CAPACITY_EXCEEDED (409)

      # CONSERVED QUANTITY (invariant checked by the compensating action):
      # for every calendar day d, occupied(d) equals the sum of bench_seats over
      # grants in {PROVISIONED, SUSPENDED} whose eff() contains d; a REVOKED
      # grant contributes 0 on every day.
    input_set: "grants on the same laboratory_id with status IN {PROVISIONED, SUSPENDED}; REVOKED grants are excluded and free their seats"
    constants:
      RESTRICTED_MAX_BENCH_SEATS: 1
    precision: "whole calendar days; integer seat counts"

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
# Priority ladder for this domain: auth -> authorization -> existence ->
# ownership -> request shape -> state precondition -> OCC -> research-security
# (safety) -> funding referential integrity -> term-limit constraints ->
# temporal conflicts -> capacity -> fiscal. Research security outranks every
# business check because lab exposure is irreversible; fiscal checks are last
# because money is recoverable.

validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every id referenced by the request exists, validated left-to-right: path ids first in path order, then body FK fields in the order they are declared in §1.1"
    error_id: "ERR_POSTDOC_NOT_FOUND | ERR_MENTOR_NOT_FOUND | ERR_FUNDING_SOURCE_NOT_FOUND | ERR_LABORATORY_NOT_FOUND | ERR_APPOINTMENT_NOT_FOUND | ERR_VISA_CASE_NOT_FOUND | ERR_DEVELOPMENT_DOCUMENT_NOT_FOUND | ERR_EXPORT_REVIEW_NOT_FOUND | ERR_LAB_GRANT_NOT_FOUND | ERR_REAPPOINTMENT_REVIEW_NOT_FOUND | ERR_GRIEVANCE_NOT_FOUND | ERR_EXIT_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 4
    category: auth
    check: "for entity_backed roles the acting X-User-ID must own the target: Postdoc acting on an Appointment/Grievance/ExitRecord must equal that appointment's postdoc_id; FacultyMentor acting on a DevelopmentDocument, LabAccessGrant or ReappointmentReview must equal that appointment's mentor_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /appointments/{id}/accept-offer, POST /development-documents/{id}/submit, POST /lab-access-grants, POST /reappointment-reviews/{id}/recommendation, POST /grievances, POST /exit-records/{id}/ip-assignment"

  - priority: 5
    category: state
    check: "request body shape: required fields present, enum fields carry a declared member, dates are ISO-8601, numeric fields non-negative, term_end_date strictly after term_start_date, access_end_date strictly after access_start_date, bench_seats >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 6
    category: state
    check: "the target resource is in a from-state that declares the requested trigger in its §1.2 transition list; terminal states accept nothing"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: state
    check: "expected_appointment_version equals the current Appointment.version (§1.2.1)"
    error_id: ERR_STALE_APPOINTMENT_VERSION
    http_status: 412
    applies_to: "POST /appointments/{id}/salary-exception, POST /lab-access-grants"

  - priority: 8
    category: business_safety
    check: "lab exposure requires research-security clearance: the appointment's compliance_status must be CLEARED or RESTRICTED. compliance_status PENDING_REVIEW or BLOCKED is refused by this rule and by this rule only. The extra limits that apply to a RESTRICTED appointment - biosafety level and seat count - are NOT part of this check; they are enforced one rung lower by ERR_COMPLIANCE_RESTRICTION_VIOLATED at priority 9, so a RESTRICTED appointment asking for a BSL2 bench passes this rule and fails that one."
    error_id: ERR_EXPORT_CONTROL_BLOCKED
    http_status: 422
    applies_to: "POST /lab-access-grants"

  - priority: 9
    category: business_safety
    check: "a RESTRICTED appointment may not be granted seats in a BSL2 or BSL3 laboratory, and may not exceed RESTRICTED_MAX_BENCH_SEATS seats anywhere"
    error_id: ERR_COMPLIANCE_RESTRICTION_VIOLATED
    http_status: 422
    applies_to: "POST /lab-access-grants"

  - priority: 10
    category: business_safety
    check: "the target laboratory's status is OPEN"
    error_id: ERR_LAB_CLOSED
    http_status: 409
    applies_to: "POST /lab-access-grants"

  - priority: 11
    category: business_referential
    check: "the appointment's FundingSource.verification_status is VERIFIED, and the appointment term start falls on or after award_start_date"
    error_id: ERR_FUNDING_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /appointments/{id}/issue-offer"

  - priority: 12
    category: business_referential
    check: "employment_class must match funding_type: FELLOWSHIP is only permitted on EXTERNAL_FELLOWSHIP or INSTITUTIONAL_FELLOWSHIP awards; EMPLOYEE is only permitted on FEDERAL_GRANT or FOUNDATION_GRANT awards"
    error_id: ERR_FUNDING_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 13
    category: business_referential
    check: "title_classification must match employment_class: POSTDOC_SCHOLAR_EMPLOYEE and POSTDOC_ASSOCIATE require EMPLOYEE; POSTDOC_FELLOW requires FELLOWSHIP"
    error_id: ERR_TITLE_CLASS_MISMATCH
    http_status: 422
    applies_to: "POST /appointments"

  - priority: 14
    category: business_referential
    check: "the acting mentor's mentor_training_valid_through is on or after the appointment's term_start_date"
    error_id: ERR_MENTOR_TRAINING_LAPSED
    http_status: 422
    applies_to: "POST /appointments, POST /lab-access-grants"

  - priority: 15
    category: business_constraint
    check: "cumulative_months_in_rank_at_end must not exceed TOTAL_MONTHS_IN_RANK_CAP (60); the boundary value 60 is permitted, 61 is not"
    error_id: ERR_RANK_YEARS_EXCEEDED
    http_status: 422
    applies_to: "POST /appointments, POST /reappointment-reviews/{id}/finalize"

  - priority: 16
    category: business_constraint
    check: "term_months must lie within [MIN_TERM_MONTHS, MAX_TERM_MONTHS] = [12, 36] inclusive"
    error_id: ERR_TERM_LENGTH_INVALID
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{id}/activate"

  - priority: 17
    category: business_constraint
    check: "the requested processing_track PREMIUM is only available for visa_category in PREMIUM_ELIGIBLE_CATEGORIES {H1B, O1}"
    error_id: ERR_PREMIUM_TRACK_UNAVAILABLE
    http_status: 422
    applies_to: "POST /visa-cases/{id}/submit-petition"

  - priority: 18
    category: business_constraint
    check: "rfe_round_count must be strictly below RFE_ROUND_LIMIT (2) before another RFE may be recorded"
    error_id: ERR_RFE_ROUND_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /visa-cases/{id}/adjudication"

  - priority: 19
    category: business_constraint
    check: "revision_round must be strictly below DOC_REVISION_LIMIT (3) before another RETURN decision may be recorded"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /development-documents/{id}/review"

  - priority: 20
    category: business_constraint
    check: "activation requires every funder-required development document APPROVED: a MENTORING_PLAN when FundingSource.requires_mentoring_plan, an IDP when FundingSource.requires_idp"
    error_id: ERR_DEVELOPMENT_DOCS_INCOMPLETE
    http_status: 422
    applies_to: "POST /appointments/{id}/activate"

  - priority: 21
    category: business_constraint
    check: "an IDP may only be APPROVED when postdoc_acknowledged is true"
    error_id: ERR_IDP_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /development-documents/{id}/review"

  - priority: 22
    category: business_constraint
    check: "a sponsorship-requiring appointment may only be activated when its latest VisaCase is APPROVED"
    error_id: ERR_VISA_NOT_APPROVED
    http_status: 422
    applies_to: "POST /appointments/{id}/activate"

  - priority: 23
    category: business_constraint
    check: "the acting user must not be the appointment's prepared_by_user_id when approving a salary exception, and the finalizing user must not be the review's recommended_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appointments/{id}/salary-exception, POST /reappointment-reviews/{id}/finalize"

  - priority: 24
    category: business_temporal
    check: "for a sponsorship-requiring appointment, term_start_date must be on or after the latest VisaCase.earliest_lawful_start_date"
    error_id: ERR_START_BEFORE_LAWFUL_DATE
    http_status: 422
    applies_to: "POST /appointments/{id}/activate"

  - priority: 25
    category: business_temporal
    check: "the new appointment's [term_start_date, term_end_date] closed interval must not overlap any other appointment of the same postdoc whose appointment_status is in {OFFER_ISSUED, OFFER_ACCEPTED, ACTIVE}; touching endpoints (new start == existing end) count as an overlap"
    error_id: ERR_APPOINTMENT_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 26
    category: business_temporal
    check: "a grievance may only be filed at or before the review's grievance_window_end (inclusive to the millisecond); a review whose grievance_window_end is null — every status other than FINALIZED_NON_RENEWED — has no open window and is refused by this same rule"
    error_id: ERR_GRIEVANCE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /grievances"

  - priority: 27
    category: business_temporal
    check: "the requested grant's effective occupancy interval (leading edge expanded by decontamination_buffer_days, trailing edge not) must not push any calendar day over bench_capacity; a same-lab grant ending on the requested effective start date is a conflict"
    error_id: ERR_LAB_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /lab-access-grants"

  - priority: 28
    category: business_constraint
    check: "aggregate seat demand: SUM(bench_seats) over PROVISIONED and SUSPENDED grants overlapping any day of the requested effective interval plus the requested bench_seats must not exceed Laboratory.bench_capacity"
    error_id: ERR_LAB_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /lab-access-grants"

  - priority: 29
    category: business_constraint
    check: "the mentor's active_postdoc_count must be strictly below max_concurrent_postdocs at the moment the offer is issued"
    error_id: ERR_MENTOR_LOAD_EXCEEDED
    http_status: 409
    applies_to: "POST /appointments/{id}/issue-offer"

  - priority: 30
    category: business_fiscal
    check: "annual_salary_usd must be greater than or equal to the effective floor (salary_exception_floor_usd when present, otherwise salary_floor_usd); equality passes"
    error_id: ERR_SALARY_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /appointments/{id}/issue-offer"

  - priority: 31
    category: business_fiscal
    check: "the new encumbrance must not drive FundingSource.encumbered_usd above annual_budget_usd; exact equality passes"
    error_id: ERR_FUNDING_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /appointments/{id}/issue-offer"

  - priority: 32
    category: state
    check: "at most one non-terminal ReappointmentReview per appointment, and at most one ExitRecord per appointment"
    error_id: "ERR_REVIEW_ALREADY_OPEN | ERR_EXIT_ALREADY_INITIATED"
    http_status: 409
    applies_to: "POST /appointments/{id}/reappointment-reviews, POST /appointments/{id}/exit"

  - priority: 33
    category: business_referential
    check: "visa_category_selection must yield a non-empty eligible set for a sponsorship-requiring postdoc"
    error_id: ERR_NO_ELIGIBLE_VISA_CATEGORY
    http_status: 422
    applies_to: "POST /appointments/{id}/accept-offer"

  - priority: 34
    category: business_temporal
    check: "an award may only be verified while its award_end_date is on or after the logical clock date"
    error_id: ERR_AWARD_EXPIRED
    http_status: 422
    applies_to: "POST /funding-sources/{id}/verification"

  - priority: 35
    category: business_referential
    check: "the appointment term must overlap the award window by at least one inclusive day, otherwise no encumbrance can be computed"
    error_id: ERR_AWARD_TERM_NO_OVERLAP
    http_status: 422
    applies_to: "POST /appointments/{id}/issue-offer"

  - priority: 36
    category: business_fiscal
    check: "exception_floor_usd must be at least ABSOLUTE_STIPEND_FLOOR_USD (54000.00) and strictly below the appointment's computed salary_floor_usd"
    error_id: ERR_EXCEPTION_FLOOR_INVALID
    http_status: 422
    applies_to: "POST /appointments/{id}/salary-exception"

# --- Declared priority conflict pairs (a single request violates both; the
# --- lower priority number wins and is the only error_id returned) ---
#
# CONFLICT-1  business_referential (11 ERR_FUNDING_NOT_VERIFIED) vs
#             business_fiscal (30 ERR_SALARY_BELOW_FLOOR)
#             on POST /appointments/{id}/issue-offer  -> ERR_FUNDING_NOT_VERIFIED
#
# CONFLICT-2  business_safety (8 ERR_EXPORT_CONTROL_BLOCKED) vs
#             business_constraint (28 ERR_LAB_CAPACITY_EXCEEDED)
#             on POST /lab-access-grants              -> ERR_EXPORT_CONTROL_BLOCKED
#
# CONFLICT-3  business_constraint (15 ERR_RANK_YEARS_EXCEEDED) vs
#             business_temporal (25 ERR_APPOINTMENT_TERM_OVERLAP)
#             on POST /appointments                   -> ERR_RANK_YEARS_EXCEEDED

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# api_prefix is "" — every collection sits at the document root as a peer, which
# matches complexity_profile.entity_topology: flat. Sub-resource GETs exist only
# to satisfy FK reverse-reachability for cascade-created children that never
# appear in any creation response.
#
# FK reverse-reachability map (§1.1 FK -> discovery channel):
#   Appointment.postdoc_id                  -> GET /appointments?postdoc_id
#   Appointment.mentor_id                   -> GET /appointments?mentor_id
#   Appointment.funding_source_id           -> GET /appointments?funding_source_id
#   Appointment.predecessor_appointment_id  -> GET /appointments?predecessor_appointment_id
#   VisaCase.appointment_id                 -> GET /appointments/{id}/visa-cases
#   DevelopmentDocument.appointment_id      -> GET /appointments/{id}/development-documents
#   ExportControlReview.appointment_id      -> GET /appointments/{id}/export-control-reviews
#   ExitRecord.appointment_id               -> GET /appointments/{id}/exit-record
#   LabAccessGrant.appointment_id           -> GET /lab-access-grants?appointment_id
#   LabAccessGrant.laboratory_id            -> GET /lab-access-grants?laboratory_id
#   ReappointmentReview.appointment_id      -> GET /reappointment-reviews?appointment_id
#   Grievance.reappointment_review_id       -> GET /reappointment-reviews/{id}/grievances

endpoints:

  # --- reads -----------------------------------------------------------------

  - method: GET
    path: "/postdocs/{id}"
    description: "Fetch one postdoctoral scholar record including the realized rank ledger."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: []
    output: Postdoc
    side_effects: []

  - method: GET
    path: "/faculty-mentors/{id}"
    description: "Fetch one faculty mentor including the derived active_postdoc_count."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: []
    output: FacultyMentor
    side_effects: []

  - method: GET
    path: "/funding-sources/{id}"
    description: "Fetch one funding source including encumbered_usd and available_balance_usd."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: []
    output: FundingSource
    side_effects: []

  - method: GET
    path: "/laboratories/{id}"
    description: "Fetch one laboratory including bench_capacity and decontamination_buffer_days."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: []
    output: Laboratory
    side_effects: []

  - method: GET
    path: "/appointments/{id}"
    description: "Fetch one appointment with both state dimensions, all computed compensation fields, and the OCC version."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: GET
    path: "/appointments"
    description: "List appointments filtered by any combination of FK and status; the single discovery channel for all four Appointment FKs."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: ["postdoc_id?", "mentor_id?", "funding_source_id?", "predecessor_appointment_id?", "appointment_status?", "compliance_status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []

  - method: GET
    path: "/appointments/{id}/visa-cases"
    description: "List the visa cases created for this appointment (array of length 0 or 1 in practice); the only discovery channel for a cascade-created VisaCase."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: ["limit?", "offset?"]
    output: VisaCase[]
    side_effects: []

  - method: GET
    path: "/appointments/{id}/development-documents"
    description: "List the mentoring plan / IDP documents cascade-created for this appointment."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: ["doc_type?", "status?", "limit?", "offset?"]
    output: DevelopmentDocument[]
    side_effects: []

  - method: GET
    path: "/appointments/{id}/export-control-reviews"
    description: "List every research-security screening cycle for this appointment, ascending by cycle_index."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ExportControlReview[]
    side_effects: []

  - method: GET
    path: "/appointments/{id}/exit-record"
    description: "List the exit record for this appointment (array of length 0 or 1); the only discovery channel for a cascade-created ExitRecord."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: []
    output: ExitRecord[]
    side_effects: []

  - method: GET
    path: "/lab-access-grants/{id}"
    description: "Fetch one bench-access grant."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: []
    output: LabAccessGrant
    side_effects: []

  - method: GET
    path: "/lab-access-grants"
    description: "List bench-access grants filtered by appointment, laboratory or status; the discovery channel for both LabAccessGrant FKs."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: ["appointment_id?", "laboratory_id?", "status?", "limit?", "offset?"]
    output: LabAccessGrant[]
    side_effects: []

  - method: GET
    path: "/reappointment-reviews/{id}"
    description: "Fetch one reappointment review including the computed notice policy fields and the grievance window."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: []
    output: ReappointmentReview
    side_effects: []

  - method: GET
    path: "/reappointment-reviews"
    description: "List reappointment reviews filtered by appointment or status; the discovery channel for ReappointmentReview.appointment_id."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: ["appointment_id?", "status?", "limit?", "offset?"]
    output: ReappointmentReview[]
    side_effects: []

  - method: GET
    path: "/reappointment-reviews/{id}/grievances"
    description: "List grievances filed against this review; the discovery channel for Grievance.reappointment_review_id."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Grievance[]
    side_effects: []

  # --- registry creation -----------------------------------------------------

  - method: POST
    path: "/postdocs"
    description: "Register a prospective postdoctoral scholar with citizenship, sponsorship need and prior external months in rank."
    roles: [PostdocAffairsOfficer]
    code: 201
    input: [full_name, email, citizenship_country, requires_sponsorship, phd_award_date, "prior_external_months_in_rank?", "o1_endorsement_on_file?", "j1_two_year_bar_flag?", "restricted_party_flag?"]
    output: Postdoc
    side_effects: ["status := PROSPECTIVE", "total_months_in_rank := prior_external_months_in_rank"]

  - method: POST
    path: "/faculty-mentors"
    description: "Register a faculty mentor with a mentor-training expiry and a concurrent-postdoc ceiling."
    roles: [PostdocAffairsOfficer]
    code: 201
    input: [full_name, department, mentor_training_valid_through, "max_concurrent_postdocs?"]
    output: FacultyMentor
    side_effects: ["active_postdoc_count := 0"]

  - method: POST
    path: "/funding-sources"
    description: "Register a sponsored award or fellowship with its salary-floor policy, award window, budget and funder document requirements."
    roles: [PostdocAffairsOfficer]
    code: 201
    input: [sponsor_name, funding_type, salary_floor_policy, award_start_date, award_end_date, annual_budget_usd, "requires_mentoring_plan?", "requires_idp?"]
    output: FundingSource
    side_effects: ["verification_status := UNVERIFIED", "encumbered_usd := 0.00", "available_balance_usd := annual_budget_usd"]

  - method: POST
    path: "/funding-sources/{id}/verification"
    description: "Verify or suspend an award. decision is VERIFY or SUSPEND."
    roles: [HRCompensationApprover]
    code: 200
    input: [decision]
    output: FundingSource
    side_effects: ["FundingSource.verification_status transition per §1.2", "verified_at and verified_by_user_id stamped on VERIFY"]

  - method: POST
    path: "/laboratories"
    description: "Register a laboratory with its biosafety level, bench capacity and decontamination buffer."
    roles: [PostdocAffairsOfficer]
    code: 201
    input: [name, biosafety_level, bench_capacity, "decontamination_buffer_days?", "status?"]
    output: Laboratory
    side_effects: []

  # --- appointment lifecycle -------------------------------------------------

  - method: POST
    path: "/appointments"
    description: "Draft an appointment. Computes term_months, months_in_rank_at_start over the predecessor chain, cumulative_months_in_rank_at_end, salary_floor_usd and benefits_package before any offer is issued."
    roles: [PostdocAffairsOfficer]
    code: 201
    input: [postdoc_id, mentor_id, funding_source_id, title_classification, employment_class, term_start_date, term_end_date, annual_salary_usd, "predecessor_appointment_id?"]
    output: Appointment
    side_effects:
      - "appointment_status := DRAFT; compliance_status := PENDING_REVIEW; prepared_by_user_id := X-User-ID"
      - "calculations.months_in_rank_ledger, calculations.salary_floor_computation, calculations.benefits_eligibility"

  - method: POST
    path: "/appointments/{id}/salary-exception"
    description: "Approve a salary-minimum exception that lowers the enforced floor for this appointment. OCC-guarded on the appointment's version and subject to segregation of duties against prepared_by_user_id."
    roles: [HRCompensationApprover]
    code: 200
    input: [expected_appointment_version, exception_floor_usd, justification]
    output: Appointment
    side_effects:
      - "salary_exception_floor_usd := exception_floor_usd; salary_exception_approved_by_user_id := X-User-ID"
      - "increments Appointment.version by 1"

  - method: POST
    path: "/appointments/{id}/issue-offer"
    description: "Issue the offer: enforces funding verification, the salary floor and the award budget, then encumbers the prorated salary plus fringe and cascade-creates the screening cycle and any funder-required development documents."
    roles: [PostdocAffairsOfficer]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "Appointment.appointment_status DRAFT -> OFFER_ISSUED with all §1.2 side effects"
      - "calculations.funding_encumbrance; FundingSource ledger updated"
      - "creates ExportControlReview (cycle_index 1) and up to two DevelopmentDocument rows"

  - method: POST
    path: "/appointments/{id}/accept-offer"
    description: "The scholar accepts. Runs visa_category_selection and cascade-creates the VisaCase when sponsorship is required. processing_track defaults to STANDARD."
    roles: [Postdoc]
    code: 200
    input: ["processing_track?"]
    output: Appointment
    side_effects:
      - "Appointment.appointment_status OFFER_ISSUED -> OFFER_ACCEPTED"
      - "calculations.visa_category_selection; creates VisaCase in DOCS_PENDING when Postdoc.requires_sponsorship"

  - method: POST
    path: "/appointments/{id}/activate"
    description: "Activate the appointment once compliance, visa lawful-start, and every funder-required development document are satisfied."
    roles: [PostdocAffairsOfficer]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "Appointment.appointment_status OFFER_ACCEPTED -> ACTIVE"
      - "Postdoc.status PROSPECTIVE -> ACTIVE; FacultyMentor.active_postdoc_count += 1"

  - method: POST
    path: "/appointments/{id}/withdraw"
    description: "Withdraw a pre-active appointment, releasing the encumbrance and voiding the in-flight visa case, development documents and queued screening."
    roles: [PostdocAffairsOfficer]
    code: 200
    input: [withdraw_reason]
    output: Appointment
    side_effects:
      - "Appointment.appointment_status -> WITHDRAWN with the compensating ledger release"
      - "cascade VOIDED on VisaCase, DevelopmentDocument and ExportControlReview children"

  # --- visa sponsorship ------------------------------------------------------

  - method: POST
    path: "/visa-cases/{id}/submit-petition"
    description: "File or re-file the petition. From DOCS_PENDING the projection uses the initial_filing variant; from RFE_RECEIVED it uses the post_rfe_refiling variant. Omitting processing_track leaves the current track unchanged."
    roles: [InternationalScholarAdvisor]
    code: 200
    input: ["processing_track?"]
    output: VisaCase
    side_effects:
      - "filed_at := logical clock now; projection_variant set from the from-state"
      - "calculations.visa_processing_timeline recomputes projected_decision_date and earliest_lawful_start_date"

  - method: POST
    path: "/visa-cases/{id}/adjudication"
    description: "Record the adjudication. outcome is APPROVED, DENIED or RFE. APPROVED re-pins the lawful start and may defer the appointment term; DENIED withdraws the appointment."
    roles: [InternationalScholarAdvisor]
    code: 200
    input: [outcome, "decision_note?"]
    output: VisaCase
    side_effects:
      - "VisaCase status transition per §1.2 (CH-B on APPROVED, CH-B variant on DENIED, rfe_round_count += 1 on RFE)"
      - "on APPROVED: earliest_lawful_start_date := decided_at date + VISA_ACTIVATION_LEAD_DAYS, then the CH-B appointment cascade"

  # --- mentoring plan / IDP --------------------------------------------------

  - method: POST
    path: "/development-documents/{id}/submit"
    description: "The mentor submits or re-submits the mentoring plan or IDP for review."
    roles: [FacultyMentor]
    code: 200
    input: [content_summary]
    output: DevelopmentDocument
    side_effects:
      - "DevelopmentDocument DRAFT|RETURNED_FOR_REVISION -> SUBMITTED"
      - "content_summary := request value; submitted_by_user_id := X-User-ID"

  - method: POST
    path: "/development-documents/{id}/acknowledge"
    description: "The scholar acknowledges the document. Required before an IDP can be approved; does not change the document status."
    roles: [Postdoc]
    code: 200
    input: []
    output: DevelopmentDocument
    side_effects: ["postdoc_acknowledged := true"]

  - method: POST
    path: "/development-documents/{id}/review"
    description: "Approve or return the document. decision is APPROVE or RETURN; RETURN increments revision_round and is capped by DOC_REVISION_LIMIT."
    roles: [PostdocAffairsOfficer]
    code: 200
    input: [decision, "reviewer_note?"]
    output: DevelopmentDocument
    side_effects: ["DevelopmentDocument status transition per §1.2", "approved_at stamped on APPROVE"]

  # --- research security ------------------------------------------------------

  - method: POST
    path: "/export-control-reviews/{id}/decision"
    description: "The reviewer records the screening findings; the server selects the screening tier, scores the risk and derives the outcome, which drives the appointment's compliance_status dimension."
    roles: [ExportControlReviewer]
    code: 200
    input: ["restricted_party_hit?", "controlled_technology_flag?"]
    output: ExportControlReview
    side_effects:
      - "calculations.export_control_risk_score sets screening_tier, risk_score, deemed_export_license_required"
      - "ExportControlReview QUEUED -> CLEARED | CLEARED_WITH_CONDITIONS | DENIED; Appointment.compliance_status follows; CH-E on DENIED"

  - method: POST
    path: "/lab-access-grants"
    description: "The mentor requests bench seats for the scholar. OCC-guarded on the appointment's version; enforces research-security posture, laboratory status and the buffered aggregate capacity test."
    roles: [FacultyMentor]
    code: 201
    input: [appointment_id, laboratory_id, bench_seats, access_start_date, access_end_date, expected_appointment_version]
    output: LabAccessGrant
    side_effects:
      - "status := PROVISIONED; suspension_reason := NONE; requested_by_user_id := X-User-ID"
      - "increments Appointment.version by 1 (the OCC parent of this write, per §1.2.1 lab-grant-stale-appointment)"

  # --- reappointment, notice and grievance -----------------------------------

  - method: POST
    path: "/appointments/{id}/reappointment-reviews"
    description: "Open a reappointment review cycle for an active appointment. review_cycle is one greater than the highest existing cycle for the appointment."
    roles: [PostdocAffairsOfficer]
    code: 201
    input: []
    output: ReappointmentReview
    side_effects: ["status := OPENED; review_cycle assigned"]

  - method: POST
    path: "/reappointment-reviews/{id}/recommendation"
    description: "The mentor records the renewal recommendation. recommendation is RENEW or NON_RENEW."
    roles: [FacultyMentor]
    code: 200
    input: [recommendation, mentor_recommendation_note]
    output: ReappointmentReview
    side_effects: ["ReappointmentReview OPENED -> RECOMMENDED_RENEW | RECOMMENDED_NON_RENEW", "recommended_by_user_id := X-User-ID"]

  - method: POST
    path: "/reappointment-reviews/{id}/finalize"
    description: "Finalize the review. decision is RENEW or NON_RENEW. RENEW forks into the CH-D re-screen cascade; NON_RENEW computes the notice policy, may extend the term, and posts the rank months."
    roles: [PostdocAffairsOfficer]
    code: 200
    input: [decision]
    output: ReappointmentReview
    side_effects:
      - "calculations.non_renewal_notice_policy on the NON_RENEW branch"
      - "CH-D (RENEW): creates a re-screen ExportControlReview, regresses compliance_status, suspends PROVISIONED grants"
      - "CH-C precursor (NON_RENEW): Appointment ACTIVE -> NON_RENEWED with ledger and encumbrance recompute"

  - method: POST
    path: "/grievances"
    description: "The scholar files a grievance against a finalized non-renewal, inside the grievance window."
    roles: [Postdoc]
    code: 201
    input: [reappointment_review_id, category, narrative]
    output: Grievance
    side_effects: ["status := FILED; filed_at := logical clock now; filed_by_user_id := X-User-ID"]

  - method: POST
    path: "/grievances/{id}/resolution"
    description: "Resolve the grievance. outcome is DENY or SUSTAIN; SUSTAIN triggers the CH-C reversal of the non-renewal."
    roles: [PostdocAffairsOfficer]
    code: 200
    input: [outcome, resolution_note]
    output: Grievance
    side_effects:
      - "Grievance FILED -> RESOLVED_DENIED | RESOLVED_SUSTAINED"
      - "CH-C on SUSTAIN: review FINALIZED_NON_RENEWED -> FINALIZED_RENEWED and appointment NON_RENEWED -> ACTIVE with the pinned three-step reversal"

  # --- exit and IP -----------------------------------------------------------

  - method: POST
    path: "/appointments/{id}/exit"
    description: "Initiate exit processing, revoking every bench-access grant for the appointment."
    roles: [PostdocAffairsOfficer]
    code: 201
    input: [exit_reason]
    output: ExitRecord
    side_effects:
      - "status := INITIATED; initiated_at := logical clock now"
      - "every LabAccessGrant for the appointment in {PROVISIONED, SUSPENDED} -> REVOKED with suspension_reason EXIT_PROCESSING"

  - method: POST
    path: "/exit-records/{id}/ip-assignment"
    description: "The scholar signs the intellectual-property assignment. Immediately evaluates the CH-A auto-close chain."
    roles: [Postdoc]
    code: 200
    input: [ip_disclosure_count]
    output: ExitRecord
    side_effects:
      - "ExitRecord INITIATED -> IP_ASSIGNMENT_SIGNED, then the CH-A auto-close to CLOSED when lab_access_cleared"
      - "CH-A: Appointment ACTIVE -> COMPLETED, rank months posted, mentor load released, encumbrance released, Postdoc -> SEPARATED"

  # --- test-driving surface --------------------------------------------------

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, window and stamped timestamp reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [PostdocAffairsOfficer, HRCompensationApprover, ExportControlReviewer, InternationalScholarAdvisor, FacultyMentor, Postdoc]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["all subsequent logical-clock reads return current_utc"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================

errors:

  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource whose owning FK does not equal X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the approver of a salary exception is the appointment's preparer, or the finalizer of a review is its recommender, or the resolver of a grievance is the review's finalizer"

  # --- existence -------------------------------------------------------------
  - id: ERR_POSTDOC_NOT_FOUND
    http: 404
    condition: "the referenced postdoc id does not exist"
  - id: ERR_MENTOR_NOT_FOUND
    http: 404
    condition: "the referenced faculty mentor id does not exist"
  - id: ERR_FUNDING_SOURCE_NOT_FOUND
    http: 404
    condition: "the referenced funding source id does not exist"
  - id: ERR_LABORATORY_NOT_FOUND
    http: 404
    condition: "the referenced laboratory id does not exist"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "the referenced appointment id (path or predecessor_appointment_id) does not exist"
  - id: ERR_VISA_CASE_NOT_FOUND
    http: 404
    condition: "the referenced visa case id does not exist"
  - id: ERR_DEVELOPMENT_DOCUMENT_NOT_FOUND
    http: 404
    condition: "the referenced development document id does not exist"
  - id: ERR_EXPORT_REVIEW_NOT_FOUND
    http: 404
    condition: "the referenced export control review id does not exist"
  - id: ERR_LAB_GRANT_NOT_FOUND
    http: 404
    condition: "the referenced lab access grant id does not exist"
  - id: ERR_REAPPOINTMENT_REVIEW_NOT_FOUND
    http: 404
    condition: "the referenced reappointment review id does not exist"
  - id: ERR_GRIEVANCE_NOT_FOUND
    http: 404
    condition: "the referenced grievance id does not exist"
  - id: ERR_EXIT_RECORD_NOT_FOUND
    http: 404
    condition: "the referenced exit record id does not exist"

  # --- request shape ---------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required field is absent, an enum value is not a declared member, a date is not ISO-8601, a numeric field is negative, an end date is not after its start date, or bench_seats < 1"

  # --- state / concurrency ---------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the target resource's current state does not declare the requested trigger, including every attempt from a terminal state and every repeat of an already-applied trigger"
  - id: ERR_STALE_APPOINTMENT_VERSION
    http: 412
    condition: "expected_appointment_version does not equal the appointment's current version"
  - id: ERR_REVIEW_ALREADY_OPEN
    http: 409
    condition: "a reappointment review that is not in a terminal state already exists for the appointment"
  - id: ERR_EXIT_ALREADY_INITIATED
    http: 409
    condition: "an exit record already exists for the appointment"

  # --- research security (safety) -------------------------------------------
  - id: ERR_EXPORT_CONTROL_BLOCKED
    http: 422
    condition: "bench access requested while the appointment's compliance_status is BLOCKED or PENDING_REVIEW"
  - id: ERR_COMPLIANCE_RESTRICTION_VIOLATED
    http: 422
    condition: "a RESTRICTED appointment requests a BSL2/BSL3 laboratory or more than RESTRICTED_MAX_BENCH_SEATS seats"
  - id: ERR_LAB_CLOSED
    http: 409
    condition: "bench access requested in a laboratory whose status is CLOSED"

  # --- referential / configuration integrity --------------------------------
  - id: ERR_FUNDING_NOT_VERIFIED
    http: 422
    condition: "the offer's funding source is UNVERIFIED or SUSPENDED at issue time"
  - id: ERR_AWARD_EXPIRED
    http: 422
    condition: "verification attempted on an award whose award_end_date is before the logical clock date"
  - id: ERR_AWARD_TERM_NO_OVERLAP
    http: 422
    condition: "the appointment term and the award window share no inclusive day"
  - id: ERR_FUNDING_CLASS_MISMATCH
    http: 422
    condition: "employment_class FELLOWSHIP on a grant-type award, or EMPLOYEE on a fellowship-type award"
  - id: ERR_TITLE_CLASS_MISMATCH
    http: 422
    condition: "title_classification is inconsistent with employment_class"
  - id: ERR_MENTOR_TRAINING_LAPSED
    http: 422
    condition: "the mentor's mentor_training_valid_through precedes the appointment's term_start_date"
  - id: ERR_NO_ELIGIBLE_VISA_CATEGORY
    http: 422
    condition: "visa_category_selection produces an empty candidate set for a sponsorship-requiring scholar"

  # --- constraint ------------------------------------------------------------
  - id: ERR_RANK_YEARS_EXCEEDED
    http: 422
    condition: "cumulative_months_in_rank_at_end would exceed TOTAL_MONTHS_IN_RANK_CAP (60)"
  - id: ERR_TERM_LENGTH_INVALID
    http: 422
    condition: "term_months falls outside [12, 36] inclusive"
  - id: ERR_PREMIUM_TRACK_UNAVAILABLE
    http: 422
    condition: "PREMIUM processing requested for a category outside PREMIUM_ELIGIBLE_CATEGORIES"
  - id: ERR_RFE_ROUND_LIMIT_REACHED
    http: 409
    condition: "a further RFE would take rfe_round_count to RFE_ROUND_LIMIT (2) or beyond"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "a further RETURN would take revision_round to DOC_REVISION_LIMIT (3) or beyond"
  - id: ERR_DEVELOPMENT_DOCS_INCOMPLETE
    http: 422
    condition: "activation attempted while a funder-required mentoring plan or IDP is not APPROVED"
  - id: ERR_IDP_NOT_ACKNOWLEDGED
    http: 422
    condition: "an IDP approval is attempted while postdoc_acknowledged is false"
  - id: ERR_VISA_NOT_APPROVED
    http: 422
    condition: "activation attempted for a sponsorship-requiring scholar whose visa case is not APPROVED"
  - id: ERR_LAB_CAPACITY_EXCEEDED
    http: 409
    condition: "aggregate bench_seats on any day of the requested effective interval would exceed the laboratory's bench_capacity"
  - id: ERR_MENTOR_LOAD_EXCEEDED
    http: 409
    condition: "the mentor's active_postdoc_count already equals max_concurrent_postdocs at issue time"

  # --- temporal --------------------------------------------------------------
  - id: ERR_START_BEFORE_LAWFUL_DATE
    http: 422
    condition: "term_start_date precedes the visa case's earliest_lawful_start_date"
  - id: ERR_APPOINTMENT_TERM_OVERLAP
    http: 409
    condition: "the drafted term overlaps, including at a shared endpoint, another held appointment of the same scholar"
  - id: ERR_GRIEVANCE_WINDOW_CLOSED
    http: 422
    condition: "a grievance is filed after the review's grievance_window_end, or against a review whose grievance_window_end is null because it never reached FINALIZED_NON_RENEWED"
  - id: ERR_LAB_BUFFER_CONFLICT
    http: 409
    condition: "the requested grant's decontamination-buffered leading edge collides with an incumbent grant that would otherwise be disjoint"

  # --- fiscal ----------------------------------------------------------------
  - id: ERR_SALARY_BELOW_FLOOR
    http: 422
    condition: "annual_salary_usd is below the effective salary floor at issue time"
  - id: ERR_EXCEPTION_FLOOR_INVALID
    http: 422
    condition: "exception_floor_usd is below ABSOLUTE_STIPEND_FLOOR_USD or is not below the computed salary_floor_usd"
  - id: ERR_FUNDING_BUDGET_EXCEEDED
    http: 422
    condition: "the new or recomputed encumbrance would drive FundingSource.encumbered_usd above annual_budget_usd"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
# role_model: segregation_of_duties — three separations are enforced by
# ERR_SEGREGATION_OF_DUTIES: preparer != salary-exception approver,
# recommender != finalizer, finalizer != grievance resolver. All three sit
# inside PostdocAffairsOfficer / HRCompensationApprover, so the separation is on
# X-User-ID, not on role.

roles:

  - name: PostdocAffairsOfficer
    description: "Postdoctoral affairs office operator: drafts appointments, issues offers, activates and withdraws, reviews development documents, opens and finalizes reappointment reviews, resolves grievances, and initiates exit processing."
    identity: "opaque"
    exclusive_operations:
      - "POST /postdocs"
      - "POST /faculty-mentors"
      - "POST /funding-sources"
      - "POST /laboratories"
      - "POST /appointments"
      - "POST /appointments/{id}/issue-offer"
      - "POST /appointments/{id}/activate"
      - "POST /appointments/{id}/withdraw"
      - "POST /development-documents/{id}/review"
      - "POST /appointments/{id}/reappointment-reviews"
      - "POST /reappointment-reviews/{id}/finalize"
      - "POST /grievances/{id}/resolution"
      - "POST /appointments/{id}/exit"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: HRCompensationApprover
    description: "Human resources compensation authority: verifies and suspends awards and approves salary-minimum exceptions. Never prepares an appointment."
    identity: "opaque"
    exclusive_operations:
      - "POST /funding-sources/{id}/verification"
      - "POST /appointments/{id}/salary-exception"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: ExportControlReviewer
    description: "Research security and export control officer: records screening findings, which drive the appointment's compliance_status dimension."
    identity: "opaque"
    exclusive_operations:
      - "POST /export-control-reviews/{id}/decision"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: InternationalScholarAdvisor
    description: "International scholar services advisor: files and re-files petitions and records adjudications."
    identity: "opaque"
    exclusive_operations:
      - "POST /visa-cases/{id}/submit-petition"
      - "POST /visa-cases/{id}/adjudication"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: FacultyMentor
    description: "The faculty mentor of record. Submits development documents, requests bench access, and records the reappointment recommendation — only for appointments whose mentor_id equals X-User-ID."
    identity: "entity_backed:FacultyMentor"
    exclusive_operations:
      - "POST /development-documents/{id}/submit"
      - "POST /lab-access-grants"
      - "POST /reappointment-reviews/{id}/recommendation"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"

  - name: Postdoc
    description: "The postdoctoral scholar. Accepts the offer, acknowledges development documents, files grievances and signs the IP assignment — only for appointments whose postdoc_id equals X-User-ID."
    identity: "entity_backed:Postdoc"
    exclusive_operations:
      - "POST /appointments/{id}/accept-offer"
      - "POST /development-documents/{id}/acknowledge"
      - "POST /grievances"
      - "POST /exit-records/{id}/ip-assignment"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
