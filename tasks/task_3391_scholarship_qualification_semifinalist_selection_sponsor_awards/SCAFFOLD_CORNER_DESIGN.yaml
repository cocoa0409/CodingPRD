        grounds: ["validations[priority=1]", "validations[priority=4]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 1 auth beats priority 4 existence: a headerless GET on a nonexistent entry id returns 401 ERR_UNAUTHENTICATED, never 404 — auth precedes resource lookup."
        test_recipe:
          setup:
            - "A cycle exists; the probed entry id does not."
          setup_api_calls:
            - call: "POST /api/program-cycles"
              payload: { name: "CYC-V1", target_graduation_year: 2028, total_semifinalist_slots: 5, national_award_slots: 0, national_award_amount_cents: 250000, confirming_floor: 200, application_deadline: "2027-12-15T00:00:00Z", semifinalist_embargo_until: "2027-09-10T00:00:00Z", finalist_embargo_until: "2028-02-10T00:00:00Z", award_embargo_until: "2028-03-01T00:00:00Z", public_embargo_until: "2028-03-01T00:00:00Z", state_populations: [ { state_code: "ZZ", graduating_population: 10000 } ] }
              as: ProgramAdmin
          trigger:
            - call: "GET /api/entries/11111111-2222-4333-8444-555555555555"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHENTICATED with HTTP 401 (the harness sends no X-User-Role / X-User-ID headers)"

