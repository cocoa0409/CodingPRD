  - method: GET
    path: "/enrichment/instructors/{id}"
    description: "Fetch an instructor."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
    input: []
    output: Instructor
    side_effects: []
  - method: GET
    path: "/enrichment/instructors/{id}/sessions"
    description: "List sessions assigned to an instructor (FK reverse-reachability for ClassSession.instructor_id)."
    roles: [StudioAdmin, FrontDeskStaff, Parent]
    code: 200
