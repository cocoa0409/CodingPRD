              as: PlatformAdmin
              captures: { lot: $.data.id }
            - call: "POST /cgm/payers"
              payload: { name: "PYB", plan_code: "PB", benefit_route: "PHARMACY", cgm_coverage_policy: "STANDARD", pharmacy_copay_pct: 0.20, dme_coinsurance_pct: 0.0, deductible_cap_cents: 0 }
              as: PlatformAdmin
              captures: { py: $.data.id }
            - call: "POST /cgm/patients/${pt}/prescriptions"
              payload: { prescriber_id: "${dr}", product_id: "${prod}", diagnosis_code: "E11.9", insulin_use: "INTENSIVE", documentation_attached: true, quantity_per_fill: 2, fills_authorized: 12, written_on: "2026-08-15", expected_patient_version: "${pt_v}" }
              as: Prescriber
              as_user_id: "${dr}"
              captures: { rx: $.data.id }
            - call: "POST /cgm/prescriptions/${rx}/coverage-verifications"
              payload: { payer_id: "${py}" }
              as: CoverageReviewer
              captures: { cv: $.data.id }
            - call: "POST /cgm/coverage-verifications/${cv}/decide"
              payload: { decision: "APPROVED" }
              as: CoverageReviewer
            - call: "POST /cgm/patients/${pt}/sensor-orders"
              payload: { prescription_id: "${rx}", coverage_verification_id: "${cv}", lot_id: "${lot}", quantity: 2 }
              as: FulfillmentAgent
              captures: { ord1: $.data.id, ord1_v: $.data.version }
            - call: "POST /cgm/sensor-orders/${ord1}/adjudicate"
              payload: { expected_order_version: "${ord1_v}" }
              as: BillingAgent
