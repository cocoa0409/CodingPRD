      - name: refund_eligibility_is_read_from_the_term_and_the_frozen_policy_snapshot
        claim_type: Violation → Error
        grounds:
          - validations[priority=52]
          - validations[priority=54]
          - entities.CancellationOrder.fields.refund_policy_snapshot
        distinguishing_aspect: |
          A refund claim needs both a SubscriptionTerm (ERR_SUBSCRIPTION_TERM_MISSING) and a
          non-NONE refund_policy_snapshot (ERR_REFUND_NOT_OFFERED), and the snapshot is frozen when the
          order is created: PATCHing the platform's refund_policy from NONE to PRORATA_DAILY afterwards
          still yields ERR_REFUND_NOT_OFFERED, while supplying the missing term makes the first order's
          claim succeed.
        test_recipe:
          setup:
            - "platform P1 with refund_policy PRORATA_DAILY and platform P2 with refund_policy NONE"
            - "one Estate at DISCLOSURE with asset s1 on P1 (no SubscriptionTerm) and asset s2 on P2 (a term 2026-01-01..2026-12-31 at 11999)"
            - "both auto-created CancellationOrders driven to CONFIRMED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "StreamOne", platform_type: "SUBSCRIPTION", form_code: "S1-FORM", review_window_days: 14, refund_policy: "PRORATA_DAILY", supports_online_tool: true, supports_transfer: false, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: true, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /platforms"
              payload: { name: "StreamTwo", platform_type: "SUBSCRIPTION", form_code: "S2-FORM", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: false, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: true, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-C34" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-C34" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-C34", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-C34", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/digital-assets"
              payload: { platform_id: "${p1_id}", category: "SUBSCRIPTION", account_handle: "s1", quoted_value_cents: 0 }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_s1_id: $.data.id }
            - call: "POST /estates/${est_id}/digital-assets"
