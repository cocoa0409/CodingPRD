          trigger:
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-DP-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 30000, dimension_weight_grams: 30000 }
              as: SortOperator
              captures: { err_dup: $.data.error_id }
            - call: "POST /airhub/hubs/${hub_id}/declare-contingency"
              payload: {}
              as: WeatherOfficer
            - call: "POST /airhub/packages/${pkg_dp}/diverge"
              payload: {}
              as: CommitmentController
              captures: { diverged: $.data.commitment_status }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-DP-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 30000, dimension_weight_grams: 30000 }
              as: SortOperator
              captures: { reused_id: $.data.id }
          assert:
            - "the reuse while the original is live returns 409 with ${err_dup} == ERR_DUPLICATE_LIVE_PACKAGE"
            - "the original then diverts to ${diverged} == REROUTED"
            - "after the diversion the same tracking number is accepted and yields a NEW row ${reused_id} != ${pkg_dp}"
            - "GET /airhub/packages?hub_id=${hub_id} returns 2 rows, one REROUTED and one COMMITTED"

      - name: err_invalid_request_for_an_out_of_enum_commodity_class
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Package.fields.commodity_class
        distinguishing_aspect: "commodity_class is a closed four-member enum, so DRY_ICE is rejected with ERR_INVALID_REQUEST and never reaches the routing or lane-capability logic."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, lane P-01, BANK_A with N701UP landed and unloaded, shift N-A."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
          trigger:
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-CM-0001", commodity_class: "DRY_ICE", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and ${err} == ERR_INVALID_REQUEST"
            - "GET /airhub/packages?hub_id=${hub_id} returns 0 rows"
            - "the rejected value differs from all four declared members GENERAL, IRREGULAR, HAZMAT and PERISHABLE"

      - name: err_hazmat_cap_exceeded_reachable_when_the_buildup_declares_a_positive_cap
        claim_type: error_triggerable
        grounds:
          - errors[ERR_HAZMAT_CAP_EXCEEDED]
          - endpoints.POST_/airhub/moves/{move_id}/load-package
        distinguishing_aspect: "A positive hazardous cap makes the error reachable at any weight above it, so a buildup declaring 10000 grams refuses a 20000-gram HAZMAT package even though it would have admitted a GENERAL one."
        test_recipe:
          setup:
            - "Clock 1450. SDF hub, lane P-01 (GENERAL, capacity 400000), HAZMAT lane HZ-01 (capacity 400000, certified_until 1560), SECONDARY S-01 (capacity 400000), BANK_A with N701UP landed and unloaded, N702UP the move aircraft, shift N-A, load move M with a destination buildup G of container 200000 and hazardous_cap_grams 10000, and one 20000-gram HAZMAT package inducted, routed to the hazmat lane and secondary-sorted."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 400000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "S-01", lane_kind: "SECONDARY", commodity_capability: "GENERAL", capacity_weight_grams: 400000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1600 }
              as: SortSupervisor
              captures: { lane_s1_id: $.data.id }
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "HZ-01", lane_kind: "HAZMAT", commodity_capability: "HAZMAT", capacity_weight_grams: 400000, certified_until_minutes: 1560, turnout_start_minutes: 1400, turnout_end_minutes: 1600 }
              as: SortSupervisor
              captures: { lane_hz1_id: $.data.id }
            - *c_bank
            - *c_ac1
            - *c_ac2
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/moves"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac2_id}", weight_limit_grams: 400000 }
              as: LoadPlanner
              captures: { move_id: $.data.id, move_v0: $.data.version }
            - call: "POST /airhub/buildups"
              payload: { hub_id: "${hub_id}", load_move_id: "${move_id}", destination_gateway_code: "LAX", container_limit_grams: 200000, hazardous_cap_grams: 10000, requires_container: false }
              as: LoadPlanner
              captures: { bd_id: $.data.id }
            - call: "POST /airhub/moves/${move_id}/plan-load"
              payload: {}
              as: LoadPlanner
              captures: { move_v1: $.data.version }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-HP-0001", commodity_class: "HAZMAT", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_hp: $.data.id }
            - call: "POST /airhub/packages/${pkg_hp}/induct"
              payload: { dimension_weight_grams: 20000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_hp}/route-hazmat"
              payload: { lane_id: "${lane_hz1_id}" }
              as: HazmatCertifier
            - call: "POST /airhub/packages/${pkg_hp}/primary-sort"
              payload: { lane_id: "${lane_hz1_id}" }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_hp}/secondary-sort"
              payload: { lane_id: "${lane_s1_id}" }
              as: SortOperator
              captures: { pkg_hp_v: $.data.version }
            - call: "POST /airhub/moves/${move_id}/assign-buildup"
              payload: { package_id: "${pkg_hp}", buildup_id: "${bd_id}" }
              as: LoadPlanner
          trigger:
            - call: "POST /airhub/moves/${move_id}/load-package"
              payload: { package_id: "${pkg_hp}", expected_load_move_version: "${move_v1}", expected_package_version: "${pkg_hp_v}" }
              as: LoadPlanner
              captures: { err_cap: $.data.error_id }
          assert:
            - "the response status is 409 and ${err_cap} == ERR_HAZMAT_CAP_EXCEEDED"
            - "Buildup.${bd_id}.hazardous_cap_grams == 10000 and the package would add 20000, so the cap is breached"
            - "the buildup's container limit of 200000 is far from binding, so only the hazardous cap failed"
            - "Package.${pkg_hp}.sort_status is still SECONDARY_SORTED and Buildup.${bd_id}.hazardous_load == false"

      - name: err_same_errors_under_a_different_priority_pair
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_STATE]
          - errors[ERR_POSTURE_BLOCKS_INDUCTION]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / posture_safety_block_beats_aircraft_state_conflict
          rationale: "Both errors are asserted together as the losing and winning halves of the named §1.8 priority instance."

  # ===========================================================================
  - section: rbac
    instances:

      - name: onboarding_channel_cannot_create_a_hub
        claim_type: peer_role_exclusivity
        grounds:
          - roles[GatewayCoordinator]
          - roles[HubOpsManager]
          - endpoints.POST_/airhub/hubs
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Peer-role exclusivity: a GatewayCoordinator is a declared role and passes authentication, but hub creation is a HubOpsManager exclusive, so the same body that succeeds for the manager is a 403 for the coordinator."
        test_recipe:
          setup:
            - "Clock 1400. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /airhub/hubs"
              payload: { iata_code: "SDF", name: "Worldport Louisville", sort_window_open_minutes: 1380, sort_window_close_minutes: 1560 }
              as: GatewayCoordinator
              captures: { err_role: $.data.error_id }
            - call: "POST /airhub/hubs"
              payload: { iata_code: "SDF", name: "Worldport Louisville", sort_window_open_minutes: 1380, sort_window_close_minutes: 1560 }
              as: HubOpsManager
              captures: { hub_id: $.data.id }
          assert:
            - "the coordinator's attempt returns 403 with ${err_role} == ERR_UNAUTHORIZED"
            - "${err_role} != ERR_UNAUTHENTICATED, so the role was recognised and merely not permitted"
            - "no hub was created by the refused attempt: the manager's call then reports version 1"
            - "GET /airhub/hubs returns exactly 1 row"

      - name: sort_operator_cannot_declare_a_contingency
        claim_type: peer_role_exclusivity
        grounds:
          - roles[SortOperator]
          - roles[WeatherOfficer]
          - endpoints.POST_/airhub/hubs/{hub_id}/declare-contingency
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The contingency authority is exclusive to WeatherOfficer, so a SortOperator who can legitimately read the hub is refused the posture change with ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub exists with alternate IND; BANK_A with N701UP landed and unloaded, shift N-A."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_bank
            - *c_ac1
            - *c_shift
          trigger:
            - call: "POST /airhub/hubs/${hub_id}/declare-contingency"
              payload: {}
              as: SortOperator
              captures: { err_role: $.data.error_id }
            - call: "POST /airhub/hubs/${hub_id}/declare-contingency"
              payload: {}
              as: WeatherOfficer
              captures: { posture: $.data.posture }
          assert:
            - "the operator's attempt returns 403 with ${err_role} == ERR_UNAUTHORIZED"
            - "Hub.${hub_id}.contingency_mode is still false and posture is OPEN"
            - "the weather officer's attempt succeeds with ${posture} == LOCKDOWN"
            - "the same operator may still GET the hub, so the refusal is operation-specific and not a blanket denial"

      - name: missing_role_header_returns_unauthenticated
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints.GET_/airhub/hubs/{hub_id}
        distinguishing_aspect: "Authentication is checked before authorization and before existence, so a request carrying no X-User-Role at all is a 401 even when the path resource does not exist."
        test_recipe:
          setup:
            - "Clock 1400. No hub has been created."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /airhub/hubs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HubOpsManager
              captures: { err_authed: $.data.error_id }
          assert:
            - "with a declared role the request returns 404 with ${err_authed} == ERR_RESOURCE_NOT_FOUND, so authentication passed and the existence check bit"
            - "the authentication rule is declared at priority 1 and the existence rule at priority 3, so a request lacking a role would return 401 rather than this 404"
            - "response_type is error and data carries error_id and message"

      - name: readonly_roles_share_every_listing_endpoint
        claim_type: shared_operations
        grounds:
          - roles[RefundAdjuster]
          - roles[SortSupervisor]
          - endpoints.GET_/airhub/failures
          - endpoints.GET_/airhub/shifts
        distinguishing_aspect: "The listing surface is genuinely shared: a RefundAdjuster may read labor shifts and a SortSupervisor may read service failures, so read access does not follow the peer-role ownership boundaries."
        test_recipe:
          setup:
            - "Clock 1500. SDF hub, lane P-01, BANK_A with N701UP landed and unloaded, shift N-A, and one GENERAL package carrying a failure."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-SH-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_sh: $.data.id }
            - call: "POST /airhub/failures"
              payload: { hub_id: "${hub_id}", package_id: "${pkg_sh}", cause_code: "SORT_MISS", failure_minutes: 1500 }
              as: RefundAdjuster
              captures: { fail_sh: $.data.id }
          trigger:
            - call: "GET /airhub/shifts"
              payload: { hub_id: "${hub_id}" }
              as: RefundAdjuster
              captures: { shifts_seen: "$.data[0].id" }
            - call: "GET /airhub/failures"
              payload: { hub_id: "${hub_id}" }
              as: SortSupervisor
              captures: { failures_seen: "$.data[0].id" }
          assert:
            - "the refund adjuster reads LaborShift.${shifts_seen} == LaborShift.${shift_id}"
            - "the sort supervisor reads ServiceFailure.${failures_seen} == ServiceFailure.${fail_sh}"
            - "neither cross-read is refused, confirming the shared listing surface"
            - "creating a failure is still exclusive: the same route with as: SortSupervisor is refused"

      - name: hub_ops_manager_cannot_onboard_a_package
        claim_type: peer_role_exclusivity
        grounds:
          - roles[HubOpsManager]
          - roles[SortOperator]
          - endpoints.POST_/airhub/packages
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The override-bearing HubOpsManager role is still a peer rather than a superset: despite holding contingency and ground-stop authority it cannot induct volume, which is a SortOperator exclusive."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub with alternate IND, BANK_A with N701UP landed and unloaded, shift N-A."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
          trigger:
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-HO-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: HubOpsManager
              captures: { err_role: $.data.error_id }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-HO-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_ho: $.data.id }
          assert:
            - "the hub ops manager's attempt returns 403 with ${err_role} == ERR_UNAUTHORIZED"
            - "the sort operator's identical body succeeds and yields ${pkg_ho}"
            - "GET /airhub/packages?hub_id=${hub_id} returns exactly 1 row"
            - "Hub.${hub_id}.live_planned_package_total == 20000"

      - name: load_planner_cannot_force_a_posture
        claim_type: peer_role_exclusivity
        grounds:
          - roles[LoadPlanner]
          - endpoints.POST_/airhub/hubs/{hub_id}/volume-override
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The volume override is a HubOpsManager exclusive and is not reachable by LoadPlanner or SortSupervisor, so no operational peer can move posture by declaration."
        test_recipe:
          setup:
            - "Clock 1400. SDF hub, lane P-01, BANK_A with N701UP landed and unloaded, shift N-A."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - *c_lane_p1
            - *c_bank
            - *c_ac1
            - *c_shift
          trigger:
            - call: "POST /airhub/hubs/${hub_id}/volume-override"
              payload: { live_planned_package_total: 400000 }
              as: LoadPlanner
              captures: { err_role: $.data.error_id }
            - call: "POST /airhub/hubs/${hub_id}/volume-override"
              payload: { live_planned_package_total: 400000 }
              as: HubOpsManager
              captures: { posture: $.data.posture }
          assert:
            - "the planner's attempt returns 403 with ${err_role} == ERR_UNAUTHORIZED"
            - "Hub.${hub_id}.posture is still OPEN at that point"
            - "the manager's attempt succeeds and reports ${posture} == CONGESTED"
            - "the refused attempt did not alter live_planned_package_total, which remained 0"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: optimistic_concurrency_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[load-package-stale-move]
          - entities.LoadMove.fields.version
          - endpoints.POST_/airhub/moves/{move_id}/load-package
        distinguishing_aspect: "The parent's version is a real mutation counter: each package onboarding through the OCC-guarded endpoint advances LoadMove.version by exactly one, so a request carrying the immediately-prior version is stale while one carrying the captured version succeeds."
        test_recipe:
          setup:
            - "Clock 1450. SDF hub, lane P-01 and S-01 (capacity 400000), BANK_A with N701UP landed and unloaded, N702UP the move aircraft, shift N-A, load move M (weight_limit 400000), and one 20000-gram GENERAL package inducted and secondary-sorted."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 400000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "S-01", lane_kind: "SECONDARY", commodity_capability: "GENERAL", capacity_weight_grams: 400000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1600 }
              as: SortSupervisor
              captures: { lane_s1_id: $.data.id }
            - *c_bank
            - *c_ac1
            - *c_ac2
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/moves"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac2_id}", weight_limit_grams: 400000 }
              as: LoadPlanner
              captures: { move_id: $.data.id, move_v_create: $.data.version }
            - call: "POST /airhub/moves/${move_id}/plan-load"
              payload: {}
              as: LoadPlanner
              captures: { move_v_plan: $.data.version }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-OV-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_ov: $.data.id }
            - call: "POST /airhub/packages/${pkg_ov}/induct"
              payload: { dimension_weight_grams: 20000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_ov}/primary-sort"
              payload: { lane_id: "${lane_p1_id}" }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_ov}/secondary-sort"
              payload: { lane_id: "${lane_s1_id}" }
              as: SortOperator
              captures: { pkg_ov_v: $.data.version }
          trigger:
            - call: "POST /airhub/moves/${move_id}/load-package"
              payload: { package_id: "${pkg_ov}", expected_load_move_version: "${move_v_create}", expected_package_version: "${pkg_ov_v}" }
              as: LoadPlanner
              captures: { err_stale: $.data.error_id }
            - call: "POST /airhub/moves/${move_id}/load-package"
              payload: { package_id: "${pkg_ov}", expected_load_move_version: "${move_v_plan}", expected_package_version: "${pkg_ov_v}" }
              as: LoadPlanner
              captures: { move_v_after: $.data.version }
          assert:
            - "the move version advanced from ${move_v_create} at creation to ${move_v_plan} after plan-load"
            - "the request carrying the creation version is refused with 412 and ${err_stale} == ERR_STALE_VERSION"
            - "the request carrying ${move_v_plan} succeeds and the response reports version ${move_v_after} == ${move_v_plan} + 1"
            - "LoadMove.${move_id}.version advanced by exactly one across the successful onboarding"
            - "LoadMove.${move_id}.loaded_weight_grams == 20000"

      - name: derived_field_reconciliation_computed_fields_survive_a_mutation_reversal
        claim_type: derived_field_reconciliation
        grounds:
          - entities.LoadMove.fields.planned_weight_grams
          - entities.LoadMove.fields.loaded_weight_grams
          - entities.LoadMove.fields.forward_capacity_grams
          - endpoints.POST_/airhub/moves/{move_id}/unload-package
        distinguishing_aspect: "The three derived move fields reconcile back to their pre-sequence values after a load-then-unload reversal, with no stale denormalisation, while the stored version and the count of loaded packages both move."
        test_recipe:
          setup:
            - "Clock 1450. SDF hub, lane P-01 and S-01 (capacity 400000), BANK_A with N701UP landed and unloaded, N702UP the move aircraft, shift N-A, load move M (weight_limit 400000), and one 30000-gram GENERAL package inducted and secondary-sorted."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 400000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "S-01", lane_kind: "SECONDARY", commodity_capability: "GENERAL", capacity_weight_grams: 400000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1600 }
              as: SortSupervisor
              captures: { lane_s1_id: $.data.id }
            - *c_bank
            - *c_ac1
            - *c_ac2
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/moves"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac2_id}", weight_limit_grams: 400000 }
              as: LoadPlanner
              captures: { move_id: $.data.id }
            - call: "POST /airhub/moves/${move_id}/plan-load"
              payload: {}
              as: LoadPlanner
              captures: { move_v1: $.data.version }
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-DR-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 30000, dimension_weight_grams: 30000 }
              as: SortOperator
              captures: { pkg_dr: $.data.id }
            - call: "POST /airhub/packages/${pkg_dr}/induct"
              payload: { dimension_weight_grams: 30000 }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_dr}/primary-sort"
              payload: { lane_id: "${lane_p1_id}" }
              as: SortOperator
            - call: "POST /airhub/packages/${pkg_dr}/secondary-sort"
              payload: { lane_id: "${lane_s1_id}" }
              as: SortOperator
              captures: { pkg_dr_v: $.data.version }
            - call: "GET /airhub/moves/${move_id}"
              payload: {}
              as: LoadPlanner
              captures: { planned_before: $.data.planned_weight_grams, loaded_before: $.data.loaded_weight_grams, cap_before: $.data.forward_capacity_grams }
          trigger:
            - call: "POST /airhub/moves/${move_id}/load-package"
              payload: { package_id: "${pkg_dr}", expected_load_move_version: "${move_v1}", expected_package_version: "${pkg_dr_v}" }
              as: LoadPlanner
              captures: { move_v2: $.data.version }
            - call: "GET /airhub/moves/${move_id}"
              payload: {}
              as: LoadPlanner
              captures: { planned_loaded: $.data.planned_weight_grams, loaded_loaded: $.data.loaded_weight_grams, cap_loaded: $.data.forward_capacity_grams }
            - call: "POST /airhub/moves/${move_id}/unload-package"
              payload: { package_id: "${pkg_dr}" }
              as: LoadPlanner
            - call: "GET /airhub/moves/${move_id}"
              payload: {}
              as: LoadPlanner
              captures: { planned_after: $.data.planned_weight_grams, loaded_after: $.data.loaded_weight_grams, cap_after: $.data.forward_capacity_grams }
          assert:
            - "before onboarding the move reads planned ${planned_before} == 0, loaded ${loaded_before} == 0 and capacity ${cap_before} == 400000"
            - "while loaded it reads planned ${planned_loaded} == 30000, loaded ${loaded_loaded} == 30000 and capacity ${cap_loaded} == 370000"
            - "after the reversal it reads planned ${planned_after} == ${planned_before}, loaded ${loaded_after} == ${loaded_before} and capacity ${cap_after} == ${cap_before}"
            - "LoadMove.${move_id}.version is still advanced, so the reversal updated the row rather than skipping it"
            - "the derived fields show no drift because every one is recomputed from the row set rather than adjusted in place"

      - name: cascading_side_effects_cancel_returns_loose_packages_to_secondary_sort
        claim_type: cascading_side_effects
        grounds:
          - state_machines.LoadMove.transitions.PLANNED_to_REWORK_REQUIRED
          - endpoints.POST_/airhub/hubs/{hub_id}/ground-stop
        excluded_because:
          difficulty_instance: non_linear_state_machine / sort_lane_branching_reopen_saturation_fork_join
          rationale: "The multi-entity cascade on REWORK_REQUIRED is asserted by the named §1.8 instance and by the rework corner instance above."

      - name: selector_policy_sort_lane_capability_filter
        claim_type: selector_policy
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - entities.SortLane.fields.commodity_capability
          - endpoints.POST_/airhub/packages/{package_id}/primary-sort
        distinguishing_aspect: "Lane selection is never inferred: the caller must supply lane_id and the server enforces the eligibility predicate (lane AVAILABLE, capability equal to the package's class, certified at the current minute), so an ineligible lane is an error rather than a silent substitution."
        test_recipe:
          setup:
            - "Clock 1410. SDF hub, lane P-01 (GENERAL, capacity 60000) and lane HZ-01 (HAZMAT, certified_until 1560), BANK_A with N701UP landed and unloaded, shift N-A, and one GENERAL package inducted."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "HZ-01", lane_kind: "HAZMAT", commodity_capability: "HAZMAT", capacity_weight_grams: 40000, certified_until_minutes: 1560, turnout_start_minutes: 1400, turnout_end_minutes: 1600 }
              as: SortSupervisor
              captures: { lane_hz1_id: $.data.id }
            - *c_bank
            - *c_ac1
            - *c_shift
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac1_id}", tracking_number: "1Z-SL-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { pkg_sl: $.data.id }
            - call: "POST /airhub/packages/${pkg_sl}/induct"
              payload: { dimension_weight_grams: 20000 }
              as: SortOperator
          trigger:
            - call: "POST /airhub/packages/${pkg_sl}/primary-sort"
              payload: { lane_id: "${lane_hz1_id}" }
              as: SortOperator
              captures: { err_capability: $.data.error_id }
            - call: "POST /airhub/packages/${pkg_sl}/primary-sort"
              payload: { lane_id: "${lane_p1_id}" }
              as: SortOperator
              captures: { lane_used: $.data.assigned_lane_id }
          assert:
            - "the ineligible lane is refused with ${err_capability} == ERR_LANE_NOT_AVAILABLE"
            - "Package.${pkg_sl}.assigned_lane_id is null after the refusal, so no lane was silently substituted"
            - "the eligible lane succeeds and the package reports assigned_lane_id ${lane_used} == ${lane_p1_id}"
            - "the eligibility predicate is lane availability AND capability equality AND current minute strictly before certified_until_minutes"
            - "there is no ranking or tie-break to exercise, because the caller names the lane rather than the server choosing one"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: all_effects_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/airhub/packages/{package_id}/upgrade-hold
          - calculations.live_planned_package_total
        distinguishing_aspect: "The consistency model is immediate, so every cascaded field is already updated inside the mutating response envelope itself rather than on a later read."
        test_recipe:
          setup:
            - "Clock 1600. SDF hub with alternate IND, lane P-01, BANK_A with N701UP landed and unloaded and N702UP landed then cancelled, shift N-B, package U aboard N702UP."
          setup_api_calls:
            - *c_clock
            - *c_alt
            - *c_hub
            - call: "POST /airhub/lanes"
              payload: { hub_id: "${hub_id}", lane_code: "P-01", lane_kind: "PRIMARY", commodity_capability: "GENERAL", capacity_weight_grams: 60000, certified_until_minutes: 1700, turnout_start_minutes: 1400, turnout_end_minutes: 1500 }
              as: SortSupervisor
              captures: { lane_p1_id: $.data.id }
            - *c_bank
            - *c_ac1
            - *c_ac2
            - call: "POST /airhub/shifts"
              payload: { hub_id: "${hub_id}", shift_code: "N-B", start_minutes: 1380, end_minutes: 1630, headcount: 64, productivity_grams_per_operator_hour: 4200, forecast_volume_grams: 380000, certified_for_hazmat: true }
              as: SortSupervisor
              captures: { shift_id: $.data.id }
            - *c_clock1400
            - *c_ac1_depart
            - *c_ac1_land
            - *c_bank_unload
            - *c_ac1_begun
            - *c_ac1_done
            - call: "POST /airhub/aircraft/${ac2_id}/depart-origin"
              payload: {}
              as: GatewayCoordinator
            - call: "POST /airhub/aircraft/${ac2_id}/land"
              payload: { inbound_weight_grams: 40000 }
              as: GatewayCoordinator
            - call: "POST /airhub/aircraft/${ac2_id}/begin-unload"
              payload: {}
              as: SortSupervisor
            - call: "POST /airhub/aircraft/${ac2_id}/complete-unload"
              payload: { unload_completed_minutes: 1401 }
              as: SortSupervisor
            - call: "POST /airhub/packages"
              payload: { hub_id: "${hub_id}", aircraft_id: "${ac2_id}", tracking_number: "1Z-IM-0001", commodity_class: "GENERAL", destination_hub_code: "ORD", service_level: "NEXT_DAY_AIR", planned_weight_grams: 40000, dimension_weight_grams: 40000 }
              as: SortOperator
              captures: { pkg_im: $.data.id }
            - call: "GET /airhub/hubs/${hub_id}"
              payload: {}
              as: HubOpsManager
              captures: { total_pre: $.data.live_planned_package_total }
            - call: "POST /airhub/aircraft/${ac2_id}/cancel"
              payload: { cause_code: "MECHANICAL" }
              as: HubOpsManager
          trigger:
            - call: "POST /airhub/packages/${pkg_im}/clear-upgrade-hold"
              payload: {}
              as: CommitmentController
              captures: { mutation_status: $.data.commitment_status, mutation_handling: $.data.handling_status, mutation_sort: $.data.sort_status, mutation_final: $.data.final_commitment_minutes }
            - call: "GET /airhub/hubs/${hub_id}"
              payload: {}
              as: HubOpsManager
              captures: { total_after: $.data.live_planned_package_total, posture_after: $.data.posture }
          assert:
            - "the cancelling transition had already dropped the live total to 0 before the mutation, captured as ${total_pre}"
            - "the mutation response itself carries the whole post-state: ${mutation_status} == COMMITTED, ${mutation_handling} == NORMAL, ${mutation_sort} == UNSORTED and ${mutation_final} is null"
            - "an immediate read then agrees with the response: ${total_after} == 40000 and ${posture_after} == OPEN"
            - "no field lags and no re-read is needed, because response_type is object and the envelope carries the updated entity"
            - "the cascaded refusal of the package during the hold is what the earlier cancel produced, and clearing the hold re-exposes the package at once"
