              captures: { vendor_id: "$.data.id" }
            - call: "POST /dso/practices"
              payload: { affiliation_id: "${aff_id}", conversion_vendor_id: "${vendor_id}", name: "Elm Street Dental", state_code: "IL", charts_total_expected: 5000 }
              as: DsoIntegrationLead
              captures: { prac_id: "$.data.id" }
          trigger:
            - call: "POST /dso/affiliations/${aff_id}/advance-diligence"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/affiliations/${aff_id}/reprice"
              payload: { purchase_price_cents: 430000000, earnout_pool_cents: 95000000, reprice_note: "hygiene revenue restated" }
              as: DsoDealCounsel
            - call: "POST /dso/affiliations/${aff_id}/advance-diligence"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/affiliations/${aff_id}/reprice"
              payload: { purchase_price_cents: 415000000, earnout_pool_cents: 100000000, reprice_note: "second quality-of-earnings pass" }
              as: DsoDealCounsel
            - call: "POST /dso/affiliations/${aff_id}/advance-diligence"
              payload: {}
              as: DsoDealCounsel
            - call: "POST /dso/affiliations/${aff_id}/reprice"
              payload: { purchase_price_cents: 400000000, earnout_pool_cents: 105000000, reprice_note: "third attempt must be refused" }
              as: DsoDealCounsel
              captures: { err: "$.data.error_id" }
          assert:
            - "After the first reprice: Affiliation.${aff_id}.status == DRAFT, repricing_round == 1, purchase_price_cents == 430000000, earnout_pool_cents == 95000000, earnout_unallocated_cents == 95000000"
            - "After the second reprice: Affiliation.${aff_id}.status == DRAFT, repricing_round == 2, purchase_price_cents == 415000000, earnout_pool_cents == 100000000, earnout_unallocated_cents == 100000000"
            - "The third reprice returns HTTP 422 with error_id == ERR_REPRICING_LIMIT_REACHED"
            - "Affiliation.${aff_id}.status == DILIGENCE after the refusal (unchanged by the failed call)"
            - "Affiliation.${aff_id}.repricing_round == 2 and purchase_price_cents == 415000000 and earnout_pool_cents == 100000000 (no partial write)"

