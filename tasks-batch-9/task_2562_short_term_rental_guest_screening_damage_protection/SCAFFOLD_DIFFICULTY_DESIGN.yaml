      - name: overturned_approval_restores_deposit_hold_exactly
        grounds:
          - state_machines.Reservation.deposit_state.APPLIED_to_HELD
          - state_machines.DamageClaim.APPEALED_to_DENIED
          - entities.Guest.fields.deposit_held_cents
          - calculations.claim_recovery
        distinguishing_aspect: |
          Conserved quantity: the GUEST'S DEPOSIT ESCROW (Reservation.deposit_hold_cents
          minus deposit_applied_cents, mirrored in Guest.deposit_held_cents) — a different
          conserved quantity from the insurance capacity instance above, restored through a
          different mechanism (a deposit_state transition APPLIED -> HELD, with no allocation
          rows involved at all because this listing has no coverage layer). Approving 60000
          consumes the whole 50000 hold and leaves 10000 uncovered; the overturn must put
          exactly 50000 back, not the 60000 approved figure and not a partial refund.
        test_recipe:
          setup:
            - "Logical clock stepped 2026-08-01 -> 2026-08-10T16:00Z -> 2026-08-12T12:00Z."
            - "One ACTIVE DEPOSIT listing P2 (deposit_amount_cents 50000) with NO CoverageLayer in the system."
            - "One COMPLETED 2-night stay whose deposit_state is HELD at 50000, so Guest.deposit_held_cents is 50000."
            - "A 60000 claim approved in full: deposit_applied_cents 50000, recovered_cents 50000, uncovered_cents 10000, host_absorbed_cents 10000, deposit_state APPLIED and Guest.deposit_held_cents 0."
            - "The guest has appealed that approval, so the claim is APPEALED and Host.payout_hold is true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/hosts"
              payload: { legal_name: "Bayview Stays LLC", email: "host1@stays.test" }
              as: PlatformAdmin
              captures: { h1: $.data.id }
            - call: "POST /rentals/guests"
              payload: { full_name: "Bo Nakamura", email: "bo@guest.test", country_code: "US" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /rentals/jurisdiction-rules"
              payload: { jurisdiction_code: "US-CA-SFO", min_stay_nights: 2, max_occupancy_cap: 8, events_prohibited: false, registration_required: false, indoor_camera_allowed: true, indoor_audio_allowed: false, sensor_notice_required: true, noise_threshold_db: 70 }
              as: ComplianceOfficer
              captures: { j1: $.data.id }
            - call: "POST /rentals/properties"
              payload: { host_id: "${h1}", jurisdiction_rule_id: "${j1}", address_line: "8 Beach Street", city: "San Francisco", max_occupancy: 4, bedrooms: 2, nightly_rate_cents: 20000, protection_product: "DEPOSIT", deposit_amount_cents: 50000, waiver_nightly_fee_cents: 0, claim_ceiling_cents: 400000, event_policy: "EVENTS_PROHIBITED", turnover_buffer_nights: 1 }
              as: Host
              as_user_id: "${h1}"
              captures: { p2: $.data.id }
            - call: "POST /rentals/properties/${p2}/activate"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - call: "GET /rentals/properties/${p2}"
              payload: {}
              as: Host
              as_user_id: "${h1}"
              captures: { p2v: $.data.version }
            - call: "POST /rentals/reservations"
              payload: { guest_id: "${g1}", property_id: "${p2}", check_in: "2026-08-10", check_out: "2026-08-12", guest_count: 2, event_declared: false, expected_property_version: "${p2v}" }
              as: Guest
              as_user_id: "${g1}"
              captures: { r1: $.data.id }
            - call: "POST /rentals/reservations/${r1}/confirm"
              payload: {}
              as: Host
              as_user_id: "${h1}"
              captures: { held_state: $.data.deposit_state, held_amount: $.data.deposit_hold_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/reservations/${r1}/check-in"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/reservations/${r1}/complete"
              payload: {}
              as: Host
