              as: PlatformAdmin
              captures: { tpl_x: $.data.id }
            - call: "POST /applications"
              payload: { insured_person_id: "${ip_x}", product_template_id: "${tpl_x}", requested_face_amount_cents: 10000000, premium_mode: "MONTHLY" }
