            - { call: "POST /instructor-contracts", payload: { session_id: "${sp}", instructor_id: "${ins}", revenue_share_bp: 5000, guarantee_min_cents: 0, cancellation_guarantee_cents: 0, settlement_basis: ENROLLMENT_BASIS }, as: ProgramCoordinator, captures: { ct: $.data.id } }
            - { call: "POST /class-meetings", payload: { session_id: "${sp}", room_id: "${rm}", starts_at: "2026-09-20T18:00:00Z", ends_at: "2026-09-20T19:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /instructor-contracts/${ct}/accept", payload: {}, as: Instructor, as_user_id: "${ins}" }
