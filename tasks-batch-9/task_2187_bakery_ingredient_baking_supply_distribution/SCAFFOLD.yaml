scenario: "2187. Bakery Ingredient & Baking Supply Distribution (Dawn Foods): flour/commodity price index & contracted forward pricing, bulk vs bagged delivery & silo fill, allergen segregation in warehouse & delivery, shelf-life & lot rotation on yeast/leavening, seasonal holiday demand surge, technical/formulation support attach, minimum drop & multi-stop route, product substitution & approval"
domain_name: "bakery-ingredient-distribution"
api_prefix: "/bakery-distribution"
# Every §1.5 path is absolute and already includes the api_prefix. Where §1.2,
# §1.3 and §1.4 name an endpoint in prose they use the suffix after the prefix
# (e.g. "POST /orders/{id}/submit" means
# "POST /bakery-distribution/orders/{id}/submit").

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - selector_policy

  entity_topology: hybrid
  # Contract -> ContractLine and Order -> OrderLine are strict ownership trees;
  # Lot/WarehouseZone/SiloAsset/DeliveryRoute/RouteStop/SubstitutionRequest/
  # TechSupportEngagement cross-cut those trees by flat FK reference, and
  # OrderLine.substituted_from_product_id is a self-referential product link.

  state_machine_shape: parallel
  # Order carries two independent dimensions (pricing_status x fulfillment_status);
  # ForwardPricingContract is cyclic (OFFERED -> COUNTERED -> OFFERED negotiation rounds);
  # SubstitutionRequest is branching with a revision cycle;
  # DeliveryRoute is compound (status advances from aggregate RouteStop states).

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The AccountManager who authors contract terms may never approve them
  # (PricingController only), and the TechnicalSpecialist who raises a
  # SubstitutionRequest may never decide it (QualityManager only).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Bakery account legal name
        constraints: "1-120 chars, unique (case-insensitive)"
      - name: status
        type: enum
        source: system
        description: Account standing gate for order intake
        default: ACTIVE
        constraints: "ACTIVE | CREDIT_HOLD"
      - name: allergen_program
        type: enum
        source: input
        description: Declared allergen handling program of the receiving bakery
        default: STANDARD
        constraints: "STANDARD | GLUTEN_FREE_CERTIFIED | NUT_FREE_CERTIFIED"
      - name: credit_limit_cents
        type: integer
        source: input
        description: Maximum open (uninvoiced) exposure permitted for this account
        constraints: ">= 0"
      - name: open_exposure_cents
        type: integer
        source: computed
        description: "Sum of Order.total_cents for this customer with pricing_status IN {PROVISIONAL, FINAL}; see calculations.customer_open_exposure"
        default: 0
      - name: min_drop_cents
        type: integer
        source: input
        description: Minimum priced value a single delivery drop to this customer must reach
        default: 25000
        constraints: ">= 0"
      - name: allergen_risk_score
        type: number
        source: computed
        description: "0.00-100.00 weighted allergen-exposure score; see calculations.customer_allergen_risk_score"
        default: 0
      - name: risk_tier
        type: enum
        source: computed
        description: "Derived from allergen_risk_score thresholds; gates GLUTEN_FREE_CERTIFIED shipments"
        default: GREEN
        constraints: "GREEN | AMBER | RED"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Stock keeping unit code
        constraints: "unique, 3-32 chars"
      - name: category
        type: enum
        source: input
        description: Commercial category driving pricing and rotation rules
        constraints: "FLOUR | LEAVENING | FAT | INCLUSION | PACKAGING"
      - name: allergen_class
        type: enum
        source: input
        description: Segregation class used by warehouse zones, silos, and routes
        constraints: "NONE | GLUTEN | TREE_NUT | PEANUT | DAIRY | EGG | SOY"
      - name: bulk_capable
        type: boolean
        source: input
        description: Whether the SKU can be delivered as bulk silo fill (vs bagged only)
        default: false
      - name: shelf_life_days
        type: integer
        source: input
        description: Days from Lot.manufactured_on until Lot.expires_on
        constraints: ">= 1"
      - name: index_code
        type: enum
        source: input
        description: Commodity index this SKU prices against; NONE means fixed-list pricing only
        default: NONE
        constraints: "NONE | HRW_WHEAT | SRW_WHEAT | SOFT_OIL | CANE_SUGAR"
      - name: list_price_cents_per_lb
        type: integer
        source: input
        description: Fallback per-pound list price when no contract line applies
        constraints: ">= 1"
      - name: min_rotation_days
        type: integer
        source: input
        description: Minimum remaining shelf life (days) a lot must have to be pickable
        default: 0
        constraints: ">= 0"

  - name: CommodityIndexQuote
    parent: null
    common_fields: false
    fields:
      - name: index_code
        type: enum
        source: input
        description: Commodity index being quoted
        constraints: "HRW_WHEAT | SRW_WHEAT | SOFT_OIL | CANE_SUGAR"
      - name: effective_on
        type: datetime
        source: input
        description: "UTC date (midnight) from which this quote is the prevailing quote"
        constraints: "unique per (index_code, effective_on)"
      - name: price_cents_per_lb
        type: integer
        source: input
        description: Published index price in cents per pound
        constraints: ">= 1"

  - name: ForwardPricingContract
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the bakery the forward terms belong to"
      - name: status
        type: enum
        source: system
        description: Negotiation and life-cycle state
        default: DRAFT
        constraints: "DRAFT | OFFERED | COUNTERED | ACTIVE | EXHAUSTED | EXPIRED | TERMINATED"
      - name: authored_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AccountManager that created or last re-offered the contract (opaque operator id)"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PricingController that activated the contract; null until ACTIVE"
        default: null
      - name: negotiation_round
        type: integer
        source: system
        description: Increments by 1 on every COUNTERED -> OFFERED re-offer
        default: 0
      - name: term_start_on
        type: datetime
        source: input
        description: First UTC date (midnight) the contract prices orders for
      - name: term_end_on
        type: datetime
        source: input
        description: Last UTC date (midnight, inclusive) the contract prices orders for
      - name: pricing_mode
        type: enum
        source: input
        description: Which index observation date settles contract lines
        constraints: "ORDER_DATE_INDEX | DELIVERY_DATE_INDEX"
      - name: committed_volume_lb
        type: integer
        source: computed
        description: "Sum of ContractLine.volume_committed_lb over all lines of this contract"
        default: 0
      - name: drawn_volume_lb
        type: integer
        source: computed
        description: "Sum of ContractLine.volume_drawn_lb over all lines of this contract"
        default: 0

  - name: ContractLine
    parent: ForwardPricingContract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> ForwardPricingContract.id; owning contract"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; SKU the forward terms cover"
      - name: volume_committed_lb
        type: integer
        source: input
        description: Total pounds the bakery commits to draw over the term
        constraints: ">= 1000"
      - name: volume_drawn_lb
        type: integer
        source: computed
        description: Pounds already drawn by non-cancelled orders against this line
        default: 0
      - name: basis_cents_per_lb
        type: integer
        source: input
        description: Contract basis added to (or subtracted from) the prevailing index price
        constraints: ">= -500 and <= 500"
      - name: cap_cents_per_lb
        type: integer
        source: input
        description: Ceiling on the settled per-pound price; null means uncapped
        default: null

  - name: WarehouseZone
    parent: null
    common_fields: true
    fields:
      - name: zone_code
        type: string
        source: input
        description: Physical zone label
        constraints: "unique, 2-16 chars"
      - name: allergen_class
        type: enum
        source: input
        description: The single allergen class this zone is dedicated to
        constraints: "NONE | GLUTEN | TREE_NUT | PEANUT | DAIRY | EGG | SOY"
      - name: status
        type: enum
        source: system
        description: Zone availability for putaway and picking
        default: OPEN
        constraints: "OPEN | SANITATION_LOCKOUT"
      - name: lockout_start_at
        type: datetime
        source: input
        description: Inclusive start of the allergen-changeover sanitation lockout; null when none
        default: null
      - name: lockout_end_at
        type: datetime
        source: input
        description: Inclusive end of the allergen-changeover sanitation lockout; null when none
        default: null
      - name: on_hand_lb
        type: number
        source: computed
        description: "Sum of Lot.quantity_on_hand_lb for lots in this zone whose status IN {AVAILABLE, QUARANTINED}"
        default: 0

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - name: lot_code
        type: string
        source: input
        description: Supplier lot code
        constraints: "unique, 4-32 chars"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; SKU this lot holds"
      - name: zone_id
        type: string
        source: input
        description: "FK -> WarehouseZone.id; storage zone; zone.allergen_class must equal product.allergen_class"
      - name: manufactured_on
        type: datetime
        source: input
        description: "UTC date (midnight) the lot was produced"
      - name: expires_on
        type: datetime
        source: computed
        description: "manufactured_on + Product.shelf_life_days days, at midnight UTC"
      - name: quantity_received_lb
        type: number
        source: input
        description: Pounds received into the zone; the conserved total for this lot
        constraints: "> 0"
      - name: quantity_on_hand_lb
        type: number
        source: computed
        description: Unreserved, unconsumed pounds still pickable
      - name: quantity_reserved_lb
        type: number
        source: computed
        description: Pounds held by OrderLine allocations that are not yet delivered
        default: 0
      - name: quantity_consumed_lb
        type: number
        source: computed
        description: Pounds shipped out on delivered orders or written off on disposal
        default: 0
      - name: status
        type: enum
        source: system
        description: Lot disposition
        default: AVAILABLE
        constraints: "AVAILABLE | QUARANTINED | DISPOSED | EXPIRED | DEPLETED"
      - name: quarantine_reason
        type: string
        source: input
        description: Free-text reason recorded when a QualityManager quarantines the lot
        default: null

  - name: SiloAsset
    parent: null
    common_fields: true
    fields:
      - name: silo_code
        type: string
        source: input
        description: Customer-site silo label
        constraints: "unique, 2-16 chars"
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; bakery site hosting the silo"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the single SKU the silo is dedicated to; product.bulk_capable must be true"
      - name: capacity_lb
        type: number
        source: input
        description: Total silo capacity in pounds
        constraints: ">= 1000"
      - name: residual_lb
        type: number
        source: computed
        description: Pounds currently held in the silo; increases on bulk delivery
        default: 0
      - name: min_fill_lb
        type: number
        source: input
        description: Smallest bulk fill the pneumatic trailer can economically blow
        default: 2000
      - name: last_fill_window_start_at
        type: datetime
        source: system
        description: Inclusive start of the most recent accepted fill window on this silo; null when never filled
        default: null
      - name: last_fill_window_end_at
        type: datetime
        source: system
        description: Inclusive end of the most recent accepted fill window on this silo; null when never filled
        default: null

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; ordering bakery"
      - name: contract_id
        type: string
        source: input
        description: "FK -> ForwardPricingContract.id; contract to price against; null means list pricing"
        default: null
      - name: delivery_mode
        type: enum
        source: input
        description: BULK means pneumatic silo fill; BAGGED means palletised cases
        constraints: "BULK | BAGGED"
      - name: requested_delivery_on
        type: datetime
        source: input
        description: "Requested UTC delivery date (midnight)"
      - name: fulfillment_status
        type: enum
        source: system
        description: Physical dimension of the order life cycle, independent of pricing_status
        default: NEW
        constraints: "NEW | ALLOCATED | ROUTED | LOADED | DELIVERED | SHORT_SHIPPED | CANCELLED"
      - name: pricing_status
        type: enum
        source: system
        description: Commercial dimension of the order life cycle, independent of fulfillment_status
        default: UNPRICED
        constraints: "UNPRICED | PROVISIONAL | FINAL | INVOICED | VOID"
      - name: order_placed_on
        type: datetime
        source: system
        description: "Logical-clock UTC date (midnight) at submission; the ORDER_DATE_INDEX observation date"
        default: null
      - name: delivered_on
        type: datetime
        source: system
        description: "Logical-clock UTC date (midnight) at delivery confirmation; the DELIVERY_DATE_INDEX observation date"
        default: null
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of OrderLine.extended_cents; see calculations.order_line_extended_price"
        default: 0
      - name: fuel_surcharge_cents
        type: integer
        source: computed
        description: "Distance-free surcharge derived from subtotal tier; see calculations.order_total_settlement"
        default: 0
      - name: tech_attach_fee_cents
        type: integer
        source: computed
        description: "Formulation-support attach fee rolled into this order; see calculations.tech_support_attach_fee"
        default: 0
      - name: volume_rebate_cents
        type: integer
        source: computed
        description: "Tiered rebate keyed on subtotal_cents; see calculations.order_total_settlement"
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal + fuel_surcharge + tech_attach_fee - volume_rebate; see calculations.order_total_settlement"
        default: 0
      - name: surge_window
        type: boolean
        source: computed
        description: "True when requested_delivery_on falls inside a declared holiday surge window; see calculations.order_total_settlement"
        default: false
      - name: short_ship_lb
        type: number
        source: computed
        description: Total pounds requested but not delivered when the order closes SHORT_SHIPPED
        default: 0

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; owning order"
      - name: product_id
        type: string
        source: system
        description: "FK -> Product.id; SKU currently on the line (may change on substitution approval)"
      - name: substituted_from_product_id
        type: string
        source: system
        description: "FK -> Product.id; the originally ordered SKU when a substitution was approved; null otherwise"
        default: null
      - name: lot_id
        type: string
        source: system
        description: "FK -> Lot.id; lot picked by FEFO rotation; null until allocation"
        default: null
      - name: silo_id
        type: string
        source: system
        description: "FK -> SiloAsset.id; destination silo for BULK lines; null for BAGGED lines"
        default: null
      - name: quantity_lb
        type: number
        source: input
        description: Requested pounds on this line
        constraints: "> 0"
      - name: allocation_status
        type: enum
        source: system
        description: Line-level inventory disposition
        default: UNALLOCATED
        constraints: "UNALLOCATED | RESERVED | SHIPPED | RELEASED"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Settled per-pound price; see calculations.contract_line_settlement_price"
        default: 0
      - name: extended_cents
        type: integer
        source: computed
        description: "Rounded line total; see calculations.order_line_extended_price"
        default: 0
      - name: contract_line_id
        type: string
        source: system
        description: "FK -> ContractLine.id; the contract line that priced this order line; null under list pricing"
        default: null

  - name: SubstitutionRequest
    parent: null
    common_fields: true
    fields:
      - name: order_line_id
        type: string
        source: input
        description: "FK -> OrderLine.id; the line whose SKU is proposed to change"
      - name: proposed_product_id
        type: string
        source: input
        description: "FK -> Product.id; replacement SKU"
      - name: status
        type: enum
        source: system
        description: Approval life cycle with a revision loop
        default: REQUESTED
        constraints: "REQUESTED | UNDER_REVIEW | REVISION_REQUESTED | APPROVED | REJECTED | WITHDRAWN"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the TechnicalSpecialist that raised the request (opaque operator id)"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityManager that approved or rejected; null until decided"
        default: null
      - name: revision_round
        type: integer
        source: system
        description: Increments by 1 on every REVISION_REQUESTED -> REQUESTED resubmission
        default: 0
      - name: rationale
        type: string
        source: input
        description: Formulation justification supplied by the requester
        constraints: "1-500 chars"

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - name: route_code
        type: string
        source: input
        description: Route label
        constraints: "unique, 2-16 chars"
      - name: service_on
        type: datetime
        source: input
        description: "UTC date (midnight) the route runs"
      - name: vehicle_capacity_lb
        type: number
        source: input
        description: Trailer payload capacity in pounds
        constraints: ">= 1000"
      - name: allergen_class_lock
        type: enum
        source: system
        description: "Allergen class the trailer is committed to; set from the first stop's order and immutable afterwards; NONE until the first stop"
        default: NONE
        constraints: "NONE | GLUTEN | TREE_NUT | PEANUT | DAIRY | EGG | SOY"
      - name: service_buffer_minutes
        type: integer
        source: input
        description: Minimum idle minutes required between the end of one stop window and the start of the next
        default: 30
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Compound state derived from RouteStop states plus explicit seal/dispatch actions"
        default: PLANNING
        constraints: "PLANNING | SEALED | DISPATCHED | COMPLETED | ABORTED"
      - name: planned_load_lb
        type: number
        source: computed
        description: "Sum of OrderLine.quantity_lb over all orders on stops whose status != CANCELLED"
        default: 0
      - name: utilization_pct
        type: number
        source: computed
        description: "planned_load_lb / vehicle_capacity_lb * 100, 2dp; see calculations.route_load_waterfall"
        default: 0
      - name: stop_count
        type: integer
        source: computed
        description: "Count of RouteStop rows on this route whose status != CANCELLED"
        default: 0

  - name: RouteStop
    parent: DeliveryRoute
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> DeliveryRoute.id; owning route"
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; order dropped at this stop"
      - name: window_start_at
        type: datetime
        source: input
        description: "Inclusive start of the delivery window (half-open interval [start, end))"
      - name: window_end_at
        type: datetime
        source: input
        description: "Exclusive end of the delivery window (half-open interval [start, end))"
      - name: sequence_no
        type: integer
        source: computed
        description: "1-based stop order assigned by window_start_at ASC, then created_at ASC"
        default: 0
      - name: status
        type: enum
        source: system
        description: Stop disposition
        default: PLANNED
        constraints: "PLANNED | DELIVERED | SHORTED | CANCELLED"

  - name: TechSupportEngagement
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; bakery receiving formulation support"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; SKU the formulation work targets"
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; order the attach fee was billed onto; null until attached"
        default: null
      - name: status
        type: enum
        source: system
        description: Engagement life cycle
        default: OPEN
        constraints: "OPEN | BILLABLE | ATTACHED | WAIVED"
      - name: hours_logged
        type: number
        source: computed
        description: "Sum of all logged hours, 1dp; see calculations.tech_support_attach_fee"
        default: 0
      - name: attach_fee_cents
        type: integer
        source: computed
        description: "Fee computed at attach time; see calculations.tech_support_attach_fee"
        default: 0
      - name: assigned_specialist_user_id
        type: string
        source: system
        description: "X-User-ID of the TechnicalSpecialist that owns the engagement (opaque operator id)"

state_machines:
  - entity: ForwardPricingContract
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /forward-contracts/{id}/offer"
        actor: AccountManager
        preconditions:
          - "contract.status == DRAFT"
          - "contract has >= 1 ContractLine"
          - "contract.term_end_on > contract.term_start_on"
        side_effects:
          - "sets contract.authored_by_user_id = X-User-ID"
          - "recomputes contract.committed_volume_lb as the sum of its ContractLine.volume_committed_lb"
          - "increments contract.version by 1"
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /forward-contracts/{id}/counter"
        actor: CustomerBuyer
        preconditions:
          - "contract.status == OFFERED"
          - "X-User-ID == contract.customer_id"
        side_effects:
          - "records the buyer's counter basis on every ContractLine (basis_cents_per_lb replaced)"
          - "increments contract.version by 1"
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /forward-contracts/{id}/offer"
        actor: AccountManager
        preconditions:
          - "contract.status == COUNTERED"
          - "contract.negotiation_round < 3"
        side_effects:
          - "increments contract.negotiation_round by 1"
          - "sets contract.authored_by_user_id = X-User-ID"
          - "increments contract.version by 1"
        note: "Cyclic negotiation: OFFERED -> COUNTERED -> OFFERED, capped at 3 rounds"
      - from: OFFERED
        to: ACTIVE
        trigger: "POST /forward-contracts/{id}/activate"
        actor: PricingController
        preconditions:
          - "contract.status == OFFERED"
          - "X-User-ID != contract.authored_by_user_id (segregation of duties)"
          - "customer.status == ACTIVE"
          - "no other ForwardPricingContract for this customer with status == ACTIVE overlaps [term_start_on, term_end_on] on any shared product_id"
        side_effects:
          - "sets contract.approved_by_user_id = X-User-ID"
          - "increments contract.version by 1"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: every ContractLine reaches volume_drawn_lb >= volume_committed_lb"
        actor: system
        preconditions:
          - "contract.status == ACTIVE"
          - "for every ContractLine of the contract: volume_drawn_lb >= volume_committed_lb"
        side_effects:
          - "recomputes contract.drawn_volume_lb"
          - "increments contract.version by 1"
        note: "Auto-transition evaluated at the end of every order submission that draws volume"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system: a cancelled order returns drawn volume so some ContractLine falls below its commitment"
        actor: system
        preconditions:
          - "contract.status == EXHAUSTED"
          - "contract.term_end_on >= logical clock date"
          - "at least one ContractLine has volume_drawn_lb < volume_committed_lb after the restoration"
        side_effects:
          - "recomputes contract.drawn_volume_lb"
          - "increments contract.version by 1"
        note: "Cyclic: ACTIVE -> EXHAUSTED -> ACTIVE as volume is drawn and returned"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing past term_end_on"
        actor: system
        preconditions:
          - "contract.status IN {ACTIVE, EXHAUSTED}"
          - "logical clock date > contract.term_end_on"
        side_effects:
          - "orders with pricing_status == UNPRICED referencing this contract keep contract_id but can no longer be priced"
          - "increments contract.version by 1"
      - from: OFFERED
        to: TERMINATED
        trigger: "POST /forward-contracts/{id}/terminate"
        actor: PricingController
        preconditions:
          - "contract.status IN {DRAFT, OFFERED, COUNTERED, ACTIVE}"
        side_effects:
          - "every Order referencing this contract with pricing_status == PROVISIONAL is repriced under list pricing on its next repricing event"
          - "increments contract.version by 1"

  - entity: Lot
    initial_state: AVAILABLE
    terminal_states: [DISPOSED, EXPIRED, DEPLETED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /lots/{id}/quarantine"
        actor: QualityManager
        preconditions:
          - "lot.status == AVAILABLE"
          - "quarantine_reason present, 1-200 chars"
        side_effects:
          - "CASCADE HOP 1: every OrderLine with lot_id == lot.id and allocation_status == RESERVED flips to UNALLOCATED, lot.quantity_reserved_lb decreases by that line's quantity_lb and lot.quantity_on_hand_lb increases by the same amount (conserving lot totals)"
          - "CASCADE HOP 2: because those OrderLines became UNALLOCATED, each parent Order with fulfillment_status IN {ALLOCATED, ROUTED} reverts to NEW"
          - "CASCADE HOP 3: because those Orders left ROUTED, each of their RouteStop rows with status == PLANNED flips to CANCELLED and the owning DeliveryRoute recomputes planned_load_lb, utilization_pct and stop_count"
          - "CASCADE HOP 4: because stop_count reached 0 on a DeliveryRoute with status == SEALED, that route reverts to PLANNING and allergen_class_lock resets to NONE"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /lots/{id}/release"
        actor: QualityManager
        preconditions:
          - "lot.status == QUARANTINED"
          - "zone.status == OPEN"
          - "lot.expires_on > logical clock date"
        side_effects:
          - "clears lot.quarantine_reason"
          - "recomputes WarehouseZone.on_hand_lb for lot.zone_id"
        note: "Cyclic: AVAILABLE -> QUARANTINED -> AVAILABLE"
      - from: QUARANTINED
        to: DISPOSED
        trigger: "POST /lots/{id}/dispose"
        actor: QualityManager
        preconditions:
          - "lot.status == QUARANTINED"
          - "lot.quantity_reserved_lb == 0"
        side_effects:
          - "moves all quantity_on_hand_lb into quantity_consumed_lb (conserving quantity_received_lb)"
          - "recomputes WarehouseZone.on_hand_lb for lot.zone_id"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing past expires_on"
        actor: system
        preconditions:
          - "lot.status IN {AVAILABLE, QUARANTINED}"
          - "logical clock date >= lot.expires_on"
        side_effects:
          - "reserved pounds are released exactly as in the QUARANTINED cascade hops 1-4"
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system: order delivery consumes the last on-hand pound"
        actor: system
        preconditions:
          - "lot.status == AVAILABLE"
          - "lot.quantity_on_hand_lb == 0 and lot.quantity_reserved_lb == 0"
        side_effects:
          - "recomputes WarehouseZone.on_hand_lb for lot.zone_id"

  - entity: Order
    dimension: fulfillment_status
    initial_state: NEW
    terminal_states: [DELIVERED, SHORT_SHIPPED, CANCELLED]
    transitions:
      - from: NEW
        to: ALLOCATED
        trigger: "POST /orders/{id}/allocate"
        actor: WarehouseOperator
        preconditions:
          - "order.fulfillment_status == NEW"
          - "order.pricing_status IN {PROVISIONAL, FINAL} (cross-dimension gate: an UNPRICED order cannot be allocated)"
          - "customer.status == ACTIVE"
          - "for every OrderLine, calculations.lot_rotation_selector returns a non-empty candidate set"
          - "for every candidate Lot, WarehouseZone.status == OPEN"
          - "if order.delivery_mode == BULK: every line's product.bulk_capable == true and a SiloAsset exists for (customer_id, product_id)"
        side_effects:
          - "each OrderLine.lot_id is set by calculations.lot_rotation_selector, allocation_status -> RESERVED"
          - "each picked Lot: quantity_reserved_lb += line.quantity_lb, quantity_on_hand_lb -= line.quantity_lb (lot conservation invariant holds)"
          - "recomputes WarehouseZone.on_hand_lb for every touched zone"
          - "BULK orders: each OrderLine.silo_id is set to the customer's SiloAsset for that product"
          - "recomputes calculations.customer_allergen_risk_score for order.customer_id, then Customer.risk_tier"
      - from: ALLOCATED
        to: NEW
        trigger: "POST /orders/{id}/deallocate"
        actor: WarehouseOperator
        preconditions:
          - "order.fulfillment_status == ALLOCATED"
          - "no RouteStop with order_id == order.id has status == PLANNED"
        side_effects:
          - "each OrderLine.allocation_status -> UNALLOCATED, lot_id -> null, silo_id -> null"
          - "each released Lot: quantity_reserved_lb -= line.quantity_lb, quantity_on_hand_lb += line.quantity_lb (compensating action; quantity_received_lb unchanged)"
          - "recomputes WarehouseZone.on_hand_lb for every touched zone"
          - "recomputes calculations.customer_allergen_risk_score for order.customer_id, then Customer.risk_tier"
        note: "Compensating action for NEW -> ALLOCATED; the lot conservation quantity must return to its pre-allocation value"
      - from: ALLOCATED
        to: ROUTED
        trigger: "system: POST /routes/{id}/stops creates a RouteStop for this order"
        actor: system
        preconditions:
          - "order.fulfillment_status == ALLOCATED"
          - "route.status == PLANNING"
        side_effects:
          - "recomputes route.planned_load_lb, route.utilization_pct and route.stop_count"
      - from: ROUTED
        to: LOADED
        trigger: "system: POST /routes/{id}/dispatch"
        actor: system
        preconditions:
          - "order.fulfillment_status == ROUTED"
          - "route.status == SEALED"
        side_effects:
          - "every RouteStop on the route keeps status PLANNED; the order becomes immutable to substitution approval"
      - from: LOADED
        to: DELIVERED
        trigger: "POST /route-stops/{id}/deliver"
        actor: WarehouseOperator
        preconditions:
          - "order.fulfillment_status == LOADED"
          - "stop.status == PLANNED"
          - "route.status == DISPATCHED"
        side_effects:
          - "stop.status -> DELIVERED"
          - "each OrderLine.allocation_status -> SHIPPED; its Lot moves quantity_reserved_lb into quantity_consumed_lb"
          - "BULK lines: SiloAsset.residual_lb += line.quantity_lb, and last_fill_window_start_at / last_fill_window_end_at are set from the stop window"
          - "sets order.delivered_on = logical clock date; order.pricing_status becomes eligible for finalization"
          - "any Lot reaching quantity_on_hand_lb == 0 and quantity_reserved_lb == 0 auto-transitions to DEPLETED"
          - "when every non-CANCELLED RouteStop on the route is DELIVERED or SHORTED, route.status -> COMPLETED"
        note: "Branch A of the LOADED fork-join; side-effect set differs from Branch B"
      - from: LOADED
        to: SHORT_SHIPPED
        trigger: "POST /route-stops/{id}/short"
        actor: WarehouseOperator
        preconditions:
          - "order.fulfillment_status == LOADED"
          - "stop.status == PLANNED"
          - "route.status == DISPATCHED"
          - "0 < delivered_lb_total < sum of OrderLine.quantity_lb for the order"
        side_effects:
          - "stop.status -> SHORTED"
          - "order.short_ship_lb = sum(OrderLine.quantity_lb) - delivered_lb_total"
          - "each OrderLine.allocation_status -> SHIPPED, but only the delivered pounds move from Lot.quantity_reserved_lb to quantity_consumed_lb; the shorted pounds return to Lot.quantity_on_hand_lb"
          - "each affected ContractLine.volume_drawn_lb is reduced by the shorted pounds for that product (contract volume conservation invariant)"
          - "sets order.delivered_on = logical clock date"
          - "when every non-CANCELLED RouteStop on the route is DELIVERED or SHORTED, route.status -> COMPLETED"
        note: "Branch B of the LOADED fork-join; unlike DELIVERED it returns pounds to inventory and to the contract line"
      - from: NEW
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: CustomerBuyer
        preconditions:
          - "order.fulfillment_status IN {NEW, ALLOCATED}"
          - "X-User-ID == order.customer_id"
        side_effects:
          - "all reservations released exactly as in ALLOCATED -> NEW"
          - "each ContractLine.volume_drawn_lb is reduced by the pounds this order drew (contract volume conservation invariant)"
          - "order.pricing_status -> VOID"
          - "recomputes calculations.customer_open_exposure for order.customer_id"
          - "if the owning contract was EXHAUSTED and a line now falls below commitment, contract auto-transitions EXHAUSTED -> ACTIVE"

  - entity: Order
    dimension: pricing_status
    initial_state: UNPRICED
    terminal_states: [INVOICED, VOID]
    transitions:
      - from: UNPRICED
        to: PROVISIONAL
        trigger: "POST /orders/{id}/submit"
        actor: CustomerBuyer
        preconditions:
          - "order.pricing_status == UNPRICED"
          - "order.fulfillment_status == NEW"
          - "X-User-ID == order.customer_id"
          - "order has >= 1 OrderLine"
          - "customer.status == ACTIVE"
          - "if order.contract_id is not null: contract.status == ACTIVE and contract.term_start_on <= order.requested_delivery_on <= contract.term_end_on"
          - "computed total_cents >= customer.min_drop_cents (inclusive boundary)"
          - "customer.open_exposure_cents + computed total_cents <= customer.credit_limit_cents"
        side_effects:
          - "sets order.order_placed_on = logical clock date"
          - "runs calculations.contract_line_settlement_price variant provisional_order_date for every line"
          - "runs calculations.order_line_extended_price then calculations.order_total_settlement"
          - "each matched ContractLine.volume_drawn_lb += line.quantity_lb; contract.drawn_volume_lb recomputed"
          - "recomputes calculations.customer_open_exposure for order.customer_id"
          - "if every ContractLine of the contract reaches its commitment, contract auto-transitions ACTIVE -> EXHAUSTED"
      - from: PROVISIONAL
        to: PROVISIONAL
        trigger: "system: substitution approval, contract termination, or POST /orders/{id}/reprice"
        actor: system
        preconditions:
          - "order.pricing_status == PROVISIONAL"
          - "order.fulfillment_status NOT IN {LOADED, DELIVERED, SHORT_SHIPPED, CANCELLED}"
        side_effects:
          - "re-runs calculations.contract_line_settlement_price variant provisional_order_date, then order_line_extended_price, then order_total_settlement"
          - "recomputes calculations.customer_open_exposure; if it exceeds credit_limit_cents the Customer moves ACTIVE -> CREDIT_HOLD"
        note: "Self-loop: repricing keeps the state but changes totals"
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /orders/{id}/finalize-pricing"
        actor: PricingController
        preconditions:
          - "order.pricing_status == PROVISIONAL"
          - "order.fulfillment_status IN {DELIVERED, SHORT_SHIPPED} (cross-dimension gate)"
          - "if order.contract_id is not null and contract.pricing_mode == DELIVERY_DATE_INDEX: a CommodityIndexQuote exists with effective_on <= order.delivered_on for every priced index_code"
        side_effects:
          - "re-runs calculations.contract_line_settlement_price variant final_delivery_date, producing per-pound prices that may differ from the provisional ones"
          - "re-runs calculations.order_line_extended_price and calculations.order_total_settlement"
          - "recomputes calculations.customer_open_exposure"
      - from: FINAL
        to: INVOICED
        trigger: "POST /orders/{id}/invoice"
        actor: PricingController
        preconditions:
          - "order.pricing_status == FINAL"
          - "X-User-ID != order.customer_id"
          - "every TechSupportEngagement with order_id == order.id has status == ATTACHED"
        side_effects:
          - "order.total_cents is frozen; further repricing is rejected"
          - "recomputes calculations.customer_open_exposure (INVOICED orders leave open exposure)"
          - "if customer.status == CREDIT_HOLD and the recomputed open_exposure_cents <= credit_limit_cents, customer.status -> ACTIVE"
      - from: PROVISIONAL
        to: VOID
        trigger: "system: POST /orders/{id}/cancel"
        actor: system
        preconditions:
          - "order.pricing_status IN {UNPRICED, PROVISIONAL}"
        side_effects:
          - "order.total_cents, subtotal_cents, fuel_surcharge_cents, volume_rebate_cents and tech_attach_fee_cents all reset to 0"
          - "recomputes calculations.customer_open_exposure for order.customer_id"

  - entity: SubstitutionRequest
    initial_state: REQUESTED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /substitution-requests/{id}/claim"
        actor: QualityManager
        preconditions:
          - "request.status == REQUESTED"
          - "X-User-ID != request.requested_by_user_id (segregation of duties)"
          - "the parent Order.fulfillment_status IN {NEW, ALLOCATED}"
        side_effects:
          - "sets request.decided_by_user_id = X-User-ID"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /substitution-requests/{id}/request-revision"
        actor: QualityManager
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "request.revision_round < 2"
        side_effects:
          - "clears request.decided_by_user_id"
      - from: REVISION_REQUESTED
        to: REQUESTED
        trigger: "POST /substitution-requests/{id}/resubmit"
        actor: TechnicalSpecialist
        preconditions:
          - "request.status == REVISION_REQUESTED"
          - "X-User-ID == request.requested_by_user_id"
        side_effects:
          - "increments request.revision_round by 1"
          - "replaces request.proposed_product_id and request.rationale with the resubmitted values"
        note: "Revision cycle: REQUESTED -> UNDER_REVIEW -> REVISION_REQUESTED -> REQUESTED, capped at 2 rounds"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /substitution-requests/{id}/approve"
        actor: QualityManager
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "X-User-ID != request.requested_by_user_id (segregation of duties)"
          - "the parent Order.fulfillment_status IN {NEW, ALLOCATED} (cross-entity gate)"
          - "the parent Order.pricing_status != INVOICED"
          - "proposed_product.allergen_class is compatible with customer.allergen_program per validations priority 11"
        side_effects:
          - "CASCADE HOP 1: OrderLine.substituted_from_product_id = old product_id, OrderLine.product_id = request.proposed_product_id"
          - "CASCADE HOP 2: because the line's product changed, an existing RESERVED allocation is released (allocation_status -> RELEASED, old Lot returns quantity_reserved_lb to quantity_on_hand_lb) and calculations.lot_rotation_selector re-picks a Lot of the new product, re-reserving it"
          - "CASCADE HOP 3: because the line's product and unit price changed, the Order is repriced through PROVISIONAL -> PROVISIONAL, changing subtotal_cents, volume_rebate_cents and total_cents"
          - "CASCADE HOP 4: because Order.total_cents changed, Customer.open_exposure_cents is recomputed; if it exceeds credit_limit_cents the Customer transitions ACTIVE -> CREDIT_HOLD"
          - "CASCADE HOP 5: because the line's product allergen_class changed, calculations.customer_allergen_risk_score is recomputed and Customer.risk_tier is re-derived"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /substitution-requests/{id}/reject"
        actor: QualityManager
        preconditions:
          - "request.status == UNDER_REVIEW"
          - "X-User-ID != request.requested_by_user_id (segregation of duties)"
        side_effects:
          - "no change to the OrderLine; the order keeps its original product_id"
        note: "Branch B of the UNDER_REVIEW fork; its side-effect set is deliberately empty of cascades"
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /substitution-requests/{id}/withdraw"
        actor: TechnicalSpecialist
        preconditions:
          - "request.status IN {REQUESTED, REVISION_REQUESTED}"
          - "X-User-ID == request.requested_by_user_id"
        side_effects:
          - "no change to the OrderLine"

  - entity: DeliveryRoute
    initial_state: PLANNING
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: PLANNING
        to: SEALED
        trigger: "POST /routes/{id}/seal"
        actor: LogisticsPlanner
        preconditions:
          - "route.status == PLANNING"
          - "route.stop_count >= 1"
          - "route.utilization_pct <= 100 (inclusive boundary: exactly 100.00 seals)"
          - "every stop's Order.fulfillment_status == ROUTED"
          - "every stop's Order.total_cents >= that customer's min_drop_cents"
          - "every stop's Order.delivery_mode matches: BULK stops require route.allergen_class_lock == the order's single allergen_class"
        side_effects:
          - "assigns RouteStop.sequence_no by window_start_at ASC, then created_at ASC"
          - "increments route.version by 1"
      - from: SEALED
        to: PLANNING
        trigger: "POST /routes/{id}/unseal, or system when route.stop_count reaches 0"
        actor: LogisticsPlanner
        preconditions:
          - "route.status == SEALED"
        side_effects:
          - "clears every RouteStop.sequence_no back to 0"
          - "when triggered by stop_count reaching 0, route.allergen_class_lock resets to NONE"
          - "increments route.version by 1"
        note: "Compound revert: also fired as CASCADE HOP 4 of the Lot quarantine chain"
      - from: SEALED
        to: DISPATCHED
        trigger: "POST /routes/{id}/dispatch"
        actor: LogisticsPlanner
        preconditions:
          - "route.status == SEALED"
          - "logical clock date == route.service_on"
          - "every stop's Order.pricing_status IN {PROVISIONAL, FINAL}"
        side_effects:
          - "every stop's Order.fulfillment_status ROUTED -> LOADED"
          - "increments route.version by 1"
      - from: DISPATCHED
        to: COMPLETED
        trigger: "system: every non-CANCELLED RouteStop reaches DELIVERED or SHORTED"
        actor: system
        preconditions:
          - "route.status == DISPATCHED"
          - "count of RouteStop rows with status == PLANNED is 0"
        side_effects:
          - "recomputes route.planned_load_lb and route.utilization_pct from delivered pounds only"
          - "increments route.version by 1"
        note: "Compound: parent state derived from the aggregate state of its RouteStop children"
      - from: DISPATCHED
        to: ABORTED
        trigger: "POST /routes/{id}/abort"
        actor: LogisticsPlanner
        preconditions:
          - "route.status == DISPATCHED"
          - "count of RouteStop with status IN {DELIVERED, SHORTED} == 0"
        side_effects:
          - "every RouteStop with status == PLANNED -> CANCELLED"
          - "every affected Order.fulfillment_status LOADED -> ALLOCATED (reservations retained)"
          - "route.stop_count, planned_load_lb and utilization_pct recomputed to 0"
          - "increments route.version by 1"

  - entity: TechSupportEngagement
    initial_state: OPEN
    terminal_states: [ATTACHED, WAIVED]
    transitions:
      - from: OPEN
        to: BILLABLE
        trigger: "system: POST /tech-engagements/{id}/hours pushes hours_logged over the billable threshold"
        actor: system
        preconditions:
          - "engagement.status == OPEN"
          - "engagement.hours_logged >= BILLABLE_HOURS_THRESHOLD (4.0, inclusive boundary)"
        side_effects:
          - "computes engagement.attach_fee_cents via calculations.tech_support_attach_fee"
      - from: BILLABLE
        to: ATTACHED
        trigger: "POST /tech-engagements/{id}/attach"
        actor: TechnicalSpecialist
        preconditions:
          - "engagement.status == BILLABLE"
          - "X-User-ID == engagement.assigned_specialist_user_id"
          - "target Order.customer_id == engagement.customer_id"
          - "target Order.pricing_status == PROVISIONAL (cross-entity gate: FINAL and INVOICED orders reject attachment)"
        side_effects:
          - "sets engagement.order_id"
          - "sets Order.tech_attach_fee_cents = engagement.attach_fee_cents and reprices the order through PROVISIONAL -> PROVISIONAL"
          - "recomputes calculations.customer_open_exposure for the customer"
      - from: OPEN
        to: WAIVED
        trigger: "POST /tech-engagements/{id}/waive"
        actor: AccountManager
        preconditions:
          - "engagement.status IN {OPEN, BILLABLE}"
          - "engagement.order_id is null"
        side_effects:
          - "sets engagement.attach_fee_cents = 0"

concurrency_rules:
  - rule_id: substitution-create-stale-order
    parent_entity: Order
    write_endpoint: "POST /bakery-distribution/substitution-requests"
    occ_field: "expected_order_version"
    description: |
      Raising a SubstitutionRequest against an Order whose version has advanced
      since the specialist last read it is rejected with a stale-version error.
      Creating a request legitimately supersedes any earlier REQUESTED or
      REVISION_REQUESTED request on the same OrderLine (the earlier one is moved
      to WITHDRAWN), so the write itself is always permissible under product
      semantics; OCC on Order.version is the only thing that stops a specialist
      from superseding a request on the basis of an out-of-date view of the order.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
  - rule_id: route-stop-create-stale-route
    parent_entity: DeliveryRoute
    write_endpoint: "POST /bakery-distribution/routes/{id}/stops"
    occ_field: "expected_route_version"
    description: |
      Adding a RouteStop to a DeliveryRoute whose version has advanced since the
      planner last read it is rejected with a stale-version error. Appending a
      stop is always permissible while the route is PLANNING and under capacity,
      so nothing in the state machine rejects it; OCC on DeliveryRoute.version is
      what prevents a planner from appending against a stale view of
      planned_load_lb, utilization_pct and allergen_class_lock.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

calculations:
  - name: contract_line_settlement_price
    trigger: "Order pricing_status UNPRICED -> PROVISIONAL, every PROVISIONAL -> PROVISIONAL reprice, and PROVISIONAL -> FINAL; writes OrderLine.unit_price_cents and OrderLine.contract_line_id"
    algorithm: threshold
    formula: |
      # STEP 1 - pick the pricing basis for the line
      cl = the ContractLine with contract_id == order.contract_id AND product_id == line.product_id
           (at most one exists; enforced by validations priority 14 uniqueness on (contract_id, product_id))
      if order.contract_id is null OR cl is null OR contract.status NOT IN {ACTIVE, EXHAUSTED}:
          line.contract_line_id = null
          return product.list_price_cents_per_lb          # list pricing path
      # STEP 2 - resolve the observation date (variant-dependent, see variants[])
      obs_date = <variant-supplied UTC date>
      # STEP 3 - resolve the prevailing index quote
      if product.index_code == NONE:
          line.contract_line_id = cl.id
          return max(1, product.list_price_cents_per_lb + cl.basis_cents_per_lb)
      q = the CommodityIndexQuote with index_code == product.index_code and the
          greatest effective_on such that effective_on <= obs_date
          (no tie is possible: (index_code, effective_on) is unique)
      if q does not exist: raise ERR_INDEX_QUOTE_MISSING
      # STEP 4 - basis, cap, floor (evaluated in exactly this order)
      raw = q.price_cents_per_lb + cl.basis_cents_per_lb
      capped = raw if cl.cap_cents_per_lb is null else min(raw, cl.cap_cents_per_lb)
      line.contract_line_id = cl.id
      return max(1, capped)
    input_set: "One CommodityIndexQuote per (index_code, effective_on); only quotes with effective_on <= obs_date are candidates. ContractLines are considered only while contract.status IN {ACTIVE, EXHAUSTED}."
    constants:
      MIN_UNIT_PRICE_CENTS_PER_LB: 1
    precision: "integer cents per pound; no rounding needed (all inputs are integer cents)"
    variants:
      - name: provisional_order_date
        when: "Order pricing_status UNPRICED -> PROVISIONAL and every PROVISIONAL -> PROVISIONAL reprice"
        difference: "obs_date = order.order_placed_on, regardless of contract.pricing_mode"
      - name: final_delivery_date
        when: "Order pricing_status PROVISIONAL -> FINAL"
        difference: "obs_date = order.delivered_on when contract.pricing_mode == DELIVERY_DATE_INDEX, otherwise obs_date = order.order_placed_on. Under DELIVERY_DATE_INDEX a quote published between order_placed_on and delivered_on becomes prevailing, so the final unit price differs from the provisional one for identical order inputs."

  - name: order_line_extended_price
    trigger: "immediately after contract_line_settlement_price on every pricing event; writes OrderLine.extended_cents and Order.subtotal_cents"
    algorithm: tiered_pricing
    formula: |
      # per-line quantity discount tier (marginal rate NOT used; a single rate applies to the whole line)
      if line.quantity_lb < 2000:            disc = 0.000
      elif line.quantity_lb < 10000:         disc = 0.015     # 2000 <= q < 10000
      else:                                  disc = 0.030     # q >= 10000 (inclusive boundary)
      line_gross = line.quantity_lb * line.unit_price_cents          # exact rational cents
      line_net   = line_gross * (1 - disc)
      # ROUNDING ORDER IS PINNED: round EACH LINE to integer cents FIRST, THEN sum.
      line.extended_cents = round_half_up(line_net, 0)
      order.subtotal_cents = sum(line.extended_cents for every OrderLine of the order, in created_at ASC order)
      # Summing exact line_net values and rounding once at the end is FORBIDDEN and
      # yields a different subtotal_cents for the same inputs.
    input_set: "Every OrderLine of the order, including lines whose allocation_status is UNALLOCATED or RELEASED; excludes nothing"
    constants:
      DISCOUNT_TIER_1_MIN_LB: 2000
      DISCOUNT_TIER_1_PCT: 0.015
      DISCOUNT_TIER_2_MIN_LB: 10000
      DISCOUNT_TIER_2_PCT: 0.030
    precision: "integer cents, round_half_up, applied per line before summation"

  - name: order_total_settlement
    trigger: "immediately after order_line_extended_price on every pricing event; writes Order.surge_window, fuel_surcharge_cents, volume_rebate_cents and total_cents"
    algorithm: waterfall_allocation
    formula: |
      # The rebate tier is keyed on a base that already contains the fuel surcharge,
      # and the fuel surcharge rate is keyed on the surge flag - a circular-looking
      # dependency. Evaluation order is PINNED to steps 1..5 below; no fixed-point
      # iteration and no re-entry into an earlier step is permitted.
      # STEP 1
      subtotal = order.subtotal_cents                       # from order_line_extended_price
      # STEP 2
      order.surge_window = (order.requested_delivery_on falls inside any SURGE_WINDOWS
                            interval, both endpoints inclusive)
      # STEP 3
      fuel_pct = SURGE_FUEL_PCT if order.surge_window else BASE_FUEL_PCT
      order.fuel_surcharge_cents = round_half_up(subtotal * fuel_pct, 0)
      # STEP 4 - rebate tier is keyed on (subtotal + fuel_surcharge), but the rebate
      #          percentage is applied to `subtotal` ONLY, never to the surcharge.
      rebate_base = subtotal + order.fuel_surcharge_cents
      if order.surge_window:                     rebate_pct = 0.000   # rebates suppressed in surge windows
      elif rebate_base < 500000:                 rebate_pct = 0.000
      elif rebate_base < 1500000:                rebate_pct = 0.010
      else:                                      rebate_pct = 0.025   # >= 1500000 inclusive
      order.volume_rebate_cents = round_half_up(subtotal * rebate_pct, 0)
      # STEP 5
      order.total_cents = subtotal + order.fuel_surcharge_cents
                          + order.tech_attach_fee_cents - order.volume_rebate_cents
    input_set: "Order.subtotal_cents and Order.tech_attach_fee_cents as persisted at the moment of the pricing event; tech_attach_fee_cents is 0 until a TechSupportEngagement reaches ATTACHED"
    constants:
      BASE_FUEL_PCT: 0.025
      SURGE_FUEL_PCT: 0.040
      REBATE_TIER_1_MIN_CENTS: 500000
      REBATE_TIER_1_PCT: 0.010
      REBATE_TIER_2_MIN_CENTS: 1500000
      REBATE_TIER_2_PCT: 0.025
      SURGE_WINDOWS: ["2026-03-15..2026-04-15", "2026-11-15..2026-12-31"]
    precision: "integer cents, round_half_up at each of steps 3 and 4 independently"

  - name: customer_allergen_risk_score
    trigger: "Order fulfillment_status NEW -> ALLOCATED, ALLOCATED -> NEW, SubstitutionRequest UNDER_REVIEW -> APPROVED (cascade hop 5), and RouteStop deliver/short; writes Customer.allergen_risk_score and Customer.risk_tier"
    algorithm: weighted_scoring
    formula: |
      lines = <variant-supplied OrderLine input set for this customer>
      if lines is empty:
          customer.allergen_risk_score = 0.00                 # empty-set boundary
      else:
          weighted = sum(ALLERGEN_WEIGHT[line.product.allergen_class] * line.quantity_lb for line in lines)
          pounds   = sum(line.quantity_lb for line in lines)   # pounds > 0 is guaranteed: quantity_lb > 0
          raw      = (weighted / pounds) * 100                 # 0.00 .. 100.00
          penalty  = GF_CONFLICT_PENALTY if (customer.allergen_program == GLUTEN_FREE_CERTIFIED
                                             and any line.product.allergen_class == GLUTEN)
                     else 0
          customer.allergen_risk_score = min(100.00, round_half_up(raw + penalty, 2))
      # tier thresholds are half-open upward
      customer.risk_tier = GREEN if score < 25.00 else (AMBER if score < 60.00 else RED)
    input_set: "OrderLines of Orders belonging to this customer, filtered by the variant's fulfillment_status set; Orders with fulfillment_status == CANCELLED and OrderLines with allocation_status == RELEASED are excluded from both variants"
    constants:
      ALLERGEN_WEIGHT: { NONE: 0.0, SOY: 0.20, EGG: 0.35, DAIRY: 0.40, GLUTEN: 0.55, TREE_NUT: 0.90, PEANUT: 1.00 }
      GF_CONFLICT_PENALTY: 15.00
      TIER_AMBER_MIN: 25.00
      TIER_RED_MIN: 60.00
    precision: "2 decimal places, round_half_up, applied once after the penalty is added"
    variants:
      - name: exposure_provisional
        when: "recomputed on allocation, deallocation and substitution approval (in-flight exposure)"
        difference: "input set = OrderLines whose Order.fulfillment_status IN {NEW, ALLOCATED, ROUTED, LOADED}"
      - name: exposure_audited
        when: "recomputed on RouteStop deliver and short (closed-book exposure)"
        difference: "input set = OrderLines whose Order.fulfillment_status IN {DELIVERED, SHORT_SHIPPED}; the same customer with the same orders therefore carries two different scores at different points of the same order's life, and the audited score never includes in-flight pounds"

  - name: customer_open_exposure
    trigger: "Order pricing_status UNPRICED -> PROVISIONAL, PROVISIONAL -> PROVISIONAL, PROVISIONAL -> FINAL, FINAL -> INVOICED, PROVISIONAL -> VOID; writes Customer.open_exposure_cents and may move Customer.status"
    algorithm: aggregation
    formula: |
      customer.open_exposure_cents =
          sum(o.total_cents for o in Orders
              where o.customer_id == customer.id
                and o.pricing_status IN {PROVISIONAL, FINAL})
      # INVOICED, VOID and UNPRICED orders contribute 0.
      if customer.status == ACTIVE and customer.open_exposure_cents > customer.credit_limit_cents:
          customer.status = CREDIT_HOLD
      if customer.status == CREDIT_HOLD and customer.open_exposure_cents <= customer.credit_limit_cents:
          customer.status = ACTIVE
    input_set: "All Orders of the customer with pricing_status IN {PROVISIONAL, FINAL}, no time window; full recompute (never incremental)"
    constants: {}
    precision: "integer cents; no rounding"

  - name: lot_rotation_selector
    trigger: "Order fulfillment_status NEW -> ALLOCATED (one selection per OrderLine) and SubstitutionRequest cascade hop 2 re-pick; writes OrderLine.lot_id"
    algorithm: chronological
    formula: |
      # (a) ELIGIBILITY FILTER - explicit predicate, no fuzzy adjectives
      candidates = Lots L where
            L.product_id == line.product_id
        and L.status == AVAILABLE
        and L.quantity_on_hand_lb >= line.quantity_lb
        and days_between(clock_date, L.expires_on) >= line.product.min_rotation_days
        and WarehouseZone(L.zone_id).status == OPEN
        and WarehouseZone(L.zone_id).allergen_class == line.product.allergen_class
      # (b) RANKING - First-Expired-First-Out
      rank by L.expires_on ASC
      # (c) TIE-BREAK - applied only when expires_on values are equal
      then by L.quantity_on_hand_lb DESC
      then by L.created_at ASC          # never L.id
      # (d) EMPTY-SET FALLBACK
      if candidates is empty: raise ERR_NO_ELIGIBLE_LOT
      return candidates[0]
    input_set: "Lots with status == AVAILABLE only; QUARANTINED, EXPIRED, DISPOSED and DEPLETED lots are never candidates. Partial fills across two lots are not permitted - a single lot must cover the whole line."
    constants:
      SPLIT_ACROSS_LOTS_ALLOWED: false
    precision: "pounds compared at 2 decimal places; days_between uses whole UTC days (floor)"

  - name: bulk_silo_fill_plan
    trigger: "Order fulfillment_status NEW -> ALLOCATED for orders with delivery_mode == BULK; writes OrderLine.silo_id and validates the fill volume"
    algorithm: constraint_propagation
    formula: |
      silo = the SiloAsset with customer_id == order.customer_id AND product_id == line.product_id
             (unique per (customer_id, product_id); enforced by validations priority 15)
      if silo is null: raise ERR_NO_SILO_FOR_PRODUCT
      headroom       = silo.capacity_lb - silo.residual_lb
      contract_room  = line.quantity_lb if line.contract_line_id is null
                       else max(0, cl.volume_committed_lb - cl.volume_drawn_lb + line.quantity_lb)
      # four interacting inputs, nested min over a max
      fillable = min(headroom,
                     line.quantity_lb,
                     TRAILER_COMPARTMENT_LB,
                     contract_room)
      if fillable < line.quantity_lb:   raise ERR_SILO_HEADROOM_INSUFFICIENT
      if fillable < silo.min_fill_lb:   raise ERR_BULK_FILL_BELOW_MIN
      line.silo_id = silo.id
    input_set: "The single SiloAsset matching (order.customer_id, line.product_id); the ContractLine already bound by contract_line_settlement_price; no other silos are considered"
    constants:
      TRAILER_COMPARTMENT_LB: 48000
    precision: "pounds at 2 decimal places; comparisons are exact"

  - name: tech_support_attach_fee
    trigger: "TechSupportEngagement OPEN -> BILLABLE (initial computation) and every POST /tech-engagements/{id}/hours while status == BILLABLE; writes TechSupportEngagement.attach_fee_cents"
    algorithm: tiered_pricing
    formula: |
      billable_hours = max(0, engagement.hours_logged - INCLUDED_HOURS)
      # MARGINAL tiering: the first 8 billable hours bill at the higher rate
      tier1_hours = min(billable_hours, TIER1_HOURS)
      tier2_hours = max(0, billable_hours - TIER1_HOURS)
      gross_cents = tier1_hours * TIER1_RATE_CENTS + tier2_hours * TIER2_RATE_CENTS
      multiplier  = RED_TIER_MULTIPLIER if customer.risk_tier == RED else 1.000
      engagement.attach_fee_cents = round_half_up(gross_cents * multiplier, 0)
    input_set: "engagement.hours_logged as persisted (the running sum of every accepted hours posting) and the owning Customer.risk_tier as persisted at computation time"
    constants:
      BILLABLE_HOURS_THRESHOLD: 4.0
      INCLUDED_HOURS: 2.0
      TIER1_HOURS: 8.0
      TIER1_RATE_CENTS: 18500
      TIER2_RATE_CENTS: 14500
      RED_TIER_MULTIPLIER: 1.250
    precision: "integer cents, round_half_up once after the multiplier; hours carried at 1 decimal place"

  - name: route_load_waterfall
    trigger: "POST /routes/{id}/stops, RouteStop cancellation, route seal, and every cascade that changes a stop's order; writes DeliveryRoute.planned_load_lb, utilization_pct and stop_count"
    algorithm: waterfall_allocation
    formula: |
      stops = RouteStops of the route with status != CANCELLED,
              processed in window_start_at ASC, then created_at ASC   # never id
      route.stop_count      = count(stops)
      route.planned_load_lb = sum(sum(l.quantity_lb for l in OrderLines of stop.order) for stop in stops)
      # compartment waterfall: pour each stop's pounds into compartment 1 until full,
      # spill the remainder into compartment 2; a stop's pounds MAY straddle compartments
      remaining_c1 = COMPARTMENT_LB
      remaining_c2 = COMPARTMENT_LB
      for stop in stops:
          need = pounds(stop)
          take = min(need, remaining_c1); remaining_c1 -= take; need -= take
          take = min(need, remaining_c2); remaining_c2 -= take; need -= take
          if need > 0: raise ERR_ROUTE_CAPACITY_EXCEEDED
      route.utilization_pct = round_half_up(route.planned_load_lb / route.vehicle_capacity_lb * 100, 2)
    input_set: "RouteStops with status IN {PLANNED, DELIVERED, SHORTED}; CANCELLED stops are excluded and contribute 0"
    constants:
      COMPARTMENT_LB: 24000
      COMPARTMENT_COUNT: 2
    precision: "utilization_pct 2 decimal places, round_half_up; pounds at 2 decimal places"

  - name: lot_inventory_conservation
    trigger: "asserted after every mutation that touches a Lot: allocate, deallocate, cancel, quarantine, release, dispose, deliver, short, substitution cascade hop 2"
    algorithm: aggregation
    formula: |
      for every Lot L:
        L.quantity_on_hand_lb + L.quantity_reserved_lb + L.quantity_consumed_lb
          == L.quantity_received_lb
      # The named conserved quantity is POUNDS OF INVENTORY. A forward action
      # (NEW -> ALLOCATED reserving pounds) and its compensating action
      # (ALLOCATED -> NEW, or POST /orders/{id}/cancel) MUST leave this sum, and
      # each of on_hand / reserved / consumed individually, at their pre-action values.
    input_set: "Every Lot row regardless of status; DISPOSED lots hold their written-off pounds in quantity_consumed_lb"
    constants: {}
    precision: "pounds at 2 decimal places; equality is exact at that precision"

  - name: contract_volume_conservation
    trigger: "asserted after every mutation that draws or returns contract volume: order submit, order cancel, RouteStop short, contract EXHAUSTED <-> ACTIVE auto-transitions"
    algorithm: aggregation
    formula: |
      for every ContractLine CL:
        CL.volume_drawn_lb ==
          sum(l.quantity_lb for l in OrderLines
              where l.contract_line_id == CL.id
                and l.Order.pricing_status != VOID)
          - sum(o.short_ship_lb_for_this_product for o in Orders
                where o.fulfillment_status == SHORT_SHIPPED)
        AND 0 <= CL.volume_drawn_lb
        AND contract.drawn_volume_lb == sum(CL.volume_drawn_lb over the contract's lines)
      # The named conserved quantity is COMMITTED CONTRACT POUNDS. A forward action
      # (order submit drawing pounds) and its compensating action (order cancel, or a
      # short shipment returning the undelivered pounds) MUST leave
      # (CL.volume_committed_lb - CL.volume_drawn_lb) at its pre-action value.
    input_set: "OrderLines whose contract_line_id is non-null and whose Order.pricing_status != VOID; VOID orders contribute 0"
    constants: {}
    precision: "pounds at 2 decimal places; equality is exact at that precision"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty on every endpoint"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the eight roles declared in the RBAC matrix"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "request body conforms to the endpoint's input schema: required fields present, types correct, enums members of the declared set, numeric constraints (quantity_lb > 0, volume_committed_lb >= 1000, basis within [-500, 500]) satisfied, and pagination limit within [1, 100]"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints and all list endpoints"
  - priority: 5
    category: existence
    check: "every path-templated resource exists, validated strictly left-to-right (route before stop, contract before line, order before line)"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row (customer_id, product_id, zone_id, contract_id, order_id, order_line_id, proposed_product_id, route_id)"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    applies_to: "POST /orders, POST /orders/{id}/lines, POST /forward-contracts, POST /forward-contracts/{id}/lines, POST /lots, POST /silos, POST /routes/{id}/stops, POST /substitution-requests, POST /tech-engagements, POST /tech-engagements/{id}/attach"
  - priority: 7
    category: auth
    check: "for entity_backed roles, X-User-ID equals the owning foreign key on the target resource (CustomerBuyer: order.customer_id / contract.customer_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /orders, POST /orders/{id}/lines, POST /orders/{id}/submit, POST /orders/{id}/cancel, POST /forward-contracts/{id}/counter, GET /customers/{id}"
  - priority: 8
    category: state
    check: "expected_order_version equals Order.version at the time of the write (OCC on the parent Order)"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /substitution-requests"
  - priority: 9
    category: state
    check: "expected_route_version equals DeliveryRoute.version at the time of the write (OCC on the parent DeliveryRoute)"
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412
    applies_to: "POST /routes/{id}/stops"
  - priority: 10
    category: state
    check: "the target resource's own status is a declared `from:` state for the requested transition in the §1.2 machine for that entity and dimension"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints (paths ending in an action verb segment)"
    note: "Rule 5 pair A, higher side: a submit request that is BOTH already PROVISIONAL and in breach of the customer's allergen program returns ERR_INVALID_STATE_TRANSITION, not ERR_ALLERGEN_PROGRAM_CONFLICT"
  - priority: 11
    category: state
    check: "cross-dimension gate on Order: allocate requires pricing_status IN {PROVISIONAL, FINAL}; finalize-pricing requires fulfillment_status IN {DELIVERED, SHORT_SHIPPED}; attach requires pricing_status == PROVISIONAL"
    error_id: ERR_ORDER_DIMENSION_GATE
    http_status: 409
    applies_to: "POST /orders/{id}/allocate, POST /orders/{id}/finalize-pricing, POST /tech-engagements/{id}/attach"
  - priority: 12
    category: state
    check: "cross-entity state gate: contract must be ACTIVE to price an order; WarehouseZone must be OPEN to release a lot or pick from it; parent Order.fulfillment_status IN {NEW, ALLOCATED} to claim or approve a substitution; DeliveryRoute must be PLANNING to add a stop"
    error_id: ERR_RELATED_ENTITY_STATE_INVALID
    http_status: 409
    applies_to: "POST /orders/{id}/submit, POST /orders/{id}/allocate, POST /lots/{id}/release, POST /substitution-requests/{id}/claim, POST /substitution-requests/{id}/approve, POST /routes/{id}/stops"
  - priority: 13
    category: business_safety
    check: "segregation of duties: the PricingController activating a contract is not its authored_by_user_id, and the QualityManager deciding a SubstitutionRequest is not its requested_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /forward-contracts/{id}/activate, POST /substitution-requests/{id}/claim, POST /substitution-requests/{id}/approve, POST /substitution-requests/{id}/reject"
  - priority: 14
    category: business_safety
    check: "allergen program compatibility: a Customer with allergen_program == GLUTEN_FREE_CERTIFIED may not receive a Product with allergen_class == GLUTEN, and a Customer with allergen_program == NUT_FREE_CERTIFIED may not receive allergen_class IN {TREE_NUT, PEANUT}; additionally a Customer with risk_tier == RED may not receive allergen_class IN {TREE_NUT, PEANUT} regardless of program"
    error_id: ERR_ALLERGEN_PROGRAM_CONFLICT
    http_status: 422
    applies_to: "POST /orders/{id}/lines, POST /orders/{id}/submit, POST /substitution-requests/{id}/approve"
    note: "Rule 5 pair A lower side (loses to priority 10 `state`) and Rule 5 pair B higher side (beats priority 32 `business_fiscal`)"
  - priority: 15
    category: business_safety
    check: "a Lot's zone must be dedicated to its product's allergen class: WarehouseZone.allergen_class == Product.allergen_class"
    error_id: ERR_ALLERGEN_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /lots"
  - priority: 16
    category: business_safety
    check: "trailer allergen segregation: once DeliveryRoute.allergen_class_lock != NONE, every added stop's order lines must all carry that same allergen_class; a route may never mix two non-NONE allergen classes"
    error_id: ERR_ROUTE_ALLERGEN_LOCK_CONFLICT
    http_status: 409
    applies_to: "POST /routes/{id}/stops, POST /routes/{id}/seal"
  - priority: 17
    category: business_safety
    check: "shelf-life rotation: lot_rotation_selector's candidate set must be non-empty for every OrderLine (status AVAILABLE, sufficient on-hand pounds, remaining shelf life >= product.min_rotation_days, zone OPEN and allergen-matched)"
    error_id: ERR_NO_ELIGIBLE_LOT
    http_status: 409
    applies_to: "POST /orders/{id}/allocate, POST /substitution-requests/{id}/approve"
    note: "Rule 6 boundary: the empty-candidate-set edge, reachable via the allocate endpoint"
  - priority: 18
    category: business_referential
    check: "entity links must agree: TechSupportEngagement.customer_id == target Order.customer_id on attach; SiloAsset.product_id == OrderLine.product_id on bulk allocation; SubstitutionRequest.order_line_id's parent Order must be the order whose version was supplied"
    error_id: ERR_ENTITY_LINK_MISMATCH
    http_status: 409
    applies_to: "POST /tech-engagements/{id}/attach, POST /orders/{id}/allocate, POST /substitution-requests"
  - priority: 19
    category: business_temporal
    check: "RouteStop windows on one route may not overlap and must be separated by at least route.service_buffer_minutes. Windows are HALF-OPEN [window_start_at, window_end_at): a new window starting exactly at an existing window_end_at does not overlap, but is still rejected unless (new.window_start_at - existing.window_end_at) >= service_buffer_minutes"
    error_id: ERR_STOP_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /routes/{id}/stops"
    note: "Rule 8 instance 1 (half-open intervals plus a positive separation buffer on DeliveryRoute); Rule 5 pair C higher side (beats priority 26 business_constraint)"
  - priority: 20
    category: business_temporal
    check: "SiloAsset fill windows are CLOSED [last_fill_window_start_at, last_fill_window_end_at]: a BULK stop window whose interval shares even a single endpoint instant with the silo's last accepted fill window is rejected. No buffer applies; touching endpoints collide"
    error_id: ERR_SILO_FILL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /routes/{id}/stops"
    note: "Rule 8 instance 2 (closed intervals with inclusive endpoints and no buffer, on SiloAsset) - deliberately opposite adjacency semantics to priority 19"
  - priority: 21
    category: business_temporal
    check: "WarehouseZone sanitation lockout is a CLOSED aggregate interval [lockout_start_at, lockout_end_at]: no Lot may be received into the zone and no lot may be released while the logical clock instant lies inside it, endpoints included"
    error_id: ERR_ZONE_LOCKOUT_CONFLICT
    http_status: 409
    applies_to: "POST /lots, POST /lots/{id}/release"
  - priority: 22
    category: business_temporal
    check: "contract term coverage: contract.term_start_on <= order.requested_delivery_on <= contract.term_end_on, both endpoints inclusive"
    error_id: ERR_CONTRACT_TERM_NOT_COVERING
    http_status: 422
    applies_to: "POST /orders/{id}/submit"
  - priority: 23
    category: business_temporal
    check: "a CommodityIndexQuote with effective_on <= the variant's observation date exists for every priced index_code"
    error_id: ERR_INDEX_QUOTE_MISSING
    http_status: 422
    applies_to: "POST /orders/{id}/submit, POST /orders/{id}/reprice, POST /orders/{id}/finalize-pricing"
  - priority: 24
    category: business_temporal
    check: "dispatch requires the logical clock date to equal route.service_on, and every stop window must fall inside the service_on UTC day"
    error_id: ERR_ROUTE_DATE_MISMATCH
    http_status: 409
    applies_to: "POST /routes/{id}/dispatch, POST /routes/{id}/stops"
  - priority: 25
    category: business_constraint
    check: "uniqueness: at most one ContractLine per (contract_id, product_id); at most one SiloAsset per (customer_id, product_id); zone_code, lot_code, route_code, sku and Customer.legal_name are globally unique (case-insensitive for legal_name)"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /forward-contracts/{id}/lines, POST /silos, POST /lots, POST /routes, POST /products, POST /customers, POST /warehouse-zones"
  - priority: 26
    category: business_constraint
    check: "route compartment waterfall must absorb every stop's pounds: two 24000 lb compartments, poured in window_start_at ASC then created_at ASC order; and route.planned_load_lb <= route.vehicle_capacity_lb"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /routes/{id}/stops, POST /routes/{id}/seal"
    note: "Rule 5 pair C lower side: a stop that both collides in time and overflows the trailer returns ERR_STOP_WINDOW_CONFLICT"
  - priority: 27
    category: business_constraint
    check: "BULK orders require product.bulk_capable == true on every line and a SiloAsset for (customer_id, product_id)"
    error_id: ERR_PRODUCT_NOT_BULK_CAPABLE
    http_status: 422
    applies_to: "POST /orders/{id}/lines, POST /orders/{id}/allocate"
  - priority: 28
    category: business_constraint
    check: "silo headroom and minimum blow: min(capacity_lb - residual_lb, quantity_lb, 48000, contract room) >= quantity_lb, and the resulting fill >= silo.min_fill_lb"
    error_id: ERR_SILO_HEADROOM_INSUFFICIENT
    http_status: 422
    applies_to: "POST /orders/{id}/allocate"
  - priority: 29
    category: business_constraint
    check: "a bulk fill below the silo's min_fill_lb cannot be blown pneumatically"
    error_id: ERR_BULK_FILL_BELOW_MIN
    http_status: 422
    applies_to: "POST /orders/{id}/allocate"
  - priority: 30
    category: business_constraint
    check: "negotiation and revision caps: contract.negotiation_round < 3 to re-offer a COUNTERED contract; request.revision_round < 2 to request a further revision"
    error_id: ERR_ROUND_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /forward-contracts/{id}/offer, POST /substitution-requests/{id}/request-revision"
  - priority: 31
    category: business_constraint
    check: "drawing volume may not push any ContractLine.volume_drawn_lb above volume_committed_lb; exactly reaching volume_committed_lb is permitted and exhausts the line"
    error_id: ERR_CONTRACT_VOLUME_EXCEEDED
    http_status: 409
    applies_to: "POST /orders/{id}/submit"
  - priority: 32
    category: business_fiscal
    check: "minimum drop: the order's computed total_cents >= customer.min_drop_cents; a total exactly equal to min_drop_cents passes"
    error_id: ERR_MIN_DROP_NOT_MET
    http_status: 422
    applies_to: "POST /orders/{id}/submit, POST /routes/{id}/seal"
    note: "Rule 6 boundary: the >= numeric-threshold edge, reachable via the submit endpoint (distinct metric and endpoint from priority 17's empty-set edge)"
  - priority: 33
    category: business_fiscal
    check: "credit exposure: customer.open_exposure_cents + this order's computed total_cents <= customer.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /orders/{id}/submit"
    note: "Rule 5 pair B lower side: an order that both breaches the allergen program and exceeds credit returns ERR_ALLERGEN_PROGRAM_CONFLICT"
  - priority: 34
    category: business_fiscal
    check: "invoicing requires every TechSupportEngagement with order_id == order.id to have status == ATTACHED"
    error_id: ERR_ENGAGEMENT_NOT_ATTACHED
    http_status: 409
    applies_to: "POST /orders/{id}/invoice"

endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/bakery-distribution/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Advancing the clock evaluates contract expiry and lot expiry auto-transitions."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "ForwardPricingContract ACTIVE/EXHAUSTED -> EXPIRED where logical date > term_end_on"
      - "Lot AVAILABLE/QUARANTINED -> EXPIRED where logical date >= expires_on, releasing reservations through cascade hops 1-4"

  # ---- customers ----
  - method: POST
    path: "/bakery-distribution/customers"
    description: "Registers a bakery account."
    roles: [AccountManager]
    code: 201
    input: [legal_name, allergen_program, credit_limit_cents, "min_drop_cents?"]
    output: Customer
    side_effects: ["status initialised to ACTIVE, allergen_risk_score to 0.00, risk_tier to GREEN, open_exposure_cents to 0"]
  - method: GET
    path: "/bakery-distribution/customers/{id}"
    description: "Reads one customer including computed open_exposure_cents, allergen_risk_score, risk_tier and version."
    roles: [AccountManager, PricingController, CustomerBuyer, QualityManager, PlatformAdmin]
    code: 200
    output: Customer
    input: []
    side_effects: []
  - method: POST
    path: "/bakery-distribution/customers/{id}/credit-limit-adjustments"
    description: "Raises or lowers the account credit limit; the operator surface used when a bakery renegotiates terms."
    roles: [AccountManager]
    code: 200
    input: [new_credit_limit_cents, reason]
    output: Customer
    side_effects:
      - "sets credit_limit_cents"
      - "re-runs calculations.customer_open_exposure, which may move status ACTIVE -> CREDIT_HOLD or CREDIT_HOLD -> ACTIVE"
      - "increments Customer.version by 1"

  # ---- products / zones / index quotes ----
  - method: POST
    path: "/bakery-distribution/products"
    description: "Creates a SKU with its allergen class, shelf life, rotation floor, index linkage and list price."
    roles: [PricingController]
    code: 201
    input: [sku, category, allergen_class, "bulk_capable?", shelf_life_days, "index_code?", list_price_cents_per_lb, "min_rotation_days?"]
    output: Product
    side_effects: []
  - method: GET
    path: "/bakery-distribution/products/{id}"
    description: "Reads one SKU."
    roles: [AccountManager, PricingController, WarehouseOperator, QualityManager, TechnicalSpecialist, LogisticsPlanner, CustomerBuyer, PlatformAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/bakery-distribution/warehouse-zones"
    description: "Creates an allergen-dedicated storage zone."
    roles: [WarehouseOperator]
    code: 201
    input: [zone_code, allergen_class]
    output: WarehouseZone
    side_effects: ["status initialised to OPEN, on_hand_lb to 0"]
  - method: GET
    path: "/bakery-distribution/warehouse-zones/{id}"
    description: "Reads one zone including computed on_hand_lb and its lockout window."
    roles: [WarehouseOperator, QualityManager, LogisticsPlanner, PlatformAdmin]
    code: 200
    input: []
    output: WarehouseZone
    side_effects: []
  - method: POST
    path: "/bakery-distribution/warehouse-zones/{id}/lockout"
    description: "Schedules or clears the allergen-changeover sanitation lockout on a zone (closed interval, endpoints inclusive)."
    roles: [QualityManager]
    code: 200
    input: [lockout_start_at, lockout_end_at, "clear?"]
    output: WarehouseZone
    side_effects:
      - "sets lockout_start_at / lockout_end_at and status -> SANITATION_LOCKOUT when the logical clock lies inside the closed interval, else OPEN"
      - "increments WarehouseZone.version by 1"
  - method: POST
    path: "/bakery-distribution/index-quotes"
    description: "Publishes a commodity index quote effective from a UTC date."
    roles: [PricingController]
    code: 201
    input: [index_code, effective_on, price_cents_per_lb]
    output: CommodityIndexQuote
    side_effects: ["becomes the prevailing quote for observation dates >= effective_on until a later quote is published"]
  - method: GET
    path: "/bakery-distribution/index-quotes"
    description: "Lists published index quotes, newest effective_on first."
    roles: [PricingController, AccountManager, CustomerBuyer, PlatformAdmin]
    code: 200
    input: ["index_code?", "limit?", "offset?"]
    output: CommodityIndexQuote[]
    side_effects: []

  # ---- forward pricing contracts ----
  - method: POST
    path: "/bakery-distribution/forward-contracts"
    description: "Drafts a forward pricing contract for a bakery over a term, pinning which index observation date settles its lines."
    roles: [AccountManager]
    code: 201
    input: [customer_id, term_start_on, term_end_on, pricing_mode]
    output: ForwardPricingContract
    side_effects: ["status initialised to DRAFT, negotiation_round to 0, committed_volume_lb and drawn_volume_lb to 0"]
  - method: GET
    path: "/bakery-distribution/forward-contracts/{id}"
    description: "Reads one contract including status, negotiation_round, committed/drawn volume and version."
    roles: [AccountManager, PricingController, CustomerBuyer, PlatformAdmin]
    code: 200
    input: []
    output: ForwardPricingContract
    side_effects: []
  - method: GET
    path: "/bakery-distribution/forward-contracts"
    description: "Lists contracts, filterable by owning customer and status; ordered by created_at ASC."
    roles: [AccountManager, PricingController, CustomerBuyer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: ForwardPricingContract[]
    side_effects: []
  - method: POST
    path: "/bakery-distribution/forward-contracts/{id}/lines"
    description: "Adds a per-SKU commitment line with basis and optional cap to a DRAFT contract."
    roles: [AccountManager]
    code: 201
    input: [product_id, volume_committed_lb, basis_cents_per_lb, "cap_cents_per_lb?"]
    output: ContractLine
    side_effects:
      - "recomputes ForwardPricingContract.committed_volume_lb"
      - "increments ForwardPricingContract.version by 1"
  - method: GET
    path: "/bakery-distribution/forward-contracts/{id}/lines"
    description: "Lists the commitment lines of one contract, ordered by created_at ASC."
    roles: [AccountManager, PricingController, CustomerBuyer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ContractLine[]
    side_effects: []
  - method: GET
    path: "/bakery-distribution/contract-lines"
    description: "Lists commitment lines across contracts, filterable by contract and SKU; ordered by created_at ASC."
    roles: [AccountManager, PricingController, CustomerBuyer, PlatformAdmin]
    code: 200
    input: ["contract_id?", "product_id?", "limit?", "offset?"]
    output: ContractLine[]
    side_effects: []
  - method: GET
    path: "/bakery-distribution/contract-lines/{id}"
    description: "Reads one commitment line including volume_drawn_lb."
    roles: [AccountManager, PricingController, CustomerBuyer, PlatformAdmin]
    code: 200
    input: []
    output: ContractLine
    side_effects: []
  - method: POST
    path: "/bakery-distribution/forward-contracts/{id}/offer"
    description: "Offers a DRAFT contract to the bakery, or re-offers a COUNTERED one (negotiation round)."
    roles: [AccountManager]
    code: 200
    input: []
    output: ForwardPricingContract
    side_effects:
      - "DRAFT -> OFFERED, or COUNTERED -> OFFERED with negotiation_round + 1"
      - "sets authored_by_user_id = X-User-ID; increments version by 1"
  - method: POST
    path: "/bakery-distribution/forward-contracts/{id}/counter"
    description: "Bakery counters the offered basis on every line of the contract."
    roles: [CustomerBuyer]
    code: 200
    input: [counter_basis_cents_per_lb]
    output: ForwardPricingContract
    side_effects:
      - "OFFERED -> COUNTERED; replaces basis_cents_per_lb on every ContractLine"
      - "increments version by 1"
  - method: POST
    path: "/bakery-distribution/forward-contracts/{id}/activate"
    description: "Pricing control activates an offered contract. The activating controller may not be the account manager who authored it."
    roles: [PricingController]
    code: 200
    input: []
    output: ForwardPricingContract
    side_effects:
      - "OFFERED -> ACTIVE; sets approved_by_user_id = X-User-ID; increments version by 1"
  - method: POST
    path: "/bakery-distribution/forward-contracts/{id}/terminate"
    description: "Terminates a contract in any non-terminal state."
    roles: [PricingController]
    code: 200
    input: [reason]
    output: ForwardPricingContract
    side_effects:
      - "-> TERMINATED; PROVISIONAL orders on this contract fall back to list pricing on their next reprice; increments version by 1"

  # ---- inventory: lots and silos ----
  - method: POST
    path: "/bakery-distribution/lots"
    description: "Receives a supplier lot into an allergen-matched zone; expires_on is computed from the product's shelf life."
    roles: [WarehouseOperator]
    code: 201
    input: [lot_code, product_id, zone_id, manufactured_on, quantity_received_lb]
    output: Lot
    side_effects:
      - "computes expires_on = manufactured_on + product.shelf_life_days days"
      - "sets quantity_on_hand_lb = quantity_received_lb, reserved and consumed to 0, status AVAILABLE"
      - "recomputes WarehouseZone.on_hand_lb"
  - method: GET
    path: "/bakery-distribution/lots"
    description: "Lists lots, filterable by SKU, zone and status; ordered by expires_on ASC then created_at ASC."
    roles: [WarehouseOperator, QualityManager, LogisticsPlanner, PricingController, PlatformAdmin]
    code: 200
    input: ["product_id?", "zone_id?", "status?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []
  - method: GET
    path: "/bakery-distribution/lots/{id}"
    description: "Reads one lot including its three quantity buckets."
    roles: [WarehouseOperator, QualityManager, LogisticsPlanner, PricingController, PlatformAdmin]
    code: 200
    input: []
    output: Lot
    side_effects: []
  - method: POST
    path: "/bakery-distribution/lots/{id}/quarantine"
    description: "Quarantines a lot, firing the four-hop release cascade over order lines, orders, route stops and routes."
    roles: [QualityManager]
    code: 200
    input: [quarantine_reason]
    output: Lot
    side_effects:
      - "AVAILABLE -> QUARANTINED (cascade hops 1-4 per §1.2 Lot)"
      - "recomputes WarehouseZone.on_hand_lb and DeliveryRoute load fields"
  - method: POST
    path: "/bakery-distribution/lots/{id}/release"
    description: "Returns a quarantined lot to AVAILABLE."
    roles: [QualityManager]
    code: 200
    input: []
    output: Lot
    side_effects: ["QUARANTINED -> AVAILABLE; clears quarantine_reason; recomputes WarehouseZone.on_hand_lb"]
  - method: POST
    path: "/bakery-distribution/lots/{id}/dispose"
    description: "Writes off a quarantined lot; on-hand pounds move into quantity_consumed_lb so the conservation invariant holds."
    roles: [QualityManager]
    code: 200
    input: ["disposal_note?"]
    output: Lot
    side_effects: ["QUARANTINED -> DISPOSED; recomputes WarehouseZone.on_hand_lb"]
  - method: POST
    path: "/bakery-distribution/silos"
    description: "Registers a customer-site silo dedicated to one bulk-capable SKU."
    roles: [WarehouseOperator]
    code: 201
    input: [silo_code, customer_id, product_id, capacity_lb, "min_fill_lb?"]
    output: SiloAsset
    side_effects: ["residual_lb initialised to 0; fill window fields null"]
  - method: GET
    path: "/bakery-distribution/silos"
    description: "Lists silos, filterable by customer and SKU; ordered by created_at ASC."
    roles: [WarehouseOperator, LogisticsPlanner, CustomerBuyer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "product_id?", "limit?", "offset?"]
    output: SiloAsset[]
    side_effects: []
  - method: GET
    path: "/bakery-distribution/silos/{id}"
    description: "Reads one silo including residual_lb and its last accepted fill window."
    roles: [WarehouseOperator, LogisticsPlanner, CustomerBuyer, PlatformAdmin]
    code: 200
    input: []
    output: SiloAsset
    side_effects: []
  - method: POST
    path: "/bakery-distribution/silos/{id}/residual-readings"
    description: "Records a level-probe reading of pounds remaining in the silo; overwrites residual_lb (the operator surface bakeries use to report consumption between fills)."
    roles: [WarehouseOperator, CustomerBuyer]
    code: 200
    input: [measured_residual_lb]
    output: SiloAsset
    side_effects:
      - "sets residual_lb = measured_residual_lb (must be >= 0 and <= capacity_lb)"
      - "increments SiloAsset.version by 1"

  # ---- orders ----
  - method: POST
    path: "/bakery-distribution/orders"
    description: "Opens an UNPRICED order for a bakery, choosing bulk or bagged delivery and a requested delivery date."
    roles: [CustomerBuyer]
    code: 201
    input: [customer_id, delivery_mode, requested_delivery_on, "contract_id?"]
    output: Order
    side_effects: ["fulfillment_status NEW, pricing_status UNPRICED, all money fields 0, surge_window false"]
  - method: GET
    path: "/bakery-distribution/orders/{id}"
    description: "Reads one order including both status dimensions, every money field and version."
    roles: [CustomerBuyer, AccountManager, PricingController, WarehouseOperator, LogisticsPlanner, TechnicalSpecialist, QualityManager, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/bakery-distribution/orders"
    description: "Lists orders, filterable by customer, contract and either status dimension; ordered by created_at ASC."
    roles: [CustomerBuyer, AccountManager, PricingController, WarehouseOperator, LogisticsPlanner, PlatformAdmin]
    code: 200
    input: ["customer_id?", "contract_id?", "fulfillment_status?", "pricing_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/bakery-distribution/orders/{id}/lines"
    description: "Adds a SKU line to an UNPRICED order."
    roles: [CustomerBuyer]
    code: 201
    input: [product_id, quantity_lb]
    output: OrderLine
    side_effects:
      - "allocation_status UNALLOCATED; unit_price_cents and extended_cents 0 until submission"
      - "increments Order.version by 1"
  - method: GET
    path: "/bakery-distribution/orders/{id}/lines"
    description: "Lists the lines of one order, ordered by created_at ASC."
    roles: [CustomerBuyer, AccountManager, PricingController, WarehouseOperator, TechnicalSpecialist, QualityManager, LogisticsPlanner, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/bakery-distribution/order-lines"
    description: "Lists order lines across orders, filterable by order, SKU, substituted-from SKU, picked lot, destination silo and priced contract line; ordered by created_at ASC."
    roles: [CustomerBuyer, AccountManager, PricingController, WarehouseOperator, TechnicalSpecialist, QualityManager, LogisticsPlanner, PlatformAdmin]
    code: 200
    input: ["order_id?", "product_id?", "substituted_from_product_id?", "lot_id?", "silo_id?", "contract_line_id?", "allocation_status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/bakery-distribution/order-lines/{id}"
    description: "Reads one order line including its picked lot, destination silo and settled prices."
    roles: [CustomerBuyer, AccountManager, PricingController, WarehouseOperator, TechnicalSpecialist, QualityManager, LogisticsPlanner, PlatformAdmin]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: POST
    path: "/bakery-distribution/orders/{id}/submit"
    description: "Submits the order: prices every line at the order-date index, checks minimum drop and credit, and draws contract volume."
    roles: [CustomerBuyer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "pricing_status UNPRICED -> PROVISIONAL; sets order_placed_on to the logical clock date"
      - "runs contract_line_settlement_price (provisional_order_date), order_line_extended_price, order_total_settlement"
      - "ContractLine.volume_drawn_lb += line pounds; contract may auto-transition ACTIVE -> EXHAUSTED"
      - "recomputes Customer.open_exposure_cents"
      - "increments Order.version by 1"
  - method: POST
    path: "/bakery-distribution/orders/{id}/reprice"
    description: "Re-runs provisional pricing on a PROVISIONAL order (used after an index quote is published or a contract is terminated)."
    roles: [PricingController]
    code: 200
    input: []
    output: Order
    side_effects:
      - "PROVISIONAL -> PROVISIONAL self-loop; recomputes subtotal, fuel surcharge, rebate and total"
      - "recomputes Customer.open_exposure_cents, which may move the customer ACTIVE -> CREDIT_HOLD"
      - "increments Order.version by 1"
  - method: POST
    path: "/bakery-distribution/orders/{id}/allocate"
    description: "Reserves inventory: FEFO lot selection per line plus silo assignment and fill-volume checks for bulk orders."
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: Order
    side_effects:
      - "fulfillment_status NEW -> ALLOCATED; each line RESERVED with a lot_id (and silo_id when BULK)"
      - "Lot pounds move on_hand -> reserved; WarehouseZone.on_hand_lb recomputed"
      - "recomputes Customer.allergen_risk_score (exposure_provisional) and risk_tier"
      - "increments Order.version by 1"
  - method: POST
    path: "/bakery-distribution/orders/{id}/deallocate"
    description: "Compensating action for allocation: releases every reservation and returns the order to NEW."
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: Order
    side_effects:
      - "fulfillment_status ALLOCATED -> NEW; lines UNALLOCATED with lot_id and silo_id cleared"
      - "Lot pounds move reserved -> on_hand, restoring lot_inventory_conservation to its pre-allocation values"
      - "recomputes Customer.allergen_risk_score (exposure_provisional) and risk_tier"
      - "increments Order.version by 1"
  - method: POST
    path: "/bakery-distribution/orders/{id}/cancel"
    description: "Bakery cancels a NEW or ALLOCATED order; voids pricing and returns drawn contract volume."
    roles: [CustomerBuyer]
    code: 200
    input: ["cancellation_reason?"]
    output: Order
    side_effects:
      - "fulfillment_status -> CANCELLED and pricing_status -> VOID; money fields reset to 0"
      - "releases reservations; reduces ContractLine.volume_drawn_lb, restoring contract_volume_conservation"
      - "contract may auto-transition EXHAUSTED -> ACTIVE; recomputes Customer.open_exposure_cents"
      - "increments Order.version by 1"
  - method: POST
    path: "/bakery-distribution/orders/{id}/finalize-pricing"
    description: "Settles a delivered order at the delivery-date index when the contract prices on delivery."
    roles: [PricingController]
    code: 200
    input: []
    output: Order
    side_effects:
      - "pricing_status PROVISIONAL -> FINAL; re-runs contract_line_settlement_price (final_delivery_date) and the two downstream calculations"
      - "recomputes Customer.open_exposure_cents; increments Order.version by 1"
  - method: POST
    path: "/bakery-distribution/orders/{id}/invoice"
    description: "Invoices a FINAL order, freezing its totals and clearing it from open exposure."
    roles: [PricingController]
    code: 200
    input: []
    output: Order
    side_effects:
      - "pricing_status FINAL -> INVOICED; recomputes Customer.open_exposure_cents, possibly CREDIT_HOLD -> ACTIVE"
      - "increments Order.version by 1"
  - method: GET
    path: "/bakery-distribution/orders/{id}/pricing-summary"
    description: "Computed read: per-line unit and extended prices alongside the order's surcharge, rebate and total, plus the index quote used per line."
    roles: [CustomerBuyer, AccountManager, PricingController, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []

  # ---- substitution and approval ----
  - method: POST
    path: "/bakery-distribution/substitution-requests"
    description: "A technical specialist proposes a replacement SKU on an order line. Creating a request supersedes any earlier REQUESTED or REVISION_REQUESTED request on the same line (moved to WITHDRAWN), so OCC on the parent order's version is required."
    roles: [TechnicalSpecialist]
    code: 201
    input: [order_line_id, proposed_product_id, rationale, expected_order_version]
    output: SubstitutionRequest
    side_effects:
      - "status REQUESTED, revision_round 0, requested_by_user_id = X-User-ID"
      - "any earlier open request on the same order_line_id -> WITHDRAWN"
      - "increments Order.version by 1"
  - method: GET
    path: "/bakery-distribution/substitution-requests"
    description: "Lists substitution requests, filterable by order line, proposed SKU and status; ordered by created_at ASC."
    roles: [TechnicalSpecialist, QualityManager, AccountManager, PricingController, PlatformAdmin]
    code: 200
    input: ["order_line_id?", "proposed_product_id?", "status?", "limit?", "offset?"]
    output: SubstitutionRequest[]
    side_effects: []
  - method: GET
    path: "/bakery-distribution/substitution-requests/{id}"
    description: "Reads one substitution request including revision_round and both actor ids."
    roles: [TechnicalSpecialist, QualityManager, AccountManager, PricingController, PlatformAdmin]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: []
  - method: POST
    path: "/bakery-distribution/substitution-requests/{id}/claim"
    description: "Quality takes the request under review; the claimant may not be the requester."
    roles: [QualityManager]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: ["REQUESTED -> UNDER_REVIEW; sets decided_by_user_id = X-User-ID"]
  - method: POST
    path: "/bakery-distribution/substitution-requests/{id}/request-revision"
    description: "Sends the request back to the specialist for a revised proposal (max 2 revision rounds)."
    roles: [QualityManager]
    code: 200
    input: [revision_note]
    output: SubstitutionRequest
    side_effects: ["UNDER_REVIEW -> REVISION_REQUESTED; clears decided_by_user_id"]
  - method: POST
    path: "/bakery-distribution/substitution-requests/{id}/resubmit"
    description: "Specialist resubmits a revised proposal, re-entering the review cycle."
    roles: [TechnicalSpecialist]
    code: 200
    input: [proposed_product_id, rationale]
    output: SubstitutionRequest
    side_effects: ["REVISION_REQUESTED -> REQUESTED; revision_round + 1; replaces proposed_product_id and rationale"]
  - method: POST
    path: "/bakery-distribution/substitution-requests/{id}/approve"
    description: "Quality approves the swap, firing the five-hop cascade over the order line, inventory, pricing, credit and allergen risk."
    roles: [QualityManager]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects:
      - "UNDER_REVIEW -> APPROVED (cascade hops 1-5 per §1.2 SubstitutionRequest)"
      - "increments Order.version by 1"
  - method: POST
    path: "/bakery-distribution/substitution-requests/{id}/reject"
    description: "Quality rejects the swap; the order line is untouched."
    roles: [QualityManager]
    code: 200
    input: ["decision_note?"]
    output: SubstitutionRequest
    side_effects: ["UNDER_REVIEW -> REJECTED; no cascade"]
  - method: POST
    path: "/bakery-distribution/substitution-requests/{id}/withdraw"
    description: "Specialist withdraws their own request."
    roles: [TechnicalSpecialist]
    code: 200
    input: []
    output: SubstitutionRequest
    side_effects: ["REQUESTED or REVISION_REQUESTED -> WITHDRAWN"]

  # ---- routes and stops ----
  - method: POST
    path: "/bakery-distribution/routes"
    description: "Creates a delivery route for a service date with a trailer capacity and inter-stop service buffer."
    roles: [LogisticsPlanner]
    code: 201
    input: [route_code, service_on, vehicle_capacity_lb, "service_buffer_minutes?"]
    output: DeliveryRoute
    side_effects: ["status PLANNING, allergen_class_lock NONE, load fields 0"]
  - method: GET
    path: "/bakery-distribution/routes/{id}"
    description: "Reads one route including allergen_class_lock, planned_load_lb, utilization_pct, stop_count and version."
    roles: [LogisticsPlanner, WarehouseOperator, QualityManager, PlatformAdmin]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: []
  - method: GET
    path: "/bakery-distribution/routes"
    description: "Lists routes, filterable by service date and status; ordered by service_on ASC then created_at ASC."
    roles: [LogisticsPlanner, WarehouseOperator, QualityManager, PlatformAdmin]
    code: 200
    input: ["service_on?", "status?", "limit?", "offset?"]
    output: DeliveryRoute[]
    side_effects: []
  - method: POST
    path: "/bakery-distribution/routes/{id}/stops"
    description: "Appends a multi-stop drop for an allocated order with a half-open delivery window. Requires the route version the planner last observed."
    roles: [LogisticsPlanner]
    code: 201
    input: [order_id, window_start_at, window_end_at, expected_route_version]
    output: RouteStop
    side_effects:
      - "status PLANNED; Order fulfillment_status ALLOCATED -> ROUTED"
      - "sets DeliveryRoute.allergen_class_lock from the order's allergen class when it is still NONE"
      - "re-runs route_load_waterfall (planned_load_lb, utilization_pct, stop_count)"
      - "increments DeliveryRoute.version by 1"
  - method: GET
    path: "/bakery-distribution/routes/{id}/stops"
    description: "Lists the stops of one route in window_start_at ASC then created_at ASC order."
    roles: [LogisticsPlanner, WarehouseOperator, QualityManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: RouteStop[]
    side_effects: []
  - method: GET
    path: "/bakery-distribution/route-stops"
    description: "Lists stops across routes, filterable by route, order and status."
    roles: [LogisticsPlanner, WarehouseOperator, QualityManager, CustomerBuyer, PlatformAdmin]
    code: 200
    input: ["route_id?", "order_id?", "status?", "limit?", "offset?"]
    output: RouteStop[]
    side_effects: []
  - method: GET
    path: "/bakery-distribution/route-stops/{id}"
    description: "Reads one stop including its assigned sequence_no."
    roles: [LogisticsPlanner, WarehouseOperator, QualityManager, CustomerBuyer, PlatformAdmin]
    code: 200
    input: []
    output: RouteStop
    side_effects: []
  - method: DELETE
    path: "/bakery-distribution/route-stops/{id}"
    description: "Cancels a planned stop on a PLANNING or SEALED route."
    roles: [LogisticsPlanner]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "stop.status -> CANCELLED; Order fulfillment_status ROUTED -> ALLOCATED"
      - "re-runs route_load_waterfall; when stop_count reaches 0 on a SEALED route it reverts to PLANNING and allergen_class_lock resets to NONE"
      - "increments DeliveryRoute.version by 1"
  - method: POST
    path: "/bakery-distribution/routes/{id}/seal"
    description: "Seals the load plan, assigning stop sequence numbers."
    roles: [LogisticsPlanner]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["PLANNING -> SEALED; assigns RouteStop.sequence_no; increments version by 1"]
  - method: POST
    path: "/bakery-distribution/routes/{id}/unseal"
    description: "Reopens a sealed route for planning."
    roles: [LogisticsPlanner]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["SEALED -> PLANNING; clears sequence numbers; increments version by 1"]
  - method: POST
    path: "/bakery-distribution/routes/{id}/dispatch"
    description: "Dispatches the trailer on its service date; every routed order becomes LOADED."
    roles: [LogisticsPlanner]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["SEALED -> DISPATCHED; each stop's Order ROUTED -> LOADED; increments version by 1"]
  - method: POST
    path: "/bakery-distribution/routes/{id}/abort"
    description: "Aborts a dispatched route before any drop has been made; loaded orders fall back to ALLOCATED."
    roles: [LogisticsPlanner]
    code: 200
    input: [abort_reason]
    output: DeliveryRoute
    side_effects: ["DISPATCHED -> ABORTED; PLANNED stops -> CANCELLED; Orders LOADED -> ALLOCATED; increments version by 1"]
  - method: POST
    path: "/bakery-distribution/route-stops/{id}/deliver"
    description: "Confirms a full drop: consumes reserved pounds, fills the silo on bulk lines, and stamps delivered_on."
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: RouteStop
    side_effects:
      - "stop -> DELIVERED; Order LOADED -> DELIVERED; lines SHIPPED; Lot reserved -> consumed"
      - "BULK: SiloAsset.residual_lb += delivered pounds and the fill window fields are set from the stop window"
      - "recomputes Customer.allergen_risk_score (exposure_audited) and risk_tier; may auto-transition Lot -> DEPLETED and DeliveryRoute -> COMPLETED"
  - method: POST
    path: "/bakery-distribution/route-stops/{id}/short"
    description: "Confirms a partial drop: undelivered pounds return to inventory and to the contract line."
    roles: [WarehouseOperator]
    code: 200
    input: [delivered_lb_total, short_reason]
    output: RouteStop
    side_effects:
      - "stop -> SHORTED; Order LOADED -> SHORT_SHIPPED with short_ship_lb set"
      - "delivered pounds move Lot reserved -> consumed; shorted pounds move Lot reserved -> on_hand"
      - "ContractLine.volume_drawn_lb reduced by the shorted pounds, restoring contract_volume_conservation"
      - "recomputes Customer.allergen_risk_score (exposure_audited); may auto-transition DeliveryRoute -> COMPLETED"

  # ---- technical / formulation support ----
  - method: POST
    path: "/bakery-distribution/tech-engagements"
    description: "Opens a formulation-support engagement for a bakery on one SKU."
    roles: [TechnicalSpecialist]
    code: 201
    input: [customer_id, product_id]
    output: TechSupportEngagement
    side_effects: ["status OPEN, hours_logged 0, attach_fee_cents 0, assigned_specialist_user_id = X-User-ID"]
  - method: GET
    path: "/bakery-distribution/tech-engagements"
    description: "Lists engagements, filterable by customer, SKU, billed order and status."
    roles: [TechnicalSpecialist, AccountManager, PricingController, CustomerBuyer, PlatformAdmin]
    code: 200
    input: ["customer_id?", "product_id?", "order_id?", "status?", "limit?", "offset?"]
    output: TechSupportEngagement[]
    side_effects: []
  - method: GET
    path: "/bakery-distribution/tech-engagements/{id}"
    description: "Reads one engagement including hours_logged and attach_fee_cents."
    roles: [TechnicalSpecialist, AccountManager, PricingController, CustomerBuyer, PlatformAdmin]
    code: 200
    input: []
    output: TechSupportEngagement
    side_effects: []
  - method: POST
    path: "/bakery-distribution/tech-engagements/{id}/hours"
    description: "Logs bench hours against the engagement; crossing the billable threshold computes the attach fee."
    roles: [TechnicalSpecialist]
    code: 200
    input: [hours, "work_note?"]
    output: TechSupportEngagement
    side_effects:
      - "hours_logged += hours (1 decimal place)"
      - "OPEN -> BILLABLE once hours_logged >= 4.0; recomputes attach_fee_cents via tech_support_attach_fee"
  - method: POST
    path: "/bakery-distribution/tech-engagements/{id}/attach"
    description: "Attaches the support fee to a provisional order of the same bakery, repricing that order."
    roles: [TechnicalSpecialist]
    code: 200
    input: [order_id]
    output: TechSupportEngagement
    side_effects:
      - "BILLABLE -> ATTACHED; sets order_id; sets Order.tech_attach_fee_cents and reprices the order"
      - "recomputes Customer.open_exposure_cents; increments Order.version by 1"
  - method: POST
    path: "/bakery-distribution/tech-engagements/{id}/waive"
    description: "Account management waives the support fee on an unattached engagement."
    roles: [AccountManager]
    code: 200
    input: [waiver_reason]
    output: TechSupportEngagement
    side_effects: ["OPEN or BILLABLE -> WAIVED; attach_fee_cents set to 0"]

errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the eight declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "acting role is not listed in the target endpoint's roles"
  - id: ERR_VALIDATION
    http: 400
    condition: "request body or query fails schema validation: missing required field, wrong type, enum outside the declared set, quantity_lb <= 0, volume_committed_lb < 1000, basis outside [-500, 500], measured_residual_lb outside [0, capacity_lb], hours <= 0, or pagination limit outside [1, 100]"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "a path-templated resource does not exist (checked left-to-right)"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "a foreign key in the request body does not resolve to an existing row"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource whose owning foreign key differs from X-User-ID"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not equal the parent Order.version on POST /substitution-requests"
  - id: ERR_STALE_ROUTE_VERSION
    http: 412
    condition: "expected_route_version does not equal the parent DeliveryRoute.version on POST /routes/{id}/stops"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the target resource's current status is not a declared from-state for the requested transition (includes re-submitting, re-approving, or acting on a terminal resource)"
  - id: ERR_ORDER_DIMENSION_GATE
    http: 409
    condition: "the order's other status dimension blocks the operation: allocating an UNPRICED order, finalizing pricing before delivery, or attaching support hours to a FINAL or INVOICED order"
  - id: ERR_RELATED_ENTITY_STATE_INVALID
    http: 409
    condition: "a referenced entity is in a state that forbids the operation: contract not ACTIVE at submission, WarehouseZone not OPEN, parent Order past ALLOCATED on substitution claim or approval, DeliveryRoute not PLANNING when adding a stop"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same operator id would perform two segregated steps: authoring and activating a contract, or raising and deciding a substitution request"
  - id: ERR_ALLERGEN_PROGRAM_CONFLICT
    http: 422
    condition: "the SKU's allergen_class is forbidden for the customer's allergen_program, or the customer's risk_tier is RED and the SKU is TREE_NUT or PEANUT"
  - id: ERR_ALLERGEN_ZONE_MISMATCH
    http: 422
    condition: "a lot is received into a zone whose allergen_class differs from the product's allergen_class"
  - id: ERR_ROUTE_ALLERGEN_LOCK_CONFLICT
    http: 409
    condition: "a stop would put a second, different non-NONE allergen class on a trailer already locked to one class"
  - id: ERR_NO_ELIGIBLE_LOT
    http: 409
    condition: "lot_rotation_selector's candidate set is empty for some order line (no AVAILABLE, allergen-matched, sufficiently fresh lot with enough on-hand pounds in an OPEN zone)"
  - id: ERR_ENTITY_LINK_MISMATCH
    http: 409
    condition: "linked entities disagree: engagement customer differs from the order's customer, silo product differs from the line's product, or the supplied order version belongs to a different order than the order line"
  - id: ERR_STOP_WINDOW_CONFLICT
    http: 409
    condition: "a new half-open stop window [start, end) overlaps an existing stop window on the same route, or is separated from it by less than service_buffer_minutes"
  - id: ERR_SILO_FILL_WINDOW_CONFLICT
    http: 409
    condition: "a bulk stop window shares at least one instant, endpoints included, with the destination silo's last accepted closed fill window"
  - id: ERR_ZONE_LOCKOUT_CONFLICT
    http: 409
    condition: "a lot receipt or release occurs while the logical clock lies inside the zone's closed sanitation lockout interval"
  - id: ERR_CONTRACT_TERM_NOT_COVERING
    http: 422
    condition: "order.requested_delivery_on falls outside the inclusive contract term"
  - id: ERR_CONTRACT_TERM_OVERLAP
    http: 409
    condition: "activating a contract whose term overlaps another ACTIVE contract of the same customer on a shared product_id"
  - id: ERR_INDEX_QUOTE_MISSING
    http: 422
    condition: "no CommodityIndexQuote exists with effective_on <= the variant's observation date for a priced index_code"
  - id: ERR_ROUTE_DATE_MISMATCH
    http: 409
    condition: "dispatch attempted on a logical clock date other than route.service_on, or a stop window falls outside the service_on UTC day"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "a uniqueness constraint is violated: (contract_id, product_id) contract line, (customer_id, product_id) silo, (index_code, effective_on) quote, or a duplicate sku / lot_code / zone_code / route_code / legal_name"
  - id: ERR_ROUTE_CAPACITY_EXCEEDED
    http: 409
    condition: "the compartment waterfall cannot absorb a stop's pounds, or planned_load_lb would exceed vehicle_capacity_lb"
  - id: ERR_PRODUCT_NOT_BULK_CAPABLE
    http: 422
    condition: "a BULK order contains a line whose product.bulk_capable is false"
  - id: ERR_NO_SILO_FOR_PRODUCT
    http: 422
    condition: "a BULK order line has no SiloAsset registered for (order.customer_id, line.product_id)"
  - id: ERR_SILO_HEADROOM_INSUFFICIENT
    http: 422
    condition: "the nested min of silo headroom, line pounds, trailer compartment and contract room is below the line's requested pounds"
  - id: ERR_BULK_FILL_BELOW_MIN
    http: 422
    condition: "the computed fill is below the silo's min_fill_lb so it cannot be blown pneumatically"
  - id: ERR_ROUND_LIMIT_REACHED
    http: 409
    condition: "a fourth contract negotiation round or a third substitution revision round is attempted"
  - id: ERR_CONTRACT_VOLUME_EXCEEDED
    http: 409
    condition: "submitting the order would push a ContractLine.volume_drawn_lb strictly above volume_committed_lb; reaching it exactly is allowed"
  - id: ERR_MIN_DROP_NOT_MET
    http: 422
    condition: "the order's computed total_cents is strictly below customer.min_drop_cents; equality passes"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "open_exposure_cents plus this order's total_cents would strictly exceed credit_limit_cents"
  - id: ERR_ENGAGEMENT_NOT_ATTACHED
    http: 409
    condition: "invoicing an order that still has a TechSupportEngagement whose status is not ATTACHED"
  - id: ERR_SHORT_QUANTITY_INVALID
    http: 422
    condition: "delivered_lb_total on a short drop is not strictly between 0 and the order's total requested pounds"

roles:
  - name: CustomerBuyer
    description: "Purchasing contact at the bakery: opens and submits orders, counters forward offers, cancels, reports silo levels."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders"
      - "POST /orders/{id}/lines"
      - "POST /orders/{id}/submit"
      - "POST /orders/{id}/cancel"
      - "POST /forward-contracts/{id}/counter"
    shared_operations:
      - "POST /silos/{id}/residual-readings (with WarehouseOperator)"
      - "all GET reads scoped to their own customer_id"
  - name: AccountManager
    description: "Commercial owner of the bakery account: creates customers, authors and offers forward contracts, adjusts credit limits, waives support fees. May never activate a contract they authored."
    identity: "opaque"
    exclusive_operations:
      - "POST /customers"
      - "POST /customers/{id}/credit-limit-adjustments"
      - "POST /forward-contracts"
      - "POST /forward-contracts/{id}/lines"
      - "POST /forward-contracts/{id}/offer"
      - "POST /tech-engagements/{id}/waive"
    shared_operations:
      - "GET reads on customers, contracts, contract lines, orders, order lines, engagements and index quotes"
  - name: PricingController
    description: "Pricing governance: publishes index quotes and product list prices, activates or terminates contracts, reprices, finalizes and invoices orders. Segregated from contract authorship."
    identity: "opaque"
    exclusive_operations:
      - "POST /products"
      - "POST /index-quotes"
      - "POST /forward-contracts/{id}/activate"
      - "POST /forward-contracts/{id}/terminate"
      - "POST /orders/{id}/reprice"
      - "POST /orders/{id}/finalize-pricing"
      - "POST /orders/{id}/invoice"
    shared_operations:
      - "GET reads on customers, contracts, contract lines, orders, order lines, lots and engagements"
  - name: WarehouseOperator
    description: "Distribution centre floor: creates zones and silos, receives lots, allocates and deallocates orders, confirms full and short drops."
    identity: "opaque"
    exclusive_operations:
      - "POST /warehouse-zones"
      - "POST /lots"
      - "POST /silos"
      - "POST /orders/{id}/allocate"
      - "POST /orders/{id}/deallocate"
      - "POST /route-stops/{id}/deliver"
      - "POST /route-stops/{id}/short"
    shared_operations:
      - "POST /silos/{id}/residual-readings (with CustomerBuyer)"
      - "GET reads on lots, zones, silos, orders, order lines, routes and stops"
  - name: QualityManager
    description: "Food-safety and allergen authority: schedules zone sanitation lockouts, quarantines, releases and disposes lots, and decides substitution requests. May never decide a request they raised."
    identity: "opaque"
    exclusive_operations:
      - "POST /warehouse-zones/{id}/lockout"
      - "POST /lots/{id}/quarantine"
      - "POST /lots/{id}/release"
      - "POST /lots/{id}/dispose"
      - "POST /substitution-requests/{id}/claim"
      - "POST /substitution-requests/{id}/request-revision"
      - "POST /substitution-requests/{id}/approve"
      - "POST /substitution-requests/{id}/reject"
    shared_operations:
      - "GET reads on lots, zones, orders, order lines, substitution requests, routes and stops"
  - name: TechnicalSpecialist
    description: "Formulation and bakery-technology support: opens engagements, logs bench hours, attaches support fees to orders, and raises or withdraws substitution proposals."
    identity: "opaque"
    exclusive_operations:
      - "POST /tech-engagements"
      - "POST /tech-engagements/{id}/hours"
      - "POST /tech-engagements/{id}/attach"
      - "POST /substitution-requests"
      - "POST /substitution-requests/{id}/resubmit"
      - "POST /substitution-requests/{id}/withdraw"
    shared_operations:
      - "GET reads on engagements, orders, order lines, substitution requests and products"
  - name: LogisticsPlanner
    description: "Transport planning: builds multi-stop routes, appends and cancels stops, seals, unseals, dispatches and aborts."
    identity: "opaque"
    exclusive_operations:
      - "POST /routes"
      - "POST /routes/{id}/stops"
      - "DELETE /route-stops/{id}"
      - "POST /routes/{id}/seal"
      - "POST /routes/{id}/unseal"
      - "POST /routes/{id}/dispatch"
      - "POST /routes/{id}/abort"
    shared_operations:
      - "GET reads on routes, stops, orders, order lines, lots, silos and zones"
  - name: PlatformAdmin
    description: "Operations engineering: drives the logical clock and holds read access across every collection for audit."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint declared in §1.5"
