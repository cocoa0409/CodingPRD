            - "GET /soc/gaps?engagement_id=${eng} returns total_count == 0"

      - name: corner_action_level_role_split_inside_shared_transition_endpoints
        claim_type: role_denial
        grounds: ["roles.AccountExecutive", "roles.ComplianceLead", "roles.EvidenceReviewer", "errors[ERR_ROLE_NOT_PERMITTED]"]
        distinguishing_aspect: "POST /soc/report-distributions/{id}/transitions is shared, but APPROVE is ComplianceLead-only: the AccountExecutive who legitimately issued REQUEST_NDA is denied APPROVE with 403 ERR_ROLE_NOT_PERMITTED, and the ComplianceLead then succeeds on the identical payload."
        test_recipe:
          setup:
