      - "GET /bundle-activations/{activationId}/timeliness-report"
      - "POST /bundle-activations/{activationId}/checklist-items/{itemId}/complete"
      - "POST /fetal-monitoring-assessments"
      - "GET /fetal-monitoring-assessments"
      - "GET /fetal-monitoring-assessments/{assessmentId}"
      - "POST /fetal-monitoring-assessments/{assessmentId}/escalate"
      - "GET /emergency-cesareans"
      - "GET /emergency-cesareans/{eventId}"
      - "POST /obstetric-units/{unitId}/cesarean-readiness-drills"
      - "GET /obstetric-units/{unitId}/cesarean-readiness-drills"
      - "GET /cesarean-readiness-drills/{drillId}"
      - "POST /cesarean-readiness-drills/{drillId}/document"
      - "POST /newborn-complication-reviews"
      - "GET /newborn-complication-reviews"
      - "GET /newborn-complication-reviews/{reviewId}"
      - "POST /support-person-passes"
      - "GET /support-person-passes"
      - "GET /support-person-passes/{passId}"
      - "GET /obstetric-units/{unitId}/quality-measure-snapshots"
      - "GET /quality-measure-snapshots/{snapshotId}"
      - "GET /staff-members"
      - "GET /bundle-checklist-items"
      - "GET /bundle-checklist-items/{itemId}"
      - "GET /cesarean-readiness-drills"
      - "GET /quality-measure-snapshots"
    segregation_of_duties:
      - "SOD-1 first step: any BundleChecklistItem this StaffMember.id completes bars it from close-debrief on that activation."
      - "SOD-2 first step: a drill this StaffMember.id documents (documented_by_staff_id) can never be validated by it."
      - "SOD-3 gatekeeper: the facilitator_staff_id it names on schedule-debrief must never have held a CareAssignment on the reviewed encounter, and may not be itself if it covered the case."

