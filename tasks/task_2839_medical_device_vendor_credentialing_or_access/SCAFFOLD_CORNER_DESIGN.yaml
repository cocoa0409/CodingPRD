              as_user_id: "user_credentialing_1"
              captures: { cred_fay_flu_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_fay_flu_id}/decide"
              payload: { decision: "VERIFY" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
            - call: "POST /vendor-access/credentials"
              payload: { vendor_rep_id: "${rep_fay_id}", credential_type: "TRAINING_BLOODBORNE_PATHOGENS", issued_at_utc: "2026-07-01T00:00:00Z", expires_at_utc: "2027-07-01T00:00:00Z", document_reference: "BBP-FI-01" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { cred_fay_bbp_id: $.data.id }
            - call: "POST /vendor-access/credentials/${cred_fay_bbp_id}/decide"
              payload: { decision: "VERIFY" }
