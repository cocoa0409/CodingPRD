          - state_machines.Lease.contract.DRAFT_to_CANCELLED
          - state_machines.Lease.concession.APPROVED_to_REVOKED
          - calculations.community_posture
          - entities.Community.fields.committed_concession_cents
          - entities.ConcessionProgram.fields.committed_cents
        distinguishing_aspect: |
          A single POST /phases/{id}/halt reaches five entities along one dependency chain: Phase ->
          Community.posture (FROZEN) -> Homesite (OFF_MARKET, off_market_reason POSTURE_FREEZE) ->
          Lease (CANCELLED, cancellation_reason POSTURE_FREEZE) -> concession ledger
          (Community.committed_concession_cents and ConcessionProgram.committed_cents both back to 0).
