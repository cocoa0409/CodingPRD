            - "${hca_round} == 0 and ${well_tuned} is null"
            - "each create returns HTTP 201 and version == 1"

      - name: special_waste_approval_reaches_each_declared_target_state
        claim_type: valid_transition
        grounds:
          - state_machines.SpecialWasteApproval.REQUESTED_to_APPROVED
          - state_machines.SpecialWasteApproval.REQUESTED_to_DENIED
          - state_machines.SpecialWasteApproval.APPROVED_to_REVOKED
        distinguishing_aspect: "Three declared edges out of the same machine, two of them sharing the source state REQUESTED and selected only by which endpoint is called; the revoke edge additionally starts from APPROVED."
        test_recipe:
          setup:
