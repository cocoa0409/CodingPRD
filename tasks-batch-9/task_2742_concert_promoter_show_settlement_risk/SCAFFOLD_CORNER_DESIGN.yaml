            - call: "POST /shows"
              payload: { artist_id: "${dn_ar_id}", venue_id: "${dn_vn_id}", event_at: "2026-12-02T02:00:00.000Z", load_in_at: "2026-12-01T14:00:00.000Z", load_out_at: "2026-12-02T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { dn_sh_id: $.data.id, dn_sh_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${dn_sh_id}", expected_show_version: "${dn_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 100000, deposit_cents: 0, expense_cap_cents: 100000 }
              as: TalentBuyer
              captures: { dn_of_id: $.data.id }
            - call: "POST /offers/${dn_of_id}/submit"
