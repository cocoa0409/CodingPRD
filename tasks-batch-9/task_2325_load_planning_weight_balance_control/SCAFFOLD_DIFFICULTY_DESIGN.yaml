            - call: "POST /weight-programs"
              payload: { code: "STD-2026", program_kind: "STANDARD", male_kg: 88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
              as: LoadControlAdmin
              captures: { wp_std: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:00:00Z" }
              as: LoadControlAdmin
            - call: "POST /flights"
              payload: { flight_number: "LX1760", aircraft_id: "${ac1}", departure_runway_id: "${rw1}", weight_program_id: "${wp_std}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
              captures: { f1: $.data.id, f1_ver: $.data.version }
            - call: "POST /load-plans"
              payload: { flight_id: "${f1}", expected_flight_version: "${f1_ver}", rounding_mode: "PER_LINE_THEN_SUM" }
              as: LoadController
              captures: { lp1: $.data.id }
            - call: "POST /pax-lines"
              payload: { load_plan_id: "${lp1}", compartment_id: "${oc1}", male_count: 50, female_count: 0, child_count: 6, infant_count: 4 }
              as: LoadController
              captures: { pl_oc: $.data.id }
            - call: "POST /bag-allocations"
              payload: { load_plan_id: "${lp1}", compartment_id: "${h51}", bag_count: 48, bag_weight_kg: 625 }
              as: LoadController
              captures: { ba_h5: $.data.id }
            - call: "POST /load-plans/${lp1}/compute"
              payload: {}
              as: LoadController
          trigger:
            - call: "POST /pax-lines"
              payload: { load_plan_id: "${lp1}", compartment_id: "${ob1}", male_count: 40, female_count: 0, child_count: 0, infant_count: 0 }
              as: LoadController
              captures: { pl_ob: $.data.id }
            - call: "POST /load-plans/${lp1}/compute"
              payload: {}
              as: LoadController
            - call: "DELETE /pax-lines/${pl_ob}"
              payload: {}
              as: LoadController
            - call: "POST /load-plans/${lp1}/compute"
              payload: {}
              as: LoadController
          assert:
            - "baseline: PaxDistributionLine.${pl_oc}.line_weight_kg == 4650.00 and index_delta == 27.44; BagAllocation.${ba_h5}.effective_weight_kg == 625.00 and index_delta == 7.13"
            - "baseline: LoadPlan.${lp1}.base_payload_kg == 5275.00, index_zfw == 97.10, zero_fuel_weight_kg == 47825.00, mac_zfw_pct == 23.45"
            - "baseline: LoadPlan.${lp1}.takeoff_weight_kg == 57375.00, index_tow == 105.70, mac_tow_pct == 23.11, underload_kg == 14905.00, envelope_ok == true"
            - "after the OB line is added: LoadPlan.${lp1}.status == DRAFT, index_zfw == 0.00, takeoff_weight_kg == 0.00, envelope_ok == false, and Flight.${f1}.status == PLANNING"
            - "after the second compute: PaxDistributionLine.${pl_ob}.line_weight_kg == 3520.00 and index_delta == 2.82"
            - "after the second compute: LoadPlan.${lp1}.base_payload_kg == 8795.00, index_zfw == 99.92, zero_fuel_weight_kg == 51345.00, mac_zfw_pct == 23.15"
            - "after the second compute: LoadPlan.${lp1}.takeoff_weight_kg == 60895.00, index_tow == 108.52, mac_tow_pct == 22.88, underload_kg == 11385.00, envelope_ok == true (aft limit reduced to 26.5 because 60895.00 > 60000)"
            - "after the DELETE: the call returns 204, LoadPlan.${lp1}.status == DRAFT and Flight.${f1}.status == PLANNING"
            - "conserved after the third compute: LoadPlan.${lp1}.base_payload_kg == 5275.00 and LoadPlan.${lp1}.index_zfw == 97.10"
            - "conserved after the third compute: LoadPlan.${lp1}.zero_fuel_weight_kg == 47825.00, mac_zfw_pct == 23.45, takeoff_weight_kg == 57375.00, index_tow == 105.70, mac_tow_pct == 23.11, underload_kg == 14905.00"
            - "GET /pax-lines?load_plan_id=${lp1} returns total_count 1 and LoadPlan.${lp1}.status == COMPUTED with Flight.${f1}.status == LOAD_CONTROLLED"
