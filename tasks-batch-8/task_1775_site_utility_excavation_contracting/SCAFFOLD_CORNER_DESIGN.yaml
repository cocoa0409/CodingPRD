              as: Foreman
              captures: { s_id: $.data.id }
            - call: "POST /site-utility/trench-safety-plans"
              payload: { project_id: "${p_id}", pipe_segment_id: "${s_id}", max_depth_ft: 25.0, soil_class: SOIL_B, protective_system: SLOPING, slope_ratio: 1.0 }
              as: Foreman
              captures: { sp1_id: $.data.id }
            - call: "POST /site-utility/trench-safety-plans"
              payload: { project_id: "${p_id}", pipe_segment_id: "${s_id}", max_depth_ft: 25.0, soil_class: SOIL_B, protective_system: TRENCH_BOX, engineered_certification: false }
