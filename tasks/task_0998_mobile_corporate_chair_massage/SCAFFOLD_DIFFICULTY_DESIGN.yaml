  # ==================================================================
  # Rule 8: resource_temporal_overlap — different interval semantics
  # ==================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: therapist_window_overlap_with_buffers
        grounds:
          - validations[priority=8]
          - entities.Region.fields.setup_buffer_minutes
        distinguishing_aspect: |
          Resource = Therapist. Interval semantics = half-open windows
          EXTENDED by Region.setup_buffer_minutes before and
          Region.teardown_buffer_minutes after each booking's window.
          Adjacent raw windows (end == start) still overlap after buffer
          extension. Distinct semantics from chair-slot ordinal slicing
          (which uses exact non-overlapping sub-intervals).
        test_recipe:
          setup:
            - "Region R0 with setup=30, teardown=30"
            - "T1 licensed; T2 licensed"
            - "Booking B1 EVENT 2026-06-10 window 600..720 -> extended 570..750"
            - "Booking B2 EVENT 2026-06-10 window 720..840 -> raw adjacent to B1, extended 690..870, OVERLAPS B1's extended 570..750"
            - "T1 already assigned to B1's chair"
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { region_id: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "ACME", billing_email: "a@x", region_id: "${region_id}", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { acct_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T", email: "t@x", home_region_id: "${region_id}", per_hour_rate_cents: 6000, max_minutes_per_day: 2000 }, as: PlatformAdmin, captures: { t1_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${t1_id}", region_id: "${region_id}", license_number: "L1", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${acct_id}", region_id: "${region_id}", site_address: "B1", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 120, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${acct_id}", captures: { bk1_id: "$.data.id" } }
            - { call: "POST /chair-massage/bookings/${bk1_id}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk1_id}/chair-slots", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_a: "$.data[0].id" } }
            - { call: "POST /chair-massage/chair-slots/${cs_a}/assign", payload: { therapist_id: "${t1_id}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${acct_id}", region_id: "${region_id}", site_address: "B2", event_date: "2026-06-10", window_start_minutes: 720, window_duration_minutes: 120, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${acct_id}", captures: { bk2_id: "$.data.id" } }
            - { call: "POST /chair-massage/bookings/${bk2_id}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk2_id}/chair-slots", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_b: "$.data[0].id" } }
          trigger:
            - call: "POST /chair-massage/chair-slots/${cs_b}/assign"
              payload: { therapist_id: "${t1_id}" }
              as: Organizer
              as_user_id: "${acct_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_THERAPIST_DOUBLE_BOOKED (raw windows adjacent, but 30-min buffers cause overlap)"
            - "HTTP status == 422"
            - "ChairSlot.${cs_b}.status unchanged (UNASSIGNED)"

      - name: chair_slot_ordinal_no_overlap_within_chair
        grounds:
          - validations[priority=9]
          - entities.SlotClaim.fields.start_offset_minutes
        distinguishing_aspect: |
          Resource = ChairSlot. Interval semantics = exact ordinal slicing
          (slot_ordinal * slot_minutes, half-open, NO buffers). A new claim
          always lands at the next free ordinal — never overlaps existing
          claims on the same chair. Distinct semantics from therapist
          window overlap (buffer-extended).
        test_recipe:
          setup:
            - "Region R0; ACME; T1 licensed"
            - "Booking EVENT 2026-06-10 window_duration=60, slot_minutes=15, chair_count=1"
            - "Chair cs0 ASSIGNED; 2 existing claims at ordinals 0, 1"
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { region_id: "$.data.id" } }
            - { call: "POST /chair-massage/corporate-accounts", payload: { company_name: "ACME", billing_email: "a@x", region_id: "${region_id}", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { acct_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapists", payload: { full_name: "T", email: "t@x", home_region_id: "${region_id}", per_hour_rate_cents: 6000, max_minutes_per_day: 2000 }, as: PlatformAdmin, captures: { t1_id: "$.data.id" } }
            - { call: "POST /chair-massage/therapist-licenses", payload: { therapist_id: "${t1_id}", region_id: "${region_id}", license_number: "L1", issued_on: "2025-01-01", expires_on: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /chair-massage/bookings", payload: { corporate_account_id: "${acct_id}", region_id: "${region_id}", site_address: "B", event_date: "2026-06-10", window_start_minutes: 600, window_duration_minutes: 60, chair_count: 1, slot_minutes: 15, per_minute_rate_cents: 200 }, as: Organizer, as_user_id: "${acct_id}", captures: { bk_id: "$.data.id" } }
            - { call: "POST /chair-massage/bookings/${bk_id}/open-scheduling", payload: {}, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/bookings/${bk_id}/chair-slots", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs0: "$.data[0].id" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/assign", payload: { therapist_id: "${t1_id}" }, as: Organizer, as_user_id: "${acct_id}" }
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_v_cur: "$.data.version" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/claims", payload: { recipient_name: "R1", recipient_email: "r1@x", expected_chair_slot_version: "${cs_v_cur}" }, as: Organizer, as_user_id: "${acct_id}", captures: { c1_ordinal: "$.data.slot_ordinal", c1_offset: "$.data.start_offset_minutes" } }
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_v_cur: "$.data.version" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/claims", payload: { recipient_name: "R2", recipient_email: "r2@x", expected_chair_slot_version: "${cs_v_cur}" }, as: Organizer, as_user_id: "${acct_id}", captures: { c2_ordinal: "$.data.slot_ordinal", c2_offset: "$.data.start_offset_minutes" } }
          trigger:
            - { call: "GET /chair-massage/chair-slots/${cs0}", payload: {}, as: Organizer, as_user_id: "${acct_id}", captures: { cs_v_cur: "$.data.version" } }
            - { call: "POST /chair-massage/chair-slots/${cs0}/claims", payload: { recipient_name: "R3", recipient_email: "r3@x", expected_chair_slot_version: "${cs_v_cur}" }, as: Organizer, as_user_id: "${acct_id}", captures: { c3_ordinal: "$.data.slot_ordinal", c3_offset: "$.data.start_offset_minutes" } }
          assert:
            - "First claim slot_ordinal == 0 and start_offset_minutes == 0"
            - "Second claim slot_ordinal == 1 and start_offset_minutes == 15"
            - "Third claim slot_ordinal == 2 and start_offset_minutes == 30"
            - "Claim intervals [0,15), [15,30), [30,45) are pairwise disjoint — ordinal slicing forbids overlap"

  # ==================================================================
  # Rule 9: compensating_invariant — different conserved quantities
  # ==================================================================
  - rule_id: compensating_invariant
    instances:
      - name: booked_minutes_invariant_under_claim_and_cancel
        grounds:
          - state_machines.SlotClaim.CLAIMED_to_CANCELLED
          - entities.Booking.fields.booked_chair_minutes
        distinguishing_aspect: |
          Conserved quantity = Booking.booked_chair_minutes. Forward action
          (claim a slot, +slot_minutes) paired with compensating action
          (cancel the claim, -slot_minutes) MUST return the metric to its
          pre-pair value. Distinct quantity from invoice outstanding balance.
        test_recipe:
          setup:
            - "Region R0; ACME; T1 licensed"
            - "Booking EVENT 2026-06-10 window_duration=60, slot_minutes=15, chair_count=1"
            - "Chair cs0 ASSIGNED; 1 existing claim"
            - "Booking.booked_chair_minutes == 15"
          setup_api_calls:
            - { call: "POST /chair-massage/regions", payload: { code: "R0", name: "R0", base_mileage_rate_cents: 120, travel_included_miles: 20, setup_buffer_minutes: 30, teardown_buffer_minutes: 30 }, as: PlatformAdmin, captures: { region_id: "$.data.id" } }
