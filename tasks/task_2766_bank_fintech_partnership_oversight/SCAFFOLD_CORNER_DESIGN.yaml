      - name: the_restricted_posture_blocks_marketing_but_not_inflow_and_the_frozen_custody_gate_preempts_the_inflow_gate
        claim_type: Conditional Validation
        grounds:
          - validations.priority_46
          - validations.priority_50
          - validations.priority_52
          - calculations.partner_oversight_posture.constants
          - errors.ERR_POSTURE_BLOCKS_MARKETING
          - errors.ERR_POSTURE_BLOCKS_INFLOW
        distinguishing_aspect: "The two posture gates deliberately use DIFFERENT posture sets: marketing is blocked at RESTRICTED and FROZEN, inflow only at FROZEN. A RESTRICTED partner must therefore be refused a marketing filing and simultaneously permitted an end-user credit. Pushing the same partner to FROZEN then shows that priority 46 preempts priority 52, because every §1.2 path that sets FROZEN also freezes both custody accounts in the same pass."
        test_recipe:
          setup:
            - "Partner A LIVE, reserve 312500, FBO 0, with end_user_account_count overwritten to 100 by a census so that three complaints produce a 300 bps rate (>= RESTRICT_COMPLAINT_RATE_BPS 250) and therefore RESTRICTED."
