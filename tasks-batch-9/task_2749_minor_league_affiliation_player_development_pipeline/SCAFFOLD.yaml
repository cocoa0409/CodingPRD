# ============================================================================
# SCAFFOLD.yaml — §1.0-§1.7 seed tables
# Task 2749 — Minor League Affiliation & Player Development Pipeline
# ============================================================================

scenario: "2749. Minor League Affiliation & Player Development Pipeline (major league baseball player development): affiliation agreements with minor league clubs covering facility standards, staffing and expense allocation, player assignment across levels with development plans, workload limits and promotion criteria, roster limits by level with domestic reserve list management and option year tracking, complex-level and rehab assignment coordination with medical clearance, coaching and support staff allocation across affiliates with curriculum consistency, player housing, meal and travel standards under league requirements, international signing pool management and academy operations, transaction reporting and player movement between affiliates"

domain_name: "minor-league-affiliation-player-development"

# All business resources are peer collections at the URL root (flat/graph
# topology): `/affiliates`, `/players`, `/assignments`, `/staff-allocations`,
# `/international-signings`, ... Child collections that are only ever read
# through one owner appear as sub-resources of that owner.
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: graph
  # Players, affiliates and staff members are peers linked by many-to-many
  # junction rows (PlayerAssignment, StaffAllocation, InternationalSigning).
  # PlayerAssignment is additionally self-referential through
  # `superseded_assignment_id`, so the movement history of a player forms a
  # chain inside the same table.

  state_machine_shape: cyclic
  # FacilityStandardReview cycles REOPENED <-> REMEDIATION_SUBMITTED,
  # DevelopmentPlan cycles ACTIVE <-> REVISION_REQUESTED, TransactionReport
  # cycles FILED -> REJECTED_BY_LEAGUE -> PENDING -> FILED, PlayerAssignment
  # cycles ACTIVE <-> SUSPENDED, and Player carries two independent state
  # dimensions (roster_status x medical_status) on the same row.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The FarmDirector who initiates a player movement may never be the
  # ComplianceOfficer user id that certifies its league transaction report,
  # and AffiliateOperator actions are scoped to the operator's own Affiliate.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================

entities:

  - name: Affiliate
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: "Club name of the minor league affiliate."
        constraints: "1-120 characters, non-blank"
      - name: level
        type: enum
        source: input
        description: "Competition level the affiliate operates at."
        constraints: "one of TRIPLE_A, DOUBLE_A, HIGH_A, SINGLE_A, COMPLEX, DOMINICAN_ACADEMY"
      - name: market_city
        type: string
        source: input
        description: "Home market of the affiliate."
      - name: roster_limit
        type: integer
        source: input
        description: "Maximum number of concurrently ACTIVE PlayerAssignment rows of assignment_type LEVEL or COMPLEX this affiliate may carry."
        default: "LEVEL_ROSTER_LIMIT[level] (TRIPLE_A 28, DOUBLE_A 28, HIGH_A 30, SINGLE_A 30, COMPLEX 35, DOMINICAN_ACADEMY 40)"
        constraints: "integer 1..40"
      - name: reserve_slots
        type: integer
        source: input
        description: "Domestic reserve list slots the organization has allotted to this affiliate."
        default: 35
        constraints: "integer 0..40"
      - name: housing_beds
        type: integer
        source: input
        description: "League-certified player housing beds available at the affiliate or academy complex."
        default: 40
        constraints: "integer 0..200"
      - name: meal_stipend_cents_per_day
        type: integer
        source: input
        description: "Daily meal stipend paid to assigned players, in cents."
        constraints: "integer >= LEAGUE_MIN_MEAL_STIPEND_CENTS (2500), else ERR_MEAL_STIPEND_BELOW_MINIMUM"
      - name: travel_standard_tier
        type: enum
        source: input
        description: "League travel standard the affiliate commits to."
        default: BUS_STANDARD
        constraints: "one of CHARTER, BUS_SLEEPER, BUS_STANDARD"
      - name: active_roster_count
        type: integer
        source: computed
        description: "Count of PlayerAssignment rows with affiliate_id == this.id, status == ACTIVE and assignment_type IN {LEVEL, COMPLEX}."
        default: 0
      - name: rehab_assignment_count
        type: integer
        source: computed
        description: "Count of PlayerAssignment rows with affiliate_id == this.id, status == ACTIVE and assignment_type == REHAB."
        default: 0
      - name: reserve_list_count
        type: integer
        source: computed
        description: "Count of Player rows whose computed current_affiliate_id == this.id and whose is_on_domestic_reserve_list == true."
        default: 0
      - name: facility_score
        type: number
        source: computed
        description: "Mean of the latest non-WAIVED FacilityStandardReview.score per category for this affiliate, 2 decimal places; 100.00 when no such review exists. See calculations.facility_posture_evaluation."
        default: 100.00
      - name: open_major_deficiency_count
        type: integer
        source: computed
        description: "Count of FacilityStandardReview rows for this affiliate with deficiency_level == MAJOR and status IN {OPEN, REMEDIATION_SUBMITTED, REOPENED}."
        default: 0
      - name: facility_status
        type: enum
        source: computed
        description: "DEFICIENT when open_major_deficiency_count >= 1; PROVISIONAL when open_major_deficiency_count == 0 and at least one review has deficiency_level == MINOR and status IN {OPEN, REMEDIATION_SUBMITTED, REOPENED}; COMPLIANT otherwise."
        default: COMPLIANT
        constraints: "one of COMPLIANT, PROVISIONAL, DEFICIENT"

  - name: AffiliationAgreement
    parent: Affiliate
    common_fields: true
    kind: resource
    fields:
      - name: affiliate_id
        type: string
        source: input
        description: "FK -> Affiliate.id; the minor league club bound by this Player Development License."
      - name: term_start_date
        type: string
        source: input
        description: "First calendar date (YYYY-MM-DD) the agreement covers."
      - name: term_end_date
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD) the agreement covers; must be strictly after term_start_date."
      - name: facility_standard_tier
        type: enum
        source: input
        description: "League facility tier the affiliate is licensed at."
        constraints: "one of TIER_1, TIER_2, TIER_3"
      - name: minimum_active_players
        type: integer
        source: input
        description: "Contractual floor on Affiliate.active_roster_count; falling below it drives posture to RESTRICTED."
        default: 22
        constraints: "integer 0..40"
      - name: required_staff_roles
        type: array
        source: input
        description: "Staff roles that MUST each have at least one ACTIVE StaffAllocation at this affiliate; any uncovered role drives posture to RESTRICTED."
        default: "[]"
        constraints: "each member one of HITTING_COACH, PITCHING_COACH, ATHLETIC_TRAINER, STRENGTH_COACH, MANAGER; no duplicates"
      - name: club_reimbursement_cap_cents
        type: integer
        source: input
        description: "Annual ceiling on the major league club's share of reimbursable affiliate expenses, in cents."
        constraints: "integer >= 0"
      - name: housing_expense_cents
        type: integer
        source: input
        description: "Declared gross annual player-housing expense of the affiliate, in cents."
        default: 0
      - name: meal_expense_cents
        type: integer
        source: input
        description: "Declared gross annual player-meal expense of the affiliate, in cents."
        default: 0
      - name: travel_expense_cents
        type: integer
        source: input
        description: "Declared gross annual team-travel expense of the affiliate, in cents."
        default: 0
      - name: upkeep_expense_cents
        type: integer
        source: input
        description: "Declared gross annual facility-upkeep expense of the affiliate, in cents."
        default: 0
      - name: audited_housing_expense_cents
        type: integer
        source: system
        description: "Audited housing figure supplied on the SETTLE action; null until settlement, and the SETTLE calculation falls back to housing_expense_cents when omitted."
        default: null
      - name: audited_meal_expense_cents
        type: integer
        source: system
        description: "Audited meal figure supplied on the SETTLE action; null until settlement, falls back to meal_expense_cents."
        default: null
      - name: audited_travel_expense_cents
        type: integer
        source: system
        description: "Audited travel figure supplied on the SETTLE action; null until settlement, falls back to travel_expense_cents."
        default: null
      - name: audited_upkeep_expense_cents
        type: integer
        source: system
        description: "Audited upkeep figure supplied on the SETTLE action; null until settlement, falls back to upkeep_expense_cents."
        default: null
      - name: status
        type: enum
        source: system
        description: "Agreement lifecycle state; see state_machines.AffiliationAgreement."
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, ACTIVE, REJECTED, SUSPENDED, TERMINATED"
      - name: posture
        type: enum
        source: computed
        description: "Derived operational gate over every child operation at the affiliate; recomputed by calculations.facility_posture_evaluation."
        default: FROZEN
        constraints: "one of OPEN, RESTRICTED, FROZEN"
      - name: provisional_club_obligation_cents
        type: integer
        source: computed
        description: "Club expense obligation computed by calculations.expense_allocation_settlement variant provisional_at_submit; 0 until the agreement is SUBMITTED."
        default: 0
      - name: final_club_obligation_cents
        type: integer
        source: computed
        description: "Club expense obligation computed by calculations.expense_allocation_settlement variant final_at_settlement; null until settlement_status == SETTLED."
        default: null
      - name: affiliate_overflow_cents
        type: integer
        source: computed
        description: "Portion of the reimbursable expense the affiliate absorbs; reflects the provisional computation until SETTLE, then the final computation."
        default: 0
      - name: settlement_status
        type: enum
        source: computed
        description: "NOT_SETTLED until a SETTLE action succeeds, SETTLED afterwards."
        default: NOT_SETTLED
        constraints: "one of NOT_SETTLED, SETTLED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AffiliateOperator that performed the SUBMIT action; null while DRAFT."
        default: null

  - name: FacilityStandardReview
    parent: Affiliate
    common_fields: true
    kind: resource
    fields:
      - name: affiliate_id
        type: string
        source: input
        description: "FK -> Affiliate.id; the club whose facility category was inspected."
      - name: category
        type: enum
        source: input
        description: "League facility / player-standard category inspected."
        constraints: "one of CLUBHOUSE, WEIGHT_ROOM, FIELD_SURFACE, LIGHTING, MEDICAL_ROOM, HOUSING, MEALS, TRAVEL"
      - name: review_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the inspection was performed."
      - name: score
        type: integer
        source: input
        description: "Inspection score for the category."
        constraints: "integer 0..100"
      - name: deficiency_level
        type: enum
        source: computed
        description: "NONE when score >= 85; MINOR when 70 <= score <= 84; MAJOR when score <= 69."
        constraints: "one of NONE, MINOR, MAJOR"
      - name: status
        type: enum
        source: system
        description: "Review lifecycle state; see state_machines.FacilityStandardReview."
        default: OPEN
        constraints: "one of OPEN, REMEDIATION_SUBMITTED, CLOSED, REOPENED, WAIVED"
      - name: remediation_due_date
        type: string
        source: computed
        description: "review_date + REMEDIATION_DAYS[deficiency_level] (MAJOR 30, MINOR 60); null when deficiency_level == NONE. Reset to clock date + REMEDIATION_REOPEN_DAYS (15) on every REOPEN."
        default: null
      - name: remediation_note
        type: string
        source: system
        description: "Narrative supplied by the AffiliateOperator on SUBMIT_REMEDIATION."
        default: null
      - name: remediation_submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent SUBMIT_REMEDIATION."
        default: null
      - name: reopen_count
        type: integer
        source: computed
        description: "Number of REOPEN actions applied to this review; capped at MAX_REVIEW_REOPENS (2)."
        default: 0
      - name: waiver_granted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that granted a WAIVE; null otherwise."
        default: null
      - name: is_overdue
        type: boolean
        source: computed
        description: "true when status IN {OPEN, REOPENED} and the logical clock date is strictly after remediation_due_date."
        default: false

  - name: StaffMember
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: "Name of the coach or support-staff member."
      - name: discipline
        type: enum
        source: input
        description: "Primary coaching / support discipline."
        constraints: "one of HITTING, PITCHING, ATHLETIC_TRAINING, STRENGTH, MANAGEMENT"
      - name: curriculum_version_certified
        type: string
        source: input
        description: "Player-development curriculum version this staff member is certified on, e.g. 2026.1."
      - name: certification_expires_on
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the curriculum certification lapses."
      - name: total_committed_fte_pct
        type: integer
        source: computed
        description: "Sum of fte_pct over this member's StaffAllocation rows with status == ACTIVE whose half-open interval [effective_start, effective_end) contains the logical clock date."
        default: 0
      - name: status
        type: enum
        source: system
        description: "ACTIVE while the member holds at least one non-terminal allocation or none at all; INACTIVE is never produced by any transition in this scaffold and therefore is not a declared value."
        default: ACTIVE
        constraints: "always ACTIVE"

  - name: StaffAllocation
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: staff_member_id
        type: string
        source: input
        description: "FK -> StaffMember.id; the coach being allocated."
      - name: affiliate_id
        type: string
        source: input
        description: "FK -> Affiliate.id; the club receiving the allocation."
      - name: staff_role
        type: enum
        source: input
        description: "Role the member fills at the affiliate."
        constraints: "one of HITTING_COACH, PITCHING_COACH, ATHLETIC_TRAINER, STRENGTH_COACH, MANAGER"
      - name: fte_pct
        type: integer
        source: input
        description: "Percentage of the member's time committed to this affiliate for the interval."
        constraints: "integer 1..100"
      - name: effective_start
        type: string
        source: input
        description: "First calendar date (YYYY-MM-DD) of the allocation; interval is half-open [effective_start, effective_end)."
      - name: effective_end
        type: string
        source: input
        description: "Exclusive end date (YYYY-MM-DD) of the allocation; must be strictly after effective_start."
      - name: curriculum_version
        type: string
        source: input
        description: "Curriculum version the allocation will teach; must equal ORG_CURRICULUM_VERSION and the member's curriculum_version_certified."
      - name: status
        type: enum
        source: system
        description: "Allocation lifecycle state; see state_machines.StaffAllocation."
        default: PROPOSED
        constraints: "one of PROPOSED, ACTIVE, ENDED, RECALLED"

  - name: Player
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: "Player name."
      - name: origin
        type: enum
        source: input
        description: "Acquisition channel; gates domestic-reserve-list and international-signing eligibility."
        constraints: "one of DOMESTIC_DRAFT, INTERNATIONAL_FA, FOREIGN_PRO"
      - name: signed_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the player signed."
      - name: service_days_accrued
        type: integer
        source: input
        description: "Professional service days credited to the player before this system's records begin."
        default: 0
        constraints: "integer 0..2000"
      - name: roster_status
        type: enum
        source: system
        description: "State dimension 1 of 2 on this row; evolves independently of medical_status. See state_machines.Player."
        default: RESERVE_LIST
        constraints: "one of RESERVE_LIST, ACTIVE, RESTRICTED"
      - name: medical_status
        type: enum
        source: system
        description: "State dimension 2 of 2 on this row; evolves independently of roster_status. See state_machines.Player."
        default: PENDING_CLEARANCE
        constraints: "one of PENDING_CLEARANCE, CLEARED, RESTRICTED"
      - name: is_on_domestic_reserve_list
        type: boolean
        source: computed
        description: "true when roster_status IN {RESERVE_LIST, ACTIVE, RESTRICTED} and origin IN {DOMESTIC_DRAFT, FOREIGN_PRO}; INTERNATIONAL_FA players are never carried on the domestic reserve list."
        default: false
      - name: current_affiliate_id
        type: string
        source: computed
        description: "Denormalized mirror of the affiliate_id of this player's PlayerAssignment whose status == ACTIVE and assignment_type IN {LEVEL, COMPLEX}; null when no such assignment exists. Never client-supplied."
        default: null
      - name: option_years_used
        type: integer
        source: computed
        description: "Count of OptionYearRecord rows with status == CHARGED whose triggering_assignment_id belongs to a PlayerAssignment with player_id == this.id."
        default: 0
      - name: option_years_remaining
        type: integer
        source: computed
        description: "max(0, OPTION_YEARS_TOTAL (3) - option_years_used)."
        default: 3
      - name: workload_index
        type: number
        source: computed
        description: "calculations.player_workload_index variant actual_rolling, 2 decimal places."
        default: 0.00
      - name: workload_index_projected
        type: number
        source: computed
        description: "calculations.player_workload_index variant projected_promotion, 2 decimal places."
        default: 0.00
      - name: promotion_readiness
        type: number
        source: computed
        description: "calculations.promotion_readiness_score, 4 decimal places; 0.0000 when the player has no ACTIVE DevelopmentPlan."
        default: 0.0000

  - name: PlayerAssignment
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the player being assigned."
      - name: affiliate_id
        type: string
        source: input
        description: "FK -> Affiliate.id; the club receiving the player."
      - name: superseded_assignment_id
        type: string
        source: input
        description: "FK -> PlayerAssignment.id; the prior LEVEL or COMPLEX assignment this one supersedes on a promotion, demotion or lateral move. Null on a first assignment. Supplying it waives the TRANSFER_BUFFER_DAYS gap rule against that one prior row."
        default: null
      - name: assignment_type
        type: enum
        source: input
        description: "LEVEL for a full-season club, COMPLEX for complex-level work, REHAB for a rehabilitation assignment overlaying an existing LEVEL assignment."
        constraints: "one of LEVEL, COMPLEX, REHAB"
      - name: movement_reason
        type: enum
        source: input
        description: "Transaction reason recorded for league reporting."
        constraints: "one of INITIAL, PROMOTION, DEMOTION, REHAB_START, LATERAL"
      - name: effective_date
        type: string
        source: input
        description: "First calendar date (YYYY-MM-DD) of the assignment; interval is closed [effective_date, end_date]."
      - name: end_date
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD) of the assignment; must be >= effective_date."
      - name: workload_ceiling_index
        type: number
        source: input
        description: "Upper bound on Player.workload_index while this assignment is ACTIVE."
        default: 12.00
        constraints: "number > 0.00, at most 25.00"
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle state; see state_machines.PlayerAssignment."
        default: PENDING_CLEARANCE
        constraints: "one of PENDING_CLEARANCE, ACTIVE, SUSPENDED, COMPLETED, REVOKED"
      - name: initiated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FarmDirector that created the assignment; copied onto every TransactionReport this assignment produces and used by the segregation-of-duties check."
      - name: level_at_assignment
        type: enum
        source: computed
        description: "Snapshot of Affiliate.level taken when the assignment row was created; the workload multiplier and promotion level-rank comparison both read this pinned value, never the affiliate's live level."
        constraints: "one of TRIPLE_A, DOUBLE_A, HIGH_A, SINGLE_A, COMPLEX, DOMINICAN_ACADEMY"
      - name: projected_optional_days
        type: integer
        source: computed
        description: "(end_date - effective_date) in days + 1."
      - name: option_year_charged
        type: boolean
        source: computed
        description: "true once activation created an OptionYearRecord with status == CHARGED for this assignment; reverts to false when that record is RESCINDED."
        default: false

  - name: DevelopmentPlan
    parent: PlayerAssignment
    common_fields: true
    kind: resource
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> PlayerAssignment.id; the assignment this development plan governs."
      - name: target_level
        type: enum
        source: input
        description: "Level the plan is preparing the player for."
        constraints: "one of TRIPLE_A, DOUBLE_A, HIGH_A, SINGLE_A, COMPLEX, DOMINICAN_ACADEMY"
      - name: curriculum_version
        type: string
        source: input
        description: "Curriculum version the plan follows; must equal ORG_CURRICULUM_VERSION."
      - name: curriculum_modules
        type: array
        source: input
        description: "Ordered list of curriculum module codes the player must complete."
        constraints: "1..12 members, non-empty, no duplicates"
      - name: workload_limit_weekly_index
        type: number
        source: input
        description: "Weekly workload-index allowance the plan budgets; feeds both the projected workload variant and the promotion pressure term."
        default: 1.50
        constraints: "number > 0.00, at most 10.00"
      - name: completed_module_count
        type: integer
        source: system
        description: "Modules recorded complete via the RECORD_PROGRESS action."
        default: 0
      - name: completion_pct
        type: number
        source: computed
        description: "round_half_up(completed_module_count / len(curriculum_modules) * 100, 2)."
        default: 0.00
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle state; see state_machines.DevelopmentPlan."
        default: DRAFT
        constraints: "one of DRAFT, ACTIVE, REVISION_REQUESTED, ACHIEVED, LAPSED"
      - name: review_cycle_count
        type: integer
        source: computed
        description: "Number of times the plan has entered REVISION_REQUESTED; capped at MAX_PLAN_REVISIONS (3)."
        default: 0
      - name: revision_note
        type: string
        source: system
        description: "Curriculum-consistency note recorded on REQUEST_REVISION."
        default: null

  - name: WorkloadLog
    parent: PlayerAssignment
    common_fields: false
    kind: event
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> PlayerAssignment.id; the assignment the outing was worked under. The owning player is resolved through this assignment's player_id."
      - name: log_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) of the outing."
      - name: pitches_thrown
        type: integer
        source: input
        description: "Pitches thrown in the outing."
        default: 0
        constraints: "integer 0..250"
      - name: innings_pitched
        type: number
        source: input
        description: "Innings worked in the outing, one decimal place."
        default: 0.0
        constraints: "number 0.0..15.0"
      - name: high_intensity_minutes
        type: integer
        source: input
        description: "High-intensity conditioning minutes charged to the outing."
        default: 0
        constraints: "integer 0..300"
      - name: is_rehab_outing
        type: boolean
        source: input
        description: "true when the outing was worked under a rehabilitation protocol (independent of the owning assignment's assignment_type); excluded entirely from the actual_rolling workload variant and half-weighted in the projected_promotion variant."
        default: false

  - name: MedicalClearance
    parent: Player
    common_fields: true
    kind: resource
    fields:
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the player the clearance concerns."
      - name: clearance_type
        type: enum
        source: input
        description: "LEVEL_ASSIGNMENT gates activation of LEVEL and COMPLEX assignments; REHAB_START gates activation of a REHAB assignment; REHAB_COMPLETE gates completion of a REHAB assignment."
        constraints: "one of LEVEL_ASSIGNMENT, REHAB_START, REHAB_COMPLETE"
      - name: status
        type: enum
        source: system
        description: "Clearance lifecycle state; see state_machines.MedicalClearance."
        default: REQUESTED
        constraints: "one of REQUESTED, ISSUED, DENIED, REVOKED"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FarmDirector that requested the clearance."
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MedicalDirector that issued it; null until ISSUED."
        default: null
      - name: cleared_workload_ceiling_index
        type: number
        source: system
        description: "Workload-index ceiling the medical staff clears the player for, supplied on ISSUE; the effective ceiling on a workload log is min(assignment.workload_ceiling_index, this value)."
        default: null
      - name: expires_on
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD) the clearance lapses, supplied on ISSUE; must be strictly after the logical clock date at issue time."
        default: null
      - name: restriction_note
        type: string
        source: system
        description: "Reason recorded on DENY or REVOKE."
        default: null
      - name: is_expired
        type: boolean
        source: computed
        description: "true when status == ISSUED and the logical clock date is strictly after expires_on."
        default: false

  - name: OptionYearRecord
    parent: PlayerAssignment
    common_fields: true
    kind: resource
    fields:
      - name: triggering_assignment_id
        type: string
        source: input
        description: "FK -> PlayerAssignment.id; the optional assignment whose activation charged this option year. The owning player is resolved through this assignment's player_id."
      - name: season_year
        type: integer
        source: computed
        description: "Calendar year of the triggering assignment's effective_date."
      - name: optional_days
        type: integer
        source: computed
        description: "Snapshot of the triggering assignment's projected_optional_days at charge time."
      - name: status
        type: enum
        source: system
        description: "CHARGED on creation; RESCINDED when the triggering assignment is REVOKED."
        default: CHARGED
        constraints: "one of CHARGED, RESCINDED"
      - name: charged_at
        type: datetime
        source: system
        description: "Logical-clock instant the option year was charged."

  - name: SigningPool
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: season_year
        type: integer
        source: input
        description: "International signing period year; unique across SigningPool rows."
        constraints: "integer 2020..2040, unique"
      - name: base_pool_cents
        type: integer
        source: input
        description: "Base international bonus pool allotment, in cents."
        constraints: "integer > 0"
      - name: trade_adjustment_cents
        type: integer
        source: input
        description: "Net pool space acquired (positive) or traded away (negative), in cents."
        default: 0
      - name: forfeited_cents
        type: integer
        source: computed
        description: "Pool space forfeited by TIER_3 overage breaches; increased by TIER3_FORFEIT_CENTS (250000) after each breaching approval and reversed when that signing is VOIDED."
        default: 0
      - name: effective_pool_cents
        type: integer
        source: computed
        description: "base_pool_cents + trade_adjustment_cents - forfeited_cents."
      - name: allocated_cents
        type: integer
        source: computed
        description: "Sum of pool_charge_cents over InternationalSigning rows with pool_id == this.id and status == APPROVED."
        default: 0
      - name: remaining_cents
        type: integer
        source: computed
        description: "effective_pool_cents - allocated_cents; may be negative once the pool is over-allocated."
      - name: overage_tax_accrued_cents
        type: integer
        source: computed
        description: "Sum of overage_tax_cents over InternationalSigning rows with pool_id == this.id and status == APPROVED."
        default: 0
      - name: status
        type: enum
        source: system
        description: "OPEN while allocated_cents <= effective_pool_cents; HARD_CAPPED once an approval pushes allocated_cents above it. See state_machines.SigningPool."
        default: OPEN
        constraints: "one of OPEN, HARD_CAPPED"

  - name: InternationalSigning
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: pool_id
        type: string
        source: input
        description: "FK -> SigningPool.id; the signing period the bonus is charged against."
      - name: player_id
        type: string
        source: input
        description: "FK -> Player.id; the amateur being signed; origin must be INTERNATIONAL_FA."
      - name: academy_affiliate_id
        type: string
        source: input
        description: "FK -> Affiliate.id; the academy complex that will house the signee; level must be DOMINICAN_ACADEMY."
      - name: bonus_cents
        type: integer
        source: input
        description: "Signing bonus, in cents."
        constraints: "integer >= 0"
      - name: status
        type: enum
        source: system
        description: "Signing lifecycle state; see state_machines.InternationalSigning."
        default: SUBMITTED
        constraints: "one of SUBMITTED, APPROVED, REJECTED, VOIDED"
      - name: rejection_reason
        type: enum
        source: system
        description: "POOL_HARD_CAPPED when auto-rejected by a cap cascade; COMPLIANCE_DENIED on an explicit REJECT."
        default: null
        constraints: "one of POOL_HARD_CAPPED, COMPLIANCE_DENIED"
      - name: pool_charge_cents
        type: integer
        source: computed
        description: "Amount charged to the pool on approval; equals bonus_cents. 0 while not APPROVED."
        default: 0
      - name: overage_tax_cents
        type: integer
        source: computed
        description: "Marginal overage tax computed by calculations.signing_pool_charge on approval. 0 while not APPROVED."
        default: 0
      - name: tier3_breach
        type: boolean
        source: computed
        description: "true when this approval pushed cumulative pool overage above POOL_TIER_2_CEILING_CENTS (1000000)."
        default: false
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that approved it; null otherwise."
        default: null

  - name: TransactionReport
    parent: PlayerAssignment
    common_fields: true
    kind: resource
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> PlayerAssignment.id; the player movement being reported to the league."
      - name: transaction_type
        type: enum
        source: system
        description: "League transaction category derived from the producing transition."
        constraints: "one of OPTIONAL_ASSIGNMENT, PROMOTION, REHAB_ASSIGNMENT, REHAB_COMPLETE, RECALL, REVOCATION"
      - name: status
        type: enum
        source: system
        description: "Report lifecycle state; see state_machines.TransactionReport."
        default: PENDING
        constraints: "one of PENDING, FILED, ACCEPTED, REJECTED_BY_LEAGUE, VOIDED"
      - name: initiated_by_user_id
        type: string
        source: system
        description: "Copied from the producing assignment's initiated_by_user_id; the FILE action rejects any certifier whose X-User-ID equals this value."
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer that filed the report; null until FILED."
        default: null
      - name: filing_deadline
        type: string
        source: computed
        description: "Producing assignment's effective_date + FILING_WINDOW_DAYS (2), as YYYY-MM-DD."
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent FILE action."
        default: null
      - name: is_late
        type: boolean
        source: computed
        description: "true when the date component of filed_at is strictly after filing_deadline, or (while status == PENDING) the logical clock date is strictly after filing_deadline."
        default: false
      - name: late_fee_cents
        type: integer
        source: computed
        description: "calculations.transaction_filing_late_fee over days_late; 0 while not late."
        default: 0
      - name: refile_count
        type: integer
        source: computed
        description: "Number of REFILE actions applied; capped at MAX_REPORT_REFILES (2)."
        default: 0
      - name: league_note
        type: string
        source: system
        description: "League feedback recorded on LEAGUE_REJECT."
        default: null

# ============================================================================
# §1.2 State Machine Table
# ============================================================================

state_machines:

  - entity: AffiliationAgreement
    initial_state: DRAFT
    terminal_states: [REJECTED, TERMINATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /agreements/{id}/disposition with action == SUBMIT"
        actor: AffiliateOperator
        preconditions:
          - "acting X-User-ID equals the agreement's affiliate_id"
          - "term_end_date is strictly after term_start_date"
          - "no other AffiliationAgreement for the same affiliate_id is in status SUBMITTED or ACTIVE"
        side_effects:
          - "records submitted_by_user_id from X-User-ID"
          - "runs calculations.expense_allocation_settlement variant provisional_at_submit, writing provisional_club_obligation_cents and affiliate_overflow_cents"
          - "recomputes posture (remains FROZEN because status is not ACTIVE)"
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /agreements/{id}/disposition with action == ACTIVATE"
        actor: ComplianceOfficer
        preconditions:
          - "the affiliate's facility_status is not DEFICIENT"
        side_effects:
          - "runs calculations.facility_posture_evaluation, writing posture to OPEN or RESTRICTED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /agreements/{id}/disposition with action == REJECT"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "sets posture to FROZEN"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /agreements/{id}/disposition with action == SUSPEND"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "sets posture to FROZEN"
          - "every PlayerAssignment at this affiliate with status == ACTIVE moves to SUSPENDED (conditional cascade: PENDING_CLEARANCE, COMPLETED and REVOKED assignments are untouched)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /agreements/{id}/disposition with action == REINSTATE"
        actor: ComplianceOfficer
        preconditions:
          - "the affiliate's facility_status is not DEFICIENT"
        side_effects:
          - "re-runs calculations.facility_posture_evaluation, writing posture to OPEN or RESTRICTED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /agreements/{id}/disposition with action == TERMINATE"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "sets posture to FROZEN"
          - "every PlayerAssignment at this affiliate with status IN {PENDING_CLEARANCE, ACTIVE, SUSPENDED} moves to REVOKED, cascading per the PlayerAssignment REVOKE side effects"
          - "every StaffAllocation at this affiliate with status IN {PROPOSED, ACTIVE} moves to RECALLED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /agreements/{id}/disposition with action == TERMINATE"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "same cascade as the ACTIVE -> TERMINATED transition"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /agreements/{id}/disposition with action == SETTLE"
        actor: ComplianceOfficer
        preconditions:
          - "settlement_status == NOT_SETTLED, else ERR_ALREADY_SETTLED"
        side_effects:
          - "stores any supplied audited_*_expense_cents values"
          - "runs calculations.expense_allocation_settlement variant final_at_settlement, writing final_club_obligation_cents and overwriting affiliate_overflow_cents"
          - "sets settlement_status to SETTLED"
        note: "Self-transition: the agreement remains ACTIVE; only the settlement ledger fields change. A second SETTLE is rejected."

  - entity: FacilityStandardReview
    initial_state: OPEN
    terminal_states: [WAIVED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system: review created with score >= 85 (deficiency_level == NONE)"
        actor: system
        preconditions: []
        side_effects:
          - "leaves remediation_due_date null"
          - "recomputes the affiliate's facility_score, open_major_deficiency_count and facility_status"
        note: "A clean inspection never sits in OPEN; the row is persisted directly in CLOSED."
      - from: OPEN
        to: REMEDIATION_SUBMITTED
        trigger: "POST /facility-reviews/{id}/disposition with action == SUBMIT_REMEDIATION"
        actor: AffiliateOperator
        preconditions:
          - "acting X-User-ID equals the review's affiliate_id"
          - "the logical clock date is not after remediation_due_date, else ERR_REMEDIATION_WINDOW_CLOSED"
        side_effects:
          - "stores remediation_note and remediation_submitted_at"
      - from: REMEDIATION_SUBMITTED
        to: CLOSED
        trigger: "POST /facility-reviews/{id}/disposition with action == CLOSE"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "recomputes the affiliate's open_major_deficiency_count and facility_status"
          - "re-runs calculations.facility_posture_evaluation for the affiliate's ACTIVE agreement, which may lift posture out of FROZEN"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /facility-reviews/{id}/disposition with action == REOPEN"
        actor: ComplianceOfficer
        preconditions:
          - "reopen_count < MAX_REVIEW_REOPENS (2), else ERR_CYCLE_LIMIT_REACHED"
        side_effects:
          - "increments reopen_count"
          - "resets remediation_due_date to the logical clock date + REMEDIATION_REOPEN_DAYS (15)"
          - "recomputes the affiliate's open_major_deficiency_count and facility_status"
      - from: REOPENED
        to: REMEDIATION_SUBMITTED
        trigger: "POST /facility-reviews/{id}/disposition with action == SUBMIT_REMEDIATION"
        actor: AffiliateOperator
        preconditions:
          - "acting X-User-ID equals the review's affiliate_id"
          - "the logical clock date is not after remediation_due_date, else ERR_REMEDIATION_WINDOW_CLOSED"
        side_effects:
          - "overwrites remediation_note and remediation_submitted_at"
        note: "Closes the cycle CLOSED -> REOPENED -> REMEDIATION_SUBMITTED -> CLOSED."
      - from: OPEN
        to: WAIVED
        trigger: "POST /facility-reviews/{id}/disposition with action == WAIVE"
        actor: ComplianceOfficer
        preconditions:
          - "deficiency_level == MINOR, else ERR_WAIVER_NOT_PERMITTED"
        side_effects:
          - "records waiver_granted_by_user_id"
          - "excludes the review from facility_score and from the deficiency counts, then recomputes facility_status"
      - from: REOPENED
        to: WAIVED
        trigger: "POST /facility-reviews/{id}/disposition with action == WAIVE"
        actor: ComplianceOfficer
        preconditions:
          - "deficiency_level == MINOR, else ERR_WAIVER_NOT_PERMITTED"
        side_effects:
          - "same as the OPEN -> WAIVED transition"

  - entity: StaffAllocation
    initial_state: PROPOSED
    terminal_states: [ENDED, RECALLED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /staff-allocations/{id}/disposition with action == ACTIVATE"
        actor: FarmDirector
        preconditions:
          - "the staff member's certification_expires_on is not before effective_start, else ERR_CERTIFICATION_EXPIRED"
          - "aggregate fte_pct across the member's ACTIVE allocations whose half-open intervals overlap this one, plus this allocation's fte_pct, is at most 100, else ERR_STAFF_FTE_OVERCOMMITTED"
        side_effects:
          - "recomputes StaffMember.total_committed_fte_pct"
          - "re-runs calculations.facility_posture_evaluation for the affiliate's ACTIVE agreement, which may lift posture from RESTRICTED to OPEN once every required_staff_roles entry is covered"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /staff-allocations/{id}/disposition with action == END"
        actor: FarmDirector
        preconditions: []
        side_effects:
          - "recomputes StaffMember.total_committed_fte_pct"
          - "re-runs calculations.facility_posture_evaluation, which may drive posture from OPEN to RESTRICTED when a required role loses its last ACTIVE allocation"
      - from: ACTIVE
        to: RECALLED
        trigger: "POST /staff-allocations/{id}/disposition with action == RECALL"
        actor: FarmDirector
        preconditions: []
        side_effects:
          - "same as the ACTIVE -> ENDED transition"
      - from: PROPOSED
        to: RECALLED
        trigger: "POST /staff-allocations/{id}/disposition with action == RECALL"
        actor: FarmDirector
        preconditions: []
        side_effects:
          - "no fte or posture recomputation is needed because a PROPOSED allocation never counted"

  - entity: Player
    state_field: roster_status
    initial_state: RESERVE_LIST
    terminal_states: []
    transitions:
      - from: RESERVE_LIST
        to: ACTIVE
        trigger: "system: a PlayerAssignment for this player with assignment_type IN {LEVEL, COMPLEX} moves to ACTIVE"
        actor: system
        preconditions: []
        side_effects:
          - "sets current_affiliate_id to that assignment's affiliate_id"
      - from: ACTIVE
        to: RESERVE_LIST
        trigger: "system: the player's last LEVEL or COMPLEX assignment in status ACTIVE leaves ACTIVE via COMPLETE, REVOKE or SUSPEND"
        actor: system
        preconditions: []
        side_effects:
          - "clears current_affiliate_id to null"
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system: an ISSUED MedicalClearance covering the player's ACTIVE assignment is REVOKED"
        actor: system
        preconditions: []
        side_effects:
          - "clears current_affiliate_id to null"
      - from: RESTRICTED
        to: ACTIVE
        trigger: "system: a SUSPENDED assignment for this player is RESUMEd after a fresh LEVEL_ASSIGNMENT clearance is ISSUED"
        actor: system
        preconditions: []
        side_effects:
          - "restores current_affiliate_id from the resumed assignment"
      - from: RESERVE_LIST
        to: RESTRICTED
        trigger: "system: a MedicalClearance for this player is DENIED"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESTRICTED
        to: RESERVE_LIST
        trigger: "system: a MedicalClearance for this player is ISSUED while the player holds no ACTIVE assignment"
        actor: system
        preconditions: []
        side_effects: []
    note: "Dimension 1 of 2 (parallel state machine). roster_status advances only from roster/assignment events and never from medical events alone, except where a medical event revokes the clearance underpinning an ACTIVE assignment."

  - entity: Player
    state_field: medical_status
    initial_state: PENDING_CLEARANCE
    terminal_states: []
    transitions:
      - from: PENDING_CLEARANCE
        to: CLEARED
        trigger: "system: a MedicalClearance for this player moves to ISSUED"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_CLEARANCE
        to: RESTRICTED
        trigger: "system: a MedicalClearance for this player moves to DENIED"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLEARED
        to: RESTRICTED
        trigger: "system: the player's most recent ISSUED MedicalClearance moves to REVOKED and no other non-expired ISSUED clearance remains"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLEARED
        to: RESTRICTED
        trigger: "system: any MedicalClearance for this player moves to DENIED"
        actor: system
        preconditions: []
        side_effects: []
        note: "A denial restricts the medical dimension without touching roster_status or any ACTIVE assignment, which is how the two dimensions are shown to be independent."
      - from: RESTRICTED
        to: CLEARED
        trigger: "system: a new MedicalClearance for this player moves to ISSUED"
        actor: system
        preconditions: []
        side_effects: []
    note: "Dimension 2 of 2 (parallel state machine). medical_status is a pure projection of the player's MedicalClearance rows and is independent of roster_status; the combined state (roster_status, medical_status) has nine reachable pairs."

  - entity: PlayerAssignment
    initial_state: PENDING_CLEARANCE
    terminal_states: [COMPLETED, REVOKED]
    transitions:
      - from: PENDING_CLEARANCE
        to: ACTIVE
        trigger: "POST /assignments/{id}/disposition with action == ACTIVATE"
        actor: FarmDirector
        preconditions:
          - "the affiliate has an AffiliationAgreement in status ACTIVE, else ERR_AGREEMENT_NOT_ACTIVE"
          - "that agreement's posture is not FROZEN, else ERR_AGREEMENT_POSTURE_FROZEN"
          - "for assignment_type IN {LEVEL, COMPLEX}: the player holds a MedicalClearance with clearance_type == LEVEL_ASSIGNMENT, status == ISSUED and is_expired == false; for assignment_type == REHAB: the same with clearance_type == REHAB_START. Otherwise ERR_MEDICAL_CLEARANCE_REQUIRED (or ERR_MEDICAL_CLEARANCE_EXPIRED when the only match is expired)"
          - "the affiliate's facility_status is not DEFICIENT, else ERR_FACILITY_DEFICIENCY_BLOCKING"
          - "for movement_reason == PROMOTION: calculations.promotion_readiness_score for the player is at least PROMOTION_READINESS_THRESHOLD (0.7500) and service_days_accrued is at least PROMOTION_MIN_SERVICE_DAYS (120), else ERR_PROMOTION_CRITERIA_NOT_MET"
          - "for assignment_type IN {LEVEL, COMPLEX}: affiliate.active_roster_count < affiliate.roster_limit, else ERR_ROSTER_LIMIT_EXCEEDED"
          - "for assignment_type == REHAB: affiliate.rehab_assignment_count < REHAB_SLOT_LIMIT (3), else ERR_REHAB_SLOT_LIMIT_EXCEEDED"
          - "for assignment_type IN {LEVEL, COMPLEX} with projected_optional_days >= OPTION_YEAR_MIN_DAYS (20): player.option_years_remaining >= 1, else ERR_OPTION_YEARS_EXHAUSTED"
        side_effects:
          - "for assignment_type IN {LEVEL, COMPLEX} with projected_optional_days >= 20: creates an OptionYearRecord with status == CHARGED and sets option_year_charged to true"
          - "advances Player.roster_status to ACTIVE and sets Player.current_affiliate_id for LEVEL and COMPLEX assignments"
          - "if superseded_assignment_id is set and that assignment is ACTIVE, moves it to COMPLETED"
          - "recomputes affiliate.active_roster_count or rehab_assignment_count and reserve_list_count"
          - "creates a TransactionReport in status PENDING with transaction_type derived from movement_reason (INITIAL/LATERAL/DEMOTION -> OPTIONAL_ASSIGNMENT, PROMOTION -> PROMOTION, REHAB_START -> REHAB_ASSIGNMENT) and filing_deadline = effective_date + FILING_WINDOW_DAYS (2)"
          - "re-runs calculations.facility_posture_evaluation, which may lift posture from RESTRICTED to OPEN once minimum_active_players is met"
      - from: PENDING_CLEARANCE
        to: REVOKED
        trigger: "POST /assignments/{id}/disposition with action == REVOKE"
        actor: FarmDirector
        preconditions: []
        side_effects:
          - "any DevelopmentPlan on this assignment in status IN {DRAFT, ACTIVE, REVISION_REQUESTED} moves to LAPSED"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /assignments/{id}/disposition with action == COMPLETE"
        actor: FarmDirector
        preconditions:
          - "for assignment_type == REHAB: the player holds a MedicalClearance with clearance_type == REHAB_COMPLETE and status == ISSUED, else ERR_MEDICAL_CLEARANCE_REQUIRED"
        side_effects:
          - "recomputes the affiliate's roster counters"
          - "returns Player.roster_status to RESERVE_LIST and clears current_affiliate_id when this was the player's last ACTIVE LEVEL or COMPLEX assignment"
          - "for assignment_type == REHAB: creates a TransactionReport in status PENDING with transaction_type == REHAB_COMPLETE"
          - "any DevelopmentPlan on this assignment still in DRAFT, ACTIVE or REVISION_REQUESTED moves to LAPSED"
          - "re-runs calculations.facility_posture_evaluation, which may drive posture to RESTRICTED"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /assignments/{id}/disposition with action == REVOKE"
        actor: FarmDirector
        preconditions: []
        side_effects:
          - "every OptionYearRecord with triggering_assignment_id == this assignment and status == CHARGED moves to RESCINDED, restoring Player.option_years_used and option_years_remaining (compensation)"
          - "sets option_year_charged to false"
          - "every TransactionReport for this assignment in status IN {PENDING, FILED, REJECTED_BY_LEAGUE} moves to VOIDED, and one new TransactionReport is created in status PENDING with transaction_type == REVOCATION"
          - "any DevelopmentPlan on this assignment in DRAFT, ACTIVE or REVISION_REQUESTED moves to LAPSED"
          - "recomputes the affiliate's roster counters and returns Player.roster_status to RESERVE_LIST, clearing current_affiliate_id"
          - "re-runs calculations.facility_posture_evaluation"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /assignments/{id}/disposition with action == SUSPEND, or system cascade from an agreement SUSPEND or a MedicalClearance REVOKE"
        actor: FarmDirector
        preconditions: []
        side_effects:
          - "recomputes the affiliate's roster counters (a SUSPENDED assignment no longer occupies a roster slot)"
          - "moves Player.roster_status to RESTRICTED when the trigger was a clearance REVOKE, otherwise to RESERVE_LIST"
          - "clears Player.current_affiliate_id"
          - "OptionYearRecord rows are NOT rescinded — suspension does not return an option year"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /assignments/{id}/disposition with action == RESUME"
        actor: FarmDirector
        preconditions:
          - "the affiliate's agreement is ACTIVE with posture other than FROZEN, else ERR_AGREEMENT_POSTURE_FROZEN"
          - "the player holds a non-expired ISSUED MedicalClearance of the type required by assignment_type, else ERR_MEDICAL_CLEARANCE_REQUIRED"
          - "affiliate.active_roster_count < affiliate.roster_limit, else ERR_ROSTER_LIMIT_EXCEEDED"
        side_effects:
          - "recomputes the affiliate's roster counters"
          - "restores Player.roster_status to ACTIVE and current_affiliate_id"
          - "creates a TransactionReport in status PENDING with transaction_type == RECALL"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /assignments/{id}/disposition with action == REVOKE"
        actor: FarmDirector
        preconditions: []
        side_effects:
          - "same compensation cascade as the ACTIVE -> REVOKED transition"

  - entity: DevelopmentPlan
    initial_state: DRAFT
    terminal_states: [ACHIEVED, LAPSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /development-plans/{id}/disposition with action == ACTIVATE"
        actor: FarmDirector
        preconditions:
          - "the owning PlayerAssignment is in status ACTIVE, else ERR_INVALID_ASSIGNMENT_STATE"
          - "curriculum_version equals ORG_CURRICULUM_VERSION, else ERR_CURRICULUM_VERSION_MISMATCH"
          - "no other DevelopmentPlan on the same assignment is ACTIVE, else ERR_DUPLICATE_ACTIVE_PLAN"
        side_effects:
          - "recomputes Player.workload_index_projected and Player.promotion_readiness (the plan's workload_limit_weekly_index enters both)"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /development-plans/{id}/disposition with action == RECORD_PROGRESS"
        actor: FarmDirector
        preconditions:
          - "completed_module_count in the request is strictly greater than the stored value and at most len(curriculum_modules), else ERR_INVALID_REQUEST"
        side_effects:
          - "updates completed_module_count and completion_pct"
          - "recomputes Player.promotion_readiness"
        note: "Self-transition; the plan stays ACTIVE while progress accumulates."
      - from: ACTIVE
        to: REVISION_REQUESTED
        trigger: "POST /development-plans/{id}/disposition with action == REQUEST_REVISION"
        actor: ComplianceOfficer
        preconditions:
          - "review_cycle_count < MAX_PLAN_REVISIONS (3), else ERR_CYCLE_LIMIT_REACHED"
        side_effects:
          - "increments review_cycle_count and stores revision_note"
          - "sets Player.promotion_readiness to 0.0000 because the player has no ACTIVE plan while in revision"
      - from: REVISION_REQUESTED
        to: ACTIVE
        trigger: "POST /development-plans/{id}/disposition with action == RESUBMIT"
        actor: FarmDirector
        preconditions:
          - "the owning PlayerAssignment is still in status ACTIVE, else ERR_INVALID_ASSIGNMENT_STATE"
        side_effects:
          - "recomputes Player.workload_index_projected and Player.promotion_readiness"
        note: "Closes the cycle ACTIVE -> REVISION_REQUESTED -> ACTIVE, bounded by MAX_PLAN_REVISIONS."
      - from: ACTIVE
        to: ACHIEVED
        trigger: "POST /development-plans/{id}/disposition with action == MARK_ACHIEVED"
        actor: FarmDirector
        preconditions:
          - "completion_pct == 100.00, else ERR_INVALID_PLAN_STATE"
        side_effects:
          - "recomputes Player.promotion_readiness"
      - from: DRAFT
        to: LAPSED
        trigger: "system: the owning PlayerAssignment leaves ACTIVE or PENDING_CLEARANCE for a terminal state"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: LAPSED
        trigger: "system: the owning PlayerAssignment moves to COMPLETED or REVOKED"
        actor: system
        preconditions: []
        side_effects:
          - "sets Player.promotion_readiness to 0.0000"
      - from: REVISION_REQUESTED
        to: LAPSED
        trigger: "system: the owning PlayerAssignment moves to COMPLETED or REVOKED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MedicalClearance
    initial_state: REQUESTED
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /medical-clearances/{id}/disposition with action == ISSUE"
        actor: MedicalDirector
        preconditions:
          - "expires_on is strictly after the logical clock date, else ERR_INVALID_REQUEST"
          - "for clearance_type == REHAB_COMPLETE: the player holds a PlayerAssignment with assignment_type == REHAB and status == ACTIVE, else ERR_REHAB_ASSIGNMENT_REQUIRED"
        side_effects:
          - "records issued_by_user_id, cleared_workload_ceiling_index and expires_on"
          - "advances Player.medical_status to CLEARED"
          - "moves Player.roster_status from RESTRICTED to RESERVE_LIST when the player holds no ACTIVE assignment"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /medical-clearances/{id}/disposition with action == DENY"
        actor: MedicalDirector
        preconditions: []
        side_effects:
          - "stores restriction_note"
          - "advances Player.medical_status to RESTRICTED"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /medical-clearances/{id}/disposition with action == REVOKE"
        actor: MedicalDirector
        preconditions: []
        side_effects:
          - "stores restriction_note"
          - "advances Player.medical_status to RESTRICTED when no other non-expired ISSUED clearance remains"
          - "every PlayerAssignment for this player in status ACTIVE whose required clearance_type matches this clearance moves to SUSPENDED"
          - "Player.roster_status moves to RESTRICTED and current_affiliate_id is cleared"
          - "any DevelopmentPlan on a suspended assignment stays ACTIVE but Player.promotion_readiness is recomputed"
          - "the affiliate's roster counters and its agreement's posture are recomputed, which may drive posture to RESTRICTED"

  - entity: InternationalSigning
    initial_state: SUBMITTED
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /international-signings/{id}/disposition with action == APPROVE"
        actor: ComplianceOfficer
        preconditions:
          - "the pool is in status OPEN, else ERR_POOL_HARD_CAPPED"
          - "the academy affiliate's ACTIVE agreement posture is neither FROZEN nor RESTRICTED, else ERR_AGREEMENT_POSTURE_FROZEN / ERR_AGREEMENT_POSTURE_RESTRICTED"
          - "the academy affiliate's count of players housed is below housing_beds, else ERR_ACADEMY_HOUSING_FULL"
        side_effects:
          - "runs calculations.signing_pool_charge, writing pool_charge_cents, overage_tax_cents and tier3_breach"
          - "records approved_by_user_id"
          - "recomputes SigningPool.allocated_cents, overage_tax_accrued_cents, forfeited_cents, effective_pool_cents and remaining_cents"
          - "moves the pool to HARD_CAPPED when allocated_cents exceeds effective_pool_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /international-signings/{id}/disposition with action == REJECT"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "sets rejection_reason to COMPLIANCE_DENIED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: the pool moves to HARD_CAPPED while this signing is still SUBMITTED"
        actor: system
        preconditions: []
        side_effects:
          - "sets rejection_reason to POOL_HARD_CAPPED"
        note: "Conditional cascade: only SUBMITTED siblings are auto-rejected; APPROVED and REJECTED siblings are untouched."
      - from: APPROVED
        to: VOIDED
        trigger: "POST /international-signings/{id}/disposition with action == VOID"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "removes pool_charge_cents from SigningPool.allocated_cents and overage_tax_cents from overage_tax_accrued_cents"
          - "when tier3_breach was true, subtracts TIER3_FORFEIT_CENTS (250000) from SigningPool.forfeited_cents (compensation)"
          - "recomputes effective_pool_cents and remaining_cents"
          - "returns the pool to OPEN when allocated_cents is at most effective_pool_cents"

  - entity: SigningPool
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: HARD_CAPPED
        trigger: "system: an InternationalSigning approval pushes allocated_cents above effective_pool_cents"
        actor: system
        preconditions: []
        side_effects:
          - "every sibling InternationalSigning in status SUBMITTED moves to REJECTED with rejection_reason == POOL_HARD_CAPPED"
      - from: HARD_CAPPED
        to: OPEN
        trigger: "system: an InternationalSigning VOID brings allocated_cents back to at most effective_pool_cents"
        actor: system
        preconditions: []
        side_effects:
          - "already-rejected siblings are NOT revived; the auto-rejection is not reversed"
        note: "Cyclic: a pool may re-open and be capped again."

  - entity: TransactionReport
    initial_state: PENDING
    terminal_states: [ACCEPTED, VOIDED]
    transitions:
      - from: PENDING
        to: FILED
        trigger: "POST /transaction-reports/{id}/disposition with action == FILE"
        actor: ComplianceOfficer
        preconditions:
          - "X-User-ID differs from initiated_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the producing PlayerAssignment is not in status REVOKED, else ERR_INVALID_ASSIGNMENT_STATE"
        side_effects:
          - "records certified_by_user_id and filed_at"
          - "recomputes is_late and runs calculations.transaction_filing_late_fee to write late_fee_cents"
      - from: FILED
        to: ACCEPTED
        trigger: "POST /transaction-reports/{id}/disposition with action == LEAGUE_ACCEPT"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: FILED
        to: REJECTED_BY_LEAGUE
        trigger: "POST /transaction-reports/{id}/disposition with action == LEAGUE_REJECT"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "stores league_note"
      - from: REJECTED_BY_LEAGUE
        to: PENDING
        trigger: "POST /transaction-reports/{id}/disposition with action == REFILE"
        actor: ComplianceOfficer
        preconditions:
          - "refile_count < MAX_REPORT_REFILES (2), else ERR_CYCLE_LIMIT_REACHED"
        side_effects:
          - "increments refile_count"
          - "clears certified_by_user_id and filed_at"
        note: "Closes the cycle PENDING -> FILED -> REJECTED_BY_LEAGUE -> PENDING."
      - from: PENDING
        to: VOIDED
        trigger: "system: the producing PlayerAssignment moves to REVOKED"
        actor: system
        preconditions: []
        side_effects: []
      - from: FILED
        to: VOIDED
        trigger: "system: the producing PlayerAssignment moves to REVOKED"
        actor: system
        preconditions: []
        side_effects: []
      - from: REJECTED_BY_LEAGUE
        to: VOIDED
        trigger: "system: the producing PlayerAssignment moves to REVOKED"
        actor: system
        preconditions: []
        side_effects: []

# ============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# ============================================================================

concurrency_rules:

  - rule_id: assignment-create-stale-player
    parent_entity: Player
    write_endpoint: "POST /assignments"
    occ_field: "expected_player_version"
    description: |
      Creating a PlayerAssignment against a Player whose version has advanced
      since the client last read it is rejected. A new LEVEL assignment may
      legitimately supersede the player's prior assignment, so a writer holding
      a stale view of the player would otherwise displace a movement it never
      observed; the stale version check turns that into a deterministic refusal.
    error_id: ERR_STALE_PLAYER_VERSION
    http_status: 412

  - rule_id: signing-create-stale-pool
    parent_entity: SigningPool
    write_endpoint: "POST /international-signings"
    occ_field: "expected_pool_version"
    description: |
      Submitting an InternationalSigning against a SigningPool whose version has
      advanced since the client last read it is rejected. Pool space is a shared
      quota, so a submission built on a stale view of remaining_cents would
      commit bonus money the writer never saw claimed.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412

  - rule_id: allocation-create-stale-affiliate
    parent_entity: Affiliate
    write_endpoint: "POST /staff-allocations"
    occ_field: "expected_affiliate_version"
    description: |
      Creating a StaffAllocation against an Affiliate whose version has advanced
      since the client last read it is rejected. Curriculum coverage at an
      affiliate is a single shared plan, so an allocation proposed from a stale
      view of the affiliate's staffing would silently duplicate or contradict a
      coverage change the writer never observed.
    error_id: ERR_STALE_AFFILIATE_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================

calculations:

  - name: player_workload_index
    trigger: "On WorkloadLog creation, on any PlayerAssignment status change, on DevelopmentPlan ACTIVATE / RESUBMIT / REQUEST_REVISION / LAPSE, and on every POST /_clock/set_current_utc (the rolling window moves with the clock)."
    algorithm: weighted_scoring
    formula: |
      # Per-log raw contribution (exact decimal, no intermediate rounding):
      raw(log) = W_PITCHES     * (log.pitches_thrown        / PITCH_DIVISOR)
               + W_INNINGS     * (log.innings_pitched       / INNINGS_DIVISOR)
               + W_INTENSITY   * (log.high_intensity_minutes / INTENSITY_DIVISOR)

      contribution(log) = raw(log)
                        * LEVEL_WORKLOAD_MULTIPLIER[ assignment(log).level_at_assignment ]

      # Rolling window, inclusive on both ends:
      window = [ clock_date - (WORKLOAD_WINDOW_DAYS - 1), clock_date ]

      # ---- variant actual_rolling ----
      total_actual = SUM over qualifying logs with is_rehab_outing == false of contribution(log)
      workload_index = min( WORKLOAD_INDEX_CEILING,
                            round_half_up(total_actual, 2) )

      # ---- variant projected_promotion ----
      total_projected = SUM over qualifying logs of
                            ( contribution(log)
                              * (REHAB_OUTING_WEIGHT if log.is_rehab_outing else 1) )
                      + plan_allowance
      # plan_allowance = the player's ACTIVE DevelopmentPlan.workload_limit_weekly_index,
      # or 0 when the player has no ACTIVE DevelopmentPlan.
      workload_index_projected = min( WORKLOAD_INDEX_CEILING,
                                      round_half_up(total_projected, 2) )
    input_set: |
      WorkloadLog rows whose assignment_id resolves to a PlayerAssignment with
      player_id == the player and status IN {ACTIVE, SUSPENDED, COMPLETED}, and
      whose log_date falls inside the rolling window. Logs on REVOKED and
      PENDING_CLEARANCE assignments are excluded from BOTH variants.
    constants:
      W_PITCHES: 0.55
      W_INNINGS: 0.30
      W_INTENSITY: 0.15
      PITCH_DIVISOR: 100
      INNINGS_DIVISOR: 10
      INTENSITY_DIVISOR: 60
      WORKLOAD_WINDOW_DAYS: 14
      WORKLOAD_INDEX_CEILING: 25.00
      REHAB_OUTING_WEIGHT: 0.50
      LEVEL_WORKLOAD_MULTIPLIER:
        SINGLE_A: 1.00
        HIGH_A: 1.05
        DOUBLE_A: 1.12
        TRIPLE_A: 1.18
        COMPLEX: 1.25
        DOMINICAN_ACADEMY: 1.30
    precision: "2 decimal places, round_half_up; all intermediate terms carried as exact decimals and rounded only once, at the end"
    variants:
      - name: actual_rolling
        when: "Written to Player.workload_index; this is the figure the workload-ceiling validation compares against."
        difference: "Rehab outings are excluded entirely and no development-plan allowance is added."
      - name: projected_promotion
        when: "Written to Player.workload_index_projected; consumed by promotion_readiness_score."
        difference: "Rehab outings are included at REHAB_OUTING_WEIGHT (0.50) and the ACTIVE plan's workload_limit_weekly_index is added as forward-looking allowance, so the projected figure exceeds the actual figure for identical logs."

  - name: expense_allocation_settlement
    trigger: "Variant provisional_at_submit runs on the agreement SUBMIT action; variant final_at_settlement runs on the agreement SETTLE action."
    algorithm: waterfall_allocation
    formula: |
      # Gross figures per category, in CATEGORY_ORDER:
      #   provisional variant reads the declared <cat>_expense_cents fields.
      #   final variant reads audited_<cat>_expense_cents when non-null,
      #   otherwise falls back to the declared <cat>_expense_cents field.
      club_line[cat] = round_half_up( gross[cat] * CLUB_SHARE_PCT[cat], 0 )
      # NOTE: each category line is rounded to whole cents BEFORE any summing.
      # The obligation is the sum of the per-category rounded lines, never
      # round(sum of exact products).

      # ---- variant provisional_at_submit — ONE aggregate bucket ----
      remaining = agreement.club_reimbursement_cap_cents
      allocated = 0
      for cat in CATEGORY_ORDER:                 # fixed order, never by id
          take       = min(club_line[cat], remaining)
          allocated += take
          remaining -= take
      provisional_club_obligation_cents = allocated
      affiliate_overflow_cents          = SUM(club_line) - allocated

      # ---- variant final_at_settlement — PER-CATEGORY sub-caps ----
      sub_cap[cat] = round_half_up(
                        agreement.club_reimbursement_cap_cents
                        * CLUB_SHARE_PCT[cat] / SUM_SHARE_PCT, 0 )
      final_line[cat] = min( club_line[cat], sub_cap[cat] )   # no borrowing
      final_club_obligation_cents = SUM(final_line)
      affiliate_overflow_cents    = SUM(club_line) - SUM(final_line)
    input_set: |
      The four declared (or audited) expense figures on the single
      AffiliationAgreement being submitted or settled. No other agreement's
      figures participate, and TERMINATED / REJECTED agreements are never
      recomputed.
    constants:
      CATEGORY_ORDER: ["HOUSING", "MEALS", "TRAVEL", "FACILITY_UPKEEP"]
      CLUB_SHARE_PCT:
        HOUSING: 0.75
        MEALS: 0.60
        TRAVEL: 1.00
        FACILITY_UPKEEP: 0.25
      SUM_SHARE_PCT: 2.60
    precision: "whole cents, round_half_up, applied once per category line and once per sub-cap"
    variants:
      - name: provisional_at_submit
        when: "Agreement moves DRAFT -> SUBMITTED."
        difference: "A single aggregate cap is drained in CATEGORY_ORDER, so an under-share category can consume cap headroom left by an over-share category; overflow appears only once the whole cap is exhausted."
        note: "Identical inputs yield a strictly larger obligation than the final variant whenever any single category line exceeds its pro-rata sub-cap."
      - name: final_at_settlement
        when: "Agreement SETTLE self-transition."
        difference: "The cap is first split into per-category pro-rata sub-caps (cap * share / SUM_SHARE_PCT); each category is capped independently with no cross-category borrowing, so overflow can be non-zero even when the aggregate cap is not exhausted."

  - name: signing_pool_charge
    trigger: "On the InternationalSigning APPROVE action, and reversed on VOID."
    algorithm: tiered_pricing
    formula: |
      # STEP 1 — snapshot the pool BEFORE any forfeit from this approval:
      effective_before = pool.base_pool_cents
                       + pool.trade_adjustment_cents
                       - pool.forfeited_cents
      prior_overage = max(0, pool.allocated_cents - effective_before)
      new_allocated = pool.allocated_cents + signing.bonus_cents
      total_overage = max(0, new_allocated - effective_before)

      # STEP 2 — marginal tax over the overage segments:
      tier_tax(x) = TIER_1_TAX_RATE * min(x, POOL_TIER_1_CEILING_CENTS)
                  + TIER_2_TAX_RATE * clamp(x - POOL_TIER_1_CEILING_CENTS,
                                            0,
                                            POOL_TIER_2_CEILING_CENTS
                                              - POOL_TIER_1_CEILING_CENTS)
                  + TIER_3_TAX_RATE * max(0, x - POOL_TIER_2_CEILING_CENTS)

      overage_tax_cents = round_half_up( tier_tax(total_overage)
                                       - tier_tax(prior_overage), 0 )
      pool_charge_cents = signing.bonus_cents

      # STEP 3 — the TIER_3 forfeit is applied AFTER the tax is computed:
      tier3_breach = (total_overage > POOL_TIER_2_CEILING_CENTS)
                     and (prior_overage <= POOL_TIER_2_CEILING_CENTS)
      if tier3_breach:
          pool.forfeited_cents += TIER3_FORFEIT_CENTS

      # STEP 4 — recompute the pool ledger with the post-forfeit figure:
      pool.effective_pool_cents = base + trade_adjustment - forfeited
      pool.allocated_cents      = new_allocated
      pool.remaining_cents      = effective_pool_cents - allocated_cents   # may be negative
      pool.status = HARD_CAPPED if allocated_cents > effective_pool_cents else OPEN
    input_set: |
      InternationalSigning rows with pool_id == the pool and status == APPROVED
      supply allocated_cents and overage_tax_accrued_cents. SUBMITTED, REJECTED
      and VOIDED signings contribute nothing.
    constants:
      POOL_TIER_1_CEILING_CENTS: 500000
      POOL_TIER_2_CEILING_CENTS: 1000000
      TIER_1_TAX_RATE: 0.75
      TIER_2_TAX_RATE: 1.00
      TIER_3_TAX_RATE: 1.00
      TIER3_FORFEIT_CENTS: 250000
    precision: "whole cents, round_half_up, applied once to the marginal tax difference"
    note: |
      Evaluation order is load-bearing and MUST NOT be reordered. Computing the
      overage against the post-forfeit effective pool inflates the taxable
      overage by TIER3_FORFEIT_CENTS and produces a materially different tax.

  - name: roster_capacity_and_reserve
    trigger: "On every PlayerAssignment status change and on the Affiliate-scoped agreement TERMINATE cascade."
    algorithm: aggregation
    formula: |
      active_roster_count     = COUNT(PlayerAssignment
                                      WHERE affiliate_id == affiliate.id
                                        AND status == ACTIVE
                                        AND assignment_type IN {LEVEL, COMPLEX})
      rehab_assignment_count  = COUNT(PlayerAssignment
                                      WHERE affiliate_id == affiliate.id
                                        AND status == ACTIVE
                                        AND assignment_type == REHAB)
      reserve_list_count      = COUNT(Player
                                      WHERE current_affiliate_id == affiliate.id
                                        AND is_on_domestic_reserve_list == true)

      # Admission gates, evaluated BEFORE the counters are updated:
      LEVEL / COMPLEX activation admitted iff active_roster_count < roster_limit
      REHAB activation        admitted iff rehab_assignment_count < REHAB_SLOT_LIMIT
      domestic reserve add    admitted iff reserve_list_count      < reserve_slots
    input_set: "Only ACTIVE assignments occupy slots. PENDING_CLEARANCE, SUSPENDED, COMPLETED and REVOKED assignments free their slot immediately."
    constants:
      REHAB_SLOT_LIMIT: 3
    precision: "integer counts; no rounding"

  - name: promotion_readiness_score
    trigger: "On DevelopmentPlan ACTIVATE / RECORD_PROGRESS / REQUEST_REVISION / RESUBMIT / MARK_ACHIEVED / LAPSE, on WorkloadLog creation, and on POST /_clock/set_current_utc."
    algorithm: weighted_scoring
    formula: |
      plan = the player's DevelopmentPlan with status == ACTIVE
      if plan is null: promotion_readiness = 0.0000

      module_ratio      = plan.completed_module_count / len(plan.curriculum_modules)

      workload_pressure = min( 1,
                               player.workload_index_projected
                               / (plan.workload_limit_weekly_index
                                  * PRESSURE_HORIZON_WEEKS) )
      workload_headroom = max( 0, 1 - workload_pressure )

      service_ratio     = min( 1,
                               player.service_days_accrued
                               / PROMOTION_MIN_SERVICE_DAYS )

      promotion_readiness = round_half_up(
                                W_MODULE_COMPLETION * module_ratio
                              + W_WORKLOAD_HEADROOM * workload_headroom
                              + W_SERVICE_TIME      * service_ratio , 4 )

      # Promotion admission (movement_reason == PROMOTION) requires BOTH:
      #   promotion_readiness >= PROMOTION_READINESS_THRESHOLD   (inclusive)
      #   service_days_accrued >= PROMOTION_MIN_SERVICE_DAYS     (inclusive)
      # and the target affiliate's level must rank strictly above the player's
      # current assignment level_at_assignment under LEVEL_RANK.
    input_set: |
      Exactly one ACTIVE DevelopmentPlan per player participates. Plans in
      DRAFT, REVISION_REQUESTED, ACHIEVED or LAPSED contribute nothing, and a
      player with no ACTIVE plan scores 0.0000 regardless of workload history.
    constants:
      W_MODULE_COMPLETION: 0.40
      W_WORKLOAD_HEADROOM: 0.25
      W_SERVICE_TIME: 0.35
      PRESSURE_HORIZON_WEEKS: 2
      PROMOTION_MIN_SERVICE_DAYS: 120
      PROMOTION_READINESS_THRESHOLD: 0.7500
      LEVEL_RANK:
        DOMINICAN_ACADEMY: 1
        COMPLEX: 2
        SINGLE_A: 3
        HIGH_A: 4
        DOUBLE_A: 5
        TRIPLE_A: 6
    precision: "4 decimal places, round_half_up; the three weights sum to exactly 1.00 and the score is rounded once, at the end"

  - name: option_year_charge
    trigger: "On PlayerAssignment ACTIVATE; reversed on PlayerAssignment REVOKE."
    algorithm: threshold
    formula: |
      projected_optional_days = (assignment.end_date - assignment.effective_date).days + 1

      charge_required = assignment.assignment_type IN {LEVEL, COMPLEX}
                        AND projected_optional_days >= OPTION_YEAR_MIN_DAYS

      if charge_required:
          require player.option_years_remaining >= 1   # else ERR_OPTION_YEARS_EXHAUSTED
          create OptionYearRecord(status = CHARGED,
                                  season_year = year(assignment.effective_date),
                                  optional_days = projected_optional_days)

      option_years_used      = COUNT(OptionYearRecord
                                     WHERE triggering assignment's player_id == player.id
                                       AND status == CHARGED)
      option_years_remaining = max(0, OPTION_YEARS_TOTAL - option_years_used)

      # Conservation invariant, checked after every activate and every revoke:
      #   option_years_used + option_years_remaining == OPTION_YEARS_TOTAL
      # (holds because RESCINDED records are excluded from used and remaining
      #  is derived, never independently decremented)
    input_set: "OptionYearRecord rows with status == CHARGED only; RESCINDED records are excluded from every count."
    constants:
      OPTION_YEARS_TOTAL: 3
      OPTION_YEAR_MIN_DAYS: 20
    precision: "integer counts; no rounding"

  - name: facility_posture_evaluation
    trigger: "On FacilityStandardReview creation and every disposition, on agreement ACTIVATE / SUSPEND / REINSTATE / TERMINATE, on StaffAllocation ACTIVATE / END / RECALL, on PlayerAssignment status changes, and on POST /_clock/set_current_utc."
    algorithm: threshold
    formula: |
      # --- per-review deficiency banding (inclusive boundaries) ---
      deficiency_level = NONE  if review.score >= 85
                         MINOR if 70 <= review.score <= 84
                         MAJOR if review.score <= 69

      # --- affiliate facility rollup ---
      latest[cat] = the FacilityStandardReview for this affiliate and category
                    with status != WAIVED and the greatest review_date;
                    ties on review_date broken by the later created_at
      facility_score = round_half_up( mean(latest[cat].score over all
                                           categories with a latest review), 2 )
                       # 100.00 when no non-WAIVED review exists

      open_major_deficiency_count = COUNT(review
            WHERE deficiency_level == MAJOR
              AND status IN {OPEN, REMEDIATION_SUBMITTED, REOPENED})
      open_minor_deficiency_count = COUNT(review
            WHERE deficiency_level == MINOR
              AND status IN {OPEN, REMEDIATION_SUBMITTED, REOPENED})

      facility_status = DEFICIENT   if open_major_deficiency_count >= 1
                        PROVISIONAL if open_major_deficiency_count == 0
                                     and open_minor_deficiency_count >= 1
                        COMPLIANT   otherwise

      # --- agreement posture (single derived gate) ---
      posture = FROZEN     if agreement.status != ACTIVE
                              or affiliate.facility_status == DEFICIENT
                RESTRICTED if affiliate.active_roster_count
                                 < agreement.minimum_active_players
                              or ANY role in agreement.required_staff_roles has
                                 no StaffAllocation at this affiliate with
                                 status == ACTIVE and that staff_role
                OPEN       otherwise

      # Gate semantics:
      #   FROZEN     blocks every child write at the affiliate (assignment
      #              create and activate, facility remediation submission,
      #              staff allocation create, international signing approval).
      #   RESTRICTED blocks only assignment creation with
      #              movement_reason == PROMOTION and InternationalSigning
      #              approval; all other writes proceed.
      #   OPEN       blocks nothing.
    input_set: "Non-WAIVED FacilityStandardReview rows for the affiliate (latest per category), ACTIVE StaffAllocation rows at the affiliate, and the affiliate's single AffiliationAgreement in status IN {SUBMITTED, ACTIVE, SUSPENDED}."
    constants:
      DEFICIENCY_NONE_MIN_SCORE: 85
      DEFICIENCY_MINOR_MIN_SCORE: 70
      REMEDIATION_DAYS:
        MAJOR: 30
        MINOR: 60
      REMEDIATION_REOPEN_DAYS: 15
      MAX_REVIEW_REOPENS: 2
    precision: "facility_score to 2 decimal places, round_half_up; counts are integers"

  - name: transaction_filing_late_fee
    trigger: "On the TransactionReport FILE action, and re-evaluated for PENDING reports on POST /_clock/set_current_utc."
    algorithm: tiered_pricing
    formula: |
      filing_deadline = assignment.effective_date + FILING_WINDOW_DAYS
      reference_date  = date(filed_at) when status == FILED, else clock_date
      days_late       = max(0, (reference_date - filing_deadline).days)
      is_late         = days_late > 0

      late_fee_cents  = LATE_FEE_TIER_1_PER_DAY * min(days_late,
                                                      LATE_FEE_TIER_1_DAYS)
                      + LATE_FEE_TIER_2_PER_DAY * clamp(
                            days_late - LATE_FEE_TIER_1_DAYS, 0,
                            LATE_FEE_TIER_2_DAYS - LATE_FEE_TIER_1_DAYS)
                      + LATE_FEE_TIER_3_PER_DAY * max(0,
                            days_late - LATE_FEE_TIER_2_DAYS)
    input_set: "The single TransactionReport being filed, plus its producing PlayerAssignment's effective_date. VOIDED and ACCEPTED reports are never re-priced."
    constants:
      FILING_WINDOW_DAYS: 2
      LATE_FEE_TIER_1_DAYS: 2
      LATE_FEE_TIER_2_DAYS: 7
      LATE_FEE_TIER_1_PER_DAY: 5000
      LATE_FEE_TIER_2_PER_DAY: 15000
      LATE_FEE_TIER_3_PER_DAY: 30000
      MAX_REPORT_REFILES: 2
    precision: "whole cents; all terms integral, no rounding required"

  - name: assignment_window_conflict
    trigger: "On POST /assignments, before any state is written."
    algorithm: interval_merge
    formula: |
      # PlayerAssignment intervals are CLOSED: [effective_date, end_date].
      # StaffAllocation intervals are HALF-OPEN: [effective_start, effective_end).

      for each prior in PlayerAssignment
          WHERE player_id == new.player_id
            AND status IN {PENDING_CLEARANCE, ACTIVE, SUSPENDED}
            AND assignment_type IN {LEVEL, COMPLEX}:

          if new.assignment_type == REHAB:
              continue          # a rehab assignment legitimately overlays a level assignment

          if new.superseded_assignment_id == prior.id:
              continue          # an explicit supersede waives the buffer against that row

          if intervals [new.effective_date, new.end_date] and
             [prior.effective_date, prior.end_date] intersect:
              reject ERR_ASSIGNMENT_WINDOW_CONFLICT

          gap = (new.effective_date - prior.end_date).days
          if 0 < gap <= TRANSFER_BUFFER_DAYS:
              reject ERR_ASSIGNMENT_WINDOW_CONFLICT
          # gap must be strictly greater than TRANSFER_BUFFER_DAYS (i.e. >= 3)

      # Staff FTE aggregate (half-open, so adjacency at a shared date is legal):
      overlapping = StaffAllocation WHERE staff_member_id == new.staff_member_id
                                      AND status == ACTIVE
                                      AND effective_start < new.effective_end
                                      AND new.effective_start < effective_end
      if SUM(overlapping.fte_pct) + new.fte_pct > MAX_STAFF_FTE_PCT:
          reject ERR_STAFF_FTE_OVERCOMMITTED
    input_set: "Non-terminal PlayerAssignment rows for the same player (LEVEL and COMPLEX only) and ACTIVE StaffAllocation rows for the same staff member."
    constants:
      TRANSFER_BUFFER_DAYS: 2
      MAX_STAFF_FTE_PCT: 100
    precision: "whole days; interval endpoints compared as calendar dates in UTC"

# ============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority order;
#      the FIRST violated rule determines the response and short-circuits
#      every later rule)
# ============================================================================

validations:

  # ---- 1-6: authentication, authorization, scope, segregation of duties ----
  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID request headers are present and non-empty."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of FarmDirector, MedicalDirector, ComplianceOfficer, AffiliateOperator, InternationalScout."
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "The supplied role appears in the target endpoint's roles list in §1.5."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: auth
    check: "When the role is AffiliateOperator, X-User-ID must equal the Affiliate id the target resource belongs to (the affiliate itself, its agreement's affiliate_id, its review's affiliate_id, or an allocation's affiliate_id)."
    error_id: ERR_AFFILIATE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /affiliates/{id}/agreements, POST /affiliates/{id}/facility-reviews, POST /agreements/{id}/disposition, POST /facility-reviews/{id}/disposition"

  - priority: 5
    category: auth
    check: "The requested `action` value is permitted for the acting role on this disposition endpoint (e.g. SUBMIT and SUBMIT_REMEDIATION are AffiliateOperator-only; ACTIVATE, REJECT, SUSPEND, REINSTATE, TERMINATE, SETTLE, CLOSE, REOPEN, WAIVE, REQUEST_REVISION, APPROVE, VOID, FILE, LEAGUE_ACCEPT, LEAGUE_REJECT and REFILE are ComplianceOfficer-only; ISSUE, DENY and REVOKE are MedicalDirector-only)."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all POST /*/disposition endpoints"

  - priority: 6
    category: auth
    check: "On a TransactionReport FILE action, X-User-ID must differ from the report's initiated_by_user_id — the director who initiated the player movement may not certify its league filing."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /transaction-reports/{id}/disposition"

  # ---- 10: path existence, left to right ----
  - priority: 10
    category: existence
    check: "Every id embedded in the request path resolves to a stored resource, validated left to right."
    error_id: "ERR_AFFILIATE_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_FACILITY_REVIEW_NOT_FOUND | ERR_STAFF_MEMBER_NOT_FOUND | ERR_STAFF_ALLOCATION_NOT_FOUND | ERR_PLAYER_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_DEVELOPMENT_PLAN_NOT_FOUND | ERR_MEDICAL_CLEARANCE_NOT_FOUND | ERR_SIGNING_POOL_NOT_FOUND | ERR_SIGNING_NOT_FOUND | ERR_TRANSACTION_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  # ---- 20: request body shape ----
  - priority: 20
    category: existence
    check: "Every required body field is present; enum fields carry a declared value; numeric fields respect their declared ranges; date fields parse as YYYY-MM-DD and datetime fields as ISO 8601; term_end_date > term_start_date, effective_end > effective_start, end_date >= effective_date; curriculum_modules is a non-empty duplicate-free array; unknown fields and any attempt to set a computed or system field are ignored rather than rejected."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  # ---- 30: body foreign keys ----
  - priority: 30
    category: existence
    check: "Every foreign key supplied in the request body resolves to a stored resource (player_id, affiliate_id, staff_member_id, pool_id, academy_affiliate_id, superseded_assignment_id, assignment_id)."
    error_id: "ERR_PLAYER_NOT_FOUND | ERR_AFFILIATE_NOT_FOUND | ERR_STAFF_MEMBER_NOT_FOUND | ERR_SIGNING_POOL_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /assignments, POST /staff-allocations, POST /international-signings"

  # ---- 35: optimistic concurrency ----
  - priority: 35
    category: state
    check: "The supplied expected_<parent>_version equals the parent's current version (see §1.2.1)."
    error_id: "ERR_STALE_PLAYER_VERSION | ERR_STALE_POOL_VERSION | ERR_STALE_AFFILIATE_VERSION"
    http_status: 412
    applies_to: "POST /assignments, POST /international-signings, POST /staff-allocations"

  # ---- 40-45: state preconditions and uniqueness ----
  - priority: 40
    category: state
    check: "The target resource is in a state from which the requested action is a declared transition in §1.2."
    error_id: "ERR_INVALID_AGREEMENT_STATE | ERR_INVALID_REVIEW_STATE | ERR_INVALID_ALLOCATION_STATE | ERR_INVALID_ASSIGNMENT_STATE | ERR_INVALID_PLAN_STATE | ERR_INVALID_CLEARANCE_STATE | ERR_INVALID_SIGNING_STATE | ERR_INVALID_REPORT_STATE"
    http_status: 409
    applies_to: "all POST /*/disposition endpoints, POST /assignments/{id}/development-plans, POST /assignments/{id}/workload-logs"

  - priority: 41
    category: state
    check: "A SETTLE action requires settlement_status == NOT_SETTLED."
    error_id: ERR_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /agreements/{id}/disposition"

  - priority: 45
    category: business_constraint
    check: "Uniqueness: at most one AffiliationAgreement per affiliate in status SUBMITTED or ACTIVE; SigningPool.season_year unique; at most one ACTIVE DevelopmentPlan per PlayerAssignment."
    error_id: "ERR_DUPLICATE_ACTIVE_AGREEMENT | ERR_DUPLICATE_POOL_SEASON | ERR_DUPLICATE_ACTIVE_PLAN"
    http_status: 409
    applies_to: "POST /agreements/{id}/disposition, POST /signing-pools, POST /development-plans/{id}/disposition"

  # ---- 50-56: cross-entity referential gates ----
  - priority: 50
    category: business_referential
    check: "The affiliate receiving the operation has an AffiliationAgreement in status ACTIVE."
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /assignments, POST /assignments/{id}/disposition (ACTIVATE, RESUME), POST /staff-allocations/{id}/disposition (ACTIVATE), POST /international-signings/{id}/disposition (APPROVE)"

  - priority: 52
    category: business_referential
    check: "That agreement's posture is not FROZEN. FROZEN blocks every child write at the affiliate."
    error_id: ERR_AGREEMENT_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /assignments, POST /assignments/{id}/disposition (ACTIVATE, RESUME), POST /staff-allocations, POST /international-signings/{id}/disposition (APPROVE)"
    note: "Facility-review dispositions are deliberately EXEMPT: a MAJOR deficiency is itself what freezes the posture, so gating SUBMIT_REMEDIATION on posture would make the deficiency unrecoverable."

  - priority: 54
    category: business_referential
    check: "That agreement's posture is not RESTRICTED for the two operations RESTRICTED gates: creating an assignment with movement_reason == PROMOTION, and approving an InternationalSigning at the academy. All other operations proceed while RESTRICTED."
    error_id: ERR_AGREEMENT_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /assignments, POST /international-signings/{id}/disposition (APPROVE)"

  - priority: 56
    category: business_referential
    check: "Issuing a MedicalClearance of clearance_type REHAB_COMPLETE requires the player to hold a PlayerAssignment with assignment_type == REHAB and status == ACTIVE."
    error_id: ERR_REHAB_ASSIGNMENT_REQUIRED
    http_status: 409
    applies_to: "POST /medical-clearances/{id}/disposition (ISSUE)"

  # ---- 58-62: player safety and medical compliance ----
  - priority: 58
    category: business_safety
    check: "Activating or resuming an assignment requires a matching MedicalClearance in status ISSUED (LEVEL_ASSIGNMENT for LEVEL and COMPLEX, REHAB_START for REHAB); completing a REHAB assignment requires an ISSUED REHAB_COMPLETE clearance."
    error_id: ERR_MEDICAL_CLEARANCE_REQUIRED
    http_status: 409
    applies_to: "POST /assignments/{id}/disposition"

  - priority: 59
    category: business_safety
    check: "The matching ISSUED clearance has is_expired == false, i.e. the logical clock date is not after expires_on."
    error_id: ERR_MEDICAL_CLEARANCE_EXPIRED
    http_status: 409
    applies_to: "POST /assignments/{id}/disposition"

  - priority: 60
    category: business_safety
    check: "Recording a workload log must not drive Player.workload_index above the effective ceiling min(assignment.workload_ceiling_index, clearance.cleared_workload_ceiling_index when non-null)."
    error_id: ERR_WORKLOAD_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /assignments/{id}/workload-logs"

  - priority: 62
    category: business_safety
    check: "The affiliate's facility_status is not DEFICIENT when activating an assignment or activating an agreement."
    error_id: ERR_FACILITY_DEFICIENCY_BLOCKING
    http_status: 409
    applies_to: "POST /assignments/{id}/disposition (ACTIVATE), POST /agreements/{id}/disposition (ACTIVATE, REINSTATE)"

  # ---- 64-65: curriculum consistency ----
  - priority: 64
    category: business_constraint
    check: "curriculum_version equals ORG_CURRICULUM_VERSION (2026.1) and, for a staff allocation, also equals the staff member's curriculum_version_certified."
    error_id: ERR_CURRICULUM_VERSION_MISMATCH
    http_status: 422
    applies_to: "POST /staff-allocations, POST /assignments/{id}/development-plans, POST /development-plans/{id}/disposition (ACTIVATE)"

  - priority: 65
    category: business_constraint
    check: "The staff member's certification_expires_on is not before the allocation's effective_start."
    error_id: ERR_CERTIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /staff-allocations/{id}/disposition (ACTIVATE)"

  # ---- 66-68: temporal ----
  - priority: 66
    category: business_temporal
    check: "A new LEVEL or COMPLEX assignment must neither overlap a non-terminal LEVEL/COMPLEX assignment of the same player nor start within TRANSFER_BUFFER_DAYS (2) days of that assignment's end_date; the gap must be strictly greater than 2 days. Naming the prior assignment in superseded_assignment_id waives the buffer against that one row. REHAB assignments are exempt."
    error_id: ERR_ASSIGNMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 68
    category: business_temporal
    check: "Submitting a facility remediation requires the logical clock date to be no later than remediation_due_date."
    error_id: ERR_REMEDIATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /facility-reviews/{id}/disposition (SUBMIT_REMEDIATION)"

  # ---- 70: promotion criteria ----
  - priority: 70
    category: business_constraint
    check: "For movement_reason == PROMOTION: promotion_readiness >= PROMOTION_READINESS_THRESHOLD (0.7500), service_days_accrued >= PROMOTION_MIN_SERVICE_DAYS (120), and LEVEL_RANK[target affiliate level] > LEVEL_RANK[player's current assignment level_at_assignment]."
    error_id: ERR_PROMOTION_CRITERIA_NOT_MET
    http_status: 422
    applies_to: "POST /assignments, POST /assignments/{id}/disposition (ACTIVATE)"

  # ---- 74-82: capacity, quota and fiscal ----
  - priority: 74
    category: business_fiscal
    check: "Activating or resuming a LEVEL or COMPLEX assignment requires affiliate.active_roster_count < affiliate.roster_limit, evaluated before the counter is incremented."
    error_id: ERR_ROSTER_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /assignments/{id}/disposition (ACTIVATE, RESUME)"

  - priority: 75
    category: business_fiscal
    check: "Activating a REHAB assignment requires affiliate.rehab_assignment_count < REHAB_SLOT_LIMIT (3)."
    error_id: ERR_REHAB_SLOT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /assignments/{id}/disposition (ACTIVATE)"

  - priority: 76
    category: business_fiscal
    check: "Adding a domestic-reserve-list player to an affiliate requires affiliate.reserve_list_count < affiliate.reserve_slots."
    error_id: ERR_DOMESTIC_RESERVE_LIST_FULL
    http_status: 409
    applies_to: "POST /assignments/{id}/disposition (ACTIVATE)"

  - priority: 78
    category: business_fiscal
    check: "An activation that would charge an option year (LEVEL or COMPLEX with projected_optional_days >= 20) requires player.option_years_remaining >= 1."
    error_id: ERR_OPTION_YEARS_EXHAUSTED
    http_status: 422
    applies_to: "POST /assignments/{id}/disposition (ACTIVATE)"

  - priority: 80
    category: business_fiscal
    check: "Approving an InternationalSigning requires the pool to be in status OPEN."
    error_id: ERR_POOL_HARD_CAPPED
    http_status: 409
    applies_to: "POST /international-signings/{id}/disposition (APPROVE)"

  - priority: 82
    category: business_fiscal
    check: "Approving an InternationalSigning requires the academy affiliate's count of housed players (reserve_list_count plus APPROVED signings at the academy) to be below housing_beds."
    error_id: ERR_ACADEMY_HOUSING_FULL
    http_status: 409
    applies_to: "POST /international-signings/{id}/disposition (APPROVE)"

  # ---- 84-90: aggregate and configuration constraints ----
  - priority: 84
    category: business_constraint
    check: "Aggregate fte_pct across a staff member's ACTIVE allocations whose half-open intervals overlap the new interval, plus the new allocation's fte_pct, must be at most MAX_STAFF_FTE_PCT (100). Intervals that merely touch at a shared boundary date do not overlap."
    error_id: ERR_STAFF_FTE_OVERCOMMITTED
    http_status: 422
    applies_to: "POST /staff-allocations, POST /staff-allocations/{id}/disposition (ACTIVATE)"

  - priority: 86
    category: business_constraint
    check: "Cycle caps: FacilityStandardReview.reopen_count < MAX_REVIEW_REOPENS (2), DevelopmentPlan.review_cycle_count < MAX_PLAN_REVISIONS (3), TransactionReport.refile_count < MAX_REPORT_REFILES (2)."
    error_id: ERR_CYCLE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /facility-reviews/{id}/disposition (REOPEN), POST /development-plans/{id}/disposition (REQUEST_REVISION), POST /transaction-reports/{id}/disposition (REFILE)"

  - priority: 88
    category: business_constraint
    check: "A WAIVE action is permitted only when the review's deficiency_level is MINOR; MAJOR and NONE deficiencies may never be waived."
    error_id: ERR_WAIVER_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /facility-reviews/{id}/disposition (WAIVE)"

  - priority: 89
    category: business_constraint
    check: "An InternationalSigning requires the player's origin to be INTERNATIONAL_FA and the academy affiliate's level to be DOMINICAN_ACADEMY."
    error_id: ERR_SIGNING_ELIGIBILITY_VIOLATION
    http_status: 422
    applies_to: "POST /international-signings"

  - priority: 90
    category: business_constraint
    check: "meal_stipend_cents_per_day is at least LEAGUE_MIN_MEAL_STIPEND_CENTS (2500)."
    error_id: ERR_MEAL_STIPEND_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /affiliates"

# ============================================================================
# §1.5 API Endpoint Table (40 endpoints)
# ============================================================================

endpoints:

  # ---------------- Affiliate ----------------
  - method: POST
    path: "/affiliates"
    description: "Register a minor league affiliate club or international academy complex."
    roles: [FarmDirector, ComplianceOfficer]
    code: 201
    input: [name, level, market_city, meal_stipend_cents_per_day, "roster_limit?", "reserve_slots?", "housing_beds?", "travel_standard_tier?"]
    output: Affiliate
    side_effects:
      - "applies LEVEL_ROSTER_LIMIT[level] when roster_limit is omitted"
      - "initialises facility_score to 100.00 and facility_status to COMPLIANT"
      - "initialises active_roster_count, rehab_assignment_count and reserve_list_count to 0"

  - method: GET
    path: "/affiliates/{id}"
    description: "Read one affiliate with its derived facility and roster counters."
    roles: [FarmDirector, MedicalDirector, ComplianceOfficer, AffiliateOperator, InternationalScout]
    code: 200
    input: []
    output: Affiliate
    side_effects: []

  - method: GET
    path: "/affiliates"
    description: "List affiliates, filterable by level and derived facility_status."
    roles: [FarmDirector, MedicalDirector, ComplianceOfficer, AffiliateOperator, InternationalScout]
    code: 200
    input: ["level?", "facility_status?", "limit?", "offset?"]
    output: Affiliate[]
    side_effects: []

  # ---------------- AffiliationAgreement ----------------
  - method: POST
    path: "/affiliates/{id}/agreements"
    description: "Draft a Player Development License for the affiliate, declaring facility tier, staffing floor and the four reimbursable expense categories."
    roles: [AffiliateOperator, ComplianceOfficer]
    code: 201
    input: [term_start_date, term_end_date, facility_standard_tier, club_reimbursement_cap_cents, "minimum_active_players?", "required_staff_roles?", "housing_expense_cents?", "meal_expense_cents?", "travel_expense_cents?", "upkeep_expense_cents?"]
    output: AffiliationAgreement
    side_effects:
      - "persists status DRAFT and posture FROZEN"
      - "initialises provisional_club_obligation_cents and affiliate_overflow_cents to 0 and settlement_status to NOT_SETTLED"

  - method: GET
    path: "/affiliates/{id}/agreements"
    description: "List every agreement drafted for this affiliate (reverse lookup for AffiliationAgreement.affiliate_id)."
    roles: [FarmDirector, ComplianceOfficer, AffiliateOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AffiliationAgreement[]
    side_effects: []

  - method: POST
    path: "/agreements/{id}/disposition"
    description: "Advance an agreement through SUBMIT, ACTIVATE, REJECT, SUSPEND, REINSTATE, TERMINATE or SETTLE."
    roles: [AffiliateOperator, ComplianceOfficer]
    code: 200
    input: [action, "audited_housing_expense_cents?", "audited_meal_expense_cents?", "audited_travel_expense_cents?", "audited_upkeep_expense_cents?", "note?"]
    output: AffiliationAgreement
    side_effects:
      - "applies the matching §1.2 AffiliationAgreement transition"
      - "SUBMIT runs calculations.expense_allocation_settlement variant provisional_at_submit"
      - "SETTLE runs calculations.expense_allocation_settlement variant final_at_settlement and sets settlement_status to SETTLED"
      - "ACTIVATE and REINSTATE run calculations.facility_posture_evaluation, writing posture"
      - "SUSPEND cascades ACTIVE PlayerAssignment rows at the affiliate to SUSPENDED"
      - "TERMINATE cascades non-terminal PlayerAssignment rows to REVOKED and non-terminal StaffAllocation rows to RECALLED"
      - "increments AffiliationAgreement.version by 1"

  # ---------------- FacilityStandardReview ----------------
  - method: POST
    path: "/affiliates/{id}/facility-reviews"
    description: "File a league facility / player-standard inspection result for one category at the affiliate."
    roles: [ComplianceOfficer]
    code: 201
    input: [category, review_date, score]
    output: FacilityStandardReview
    side_effects:
      - "derives deficiency_level from score (>= 85 NONE, 70..84 MINOR, <= 69 MAJOR)"
      - "persists status CLOSED with remediation_due_date null when deficiency_level == NONE, otherwise status OPEN with remediation_due_date = review_date + REMEDIATION_DAYS[deficiency_level]"
      - "recomputes Affiliate.facility_score, open_major_deficiency_count and facility_status"
      - "re-runs calculations.facility_posture_evaluation for the affiliate's non-terminal agreement, which may drive posture to FROZEN"

  - method: GET
    path: "/affiliates/{id}/facility-reviews"
    description: "List facility inspections for this affiliate (reverse lookup for FacilityStandardReview.affiliate_id)."
    roles: [FarmDirector, ComplianceOfficer, AffiliateOperator]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: FacilityStandardReview[]
    side_effects: []

  - method: POST
    path: "/facility-reviews/{id}/disposition"
    description: "Advance an inspection through SUBMIT_REMEDIATION, CLOSE, REOPEN or WAIVE."
    roles: [AffiliateOperator, ComplianceOfficer]
    code: 200
    input: [action, "remediation_note?", "note?"]
    output: FacilityStandardReview
    side_effects:
      - "applies the matching §1.2 FacilityStandardReview transition"
      - "REOPEN increments reopen_count and resets remediation_due_date to the logical clock date + REMEDIATION_REOPEN_DAYS (15)"
      - "recomputes Affiliate.facility_score, open_major_deficiency_count and facility_status"
      - "re-runs calculations.facility_posture_evaluation, which may lift or drop the agreement's posture"
      - "increments FacilityStandardReview.version by 1"

  # ---------------- StaffMember ----------------
  - method: POST
    path: "/staff-members"
    description: "Register a coach or support-staff member with a curriculum certification."
    roles: [FarmDirector]
    code: 201
    input: [full_name, discipline, curriculum_version_certified, certification_expires_on]
    output: StaffMember
    side_effects:
      - "initialises total_committed_fte_pct to 0"

  - method: GET
    path: "/staff-members/{id}"
    description: "Read one staff member with the derived aggregate FTE commitment."
    roles: [FarmDirector, ComplianceOfficer]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  - method: GET
    path: "/staff-members"
    description: "List staff members, filterable by discipline and certified curriculum version."
    roles: [FarmDirector, ComplianceOfficer]
    code: 200
    input: ["discipline?", "curriculum_version_certified?", "limit?", "offset?"]
    output: StaffMember[]
    side_effects: []

  # ---------------- StaffAllocation ----------------
  - method: POST
    path: "/staff-allocations"
    description: "Propose an allocation of a staff member to an affiliate for a half-open date interval, guarded by optimistic concurrency on the affiliate."
    roles: [FarmDirector]
    code: 201
    input: [staff_member_id, affiliate_id, staff_role, fte_pct, effective_start, effective_end, curriculum_version, expected_affiliate_version]
    output: StaffAllocation
    side_effects:
      - "rejects a stale expected_affiliate_version with ERR_STALE_AFFILIATE_VERSION (412) per §1.2.1 allocation-create-stale-affiliate"
      - "runs the staff-FTE aggregate check from calculations.assignment_window_conflict"
      - "persists status PROPOSED"
      - "increments Affiliate.version by 1"

  - method: GET
    path: "/staff-members/{id}/allocations"
    description: "List a staff member's allocations across affiliates (reverse lookup for StaffAllocation.staff_member_id)."
    roles: [FarmDirector, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StaffAllocation[]
    side_effects: []

  - method: GET
    path: "/affiliates/{id}/staff-allocations"
    description: "List allocations staffing this affiliate (reverse lookup for StaffAllocation.affiliate_id)."
    roles: [FarmDirector, ComplianceOfficer, AffiliateOperator]
    code: 200
    input: ["staff_role?", "status?", "limit?", "offset?"]
    output: StaffAllocation[]
    side_effects: []

  - method: POST
    path: "/staff-allocations/{id}/disposition"
    description: "Advance an allocation through ACTIVATE, RECALL or END."
    roles: [FarmDirector]
    code: 200
    input: [action, "note?"]
    output: StaffAllocation
    side_effects:
      - "applies the matching §1.2 StaffAllocation transition"
      - "recomputes StaffMember.total_committed_fte_pct"
      - "re-runs calculations.facility_posture_evaluation, which may move the affiliate's agreement between RESTRICTED and OPEN as required_staff_roles coverage changes"
      - "increments StaffAllocation.version by 1"

  # ---------------- Player ----------------
  - method: POST
    path: "/players"
    description: "Register a player in the organization's development pipeline."
    roles: [FarmDirector, InternationalScout]
    code: 201
    input: [full_name, origin, signed_date, "service_days_accrued?"]
    output: Player
    side_effects:
      - "persists roster_status RESERVE_LIST and medical_status PENDING_CLEARANCE"
      - "derives is_on_domestic_reserve_list from origin (false for INTERNATIONAL_FA)"
      - "initialises option_years_used to 0, option_years_remaining to OPTION_YEARS_TOTAL (3), workload_index and workload_index_projected to 0.00 and promotion_readiness to 0.0000"

  - method: GET
    path: "/players/{id}"
    description: "Read one player with both state dimensions and every derived workload / option-year figure."
    roles: [FarmDirector, MedicalDirector, ComplianceOfficer, AffiliateOperator, InternationalScout]
    code: 200
    input: []
    output: Player
    side_effects: []

  - method: GET
    path: "/players"
    description: "List players, filterable independently on each state dimension."
    roles: [FarmDirector, MedicalDirector, ComplianceOfficer, InternationalScout]
    code: 200
    input: ["roster_status?", "medical_status?", "origin?", "limit?", "offset?"]
    output: Player[]
    side_effects: []

  # ---------------- MedicalClearance ----------------
  - method: POST
    path: "/players/{id}/medical-clearances"
    description: "Open a medical clearance request for a player."
    roles: [FarmDirector, MedicalDirector]
    code: 201
    input: [clearance_type]
    output: MedicalClearance
    side_effects:
      - "persists status REQUESTED and records requested_by_user_id from X-User-ID"

  - method: GET
    path: "/players/{id}/medical-clearances"
    description: "List a player's clearances (reverse lookup for MedicalClearance.player_id)."
    roles: [FarmDirector, MedicalDirector, ComplianceOfficer]
    code: 200
    input: ["clearance_type?", "status?", "limit?", "offset?"]
    output: MedicalClearance[]
    side_effects: []

  - method: POST
    path: "/medical-clearances/{id}/disposition"
    description: "Advance a clearance through ISSUE, DENY or REVOKE."
    roles: [MedicalDirector]
    code: 200
    input: [action, "cleared_workload_ceiling_index?", "expires_on?", "restriction_note?"]
    output: MedicalClearance
    side_effects:
      - "applies the matching §1.2 MedicalClearance transition"
      - "advances Player.medical_status independently of Player.roster_status"
      - "REVOKE suspends every ACTIVE PlayerAssignment whose required clearance_type matches, moves Player.roster_status to RESTRICTED, clears Player.current_affiliate_id, recomputes the affiliate's roster counters and re-runs calculations.facility_posture_evaluation"
      - "increments MedicalClearance.version by 1"

  # ---------------- PlayerAssignment ----------------
  - method: POST
    path: "/assignments"
    description: "Create a level, complex or rehab assignment for a player, guarded by optimistic concurrency on the player."
    roles: [FarmDirector]
    code: 201
    input: [player_id, affiliate_id, assignment_type, movement_reason, effective_date, end_date, expected_player_version, "workload_ceiling_index?", "superseded_assignment_id?"]
    output: PlayerAssignment
    side_effects:
      - "rejects a stale expected_player_version with ERR_STALE_PLAYER_VERSION (412) per §1.2.1 assignment-create-stale-player"
      - "runs calculations.assignment_window_conflict over the player's non-terminal LEVEL and COMPLEX assignments"
      - "snapshots Affiliate.level into level_at_assignment and computes projected_optional_days"
      - "records initiated_by_user_id from X-User-ID and persists status PENDING_CLEARANCE"
      - "increments Player.version by 1"

  - method: GET
    path: "/assignments/{id}"
    description: "Read one assignment with its pinned level snapshot and option-year flag."
    roles: [FarmDirector, MedicalDirector, ComplianceOfficer, AffiliateOperator]
    code: 200
    input: []
    output: PlayerAssignment
    side_effects: []

  - method: GET
    path: "/assignments"
    description: "List assignments filtered by player, affiliate, superseded predecessor, status or type (reverse lookup for PlayerAssignment.player_id, PlayerAssignment.affiliate_id and PlayerAssignment.superseded_assignment_id)."
    roles: [FarmDirector, MedicalDirector, ComplianceOfficer]
    code: 200
    input: ["player_id?", "affiliate_id?", "superseded_assignment_id?", "status?", "assignment_type?", "limit?", "offset?"]
    output: PlayerAssignment[]
    side_effects: []

  - method: POST
    path: "/assignments/{id}/disposition"
    description: "Advance an assignment through ACTIVATE, COMPLETE, REVOKE, SUSPEND or RESUME."
    roles: [FarmDirector]
    code: 200
    input: [action, "note?"]
    output: PlayerAssignment
    side_effects:
      - "applies the matching §1.2 PlayerAssignment transition"
      - "ACTIVATE charges an OptionYearRecord per calculations.option_year_charge and creates a TransactionReport in status PENDING"
      - "ACTIVATE completes the assignment named by superseded_assignment_id when that assignment is ACTIVE"
      - "REVOKE rescinds every CHARGED OptionYearRecord, voids every non-terminal TransactionReport, creates a REVOCATION TransactionReport and lapses every non-terminal DevelopmentPlan"
      - "recomputes calculations.roster_capacity_and_reserve for the affiliate"
      - "advances Player.roster_status and current_affiliate_id"
      - "re-runs calculations.facility_posture_evaluation for the affiliate's agreement"
      - "increments PlayerAssignment.version by 1"

  # ---------------- DevelopmentPlan ----------------
  - method: POST
    path: "/assignments/{id}/development-plans"
    description: "Attach a curriculum-consistent development plan with workload budget to an assignment."
    roles: [FarmDirector]
    code: 201
    input: [target_level, curriculum_version, curriculum_modules, "workload_limit_weekly_index?"]
    output: DevelopmentPlan
    side_effects:
      - "persists status DRAFT with completed_module_count 0, completion_pct 0.00 and review_cycle_count 0"

  - method: GET
    path: "/assignments/{id}/development-plans"
    description: "List the development plans attached to an assignment (reverse lookup for DevelopmentPlan.assignment_id)."
    roles: [FarmDirector, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DevelopmentPlan[]
    side_effects: []

  - method: POST
    path: "/development-plans/{id}/disposition"
    description: "Advance a plan through ACTIVATE, RECORD_PROGRESS, REQUEST_REVISION, RESUBMIT or MARK_ACHIEVED."
    roles: [FarmDirector, ComplianceOfficer]
    code: 200
    input: [action, "completed_module_count?", "revision_note?"]
    output: DevelopmentPlan
    side_effects:
      - "applies the matching §1.2 DevelopmentPlan transition"
      - "RECORD_PROGRESS updates completed_module_count and completion_pct"
      - "REQUEST_REVISION increments review_cycle_count and stores revision_note"
      - "recomputes Player.workload_index_projected and Player.promotion_readiness"
      - "increments DevelopmentPlan.version by 1"

  # ---------------- WorkloadLog ----------------
  - method: POST
    path: "/assignments/{id}/workload-logs"
    description: "Append an immutable workload outing to an assignment."
    roles: [FarmDirector, MedicalDirector]
    code: 201
    input: [log_date, "pitches_thrown?", "innings_pitched?", "high_intensity_minutes?", "is_rehab_outing?"]
    output: WorkloadLog
    side_effects:
      - "runs calculations.player_workload_index for both variants, writing Player.workload_index and Player.workload_index_projected"
      - "rejects the log with ERR_WORKLOAD_CEILING_EXCEEDED when the actual variant would exceed the effective ceiling"
      - "recomputes Player.promotion_readiness"

  - method: GET
    path: "/assignments/{id}/workload-logs"
    description: "List the workload outings recorded against an assignment (reverse lookup for WorkloadLog.assignment_id)."
    roles: [FarmDirector, MedicalDirector, ComplianceOfficer]
    code: 200
    input: ["is_rehab_outing?", "limit?", "offset?"]
    output: WorkloadLog[]
    side_effects: []

  # ---------------- OptionYearRecord ----------------
  - method: GET
    path: "/assignments/{id}/option-years"
    description: "List the option-year charges an assignment produced (reverse lookup for OptionYearRecord.triggering_assignment_id); cascade-created rows are discoverable only here."
    roles: [FarmDirector, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OptionYearRecord[]
    side_effects: []

  # ---------------- TransactionReport ----------------
  - method: GET
    path: "/assignments/{id}/transaction-reports"
    description: "List the league transaction reports an assignment produced (reverse lookup for TransactionReport.assignment_id); cascade-created rows are discoverable only here."
    roles: [FarmDirector, ComplianceOfficer]
    code: 200
    input: ["status?", "transaction_type?", "limit?", "offset?"]
    output: TransactionReport[]
    side_effects: []

  - method: POST
    path: "/transaction-reports/{id}/disposition"
    description: "Advance a league transaction report through FILE, LEAGUE_ACCEPT, LEAGUE_REJECT or REFILE."
    roles: [ComplianceOfficer]
    code: 200
    input: [action, "league_note?"]
    output: TransactionReport
    side_effects:
      - "applies the matching §1.2 TransactionReport transition"
      - "FILE enforces segregation of duties against initiated_by_user_id, records certified_by_user_id and filed_at and runs calculations.transaction_filing_late_fee"
      - "REFILE increments refile_count and clears certified_by_user_id and filed_at"
      - "increments TransactionReport.version by 1"

  # ---------------- SigningPool ----------------
  - method: POST
    path: "/signing-pools"
    description: "Open an international bonus pool for a signing period."
    roles: [ComplianceOfficer]
    code: 201
    input: [season_year, base_pool_cents, "trade_adjustment_cents?"]
    output: SigningPool
    side_effects:
      - "persists status OPEN with forfeited_cents 0, allocated_cents 0 and overage_tax_accrued_cents 0"
      - "computes effective_pool_cents and remaining_cents"

  - method: GET
    path: "/signing-pools/{id}"
    description: "Read one signing pool with its full derived ledger."
    roles: [ComplianceOfficer, InternationalScout]
    code: 200
    input: []
    output: SigningPool
    side_effects: []

  # ---------------- InternationalSigning ----------------
  - method: POST
    path: "/international-signings"
    description: "Submit an international amateur signing against a pool and academy complex, guarded by optimistic concurrency on the pool."
    roles: [InternationalScout]
    code: 201
    input: [pool_id, player_id, academy_affiliate_id, bonus_cents, expected_pool_version]
    output: InternationalSigning
    side_effects:
      - "rejects a stale expected_pool_version with ERR_STALE_POOL_VERSION (412) per §1.2.1 signing-create-stale-pool"
      - "enforces the eligibility pair (player origin INTERNATIONAL_FA, academy level DOMINICAN_ACADEMY)"
      - "persists status SUBMITTED with pool_charge_cents 0 and overage_tax_cents 0"
      - "increments SigningPool.version by 1"

  - method: GET
    path: "/international-signings/{id}"
    description: "Read one international signing with its pool charge and overage tax."
    roles: [ComplianceOfficer, InternationalScout]
    code: 200
    input: []
    output: InternationalSigning
    side_effects: []

  - method: GET
    path: "/international-signings"
    description: "List international signings filtered by pool, player, academy or status (reverse lookup for InternationalSigning.pool_id, InternationalSigning.player_id and InternationalSigning.academy_affiliate_id)."
    roles: [ComplianceOfficer, InternationalScout]
    code: 200
    input: ["pool_id?", "player_id?", "academy_affiliate_id?", "status?", "limit?", "offset?"]
    output: InternationalSigning[]
    side_effects: []

  - method: POST
    path: "/international-signings/{id}/disposition"
    description: "Advance an international signing through APPROVE, REJECT or VOID."
    roles: [ComplianceOfficer]
    code: 200
    input: [action, "note?"]
    output: InternationalSigning
    side_effects:
      - "applies the matching §1.2 InternationalSigning transition"
      - "APPROVE runs calculations.signing_pool_charge, writing pool_charge_cents, overage_tax_cents and tier3_breach and updating the pool's forfeited_cents, allocated_cents, effective_pool_cents, remaining_cents and overage_tax_accrued_cents"
      - "APPROVE may move the pool to HARD_CAPPED, which auto-rejects every SUBMITTED sibling with rejection_reason POOL_HARD_CAPPED"
      - "VOID reverses the pool charge, the overage tax and any TIER_3 forfeit and may return the pool to OPEN"
      - "increments InternationalSigning.version by 1"

  # ---------------- test-driving endpoint ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, expiry, rolling-window and interval rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [FarmDirector, MedicalDirector, ComplianceOfficer, AffiliateOperator, InternationalScout]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "returns the inline object { current_utc: <the new logical instant, ISO 8601 UTC with three fractional digits> }"
      - "re-evaluates FacilityStandardReview.is_overdue, MedicalClearance.is_expired and TransactionReport.is_late / late_fee_cents for non-terminal rows"
      - "re-runs calculations.player_workload_index and calculations.promotion_readiness_score because the rolling window moves with the clock"
      - "re-runs calculations.facility_posture_evaluation"

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================

errors:

  # ---- authentication / authorization ----
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty."
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of the five declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed on the endpoint, or is not permitted to request the supplied disposition action."
  - id: ERR_AFFILIATE_SCOPE_VIOLATION
    http: 403
    condition: "An AffiliateOperator acts on a resource belonging to an Affiliate other than the one its X-User-ID identifies."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "A TransactionReport FILE action is attempted by the same X-User-ID that initiated the underlying player movement."

  # ---- existence ----
  - id: ERR_AFFILIATE_NOT_FOUND
    http: 404
    condition: "An affiliate id in the path or body does not resolve."
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "An agreement id in the path does not resolve."
  - id: ERR_FACILITY_REVIEW_NOT_FOUND
    http: 404
    condition: "A facility-review id in the path does not resolve."
  - id: ERR_STAFF_MEMBER_NOT_FOUND
    http: 404
    condition: "A staff-member id in the path or body does not resolve."
  - id: ERR_STAFF_ALLOCATION_NOT_FOUND
    http: 404
    condition: "A staff-allocation id in the path does not resolve."
  - id: ERR_PLAYER_NOT_FOUND
    http: 404
    condition: "A player id in the path or body does not resolve."
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "An assignment id in the path or body (including superseded_assignment_id) does not resolve."
  - id: ERR_DEVELOPMENT_PLAN_NOT_FOUND
    http: 404
    condition: "A development-plan id in the path does not resolve."
  - id: ERR_MEDICAL_CLEARANCE_NOT_FOUND
    http: 404
    condition: "A medical-clearance id in the path does not resolve."
  - id: ERR_SIGNING_POOL_NOT_FOUND
    http: 404
    condition: "A signing-pool id in the path or body does not resolve."
  - id: ERR_SIGNING_NOT_FOUND
    http: 404
    condition: "An international-signing id in the path does not resolve."
  - id: ERR_TRANSACTION_REPORT_NOT_FOUND
    http: 404
    condition: "A transaction-report id in the path does not resolve."

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, an enum carries an undeclared value, a numeric field falls outside its range, a date fails to parse, a date ordering constraint is violated, curriculum_modules is empty or contains duplicates, or a RECORD_PROGRESS completed_module_count is not a strict increase within bounds."

  # ---- optimistic concurrency ----
  - id: ERR_STALE_PLAYER_VERSION
    http: 412
    condition: "expected_player_version on POST /assignments does not equal the player's current version."
  - id: ERR_STALE_POOL_VERSION
    http: 412
    condition: "expected_pool_version on POST /international-signings does not equal the pool's current version."
  - id: ERR_STALE_AFFILIATE_VERSION
    http: 412
    condition: "expected_affiliate_version on POST /staff-allocations does not equal the affiliate's current version."

  # ---- state preconditions ----
  - id: ERR_INVALID_AGREEMENT_STATE
    http: 409
    condition: "The requested agreement action is not a declared transition from the agreement's current status."
  - id: ERR_INVALID_REVIEW_STATE
    http: 409
    condition: "The requested facility-review action is not a declared transition from the review's current status."
  - id: ERR_INVALID_ALLOCATION_STATE
    http: 409
    condition: "The requested staff-allocation action is not a declared transition from the allocation's current status."
  - id: ERR_INVALID_ASSIGNMENT_STATE
    http: 409
    condition: "The requested assignment action is not a declared transition from the assignment's current status, a development plan or workload log is attached to an assignment in the wrong status, or a transaction report is filed for a REVOKED assignment."
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "The requested development-plan action is not a declared transition from the plan's current status, or MARK_ACHIEVED is attempted with completion_pct below 100.00."
  - id: ERR_INVALID_CLEARANCE_STATE
    http: 409
    condition: "The requested clearance action is not a declared transition from the clearance's current status."
  - id: ERR_INVALID_SIGNING_STATE
    http: 409
    condition: "The requested signing action is not a declared transition from the signing's current status."
  - id: ERR_INVALID_REPORT_STATE
    http: 409
    condition: "The requested transaction-report action is not a declared transition from the report's current status."
  - id: ERR_ALREADY_SETTLED
    http: 409
    condition: "A SETTLE action is attempted on an agreement whose settlement_status is already SETTLED."

  # ---- uniqueness ----
  - id: ERR_DUPLICATE_ACTIVE_AGREEMENT
    http: 409
    condition: "Submitting an agreement while another agreement for the same affiliate is SUBMITTED or ACTIVE."
  - id: ERR_DUPLICATE_POOL_SEASON
    http: 409
    condition: "Creating a SigningPool for a season_year that already has a pool."
  - id: ERR_DUPLICATE_ACTIVE_PLAN
    http: 409
    condition: "Activating a development plan while another plan on the same assignment is ACTIVE."

  # ---- cross-entity referential gates ----
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "The affiliate receiving the operation has no AffiliationAgreement in status ACTIVE."
  - id: ERR_AGREEMENT_POSTURE_FROZEN
    http: 409
    condition: "The affiliate's active agreement has posture FROZEN, which blocks every child write at the affiliate."
  - id: ERR_AGREEMENT_POSTURE_RESTRICTED
    http: 409
    condition: "The affiliate's active agreement has posture RESTRICTED and the operation is one RESTRICTED gates (a PROMOTION assignment, or an international-signing approval)."
  - id: ERR_REHAB_ASSIGNMENT_REQUIRED
    http: 409
    condition: "Issuing a REHAB_COMPLETE clearance for a player who holds no ACTIVE assignment of assignment_type REHAB."

  # ---- player safety and medical compliance ----
  - id: ERR_MEDICAL_CLEARANCE_REQUIRED
    http: 409
    condition: "An assignment action requires an ISSUED MedicalClearance of the matching clearance_type and none exists."
  - id: ERR_MEDICAL_CLEARANCE_EXPIRED
    http: 409
    condition: "The only matching ISSUED MedicalClearance has is_expired == true because the logical clock date is after expires_on."
  - id: ERR_WORKLOAD_CEILING_EXCEEDED
    http: 422
    condition: "A workload log would drive the actual rolling workload index above min(assignment.workload_ceiling_index, clearance.cleared_workload_ceiling_index)."
  - id: ERR_FACILITY_DEFICIENCY_BLOCKING
    http: 409
    condition: "An agreement activation or assignment activation is attempted while the affiliate's facility_status is DEFICIENT."

  # ---- curriculum consistency ----
  - id: ERR_CURRICULUM_VERSION_MISMATCH
    http: 422
    condition: "A supplied curriculum_version differs from ORG_CURRICULUM_VERSION, or from the staff member's curriculum_version_certified."
  - id: ERR_CERTIFICATION_EXPIRED
    http: 422
    condition: "A staff allocation is activated although the member's certification_expires_on precedes effective_start."

  # ---- temporal ----
  - id: ERR_ASSIGNMENT_WINDOW_CONFLICT
    http: 409
    condition: "A new LEVEL or COMPLEX assignment overlaps, or starts within TRANSFER_BUFFER_DAYS days of, a non-terminal LEVEL or COMPLEX assignment of the same player that it does not explicitly supersede."
  - id: ERR_REMEDIATION_WINDOW_CLOSED
    http: 409
    condition: "A facility remediation is submitted after remediation_due_date has passed on the logical clock."

  # ---- promotion criteria ----
  - id: ERR_PROMOTION_CRITERIA_NOT_MET
    http: 422
    condition: "A PROMOTION movement fails the readiness threshold, the minimum service-day floor, or the strict level-rank increase."

  # ---- capacity, quota and fiscal ----
  - id: ERR_ROSTER_LIMIT_EXCEEDED
    http: 409
    condition: "Activating or resuming a LEVEL or COMPLEX assignment when active_roster_count already equals roster_limit."
  - id: ERR_REHAB_SLOT_LIMIT_EXCEEDED
    http: 409
    condition: "Activating a REHAB assignment when rehab_assignment_count already equals REHAB_SLOT_LIMIT."
  - id: ERR_DOMESTIC_RESERVE_LIST_FULL
    http: 409
    condition: "Adding a domestic-reserve-list player when reserve_list_count already equals reserve_slots."
  - id: ERR_OPTION_YEARS_EXHAUSTED
    http: 422
    condition: "An option-year-charging activation is attempted when option_years_remaining is 0."
  - id: ERR_POOL_HARD_CAPPED
    http: 409
    condition: "Approving an international signing against a pool in status HARD_CAPPED."
  - id: ERR_ACADEMY_HOUSING_FULL
    http: 409
    condition: "Approving an international signing when the academy affiliate's housed-player count already equals housing_beds."

  # ---- aggregate and configuration constraints ----
  - id: ERR_STAFF_FTE_OVERCOMMITTED
    http: 422
    condition: "Aggregate fte_pct across a staff member's overlapping ACTIVE allocations plus the new allocation exceeds MAX_STAFF_FTE_PCT (100)."
  - id: ERR_CYCLE_LIMIT_REACHED
    http: 409
    condition: "A facility-review REOPEN, development-plan REQUEST_REVISION or transaction-report REFILE would exceed its declared cycle cap."
  - id: ERR_WAIVER_NOT_PERMITTED
    http: 422
    condition: "A WAIVE action is attempted on a review whose deficiency_level is not MINOR."
  - id: ERR_SIGNING_ELIGIBILITY_VIOLATION
    http: 422
    condition: "An international signing names a player whose origin is not INTERNATIONAL_FA, or an academy affiliate whose level is not DOMINICAN_ACADEMY."
  - id: ERR_MEAL_STIPEND_BELOW_MINIMUM
    http: 422
    condition: "meal_stipend_cents_per_day is below LEAGUE_MIN_MEAL_STIPEND_CENTS (2500)."

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================

roles:

  - name: FarmDirector
    description: "Runs the organization's player development pipeline: registers players and staff, moves players between affiliates and levels, allocates coaching staff, records workload and drives development plans."
    identity: "opaque"
    exclusive_operations:
      - "POST /staff-members"
      - "POST /staff-allocations"
      - "POST /staff-allocations/{id}/disposition (ACTIVATE, RECALL, END)"
      - "POST /assignments"
      - "POST /assignments/{id}/disposition (ACTIVATE, COMPLETE, REVOKE, SUSPEND, RESUME)"
      - "POST /assignments/{id}/development-plans"
      - "POST /development-plans/{id}/disposition (ACTIVATE, RECORD_PROGRESS, RESUBMIT, MARK_ACHIEVED)"
      - "GET /assignments/{id}/option-years"
    shared_operations:
      - "POST /affiliates (with ComplianceOfficer)"
      - "POST /players (with InternationalScout)"
      - "POST /players/{id}/medical-clearances (with MedicalDirector)"
      - "POST /assignments/{id}/workload-logs (with MedicalDirector)"
      - "every GET endpoint listing affiliates, players, assignments, allocations, plans, workload logs and transaction reports"
      - "POST /_clock/set_current_utc"

  - name: MedicalDirector
    description: "Owns medical clearance for player assignment, rehab and return-to-play, and the workload ceilings those clearances impose."
    identity: "opaque"
    exclusive_operations:
      - "POST /medical-clearances/{id}/disposition (ISSUE, DENY, REVOKE)"
    shared_operations:
      - "POST /players/{id}/medical-clearances (with FarmDirector)"
      - "POST /assignments/{id}/workload-logs (with FarmDirector)"
      - "GET /players, GET /players/{id}, GET /players/{id}/medical-clearances, GET /assignments, GET /assignments/{id}, GET /assignments/{id}/workload-logs, GET /affiliates, GET /affiliates/{id}"
      - "POST /_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "Certifies affiliation agreements and their expense settlements, files league facility inspections and dispositions, manages international bonus pools, and certifies league transaction filings. May never certify a filing for a movement it initiated."
    identity: "opaque"
    exclusive_operations:
      - "POST /affiliates/{id}/facility-reviews"
      - "POST /transaction-reports/{id}/disposition (FILE, LEAGUE_ACCEPT, LEAGUE_REJECT, REFILE)"
      - "POST /signing-pools"
      - "POST /international-signings/{id}/disposition (APPROVE, REJECT, VOID)"
      - "POST /agreements/{id}/disposition (ACTIVATE, REJECT, SUSPEND, REINSTATE, TERMINATE, SETTLE)"
      - "POST /facility-reviews/{id}/disposition (CLOSE, REOPEN, WAIVE)"
      - "POST /development-plans/{id}/disposition (REQUEST_REVISION)"
    shared_operations:
      - "POST /affiliates (with FarmDirector)"
      - "POST /affiliates/{id}/agreements (with AffiliateOperator)"
      - "every GET endpoint except GET /staff-members and GET /staff-members/{id} restrictions do not apply — the officer may read all collections"
      - "POST /_clock/set_current_utc"

  - name: AffiliateOperator
    description: "Acts on behalf of a single minor league club: drafts and submits its own affiliation agreement and submits facility remediation for its own inspections. X-User-ID is the Affiliate id."
    identity: "entity_backed:Affiliate"
    exclusive_operations:
      - "POST /agreements/{id}/disposition (SUBMIT)"
      - "POST /facility-reviews/{id}/disposition (SUBMIT_REMEDIATION)"
    shared_operations:
      - "POST /affiliates/{id}/agreements (with ComplianceOfficer), restricted to its own affiliate"
      - "GET /affiliates, GET /affiliates/{id}, GET /affiliates/{id}/agreements, GET /affiliates/{id}/facility-reviews, GET /affiliates/{id}/staff-allocations, GET /players/{id}, GET /assignments/{id}"
      - "POST /_clock/set_current_utc"

  - name: InternationalScout
    description: "Signs international amateur players and submits their bonuses against the organization's signing pool for compliance approval; never approves its own submissions."
    identity: "opaque"
    exclusive_operations:
      - "POST /international-signings"
    shared_operations:
      - "POST /players (with FarmDirector)"
      - "GET /signing-pools/{id}, GET /international-signings, GET /international-signings/{id}, GET /affiliates, GET /affiliates/{id}, GET /players, GET /players/{id}"
      - "POST /_clock/set_current_utc"

