              payload: { provider_id: "${prov_id}", calling_number: "+12025550901", description: "Neighbor-spoofed robocall campaign, first notice" }
              as: Regulator
              captures: { notice_a: $.data.id }
            - call: "POST /rmd/illegal-traffic-notices"
              payload: { provider_id: "${prov_id}", calling_number: "+12025550902", description: "Neighbor-spoofed robocall campaign, second notice" }
              as: Regulator
              captures: { notice_b: $.data.id }
            - call: "POST /rmd/illegal-traffic-notices/${notice_b}/investigate"
              payload: { customer_id: "${cust_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
            - call: "POST /rmd/illegal-traffic-notices/${notice_b}/mitigate"
              payload: { mitigation_action: "NUMBERS_REVOKED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
          assert:
            - "The first read returns 200 with data.open_notice_count == 2 (one NOTIFIED plus one UNDER_INVESTIGATION)"
            - "The first read also shows data.penalty_points == 0, data.overdue_traceback_count == 0, data.sweep_index == 0 and data.blocking_false_positive_rate == 0.0000"
            - "The second read returns data.open_notice_count == 1 and data.penalty_points == 0 (a timely mitigation assesses nothing)"
            - "IllegalTrafficNotice.${notice_b}.state == MITIGATED and resolved_at == 2026-08-10T00:00:00Z"
            - "IllegalTrafficNotice.${notice_a}.state == NOTIFIED with mitigation_deadline_at == 2026-08-12T00:00:00Z"

      - name: compliance_sweep_expires_only_the_rows_whose_deadline_has_passed
        claim_type: bulk_action
        grounds:
          - "endpoints[POST /rmd/compliance-sweeps]"
          - state_machines.Certificate.ISSUED_to_EXPIRED
          - state_machines.TracebackRequest.RECEIVED_to_OVERDUE
          - state_machines.IllegalTrafficNotice.NOTIFIED_to_EXPIRED_UNMITIGATED
          - calculations.provider_assignment_and_blocking_metrics
        distinguishing_aspect: "One sweep call touches three different entity families and must skip-not-fail the rows still inside their window: the far-dated ACTIVE certificate, the fresh traceback and the fresh notice are left alone while their expired siblings all transition in the same request, and the resulting counters are the sum of the transitions that actually fired."
        test_recipe:
          setup:
            - "One provider with an ACCEPTED plan, one ACTIVE far-dated certificate plus one ISSUED certificate already past not_after, one traceback past its deadline plus one fresh traceback, and one notice past its deadline plus one fresh notice"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
