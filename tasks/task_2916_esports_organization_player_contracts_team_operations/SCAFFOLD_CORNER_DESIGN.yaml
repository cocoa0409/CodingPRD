  # ===========================================================================
  - section: validations
    instances:

      - name: association_terms_bind_members_only_while_the_salary_floor_is_universal
        claim_type: Conditional validation
        grounds:
          - validations[priority=13]
          - errors[ERR_BELOW_MINIMUM_SALARY]
          - errors[ERR_PRIZE_SPLIT_BELOW_ASSOCIATION_MIN]
          - errors[ERR_STREAMING_HOURS_EXCEED_ASSOCIATION_MAX]
          - entities.Player.fields.association_member
          - entities.League.fields.association_min_prize_split_bp
          - entities.League.fields.association_max_streaming_hours_per_week
        distinguishing_aspect: |
          The same offer body is legal for a non-member and illegal for a member: prize_split
          3999 bp and streaming 21 hours are refused only when Player.association_member is true,
          while base_salary 3599999 is refused for both players because the league minimum is not
          an association term. The member's boundary values 4000 bp and exactly 20 hours pass.
        test_recipe:
          setup:
            - "One league: minimum_salary_cents 3600000, association_min_prize_split_bp 4000, association_max_streaming_hours_per_week 20"
            - "One organization; player M with association_member true and player N with association_member false"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueAdmin
              as_user_id: "admin-1"
            - call: "POST /leagues"
              payload: { name: "Apex Masters League", season_start_at: "2026-08-01T00:00:00Z", season_end_at: "2027-07-31T00:00:00Z", roster_lock_at: "2026-09-15T00:00:00Z", transfer_window_open_at: "2026-08-05T00:00:00Z", transfer_window_close_at: "2026-08-31T00:00:00Z", minimum_salary_cents: 3600000, association_min_prize_split_bp: 4000, association_max_streaming_hours_per_week: 20 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { league_id: $.data.id }
            - call: "POST /organizations"
              payload: { league_id: "${league_id}", name: "Vertex Vanguard", tax_jurisdiction_code: "US-CA", annual_salary_budget_cents: 50000000 }
              as: LeagueAdmin
              as_user_id: "admin-1"
              captures: { org_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Mina Okafor", birth_date: "2001-05-14", region_code: "US", association_member: true }
              as: Scout
              as_user_id: "scout-7"
              captures: { pM_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Noor Haddad", birth_date: "2002-03-09", region_code: "US", association_member: false }
              as: Scout
              as_user_id: "scout-7"
              captures: { pN_id: $.data.id }
          trigger:
            - call: "POST /contract-offers"
              payload: { organization_id: "${org_id}", player_id: "${pM_id}", base_salary_cents: 3599999, term_months: 12, prize_split_player_pct_bp: 4000, streaming_hours_per_week: 20, tax_residency_code: "US-CA" }
              as: GeneralManager
              as_user_id: "${org_id}"
            - call: "POST /contract-offers"
              payload: { organization_id: "${org_id}", player_id: "${pM_id}", base_salary_cents: 4000000, term_months: 12, prize_split_player_pct_bp: 3999, streaming_hours_per_week: 20, tax_residency_code: "US-CA" }
              as: GeneralManager
              as_user_id: "${org_id}"
            - call: "POST /contract-offers"
              payload: { organization_id: "${org_id}", player_id: "${pM_id}", base_salary_cents: 4000000, term_months: 12, prize_split_player_pct_bp: 4000, streaming_hours_per_week: 21, tax_residency_code: "US-CA" }
              as: GeneralManager
              as_user_id: "${org_id}"
            - call: "POST /contract-offers"
              payload: { organization_id: "${org_id}", player_id: "${pM_id}", base_salary_cents: 3600000, term_months: 12, prize_split_player_pct_bp: 4000, streaming_hours_per_week: 20, tax_residency_code: "US-CA" }
              as: GeneralManager
              as_user_id: "${org_id}"
              captures: { oM_id: $.data.id }
            - call: "POST /contract-offers"
              payload: { organization_id: "${org_id}", player_id: "${pN_id}", base_salary_cents: 3600000, term_months: 12, prize_split_player_pct_bp: 3999, streaming_hours_per_week: 40, tax_residency_code: "US-CA" }
              as: GeneralManager
              as_user_id: "${org_id}"
              captures: { oN_id: $.data.id }
            - call: "POST /contract-offers"
              payload: { organization_id: "${org_id}", player_id: "${pN_id}", base_salary_cents: 3599999, term_months: 12, prize_split_player_pct_bp: 3999, streaming_hours_per_week: 40, tax_residency_code: "US-CA" }
              as: GeneralManager
              as_user_id: "${org_id}"
            - call: "GET /contract-offers"
              payload: { organization_id: "${org_id}", limit: 10, offset: 0 }
              as: GeneralManager
              as_user_id: "${org_id}"
          assert:
            - "Offer 1 (member, 3599999) returned 422 ERR_BELOW_MINIMUM_SALARY"
            - "Offer 2 (member, prize_split 3999) returned 422 ERR_PRIZE_SPLIT_BELOW_ASSOCIATION_MIN"
            - "Offer 3 (member, streaming 21) returned 422 ERR_STREAMING_HOURS_EXCEED_ASSOCIATION_MAX"
            - "Offer 4 (member, 3600000 / 4000 bp / 20 hours) returned 201 — all three comparisons are inclusive at the boundary"
            - "Offer 5 (non-member, prize_split 3999 and 40 streaming hours) returned 201 — neither association term applies"
            - "Offer 6 (non-member, 3599999) returned 422 ERR_BELOW_MINIMUM_SALARY — the salary floor is league-wide"
            - "GET /contract-offers for ${org_id} returns total_count == 2, holding ${oM_id} and ${oN_id} only"

      - name: roster_size_upper_and_lower_bounds_are_both_enforced
        claim_type: Violation to Error
        grounds:
          - validations[priority=11]
          - errors[ERR_ROSTER_SIZE_EXCEEDED]
          - errors[ERR_ROSTER_SIZE_BELOW_MINIMUM]
          - entities.League.fields.max_roster_size
          - entities.League.fields.min_roster_size
          - entities.Organization.fields.active_roster_count
        distinguishing_aspect: |
          With min_roster_size and max_roster_size both 1 the roster is pinned: a second
          acceptance is refused with ERR_ROSTER_SIZE_EXCEEDED at the ceiling and the execution
          of an approved RELEASE is refused with ERR_ROSTER_SIZE_BELOW_MINIMUM at the floor, so
          active_roster_count can neither rise nor fall from 1.
        test_recipe:
          setup:
            - "One league with min_roster_size 1 and max_roster_size 1, one organization with budget 50000000"
            - "Two adult players; the first is signed effective 2026-08-05 and the second holds an open offer"
            - "One APPROVED RELEASE move for the signed player"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
