    code: 201
    input: [tier, channel, recipient_label]
    output: NotificationLog
    side_effects:
      - "NotificationLog row created with sent_at = logical clock and late computed against notification_due_at"
      - "CriticalFinding.notification_status advances PENDING -> OWNER_NOTIFIED -> FHWA_REPORTED; notification_late becomes sticky-true once any link is late"

