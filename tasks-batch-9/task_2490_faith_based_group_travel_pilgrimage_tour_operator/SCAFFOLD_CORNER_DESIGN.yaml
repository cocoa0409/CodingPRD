        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: "Authentication is checked before authorisation, so a read with no X-Role header returns 401 ERR_UNAUTHENTICATED rather than 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "Empty store; the check does not depend on any data."
          setup_api_calls: []
          trigger:
            - call: "GET /departures"
              payload: {}
              as: NONE
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

