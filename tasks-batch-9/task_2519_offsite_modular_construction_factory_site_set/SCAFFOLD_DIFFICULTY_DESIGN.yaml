  - rule_id: cross_entity_state_dependency
    instances:
      - name: module_line_slot_depends_on_permit_record_state_plan_review_approval
        grounds:
          - validations[priority=83]
          - state_machines[PermitRecord.status]
          - state_machines[ModuleUnit.production_status]
          - calculations.permit_posture_derivation
          - endpoints[POST /modular/modules/{moduleId}/schedule-line-slot]
        entity_pair: [ModuleUnit, PermitRecord]
        distinguishing_aspect: |
          The gated entity (ModuleUnit) and the gating entity (PermitRecord) are joined only through
          the Project: nothing on the module row records the permit, so the check must be a live
          read of the state modular program plan-review record. This is the permitting-bifurcation
          rule — the STATE track releases factory production while the LOCAL_AHJ track is
          irrelevant here, which is why granting a LOCAL_AHJ FOUNDATION approval does not unblock
          the slot.
