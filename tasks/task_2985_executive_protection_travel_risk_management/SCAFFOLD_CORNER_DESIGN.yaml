# =============================================================================
# §1.9 Scaffold Corner Design — Executive Protection & Travel Risk Management
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Section names and claim_type
# values are taken from references/claim-extraction-guide.md; nothing else is
# invented. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear
# as `excluded_because:` stubs naming the covering §1.8 instance.
#
# Every setup_api_calls / trigger entry is a structured call against a §1.5
# endpoint. The logical clock defaults to 2026-08-01T00:00:00Z and is pinned by
# POST /_clock/set_current_utc wherever an instant matters.
#
# Opaque-role identities used throughout: "ops-1" (SystemOperator),
# "compliance-1" (ComplianceOfficer).
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:

      - name: create_executive_returns_201_with_declared_defaults
        claim_type: creation
        grounds:
          - entities.Executive
          - endpoints.POST_/exec-protection/executives
          - response_envelope.success
        distinguishing_aspect: |
          Every field the Executive table declares must be present in the 201 body, and the
          six computed ledgers must be seeded rather than omitted: committed, spent,
          annual_disclosed_perquisite, business_borne_security and open_degraded_trip_count
          all start at 0 while remaining_budget_cents starts equal to the full annual budget.
          residential_survey_status starts PENDING and threat_level starts LOW even though no
          survey and no assessment exist yet.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one MANAGER staff row to act as ProtectionManager"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
          trigger:
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_2", role_title: "CFO", base_country_code: "US", annual_security_budget_cents: 40000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { exec_id: $.data.id, rem: $.data.remaining_budget_cents }
          assert:
            - "HTTP 201 with response_type == 'object' and a meta block carrying api_request_id and api_request_timestamp"
            - "echoed inputs: full_name == 'Eve Exec', tier == TIER_2, role_title == 'CFO', base_country_code == 'US', annual_security_budget_cents == 40000000"
            - "omitted optional inputs take their declared defaults: consent_scope == NONE and consent_expires_at == null"
            - "system and computed fields are seeded: residential_survey_status == PENDING, residential_component == 0, public_exposure_score == 0, threat_level == LOW"
            - "ledgers are seeded: committed_budget_cents == 0, spent_budget_cents == 0, remaining_budget_cents == 40000000, annual_disclosed_perquisite_cents == 0, business_borne_security_cents == 0, open_degraded_trip_count == 0"
            - "common fields are present: id is a UUID with no type prefix, created_at and updated_at are ISO-8601 UTC with three fractional digits, version == 1"

      - name: get_vendor_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - entities.Vendor
          - endpoints.GET_/exec-protection/vendors/{id}
        distinguishing_aspect: |
          The read-back must reproduce every stored input field and the two derived fields
          (activation_status AVAILABLE, committed_engagement_hours 0) without re-deriving
          anything, and must return the same version the create returned — a GET is not a
          mutation and must not bump version or updated_at.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one MANAGER staff row; one GROUND_SECURITY vendor in PT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/vendors"
              payload: { vendor_name: "Guarda Atlantica", vendor_type: "GROUND_SECURITY", country_code: "PT", max_concurrent_engagements: 2, sla_response_minutes: 45, hourly_rate_cents: 10000, retainer_cents: 50000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { vendor_id: $.data.id, ven_v0: $.data.version }
          trigger:
            - call: "GET /exec-protection/vendors/${vendor_id}"
              payload: {}
              as: SecurityAnalyst
              as_user_id: "${mgr_id}"
              captures: { read_v: $.data.version }
          assert:
            - "HTTP 200 with response_type == 'object' and data.id == ${vendor_id}"
            - "vendor_name == 'Guarda Atlantica', vendor_type == GROUND_SECURITY, country_code == 'PT', max_concurrent_engagements == 2, sla_response_minutes == 45, hourly_rate_cents == 10000, retainer_cents == 50000"
            - "activation_status == AVAILABLE, suspension_reason == null, committed_engagement_hours == 0"
            - "version == 1 and equal to the value the create returned: the read did not mutate the row"

      - name: list_trips_returns_a_paginated_envelope_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/exec-protection/trips
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three trips exist for one executive; a limit of 2 must return exactly 2 rows with
          total_count 3 and has_more true, and offset 2 must return the remaining 1 row with
          total_count still 3 and has_more false. total_count counts the FILTERED set, not the
          page, and not the whole table — the executive_id filter is applied before the count.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; two executives; three DRAFT trips for the first executive and one DRAFT trip for the second"
            - "one APPROVED assessment per executive (POST /exec-protection/trips requires an existing risk_assessment_id)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/destination-ratings"
              payload: { country_code: "PT", crime_index: 10.00, political_instability_index: 8.00, medical_infrastructure_index: 90.00, natural_hazard_index: 12.00, advisory_effective_at: "2026-07-01T00:00:00Z" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_3", role_title: "CEO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { execA: $.data.id }
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Otto Other", tier: "TIER_3", role_title: "COO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { execB: $.data.id }
            - call: "POST /exec-protection/risk-assessments"
              payload: { executive_id: "${execA}", authored_by_staff_id: "${analyst_id}", threat_monitoring_score: 20.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { raA: $.data.id }
            - call: "POST /exec-protection/risk-assessments"
              payload: { executive_id: "${execB}", authored_by_staff_id: "${analyst_id}", threat_monitoring_score: 20.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { raB: $.data.id }
            - call: "POST /exec-protection/trips"
              payload: { executive_id: "${execA}", created_by_staff_id: "${mgr_id}", risk_assessment_id: "${raA}", trip_purpose: "BUSINESS_TRAVEL", primary_destination_country_code: "PT", depart_at: "2026-09-01T00:00:00Z", return_at: "2026-09-02T00:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { tripA1: $.data.id }
            - call: "POST /exec-protection/trips"
              payload: { executive_id: "${execA}", created_by_staff_id: "${mgr_id}", risk_assessment_id: "${raA}", trip_purpose: "BUSINESS_TRAVEL", primary_destination_country_code: "PT", depart_at: "2026-09-03T00:00:00Z", return_at: "2026-09-04T00:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { tripA2: $.data.id }
            - call: "POST /exec-protection/trips"
              payload: { executive_id: "${execA}", created_by_staff_id: "${mgr_id}", risk_assessment_id: "${raA}", trip_purpose: "BUSINESS_TRAVEL", primary_destination_country_code: "PT", depart_at: "2026-09-05T00:00:00Z", return_at: "2026-09-06T00:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { tripA3: $.data.id }
            - call: "POST /exec-protection/trips"
              payload: { executive_id: "${execB}", created_by_staff_id: "${mgr_id}", risk_assessment_id: "${raB}", trip_purpose: "BUSINESS_TRAVEL", primary_destination_country_code: "PT", depart_at: "2026-09-07T00:00:00Z", return_at: "2026-09-08T00:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { tripB1: $.data.id }
          trigger:
            - call: "GET /exec-protection/trips"
              payload: { executive_id: "${execA}", limit: 2, offset: 0 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { first_id: "$.data[0].id" }
            - call: "GET /exec-protection/trips"
              payload: { executive_id: "${execA}", limit: 2, offset: 2 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { third_id: "$.data[0].id" }
          assert:
            - "the first page returns HTTP 200 with response_type == 'array', exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "the second page returns exactly 1 row, total_count == 3, has_more == false, limit == 2, offset == 2"
            - "every returned row has executive_id == ${execA}; the fourth trip ${tripB1} appears in neither page"
            - "the two pages are disjoint and together cover ${tripA1}, ${tripA2} and ${tripA3}"

      - name: create_trip_without_cost_allocation_method_defaults_to_prorata
        claim_type: defaults
        grounds:
          - entities.Trip.cost_allocation_method
          - entities.Trip.approval_state
          - entities.Trip.readiness_state
          - endpoints.POST_/exec-protection/trips
        distinguishing_aspect: |
          cost_allocation_method is the only optional enum on trip creation with a non-null
          default, and PRORATA is the value that later routes the close through the perquisite
          tier ladder rather than through the 0.00 or 1.00 overrides. Omitting it must yield
          PRORATA, not null and not BUSINESS_ONLY; insurance_policy_id, the other optional
          input, must default to null in the same response.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one executive; PT rated; one DRAFT assessment (trip creation does not gate on assessment status)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_3", role_title: "CEO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { exec_id: $.data.id }
            - call: "POST /exec-protection/destination-ratings"
              payload: { country_code: "PT", crime_index: 10.00, political_instability_index: 8.00, medical_infrastructure_index: 90.00, natural_hazard_index: 12.00, advisory_effective_at: "2026-07-01T00:00:00Z" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/risk-assessments"
              payload: { executive_id: "${exec_id}", authored_by_staff_id: "${analyst_id}", threat_monitoring_score: 20.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /exec-protection/trips"
              payload: { executive_id: "${exec_id}", created_by_staff_id: "${mgr_id}", risk_assessment_id: "${ra_id}", trip_purpose: "BUSINESS_TRAVEL", primary_destination_country_code: "PT", depart_at: "2026-09-10T00:00:00Z", return_at: "2026-09-12T00:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { trip_id: $.data.id, method: $.data.cost_allocation_method }
          assert:
            - "HTTP 201 with cost_allocation_method == PRORATA — not null, not BUSINESS_ONLY"
            - "insurance_policy_id == null (the other optional input's declared default)"
            - "approval_state == DRAFT, readiness_state == NOT_READY, required_approval_level == MANAGER, max_leg_risk_band == null"
            - "provisional_security_cost_cents == 0, total_security_cost_cents == 0, perquisite_rate_applied == 0, check_in_interval_hours == 24, next_check_in_due_at == null, briefing_ack_at == null, denied_reason == null, closed_at == null"
            - "duress_active == false and missed_check_in_count == 0"

      - name: assignment_computes_cost_and_hours_and_treats_client_supplied_values_as_extra_field
        claim_type: computed_fields
        grounds:
          - entities.ProtectiveDetailAssignment.planned_billable_hours
          - entities.ProtectiveDetailAssignment.cost_cents
          - calculations.detail_assignment_cost
          - validations[priority=3]
        distinguishing_aspect: |
          planned_billable_hours and cost_cents are `source: computed`, and §1.4 priority 3
          declares that unknown extra fields are IGNORED rather than rejected. Sending
          cost_cents 1 and planned_billable_hours 1 in the create body must therefore yield
          201 — not 422 — with the server's own figures 4 and 45000, proving both that the
          calculation ran and that the extra keys were dropped rather than honoured.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one executive with an APPROVED assessment; PT rated; one trip 2026-09-10T00:00:00Z..2026-09-12T00:00:00Z with one leg over the same window"
            - "one ANALYST staff row at 9000 cents/hour to assign"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Dan Director", staff_role: "DIRECTOR", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 15000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { dir_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Sam Agent", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { sam_id: $.data.id }
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_3", role_title: "CEO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { exec_id: $.data.id }
            - call: "POST /exec-protection/executives/${exec_id}/residential-survey"
              payload: { survey_outcome: "COMPLETE", residential_component: 10.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/destination-ratings"
              payload: { country_code: "PT", crime_index: 10.00, political_instability_index: 8.00, medical_infrastructure_index: 90.00, natural_hazard_index: 12.00, advisory_effective_at: "2026-07-01T00:00:00Z" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/risk-assessments"
              payload: { executive_id: "${exec_id}", authored_by_staff_id: "${analyst_id}", threat_monitoring_score: 20.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /exec-protection/risk-assessments/${ra_id}/submit"
              payload: {}
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /exec-protection/risk-assessments/${ra_id}/review"
              payload: { outcome: "APPROVE", review_notes: "cleared" }
              as: SecurityDirector
              as_user_id: "${dir_id}"
            - call: "POST /exec-protection/trips"
              payload: { executive_id: "${exec_id}", created_by_staff_id: "${mgr_id}", risk_assessment_id: "${ra_id}", trip_purpose: "BUSINESS_TRAVEL", primary_destination_country_code: "PT", depart_at: "2026-09-10T00:00:00Z", return_at: "2026-09-12T00:00:00Z", cost_allocation_method: "PRORATA" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /exec-protection/trips/${trip_id}/legs"
              payload: { sequence_no: 1, destination_country_code: "PT", arrive_at: "2026-09-10T00:00:00Z", depart_at: "2026-09-12T00:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { leg_id: $.data.id, leg_v0: $.data.version }
          trigger:
            - call: "POST /exec-protection/detail-assignments"
              payload: { trip_leg_id: "${leg_id}", staff_id: "${sam_id}", role_on_detail: "DRIVER", starts_at: "2026-09-10T08:00:00Z", ends_at: "2026-09-10T14:00:00Z", expected_trip_leg_version: "${leg_v0}", cost_cents: 1, planned_billable_hours: 1 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { pda_id: $.data.id, hours: $.data.planned_billable_hours, cost: $.data.cost_cents }
          assert:
            - "HTTP 201 — the unknown extra keys cost_cents and planned_billable_hours are ignored, NOT rejected with ERR_INVALID_REQUEST, per validations[priority=3]"
            - "planned_billable_hours == 6 (ceil of the six-hour window), NOT the supplied 1"
            - "cost_cents == 45900 == round_half_up(6 * 9000 * 0.85) for role_on_detail DRIVER, NOT the supplied 1"
            - "cost_basis == PROVISIONAL, status == CONFIRMED, actual_ends_at == null, final_billable_hours == null, cancelled_reason == null"
            - "SecurityStaff.${sam_id}.committed_detail_hours == 6 and released_detail_hours == 0"

      - name: exposure_signal_and_check_in_are_immutable_rows_without_a_version
        claim_type: immutability
        grounds:
          - entities.PublicExposureSignal
          - entities.CheckIn
          - endpoints.POST_/exec-protection/executives/{id}/exposure-signals
        distinguishing_aspect: |
          PublicExposureSignal and CheckIn are the scaffold's only `common_fields: false`
          entities. They must therefore carry id and created_at but NO updated_at and NO
          version, and §1.5 must expose no PATCH or DELETE for either — an observation log is
          append-only, which is what lets calculations.public_exposure_score replay it. A
          second signal for the same executive at the same observed_at is a second row, not an
          overwrite.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one executive"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_3", role_title: "CEO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { exec_id: $.data.id }
          trigger:
            - call: "POST /exec-protection/executives/${exec_id}/exposure-signals"
              payload: { signal_type: "MEDIA_MENTION", severity: 3, observed_at: "2026-07-20T00:00:00Z", source_note: "profile piece" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { sig1: $.data.id }
            - call: "POST /exec-protection/executives/${exec_id}/exposure-signals"
              payload: { signal_type: "MEDIA_MENTION", severity: 3, observed_at: "2026-07-20T00:00:00Z", source_note: "syndicated reprint" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { sig2: $.data.id }
            - call: "GET /exec-protection/executives/${exec_id}/exposure-signals"
              payload: { signal_type: "MEDIA_MENTION" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
              captures: { listed: "$.data[0].id" }
          assert:
            - "each 201 body carries id and created_at but has NO updated_at field and NO version field"
            - "the two signals have different ids: ${sig1} != ${sig2} — the second create appended a row rather than overwriting the first"
            - "GET /exec-protection/executives/${exec_id}/exposure-signals?signal_type=MEDIA_MENTION returns total_count == 2"
            - "§1.5 declares no PATCH, PUT or DELETE on /exec-protection/executives/{id}/exposure-signals and none on any check-in path: the only mutation verb for either entity is POST"
            - "Executive.${exec_id}.public_exposure_score reflects BOTH rows, confirming the log is replayed rather than deduplicated"

      - name: create_leg_under_an_unknown_trip_returns_trip_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=11]
          - errors.ERR_TRIP_NOT_FOUND
          - endpoints.POST_/exec-protection/trips/{id}/legs
        distinguishing_aspect: |
          TripLeg's parent is addressed in the URL, so an unknown parent must produce the
          parent's 404 (ERR_TRIP_NOT_FOUND) and never the child's — no TripLeg row is created
          and no ERR_TRIP_LEG_NOT_FOUND is returned. The nested route is one of only two
          nesting families in an otherwise flat topology, so this is where a wrong-404 bug
          would surface.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; PT rated; no trip with the id used by the trigger exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/destination-ratings"
              payload: { country_code: "PT", crime_index: 10.00, political_instability_index: 8.00, medical_infrastructure_index: 90.00, natural_hazard_index: 12.00, advisory_effective_at: "2026-07-01T00:00:00Z" }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
          trigger:
            - call: "POST /exec-protection/trips/11111111-2222-3333-4444-555555555555/legs"
              payload: { sequence_no: 1, destination_country_code: "PT", arrive_at: "2026-09-10T08:00:00Z", depart_at: "2026-09-10T18:00:00Z" }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP 404 with error_id == ERR_TRIP_NOT_FOUND and a non-empty message"
            - "error_id is NOT ERR_TRIP_LEG_NOT_FOUND — the missing entity is the parent named in the path"
            - "response_type == 'error' and the body carries only error_id and message under data"
            - "no TripLeg row exists afterwards: GET /exec-protection/trips/11111111-2222-3333-4444-555555555555/legs also returns ERR_TRIP_NOT_FOUND"

  - section: state_machines
    instances:

      - name: newly_created_assessment_and_policy_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.RiskAssessment.initial_state
          - state_machines.InsurancePolicy.initial_state
        distinguishing_aspect: |
          Neither creation endpoint accepts a status input, so both rows must materialise in the
          machine's declared initial_state with every downstream field null: a RiskAssessment
          starts DRAFT with revision_round 0 and all three component scores plus
          composite_risk_score at 0 (they are written at submit, not at create), and an
          InsurancePolicy starts UNVERIFIED with verified_at null even though its window is
          already open at the clock.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one executive whose residential survey is already COMPLETE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "ops-1"
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Ana Analyst", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 9000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { analyst_id: $.data.id }
            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Mia Manager", staff_role: "MANAGER", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 11000 }
              as: SystemOperator
              as_user_id: "ops-1"
              captures: { mgr_id: $.data.id }
            - call: "POST /exec-protection/executives"
              payload: { full_name: "Eve Exec", tier: "TIER_3", role_title: "CEO", base_country_code: "US", annual_security_budget_cents: 100000000 }
              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { exec_id: $.data.id }
            - call: "POST /exec-protection/executives/${exec_id}/residential-survey"
              payload: { survey_outcome: "COMPLETE", residential_component: 10.00 }
              as: SecurityAnalyst
              as_user_id: "${analyst_id}"
          trigger:
            - call: "POST /exec-protection/risk-assessments"
              payload: { executive_id: "${exec_id}", authored_by_staff_id: "${analyst_id}", threat_monitoring_score: 20.00 }
              as: SecurityAnalyst
