          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "After a successful reservation on a unit advances its version, a second create still carrying the old expected_gear_unit_version is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A unit reserved once (version advanced); client replays the pre-advance version."]
          setup_api_calls:
            - call: "POST /rental/_clock/set"
              payload: { to_iso8601: "2026-06-17T08:00:00Z" }
              as: ShopAdmin
            - call: "POST /rental/gear-types"
              payload: { category: "KAYAK", name: "Occ", size_label: "M" }
