      - name: settlement_timing_uniqueness_and_negative_payout_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SHOW_NOT_YET_CONCLUDED
          - errors.ERR_SETTLEMENT_ALREADY_EXISTS
          - errors.ERR_SETTLEMENT_NEGATIVE_PAYOUT
          - validations.priority_29
          - validations.priority_35
          - validations.priority_48
        distinguishing_aspect: |
          Three fiscal/temporal codes on the settlement arc are triggered on one
          deliberately underwater show: creating a settlement while the logical clock is
          rewound behind load_out_end_utc is 422 ERR_SHOW_NOT_YET_CONCLUDED (even one
          millisecond short), a second create is 409 ERR_SETTLEMENT_ALREADY_EXISTS
          against the DRAFT that already exists, and submitting the negative total is 422
          ERR_SETTLEMENT_NEGATIVE_PAYOUT -- a settlement may be computed and stored
          negative but never submitted.
        test_recipe:
          setup:
            - "Canonical edition and Grandstand stage; agent agent-hollis; artist Dust Road Revival."
            - "A deliberately small VERSUS deal: offered_guarantee_cents 500000, backend_split_pct 0.85, backend_breakeven_cents 0, show 2026-08-22, load-in 14:00Z, load-out 23:00Z."
            - "One SOUND rider line of requested_cost_cents 2000000 with artist_recoupable true, ruled APPROVED, so booking.recoupable_production_cost_cents becomes 2000000 and base_promoter_expense becomes 2000000 + 2500000 = 4500000."
            - "One RESERVED BLEACHER scale, face 3770, allotment 250, unbundled, facility_fee_cents 0; announced with doors 2026-08-22T18:00:00.000Z; 100 ONLINE units sold, so adjusted_gross is round_half_up(3770 * 100 * 0.9425) = 355323 -- far under the 4500000 expense floor."
            - "Arithmetic of the underwater settlement, all computed in advance: provisional_net_pool = max(0, 355323 + 0 - 4500000) = 0; VERSUS payout = max(500000, round_half_up(0 * 0.85)) = 500000; surcharge = round_half_up(500000 * 0.035) = 17500; net_pool = 0 - 17500 = -17500; merch fee = min(max(round_half_up(0 * 0.20), 25000), 750000) = 25000 so merch share = -25000; total_artist_settlement_cents = 500000 + (-25000) - 2000000 = -1525000."
