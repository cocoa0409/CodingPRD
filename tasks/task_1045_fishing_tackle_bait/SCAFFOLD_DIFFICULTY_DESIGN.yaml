              as: ShopManager
              captures: { g2_id: "$.data.id" }
            - call: "POST /api/guides"
              payload: { name: "G3", license_no: "N3" }
              as: ShopManager
              captures: { g3_id: "$.data.id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g1_id}", title: "C1", start_at: "2026-08-01T09:00:00Z", end_at: "2026-08-01T12:00:00Z", capacity: 4, price_per_seat_cents: 10000 }
              as: ShopManager
              captures: { c1_id: "$.data.id" }
            - call: "POST /api/charters"
              payload: { guide_id: "${g2_id}", title: "C4", start_at: "2026-08-01T11:00:00Z", end_at: "2026-08-01T14:00:00Z", capacity: 4, price_per_seat_cents: 10000 }
