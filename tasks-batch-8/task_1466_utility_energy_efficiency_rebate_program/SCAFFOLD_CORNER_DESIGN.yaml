          TradeAlly A attempting to submit an application owned by TradeAlly B
          (where application.trade_ally_id == B) returns 403 ERR_FORBIDDEN.
        test_recipe:
          setup:
            - "OPEN ProgramYear; two ACTIVE TradeAllies A and B"
            - "DRAFT application owned by ally B"
