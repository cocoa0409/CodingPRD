              payload: { payee_id: "${payee_1}", payee_tin: "999-99-9999", amount_cents: 10000, payment_type: "VENDOR" }
              as: PaymentAgencyAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_PAYEE_TIN_MISMATCH"
            - "GET /payments?payment_file_id=${file_1} returns 0 rows"

