            - { call: "POST /gifted/screening-cycles/${cyc}/cut-score-profiles", payload: { label: "P_BAND", ability_weight: 0.40, achievement_weight: 0.30, rating_weight: 0.20, portfolio_weight: 0.10, cut_score: 95, review_band_floor: 88, cut_score_2e: 90, review_band_floor_2e: 82 }, as: GiftedCoordinator, captures: { prof: $.data.id } }
            - { call: "POST /gifted/cut-score-profiles/${prof}/publish", payload: { expected_cycle_version: "${cyc_v}" }, as: GiftedCoordinator }
            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "ST-WA", legal_name: "Stu WA", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-a" }, as: GiftedCoordinator, captures: { stu_a: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu_a}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator, captures: { case_a: $.data.id } }
            - { call: "POST /gifted/students", payload: { student_number: "ST-WB", legal_name: "Stu WB", grade_level: 3, school_site_id: "${site_id}", demographic_group: "BLACK", primary_guardian_user_id: "guard-b" }, as: GiftedCoordinator, captures: { stu_b: $.data.id } }
            - { call: "POST /gifted/cases", payload: { student_id: "${stu_b}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator, captures: { case_b: $.data.id } }
            - { call: "POST /gifted/cases/${case_a}/placements", payload: { site_id: "${site_id}", service_model: "PULL_OUT", start_on: "2026-09-01" }, as: GiftedCoordinator, captures: { pa: $.data.id } }
            - { call: "POST /gifted/placements/${pa}/accept", payload: {}, as: ParentGuardian, as_user_id: "guard-a" }
            - { call: "POST /gifted/cases/${case_b}/placements", payload: { site_id: "${site_id}", service_model: "PULL_OUT", start_on: "2026-09-01" }, as: GiftedCoordinator, captures: { pb: $.data.id } }
          trigger:
            - { call: "POST /gifted/placements/${pb}/accept", payload: {}, as: ParentGuardian, as_user_id: "guard-b" }
            - { call: "POST /gifted/placements/${pa}/withdraw", payload: {}, as: GiftedCoordinator }
            - { call: "POST /gifted/placements/${pb}/accept", payload: {}, as: ParentGuardian, as_user_id: "guard-b" }
          assert:
            - "first accept of ${pb}: status WAITLISTED (seat full: occupied 1 >= capacity 1), waitlisted_at set"
            - "withdraw ${pa}: PA EXITED, end_on 2026-08-20, Student.${stu_a}.gifted_status == EXITED"
            - "promotion: ${pb} WAITLISTED -> OFFERED with offered_on == 2026-08-20 and accept_by == 2026-09-19"
            - "second accept of ${pb}: status ACTIVE; SchoolSite.${site_id}.pull_out_occupied == 1"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: reeval_exit_cascades_seat_release_and_promotion
        grounds:
          - state_machines.ReEvaluation.IN_REVIEW_to_CONCLUDED
          - state_machines.ServicePlacement.ACTIVE_to_EXITED
          - state_machines.ServicePlacement.WAITLISTED_to_OFFERED
          - calculations.seat_availability
          - calculations.waitlist_promotion
        distinguishing_aspect: |
          Depth-3 cascade from the conclude trigger: conclude EXITED mutates placement PA
          (ACTIVE -> EXITED); that mutation recomputes the site's pull_out_occupied (1 -> 0);
          that recomputation itself triggers the promotion of waitlisted PB
          (WAITLISTED -> OFFERED). Each link is caused by the previous link, not by the
          original conclude.
        test_recipe:
          setup:
            - "clock 2026-08-20; site pull_out_capacity 1; students A and B honored via TRANSFER_HONOR"
            - "PA offered+accepted (ACTIVE, occupies the seat); PB offered, accept attempt lands WAITLISTED"
