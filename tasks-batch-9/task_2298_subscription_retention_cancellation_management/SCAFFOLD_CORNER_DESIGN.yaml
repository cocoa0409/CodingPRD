          - state_machines.SaveOfferGrant.transitions.PRESENTED_to_EXPIRED
        distinguishing_aspect: |
          One completion call must produce all four declared effects at once: session
          COMPLETED_CANCELLED with step_count 4, subscription PENDING_CANCEL with
          cancel_effective_at pinned to next_renewal_at (2026-02-07, access is not cut immediately),
          the outstanding PRESENTED grant EXPIRED, and a CANCELLATION_CONFIRMATION notice in SENT.
        test_recipe:
          setup:
            - "Clock 2026-01-10; CORE subscription for subscriber A; template T_PRICE (DISCOUNT 0.1000 for 1 cycle, reason PRICE, rank 10)."
            - "A session captured reason PRICE and a specialist presented the offer, leaving one PRESENTED grant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
