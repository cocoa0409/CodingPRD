        grounds: ['validations[priority=8]', 'errors[ERR_SECTION_CAPACITY_REACHED]']
        distinguishing_aspect: "Capacity 1: the first enrollment succeeds (count 0 < 1); the second hits count == capacity and is rejected — equality is the blocking boundary."
