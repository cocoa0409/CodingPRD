- section: errors
  instances:
  - name: unauthenticated_when_the_role_header_is_not_a_declared_role
    claim_type: triggerability
    grounds:
    - errors[ERR_UNAUTHENTICATED]
    - validations[priority=1]
    - roles
    distinguishing_aspect: 'Priority 1 separates ''who are you'' from ''may you'': a request carrying the role name Auditor — a string absent from §1.7 — is refused 401 ERR_UNAUTHENTICATED, not 403 ERR_UNAUTHORIZED, and nothing is persisted.'
    test_recipe:
      setup:
      - Empty database; the logical clock is at the default 2026-08-01T00:00:00Z.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /properties
        payload:
          name: Cypress Logistics Center
          state_code: TX
          asset_type: INDUSTRIAL
          purchase_price_cents: 1200000000
          appraised_value_cents: 1200000000
          annual_noi_cents: 97000000
          occupancy_rate: 0.95
          contract_close_deadline: '2026-09-30T23:59:59.999Z'
        as: Auditor
        as_user_id: auditor-1
        captures:
          err_auth: $.data.error_id
      assert:
      - response status is 401 and error_id == ERR_UNAUTHENTICATED
      - the status is NOT 403 and error_id is NOT ERR_UNAUTHORIZED — an unrecognised role never reaches the permission check
      - GET /properties returns total_count == 0
