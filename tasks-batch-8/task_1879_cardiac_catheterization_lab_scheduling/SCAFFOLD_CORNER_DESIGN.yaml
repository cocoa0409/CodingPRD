            - "HTTP 400; error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

  # ---------------------------------------------------------------------------
  # Section: endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: get_case_returns_stored_fields
        claim_type: standard_crud
        grounds: ["endpoints.GET_/cath-lab/cases/{caseId}"]
        distinguishing_aspect: "GET /cath-lab/cases/{id} returns every persisted input field plus computed fields (contrast_limit_ml, cumulative totals, bump_count)."
        test_recipe:
          setup: ["One cardiologist; one POSTED ELECTIVE case with equipment_needs [IVUS]"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: ELECTIVE, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0, equipment_needs: [IVUS] }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /cath-lab/cases/${case_id}"
              as: RecoveryNurseManager
              captures: { mrn: $.data.patient_mrn, limit: $.data.contrast_limit_ml, cum_c: $.data.cumulative_contrast_ml, cum_r: $.data.cumulative_radiation_mgy, auc: $.data.auc_status }
          assert:
            - "patient_mrn == MRN-1; procedure_type == PCI; priority == ELECTIVE; equipment_needs == [IVUS]"
            - "contrast_limit_ml == 300.0 (5.0 * 70 / 1.0 = 350 capped); cumulative_contrast_ml == 0; cumulative_radiation_mgy == 0; radiation_alert == false; auc_status == NOT_DOCUMENTED"
            - "Any role may read (here RecoveryNurseManager)"

      - name: computed_read_case_lists_reverse_reachability
        claim_type: computed_read
        grounds: ["endpoints.GET_/cath-lab/cases/{caseId}/staff-assignments", "endpoints.GET_/cath-lab/staff/{staffId}/assignments"]
        distinguishing_aspect: "Both reverse-reachability GETs return the same StaffAssignment: via the case sub-resource and via the staff sub-resource."
        test_recipe:
          setup: ["URGENT case SCHEDULED with tech T ASSIGNED as SCRUB"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { tech1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
              captures: { asg_id: $.data.id, asg_ws: $.data.window_start, asg_we: $.data.window_end }
          trigger:
            - call: "GET /cath-lab/cases/${case_id}/staff-assignments"
              as: CathLabScheduler
              captures: { via_case: "$.data[0].id" }
            - call: "GET /cath-lab/staff/${tech1_id}/assignments"
              as: CathLabScheduler
              captures: { via_staff: "$.data[0].id" }
          assert:
            - "Both lists contain exactly the assignment ${asg_id}"
            - "StaffAssignment window_start == 2026-08-10T09:00:00Z and window_end == 2026-08-10T10:30:00Z (copied from the case schedule at assignment time)"

      - name: conditional_action_schedule_only_from_posted_or_bumped
        claim_type: conditional_action
        grounds: ["endpoints.POST_/cath-lab/cases/{caseId}/schedule", "state_machines.CathCase"]
        distinguishing_aspect: "schedule is conditional on from-state: it succeeds from POSTED and BUMPED but is rejected from SCHEDULED (already scheduled) with ERR_CASE_INVALID_STATE."
        test_recipe:
          setup: ["URGENT case already SCHEDULED on R1 with B1; second room R2 and bed B2 exist"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 2", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room2_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 2" }
              as: RecoveryNurseManager
              captures: { bed2_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room2_id}", scheduled_start: "2026-08-11T09:00:00Z", bed_id: "${bed2_id}" }
              as: CathLabScheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_CASE_INVALID_STATE (SCHEDULED is not a valid from-state for schedule)"
            - "Case remains SCHEDULED on ${room1_id} with scheduled_start 2026-08-10T09:00:00Z"

  # ---------------------------------------------------------------------------
  # Section: errors (triggerability sweep for errors not exercised elsewhere)
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: remaining_not_found_errors_triggerable
        claim_type: error_triggerable
        grounds: ["errors[ERR_ASSIGNMENT_NOT_FOUND]", "errors[ERR_USAGE_NOT_FOUND]", "errors[ERR_BED_NOT_FOUND]", "errors[ERR_DOSE_RECORD_NOT_FOUND]", "errors[ERR_SUBMISSION_NOT_FOUND]"]
        distinguishing_aspect: "Every resource-specific 404 in the catalog is triggerable on its flat action/read endpoint; each returns its own error_id (not a generic 404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /cath-lab/staff-assignments/11111111-2222-3333-4444-555555555555/release"
              as: CathLabScheduler
              captures: { err1: $.data.error_id }
            - call: "POST /cath-lab/device-usages/11111111-2222-3333-4444-555555555555/implant"
              as: CathLabTechnologist
              captures: { err2: $.data.error_id }
            - call: "GET /cath-lab/recovery-beds/11111111-2222-3333-4444-555555555555"
              as: RecoveryNurseManager
              captures: { err3: $.data.error_id }
            - call: "POST /cath-lab/dose-records/11111111-2222-3333-4444-555555555555/void"
              as: CathLabTechnologist
              captures: { err4: $.data.error_id }
            - call: "GET /cath-lab/registry-submissions/11111111-2222-3333-4444-555555555555"
              as: RegistryCoordinator
              captures: { err5: $.data.error_id }
          assert:
            - "err1 == ERR_ASSIGNMENT_NOT_FOUND; err2 == ERR_USAGE_NOT_FOUND; err3 == ERR_BED_NOT_FOUND; err4 == ERR_DOSE_RECORD_NOT_FOUND; err5 == ERR_SUBMISSION_NOT_FOUND (all HTTP 404)"

      - name: double_release_usage_returns_invalid_state
        claim_type: error_triggerable
        grounds: ["errors[ERR_USAGE_INVALID_STATE]", "state_machines.DeviceUsage"]
        distinguishing_aspect: "ERR_USAGE_INVALID_STATE fires when releasing an already-RELEASED DeviceUsage (RESERVED is the only valid from-state)."
        test_recipe:
          setup: ["URGENT case SCHEDULED; lot L qty 2 threshold 1; usage U RESERVED then RELEASED"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/device-lots"
              payload: { device_type: STENT_DES, manufacturer: "Acme", model_number: "DS-100", lot_number: "LOT-G", ownership: OWNED, quantity_on_hand: 2, reorder_threshold: 1, expiration_date: "2027-01-01T00:00:00Z" }
              as: CathLabTechnologist
              captures: { lot_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/device-usages"
              payload: { lot_id: "${lot_id}", quantity: 1 }
              as: CathLabTechnologist
              captures: { usage_id: $.data.id }
            - call: "POST /cath-lab/device-usages/${usage_id}/release"
              as: CathLabTechnologist
          trigger:
            - call: "POST /cath-lab/device-usages/${usage_id}/release"
              as: CathLabTechnologist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_USAGE_INVALID_STATE"
            - "DeviceUsage.${usage_id}.status remains RELEASED; DeviceLot.allocated_units remains 0"

      - name: difficulty_covered_error_triggers
        claim_type: error_triggerable
        grounds: ["errors[ERR_CONTRAST_LIMIT_EXCEEDED]", "errors[ERR_INSUFFICIENT_DEVICE_STOCK]", "errors[ERR_ROOM_WINDOW_CONFLICT]", "errors[ERR_STAFF_WINDOW_CONFLICT]", "errors[ERR_DEVICE_EXPIRED]", "errors[ERR_STAFF_INACTIVE]", "errors[ERR_CASE_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / contrast_exactly_at_limit_allowed_above_rejected
          rationale: "These error triggers are asserted as failure paths of the named difficulty instances (contrast/stock boundaries, room/staff overlap, expiry priority, staff-active dependency, schedule-from-terminal state)."

  # ---------------------------------------------------------------------------
  # Section: rbac
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: technologist_cannot_schedule_case
        claim_type: rbac_deny
        grounds: ["roles.CathLabTechnologist", "endpoints.POST_/cath-lab/cases/{caseId}/schedule", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Scheduling is exclusive to CathLabScheduler; a CathLabTechnologist attempting it is denied 403 ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["URGENT case POSTED; room R; bed B1"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabTechnologist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403; error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "CathCase.${case_id}.status remains POSTED"

      - name: scheduler_cannot_restock_lot
        claim_type: rbac_deny
        grounds: ["roles.CathLabScheduler", "endpoints.POST_/cath-lab/device-lots/{lotId}/restock"]
        distinguishing_aspect: "Restock is exclusive to CathLabTechnologist; the scheduler is denied even with a correct OCC version."
        test_recipe:
          setup: ["Lot L qty 2 threshold 1 (version 1)"]
          setup_api_calls:
            - call: "POST /cath-lab/device-lots"
              payload: { device_type: STENT_DES, manufacturer: "Acme", model_number: "DS-100", lot_number: "LOT-H", ownership: OWNED, quantity_on_hand: 2, reorder_threshold: 1, expiration_date: "2027-01-01T00:00:00Z" }
              as: CathLabTechnologist
              captures: { lot_id: $.data.id, lot_v: $.data.version }
          trigger:
            - call: "POST /cath-lab/device-lots/${lot_id}/restock"
              payload: { quantity: 5, expected_lot_version: "${lot_v}" }
              as: CathLabScheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403; error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "DeviceLot.${lot_id}.quantity_on_hand remains 2 and version remains ${lot_v}"

      - name: cardiologist_cannot_create_device_lot
        claim_type: rbac_deny
        grounds: ["roles.InterventionalCardiologist", "endpoints.POST_/cath-lab/device-lots"]
        distinguishing_aspect: "Device-lot management is exclusive to CathLabTechnologist; a cardiologist is denied 403."
        test_recipe:
          setup: ["One cardiologist staff member exists"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
          trigger:
            - call: "POST /cath-lab/device-lots"
              payload: { device_type: STENT_DES, manufacturer: "Acme", model_number: "DS-100", lot_number: "LOT-I", ownership: OWNED, quantity_on_hand: 2, reorder_threshold: 1, expiration_date: "2027-01-01T00:00:00Z" }
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403; error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: registry_coordinator_cannot_create_case
        claim_type: rbac_deny
        grounds: ["roles.RegistryCoordinator", "endpoints.POST_/cath-lab/cases"]
        distinguishing_aspect: "Case posting is shared by CathLabScheduler and InterventionalCardiologist only; RegistryCoordinator is denied 403 (segregation of registry duties from clinical work)."
        test_recipe:
          setup: ["One cardiologist exists"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
          trigger:
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: RegistryCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403; error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: all_roles_can_read_shared_get_endpoints
        claim_type: rbac_allow
        grounds: ["roles.CathLabScheduler", "roles.InterventionalCardiologist", "roles.CathLabTechnologist", "roles.RecoveryNurseManager", "roles.RegistryCoordinator"]
        distinguishing_aspect: "GET list endpoints are shared across all five roles; each role receives 200 with the same data."
        test_recipe:
          setup: ["One cardiologist; one POSTED case"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
          trigger:
            - call: "GET /cath-lab/cases"
              as: CathLabScheduler
            - call: "GET /cath-lab/cases"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
            - call: "GET /cath-lab/cases"
              as: CathLabTechnologist
            - call: "GET /cath-lab/cases"
              as: RecoveryNurseManager
            - call: "GET /cath-lab/cases"
              as: RegistryCoordinator
          assert:
            - "All five calls return HTTP 200 with total_count == 1"

  # ---------------------------------------------------------------------------
  # Section: cross_cutting_complexity_layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_auc_stale_case_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[auc-attestation-stale-case]", "errors[ERR_STALE_CASE_VERSION]"]
        distinguishing_aspect: "AUC attestation carries expected_case_version; after a first attestation bumps the case to version 2, a second attestation still carrying version 1 is rejected 412 ERR_STALE_CASE_VERSION."
        test_recipe:
          setup: ["ELECTIVE case POSTED (version 1); cardiologists P1 (performing) and P2 (ordering)"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Order", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys2_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: ELECTIVE, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cath-lab/cases/${case_id}/auc-attestation"
              payload: { ordering_physician_id: "${phys2_id}", auc_score: APPROPRIATE, criterion_code: "AUC-45.1", expected_case_version: "${case_v}" }
              as: InterventionalCardiologist
              as_user_id: "${phys2_id}"
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/auc-attestation"
              payload: { ordering_physician_id: "${phys2_id}", auc_score: RARELY_APPROPRIATE, criterion_code: "AUC-88.2", expected_case_version: "${case_v}" }
              as: InterventionalCardiologist
              as_user_id: "${phys2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "First attestation succeeded and bumped version to 2 (case_v2 == 2)"
            - "Second attestation with stale version 1: HTTP 412 ERR_STALE_CASE_VERSION"
            - "CathCase.${case_id}.auc_score remains APPROPRIATE (failed write not applied)"

      - name: occ_restock_stale_lot_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[device-lot-restock-stale-version]", "errors[ERR_STALE_LOT_VERSION]"]
        distinguishing_aspect: "Restock carries expected_lot_version; a correct version succeeds and increments the lot version by 1, while a replay of the old version is rejected 412 ERR_STALE_LOT_VERSION."
        test_recipe:
          setup: ["Lot L qty 2 threshold 4 (LOW_STOCK: 2 < 4), version 1"]
          setup_api_calls:
            - call: "POST /cath-lab/device-lots"
              payload: { device_type: STENT_DES, manufacturer: "Acme", model_number: "DS-100", lot_number: "LOT-J", ownership: OWNED, quantity_on_hand: 2, reorder_threshold: 4, expiration_date: "2027-01-01T00:00:00Z" }
              as: CathLabTechnologist
              captures: { lot_id: $.data.id, lot_v: $.data.version }
          trigger:
            - call: "POST /cath-lab/device-lots/${lot_id}/restock"
              payload: { quantity: 3, expected_lot_version: "${lot_v}" }
              as: CathLabTechnologist
              captures: { lot_v2: $.data.version, lot_onhand: $.data.quantity_on_hand, lot_status: $.data.status }
            - call: "POST /cath-lab/device-lots/${lot_id}/restock"
              payload: { quantity: 1, expected_lot_version: "${lot_v}" }
              as: CathLabTechnologist
              captures: { err: $.data.error_id }
          assert:
            - "First restock: quantity_on_hand == 5, version == 2 (incremented by 1), status == ACTIVE (5 >= threshold 4 — status recomputed on restock)"
            - "Second restock replaying version 1: HTTP 412 ERR_STALE_LOT_VERSION"
            - "DeviceLot.${lot_id}.quantity_on_hand remains 5 (failed write not applied)"

      - name: stemi_selector_tiebreak_earliest_created_room
        claim_type: selector_policy
        grounds: ["calculations.bump_room_selector"]
        distinguishing_aspect: "With two equally eligible rooms (both ACTIVE, equipment match, zero victims), the ranking tie-break picks the room with the earliest created_at — never a random/id-based choice."
        test_recipe:
          setup: ["Rooms R1 (created first) and R2 (created second), both ACTIVE with empty equipment profiles; one AVAILABLE bed; one cardiologist"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 2", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room2_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
          trigger:
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-S", procedure_type: STEMI_PCI, priority: STEMI, performing_physician_id: "${phys1_id}", weight_kg: 80, serum_creatinine: 1.1, scheduled_start: "2026-08-10T09:00:00Z" }
              as: CathLabScheduler
              captures: { case_lab: $.data.lab_id }
          assert:
            - "CathCase.lab_id == ${room1_id} (earliest created_at wins the tie; ids are never used for selection)"

      - name: bed_selector_picks_earliest_created_available_bed
        claim_type: selector_policy
        grounds: ["calculations.bed_selector"]
        distinguishing_aspect: "Scheduling without bed_id auto-selects the earliest-created AVAILABLE bed (B1 over B2); the loser stays AVAILABLE."
        test_recipe:
          setup: ["Beds B1 (created first) and B2 both AVAILABLE; URGENT case POSTED; room R"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 2" }
              as: RecoveryNurseManager
              captures: { bed2_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z" }
              as: CathLabScheduler
              captures: { st: $.data.status }
            - call: "GET /cath-lab/recovery-beds"
              payload: { status: RESERVED }
              as: RecoveryNurseManager
              captures: { reserved_bed: "$.data[0].id" }
          assert:
            - "Schedule succeeds without bed_id (selector used)"
            - "The RESERVED bed is ${bed1_id} (earliest created_at); ${bed2_id} remains AVAILABLE"

      - name: radiation_alert_latches_at_threshold_and_survives_void
        claim_type: rate_threshold_triggers
        grounds: ["calculations.radiation_dose_report", "entities.CathCase.fields.radiation_alert"]
        distinguishing_aspect: "radiation_alert latches when cumulative reaches exactly 5000.0 mGy (>= boundary); voiding a record to drop the cumulative below the threshold does NOT clear the latched alert."
        test_recipe:
          setup: ["URGENT case IN_PROGRESS (staffed)"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Tech One", staff_role: SCRUB_TECHNOLOGIST }
              as: CathLabScheduler
              captures: { tech1_id: $.data.id }
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Nurse One", staff_role: CIRCULATING_NURSE }
              as: CathLabScheduler
              captures: { nurse1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${tech1_id}", role_in_case: SCRUB }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/staff-assignments"
              payload: { staff_id: "${nurse1_id}", role_in_case: CIRCULATOR }
              as: CathLabScheduler
            - call: "POST /cath-lab/cases/${case_id}/start"
              as: InterventionalCardiologist
              as_user_id: "${phys1_id}"
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/dose-records"
              payload: { record_type: RADIATION, fluoroscopy_mgy: 2500, cine_mgy: 0 }
              as: CathLabTechnologist
              captures: { r1: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/dose-records"
              payload: { record_type: RADIATION, fluoroscopy_mgy: 2500, cine_mgy: 0 }
              as: CathLabTechnologist
              captures: { r2: $.data.id }
            - call: "GET /cath-lab/cases/${case_id}"
              as: CathLabTechnologist
              captures: { alert_at: $.data.radiation_alert, cum_at: $.data.cumulative_radiation_mgy }
            - call: "POST /cath-lab/dose-records/${r2}/void"
              as: CathLabTechnologist
            - call: "GET /cath-lab/cases/${case_id}"
              as: CathLabTechnologist
              captures: { alert_post: $.data.radiation_alert, cum_post: $.data.cumulative_radiation_mgy }
          assert:
            - "At exactly 5000.0 mGy (2500 + 2500): radiation_alert == true (>= boundary, not >)"
            - "After voiding the second record: cumulative_radiation_mgy == 2500.0 but radiation_alert remains true (latched)"

      - name: cascade_claims_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: ["state_machines.CathCase.SCHEDULED_to_BUMPED", "state_machines.CathCase.IN_PROGRESS_to_COMPLETED"]
        excluded_because:
          difficulty_instance: transitive_cascade / stemi_bump_cascade_releases_bed_staff_devices
          rationale: "The STEMI-bump and completion cascade chains (bed/staff/usage/lot) are asserted link-by-link in the two Rule-4 difficulty instances."

  # ---------------------------------------------------------------------------
  # Section: consistency_model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: schedule_mutation_visible_immediately_in_response_and_read
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "endpoints.POST_/cath-lab/cases/{caseId}/schedule"]
        distinguishing_aspect: "Immediate consistency: the schedule response body itself shows status SCHEDULED with lab_id and scheduled_end, and a subsequent GET returns identical values (no lag, no async reconciliation)."
        test_recipe:
          setup: ["URGENT case POSTED; room R; bed B1"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
              captures: { resp_status: $.data.status, resp_lab: $.data.lab_id, resp_end: $.data.scheduled_end }
            - call: "GET /cath-lab/cases/${case_id}"
              as: CathLabScheduler
              captures: { get_status: $.data.status, get_lab: $.data.lab_id, get_end: $.data.scheduled_end }
            - call: "GET /cath-lab/recovery-beds/${bed1_id}"
              as: RecoveryNurseManager
