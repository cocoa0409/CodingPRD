              as_user_id: "${sch}"
            - call: "POST /api/finalist-applications/${a2}/endorse"
              payload: {}
              as: SchoolOfficial
              as_user_id: "${sch}"
            - call: "POST /api/finalist-applications/${a3}/endorse"
              payload: {}
              as: SchoolOfficial
              as_user_id: "${sch}"
            - call: "POST /api/finalist-applications/${a1}/submit"
              payload: {}
              as: Student
              as_user_id: "${f1}"
              captures: { a1v: $.data.version }
            - call: "POST /api/finalist-applications/${a2}/submit"
              payload: {}
              as: Student
              as_user_id: "${f2}"
              captures: { a2v: $.data.version }
            - call: "POST /api/finalist-applications/${a3}/submit"
              payload: {}
              as: Student
              as_user_id: "${f3}"
              captures: { a3v: $.data.version }
            - call: "POST /api/finalist-applications/${a1}/review"
              payload: { decision: "CONFIRM", expected_finalist_application_version: "${a1v}" }
              as: ProgramAdmin
            - call: "POST /api/finalist-applications/${a2}/review"
              payload: { decision: "CONFIRM", expected_finalist_application_version: "${a2v}" }
              as: ProgramAdmin
            - call: "POST /api/finalist-applications/${a3}/review"
              payload: { decision: "CONFIRM", expected_finalist_application_version: "${a3v}" }
              as: ProgramAdmin
            - call: "POST /api/program-cycles/${cyc}/publish-finalists"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/program-cycles/${cyc}/run-award-matching"
              payload: {}
              as: ProgramAdmin
              captures: { n_nat: $.data.national_granted }
            - call: "GET /api/awards"
              payload: { student_id: "${f1}", cycle_id: "${cyc}" }
              as: ProgramAdmin
              captures: { aw1: "$.data[0].id" }
          trigger:
            - call: "POST /api/awards/${aw1}/decline"
              payload: {}
              as: Student
              as_user_id: "${f1}"
            - call: "GET /api/awards"
              payload: { student_id: "${f3}", cycle_id: "${cyc}" }
              as: ProgramAdmin
              captures: { f3_cat: "$.data[0].category", f3_amt: "$.data[0].amount_cents", f3_recip: "$.data[0].recipient_status" }
            - call: "GET /api/awards"
              payload: { cycle_id: "${cyc}", category: "NATIONAL_SINGLE" }
              as: ProgramAdmin
          assert:
            - "${n_nat} == 2 after matching (F1, F2 hold the slots)"
            - "before the decline: exactly 2 NATIONAL_SINGLE awards in live states {OFFERED, ACCEPTED, ENROLLED, RENEWED} == national_award_slots == 2"
            - "after the decline + recycle: still exactly 2 live NATIONAL_SINGLE awards (F2 and promoted F3); F1's award persists as a DECLINED row and is not counted"
            - "${f3_cat} == NATIONAL_SINGLE, ${f3_amt} == 250000 (national_award_amount_cents), ${f3_recip} == OFFERED"
            - "total NATIONAL_SINGLE rows for the cycle == 3 (decline does not delete history; the count invariant is over live states only)"
