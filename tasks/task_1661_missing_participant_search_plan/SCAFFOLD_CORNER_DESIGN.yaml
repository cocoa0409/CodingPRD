        grounds: ["calculations.default_treatment_tier"]
        excluded_because:
          difficulty_instance: default_treatment_1000_dollar_boundary
          rationale: "The inclusive 100000-cent tier boundary (99999 cash-out vs 100000 rollover) is asserted with exact payout amounts in the named §1.8 instance."

      - name: variant_divergence_covered
        claim_type: variant_divergence
        grounds: ["calculations.expense_allocation", "calculations.forfeiture_restoration_amount", "calculations.pbgc_transfer_amount"]
        excluded_because:
          difficulty_instance: forfeiture_restoration_nominal_vs_adjusted
          rationale: "Variant selection and divergence for all three dual-variant calculations are covered by the three §1.8 dual_variant_calc instances (this and its two siblings)."

  - section: validations
    instances:
      - name: noit_date_mismatch_returns_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOIT_DATE_MISMATCH]", "validations[priority=10]"]
        distinguishing_aspect: "A NOIT whose action_effective_date differs from proposed_termination_date is rejected with ERR_NOIT_DATE_MISMATCH even though the issuance timing window itself is satisfied."
        test_recipe:
          setup: ["Case in DRAFT at the default clock (which is inside the timing window for T = 2026-10-15)."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Mismatch Date Co 401k", sponsor_ein: "123456789", plan_number: "140", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_nd: "$.data.id", c_nd_v: "$.data.version" } }
          trigger:
            - { call: "POST /notices", payload: { termination_case_id: "${c_nd}", notice_type: NOIT, action_effective_date: "2026-10-20T00:00:00Z", expected_termination_case_version: "${c_nd_v}" }, as: PlanAdministrator, captures: { err_nd: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOIT_DATE_MISMATCH, http 422; TerminationCase.${c_nd}.status stays DRAFT"

      - name: noit_ninety_day_boundary
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOIT_TIMING_WINDOW]", "validations[priority=10]"]
        distinguishing_aspect: "The upper NOIT bound is inclusive at exactly 90 days before termination (2026-07-17) and rejected at 91 days (2026-07-16)."
        test_recipe:
          setup: ["Two DRAFT cases with T = 2026-10-15; clock pinned to 2026-07-17 for the first and 2026-07-16 for the second."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Ninety Co 401k", sponsor_ein: "123456789", plan_number: "141", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_n90: "$.data.id", c_n90_v: "$.data.version" } }
            - { call: "POST /termination-cases", payload: { plan_name: "Ninetyone Co 401k", sponsor_ein: "123456789", plan_number: "142", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_n91: "$.data.id", c_n91_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-17T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /notices", payload: { termination_case_id: "${c_n90}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_n90_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-16T00:00:00Z" }, as: PlanAdministrator }
          trigger:
            - { call: "POST /notices", payload: { termination_case_id: "${c_n91}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_n91_v}" }, as: PlanAdministrator, captures: { err_n91: "$.data.error_id" } }
          assert:
            - "At exactly T-90: TerminationCase.${c_n90}.status == NOTICE_OF_INTENT_ISSUED"
            - "At T-91: error_id == ERR_NOIT_TIMING_WINDOW, http 422; ${c_n91} stays DRAFT"

      - name: interested_party_window_boundaries
        claim_type: violation_to_error
        grounds: ["errors[ERR_INTERESTED_PARTY_WINDOW]", "validations[priority=10]"]
        distinguishing_aspect: "The interested-party window is [10, 24] days before filing: exactly 10 days passes; 5 days fails with ERR_INTERESTED_PARTY_WINDOW."
        test_recipe:
          setup: ["Two DRAFT cases; clock at 2026-08-20 for case A's notice (filing 2026-08-30, 10 days) and 2026-08-25 for case B's notice (same filing, 5 days)."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Ip Ten Co 401k", sponsor_ein: "123456789", plan_number: "143", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_ip1: "$.data.id", c_ip1_v: "$.data.version" } }
            - { call: "POST /termination-cases", payload: { plan_name: "Ip Five Co 401k", sponsor_ein: "123456789", plan_number: "144", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_ip2: "$.data.id", c_ip2_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /notices", payload: { termination_case_id: "${c_ip1}", notice_type: INTERESTED_PARTY, action_effective_date: "2026-08-30T00:00:00Z", expected_termination_case_version: "${c_ip1_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T00:00:00Z" }, as: PlanAdministrator }
          trigger:
            - { call: "POST /notices", payload: { termination_case_id: "${c_ip2}", notice_type: INTERESTED_PARTY, action_effective_date: "2026-08-30T00:00:00Z", expected_termination_case_version: "${c_ip2_v}" }, as: PlanAdministrator, captures: { err_ip: "$.data.error_id" } }
          assert:
            - "10-day notice succeeds for ${c_ip1} (inclusive lower bound)"
            - "5-day notice: error_id == ERR_INTERESTED_PARTY_WINDOW, http 422"

      - name: blackout_advisory_window_too_close_returns_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_BLACKOUT_NOTICE_WINDOW]", "validations[priority=10]"]
        distinguishing_aspect: "A BLACKOUT_ADVISORY issued 29 days before the blackout start violates the [30, 60]-day notice window."
        test_recipe:
          setup: ["Case in DRAFT; blackout [2026-10-01, 2026-10-05) scheduled; clock at 2026-09-02 (29 days before start)."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Advisory Co 401k", sponsor_ein: "123456789", plan_number: "145", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_ba: "$.data.id", c_ba_v: "$.data.version" } }
            - { call: "POST /blackout-periods", payload: { termination_case_id: "${c_ba}", start_at: "2026-10-01T00:00:00Z", end_at: "2026-10-05T00:00:00Z", outgoing_recordkeeper: "OldRK", incoming_recordkeeper: "NewRK" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlanAdministrator }
          trigger:
            - { call: "POST /notices", payload: { termination_case_id: "${c_ba}", notice_type: BLACKOUT_ADVISORY, action_effective_date: "2026-10-01T00:00:00Z", expected_termination_case_version: "${c_ba_v}" }, as: PlanAdministrator, captures: { err_ba: "$.data.error_id" } }
          assert:
            - "error_id == ERR_BLACKOUT_NOTICE_WINDOW, http 422 (29 days < 30-day minimum)"

      - name: blackout_activate_without_notice_returns_missing
        claim_type: violation_to_error
        grounds: ["errors[ERR_BLACKOUT_NOTICE_MISSING]", "validations[priority=11]", "state_machines.BlackoutPeriod.SCHEDULED_to_ACTIVE"]
        distinguishing_aspect: "Activation inside the window still fails without a live BLACKOUT_ADVISORY covering the start date — ERR_BLACKOUT_NOTICE_MISSING (422); and begin-distributions while a blackout sits SCHEDULED fails with ERR_BLACKOUT_TRANSITION_PENDING."
        test_recipe:
          setup: ["Case A in DRAFT with blackout [2026-09-01, 2026-09-05), no advisory, clock 2026-09-02. Case B effectuated (TERMINATION_EFFECTIVE) with a SCHEDULED blackout [2026-11-01, 2026-11-05) and a DISTRIBUTION notice."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "NoNotice Co 401k", sponsor_ein: "123456789", plan_number: "146", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_nn: "$.data.id" } }
            - { call: "POST /blackout-periods", payload: { termination_case_id: "${c_nn}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-09-05T00:00:00Z", outgoing_recordkeeper: "OldRK", incoming_recordkeeper: "NewRK" }, as: PlanAdministrator, captures: { b_nn: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases", payload: { plan_name: "Pending Co 401k", sponsor_ein: "123456789", plan_number: "147", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_pd: "$.data.id", c_pd_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /notices", payload: { termination_case_id: "${c_pd}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_pd_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_pd}/effectuate-termination", payload: {}, as: PlanAdministrator }
            - { call: "GET /termination-cases/${c_pd}", payload: {}, as: PlanAdministrator, captures: { c_pd_v2: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_pd}", notice_type: DISTRIBUTION, action_effective_date: "2026-10-20T00:00:00Z", expected_termination_case_version: "${c_pd_v2}" }, as: PlanAdministrator }
            - { call: "POST /blackout-periods", payload: { termination_case_id: "${c_pd}", start_at: "2026-11-01T00:00:00Z", end_at: "2026-11-05T00:00:00Z", outgoing_recordkeeper: "OldRK", incoming_recordkeeper: "NewRK" }, as: PlanAdministrator }
          trigger:
            - { call: "POST /blackout-periods/${b_nn}/activate", payload: {}, as: Recordkeeper, captures: { err_nn: "$.data.error_id" } }
            - { call: "POST /termination-cases/${c_pd}/begin-distributions", payload: {}, as: PlanAdministrator, captures: { err_pd: "$.data.error_id" } }
          assert:
            - "Arm 1: error_id == ERR_BLACKOUT_NOTICE_MISSING, http 422 (window position alone is insufficient)"
            - "Arm 2: error_id == ERR_BLACKOUT_TRANSITION_PENDING, http 409 (SCHEDULED blackout blocks distribution start); ${c_pd} stays TERMINATION_EFFECTIVE"

      - name: body_fk_not_found_returns_reference_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_REFERENCE_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "A body foreign key that does not exist (termination_case_id on POST /participants) returns 404 ERR_REFERENCE_NOT_FOUND, distinct from path-id ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Fk Co 401k", sponsor_ein: "123456789", plan_number: "148", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
          trigger:
            - { call: "POST /participants", payload: { termination_case_id: "00000000-0000-0000-0000-000000000000", full_name: "Fk Ref", ssn: "121110020", mailing_address: "1 F St", account_balance_cents: 1000, vested_pct: 100 }, as: PlanAdministrator, captures: { err_fk: "$.data.error_id" } }
          assert:
            - "error_id == ERR_REFERENCE_NOT_FOUND and http status == 404"

      - name: expense_exceeds_remaining_returns_402
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_REMAINING_BALANCE]", "validations[priority=12]"]
        distinguishing_aspect: "An expense allocation exceeding remaining_undistributed_cents by one cent is rejected with 402 ERR_INSUFFICIENT_REMAINING_BALANCE."
