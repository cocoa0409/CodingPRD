    instances:
      - name: dscr_boundary_exactly_1_25_passes_on_financing_commit
        grounds:
          - calculations.dscr_check
          - validations[priority=17]
          - errors[ERR_DSCR_BELOW_MINIMUM]
        distinguishing_aspect: |
          Boundary precision on the DSCR metric via the commit endpoint: DSCR
          exactly == 1.25 passes (>= is inclusive); DSCR == 1.2499 fails.
          With NOI 1625000 (lease 1911765 cons variant) and IO DS 1300000,
          dscr = 1.25 exactly. A one-cent NOI decrease yields 1.2499 and fails.
        test_recipe:
          setup:
            - "Deal -> PSA_EXECUTED; two financing applications sized so that DSCR lands exactly on 1.25 vs just below"
            - "App A: loan 13000000 @ 10% IO -> DS 1300000; NOI 1625000 (lease rent 1911765, cons 15%: 1911765*0.85 = 1625000.25 -> floor to 1625000)... pin exact numbers"
            - "Simpler pinning: NOI = 1250000 * 1.25 = 1562500; DS = 1250000; dscr = 1.25 exactly. Lease rent R with R*0.85 = 1562500 -> R = 1838235.29 — use R = 1838236, NOI = floor(1838236*0.85)=1562500 (1838236*85=156250060 -> /100 = 1562500 with truncation). DS: loan 12500000 @ 10% IO = 1250000. dscr = 1562500/1250000 = 1.25 exactly."
