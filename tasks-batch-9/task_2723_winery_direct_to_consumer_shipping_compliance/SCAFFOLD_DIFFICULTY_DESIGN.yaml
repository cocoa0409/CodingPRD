            - "hop 2: GET /dtc/volume-ledger-entries?order_id=${ob_id} returns two rows — SHIPMENT_ACCEPTED liters 4.500 and RETURN_CREDIT liters -4.500"
            - "hop 3: Consumer.${c_id}.return_credit_count == 1"
