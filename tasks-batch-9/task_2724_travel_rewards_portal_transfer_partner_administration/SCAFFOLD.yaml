  # --- PortalInventoryOffer --------------------------------------------------
  - method: POST
    path: /rewards/inventory-offers
    purpose: Publish an itinerary to the rewards portal at the contracted markup.
    roles: [AgencySupplier]
    input: [agency_partner_id, itinerary_code, depart_at, "return_at?", net_rate_cents, agency_public_price_cents, agency_public_seats, portal_seats, tax_cents]
    output: PortalInventoryOffer
    side_effects:
      - "computes portal_price_cents, cash_copay_cents and parity_status per calculations.redemption_points_price_and_parity"
      - "creates the offer OPEN with seats_committed 0"
  - method: GET
    path: /rewards/inventory-offers/{id}
    purpose: Read one offer including its parity verdict and committed seats.
    roles: [ProgramAdmin, ProgramApprover, AgencySupplier, Cardholder]
    input: []
    output: PortalInventoryOffer
    side_effects: []
  - method: GET
    path: /rewards/inventory-offers
    purpose: List portal inventory, filterable by agency, availability and parity.
    roles: [ProgramAdmin, ProgramApprover, AgencySupplier, Cardholder]
    input: ["agency_partner_id?", "itinerary_code?", "status?", "parity_status?", "limit?", "offset?"]
    output: PortalInventoryOffer[]
    side_effects: []
  - method: POST
    path: /rewards/inventory-offers/{id}/resync
    purpose: |
      Push a fresh agency price and availability snapshot into the offer. This is the only way
      parity_status changes after creation, and it is what makes a previously read offer version stale.
    roles: [AgencySupplier]
    input: [net_rate_cents, agency_public_price_cents, agency_public_seats, portal_seats]
    output: PortalInventoryOffer
    side_effects:
      - "recomputes portal_price_cents and parity_status; sets last_resynced_at"
      - "increments PortalInventoryOffer.version by 1, which invalidates any expected_offer_version a client read earlier"
  - method: POST
    path: /rewards/inventory-offers/{id}/suspend
    purpose: Pull one offer off the portal without touching the agency.
    roles: [ProgramAdmin]
    input: [suspension_reason]
    output: PortalInventoryOffer
    side_effects: ["sets status SUSPENDED and suspension_reason; increments version by 1"]
  - method: POST
    path: /rewards/inventory-offers/{id}/reinstate
    purpose: Return a suspended offer to the portal.
    roles: [ProgramAdmin]
    input: []
    output: PortalInventoryOffer
    side_effects: ["sets status OPEN and clears suspension_reason; increments version by 1"]
  - method: POST
    path: /rewards/inventory-offers/{id}/withdraw
    purpose: Permanently retire an uncommitted offer.
    roles: [AgencySupplier]
    input: []
    output: PortalInventoryOffer
    side_effects: ["sets status WITHDRAWN; increments version by 1"]
  - method: POST
    path: /rewards/inventory-offers/{id}/book
    purpose: |
      Quote a PORTAL_BOOKING RedemptionOrder against this offer. Carries the OCC guard from
      §1.2.1 because the agency may have resynced the price since the cardholder read the offer.
    roles: [Cardholder]
    input: [account_id, traveler_name, expected_offer_version]
    output: RedemptionOrder
    side_effects:
      - "prices the order per calculations.redemption_points_price_and_parity and computes points_debited"
      - "computes issuer_cost_provisional_cents and cost_per_1k_provisional_cents"
      - "raises Account.points_pending_redemption by points_debited without any ledger entry"
      - "recomputes offer.seats_committed and flips the offer to SOLD_OUT when the last seat goes"
      - "increments PortalInventoryOffer.version by 1 and Account.version by 1"

  # --- RedemptionOrder -------------------------------------------------------
  - method: POST
    path: /rewards/redemption-orders
    purpose: Quote a STATEMENT_CREDIT redemption; PORTAL_BOOKING orders must go through the offer's book endpoint.
    roles: [Cardholder]
    input: [account_id, channel, points_requested]
    output: RedemptionOrder
    side_effects:
      - "sets points_debited to points_requested and statement_credit_cents to points_requested * STATEMENT_CREDIT_CENTS_PER_POINT"
      - "raises Account.points_pending_redemption by points_debited; increments Account.version by 1"
  - method: GET
    path: /rewards/redemption-orders/{id}
    purpose: Read one redemption order with both of its state dimensions and both cost variants.
    roles: [ProgramAdmin, ProgramApprover, FraudAnalyst, AgencySupplier, Cardholder]
    input: []
    output: RedemptionOrder
    side_effects: []
  - method: GET
    path: /rewards/redemption-orders
    purpose: List redemption orders, filterable by account, offer, channel and either state dimension.
    roles: [ProgramAdmin, ProgramApprover, FraudAnalyst, AgencySupplier, Cardholder]
    input: ["account_id?", "inventory_offer_id?", "channel?", "fulfillment_status?", "settlement_status?", "limit?", "offset?"]
    output: RedemptionOrder[]
    side_effects: []
  - method: POST
    path: /rewards/redemption-orders/{id}/confirm
    purpose: Confirm a quote and turn the points reservation into a real debit.
    roles: [Cardholder]
    input: []
    output: RedemptionOrder
    side_effects:
      - "appends a REDEEM_DEBIT PointsLedgerEntry of -points_debited"
      - "lowers Account.points_balance and points_pending_redemption by points_debited each"
      - "sets confirmed_at; increments RedemptionOrder.version by 1 and Account.version by 1"
  - method: POST
    path: /rewards/redemption-orders/{id}/cancel
    purpose: Cancel a quoted or confirmed order, refunding points only when they were actually debited.
    roles: [Cardholder]
    input: [closed_reason]
    output: RedemptionOrder
    side_effects:
      - "from QUOTED: lowers points_pending_redemption with no ledger entry"
      - "from CONFIRMED: appends a REDEEM_REFUND PointsLedgerEntry of +points_debited"
      - "recomputes offer.seats_committed and returns a SOLD_OUT offer to OPEN"
      - "leaves settlement_status at UNSETTLED and TravelAgencyPartner.payable_cents untouched"
  - method: POST
    path: /rewards/redemption-orders/{id}/ticket
    purpose: Record the agency ticketing a confirmed portal booking.
    roles: [AgencySupplier]
    input: [ticket_number]
    output: RedemptionOrder
    side_effects:
      - "sets fulfillment_status TICKETED, ticket_number and ticketed_at"
      - "moves settlement_status UNSETTLED -> AGENCY_INVOICED"
      - "adds issuer_cost_provisional_cents to TravelAgencyPartner.payable_cents"
      - "increments RedemptionOrder.version by 1 and TravelAgencyPartner.version by 1"
  - method: POST
    path: /rewards/redemption-orders/{id}/refund
    purpose: Refund a ticketed booking, reversing both the points debit and the agency payable.
    roles: [AgencySupplier]
    input: [closed_reason]
    output: RedemptionOrder
    side_effects:
      - "appends a REDEEM_REFUND PointsLedgerEntry of +points_debited"
      - "moves settlement_status to CLAWED_BACK and subtracts from payable_cents exactly what was added (final when SETTLED, otherwise provisional)"
      - "recomputes offer.seats_committed and returns a SOLD_OUT offer to OPEN"
  - method: POST
    path: /rewards/redemption-orders/{id}/settle
    purpose: Settle the agency invoice and replace the provisional issuer cost with the final one.
    roles: [ProgramAdmin]
    input: [invoice_amount_cents, "settlement_adjustment_cents?"]
    output: RedemptionOrder
    side_effects:
      - "computes issuer_cost_final_cents and cost_per_1k_final_cents per the final_actual variant of calculations.redemption_issuer_cost"
      - "adjusts TravelAgencyPartner.payable_cents by (issuer_cost_final_cents - issuer_cost_provisional_cents)"
      - "sets settlement_status SETTLED and settled_at; increments RedemptionOrder.version by 1 and TravelAgencyPartner.version by 1"

