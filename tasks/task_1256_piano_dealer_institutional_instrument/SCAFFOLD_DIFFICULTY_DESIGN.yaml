              as: StoreManager
            - call: "POST /piano-dealer/instruments/${i2}/list-for-sale"
              as: StoreManager
            - call: "POST /piano-dealer/delivery-crews"
              payload: { crew_name: "Crew Zeta", climate_certified: false }
              as: StoreManager
              captures: { cr_id: $.data.id }
            - call: "POST /piano-dealer/sales-orders"
              payload: { customer_id: "${c_id}", items: [{ instrument_id: "${i1}", unit_price_cents: 400000, discount_pct: 0.0 }], tax_rate: 0.0, distance_miles: 10, stairs_count: 0, climate_controlled_required: false }
              as: SalesAssociate
              captures: { o1: $.data.id }
            - call: "POST /piano-dealer/sales-orders/${o1}/payments"
