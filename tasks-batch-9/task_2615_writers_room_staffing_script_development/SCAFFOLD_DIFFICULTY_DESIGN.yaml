  - rule_id: transitive_cascade
    instances:
      - name: cascade_a_season_reschedule_propagates_to_milestone_lateness_and_back
        grounds:
          - endpoints.POST_/seasons/{season_id}/reschedule
          - calculations.milestone_schedule_derivation
          - calculations.milestone_schedule_derivation.formula
          - entities.Episode.fields.production_start_date
          - entities.ScriptAssignment.fields.outline_due_date
          - entities.ScriptAssignment.fields.late_milestone_count
          - entities.Milestone.fields.due_date
          - state_machines.Milestone.transitions.PENDING_to_LATE
          - state_machines.Milestone.transitions.LATE_to_PENDING
          - complexity_profile.complexity_layers.cascading_side_effects
        distinguishing_aspect: |
          A four-link chain from a single write, and the chain is then driven BACKWARDS by a second
          write. Link 1 Season.production_start_date -> link 2 every non-LOCKED Episode
          .production_start_date shifts by the same signed delta -> link 3 all four due-date fields of
          every non-VOID ScriptAssignment plus every Milestone.due_date are re-derived -> link 4 each
          Milestone is re-evaluated against the logical clock (PENDING <-> LATE) and
          ScriptAssignment.late_milestone_count is recomputed. Pulling the date 8 days EARLIER makes two
          milestones LATE; pushing it 71 days LATER un-flips both, so lateness is proven to be derived
          state rather than a one-way latch.
