              as: EmployerClerk
              as_user_id: "${emp_id}"
              captures: { l1: $.data.id }
            - { call: "POST /contribution-reports/${rep1}/submit", payload: {}, as: EmployerClerk, as_user_id: "${emp_id}" }
          trigger:
            - call: "POST /contribution-reports/${rep1}/lines/${l1}/review"
