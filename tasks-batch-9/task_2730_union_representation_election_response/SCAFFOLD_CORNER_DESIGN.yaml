      - name: late_submission_ack_converts_a_hard_error_into_a_graded_downgrade
        claim_type: Conditional validation
        grounds:
          - validations[priority=18]
          - errors.ERR_VOTER_LIST_PAST_DUE
          - calculations.voter_list_grading
          - endpoints.POST_voter_lists_id_submit.input.late_submission_ack
        distinguishing_aspect: |
          The same request body differing only in the optional acknowledgement flag flips a 409 into a 200,
          and the acknowledgement is not free: a perfectly complete list (6 of 6, completeness_pct 100.00,
