              payload: { subcontractor_firm_id: "${f1_id}", demand_opportunity_id: "${d1_id}", fte: 1.00, start_date: "2026-08-03", end_date: "2026-08-17" }
              as: ResourceManager
              captures: { p1_id: $.data.id }
