      - name: shrink_dispose_requires_expired_lot_and_sufficient_qty
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SHRINK_EXCEEDS_LOT
          - endpoints.POST_/inventory-balances/{balanceId}/adjustments
        distinguishing_aspect: "SHRINK_DISPOSE against a lot that is still FRESH, or for more than remaining_qty, fails 422 ERR_SHRINK_EXCEEDS_LOT; a valid disposal decrements both the lot and on_hand."
        test_recipe:
          setup: ["Logical clock 2026-09-10T14:00:00Z. SITE-A (horizon 2); SKU-MILK lot L of 5 expiring 2026-09-20 (FRESH)."]
          setup_api_calls:
            - call: "POST /mfc/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T14:00:00Z" }
              as: SiteOps
            - call: "POST /mfc/sites"
