            - "The reservations term is untouched by the receipt: Component.${ws_id}.reserved_qty == ${reserved_promised} == 10, identical to the committed_stock read"
            - "The two variants differ only in the on_hand side: shortfall_qty recomputes from 0 (10 reserved against 10 on hand at the committed read) to 0 against 40, never from a re-derived reservations figure"
