  # ==========================================================================
  - section: endpoints
    instances:

      - name: reel_list_pagination_defaults_and_upper_bound
        claim_type: Standard CRUD
        grounds:
          - response_envelope.pagination_defaults
          - endpoints["GET /reels"]
        distinguishing_aspect: "With 12 reels in stock, GET /reels with no query returns 10 rows, total_count 12 and has_more true; offset 10 returns the last 2 with has_more false; limit 101 returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "One branch and product P1 exist, and twelve 500 ft P1 reels have been received in lot L1."
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Houston DC", region_code: "TX", concurrent_cut_capacity: 1, delivery_surcharge_cents: 0 }
              as: PlatformAdmin
              captures: { br_id: "$.data.id" }
            - call: "POST /products"
              payload: { part_number: "CU-500-XHHW", conductor_metal: "COPPER", copper_lbs_per_1000ft: 12.5, base_price_cents_per_ft: 18, min_cut_length_ft: 100, cut_charge_cents: 3500, reel_deposit_cents: 12500, master_reel_length_ft: 2500, reel_weight_lbs: 320.0, allowed_put_ups: ["MASTER_REEL", "CUT"] }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /reels"
              payload: { product_id: "${p1_id}", branch_id: "${br_id}", lot_code: "L1", nominal_length_ft: 500 }
              as: PlatformAdmin
              captures: { first_reel_id: "$.data.id" }
          trigger:
            - call: "GET /reels"
              payload: { branch_id: "${br_id}" }
              as: PlatformAdmin
            - call: "GET /reels"
              payload: { branch_id: "${br_id}", offset: 10 }
              as: PlatformAdmin
            - call: "GET /reels"
              payload: { branch_id: "${br_id}", limit: 101 }
              as: PlatformAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "the test first repeats the POST /reels call above until twelve reels exist at ${br_id}"
            - "the unpaged call returned 10 rows with meta pagination limit 10, offset 0, total_count 12, has_more true"
            - "the offset 10 call returned 2 rows with has_more false"
            - "the limit 101 call returned HTTP 422 and ${err_id} == ERR_INVALID_REQUEST"

