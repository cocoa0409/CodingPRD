            - call: "POST /loan-applications/${loan1}/lock"
              payload: { note_rate_bps: 730, locked_amount_cents: 20000000 }
              as: Originator
              as_user_id: "${orig_id}"
            - call: "POST /loan-applications/${loan1}/pricing-exceptions"
              payload: { requested_rate_bps: 700, concession_cents: 100000, reason_code: "COMPETITIVE_MATCH", justification_text: "Competitor quoted 700 bps on an identical file; the concession retains the borrower." }
