  - { method: GET, path: "/api/renewal-offers", description: "List renewal offers (AccountHolder sees only own)", roles: [StadiumAdmin, PremiumSalesRep, FinanceController, EventServicesManager, AccountHolder], code: 200, input: ["agreement_id?", "season_id?", "status?", "limit?", "offset?"], output: "RenewalOffer[]", side_effects: [] }
