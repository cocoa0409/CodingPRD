      - name: existence_checked_before_body_shape
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]", "errors[ERR_PROJECT_NOT_FOUND]"]
        distinguishing_aspect: "A POST to a nonexistent project id that ALSO omits required body fields returns 404 ERR_PROJECT_NOT_FOUND (existence, priority 4) rather than the 400 shape error (priority 5) or the 412 OCC check."
        test_recipe:
          setup: ["one real project exists (its captured version is reused as the OCC payload value; the target project id does not exist)"]
          setup_api_calls:
