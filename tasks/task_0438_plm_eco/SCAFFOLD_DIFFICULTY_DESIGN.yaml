      - name: deviation_coverage_empty_candidate_set
        grounds:
          - calculations.deviation_coverage
          - entities.Deviation.fields.covered_unit_count
          - state_machines.Deviation.SUBMITTED_to_GRANTED
        distinguishing_aspect: |
          Granting a deviation when there are ZERO NONCONFORMING units of the part yields
          covered_unit_count == 0 (empty-set boundary) and still transitions to GRANTED —
          a different metric (collection emptiness) reached through a different endpoint
          (deviations/{id}/grant) than the numeric quorum boundary.
