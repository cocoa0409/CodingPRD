      - name: withdrawing_an_issued_offer_reverses_every_issue_offer_side_effect
        claim_type: compensation
        grounds:
          - state_machines.Appointment.OFFER_ISSUED_to_WITHDRAWN
          - calculations.funding_encumbrance
          - endpoints.POST /appointments/{id}/withdraw
        excluded_because:
          difficulty_instance: "compensating_invariant / offer_withdrawal_releases_the_exact_encumbrance_and_restores_reusable_budget"
          rationale: "The compensating-invariant instance already drives issue-offer, withdraw and a re-issue against a deliberately budget-tight award, asserting encumbered_usd and available_balance_usd return to 0.00/100000.00 and then to 90780.00/9220.00, with the competing offer refused in between. A separate corner test of the same compensation edge would restate that ledger reconciliation with weaker data."

      - name: closing_the_exit_record_bubbles_the_appointment_to_completed
        claim_type: bubble_up
        grounds:
          - state_machines.ExitRecord.IP_ASSIGNMENT_SIGNED_to_CLOSED
          - state_machines.Appointment.ACTIVE_to_COMPLETED
          - state_machines.Postdoc.ACTIVE_to_SEPARATED
        excluded_because:
          difficulty_instance: "transitive_cascade / ip_assignment_closes_exit_completes_appointment_and_separates_scholar"
          rationale: "The transitive-cascade instance already walks the full three-hop bubble-up - ip-assignment closes the ExitRecord, the ExitRecord closure completes the Appointment, and the completed appointment separates the Postdoc while posting rank months and releasing the encumbrance - so a dedicated corner test of the parent auto-transition would duplicate its assertions."

