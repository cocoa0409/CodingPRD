          answer: headcount 17 times per-participant fees (40000 + 20000) gives gross 1020000,
          which selects the 2.0% tier (rebate 20400, rebated 999600); only then is the
          revenue-sharing pool offset, so a pool of 1000000 nets exactly 0 while a pool of
