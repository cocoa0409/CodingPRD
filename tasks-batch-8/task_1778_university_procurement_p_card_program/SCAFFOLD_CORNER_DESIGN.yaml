            - "requisition stays SUBMITTED at step index 1 (no approval recorded for the failed gate)"

      - name: duplicate_quote_and_self_claim_forbidden
        claim_type: violation_to_error
        grounds: ["errors", "ERR_DUPLICATE_QUOTE", "errors", "ERR_SELF_CLAIM_FORBIDDEN"]
        distinguishing_aspect: "Two uniqueness/SoD guards on different resources: the same vendor may not quote twice on one solicitation (ERR_DUPLICATE_QUOTE), and a department may not claim its own surplus asset during redistribution (ERR_SELF_CLAIM_FORBIDDEN)."
