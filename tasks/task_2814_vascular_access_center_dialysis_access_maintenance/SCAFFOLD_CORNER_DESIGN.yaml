              payload: {}
              as: CenterAdmin
          assert:
            - "each call returns HTTP 404 with response_type == error and a data object carrying error_id and message"
            - "the error ids are, in order, ERR_FACILITY_NOT_FOUND, ERR_PATIENT_NOT_FOUND, ERR_CLINICIAN_NOT_FOUND, ERR_ROOM_NOT_FOUND, ERR_DEVICE_LOT_NOT_FOUND, ERR_ACCESS_NOT_FOUND, ERR_READING_NOT_FOUND, ERR_REFERRAL_NOT_FOUND, ERR_PROCEDURE_NOT_FOUND, ERR_DEVICE_USAGE_NOT_FOUND, ERR_PLAN_NOT_FOUND and ERR_INFECTION_EVENT_NOT_FOUND — twelve distinct ids, no aliasing"
            - "meta.api_request_id and meta.api_request_timestamp are present on every error body"
            - "no call returns 422 — a syntactically valid UUID that matches nothing is a 404, not a malformed request"

      - name: missing_auth_header_returns_unauthenticated_before_every_other_check
        claim_type: error_triggerable
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - validations.priority_2_ERR_UNAUTHORIZED
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Priority 1 outranks everything: a request with no X-User-Role header, or with a role string outside the six declared roles, is 401 ERR_UNAUTHENTICATED even when the path is unknown, the body is malformed and the role would also have been unauthorized — 401 must not be smeared into 403 or 422."
        test_recipe:
          setup:
            - "one facility so that a legitimate request would otherwise succeed"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Corner Dialysis Forty Four", facility_code: "C-44" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Vera Coen", clinician_role: "CODER", npi: "2000000441", credential_expires_on: "2027-01-31" }
              as: CenterAdmin
              captures: { coder_id: $.data.id }
          trigger:
            - call: "GET /dialysis-facilities/${fac_id}"
              payload: {}
              as: "<omit the X-User-Role header entirely>"
            - call: "GET /dialysis-facilities/${fac_id}"
              payload: {}
              as: "BillingClerk"
            - call: "POST /patients"
              payload: { full_name: "No MRN And No Role" }
              as: "<omit the X-User-Role header entirely>"
            - call: "POST /dialysis-facilities"
              payload: { name: "Coder Tries To Onboard A Facility", facility_code: "C-44B" }
              as: Coder
              as_user_id: "${coder_id}"
          assert:
            - "the header-less read returns 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the unknown role string BillingClerk also returns 401 ERR_UNAUTHENTICATED, not 403 — an unrecognised role fails authentication, it is not an unauthorized known role"
            - "the header-less POST with a body that is ALSO missing the required mrn returns 401, not 422: priority 1 fires before priority 4"
            - "the final call, made with the DECLARED role Coder against an endpoint whose roles list is [CenterAdmin] only, returns 403 ERR_UNAUTHORIZED — proving 401 and 403 are distinguishable rather than collapsed"
            - "no facility named C-44B exists afterwards"

      - name: the_three_state_conflict_errors_are_each_reachable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PROCEDURE_NOT_IN_RECOVERY
          - errors.ERR_CODING_STATE_INVALID
          - errors.ERR_DEVICE_LOT_STATE_INVALID
        distinguishing_aspect: "Three 409s that only a freshly SCHEDULED case and a never-quarantined lot can produce: observing recovery before RECOVERY, attesting and coding before the case is closed, and releasing a lot that was never quarantined. All four probes are made by the role that owns the operation, so none of them can be mistaken for an RBAC refusal."
