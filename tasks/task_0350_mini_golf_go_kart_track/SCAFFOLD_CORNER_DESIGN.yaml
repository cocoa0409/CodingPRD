# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Mini-Golf & Go-Kart Track (Expert tier)
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Sections / claim_types are taken verbatim from references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_venue_returns_201_with_open_posture
        claim_type: Creation
        grounds: [entities.Venue, endpoints]
        distinguishing_aspect: "POST /venues with name returns 201, posture=OPEN, open_slot_count=0, version=1, and a server-minted UUID id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: { name: "Fun Park" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Venue.${venue_id}.posture == OPEN"
            - "Venue.${venue_id}.open_slot_count == 0"
            - "Venue.${venue_id}.version == 1"

      - name: create_attraction_missing_kind_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Attraction.fields.kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /attractions without the required kind field returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "NoKind" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_attraction_default_min_height_zero
        claim_type: Defaults
        grounds: [entities.Attraction.fields.min_height_cm]
        distinguishing_aspect: "Omitting min_height_cm on POST /attractions applies the default 0."
        test_recipe:
          setup: ["A venue exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
          trigger:
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Putt", kind: "MINI_GOLF" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
          assert:
            - "Attraction.${attr_id}.min_height_cm == 0"
            - "Attraction.${attr_id}.status == ACTIVE"

      - name: get_booking_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Booking, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /bookings/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB except auth headers."]
          setup_api_calls: []
          trigger:
            - call: "GET /bookings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: heat_computed_lanes_available_ignores_input
        claim_type: Computed Fields
        grounds: [entities.Heat.fields.lanes_available, entities.Heat.fields.lane_capacity, calculations.slot_capacity_rollup]
        distinguishing_aspect: "On heat create, lane_capacity is snapshotted from attraction.lane_count and lanes_available equals lane_capacity (committed 0); any client-supplied capacity field is ignored."
        test_recipe:
          setup: ["GO_KART attraction lane_count=6."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Karts", kind: "GO_KART", lane_count: 6 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
          trigger:
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_id: $.data.id }
          assert:
            - "Heat.${heat_id}.lane_capacity == 6"
            - "Heat.${heat_id}.lanes_committed == 0"
            - "Heat.${heat_id}.lanes_available == 6"

      - name: heat_create_on_mini_golf_attraction_kind_mismatch
        claim_type: Parent Relationships
        grounds: [entities.Heat.fields.attraction_id, "errors[ERR_ATTRACTION_KIND_MISMATCH]"]
        distinguishing_aspect: "Creating a Heat whose attraction_id points to a MINI_GOLF attraction returns ERR_ATTRACTION_KIND_MISMATCH (409)."
        test_recipe:
          setup: ["A MINI_GOLF attraction exists."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Putt", kind: "MINI_GOLF" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
          trigger:
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_ATTRACTION_KIND_MISMATCH"

      - name: list_venues_pagination_envelope
        claim_type: Listing
        grounds: [entities.Venue, response_envelope]
        distinguishing_aspect: "GET /venues returns an array envelope with pagination fields total_count and has_more; limit caps the page."
        test_recipe:
          setup: ["Two venues created."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V1" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /venues"
              payload: { name: "V2" }
              as: OpsManager
              as_user_id: "ops-1"
          trigger:
            - call: "GET /venues"
              payload: { limit: 1, offset: 0 }
              as: OpsManager
              as_user_id: "ops-1"
          assert:
            - "response.response_type == array"
            - "len(data) == 1"
            - "meta.total_count >= 2 and has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_booking_already_cancelled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.HOLD_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a Booking already in CANCELLED returns ERR_INVALID_STATE (409); no side effects fire (terminal-state lockdown)."
        test_recipe:
          setup: ["A HOLD booking cancelled once."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Karts", kind: "GO_KART", lane_count: 5 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /pricing-plans"
              payload: { venue_id: "${venue_id}", name: "Heat", mode: "PER_HEAT", base_price_cents: 1000 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G", height_cm: 180 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { g: $.data.id }
            - call: "POST /bookings"
              payload: { venue_id: "${venue_id}", guest_id: "${g}", slot_kind: "HEAT", heat_id: "${heat_id}", pricing_plan_id: "${plan_id}", origin: "RESERVATION", party_size: 1 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/cancel"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
          trigger:
            - call: "POST /bookings/${bk}/cancel"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Booking.${bk}.status == CANCELLED"

      - name: open_heat_twice_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.Heat.SCHEDULED_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Opening an already-OPEN heat a second time returns ERR_INVALID_STATE (409); the first open succeeded."
        test_recipe:
          setup: ["A SCHEDULED heat on an OPEN venue, opened once."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Karts", kind: "GO_KART", lane_count: 5 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_id: $.data.id }
            - call: "POST /heats/${heat_id}/open"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
          trigger:
            - call: "POST /heats/${heat_id}/open"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Heat.${heat_id}.status == OPEN"

      - name: venue_close_blocked_while_slot_open
        claim_type: Precondition Enforcement
        grounds: [state_machines.Venue.OPEN_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a venue while a Heat is still OPEN violates the close precondition (no OPEN slots) and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A venue with one OPEN heat."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Karts", kind: "GO_KART", lane_count: 5 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_id: $.data.id }
            - call: "POST /heats/${heat_id}/open"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_v: $.data.version }
          trigger:
            - call: "POST /venues/${venue_id}/close"
              payload: { expected_venue_version: "${venue_v}" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Venue.${venue_id}.posture == OPEN"

      - name: resume_from_open_venue_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Venue.WEATHER_HOLD_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling resume on an OPEN (not WEATHER_HOLD) venue returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A freshly created OPEN venue."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id, venue_v: $.data.version }
          trigger:
            - call: "POST /venues/${venue_id}/resume"
              payload: { expected_venue_version: "${venue_v}" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Venue.${venue_id}.posture == OPEN"

      - name: weather_hold_resume_restores_open
        claim_type: Valid Transition
        grounds: [state_machines.Venue.OPEN_to_WEATHER_HOLD, state_machines.Venue.WEATHER_HOLD_to_OPEN]
        distinguishing_aspect: "weather-hold then resume returns posture to OPEN and clears weather_hold_reason to null."
        test_recipe:
          setup: ["A venue placed into WEATHER_HOLD."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id, venue_v0: $.data.version }
            - call: "POST /venues/${venue_id}/weather-hold"
              payload: { weather_hold_reason: "Storm", expected_venue_version: "${venue_v0}" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_v1: $.data.version }
          trigger:
            - call: "POST /venues/${venue_id}/resume"
              payload: { expected_venue_version: "${venue_v1}" }
              as: OpsManager
              as_user_id: "ops-1"
          assert:
            - "Venue.${venue_id}.posture == OPEN"
            - "Venue.${venue_id}.weather_hold_reason == null"

      - name: confirm_under_weather_hold_blocked
        claim_type: guarded transitions
        grounds: [state_machines.Booking.HOLD_to_CONFIRMED, "errors[ERR_VENUE_NOT_OPEN]"]
        distinguishing_aspect: "Confirming a booking while the venue is WEATHER_HOLD is blocked with ERR_VENUE_NOT_OPEN (409); the booking remains HOLD."
        test_recipe:
          setup: ["A HOLD booking exists on an OPEN heat; then venue goes WEATHER_HOLD (closing the heat)."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T09:00:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Karts", kind: "GO_KART", lane_count: 5 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /pricing-plans"
              payload: { venue_id: "${venue_id}", name: "Heat", mode: "PER_HEAT", base_price_cents: 1000 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_id: $.data.id }
            - call: "POST /heats/${heat_id}/open"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "G", height_cm: 180 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { g: $.data.id }
            - call: "POST /waivers"
              payload: { guest_id: "${g}" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /bookings"
              payload: { venue_id: "${venue_id}", guest_id: "${g}", slot_kind: "HEAT", heat_id: "${heat_id}", pricing_plan_id: "${plan_id}", origin: "RESERVATION", party_size: 1 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { bk: $.data.id }
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_v_now: $.data.version }
            - call: "POST /venues/${venue_id}/weather-hold"
              payload: { weather_hold_reason: "Hail", expected_venue_version: "${venue_v_now}" }
              as: OpsManager
              as_user_id: "ops-1"
          trigger:
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_heat_version: "${heat_v}" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_VENUE_NOT_OPEN"
            - "Booking.${bk}.status == HOLD"

      - name: heat_manual_close_completes_checked_in_booking
        claim_type: Side Effect Execution
        grounds: [state_machines.Heat.OPEN_to_CLOSED, state_machines.Booking.CHECKED_IN_to_COMPLETED]
        distinguishing_aspect: "Manual heat close drives CHECKED_IN bookings to COMPLETED (bubble side-effect), distinct from weather-hold close which leaves them CONFIRMED/CHECKED_IN."
        test_recipe:
          setup: ["A CHECKED_IN booking on an OPEN heat within its active window."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T10:05:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Karts", kind: "GO_KART", lane_count: 5 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /pricing-plans"
              payload: { venue_id: "${venue_id}", name: "Heat", mode: "PER_HEAT", base_price_cents: 1000 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_id: $.data.id }
            - call: "POST /heats/${heat_id}/open"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "G", height_cm: 180 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { g: $.data.id }
            - call: "POST /waivers"
              payload: { guest_id: "${g}" }
              as: OpsManager
              as_user_id: "ops-1"
            - call: "POST /bookings"
              payload: { venue_id: "${venue_id}", guest_id: "${g}", slot_kind: "HEAT", heat_id: "${heat_id}", pricing_plan_id: "${plan_id}", origin: "WALK_IN", party_size: 1 }
              as: Cashier
              as_user_id: "cash-1"
              captures: { bk: $.data.id }
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_heat_version: "${heat_v}" }
              as: Cashier
              as_user_id: "cash-1"
            - call: "POST /bookings/${bk}/check-in"
              payload: {}
              as: Cashier
              as_user_id: "cash-1"
          trigger:
            - call: "POST /heats/${heat_id}/close"
              payload: {}
              as: OpsManager
              as_user_id: "ops-1"
          assert:
            - "Heat.${heat_id}.status == CLOSED"
            - "Booking.${bk}.status == COMPLETED"

      - name: cancel_scheduled_heat_cascades_hold_booking
        claim_type: Side Effect Execution
        grounds: [state_machines.Heat.SCHEDULED_to_CANCELLED, state_machines.Booking.HOLD_to_CANCELLED]
        distinguishing_aspect: "Cancelling a SCHEDULED heat cascades its non-terminal HOLD bookings to CANCELLED."
        test_recipe:
          setup: ["A SCHEDULED heat (never opened) with a HOLD booking."]
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${venue_id}", name: "Karts", kind: "GO_KART", lane_count: 5 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { attr_id: $.data.id }
            - call: "POST /pricing-plans"
              payload: { venue_id: "${venue_id}", name: "Heat", mode: "PER_HEAT", base_price_cents: 1000 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { plan_id: $.data.id }
            - call: "POST /heats"
              payload: { venue_id: "${venue_id}", attraction_id: "${attr_id}", start_utc: "2026-06-14T10:00:00Z", end_utc: "2026-06-14T10:15:00Z" }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { heat_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "G", height_cm: 180 }
              as: OpsManager
              as_user_id: "ops-1"
              captures: { g: $.data.id }
            - call: "POST /bookings"
              payload: { venue_id: "${venue_id}", guest_id: "${g}", slot_kind: "HEAT", heat_id: "${heat_id}", pricing_plan_id: "${plan_id}", origin: "RESERVATION", party_size: 1 }
              as: OpsManager
              as_user_id: "ops-1"
