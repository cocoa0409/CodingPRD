              captures: { av: $.data.version }
            - call: "POST /campaigns/${c1}/schedule"
              payload: { scheduled_at: "2026-05-02T10:00:00Z", send_window_minutes: 60, expected_account_version: "${av}" }
              as: CampaignAuthor
              as_user_id: "${author}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /sends"
              payload: { campaign_id: "${c1}" }
              as: CampaignAuthor
              as_user_id: "${author}"
              captures: { d1: "$.data[0].id", d2: "$.data[1].id", d3: "$.data[2].id", d4: "$.data[3].id" }
            - call: "POST /_events/emit"
              payload: { send_id: "${d1}", kind: "DELIVERED" }
              as: PlatformAdmin
            - call: "POST /_events/emit"
              payload: { send_id: "${d2}", kind: "DELIVERED" }
              as: PlatformAdmin
            - call: "POST /_events/emit"
