              as: HarvestCoordinator
            - call: "GET /grower-relations/crush-pad-lanes/${lane_id}"
              as: HarvestCoordinator
            - call: "GET /grower-relations/vineyard-blocks/${block_id}"
              as: GrowerRelationsManager
