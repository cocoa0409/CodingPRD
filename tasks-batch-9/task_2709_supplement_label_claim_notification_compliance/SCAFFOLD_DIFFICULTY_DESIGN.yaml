              captures: { dossier_a_id: $.data.id }
            - call: "POST /supplement-compliance/substantiation-dossiers/${dossier_a_id}/evidence"
              payload: { study_type: "RCT_HUMAN", subject_count: 200, dose_match: true, peer_reviewed: true, citation: "Hayashi 2021 Immunol Nutr 4:11" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/substantiation-dossiers/${dossier_a_id}/evidence"
              payload: { study_type: "RCT_HUMAN", subject_count: 150, dose_match: true, peer_reviewed: true, citation: "Moreau 2022 Clin Nutr 19:87" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/substantiation-dossiers/${dossier_a_id}/evidence"
              payload: { study_type: "OBSERVATIONAL_HUMAN", subject_count: 100, dose_match: true, peer_reviewed: true, citation: "Ferreira 2020 Cohort Rev 2:5" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/claims/${claim_a_id}/submit-for-review"
              payload: {}
