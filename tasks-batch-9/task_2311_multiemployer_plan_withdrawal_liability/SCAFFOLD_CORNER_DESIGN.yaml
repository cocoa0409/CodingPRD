      - name: superseding_a_record_that_covers_a_different_interval_is_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_SUPERSEDED_RECORD_PERIOD_MISMATCH]"
          - "entities.ContributionRecord.fields.supersedes_record_id"
        distinguishing_aspect: |
          An amendment must replace exactly the interval it supersedes, otherwise the
          superseded years silently vanish from every window. The overlap check at priority
          11 deliberately excludes the superseded row, so without this rule a 2021-2024
          amendment of a 2021-2025 record would be accepted and 2025 would disappear from
          the allocation.
        test_recipe:
          setup:
            - "An employer with one CERTIFIED record covering plan years 2021-2025."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2021, plan_year_end: 2025, contribution_base_units: 250000, contribution_amount_cents: 250000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v1}" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { rec1_id: "$.data.id" }
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v2: "$.data.version" }
          trigger:
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2021, plan_year_end: 2024, contribution_base_units: 200000, contribution_amount_cents: 200000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v2}", supersedes_record_id: "${rec1_id}" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_SUPERSEDED_RECORD_PERIOD_MISMATCH\", not ERR_CONTRIBUTION_PERIOD_OVERLAP."
            - "GET /contribution-records/${rec1_id} still reports status == \"CERTIFIED\"."
            - "GET /employers/${emp_id} still reports version == 2: a rejected write does not consume the optimistic-concurrency token."

      - name: determining_a_cba_partial_cessation_with_no_ceased_agreements_is_rejected
        claim_type: Conditional validation
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_CBA_CESSATION_COUNT_INVALID]"
          - "calculations.partial_withdrawal_fraction"
        distinguishing_aspect: |
          ceased_cba_count defaults to 0, so the rule only bites when the reported cause is
          CBA_PARTIAL_CESSATION - every other cause may legitimately leave it at 0. It is
          enforced at DETERMINATION rather than at reporting, because the count is only
          meaningful once the plan's rules variant has been resolved, and a zero count
          would make the partial withdrawal fraction 0.0000 - a partial withdrawal with no
          liability at all.
