# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_0701_seo_digital_marketing_agency (Expert)
# Breadth probe across the claim-extraction-guide's nine sections.
# Every active instance's setup_api_calls/trigger conforms to §1.5; numeric
# asserts are literals; excluded_because stubs reference §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_client_returns_defaults
        claim_type: Creation
        grounds: [entities.Client, endpoints]
        distinguishing_aspect: "POST /clients with company_name+primary_domain -> 201; status defaults PROSPECT, health_score 100, open_dispute_count 0, version 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { company_name: "New Co", primary_domain: "new.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id, st: $.data.status, hs: $.data.health_score, odc: $.data.open_dispute_count, v: $.data.version }
          assert:
            - "Client.status == PROSPECT"
            - "Client.health_score == 100 and open_dispute_count == 0 and version == 1"

      - name: create_keyword_target_required_field_missing
        claim_type: Required Fields
        grounds: [entities.KeywordTarget, "validations[priority=5]"]
        distinguishing_aspect: "POST /keyword-targets missing required search_volume -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A PROSPECT client exists"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "KW Co", primary_domain: "kw.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /keyword-targets"
              payload: { client_id: "${cl_id}", phrase: "seo", difficulty: 30 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (search_volume missing)"

      - name: create_retainer_invalid_enum_tier
        claim_type: Type Constraints
        grounds: [entities.Retainer.fields.tier, "validations[priority=5]"]
        distinguishing_aspect: "POST /retainers with tier not in {STARTER,GROWTH,DOMINATE} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["An AUDITED client exists"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Enum Co", primary_domain: "enum.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
          trigger:
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "PLATINUM", monthly_credits: 10, wholesale_price_cents: 100000 }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (PLATINUM not a valid tier)"

      - name: get_client_not_found
        claim_type: Not Found
        grounds: [entities.Client, "validations[priority=4]"]
        distinguishing_aspect: "GET /clients/{nonexistent-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /clients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: deliverable_credit_cost_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Deliverable.fields.credit_cost, calculations.deliverable_credit_cost]
        distinguishing_aspect: "credit_cost is computed (CONTENT/COMPLEX -> ceil(3*1.5)=5); even if a client tries to send credit_cost it is ignored — endpoint input does not declare it."
        test_recipe:
          setup: ["ACTIVE retainer + ACTIVE sprint; deliverable created CONTENT/COMPLEX"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { company_name: "Comp Co", primary_domain: "comp.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /sprints"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", name: "S", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z", capacity_credits: 20 }
              as: AccountManager
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /deliverables"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", sprint_id: "${sp_id}", kind: "CONTENT", complexity: "COMPLEX" }
              as: AccountManager
              captures: { cc: $.data.credit_cost }
          assert:
            - "Deliverable.credit_cost == 5 (ceil(3 * 1.5))"

      - name: keyword_priority_score_computed
        claim_type: Computed Fields
        grounds: [entities.KeywordTarget.fields.priority_score, calculations.keyword_priority_score]
        distinguishing_aspect: "priority_score = round_half_up(search_volume*(1-difficulty/100),2); 1000*(1-0.4)=600.0."
        test_recipe:
          setup: ["A PROSPECT client exists"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Prio Co", primary_domain: "prio.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /keyword-targets"
              payload: { client_id: "${cl_id}", phrase: "best agency", search_volume: 1000, difficulty: 40 }
              as: AccountManager
              captures: { ps: $.data.priority_score }
          assert:
            - "KeywordTarget.priority_score == 600.0"

      - name: audit_composite_score_computed
        claim_type: Computed Fields
        grounds: [entities.SiteAudit.fields.composite_score, calculations.audit_composite_score]
        distinguishing_aspect: "composite = round_half_up(80*0.4 + 90*0.35 + 70*0.25) = round_half_up(81.0) = 81."
        test_recipe:
          setup: ["A PROSPECT client exists"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Aud Co", primary_domain: "aud.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 80, content_score: 90, backlink_score: 70 }
              as: AgencyAdmin
              captures: { comp: $.data.composite_score }
          assert:
            - "SiteAudit.composite_score == 81"

      - name: immutable_siteaudit_no_version_field
        claim_type: Immutability
        grounds: [entities.SiteAudit]
        distinguishing_aspect: "SiteAudit has common_fields:false — no version field, no update endpoint; only created via POST /clients/{id}/audits and read."
        test_recipe:
          setup: ["A site audit exists"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Imm Co", primary_domain: "imm.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
              captures: { au_id: $.data.id }
          trigger:
            - call: "GET /audits/${au_id}"
              payload: {}
              as: AgencyAdmin
              captures: { cid: $.data.client_id }
          assert:
            - "SiteAudit retrievable; response has no version field (common_fields:false)"

      - name: list_clients_pagination_envelope
        claim_type: Listing
        grounds: [entities.Client, endpoints]
        distinguishing_aspect: "GET /clients returns array with pagination fields total_count and has_more; limit honored."
        test_recipe:
          setup: ["Two clients exist"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "L1", primary_domain: "l1.example" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { company_name: "L2", primary_domain: "l2.example" }
              as: AgencyAdmin
          trigger:
            - call: "GET /clients"
              payload: { limit: 1, offset: 0 }
              as: AgencyAdmin
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true; data length == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: deliverable_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.Deliverable, entities.Deliverable.fields.status]
        distinguishing_aspect: "A freshly created Deliverable starts in DRAFT."
        test_recipe:
          setup: ["ACTIVE retainer + sprint exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { company_name: "Init Co", primary_domain: "init.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /sprints"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", name: "S", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z", capacity_credits: 20 }
              as: AccountManager
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /deliverables"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", sprint_id: "${sp_id}", kind: "BACKLINK", complexity: "STANDARD" }
              as: AccountManager
              captures: { st: $.data.status, cc: $.data.credit_cost }
          assert:
            - "Deliverable.status == DRAFT and credit_cost == 2 (BACKLINK/STANDARD)"

      - name: approve_deliverable_not_in_review_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Deliverable.IN_REVIEW_to_APPROVED, "validations[priority=6]"]
        distinguishing_aspect: "Approving an ASSIGNED (not IN_REVIEW) deliverable -> ERR_INVALID_STATE; credits unchanged."
        test_recipe:
          setup: ["A deliverable in ASSIGNED state (reserved 3 credits)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { company_name: "Inv Co", primary_domain: "inv.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
              captures: { ret_v: $.data.version }
            - call: "POST /sprints"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", name: "S", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z", capacity_credits: 20 }
              as: AccountManager
              captures: { sp_id: $.data.id }
            - call: "POST /sprints/${sp_id}/start"
              payload: {}
              as: AccountManager
            - call: "POST /deliverables"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", sprint_id: "${sp_id}", kind: "CONTENT", complexity: "STANDARD" }
              as: AccountManager
              captures: { d_id: $.data.id }
            - call: "POST /deliverables/${d_id}/assign"
              payload: { expected_retainer_version: "${ret_v}" }
              as: AccountManager
          trigger:
            - call: "POST /deliverables/${d_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Deliverable.${d_id}.status == ASSIGNED (unchanged)"

      - name: terminal_dropped_keyword_cannot_drop_again
        claim_type: Terminal State Lockdown
        grounds: [state_machines.KeywordTarget.PLANNED_to_DROPPED]
        distinguishing_aspect: "A DROPPED keyword (terminal) rejects a second drop with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A keyword target dropped from PLANNED"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Term Co", primary_domain: "term.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /keyword-targets"
              payload: { client_id: "${cl_id}", phrase: "drop me", search_volume: 100, difficulty: 50 }
              as: AccountManager
              captures: { kw_id: $.data.id }
            - call: "POST /keyword-targets/${kw_id}/drop"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /keyword-targets/${kw_id}/drop"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "second drop returns error_id == ERR_INVALID_STATE"
            - "KeywordTarget.${kw_id}.status == DROPPED"

      - name: contract_renewal_loop_active_to_renewed_to_active
        claim_type: cyclic
        grounds: [state_machines.Contract.ACTIVE_to_RENEWED, state_machines.Contract.RENEWED_to_ACTIVE, entities.Contract.fields.cycles_elapsed]
        distinguishing_aspect: "Manual renew on ACTIVE -> RENEWED resets cycles_elapsed to 0; activate -> ACTIVE returns to the loop start (cyclic)."
        test_recipe:
          setup: ["An ACTIVE contract over an ACTIVE retainer"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Ren Co", primary_domain: "ren.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /contracts"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", term_cycles: 6, auto_renew: true }
              as: AccountManager
              captures: { co_id: $.data.id }
            - call: "POST /contracts/${co_id}/sign"
              payload: {}
              as: Client
              as_user_id: "${cl_id}"
            - call: "POST /contracts/${co_id}/activate"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /contracts/${co_id}/renew"
              payload: {}
              as: AccountManager
              captures: { st1: $.data.status, ce: $.data.cycles_elapsed }
            - call: "POST /contracts/${co_id}/activate"
              payload: {}
              as: AccountManager
              captures: { st2: $.data.status }
          assert:
            - "After renew: Contract.${co_id}.status == RENEWED and cycles_elapsed == 0"
            - "After activate: Contract.${co_id}.status == ACTIVE (loop closed)"

      - name: retainer_activate_bubbles_client_audited_to_active
        claim_type: Bubble up
        grounds: [state_machines.Retainer.DRAFT_to_ACTIVE, state_machines.Client.AUDITED_to_ACTIVE]
        distinguishing_aspect: "Activating the first retainer on an AUDITED client bubbles Client.status AUDITED -> ACTIVE."
        test_recipe:
          setup: ["AUDITED client with a DRAFT retainer"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Bub Co", primary_domain: "bub.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "GET /clients/${cl_id}"
              payload: {}
              as: AgencyAdmin
              captures: { cst: $.data.status }
          assert:
            - "Retainer.${ret_id}.status == ACTIVE"
            - "Client.${cl_id}.status == ACTIVE (bubbled up)"

      - name: client_pause_cascades_retainer_and_campaign
        claim_type: Cascade down
        grounds: [state_machines.Client.ACTIVE_to_PAUSED, state_machines.Retainer.ACTIVE_to_SUSPENDED, state_machines.AdCampaign.LIVE_to_PAUSED]
        distinguishing_aspect: "Pausing an ACTIVE client suspends ACTIVE retainers and pauses LIVE campaigns (conditional cascade on current state)."
        test_recipe:
          setup: ["ACTIVE client with ACTIVE retainer and a LIVE campaign"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Pau Co", primary_domain: "pau.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /ad-campaigns"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", channel: "GOOGLE_ADS", budget_cents: 500000 }
              as: AccountManager
              captures: { camp_id: $.data.id }
            - call: "POST /ad-campaigns/${camp_id}/launch"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /clients/${cl_id}/pause"
              payload: {}
              as: AccountManager
            - call: "GET /retainers/${ret_id}"
              payload: {}
              as: AgencyAdmin
              captures: { rst: $.data.status }
            - call: "GET /ad-campaigns/${camp_id}"
              payload: {}
              as: AgencyAdmin
              captures: { cst: $.data.lifecycle_status }
          assert:
            - "Client.${cl_id}.status == PAUSED"
            - "Retainer.${ret_id}.status == SUSPENDED (cascaded)"
            - "AdCampaign.${camp_id}.lifecycle_status == PAUSED (cascaded)"

      - name: invoice_blocked_by_open_dispute
        claim_type: guarded transitions
        grounds: [state_machines.AdCampaign.UNBILLED_to_INVOICED, "validations[priority=11]"]
        distinguishing_aspect: "Cross-entity guard: a campaign with an OPEN AdSpendDispute cannot transition UNBILLED -> INVOICED (ERR_CAMPAIGN_HAS_OPEN_DISPUTE)."
        test_recipe:
          setup: ["LIVE campaign with spend, plus one OPEN dispute"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Grd Co", primary_domain: "grd.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /ad-campaigns"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", channel: "META", budget_cents: 1000000 }
              as: AccountManager
              captures: { camp_id: $.data.id }
            - call: "POST /ad-campaigns/${camp_id}/launch"
              payload: {}
              as: AccountManager
            - call: "POST /ad-campaigns/${camp_id}/record-spend"
              payload: { amount_cents: 200000 }
              as: AccountManager
            - call: "POST /ad-spend-disputes"
              payload: { ad_campaign_id: "${camp_id}", client_id: "${cl_id}", disputed_cents: 50000 }
              as: AccountManager
          trigger:
            - call: "POST /ad-campaigns/${camp_id}/invoice"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "invoice returns error_id == ERR_CAMPAIGN_HAS_OPEN_DISPUTE"
            - "AdCampaign.${camp_id}.billing_status == UNBILLED (unchanged)"

      - name: sprint_close_blocked_by_open_work
        claim_type: Precondition Enforcement
        grounds: [state_machines.Sprint.ACTIVE_to_CLOSED, "validations[priority=15]"]
        distinguishing_aspect: "Closing an ACTIVE sprint holding an ASSIGNED deliverable -> ERR_SPRINT_HAS_OPEN_WORK."
        test_recipe:
          setup: ["ACTIVE sprint with one ASSIGNED deliverable"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /clients"
              payload: { company_name: "Spc Co", primary_domain: "spc.example" }
              as: AgencyAdmin
              captures: { cl_id: $.data.id }
            - call: "POST /clients/${cl_id}/audits"
              payload: { technical_score: 70, content_score: 70, backlink_score: 70 }
              as: AgencyAdmin
            - call: "POST /retainers"
              payload: { client_id: "${cl_id}", tier: "GROWTH", monthly_credits: 20, wholesale_price_cents: 200000 }
              as: AgencyAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retainers/${ret_id}/activate"
              payload: {}
              as: AgencyAdmin
              captures: { ret_v: $.data.version }
            - call: "POST /sprints"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", name: "S", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-05-01T00:00:00Z", capacity_credits: 20 }
              as: AccountManager
              captures: { sp_id: $.data.id }
            - call: "POST /sprints/${sp_id}/start"
              payload: {}
              as: AccountManager
            - call: "POST /deliverables"
              payload: { client_id: "${cl_id}", retainer_id: "${ret_id}", sprint_id: "${sp_id}", kind: "TECHNICAL", complexity: "STANDARD" }
              as: AccountManager
              captures: { d_id: $.data.id }
            - call: "POST /deliverables/${d_id}/assign"
              payload: { expected_retainer_version: "${ret_v}" }
              as: AccountManager
          trigger:
            - call: "POST /sprints/${sp_id}/close"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "close returns error_id == ERR_SPRINT_HAS_OPEN_WORK"
            - "Sprint.${sp_id}.status == ACTIVE (unchanged)"

  # ===========================================================================
  - section: calculations
    instances:
      - name: retainer_cycle_rollover_capped
        claim_type: Correct Result
