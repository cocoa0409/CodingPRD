            - { call: "POST /compound-orders/${ord}/complete-compounding", payload: {}, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/complete-flavoring", payload: {}, as: Pharmacist, as_user_id: "pharm-a" }
            - { call: "POST /compound-orders/${ord}/qa-pass", payload: {}, as: Pharmacist, as_user_id: "pharm-b" }
          trigger:
            - { call: "POST /compound-orders/${ord}/pay", payload: { payment_method: "WELLNESS_CREDIT", enrollment_id: "${enr}" }, as: Owner, as_user_id: "${own}", captures: { pst: $.data.payment_status, pvia: $.data.paid_via } }
            - { call: "GET /enrollments/${enr}", payload: {}, as: Owner, as_user_id: "${own}", captures: { cr1: $.data.credits_remaining, cc1: $.data.credits_consumed } }
            - { call: "POST /compound-orders/${ord}/refund", payload: {}, as: Pharmacist }
            - { call: "GET /enrollments/${enr}", payload: {}, as: Owner, as_user_id: "${own}", captures: { cr2: $.data.credits_remaining, cc2: $.data.credits_consumed } }
          assert:
            - "pay succeeds: payment_status == PAID, paid_via == WELLNESS_CREDIT, amount covered = 1 credit x 2000c (cap round_half_up(0.5*4433)=2217 -> floor(2217/2000)=1 credit)"
            - "after pay: credits_remaining == 4 AND credits_consumed == 1 AND 5 == 4 + 1"
            - "after refund: credits_remaining == 5 AND credits_consumed == 0 AND 5 == 5 + 0 — the pay/refund pair conserves the credit ledger"
            - "CompoundOrder.${ord}.payment_status == REFUNDED"
