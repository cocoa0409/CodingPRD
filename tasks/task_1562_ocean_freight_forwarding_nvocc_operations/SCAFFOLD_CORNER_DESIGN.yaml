          - errors[ERR_BOND_NOT_IN_WINDOW]
        distinguishing_aspect: "Bond activation is clock-gated by its own half-open window: a bond whose effective_from (2027-01-01) lies after the default logical clock cannot activate."
        test_recipe:
          setup: ["Bond created with window [2027-01-01, 2028-01-01); clock at default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /freight/surety-bonds", payload: { bond_number: "BOND-FUT", surety_company: "SURETYCO", coverage_amount_cents: 7500000, effective_from: "2027-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z" }, as: ComplianceOfficer, captures: { bd: $.data.id } }
          trigger:
            - { call: "POST /freight/surety-bonds/${bd}/activate", payload: {}, as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /freight/_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: OperationsManager }
            - { call: "POST /freight/surety-bonds/${bd}/activate", payload: {}, as: ComplianceOfficer, captures: { st: $.data.status } }
          assert:
            - "at default clock before effective_from: error_id == ERR_BOND_NOT_IN_WINDOW"
            - "at clock == effective_from (inclusive lower bound): status == ACTIVE"

