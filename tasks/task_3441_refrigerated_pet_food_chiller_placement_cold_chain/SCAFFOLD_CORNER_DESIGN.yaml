  - section: cross_cutting_layers
    instances:
      - name: occ_revise_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[agreement-revise-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on PlacementAgreement.version via revise: a revise carrying the pre-revision version (1) after a successful revise advanced it (2) is rejected 412; the success path bumped version by exactly 1."
        test_recipe:
          setup: ["Store with a PROPOSED agreement at version 1."]
          setup_api_calls:
            - call: "POST /cold-chain/stores"
              payload: { name: "Store Alpha", region: "US-NE", demographic_index: 80, weekly_category_velocity_index: 90, competitor_density_index: 20, available_sqft: 100, distance_miles_from_plant: 10 }
              as: PlatformAdmin
