            - { call: "POST /v1/content-assets", payload: { title: "Movie 480", content_type: "MOVIE", runtime_seconds: 480, rating: "PG", genre: "movies" }, as: ContentLicensing, captures: { ct: $.data.id } }
            - { call: "POST /v1/content-assets/${ct}/mark-available", payload: {}, as: ContentLicensing }
