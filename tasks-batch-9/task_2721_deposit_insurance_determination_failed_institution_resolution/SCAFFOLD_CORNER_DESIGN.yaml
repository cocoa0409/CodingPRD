          rationale: "§1.8 already violates the priority-45 state gate and the priority-60 segregation-of-duties rule in the same certify call and asserts that ERR_DETERMINATION_NOT_UNDER_REVIEW is returned, then repairs the state and shows the same caller now receiving ERR_SEGREGATION_OF_DUTIES_VIOLATION."

      - name: priority_ladder_bid_deadline_outranks_bidder_qualification
        claim_type: priority_ordering
        grounds:
