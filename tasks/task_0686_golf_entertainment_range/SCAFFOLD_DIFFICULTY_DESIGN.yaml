  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: wallet_conserved_across_confirm_then_ontime_cancel
        grounds:
          - state_machines.Reservation.HOLD_to_CONFIRMED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.Member.fields.wallet_balance_cents
          - entities.Charge.fields.status
        distinguishing_aspect: |
          Conserved quantity = Member wallet stored value. Forward confirm debits the
          wallet by quoted_price_cents (50000 -> 43200) and the compensating on-time
          cancel reverses the charge and credits it back, leaving wallet_balance_cents
          exactly 50000 (no drift) and the Charge REVERSED.
        test_recipe:
          setup:
            - "Venue+Bay+Member(PLATINUM, wallet 50000). PEAK 60-min weekday reservation confirmed via WALLET (net 6800, wallet 43200, charge SETTLED)."
            - "Clock well before start - 120 min (still 2026-06-01T12:00:00Z)."
          setup_api_calls:
            - call: "POST /golf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: RangeManager
            - call: "POST /golf/venues"
              payload: { name: "Range Q", bay_count: 1 }
              as: RangeManager
              captures: { venue_id: $.data.id }
            - call: "POST /golf/bays"
              payload: { venue_id: "${venue_id}", label: "Bay 1" }
              as: RangeManager
              captures: { bay_id: $.data.id, bay_v: $.data.version }
            - call: "POST /golf/members"
              payload: { email: "wc@x.com", full_name: "WC", tier: "PLATINUM" }
              as: RangeManager
              captures: { m_id: $.data.id }
            - call: "POST /golf/members/${m_id}/wallet/topup"
              payload: { amount_cents: 50000 }
              as: RangeManager
            - call: "POST /golf/reservations"
              payload: { venue_id: "${venue_id}", bay_id: "${bay_id}", member_id: "${m_id}", start_utc: "2026-06-05T18:00:00Z", end_utc: "2026-06-05T19:00:00Z", time_band: "PEAK", day_type: "WEEKDAY", pay_source: "WALLET" }
              as: Guest
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id }
            - call: "POST /golf/reservations/${res_id}/confirm"
              payload: { expected_bay_version: "${bay_v}" }
              as: Guest
              as_user_id: "${m_id}"
              captures: { chg_id: $.data.charge_id }
          trigger:
            - call: "POST /golf/reservations/${res_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${m_id}"
          assert:
            - "Reservation.${res_id}.status == CANCELLED"
            - "Member.${m_id}.wallet_balance_cents == 50000"
            - "Member.${m_id}.pending_loyalty_points == 0"
            - "Charge.${chg_id}.status == REVERSED"

      - name: gift_card_value_conserved_across_redemption
        grounds:
          - entities.GiftCard.fields.remaining_cents
          - entities.GiftCard.fields.redeemed_total_cents
          - entities.GiftCard.fields.face_value_cents
          - entities.Member.fields.wallet_balance_cents
        distinguishing_aspect: |
          Conserved quantity = GiftCard face value (a different conserved quantity from
          the wallet stored value). After redeeming 6800 of a 25000 card onto a member
          wallet, remaining_cents + redeemed_total_cents == face_value_cents (18200 +
          6800 == 25000) and the member wallet is credited 6800.
        test_recipe:
          setup:
            - "Member(wallet 0). GiftCard issued face_value 25000."
          setup_api_calls:
            - call: "POST /golf/members"
              payload: { email: "gc@x.com", full_name: "GC" }
              as: RangeManager
              captures: { m_id: $.data.id }
            - call: "POST /golf/gift-cards"
              payload: { face_value_cents: 25000 }
              as: RangeManager
              captures: { gc_id: $.data.id }
          trigger:
            - call: "POST /golf/gift-cards/${gc_id}/redeem"
              payload: { member_id: "${m_id}", amount_cents: 6800 }
              as: RangeManager
              captures: { rem: $.data.remaining_cents }
          assert:
            - "GiftCard.${gc_id}.remaining_cents == 18200"
            - "GiftCard.${gc_id}.redeemed_total_cents == 6800"
            - "Member.${m_id}.wallet_balance_cents == 6800"
