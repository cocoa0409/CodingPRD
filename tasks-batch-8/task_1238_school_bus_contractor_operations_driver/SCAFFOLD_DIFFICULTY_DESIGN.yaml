# =============================================================================
# Task 1238 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances = 22 instances.
# List endpoints sort by created_at ASC by default, so $.data[0] is the first-
# created child. All money integers are cents; all clock stamps ISO8601 UTC.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: Invoice vs ServiceDay)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_billing
        grounds:
          - calculations.invoice_billing_core
          - state_machines.Invoice.DRAFT_to_ISSUED
          - entities.Invoice.fields.provisional_total_cents
          - entities.Invoice.fields.final_total_cents
        distinguishing_aspect: |
          Same contract and same period data produce two different totals:
          PROVISIONAL (at generate) bills the still-LOCKED day at planned
          required_routes, while FINAL (at issue) drops non-RECONCILED days —
          200000 vs 100000 cents. Entity domain: Invoice billing.
        test_recipe:
          setup:
            - "Contract ACTIVE, daily rate 50000, fuel base 400 (June entry 400 -> no escalation)"
            - "Routes R1 (420-480, 40 students) and R2 (480-540, 30 students)"
            - "Driver ACTIVE, bus capacity 48"
            - "Service day 2026-06-01: both assignments COMPLETED, day RECONCILED"
            - "Service day 2026-06-02: both assignments CONFIRMED, day LOCKED (unreconciled)"
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-DV1", region_fuel_index_code: "WEST", credit_limit_cents: 100000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-DV1", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31", fuel_escalation_trigger_pct: 5, fuel_escalation_share_pct: 80 }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R1", school_site: "Lincoln", am_start_minute: 420, am_end_minute: 480, student_count: 40 }, as: ContractorOps, captures: { r1_id: $.data.id } }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R2", school_site: "Lincoln", am_start_minute: 480, am_end_minute: 540, student_count: 30 }, as: ContractorOps, captures: { r2_id: $.data.id } }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D One", license_number: "L100", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { dr_id: $.data.id } }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCREEN" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ENROLL" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "BEHIND_WHEEL", minutes: 2400, occurred_on: "2026-04-01" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "CLASSROOM", minutes: 1200, occurred_on: "2026-04-02" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCHEDULE_TEST" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "CDL_B", issued_on: "2026-04-10", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "TEST_PASS" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "S_ENDORSEMENT", issued_on: "2026-04-15", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ACTIVATE" }, as: HRRecruiter }
            - { call: "POST /busops/buses", payload: { district_id: "${d_id}", fleet_number: "B1", capacity: 48, fuel_type: "DIESEL", mpg_x10: 80, next_inspection_due: "2026-12-31" }, as: FleetManager, captures: { b_id: $.data.id } }
            - { call: "POST /busops/service-days", payload: { contract_id: "${c_id}", service_date: "2026-06-01" }, as: ContractorOps, captures: { sd1: $.data.id } }
            - { call: "POST /busops/service-days/${sd1}/open-dispatch", payload: {}, as: ContractorOps }
            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd1}" }, as: ContractorOps, captures: { d1a1: "$.data[0].id", d1a2: "$.data[1].id" } }
            - { call: "POST /busops/assignments/${d1a1}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps }
            - { call: "POST /busops/assignments/${d1a2}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps }
            - { call: "POST /busops/assignments/${d1a1}/start", payload: {}, as: Driver, as_user_id: "${dr_id}" }
            - { call: "POST /busops/assignments/${d1a1}/complete", payload: { actual_start_minute: 420, actual_end_minute: 480, actual_miles: 60 }, as: Driver, as_user_id: "${dr_id}" }
            - { call: "POST /busops/assignments/${d1a2}/start", payload: {}, as: Driver, as_user_id: "${dr_id}" }
            - { call: "POST /busops/assignments/${d1a2}/complete", payload: { actual_start_minute: 480, actual_end_minute: 540, actual_miles: 60 }, as: Driver, as_user_id: "${dr_id}" }
            - { call: "GET /busops/service-days/${sd1}", as: ContractorOps, captures: { sd1_v: $.data.version } }
            - { call: "POST /busops/service-days/${sd1}/lock", payload: { expected_service_day_version: "${sd1_v}" }, as: ContractorOps }
            - { call: "POST /busops/service-days/${sd1}/reconcile", payload: {}, as: ContractorOps }
            - { call: "POST /busops/service-days", payload: { contract_id: "${c_id}", service_date: "2026-06-02" }, as: ContractorOps, captures: { sd2: $.data.id } }
            - { call: "POST /busops/service-days/${sd2}/open-dispatch", payload: {}, as: ContractorOps }
            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd2}" }, as: ContractorOps, captures: { d2a1: "$.data[0].id", d2a2: "$.data[1].id" } }
            - { call: "POST /busops/assignments/${d2a1}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps }
            - { call: "POST /busops/assignments/${d2a2}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps }
            - { call: "GET /busops/service-days/${sd2}", as: ContractorOps, captures: { sd2_v: $.data.version } }
            - { call: "POST /busops/service-days/${sd2}/lock", payload: { expected_service_day_version: "${sd2_v}" }, as: ContractorOps }
            - { call: "POST /busops/fuel-price-entries", payload: { district_id: "${d_id}", effective_month: "2026-06", avg_price_cents_per_gallon: 400, source: "EIA" }, as: FinanceClerk }
          trigger:
            - { call: "POST /busops/invoices/generate", payload: { contract_id: "${c_id}", period_month: "2026-06" }, as: FinanceClerk, captures: { inv: $.data.id, prov_total: $.data.provisional_total_cents } }
            - { call: "POST /busops/invoices/${inv}/issue", payload: {}, as: FinanceClerk }
            - { call: "GET /busops/service-days/${sd1}", as: ContractorOps, captures: { sd1_status: $.data.status } }
          assert:
            - "Invoice.${inv}.provisional_total_cents == 200000 (LOCKED day billed at planned 2 x 50000)"
            - "Invoice.${inv}.final_total_cents == 100000 (FINAL bills RECONCILED day only)"
            - "Invoice.${inv}.total_cents == 100000 after issue"
            - "Invoice.${inv}.fuel_adjustment_cents == 0 (price 400 below trigger 420)"
            - "ServiceDay.${sd1}.status == INVOICED (issue cascade)"
            - "ServiceDay.${sd2}.status == LOCKED (unreconciled day neither billed finally nor flipped)"
            - "${prov_total} == 200000"
      - name: shortage_penalty_flat_vs_student_minute
        grounds:
          - calculations.shortage_penalty
          - state_machines.ServiceDay.LOCKED_to_RECONCILED
          - entities.Contract.fields.penalty_mode
        distinguishing_aspect: |
          Identical shortage data (1 uncovered route with 40 students) yields
          different credits under the two penalty_mode variants selected by
          contract config: FLAT_PER_ROUTE -> 15000 cents; PER_STUDENT_MINUTE ->
          40*45*25 = 45000 cents. Entity domain: ServiceDay penalty — distinct
          from the Invoice billing variant instance.
        test_recipe:
          setup:
            - "Two districts each with an ACTIVE contract; contract A penalty_mode=FLAT_PER_ROUTE (flat 15000), contract B penalty_mode=PER_STUDENT_MINUTE (25c, 45 assumed minutes)"
            - "Each contract has one route (40 students) and one service day 2026-06-01 whose single assignment is never confirmed"
            - "Both days locked and reconciled"
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-SP-A", region_fuel_index_code: "WEST", credit_limit_cents: 100000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { da_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${da_id}", bid_reference: "BID-A", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { ca_id: $.data.id } }
            - { call: "POST /busops/contracts/${ca_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${ca_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${da_id}" }
            - { call: "POST /busops/contracts/${ca_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${ca_id}", route_code: "RA", school_site: "Lincoln", am_start_minute: 420, am_end_minute: 480, student_count: 40 }, as: ContractorOps }
            - { call: "POST /busops/service-days", payload: { contract_id: "${ca_id}", service_date: "2026-06-01" }, as: ContractorOps, captures: { sda: $.data.id } }
            - { call: "POST /busops/service-days/${sda}/open-dispatch", payload: {}, as: ContractorOps, captures: { sda_v: $.data.version } }
            - { call: "POST /busops/service-days/${sda}/lock", payload: { expected_service_day_version: "${sda_v}" }, as: ContractorOps }
            - { call: "POST /busops/service-days/${sda}/reconcile", payload: {}, as: ContractorOps }
            - { call: "POST /busops/districts", payload: { name: "D-SP-B", region_fuel_index_code: "WEST", credit_limit_cents: 100000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { db_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${db_id}", bid_reference: "BID-B", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "PER_STUDENT_MINUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { cb_id: $.data.id } }
            - { call: "POST /busops/contracts/${cb_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${cb_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${db_id}" }
            - { call: "POST /busops/contracts/${cb_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${cb_id}", route_code: "RB", school_site: "Lincoln", am_start_minute: 420, am_end_minute: 480, student_count: 40 }, as: ContractorOps }
            - { call: "POST /busops/service-days", payload: { contract_id: "${cb_id}", service_date: "2026-06-01" }, as: ContractorOps, captures: { sdb: $.data.id } }
            - { call: "POST /busops/service-days/${sdb}/open-dispatch", payload: {}, as: ContractorOps, captures: { sdb_v: $.data.version } }
            - { call: "POST /busops/service-days/${sdb}/lock", payload: { expected_service_day_version: "${sdb_v}" }, as: ContractorOps }
            - { call: "POST /busops/service-days/${sdb}/reconcile", payload: {}, as: ContractorOps }
          trigger:
            - { call: "GET /busops/service-days/${sda}", as: ContractorOps, captures: { cred_a: $.data.shortage_credit_cents } }
            - { call: "GET /busops/service-days/${sdb}", as: ContractorOps, captures: { cred_b: $.data.shortage_credit_cents } }
          assert:
            - "ServiceDay.${sda}.shortage_credit_cents == 15000 (1 uncovered route x 15000 flat)"
            - "ServiceDay.${sdb}.shortage_credit_cents == 45000 (40 students x 45 min x 25c)"
            - "ServiceDay.${sda}.uncovered_routes == 1 and ServiceDay.${sdb}.uncovered_routes == 1 (identical shortage data)"
            - "${cred_a} != ${cred_b} — same shortage, variant-selected divergence"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three different modes: a, b, c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: fuel_escalation_tiered_formula
        grounds:
          - calculations.fuel_escalation_adjustment
          - entities.Contract.fields.fuel_escalation_share_pct
        distinguishing_aspect: |
          Mode (a): 5 inputs (P, B, trigger_pct, share_pct, miles/mpg gallons)
          with non-linear tier interaction — excess split at 10% of base, tier1
          at 80% share, tier2 at min(100, 120)%. With B=400, P=455, share=80:
          adj/gal = 32+15 = 47c; days of 20.000 and 30.000 gallons -> 940+1410
          = 2350 cents.
        test_recipe:
          setup:
            - "Contract ACTIVE: base 400, trigger 5, share 80; one route; June fuel entry 455"
            - "Day 2026-06-01: assignment COMPLETED with actual_miles=100 on bus mpg_x10=50 (20.000 gal)"
            - "Day 2026-06-02: assignment COMPLETED with actual_miles=150 (30.000 gal); both days RECONCILED"
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-FUEL1", region_fuel_index_code: "WEST", credit_limit_cents: 100000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-F1", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31", fuel_escalation_trigger_pct: 5, fuel_escalation_share_pct: 80 }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R1", school_site: "Lincoln", am_start_minute: 420, am_end_minute: 480, student_count: 40 }, as: ContractorOps }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D Fuel", license_number: "L200", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { dr_id: $.data.id } }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCREEN" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ENROLL" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "BEHIND_WHEEL", minutes: 2400, occurred_on: "2026-04-01" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "CLASSROOM", minutes: 1200, occurred_on: "2026-04-02" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCHEDULE_TEST" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "CDL_B", issued_on: "2026-04-10", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "TEST_PASS" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "S_ENDORSEMENT", issued_on: "2026-04-15", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ACTIVATE" }, as: HRRecruiter }
            - { call: "POST /busops/buses", payload: { district_id: "${d_id}", fleet_number: "BF1", capacity: 48, fuel_type: "DIESEL", mpg_x10: 50, next_inspection_due: "2026-12-31" }, as: FleetManager, captures: { b_id: $.data.id } }
            - { call: "POST /busops/service-days", payload: { contract_id: "${c_id}", service_date: "2026-06-01" }, as: ContractorOps, captures: { sd1: $.data.id } }
            - { call: "POST /busops/service-days/${sd1}/open-dispatch", payload: {}, as: ContractorOps }
            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd1}" }, as: ContractorOps, captures: { a1: "$.data[0].id" } }
            - { call: "POST /busops/assignments/${a1}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps }
            - { call: "POST /busops/assignments/${a1}/start", payload: {}, as: Driver, as_user_id: "${dr_id}" }
            - { call: "POST /busops/assignments/${a1}/complete", payload: { actual_start_minute: 420, actual_end_minute: 480, actual_miles: 100 }, as: Driver, as_user_id: "${dr_id}" }
            - { call: "GET /busops/service-days/${sd1}", as: ContractorOps, captures: { sd1_v: $.data.version } }
            - { call: "POST /busops/service-days/${sd1}/lock", payload: { expected_service_day_version: "${sd1_v}" }, as: ContractorOps }
            - { call: "POST /busops/service-days/${sd1}/reconcile", payload: {}, as: ContractorOps }
            - { call: "POST /busops/service-days", payload: { contract_id: "${c_id}", service_date: "2026-06-02" }, as: ContractorOps, captures: { sd2: $.data.id } }
            - { call: "POST /busops/service-days/${sd2}/open-dispatch", payload: {}, as: ContractorOps }
            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd2}" }, as: ContractorOps, captures: { a2: "$.data[0].id" } }
            - { call: "POST /busops/assignments/${a2}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps }
            - { call: "POST /busops/assignments/${a2}/start", payload: {}, as: Driver, as_user_id: "${dr_id}" }
            - { call: "POST /busops/assignments/${a2}/complete", payload: { actual_start_minute: 420, actual_end_minute: 480, actual_miles: 150 }, as: Driver, as_user_id: "${dr_id}" }
            - { call: "GET /busops/service-days/${sd2}", as: ContractorOps, captures: { sd2_v: $.data.version } }
            - { call: "POST /busops/service-days/${sd2}/lock", payload: { expected_service_day_version: "${sd2_v}" }, as: ContractorOps }
            - { call: "POST /busops/service-days/${sd2}/reconcile", payload: {}, as: ContractorOps }
            - { call: "POST /busops/fuel-price-entries", payload: { district_id: "${d_id}", effective_month: "2026-06", avg_price_cents_per_gallon: 455, source: "EIA" }, as: FinanceClerk }
          trigger:
            - { call: "POST /busops/invoices/generate", payload: { contract_id: "${c_id}", period_month: "2026-06" }, as: FinanceClerk, captures: { inv: $.data.id } }
          assert:
            - "Invoice.${inv}.fuel_adjustment_cents == 2350 (tier1 32c + tier2 15c = 47c/gal; 940 + 1410)"
            - "Invoice.${inv}.bus_lines_cents == 100000"
            - "Invoice.${inv}.total_cents == 102350"
      - name: fuel_daily_rounding_order_pinned
        grounds:
          - calculations.invoice_fuel_daily_rounding
          - calculations.fuel_escalation_adjustment
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. With mpg 3.0 and 100
          miles/day, each day burns 33.333 gal; at 47c/gal the pinned order
          (round each day, then sum) yields 1567+1567 = 3134 cents, while the
          forbidden sum-then-round order yields round(3133.33) = 3133.
        test_recipe:
          setup:
            - "Contract ACTIVE: base 400, trigger 5, share 80; June fuel entry 455 (adj 47c/gal)"
            - "Bus mpg_x10=30 (3.0 mpg); two days 2026-06-01/02 each COMPLETED with actual_miles=100"
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-FUEL2", region_fuel_index_code: "WEST", credit_limit_cents: 100000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-F2", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31", fuel_escalation_trigger_pct: 5, fuel_escalation_share_pct: 80 }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R1", school_site: "Lincoln", am_start_minute: 420, am_end_minute: 480, student_count: 40 }, as: ContractorOps }
