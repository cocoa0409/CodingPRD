scaffold_difficulty_design:

  # ==========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: adjudication_decision_federal_vs_jurisdictional
        grounds:
          - calculations.adjudication_composite_decision
          - entities.BackgroundCheckOrder.fields.composite_decision
          - entities.VerificationItem.fields.severity_score
          - endpoints[POST /fcra/orders/{orderId}/pre-adverse]
        distinguishing_aspect: |
          Operates on BackgroundCheckOrder.composite_decision — distinct from the cooling_off_period
          variant (which lives on AdverseActionFlow). The federal_strict variant counts items whose
          severity_score >= 15 (fail_count) while jurisdictional_aggregate sums all severity_scores
          and compares to a state-keyed cut. On identical inputs (FELONY conviction CRIMINAL=70, MVR=0,
          EDU=0) for a FL candidate: federal_strict yields CONSIDER (1 fail < 2), jurisdictional_aggregate
          yields INELIGIBLE (70 >= FL cut of 55).
        test_recipe:
          setup:
            - "PUT /fcra/jurisdiction-policies/FL with adverse_action_waiting_business_days=5, salary_history_ban=true, ban_the_box_stage=POST_OFFER, criminal_lookback_years=7"
            - "POST /fcra/candidates {residence_jurisdiction=FL, full_name='Alice F', email='alice@f.test', date_of_birth='1990-01-01'}"
            - "POST /fcra/candidates/{id}/consent with valid signature"
            - "POST /fcra/orders {requested_packages=[CRIMINAL,MVR,EDUCATION], stage_at_order=POST_OFFER}"
            - "POST /fcra/orders/{id}/start-verification"
            - "POST /fcra/verification-items/{criminal_id}/return with {conviction_date=2 years ago, severity=FELONY}  -> severity_score=70"
            - "POST /fcra/verification-items/{mvr_id}/return with {violations_3yr=0, license_status=VALID}        -> severity_score=0"
            - "POST /fcra/verification-items/{edu_id}/return with {institution='X', claim_verified=true}           -> severity_score=0"
          trigger:
            - "GET /fcra/orders/{id} (engine uses jurisdictional_aggregate; composite_decision == INELIGIBLE)"
          assert:
            - "order.composite_decision == 'INELIGIBLE'   # 70 >= FL cut 55"
            - "If the federal_strict variant were applied to the same data: fail_count==1, decision would be CONSIDER (1 < 2 ineligible threshold)"
            - "order.status == 'AWAITING_ADJUDICATION' (Adjudicator must still issue Pre-Adverse)"

      - name: cooling_off_federal_vs_jurisdictional
        grounds:
          - calculations.cooling_off_period
          - entities.AdverseActionFlow.fields.earliest_final_eligible_at
          - entities.AdverseActionFlow.fields.waiting_period_business_days
          - endpoints[POST /fcra/orders/{orderId}/pre-adverse]
        distinguishing_aspect: |
          Operates on AdverseActionFlow.earliest_final_eligible_at — distinct entity domain from the
          adjudication variant on BackgroundCheckOrder. federal_strict pins required_business_days=5
          regardless of state; jurisdictional uses max(5, jurisdiction.adverse_action_waiting_business_days).
          For CA (waiting=8) the two variants diverge by exactly 3 business days on the same pre_adverse
          send timestamp.
        test_recipe:
          setup:
            - "PUT /fcra/jurisdiction-policies/CA with adverse_action_waiting_business_days=8, criminal_lookback_years=7, salary_history_ban=true, ban_the_box_stage=POST_OFFER"
            - "Seed clock to Mon 2026-01-05 10:00:00 UTC"
            - "Create CA candidate, consent, order with CRIMINAL package; return raw_finding {FELONY, 1yr old} so composite_decision != CLEAR"
          trigger:
            - "POST /fcra/orders/{id}/pre-adverse (issues notice; engine uses jurisdictional variant)"
          assert:
            - "AdverseActionFlow.waiting_period_business_days == 8"
            - "AdverseActionFlow.earliest_final_eligible_at == '2026-01-15T10:00:00.000Z'  # +8 business days: Tue 6, Wed 7, Thu 8, Fri 9, Mon 12, Tue 13, Wed 14, Thu 15"
            - "Under federal_strict variant the value would be '2026-01-12T10:00:00.000Z' (+5 business days)"
            - "Calling final-adverse on Mon 2026-01-12 returns ERR_COOLING_OFF_NOT_ELAPSED (jurisdictional wins)"

  # ==========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: adjudication_aggregate_with_state_keyed_cut
        grounds:
          - calculations.adjudication_composite_decision
          - calculations.verification_severity_score
          - entities.VerificationItem.fields.severity_score
          - entities.BackgroundCheckOrder.fields.composite_decision
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction. Inputs: per-item severity_score
          (3 items), state-keyed JURISDICTIONAL_AGGREGATE_INELIGIBLE_BY_STATE[code], the global
          JURISDICTIONAL_AGGREGATE_CONSIDER=30 threshold, and the boundary semantics (> for CONSIDER,
          >= for INELIGIBLE). Severity_score itself is non-linear per-kind: MVR uses tiered_breakpoints
          + license_status bonus; CRIMINAL uses severity enum + lookback gate. Same total can yield
          CLEAR/CONSIDER/INELIGIBLE depending on state.
        test_recipe:
          setup:
            - "PUT /fcra/jurisdiction-policies/TX with criminal_lookback_years=7, ban_the_box_stage=POST_OFFER, waiting=5"
            - "PUT /fcra/jurisdiction-policies/CA with criminal_lookback_years=7, ban_the_box_stage=POST_OFFER, waiting=8"
            - "Create CA candidate + order with CRIMINAL{MISDEMEANOR,1yr}, MVR{violations=2,VALID}, EDU{verified=true}; severity_scores = 25, 25, 0; total=50"
            - "Create TX candidate + order with the same raw_findings; severity_scores = 25, 25, 0; total=50"
          trigger:
            - "GET /fcra/orders/{ca_order_id}"
            - "GET /fcra/orders/{tx_order_id}"
          assert:
            - "ca_order.composite_decision == 'CONSIDER'   # 50 > 30 and 50 < 80 (CA cut)"
            - "tx_order.composite_decision == 'CONSIDER'   # 50 > 30 and 50 < 60 (TX cut), still CONSIDER"
            - "Increase MVR violations to 3+ (severity=50) so total=75: ca_order.composite_decision still CONSIDER (75 < 80), tx_order.composite_decision flips to INELIGIBLE (75 >= 60). Same inputs, different states, different decisions."

      - name: cooling_off_eval_order_pinned
        grounds:
          - calculations.cooling_off_period
          - state_machines.AdverseActionFlow.PRE_AWAITING_DISPUTE_WINDOW_to_DISPUTE_PAUSED
          - state_machines.AdverseActionFlow.DISPUTE_PAUSED_to_PRE_AWAITING_DISPUTE_WINDOW
          - entities.AdverseActionFlow.fields.earliest_final_eligible_at
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by explicit evaluation order. required_business_days
          depends on jurisdiction (snapshot at flow creation), elapsed_business_days depends on the
          pause/resume history of THIS flow, and remaining = required - elapsed; earliest_final_eligible_at
          must be re-derived by add_business_days(now(), remaining) every time the flow transitions out of
          DISPUTE_PAUSED. The scaffold pins the order: (1) snapshot waiting at flow creation, (2) read
          elapsed from the last DISPUTE_PAUSED entry, (3) compute remaining, (4) project forward from
          now(). Reversing steps (2) and (4) produces an earlier eligible-at and is wrong.
        test_recipe:
          setup:
            - "CA candidate (waiting=8), pre-adverse sent Mon 2026-01-05 10:00 UTC; initial earliest_final == 2026-01-15"
            - "Candidate opens Dispute on Wed 2026-01-07 10:00 (elapsed_business_days at pause = 2)"
            - "Advance clock to Tue 2026-01-13 10:00 (6 calendar days later)"
            - "Adjudicator resolves dispute UPHELD on 2026-01-13 10:00"
          trigger:
            - "POST /fcra/disputes/{id}/resolve {status: UPHELD}"
            - "GET /fcra/orders/{id}"
          assert:
            - "AdverseActionFlow.earliest_final_eligible_at == '2026-01-21T10:00:00.000Z'  # +6 remaining business days from Tue 2026-01-13: Wed 14, Thu 15, Fri 16, (Sat/Sun skip), Mon 19 (assume working day), Tue 20, Wed 21"
            - "If the implementation re-snapshotted required from now() (8 BD from 2026-01-13) it would yield 2026-01-23 — that is wrong and the test fails it"

  # ==========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_branching_with_rework_cycle
        grounds:
          - state_machines.BackgroundCheckOrder.AWAITING_ADJUDICATION_to_COMPLETED_CLEAR
          - state_machines.BackgroundCheckOrder.AWAITING_ADJUDICATION_to_PRE_ADVERSE_ISSUED
          - state_machines.BackgroundCheckOrder.PRE_ADVERSE_ISSUED_to_REWORK
          - state_machines.BackgroundCheckOrder.REWORK_to_IN_VERIFICATION
        distinguishing_aspect: |
          Non-linear shape on BackgroundCheckOrder: fork at AWAITING_ADJUDICATION (auto-CLEAR vs
          Adjudicator pre-adverse) PLUS a revision cycle PRE_ADVERSE_ISSUED -> REWORK -> IN_VERIFICATION
          -> AWAITING_ADJUDICATION -> PRE_ADVERSE_ISSUED. Linear pipeline tests cannot reach REWORK.
        test_recipe:
          setup:
            - "Create order that lands in AWAITING_ADJUDICATION with composite_decision=CONSIDER"
            - "Issue Pre-Adverse"
          trigger:
            - "POST /fcra/orders/{id}/request-rework"
            - "POST /fcra/orders/{id}/resume-verification"
            - "POST /fcra/verification-items/{id}/return with cleaner raw_finding"
          assert:
            - "VerificationItem.rework_count == 1 after request-rework"
            - "order.status traverses PRE_ADVERSE_ISSUED -> REWORK -> IN_VERIFICATION -> AWAITING_ADJUDICATION (cycle reached)"

      - name: adverse_flow_parallel_dimensions
        grounds:
          - state_machines.AdverseActionFlow
          - entities.AdverseActionFlow.fields.notification_status
          - entities.AdverseActionFlow.fields.procedural_status
        distinguishing_aspect: |
          Non-linear shape on AdverseActionFlow: two parallel state axes on the same row.
          notification_status (PENDING_DELIVERY -> PRE_DELIVERED -> FINAL_DELIVERED) and procedural_status
          (PRE_AWAITING_DISPUTE_WINDOW -> DISPUTE_PAUSED -> ... -> FINALIZED) evolve independently. A
          dispute opened during the window flips procedural_status to DISPUTE_PAUSED while
          notification_status stays PRE_DELIVERED.
        test_recipe:
          setup:
            - "Create order, issue pre-adverse"
            - "AdverseActionFlow.notification_status == PRE_DELIVERED, procedural_status == PRE_AWAITING_DISPUTE_WINDOW"
          trigger:
            - "POST /fcra/disputes (open dispute)"
          assert:
            - "AdverseActionFlow.notification_status == 'PRE_DELIVERED'   # unchanged"
            - "AdverseActionFlow.procedural_status == 'DISPUTE_PAUSED'    # changed independently"

  # ==========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: final_adverse_cascade_depth_3
        grounds:
          - state_machines.BackgroundCheckOrder.AWAITING_FINAL_to_TERMINATED_ADVERSE
          - calculations.eligibility_posture_recompute
          - entities.Candidate.fields.eligibility_posture
          - entities.AuditEvent.fields.event_type
        distinguishing_aspect: |
          Depth-4 cascade originating at POST /fcra/orders/{id}/final-adverse. Hop 1: AdverseActionFlow
          fields set (final_adverse_action_at, procedural_status=FINALIZED). Hop 2: that mutation forces
          BackgroundCheckOrder.status -> TERMINATED_ADVERSE. Hop 3: that mutation triggers
          eligibility_posture_recompute on Candidate -> LOCKED. Hop 4: LOCKED causes all sibling
          non-terminal orders to cascade to CANCELLED. Each hop is caused by the previous, not directly
          by the API call.
        test_recipe:
          setup:
            - "CA candidate with 2 open orders: order_A (in PRE_ADVERSE_ISSUED) and order_B (in IN_VERIFICATION)"
            - "Advance clock past order_A's earliest_final_eligible_at; run sweep"
          trigger:
            - "POST /fcra/orders/{order_A_id}/final-adverse"
          assert:
            - "order_A.status == 'TERMINATED_ADVERSE' AND AdverseActionFlow.final_adverse_action_at is set (hop 1+2)"
            - "candidate.eligibility_posture == 'LOCKED' (hop 3, recomputed within the same request)"
            - "order_B.status == 'CANCELLED' (hop 4, cascaded; sibling cancellation)"
            - "AuditEvent chain contains FINAL_ADVERSE_ISSUED then ORDER_CANCELLED, both with previous_event_id non-null"

      - name: item_returned_cascade_depth_2
        grounds:
          - state_machines.VerificationItem.IN_PROGRESS_to_RETURNED
          - state_machines.BackgroundCheckOrder.IN_VERIFICATION_to_AWAITING_ADJUDICATION
          - state_machines.BackgroundCheckOrder.AWAITING_ADJUDICATION_to_COMPLETED_CLEAR
          - calculations.adjudication_composite_decision
        distinguishing_aspect: |
          Depth-3 cascade originating at POST /fcra/verification-items/{id}/return — different trigger
          from the final-adverse cascade. Hop 1: VerificationItem.status -> RETURNED and severity_score
          recomputed. Hop 2: caused by hop 1 (last sibling item now RETURNED), parent order
          IN_VERIFICATION -> AWAITING_ADJUDICATION + composite_decision recomputed. Hop 3: caused by
          hop 2 (composite_decision == CLEAR), order auto-transitions AWAITING_ADJUDICATION ->
          COMPLETED_CLEAR. Each hop is caused by the previous mutation.
        test_recipe:
          setup:
            - "Order with 3 packages; first 2 items already RETURNED with severity_score==0 each"
            - "Order.status == IN_VERIFICATION"
          trigger:
            - "POST /fcra/verification-items/{last_item_id}/return with claim_verified=true (severity_score=0)"
          assert:
            - "last_item.status == 'RETURNED' (hop 1)"
            - "order.status == 'COMPLETED_CLEAR' (hops 2+3 inside the same request)"
            - "order.composite_decision == 'CLEAR'"

  # ==========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ban_the_box_outranks_referential_consent_mismatch
        grounds:
          - validations[priority=7]
          - validations[priority=13]
        distinguishing_aspect: |
          Conflict pair: business_safety (Ban-the-Box, priority 7) vs business_referential
          (consent_disclosure_id belongs to different candidate, priority 13). Both fail on the same
          request, BTB wins because category business_safety precedes business_referential.
        test_recipe:
          setup:
            - "PUT /fcra/jurisdiction-policies/NY with ban_the_box_stage=POST_OFFER"
            - "Create candidate_A and candidate_B in NY; create ACTIVE consent for candidate_B"
            - "Open order for candidate_A with stage_at_order=PRE_OFFER AND consent_disclosure_id=consent_of_B"
          trigger:
            - "POST /fcra/orders with both violations"
          assert:
            - "response.status == 422"
            - "response.data.error_id == 'ERR_BAN_THE_BOX_VIOLATION'   # NOT 'ERR_CONSENT_CANDIDATE_MISMATCH'"

      - name: state_outranks_cooling_off
        grounds:
          - validations[priority=6]
          - validations[priority=11]
        distinguishing_aspect: |
          Conflict pair: state (ERR_INVALID_STATE, priority 6) vs business_safety
          (ERR_COOLING_OFF_NOT_ELAPSED, priority 11). Different error-category pair from the BTB-vs-
          referential conflict above. Caller tries POST /fcra/orders/{id}/final-adverse while order is
          still PRE_ADVERSE_ISSUED (not AWAITING_FINAL — state fail) AND cooling-off not yet elapsed.
          state check wins.
        test_recipe:
          setup:
            - "Order in PRE_ADVERSE_ISSUED with earliest_final_eligible_at in the future"
          trigger:
            - "POST /fcra/orders/{id}/final-adverse"
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'   # state precedes cooling-off business check"

  # ==========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: criminal_lookback_age_inclusive_boundary
        grounds:
          - calculations.criminal_record_age_cutoff
          - calculations.verification_severity_score
          - validations[priority=6]
          - endpoints[POST /fcra/verification-items/{itemId}/return]
        distinguishing_aspect: |
          Numeric threshold metric: age_years_exact == criminal_lookback_years is the boundary; <= is
          reportable, > is not. A conviction whose age is exactly 7.0 years on a CA candidate
          (lookback=7) is reportable (severity_score = MISDEMEANOR=25). A conviction whose age is
          7.0001 years yields severity_score=0. Distinct from the empty-set boundary below — this is a
          numeric crossing.
        test_recipe:
          setup:
            - "Seed clock to 2026-01-05 12:00 UTC"
            - "CA candidate, order in IN_VERIFICATION with CRIMINAL item"
          trigger:
            - "POST /fcra/verification-items/{id}/return with raw_finding={severity=MISDEMEANOR, conviction_date='2019-01-05'} (age=7.0006 years on 2026-01-05 -> > 7 -> not reportable)"
            - "PATCH (resubmit) with conviction_date='2019-01-06' (age=6.998 years -> <= 7 -> reportable)"
          assert:
            - "First return: VerificationItem.severity_score == 0   # outside lookback (>7)"
            - "After resubmit: VerificationItem.severity_score == 25   # within lookback (<=7), MISDEMEANOR_SCORE"

      - name: requested_packages_empty_collection_boundary
        grounds:
          - validations[priority=15]
          - entities.BackgroundCheckOrder.fields.requested_packages
          - endpoints[POST /fcra/orders]
        distinguishing_aspect: |
          Empty-collection metric: requested_packages with zero entries triggers ERR_PACKAGE_SET_INVALID.
          Distinct from the numeric crossing above — this boundary is at cardinality 0. Reached through a
          different endpoint (POST /fcra/orders, not /verification-items/return).
        test_recipe:
          setup:
            - "Valid candidate + ACTIVE consent in CA"
          trigger:
            - "POST /fcra/orders with requested_packages=[]"
          assert:
            - "response.status == 422"
            - "response.data.error_id == 'ERR_PACKAGE_SET_INVALID'"
            - "Then POST /fcra/orders with requested_packages=['CRIMINAL']  (cardinality 1) succeeds with 201"

  # ==========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_start_verification_depends_on_consent_status
        grounds:
          - state_machines.BackgroundCheckOrder.INTAKE_to_IN_VERIFICATION
          - entities.ConsentDisclosure.fields.status
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair (BackgroundCheckOrder, ConsentDisclosure). The order's INTAKE -> IN_VERIFICATION
          transition is gated by ConsentDisclosure.status == ACTIVE. If consent is REVOKED between
          order creation and start-verification, the transition is rejected.
        test_recipe:
          setup:
            - "Candidate with ACTIVE consent; POST /fcra/orders succeeds (order in INTAKE)"
            - "POST /fcra/candidates/{id}/consent/revoke   -> consent.status = REVOKED"
          trigger:
            - "POST /fcra/orders/{id}/start-verification"
          assert:
            - "response.status == 422 AND response.data.error_id == 'ERR_CONSENT_INVALID'"

      - name: order_final_adverse_depends_on_dispute_status
        grounds:
          - state_machines.BackgroundCheckOrder.AWAITING_FINAL_to_TERMINATED_ADVERSE
          - entities.Dispute.fields.status
          - validations[priority=12]
        distinguishing_aspect: |
          Entity pair (BackgroundCheckOrder, Dispute) — different pair from (Order, Consent).
          The order's AWAITING_FINAL -> TERMINATED_ADVERSE transition is gated by absence of OPEN
          Disputes on any of its VerificationItems. Cooling-off may have elapsed and SoD may pass, but
          a single OPEN Dispute still blocks Final Adverse Action.
        test_recipe:
          setup:
            - "Order in PRE_ADVERSE_ISSUED, cooling-off elapsed (advance clock + sweep -> AWAITING_FINAL)"
            - "Candidate opens a Dispute on one VerificationItem (status=OPEN)"
          trigger:
            - "POST /fcra/orders/{id}/final-adverse"
          assert:
            - "response.status == 422 AND response.data.error_id == 'ERR_OPEN_DISPUTE_BLOCKS_FINAL'"

  # ==========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: dispute_pause_interval_overlapping_cooling_off_window
        grounds:
          - state_machines.AdverseActionFlow.PRE_AWAITING_DISPUTE_WINDOW_to_DISPUTE_PAUSED
          - state_machines.AdverseActionFlow.DISPUTE_PAUSED_to_PRE_AWAITING_DISPUTE_WINDOW
          - calculations.cooling_off_period
          - entities.AdverseActionFlow.fields.earliest_final_eligible_at
        distinguishing_aspect: |
          Resource = AdverseActionFlow. Interval semantics = pause/resume on a business-day clock.
          A Dispute interval [opened_at, resolved_at] is treated as a HALF-OPEN occupation of the cooling-
          off window: the elapsed counter freezes at opened_at (inclusive of opened_at-day's elapsed)
          and the clock resumes at resolved_at (exclusive of resolved_at-day until next business day
          tick). Two disputes in the same window aggregate their pause durations.
        test_recipe:
          setup:
            - "CA flow with waiting=8; pre-adverse Mon 2026-01-05 10:00; initial earliest=2026-01-15"
            - "Dispute_1 opened Wed 2026-01-07 10:00 (elapsed_business_days=2)"
            - "Advance clock to Fri 2026-01-09 10:00; resolve Dispute_1 UPHELD"
            - "Open Dispute_2 Mon 2026-01-12 10:00; resolve Tue 2026-01-13 10:00"
          trigger:
            - "POST /fcra/_clock/advance + POST /fcra/_sweep/run after all disputes resolved"
            - "GET /fcra/orders/{id}"
          assert:
            - "AdverseActionFlow.earliest_final_eligible_at correctly aggregates BOTH pause intervals (sum of remaining business days from each resume point)"
            - "The total elapsed counted is exactly the business days outside any [opened_at, resolved_at] interval"

      - name: adverse_lock_365_day_rolling_window
        grounds:
          - calculations.eligibility_posture_recompute
          - entities.Candidate.fields.eligibility_posture
          - endpoints[POST /fcra/_sweep/run]
        distinguishing_aspect: |
          Resource = Candidate. Interval semantics = closed-open 365-day window from the most recent
          final_adverse_action_at. Different interval arithmetic from the pause/resume semantics above:
          this is a calendar-day rolling window with day-365 still LOCKED, day-366 ADVERSE. Tested by
          advancing the clock past the boundary and running the sweep.
        test_recipe:
          setup:
            - "Candidate with TERMINATED_ADVERSE order; final_adverse_action_at = 2025-01-05 00:00 UTC"
            - "Advance clock to 2026-01-05 00:00 UTC (exactly 365 days)"
          trigger:
            - "POST /fcra/_sweep/run"
            - "GET /fcra/candidates/{id}"
          assert:
            - "Day-365 (2026-01-05 00:00): candidate.eligibility_posture == 'LOCKED'   # inclusive boundary"
            - "Advance clock 1 calendar day to 2026-01-06 00:00; run sweep; candidate.eligibility_posture == 'ADVERSE'   # exclusive on day 366"

  # ==========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_order_preserves_candidate_open_count_invariant
        grounds:
          - state_machines.BackgroundCheckOrder.IN_VERIFICATION_to_CANCELLED
          - calculations.eligibility_posture_recompute
          - entities.Candidate.fields.eligibility_posture
        distinguishing_aspect: |
          Conserved quantity: count(BackgroundCheckOrder rows for candidate). The cancel action removes
          an order from open status but does not delete it. Invariant:
            count(orders for candidate) BEFORE cancel == count(orders for candidate) AFTER cancel
            AND
            count(orders.status IN {INTAKE, IN_VERIFICATION, AWAITING_ADJUDICATION, PRE_ADVERSE_ISSUED,
                                    AWAITING_FINAL, REWORK}) AFTER == count BEFORE - 1.
          A non-compensating implementation that hard-deletes the order would violate the first half;
          one that fails to recompute eligibility_posture would violate the implied posture invariant.
        test_recipe:
          setup:
            - "Candidate with 1 order in IN_VERIFICATION (posture=UNDER_REVIEW)"
            - "Record total_orders_before = 1, open_orders_before = 1"
          trigger:
            - "POST /fcra/orders/{id}/cancel"
          assert:
            - "GET /fcra/orders?candidate_id={id} returns 1 row (cancelled, not deleted) -> total_orders unchanged"
            - "candidate.eligibility_posture == 'ELIGIBLE'  # no open orders left"
            - "Open AuditEvent chain still contains ORDER_OPENED and now ORDER_CANCELLED with previous_event_id linking"

      - name: dispute_overturn_preserves_item_partition_invariant
        grounds:
          - state_machines.Dispute.OPEN_to_OVERTURNED
          - state_machines.VerificationItem.DISPUTED_to_REWORK_REQUIRED
          - entities.VerificationItem.fields.rework_count
        distinguishing_aspect: |
          Conserved quantity: count of VerificationItem rows per BackgroundCheckOrder (item partition).
          When a Dispute is OVERTURNED, the item moves DISPUTED -> REWORK_REQUIRED (a status change,
          NOT a delete or re-create). Invariant:
            count(VerificationItem WHERE order_id=X) BEFORE overturn == count AFTER overturn
            AND
            rework_count AFTER == rework_count BEFORE + 1.
          A non-compensating implementation that spawns a fresh VerificationItem on rework would
          double the count and violate the invariant. Different conserved quantity from the order-count
          invariant above.
        test_recipe:
          setup:
            - "Order in PRE_ADVERSE_ISSUED with 3 items; one item is DISPUTED (rework_count=0); Dispute is OPEN"
            - "Record items_count_before = 3"
          trigger:
            - "POST /fcra/disputes/{id}/resolve {status: OVERTURNED}"
          assert:
            - "GET /fcra/orders/{id}/items returns exactly 3 rows -> items_count unchanged"
            - "the disputed item.status == 'REWORK_REQUIRED' AND item.rework_count == 1"
            - "Repeat the overturn cycle a second time -> rework_count == 2 (still 3 items); a third attempt is rejected by ERR_REWORK_CAP_EXCEEDED"
