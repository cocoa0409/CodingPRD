errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for endpoint" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Entity-backed actor does not own the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the transition" }
  - { id: ERR_CHARGE_ALREADY_BILLED, http: 409, condition: "Opt-out or revoke attempted on an IA charge in BILLED" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid field, bad enum, qty bounds violated" }
  - { id: ERR_PRICE_POSTING_REQUIRED, http: 422, condition: "Adoption submit without posted_price_cents" }
  - { id: ERR_SOD_COMMISSION_CONFLICT, http: 403, condition: "Commission issuer equals a committed buy-plan committer for same publisher+term" }
  - { id: ERR_CENSUS_NOT_REACHED, http: 422, condition: "Census billing run before census_at" }
  - { id: ERR_AID_WINDOW_CLOSED, http: 422, condition: "aid_only order placed outside the aid charge window" }
  - { id: ERR_INSUFFICIENT_AID, http: 402, condition: "aid_only order total exceeds available aid" }
  - { id: ERR_RETURN_WINDOW_CLOSED, http: 422, condition: "Non-digital return after add/drop deadline without manager override" }
  - { id: ERR_DIGITAL_NOT_RETURNABLE, http: 422, condition: "Digital return beyond 48h after placement" }
  - { id: ERR_OPT_OUT_WINDOW_CLOSED, http: 422, condition: "IA opt-out/revoke after ia_opt_out_deadline_at" }
  - { id: ERR_BUYBACK_WINDOW_CLOSED, http: 422, condition: "Buyback create/accept outside an open buyback window" }
  - { id: ERR_QUOTE_EXPIRED, http: 422, condition: "Ticket accept after quote_valid_until" }
  - { id: ERR_FORMAT_NOT_OFFERED, http: 422, condition: "Format not offered by the title" }
  - { id: ERR_DUPLICATE_ADOPTION, http: 409, condition: "Non-terminal adoption already exists for (section_id, title_id)" }
  - { id: ERR_ENROLLMENT_DUPLICATE, http: 409, condition: "Enrollment already exists for (section_id, student_id)" }
  - { id: ERR_SECTION_CAPACITY_REACHED, http: 409, condition: "ENROLLED count == enrollment_capacity" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Title stock for format below line qty" }
  - { id: ERR_AGREEMENT_OVERLAP, http: 409, condition: "Closed-interval agreement overlap for publisher (adjacency counts as overlap)" }
  - { id: ERR_QUOTE_WINDOW_OVERLAP, http: 409, condition: "Half-open quote window overlap for (title, condition); adjacency allowed" }
  - { id: ERR_DUPLICATE_COMMISSION_STATEMENT, http: 409, condition: "Non-terminal statement exists for (publisher_id, term_id)" }
  - { id: ERR_NO_ACTIVE_AGREEMENT, http: 422, condition: "No agreement covers the title's publisher at now" }
  - { id: ERR_ADOPTION_NOT_APPROVED, http: 422, condition: "Referenced adoption not APPROVED" }
  - { id: ERR_WHOLESALE_QUOTE_MISSING, http: 422, condition: "Wholesale variant selected but no active quote" }
  - { id: ERR_TERM_NOT_COMPLIANT, http: 422, condition: "Commission issue while term.compliance_posture == RESTRICTED" }
  - { id: ERR_TERM_BUDGET_EXCEEDED, http: 422, condition: "Commit would push committed landed cost above term buy budget" }

roles:
  - name: PlatformAdmin
    description: "Configures terms, publishers, agreements, titles, sections, faculty, students, wholesale quotes, and the test clock"
    identity: opaque
    exclusive_operations: ["terms create/open-adoption", "publishers/agreements/titles/faculty/students/sections create", "sections open", "enrollments create", "wholesale quotes create", "clock set"]
    shared_operations: ["read access to most resources"]
  - name: BookstoreManager
    description: "Operates the store: reviews adoptions, commits buy plans, locks sections, runs census billing, handles returns/overrides, pays or rejects buybacks"
    identity: opaque
    exclusive_operations: ["adoption review/approve/return", "buy-plan patch/commit/receive/cancel", "section lock", "term close-adoption/open-sales/census/open-buyback/close", "IA refund", "buyback pay/reject", "return override"]
    shared_operations: ["read access to operational resources"]
  - name: FinanceAdmin
    description: "Bursar/finance: aid adjustments and commission statement lifecycle; segregated from buy-plan committers"
    identity: opaque
    exclusive_operations: ["aid adjustments", "commission statement create/issue/settle"]
    shared_operations: ["read publishers, terms, buy plans"]
  - name: Faculty
    description: "Instructor; owns adoptions for own sections"
    identity: "entity_backed:Faculty"
    exclusive_operations: ["adoption create/patch/submit for own sections"]
    shared_operations: ["read terms, sections, titles, adoptions, buy-plan of own adoption"]
  - name: Student
    description: "Student buyer/seller; owns orders, IA charges, buyback tickets"
    identity: "entity_backed:Student"
    exclusive_operations: ["order placement", "own line returns", "IA opt-out/revoke", "buyback ticket create/accept", "own enrollment drop (pre-lock)"]
    shared_operations: ["read terms, sections, titles, own orders/charges/tickets/enrollments"]
