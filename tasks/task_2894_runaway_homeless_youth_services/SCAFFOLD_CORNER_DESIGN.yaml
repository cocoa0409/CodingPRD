              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { pri_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${pri_scr_id}/disposition"
              payload: { disposition: "ESCALATED", specialized_response_code: "LAW_ENFORCEMENT_LIAISON" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${pri_youth_id}", program_id: "${pri_program_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { pri_err_id: $.data.error_id }
          assert:
            - "the request returns HTTP 422 with error_id ERR_SCREENING_ESCALATED_BLOCKS_ACTION"
            - "the request does NOT return error_id ERR_AGE_OUTSIDE_PROGRAM_BAND"
