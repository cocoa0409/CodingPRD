  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: disbursement_requires_award_accepted
        grounds:
          - state_machines.AidDisbursement.SCHEDULED_to_DISBURSED
          - validations[priority=9]
          - errors[ERR_AWARD_NOT_ACCEPTED]
        distinguishing_aspect: |
          Entity pair AidDisbursement -> AidAward: a SCHEDULED disbursement on an OFFERED
          (never-accepted) loan award cannot be released; the award's state gates the
          disbursement's transition.
        test_recipe:
          setup:
            - "Term T1; enrollment charges 600000; SUBSIDIZED_LOAN 300000 created (stays OFFERED); disbursement 100000 SCHEDULED on it"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
            - call: "POST /r2t4/students"
              payload: { external_ref: "SL", full_name: "Stu L", email: "sl@x.edu" }
              as: RegistrarClerk
              captures: { sl: $.data.id }
            - call: "POST /r2t4/students/${sl}/enrollments"
              payload: { term_id: "${t1}", institutional_charges_cents: 600000 }
              as: RegistrarClerk
              captures: { el: $.data.id }
            - call: "POST /r2t4/enrollments/${el}/awards"
              payload: { program: "SUBSIDIZED_LOAN", amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { ll: $.data.id }
            - call: "POST /r2t4/awards/${ll}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
              captures: { dl1: $.data.id }
          trigger:
            - call: "POST /r2t4/disbursements/${dl1}/disburse"
              payload: {}
              as: FinancialAidOfficer
              captures: { err_l: $.data.error_id }
          assert:
            - "error_id == ERR_AWARD_NOT_ACCEPTED (http 409)"
            - "AidDisbursement.${dl1}.status remains SCHEDULED and disbursed_on remains null"

      - name: disbursement_blocked_by_active_withdrawal_case
        grounds:
          - state_machines.AidDisbursement.SCHEDULED_to_DISBURSED
