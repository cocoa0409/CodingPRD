            - "Employee.${emp_id}.ytd_medicare_wages_cents == 500000"
            - "PaycheckRun.${run_id}.status == VOID"

      - name: void_run_preserves_garnishment_balance_remaining
        grounds:
          - state_machines.PaycheckRun.PAID_to_VOID
          - state_machines.GarnishmentOrder.SATISFIED_to_ACTIVE
          - entities.GarnishmentOrder.fields.balance_remaining_cents
          - entities.GarnishmentDeduction
        distinguishing_aspect: |
          Conserved quantity: GarnishmentOrder.balance_remaining_cents (distinct from instance 1's
          Employee YTD fields). For any GarnishmentDeduction d on a Paycheck p, the forward
          PaycheckRun PAID subtracts d.amount_cents from GarnishmentOrder.balance_remaining_cents;
