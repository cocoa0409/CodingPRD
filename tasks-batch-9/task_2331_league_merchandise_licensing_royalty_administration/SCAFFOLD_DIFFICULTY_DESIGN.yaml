      - name: distribution_blocked_until_central_reports_leave_filed
        grounds:
          - validations.priority_37
          - errors.ERR_PENDING_REPORTS_BLOCK_DISTRIBUTION
          - state_machines.DistributionRun.OPEN_to_LOCKED
          - state_machines.RoyaltyReport.FILED_to_ACCEPTED
          - calculations.central_pool_distribution
        distinguishing_aspect: |
          The run's own state permits the lock (OPEN -> LOCKED), but the guard reads the
          status of every RoyaltyReport of the quarter on a CENTRAL agreement: while one
          is FILED the lock returns ERR_PENDING_REPORTS_BLOCK_DISTRIBUTION (409) and the
          run stays OPEN. Accepting that report clears the guard and the identical lock
          call succeeds, computing projected_pool_cents from the two accepted reports.
          A run-local state check would lock immediately and distribute an under-filled
          pool.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "club ATL ACTIVE with revenue_share_units 5"
            - "licensee LIC_V ACTIVE with a CENTRAL agreement AGR_V on category JERSEY (central_licensing_flag true, MG 1000000, required_advance 250000 fully paid, term 2026-01-01..2027-12-31)"
            - "one AUTHORIZED DEPARTMENT authorization covering 2026-01-01..2028-12-31"
            - "two reports on AGR_V: 2026Q1 (gross 6250000) FILED and ACCEPTED, and 2026Q2 (gross 6250000) FILED and left FILED"
            - "an OPEN DistributionRun for 2026Q2 with league_admin_rate_bps 800"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
