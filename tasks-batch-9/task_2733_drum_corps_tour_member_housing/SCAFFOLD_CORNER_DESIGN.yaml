              as: TourManager
              captures: { agreement_id: "$.data.id" }
            - call: "POST /facility-agreements/${agreement_id}/submit"
              payload: {}
              as: TourManager
            - call: "POST /facility-agreements/${agreement_id}/sign"
              payload: {}
              as: CorpsDirector
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_a_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Blair Osei", email: "blair@corps.test", date_of_birth: "2004-07-19", section: "PERCUSSION", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_b_id: "$.data.id" }
            - call: "GET /facility-agreements/${agreement_id}"
              as: MembershipCoordinator
              captures: { agreement_v1: "$.data.version" }
          trigger:
            - call: "POST /housing-assignments"
              payload: { facility_agreement_id: "${agreement_id}", member_id: "${member_a_id}", space_index: 5, check_in_date: "2027-05-10", check_out_date: "2027-05-20", expected_facility_agreement_version: "${agreement_v1}" }
              as: MembershipCoordinator
              captures: { housing_a_id: "$.data.id" }
            - call: "POST /housing-assignments"
              payload: { facility_agreement_id: "${agreement_id}", member_id: "${member_b_id}", space_index: 5, check_in_date: "2027-05-10", check_out_date: "2027-05-20", expected_facility_agreement_version: "${agreement_v1}" }
              as: MembershipCoordinator
              captures: { stale_err: "$.data.error_id" }
            - call: "GET /facility-agreements/${agreement_id}"
              as: MembershipCoordinator
              captures: { agreement_v2: "$.data.version" }
            - call: "POST /housing-assignments"
              payload: { facility_agreement_id: "${agreement_id}", member_id: "${member_b_id}", space_index: 5, check_in_date: "2027-05-10", check_out_date: "2027-05-20", expected_facility_agreement_version: "${agreement_v2}" }
              as: MembershipCoordinator
              captures: { housing_b_id: "$.data.id" }
          assert:
            - "${stale_err} == ERR_STALE_AGREEMENT_VERSION with HTTP 412 even though the agreement is still SIGNED and space 5 has 11 free bunks — the rejection is purely OCC"
            - "${agreement_v2} == ${agreement_v1} + 1 and the rejected write did not advance it"
            - "after the retry FacilityAgreement.${agreement_id}.occupied_bed_nights == 20 with exactly two ACTIVE assignments, HousingAssignment.${housing_a_id} and HousingAssignment.${housing_b_id}"
            - "FacilityAgreement.${agreement_id}.billable_bed_nights == 20 and billable_cents == 10000, and HostSchool.${school_id}.reserved_bed_nights == 20"
            - "FacilityAgreement.${agreement_id}.version == ${agreement_v2} + 1 after the retry — one increment per accepted assignment"

      - name: screening_expiry_threshold_releases_only_future_shifts
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Volunteer.CLEARED_to_EXPIRED
          - entities.Volunteer.fields.screening_expires_on
          - complexity_profile.complexity_layers.rate_threshold_triggers
        distinguishing_aspect: "The expiry threshold is strict (screening_expires_on < clock date), so a sweep run ON the expiry date must leave the volunteer CLEARED and the sweep one day later must expire them — and the release is itself conditional: only assignments whose shift_end_at is still in the future are released, so a past shift keeps its APPROVED record while assignment_count drops by exactly one."
