  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: mobility_grant_revoke_restores_voucher_expiration
        grounds:
          - state_machines.SpecialMobilityGrant.GRANTED_to_REVOKED
          - entities.Voucher.fields.expiration_date
          - entities.SpecialMobilityGrant.fields.term_extension_days
        distinguishing_aspect: |
          Conserved quantity = Voucher.expiration_date (time): granting a
          mobility incentive adds term_extension_days then revoking subtracts the
          same days, leaving expiration_date identical to its pre-grant value.
        test_recipe:
          setup:
            - "Voucher ISSUED 2026-06-01 with term 60 days (expiration 2026-07-31T00:00:00Z); a Special Mobility area target region exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
