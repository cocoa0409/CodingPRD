# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task_1595 (§1.9 Coverage Index)
# Breadth coverage of every testable claim in §1.1–§1.7 not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Section/claim_type vocabulary follows
# references/claim-extraction-guide.md. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: framework_create_defaults
        claim_type: defaults
        grounds: ["entities.CurriculumFramework"]
        distinguishing_aspect: "Omitting the optional status field yields the default ACTIVE; server-minted id is a bare UUID; version starts at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-ELA-68", subject_area: ENGLISH_LANGUAGE_ARTS, grade_band: GRADES_6_8, standards_required_count: 12, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_id: $.data.id, fw_status: $.data.status, fw_version: $.data.version }
          trigger:
            - call: "GET /frameworks/${fw_id}"
              as: CurriculumDirector
          assert:
            - "create response: status == ACTIVE (default applied), version == 1, standards_required_count == 12 echoed"
            - "GET returns the same entity with identical field values"
            - "id matches the bare-UUID shape (no type prefix)"

      - name: cycle_create_missing_required_returns_validation
        claim_type: required_fields
        grounds: ["entities.AdoptionCycle", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Missing required field framework_id is rejected with ERR_VALIDATION and the error envelope carries error_id + message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2027, district_enrollment: 100 }
              as: CurriculumDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (HTTP 400)"
            - "error envelope: response_type == 'error' and data.message is non-empty"

      - name: cycle_create_framework_mismatch_rejected
        claim_type: parent_relationships
        grounds: ["entities.AdoptionCycle.fields.framework_id", "errors[ERR_FRAMEWORK_MISMATCH]"]
        distinguishing_aspect: "A SCIENCE framework cannot back a MATHEMATICS cycle (referential rule), and a RETIRED framework is rejected identically."
        test_recipe:
          setup: ["frameworks FW-SCI (SCIENCE) and FW-RET (RETIRED) exist"]
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-SCI-K5", subject_area: SCIENCE, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_sci: $.data.id }
            - call: "POST /frameworks"
              payload: { code: "FW-OLD", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2020, status: RETIRED }
              as: DistrictAdmin
              captures: { fw_ret: $.data.id }
          trigger:
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2027, framework_id: "${fw_sci}", district_enrollment: 100 }
              as: CurriculumDirector
              captures: { err1: $.data.error_id }
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2027, framework_id: "${fw_ret}", district_enrollment: 100 }
              as: CurriculumDirector
              captures: { err2: $.data.error_id }
          assert:
            - "subject mismatch: error_id == ERR_FRAMEWORK_MISMATCH (409)"
            - "retired framework: error_id == ERR_FRAMEWORK_MISMATCH (409)"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "A path id that does not exist yields ERR_NOT_FOUND (404) regardless of entity type."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /materials/11111111-2222-3333-4444-555555555555"
              as: CurriculumDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (HTTP 404)"

      - name: material_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.InstructionalMaterial.fields.material_type", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "material_type outside {CORE, SUPPLEMENTAL} is rejected before any state logic."
        test_recipe:
          setup: ["cycle in DRAFT"]
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_id: $.data.id }
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2027, framework_id: "${fw_id}", district_enrollment: 100 }
              as: CurriculumDirector
              captures: { cy_id: $.data.id }
          trigger:
            - call: "POST /adoption-cycles/${cy_id}/materials"
              payload: { title: "Bad Enum", publisher_name: "PubA", material_type: "BOGUS" }
              as: CurriculumDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (HTTP 400)"

      - name: cycle_create_system_field_input_ignored
        claim_type: system_fields
        grounds: ["entities.AdoptionCycle", "response_envelope"]
        distinguishing_aspect: "Client-supplied system fields (status, version) in the create body are ignored; the server stamps status DRAFT and version 1."
        test_recipe:
          setup: ["framework exists"]
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_id: $.data.id }
          trigger:
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2027, framework_id: "${fw_id}", district_enrollment: 100, status: ACTIVE, version: 99 }
              as: CurriculumDirector
              captures: { cy_status: $.data.status, cy_version: $.data.version }
          assert:
            - "response status == DRAFT and version == 1 — client-supplied system fields were ignored"
            - "BudgetLedger exists immediately: GET /adoption-cycles/{id}/budget-ledger would return appropriation_total 0 (covered by mutation_visible_in_response)"

      - name: committee_vote_immutable
        claim_type: immutability
        grounds: ["entities.CommitteeVote"]
        distinguishing_aspect: "CommitteeVote declares common_fields: false — the cast response carries id + created_at but no version/updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup: ["challenge at COMMITTEE_REVIEW (material adopted at 2026-09-01, challenge filed and advanced)"]
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_id: $.data.id }
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2027, framework_id: "${fw_id}", district_enrollment: 100 }
              as: CurriculumDirector
              captures: { cy_id: $.data.id }
            - call: "POST /adoption-cycles/${cy_id}/materials"
              payload: { title: "Math Text", publisher_name: "PubA" }
              as: CurriculumDirector
              captures: { mat_id: $.data.id }
            - call: "POST /materials/${mat_id}/transitions"
              payload: { to_state: VETTED }
              as: InstructionalSpecialist
            - call: "POST /materials/${mat_id}/alignments"
              payload: { standard_code: "S1", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: ALIGNMENT_REVIEW }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: PILOT_OPEN }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/pilots"
              payload: { material_id: "${mat_id}", school_code: "SCH-A", starts_on: "2026-08-01", ends_on: "2026-08-15", teacher_count: 1 }
              as: CurriculumDirector
              captures: { pil_id: $.data.id }
            - call: "POST /pilots/${pil_id}/transitions"
              payload: { to_state: ACTIVE }
              as: CurriculumDirector
            - call: "POST /pilots/${pil_id}/reviews"
              payload: { pedagogy_score: 4, alignment_score: 4, usability_score: 4, equity_score: 4 }
              as: Teacher
              as_user_id: "t1"
            - call: "POST /pilots/${pil_id}/transitions"
              payload: { to_state: CLOSED }
              as: CurriculumDirector
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: SCORING }
              as: CurriculumDirector
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: PUBLIC_REVIEW }
              as: BoardSecretary
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: BOARD_PENDING }
              as: BoardSecretary
            - call: "POST /adoption-cycles/${cy_id}/board-decision"
              payload: { material_id: "${mat_id}", decision: ADOPT }
              as: BoardSecretary
            - call: "POST /challenge-cases"
              payload: { target_type: MATERIAL, target_id: "${mat_id}", grounds: ALIGNMENT_DISPUTE }
              as: CommunityMember
              as_user_id: "cm1"
              captures: { cc_id: $.data.id }
            - call: "POST /challenge-cases/${cc_id}/transitions"
              payload: { to_state: SCREENING }
              as: CurriculumDirector
            - call: "POST /challenge-cases/${cc_id}/transitions"
              payload: { to_state: COMMITTEE_REVIEW }
              as: CurriculumDirector
          trigger:
            - call: "POST /challenge-cases/${cc_id}/votes"
              payload: { vote: UPHOLD }
              as: CommitteeMember
              as_user_id: "v1"
              captures: { vote_id: $.data.id, vote_round: $.data.vote_round }
          assert:
            - "vote response carries id and created_at but no version and no updated_at (common_fields: false)"
            - "vote_round == 1 pinned from the challenge at cast time"

      - name: body_reference_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A body-referenced id (material_id on quote creation) that does not exist yields ERR_NOT_FOUND, same as a path id."
        test_recipe:
          setup: ["cycle in PILOT_OPEN with one VETTED material"]
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_id: $.data.id }
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2027, framework_id: "${fw_id}", district_enrollment: 100 }
              as: CurriculumDirector
              captures: { cy_id: $.data.id }
            - call: "POST /adoption-cycles/${cy_id}/materials"
              payload: { title: "Math Text", publisher_name: "PubA" }
              as: CurriculumDirector
              captures: { mat_id: $.data.id }
            - call: "POST /materials/${mat_id}/transitions"
              payload: { to_state: VETTED }
              as: InstructionalSpecialist
            - call: "POST /materials/${mat_id}/alignments"
              payload: { standard_code: "S1", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: ALIGNMENT_REVIEW }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: PILOT_OPEN }
              as: InstructionalSpecialist
          trigger:
            - call: "POST /adoption-cycles/${cy_id}/quotes"
              payload: { material_id: "99999999-8888-7777-6666-555555555555", publisher_name: "PubX", print_unit_price: 10.00, print_quantity: 5, digital_seat_rate: 0, digital_seat_count: 0, training_sessions: 0, license_years: 0 }
              as: ProcurementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (404) for the body-referenced material_id"

  - section: state_machines
    instances:
      - name: material_invalid_transition_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.InstructionalMaterial.transitions", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /materials/{id}/transitions offers only VETTED | REJECTED; requesting ADOPTED (board-decision territory) is rejected with ERR_INVALID_STATE and no fields change."
        test_recipe:
          setup: ["cycle DRAFT with one SUBMITTED material"]
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_id: $.data.id }
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2027, framework_id: "${fw_id}", district_enrollment: 100 }
              as: CurriculumDirector
              captures: { cy_id: $.data.id }
            - call: "POST /adoption-cycles/${cy_id}/materials"
              payload: { title: "Math Text", publisher_name: "PubA" }
              as: CurriculumDirector
              captures: { mat_id: $.data.id }
          trigger:
            - call: "POST /materials/${mat_id}/transitions"
              payload: { to_state: ADOPTED }
              as: InstructionalSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
            - "Material.${mat_id}.adoption_status remains SUBMITTED, version remains 1"

      - name: pilot_activate_before_start_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.PilotProgram.PLANNED_to_ACTIVE", "errors[ERR_PILOT_NOT_STARTED]"]
        distinguishing_aspect: "Activation before starts_on (per the logical clock) fails; activation exactly on starts_on succeeds (inclusive boundary)."
        test_recipe:
          setup: ["cycle PILOT_OPEN with VETTED material; pilot PLANNED with starts_on 2026-08-10 (default clock is 2026-08-01)"]
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_id: $.data.id }
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2027, framework_id: "${fw_id}", district_enrollment: 100 }
              as: CurriculumDirector
              captures: { cy_id: $.data.id }
            - call: "POST /adoption-cycles/${cy_id}/materials"
              payload: { title: "Math Text", publisher_name: "PubA" }
              as: CurriculumDirector
              captures: { mat_id: $.data.id }
            - call: "POST /materials/${mat_id}/transitions"
              payload: { to_state: VETTED }
              as: InstructionalSpecialist
            - call: "POST /materials/${mat_id}/alignments"
              payload: { standard_code: "S1", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: ALIGNMENT_REVIEW }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: PILOT_OPEN }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/pilots"
              payload: { material_id: "${mat_id}", school_code: "SCH-A", starts_on: "2026-08-10", ends_on: "2026-08-20", teacher_count: 2 }
              as: CurriculumDirector
              captures: { pil_id: $.data.id }
          trigger:
            - call: "POST /pilots/${pil_id}/transitions"
              payload: { to_state: ACTIVE }
              as: CurriculumDirector
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /pilots/${pil_id}/transitions"
              payload: { to_state: ACTIVE }
              as: CurriculumDirector
          assert:
            - "at 2026-08-01 (before starts_on): error_id == ERR_PILOT_NOT_STARTED (409)"
            - "at 2026-08-10 (exactly starts_on): activation succeeds; pilot status == ACTIVE; material adoption_status == PILOT_CANDIDATE"

      - name: not_adopted_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.AdoptionCycle.terminal_states", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A NOT_ADOPTED cycle rejects every further transition and child creation (quotes)."
        test_recipe:
          setup: ["cycle driven to BOARD_PENDING with one PILOT_CANDIDATE material, then board-decision REJECT"]
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_id: $.data.id }
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2027, framework_id: "${fw_id}", district_enrollment: 100 }
              as: CurriculumDirector
              captures: { cy_id: $.data.id }
            - call: "POST /adoption-cycles/${cy_id}/materials"
              payload: { title: "Math Text", publisher_name: "PubA" }
              as: CurriculumDirector
              captures: { mat_id: $.data.id }
            - call: "POST /materials/${mat_id}/transitions"
              payload: { to_state: VETTED }
              as: InstructionalSpecialist
            - call: "POST /materials/${mat_id}/alignments"
              payload: { standard_code: "S1", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: ALIGNMENT_REVIEW }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: PILOT_OPEN }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/pilots"
              payload: { material_id: "${mat_id}", school_code: "SCH-A", starts_on: "2026-08-01", ends_on: "2026-08-15", teacher_count: 1 }
              as: CurriculumDirector
              captures: { pil_id: $.data.id }
            - call: "POST /pilots/${pil_id}/transitions"
              payload: { to_state: ACTIVE }
              as: CurriculumDirector
            - call: "POST /pilots/${pil_id}/reviews"
              payload: { pedagogy_score: 2, alignment_score: 2, usability_score: 2, equity_score: 2 }
              as: Teacher
              as_user_id: "t1"
            - call: "POST /pilots/${pil_id}/transitions"
              payload: { to_state: CLOSED }
              as: CurriculumDirector
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: SCORING }
              as: CurriculumDirector
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: PUBLIC_REVIEW }
              as: BoardSecretary
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: BOARD_PENDING }
              as: BoardSecretary
            - call: "POST /adoption-cycles/${cy_id}/board-decision"
              payload: { material_id: "${mat_id}", decision: REJECT }
              as: BoardSecretary
          trigger:
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: PUBLIC_REVIEW }
              as: BoardSecretary
              captures: { err1: $.data.error_id }
            - call: "POST /adoption-cycles/${cy_id}/quotes"
              payload: { material_id: "${mat_id}", publisher_name: "PubA", print_unit_price: 10.00, print_quantity: 5, digital_seat_rate: 0, digital_seat_count: 0, training_sessions: 0, license_years: 0 }
              as: ProcurementOfficer
              captures: { err2: $.data.error_id }
          assert:
            - "board REJECT: cycle NOT_ADOPTED, Material.${mat_id}.adoption_status == REJECTED"
            - "further transition from the terminal state: error_id == ERR_INVALID_STATE"
            - "quote creation on a NOT_ADOPTED cycle: error_id == ERR_INVALID_STATE (cycle-status gate)"

      - name: review_withdraw_twice_rejected
        claim_type: idempotency
        grounds: ["state_machines.TeacherReview.SUBMITTED_to_WITHDRAWN", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Withdrawing an already-WITHDRAWN review fails — the compensating action cannot be applied twice."
        test_recipe:
          setup: ["ACTIVE pilot with one SUBMITTED review by teacher t1"]
          setup_api_calls:
            - call: "POST /frameworks"
              payload: { code: "FW-MATH-K5", subject_area: MATHEMATICS, grade_band: K_5, standards_required_count: 1, effective_year: 2026 }
              as: DistrictAdmin
              captures: { fw_id: $.data.id }
            - call: "POST /adoption-cycles"
              payload: { subject_area: MATHEMATICS, grade_band: K_5, school_year_start: 2027, framework_id: "${fw_id}", district_enrollment: 100 }
              as: CurriculumDirector
              captures: { cy_id: $.data.id }
            - call: "POST /adoption-cycles/${cy_id}/materials"
              payload: { title: "Math Text", publisher_name: "PubA" }
              as: CurriculumDirector
              captures: { mat_id: $.data.id }
            - call: "POST /materials/${mat_id}/transitions"
              payload: { to_state: VETTED }
              as: InstructionalSpecialist
            - call: "POST /materials/${mat_id}/alignments"
              payload: { standard_code: "S1", coverage_rating: FULL }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: ALIGNMENT_REVIEW }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/transitions"
              payload: { to_state: PILOT_OPEN }
              as: InstructionalSpecialist
            - call: "POST /adoption-cycles/${cy_id}/pilots"
              payload: { material_id: "${mat_id}", school_code: "SCH-A", starts_on: "2026-08-01", ends_on: "2026-08-15", teacher_count: 2 }
              as: CurriculumDirector
              captures: { pil_id: $.data.id }
            - call: "POST /pilots/${pil_id}/transitions"
              payload: { to_state: ACTIVE }
              as: CurriculumDirector
            - call: "POST /pilots/${pil_id}/reviews"
              payload: { pedagogy_score: 4, alignment_score: 4, usability_score: 4, equity_score: 4 }
              as: Teacher
              as_user_id: "t1"
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /reviews/${rev_id}/withdraw"
              as: Teacher
              as_user_id: "t1"
            - call: "POST /reviews/${rev_id}/withdraw"
              as: Teacher
              as_user_id: "t1"
              captures: { err: $.data.error_id }
          assert:
            - "first withdraw succeeds (status WITHDRAWN)"
            - "second withdraw: error_id == ERR_INVALID_STATE (409)"

      - name: quote_withdrawn_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.PublisherQuote.transitions", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A WITHDRAWN quote rejects evaluation, clarification, and a second withdrawal."
        test_recipe:
          setup: ["cycle PILOT_OPEN with VETTED material; quote Q in SUBMITTED, then WITHDRAWN"]
          setup_api_calls:
