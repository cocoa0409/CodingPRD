scenario: '1826. Potato Storage & Packing Shed (Idaho potato packer): field lot intake &

  bin assignment by variety, storage climate control & sprout-inhibitor

  application, grade-out & shrink accounting over storage season, pack

  size/carton configuration & customer spec, contract commitment vs open-market

  allocation, food-safety audit & wash-water controls, grower settlement by

  packout percentage, cull/processing channel

  '
domain_name: potato-storage-packing
api_prefix: /potato-shed
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
  - dual_variant_calculation
  - cascading_side_effects
  - derived_field_reconciliation
  - optimistic_concurrency
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
  - one_to_many
  - many_to_many
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
entities:
- name: Grower
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Grower display name
  - name: grower_code
    type: string
    source: input
    description: Unique grower accounting code
    constraints: unique across growers
  - name: region
    type: string
    source: input
    required: false
    description: Growing region label
- name: StorageShed
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Shed display name
  - name: posture
    type: enum
    source: computed
    default: NORMAL
    description: 'Derived food-safety posture: NORMAL | RESTRICTED | QUARANTINED; recomputed on every wash check and audit
      close'
    constraints: NORMAL | RESTRICTED | QUARANTINED
  - name: consecutive_wash_failures
    type: integer
    source: system
    default: 0
    description: Count of consecutive FAIL wash-water checks; reset to 0 by any PASS
  - name: wash_quarantine_flag
    type: boolean
    source: system
    default: false
    description: Set when a FAIL check has turbidity_ntu > QUARANTINE_TURBIDITY_NTU (8.0); cleared by the next PASS check
  - name: audit_failed_flag
    type: boolean
    source: system
    default: false
    description: Set when an audit closes FAIL; cleared when a later audit on the same shed closes PASS
- name: StorageBin
  parent: StorageShed
  common_fields: true
  fields:
  - name: shed_id
    type: string
    source: system
    description: FK -> StorageShed.id; owning shed
  - name: bin_code
    type: string
    source: input
    description: Bin code, unique within the shed
    constraints: unique per shed_id
  - name: capacity_cwt
    type: number
    source: input
    description: Physical capacity in hundredweight (2dp, > 0)
  - name: variety_lock
    type: enum
    source: system
    default: null
    description: RUSSET_BURBANK | RUSSET_NORKOTAH | RANGER_RUSSET | YUKON_GOLD | RED_LASODA | null; set to the first assigned
      lot's variety, auto-cleared to null when occupied_cwt returns to 0
  - name: occupied_cwt
    type: number
    source: computed
    default: 0
    description: Sum of available_cwt over FieldLots with bin_id == this bin and storage_status == BINNED
- name: FieldLot
  parent: Grower
  common_fields: true
  fields:
  - name: grower_id
    type: string
    source: system
    description: FK -> Grower.id; owning grower
  - name: bin_id
    type: string
    source: system
    default: null
    description: FK -> StorageBin.id; assigned bin (null while INTAKE)
  - name: variety
    type: enum
    source: input
    description: RUSSET_BURBANK | RUSSET_NORKOTAH | RANGER_RUSSET | YUKON_GOLD | RED_LASODA
  - name: harvest_date
    type: datetime
    source: input
    description: Harvest date (ISO 8601 date)
  - name: original_weight_cwt
    type: number
    source: input
    description: Scale weight at intake (2dp, > 0)
  - name: shrink_cwt
    type: number
    source: computed
    default: 0
    description: Cumulative shrink baseline = latest GradeOutAssessment.cumulative_shrink_cwt (re-baselined, never summed);
      remnant booked here at close
  - name: packed_total_cwt
    type: number
    source: computed
    default: 0
    description: Sum of PackRunLotDraw.packed_cwt over COMPLETED runs
  - name: cull_total_cwt
    type: number
    source: computed
    default: 0
    description: Sum of PackRunLotDraw.cull_cwt over COMPLETED runs
  - name: condemned_cwt
    type: number
    source: computed
    default: 0
    description: Weight condemned via quality-transition to CONDEMNED
  - name: processing_credit_cwt
    type: number
    source: computed
    default: 0
    description: Cull weight sent to processing channel (draws with cull_channel == PROCESSING plus condemn with diversion_channel
      == PROCESSING_CREDIT)
  - name: available_cwt
    type: number
    source: computed
    description: original_weight_cwt - shrink_cwt - packed_total_cwt - cull_total_cwt - condemned_cwt; weight-conservation
      invariant anchor
  - name: reserved_cwt
    type: number
    source: computed
    default: 0
    description: Sum of raw_cwt over active PackOrder reservations against this lot (orders in ALLOCATED or PACKING)
  - name: storage_status
    type: enum
    source: system
    default: INTAKE
    description: INTAKE -> BINNED -> CLOSED
    constraints: INTAKE | BINNED | CLOSED
  - name: quality_status
    type: enum
    source: system
    default: CLEAR
    description: 'Parallel dimension: CLEAR -> ON_HOLD -> CLEAR | CONDEMNED'
    constraints: CLEAR | ON_HOLD | CONDEMNED
  - name: binned_at
    type: datetime
    source: system
    default: null
    description: Logical-clock timestamp of bin assignment; storage-fee week count starts here
  - name: closed_at
    type: datetime
    source: system
    default: null
    description: Logical-clock timestamp of close; storage-fee week count ends here
  - name: last_inhibitor_applied_at
    type: datetime
    source: system
    default: null
    description: Timestamp of most recent sprout-inhibitor application
  - name: inhibitor_application_count
    type: integer
    source: system
    default: 0
    description: Number of sprout-inhibitor applications recorded
- name: GradeOutAssessment
  parent: FieldLot
  common_fields: false
  fields:
  - name: field_lot_id
    type: string
    source: system
    description: FK -> FieldLot.id; assessed lot
  - name: assessment_date
    type: datetime
    source: input
    description: Date the grade sample was pulled
  - name: us1_pct
    type: number
    source: input
    description: Sample percentage grading US No. 1 (0-100, 2dp)
  - name: us2_pct
    type: number
    source: input
    description: Sample percentage grading US No. 2 (0-100, 2dp)
  - name: cull_pct
    type: number
    source: input
    description: Sample percentage cull (0-100, 2dp); us1+us2+cull must equal 100.00
  - name: cumulative_shrink_cwt
    type: number
    source: input
    description: Cumulative weight loss since intake (NOT a per-period increment); must be >= previous assessment's cumulative
      value and <= original - packed - cull - condemned
  - name: packable_fraction
    type: number
    source: computed
    description: (us1_pct + us2_pct) / 100, 4dp; the lot-assessment expected packout fraction
- name: CustomerContract
  parent: null
  common_fields: true
  fields:
  - name: buyer_name
    type: string
    source: input
    description: Buyer display name
  - name: variety
    type: enum
    source: input
    description: Contracted variety (same enum as FieldLot.variety)
  - name: committed_volume_cwt
    type: number
    source: input
    description: Committed volume in PACKED cwt equivalent (2dp, > 0)
  - name: price_cents_per_cwt
    type: integer
    source: input
    description: Contract price per packed cwt, integer cents (> 0)
  - name: grade_min_us1_pct
    type: number
    source: input
    description: Minimum US No. 1 share accepted on packed output (0-100)
  - name: delivery_window_start
    type: datetime
    source: input
    description: Delivery window open (ISO 8601)
  - name: delivery_window_end
    type: datetime
    source: input
    description: Delivery window close (ISO 8601, must be > start); contract auto-settles when the logical clock passes this
  - name: priority_rank
    type: integer
    source: input
    description: Buyer priority label for reporting (not used in allocation ranking)
  - name: remaining_committed_cwt
    type: number
    source: computed
    description: committed_volume_cwt - allocated_active_cwt - packed_to_date_cwt
  - name: allocated_active_cwt
    type: number
    source: computed
    default: 0
    description: Sum of (requested_packed_cwt - packed_to_date_cwt) over this contract's orders in ALLOCATED or PACKING
  - name: packed_to_date_cwt
    type: number
    source: computed
    default: 0
    description: Sum of packed_to_date_cwt over this contract's orders
  - name: status
    type: enum
    source: system
    default: ACTIVE
    description: ACTIVE -> FULFILLED | SHORTFALLED at season settle
    constraints: ACTIVE | FULFILLED | SHORTFALLED
- name: PackOrder
  parent: null
  common_fields: true
  fields:
  - name: order_type
    type: enum
    source: input
    description: CONTRACT | OPEN_MARKET
  - name: contract_id
    type: string
    source: input
    default: null
    description: FK -> CustomerContract.id; required iff order_type == CONTRACT, null otherwise
  - name: shed_id
    type: string
    source: input
    description: FK -> StorageShed.id; shed whose pack line and storage pool serve this order
  - name: variety
    type: enum
    source: input
    description: Ordered variety; must match contract variety when contract_id present
  - name: pack_unit_weight_lbs
    type: number
    source: input
    description: 'Pack size/carton configuration: unit weight in lbs (> 0)'
  - name: grade_min_us1_pct
    type: number
    source: input
    description: 'Customer spec: minimum US No. 1 share across a completing run''s draws (0-100)'
  - name: requested_packed_cwt
    type: number
    source: input
    description: Requested volume in packed cwt (2dp, > 0)
  - name: allocation_policy
    type: enum
    source: input
    default: LOT_ASSESSMENT
    description: LOT_ASSESSMENT | SHED_BLEND; selects the expected_packout_fraction variant used to size raw draws
  - name: market_price_cents_per_cwt
    type: integer
    source: input
    default: null
    description: Sale price per packed cwt, integer cents; required iff order_type == OPEN_MARKET
  - name: packed_to_date_cwt
    type: number
    source: computed
    default: 0
    description: Sum of packed_cwt over this order's COMPLETED run draws
  - name: reservations
    type: array
    source: computed
    default: []
    description: 'Active raw reservations: [{field_lot_id, raw_cwt, packed_equiv_cwt}]; created by allocate, consumed by run
      close, released by cancel/de-allocation cascade'
  - name: status
    type: enum
    source: system
    default: REQUESTED
    description: REQUESTED -> ALLOCATED -> PACKING -> SHIPPED | ALLOCATED (partial fill) ; REQUESTED|ALLOCATED -> CANCELLED
    constraints: REQUESTED | ALLOCATED | PACKING | SHIPPED | CANCELLED
- name: PackRun
  parent: PackOrder
  common_fields: true
  fields:
  - name: pack_order_id
    type: string
    source: system
    description: FK -> PackOrder.id; order this run serves
  - name: scheduled_start
    type: datetime
    source: input
    description: Pack-line occupation window start (ISO 8601)
  - name: scheduled_end
    type: datetime
    source: input
    description: Pack-line occupation window end (must be > start)
  - name: status
    type: enum
    source: system
    default: SCHEDULED
    description: SCHEDULED -> COMPLETED | ABORTED
    constraints: SCHEDULED | COMPLETED | ABORTED
  - name: packed_total_cwt
    type: number
    source: computed
    default: 0
    description: Sum of draw packed_cwt recorded at close
  - name: cull_total_cwt
    type: number
    source: computed
    default: 0
    description: Sum of draw cull_cwt recorded at close
  - name: completed_at
    type: datetime
    source: system
    default: null
    description: Logical-clock close timestamp
- name: PackRunLotDraw
  parent: PackRun
  common_fields: false
  fields:
  - name: pack_run_id
    type: string
    source: system
    description: FK -> PackRun.id; owning run
  - name: field_lot_id
    type: string
    source: input
    description: FK -> FieldLot.id; lot drawn from
  - name: raw_drawn_cwt
    type: number
    source: input
    description: Raw cwt pulled from the lot (2dp, > 0); must be <= the order's reservation raw_cwt for this lot
  - name: packed_cwt
    type: number
    source: input
    description: Packed saleable cwt from this draw
  - name: us1_cwt
    type: number
    source: input
    description: US No. 1 portion of packed_cwt
  - name: us2_cwt
    type: number
    source: input
    description: US No. 2 portion of packed_cwt; us1_cwt + us2_cwt must equal packed_cwt
  - name: cull_cwt
    type: number
    source: input
    description: Culled cwt from this draw; raw_drawn_cwt must equal packed_cwt + cull_cwt
  - name: cull_channel
    type: enum
    source: input
    description: PROCESSING | WASTE; PROCESSING accrues processing credit to the grower pool
- name: WashWaterCheck
  parent: StorageShed
  common_fields: false
  fields:
  - name: shed_id
    type: string
    source: system
    description: FK -> StorageShed.id; checked shed
  - name: measured_at
    type: datetime
    source: input
    description: Measurement timestamp (ISO 8601)
  - name: turbidity_ntu
    type: number
    source: input
    description: Wash water turbidity in NTU (>= 0)
  - name: chlorine_ppm
    type: number
    source: input
    description: Free chlorine in ppm (>= 0)
  - name: water_temp_f
    type: number
    source: input
    description: Water temperature in Fahrenheit
  - name: result
    type: enum
    source: computed
    description: PASS iff turbidity_ntu <= 4.0 AND 50 <= chlorine_ppm <= 200 AND 45 <= water_temp_f <= 60, else FAIL
    constraints: PASS | FAIL
- name: FoodSafetyAudit
  parent: StorageShed
  common_fields: true
  fields:
  - name: shed_id
    type: string
    source: system
    description: FK -> StorageShed.id; audited shed
  - name: field_work_date
    type: datetime
    source: input
    description: Date of audit field work
  - name: status
    type: enum
    source: system
    default: FIELD_WORK
    description: FIELD_WORK -> PASSED | FAILED on close; a FAILED audit permits scheduling a follow-up audit (re-audit loop)
    constraints: FIELD_WORK | PASSED | FAILED
  - name: outcome
    type: enum
    source: system
    default: null
    description: PASS | FAIL recorded at close; null while FIELD_WORK
  - name: critical_findings
    type: integer
    source: system
    default: null
    description: Critical findings recorded at close
  - name: minor_findings
    type: integer
    source: system
    default: null
    description: Minor findings recorded at close
  - name: closed_at
    type: datetime
    source: system
    default: null
    description: Logical-clock close timestamp
- name: GrowerSettlement
  parent: Grower
  common_fields: true
  fields:
  - name: grower_id
    type: string
    source: system
    description: FK -> Grower.id; settled grower
  - name: season_label
    type: string
    source: input
    description: Storage-season label; unique per grower among non-SUPERSEDED settlements
  - name: status
    type: enum
    source: system
    default: PROVISIONAL
    description: PROVISIONAL -> FINALIZED -> PAID ; FINALIZED -> DISPUTED -> FINALIZED (re-finalize by different clerk) ;
      PROVISIONAL -> SUPERSEDED when a new settlement for the same season is created
    constraints: PROVISIONAL | FINALIZED | DISPUTED | PAID | SUPERSEDED
  - name: packed_cwt_basis
    type: number
    source: computed
    description: 'Variant-dependent packed basis: provisional uses latest-assessment estimates for unclosed lots plus actuals
      for CLOSED lots; final uses packed_total_cwt actuals only'
  - name: pool_price_cents
    type: number
    source: computed
    description: Volume-weighted realized pool price per packed cwt (see calculation pool_price)
  - name: gross_cents
    type: number
    source: computed
    description: round_half_up(packed_cwt_basis * pool_price_cents, 2)
  - name: storage_fees_cents
    type: number
    source: computed
    description: Sum over grower's lots of per-lot-rounded storage fee (see calculation storage_fee)
  - name: inhibitor_fees_cents
    type: number
    source: computed
    description: Sum over grower's lots of per-lot-rounded inhibitor fee
  - name: processing_credits_cents
    type: number
    source: computed
    description: Sum over grower's lots of per-lot-rounded processing credit
  - name: net_payable_cents
    type: number
    source: computed
    description: gross_cents - storage_fees_cents - inhibitor_fees_cents + processing_credits_cents; may be negative (grower
      owes the shed)
  - name: finalized_by_clerk_id
    type: string
    source: system
    default: null
    description: X-User-ID of the SettlementClerk who performed the most recent finalize; segregation-of-duties anchor for
      dispute re-finalize
  - name: paid_at
    type: datetime
    source: system
    default: null
    description: Logical-clock payment timestamp
state_machines:
- entity: StorageShed
  note: 'Derived posture machine (posture_driven): posture is recomputed after every wash check and every audit close from
    consecutive_wash_failures, wash_quarantine_flag, audit_failed_flag. Gates: bin-assignment requires NORMAL; allocation
    excludes lots in QUARANTINED sheds; run creation blocked when QUARANTINED and wash-validity window tightens 12h -> 4h
    when RESTRICTED.'
  initial_state: NORMAL
  terminal_states: []
  transitions:
  - from: NORMAL
    to: RESTRICTED
    trigger: 'system: POST /sheds/{id}/wash-water-checks leaves consecutive_wash_failures >= 2 (and no quarantine condition)'
    actor: system
    preconditions:
    - latest two or more consecutive wash checks FAIL
    - no severe-turbidity FAIL
    - audit_failed_flag == false
    side_effects:
    - posture := RESTRICTED
    - new bin assignments into this shed rejected while RESTRICTED
  - from: NORMAL
    to: QUARANTINED
    trigger: 'system: wash check FAIL with turbidity_ntu > 8.0, or audit closes FAIL'
    actor: system
    preconditions:
    - FAIL check turbidity_ntu > QUARANTINE_TURBIDITY_NTU (8.0) OR audit outcome == FAIL
    side_effects:
    - posture := QUARANTINED (wash_quarantine_flag or audit_failed_flag set)
    - every SCHEDULED PackRun whose order's shed is this shed auto-transitions to ABORTED; each such run's PackOrder PACKING
      -> ALLOCATED (reservations retained)
    - every FieldLot in this shed's bins with quality_status == CLEAR transitions to ON_HOLD
    - 'for each PackOrder holding a reservation on a newly held lot: release that lot''s reservations (lot.reserved_cwt decremented),
      then coverage recheck: if sum(remaining reservations.packed_equiv_cwt) < requested_packed_cwt - packed_to_date_cwt,
      release ALL of the order''s reservations and set status ALLOCATED|PACKING -> REQUESTED; for CONTRACT orders restore
      contract.allocated_active_cwt -= (requested - packed_to_date) and remaining_committed_cwt += (requested - packed_to_date)
      on full reset, or -= / += the released packed_equiv_cwt on partial release'
  - from: RESTRICTED
    to: QUARANTINED
    trigger: 'system: same quarantine conditions as NORMAL -> QUARANTINED'
    actor: system
    preconditions:
    - FAIL check turbidity_ntu > 8.0 OR audit outcome == FAIL
    side_effects:
    - same cascade as NORMAL -> QUARANTINED
  - from: RESTRICTED
    to: NORMAL
    trigger: 'system: a wash check PASSes, bringing consecutive_wash_failures to 0'
    actor: system
    preconditions:
    - PASS check recorded
    - no quarantine flags set
    side_effects:
    - posture := NORMAL
    - consecutive_wash_failures := 0
  - from: QUARANTINED
    to: NORMAL
    trigger: 'system: wash_quarantine_flag cleared by a later PASS AND audit_failed_flag cleared by a later audit closing
      PASS (both flags clear required if both set)'
    actor: system
    preconditions:
    - wash_quarantine_flag == false
    - audit_failed_flag == false
    - consecutive_wash_failures < 2
    side_effects:
    - posture := NORMAL
    - lots placed ON_HOLD by quarantine remain ON_HOLD until QualityAssuranceManager releases them
- entity: FieldLot
  note: 'Parallel state dimensions: storage_status (linear) x quality_status (cyclic with terminal CONDEMNED) evolve independently
    on the same row.'
  initial_state: INTAKE
  terminal_states:
  - CLOSED
  transitions:
  - from: INTAKE
    to: BINNED
    trigger: POST /field-lots/{id}/bin-assignment
    actor: IntakeClerk
    preconditions:
    - lot.storage_status == INTAKE (else ERR_LOT_INVALID_STATE)
    - bin exists (ERR_BIN_NOT_FOUND) and bin.shed posture == NORMAL (ERR_SHED_RESTRICTED / ERR_SHED_QUARANTINED)
    - bin.variety_lock is null or == lot.variety (ERR_BIN_VARIETY_MISMATCH)
    - bin.occupied_cwt + lot.available_cwt <= bin.capacity_cwt (ERR_BIN_CAPACITY_EXCEEDED)
    side_effects:
    - lot.bin_id := bin; lot.binned_at := current logical clock; lot.version += 1
    - bin.variety_lock := lot.variety if null; bin.occupied_cwt += lot.available_cwt (derived)
  - from: BINNED
    to: CLOSED
    trigger: 'system: available_cwt reaches 0 (via run completion, condemn, or assessment re-baseline); or POST /field-lots/{id}/close
      when available_cwt <= REMNANT_MAX_CWT (5.0)'
    actor: system | StorageManager
    preconditions:
    - 'manual close: available_cwt <= 5.0 (else ERR_LOT_REMNANT_TOO_LARGE)'
    side_effects:
    - 'manual close books the remnant as shrink: shrink_cwt := original_weight_cwt - packed_total_cwt - cull_total_cwt - condemned_cwt'
    - storage_status := CLOSED; closed_at := current logical clock; version += 1
    - bin.occupied_cwt recomputed; if 0 then bin.variety_lock := null
  - from: CLEAR
    to: ON_HOLD
    trigger: 'POST /field-lots/{id}/quality-transition {to_status: ON_HOLD} or quarantine cascade'
    actor: QualityAssuranceManager | system
    preconditions:
    - lot.storage_status == BINNED (ERR_LOT_INVALID_STATE)
    - lot.quality_status == CLEAR
    side_effects:
    - quality_status := ON_HOLD; version += 1
    - 'for each PackOrder holding a reservation on this lot: release this lot''s reservation (reserved_cwt -= raw_cwt); coverage
      recheck per order (see shed quarantine cascade step 4)'
  - from: ON_HOLD
    to: CLEAR
    trigger: 'POST /field-lots/{id}/quality-transition {to_status: CLEAR}'
    actor: QualityAssuranceManager
    preconditions:
    - lot.quality_status == ON_HOLD
    - lot's shed posture != QUARANTINED (ERR_SHED_QUARANTINED)
    side_effects:
    - quality_status := CLEAR; version += 1
  - from: ON_HOLD
    to: CONDEMNED
    trigger: 'POST /field-lots/{id}/quality-transition {to_status: CONDEMNED, diversion_channel}'
    actor: QualityAssuranceManager
    preconditions:
    - lot.quality_status == ON_HOLD (CONDEMNED is unreachable directly from CLEAR -> ERR_LOT_INVALID_STATE)
    - diversion_channel present and in {PROCESSING_CREDIT, WASTE} (ERR_INVALID_REQUEST)
    side_effects:
    - condemned_cwt += available_cwt; if diversion_channel == PROCESSING_CREDIT then processing_credit_cwt += available_cwt
    - available_cwt := 0 -> storage_status := CLOSED (auto), closed_at set; version += 1
    - reservation-release cascade identical to CLEAR -> ON_HOLD (idempotent when none remain)
    - bin.occupied_cwt recomputed; if 0 then bin.variety_lock := null
- entity: CustomerContract
  initial_state: ACTIVE
  terminal_states:
  - FULFILLED
  - SHORTFALLED
  transitions:
  - from: ACTIVE
    to: FULFILLED
    trigger: 'system: POST /_clock/set_current_utc advances the logical clock past delivery_window_end with packed_to_date_cwt
      >= committed_volume_cwt'
    actor: system
    preconditions:
    - current logical clock > delivery_window_end
    - packed_to_date_cwt >= committed_volume_cwt
    side_effects:
    - status := FULFILLED
    - any remaining allocated_active_cwt stays reserved until its orders cancel or ship
  - from: ACTIVE
    to: SHORTFALLED
    trigger: 'system: POST /_clock/set_current_utc advances past delivery_window_end with packed_to_date_cwt < committed_volume_cwt'
    actor: system
    preconditions:
    - current logical clock > delivery_window_end
    - packed_to_date_cwt < committed_volume_cwt
    side_effects:
    - status := SHORTFALLED
- entity: PackOrder
  initial_state: REQUESTED
  terminal_states:
  - SHIPPED
  - CANCELLED
  transitions:
  - from: REQUESTED
    to: ALLOCATED
    trigger: POST /pack-orders/{id}/allocate (full allocation of requested_packed_cwt)
    actor: SalesManager
    preconditions:
    - order.status == REQUESTED (ERR_ORDER_INVALID_STATE)
    - 'CONTRACT orders: contract exists, contract.status == ACTIVE (ERR_CONTRACT_INVALID_STATE), requested_packed_cwt <= contract.remaining_committed_cwt
      (ERR_COMMITMENT_EXCEEDED)'
    - 'OPEN_MARKET orders: requested_packed_cwt <= open-market cap for (variety, shed) (ERR_OPEN_MARKET_CAP_EXCEEDED)'
    - 'eligible pool covers the full request (else ERR_INSUFFICIENT_ALLOCATION_POOL, atomic: no reservations created)'
    side_effects:
    - reservations created per allocation_waterfall; each lot.reserved_cwt += raw_cwt
    - 'CONTRACT: contract.remaining_committed_cwt -= requested_packed_cwt; contract.allocated_active_cwt += requested_packed_cwt'
    - order.status := ALLOCATED; version += 1
  - from: ALLOCATED
    to: ALLOCATED
    trigger: POST /pack-orders/{id}/allocate (top-up after partial fill or partial reservation release)
    actor: SalesManager
    preconditions:
    - order.status == ALLOCATED
    - top-up need = requested_packed_cwt - packed_to_date_cwt - sum(reservations.packed_equiv_cwt) > 0 and coverable (else
      ERR_INSUFFICIENT_ALLOCATION_POOL)
    side_effects:
    - additional reservations appended; lot.reserved_cwt increased accordingly
    - contract amounts unchanged (commitment already debited at first allocation)
  - from: ALLOCATED
    to: PACKING
    trigger: POST /pack-orders/{id}/pack-runs
    actor: PackLineSupervisor
    preconditions:
    - order.status == ALLOCATED (ERR_ORDER_INVALID_STATE)
    - order.shed posture != QUARANTINED (ERR_SHED_QUARANTINED)
    - the shed's most recent PASS wash-water check has measured_at within WASH_VALIDITY_HOURS_NORMAL (12h) of the current
      logical clock, or WASH_VALIDITY_HOURS_RESTRICTED (4h) when posture == RESTRICTED (else ERR_WASH_CHECK_STALE); FAIL checks
      recorded after that PASS do not extend freshness, and if no PASS exists the shed is stale
    - pack-line schedule conflict check passes (ERR_LINE_SCHEDULE_CONFLICT)
    side_effects:
    - PackRun created SCHEDULED
    - order.status := PACKING; version += 1
  - from: PACKING
    to: SHIPPED
    trigger: 'POST /pack-runs/{id}/close {outcome: COMPLETED} with packed_to_date_cwt reaching requested_packed_cwt'
    actor: PackLineSupervisor
    preconditions:
    - run.status == SCHEDULED
    - draws balanced and within reservations
    - aggregate us1 share across draws >= order.grade_min_us1_pct (ERR_GRADE_SPEC_NOT_MET)
    side_effects:
    - 'per draw: lot.packed_total_cwt += packed_cwt; lot.cull_total_cwt += cull_cwt; lot.available_cwt -= raw_drawn_cwt; lot.reserved_cwt
      -= raw_drawn_cwt; reservation for that lot consumed; if cull_channel == PROCESSING then lot.processing_credit_cwt +=
      cull_cwt'
    - lot with available_cwt == 0 auto-closes (BINNED -> CLOSED)
    - order.packed_to_date_cwt += sum(packed); run.status := COMPLETED with totals; order.status := SHIPPED
    - 'CONTRACT: contract.packed_to_date_cwt += sum(packed); contract.allocated_active_cwt -= sum(packed)'
  - from: PACKING
    to: ALLOCATED
    trigger: 'POST /pack-runs/{id}/close {outcome: COMPLETED} with packed_to_date_cwt < requested_packed_cwt (partial fill),
      or {outcome: ABORTED}'
    actor: PackLineSupervisor
    preconditions:
    - run.status == SCHEDULED (ERR_RUN_INVALID_STATE)
    side_effects:
    - 'partial fill: same per-draw effects as SHIPPED path; order.status := ALLOCATED (cycle; may re-allocate top-up or run
      again)'
    - 'abort: no weight or contract changes; reservations retained by the order; order.status := ALLOCATED (compensating action
      for run creation)'
  - from: ALLOCATED
    to: REQUESTED
    trigger: 'system: reservation-release cascade (lot hold, condemn, or shed quarantine) drops covered packed_equiv below
      remaining need'
    actor: system
    preconditions:
    - sum(reservations.packed_equiv_cwt) < requested_packed_cwt - packed_to_date_cwt after the cascade release
    side_effects:
    - ALL remaining reservations released (each lot.reserved_cwt -= raw_cwt)
    - 'CONTRACT: contract.allocated_active_cwt -= (requested_packed_cwt - packed_to_date_cwt); contract.remaining_committed_cwt
      += (requested_packed_cwt - packed_to_date_cwt)'
    - order.status := REQUESTED; version += 1
  - from: REQUESTED
    to: CANCELLED
    trigger: POST /pack-orders/{id}/cancel
    actor: SalesManager
    preconditions:
    - order.status in {REQUESTED, ALLOCATED} (ERR_ORDER_INVALID_STATE)
    side_effects:
    - status := CANCELLED
    - no reservations exist to release
  - from: ALLOCATED
    to: CANCELLED
    trigger: POST /pack-orders/{id}/cancel
    actor: SalesManager
    preconditions:
    - order.status in {REQUESTED, ALLOCATED}
    side_effects:
    - 'all reservations released: each lot.reserved_cwt -= raw_cwt'
    - 'CONTRACT: contract.allocated_active_cwt -= (requested_packed_cwt - packed_to_date_cwt); contract.remaining_committed_cwt
      += (requested_packed_cwt - packed_to_date_cwt)'
    - order.status := CANCELLED; version += 1
- entity: PackRun
  initial_state: SCHEDULED
  terminal_states:
  - COMPLETED
  - ABORTED
  transitions:
  - from: SCHEDULED
    to: COMPLETED
    trigger: 'POST /pack-runs/{id}/close {outcome: COMPLETED, draws: [...]}'
    actor: PackLineSupervisor
    preconditions:
    - run.status == SCHEDULED (ERR_RUN_INVALID_STATE)
    - draws non-empty; each draw.field_lot_id has an active reservation on this order and raw_drawn_cwt <= reservation raw_cwt
      (ERR_RUN_DRAW_EXCEEDS_RESERVATION)
    - 'per draw: raw_drawn_cwt == packed_cwt + cull_cwt AND us1_cwt + us2_cwt == packed_cwt (ERR_RUN_DRAW_IMBALANCE)'
    - sum(us1_cwt) / sum(packed_cwt) * 100 >= order.grade_min_us1_pct (ERR_GRADE_SPEC_NOT_MET)
    side_effects:
    - see PackOrder PACKING -> SHIPPED / PACKING -> ALLOCATED side effects
    - run.packed_total_cwt / cull_total_cwt set; completed_at := current logical clock
  - from: SCHEDULED
    to: ABORTED
    trigger: 'POST /pack-runs/{id}/close {outcome: ABORTED} or quarantine cascade'
    actor: PackLineSupervisor | system
    preconditions:
    - run.status == SCHEDULED (ERR_RUN_INVALID_STATE)
    side_effects:
    - no draws recorded; order PACKING -> ALLOCATED; reservations and lot weights unchanged
- entity: FoodSafetyAudit
  initial_state: FIELD_WORK
  terminal_states:
  - PASSED
  - FAILED
  note: 'Re-audit loop is cross-instance: a FAILED audit keeps shed.audit_failed_flag set until a NEW audit on the same shed
    closes PASS.'
  transitions:
  - from: FIELD_WORK
    to: PASSED
    trigger: 'POST /audits/{id}/close {outcome: PASS}'
    actor: QualityAssuranceManager
    preconditions:
    - audit.status == FIELD_WORK (ERR_AUDIT_INVALID_STATE)
    side_effects:
    - audit_failed_flag := false on shed
    - shed posture recomputed (may clear QUARANTINED -> NORMAL)
  - from: FIELD_WORK
    to: FAILED
    trigger: 'POST /audits/{id}/close {outcome: FAIL}'
    actor: QualityAssuranceManager
    preconditions:
    - audit.status == FIELD_WORK (ERR_AUDIT_INVALID_STATE)
    side_effects:
    - audit_failed_flag := true on shed
    - shed posture recomputed -> QUARANTINED with full quarantine cascade (see StorageShed machine)
- entity: GrowerSettlement
  initial_state: PROVISIONAL
  terminal_states:
  - PAID
  - SUPERSEDED
  transitions:
  - from: PROVISIONAL
    to: FINALIZED
    trigger: POST /settlements/{id}/finalize
    actor: SettlementClerk
    preconditions:
    - settlement.status == PROVISIONAL (ERR_SETTLEMENT_INVALID_STATE)
    - every FieldLot of the grower has storage_status == CLOSED (ERR_SETTLEMENT_LOTS_NOT_CLOSED)
    side_effects:
    - final variant of grower_settlement recomputed (actual packout basis)
    - finalized_by_clerk_id := X-User-ID
    - version += 1
  - from: PROVISIONAL
    to: SUPERSEDED
    trigger: 'system: POST /growers/{id}/settlements for the same season_label'
    actor: system
    preconditions:
    - existing settlement for (grower, season_label) is PROVISIONAL
    side_effects:
    - prior settlement status := SUPERSEDED; new PROVISIONAL settlement created
  - from: FINALIZED
    to: DISPUTED
    trigger: POST /settlements/{id}/dispute
    actor: Grower
    preconditions:
    - settlement.status == FINALIZED (ERR_SETTLEMENT_INVALID_STATE)
    - X-User-ID == settlement.grower_id (ERR_INSUFFICIENT_PERMISSIONS)
    side_effects:
    - status := DISPUTED; version += 1
  - from: DISPUTED
    to: FINALIZED
    trigger: POST /settlements/{id}/finalize (re-finalize)
    actor: SettlementClerk
    preconditions:
    - settlement.status == DISPUTED
    - 'X-User-ID != finalized_by_clerk_id (segregation of duties: ERR_SOD_REFINALIZE_CLERK)'
    - every FieldLot of the grower still CLOSED (ERR_SETTLEMENT_LOTS_NOT_CLOSED)
    side_effects:
    - final variant recomputed
    - finalized_by_clerk_id := X-User-ID (new clerk)
    - version += 1
  - from: FINALIZED
    to: PAID
    trigger: POST /settlements/{id}/pay
    actor: SettlementClerk
    preconditions:
    - settlement.status == FINALIZED (ERR_SETTLEMENT_INVALID_STATE)
    side_effects:
    - status := PAID; paid_at := current logical clock; version += 1
concurrency_rules:
- rule_id: assessment-create-stale-lot
  parent_entity: FieldLot
  write_endpoint: POST /field-lots/{id}/assessments
  occ_field: expected_field_lot_version
  description: 'Creating a GradeOutAssessment against a FieldLot whose version has

    advanced since the client last observed it is rejected. A newly created

    assessment supersedes the prior one as the lot''s shrink/packout baseline,

    so a writer holding a stale lot version would silently re-baseline from

    outdated weight state.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: settlement-create-stale-grower
  parent_entity: Grower
  write_endpoint: POST /growers/{id}/settlements
  occ_field: expected_grower_version
  description: 'Creating a GrowerSettlement against a Grower whose version has advanced

    since the client last observed it is rejected. Creating a settlement for

    a season legitimately supersedes the prior PROVISIONAL settlement for

    that season, so a writer holding a stale grower version would supersede

    a settlement it never observed.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: expected_packout_fraction
  trigger: POST /pack-orders/{id}/allocate (sizing each raw reservation)
  algorithm: forward_looking
  formula: "LOT_ASSESSMENT variant (per lot):\n  f_lot = latest GradeOutAssessment.packable_fraction = (us1_pct + us2_pct)\
    \ / 100\n  if the lot has no assessment, f_lot = DEFAULT_BLEND_PACKOUT_FRACTION (0.75)\nSHED_BLEND variant (uniform across\
    \ all lots in the order's shed):\n  f = sum(PackRunLotDraw.packed_cwt over COMPLETED runs in this shed)\n      / sum(PackRunLotDraw.raw_drawn_cwt\
    \ over COMPLETED runs in this shed)\n  if no COMPLETED run exists in this shed, f = DEFAULT_BLEND_PACKOUT_FRACTION (0.75)\n"
  input_set: 'BINNED lots; assessments: latest per lot by (assessment_date, created_at); draws: COMPLETED runs only, ABORTED
    excluded'
  constants:
    DEFAULT_BLEND_PACKOUT_FRACTION: 0.75
  precision: fraction carried at 4dp; reserved raw_cwt rounded to 2dp round_half_up with the min() guard below
  variants:
  - name: lot_assessment
    when: order.allocation_policy == LOT_ASSESSMENT
    difference: per-lot fraction from that lot's latest assessment; two lots with different grade-outs get different draw
      multipliers
  - name: shed_blend
    when: order.allocation_policy == SHED_BLEND
    difference: single realized shed-wide fraction applied to every lot; identical inputs to LOT_ASSESSMENT yield different
      reservation raw_cwt
- name: allocation_waterfall
  trigger: POST /pack-orders/{id}/allocate
  algorithm: waterfall_allocation
  formula: "need_packed = requested_packed_cwt - packed_to_date_cwt - sum(reservations.packed_equiv_cwt)\nEligibility (candidate\
    \ set): lot.storage_status == BINNED AND lot.quality_status == CLEAR\n  AND lot.variety == order.variety AND lot's bin.shed_id\
    \ == order.shed_id\n  AND that shed's posture != QUARANTINED AND allocatable_lot = available_cwt - reserved_cwt > 0\n\
    Ranking: harvest_date ASC, tie-break created_at ASC (never id)\nPer lot in rank order:\n  cover_lot  = floor2(allocatable_lot\
    \ * f)            # f = expected_packout_fraction per order policy\n  take_packed = min(need_remaining, cover_lot)\n \
    \ raw_lot    = min(allocatable_lot, round_half_up(take_packed / f, 2))\n  append reservation {field_lot_id, raw_cwt: raw_lot,\
    \ packed_equiv_cwt: take_packed}\n  need_remaining -= take_packed\nPre-flight (atomicity): if sum over pool of cover_lot\
    \ < need_packed -> ERR_INSUFFICIENT_ALLOCATION_POOL, no reservations written\nEmpty pool -> ERR_INSUFFICIENT_ALLOCATION_POOL\n"
  input_set: all FieldLots (filtered by eligibility above); contract state for CONTRACT orders
  precision: 2dp cwt, floor for cover_lot, round_half_up for raw_lot with min(allocatable) guard
  constants:
    DEFAULT_BLEND_PACKOUT_FRACTION: 0.75
- name: open_market_cap
  trigger: POST /pack-orders/{id}/allocate for order_type == OPEN_MARKET
  algorithm: aggregation
  formula: "cap_packed_cwt = max(0,\n    sum over eligible lots (as in allocation_waterfall, same shed + variety)\n      \
    \  of round_half_up(allocatable_lot * f_assessment_lot, 2)   # cap ALWAYS uses lot-assessment basis\n  - sum over ACTIVE\
    \ CustomerContracts with contract.variety == order.variety\n        of remaining_committed_cwt)\nif requested_packed_cwt\
    \ > cap_packed_cwt -> ERR_OPEN_MARKET_CAP_EXCEEDED\nBoundary: requested_packed_cwt == cap_packed_cwt is allowed\n"
  input_set: eligible BINNED/CLEAR lots in the order's shed of the order's variety; contracts with status == ACTIVE only (FULFILLED/SHORTFALLED
    excluded)
  precision: 2dp cwt round_half_up per lot before summation
- name: pool_price
  trigger: GrowerSettlement create (provisional) and finalize (final)
  algorithm: aggregation
  formula: "Evaluation order is pinned (circular-looking dependency resolved):\n  step 1: pool aggregates are computed FIRST\
    \ from finalized sales only —\n          SHIPPED PackOrders system-wide:\n            pool_price_cents = round_half_up(\n\
    \                sum(CONTRACT orders: packed_to_date_cwt * contract.price_cents_per_cwt)\n              + sum(OPEN_MARKET\
    \ orders: packed_to_date_cwt * market_price_cents_per_cwt)\n              / sum(packed_to_date_cwt over all SHIPPED orders),\
    \ 2)\n  step 2: only then is the grower's packed_cwt_basis multiplied by that price.\nA grower's own SHIPPED orders DO\
    \ contribute to the pool that prices that\nsame grower's settlement; PROVISIONAL settlements never feed the pool.\nFallback\
    \ when no SHIPPED order exists (CONTRACT_BLEND):\n  pool_price_cents = round_half_up(\n      sum over ACTIVE contracts\
    \ of (committed_volume_cwt * price_cents_per_cwt)\n      / sum over ACTIVE contracts of committed_volume_cwt, 2)\nFallback\
    \ when also no ACTIVE contract exists: pool_price_cents = 0.\n"
  input_set: 'PackOrders with status == SHIPPED only; fallback: CustomerContracts with status == ACTIVE only'
  precision: 2dp cents, round_half_up
- name: grower_settlement
  trigger: POST /growers/{id}/settlements (provisional variant) and POST /settlements/{id}/finalize (final variant)
  algorithm: aggregation
  formula: "packed_cwt_basis:\n  provisional: sum over grower's lots of\n    (packed_total_cwt + (available_cwt * f_assessment_lot))\
    \ for non-CLOSED lots   # estimate of unclosed remainder\n    + packed_total_cwt for CLOSED lots\n    each lot term round_half_up\
    \ 2dp before summing\n  final: sum over grower's lots of packed_total_cwt   # requires all lots CLOSED\ngross_cents  =\
    \ round_half_up(packed_cwt_basis * pool_price_cents, 2)\nstorage_fees_cents  = sum of per-lot round_half_up(storage fee,\
    \ 2)   # see storage_fee\ninhibitor_fees_cents = sum of per-lot round_half_up(8 * original_weight_cwt * inhibitor_application_count,\
    \ 2)\nprocessing_credits_cents = sum of per-lot round_half_up(150 * processing_credit_cwt, 2)\nnet_payable_cents = gross_cents\
    \ - storage_fees_cents - inhibitor_fees_cents + processing_credits_cents\n(no floor: a negative net means the grower owes\
    \ the shed)\n"
  input_set: 'provisional: all of the grower''s FieldLots in any storage_status; final: all of the grower''s FieldLots (all
    must be CLOSED)'
  constants:
    INHIBITOR_FEE_CENTS_PER_CWT: 8
    PROCESSING_CREDIT_CENTS_PER_CWT: 150
  precision: 2dp cents, round_half_up; per-lot lines rounded THEN summed (pinned order — see storage_fee)
  variants:
  - name: provisional
    when: settlement creation; lots may still be BINNED
    difference: unclosed lots contribute available_cwt * latest-assessment packable fraction instead of actuals; pool price
      may still be CONTRACT_BLEND fallback
  - name: final
    when: finalize; every lot CLOSED
    difference: actual packed_total_cwt only and realized pool price; identical lots yield a different net_payable_cents than
      provisional
- name: storage_fee
  trigger: inside grower_settlement
  algorithm: aggregation
  formula: "Per lot:\n  weeks = completed whole weeks in storage\n    provisional: floor((settlement clock time - binned_at)\
    \ / 7 days); 0 if not yet binned\n    final:       floor((closed_at - binned_at) / 7 days)\n  fee_lot_cents = round_half_up(12.5\
    \ * original_weight_cwt * weeks, 2)\nRounding order is PINNED: round each lot's fee to 2dp first, then sum.\n(Sum-then-round\
    \ is forbidden: with rate 12.5 the two orders diverge by\n>= 1 cent whenever an odd number of lots lands on a .125-cent\
    \ product.)\nBoundary: exactly 14 days in storage == 2 weeks (floor of an exact integer).\n"
  input_set: grower's FieldLots per the invoking grower_settlement variant
  constants:
    STORAGE_FEE_CENTS_PER_CWT_WEEK: 12.5
  precision: 2dp cents per lot, round_half_up, then integer-cent summation
- name: shrink_reconciliation
  trigger: POST /field-lots/{id}/assessments and POST /field-lots/{id}/close
  algorithm: chronological
  formula: "cumulative_shrink_cwt on a new assessment REPLACES lot.shrink_cwt (re-baseline),\nit is never added: shrink_cwt\
    \ := new assessment.cumulative_shrink_cwt.\nlatest assessment selected by (assessment_date DESC, created_at DESC).\navailable_cwt\
    \ := original_weight_cwt - shrink_cwt - packed_total_cwt\n                 - cull_total_cwt - condemned_cwt   (recomputed\
    \ on every mutation)\nif available_cwt == 0 -> lot auto-closes (BINNED -> CLOSED)\nManual close books the remnant into\
    \ shrink:\n  shrink_cwt := original_weight_cwt - packed_total_cwt - cull_total_cwt - condemned_cwt\nWeight-conservation\
    \ invariant (must hold after every transition):\n  original_weight_cwt == available_cwt + packed_total_cwt + cull_total_cwt\n\
    \                         + condemned_cwt + shrink_cwt\n"
  input_set: the FieldLot and its GradeOutAssessments / COMPLETED-run draws
  precision: 2dp cwt
- name: wash_water_result
  trigger: POST /sheds/{id}/wash-water-checks
  algorithm: threshold
  formula: "result = PASS iff turbidity_ntu <= 4.0 AND 50 <= chlorine_ppm <= 200\n                  AND 45 <= water_temp_f\
    \ <= 60, else FAIL\nBoundary: turbidity exactly 4.0 PASSES (<=), 4.01 FAILS.\nOn FAIL: consecutive_wash_failures += 1;\
    \ if turbidity_ntu > 8.0 also set\n  wash_quarantine_flag (immediate QUARANTINED regardless of count).\nOn PASS: consecutive_wash_failures\
    \ := 0; wash_quarantine_flag := false.\nPosture recompute after every check:\n  QUARANTINED if wash_quarantine_flag OR\
    \ audit_failed_flag\n  else RESTRICTED if consecutive_wash_failures >= 2\n  else NORMAL\nRun-freshness rule (used by pack-run\
    \ creation): the shed's MOST RECENT PASS\ncheck is the freshness anchor (selected by measured_at DESC, tie-break\ncreated_at\
    \ DESC); FAILs recorded after it do not re-extend or invalidate it —\nthey act through posture instead. Window: 12h when\
    \ posture is NORMAL, 4h when\nRESTRICTED (inclusive: exactly 4h old is fresh).\n"
  input_set: the recorded check plus shed flag state
  constants:
    WASH_MAX_TURBIDITY_NTU: 4.0
    QUARANTINE_TURBIDITY_NTU: 8.0
    CHLORINE_MIN_PPM: 50
    CHLORINE_MAX_PPM: 200
    WASH_TEMP_MIN_F: 45
    WASH_TEMP_MAX_F: 60
    RESTRICTED_CONSECUTIVE_FAILS: 2
    WASH_VALIDITY_HOURS_NORMAL: 12
    WASH_VALIDITY_HOURS_RESTRICTED: 4
  precision: inclusive bounds as written (<= / >=)
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers present and well-formed
  error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http_status: 400
  applies_to: all
- priority: 2
  category: auth
  check: role permitted for this operation per RBAC; ownership checks (Grower may only dispute/read own settlements; SoD clerk
    check sits with its transition, see ERR_SOD_REFINALIZE_CLERK at priority 5)
  error_id: ERR_INSUFFICIENT_PERMISSIONS
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: path ids and body FK references exist, validated left-to-right (grower, shed, bin, lot, contract, order, run, audit,
    settlement)
  error_id: ERR_GROWER_NOT_FOUND | ERR_SHED_NOT_FOUND | ERR_BIN_NOT_FOUND | ERR_FIELD_LOT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND
    | ERR_PACK_ORDER_NOT_FOUND | ERR_PACK_RUN_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND
  http_status: 404
  applies_to: all endpoints with resource ids
- priority: 4
  category: state
  check: 'OCC: expected_field_lot_version == FieldLot.version / expected_grower_version == Grower.version'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /field-lots/{id}/assessments, POST /growers/{id}/settlements
- priority: 5
  category: state
  check: target resource in a valid state for this operation (lot INTAKE/BINNED/CLOSED gates, order REQUESTED/ALLOCATED gates,
    run SCHEDULED gate, contract ACTIVE gate, settlement PROVISIONAL/FINALIZED/DISPUTED gates, audit FIELD_WORK gate, SoD
    clerk identity on re-finalize)
  error_id: ERR_LOT_INVALID_STATE | ERR_ORDER_INVALID_STATE | ERR_RUN_INVALID_STATE | ERR_CONTRACT_INVALID_STATE | ERR_SETTLEMENT_INVALID_STATE
    | ERR_AUDIT_INVALID_STATE | ERR_SOD_REFINALIZE_CLERK
  http_status: 409
  applies_to: state transition endpoints
- priority: 6
  category: business_safety
  check: 'food-safety gates: shed QUARANTINED blocks bin-assignment / run creation / hold release; shed RESTRICTED blocks
    bin-assignment; lot ON_HOLD blocks sprout-inhibitor application; pack-run creation requires a fresh PASS wash check (12h
    NORMAL / 4h RESTRICTED)'
  error_id: ERR_SHED_QUARANTINED | ERR_SHED_RESTRICTED | ERR_LOT_QUALITY_HOLD | ERR_WASH_CHECK_STALE
  http_status: 409
  applies_to: bin-assignment, quality-transition, sprout-inhibitor-applications, pack-runs
- priority: 7
  category: business_referential
  check: 'cross-reference integrity: bin.variety_lock matches lot variety; contract variety matches order variety; settlement
    season_label uniqueness vs FINALIZED/DISPUTED/PAID conflicts'
  error_id: ERR_BIN_VARIETY_MISMATCH | ERR_INVALID_REQUEST | ERR_SETTLEMENT_SEASON_CONFLICT
  http_status: 409
  applies_to: bin-assignment, pack-orders create, settlements create
- priority: 8
  category: business_temporal
  check: sprout-inhibitor retreat window (applied_at >= last_inhibitor_applied_at + 21 days); pack-line schedule overlap —
    runs share a shed via PackRun.pack_order_id -> PackOrder.shed_id, variety compared via PackRun.pack_order_id -> PackOrder.variety,
    conflict iff (new.start < other.end + buffer AND other.start < new.end + buffer) with buffer = 1h when varieties differ
    else 0 (half-open adjacency allowed); contract delivery_window_end > start
  error_id: ERR_RETREAT_WINDOW_VIOLATION | ERR_LINE_SCHEDULE_CONFLICT | ERR_INVALID_REQUEST
  http_status: 409
  applies_to: sprout-inhibitor-applications, pack-runs, contracts
- priority: 9
  category: business_constraint
  check: 'shape/constraint checks: bin capacity (occupied + lot.available <= capacity, equality allowed); assessment percentages
    sum to exactly 100.00; cumulative_shrink monotonic non-decreasing and <= original - packed - cull - condemned; draw balance
    (raw == packed + cull, us1 + us2 == packed); draws within reservations; run grade gate (aggregate us1 share >= order.grade_min_us1_pct);
    remnant close <= 5.0; required/conditional fields and enum membership'
  error_id: ERR_BIN_CAPACITY_EXCEEDED | ERR_GRADE_PERCENT_SUM_INVALID | ERR_SHRINK_INVALID | ERR_RUN_DRAW_IMBALANCE | ERR_RUN_DRAW_EXCEEDS_RESERVATION
    | ERR_GRADE_SPEC_NOT_MET | ERR_LOT_REMNANT_TOO_LARGE | ERR_INVALID_REQUEST
  http_status: 422
  applies_to: bin-assignment, assessments, run close, lot close, all creates
- priority: 10
  category: business_fiscal
  check: 'commitment and pool checks: CONTRACT order requested <= contract.remaining_committed_cwt (equality allowed); OPEN_MARKET
    requested <= open-market cap; eligible pool covers full request'
  error_id: ERR_COMMITMENT_EXCEEDED | ERR_OPEN_MARKET_CAP_EXCEEDED | ERR_INSUFFICIENT_ALLOCATION_POOL
  http_status: 402
  applies_to: POST /pack-orders/{id}/allocate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\"\
    : \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\"\
    \ } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
endpoints:
- method: POST
