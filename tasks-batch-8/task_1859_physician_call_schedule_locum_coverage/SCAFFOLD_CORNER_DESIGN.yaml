  - section: calculations
    instances:
      - name: generation_selector_tiebreak_prefers_earliest_created_physician
        claim_type: correct_result
        grounds:
          - "calculations.rotation_auto_assignment"
        distinguishing_aspect: "Two zero-point physicians tie on total and undesirable points; the earliest created_at wins slot 1, and the run-projection then gives slot 2 to the other physician (1.0 > 0)."
        test_recipe:
          setup: ["program 2026-09-08..2026-09-09, 1 weekday primary per day; P_early created before P_later (both STAFF CARDIOLOGY, zero points); NOT yet published (assertions run on the GENERATED state)"]
          setup_api_calls:
