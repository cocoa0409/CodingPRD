scaffold_corner_design:
- section: entities
  instances:
  - name: retailer_create_defaults_active
    claim_type: defaults
    grounds:
    - entities.Retailer.fields.status
    distinguishing_aspect: Omitting status on retailer create persists the default ACTIVE.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls:
      - call: POST /jbp/retailers
        payload:
          name: Retailer Alpha
          country_code: US
          channels:
          - MASS
        as: PlatformAdmin
        captures:
          ret_id: $.data.id
      trigger: []
      assert:
      - create returned 201 and Retailer.${ret_id}.status == ACTIVE
  - name: retailer_create_explicit_suspended_accepted
    claim_type: type_constraints
    grounds:
    - entities.Retailer.fields.status
    distinguishing_aspect: status is settable at creation; SUSPENDED is accepted and persisted.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls:
      - call: POST /jbp/retailers
        payload:
          name: Retailer Beta
          country_code: US
          channels:
          - GROCERY
          status: SUSPENDED
        as: PlatformAdmin
        captures:
          ret_id: $.data.id
      trigger: []
      assert:
      - Retailer.${ret_id}.status == SUSPENDED
  - name: category_create_defaults_full_category_scope
    claim_type: defaults
    grounds:
    - entities.Category.fields.advisory_scope
    distinguishing_aspect: Omitting advisory_scope persists FULL_CATEGORY.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls:
      - call: POST /jbp/categories
        payload:
          name: Laundry Care
        as: PlatformAdmin
        captures:
          cat_id: $.data.id
      trigger: []
      assert:
      - Category.${cat_id}.advisory_scope == FULL_CATEGORY
  - name: plan_create_initial_computed_fields
    claim_type: creation
    grounds:
    - entities.JointBusinessPlan.fields.status
    - entities.JointBusinessPlan.fields.negotiation_round
    distinguishing_aspect: Plan create lands directly in PROPOSED with negotiation_round 1, version 1, committed_growth_pct
      null.
    test_recipe:
      setup:
      - retailer and category exist
      setup_api_calls:
      - call: POST /jbp/retailers
        payload:
          name: Retailer Alpha
          country_code: US
          channels:
          - MASS
        as: PlatformAdmin
        captures:
          ret_id: $.data.id
      - call: POST /jbp/categories
        payload:
          name: Laundry Care
        as: PlatformAdmin
        captures:
          cat_id: $.data.id
      trigger:
      - call: POST /jbp/plans
        payload:
          retailer_id: ${ret_id}
          category_id: ${cat_id}
          fiscal_year: 2027
          growth_target_pct: 8
          weekly_baseline_cases: 100
          avg_unit_net_price_cents: 450
        as: ManufacturerPlanner
        captures:
          plan_id: $.data.id
      assert:
      - 201; JointBusinessPlan.${plan_id}.status == PROPOSED
      - negotiation_round == 1 and version == 1
      - committed_growth_pct is null and activated_at is null
  - name: plan_create_extra_computed_field_rejected
    claim_type: system_fields
    grounds:
    - entities.JointBusinessPlan.fields.status
    distinguishing_aspect: 'Client-supplied system/computed fields are rejected, not silently ignored: a status field in the
      create body returns ERR_VALIDATION.'
    test_recipe:
      setup:
      - retailer and category exist
      setup_api_calls:
      - call: POST /jbp/retailers
        payload:
          name: Retailer Alpha
          country_code: US
          channels:
          - MASS
        as: PlatformAdmin
        captures:
          ret_id: $.data.id
      - call: POST /jbp/categories
        payload:
          name: Laundry Care
        as: PlatformAdmin
        captures:
          cat_id: $.data.id
      trigger:
      - call: POST /jbp/plans
        payload:
          retailer_id: ${ret_id}
          category_id: ${cat_id}
          fiscal_year: 2027
          growth_target_pct: 8
          weekly_baseline_cases: 100
          avg_unit_net_price_cents: 450
          status: ACTIVATED
        as: ManufacturerPlanner
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_VALIDATION (undeclared/system field in body)
  - name: plan_create_with_missing_retailer_returns_404
    claim_type: parent_relationships
    grounds:
    - entities.JointBusinessPlan.fields.retailer_id
    distinguishing_aspect: A dangling retailer_id in the plan body is a 404 ERR_RETAILER_NOT_FOUND, not a 400.
    test_recipe:
      setup:
      - category exists
      setup_api_calls:
      - call: POST /jbp/categories
        payload:
          name: Laundry Care
        as: PlatformAdmin
        captures:
          cat_id: $.data.id
      trigger:
      - call: POST /jbp/plans
        payload:
          retailer_id: 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
          category_id: ${cat_id}
          fiscal_year: 2027
          growth_target_pct: 8
          weekly_baseline_cases: 100
          avg_unit_net_price_cents: 450
        as: ManufacturerPlanner
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_RETAILER_NOT_FOUND (404)
  - name: launch_create_autocreates_four_phases
    claim_type: creation
    grounds:
    - entities.LaunchPhase.fields.phase_index
    - entities.LaunchPhase.fields.phase_type
    distinguishing_aspect: Launch creation materializes exactly PHASE_COUNT phases, phase_index 1..4 mapped to CAPACITY_BUILD,
      DISTRIBUTION_BUILD, TRADE_SPEND, SUSTAIN, all PENDING with zeroed inputs.
    test_recipe:
      setup:
      - ACTIVATED plan
      setup_api_calls:
      - call: POST /jbp/retailers
        payload:
          name: Retailer Alpha
          country_code: US
          channels:
          - MASS
        as: PlatformAdmin
        captures:
          ret_id: $.data.id
      - call: POST /jbp/categories
        payload:
          name: Laundry Care
        as: PlatformAdmin
        captures:
          cat_id: $.data.id
      - call: POST /jbp/plans
        payload:
          retailer_id: ${ret_id}
          category_id: ${cat_id}
          fiscal_year: 2027
          growth_target_pct: 8
          weekly_baseline_cases: 100
          avg_unit_net_price_cents: 450
        as: ManufacturerPlanner
        captures:
          plan_id: $.data.id
      - call: POST /jbp/plans/${plan_id}/decide
        payload:
          decision: ACCEPT
        as: RetailerBuyer
        as_user_id: ${ret_id}
      - call: POST /jbp/plans/${plan_id}/activate
        payload:
          accrual_rate_pct: 4
          edlp_split_pct: 60
        as: ManufacturerPlanner
      - call: POST /jbp/plans/${plan_id}/launches
        payload:
          product_name: UltraTabs
          pack_family: tabs
          launch_date: '2027-03-01T00:00:00Z'
          total_trade_budget_cents: 500000
        as: ManufacturerPlanner
        captures:
          lau_id: $.data.id
      trigger:
      - call: GET /jbp/launches/${lau_id}/phases
        as: ManufacturerPlanner
      assert:
      - exactly 4 phases returned, ordered by phase_index 1,2,3,4
      - phase_type sequence == [CAPACITY_BUILD, DISTRIBUTION_BUILD, TRADE_SPEND, SUSTAIN]
      - 'every phase: status == PENDING and distribution_target_pct == 0 and capacity_cases == 0 and trade_spend_cents ==
        0'
      - InnovationLaunch.${lau_id}.budget_remaining_cents == 500000
  - name: ppd_price_per_unit_ceil_rounding
    claim_type: computed_fields
    grounds:
    - entities.PricePackDecision.fields.price_per_unit_cents
    distinguishing_aspect: 'price_per_unit_cents rounds UP to the next integer cent: 601/6 -> 101, while an exact division
      600/6 -> 100 shows no spurious bump.'
    test_recipe:
      setup:
      - ACTIVATED plan
      setup_api_calls:
      - call: POST /jbp/retailers
        payload:
          name: Retailer Alpha
          country_code: US
          channels:
          - MASS
        as: PlatformAdmin
        captures:
          ret_id: $.data.id
      - call: POST /jbp/categories
        payload:
          name: Laundry Care
        as: PlatformAdmin
        captures:
          cat_id: $.data.id
      - call: POST /jbp/plans
        payload:
          retailer_id: ${ret_id}
          category_id: ${cat_id}
          fiscal_year: 2027
          growth_target_pct: 8
          weekly_baseline_cases: 100
          avg_unit_net_price_cents: 450
        as: ManufacturerPlanner
        captures:
          plan_id: $.data.id
      - call: POST /jbp/plans/${plan_id}/decide
        payload:
          decision: ACCEPT
        as: RetailerBuyer
        as_user_id: ${ret_id}
      - call: POST /jbp/plans/${plan_id}/activate
        payload:
          accrual_rate_pct: 4
          edlp_split_pct: 60
        as: ManufacturerPlanner
      trigger:
      - call: POST /jbp/plans/${plan_id}/price-pack-decisions
        payload:
          channel: MASS
          pack_family: tabs
          pack_code: TB-A
          unit_count: 6
          list_price_cents: 601
        as: ManufacturerPlanner
        captures:
          ppd_a: $.data.id
      - call: POST /jbp/plans/${plan_id}/price-pack-decisions
        payload:
          channel: GROCERY
          pack_family: tabs
          pack_code: TB-B
          unit_count: 6
          list_price_cents: 600
        as: ManufacturerPlanner
        captures:
          ppd_b: $.data.id
      assert:
      - PricePackDecision.${ppd_a}.price_per_unit_cents == 101 (ceil(100.166..))
      - PricePackDecision.${ppd_b}.price_per_unit_cents == 100 (exact division, no bump)
  - name: deduction_create_defaults
    claim_type: defaults
    grounds:
    - entities.Deduction.fields.status
    - entities.Deduction.fields.short_paid
    distinguishing_aspect: New deductions land RECEIVED with short_paid false, absorbed_by_manufacturer false, settled_amount_cents
      null.
    test_recipe:
      setup:
      - ACTIVATED plan with fund
      setup_api_calls:
      - call: POST /jbp/retailers
        payload:
          name: Retailer Alpha
          country_code: US
          channels:
          - MASS
        as: PlatformAdmin
        captures:
          ret_id: $.data.id
      - call: POST /jbp/categories
        payload:
          name: Laundry Care
        as: PlatformAdmin
        captures:
          cat_id: $.data.id
      - call: POST /jbp/plans
        payload:
          retailer_id: ${ret_id}
          category_id: ${cat_id}
          fiscal_year: 2027
          growth_target_pct: 8
          weekly_baseline_cases: 100
          avg_unit_net_price_cents: 450
        as: ManufacturerPlanner
        captures:
          plan_id: $.data.id
      - call: POST /jbp/plans/${plan_id}/decide
        payload:
          decision: ACCEPT
        as: RetailerBuyer
        as_user_id: ${ret_id}
      - call: POST /jbp/plans/${plan_id}/activate
        payload:
          accrual_rate_pct: 4
          edlp_split_pct: 60
        as: ManufacturerPlanner
      - call: GET /jbp/funds?plan_id=${plan_id}
        as: ManufacturerPlanner
        captures:
          fund_id: $.data[0].id
      trigger:
      - call: POST /jbp/funds/${fund_id}/deductions
        payload:
          claim_reference: CL-1
          bucket: EDLP
          amount_cents: 2500
        as: RetailerBuyer
        as_user_id: ${ret_id}
        captures:
          ded_id: $.data.id
      assert:
      - Deduction.${ded_id}.status == RECEIVED
      - short_paid == false and absorbed_by_manufacturer == false and settled_amount_cents is null
  - name: analysis_competitor_share_computed
    claim_type: computed_fields
    grounds:
    - entities.CategoryAnalysis.fields.competitor_share_pct
    distinguishing_aspect: competitor_share_pct derives as 100 - manufacturer_share_pct on creation.
    test_recipe:
      setup:
      - plan exists (PROPOSED)
      setup_api_calls:
      - call: POST /jbp/retailers
        payload:
          name: Retailer Alpha
          country_code: US
          channels:
          - MASS
        as: PlatformAdmin
        captures:
          ret_id: $.data.id
      - call: POST /jbp/categories
        payload:
          name: Laundry Care
        as: PlatformAdmin
        captures:
          cat_id: $.data.id
      - call: POST /jbp/plans
        payload:
          retailer_id: ${ret_id}
          category_id: ${cat_id}
          fiscal_year: 2027
          growth_target_pct: 8
          weekly_baseline_cases: 100
          avg_unit_net_price_cents: 450
        as: ManufacturerPlanner
        captures:
          plan_id: $.data.id
      trigger:
      - call: POST /jbp/plans/${plan_id}/category-analyses
        payload:
          title: Review
          period_label: 2027-H1
          total_category_growth_pct: 6
          manufacturer_share_pct: 62.5
          includes_competitor_data: true
        as: CategoryAdvisor
        captures:
          ana_id: $.data.id
      assert:
      - CategoryAnalysis.${ana_id}.competitor_share_pct == 37.5
      - CategoryAnalysis.${ana_id}.status == SUBMITTED
  - name: forecast_created_published_supersedes_prior
    claim_type: creation
    grounds:
    - state_machines.Forecast.PUBLISHED_to_SUPERSEDED
    excluded_because:
      difficulty_instance: non_linear_state_machine / forecast_parallel_dimensions
      rationale: Create-lands-PUBLISHED and supersede-on-create are asserted end-to-end by the named difficulty instance.
- section: state_machines
  instances:
  - name: plan_negotiate_from_accepted_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.JointBusinessPlan
    distinguishing_aspect: negotiate is only defined from PROPOSED/COUNTERED; from ACCEPTED it fails ERR_INVALID_STATE.
    test_recipe:
      setup:
      - plan ACCEPTED
      setup_api_calls:
      - call: POST /jbp/retailers
        payload:
          name: Retailer Alpha
          country_code: US
          channels:
          - MASS
        as: PlatformAdmin
        captures:
          ret_id: $.data.id
      - call: POST /jbp/categories
        payload:
          name: Laundry Care
        as: PlatformAdmin
        captures:
          cat_id: $.data.id
      - call: POST /jbp/plans
        payload:
          retailer_id: ${ret_id}
          category_id: ${cat_id}
          fiscal_year: 2027
          growth_target_pct: 8
          weekly_baseline_cases: 100
          avg_unit_net_price_cents: 450
        as: ManufacturerPlanner
        captures:
          plan_id: $.data.id
      - call: POST /jbp/plans/${plan_id}/decide
        payload:
          decision: ACCEPT
        as: RetailerBuyer
        as_user_id: ${ret_id}
      trigger:
      - call: POST /jbp/plans/${plan_id}/negotiate
        payload:
          growth_target_pct: 9
        as: RetailerBuyer
        as_user_id: ${ret_id}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE
      - plan status remains ACCEPTED, negotiation_round remains 1
  - name: plan_decide_wrong_actor_returns_not_your_move
    claim_type: precondition_enforcement
    grounds:
    - state_machines.JointBusinessPlan.PROPOSED_to_ACCEPTED
    - validations[priority=9]
    distinguishing_aspect: From PROPOSED the move belongs to the retailer; a ManufacturerPlanner decide fails ERR_NOT_YOUR_MOVE
      (403), while ERR_INVALID_STATE/ERR_FORBIDDEN would be wrong.
    test_recipe:
      setup:
      - plan PROPOSED
      setup_api_calls:
      - call: POST /jbp/retailers
        payload:
          name: Retailer Alpha
          country_code: US
          channels:
          - MASS
        as: PlatformAdmin
        captures:
          ret_id: $.data.id
      - call: POST /jbp/categories
        payload:
          name: Laundry Care
        as: PlatformAdmin
        captures:
          cat_id: $.data.id
      - call: POST /jbp/plans
        payload:
          retailer_id: ${ret_id}
          category_id: ${cat_id}
          fiscal_year: 2027
          growth_target_pct: 8
          weekly_baseline_cases: 100
          avg_unit_net_price_cents: 450
        as: ManufacturerPlanner
        captures:
          plan_id: $.data.id
      trigger:
      - call: POST /jbp/plans/${plan_id}/decide
        payload:
          decision: ACCEPT
        as: ManufacturerPlanner
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_YOUR_MOVE (403)
      - plan status remains PROPOSED
  - name: plan_expired_rejects_further_negotiate_returns_already_terminal
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.JointBusinessPlan
    distinguishing_aspect: After round exhaustion lands the plan in EXPIRED, every further transition attempt fails ERR_ALREADY_TERMINAL.
    test_recipe:
      setup:
      - plan driven to EXPIRED via 6-round exhaustion
      setup_api_calls:
      - call: POST /jbp/retailers
        payload:
          name: Retailer Alpha
          country_code: US
          channels:
          - MASS
        as: PlatformAdmin
        captures:
          ret_id: $.data.id
      - call: POST /jbp/categories
        payload:
          name: Laundry Care
        as: PlatformAdmin
        captures:
          cat_id: $.data.id
      - call: POST /jbp/plans
        payload:
          retailer_id: ${ret_id}
          category_id: ${cat_id}
          fiscal_year: 2027
          growth_target_pct: 8
          weekly_baseline_cases: 100
          avg_unit_net_price_cents: 450
        as: ManufacturerPlanner
        captures:
          plan_id: $.data.id
      - call: POST /jbp/plans/${plan_id}/negotiate
        payload:
          growth_target_pct: 9
        as: RetailerBuyer
        as_user_id: ${ret_id}
      - call: POST /jbp/plans/${plan_id}/negotiate
        payload:
          growth_target_pct: 10
        as: ManufacturerPlanner
      - call: POST /jbp/plans/${plan_id}/negotiate
        payload:
          growth_target_pct: 9
        as: RetailerBuyer
        as_user_id: ${ret_id}
      - call: POST /jbp/plans/${plan_id}/negotiate
        payload:
          growth_target_pct: 10
        as: ManufacturerPlanner
      - call: POST /jbp/plans/${plan_id}/negotiate
        payload:
          growth_target_pct: 9
        as: RetailerBuyer
        as_user_id: ${ret_id}
      - call: POST /jbp/plans/${plan_id}/negotiate
        payload:
          growth_target_pct: 10
        as: ManufacturerPlanner
        captures:
          err: $.data.error_id
      trigger:
      - call: POST /jbp/plans/${plan_id}/decide
        payload:
          decision: ACCEPT
        as: RetailerBuyer
        as_user_id: ${ret_id}
        captures:
          err2: $.data.error_id
      assert:
      - the exhausting negotiate returned ERR_NEGOTIATION_ROUNDS_EXHAUSTED
      - the post-expiry decide returns ERR_ALREADY_TERMINAL (terminal lockdown beats mover-mapping)
      - plan status remains EXPIRED
  - name: analysis_decide_twice_returns_already_terminal
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.CategoryAnalysis
    distinguishing_aspect: An ACCEPTED analysis is terminal; a second decide fails ERR_ALREADY_TERMINAL.
    test_recipe:
      setup:
      - plan PROPOSED; analysis SUBMITTED then ACCEPTED
      setup_api_calls:
      - call: POST /jbp/retailers
        payload:
          name: Retailer Alpha
          country_code: US
          channels:
          - MASS
        as: PlatformAdmin
        captures:
          ret_id: $.data.id
      - call: POST /jbp/categories
        payload:
          name: Laundry Care
        as: PlatformAdmin
        captures:
          cat_id: $.data.id
      - call: POST /jbp/plans
        payload:
          retailer_id: ${ret_id}
          category_id: ${cat_id}
          fiscal_year: 2027
          growth_target_pct: 8
          weekly_baseline_cases: 100
          avg_unit_net_price_cents: 450
        as: ManufacturerPlanner
        captures:
          plan_id: $.data.id
      - call: POST /jbp/plans/${plan_id}/category-analyses
        payload:
          title: Review
          period_label: 2027-H1
          total_category_growth_pct: 6
          manufacturer_share_pct: 55
        as: CategoryAdvisor
        captures:
          ana_id: $.data.id
      - call: POST /jbp/category-analyses/${ana_id}/decide
        payload:
          decision: ACCEPT
        as: RetailerBuyer
        as_user_id: ${ret_id}
      trigger:
      - call: POST /jbp/category-analyses/${ana_id}/decide
        payload:
          decision: RETURN
        as: RetailerBuyer
        as_user_id: ${ret_id}
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_ALREADY_TERMINAL
  - name: shelf_superseded_on_new_create
    claim_type: side_effect_execution
    grounds:
    - state_machines.ShelfRecommendation.PROPOSED_to_WITHDRAWN
    distinguishing_aspect: Creating a second PROPOSED recommendation for the plan auto-WITHDRAWNs the first.
    test_recipe:
      setup:
      - ACTIVATED plan with an ACCEPTED analysis and one PROPOSED shelf rec
      setup_api_calls:
      - call: POST /jbp/retailers
        payload:
          name: Retailer Alpha
          country_code: US
          channels:
          - MASS
        as: PlatformAdmin
        captures:
          ret_id: $.data.id
      - call: POST /jbp/categories
        payload:
          name: Laundry Care
        as: PlatformAdmin
        captures:
          cat_id: $.data.id
      - call: POST /jbp/plans
        payload:
          retailer_id: ${ret_id}
          category_id: ${cat_id}
          fiscal_year: 2027
          growth_target_pct: 8
          weekly_baseline_cases: 100
          avg_unit_net_price_cents: 450
        as: ManufacturerPlanner
        captures:
          plan_id: $.data.id
      - call: POST /jbp/plans/${plan_id}/decide
        payload:
          decision: ACCEPT
        as: RetailerBuyer
        as_user_id: ${ret_id}
      - call: POST /jbp/plans/${plan_id}/activate
        payload:
          accrual_rate_pct: 4
          edlp_split_pct: 60
        as: ManufacturerPlanner
        captures:
          plan_v: $.data.version
      - call: POST /jbp/plans/${plan_id}/category-analyses
        payload:
          title: Review
          period_label: 2027-H1
          total_category_growth_pct: 6
          manufacturer_share_pct: 55
        as: CategoryAdvisor
        captures:
          ana_id: $.data.id
      - call: POST /jbp/category-analyses/${ana_id}/decide
        payload:
          decision: ACCEPT
        as: RetailerBuyer
        as_user_id: ${ret_id}
      - call: POST /jbp/plans/${plan_id}/shelf-recommendations
        payload:
          expected_plan_version: ${plan_v}
          title: Reset A
          space_change_pct: 5
          target_store_count: 100
        as: CategoryAdvisor
        captures:
          shelf1: $.data.id
      - call: GET /jbp/plans/${plan_id}
        as: CategoryAdvisor
        captures:
          plan_v2: $.data.version
      trigger:
      - call: POST /jbp/plans/${plan_id}/shelf-recommendations
        payload:
          expected_plan_version: ${plan_v2}
          title: Reset B
          space_change_pct: -10
          target_store_count: 50
        as: CategoryAdvisor
        captures:
          shelf2: $.data.id
      - call: GET /jbp/plans/${plan_id}/shelf-recommendations
        as: CategoryAdvisor
      assert:
      - ShelfRecommendation.${shelf1}.status == WITHDRAWN (auto-superseded)
      - ShelfRecommendation.${shelf2}.status == PROPOSED
  - name: shelf_verify_from_proposed_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.ShelfRecommendation.PROPOSED_to_IMPLEMENTING
    distinguishing_aspect: verify before retailer acceptance fails ERR_INVALID_STATE (first of the three ordered verify checks).
