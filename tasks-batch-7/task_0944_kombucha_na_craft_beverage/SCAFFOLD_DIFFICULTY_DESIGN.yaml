              as: ProductionOperator
              as_user_id: "op-1"
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /packaging-runs/${run_id}/start"
              payload: {}
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id is ERR_BLEND_RULE_VIOLATION with HTTP 422"
            - "PackagingRun.${run_id}.status == DRAFT"
            - "PackagingRun.${run_id}.source_batch_count == 0"
            - "PackagingRun.${run_id}.gross_liters == 0.0"
            - "PackagingRun.${run_id}.units_produced == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: pitching_into_a_vessel_that_was_never_sanitised_is_refused
        grounds:
          - state_machines.Vessel.occupy_on_pitch
          - state_machines.Batch.pitch_batch
          - validations[priority=29]
          - errors[ERR_VESSEL_UNAVAILABLE]
        distinguishing_aspect: |
          The dependency crosses the Batch -> Vessel pair: a Batch may only
          enter F1_ACTIVE while its Vessel is in state SANITIZED, so a pitch
          into a DIRTY vessel is refused and the culture's pitch_count is not
          consumed.
        test_recipe:
          setup:
            - "A recipe, an ACTIVE founder culture, and a 500 L vessel that has never been through a CIP cycle, so it is DIRTY."
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "House Ginger", style: "KOMBUCHA", target_ph_ceiling: 3.5, planned_f1_days: 6, planned_f2_days: 3, base_gravity_brix: 7.0, intended_abv_class: "NON_ALCOHOLIC" }
              as: ProductionOperator
              captures: { rec_id: $.data.id }
