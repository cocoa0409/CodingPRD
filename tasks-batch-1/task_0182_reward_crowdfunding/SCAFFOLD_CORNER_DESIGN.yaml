# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7 surface, using the claim-extraction
# guide's sections/claim_types. Corners already covered by a §1.8 instance are
# emitted as excluded_because stubs (no test_recipe).
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_campaign_minimal_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Campaign.fields.status
          - entities.Campaign.fields.currency
          - entities.Campaign.fields.version
        distinguishing_aspect: "POST /campaigns with all required fields -> 201, status==DRAFT, version==1, currency copied from Creator.payout_currency (USD), id/created_at server-minted."
        test_recipe:
          setup:
            - "Creator C (USD) registered."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 50000, funding_model: "ALL_OR_NOTHING", deadline_utc: "2026-09-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id, st: $.data.status, ver: $.data.version, cur: $.data.currency }
          assert:
            - "HTTP status == 201."
            - "Campaign.${camp_id}.status == DRAFT and version == 1."
            - "Campaign.${camp_id}.currency == USD (copied from Creator.payout_currency)."

      - name: get_campaign_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET /campaigns/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "One creator for auth context (not otherwise required for GET)."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /campaigns/00000000-0000-4000-8000-000000000000"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_FOUND and HTTP status == 404."

      - name: create_campaign_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /campaigns omitting funding_model -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Creator C registered."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 50000, deadline_utc: "2026-09-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST and HTTP status == 422."

      - name: create_campaign_invalid_enum_funding_model_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Campaign.fields.funding_model
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /campaigns with funding_model='HYBRID' (not in ALL_OR_NOTHING|FLEXIBLE) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Creator C registered."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 50000, funding_model: "HYBRID", deadline_utc: "2026-09-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST and HTTP status == 422."

      - name: pledge_committed_amount_is_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Pledge.fields.committed_amount_cents
          - calculations.pledge_total
        distinguishing_aspect: "committed_amount_cents is source:computed; pledge_total fixes it from tier+zone (5650) and it is not a declared input field."
        test_recipe:
          setup:
            - "LIVE campaign, tier price 5000 weight 800; backer pledges 5000 DOMESTIC."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b@x.com", display_name: "B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_v1: $.data.version }
          trigger:
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b_id}"
              captures: { committed: $.data.committed_amount_cents }
          assert:
            - "Pledge committed_amount_cents == 5650 (computed; equals 5000 + ceil(800/1000)*150 + 500)."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: launch_already_live_campaign_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Campaign.DRAFT_to_LIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /campaigns/{id}/launch on a LIVE campaign -> ERR_INVALID_STATE (409); launch only valid from DRAFT."
        test_recipe:
          setup:
            - "Campaign already LIVE."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE and HTTP status == 409."

      - name: cancel_terminal_successful_campaign_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Campaign.CLOSING_to_SUCCESSFUL
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /campaigns/{id}/cancel on a SUCCESSFUL (terminal) campaign -> ERR_INVALID_STATE (409); cancel only valid from DRAFT or LIVE."
        test_recipe:
          setup:
            - "FLEXIBLE campaign closed SUCCESSFUL with one captured pledge."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b@x.com", display_name: "B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_v1: $.data.version }
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b_id}"
              captures: { pledge_id: $.data.id }
            - call: "POST /pledges/${pledge_id}/authorization"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /_clock/advance"
              payload: { now_utc: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campaigns/${camp_id}/cancel"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE and HTTP status == 409 (SUCCESSFUL is terminal)."

      - name: close_before_deadline_returns_not_closable
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Campaign.LIVE_to_CLOSING
          - errors[ERR_NOT_CLOSABLE]
        distinguishing_aspect: "POST /campaigns/{id}/close while clock < deadline_utc -> ERR_NOT_CLOSABLE (409); close requires clock >= deadline."
        test_recipe:
          setup:
            - "LIVE campaign, clock 2026-06-01, deadline 2026-07-01 (not yet reached)."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /campaigns/${camp_id}/close"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_CLOSABLE and HTTP status == 409."

      - name: launch_with_past_deadline_returns_deadline_in_past
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Campaign.DRAFT_to_LIVE
          - errors[ERR_DEADLINE_IN_PAST]
        distinguishing_aspect: "POST /campaigns/{id}/launch when deadline_utc <= current clock -> ERR_DEADLINE_IN_PAST (422)."
        test_recipe:
          setup:
            - "DRAFT campaign deadline 2026-07-01; clock advanced to 2026-08-01 (past the deadline) before launch."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_DEADLINE_IN_PAST and HTTP status == 422."

      - name: survey_before_capture_returns_survey_not_ready
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Pledge.SURVEY_SENT_to_SURVEY_COMPLETE
          - errors[ERR_SURVEY_NOT_READY]
        distinguishing_aspect: "POST /pledges/{id}/survey on a PENDING_AUTH pledge (not CAPTURED, no survey sent) -> ERR_SURVEY_NOT_READY (409)."
        test_recipe:
          setup:
            - "LIVE campaign, a fresh PENDING_AUTH pledge (campaign not yet closed, no survey)."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b@x.com", display_name: "B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_v1: $.data.version }
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b_id}"
              captures: { pledge_id: $.data.id }
          trigger:
            - call: "POST /pledges/${pledge_id}/survey"
              payload: { shipping_address: "1 Main St" }
              as: Backer
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_SURVEY_NOT_READY and HTTP status == 409."

      - name: cancel_captured_pledge_after_close_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Pledge.AUTHORIZED_to_CAPTURED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /pledges/{id}/cancel on a CAPTURED pledge whose campaign is SUCCESSFUL -> ERR_INVALID_STATE (409); backer cancel only valid while campaign LIVE and pledge ACTIVE."
        test_recipe:
          setup:
            - "FLEXIBLE campaign SUCCESSFUL with one CAPTURED pledge."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b@x.com", display_name: "B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_v1: $.data.version }
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b_id}"
              captures: { pledge_id: $.data.id }
            - call: "POST /pledges/${pledge_id}/authorization"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /_clock/advance"
              payload: { now_utc: "2026-07-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pledges/${pledge_id}/cancel"
              payload: {}
              as: Backer
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE and HTTP status == 409."

      - name: projected_vs_settled_raise_covered_by_difficulty
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Campaign.LIVE_to_CLOSING
        excluded_because:
          difficulty_instance: dual_variant_calc / projected_vs_settled_raise_on_campaign
          rationale: "The LIVE->CLOSING settlement cascade and its projected/settled divergence is asserted by the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_AUTH]
        distinguishing_aspect: "Request without X-User-Role / X-User-ID headers -> ERR_MISSING_AUTH (401), priority 1."
        test_recipe:
          setup:
            - "One campaign exists; the read is then attempted with no auth headers."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
          trigger:
            - call: "GET /campaigns/${camp_id}"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "When the GET is sent with both X-User-Role and X-User-ID omitted, response error_id == ERR_MISSING_AUTH and HTTP status == 401."

      - name: pledge_below_tier_min_on_live_campaign_returns_error
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors[ERR_PLEDGE_BELOW_TIER_MIN]
        distinguishing_aspect: "On a LIVE campaign (temporal check passes), a valid-FK pledge of 4999 against a 5000 tier -> ERR_PLEDGE_BELOW_TIER_MIN (422)."
        test_recipe:
          setup:
            - "LIVE campaign, tier price 5000; backer pledges 4999."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b@x.com", display_name: "B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { creator_id: "${c_id}", title: "Camp", funding_goal_cents: 1000, funding_model: "FLEXIBLE", deadline_utc: "2026-07-01T00:00:00.000Z" }
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/tiers"
              payload: { title: "T", price_cents: 5000, weight_grams: 800 }
              as: Creator
              as_user_id: "${c_id}"
              captures: { tier_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: Creator
              as_user_id: "${c_id}"
              captures: { camp_v1: $.data.version }
          trigger:
            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b_id}", tier_id: "${tier_id}", pledge_amount_cents: 4999, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_PLEDGE_BELOW_TIER_MIN and HTTP status == 422."

      - name: addon_from_other_campaign_returns_currency_mismatch
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=10]
          - errors[ERR_CURRENCY_MISMATCH]
        distinguishing_aspect: "Attaching an add-on product that belongs to a DIFFERENT campaign than the pledge's campaign -> ERR_CURRENCY_MISMATCH (422)."
        test_recipe:
          setup:
            - "LIVE campaign K1 with a pledge; campaign K2 (same creator, non-overlapping window) owns the add-on product."
          setup_api_calls:
            - call: "POST /creators"
              payload: { display_name: "C", payout_currency: "USD" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /backers"
              payload: { email: "b@x.com", display_name: "B" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
