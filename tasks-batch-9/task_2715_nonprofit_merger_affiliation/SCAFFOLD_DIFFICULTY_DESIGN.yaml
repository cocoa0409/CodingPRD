      - name: restricted_fund_petition_branch_returns_to_modified_not_consent_granted
        grounds:
          - state_machines.RestrictedFund.CONSENT_SOUGHT_to_CONSENT_DENIED
          - state_machines.RestrictedFund.PETITION_FILED_to_MODIFIED
          - state_machines.RestrictedFund.TRANSFERRED_to_CONSENT_GRANTED
          - entities.RestrictedFund.fields.transfer_basis
          - entities.RestrictedFund.fields.unwind_count
        distinguishing_aspect: |
          The unwind transition is written as TRANSFERRED -> CONSENT_GRANTED but its
          return state is conditional on how the fund reached TRANSFERRED: a fund that
          travelled the judicial branch HELD -> CONSENT_SOUGHT -> CONSENT_DENIED ->
          PETITION_FILED -> MODIFIED -> TRANSFERRED must come back to MODIFIED, not to
          CONSENT_GRANTED, because the donor never consented. Only a walk that takes the
          denial fork and then unwinds exposes this; the naive reading of the transition
          table lands the fund in a state its own history contradicts.
        test_recipe:
          setup:
            - "A Restructuring in status STRUCTURE_SELECTED with structure_type MERGER"
            - "One PERM_ENDOWMENT RestrictedFund held by the initiator with principal_cents 50000000, accumulated_appreciation_cents 12000000, historic_dollar_value_cents 45000000 and restriction_conflict true, so a donor-consent transfer is forbidden and only a court order can release it"
