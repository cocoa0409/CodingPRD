            - call: "POST /rmn/incrementality-studies"
              payload: { campaign_id: "${camp_geo_id}", design_method: "GEO_HOLDOUT", holdout_pct: 0.20, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z", expected_campaign_version: "${camp_geo_v_sched}" }
              as: MeasurementAnalyst
              as_user_id: "ma-5"
              captures: { study_geo_id: $.data.id }
            - call: "POST /rmn/incrementality-studies"
              payload: { campaign_id: "${camp_user_id}", design_method: "USER_HOLDOUT", holdout_pct: 0.20, window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-11T00:00:00Z", expected_campaign_version: "${camp_user_v_sched}" }
              as: MeasurementAnalyst
