# =============================================================================
# Task 1937 — School Safety Drill & Emergency Operations Plan
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: every testable claim of §1.1–§1.7 not already covered by §1.8.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: site_creation_defaults
        claim_type: creation
        grounds: [entities.SchoolSite]
        distinguishing_aspect: "A new site starts with posture ON_TRACK, all four drill counters at 0, version 1, and a server-minted id."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "Ridgeview Elementary", enrollment_count: 500, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
          assert:
            - "response 201; SchoolSite.${site_id}.compliance_posture == ON_TRACK"
            - "drills_scheduled_count == 0, drills_completed_count == 0, drills_missed_count == 0, drills_cancelled_count == 0"
            - "version == 1 and created_at == 2026-08-01T00:00:00Z (default logical clock)"

      - name: site_get_not_found_returns_404
        claim_type: not_found
        grounds: ["entities.SchoolSite", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent site id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: DistrictSafetyCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "http status 404 and error_id == ERR_NOT_FOUND"

      - name: drill_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.DrillEvent.fields.drill_type", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A drill_type outside the declared enum is rejected with ERR_VALIDATION (400) before any business rule runs."
        test_recipe:
          setup: ["site exists with a FIRE requirement"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Maplewood K-8", enrollment_count: 850, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
          trigger:
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIREDRILL, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "http 400 and error_id == ERR_VALIDATION"

      - name: drill_requirement_body_fk_not_found_returns_404
        claim_type: parent_relationships
        grounds: ["entities.DrillTypeRequirement.fields.site_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A create payload referencing a nonexistent site_id is rejected with ERR_NOT_FOUND (body-FK existence check)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /drill-requirements"
              payload: { site_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "http 404 and error_id == ERR_NOT_FOUND"

      - name: create_site_with_extra_field_returns_invalid_request
        claim_type: system_fields
        grounds: ["entities.SchoolSite", "validations[priority=4]"]
        distinguishing_aspect: "Unknown top-level payload fields (e.g. a client-supplied compliance_posture) are rejected with ERR_VALIDATION; computed/system fields are never client-writable."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "Ridgeview Elementary", enrollment_count: 500, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30", compliance_posture: NON_COMPLIANT }
              as: DistrictSafetyCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "http 400 and error_id == ERR_VALIDATION; no site persisted"

      - name: create_site_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.SchoolSite", "validations[priority=4]"]
        distinguishing_aspect: "Omitting required field name yields ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { enrollment_count: 500, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "http 400 and error_id == ERR_VALIDATION"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: drill_initial_state_scheduled
        claim_type: initial_state
        grounds: [state_machines.DrillEvent]
        distinguishing_aspect: "A newly created drill starts in SCHEDULED with zeroed roster counters."
        test_recipe:
          setup: ["site with FIRE requirement"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Cedar Grove High", enrollment_count: 1200, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
          trigger:
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill_id: $.data.id }
          assert:
            - "DrillEvent.${drill_id}.status == SCHEDULED"
            - "roster_total == 0, unaccounted_count == 0, accounted_count == 0, released_count == 0"
            - "announcement_mode defaults applied when omitted are covered separately; here explicit ANNOUNCED echoed"

      - name: complete_from_scheduled_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.DrillEvent.IN_PROGRESS_to_COMPLETED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete on a SCHEDULED (never started) drill is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["site with FIRE requirement; drill scheduled for 2026-09-15; clock on that date"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Cedar Grove High", enrollment_count: 1200, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: DistrictSafetyCoordinator
          trigger:
            - call: "POST /drill-events/${drill_id}/complete"
              as: SchoolSafetyOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; drill remains SCHEDULED"

      - name: cancel_missed_drill_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.DrillEvent.SCHEDULED_to_MISSED, state_machines.DrillEvent.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "MISSED is terminal: cancelling a drill the sweep has already marked MISSED is rejected."
        test_recipe:
          setup: ["site with FIRE requirement; drill scheduled 2026-09-10; clock advanced past it"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harborview Middle", enrollment_count: 700, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-10", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: DistrictSafetyCoordinator
          trigger:
            - call: "POST /drill-events/${drill_id}/cancel"
              as: SchoolSafetyOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; drill remains MISSED; site drills_missed_count == 1"

      - name: release_twice_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.RosterEntry.ACCOUNTED_to_RELEASED]
        distinguishing_aspect: "RELEASED is terminal for a roster entry: a second release is rejected."
        test_recipe:
          setup: ["site with ACTIVE EOP; drill IN_PROGRESS on 2026-09-15; stu-1 accounted"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Ridgeview Elementary", enrollment_count: 500, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /site-plan-documents"
              payload: { site_id: "${site_id}", document_title: "Floor Plan 2026", issued_on: "2026-07-01", review_by_date: "2027-01-15", coverage_tags: ["FLOOR_PLANS", "ACCESS_POINTS"] }
              as: SchoolSafetyOfficer
            - call: "POST /walkthroughs"
              payload: { site_id: "${site_id}", agency: FIRE, scheduled_date: "2026-07-20" }
              as: SchoolSafetyOfficer
              captures: { walk_id: $.data.id }
            - call: "POST /walkthroughs/${walk_id}/complete"
              payload: { completed_date: "2026-07-20", findings_summary: "OK", recommendations_count: 0 }
              as: FirstResponder
            - call: "POST /emergency-operations-plans"
              payload: { site_id: "${site_id}", title: "EOP 2026", plan_version_label: "v1", content_summary: "Procedures", review_due_date: "2027-08-01" }
              as: SchoolSafetyOfficer
              captures: { eop_id: $.data.id }
            - call: "POST /emergency-operations-plans/${eop_id}/submit"
              as: SchoolSafetyOfficer
            - call: "POST /emergency-operations-plans/${eop_id}/decide"
              payload: { decision: APPROVE }
              as: DistrictSafetyCoordinator
            - call: "POST /emergency-operations-plans/${eop_id}/activate"
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill_id}/start"
              as: SchoolSafetyOfficer
            - call: "POST /drill-events/${drill_id}/roster-entries"
              payload: { student_ref: "stu-1", accommodation_required: false }
              as: SchoolSafetyOfficer
              captures: { entry_id: $.data.id }
            - call: "POST /roster-entries/${entry_id}/account"
              as: SchoolSafetyOfficer
            - call: "POST /roster-entries/${entry_id}/release"
              payload: { guardian_name: "Jane Doe", released_to_verified: true }
              as: SchoolSafetyOfficer
          trigger:
            - call: "POST /roster-entries/${entry_id}/release"
              payload: { guardian_name: "Jane Doe", released_to_verified: true }
              as: SchoolSafetyOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; entry remains RELEASED; released_count stays 1"

      - name: verify_open_action_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.CorrectiveAction.PENDING_VERIFICATION_to_VERIFIED]
        distinguishing_aspect: "verify on an OPEN (never submitted) corrective action is rejected; the cycle requires PENDING_VERIFICATION first."
        test_recipe:
          setup: ["site with ACTIVE EOP; drill COMPLETED; AAR ACCEPTED; one corrective action OPEN"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Ridgeview Elementary", enrollment_count: 500, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /site-plan-documents"
              payload: { site_id: "${site_id}", document_title: "Floor Plan 2026", issued_on: "2026-07-01", review_by_date: "2027-01-15", coverage_tags: ["FLOOR_PLANS", "ACCESS_POINTS"] }
              as: SchoolSafetyOfficer
            - call: "POST /walkthroughs"
              payload: { site_id: "${site_id}", agency: FIRE, scheduled_date: "2026-07-20" }
              as: SchoolSafetyOfficer
              captures: { walk_id: $.data.id }
            - call: "POST /walkthroughs/${walk_id}/complete"
              payload: { completed_date: "2026-07-20", findings_summary: "OK", recommendations_count: 0 }
              as: FirstResponder
            - call: "POST /emergency-operations-plans"
              payload: { site_id: "${site_id}", title: "EOP 2026", plan_version_label: "v1", content_summary: "Procedures", review_due_date: "2027-08-01" }
              as: SchoolSafetyOfficer
              captures: { eop_id: $.data.id }
            - call: "POST /emergency-operations-plans/${eop_id}/submit"
              as: SchoolSafetyOfficer
            - call: "POST /emergency-operations-plans/${eop_id}/decide"
              payload: { decision: APPROVE }
              as: DistrictSafetyCoordinator
            - call: "POST /emergency-operations-plans/${eop_id}/activate"
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill_id}/start"
              as: SchoolSafetyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:04:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill_id}/complete"
              as: SchoolSafetyOfficer
            - call: "POST /drill-events/${drill_id}/after-action-reviews"
              payload: { findings_summary: "Good drill", overall_rating: MEETS, evacuation_assessment: MET_STANDARD }
              as: SchoolSafetyOfficer
              captures: { aar_id: $.data.id }
            - call: "POST /after-action-reviews/${aar_id}/submit"
              as: SchoolSafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /after-action-reviews/${aar_id}/decide"
              payload: { decision: ACCEPT }
              as: Principal
              as_user_id: "principal-1"
            - call: "POST /after-action-reviews/${aar_id}/corrective-actions"
              payload: { description: "Replace gate signage", priority: HIGH, due_date: "2026-10-15", assignee_name: "Facilities Lead" }
              as: SchoolSafetyOfficer
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: { decision: VERIFY }
              as: DistrictSafetyCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE; action remains OPEN; review remains ACCEPTED"

      - name: submit_stale_report_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ComplianceReport.DRAFT_to_STALE, state_machines.ComplianceReport.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "A report whose snapshot went STALE cannot be submitted; it must be regenerated first."
        test_recipe:
          setup: ["site with FIRE requirement; drill scheduled 2026-09-10; DRAFT report generated; clock advanced to 2026-09-11 so the drill went MISSED and the report STALE"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Cedar Grove High", enrollment_count: 1200, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-10", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
            - call: "POST /compliance-reports"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: DistrictSafetyCoordinator
          trigger:
            - call: "POST /compliance-reports/${rep_id}/submit"
              as: DistrictSafetyCoordinator
              captures: { err_id: $.data.error_id }
            - call: "POST /compliance-reports/${rep_id}/regenerate"
              as: DistrictSafetyCoordinator
            - call: "POST /compliance-reports/${rep_id}/submit"
              as: DistrictSafetyCoordinator
          assert:
            - "first submit: error_id == ERR_INVALID_STATE"
            - "after regenerate: report status DRAFT, then submit succeeds -> SUBMITTED"

      - name: eop_activate_supersedes_previous_active
        claim_type: side_effect_execution
        grounds: [state_machines.EmergencyOperationsPlan.APPROVED_to_ACTIVE]
        distinguishing_aspect: "Activating a second plan at a site supersedes the currently ACTIVE one; exactly one plan is ACTIVE at any time."
        test_recipe:
          setup: ["site with CURRENT site plan and in-window walkthrough; plan A ACTIVE; plan B APPROVED"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Maplewood K-8", enrollment_count: 850, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /site-plan-documents"
              payload: { site_id: "${site_id}", document_title: "Floor Plan 2026", issued_on: "2026-07-01", review_by_date: "2027-01-15", coverage_tags: ["FLOOR_PLANS", "ACCESS_POINTS"] }
              as: SchoolSafetyOfficer
            - call: "POST /walkthroughs"
              payload: { site_id: "${site_id}", agency: FIRE, scheduled_date: "2026-07-20" }
              as: SchoolSafetyOfficer
              captures: { walk_id: $.data.id }
            - call: "POST /walkthroughs/${walk_id}/complete"
              payload: { completed_date: "2026-07-20", findings_summary: "OK", recommendations_count: 0 }
              as: FirstResponder
            - call: "POST /emergency-operations-plans"
              payload: { site_id: "${site_id}", title: "EOP 2026", plan_version_label: "v2026.0", content_summary: "Procedures", review_due_date: "2027-08-01" }
              as: SchoolSafetyOfficer
              captures: { eop_a: $.data.id }
            - call: "POST /emergency-operations-plans/${eop_a}/submit"
              as: SchoolSafetyOfficer
            - call: "POST /emergency-operations-plans/${eop_a}/decide"
              payload: { decision: APPROVE }
              as: DistrictSafetyCoordinator
            - call: "POST /emergency-operations-plans/${eop_a}/activate"
              as: DistrictSafetyCoordinator
            - call: "POST /emergency-operations-plans"
              payload: { site_id: "${site_id}", title: "EOP 2026 rev", plan_version_label: "v2026.1", content_summary: "Procedures revised", review_due_date: "2027-08-01" }
              as: SchoolSafetyOfficer
              captures: { eop_b: $.data.id }
            - call: "POST /emergency-operations-plans/${eop_b}/submit"
              as: SchoolSafetyOfficer
            - call: "POST /emergency-operations-plans/${eop_b}/decide"
              payload: { decision: APPROVE }
              as: DistrictSafetyCoordinator
          trigger:
            - call: "POST /emergency-operations-plans/${eop_b}/activate"
              as: DistrictSafetyCoordinator
          assert:
            - "EmergencyOperationsPlan.${eop_b}.status == ACTIVE"
            - "EmergencyOperationsPlan.${eop_a}.status == SUPERSEDED"

      - name: walkthrough_missed_by_clock_sweep
        claim_type: side_effect_execution
        grounds: [state_machines.FirstResponderWalkthrough.SCHEDULED_to_MISSED]
        distinguishing_aspect: "A walkthrough not completed by its scheduled_date flips to MISSED on the next clock advance (system auto-transition)."
        test_recipe:
          setup: ["site exists; walkthrough scheduled 2026-09-10"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harborview Middle", enrollment_count: 700, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /walkthroughs"
              payload: { site_id: "${site_id}", agency: POLICE, scheduled_date: "2026-09-10" }
              as: SchoolSafetyOfficer
              captures: { walk_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: DistrictSafetyCoordinator
          assert:
            - "FirstResponderWalkthrough.${walk_id}.status == MISSED"

      - name: site_plan_expiry_by_clock_sweep
        claim_type: side_effect_execution
        grounds: [state_machines.SitePlanDocument.CURRENT_to_EXPIRED]
        distinguishing_aspect: "A CURRENT site plan whose review_by_date has passed flips to EXPIRED on clock advance, which then blocks EOP submission."
        test_recipe:
          setup: ["site with CURRENT site plan (review_by 2026-09-01) and in-window walkthrough; EOP in DRAFT"]
          setup_api_calls:
            - call: "POST /sites"
