            - { call: "GET /conf/outreach-tasks", payload: { family_id: "${fam}" }, as: FrontOfficeStaff }
          assert:
            - "Family.status == RESTRICTED and no_show_strike_count == 2 (threshold reached by the second mark)"
            - "Booking b3 (slot starts 15:50 > clock 15:46) == CANCELLED with cancel_reason FAMILY_RESTRICTED"
            - "InterpreterRequest r3 == CANCELLED (cancelled because b3 was cancelled)"
            - "Slot s2 == OPEN (window IN_PROGRESS, so no promotion runs)"
            - "outreach list for the family contains exactly 2 tasks, both kind NO_SHOW_FOLLOW_UP, status OPEN"

      - name: teacher_deactivation_cascade_depth4
        grounds:
          - state_machines.Teacher.ACTIVE_to_INACTIVE
          - state_machines.TimeSlot.OPEN_to_RETIRED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Depth-4 chain from a different trigger (teacher PATCH, not attendance): deactivate
          teacher -> all 8 slots RETIRED (OPEN/BLOCKED directly; BOOKED via cancellation) ->
          CONFIRMED bookings CANCELLED with TEACHER_INACTIVE -> InterpreterRequest ASSIGNED on
          one of them CANCELLED, releasing Interpreter.committed_minutes 20 -> 0; the WAITING
          waitlist entry for the teacher is WITHDRAWN.
        test_recipe:
          setup:
            - "Window BOOKING_OPEN; teacher T2 with 8 slots; interpreter I (es)"
            - "Family FC: student c1 booked on T2 slot 0 with interpreter_language es; request r ASSIGNED to I (committed_minutes 20)"
            - "Family FD: student d1 booked on T2 slot 1"
            - "Family FE: student e1 WAITING on the waitlist for T2"
