      - name: reversing_an_already_reversed_dob_record_or_ledger_entry_is_refused
        claim_type: idempotency
        grounds:
          - validations.priority_35
          - state_machines.MitigationProject
          - entities.DuplicationOfBenefitsRecord.fields.status
          - entities.ProgramIncomeLedgerEntry.fields.status
        distinguishing_aspect: |
          Reversal is not idempotent by design on either ledger-like entity: the first reverse moves
          the row to REVERSED and re-derives its rollup, the second returns 409 ERR_ALREADY_REVERSED
          from both endpoints, and the rollups (Parcel.dob_deduction_total_cents 0 and
          MitigationProject.program_income_balance_cents 0) do not double-subtract.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject with one parcel carrying one ACTIVE DOB record of 900000 (NFIP_CLAIM, factor 1.00) and one ACTIVE program-income entry of 100000 (federal share 75000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /mitigation-projects"
