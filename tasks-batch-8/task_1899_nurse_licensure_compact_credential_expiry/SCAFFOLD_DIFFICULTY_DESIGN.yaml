            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-04T07:00:00Z", ends_at: "2026-08-04T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1" }
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-05T07:00:00Z", ends_at: "2026-08-05T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1" }
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-06T07:00:00Z", ends_at: "2026-08-06T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1" }
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-07T07:00:00Z", ends_at: "2026-08-07T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { sh5: "$.data.id" } }
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-08T07:00:00Z", ends_at: "2026-08-08T15:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { err: "$.data.error_id" } }
          assert:
            - "All five 12h bookings succeed (each window total <= 3600 minutes; the 5th lands at exactly 3600 == cap and is ALLOWED)"
            - "ShiftAssignment.${sh1}.hours == 12.0 (round_half_up(720/60, 2))"
            - "The 6th booking (2026-08-08 07:00-15:00, 480 minutes) fails 422 with error_id == 'ERR_WEEKLY_HOURS_EXCEEDED': its window [2026-08-02, 2026-08-09) contains all five prior shifts -> 3600 + 480 = 4080 > 3600"
            - "Exactly 5 ShiftAssignments exist for ${n_id} (GET /credentialing/shift-assignments?nurse_id=${n_id})"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: shift_creation_gated_on_nurse_posture
        grounds:
          - state_machines.ShiftAssignment
          - entities.Nurse.fields.credential_posture
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair (ShiftAssignment -> Nurse): the shift-create transition is valid only while
          the NURSE is ACTIVE/CLEAR; an expiry-driven posture flip rejects creation, and license
          renewal restoring CLEAR makes the identical request succeed.
        test_recipe:
          setup:
            - "Clock 2026-08-01; mandatory ROLLING requirement; unit MED; nurse Gina ACTIVE/CLEAR with license expiring 2026-08-20, BLS 2027-03-31, competency CURRENT; clock moves to 2026-08-21 and the sweep expires the license (posture SCHEDULING_SUSPENDED)."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "ANNUAL_SKILLS", name: "Annual Skills", validity_months: 12, window_mode: "ROLLING", mandatory: true, applies_to: ["STAFF", "TRAVEL", "PER_DIEM"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_id: "$.data.id" } }
            - { call: "POST /credentialing/units", payload: { name: "MED", required_cert_types: [] }, as: NurseManager, as_user_id: "mgr-1", captures: { unit_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Gina Gate", email: "gina.gate@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-GG1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2026-08-20" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "BLS", issuing_body: "AHA", obtained_on: "2026-05-01", expires_on: "2027-03-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/competency-completions", payload: { nurse_id: "${n_id}", requirement_id: "${req_id}", completed_on: "2026-07-15" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/nurses/${n_id}/activate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/_ops/expiry-sweep", payload: {}, as: SystemOperator, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-25T07:00:00Z", ends_at: "2026-08-25T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "BOARD_PORTAL" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv2_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv2_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/renew", payload: { new_expires_on: "2027-08-20" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-25T07:00:00Z", ends_at: "2026-08-25T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { sh_id: "$.data.id" } }
          assert:
            - "First create fails 409 error_id == 'ERR_NURSE_NOT_CLEAR' (cross-entity gate: ShiftAssignment creation depends on Nurse.credential_posture)"
            - "Renewal restores the license to ACTIVE and Nurse.${n_id}.credential_posture == 'CLEAR'"
            - "Second create succeeds 201; ShiftAssignment.${sh_id}.status == 'SCHEDULED'"

      - name: privilege_gated_on_home_license_state
        grounds:
          - calculations.privilege_scope_determination
          - entities.PrivilegeEvaluation.fields.resulting_status
          - state_machines.StateLicense.ACTIVE_to_SURRENDERED
        distinguishing_aspect: |
          Entity pair (PrivilegeEvaluation -> StateLicense): multistate privilege exists only while
          the PSOR home license is ACTIVE; surrendering it collapses the derived scope to NONE/[]
          and the explicit OCC-guarded re-evaluation records the NONE determination.
        test_recipe:
          setup:
            - "Clock 2026-08-01; nurse Hana (PSOR AZ) has an ACTIVE AZ multistate license; her privilege derived ELIGIBLE_MULTISTATE at attest time (one PrivilegeEvaluation row appended)."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Hana Priv", email: "hana.priv@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-HP1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/surrender", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "GET /credentialing/nurses/${n_id}", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_v: "$.data.version" } }
          trigger:
            - { call: "POST /credentialing/privilege-evaluations", payload: { nurse_id: "${n_id}", expected_nurse_version: "${n_v}" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { eval_id: "$.data.id" } }
          assert:
            - "After surrender: Nurse.${n_id}.multistate_privilege_status == 'NONE' and practice_scope == [] (derived from the license leaving ACTIVE)"
            - "PrivilegeEvaluation.${eval_id}.resulting_status == 'NONE' with trigger_reason == 'MANUAL' (explicit re-evaluation confirms the license-state-driven collapse)"
            - "GET /credentialing/privilege-evaluations?nurse_id=${n_id} returns 3 rows in order: [0] LICENSE_CHANGE/ELIGIBLE_MULTISTATE (attest), [1] LICENSE_CHANGE/NONE (surrender cascade), [2] MANUAL/NONE (this trigger)"

      - name: license_attest_gated_on_fresh_psv
        grounds:
          - state_machines.StateLicense.VERIFIED_to_ACTIVE
          - calculations.psv_freshness
          - errors[ERR_PSV_STALE]
        distinguishing_aspect: |
          Entity pair (StateLicense -> PrimarySourceVerification): the VERIFIED -> ACTIVE attest
          transition is valid only while a PSV row of the license is VERIFIED with
          valid_through >= current_date; crossing the 180-day freshness boundary rejects the
          transition until a fresh PSV is recorded.
        test_recipe:
          setup:
            - "Clock 2026-08-01; nurse Ivan exists; his license (expires 2027-06-30) is VERIFIED via a PSV recorded VERIFIED at 2026-08-01 (valid_through 2027-01-28). Clock moves to 2027-01-29 — one day past freshness."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Ivan Fresh", email: "ivan.fresh@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-IF1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2027-01-29T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
          trigger:
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "BOARD_PORTAL" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv2_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv2_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
          assert:
            - "First attest fails 422 error_id == 'ERR_PSV_STALE' (only VERIFIED PSV has valid_through 2027-01-28 < 2027-01-29); license stays VERIFIED"
            - "Second PSV records VERIFIED with verified_on == '2027-01-29' and valid_through == '2027-07-28'; the license does not change state on PSV record (already VERIFIED)"
            - "Second attest succeeds: StateLicense.${lic_id}.status == 'ACTIVE' and verified_by_user_id == 'ver-1'"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: nurse_shift_half_open_adjacency
        grounds:
          - validations[priority=7]
          - entities.ShiftAssignment.fields.starts_at
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = half-open [starts_at, ends_at) on the Nurse-time resource: an
          assignment starting exactly when another ends is NOT a conflict (adjacency allowed),
          while interior overlap and full containment are rejected. Resource = nurse availability.
        test_recipe:
          setup:
            - "Clock 2026-08-01; mandatory ROLLING requirement; unit MED; nurse Kara ACTIVE/CLEAR (license 2027-06-30, BLS 2027-03-31, competency CURRENT)."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "ANNUAL_SKILLS", name: "Annual Skills", validity_months: 12, window_mode: "ROLLING", mandatory: true, applies_to: ["STAFF", "TRAVEL", "PER_DIEM"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_id: "$.data.id" } }
            - { call: "POST /credentialing/units", payload: { name: "MED", required_cert_types: [] }, as: NurseManager, as_user_id: "mgr-1", captures: { unit_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Kara Adjacent", email: "kara.adjacent@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-KA1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "BLS", issuing_body: "AHA", obtained_on: "2026-05-01", expires_on: "2027-03-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/competency-completions", payload: { nurse_id: "${n_id}", requirement_id: "${req_id}", completed_on: "2026-07-15" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/nurses/${n_id}/activate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
          trigger:
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-10T07:00:00Z", ends_at: "2026-08-10T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { sh1: "$.data.id" } }
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-10T19:00:00Z", ends_at: "2026-08-11T07:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { sh2: "$.data.id" } }
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-10T12:00:00Z", ends_at: "2026-08-10T20:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { err_overlap: "$.data.error_id" } }
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-10T08:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { err_contained: "$.data.error_id" } }
          assert:
            - "S1 (07:00-19:00) and the ADJACENT S2 (19:00-07:00 next day) both succeed — touching endpoints are not a conflict under half-open [starts_at, ends_at) semantics"
            - "S3 (12:00-20:00, interior overlap with S1) fails 409 'ERR_SHIFT_OVERLAP'"
            - "S4 (08:00-10:00, fully contained in S1) fails 409 'ERR_SHIFT_OVERLAP'"
            - "Exactly 2 ShiftAssignments exist for ${n_id}"

      - name: session_capacity_aggregate_overlap
        grounds:
          - validations[priority=7]
          - entities.CompetencySession.fields.capacity
          - errors[ERR_SESSION_FULL]
        distinguishing_aspect: |
          Interval semantics = aggregate capacity on the CompetencySession resource: three bookings
          occupy the IDENTICAL window 2026-08-05 09:00-12:00; full overlap is tolerated while
          booked_count < capacity (adjacency/containment are irrelevant). Different semantics and
          different resource entity than the nurse-time half-open rule.
        test_recipe:
          setup:
            - "Clock 2026-08-01; a non-mandatory requirement and a session (2026-08-05 09:00-12:00, capacity 2) exist; nurses O1, O2, O3 exist."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "SKILLS_FAIR", name: "Skills Fair", validity_months: 12, window_mode: "ROLLING", mandatory: false, applies_to: ["STAFF", "TRAVEL", "PER_DIEM"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_id: "$.data.id" } }
            - { call: "POST /credentialing/competency-sessions", payload: { requirement_id: "${req_id}", title: "Skills Fair PM", starts_at: "2026-08-05T09:00:00Z", ends_at: "2026-08-05T12:00:00Z", capacity: 2 }, as: NurseManager, as_user_id: "mgr-1", captures: { sess_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Ola One", email: "ola.one@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { o1: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Omar Two", email: "omar.two@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { o2: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Ona Three", email: "ona.three@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { o3: "$.data.id" } }
          trigger:
            - { call: "POST /credentialing/competency-sessions/${sess_id}/bookings", payload: { nurse_id: "${o1}" }, as: NurseManager, as_user_id: "mgr-1", captures: { bk1: "$.data.id" } }
            - { call: "POST /credentialing/competency-sessions/${sess_id}/bookings", payload: { nurse_id: "${o2}" }, as: NurseManager, as_user_id: "mgr-1", captures: { bk2: "$.data.id" } }
            - { call: "POST /credentialing/competency-sessions/${sess_id}/bookings", payload: { nurse_id: "${o3}" }, as: NurseManager, as_user_id: "mgr-1", captures: { err: "$.data.error_id" } }
          assert:
            - "Bookings 1 and 2 succeed even though both occupy the identical session window — overlap is not, by itself, a conflict on the session resource"
            - "Booking 3 fails 409 'ERR_SESSION_FULL': the aggregate occupation (booked_count == 2 == capacity), not interval geometry, is the collision rule"
            - "CompetencySession.${sess_id}.booked_count == 2"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: shift_book_cancel_conserves_unit_hours
        grounds:
          - entities.Unit.fields.scheduled_hours_total
          - entities.Unit.fields.active_assignment_count
          - state_machines.ShiftAssignment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = the unit staffing ledger: Unit.scheduled_hours_total and
          active_assignment_count. Booking a 12h shift then cancelling it (forward + compensating
          pair) MUST leave both counters bit-identical to their pre-booking values (0.0 / 0).
        test_recipe:
          setup:
            - "Clock 2026-08-01; mandatory ROLLING requirement; unit MED with scheduled_hours_total == 0.0 and active_assignment_count == 0; nurse Pam ACTIVE/CLEAR."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "ANNUAL_SKILLS", name: "Annual Skills", validity_months: 12, window_mode: "ROLLING", mandatory: true, applies_to: ["STAFF", "TRAVEL", "PER_DIEM"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_id: "$.data.id" } }
            - { call: "POST /credentialing/units", payload: { name: "MED", required_cert_types: [] }, as: NurseManager, as_user_id: "mgr-1", captures: { unit_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Pam Ledger", email: "pam.ledger@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-PL1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "BLS", issuing_body: "AHA", obtained_on: "2026-05-01", expires_on: "2027-03-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/competency-completions", payload: { nurse_id: "${n_id}", requirement_id: "${req_id}", completed_on: "2026-07-15" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/nurses/${n_id}/activate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
          trigger:
            - { call: "POST /credentialing/shift-assignments", payload: { nurse_id: "${n_id}", unit_id: "${unit_id}", starts_at: "2026-08-10T07:00:00Z", ends_at: "2026-08-10T19:00:00Z" }, as: NurseManager, as_user_id: "mgr-1", captures: { sh_id: "$.data.id" } }
            - { call: "POST /credentialing/shift-assignments/${sh_id}/cancel", payload: {}, as: NurseManager, as_user_id: "mgr-1" }
          assert:
            - "After booking: Unit.${unit_id}.scheduled_hours_total == 12.0 and active_assignment_count == 1"
            - "After cancelling: Unit.${unit_id}.scheduled_hours_total == 0.0 and active_assignment_count == 0 — identical to the pre-booking values; the book/cancel pair conserves the unit staffing ledger"
            - "ShiftAssignment.${sh_id}.status == 'CANCELLED' with cancel_reason == 'MANUAL'"

      - name: discipline_adjudicate_resolve_conserves_encumbrance_count
        grounds:
          - entities.Nurse.fields.open_encumbrance_count
          - state_machines.DisciplinaryAction.ADJUDICATED_to_RESOLVED
          - state_machines.StateLicense.ENCUMBERED_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity = the nurse's open-encumbrance count together with the encumbered
          license's status. Adjudicate SUSTAINED (forward) then resolve at exactly the 30-day
          minimum (compensating) MUST restore open_encumbrance_count 0 and license status ACTIVE —
          a different conserved quantity than the unit hours ledger of the sibling instance.
        test_recipe:
          setup:
            - "Clock 2026-08-01; mandatory ROLLING requirement; nurse Quinn ACTIVE/CLEAR with AZ multistate license expiring 2027-06-30, BLS 2027-03-31, competency CURRENT; open_encumbrance_count == 0; a LICENSE-scope SUSPENSION action (effective 2026-08-01) is UNDER_REVIEW (acknowledged by co-1)."
          setup_api_calls:
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/competency-requirements", payload: { code: "ANNUAL_SKILLS", name: "Annual Skills", validity_months: 12, window_mode: "ROLLING", mandatory: true, applies_to: ["STAFF", "TRAVEL", "PER_DIEM"] }, as: ComplianceOfficer, as_user_id: "co-1", captures: { req_id: "$.data.id" } }
            - { call: "POST /credentialing/nurses", payload: { full_name: "Quinn Balance", email: "quinn.balance@x.com", primary_state_of_residence: "AZ", employment_type: "STAFF", hire_date: "2026-07-01" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { n_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses", payload: { nurse_id: "${n_id}", state_code: "AZ", license_number: "RN-AZ-QB1", license_class: "RN", multistate_flag: true, issued_on: "2026-06-15", expires_on: "2027-06-30" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { lic_id: "$.data.id" } }
            - { call: "POST /credentialing/state-licenses/${lic_id}/submit", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/primary-source-verifications", payload: { license_id: "${lic_id}", channel: "NURSYS" }, as: CredentialingSpecialist, as_user_id: "spec-1", captures: { psv_id: "$.data.id" } }
            - { call: "POST /credentialing/primary-source-verifications/${psv_id}/record-result", payload: { outcome: "VERIFIED" }, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/state-licenses/${lic_id}/attest", payload: {}, as: PrimarySourceVerifier, as_user_id: "ver-1" }
            - { call: "POST /credentialing/certifications", payload: { nurse_id: "${n_id}", cert_type: "BLS", issuing_body: "AHA", obtained_on: "2026-05-01", expires_on: "2027-03-31" }, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/competency-completions", payload: { nurse_id: "${n_id}", requirement_id: "${req_id}", completed_on: "2026-07-15" }, as: Nurse, as_user_id: "${n_id}" }
            - { call: "POST /credentialing/nurses/${n_id}/activate", payload: {}, as: CredentialingSpecialist, as_user_id: "spec-1" }
            - { call: "POST /credentialing/disciplinary-actions", payload: { nurse_id: "${n_id}", scope: "LICENSE", action_type: "SUSPENSION", effective_on: "2026-08-01", license_id: "${lic_id}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { da_id: "$.data.id" } }
            - { call: "POST /credentialing/disciplinary-actions/${da_id}/acknowledge", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /credentialing/disciplinary-actions/${da_id}/adjudicate", payload: { outcome: "SUSTAINED" }, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "POST /credentialing/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: SystemOperator, as_user_id: "ops-1" }
            - { call: "POST /credentialing/disciplinary-actions/${da_id}/resolve", payload: { resolution_note: "suspension served" }, as: ComplianceOfficer, as_user_id: "co-1" }
          assert:
            - "After adjudicate: Nurse.${n_id}.open_encumbrance_count == 1, StateLicense.${lic_id}.status == 'ENCUMBERED', credential_posture == 'PRACTICE_RESTRICTED'"
            - "Resolve is allowed at exactly 2026-08-31 (effective_on 2026-08-01 + MIN_ACTIVE_DAYS[SUSPENSION] 30, inclusive boundary)"
            - "After resolve: open_encumbrance_count == 0 (back to the pre-action value), license status == 'ACTIVE' (expires_on 2027-06-30 >= 2026-08-31), credential_posture == 'CLEAR' — the adjudicate/resolve pair leaves the encumbrance ledger and license status conserved"
            - "DisciplinaryAction.${da_id}.status == 'RESOLVED'"
