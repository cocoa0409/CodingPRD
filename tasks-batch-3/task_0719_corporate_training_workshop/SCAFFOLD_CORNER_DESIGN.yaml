              payload: { learner_email: "f3@x.com", learner_name: "F3" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_WAITLIST_FULL (seats and waitlist both exhausted)"

      - name: session_out_of_cohort_range_rejected
        claim_type: Temporal validation
        grounds:
          - validations[priority=9]
          - errors[ERR_SESSION_OUT_OF_RANGE]
        distinguishing_aspect: "A session whose interval falls outside the cohort [starts_at, ends_at] window returns ERR_SESSION_OUT_OF_RANGE (422)."
        test_recipe:
