            - { call: "POST /identity-protection/verification-cases", payload: { taxpayer_id: "${tp}", return_id: "${rtn}", channel: "PHONE" }, as: VerificationAgent, captures: { err: $.data.error_id } }
            - { call: "POST /identity-protection/verification-cases", payload: { taxpayer_id: "${tp}", return_id: "${rtn}", channel: "ONLINE" }, as: VerificationAgent, captures: { case: $.data.id, chan: $.data.channel } }
          assert:
