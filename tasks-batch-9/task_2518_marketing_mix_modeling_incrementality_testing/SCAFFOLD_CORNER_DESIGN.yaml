      - name: calibration_record_links_experiment_and_model_run
        claim_type: cross_reference_link
        grounds:
          - "endpoints POST /mmm/calibration-records input [model_run_id, channel_id, experiment_id, expected_model_run_version], roles [Modeler]"
          - "calculations.calibration_multiplier formula - model_implied_lift_pct, experiment_lift_pct copied and never recomputed, calibration_multiplier, bias_direction with CALIBRATION_ALIGNMENT_BAND 0.05"
          - "validations priority 20 (existence) - a body foreign key that does not resolve returns the matching ERR_*_NOT_FOUND (404)"
          - "state_machines ModelRun calibration_status=NOT_REQUIRED -> PENDING_CALIBRATION on a filed record"
        distinguishing_aspect: |
          The record is the join row between one ChannelContribution and one Experiment, and it derives its
          own fields from BOTH sides: the run supplies model_implied_lift_pct 18.8835 (3653.3333 units
          against the 19346.6667 non-A_SEARCH remainder) while the experiment supplies experiment_lift_pct
          10.00 verbatim, giving calibration_multiplier 0.5296 and bias_direction OVER_ATTRIBUTED - and a
          record whose experiment_id does not resolve is a 404 before any of that is computed.
          
