      - name: corner_clock_advance_marks_overdue_bills_delinquent
        claim_type: side_effect_execution
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - state_machines.GrazingBill.ISSUED_to_DELINQUENT
          - calculations.permittee_outstanding_balance
          - constants.PAYMENT_TERM_DAYS
        distinguishing_aspect: "Delinquency is strict: on the due date itself nothing happens, and one day later the same call flips the bill to DELINQUENT, the permittee to DEBT_FLAGGED and the permit's account_status to DELINQUENT while permit_status stays ISSUED. Paying in full reverses all three, so the derived standing tracks bill status and not just the balance."
        test_recipe:
          setup:
            - "One ISSUED 2026 AOI whose PRELIMINARY_USE bill totals 17200 cents with due_date 2026-08-31 (the default clock 2026-08-01 plus PAYMENT_TERM_DAYS = 30)"
          setup_api_calls:
            - call: "POST /allotments"
