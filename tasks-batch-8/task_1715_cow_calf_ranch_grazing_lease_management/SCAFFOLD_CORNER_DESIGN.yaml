        distinguishing_aspect: "A request with no X-User-ID / X-User-Role headers fails priority 1 before role, existence, or body checks."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "Test harness omits both auth headers for this call: ${err} == ERR_MISSING_OR_INVALID_CONTEXT_HEADER and HTTP 400"

      - name: exposure_exceeds_group_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_EXPOSURE_EXCEEDS_GROUP]"]
        distinguishing_aspect: "exposed_head_count 61 > group head_count 60 rejects season creation; exactly 60 passes."
        test_recipe:
          setup: ["Ranch R; group G 60 cows"]
          setup_api_calls:
            - { call: "POST /api/ranches", payload: { name: "R", hq_state: "MT" }, as: RanchManager, captures: { ranch_id: $.data.id } }
            - { call: "POST /api/herd-groups", payload: { ranch_id: "${ranch_id}", group_name: "G", animal_class: "MATURE_COW", head_count: 60, avg_weight_lbs: 1000 }, as: HerdManager, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /api/breeding-seasons", payload: { ranch_id: "${ranch_id}", herd_group_id: "${g}", season_year: 2026, planned_turnout_date: "2026-04-15", planned_removal_date: "2026-06-15", exposed_head_count: 61 }, as: HerdManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/breeding-seasons", payload: { ranch_id: "${ranch_id}", herd_group_id: "${g}", season_year: 2026, planned_turnout_date: "2026-04-15", planned_removal_date: "2026-06-15", exposed_head_count: 60 }, as: HerdManager, captures: { s: $.data.id } }
          assert:
