              payload: { member_id: "${e2_m}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { e2_cyc: $.data.id }
            - call: "POST /kidswear/cycles/${e2_cyc}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/boxes"
              payload: { cycle_id: "${e2_cyc}" }
