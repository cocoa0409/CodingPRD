        grounds:
          - calculations.ocean_freight_charge
        distinguishing_aspect: "FCL branch (not exercised in §1.8's LCL instance): per-container rate x count, THC per container, no minimum floor; pins the exact decomposition 370000 + 37000 + 50000 + 7500 = 464500."
        test_recipe:
          setup: ["Shipper, published FCL tariff 40HC @185000, active contract, voyage BOOKING_OPEN"]
          setup_api_calls:
            - { call: "POST /freight/shippers", payload: { legal_name: "ACME FCL", credit_limit_cents: 100000000 }, as: OperationsManager, captures: { s: $.data.id } }
