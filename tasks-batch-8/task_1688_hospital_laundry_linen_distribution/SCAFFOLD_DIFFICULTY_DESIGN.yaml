# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Hospital Laundry & Linen Distribution
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: vendor_invoice_provisional_vs_final_weight_vs_pieces
        grounds:
          - calculations.provisional_invoice_total
          - calculations.final_invoice_total
          - entities.VendorInvoice.fields.provisional_total_cents
          - entities.VendorInvoice.fields.final_total_cents
        distinguishing_aspect: |
          Vendor-billing domain: the SAME manifest yields provisional 890 cents
          (weight-based) vs final 810 cents (piece-count reconciled) — two valid
          algorithms, different results, on the invoice/manifest entity domain.
        test_recipe:
          setup:
            - "Facility rate 40 c/lb, isolation surcharge 0.25, no cap"
            - "Unit ICU (CRITICAL) with par 20 on S1 (FLATWORK sheet, 2.00 lbs) and par 30 on S2 (ISOLATION gown, 0.50 lbs)"
            - "Run r1 filled unit to par; run r2 collected S1 x8 + S2 x10 and restocked"
            - "Manifest m1 over r2: S1 16.00 lbs, S2 5.00 lbs isolation-flagged, ack true"
            - "m1 returned S1 7 pieces, S2 10 pieces; reconciled"
            - "Invoice over m1, period 2026-08-01..2026-08-07, 50 adjusted patient days"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "ISO-GOWN", display_name: "Isolation Gown", category: "ISOLATION", piece_weight_lbs: 0.50, unit_cost_cents: 300, max_wash_cycles: 30, reorder_point_pieces: 10, opening_pieces: 200, opening_reserve_pieces: 20 }, as: LinenManager, as_user_id: "lm-1", captures: { s2: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1", captures: { p1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s2}", base_par_quantity: 30, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1", captures: { p2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r1}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r2: $.data.id } }
            - { call: "POST /cart-runs/${r2}/complete", payload: { soiled_lines: [ { stock_id: "${s1}", pieces: 8 }, { stock_id: "${s2}", pieces: 10 } ], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r2}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [ "${r2}" ], lines: [ { stock_id: "${s1}", weight_lbs: 16.00, isolation_flag: false }, { stock_id: "${s2}", weight_lbs: 5.00, isolation_flag: true } ], isolation_protocol_ack: true }, as: EVSOperator, as_user_id: "evs-1", captures: { m1: $.data.id } }
            - { call: "POST /soiled-manifests/${m1}/return", payload: { returned_lines: [ { stock_id: "${s1}", pieces: 7, condemned_pieces: 0 }, { stock_id: "${s2}", pieces: 10, condemned_pieces: 0 } ] }, as: LaundryVendor, as_user_id: "ven-1" }
            - { call: "POST /soiled-manifests/${m1}/reconcile", payload: {}, as: LinenManager, as_user_id: "lm-1" }
          trigger:
            - { call: "POST /invoices", payload: { facility_id: "${fac}", manifest_ids: [ "${m1}" ], period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-07T00:00:00Z", period_adjusted_patient_days: 50 }, as: LinenManager, as_user_id: "lm-1", captures: { inv: $.data.id, prov: $.data.provisional_total_cents } }
            - { call: "POST /invoices/${inv}/finalize", payload: {}, as: LinenManager, as_user_id: "lm-2", captures: { fin: $.data.final_total_cents, billed: $.data.billed_total_cents, cpd: $.data.cost_per_apd_cents } }
          assert:
            - "provisional_total_cents == 890  (640 + 200 + 50 isolation surcharge, weight-based)"
            - "final_total_cents == 810  (7*80 + 10*20 + 50, piece-count reconciled)"
            - "billed_total_cents == 810"
            - "cost_per_apd_cents == 16.20"
            - "provisional_total_cents != final_total_cents for identical manifest data"

      - name: facility_cost_per_apd_posted_vs_accrual
        grounds:
          - calculations.cost_per_adjusted_patient_day
          - endpoints[GET /facilities/{facilityId}/metrics]
        distinguishing_aspect: |
          Facility-metrics domain (distinct from vendor billing): posted basis
          (SETTLED invoices only) yields 11.20 while accrual basis (open invoices
          included) yields 9.07 for identical underlying data.
        test_recipe:
          setup:
            - "Facility (no cap), unit ICU, stock S1 (2.00 lbs, 40 c/lb rate), par 20"
            - "Cycle 1: run fill, run soiled 8, manifest 16.00 lbs returned 7, reconciled; invoice inv1 (apd 50) FINALIZED then SETTLED at 560"
            - "Cycle 2: run soiled 10, manifest 20.00 lbs returned 10, reconciled; invoice inv2 (apd 100) FINALIZED at 800, NOT settled"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1", captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r1}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r2: $.data.id } }
            - { call: "POST /cart-runs/${r2}/complete", payload: { soiled_lines: [ { stock_id: "${s1}", pieces: 8 } ], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r2}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [ "${r2}" ], lines: [ { stock_id: "${s1}", weight_lbs: 16.00, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m1: $.data.id } }
            - { call: "POST /soiled-manifests/${m1}/return", payload: { returned_lines: [ { stock_id: "${s1}", pieces: 7, condemned_pieces: 0 } ] }, as: LaundryVendor, as_user_id: "ven-1" }
            - { call: "POST /soiled-manifests/${m1}/reconcile", payload: {}, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /invoices", payload: { facility_id: "${fac}", manifest_ids: [ "${m1}" ], period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-07T00:00:00Z", period_adjusted_patient_days: 50 }, as: LinenManager, as_user_id: "lm-1", captures: { inv1: $.data.id } }
            - { call: "POST /invoices/${inv1}/finalize", payload: {}, as: LinenManager, as_user_id: "lm-2" }
            - { call: "POST /invoices/${inv1}/settle", payload: {}, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-03T08:00:00Z", scheduled_end: "2026-08-03T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r3: $.data.id } }
            - { call: "POST /cart-runs/${r3}/complete", payload: { soiled_lines: [ { stock_id: "${s1}", pieces: 10 } ], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r3}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [ "${r3}" ], lines: [ { stock_id: "${s1}", weight_lbs: 20.00, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m2: $.data.id } }
            - { call: "POST /soiled-manifests/${m2}/return", payload: { returned_lines: [ { stock_id: "${s1}", pieces: 10, condemned_pieces: 0 } ] }, as: LaundryVendor, as_user_id: "ven-1" }
            - { call: "POST /soiled-manifests/${m2}/reconcile", payload: {}, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /invoices", payload: { facility_id: "${fac}", manifest_ids: [ "${m2}" ], period_start: "2026-08-08T00:00:00Z", period_end: "2026-08-14T00:00:00Z", period_adjusted_patient_days: 100 }, as: LinenManager, as_user_id: "lm-1", captures: { inv2: $.data.id } }
            - { call: "POST /invoices/${inv2}/finalize", payload: {}, as: LinenManager, as_user_id: "lm-2" }
          trigger:
            - { call: "GET /facilities/${fac}/metrics", payload: {}, as: LinenManager, as_user_id: "lm-1", captures: { posted: $.data.cost_per_apd_posted_cents, accrual: $.data.cost_per_apd_accrual_cents } }
          assert:
            - "cost_per_apd_posted_cents == 11.20   (560/50, SETTLED only)"
            - "cost_per_apd_accrual_cents == 9.07    ((560+800)/(50+100), open invoices included)"
            - "posted_invoice_count == 1"
            - "accrual_invoice_count == 2"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: restock_quantity_nested_min_with_surge_and_critical_triage
        grounds:
          - calculations.restock_quantity
          - state_machines.SurgeEvent.DECLARED_to_ACTIVE
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — surge-raised
          effective_par (30), zero on_hand, CRITICAL stock posture halving the
          deficit for a STANDARD unit, and the min() against in_circulation.
        test_recipe:
          setup:
            - "Facility; stock S1 FLATWORK reorder_point 25, opening 24, reserve 0 -> posture CRITICAL from creation"
            - "Unit 4W (STANDARD), par base 20 -> effective 30 under surge x1.5"
            - "Surge DECLARED then ACTIVE (reserve 0 -> no allocations)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "4 West", unit_tier: "STANDARD" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 25, opening_pieces: 24, opening_reserve_pieces: 0 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1", captures: { p1: $.data.id } }
            - { call: "POST /surge-events", payload: { facility_id: "${fac}", severity: "LEVEL_1", par_multiplier: 1.5, starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-10T00:00:00Z" }, as: LinenManager, as_user_id: "lm-1", captures: { sg: $.data.id } }
            - { call: "POST /surge-events/${sg}/activate", payload: {}, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-03T08:00:00Z", scheduled_end: "2026-08-03T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1", captures: { restock: $.data.restock_lines, shortage: $.data.shortage_flag } }
          assert:
            - "restock_lines == [ { stock_id: ${s1}, pieces: 15 } ]  (deficit 30 halved to 15 by CRITICAL/STANDARD triage; min(15, 24) = 15)"
            - "ParLevel.${p1}.on_hand == 15 and effective_par == 30"
            - "LinenStock.${s1}.in_circulation == 9"
            - "shortage_flag == false  (delivered amount equals post-triage owed)"

      - name: provisional_total_rounds_per_line_then_sums
        grounds:
          - calculations.provisional_invoice_total
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round each line to cents
          first, then sum. Two 0.0125 lb lines at 40 c/lb give 0.5 c each:
          per-line-then-sum yields 2 cents; sum-then-round would yield 1.
        test_recipe:
          setup:
            - "Facility rate 40 c/lb; two stocks with tiny weighed lines 0.0125 lbs each"
            - "Manifest with both lines (no cart runs; dock-scale direct weighing)"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "TOWEL", display_name: "Bath Towel", category: "TERRY", piece_weight_lbs: 0.75, unit_cost_cents: 150, max_wash_cycles: 40, reorder_point_pieces: 15, opening_pieces: 120, opening_reserve_pieces: 0 }, as: LinenManager, as_user_id: "lm-1", captures: { s2: $.data.id } }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [], lines: [ { stock_id: "${s1}", weight_lbs: 0.0125, isolation_flag: false }, { stock_id: "${s2}", weight_lbs: 0.0125, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /invoices", payload: { facility_id: "${fac}", manifest_ids: [ "${m1}" ], period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-07T00:00:00Z", period_adjusted_patient_days: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { prov: $.data.provisional_total_cents } }
          assert:
            - "provisional_total_cents == 2  (round_half_up(0.5) + round_half_up(0.5) = 1 + 1; sum-then-round would give 1)"

      - name: billed_total_credit_evaluation_order_pinned
        grounds:
          - calculations.final_invoice_total
          - calculations.complaint_credit
          - state_machines.VendorInvoice.DISPUTED_to_FINALIZED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency broken by pinned evaluation
          order — re-finalizing after a dispute recomputes final_total (810)
          while the independently-computed credit (160) is applied exactly once,
          so billed_total is 650, not 490 or 810.
        test_recipe:
          setup:
            - "Facility; unit ICU; stock S1 (2.00 lbs -> 80 c/piece); par 20"
            - "Manifest m1: 16.00 lbs, returned 7, reconciled; invoice over m1 FINALIZED (final 810)"
            - "Complaint (STAINS, 2 pieces) VERIFIED -> credit 160 routed to invoice (billed 650)"
            - "Vendor disputes the invoice"
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "General", rate_per_lb_cents: 40, isolation_surcharge_pct: 0.25 }, as: LinenManager, as_user_id: "lm-1", captures: { fac: $.data.id } }
            - { call: "POST /units", payload: { facility_id: "${fac}", name: "ICU", unit_tier: "CRITICAL" }, as: LinenManager, as_user_id: "lm-1", captures: { u1: $.data.id } }
            - { call: "POST /linen-stocks", payload: { facility_id: "${fac}", sku: "SHEET-T", display_name: "Flat Sheet", category: "FLATWORK", piece_weight_lbs: 2.00, unit_cost_cents: 500, max_wash_cycles: 50, reorder_point_pieces: 20, opening_pieces: 100, opening_reserve_pieces: 10 }, as: LinenManager, as_user_id: "lm-1", captures: { s1: $.data.id } }
            - { call: "POST /par-levels", payload: { unit_id: "${u1}", stock_id: "${s1}", base_par_quantity: 20, cart_cycle: "DAILY" }, as: LinenManager, as_user_id: "lm-1", captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r1: $.data.id } }
            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r1}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /cart-runs", payload: { unit_id: "${u1}", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }, as: EVSOperator, as_user_id: "evs-1", captures: { r2: $.data.id } }
            - { call: "POST /cart-runs/${r2}/complete", payload: { soiled_lines: [ { stock_id: "${s1}", pieces: 8 } ], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r2}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [ "${r2}" ], lines: [ { stock_id: "${s1}", weight_lbs: 16.00, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m1: $.data.id } }
            - { call: "POST /soiled-manifests/${m1}/return", payload: { returned_lines: [ { stock_id: "${s1}", pieces: 7, condemned_pieces: 0 } ] }, as: LaundryVendor, as_user_id: "ven-1" }
            - { call: "POST /soiled-manifests/${m1}/reconcile", payload: {}, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /invoices", payload: { facility_id: "${fac}", manifest_ids: [ "${m1}" ], period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-07T00:00:00Z", period_adjusted_patient_days: 50 }, as: LinenManager, as_user_id: "lm-1", captures: { inv: $.data.id } }
            - { call: "POST /invoices/${inv}/finalize", payload: {}, as: LinenManager, as_user_id: "lm-2" }
            - { call: "POST /complaints", payload: { unit_id: "${u1}", manifest_id: "${m1}", stock_id: "${s1}", complaint_type: "STAINS", pieces_affected: 2 }, as: UnitClerk, as_user_id: "${u1}", captures: { c1: $.data.id } }
            - { call: "POST /complaints/${c1}/verify", payload: {}, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /invoices/${inv}/dispute", payload: {}, as: LaundryVendor, as_user_id: "ven-1" }
          trigger:
            - { call: "POST /invoices/${inv}/finalize", payload: {}, as: LinenManager, as_user_id: "lm-2", captures: { fin: $.data.final_total_cents, cred: $.data.credit_total_cents, billed: $.data.billed_total_cents } }
          assert:
            - "final_total_cents == 810 after re-finalize"
            - "credit_total_cents == 160 (applied exactly once, not recomputed from the new total)"
            - "billed_total_cents == 650"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: cart_run_dispute_recount_cycle
        grounds:
          - state_machines.CartExchangeRun.COMPLETED_to_DISPUTED
          - state_machines.CartExchangeRun.DISPUTED_to_RECOUNTED
          - state_machines.CartExchangeRun.RECOUNTED_to_DISPUTED
        distinguishing_aspect: |
          CartExchangeRun is cyclic: COMPLETED -> DISPUTED -> RECOUNTED ->
          DISPUTED loops with compensating recount deltas (on_hand 20 -> 22 after
          correcting soiled 8 -> 6), unlike a linear pipeline.
        test_recipe:
          setup:
            - "Facility; unit ICU; stock S1 par 20, opening 100"
            - "Run r1 filled to par and reconciled; run r2 completed with soiled S1 x8 (on_hand back to 20, in_wash 8)"
