              payload: { legal_name: "Single Barbers", establishment_type: "BARBERSHOP", county_code: "ACG", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/infection-incidents"
              payload: { establishment_id: "${est_id}", case_count: 1, onset_date: "2026-07-30", suspected_practitioner_id: "${prac_id}", narrative: "One client reported a razor-site infection." }
              as: HealthAuthorityLiaison
              as_user_id: "hal-002"
              captures: { inc_id: $.data.id }
            - call: "POST /cosmetology/infection-incidents/${inc_id}/notification"
              payload: { health_authority_reference: "HD-2026-0512" }
              as: HealthAuthorityLiaison
              as_user_id: "hal-002"
          trigger:
            - call: "POST /cosmetology/infection-incidents/${inc_id}/resolution"
              payload: { resolution: "SUBSTANTIATED", findings_summary: "Razor was reused without disinfection between clients." }
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "HTTP status is 200"
            - "InfectionIncident.${inc_id}.status == RESOLVED_SUBSTANTIATED"
            - "Practitioner.${prac_id}.sanction_points == 10.00"
            - "Practitioner.${prac_id}.license_status == ACTIVE"
            - "Practitioner.${prac_id}.suspension_cause_points is null"
            - "GET /cosmetology/ledger-entries?practitioner_id=${prac_id}&ledger_type=SANCTION_POINTS returns total_count == 1 whose entry_reason == INFECTION_SANCTION_ASSESSMENT and delta_points == 10.00"
            - "Establishment.${est_id}.demerit_balance == 0.00 and compliance_posture == CLEAR"
            - "GET /cosmetology/ledger-entries?establishment_id=${est_id}&ledger_type=DEMERIT_POINTS returns total_count == 0"

      - name: calculation_dual_variant_produces_two_different_scores_from_one_data_set
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: inspection_score_provisional_vs_final_on_site_credit
          rationale: "The §1.8 dual_variant_calc instance already contrasts PROVISIONAL 8.00 against FINAL 12.00 for one unchanged finding set and pins both the per-finding on_site_credit and the surviving provisional fields, which is the variant-divergence claim for inspection_adjusted_score."

      - name: calculation_dual_variant_second_pair_on_the_training_domain
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: apprentice_hour_credit_track_vs_school_equivalence_track
          rationale: "The §1.8 dual_variant_calc instance already shows APPRENTICE_TRACK (weekly 40.0 cap then x0.60 = 24.00) and SCHOOL_EQUIVALENCE_TRACK (daily 8.0 cap then x1.00 = 40.00) selected purely from license_type over a byte-identical record set, covering variant selection and both cap constants."

      - name: calculation_precision_rounds_each_component_before_aggregating
        claim_type: precision
        excluded_because:
          difficulty_instance: inspection_score_rounds_per_finding_before_summing
          rationale: "The §1.8 boundary_precision_check instance already pins the two-step round_half_up order (round each finding to 2 dp, then round the sum) with a finding set whose per-finding rounding and whose sum-then-round alternative give different cents, so the precision claim for inspection_adjusted_score is covered."

      - name: calculation_tier_multiplier_and_excess_point_surcharge_combine
        claim_type: constants_applied
        excluded_because:
          difficulty_instance: citation_fine_tier_subject_factor_and_excess_point_surcharge
          rationale: "The §1.8 combinatorial_formula instance already crosses demerit_tier_multiplier, SUBJECT_FACTOR and the EXCESS_POINT_THRESHOLD surcharge in one citation and pins the whole chain to the cent, so a separate constants_applied instance for citation_fine_amount would restate it."

  - section: validations
    instances:
      - name: validation_inspection_window_end_must_be_after_window_start
        claim_type: violation_to_error
        grounds:
          - validations.priority_20.ERR_INVALID_REQUEST
          - endpoints.POST_/cosmetology/inspections
        distinguishing_aspect: "The pairing rule is strict inequality, so an inspection window whose end equals its start is refused with 400 ERR_INVALID_REQUEST at priority 20 — it is not a zero-length but valid window — while a one-millisecond window is accepted."
        test_recipe:
          setup:
            - "One establishment 'Window Salon'."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Window Salon", establishment_type: "SALON", county_code: "ACH", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T09:00:00Z", inspector_user_id: "insp-060" }
              as: Inspector
              as_user_id: "insp-060"
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T09:00:00.001Z", inspector_user_id: "insp-060" }
              as: Inspector
              as_user_id: "insp-060"
              captures: { insp_id: $.data.id }
          assert:
            - "the equal-endpoint call returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the one-millisecond call returns HTTP 201"
            - "Inspection.${insp_id}.window_end_at == 2026-08-03T09:00:00.001Z"
            - "GET /cosmetology/inspections?establishment_id=${est_id} returns total_count == 1"

      - name: validation_complaint_reference_is_required_for_a_complaint_driven_inspection
        claim_type: conditional_validation
        grounds:
          - validations.priority_20.ERR_INVALID_REQUEST
          - entities.Inspection.fields.complaint_reference
        distinguishing_aspect: "complaint_reference is conditionally required, keyed on inspection_type: a COMPLAINT_DRIVEN inspection without it is a 400, and the very same window succeeds once the reference is supplied — proving the rule is on the field's presence relative to the type, not on the window."
        test_recipe:
          setup:
            - "One establishment 'Complaint Salon'."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Complaint Salon", establishment_type: "SALON", county_code: "ACJ", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "COMPLAINT_DRIVEN", window_start_at: "2026-08-05T09:00:00Z", window_end_at: "2026-08-05T12:00:00Z", inspector_user_id: "insp-061" }
              as: Inspector
              as_user_id: "insp-061"
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "COMPLAINT_DRIVEN", window_start_at: "2026-08-05T09:00:00Z", window_end_at: "2026-08-05T12:00:00Z", inspector_user_id: "insp-061", complaint_reference: "CMP-2026-0731" }
              as: Inspector
              as_user_id: "insp-061"
              captures: { insp_id: $.data.id }
          assert:
            - "the call without complaint_reference returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "the call with complaint_reference returns HTTP 201"
            - "Inspection.${insp_id}.complaint_reference == CMP-2026-0731"
            - "Inspection.${insp_id}.inspection_type == COMPLAINT_DRIVEN and status == SCHEDULED"
            - "GET /cosmetology/inspections?inspection_type=COMPLAINT_DRIVEN returns total_count == 1"

      - name: validation_complaint_reference_on_a_routine_inspection_is_rejected
        claim_type: conditional_validation
        grounds:
          - validations.priority_20.ERR_INVALID_REQUEST
          - endpoints.POST_/cosmetology/inspections
        distinguishing_aspect: "The conditional pairing is two-sided: complaint_reference is FORBIDDEN on a ROUTINE inspection, so it is rejected as a 400 rather than being silently ignored the way a genuinely unknown field would be at priority 16."
        test_recipe:
          setup:
            - "One establishment 'Routine Salon'."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Routine Salon", establishment_type: "SALON", county_code: "ACK", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-05T09:00:00Z", window_end_at: "2026-08-05T12:00:00Z", inspector_user_id: "insp-062", complaint_reference: "CMP-2026-0777" }
              as: Inspector
              as_user_id: "insp-062"
          assert:
            - "HTTP status is 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "GET /cosmetology/inspections?establishment_id=${est_id} returns total_count == 0"

      - name: validation_station_capacity_upper_bound_is_inclusive_then_exceeded
        claim_type: aggregate_validation
        grounds:
          - validations.priority_80.ERR_STATION_CAPACITY_EXCEEDED
          - entities.Establishment.fields.station_count
        distinguishing_aspect: "Each workstation create is individually well formed; only the collective count trips the rule, and the comparison is inclusive — the station that brings station_count to exactly station_capacity (2) succeeds and only the third is refused with 409."
        test_recipe:
          setup:
            - "One establishment 'Capacity Salon' with station_capacity 2 and no workstations."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Capacity Salon", establishment_type: "SALON", county_code: "ACL", station_capacity: 2 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/establishments/${est_id}/workstations"
              payload: { station_number: 1, station_type: "STYLING_CHAIR" }
              as: BoardAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /cosmetology/establishments/${est_id}/workstations"
              payload: { station_number: 2, station_type: "NAIL_TABLE" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { ws2_id: $.data.id }
            - call: "POST /cosmetology/establishments/${est_id}/workstations"
              payload: { station_number: 3, station_type: "FACIAL_ROOM" }
              as: BoardAdmin
              as_user_id: "admin-001"
          assert:
            - "the station_number 2 call returns HTTP 201"
            - "Workstation.${ws2_id}.station_type == NAIL_TABLE and posting_status == MISSING_POSTING"
            - "the station_number 3 call returns HTTP 409 with data.error_id == ERR_STATION_CAPACITY_EXCEEDED"
            - "Establishment.${est_id}.station_count == 2"
            - "GET /cosmetology/workstations?establishment_id=${est_id} returns total_count == 2"

      - name: validation_duplicate_station_number_within_one_establishment_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_79.ERR_DUPLICATE_STATION_NUMBER
          - entities.Workstation.fields.station_number
        distinguishing_aspect: "Uniqueness is scoped to the establishment, not global: station_number 1 is refused a second time inside 'Unique Salon' with 409 but is perfectly legal at a different establishment, and non-contiguous numbering (jumping to 7) is accepted."
        test_recipe:
          setup:
            - "Establishment 'Unique Salon' (station_capacity 4) already has workstation 1; establishment 'Other Salon' (station_capacity 4) has none."
          setup_api_calls:
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Unique Salon", establishment_type: "SALON", county_code: "ACM", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_u_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Other Salon", establishment_type: "SALON", county_code: "ACN", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_o_id: $.data.id }
            - call: "POST /cosmetology/establishments/${est_u_id}/workstations"
              payload: { station_number: 1, station_type: "STYLING_CHAIR" }
              as: BoardAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /cosmetology/establishments/${est_u_id}/workstations"
              payload: { station_number: 1, station_type: "NAIL_TABLE" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/establishments/${est_o_id}/workstations"
              payload: { station_number: 1, station_type: "NAIL_TABLE" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { ws_o_id: $.data.id }
            - call: "POST /cosmetology/establishments/${est_u_id}/workstations"
              payload: { station_number: 7, station_type: "FACIAL_ROOM" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { ws_u7_id: $.data.id }
          assert:
            - "the duplicate call returns HTTP 409 with data.error_id == ERR_DUPLICATE_STATION_NUMBER"
            - "the other-establishment call returns HTTP 201"
            - "the station_number 7 call returns HTTP 201"
            - "Workstation.${ws_o_id}.establishment_id == ${est_o_id} and Workstation.${ws_o_id}.station_number == 1"
            - "Workstation.${ws_u7_id}.station_number == 7"
            - "Establishment.${est_u_id}.station_count == 2 and Establishment.${est_o_id}.station_count == 1"

      - name: validation_presiding_officer_may_not_be_the_conducting_inspector
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_61.ERR_SEGREGATION_OF_DUTIES
          - endpoints.POST_/cosmetology/citations/{id}/hearings
        distinguishing_aspect: "The check reaches through Citation to the Inspection's inspector_user_id: naming insp-063 as presiding officer is a 403 ERR_SEGREGATION_OF_DUTIES even though the caller is a fully authorised BoardAdmin, and a different officer on the same citation succeeds."
        test_recipe:
          setup:
            - "One MINOR violation code REC-954 (base_points 2.0, fine_cents_base 3000)."
            - "Establishment 'Duty Salon' has a FINALIZED ROUTINE inspection conducted by insp-063 scoring 2.00, and a contested ESTABLISHMENT citation on it."
          setup_api_calls:
            - call: "POST /cosmetology/violation-codes"
              payload: { code: "REC-954", category: "RECORDKEEPING", severity: "MINOR", base_points: 2.0, fine_cents_base: 3000 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { vc_id: $.data.id }
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Duty Salon", establishment_type: "SALON", county_code: "ACP", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "ROUTINE", window_start_at: "2026-08-03T09:00:00Z", window_end_at: "2026-08-03T17:00:00Z", inspector_user_id: "insp-063" }
              as: Inspector
              as_user_id: "insp-063"
              captures: { insp_id: $.data.id }
            - call: "POST /cosmetology/inspections/${insp_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "insp-063"
            - call: "POST /cosmetology/inspections/${insp_id}/findings"
              payload: { violation_code_id: "${vc_id}", observed_count: 1, corrected_on_site: false }
              as: Inspector
              as_user_id: "insp-063"
            - call: "POST /cosmetology/inspections/${insp_id}/submit"
              payload: {}
              as: Inspector
              as_user_id: "insp-063"
            - call: "POST /cosmetology/inspections/${insp_id}/finalize"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { insp_v: $.data.version }
            - call: "POST /cosmetology/citations"
              payload: { inspection_id: "${insp_id}", subject_type: "ESTABLISHMENT", expected_inspection_version: "${insp_v}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { cit_id: $.data.id }
            - call: "POST /cosmetology/citations/${cit_id}/contest"
              payload: { grounds: "The board's finding misreads the appointment book." }
              as: EstablishmentOwner
              as_user_id: "${est_id}"
          trigger:
            - call: "POST /cosmetology/citations/${cit_id}/hearings"
              payload: { presiding_officer_user_id: "insp-063", scheduled_at: "2026-08-14T10:00:00Z" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/citations/${cit_id}/hearings"
              payload: { presiding_officer_user_id: "hear-012", scheduled_at: "2026-08-14T10:00:00Z" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { hear_id: $.data.id }
          assert:
            - "the inspector-as-officer call returns HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "the hear-012 call returns HTTP 201"
            - "Hearing.${hear_id}.presiding_officer_user_id == hear-012 and round_index == 1"
            - "Citation.${cit_id}.status == HEARING_SCHEDULED"
            - "Citation.${cit_id}.hearing_round_count == 1"
            - "GET /cosmetology/citations/${cit_id}/hearings returns total_count == 1"

      - name: validation_foot_spa_cycle_gap_is_inclusive_at_exactly_five_minutes
        claim_type: temporal_validation
        grounds:
          - validations.priority_69.ERR_FOOT_SPA_CYCLE_GAP_VIOLATION
          - entities.SanitationLog.fields.occupancy_end_at
        distinguishing_aspect: "The mandatory rest gap is measured from occupancy_end_at (performed_at + contact_minutes), not from performed_at, and it is inclusive: a next cycle at 10:14 is refused with 409 while 10:15 — exactly five minutes after the 10:10 occupancy end — is accepted."
        test_recipe:
          setup:
            - "School 'Gap Academy' (required_clock_hours 16.0, ACCREDITED) and practitioner 'Yara Nyx' (NAIL_TECHNICIAN) licensed ACTIVE effective 2026-08-01T00:00:00Z."
            - "Establishment 'Gap Nails' with a FOOT_SPA workstation 1, Yara posted and her rental ACTIVE so posting_status is COMPLIANT."
            - "One FOOT_SPA_AFTER_CLIENT log already sits at 2026-07-30T10:00:00Z with contact_minutes 10, occupying the station until 10:10."
          setup_api_calls:
            - call: "POST /cosmetology/schools"
              payload: { name: "Gap Academy", county_code: "ACQ", required_clock_hours: 16.0, accreditation_status: "ACCREDITED" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { school_id: $.data.id }
            - call: "POST /cosmetology/practitioners"
              payload: { full_name: "Yara Nyx", license_type: "NAIL_TECHNICIAN", school_id: "${school_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { prac_id: $.data.id }
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${prac_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-06", discipline: "SANITATION", school_id: "${school_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/training-records"
              payload: { practitioner_id: "${prac_id}", credit_type: "SCHOOL_CLOCK_HOUR", hours: 8.0, performed_on: "2026-07-07", discipline: "DISINFECTION", school_id: "${school_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/practitioners/${prac_id}/license-actions"
              payload: { action: "GRANT_EXAM_ELIGIBILITY" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/practitioners/${prac_id}/license-actions"
              payload: { action: "ISSUE_LICENSE", effective_at: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/establishments"
              payload: { legal_name: "Gap Nails", establishment_type: "NAIL_SALON", county_code: "ACR", station_capacity: 4 }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { est_id: $.data.id }
            - call: "POST /cosmetology/establishments/${est_id}/workstations"
              payload: { station_number: 1, station_type: "FOOT_SPA" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { ws_id: $.data.id, ws_v1: $.data.version }
            - call: "POST /cosmetology/booth-rentals"
              payload: { workstation_id: "${ws_id}", practitioner_id: "${prac_id}", rental_type: "EMPLOYEE", term_start_at: "2026-08-01T00:00:00Z", monthly_rent_cents: 0, expected_workstation_version: "${ws_v1}" }
              as: BoardAdmin
              as_user_id: "admin-001"
              captures: { rental_id: $.data.id }
            - call: "POST /cosmetology/workstations/${ws_id}/posting"
              payload: { posted_practitioner_id: "${prac_id}" }
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/booth-rentals/${rental_id}/activation"
              payload: {}
              as: BoardAdmin
              as_user_id: "admin-001"
            - call: "POST /cosmetology/sanitation-logs"
              payload: { workstation_id: "${ws_id}", log_type: "FOOT_SPA_AFTER_CLIENT", performed_at: "2026-07-30T10:00:00Z", contact_minutes: 10, disinfectant_epa_reg_number: "EPA-88494-3" }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { log_first_id: $.data.id }
          trigger:
            - call: "POST /cosmetology/sanitation-logs"
              payload: { workstation_id: "${ws_id}", log_type: "FOOT_SPA_AFTER_CLIENT", performed_at: "2026-07-30T10:14:00Z", contact_minutes: 10, disinfectant_epa_reg_number: "EPA-88494-3" }
              as: Practitioner
              as_user_id: "${prac_id}"
            - call: "POST /cosmetology/sanitation-logs"
              payload: { workstation_id: "${ws_id}", log_type: "FOOT_SPA_AFTER_CLIENT", performed_at: "2026-07-30T10:15:00Z", contact_minutes: 10, disinfectant_epa_reg_number: "EPA-88494-3" }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { log_ok_id: $.data.id }
          assert:
            - "the 10:14 call returns HTTP 409 with data.error_id == ERR_FOOT_SPA_CYCLE_GAP_VIOLATION"
