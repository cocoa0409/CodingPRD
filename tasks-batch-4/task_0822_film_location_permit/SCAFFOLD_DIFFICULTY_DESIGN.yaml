              captures: { v1a_issue: $.data.version }
          trigger:
            - call: "POST /applications/${app1_id}/issue"
              payload: { expected_application_version: "${v1a_issue}" }
              as: FilmOfficeCoordinator
            - call: "GET /road-closure-bookings/${b2_id}"
              as: FilmOfficeCoordinator
              captures: { b2_status: $.data.status }
            - call: "GET /officer-assignments/${oa2_id}"
              as: FilmOfficeCoordinator
              captures: { oa2_status: $.data.status }
          assert:
            - "RoadClosureBooking.${b1_id}.status == CONFIRMED (hop 1)"
            - "RoadClosureBooking.${b2_id}.status == BLOCKED (hop 2, caused by B1 confirming on the same segment within buffer)"
            - "OfficerAssignment.${oa2_id}.status == CANCELLED (hop 3, caused by B2 being blocked)"

      - name: reject_cascade_depth2
        grounds:
          - state_machines.DepartmentReview.PENDING_to_REJECTED
          - state_machines.PermitApplication.UNDER_REVIEW_to_REVISION_REQUIRED
          - state_machines.RoadClosureBooking.PENDING_to_RELEASED
        distinguishing_aspect: "Depth-2 chain from a DIFFERENT trigger (review REJECT): review REJECTED -> app UNDER_REVIEW->REVISION_REQUIRED (hop1) -> the application's PENDING bookings -> RELEASED (hop2)."
        test_recipe:
          setup:
            - "Company + POLICE(ALL) dept + two segments; clock 2026-05-01."
