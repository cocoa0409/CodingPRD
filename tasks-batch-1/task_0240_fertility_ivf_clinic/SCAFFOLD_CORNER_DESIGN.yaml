# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Fertility / IVF Clinic — Expert tier. Breadth probe over the claim-extraction-guide
# taxonomy: every testable claim §1.8 does not already cover. Same gates as §1.8:
# structured setup_api_calls, placeholder closure, literal lock, §1.5 priority ladder.
# excluded_because stubs cite §1.8 instance names that already exercise the corner.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_patient_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Patient, endpoints]
        distinguishing_aspect: "POST /clinics/{id}/patients with full_name + date_of_birth -> 201, status defaults ACTIVE, server-minted id/created_at/version=1 present."
        test_recipe:
          setup: ["A clinic exists."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Ent Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
          trigger:
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "New Pat", date_of_birth: "1990-01-01T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id, v: $.data.version, st: $.data.status }
          assert:
            - "response.http_status == 201"
            - "Patient.${pat_id}.status == ACTIVE"
            - "Patient.${pat_id}.version == 1"

      - name: get_patient_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Patient, "errors[ERR_PATIENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /clinics/{id}/patients/{bad-uuid} -> ERR_PATIENT_NOT_FOUND 404."
        test_recipe:
          setup: ["A clinic exists; no patient with the queried id."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "NF Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
          trigger:
            - call: "GET /clinics/${clinic_id}/patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PATIENT_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_medication_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.MedicationOrder, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /clinics/{id}/medications without daily_dose_units -> ERR_VALIDATION 422."
        test_recipe:
          setup: ["A STIM cycle exists."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Req Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Req Pat", date_of_birth: "1990-01-01T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
          trigger:
            - call: "POST /clinics/${clinic_id}/medications"
              payload: { treatment_cycle_id: "${cyc_id}", drug_name: "Gonal-F", start_day_offset: 0, end_day_offset: 4, unit_price_cents: 100 }
              as: Nurse
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response.http_status == 422"

      - name: medication_line_total_computed_from_inputs
        claim_type: Computed Fields
        grounds: [calculations.medication_line_total, entities.MedicationOrder.fields.line_total_cents]
        distinguishing_aspect: "Gonal-F days [0,4] (5 days), dose 300, price 100 -> line_total_cents == 150000, computed regardless of any client-supplied value."
        test_recipe:
          setup: ["A STIM cycle exists."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Calc Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Calc Pat", date_of_birth: "1990-01-01T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
          trigger:
            - call: "POST /clinics/${clinic_id}/medications"
              payload: { treatment_cycle_id: "${cyc_id}", drug_name: "Gonal-F", start_day_offset: 0, end_day_offset: 4, daily_dose_units: 300, unit_price_cents: 100 }
              as: Nurse
              captures: { med_id: $.data.id, lt: $.data.line_total_cents }
          assert:
            - "MedicationOrder.${med_id}.line_total_cents == 150000"

      - name: create_cycle_invalid_donor_fk_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.TreatmentCycle.fields.donor_profile_id, "errors[ERR_DONOR_NOT_FOUND]"]
        distinguishing_aspect: "POST cycle with donor_profile_id pointing at a non-existent donor -> ERR_DONOR_NOT_FOUND 404 (body-FK existence check, priority 4)."
        test_recipe:
          setup: ["A clinic + patient; no donor with the given id."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "FK Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "FK Pat", date_of_birth: "1990-01-01T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}", donor_profile_id: "00000000-0000-4000-8000-000000000001" }
              as: Nurse
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DONOR_NOT_FOUND"
            - "response.http_status == 404"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_cycle_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.TreatmentCycle.DRAFT_to_CANCELLED, "errors[ERR_CYCLE_BAD_PROTOCOL_STATE]"]
        distinguishing_aspect: "Cancelling a cycle already in CANCELLED -> ERR_CYCLE_BAD_PROTOCOL_STATE 409; no side effects fire."
        test_recipe:
          setup: ["A DRAFT cycle cancelled once (now CANCELLED)."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "SM Clinic A" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "SM Pat", date_of_birth: "1990-01-01T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "GET /clinics/${clinic_id}/cycles/${cyc_id}"
              payload: {}
              as: Nurse
              captures: { v1: $.data.version }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/cancel"
              payload: { expected_cycle_version: "${v1}" }
              as: Nurse
            - call: "GET /clinics/${clinic_id}/cycles/${cyc_id}"
              payload: {}
              as: Nurse
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/cancel"
              payload: { expected_cycle_version: "${v2}" }
              as: Nurse
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CYCLE_BAD_PROTOCOL_STATE"
            - "TreatmentCycle.${cyc_id}.protocol_status == CANCELLED"

      - name: fertilize_from_stim_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TreatmentCycle.RETRIEVAL_to_FERTILIZATION, "errors[ERR_CYCLE_BAD_PROTOCOL_STATE]"]
        distinguishing_aspect: "Fertilize requires RETRIEVAL; calling it from STIM -> ERR_CYCLE_BAD_PROTOCOL_STATE 409."
        test_recipe:
          setup: ["A cycle in STIM (not yet RETRIEVAL)."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "SM Clinic B" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "SM Pat2", date_of_birth: "1990-01-01T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
          trigger:
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/fertilize"
              payload: { embryos_fertilized: 1 }
              as: Embryologist
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CYCLE_BAD_PROTOCOL_STATE"

      - name: complete_without_outcome_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.TreatmentCycle.FRESH_TRANSFER_to_COMPLETED, "errors[ERR_OUTCOME_REQUIRED]", "validations[priority=17]"]
        distinguishing_aspect: "Completing a FRESH_TRANSFER cycle with no OutcomeReport -> ERR_OUTCOME_REQUIRED 409."
        test_recipe:
          setup: ["A cycle in FRESH_TRANSFER with no outcome recorded."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "SM Clinic C" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "SM Pat3", date_of_birth: "1990-01-01T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START", "RETRIEVAL", "TRANSFER"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/retrieve"
              payload: { oocytes_retrieved: 6 }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/fertilize"
              payload: { embryos_fertilized: 3 }
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/transfer"
              payload: {}
              as: Embryologist
          trigger:
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/complete"
              payload: {}
              as: Nurse
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_OUTCOME_REQUIRED"
            - "TreatmentCycle.${cyc_id}.protocol_status == FRESH_TRANSFER"

      - name: embryos_exceed_oocytes_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.TreatmentCycle.RETRIEVAL_to_FERTILIZATION, "errors[ERR_EMBRYO_COUNT_EXCEEDS_OOCYTES]", "validations[priority=11]"]
        distinguishing_aspect: "Fertilize with embryos_fertilized 7 > oocytes_retrieved 5 -> ERR_EMBRYO_COUNT_EXCEEDS_OOCYTES 422."
        test_recipe:
          setup: ["A cycle in RETRIEVAL with oocytes_retrieved 5."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "SM Clinic D" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "SM Pat4", date_of_birth: "1990-01-01T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START", "RETRIEVAL"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/retrieve"
              payload: { oocytes_retrieved: 5 }
              as: Nurse
          trigger:
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/fertilize"
              payload: { embryos_fertilized: 7 }
              as: Embryologist
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EMBRYO_COUNT_EXCEEDS_OOCYTES"
            - "response.http_status == 422"

      - name: revert_to_stim_resets_oocytes
        claim_type: Side Effect Execution
        grounds: [state_machines.TreatmentCycle.RETRIEVAL_to_STIM, entities.TreatmentCycle.fields.oocytes_retrieved]
        distinguishing_aspect: "revert-to-stim from RETRIEVAL sets protocol_status STIM and resets oocytes_retrieved to 0."
        test_recipe:
          setup: ["A cycle in RETRIEVAL with oocytes_retrieved 9."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "SM Clinic E" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "SM Pat5", date_of_birth: "1990-01-01T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START", "RETRIEVAL"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/retrieve"
              payload: { oocytes_retrieved: 9 }
              as: Nurse
          trigger:
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/revert-to-stim"
              payload: {}
              as: Nurse
              captures: { st: $.data.protocol_status, ooc: $.data.oocytes_retrieved }
          assert:
            - "TreatmentCycle.${cyc_id}.protocol_status == STIM"
            - "TreatmentCycle.${cyc_id}.oocytes_retrieved == 0"

      - name: donor_reserved_on_cycle_create
        claim_type: Cross-entity
        grounds: [state_machines.DonorProfile.AVAILABLE_to_RESERVED, entities.DonorProfile.fields.status]
        distinguishing_aspect: "Creating a cycle linking an AVAILABLE donor flips DonorProfile.status to RESERVED (cross-entity side effect)."
        test_recipe:
          setup: ["A clinic + patient + AVAILABLE egg donor."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Donor Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Donor Pat", date_of_birth: "1990-01-01T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/donors"
              payload: { code: "D-001", donor_type: "EGG" }
              as: ClinicAdmin
              captures: { donor_id: $.data.id }
          trigger:
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}", donor_profile_id: "${donor_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
          assert:
            - "DonorProfile.${donor_id}.status == RESERVED"

      - name: store_into_already_thawed_specimen_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.CryoSpecimen.STORED_to_THAWED, "errors[ERR_SPECIMEN_BAD_STATE]"]
        distinguishing_aspect: "A THAWED specimen is terminal; calling store on it -> ERR_SPECIMEN_BAD_STATE 409."
        test_recipe:
          setup: ["A specimen stored then thawed (now THAWED)."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Term Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
              payload: { full_name: "Term Pat", date_of_birth: "1990-01-01T00:00:00.000Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms"
              payload: { form_key: "IVF_GENERAL", version_label: "v1", required_for: ["CYCLE_START", "RETRIEVAL"] }
              as: ClinicAdmin
              captures: { form_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/consent-forms/${form_id}/publish"
              payload: {}
              as: ClinicAdmin
            - call: "POST /clinics/${clinic_id}/patient-consents"
              payload: { patient_id: "${pat_id}", consent_form_id: "${form_id}" }
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /clinics/${clinic_id}/tanks"
              payload: { label: "Tank-T", capacity_slots: 2 }
              as: Embryologist
              captures: { tank_id: $.data.id, tank_v0: $.data.version }
            - call: "POST /clinics/${clinic_id}/cycles"
              payload: { patient_id: "${pat_id}" }
              as: Nurse
              captures: { cyc_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/start-stim"
              payload: {}
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/retrieve"
              payload: { oocytes_retrieved: 4 }
              as: Nurse
            - call: "POST /clinics/${clinic_id}/cycles/${cyc_id}/fertilize"
              payload: { embryos_fertilized: 2 }
              as: Embryologist
            - call: "POST /clinics/${clinic_id}/cryo-specimens"
              payload: { treatment_cycle_id: "${cyc_id}", cryo_tank_id: "${tank_id}", specimen_type: "EMBRYO" }
              as: Embryologist
              captures: { sp_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/cryo-specimens/${sp_id}/store"
              payload: { expected_tank_version: "${tank_v0}" }
              as: Embryologist
              captures: { tank_v1: $.data.version }
            - call: "POST /clinics/${clinic_id}/cryo-specimens/${sp_id}/thaw"
              payload: {}
              as: Embryologist
            - call: "GET /clinics/${clinic_id}/tanks/${tank_id}"
              payload: {}
              as: Embryologist
              captures: { tank_v2: $.data.version }
          trigger:
            - call: "POST /clinics/${clinic_id}/cryo-specimens/${sp_id}/store"
              payload: { expected_tank_version: "${tank_v2}" }
              as: Embryologist
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SPECIMEN_BAD_STATE"
            - "CryoSpecimen.${sp_id}.status == THAWED"

      - name: cancel_cascade_depth3_covered_by_difficulty
        claim_type: Cascade down
        grounds: [state_machines.TreatmentCycle.FERTILIZATION_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_cycle_depth3_specimen_tank_derived
          rationale: "The cycle-cancel -> specimen DISCARDED -> tank slot release cascade is the named §1.8 depth-3 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: cancellation_fee_tier_retrieval
        claim_type: Constants Applied
        grounds: [calculations.cancellation_fee, entities.TreatmentCycle.fields.cancellation_fee_cents]
        distinguishing_aspect: "Cancelling from RETRIEVAL applies RETRIEVAL_FEE_CENTS -> cancellation_fee_cents == 150000."
        test_recipe:
          setup: ["A cycle in RETRIEVAL."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Fee Clinic" }
              as: ClinicAdmin
              captures: { clinic_id: $.data.id }
            - call: "POST /clinics/${clinic_id}/patients"
