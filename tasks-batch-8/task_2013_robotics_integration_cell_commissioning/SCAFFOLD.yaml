  - method: POST
    path: "/robotics/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server startup default before any set call is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [FinanceAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["system transitions: TrainingSession SCHEDULED -> NO_SHOW if window elapsed; no other time-driven effects"]

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed type, or out-of-range value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state from which the transition is defined" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version mismatch on OCC-guarded write" }
  - { id: ERR_SAFETY_LEVEL_INSUFFICIENT, http: 422, condition: "Safety rules violated (high risk without PLe, or muting without curtain/PL)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Approver/reviewer equals creator/author" }
  - { id: ERR_PAYLOAD_CHECK_FAILED, http: 422, condition: "Payload margin below 20.0% or wrist inertia over limit" }
  - { id: ERR_BRAND_OUT_OF_SCOPE, http: 422, condition: "Robot brand outside integrator specialization" }
  - { id: ERR_OUTSIDE_SESSION_WINDOW, http: 422, condition: "Training start attempted outside scheduled window" }
  - { id: ERR_GUARANTEE_WINDOW_VIOLATION, http: 422, condition: "Close before window end, or waive at/after window end" }
  - { id: ERR_TRAINER_SCHEDULE_CONFLICT, http: 422, condition: "Trainer double-booked on overlapping sessions or end <= start" }
  - { id: ERR_SUPERSEDE_TARGET_INVALID, http: 422, condition: "supersedes_study_id not an APPROVED study of this project" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "project_code or program_name uniqueness violated" }
  - { id: ERR_RETENTION_OVERRELEASE, http: 422, condition: "Ledger posting would drive retention balance negative" }
  - { id: ERR_RETENTION_BALANCE_MISMATCH, http: 422, condition: "Computed milestone release exceeds current retention balance" }
  - { id: ERR_MAINTENANCE_WINDOW_INVALID, http: 422, condition: "first_due_at_hours before current meter or interval out of range" }
  - { id: ERR_GATE_PRECONDITION_UNMET, http: 422, condition: "Advance gate child-state precondition not satisfied" }

roles:
  - name: ProjectEngineer
    description: "Owns application study, safety design submission, robot selection, project advances in early phases"
    identity: "entity_backed:IntegratorUser"
    exclusive_operations:
      - "POST /robotics/cell-projects/{id}/application-studies"
      - "POST /robotics/cell-projects/{id}/safety-risk-assessments"
      - "POST /robotics/cell-projects/{id}/robot-selections"
      - "POST /robotics/cell-projects/{id}/hold, /resume"
      - "POST /robotics/integrator-orgs/{id}/customer-sites"
      - "POST /robotics/customer-sites/{id}/cell-projects"
    shared_operations:
      - "POST /robotics/cell-projects/{id}/advance (shared with SiteSupervisor; each stage pinned to one of the two)"
      - "GET reads"
  - name: SafetyLead
    description: "Approves/rejects application studies and safety risk assessments; cannot create them"
    identity: "entity_backed:IntegratorUser"
    exclusive_operations:
      - "POST /robotics/application-studies/{id}/approve, /reject"
      - "POST /robotics/safety-risk-assessments/{id}/approve, /reject"
    shared_operations: ["GET reads"]
  - name: ControlsProgrammer
    description: "Develops, simulates, peer-reviews, and releases robot programs"
    identity: "entity_backed:IntegratorUser"
    exclusive_operations:
      - "POST /robotics/cell-projects/{id}/robot-programs"
      - "POST /robotics/robot-programs/{id}/code-complete, /peer-review, /simulate, /simulate/record, /release"
    shared_operations: ["GET reads"]
  - name: SiteSupervisor
    description: "Runs acceptance tests and drives FAT/SAT/SHIP advances; locks robot selections"
    identity: "entity_backed:IntegratorUser"
    exclusive_operations:
      - "POST /robotics/cell-projects/{id}/acceptance-tests"
      - "POST /robotics/acceptance-tests/{id}/record, /fail"
      - "POST /robotics/robot-selections/{id}/lock"
    shared_operations:
      - "POST /robotics/cell-projects/{id}/advance (BUILD->FAT, FAT->SHIP, SHIP->SAT, SAT->TRAINING stages)"
      - "GET reads"
  - name: Trainer
    description: "Schedules and scores training sessions"
    identity: "entity_backed:IntegratorUser"
    exclusive_operations:
      - "POST /robotics/cell-projects/{id}/training-sessions"
      - "POST /robotics/training-sessions/{id}/start, /complete, /cancel"
    shared_operations: ["GET reads"]
  - name: ServiceManager
    description: "Owns spare-parts packages, maintenance plans, and guarantee closure"
    identity: "entity_backed:IntegratorUser"
    exclusive_operations:
      - "POST /robotics/cell-projects/{id}/spare-parts-packages"
      - "POST /robotics/spare-parts-packages/{id}/order, /deliver"
      - "POST /robotics/cell-projects/{id}/maintenance-plans"
      - "POST /robotics/maintenance-plans/{id}/activate, /suspend, /meter-reading"
      - "POST /robotics/throughput-guarantees/{id}/close"
    shared_operations: ["GET reads"]
  - name: FinanceAdmin
    description: "Org/user administration, retention ledger adjustments, guarantee waiver, project termination, clock control"
    identity: "entity_backed:IntegratorUser"
    exclusive_operations:
      - "POST /robotics/integrator-orgs"
      - "POST /robotics/integrator-orgs/{id}/users"
      - "POST /robotics/cell-projects/{id}/retention-ledger-entries"
      - "POST /robotics/throughput-guarantees/{id}/waive"
      - "POST /robotics/cell-projects/{id}/terminate"
      - "POST /robotics/_clock/set_current_utc"
    shared_operations: ["GET reads"]
