              payload: {}
              as: ComplianceOfficer
          assert:
            - "AdverseEventReport.${ae_on_time}.is_late == false (exactly at deadline is on time)"
            - "AdverseEventReport.${ae_late}.is_late == true (one second past)"
            - "After both triages, GET /irb/protocols/${proto_id}/non-compliance-cases returns exactly 1 case, with source == LATE_AE and status == OPENED"
            - "Investigator.${inv_id}.provisional_compliance_score == 95 (-5 for the open LATE_AE case)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (AgendaItem x BoardMeeting vs
  # RelianceAgreement x Protocol)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: agenda_vote_requires_convened_meeting
        grounds:
          - state_machines.AgendaItem.LISTED_to_VOTED
          - state_machines.BoardMeeting.SCHEDULED_to_CONVENED
        distinguishing_aspect: |
          Pair AgendaItem x BoardMeeting: a vote on a LISTED item is rejected
          with ERR_INVALID_STATE while its meeting is still SCHEDULED; the
          identical vote succeeds after the meeting CONVENES — the item's own
          state never changed.
        test_recipe:
          setup:
            - "5 ACTIVE members (chair, sci, nonsci, unaff, pris) so quorum threshold is 3"
            - "Protocol P AWAITING_FULL_BOARD (claimed and determined FULL_BOARD)"
            - "Meeting M SCHEDULED with P LISTED as an agenda item"
