        distinguishing_aspect: |
          At exactly 50 pages (STATE_TX, STANDARD, certified) the whole transcript bills at
          tier-1 rate => 17500 cents; at 51 pages the 51st page crosses into tier-2 marginal
          rate 270 => 17770 cents. The boundary is the >50 marginal tier crossing, reached via
          the invoice-issue endpoint.
