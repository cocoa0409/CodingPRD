# =============================================================================
# SCAFFOLD.yaml — §1.0–§1.7
# Task 2678 — Fiberglass Insulation Manufacturing
# Difficulty band: Expert+ (deliberately above the §0.4 Expert ceiling on
# coupling density, not on entity padding)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2678. Fiberglass Insulation Manufacturing (insulation manufacturing plant): glass melting and fiberization with binder application and curing oven control, product line changes across batt density, facing type and width with scrap during transition, thermal performance testing against declared values with certification program compliance, formaldehyde-free binder formulation and emissions certification, packaging compression ratios balancing freight cost against recovery at installation, roll and batt inventory with seasonal demand peaks in construction, distributor and retail channel allocation during shortages, plant emissions permitting and cullet or trim recycling into the melt

domain_name: fiberglass-insulation-manufacturing

# Flat topology: every entity is addressed through its own top-level collection
# (`/plants`, `/product-lines`, `/production-runs`, …). There is deliberately no
# nesting in URL paths — peers are joined by foreign keys in request bodies and
# discovered through filtered-list GETs. `api_prefix` is therefore the empty
# string; the "top-level resource path" is the collection segment of each entity.
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Thirteen peer entities linked by foreign keys declared in request bodies.
  # No entity is expressed as a nested URL segment of another.

  state_machine_shape: cyclic
  # Primary shape is cyclic: BinderFormulation loops
  # EMISSIONS_TESTING -> REVISION_REQUIRED -> DRAFT -> SUBMITTED -> EMISSIONS_TESTING,
  # ThermalTest loops IN_LAB -> COMPLETED -> IN_LAB across retest attempts, and
  # ProductLine loops CERTIFIED -> SUSPENDED -> PENDING_CERTIFICATION.
  # ProductionRun additionally carries two independent state dimensions
  # (`run_status` x `qc_status`) on one row, and Plant carries a posture
  # dimension (`melt_posture`) beside an emissions dimension (`emissions_status`).

  relationship_patterns:
    - one_to_many          # Plant -> ProductionRun, ProductionRun -> InventoryLot
    - many_to_many         # AllocationLine joins AllocationCycle x ChannelOrder x InventoryLot
    - self_referential     # InventoryLot.parent_lot_id -> InventoryLot.id (repack tree)
    - cross_aggregate      # ThermalTest verdict mutates ProductLine certification state

  role_model: segregation_of_duties
  # The CertificationOfficer who signs a ProductLine's certification decision
  # must not be the operator id that recorded the qualifying ThermalTest result.
  # Layered over a peer-roles split (plant floor / lab / environmental / channel).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  - name: Plant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Human-readable plant name.
      - name: site_code
        type: string
        source: input
        description: Short site identifier; unique across all Plant rows.
        constraints: "3-8 uppercase letters/digits; uniqueness enforced globally"
      - name: oven_zone_count
        type: integer
        source: input
        description: Number of independently controlled curing-oven zones.
        constraints: "1..8"
      - name: oven_length_ft
        type: number
        source: input
        description: Curing oven length in feet; drives dwell time in cure_index.
        constraints: "> 0"
      - name: production_line_count
        type: integer
        source: input
        description: Number of fiberization lines; valid line_index values are 1..production_line_count.
        constraints: "1..4"
      - name: max_cullet_fraction
        type: number
        source: input
        description: Hard permit cap on the cullet share of any single melt charge.
        default: 0.30
        constraints: "0.00..0.40, 2 decimal places"
      - name: cullet_restrict_fraction
        type: number
        source: input
        description: Year-to-date cullet-fraction level at or above which melt_posture becomes RESTRICTED.
        default: 0.28
        constraints: "0.00..max_cullet_fraction, 2 decimal places"
      - name: max_width_change_in
        type: number
        source: input
        description: Largest absolute batt-width change (inches) the mandrel/chopper set can absorb in one changeover.
        default: 8.0
        constraints: "> 0"
      - name: permit_number
        type: string
        source: input
        description: Air-emissions permit identifier on file with the regulator.
      - name: formaldehyde_allowance_kg
        type: number
        source: input
        description: Permitted formaldehyde mass (kg) per reporting period.
        constraints: "> 0, 3 decimal places"
      - name: voc_allowance_kg
        type: number
        source: input
        description: Permitted VOC mass (kg) per reporting period.
        constraints: "> 0"
      - name: cullet_received_kg_ytd
        type: number
        source: computed
        description: Running total mass of every CulletBatch ever staged at this plant (never decreases).
        default: 0.00
      - name: cullet_on_hand_kg
        type: number
        source: computed
        description: "Sum of CulletBatch.mass_kg for batches of this plant with status == STAGED."
        default: 0.00
      - name: cullet_charged_kg_ytd
        type: number
        source: computed
        description: "Sum of CulletBatch.mass_kg for batches of this plant with status == CHARGED."
        default: 0.00
      - name: cullet_rejected_kg_ytd
        type: number
        source: computed
        description: "Sum of CulletBatch.mass_kg for batches of this plant with status == REJECTED."
        default: 0.00
      - name: total_charge_kg_ytd
        type: number
        source: computed
        description: "Sum of ProductionRun.total_charge_kg for runs of this plant whose run_status is in {MELTING, CURING, PACKAGED, CLOSED}."
        default: 0.00
      - name: cullet_fraction_ytd
        type: number
        source: computed
        description: "round(cullet_charged_kg_ytd / total_charge_kg_ytd, 4); 0.0000 when total_charge_kg_ytd == 0."
        default: 0.0000
      - name: melt_posture
        type: enum
        source: computed
        description: Melt-shop posture dimension gating cullet charging and melt starts.
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: posture_reason
        type: string
        source: computed
        description: Machine-readable reason the current posture was set; null while OPEN.
        default: null
        constraints: "null | CULLET_FRACTION_AT_RESTRICT_LEVEL | EMISSIONS_EXCEEDANCE | MANUAL_OVERRIDE"
      - name: emissions_status
        type: enum
        source: computed
        description: Emissions-permit dimension, independent of melt_posture.
        default: COMPLIANT
        constraints: "COMPLIANT | REPORTED | EXCEEDANCE"
      - name: reported_formaldehyde_kg
        type: number
        source: computed
        description: Formaldehyde mass summed over the most recently reported period.
        default: 0.000000
      - name: reported_voc_kg
        type: number
        source: computed
        description: VOC mass summed over the most recently reported period.
        default: 0.0000
      - name: reported_period_start
        type: datetime
        source: computed
        description: Inclusive start of the most recently reported emissions period; null before the first report.
        default: null
      - name: reported_period_end
        type: datetime
        source: computed
        description: Exclusive end of the most recently reported emissions period; null before the first report.
        default: null
      - name: override_reason
        type: string
        source: computed
        description: Free text captured when a FROZEN posture is manually overridden to OPEN; null otherwise.
        default: null

  - name: CertificationProgram
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: Program identifier (e.g. thermal-performance certification scheme code); unique.
      - name: conformance_basis
        type: enum
        source: input
        description: Selects which variant of thermal_conformance_verdict this program uses.
        constraints: "PER_SPECIMEN | LOT_MEAN"
      - name: r_value_tolerance
        type: number
        source: input
        description: Allowed shortfall (R units) below the declared R-value before a specimen or lot mean is non-conforming.
        constraints: "> 0, 2 decimal places"
      - name: min_specimen_count
        type: integer
        source: input
        description: Minimum number of specimen R-values a recorded result must carry.
        constraints: ">= 2"
      - name: max_concurrent_lab_tests
        type: integer
        source: input
        description: Maximum number of IN_LAB ThermalTests of this program whose closed lab windows may overlap.
        constraints: ">= 1"
      - name: retest_limit
        type: integer
        source: input
        description: Highest attempt_number a ThermalTest of this program may reach.
        constraints: ">= 1"
      - name: derate_allowed
        type: boolean
        source: input
        description: Whether the program permits publishing a derated declared R-value instead of rejecting the line.

  - name: BinderFormulation
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Formulation identifier; unique across all BinderFormulation rows.
      - name: formaldehyde_free
        type: boolean
        source: input
        description: Marketing/regulatory claim that the binder chemistry is formaldehyde-free.
      - name: formaldehyde_ppm
        type: number
        source: input
        description: Free-formaldehyde content of the wet binder, parts per million.
        constraints: ">= 0; MUST be exactly 0 when formaldehyde_free is true"
      - name: voc_g_per_kg
        type: number
        source: input
        description: VOC mass released per kg of binder applied, grams per kg.
        constraints: ">= 0"
      - name: min_cure_temp_f
        type: number
        source: input
        description: Minimum oven average temperature (F) at which this binder cures.
        constraints: "> 0"
      - name: min_dwell_s
        type: number
        source: input
        description: Minimum oven dwell time (seconds) at min_cure_temp_f.
        constraints: "> 0"
      - name: loi_target_pct
        type: number
        source: input
        description: Target loss-on-ignition (binder content) percentage of finished product mass.
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: Emissions-certification lifecycle state.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | EMISSIONS_TESTING | CERTIFIED | REVISION_REQUIRED | SUSPENDED | WITHDRAWN"
      - name: emissions_cert_id
        type: string
        source: computed
        description: Certificate identifier recorded when the formulation is certified; null otherwise.
        default: null
      - name: lab_reference
        type: string
        source: computed
        description: External emissions-lab reference captured when testing starts; null before that.
        default: null
      - name: revision_notes
        type: string
        source: computed
        description: Reviewer note captured when a revision is requested; null otherwise.
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: Number of times this formulation has cycled back to DRAFT from REVISION_REQUIRED.
        default: 0
      - name: certified_at
        type: datetime
        source: computed
        description: Logical-clock timestamp at which status last became CERTIFIED; null otherwise.
        default: null

  - name: ProductLine
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Stock-keeping unit; unique across all ProductLine rows.
      - name: plant_id
        type: string
        source: input
        description: FK -> Plant.id; the plant licensed to produce this line.
      - name: binder_formulation_id
        type: string
        source: input
        description: FK -> BinderFormulation.id; binder chemistry applied on this line.
      - name: certification_program_id
        type: string
        source: input
        description: FK -> CertificationProgram.id; thermal-performance scheme this line is certified under.
      - name: form
        type: enum
        source: input
        description: Finished-goods form factor.
        constraints: "BATT | ROLL"
      - name: density_pcf
        type: number
        source: input
        description: Nominal product density in pounds per cubic foot.
        constraints: "> 0, 2 decimal places"
      - name: facing_type
        type: enum
        source: input
        description: Vapour-retarder facing applied to the blanket.
        constraints: "UNFACED | KRAFT | FSK | FOIL"
      - name: width_in
        type: number
        source: input
        description: Finished batt/roll width in inches.
        constraints: "one of 15, 16, 23, 24"
      - name: thickness_in
        type: number
        source: input
        description: Nominal recovered thickness in inches.
        constraints: "> 0"
      - name: declared_r_value
        type: number
        source: input
        description: Thermal resistance printed on the bag; the value thermal tests are judged against.
        constraints: "> 0, 1 decimal place"
      - name: bag_sqft
        type: number
        source: input
        description: Square feet of product per compressed bag/bale; the indivisible allocation unit.
        constraints: "> 0"
      - name: bale_volume_ft3
        type: number
        source: input
        description: Uncompressed bale volume in cubic feet, before compression_ratio is applied.
        constraints: "> 0"
      - name: bale_mass_kg
        type: number
        source: input
        description: Mass of one bale in kilograms.
        constraints: "> 0"
      - name: compression_ratio
        type: number
        source: input
        description: Packaging compression ratio (uncompressed volume / bagged volume).
        default: 6.0
        constraints: "1.0..8.0, 1 decimal place"
      - name: mass_rate_kg_per_min
        type: number
        source: input
        description: Glass mass leaving the forming hood per minute when this line runs at nominal speed.
        constraints: "> 0"
      - name: certification_status
        type: enum
        source: computed
        description: Thermal-certification lifecycle state of the SKU.
        default: DRAFT
        constraints: "DRAFT | PENDING_CERTIFICATION | CERTIFIED | DERATED | SUSPENDED | WITHDRAWN"
      - name: effective_declared_r_value
        type: number
        source: computed
        description: R-value currently publishable — equals declared_r_value unless a DERATE decision lowered it.
        default: null
      - name: nonconformance_count
        type: integer
        source: computed
        description: Number of exhausted or rejected certification attempts recorded against this SKU.
        default: 0
      - name: recovered_thickness_pct
        type: number
        source: computed
        description: Percent of nominal thickness the product recovers at installation after compression (calculations.packaging_compression_economics).
        default: null
      - name: compressed_bale_volume_ft3
        type: number
        source: computed
        description: bale_volume_ft3 / compression_ratio.
        default: null
      - name: bales_per_truck
        type: integer
        source: computed
        description: Bales that fit one truckload under the tighter of the volume and payload limits.
        default: null
      - name: freight_cost_per_sqft
        type: number
        source: computed
        description: Truck rate divided by square feet per truckload, 4 decimal places.
        default: null
      - name: recovery_penalty_per_sqft
        type: number
        source: computed
        description: Warranty/recovery penalty charged per square foot when recovered_thickness_pct falls below the declared minimum.
        default: null
      - name: net_landed_cost_per_sqft
        type: number
        source: computed
        description: freight_cost_per_sqft + recovery_penalty_per_sqft, 4 decimal places.
        default: null
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertificationOfficer whose decision last set CERTIFIED or DERATED; null otherwise.
        default: null

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: FK -> Plant.id; plant executing the run.
      - name: product_line_id
        type: string
        source: input
        description: FK -> ProductLine.id; SKU being produced.
      - name: line_index
        type: integer
        source: input
        description: Fiberization line occupied by this run.
        constraints: "1..plant.production_line_count"
      - name: scheduled_start
        type: datetime
        source: input
        description: Inclusive start of the run's occupancy of (plant_id, line_index).
      - name: scheduled_end
        type: datetime
        source: input
        description: Exclusive end of the run's occupancy of (plant_id, line_index).
        constraints: "> scheduled_start"
      - name: target_pull_kg
        type: number
        source: input
        description: Target mass of fiberized glass to pull, in kilograms.
        constraints: "> 0"
      - name: zone_setpoints_f
        type: array
        source: input
        description: Planned curing-oven zone setpoints (F); length MUST equal plant.oven_zone_count.
      - name: avg_zone_temp_f
        type: number
        source: input
        description: Measured average oven temperature (F) supplied when curing starts; null before that.
        default: null
      - name: line_speed_fpm
        type: number
        source: input
        description: Measured line speed (feet per minute) supplied when curing starts; null before that.
        default: null
      - name: binder_applied_kg
        type: number
        source: input
        description: Mass of wet binder applied during the run, supplied when curing starts; null before that.
        default: null
      - name: bags_produced
        type: integer
        source: input
        description: Whole bags produced, supplied at packaging; null before that.
        default: null
      - name: total_charge_kg
        type: integer
        source: computed
        description: "ceil(target_pull_kg / MELT_YIELD); fixed when melting starts."
        default: null
      - name: allowed_cullet_kg
        type: integer
        source: computed
        description: "floor(total_charge_kg * plant.max_cullet_fraction) at the moment melting starts."
        default: null
      - name: cullet_charged_kg
        type: number
        source: computed
        description: Mass of recycled cullet/trim actually charged into this melt.
        default: 0.00
      - name: virgin_batch_kg
        type: number
        source: computed
        description: total_charge_kg - cullet_charged_kg.
        default: null
      - name: cullet_fraction
        type: number
        source: computed
        description: "round(cullet_charged_kg / total_charge_kg, 4) for this run alone."
        default: null
      - name: dwell_s
        type: number
        source: computed
        description: "round(plant.oven_length_ft / line_speed_fpm * 60, 2)."
        default: null
      - name: cure_index
        type: number
        source: computed
        description: Binder cure adequacy index (calculations.binder_cure_index); start-cure requires >= MIN_CURE_INDEX (100.00).
        default: null
      - name: produced_sqft
        type: number
        source: computed
        description: bags_produced * product_line.bag_sqft.
        default: null
      - name: changeover_scrap_kg
        type: number
        source: computed
        description: Scrap charged to this run by the changeover that ended it — provisional at open, reconciled at close.
        default: 0.00
      - name: formaldehyde_kg
        type: number
        source: computed
        description: Formaldehyde mass attributed to this run, computed at close.
        default: null
      - name: voc_kg
        type: number
        source: computed
        description: VOC mass attributed to this run, computed at close.
        default: null
      - name: run_status
        type: enum
        source: computed
        description: Physical execution dimension; evolves independently of qc_status on the same row.
        default: SCHEDULED
        constraints: "SCHEDULED | HELD | MELTING | CURING | PACKAGED | CLOSED | ABORTED"
      - name: qc_status
        type: enum
        source: computed
        description: Quality dimension; evolves independently of run_status on the same row.
        default: UNSAMPLED
        constraints: "UNSAMPLED | SAMPLED | CONFORMING | NONCONFORMING | RETEST_PENDING"
      - name: hold_reason
        type: string
        source: computed
        description: Why the run was placed on HELD; null when not held.
        default: null
        constraints: "null | PLANT_FROZEN | PRODUCT_LINE_SUSPENDED"
      - name: closed_at
        type: datetime
        source: computed
        description: Logical-clock timestamp at which run_status became CLOSED; null otherwise.
        default: null

  - name: ChangeoverEvent
    parent: null
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: FK -> Plant.id; plant on which the changeover occurs.
      - name: outgoing_run_id
        type: string
        source: input
        description: FK -> ProductionRun.id; run that finished immediately before the changeover.
      - name: incoming_run_id
        type: string
        source: input
        description: FK -> ProductionRun.id; run scheduled to start immediately after the changeover.
      - name: line_index
        type: integer
        source: input
        description: Fiberization line being re-profiled; must equal both runs' line_index.
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the changeover window.
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the changeover window.
        constraints: "> window_start"
      - name: from_density_pcf
        type: number
        source: computed
        description: Snapshot of the outgoing run's ProductLine.density_pcf at changeover creation.
      - name: to_density_pcf
        type: number
        source: computed
        description: Snapshot of the incoming run's ProductLine.density_pcf at changeover creation.
      - name: from_width_in
        type: number
        source: computed
        description: Snapshot of the outgoing run's ProductLine.width_in at changeover creation.
      - name: to_width_in
        type: number
        source: computed
        description: Snapshot of the incoming run's ProductLine.width_in at changeover creation.
      - name: facing_changed
        type: boolean
        source: computed
        description: True when the two ProductLines differ in facing_type.
      - name: density_delta_pct
        type: number
        source: computed
        description: "round(abs(to_density_pcf - from_density_pcf) / from_density_pcf * 100, 4)."
      - name: purge_minutes
        type: number
        source: computed
        description: Minutes of off-spec production predicted for the transition (calculations.changeover_scrap_accounting).
      - name: provisional_scrap_kg
        type: number
        source: computed
        description: PROVISIONAL variant of changeover scrap, fixed at creation.
      - name: weighed_trim_kg
        type: number
        source: input
        description: Trim/off-spec mass actually weighed at the changeover close; null while OPEN.
        default: null
        constraints: ">= 0"
      - name: recovered_cullet_kg
        type: number
        source: input
        description: Portion of weighed_trim_kg diverted to the cullet pile at close; null while OPEN.
        default: null
        constraints: ">= 0 and <= weighed_trim_kg"
      - name: reconciled_scrap_kg
        type: number
        source: computed
        description: RECONCILED variant of changeover scrap; null while OPEN.
        default: null
      - name: scrap_variance_kg
        type: number
        source: computed
        description: reconciled_scrap_kg - provisional_scrap_kg; null while OPEN.
        default: null
      - name: status
        type: enum
        source: computed
        description: Changeover lifecycle.
        default: OPEN
        constraints: "OPEN | CLOSED"

  - name: ThermalTest
    parent: null
    common_fields: true
    fields:
      - name: production_run_id
        type: string
        source: input
        description: FK -> ProductionRun.id; run whose output was sampled.
      - name: product_line_id
        type: string
        source: input
        description: FK -> ProductLine.id; SKU under test (must equal the run's product_line_id).
      - name: certification_program_id
        type: string
        source: input
        description: FK -> CertificationProgram.id; scheme whose tolerance and basis are applied.
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the laboratory occupancy window.
      - name: window_end
        type: datetime
        source: input
        description: Inclusive end of the laboratory occupancy window.
        constraints: "> window_start"
      - name: specimen_r_values
        type: array
        source: input
        description: Measured R-values, one per specimen; empty until a result is recorded and cleared again on retest.
        default: []
      - name: conformance_basis
        type: enum
        source: computed
        description: Basis pinned from the CertificationProgram at request time; later program edits cannot move it.
        constraints: "PER_SPECIMEN | LOT_MEAN"
      - name: declared_r_value_at_test
        type: number
        source: computed
        description: ProductLine.declared_r_value pinned at request time.
      - name: specimen_count
        type: integer
        source: computed
        description: Length of specimen_r_values at the last recorded result.
        default: 0
      - name: mean_r_value
        type: number
        source: computed
        description: "round(sum(specimen_r_values) / specimen_count, 3); null before a result is recorded."
        default: null
      - name: min_r_value
        type: number
        source: computed
        description: Lowest value in specimen_r_values; null before a result is recorded.
        default: null
      - name: conformance_verdict
        type: enum
        source: computed
        description: Verdict from calculations.thermal_conformance_verdict; null before a result is recorded.
        default: null
        constraints: "null | CONFORMING | NONCONFORMING"
      - name: attempt_number
        type: integer
        source: computed
        description: Retest counter; starts at 1 and increments on each retest of the same row.
        default: 1
      - name: recorded_by_user_id
        type: string
        source: system
        description: X-User-ID of the QualityEngineer who recorded the current result; null before that.
        default: null
      - name: status
        type: enum
        source: computed
        description: Laboratory lifecycle; loops IN_LAB -> COMPLETED -> IN_LAB while retests remain.
        default: REQUESTED
        constraints: "REQUESTED | IN_LAB | COMPLETED | EXHAUSTED"

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: FK -> Plant.id; plant that produced the lot.
      - name: product_line_id
        type: string
        source: input
        description: FK -> ProductLine.id; SKU held in the lot.
      - name: production_run_id
        type: string
        source: input
        description: FK -> ProductionRun.id; run that packaged the lot.
      - name: parent_lot_id
        type: string
        source: input
        description: FK -> InventoryLot.id; the lot this one was repacked out of, or null for a lot created straight off the line.
        default: null
      - name: form
        type: enum
        source: computed
        description: Copied from ProductLine.form at creation.
        constraints: "BATT | ROLL"
      - name: bags
        type: integer
        source: computed
        description: Whole bags in the lot; produced_sqft / product_line.bag_sqft.
      - name: produced_sqft
        type: number
        source: computed
        description: bags * product_line.bag_sqft; never mutated after creation.
      - name: allocated_sqft
        type: number
        source: computed
        description: "Sum of AllocationLine.allocated_sqft for lines on this lot with status == ALLOCATED."
        default: 0.00
      - name: available_sqft
        type: number
        source: computed
        description: "round(produced_sqft - allocated_sqft, 2); forced to 0.00 once status is QUARANTINED, REPACKED, CONSUMED or SCRAPPED."
        default: null
      - name: status
        type: enum
        source: computed
        description: Inventory lifecycle.
        default: AVAILABLE
        constraints: "AVAILABLE | ALLOCATED | QUARANTINED | REPACKED | CONSUMED | SCRAPPED"
      - name: quarantine_reason
        type: string
        source: computed
        description: Why the lot was quarantined; null when not quarantined.
        default: null
        constraints: "null | RUN_NONCONFORMING | MANUAL_HOLD"

  - name: AllocationCycle
    parent: null
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: FK -> Plant.id; supply is drawn only from this plant's lots.
      - name: product_line_id
        type: string
        source: input
        description: FK -> ProductLine.id; single SKU the cycle allocates.
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the demand period; its calendar month decides peak_season.
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of the demand period; orders with required_by <= period_end are eligible.
        constraints: "> period_start"
      - name: allocation_basis
        type: enum
        source: input
        description: Selects which variant of calculations.channel_allocation_waterfall runs.
        constraints: "CONTRACT_FIRST | PRO_RATA"
      - name: peak_season
        type: boolean
        source: computed
        description: "True when month(period_start) is in PEAK_MONTHS."
        default: null
      - name: total_available_sqft
        type: number
        source: computed
        description: Sum of available_sqft over eligible lots at the last propose.
        default: null
      - name: seasonal_reserve_sqft
        type: number
        source: computed
        description: Square feet withheld from allocation to buffer the construction-season peak.
        default: null
      - name: allocatable_sqft
        type: number
        source: computed
        description: total_available_sqft - seasonal_reserve_sqft.
        default: null
      - name: total_requested_sqft
        type: number
        source: computed
        description: Sum of requested_sqft over eligible ChannelOrders at the last propose.
        default: null
      - name: shortage_ratio
        type: number
        source: computed
        description: "round(total_requested_sqft / allocatable_sqft, 4)."
        default: null
      - name: allocated_sqft
        type: number
        source: computed
        description: Sum of allocated_sqft over this cycle's lines with status in {PROPOSED, ALLOCATED}.
        default: 0.00
      - name: unallocated_sqft
        type: number
        source: computed
        description: allocatable_sqft - allocated_sqft.
        default: null
      - name: status
        type: enum
        source: computed
        description: Allocation lifecycle.
        default: OPEN
        constraints: "OPEN | PROPOSED | COMMITTED | CANCELLED"

  - name: ChannelOrder
    parent: null
    common_fields: true
    fields:
      - name: product_line_id
        type: string
        source: input
        description: FK -> ProductLine.id; SKU requested.
      - name: channel_type
        type: enum
        source: input
        description: Sales channel placing the order.
        constraints: "DISTRIBUTOR | RETAIL"
      - name: priority_tier
        type: enum
        source: input
        description: Contractual priority; drives waterfall rank 1 (CONTRACT) through 3 (SPOT).
        constraints: "CONTRACT | PROGRAM | SPOT"
      - name: requested_sqft
        type: number
        source: input
        description: Square feet requested.
        constraints: "> 0"
      - name: required_by
        type: datetime
        source: input
        description: Latest acceptable ship date; an order is eligible for a cycle when required_by <= cycle.period_end.
      - name: placed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ChannelBuyer who created the order; the only buyer permitted to cancel it.
      - name: allocated_sqft
        type: number
        source: computed
        description: "Sum of AllocationLine.allocated_sqft for this order's lines with status == ALLOCATED."
        default: 0.00
      - name: fill_rate_pct
        type: number
        source: computed
        description: "round(allocated_sqft / requested_sqft * 100, 2)."
        default: 0.00
      - name: status
        type: enum
        source: computed
        description: Order lifecycle.
        default: SUBMITTED
        constraints: "SUBMITTED | ALLOCATED | PARTIAL | BACKORDERED | SHIPPED | CANCELLED"

  - name: AllocationLine
    parent: null
    common_fields: true
    fields:
      - name: allocation_cycle_id
        type: string
        source: input
        description: FK -> AllocationCycle.id; cycle that produced or hosts the line.
      - name: channel_order_id
        type: string
        source: input
        description: FK -> ChannelOrder.id; order being served.
      - name: inventory_lot_id
        type: string
        source: input
        description: FK -> InventoryLot.id; lot the square footage is drawn from.
      - name: allocated_sqft
        type: number
        source: input
        description: Square feet drawn from the lot; supplied directly on a manual create and computed by the waterfall on propose.
        constraints: "> 0 and an exact positive multiple of product_line.bag_sqft"
      - name: bags
        type: integer
        source: computed
        description: allocated_sqft / product_line.bag_sqft.
      - name: status
        type: enum
        source: computed
        description: Line lifecycle. Waterfall lines start PROPOSED; manual lines start ALLOCATED.
        default: null
        constraints: "PROPOSED | ALLOCATED | REVOKED"
      - name: revoke_reason
        type: string
        source: computed
        description: Why the line was revoked; null while not revoked.
        default: null
        constraints: "null | MANUAL_REVOKE | CYCLE_CANCELLED | LOT_QUARANTINED | ORDER_CANCELLED"

  - name: CulletBatch
    parent: null
    common_fields: true
    fields:
      - name: plant_id
        type: string
        source: input
        description: FK -> Plant.id; plant holding the cullet pile.
      - name: source_run_id
        type: string
        source: input
        description: FK -> ProductionRun.id; run whose trim or scrap produced this cullet, or null for externally purchased cullet.
        default: null
      - name: charged_run_id
        type: string
        source: computed
        description: "FK -> ProductionRun.id; run this batch was charged into, or null while STAGED or REJECTED. Never supplied by the caller: it is set by the start-melt charge selection and cleared again by reverse or by a run abort."
        default: null
      - name: source_type
        type: enum
        source: input
        description: Provenance of the cullet.
        constraints: "TRIM | CHANGEOVER_SCRAP | QUARANTINE_SCRAP | EXTERNAL"
      - name: mass_kg
        type: number
        source: input
        description: Cullet mass in kilograms; immutable after creation.
        constraints: "> 0, 2 decimal places"
      - name: status
        type: enum
        source: computed
        description: Cullet lifecycle; CHARGED returns to STAGED when a charge is reversed.
        default: STAGED
        constraints: "STAGED | CHARGED | REJECTED"
      - name: reject_reason
        type: string
        source: computed
        description: Why the batch was rejected from the melt; null unless REJECTED.
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:

  # ---------------------------------------------------------------------------
  # Plant carries TWO independent state dimensions on one row:
  #   melt_posture      (OPEN | RESTRICTED | FROZEN)
  #   emissions_status  (COMPLIANT | REPORTED | EXCEEDANCE)
  # ---------------------------------------------------------------------------
  - entity: Plant
    dimension: melt_posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system — evaluated at the end of POST /production-runs/{runId}/start-melt"
        actor: system
        preconditions:
          - "plant.cullet_fraction_ytd >= plant.cullet_restrict_fraction after the charge is booked (>= , not >)"
        side_effects:
          - "melt_posture := RESTRICTED"
          - "posture_reason := CULLET_FRACTION_AT_RESTRICT_LEVEL"
          - "increments Plant.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "POST /plants/{plantId}/posture-review with decision = RECOMPUTE"
        actor: EnvironmentalCompliance
        preconditions:
          - "plant.melt_posture == RESTRICTED"
          - "plant.cullet_fraction_ytd < plant.cullet_restrict_fraction at review time"
        side_effects:
          - "melt_posture := OPEN"
          - "posture_reason := null"
          - "increments Plant.version by 1"
        note: "Reachable after a CulletBatch charge is reversed, which lowers cullet_charged_kg_ytd."
      - from: OPEN
        to: FROZEN
        trigger: "system — evaluated inside POST /plants/{plantId}/emissions-report"
        actor: system
        preconditions:
          - "the `exceeded` flag of calculations.permit_period_emissions is true: reported_formaldehyde_kg > plant.formaldehyde_allowance_kg OR reported_voc_kg > plant.voc_allowance_kg (both strict >)"
        side_effects:
          - "melt_posture := FROZEN; posture_reason := EMISSIONS_EXCEEDANCE"
          - "cascade hop 1: emissions_status := EXCEEDANCE"
          - "cascade hop 2: every BinderFormulation with status == CERTIFIED and formaldehyde_free == false that is referenced by at least one ProductLine of this plant transitions CERTIFIED -> SUSPENDED"
          - "increments Plant.version by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system — evaluated inside POST /plants/{plantId}/emissions-report"
        actor: system
        preconditions:
          - "the `exceeded` flag of calculations.permit_period_emissions is true: reported_formaldehyde_kg > plant.formaldehyde_allowance_kg OR reported_voc_kg > plant.voc_allowance_kg (both strict >)"
        side_effects:
          - "same side-effect set as OPEN -> FROZEN; the cullet restriction is superseded and posture_reason becomes EMISSIONS_EXCEEDANCE"
      - from: FROZEN
        to: OPEN
        trigger: "POST /plants/{plantId}/posture-review with decision = OVERRIDE_TO_OPEN"
        actor: EnvironmentalCompliance
        preconditions:
          - "plant.melt_posture == FROZEN"
          - "override_reason is a non-empty string"
        side_effects:
          - "melt_posture := OPEN; posture_reason := MANUAL_OVERRIDE; override_reason := payload value"
          - "ProductionRun rows left in HELD are NOT auto-released; each requires POST /production-runs/{runId}/release-hold"
          - "increments Plant.version by 1"

  - entity: Plant
    dimension: emissions_status
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: REPORTED
        trigger: "POST /plants/{plantId}/emissions-report"
        actor: EnvironmentalCompliance
        preconditions:
          - "period_end > period_start"
          - "calculations.permit_period_emissions yields `exceeded` false: reported_formaldehyde_kg <= plant.formaldehyde_allowance_kg AND reported_voc_kg <= plant.voc_allowance_kg"
        side_effects:
          - "reported_formaldehyde_kg, reported_voc_kg, reported_period_start, reported_period_end set from calculations.permit_period_emissions"
          - "emissions_status := REPORTED"
      - from: REPORTED
        to: REPORTED
        trigger: "POST /plants/{plantId}/emissions-report for a later period"
        actor: EnvironmentalCompliance
        preconditions:
          - "period_end > period_start"
          - "the `exceeded` flag is false: reported_formaldehyde_kg <= plant.formaldehyde_allowance_kg AND reported_voc_kg <= plant.voc_allowance_kg"
        side_effects:
          - "the four reported_* fields are overwritten with the new period's figures"
        note: "Self-loop; each report replaces the previous period snapshot."
      - from: COMPLIANT
        to: EXCEEDANCE
        trigger: "POST /plants/{plantId}/emissions-report"
        actor: EnvironmentalCompliance
        preconditions:
          - "period_end > period_start"
          - "the `exceeded` flag of calculations.permit_period_emissions is true: reported_formaldehyde_kg > plant.formaldehyde_allowance_kg OR reported_voc_kg > plant.voc_allowance_kg (both strict >)"
        side_effects:
          - "emissions_status := EXCEEDANCE; the four reported_* fields are set"
          - "drives the melt_posture dimension OPEN|RESTRICTED -> FROZEN on the same row"
      - from: REPORTED
        to: EXCEEDANCE
        trigger: "POST /plants/{plantId}/emissions-report"
        actor: EnvironmentalCompliance
        preconditions:
          - "the `exceeded` flag of calculations.permit_period_emissions is true: reported_formaldehyde_kg > plant.formaldehyde_allowance_kg OR reported_voc_kg > plant.voc_allowance_kg (both strict >)"
        side_effects:
          - "same as COMPLIANT -> EXCEEDANCE"
      - from: EXCEEDANCE
        to: REPORTED
        trigger: "POST /plants/{plantId}/emissions-report for a period back within allowance"
        actor: EnvironmentalCompliance
        preconditions:
          - "the `exceeded` flag is false: reported_formaldehyde_kg <= plant.formaldehyde_allowance_kg AND reported_voc_kg <= plant.voc_allowance_kg"
        side_effects:
          - "emissions_status := REPORTED"
          - "melt_posture is NOT cleared here; FROZEN survives until posture-review OVERRIDE_TO_OPEN"
        note: "Proves the two Plant dimensions are genuinely independent."

  # ---------------------------------------------------------------------------
  # BinderFormulation — cyclic (revision loop and re-certification loop)
  # ---------------------------------------------------------------------------
  - entity: BinderFormulation
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /binder-formulations/{binderId}/submit"
        actor: QualityEngineer
        preconditions:
          - "status == DRAFT"
          - "formaldehyde_free == false OR formaldehyde_ppm == 0"
        side_effects:
          - "status := SUBMITTED"
      - from: SUBMITTED
        to: EMISSIONS_TESTING
        trigger: "POST /binder-formulations/{binderId}/emissions-test"
        actor: CertificationOfficer
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "status := EMISSIONS_TESTING; lab_reference := payload value"
      - from: EMISSIONS_TESTING
        to: CERTIFIED
        trigger: "POST /binder-formulations/{binderId}/certification-decision with decision = CERTIFY"
        actor: CertificationOfficer
        preconditions:
          - "status == EMISSIONS_TESTING"
          - "formaldehyde_ppm <= FORMALDEHYDE_CERT_LIMIT_PPM"
          - "voc_g_per_kg <= VOC_CERT_LIMIT_G_PER_KG"
        side_effects:
          - "status := CERTIFIED; emissions_cert_id := payload value; certified_at := logical clock"
      - from: EMISSIONS_TESTING
        to: REVISION_REQUIRED
        trigger: "POST /binder-formulations/{binderId}/certification-decision with decision = REQUEST_REVISION"
        actor: CertificationOfficer
        preconditions:
          - "status == EMISSIONS_TESTING"
          - "revision_notes is a non-empty string"
        side_effects:
          - "status := REVISION_REQUIRED; revision_notes := payload value"
        note: "Divergent branch from the same trigger endpoint — no certificate is minted and certified_at stays null."
      - from: REVISION_REQUIRED
        to: DRAFT
        trigger: "POST /binder-formulations/{binderId}/revise with decision = REVISE"
        actor: QualityEngineer
        preconditions:
          - "status == REVISION_REQUIRED"
          - "revision_count < MAX_BINDER_REVISIONS"
        side_effects:
          - "revision_count := revision_count + 1; status := DRAFT; lab_reference := null; revision_notes := null"
        note: "Closes the cycle DRAFT -> SUBMITTED -> EMISSIONS_TESTING -> REVISION_REQUIRED -> DRAFT."
      - from: REVISION_REQUIRED
        to: WITHDRAWN
        trigger: "POST /binder-formulations/{binderId}/revise with decision = WITHDRAW"
        actor: QualityEngineer
        preconditions:
          - "status == REVISION_REQUIRED"
        side_effects:
          - "status := WITHDRAWN"
          - "cascade hop 1: every ProductLine referencing this formulation whose certification_status is in {DRAFT, PENDING_CERTIFICATION, CERTIFIED, DERATED} transitions to SUSPENDED"
          - "cascade hop 2: each of those ProductLines' SCHEDULED ProductionRuns transition SCHEDULED -> HELD with hold_reason = PRODUCT_LINE_SUSPENDED"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "system — cascade hop 2 of the Plant OPEN|RESTRICTED -> FROZEN transition"
        actor: system
        preconditions:
          - "status == CERTIFIED"
          - "formaldehyde_free == false"
          - "at least one ProductLine of the exceeding plant references this formulation"
        side_effects:
          - "status := SUSPENDED"
          - "cascade hop 3: every ProductLine referencing this formulation whose certification_status is in {PENDING_CERTIFICATION, CERTIFIED, DERATED} transitions to SUSPENDED"
        note: "Formaldehyde-free chemistries are exempt — they cannot be the source of a formaldehyde exceedance."
      - from: SUSPENDED
        to: EMISSIONS_TESTING
        trigger: "POST /binder-formulations/{binderId}/emissions-test"
        actor: CertificationOfficer
        preconditions:
          - "status == SUSPENDED"
          - "the plant that suspended it has melt_posture != FROZEN"
        side_effects:
          - "status := EMISSIONS_TESTING; lab_reference := payload value; emissions_cert_id := null; certified_at := null"
        note: "Second cycle: CERTIFIED -> SUSPENDED -> EMISSIONS_TESTING -> CERTIFIED."

  # ---------------------------------------------------------------------------
  # ProductLine — branching (fork on one decision endpoint) with a revert and a
  # re-certification cycle.
  # ---------------------------------------------------------------------------
  - entity: ProductLine
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENDING_CERTIFICATION
        trigger: "POST /product-lines/{productLineId}/submit-certification"
        actor: QualityEngineer
        preconditions:
          - "certification_status == DRAFT"
          - "the referenced BinderFormulation has status == CERTIFIED  (cross-entity gate)"
        side_effects:
          - "certification_status := PENDING_CERTIFICATION"
      - from: PENDING_CERTIFICATION
        to: CERTIFIED
        trigger: "POST /product-lines/{productLineId}/certification-decision with decision = CERTIFY"
        actor: CertificationOfficer
        preconditions:
          - "certification_status == PENDING_CERTIFICATION"
          - "at least one ThermalTest for this product_line_id has status == COMPLETED and conformance_verdict == CONFORMING"
          - "X-User-ID != that ThermalTest.recorded_by_user_id  (segregation of duties)"
        side_effects:
          - "certification_status := CERTIFIED"
          - "effective_declared_r_value := declared_r_value"
          - "certified_by_user_id := X-User-ID"
      - from: PENDING_CERTIFICATION
        to: DERATED
        trigger: "POST /product-lines/{productLineId}/certification-decision with decision = DERATE"
        actor: CertificationOfficer
        preconditions:
          - "certification_status == PENDING_CERTIFICATION"
          - "the referenced CertificationProgram has derate_allowed == true"
          - "the latest ThermalTest for this product_line_id by created_at ASC (last row) has status in {COMPLETED, EXHAUSTED} and mean_r_value != null"
          - "X-User-ID != that ThermalTest.recorded_by_user_id  (segregation of duties)"
        side_effects:
          - "certification_status := DERATED"
          - "effective_declared_r_value := calculations.declared_value_derate output (strictly lower than declared_r_value)"
          - "certified_by_user_id := X-User-ID"
        note: "Divergent branch: unlike CERTIFY this rewrites effective_declared_r_value downward; unlike REJECT it leaves nonconformance_count untouched."
      - from: PENDING_CERTIFICATION
        to: DRAFT
        trigger: "POST /product-lines/{productLineId}/certification-decision with decision = REJECT"
        actor: CertificationOfficer
        preconditions:
          - "certification_status == PENDING_CERTIFICATION"
        side_effects:
          - "certification_status := DRAFT"
          - "nonconformance_count := nonconformance_count + 1"
          - "effective_declared_r_value := null"
        note: "Revert leg of the fork; the third divergent side-effect set on the same trigger endpoint."
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /product-lines/{productLineId}/certification-decision with decision = SUSPEND, or system cascade"
        actor: CertificationOfficer | system
        preconditions:
          - "certification_status == CERTIFIED"
        side_effects:
          - "certification_status := SUSPENDED"
          - "every ProductionRun of this line with run_status == SCHEDULED transitions SCHEDULED -> HELD with hold_reason = PRODUCT_LINE_SUSPENDED"
          - "every AllocationCycle of this line with status in {OPEN, PROPOSED} transitions to CANCELLED"
      - from: DERATED
        to: SUSPENDED
        trigger: "POST /product-lines/{productLineId}/certification-decision with decision = SUSPEND, or system cascade"
        actor: CertificationOfficer | system
        preconditions:
          - "certification_status == DERATED"
        side_effects:
          - "identical to CERTIFIED -> SUSPENDED"
      - from: PENDING_CERTIFICATION
        to: SUSPENDED
        trigger: "system — cascade hop 3 of a BinderFormulation CERTIFIED -> SUSPENDED or REVISION_REQUIRED -> WITHDRAWN transition"
        actor: system
        preconditions:
          - "certification_status == PENDING_CERTIFICATION"
        side_effects:
          - "certification_status := SUSPENDED"
          - "SCHEDULED ProductionRuns of this line transition SCHEDULED -> HELD with hold_reason = PRODUCT_LINE_SUSPENDED"
      - from: SUSPENDED
        to: PENDING_CERTIFICATION
        trigger: "POST /product-lines/{productLineId}/certification-decision with decision = REINSTATE"
        actor: CertificationOfficer
        preconditions:
          - "certification_status == SUSPENDED"
          - "the referenced BinderFormulation has status == CERTIFIED  (cross-entity gate)"
        side_effects:
          - "certification_status := PENDING_CERTIFICATION; effective_declared_r_value := null; certified_by_user_id := null"
        note: "Closes the cycle CERTIFIED -> SUSPENDED -> PENDING_CERTIFICATION -> CERTIFIED."
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /product-lines/{productLineId}/certification-decision with decision = WITHDRAW"
        actor: CertificationOfficer
        preconditions:
          - "certification_status == SUSPENDED"
        side_effects:
          - "certification_status := WITHDRAWN"

  # ---------------------------------------------------------------------------
  # ProductionRun — PARALLEL STATE DIMENSIONS on one row.
  # `run_status` (physical) and `qc_status` (quality) advance independently:
  # a run can be CLOSED while still RETEST_PENDING, and NONCONFORMING while
  # still CURING.
  # ---------------------------------------------------------------------------
  - entity: ProductionRun
    dimension: run_status
    initial_state: SCHEDULED
    terminal_states: [CLOSED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: MELTING
        trigger: "POST /production-runs/{runId}/start-melt"
        actor: PlantOperator
        preconditions:
          - "run_status == SCHEDULED"
          - "plant.melt_posture != FROZEN"
          - "plant.melt_posture != RESTRICTED when cullet_batch_ids is non-empty"
          - "every id in cullet_batch_ids is a CulletBatch of the same plant with status == STAGED"
          - "logical clock >= scheduled_start"
        side_effects:
          - "run_status := MELTING"
          - "total_charge_kg, allowed_cullet_kg, cullet_charged_kg, virgin_batch_kg, cullet_fraction set from calculations.cullet_charge_allocation"
          - "each CulletBatch selected by that calculation transitions STAGED -> CHARGED and gets charged_run_id := run.id"
          - "plant.cullet_on_hand_kg, plant.cullet_charged_kg_ytd, plant.total_charge_kg_ytd and plant.cullet_fraction_ytd recomputed"
          - "plant melt_posture re-evaluated: OPEN -> RESTRICTED when cullet_fraction_ytd >= cullet_restrict_fraction"
      - from: SCHEDULED
        to: HELD
        trigger: "system — cascade from Plant OPEN|RESTRICTED -> FROZEN or ProductLine -> SUSPENDED"
        actor: system
        preconditions:
          - "run_status == SCHEDULED"
        side_effects:
          - "run_status := HELD"
          - "hold_reason := PLANT_FROZEN when driven by the Plant posture change, PRODUCT_LINE_SUSPENDED when driven by the ProductLine change"
      - from: HELD
        to: SCHEDULED
        trigger: "POST /production-runs/{runId}/release-hold"
        actor: PlantOperator
        preconditions:
          - "run_status == HELD"
          - "plant.melt_posture == OPEN"
          - "product_line.certification_status not in {SUSPENDED, WITHDRAWN}"
        side_effects:
          - "run_status := SCHEDULED; hold_reason := null"
      - from: MELTING
        to: CURING
        trigger: "POST /production-runs/{runId}/start-cure"
        actor: PlantOperator
        preconditions:
          - "run_status == MELTING"
        side_effects:
          - "run_status := CURING"
          - "avg_zone_temp_f, line_speed_fpm, binder_applied_kg stored from payload"
          - "dwell_s and cure_index set from calculations.binder_cure_index"
      - from: CURING
        to: PACKAGED
        trigger: "POST /production-runs/{runId}/package"
        actor: PlantOperator
        preconditions:
          - "run_status == CURING"
          - "cure_index >= MIN_CURE_INDEX (100.00)  (>= , not >) — already enforced at start-cure, re-checked here"
        side_effects:
          - "run_status := PACKAGED; bags_produced stored; produced_sqft := bags_produced * product_line.bag_sqft"
          - "one InventoryLot is created with status AVAILABLE, parent_lot_id null, bags = bags_produced, produced_sqft = run.produced_sqft, available_sqft = produced_sqft"
        note: "The created lot appears in no response body; it is discoverable only through GET /inventory-lots?production_run_id=..."
      - from: PACKAGED
        to: CLOSED
        trigger: "POST /production-runs/{runId}/close"
        actor: PlantOperator
        preconditions:
          - "run_status == PACKAGED"
          - "qc_status in {SAMPLED, CONFORMING, NONCONFORMING, RETEST_PENDING} — an UNSAMPLED run cannot be closed"
        side_effects:
          - "run_status := CLOSED; closed_at := logical clock"
          - "formaldehyde_kg and voc_kg set from calculations.permit_period_emissions per-run step"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /production-runs/{runId}/abort"
        actor: PlantOperator
        preconditions:
          - "run_status == SCHEDULED"
        side_effects:
          - "run_status := ABORTED"
      - from: MELTING
        to: ABORTED
        trigger: "POST /production-runs/{runId}/abort"
        actor: PlantOperator
        preconditions:
          - "run_status == MELTING"
        side_effects:
          - "run_status := ABORTED"
          - "every CulletBatch with charged_run_id == run.id and status == CHARGED transitions CHARGED -> STAGED and charged_run_id := null"
          - "run.cullet_charged_kg := 0.00; run.virgin_batch_kg := run.total_charge_kg; run.cullet_fraction := 0.0000"
          - "plant.cullet_on_hand_kg, plant.cullet_charged_kg_ytd, plant.total_charge_kg_ytd and plant.cullet_fraction_ytd recomputed"
        note: "Compensating transition: restores the plant cullet ledger exactly."
      - from: CURING
        to: ABORTED
        trigger: "POST /production-runs/{runId}/abort"
        actor: PlantOperator
        preconditions:
          - "run_status == CURING"
        side_effects:
          - "identical to MELTING -> ABORTED"

  - entity: ProductionRun
    dimension: qc_status
    initial_state: UNSAMPLED
    terminal_states: []
    transitions:
      - from: UNSAMPLED
        to: SAMPLED
        trigger: "POST /thermal-tests (a ThermalTest is requested against this run)"
        actor: QualityEngineer
        preconditions:
          - "qc_status == UNSAMPLED"
          - "run_status in {CURING, PACKAGED, CLOSED}"
        side_effects:
          - "qc_status := SAMPLED"
      - from: SAMPLED
        to: CONFORMING
        trigger: "POST /thermal-tests/{testId}/record-result yielding conformance_verdict = CONFORMING"
        actor: QualityEngineer
        preconditions:
          - "qc_status == SAMPLED"
        side_effects:
          - "qc_status := CONFORMING"
      - from: SAMPLED
        to: NONCONFORMING
        trigger: "POST /thermal-tests/{testId}/record-result yielding conformance_verdict = NONCONFORMING"
        actor: QualityEngineer
        preconditions:
          - "qc_status == SAMPLED"
        side_effects:
          - "qc_status := NONCONFORMING"
          - "cascade hop 2: every InventoryLot with production_run_id == run.id and status in {AVAILABLE, ALLOCATED} transitions to QUARANTINED with quarantine_reason = RUN_NONCONFORMING"
          - "cascade hop 3: every AllocationLine on those lots with status in {PROPOSED, ALLOCATED} transitions to REVOKED with revoke_reason = LOT_QUARANTINED, and each affected ChannelOrder's allocated_sqft / fill_rate_pct are recomputed and its status re-derived (ALLOCATED|PARTIAL -> PARTIAL or BACKORDERED)"
      - from: NONCONFORMING
        to: RETEST_PENDING
        trigger: "POST /thermal-tests/{testId}/request-retest"
        actor: QualityEngineer
        preconditions:
          - "qc_status == NONCONFORMING"
        side_effects:
          - "qc_status := RETEST_PENDING"
      - from: RETEST_PENDING
        to: CONFORMING
        trigger: "POST /thermal-tests/{testId}/record-result on the retest attempt yielding CONFORMING"
        actor: QualityEngineer
        preconditions:
          - "qc_status == RETEST_PENDING"
        side_effects:
          - "qc_status := CONFORMING"
          - "quarantined lots are NOT auto-released; each requires POST /inventory-lots/{lotId}/release"
      - from: RETEST_PENDING
        to: NONCONFORMING
        trigger: "POST /thermal-tests/{testId}/record-result on the retest attempt yielding NONCONFORMING"
        actor: QualityEngineer
        preconditions:
          - "qc_status == RETEST_PENDING"
        side_effects:
          - "qc_status := NONCONFORMING"
          - "when the test row reaches EXHAUSTED: product_line.nonconformance_count := nonconformance_count + 1, and if that value >= NONCONFORMANCE_SUSPEND_THRESHOLD the ProductLine transitions to SUSPENDED"

  # ---------------------------------------------------------------------------
  # ChangeoverEvent — short linear machine carrying the dual-variant scrap.
  # ---------------------------------------------------------------------------
  - entity: ChangeoverEvent
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /changeover-events"
        actor: PlantOperator
        preconditions:
          - "outgoing_run.run_status in {PACKAGED, CLOSED} and incoming_run.run_status in {SCHEDULED, HELD}"
          - "outgoing_run.plant_id == incoming_run.plant_id == payload plant_id and both runs' line_index == payload line_index"
          - "window_end > window_start"
          - "the buffer-inflated closed interval [window_start - CHANGEOVER_PURGE_BUFFER_MIN, window_end + CHANGEOVER_PURGE_BUFFER_MIN] does not intersect the same inflated interval of any other ChangeoverEvent with status in {OPEN, CLOSED} on the same (plant_id, line_index)"
          - "abs(to_width_in - from_width_in) <= plant.max_width_change_in"
        side_effects:
          - "status := OPEN"
          - "from_density_pcf / to_density_pcf / from_width_in / to_width_in / facing_changed snapshotted from the two ProductLines"
          - "density_delta_pct, purge_minutes and provisional_scrap_kg set from the PROVISIONAL variant of calculations.changeover_scrap_accounting"
          - "outgoing_run.changeover_scrap_kg := provisional_scrap_kg"
      - from: OPEN
        to: CLOSED
        trigger: "POST /changeover-events/{changeoverId}/close"
        actor: PlantOperator
        preconditions:
          - "status == OPEN"
          - "recovered_cullet_kg <= weighed_trim_kg"
          - "logical clock >= window_end"
        side_effects:
          - "status := CLOSED; weighed_trim_kg and recovered_cullet_kg stored"
          - "reconciled_scrap_kg and scrap_variance_kg set from the RECONCILED variant of calculations.changeover_scrap_accounting"
          - "outgoing_run.changeover_scrap_kg := reconciled_scrap_kg (overwrites the provisional figure)"
          - "one CulletBatch is created with status STAGED, source_type CHANGEOVER_SCRAP, source_run_id = outgoing_run_id, mass_kg = recovered_cullet_kg, when recovered_cullet_kg > 0"
          - "plant.cullet_received_kg_ytd += recovered_cullet_kg; plant.cullet_on_hand_kg recomputed"

  # ---------------------------------------------------------------------------
  # ThermalTest — CYCLIC: IN_LAB -> COMPLETED -> IN_LAB on the same row, once
  # per retest attempt, and a branching exit to EXHAUSTED on the last attempt.
  # ---------------------------------------------------------------------------
  - entity: ThermalTest
    initial_state: REQUESTED
    terminal_states: [EXHAUSTED]
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /thermal-tests"
        actor: QualityEngineer
        preconditions:
          - "product_line_id == production_run.product_line_id"
          - "production_run.run_status in {CURING, PACKAGED, CLOSED}"
          - "window_end > window_start"
        side_effects:
          - "status := REQUESTED; attempt_number := 1"
          - "conformance_basis := program.conformance_basis and declared_r_value_at_test := product_line.declared_r_value, both pinned at this instant"
          - "production_run.qc_status UNSAMPLED -> SAMPLED"
      - from: REQUESTED
        to: IN_LAB
        trigger: "POST /thermal-tests/{testId}/start-lab"
        actor: QualityEngineer
        preconditions:
          - "status == REQUESTED"
          - "the count of ThermalTests with status == IN_LAB, the same certification_program_id, and a closed window [window_start, window_end] intersecting this test's closed window is strictly less than program.max_concurrent_lab_tests"
        side_effects:
          - "status := IN_LAB"
      - from: IN_LAB
        to: COMPLETED
        trigger: "POST /thermal-tests/{testId}/record-result"
        actor: QualityEngineer
        preconditions:
          - "status == IN_LAB"
          - "len(specimen_r_values) >= program.min_specimen_count"
          - "conformance_verdict computed as CONFORMING, OR computed as NONCONFORMING while attempt_number < program.retest_limit"
        side_effects:
          - "status := COMPLETED; specimen_r_values, specimen_count, mean_r_value, min_r_value stored; recorded_by_user_id := X-User-ID"
          - "conformance_verdict set from calculations.thermal_conformance_verdict using conformance_basis"
          - "production_run.qc_status advances SAMPLED|RETEST_PENDING -> CONFORMING or -> NONCONFORMING, firing the quarantine/revocation cascade on NONCONFORMING"
      - from: IN_LAB
        to: EXHAUSTED
        trigger: "POST /thermal-tests/{testId}/record-result"
        actor: QualityEngineer
        preconditions:
          - "status == IN_LAB"
          - "len(specimen_r_values) >= program.min_specimen_count"
          - "conformance_verdict computed as NONCONFORMING AND attempt_number == program.retest_limit"
        side_effects:
          - "status := EXHAUSTED; the same result fields are stored as on the COMPLETED leg"
          - "production_run.qc_status -> NONCONFORMING with the same quarantine/revocation cascade"
          - "product_line.nonconformance_count := nonconformance_count + 1"
          - "when product_line.nonconformance_count >= NONCONFORMANCE_SUSPEND_THRESHOLD the ProductLine transitions CERTIFIED|DERATED|PENDING_CERTIFICATION -> SUSPENDED"
        note: "Divergent branch of the same trigger: only this leg touches nonconformance_count and can suspend the SKU."
      - from: COMPLETED
        to: IN_LAB
        trigger: "POST /thermal-tests/{testId}/request-retest"
        actor: QualityEngineer
        preconditions:
          - "status == COMPLETED"
          - "conformance_verdict == NONCONFORMING"
          - "attempt_number < program.retest_limit"
          - "the lab-capacity check above passes for the new window"
        side_effects:
          - "attempt_number := attempt_number + 1; status := IN_LAB"
          - "specimen_r_values := [], specimen_count := 0, mean_r_value := null, min_r_value := null, conformance_verdict := null, recorded_by_user_id := null"
          - "window_start / window_end replaced by the payload values"
          - "production_run.qc_status NONCONFORMING -> RETEST_PENDING"
        note: "Closes the cycle IN_LAB -> COMPLETED -> IN_LAB on the same row."

  # ---------------------------------------------------------------------------
  # InventoryLot — includes a self-referential repack split and a compensating
  # revoke leg.
  # ---------------------------------------------------------------------------
  - entity: InventoryLot
    initial_state: AVAILABLE
    terminal_states: [REPACKED, CONSUMED, SCRAPPED]
    transitions:
      - from: AVAILABLE
        to: ALLOCATED
        trigger: "system — POST /allocation-cycles/{cycleId}/commit or POST /allocation-lines"
        actor: system
        preconditions:
          - "status == AVAILABLE"
          - "available_sqft becomes exactly 0.00 after the allocation is booked"
        side_effects:
          - "status := ALLOCATED; allocated_sqft and available_sqft recomputed from calculations.lot_allocation_ledger"
      - from: ALLOCATED
        to: AVAILABLE
        trigger: "system — POST /allocation-lines/{lineId}/revoke, POST /channel-orders/{orderId}/cancel or POST /allocation-cycles/{cycleId}/cancel"
        actor: system
        preconditions:
          - "status == ALLOCATED"
          - "available_sqft becomes > 0.00 after the revocation is booked"
        side_effects:
          - "status := AVAILABLE; allocated_sqft and available_sqft recomputed"
        note: "Compensating leg; the sqft conservation invariant must hold exactly after it runs."
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /inventory-lots/{lotId}/quarantine with disposition = HOLD, or system cascade hop 2 from a NONCONFORMING run"
        actor: QualityEngineer | system
        preconditions:
          - "status == AVAILABLE"
        side_effects:
          - "status := QUARANTINED; available_sqft := 0.00"
          - "quarantine_reason := MANUAL_HOLD for the explicit endpoint, RUN_NONCONFORMING for the cascade"
      - from: ALLOCATED
        to: QUARANTINED
        trigger: "POST /inventory-lots/{lotId}/quarantine with disposition = HOLD, or system cascade hop 2 from a NONCONFORMING run"
        actor: QualityEngineer | system
        preconditions:
          - "status == ALLOCATED"
        side_effects:
          - "status := QUARANTINED; available_sqft := 0.00"
          - "every AllocationLine on this lot with status in {PROPOSED, ALLOCATED} transitions to REVOKED with revoke_reason = LOT_QUARANTINED; affected ChannelOrders are recomputed"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /inventory-lots/{lotId}/release"
        actor: QualityEngineer
        preconditions:
          - "status == QUARANTINED"
          - "production_run.qc_status == CONFORMING  (cross-entity gate)"
        side_effects:
          - "status := AVAILABLE; quarantine_reason := null; available_sqft := round(produced_sqft - allocated_sqft, 2)"
      - from: QUARANTINED
        to: SCRAPPED
        trigger: "POST /inventory-lots/{lotId}/quarantine with disposition = SCRAP"
        actor: QualityEngineer
        preconditions:
          - "status == QUARANTINED"
        side_effects:
          - "status := SCRAPPED; available_sqft := 0.00"
          - "one CulletBatch is created with status STAGED, source_type QUARANTINE_SCRAP, source_run_id = production_run_id, mass_kg = calculations.scrap_cullet_recovery output"
          - "plant.cullet_received_kg_ytd += that mass; plant.cullet_on_hand_kg recomputed"
      - from: AVAILABLE
        to: REPACKED
        trigger: "POST /inventory-lots/{lotId}/repack"
        actor: PlantOperator
        preconditions:
          - "status == AVAILABLE"
          - "allocated_sqft == 0.00"
          - "len(child_bags) >= 2 and every element > 0"
          - "sum(child_bags) * product_line.bag_sqft == produced_sqft"
        side_effects:
          - "status := REPACKED; available_sqft := 0.00"
          - "one child InventoryLot per element of child_bags is created with parent_lot_id = this lot, status AVAILABLE, bags = element, produced_sqft = element * bag_sqft"
        note: "Self-referential split; total produced_sqft across the children equals the parent's produced_sqft exactly."
      - from: ALLOCATED
        to: CONSUMED
        trigger: "system — POST /channel-orders/{orderId}/ship"
        actor: system
        preconditions:
          - "status == ALLOCATED"
          - "every ALLOCATED AllocationLine on this lot belongs to the shipping order"
        side_effects:
          - "status := CONSUMED; available_sqft := 0.00"

  # ---------------------------------------------------------------------------
  # AllocationCycle — includes a PROPOSED self-loop (re-propose discards and
  # recomputes the proposal).
  # ---------------------------------------------------------------------------
  - entity: AllocationCycle
    initial_state: OPEN
    terminal_states: [COMMITTED, CANCELLED]
    transitions:
      - from: OPEN
        to: PROPOSED
        trigger: "POST /allocation-cycles/{cycleId}/propose"
        actor: ChannelManager
        preconditions:
          - "status == OPEN"
          - "product_line.certification_status in {CERTIFIED, DERATED}"
          - "allocatable_sqft > 0.00"
          - "at least one eligible ChannelOrder exists"
        side_effects:
          - "status := PROPOSED"
          - "peak_season, total_available_sqft, seasonal_reserve_sqft, allocatable_sqft, total_requested_sqft, shortage_ratio, allocated_sqft, unallocated_sqft set from calculations.channel_allocation_waterfall"
          - "one AllocationLine with status PROPOSED is created per (order, lot) pair the waterfall produces"
      - from: PROPOSED
        to: PROPOSED
        trigger: "POST /allocation-cycles/{cycleId}/propose"
        actor: ChannelManager
        preconditions:
          - "status == PROPOSED"
          - "product_line.certification_status in {CERTIFIED, DERATED}"
          - "allocatable_sqft > 0.00"
          - "at least one eligible ChannelOrder exists"
        side_effects:
          - "every existing AllocationLine of this cycle with status == PROPOSED transitions to REVOKED with revoke_reason = CYCLE_CANCELLED, then the waterfall is re-run and fresh PROPOSED lines are created"
        note: "Self-loop; PROPOSED lines are never mutated in place."
      - from: PROPOSED
        to: COMMITTED
        trigger: "POST /allocation-cycles/{cycleId}/commit"
        actor: ChannelManager
        preconditions:
          - "status == PROPOSED"
          - "plant.melt_posture != FROZEN"
          - "no InventoryLot referenced by a PROPOSED line of this cycle has status == QUARANTINED"
        side_effects:
          - "status := COMMITTED"
          - "every PROPOSED line of this cycle transitions PROPOSED -> ALLOCATED"
          - "each referenced InventoryLot's allocated_sqft / available_sqft / status recomputed"
          - "each served ChannelOrder's allocated_sqft, fill_rate_pct and status recomputed (ALLOCATED, PARTIAL or BACKORDERED)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /allocation-cycles/{cycleId}/cancel, or system cascade from ProductLine -> SUSPENDED"
        actor: ChannelManager | system
        preconditions:
          - "status == OPEN"
        side_effects:
          - "status := CANCELLED"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /allocation-cycles/{cycleId}/cancel, or system cascade from ProductLine -> SUSPENDED"
        actor: ChannelManager | system
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "status := CANCELLED"
          - "every AllocationLine of this cycle with status in {PROPOSED, ALLOCATED} transitions to REVOKED with revoke_reason = CYCLE_CANCELLED; lots and orders are recomputed"

  - entity: AllocationLine
    initial_state: PROPOSED
    terminal_states: [REVOKED]
    transitions:
      - from: null
        to: ALLOCATED
        trigger: "POST /allocation-lines"
        actor: ChannelManager
        preconditions:
          - "expected_allocation_cycle_version == allocation_cycle.version"
          - "allocation_cycle.status in {OPEN, PROPOSED}"
          - "channel_order.status in {SUBMITTED, PARTIAL, BACKORDERED} and channel_order.product_line_id == allocation_cycle.product_line_id"
          - "inventory_lot.status in {AVAILABLE, ALLOCATED} and inventory_lot.product_line_id == allocation_cycle.product_line_id and inventory_lot.plant_id == allocation_cycle.plant_id"
          - "allocated_sqft is an exact positive multiple of product_line.bag_sqft"
          - "allocated_sqft <= inventory_lot.available_sqft"
        side_effects:
          - "status := ALLOCATED; bags := allocated_sqft / product_line.bag_sqft"
          - "lot and order ledgers recomputed; cycle.allocated_sqft recomputed"
          - "increments AllocationCycle.version by 1"
        note: "Manual expedite line; bypasses the waterfall and lands directly in ALLOCATED."
      - from: PROPOSED
        to: ALLOCATED
        trigger: "system — POST /allocation-cycles/{cycleId}/commit"
        actor: system
        preconditions:
          - "status == PROPOSED and allocation_cycle.status == PROPOSED"
        side_effects:
          - "status := ALLOCATED"
      - from: PROPOSED
        to: REVOKED
        trigger: "system — cycle cancel, re-propose, or lot quarantine"
        actor: system
        preconditions:
          - "status == PROPOSED"
        side_effects:
          - "status := REVOKED; revoke_reason set to CYCLE_CANCELLED or LOT_QUARANTINED"
      - from: ALLOCATED
        to: REVOKED
        trigger: "POST /allocation-lines/{lineId}/revoke, or system cascade from lot quarantine / order cancel / cycle cancel"
        actor: ChannelManager | system
        preconditions:
          - "status == ALLOCATED"
        side_effects:
          - "status := REVOKED; revoke_reason := MANUAL_REVOKE, LOT_QUARANTINED, ORDER_CANCELLED or CYCLE_CANCELLED"
          - "inventory_lot.allocated_sqft / available_sqft / status recomputed"
          - "channel_order.allocated_sqft / fill_rate_pct / status recomputed"
          - "allocation_cycle.allocated_sqft / unallocated_sqft recomputed"
        note: "Compensating leg of the commit; the per-ProductLine sqft conservation invariant must hold exactly afterwards."

  - entity: ChannelOrder
    initial_state: SUBMITTED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: ALLOCATED
        trigger: "system — POST /allocation-cycles/{cycleId}/commit or POST /allocation-lines"
        actor: system
        preconditions:
          - "status == SUBMITTED"
          - "allocated_sqft == requested_sqft after the booking"
        side_effects:
          - "status := ALLOCATED; fill_rate_pct := 100.00"
      - from: SUBMITTED
        to: PARTIAL
        trigger: "system — POST /allocation-cycles/{cycleId}/commit or POST /allocation-lines"
        actor: system
        preconditions:
          - "status == SUBMITTED"
          - "0 < allocated_sqft < requested_sqft after the booking"
        side_effects:
          - "status := PARTIAL; fill_rate_pct recomputed"
        note: "Divergent branch of the same commit trigger; the shortage path."
      - from: SUBMITTED
        to: BACKORDERED
        trigger: "system — POST /allocation-cycles/{cycleId}/commit"
        actor: system
        preconditions:
          - "status == SUBMITTED"
          - "allocated_sqft == 0.00 after the commit (the order was eligible but the waterfall could not fund a whole bag)"
        side_effects:
          - "status := BACKORDERED; fill_rate_pct := 0.00"
      - from: ALLOCATED
        to: PARTIAL
        trigger: "system — line revocation reduces the order below its request"
        actor: system
        preconditions:
          - "status == ALLOCATED"
          - "0 < allocated_sqft < requested_sqft after the revocation"
        side_effects:
          - "status := PARTIAL; fill_rate_pct recomputed"
      - from: ALLOCATED
        to: BACKORDERED
        trigger: "system — line revocation removes the order's entire allocation at once (manual revoke, lot quarantine cascade, or cycle cancel)"
        actor: system
        preconditions:
          - "status == ALLOCATED"
          - "allocated_sqft == 0.00 after the revocation"
        side_effects:
          - "status := BACKORDERED; fill_rate_pct := 0.00"
        note: "A fully-filled order can drop straight to BACKORDERED without passing through PARTIAL when its only line is revoked."
      - from: PARTIAL
        to: BACKORDERED
        trigger: "system — line revocation removes the order's last allocated square foot"
        actor: system
        preconditions:
          - "status == PARTIAL"
          - "allocated_sqft == 0.00 after the revocation"
        side_effects:
          - "status := BACKORDERED; fill_rate_pct := 0.00"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /channel-orders/{orderId}/ship"
        actor: ChannelManager
        preconditions:
          - "status == ALLOCATED"
          - "allocated_sqft > 0.00"
          - "no InventoryLot referenced by an ALLOCATED line of this order has status == QUARANTINED"
        side_effects:
          - "status := SHIPPED"
          - "every InventoryLot whose entire allocated_sqft belongs to this order transitions ALLOCATED -> CONSUMED"
      - from: PARTIAL
        to: SHIPPED
        trigger: "POST /channel-orders/{orderId}/ship"
        actor: ChannelManager
        preconditions:
          - "status == PARTIAL"
          - "allocated_sqft > 0.00"
          - "no InventoryLot referenced by an ALLOCATED line of this order has status == QUARANTINED"
        side_effects:
          - "identical to ALLOCATED -> SHIPPED; the unfilled balance is dropped"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /channel-orders/{orderId}/cancel"
        actor: ChannelBuyer
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID == placed_by_user_id"
        side_effects:
          - "status := CANCELLED"
      - from: PARTIAL
        to: CANCELLED
        trigger: "POST /channel-orders/{orderId}/cancel"
        actor: ChannelBuyer
        preconditions:
          - "status == PARTIAL"
          - "X-User-ID == placed_by_user_id"
        side_effects:
          - "status := CANCELLED"
          - "every AllocationLine of this order with status in {PROPOSED, ALLOCATED} transitions to REVOKED with revoke_reason = ORDER_CANCELLED; lots and the cycle are recomputed"
      - from: BACKORDERED
        to: CANCELLED
        trigger: "POST /channel-orders/{orderId}/cancel"
        actor: ChannelBuyer
        preconditions:
          - "status == BACKORDERED"
          - "X-User-ID == placed_by_user_id"
        side_effects:
          - "status := CANCELLED"

  - entity: CulletBatch
    initial_state: STAGED
    terminal_states: [REJECTED]
    transitions:
      - from: STAGED
        to: CHARGED
        trigger: "system — POST /production-runs/{runId}/start-melt selects this batch"
        actor: system
        preconditions:
          - "status == STAGED"
          - "the batch's mass_kg fits entirely inside the run's remaining cullet headroom per calculations.cullet_charge_allocation"
        side_effects:
          - "status := CHARGED; charged_run_id := run.id"
          - "plant.cullet_on_hand_kg -= mass_kg; plant.cullet_charged_kg_ytd += mass_kg"
      - from: CHARGED
        to: STAGED
        trigger: "POST /cullet-batches/{batchId}/reverse, or system cascade from POST /production-runs/{runId}/abort"
        actor: PlantOperator | system
        preconditions:
          - "status == CHARGED"
          - "the charged run's run_status == MELTING (reversal window closes once curing starts)"
        side_effects:
          - "status := STAGED; charged_run_id := null"
          - "plant.cullet_on_hand_kg += mass_kg; plant.cullet_charged_kg_ytd -= mass_kg; plant.cullet_fraction_ytd recomputed"
          - "run.cullet_charged_kg -= mass_kg; run.virgin_batch_kg += mass_kg; run.cullet_fraction recomputed"
        note: "Compensating leg; the glass-mass invariant must hold exactly afterwards. melt_posture is NOT auto-cleared — that needs posture-review."
      - from: STAGED
        to: REJECTED
        trigger: "POST /cullet-batches/{batchId}/reject"
        actor: PlantOperator
        preconditions:
          - "status == STAGED"
          - "reject_reason is a non-empty string"
        side_effects:
          - "status := REJECTED; reject_reason := payload value"
          - "plant.cullet_on_hand_kg -= mass_kg; plant.cullet_rejected_kg_ytd += mass_kg"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only sanctioned
# mechanism; both entries pass the serial-observability filter because a second
# sequential request against unchanged state would legitimately succeed)
# =============================================================================

concurrency_rules:
  - rule_id: allocation-line-create-stale-cycle
    parent_entity: AllocationCycle
    write_endpoint: "POST /allocation-lines"
    occ_field: "expected_allocation_cycle_version"
    description: |
      Creating a manual AllocationLine against an AllocationCycle whose version
      has advanced since the client last read it is rejected. Adding a second
      expedite line to the same cycle is legitimate product behaviour, so the
      only thing that distinguishes an accidental duplicate booking from an
      intended second line is whether the client's view of the cycle is current.
      The check is a stale-version comparison, not a timing question.
    error_id: ERR_STALE_ALLOCATION_CYCLE_VERSION
    http_status: 412

  - rule_id: cullet-batch-stage-stale-plant
    parent_entity: Plant
    write_endpoint: "POST /cullet-batches"
    occ_field: "expected_plant_version"
    description: |
      Staging a CulletBatch against a Plant whose version has advanced since the
      client last read it is rejected. Staging several batches at one plant is
      legitimate, so the cullet ledger is protected by requiring the writer to
      prove its view of plant.cullet_on_hand_kg, cullet_fraction_ytd and
      melt_posture is the one it read.
    error_id: ERR_STALE_PLANT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# All money/area/mass figures are Decimal; every quantize uses the rounding mode
# named on the rule. No floating-point accumulation is permitted.
# =============================================================================

calculations:
  - name: changeover_scrap_accounting
    entity: ChangeoverEvent
    trigger: "POST /changeover-events (PROVISIONAL) and POST /changeover-events/{changeoverId}/close (RECONCILED)"
    algorithm_type: threshold
    precision: "2 decimal places, ROUND_HALF_UP"
    variants:
      - variant: PROVISIONAL
        when: "evaluated at ChangeoverEvent creation, before the trim scale reading exists"
        formula: |
          density_delta_pct = quantize(
              abs(to_density_pcf - from_density_pcf) / from_density_pcf * 100, 2)

          purge_minutes = TRANSITION_BASE_MIN
                        + min(DENSITY_PURGE_CAP_MIN,
                              quantize(density_delta_pct * DENSITY_MIN_PER_PCT, 2))
                        + (WIDTH_CHANGE_MIN  if from_width_in != to_width_in else 0)
                        + (FACING_CHANGE_MIN if facing_changed            else 0)

          provisional_scrap_kg = quantize(purge_minutes * outgoing_run.mass_rate_kg_per_min, 2)
        output_fields: [density_delta_pct, purge_minutes, provisional_scrap_kg]
      - variant: RECONCILED
        when: "evaluated at close, once weighed_trim_kg has been recorded on the scale"
        formula: |
          # provisional_scrap_kg is an ESTIMATE of the gross glass pulled during the
          # purge. At close the scale gives the actual gross trim, and part of that
          # trim is recovered back into the melt as cullet, so:
          #   reconciled_scrap_kg = the mass genuinely lost (gross trim less recovery)
          #   scrap_variance_kg   = how far the time-based estimate missed the scale
          reconciled_scrap_kg = quantize(weighed_trim_kg - recovered_cullet_kg, 2)
          scrap_variance_kg   = quantize(weighed_trim_kg - provisional_scrap_kg, 2)
        output_fields: [reconciled_scrap_kg, scrap_variance_kg]
    constants:
      TRANSITION_BASE_MIN: 12
      DENSITY_MIN_PER_PCT: 0.40
      DENSITY_PURGE_CAP_MIN: 20
      WIDTH_CHANGE_MIN: 8
      FACING_CHANGE_MIN: 15
      CHANGEOVER_PURGE_BUFFER_MIN: 30
    worked_example: |
      PL-A (0.80 pcf, 15 in, UNFACED, mass_rate 34.5 kg/min) -> PL-B (1.20 pcf, 23 in, KRAFT):
        density_delta_pct = |1.20 - 0.80| / 0.80 * 100        = 50.00
        density component  = min(20, 50.00 * 0.40) = min(20, 20.00) = 20.00   <- cap hit exactly
        purge_minutes      = 12 + 20.00 + 8 + 15               = 55.00
        provisional_scrap  = 55.00 * 34.5                      = 1897.50 kg
      At close with weighed_trim_kg = 1620.00 and recovered_cullet_kg = 1377.00:
        reconciled_scrap_kg = 1620.00 - 1377.00                = 243.00 kg
        scrap_variance_kg   = 1620.00 - 1897.50                = -277.50 kg
      The two variants disagree by 1654.50 kg on identical inputs because they answer
      different questions: PROVISIONAL prices the purge before the trim is weighed,
      RECONCILED prices the loss that survived recovery.

  - name: thermal_conformance_verdict
    entity: ThermalTest
    trigger: "POST /thermal-tests/{testId}/record-result"
    algorithm_type: threshold
    precision: "2 decimal places, ROUND_HALF_UP"
    input_set: "specimen_r_values as submitted on the record-result payload; declared_r_value_at_test and conformance_basis as pinned on the ThermalTest row at request time"
    variants:
      - variant: PER_SPECIMEN
        when: "conformance_basis == PER_SPECIMEN (pinned from certification_program.conformance_basis at ThermalTest creation)"
        formula: |
          floor_r = quantize(declared_r_value_at_test - program.r_value_tolerance, 2)
          specimen_count = len(specimen_r_values)
          mean_r_value   = quantize(sum(specimen_r_values) / specimen_count, 2)
          min_r_value    = quantize(min(specimen_r_values), 2)
          conformance_verdict = CONFORMING if min_r_value >= floor_r else NONCONFORMING
        output_fields: [specimen_count, mean_r_value, min_r_value, conformance_verdict]
      - variant: LOT_MEAN
        when: "conformance_basis == LOT_MEAN"
        formula: |
          floor_r = quantize(declared_r_value_at_test - program.r_value_tolerance, 2)
          specimen_count = len(specimen_r_values)
          mean_r_value   = quantize(sum(specimen_r_values) / specimen_count, 2)
          min_r_value    = quantize(min(specimen_r_values), 2)
          conformance_verdict = CONFORMING if mean_r_value >= floor_r else NONCONFORMING
        output_fields: [specimen_count, mean_r_value, min_r_value, conformance_verdict]
    constants:
      NONCONFORMANCE_SUSPEND_THRESHOLD: 2
    worked_example: |
      declared_r_value_at_test 13.0, r_value_tolerance 0.30 -> floor_r = 12.70.
      specimen_r_values = [12.70, 13.10, 12.40]:
        mean_r_value = 38.20 / 3 = 12.7333... -> 12.73
        min_r_value  = 12.40
        PER_SPECIMEN: 12.40 >= 12.70 is false -> NONCONFORMING
        LOT_MEAN:     12.73 >= 12.70 is true  -> CONFORMING
      Identical specimen data, opposite verdicts; the divergence is driven only by
      the pinned basis. Replacing 12.40 with 12.70 makes PER_SPECIMEN conform at
      exactly the floor (12.70 >= 12.70 -> CONFORMING).

  - name: packaging_compression_economics
    entity: ProductLine
    trigger: "POST /product-lines and PATCH /product-lines/{productLineId}/packaging"
    algorithm_type: threshold
    precision: "recovered_thickness_pct 2 dp ROUND_HALF_UP; compressed_bale_volume_ft3 3 dp ROUND_HALF_UP; bales_per_truck integer ROUND_FLOOR; the three per-sqft costs 6 dp ROUND_HALF_UP"
    formula: |
      # 1. recovery at installation degrades past the free compression ratio,
      #    faced products lose a further fixed penalty, and a hard floor applies
      excess_ratio = max(Decimal("0"), compression_ratio - RECOVERY_FREE_RATIO)
      raw_recovery = Decimal("100")
                   - quantize(excess_ratio * RECOVERY_LOSS_PCT_PER_RATIO_PT, 2)
                   - (FACED_RECOVERY_PENALTY_PCT if facing_type != "UNFACED" else Decimal("0"))
      recovered_thickness_pct = max(RECOVERY_FLOOR_PCT, quantize(raw_recovery, 2))

      # 2. bale volume after compression
      compressed_bale_volume_ft3 = quantize(bale_volume_ft3 / compression_ratio, 3)

      # 3. a truck is limited by BOTH cube and payload; the binding limit wins
      by_volume  = floor(TRUCK_VOLUME_FT3  / compressed_bale_volume_ft3)
      by_payload = floor(TRUCK_PAYLOAD_KG  / bale_mass_kg)
      bales_per_truck = min(by_volume, by_payload)

      # 4. freight per square foot
      freight_cost_per_sqft = quantize(
          TRUCK_RATE_USD / (bales_per_truck * bag_sqft), 6)

      # 5. installed-recovery penalty: only shortfall below the declared minimum
      #    is charged back
      recovery_shortfall_pct = max(Decimal("0"),
                                   DECLARED_RECOVERY_MIN_PCT - recovered_thickness_pct)
      recovery_penalty_per_sqft = quantize(
          recovery_shortfall_pct * RECOVERY_PENALTY_USD_PER_PCT, 6)

      net_landed_cost_per_sqft = quantize(
          freight_cost_per_sqft + recovery_penalty_per_sqft, 6)
    constants:
      RECOVERY_FREE_RATIO: 4.0
      RECOVERY_LOSS_PCT_PER_RATIO_PT: 5.0
      FACED_RECOVERY_PENALTY_PCT: 2.0
      RECOVERY_FLOOR_PCT: 80.0
      TRUCK_VOLUME_FT3: 3800
      TRUCK_PAYLOAD_KG: 19500
      TRUCK_RATE_USD: 2450.00
      DECLARED_RECOVERY_MIN_PCT: 95.0
      RECOVERY_PENALTY_USD_PER_PCT: 0.0012
    worked_example: |
      PL-A: UNFACED, compression_ratio 6.0, bale_volume_ft3 21.0, bale_mass_kg 12.5,
      bag_sqft 88.0.
        excess_ratio            = 6.0 - 4.0 = 2.0
        raw_recovery            = 100 - (2.0 * 5.0) - 0 = 90.00
        recovered_thickness_pct = max(80.00, 90.00)      = 90.00
        compressed_bale_volume  = 21.0 / 6.0             = 3.500 ft3
        by_volume               = floor(3800 / 3.500)    = floor(1085.71) = 1085
        by_payload              = floor(19500 / 12.5)    = 1560
        bales_per_truck         = min(1085, 1560)        = 1085   <- cube-bound
        freight_cost_per_sqft   = 2450.00 / (1085 * 88.0) = 2450.00 / 95480
                                = 0.025660...            -> 0.025660
        recovery_shortfall_pct  = max(0, 95.0 - 90.00)   = 5.00
        recovery_penalty_per_sqft = 5.00 * 0.0012        = 0.006000
        net_landed_cost_per_sqft  = 0.025660 + 0.006000  = 0.031660

      PL-B: KRAFT (faced), compression_ratio 5.0, bale_volume_ft3 25.5,
      bale_mass_kg 15.0, bag_sqft 49.0.
        excess_ratio            = 1.0
        raw_recovery            = 100 - 5.00 - 2.0       = 93.00
        recovered_thickness_pct = 93.00
        compressed_bale_volume  = 25.5 / 5.0             = 5.100 ft3
        by_volume               = floor(3800 / 5.100)    = floor(745.09) = 745
        by_payload              = floor(19500 / 15.0)    = 1300
        bales_per_truck         = 745
        freight_cost_per_sqft   = 2450.00 / (745 * 49.0) = 2450.00 / 36505
                                = 0.067114...            -> 0.067114
        recovery_penalty        = max(0, 95.0 - 93.00) * 0.0012 = 2.00 * 0.0012
                                = 0.002400
        net_landed_cost_per_sqft = 0.069514

      Floor case: compression_ratio 8.0 on a faced SKU:
        raw_recovery = 100 - (4.0 * 5.0) - 2.0 = 78.00, below the 80.00 floor, so
        recovered_thickness_pct = 80.00 and the penalty is 15.00 * 0.0012 = 0.018000.

  - name: cullet_charge_allocation
    entity: ProductionRun
    trigger: "POST /production-runs/{runId}/start-melt"
    algorithm_type: aggregation
    precision: "total_charge_kg / allowed_cullet_kg / cullet_charged_kg / virgin_batch_kg 2 dp; allowed_cullet_kg uses ROUND_FLOOR, the others ROUND_HALF_UP; cullet_fraction and cullet_fraction_ytd 4 dp ROUND_HALF_UP"
    input_set: "the CulletBatch rows named by the start-melt payload's cullet_batch_ids, filtered to status == STAGED and plant_id == run.plant_id, evaluated in created_at ASC order"
    formula: |
      # The cap looks circular — cullet is capped as a fraction of the total charge,
      # and the total charge includes the cullet — so the evaluation order is pinned:
      #   1. total_charge_kg is derived from the pull target and the melt yield ONLY
      #   2. the cap is taken against that total, never against the virgin mass
      #   3. batches are consumed whole, greedily, in created_at ASC order
      #   4. a batch that does not fit whole is SKIPPED, not partially charged, and
      #      later smaller batches are still considered
      #   5. virgin glass is the residual, so the charge always sums exactly
      total_charge_kg  = quantize(target_pull_kg / MELT_YIELD, 2, ROUND_HALF_UP)
      allowed_cullet_kg = quantize(total_charge_kg * plant.max_cullet_fraction, 2, ROUND_FLOOR)

      cullet_charged_kg = Decimal("0.00")
      for batch in staged_batches_ordered_by_created_at_asc:
          if cullet_charged_kg + batch.mass_kg <= allowed_cullet_kg:
              cullet_charged_kg += batch.mass_kg     # batch -> CHARGED
          # else: batch stays STAGED and is left for a later run

      virgin_batch_kg = quantize(total_charge_kg - cullet_charged_kg, 2)
      cullet_fraction = quantize(cullet_charged_kg / total_charge_kg, 4)

      # plant-level rolling ledger, updated in the same request
      plant.cullet_charged_kg_ytd += cullet_charged_kg
      plant.total_charge_kg_ytd   += total_charge_kg
      plant.cullet_fraction_ytd    = quantize(
          plant.cullet_charged_kg_ytd / plant.total_charge_kg_ytd, 4)
      plant.cullet_on_hand_kg      = quantize(
          plant.cullet_received_kg_ytd - plant.cullet_charged_kg_ytd
                                       - plant.cullet_rejected_kg_ytd, 2)

      # posture side effect (see §1.2 Plant/melt_posture)
      if plant.cullet_fraction_ytd >= plant.cullet_restrict_fraction and
         plant.melt_posture == OPEN:
          plant.melt_posture  = RESTRICTED
          plant.posture_reason = CULLET_FRACTION_AT_RESTRICT_LEVEL
    constants:
      MELT_YIELD: 0.92
    worked_example: |
      Plant NWK (max_cullet_fraction 0.30, cullet_restrict_fraction 0.28,
      cullet_received_kg_ytd 3100.00) with three STAGED batches created in this
      order: B1 1200.00, B2 1400.00, B3 500.00 kg. Run target_pull_kg 9200.
        total_charge_kg   = 9200 / 0.92                 = 10000.00
        allowed_cullet_kg = floor2(10000.00 * 0.30)     = 3000.00
        B1: 0.00 + 1200.00 = 1200.00 <= 3000.00  -> CHARGED
        B2: 1200.00 + 1400.00 = 2600.00 <= 3000.00 -> CHARGED
        B3: 2600.00 + 500.00 = 3100.00 >  3000.00 -> SKIPPED, stays STAGED
        cullet_charged_kg = 2600.00
        virgin_batch_kg   = 10000.00 - 2600.00         = 7400.00
        cullet_fraction   = 2600.00 / 10000.00         = 0.2600
        plant.cullet_fraction_ytd = 0.2600 < 0.28      -> melt_posture stays OPEN
        plant.cullet_on_hand_kg   = 3100.00 - 2600.00 - 0.00 = 500.00
      Restrict boundary: replace B3 with a 400.00 kg batch created before B1 and the
      greedy pass charges 400.00 + 1200.00 + 1400.00 = 3000.00, giving
      cullet_fraction_ytd exactly 0.3000 >= 0.28, so melt_posture becomes RESTRICTED.
      An exact-equality boundary is reachable with 2800.00 kg charged:
      0.2800 >= 0.2800 is true, so RESTRICTED fires at equality.

  - name: binder_cure_index
    entity: ProductionRun
    trigger: "POST /production-runs/{runId}/start-cure"
    algorithm_type: threshold
    precision: "dwell_s 2 dp ROUND_HALF_UP; cure_index 2 dp ROUND_HALF_UP; intermediate ratios carried at full Decimal precision and quantized only at the end"
    formula: |
      dwell_s = quantize(plant.oven_length_ft / line_speed_fpm * 60, 2)

      temp_margin_ratio = (avg_zone_temp_f - binder.min_cure_temp_f) / CURE_TEMP_SPAN_F
      temp_margin_ratio = min(Decimal("1"), max(Decimal("0"), temp_margin_ratio))

      dwell_ratio = min(DWELL_RATIO_CAP, dwell_s / binder.min_dwell_s)

      cure_index = quantize(
          dwell_ratio * (Decimal("1") + temp_margin_ratio) / Decimal("2") * 100, 2)

      # gate
      if cure_index < MIN_CURE_INDEX: reject with ERR_CURE_INDEX_BELOW_MINIMUM
    constants:
      CURE_TEMP_SPAN_F: 60.0
      MAX_BINDER_REVISIONS: 2
      DWELL_RATIO_CAP: 1.25
      MIN_CURE_INDEX: 100.00
    worked_example: |
      Plant NWK oven_length_ft 120; binder BF-FREE-1 (min_cure_temp_f 420,
      min_dwell_s 150); start-cure with avg_zone_temp_f 470.0, line_speed_fpm 40.0:
        dwell_s           = 120 / 40 * 60                     = 180.00
        temp_margin_ratio = (470.0 - 420) / 60.0              = 0.8333333...
        dwell_ratio       = min(1.25, 180.00 / 150)           = 1.2
        cure_index        = 1.2 * 1.8333333... / 2 * 100      = 110.00   -> passes
      Failing case: avg_zone_temp_f 430.0, line_speed_fpm 60.0:
        dwell_s           = 120.00, dwell_ratio = 0.8
        temp_margin_ratio = 10 / 60.0 = 0.1666666...
        cure_index        = 0.8 * 1.1666666... / 2 * 100 = 46.6666... -> 46.67
        46.67 < 100.00 -> ERR_CURE_INDEX_BELOW_MINIMUM (422)
      Clamp case: avg_zone_temp_f 410.0 gives a negative raw margin which clamps to
      0, so cure_index = dwell_ratio * 1 / 2 * 100 = 60.00 at 40 fpm.

  - name: permit_period_emissions
    entity: Plant
    trigger: "POST /production-runs/{runId}/start-cure (per-run mass) and POST /plants/{plantId}/emissions-report (period roll-up)"
    algorithm_type: aggregation
    precision: "4 decimal places, ROUND_HALF_UP"
    input_set: "ProductionRuns of this plant whose scheduled_start falls inside the closed interval [period_start, period_end] and whose run_status is in {CURING, PACKAGED, CLOSED}"
    formula: |
      # per-run, at start-cure, from the binder actually applied
      run.formaldehyde_kg = quantize(
          binder_applied_kg * binder.formaldehyde_ppm / Decimal("1000000"), 4)
      run.voc_kg = quantize(
          binder_applied_kg * binder.voc_g_per_kg / Decimal("1000"), 4)

      # period roll-up, at emissions-report
      reported_formaldehyde_kg = quantize(sum(r.formaldehyde_kg for r in input_set), 4)
      reported_voc_kg          = quantize(sum(r.voc_kg          for r in input_set), 4)

      exceeded = (reported_formaldehyde_kg > plant.formaldehyde_allowance_kg) or
                 (reported_voc_kg          > plant.voc_allowance_kg)

      emissions_status := EXCEEDANCE if exceeded else REPORTED
    constants:
      FORMALDEHYDE_CERT_LIMIT_PPM: 300
      VOC_CERT_LIMIT_G_PER_KG: 6.0
    worked_example: |
      Plant NWK: formaldehyde_allowance_kg 0.200, voc_allowance_kg 12.0.
      One run on binder BF-PHEN-1 (formaldehyde_ppm 250, voc_g_per_kg 4.1) with
      binder_applied_kg 900.0:
        formaldehyde_kg = 900.0 * 250 / 1000000 = 0.225      -> 0.2250
        voc_kg          = 900.0 * 4.1 / 1000    = 3.69       -> 3.6900
      Period report over [2026-08-01T00:00:00Z, 2026-08-31T23:59:59Z]:
        reported_formaldehyde_kg = 0.2250 > 0.200 -> exceeded -> EXCEEDANCE
        reported_voc_kg          = 3.6900 <= 12.0
      Boundary: with formaldehyde_allowance_kg 0.2250 the comparison is
      0.2250 > 0.2250 == false, so the status is REPORTED, not EXCEEDANCE.
      A run on BF-FREE-1 (formaldehyde_ppm 0) contributes 0.0000 formaldehyde and
      900.0 * 3.2 / 1000 = 2.8800 kg VOC.

  - name: channel_allocation_waterfall
    entity: AllocationCycle
    trigger: "POST /allocation-cycles/{cycleId}/propose"
    algorithm_type: waterfall_allocation
    precision: "all sqft figures 2 dp ROUND_HALF_UP; seasonal_reserve_sqft ROUND_HALF_UP; per-order bag counts ROUND_FLOOR (whole bags only); shortage_ratio 4 dp ROUND_HALF_UP; fill_rate_pct 2 dp ROUND_HALF_UP"
    input_set: |
      Supply: InventoryLot rows with plant_id == cycle.plant_id,
      product_line_id == cycle.product_line_id and status == AVAILABLE, taken in
      created_at ASC order.
      Demand: ChannelOrder rows with product_line_id == cycle.product_line_id,
      status in {SUBMITTED, PARTIAL, BACKORDERED}, required_by <= cycle.period_end,
      and remaining_sqft = requested_sqft - allocated_sqft > 0.
    formula: |
      total_available_sqft = quantize(sum(lot.available_sqft for lot in supply), 2)

      peak_season = (period_start.month in PEAK_MONTHS)
      reserve_pct = PEAK_RESERVE_PCT if peak_season else OFFPEAK_RESERVE_PCT
      seasonal_reserve_sqft = quantize(total_available_sqft * reserve_pct, 2)
      allocatable_sqft      = quantize(total_available_sqft - seasonal_reserve_sqft, 2)

      if allocatable_sqft <= 0:      reject ERR_NO_ALLOCATABLE_SUPPLY
      if len(demand) == 0:           reject ERR_NO_ELIGIBLE_ORDERS

      total_requested_sqft = quantize(sum(o.remaining_sqft for o in demand), 2)
      shortage_ratio = min(Decimal("1.0000"),
                           quantize(allocatable_sqft / total_requested_sqft, 4))

      # deterministic order: tier rank, then earliest need, then creation order.
      # `id` is never consulted.
      demand_sorted = sort(demand, key=(TIER_RANK[priority_tier],
                                        required_by ASC,
                                        created_at ASC))
    variants:
      - variant: CONTRACT_FIRST
        when: "allocation_cycle.allocation_basis == CONTRACT_FIRST"
        formula: |
          pool = allocatable_sqft
          for o in demand_sorted:
              want  = min(o.remaining_sqft, pool)
              bags  = floor(want / product_line.bag_sqft)
              grant = quantize(bags * product_line.bag_sqft, 2)
              o.grant = grant
              pool = quantize(pool - grant, 2)
          # strict priority: an earlier tier is filled to its whole-bag maximum
          # before the next tier sees anything
        output_fields: [allocated_sqft, unallocated_sqft]
      - variant: PRO_RATA
        when: "allocation_cycle.allocation_basis == PRO_RATA"
        formula: |
          # pass 1 — proportional whole-bag share
          for o in demand_sorted:
              share = o.remaining_sqft * shortage_ratio
              bags  = floor(share / product_line.bag_sqft)
              o.grant = quantize(bags * product_line.bag_sqft, 2)
          pool = quantize(allocatable_sqft - sum(o.grant), 2)
          # pass 2 — the whole-bag remainder is handed out one bag at a time in the
          # same deterministic order, skipping orders already fully filled
          while pool >= product_line.bag_sqft:
              progressed = False
              for o in demand_sorted:
                  if o.grant + product_line.bag_sqft <= o.remaining_sqft and
                     pool >= product_line.bag_sqft:
                      o.grant = quantize(o.grant + product_line.bag_sqft, 2)
                      pool    = quantize(pool - product_line.bag_sqft, 2)
                      progressed = True
              if not progressed: break
        output_fields: [allocated_sqft, unallocated_sqft]
    post_processing: |
      allocated_sqft   = quantize(sum(o.grant for o in demand_sorted), 2)
      unallocated_sqft = quantize(allocatable_sqft - allocated_sqft, 2)

      # lines are cut against lots in created_at ASC, draining each lot before
      # moving to the next; an order may span several lots
      for o in demand_sorted with o.grant > 0:
          remaining = o.grant
          for lot in supply (created_at ASC) with lot.available_sqft > 0:
              take = min(remaining, lot.available_sqft)
              bags = take / product_line.bag_sqft          # always integral here
              emit AllocationLine(status=PROPOSED, allocated_sqft=take, bags=bags)
              remaining -= take
              if remaining == 0: break

      # per-order roll-up, applied at commit
      channel_order.allocated_sqft = quantize(prior_allocated + o.grant, 2)
      channel_order.fill_rate_pct  = quantize(
          channel_order.allocated_sqft / channel_order.requested_sqft * 100, 2)
      channel_order.status = ALLOCATED   if allocated_sqft == requested_sqft
                             else PARTIAL if allocated_sqft > 0
                             else BACKORDERED
    constants:
      PEAK_RESERVE_PCT: 0.15
      OFFPEAK_RESERVE_PCT: 0.05
      PEAK_MONTHS: [3, 4, 5, 6, 7, 8, 9]
      TIER_RANK: {CONTRACT: 1, PROGRAM: 2, SPOT: 3}
    worked_example: |
      ProductLine PL-A (bag_sqft 88.0). Supply: lot L1 available 10560.00 (120 bags,
      created first) and lot L2 available 5280.00 (60 bags).
        total_available_sqft  = 15840.00
        period_start 2026-08-01 -> month 8 in PEAK_MONTHS -> peak_season true
        seasonal_reserve_sqft = 15840.00 * 0.15 = 2376.00
        allocatable_sqft      = 13464.00                  (= 153 whole bags)
      Demand: O1 CONTRACT 8800.00 (100 bags), O2 PROGRAM 6160.00 (70 bags),
      O3 SPOT 4400.00 (50 bags); all required_by <= period_end.
        total_requested_sqft = 19360.00
        shortage_ratio       = 13464.00 / 19360.00 = 0.6952479... -> 0.6952

      CONTRACT_FIRST:
        O1: want min(8800.00, 13464.00) = 8800.00 -> 100 bags -> 8800.00; pool 4664.00
        O2: want min(6160.00,  4664.00) =  4664.00 -> floor(53.0) = 53 bags -> 4664.00;
            pool 0.00
        O3: pool 0.00 -> 0 bags -> 0.00 -> BACKORDERED
        allocated_sqft 13464.00, unallocated_sqft 0.00
        fill rates: O1 100.00, O2 4664.00/6160.00 = 75.7142... -> 75.71, O3 0.00
        lines: (O1,L1,8800.00,100) (O2,L1,1760.00,20) (O2,L2,2904.00,33)
        L1.available -> 0.00 (status ALLOCATED); L2.available -> 2376.00 (AVAILABLE)

      PRO_RATA on the same data:
        pass 1: O1 floor(8800.00*0.6952/88.0) = floor(69.52) = 69 bags -> 6072.00
                O2 floor(6160.00*0.6952/88.0) = floor(48.66) = 48 bags -> 4224.00
                O3 floor(4400.00*0.6952/88.0) = floor(34.76) = 34 bags -> 2992.00
                sum 13288.00, pool = 13464.00 - 13288.00 = 176.00 (2 whole bags)
        pass 2: O1 +88.00 -> 6160.00 (pool 88.00); O2 +88.00 -> 4312.00 (pool 0.00)
        allocated_sqft 13464.00, unallocated_sqft 0.00
        fill rates: O1 6160.00/8800.00 = 70.00, O2 4312.00/6160.00 = 70.00,
                    O3 2992.00/4400.00 = 68.00; all three PARTIAL
      Divergence: identical supply and demand, but CONTRACT_FIRST leaves the SPOT
      order at 0.00 / BACKORDERED while PRO_RATA funds it 2992.00 / PARTIAL, and the
      CONTRACT order lands at 8800.00 vs 6160.00.
      Off-peak check: the same cycle with period_start 2026-01-01 reserves only
      15840.00 * 0.05 = 792.00, so allocatable_sqft = 15048.00 (171 bags).

  - name: lot_allocation_ledger
    entity: InventoryLot
    trigger: "system — recomputed inside POST /allocation-cycles/{cycleId}/commit, POST /allocation-lines, POST /allocation-lines/{lineId}/revoke, POST /allocation-cycles/{cycleId}/cancel, POST /channel-orders/{orderId}/cancel, and the lot quarantine / release / repack endpoints"
    algorithm_type: aggregation
    precision: "2 decimal places, ROUND_HALF_UP; bags are integers"
    input_set: "AllocationLine rows whose inventory_lot_id is this lot and whose status == ALLOCATED. PROPOSED lines are reservations only and are excluded; REVOKED lines are excluded."
    formula: |
      allocated_sqft = quantize(sum(line.allocated_sqft for line in input_set), 2)

      if status in {QUARANTINED, REPACKED, CONSUMED, SCRAPPED}:
          available_sqft = Decimal("0.00")
      else:
          available_sqft = quantize(produced_sqft - allocated_sqft, 2)

      # derived status for a live lot
      if status in {AVAILABLE, ALLOCATED}:
          status = ALLOCATED if available_sqft == Decimal("0.00") else AVAILABLE

      # per-ProductLine conservation invariant, asserted after every write above
      sum(lot.available_sqft for live lots)
        + sum(line.allocated_sqft for ALLOCATED lines on those lots)
        == sum(lot.produced_sqft for live lots)
    constants: {}
    worked_example: |
      Lot L1 produced_sqft 10560.00, one ALLOCATED line of 8800.00:
        allocated_sqft = 8800.00, available_sqft = 1760.00, status AVAILABLE
      Add a second ALLOCATED line of 1760.00:
        allocated_sqft = 10560.00, available_sqft = 0.00, status ALLOCATED
      Revoke the 8800.00 line:
        allocated_sqft = 1760.00, available_sqft = 8800.00, status back to AVAILABLE
        invariant: 8800.00 + 1760.00 == 10560.00
      Quarantine the lot while both lines are ALLOCATED:
        available_sqft = 0.00 and both lines go REVOKED, so allocated_sqft = 0.00 and
        the lot leaves the live set; the conservation sum excludes it.

  - name: declared_value_derate
    entity: ProductLine
    trigger: "POST /product-lines/{productLineId}/certification-decision"
    algorithm_type: threshold
    precision: "effective_declared_r_value 2 dp, snapped DOWN to the nearest DERATE_STEP (ROUND_FLOOR on the step multiple)"
    input_set: "the most recently created ThermalTest of this product_line_id with status in {COMPLETED, EXHAUSTED} and a non-null conformance_verdict, taken in created_at ASC order and using the last row"
    formula: |
      basis_value = min_r_value  if program.conformance_basis == PER_SPECIMEN
                    else mean_r_value      # LOT_MEAN

      if decision == CERTIFY:
          effective_declared_r_value = declared_r_value          # no derate
      elif decision == DERATE:
          if not program.derate_allowed:   reject ERR_DERATE_NOT_PERMITTED
          steps = quantize(basis_value / DERATE_STEP, 0, ROUND_FLOOR)
          effective_declared_r_value = quantize(steps * DERATE_STEP, 2)
          if effective_declared_r_value <= 0 or
             effective_declared_r_value >= declared_r_value:
              reject ERR_DERATE_NOT_PERMITTED
    constants:
      DERATE_STEP: 0.5
    worked_example: |
      PL-A declared_r_value 13.0 on program RCERT-PS (PER_SPECIMEN, derate_allowed
      true). Latest COMPLETED test has min_r_value 12.40, mean_r_value 12.73.
        basis_value = 12.40 (PER_SPECIMEN)
        steps       = floor(12.40 / 0.5) = floor(24.8) = 24
        effective_declared_r_value = 24 * 0.5 = 12.00
      On program RCERT-LM (LOT_MEAN) the same specimens give basis_value 12.73:
        steps = floor(25.46) = 25 -> effective_declared_r_value = 12.50
      A CERTIFY decision instead sets effective_declared_r_value = 13.00 exactly.
      Exact-step case: basis_value 12.50 -> floor(25.0) = 25 -> 12.50, i.e. a value
      already on the step is not pushed down.

  - name: scrap_cullet_recovery
    entity: CulletBatch
    trigger: "POST /inventory-lots/{lotId}/quarantine with disposition = SCRAP"
    algorithm_type: threshold
    precision: "gross_mass_kg and mass_kg 2 dp ROUND_HALF_UP"
    formula: |
      # the scale reading wins when supplied; otherwise the bale bill of materials
      if weighed_scrap_lb is not null:
          gross_mass_kg = quantize(weighed_scrap_lb * LB_TO_KG, 2)
      else:
          gross_mass_kg = quantize(lot.bags * product_line.bale_mass_kg, 2)

      # facing paper and foil are not glass and never reach the melt
      glass_mass_kg = gross_mass_kg if product_line.facing_type == "UNFACED"
                      else quantize(gross_mass_kg * (1 - FACING_MASS_FRACTION), 2)

      mass_kg = quantize(glass_mass_kg * SCRAP_CULLET_RECOVERY, 2)
    constants:
      LB_TO_KG: 0.45359237
      FACING_MASS_FRACTION: 0.08
      SCRAP_CULLET_RECOVERY: 0.85
    worked_example: |
      PL-A lot (UNFACED), 120 bags, bale_mass_kg 12.5, no scale reading:
        gross_mass_kg = 120 * 12.5     = 1500.00
        glass_mass_kg = 1500.00        (unfaced)
        mass_kg       = 1500.00 * 0.85 = 1275.00
      PL-B lot (KRAFT), 60 bags, bale_mass_kg 15.0:
        gross_mass_kg = 900.00
        glass_mass_kg = 900.00 * 0.92  = 828.00
        mass_kg       = 828.00 * 0.85  = 703.80
      Scale path, PL-A, weighed_scrap_lb 3000.0:
        gross_mass_kg = 3000.0 * 0.45359237 = 1360.77711 -> 1360.78
        mass_kg       = 1360.78 * 0.85      = 1156.663   -> 1156.66
      The pound path and the bill-of-materials path disagree by design; the scale
      reading is authoritative whenever present.

# =============================================================================
# §1.4 Validation Rules — a single global priority ladder. Every write endpoint
# evaluates the applicable rules in ascending `priority` and returns the FIRST
# violation it meets. Lower number == checked earlier == wins the conflict.
# =============================================================================

validations:
  # --- 1. transport / identity -------------------------------------------------
  - priority: 1
    category: auth
    rule: "X-User-ID and X-User-Role headers must both be present and non-empty on every endpoint except GET /_health"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 5
    category: auth
    rule: "X-User-Role must be one of the seven roles in §1.7 and must appear in the target endpoint's `roles` list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  # --- 2. path existence, left to right ---------------------------------------
  - priority: 10
    category: existence
    rule: "Every id in the request PATH must resolve to an existing row, checked left to right; the leftmost unresolved id determines the error"
    error_id: "ERR_PLANT_NOT_FOUND | ERR_CERTIFICATION_PROGRAM_NOT_FOUND | ERR_BINDER_FORMULATION_NOT_FOUND | ERR_PRODUCT_LINE_NOT_FOUND | ERR_PRODUCTION_RUN_NOT_FOUND | ERR_CHANGEOVER_EVENT_NOT_FOUND | ERR_THERMAL_TEST_NOT_FOUND | ERR_INVENTORY_LOT_NOT_FOUND | ERR_ALLOCATION_CYCLE_NOT_FOUND | ERR_CHANNEL_ORDER_NOT_FOUND | ERR_ALLOCATION_LINE_NOT_FOUND | ERR_CULLET_BATCH_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  # --- 3. ownership -----------------------------------------------------------
  - priority: 15
    category: auth
    rule: "When X-User-Role is PlantOperator, X-User-ID must equal the plant_id that the target row belongs to (directly for Plant paths, transitively through plant_id for ProductionRun, ChangeoverEvent, InventoryLot and CulletBatch)"
    error_id: ERR_PLANT_NOT_OWNED
    http_status: 403
    applies_to: "every PlantOperator-permitted write endpoint"
  - priority: 16
    category: auth
    rule: "When X-User-Role is ChannelBuyer, X-User-ID must equal channel_order.placed_by_user_id"
    error_id: ERR_ORDER_NOT_OWNED
    http_status: 403
    applies_to: "POST /channel-orders/{orderId}/cancel"

  # --- 4. request shape -------------------------------------------------------
  - priority: 20
    category: business_constraint
    rule: |
      Request-shape validation: every required input field present; enums drawn from
      their declared value set; numeric fields inside their declared range
      (density_pcf > 0, thickness_in > 0, declared_r_value > 0, compression_ratio in
      [1.0, 8.0], width_in in {15, 16, 23, 24}, oven_zone_count >= 1,
      production_line_count >= 1, max_cullet_fraction in (0, 0.5],
      cullet_restrict_fraction in (0, max_cullet_fraction], target_pull_kg > 0,
      line_speed_fpm > 0, avg_zone_temp_f > 0, binder_applied_kg > 0,
      bags_produced > 0, requested_sqft > 0, mass_kg > 0, allocated_sqft > 0,
      formaldehyde_ppm >= 0, voc_g_per_kg >= 0, r_value_tolerance >= 0,
      min_specimen_count >= 1, max_concurrent_lab_tests >= 1, retest_limit >= 1);
      every timestamp an RFC3339 UTC instant; every interval end strictly after its
      start; arrays non-empty where required. Unknown fields and fields whose
      `source` is `computed` or `system` are ignored, never rejected.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  # --- 5. body foreign keys ---------------------------------------------------
  - priority: 25
    category: existence
    rule: "Every foreign key supplied in the request BODY must resolve; body FKs are checked in the field order declared in §1.5 after the request shape has been accepted"
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND from priority 10"
    http_status: 404
    applies_to: "POST /product-lines, POST /production-runs, POST /changeover-events, POST /thermal-tests, POST /allocation-cycles, POST /channel-orders, POST /allocation-lines, POST /cullet-batches, POST /production-runs/{runId}/start-melt"

  # --- 6. optimistic concurrency ---------------------------------------------
  - priority: 30
    category: business_referential
    rule: "expected_allocation_cycle_version must equal allocation_cycle.version"
    error_id: ERR_STALE_ALLOCATION_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /allocation-lines"
  - priority: 31
    category: business_referential
    rule: "expected_plant_version must equal plant.version"
    error_id: ERR_STALE_PLANT_VERSION
    http_status: 412
    applies_to: "POST /cullet-batches"

  # --- 7. state -----------------------------------------------------------------
  - priority: 40
    category: state
    rule: "The target row's state must permit the requested transition per §1.2; a trigger issued from a state with no matching outgoing edge is rejected, including every repeat of an already-applied trigger and every trigger against a terminal state. Any §1.2 precondition that no more specific rule in this table already covers also reports ERR_INVALID_STATE — in particular the SCHEDULED -> MELTING gate `logical clock >= scheduled_start` (a run may not be started before its scheduled window opens) and the ProductLine PENDING_CERTIFICATION -> CERTIFIED|DERATED gate requiring a COMPLETED ThermalTest for that SKU"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 45
    category: state
    rule: "plant.melt_posture must not be FROZEN for POST /production-runs, POST /production-runs/{runId}/start-melt, POST /cullet-batches and POST /allocation-cycles/{cycleId}/commit"
    error_id: ERR_MELT_POSTURE_FROZEN
    http_status: 409
    applies_to: "the endpoints named in the rule"
  - priority: 46
    category: state
    rule: "When plant.melt_posture is RESTRICTED, POST /cullet-batches is rejected: no new cullet may be staged until an EnvironmentalCompliance posture-review clears the plant back to OPEN"
    error_id: ERR_MELT_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /cullet-batches"

  # --- 8. safety / certification integrity ------------------------------------
  - priority: 50
    category: business_safety
    rule: "A BinderFormulation with formaldehyde_free == true must declare formaldehyde_ppm == 0; a formulation with formaldehyde_free == false must declare formaldehyde_ppm > 0"
    error_id: ERR_FORMALDEHYDE_FREE_CLAIM_INVALID
    http_status: 422
    applies_to: "POST /binder-formulations, POST /binder-formulations/{binderId}/revise"
  - priority: 52
    category: business_safety
    rule: "The ProductLine's BinderFormulation must have status == CERTIFIED before a ProductionRun may be scheduled against that line, and before the SKU may be submitted for thermal certification"
    error_id: ERR_BINDER_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /production-runs, POST /product-lines/{productLineId}/submit-certification"
  - priority: 54
    category: business_safety
    rule: "At POST /binder-formulations/{binderId}/emissions-test the measured formaldehyde_ppm must be <= FORMALDEHYDE_CERT_LIMIT_PPM and voc_g_per_kg <= VOC_CERT_LIMIT_G_PER_KG, otherwise the formulation cannot enter EMISSIONS_TESTING"
    error_id: ERR_FORMALDEHYDE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /binder-formulations/{binderId}/emissions-test"
  - priority: 56
    category: business_safety
    rule: "No InventoryLot referenced by the operation may have status == QUARANTINED"
    error_id: ERR_LOT_QUARANTINED
    http_status: 409
    applies_to: "POST /allocation-lines, POST /allocation-cycles/{cycleId}/commit, POST /channel-orders/{orderId}/ship"
  - priority: 58
    category: business_safety
    rule: "Releasing a QUARANTINED InventoryLot requires production_run.qc_status == CONFORMING"
    error_id: ERR_RUN_NOT_CONFORMING
    http_status: 409
    applies_to: "POST /inventory-lots/{lotId}/release"
  - priority: 59
    category: business_safety
    rule: "Segregation of duties: the X-User-ID issuing POST /product-lines/{productLineId}/certification-decision must differ from every recorded_by_user_id on the ThermalTests of that product line, and must differ from product_line.certified_by_user_id on a re-decision"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /product-lines/{productLineId}/certification-decision"

  # --- 9. temporal / resource occupancy ---------------------------------------
  - priority: 60
    category: business_temporal
    rule: |
      A new ChangeoverEvent's purge window, inflated by CHANGEOVER_PURGE_BUFFER_MIN
      minutes on each side and treated as CLOSED, must not intersect the identically
      inflated window of any other ChangeoverEvent with status in {OPEN, CLOSED} on
      the same (plant_id, line_index). Because the intervals are closed, two windows
      that merely touch at an endpoint DO conflict.
    error_id: ERR_CHANGEOVER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /changeover-events"
  - priority: 62
    category: business_temporal
    rule: |
      A new ProductionRun's [scheduled_start, scheduled_end) interval must not
      overlap the interval of any other ProductionRun on the same
      (plant_id, line_index) whose run_status is in {SCHEDULED, HELD, MELTING,
      CURING}. The interval is HALF-OPEN, so back-to-back runs that share an
      endpoint are ALLOWED. The check is pairwise, not aggregate.
    error_id: ERR_LINE_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: "POST /production-runs"
  - priority: 63
    category: business_referential
    rule: "line_index must be an integer in [1, plant.production_line_count]"
    error_id: ERR_LINE_INDEX_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /production-runs, POST /changeover-events"
  - priority: 64
    category: business_temporal
    rule: |
      Starting lab work on a ThermalTest is an AGGREGATE capacity check: the number
      of ThermalTests with status == IN_LAB, the same certification_program_id, and a
      CLOSED window [window_start, window_end] intersecting this test's closed window
      must be strictly less than certification_program.max_concurrent_lab_tests.
      Adjacency counts as an intersection. Each individual test is legal; only the
      collective breaches the cap.
    error_id: ERR_LAB_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /thermal-tests/{testId}/start-lab, POST /thermal-tests/{testId}/request-retest"

  # --- 10. domain constraints --------------------------------------------------
  - priority: 66
    category: business_referential
    rule: "len(zone_setpoints_f) must equal plant.oven_zone_count and every setpoint must be > 0"
    error_id: ERR_OVEN_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /production-runs"
  - priority: 70
    category: business_constraint
    rule: "abs(incoming_product_line.width_in - outgoing_product_line.width_in) must be <= plant.max_width_change_in"
    error_id: ERR_WIDTH_CHANGE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /changeover-events"
  - priority: 72
    category: business_constraint
    rule: "At changeover close, recovered_cullet_kg must be <= weighed_trim_kg and both must be >= 0"
    error_id: ERR_TRIM_MASS_INCONSISTENT
    http_status: 422
    applies_to: "POST /changeover-events/{changeoverId}/close"
  - priority: 74
    category: business_constraint
    rule: "len(specimen_r_values) must be >= certification_program.min_specimen_count and every specimen value must be > 0"
    error_id: ERR_SPECIMEN_COUNT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /thermal-tests/{testId}/record-result"
  - priority: 76
    category: business_constraint
    rule: "A retest may only be requested when the test still has one open: conformance_verdict must be NONCONFORMING AND attempt_number must be < certification_program.retest_limit. A CONFORMING result, or an attempt_number already equal to retest_limit, leaves no retest due"
    error_id: ERR_RETEST_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /thermal-tests/{testId}/request-retest"
  - priority: 78
    category: business_constraint
    rule: "A DERATE decision requires certification_program.derate_allowed == true, at least one COMPLETED or EXHAUSTED ThermalTest on the product line, and a computed effective_declared_r_value strictly between 0 and declared_r_value"
    error_id: ERR_DERATE_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /product-lines/{productLineId}/certification-decision"
  - priority: 80
    category: business_constraint
    rule: "allocated_sqft on a manual AllocationLine, and every sqft figure the waterfall emits, must be an exact positive integer multiple of product_line.bag_sqft. At POST /inventory-lots/{lotId}/repack the same rule governs the split: every element of child_bags must be a positive integer and the elements must sum to EXACTLY lot.bags, so the children's coverage reproduces the parent's produced_sqft to the square foot"
    error_id: ERR_BAG_MULTIPLE_MISMATCH
    http_status: 422
    applies_to: "POST /allocation-lines, POST /inventory-lots/{lotId}/repack"
  - priority: 81
    category: business_constraint
    rule: "A lot may only be repacked while it carries no allocation: allocated_sqft must be exactly 0.00 and no AllocationLine on the lot may be in status PROPOSED or ALLOCATED"
    error_id: ERR_LOT_HAS_ALLOCATIONS
    http_status: 409
    applies_to: "POST /inventory-lots/{lotId}/repack"
  - priority: 82
    category: business_constraint
    rule: "product_line.certification_status must be in {CERTIFIED, DERATED} before an AllocationCycle may be proposed or a ChannelOrder placed against that line"
    error_id: ERR_PRODUCT_LINE_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /channel-orders, POST /allocation-cycles/{cycleId}/propose"
  - priority: 84
    category: business_constraint
    rule: "revision_count must be < MAX_BINDER_REVISIONS (2) before a further revise is accepted"
    error_id: ERR_BINDER_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /binder-formulations/{binderId}/revise"
  - priority: 86
    category: business_constraint
    rule: "Every cullet_batch_id named at start-melt must reference a CulletBatch with status == STAGED belonging to the run's plant"
    error_id: ERR_CULLET_BATCH_NOT_STAGED
    http_status: 409
    applies_to: "POST /production-runs/{runId}/start-melt"
  - priority: 88
    category: business_constraint
    rule: "A CHARGED CulletBatch may only be reversed while its charged run's run_status == MELTING"
    error_id: ERR_CULLET_REVERSAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /cullet-batches/{batchId}/reverse"
  - priority: 90
    category: business_constraint
    rule: "An emissions report period must be closed and already past: period_end <= the current logical clock. The ordering leg period_end > period_start is a plain interval check that priority 20 has already reported as ERR_INVALID_REQUEST, so this rule owns only the future-period case"
    error_id: ERR_EMISSIONS_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /plants/{plantId}/emissions-report"
  - priority: 95
    category: business_constraint
    rule: "The cure_index computed by calculations.binder_cure_index must be >= MIN_CURE_INDEX"
    error_id: ERR_CURE_INDEX_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /production-runs/{runId}/start-cure"
  - priority: 96
    category: business_constraint
    rule: "bags_produced * product_line.bag_sqft must be > 0 and the run must have a non-zero binder_applied_kg recorded before it can be packaged"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /production-runs/{runId}/package"

  # --- 11. allocation feasibility ---------------------------------------------
  - priority: 97
    category: business_fiscal
    rule: "allocatable_sqft (total available supply less the seasonal reserve) must be > 0.00"
    error_id: ERR_NO_ALLOCATABLE_SUPPLY
    http_status: 422
    applies_to: "POST /allocation-cycles/{cycleId}/propose"
  - priority: 98
    category: business_fiscal
    rule: "At least one eligible ChannelOrder must exist for the cycle's product line; an empty demand set is rejected rather than producing an empty proposal"
    error_id: ERR_NO_ELIGIBLE_ORDERS
    http_status: 422
    applies_to: "POST /allocation-cycles/{cycleId}/propose"
  - priority: 99
    category: business_fiscal
    rule: "A manual AllocationLine's allocated_sqft must be <= inventory_lot.available_sqft and must not push channel_order.allocated_sqft above channel_order.requested_sqft"
    error_id: ERR_ALLOCATION_EXCEEDS_LOT_AVAILABLE
    http_status: 422
    applies_to: "POST /allocation-lines"

# =============================================================================
# §1.5 API Endpoint Table
# Flat topology, no api_prefix. Every FK-bearing entity exposes BOTH a
# single-resource GET and a filtered-list GET whose `input:` carries all of that
# entity's FK fields, which is the reverse-reachability channel for cascade-created
# rows (InventoryLot, AllocationLine and the STAGED CulletBatch rows are never
# returned by a creation response).
# =============================================================================

endpoints:
  # --- test-driving surface ----------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an explicit UTC instant. The clock's startup default is exactly 2026-08-01T00:00:00Z; until this endpoint is called the clock reads that default and MUST NOT fall back to real wall-clock time. Every window, period and required_by comparison in this domain reads the logical clock."
    roles: [CorporateOps]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set to current_utc; no business rows are modified"]

  - method: GET
    path: "/_health"
    description: "Liveness probe. The only endpoint that does not require the X-User-ID / X-User-Role headers."
    roles: [CorporateOps, PlantOperator, QualityEngineer, CertificationOfficer, EnvironmentalCompliance, ChannelManager, ChannelBuyer]
    code: 200
    input: []
    output: "{ status: string, current_utc: string }"
    side_effects: []

  # --- CertificationProgram ----------------------------------------------------
  - method: POST
    path: "/certification-programs"
    description: "Registers an immutable thermal-certification program (conformance basis, R-value tolerance, specimen minimum, lab concurrency cap, retest limit, derate policy)."
    roles: [CorporateOps]
    code: 201
    input: [code, conformance_basis, r_value_tolerance, min_specimen_count, max_concurrent_lab_tests, retest_limit, derate_allowed]
    output: CertificationProgram
    side_effects: ["creates an immutable CertificationProgram row (common_fields: false — no version, no update endpoint)"]

  - method: GET
    path: "/certification-programs/{programId}"
    description: "Reads one certification program."
    roles: [CorporateOps, QualityEngineer, CertificationOfficer, ChannelManager]
    code: 200
    input: []
    output: CertificationProgram
    side_effects: []

  - method: GET
    path: "/certification-programs"
    description: "Lists certification programs, optionally filtered by conformance basis."
    roles: [CorporateOps, QualityEngineer, CertificationOfficer, ChannelManager]
    code: 200
    input: ["conformance_basis?", "limit?", "offset?"]
    output: CertificationProgram[]
    side_effects: []

  # --- Plant -------------------------------------------------------------------
  - method: POST
    path: "/plants"
    description: "Registers an insulation plant with its oven geometry, line count, cullet policy fractions, width-change limit and air-permit allowances."
    roles: [CorporateOps]
    code: 201
    input: [name, site_code, oven_zone_count, oven_length_ft, production_line_count, permit_number, formaldehyde_allowance_kg, voc_allowance_kg, "max_cullet_fraction?", "cullet_restrict_fraction?", "max_width_change_in?"]
    output: Plant
    side_effects: ["creates the Plant with melt_posture OPEN, emissions_status COMPLIANT, version 1, and all cullet ledger counters at 0"]

  - method: GET
    path: "/plants/{plantId}"
    description: "Reads one plant, including the live cullet ledger (cullet_on_hand_kg, cullet_fraction_ytd), melt_posture, posture_reason, emissions_status and version."
    roles: [CorporateOps, PlantOperator, QualityEngineer, EnvironmentalCompliance, ChannelManager]
    code: 200
    input: []
    output: Plant
    side_effects: []

  - method: GET
    path: "/plants"
    description: "Lists plants, optionally filtered by melt posture or emissions status."
    roles: [CorporateOps, EnvironmentalCompliance, ChannelManager]
    code: 200
    input: ["melt_posture?", "emissions_status?", "limit?", "offset?"]
    output: Plant[]
    side_effects: []

  - method: POST
    path: "/plants/{plantId}/emissions-report"
    description: "Files a permit-period emissions report. Rolls up formaldehyde and VOC mass over the runs whose scheduled_start falls in the closed period, compares against the plant's allowances, and cascades an exceedance through binder suspension, product-line suspension and run holds."
    roles: [EnvironmentalCompliance]
    code: 200
    input: [period_start, period_end]
    output: Plant
    side_effects:
      - "reported_formaldehyde_kg / reported_voc_kg / reported_period_start / reported_period_end set from calculations.permit_period_emissions"
      - "emissions_status := REPORTED, or EXCEEDANCE when either allowance is exceeded"
      - "on EXCEEDANCE: melt_posture := FROZEN with posture_reason EMISSIONS_EXCEEDANCE; every CERTIFIED BinderFormulation with formaldehyde_free == false used by a ProductLine of this plant transitions to SUSPENDED; every ProductLine on those formulations transitions to SUSPENDED; every SCHEDULED ProductionRun of this plant transitions to HELD with hold_reason PLANT_FROZEN; every OPEN or PROPOSED AllocationCycle on those product lines is CANCELLED"
      - "increments Plant.version by 1"

  - method: POST
    path: "/plants/{plantId}/posture-review"
    description: "Environmental-compliance review of a RESTRICTED or FROZEN melt posture. Clearing a FROZEN plant does NOT release its held runs; each HELD run must be released individually."
    roles: [EnvironmentalCompliance]
    code: 200
    input: [decision, "override_reason?"]
    output: Plant
    side_effects:
      - "decision is one of RECOMPUTE or OVERRIDE_TO_OPEN"
      - "decision RECOMPUTE: melt_posture RESTRICTED -> OPEN and posture_reason := null, permitted only while cullet_fraction_ytd < cullet_restrict_fraction; override_reason MUST be omitted"
      - "decision OVERRIDE_TO_OPEN: melt_posture FROZEN -> OPEN with posture_reason := MANUAL_OVERRIDE and override_reason stored (a non-empty override_reason is REQUIRED); emissions_status is NOT changed and HELD runs are NOT auto-released - each still needs POST /production-runs/{runId}/release-hold"
      - "increments Plant.version by 1"

  # --- BinderFormulation -------------------------------------------------------
  - method: POST
    path: "/binder-formulations"
    description: "Drafts a binder formulation. A formaldehyde-free claim must be backed by formaldehyde_ppm == 0."
    roles: [QualityEngineer]
    code: 201
    input: [code, formaldehyde_free, formaldehyde_ppm, voc_g_per_kg, min_cure_temp_f, min_dwell_s, loi_target_pct]
    output: BinderFormulation
    side_effects: ["creates the formulation in status DRAFT with revision_count 0"]

  - method: GET
    path: "/binder-formulations/{binderId}"
    description: "Reads one binder formulation, including its certification status and revision history counters."
    roles: [CorporateOps, QualityEngineer, CertificationOfficer, EnvironmentalCompliance]
    code: 200
    input: []
    output: BinderFormulation
    side_effects: []

  - method: GET
    path: "/binder-formulations"
    description: "Lists binder formulations, optionally filtered by status or formaldehyde-free flag."
    roles: [CorporateOps, QualityEngineer, CertificationOfficer, EnvironmentalCompliance]
    code: 200
    input: ["status?", "formaldehyde_free?", "limit?", "offset?"]
    output: BinderFormulation[]
    side_effects: []

  - method: POST
    path: "/binder-formulations/{binderId}/submit"
    description: "Submits a DRAFT formulation for emissions certification."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: BinderFormulation
    side_effects: ["status DRAFT -> SUBMITTED"]

  - method: POST
    path: "/binder-formulations/{binderId}/emissions-test"
    description: "Records the certification lab's measured emissions and moves the formulation into EMISSIONS_TESTING. Measurements above the certification limits are rejected outright."
    roles: [CertificationOfficer]
    code: 200
    input: [formaldehyde_ppm, voc_g_per_kg, lab_reference]
    output: BinderFormulation
    side_effects:
      - "formaldehyde_ppm / voc_g_per_kg overwritten with the measured values; lab_reference stored"
      - "status SUBMITTED -> EMISSIONS_TESTING"

  - method: POST
    path: "/binder-formulations/{binderId}/certification-decision"
    description: "Certification officer's verdict on a formulation under test: CERTIFY, REQUEST_REVISION, SUSPEND or WITHDRAW."
    roles: [CertificationOfficer]
    code: 200
    input: [decision, "emissions_cert_id?", "revision_notes?"]
    output: BinderFormulation
    side_effects:
      - "CERTIFY: status EMISSIONS_TESTING -> CERTIFIED, emissions_cert_id and certified_at set"
      - "REQUEST_REVISION: status EMISSIONS_TESTING -> REVISION_REQUIRED, revision_notes stored"
      - "SUSPEND: status CERTIFIED -> SUSPENDED and every ProductLine on this formulation transitions CERTIFIED|DERATED|PENDING_CERTIFICATION -> SUSPENDED"
      - "WITHDRAW: status -> WITHDRAWN (terminal) from CERTIFIED, SUSPENDED or REVISION_REQUIRED"

  - method: POST
    path: "/binder-formulations/{binderId}/revise"
    description: "Reworks a REVISION_REQUIRED or SUSPENDED formulation back to DRAFT with new chemistry, closing the certification cycle. Capped at MAX_BINDER_REVISIONS revisions."
    roles: [QualityEngineer]
    code: 200
    input: [decision, "formaldehyde_free?", "formaldehyde_ppm?", "voc_g_per_kg?", "min_cure_temp_f?", "min_dwell_s?", "loi_target_pct?"]
    output: BinderFormulation
    side_effects:
      - "decision is one of REVISE or WITHDRAW; the six chemistry fields are REQUIRED when decision == REVISE and MUST be omitted when decision == WITHDRAW"
      - "decision == WITHDRAW: status REVISION_REQUIRED -> WITHDRAWN (terminal), firing the ProductLine suspension cascade"
      - "status REVISION_REQUIRED|SUSPENDED -> DRAFT; revision_count += 1"
      - "emissions_cert_id, lab_reference, certified_at and revision_notes cleared"

  # --- ProductLine -------------------------------------------------------------
  - method: POST
    path: "/product-lines"
    description: "Creates a SKU: form, density, facing, width, thickness, declared R-value, bag coverage, bale geometry and compression ratio, bound to a plant, a binder formulation and a certification program. Packaging economics are computed on creation."
    roles: [CorporateOps]
    code: 201
    input: [sku, plant_id, binder_formulation_id, certification_program_id, form, density_pcf, facing_type, width_in, thickness_in, declared_r_value, bag_sqft, bale_volume_ft3, bale_mass_kg, mass_rate_kg_per_min, "compression_ratio?"]
    output: ProductLine
    side_effects:
      - "creates the ProductLine in certification_status DRAFT with nonconformance_count 0 and effective_declared_r_value null"
      - "recovered_thickness_pct, compressed_bale_volume_ft3, bales_per_truck, freight_cost_per_sqft, recovery_penalty_per_sqft and net_landed_cost_per_sqft set from calculations.packaging_compression_economics"

  - method: GET
    path: "/product-lines/{productLineId}"
    description: "Reads one SKU, including certification status, effective declared R-value and the derived packaging economics."
    roles: [CorporateOps, PlantOperator, QualityEngineer, CertificationOfficer, ChannelManager, ChannelBuyer]
    code: 200
    input: []
    output: ProductLine
    side_effects: []

  - method: GET
    path: "/product-lines"
    description: "Lists SKUs. Filterable by plant, binder formulation, certification program, form, facing type and certification status."
    roles: [CorporateOps, PlantOperator, QualityEngineer, CertificationOfficer, ChannelManager, ChannelBuyer]
    code: 200
    input: ["plant_id?", "binder_formulation_id?", "certification_program_id?", "form?", "facing_type?", "certification_status?", "limit?", "offset?"]
    output: ProductLine[]
    side_effects: []

  - method: PATCH
    path: "/product-lines/{productLineId}/packaging"
    description: "Re-tunes the compression ratio and bale geometry, recomputing the freight-versus-recovery trade-off. Permitted while the SKU is DRAFT, PENDING_CERTIFICATION, CERTIFIED or DERATED."
    roles: [CorporateOps]
    code: 200
    input: ["compression_ratio?", "bale_volume_ft3?", "bale_mass_kg?", "bag_sqft?"]
    output: ProductLine
    side_effects:
      - "the supplied packaging fields are replaced"
      - "recovered_thickness_pct, compressed_bale_volume_ft3, bales_per_truck, freight_cost_per_sqft, recovery_penalty_per_sqft and net_landed_cost_per_sqft recomputed from calculations.packaging_compression_economics"

  - method: POST
    path: "/product-lines/{productLineId}/submit-certification"
    description: "Submits a DRAFT SKU (or a SUSPENDED one being brought back) into the certification program's queue. Requires the SKU's binder formulation to be CERTIFIED."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: ProductLine
    side_effects: ["certification_status DRAFT|SUSPENDED -> PENDING_CERTIFICATION"]

  - method: POST
    path: "/product-lines/{productLineId}/certification-decision"
    description: "Certification officer's verdict on a SKU: CERTIFY, DERATE (publish a lower declared R-value snapped down to the nearest half point), REJECT back to DRAFT, SUSPEND, REINSTATE or WITHDRAW. Segregation of duties bars the engineer who recorded any of the SKU's thermal specimens from ruling on it."
    roles: [CertificationOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: ProductLine
    side_effects:
      - "CERTIFY: certification_status PENDING_CERTIFICATION -> CERTIFIED, effective_declared_r_value := declared_r_value, certified_by_user_id := X-User-ID"
      - "DERATE: certification_status PENDING_CERTIFICATION -> DERATED with effective_declared_r_value from calculations.declared_value_derate, certified_by_user_id := X-User-ID"
      - "REJECT: certification_status PENDING_CERTIFICATION -> DRAFT, effective_declared_r_value := null"
      - "SUSPEND: certification_status CERTIFIED|DERATED -> SUSPENDED; every OPEN or PROPOSED AllocationCycle on this SKU is CANCELLED and its PROPOSED lines REVOKED"
      - "REINSTATE: certification_status SUSPENDED -> PENDING_CERTIFICATION"
      - "WITHDRAW: certification_status -> WITHDRAWN (terminal)"

  # --- ProductionRun -----------------------------------------------------------
  - method: POST
    path: "/production-runs"
    description: "Schedules a run on one forming line. The oven setpoint array must match the plant's zone count, the line index must exist, the binder must be certified, the plant must not be frozen, and the half-open [scheduled_start, scheduled_end) window must not overlap another live run on the same line."
    roles: [PlantOperator]
    code: 201
    input: [plant_id, product_line_id, line_index, scheduled_start, scheduled_end, target_pull_kg, zone_setpoints_f]
    output: ProductionRun
    side_effects:
      - "creates the run in run_status SCHEDULED with qc_status UNSAMPLED and every mass/emissions counter at 0"

  - method: GET
    path: "/production-runs/{runId}"
    description: "Reads one run, including its charge ledger (total_charge_kg, allowed_cullet_kg, cullet_charged_kg, virgin_batch_kg, cullet_fraction), cure_index, emissions masses and both status dimensions."
    roles: [CorporateOps, PlantOperator, QualityEngineer, EnvironmentalCompliance]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: GET
    path: "/production-runs"
    description: "Lists runs. Filterable by plant, SKU, line index, run status and QC status."
    roles: [CorporateOps, PlantOperator, QualityEngineer, EnvironmentalCompliance]
    code: 200
    input: ["plant_id?", "product_line_id?", "line_index?", "run_status?", "qc_status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []

  - method: POST
    path: "/production-runs/{runId}/start-melt"
    description: "Charges the furnace. Derives the total charge from the pull target and melt yield, caps cullet as a fraction of that total, consumes the named STAGED cullet batches whole in creation order, and books the residual as virgin batch."
    roles: [PlantOperator]
    code: 200
    input: [cullet_batch_ids]
    output: ProductionRun
    side_effects:
      - "run_status SCHEDULED -> MELTING"
      - "total_charge_kg, allowed_cullet_kg, cullet_charged_kg, virgin_batch_kg and cullet_fraction set from calculations.cullet_charge_allocation"
      - "each accepted CulletBatch transitions STAGED -> CHARGED with charged_run_id set; a batch that does not fit whole stays STAGED"
      - "plant.cullet_charged_kg_ytd, plant.total_charge_kg_ytd, plant.cullet_fraction_ytd and plant.cullet_on_hand_kg updated; melt_posture OPEN -> RESTRICTED when cullet_fraction_ytd >= cullet_restrict_fraction"

  - method: POST
    path: "/production-runs/{runId}/start-cure"
    description: "Records oven-average temperature, line speed and binder mass, computes dwell time and the cure index against the binder's cure window, and books the run's formaldehyde and VOC mass. A cure index below the minimum is rejected."
    roles: [PlantOperator]
    code: 200
    input: [avg_zone_temp_f, line_speed_fpm, binder_applied_kg]
    output: ProductionRun
    side_effects:
      - "run_status MELTING -> CURING"
      - "dwell_s and cure_index set from calculations.binder_cure_index"
      - "formaldehyde_kg and voc_kg set from calculations.permit_period_emissions"

  - method: POST
    path: "/production-runs/{runId}/package"
    description: "Packages the run's output into bales and cascade-creates the finished-goods InventoryLot. The lot is discoverable only through GET /inventory-lots."
    roles: [PlantOperator]
    code: 200
    input: [bags_produced]
    output: ProductionRun
    side_effects:
      - "run_status CURING -> PACKAGED; bags_produced stored; produced_sqft := bags_produced * product_line.bag_sqft"
      - "creates one InventoryLot with status AVAILABLE, bags = bags_produced, produced_sqft = the run's produced_sqft, allocated_sqft 0.00 and available_sqft = produced_sqft"

  - method: POST
    path: "/production-runs/{runId}/close"
    description: "Closes a packaged run once its thermal verdict is in. Requires qc_status == CONFORMING."
    roles: [PlantOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["run_status PACKAGED -> CLOSED; closed_at := logical clock"]

  - method: POST
    path: "/production-runs/{runId}/abort"
    description: "Aborts a run from SCHEDULED, HELD, MELTING or CURING, returning any charged cullet to the staging yard."
    roles: [PlantOperator]
    code: 200
    input: [abort_reason]
    output: ProductionRun
    side_effects:
      - "run_status -> ABORTED (terminal)"
      - "every CulletBatch with charged_run_id == this run transitions CHARGED -> STAGED; plant.cullet_charged_kg_ytd and plant.cullet_on_hand_kg are restored so the glass-mass invariant still balances"
      - "run.cullet_charged_kg := 0.00, virgin_batch_kg := 0.00, total_charge_kg := 0.00, cullet_fraction := 0.0000"

  - method: POST
    path: "/production-runs/{runId}/release-hold"
    description: "Returns a HELD run to SCHEDULED once the condition that held it has cleared (plant no longer FROZEN, or the SKU no longer SUSPENDED)."
    roles: [PlantOperator]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["run_status HELD -> SCHEDULED; hold_reason := null"]

  # --- ChangeoverEvent ---------------------------------------------------------
  - method: POST
    path: "/changeover-events"
    description: "Opens a product-line changeover between two runs on the same forming line, computing the purge minutes and the provisional transition scrap from the density step, width change and facing change."
    roles: [PlantOperator]
    code: 201
    input: [plant_id, outgoing_run_id, incoming_run_id, line_index, window_start, window_end]
    output: ChangeoverEvent
    side_effects:
      - "creates the event in status OPEN with the density/width/facing deltas snapshotted from the two SKUs"
      - "density_delta_pct, purge_minutes and provisional_scrap_kg set from the PROVISIONAL variant of calculations.changeover_scrap_accounting"
      - "outgoing_run.changeover_scrap_kg := provisional_scrap_kg"

  - method: GET
    path: "/changeover-events/{changeoverId}"
    description: "Reads one changeover, including both the provisional and (once closed) the reconciled scrap figures and their variance."
    roles: [CorporateOps, PlantOperator, QualityEngineer]
    code: 200
    input: []
    output: ChangeoverEvent
    side_effects: []

  - method: GET
    path: "/changeover-events"
    description: "Lists changeovers. Filterable by plant, outgoing run, incoming run, line index and status."
    roles: [CorporateOps, PlantOperator, QualityEngineer]
    code: 200
    input: ["plant_id?", "outgoing_run_id?", "incoming_run_id?", "line_index?", "status?", "limit?", "offset?"]
    output: ChangeoverEvent[]
    side_effects: []

  - method: POST
    path: "/changeover-events/{changeoverId}/close"
    description: "Closes a changeover against the weighed trim mass, reconciling the provisional scrap estimate and staging the recovered glass as cullet."
    roles: [PlantOperator]
    code: 200
    input: [weighed_trim_kg, recovered_cullet_kg]
    output: ChangeoverEvent
    side_effects:
      - "status OPEN -> CLOSED; weighed_trim_kg and recovered_cullet_kg stored"
      - "reconciled_scrap_kg and scrap_variance_kg set from the RECONCILED variant of calculations.changeover_scrap_accounting; outgoing_run.changeover_scrap_kg overwritten with reconciled_scrap_kg"
      - "when recovered_cullet_kg > 0 a CulletBatch is created with status STAGED and source_type CHANGEOVER_SCRAP; plant.cullet_received_kg_ytd and plant.cullet_on_hand_kg increase by that mass"

  # --- ThermalTest -------------------------------------------------------------
  - method: POST
    path: "/thermal-tests"
    description: "Requests a thermal-performance test on a run's output against the SKU's declared R-value. The conformance basis and the declared value are pinned onto the test row at this instant so later SKU changes cannot rewrite history."
    roles: [QualityEngineer]
    code: 201
    input: [production_run_id, product_line_id, certification_program_id, window_start, window_end]
    output: ThermalTest
    side_effects:
      - "creates the test in status REQUESTED with attempt_number 1, specimen_r_values [], conformance_verdict null"
      - "conformance_basis := certification_program.conformance_basis and declared_r_value_at_test := product_line.declared_r_value, both snapshotted"
      - "production_run.qc_status UNSAMPLED -> SAMPLED"

  - method: GET
    path: "/thermal-tests/{testId}"
    description: "Reads one thermal test, including its specimen array, mean and minimum R-values, pinned basis and conformance verdict."
    roles: [CorporateOps, QualityEngineer, CertificationOfficer]
    code: 200
    input: []
    output: ThermalTest
    side_effects: []

  - method: GET
    path: "/thermal-tests"
    description: "Lists thermal tests. Filterable by run, SKU, certification program, status and verdict."
    roles: [CorporateOps, QualityEngineer, CertificationOfficer]
    code: 200
    input: ["production_run_id?", "product_line_id?", "certification_program_id?", "status?", "conformance_verdict?", "limit?", "offset?"]
    output: ThermalTest[]
    side_effects: []

  - method: POST
    path: "/thermal-tests/{testId}/start-lab"
    description: "Moves a requested test into the certification lab. The lab is a shared resource: the number of IN_LAB tests on the same program whose closed windows intersect this one must stay below the program's concurrency cap."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: ThermalTest
    side_effects: ["status REQUESTED -> IN_LAB"]

  - method: POST
    path: "/thermal-tests/{testId}/record-result"
    description: "Records the specimen R-values and derives the conformance verdict using the basis pinned on the test row. A nonconforming verdict quarantines the run's lots and revokes their allocations; a nonconforming verdict on the final permitted attempt also counts against the SKU."
    roles: [QualityEngineer]
    code: 200
    input: [specimen_r_values]
    output: ThermalTest
    side_effects:
      - "specimen_count, mean_r_value, min_r_value and conformance_verdict set from calculations.thermal_conformance_verdict; recorded_by_user_id := X-User-ID"
      - "status IN_LAB -> COMPLETED, or IN_LAB -> EXHAUSTED when the verdict is NONCONFORMING on attempt_number == certification_program.retest_limit"
      - "production_run.qc_status -> CONFORMING or -> NONCONFORMING"
      - "on NONCONFORMING: every InventoryLot of that run transitions to QUARANTINED with quarantine_reason RUN_NONCONFORMING and available_sqft 0.00; every PROPOSED or ALLOCATED AllocationLine on those lots transitions to REVOKED with revoke_reason LOT_QUARANTINED; every affected ChannelOrder's allocated_sqft, fill_rate_pct and status are recomputed; every affected AllocationCycle's allocated_sqft and unallocated_sqft are recomputed"
      - "on the EXHAUSTED leg: product_line.nonconformance_count += 1, and the SKU transitions to SUSPENDED once that count reaches NONCONFORMANCE_SUSPEND_THRESHOLD"

  - method: POST
    path: "/thermal-tests/{testId}/request-retest"
    description: "Requests a further lab attempt on a completed nonconforming test, clearing the previous specimen data on the same row and re-checking lab capacity for the new window."
    roles: [QualityEngineer]
    code: 200
    input: [window_start, window_end]
    output: ThermalTest
    side_effects:
      - "attempt_number += 1; status COMPLETED -> IN_LAB; window_start / window_end replaced"
      - "specimen_r_values := [], specimen_count := 0, mean_r_value := null, min_r_value := null, conformance_verdict := null, recorded_by_user_id := null"
      - "production_run.qc_status NONCONFORMING -> RETEST_PENDING"

  # --- InventoryLot ------------------------------------------------------------
  - method: GET
    path: "/inventory-lots/{lotId}"
    description: "Reads one finished-goods lot, including its allocation ledger and quarantine reason."
    roles: [CorporateOps, PlantOperator, QualityEngineer, ChannelManager]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []

  - method: GET
    path: "/inventory-lots"
    description: "Lists finished-goods lots. This is the only discovery channel for lots, which are cascade-created by run packaging and by repacking. Filterable by plant, SKU, run, parent lot, form and status."
    roles: [CorporateOps, PlantOperator, QualityEngineer, ChannelManager]
    code: 200
    input: ["plant_id?", "product_line_id?", "production_run_id?", "parent_lot_id?", "form?", "status?", "limit?", "offset?"]
    output: InventoryLot[]
    side_effects: []

  - method: POST
    path: "/inventory-lots/{lotId}/repack"
    description: "Splits an unallocated lot into child lots. Every child bag count must be positive and the children's coverage must sum exactly to the parent's."
    roles: [PlantOperator]
    code: 200
    input: [child_bags]
    output: InventoryLot
    side_effects:
      - "status AVAILABLE -> REPACKED with available_sqft 0.00"
      - "one child InventoryLot per element of child_bags is created with parent_lot_id set to this lot, status AVAILABLE, and produced_sqft = element * product_line.bag_sqft; children are discoverable via GET /inventory-lots?parent_lot_id="

  - method: POST
    path: "/inventory-lots/{lotId}/quarantine"
    description: "Places a lot on quality hold, or scraps an already-held lot back into the melt as cullet. The SCRAP disposition accepts an optional pound-denominated scale reading which overrides the bale bill of materials."
    roles: [QualityEngineer]
    code: 200
    input: [disposition, "weighed_scrap_lb?", "quarantine_note?"]
    output: InventoryLot
    side_effects:
      - "HOLD: status AVAILABLE|ALLOCATED -> QUARANTINED with quarantine_reason MANUAL_HOLD and available_sqft 0.00; every PROPOSED or ALLOCATED AllocationLine on this lot transitions to REVOKED with revoke_reason LOT_QUARANTINED and the affected orders and cycles are recomputed"
      - "SCRAP: status QUARANTINED -> SCRAPPED; a CulletBatch is created with status STAGED and source_type QUARANTINE_SCRAP whose mass_kg comes from calculations.scrap_cullet_recovery; plant.cullet_received_kg_ytd and plant.cullet_on_hand_kg increase by that mass"

  - method: POST
    path: "/inventory-lots/{lotId}/release"
    description: "Releases a quarantined lot back to available stock. Permitted only once the originating run's QC verdict is CONFORMING."
    roles: [QualityEngineer]
    code: 200
    input: []
    output: InventoryLot
    side_effects:
      - "status QUARANTINED -> AVAILABLE; quarantine_reason := null"
      - "available_sqft recomputed from calculations.lot_allocation_ledger"

  # --- CulletBatch -------------------------------------------------------------
  - method: POST
    path: "/cullet-batches"
    description: "Stages a batch of cullet in the yard — external purchased glass, or trim recovered outside the changeover flow. Guarded by optimistic concurrency on the plant, because the plant row carries the cullet ledger and the melt posture the caller reasoned about."
    roles: [PlantOperator]
    code: 201
    input: [plant_id, source_type, mass_kg, expected_plant_version, "source_run_id?"]
    output: CulletBatch
    side_effects:
      - "creates the batch in status STAGED with charged_run_id null"
      - "plant.cullet_received_kg_ytd += mass_kg; plant.cullet_on_hand_kg recomputed"
      - "increments Plant.version by 1"

  - method: GET
    path: "/cullet-batches/{batchId}"
    description: "Reads one cullet batch."
    roles: [CorporateOps, PlantOperator, EnvironmentalCompliance]
    code: 200
    input: []
    output: CulletBatch
    side_effects: []

  - method: GET
    path: "/cullet-batches"
    description: "Lists cullet batches. This is the only discovery channel for the batches cascade-created by changeover close and lot scrapping. Filterable by plant, source run, charged run, source type and status."
    roles: [CorporateOps, PlantOperator, EnvironmentalCompliance]
    code: 200
    input: ["plant_id?", "source_run_id?", "charged_run_id?", "source_type?", "status?", "limit?", "offset?"]
    output: CulletBatch[]
    side_effects: []

  - method: POST
    path: "/cullet-batches/{batchId}/reverse"
    description: "Backs a charged batch out of the furnace while the melt is still running, restoring both the plant ledger and the run's charge split exactly."
    roles: [PlantOperator]
    code: 200
    input: ["reversal_note?"]
    output: CulletBatch
    side_effects:
      - "status CHARGED -> STAGED; charged_run_id := null"
      - "plant.cullet_charged_kg_ytd -= mass_kg; plant.cullet_on_hand_kg += mass_kg; plant.cullet_fraction_ytd recomputed"
      - "run.cullet_charged_kg -= mass_kg; run.virgin_batch_kg += mass_kg; run.cullet_fraction recomputed; run.total_charge_kg unchanged"

  - method: POST
    path: "/cullet-batches/{batchId}/reject"
    description: "Rejects a staged batch as unsuitable for the melt (contamination, wrong chemistry). The mass leaves the on-hand pool without ever being charged."
    roles: [PlantOperator]
    code: 200
    input: [reject_reason]
    output: CulletBatch
    side_effects:
      - "status STAGED -> REJECTED (terminal); reject_reason stored"
      - "plant.cullet_on_hand_kg -= mass_kg; plant.cullet_rejected_kg_ytd += mass_kg"

  # --- AllocationCycle ---------------------------------------------------------
  - method: POST
    path: "/allocation-cycles"
    description: "Opens an allocation cycle for one SKU over one demand period, choosing between strict contract priority and pro-rata sharing."
    roles: [ChannelManager]
    code: 201
    input: [plant_id, product_line_id, period_start, period_end, allocation_basis]
    output: AllocationCycle
    side_effects: ["creates the cycle in status OPEN with every sqft figure and shortage_ratio null or 0.00 until a proposal is run"]

  - method: GET
    path: "/allocation-cycles/{cycleId}"
    description: "Reads one allocation cycle, including the seasonal reserve, allocatable supply, shortage ratio, allocated and unallocated coverage, and the version the OCC guard compares against."
    roles: [CorporateOps, ChannelManager, ChannelBuyer]
    code: 200
    input: []
    output: AllocationCycle
    side_effects: []

  - method: GET
    path: "/allocation-cycles"
    description: "Lists allocation cycles. Filterable by plant, SKU, basis, peak-season flag and status."
    roles: [CorporateOps, ChannelManager, ChannelBuyer]
    code: 200
    input: ["plant_id?", "product_line_id?", "allocation_basis?", "peak_season?", "status?", "limit?", "offset?"]
    output: AllocationCycle[]
    side_effects: []

  - method: POST
    path: "/allocation-cycles/{cycleId}/propose"
    description: "Runs the shortage waterfall: holds back the seasonal construction reserve, ranks eligible distributor and retail orders by contract tier then need date then creation order, and cuts whole-bag proposed allocation lines against available lots. Re-proposing discards the previous proposal and recomputes from scratch."
    roles: [ChannelManager]
    code: 200
    input: []
    output: AllocationCycle
    side_effects:
      - "status OPEN -> PROPOSED, or PROPOSED -> PROPOSED after revoking every previously PROPOSED line of this cycle with revoke_reason CYCLE_CANCELLED"
      - "peak_season, total_available_sqft, seasonal_reserve_sqft, allocatable_sqft, total_requested_sqft, shortage_ratio, allocated_sqft and unallocated_sqft set from calculations.channel_allocation_waterfall"
      - "creates one AllocationLine with status PROPOSED per (order, lot) pair the waterfall emits; these lines are discoverable via GET /allocation-lines?allocation_cycle_id="
      - "increments AllocationCycle.version by 1"

  - method: POST
    path: "/allocation-cycles/{cycleId}/commit"
    description: "Commits the proposal: every proposed line becomes allocated, lot ledgers and lot statuses are refreshed, and each served order lands on ALLOCATED, PARTIAL or BACKORDERED."
    roles: [ChannelManager]
    code: 200
    input: []
    output: AllocationCycle
    side_effects:
      - "status PROPOSED -> COMMITTED"
      - "every PROPOSED AllocationLine of this cycle transitions to ALLOCATED"
      - "each referenced InventoryLot's allocated_sqft, available_sqft and status recomputed from calculations.lot_allocation_ledger"
      - "each served ChannelOrder's allocated_sqft, fill_rate_pct and status recomputed"
      - "increments AllocationCycle.version by 1"

  - method: POST
    path: "/allocation-cycles/{cycleId}/cancel"
    description: "Cancels an open or proposed cycle, revoking every line it created and unwinding the lot and order ledgers."
    roles: [ChannelManager]
    code: 200
    input: ["cancel_reason?"]
    output: AllocationCycle
    side_effects:
      - "status OPEN|PROPOSED -> CANCELLED (terminal)"
      - "every PROPOSED or ALLOCATED AllocationLine of this cycle transitions to REVOKED with revoke_reason CYCLE_CANCELLED; lot and order ledgers recomputed"
      - "increments AllocationCycle.version by 1"

  # --- ChannelOrder ------------------------------------------------------------
  - method: POST
    path: "/channel-orders"
    description: "Places a distributor or retail order for a certified SKU at a contract, program or spot priority tier."
    roles: [ChannelBuyer, ChannelManager]
    code: 201
    input: [product_line_id, channel_type, priority_tier, requested_sqft, required_by]
    output: ChannelOrder
    side_effects: ["creates the order in status SUBMITTED with allocated_sqft 0.00, fill_rate_pct 0.00 and placed_by_user_id := X-User-ID"]

  - method: GET
    path: "/channel-orders/{orderId}"
    description: "Reads one channel order, including its allocated coverage and fill rate."
    roles: [CorporateOps, ChannelManager, ChannelBuyer]
    code: 200
    input: []
    output: ChannelOrder
    side_effects: []

  - method: GET
    path: "/channel-orders"
    description: "Lists channel orders. Filterable by SKU, channel type, priority tier and status."
    roles: [CorporateOps, ChannelManager, ChannelBuyer]
    code: 200
    input: ["product_line_id?", "channel_type?", "priority_tier?", "status?", "limit?", "offset?"]
    output: ChannelOrder[]
    side_effects: []

  - method: POST
    path: "/channel-orders/{orderId}/cancel"
    description: "Cancels the buyer's own order, releasing whatever coverage it held back to its lots."
    roles: [ChannelBuyer]
    code: 200
    input: ["cancel_reason?"]
    output: ChannelOrder
    side_effects:
      - "status SUBMITTED|PARTIAL|BACKORDERED -> CANCELLED (terminal)"
      - "every PROPOSED or ALLOCATED AllocationLine of this order transitions to REVOKED with revoke_reason ORDER_CANCELLED; lot ledgers and cycle totals recomputed"

  - method: POST
    path: "/channel-orders/{orderId}/ship"
    description: "Ships an allocated or partially allocated order, consuming the lots it fully drew down. Blocked while any referenced lot is quarantined."
    roles: [ChannelManager]
    code: 200
    input: ["shipped_at?"]
    output: ChannelOrder
    side_effects:
      - "status ALLOCATED|PARTIAL -> SHIPPED (terminal)"
      - "every InventoryLot whose entire allocated coverage belongs to this order transitions ALLOCATED -> CONSUMED"

  # --- AllocationLine ----------------------------------------------------------
  - method: POST
    path: "/allocation-lines"
    description: "Cuts a manual expedite allocation line outside the waterfall, straight into ALLOCATED. Guarded by optimistic concurrency on the cycle: the caller must prove its view of the cycle's allocated and unallocated coverage is current."
    roles: [ChannelManager]
    code: 201
    input: [allocation_cycle_id, channel_order_id, inventory_lot_id, allocated_sqft, expected_allocation_cycle_version]
    output: AllocationLine
    side_effects:
      - "creates the line in status ALLOCATED with bags = allocated_sqft / product_line.bag_sqft"
      - "inventory_lot.allocated_sqft, available_sqft and status recomputed from calculations.lot_allocation_ledger"
      - "channel_order.allocated_sqft, fill_rate_pct and status recomputed"
      - "allocation_cycle.allocated_sqft and unallocated_sqft recomputed"
      - "increments AllocationCycle.version by 1"

  - method: GET
    path: "/allocation-lines/{lineId}"
    description: "Reads one allocation line."
    roles: [CorporateOps, ChannelManager, ChannelBuyer]
    code: 200
    input: []
    output: AllocationLine
    side_effects: []

  - method: GET
    path: "/allocation-lines"
    description: "Lists allocation lines. This is the only discovery channel for the PROPOSED lines the waterfall cascade-creates. Filterable by cycle, order, lot and status."
    roles: [CorporateOps, ChannelManager, ChannelBuyer]
    code: 200
    input: ["allocation_cycle_id?", "channel_order_id?", "inventory_lot_id?", "status?", "limit?", "offset?"]
    output: AllocationLine[]
    side_effects: []

  - method: POST
    path: "/allocation-lines/{lineId}/revoke"
    description: "Revokes a proposed or allocated line, returning its coverage to the lot and reducing the order's fill. The coverage conservation invariant must still hold exactly afterwards."
    roles: [ChannelManager]
    code: 200
    input: ["revoke_note?"]
    output: AllocationLine
    side_effects:
      - "status PROPOSED|ALLOCATED -> REVOKED (terminal) with revoke_reason MANUAL_REVOKE"
      - "inventory_lot.allocated_sqft, available_sqft and status recomputed; a fully drawn-down lot returns ALLOCATED -> AVAILABLE"
      - "channel_order.allocated_sqft, fill_rate_pct and status recomputed; ALLOCATED -> PARTIAL or PARTIAL -> BACKORDERED as appropriate"
      - "allocation_cycle.allocated_sqft and unallocated_sqft recomputed"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================

errors:
  # --- auth ---------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty on any endpoint other than GET /_health"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not one of the seven declared roles, or is not listed on the target endpoint"
  - id: ERR_PLANT_NOT_OWNED
    http: 403
    condition: "A PlantOperator acts on a row belonging to a plant other than the one named by its X-User-ID"
  - id: ERR_ORDER_NOT_OWNED
    http: 403
    condition: "A ChannelBuyer cancels a ChannelOrder whose placed_by_user_id is not its X-User-ID"

  # --- not found ----------------------------------------------------------------
  - id: ERR_PLANT_NOT_FOUND
    http: 404
    condition: "plantId in the path, or plant_id in the body, does not resolve"
  - id: ERR_CERTIFICATION_PROGRAM_NOT_FOUND
    http: 404
    condition: "programId in the path, or certification_program_id in the body, does not resolve"
  - id: ERR_BINDER_FORMULATION_NOT_FOUND
    http: 404
    condition: "binderId in the path, or binder_formulation_id in the body, does not resolve"
  - id: ERR_PRODUCT_LINE_NOT_FOUND
    http: 404
    condition: "productLineId in the path, or product_line_id in the body, does not resolve"
  - id: ERR_PRODUCTION_RUN_NOT_FOUND
    http: 404
    condition: "runId in the path, or production_run_id / outgoing_run_id / incoming_run_id / source_run_id in the body, does not resolve"
  - id: ERR_CHANGEOVER_EVENT_NOT_FOUND
    http: 404
    condition: "changeoverId in the path does not resolve"
  - id: ERR_THERMAL_TEST_NOT_FOUND
    http: 404
    condition: "testId in the path does not resolve"
  - id: ERR_INVENTORY_LOT_NOT_FOUND
    http: 404
    condition: "lotId in the path, or inventory_lot_id in the body, does not resolve"
  - id: ERR_ALLOCATION_CYCLE_NOT_FOUND
    http: 404
    condition: "cycleId in the path, or allocation_cycle_id in the body, does not resolve"
  - id: ERR_CHANNEL_ORDER_NOT_FOUND
    http: 404
    condition: "orderId in the path, or channel_order_id in the body, does not resolve"
  - id: ERR_ALLOCATION_LINE_NOT_FOUND
    http: 404
    condition: "lineId in the path does not resolve"
  - id: ERR_CULLET_BATCH_NOT_FOUND
    http: 404
    condition: "batchId in the path, or any element of cullet_batch_ids, does not resolve"

  # --- request shape ------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is missing, an enum value is outside its declared set, a numeric field is outside its declared range, a timestamp is not RFC3339 UTC, an interval end is not strictly after its start, or a required array is empty"

  # --- optimistic concurrency ---------------------------------------------------
  - id: ERR_STALE_ALLOCATION_CYCLE_VERSION
    http: 412
    condition: "expected_allocation_cycle_version on POST /allocation-lines does not equal allocation_cycle.version"
  - id: ERR_STALE_PLANT_VERSION
    http: 412
    condition: "expected_plant_version on POST /cullet-batches does not equal plant.version"

  # --- state --------------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested transition has no outgoing edge from the row's current state, including a repeated trigger and any trigger against a terminal state"
  - id: ERR_MELT_POSTURE_FROZEN
    http: 409
    condition: "Scheduling a run, charging the furnace, staging cullet or committing an allocation while plant.melt_posture == FROZEN"
  - id: ERR_MELT_POSTURE_RESTRICTED
    http: 409
    condition: "Staging further cullet while plant.melt_posture == RESTRICTED, before an environmental posture-review has cleared the plant"

  # --- certification and safety -------------------------------------------------
  - id: ERR_FORMALDEHYDE_FREE_CLAIM_INVALID
    http: 422
    condition: "formaldehyde_free == true with formaldehyde_ppm > 0, or formaldehyde_free == false with formaldehyde_ppm == 0"
  - id: ERR_BINDER_NOT_CERTIFIED
    http: 409
    condition: "Scheduling a ProductionRun whose SKU's BinderFormulation is not in status CERTIFIED"
  - id: ERR_FORMALDEHYDE_LIMIT_EXCEEDED
    http: 422
    condition: "Measured formaldehyde_ppm above FORMALDEHYDE_CERT_LIMIT_PPM, or voc_g_per_kg above VOC_CERT_LIMIT_G_PER_KG, at the binder emissions test"
  - id: ERR_LOT_QUARANTINED
    http: 409
    condition: "Allocating, committing or shipping against an InventoryLot in status QUARANTINED"
  - id: ERR_RUN_NOT_CONFORMING
    http: 409
    condition: "Releasing a quarantined lot whose originating run's qc_status is not CONFORMING"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The user ruling on a SKU's certification also recorded one of that SKU's thermal specimens, or already signed a previous decision on the same SKU"

  # --- temporal / occupancy -----------------------------------------------------
  - id: ERR_CHANGEOVER_WINDOW_CONFLICT
    http: 409
    condition: "A new changeover's buffer-inflated closed purge window touches or overlaps another changeover's inflated window on the same forming line"
  - id: ERR_LINE_OCCUPANCY_CONFLICT
    http: 409
    condition: "A new run's half-open [scheduled_start, scheduled_end) window overlaps a SCHEDULED, HELD, MELTING or CURING run on the same forming line; touching endpoints do not conflict"
  - id: ERR_LINE_INDEX_OUT_OF_RANGE
    http: 422
    condition: "line_index is outside [1, plant.production_line_count]"
  - id: ERR_LAB_CAPACITY_EXCEEDED
    http: 409
    condition: "Starting or re-starting lab work would push the count of IN_LAB tests whose closed windows intersect this one, on the same certification program, to the program's max_concurrent_lab_tests"

  # --- domain constraints -------------------------------------------------------
  - id: ERR_OVEN_ZONE_MISMATCH
    http: 422
    condition: "len(zone_setpoints_f) does not equal plant.oven_zone_count, or a setpoint is not positive"
  - id: ERR_WIDTH_CHANGE_OUT_OF_RANGE
    http: 422
    condition: "The absolute width step between the outgoing and incoming SKUs exceeds plant.max_width_change_in"
  - id: ERR_TRIM_MASS_INCONSISTENT
    http: 422
    condition: "recovered_cullet_kg exceeds weighed_trim_kg at changeover close, or either value is negative"
  - id: ERR_SPECIMEN_COUNT_INSUFFICIENT
    http: 422
    condition: "Fewer specimen R-values submitted than certification_program.min_specimen_count, or a specimen value is not positive"
  - id: ERR_RETEST_LIMIT_REACHED
    http: 409
    condition: "Requesting a retest on a COMPLETED ThermalTest that has no retest due — attempt_number already equals certification_program.retest_limit, or conformance_verdict is CONFORMING"
  - id: ERR_DERATE_NOT_PERMITTED
    http: 422
    condition: "A DERATE decision on a program whose derate_allowed is false, with no completed thermal test, or producing an effective_declared_r_value outside (0, declared_r_value)"
  - id: ERR_BAG_MULTIPLE_MISMATCH
    http: 422
    condition: "An allocation quantity is not an exact positive integer multiple of product_line.bag_sqft, or a repack child_bags list does not consist of positive integers summing exactly to lot.bags"
  - id: ERR_LOT_HAS_ALLOCATIONS
    http: 409
    condition: "Repacking a lot that still carries a PROPOSED or ALLOCATED allocation line"
  - id: ERR_PRODUCT_LINE_NOT_CERTIFIED
    http: 409
    condition: "Placing a channel order or proposing an allocation cycle for a SKU whose certification_status is not CERTIFIED or DERATED"
  - id: ERR_BINDER_REVISION_LIMIT_REACHED
    http: 409
    condition: "Revising a formulation whose revision_count already equals MAX_BINDER_REVISIONS"
  - id: ERR_CULLET_BATCH_NOT_STAGED
    http: 409
    condition: "A cullet_batch_id at start-melt names a batch that is not STAGED, or belongs to another plant"
  - id: ERR_CULLET_REVERSAL_WINDOW_CLOSED
    http: 409
    condition: "Reversing a charged batch after its run has left MELTING"
  - id: ERR_EMISSIONS_PERIOD_INVALID
    http: 422
    condition: "period_end is later than the current logical clock (a period that has not closed yet); the period_end <= period_start ordering violation is reported earlier as ERR_INVALID_REQUEST by priority 20"
  - id: ERR_CURE_INDEX_BELOW_MINIMUM
    http: 422
    condition: "The computed cure_index is below MIN_CURE_INDEX for the SKU's binder cure window"

  # --- allocation feasibility ---------------------------------------------------
  - id: ERR_NO_ALLOCATABLE_SUPPLY
    http: 422
    condition: "Available supply less the seasonal reserve is not positive at propose time"
  - id: ERR_NO_ELIGIBLE_ORDERS
    http: 422
    condition: "No ChannelOrder qualifies for the cycle's SKU and period at propose time"
  - id: ERR_ALLOCATION_EXCEEDS_LOT_AVAILABLE
    http: 422
    condition: "A manual allocation line exceeds the lot's available coverage, or would push the order above its requested coverage"

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties. Production, quality measurement,
# certification sign-off, environmental filing and channel allocation are five
# separate hands; no role spans two of them.
# =============================================================================

roles:
  - name: CorporateOps
    description: "Corporate master-data and reference-data owner. Registers plants, certification programs and SKUs, tunes packaging economics, and drives the logical clock. Cannot run production, measure quality, sign certifications, file emissions or allocate supply."
    id_semantics: opaque
    exclusive_operations:
      - "POST /plants"
      - "POST /certification-programs"
      - "POST /product-lines"
      - "PATCH /product-lines/{productLineId}/packaging"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "read access to every collection"

  - name: PlantOperator
    description: "Forming-line operator, scoped to one plant. Schedules and drives runs, opens and closes changeovers, repacks lots, and stages, reverses or rejects cullet. Its X-User-ID IS the plant id it may act on."
    id_semantics: "entity_backed:Plant"
    exclusive_operations:
      - "POST /production-runs"
      - "POST /production-runs/{runId}/start-melt"
      - "POST /production-runs/{runId}/start-cure"
      - "POST /production-runs/{runId}/package"
      - "POST /production-runs/{runId}/close"
      - "POST /production-runs/{runId}/abort"
      - "POST /production-runs/{runId}/release-hold"
      - "POST /changeover-events"
      - "POST /changeover-events/{changeoverId}/close"
      - "POST /inventory-lots/{lotId}/repack"
      - "POST /cullet-batches"
      - "POST /cullet-batches/{batchId}/reverse"
      - "POST /cullet-batches/{batchId}/reject"
    shared_operations:
      - "read access to plants, product lines, runs, changeovers, lots and cullet batches"

  - name: QualityEngineer
    description: "Laboratory and quality hand. Drafts and revises binder formulations, requests and records thermal tests, and quarantines, scraps or releases lots. Barred from signing the certification decision on any SKU whose specimens it recorded."
    id_semantics: opaque
    exclusive_operations:
      - "POST /binder-formulations"
      - "POST /binder-formulations/{binderId}/submit"
      - "POST /binder-formulations/{binderId}/revise"
      - "POST /product-lines/{productLineId}/submit-certification"
      - "POST /thermal-tests"
      - "POST /thermal-tests/{testId}/start-lab"
      - "POST /thermal-tests/{testId}/record-result"
      - "POST /thermal-tests/{testId}/request-retest"
      - "POST /inventory-lots/{lotId}/quarantine"
      - "POST /inventory-lots/{lotId}/release"
    shared_operations:
      - "read access to plants, binder formulations, product lines, runs, changeovers, thermal tests and lots"

  - name: CertificationOfficer
    description: "Third-party certification program signatory. Records binder emissions test results and rules on binder and SKU certification, including the derate decision. Cannot generate the measurements it rules on."
    id_semantics: opaque
    exclusive_operations:
      - "POST /binder-formulations/{binderId}/emissions-test"
      - "POST /binder-formulations/{binderId}/certification-decision"
      - "POST /product-lines/{productLineId}/certification-decision"
    shared_operations:
      - "read access to certification programs, binder formulations, product lines and thermal tests"

  - name: EnvironmentalCompliance
    description: "Air-permit compliance officer. Files permit-period emissions reports and reviews melt postures, holding the only authority to freeze or clear a plant."
    id_semantics: opaque
    exclusive_operations:
      - "POST /plants/{plantId}/emissions-report"
      - "POST /plants/{plantId}/posture-review"
    shared_operations:
      - "read access to plants, binder formulations, runs and cullet batches"

  - name: ChannelManager
    description: "Distributor and retail channel allocator. Opens, proposes, commits and cancels allocation cycles, cuts and revokes manual expedite lines, and ships orders. May place an order on a buyer's behalf but may not cancel one."
    id_semantics: opaque
    exclusive_operations:
      - "POST /allocation-cycles"
      - "POST /allocation-cycles/{cycleId}/propose"
      - "POST /allocation-cycles/{cycleId}/commit"
      - "POST /allocation-cycles/{cycleId}/cancel"
      - "POST /allocation-lines"
      - "POST /allocation-lines/{lineId}/revoke"
      - "POST /channel-orders/{orderId}/ship"
    shared_operations:
      - "POST /channel-orders"
      - "read access to plants, product lines, lots, cycles, orders and lines"

  - name: ChannelBuyer
    description: "Distributor or retail buyer. Places its own orders and cancels only its own. Its X-User-ID is matched against channel_order.placed_by_user_id."
    id_semantics: opaque
    exclusive_operations:
      - "POST /channel-orders/{orderId}/cancel"
    shared_operations:
      - "POST /channel-orders"
      - "read access to product lines, cycles, orders and lines"
