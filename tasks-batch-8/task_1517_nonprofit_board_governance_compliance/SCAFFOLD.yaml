errors:
- id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http: 400
  condition: X-User-ID or X-User-Role header missing/empty
- id: ERR_FORBIDDEN_FOR_ROLE
  http: 403
  condition: Role not in the endpoint's roles list, or self-service ownership violated (voting/disclosing/resigning as another member)
- id: ERR_IDENTITY_NOT_QUALIFIED
  http: 403
  condition: 'Entity-backed role not qualified: X-User-ID is not an ACTIVE BoardMember of the acting nonprofit, or officer_role does not match
    the role claimed (BoardChair needs CHAIR, Treasurer needs TREASURER)'
- id: ERR_NOT_FOUND
  http: 404
  condition: Path resource id does not exist
- id: ERR_REFERENCED_NOT_FOUND
  http: 422
  condition: Body-referenced FK id does not exist or belongs to a different nonprofit
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Required field missing, wrong type, enum out of range, negative amounts, empty proposed_fields/answers/restriction_categories, end
    <= start
- id: ERR_INVALID_STATE
  http: 409
  condition: Target resource not in a from-state that allows the requested transition (incl. transitions on terminal resources and non-idempotent
    re-fires)
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_<parent>_version does not match the parent entity's current version (OCC)
- id: ERR_BYLAWS_NOT_ADOPTED
  http: 409
  condition: Operation requires the nonprofit's bylaws (or the referenced base bylaws) to be ADOPTED
- id: ERR_BYLAWS_ALREADY_ADOPTED
  http: 409
  condition: Founding adoption attempted while another bylaws is ADOPTED for the nonprofit
- id: ERR_MEETING_NOT_IN_SESSION
  http: 409
  condition: Motion open/resume/close or vote cast while the motion's meeting is not IN_SESSION
- id: ERR_MOTION_NOT_OPEN
  http: 409
  condition: Vote cast on a motion not in VOTING_OPEN
- id: ERR_COMMITTEE_NOT_ACTIVE
  http: 409
  condition: Committee-scoped meeting call_to_order while committee is CHARTERED/DORMANT/DISSOLVED
- id: ERR_AMENDMENT_NOT_PROPOSED
  http: 409
  condition: A BYLAWS-category motion references an amendment not in PROPOSED
- id: ERR_AMENDMENT_HAS_OPEN_MOTION
  http: 409
  condition: Withdraw of a PROPOSED amendment (or a second BYLAWS motion) while a non-terminal motion references it
- id: ERR_SEGREGATION_OF_DUTIES
  http: 409
  condition: 'Same-user prohibition violated: COI reviewer == filer; 990 approver == preparer_user_id; evaluation ratifier == recorded_by_user_id;
    minutes approver == minutes_recorded_by'
- id: ERR_REVIEWER_NOT_QUALIFIED
  http: 409
  condition: COI reviewer is not an ACTIVE BoardMember of the same nonprofit
- id: ERR_REVIEWER_NOT_COMPLIANT
  http: 409
  condition: COI reviewer has not filed their own disclosure for the same fiscal year (any non-terminal state suffices)
- id: ERR_REVIEWER_MISMATCH
  http: 409
  condition: COI clear/impose/lift attempted by someone other than the assigned reviewer_member_id
- id: ERR_EVALUATION_RECORDER_MISMATCH
  http: 409
  condition: Score edit attempted by a user other than the first recorder while DRAFT
- id: ERR_MEMBER_RECUSED
  http: 409
  condition: Recused member (current-FY RESTRICTIONS_IMPOSED covering the motion category) attempted a non-RECUSED vote
- id: ERR_NONCOMPLIANT_POSTURE_BLOCKS
  http: 409
  condition: FUNDRAISING motion introduced while compliance_posture == NON_COMPLIANT
- id: ERR_DUPLICATE_EIN
  http: 409
  condition: EIN already registered
- id: ERR_DUPLICATE_MEMBER_EMAIL
  http: 409
  condition: Email already used by another member of the nonprofit
- id: ERR_DUPLICATE_DISCLOSURE
  http: 409
  condition: Member already has a disclosure for this fiscal_year
- id: ERR_DUPLICATE_FILING
  http: 409
  condition: Root Form 990 already exists for (nonprofit, fiscal_year)
- id: ERR_DUPLICATE_EVALUATION
  http: 409
  condition: Evaluation already exists for (nonprofit, fiscal_year)
- id: ERR_DUPLICATE_REGISTRATION
  http: 409
  condition: Registration already exists for (nonprofit, state_code)
- id: ERR_DUPLICATE_COMMITTEE_NAME
  http: 409
  condition: Non-DISSOLVED committee with this name exists in the nonprofit
- id: ERR_DUPLICATE_COMMITTEE_CHAIR
  http: 409
  condition: Committee already has an ACTIVE CHAIR appointment
- id: ERR_DUPLICATE_APPOINTMENT
  http: 409
  condition: Member already holds an ACTIVE appointment on this committee
- id: ERR_DUPLICATE_VOTE
  http: 409
  condition: Member already voted on this motion (votes immutable)
- id: ERR_DUPLICATE_REVIEW
  http: 409
  condition: Member already recorded a review of this filing
- id: ERR_MEMBER_NOT_ELIGIBLE
  http: 409
  condition: Election/appointment target is not PROPOSED/PAST/TERM_LIMITED_OUT (election) or not ACTIVE (appointment)
- id: ERR_TERM_LIMIT_EXCEEDED
  http: 409
  condition: Consecutive-term chain == max_consecutive_terms and cool-off has not elapsed
- id: ERR_NO_SEATS_AVAILABLE
  http: 409
  condition: open_seats == 0 (ACTIVE member count == board_size)
- id: ERR_COMMITTEE_BELOW_MIN
  http: 409
  condition: Committee activation with active_member_count < min_members
- id: ERR_COMMITTEE_FULL
  http: 409
  condition: Appointment would exceed committee authorized_size
- id: ERR_COMMITTEE_NOT_INDEPENDENT
  http: 409
  condition: requires_all_independent committee includes/would include a non-independent member
- id: ERR_COI_REVIEW_REQUIRED
  http: 409
  condition: Appointee lacks a reviewed (CLEARED | RESTRICTIONS_IMPOSED) current-fiscal-year COI disclosure, OR the appointee's current-FY disclosure
    is RESTRICTIONS_IMPOSED with restriction_categories mapping to the committee's type
- id: ERR_TERM_OVERLAP
  http: 409
  condition: New term overlaps an existing non-VACATED term of the same member (half-open; adjacency allowed)
- id: ERR_MEETING_OVERLAP
  http: 409
  condition: Meeting conflicts with a non-CANCELLED meeting of the same scope under the 30-minute buffer rule
- id: ERR_MEETING_TOO_EARLY
  http: 409
  condition: call_to_order before scheduled_start
- id: ERR_NOTICE_INSUFFICIENT
  http: 409
  condition: call_to_order without notice_sent_at <= scheduled_start - 7 days and no notice_waived
- id: ERR_RENEWAL_TOO_EARLY
  http: 409
  condition: submit_renewal more than 90 days before current_period_end
- id: ERR_COVERAGE_GAP
  http: 409
  condition: Renewal policy starts after prior policy end and acknowledge_gap is not true
- id: ERR_POLICY_OVERLAP
  http: 409
  condition: Policy interval overlaps a non-terminal same-type policy (or precedes its prior policy's end)
- id: ERR_POLICY_NOT_YET_EFFECTIVE
  http: 409
  condition: activate before policy_start_date
- id: ERR_RENEWAL_FEE_MISMATCH
  http: 409
  condition: paid_fee_cents != computed registration_renewal_fee for the registration's status (incl. late fee when LAPSED)
- id: ERR_COVERAGE_BELOW_FLOOR
  http: 409
  condition: coverage_limit_cents < ceil(0.25 * annual_gross_receipts_cents) at bind
- id: ERR_QUORUM_NOT_MET
  http: 409
  condition: call_to_order attendance below quorum_required
- id: ERR_REVIEW_COVERAGE_INSUFFICIENT
  http: 409
  condition: 990 approve with count(reviewed_by_member_ids) < review_required_count
- id: ERR_EVALUATION_INCOMPLETE
  http: 409
  condition: submit_review without all five dimension scores (integer 1..5 each)
- id: ERR_DESIGNEE_REQUIRED
  http: 409
  condition: Succession approval without the required interim designee for the target role
- id: ERR_MINUTES_APPROVAL_MEETING_INVALID
  http: 409
  condition: approving/rejecting meeting missing, same meeting, different scope, or not IN_SESSION
- id: ERR_VOTER_NOT_ELIGIBLE
  http: 409
  condition: Vote cast by a member who is not on the meeting's attendance roster, or (committee meetings) does not hold an ACTIVE appointment
    on that committee, or is not an ACTIVE board member
roles:
- name: GovernanceAdmin
  description: 'Nonprofit staff governance manager: incorporates the org, drafts bylaws, schedules meetings, records minutes, maintains the skills
    matrix, files registrations support paperwork'
  identity: opaque
  exclusive_operations:
  - POST /boardgov/nonprofits — incorporate nonprofit
  - PATCH /boardgov/nonprofits/{id} — profile update (OCC)
  - POST /boardgov/_clock/set_current_utc — test-driving clock
  - POST /boardgov/bylaws — draft bylaws
  - POST /boardgov/bylaws/{id}/discard
  - POST /boardgov/board-members — nominate director
  - PATCH /boardgov/board-members/{id} — profile maintenance
  - POST /boardgov/meetings/{id}/minutes — record/replace draft minutes (OCC)
  - POST /boardgov/bylaws/{id}/adopt — founding adoption (incorporator action)
  shared_operations:
  - POST /boardgov/nonprofits/{id}/compliance_sweep (with ComplianceOfficer)
  - POST /boardgov/board-terms (with BoardChair)
  - POST /boardgov/board-members/{id}/resign (with BoardChair/director self)
  - POST /boardgov/committees, POST /boardgov/meetings, POST /boardgov/meetings/{id}/cancel (with BoardChair)
  - POST /boardgov/succession-plans (with BoardChair)
  - POST /boardgov/form990-filings, submit_for_review, mark_filed (with Treasurer)
  - POST /boardgov/form990-filings/{id}/post_public_disclosure (with ComplianceOfficer)
  - GET endpoints (with all roles)
  - POST /boardgov/bylaws-amendments (with BoardChair, BoardDirector)
- name: BoardChair
  description: 'Board chair (an ACTIVE director with officer_role=CHAIR): runs meetings, presides over votes, approves filings/minutes/evaluations/plans,
    appoints committee members'
  identity: entity_backed:BoardMember
  exclusive_operations:
  - POST /boardgov/bylaws-amendments/{id}/propose | revise | withdraw
  - POST /boardgov/board-members/{id}/remove
  - POST /boardgov/committees/{id}/activate | dissolve
  - POST /boardgov/committee-appointments — appoint director
  - POST /boardgov/committee-appointments/{id}/end
  - POST /boardgov/meetings/{id}/call_to_order | adjourn | approve_minutes | reject_minutes
  - POST /boardgov/motions/{id}/open_voting | close_voting | table | resume | withdraw
  - POST /boardgov/executive-evaluations — open evaluation
  - POST /boardgov/executive-evaluations/{id}/submit_review | return | deliver
  - POST /boardgov/succession-plans/{id}/approve | revise | activate | stand_down | discard
  - POST /boardgov/form990-filings/{id}/approve
  shared_operations:
  - POST /boardgov/bylaws-amendments, POST /boardgov/motions (with BoardDirector)
  - POST /boardgov/votes, POST /boardgov/coi-disclosures + review endpoints (with BoardDirector, Treasurer)
  - PATCH /boardgov/executive-evaluations/{id}/scores (with BoardDirector, Treasurer)
  - POST /boardgov/executive-evaluations/{id}/ratify (with Treasurer)
  - POST /boardgov/form990-filings/{id}/record_review (with BoardDirector, Treasurer)
- name: BoardDirector
  description: 'Regular director: proposes amendments and motions, votes, files own COI disclosure, reviews filings, may score evaluations'
  identity: entity_backed:BoardMember
  exclusive_operations: []
  shared_operations:
  - POST /boardgov/bylaws-amendments, POST /boardgov/motions (with BoardChair)
  - POST /boardgov/votes, POST /boardgov/coi-disclosures + review endpoints (self-service; with BoardChair, Treasurer)
  - PATCH /boardgov/executive-evaluations/{id}/scores (with BoardChair, Treasurer)
  - POST /boardgov/board-members/{id}/resign — only when X-User-ID == the member id (self-resignation)
  - GET endpoints
- name: Treasurer
  description: 'Board treasurer (ACTIVE director with officer_role=TREASURER): prepares and files Form 990, may ratify evaluations as the non-scoring
    officer'
  identity: entity_backed:BoardMember
  exclusive_operations:
  - POST /boardgov/form990-filings/{id}/discard
  shared_operations:
  - POST /boardgov/form990-filings, submit_for_review, mark_filed (with GovernanceAdmin)
  - POST /boardgov/executive-evaluations/{id}/ratify (with BoardChair)
  - PATCH /boardgov/executive-evaluations/{id}/scores (with BoardChair, BoardDirector)
  - POST /boardgov/votes, COI endpoints, record_review (with other directors)
- name: ComplianceOfficer
  description: 'Staff compliance officer: owns state charitable registrations, renewals/reinstatement, and insurance policies'
  identity: opaque
  exclusive_operations:
  - POST /boardgov/state-registrations — create registration
  - POST /boardgov/state-registrations/{id}/submit_renewal | confirm_renewal | reinstate
  - POST /boardgov/insurance-policies — quote policy
  - POST /boardgov/insurance-policies/{id}/bind | activate | cancel
  shared_operations:
  - POST /boardgov/nonprofits/{id}/compliance_sweep (with GovernanceAdmin)
  - POST /boardgov/form990-filings/{id}/post_public_disclosure (with GovernanceAdmin)
  - GET endpoints
- name: ExecutiveDirector
  description: 'The evaluated executive: read-only observer; deliberately excluded from every evaluation/governance write (segregation from own
    evaluation)'
  identity: opaque
  exclusive_operations: []
  shared_operations:
  - GET endpoints only
