          assert:
            - "${err_clinic_create} == ERR_UNAUTHORIZED with HTTP 403: clinic registration is PracticeAdmin-exclusive"
            - "${err_attestation} == ERR_UNAUTHORIZED: only ComplianceOfficer may attest a supplier, and PracticeAdmin -- who onboarded that supplier -- may not"
            - "${err_par_create} == ERR_UNAUTHORIZED and ${err_receipt} == ERR_UNAUTHORIZED: par levels and stock custody are InventoryManager-exclusive in both directions"
            - "${err_coverage} == ERR_UNAUTHORIZED: coverage verification is InsuranceCoordinator-exclusive"
            - "${err_note} == ERR_UNAUTHORIZED: the medical-necessity note is OrthoPhysician-exclusive, and the compliance role that audits it cannot write it"
            - "${err_reservation} == ERR_UNAUTHORIZED: the role that owns the shelf cannot reserve from it -- reservation is DmeFitter-exclusive"
            - "${err_inspection} == ERR_UNAUTHORIZED and NOT ERR_RETURN_NOT_FOUND, even though the return id is also unknown: priority 3 precedes every existence check"
            - "no denial mutated anything: ${par_v_after} == ${par_v}, ${par_hand_after} == 4 and ${par_resv_after} == 0"
            - "GET /dme/par-levels?clinic_id=${clinic_id} still returns total_count 1 and the encounter is still coverage-unverified"

      - name: corner_shared_operations_accepted_from_every_declared_holder
