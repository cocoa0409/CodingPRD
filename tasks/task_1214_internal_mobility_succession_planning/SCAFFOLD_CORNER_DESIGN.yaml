            - { call: "POST /talent/vacancies/${vac}/postings", payload: { title: "Role 91", planned_open_date: "2026-05-04", planned_close_date: "2026-05-29", min_tenure_months: 12 }, as: HRBusinessPartner, as_user_id: "${hrbp}", captures: { p: $.data.id } }
