      - name: second_open_amendment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_AMENDMENT_ALREADY_OPEN]"]
        distinguishing_aspect: "While an amendment is DRAFT, a second amend on the same parent -> 409 ERR_AMENDMENT_ALREADY_OPEN."
