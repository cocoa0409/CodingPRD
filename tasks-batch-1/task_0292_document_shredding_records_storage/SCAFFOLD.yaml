  - { method: GET, path: "/destruction-invoices", description: "List destruction invoices, filterable by order_id, account_id, certificate_id (reverse-reachability for all three FKs)", roles: [ComplianceOfficer, AccountManager], code: 200,
      input: ["order_id?", "account_id?", "certificate_id?", "status?", "limit?", "offset?"], output: "DestructionInvoice[]", side_effects: [] }
