  - rule_id: compensating_invariant
    instances:
      - name: active_coverage_conserved_activate_then_default
        grounds:
          - state_machines.Guarantee.APPROVED_to_ACTIVE
          - state_machines.Guarantee.ACTIVE_to_DEFAULTED
          - entities.Portfolio.fields.total_active_coverage_cents
        distinguishing_aspect: "Conserved quantity = portfolio.total_active_coverage_cents (Σ total_coverage over ACTIVE/RENEWAL_PENDING guarantees): activate adds +1349994 and declare-default subtracts -1349994, returning the portfolio total to 0 with no drift."
        test_recipe:
          setup:
            - "Single guarantee activated in a fresh portfolio (total_active_coverage_cents becomes 1349994), then defaulted."
