      - name: distribution_adoption_rechecks_empty_eligible_set
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_NO_ELIGIBLE_RECIPIENTS]", calculations.distribution_allocation]
        distinguishing_aspect: "Empty-set edge at adoption: both shareholders suspended between open and close — quorum is met by a pre-suspension ballot, yet adoption re-checks the eligible set and fails with ERR_NO_ELIGIBLE_RECIPIENTS; no Distribution is created."
        test_recipe:
          setup: ["Policy quorum 1; SHAREHOLDERs S and T; DISTRIBUTION motion OPEN; T has voted FOR; then both SUSPENDED"]
