              as: ProgramAdmin
              captures: { m3_id: $.data.id }
          assert:
            - "call 1 returns HTTP 422 with data.error_id == \"ERR_MILESTONE_CYCLE\" — prerequisite sequence_index 5 is not strictly smaller than 3"
            - "call 2 returns HTTP 201 with data.prerequisite_milestone_id == \"${m2_id}\" and data.sequence_index == 3"
