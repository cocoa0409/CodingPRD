        distinguishing_aspect: "The pressure precondition is measured_static_pressure_pa >= round(design_static_pressure_pa * 0.90, 2) == 18.00 for a 20.0 Pa design: 17.9 Pa FAILs even at 1.00 % leakage, and exactly 18.0 Pa PASSes at the same leakage."
