# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 Difficulty Rules x >= 2 instances = 18 instances total
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_provisional_vs_final_pricematch_divergence
        grounds:
          - calculations.order_total_provisional
          - calculations.order_total_final
          - state_machines.Order.READY_to_FULFILLED
          - calculations.price_match_floor
        distinguishing_aspect: "Same Order, identical lines: provisional_total_cents (21000, placement, no claim) diverges from final_total_cents (17000, fulfillment, APPROVED price-match overrides line A unit 8000->6000) — variant divergence on the Order domain."
        test_recipe:
          setup:
            - "One Store CA; SKU A base 8000, SKU B base 5000; inventory received for both; BRONZE customer."
            - "Order has two lines (A qty 2, B qty 1), is PLACED (RESERVED, provisional_total_cents=21000), then READY; an APPROVED price-match on line A at competitor 6000."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "HOCKEY", name: "Stick A", base_price_cents: 8000 }
              as: PlatformAdmin
              captures: { sku_a: $.data.id }
            - call: "POST /skus"
              payload: { sport: "HOCKEY", name: "Puck B", base_price_cents: 5000 }
              as: PlatformAdmin
              captures: { sku_b: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_a}" }
              as: PlatformAdmin
              captures: { inv_a: $.data.id, inv_a_v: $.data.version }
            - call: "POST /store-inventory/${inv_a}/receive"
              payload: { quantity: 10, expected_store_inventory_version: "${inv_a_v}" }
              as: PlatformAdmin
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_b}" }
              as: PlatformAdmin
              captures: { inv_b: $.data.id, inv_b_v: $.data.version }
            - call: "POST /store-inventory/${inv_b}/receive"
              payload: { quantity: 10, expected_store_inventory_version: "${inv_b_v}" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", fulfillment_type: "BOPIS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { sku_id: "${sku_a}", quantity: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_a: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { sku_id: "${sku_b}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /price-match-claims"
              payload: { order_id: "${order_id}", order_line_id: "${line_a}", competitor_price_cents: 6000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /price-match-claims/${claim_id}/approve"
              payload: {}
              as: PriceAdmin
            - call: "POST /orders/${order_id}/ready"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${order_id}/fulfill"
              payload: { expected_order_version: "${ord_v}" }
              as: StoreAssociate
          assert:
            - "Order.${order_id}.provisional_total_cents == 21000"
            - "Order.${order_id}.final_total_cents == 17000"
            - "Order.${order_id}.provisional_total_cents != Order.${order_id}.final_total_cents"

      - name: loyalty_tier_vs_license_fee_distinct_domains
        grounds:
          - calculations.loyalty_tier
          - calculations.license_fee
          - entities.Customer.fields.loyalty_tier
          - entities.FishingLicense.fields.fee_cents
        distinguishing_aspect: "Two valid threshold calcs on different entity domains: loyalty_tier derives BRONZE/SILVER from Customer.loyalty_points, while license_fee derives RESIDENT 2500 vs NONRESIDENT 6500 from Customer.home_state_code == Store.state_code — divergence lives on Customer vs FishingLicense, not the same metric."
        test_recipe:
          setup:
            - "Customer home_state CA. Two stores: CA store (resident) and NV store (nonresident)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { ca_store: $.data.id }
            - call: "POST /stores"
              payload: { name: "NV Store", state_code: "NV" }
              as: PlatformAdmin
              captures: { nv_store: $.data.id }
            - call: "POST /customers"
              payload: { email: "fl@x.com", full_name: "FL Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /fishing-licenses"
              payload: { customer_id: "${cust_id}", issuing_store_id: "${ca_store}" }
              as: StoreAssociate
              captures: { lic_res: $.data.residency, fee_res: $.data.fee_cents }
            - call: "POST /fishing-licenses"
              payload: { customer_id: "${cust_id}", issuing_store_id: "${nv_store}" }
              as: StoreAssociate
              captures: { fee_non: $.data.fee_cents }
          assert:
            - "FishingLicense issued at CA store: residency == RESIDENT and fee_cents == 2500"
            - "FishingLicense issued at NV store: residency == NONRESIDENT and fee_cents == 6500"
            - "Customer.${cust_id}.loyalty_tier == BRONZE (loyalty_points 0, unrelated to license fee)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: team_bulk_discount_then_loyalty_pinned_order
        grounds:
          - calculations.team_bulk_discount
          - calculations.loyalty_discount
          - state_machines.TeamOrder.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Mode (a): >=3 inputs (total_units=20, per-line eff price 3000, tier breakpoints) with tier selection (6% bulk) AND a pinned evaluation order — bulk discount applied to subtotal first, then loyalty applied to (subtotal - bulk_disc) — yielding spawned Order.provisional_total_cents == 65800."
        test_recipe:
          setup:
            - "BRONZE customer; embroiderable SKU base 3000; inventory 30 units; team order with one line qty 20 (total_units==20, the 6% bulk-tier boundary)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "TEAMWEAR", name: "Jersey", base_price_cents: 3000, size_label: "L", embroiderable: true }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "team@x.com", full_name: "Coach", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_id}" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /store-inventory/${inv_id}/receive"
              payload: { quantity: 30, expected_store_inventory_version: "${inv_v}" }
              as: PlatformAdmin
            - call: "POST /team-orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", team_name: "Eagles" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { to_id: $.data.id }
            - call: "POST /team-orders/${to_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 20 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /team-orders/${to_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /team-orders/${to_id}/approve"
              payload: {}
              as: StoreAssociate
              captures: { spawned: $.data.spawned_order_id }
          assert:
            - "TeamOrder.${to_id}.total_units == 20"
            - "spawned Order.provisional_total_cents == 65800 (subtotal 70000, bulk 6% = 4200, loyalty 0)"

      - name: loyalty_discount_round_once_on_subtotal_not_per_line
        grounds:
          - calculations.loyalty_discount
          - calculations.order_total_provisional
          - state_machines.Order.DRAFT_to_RESERVED
        distinguishing_aspect: "Mode (b): nested rounding where order matters — loyalty discount is rounded ONCE on the merchandise subtotal (rhu(21000*5/100)=1050), NOT per line; the scaffold pins round-per-line-then-sum for line prices but round-once for the loyalty percentage, so an implementation that rounds loyalty per line would drift."
        test_recipe:
          setup:
            - "SILVER customer (loyalty_points==500 via a prior 50000-final fulfilled order); two lines base 13000 qty 1 and base 8000 qty 1 (subtotal 21000); 5% loyalty."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "APPAREL", name: "Coat", base_price_cents: 50000, size_label: "L" }
              as: PlatformAdmin
              captures: { sku_big: $.data.id }
            - call: "POST /skus"
              payload: { sport: "APPAREL", name: "Pants", base_price_cents: 13000, size_label: "M" }
              as: PlatformAdmin
              captures: { sku_x: $.data.id }
            - call: "POST /skus"
              payload: { sport: "APPAREL", name: "Shirt", base_price_cents: 8000, size_label: "M" }
              as: PlatformAdmin
              captures: { sku_y: $.data.id }
            - call: "POST /customers"
              payload: { email: "sv@x.com", full_name: "Silver Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_big}" }
              as: PlatformAdmin
              captures: { inv_big: $.data.id, inv_big_v: $.data.version }
            - call: "POST /store-inventory/${inv_big}/receive"
              payload: { quantity: 5, expected_store_inventory_version: "${inv_big_v}" }
              as: PlatformAdmin
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_x}" }
              as: PlatformAdmin
              captures: { inv_x: $.data.id, inv_x_v: $.data.version }
            - call: "POST /store-inventory/${inv_x}/receive"
              payload: { quantity: 5, expected_store_inventory_version: "${inv_x_v}" }
              as: PlatformAdmin
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_y}" }
              as: PlatformAdmin
              captures: { inv_y: $.data.id, inv_y_v: $.data.version }
            - call: "POST /store-inventory/${inv_y}/receive"
              payload: { quantity: 5, expected_store_inventory_version: "${inv_y_v}" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", fulfillment_type: "BOPIS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o0: $.data.id }
            - call: "POST /orders/${o0}/lines"
              payload: { sku_id: "${sku_big}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${o0}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${o0}/ready"
              payload: {}
              as: StoreAssociate
            - call: "GET /orders/${o0}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o0_v: $.data.version }
            - call: "POST /orders/${o0}/fulfill"
              payload: { expected_order_version: "${o0_v}" }
              as: StoreAssociate
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", fulfillment_type: "BOPIS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/lines"
              payload: { sku_id: "${sku_x}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${o1}/lines"
              payload: { sku_id: "${sku_y}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${o1}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prov: $.data.provisional_total_cents }
          assert:
            - "Customer.${cust_id}.loyalty_tier == SILVER (500 points from the first 50000 fulfilled order)"
            - "Order.${o1}.provisional_total_cents == 19950 (subtotal 21000, loyalty 5% rounded ONCE = 1050)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: service_ticket_needs_parts_inprogress_cycle
        grounds:
          - state_machines.ServiceTicket.IN_PROGRESS_to_NEEDS_PARTS
          - state_machines.ServiceTicket.NEEDS_PARTS_to_IN_PROGRESS
          - entities.ServiceTicket.fields.status
        distinguishing_aspect: "ServiceTicket exhibits a cycle IN_PROGRESS->NEEDS_PARTS->IN_PROGRESS (flag-parts then resume), a non-linear shape distinct from any linear pipeline, on the ServiceTicket entity."
        test_recipe:
          setup:
            - "A RACKET_STRING ticket with a part SKU; inventory available; ticket started (IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "APPAREL", name: "String Pack", base_price_cents: 1500, size_label: "NA" }
              as: PlatformAdmin
              captures: { part_sku: $.data.id }
            - call: "POST /customers"
              payload: { email: "svc@x.com", full_name: "Svc Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${part_sku}" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /store-inventory/${inv_id}/receive"
              payload: { quantity: 5, expected_store_inventory_version: "${inv_v}" }
              as: PlatformAdmin
            - call: "POST /service-tickets"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", service_type: "RACKET_STRING", part_sku_id: "${part_sku}" }
              as: ServiceTech
              captures: { tkt_id: $.data.id }
            - call: "POST /service-tickets/${tkt_id}/start"
              payload: {}
              as: ServiceTech
          trigger:
            - call: "POST /service-tickets/${tkt_id}/flag-parts"
              payload: {}
              as: ServiceTech
              captures: { s1: $.data.status }
            - call: "POST /service-tickets/${tkt_id}/resume"
              payload: {}
              as: ServiceTech
              captures: { s2: $.data.status }
          assert:
            - "After flag-parts: ServiceTicket.${tkt_id}.status == NEEDS_PARTS"
            - "After resume: ServiceTicket.${tkt_id}.status == IN_PROGRESS (cycle re-entered)"

      - name: order_parallel_payment_fulfillment_axes
        grounds:
          - state_machines.Order.DRAFT_to_RESERVED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: "Order carries two independent state dimensions on one row: placing moves fulfillment_status DRAFT->RESERVED while payment_status independently moves UNPAID->AUTHORIZED — parallel axes on the Order entity (distinct entity from ServiceTicket's cycle)."
        test_recipe:
          setup:
            - "BRONZE customer; SKU base 4000 stocked; DRAFT order with one line qty 1."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "BASEBALL", name: "Glove", base_price_cents: 4000, size_label: "M" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "par@x.com", full_name: "Par Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_id}" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /store-inventory/${inv_id}/receive"
              payload: { quantity: 5, expected_store_inventory_version: "${inv_v}" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", fulfillment_type: "SFS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fs: $.data.fulfillment_status, ps: $.data.payment_status }
          assert:
            - "Order.${order_id}.fulfillment_status == RESERVED"
            - "Order.${order_id}.payment_status == AUTHORIZED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fulfill_commit_then_loyalty_then_tier_depth3
        grounds:
          - state_machines.Order.READY_to_FULFILLED
          - calculations.order_total_final
          - calculations.loyalty_tier
          - entities.StoreInventory.fields.on_hand_qty
        distinguishing_aspect: "Depth-3 cascade from fulfill: (A) Order FULFILLED -> (B) StoreInventory.on_hand_qty/reserved_qty decremented AND Customer.loyalty_points incremented; the loyalty_points change (B) itself triggers (C) Customer.loyalty_tier recompute BRONZE->SILVER — each link caused by the prior."
        test_recipe:
          setup:
            - "BRONZE customer; SKU base 50000 stocked (qty 5); order with one line qty 1 placed and made READY."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "APPAREL", name: "Premium Coat", base_price_cents: 50000, size_label: "L" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "cas@x.com", full_name: "Cascade Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_id}" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /store-inventory/${inv_id}/receive"
              payload: { quantity: 5, expected_store_inventory_version: "${inv_v}" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", fulfillment_type: "BOPIS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/ready"
              payload: {}
              as: StoreAssociate
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/fulfill"
              payload: { expected_order_version: "${ord_v}" }
              as: StoreAssociate
          assert:
            - "StoreInventory.${inv_id}.on_hand_qty == 4 (was 5, committed 1)"
            - "StoreInventory.${inv_id}.reserved_qty == 0"
            - "Customer.${cust_id}.loyalty_points == 500 (floor(50000/100))"
            - "Customer.${cust_id}.loyalty_tier == SILVER (recomputed from new points)"

      - name: team_approve_spawn_order_reserve_depth3
        grounds:
          - state_machines.TeamOrder.SUBMITTED_to_APPROVED
          - state_machines.Order.DRAFT_to_RESERVED
          - entities.StoreInventory.fields.reserved_qty
          - entities.TeamOrder.fields.spawned_order_id
        distinguishing_aspect: "Depth-3 cascade from team approve, originating at a DIFFERENT trigger than fulfill: (A) TeamOrder APPROVED -> (B) a child Order is SPAWNED and set RESERVED; that spawned-order reservation (B) itself triggers (C) StoreInventory.reserved_qty increment and available_qty recompute."
        test_recipe:
          setup:
            - "BRONZE customer; embroiderable SKU base 3000 stocked qty 30; team order with one line qty 20, submitted."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "TEAMWEAR", name: "Jersey", base_price_cents: 3000, size_label: "L", embroiderable: true }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "tc@x.com", full_name: "Team Coach", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_id}" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /store-inventory/${inv_id}/receive"
              payload: { quantity: 30, expected_store_inventory_version: "${inv_v}" }
              as: PlatformAdmin
            - call: "POST /team-orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", team_name: "Eagles" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { to_id: $.data.id }
            - call: "POST /team-orders/${to_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 20 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /team-orders/${to_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /team-orders/${to_id}/approve"
              payload: {}
              as: StoreAssociate
              captures: { spawned: $.data.spawned_order_id }
          assert:
            - "TeamOrder.${to_id}.spawned_order_id is non-null"
            - "spawned Order.fulfillment_status == RESERVED"
            - "StoreInventory.${inv_id}.reserved_qty == 20"
