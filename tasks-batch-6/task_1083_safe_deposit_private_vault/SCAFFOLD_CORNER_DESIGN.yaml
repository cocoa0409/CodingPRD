# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# safe-deposit-private-vault — Expert. Breadth probe over §1.1–§1.7.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------- entities
  - section: entities
    instances:
      - name: branch_creation_returns_all_fields
        claim_type: Creation
        grounds:
          - entities.Branch
          - endpoints
        distinguishing_aspect: "POST /vault/branches with name/code/viewing_room_capacity → 201, status OPEN, id+created_at minted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /vault/branches", payload: { name: "Corner", code: "CO1", viewing_room_capacity: 3 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
          assert:
            - "response code == 201"
            - "Branch(${branch_id}).status == OPEN"
            - "Branch(${branch_id}).viewing_room_capacity == 3"

      - name: box_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.Box
          - endpoints
        distinguishing_aspect: "POST /vault/boxes without box_number → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A branch and box-type exist."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Corner", code: "CO2", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "SMALL", annual_rate_cents: 12000, height_mm: 50, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
          trigger:
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}" }, as: VaultAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http_status == 422"

      - name: renter_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Renter
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /vault/renters/{unknown} → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /vault/renters/00000000-0000-4000-8000-000000000000", payload: {}, as: VaultAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: rental_annual_rate_snapshot_computed
        claim_type: Computed Fields
        grounds:
          - entities.Rental.fields.annual_rate_cents
          - endpoints
        distinguishing_aspect: "Rental.annual_rate_cents is snapshotted from BoxType.annual_rate_cents at creation, not client-supplied."
        test_recipe:
          setup: ["Branch + LARGE box-type (annual_rate_cents=48000) + box."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Snap", code: "SN1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "LARGE", annual_rate_cents: 48000, height_mm: 200, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "SN-1" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Val Snap", email: "val@x.com", gov_id_ref: "G-30", date_of_birth: "1990-01-01" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
          trigger:
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
          assert:
            - "Rental(${rental_id}).annual_rate_cents == 48000"
            - "Rental(${rental_id}).status == PENDING"

      - name: rental_defaults_applied
        claim_type: Defaults
        grounds:
          - entities.Rental.fields.plan_term_months
          - entities.Rental.fields.autopay_enabled
          - entities.Rental.fields.insurance_rider_enabled
        distinguishing_aspect: "Omitting plan_term_months/autopay_enabled/insurance_rider_enabled applies defaults 12/false/false."
        test_recipe:
          setup: ["Branch + box-type + box + renter."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Def", code: "DF1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "SMALL", annual_rate_cents: 12000, height_mm: 50, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "DF-1" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Deb Def", email: "deb@x.com", gov_id_ref: "G-31", date_of_birth: "1992-02-02" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
          trigger:
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}" }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
          assert:
            - "Rental(${rental_id}).plan_term_months == 12"
            - "Rental(${rental_id}).autopay_enabled == false"
            - "Rental(${rental_id}).insurance_rider_enabled == false"

      - name: box_bad_branch_fk_rejected
        claim_type: Parent Relationships
        grounds:
          - entities.Box.fields.branch_id
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /vault/boxes with a non-existent branch_id → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A box-type exists; no branch with the referenced id."]
          setup_api_calls:
            - { call: "POST /vault/box-types", payload: { size_class: "SMALL", annual_rate_cents: 12000, height_mm: 50, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
          trigger:
            - { call: "POST /vault/boxes", payload: { branch_id: "00000000-0000-4000-8000-000000000001", box_type_id: "${bt_id}", box_number: "X-1" }, as: VaultAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_NOT_FOUND"

  # ---------------------------------------------------------- state_machines
  - section: state_machines
    instances:
      - name: decommission_rented_box_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Box.AVAILABLE_to_OUT_OF_SERVICE
          - "errors[ERR_BOX_NOT_AVAILABLE]"
        distinguishing_aspect: "Decommissioning a RENTED box (not AVAILABLE) → ERR_BOX_NOT_AVAILABLE; box stays RENTED."
        test_recipe:
          setup: ["Rental ACTIVE on a box (box RENTED)."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "SM", code: "SM1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "SM-1" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Sue SM", email: "sue@x.com", gov_id_ref: "G-32", date_of_birth: "1980-03-03" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
          trigger:
            - { call: "POST /vault/boxes/${box_id}/decommission", payload: {}, as: VaultAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_BOX_NOT_AVAILABLE"
            - "Box(${box_id}).status == RENTED"

      - name: grant_suspend_resume_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.AccessGrant.ACTIVE_to_SUSPENDED
          - state_machines.AccessGrant.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "An ACTIVE grant can suspend then resume back to ACTIVE (cyclic SUSPENDED<->ACTIVE)."
        test_recipe:
          setup: ["Rental ACTIVE with an ACTIVE CO_RENTER grant."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "SM", code: "SM2", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "SM-2" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Cy Cle", email: "cy@x.com", gov_id_ref: "G-33", date_of_birth: "1981-04-04" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/access-grants", payload: { rental_id: "${rental_id}", grant_type: "CO_RENTER", grantee_name: "Deputy" }, as: VaultAdmin, captures: { grant_id: "$.data.id" } }
            - { call: "POST /vault/access-grants/${grant_id}/activate", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/access-grants/${grant_id}/suspend", payload: {}, as: VaultAdmin }
          trigger:
            - { call: "POST /vault/access-grants/${grant_id}/resume", payload: {}, as: VaultAdmin }
          assert:
            - "AccessGrant(${grant_id}).status == ACTIVE"

      - name: drilling_complete_twice_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.DrillingOrder.SCHEDULED_to_DRILLED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Completing an already-DRILLED order again → ERR_INVALID_STATE (terminal)."
        excluded_because:
          difficulty_instance: transitive_cascade / drilling_complete_depth4_cascade
          rationale: "The DRILLED terminal state and its single completion are established by the §1.8 depth-4 cascade instance; re-completion is the trivial terminal-lockdown corollary."

      - name: compliance_clear_restores_standing
        claim_type: Cross-entity
        grounds:
          - state_machines.ComplianceCase.OPEN_to_CLEARED
          - entities.Renter.fields.standing
        distinguishing_aspect: "Clearing the only open HOLD case sets Renter.standing back to GOOD."
        test_recipe:
          setup: ["Renter with one open HOLD compliance case → standing FROZEN."]
          setup_api_calls:
            - { call: "POST /vault/renters", payload: { full_name: "Hol Der", email: "hol@x.com", gov_id_ref: "G-34", date_of_birth: "1982-05-05" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/compliance-cases", payload: { renter_id: "${renter_id}", case_type: "SAR", severity: "HOLD" }, as: ComplianceOfficer, captures: { case_id: "$.data.id" } }
          trigger:
            - { call: "POST /vault/compliance-cases/${case_id}/clear", payload: {}, as: ComplianceOfficer }
          assert:
            - "ComplianceCase(${case_id}).status == CLEARED"
            - "Renter(${renter_id}).standing == GOOD"

  # --------------------------------------------------------------- calculations
  - section: calculations
    instances:
      - name: proceeds_waterfall_full_buckets
        claim_type: waterfall_allocation
        grounds:
          - calculations.proceeds_waterfall
          - state_machines.DrillingOrder.SCHEDULED_to_DRILLED
        distinguishing_aspect: |
          Arrears 27000 (invoice 24000 + late fee 3000 at dpd=40), drilling_fee 15000, ADMIN_FEE 5000,
          proceeds 50000 → arrears 27000, drilling 15000, admin 5000, escrow 3000 (sums to 50000).
        test_recipe:
          setup: ["Rental DELINQUENT at dpd=40 (balance 27000); DrillingOrder SCHEDULED with drilling_fee 15000."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Water", code: "WT1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "WT-1" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Wat Fall", email: "wat@x.com", gov_id_ref: "G-35", date_of_birth: "1970-06-06" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/_clock/set_current_utc", payload: { to_iso8601: "2026-07-10T00:00:00Z" }, as: VaultAdmin }
            - { call: "POST /vault/_billing/run_cycle", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/drilling-orders", payload: { box_id: "${box_id}", rental_id: "${rental_id}", reason: "DELINQUENCY", drilling_fee_cents: 15000 }, as: VaultAdmin, as_user_id: "admin-1", captures: { drill_id: "$.data.id" } }
            - { call: "POST /vault/drilling-orders/${drill_id}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /vault/drilling-orders/${drill_id}/schedule", payload: { scheduled_at: "2026-07-11T09:00:00Z" }, as: VaultAdmin }
          trigger:
            - { call: "POST /vault/drilling-orders/${drill_id}/complete", payload: { proceeds_cents: 50000 }, as: VaultAdmin }
          assert:
            - "DrillingOrder(${drill_id}).proceeds_to_arrears_cents == 27000"
            - "DrillingOrder(${drill_id}).proceeds_to_drilling_cents == 15000"
            - "DrillingOrder(${drill_id}).proceeds_to_admin_cents == 5000"
            - "DrillingOrder(${drill_id}).proceeds_to_escrow_cents == 3000"

      - name: balance_due_excludes_voided_invoice
        claim_type: Input Set Filtering
        grounds:
          - calculations.rental_balance_due
          - state_machines.Invoice.OPEN_to_VOID
        distinguishing_aspect: "Voiding the only OPEN invoice drops rental.balance_due_cents from 24000 to 0 (VOID excluded from the sum)."
        test_recipe:
          setup: ["Rental ACTIVE, first invoice 24000 OPEN, balance 24000, no payments."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Bal", code: "BL1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "BL-1" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Bea Lance", email: "bea@x.com", gov_id_ref: "G-36", date_of_birth: "1988-07-07" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "GET /vault/invoices?rental_id=${rental_id}", payload: {}, as: Any, captures: { inv_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /vault/invoices/${inv_id}/void", payload: {}, as: VaultAdmin }
          assert:
            - "Invoice(${inv_id}).status == VOID"
            - "Rental(${rental_id}).balance_due_cents == 0"

  # ---------------------------------------------------------------- validations
  - section: validations
    instances:
      - name: create_payment_zero_amount_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /vault/payments with amount_cents=0 → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Rental ACTIVE."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Zero", code: "ZR1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "ZR-1" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Zoe Ro", email: "zoe@x.com", gov_id_ref: "G-37", date_of_birth: "1993-08-08" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
          trigger:
            - { call: "POST /vault/payments", payload: { rental_id: "${rental_id}", amount_cents: 0, method: "CASH" }, as: BillingClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: close_with_outstanding_balance_rejected
        claim_type: Violation → Error
        grounds:
          - "validations[priority=10]"
          - state_machines.Rental.SURRENDER_PENDING_to_CLOSED
          - "errors[ERR_OUTSTANDING_BALANCE]"
        distinguishing_aspect: "Closing a SURRENDER_PENDING rental that still owes 24000 → ERR_OUTSTANDING_BALANCE; rental stays SURRENDER_PENDING."
        test_recipe:
          setup: ["Rental ACTIVE with unpaid invoice (balance 24000), moved to SURRENDER_PENDING."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Owe", code: "OW1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "OW-1" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Ora Owe", email: "ora@x.com", gov_id_ref: "G-38", date_of_birth: "1979-09-09" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
            - { call: "POST /vault/rentals/${rental_id}/request-surrender", payload: {}, as: VaultAdmin }
          trigger:
            - { call: "POST /vault/rentals/${rental_id}/close", payload: {}, as: VaultAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_OUTSTANDING_BALANCE"
            - "Rental(${rental_id}).status == SURRENDER_PENDING"

      - name: beneficiary_activation_requires_death_certificate
        claim_type: Conditional validation
        grounds:
          - state_machines.AccessGrant.PENDING_to_ACTIVE
          - "validations[priority=9]"
          - "errors[ERR_DEATH_CERTIFICATE_REQUIRED]"
        distinguishing_aspect: "Activating a BENEFICIARY grant without death_certificate_ref → ERR_DEATH_CERTIFICATE_REQUIRED; a CO_RENTER grant needs no certificate."
        test_recipe:
          setup: ["Rental ACTIVE with a PENDING BENEFICIARY grant."]
          setup_api_calls:
            - { call: "POST /vault/branches", payload: { name: "Ben", code: "BN1", viewing_room_capacity: 2 }, as: VaultAdmin, captures: { branch_id: "$.data.id" } }
            - { call: "POST /vault/box-types", payload: { size_class: "MEDIUM", annual_rate_cents: 24000, height_mm: 100, width_mm: 250, depth_mm: 500 }, as: VaultAdmin, captures: { bt_id: "$.data.id" } }
            - { call: "POST /vault/boxes", payload: { branch_id: "${branch_id}", box_type_id: "${bt_id}", box_number: "BN-1" }, as: VaultAdmin, captures: { box_id: "$.data.id" } }
            - { call: "POST /vault/renters", payload: { full_name: "Ben Efi", email: "beni@x.com", gov_id_ref: "G-39", date_of_birth: "1960-10-10" }, as: VaultAdmin, captures: { renter_id: "$.data.id" } }
            - { call: "POST /vault/renters/${renter_id}/verify-kyc", payload: {}, as: ComplianceOfficer }
            - { call: "POST /vault/rentals", payload: { box_id: "${box_id}", renter_id: "${renter_id}", plan_term_months: 12 }, as: VaultAdmin, captures: { rental_id: "$.data.id" } }
            - { call: "POST /vault/rentals/${rental_id}/activate", payload: {}, as: VaultAdmin }
