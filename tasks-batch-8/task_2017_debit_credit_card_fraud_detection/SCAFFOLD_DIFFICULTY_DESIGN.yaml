            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-BP1", cardholder_name: "Bee One", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-BP1", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50, high_risk_countries: ["RU"] }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 100000, merchant_id: "M-BP1", merchant_category_code: "5411", channel: "CNP", origin_country: "MX" }, as: NetworkGateway, captures: { t_eq: "$.data.id" } }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 99999, merchant_id: "M-BP1", merchant_category_code: "5411", channel: "CNP", origin_country: "MX" }, as: NetworkGateway, captures: { t_below: "$.data.id" } }
          assert:
            - "AuthTransaction.${t_eq}.auth_score == 100 and decision == DECLINE (score == decline_threshold declines: >= semantics)"
            - "AuthTransaction.${t_below}.auth_score == 75 and decision == REVIEW"
            - "exactly one FraudAlert exists with auth_transaction_id == ${t_below} (REVIEW) and zero for ${t_eq} (DECLINE creates no alert)"
      - name: duplicate_credit_equality_allowed
        grounds:
