              captures: { fil: $.data.id }
            - call: "POST /plan-audit/schedule-entries"
              payload: { filing_id: "${fil}", schedule_type: "I", line_item: "I-1 total assets", amount_cents: 0 }
              as: TPASpecialist
              captures: { se: $.data.id }
            - call: "POST /plan-audit/schedule-entries/${se}/verify"
              payload: {}
              as: PlanAuditor
            - call: "POST /plan-audit/filings/${fil}/mark_schedules_complete"
              payload: {}
              as: TPASpecialist
