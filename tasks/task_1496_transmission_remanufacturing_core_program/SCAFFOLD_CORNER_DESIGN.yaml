              as: Calibrator
              as_user_id: "cal-a"
          trigger:
            - call: "POST /api/reman-orders/${o_id}/verify-calibration"
              as: RemanTechnician
              captures: { err: "$.data.error_id" }
          assert:
            - "status == 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "RemanOrder.${o_id}.cal_status == DRAFT (unchanged)"

  # ===========================================================================
  # Section: cross-cutting complexity layers (OCC, cascades, version pinning)
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_stale_version_on_spec_resync_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reman-order-resync-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "resync-spec with the pre-first-resync version succeeds once (version 1 -> 2); replaying the same stale version is rejected 412 ERR_STALE_VERSION on the second, strictly sequential request."
        test_recipe:
          setup: ["one MIN model; one QUEUED order (version 1 captured at creation); model spec updated once (spec_version 2)"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id", o_v: "$.data.version" }
            - call: "PUT /api/transmission-models/${m_id}"
              payload: { required_parts: [ {part_family: "PUMP", qty: 1} ] }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/reman-orders/${o_id}/resync-spec"
              payload: { expected_reman_order_version: "${o_v}" }
              as: RemanPlanner
              captures: { o_v2: "$.data.version" }
            - call: "POST /api/reman-orders/${o_id}/resync-spec"
              payload: { expected_reman_order_version: "${o_v}" }
              as: RemanPlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "first resync: 200, RemanOrder.${o_id}.version == 2 and model_spec_version_pin == 2"
            - "second resync with stale version: 412, error_id == ERR_STALE_VERSION"
            - "RemanOrder.${o_id}.version == 2 (unchanged by rejected call)"

      - name: spec_update_bumps_version_and_order_keeps_pin
        claim_type: derived_field_reconciliation
        grounds: [entities.TransmissionModel.fields.spec_version, entities.RemanOrder.fields.model_spec_version_pin, "endpoints[PUT /api/transmission-models/{id}]"]
        distinguishing_aspect: "PUT on the model bumps spec_version 1 -> 2 while the existing order's pinned spec stays at version 1 with the original required_parts until an explicit resync."
        test_recipe:
          setup: ["one model (required_parts []) and one order pinned at spec_version 1"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "MIN-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
          trigger:
            - call: "PUT /api/transmission-models/${m_id}"
              payload: { required_parts: [ {part_family: "PUMP", qty: 1} ] }
              as: ProgramAdmin
            - call: "GET /api/reman-orders/${o_id}"
              as: Any
          assert:
            - "TransmissionModel.${m_id}.spec_version == 2"
            - "RemanOrder.${o_id}.model_spec_version_pin == 1"
            - "RemanOrder.${o_id}.pinned_spec.required_parts == [] (snapshot unaffected by model update)"

      - name: return_receive_salvage_promotes_part_hold_order
        claim_type: cascading_side_effects
        grounds: [state_machines.WarrantyClaimReturn.transitions.IN_TRANSIT_to_DISPOSITIONED, calculations.parts_reservation_allocation]
        distinguishing_aspect: "Salvage restock on return-receive raises availability and auto-promotes the oldest resolvable PART_HOLD order: receive -> restock -> promotion, a cascade triggered by the receive call."
        test_recipe:
          setup:
            - "model FULL requires 2x PUMP; P1 DIRECT on_hand 2"
            - "order1 holds both P1 units (availability 0) and has been SHIPPED (parts consumed: on_hand 0)"
            - "order2 sits in PART_HOLD on the PUMP shortage"
            - "claim on order1 approved with routing RETURN_TO_PLANT; return leg IN_TRANSIT"
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "FULL-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200}, {gear: 2, target_pressure_kpa: 220}, {gear: 3, target_pressure_kpa: 240}, {gear: 4, target_pressure_kpa: 260} ], required_parts: [ {part_family: "PUMP", qty: 2} ] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/hard-parts"
              payload: { part_number: "P-100", part_family: "PUMP", unit_cost_cents: 1000, qty_on_hand: 2 }
              as: InventoryPlanner
              captures: { p1_id: "$.data.id" }
            - call: "POST /api/interchange-mappings"
              payload: { hard_part_id: "${p1_id}", transmission_model_id: "${m_id}", tier: "DIRECT" }
              as: InventoryPlanner
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o1_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o1_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-2" }
              as: RemanPlanner
              captures: { o2_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o2_id}/kit-reserve"
              as: RemanPlanner
            - call: "POST /api/reman-orders/${o1_id}/complete-assembly"
              as: RemanTechnician
            - call: "PUT /api/reman-orders/${o1_id}/calibration"
              payload: { solenoid_trims: [0.1, -0.2, 0.3, 0.0], tcm_flash_version: "TF-2026.08" }
              as: Calibrator
              as_user_id: "cal-a"
            - call: "POST /api/reman-orders/${o1_id}/verify-calibration"
              as: Calibrator
              as_user_id: "cal-b"
            - call: "POST /api/dyno-bookings"
              payload: { reman_order_id: "${o1_id}", dyno_cell_code: "DYNO-1", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-02T00:00:00Z" }
              as: RemanTechnician
            - call: "POST /api/dyno-test-runs"
              payload: { reman_order_id: "${o1_id}", gear_pressures_kpa: [200, 220, 240, 260] }
              as: DynoOperator
            - call: "POST /api/reman-orders/${o1_id}/ship"
              as: RemanPlanner
            - call: "POST /api/warranty-claims"
              payload: { reman_order_id: "${o1_id}", failure_code: "GEAR_CLUNK", claimed_labor_hours: 5.0, installer_labor_rate_cents: 12000, allowance_policy: "BOOK_HOURS" }
              as: Installer
              as_user_id: "inst-1"
              captures: { cl_id: "$.data.id" }
            - call: "POST /api/warranty-claims/${cl_id}/approve"
              as: WarrantyAdjuster
            - call: "POST /api/warranty-claims/${cl_id}/return-ship"
              as: Installer
              as_user_id: "inst-1"
          trigger:
            - call: "POST /api/warranty-claims/${cl_id}/return-receive"
              payload: { salvaged_parts: [ {hard_part_id: "${p1_id}", qty: 2} ] }
              as: WarrantyAdjuster
            - call: "POST /api/warranty-claims/${cl_id}/pay"
              as: WarrantyAdjuster
            - call: "GET /api/reman-orders/${o2_id}"
              as: Any
          assert:
            - "WarrantyClaim.${cl_id}.return_status == DISPOSITIONED"
            - "HardPart.${p1_id}.qty_on_hand == 2 (salvage restocked)"
            - "RemanOrder.${o2_id}.status == ASSEMBLY (promoted from PART_HOLD) with reserved_parts[0].qty == 2"
            - "HardPart.${p1_id}.qty_reserved == 2 (re-reserved by the promoted order)"
            - "WarrantyClaim.${cl_id}.claim_status == PAID (pay gate satisfied after disposition)"

      - name: stock_adjustment_restock_promotes_waiting_order
        claim_type: cascading_side_effects
        grounds: ["endpoints[POST /api/hard-parts/{id}/stock-adjustments]", calculations.parts_reservation_allocation]
        distinguishing_aspect: "A positive stock adjustment is an availability-increasing event: the oldest PART_HOLD order auto-promotes to ASSEMBLY and reserves the freshly restocked units."
        test_recipe:
          setup: ["model FULL requires 2x PUMP; P1 DIRECT on_hand 1; one order attempted kit-reserve and sits in PART_HOLD"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "FULL-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [ {part_family: "PUMP", qty: 2} ] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/hard-parts"
              payload: { part_number: "P-100", part_family: "PUMP", unit_cost_cents: 1000, qty_on_hand: 1 }
              as: InventoryPlanner
              captures: { p1_id: "$.data.id", p1_v: "$.data.version" }
            - call: "POST /api/interchange-mappings"
              payload: { hard_part_id: "${p1_id}", transmission_model_id: "${m_id}", tier: "DIRECT" }
              as: InventoryPlanner
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id" }
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
          trigger:
            - call: "POST /api/hard-parts/${p1_id}/stock-adjustments"
              payload: { qty_delta: 2, expected_hard_part_version: "${p1_v}" }
              as: InventoryPlanner
          assert:
            - "HardPart.${p1_id}.qty_on_hand == 3 and qty_reserved == 2"
            - "RemanOrder.${o_id}.status == ASSEMBLY and shortage_parts == []"
            - "RemanOrder.${o_id}.reserved_parts[0].hard_part_id == ${p1_id} with qty 2"

  # ===========================================================================
  # Section: consistency model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: kit_reserve_response_reflects_mutation_immediately
        claim_type: immediate_consistency
        grounds: ["endpoints[POST /api/reman-orders/{id}/kit-reserve]", complexity_profile.consistency_model]
        distinguishing_aspect: "The kit-reserve 200 response body itself carries the post-mutation state (status ASSEMBLY, populated reserved_parts, incremented version) - no separate read is needed to observe the change."
        test_recipe:
          setup: ["model FULL requires 2x PUMP; P1 DIRECT on_hand 5; one QUEUED order"]
          setup_api_calls:
            - call: "POST /api/transmission-models"
              payload: { model_code: "FULL-6L80", year_start: 2014, year_end: 2019, make: "GM", model: "Silverado", core_deposit_cents: 50000, flat_rate_hours: 6.0, labor_cap_cents: 90000, dyno_targets: [ {gear: 1, target_pressure_kpa: 200} ], required_parts: [ {part_family: "PUMP", qty: 2} ] }
              as: ProgramAdmin
              captures: { m_id: "$.data.id" }
            - call: "POST /api/hard-parts"
              payload: { part_number: "P-100", part_family: "PUMP", unit_cost_cents: 1000, qty_on_hand: 5 }
              as: InventoryPlanner
              captures: { p1_id: "$.data.id" }
            - call: "POST /api/interchange-mappings"
              payload: { hard_part_id: "${p1_id}", transmission_model_id: "${m_id}", tier: "DIRECT" }
              as: InventoryPlanner
            - call: "POST /api/reman-orders"
              payload: { transmission_model_id: "${m_id}", buyer_ref: "BUYER-1" }
              as: RemanPlanner
              captures: { o_id: "$.data.id", o_v: "$.data.version" }
          trigger:
            - call: "POST /api/reman-orders/${o_id}/kit-reserve"
              as: RemanPlanner
              captures: { new_status: "$.data.status", new_version: "$.data.version" }
          assert:
            - "response data.status == ASSEMBLY"
            - "response data.reserved_parts length == 1 with hard_part_id == ${p1_id}, qty == 2, tier == DIRECT"
            - "response data.version == ${o_v} + 1"
            - "response data.surcharge_labor_minutes == 0 (DIRECT tier adds none)"
