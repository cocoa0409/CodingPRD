            - call: "POST /document-packages"
              payload: { rating_id: "${y_rt1}", package_type: "UTILITY_PROGRAM", expected_rating_version: "${y_rt1_v2}" }
              as: BuilderRep
              as_user_id: "${y_b1}"
              captures: { y_dp1b: $.data.id }
          assert:
            - "the first trigger returns HTTP status == 412 with error_id == ERR_STALE_RATING_VERSION"
            - "the retry returns HTTP status == 201"
            - "the captured ${y_rt1_v2} is exactly one greater than ${y_rt1_v1}"
            - "DocumentPackage.${y_dp1a}.status == DRAFT"
            - "DocumentPackage.${y_dp1b}.status == DRAFT"
            - "DocumentPackage.${y_dp1b}.package_type == UTILITY_PROGRAM"
            - "DocumentPackage.${y_dp1b}.provisional_amount_cents == 132500"
            - "GET /ratings/${y_rt1}/document-packages returns exactly 2 items"

      - name: stale_expected_sample_set_version_on_membership_add_rejected
