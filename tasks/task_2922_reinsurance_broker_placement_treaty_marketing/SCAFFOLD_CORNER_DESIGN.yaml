          assert:
            - "${qs_ceded} == 40000000  # round_half_up(100000000 * 40.0000 / 100); the 50,000,000 limit does not bind"
            - "${qs_collectible} == 40000000 and Layer.${qs_layer}.limit_eroded_minor == 0"
            - "${cat_ceded} == 250000000  # subject 600000000, event cap = sublimit 250000000, limit 1000000000, aggregate 2000000000 — the sublimit binds"
            - "${cat_collectible} == 250000000, ${cat_reinst} == false and ${cat_arb0} == 0"
            - "Layer.${cat_layer}.limit_eroded_minor == 0 and reinstatements_used == 0 — notification never erodes"
            - "${cat_route} == ARBITRATION and ${cat_arb1} == 3750000  # round_half_up(250000000 * 1.5 / 100)"
            - "${cat_disputed} == 100000000 and ${cat_collectible1} == 150000000"
            - "${disp_status} == SETTLED_PARTIAL and ${disp_settled} == 40000000"
            - "ClaimAdvocacy.${adv_cat}.disputed_minor == 60000000 and collectible_minor == 190000000 after the re-evaluation"
            - "ClaimAdvocacy.${adv_cat}.status == RESOLVED and Layer.${cat_layer}.incurred_ceded_minor == 250000000"
            - "ClaimAdvocacy.${adv_qs}.status is still NOTIFIED and its figures are untouched by the CAT layer's dispute"

      - name: fiduciary_projection_reads_only_settled_and_reversed_rows
        claim_type: projection
        grounds:
          - calculations.fiduciary_holding
          - entities.Program.fields.fiduciary_holding_minor
          - entities.Cedent.fields.settled_receipts_minor
        distinguishing_aspect: |
          The balance is a projection over rows in status SETTLED or REVERSED only. Booking a receipt
          leaves the balance at 0; settling it moves it to 97,125,000; a second receipt left PENDING
          and a remittance merely APPROVED both leave the balance untouched — approval is not
          movement. Only when the remittance settles does the balance fall to 2,428,125, exactly the
          brokerage the bind computed. Cedent.settled_receipts_minor counts the settled receipt alone
          and ignores the PENDING one.
        test_recipe:
          setup:
            - "A BOUND program (CAT layer 1B xs 2B, quoted_gross_premium_minor 97,125,000, placed 100.0000 by Alpha Re, brokerage 2.5000) whose documentation has reached WORDING_AGREED so remittances may settle."
            - "Each booking re-reads Program.version because expected_program_version is mandatory and every booking bumps it."
