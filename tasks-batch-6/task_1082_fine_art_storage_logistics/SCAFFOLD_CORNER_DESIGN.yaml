# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ---- Entities ------------------------------------------------------------
  - section: entities
    instances:
      - name: client_create_returns_201_with_system_defaults
        claim_type: Creation
        grounds:
          - entities.Client.fields.account_status
          - entities.Client.fields.outstanding_balance_cents
        distinguishing_aspect: "POST /clients with required fields returns 201; account_status defaults ACTIVE and outstanding_balance_cents 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "New Client", client_type: "INDIVIDUAL", billing_email: "c@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
          trigger:
            - call: "GET /clients/${client_id}"
              payload: {}
              as: Registrar
          assert:
            - "Client.${client_id}.account_status == ACTIVE"
            - "Client.${client_id}.outstanding_balance_cents == 0"

      - name: artwork_missing_size_class_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Artwork.fields.size_class]
        distinguishing_aspect: "POST /artworks omitting required size_class returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["one client"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C2", client_type: "DEALER", billing_email: "c2@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Untitled", artist: "Anon", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response.http_status == 400"

      - name: get_artwork_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /artworks/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /artworks/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: artwork_appraised_value_reconciles_from_appraisal
        claim_type: Computed Fields
        grounds:
          - entities.Artwork.fields.appraised_value_cents
          - calculations.appraisal_value
        distinguishing_aspect: "Creating a FAIR_MARKET appraisal of 750000 sets the artwork's derived appraised_value_cents to 750000 (derived-field reconciliation)."
        test_recipe:
          setup: ["client and artwork"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C3", client_type: "INSTITUTION", billing_email: "c3@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Recon", artist: "R", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id, art_v: $.data.version }
            - call: "POST /appraisals"
              payload: { artwork_id: "${art_id}", method: "FAIR_MARKET", comparable_base_cents: 750000, appraiser_name: "A", expected_artwork_version: "${art_v}" }
              as: Registrar
              captures: { appr_id: $.data.id }
          trigger:
            - call: "GET /artworks/${art_id}"
              payload: {}
              as: Registrar
          assert:
            - "Artwork.${art_id}.appraised_value_cents == 750000"

      - name: condition_report_created_and_retrievable
        claim_type: Creation
        grounds: [entities.ConditionReport.fields.report_type]
        distinguishing_aspect: "ConditionReport is an immutable event log (common_fields:false); POST returns 201 and it is retrievable via GET."
        test_recipe:
          setup: ["client and artwork"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C4", client_type: "INSTITUTION", billing_email: "c4@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Log", artist: "L", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /condition-reports"
              payload: { artwork_id: "${art_id}", report_type: "INTAKE", condition_grade: "A", damage_noted: false, notes: "clean intake" }
              as: Registrar
              captures: { cr_id: $.data.id }
          trigger:
            - call: "GET /condition-reports/${cr_id}"
              payload: {}
              as: Registrar
          assert:
            - "ConditionReport.${cr_id}.report_type == INTAKE"

  # ---- State Machines ------------------------------------------------------
  - section: state_machines
    instances:
      - name: vault_decommission_with_occupancy_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Vault.OPERATIONAL_to_DECOMMISSIONED]
        distinguishing_aspect: "Decommissioning a vault with occupied_slots > 0 is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["AMBIENT vault cap 1 with one ACTIVE placement"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C5", client_type: "INSTITUTION", billing_email: "c5@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /vaults"
              payload: { name: "V5", climate_class: "AMBIENT", capacity_slots: 1 }
              as: Registrar
              captures: { vault_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Occ", artist: "O", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /storage-placements"
              payload: { artwork_id: "${art_id}", vault_id: "${vault_id}", start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /vaults/${vault_id}/state"
              payload: { to_status: "DECOMMISSIONED" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: loan_resubmit_from_rejected_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.LoanAgreement.SUBMITTED_to_REJECTED]
        distinguishing_aspect: "REJECTED is terminal; attempting SUBMITTED from REJECTED returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["loan submitted then rejected"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C6", client_type: "INSTITUTION", billing_email: "c6@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Rej", artist: "R", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /loans"
              payload: { artwork_id: "${art_id}", client_id: "${client_id}", borrower_name: "B", exhibition_name: "E", loan_start: "2026-06-01T00:00:00Z", loan_end: "2026-07-01T00:00:00Z", is_international: false, required_value_cents: 1000000 }
              as: Registrar
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "REJECTED" }
              as: Approver
              as_user_id: "app-1"
          trigger:
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: invoice_pay_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Invoice.ISSUED_to_PAID]
        distinguishing_aspect: "PAID is only reachable from ISSUED; DRAFT->PAID returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["client with a DRAFT invoice"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C7", client_type: "INSTITUTION", billing_email: "c7@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /invoices"
              payload: { client_id: "${client_id}", billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-05-31T00:00:00Z", manual_line_items: [ { description: "S", amount_cents: 1000 } ] }
              as: BillingAdmin
              captures: { invoice_id: $.data.id }
          trigger:
            - call: "POST /invoices/${invoice_id}/state"
              payload: { to_status: "PAID" }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

  # ---- Calculations --------------------------------------------------------
  - section: calculations
    instances:
      - name: transport_charge_estimated_with_rigging_surcharge
        claim_type: Correct Result
        grounds:
          - calculations.transport_charge
          - entities.TransportJob.fields.transport_charge_cents
        distinguishing_aspect: "At schedule, estimated_hours=3 with requires_rigging=true yields round(3*9000)+25000 = 52000."
        test_recipe:
          setup: ["client, artwork, crate, crew"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C8", client_type: "DEALER", billing_email: "c8@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Move", artist: "M", size_class: "MEDIUM", fragility_class: "MEDIUM", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /crates"
              payload: { artwork_id: "${art_id}", crate_type: "HARD", internal_length_cm: 100, internal_width_cm: 70, internal_height_cm: 12 }
              as: Coordinator
              captures: { crate_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew C", crew_size: 2, certification_level: "STANDARD" }
              as: Coordinator
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /transport-jobs"
              payload: { artwork_id: "${art_id}", crate_id: "${crate_id}", crew_id: "${crew_id}", origin_location: "A", destination_location: "B", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T12:00:00Z", requires_rigging: true, estimated_hours: 3 }
              as: Coordinator
              captures: { job_id: $.data.id }
          assert:
            - "TransportJob.${job_id}.transport_charge_cents == 52000"

      - name: insurance_premium_min_floor_applied
        claim_type: Constants Applied
        grounds: [calculations.insurance_premium]
        distinguishing_aspect: "A tiny 1-day policy computes below MIN_PREMIUM_CENTS and is floored to 5000."
        test_recipe:
          setup: ["client, LOW-fragility artwork"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C9", client_type: "INDIVIDUAL", billing_email: "c9@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Tiny", artist: "T", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id, art_v: $.data.version }
          trigger:
            - call: "POST /policies"
              payload: { artwork_id: "${art_id}", coverage_type: "STORAGE_ONLY", insured_value_cents: 100000, effective_start: "2026-05-01T00:00:00Z", effective_end: "2026-05-02T00:00:00Z", expected_artwork_version: "${art_v}" }
              as: Registrar
              captures: { policy_id: $.data.id }
          assert:
            - "InsurancePolicy.${policy_id}.premium_cents == 5000"

      - name: storage_fee_dual_variant_divergence
        claim_type: Variant Divergence
        grounds: [calculations.storage_fee]
        excluded_because:
          difficulty_instance: dual_variant_calc / storage_fee_provisional_vs_final
          rationale: "Provisional-vs-final divergence is asserted by the named §1.8 instance."

  # ---- Validations ---------------------------------------------------------
  - section: validations
    instances:
      - name: placement_climate_mismatch_returns_error
        claim_type: Violation → Error
        grounds: ["validations[priority=13]"]
        distinguishing_aspect: "COLD artwork into an AMBIENT vault returns ERR_CLIMATE_MISMATCH (422)."
        test_recipe:
          setup: ["AMBIENT vault; COLD artwork"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C10", client_type: "INSTITUTION", billing_email: "c10@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /vaults"
              payload: { name: "V10", climate_class: "AMBIENT", capacity_slots: 3 }
              as: Registrar
              captures: { vault_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Cold Piece", artist: "C", size_class: "SMALL", fragility_class: "HIGH", climate_class: "COLD" }
              as: Registrar
              captures: { art_id: $.data.id }
          trigger:
            - call: "POST /storage-placements"
              payload: { artwork_id: "${art_id}", vault_id: "${vault_id}", start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CLIMATE_MISMATCH"

      - name: placement_on_maintenance_vault_returns_unavailable
        claim_type: Violation → Error
        grounds: ["validations[priority=19]"]
        distinguishing_aspect: "Placement into a MAINTENANCE vault returns ERR_VAULT_UNAVAILABLE (409)."
        test_recipe:
          setup: ["AMBIENT vault set to MAINTENANCE; AMBIENT artwork"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C11", client_type: "INSTITUTION", billing_email: "c11@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /vaults"
              payload: { name: "V11", climate_class: "AMBIENT", capacity_slots: 3 }
              as: Registrar
              captures: { vault_id: $.data.id }
            - call: "POST /vaults/${vault_id}/state"
              payload: { to_status: "MAINTENANCE" }
              as: Registrar
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Piece", artist: "P", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id }
          trigger:
            - call: "POST /storage-placements"
              payload: { artwork_id: "${art_id}", vault_id: "${vault_id}", start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VAULT_UNAVAILABLE"

      - name: transport_inverted_window_returns_time_window_invalid
        claim_type: Temporal validation
        grounds: ["validations[priority=6]"]
        distinguishing_aspect: "TransportJob with scheduled_end <= scheduled_start returns ERR_TIME_WINDOW_INVALID (422)."
        test_recipe:
          setup: ["client, artwork, crate, crew"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C12", client_type: "DEALER", billing_email: "c12@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "TW", artist: "T", size_class: "MEDIUM", fragility_class: "MEDIUM", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /crates"
              payload: { artwork_id: "${art_id}", crate_type: "HARD", internal_length_cm: 90, internal_width_cm: 60, internal_height_cm: 10 }
              as: Coordinator
              captures: { crate_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew D", crew_size: 2, certification_level: "STANDARD" }
              as: Coordinator
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /transport-jobs"
              payload: { artwork_id: "${art_id}", crate_id: "${crate_id}", crew_id: "${crew_id}", origin_location: "A", destination_location: "B", scheduled_start: "2026-06-01T11:00:00Z", scheduled_end: "2026-06-01T09:00:00Z", requires_rigging: false, estimated_hours: 2 }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TIME_WINDOW_INVALID"

      - name: viewing_confirm_on_closed_room_returns_not_operational
        claim_type: Violation → Error
        grounds: ["validations[priority=18]", state_machines.ViewingRoom.OPERATIONAL_to_CLOSED]
        distinguishing_aspect: "Confirming a booking on a CLOSED room returns ERR_ROOM_NOT_OPERATIONAL (409)."
        test_recipe:
          setup: ["room set CLOSED; SOUND artwork; booking REQUESTED"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C13", client_type: "INSTITUTION", billing_email: "c13@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /viewing-rooms"
              payload: { name: "Salon 3", capacity_persons: 4 }
              as: Coordinator
              captures: { room_id: $.data.id }
            - call: "POST /viewing-rooms/${room_id}/state"
              payload: { to_status: "CLOSED" }
              as: Coordinator
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "View", artist: "V", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /viewing-bookings"
              payload: { artwork_id: "${art_id}", viewing_room_id: "${room_id}", client_id: "${client_id}", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T11:00:00Z" }
              as: Coordinator
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /viewing-bookings/${b_id}/state"
              payload: { to_status: "CONFIRMED" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ROOM_NOT_OPERATIONAL"

      - name: viewing_confirm_overlap_returns_room_unavailable
        claim_type: Temporal validation
        grounds: ["validations[priority=18]"]
        distinguishing_aspect: "Confirming a booking that half-open overlaps an existing CONFIRMED booking on the same room returns ERR_ROOM_UNAVAILABLE (409)."
        test_recipe:
          setup: ["room OPERATIONAL; two SOUND artworks; b1 14:00-15:00 CONFIRMED; b2 14:30-15:30 REQUESTED"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C14", client_type: "INSTITUTION", billing_email: "c14@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /viewing-rooms"
              payload: { name: "Salon 4", capacity_persons: 4 }
              as: Coordinator
              captures: { room_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "V1", artist: "V", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { a1_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "V2", artist: "V", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { a2_id: $.data.id }
            - call: "POST /viewing-bookings"
              payload: { artwork_id: "${a1_id}", viewing_room_id: "${room_id}", client_id: "${client_id}", scheduled_start: "2026-05-02T14:00:00Z", scheduled_end: "2026-05-02T15:00:00Z" }
              as: Coordinator
              captures: { b1_id: $.data.id }
            - call: "POST /viewing-bookings/${b1_id}/state"
              payload: { to_status: "CONFIRMED" }
              as: Coordinator
            - call: "POST /viewing-bookings"
              payload: { artwork_id: "${a2_id}", viewing_room_id: "${room_id}", client_id: "${client_id}", scheduled_start: "2026-05-02T14:30:00Z", scheduled_end: "2026-05-02T15:30:00Z" }
              as: Coordinator
              captures: { b2_id: $.data.id }
          trigger:
            - call: "POST /viewing-bookings/${b2_id}/state"
              payload: { to_status: "CONFIRMED" }
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ROOM_UNAVAILABLE"

      - name: loan_approve_same_user_returns_segregation_of_duties
        claim_type: Priority Ordering
        grounds: ["validations[priority=9]", state_machines.LoanAgreement.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "SoD (priority 9) fires before all business checks: approving with X-User-ID equal to the submitter returns ERR_SEGREGATION_OF_DUTIES even with an unplaced artwork."
        test_recipe:
          setup: ["loan submitted by user u-1; approved by same user u-1"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C15", client_type: "INSTITUTION", billing_email: "c15@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "SoD", artist: "S", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /loans"
              payload: { artwork_id: "${art_id}", client_id: "${client_id}", borrower_name: "B", exhibition_name: "E", loan_start: "2026-06-01T00:00:00Z", loan_end: "2026-07-01T00:00:00Z", is_international: false, required_value_cents: 1000000 }
              as: Registrar
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: Registrar
              as_user_id: "u-1"
          trigger:
            - call: "POST /loans/${loan_id}/state"
              payload: { to_status: "APPROVED" }
              as: Approver
              as_user_id: "u-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "response.http_status == 403"

      - name: loan_approve_insufficient_coverage_when_available
        claim_type: Satisfaction → Pass
