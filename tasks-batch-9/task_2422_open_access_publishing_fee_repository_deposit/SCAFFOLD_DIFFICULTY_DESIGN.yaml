  - rule_id: resource_temporal_overlap
    instances:
      - name: agreement_windows_half_open_adjacency_allowed_overlap_conflicts
        grounds:
          - validations[priority=23]
          - errors[ERR_AGREEMENT_WINDOW_OVERLAP]
          - entities.TransformativeAgreement.fields.effective_from
          - entities.TransformativeAgreement.fields.effective_until
          - concurrency_rules[agreement-create-stale-publisher]
        distinguishing_aspect: |
          Agreement windows are half-open, so a second agreement starting exactly on the
          first's effective_until 2026-10-01 is accepted, while a third spanning
          2026-09-15..2026-11-15 intersects both and is rejected with
          ERR_AGREEMENT_WINDOW_OVERLAP (409); the rejected create leaves Publisher.version
          unchanged.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one publisher with no journals and no agreements"
            - "agreement A1 over [2026-07-01, 2026-10-01), quota 5, discount 0.20, covering HYBRID, still DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
              payload: { name: "Meridian Academic Press", publisher_code: "MERID", country_code: "NL" }
              as: AgreementAdmin
              captures: { p15_id: $.data.id, p15_v0: $.data.version }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${p15_id}", agreement_code: "TA-MERID-H1", effective_from: "2026-07-01", effective_until: "2026-10-01", article_quota: 5, discount_pct: 0.20, covered_oa_models: ["HYBRID"], expected_publisher_version: "${p15_v0}" }
              as: AgreementAdmin
              captures: { ta15a_id: $.data.id }
            - call: "GET /publishers/${p15_id}"
              as: AgreementAdmin
              captures: { p15_v1: $.data.version }
          trigger:
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${p15_id}", agreement_code: "TA-MERID-H2", effective_from: "2026-10-01", effective_until: "2027-01-01", article_quota: 5, discount_pct: 0.20, covered_oa_models: ["HYBRID"], expected_publisher_version: "${p15_v1}" }
              as: AgreementAdmin
              captures: { ta15b_id: $.data.id, ta15b_status: $.data.status }
            - call: "GET /publishers/${p15_id}"
              as: AgreementAdmin
              captures: { p15_v2: $.data.version }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${p15_id}", agreement_code: "TA-MERID-H3", effective_from: "2026-09-15", effective_until: "2026-11-15", article_quota: 5, discount_pct: 0.20, covered_oa_models: ["HYBRID"], expected_publisher_version: "${p15_v2}" }
              as: AgreementAdmin
              captures: { err_overlap: $.data.error_id }
          assert:
            - "${ta15b_id} != null"
            - "${ta15b_status} == DRAFT"
            - "the adjacency create returned HTTP 201"
            - "${err_overlap} == ERR_AGREEMENT_WINDOW_OVERLAP"
            - "the overlapping create returned HTTP 409"
            - "GET /publishers/${p15_id}/transformative-agreements returns exactly 2 rows, agreement_code TA-MERID-H1 and TA-MERID-H2"
            - "Publisher.${p15_id}.version == ${p15_v2}"
            - "Publisher.${p15_id}.active_agreement_count == 0"

      - name: coverage_windows_closed_with_one_day_gap_rule
        grounds:
          - validations[priority=24]
          - errors[ERR_COVERAGE_WINDOW_CONFLICT]
          - entities.AgreementCoverage.fields.covered_from
          - entities.AgreementCoverage.fields.covered_until
          - calculations.apc_coverage_determination
        distinguishing_aspect: |
          Coverage windows are closed and must be separated by more than COVERAGE_GAP_DAYS 1,
          so a second coverage line on the same journal starting 2026-10-01 — exactly the
          first line's covered_until 2026-09-30 plus one day — is rejected with
          ERR_COVERAGE_WINDOW_CONFLICT even though the parent agreements' half-open windows
          are adjacent and legal, and only covered_from 2026-10-02 is accepted.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one publisher with one HYBRID journal at list_apc_cents 380000"
            - "agreement A1 over [2026-07-01, 2026-10-01) carrying a FULL_APC coverage line 2026-07-01..2026-09-30 on that journal"
            - "agreement A2 over [2026-10-01, 2027-01-01) with no coverage line yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
              payload: { name: "Meridian Academic Press", publisher_code: "MERID", country_code: "NL" }
              as: AgreementAdmin
              captures: { p16_id: $.data.id, p16_v0: $.data.version }
            - call: "POST /journals"
              payload: { publisher_id: "${p16_id}", issn: "2041-1723", title: "Meridian Journal of Cell Signalling", oa_model: "HYBRID", list_apc_cents: 380000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { j16_id: $.data.id }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${p16_id}", agreement_code: "TA-MERID-H1", effective_from: "2026-07-01", effective_until: "2026-10-01", article_quota: 5, discount_pct: 0.20, covered_oa_models: ["HYBRID"], expected_publisher_version: "${p16_v0}" }
              as: AgreementAdmin
              captures: { ta16a_id: $.data.id }
            - call: "POST /transformative-agreements/${ta16a_id}/coverages"
              payload: { journal_id: "${j16_id}", coverage_type: "FULL_APC", covered_from: "2026-07-01", covered_until: "2026-09-30" }
              as: AgreementAdmin
              captures: { cov16a_id: $.data.id }
            - call: "GET /publishers/${p16_id}"
              as: AgreementAdmin
              captures: { p16_v1: $.data.version }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${p16_id}", agreement_code: "TA-MERID-H2", effective_from: "2026-10-01", effective_until: "2027-01-01", article_quota: 5, discount_pct: 0.20, covered_oa_models: ["HYBRID"], expected_publisher_version: "${p16_v1}" }
              as: AgreementAdmin
              captures: { ta16b_id: $.data.id }
          trigger:
            - call: "POST /transformative-agreements/${ta16b_id}/coverages"
              payload: { journal_id: "${j16_id}", coverage_type: "CAPPED_APC", capped_amount_cents: 150000, covered_from: "2026-10-01", covered_until: "2026-12-31" }
              as: AgreementAdmin
              captures: { err_gap: $.data.error_id }
            - call: "POST /transformative-agreements/${ta16b_id}/coverages"
              payload: { journal_id: "${j16_id}", coverage_type: "CAPPED_APC", capped_amount_cents: 150000, covered_from: "2026-10-02", covered_until: "2026-12-31" }
              as: AgreementAdmin
              captures: { cov16b_id: $.data.id, cov16b_from: $.data.covered_from, cov16b_type: $.data.coverage_type, cov16b_cap: $.data.capped_amount_cents }
          assert:
            - "${err_gap} == ERR_COVERAGE_WINDOW_CONFLICT"
            - "the 2026-10-01 coverage create returned HTTP 409"
            - "${cov16b_id} != null"
            - "${cov16b_from} == 2026-10-02"
            - "${cov16b_type} == CAPPED_APC"
            - "${cov16b_cap} == 150000"
            - "AgreementCoverage.${cov16b_id}.covered_until == 2026-12-31"
            - "the accepted coverage create returned HTTP 201"
            - "GET /journals/${j16_id}/coverages returns exactly 2 rows"
            - "GET /transformative-agreements/${ta16b_id}/coverages returns exactly 1 row"
            - "AgreementCoverage rows expose no version field (common_fields: false)"

  - rule_id: compensating_invariant
    instances:
      - name: withdrawal_releases_encumbrances_restoring_fund_ledgers
        grounds:
          - state_machines.FundRequest.APPROVED_to_WITHDRAWN
          - calculations.apc_fund_waterfall_allocation
          - calculations.fund_utilisation_by_basis
          - entities.FundAllocation.fields.released_reason
          - entities.APCFund.fields.committed_cents
        distinguishing_aspect: |
          Withdrawing an APPROVED request reverses every allocation side effect exactly: both
          ENCUMBERED lines (200000 on priority 1, 250000 on priority 2) become RELEASED with
          released_reason REQUEST_WITHDRAWN, committed_cents returns to 0 on both funds,
          available_cents returns to 300000 and 1000000, and Author.apc_committed_cents
          returns to 0 with no residual drift.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T00:00:00Z"
            - "publisher with a FULLY_OA journal at list_apc_cents 460000; GOLD_OA funder with apc_allowable true; ACTIVE grant"
            - "author ELIGIBLE_FACULTY with annual cap 500000"
            - "fund OA-DEPT-2027: budget 300000, priority 1, per-article cap 200000, eligible [ELIGIBLE_FACULTY]"
            - "fund OA-CENTRAL-2027: budget 1000000, priority 2, per-article cap 250000, eligible [ELIGIBLE_FACULTY]"
            - "fund OA-GRAD-2027: budget 1000000, priority 3, per-article cap 250000, eligible [ELIGIBLE_GRAD] only — must contribute nothing"
            - "article accepted 2026-08-05 with a FUND_APC determination (eligible_request_cents 460000)"
            - "fund request for 460000 approved, producing two ENCUMBERED allocations totalling 450000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
              payload: { name: "Halden Open Science", publisher_code: "HALDEN", country_code: "NO" }
              as: AgreementAdmin
              captures: { p17_id: $.data.id }
            - call: "POST /journals"
              payload: { publisher_id: "${p17_id}", issn: "2515-0847", title: "Halden Journal of Open Metabolism", oa_model: "FULLY_OA", list_apc_cents: 460000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { j17_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Tomas Berg", email: "tomas.berg@uni.example", orcid: "0000-0001-5109-3700", department_code: "MET", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { au17_id: $.data.id }
            - call: "POST /funders"
              payload: { name: "National Research Council", funder_code: "NRC", mandate_type: "GOLD_OA", max_embargo_months: 6, deposit_deadline_days: 90, license_required: "CC_BY", apc_allowable: true }
              as: AgreementAdmin
              captures: { f17_id: $.data.id }
            - call: "POST /grants"
              payload: { funder_id: "${f17_id}", pi_author_id: "${au17_id}", grant_number: "NRC-2026-601", award_from: "2026-01-01", award_until: "2027-12-31", apc_budget_cents: 900000 }
              as: AgreementAdmin
              captures: { g17_id: $.data.id }
            - call: "POST /apc-funds"
              payload: { fund_code: "OA-DEPT-2027", fiscal_year: 2027, period_from: "2026-07-01", period_to: "2027-06-30", total_budget_cents: 300000, priority_rank: 1, eligible_affiliation_statuses: ["ELIGIBLE_FACULTY"], per_article_cap_cents: 200000 }
              as: FundManager
              captures: { fd17a_id: $.data.id }
            - call: "POST /apc-funds"
              payload: { fund_code: "OA-CENTRAL-2027", fiscal_year: 2027, period_from: "2026-07-01", period_to: "2027-06-30", total_budget_cents: 1000000, priority_rank: 2, eligible_affiliation_statuses: ["ELIGIBLE_FACULTY"], per_article_cap_cents: 250000 }
              as: FundManager
              captures: { fd17b_id: $.data.id }
            - call: "POST /apc-funds"
              payload: { fund_code: "OA-GRAD-2027", fiscal_year: 2027, period_from: "2026-07-01", period_to: "2027-06-30", total_budget_cents: 1000000, priority_rank: 3, eligible_affiliation_statuses: ["ELIGIBLE_GRAD"], per_article_cap_cents: 250000 }
              as: FundManager
              captures: { fd17c_id: $.data.id }
            - call: "POST /articles"
              payload: { journal_id: "${j17_id}", corresponding_author_id: "${au17_id}", grant_id: "${g17_id}", manuscript_title: "Waterfall compensation across two funds", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
              captures: { a17_id: $.data.id }
            - call: "POST /articles/${a17_id}/eligibility-checks"
              payload: { basis: "PROVISIONAL" }
              as: ScholCommLibrarian
              captures: { det17_eligible: $.data.eligible_request_cents }
            - call: "POST /fund-requests"
              payload: { article_id: "${a17_id}", requested_cents: 460000, justification: "Full list APC of a fully OA venue." }
              as: CorrespondingAuthor
              as_user_id: "${au17_id}"
              captures: { fr17_id: $.data.id }
            - call: "POST /fund-requests/${fr17_id}/start-review"
              payload: {}
              as: ScholCommLibrarian
            - call: "POST /fund-requests/${fr17_id}/decision"
              payload: { decision: "APPROVE" }
              as: FundManager
              as_user_id: "fm-approver-01"
              captures: { fr17_approved_pre: $.data.approved_cents, fr17_share_pre: $.data.author_share_cents, fr17_full_pre: $.data.fully_funded, fr17_status_pre: $.data.status }
          trigger:
            - call: "POST /fund-requests/${fr17_id}/withdrawal"
              payload: { reason: "Author secured external payment." }
              as: CorrespondingAuthor
              as_user_id: "${au17_id}"
              captures: { fr17_status_post: $.data.status }
          assert:
            - "${det17_eligible} == 460000"
            - "${fr17_approved_pre} == 450000"
            - "${fr17_share_pre} == 10000"
            - "${fr17_full_pre} == false"
            - "${fr17_status_pre} == APPROVED"
            - "before the withdrawal, GET /fund-requests/${fr17_id}/allocations returned exactly 2 rows: (sequence_index 1, fund_id ${fd17a_id}, amount_cents 200000) and (sequence_index 2, fund_id ${fd17b_id}, amount_cents 250000)"
            - "no FundAllocation row was ever created against fund ${fd17c_id} (affiliation filter excluded it)"
            - "${fr17_status_post} == WITHDRAWN"
            - "GET /fund-requests/${fr17_id}/allocations returns exactly 2 rows, both with status == RELEASED and released_reason == REQUEST_WITHDRAWN"
            - "APCFund.${fd17a_id}.committed_cents == 0"
            - "APCFund.${fd17a_id}.spent_cents == 0"
            - "APCFund.${fd17a_id}.available_cents == 300000"
            - "APCFund.${fd17a_id}.status == OPEN"
            - "APCFund.${fd17b_id}.committed_cents == 0"
            - "APCFund.${fd17b_id}.spent_cents == 0"
            - "APCFund.${fd17b_id}.available_cents == 1000000"
            - "APCFund.${fd17c_id}.committed_cents == 0"
            - "Author.${au17_id}.apc_committed_cents == 0"
            - "Author.${au17_id}.apc_disbursed_cents == 0"
            - "Article.${a17_id}.funding_status == ELIGIBILITY_CHECKED"

      - name: final_determination_returns_agreement_quota_token_to_zero
        grounds:
          - state_machines.TransformativeAgreement.EXHAUSTED_to_ACTIVE
          - calculations.apc_coverage_determination
          - entities.TransformativeAgreement.fields.articles_used
          - entities.EligibilityDetermination.fields.quota_position
          - entities.Publisher.fields.active_agreement_count
        distinguishing_aspect: |
          The compensated resource here is a non-monetary quota token, not a cash ledger: the
          FINAL determination makes the PROVISIONAL TA_FULL row non-effective, so
          articles_used falls 1 -> 0, the agreement's EXHAUSTED -> ACTIVE edge fires, and
          active_agreement_count returns to 1 — while the retained PROVISIONAL row still
          carries quota_position 1 and no FundAllocation or PublisherInvoice row ever exists.
        test_recipe:
          setup:
            - "logical clock at 2026-09-20T00:00:00Z, later advanced to 2026-11-20T00:00:00Z"
            - "publisher MERID with one HYBRID journal at list_apc_cents 380000"
            - "ACTIVE agreement over [2026-07-01, 2026-12-01), article_quota 1, discount 0.25, covering HYBRID"
            - "FULL_APC coverage line 2026-07-01..2026-09-30 on that journal"
            - "article accepted 2026-09-15 whose PROVISIONAL determination is TA_FULL, so articles_used is 1 and the agreement is EXHAUSTED"
            - "no APC fund, no fund request and no invoice exists anywhere in the database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
              payload: { name: "Meridian Academic Press", publisher_code: "MERID", country_code: "NL" }
              as: AgreementAdmin
              captures: { p18_id: $.data.id, p18_v0: $.data.version }
            - call: "POST /journals"
              payload: { publisher_id: "${p18_id}", issn: "2041-1723", title: "Meridian Journal of Cell Signalling", oa_model: "HYBRID", list_apc_cents: 380000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { j18_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Ines Ravel", email: "ines.ravel@uni.example", orcid: "0000-0002-1825-0097", department_code: "BIO", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { au18_id: $.data.id }
            - call: "POST /transformative-agreements"
              payload: { publisher_id: "${p18_id}", agreement_code: "TA-MERID-2027", effective_from: "2026-07-01", effective_until: "2026-12-01", article_quota: 1, discount_pct: 0.25, covered_oa_models: ["HYBRID"], expected_publisher_version: "${p18_v0}" }
              as: AgreementAdmin
              captures: { ta18_id: $.data.id }
            - call: "POST /transformative-agreements/${ta18_id}/coverages"
              payload: { journal_id: "${j18_id}", coverage_type: "FULL_APC", covered_from: "2026-07-01", covered_until: "2026-09-30" }
              as: AgreementAdmin
            - call: "POST /transformative-agreements/${ta18_id}/activation"
              payload: {}
              as: AgreementAdmin
            - call: "POST /articles"
              payload: { journal_id: "${j18_id}", corresponding_author_id: "${au18_id}", manuscript_title: "Quota tokens are returned, not spent", accepted_on: "2026-09-15" }
              as: ScholCommLibrarian
              captures: { a18_id: $.data.id }
            - call: "POST /articles/${a18_id}/eligibility-checks"
              payload: { basis: "PROVISIONAL" }
              as: ScholCommLibrarian
              captures: { det18_id: $.data.id, det18_route: $.data.route, det18_quota_pos: $.data.quota_position }
            - call: "GET /transformative-agreements/${ta18_id}"
              as: AgreementAdmin
              captures: { ta18_used_pre: $.data.articles_used, ta18_status_pre: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-20T00:00:00Z" }
              as: ScholCommLibrarian
          trigger:
            - call: "POST /articles/${a18_id}/publication"
              payload: { publication_date: "2026-11-20" }
              as: ScholCommLibrarian
              captures: { a18_route_final: $.data.eligibility_route, a18_det_count: $.data.determination_count }
          assert:
            - "${det18_route} == TA_FULL"
            - "${det18_quota_pos} == 1"
            - "${ta18_used_pre} == 1"
            - "${ta18_status_pre} == EXHAUSTED"
            - "${a18_route_final} == AUTHOR_PAYS"
            - "${a18_det_count} == 2"
            - "TransformativeAgreement.${ta18_id}.articles_used == 0"
            - "TransformativeAgreement.${ta18_id}.status == ACTIVE"
            - "Publisher.${p18_id}.active_agreement_count == 1"
            - "GET /eligibility-determinations?agreement_id=${ta18_id} returns exactly 1 row (the retained PROVISIONAL row ${det18_id}) with quota_position == 1, and articles_used == 0 reconciles with the count of EFFECTIVE TA-route determinations, which is 0"
            - "EligibilityDetermination.${det18_id}.route == TA_FULL (the compensating path never rewrites or deletes the superseded row)"
            - "GET /publisher-invoices returns exactly 0 rows"
            - "Author.${au18_id}.apc_committed_cents == 0"
            - "Author.${au18_id}.apc_disbursed_cents == 0"
