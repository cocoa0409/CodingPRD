      - name: no_user_may_adjudicate_its_own_submission
        claim_type: segregation_of_duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - validations[priority=8].ERR_SEGREGATION_OF_DUTIES
          - state_machines.CategoryPlan.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Roles are headers and identity is opaque, so one human can hold two roles: the check must compare X-User-ID against the recorded originator, not the role. The same user id dual-1 legitimately submits as MerchandisePlanner and is then refused BOTH approve and reject as PlanningDirector, while a different director sails through the identical call. The rule is recorded per step, not per plan: after director-1 rejects and dual-1 re-submits, dual-1 is still blocked, and the independently recorded ChaseCancelDecision.proposed_by_user_id blocks a different user id on the decision endpoints. A role-only check, or a check against plan.approved_by_user_id, fails."
        test_recipe:
          setup:
            - "a SUBMITTED plan whose submitted_by_user_id is dual-1, later opened for season with one IN_SEASON item and an OPEN reforecast cycle"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
              as: MerchOpsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /otb/categories"
              payload: { department_id: "${dept_id}", name: "Dresses", code: "DRSS", role: "DESTINATION", sales_share_bps: 3000 }
              as: MerchOpsAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /otb/store-clusters"
              payload: { name: "Metro A", climate_zone: "TEMPERATE", demographic_index_bps: 10500, volume_tier: "A", store_count: 40, sales_index_bps: 11500 }
              as: MerchOpsAdmin
              captures: { cluster_id: $.data.id }
            - call: "POST /otb/vendors"
              payload: { name: "Atlas Apparel", code: "ATLS", lead_time_days: 45, weekly_unit_capacity: 12000, min_order_units: 100, cancel_cutoff_days: 14 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /otb/category-plans"
              payload: { category_id: "${cat_id}", season_code: "SPRING", fiscal_year: 2027, planned_sales_cents: 150000000, planned_margin_bps: 5500, planned_turn_x100: 320 }
              as: MerchandisePlanner
              as_user_id: "dual-1"
              captures: { plan_id: $.data.id }
            - call: "POST /otb/plan-months"
              payload: { category_plan_id: "${plan_id}", month_index: 1, fiscal_month_label: "2027-03", first_receipt_date: "2027-03-05T00:00:00Z", bom_inventory_cents: 20000000, planned_sales_cents: 30000000, planned_markdown_cents: 2000000, planned_eom_cents: 22000000 }
              as: MerchandisePlanner
              as_user_id: "dual-1"
              captures: { m1_id: $.data.id }
            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "BETTER", breadth_target: 14, depth_units_per_option: 6, assumed_unit_cost_cents: 2400 }
              as: MerchandisePlanner
              as_user_id: "dual-1"
              captures: { op_id: $.data.id }
            - call: "PUT /otb/option-plans/${op_id}/size-curve"
              payload: { cells: [ { size_label: "S", size_sort_order: 1, pct_bps: 4000 }, { size_label: "L", size_sort_order: 2, pct_bps: 6000 } ] }
              as: MerchandisePlanner
              as_user_id: "dual-1"
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op_id}", vendor_id: "${vendor_id}", sku_code: "DR-9601", color_code: "BLK", lifecycle_stage: "CARRYOVER", unit_cost_cents: 2600, retail_price_cents: 7900, prior_season_sell_through_bps: 7100 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
