            - call: "GET /pip/plans/${plan_id}/cost-summary"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
              captures: { pct: $.data.variance_pct }
          assert:
            - "ScopeDispute.${dispute_id}.status == FILED and PipPlan.${plan_id}.dispute_state == DISPUTE_OPEN"
            - "PipItem.${item_id}.owner_claimed_cost_cents == 1200000 and approved_cost_cents == 1000000 (still the brand figure while the dispute is open)"
            - "PipPlan.${plan_id}.owner_claimed_total_cents == 1200000 and brand_scoped_total_cents == 1000000"
            - "the cost summary reports variance_cents == 200000, included_item_count == 1 and ${pct} == 16.67 (from 16.666..., never 16.66 or 16.7)"
            - "the cost summary reports funding_requirement_cents == 1182500 and contingency_pct_applied == 0.10 (funding still tracks the approved figure)"
            - "the cost summary reports authorized_cents == 0, funding_gap_cents == 0 and funding_gap_pct == 0.00 while no budget exists"

