            - "The second amendment left RequestForPayment.${rfp_id}.status == DELIVERED with amendment_round == 2 and amount_cents == 4000000"
            - "The trigger returns HTTP 422 with error_id == ERR_AMENDMENT_ROUNDS_EXHAUSTED"
            - "RequestForPayment.${rfp_id}.status == AMENDMENT_REQUESTED after the refused third amendment"
            - "RequestForPayment.${rfp_id}.amount_cents == 4000000 (unchanged by the refused amendment)"
            - "RequestForPayment.${rfp_id}.amendment_round == 2"
            - "RequestForPayment.${rfp_id}.expiry_at == 2026-08-04T13:00:00Z (never extended by any amendment)"

