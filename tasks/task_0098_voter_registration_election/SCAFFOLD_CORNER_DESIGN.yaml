  # ===========================================================================
  - section: errors
    instances:
      - name: error_not_citizen_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOT_CITIZEN]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / not_citizen_beats_precinct_full
          rationale: "ERR_NOT_CITIZEN is asserted as the winning error of the named §1.8 priority-conflict instance."

      - name: error_segregation_of_duties_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / invalid_state_beats_segregation_on_recount_pass
          rationale: "The segregation pair is exercised there; the standalone ERR_SEGREGATION_OF_DUTIES path (non-terminal recount, same canvasser) is the same claim with the state precondition removed and is covered by that instance's design."

      - name: error_precinct_full_standalone
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRECINCT_FULL]", "validations[priority=18]"]
        distinguishing_aspect: "Approving a citizen-eligible registration whose only matching precinct is FULL (max_registrations=1 already filled) -> ERR_PRECINCT_FULL (409)."
        test_recipe:
          setup: ["A precinct max_registrations=1 already filled; a second citizen-eligible PENDING registration matching it."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ElectionAdmin
            - call: "POST /elections"
              payload: { name: "Gen26", election_date: "2026-11-03T20:00:00Z", registration_deadline: "2026-10-01T00:00:00Z", absentee_request_deadline: "2026-10-20T00:00:00Z", cure_deadline: "2026-11-10T00:00:00Z", early_voting_start: "2026-10-15T00:00:00Z", early_voting_end: "2026-11-02T00:00:00Z" }
              as: ElectionAdmin
              captures: { e_id: $.data.id }
            - call: "POST /elections/${e_id}/transition"
              payload: { target_status: "REGISTRATION_OPEN" }
              as: ElectionAdmin
            - call: "POST /precincts"
              payload: { election_id: "${e_id}", code: "P1", county_fips: "06075", street_low: 1, street_high: 999, max_registrations: 1 }
              as: ElectionAdmin
              captures: { p_id: $.data.id }
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "A", last_name: "A", national_id: "N1", is_citizen: true, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 10 }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r1_id: $.data.id }
            - call: "POST /registrations/${r1_id}/approve"
              payload: {}
              as: ElectionOfficial
              as_user_id: "off-1"
            - call: "POST /registrations"
              payload: { election_id: "${e_id}", first_name: "B", last_name: "B", national_id: "N2", is_citizen: true, date_of_birth: "1990-01-01T00:00:00Z", county_fips: "06075", street_number: 20 }
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /registrations/${r2_id}/approve"
              payload: {}
              as: ElectionOfficial
              as_user_id: "off-1"
              captures: { eid: $.data.error_id }
          assert:
            - "response.error_id == ERR_PRECINCT_FULL"
            - "VoterRegistration.${r2_id}.status == PENDING"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_precinct_count_after_approve
        claim_type: immediate
