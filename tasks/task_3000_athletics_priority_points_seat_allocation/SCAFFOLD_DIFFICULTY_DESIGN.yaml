  - rule_id: transitive_cascade
    instances:
      - name: certify_recalculation_cascades_rank_slot_event_relocation
        grounds:
          - state_machines.SelectionSlot.SCHEDULED_to_STALE
          - state_machines.SelectionEvent.SLOTS_PUBLISHED_to_SLOTS_STALE
          - state_machines.RelocationRequest.AWAITING_SELECTION_to_BLOCKED
          - calculations.donor_rank_position
          - entities.Donor.fields.pending_request_count
        distinguishing_aspect: |
          One certify call propagates four levels deep across four entity types:
          Donor.rank_position is rewritten, every SCHEDULED slot whose
          rank_at_publish no longer matches goes STALE, the event whose last
          SCHEDULED slot vanished goes SLOTS_STALE, and the relocation request
          hanging off that event goes BLOCKED with the filing donor's
          pending_request_count decremented back to 0. The certify request never
          names the slot, the event or the request.
        test_recipe:
          setup:
            - "Section SEC-E with seat_capacity 4, per_seat_requirement_cents 100,000, required_points_per_seat 0 and seats E/1, E/2, E/3."
            - "Donor A is created before donor B. A has one RECEIVED 5,000,000-cent 2026 gift; B has none, so after the 2026 cycle A ranks 1 with 67.50 points and B ranks 2 with 0.00."
            - "Recalculation R2026 is CERTIFIED. Event E1 over 2026-09-01 to 2026-09-05 was OPEN; A consumed slot 0, took seat E/1, and paid the 100,000-cent requirement in full. E1 has been gated CLOSED."
            - "Event E2 over 2026-09-06 to 2026-09-12 is SLOTS_PUBLISHED (never gated OPEN) with two SCHEDULED slots: A at rank_at_publish 1 and B at rank_at_publish 2."
            - "A has filed one UPGRADE RelocationRequest against E2, so A.pending_request_count is 1."
            - "B then receives a RECEIVED 10,000,000-cent 2027 gift and recalculation R2027 has been run and communicated but not certified."
