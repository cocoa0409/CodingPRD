scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — dual_variant_calc
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: operation_production_design_vs_records_basis
        grounds:
          - calculations.operation_manure_production
          - entities.Operation.fields.design_annual_manure_gallons
          - entities.Operation.fields.recorded_annual_manure_gallons
          - endpoints.GET /cafo/operations/{id}/nutrient-summary
        distinguishing_aspect: |
          The two variants of operation_manure_production are read off the SAME Operation row in the
          SAME request pair and disagree by construction: DESIGN_BASIS is a herd-and-geometry estimate
          (3374298.00 gal) that ignores every persisted record, while RECORDS_BASIS is the sum of
          persisted application and transfer volumes for the clock year (300000.00 gal).
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation, DAIRY_COW, 300 head, LIQUID, 40000 sqft open lot, CONTINUOUS discharge, conservation plan on file"
            - "One EARTHEN_LAGOON structure of 60000 sqft surface, 144 in depth, 24 in required freeboard, IN_SERVICE"
            - "One GENERAL permit effective 2026-01-01, coverage_status COVERED"
            - "One APPROVED nutrient plan for 2026 with one ACTIVE FieldNutrientBudget on field North 40"
            - "1000000 gallons taken into the lagoon and exactly one RECORDED application event of 300000 gallons on 2026-07-20"
            - "Logical clock at its default 2026-08-01T00:00:00Z, so the clock calendar year is 2026"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/manure-storages"
              payload: { operation_id: "${op_id}", structure_name: "Lagoon 1", structure_type: "EARTHEN_LAGOON", surface_area_sqft: 60000, total_depth_in: 144, required_freeboard_in: 24 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { st_id: $.data.id }
            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2026-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /cafo/permits/${pm_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/permits/${pm_id}/issue-coverage"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cafo/fields"
              payload: { operation_id: "${op_id}", field_name: "North 40", total_acres: 42.5, distance_to_water_ft: 150, has_tile_inlet: false, slope_pct: 4.0, water_frontage_ft: 900 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { fld_id: $.data.id }
            - call: "POST /cafo/soil-tests"
              payload: { field_id: "${fld_id}", sampled_on: "2026-03-15T00:00:00Z", lab_name: "AgriLab", soil_test_p_ppm: 42, soil_test_k_ppm: 160, organic_matter_pct: 3.4 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { soil_id: $.data.id }
            - call: "GET /cafo/operations/${op_id}"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_v: $.data.version }
            - call: "POST /cafo/nutrient-plans"
              payload: { operation_id: "${op_id}", permit_id: "${pm_id}", plan_year: 2026, allowed_application_methods: ["INJECTION", "INCORPORATED_24H"], winter_application_allowed: false, expected_operation_version: "${op_v}" }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { pl_id: $.data.id }
            - call: "POST /cafo/field-budgets"
              payload: { plan_id: "${pl_id}", field_id: "${fld_id}", soil_test_id: "${soil_id}", crop: "CORN_GRAIN", yield_goal: 190, previous_crop: "SOYBEAN", planned_application_method: "INJECTION" }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { bd_id: $.data.id }
            - call: "POST /cafo/nutrient-plans/${pl_id}/certify"
              payload: {}
              as: CertifiedPlanner
              as_user_id: "planner-1"
            - call: "POST /cafo/nutrient-plans/${pl_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/nutrient-plans/${pl_id}/approve"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cafo/manure-storages/${st_id}/intake"
              payload: { gallons: 1000000 }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/application-events"
              payload: { plan_id: "${pl_id}", budget_id: "${bd_id}", storage_id: "${st_id}", applied_on: "2026-07-20T00:00:00Z", gallons_applied: 300000, acres_treated: 30, application_method: "INJECTION", setback_maintained_ft: 60, soil_condition: "DRY", precipitation_forecast_in_24h: 0.0, applicator_name: "J. Kroeger" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "GET /cafo/operations/${op_id}/nutrient-summary"
              payload: { basis: "DESIGN_BASIS", year: 2026 }
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "GET /cafo/operations/${op_id}/nutrient-summary"
              payload: { basis: "RECORDS_BASIS", year: 2026 }
              as: StateReviewer
              as_user_id: "reviewer-1"
          assert:
            - "first trigger response data.basis == DESIGN_BASIS and data.design_annual_manure_gallons == 3374298.00"
            - "second trigger response data.basis == RECORDS_BASIS and data.recorded_annual_manure_gallons == 300000.00"
            - "both trigger responses carry the same data.design_annual_manure_gallons == 3374298.00 and the same data.recorded_annual_manure_gallons == 300000.00, so the two variants differ by 3074298.00 gallons on identical stored data"
            - "data.recorded_land_applied_gallons == 300000.00 and data.recorded_transferred_gallons == 0.00"
            - "data.total_n_applied_lbs == 4680.00 and data.total_p2o5_applied_lbs == 3000.00"
            - "data.design_storage_days == 485 and data.compliance_posture == OPEN"
            - "Operation.${op_id}.design_annual_manure_gallons == 3374298.00 and Operation.${op_id}.daily_production_gallons == 9244.65"
            - "Operation.${op_id}.recorded_annual_manure_gallons == 300000.00"
      - name: storage_days_available_vs_design_basis
        grounds:
          - calculations.storage_days_of_capacity
          - entities.ManureStorage.fields.days_of_storage_available
          - entities.Operation.fields.design_storage_days
          - endpoints.GET /cafo/manure-storages/{id}/capacity-projection
        distinguishing_aspect: |
          Unlike the production instance, this pair diverges because of stored CONTENTS rather than
          record history: AVAILABLE_BASIS divides remaining headroom (3488300.00 gal after a 1000000 gal
          intake) by the seasonal daily rate and yields 377 days, while DESIGN_BASIS divides the full
          operating capacity (4488300.00 gal) and yields 485 days on the identical structure row.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation with daily_production_gallons 9244.65"
            - "One EARTHEN_LAGOON of 60000 sqft surface, 144 in depth, 24 in required freeboard, storage_status IN_SERVICE"
            - "1000000 gallons of intake recorded, no applications, no transfers"
            - "Logical clock at its default 2026-08-01T00:00:00Z, so the month is 8 and the winter seasonal factor does NOT apply"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/manure-storages"
              payload: { operation_id: "${op_id}", structure_name: "Lagoon 1", structure_type: "EARTHEN_LAGOON", surface_area_sqft: 60000, total_depth_in: 144, required_freeboard_in: 24 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { st_id: $.data.id }
            - call: "POST /cafo/manure-storages/${st_id}/intake"
              payload: { gallons: 1000000 }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "GET /cafo/manure-storages/${st_id}/capacity-projection"
              payload: { basis: "AVAILABLE_BASIS" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "GET /cafo/manure-storages/${st_id}/capacity-projection"
              payload: { basis: "DESIGN_BASIS" }
              as: Operator
              as_user_id: "${op_id}"
          assert:
            - "first trigger response data.basis == AVAILABLE_BASIS, data.available_capacity_gallons == 3488300.00 and data.days_of_storage == 377"
            - "second trigger response data.basis == DESIGN_BASIS, data.operating_capacity_gallons == 4488300.00 and data.days_of_storage == 485"
            - "both trigger responses report data.seasonal_factor == 1.0 and data.effective_daily_gallons == 9244.65"
            - "both trigger responses report data.min_storage_days_met == true"
            - "ManureStorage.${st_id}.days_of_storage_available == 377 and Operation.${op_id}.design_storage_days == 485"
            - "ManureStorage.${st_id}.current_volume_gallons == 1000000.00 and ManureStorage.${st_id}.operating_capacity_gallons == 4488300.00"

  # =====================================================================
  # Rule 2 — combinatorial_formula
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: budget_rate_binding_basis_switches_with_p_index_tier
        grounds:
          - calculations.budget_allowable_rate
          - calculations.soil_test_p_index
          - entities.FieldNutrientBudget.fields.binding_basis
          - entities.FieldNutrientBudget.fields.allowable_total_gallons
        distinguishing_aspect: |
          Mode (a) — the SELECTOR changes which of two computed limits is authoritative: the same field,
          crop, yield goal and application method produce binding_basis NITROGEN (rate 10800) under a
          MEDIUM p_index_category and binding_basis PHOSPHORUS (rate 7000) under HIGH, because the
          P_INDEX_MULTIPLIER selected by the soil test's tier rescales only the phosphorus branch.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation, DAIRY_COW herd, so the manure analysis group is DAIRY"
            - "One field North 40 with 42.5 total acres, 150 ft to water, no tile inlet, 4.0 pct slope, 900 ft frontage, so net_applicable_acres is 38.37"
            - "Two soil tests on that field: 42 ppm P (p_index 43.68, MEDIUM) and 62 ppm P (p_index 64.48, HIGH)"
            - "One DRAFT nutrient plan for 2026 allowing INJECTION"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2026-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /cafo/fields"
              payload: { operation_id: "${op_id}", field_name: "North 40", total_acres: 42.5, distance_to_water_ft: 150, has_tile_inlet: false, slope_pct: 4.0, water_frontage_ft: 900 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { fld_id: $.data.id }
            - call: "POST /cafo/soil-tests"
              payload: { field_id: "${fld_id}", sampled_on: "2026-03-15T00:00:00Z", lab_name: "AgriLab", soil_test_p_ppm: 42, soil_test_k_ppm: 160, organic_matter_pct: 3.4 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { soil_med_id: $.data.id }
            - call: "POST /cafo/soil-tests"
              payload: { field_id: "${fld_id}", sampled_on: "2026-03-16T00:00:00Z", lab_name: "AgriLab", soil_test_p_ppm: 62, soil_test_k_ppm: 160, organic_matter_pct: 3.4 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { soil_high_id: $.data.id }
            - call: "GET /cafo/operations/${op_id}"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_v: $.data.version }
            - call: "POST /cafo/nutrient-plans"
              payload: { operation_id: "${op_id}", permit_id: "${pm_id}", plan_year: 2026, allowed_application_methods: ["INJECTION", "INCORPORATED_24H"], winter_application_allowed: false, expected_operation_version: "${op_v}" }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { pl_id: $.data.id }
          trigger:
            - call: "POST /cafo/field-budgets"
              payload: { plan_id: "${pl_id}", field_id: "${fld_id}", soil_test_id: "${soil_med_id}", crop: "CORN_GRAIN", yield_goal: 190, previous_crop: "SOYBEAN", planned_application_method: "INJECTION" }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { bd_med_id: $.data.id }
            - call: "POST /cafo/field-budgets"
              payload: { plan_id: "${pl_id}", field_id: "${fld_id}", soil_test_id: "${soil_high_id}", crop: "CORN_GRAIN", yield_goal: 190, previous_crop: "SOYBEAN", planned_application_method: "INJECTION" }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { bd_high_id: $.data.id }
          assert:
            - "SoilTest.${soil_med_id}.p_index == 43.68 and SoilTest.${soil_med_id}.p_index_category == MEDIUM"
            - "SoilTest.${soil_high_id}.p_index == 64.48 and SoilTest.${soil_high_id}.p_index_category == HIGH"
            - "FieldNutrientBudget.${bd_med_id}.crop_n_need_lbs == 209.00 and FieldNutrientBudget.${bd_med_id}.legume_credit_lbs == 40 and FieldNutrientBudget.${bd_med_id}.adjusted_n_need_lbs == 169.00"
            - "FieldNutrientBudget.${bd_med_id}.crop_p_removal_lbs == 70.30 and FieldNutrientBudget.${bd_med_id}.p_allowance_lbs == 140.60"
            - "FieldNutrientBudget.${bd_med_id}.allowable_n_rate_gal_per_acre == 10800 and FieldNutrientBudget.${bd_med_id}.allowable_p_rate_gal_per_acre == 14000"
            - "FieldNutrientBudget.${bd_med_id}.binding_basis == NITROGEN and FieldNutrientBudget.${bd_med_id}.allowable_rate_gal_per_acre == 10800"
            - "FieldNutrientBudget.${bd_med_id}.allowable_total_gallons == 414396 and FieldNutrientBudget.${bd_med_id}.remaining_gallons == 414396"
            - "FieldNutrientBudget.${bd_high_id}.p_allowance_lbs == 70.30 and FieldNutrientBudget.${bd_high_id}.allowable_p_rate_gal_per_acre == 7000"
            - "FieldNutrientBudget.${bd_high_id}.allowable_n_rate_gal_per_acre == 10800 and FieldNutrientBudget.${bd_high_id}.binding_basis == PHOSPHORUS"
            - "FieldNutrientBudget.${bd_high_id}.allowable_rate_gal_per_acre == 7000 and FieldNutrientBudget.${bd_high_id}.allowable_total_gallons == 268590"
            - "Field.${fld_id}.required_setback_ft == 200, Field.${fld_id}.excluded_acres == 4.13 and Field.${fld_id}.net_applicable_acres == 38.37"
            - "both budgets are created with budget_status == LOCKED because the plan is not APPROVED"
      - name: application_nutrient_round_per_event_then_sum
        grounds:
          - calculations.application_event_nutrient_load
          - calculations.annual_report_mass_balance
          - entities.LandApplicationEvent.fields.n_applied_lbs
          - entities.AnnualReport.fields.total_n_applied_lbs
        distinguishing_aspect: |
          Mode (b) — the ORDER of rounding versus aggregation changes the answer: three identical
          1503-gallon INJECTION events each round to 23.45 lbs N, so the round-then-sum roll-up the
          scaffold pins is 70.35 lbs, whereas summing the raw products first and rounding once yields
          70.34 lbs; the assertion discriminates the two orderings on the same three rows.
        test_recipe:
          setup:
            - "Canonical Willow Creek Dairy operation with a COVERED permit, an APPROVED 2026 plan and one ACTIVE budget on North 40 whose allowable_rate_gal_per_acre is 10800 and remaining_gallons 414396"
            - "1000000 gallons of lagoon intake available for outflow"
            - "Three RECORDED application events of 1503 gallons on 1.0 acre each, on 2026-04-01, 2026-05-01 and 2026-06-01, all INJECTION, all at least 21 days apart"
            - "Logical clock at its default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/manure-storages"
              payload: { operation_id: "${op_id}", structure_name: "Lagoon 1", structure_type: "EARTHEN_LAGOON", surface_area_sqft: 60000, total_depth_in: 144, required_freeboard_in: 24 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { st_id: $.data.id }
            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2026-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /cafo/permits/${pm_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/permits/${pm_id}/issue-coverage"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cafo/fields"
              payload: { operation_id: "${op_id}", field_name: "North 40", total_acres: 42.5, distance_to_water_ft: 150, has_tile_inlet: false, slope_pct: 4.0, water_frontage_ft: 900 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { fld_id: $.data.id }
            - call: "POST /cafo/soil-tests"
              payload: { field_id: "${fld_id}", sampled_on: "2026-03-15T00:00:00Z", lab_name: "AgriLab", soil_test_p_ppm: 42, soil_test_k_ppm: 160, organic_matter_pct: 3.4 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { soil_id: $.data.id }
            - call: "GET /cafo/operations/${op_id}"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_v: $.data.version }
            - call: "POST /cafo/nutrient-plans"
              payload: { operation_id: "${op_id}", permit_id: "${pm_id}", plan_year: 2026, allowed_application_methods: ["INJECTION", "INCORPORATED_24H"], winter_application_allowed: false, expected_operation_version: "${op_v}" }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { pl_id: $.data.id }
            - call: "POST /cafo/field-budgets"
              payload: { plan_id: "${pl_id}", field_id: "${fld_id}", soil_test_id: "${soil_id}", crop: "CORN_GRAIN", yield_goal: 190, previous_crop: "SOYBEAN", planned_application_method: "INJECTION" }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { bd_id: $.data.id }
            - call: "POST /cafo/nutrient-plans/${pl_id}/certify"
              payload: {}
              as: CertifiedPlanner
              as_user_id: "planner-1"
            - call: "POST /cafo/nutrient-plans/${pl_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/nutrient-plans/${pl_id}/approve"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cafo/manure-storages/${st_id}/intake"
              payload: { gallons: 1000000 }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /cafo/application-events"
              payload: { plan_id: "${pl_id}", budget_id: "${bd_id}", storage_id: "${st_id}", applied_on: "2026-04-01T00:00:00Z", gallons_applied: 1503, acres_treated: 1.0, application_method: "INJECTION", setback_maintained_ft: 60, soil_condition: "DRY", precipitation_forecast_in_24h: 0.0, applicator_name: "J. Kroeger" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { ev1_id: $.data.id }
            - call: "POST /cafo/application-events"
              payload: { plan_id: "${pl_id}", budget_id: "${bd_id}", storage_id: "${st_id}", applied_on: "2026-05-01T00:00:00Z", gallons_applied: 1503, acres_treated: 1.0, application_method: "INJECTION", setback_maintained_ft: 60, soil_condition: "DRY", precipitation_forecast_in_24h: 0.0, applicator_name: "J. Kroeger" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { ev2_id: $.data.id }
            - call: "POST /cafo/application-events"
              payload: { plan_id: "${pl_id}", budget_id: "${bd_id}", storage_id: "${st_id}", applied_on: "2026-06-01T00:00:00Z", gallons_applied: 1503, acres_treated: 1.0, application_method: "INJECTION", setback_maintained_ft: 60, soil_condition: "DRY", precipitation_forecast_in_24h: 0.0, applicator_name: "J. Kroeger" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { ev3_id: $.data.id }
            - call: "POST /cafo/annual-reports"
              payload: { operation_id: "${op_id}", plan_id: "${pl_id}", report_year: 2026, beginning_storage_gallons: 1000000, ending_storage_gallons: 4374298 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rp_id: $.data.id }
          assert:
            - "LandApplicationEvent.${ev1_id}.rate_gal_per_acre == 1503.00, n_applied_lbs == 23.45 and p2o5_applied_lbs == 15.03"
            - "LandApplicationEvent.${ev2_id}.n_applied_lbs == 23.45 and LandApplicationEvent.${ev3_id}.n_applied_lbs == 23.45"
            - "AnnualReport.${rp_id}.total_n_applied_lbs == 70.35 (round-then-sum), NOT 70.34 (sum-then-round)"
            - "AnnualReport.${rp_id}.total_p2o5_applied_lbs == 45.09"
            - "AnnualReport.${rp_id}.recorded_land_applied_gallons == 4509.00 and recorded_transferred_gallons == 0.00"
            - "AnnualReport.${rp_id}.recorded_total_gallons == 3378807.00 and mass_balance_expected_gallons == 3374298.00"
            - "AnnualReport.${rp_id}.variance_pct == 0.13 and variance_classification == WITHIN_TOLERANCE"
            - "AnnualReport.${rp_id}.report_status == DRAFT"
            - "FieldNutrientBudget.${bd_id}.applied_gallons_to_date == 4509.00 and remaining_gallons == 409887"
      - name: permit_renewal_fee_tier_on_gross_surcharge_on_net
        grounds:
          - calculations.permit_renewal_fee
          - state_machines.Permit.COVERED_to_RENEWAL_PENDING
          - entities.Permit.fields.total_due
          - entities.Permit.fields.is_late_renewal
        distinguishing_aspect: |
          Mode (c) — the two multipliers apply to DIFFERENT bases in a fixed order: the conservation
          discount tier is selected on gross_fee (589.00 -> 5 pct -> 29.45) while the late surcharge is
          taken on net_fee (559.55 -> 139.89), so total_due is 699.44; computing the surcharge on
          gross_fee instead would give 147.25 and a total of 706.80.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation, 420.0 animal units, size_class MEDIUM, has_conservation_plan true"
            - "One GENERAL permit effective 2026-01-01 with coverage_status COVERED, expiration_on 2031-01-01, renewal_window_opens_on 2030-07-05 and renewal_due_on 2030-10-03"
            - "Logical clock advanced to 2030-10-10T00:00:00Z, which is inside the renewal window but after renewal_due_on"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2026-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /cafo/permits/${pm_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/permits/${pm_id}/issue-coverage"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cafo/_clock/set_current_utc"
              payload: { to_iso8601: "2030-10-10T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /cafo/permits/${pm_id}/initiate-renewal"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
          assert:
            - "Permit.${pm_id}.expiration_on == 2031-01-01T00:00:00Z, renewal_window_opens_on == 2030-07-05T00:00:00Z and renewal_due_on == 2030-10-03T00:00:00Z"
            - "Permit.${pm_id}.coverage_status == RENEWAL_PENDING and compliance_status == IN_GOOD_STANDING"
            - "Permit.${pm_id}.gross_fee == 589.00 and conservation_discount_pct == 0.05"
            - "Permit.${pm_id}.conservation_discount_amount == 29.45 and net_fee == 559.55"
            - "Permit.${pm_id}.is_late_renewal == true and late_surcharge_amount == 139.89"
            - "Permit.${pm_id}.total_due == 699.44, NOT 706.80 (surcharge taken on gross_fee) and NOT 559.55 (surcharge omitted)"
            - "Permit.${pm_id}.renewal_submitted_at == 2030-10-10T00:00:00Z"

  # =====================================================================
  # Rule 3 — non_linear_state_machine
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_parallel_dimensions_advance_independently
        grounds:
          - state_machines.Permit.IN_GOOD_STANDING_to_NOTICE_ISSUED
          - state_machines.Permit.NOTICE_ISSUED_to_CORRECTIVE_ACTION
          - state_machines.Permit.COVERED_to_RENEWAL_PENDING
          - entities.Permit.fields.coverage_status
          - entities.Permit.fields.compliance_status
        distinguishing_aspect: |
          PARALLEL shape on the Permit row: two independent dimensions move on one entity, and the
          combined state (RENEWAL_PENDING, CORRECTIVE_ACTION) is reachable only because a coverage
          transition never writes compliance_status and a compliance transition never writes
          coverage_status.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation, MEDIUM size class, conservation plan on file"
            - "One GENERAL permit effective 2026-01-01 with coverage_status COVERED and compliance_status IN_GOOD_STANDING"
            - "One ROUTINE inspection scheduled 2026-07-15 and already CONDUCTED with findings_count 2"
            - "Logical clock at its default 2026-08-01T00:00:00Z until the renewal step"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/permits"
              payload: { operation_id: "${op_id}", permit_type: "GENERAL", effective_on: "2026-01-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /cafo/permits/${pm_id}/submit"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/permits/${pm_id}/issue-coverage"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cafo/inspections"
              payload: { operation_id: "${op_id}", permit_id: "${pm_id}", scheduled_on: "2026-07-15T00:00:00Z", inspection_kind: "ROUTINE" }
              as: StateReviewer
              as_user_id: "reviewer-1"
              captures: { ins_id: $.data.id }
            - call: "POST /cafo/inspections/${ins_id}/conduct"
              payload: { findings_count: 2, deficiency_categories: ["RECORDKEEPING", "FREEBOARD"] }
              as: StateReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /cafo/inspections/${ins_id}/issue-nov"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cafo/inspections/${ins_id}/submit-response"
              payload: { corrective_action_summary: "Berm repaired and records reconstructed" }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /cafo/_clock/set_current_utc"
              payload: { to_iso8601: "2030-08-01T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /cafo/permits/${pm_id}/initiate-renewal"
              payload: {}
              as: Operator
              as_user_id: "${op_id}"
          assert:
            - "after the first trigger call Permit.${pm_id}.compliance_status == NOTICE_ISSUED while coverage_status is still COVERED"
            - "after the second trigger call Permit.${pm_id}.compliance_status == CORRECTIVE_ACTION while coverage_status is still COVERED"
            - "after the fourth trigger call Permit.${pm_id}.coverage_status == RENEWAL_PENDING and compliance_status is STILL CORRECTIVE_ACTION"
            - "Permit.${pm_id}.is_late_renewal == false and late_surcharge_amount == 0.00"
            - "Permit.${pm_id}.gross_fee == 589.00, net_fee == 559.55 and total_due == 559.55"
            - "Inspection.${ins_id}.inspection_status == RESPONSE_SUBMITTED and Operation.${op_id}.open_finding_count == 1"
            - "Operation.${op_id}.compliance_posture == RESTRICTED even though coverage_status is RENEWAL_PENDING"
      - name: plan_revision_cycle_returns_to_draft_and_recertifies
        grounds:
          - state_machines.NutrientManagementPlan.SUBMITTED_to_REVISION_REQUIRED
          - state_machines.NutrientManagementPlan.REVISION_REQUIRED_to_DRAFT
          - state_machines.NutrientManagementPlan.DRAFT_to_CERTIFIED
          - entities.NutrientManagementPlan.fields.revision_count
          - entities.NutrientManagementPlan.fields.certifying_planner_user_id
        distinguishing_aspect: |
          CYCLIC shape on a different entity: the plan re-enters DRAFT and CERTIFIED a second time,
          the loop counter revision_count increments exactly once per traversal, and the cycle is
          gated on re-certification because REVISION_REQUIRED -> DRAFT clears
          certifying_planner_user_id that CERTIFIED -> SUBMITTED requires.
