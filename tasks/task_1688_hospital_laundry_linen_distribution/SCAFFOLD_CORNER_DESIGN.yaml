            - { call: "POST /cart-runs/${r1}/complete", payload: { soiled_lines: [], storage_attested: true }, as: EVSOperator, as_user_id: "evs-1" }
            - { call: "POST /cart-runs/${r1}/reconcile", payload: {}, as: UnitClerk, as_user_id: "${u1}" }
            - { call: "POST /soiled-manifests", payload: { facility_id: "${fac}", cart_run_ids: [ "${r1}" ], lines: [ { stock_id: "${s1}", weight_lbs: 16.00, isolation_flag: false } ] }, as: EVSOperator, as_user_id: "evs-1", captures: { m1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: LinenManager, as_user_id: "lm-1" }
            - { call: "POST /complaints", payload: { unit_id: "${u1}", manifest_id: "${m1}", stock_id: "${s1}", complaint_type: "STAINS", pieces_affected: 1 }, as: UnitClerk, as_user_id: "${u1}", captures: { c1: $.data.id } }
            - { call: "POST /complaints", payload: { unit_id: "${u1}", manifest_id: "${m1}", stock_id: "${s1}", complaint_type: "TEARS", pieces_affected: 1 }, as: UnitClerk, as_user_id: "${u1}", captures: { c2: $.data.id } }
