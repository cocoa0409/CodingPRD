              as_user_id: "${sponsor_id}"
              captures: { survey_composite: $.data.composite_score }
          assert:
            - "${makegood_at_close} == 465750"
            - "${score_delivery_only} == 51.25"
            - "${band_delivery_only} == MEDIUM"
            - "${survey_composite} == 91.00"
            - "Sponsor.${sponsor_id}.renewal_likelihood_score == 72.25"
            - "Sponsor.${sponsor_id}.renewal_band == HIGH"
            - "Sponsor.${sponsor_id}.status == ACTIVE"

  - rule_id: combinatorial_formula
    instances:
      - name: entitlement_unit_value_tier_seasonality_exclusivity_mode_a
        grounds:
          - calculations.entitlement_unit_valuation
          - entities.RateCardLine.fields.tier_breaks
          - entities.RateCardLine.fields.exclusivity_multiplier
          - entities.Property.fields.seasonality_index
          - entities.Entitlement.fields.unit_value_cents
        distinguishing_aspect: |
          Mode (a) — three inputs interact non-linearly on one value: the volume tier is selected
          by a step function on promised_units, the seasonality index scales it, and the exclusivity
          multiplier only applies when the contract holds CATEGORY scope, giving
          round_half_up(225000 * 1.20 * 1.25) = 337500 rather than 250000, 270000 or 312500.
        test_recipe:
          setup:
            - "Property with seasonality_index 1.20 and a PUBLISHED card whose DIGITAL_BOARD line is base 250000 with breaks 10 -> 225000 and 25 -> 200000 and exclusivity multiplier 1.25"
            - "Contract with exclusivity_scope CATEGORY and in_kind_declared_value_cents 0, carrying a single entitlement of 10 DIGITAL_BOARD units, submitted and awaiting countersign"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Metro FC", sport_code: "SOCCER", season_year: 2026, season_start: "2026-09-01T00:00:00Z", season_end: "2026-12-31T23:59:59Z", inventory_target_value_cents: 50000000, seasonality_index: 1.20 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/rate-cards"
              payload: { label: "2026 Season Card", effective_year: 2026 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { rc_id: $.data.id }
            - call: "POST /rate-cards/${rc_id}/lines"
              payload: { asset_class: "DIGITAL_BOARD", base_unit_price_cents: 250000, tier_breaks: [{ min_units: 10, unit_price_cents: 225000 }, { min_units: 25, unit_price_cents: 200000 }], exclusivity_multiplier: 1.25 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /rate-cards/${rc_id}/publish"
              payload: {}
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /properties/${prop_id}/transition"
              payload: { to_status: "SELLING" }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
            - call: "POST /properties/${prop_id}/inventory-assets"
              payload: { name: "North LED Ribbon", asset_class: "DIGITAL_BOARD", capacity_units: 6, changeover_buffer_minutes: 30 }
              as: PropertyAdmin
              as_user_id: "u-admin-01"
              captures: { asset_id: $.data.id }
            - call: "POST /sponsors"
              payload: { name: "Zephyr Cola", category: "BEVERAGE", contact_email: "ops@zephyr.example" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { sponsor_id: $.data.id }
            - call: "POST /contracts"
              payload: { sponsor_id: "${sponsor_id}", property_id: "${prop_id}", term_start: "2026-09-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", exclusivity_scope: "CATEGORY" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/entitlements"
              payload: { inventory_asset_id: "${asset_id}", clause_ref: "4.2(a)", promised_units: 10 }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { ent_id: $.data.id }
            - call: "POST /contracts/${contract_id}/submit"
              payload: {}
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
            - call: "GET /properties/${prop_id}"
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { prop_v: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_id}/countersign"
              payload: { expected_property_version: "${prop_v}" }
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { c_gross: $.data.gross_entitlement_value_cents, c_disc: $.data.volume_discount_pct, c_cash: $.data.cash_value_cents }
            - call: "GET /entitlements/${ent_id}"
              as: ContractApprover
              as_user_id: "u-approver-01"
              captures: { e_unit: $.data.unit_value_cents, e_gross: $.data.gross_value_cents }
          assert:
            - "${e_unit} == 337500"
            - "${e_gross} == 3375000"
            - "${c_gross} == 3375000"
            - "${c_disc} == 0.08"
            - "${c_cash} == 3105000"
            - "Contract.${contract_id}.total_recognized_value_cents == 3105000"
            - "Property.${prop_id}.committed_gross_value_cents == 3105000"

      - name: makegood_floor_per_bucket_then_remainder_mode_b
        grounds:
          - calculations.makegood_credit_allocation
          - entities.Entitlement.fields.makegood_credit_cents
          - entities.Contract.fields.makegood_credit_cents
          - state_machines.Contract.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Mode (b) — rounding order decides the split: flooring each bucket first and handing the
          whole 1-cent remainder to the largest shortfall yields 435278 and 85120, whereas rounding
          each share half-up (or summing before rounding) yields 435277 and 85121 for the same
          pool of 520398 cents.
        test_recipe:
          setup:
            - "Property as above plus a second SIGNAGE asset 'South Fascia Board'"
            - "PUBLISHED card with a DIGITAL_BOARD line (base 250000, breaks 10 -> 225000, 25 -> 200000, multiplier 1.25) and a SIGNAGE line (base 100000, multiplier 1.10)"
            - "Contract with CATEGORY exclusivity and in_kind_declared_value_cents 1600000 of category PRODUCT, entitlement A of 10 DIGITAL_BOARD units and entitlement B of 3 SIGNAGE units, countersigned then activated"
            - "Only 4 of the 10 DIGITAL_BOARD units are delivered; entitlement B receives nothing"
            - "Logical clock at 2027-01-02T00:00:00Z, no booking left SCHEDULED"
