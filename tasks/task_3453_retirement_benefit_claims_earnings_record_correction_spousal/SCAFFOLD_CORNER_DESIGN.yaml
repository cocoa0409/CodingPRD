- section: validations
  instances:
  - name: correction_time_barred_at_default_clock_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=10]
    - errors[ERR_CORRECTION_TIME_BARRED]
    - entities.CorrectionRequest.fields.statute_deadline
    distinguishing_aspect: With NO clock call ever made, the logical clock is the startup default 2026-09-01T00:00:00Z; the 2022 statute deadline
      (2026-04-15) has already passed, so filing is time-barred deterministically.
    test_recipe:
      setup:
      - Worker wv1; no clock manipulation anywhere in the test
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Time Barred
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wv1: $.data.id
          wv1_ver: $.data.version
      trigger:
      - call: POST /ssa/correction-requests
        payload:
          worker_id: ${wv1}
          tax_year: 2022
          claimed_earnings_cents: 500000
          evidence_type: WAGE_STATEMENT
        as: Claimant
        as_user_id: ${wv1}
        captures:
          err: $.data.error_id
      assert:
      - Response is 422 ERR_CORRECTION_TIME_BARRED (deadline (2022+4)-04-15 < default clock 2026-09-01)
      - No CorrectionRequest is persisted
  - name: correction_without_discrepancy_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=9]
    - errors[ERR_NO_EARNINGS_DISCREPANCY]
    distinguishing_aspect: 'Claiming exactly the posted amount (1000000) for 2023 violates the constraint check (priority 9) before any temporal
      check: ERR_NO_EARNINGS_DISCREPANCY.'
    test_recipe:
      setup:
      - Worker wv2 with a 2023 wage report of 1000000 (posted 1000000)
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: No Diff
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wv2: $.data.id
          wv2_ver: $.data.version
      - call: POST /ssa/wage-reports
        payload:
          worker_id: ${wv2}
          employer_name: Acme Corp
          tax_year: 2023
          amount_cents: 1000000
        as: Employer
      trigger:
      - call: POST /ssa/correction-requests
        payload:
          worker_id: ${wv2}
          tax_year: 2023
          claimed_earnings_cents: 1000000
          evidence_type: WAGE_STATEMENT
        as: Claimant
        as_user_id: ${wv2}
        captures:
          err: $.data.error_id
      assert:
      - Response is 422 ERR_NO_EARNINGS_DISCREPANCY
  - name: duplicate_active_claim_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=9]
    - errors[ERR_DUPLICATE_ACTIVE_CLAIM]
    distinguishing_aspect: A second RETIREMENT claim for the same worker while the first is FILED (non-terminal) is rejected; the constraint is
      per (worker_id, claim_type).
    test_recipe:
      setup:
      - Worker wv3 with one FILED RETIREMENT claim
      setup_api_calls:
      - call: POST /ssa/workers
        payload:
          full_name: Dup Claim
          birth_year: 1964
          birth_month: 6
        as: ClaimsSpecialist
        captures:
          wv3: $.data.id
          wv3_ver: $.data.version
      - call: POST /ssa/claims
        payload:
          worker_id: ${wv3}
          claim_type: RETIREMENT
          entitlement_month: 2026-06
        as: Claimant
        as_user_id: ${wv3}
        captures:
          cv3: $.data.id
      trigger:
      - call: POST /ssa/claims
        payload:
          worker_id: ${wv3}
          claim_type: RETIREMENT
          entitlement_month: 2026-07
        as: Claimant
        as_user_id: ${wv3}
        captures:
          err: $.data.error_id
      assert:
      - Response is 409 ERR_DUPLICATE_ACTIVE_CLAIM
      - The original claim ${cv3} remains FILED
  - name: waiver_request_after_30_days_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=10]
    - errors[ERR_WAIVER_WINDOW_CLOSED]
    distinguishing_aspect: The waiver window closes 30 days after the notice (case created_at); day 31 is rejected while the OCC version is fresh
      — isolating the temporal rule.
    test_recipe:
      setup:
      - Worker wv4 with FILED claim; overpayment case created at default clock 2026-09-01; clock advanced to 2026-10-02
      setup_api_calls:
