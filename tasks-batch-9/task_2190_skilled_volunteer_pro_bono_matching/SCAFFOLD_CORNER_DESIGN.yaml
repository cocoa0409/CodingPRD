            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
            - {call: "POST /project-requests", as: PartnerContact, as_user_id: "${partner_id}", payload: {partner_org_id: "${partner_id}", cycle_id: "${cycle_id}", title: "Annual audit readiness", discipline: ACCOUNTING, required_skill_code: "TAX_LAW", min_proficiency: 3, requested_hours: 40.00, urgency: ROUTINE}, captures: {req_id: "$.data.id"}}
          trigger:
            - {call: "GET /project-requests?limit=101&offset=-1", as: ProgramManager, as_user_id: "pm-1", captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 400"
            - "data.error_id == \"ERR_INVALID_PAGINATION\""
            - "GET /project-requests?limit=100&offset=0 returns HTTP 200 with total_count == 1"
            - "GET /project-requests?limit=0 also returns HTTP 400 with ERR_INVALID_PAGINATION"
      - name: error_invalid_request_state_beats_no_eligible_volunteer
