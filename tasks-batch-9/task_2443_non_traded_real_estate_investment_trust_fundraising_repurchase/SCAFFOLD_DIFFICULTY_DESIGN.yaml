  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: broker_dealer_barred_cascades_agreements_then_pending_subscriptions
        grounds:
          - state_machines.BrokerDealer.HEIGHTENED_SUPERVISION_to_BARRED
          - state_machines.SellingAgreement.ACTIVE_to_TERMINATED
          - state_machines.SellingAgreement.PENDING_to_TERMINATED
          - state_machines.Subscription.PENDING_to_REJECTED
          - endpoints["POST /broker-dealers/{broker_dealer_id}/supervision-status"].side_effects
        distinguishing_aspect: |
          Barring one firm walks three entity levels in a single call —
          BrokerDealer -> every non-terminal SellingAgreement -> every PENDING
          Subscription under those agreements — including the PENDING agreement
          that never sold anything, while a second firm's agreement and its
          PENDING subscription in the same offering must remain untouched.
        test_recipe:
          setup:
            - "Offering 'Crestline Income REIT' EFFECTIVE with one zero-load class I."
            - "Firm BD1 in HEIGHTENED_SUPERVISION holding SA1 (ACTIVE) and SA2 (PENDING); firm BD2 IN_GOOD_STANDING holding SA3 (ACTIVE)."
            - "Three DOCUMENTED investors with PENDING subscriptions: G under SA1, H under SA2, I under SA3. No subscription has been escrowed."
