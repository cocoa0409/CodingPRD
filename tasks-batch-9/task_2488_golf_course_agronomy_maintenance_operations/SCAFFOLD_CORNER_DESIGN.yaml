# ===========================================================================
# 1.9 Scaffold Corner Design (Breadth Claim Index)
# ===========================================================================
# Walked row-by-row against references/claim-extraction-guide.md, section by
# section, over this scaffold's declared §1.1-§1.7 surface. §1.8 is the depth
# probe; this file is the breadth probe: required-field rejection, enum and
# range rejection, defaults, computed and system fields, immutability,
# not-found, every state machine's invalid-from and terminal-state rejection,
# every remaining error_id, RBAC denial and segregation of duties, all four
# §1.2.1 OCC rules, and immediate-consistency visibility.
#
# Shared fixture conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   * The logical clock starts at its declared default 2026-08-01T00:00:00Z.
#     An instance only calls POST /_clock/set_current_utc when it needs a
#     different instant.
#   * Opaque-role callers carry stable literal X-User-ID values
#     ("super-1", "super-2", "agro-1", "agro-2", "tourn-1", "tech-1",
#     "dual-1"). Applicator callers carry the Applicator.id captured from
#     POST /applicators.
#   * Literal UUIDs of the form 11111111-1111-4111-8111-1111111111NN are
#     well-formed but bound to no row; they exist to drive the §1.6
#     *_NOT_FOUND family.
#   * Every numeric literal in an `assert:` was computed by executing the
#     matching §1.3 formula against its `constants:` in exact decimal
#     arithmetic with round-half-up.
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: course_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.Course
          - endpoints[POST /courses]
        distinguishing_aspect: "POST /courses with every optional field supplied returns 201 and echoes all nine declared Course fields plus the common id/created_at/updated_at/version set, with version exactly 1."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000, water_restricted_threshold_pct: 85, water_suspended_threshold_pct: 105 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Course.${course_id}.name == Cedar Ridge GC"
            - "Course.${course_id}.region_code == OR"
            - "Course.${course_id}.annual_water_allocation_gal == 500000"
            - "Course.${course_id}.water_restricted_threshold_pct == 85"
            - "Course.${course_id}.water_suspended_threshold_pct == 105"
            - "Course.${course_id}.water_used_gal == 0"
            - "Course.${course_id}.water_posture == OPEN"
            - "Course.${course_id}.play_posture == OPEN"
            - "Course.${course_id}.frost_delay_minutes == 0"
            - "Course.${course_id}.version == 1"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp, response_type == object and the Course under data"

      - name: course_defaults_applied_when_thresholds_are_omitted
        claim_type: defaults
        grounds:
          - entities.Course.fields.water_restricted_threshold_pct
          - entities.Course.fields.water_suspended_threshold_pct
          - endpoints[POST /courses]
        distinguishing_aspect: "Omitting both optional threshold inputs yields exactly the declared defaults 80 and 100, not null and not the values of any other course."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { name: "Birch Hollow GC", region_code: "WA", annual_water_allocation_gal: 250000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
          assert:
            - "Course.${course_id}.water_restricted_threshold_pct == 80"
            - "Course.${course_id}.water_suspended_threshold_pct == 100"
            - "Course.${course_id}.water_posture == OPEN"

      - name: turf_area_defaults_target_moisture_and_leaves_derived_fields_empty
        claim_type: defaults
        grounds:
          - entities.TurfArea.fields.target_moisture_pct
          - entities.TurfArea.fields.current_moisture_pct
          - entities.TurfArea.fields.agronomic_status
          - endpoints[POST /turf-areas]
        distinguishing_aspect: "A turf area created without target_moisture_pct carries the declared default 18 while current_moisture_pct stays null (no readings yet) and both nitrogen ledgers start at 0, proving the default and the derived fields are distinct mechanisms."
        test_recipe:
          setup:
            - "One course."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
          assert:
            - "TurfArea.${green7_id}.target_moisture_pct == 18"
            - "TurfArea.${green7_id}.current_moisture_pct == null"
            - "TurfArea.${green7_id}.agronomic_status == ACTIVE"
            - "TurfArea.${green7_id}.nitrogen_applied_lb_per_1000_ytd == 0"
            - "TurfArea.${green7_id}.nitrogen_projected_lb_per_1000 == 0"
            - "TurfArea.${green7_id}.rei_expires_at == null"
            - "TurfArea.${green7_id}.version == 1"

      - name: course_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /courses/{id}]
          - entities.Course
        distinguishing_aspect: "GET /courses/{id} issued by a non-owning role returns the same field values POST /courses returned, so the read path is a projection of stored state rather than a recomputation."
        test_recipe:
          setup:
            - "One course with non-default thresholds."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000, water_restricted_threshold_pct: 75, water_suspended_threshold_pct: 95 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
          trigger:
            - call: "GET /courses/${course_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
          assert:
            - "HTTP 200"
            - "Course.${course_id}.name == Cedar Ridge GC"
            - "Course.${course_id}.water_restricted_threshold_pct == 75"
            - "Course.${course_id}.water_suspended_threshold_pct == 95"
            - "Course.${course_id}.version == 1"

      - name: applicator_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /applicators]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three applicators on file, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, and limit 2 offset 2 returns 1 row with has_more false; total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Three applicators."
          setup_api_calls:
            - call: "POST /applicators"
              payload: { full_name: "Dana Reyes", license_number: "OR-CAT3-11001", license_category: "CAT_3_TURF", license_expires_on: "2027-06-30" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Miguel Santos", license_number: "OR-CAT3-11002", license_category: "CAT_3_AND_7", license_expires_on: "2028-01-31" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_b_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Priya Nair", license_number: "OR-CAT7-11003", license_category: "CAT_7_AQUATIC", license_expires_on: "2027-12-31" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_c_id: $.data.id }
          trigger:
            - call: "GET /applicators"
              payload: { limit: 2, offset: 0 }
              as: Superintendent
              as_user_id: "super-1"
            - call: "GET /applicators"
              payload: { limit: 2, offset: 2 }
              as: Superintendent
              as_user_id: "super-1"
          assert:
            - "first page returns exactly 2 Applicator rows with total_count == 3 and has_more == true"
            - "second page returns exactly 1 Applicator row with total_count == 3 and has_more == false"
            - "the union of the two pages is exactly {${appl_a_id}, ${appl_b_id}, ${appl_c_id}} with no row repeated"
            - "response_type == array"

      - name: turf_area_creation_missing_required_soil_type
        claim_type: required_fields
        grounds:
          - entities.TurfArea.fields.soil_type
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "soil_type is source: input with no declared default, so omitting it returns ERR_INVALID_REQUEST (400) and creates no TurfArea row."
        test_recipe:
          setup:
            - "One course."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "GET /turf-areas with course_id == ${course_id} returns total_count == 0"

      - name: turf_area_rejects_an_undeclared_area_type_enum_member
        claim_type: type_constraints
        grounds:
          - entities.TurfArea.fields.area_type
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "area_type is closed over GREEN|TEE|FAIRWAY|ROUGH|APPROACH|PRACTICE_GREEN, so the plausible-but-undeclared member LINKS returns ERR_INVALID_REQUEST (400) rather than being stored verbatim."
        test_recipe:
          setup:
            - "One course."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "LINKS", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "GET /turf-areas with course_id == ${course_id} returns total_count == 0"

      - name: plan_task_rejects_a_nitrogen_rate_above_its_declared_range
        claim_type: type_constraints
        grounds:
          - entities.PlanTask.fields.nitrogen_lb_per_1000
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "nitrogen_lb_per_1000 declares the range 0 < value <= 6, so 7.5 is a request-shape failure (400) decided before the domain ceiling ERR_NITROGEN_LOAD_LIMIT (priority 31) is ever consulted, and 6.0 at the inclusive top of the range is accepted."
        test_recipe:
          setup:
            - "One course, one 5500 sq ft GREEN on hole 7, one DRAFT plan for 2026 with a 40 lb nitrogen budget."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 40.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "FERTILITY", nitrogen_lb_per_1000: 7.5, planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "the response error_id is not ERR_NITROGEN_LOAD_LIMIT: request shape (priority 3) is decided before the area-type ceiling (priority 31)"
            - "GET /plan-tasks with plan_id == ${plan_id} returns total_count == 0"
            - "AgronomicPlan.${plan_id}.committed_nitrogen_lb == 0 and AgronomicPlan.${plan_id}.version == 1"

      - name: course_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.Course
          - endpoints[POST /courses]
        distinguishing_aspect: "id, created_at, updated_at and version are absent from POST /courses' declared input, so the server mints all four: id is a well-formed UUID, created_at equals updated_at on a freshly created row, and version starts at 1 for every course independently."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_a_id: $.data.id }
            - call: "POST /courses"
              payload: { name: "Birch Hollow GC", region_code: "WA", annual_water_allocation_gal: 250000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_b_id: $.data.id }
          assert:
            - "${course_a_id} is a well-formed UUID and ${course_b_id} is a well-formed UUID"
            - "${course_a_id} != ${course_b_id}"
            - "Course.${course_a_id}.created_at == Course.${course_a_id}.updated_at"
            - "Course.${course_a_id}.version == 1 and Course.${course_b_id}.version == 1"

      - name: turf_area_current_moisture_tracks_the_latest_reading
        claim_type: computed_fields
        grounds:
          - entities.TurfArea.fields.current_moisture_pct
          - entities.PlayabilityReading.fields.within_tournament_spec
          - calculations.tournament_readiness_index
          - endpoints[POST /playability-readings]
        distinguishing_aspect: "current_moisture_pct is selected by measured_at DESC, so after a 05:00 reading of 22.0 and a 07:00 reading of 15.5 the area reports 15.5 and not 22.0 and not their mean; within_tournament_spec is computed per reading, true for the 11.5 ft / 1.40 g reading and false for the 9.0 ft / 1.10 g reading."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T08:00:00Z."
            - "One course, one 5500 sq ft GREEN on hole 7."
            - "One earlier reading on that green at 05:00 with green speed 11.5 ft, firmness 1.40 g and moisture 22.0 pct."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /playability-readings"
              payload: { turf_area_id: "${green7_id}", measured_at: "2026-08-01T05:00:00Z", green_speed_ft: 11.5, firmness_gravities: 1.40, moisture_pct: 22.0 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { read1_id: $.data.id }
          trigger:
            - call: "POST /playability-readings"
              payload: { turf_area_id: "${green7_id}", measured_at: "2026-08-01T07:00:00Z", green_speed_ft: 9.0, firmness_gravities: 1.10, moisture_pct: 15.5 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { read2_id: $.data.id }
          assert:
            - "TurfArea.${green7_id}.current_moisture_pct == 15.5"
            - "PlayabilityReading.${read1_id}.within_tournament_spec == true"
            - "PlayabilityReading.${read2_id}.within_tournament_spec == false"
            - "TurfArea.${green7_id}.target_moisture_pct == 18 and is unchanged by either reading"

      - name: applicator_license_status_expires_with_the_logical_clock
        claim_type: computed_fields
        grounds:
          - entities.Applicator.fields.license_status
          - entities.Applicator.fields.license_expires_on
          - endpoints[POST /_clock/set_current_utc]
          - endpoints[GET /applicators/{id}]
        distinguishing_aspect: "license_status is derived from date(logical clock) versus license_expires_on with the expiry date itself still usable, so the same row reads ACTIVE at 2026-08-10T23:00:00Z and EXPIRED at 2026-08-11T00:00:00Z with no write in between."
        test_recipe:
          setup:
            - "One applicator whose license expires on 2026-08-10."
            - "Logical clock advanced to 2026-08-10T23:00:00Z, still inside the expiry date."
          setup_api_calls:
            - call: "POST /applicators"
              payload: { full_name: "Dana Reyes", license_number: "OR-CAT3-11001", license_category: "CAT_3_TURF", license_expires_on: "2026-08-10" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_a_id: $.data.id, appl_a_version: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T23:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "GET /applicators/${appl_a_id}"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-11T00:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "GET /applicators/${appl_a_id}"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
          assert:
            - "at 2026-08-10T23:00:00Z Applicator.${appl_a_id}.license_status == ACTIVE"
            - "at 2026-08-11T00:00:00Z Applicator.${appl_a_id}.license_status == EXPIRED"
            - "Applicator.${appl_a_id}.suspended_at == null in both reads"
            - "Applicator.${appl_a_id}.version == ${appl_a_version} in both reads: the flip is derivation, not a write"

      - name: playability_reading_is_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.PlayabilityReading
          - endpoints[GET /turf-areas/{id}/playability-readings]
        distinguishing_aspect: "PlayabilityReading declares common_fields: false, so its rows carry no version and no updated_at and §1.5 declares no PATCH, PUT or DELETE for them: a mis-measured green is corrected by recording a newer reading, never by editing the old one."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T08:00:00Z."
            - "One course, one 5500 sq ft GREEN on hole 7, two readings on that green."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T08:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /playability-readings"
              payload: { turf_area_id: "${green7_id}", measured_at: "2026-08-01T05:00:00Z", green_speed_ft: 11.5, firmness_gravities: 1.40, moisture_pct: 22.0 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { read1_id: $.data.id }
            - call: "POST /playability-readings"
              payload: { turf_area_id: "${green7_id}", measured_at: "2026-08-01T07:00:00Z", green_speed_ft: 10.8, firmness_gravities: 1.30, moisture_pct: 17.0 }
              as: TournamentOfficial
              as_user_id: "tourn-1"
              captures: { read2_id: $.data.id }
          trigger:
            - call: "GET /turf-areas/${green7_id}/playability-readings"
              payload: { limit: 10, offset: 0 }
              as: TournamentOfficial
              as_user_id: "tourn-1"
          assert:
            - "total_count == 2 and both ${read1_id} and ${read2_id} are present"
            - "no returned reading carries a version field and none carries an updated_at field"
            - "PlayabilityReading.${read1_id}.moisture_pct == 22.0 is unchanged by the later reading"
            - "no PATCH, PUT or DELETE endpoint for PlayabilityReading exists in §1.5, so the correction path is a new row"

      - name: course_get_with_an_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_COURSE_NOT_FOUND]
          - endpoints[GET /courses/{id}]
        distinguishing_aspect: "A well-formed UUID that matches no Course row returns ERR_COURSE_NOT_FOUND (404), not ERR_INVALID_REQUEST (400): the id parses, it simply does not resolve."
        test_recipe:
          setup:
            - "One unrelated course, so the store is non-empty."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
          trigger:
            - call: "GET /courses/11111111-1111-4111-8111-111111111101"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 and ${err_id} == ERR_COURSE_NOT_FOUND"
            - "GET /courses/${course_id} still returns 200, so the miss is scoped to the unknown id"

      - name: plan_task_rejects_a_turf_area_owned_by_another_course
        claim_type: foreign_key_integrity
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=36]
          - errors[ERR_TASK_TURF_AREA_MISMATCH]
          - endpoints[POST /plan-tasks]
        distinguishing_aspect: "The topology is flat, so cross-aggregate containment is enforced by rule rather than by URL nesting: a PlanTask on course A's plan naming a TurfArea owned by course B returns ERR_TASK_TURF_AREA_MISMATCH (422) even though both ids resolve to existing rows."
        test_recipe:
          setup:
            - "Two courses. A 5500 sq ft GREEN on hole 7 belongs to course B."
            - "A DRAFT 2026 plan belongs to course A."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_a_id: $.data.id }
            - call: "POST /courses"
              payload: { name: "Birch Hollow GC", region_code: "WA", annual_water_allocation_gal: 250000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_b_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_b_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green_b_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_a_id}", plan_year: 2026, nitrogen_budget_lb: 40.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_a_id: $.data.id }
          trigger:
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_a_id}", turf_area_id: "${green_b_id}", task_type: "AERATION", planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422 and ${err_id} == ERR_TASK_TURF_AREA_MISMATCH"
            - "the response error_id is not ERR_TURF_AREA_NOT_FOUND: ${green_b_id} exists, it is simply owned by the wrong course"
            - "GET /plan-tasks with plan_id == ${plan_a_id} returns total_count == 0"
            - "AgronomicPlan.${plan_a_id}.status == DRAFT and AgronomicPlan.${plan_a_id}.version == 1"

  # =========================================================================
  - section: state_machines
    instances:
      - name: plan_submit_advances_to_submitted_and_records_the_submitter
        claim_type: valid_transition
        grounds:
          - state_machines.AgronomicPlan.DRAFT_to_SUBMITTED
          - entities.AgronomicPlan.fields.submitted_by_user_id
          - endpoints[POST /agronomic-plans/{id}/submit]
        distinguishing_aspect: "A DRAFT plan carrying one PLANNED task moves to SUBMITTED, stamps submitted_by_user_id with the caller's X-User-ID agro-1 and bumps version 1 -> 2, while the child task is untouched at PLANNED version 1."
        test_recipe:
          setup:
            - "One course, one 5500 sq ft GREEN on hole 7."
            - "One DRAFT 2026 plan with a 40 lb budget carrying one PLANNED AERATION task on that green."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 40.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id, plan_v_draft: $.data.version }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "AERATION", planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task1_id: $.data.id }
          trigger:
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
          assert:
            - "at creation AgronomicPlan.${plan_id}.status was DRAFT and ${plan_v_draft} == 1"
            - "AgronomicPlan.${plan_id}.status == SUBMITTED"
            - "AgronomicPlan.${plan_id}.submitted_by_user_id == agro-1"
            - "AgronomicPlan.${plan_id}.version == 2"
            - "AgronomicPlan.${plan_id}.return_count == 0"
            - "AgronomicPlan.${plan_id}.committed_nitrogen_lb == 0.00 (an AERATION task commits no nitrogen)"
            - "PlanTask.${task1_id}.status == PLANNED and PlanTask.${task1_id}.version == 1"

      - name: submit_of_an_active_plan_is_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.AgronomicPlan.DRAFT_to_SUBMITTED
          - validations[priority=17]
          - errors[ERR_PLAN_STATE_INVALID]
        distinguishing_aspect: "ACTIVE is not a declared `from` state for submit, and it is not the declared plan state for POST /plan-tasks either, so both calls return ERR_PLAN_STATE_INVALID (409) and neither bumps the plan version past 3."
        test_recipe:
          setup:
            - "One course, one 5500 sq ft GREEN on hole 7."
            - "One 2026 plan submitted by agro-1 and approved by super-1, so it is ACTIVE at version 3."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 40.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "AERATION", planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task1_id: $.data.id }
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_submitted: $.data.version }
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v_submitted}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { plan_v_active: $.data.version }
          trigger:
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { err_submit: $.data.error_id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "TOPDRESSING", planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { err_task: $.data.error_id }
          assert:
            - "${plan_v_submitted} == 2 and ${plan_v_active} == 3"
            - "HTTP 409 and ${err_submit} == ERR_PLAN_STATE_INVALID"
            - "HTTP 409 and ${err_task} == ERR_PLAN_STATE_INVALID"
            - "AgronomicPlan.${plan_id}.status == ACTIVE and AgronomicPlan.${plan_id}.version == 3"
            - "GET /plan-tasks with plan_id == ${plan_id} returns total_count == 1, still only ${task1_id}"

      - name: a_voided_application_cannot_be_voided_or_verified_again
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Application.RECORDED_to_VOIDED
          - validations[priority=21]
          - errors[ERR_APPLICATION_STATE_INVALID]
        distinguishing_aspect: "VOIDED is the record dimension's terminal state, so a second void and a verify by a different applicator both return ERR_APPLICATION_STATE_INVALID (409) and the row's version does not move past the one the void produced."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T06:00:00Z."
            - "One course, one 5500 sq ft GREEN on hole 7."
            - "Two CAT_3_TURF applicators (Dana records, Miguel would verify) and one urea product at 46 percent nitrogen with no posting requirement."
            - "One application recorded by Dana at 200 lb per acre, then voided by the superintendent for DATA_ENTRY_ERROR."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Dana Reyes", license_number: "OR-CAT3-11001", license_category: "CAT_3_TURF", license_expires_on: "2027-06-30" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Miguel Santos", license_number: "OR-CAT3-11002", license_category: "CAT_3_TURF", license_expires_on: "2028-01-31" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_b_id: $.data.id }
            - call: "POST /pesticide-products"
              payload: { trade_name: "Urea 46-0-0", epa_reg_no: "NA-FERT-0001", requires_license_category: "CAT_3_TURF", rei_hours: 0, min_buffer_ft: 0, max_wind_speed_mph: 15, posting_required: false, nitrogen_pct: 46 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { urea_id: $.data.id }
            - call: "POST /applications"
              payload: { turf_area_id: "${green7_id}", product_id: "${urea_id}", applicator_id: "${appl_a_id}", applied_at: "2026-08-01T06:00:00Z", rate_lb_per_acre: 200, wind_speed_mph: 5, distance_to_water_ft: 40 }
              as: Applicator
              as_user_id: "${appl_a_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /applications/${app1_id}/void"
              payload: { void_reason: "DATA_ENTRY_ERROR" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { app1_v_voided: $.data.version }
          trigger:
            - call: "POST /applications/${app1_id}/void"
              payload: { void_reason: "SAFETY_VIOLATION" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_void: $.data.error_id }
            - call: "POST /applications/${app1_id}/verify"
              payload: {}
              as: Applicator
              as_user_id: "${appl_b_id}"
              captures: { err_verify: $.data.error_id }
          assert:
            - "HTTP 409 and ${err_void} == ERR_APPLICATION_STATE_INVALID"
            - "HTTP 409 and ${err_verify} == ERR_APPLICATION_STATE_INVALID"
            - "Application.${app1_id}.record_status == VOIDED and Application.${app1_id}.void_reason == DATA_ENTRY_ERROR"
            - "Application.${app1_id}.verified_by_applicator_id == null"
            - "Application.${app1_id}.version == ${app1_v_voided}: neither rejected call wrote"
            - "Applicator.${appl_a_id}.license_status == ACTIVE: the rejected SAFETY_VIOLATION void did not suspend anyone"
            - "TurfArea.${green7_id}.nitrogen_applied_lb_per_1000_ytd == 0.000"

      - name: clearing_an_already_cleared_weather_event_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.WeatherEvent.ACTIVE_to_CLEARED
          - validations[priority=23]
          - errors[ERR_WEATHER_STATE_INVALID]
        distinguishing_aspect: "Clear is not idempotent: the second call on a CLEARED event returns ERR_WEATHER_STATE_INVALID (409), leaves cleared_at at its first value and does not bump the course version a second time."
        test_recipe:
