              payload: { building_code: "BIOL", room_number: "61", net_sq_ft: 700, space_class: "DRY", power_kw_capacity: 120.00, chilled_water_available: false, fume_hood_count: 0, floor_load_psf: 250 }
              as: FacilitiesManager
