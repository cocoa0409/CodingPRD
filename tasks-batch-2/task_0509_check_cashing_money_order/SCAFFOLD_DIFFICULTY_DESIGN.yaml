  # =========================================================================
  # RULE 6 — boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: hold_threshold_exact_ge_boundary_on_post
        grounds:
          - calculations.check_cash_fee
          - state_machines.CheckItem.VERIFYING_to_RISK_HELD
          - entities.CheckItem.fields.hold_reason
        distinguishing_aspect: |
          Numeric >= boundary on POST /transactions: face=300000 exactly equals HOLD_THRESHOLD_CENTS, so
          the check MUST go RISK_HELD (>= is inclusive). A face of 299999 (one cent below) auto-clears.
          This metric (face vs hold threshold) and endpoint differ from the recovery-equality boundary.
        test_recipe:
          setup:
            - "A VERIFIED customer; PAYROLL schedule; OPEN drawer float 2000000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Bo Edge", id_type: "DRIVERS_LICENSE", id_number: "DL-11", date_of_birth: "1990-12-12" }
              as: Teller
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
            - call: "POST /fee-schedules"
              payload: { check_type: "PAYROLL", base_fee_cents: 199, percent_rate_bps: 150, tier_breakpoint_cents: 199999, high_percent_rate_bps: 275, max_fee_cents: 2000000, active: true }
              as: StoreManager
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "S11", business_date: "2026-05-01", opening_float_cents: 2000000 }
              as: StoreManager
              captures: { drawer_id: $.data.id }
          trigger:
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 300000, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
            - call: "GET /transactions/${txn_id}/check-items"
              payload: {}
              as: StoreManager
              captures: { check_id: "$.data[0].id" }
          assert:
            - "CheckItem.${check_id}.verification_state == RISK_HELD"
            - "CheckItem.${check_id}.hold_reason == AMOUNT_THRESHOLD"
            - "Transaction.${txn_id}.lifecycle_state == DRAFT"

      - name: recovery_exact_balance_equality_boundary
        grounds:
          - calculations.returned_item_recovery
          - validations[priority=14]
          - state_machines.ReturnedItem.PARTIALLY_RECOVERED_to_RECOVERED
        distinguishing_aspect: |
          Equality boundary on POST /returned-items/{id}/recover: with remaining balance 62500 (total_owed
          102500 less 40000 already recovered), an amount of exactly 62500 succeeds and flips status to
          RECOVERED, whereas 62501 (one cent over) is rejected with ERR_RECOVERY_OVERPAYMENT. Different
          metric (recovery remaining vs hold threshold) and different endpoint.
        test_recipe:
          setup:
            - "A RETURNED CHECK_CASH face=100000 (total_owed 102500) with 40000 already recovered (remaining 62500)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Eve Exact", id_type: "STATE_ID", id_number: "SID-12", date_of_birth: "1984-04-04" }
              as: Teller
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
            - call: "POST /fee-schedules"
              payload: { check_type: "GOVERNMENT", base_fee_cents: 99, percent_rate_bps: 100, tier_breakpoint_cents: 500000, high_percent_rate_bps: 200, max_fee_cents: 50000, active: true }
              as: StoreManager
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "S12", business_date: "2026-05-01", opening_float_cents: 1000000 }
              as: StoreManager
              captures: { drawer_id: $.data.id }
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 100000, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/return"
              payload: { return_reason: "NSF" }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { ri_id: $.data.id }
            - call: "POST /returned-items/${ri_id}/recover"
              payload: { amount_cents: 40000 }
              as: Teller
              as_user_id: "teller-1"
          trigger:
            - call: "POST /returned-items/${ri_id}/recover"
              payload: { amount_cents: 62500 }
              as: Teller
              as_user_id: "teller-1"
          assert:
            - "ReturnedItem.${ri_id}.status == RECOVERED"
            - "ReturnedItem.${ri_id}.recovered_cents == 102500"
            - "Transaction.${txn_id}.settlement_state == RECOVERED"
            - "Customer.${cust_id}.outstanding_recovery_cents == 0"

  # =========================================================================
  # RULE 7 — cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: transaction_post_requires_customer_kyc_verified
        grounds:
          - validations[priority=6]
          - entities.Customer.fields.kyc_status
          - state_machines.Transaction.lifecycle_DRAFT_to_lifecycle_POSTED
        distinguishing_aspect: |
          Entity pair Transaction -> Customer: a posting on a customer whose kyc_status==PENDING (never
          screened) is rejected with ERR_KYC_NOT_VERIFIED. The Transaction's valid transition depends on
          Customer state — a different pair from the Transaction->CashDrawer dependency below.
        test_recipe:
          setup:
            - "A customer registered but NEVER screened (kyc_status==PENDING); an OPEN drawer; an active GOVT schedule."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Una Screened", id_type: "PASSPORT", id_number: "P-13", date_of_birth: "1993-03-13" }
              as: Teller
              captures: { cust_id: $.data.id }
            - call: "POST /fee-schedules"
