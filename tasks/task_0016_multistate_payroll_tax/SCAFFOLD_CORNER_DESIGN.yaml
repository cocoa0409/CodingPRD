scaffold_corner_design:

  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: employee_create_minimal_required_fields
        claim_type: creation
        grounds:
          - entities.Employee
          - endpoints.POST_/employees
        distinguishing_aspect: "POST /employees with the minimum required fields (full_name, work_state_code, residence_state_code) returns 201 with Employee having status=ACTIVE and ytd_* defaulted to 0."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /employees"
              payload: { full_name: "Sam Alpha", work_state_code: "CA", residence_state_code: "CA" }
              as: HRClerk
              captures: { emp_id: $.data.id }
          assert:
            - "response.status_code == 201"
            - "Employee.${emp_id}.status == ACTIVE"
            - "Employee.${emp_id}.ytd_wages_cents == 0"
            - "Employee.${emp_id}.ytd_fed_withheld_cents == 0"
            - "Employee.${emp_id}.ytd_ss_wages_cents == 0"
            - "Employee.${emp_id}.ytd_medicare_wages_cents == 0"
            - "Employee.${emp_id}.locality_code == NONE"
            - "Employee.${emp_id}.version == 1"

      - name: employee_get_returns_stored
        claim_type: retrieval
        grounds:
          - entities.Employee
          - endpoints.GET_/employees/{id}
        distinguishing_aspect: "GET /employees/{id} returns the same fields the POST /employees stored."
        test_recipe:
          setup:
            - "One Employee created via POST /employees"
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Tina Bravo", work_state_code: "NY", residence_state_code: "NY", locality_code: "NYC" }
              as: HRClerk
              captures: { emp_id: $.data.id }
          trigger:
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: HRClerk
          assert:
            - "response.status_code == 200"
            - "response.data.id == ${emp_id}"
            - "response.data.full_name == Tina Bravo"
            - "response.data.work_state_code == NY"
            - "response.data.locality_code == NYC"

      - name: employee_list_pagination
        claim_type: listing
        grounds:
          - endpoints.GET_/employees
        distinguishing_aspect: "GET /employees returns paginated list with total_count, has_more, limit, offset honored."
        test_recipe:
          setup:
            - "Three Employees created"
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "E1", work_state_code: "CA", residence_state_code: "CA" }
              as: HRClerk
            - call: "POST /employees"
              payload: { full_name: "E2", work_state_code: "CA", residence_state_code: "CA" }
              as: HRClerk
            - call: "POST /employees"
              payload: { full_name: "E3", work_state_code: "CA", residence_state_code: "CA" }
              as: HRClerk
          trigger:
            - call: "GET /employees"
              payload: { limit: 2, offset: 0 }
              as: HRClerk
          assert:
            - "response.status_code == 200"
            - "len(response.data) == 2"
            - "response.meta.total_count == 3"
            - "response.meta.has_more == true"

      - name: employee_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints.GET_/employees/{id}
        distinguishing_aspect: "GET /employees/{id} with a UUID that does not resolve returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /employees/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HRClerk
          assert:
            - "response.status_code == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: employee_required_field_missing
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=16]
          - endpoints.POST_/employees
        distinguishing_aspect: |
          ERR_INVALID_REQUEST (priority 16) coverage: a malformed POST that omits required fields
          MUST return 400 with error_id ERR_INVALID_REQUEST. This is the universal "shape" check
          across all POST/PATCH endpoints; the unit test layer authors a negative test by sending
          a payload missing 'work_state_code' to POST /employees and asserts the error.
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / sod_business_safety_beats_fiscal_open_run_blocks
          rationale: |
            ERR_INVALID_REQUEST is an envelope/shape error generated by deliberate payload-malformation;
            the unit-test-generator emits the negative test from this entry but its trigger is a
            structurally-invalid POST that the scaffold-lint reasonably refuses to type-check against §1.5
            (which describes valid request shapes only). The corner is documented for coverage but the
            structurally-invalid trigger lives in the unit-test layer, not the scaffold-design layer.

      - name: employee_invalid_enum
        claim_type: type_constraints
        grounds:
          - entities.Employee.fields.work_state_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /employees with work_state_code='XX' (outside enum {CA,NY,TX,WA}) MUST return 400
          ERR_INVALID_REQUEST. Like employee_required_field_missing, this is a structurally-invalid
          request whose trigger lives in the unit-test layer.
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / sod_business_safety_beats_fiscal_open_run_blocks
          rationale: |
            Enum-violation triggers are structurally-invalid POSTs (payload that does not satisfy §1.5's
            input contract). Documented for coverage; the unit-test author emits the negative test from
            this entry, but it bypasses the scaffold-lint's §1.5 conformance check.

      - name: w4_form_create_with_defaults
        claim_type: defaults
        grounds:
          - entities.W4Form
          - endpoints.POST_/w4-forms
        distinguishing_aspect: "POST /w4-forms omitting dependents_amount_cents / other_income_cents / deductions_cents / extra_withholding_cents / supersedes_w4_id stores defaults (0 for amount fields, null for supersedes_w4_id, DRAFT for status)."
        test_recipe:
          setup: ["One ACTIVE Employee"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "W4Defaults", work_state_code: "CA", residence_state_code: "CA" }
              as: HRClerk
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: HRClerk
              captures: { w4_id: $.data.id }
          assert:
            - "response.status_code == 201"
            - "W4Form.${w4_id}.status == DRAFT"
            - "W4Form.${w4_id}.dependents_amount_cents == 0"
            - "W4Form.${w4_id}.other_income_cents == 0"
            - "W4Form.${w4_id}.deductions_cents == 0"
            - "W4Form.${w4_id}.extra_withholding_cents == 0"
            - "W4Form.${w4_id}.supersedes_w4_id == null"
            - "W4Form.${w4_id}.filed_at == null"

      - name: garnishment_deduction_immutable_no_common_fields
        claim_type: immutability
        grounds:
          - entities.GarnishmentDeduction
        distinguishing_aspect: "GarnishmentDeduction has common_fields:false (no version, no updated_at, no separate UPDATE endpoint). It is created only as a side effect of POST /paychecks."
        test_recipe:
          setup: ["A PaycheckRun with one Paycheck and one GarnishmentDeduction child"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "FEDERAL", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1175000, rate_basis_points: 1000}, {lower_cents: 1175000, upper_cents: 4775000, rate_basis_points: 1200}, {lower_cents: 4775000, upper_cents: null, rate_basis_points: 2200}], supplemental_flat_basis_points: 2200 }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "STATE:CA", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1000000, rate_basis_points: 100}, {lower_cents: 1000000, upper_cents: null, rate_basis_points: 200}], supplemental_flat_basis_points: 1100 }
              as: PlatformAdmin
            - call: "POST /employees"
              payload: { full_name: "GD Test", work_state_code: "CA", residence_state_code: "CA" }
              as: HRClerk
              captures: { emp_id: $.data.id }
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: HRClerk
              captures: { w4_id: $.data.id }
            - call: "POST /w4-forms/${w4_id}/file"
              payload: {}
              as: HRClerk
            - call: "POST /garnishment-orders"
              payload: { employee_id: "${emp_id}", order_type: "CHILD_SUPPORT", weekly_cap_cents: 30000, original_balance_cents: 100000, served_on: "2025-06-01T00:00:00.000Z" }
              as: ComplianceOfficer
              captures: { g_id: $.data.id }
            - call: "POST /paycheck-runs"
              payload: { pay_period_start: "2025-11-01T00:00:00.000Z", pay_period_end: "2025-11-15T23:59:59.999Z", pay_date: "2025-11-15T00:00:00.000Z" }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { run_id: $.data.id }
            - call: "POST /paychecks"
              payload: { paycheck_run_id: "${run_id}", employee_id: "${emp_id}", pay_type: "REGULAR", regular_hours_e2: 4000, hourly_rate_cents: 5000 }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { pay_id: $.data.id }
            - call: "GET /paychecks/${pay_id}/garnishment-deductions"
              payload: {}
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { ded_id: "$.data[0].id" }
          trigger:
            - call: "GET /garnishment-deductions/${ded_id}"
              payload: {}
              as: PayrollPreparer
              as_user_id: "U_PREP"
          assert:
            - "response.data.amount_cents == 30000"
            - "response.data.paycheck_id == ${pay_id}"
            - "response.data.garnishment_order_id == ${g_id}"

      - name: paycheck_computed_gross_overrides_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Paycheck.fields.gross_wages_cents
          - calculations.gross_wages_calc
        distinguishing_aspect: "Paycheck.gross_wages_cents is computed, not input — if the client attempts to send gross_wages_cents in the POST body it is ignored, and the computed value from gross_wages_calc takes effect."
        test_recipe:
          setup:
            - "Tax tables seeded; Employee ACTIVE with W4 FILED; PaycheckRun DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "FEDERAL", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1175000, rate_basis_points: 1000}, {lower_cents: 1175000, upper_cents: 4775000, rate_basis_points: 1200}, {lower_cents: 4775000, upper_cents: null, rate_basis_points: 2200}], supplemental_flat_basis_points: 2200 }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "STATE:CA", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1000000, rate_basis_points: 100}, {lower_cents: 1000000, upper_cents: null, rate_basis_points: 200}], supplemental_flat_basis_points: 1100 }
              as: PlatformAdmin
            - call: "POST /employees"
              payload: { full_name: "PC Comp", work_state_code: "CA", residence_state_code: "CA" }
              as: HRClerk
              captures: { emp_id: $.data.id }
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: HRClerk
              captures: { w4_id: $.data.id }
            - call: "POST /w4-forms/${w4_id}/file"
              payload: {}
              as: HRClerk
            - call: "POST /paycheck-runs"
              payload: { pay_period_start: "2025-11-01T00:00:00.000Z", pay_period_end: "2025-11-15T23:59:59.999Z", pay_date: "2025-11-15T00:00:00.000Z" }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /paychecks"
              payload: { paycheck_run_id: "${run_id}", employee_id: "${emp_id}", pay_type: "REGULAR", regular_hours_e2: 4000, hourly_rate_cents: 5000 }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { pay_id: $.data.id }
          assert:
            - "Paycheck.${pay_id}.gross_wages_cents == 200000"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: paycheckrun_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines.PaycheckRun
        distinguishing_aspect: "POST /paycheck-runs creates a PaycheckRun in initial state DRAFT."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /paycheck-runs"
              payload: { pay_period_start: "2025-11-01T00:00:00.000Z", pay_period_end: "2025-11-15T23:59:59.999Z", pay_date: "2025-11-15T00:00:00.000Z" }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { run_id: $.data.id }
          assert:
            - "PaycheckRun.${run_id}.status == DRAFT"

      - name: paycheckrun_invalid_transition_from_draft_to_pay
        claim_type: invalid_transition
        grounds:
          - state_machines.PaycheckRun
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /paycheck-runs/{id}/pay against a DRAFT run (not APPROVED) is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "PaycheckRun in DRAFT (not approved)"
          setup_api_calls:
            - call: "POST /paycheck-runs"
              payload: { pay_period_start: "2025-11-01T00:00:00.000Z", pay_period_end: "2025-11-15T23:59:59.999Z", pay_date: "2025-11-15T00:00:00.000Z" }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /paycheck-runs/${run_id}/pay"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status_code == 409"

      - name: paycheckrun_terminal_void_no_transition
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PaycheckRun
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "PaycheckRun.VOID is terminal — any further transition trigger (e.g., /approve, /pay) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "PaycheckRun VOID after PAID->VOID sequence"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "FEDERAL", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1175000, rate_basis_points: 1000}, {lower_cents: 1175000, upper_cents: 4775000, rate_basis_points: 1200}, {lower_cents: 4775000, upper_cents: null, rate_basis_points: 2200}], supplemental_flat_basis_points: 2200 }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "STATE:CA", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1000000, rate_basis_points: 100}, {lower_cents: 1000000, upper_cents: null, rate_basis_points: 200}], supplemental_flat_basis_points: 1100 }
              as: PlatformAdmin
            - call: "POST /employees"
              payload: { full_name: "Vt Term", work_state_code: "CA", residence_state_code: "CA" }
              as: HRClerk
              captures: { emp_id: $.data.id }
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: HRClerk
              captures: { w4_id: $.data.id }
            - call: "POST /w4-forms/${w4_id}/file"
              payload: {}
              as: HRClerk
            - call: "POST /paycheck-runs"
              payload: { pay_period_start: "2025-11-01T00:00:00.000Z", pay_period_end: "2025-11-15T23:59:59.999Z", pay_date: "2025-11-15T00:00:00.000Z" }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { run_id: $.data.id }
            - call: "POST /paychecks"
              payload: { paycheck_run_id: "${run_id}", employee_id: "${emp_id}", pay_type: "REGULAR", regular_hours_e2: 4000, hourly_rate_cents: 5000 }
              as: PayrollPreparer
              as_user_id: "U_PREP"
            - call: "POST /paycheck-runs/${run_id}/approve"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
            - call: "POST /paycheck-runs/${run_id}/pay"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
            - call: "POST /paycheck-runs/${run_id}/void"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
          trigger:
            - call: "POST /paycheck-runs/${run_id}/approve"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR2"
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status_code == 409"

      - name: w4form_initial_state_draft
        claim_type: initial_state
        grounds:
          - state_machines.W4Form
        distinguishing_aspect: "POST /w4-forms creates a W4Form in initial state DRAFT."
        test_recipe:
          setup: ["One ACTIVE Employee"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Wi Init", work_state_code: "CA", residence_state_code: "CA" }
              as: HRClerk
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: HRClerk
              captures: { w4_id: $.data.id }
          assert:
            - "W4Form.${w4_id}.status == DRAFT"

      - name: garnishment_order_release_from_active
        claim_type: valid_transition
        grounds:
          - state_machines.GarnishmentOrder.ACTIVE_to_RELEASED
          - endpoints.POST_/garnishment-orders/{id}/release
        distinguishing_aspect: "POST /garnishment-orders/{id}/release on ACTIVE order transitions to RELEASED (terminal)."
        test_recipe:
          setup: ["Employee ACTIVE; ACTIVE CHILD_SUPPORT GarnishmentOrder"]
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Gr Rel", work_state_code: "CA", residence_state_code: "CA" }
              as: HRClerk
              captures: { emp_id: $.data.id }
            - call: "POST /garnishment-orders"
              payload: { employee_id: "${emp_id}", order_type: "CHILD_SUPPORT", weekly_cap_cents: 30000, original_balance_cents: 100000, served_on: "2025-06-01T00:00:00.000Z" }
              as: ComplianceOfficer
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /garnishment-orders/${g_id}/release"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "GarnishmentOrder.${g_id}.status == RELEASED"

      - name: remittance_remit_from_accruing_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.Remittance
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /remittances/{id}/remit on a Remittance still ACCRUING (before close-period) is rejected ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Federal + CA tax tables seeded"
            - "Employee ACTIVE with W4 FILED"
            - "PaycheckRun PAID for 2025-11; Remittance row created in ACCRUING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-11-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "FEDERAL", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1175000, rate_basis_points: 1000}, {lower_cents: 1175000, upper_cents: 4775000, rate_basis_points: 1200}, {lower_cents: 4775000, upper_cents: null, rate_basis_points: 2200}], supplemental_flat_basis_points: 2200 }
              as: PlatformAdmin
            - call: "POST /tax-rate-tables"
              payload: { jurisdiction: "STATE:CA", tax_year: 2025, filing_status: "SINGLE", brackets_json: [{lower_cents: 0, upper_cents: 1000000, rate_basis_points: 100}, {lower_cents: 1000000, upper_cents: null, rate_basis_points: 200}], supplemental_flat_basis_points: 1100 }
              as: PlatformAdmin
            - call: "POST /employees"
              payload: { full_name: "Re Inv", work_state_code: "CA", residence_state_code: "CA" }
              as: HRClerk
              captures: { emp_id: $.data.id }
            - call: "POST /w4-forms"
              payload: { employee_id: "${emp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: HRClerk
              captures: { w4_id: $.data.id }
            - call: "POST /w4-forms/${w4_id}/file"
              payload: {}
              as: HRClerk
            - call: "POST /paycheck-runs"
              payload: { pay_period_start: "2025-11-01T00:00:00.000Z", pay_period_end: "2025-11-15T23:59:59.999Z", pay_date: "2025-11-15T00:00:00.000Z" }
              as: PayrollPreparer
              as_user_id: "U_PREP"
              captures: { run_id: $.data.id }
            - call: "POST /paychecks"
              payload: { paycheck_run_id: "${run_id}", employee_id: "${emp_id}", pay_type: "REGULAR", regular_hours_e2: 4000, hourly_rate_cents: 5000 }
              as: PayrollPreparer
              as_user_id: "U_PREP"
            - call: "POST /paycheck-runs/${run_id}/approve"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
            - call: "POST /paycheck-runs/${run_id}/pay"
              payload: {}
              as: PayrollApprover
              as_user_id: "U_APPR"
            - call: "GET /remittances"
              payload: { period_month: "2025-11", jurisdiction: "FEDERAL", tax_type: "FED_INCOME" }
              as: ComplianceOfficer
              captures: { rem_id: "$.data[0].id" }
            - call: "GET /remittances/${rem_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { rem_v: $.data.version }
          trigger:
            - call: "POST /remittances/${rem_id}/remit"
              payload: { paid_cents: 16357, expected_remittance_version: "${rem_v}" }
              as: ComplianceOfficer
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status_code == 409"

  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: ss_wage_base_cap_hit
        claim_type: input_set_filtering
        grounds:
          - calculations.fica_ss_calc
          - entities.Employee.fields.ytd_ss_wages_cents
