  # =========================================================================
  # Cross-Cutting Complexity Layers — OCC, derived-field reconciliation.
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_customer_version_after_sibling_approval
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[approve-credit-stale-customer]
          - errors[ERR_STALE_CUSTOMER_VERSION]
        distinguishing_aspect: "Client reads customer at version V; approving sibling order O1 debits ar_balance and advances Customer.version to V+1; approving order O2 still carrying expected_customer_version V is rejected ERR_STALE_CUSTOMER_VERSION (412)."
        test_recipe:
          setup:
            - "Customer C version V (captured at create). Two submitted orders O1, O2 (each 1 case, lot has 24 splits)."
            - "Approve O1 with expected_customer_version V -> succeeds, Customer.version becomes V+1."
            - "Approve O2 still using the stale V -> 412."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24, min_delivery_gap_days: 0 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", on_hand_splits: 24 }
              as: WarehouseOp
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 1 }
              as: SalesRep
            - call: "POST /orders/${o1}/submit"
              payload: {}
              as: SalesRep
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-24T00:00:00Z" }
              as: SalesRep
              captures: { o2: $.data.id }
            - call: "POST /orders/${o2}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 1 }
              as: SalesRep
            - call: "POST /orders/${o2}/submit"
              payload: {}
              as: SalesRep
            - call: "POST /orders/${o1}/approve-credit"
              payload: { expected_customer_version: "${cust_v}" }
              as: CreditManager
          trigger:
            - call: "POST /orders/${o2}/approve-credit"
              payload: { expected_customer_version: "${cust_v}" }
              as: CreditManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "data.error_id == ERR_STALE_CUSTOMER_VERSION"

      - name: occ_stale_customer_version_negative_minus_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[approve-credit-stale-customer]
          - errors[ERR_STALE_CUSTOMER_VERSION]
        distinguishing_aspect: "A deliberate stale approve-credit carrying expected_customer_version (current customer version minus one) is rejected ERR_STALE_CUSTOMER_VERSION (412) on a submitted order."
        test_recipe:
          setup:
            - "Order O submitted; customer at version V (unchanged since create). A stale approve-credit uses V-1."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "FreshCo" }
              as: DistributorAdmin
              captures: { dist: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { distributor_id: "${dist}", to_iso8601: "2026-06-15T12:00:00Z" }
              as: DistributorAdmin
            - call: "POST /warehouses"
              payload: { distributor_id: "${dist}", code: "WH1", name: "Main" }
              as: DistributorAdmin
              captures: { wh: $.data.id }
            - call: "POST /routes"
              payload: { distributor_id: "${dist}", warehouse_id: "${wh}", code: "R1", delivery_dow: 2, cutoff_lead_hours: 24 }
              as: DistributorAdmin
              captures: { route: $.data.id }
            - call: "POST /products"
              payload: { distributor_id: "${dist}", sku: "P-1", name: "Cheddar", category: "DAIRY", splits_per_case: 12, case_cost_cents: 1000 }
              as: DistributorAdmin
              captures: { prod: $.data.id }
            - call: "POST /price-tiers"
              payload: { product_id: "${prod}", min_cases: 1, case_price_cents: 2400 }
              as: DistributorAdmin
            - call: "POST /inventory-lots"
              payload: { product_id: "${prod}", warehouse_id: "${wh}", lot_code: "L1", on_hand_splits: 12 }
              as: WarehouseOp
            - call: "POST /customers"
              payload: { distributor_id: "${dist}", route_id: "${route}", name: "Diner A", credit_limit_cents: 100000 }
              as: SalesRep
              captures: { cust: $.data.id, cust_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust}", requested_delivery_date: "2026-06-17T00:00:00Z" }
              as: SalesRep
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/lines"
              payload: { product_id: "${prod}", uom: "CASE", ordered_qty: 1 }
              as: SalesRep
              captures: { line: $.data.id }
            - call: "POST /orders/${order}/submit"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /orders/${order}/approve-credit"
              payload: { expected_customer_version: "${cust_v} - 1" }
              as: CreditManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "data.error_id == ERR_STALE_CUSTOMER_VERSION"

      - name: catalog_revision_increments_on_product_and_tier_create
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Distributor.fields.catalog_revision
        distinguishing_aspect: "catalog_revision starts 0, becomes 1 after creating a product, and 2 after adding a price tier — a derived counter reconciled on each catalog mutation."
        test_recipe:
          setup:
            - "Fresh distributor (catalog_revision 0)."
          setup_api_calls:
