          - entities.Station.fields.outage_active
        distinguishing_aspect: "Clearing an outage on a station whose outage_active is already false is refused with 409 ERR_INVALID_STATE rather than silently succeeding, so the state machine on Station refuses the no-op."
        test_recipe:
          setup:
            - "clock 2026-09-01T07:00:00Z; station SEA created and no outage ever declared"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
