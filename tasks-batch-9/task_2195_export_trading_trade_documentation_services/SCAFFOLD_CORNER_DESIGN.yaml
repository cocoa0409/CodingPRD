          assert:
            - "lc_status_before == \"AMENDMENT_REQUESTED\" and review_1_status == \"SUBMITTED\" before the amendment"
            - "amendment_round == 1, new_max == 31500.00 (30000.00 * 1.05) and lc_v_after_amendment == lc_v_before_amendment + 1, with status back to \"RECEIVED\""
            - "err_stale == \"ERR_STALE_LC_VERSION\" with HTTP 412 — the credit is in RECEIVED so the priority-11 state table passes and priority 13 is the first failure"
            - "lc_v_fresh == lc_v_after_amendment and the retry returns HTTP 201 with review_2_status == \"DRAFTING\""
            - "the rejected attempt created no LCTermsReview row: exactly two reviews exist, the first now SUPERSEDED by the amendment with its OPEN TERMS finding marked CURED"
            - "each of the four successful LetterOfCredit writes incremented version by exactly 1"
      - name: corner_occ_lc_amendment_stale_credit_on_the_second_amendment_round
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.lc-amendment-stale-credit
          - errors[ERR_STALE_LC_VERSION]
          - state_machines.LetterOfCredit.transitions.ACCEPTED_to_RECEIVED
          - calculations.insured_exposure_ledger
        distinguishing_aspect: "The amendment OCC field can only be probed from ACCEPTED or AMENDMENT_REQUESTED, so the credit is walked through a full accept-amend-reaccept cycle; the stale value used on the second amendment is the version the credit held after the FIRST amendment, i.e. a value that was legitimately current two writes earlier. The accepted credit also charges and then releases insured exposure, so a masked stale write would corrupt the exposure ledger as well as amendment_round."
        test_recipe:
          setup:
            - "a policy covering the buyer so that acceptance has an exposure ledger to charge"
            - "amendment 1 raises the amount, amendment 2 extends latest_shipment_date"
          setup_api_calls:
