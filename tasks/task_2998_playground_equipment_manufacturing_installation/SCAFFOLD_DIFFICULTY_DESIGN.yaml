        distinguishing_aspect: |
          The InstallationJob row is untouched and legally startable (SCHEDULED, clock on its
          scheduled_start_date), yet POST .../start fails purely because a DIFFERENT entity - its
          CertifiedInstaller - is SUSPENDED; flipping only that installer back to ACTIVE makes the
