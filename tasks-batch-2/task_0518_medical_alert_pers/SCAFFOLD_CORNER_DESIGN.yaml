              payload: { agent_user_id: "agent-A", starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices/${dev_s3}/alarms"
              payload: { signal_type: "MANUAL_BUTTON" }
              as: Subscriber
              as_user_id: "${sub_s3}"
              captures: { alarm_s3: $.data.id }
            - call: "POST /pers/alarms/${alarm_s3}/assign"
              payload: {}
              as: CallCenterAgent
              as_user_id: "agent-A"
          trigger:
            - call: "POST /pers/alarms/${alarm_s3}/dispatch-actions"
              payload: { action_type: "CALL_SUBSCRIBER", outcome: "ANSWERED" }
              as: CallCenterAgent
              as_user_id: "agent-B"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_NOT_ASSIGNED_AGENT"

      - name: missing_headers_returns_unauthenticated
        claim_type: rbac_denial
        grounds: [roles, "validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request missing X-User-Role / X-User-ID returns ERR_UNAUTHENTICATED (401). Modeled as an unauthenticated call to a read endpoint."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /pers/monitoring-plans"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_every_write
        claim_type: optimistic_concurrency
        grounds: [entities.Contract.fields.version, "concurrency_rules[cancellation-request-stale-contract]"]
        distinguishing_aspect: "Contract.version starts at 1 on create, becomes 2 after activate; a correct expected_contract_version (the freshly read value) succeeds on request-cancellation."
        test_recipe:
          setup: ["Activated BASIC contract; client reads current version then requests cancellation with it."]
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub U1", email: "u1@x.com", residence_address: "1 U St", phone: "561-1" }
              as: PlatformAdmin
              captures: { sub_u1: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_u1}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_u1: $.data.id, v_create: $.data.version }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_u1}", serial_number: "SN-U1", device_type: "PENDANT" }
              as: Subscriber
              as_user_id: "${sub_u1}"
              captures: { dev_u1: $.data.id }
            - call: "POST /pers/devices/${dev_u1}/tests"
              payload: { reported_battery_pct: 90, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_u1}"
            - call: "POST /pers/devices/${dev_u1}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_u1}"
            - call: "POST /pers/contracts/${ctr_u1}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { v_active: $.data.version }
          trigger:
            - call: "POST /pers/contracts/${ctr_u1}/request-cancellation"
              payload: { expected_contract_version: "${v_active}" }
              as: Subscriber
              as_user_id: "${sub_u1}"
              captures: { svc: $.data.service_status }
          assert:
            - "Contract.${ctr_u1}.service_status == CANCELLATION_REQUESTED"

      - name: occ_stale_version_after_cascade_returns_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[cancellation-request-stale-contract]", "errors[ERR_STALE_VERSION]", "validations[priority=18]"]
        distinguishing_aspect: "A billing mark-past-due bumps Contract.version after the client's read; request-cancellation carrying the pre-bump version (v_active) is rejected ERR_STALE_VERSION (412) while service_status is still ACTIVE."
        test_recipe:
          setup: ["Activated BASIC contract; client read version v_active; clock advanced past paid_through; mark-past-due bumps version; client re-uses v_active."]
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub U2", email: "u2@x.com", residence_address: "2 U St", phone: "561-2" }
              as: PlatformAdmin
              captures: { sub_u2: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_u2}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_u2: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_u2}", serial_number: "SN-U2", device_type: "PENDANT" }
              as: Subscriber
              as_user_id: "${sub_u2}"
              captures: { dev_u2: $.data.id }
            - call: "POST /pers/devices/${dev_u2}/tests"
              payload: { reported_battery_pct: 90, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_u2}"
            - call: "POST /pers/devices/${dev_u2}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_u2}"
            - call: "POST /pers/contracts/${ctr_u2}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { v_active: $.data.version }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/contracts/${ctr_u2}/billing/mark-past-due"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /pers/contracts/${ctr_u2}/request-cancellation"
              payload: { expected_contract_version: "${v_active}" }
              as: Subscriber
              as_user_id: "${sub_u2}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: suspend_cascades_devices_to_suspended
        claim_type: cascading_side_effects
        grounds: [state_machines.Contract.ACTIVE_to_SUSPENDED, state_machines.Device.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Suspending a contract cascades ALL its ACTIVE devices to SUSPENDED (cascade-down verified end-to-end on a 2-device contract)."
        test_recipe:
          setup: ["Activated BASIC contract with TWO devices; mark-past-due; suspend."]
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub U3", email: "u3@x.com", residence_address: "3 U St", phone: "561-3" }
              as: PlatformAdmin
              captures: { sub_u3: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_u3}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_u3: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_u3}", serial_number: "SN-U3a", device_type: "PENDANT" }
              as: Subscriber
              as_user_id: "${sub_u3}"
              captures: { dev_u3a: $.data.id }
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_u3}", serial_number: "SN-U3b", device_type: "WRISTBAND" }
              as: Subscriber
              as_user_id: "${sub_u3}"
              captures: { dev_u3b: $.data.id }
            - call: "POST /pers/devices/${dev_u3a}/tests"
              payload: { reported_battery_pct: 90, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_u3}"
            - call: "POST /pers/devices/${dev_u3b}/tests"
              payload: { reported_battery_pct: 90, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_u3}"
            - call: "POST /pers/devices/${dev_u3a}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_u3}"
            - call: "POST /pers/devices/${dev_u3b}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_u3}"
            - call: "POST /pers/contracts/${ctr_u3}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/contracts/${ctr_u3}/billing/mark-past-due"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /pers/contracts/${ctr_u3}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "GET /pers/devices/${dev_u3a}"
              payload: {}
              as: PlatformAdmin
              captures: { sta: $.data.status }
            - call: "GET /pers/devices/${dev_u3b}"
              payload: {}
              as: PlatformAdmin
              captures: { stb: $.data.status }
          assert:
            - "Device.${dev_u3a}.status == SUSPENDED"
            - "Device.${dev_u3b}.status == SUSPENDED"

      - name: scheduled_hold_cancel_frees_interval
        claim_type: scheduled_actions
        grounds: [state_machines.MonitoringHold.SCHEDULED_to_CANCELLED, "validations[priority=13]"]
        distinguishing_aspect: "Cancelling a SCHEDULED hold frees its interval+buffer so a previously-rejected overlapping hold now succeeds (201)."
        test_recipe:
          setup: ["ACTIVE device with a SCHEDULED hold [2026-06-05, 2026-06-10); that hold is then cancelled."]
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub U4", email: "u4@x.com", residence_address: "4 U St", phone: "561-4" }
              as: PlatformAdmin
              captures: { sub_u4: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_u4}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_u4: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_u4}", serial_number: "SN-U4", device_type: "PENDANT" }
              as: Subscriber
              as_user_id: "${sub_u4}"
              captures: { dev_u4: $.data.id }
            - call: "POST /pers/devices/${dev_u4}/tests"
              payload: { reported_battery_pct: 90, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_u4}"
            - call: "POST /pers/devices/${dev_u4}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_u4}"
            - call: "POST /pers/contracts/${ctr_u4}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pers/monitoring-holds"
              payload: { device_id: "${dev_u4}", starts_at: "2026-06-05T00:00:00Z", ends_at: "2026-06-10T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_u4}"
              captures: { hold_u4: $.data.id }
            - call: "POST /pers/monitoring-holds/${hold_u4}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_u4}"
          trigger:
            - call: "POST /pers/monitoring-holds"
              payload: { device_id: "${dev_u4}", starts_at: "2026-06-06T00:00:00Z", ends_at: "2026-06-12T00:00:00Z" }
              as: Subscriber
              as_user_id: "${sub_u4}"
              captures: { hold_u4b: $.data.id, st: $.data.status }
          assert:
            - "response.status == 201"
            - "MonitoringHold.${hold_u4b}.status == SCHEDULED"

  # =========================================================================
