  - section: complexity_layers
    instances:
      - name: shipment_creation_rejects_a_stale_expected_unit_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.shipment-create-stale-unit
          - endpoints.POST_/ccr/reuse-shipments
          - errors.ERR_STALE_UNIT_VERSION
        distinguishing_aspect: |
          Two shipments draw down the same tonnage pool, so the second must be written against the version
          the first produced. Replaying the version observed before the first shipment is 412
          ERR_STALE_UNIT_VERSION with no tonnage movement at all, and the identical body succeeds once the
          client re-reads the unit. This is the §1.2.1 rule for the create endpoint.
        test_recipe:
          setup:
            - "One clean unit with an ACTIVE 30000-ton offtake agreement"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Owen Park", license_number: "PE-22002", license_state: "NC", discipline: "CIVIL" }
              as: UtilityAdmin
              captures: { pe_civil_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0150", unit_name: "Ash Pond 150", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id, unit_v1: $.data.version }
            - call: "POST /ccr/reuse-agreements"
              payload: { unit_id: "${unit_id}", agreement_code: "RA-0150", product_type: "CONCRETE_POZZOLAN", offtaker_name: "Piedmont Ready-Mix", committed_tons: 30000, commitment_start_on: "2026-07-01", commitment_end_on: "2026-12-31", loi_percent: 6.00, retained_325_percent: 20.00, oxide_sum_percent: 82.00, market_price_usd_cents_per_ton: 3200, haul_distance_miles: 60 }
              as: UtilityAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /ccr/reuse-agreements/${agr_id}/qualify"
              payload: { qualified_on: "2026-08-01" }
              as: ProfessionalEngineer
              as_user_id: "${pe_civil_id}"
            - call: "POST /ccr/reuse-agreements/${agr_id}/activate"
              payload: { activated_on: "2026-08-01" }
              as: UtilityAdmin
            - call: "POST /ccr/reuse-shipments"
              payload: { agreement_id: "${agr_id}", shipment_code: "SH-0150-A", tons: 10000, shipped_on: "2026-08-01", expected_unit_version: "${unit_v1}" }
              as: UtilityAdmin
              captures: { ship_a_id: $.data.id }
          trigger:
            - call: "POST /ccr/reuse-shipments"
              payload: { agreement_id: "${agr_id}", shipment_code: "SH-0150-B", tons: 10000, shipped_on: "2026-08-01", expected_unit_version: "${unit_v1}" }
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
            - call: "GET /ccr/units/${unit_id}"
              as: UtilityAdmin
              captures: { unit_v2: $.data.version }
            - call: "POST /ccr/reuse-shipments"
              payload: { agreement_id: "${agr_id}", shipment_code: "SH-0150-B", tons: 10000, shipped_on: "2026-08-01", expected_unit_version: "${unit_v2}" }
              as: UtilityAdmin
              captures: { ship_b_id: $.data.id }
          assert:
            - "after the setup DisposalUnit.${unit_id}.ash_in_place_tons == 470000 and version == unit_v1 + 1"
            - "trigger call 1 returns HTTP 412 with error_id ERR_STALE_UNIT_VERSION"
            - "after trigger call 1 no ReuseShipment with shipment_code SH-0150-B exists, ash_in_place_tons is still 470000, BeneficialReuseAgreement.${agr_id}.shipped_tons_total is still 10000 and the unit version is unchanged"
            - "trigger call 2 returns unit_v2 == unit_v1 + 1"
            - "trigger call 3 returns HTTP 201 with status SHIPPED, ash_in_place_tons 460000, shipped_tons_total 20000 and the unit version advanced once more"
            - "BeneficialReuseAgreement.${agr_id}.status is still ACTIVE because 20000 of 30000 tons are shipped"

      - name: shipment_return_rejects_a_stale_expected_unit_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.shipment-return-stale-unit
          - endpoints.POST_/ccr/reuse-shipments/{id}/return
          - errors.ERR_STALE_UNIT_VERSION
        distinguishing_aspect: |
          The compensating write is guarded by the same OCC field as the forward write, on a different
          endpoint. Returning shipment A against the version that existed before shipment B is refused, so a
          client cannot credit tonnage back onto a balance that has since moved. The refusal must leave both
          the unit and the agreement ledgers untouched.
        test_recipe:
          setup:
            - "One clean unit with an ACTIVE 30000-ton agreement and two 10000-ton shipments already moved"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Owen Park", license_number: "PE-22002", license_state: "NC", discipline: "CIVIL" }
              as: UtilityAdmin
              captures: { pe_civil_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0151", unit_name: "Ash Pond 151", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id, unit_v1: $.data.version }
            - call: "POST /ccr/reuse-agreements"
              payload: { unit_id: "${unit_id}", agreement_code: "RA-0151", product_type: "CONCRETE_POZZOLAN", offtaker_name: "Piedmont Ready-Mix", committed_tons: 30000, commitment_start_on: "2026-07-01", commitment_end_on: "2026-12-31", loi_percent: 6.00, retained_325_percent: 20.00, oxide_sum_percent: 82.00, market_price_usd_cents_per_ton: 3200, haul_distance_miles: 60 }
              as: UtilityAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /ccr/reuse-agreements/${agr_id}/qualify"
              payload: { qualified_on: "2026-08-01" }
              as: ProfessionalEngineer
              as_user_id: "${pe_civil_id}"
            - call: "POST /ccr/reuse-agreements/${agr_id}/activate"
              payload: { activated_on: "2026-08-01" }
              as: UtilityAdmin
            - call: "POST /ccr/reuse-shipments"
              payload: { agreement_id: "${agr_id}", shipment_code: "SH-0151-A", tons: 10000, shipped_on: "2026-08-01", expected_unit_version: "${unit_v1}" }
              as: UtilityAdmin
              captures: { ship_a_id: $.data.id }
            - call: "GET /ccr/units/${unit_id}"
              as: UtilityAdmin
              captures: { unit_v2: $.data.version }
            - call: "POST /ccr/reuse-shipments"
              payload: { agreement_id: "${agr_id}", shipment_code: "SH-0151-B", tons: 10000, shipped_on: "2026-08-02", expected_unit_version: "${unit_v2}" }
              as: UtilityAdmin
          trigger:
            - call: "POST /ccr/reuse-shipments/${ship_a_id}/return"
              payload: { returned_on: "2026-08-03", return_reason: "Load rejected at the ready-mix plant for excess moisture", expected_unit_version: "${unit_v2}" }
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
            - call: "GET /ccr/units/${unit_id}"
              as: UtilityAdmin
              captures: { unit_v3: $.data.version }
            - call: "POST /ccr/reuse-shipments/${ship_a_id}/return"
              payload: { returned_on: "2026-08-03", return_reason: "Load rejected at the ready-mix plant for excess moisture", expected_unit_version: "${unit_v3}" }
              as: UtilityAdmin
              captures: { ship_status: $.data.status }
          assert:
            - "after the setup DisposalUnit.${unit_id}.ash_in_place_tons == 460000 with shipped_tons_total 20000"
            - "trigger call 1 returns HTTP 412 with error_id ERR_STALE_UNIT_VERSION because unit_v2 was superseded by shipment B"
            - "after trigger call 1 ReuseShipment.${ship_a_id}.status is still SHIPPED, returned_on is null, ash_in_place_tons is still 460000 and shipped_tons_total is still 20000"
            - "trigger call 2 returns unit_v3 == unit_v2 + 1"
            - "trigger call 3 returns HTTP 200 with ship_status RETURNED, ash_in_place_tons 470000, shipped_tons_total 10000 and the unit version advanced once more"
            - "ash_mass_balance_ok is true at every step"

      - name: result_append_rejects_a_stale_expected_sampling_event_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.result-append-stale-event
          - endpoints.POST_/ccr/analytical-results
          - errors.ERR_STALE_EVENT_VERSION
        distinguishing_aspect: |
          Appending results is legitimately repeatable — one row per well and parameter — so nothing in the
          event's own DRAFT state would refuse the second append. Only the event version does, which makes
          this the one OCC rule whose parent is the SamplingEvent rather than the unit. The refused append
          must not increment result_count.
        test_recipe:
          setup:
            - "One clean unit with a certified network of one background and three downgradient wells"
            - "One DRAFT background sampling round carrying a single result"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Mia Chen", license_number: "HG-33003", license_state: "NC", discipline: "HYDROGEOLOGY" }
              as: UtilityAdmin
              captures: { hg_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0152", unit_name: "Ash Pond 152", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id, prog_id: $.data.monitoring_program_id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "BG-01", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 22.00, screen_bottom_ft: 42.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { bg_id: $.data.id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "DG-01", well_role: "DOWNGRADIENT", aquifer_zone: "UPPER SAND", screen_top_ft: 20.00, screen_bottom_ft: 40.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { dg1_id: $.data.id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "DG-02", well_role: "DOWNGRADIENT", aquifer_zone: "UPPER SAND", screen_top_ft: 21.00, screen_bottom_ft: 41.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "DG-03", well_role: "DOWNGRADIENT", aquifer_zone: "UPPER SAND", screen_top_ft: 23.00, screen_bottom_ft: 43.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "PATCH /ccr/monitoring-programs/${prog_id}"
              payload: { comparison_basis: "INTERWELL", background_window_start_on: "2025-01-01", background_window_end_on: "2025-12-31" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/monitoring-programs/${prog_id}/certify-network"
              payload: { certified_on: "2025-01-05" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/sampling-events"
              payload: { program_id: "${prog_id}", event_code: "SE-0152", event_type: "BACKGROUND", sampled_on: "2026-08-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { event_id: $.data.id, event_v1: $.data.version }
            - call: "POST /ccr/analytical-results"
              payload: { sampling_event_id: "${event_id}", well_id: "${bg_id}", parameter_code: "SULFATE", concentration: 0.5000, unit_of_measure: "MG_PER_L", detection_flag: "DETECTED", expected_sampling_event_version: "${event_v1}" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
          trigger:
            - call: "POST /ccr/analytical-results"
              payload: { sampling_event_id: "${event_id}", well_id: "${dg1_id}", parameter_code: "SULFATE", concentration: 0.9000, unit_of_measure: "MG_PER_L", detection_flag: "DETECTED", expected_sampling_event_version: "${event_v1}" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { error_id: $.data.error_id }
            - call: "GET /ccr/sampling-events/${event_id}"
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { event_v2: $.data.version }
            - call: "POST /ccr/analytical-results"
              payload: { sampling_event_id: "${event_id}", well_id: "${dg1_id}", parameter_code: "SULFATE", concentration: 0.9000, unit_of_measure: "MG_PER_L", detection_flag: "DETECTED", expected_sampling_event_version: "${event_v2}" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { effective_value: $.data.effective_value }
          assert:
            - "after the setup SamplingEvent.${event_id}.result_count == 1 and version == event_v1 + 1"
            - "trigger call 1 returns HTTP 412 with error_id ERR_STALE_EVENT_VERSION"
            - "after trigger call 1 SamplingEvent.${event_id}.result_count is still 1, its version is unchanged, and no AnalyticalResult exists for well ${dg1_id}"
            - "trigger call 2 returns event_v2 == event_v1 + 1"
            - "trigger call 3 returns HTTP 201 with effective_value 0.9000, and SamplingEvent.${event_id}.result_count == 2 with the version advanced once more"
            - "SamplingEvent.${event_id}.status is DRAFT throughout, proving the refusal came from the version guard and not from a state gate"

      - name: posting_lateness_is_counted_only_strictly_after_the_obligation_date
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.posting_obligation_status
          - entities.PublicPosting.fields.days_late
          - entities.DisposalUnit.fields.late_posting_count
          - entities.DisposalUnit.fields.overdue_posting_types
        distinguishing_aspect: |
          The lateness counter has an inclusive boundary: a document posted on exactly the obligation date is
          days_late 0 and does not increment late_posting_count, while one posted the very next day after its
          own obligation date is days_late 1 and does. The unit's overdue_posting_types must also empty out
          the instant the late document lands, so the counter records history while the posture recovers.
        test_recipe:
          setup:
            - "One clean unit with a 2026-07-15 stability assessment, giving a 2026-08-14 posting obligation"
            - "The same unit's plan fully certified so it can be approved on 2026-08-14"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
              as: UtilityAdmin
              captures: { pe_geo_id: $.data.id }
            - call: "POST /ccr/professionals"
              payload: { full_name: "Owen Park", license_number: "PE-22002", license_state: "NC", discipline: "CIVIL" }
              as: UtilityAdmin
              captures: { pe_civil_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0153", unit_name: "Ash Pond 153", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-07-15", factor_of_safety_static: 1.60, factor_of_safety_seismic: 1.10, factor_of_safety_liquefaction: 1.30 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
            - call: "POST /ccr/closure-plans"
              payload: { unit_id: "${unit_id}", plan_code: "CP-0153", selected_method: "CLOSURE_IN_PLACE", in_place_capital_usd_cents: 100000000, in_place_annual_care_usd_cents: 1000000, removal_capital_usd_cents: 900000000, removal_annual_care_usd_cents: 1000000, care_period_years: 30 }
              as: UtilityAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ccr/closure-plans/${plan_id}/engineering-certification"
              payload: { certified_on: "2026-08-01", design_narrative: "Composite cap with 24-inch protective layer and perimeter toe drain regrade" }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
            - call: "POST /ccr/closure-plans/${plan_id}/cost-certification"
              payload: { certified_on: "2026-08-01", cost_basis_note: "Unit-price bid tabulation, 2026 dollars, 3 percent discount basis" }
              as: ProfessionalEngineer
              as_user_id: "${pe_civil_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T00:00:00Z" }
              as: UtilityAdmin
              captures: { clock_now: $.data.current_utc }
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "STABILITY_ASSESSMENT", posted_on: "2026-08-14", document_uri: "https://utility.example.com/ccr/imp-0153/stability-2026.pdf", document_sha256: "a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1" }
              as: ComplianceOfficer
              captures: { days_late: $.data.days_late }
            - call: "POST /ccr/closure-plans/${plan_id}/approve"
              payload: { approved_on: "2026-08-14", permit_reference: "PERMIT-2026-F" }
              as: Regulator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-14T00:00:00Z" }
              as: UtilityAdmin
              captures: { clock_now: $.data.current_utc }
            - call: "GET /ccr/units/${unit_id}/compliance-summary"
              as: ComplianceOfficer
              captures: { summary_posture: $.data.compliance_posture }
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "CLOSURE_PLAN", posted_on: "2026-10-14", document_uri: "https://utility.example.com/ccr/imp-0153/closure-plan.pdf", document_sha256: "c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2" }
              as: ComplianceOfficer
              captures: { days_late: $.data.days_late }
          assert:
            - "before the triggers DisposalUnit.${unit_id}.stability_posting_due_date == 2026-08-14 and late_posting_count == 0"
            - "trigger call 2 returns HTTP 201 with days_late 0 and satisfied_obligation true, posted on exactly the obligation date"
            - "after trigger call 2 DisposalUnit.${unit_id}.late_posting_count == 0, overdue_posting_types == [] and compliance_posture == COMPLIANT"
            - "after trigger call 3 DisposalUnit.${unit_id}.closure_plan_posting_due_date == 2026-10-13, exactly 60 days after 2026-08-14"
            - "trigger call 5 returns summary_posture FROZEN with overdue_posting_types [CLOSURE_PLAN] and late_posting_count still 0, because the obligation is now one day past due and unsatisfied"
            - "trigger call 6 returns HTTP 201 with days_late 1 and satisfied_obligation true"
            - "after trigger call 6 DisposalUnit.${unit_id}.late_posting_count == 1, overdue_posting_types == [] and compliance_posture == COMPLIANT"

      - name: four_level_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: ssi_cascade_depth_four_suspends_active_reuse_agreement
          rationale: "That instance walks the deepest chain in the scaffold — evaluation verdict to program phase to unit posture to reuse agreement — and asserts every hop plus the write that the last hop refuses."

      - name: both_calculation_variants_produce_their_own_result
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: interwell_vs_intrawell_limit_flips_ssi_verdict
          rationale: "That instance holds the data fixed and switches comparison_basis, asserting both prediction limits and the opposite verdicts they produce from one measurement."

  - section: consistency_model
    instances:
      - name: approval_cascade_is_visible_to_the_very_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/ccr/closure-plans/{id}/approve
          - state_machines.ClosurePlan.FULLY_CERTIFIED_to_APPROVED
        distinguishing_aspect: |
          The model is immediate, so a two-hop cascade must be complete before the approving request returns:
          the plan response already reads APPROVED, and the very next read of the unit — with no intervening
          write and no delay — already shows CLOSURE_PLANNED, the new posting obligation and the recomputed
          posture. Nothing may be deferred to a later request or a background pass.
        test_recipe:
          setup:
            - "One clean unit whose plan is FULLY_CERTIFIED and not yet approved"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
              as: UtilityAdmin
              captures: { pe_geo_id: $.data.id }
