  - section: errors
    instances:
      - name: error_priority_too_high_to_defer_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PRIORITY_TOO_HIGH_TO_DEFER]
        excluded_because:
          difficulty_instance: condition_report_initial_triage_vs_reassessed_priority_diverges
          rationale: "Raised as the failure path of the named §1.8 instance when the REASSESSED score reaches 77."
      - name: error_segment_party_overlap_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEGMENT_PARTY_OVERLAP]
        excluded_because:
          difficulty_instance: segment_party_overlap_uses_half_open_intervals_plus_sixty_minute_buffer
          rationale: "Raised by the 15:59 party confirm in the named §1.8 instance."
      - name: error_volunteer_double_booked_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_VOLUNTEER_DOUBLE_BOOKED]
        excluded_because:
          difficulty_instance: volunteer_double_booking_uses_zero_buffer_closed_intervals_plus_daily_cap
          rationale: "Raised by the party C registration in the named §1.8 instance."
      - name: error_volunteer_daily_hours_exceeded_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_VOLUNTEER_DAILY_HOURS_EXCEEDED]
        excluded_because:
          difficulty_instance: volunteer_double_booking_uses_zero_buffer_closed_intervals_plus_daily_cap
          rationale: "Raised by the party D registration in the named §1.8 instance."
      - name: error_plan_budget_exceeded_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PLAN_BUDGET_EXCEEDED]
        excluded_because:
          difficulty_instance: plan_budget_cap_inclusive_at_one_hundred_twenty_percent
          rationale: "Raised by the 241800-cent requisition in the named §1.8 instance."
      - name: error_permit_lead_time_insufficient_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PERMIT_LEAD_TIME_INSUFFICIENT]
        excluded_because:
          difficulty_instance: permit_lead_time_inclusive_at_exactly_fourteen_days
          rationale: "Raised by the 13-day permit request in the named §1.8 instance."
      - name: error_revision_limit_exceeded_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: adoption_agreement_return_resubmit_cycle_hits_revision_limit
          rationale: "Raised by the fifth submit in the named §1.8 instance."
      - name: error_engineering_review_required_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ENGINEERING_REVIEW_REQUIRED]
        excluded_because:
          difficulty_instance: engineering_review_safety_outranks_over_committed_fiscal_on_order_submit
          rationale: "Raised as the winning error of the named §1.8 priority-conflict instance."
      - name: error_adoption_not_active_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ADOPTION_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: adoption_not_active_referential_outranks_permit_window_temporal_on_confirm
          rationale: "Raised as the winning error of the named §1.8 priority-conflict instance."
      - name: error_work_plan_not_approved_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_WORK_PLAN_NOT_APPROVED]
        excluded_because:
          difficulty_instance: material_order_submit_gated_by_work_plan_status
          rationale: "Raised after the adoption terminates and closes the plan in the named §1.8 instance."
      - name: error_wet_weather_restricted_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_WET_WEATHER_RESTRICTED]
        excluded_because:
          difficulty_instance: work_party_confirm_gated_by_trail_segment_wet_posture
          rationale: "Raised by the confirm attempted while the segment is WET_RESTRICTED in the named §1.8 instance."

  - section: rbac
    instances:
      - name: unauthenticated_request_missing_header_returns_401
        claim_type: role_denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles.Volunteer
        distinguishing_aspect: |
          Authentication precedes every other check: a request carrying neither X-User-Role nor
          X-User-ID returns HTTP 401 ERR_UNAUTHENTICATED even when the target resource exists and the
          path is otherwise valid.
        test_recipe:
          setup:
            - "One land manager exists."
            - "The trigger request is issued with BOTH the X-User-Role and the X-User-ID headers omitted entirely."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id }
          trigger:
            - call: "GET /stewardship/land-managers/${lm_id}"
              payload: {}
              as: Volunteer
              captures: { auth_error: $.data.error_id }
          assert:
            - "HTTP status is 401"
            - "${auth_error} == ERR_UNAUTHENTICATED"
            - "The same GET with a valid X-User-Role and X-User-ID returns HTTP 200"
