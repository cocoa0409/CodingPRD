# =====================================================================
# §1.6 Error Catalog (57 codes)
# =====================================================================
errors:

  # --- auth ---
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    message_template: "Authentication headers are missing or invalid"
    raised_by: "all endpoints"
  - error_id: ERR_UNAUTHORIZED
    http_status: 403
    message_template: "Role {role} may not call {method} {path}"
    raised_by: "all endpoints"
  - error_id: ERR_NOT_MEMBER_OWNER
    http_status: 403
    message_template: "MemberRepresentative {user_id} may only act for its own member institution"
    raised_by: "member-scoped writes and ballot casting"

  # --- request shape ---
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    message_template: "Field {field} is missing or invalid"
    raised_by: "all endpoints with a request body"
  - error_id: ERR_INVALID_PAGINATION
    http_status: 400
    message_template: "limit must be between 1 and 100 and offset must be at least 0"
    raised_by: "all list endpoints"

  # --- existence ---
  - error_id: ERR_CONFERENCE_NOT_INITIALIZED
    http_status: 409
    message_template: "No conference has been initialised"
    raised_by: "every endpoint except POST /conference and POST /_clock/set_current_utc"
  - error_id: ERR_CONFERENCE_ALREADY_EXISTS
    http_status: 409
    message_template: "A conference record already exists"
    raised_by: "POST /conference"
  - error_id: ERR_VENUE_NOT_FOUND
    http_status: 404
    message_template: "Venue {venue_id} was not found"
    raised_by: "POST /members, PATCH /members/{id}, POST /schedule-games, POST /championship-events"
  - error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    message_template: "Member {member_id} was not found"
    raised_by: "every member-scoped endpoint and every body reference to a member"
  - error_id: ERR_REVENUE_POOL_NOT_FOUND
    http_status: 404
    message_template: "Revenue pool {revenue_pool_id} was not found"
    raised_by: "pool endpoints and POST /championship-events"
  - error_id: ERR_DISTRIBUTION_RUN_NOT_FOUND
    http_status: 404
    message_template: "Distribution run {distribution_run_id} was not found"
    raised_by: "run endpoints and POST /audit-reports"
  - error_id: ERR_BOWL_APPEARANCE_NOT_FOUND
    http_status: 404
    message_template: "Bowl appearance {bowl_appearance_id} was not found"
    raised_by: "bowl appearance endpoints"
  - error_id: ERR_MEMBERSHIP_ACTION_NOT_FOUND
    http_status: 404
    message_template: "Membership action {membership_action_id} was not found"
    raised_by: "membership action endpoints"
  - error_id: ERR_BUDGET_PROPOSAL_NOT_FOUND
    http_status: 404
    message_template: "Budget proposal {budget_proposal_id} was not found"
    raised_by: "budget proposal endpoints"
  - error_id: ERR_PROTECTED_RIVALRY_NOT_FOUND
    http_status: 404
    message_template: "Protected rivalry {protected_rivalry_id} was not found"
    raised_by: "GET /protected-rivalries/{id}, POST /schedule-games"
  - error_id: ERR_SCHEDULE_GAME_NOT_FOUND
    http_status: 404
    message_template: "Schedule game {schedule_game_id} was not found"
    raised_by: "schedule game endpoints"
  - error_id: ERR_CHAMPIONSHIP_EVENT_NOT_FOUND
    http_status: 404
    message_template: "Championship event {championship_event_id} was not found"
    raised_by: "championship event endpoints"
  - error_id: ERR_AUDIT_REPORT_NOT_FOUND
    http_status: 404
    message_template: "Audit report {audit_report_id} was not found"
    raised_by: "audit report endpoints"

  # --- optimistic concurrency ---
  - error_id: ERR_STALE_POOL_VERSION
    http_status: 412
    message_template: "expected_pool_version {expected} does not match the current pool version {actual}"
    raised_by: "POST /revenue-pools/{id}/distribution-runs"
  - error_id: ERR_STALE_ACTION_VERSION
    http_status: 412
    message_template: "expected_action_version {expected} does not match the current membership action version {actual}"
    raised_by: "POST /membership-actions/{id}/ballots"
  - error_id: ERR_STALE_CONFERENCE_VERSION
    http_status: 412
    message_template: "expected_conference_version {expected} does not match the current conference version {actual}"
    raised_by: "POST /conference/reserve-transfers"
  - error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
    message_template: "expected_member_version {expected} does not match the current member version {actual}"
    raised_by: "PATCH /members/{id}"

  # --- uniqueness and pairing ---
  - error_id: ERR_DUPLICATE_INSTITUTION_CODE
    http_status: 409
    message_template: "Institution code {institution_code} is already in use"
    raised_by: "POST /members"
  - error_id: ERR_MEMBER_PAIR_INVALID
    http_status: 422
    message_template: "A member may not be paired with itself"
    raised_by: "POST /members, PATCH /members/{id}, POST /protected-rivalries, POST /schedule-games"
  - error_id: ERR_DUPLICATE_RIVALRY
    http_status: 409
    message_template: "A protected rivalry already exists between members {member_a_id} and {member_b_id}"
    raised_by: "POST /protected-rivalries"
  - error_id: ERR_DUPLICATE_BALLOT
    http_status: 409
    message_template: "Member {member_id} has already cast a ballot on this question"
    raised_by: "POST /membership-actions/{id}/ballots, POST /budget-proposals/{id}/ballots"

  # --- state ---
  - error_id: ERR_CHARTER_WINDOW_CLOSED
    http_status: 409
    message_template: "Charter admission is only available while the conference is FORMING"
    raised_by: "POST /members"
  - error_id: ERR_MEMBER_STATE_INVALID
    http_status: 409
    message_template: "Member {member_id} is in status {status}, which does not permit this operation"
    raised_by: "member writes, POST /schedule-games, POST /membership-actions, POST /championship-events"
  - error_id: ERR_POOL_STATE_INVALID
    http_status: 409
    message_template: "Revenue pool {revenue_pool_id} is in status {status}, which does not permit this operation"
    raised_by: "pool lifecycle endpoints and POST /revenue-pools/{id}/distribution-runs"
  - error_id: ERR_RUN_STATE_INVALID
    http_status: 409
    message_template: "Distribution run {distribution_run_id} is in status {status}, which does not permit this operation"
    raised_by: "POST /distribution-runs/{id}/post, POST /distribution-runs/{id}/reverse, POST /audit-reports"
  - error_id: ERR_APPEARANCE_STATE_INVALID
    http_status: 409
    message_template: "Bowl appearance {bowl_appearance_id} is in status {status}, which does not permit this operation"
    raised_by: "bowl appearance transition endpoints"
  - error_id: ERR_ACTION_STATE_INVALID
    http_status: 409
    message_template: "Membership action {membership_action_id} is in status {status}, which does not permit this operation"
    raised_by: "membership action transition endpoints"
  - error_id: ERR_PROPOSAL_STATE_INVALID
    http_status: 409
    message_template: "Budget proposal {budget_proposal_id} is in status {status}, which does not permit this operation"
    raised_by: "budget proposal transition endpoints"
  - error_id: ERR_GAME_STATE_INVALID
    http_status: 409
    message_template: "Schedule game {schedule_game_id} is in status {status}, which does not permit this operation"
    raised_by: "POST /schedule-games/{id}/play, POST /schedule-games/{id}/cancel"
  - error_id: ERR_EVENT_STATE_INVALID
    http_status: 409
    message_template: "Championship event {championship_event_id} is in status {status}, which does not permit this operation"
    raised_by: "championship event transition endpoints"
  - error_id: ERR_REPORT_STATE_INVALID
    http_status: 409
    message_template: "Audit report {audit_report_id} is in status {status}, which does not permit this operation"
    raised_by: "POST /audit-reports/{id}/issue, POST /audit-reports/{id}/accept"
  - error_id: ERR_AMEND_LIMIT_REACHED
    http_status: 409
    message_template: "Membership action {membership_action_id} has already been amended {amend_count} times"
    raised_by: "POST /membership-actions/{id}/amend"

  # --- safety ---
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    message_template: "User {user_id} performed the preceding step and may not also perform this one"
    raised_by: "POST /distribution-runs/{id}/post, POST /membership-actions/{id}/close-voting, POST /audit-reports/{id}/issue"
  - error_id: ERR_UNITS_ALREADY_DISTRIBUTED
    http_status: 409
    message_template: "Postseason units from appearance {bowl_appearance_id} have already been distributed on a posted run"
    raised_by: "POST /bowl-appearances/{id}/void"

  # --- temporal ---
  - error_id: ERR_MEMBER_REST_BUFFER_VIOLATION
    http_status: 409
    message_template: "Member {member_id} already plays within {rest_buffer_days} days of {game_date}"
    raised_by: "POST /schedule-games"
  - error_id: ERR_VENUE_CAPACITY_EXCEEDED
    http_status: 409
    message_template: "Venue {venue_id} already hosts {concurrent_event_capacity} overlapping events in that window"
    raised_by: "POST /championship-events"
  - error_id: ERR_INVALID_EFFECTIVE_YEAR
    http_status: 422
    message_template: "effective fiscal year {effective_fiscal_year} must be later than the current fiscal year {current_fiscal_year}"
    raised_by: "POST /members/{id}/withdrawal-notice, POST /membership-actions, POST /membership-actions/{id}/amend"

  # --- business constraints ---
  - error_id: ERR_VENUE_NOT_HOME_VENUE
    http_status: 422
    message_template: "Venue {venue_id} is not the home venue of member {home_member_id}"
    raised_by: "POST /schedule-games"
  - error_id: ERR_INVALID_EVENT_WINDOW
    http_status: 422
    message_template: "window_end must be strictly after window_start"
    raised_by: "POST /championship-events"
  - error_id: ERR_MEMBER_NOT_ELIGIBLE_TO_VOTE
    http_status: 409
    message_template: "Member {member_id} carries no voting weight"
    raised_by: "POST /membership-actions/{id}/ballots, POST /budget-proposals/{id}/ballots"

  # --- referential preconditions ---
  - error_id: ERR_NO_APPROVED_BUDGET
    http_status: 409
    message_template: "No approved budget exists for fiscal year {fiscal_year}"
    raised_by: "POST /membership-actions"
  - error_id: ERR_BOWL_REVIEW_PENDING
    http_status: 409
    message_template: "Bowl appearance {bowl_appearance_id} for fiscal year {fiscal_year} is still under review"
    raised_by: "POST /revenue-pools/{id}/close-books"
  - error_id: ERR_AUDIT_REPORT_NOT_ISSUED
    http_status: 409
    message_template: "No issued audit report exists for distribution run {distribution_run_id}"
    raised_by: "POST /distribution-runs/{id}/post"
  - error_id: ERR_HOST_COMPLIANCE_INSUFFICIENT
    http_status: 422
    message_template: "Host member {host_member_id} scores {schedule_compliance_score}, below the minimum of {minimum}"
    raised_by: "POST /championship-events"
  - error_id: ERR_POOL_CLOSED_TO_REVENUE
    http_status: 409
    message_template: "Revenue pool {revenue_pool_id} is CLOSED and can no longer absorb restated revenue"
    raised_by: "POST /championship-events/{id}/settle"
  - error_id: ERR_RECONCILIATION_IMBALANCE
    http_status: 422
    message_template: "Distribution run {distribution_run_id} does not reconcile: delta is {reconciliation_delta_cents} cents"
    raised_by: "POST /audit-reports/{id}/issue"

  # --- fiscal ---
  - error_id: ERR_RESERVE_POSTURE_FROZEN
    http_status: 409
    message_template: "The conference reserve posture is FROZEN and discretionary spending is suspended"
    raised_by: "POST /revenue-pools/{id}/distribution-runs, POST /championship-events"
  - error_id: ERR_AUDITED_EXPENSE_MISSING
    http_status: 409
    message_template: "Revenue pool {revenue_pool_id} has no audited expense figure"
    raised_by: "POST /revenue-pools/{id}/distribution-runs"
  - error_id: ERR_EMPTY_ALLOCATION_BASIS
    http_status: 422
    message_template: "The eligible member set carries a total weight of 0, so nothing can be allocated"
    raised_by: "POST /revenue-pools/{id}/distribution-runs"
  - error_id: ERR_ENTRY_FEE_OUTSTANDING
    http_status: 402
    message_template: "Member {member_id} still owes {outstanding_cents} cents of its entry fee"
    raised_by: "POST /members/{id}/phase-advance, POST /membership-actions/{id}/execute"
  - error_id: ERR_ENTRY_FEE_OVERPAYMENT
    http_status: 422
    message_template: "Payment of {amount_cents} cents would exceed the entry fee of {entry_fee_cents} cents"
    raised_by: "POST /members/{id}/entry-fee-payments"
  - error_id: ERR_RESERVE_INSUFFICIENT
    http_status: 422
    message_template: "The reserve balance of {reserve_balance_cents} cents cannot fund a withdrawal of {amount_cents} cents"
    raised_by: "POST /conference/reserve-transfers"

# =====================================================================
# §1.7 Role Model - segregation_of_duties
# =====================================================================
roles:

  - name: Commissioner
    identity: opaque
    description: "Runs the conference office. Seats charter members, proposes and executes membership actions, files and rescinds withdrawal notices, and records the membership's acceptance of audit reports."
    permissions:
      - "create and amend members, propose, withdraw, close and execute membership actions"
      - "file and rescind withdrawal notices, cancel games and championship events, award championship hosting"
      - "accept issued audit reports; read everything"

  - name: FinanceOfficer
    identity: opaque
    description: "Owns the revenue pools, the distribution computation and the annual budget. May never post a run it computed - the Treasurer does that."
    permissions:
      - "create and drive the pool lifecycle, compute distribution runs, settle championship events"
      - "draft budget proposals and open and close budget voting"
      - "advance a member's distribution phase"
    constraints:
      - "may not post a distribution run; posting is a Treasurer action and additionally requires a different user"

  - name: Treasurer
    identity: opaque
    description: "Moves money. Posts and reverses distribution runs, records entry-fee instalments and moves the reserve."
    permissions:
      - "post and reverse distribution runs, record entry-fee payments, contribute to and withdraw from the reserve"
    constraints:
      - "may not post a run whose computed_by_user_id equals the acting X-User-ID"

  - name: Auditor
    identity: opaque
    description: "Attests distribution runs to the membership. Issuing a report verifies the cent-conservation identity."
    permissions:
      - "draft and issue audit reports; read everything"
    constraints:
      - "may not issue a report on a run it computed, so the auditor's X-User-ID must differ from the run's computed_by_user_id"

  - name: ComplianceOfficer
    identity: opaque
    description: "Reviews bowl and tournament appearances, closes membership votes and voids appearances."
    permissions:
      - "begin review, request revision, resubmit, approve and void bowl appearances"
      - "close voting on membership actions, mark games played"
    constraints:
      - "may not close voting on a membership action it proposed"

  - name: ScheduleCoordinator
    identity: opaque
    description: "Builds the schedule - venues, protected rivalries, games and championship windows."
    permissions:
      - "register venues, create protected rivalries, create, play and cancel games, award and cancel championship events"

  - name: PlatformAdmin
    identity: opaque
    description: "Bootstraps the deployment: sets the logical clock, initialises the conference and registers venues."
    permissions:
      - "set the logical clock, create the conference, register venues, create and amend members; read everything"

  - name: MemberRepresentative
    identity: "entity_backed:Member"
    description: "Acts for one member institution. X-User-ID is the Member.id, and every write is confined to that member's own records."
    permissions:
      - "submit and resubmit its own bowl appearances, record its own entry-fee payments, amend its own profile"
      - "cast ballots on membership actions and budget proposals on behalf of its own institution"
      - "read its own distribution lines, postseason units, ballots and exit settlement"
    constraints:
      - "X-User-ID must equal the addressed Member.id or the body's member_id, otherwise ERR_NOT_MEMBER_OWNER"
      - "carries no voting weight unless the member is FULL_SHARE or ADMITTED_PHASING"
