      - name: conditional_action_requeue_is_rejected_from_queued_claimed_and_resolved
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/ad-policy/review-tasks/{id}/requeue
          - validations[priority=40].ERR_INVALID_TASK_STATE
          - state_machines.ReviewTask.status.ESCALATED_to_QUEUED
        distinguishing_aspect: |
          Requeue is the only admin-driven task transition and it is admissible from exactly
          one state. Walking a single task through QUEUED, CLAIMED and RESOLVED and firing
          requeue at each stop yields three 409s with no state drift, which is the negative
          half the happy-path escalation cycle cannot cover.
        test_recipe:
          setup:
            - "Rule FIN_CREDIT (REGULATED, weight 4.00, auto 0.90, manual 0.20, default_queue STANDARD), one verified advertiser, one reviewer on STANDARD authorised for US."
