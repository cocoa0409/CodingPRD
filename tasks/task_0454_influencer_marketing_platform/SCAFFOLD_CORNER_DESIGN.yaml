              captures: { brand_b: $.data.id }
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_a}", title: "AC", campaign_budget_cents: 50000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_a}"
              captures: { camp_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${camp_id}/deliverables"
              payload: { content_type: "FEED_POST", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 40000 }
              as: Brand
              as_user_id: "${brand_a}"
          trigger:
            - call: "POST /campaigns/${camp_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_b}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "data.error_id == 'ERR_NOT_RESOURCE_OWNER'"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ['validations[priority=1]', 'errors[ERR_UNAUTHENTICATED]']
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /creators"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "data.error_id == 'ERR_UNAUTHENTICATED'"

  # =================================================================
  # Cross-cutting complexity layers — OCC, derived-field reconciliation
  # =================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_offer_counter_returns_412
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[offer-counter-stale-offer]', 'errors[ERR_STALE_OFFER_VERSION]', state_machines.Offer.OFFERED_to_COUNTERED]
        distinguishing_aspect: "Countering an offer with a stale expected_offer_version (one less than current after a prior counter) returns ERR_STALE_OFFER_VERSION (412)."
        test_recipe:
          setup: ["OPEN campaign; Brand offer; Creator counters once (offer version advanced)"]
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "OC", contact_email: "oc@oc.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@oc", primary_platform: "INSTAGRAM" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /campaigns"
              payload: { brand_id: "${brand_id}", title: "OC", campaign_budget_cents: 300000, requires_ftc_disclosure: false, starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-03-01T00:00:00Z" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { campaign_id: $.data.id, cv0: $.data.version }
            - call: "POST /campaigns/${campaign_id}/deliverables"
              payload: { content_type: "FEED_POST", quantity: 1, due_at: "2026-02-20T00:00:00Z", base_rate_cents: 60000 }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /campaigns/${campaign_id}/open"
              payload: { expected_campaign_version: "${cv0}" }
              as: Brand
              as_user_id: "${brand_id}"
            - call: "POST /offers"
              payload: { campaign_id: "${campaign_id}", creator_id: "${creator_id}", current_amount_cents: 60000, exclusivity_days: 0 }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { offer_id: $.data.id, ov0: $.data.version }
            - call: "POST /offers/${offer_id}/counter"
              payload: { counter_amount_cents: 70000, expected_offer_version: "${ov0}" }
              as: Creator
              as_user_id: "${creator_id}"
              captures: { ov1: $.data.version }
          trigger:
            - call: "POST /offers/${offer_id}/counter"
              payload: { counter_amount_cents: 65000, expected_offer_version: "${ov1} - 1" }
              as: Brand
              as_user_id: "${brand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "data.error_id == 'ERR_STALE_OFFER_VERSION'"

      - name: occ_stale_contract_payout_returns_412
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[payout-create-stale-contract]', 'errors[ERR_STALE_CONTRACT_VERSION]', state_machines.Payout.NEW_to_PENDING]
        distinguishing_aspect: "Creating a payout with a stale expected_contract_version (one less than the FULFILLED contract's current version) returns ERR_STALE_CONTRACT_VERSION (412)."
        test_recipe:
          setup: ["A FULFILLED contract whose version advanced past the caller's observed value"]
          setup_api_calls:
            - call: "POST /brands"
              payload: { legal_name: "SC", contact_email: "sc@sc.com", budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /creators"
              payload: { handle: "@sc", primary_platform: "YOUTUBE", tax_id_on_file: true }
