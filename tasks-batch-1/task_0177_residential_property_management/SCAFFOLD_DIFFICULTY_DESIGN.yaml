  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: trust_conservation_rent_in_distribution_out
        grounds:
          - calculations.payment_waterfall
          - calculations.property_distributable
          - state_machines.OwnerStatement.FINALIZED_to_DISTRIBUTED
          - entities.Property.fields.trust_balance_cents
          - entities.Property.fields.distributable_cents
        distinguishing_aspect: |
          Conserved quantity = Property trust cents. Forward action (payment applies
          137500 rent -> trust 137500) paired with compensating action (distribution
          debits exactly net_to_owner) leaves trust_balance_cents == collected -
          distributed with zero drift: 137500 collected, 126500 distributed -> 11000 left.
        test_recipe:
          setup:
            - "CA property reserve_floor 0; ACTIVE lease; one RENT charge 2026-06 of 200000; late fee 12500 assessed; payment 150000 -> 12500 to late fee, 137500 to rent (trust 137500); CASH statement net 126500 finalized."
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "O15", email: "o15@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "P15", state_code: "CA", address: "A15", reserve_floor_cents: 0 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "U15", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Inv", email: "i15@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 700, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
            - call: "POST /applicants/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", applicant_id: "${app_id}", start_date: "2026-06-01", end_date: "2027-06-01", monthly_rent_cents: 200000, late_fee_pct: 0.05, late_fee_flat_cents: 2500, grace_period_days: 5 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /security-deposits"
              payload: { lease_id: "${lease_id}", collected_cents: 200000, collected_date: "2026-06-01" }
              as: PropertyManager
            - call: "POST /leases/${lease_id}/sign"
              payload: {}
              as: PropertyManager
            - call: "POST /rent-charges"
              payload: { lease_id: "${lease_id}", period_label: "2026-06", due_date: "2026-06-01", amount_cents: 200000, charge_type: "RENT" }
              as: PropertyManager
            - call: "POST /leases/${lease_id}/assess-late-fees"
              payload: { as_of_date: "2026-06-09" }
              as: PropertyManager
            - call: "POST /payments"
              payload: { lease_id: "${lease_id}", amount_cents: 150000, received_date: "2026-06-10" }
              as: PropertyManager
            - call: "POST /owner-statements"
              payload: { property_id: "${prop_id}", period_label: "2026-06", basis: "CASH" }
              as: PropertyManager
              captures: { stmt_id: $.data.id }
            - call: "POST /owner-statements/${stmt_id}/finalize"
              payload: {}
              as: PropertyManager
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: PropertyManager
              captures: { prop_v: $.data.version, trust_before: $.data.trust_balance_cents }
          trigger:
            - call: "POST /owner-statements/${stmt_id}/distribute"
              payload: { expected_property_version: "${prop_v}" }
              as: PropertyManager
              captures: { dist: $.data.distribution_cents }
          assert:
            - "trust_balance_cents before distribution == 137500"
            - "OwnerStatement.${stmt_id}.distribution_cents == 126500"
            - "Property.${prop_id}.trust_balance_cents == 11000 (== 137500 collected - 126500 distributed, zero drift)"

      - name: lease_balance_conservation_charge_then_waive
        grounds:
          - state_machines.RentCharge.OPEN_to_WAIVED
          - calculations.late_fee_assessment
          - entities.Lease.fields.balance_due_cents
          - entities.RentCharge.fields.amount_outstanding_cents
