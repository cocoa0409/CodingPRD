- section: rbac
  instances:
  - name: venue_and_event_authoring_are_exclusive_to_the_security_director_returns_forbidden
    claim_type: exclusive_operations
    grounds:
    - roles.SecurityDirector.exclusive_operations
    - validations[priority=2]
    - errors.ERR_ROLE_NOT_PERMITTED
    distinguishing_aspect: |
      SecurityDirector owns the four write paths that no other role appears on — venue create, event create, event PATCH and the event lifecycle — and the priority-2 check is a pure endpoint-membership test, so every OTHER role must be refused with 403 on each of them. Probing several distinct roles matters because an implementation that hard-codes only the obvious near-miss (StaffingCoordinator) still lets RiskAnalyst and IncidentCommander through.
