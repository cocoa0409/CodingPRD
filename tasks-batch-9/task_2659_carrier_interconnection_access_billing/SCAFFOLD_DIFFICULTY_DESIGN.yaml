- rule_id: cross_entity_state_dependency
  instances:
  - name: trunk_group_activation_requires_effective_parent_agreement
    grounds:
    - validations[priority=26]
    - errors[ERR_AGREEMENT_NOT_EFFECTIVE]
    - state_machines.TrunkGroup.PROVISIONED_to_IN_SERVICE
    - state_machines.InterconnectionAgreement.EXECUTED_to_EFFECTIVE
    - entities.InterconnectionAgreement.fields.total_in_service_trunks
    distinguishing_aspect: |
      Entity pair (TrunkGroup, InterconnectionAgreement): the child's PROVISIONED -> IN_SERVICE transition is gated on the parent agreement's status being EFFECTIVE, so the identical activate call fails at 409 and then succeeds once only the parent moved. This pair differs from the (UsageBatch, TariffFiling) pair used by this rule's other instance.
    test_recipe:
      setup:
      - A carrier and an EFFECTIVE LOCAL_RECIPROCAL_COMP tariff filing.
      - An EXECUTED (not yet activated) agreement with poi_facility_capacity_trunks 192.
      - One PROVISIONED TWO_WAY trunk group at DLLSTXCTDS0 with 48 trunks, still awaiting activation.
      - Logical clock at the 2026-08-01T00:00:00Z default, which has reached the agreement's effective_date.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-LOC-001
          rate_element: LOCAL_RECIPROCAL_COMP
