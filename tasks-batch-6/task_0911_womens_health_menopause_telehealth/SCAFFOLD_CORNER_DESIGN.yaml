              payload: { patient_id: "${pat_b}", provider_id: "${prov_id}", intake_assessment_id: "${intake_a}", scheduled_start: "2026-05-31T09:00:00Z", scheduled_end: "2026-05-31T10:00:00Z" }
              as: Patient
