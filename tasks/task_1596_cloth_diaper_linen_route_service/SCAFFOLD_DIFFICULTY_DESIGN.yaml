# =============================================================================
# §1.8 Scaffold Difficulty Design — Cloth Diaper & Linen Route Service
# 9 rules x 2-4 instances = 24 instances. All chains replay from empty-DB.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: intake_verified_count_count_vs_weight_basis
        grounds:
          - calculations.soiled_weight_reconciliation
          - entities.SubscriptionPlan.fields.weight_policy
          - calculations.invoice_total_composition
        distinguishing_aspect: |
          Dual-variant logic on the SoiledIntake domain: identical intake data (clean 80,
          scale 8800 g, MEDIUM tare 40 g x 2.5 = 100 g/item) yields verified_count 80 under
          COUNT_BASIS but 88 under WEIGHT_BASIS, so the two subscriptions' weekly invoices
          diverge by exactly 80 cents of overage on identical physical data.
        test_recipe:
          setup:
            - "Two ACTIVE subscriptions in zone Z-NORTH (MON/THU): A on plan STANDARD (COUNT_BASIS, quota 80, fee 3900, overage 10), B on plan STANDARD_W (WEIGHT_BASIS, identical money fields)"
            - "Route 2026-08-03 IN_PROGRESS with both stops COMPLETED at clean_items_delivered 80"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/subscription-plans", payload: { tier_code: "STANDARD", weekly_quota: 80, weekly_fee_cents: 3900, overage_rate_cents: 10, overage_cap_items: 20, deposit_cents: 18000, service_bags_per_week: 1, weight_policy: "COUNT_BASIS", kit_reserve_pct: 10 }, as: PlatformAdmin, captures: { plan_c: $.data.id } }
            - { call: "POST /api/subscription-plans", payload: { tier_code: "STANDARD_W", weekly_quota: 80, weekly_fee_cents: 3900, overage_rate_cents: 10, overage_cap_items: 20, deposit_cents: 18000, service_bags_per_week: 1, weight_policy: "WEIGHT_BASIS", kit_reserve_pct: 10 }, as: PlatformAdmin, captures: { plan_w: $.data.id } }
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON", "THU"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /api/inventory-pools", payload: { size_code: "MEDIUM" }, as: PlatformAdmin, captures: { pool_m: $.data.id } }
            - { call: "POST /api/inventory-pools/${pool_m}/adjustments", payload: { adjustment_type: "ACQUIRE", units: 500 }, as: PlatformAdmin }
            - { call: "POST /api/customers", payload: { full_name: "A Count", email: "a@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_a: $.data.id } }
            - { call: "POST /api/customers", payload: { full_name: "B Weight", email: "b@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_b: $.data.id } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_a}", subscription_plan_id: "${plan_c}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_a: $.data.id } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_b}", subscription_plan_id: "${plan_w}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_b: $.data.id } }
            - { call: "GET /api/starter-kits?subscription_id=${sub_a}", as: PlatformAdmin, captures: { kit_a: "$.data[0].id" } }
            - { call: "GET /api/starter-kits?subscription_id=${sub_b}", as: PlatformAdmin, captures: { kit_b: "$.data[0].id" } }
            - { call: "POST /api/starter-kits/${kit_a}/events", payload: { event_type: "ISSUE" }, as: PlantOperator }
            - { call: "POST /api/starter-kits/${kit_b}/events", payload: { event_type: "ISSUE" }, as: PlantOperator }
            - { call: "POST /api/customers/${cust_a}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/customers/${cust_b}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/subscriptions/${sub_a}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/subscriptions/${sub_b}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/routes", payload: { service_zone_id: "${zone_id}", route_date: "2026-08-03" }, as: PlatformAdmin, captures: { route_id: $.data.id } }
            - { call: "GET /api/route-stops?route_id=${route_id}&subscription_id=${sub_a}", as: PlatformAdmin, captures: { stop_a: "$.data[0].id" } }
            - { call: "GET /api/route-stops?route_id=${route_id}&subscription_id=${sub_b}", as: PlatformAdmin, captures: { stop_b: "$.data[0].id" } }
            - { call: "POST /api/routes/${route_id}/sequence", as: PlatformAdmin }
            - { call: "POST /api/routes/${route_id}/events", payload: { event_type: "LOCK" }, as: PlatformAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/routes/${route_id}/events", payload: { event_type: "START" }, as: PlatformAdmin, captures: { route_v1: $.data.version } }
            - { call: "POST /api/route-stops/${stop_a}/complete", payload: { soiled_bags_collected: 1, clean_items_delivered: 80, expected_route_version: "${route_v1}" }, as: RouteDriver }
            - { call: "GET /api/routes/${route_id}", as: PlatformAdmin, captures: { route_v2: $.data.version } }
            - { call: "POST /api/route-stops/${stop_b}/complete", payload: { soiled_bags_collected: 1, clean_items_delivered: 80, expected_route_version: "${route_v2}" }, as: RouteDriver }
            - { call: "POST /api/soiled-intakes", payload: { route_stop_id: "${stop_a}", scale_weight_g: 8800, soil_level: "NORMAL" }, as: PlantOperator, captures: { intake_a: $.data.id, ver_a: $.data.verified_count } }
            - { call: "POST /api/soiled-intakes", payload: { route_stop_id: "${stop_b}", scale_weight_g: 8800, soil_level: "NORMAL" }, as: PlantOperator, captures: { intake_b: $.data.id, ver_b: $.data.verified_count } }
          trigger:
            - { call: "POST /api/invoices/generate", payload: { subscription_id: "${sub_a}", period_start: "2026-08-03", period_end: "2026-08-10" }, as: BillingAdmin, captures: { inv_a: $.data.id, tot_a: $.data.total_cents, ovg_a: $.data.overage_cents } }
            - { call: "POST /api/invoices/generate", payload: { subscription_id: "${sub_b}", period_start: "2026-08-03", period_end: "2026-08-10" }, as: BillingAdmin, captures: { inv_b: $.data.id, tot_b: $.data.total_cents, ovg_b: $.data.overage_cents } }
          assert:
            - "SoiledIntake.${intake_a}.verified_count == 80 (COUNT_BASIS pins curbside count)"
            - "SoiledIntake.${intake_b}.verified_count == 88 (WEIGHT_BASIS: round_half_up(8800/100))"
            - "Invoice.${inv_a}.overage_cents == 0 and Invoice.${inv_a}.total_cents == 3900"
            - "Invoice.${inv_b}.overage_cents == 80 and Invoice.${inv_b}.total_cents == 3980"
            - "Same physical intake data, different plan weight_policy -> 80-cent invoice divergence"

      - name: pause_proration_provisional_vs_final
        grounds:
          - calculations.invoice_pause_proration
          - entities.ServicePause.fields.estimated_credit_cents
          - entities.ServicePause.fields.final_credit_cents
        distinguishing_aspect: |
          Dual-variant logic on the ServicePause/Invoice domain (distinct from the
          SoiledIntake variant pair): the PROVISIONAL whole-week estimate credits 3200 for a
          2-service-day pause while the FINAL per-day-rounded variant credits 2134 on
          identical dates (zone with 3 service days/week, plan fee 3200).
        test_recipe:
          setup:
            - "ACTIVE subscription on plan ESSENTIAL (fee 3200, quota 60) in zone Z-TRI (MON/WED/FRI, 3 service days/week); clock at 2026-08-01"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/subscription-plans", payload: { tier_code: "ESSENTIAL", weekly_quota: 60, weekly_fee_cents: 3200, overage_rate_cents: 12, overage_cap_items: 20, deposit_cents: 15000, service_bags_per_week: 1, weight_policy: "COUNT_BASIS", kit_reserve_pct: 10 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-TRI", service_weekdays: ["MON", "WED", "FRI"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /api/inventory-pools", payload: { size_code: "MEDIUM" }, as: PlatformAdmin, captures: { pool_m: $.data.id } }
            - { call: "POST /api/inventory-pools/${pool_m}/adjustments", payload: { adjustment_type: "ACQUIRE", units: 500 }, as: PlatformAdmin }
            - { call: "POST /api/customers", payload: { full_name: "P Traveler", email: "p@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_id}", subscription_plan_id: "${plan_id}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_id: $.data.id } }
            - { call: "GET /api/starter-kits?subscription_id=${sub_id}", as: PlatformAdmin, captures: { kit_id: "$.data[0].id" } }
            - { call: "POST /api/starter-kits/${kit_id}/events", payload: { event_type: "ISSUE" }, as: PlantOperator }
            - { call: "POST /api/customers/${cust_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/subscriptions/${sub_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin, captures: { sub_v: $.data.version } }
          trigger:
            - { call: "POST /api/service-pauses", payload: { subscription_id: "${sub_id}", start_date: "2026-08-05", end_date: "2026-08-10", expected_subscription_version: "${sub_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { pause_id: $.data.id, est_credit: $.data.estimated_credit_cents } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/service-pauses/${pause_id}", as: PlatformAdmin, captures: { final_credit: $.data.final_credit_cents, pause_status: $.data.status } }
            - { call: "GET /api/subscriptions/${sub_id}", as: PlatformAdmin, captures: { sub_status: $.data.service_status } }
          assert:
            - "ServicePause.${pause_id}.estimated_credit_cents == 3200 (PROVISIONAL: 1 whole billing week touched x 3200)"
            - "ServicePause.${pause_id}.final_credit_cents == 2134 (FINAL: round_half_up(3200/3)=1067 per paused service day, 1067+1067 for Wed 08-05 and Fri 08-07)"
            - "ServicePause.${pause_id}.status == COMPLETED"
            - "Subscription.${sub_id}.service_status == ACTIVE (resumed when the clock reached end_date 2026-08-10)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: wash_dosing_multifactor_with_clamp
        grounds:
          - calculations.wash_chemistry_dosing
          - entities.WashBatch.fields.dosed_detergent_ml
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula (base rate x load_kg x soil multiplier x
          hardness multiplier, then round_half_up, then clamp to [60, 900]): at 12000 g,
          HEAVY (1.25), HARD (1.15), base 45 the detergent dose is exactly 776 ml
          (776.25 rounded) and sanitizer 96 ml.
        test_recipe:
          setup:
            - "ACTIVE STANDARD subscription in Z-NORTH; route 2026-08-03 completed with clean_items_delivered 120; intake scale 12000 g (expected 120 x 100 g = 12000, variance 0, RECONCILED)"
            - "Wash formula F-SANI: base 45 ml/kg, sanitizer 8 ml/kg, 71C/180s/[50,200] ppm"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/subscription-plans", payload: { tier_code: "STANDARD", weekly_quota: 80, weekly_fee_cents: 3900, overage_rate_cents: 10, overage_cap_items: 20, deposit_cents: 18000, service_bags_per_week: 1, weight_policy: "COUNT_BASIS", kit_reserve_pct: 10 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON", "THU"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /api/inventory-pools", payload: { size_code: "MEDIUM" }, as: PlatformAdmin, captures: { pool_m: $.data.id } }
            - { call: "POST /api/inventory-pools/${pool_m}/adjustments", payload: { adjustment_type: "ACQUIRE", units: 500 }, as: PlatformAdmin }
            - { call: "POST /api/customers", payload: { full_name: "D Oser", email: "d@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_id}", subscription_plan_id: "${plan_id}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_id: $.data.id } }
            - { call: "GET /api/starter-kits?subscription_id=${sub_id}", as: PlatformAdmin, captures: { kit_id: "$.data[0].id" } }
            - { call: "POST /api/starter-kits/${kit_id}/events", payload: { event_type: "ISSUE" }, as: PlantOperator }
            - { call: "POST /api/customers/${cust_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/subscriptions/${sub_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/routes", payload: { service_zone_id: "${zone_id}", route_date: "2026-08-03" }, as: PlatformAdmin, captures: { route_id: $.data.id } }
            - { call: "GET /api/route-stops?route_id=${route_id}&subscription_id=${sub_id}", as: PlatformAdmin, captures: { stop_id: "$.data[0].id" } }
            - { call: "POST /api/routes/${route_id}/sequence", as: PlatformAdmin }
            - { call: "POST /api/routes/${route_id}/events", payload: { event_type: "LOCK" }, as: PlatformAdmin }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/routes/${route_id}/events", payload: { event_type: "START" }, as: PlatformAdmin, captures: { route_v: $.data.version } }
            - { call: "POST /api/route-stops/${stop_id}/complete", payload: { soiled_bags_collected: 1, clean_items_delivered: 120, expected_route_version: "${route_v}" }, as: RouteDriver }
            - { call: "POST /api/soiled-intakes", payload: { route_stop_id: "${stop_id}", scale_weight_g: 12000, soil_level: "HEAVY" }, as: PlantOperator, captures: { intake_id: $.data.id } }
            - { call: "POST /api/wash-formulas", payload: { formula_code: "F-SANI", base_detergent_ml_per_kg: 45, sanitizer_ml_per_kg: 8, min_temp_celsius: 71, min_dwell_seconds: 180, chlorine_ppm_min: 50, chlorine_ppm_max: 200, max_rewash_count: 2 }, as: PlatformAdmin, captures: { form_id: $.data.id } }
            - { call: "POST /api/wash-batches", payload: { wash_formula_id: "${form_id}", soil_level: "HEAVY", water_hardness: "HARD" }, as: PlantOperator, captures: { batch_id: $.data.id } }
            - { call: "POST /api/wash-batches/${batch_id}/load", payload: { soiled_intake_ids: ["${intake_id}"] }, as: PlantOperator }
          trigger:
            - { call: "POST /api/wash-batches/${batch_id}/events", payload: { event_type: "START_WASH" }, as: PlantOperator, as_user_id: "op-1", captures: { det_ml: $.data.dosed_detergent_ml, san_ml: $.data.dosed_sanitizer_ml, load_g: $.data.total_load_g } }
          assert:
            - "WashBatch.${batch_id}.total_load_g == 12000"
            - "WashBatch.${batch_id}.dosed_detergent_ml == 776 (45 x 12.0 kg x 1.25 x 1.15 = 776.25, round_half_up to 776, clamp [60,900] not engaged)"
            - "WashBatch.${batch_id}.dosed_sanitizer_ml == 96 (8 x 12.0 kg, never clamped)"

      - name: invoice_per_line_rounding_then_sum
        grounds:
          - calculations.invoice_total_composition
          - calculations.invoice_pause_proration
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned per-line-then-sum. A 3200-cent weekly fee
          over a 3-service-day zone credits round_half_up(3200/3)=1067 per paused day, so a
          2-day pause credits 2134 on the invoice — the forbidden sum-then-round order would
          give round_half_up(6400/3)=2133, one cent less.
        test_recipe:
          setup:
            - "ACTIVE ESSENTIAL subscription (fee 3200) in Z-TRI (MON/WED/FRI); pause 2026-08-05..2026-08-10 ACTIVE (covers Wed 08-05 and Fri 08-07); clock mid-pause at 2026-08-08"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/subscription-plans", payload: { tier_code: "ESSENTIAL", weekly_quota: 60, weekly_fee_cents: 3200, overage_rate_cents: 12, overage_cap_items: 20, deposit_cents: 15000, service_bags_per_week: 1, weight_policy: "COUNT_BASIS", kit_reserve_pct: 10 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-TRI", service_weekdays: ["MON", "WED", "FRI"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /api/inventory-pools", payload: { size_code: "MEDIUM" }, as: PlatformAdmin, captures: { pool_m: $.data.id } }
            - { call: "POST /api/inventory-pools/${pool_m}/adjustments", payload: { adjustment_type: "ACQUIRE", units: 500 }, as: PlatformAdmin }
            - { call: "POST /api/customers", payload: { full_name: "R Ounding", email: "r@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_id}", subscription_plan_id: "${plan_id}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_id: $.data.id } }
            - { call: "GET /api/starter-kits?subscription_id=${sub_id}", as: PlatformAdmin, captures: { kit_id: "$.data[0].id" } }
            - { call: "POST /api/starter-kits/${kit_id}/events", payload: { event_type: "ISSUE" }, as: PlantOperator }
            - { call: "POST /api/customers/${cust_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin }
            - { call: "POST /api/subscriptions/${sub_id}/events", payload: { event_type: "ACTIVATE" }, as: PlatformAdmin, captures: { sub_v: $.data.version } }
            - { call: "POST /api/service-pauses", payload: { subscription_id: "${sub_id}", start_date: "2026-08-05", end_date: "2026-08-10", expected_subscription_version: "${sub_v}" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T09:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/invoices/generate", payload: { subscription_id: "${sub_id}", period_start: "2026-08-03", period_end: "2026-08-10" }, as: BillingAdmin, captures: { inv_id: $.data.id, base_c: $.data.base_fee_cents, credit_c: $.data.pause_credit_cents, tot_c: $.data.total_cents, ovg_c: $.data.overage_cents } }
          assert:
            - "Invoice.${inv_id}.base_fee_cents == 3200"
            - "Invoice.${inv_id}.pause_credit_cents == 2134 (per-line 1067 + 1067; sum-then-round 2133 is forbidden)"
            - "Invoice.${inv_id}.overage_cents == 0"
            - "Invoice.${inv_id}.total_cents == 1066 (3200 + 0 - 2134)"

      - name: damage_surcharge_pinned_evaluation_order
        grounds:
          - calculations.damage_charge_with_surcharge
          - calculations.lost_item_charge_schedule
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — the 10% damage
          surcharge is keyed on deposit utilization computed BEFORE the current charge is
          applied. With 12000 of 18000 already applied (ratio 0.667 > 0.50) a 4000-cent fee
          charges 4400; with 720 applied (ratio 0.04) the same-shape 1000-cent fee charges 1000.
        test_recipe:
          setup:
            - "Customer A ACTIVE, deposit_charged 18000, MEDIUM pool funded; customer B ACTIVE with identical plan (deposit 18000, nothing applied)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/subscription-plans", payload: { tier_code: "STANDARD", weekly_quota: 80, weekly_fee_cents: 3900, overage_rate_cents: 10, overage_cap_items: 20, deposit_cents: 18000, service_bags_per_week: 1, weight_policy: "COUNT_BASIS", kit_reserve_pct: 10 }, as: PlatformAdmin, captures: { plan_id: $.data.id } }
            - { call: "POST /api/service-zones", payload: { zone_code: "Z-NORTH", service_weekdays: ["MON", "THU"], stop_cutoff_hours: 24, active: true }, as: PlatformAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /api/inventory-pools", payload: { size_code: "MEDIUM" }, as: PlatformAdmin, captures: { pool_m: $.data.id } }
            - { call: "POST /api/inventory-pools/${pool_m}/adjustments", payload: { adjustment_type: "ACQUIRE", units: 500 }, as: PlatformAdmin }
            - { call: "POST /api/customers", payload: { full_name: "S Urcharge", email: "s@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_a: $.data.id } }
            - { call: "POST /api/customers", payload: { full_name: "L Owutil", email: "l@x.com", service_zone_id: "${zone_id}", child_birthdate: "2026-01-15", child_size_code: "MEDIUM" }, as: PlatformAdmin, captures: { cust_b: $.data.id } }
            - { call: "POST /api/subscriptions", payload: { customer_id: "${cust_a}", subscription_plan_id: "${plan_id}", service_zone_id: "${zone_id}", start_date: "2026-08-01", current_size_code: "MEDIUM", window_start_minutes: 480, window_end_minutes: 720 }, as: PlatformAdmin, captures: { sub_a: $.data.id } }
