            - "Candidate.${cand_id}.status is still \"WITHDRAWN\" and deferred_cycle_year is null"
            - "GET /governance/candidates/${cand_id}/screens returns 0 rows"

      - name: candidate_cyclic_loop_shape_is_exercised_by_the_cross_cycle_reopen
        claim_type: valid_transition
        grounds:
          - state_machines.Candidate.DEFERRED_to_SCREENING
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / candidate_cross_cycle_loop_nominated_to_deferred_back_to_screening
          rationale: "The declared cyclic shape - SCREENING revisited through NOMINATED -> DEFERRED -> SCREENING with the cross-cycle policy guard - is asserted end to end by that §1.8 instance."

      - name: director_parallel_dimensions_shape_is_exercised_by_the_three_dimension_walk
        claim_type: valid_transition
        grounds:
          - state_machines.Director.ONBOARDING_to_SEATED
          - state_machines.Director.COMPLIANT_to_OVERBOARDED
          - state_machines.Director.IN_PROGRESS_to_COMPLETE
        excluded_because:
          difficulty_instance: non_linear_state_machine / director_three_parallel_dimensions_advance_without_touching_each_other
          rationale: "The parallel/compound shape claim - independent dimensions moving without disturbing each other - is that instance's entire subject."

      - name: screen_determination_cascade_side_effects_are_exercised_at_depth_five
        claim_type: side_effect_execution
        grounds:
          - state_machines.Candidate.NOMINATED_to_REJECTED
          - state_machines.CommitteeVote.CAST_to_VOIDED_BY_REVISION
        excluded_because:
          difficulty_instance: transitive_cascade / supplemental_rescreen_not_independent_cascades_screen_to_candidate_to_nominee_to_slate_to_ballots
          rationale: "Every side effect of the NOMINATED -> REJECTED transition, including the ledger sync and the ballot voiding, is asserted hop by hop there."

      - name: departure_notice_cascade_side_effects_are_exercised_on_assignments_and_awards
        claim_type: side_effect_execution
        grounds:
          - state_machines.Director.SEATED_to_RESIGNED
          - state_machines.CommitteeAssignment.ACTIVE_to_ENDED
          - state_machines.DirectorCompensationAward.DRAFT_to_VOIDED
        excluded_because:
          difficulty_instance: transitive_cascade / resignation_notice_cascades_director_to_assignment_to_committee_ledger_and_voids_draft_award
          rationale: "The cross-entity and ledger-sync side effects of the RESIGNATION notice are asserted there, including the derived committee posture."

  - section: calculations
    instances:
      - name: active_policy_selector_never_consults_a_superseded_row
        claim_type: input_set_filtering
        grounds:
          - calculations.active_policy_selector
          - endpoints.POST_/governance/policies
          - validations.priority_65.ERR_QUORUM_NOT_MET
        distinguishing_aspect: |
          Adopting a second policy flips the first to SUPERSEDED, and every later threshold read must come
          from the surviving ACTIVE row: with policy A demanding quorum_size 3 and policy B demanding
          quorum_size 1, a slate decided on a single ballot is APPROVED, which is only possible if the
          SUPERSEDED row was excluded from the selector's input set.
        test_recipe:
          setup:
            - "GovernancePolicy A for cycle 2026 effective 2026-01-01 with quorum_size 3, then GovernancePolicy B for cycle 2026 effective 2026-06-01 with quorum_size 1."
            - "One SEATED independent chair director and one SEATED independent incumbent director."
            - "A DRAFT slate for cycle 2026 carrying the incumbent, submitted for review, with exactly one FOR ballot."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z", quorum_size: 3 }
              as: CorporateSecretary
              captures: { policy_a_id: $.data.id }
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-06-01T00:00:00Z", quorum_size: 1 }
              as: CorporateSecretary
              captures: { policy_b_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Dana Chair", email: "dana.chair@issuer.example", birth_date: "1962-03-15", appointed_on: "2019-05-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { chair_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Ida Incumbent", email: "ida@issuer.example", birth_date: "1968-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED", is_independent: true }
              as: CorporateSecretary
              captures: { dir_id: $.data.id }
            - call: "POST /governance/slates"
              payload: { cycle_year: 2026, seat_count: 9 }
              as: CorporateSecretary
              captures: { slate_id: $.data.id, slate_v1: $.data.version }
            - call: "POST /governance/slates/${slate_id}/nominees"
              payload: { ballot_order: 1, incumbent_director_id: "${dir_id}", expected_slate_version: "${slate_v1}" }
              as: GovernanceStaff
              captures: { nom_id: $.data.id }
            - call: "POST /governance/slates/${slate_id}/submit-for-review"
              payload: {}
              as: GovernanceStaff
            - call: "POST /governance/slates/${slate_id}/votes"
              payload: { voting_director_id: "${chair_id}", ballot: "FOR" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { vote_id: $.data.id }
          trigger:
            - call: "POST /governance/slates/${slate_id}/decide"
              payload: { decision: "APPROVE", rationale: "Single-ballot quorum under the surviving policy" }
              as: CommitteeChair
              as_user_id: "${chair_id}"
            - call: "GET /governance/policies"
              payload: { status: "ACTIVE" }
              as: GovernanceStaff
          assert:
            - "GovernancePolicy.${policy_a_id}.status == \"SUPERSEDED\" and GovernancePolicy.${policy_b_id}.status == \"ACTIVE\""
            - "The ACTIVE-filtered policy list returns exactly 1 row with total_count == 1, and its id == ${policy_b_id}"
            - "The decide call returns HTTP 200 with NominationSlate.${slate_id}.status == \"APPROVED\""
            - "NominationSlate.${slate_id}.quorum_met == true and approval_pct == 100.00 on a single CAST ballot"
            - "No response carries \"ERR_QUORUM_NOT_MET\", proving the quorum_size 3 of the SUPERSEDED row was never read"

      - name: skills_gap_analysis_drops_a_resigned_director_from_the_coverage_count
        claim_type: input_set_filtering
        grounds:
          - calculations.skills_gap_analysis
          - endpoints.GET_/governance/skills-matrix/gap-analysis
          - state_machines.Director.SEATED_to_RESIGNED
        distinguishing_aspect: |
          The input set is restricted to directors whose service_status is SEATED or ONBOARDING, so a
          RESIGNED director stops counting toward coverage even though the rating row still exists: the same
          category flips from COVERED with board_gap_index 0.00 to MINOR_GAP with board_gap_index 1.20
          (gap 1 * strategic_weight 0.80 * risk multiplier 1.5) and seated_director_count drops from 2 to 1.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026."
            - "One risk-oversight SkillCategory CYBER (strategic_weight 0.80, required_min_directors 2, criticality CORE)."
            - "Two SEATED directors, each with a self_rating of 4 on CYBER."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/skill-categories"
              payload: { code: "CYBER", name: "Cybersecurity Oversight", strategic_weight: 0.80, required_min_directors: 2, risk_oversight: true, criticality: "CORE" }
              as: GovernanceStaff
              captures: { cat_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Stay Put", email: "stay@issuer.example", birth_date: "1970-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { stay_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Leaves Soon", email: "leaves@issuer.example", birth_date: "1971-01-01", appointed_on: "2021-01-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { leave_id: $.data.id }
            - call: "POST /governance/directors/${stay_id}/skill-ratings"
              payload: { skill_category_id: "${cat_id}", self_rating: 4 }
              as: GovernanceStaff
