# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2770 - Fitness Franchise Membership & Territory Administration
# Breadth walk over references/claim-extraction-guide.md's nine sections against this
# scaffold's §1.1-§1.7. Corners already asserted by a §1.8 instance are emitted as
# excluded_because stubs naming that instance. Every numeric assert is a pre-computed
# literal obtained by executing the §1.3 formulas with their §1.3 constants.
scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_franchisee_created_with_explicit_royalty_rate_and_zeroed_counters
        claim_type: creation
        grounds:
          - entities.Franchisee
          - endpoints[POST /franchise/franchisees]
        distinguishing_aspect: "A franchisee registered with an explicit royalty_rate_bps of 900 stores 900 (not the 650 default) and every computed counter starts at its documented zero, with status ACTIVE and compliance_score 100 - the registration endpoint performs no scoring work of its own."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Summit Strength Holdings LLC", contact_email: "ops@summitstrength.example", royalty_rate_bps: 900, national_account_eligible: false }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
          assert:
            - "response status == 201"
            - "response response_type == object"
            - "Franchisee.${f1_id}.legal_name == Summit Strength Holdings LLC"
            - "Franchisee.${f1_id}.royalty_rate_bps == 900"
            - "Franchisee.${f1_id}.national_account_eligible == false"
            - "Franchisee.${f1_id}.status == ACTIVE"
            - "Franchisee.${f1_id}.compliance_score == 100"
            - "Franchisee.${f1_id}.inspection_fail_streak == 0"
            - "Franchisee.${f1_id}.collections_watch_club_count == 0"
            - "Franchisee.${f1_id}.disputed_royalty_count == 0"
            - "Franchisee.${f1_id}.corporate_allocation_cents == 0"
            - "Franchisee.${f1_id}.version == 1"

      - name: corner_franchisee_defaults_royalty_rate_and_national_account_flag
        claim_type: defaults
        grounds:
          - entities.Franchisee.fields.royalty_rate_bps
          - entities.Franchisee.fields.national_account_eligible
          - endpoints[POST /franchise/franchisees]
        distinguishing_aspect: "Omitting both optional inputs yields royalty_rate_bps 650 and national_account_eligible true - the two defaults that decide the franchisee's royalty basis and its eligibility for corporate pool allocation, so a wrong default silently mis-bills every later royalty report."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harborline Fitness LLC", contact_email: "ops@harborlinefit.example" }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
          assert:
            - "response status == 201"
            - "Franchisee.${f1_id}.royalty_rate_bps == 650"
            - "Franchisee.${f1_id}.national_account_eligible == true"

      - name: corner_territory_creation_rejects_missing_protected_radius
        claim_type: required_fields
        grounds:
          - entities.Territory.fields.protected_radius_km
          - validations[priority 4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "protected_radius_km has source input and no default, so omitting it is a priority-4 schema failure (400 ERR_INVALID_REQUEST) rather than a territory created with a null or zero radius that would later make every encroachment slack meaningless."
        test_recipe:
          setup:
            - "One registered franchisee."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harborline Fitness LLC", contact_email: "ops@harborlinefit.example" }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, state_code: "CA" }
              as: BrandAdministrator
          assert:
            - "response status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: corner_territory_radius_below_half_kilometre_is_out_of_range
        claim_type: type_constraints
        grounds:
          - entities.Territory.fields.protected_radius_km
          - entities.Territory.fields.state_code
          - validations[priority 4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Two separate §1.1 constraint kinds on the same endpoint: a protected_radius_km of 0.4 is below the declared 0.5 lower bound and a state_code of 'AZ' is outside the CA|TX|NY enum - both are 400 ERR_INVALID_REQUEST, proving the numeric range and the enum closure are both enforced rather than only the enum."
        test_recipe:
          setup:
            - "One registered franchisee."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harborline Fitness LLC", contact_email: "ops@harborlinefit.example" }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 0.4, state_code: "CA" }
              as: BrandAdministrator
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "AZ" }
              as: BrandAdministrator
          assert:
            - "the 0.4-radius response status == 400"
            - "the 0.4-radius response data.error_id == ERR_INVALID_REQUEST"
            - "the AZ response status == 400"
            - "the AZ response data.error_id == ERR_INVALID_REQUEST"
            - "GET /franchise/territories returns total_count == 0"

      - name: corner_territory_creation_rejects_unknown_franchisee
        claim_type: parent_relationships
        grounds:
          - entities.Territory.parent
          - validations[priority 5]
          - errors[ERR_FRANCHISEE_NOT_FOUND]
        distinguishing_aspect: "Territory declares Franchisee as its parent, so a syntactically valid but unknown franchisee_id is a priority-5 existence failure with the parent-specific code ERR_FRANCHISEE_NOT_FOUND (404), not the generic ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database - no franchisee exists."
          setup_api_calls: []
          trigger:
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "00000000-0000-0000-0000-0000000000f1", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_FRANCHISEE_NOT_FOUND"

      - name: corner_club_inherits_franchisee_state_and_coordinates_from_territory
        claim_type: computed_fields
        grounds:
          - entities.Club.fields.franchisee_id
          - entities.Club.fields.state_code
          - entities.Club.fields.lat
          - entities.Club.fields.lng
          - endpoints[POST /franchise/clubs]
        distinguishing_aspect: "Club.franchisee_id, state_code, lat and lng are all source: computed and are copied from the named Territory - the create payload cannot even carry them, so a club created in a CA territory centred at 34.0 / -118.0 reports exactly those coordinates and CA, which is what later drives the statute lookup and the relocation geometry."
        test_recipe:
          setup:
            - "One franchisee owning one RESERVED CA territory centred at 34.0 / -118.0 with a 5.0 km protected radius."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harborline Fitness LLC", contact_email: "ops@harborlinefit.example" }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t1_id}", name: "Harborline Downtown", opened_on: "2024-05-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c1_id: $.data.id }
          assert:
            - "response status == 201"
            - "Club.${c1_id}.franchisee_id == ${f1_id}"
            - "Club.${c1_id}.state_code == CA"
            - "Club.${c1_id}.lat == 34.0"
            - "Club.${c1_id}.lng == -118.0"
            - "Club.${c1_id}.status == PRE_OPENING"
            - "Club.${c1_id}.equipment_compliance_state == COMPLIANT"
            - "Club.${c1_id}.last_inspection_score == null"
            - "Club.${c1_id}.active_agreement_count == 0"
            - "Club.${c1_id}.delinquent_member_count == 0"
            - "Club.${c1_id}.collections_watch == false"
            - "Club.${c1_id}.settlement_ledger_cents == 0"
            - "Territory.${t1_id}.status == RESERVED"

      - name: corner_club_defaults_guest_fee_to_twelve_hundred_fifty_cents
        claim_type: defaults
        grounds:
          - entities.Club.fields.guest_fee_cents
          - endpoints[POST /franchise/clubs]
        distinguishing_aspect: "Omitting guest_fee_cents stores the brand-standard 1250 cents, which is the per-visit rate later pinned into every GuestUsageEvent.guest_fee_cents_at_visit - a wrong default silently mis-prices inter-club settlement."
        test_recipe:
          setup:
            - "One franchisee owning one RESERVED CA territory."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harborline Fitness LLC", contact_email: "ops@harborlinefit.example" }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t1_id}", name: "Harborline Downtown", opened_on: "2024-05-01" }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c1_id: $.data.id }
          assert:
            - "response status == 201"
            - "Club.${c1_id}.guest_fee_cents == 1250"

      - name: corner_get_club_with_unknown_id_returns_club_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /franchise/clubs/{id}]
          - errors[ERR_CLUB_NOT_FOUND]
          - validations[priority 5]
        distinguishing_aspect: "A well-formed but unknown club id on the single-club read returns 404 ERR_CLUB_NOT_FOUND - the Club-specific existence code, distinct from the grouped ERR_OPS_RECORD_NOT_FOUND and ERR_MEMBERSHIP_RECORD_NOT_FOUND buckets used for other entities."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /franchise/clubs/00000000-0000-0000-0000-0000000000c9"
              payload: {}
              as: BrandAdministrator
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_CLUB_NOT_FOUND"

      - name: corner_member_system_fields_are_server_assigned_at_creation
        claim_type: system_fields
        grounds:
          - entities.Member
          - endpoints[POST /franchise/members]
        distinguishing_aspect: "Member carries the standard common fields: the server assigns id, created_at, updated_at and version 1, and the system-sourced status starts ACTIVE with the computed agreement_count at 0 - none of these four appear in the endpoint's input list."
        test_recipe:
          setup:
            - "One franchisee owning one OPEN CA club whose manager sells memberships."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harborline Fitness LLC", contact_email: "ops@harborlinefit.example" }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t1_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t1_id}", name: "Harborline Downtown", opened_on: "2024-05-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /franchise/clubs/${c1_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
          trigger:
            - call: "POST /franchise/members"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@example.com", home_state_code: "CA" }
              as: ClubManager
              as_user_id: "${c1_id}"
              captures: { m1_id: $.data.id }
          assert:
            - "response status == 201"
            - "Member.${m1_id}.id is a non-empty string"
            - "Member.${m1_id}.created_at is a non-null ISO-8601 timestamp"
            - "Member.${m1_id}.updated_at is a non-null ISO-8601 timestamp"
            - "Member.${m1_id}.version == 1"
            - "Member.${m1_id}.status == ACTIVE"
            - "Member.${m1_id}.agreement_count == 0"

      - name: corner_guest_usage_event_is_append_only_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.GuestUsageEvent
          - endpoints[POST /franchise/guest-usage-events]
          - endpoints[GET /franchise/guest-usage-events/{id}]
        distinguishing_aspect: "GuestUsageEvent is declared common_fields: false, so the created row exposes no version and no updated_at and §1.5 offers no mutation endpoint for it - the only field that ever changes is the system-owned settlement_id, and it moves only through a UsageSettlement post or reverse."
        test_recipe:
          setup:
            - "One franchisee with two OPEN CA clubs (home 1250-cent guest fee, host 1250-cent guest fee) and one multi-club agreement at the home club."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harborline Fitness LLC", contact_email: "ops@harborlinefit.example" }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t1_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t1_id}", name: "Harborline Downtown", opened_on: "2024-05-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { ch_id: $.data.id }
            - call: "POST /franchise/clubs/${ch_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.3, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t2_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t2_id}", name: "Harborline Northside", opened_on: "2024-05-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { cx_id: $.data.id }
            - call: "POST /franchise/clubs/${cx_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/plan-templates"
              payload: { code: "CORE12", monthly_dues_cents: 4500, initiation_fee_cents: 4900, term_months: 12, cancellation_notice_days: 30, floor_price_cents: 3600 }
              as: BrandAdministrator
              captures: { pt_id: $.data.id }
            - call: "POST /franchise/plan-templates/${pt_id}/publish"
              payload: {}
              as: BrandAdministrator
            - call: "POST /franchise/members"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@example.com", home_state_code: "CA" }
              as: ClubManager
              as_user_id: "${ch_id}"
              captures: { m1_id: $.data.id }
            - call: "GET /franchise/clubs/${ch_id}"
              payload: {}
              as: BrandAdministrator
              captures: { ch_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { member_id: "${m1_id}", home_club_id: "${ch_id}", plan_template_id: "${pt_id}", expected_club_version: "${ch_v}", signed_on: "2026-08-01", multi_club_access: true }
              as: ClubManager
              as_user_id: "${ch_id}"
              captures: { ag1_id: $.data.id }
          trigger:
            - call: "POST /franchise/guest-usage-events"
              payload: { agreement_id: "${ag1_id}", host_club_id: "${cx_id}", period_month: "2026-08", visit_count: 4 }
              as: ClubManager
              as_user_id: "${cx_id}"
              captures: { g1_id: $.data.id }
          assert:
            - "response status == 201"
            - "GuestUsageEvent.${g1_id}.version is absent from the response body"
            - "GuestUsageEvent.${g1_id}.updated_at is absent from the response body"
            - "GuestUsageEvent.${g1_id}.created_at is a non-null ISO-8601 timestamp"
            - "GuestUsageEvent.${g1_id}.home_club_id_at_visit == ${ch_id}"
            - "GuestUsageEvent.${g1_id}.guest_fee_cents_at_visit == 1250"
            - "GuestUsageEvent.${g1_id}.usage_fee_cents == 5000"
            - "GuestUsageEvent.${g1_id}.settlement_id == null"

      - name: corner_club_list_returns_paginated_envelope_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /franchise/clubs]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three clubs on file, GET /franchise/clubs?limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false - the envelope reports the unpaginated total, not the page length."
        test_recipe:
          setup:
            - "One franchisee owning three RESERVED CA territories, each holding one PRE_OPENING club."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harborline Fitness LLC", contact_email: "ops@harborlinefit.example" }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t1_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t1_id}", name: "Harborline Downtown", opened_on: "2024-05-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.3, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t2_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t2_id}", name: "Harborline Northside", opened_on: "2024-06-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.6, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t3_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t3_id}", name: "Harborline Summit", opened_on: "2024-07-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c3_id: $.data.id }
          trigger:
            - call: "GET /franchise/clubs"
              payload: { franchisee_id: "${f1_id}", limit: 2, offset: 0 }
              as: BrandAdministrator
            - call: "GET /franchise/clubs"
              payload: { franchisee_id: "${f1_id}", limit: 2, offset: 2 }
              as: BrandAdministrator
          assert:
            - "the offset=0 response status == 200"
            - "the offset=0 response response_type == array"
            - "the offset=0 response contains exactly 2 Club rows"
            - "the offset=0 response total_count == 3"
            - "the offset=0 response has_more == true"
            - "the offset=0 response limit == 2"
            - "the offset=0 response offset == 0"
            - "the offset=2 response contains exactly 1 Club row"
            - "the offset=2 response total_count == 3"
            - "the offset=2 response has_more == false"

      - name: corner_agreement_retrieval_returns_every_pinned_pricing_field
        claim_type: retrieval
        grounds:
          - endpoints[GET /franchise/agreements/{id}]
          - entities.MembershipAgreement.fields.monthly_dues_base_cents
          - entities.MembershipAgreement.fields.cancellation_notice_days
          - entities.MembershipAgreement.fields.term_end_on
        distinguishing_aspect: "A re-read of a freshly signed agreement returns the pricing terms pinned off the plan template at signature - monthly_dues_base_cents 4500, initiation_fee_cents 4900, cancellation_notice_days 30 - and a term_end_on of 2027-07-27, which is signed_on + 30 * 12 = 360 days under the scaffold's 30-day-month convention rather than the calendar anniversary 2027-08-01."
        test_recipe:
          setup:
            - "One franchisee with one OPEN CA club, a PUBLISHED CORE12 plan (4500 dues, 4900 initiation, 12-month term, 30-day notice) and one member."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harborline Fitness LLC", contact_email: "ops@harborlinefit.example" }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t1_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t1_id}", name: "Harborline Downtown", opened_on: "2024-05-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /franchise/clubs/${c1_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/plan-templates"
              payload: { code: "CORE12", monthly_dues_cents: 4500, initiation_fee_cents: 4900, term_months: 12, cancellation_notice_days: 30, floor_price_cents: 3600 }
              as: BrandAdministrator
              captures: { pt_id: $.data.id }
            - call: "POST /franchise/plan-templates/${pt_id}/publish"
              payload: {}
              as: BrandAdministrator
            - call: "POST /franchise/members"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@example.com", home_state_code: "CA" }
              as: ClubManager
              as_user_id: "${c1_id}"
              captures: { m1_id: $.data.id }
            - call: "GET /franchise/clubs/${c1_id}"
              payload: {}
              as: BrandAdministrator
              captures: { c1_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { member_id: "${m1_id}", home_club_id: "${c1_id}", plan_template_id: "${pt_id}", expected_club_version: "${c1_v}", signed_on: "2026-08-01", multi_club_access: false }
              as: ClubManager
