      - name: nonconformance_capa_rejection_cycle_escalates_and_returns_analyst_to_qualified
        grounds:
          - state_machines.Nonconformance.ROOT_CAUSE_SUBMITTED_to_OPEN
          - state_machines.Nonconformance.CAPA_APPROVED_to_CLOSED
          - state_machines.Analyst.QUALIFIED_to_PROBATION
          - state_machines.Analyst.PROBATION_to_QUALIFIED
          - calculations.capa_due_and_escalation
          - entities.Nonconformance.fields.capa_rejection_count
        distinguishing_aspect: |
          Two coupled cycles run on one chain: the Nonconformance loops
          OPEN -> ROOT_CAUSE_SUBMITTED -> OPEN twice, and the second loop crosses
          CAPA_ESCALATION_THRESHOLD so severity escalates MAJOR -> CRITICAL and due_utc is
          recomputed from the ORIGINAL opened_at_utc to 2026-08-11T00:00:00Z (not from the
          rejection instant); closing the finding then returns the analyst PROBATION ->
          QUALIFIED, completing the standing cycle.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z for the whole chain, so opened_at_utc == 2026-08-01T00:00:00Z."
            - "Analyst A1 exists in QUALIFIED with no assignments."
            - "A MAJOR INTERNAL_QA nonconformance naming A1 is opened, which moves A1 to PROBATION and sets due_utc = 2026-08-01 + 30 days = 2026-08-31T00:00:00Z."
            - "Two CAPA rejections follow, each preceded by a root-cause submission."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LabDirector
            - call: "POST /lab/analysts"
