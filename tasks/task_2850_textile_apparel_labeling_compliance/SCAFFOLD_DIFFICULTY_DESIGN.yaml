      - name: lab_bench_occupancy_is_closed_at_both_ends_with_capacity_two
        grounds:
          - validations[priority=83]
          - errors.ERR_LAB_BENCH_CAPACITY
          - entities.LabTest.fields.specimen_received_at
          - entities.LabTest.fields.results_due_at
          - calculations.durability_adequacy
          - endpoints[POST /labeling/lab-tests]
        distinguishing_aspect: |
          The (lab_code, method) bench is a capacity-2 resource whose occupancy interval [specimen_received_at, results_due_at + 24h] is CLOSED at both ends, so a third overlapping reservation is ERR_LAB_BENCH_CAPACITY 409, resolving one reservation frees the slot for an identical request, and a request whose start instant merely equals another interval's end instant still counts as an overlap - which is exactly the case a half-open reading would wrongly admit.
        test_recipe:
          setup:
            - "Four styles S1..S4 exist under one brand, each with a non-empty fiber declaration, because at most one BENCH_RESERVED LabTest may exist per (style_id, test_type)."
            - "All reservations use lab_code LAB-ATL-1 and method AATCC_20A, and the CONDITIONING_BUFFER_HOURS of 24 extends every interval one day past results_due_at."
