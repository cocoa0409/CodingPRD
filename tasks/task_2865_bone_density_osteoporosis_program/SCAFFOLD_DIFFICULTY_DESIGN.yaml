              as: ProgramAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0001", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_a_id: $.data.id, dev_a_version: $.data.version }
            - call: "POST /bone-density/densitometers/${dev_a_id}/precision-assessment"
              payload: { expected_densitometer_version: "${dev_a_version}", technologist_user_id: "tech-001", patient_count: 30, scans_per_patient: 2, rms_sd_g_cm2: 0.0100 }
              as: ProgramAdmin
            - call: "POST /bone-density/patients"
              payload: { mrn: "MRN-1001", primary_payer_policy_id: "${policy_id}", birth_date: "1958-05-12", sex: "FEMALE", postmenopausal: true, baseline_height_cm: 165.0 }
              as: Scheduler
              captures: { pat_id: $.data.id, pat_version: $.data.version }
            - call: "POST /bone-density/patients/${pat_id}/risk-factor-profiles"
              payload: { expected_patient_version: "${pat_version}", height_cm: 160.0, weight_kg: 52.0, prior_fragility_fracture: false, parental_hip_fracture: false, current_smoker: false, glucocorticoid_use: false, rheumatoid_arthritis: false, secondary_osteoporosis: false, alcohol_units_per_day: 0.0 }
              as: Scheduler
              captures: { rfp_id: $.data.id }
            - call: "POST /bone-density/scan-orders"
              payload: { patient_id: "${pat_id}", indication: "BASELINE_SCREENING", requested_sites: ["FEMORAL_NECK"], requested_scan_date: "2026-03-10", vfa_requested: false }
              as: Scheduler
              captures: { order1_id: $.data.id }
            - call: "POST /bone-density/scan-appointments"
              payload: { scan_order_id: "${order1_id}", densitometer_id: "${dev_a_id}", start_utc: "2026-03-10T09:00:00Z", end_utc: "2026-03-10T09:30:00Z" }
              as: Scheduler
              captures: { appt1_id: $.data.id }
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:05:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/scan-appointments/${appt1_id}/scan-sessions"
              payload: { scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
              captures: { sess1_id: $.data.id }
            - call: "POST /bone-density/scan-sessions/${sess1_id}/site-measurements"
              payload: { site_code: "FEMORAL_NECK", bmd_g_cm2: 0.6500, area_cm2: 5.20, bmc_g: 3.38, reference_mean_bmd_g_cm2: 0.8500, reference_sd_g_cm2: 0.1000, age_matched_mean_bmd_g_cm2: 0.7000, age_matched_sd_g_cm2: 0.1000 }
              as: Technologist
              as_user_id: "tech-001"
            - call: "POST /bone-density/scan-sessions/${sess1_id}/submit-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "tech-001"
            - call: "POST /bone-density/scan-sessions/${sess1_id}/positioning-reviews"
              payload: { defect_codes: [] }
              as: QualityReviewer
              as_user_id: "qa-001"
            - call: "POST /bone-density/frax-assessments"
              payload: { patient_id: "${pat_id}", risk_factor_profile_id: "${rfp_id}", scan_session_id: "${sess1_id}" }
              as: InterpretingPhysician
              as_user_id: "phys-001"
              captures: { frax1_id: $.data.id }
            - call: "POST /bone-density/diagnostic-reports"
              payload: { scan_session_id: "${sess1_id}", frax_assessment_id: "${frax1_id}" }
              as: InterpretingPhysician
              as_user_id: "phys-001"
              captures: { rep1_id: $.data.id }
            - call: "POST /bone-density/diagnostic-reports/${rep1_id}/finalize"
              payload: {}
              as: InterpretingPhysician
              as_user_id: "phys-001"
            - call: "POST /bone-density/treatment-plans"
              payload: { patient_id: "${pat_id}", initiating_report_id: "${rep1_id}", drug_class: "BISPHOSPHONATE_ORAL", start_date: "2026-04-01", adherence_source_policy: "CLAIMS_ONLY" }
              as: InterpretingPhysician
              as_user_id: "phys-001"
              captures: { plan_claims_id: $.data.id }
            - call: "POST /bone-density/treatment-plans"
              payload: { patient_id: "${pat_id}", initiating_report_id: "${rep1_id}", drug_class: "BISPHOSPHONATE_ORAL", start_date: "2026-04-01", adherence_source_policy: "ALL_SOURCES_WEIGHTED" }
              as: InterpretingPhysician
              as_user_id: "phys-001"
              captures: { plan_weighted_id: $.data.id }
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/treatment-plans/${plan_claims_id}/adherence-refills"
              payload: { dispensed_date: "2026-04-01", days_supplied: 30, source: "PHARMACY_CLAIM" }
              as: InterpretingPhysician
              as_user_id: "phys-001"
            - call: "POST /bone-density/treatment-plans/${plan_claims_id}/adherence-refills"
              payload: { dispensed_date: "2026-05-01", days_supplied: 30, source: "PHARMACY_CLAIM" }
              as: InterpretingPhysician
              as_user_id: "phys-001"
            - call: "POST /bone-density/treatment-plans/${plan_claims_id}/adherence-refills"
              payload: { dispensed_date: "2026-06-01", days_supplied: 30, source: "PATIENT_REPORT" }
              as: PatientPortalUser
              as_user_id: "${pat_id}"
            - call: "POST /bone-density/treatment-plans/${plan_weighted_id}/adherence-refills"
              payload: { dispensed_date: "2026-04-01", days_supplied: 30, source: "PHARMACY_CLAIM" }
              as: InterpretingPhysician
              as_user_id: "phys-001"
            - call: "POST /bone-density/treatment-plans/${plan_weighted_id}/adherence-refills"
              payload: { dispensed_date: "2026-05-01", days_supplied: 30, source: "PHARMACY_CLAIM" }
              as: InterpretingPhysician
              as_user_id: "phys-001"
            - call: "POST /bone-density/treatment-plans/${plan_weighted_id}/adherence-refills"
              payload: { dispensed_date: "2026-06-01", days_supplied: 30, source: "PATIENT_REPORT" }
              as: PatientPortalUser
              as_user_id: "${pat_id}"
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /bone-density/treatment-plans/${plan_claims_id}/adherence-review"
              payload: { requested_action: "AUTO", note: "quarterly review" }
              as: InterpretingPhysician
              as_user_id: "phys-001"
            - call: "POST /bone-density/treatment-plans/${plan_weighted_id}/adherence-review"
              payload: { requested_action: "AUTO", note: "quarterly review" }
              as: InterpretingPhysician
              as_user_id: "phys-001"
          assert:
            - "TreatmentPlan.${plan_claims_id}.adherence_window_days == 91"
            - "TreatmentPlan.${plan_claims_id}.covered_days_supplied == 60.0"
            - "TreatmentPlan.${plan_claims_id}.medication_possession_ratio == 0.659"
            - "TreatmentPlan.${plan_claims_id}.adherence_status == PARTIAL"
            - "TreatmentPlan.${plan_claims_id}.status == ON_THERAPY"
            - "TreatmentPlan.${plan_weighted_id}.adherence_window_days == 91"
            - "TreatmentPlan.${plan_weighted_id}.covered_days_supplied == 75.0"
            - "TreatmentPlan.${plan_weighted_id}.medication_possession_ratio == 0.824"
            - "TreatmentPlan.${plan_weighted_id}.adherence_status == ADHERENT"
            - "TreatmentPlan.${plan_weighted_id}.status == ON_THERAPY"
            - "TreatmentPlan.${plan_claims_id}.next_followup_due_date == 2026-10-01"
            - "TreatmentPlan.${plan_claims_id}.denosumab_gap_days == null"
            - "TreatmentPlan.${plan_claims_id}.holiday_eligible == false"

  - rule_id: combinatorial_formula
    instances:
      - name: frax_heavy_profile_stacks_bmi_tier_crf_sum_and_major_cap_clamp
        grounds:
          - calculations.frax_probability
          - entities.FraxAssessment.fields.bmi_points
          - entities.FraxAssessment.fields.clinical_risk_points
          - entities.FraxAssessment.fields.raw_score
          - entities.FraxAssessment.fields.major_osteoporotic_10yr_pct
          - entities.RiskFactorProfile.fields.clinical_risk_factor_count
        distinguishing_aspect: |
          One value, major_osteoporotic_10yr_pct, is produced by a chain of five interacting inputs:
          the age term (3.00), the FEMALE sex term (0.60), a conditional BMI tier that only fires
          below 20.00 (bmi_used 18.75 -> 0.80), a seven-way clinical-risk sum including the alcohol
          threshold term (8.70), and the sign-flipping BMD term (3.60). The resulting raw_score 16.70
          would linearly imply 3.0 + 6.0 * 16.70 = 103.2, so the MAJOR_CAP_PCT clamp must fire and
          pin the answer at 60.0 while hip_fracture_10yr_pct stays uncapped at 27.1 -- getting either
          the tier, the alcohol threshold, the sign or the clamp wrong changes the answer.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T09:05:00Z."
            - "One PayerPolicy PAY-STD and one ACTIVE Densitometer with lsc_g_cm2 0.0277."
            - "One Patient MRN-2001, FEMALE, postmenopausal, born 1945-05-12, so age_years is 80 at the clock."
            - "One ACTIVE RiskFactorProfile with height_cm 160.0, weight_kg 48.0 (bmi_used 18.75), all six clinical booleans true and alcohol_units_per_day 4.0 (at or above the 3.0 threshold)."
            - "One SUBMITTED ScanSession whose only FEMORAL_NECK measurement has t_score exactly -3.0."
          setup_api_calls:
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/payer-policies"
              payload: { payer_code: "PAY-STD", name: "Standard Bone Health", baseline_screening_min_interval_months: 24, high_risk_min_interval_months: 12, treatment_monitoring_min_interval_months: 12, vfa_covered: true, vfa_requires_height_loss_cm: 4.0, repeat_scan_grace_days: 30, max_lifetime_screening_scans: 6, appeal_allowed: false }
              as: ProgramAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /bone-density/densitometers"
              payload: { serial_number: "HLG-0001", manufacturer: "HOLOGIC", model: "Horizon A", site_code: "MAIN", phantom_baseline_bmd_g_cm2: 1.0000, phantom_baseline_sd_g_cm2: 0.0100, appointment_buffer_minutes: 15, daily_scan_capacity: 12 }
              as: ProgramAdmin
              captures: { dev_a_id: $.data.id, dev_a_version: $.data.version }
            - call: "POST /bone-density/densitometers/${dev_a_id}/precision-assessment"
              payload: { expected_densitometer_version: "${dev_a_version}", technologist_user_id: "tech-001", patient_count: 30, scans_per_patient: 2, rms_sd_g_cm2: 0.0100 }
              as: ProgramAdmin
            - call: "POST /bone-density/patients"
              payload: { mrn: "MRN-2001", primary_payer_policy_id: "${policy_id}", birth_date: "1945-05-12", sex: "FEMALE", postmenopausal: true, baseline_height_cm: 168.0 }
              as: Scheduler
              captures: { pat_id: $.data.id, pat_version: $.data.version }
            - call: "POST /bone-density/patients/${pat_id}/risk-factor-profiles"
              payload: { expected_patient_version: "${pat_version}", height_cm: 160.0, weight_kg: 48.0, prior_fragility_fracture: true, parental_hip_fracture: true, current_smoker: true, glucocorticoid_use: true, rheumatoid_arthritis: true, secondary_osteoporosis: true, alcohol_units_per_day: 4.0 }
              as: Scheduler
              captures: { rfp_id: $.data.id }
            - call: "POST /bone-density/scan-orders"
              payload: { patient_id: "${pat_id}", indication: "BASELINE_SCREENING", requested_sites: ["FEMORAL_NECK"], requested_scan_date: "2026-03-10", vfa_requested: false }
              as: Scheduler
              captures: { order1_id: $.data.id }
            - call: "POST /bone-density/scan-appointments"
              payload: { scan_order_id: "${order1_id}", densitometer_id: "${dev_a_id}", start_utc: "2026-03-10T09:00:00Z", end_utc: "2026-03-10T09:30:00Z" }
              as: Scheduler
              captures: { appt1_id: $.data.id }
            - call: "POST /bone-density/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:05:00Z" }
              as: ProgramAdmin
            - call: "POST /bone-density/scan-appointments/${appt1_id}/scan-sessions"
              payload: { scan_mode: "ARRAY" }
              as: Technologist
              as_user_id: "tech-001"
              captures: { sess1_id: $.data.id }
            - call: "POST /bone-density/scan-sessions/${sess1_id}/site-measurements"
              payload: { site_code: "FEMORAL_NECK", bmd_g_cm2: 0.5500, area_cm2: 5.10, bmc_g: 2.81, reference_mean_bmd_g_cm2: 0.8500, reference_sd_g_cm2: 0.1000, age_matched_mean_bmd_g_cm2: 0.7000, age_matched_sd_g_cm2: 0.1000 }
              as: Technologist
              as_user_id: "tech-001"
            - call: "POST /bone-density/scan-sessions/${sess1_id}/submit-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "tech-001"
          trigger:
            - call: "POST /bone-density/frax-assessments"
              payload: { patient_id: "${pat_id}", risk_factor_profile_id: "${rfp_id}", scan_session_id: "${sess1_id}" }
              as: InterpretingPhysician
              as_user_id: "phys-001"
              captures: { frax_id: $.data.id }
          assert:
