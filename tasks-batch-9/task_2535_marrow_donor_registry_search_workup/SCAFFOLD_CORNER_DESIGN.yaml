              as_user_id: "ops-1"
            - call: "POST /registry/typing-requests/${ct_d1}/response"
              payload: { reported_hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, donor_available_flag: true }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              is_negative_trigger: true
              captures: { err_late: "$.data.error_id" }
            - call: "GET /registry/match-candidates/${mc_d1}/typing-requests"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { ct_d1_status_after: "$.data[0].status", ct_d1_responded_after: "$.data[0].responded_at" }
          assert:
            - "the response delivered exactly AT deadline_at is accepted with 200: the request becomes \"RESPONDED\" with responded_at \"2026-08-08T00:00:00Z\" (the rule rejects only instants strictly after the deadline)"
            - "that accepted response still excludes its candidate on match quality: reported_match_grade 6 is below MIN_ACCEPTABLE_ALLELE_MATCHES 9, so the D5 candidate becomes \"EXCLUDED_LOW_MATCH\" - acceptance of the response and acceptance of the donor are separate outcomes"
            - "the response delivered one second later returns 422 with error_id \"ERR_CT_DEADLINE_PASSED\""
            - "the late row was still eligible on state: it is STILL \"REQUESTED\" with responded_at null after the rejection, proving the priority-14 open check passed and the priority-42 temporal check is what fired"
            - "no sweep ran in this test, so expired_by_sweep_at stays null and the D1 candidate stays \"TYPING_REQUESTED\" - lateness alone does not expire a request"

      - name: booking_checks_run_as_a_ladder_method_then_clearance_then_window
        claim_type: Cascading validation
        grounds:
          - validations[priority=20]
          - validations[priority=21]
          - validations[priority=45]
          - endpoints.POST_registry_collection_bookings
        distinguishing_aspect: |
          The same booking request is replayed three times against a workup case that is progressively
          repaired, and each replay must surface the NEXT check in the ladder: ERR_METHOD_NOT_DECIDED (20)
          while both the method and the clearance are missing, then ERR_CLEARANCE_NOT_COMPLETE (21) once
          only the method exists, then ERR_COLLECTION_OUTSIDE_CONDITIONING_WINDOW (45) once the case is
          fully cleared but the patient has no conditioning date. A single-pass implementation that
          reports the first *structural* problem it happens to notice cannot produce this exact sequence.
        test_recipe:
          setup:
            - "domestic registry, donor D1, canonical patient, one collection center with capacity 2"
            - "the candidate is driven to SCREENING_PASSED and a WorkupCase is opened (clearance INCOMPLETE, logistics UNSCHEDULED)"
            - "the logical clock stays at 2026-08-01T00:00:00Z throughout"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
