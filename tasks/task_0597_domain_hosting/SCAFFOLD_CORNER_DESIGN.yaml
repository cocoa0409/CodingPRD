              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /registrar/domains/${dom_id}/renew"
              payload: { term_years: 1, expected_domain_version: "${dom_v}" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412 and error_id == 'ERR_STALE_DOMAIN_VERSION'"
            - "Domain.${dom_id}.version == ${dom_v} + 1 (bumped once by the successful renew, not twice)"
            - "GET /registrar/invoices?account_id=${acct_id}&status=ISSUED returns total_count == 1 (the rejected renew raised no second renewal invoice)"

