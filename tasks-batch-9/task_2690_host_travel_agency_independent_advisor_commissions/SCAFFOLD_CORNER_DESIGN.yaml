# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for
# task_2690_host_travel_agency_independent_advisor_commissions
#
# Walks references/claim-extraction-guide.md row-by-row against this scaffold's §1.1-§1.7
# surface. Sections and claim_type values are taken verbatim from that guide; nothing is
# invented. Corners already asserted by a §1.8 instance appear as excluded_because: stubs
# citing that instance by name.
#
# Fixed literals used throughout:
#   MISSING_ID = "00000000-0000-4000-8000-000000000000"  (well-formed UUID that is never minted)
#   The logical clock default is 2026-08-01T00:00:00Z; instances that need another instant set
#   it explicitly through POST /host-agency/_clock/set_current_utc.

scaffold_corner_design:
  # ==========================================================================
  # 1. ENTITIES
  # ==========================================================================
  - section: entities
    instances:
      - name: corner_advisor_creation_returns_envelope_and_seeded_fields
        claim_type: creation
        grounds:
          - entities.Advisor
          - endpoints["POST /host-agency/advisors"]
          - response_envelope.success
        distinguishing_aspect: "POST /host-agency/advisors with every required input returns HTTP 201, the success envelope with meta.api_request_id and response_type == object, and an Advisor whose status is DRAFT, version is 1 and every money aggregate is 0."
        test_recipe:
          setup:
            - "Empty database; no reference data is needed to onboard an advisor."
          setup_api_calls: []
          trigger:
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_id: $.data.id, adv_v0: $.data.version }
          assert:
            - "HTTP status == 201"
            - "the body carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""
            - "data.id is a UUID and data.version == 1"
            - "Advisor.${adv_id}.status == DRAFT"
            - "Advisor.${adv_id}.legal_name == \"Dana Reyes\" and email == \"dana.reyes@example.com\" and seller_of_travel_state == \"NY\""
            - "Advisor.${adv_id}.production_ytd_provisional_cents == 0 and production_ytd_final_cents == 0"
            - "Advisor.${adv_id}.lifetime_settled_share_cents == 0 and lifetime_chargeback_cents == 0 and carryforward_chargeback_cents == 0"
            - "Advisor.${adv_id}.consortium_id is null and transition_advisor_id is null"

      - name: corner_supplier_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints["GET /host-agency/suppliers/{id}"]
          - entities.Supplier
        distinguishing_aspect: "GET /host-agency/suppliers/{id} returns exactly the row that POST created, including the rate card and the four aging buckets initialised to 0."
        test_recipe:
          setup:
            - "One supplier registered with an explicit rate card."
          setup_api_calls:
            - call: "POST /host-agency/suppliers"
              payload: { name: "Northwind Tours", accreditation_scheme: "IATA", base_commission_pct: 0.10, preferred_override_commission_pct: 0.12, rate_ceiling_pct: 0.20, max_commission_per_booking_cents: 2000000, remit_terms_days: 30 }
              as: HostOperations
              captures: { sup_id: $.data.id }
          trigger:
            - call: "GET /host-agency/suppliers/${sup_id}"
              payload: {}
              as: HostOperations
          assert:
            - "HTTP status == 200 and response_type == \"object\""
            - "data.id == ${sup_id}"
            - "Supplier.${sup_id}.base_commission_pct == 0.10 and rate_ceiling_pct == 0.20 and max_commission_per_booking_cents == 2000000"
            - "Supplier.${sup_id}.aging_0_30_cents == 0, aging_31_60_cents == 0, aging_61_90_cents == 0, aging_over_90_cents == 0"
            - "Supplier.${sup_id}.total_outstanding_cents == 0 and chargeback_count == 0"

      - name: corner_advisor_listing_pagination_and_filter
        claim_type: listing
        grounds:
          - endpoints["GET /host-agency/advisors"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /host-agency/advisors with limit 2 and offset 2 returns the third advisor only, with total_count 3 and has_more false, while the same call with limit 2 and offset 0 returns has_more true."
        test_recipe:
          setup:
            - "Three advisors, all in DRAFT: two in NY and one in CA."
          setup_api_calls:
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_a_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Sam Ortiz", email: "sam.ortiz@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_b_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Priya Nair", email: "priya.nair@example.com", seller_of_travel_state: "CA" }
              as: HostOperations
              captures: { adv_c_id: $.data.id }
          trigger:
            - call: "GET /host-agency/advisors"
              payload: { limit: 2, offset: 0 }
              as: HostOperations
            - call: "GET /host-agency/advisors"
              payload: { limit: 2, offset: 2 }
              as: HostOperations
            - call: "GET /host-agency/advisors"
              payload: { seller_of_travel_state: "CA" }
              as: HostOperations
          assert:
            - "FIRST PAGE: response_type == \"array\", 2 rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "SECOND PAGE: 1 row (${adv_c_id}), total_count == 3, offset == 2, has_more == false"
            - "FILTERED: the seller_of_travel_state == CA call returns exactly 1 row, ${adv_c_id}, with total_count == 1"
            - "the unfiltered default page (no limit supplied) would return all 3 rows because pagination_defaults.limit is 10"

      - name: corner_not_found_ids_return_typed_404s
        claim_type: not_found
        grounds:
          - errors[ERR_ADVISOR_NOT_FOUND]
          - errors[ERR_SUPPLIER_NOT_FOUND]
          - errors[ERR_BOOKING_NOT_FOUND]
          - endpoints["GET /host-agency/advisors/{id}"]
          - endpoints["GET /host-agency/suppliers/{id}"]
          - endpoints["GET /host-agency/bookings/{id}"]
        distinguishing_aspect: "Reading a well-formed but never-minted UUID from three different collections returns HTTP 404 with the collection's own error_id (ERR_ADVISOR_NOT_FOUND, ERR_SUPPLIER_NOT_FOUND, ERR_BOOKING_NOT_FOUND), never a generic 404."
        test_recipe:
          setup:
            - "Empty database. MISSING_ID is the literal 00000000-0000-4000-8000-000000000000."
          setup_api_calls: []
          trigger:
            - call: "GET /host-agency/advisors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HostOperations
              captures: { err_adv: $.data.error_id }
            - call: "GET /host-agency/suppliers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HostOperations
              captures: { err_sup: $.data.error_id }
            - call: "GET /host-agency/bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HostOperations
              captures: { err_bk: $.data.error_id }
          assert:
            - "all three calls return HTTP 404 with response_type == \"error\""
            - "err_adv == ERR_ADVISOR_NOT_FOUND"
            - "err_sup == ERR_SUPPLIER_NOT_FOUND"
            - "err_bk == ERR_BOOKING_NOT_FOUND"
            - "each error body carries data.error_id and data.message"

      - name: corner_required_input_fields_rejected_when_absent
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /host-agency/advisors"]
          - endpoints["POST /host-agency/suppliers"]
          - validations[priority=30]
        distinguishing_aspect: "Omitting a non-optional §1.5 input (advisor email, supplier base_commission_pct) returns HTTP 422 ERR_INVALID_REQUEST and creates nothing, while the optional inputs marked with ? may be omitted freely."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { err_adv: $.data.error_id }
            - call: "POST /host-agency/suppliers"
              payload: { name: "Northwind Tours", accreditation_scheme: "IATA", preferred_override_commission_pct: 0.12, rate_ceiling_pct: 0.20, max_commission_per_booking_cents: 2000000, remit_terms_days: 30 }
              as: HostOperations
              captures: { err_sup: $.data.error_id }
          assert:
            - "the advisor call returns HTTP 422 with err_adv == ERR_INVALID_REQUEST"
            - "the supplier call returns HTTP 422 with err_sup == ERR_INVALID_REQUEST"
            - "GET /host-agency/advisors returns total_count == 0"
            - "GET /host-agency/suppliers returns total_count == 0"

      - name: corner_optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Client.fields.ownership_mode
          - entities.Client.fields.max_concurrent_trips
          - entities.Supplier.fields.program_status
          - entities.Supplier.fields.probation_chargeback_threshold
        distinguishing_aspect: "Omitting program_status and probation_chargeback_threshold yields STANDARD and 2; omitting ownership_mode and max_concurrent_trips on a client yields the declared defaults, and the created rows report those values rather than null."
        test_recipe:
          setup:
            - "One ACTIVE advisor is required only because clients must be owned by one; the advisor is onboarded through the standard credential chain."
          setup_api_calls:
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Standard 2026", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.70 }, { tier_level: 2, min_production_cents: 5000000, advisor_pct: 0.80 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.05 }], chargeback_retention_pct: 0.10 }
              as: HostOperations
              captures: { sched_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_id: $.data.id, adv_v0: $.data.version }
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "${sched_id}", effective_date: "2026-01-01", post_departure_advisor_pct: 0.50, expected_advisor_version: "${adv_v0}" }
              as: HostOperations
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SELLER_OF_TRAVEL", credential_number: "NY-SOT-40118", effective_on: "2026-01-01", expires_on: "2027-01-01", jurisdiction_state_code: "NY" }
              as: HostOperations
              captures: { cr_sot_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "EO_POLICY", credential_number: "EO-99881", effective_on: "2026-01-01", expires_on: "2027-01-01", coverage_amount_cents: 100000000 }
              as: HostOperations
              captures: { cr_eo_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "TRAINING_CERT", credential_number: "TRN-2026-A", effective_on: "2026-01-01", expires_on: "2027-01-01" }
              as: HostOperations
              captures: { cr_trn_id: $.data.id }
            - call: "POST /host-agency/compliance-credentials/${cr_sot_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/compliance-credentials/${cr_eo_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/compliance-credentials/${cr_trn_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/advisors/${adv_id}/activate"
              payload: {}
              as: HostOperations
          trigger:
            - call: "POST /host-agency/suppliers"
              payload: { name: "Northwind Tours", accreditation_scheme: "IATA", base_commission_pct: 0.10, preferred_override_commission_pct: 0.12, rate_ceiling_pct: 0.20, max_commission_per_booking_cents: 2000000, remit_terms_days: 30 }
              as: HostOperations
              captures: { sup_id: $.data.id }
            - call: "POST /host-agency/clients"
              payload: { owner_advisor_id: "${adv_id}", full_name: "Nadia Okoye", home_state_code: "NY" }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { cli_id: $.data.id }
          assert:
            - "Supplier.${sup_id}.program_status == STANDARD"
            - "Supplier.${sup_id}.probation_chargeback_threshold == 2"
            - "Supplier.${sup_id}.consortium_id is null"
            - "Client.${cli_id}.ownership_mode == HOST_OWNED (the declared default)"
            - "Client.${cli_id}.max_concurrent_trips == 1 (the declared default)"
            - "Client.${cli_id}.trust_balance_cents == 0 and portability_status == RETAINED"

      - name: corner_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - endpoints["POST /host-agency/consortiums"]
          - endpoints["POST /host-agency/advisors/{id}/agreements"]
          - entities.AdvisorAgreement.fields.signed_at
        distinguishing_aspect: "id, created_at, updated_at and version are generated by the server on every common_fields entity: a consortium is born at version 1, and signing an agreement stamps signed_at from the logical clock (2026-08-01T00:00:00Z) rather than from any client-supplied value."
        test_recipe:
          setup:
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
            - "One split schedule and one DRAFT advisor exist."
          setup_api_calls:
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Standard 2026", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.70 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.05 }], chargeback_retention_pct: 0.10 }
              as: HostOperations
              captures: { sched_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_id: $.data.id, adv_v0: $.data.version }
          trigger:
            - call: "POST /host-agency/consortiums"
              payload: { name: "Voyager Alliance", membership_fee_cents: 5000000, marketing_fund_accrual_pct: 0.02, consortium_channel_bonus_pct: 0.01 }
              as: HostOperations
              captures: { cons_id: $.data.id, cons_v: $.data.version, cons_created: $.data.created_at }
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "${sched_id}", effective_date: "2026-01-01", post_departure_advisor_pct: 0.50, expected_advisor_version: "${adv_v0}" }
              as: HostOperations
              captures: { agr_id: $.data.id, agr_signed: $.data.signed_at }
          assert:
            - "cons_v == 1 and cons_created is a UTC ISO8601 timestamp"
            - "Consortium.${cons_id}.created_at == Consortium.${cons_id}.updated_at on creation"
            - "AdvisorAgreement.${agr_id}.signed_at == \"2026-08-01T00:00:00Z\" (the logical clock, not the wall clock)"
            - "AdvisorAgreement.${agr_id}.status == ACTIVE and version == 1"
            - "Advisor.${adv_id}.version == ${adv_v0} + 1 because signing bumps the parent exactly once"

      - name: corner_trust_requirement_is_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - calculations.trust_requirement_derivation
          - entities.Advisor.fields.trust_account_required
        distinguishing_aspect: "trust_account_required is derived from seller_of_travel_state against the TRUST_STATES set (CA, FL, HI, IA, WA): a CA advisor is created with true and an NY advisor with false, and neither value can be supplied by the caller because it is not in the endpoint's input list."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Priya Nair", email: "priya.nair@example.com", seller_of_travel_state: "CA" }
              as: HostOperations
              captures: { adv_ca_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_ny_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Ines Duarte", email: "ines.duarte@example.com", seller_of_travel_state: "WA" }
              as: HostOperations
              captures: { adv_wa_id: $.data.id }
          assert:
            - "Advisor.${adv_ca_id}.trust_account_required == true"
            - "Advisor.${adv_wa_id}.trust_account_required == true"
            - "Advisor.${adv_ny_id}.trust_account_required == false"
            - "all three rows are in status DRAFT with version 1"

      - name: corner_enum_and_range_type_constraints_rejected
        claim_type: type_constraints
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.ComplianceCredential.fields.credential_type
          - entities.SplitSchedule.fields.tiers
          - endpoints["POST /host-agency/compliance-credentials/{id}/decision"]
        distinguishing_aspect: "A value outside a declared enum (credential_type \"NOTARY\", decision \"MAYBE\") and a structurally invalid tier ladder (no tier at min_production_cents 0) are each rejected with HTTP 422 ERR_INVALID_REQUEST before any business rule runs."
        test_recipe:
          setup:
            - "One DRAFT advisor exists so credential filing has a parent."
          setup_api_calls:
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "TRAINING_CERT", credential_number: "TRN-2026-A", effective_on: "2026-01-01", expires_on: "2027-01-01" }
              as: HostOperations
              captures: { cr_trn_id: $.data.id }
          trigger:
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "NOTARY", credential_number: "NOT-1", effective_on: "2026-01-01", expires_on: "2027-01-01" }
              as: HostOperations
              captures: { err_enum: $.data.error_id }
            - call: "POST /host-agency/compliance-credentials/${cr_trn_id}/decision"
              payload: { decision: "MAYBE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err_decision: $.data.error_id }
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Broken ladder", tiers: [{ tier_level: 1, min_production_cents: 100000, advisor_pct: 0.70 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.05 }], chargeback_retention_pct: 0.10 }
              as: HostOperations
              captures: { err_tiers: $.data.error_id }
          assert:
            - "err_enum == ERR_INVALID_REQUEST with HTTP 422"
            - "err_decision == ERR_INVALID_REQUEST with HTTP 422 and ComplianceCredential.${cr_trn_id}.status is still PENDING_REVIEW"
            - "err_tiers == ERR_INVALID_REQUEST with HTTP 422 because the tiers constraint requires exactly one entry at min_production_cents == 0"
            - "GET /host-agency/compliance-credentials filtered by advisor_id == ${adv_id} returns exactly 1 row"

      - name: corner_trust_ledger_entry_is_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.TrustLedgerEntry
          - endpoints["POST /host-agency/clients/{id}/trust-ledger-entries"]
          - endpoints["GET /host-agency/clients/{id}/trust-ledger-entries"]
        distinguishing_aspect: "TrustLedgerEntry is declared common_fields: false, so its response carries id and created_at but no version and no updated_at, no update or delete endpoint exists for it in §1.5, and its balance_after_cents is frozen at append time."
        test_recipe:
          setup:
            - "One ACTIVE advisor in CA and one owned client, produced by the standard onboarding chain."
          setup_api_calls:
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Standard 2026", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.70 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.05 }], chargeback_retention_pct: 0.10 }
              as: HostOperations
              captures: { sched_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Priya Nair", email: "priya.nair@example.com", seller_of_travel_state: "CA" }
              as: HostOperations
              captures: { adv_id: $.data.id, adv_v0: $.data.version }
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "${sched_id}", effective_date: "2026-01-01", post_departure_advisor_pct: 0.50, expected_advisor_version: "${adv_v0}" }
              as: HostOperations
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "SELLER_OF_TRAVEL", credential_number: "CA-ST-2093322", effective_on: "2026-01-01", expires_on: "2027-01-01", jurisdiction_state_code: "CA" }
              as: HostOperations
              captures: { cr_sot_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "EO_POLICY", credential_number: "EO-71155", effective_on: "2026-01-01", expires_on: "2027-01-01", coverage_amount_cents: 100000000 }
              as: HostOperations
              captures: { cr_eo_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/credentials"
              payload: { credential_type: "TRAINING_CERT", credential_number: "TRN-2026-C", effective_on: "2026-01-01", expires_on: "2027-01-01" }
              as: HostOperations
              captures: { cr_trn_id: $.data.id }
            - call: "POST /host-agency/compliance-credentials/${cr_sot_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/compliance-credentials/${cr_eo_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/compliance-credentials/${cr_trn_id}/decision"
              payload: { decision: "VERIFY" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /host-agency/advisors/${adv_id}/activate"
              payload: {}
              as: HostOperations
            - call: "POST /host-agency/clients"
              payload: { owner_advisor_id: "${adv_id}", full_name: "Marco Vidal", home_state_code: "CA", ownership_mode: "ADVISOR_OWNED", max_concurrent_trips: 2 }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { cli_id: $.data.id, cli_v0: $.data.version }
          trigger:
            - call: "POST /host-agency/clients/${cli_id}/trust-ledger-entries"
              payload: { direction: "DEPOSIT", amount_cents: 250000, memo: "Initial client wire", expected_client_version: "${cli_v0}" }
              as: Advisor
              as_user_id: "${adv_id}"
              captures: { tle1_id: $.data.id, tle1_bal: $.data.balance_after_cents }
            - call: "GET /host-agency/clients/${cli_id}"
              payload: {}
              as: HostController
              as_user_id: "ctrl-1"
              captures: { cli_v1: $.data.version }
            - call: "POST /host-agency/clients/${cli_id}/trust-ledger-entries"
              payload: { direction: "DISBURSEMENT", amount_cents: 40000, memo: "Air deposit paid to supplier", expected_client_version: "${cli_v1}" }
              as: HostController
              as_user_id: "ctrl-1"
              captures: { tle2_id: $.data.id, tle2_bal: $.data.balance_after_cents }
          assert:
            - "tle1_bal == 250000 and tle2_bal == 210000"
            - "neither TrustLedgerEntry response body contains a version field"
            - "TrustLedgerEntry.${tle1_id}.balance_after_cents is still 250000 after the second append — earlier lines are never rewritten"
            - "GET /host-agency/clients/${cli_id}/trust-ledger-entries returns the 2 rows in created_at ASC order"
            - "Client.${cli_id}.trust_balance_cents == 210000 and Client.${cli_id}.version == ${cli_v1} + 1"

      - name: corner_credential_parent_must_exist
        claim_type: parent_relationships
        grounds:
          - endpoints["POST /host-agency/advisors/{id}/credentials"]
          - errors[ERR_ADVISOR_NOT_FOUND]
          - validations[priority=25]
        distinguishing_aspect: "Filing a credential under a never-minted advisor id returns HTTP 404 ERR_ADVISOR_NOT_FOUND and appends nothing, so the nested route validates its parent before any field-coherence rule at priority 60 runs."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /host-agency/advisors/00000000-0000-4000-8000-000000000000/credentials"
              payload: { credential_type: "EO_POLICY", credential_number: "EO-99881", effective_on: "2026-01-01", expires_on: "2027-01-01", coverage_amount_cents: 100000000 }
              as: HostOperations
              captures: { err_parent: $.data.error_id }
          assert:
            - "HTTP status == 404 and err_parent == ERR_ADVISOR_NOT_FOUND"
            - "err_parent != ERR_CREDENTIAL_FIELDS_INCOHERENT"
            - "GET /host-agency/compliance-credentials returns total_count == 0"

      - name: corner_flat_topology_foreign_keys_validated_on_booking
        claim_type: foreign_key_validation
        grounds:
          - complexity_profile.entity_topology
          - errors[ERR_SUPPLIER_NOT_FOUND]
          - errors[ERR_CLIENT_NOT_FOUND]
          - endpoints["POST /host-agency/bookings"]
          - validations[priority=25]
        distinguishing_aspect: "entity_topology is flat, so a booking carries three sibling foreign keys and each is checked independently: a never-minted supplier_id yields ERR_SUPPLIER_NOT_FOUND and a never-minted client_id yields ERR_CLIENT_NOT_FOUND, both 404, before any pricing happens."
        test_recipe:
          setup:
