              as_user_id: "mt-1"
            - call: "POST /incidents"
              payload: { drone_id: "${drone_id}", severity: "MINOR", category: "HARD_LANDING", narrative: "firm touchdown" }
              as: MaintenanceTech
              as_user_id: "mt-1"
              captures: { inc_id: $.data.id }
            - call: "GET /drones/${drone_id}"
              payload: {}
              as: MaintenanceTech
              as_user_id: "mt-1"
            - call: "POST /incidents/${inc_id}/review"
              payload: {}
              as: MaintenanceTech
              as_user_id: "mt-1"
            - call: "GET /drones/${drone_id}"
              payload: {}
              as: MaintenanceTech
              as_user_id: "mt-1"
          assert:
            - "first read: Drone.${drone_id}.advisory_risk_score == 0.0 and blocking_risk_score == 0.0"
            - "after the incident is filed: advisory_risk_score == 0.0 and blocking_risk_score == 5.0"
            - "after the incident moves to UNDER_REVIEW: advisory_risk_score == 0.0 and blocking_risk_score == 5.0"
            - "Incident.${inc_id}.status == UNDER_REVIEW"

      - name: logical_clock_default_before_any_set_call
        claim_type: scheduled_actions
        grounds: [endpoints, entities.MaintenanceLog.fields.completed_at]
        distinguishing_aspect: "Before any POST /_clock/set_current_utc the logical clock reads exactly 2026-05-01T00:00:00Z (never real wall-clock time), so a maintenance log completed without touching the clock stamps completed_at == 2026-05-01T00:00:00Z."
        test_recipe:
          setup: ["Empty database; the clock endpoint is NEVER called in this instance."]
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /nests"
              payload: { service_area_id: "${sa_id}", name: "N1", lat: 37.0, lon: -122.0, pad_count: 2, status: "OPEN" }
              as: PlatformAdmin
              captures: { nest_id: $.data.id }
            - call: "POST /batteries"
              payload: { nest_id: "${nest_id}", serial: "B-1", charge_pct: 100, cycle_count: 0 }
              as: MaintenanceTech
              captures: { bat_id: $.data.id }
            - call: "POST /batteries/${bat_id}/charge"
              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N101", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 12 }
              as: PlatformAdmin
              captures: { drone_id: $.data.id }
            - call: "POST /drones/${drone_id}/install-battery"
              payload: { battery_id: "${bat_id}" }
              as: MaintenanceTech
            - call: "GET /drones/${drone_id}"
              payload: {}
              as: MaintenanceTech
              as_user_id: "mt-1"
              captures: { drone_v: $.data.version }
            - call: "POST /maintenance-logs"
              payload: { drone_id: "${drone_id}", work_type: "INSPECTION", scheduled_start: "2026-05-02T10:00:00Z", scheduled_end: "2026-05-02T12:00:00Z", expected_drone_version: "${drone_v}", notes: "routine" }
              as: MaintenanceTech
              as_user_id: "mt-1"
              captures: { ml_id: $.data.id }
          trigger:
            - call: "POST /maintenance-logs/${ml_id}/complete"
              payload: {}
              as: MaintenanceTech
              as_user_id: "mt-1"
          assert:
            - "MaintenanceLog.${ml_id}.completed_at == 2026-05-01T00:00:00Z"
            - "MaintenanceLog.${ml_id}.status == COMPLETED"
            - "Drone.${drone_id}.hours_since_service == 0"

  # =================================================================================
  - section: consistency_model
    instances:
      - name: cascade_visible_in_the_same_response_immediately
        claim_type: immediate
        grounds: [state_machines.Flight.DROPPING_to_RETURNING, calculations.customer_funds_ledger]
        distinguishing_aspect: "consistency_model is immediate: the drop's own 201 response already reflects the whole chain — a GET issued straight afterwards shows Order DELIVERED, held_total 0.00 and billed_total 8.96 with no settling delay or second request needed."
        test_recipe:
          setup: ["A sortie in ops_state DROPPING with Order IN_TRANSIT and Customer.held_total 8.96."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /service-areas"
              payload: { name: "Bay", center_lat: 37.0, center_lon: -122.0, max_range_km: 12.0, max_payload_g: 2500 }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /nests"
              payload: { service_area_id: "${sa_id}", name: "N1", lat: 37.0, lon: -122.0, pad_count: 2, status: "OPEN" }
              as: PlatformAdmin
              captures: { nest_id: $.data.id }
            - call: "POST /batteries"
              payload: { nest_id: "${nest_id}", serial: "B-1", charge_pct: 100, cycle_count: 0 }
              as: MaintenanceTech
              captures: { bat_id: $.data.id }
            - call: "POST /batteries/${bat_id}/charge"
              payload: { target_charge_pct: 100 }
              as: MaintenanceTech
            - call: "POST /drones"
              payload: { home_nest_id: "${nest_id}", tail_number: "N101", airframe_class: "HEAVY", max_payload_g: 2500, cruise_speed_kmh: 60, hours_since_service: 0 }
              as: PlatformAdmin
              captures: { drone_id: $.data.id }
            - call: "POST /drones/${drone_id}/install-battery"
              payload: { battery_id: "${bat_id}" }
              as: MaintenanceTech
            - call: "POST /customers"
              payload: { name: "Ann", email: "ann@x.com", dropoff_lat: 37.05, dropoff_lon: -122.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", service_area_id: "${sa_id}", payload_weight_g: 2000, priority: "STANDARD" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { nest_id: "${nest_id}", expected_order_version: "${order_v}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { flight_id: $.data.id }
            - call: "POST /flights/${flight_id}/file-authorization"
              payload: { grid_cells: ["37N122W-01"], requested_alt_ft: 350, window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { auth_id: $.data.id }
            - call: "POST /_laanc/decision"
              payload: { authorization_id: "${auth_id}", outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /flights/${flight_id}/release"
              payload: {}
              as: FlightDirector
              as_user_id: "fd-1"
            - call: "POST /flights/${flight_id}/launch"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "POST /flights/${flight_id}/arrive"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /flights/${flight_id}/drop"
              payload: { hover_alt_ft: 20, photo_ref: "photo-1" }
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
          assert:
            - "the GET immediately after the drop shows Order.${order_id}.status == DELIVERED"
            - "Customer.${cust_id}.held_total == 0.00 and Customer.${cust_id}.billed_total == 8.96"
            - "Flight.${flight_id}.ops_state == RETURNING and Flight.${flight_id}.clearance_state == CLEARED"
            - "GET /nests?service_area_id=${sa_id} still shows Nest.${nest_id}.reserved_pads == 1 (the pad is only freed at recovery)"
