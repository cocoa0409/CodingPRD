            That §1.8 instance already drives the decay function through a full teardown cycle:
            the base 4.0, the 0.3-per-module term, the 9.0 relocation surcharge, the floor at 0.00,
            the REFURB_THRESHOLD crossing that flips the kit to NEEDS_REFURB, the +30.00 refurbish
            gain capped at 100.00 and the localisation reset. A separate §1.9 arithmetic-only
            instance would re-run the same formula with the same constants on a shorter setup and
            add no discriminating power.

      - name: buildout_spend_waterfall
        claim_type: waterfall_allocation
        grounds:
          - calculations.buildout_allowance_drawdown
        excluded_because:
          difficulty_instance: buildout_waterfall_buckets_always_sum_to_the_spend
          rationale: |
            The §1.8 conservation instance walks the allowance bucket, the landlord-share bucket and
            the tenant-overage bucket across a spend below the allowance, a spend exactly at it and
            a spend past the cap, asserting both the per-bucket figures and the invariant that the
            three buckets sum to the accepted spend. A §1.9 correct_result instance would assert a
            strict subset of the same numbers.

      - name: provisional_and_final_royalty_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.royalty_accrual.variants
        excluded_because:
          difficulty_instance: royalty_provisional_versus_final_on_identical_orders
          rationale: |
            Divergence is the point of that §1.8 instance: one order population, both variants
            computed, and the two figures asserted to differ because the provisional variant reads
            net_amount_cents over a set that includes PENDING while the final variant reads
            net_collected_cents over a set that includes REFUND_DUE and REFUNDED and narrows the
            merchandise leg to CHECKED_IN. Repeating it here would duplicate the divergence
            evidence; the §1.9 reconciliation instance above deliberately asserts only the
            true-up mechanics.

      - name: readiness_variant_selected_by_the_clearance_gate
        claim_type: variant_selection
        grounds:
          - calculations.staff_readiness_score.variants
        excluded_because:
          difficulty_instance: readiness_preflight_clears_while_audit_refuses
          rationale: |
            That §1.8 instance is built entirely around variant selection — a member whose
            preflight score clears the 78.00 floor while the audit score does not, proving the gate
            reads readiness_score_audit and never the preflight figure. The §1.9 weighted_scoring
            instance above covers the orthogonal risks (partial cert coverage, the interior
            rehearsal cap, single final rounding and the zero clamp).

  # ---------------------------------------------------------------------------
  # 9.4 Validations - the priority ladder of table 4, rung by rung
  # ---------------------------------------------------------------------------
  - section: validations
    source_table: "SCAFFOLD.yaml table 4 (validations), priorities 10..150"
    instances:

      - name: duplicate_kit_code_guest_email_and_room_sequence_are_rejected
        claim_type: violation_error
        grounds:
          - validations[priority 55]
          - errors[ERR_DUPLICATE_KIT_CODE]
          - errors[ERR_DUPLICATE_GUEST_EMAIL]
          - errors[ERR_DUPLICATE_ROOM_SEQUENCE]
        distinguishing_aspect: |
          Three uniqueness rules with three different scopes: kit_code is global, guest email is
          global but case-insensitive, and room_sequence is unique only WITHIN a run. An
          implementation with one uniqueness helper tends to make the email comparison
          case-sensitive (so the duplicate slips through) or make room_sequence globally unique
          (so a second city's room 1 is wrongly refused).
        test_recipe:
          setup:
            - "The LIGHT CHAIN through run creation, so one venue, one ISSUED permit, one ACTIVE agreement, kit KIT-P9B-001 and run 1 exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
