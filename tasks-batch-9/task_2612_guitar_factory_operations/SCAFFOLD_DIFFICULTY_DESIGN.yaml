      - name: p4_protected_species_safety_outranks_grade_compatibility
        grounds: "§1.4 priority 65 (referential) carries the note 'PRIORITY PAIR P4 — the safety rule at priority 61 OUTRANKS this compatibility family. A POST /components whose billet comes from a rejected (QUARANTINED) protected-species lot AND whose grade is below the spec minimum returns ERR_PROTECTED_SPECIES_QUARANTINED, not ERR_GRADE_BELOW_MINIMUM.'"
        distinguishing_aspect: "Pair P4 straddles rungs 61 and 65 on a CREATE endpoint rather than an action endpoint, and the two candidate errors carry different statuses (409 safety versus 422 compatibility). It is also the only pair where a THIRD rule is armed — priority 68's ERR_LOT_NOT_RELEASED — so an implementation that orders its checks by anything other than the declared ladder has two distinct wrong answers available. Grade is a fixable clerical problem; impounded protected wood is not, so the safety code must surface."
        test_recipe:
          setup: "An APPENDIX_II rosewood lot released and cut into one UTILITY-grade billet, after which the permit is withdrawn and the lot rejected — quarantining the billet."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /component-specs", payload: { spec_code: "TOP-OM", component_type: "BODY_TOP", required_species_codes: ["SITKA_SPRUCE", "EAST_INDIAN_ROSEWOOD"], min_grade: "AA", nominal_board_feet: 6.00, target_thickness_mm: 2.90, thickness_tolerance_mm: 0.10, cnc_minutes: 45, hand_shape_minutes: 60, required_room_type: "BUILD_ROOM" }, as: PlantAdmin, captures: { spec1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-001", species_code: "EAST_INDIAN_ROSEWOOD", cites_appendix: "APPENDIX_II", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot1: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lot1}/attest-permit", payload: { permit_number: "CITES-II-4471" }, as: ComplianceOfficer, as_user_id: "co-alice" }
            - { call: "POST /tonewood-lots/${lot1}/moisture-readings", payload: { moisture_content_pct: 7.0 }, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/condition", payload: {}, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/release", payload: {}, as: WoodBuyer, captures: { lot_v1: "$.data.version" } }
            - { call: "POST /billets", payload: { billet_code: "BLT-001", lot_id: "${lot1}", board_feet: 30.00, grade: "UTILITY", expected_tonewood_lot_version: "${lot_v1}" }, as: Machinist, captures: { blt1: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lot1}/reject", payload: { reason: "PERMIT_WITHDRAWN" }, as: ComplianceOfficer, as_user_id: "co-alice" }
          trigger: "POST /components with spec_id ${spec1} and billet_id ${blt1} (no build_order_id) as Machinist"
          assert:
            http_status: 409
            error_id: "ERR_PROTECTED_SPECIES_QUARANTINED"
            losing_error_id: "ERR_GRADE_BELOW_MINIMUM"
            second_losing_error_id: "ERR_LOT_NOT_RELEASED"
            billet_status: "QUARANTINED"
            lot_status: "REJECTED"
            components_count: 0
            note: "Three rules are armed by one request: priority 61 (billet's lot rejected), priority 65 (UTILITY grade does not meet min_grade AA), priority 68 (lot status is REJECTED, not RELEASED). The 422 from 65 and the 409 from 68 are both suppressed. No Component row is created."

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: moisture_band_upper_bound_is_inclusive
        grounds: "§1.2 TonewoodLot -> CONDITIONED requires 'MOISTURE_MIN_PCT (6.0) <= moisture_content_pct <= MOISTURE_MAX_PCT (8.0), both bounds INCLUSIVE', and §1.6 ERR_MOISTURE_OUT_OF_BAND (409) fires when the reading 'falls outside the inclusive 6.0-8.0 band at condition or release'."
        distinguishing_aspect: "A one-tenth-of-a-point boundary on an INCLUSIVE comparison, tested from both sides in the same run. An implementation using a strict '<' returns 409 for the 8.0 lot; one that rounds the reading to whole percent lets the 8.1 lot through. Because the two lots are otherwise identical the only variable is the last decimal digit."
        test_recipe:
          setup: "Two identical non-CITES sitka lots, one dried to exactly 8.0 percent and one to 8.1 percent, in an IN_SPEC dry store."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-A", species_code: "SITKA_SPRUCE", cites_appendix: "NONE", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lotA: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lotA}/moisture-readings", payload: { moisture_content_pct: 8.0 }, as: WoodBuyer }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-B", species_code: "SITKA_SPRUCE", cites_appendix: "NONE", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lotB: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lotB}/moisture-readings", payload: { moisture_content_pct: 8.1 }, as: WoodBuyer }
          trigger: "POST /tonewood-lots/${lotA}/condition as WoodBuyer, then POST /tonewood-lots/${lotB}/condition as WoodBuyer"
          assert:
            lot_a_http_status: 200
            lot_a_status: "CONDITIONED"
            lot_b_http_status: 409
            lot_b_error_id: "ERR_MOISTURE_OUT_OF_BAND"
            lot_b_status: "KILN_DRYING"
            note: "8.0 is IN, 8.1 is OUT — a single tenth separates the two lots. The lower bound behaves symmetrically: a third lot read at 6.0 conditions successfully while 5.9 returns the same 409. LOT-B stays in KILN_DRYING and can be dried further and re-conditioned."

      - name: deviation_score_exactly_at_pass_score_max_passes
        grounds: "§1.3 playability_deviation_score declares 'verdict = (deviation_score <= PASS_SCORE_MAX) ? PASS : FAIL   # bound INCLUSIVE' with precision.boundary 'deviation_score == 10.00 is a PASS; 10.01 is a FAIL', and supplies worked_example_pass_at_boundary landing on exactly 10000 milli-points."
        distinguishing_aspect: "A different KIND of boundary from the moisture band: the boundary value here is not an input but the OUTPUT of a four-term weighted sum, so it can only be hit by choosing inputs that make the integer milli-point total land on exactly 10000. It also exercises the one-sided max(0, ...) clamps — bass action 2.10 and relief 0.20 are BETTER than spec and must contribute exactly zero rather than negative credit. An implementation that lets a tighter dimension offset a looser one scores below 10.00 and still passes, hiding the bug; one that uses '<' fails a guitar that is exactly at the published limit."
        test_recipe:
          setup: "The canonical order carried to build_stage INSPECTION with round 1 open."
          setup_api_calls: *chain_b
          trigger: "Carry the order to INSPECTION (start-assembly, an in-spec 50.0 / 21.0 booth reading, a NITRO 8-coat finish run, complete-spray, advance the clock to 2026-08-16T00:00:00Z, buff, complete, fretwork, setup), then POST /build-orders/${bo1}/setup-inspections as Luthier lu-eve, POST /setup-inspections/{insp}/measure with action_mm_treble 1.70, action_mm_bass 2.10, relief_mm 0.20, intonation_cents_max 4.8 as lu-eve, and POST /setup-inspections/{insp}/sign as QualityInspector qi-frank"
          assert:
            http_status: 200
            deviation_score: 10.00
            verdict: "PASS"
            inspection_status: "SIGNED"
            build_order_build_stage: "INSPECTION"
            build_order_rework_round_count: 0
            note: "Milli-points: treble (170 - 160) * 600 = 6000, bass clamped to 0, relief clamped to 0, intonation (48 - 40) * 500 = 4000, total 10000 -> 10.00 -> PASS at the inclusive limit. The FAIL side of the same boundary is asserted by inspection_failure_cascades_three_levels_into_commercial_risk, where treble 1.75 pushes the total to 13000 -> 13.00 -> FAIL. Note the order stays in INSPECTION on a PASS; only assign-serial moves it on."

      - name: station_window_adjacency_exactly_at_changeover_boundary
        grounds: "§1.4 priority 70 rule (O1): 'A new reservation conflicts with an existing HELD or CONSUMED window when new.starts_at < r.ends_at + changeover_minutes AND new.ends_at + changeover_minutes > r.starts_at. A new window beginning EXACTLY at r.ends_at + changeover_minutes is ACCEPTED.'"
        distinguishing_aspect: "A boundary on a derived TIMESTAMP rather than a decimal or a score, and the comparison is strict on one side only. One minute decides it: 09:29 collides, 09:30 is accepted. An implementation that widens the window by changeover on only one side accepts 09:29; one that uses '<=' on the widened edge rejects the legal 09:30 booking and permanently wastes 30 minutes of machine time per changeover."
        test_recipe:
          setup: "One CNC router with a 30 minute changeover and a single HELD 08:00-09:00 window."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "BR-1", room_type: "BUILD_ROOM", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 10 }, as: PlantAdmin, captures: { br1: "$.data.id" } }
            - { call: "POST /stations", payload: { station_code: "CNC-1", station_type: "CNC_ROUTER", room_id: "${br1}", changeover_minutes: 30 }, as: PlantAdmin, captures: { cnc1: "$.data.id" } }
            - { call: "POST /station-reservations", payload: { station_id: "${cnc1}", starts_at: "2026-08-02T08:00:00Z", ends_at: "2026-08-02T09:00:00Z" }, as: Machinist, captures: { res1: "$.data.id" } }
          trigger: "POST /station-reservations for ${cnc1} with starts_at 2026-08-02T09:29:00Z and ends_at 2026-08-02T10:29:00Z as Machinist, then POST /station-reservations for ${cnc1} with starts_at 2026-08-02T09:30:00Z and ends_at 2026-08-02T10:30:00Z as Machinist"
          assert:
            first_http_status: 409
            first_error_id: "ERR_STATION_WINDOW_CONFLICT"
            second_http_status: 201
            second_status: "HELD"
            second_duration_minutes: 60
            station_total_scheduled_minutes: 120
            station_held_minutes: 120
            note: "09:29 < 09:00 + 30 minutes, so the first request collides. 09:30 is exactly the widened edge and is accepted. duration_minutes stays 60 for the accepted window — the 30 minute changeover buffer widens the conflict test only and is never billed into the ledger, so total_scheduled_minutes is 120, not 180."

      - name: booth_hold_closed_interval_touching_endpoints_collide
        grounds: "§1.4 priority 70 rule (O2) declares finish-booth holds CLOSED AT BOTH ENDS [booth_hold_from, booth_hold_until], and §1.3 booth_hold_projection fixes booth_hold_until at creation from the coat schedule alone: 4 + 336 hours for an 8-coat NITRO run."
        distinguishing_aspect: "The mirror image of the station boundary in the same scaffold: station windows are HALF-OPEN and adjacency is legal, booth holds are CLOSED and adjacency COLLIDES. An implementation that reuses one overlap helper for both resources must get one of the two wrong. The discriminator is a single second: a hold starting exactly at 2026-08-16T16:00:00Z is refused, one starting an hour later is created."
        test_recipe:
          setup: "Two orders in IN_ASSEMBLY sharing a capacity-1 booth; the NITRO run created at 2026-08-02T12:00:00Z holds FB-1 through exactly 2026-08-16T16:00:00Z."
          setup_api_calls: *chain_two_orders
          trigger: "POST /_clock/set_current_utc 2026-08-16T16:00:00Z, then POST /finish-runs (${bo2}, ${fb1}, POLY, coat_count 3, ${bo2_v3}) as FinishTech; then POST /_clock/set_current_utc 2026-08-16T17:00:00Z and repeat the identical POST /finish-runs"
          assert:
            touching_http_status: 409
            touching_error_id: "ERR_BOOTH_FINISH_INCOMPATIBLE"
            later_http_status: 201
            later_status: "SPRAYING"
            later_booth_hold_from: "2026-08-16T17:00:00Z"
            later_booth_hold_until: "2026-08-19T21:00:00Z"
            later_cure_hours: null
            booth_occupied_slots_after: 1
            note: "fr1's hold is [2026-08-02T12:00:00Z, 2026-08-16T16:00:00Z] (4 + 336 = 340 hours). A new hold beginning at exactly 16:00:00Z shares one endpoint with it, and because the interval is closed that counts as an overlap — proven by the fact that the finish-system rule at priority 72 fires at all, since it only inspects holds that touch. At 17:00:00Z there is no overlap, so the POLY run is created with a 4 + 72 = 76 hour projection ending 2026-08-19T21:00:00Z. cure_hours is still null because it is only computed at complete-spray. occupied_slots is 1, not 2: fr1 is still non-terminal but its projected hold elapsed at 16:00:00Z, and §1.1 scopes occupied_slots to holds whose closed interval contains current_utc."

      - name: confirm_deposit_exactly_at_min_deposit_bp_threshold
        grounds: "§1.2 commercial_status QUOTED -> CONFIRMED requires 'deposit_cents >= round_half_up(provisional_quote_total_cents * MIN_DEPOSIT_BP / 10000)', §1.3 sets MIN_DEPOSIT_BP 1000, and the canonical provisional total is 886185 cents."
        distinguishing_aspect: "A one-CENT boundary that also forces round_half_up on an exact .5 remainder: 886185 * 1000 / 10000 = 88618.5, which must round UP to 88619. An implementation that truncates accepts 88618 and under-collects; one that computes the threshold in floating point may land on 88618.499999 and accept it too. This is the only boundary in the set where the rounding MODE, not just the comparison operator, changes the verdict."
        test_recipe:
          setup: "A custom-shop ENDORSER order with one approved ARTISAN inlay option, still QUOTED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /option-catalog", payload: { option_code: "INL-VINE", option_group: "INLAY", upcharge_cents: 130000, complexity_class: "ARTISAN", lead_time_days: 45, incompatible_option_codes: ["INL-DOT"] }, as: PlantAdmin, captures: { optA: "$.data.id" } }
            - { call: "POST /build-orders", payload: { order_code: "ORD-001", model_code: "OM45", base_price_cents: 480000, is_custom_shop: true, artist_tier: "ENDORSER", finish_system: "NITRO", promised_date: "2026-10-01T00:00:00Z" }, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { bo1: "$.data.id", bo_v1: "$.data.version" } }
            - { call: "POST /build-orders/${bo1}/option-selections", payload: { option_id: "${optA}", quantity: 1, expected_build_order_version: "${bo_v1}" }, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { sel1: "$.data.id" } }
            - { call: "POST /option-selections/${sel1}/approve", payload: {}, as: CustomShopCoordinator, as_user_id: "csc-dana" }
          trigger: "POST /build-orders/${bo1}/confirm with deposit_cents 88618 as CustomShopCoordinator csc-bob, then POST /build-orders/${bo1}/confirm with deposit_cents 88619 as csc-bob"
          assert:
            first_http_status: 402
            first_error_id: "ERR_DEPOSIT_INSUFFICIENT"
            second_http_status: 200
            second_commercial_status: "CONFIRMED"
            provisional_quote_total_cents: 886185
            deposit_paid_cents: 88619
            deposit_held_cents: 88619
            note: "The threshold is round_half_up(886185 * 1000 / 10000) = round_half_up(88618.5) = 88619. One cent below is a 402 and leaves commercial_status QUOTED with deposit_paid_cents 0; exactly at the threshold the order confirms. This is the same minimum-legal deposit that arms priority pair P2 at settlement time."

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: assign_serial_requires_the_latest_inspection_signed_and_passing
        grounds: "§1.4 priority 68 requires 'POST /build-orders/{build_order_id}/assign-serial requires the highest-round_number SetupInspection to be SIGNED/PASS', §1.2 repeats it as a precondition, and §1.6 ERR_INSPECTION_NOT_SIGNED (409) fires when 'assign-serial finds the highest-round_number SetupInspection is not SIGNED with verdict PASS'."
        distinguishing_aspect: "The gate is on a DIFFERENT entity's state field and specifically on the HIGHEST-round_number row, not on any row. An implementation that checks 'exists an inspection with verdict PASS' or that reads the FIRST inspection lets a serial through on stale evidence. The measured-but-unsigned state is the trap: deviation_score and verdict PASS are already populated, so everything looks approved except the signature."
        test_recipe:
          setup: "The canonical order carried to build_stage INSPECTION with round 1 measured to a passing 10.00 but deliberately NOT signed."
          setup_api_calls: *chain_b
          trigger: "Carry the order to INSPECTION (start-assembly, a 50.0 / 21.0 booth reading, a NITRO 8-coat finish run, complete-spray, clock to 2026-08-16T00:00:00Z, buff, complete, fretwork, setup), then POST /build-orders/${bo1}/setup-inspections as Luthier lu-eve and POST /setup-inspections/{insp}/measure with action_mm_treble 1.70, action_mm_bass 2.10, relief_mm 0.20, intonation_cents_max 4.8 as lu-eve — and stop. Then POST /build-orders/${bo1}/assign-serial as CustomShopCoordinator csc-bob"
          assert:
            http_status: 409
            error_id: "ERR_INSPECTION_NOT_SIGNED"
            inspection_status: "MEASURED"
            inspection_verdict: "PASS"
            inspection_deviation_score: 10.00
            build_order_build_stage: "INSPECTION"
            build_order_serial_number: null
            build_order_commercial_status: "OPTIONS_LOCKED"
            note: "The inspection already carries verdict PASS — only status is MEASURED rather than SIGNED. Once qi-frank signs, the same assign-serial returns 200 with serial_number OM45-2026-00001 and drives commercial_status to INVOICED."

      - name: component_creation_requires_its_lot_to_be_released_not_merely_cuttable
        grounds: "§1.4 priority 68 requires 'POST /components requires TonewoodLot.status == RELEASED', and §1.2 declares the system transition RELEASED -> DEPLETED fired by 'POST /billets left board_feet_available < MIN_USABLE_BOARD_FEET (2.0)'."
        distinguishing_aspect: "A different entity pair (Component -> TonewoodLot) and a subtler failure mode than the assign-serial gate: the lot was RELEASED when the billet was cut, so the BILLET is perfectly valid and AVAILABLE, but the lot has since auto-depleted. An implementation that validates the billet instead of the lot, or that caches the lot status at billet creation, happily builds the component. The DEPLETED hop is itself system-driven, so the test also proves the auto-transition fired."
        test_recipe:
          setup: "A 100 board-foot sitka lot released and then cut down to 0.09 usable board feet, auto-depleting it, leaving one AVAILABLE billet behind."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /component-specs", payload: { spec_code: "TOP-OM", component_type: "BODY_TOP", required_species_codes: ["SITKA_SPRUCE", "EAST_INDIAN_ROSEWOOD"], min_grade: "AA", nominal_board_feet: 6.00, target_thickness_mm: 2.90, thickness_tolerance_mm: 0.10, cnc_minutes: 45, hand_shape_minutes: 60, required_room_type: "BUILD_ROOM" }, as: PlantAdmin, captures: { spec1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-A", species_code: "SITKA_SPRUCE", cites_appendix: "NONE", board_feet_received: 100.00, moisture_content_pct: 7.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lotA: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lotA}/condition", payload: {}, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lotA}/release", payload: {}, as: WoodBuyer, captures: { lotA_v1: "$.data.version" } }
            - { call: "POST /billets", payload: { billet_code: "BLT-BIG", lot_id: "${lotA}", board_feet: 97.00, grade: "AAA", expected_tonewood_lot_version: "${lotA_v1}" }, as: Machinist, captures: { bltBig: "$.data.id" } }
          trigger: "POST /components with spec_id ${spec1} and billet_id ${bltBig} as Machinist"
          assert:
            http_status: 409
            error_id: "ERR_LOT_NOT_RELEASED"
            lot_status: "DEPLETED"
            lot_board_feet_available: 0.09
            lot_board_feet_kerf_loss: 2.91
            billet_status: "AVAILABLE"
            components_count: 0
            note: "The cut booked 97.00 board feet plus round_half_up(97.00 * 300 / 10000) = 2.91 kerf, leaving 0.09 available — below MIN_USABLE_BOARD_FEET 2.0 — so the lot auto-transitioned RELEASED -> DEPLETED in the SAME request that created the billet. The billet is untouched and AVAILABLE, which is exactly what makes the gate hard: the only thing wrong is the parent lot's state. Species and grade are both compatible, so no priority-65 error can mask the result."

      - name: start_assembly_requires_every_component_out_of_flight
        grounds: "§1.2 COMPONENTS_RELEASED -> IN_ASSEMBLY carries TWO cross-entity preconditions — at least MIN_ACCEPTED_COMPONENTS (1) ACCEPTED components AND 'count(Component where build_order_id == this order AND status IN {ROUGH_SAWN, CNC_ROUTED, HAND_SHAPED, QC_HELD, REWORK}) == 0'. §1.6 gives ERR_COMPONENT_IN_FLIGHT (409) distinctly from ERR_COMPONENTS_NOT_ACCEPTED (409)."
        distinguishing_aspect: "This gate depends on an AGGREGATE over a set of sibling entities rather than on one row, and the two halves of it point in opposite directions: the ACCEPTED count is satisfied while the in-flight count is not. An implementation that checks only 'at least one accepted' starts assembly with a part still on the bench; one that reports ERR_COMPONENTS_NOT_ACCEPTED confuses 'nothing is ready' with 'something is still moving' and gives the shop floor the wrong instruction."
        test_recipe:
          setup: "The canonical order at COMPONENTS_RELEASED with one ACCEPTED component, plus a second freshly cut component still in ROUGH_SAWN."
          setup_api_calls: *chain_b
          trigger: "GET /tonewood-lots/${lot1} to read the current version, POST /billets with billet_code BLT-002, lot_id ${lot1}, board_feet 30.00, grade AAA and that version as Machinist, POST /components with spec_id ${spec1}, billet_id of the new billet and build_order_id ${bo1} as Machinist, then POST /build-orders/${bo1}/start-assembly as Luthier"
          assert:
            http_status: 409
            error_id: "ERR_COMPONENT_IN_FLIGHT"
            losing_error_id: "ERR_COMPONENTS_NOT_ACCEPTED"
            accepted_component_count: 1
            in_flight_component_count: 1
            build_order_build_stage: "COMPONENTS_RELEASED"
            note: "The ACCEPTED half of the precondition passes (1 >= MIN_ACCEPTED_COMPONENTS) while the in-flight half fails, so the specific in-flight code must be returned. Routing, hand-shaping and accepting the second component then makes the identical start-assembly call return 200 with build_stage IN_ASSEMBLY."

      - name: warranty_registration_requires_an_authorized_repair_shop
        grounds: "§1.4 priority 68 requires 'POST /warranty-registrations requires RepairShop.status == AUTHORIZED', §1.2 RepairShop declares the AUTHORIZED <-> SUSPENDED cycle, and §1.6 ERR_SHOP_NOT_AUTHORIZED (409) fires when the registration 'names a RepairShop that is APPLIED or SUSPENDED'."
        distinguishing_aspect: "A fourth distinct entity pair (WarrantyRegistration -> RepairShop) and the only one whose blocking state is REVERSIBLE — the shop was AUTHORIZED and can be authorized again, so an implementation that snapshots authorization at shop creation, or that only rejects APPLIED shops while ignoring SUSPENDED ones, passes the naive version of this test and fails this one. The order side of the request is entirely valid, which isolates the shop as the sole cause."
        test_recipe:
          setup: "A serialized custom-shop instrument plus a repair shop that was authorized at FULL_SERVICE level and has since been suspended."
          setup_api_calls: *chain_c
          trigger: "Carry the order to SERIALIZED exactly as in p2_cites_compliance_outranks_deposit_settlement (through POST /build-orders/${bo1}/assign-serial), then POST /repair-shops with shop_code SHOP-1, shop_name Kanda Strings and country_code JP as ServiceNetworkManager (capture shop1), POST /repair-shops/${shop1}/authorize with authorization_level FULL_SERVICE as ServiceNetworkManager, POST /repair-shops/${shop1}/suspend with reason AUDIT_FAILED as ServiceNetworkManager. Then POST /warranty-registrations with build_order_id ${bo1}, registering_shop_id ${shop1}, serial_number OM45-2026-00001, owner_email owner@example.com and purchase_date 2026-08-16T00:00:00Z as ServiceNetworkManager"
          assert:
            http_status: 409
            error_id: "ERR_SHOP_NOT_AUTHORIZED"
            shop_status: "SUSPENDED"
            warranty_registrations_count: 0
            build_order_serial_number: "OM45-2026-00001"
            note: "Everything about the instrument is valid — it is SERIALIZED with a matching serial_number, so neither ERR_SERIAL_MISMATCH nor a build-stage rule can be the cause. Re-authorizing the shop makes the identical request return 201 with coverage_months 60 (COVERAGE_MONTHS_CUSTOM, because the order is a custom-shop build) and coverage_ends_at 2031-08-16T00:00:00Z. The caller is ServiceNetworkManager rather than AuthorizedShop so the priority-25 shop-identity rule is not confounded."

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: station_half_open_window_widened_by_changeover_on_both_sides
        grounds: "§1.4 priority 70 rule (O1) plus §1.3 station_minute_ledger, whose precision note states 'changeover buffer minutes are NEVER added to duration_minutes — the buffer widens the conflict window only and is not billable machine time'. Stations are capacity-1 resources."
        distinguishing_aspect: "A capacity-1 resource with a SYMMETRICALLY WIDENED half-open interval: the decisive case is a requested window that does not overlap any existing window at all in raw terms and is still refused, because the 30 minute changeover pushes its widened right edge into a later booking. An implementation that compares raw windows accepts it and the router crashes into a fixture change; one that bills the buffer into duration_minutes inflates the ledger to 180 minutes and breaks invariant I3's relationship to real machine time."
        test_recipe:
          setup: "One CNC router with a 30 minute changeover and two HELD windows: 08:00-09:00 and 12:00-13:00 on 2026-08-02."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "BR-1", room_type: "BUILD_ROOM", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 10 }, as: PlantAdmin, captures: { br1: "$.data.id" } }
            - { call: "POST /stations", payload: { station_code: "CNC-1", station_type: "CNC_ROUTER", room_id: "${br1}", changeover_minutes: 30 }, as: PlantAdmin, captures: { cnc1: "$.data.id" } }
            - { call: "POST /station-reservations", payload: { station_id: "${cnc1}", starts_at: "2026-08-02T08:00:00Z", ends_at: "2026-08-02T09:00:00Z" }, as: Machinist, captures: { res1: "$.data.id" } }
            - { call: "POST /station-reservations", payload: { station_id: "${cnc1}", starts_at: "2026-08-02T12:00:00Z", ends_at: "2026-08-02T13:00:00Z" }, as: Machinist, captures: { res2: "$.data.id" } }
          trigger: "POST /station-reservations for ${cnc1} with starts_at 2026-08-02T11:00:00Z and ends_at 2026-08-02T11:45:00Z as Machinist, then POST /station-reservations for ${cnc1} with starts_at 2026-08-02T09:30:00Z and ends_at 2026-08-02T10:30:00Z as Machinist"
          assert:
            first_http_status: 409
            first_error_id: "ERR_STATION_WINDOW_CONFLICT"
            second_http_status: 201
            second_status: "HELD"
            second_duration_minutes: 60
            station_total_scheduled_minutes: 180
            station_held_minutes: 180
            station_consumed_minutes: 0
            station_released_minutes: 0
            reservations_on_station_count: 3
            note: "The 11:00-11:45 request does not overlap 12:00-13:00 by a single second, yet 11:45 + 30 minutes = 12:15 > 12:00, so the widened right edge collides and the booking is refused. The 09:30-10:30 request clears BOTH neighbours: 09:30 is exactly r1.ends_at + 30 (accepted, half-open and adjacency-legal) and 10:30 + 30 = 11:00 is still before 12:00. The ledger counts 3 x 60 = 180 real minutes with no buffer inflation, and I3 holds: 180 == 180 + 0 + 0."

      - name: booth_closed_hold_capacity_counts_only_currently_occupying_non_terminal_runs
        grounds: "§1.4 priority 70 rule (O2) and priority 75 (aggregate capacity over non-terminal holds whose closed interval overlaps the new hold), together with §1.2 FinishRun CURING -> REJECTED, whose side effects decrement StorageRoom.occupied_slots."
        distinguishing_aspect: "The other overlap regime in the same scaffold, and mechanically the opposite of the station rule on three axes: the interval is CLOSED rather than half-open, the capacity is an AGGREGATE count rather than a capacity-1 exclusion, and the occupancy set is filtered by RUN STATUS rather than by a buffer. The discriminator is that terminating the incumbent run frees the booth for a request that was refused seconds earlier with no change to any timestamp — an implementation that counts every FinishRun row ever created against the booth refuses the second attempt too."
        test_recipe:
          setup: "Two orders in IN_ASSEMBLY; the capacity-1 booth FB-1 is held by fr1, a non-terminal NITRO run whose hold covers 2026-08-02T12:00:00Z to 2026-08-16T16:00:00Z."
          setup_api_calls: *chain_two_orders
          trigger: "POST /_clock/set_current_utc 2026-08-02T14:00:00Z, then POST /finish-runs with build_order_id ${bo2}, booth_id ${fb1}, finish_system NITRO, coat_count 8 and expected_build_order_version ${bo2_v3} as FinishTech. Then free the booth: POST /finish-runs/${fr1}/complete-spray as FinishTech and POST /finish-runs/${fr1}/reject with reason RUN_ABORTED as QualityInspector. Then repeat the identical POST /finish-runs"
          assert:
            first_http_status: 409
            first_error_id: "ERR_BOOTH_CAPACITY_EXCEEDED"
            booth_occupied_slots_before: 1
            fr1_status_after_reject: "REJECTED"
            booth_occupied_slots_after_reject: 0
            build_order_1_build_stage_after_reject: "IN_ASSEMBLY"
            second_http_status: 201
            second_status: "SPRAYING"
            second_booth_hold_from: "2026-08-02T14:00:00Z"
            second_booth_hold_until: "2026-08-16T18:00:00Z"
            booth_occupied_slots_final: 1
            note: "The run is booked as NITRO on purpose: FinishRun.finish_system is the system actually sprayed and nothing ties it to BuildOrder.finish_system, so matching fr1's system is the only way to clear the chemistry rule at priority 72 and isolate the capacity rule at 75. First attempt: one overlapping non-terminal hold + 1 = 2 > capacity_slots 1. After the reject fr1 is terminal, occupied_slots drops to 0 and bo1 returns to IN_ASSEMBLY, so the byte-identical request now succeeds with its own 4 + 336 = 340 hour hold ending 2026-08-16T18:00:00Z."

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: i1_board_feet_conserved_when_cancel_recovers_reserved_wood
        grounds: "§1.3 lot_board_feet_ledger declares invariant I1 (received == available + unassigned + reserved + consumed + scrapped + kerf_loss, 'after EVERY write, with no tolerance') and lists POST /build-orders/{build_order_id}/cancel as a COMPENSATING movement 'reserved -> unassigned (Billet RESERVED -> AVAILABLE)', explicitly contrasted with the FORWARD movement 'reserved -> scrapped' on POST /components/{component_id}/disposition with SCRAP."
        distinguishing_aspect: "The compensating direction is the whole point: cancelling recovers the wood to the rack while a QC scrap destroys it, and both start from exactly the same reserved 30.00 board feet. The six-bucket identity has to hold either way, so an implementation that reuses one 'release the billet' helper for both paths keeps the total balanced but puts the wood in the wrong bucket — detectable only because unassigned and scrapped are asserted separately. §1.3 names this the single most likely way to break I1."
        test_recipe:
          setup: "The canonical order at COMPONENTS_RELEASED: lot LOT-001 with 100.00 board feet received, one 30.00 board-foot billet RESERVED to an ACCEPTED component."
          setup_api_calls: *chain_b
          trigger: "GET /tonewood-lots/${lot1} to record the six buckets, then POST /build-orders/${bo1}/cancel with reason CUSTOMER_WITHDREW as CustomShopCoordinator csc-bob, then GET /tonewood-lots/${lot1} again"
          assert:
            http_status: 200
            before_board_feet_available: 69.10
            before_board_feet_unassigned: 0.00
            before_board_feet_reserved: 30.00
            before_board_feet_kerf_loss: 0.90
            after_board_feet_available: 69.10
            after_board_feet_unassigned: 30.00
            after_board_feet_reserved: 0.00
            after_board_feet_consumed: 0.00
            after_board_feet_scrapped: 0.00
            after_board_feet_kerf_loss: 0.90
            billet_status: "AVAILABLE"
            component_status: "SCRAPPED"
            build_order_build_stage: "SCRAPPED"
            build_order_commercial_status: "CANCELLED"
            note: "I1 holds on both sides with no drift: before 69.10 + 0.00 + 30.00 + 0.00 + 0.00 + 0.90 = 100.00; after 69.10 + 30.00 + 0.00 + 0.00 + 0.00 + 0.90 = 100.00. The compensation moved 30.00 board feet from reserved back to unassigned, NOT to scrapped — the billet is on the rack and can be cut into a component for a different order. The contrast case, POST /components/${cmp1}/disposition with SCRAP, keeps the same total but lands the 30.00 in scrapped with unassigned staying 0.00. Kerf loss is never recoverable in either direction."

      - name: i2_deposit_conserved_when_the_forfeit_cap_binds
        grounds: "§1.3 cancellation_deposit_disposition declares invariant I2 (paid == applied + refunded + forfeited + held) and the compensating branch at cancel: 'forfeit = min(deposit_held_cents, round_half_up(basis * CANCEL_FORFEIT_BP / 10000))', with the note 'The min(...) cap is load-bearing: the mill can never forfeit more than the customer actually left on deposit'."
        distinguishing_aspect: "A different ledger (integer cents, four buckets) whose compensation is not a straight bucket-to-bucket move but a WATERFALL through a cap, and this instance is built specifically so the cap BINDS: the 25 percent forfeit of the binding total (179153) exceeds everything the customer ever paid (88619), so the refund must come out as exactly zero rather than negative. An implementation that computes refund = held - forfeit without the min() emits refunded -90534 and breaks I2 while still 'summing' correctly."
        test_recipe:
          setup: "The canonical order confirmed with the minimum legal deposit of 88619 cents and locked, giving binding_quote_total_cents 716610."
          setup_api_calls: *chain_c
          trigger: "POST /build-orders/${bo1}/cancel with reason ARTIST_WITHDREW as CustomShopCoordinator csc-bob"
          assert:
            http_status: 200
            deposit_paid_cents: 88619
            deposit_applied_cents: 0
            deposit_refunded_cents: 0
            deposit_forfeited_cents: 88619
            deposit_held_cents: 0
            binding_quote_total_cents: 716610
            commercial_status: "CANCELLED"
            build_stage: "SCRAPPED"
            note: "basis is the binding total because commercial_status was OPTIONS_LOCKED: round_half_up(716610 * 2500 / 10000) = round_half_up(179152.5) = 179153, capped by min(88619, 179153) = 88619, leaving refund 0. I2 holds: 88619 == 0 + 0 + 88619 + 0. With a 200000 cent deposit instead, the same cancel forfeits 179153 and refunds 20847 (the §1.3 worked example) — the cap is the only thing that differs, and it is what keeps the identity from going negative."

      - name: i3_station_minutes_conserved_when_a_hold_is_released
        grounds: "§1.3 station_minute_ledger declares invariant I3 (total_scheduled_minutes == held_minutes + consumed_minutes + released_minutes) and marks POST /station-reservations/{reservation_id}/release as COMPENSATING (held -> released), alongside the forward move held -> consumed on route / hand-shape."
        distinguishing_aspect: "A third conserved quantity in a third unit (integer machine minutes) whose compensation deliberately does NOT reduce the total: total_scheduled_minutes is a permanent record of everything ever booked, so releasing a hold moves minutes sideways into released_minutes rather than subtracting them. An implementation that decrements total_scheduled_minutes on release keeps a tidy-looking held count and destroys the audit trail — and the identity still appears to hold, which is why total_scheduled_minutes must be asserted explicitly as unchanged."
        test_recipe:
          setup: "One CNC router with two HELD one-hour windows and nothing consumed yet."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "BR-1", room_type: "BUILD_ROOM", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 10 }, as: PlantAdmin, captures: { br1: "$.data.id" } }
            - { call: "POST /stations", payload: { station_code: "CNC-1", station_type: "CNC_ROUTER", room_id: "${br1}", changeover_minutes: 30 }, as: PlantAdmin, captures: { cnc1: "$.data.id" } }
            - { call: "POST /station-reservations", payload: { station_id: "${cnc1}", starts_at: "2026-08-02T08:00:00Z", ends_at: "2026-08-02T09:00:00Z" }, as: Machinist, captures: { res1: "$.data.id" } }
            - { call: "POST /station-reservations", payload: { station_id: "${cnc1}", starts_at: "2026-08-02T10:00:00Z", ends_at: "2026-08-02T11:00:00Z" }, as: Machinist, captures: { res2: "$.data.id" } }
          trigger: "GET /stations/${cnc1} to record the four buckets, then POST /station-reservations/${res1}/release as Machinist, then GET /stations/${cnc1} again"
          assert:
            http_status: 200
            before_total_scheduled_minutes: 120
            before_held_minutes: 120
            before_released_minutes: 0
            after_total_scheduled_minutes: 120
            after_held_minutes: 60
            after_consumed_minutes: 0
            after_released_minutes: 60
            reservation_status: "RELEASED"
            note: "I3 holds on both sides: before 120 == 120 + 0 + 0; after 120 == 60 + 0 + 60. total_scheduled_minutes is unchanged because the booking really happened and was really given back. A second release of the same reservation must fail with ERR_RESERVATION_STATE_INVALID rather than double-counting 60 minutes into released_minutes. The cascade-driven route to the same compensation — the climate excursion releasing future holds — is asserted by climate_excursion_cascades_four_levels_deep, where the same station ends with held 0, consumed 60, released 60 against a total of 120."
