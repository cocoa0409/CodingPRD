        claim_type: occ_stale_version
        grounds: ["concurrency_rules[agreement-amend-stale-version]", "errors[ERR_STALE_AGREEMENT_VERSION]"]
        distinguishing_aspect: "OCC on TakedownAgreement.version: amend carrying the version captured at activation succeeds and bumps the version; a second amend replaying that same captured version is rejected 412 ERR_STALE_AGREEMENT_VERSION."
        test_recipe:
          setup: ["Parcel P ACQUIRED; agreement AG ACTIVE; version captured from the activate response"]
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "OCP", county: "Travis", earnest_money_cents: 100000 }
              as: DeveloperOperator
              captures: { ocp: $.data.id }
