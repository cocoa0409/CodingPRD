    side_effects: ["Participant -> ACTIVE; EbtAccount -> OPEN"]

  - method: POST
    path: "/certifications/{id}/terminate"
    description: "Terminate a certification; cascades to prescriptions and EBT."
    roles: [CompetentProfessionalAuthority]
    code: 200
    input: []
    output: Certification
    side_effects:
      - "Participant -> TERMINATED; active_caseload_count--; FoodPrescriptions -> VOIDED; EbtAccount -> FROZEN"

  # ---------- FoodPrescription ----------
  - method: POST
    path: "/food-prescriptions"
    description: "Issue a food package onto the participant's EBT (ISSUED). OCC on participant version."
    roles: [CompetentProfessionalAuthority]
    code: 201
    input: [certification_id, line_items, "issuance_mode?", expected_participant_version]
    output: FoodPrescription
    side_effects:
      - "Compute prescribed_value_cents (calculations.prescribed_value); top up EbtAccount issued_value_cents & balance_units; increments Participant.version by 1"

  - method: GET
    path: "/food-prescriptions/{id}"
    description: "Get a food prescription."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: []
    output: FoodPrescription
    side_effects: []

  - method: GET
    path: "/food-prescriptions"
    description: "List food prescriptions, filterable by certification_id and participant_id (reverse-reachability for FoodPrescription.certification_id AND FoodPrescription.participant_id)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: ["certification_id?", "participant_id?", "limit?", "offset?"]
    output: FoodPrescription[]
    side_effects: []

  # ---------- EBT ----------
  - method: GET
    path: "/ebt-accounts/{id}"
    description: "Get an EBT account (balances, value reconciliation)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority, Participant]
    code: 200
    input: []
    output: EbtAccount
    side_effects: []

  - method: GET
    path: "/ebt-accounts"
    description: "List EBT accounts, filterable by participant_id (reverse-reachability for EbtAccount.participant_id)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority, Participant]
    code: 200
    input: ["participant_id?", "limit?", "offset?"]
    output: EbtAccount[]
    side_effects: []

  - method: POST
    path: "/redemptions"
    description: "Record an EBT redemption (draw-down)."
    roles: [Participant, EligibilityClerk]
    code: 201
    input: [ebt_account_id, vendor_id, food_category, units]
    output: Redemption
    side_effects:
      - "Debit balance_units; bump redeemed_value_cents; recompute remaining; advance owning FoodPrescription status"

  - method: GET
    path: "/redemptions/{id}"
    description: "Get a redemption."
    roles: [EligibilityClerk, CompetentProfessionalAuthority, Participant]
    code: 200
    input: []
    output: Redemption
    side_effects: []

  - method: GET
    path: "/redemptions"
    description: "List redemptions, filterable by ebt_account_id and vendor_id (reverse-reachability for Redemption.ebt_account_id AND Redemption.vendor_id)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority, Participant]
    code: 200
    input: ["ebt_account_id?", "vendor_id?", "limit?", "offset?"]
    output: Redemption[]
    side_effects: []

  # ---------- Clinic appointments ----------
  - method: POST
    path: "/clinic-appointments"
    description: "Schedule a clinic appointment. OCC on clinic version; overlap-checked (half-open)."
    roles: [EligibilityClerk]
    code: 201
    input: [clinic_id, participant_id, purpose, start_utc, end_utc, expected_clinic_version]
    output: ClinicAppointment
    side_effects: ["status=SCHEDULED; increments Clinic.version by 1"]

  - method: GET
    path: "/clinic-appointments/{id}"
    description: "Get a clinic appointment."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: []
    output: ClinicAppointment
    side_effects: []

  - method: GET
    path: "/clinic-appointments"
    description: "List appointments, filterable by clinic_id and participant_id (reverse-reachability for ClinicAppointment.clinic_id AND ClinicAppointment.participant_id)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: ["clinic_id?", "participant_id?", "limit?", "offset?"]
    output: ClinicAppointment[]
    side_effects: []

  - method: PATCH
    path: "/clinic-appointments/{id}"
    description: "Reschedule (SCHEDULED -> RESCHEDULED); overlap-checked at new interval."
    roles: [EligibilityClerk]
    code: 200
    input: [start_utc, end_utc]
    output: ClinicAppointment
    side_effects: ["update interval; status -> RESCHEDULED"]

  - method: POST
    path: "/clinic-appointments/{id}/confirm"
    description: "Confirm a rescheduled appointment (RESCHEDULED -> SCHEDULED)."
    roles: [EligibilityClerk]
    code: 200
    input: []
    output: ClinicAppointment
    side_effects: ["status -> SCHEDULED"]

  - method: POST
    path: "/clinic-appointments/{id}/complete"
    description: "Mark appointment completed (cross-entity gate on participant)."
    roles: [CompetentProfessionalAuthority]
    code: 200
    input: []
    output: ClinicAppointment
    side_effects: ["status -> COMPLETED"]

  - method: POST
    path: "/clinic-appointments/{id}/no-show"
    description: "Mark a past appointment as no-show."
    roles: [EligibilityClerk]
    code: 200
    input: []
    output: ClinicAppointment
    side_effects: ["status -> NO_SHOW"]

  - method: POST
    path: "/clinic-appointments/{id}/cancel"
    description: "Cancel an appointment (frees interval)."
    roles: [EligibilityClerk]
    code: 200
    input: []
    output: ClinicAppointment
    side_effects: ["status -> CANCELLED"]

  # ---------- Peer support ----------
  - method: POST
    path: "/peer-sessions"
    description: "Schedule a breastfeeding peer-support session; buffered overlap on counselor."
    roles: [CompetentProfessionalAuthority]
    code: 201
    input: [participant_id, peer_counselor_id, start_utc, end_utc]
    output: PeerSupportSession
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/peer-sessions/{id}"
    description: "Get a peer-support session."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: []
    output: PeerSupportSession
    side_effects: []

  - method: GET
    path: "/peer-sessions"
    description: "List peer-support sessions, filterable by participant_id (reverse-reachability for PeerSupportSession.participant_id)."
    roles: [EligibilityClerk, CompetentProfessionalAuthority]
    code: 200
    input: ["participant_id?", "limit?", "offset?"]
    output: PeerSupportSession[]
    side_effects: []

  - method: POST
    path: "/peer-sessions/{id}/complete"
    description: "Complete a peer-support session."
    roles: [CompetentProfessionalAuthority]
    code: 200
    input: []
    output: PeerSupportSession
    side_effects: ["status -> COMPLETED"]

  - method: POST
    path: "/peer-sessions/{id}/cancel"
    description: "Cancel a peer-support session (frees the buffered interval)."
    roles: [CompetentProfessionalAuthority]
    code: 200
    input: []
    output: PeerSupportSession
    side_effects: ["status -> CANCELLED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,        http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN,              http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND,             http: 404, condition: "A path- or body-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST,        http: 400, condition: "Missing required field, invalid enum, negative integer, malformed body" }
  - { id: ERR_STALE_VERSION,          http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE,          http: 409, condition: "Resource is not in a valid state for the requested transition" }
  - { id: ERR_NO_INCOME_RECORDS,      http: 409, condition: "determine-income invoked with zero IncomeRecords attached" }
  - { id: ERR_SEGREGATION_OF_DUTIES,  http: 403, condition: "Certifier (X-User-ID at approve) equals determined_by_user_id — SoD violation" }
  - { id: ERR_DUAL_PARTICIPATION,     http: 409, condition: "Another participant with identical (full_name, ssn_last4) in a different household holds an ACTIVE certification" }
  - { id: ERR_INCOME_INELIGIBLE,      http: 409, condition: "Approval attempted while income_eligible == false" }
  - { id: ERR_RISK_INELIGIBLE,        http: 409, condition: "Approval attempted while risk_eligible == false" }
  - { id: ERR_CASELOAD_EXCEEDED,      http: 409, condition: "Approval would push agency.active_caseload_count above caseload_cap" }
  - { id: ERR_CERT_NOT_ACTIVE,        http: 409, condition: "Redemption attempted while the owning certification is not ACTIVE" }
  - { id: ERR_EBT_FROZEN,             http: 409, condition: "Redemption attempted while the EBT account is FROZEN" }
  - { id: ERR_INSUFFICIENT_BALANCE,   http: 409, condition: "Redemption units exceed remaining balance for the food category" }
  - { id: ERR_VENDOR_NOT_AUTHORIZED,  http: 409, condition: "Redemption references a vendor whose status is not AUTHORIZED" }
  - { id: ERR_CERT_PERIOD_ENDED,      http: 409, condition: "Reinstate attempted after the certification period_end_utc has passed" }
  - { id: ERR_APPOINTMENT_OVERLAP,    http: 409, condition: "Appointment/peer-session interval collides with an existing one on the resource (half-open clinic interval, buffered counselor session)" }
  - { id: ERR_APPOINTMENT_NOT_PAST,   http: 409, condition: "no-show invoked while current_utc < end_utc" }
  - { id: ERR_PARTICIPANT_NOT_SERVICEABLE, http: 409, condition: "complete appointment while participant is not in {APPLICANT, ACTIVE}" }
  - { id: ERR_CATEGORY_FOOD_MISMATCH, http: 409, condition: "Food prescription line item names a food_category with no cap for the participant's category" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EligibilityClerk
    description: "Front-desk staff: creates agencies/clinics/vendors/households/participants/applications, attaches income records, runs income determination, manages vendors and clinic appointments."
    identity: opaque
    exclusive_operations:
      - "POST /agencies, /clinics, /vendors (+ vendor lifecycle), /households, /participants, /applications, /income-records"
      - "POST /applications/{id}/determine-income"
      - "POST/PATCH clinic-appointments lifecycle except complete"
    shared_operations:
      - "GET reads"
      - "POST /redemptions (clerk may record on behalf of a participant)"
      - "POST /_clock/* (test-driving)"

  - name: CompetentProfessionalAuthority
    description: "Credentialed nutrition professional (CPA): performs risk assessment, approves/denies & certifies, manages certifications, issues food prescriptions, completes appointments, runs peer-support sessions."
    identity: opaque
    exclusive_operations:
      - "POST /applications/{id}/assess-risk"
      - "POST /applications/{id}/approve, /applications/{id}/deny"
      - "certification lifecycle (suspend/reinstate/terminate)"
      - "POST /food-prescriptions"
      - "POST /clinic-appointments/{id}/complete"
      - "peer-session lifecycle (create/complete/cancel)"
    shared_operations:
      - "GET reads"
      - "POST /_clock/* (test-driving)"
    note: "SoD anchor: the X-User-ID approving an application must differ from the X-User-ID that ran determine-income, even though both staff roles use opaque identities."

  - name: Participant
    description: "A WIC participant viewing their own EBT account and recording redemptions."
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "GET /participants/{id} (own), /ebt-accounts (own), /redemptions (own)"
      - "POST /redemptions (own EBT account)"
