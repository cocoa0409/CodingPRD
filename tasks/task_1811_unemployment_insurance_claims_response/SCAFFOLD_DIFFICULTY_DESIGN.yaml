# =============================================================================
# §1.8 Scaffold Difficulty Design — Task 1811 UI Claims Response
# 9 rules x 3 instances = 27 instances (saturated beyond the >=2 expert floor)
# =============================================================================
scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: deadline_calendar_vs_business_basis
        grounds:
          - calculations.response_deadline_computation
          - entities.UiClaim.fields.response_due_at
          - entities.StateRule.fields.window_basis
        distinguishing_aspect: |
          Identical notice date and 10-day window produce different response_due_at
          values depending on StateRule.window_basis: CALENDAR yields 2026-08-13T17:00:00Z
          while BUSINESS yields 2026-08-17T17:00:00Z — a dual-variant calculation on the
          UiClaim deadline domain.
        test_recipe:
          setup:
            - "Two StateRule rows: XX with window_basis=CALENDAR, response_window_days=10; ZZ with window_basis=BUSINESS, response_window_days=10"
            - "Employer E; separation S; clock at 2026-08-03T09:00:00Z"
            - "Two claims, one per state, both notice_received_at 2026-08-03T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 10, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/state-rules"
              payload: { state_code: "ZZ", response_window_days: 10, window_basis: "BUSINESS", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "Acme", fein: "123456780", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "Pat", ssn_last4: "1111", last_day_worked: "2026-07-30T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep_id: $.data.id }
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep_id}", state_code: "XX", state_claim_number: "XX-100", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { claim_cal_due: $.data.response_due_at }
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep_id}", state_code: "ZZ", state_claim_number: "ZZ-100", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { claim_biz_due: $.data.response_due_at }
          trigger:
            - call: "GET /ui/claims"
              payload: {}
              as: ClaimsAnalyst
          assert:
            - "UiClaim (state XX).response_due_at == '2026-08-13T17:00:00Z'"
            - "UiClaim (state ZZ).response_due_at == '2026-08-17T17:00:00Z'"
            - "'${claim_cal_due}' != '${claim_biz_due}'"

      - name: rating_reserve_vs_benefit_ratio
        grounds:
          - calculations.experience_rating_projection
          - entities.ExperienceRatingModel.fields.projected_rate_bps
          - entities.EmployerAccount.fields.merit_rating_method
        distinguishing_aspect: |
          Identical employer economics (reserve 50000000 cents against payroll
          1000000000 cents, i.e. ratio 0.05 vs benefit charges 30000000 cents, ratio
          0.03) produce projected_rate_bps 360 under RESERVE_RATIO and 270 under
          BENEFIT_RATIO — a dual-variant calculation on the ExperienceRatingModel
          domain, distinct from the deadline domain instance.
        test_recipe:
          setup:
            - "Employer R with merit_rating_method=RESERVE_RATIO, reserve_balance_cents=50000000, taxable_payroll_cents=1000000000, posture CLEAR"
            - "Employer B with merit_rating_method=BENEFIT_RATIO, taxable_payroll_cents=1000000000 and 30000000 cents of SUSTAINED charge lines"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 10, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "ResCo", fein: "123456781", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000, reserve_balance_cents: 50000000 }
              as: PlatformAdmin
              captures: { emp_r_id: $.data.id }
            - call: "POST /ui/employers"
              payload: { legal_name: "BenCo", fein: "123456782", merit_rating_method: "BENEFIT_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp_b_id: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_b_id}", claimant_name: "Sam", ssn_last4: "2222", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep_b_id: $.data.id }
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_b_id}", separation_id: "${sep_b_id}", state_code: "XX", state_claim_number: "XX-200", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 50000, max_benefit_cents: 50000000 }
              as: ClaimsAnalyst
              captures: { claim_b_id: $.data.id }
            - call: "POST /ui/charge-statements"
              payload: { employer_id: "${emp_b_id}", state_code: "XX", quarter: "2026Q3", issued_at: "2026-08-03T09:00:00Z" }
              as: AgencyLiaison
              captures: { stmt_b_id: $.data.id }
            - call: "POST /ui/charge-statements/${stmt_b_id}/line-items"
              payload: { claim_id: "${claim_b_id}", amount_cents: 30000000, benefit_weeks: 20 }
              as: AgencyLiaison
            - call: "POST /ui/employers/${emp_r_id}/experience-rating-models"
              payload: { model_year: 2027, variant: "RESERVE_RATIO", kind: "OFFICIAL" }
              as: RatingAnalyst
              captures: { model_r_rate: $.data.projected_rate_bps }
            - call: "POST /ui/employers/${emp_b_id}/experience-rating-models"
              payload: { model_year: 2027, variant: "BENEFIT_RATIO", kind: "OFFICIAL" }
              as: RatingAnalyst
              captures: { model_b_rate: $.data.projected_rate_bps }
          trigger:
            - call: "GET /ui/employers/${emp_r_id}/rating-summary"
              payload: {}
              as: RatingAnalyst
          assert:
            - "ExperienceRatingModel (reserve).projected_rate_bps == 360"
            - "ExperienceRatingModel (benefit).projected_rate_bps == 270"
            - "'${model_r_rate}' != '${model_b_rate}'"

      - name: completeness_score_category_presence_vs_absence
        grounds:
          - calculations.documentation_assembly_score
          - entities.ClaimResponse.fields.completeness_score
          - entities.EvidenceDocument.fields.doc_category
        distinguishing_aspect: |
          On the ClaimResponse domain (distinct from deadline and rating domains):
          a single authenticated FINAL_INCIDENT_REPORT yields completeness_score 40
          (submit allowed), while the same document unauthenticated yields 30
          (submit rejected) — two valid interpretations of identical narrative facts
          diverge purely on the authentication flag.
        test_recipe:
          setup:
            - "State XX (CALENDAR, 10d, NONE); employer E; separation S (DISCHARGE_MISCONDUCT); claim C1 with authenticated incident report; claim C2 with unauthenticated incident report; clock 2026-08-03T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 10, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "DocCo", fein: "123456783", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "Lee", ssn_last4: "3333", last_day_worked: "2026-07-30T00:00:00Z", separation_reason: "DISCHARGE_MISCONDUCT" }
              as: ClaimsAnalyst
              captures: { sep_id: $.data.id }
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep_id}", state_code: "XX", state_claim_number: "XX-300", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { claim1_id: $.data.id }
            - call: "POST /ui/claims/${claim1_id}/responses"
              payload: { response_type: "PROTEST", separation_reason_code: "DISCHARGE_MISCONDUCT", narrative: "Terminated for cause per attached incident report." }
              as: ClaimsAnalyst
              captures: { resp1_id: $.data.id }
            - call: "POST /ui/claims/${claim1_id}/evidence"
              payload: { doc_category: "FINAL_INCIDENT_REPORT", doc_date: "2026-07-29T00:00:00Z", authenticated: true, response_id: "${resp1_id}" }
              as: ClaimsAnalyst
            - call: "GET /ui/responses/${resp1_id}"
              payload: {}
              as: ClaimsAnalyst
              captures: { score_auth: $.data.completeness_score }
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep_id}", state_code: "XX", state_claim_number: "XX-301", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { claim2_id: $.data.id }
            - call: "POST /ui/claims/${claim2_id}/responses"
              payload: { response_type: "PROTEST", separation_reason_code: "DISCHARGE_MISCONDUCT", narrative: "Terminated for cause per attached incident report." }
              as: ClaimsAnalyst
              captures: { resp2_id: $.data.id }
            - call: "POST /ui/claims/${claim2_id}/evidence"
              payload: { doc_category: "FINAL_INCIDENT_REPORT", doc_date: "2026-07-29T00:00:00Z", authenticated: false, response_id: "${resp2_id}" }
              as: ClaimsAnalyst
            - call: "GET /ui/responses/${resp2_id}"
              payload: {}
              as: ClaimsAnalyst
              captures: { score_unauth: $.data.completeness_score }
          trigger:
            - call: "GET /ui/responses/${resp1_id}"
              payload: {}
              as: ClaimsAnalyst
          assert:
            - "ClaimResponse.${resp1_id}.completeness_score == 40"
            - "ClaimResponse.${resp2_id}.completeness_score == 30"
            - "'${score_auth}' != '${score_unauth}'"

  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: rating_tiered_lookup_with_posture_surcharge
        grounds:
          - calculations.experience_rating_projection
          - calculations.posture_recompute
          - entities.ExperienceRatingModel.fields.projected_rate_bps
        distinguishing_aspect: |
          Mode (a): tiered-rate selection with >=3 inputs and non-linear interaction —
          projected_rate_bps depends on ratio tier, compliance_posture surcharge, and
          RATE_CAP_BPS clamp; a SANCTIONED employer at reserve ratio 0.02 lands at
          230 bps (180 tier + 50 surcharge), not any single-input function.
        test_recipe:
          setup:
            - "Employer with reserve_balance_cents=20000000, payroll=1000000000 (ratio 0.02 -> tier 180), and 4 late_response_strikes so posture == SANCTIONED"
            - "Strikes accrued via 4 claims each submitted LATE (clock moved past each claim's due date before submit)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 5, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "TierCo", fein: "123456784", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000, reserve_balance_cents: 20000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "A", ssn_last4: "4001", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep1: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "B", ssn_last4: "4002", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep2: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "C", ssn_last4: "4003", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep3: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "D", ssn_last4: "4004", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep4: $.data.id }
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep1}", state_code: "XX", state_claim_number: "XX-401", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { c1: $.data.id }
            - call: "POST /ui/claims/${c1}/responses"
              payload: { response_type: "INFORMATION_ONLY", separation_reason_code: "LAYOFF", narrative: "Acknowledged." }
              as: ClaimsAnalyst
              captures: { r1: $.data.id }
            - call: "POST /ui/claims/${c1}/evidence"
              payload: { doc_category: "FINAL_INCIDENT_REPORT", doc_date: "2026-07-01T00:00:00Z", authenticated: true, response_id: "${r1}" }
              as: ClaimsAnalyst
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T18:00:00Z" }
              as: PlatformAdmin
            - call: "GET /ui/claims/${c1}"
              payload: {}
              as: ClaimsAnalyst
              captures: { c1_v: $.data.version }
            - call: "POST /ui/claims/${c1}/responses/${r1}/submit"
              payload: { expected_claim_version: "${c1_v}" }
              as: ClaimsAnalyst
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep2}", state_code: "XX", state_claim_number: "XX-402", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { c2: $.data.id }
            - call: "POST /ui/claims/${c2}/responses"
              payload: { response_type: "INFORMATION_ONLY", separation_reason_code: "LAYOFF", narrative: "Acknowledged." }
              as: ClaimsAnalyst
              captures: { r2: $.data.id }
            - call: "POST /ui/claims/${c2}/evidence"
              payload: { doc_category: "FINAL_INCIDENT_REPORT", doc_date: "2026-07-01T00:00:00Z", authenticated: true, response_id: "${r2}" }
              as: ClaimsAnalyst
            - call: "GET /ui/claims/${c2}"
              payload: {}
              as: ClaimsAnalyst
              captures: { c2_v: $.data.version }
            - call: "POST /ui/claims/${c2}/responses/${r2}/submit"
              payload: { expected_claim_version: "${c2_v}" }
              as: ClaimsAnalyst
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep3}", state_code: "XX", state_claim_number: "XX-403", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { c3: $.data.id }
            - call: "POST /ui/claims/${c3}/responses"
              payload: { response_type: "INFORMATION_ONLY", separation_reason_code: "LAYOFF", narrative: "Acknowledged." }
              as: ClaimsAnalyst
              captures: { r3: $.data.id }
            - call: "POST /ui/claims/${c3}/evidence"
              payload: { doc_category: "FINAL_INCIDENT_REPORT", doc_date: "2026-07-01T00:00:00Z", authenticated: true, response_id: "${r3}" }
              as: ClaimsAnalyst
            - call: "GET /ui/claims/${c3}"
              payload: {}
              as: ClaimsAnalyst
              captures: { c3_v: $.data.version }
            - call: "POST /ui/claims/${c3}/responses/${r3}/submit"
              payload: { expected_claim_version: "${c3_v}" }
              as: ClaimsAnalyst
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep4}", state_code: "XX", state_claim_number: "XX-404", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { c4: $.data.id }
            - call: "POST /ui/claims/${c4}/responses"
              payload: { response_type: "INFORMATION_ONLY", separation_reason_code: "LAYOFF", narrative: "Acknowledged." }
              as: ClaimsAnalyst
              captures: { r4: $.data.id }
            - call: "POST /ui/claims/${c4}/evidence"
              payload: { doc_category: "FINAL_INCIDENT_REPORT", doc_date: "2026-07-01T00:00:00Z", authenticated: true, response_id: "${r4}" }
              as: ClaimsAnalyst
            - call: "GET /ui/claims/${c4}"
              payload: {}
              as: ClaimsAnalyst
              captures: { c4_v: $.data.version }
            - call: "POST /ui/claims/${c4}/responses/${r4}/submit"
              payload: { expected_claim_version: "${c4_v}" }
              as: ClaimsAnalyst
          trigger:
            - call: "POST /ui/employers/${emp_id}/experience-rating-models"
              payload: { model_year: 2027, variant: "RESERVE_RATIO", kind: "OFFICIAL" }
              as: RatingAnalyst
              captures: { model_id: $.data.id, model_rate: $.data.projected_rate_bps }
          assert:
            - "EmployerAccount.${emp_id}.compliance_posture == 'SANCTIONED'"
            - "EmployerAccount.${emp_id}.late_response_strikes == 4"
            - "ExperienceRatingModel.${model_id}.projected_rate_bps == 230"

      - name: rounding_order_liability_from_integer_rate
        grounds:
          - calculations.experience_rating_projection
          - entities.ExperienceRatingModel.fields.projected_liability_cents
        distinguishing_aspect: |
          Mode (b): pinned rounding order — tier lookup runs on the UNROUNDED ratio,
          then liability is computed from the INTEGER rate and floored; an employer at
          ratio exactly 0.02 lands in the 180 tier (not 270) and liability
          floor(180 * 1000000000 / 10000) == 18000000 cents, whereas rounding the
          ratio first or averaging across tiers would produce a different cent value.
        test_recipe:
          setup:
            - "Employer CLEAR posture, reserve 20000000, payroll 1000000000 -> ratio exactly 0.02"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "RoundCo", fein: "123456785", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000, reserve_balance_cents: 20000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /ui/employers/${emp_id}/experience-rating-models"
              payload: { model_year: 2027, variant: "RESERVE_RATIO", kind: "WHAT_IF" }
              as: RatingAnalyst
              captures: { model_id: $.data.id }
          assert:
            - "ExperienceRatingModel.${model_id}.projected_rate_bps == 180"
            - "ExperienceRatingModel.${model_id}.projected_liability_cents == 18000000"

      - name: protest_score_evaluation_order_fixed
        grounds:
          - calculations.protest_evidence_score
          - entities.ChargeProtest.fields.evidence_strength
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — the
          protest's evidence_strength reads the claim's latest ACCEPTED response
          timeliness, which itself depended on the response deadline, which depended
          on the claim intake timestamp; the scaffold pins the order
          basis-weight -> determination -> timeliness -> confidence -> clamp, so a
          WRONG_EMPLOYER protest with DENIED determination and CONFIRMED coding
          yields exactly 100, and reordering the adjustments before the basis weight
          would violate clamp placement.
        test_recipe:
          setup:
            - "Claim whose response was ON_TIME, determination DENIED, separation coding CONFIRMED; statement with a WRONG_EMPLOYER line of 500000 cents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 10, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "OrdCo", fein: "123456786", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "Eve", ssn_last4: "5001", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep_id: $.data.id }
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep_id}", state_code: "XX", state_claim_number: "XX-500", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /ui/separations/${sep_id}/coding/confirm"
              payload: {}
              as: ClaimsAnalyst
            - call: "POST /ui/claims/${claim_id}/responses"
              payload: { response_type: "PROTEST", separation_reason_code: "LAYOFF", narrative: "Not our former employee's charge." }
              as: ClaimsAnalyst
              captures: { resp_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/evidence"
              payload: { doc_category: "FINAL_INCIDENT_REPORT", doc_date: "2026-07-01T00:00:00Z", authenticated: true, response_id: "${resp_id}" }
              as: ClaimsAnalyst
            - call: "GET /ui/claims/${claim_id}"
              payload: {}
              as: ClaimsAnalyst
              captures: { claim_v: $.data.version }
            - call: "POST /ui/claims/${claim_id}/responses/${resp_id}/submit"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAnalyst
            - call: "POST /ui/claims/${claim_id}/responses/${resp_id}/accept"
              payload: {}
