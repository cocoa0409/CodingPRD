            - "Director.${dir_id}.onboarding_status == \"COMPLETE\" and onboarding_completion_pct == 100.00"

      - name: seating_an_already_seated_director_returns_director_state_invalid
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Director.ONBOARDING_to_SEATED
          - errors[ERR_DIRECTOR_STATE_INVALID]
          - validations.priority_40
        distinguishing_aspect: |
          seat is declared only from ONBOARDING, so a second seat call on a SEATED director returns 409
          ERR_DIRECTOR_STATE_INVALID at priority 40 rather than the priority-45 onboarding gate, and a
          RESIGNED director - a terminal service state - is equally locked against being seated again.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026, one director created directly as SEATED and one director resigned via a RESIGNATION departure notice."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { policy_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Sam Seated", email: "sam@issuer.example", birth_date: "1970-01-01", appointed_on: "2022-01-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { seated_id: $.data.id }
            - call: "POST /governance/directors"
              payload: { full_name: "Gone Away", email: "gone@issuer.example", birth_date: "1971-01-01", appointed_on: "2022-01-01", initial_service_status: "SEATED" }
              as: CorporateSecretary
              captures: { gone_id: $.data.id }
            - call: "POST /governance/directors/${gone_id}/departure-notice"
              payload: { notice_type: "RESIGNATION", effective_on: "2026-07-15" }
              as: CorporateSecretary
          trigger:
            - call: "POST /governance/directors/${seated_id}/seat"
              payload: {}
              as: CorporateSecretary
              captures: { seated_error_id: $.data.error_id }
            - call: "POST /governance/directors/${gone_id}/seat"
              payload: {}
              as: CorporateSecretary
              captures: { resigned_error_id: $.data.error_id }
          assert:
            - "Both calls return HTTP 409 with data.error_id == \"ERR_DIRECTOR_STATE_INVALID\""
            - "Neither response carries \"ERR_ONBOARDING_INCOMPLETE\", even though neither director has any OnboardingItem rows"
            - "Director.${seated_id}.service_status is still \"SEATED\" and Director.${gone_id}.service_status is still \"RESIGNED\""

      - name: ending_an_already_ended_directorship_returns_directorship_state_invalid
        claim_type: invalid_transitions
