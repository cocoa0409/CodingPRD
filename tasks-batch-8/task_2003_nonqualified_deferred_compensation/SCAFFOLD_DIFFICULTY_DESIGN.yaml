            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-GV", hire_date: "2023-08-03", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${participant_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { account_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${participant_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { election_id: $.data.id }
            - call: "POST /api/deferral-elections/${election_id}/submit"
              as: Participant
              as_user_id: "${participant_id}"
            - call: "POST /_clock/set_current_utc"
