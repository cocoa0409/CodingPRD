  # ===========================================================================
  # Section 3 — Calculations (correct result, input filtering, constants,
  # precision, dual variants)
  # ===========================================================================
  - section: calculations
    instances:
      - name: scheduled_payment_term_floor_correct_result
        claim_type: Correct Result
        grounds:
          - calculations.scheduled_payment
          - entities.Loan.fields.monthly_payment_cents
          - endpoints["POST /loans/{loanId}/originate"]
        distinguishing_aspect: |
          TERM scheduled_payment with monthly_rate==0 (expected_rate_bps=0) uses floor(principal_available / n).
          net_principal_limit = gross(15690000) - lesa(0) - initial_financed_costs(1000000) = 14690000;
          n = tenure_term_months = 120; monthly_payment_cents = floor(14690000 / 120) = 122416.
        test_recipe:
          setup:
            - "TERM loan, expected_rate_bps=0, tenure_term_months=120, PLF age75@0bps=523000, initial_financed_costs=1000000."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Sched Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 0, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Gil Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 0, draw_type: "TERM", tenure_term_months: 120, initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
          assert:
            - "HTTP status == 200"
            - "data.net_principal_limit_cents == 14690000"
            - "data.monthly_payment_cents == 122416"

      - name: lesser_of_payoff_foreclosure_caps_at_95pct_appraised
        claim_type: Correct Result
        grounds:
          - calculations.lesser_of_payoff
          - entities.Resolution.fields.payoff_amount_cents
          - entities.Resolution.fields.deficiency_cents
          - endpoints["POST /resolutions"]
        distinguishing_aspect: |
          FORECLOSURE uses basis_value = loan.appraised_value_cents (30000000); capped = round_half_up(0.95*30000000) = 28500000.
          With a LUMP_SUM balance well above the cap, payoff = min(balance, 28500000) = 28500000 and deficiency = balance - 28500000 (>0), absorbed by FHA.
        test_recipe:
          setup:
            - "LUMP_SUM loan originated so principal_balance > 28500000 (gross 15690000 advance + 1000000 costs is below cap, so use a larger appraised value to force balance high). Use LINE_OF_CREDIT lump draw instead: see chain — LUMP_SUM advances full net principal limit."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Payoff Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 1000000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Hank Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LUMP_SUM", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /maturity-events"
              payload: { loan_id: "${loan_id}", event_type: "PERMANENT_VACANCY", event_date: "2024-06-01" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /resolutions"
              payload: { loan_id: "${loan_id}", path: "FORECLOSURE" }
              as: ComplianceOfficer
              captures: { res_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "PLF factor 1000000 makes gross == max_claim 30000000; net = 30000000 - 1000000 costs = 29000000; LUMP_SUM advances net so principal_balance_cents == 30000000 (1000000 costs + 29000000 net advance)"
            - "data.payoff_amount_cents == 28500000"
            - "data.deficiency_cents == 1500000"

      - name: error_balance_accrual_compound_vs_payoff_quote_projection
        claim_type: Variant Divergence
        grounds:
          - calculations.balance_accrual.variants.payoff_quote_projection
        excluded_because:
          difficulty_instance: dual_variant_calc / balance_accrual_compound_vs_payoff_quote_projection
          rationale: "The accrual round-per-month vs payoff-quote accumulate-then-round divergence is the asserted core of the named §1.8 instance."

      - name: error_lesa_fully_funded_vs_partially_funded_sizing
        claim_type: Variant Divergence
        grounds:
          - calculations.lesa_sizing.variants.fully_funded
          - calculations.lesa_sizing.variants.partially_funded
        excluded_because:
          difficulty_instance: dual_variant_calc / lesa_fully_funded_vs_partially_funded_sizing
          rationale: "FULLY_FUNDED vs PARTIALLY_FUNDED initial_amount_cents delta is the asserted core of the named §1.8 instance."

      - name: error_principal_limit_nested_minmax_tiered_plf
        claim_type: Constants Applied
        grounds:
          - calculations.principal_limit
        excluded_because:
          difficulty_instance: combinatorial_formula / principal_limit_nested_minmax_with_tiered_plf
          rationale: "Nested min/max with tiered PLF selection (incl. AGE_CAP/MIN_AGE constants) is exercised by the named §1.8 instance."

      - name: error_mip_interest_accrual_round_per_month_precision
        claim_type: Precision
        grounds:
          - calculations.balance_accrual
        excluded_because:
          difficulty_instance: combinatorial_formula / mip_interest_accrual_round_per_month_order_pinned
          rationale: "Round-per-month-per-component before accumulation precision/order is the asserted core of the named §1.8 instance."

