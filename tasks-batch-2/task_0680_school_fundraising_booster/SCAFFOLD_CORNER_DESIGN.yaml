        claim_type: Side Effect Execution
        grounds: [state_machines.VolunteerShift.BOOKED_to_RELEASED, calculations.volunteer_committed_minutes, entities.Volunteer.fields.committed_minutes]
        distinguishing_aspect: "Booking a [09:00,12:00) shift sets volunteer.committed_minutes to 180; releasing it drops committed_minutes back to 0 (only BOOKED shifts count)."
        test_recipe:
