        grounds:
          - state_machines.InsuranceCertificate.verification_status
          - state_machines.InsuranceCertificate.lifecycle_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / certificate_lapses_in_lifecycle_dimension_while_verification_dimension_still_pending
          rationale: "The two-dimension independence claim (lifecycle advances while verification stays PENDING, then verification advances without resetting lifecycle) is the entire subject of that §1.8 instance."

      - name: cyclic_prequalification_loop_back_and_regrade
        claim_type: cyclic
        grounds:
          - state_machines.Prequalification.CONDITIONAL_to_UNDER_REVIEW
        excluded_because:
          difficulty_instance: non_linear_state_machine / conditional_prequalification_reenters_under_review_and_regrades_approved_after_variance
          rationale: "The loop back into UNDER_REVIEW and the second grading pass with a different outcome are asserted end-to-end there."

