        distinguishing_aspect: "Immediate consistency: the POST /event-registrations response itself carries the computed status (CONFIRMED) and travel_award_cents (25000) — no re-read is needed to observe the seating and award math."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Event capacity 5, travel budget 100000."
          setup_api_calls:
            - call: "POST /veteran-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /veteran-services/community-events"
              payload: { name: "Immediate Gala", starts_at: "2026-10-20T09:00:00Z", ends_at: "2026-10-20T11:00:00Z", capacity: 5, accessibility_seat_count: 0, travel_budget_cents: 100000 }
              as: EventCoordinator
              captures: { ev: "$.data.id" }
            - call: "POST /veteran-services/members"
              payload: { full_name: "Immediate Member", member_type: "VETERAN", service_era_claimed: "POST_911", injury_connection_claimed: "SERVICE_CONNECTED", branch_of_service: "ARMY" }
              as: IntakeCoordinator
              captures: { m_id: "$.data.id" }
          trigger:
            - call: "POST /veteran-services/event-registrations"
