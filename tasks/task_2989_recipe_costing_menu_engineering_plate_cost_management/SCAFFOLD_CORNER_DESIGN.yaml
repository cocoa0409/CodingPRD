              as: CostAnalyst
              captures: { o_exp: $.data.expected_base_units, o_used: $.data.used_base_units, o_var: $.data.variance_base_units, o_sync: $.data.sync_state }
          assert:
            - "${sauce_batch} == 1268499, ${plate_batch} == 4197196 == 3880071 + 317125, ${plate_portion} == 839439, ${plate_mask} == 9 (PEANUT inherited only through the sub-recipe) and ${plate_depth} == 1; ${mi_cents} == 87"
            - "${c_exp} == 8000 == floor(100 * round_half_up(400*1000000/5) / 1000000) — the direct component contributes 80000000 micros per portion"
            - "${c_used} == 8200 == 10000 + 0 - 1800 and ${c_var} == 200"
            - "${o_exp} == 500 == floor(100 * round_half_up(500 * 100 * 1000000 / (2000*5)) / 1000000) — 5000000 micros of oil per portion, reached only through the child"
            - "${o_used} == 510 and ${o_var} == 10"
            - "${c_sync} == CURRENT and ${o_sync} == CURRENT, each with synced_spec_version copied from the consuming recipe's version"
            - "${c_val} == 0 at creation — valued_usage_micros is written by the close, not by the count line; the close would value them at round_half_up(8200*22000000/2268) == 79541446 and round_half_up(510*12000000/946) == 6469345"

