          trigger:
            - { call: "POST /molds", payload: { mold_code: "M-1", customer_id: "${cust_id}", cavity_count: 2, shot_weight_grams: 90, required_min_tonnage: 60, required_max_tonnage: 120, pm_interval_shots: 4000, tooling_cost_cents: 100000 }, as: PlantAdmin, captures: { e_code: $.data.error_id } }
            - { call: "POST /press-qualifications", payload: { mold_id: "${mold_id}", press_id: "${p150_id}" }, as: ProcessEngineer, captures: { e_qual: $.data.error_id } }
          assert:
            - "the duplicate mold call returns status 409 and ${e_code} == ERR_DUPLICATE_CODE"
            - "the duplicate qualification call returns status 409 and ${e_qual} == ERR_DUPLICATE_QUALIFICATION"
