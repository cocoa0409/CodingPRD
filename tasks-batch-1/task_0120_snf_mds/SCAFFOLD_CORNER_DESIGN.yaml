            - call: "POST /snf/admissions/${adm_id}/assessments"
              payload: { assessment_type: "ADMISSION_5DAY", assessment_reference_date: "2026-02-05T00:00:00Z", pt_function_score: 7, slp_components_count: 1, nta_comorbidity_points: 10 }
              as: MdsCoordinator
              captures: { orig_id: $.data.id }
            - call: "POST /snf/assessments/${orig_id}/start"
              payload: {}
              as: MdsCoordinator
            - call: "POST /snf/assessments/${orig_id}/complete"
              payload: {}
              as: MdsCoordinator
            - call: "POST /snf/assessments/${orig_id}/submit"
              payload: {}
              as: MdsCoordinator
              captures: { orig_v: $.data.version }
          trigger:
            - call: "POST /snf/assessments/${orig_id}/correct"
              payload: { assessment_type: "INTERIM_IPA", assessment_reference_date: "2026-02-12T00:00:00Z", pt_function_score: 9, slp_components_count: 2, nta_comorbidity_points: 8, expected_assessment_version: "${orig_v} - 1" }
              as: MdsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == 'ERR_STALE_VERSION'"

      - name: derived_occupied_bed_count_recompute_on_admit
        claim_type: derived_field_reconciliation
        grounds: [entities.Facility.fields.occupied_bed_count, state_machines.Admission.PENDING_to_ACTIVE]
        distinguishing_aspect: "After activating one admission at a fresh facility, GET /snf/facilities/{id} shows occupied_bed_count==1 (derived field recomputed on the admit side-effect)."
        test_recipe:
          setup: ["a fresh facility with one PRIVATE admission activated"]
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "DF Fac", cms_certification_number: "CCN-DF1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "DF Res", medical_record_number: "MRN-DF1", date_of_birth: "1974-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "PRIVATE", admit_at: "2026-02-01T00:00:00Z" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
          trigger:
            - call: "GET /snf/facilities/${fac_id}"
              payload: {}
              as: Administrator
              captures: { occ: $.data.occupied_bed_count }
          assert:
            - "Facility.${fac_id}.occupied_bed_count == 1"

      - name: cascade_discharge_excluded
        claim_type: cascading_side_effects
        grounds: [state_machines.Admission.DISCHARGE_PLANNED_to_DISCHARGED]
        excluded_because:
          difficulty_instance: discharge_cascade_admission_careplan_goal_depth3
          rationale: "The discharge cascade onto CarePlan/CarePlanGoal is exercised by that §1.8 instance."

  # =====================================================================
  # Consistency model — immediate visibility
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_assessment_groups_in_complete_response
        claim_type: immediate
        grounds: [calculations.pdpm_component_classification, entities.MdsAssessment.fields.pt_ot_case_mix_group]
        distinguishing_aspect: "The case-mix groups computed on complete are present in the same complete-call response (immediate consistency, no re-read needed)."
        test_recipe:
          setup: ["Medicare admission with an IN_PROGRESS 5-day assessment"]
          setup_api_calls:
            - call: "POST /snf/facilities"
              payload: { name: "IM Fac", cms_certification_number: "CCN-IM1", certified_bed_count: 5 }
              as: Administrator
              captures: { fac_id: $.data.id }
            - call: "POST /snf/residents"
              payload: { full_name: "IM Res", medical_record_number: "MRN-IM1", date_of_birth: "1975-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/qualifying-stays"
              payload: { hospital_admit_at: "2026-01-25T10:00:00Z", hospital_discharge_at: "2026-01-29T10:00:00Z" }
              as: AdmissionsCoordinator
              captures: { qs_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
              payload: { level: "LEVEL_I", has_serious_mental_illness_indicator: false }
              as: AdmissionsCoordinator
              captures: { pasrr_id: $.data.id }
            - call: "POST /snf/pasrr-screenings/${pasrr_id}/resolve"
              payload: { resolution: "CLEAR" }
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions"
              payload: { resident_id: "${res_id}", facility_id: "${fac_id}", pasrr_screening_id: "${pasrr_id}", payer_source: "MEDICARE_A", admit_at: "2026-02-01T00:00:00Z", qualifying_stay_id: "${qs_id}" }
              as: AdmissionsCoordinator
              captures: { adm_id: $.data.id }
            - call: "POST /snf/admissions/${adm_id}/activate"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /snf/admissions/${adm_id}/assessments"
              payload: { assessment_type: "ADMISSION_5DAY", assessment_reference_date: "2026-02-05T00:00:00Z", pt_function_score: 7, slp_components_count: 1, nta_comorbidity_points: 10 }
              as: MdsCoordinator
              captures: { mds_id: $.data.id }
            - call: "POST /snf/assessments/${mds_id}/start"
              payload: {}
              as: MdsCoordinator
          trigger:
            - call: "POST /snf/assessments/${mds_id}/complete"
              payload: {}
              as: MdsCoordinator
              captures: { ptg: $.data.pt_ot_case_mix_group, st: $.data.status }
          assert:
            - "MdsAssessment.${mds_id}.pt_ot_case_mix_group == 'TB' in the complete response"
            - "MdsAssessment.${mds_id}.status == 'COMPLETED' in the complete response"
