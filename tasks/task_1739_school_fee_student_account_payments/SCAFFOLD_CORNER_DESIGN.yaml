              captures: { i1_amt: "$.data[0].amount_cents", i2_amt: "$.data[1].amount_cents", i3_amt: "$.data[2].amount_cents", i2_due: "$.data[1].due_date", i3_due: "$.data[2].due_date" }
          assert:
            - "${covered} == 10001"
            - "${i1_amt} == 3333 and ${i2_amt} == 3333 and ${i3_amt} == 3335 (floor division, remainder 2 on LAST)"
            - "${i2_due} == 2026-10-05 and ${i3_due} == 2026-11-04"
