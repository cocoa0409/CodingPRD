  - section: errors
    instances:
      - name: header_and_pagination_gates_answer_before_any_resource_is_touched
        claim_type: Error Triggerable
        grounds:
          - validations[priority=1]
          - validations[priority=16]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination
        distinguishing_aspect: "The two envelope-level gates are separated from every domain rule: the 401 fires for a missing X-User-Role, a missing X-User-ID and an unknown role value alike (and outranks the 404 that the same request's unknown path id would otherwise produce), while limit 0, limit 101 and offset -1 are each 400 ERR_INVALID_PAGINATION whereas limit 100 with offset 0 is admitted at the inclusive edge."
        test_recipe:
          setup:
            - "One owner with one property (no other data is needed)."
            - "The 401 probes cannot be written as structured calls because `as:` must name a declared role, so they are specified here: (i) GET /pbra/owners/{owner_id} with no X-User-Role header, (ii) the same request with X-User-Role: ContractAdministrator but no X-User-ID header, (iii) the same request with X-User-Role: Auditor (a value outside the four declared roles), and (iv) GET /pbra/owners/00000000-0000-0000-0000-000000000000 with no X-User-Role header."
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_id: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_id}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_id}"
              captures: { property_id: $.data.id }
          trigger:
            - call: "GET /pbra/owners/${owner_id}/properties"
              payload: { limit: 0, offset: 0 }
              as: ContractAdministrator
              as_user_id: "ca-reader-1"
            - call: "GET /pbra/owners/${owner_id}/properties"
              payload: { limit: 101, offset: 0 }
              as: ContractAdministrator
              as_user_id: "ca-reader-1"
            - call: "GET /pbra/owners/${owner_id}/properties"
              payload: { limit: 10, offset: -1 }
              as: ContractAdministrator
              as_user_id: "ca-reader-1"
            - call: "GET /pbra/owners/${owner_id}/properties"
              payload: { limit: 100, offset: 0 }
              as: ContractAdministrator
              as_user_id: "ca-reader-1"
          assert:
            - "Probes (i), (ii) and (iii) each return HTTP 401 with error_id ERR_UNAUTHENTICATED and message present in the envelope"
            - "Probe (iv) also returns 401 ERR_UNAUTHENTICATED, not 404 ERR_OWNER_NOT_FOUND — authentication is decided before the path id is resolved"
            - "limit 0 returns HTTP 400 with error_id ERR_INVALID_PAGINATION (the minimum is 1)"
            - "limit 101 returns HTTP 400 with error_id ERR_INVALID_PAGINATION (the maximum is 100)"
            - "offset -1 returns HTTP 400 with error_id ERR_INVALID_PAGINATION"
            - "limit 100 with offset 0 returns HTTP 200 whose envelope reports limit 100, offset 0, total_count 1 and has_more false — 100 is inside the inclusive maximum"

      - name: three_fiscal_floors_and_ceilings_are_each_reachable_on_one_contract
        claim_type: Error Triggerable
        grounds:
          - validations[priority=71]
          - validations[priority=73]
          - validations[priority=74]
          - errors[ERR_BUDGET_RENT_EXCEEDS_CAP]
          - errors[ERR_ZERO_VOUCHER_REQUEST]
          - errors[ERR_ZERO_CLAIM_AMOUNT]
          - calculations.budget_based_rent
        distinguishing_aspect: "One property with no tenants makes all three fiscal refusals reachable without interference: the budget-based rent 179820 overshoots the 143220 comparable cap at approve-rents, an empty rent roll makes requested_hap_cents exactly 0 so the voucher cannot be submitted (the create still succeeds — the floor is checked at submit, not at create), and a claim whose security deposit fully offsets the arrears computes to exactly 0 and is refused at submit."
        test_recipe:
          setup:
