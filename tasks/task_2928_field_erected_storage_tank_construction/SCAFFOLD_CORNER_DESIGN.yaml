            - "the second review returns HTTP 200 with status == 'ACCEPTED', reviewed_by_user_id == 'ai-3', deficiency_count == 0, accepted_at_utc == '2026-08-11T00:00:00Z'"
            - "the accepted package carries the in-service schedule computed from the bottom plate: bottom_remaining_life_years == 15.00, internal_inspection_interval_years == 7 (FLOOR(15.00/2) under the 20 year cap), external_inspection_interval_years == 2 (the tank has no ACCEPTED EXTERNAL_COATING - only the INTERNAL_LINING), next_internal_due_utc == '2033-08-11T00:00:00Z' and next_external_due_utc == '2028-08-11T00:00:00Z'"
            - "Tank.${tank_id}.construction_phase is 'COMMISSIONED' only after the successful review, never after the refused one"

  # ===========================================================================
  # §1.0 complexity_layers: dual_variant_calculation, cascading_side_effects,
  # rate_threshold_triggers, optimistic_concurrency. The first three are the
  # spine of §1.8 and are cited as exclusions below; optimistic_concurrency is
  # touched nowhere in §1.8, so both §1.2.1 rules are probed here, one instance
  # per rule, using each rule's own declared write_endpoint and occ_field.
  # derived_field_reconciliation is not a declared layer but the
  # shell_course_required_thickness rule is explicitly re-evaluated when a lower
  # course appears, which is the reconciliation claim in its purest form.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: hydrotest_plan_create_enforces_the_tank_version_precondition
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.hydrotest-plan-supersede-stale-tank
          - validations.priority_7_ERR_STALE_TANK_VERSION
          - errors.ERR_STALE_TANK_VERSION
          - entities.Tank.fields.active_hydrotest_plan_id
        distinguishing_aspect: |
          The first §1.2.1 rule, walked in all three directions the guide asks for: a stale
          expected_tank_version is refused with ERR_STALE_TANK_VERSION at HTTP 412 (not 409 -
          this is a precondition failure, not a state failure), the refreshed version
          succeeds, and the successful create itself advances Tank.version so the value that
          just worked is stale on the very next attempt. The version is moved twice by two
          different mechanisms - once by a foundation acceptance cascading a phase change
          onto the tank, once by the plan create re-pointing active_hydrotest_plan_id - which
          proves the guard reads the live tank row rather than a per-endpoint counter.
        test_recipe:
          setup:
            - "Tank TK-101 with a water source registered and a foundation package accepted, so the tank's version has already moved once since the client read it at creation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id, tank_v0: $.data.version }
            - call: "POST /water-sources"
              payload: { source_name: "Riverside Intake", source_type: "RIVER", permitted_volume_gal: 2000000, max_concurrent_rate_gpm: 900, water_cost_usd_per_kgal: 3.33, disposal_cost_usd_per_kgal: 2.10, permit_expiry_utc: "2027-06-30T00:00:00Z" }
              as: ProjectEngineer
              captures: { ws_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
            - call: "POST /foundation-packages/${fp_id}/acceptance"
              payload: { decision: "ACCEPT" }
              as: ProjectEngineer
          trigger:
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 400000, disposal_method: "DISCHARGE_TO_POTW", hold_hours: 24, expected_tank_version: "${tank_v0}" }
              as: ProjectEngineer
            - call: "GET /tanks/${tank_id}"
              as: ProjectEngineer
              captures: { tank_v1: $.data.version }
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 400000, disposal_method: "DISCHARGE_TO_POTW", hold_hours: 24, expected_tank_version: "${tank_v1}" }
              as: ProjectEngineer
              captures: { plan1: $.data.id }
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 400000, disposal_method: "DISCHARGE_TO_POTW", hold_hours: 24, expected_tank_version: "${tank_v1}" }
              as: ProjectEngineer
            - call: "GET /tanks/${tank_id}"
              as: ProjectEngineer
              captures: { tank_v2: $.data.version }
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 400000, disposal_method: "DISCHARGE_TO_POTW", hold_hours: 24, expected_tank_version: "${tank_v2}" }
              as: ProjectEngineer
              captures: { plan2: $.data.id }
          assert:
            - "the first create returns HTTP 412 with data.error_id == 'ERR_STALE_TANK_VERSION' - the foundation acceptance moved the tank to FOUNDATION_ACCEPTED and advanced its version past ${tank_v0}"
            - "after that refusal GET /hydrotest-plans?tank_id=${tank_id} returns total_count == 0 and Tank.${tank_id}.active_hydrotest_plan_id == null - a 412 writes nothing at all"
            - "the read-back version ${tank_v1} == ${tank_v0} + 1: the acceptance cascade is the only write that touched the tank"
            - "the second create, identical except for the refreshed version, returns HTTP 200 with status == 'DRAFT', and Tank.${tank_id}.active_hydrotest_plan_id == ${plan1}"
            - "the third create - the same body that just succeeded - returns HTTP 412 ERR_STALE_TANK_VERSION, because the successful create advanced Tank.version again"
            - "${tank_v2} == ${tank_v1} + 1 and Tank.${tank_id}.construction_phase is still 'FOUNDATION_ACCEPTED': the version moved without any phase movement"
            - "the fourth create returns HTTP 200: HydrotestPlan.${plan2}.status == 'DRAFT', HydrotestPlan.${plan1}.status == 'SUPERSEDED' and Tank.${tank_id}.active_hydrotest_plan_id == ${plan2}"
            - "the superseded plan keeps previous_plan_id == null while HydrotestPlan.${plan2}.previous_plan_id == ${plan1}"

      - name: withdrawal_reservation_enforces_the_water_source_version_precondition
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.withdrawal-reserve-stale-water-source
          - validations.priority_8_ERR_STALE_WATER_SOURCE_VERSION
          - errors.ERR_STALE_WATER_SOURCE_VERSION
          - calculations.water_volume_ledger
        distinguishing_aspect: |
          The second §1.2.1 rule, on a different parent and a different endpoint: the guard is
          on WaterSource.version, and the write that moves it is another reservation against
          the same source. The instance also pins the interaction the rule exists for - the
          stale attempt is refused BEFORE the capacity and permitted-volume checks would have
          passed it, so available_volume_gal is untouched by the refusal, and the retry with
          the refreshed version then consumes exactly its own share of the ledger.
        test_recipe:
          setup:
            - "Tank TK-101 with a DRAFT hydrotest plan against the Riverside Intake source; no reservation exists yet, so the source is at its full 2 000 000 gal permit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id, tank_v: $.data.version }
            - call: "POST /water-sources"
              payload: { source_name: "Riverside Intake", source_type: "RIVER", permitted_volume_gal: 2000000, max_concurrent_rate_gpm: 900, water_cost_usd_per_kgal: 3.33, disposal_cost_usd_per_kgal: 2.10, permit_expiry_utc: "2027-06-30T00:00:00Z" }
              as: ProjectEngineer
              captures: { ws_id: $.data.id, ws_v0: $.data.version }
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 400000, disposal_method: "DISCHARGE_TO_POTW", hold_hours: 24, expected_tank_version: "${tank_v}" }
              as: ProjectEngineer
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T00:00:00Z", window_end_utc: "2026-08-11T10:00:00Z", rate_gpm: 400, reserved_volume_gal: 400000, expected_water_source_version: "${ws_v0}" }
              as: ErectionSuperintendent
              captures: { wd1: $.data.id }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T05:00:00Z", window_end_utc: "2026-08-11T15:00:00Z", rate_gpm: 400, reserved_volume_gal: 400000, expected_water_source_version: "${ws_v0}" }
              as: ErectionSuperintendent
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v1: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T05:00:00Z", window_end_utc: "2026-08-11T15:00:00Z", rate_gpm: 400, reserved_volume_gal: 400000, expected_water_source_version: "${ws_v1}" }
              as: ErectionSuperintendent
              captures: { wd2: $.data.id }
          assert:
            - "the first reservation returns HTTP 200: WaterWithdrawal.${wd1}.status == 'RESERVED' and withdrawal_cost_usd == 1332.00 (400 kgal x 3.33, rounded at the withdrawal)"
            - "WaterSource.${ws_id} after the first reservation: reserved_volume_gal == 400000.00, consumed_volume_gal == 0.00, available_volume_gal == 1600000.00"
            - "the second reservation still carrying ${ws_v0} returns HTTP 412 with data.error_id == 'ERR_STALE_WATER_SOURCE_VERSION', even though 400 + 400 = 800 gpm is inside the 900 gpm envelope and 800 000 gal is inside the permit - the precondition is evaluated before both"
            - "after that refusal GET /water-withdrawals?water_source_id=${ws_id} returns total_count == 1 and available_volume_gal is still 1600000.00"
            - "${ws_v1} == ${ws_v0} + 1: the accepted reservation advanced the source's version by exactly one"
            - "the retry with ${ws_v1} returns HTTP 200 with WaterWithdrawal.${wd2}.status == 'RESERVED' and withdrawal_cost_usd == 1332.00"
            - "WaterSource.${ws_id} after the retry: reserved_volume_gal == 800000.00, available_volume_gal == 1200000.00, and its version is ${ws_v1} + 1"
            - "HydrotestPlan.${plan_id} now prices both windows: water_cost_usd == 2664.00 (two rounded 1332.00 amounts summed) and disposal_cost_usd == 1428.00 (800 kgal x 2.10 x the 0.85 tier for 500 < kgal <= 2000)"

      - name: lower_course_insertion_re_derives_the_upper_course_thickness
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.shell_course_required_thickness.trigger
          - entities.ShellCourse.fields.course_bottom_elevation_ft
          - entities.ShellCourse.fields.thickness_verdict
        distinguishing_aspect: |
          The reconciliation trigger declared in §1.3 - "re-evaluated whenever the course's
          elevation stack changes because a lower course is added" - is the one derived value
          in the scaffold that is recomputed by the creation of a sibling rather than by a
          write to its own row. Course 2 is created first, so it initially believes it sits
          on the bottom and is DEFICIENT at 0.375 in; inserting course 1 underneath it lifts
          it to 8 ft, drops the required thickness from 0.434 to 0.358, and flips the verdict
          to ADEQUATE without anyone touching course 2. Every derived field of the row moves
          together - elevation, both variant thicknesses, the MAX, governing_case and the
          verdict - which is what distinguishes reconciliation from a plain create-time
          calculation.
        test_recipe:
          setup:
            - "Tank TK-101 with no courses yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 2, course_width_ft: 8, plate_thickness_in: 0.375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { c1: $.data.id }
            - call: "GET /shell-courses/${c2}"
              as: ProjectEngineer
          assert:
            - "at creation ShellCourse.${c2} has no lower sibling, so course_bottom_elevation_ft == 0.0, design_liquid_height_ft == 40.0, required_thickness_design_in == 0.434, required_thickness_test_in == 0.407, required_thickness_in == 0.434, governing_case == 'DESIGN' and thickness_verdict == 'DEFICIENT' against its 0.375 in plate"
            - "creating course 1 returns HTTP 200 with ShellCourse.${c1}.course_bottom_elevation_ft == 0.0, required_thickness_in == 0.434 and thickness_verdict == 'ADEQUATE' (0.4375 in plate)"
            - "the read-back of ${c2} shows every derived field re-derived: course_bottom_elevation_ft == 8.0, design_liquid_height_ft == 32.0, required_thickness_design_in == 0.358, required_thickness_test_in == 0.324, required_thickness_in == 0.358, governing_case == 'DESIGN'"
            - "ShellCourse.${c2}.thickness_verdict has flipped to 'ADEQUATE' - the same 0.375 in plate that was deficient at the bottom clears the requirement 8 ft up"
            - "no request was ever addressed to ${c2}, and its declared inputs - course_width_ft 8, plate_thickness_in 0.375, both allowable stresses - are unchanged"
            - "GET /shell-courses?tank_id=${tank_id} returns total_count == 2 and Tank.${tank_id}.construction_phase is still 'DESIGN_REGISTERED' - reconciliation is not a workflow event"

      - name: cascading_side_effects_end_to_end_and_partial
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: nde_rejection_five_hop_posture_suspension_water_release
          rationale: |
            §1.8 covers this layer three times over and at greater depth than a breadth
            probe would: the five-hop NDE rejection chain (report -> seam -> tank posture ->
            plan suspension -> withdrawal cancellation -> water-source ledger), the four-hop
            coating chain in coating_holiday_four_hop_returns_submitted_commissioning_package
            (holiday test -> coating ACCEPTED -> phase COATED -> package RETURNED), and the
            three-hop revert in reexamination_three_hop_phase_revert_without_posture_change.
            Together they assert the end-to-end chain, the ordering sensitivity (each hop is
            checked against the state left by the hop before it) and the partial case (only
            non-terminal children move; terminal children are left alone).

      - name: dual_variant_calculation_both_variants_and_the_switch_delta
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: settlement_method_cosine_vs_adjacent_pair_divergence
          rationale: |
            Both declared dual-variant rules already have a dedicated §1.8 instance that runs
            one identical input set through both variants and asserts the divergent verdicts:
            settlement_method_cosine_vs_adjacent_pair_divergence for
            SettlementSurvey.settlement_evaluation_method, and
            coating_dft_spot_average_vs_individual_gauge_divergence for
            CoatingApplication.dft_acceptance_method. A third variant pair - the DESIGN and
            TEST cases of shell_course_required_thickness - is asserted in
            shell_thickness_three_way_max_with_diameter_tier.

      - name: rate_threshold_triggers_at_the_boundary_and_on_reset
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: weld_reject_rate_exactly_at_escalation_tier_boundary
          rationale: |
            The boundary cases this row asks for are exactly the §1.8 boundary rule's
            territory: weld_reject_rate_exactly_at_escalation_tier_boundary sits the
            cumulative reject rate on the escalation tier edge,
            withdrawal_aggregate_rate_exactly_at_permit_ceiling sits the instantaneous
            aggregate rate exactly on max_concurrent_rate_gpm, and the reset direction is
            asserted in nonconformance_count_and_reject_rate_reversed_by_nde_void, where a
            void walks the rate back down across the same tier edge.

  # ===========================================================================
  # §1.0 consistency_model: immediate. There is no queue, no worker and no
  # eventual-consistency window anywhere in the scaffold, so the single claim
  # worth probing is the one the guide names: every derived and cascaded field is
  # already correct in the response body of the write that caused it, and a read
  # issued immediately afterwards agrees with that body.
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: cascaded_and_derived_fields_are_correct_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.FoundationPackage.transitions.BASELINE_SET_to_ACCEPTED
          - calculations.settlement_tolerance_envelope
        distinguishing_aspect: |
          The consistency claim is about the response body, not about the cascade content:
          the acceptance response for the FoundationPackage must already carry its own new
          status and baseline reference, and the cross-aggregate effect on the parent Tank
          must already be visible to the very next read with no settling time, no re-read
          loop and no polling. Both the item read and the filtered list read are checked,
          because a list projection rebuilt lazily is the classic place where an immediate
          model quietly becomes eventual.
        test_recipe:
          setup:
            - "Tank TK-101 with a foundation package whose baseline survey has been shot, ready for acceptance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
              captures: { bl_id: $.data.id }
          trigger:
            - call: "POST /foundation-packages/${fp_id}/acceptance"
              payload: { decision: "ACCEPT" }
              as: ProjectEngineer
            - call: "GET /tanks/${tank_id}"
              as: ProjectEngineer
            - call: "GET /foundation-packages?tank_id=${tank_id}&status=ACCEPTED"
              as: ErectionSuperintendent
            - call: "GET /settlement-surveys?foundation_package_id=${fp_id}&survey_role=BASELINE"
              as: CivilContractor
          assert:
            - "the baseline survey response already carried its own derived fields - survey_role == 'BASELINE' and verdict == 'BASELINE' for SettlementSurvey.${bl_id} - and its parent FoundationPackage.${fp_id} already had point_spacing_in == 471.2389 and allowable_differential_in == 2.356 from its own create"
            - "the acceptance response body itself - not a later read - has status == 'ACCEPTED', baseline_survey_id == ${bl_id} and a non-null decided_at_utc of '2026-08-10T00:00:00.000Z'"
            - "the immediately following GET /tanks/${tank_id} already shows construction_phase == 'FOUNDATION_ACCEPTED': the cross-aggregate cascade is visible on the next read with no delay and no second write"
            - "the filtered list GET /foundation-packages?tank_id=${tank_id}&status=ACCEPTED returns total_count == 1 with the package as its only row, so the list projection agrees with the item read at the same instant"
            - "the filtered survey list returns total_count == 1 - the baseline is classified the moment it is created, not when the package is accepted"
            - "Tank.${tank_id}.version has advanced past the value the create returned, and quality_posture is still 'OPEN' - the immediate model does not smear one write across two dimensions"
