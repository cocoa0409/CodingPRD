# ============================================================================
# SCAFFOLD.yaml — Human Milk Bank Donor Screening & Pasteurization
# Sections §1.0 – §1.7 (per prd-bench-scaffold-generator SKILL.md)
# Sibling files:
#   SCAFFOLD_DIFFICULTY_DESIGN.yaml  (§1.8)
#   SCAFFOLD_CORNER_DESIGN.yaml      (§1.9)
# ============================================================================

scenario: |
  2821. Human Milk Bank Donor Screening & Pasteurization (HMBANA member milk
  bank): donor qualification with health history, physician approval and
  serologic testing, home collection instructions, cold chain and shipment
  reimbursement, pooling strategy across donors for nutritional balance,
  pasteurization run control with temperature/time verification and
  post-pasteurization culture, bottling, lot assignment and expiration dating,
  dispensing prescriptions with hospital NICU priority and outpatient
  waitlists, donor deferral events and lookback recall, processing fee billing
  and charitable subsidy

domain_name: human-milk-bank-screening-pasteurization
api_prefix: /milk-bank

# ----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ----------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# ----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Every entity is addressed by its own top-level collection under
  # /milk-bank; parent/child links are foreign keys in request bodies, never
  # nested URL ownership chains. Sub-resource GETs exist only as reverse-
  # reachability read channels, not as ownership paths.

  state_machine_shape: cyclic
  # Donor loops SCREENING -> INFO_REQUESTED -> SCREENING and
  # QUALIFIED -> TEMPORARILY_DEFERRED -> SCREENING -> QUALIFIED.
  # Pool loops DRAFT -> BALANCED -> DRAFT.
  # Prescription loops QUEUED -> PARTIALLY_FILLED -> QUEUED.
  # PasteurizationRun carries three independent state dimensions
  # (run_status x thermal_status x culture_status) on one row.

  relationship_patterns:
    - one_to_many          # Donor -> Shipment/SerologyPanel/DeferralEvent
    - many_to_many         # Pool <-> Donation through PoolComponent
    - cross_aggregate      # Dispense references both Prescription and MilkLot
    - polymorphic: false

  role_model: segregation_of_duties
  # The technician who completes a pasteurization run may not release its
  # lots; the QA officer who records the culture may not release its lots;
  # the prescriber who submitted a prescription may not dispense against it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities / 52 endpoints / 49 error codes / 49 ordered validations /
  # 8 state machines / 7 calculations (4 named dual variants) / 3 OCC races.

# ----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ----------------------------------------------------------------------------
entities:

  - name: Donor
    parent: null
    common_fields: true
    fields:
      - name: donor_code
        type: string
        source: input
        description: "Bank-assigned donor code; unique across all Donor rows. Used as the final deterministic tie-break in donor-ordered listings."
        constraints: "regex ^DNR-[0-9]{4}$; unique"
      - name: full_name
        type: string
        source: input
        description: "Donor legal name."
        constraints: "1..120 chars"
      - name: email
        type: string
        source: input
        description: "Contact email for home-collection instructions."
        constraints: "must contain '@'"
      - name: zone_code
        type: enum
        source: input
        description: "Courier reimbursement zone of the donor's home address; copied onto every Shipment the donor creates."
        constraints: "one of {Z1, Z2, Z3}"
      - name: status
        type: enum
        source: computed
        description: "Donor qualification lifecycle state; see §1.2 Donor state machine."
        default: APPLICANT
        constraints: "one of {APPLICANT, SCREENING, INFO_REQUESTED, QUALIFIED, TEMPORARILY_DEFERRED, PERMANENTLY_DEFERRED}"
      - name: screening_risk_score
        type: integer
        source: computed
        description: "Latest value of calculations.donor_risk_score variant SCREENING_WORST_CASE; refreshed on every health-history submission."
        default: 0
        constraints: "0..100"
      - name: surveillance_risk_score
        type: integer
        source: computed
        description: "Latest value of calculations.donor_risk_score variant SURVEILLANCE_DECAYED; refreshed on health-history submission, on deferral creation and at qualification."
        default: 0
        constraints: "0..100"
      - name: qualified_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the donor most recently entered QUALIFIED; null before first qualification."
        default: null
      - name: qualified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MedicalDirector who performed the most recent qualification. Opaque operator id, not an entity id."
        default: null
      - name: reimbursement_balance_cents
        type: integer
        source: computed
        description: "Ledger of cold-chain shipment reimbursement credited to this donor; equals the sum of Shipment.credited_reimbursement_cents over this donor's Shipment rows with status IN {ACCEPTED, QUARANTINED, CLOSED}."
        default: 0
        constraints: ">= 0"
      - name: lifetime_accepted_volume_ml
        type: integer
        source: computed
        description: "Sum of Donation.volume_ml over this donor's Donation rows with status IN {ELIGIBLE, ALLOCATED, PASTEURIZED}."
        default: 0
      - name: temporary_deferral_count
        type: integer
        source: computed
        description: "Count of this donor's DeferralEvent rows with deferral_type == TEMPORARY (any status)."
        default: 0
      - name: active_deferral_until_date
        type: string
        source: computed
        description: "Date (YYYY-MM-DD) on which the MOST RECENTLY CREATED (created_at DESC; id is never used as a tie-break) ACTIVE TEMPORARY DeferralEvent of this donor ends, computed as that event's effective_from + deferral_days; null when the donor has no ACTIVE TEMPORARY deferral. Recomputed on every deferral write, on requalification and on every clock sweep. It is deliberately NOT the maximum end date: a long-dated deferral recorded earlier than a short one does not block requalification, but stays ACTIVE and keeps blocking pooling through §1.4 priority 45."
        default: null

  - name: HealthHistoryQuestionnaire
    parent: null
    common_fields: false
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the donor whose health history this submission records."
      - name: medication_flag_count
        type: integer
        source: input
        description: "Number of flagged medications disclosed on this questionnaire."
        constraints: "0..10"
      - name: travel_risk_flag
        type: boolean
        source: input
        description: "True when the donor disclosed travel to a deferral-listed region in the last 12 months."
      - name: tobacco_use
        type: boolean
        source: input
        description: "True when the donor disclosed any tobacco or nicotine use."
      - name: alcohol_units_per_week
        type: integer
        source: input
        description: "Self-reported alcohol units per week; feeds the tiered alcohol penalty."
        constraints: "0..40"
      - name: months_postpartum
        type: integer
        source: input
        description: "Months elapsed since the donor's delivery date at submission time."
        constraints: "0..48"
      - name: base_risk_points
        type: integer
        source: computed
        description: "The shared `base` component of calculations.donor_risk_score for this questionnaire, before any serology, deferral or decay term."
        constraints: "0..100"
      - name: screening_risk_score
        type: integer
        source: computed
        description: "Output of calculations.donor_risk_score variant SCREENING_WORST_CASE evaluated against this questionnaire."
        constraints: "0..100"
      - name: status
        type: enum
        source: computed
        description: "Triage outcome assigned at creation from screening_risk_score, or SUPERSEDED when a newer questionnaire is submitted for the same donor."
        constraints: "one of {ACCEPTED, INFO_REQUESTED, AUTO_DEFERRED, SUPERSEDED}"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant at submission (ISO 8601 UTC, three fractional digits)."

  - name: SerologyPanel
    parent: null
    common_fields: false
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the donor this serologic panel belongs to."
      - name: collected_on
        type: string
        source: input
        description: "Draw date of the specimen (YYYY-MM-DD)."
      - name: hiv_result
        type: enum
        source: input
        description: "HIV-1/2 serology result."
        constraints: "one of {NON_REACTIVE, REACTIVE, INDETERMINATE}"
      - name: htlv_result
        type: enum
        source: input
        description: "HTLV-I/II serology result."
        constraints: "one of {NON_REACTIVE, REACTIVE, INDETERMINATE}"
      - name: hbv_result
        type: enum
        source: input
        description: "Hepatitis B serology result."
        constraints: "one of {NON_REACTIVE, REACTIVE, INDETERMINATE}"
      - name: hcv_result
        type: enum
        source: input
        description: "Hepatitis C serology result."
        constraints: "one of {NON_REACTIVE, REACTIVE, INDETERMINATE}"
      - name: syphilis_result
        type: enum
        source: input
        description: "Syphilis serology result."
        constraints: "one of {NON_REACTIVE, REACTIVE, INDETERMINATE}"
      - name: panel_status
        type: enum
        source: computed
        description: "REACTIVE when any marker is REACTIVE; else INDETERMINATE when any marker is INDETERMINATE; else NON_REACTIVE."
        constraints: "one of {NON_REACTIVE, REACTIVE, INDETERMINATE}"
      - name: expires_on
        type: string
        source: computed
        description: "collected_on + SEROLOGY_VALIDITY_DAYS (180) as a date (YYYY-MM-DD)."
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the IntakeCoordinator who recorded the panel. Opaque operator id."

  - name: PhysicianApproval
    parent: null
    common_fields: false
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the donor whose prescribing physician signed off on donation."
      - name: physician_npi
        type: string
        source: input
        description: "National Provider Identifier of the approving physician."
        constraints: "regex ^[0-9]{10}$"
      - name: approved_on
        type: string
        source: input
        description: "Date the physician signed the approval (YYYY-MM-DD)."
      - name: valid_until
        type: string
        source: computed
        description: "approved_on + PHYSICIAN_APPROVAL_VALIDITY_DAYS (365) as a date (YYYY-MM-DD)."
      - name: status
        type: enum
        source: computed
        description: "ACTIVE at creation; set to EXPIRED by the clock sweep when valid_until < clock date; set to WITHDRAWN when a DeferralEvent with reason_code PHYSICIAN_WITHDRAWAL is recorded for the donor."
        default: ACTIVE
        constraints: "one of {ACTIVE, EXPIRED, WITHDRAWN}"
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the IntakeCoordinator who recorded the approval. Opaque operator id."

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the donor who shipped this cooler."
      - name: tracking_code
        type: string
        source: input
        description: "Courier tracking code; unique across all Shipment rows."
        constraints: "regex ^TRK-[0-9]{4}$; unique"
      - name: zone_code
        type: enum
        source: computed
        description: "Copied from Donor.zone_code at creation; drives ZONE_BASE_CENTS in calculations.shipment_reimbursement."
        constraints: "one of {Z1, Z2, Z3}"
      - name: container_count
        type: integer
        source: input
        description: "Number of insulated containers in the cooler; the per-container rounding unit of calculations.shipment_reimbursement."
        constraints: "1..8"
      - name: uses_dry_ice
        type: boolean
        source: input
        description: "True when the donor packed dry ice; applies DRY_ICE_MULTIPLIER to the per-container base share."
      - name: declared_volume_ml
        type: integer
        source: input
        description: "Volume the donor declared on the home-collection form."
        constraints: "50..9600"
      - name: shipped_on
        type: string
        source: input
        description: "Date the cooler was handed to the courier (YYYY-MM-DD)."
      - name: estimated_reimbursement_cents
        type: integer
        source: computed
        description: "calculations.shipment_reimbursement variant PROVISIONAL_AT_DISPATCH, stamped at creation."
        constraints: ">= 0"
      - name: final_reimbursement_cents
        type: integer
        source: computed
        description: "calculations.shipment_reimbursement variant FINAL_AT_RECEIPT, stamped when the cooler is received; null before receipt."
        default: null
      - name: credited_reimbursement_cents
        type: integer
        source: computed
        description: "Amount actually credited to Donor.reimbursement_balance_cents; equals final_reimbursement_cents when status becomes ACCEPTED, round_half_up(final_reimbursement_cents * QUARANTINE_CREDIT_FACTOR) when status becomes QUARANTINED, and 0 when status becomes REJECTED."
        default: null
      - name: excursion_minutes
        type: integer
        source: computed
        description: "Minutes above -8.0 C reported by the cold-chain logger at receipt; copied from the receive request."
        default: null
      - name: arrival_max_temp_celsius
        type: number
        source: computed
        description: "Peak temperature recorded by the logger, copied from the receive request; drives the ACCEPTED/QUARANTINED/REJECTED fork."
        default: null
      - name: verified_volume_ml
        type: integer
        source: computed
        description: "Volume measured at intake, copied from the receive request."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Cold-chain disposition lifecycle; see §1.2 Shipment state machine."
        default: IN_TRANSIT
        constraints: "one of {IN_TRANSIT, ACCEPTED, QUARANTINED, REJECTED, CLOSED}"
      - name: received_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the receive call; null while IN_TRANSIT. Feeds FROZEN_STORAGE_CAP_DAYS in calculations.lot_expiration_date."
        default: null
      - name: received_by_user_id
        type: string
        source: system
        description: "X-User-ID of the IntakeCoordinator who received the cooler. Opaque operator id."
        default: null

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; the cooler this container arrived in."
      - name: donor_id
        type: string
        source: computed
        description: "FK -> Donor.id; denormalized from the parent Shipment.donor_id at creation and never changed."
      - name: container_label
        type: string
        source: input
        description: "Label written on the container; unique within its Shipment."
        constraints: "1..16 chars; unique per shipment_id"
      - name: expressed_on
        type: string
        source: input
        description: "Date the milk was expressed (YYYY-MM-DD); drives RAW_MILK_MAX_AGE_DAYS and the deferral lookback overlap check."
      - name: volume_ml
        type: integer
        source: input
        description: "Measured volume of this container."
        constraints: "50..1200"
      - name: kcal_per_oz
        type: number
        source: input
        description: "Assayed caloric density of this container, to one decimal place."
        constraints: "14.0..26.0"
      - name: milk_class
        type: enum
        source: input
        description: "Nutritional class of the container as assayed at intake."
        constraints: "one of {PRETERM, TERM}"
      - name: remaining_ml
        type: integer
        source: computed
        description: "volume_ml minus the sum of PoolComponent.allocated_volume_ml over this donation's components whose status is not VOIDED. Initialized to volume_ml."
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Donation disposition lifecycle; see §1.2 Donation state machine."
        default: ELIGIBLE
        constraints: "one of {ELIGIBLE, ALLOCATED, PASTEURIZED, RECALLED, DISCARDED}"

  - name: Pool
    parent: null
    common_fields: true
    fields:
      - name: pool_code
        type: string
        source: input
        description: "Operator-assigned pool code; unique across all Pool rows."
        constraints: "regex ^POOL-[0-9]{4}$; unique"
      - name: pool_sequence
        type: integer
        source: system
        description: "Monotonic 1-based counter assigned in Pool creation order; embedded in MilkLot.lot_code. Never derived from id."
        constraints: ">= 1"
      - name: target_milk_class
        type: enum
        source: input
        description: "Nutritional target of the pool; MIXED accepts both PRETERM and TERM components."
        constraints: "one of {PRETERM, TERM, MIXED}"
      - name: distinct_donor_count
        type: integer
        source: computed
        description: "Count of distinct Donation.donor_id values over this pool's PoolComponent rows with status IN {ALLOCATED, CONSUMED_PASTEURIZED, CONSUMED_LOST}."
        default: 0
      - name: total_volume_ml
        type: integer
        source: computed
        description: "Sum of PoolComponent.allocated_volume_ml over this pool's components with status IN {ALLOCATED, CONSUMED_PASTEURIZED, CONSUMED_LOST}."
        default: 0
      - name: projected_kcal_per_oz
        type: number
        source: computed
        description: "Output of calculations.pool_projected_kcal_per_oz; null while the pool has no non-VOIDED components."
        default: null
      - name: bottled_volume_ml
        type: integer
        source: computed
        description: "Sum of MilkLot.total_volume_ml over MilkLot rows whose run_id belongs to this pool and whose release_status is not DISCARDED."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Pool composition lifecycle; see §1.2 Pool state machine."
        default: DRAFT
        constraints: "one of {DRAFT, BALANCED, COMMITTED, PASTEURIZED, SCRAPPED, SCRAPPED_CULTURE}"
      - name: committed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the commit call; null before commit."
        default: null
      - name: committed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProcessingTechnician who committed the pool. Opaque operator id."
        default: null

  - name: PoolComponent
    parent: null
    common_fields: false
    fields:
      - name: pool_id
        type: string
        source: input
        description: "FK -> Pool.id; the pool this allocation belongs to."
      - name: donation_id
        type: string
        source: input
        description: "FK -> Donation.id; the donation container drawn from."
      - name: allocated_volume_ml
        type: integer
        source: input
        description: "Volume drawn from the donation into the pool; debited from Donation.remaining_ml."
        constraints: "50..1200"
      - name: component_kcal_per_oz
        type: number
        source: computed
        description: "Copied from Donation.kcal_per_oz at creation so the pool's weighted average is immune to later donation edits."
      - name: component_donor_id
        type: string
        source: computed
        description: "Copied from Donation.donor_id at creation; the field Pool.distinct_donor_count counts distinctly. Not a foreign key declaration."
      - name: status
        type: enum
        source: computed
        description: "ALLOCATED at creation; VOIDED when the pool is scrapped before pasteurization (volume returns to the donation); CONSUMED_PASTEURIZED when the pool is bottled; CONSUMED_LOST when the pool is scrapped after a failed post-pasteurization culture (volume is destroyed, not returned)."
        default: ALLOCATED
        constraints: "one of {ALLOCATED, VOIDED, CONSUMED_PASTEURIZED, CONSUMED_LOST}"

  - name: PasteurizationRun
    parent: null
    common_fields: true
    fields:
      - name: pool_id
        type: string
        source: input
        description: "FK -> Pool.id; the committed pool loaded into the pasteurizer."
      - name: pasteurizer_id
        type: string
        source: input
        description: "Identifier of the physical pasteurizer occupied by this run; the resource whose time intervals must not collide."
        constraints: "regex ^PAST-[0-9]{2}$"
      - name: scheduled_start_at
        type: datetime
        source: input
        description: "Start of the occupied interval on pasteurizer_id (ISO 8601 UTC)."
      - name: cycle_minutes
        type: integer
        source: input
        description: "Length of the heating cycle in minutes; the occupied interval is [scheduled_start_at, scheduled_start_at + cycle_minutes + CLEANING_BUFFER_MINUTES)."
        constraints: "30..120"
      - name: run_status
        type: enum
        source: computed
        description: "Physical progress dimension of the run; evolves independently of thermal_status and culture_status."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, COMPLETED, BOTTLED, VOIDED}"
      - name: thermal_status
        type: enum
        source: computed
        description: "Temperature/time verification dimension; set by calculations.thermal_hold_verification at completion."
        default: PENDING
        constraints: "one of {PENDING, PASSED, FAILED}"
      - name: culture_status
        type: enum
        source: computed
        description: "Post-pasteurization culture dimension; set when the culture result is recorded, independently of thermal_status."
        default: NOT_COLLECTED
        constraints: "one of {NOT_COLLECTED, PASSED, FAILED}"
      - name: release_eligibility
        type: enum
        source: computed
        description: "ELIGIBLE if and only if thermal_status == PASSED AND culture_status == PASSED; BLOCKED otherwise. Recomputed after every change to either dimension."
        default: BLOCKED
        constraints: "one of {BLOCKED, ELIGIBLE}"
      - name: reading_count
        type: integer
        source: computed
        description: "Count of TemperatureReading rows attached to this run."
        default: 0
      - name: longest_hold_seconds
        type: integer
        source: computed
        description: "Output of calculations.thermal_hold_verification; null before completion."
        default: null
      - name: peak_celsius
        type: number
        source: computed
        description: "Maximum TemperatureReading.celsius over this run's readings; null before the first reading."
        default: null
      - name: completed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the complete call; its date is PASTEURIZATION_DATE in calculations.lot_expiration_date."
        default: null
      - name: completed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProcessingTechnician who completed the run. Opaque operator id; compared against the releasing QA officer for segregation of duties."
        default: null
      - name: culture_cfu_per_ml
        type: integer
        source: computed
        description: "Colony-forming units per mL reported by the post-pasteurization culture; copied from the culture request."
        default: null
      - name: culture_organism
        type: string
        source: computed
        description: "Organism named on the culture report, or the literal NONE for a no-growth result."
        default: null
      - name: culture_recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityAssuranceOfficer who recorded the culture. Opaque operator id; compared against the releasing QA officer for segregation of duties."
        default: null

  - name: TemperatureReading
    parent: null
    common_fields: false
    fields:
      - name: run_id
        type: string
        source: input
        description: "FK -> PasteurizationRun.id; the run this datalogger sample belongs to."
      - name: offset_seconds
        type: integer
        source: input
        description: "Seconds elapsed from the start of the heating cycle; must strictly increase within a run."
        constraints: "0..14400"
      - name: celsius
        type: number
        source: input
        description: "Bath temperature at this offset, to one decimal place."
        constraints: "0.0..90.0"
      - name: qualifies
        type: boolean
        source: computed
        description: "True when MIN_HOLD_CELSIUS <= celsius <= MAX_HOLD_CELSIUS; a non-qualifying sample breaks the contiguous hold window."
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ProcessingTechnician who logged the sample. Opaque operator id."

  - name: MilkLot
    parent: null
    common_fields: true
    fields:
      - name: run_id
        type: string
        source: input
        description: "FK -> PasteurizationRun.id; the run whose pasteurized milk was bottled into this lot."
      - name: lot_code
        type: string
        source: computed
        description: "Deterministic lot identifier `YYYYMMDD-PPP-LL` built from the run's pasteurization date, the pool's pool_sequence zero-padded to 3, and lot_sequence zero-padded to 2. Never derived from any id."
        constraints: "unique"
      - name: lot_sequence
        type: integer
        source: system
        description: "1-based counter of lots bottled from the same run, in bottling order."
        constraints: ">= 1"
      - name: milk_class
        type: enum
        source: computed
        description: "Copied from the run's Pool.target_milk_class; matched against Prescription.requires_preterm_milk at dispense time."
        constraints: "one of {PRETERM, TERM, MIXED}"
      - name: bottle_count
        type: integer
        source: input
        description: "Number of bottles filled in this lot."
        constraints: "1..200"
      - name: bottle_volume_ml
        type: integer
        source: input
        description: "Fill volume of each bottle in this lot."
        constraints: "20..250"
      - name: total_volume_ml
        type: integer
        source: computed
        description: "bottle_count * bottle_volume_ml."
      - name: dispensed_ml
        type: integer
        source: computed
        description: "Sum of Dispense.volume_ml over this lot's Dispense rows with status == DISPENSED."
        default: 0
      - name: available_ml
        type: integer
        source: computed
        description: "total_volume_ml - dispensed_ml."
      - name: kcal_per_oz
        type: number
        source: computed
        description: "Copied from the run's Pool.projected_kcal_per_oz at bottling."
      - name: pasteurization_date
        type: string
        source: computed
        description: "Date component (YYYY-MM-DD) of the run's completed_at."
      - name: expiration_date
        type: string
        source: computed
        description: "Output of calculations.lot_expiration_date (YYYY-MM-DD)."
      - name: release_status
        type: enum
        source: computed
        description: "Quarantine/release/recall lifecycle; see §1.2 MilkLot state machine."
        default: HOLD
        constraints: "one of {HOLD, RELEASED, EXHAUSTED, DISCARDED, RECALLED, EXPIRED}"
      - name: released_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the QA release; null before release."
        default: null
      - name: released_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityAssuranceOfficer who released the lot. Opaque operator id."
        default: null

  - name: SubsidyProgram
    parent: null
    common_fields: true
    fields:
      - name: program_code
        type: string
        source: input
        description: "Charitable subsidy program code; unique across all SubsidyProgram rows."
        constraints: "regex ^SUB-[0-9]{4}$; unique"
      - name: name
        type: string
        source: input
        description: "Human-readable program name."
        constraints: "1..120 chars"
      - name: coverage_pct
        type: number
        source: input
        description: "Fraction of each dispense's gross processing fee the program absorbs, to two decimal places."
        constraints: "0.00..1.00"
      - name: annual_cap_cents
        type: integer
        source: input
        description: "Hard ceiling on cumulative subsidy the program will pay."
        constraints: "1..100000000"
      - name: consumed_cents
        type: integer
        source: computed
        description: "Sum of Dispense.subsidy_cents over Dispense rows with status == DISPENSED whose Prescription.subsidy_program_id is this program."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "OPEN while consumed_cents < annual_cap_cents; EXHAUSTED once consumed_cents >= annual_cap_cents; returns to OPEN when a dispense void frees capacity."
        default: OPEN
        constraints: "one of {OPEN, EXHAUSTED}"

  - name: Prescription
    parent: null
    common_fields: true
    fields:
      - name: prescription_code
        type: string
        source: input
        description: "Prescriber-assigned code; unique across all Prescription rows. Final deterministic tie-break in allocation ordering."
        constraints: "regex ^RX-[0-9]{4}$; unique"
      - name: subsidy_program_id
        type: string
        source: input
        description: "FK -> SubsidyProgram.id; the charitable program billed for this prescription's subsidy share. Omitted means no subsidy applies."
        default: null
      - name: patient_reference
        type: string
        source: input
        description: "De-identified patient reference supplied by the ordering facility."
        constraints: "1..40 chars"
      - name: patient_type
        type: enum
        source: input
        description: "Care setting of the recipient; NICU_INPATIENT outranks OUTPATIENT in allocation."
        constraints: "one of {NICU_INPATIENT, OUTPATIENT}"
      - name: clinical_acuity
        type: enum
        source: input
        description: "Clinical urgency asserted by the prescriber."
        constraints: "one of {CRITICAL, STANDARD}"
      - name: priority_tier
        type: integer
        source: computed
        description: "1 when patient_type == NICU_INPATIENT AND clinical_acuity == CRITICAL; 2 when patient_type == NICU_INPATIENT AND clinical_acuity == STANDARD; 3 when patient_type == OUTPATIENT."
        constraints: "one of {1, 2, 3}"
      - name: requires_preterm_milk
        type: boolean
        source: input
        description: "When true, only lots whose milk_class is PRETERM may be dispensed against this prescription."
        default: false
      - name: subsidy_required
        type: boolean
        source: input
        description: "When true, a dispense that cannot receive the full uncapped subsidy is rejected instead of partially subsidized."
        default: false
      - name: prescribed_ml
        type: integer
        source: input
        description: "Total volume ordered."
        constraints: "50..12000"
      - name: cumulative_dispensed_ml
        type: integer
        source: computed
        description: "Sum of Dispense.volume_ml over this prescription's Dispense rows with status == DISPENSED; read BEFORE the current dispense when selecting the volume discount tier."
        default: 0
      - name: remaining_ml
        type: integer
        source: computed
        description: "prescribed_ml - cumulative_dispensed_ml."
        constraints: ">= 0"
      - name: needed_by_date
        type: string
        source: input
        description: "Latest useful fill date (YYYY-MM-DD); the clock sweep expires the prescription once it passes."
      - name: waitlist_position
        type: integer
        source: computed
        description: "1-based rank of this prescription inside its priority_tier bucket among rows with status IN {QUEUED, PARTIALLY_FILLED}, ordered by created_at ASC then remaining_ml DESC then prescription_code ASC; null for terminal rows."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Fill lifecycle; see §1.2 Prescription state machine."
        default: QUEUED
        constraints: "one of {QUEUED, PARTIALLY_FILLED, FILLED, CANCELLED, EXPIRED}"
      - name: prescriber_user_id
        type: string
        source: system
        description: "X-User-ID of the Prescriber who submitted the order. Opaque operator id; compared against the dispensing pharmacist for segregation of duties."

  - name: Dispense
    parent: null
    common_fields: true
    fields:
      - name: prescription_id
        type: string
        source: input
        description: "FK -> Prescription.id; the order this fill satisfies."
      - name: lot_id
        type: string
        source: input
        description: "FK -> MilkLot.id; the released lot the milk came from."
      - name: volume_ml
        type: integer
        source: input
        description: "Volume dispensed in this fill."
        constraints: "20..12000"
      - name: tier_discount_pct
        type: number
        source: computed
        description: "Volume discount fraction selected from the prescription's cumulative_dispensed_ml BEFORE this fill."
        constraints: "one of {0.00, 0.05, 0.12}"
      - name: gross_fee_cents
        type: integer
        source: computed
        description: "Output of calculations.dispense_fee_allocation step 5."
      - name: subsidy_cents
        type: integer
        source: computed
        description: "Output of calculations.dispense_fee_allocation step 8; charged against the prescription's SubsidyProgram."
      - name: payer_due_cents
        type: integer
        source: computed
        description: "Output of calculations.dispense_fee_allocation step 9; gross_fee_cents - subsidy_cents."
      - name: allocation_cycle_sequence
        type: integer
        source: computed
        description: "Monotonic allocation-cycle counter that produced this fill; null for a manually created dispense."
        default: null
      - name: dispensed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DispensingPharmacist who created the fill. Opaque operator id."
      - name: status
        type: enum
        source: computed
        description: "Fill disposition; see §1.2 Dispense state machine."
        default: DISPENSED
        constraints: "one of {DISPENSED, VOIDED, RECALLED}"

  - name: DeferralEvent
    parent: null
    common_fields: false
    fields:
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id; the deferred donor."
      - name: reason_code
        type: enum
        source: input
        description: "Why the donor was deferred; REACTIVE_SEROLOGY and AUTO_HIGH_RISK are only ever written by system-triggered deferrals."
        constraints: "one of {REACTIVE_SEROLOGY, AUTO_HIGH_RISK, MEDICATION, ILLNESS, TRAVEL, DONOR_REQUEST, PHYSICIAN_WITHDRAWAL}"
      - name: deferral_type
        type: enum
        source: input
        description: "TEMPORARY deferrals can be requalified after deferral_days; PERMANENT deferrals are terminal for the donor."
        constraints: "one of {TEMPORARY, PERMANENT}"
      - name: effective_from
        type: string
        source: input
        description: "Date the deferring condition began (YYYY-MM-DD); the right-hand closed endpoint of the lookback interval."
      - name: deferral_days
        type: integer
        source: input
        description: "Length of a TEMPORARY deferral in days; must be 0 when deferral_type == PERMANENT."
        constraints: "0..3650"
      - name: lookback_days
        type: integer
        source: input
        description: "Length of the retrospective recall window; the interval is the closed range [effective_from - lookback_days, effective_from]."
        constraints: "0..1095"
      - name: recall_scope
        type: enum
        source: input
        description: "NONE recalls nothing; DONATIONS_ONLY stops at Donation rows; FULL_CHAIN propagates through pools, lots and dispenses."
        constraints: "one of {NONE, DONATIONS_ONLY, FULL_CHAIN}"
      - name: status
        type: enum
        source: computed
        description: "ACTIVE at creation; set to EXPIRED when the donor is requalified or when the clock sweep passes effective_from + deferral_days for a TEMPORARY deferral."
        default: ACTIVE
        constraints: "one of {ACTIVE, EXPIRED}"
      - name: recalled_donation_count
        type: integer
        source: computed
        description: "Number of Donation rows moved to RECALLED by this event's cascade."
        default: 0
      - name: quarantined_pool_count
        type: integer
        source: computed
        description: "Number of Pool rows moved to SCRAPPED by this event's cascade."
        default: 0
      - name: recalled_lot_count
        type: integer
        source: computed
        description: "Number of MilkLot rows moved to RECALLED by this event's cascade."
        default: 0
      - name: recalled_dispense_count
        type: integer
        source: computed
        description: "Number of Dispense rows moved to RECALLED by this event's cascade."
        default: 0
      - name: reversed_subsidy_cents
        type: integer
        source: computed
        description: "Total subsidy_cents credited back to SubsidyProgram.consumed_cents by this event's cascade."
        default: 0
      - name: recorded_by_user_id
        type: string
        source: system
        description: "X-User-ID of the MedicalDirector who recorded the deferral, or the literal string `system` for system-triggered deferrals."

# ----------------------------------------------------------------------------
# §1.2 State Machine Table
# ----------------------------------------------------------------------------
state_machines:

  - entity: Donor
    initial_state: APPLICANT
    terminal_states: [PERMANENTLY_DEFERRED]
    transitions:
      - from: APPLICANT
        to: SCREENING
        trigger: "POST /milk-bank/donors/{id}/health-history when the resulting screening_risk_score <= RISK_ACCEPT_MAX (60)"
        actor: IntakeCoordinator
        preconditions:
          - "donor.status == APPLICANT"
        side_effects:
          - "creates a HealthHistoryQuestionnaire with status ACCEPTED"
          - "sets Donor.screening_risk_score from calculations.donor_risk_score variant SCREENING_WORST_CASE"
          - "sets Donor.surveillance_risk_score from calculations.donor_risk_score variant SURVEILLANCE_DECAYED"
          - "increments Donor.version by 1 and refreshes Donor.updated_at"

      - from: APPLICANT
        to: INFO_REQUESTED
        trigger: "POST /milk-bank/donors/{id}/health-history when RISK_ACCEPT_MAX (60) < screening_risk_score <= RISK_DEFER_MAX (85)"
        actor: IntakeCoordinator
        preconditions:
          - "donor.status == APPLICANT"
        side_effects:
          - "creates a HealthHistoryQuestionnaire with status INFO_REQUESTED"
          - "sets Donor.screening_risk_score and Donor.surveillance_risk_score"
          - "increments Donor.version by 1"

      - from: APPLICANT
        to: TEMPORARILY_DEFERRED
        trigger: "POST /milk-bank/donors/{id}/health-history when screening_risk_score > RISK_DEFER_MAX (85)"
        actor: IntakeCoordinator
        preconditions:
          - "donor.status == APPLICANT"
        side_effects:
          - "creates a HealthHistoryQuestionnaire with status AUTO_DEFERRED"
          - "creates a DeferralEvent with reason_code AUTO_HIGH_RISK, deferral_type TEMPORARY, effective_from = clock date, deferral_days = AUTO_DEFERRAL_DAYS (90), lookback_days 0, recall_scope NONE, recorded_by_user_id `system`"
          - "that DeferralEvent increments Donor.temporary_deferral_count by 1 and sets Donor.active_deferral_until_date = effective_from + 90 days"
          - "the changed temporary_deferral_count forces a recompute of Donor.surveillance_risk_score"
          - "increments Donor.version by 1"
        note: "A three-hop cascade inside one request: questionnaire -> deferral event -> donor counters -> surveillance rescore."

      - from: INFO_REQUESTED
        to: SCREENING
        trigger: "POST /milk-bank/donors/{id}/health-history when the new screening_risk_score <= 60"
        actor: IntakeCoordinator
        preconditions:
          - "donor.status == INFO_REQUESTED"
        side_effects:
          - "sets the donor's previously newest HealthHistoryQuestionnaire.status to SUPERSEDED"
          - "creates a HealthHistoryQuestionnaire with status ACCEPTED"
          - "sets Donor.screening_risk_score and Donor.surveillance_risk_score"
          - "increments Donor.version by 1"
        note: "Revision loop: the donor can bounce between INFO_REQUESTED and SCREENING any number of times."

      - from: INFO_REQUESTED
        to: INFO_REQUESTED
        trigger: "POST /milk-bank/donors/{id}/health-history when the new screening_risk_score is still in (60, 85]"
        actor: IntakeCoordinator
        preconditions:
          - "donor.status == INFO_REQUESTED"
        side_effects:
          - "sets the previously newest HealthHistoryQuestionnaire.status to SUPERSEDED"
          - "creates a HealthHistoryQuestionnaire with status INFO_REQUESTED"
          - "increments Donor.version by 1"

      - from: SCREENING
        to: INFO_REQUESTED
        trigger: "POST /milk-bank/donors/{id}/health-history when the new screening_risk_score is in (60, 85]"
        actor: IntakeCoordinator
        preconditions:
          - "donor.status == SCREENING"
        side_effects:
          - "sets the previously newest HealthHistoryQuestionnaire.status to SUPERSEDED"
          - "creates a HealthHistoryQuestionnaire with status INFO_REQUESTED"
          - "increments Donor.version by 1"

      - from: SCREENING
        to: QUALIFIED
        trigger: "POST /milk-bank/donors/{id}/qualify"
        actor: MedicalDirector
        preconditions:
          - "donor.status == SCREENING"
          - "the donor's newest HealthHistoryQuestionnaire (by created_at DESC, tie-break submitted_at DESC) has status == ACCEPTED"
          - "there exists a SerologyPanel for the donor with panel_status == NON_REACTIVE and expires_on >= clock date"
          - "there exists a PhysicianApproval for the donor with status == ACTIVE and valid_until >= clock date"
          - "recomputed Donor.surveillance_risk_score <= RISK_ACCEPT_MAX (60)"
        side_effects:
          - "sets Donor.qualified_at = clock instant and Donor.qualified_by_user_id = X-User-ID"
          - "recomputes and stores Donor.surveillance_risk_score"
          - "increments Donor.version by 1"

      - from: SCREENING
        to: TEMPORARILY_DEFERRED
        trigger: "POST /milk-bank/donors/{id}/deferrals with deferral_type TEMPORARY"
        actor: MedicalDirector
        preconditions:
          - "donor.status IN {SCREENING, INFO_REQUESTED, QUALIFIED}"
          - "deferral_days >= 1"
        side_effects:
          - "creates the DeferralEvent with status ACTIVE"
          - "increments Donor.temporary_deferral_count and sets Donor.active_deferral_until_date"
          - "recomputes Donor.surveillance_risk_score from the changed deferral history"
          - "runs the recall cascade described in the DeferralEvent notes when recall_scope != NONE"
          - "increments Donor.version by 1"

      - from: QUALIFIED
        to: TEMPORARILY_DEFERRED
        trigger: "POST /milk-bank/donors/{id}/deferrals with deferral_type TEMPORARY"
        actor: MedicalDirector
        preconditions:
          - "donor.status == QUALIFIED"
          - "deferral_days >= 1"
        side_effects:
          - "same side effects as SCREENING -> TEMPORARILY_DEFERRED"
          - "increments Donor.version by 1"

      - from: QUALIFIED
        to: PERMANENTLY_DEFERRED
        trigger: "POST /milk-bank/donors/{id}/deferrals with deferral_type PERMANENT"
        actor: MedicalDirector
        preconditions:
          - "donor.status IN {SCREENING, INFO_REQUESTED, QUALIFIED, TEMPORARILY_DEFERRED}"
          - "deferral_days == 0"
        side_effects:
          - "creates the DeferralEvent with status ACTIVE"
          - "when reason_code == PHYSICIAN_WITHDRAWAL, sets every PhysicianApproval of the donor whose status == ACTIVE to WITHDRAWN"
          - "runs the recall cascade when recall_scope != NONE"
          - "increments Donor.version by 1"

      - from: SCREENING
        to: PERMANENTLY_DEFERRED
        trigger: "POST /milk-bank/donors/{id}/serology-panels whose computed panel_status == REACTIVE (system-triggered)"
        actor: system
        preconditions:
          - "donor.status IN {APPLICANT, SCREENING, INFO_REQUESTED, QUALIFIED}"
        side_effects:
          - "creates a DeferralEvent with reason_code REACTIVE_SEROLOGY, deferral_type PERMANENT, effective_from = clock date, deferral_days 0, lookback_days = REACTIVE_LOOKBACK_DAYS (365), recall_scope FULL_CHAIN, recorded_by_user_id `system`"
          - "the created DeferralEvent then executes the FULL_CHAIN recall cascade (hop 2 onward, see cascade note below)"
          - "increments Donor.version by 1"
        note: |
          FULL_CHAIN recall cascade, hop by hop. Each hop is caused by the
          previous hop, not by the original request:
            hop 1  the REACTIVE panel creates the DeferralEvent and flips
                   Donor.status to PERMANENTLY_DEFERRED.
            hop 2  because the donor became PERMANENTLY_DEFERRED, every
                   Donation of that donor whose expressed_on falls in the
                   closed interval [effective_from - lookback_days,
                   effective_from] and whose status is ELIGIBLE, ALLOCATED or
                   PASTEURIZED moves to RECALLED; DeferralEvent.
                   recalled_donation_count is stamped.
            hop 3  because those donations became RECALLED, each of their
                   PoolComponent rows is implicated: a component with status
                   ALLOCATED moves to VOIDED (returning volume to
                   Donation.remaining_ml) and its Pool, if DRAFT, BALANCED or
                   COMMITTED, moves to SCRAPPED with
                   Pool.distinct_donor_count, Pool.total_volume_ml and
                   Pool.projected_kcal_per_oz recomputed; a component already
                   CONSUMED_PASTEURIZED is left in place because its milk is
                   bottled, and its PASTEURIZED pool keeps that status.
                   DeferralEvent.quarantined_pool_count counts only the pools
                   moved to SCRAPPED.
            hop 4  because those components are implicated, every MilkLot
                   bottled from a PasteurizationRun whose pool holds an
                   implicated component, and whose release_status is HOLD,
                   RELEASED or EXHAUSTED, moves to RECALLED; DeferralEvent.
                   recalled_lot_count is stamped.
            hop 5  because those lots became RECALLED, every Dispense against
                   them with status DISPENSED moves to RECALLED, its
                   subsidy_cents is credited back to
                   SubsidyProgram.consumed_cents (which may flip that program
                   from EXHAUSTED to OPEN), its volume is subtracted from
                   Prescription.cumulative_dispensed_ml, and any Prescription
                   that drops below prescribed_ml returns from FILLED to
                   QUEUED with a recomputed waitlist_position;
                   DeferralEvent.recalled_dispense_count and
                   reversed_subsidy_cents are stamped.

      - from: TEMPORARILY_DEFERRED
        to: SCREENING
        trigger: "POST /milk-bank/donors/{id}/requalify"
        actor: MedicalDirector
        preconditions:
          - "donor.status == TEMPORARILY_DEFERRED"
          - "clock date > Donor.active_deferral_until_date"
        side_effects:
          - "sets every ACTIVE TEMPORARY DeferralEvent of the donor whose effective_from + deferral_days < clock date to EXPIRED"
          - "recomputes Donor.active_deferral_until_date from the donor's remaining ACTIVE TEMPORARY deferrals (null when none remain)"
          - "recomputes Donor.surveillance_risk_score with the decayed deferral history"
          - "increments Donor.version by 1"
        note: "Closes the qualification cycle: a donor may traverse QUALIFIED -> TEMPORARILY_DEFERRED -> SCREENING -> QUALIFIED repeatedly. A long-dated deferral that has not elapsed survives the requalification as ACTIVE, so the donor can be QUALIFIED and still have milk refused at pooling by §1.4 priority 45."

      - from: TEMPORARILY_DEFERRED
        to: TEMPORARILY_DEFERRED
        trigger: "POST /milk-bank/donors/{id}/deferrals with deferral_type TEMPORARY"
        actor: MedicalDirector
        preconditions:
          - "donor.status == TEMPORARILY_DEFERRED"
          - "deferral_days >= 1"
        side_effects:
          - "creates the DeferralEvent with status ACTIVE; the donor's status does not change"
          - "increments Donor.temporary_deferral_count and recomputes Donor.active_deferral_until_date from the most recently created ACTIVE TEMPORARY deferral, which is this one"
          - "recomputes Donor.surveillance_risk_score from the changed deferral history"
          - "runs the recall cascade described in the DeferralEvent notes when recall_scope != NONE"
          - "increments Donor.version by 1"
        note: "Self-loop: an already deferred donor can accumulate a further deferral event, and because active_deferral_until_date follows the most recently CREATED event, a later short deferral can shorten the requalification gate while an earlier long deferral remains ACTIVE."

  - entity: Shipment
    initial_state: IN_TRANSIT
    terminal_states: [REJECTED, CLOSED]
    transitions:
      - from: IN_TRANSIT
        to: ACCEPTED
        trigger: "POST /milk-bank/shipments/{id}/receive when arrival_max_temp_celsius <= COLD_CHAIN_QUARANTINE_TEMP (-8.0) AND excursion_minutes <= COLD_CHAIN_EXCURSION_MAX_MINUTES (30)"
        actor: IntakeCoordinator
        preconditions:
          - "shipment.status == IN_TRANSIT"
        side_effects:
          - "stamps excursion_minutes, arrival_max_temp_celsius, verified_volume_ml, received_at and received_by_user_id"
          - "computes final_reimbursement_cents from calculations.shipment_reimbursement variant FINAL_AT_RECEIPT"
          - "sets credited_reimbursement_cents = final_reimbursement_cents"
          - "credits Donor.reimbursement_balance_cents by credited_reimbursement_cents and increments Donor.version by 1"
          - "increments Shipment.version by 1"

      - from: IN_TRANSIT
        to: QUARANTINED
        trigger: "POST /milk-bank/shipments/{id}/receive when arrival_max_temp_celsius is in (-8.0, 4.0] OR excursion_minutes is in (30, 120]"
        actor: IntakeCoordinator
        preconditions:
          - "shipment.status == IN_TRANSIT"
        side_effects:
          - "stamps the same receipt fields as the ACCEPTED branch"
          - "computes final_reimbursement_cents from variant FINAL_AT_RECEIPT"
          - "sets credited_reimbursement_cents = round_half_up(final_reimbursement_cents * QUARANTINE_CREDIT_FACTOR (0.5))"
          - "credits Donor.reimbursement_balance_cents by credited_reimbursement_cents and increments Donor.version by 1"
          - "increments Shipment.version by 1"
        note: "Divergent branch: the same receive endpoint credits a different amount and blocks donation logging until a MedicalDirector dispositions the cooler."

      - from: IN_TRANSIT
        to: REJECTED
        trigger: "POST /milk-bank/shipments/{id}/receive when arrival_max_temp_celsius > COLD_CHAIN_REJECT_TEMP (4.0) OR excursion_minutes > 120"
        actor: IntakeCoordinator
        preconditions:
          - "shipment.status == IN_TRANSIT"
        side_effects:
          - "stamps the same receipt fields as the ACCEPTED branch"
          - "computes final_reimbursement_cents from variant FINAL_AT_RECEIPT"
          - "sets credited_reimbursement_cents = 0 and leaves Donor.reimbursement_balance_cents unchanged"
          - "increments Shipment.version by 1"

      - from: QUARANTINED
        to: ACCEPTED
        trigger: "POST /milk-bank/shipments/{id}/disposition with disposition ACCEPT"
        actor: MedicalDirector
        preconditions:
          - "shipment.status == QUARANTINED"
        side_effects:
          - "raises credited_reimbursement_cents to final_reimbursement_cents and credits Donor.reimbursement_balance_cents by the difference (final_reimbursement_cents - previous credited_reimbursement_cents)"
          - "increments Donor.version by 1 and Shipment.version by 1"
        note: "Fork-join: the QUARANTINED branch rejoins the ACCEPTED path, and the reimbursement ledger is topped up rather than double-credited."

      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /milk-bank/shipments/{id}/disposition with disposition REJECT"
        actor: MedicalDirector
        preconditions:
          - "shipment.status == QUARANTINED"
        side_effects:
          - "debits Donor.reimbursement_balance_cents by the previously credited credited_reimbursement_cents and sets credited_reimbursement_cents = 0"
          - "touches no Donation row: §1.4 priority 21 admits container logging only for an ACCEPTED shipment, and ACCEPTED is never re-entered from QUARANTINED, so a cooler that reaches REJECTED by disposition provably holds no Donation rows"
          - "increments Donor.version by 1 and Shipment.version by 1"

      - from: ACCEPTED
        to: CLOSED
        trigger: "system, evaluated at the end of every request that changes a Donation of this shipment"
        actor: system
        preconditions:
          - "shipment.status == ACCEPTED"
          - "the shipment has at least one Donation"
          - "every Donation of the shipment has status IN {PASTEURIZED, RECALLED, DISCARDED}"
        side_effects:
          - "increments Shipment.version by 1"
        note: "Bubble-up: the parent shipment closes itself once all of its donation children are terminal."

  - entity: Donation
    initial_state: ELIGIBLE
    terminal_states: [PASTEURIZED, RECALLED, DISCARDED]
    transitions:
      - from: ELIGIBLE
        to: ALLOCATED
        trigger: "POST /milk-bank/pools/{id}/components"
        actor: ProcessingTechnician
        preconditions:
          - "donation.status == ELIGIBLE"
          - "allocated_volume_ml <= donation.remaining_ml"
        side_effects:
          - "debits Donation.remaining_ml by allocated_volume_ml"
          - "sets status to ALLOCATED only when the resulting remaining_ml == 0; a partially drawn donation stays ELIGIBLE"
          - "increments Donation.version by 1"
        note: "Guarded by the parent Donor's status: the donation's donor must be QUALIFIED (see §1.4 priority 21)."

      - from: ALLOCATED
        to: ELIGIBLE
        trigger: "POST /milk-bank/pools/{id}/scrap (compensating action)"
        actor: ProcessingTechnician
        preconditions:
          - "the donation has at least one PoolComponent with status ALLOCATED in the scrapped pool"
          - "pool.status IN {DRAFT, BALANCED, COMMITTED}"
        side_effects:
          - "sets those PoolComponent rows to VOIDED"
          - "credits Donation.remaining_ml by each voided component's allocated_volume_ml"
          - "increments Donation.version by 1"
        note: "Cycle: a donation can be allocated, released and re-allocated to a different pool without volume drift."

      - from: ALLOCATED
        to: PASTEURIZED
        trigger: "POST /milk-bank/pasteurization-runs/{id}/lots"
        actor: ProcessingTechnician
        preconditions:
          - "the donation's PoolComponent in the bottled run's pool has status ALLOCATED"
        side_effects:
          - "sets those PoolComponent rows to CONSUMED_PASTEURIZED"
          - "increments Donation.version by 1"

      - from: ELIGIBLE
        to: RECALLED
        trigger: "cascade hop 2 of a DeferralEvent with recall_scope IN {DONATIONS_ONLY, FULL_CHAIN}"
        actor: system
        preconditions:
          - "donation.status IN {ELIGIBLE, ALLOCATED, PASTEURIZED}"
          - "donation.expressed_on is inside the closed interval [effective_from - lookback_days, effective_from]"
        side_effects:
          - "sets Donation.status to RECALLED"
          - "increments Donation.version by 1"
          - "triggers cascade hop 3 on the donation's PoolComponent rows"

      - from: ELIGIBLE
        to: DISCARDED
        trigger: "cascade from a pool that reaches SCRAPPED_CULTURE (POST /milk-bank/pasteurization-runs/{id}/culture with a failing culture)"
        actor: system
        preconditions:
          - "donation.status IN {ELIGIBLE, ALLOCATED}"
        side_effects:
          - "sets Donation.status to DISCARDED and Donation.remaining_ml to 0"
          - "increments Donation.version by 1"

  - entity: Pool
    initial_state: DRAFT
    terminal_states: [PASTEURIZED, SCRAPPED, SCRAPPED_CULTURE]
    transitions:
      - from: DRAFT
        to: BALANCED
        trigger: "POST /milk-bank/pools/{id}/components, evaluated after the component is written"
        actor: ProcessingTechnician
        preconditions:
          - "pool.status == DRAFT"
          - "recomputed distinct_donor_count >= MIN_DISTINCT_DONORS (3)"
          - "recomputed projected_kcal_per_oz is inside the closed range [KCAL_MIN (19.00), KCAL_MAX (21.00)]"
          - "recomputed total_volume_ml is inside the closed range [POOL_VOLUME_MIN (1500), POOL_VOLUME_MAX (6000)]"
        side_effects:
          - "recomputes distinct_donor_count, total_volume_ml and projected_kcal_per_oz"
          - "increments Pool.version by 1"

      - from: BALANCED
        to: DRAFT
        trigger: "POST /milk-bank/pools/{id}/components whose addition pushes the recomputed metrics back outside the balanced ranges"
        actor: ProcessingTechnician
        preconditions:
          - "pool.status == BALANCED"
          - "after the write, at least one of the three balance conditions is false"
        side_effects:
          - "recomputes distinct_donor_count, total_volume_ml and projected_kcal_per_oz"
          - "increments Pool.version by 1"
        note: "Cycle: a pool oscillates DRAFT <-> BALANCED as components are added, so commit eligibility is never monotonic."

      - from: BALANCED
        to: COMMITTED
        trigger: "POST /milk-bank/pools/{id}/commit"
        actor: ProcessingTechnician
        preconditions:
          - "pool.status IN {DRAFT, BALANCED} - the state gate admits both so that a DRAFT pool reports the specific balance failure (1.4 priorities 64-67) instead of a generic state error; a DRAFT pool always fails at least one of those four checks and therefore never reaches COMMITTED"
          - "distinct_donor_count >= 3 and <= MAX_DISTINCT_DONORS (5)"
          - "projected_kcal_per_oz is inside [19.00, 21.00]"
          - "total_volume_ml is inside [1500, 6000]"
        side_effects:
          - "stamps committed_at = clock instant and committed_by_user_id = X-User-ID"
          - "increments Pool.version by 1"

      - from: COMMITTED
        to: PASTEURIZED
        trigger: "POST /milk-bank/pasteurization-runs/{id}/lots, evaluated after the lot is written"
        actor: ProcessingTechnician
        preconditions:
          - "pool.status == COMMITTED"
          - "the run's thermal_status == PASSED"
        side_effects:
          - "sets every PoolComponent of the pool with status ALLOCATED to CONSUMED_PASTEURIZED"
          - "sets every Donation whose components are all CONSUMED_PASTEURIZED and whose remaining_ml == 0 to PASTEURIZED"
          - "recomputes Pool.bottled_volume_ml"
          - "increments Pool.version by 1"

      - from: DRAFT
        to: SCRAPPED
        trigger: "POST /milk-bank/pools/{id}/scrap, or cascade hop 3 of a FULL_CHAIN / DONATIONS_ONLY DeferralEvent"
        actor: ProcessingTechnician
        preconditions:
          - "pool.status IN {DRAFT, BALANCED, COMMITTED}"
        side_effects:
          - "sets every PoolComponent with status ALLOCATED to VOIDED"
          - "credits each affected Donation.remaining_ml by its voided allocated_volume_ml and returns non-recalled donations to ELIGIBLE"
          - "recomputes distinct_donor_count, total_volume_ml and projected_kcal_per_oz (projected_kcal_per_oz becomes null when no non-VOIDED component remains)"
          - "sets any PasteurizationRun of the pool whose run_status IN {SCHEDULED, IN_PROGRESS} to VOIDED, freeing its pasteurizer interval"
          - "increments Pool.version by 1"

      - from: COMMITTED
        to: SCRAPPED_CULTURE
        trigger: "cascade hop 3 of POST /milk-bank/pasteurization-runs/{id}/culture with a failing culture"
        actor: system
        preconditions:
          - "pool.status IN {COMMITTED, PASTEURIZED}"
          - "every MilkLot of the pool's run has release_status == DISCARDED"
        side_effects:
          - "sets every PoolComponent of the pool with status IN {ALLOCATED, CONSUMED_PASTEURIZED} to CONSUMED_LOST (volume is destroyed, NOT returned to Donation.remaining_ml)"
          - "sets every Donation of those components whose status is not RECALLED to DISCARDED"
          - "increments Pool.version by 1"
        note: "Distinct from SCRAPPED: no volume is returned, so the conserved-volume identity holds through CONSUMED_LOST rather than through remaining_ml."

  - entity: PasteurizationRun
    initial_state: SCHEDULED
    terminal_states: [BOTTLED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /milk-bank/pasteurization-runs/{id}/readings (first reading)"
        actor: ProcessingTechnician
        preconditions:
          - "run.run_status == SCHEDULED"
          - "offset_seconds strictly greater than every existing reading's offset_seconds for this run"
        side_effects:
          - "creates the TemperatureReading with computed qualifies"
          - "increments PasteurizationRun.reading_count and refreshes peak_celsius"
          - "increments PasteurizationRun.version by 1"

      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /milk-bank/pasteurization-runs/{id}/readings (subsequent readings)"
        actor: ProcessingTechnician
        preconditions:
          - "run.run_status == IN_PROGRESS"
          - "offset_seconds strictly greater than every existing reading's offset_seconds for this run"
        side_effects:
          - "creates the TemperatureReading, increments reading_count, refreshes peak_celsius"
          - "increments PasteurizationRun.version by 1"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /milk-bank/pasteurization-runs/{id}/complete"
        actor: ProcessingTechnician
        preconditions:
          - "run.run_status == IN_PROGRESS"
          - "run.reading_count >= MIN_READINGS_TO_COMPLETE (2)"
        side_effects:
          - "runs calculations.thermal_hold_verification and stores longest_hold_seconds"
          - "sets thermal_status to PASSED when longest_hold_seconds >= MIN_HOLD_SECONDS (1800), otherwise FAILED"
          - "stamps completed_at = clock instant and completed_by_user_id = X-User-ID"
          - "recomputes release_eligibility from (thermal_status, culture_status)"
          - "increments PasteurizationRun.version by 1"
        note: "thermal_status is one of three independent dimensions on this row; run_status advances to COMPLETED regardless of whether thermal_status lands on PASSED or FAILED."

      - from: COMPLETED
        to: COMPLETED
        trigger: "POST /milk-bank/pasteurization-runs/{id}/culture"
        actor: QualityAssuranceOfficer
        preconditions:
          - "run.run_status IN {COMPLETED, BOTTLED}"
          - "run.culture_status == NOT_COLLECTED"
        side_effects:
          - "stamps culture_cfu_per_ml, culture_organism and culture_recorded_by_user_id"
          - "sets culture_status to FAILED when culture_cfu_per_ml >= CULTURE_FAIL_CFU (10), otherwise PASSED"
          - "recomputes release_eligibility from (thermal_status, culture_status)"
          - "when culture_status becomes FAILED, executes the culture-failure cascade (see note)"
          - "increments PasteurizationRun.version by 1"
        note: |
          Culture-failure cascade, hop by hop. Each hop is caused by the
          previous hop:
            hop 1  the culture result flips culture_status to FAILED, which
                   forces release_eligibility to BLOCKED.
            hop 2  because release_eligibility became BLOCKED, every MilkLot
                   of this run whose release_status IN {HOLD, RELEASED,
                   EXHAUSTED} moves to DISCARDED and its available_ml is
                   frozen at its current value.
            hop 3  because every lot of the run is now DISCARDED, the run's
                   Pool moves to SCRAPPED_CULTURE and its PoolComponent rows
                   move to CONSUMED_LOST.
            hop 4  because those components became CONSUMED_LOST, each of
                   their Donation rows whose status is not RECALLED moves to
                   DISCARDED with remaining_ml set to 0, which in turn lets
                   each fully terminal Shipment bubble up to CLOSED.

      - from: COMPLETED
        to: BOTTLED
        trigger: "POST /milk-bank/pasteurization-runs/{id}/lots"
        actor: ProcessingTechnician
        preconditions:
          - "run.run_status == COMPLETED"
          - "run.thermal_status == PASSED"
          - "bottle_count * bottle_volume_ml <= pool.total_volume_ml - pool.bottled_volume_ml"
        side_effects:
          - "creates the MilkLot with computed lot_code, lot_sequence, expiration_date, kcal_per_oz, milk_class, total_volume_ml and available_ml"
          - "advances the pool through COMMITTED -> PASTEURIZED and its components to CONSUMED_PASTEURIZED"
          - "increments PasteurizationRun.version by 1"

      - from: BOTTLED
        to: BOTTLED
        trigger: "POST /milk-bank/pasteurization-runs/{id}/lots (second and later lot of the same run)"
        actor: ProcessingTechnician
        preconditions:
          - "run.run_status == BOTTLED"
          - "run.thermal_status == PASSED"
          - "bottle_count * bottle_volume_ml <= pool.total_volume_ml - pool.bottled_volume_ml"
        side_effects:
          - "creates a further MilkLot with lot_sequence = 1 + the count of existing MilkLot rows of this run, so its lot_code carries the next 2-digit suffix"
          - "recomputes Pool.bottled_volume_ml and increments Pool.version by 1; the pool is already PASTEURIZED and its components are already CONSUMED_PASTEURIZED, so no pool or component state change occurs"
          - "increments PasteurizationRun.version by 1"
        note: "Self-loop: one run may be bottled into several lots, which is what makes §1.3 lot_expiration_date's lot_sequence counter and §1.4 priority 68's 'counting milk already bottled by earlier lots of the same run' term observable. Every lot of the run shares the same completed_at, so lot_code differs only in the trailing sequence."

      - from: SCHEDULED
        to: VOIDED
        trigger: "cascade from POST /milk-bank/pools/{id}/scrap"
        actor: system
        preconditions:
          - "run.run_status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "frees the run's occupied interval on pasteurizer_id so a later run may take the slot"
          - "increments PasteurizationRun.version by 1"

  - entity: MilkLot
    initial_state: HOLD
    terminal_states: [DISCARDED, RECALLED, EXPIRED]
    transitions:
      - from: HOLD
        to: RELEASED
        trigger: "POST /milk-bank/milk-lots/{id}/release"
        actor: QualityAssuranceOfficer
        preconditions:
          - "lot.release_status == HOLD"
          - "the lot's PasteurizationRun.release_eligibility == ELIGIBLE"
          - "X-User-ID != run.completed_by_user_id"
          - "X-User-ID != run.culture_recorded_by_user_id"
        side_effects:
          - "stamps released_at = clock instant and released_by_user_id = X-User-ID"
          - "increments MilkLot.version by 1"
        note: "Guarded transition across an entity boundary: MilkLot cannot advance unless a different entity (its run) sits in ELIGIBLE."

      - from: RELEASED
        to: EXHAUSTED
        trigger: "system, evaluated at the end of any request that changes MilkLot.dispensed_ml"
        actor: system
        preconditions:
          - "lot.release_status == RELEASED"
          - "recomputed available_ml == 0"
        side_effects:
          - "increments MilkLot.version by 1"

      - from: EXHAUSTED
        to: RELEASED
        trigger: "system, cascade from POST /milk-bank/dispenses/{id}/void"
        actor: system
        preconditions:
          - "lot.release_status == EXHAUSTED"
          - "recomputed available_ml > 0"
          - "lot.expiration_date >= clock date"
        side_effects:
          - "increments MilkLot.version by 1"
        note: "Compensating cycle: voiding a fill returns the lot to RELEASED so the freed volume is dispensable again."

      - from: HOLD
        to: EXPIRED
        trigger: "POST /milk-bank/_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "lot.release_status == HOLD"
          - "lot.expiration_date < new clock date"
        side_effects:
          - "increments MilkLot.version by 1"
        note: "The sweep writes off only never-released milk. A RELEASED or EXHAUSTED lot keeps its status past its expiration date and is stopped at fill time by ERR_LOT_EXPIRED (1.4 priority 55), so the date guard and the sweep never shadow each other."

      - from: HOLD
        to: DISCARDED
        trigger: "cascade hop 2 of a failing POST /milk-bank/pasteurization-runs/{id}/culture"
        actor: system
        preconditions:
          - "lot.release_status IN {HOLD, RELEASED, EXHAUSTED}"
        side_effects:
          - "increments MilkLot.version by 1"
          - "triggers cascade hop 3 on the run's Pool"

      - from: RELEASED
        to: RECALLED
        trigger: "cascade hop 4 of a FULL_CHAIN DeferralEvent"
        actor: system
        preconditions:
          - "lot.release_status IN {HOLD, RELEASED, EXHAUSTED}"
        side_effects:
          - "increments MilkLot.version by 1"
          - "triggers cascade hop 5 on the lot's DISPENSED Dispense rows"

  - entity: Prescription
    initial_state: QUEUED
    terminal_states: [FILLED, CANCELLED, EXPIRED]
    transitions:
      - from: QUEUED
        to: PARTIALLY_FILLED
        trigger: "POST /milk-bank/prescriptions/{id}/dispenses or POST /milk-bank/allocation-cycles"
        actor: DispensingPharmacist
        preconditions:
          - "prescription.status IN {QUEUED, PARTIALLY_FILLED}"
          - "0 < volume_ml < prescription.remaining_ml"
        side_effects:
          - "creates the Dispense with the fee split from calculations.dispense_fee_allocation"
          - "adds volume_ml to cumulative_dispensed_ml and lowers remaining_ml"
          - "adds subsidy_cents to SubsidyProgram.consumed_cents and flips that program to EXHAUSTED when consumed_cents >= annual_cap_cents"
          - "adds volume_ml to MilkLot.dispensed_ml and lowers MilkLot.available_ml, incrementing MilkLot.version by 1"
          - "recomputes waitlist_position for every QUEUED / PARTIALLY_FILLED prescription in the same priority_tier bucket"
          - "increments Prescription.version by 1"

      - from: PARTIALLY_FILLED
        to: FILLED
        trigger: "POST /milk-bank/prescriptions/{id}/dispenses or POST /milk-bank/allocation-cycles when the fill closes the order"
        actor: DispensingPharmacist
        preconditions:
          - "prescription.status IN {QUEUED, PARTIALLY_FILLED}"
          - "volume_ml == prescription.remaining_ml"
        side_effects:
          - "same ledger side effects as the PARTIALLY_FILLED transition"
          - "clears waitlist_position to null and recomputes the bucket's remaining positions"
          - "increments Prescription.version by 1"

      - from: FILLED
        to: QUEUED
        trigger: "POST /milk-bank/dispenses/{id}/void, or cascade hop 5 of a FULL_CHAIN DeferralEvent"
        actor: DispensingPharmacist
        preconditions:
          - "prescription.status IN {FILLED, PARTIALLY_FILLED}"
          - "the voided or recalled Dispense had status == DISPENSED"
        side_effects:
          - "subtracts the dispense volume from cumulative_dispensed_ml and raises remaining_ml"
          - "sets status to QUEUED when cumulative_dispensed_ml == 0, otherwise PARTIALLY_FILLED"
          - "recomputes waitlist_position for the bucket"
          - "increments Prescription.version by 1"
        note: "Cycle: a prescription may leave FILLED and re-enter the waitlist any number of times."

      - from: QUEUED
        to: CANCELLED
        trigger: "POST /milk-bank/prescriptions/{id}/cancel"
        actor: Prescriber
        preconditions:
          - "prescription.status IN {QUEUED, PARTIALLY_FILLED}"
        side_effects:
          - "clears waitlist_position to null and recomputes the bucket's remaining positions"
          - "increments Prescription.version by 1"

      - from: QUEUED
        to: EXPIRED
        trigger: "POST /milk-bank/_clock/set_current_utc sweep"
        actor: system
        preconditions:
          - "prescription.status IN {QUEUED, PARTIALLY_FILLED}"
          - "prescription.needed_by_date < new clock date"
        side_effects:
          - "clears waitlist_position to null and recomputes the bucket's remaining positions"
          - "increments Prescription.version by 1"

  - entity: Dispense
    initial_state: DISPENSED
    terminal_states: [VOIDED, RECALLED]
    transitions:
      - from: DISPENSED
        to: VOIDED
        trigger: "POST /milk-bank/dispenses/{id}/void"
        actor: DispensingPharmacist
        preconditions:
          - "dispense.status == DISPENSED"
          - "the dispense's MilkLot.release_status is not RECALLED"
        side_effects:
          - "credits MilkLot.dispensed_ml back by volume_ml, raising available_ml, and increments MilkLot.version by 1"
          - "credits SubsidyProgram.consumed_cents back by subsidy_cents, flipping EXHAUSTED back to OPEN when consumed_cents < annual_cap_cents"
          - "lowers Prescription.cumulative_dispensed_ml and re-opens the prescription per the Prescription FILLED -> QUEUED transition"
          - "increments Dispense.version by 1"
        note: "Compensating action for the fill. gross_fee_cents, subsidy_cents and payer_due_cents are retained on the row for audit and are NOT zeroed."

      - from: DISPENSED
        to: RECALLED
        trigger: "cascade hop 5 of a FULL_CHAIN DeferralEvent"
        actor: system
        preconditions:
          - "dispense.status == DISPENSED"
          - "the dispense's MilkLot moved to RECALLED in hop 4"
        side_effects:
          - "credits SubsidyProgram.consumed_cents back by subsidy_cents and accumulates DeferralEvent.reversed_subsidy_cents"
          - "lowers Prescription.cumulative_dispensed_ml and re-opens the prescription"
          - "does NOT credit MilkLot.dispensed_ml back, because recalled milk is destroyed rather than returned to inventory"
          - "increments Dispense.version by 1"

# ----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: donation-log-stale-shipment
    parent_entity: Shipment
    write_endpoint: "POST /milk-bank/shipments/{id}/donations"
    occ_field: "expected_shipment_version"
    description: |
      Logging a container against a Shipment whose version has advanced since
      the client last read it is rejected. A second container log is itself a
      legitimate operation on the same ACCEPTED shipment, so the write cannot
      be filtered by any state precondition; the stale-version check is what
      tells the intake clerk that the cooler's manifest has changed (another
      container was logged, or a MedicalDirector re-dispositioned it) since
      they loaded the screen.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: component-add-stale-pool
    parent_entity: Pool
    write_endpoint: "POST /milk-bank/pools/{id}/components"
    occ_field: "expected_pool_version"
    description: |
      Adding a PoolComponent against a Pool whose version has advanced since
      the client last read it is rejected. Adding a further component is a
      legitimate operation on a DRAFT or BALANCED pool, so no state
      precondition covers it; the stale-version check protects the technician
      who chose an allocation volume from a projected_kcal_per_oz and
      distinct_donor_count snapshot that another component write has already
      invalidated.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dispense-create-stale-lot
    parent_entity: MilkLot
    write_endpoint: "POST /milk-bank/prescriptions/{id}/dispenses"
    occ_field: "expected_lot_version"
    description: |
      Creating a Dispense against a MilkLot whose version has advanced since
      the client last read it is rejected. Drawing a further fill from the
      same RELEASED lot is legitimate, so the write is not blocked by any
      state precondition; the stale-version check prevents a pharmacist from
      committing a volume decision taken against an available_ml snapshot
      that a prior fill, a void or an allocation cycle has already changed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ----------------------------------------------------------------------------
calculations:

  - name: shipment_reimbursement
    trigger: "On POST /milk-bank/shipments (variant PROVISIONAL_AT_DISPATCH) and again on POST /milk-bank/shipments/{id}/receive (variant FINAL_AT_RECEIPT)."
    algorithm: threshold
    formula: |
      # Both variants share this skeleton; they differ only in the value of
      # excursion_penalty_rate (see `variants:`).
      zone_base_cents   = ZONE_BASE_CENTS[shipment.zone_code]
      dry_ice_factor    = DRY_ICE_MULTIPLIER if shipment.uses_dry_ice else 1
      base_share_cents  = (zone_base_cents / shipment.container_count) * dry_ice_factor
      per_container_raw = (base_share_cents + CONTAINER_HANDLING_CENTS)
                          * (1 - excursion_penalty_rate)
      # MANDATORY ORDER: round each container's amount to a whole cent FIRST,
      # then multiply by container_count. Summing the unrounded per-container
      # amounts and rounding once at the end is a DIFFERENT number whenever
      # zone_base_cents is not divisible by container_count.
      per_container_cents = round_half_up(per_container_raw)      # step 1
      total_cents         = per_container_cents * container_count # step 2

      # excursion_penalty_rate, used by the FINAL_AT_RECEIPT variant only:
      excursion_penalty_rate = min(EXCURSION_PENALTY_CAP,
                                   EXCURSION_PENALTY_PER_MINUTE
                                   * shipment.excursion_minutes)
    input_set: |
      Reads only the Shipment row's own zone_code (copied from Donor.zone_code
      at creation), container_count, uses_dry_ice and — for FINAL_AT_RECEIPT —
      excursion_minutes. Donations are NOT an input: a cooler is reimbursed for
      the courier leg, not for its contents, so an ACCEPTED shipment with zero
      logged donations still reimburses in full.
    constants:
      ZONE_BASE_CENTS: { Z1: 1200, Z2: 1850, Z3: 2600 }
      CONTAINER_HANDLING_CENTS: 275
      DRY_ICE_MULTIPLIER: 1.15
      EXCURSION_PENALTY_PER_MINUTE: 0.02
      EXCURSION_PENALTY_CAP: 0.60
      QUARANTINE_CREDIT_FACTOR: 0.5
    precision: "Whole cents, round_half_up, applied per container before the multiply (see formula steps 1 and 2)."
    variants:
      - name: PROVISIONAL_AT_DISPATCH
        when: "POST /milk-bank/shipments — the cooler is still with the courier and no data logger has been read, so no excursion is known."
        difference: "excursion_penalty_rate is pinned to 0. Result is stored in Shipment.estimated_reimbursement_cents; nothing is credited to the donor's ledger yet."
      - name: FINAL_AT_RECEIPT
        when: "POST /milk-bank/shipments/{id}/receive — the data logger has been downloaded and excursion_minutes is known."
        difference: "excursion_penalty_rate = min(0.60, 0.02 * excursion_minutes), so the same cooler yields a strictly lower amount whenever excursion_minutes >= 1. Result is stored in Shipment.final_reimbursement_cents; the amount actually posted to Donor.reimbursement_balance_cents is then scaled by the receipt branch (x1 for ACCEPTED, x QUARANTINE_CREDIT_FACTOR for QUARANTINED, x0 for REJECTED)."
    worked_examples:
      - "zone Z2, container_count 3, uses_dry_ice true, PROVISIONAL: base_share = 1850/3*1.15 = 709.1666..., +275 = 984.1666..., round -> 984, x3 = 2952. (Summing first would give 2952.5 -> 2953: a 1-cent divergence that only the pinned order reproduces.)"
      - "same cooler, FINAL with excursion_minutes 7: penalty 0.14, 984.1666...*0.86 = 846.383... -> 846, x3 = 2538."
      - "zone Z3, container_count 2, uses_dry_ice true, PROVISIONAL: 2600/2*1.15 = 1495, +275 = 1770, x2 = 3540. FINAL with excursion_minutes 40: penalty min(0.60, 0.80) = 0.60, 1770*0.40 = 708, x2 = 1416. Received as QUARANTINED: credited = round_half_up(1416*0.5) = 708."
      - "zone Z2, container_count 1, uses_dry_ice false: 1850 + 275 = 2125 for both variants when excursion_minutes is 0."

  - name: donor_risk_score
    trigger: "On POST /milk-bank/donors/{id}/health-history (both variants), on POST /milk-bank/donors/{id}/deferrals (SURVEILLANCE_DECAYED), on POST /milk-bank/donors/{id}/requalify (SURVEILLANCE_DECAYED) and on POST /milk-bank/donors/{id}/qualify (SURVEILLANCE_DECAYED, which gates the transition)."
    algorithm: weighted_scoring
    formula: |
      # Shared base component, from the donor's NEWEST HealthHistoryQuestionnaire
      # (created_at DESC, tie-break submitted_at DESC):
      alcohol_points = ALCOHOL_TIER_POINTS applied to q.alcohol_units_per_week:
                         0                      -> 0
                         1..3                   -> 5
                         4..7                   -> 15
                         >= 8                   -> 45
      postpartum_points = min(POSTPARTUM_CAP,
                              max(0, q.months_postpartum - POSTPARTUM_FREE_MONTHS)
                              * POSTPARTUM_PER_MONTH)
      base = q.medication_flag_count * MEDICATION_WEIGHT
             + (TRAVEL_WEIGHT if q.travel_risk_flag else 0)
             + (TOBACCO_WEIGHT if q.tobacco_use else 0)
             + alcohol_points
             + postpartum_points

      # Variant SCREENING_WORST_CASE — pessimistic, undecayed:
      serology_penalty = SEROLOGY_PENDING_PENALTY if the donor has NO
                         SerologyPanel with panel_status == NON_REACTIVE and
                         expires_on >= clock_date, else 0
      temp_history_penalty = TEMP_DEFERRAL_WEIGHT * count(DeferralEvent of this
                             donor with deferral_type == TEMPORARY and status IN
                             {ACTIVE, EXPIRED})
      screening_risk_score = min(SCORE_CAP,
                                 base + serology_penalty + temp_history_penalty)

      # Variant SURVEILLANCE_DECAYED — time-discounted, no serology penalty:
      decayed = sum over DeferralEvent d of this donor with
                d.deferral_type == TEMPORARY and d.status IN {ACTIVE, EXPIRED} of
                  TEMP_DEFERRAL_WEIGHT
                  * 0.5 ** (days_between(d.effective_from, clock_date)
                            / DECAY_HALF_LIFE_DAYS)
      surveillance_risk_score = min(SCORE_CAP, round_half_up(base + decayed))

      # Score bands, applied to screening_risk_score at health-history intake:
      #   <= RISK_ACCEPT_MAX (60)                  -> questionnaire ACCEPTED
      #   RISK_ACCEPT_MAX < s <= RISK_DEFER_MAX(85)-> questionnaire INFO_REQUESTED
      #   > RISK_DEFER_MAX (85)                    -> questionnaire AUTO_DEFERRED
      #                                               + system DeferralEvent
    input_set: |
      SCREENING_WORST_CASE reads the newest questionnaire, the donor's serology
      panels and the COUNT of temporary deferral events. SURVEILLANCE_DECAYED
      reads the newest questionnaire and the DATES of those same deferral
      events, and never reads serology at all. Superseded questionnaires are
      excluded from both. days_between is a whole-day difference on calendar
      dates, so the decay exponent is clock-driven and never wall-clock driven.
    constants:
      MEDICATION_WEIGHT: 8
      TRAVEL_WEIGHT: 25
      TOBACCO_WEIGHT: 40
      ALCOHOL_TIER_POINTS: { "0": 0, "1-3": 5, "4-7": 15, "8+": 45 }
      POSTPARTUM_FREE_MONTHS: 12
      POSTPARTUM_PER_MONTH: 3
      POSTPARTUM_CAP: 30
      SEROLOGY_PENDING_PENALTY: 20
      TEMP_DEFERRAL_WEIGHT: 15
      DECAY_HALF_LIFE_DAYS: 180
      SCORE_CAP: 100
      RISK_ACCEPT_MAX: 60
      RISK_DEFER_MAX: 85
      AUTO_DEFERRAL_DAYS: 90
    precision: "Both variants are integers in 0..100. SCREENING_WORST_CASE is exact integer arithmetic; SURVEILLANCE_DECAYED rounds the real-valued decay sum half-up once, after adding base."
    variants:
      - name: SCREENING_WORST_CASE
        when: "Stored in Donor.screening_risk_score and used for the intake score bands (ACCEPTED / INFO_REQUESTED / AUTO_DEFERRED) at POST /donors/{id}/health-history."
        difference: "Adds SEROLOGY_PENDING_PENALTY (20) when no unexpired NON_REACTIVE panel exists, and charges every historical temporary deferral at the FULL undecayed TEMP_DEFERRAL_WEIGHT (15) regardless of age."
      - name: SURVEILLANCE_DECAYED
        when: "Stored in Donor.surveillance_risk_score, and is the value compared against RISK_ACCEPT_MAX by the qualification precondition at POST /donors/{id}/qualify."
        difference: "Never adds the serology penalty (serology is a hard precondition at qualification, not a score term), and discounts each temporary deferral by 0.5 ** (age_in_days / 180). For a donor with one temporary deferral the two variants therefore disagree on identical stored data."
    worked_examples:
      - "questionnaire (medication_flag_count 2, travel false, tobacco false, alcohol_units_per_week 3, months_postpartum 15): base = 16 + 0 + 0 + 5 + min(30, 3*3) = 30. With no serology on file and no deferrals, SCREENING_WORST_CASE = 50 and SURVEILLANCE_DECAYED = 30."
      - "questionnaire (medication_flag_count 3, travel true, tobacco true, alcohol 0, months_postpartum 12): base = 24 + 25 + 40 + 0 + 0 = 89; SCREENING_WORST_CASE = min(100, 89 + 20) = 100 > 85, so the questionnaire is AUTO_DEFERRED."
      - "band boundary: base 40 (tobacco only) + 20 serology = 60, exactly RISK_ACCEPT_MAX, so ACCEPTED. base 41 (medication_flag_count 2 + travel) + 20 = 61, one point over, so INFO_REQUESTED."
      - "decay: base 30, one TEMPORARY deferral with effective_from 2026-02-01, clock date 2026-08-01 -> 181 days; 15 * 0.5 ** (181/180) = 7.471174404154314; SURVEILLANCE_DECAYED = round_half_up(30 + 7.4711744...) = 37, while SCREENING_WORST_CASE = 30 + 20 + 15 = 65."

  - name: pool_projected_kcal_per_oz
    trigger: "Recomputed on POST /milk-bank/pools/{id}/components, on POST /milk-bank/pools/{id}/scrap, and on every cascade that voids a PoolComponent (deferral recall hop 3)."
    algorithm: aggregation
    formula: |
      included = PoolComponent rows of this pool with status == ALLOCATED
      if included is empty:
        projected_kcal_per_oz = null
        total_volume_ml       = 0
        distinct_donor_count  = 0
      else:
        numerator   = sum(c.allocated_volume_ml * c.component_kcal_per_oz
                          for c in included)     # exact decimal, no intermediate rounding
        denominator = sum(c.allocated_volume_ml for c in included)
        projected_kcal_per_oz = round_half_up(numerator / denominator, 2)
        total_volume_ml       = denominator
        distinct_donor_count  = count of distinct c.component_donor_id in included
      balanced = distinct_donor_count >= MIN_DISTINCT_DONORS
                 and KCAL_MIN <= projected_kcal_per_oz <= KCAL_MAX
                 and POOL_VOLUME_MIN <= total_volume_ml <= POOL_VOLUME_MAX
    input_set: |
      Only ALLOCATED components. VOIDED, CONSUMED_PASTEURIZED and CONSUMED_LOST
      components are excluded, which is why a scrapped-and-rebuilt pool
      re-derives its nutrition from scratch rather than accumulating history.
      component_kcal_per_oz is frozen onto the component at add time from
      Donation.kcal_per_oz, so a later correction to the donation does
      not silently re-weight a committed pool.
    constants:
      MIN_DISTINCT_DONORS: 3
      MAX_DISTINCT_DONORS: 5
      KCAL_MIN: 19.00
      KCAL_MAX: 21.00
      POOL_VOLUME_MIN: 1500
      POOL_VOLUME_MAX: 6000
    precision: "2 decimal places, round_half_up, on the single final division only."
    variants: []
    worked_examples:
      - "components 800 ml @ 18.50, 700 ml @ 20.00, 600 ml @ 22.50: numerator 14800 + 14000 + 13500 = 42300, denominator 2100, 42300/2100 = 20.142857... -> 20.14, inside [19.00, 21.00], 3 distinct donors, 2100 ml inside [1500, 6000] -> BALANCED."
      - "components 900 ml @ 15.00, 800 ml @ 16.00, 700 ml @ 17.00: numerator 13500 + 12800 + 11900 = 38200, denominator 2400, 38200/2400 = 15.9166... -> 15.92, outside [19.00, 21.00] -> stays DRAFT and commit is rejected."
      - "components 1000 ml @ 19.00, 900 ml @ 19.10, 800 ml @ 19.05: numerator 19000 + 17190 + 15240 = 51430, denominator 2700, 51430/2700 = 19.048148... -> 19.05, just inside KCAL_MIN -> BALANCED."

  - name: thermal_hold_verification
    trigger: "On POST /milk-bank/pasteurization-runs/{id}/complete."
    algorithm: interval_merge
    formula: |
      readings = TemperatureReading rows of this run, ordered by
                 offset_seconds ASC (offset_seconds is strictly increasing per
                 run, enforced at write time, so the order is total and no
                 tie-break is needed)
      # A reading qualifies when it sits inside the CLOSED holding band.
      qualifies(r) = MIN_HOLD_CELSIUS <= r.celsius <= MAX_HOLD_CELSIUS
      # Walk the ordered readings, growing a run of consecutive qualifying
      # readings. A gap strictly greater than MAX_READING_GAP_SECONDS breaks
      # the segment even when both endpoints qualify, because an unmonitored
      # interval cannot be certified.
      longest = 0; seg_start = null; prev = null
      for r in readings:
        if not qualifies(r):
          seg_start = null
        else if seg_start is null:
          seg_start = r.offset_seconds
        else if r.offset_seconds - prev.offset_seconds > MAX_READING_GAP_SECONDS:
          seg_start = r.offset_seconds        # gap too wide: restart the segment
        else:
          longest = max(longest, r.offset_seconds - seg_start)
        prev = r
      longest_hold_seconds = longest
      peak_celsius         = max(r.celsius for r in readings)
      thermal_status = PASSED if longest_hold_seconds >= MIN_HOLD_SECONDS
                       else FAILED
    input_set: |
      All TemperatureReading rows of the run, qualifying or not. A single
      non-qualifying reading in the middle of an otherwise good curve resets
      the segment, so the longest hold is a property of the worst dip, not of
      the total time in band.
    constants:
      MIN_HOLD_CELSIUS: 62.5
      MAX_HOLD_CELSIUS: 65.0
      MIN_HOLD_SECONDS: 1800
      MAX_READING_GAP_SECONDS: 600
      MIN_READINGS_TO_COMPLETE: 2
    precision: "longest_hold_seconds is a whole number of seconds; peak_celsius keeps 1 decimal place as recorded."
    variants: []
    worked_examples:
      - "readings (0, 63.0) (600, 63.5) (1200, 64.0) (1800, 63.2): all qualify, every gap is exactly 600 = MAX_READING_GAP_SECONDS (allowed, closed bound), longest_hold_seconds = 1800 - 0 = 1800 >= 1800 -> PASSED, peak_celsius 64.0."
      - "readings (0, 63.0) (601, 63.5) (1201, 64.0) (1801, 63.2): the first gap is 601 > 600 so the segment restarts at 601; longest_hold_seconds = 1801 - 601 = 1200 < 1800 -> FAILED."
      - "readings (0, 63.0) (600, 62.4) (1200, 63.8) (1800, 64.2) (2400, 63.9): the 62.4 reading is below MIN_HOLD_CELSIUS and resets the segment; longest_hold_seconds = 2400 - 1200 = 1200 -> FAILED even though four of five readings qualify."

  - name: lot_expiration_date
    trigger: "On POST /milk-bank/pasteurization-runs/{id}/lots, once per created MilkLot."
    algorithm: threshold
    formula: |
      contributing = PoolComponent rows of the run's pool with status IN
                     {ALLOCATED, CONSUMED_PASTEURIZED}
      # Three independent shelf-life ceilings; the lot expires on the EARLIEST.
      # Nested min, evaluated in this order:
      pasteurization_ceiling = date_of(run.completed_at)
                               + PASTEURIZED_SHELF_LIFE_DAYS
      raw_age_ceiling        = min(donation_of(c).expressed_on
                                  for c in contributing)
                               + RAW_MILK_MAX_AGE_DAYS
      receipt_ceiling        = min(date_of(shipment_of(donation_of(c)).received_at)
                                  for c in contributing)
                               + RECEIVED_MILK_SHELF_DAYS
      expiration_date = min(pasteurization_ceiling,
                            min(raw_age_ceiling, receipt_ceiling))
      # Lot identity, computed in the same call:
      lot_sequence = 1 + count of existing MilkLot rows of this run
      lot_code     = "{YYYYMMDD of date_of(run.completed_at)}"
                     + "-{pool.pool_sequence, 3 digits, zero-padded}"
                     + "-{lot_sequence, 2 digits, zero-padded}"
      kcal_per_oz  = pool.projected_kcal_per_oz   # frozen at bottling
      milk_class   = pool.target_milk_class
    input_set: |
      Every component that survived to bottling, including ones already marked
      CONSUMED_PASTEURIZED by an earlier lot of the same run, so a run's second
      lot inherits the same three ceilings as its first. VOIDED and
      CONSUMED_LOST components are excluded.
    constants:
      PASTEURIZED_SHELF_LIFE_DAYS: 180
      RAW_MILK_MAX_AGE_DAYS: 365
      RECEIVED_MILK_SHELF_DAYS: 240
    precision: "Whole calendar dates (YYYY-MM-DD). Day arithmetic is exact calendar addition, so leap days count."
    variants: []
    worked_examples:
      - "run completed 2026-08-10, earliest expressed_on 2026-07-05, earliest received_at date 2026-08-05: ceilings are 2027-02-06, 2027-07-05 and 2027-04-02; expiration_date = 2027-02-06 (pasteurization binds)."
      - "same run but one component's donation was expressed 2025-09-01: raw_age_ceiling = 2026-09-01, which is now the minimum, so expiration_date = 2026-09-01 (raw age binds and the lot is short-dated despite a fresh pasteurization)."
      - "lot identity for a pool with pool_sequence 1, run completed 2026-08-10, first lot of the run: lot_code = 20260810-001-01."

  - name: dispense_fee_allocation
    trigger: "On POST /milk-bank/prescriptions/{id}/dispenses and on every fill created by POST /milk-bank/allocation-cycles."
    algorithm: tiered_pricing
    formula: |
      # NINE STEPS, IN THIS EXACT ORDER. The tier is read from the
      # prescription's cumulative volume BEFORE this fill (step 2), and the
      # volume-discount tier is applied BEFORE the subsidy split (step 5
      # precedes step 7). Re-ordering any pair changes the result.
      step 1: units = ceil(volume_ml / VOLUME_UNIT_ML)
      step 2: prior_ml = prescription.cumulative_dispensed_ml   # PRE-fill value
              tier_rate = 0.00 if prior_ml < DISCOUNT_TIER_1_ML
                          else 0.05 if prior_ml < DISCOUNT_TIER_2_ML
                          else 0.12
      step 3: base_cents = units * BASE_FEE_CENTS_PER_100ML
      step 4: handling_cents = OUTPATIENT_HANDLING_CENTS
                               if prescription.patient_type == OUTPATIENT else 0
      step 5: gross_fee_cents = round_half_up((base_cents + handling_cents)
                                              * (1 - tier_rate))
      step 6: coverage_pct = program.coverage_pct if a SubsidyProgram is
                              linked and program.status == OPEN else 0
      step 7: uncapped_subsidy_cents = round_half_up(gross_fee_cents
                                                     * coverage_pct)
      step 8: headroom_cents = program.annual_cap_cents - program.consumed_cents
              subsidy_cents  = min(uncapped_subsidy_cents, headroom_cents)
              subsidy_capped = subsidy_cents < uncapped_subsidy_cents
      step 9: payer_due_cents = gross_fee_cents - subsidy_cents
      # Invariant, asserted after every fill:
      #   gross_fee_cents == subsidy_cents + payer_due_cents
    input_set: |
      The volume of THIS fill, the prescription's pre-fill cumulative volume,
      the prescription's patient_type, and the linked SubsidyProgram's
      coverage_pct / annual_cap_cents / consumed_cents. Other prescriptions on
      the same program affect this fill only through consumed_cents.
    constants:
      VOLUME_UNIT_ML: 100
      BASE_FEE_CENTS_PER_100ML: 480
      OUTPATIENT_HANDLING_CENTS: 350
      DISCOUNT_TIER_1_ML: 2000
      DISCOUNT_TIER_2_ML: 5000
      DISCOUNT_TIER_1_RATE: 0.05
      DISCOUNT_TIER_2_RATE: 0.12
    precision: "Whole cents, round_half_up, at step 5 and again at step 7 — two independent roundings, not one."
    variants: []
    worked_examples:
      - "patient_type NICU_INPATIENT, volume 450 ml, prior_ml 0, coverage 0.60, cap 100000, consumed 0: units 5, tier 0.00, base 2400, handling 0, gross 2400, uncapped subsidy 1440, headroom 100000, subsidy 1440, payer_due 960."
      - "same prescription, second fill volume 1600 ml, prior_ml 450: units 16, tier still 0.00 (450 < 2000), gross 7680, subsidy 4608, payer_due 3072."
      - "order sensitivity: volume 300 ml with prior_ml 1900. Reading the tier PRE-fill gives tier 0.00 and gross 1440. Reading it POST-fill (prior_ml + 300 = 2200) would give tier 0.05 and gross 1368 — a 72-cent divergence produced purely by step order."
      - "tier boundary: volume 500 ml with prior_ml 5000 -> tier 0.12, gross round_half_up(2400*0.88) = 2112, subsidy round_half_up(2112*0.6) = 1267, payer_due 845. With prior_ml 4999 -> tier 0.05, gross 2280, subsidy 1368, payer_due 912."
      - "cap boundary: gross 2400, coverage 0.60, uncapped subsidy 1440. With headroom exactly 1440 the subsidy is 1440 and subsidy_capped is false; with headroom 1439 the subsidy is 1439, payer_due is 961 and subsidy_capped is true."
      - "patient_type OUTPATIENT, volume 300 ml, prior_ml 0, coverage 0.60: units 3, base 1440, handling 350, tier 0.00, gross 1790, subsidy 1074, payer_due 716."

  - name: allocation_cycle_waterfall
    trigger: "On POST /milk-bank/allocation-cycles."
    algorithm: waterfall_allocation
    formula: |
      # Ordered demand: three priority buckets, drained in order. No bucket is
      # touched until the bucket above it can take no more milk.
      buckets = [ tier 1: priority_tier == 1   # NICU_INPATIENT + CRITICAL
                , tier 2: priority_tier == 2   # NICU_INPATIENT + STANDARD
                , tier 3: priority_tier == 3   # OUTPATIENT ]
      # Within a bucket, the demand order is fully deterministic and uses no
      # random field:
      #   created_at ASC, then remaining_ml DESC, then prescription_code ASC
      # Supply order (FEFO), also fully deterministic:
      #   expiration_date ASC, then available_ml ASC, then lot_code ASC
      eligible_lots(p) = MilkLot rows with release_status == RELEASED
                         and available_ml > 0
                         and expiration_date >= clock_date
                         and (lot.milk_class == PRETERM
                              if p.requires_preterm_milk else true)
      for bucket in buckets:
        for p in bucket ordered as above:
          lots_used = 0
          for lot in eligible_lots(p) ordered as above:
            if p.remaining_ml == 0: break
            if lots_used == MAX_LOTS_PER_PRESCRIPTION_PER_CYCLE: break
            # NICU_RESERVE_ML of total released inventory is walled off from
            # tier 3. The reserve is measured across ALL eligible lots, not
            # per lot, and is re-measured before every draw.
            available_to_bucket = lot.available_ml
            if bucket is tier 3:
              total_released = sum(l.available_ml for l in all lots with
                                   release_status == RELEASED)
              spare = max(0, total_released - NICU_RESERVE_ML)
              available_to_bucket = min(lot.available_ml, spare)
            draw_ml = min(p.remaining_ml, available_to_bucket)
            if draw_ml == 0: continue
            create a Dispense of draw_ml from lot, priced by
              calculations.dispense_fee_allocation, applying every side effect
              of the Prescription QUEUED -> PARTIALLY_FILLED transition
            lots_used += 1
      # Waitlist positions are recomputed once, at the end of the cycle, over
      # every QUEUED / PARTIALLY_FILLED prescription, using the same bucket and
      # within-bucket ordering.
    input_set: |
      Demand: Prescription rows with status IN {QUEUED, PARTIALLY_FILLED} and
      needed_by_date >= clock_date. CANCELLED, EXPIRED and FILLED orders are
      excluded. Supply: MilkLot rows with release_status == RELEASED,
      available_ml > 0 and expiration_date >= clock_date; HOLD, DISCARDED,
      RECALLED, EXPIRED and EXHAUSTED lots are excluded.
    constants:
      NICU_RESERVE_ML: 3000
      MAX_LOTS_PER_PRESCRIPTION_PER_CYCLE: 3
    precision: "Whole millilitres. Each created Dispense is priced independently by dispense_fee_allocation, so the tier read by fill N+1 already includes fill N of the same cycle."
    variants: []
    worked_examples:
      - "one priority_tier 1 order for 1200 ml and one priority_tier 3 order for 500 ml, against a single RELEASED lot with available_ml 3600 of the matching milk_class: tier 1 draws 1200 (lot available_ml -> 2400); tier 3 then sees total_released 2400 and spare max(0, 2400-3000) = 0, so the outpatient order draws nothing and keeps waitlist_position 1."
      - "same demand but total released inventory 4600 ml: tier 1 draws 1200 (-> 3400), tier 3 spare = 400, so the outpatient order draws 400 of its 500 and stays PARTIALLY_FILLED with remaining_ml 100."

# ----------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the first rule that fails determines the response, and no later rule runs)
# ----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID are both present and non-empty on every request."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role names one of the eight roles declared in §1.7."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's `roles:` list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "When X-User-Role == Donor, X-User-ID equals the id of the Donor that owns the addressed resource (Donor.id itself, Shipment.donor_id, Donation.donor_id, HealthHistoryQuestionnaire.donor_id, SerologyPanel.donor_id, PhysicianApproval.donor_id or DeferralEvent.donor_id). Donor-scoped list endpoints are filtered to the acting donor rather than rejected."
    error_id: ERR_DONOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "GET /milk-bank/donors/{id}, GET /milk-bank/donors/{id}/health-history, GET /milk-bank/donors/{id}/serology-panels, GET /milk-bank/donors/{id}/physician-approvals, GET /milk-bank/donors/{id}/deferrals, GET /milk-bank/shipments/{id}, POST /milk-bank/shipments"

  - priority: 5
    category: existence
    check: "Every id referenced by the request exists, validated LEFT TO RIGHT: path parameters first (in path order), then body foreign keys in the order the fields are listed in the endpoint's `input:`. The first missing id wins."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 10
    category: business_referential
    check: "Every required field in the endpoint's `input:` is present, of the declared type, and matches its declared enum set or regex. Unknown and read-only (`source: computed` / `source: system`) fields in the body are ignored, never rejected."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 11
    category: business_referential
    check: "Every numeric and date input lies inside the range declared in §1.1 (for example Donation.volume_ml in 50..1200, TemperatureReading.celsius in 0.0..90.0, PasteurizationRun.cycle_minutes in 30..120, SubsidyProgram.coverage_pct in 0.00..1.00, DeferralEvent.lookback_days in 0..1095), and DeferralEvent.deferral_days == 0 exactly when deferral_type == PERMANENT."
    error_id: ERR_FIELD_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST endpoints"

  - priority: 12
    category: business_referential
    check: "Business codes declared unique in §1.1 are not already taken: Donor.donor_code, Shipment.tracking_code, Pool.pool_code, SubsidyProgram.program_code, Prescription.prescription_code globally, and Donation.container_label within its shipment_id."
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /milk-bank/donors, POST /milk-bank/shipments, POST /milk-bank/shipments/{id}/donations, POST /milk-bank/pools, POST /milk-bank/subsidy-programs, POST /milk-bank/prescriptions"

  - priority: 13
    category: business_temporal
    check: "The requested clock instant is greater than or equal to the current logical clock; the logical clock never moves backwards."
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 409
    applies_to: "POST /milk-bank/_clock/set_current_utc"

  - priority: 20
    category: state
    check: "The addressed Donor is in a state from which the requested transition is declared in §1.2 (health-history requires APPLICANT / SCREENING / INFO_REQUESTED; qualify requires SCREENING; requalify requires TEMPORARILY_DEFERRED; deferrals require SCREENING / INFO_REQUESTED / QUALIFIED / TEMPORARILY_DEFERRED; PERMANENTLY_DEFERRED accepts nothing)."
    error_id: ERR_DONOR_STATE_INVALID
    http_status: 409
    applies_to: "POST /milk-bank/donors/{id}/health-history, POST /milk-bank/donors/{id}/serology-panels, POST /milk-bank/donors/{id}/physician-approvals, POST /milk-bank/donors/{id}/qualify, POST /milk-bank/donors/{id}/requalify, POST /milk-bank/donors/{id}/deferrals"

  - priority: 21
    category: state
    check: "The addressed Shipment is in a state from which the requested transition is declared (receive requires IN_TRANSIT; disposition requires QUARANTINED; logging a donation requires ACCEPTED)."
    error_id: ERR_SHIPMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /milk-bank/shipments/{id}/receive, POST /milk-bank/shipments/{id}/disposition, POST /milk-bank/shipments/{id}/donations"

  - priority: 22
    category: state
    check: "Every Donation referenced as a pool component has status == ELIGIBLE."
    error_id: ERR_DONATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /milk-bank/pools/{id}/components"

  - priority: 23
    category: state
    check: "The addressed Pool is in a state from which the requested transition is declared (adding a component requires DRAFT or BALANCED; commit requires DRAFT or BALANCED, so a DRAFT pool falls through to the specific balance checks at priorities 64-67; scrap requires DRAFT, BALANCED or COMMITTED)."
    error_id: ERR_POOL_STATE_INVALID
    http_status: 409
    applies_to: "POST /milk-bank/pools/{id}/components, POST /milk-bank/pools/{id}/commit, POST /milk-bank/pools/{id}/scrap"

  - priority: 24
    category: state
    check: "The addressed PasteurizationRun is in a state from which the requested transition is declared (readings require SCHEDULED or IN_PROGRESS; complete requires IN_PROGRESS; culture requires COMPLETED or BOTTLED with culture_status == NOT_COLLECTED; bottling requires COMPLETED or BOTTLED with thermal_status == PASSED, so a second lot of the same run is admitted while bottling a thermally FAILED run is reported here and never reaches the volume check at priority 68). Creating a run requires its Pool to be COMMITTED, reported as ERR_POOL_STATE_INVALID instead."
    error_id: ERR_RUN_STATE_INVALID
    http_status: 409
    applies_to: "POST /milk-bank/pasteurization-runs/{id}/readings, POST /milk-bank/pasteurization-runs/{id}/complete, POST /milk-bank/pasteurization-runs/{id}/culture, POST /milk-bank/pasteurization-runs/{id}/lots"

  - priority: 25
    category: state
    check: "The addressed MilkLot is in a state from which the requested operation is declared (release requires HOLD; dispensing requires RELEASED). A date-expired but still RELEASED lot passes this check and is caught later by priority 55."
    error_id: ERR_LOT_STATE_INVALID
    http_status: 409
    applies_to: "POST /milk-bank/milk-lots/{id}/release, POST /milk-bank/prescriptions/{id}/dispenses"

  - priority: 26
    category: state
    check: "The addressed Prescription has status IN {QUEUED, PARTIALLY_FILLED} for a dispense or a cancel."
    error_id: ERR_PRESCRIPTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /milk-bank/prescriptions/{id}/dispenses, POST /milk-bank/prescriptions/{id}/cancel"

  - priority: 27
    category: state
    check: "The addressed Dispense has status == DISPENSED; a VOIDED or RECALLED fill cannot be voided again."
    error_id: ERR_DISPENSE_STATE_INVALID
    http_status: 409
    applies_to: "POST /milk-bank/dispenses/{id}/void"

  - priority: 30
    category: business_referential
    check: "The OCC token in the body equals the current `version` of the parent named by the §1.2.1 rule (expected_shipment_version vs Shipment.version, expected_pool_version vs Pool.version, expected_lot_version vs MilkLot.version). Checked AFTER state preconditions so a stale token against a wrongly-stated parent still reports the state error."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /milk-bank/shipments/{id}/donations, POST /milk-bank/pools/{id}/components, POST /milk-bank/prescriptions/{id}/dispenses"

  - priority: 40
    category: business_safety
    check: "The newest non-superseded HealthHistoryQuestionnaire of the donor has status == ACCEPTED. Qualification cannot proceed while an INFO_REQUESTED or AUTO_DEFERRED questionnaire is the current one, and no questionnaire at all is equally disqualifying."
    error_id: ERR_HEALTH_HISTORY_INCOMPLETE
    http_status: 409
    applies_to: "POST /milk-bank/donors/{id}/qualify"

  - priority: 41
    category: business_safety
    check: "The donor has at least one SerologyPanel with panel_status == NON_REACTIVE and expires_on >= the current clock date."
    error_id: ERR_SEROLOGY_MISSING_OR_EXPIRED
    http_status: 409
    applies_to: "POST /milk-bank/donors/{id}/qualify"

  - priority: 42
    category: business_safety
    check: "The donor has at least one PhysicianApproval with status == ACTIVE and valid_until >= the current clock date."
    error_id: ERR_PHYSICIAN_APPROVAL_MISSING
    http_status: 409
    applies_to: "POST /milk-bank/donors/{id}/qualify"

  - priority: 43
    category: business_safety
    check: "The donor's recomputed surveillance_risk_score is <= RISK_ACCEPT_MAX (60)."
    error_id: ERR_RISK_SCORE_TOO_HIGH
    http_status: 409
    applies_to: "POST /milk-bank/donors/{id}/qualify"

  - priority: 44
    category: business_safety
    check: "The Donor that owns the shipment (for logging a donation) or the donation (for pooling it) has status == QUALIFIED at the moment of the write. Milk from a donor who has since been deferred cannot enter the processing stream."
    error_id: ERR_DONOR_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /milk-bank/shipments, POST /milk-bank/shipments/{id}/donations, POST /milk-bank/pools/{id}/components"

  - priority: 45
    category: business_safety
    check: "No Donation being pooled has an expressed_on inside the closed lookback interval [effective_from - lookback_days, effective_from] of any ACTIVE DeferralEvent of its donor."
    error_id: ERR_DONATION_IN_DEFERRAL_WINDOW
    http_status: 409
    applies_to: "POST /milk-bank/pools/{id}/components"

  - priority: 46
    category: business_safety
    check: "The lot's PasteurizationRun has release_eligibility == ELIGIBLE, i.e. thermal_status == PASSED AND culture_status == PASSED. A run whose culture is still NOT_COLLECTED is not eligible."
    error_id: ERR_RUN_NOT_RELEASE_ELIGIBLE
    http_status: 409
    applies_to: "POST /milk-bank/milk-lots/{id}/release"

  - priority: 47
    category: business_safety
    check: "Segregation of duties on release: X-User-ID differs from both PasteurizationRun.completed_by_user_id and PasteurizationRun.culture_recorded_by_user_id of the lot's run."
    error_id: ERR_SOD_RELEASE_CONFLICT
    http_status: 403
    applies_to: "POST /milk-bank/milk-lots/{id}/release"

  - priority: 48
    category: business_safety
    check: "Segregation of duties on dispensing: X-User-ID differs from Prescription.prescriber_user_id."
    error_id: ERR_SOD_DISPENSE_CONFLICT
    http_status: 403
    applies_to: "POST /milk-bank/prescriptions/{id}/dispenses"

  - priority: 49
    category: business_safety
    check: "When Prescription.requires_preterm_milk is true, the chosen MilkLot.milk_class == PRETERM."
    error_id: ERR_LOT_MILK_CLASS_UNSUITABLE
    http_status: 409
    applies_to: "POST /milk-bank/prescriptions/{id}/dispenses"

  - priority: 50
    category: business_temporal
    check: "The new run's occupied interval [scheduled_start_at, scheduled_start_at + cycle_minutes + PASTEURIZER_CLEANING_BUFFER_MINUTES (15)) does not overlap the occupied interval of any other run on the same pasteurizer_id whose run_status IN {SCHEDULED, IN_PROGRESS, COMPLETED, BOTTLED}. The interval is HALF-OPEN: a run starting exactly at a previous run's buffer end is allowed."
    error_id: ERR_PASTEURIZER_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /milk-bank/pasteurization-runs"

  - priority: 51
    category: business_temporal
    check: "A new TemperatureReading's offset_seconds is strictly greater than the offset_seconds of every existing reading of the same run; equal or lower offsets are rejected."
    error_id: ERR_READING_SEQUENCE_INVALID
    http_status: 409
    applies_to: "POST /milk-bank/pasteurization-runs/{id}/readings"

  - priority: 52
    category: business_temporal
    check: "The run has at least MIN_READINGS_TO_COMPLETE (2) TemperatureReading rows before it may be completed."
    error_id: ERR_RUN_READINGS_INSUFFICIENT
    http_status: 409
    applies_to: "POST /milk-bank/pasteurization-runs/{id}/complete"

  - priority: 53
    category: business_temporal
    check: "The current clock date is strictly greater than Donor.active_deferral_until_date; a donor whose temporary deferral has not yet elapsed cannot be requalified. The bound is exclusive on the last deferred day. A null Donor.active_deferral_until_date satisfies this check vacuously: it means no ACTIVE TEMPORARY deferral remains (a clock sweep already expired the last one), so the requalification proceeds."
    error_id: ERR_DEFERRAL_STILL_ACTIVE
    http_status: 409
    applies_to: "POST /milk-bank/donors/{id}/requalify"

  - priority: 54
    category: business_temporal
    check: "Every Donation being pooled has expressed_on >= current clock date - RAW_MILK_MAX_AGE_DAYS (365); raw milk older than one year cannot enter a pool."
    error_id: ERR_DONOR_MILK_AGE_EXCEEDED
    http_status: 409
    applies_to: "POST /milk-bank/pools/{id}/components"

  - priority: 55
    category: business_temporal
    check: "The chosen MilkLot has expiration_date >= the current clock date."
    error_id: ERR_LOT_EXPIRED
    http_status: 409
    applies_to: "POST /milk-bank/prescriptions/{id}/dispenses"

  - priority: 56
    category: business_temporal
    check: "The prescription's needed_by_date >= the current clock date."
    error_id: ERR_PRESCRIPTION_PAST_NEEDED_BY
    http_status: 409
    applies_to: "POST /milk-bank/prescriptions/{id}/dispenses"

  - priority: 60
    category: business_constraint
    check: "The Donation's milk_class is compatible with Pool.target_milk_class: a PRETERM pool accepts only PRETERM donations, a TERM pool only TERM donations, and a MIXED pool accepts both."
    error_id: ERR_MILK_CLASS_MISMATCH
    http_status: 409
    applies_to: "POST /milk-bank/pools/{id}/components"

  - priority: 61
    category: business_constraint
    check: "The Donation has no existing PoolComponent with status == ALLOCATED in a DIFFERENT pool; a donation may not be committed to two pools at once."
    error_id: ERR_COMPONENT_ALREADY_ALLOCATED
    http_status: 409
    applies_to: "POST /milk-bank/pools/{id}/components"

  - priority: 62
    category: business_constraint
    check: "allocated_volume_ml <= Donation.remaining_ml."
    error_id: ERR_ALLOCATION_EXCEEDS_DONATION_REMAINING
    http_status: 409
    applies_to: "POST /milk-bank/pools/{id}/components"

  - priority: 63
    category: business_constraint
    check: "Adding this component would not push the pool's distinct_donor_count above MAX_DISTINCT_DONORS (5). Adding a second component from a donor already in the pool does not raise the count and is therefore always allowed by this rule."
    error_id: ERR_POOL_DONOR_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /milk-bank/pools/{id}/components"

  - priority: 64
    category: business_constraint
    check: "The pool has at least one PoolComponent with status == ALLOCATED. An empty pool cannot be committed; this rule fires before any nutrition or volume range check so an empty pool never reports a null-kcal range failure."
    error_id: ERR_POOL_EMPTY
    http_status: 409
    applies_to: "POST /milk-bank/pools/{id}/commit"

  - priority: 65
    category: business_constraint
    check: "The pool's distinct_donor_count >= MIN_DISTINCT_DONORS (3)."
    error_id: ERR_POOL_DONOR_COUNT_INSUFFICIENT
    http_status: 409
    applies_to: "POST /milk-bank/pools/{id}/commit"

  - priority: 66
    category: business_constraint
    check: "The pool's projected_kcal_per_oz lies inside the CLOSED range [KCAL_MIN (19.00), KCAL_MAX (21.00)]; exactly 19.00 and exactly 21.00 both pass."
    error_id: ERR_POOL_NUTRITION_OUT_OF_RANGE
    http_status: 409
    applies_to: "POST /milk-bank/pools/{id}/commit"

  - priority: 67
    category: business_constraint
    check: "The pool's total_volume_ml lies inside the CLOSED range [POOL_VOLUME_MIN (1500), POOL_VOLUME_MAX (6000)]."
    error_id: ERR_POOL_VOLUME_OUT_OF_RANGE
    http_status: 409
    applies_to: "POST /milk-bank/pools/{id}/commit"

  - priority: 68
    category: business_constraint
    check: "bottle_count * bottle_volume_ml <= Pool.total_volume_ml - Pool.bottled_volume_ml; a run cannot bottle more milk than its pool holds, counting milk already bottled by earlier lots of the same run."
    error_id: ERR_BOTTLING_EXCEEDS_POOL_VOLUME
    http_status: 409
    applies_to: "POST /milk-bank/pasteurization-runs/{id}/lots"

  - priority: 69
    category: business_constraint
    check: "volume_ml <= Prescription.remaining_ml."
    error_id: ERR_DISPENSE_EXCEEDS_PRESCRIPTION_REMAINING
    http_status: 409
    applies_to: "POST /milk-bank/prescriptions/{id}/dispenses"

  - priority: 70
    category: business_constraint
    check: "volume_ml <= MilkLot.available_ml."
    error_id: ERR_DISPENSE_EXCEEDS_LOT_AVAILABLE
    http_status: 409
    applies_to: "POST /milk-bank/prescriptions/{id}/dispenses"

  - priority: 71
    category: business_constraint
    check: "When the prescription's priority_tier == 3 (outpatient), the total available_ml across all RELEASED MilkLot rows after this fill would still be >= NICU_RESERVE_ML (3000). The reserve is a bank-wide aggregate, so each individual outpatient fill can be small and still be refused."
    error_id: ERR_NICU_RESERVE_PROTECTED
    http_status: 409
    applies_to: "POST /milk-bank/prescriptions/{id}/dispenses"

  - priority: 80
    category: business_fiscal
    check: "When Prescription.subsidy_required is true, the linked SubsidyProgram exists and has status == OPEN."
    error_id: ERR_SUBSIDY_PROGRAM_EXHAUSTED
    http_status: 402
    applies_to: "POST /milk-bank/prescriptions/{id}/dispenses"

  - priority: 81
    category: business_fiscal
    check: "When Prescription.subsidy_required is true, the program has enough headroom to pay the full uncapped subsidy: annual_cap_cents - consumed_cents >= round_half_up(gross_fee_cents * coverage_pct). A partial subsidy is a rejection, not a discount."
    error_id: ERR_SUBSIDY_CAP_EXCEEDED
    http_status: 402
    applies_to: "POST /milk-bank/prescriptions/{id}/dispenses"

# ----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# Every path parameter is spelled literally `{id}`.
# ----------------------------------------------------------------------------
endpoints:

  # --- Donor ----------------------------------------------------------------
  - method: POST
    path: "/milk-bank/donors"
    description: "Enroll a prospective donor. The donor starts in APPLICANT with zero scores and a zero reimbursement ledger."
    roles: [IntakeCoordinator, MilkBankAdmin]
    code: 201
    input: [donor_code, full_name, email, zone_code]
    output: Donor
    side_effects: ["Donor created in APPLICANT with screening_risk_score 0, surveillance_risk_score 0, reimbursement_balance_cents 0, temporary_deferral_count 0, version 1"]

  - method: GET
    path: "/milk-bank/donors"
    description: "List donors, newest first by created_at DESC then donor_code ASC."
    roles: [IntakeCoordinator, MedicalDirector, MilkBankAdmin]
    code: 200
    input: ["status?", "zone_code?", "limit?", "offset?"]
    output: Donor[]
    side_effects: []

  - method: GET
    path: "/milk-bank/donors/{id}"
    description: "Fetch one donor, including both risk scores and the reimbursement ledger."
    roles: [Donor, IntakeCoordinator, MedicalDirector, MilkBankAdmin]
    code: 200
    input: []
    output: Donor
    side_effects: []

  - method: POST
    path: "/milk-bank/donors/{id}/health-history"
    description: "Submit a health-history questionnaire. Recomputes both donor_risk_score variants, triages the questionnaire into ACCEPTED / INFO_REQUESTED / AUTO_DEFERRED, supersedes any previous questionnaire, and may auto-create a TEMPORARY DeferralEvent."
    roles: [IntakeCoordinator]
    code: 201
    input: [medication_flag_count, travel_risk_flag, tobacco_use, alcohol_units_per_week, months_postpartum]
    output: HealthHistoryQuestionnaire
    side_effects:
      - "calculations.donor_risk_score (both variants) -> Donor.screening_risk_score, Donor.surveillance_risk_score, questionnaire.base_risk_points, questionnaire.screening_risk_score"
      - "previous newest questionnaire of the donor -> SUPERSEDED"
      - "Donor state machine APPLICANT/SCREENING/INFO_REQUESTED -> SCREENING | INFO_REQUESTED | TEMPORARILY_DEFERRED"
      - "when screening_risk_score > 85: system DeferralEvent (AUTO_HIGH_RISK, TEMPORARY, 90 days, lookback 0, recall_scope NONE) plus Donor.temporary_deferral_count and Donor.active_deferral_until_date updates and a surveillance rescore"

  - method: GET
    path: "/milk-bank/donors/{id}/health-history"
    description: "List a donor's questionnaires, newest first (created_at DESC, then submitted_at DESC). Reverse-reachability channel for HealthHistoryQuestionnaire.donor_id."
    roles: [Donor, IntakeCoordinator, MedicalDirector, MilkBankAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HealthHistoryQuestionnaire[]
    side_effects: []

  - method: POST
    path: "/milk-bank/donors/{id}/serology-panels"
    description: "Record a five-marker serologic panel. panel_status is REACTIVE if any marker is REACTIVE, else INDETERMINATE if any marker is INDETERMINATE, else NON_REACTIVE. expires_on = collected_on + 180 days. A REACTIVE panel permanently defers the donor and launches the FULL_CHAIN recall cascade."
    roles: [MedicalDirector]
    code: 201
    input: [collected_on, hiv_result, htlv_result, hbv_result, hcv_result, syphilis_result]
    output: SerologyPanel
    side_effects:
      - "panel_status and expires_on computed"
      - "on REACTIVE: Donor -> PERMANENTLY_DEFERRED plus a system DeferralEvent (REACTIVE_SEROLOGY, PERMANENT, lookback_days 365, recall_scope FULL_CHAIN) whose five-hop cascade recalls donations, scraps pools, recalls lots, recalls dispenses and reverses subsidy"
      - "on REACTIVE: DeferralEvent.recalled_donation_count / quarantined_pool_count / recalled_lot_count / recalled_dispense_count / reversed_subsidy_cents stamped"

  - method: GET
    path: "/milk-bank/donors/{id}/serology-panels"
    description: "List a donor's serology panels, collected_on DESC then created_at DESC. Reverse-reachability channel for SerologyPanel.donor_id."
    roles: [Donor, IntakeCoordinator, MedicalDirector, MilkBankAdmin]
    code: 200
    input: ["panel_status?", "limit?", "offset?"]
    output: SerologyPanel[]
    side_effects: []

  - method: POST
    path: "/milk-bank/donors/{id}/physician-approvals"
    description: "Record a physician's written approval. valid_until = approved_on + 365 days; status starts ACTIVE."
    roles: [MedicalDirector]
    code: 201
    input: [physician_npi, approved_on]
    output: PhysicianApproval
    side_effects: ["valid_until computed as approved_on + PHYSICIAN_APPROVAL_VALIDITY_DAYS (365)"]

  - method: GET
    path: "/milk-bank/donors/{id}/physician-approvals"
    description: "List a donor's physician approvals, approved_on DESC then created_at DESC. Reverse-reachability channel for PhysicianApproval.donor_id."
    roles: [Donor, IntakeCoordinator, MedicalDirector, MilkBankAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PhysicianApproval[]
    side_effects: []

  - method: POST
    path: "/milk-bank/donors/{id}/qualify"
    description: "Qualify a screened donor. Enforces the four safety preconditions (accepted questionnaire, unexpired non-reactive serology, active physician approval, surveillance score <= 60) in validation-priority order."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: Donor
    side_effects:
      - "Donor SCREENING -> QUALIFIED"
      - "Donor.qualified_at and Donor.qualified_by_user_id stamped"
      - "Donor.surveillance_risk_score recomputed"

  - method: POST
    path: "/milk-bank/donors/{id}/requalify"
    description: "Return a temporarily deferred donor to SCREENING once the deferral window has elapsed; expires the elapsed deferral events and re-decays the surveillance score."
    roles: [MedicalDirector]
    code: 200
    input: []
    output: Donor
    side_effects:
      - "Donor TEMPORARILY_DEFERRED -> SCREENING"
      - "elapsed ACTIVE TEMPORARY DeferralEvent rows -> EXPIRED"
      - "Donor.active_deferral_until_date cleared; Donor.surveillance_risk_score recomputed"

  - method: POST
    path: "/milk-bank/donors/{id}/deferrals"
    description: "Record a deferral event. recall_scope drives the retrospective recall: NONE recalls nothing, DONATIONS_ONLY stops at donations, FULL_CHAIN propagates five hops through pools, lots, dispenses and the subsidy ledger."
    roles: [MedicalDirector]
    code: 201
    input: [reason_code, deferral_type, effective_from, deferral_days, lookback_days, recall_scope]
    output: DeferralEvent
    side_effects:
      - "Donor -> TEMPORARILY_DEFERRED (TEMPORARY) or PERMANENTLY_DEFERRED (PERMANENT)"
      - "Donor.temporary_deferral_count, Donor.active_deferral_until_date and Donor.surveillance_risk_score updated"
      - "recall cascade over Donation / PoolComponent / Pool / MilkLot / Dispense / SubsidyProgram / Prescription with the five cascade counters stamped on the event"
      - "on reason_code PHYSICIAN_WITHDRAWAL: every ACTIVE PhysicianApproval of the donor -> WITHDRAWN"

  - method: GET
    path: "/milk-bank/donors/{id}/deferrals"
    description: "List a donor's deferral events, effective_from DESC then created_at DESC. Reverse-reachability channel for DeferralEvent.donor_id."
    roles: [Donor, IntakeCoordinator, MedicalDirector, MilkBankAdmin]
    code: 200
    input: ["status?", "deferral_type?", "limit?", "offset?"]
    output: DeferralEvent[]
    side_effects: []

  # --- Shipment / Donation --------------------------------------------------
  - method: POST
    path: "/milk-bank/shipments"
    description: "Register an outbound cooler from a QUALIFIED donor. zone_code is copied from the donor and the PROVISIONAL_AT_DISPATCH reimbursement estimate is computed immediately; nothing is credited yet."
    roles: [Donor, IntakeCoordinator]
    code: 201
    input: [donor_id, tracking_code, container_count, uses_dry_ice, declared_volume_ml, shipped_on]
    output: Shipment
    side_effects:
      - "Shipment.zone_code copied from Donor.zone_code"
      - "calculations.shipment_reimbursement variant PROVISIONAL_AT_DISPATCH -> Shipment.estimated_reimbursement_cents"
      - "Shipment created IN_TRANSIT with version 1"

  - method: GET
    path: "/milk-bank/shipments"
    description: "List shipments, created_at DESC then tracking_code ASC. Reverse-reachability channel for Shipment.donor_id via the donor_id filter."
    roles: [Donor, IntakeCoordinator, MedicalDirector, MilkBankAdmin]
    code: 200
    input: ["donor_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: GET
    path: "/milk-bank/shipments/{id}"
    description: "Fetch one shipment with its reimbursement figures and cold-chain readings."
    roles: [Donor, IntakeCoordinator, MedicalDirector, MilkBankAdmin]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: POST
    path: "/milk-bank/shipments/{id}/receive"
    description: "Receive a cooler and read its data logger. Forks to ACCEPTED, QUARANTINED or REJECTED on the temperature and excursion thresholds, computes the FINAL_AT_RECEIPT reimbursement, and credits the donor ledger at 1x, 0.5x or 0x."
    roles: [IntakeCoordinator]
    code: 200
    input: [excursion_minutes, arrival_max_temp_celsius, verified_volume_ml]
    output: Shipment
    side_effects:
      - "Shipment IN_TRANSIT -> ACCEPTED | QUARANTINED | REJECTED"
      - "calculations.shipment_reimbursement variant FINAL_AT_RECEIPT -> Shipment.final_reimbursement_cents"
      - "Shipment.credited_reimbursement_cents set from the branch factor; Donor.reimbursement_balance_cents credited; Donor.version incremented"

  - method: POST
    path: "/milk-bank/shipments/{id}/disposition"
    description: "Medical-director disposition of a quarantined cooler. ACCEPT tops the donor ledger up to the full final reimbursement; REJECT debits the partial credit back and discards the cooler's donations."
    roles: [MedicalDirector]
    code: 200
    input: [disposition]
    output: Shipment
    side_effects:
      - "Shipment QUARANTINED -> ACCEPTED | REJECTED"
      - "Donor.reimbursement_balance_cents adjusted by the delta (never double-credited)"
      - "on REJECT: every ELIGIBLE Donation of the shipment -> DISCARDED"

  - method: POST
    path: "/milk-bank/shipments/{id}/donations"
    description: "Log one container from an accepted cooler. Requires the OCC token for the parent shipment."
    roles: [IntakeCoordinator]
    code: 201
    input: [container_label, expressed_on, volume_ml, kcal_per_oz, milk_class, expected_shipment_version]
    output: Donation
    side_effects:
      - "Donation created ELIGIBLE with remaining_ml = volume_ml and donor_id copied from the shipment"
      - "Donor.lifetime_accepted_volume_ml increased; Donor.version incremented"
      - "Shipment.version incremented"

  - method: GET
    path: "/milk-bank/donations"
    description: "List donations, created_at DESC then container_label ASC. Reverse-reachability channel for both Donation.donor_id and Donation.shipment_id."
    roles: [IntakeCoordinator, MedicalDirector, ProcessingTechnician, MilkBankAdmin]
    code: 200
    input: ["donor_id?", "shipment_id?", "status?", "milk_class?", "limit?", "offset?"]
    output: Donation[]
    side_effects: []

  - method: GET
    path: "/milk-bank/donations/{id}"
    description: "Fetch one donation with its remaining unallocated volume."
    roles: [IntakeCoordinator, MedicalDirector, ProcessingTechnician, MilkBankAdmin]
    code: 200
    input: []
    output: Donation
    side_effects: []

  - method: GET
    path: "/milk-bank/donations/{id}/pool-components"
    description: "List every pool component drawn from this donation, created_at ASC. Reverse-reachability channel for PoolComponent.donation_id."
    roles: [ProcessingTechnician, QualityAssuranceOfficer, MedicalDirector, MilkBankAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PoolComponent[]
    side_effects: []

  # --- Pool -----------------------------------------------------------------
  - method: POST
    path: "/milk-bank/pools"
    description: "Open a new pool. pool_sequence is 1 + the count of existing pools, and feeds the deterministic lot_code of every lot bottled from this pool."
    roles: [ProcessingTechnician]
    code: 201
    input: [pool_code, target_milk_class]
    output: Pool
    side_effects: ["Pool created DRAFT with pool_sequence assigned, distinct_donor_count 0, total_volume_ml 0, projected_kcal_per_oz null, bottled_volume_ml 0, version 1"]

  - method: GET
    path: "/milk-bank/pools"
    description: "List pools, created_at DESC then pool_code ASC."
    roles: [ProcessingTechnician, QualityAssuranceOfficer, MilkBankAdmin]
    code: 200
    input: ["status?", "target_milk_class?", "limit?", "offset?"]
    output: Pool[]
    side_effects: []

  - method: GET
    path: "/milk-bank/pools/{id}"
    description: "Fetch one pool with its live nutrition projection and donor spread."
    roles: [ProcessingTechnician, QualityAssuranceOfficer, MedicalDirector, MilkBankAdmin]
    code: 200
    input: []
    output: Pool
    side_effects: []

  - method: POST
    path: "/milk-bank/pools/{id}/components"
    description: "Draw volume from an eligible donation into the pool. Recomputes the pool's nutrition projection and flips it between DRAFT and BALANCED. Requires the OCC token for the parent pool."
    roles: [ProcessingTechnician]
    code: 201
    input: [donation_id, allocated_volume_ml, expected_pool_version]
    output: PoolComponent
    side_effects:
      - "PoolComponent created ALLOCATED with component_kcal_per_oz and component_donor_id frozen from the donation"
      - "Donation.remaining_ml debited; Donation -> ALLOCATED when remaining_ml reaches 0; Donation.version incremented"
      - "calculations.pool_projected_kcal_per_oz -> Pool.distinct_donor_count, Pool.total_volume_ml, Pool.projected_kcal_per_oz"
      - "Pool DRAFT <-> BALANCED re-evaluated; Pool.version incremented"

  - method: GET
    path: "/milk-bank/pools/{id}/components"
    description: "List the pool's components, created_at ASC. Reverse-reachability channel for PoolComponent.pool_id."
    roles: [ProcessingTechnician, QualityAssuranceOfficer, MedicalDirector, MilkBankAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PoolComponent[]
    side_effects: []

  - method: POST
    path: "/milk-bank/pools/{id}/commit"
    description: "Freeze a balanced pool for pasteurization. The state gate admits DRAFT as well as BALANCED so that an unbalanced pool reports the specific empty-pool, donor-count, nutrition-range or volume-range failure instead of a generic state error; those four constraints are enforced in that priority order."
    roles: [ProcessingTechnician]
    code: 200
    input: []
    output: Pool
    side_effects:
      - "Pool BALANCED -> COMMITTED (a DRAFT pool always fails at least one of the four balance constraints and therefore never reaches COMMITTED)"
      - "Pool.committed_at and Pool.committed_by_user_id stamped"

  - method: POST
    path: "/milk-bank/pools/{id}/scrap"
    description: "Scrap a pool and return its milk. Voids every ALLOCATED component, credits the volume back to each donation, and voids any scheduled or in-progress run so the pasteurizer slot is freed."
    roles: [ProcessingTechnician, QualityAssuranceOfficer]
    code: 200
    input: []
    output: Pool
    side_effects:
      - "Pool {DRAFT, BALANCED, COMMITTED} -> SCRAPPED"
      - "every ALLOCATED PoolComponent -> VOIDED; Donation.remaining_ml credited back; ALLOCATED Donation -> ELIGIBLE"
      - "Pool.distinct_donor_count, Pool.total_volume_ml, Pool.projected_kcal_per_oz recomputed (null kcal when no component remains)"
      - "PasteurizationRun {SCHEDULED, IN_PROGRESS} of the pool -> VOIDED, releasing its pasteurizer interval"

  # --- Pasteurization -------------------------------------------------------
  - method: POST
    path: "/milk-bank/pasteurization-runs"
    description: "Schedule a run for a committed pool on a named pasteurizer. Enforces the half-open interval [start, start + cycle_minutes + 15 min) against every other live run on the same pasteurizer."
    roles: [ProcessingTechnician]
    code: 201
    input: [pool_id, pasteurizer_id, scheduled_start_at, cycle_minutes]
    output: PasteurizationRun
    side_effects: ["PasteurizationRun created SCHEDULED with thermal_status PENDING, culture_status NOT_COLLECTED, release_eligibility BLOCKED, reading_count 0, version 1"]

  - method: GET
    path: "/milk-bank/pasteurization-runs"
    description: "List runs, scheduled_start_at ASC then created_at ASC. Reverse-reachability channel for PasteurizationRun.pool_id via the pool_id filter."
    roles: [ProcessingTechnician, QualityAssuranceOfficer, MilkBankAdmin]
    code: 200
    input: ["pool_id?", "run_status?", "pasteurizer_id?", "limit?", "offset?"]
    output: PasteurizationRun[]
    side_effects: []

  - method: GET
    path: "/milk-bank/pasteurization-runs/{id}"
    description: "Fetch one run with all three state dimensions and the derived release_eligibility."
    roles: [ProcessingTechnician, QualityAssuranceOfficer, MedicalDirector, MilkBankAdmin]
    code: 200
    input: []
    output: PasteurizationRun
    side_effects: []

  - method: POST
    path: "/milk-bank/pasteurization-runs/{id}/readings"
    description: "Append a chart reading. offset_seconds must be strictly greater than every existing reading of the run; the first reading starts the run."
    roles: [ProcessingTechnician]
    code: 201
    input: [offset_seconds, celsius]
    output: TemperatureReading
    side_effects:
      - "TemperatureReading created with qualifies = (62.5 <= celsius <= 65.0)"
      - "PasteurizationRun SCHEDULED -> IN_PROGRESS on the first reading"
      - "PasteurizationRun.reading_count incremented and peak_celsius refreshed"

  - method: GET
    path: "/milk-bank/pasteurization-runs/{id}/readings"
    description: "List the run's readings, offset_seconds ASC. Reverse-reachability channel for TemperatureReading.run_id."
    roles: [ProcessingTechnician, QualityAssuranceOfficer, MilkBankAdmin]
    code: 200
    input: ["qualifies?", "limit?", "offset?"]
    output: TemperatureReading[]
    side_effects: []

  - method: POST
    path: "/milk-bank/pasteurization-runs/{id}/complete"
    description: "Close the thermal phase. Runs the hold verification over the reading curve and sets thermal_status independently of run_status."
    roles: [ProcessingTechnician]
    code: 200
    input: []
    output: PasteurizationRun
    side_effects:
      - "PasteurizationRun IN_PROGRESS -> COMPLETED"
      - "calculations.thermal_hold_verification -> longest_hold_seconds, peak_celsius, thermal_status PASSED | FAILED"
      - "completed_at and completed_by_user_id stamped; release_eligibility recomputed"

  - method: POST
    path: "/milk-bank/pasteurization-runs/{id}/culture"
    description: "Record the post-pasteurization culture. A failing culture blocks release and runs the four-hop destruction cascade over lots, the pool, its components and their donations."
    roles: [QualityAssuranceOfficer]
    code: 200
    input: [culture_cfu_per_ml, culture_organism]
    output: PasteurizationRun
    side_effects:
      - "culture_status NOT_COLLECTED -> PASSED | FAILED on the CULTURE_FAIL_CFU (10) threshold"
      - "culture_cfu_per_ml, culture_organism and culture_recorded_by_user_id stamped; release_eligibility recomputed"
      - "on FAILED: every MilkLot of the run -> DISCARDED, the Pool -> SCRAPPED_CULTURE, its components -> CONSUMED_LOST, their donations -> DISCARDED, and fully terminal Shipments bubble up to CLOSED"

  - method: POST
    path: "/milk-bank/pasteurization-runs/{id}/lots"
    description: "Bottle a lot from a thermally passed run. Assigns the deterministic lot_code, the three-ceiling expiration date and the frozen nutrition value, and consumes the pool."
    roles: [ProcessingTechnician]
    code: 201
    input: [bottle_count, bottle_volume_ml]
    output: MilkLot
    side_effects:
      - "calculations.lot_expiration_date -> MilkLot.expiration_date, lot_code, lot_sequence"
      - "MilkLot created HOLD with total_volume_ml = bottle_count * bottle_volume_ml, dispensed_ml 0, available_ml = total_volume_ml, kcal_per_oz and milk_class frozen from the pool"
      - "PasteurizationRun COMPLETED -> BOTTLED"
      - "Pool COMMITTED -> PASTEURIZED, components -> CONSUMED_PASTEURIZED, fully consumed Donations -> PASTEURIZED, Pool.bottled_volume_ml increased"

  # --- MilkLot --------------------------------------------------------------
  - method: GET
    path: "/milk-bank/milk-lots"
    description: "List lots, expiration_date ASC then lot_code ASC. Reverse-reachability channel for MilkLot.run_id via the run_id filter."
    roles: [QualityAssuranceOfficer, DispensingPharmacist, ProcessingTechnician, MilkBankAdmin]
    code: 200
    input: ["run_id?", "release_status?", "milk_class?", "limit?", "offset?"]
    output: MilkLot[]
    side_effects: []

  - method: GET
    path: "/milk-bank/milk-lots/{id}"
    description: "Fetch one lot with its live available volume and release posture."
    roles: [QualityAssuranceOfficer, DispensingPharmacist, ProcessingTechnician, MedicalDirector, MilkBankAdmin]
    code: 200
    input: []
    output: MilkLot
    side_effects: []

  - method: GET
    path: "/milk-bank/milk-lots/{id}/dispenses"
    description: "List every fill drawn from this lot, created_at ASC. Reverse-reachability channel for Dispense.lot_id."
    roles: [DispensingPharmacist, QualityAssuranceOfficer, MedicalDirector, MilkBankAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Dispense[]
    side_effects: []

  - method: POST
    path: "/milk-bank/milk-lots/{id}/release"
    description: "Release a lot to inventory. Requires the run to be release-eligible on both dimensions and enforces segregation of duties against the technician who completed the run and the officer who recorded the culture."
    roles: [QualityAssuranceOfficer]
    code: 200
    input: []
    output: MilkLot
    side_effects:
      - "MilkLot HOLD -> RELEASED"
      - "released_at and released_by_user_id stamped"

  # --- Subsidy / Prescription / Dispense ------------------------------------
  - method: POST
    path: "/milk-bank/subsidy-programs"
    description: "Create a charitable subsidy program with a coverage fraction and an annual cap."
    roles: [MilkBankAdmin]
    code: 201
    input: [program_code, name, coverage_pct, annual_cap_cents]
    output: SubsidyProgram
    side_effects: ["SubsidyProgram created OPEN with consumed_cents 0 and version 1"]

  - method: GET
    path: "/milk-bank/subsidy-programs/{id}"
    description: "Fetch one subsidy program with its live consumed_cents ledger."
    roles: [MilkBankAdmin, DispensingPharmacist, MedicalDirector]
    code: 200
    input: []
    output: SubsidyProgram
    side_effects: []

  - method: POST
    path: "/milk-bank/prescriptions"
    description: "Submit a prescription. priority_tier is derived from patient_type and clinical_acuity, and waitlist_position is assigned within the tier bucket."
    roles: [Prescriber]
    code: 201
    input: [prescription_code, "subsidy_program_id?", patient_reference, patient_type, clinical_acuity, "requires_preterm_milk?", "subsidy_required?", prescribed_ml, needed_by_date]
    output: Prescription
    side_effects:
      - "priority_tier computed from (patient_type, clinical_acuity)"
      - "Prescription created QUEUED with cumulative_dispensed_ml 0, remaining_ml = prescribed_ml, prescriber_user_id stamped, version 1"
      - "waitlist_position recomputed for every QUEUED / PARTIALLY_FILLED prescription in the same priority_tier bucket"

  - method: GET
    path: "/milk-bank/prescriptions"
    description: "List prescriptions, priority_tier ASC then created_at ASC then prescription_code ASC. Reverse-reachability channel for Prescription.subsidy_program_id via the subsidy_program_id filter."
    roles: [Prescriber, DispensingPharmacist, MilkBankAdmin]
    code: 200
    input: ["subsidy_program_id?", "status?", "priority_tier?", "limit?", "offset?"]
    output: Prescription[]
    side_effects: []

  - method: GET
    path: "/milk-bank/prescriptions/{id}"
    description: "Fetch one prescription with its fill ledger and waitlist position."
    roles: [Prescriber, DispensingPharmacist, MedicalDirector, MilkBankAdmin]
    code: 200
    input: []
    output: Prescription
    side_effects: []

  - method: GET
    path: "/milk-bank/prescriptions/{id}/dispenses"
    description: "List the fills against this prescription, created_at ASC. Reverse-reachability channel for Dispense.prescription_id."
    roles: [Prescriber, DispensingPharmacist, MedicalDirector, MilkBankAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Dispense[]
    side_effects: []

  - method: POST
    path: "/milk-bank/prescriptions/{id}/dispenses"
    description: "Fill a prescription from a released lot. Prices the fill through the nine-step fee allocation, charges the subsidy program, and requires the OCC token for the parent lot."
    roles: [DispensingPharmacist]
    code: 201
    input: [lot_id, volume_ml, expected_lot_version]
    output: Dispense
    side_effects:
      - "calculations.dispense_fee_allocation -> Dispense.tier_discount_pct, gross_fee_cents, subsidy_cents, payer_due_cents"
      - "MilkLot.dispensed_ml increased, available_ml lowered, RELEASED -> EXHAUSTED at zero; MilkLot.version incremented"
      - "SubsidyProgram.consumed_cents increased, OPEN -> EXHAUSTED at the cap; SubsidyProgram.version incremented"
      - "Prescription.cumulative_dispensed_ml / remaining_ml updated, QUEUED -> PARTIALLY_FILLED -> FILLED, waitlist positions recomputed for the tier bucket"

  - method: POST
    path: "/milk-bank/prescriptions/{id}/cancel"
    description: "Cancel an unfilled or partially filled prescription. Only the prescriber who submitted it may cancel it."
    roles: [Prescriber]
    code: 200
    input: []
    output: Prescription
    side_effects:
      - "Prescription {QUEUED, PARTIALLY_FILLED} -> CANCELLED"
      - "waitlist_position cleared and the tier bucket's positions recomputed"

  - method: POST
    path: "/milk-bank/dispenses/{id}/void"
    description: "Compensating reversal of a fill: returns volume to the lot, credits the subsidy back, and re-opens the prescription. The fee figures are retained on the row for audit."
    roles: [DispensingPharmacist]
    code: 200
    input: []
    output: Dispense
    side_effects:
      - "Dispense DISPENSED -> VOIDED"
      - "MilkLot.dispensed_ml credited back, available_ml raised, EXHAUSTED -> RELEASED when volume returns"
      - "SubsidyProgram.consumed_cents credited back, EXHAUSTED -> OPEN when it drops below the cap"
      - "Prescription.cumulative_dispensed_ml lowered, FILLED -> PARTIALLY_FILLED | QUEUED, waitlist positions recomputed"

  - method: POST
    path: "/milk-bank/allocation-cycles"
    description: "Run one allocation cycle over the whole waitlist: drains priority tier 1, then 2, then 3, honoring the bank-wide NICU reserve and the per-prescription lot cap, and creating a priced Dispense for every draw."
    roles: [DispensingPharmacist, MilkBankAdmin]
    code: 200
    input: []
    output: null
    side_effects:
      - "calculations.allocation_cycle_waterfall creates Dispense rows in strict tier and within-tier order"
      - "every created fill applies the full POST /milk-bank/prescriptions/{id}/dispenses side-effect set"
      - "Dispense.allocation_cycle_sequence stamped with the monotonic cycle counter"
      - "waitlist_position recomputed once at the end of the cycle over every QUEUED / PARTIALLY_FILLED prescription"

  # --- Test-driving endpoint ------------------------------------------------
  - method: POST
    path: "/milk-bank/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time; the clock never moves backwards. Advancing it sweeps expirable rows."
    roles: [MilkBankAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "every PhysicianApproval with status ACTIVE and valid_until < the new clock date -> EXPIRED"
      - "every MilkLot with release_status == HOLD and expiration_date < the new clock date -> EXPIRED; RELEASED and EXHAUSTED lots are left untouched and are refused at fill time instead"
      - "every Prescription with status IN {QUEUED, PARTIALLY_FILLED} and needed_by_date < the new clock date -> EXPIRED, with waitlist positions recomputed"
      - "every ACTIVE TEMPORARY DeferralEvent whose effective_from + deferral_days < the new clock date -> EXPIRED, after which Donor.active_deferral_until_date is recomputed from the donor's remaining ACTIVE TEMPORARY deferrals"

# ----------------------------------------------------------------------------
# §1.6 Error Code Catalog (49 codes; every code is reachable from §1.5)
# ----------------------------------------------------------------------------
errors:

  # --- auth ---
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID missing or empty."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the eight declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_DONOR_SCOPE_VIOLATION
    http: 403
    condition: "A Donor acts on a resource owned by a different donor."

  # --- existence ---
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path id or body foreign key names no existing row; the leftmost missing reference wins."

  # --- input shape ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "A required input field is missing, of the wrong type, or outside its enum / regex."
  - id: ERR_FIELD_OUT_OF_RANGE
    http: 422
    condition: "A numeric or date input violates its declared range, or deferral_days disagrees with deferral_type."
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "donor_code, tracking_code, pool_code, program_code or prescription_code already exists, or container_label repeats within its shipment."

  # --- state ---
  - id: ERR_DONOR_STATE_INVALID
    http: 409
    condition: "The donor's status does not permit the requested transition."
  - id: ERR_SHIPMENT_STATE_INVALID
    http: 409
    condition: "The shipment's status does not permit receiving, dispositioning or logging a donation."
  - id: ERR_DONATION_STATE_INVALID
    http: 409
    condition: "A donation being pooled is not ELIGIBLE."
  - id: ERR_POOL_STATE_INVALID
    http: 409
    condition: "The pool's status does not permit adding a component, committing, scrapping, or being scheduled for a run."
  - id: ERR_RUN_STATE_INVALID
    http: 409
    condition: "The run's run_status or culture_status does not permit readings, completion, culture recording or bottling."
  - id: ERR_LOT_STATE_INVALID
    http: 409
    condition: "The lot is not HOLD for a release, or not RELEASED for a dispense."
  - id: ERR_PRESCRIPTION_STATE_INVALID
    http: 409
    condition: "The prescription is not QUEUED or PARTIALLY_FILLED."
  - id: ERR_DISPENSE_STATE_INVALID
    http: 409
    condition: "The dispense is already VOIDED or RECALLED."

  # --- optimistic concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_shipment_version, expected_pool_version or expected_lot_version does not equal the parent's current version."

  # --- business safety / compliance ---
  - id: ERR_HEALTH_HISTORY_INCOMPLETE
    http: 409
    condition: "The donor's newest questionnaire is missing or is not ACCEPTED at qualification."
  - id: ERR_SEROLOGY_MISSING_OR_EXPIRED
    http: 409
    condition: "No NON_REACTIVE serology panel with expires_on on or after the clock date exists at qualification."
  - id: ERR_PHYSICIAN_APPROVAL_MISSING
    http: 409
    condition: "No ACTIVE physician approval with valid_until on or after the clock date exists at qualification."
  - id: ERR_RISK_SCORE_TOO_HIGH
    http: 409
    condition: "The donor's recomputed surveillance_risk_score exceeds RISK_ACCEPT_MAX (60) at qualification."
  - id: ERR_DONOR_NOT_QUALIFIED
    http: 409
    condition: "The owning donor is not QUALIFIED when a shipment is registered, a donation logged, or a donation pooled."
  - id: ERR_DONATION_IN_DEFERRAL_WINDOW
    http: 409
    condition: "A donation's expressed_on falls inside the closed lookback interval of an ACTIVE deferral of its donor."
  - id: ERR_RUN_NOT_RELEASE_ELIGIBLE
    http: 409
    condition: "The lot's run is not ELIGIBLE on both thermal_status and culture_status."
  - id: ERR_SOD_RELEASE_CONFLICT
    http: 403
    condition: "The releasing user also completed the run or recorded its culture."
  - id: ERR_SOD_DISPENSE_CONFLICT
    http: 403
    condition: "The dispensing user is the prescription's own prescriber."
  - id: ERR_LOT_MILK_CLASS_UNSUITABLE
    http: 409
    condition: "A prescription requiring preterm milk is filled from a non-PRETERM lot."

  # --- business temporal ---
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 409
    condition: "The requested logical clock instant precedes the current clock."
  - id: ERR_PASTEURIZER_SLOT_CONFLICT
    http: 409
    condition: "The new run's half-open interval, cleaning buffer included, overlaps a live run on the same pasteurizer."
  - id: ERR_READING_SEQUENCE_INVALID
    http: 409
    condition: "A reading's offset_seconds is not strictly greater than every existing reading of the run."
  - id: ERR_RUN_READINGS_INSUFFICIENT
    http: 409
    condition: "A run is completed with fewer than MIN_READINGS_TO_COMPLETE (2) readings."
  - id: ERR_DEFERRAL_STILL_ACTIVE
    http: 409
    condition: "Requalification is attempted on or before Donor.active_deferral_until_date."
  - id: ERR_DONOR_MILK_AGE_EXCEEDED
    http: 409
    condition: "A donation older than RAW_MILK_MAX_AGE_DAYS (365) is pooled."
  - id: ERR_LOT_EXPIRED
    http: 409
    condition: "The chosen lot's expiration_date precedes the clock date."
  - id: ERR_PRESCRIPTION_PAST_NEEDED_BY
    http: 409
    condition: "The prescription's needed_by_date precedes the clock date at fill time."

  # --- business constraint ---
  - id: ERR_MILK_CLASS_MISMATCH
    http: 409
    condition: "The donation's milk_class is incompatible with the pool's target_milk_class."
  - id: ERR_COMPONENT_ALREADY_ALLOCATED
    http: 409
    condition: "The donation already has an ALLOCATED component in a different pool."
  - id: ERR_ALLOCATION_EXCEEDS_DONATION_REMAINING
    http: 409
    condition: "allocated_volume_ml exceeds the donation's remaining_ml."
  - id: ERR_POOL_DONOR_CAP_EXCEEDED
    http: 409
    condition: "The component would raise the pool's distinct_donor_count above MAX_DISTINCT_DONORS (5)."
  - id: ERR_POOL_EMPTY
    http: 409
    condition: "A pool with no ALLOCATED component is committed."
  - id: ERR_POOL_DONOR_COUNT_INSUFFICIENT
    http: 409
    condition: "A pool with fewer than MIN_DISTINCT_DONORS (3) distinct donors is committed."
  - id: ERR_POOL_NUTRITION_OUT_OF_RANGE
    http: 409
    condition: "projected_kcal_per_oz falls outside the closed range [19.00, 21.00] at commit."
  - id: ERR_POOL_VOLUME_OUT_OF_RANGE
    http: 409
    condition: "total_volume_ml falls outside the closed range [1500, 6000] at commit."
  - id: ERR_BOTTLING_EXCEEDS_POOL_VOLUME
    http: 409
    condition: "bottle_count * bottle_volume_ml exceeds the pool's unbottled volume."
  - id: ERR_DISPENSE_EXCEEDS_PRESCRIPTION_REMAINING
    http: 409
    condition: "volume_ml exceeds the prescription's remaining_ml."
  - id: ERR_DISPENSE_EXCEEDS_LOT_AVAILABLE
    http: 409
    condition: "volume_ml exceeds the lot's available_ml."
  - id: ERR_NICU_RESERVE_PROTECTED
    http: 409
    condition: "An outpatient fill would drop bank-wide released inventory below NICU_RESERVE_ML (3000)."

  # --- business fiscal ---
  - id: ERR_SUBSIDY_PROGRAM_EXHAUSTED
    http: 402
    condition: "A prescription with subsidy_required true is filled while its program is missing or EXHAUSTED."
  - id: ERR_SUBSIDY_CAP_EXCEEDED
    http: 402
    condition: "A prescription with subsidy_required true is filled when the program cannot pay the full uncapped subsidy."

# ----------------------------------------------------------------------------
# §1.7 RBAC Matrix (segregation of duties)
# ----------------------------------------------------------------------------
roles:

  - name: Donor
    description: "A milk donor acting on her own record: reads her qualification file and registers her own coolers."
    identity: "entity_backed:Donor"
    exclusive_operations: []
    shared_operations:
      - "POST /milk-bank/shipments (only with donor_id equal to X-User-ID)"
      - "GET /milk-bank/donors/{id} (own record only)"
      - "GET /milk-bank/donors/{id}/health-history, /serology-panels, /physician-approvals, /deferrals (own records only)"
      - "GET /milk-bank/shipments, GET /milk-bank/shipments/{id} (own shipments only)"

  - name: IntakeCoordinator
    description: "Enrolls donors, takes health histories, and receives and logs incoming coolers."
    identity: opaque
    exclusive_operations:
      - "POST /milk-bank/donors/{id}/health-history"
      - "POST /milk-bank/shipments/{id}/receive"
      - "POST /milk-bank/shipments/{id}/donations"
    shared_operations:
      - "POST /milk-bank/donors"
      - "GET /milk-bank/donors, GET /milk-bank/donors/{id} and the four donor sub-resource lists"
      - "POST /milk-bank/shipments"
      - "GET /milk-bank/shipments, GET /milk-bank/shipments/{id}, GET /milk-bank/donations, GET /milk-bank/donations/{id}"

  - name: MedicalDirector
    description: "Owns clinical eligibility: serology, physician approvals, qualification, deferrals and quarantine disposition."
    identity: opaque
    exclusive_operations:
      - "POST /milk-bank/donors/{id}/serology-panels"
      - "POST /milk-bank/donors/{id}/physician-approvals"
      - "POST /milk-bank/donors/{id}/qualify"
      - "POST /milk-bank/donors/{id}/requalify"
      - "POST /milk-bank/donors/{id}/deferrals"
      - "POST /milk-bank/shipments/{id}/disposition"
    shared_operations:
      - "GET /milk-bank/donors, GET /milk-bank/donors/{id} and the four donor sub-resource lists"
      - "GET /milk-bank/shipments/{id}, GET /milk-bank/donations, GET /milk-bank/donations/{id}, GET /milk-bank/donations/{id}/pool-components"
      - "GET /milk-bank/pools/{id}, GET /milk-bank/pools/{id}/components, GET /milk-bank/pasteurization-runs/{id}"
      - "GET /milk-bank/milk-lots/{id}, GET /milk-bank/milk-lots/{id}/dispenses, GET /milk-bank/subsidy-programs/{id}"
      - "GET /milk-bank/prescriptions/{id}, GET /milk-bank/prescriptions/{id}/dispenses"

  - name: ProcessingTechnician
    description: "Builds pools, schedules and runs the pasteurizer, and bottles lots. May never release a lot he processed."
    identity: opaque
    exclusive_operations:
      - "POST /milk-bank/pools"
      - "POST /milk-bank/pools/{id}/components"
      - "POST /milk-bank/pools/{id}/commit"
      - "POST /milk-bank/pasteurization-runs"
      - "POST /milk-bank/pasteurization-runs/{id}/readings"
      - "POST /milk-bank/pasteurization-runs/{id}/complete"
      - "POST /milk-bank/pasteurization-runs/{id}/lots"
    shared_operations:
      - "POST /milk-bank/pools/{id}/scrap"
      - "GET /milk-bank/donations, GET /milk-bank/donations/{id}, GET /milk-bank/donations/{id}/pool-components"
      - "GET /milk-bank/pools, GET /milk-bank/pools/{id}, GET /milk-bank/pools/{id}/components"
      - "GET /milk-bank/pasteurization-runs, GET /milk-bank/pasteurization-runs/{id}, GET /milk-bank/pasteurization-runs/{id}/readings"
      - "GET /milk-bank/milk-lots, GET /milk-bank/milk-lots/{id}"

  - name: QualityAssuranceOfficer
    description: "Records post-pasteurization cultures and releases lots to inventory. The officer who recorded a run's culture may not release that run's lots."
    identity: opaque
    exclusive_operations:
      - "POST /milk-bank/pasteurization-runs/{id}/culture"
      - "POST /milk-bank/milk-lots/{id}/release"
    shared_operations:
      - "POST /milk-bank/pools/{id}/scrap"
      - "GET /milk-bank/pools, GET /milk-bank/pools/{id}, GET /milk-bank/pools/{id}/components, GET /milk-bank/donations/{id}/pool-components"
      - "GET /milk-bank/pasteurization-runs, GET /milk-bank/pasteurization-runs/{id}, GET /milk-bank/pasteurization-runs/{id}/readings"
      - "GET /milk-bank/milk-lots, GET /milk-bank/milk-lots/{id}, GET /milk-bank/milk-lots/{id}/dispenses"

  - name: DispensingPharmacist
    description: "Fills prescriptions from released lots, voids incorrect fills, and runs allocation cycles. May never fill a prescription she wrote."
    identity: opaque
    exclusive_operations:
      - "POST /milk-bank/prescriptions/{id}/dispenses"
      - "POST /milk-bank/dispenses/{id}/void"
    shared_operations:
      - "POST /milk-bank/allocation-cycles"
      - "GET /milk-bank/milk-lots, GET /milk-bank/milk-lots/{id}, GET /milk-bank/milk-lots/{id}/dispenses"
      - "GET /milk-bank/prescriptions, GET /milk-bank/prescriptions/{id}, GET /milk-bank/prescriptions/{id}/dispenses"
      - "GET /milk-bank/subsidy-programs/{id}"

  - name: Prescriber
    description: "Hospital NICU or outpatient clinician who submits and cancels prescriptions. Cannot dispense."
    identity: opaque
    exclusive_operations:
      - "POST /milk-bank/prescriptions"
      - "POST /milk-bank/prescriptions/{id}/cancel"
    shared_operations:
      - "GET /milk-bank/prescriptions, GET /milk-bank/prescriptions/{id}, GET /milk-bank/prescriptions/{id}/dispenses"

  - name: MilkBankAdmin
    description: "Operational administrator: subsidy programs, allocation cycles, the logical clock, and read access across the bank. Holds no clinical or processing authority."
    identity: opaque
    exclusive_operations:
      - "POST /milk-bank/subsidy-programs"
      - "POST /milk-bank/_clock/set_current_utc"
    shared_operations:
      - "POST /milk-bank/donors"
      - "POST /milk-bank/allocation-cycles"
      - "GET /milk-bank/donors, GET /milk-bank/donors/{id} and the four donor sub-resource lists"
      - "GET /milk-bank/shipments, GET /milk-bank/shipments/{id}, GET /milk-bank/donations, GET /milk-bank/donations/{id}, GET /milk-bank/donations/{id}/pool-components"
      - "GET /milk-bank/pools, GET /milk-bank/pools/{id}, GET /milk-bank/pools/{id}/components"
      - "GET /milk-bank/pasteurization-runs, GET /milk-bank/pasteurization-runs/{id}, GET /milk-bank/pasteurization-runs/{id}/readings"
      - "GET /milk-bank/milk-lots, GET /milk-bank/milk-lots/{id}, GET /milk-bank/milk-lots/{id}/dispenses, GET /milk-bank/subsidy-programs/{id}"
      - "GET /milk-bank/prescriptions, GET /milk-bank/prescriptions/{id}, GET /milk-bank/prescriptions/{id}/dispenses"
