              as: ChannelManager
            - call: "POST /customers"
              payload: { name: "Exact Credit", tier: "SMALL", channel: "DIRECT_ONLINE", credit_limit_cents: 8900 }
              as: ChannelManager
              captures: { v9_cust: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${v9_cust}", lines: [{ part_id: "${v9_part}", quantity: 40 }] }
              as: Customer
              as_user_id: "${v9_cust}"
