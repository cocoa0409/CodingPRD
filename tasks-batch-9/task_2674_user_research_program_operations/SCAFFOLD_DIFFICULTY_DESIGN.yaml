  - rule_id: transitive_cascade
    instances:
      - name: consent_revocation_five_hop_evidence_withdrawal
        grounds:
          - state_machines.ConsentRecord.GRANTED_to_REVOKED
          - state_machines.ResearchArtifact.RETAINED_to_PURGED
          - state_machines.Finding.PUBLISHED_to_RETRACTED
          - state_machines.RoadmapDecision.LOCKED_to_OPEN
          - calculations.evidence_strength
          - calculations.theme_evidence_weight
          - calculations.decision_evidence_confidence
        distinguishing_aspect: |
          Depth-5 cascade triggered by ConsentRecord GRANTED -> REVOKED, where every hop is caused by the
          previous hop and not by the original call: consent revocation purges the artifact; the purge
          makes the citing evidence links inadmissible; the inadmissible links re-score the findings below
          MIN_PUBLISH_STRENGTH and retract them; the retraction empties the theme's published set and drops
          its evidence_weight; the empty published set drops the decision's evidence_confidence and unlocks it.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "IRREVERSIBLE decision, deadline 2026-08-15T00:00:00Z, 12000 impacted users"
            - "BEHAVIORAL_LONGITUDINAL request approved, so approved_method == DIARY_STUDY"
            - "DIARY_STUDY with three consented participants, all completed, one RECORDING artifact each"
            - "Two findings on one theme, each carrying the same three OBSERVED_BEHAVIOR links, both locked and published"
            - "Readout citing both findings delivered and ACCEPTED, so the decision's evidence_confidence is 0.62"
            - "Decision LOCKED at confidence 0.62 and theme ESTABLISHED at evidence_weight 1.68"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /roadmap-decisions"
              payload: { title: "Ship the guided setup", reversibility: "IRREVERSIBLE", decision_deadline: "2026-08-15T00:00:00Z", impacted_user_count: 12000 }
