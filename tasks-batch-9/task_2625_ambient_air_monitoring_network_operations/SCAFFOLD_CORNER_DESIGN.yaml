            - "MonitoringSite.${site_a_id}.status == PROPOSED and operations_start_at == null and version == 1"
            - "MonitoringNetwork.${net_id}.operating_site_count == 0 and proposed_site_count == 1"

      - name: a_second_siting_approval_on_the_same_site_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.MonitoringSite.PROPOSED_to_SITING_APPROVED
          - validations[priority=20]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Replaying siting-approval on an already SITING_APPROVED site returns ERR_INVALID_STATE 409 rather than succeeding idempotently, and the network census is not double-counted."
        test_recipe:
          setup:
            - "one SITING_APPROVED site"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
