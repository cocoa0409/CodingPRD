            - "Insolvency.${ins_id}.administrative_paid_cents == 180000"
            - "Insolvency.${ins_id}.estate_distributed_cents == 3180000"
            - "Insolvency.${ins_id}.estate_undistributed_cents == 20000"
            - "TransferredPolicy.${pol_id}.aggregate_paid_cents == 3000000"

      - name: certification_cascades_member_levies_into_assessment_and_insolvency_shortfall
        grounds:
