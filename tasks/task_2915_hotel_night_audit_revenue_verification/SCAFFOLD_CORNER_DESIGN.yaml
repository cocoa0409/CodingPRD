            - "GET /night-audit/business-dates/${bd1_id} now reads status == \"ARCHIVED\" with version == 7, and GET /night-audit/revenue-reports/${report_id} still reads status == \"DISTRIBUTED\"."
            - "POST /night-audit/journal-postings against ${bd1_id} now fails 409 ERR_BUSINESS_DATE_ARCHIVED."
            - "Repeating the tie-out on the TIED_OUT period fails 409 ERR_PERIOD_NOT_TIEABLE and leaves tie_out_attempt_count at 0 - a settled month is not re-openable through the tie-out door."
            - "POST /night-audit/business-dates/${bd1_id}/reopen as Controller (X-User-ID u_ctl_1) fails 409 ERR_BUSINESS_DATE_ARCHIVED, not ERR_PERIOD_NOT_OPEN: priority 30 outranks the period gate even though both conditions hold."

      - name: state_initial_state_every_machine_starts_where_it_is_declared_to
        claim_type: initial_state
        grounds: ["state_machines.Folio.stay_status", "state_machines.Folio.settlement_status", "state_machines.CardAuthorization.status", "state_machines.CardAuthorization.follow_up_status", "state_machines.AuthorizationDocument.status", "state_machines.OutletTicket.status", "state_machines.SettlementBatch.status", "state_machines.Allowance.status", "state_machines.RevenueReport.status"]
        distinguishing_aspect: "All eleven declared dimensions are read straight after creation in one chain, including the two entities that carry two independent dimensions at once and the AccountingPeriod that is minted implicitly by the first BusinessDate of its month."
        test_recipe:
          setup: ["Standard property; one outlet with requires_shift_settlement false so the close hops stay unblocked; business date 2026-08-01 for the close walk and 2026-08-02 for everything else."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00.000Z" }
              as: PropertyAdmin
