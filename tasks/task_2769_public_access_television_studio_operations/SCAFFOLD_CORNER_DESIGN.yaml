  # ===========================================================================
  - section: errors
    instances:

      - name: corner_error_unauthenticated_missing_auth_headers
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Both identity headers are mandatory and checked before anything else, so a missing X-Role and a missing X-User-ID both yield 401 even on an endpoint whose payload is invalid — and the logical clock endpoint is the single documented exception that needs no X-Role."
        test_recipe:
          setup:
            - "No entities are required; the check runs before body parsing."
          setup_api_calls: []
          trigger:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: "<X-Role header omitted>"
              as_user_id: "adm-1"
              captures: {no_role_err: $.data.error_id}
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "<X-User-ID header omitted>"
              captures: {no_user_err: $.data.error_id}
            - call: "GET /producers"
              payload: {limit: 10, offset: 0}
              as: "<X-Role header omitted>"
              as_user_id: "<X-User-ID header omitted>"
              captures: {both_err: $.data.error_id}
            - call: "POST /producers"
              payload: {}
              as: "<X-Role header omitted>"
              as_user_id: "<X-User-ID header omitted>"
              captures: {precedence_err: $.data.error_id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-10T00:00:00Z"}
              as: "<X-Role header omitted>"
              as_user_id: "sys-1"
              captures: {clock_now: $.data}
          assert:
            - "${no_role_err} == ERR_UNAUTHENTICATED (401)"
            - "${no_user_err} == ERR_UNAUTHENTICATED (401) — a valid role alone is not identity"
            - "${both_err} == ERR_UNAUTHENTICATED (401) on a read as well as a write"
            - "${precedence_err} == ERR_UNAUTHENTICATED, not ERR_INVALID_REQUEST — priority 1 outranks the empty-body failure at priority 3"
            - "${clock_now} reports 2026-08-10T00:00:00Z — the clock endpoint accepts the call without X-Role"
            - "No Producer rows were created by any of the refused calls"

      - name: corner_error_not_resource_owner_across_two_producers
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
          - validations[priority=6]
          - roles.Producer
        distinguishing_aspect: "Producer identity is entity-backed, so ownership is judged against the target row rather than against the role: P2 holding a legitimate Producer role is refused on P1's program and on a body carrying P1's producer_id, while the same calls from P1 succeed."
        test_recipe:
          setup:
            - "Producers P1 and P2 are both ACTIVE."
            - "Program PR1 is DRAFT and owned by P1; TrainingCourse TV-101 has open seats."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p1_id: $.data.id}
            - call: "POST /producers"
              payload: {legal_name: "Grace Hopper", email: "grace@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p2_id: $.data.id}
            - call: "POST /producers/${p1_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /producers/${p2_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0002"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_id: $.data.id}
            - call: "POST /programs"
              payload: {producer_id: "${p1_id}", title: "Harbor History", runtime_seconds: 1800, is_live: false, required_crew_roles: []}
              as: Producer
              as_user_id: "${p1_id}"
              captures: {pr1_id: $.data.id}
          trigger:
            - call: "POST /programs/${pr1_id}/attestations"
              payload: {attestation_kind: "INDEMNIFICATION", statement_version: "2026.1", third_party_material: false}
              as: Producer
              as_user_id: "${p2_id}"
              captures: {att_err: $.data.error_id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p1_id}", course_id: "${c_id}"}
              as: Producer
              as_user_id: "${p2_id}"
              captures: {enroll_err: $.data.error_id}
            - call: "POST /programs"
              payload: {producer_id: "${p1_id}", title: "Impostor Show", runtime_seconds: 900, is_live: false, required_crew_roles: []}
              as: Producer
              as_user_id: "${p2_id}"
              captures: {create_err: $.data.error_id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p1_id}", course_id: "${c_id}"}
              as: Producer
              as_user_id: "${p1_id}"
              captures: {ok_enroll: $.data.status}
          assert:
            - "${att_err} == ERR_NOT_RESOURCE_OWNER (403) — path-derived ownership"
            - "${enroll_err} == ERR_NOT_RESOURCE_OWNER (403) — body-derived ownership"
            - "${create_err} == ERR_NOT_RESOURCE_OWNER (403) — a producer cannot file a program for someone else"
            - "${ok_enroll} == ENROLLED for the same call made by the owner"
            - "Program ${pr1_id} still has attestation_sequence_high 0 and exactly one Program row exists"

      - name: corner_error_segregation_of_duties_on_waiver_and_report_decision
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=7]
          - endpoints[POST /damage-assessments/{assessmentId}/waive]
          - endpoints[POST /funding-periods/{periodId}/report-decision]
        distinguishing_aspect: "Segregation of duties is keyed on X-User-ID rather than on role, so the same human who filed a damage assessment cannot waive it and the same human who submitted a funding report cannot decide it — even though each second call carries the correct role for that step."
        test_recipe:
          setup:
            - "Producer P is ACTIVE and BASIC with [STUDIO_FLOOR]; STUDIO-A has base_deposit 12345, replacement_value 900000."
            - "Reservation R for 2026-08-20T10:00:00Z-12:00:00Z is CONFIRMED and CHECKED_OUT; user fin-1 files the damage on return."
            - "FundingPeriod FP for 2026 Q3 is submitted for approval by user adm-1 wearing the FinanceOfficer role."
