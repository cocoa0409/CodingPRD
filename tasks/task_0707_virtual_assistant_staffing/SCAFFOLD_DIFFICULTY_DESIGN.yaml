              captures: { eng: $.data.id }
            - call: "POST /va-staffing/engagements/${eng}/accept"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/engagements/${eng}/activate"
              payload: { onboarding_checklist_done: true }
              as: StaffingManager
            - call: "POST /va-staffing/tasks"
              payload: { client_id: "${cli}", title: "Res task", priority: "STANDARD", required_skill_tag_id: "${skill}", estimated_hours: 1 }
              as: Client
              as_user_id: "${cli}"
              captures: { task: $.data.id }
            - call: "POST /va-staffing/tasks/${task}/assign"
              payload: {}
              as: StaffingManager
            - call: "POST /va-staffing/tasks/${task}/start"
              payload: {}
              as: VA
              as_user_id: "${va}"
            - call: "POST /va-staffing/time-entries"
              payload: { task_id: "${task}", raw_minutes: 60 }
              as: VA
              as_user_id: "${va}"
              captures: { te: $.data.id }
            - call: "POST /va-staffing/time-entries/${te}/approve"
              payload: {}
              as: Client
              as_user_id: "${cli}"
            - call: "POST /va-staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:01Z" }
              as: StaffingManager
          trigger:
            - call: "POST /va-staffing/tasks/${task}/complete"
