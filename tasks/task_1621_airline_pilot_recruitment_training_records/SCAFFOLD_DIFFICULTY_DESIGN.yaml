            - "trigger (4th enrollment) returns 409 error_id == ERR_CLASS_FULL — strict < gate at the exact ceiling"
      - name: landing_exactly_90_days_old_excluded
        grounds:
          - calculations.currency_recency_check
          - entities.Qualification.fields.landings_90d
        distinguishing_aspect: |
          Metric: recency-window landing count via POST
          /qualifications/{id}/refresh-currency (different metric and endpoint
          from the seat gate). A landing stamped exactly now-90d is EXCLUDED by
          the half-open window: 2 recent landings + 1 exactly at the boundary
          yield landings_90d == 2 < 3 -> LAPSED, not QUALIFIED.
        test_recipe:
          setup:
            - "Cleared applicant with qualification; landings: 1 at 2026-07-20, 1 at 2026-08-01, and 1 at exactly 2026-05-16T12:00:00Z; clock set to 2026-08-14T12:00:00Z so the third is exactly 90 days old"
