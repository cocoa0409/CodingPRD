        distinguishing_aspect: "Creating a second DRAFT revision auto-withdraws the first, and the list endpoint proves both halves: the unfiltered project_request_id query returns 2 rows while status=DRAFT returns exactly the newer revision (revision_no 2), so withdrawal is a status change and not a delete."
