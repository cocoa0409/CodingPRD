          - entities.Gift.fields.counts_toward_points
        distinguishing_aspect: |
          The scoring input set admits only designation ATHLETICS_ANNUAL and
          CAPITAL; ENDOWMENT never scores, in EITHER variant. A 5000000-cent
          ENDOWMENT gift alongside a 1000000-cent ATHLETICS_ANNUAL gift must
          therefore leave the score at the 1000000-cent figure (15.00) rather
          than pushing qualifying_cents across GIVING_TIER_1_CENTS. An
          implementation that filters on gift_status only — the variant axis —
          would score 6000000 cents and return 60.00.
