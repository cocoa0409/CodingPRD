  - rule_id: compensating_invariant
    instances:
      - name: ancillary_sale_refund_credit_invariant
        grounds:
          - calculations.ancillary_commission
          - calculations.ancillary_refund
          - state_machines.AncillarySale.ACTIVE_to_REFUNDED
          - entities.Membership.fields.account_credit_cents
        distinguishing_aspect: |
          Conserved quantity = Membership.account_credit_cents: an ancillary sale
          (debit price) followed within 30 days by its refund (credit price) returns
          the balance to its pre-sale value exactly; commission is a separate
          reporting ledger and does not touch the invariant.
        test_recipe:
          setup:
            - "M1 ACTIVE CLASSIC with account_credit_cents == 0 before any sale"
            - "Product IDENTITY_PROTECTION price 12000, commission 1000 bps"
          setup_api_calls:
            - call: "POST /motor-club/clubs"
              payload: { club_code: "NCA", name: "NorCal Auto", territory_state_codes: ["CA"], default_arrival_target_minutes: 45 }
