          rationale: "Every side effect of the five-hop impose cascade, including the conditional sibling vacate in HOP 5, is asserted end-to-end by the named §1.8 instance."

      - name: appeal_overturn_cross_entity_unwind_corner_stub
        claim_type: Cross-entity
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_OVERTURNED
