            - "WeightedSale.${hw3}.status == PROVISIONAL (no partial finalize)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check: quantity threshold vs points threshold
  # ===========================================================================
  - rule_id: boundary_precision_check
