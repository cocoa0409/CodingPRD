              as: FleetAdmin
              captures: { e204_id: $.data.id }
            - call: "POST /fleet/mechanics"
              payload: { mechanic_code: "MECH-204", name: "Mac 204", home_project_id: "${p204_id}" }
              as: FleetAdmin
              captures: { m204_id: $.data.id }
            - call: "POST /fleet/work-orders"
              payload: { equipment_id: "${e204_id}", kind: "REPAIR" }
              as: FleetAdmin
              captures: { w204_id: $.data.id }
            - call: "POST /fleet/work-orders/${w204_id}/dispatch"
              payload: { mechanic_id: "${m204_id}" }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/mechanics/${m204_id}/off-duty"
              as: FleetAdmin
              captures: { err: $.data.error_id }
          assert:
