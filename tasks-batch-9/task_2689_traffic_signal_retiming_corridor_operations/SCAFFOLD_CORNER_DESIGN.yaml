            - "${after_fail_total} == 2 with ${st0} == DRAFT and ${st1} == DRAFT — the bulk action rolled back completely; ${cyc0} == 90, ${cyc1} == 90 and ${off1} == 0 confirm no partial write reached tp1 either"
            - "${tp1_v0} == 1 and ${tp2_v0} == 1 at draft time, and the failed call left both at 1"
            - "${i2_max} == 150 after the single PATCH"
            - "${ok_st0} == COORDINATED and ${ok_st1} == COORDINATED — one call moved both plans"
            - "${ok_cyc0} == 105, ${ok_cyc1} == 105, ${ok_off0} == 0 and ${ok_off1} == 60 — the whole corridor was retimed as a unit"
            - "${ok_v0} == 2, ${ok_v1} == 2 and ${proj_v_after} == 3 — each touched plan and the project itself advance by exactly 1 for the successful call (project version 1 at create, 2 at advance, 3 at coordinate)"

      - name: one_complaint_is_reachable_from_every_declared_cross_reference
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /signal-ops/requesters/{id}/complaints]
          - endpoints[GET /signal-ops/corridors/{id}/complaints]
          - endpoints[GET /signal-ops/retiming-projects/{id}/complaints]
          - endpoints[POST /signal-ops/complaints/{id}/link]
        distinguishing_aspect: "CitizenComplaint has three foreign keys and each one has its own reverse-lookup endpoint with its own filter set: the requester lookup finds the complaint from the moment it is filed, the corridor lookup finds it too, but the project lookup returns it only after the link action writes linked_project_id — and the corridor lookup's category filter is not available on the other two."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor c1 (ARTERIAL) has one READY member, is SELECTED, and owns project p1 in DATA_COLLECTION."
            - "Requester r1 files two complaints on c1: cx1 (COORDINATION) and cx2 (PEDESTRIAN)."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET" }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Programme corridor" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-08-01T00:00:00Z", study_window_days: 90, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id }
            - call: "POST /signal-ops/requesters"
              payload: { display_name: "Ada Citizen", email: "ada@example.org" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { r1_id: $.data.id }
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${c1_id}", category: "COORDINATION", narrative: "Progression is broken northbound." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { cx1_id: $.data.id }
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${c1_id}", category: "PEDESTRIAN", narrative: "Not enough crossing time." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { cx2_id: $.data.id }
