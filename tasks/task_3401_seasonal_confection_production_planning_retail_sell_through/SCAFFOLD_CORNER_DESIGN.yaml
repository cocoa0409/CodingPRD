            - "GET /confection/retailer-commitments?retailer_id=${r_gold} returns 0 rows"

      - name: shipment_past_allocated_units_returns_shipment_exceeds_allocation
        claim_type: error_triggerability
        grounds:
          - errors.ERR_SHIPMENT_EXCEEDS_ALLOCATION
          - endpoints.POST_/confection/shipments
        distinguishing_aspect: "The cumulative cap is exact: a 10-unit shipment against allocated 10 succeeds, and the next 1-unit shipment fails 422 ERR_SHIPMENT_EXCEEDS_ALLOCATION at 11 > 10 — the warehouse still holds stock, so only the allocation cap can fire."
        test_recipe:
          setup:
            - "Program in SHIPPING; GOLD commitment 10 ALLOCATED; 20 units on hand at W1 (stock is NOT the constraint)."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
            - *c_prog_open
            - *c_rt
            - *c_wh
            - *c_prod_seas
            - *c_clock_0120
            - call: "POST /confection/retailer-commitments"
              payload: { program_id: "${prog_id}", retailer_id: "${r_gold}", product_id: "${prod_id}", committed_units: 10, ship_window_open_on: "2027-08-01T00:00:00Z", ship_window_close_on: "2027-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${r_gold}"
              captures: { c_gold: $.data.id }
            - *c_submit_gold
            - *c_confirm_gold
            - call: "POST /confection/production-runs"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", line_code: "LINE-A", planned_units: 20, scheduled_start_on: "2027-03-01T08:00:00Z", scheduled_end_on: "2027-03-02T08:00:00Z" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - *c_clock_0215
            - *c_g2
            - *c_adv_lock
            - call: "POST /confection/production-runs/${run_id}/start"
              payload: {}
              as: ProductionPlanner
            - *c_clock_0306
            - call: "POST /confection/production-runs/${run_id}/complete"
              payload: { produced_units: 20, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
            - *c_g4
            - *c_adv_inprod
            - *c_clock_0715
            - *c_g5
            - *c_adv_ship
          trigger:
            - call: "POST /confection/shipments"
              payload: { commitment_id: "${c_gold}", warehouse_id: "${wh_id}", units: 10, ship_on: "2027-08-02T00:00:00Z", temp_controlled: true }
              as: LogisticsCoordinator
              captures: { sh_full: $.data.id }
            - call: "POST /confection/shipments"
              payload: { commitment_id: "${c_gold}", warehouse_id: "${wh_id}", units: 1, ship_on: "2027-08-02T00:00:00Z", temp_controlled: true }
              as: LogisticsCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the 10-unit shipment returns 201 (cumulative 10 == allocated 10, inclusive boundary)"
            - "the 1-unit follow-up returns 422 and error_id == ERR_SHIPMENT_EXCEEDS_ALLOCATION (11 > 10)"
            - "Shipment.${sh_full}.status == PLANNED and the lot still holds 10 units"

      - name: congested_warehouse_blocks_seasonal_completion_but_not_everyday
        claim_type: error_triggerability
        grounds:
          - errors.ERR_WAREHOUSE_CONGESTED_SEASONAL
          - state_machines.ProductionRun.IN_PROGRESS_to_COMPLETE
          - calculations.warehouse_load_and_posture
        distinguishing_aspect: "CONGESTED is a directional gate: at in_use 850 a SEASONAL completion of 50 fails 409 ERR_WAREHOUSE_CONGESTED_SEASONAL (would not overflow: 900 <= 1000), while an EVERYDAY completion of the same size succeeds."
        test_recipe:
          setup:
            - "W1 capacity 1000 holding 850 units (CONGESTED); one IN_PROGRESS seasonal run (50 units) and one IN_PROGRESS everyday run (50 units), both targeting W1."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
            - *c_prog_open
            - *c_wh
            - *c_prod_seas
            - *c_prod_ev
            - call: "POST /confection/production-runs"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", line_code: "LINE-A", planned_units: 850, scheduled_start_on: "2027-03-01T08:00:00Z", scheduled_end_on: "2027-03-05T08:00:00Z" }
              as: ProductionPlanner
              captures: { run_big: $.data.id }
            - call: "POST /confection/production-runs"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", line_code: "LINE-B", planned_units: 50, scheduled_start_on: "2027-03-10T08:00:00Z", scheduled_end_on: "2027-03-11T08:00:00Z" }
              as: ProductionPlanner
              captures: { run_seas: $.data.id }
            - call: "POST /confection/production-runs"
              payload: { program_id: null, product_id: "${prod_ev}", line_code: "LINE-B", planned_units: 50, scheduled_start_on: "2027-03-20T08:00:00Z", scheduled_end_on: "2027-03-21T08:00:00Z" }
              as: ProductionPlanner
              captures: { run_ev: $.data.id }
            - *c_clock_0215
            - *c_g2
            - *c_adv_lock
            - call: "POST /confection/production-runs/${run_big}/start"
              payload: {}
              as: ProductionPlanner
            - *c_clock_0306
            - call: "POST /confection/production-runs/${run_big}/complete"
              payload: { produced_units: 850, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
            - call: "POST /confection/production-runs/${run_seas}/start"
              payload: {}
              as: ProductionPlanner
            - call: "POST /confection/production-runs/${run_ev}/start"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /confection/production-runs/${run_seas}/complete"
              payload: { produced_units: 50, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
              captures: { err_seas: $.data.error_id }
            - call: "POST /confection/production-runs/${run_ev}/complete"
              payload: { produced_units: 50, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
          assert:
            - "the seasonal completion returns 409 and err_seas == ERR_WAREHOUSE_CONGESTED_SEASONAL (posture gate, not capacity: 850 + 50 = 900 <= 1000)"
            - "err_seas != ERR_WAREHOUSE_FULL"
            - "the everyday completion returns 200 COMPLETE — CONGESTED spares everyday stock"
            - "Warehouse.${wh_id}.in_use_units == 900 and posture stays CONGESTED"
            - "ProductionRun.${run_seas}.status remains IN_PROGRESS"

      - name: markdown_execute_after_destroy_by_closed_but_destruction_still_allowed
        claim_type: error_triggerability
        grounds:
          - errors.ERR_DISPOSITION_WINDOW_CLOSED
          - state_machines.DispositionOrder.APPROVED_to_EXECUTED
        distinguishing_aspect: "destroy_by_on partitions the channels at EXECUTE time: an APPROVED MARKDOWN executed at 2028-01-01 (past 2027-12-31) fails 422 ERR_DISPOSITION_WINDOW_CLOSED, while an APPROVED DESTRUCTION of the same stock executes fine — destruction is the permanent fallback."
        test_recipe:
          setup:
            - "Program in DISPOSITION with 10 quarantined units at W1; one APPROVED MARKDOWN (pct 0.30) for 5 units and one APPROVED DESTRUCTION for 5 units; clock moved to 2028-01-01."
          setup_api_calls:
            - *c_clock_0105
            - *c_prog
            - *c_prog_open
            - *c_rt
            - *c_wh
            - *c_prod_seas
