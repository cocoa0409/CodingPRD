scenario: |
  Distributed Energy Interconnection Study Queue (ISO/utility interconnection queue): queue position & cluster study grouping, deposit & readiness milestone enforcement, impact study scope & cost allocation, network upgrade cost sharing & restudy on withdrawal, interconnection agreement execution deadline, commercial operation milestone & extension, curtailment/operating limit conditions, transparency reporting

domain_name: interconnection-queue
api_prefix: /interconnection

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: compliance / audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Developer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the interconnection customer organization" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: developer_type, type: enum, source: input, description: "IPP | UTILITY_SCALE | COMMUNITY" }

  - name: ClusterGroup
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cluster study group name" }
      - { name: region, type: string, source: input, description: "ISO region code; window-overlap uniqueness is scoped per region" }
      - { name: application_window_open, type: datetime, source: input, description: "Start of the half-open application window [open, close)" }
      - { name: application_window_close, type: datetime, source: input, description: "End of the half-open application window; must be strictly greater than application_window_open" }
      - { name: capacity_mw, type: number, source: input, description: "Maximum total MW the cluster will study; must be > 0" }
      - { name: committed_mw, type: number, source: computed, default: 0, description: "Read-only = sum of capacity_mw over member Projects with status != WITHDRAWN" }
      - { name: status, type: enum, source: system, description: "FORMING -> STUDY_UNDERWAY -> STUDY_COMPLETE -> CLOSED" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: developer_id, type: string, source: input, description: "FK -> Developer.id; owning interconnection customer" }
      - { name: cluster_group_id, type: string, source: input, description: "FK -> ClusterGroup.id; cluster study group the project joins" }
      - { name: project_name, type: string, source: input, description: "Project name" }
      - { name: technology, type: enum, source: input, description: "SOLAR | WIND | STORAGE | HYBRID" }
      - { name: capacity_mw, type: number, source: input, description: "Nameplate capacity in MW; must be > 0 and <= 500" }
      - { name: service_type, type: enum, source: input, description: "ENERGY_ONLY | CAPACITY" }
      - { name: point_of_interconnection, type: string, source: input, description: "Substation / feeder identifier" }
      - { name: queue_position, type: integer, source: computed, description: "Read-only; null until QUEUED; 1-based dense position among non-withdrawn cluster members; compacted on withdrawal" }
      - { name: deposit_required_cents, type: integer, source: computed, description: "Read-only; set at creation by calculations.deposit_assessment" }
      - { name: deposit_posted_cents, type: integer, source: computed, default: 0, description: "Read-only running ledger = sum(DEPOSIT) - sum(REFUND) - sum(FORFEIT) over the project's DepositTransactions" }
      - { name: readiness_satisfied, type: boolean, source: computed, default: false, description: "Read-only; true once every type in readiness_required_types has an ACCEPTED MilestoneSubmission" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> QUEUED -> READY -> IN_STUDY -> STUDY_COMPLETE -> RESTUDY_REQUIRED -> STUDY_COMPLETE (cycle) -> AGREEMENT_PENDING -> AGREEMENT_EXECUTED -> COMMERCIAL_OPERATION; WITHDRAWN terminal from any non-terminal state" }

  - name: DepositTransaction
    parent: null
    common_fields: false
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; project whose deposit ledger this entry belongs to" }
      - { name: tx_type, type: enum, source: system, description: "DEPOSIT | REFUND | FORFEIT" }
      - { name: amount_cents, type: integer, source: system, description: "Positive amount in cents" }
      - { name: balance_after_cents, type: integer, source: computed, description: "Running deposit_posted_cents immediately after this entry is applied" }

  - name: MilestoneSubmission
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; project this readiness evidence belongs to" }
      - { name: milestone_type, type: enum, source: input, description: "SITE_CONTROL | TECHNICAL_DATA (both required for readiness)" }
      - { name: evidence_uri, type: string, source: input, description: "URI of the evidence document" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW -> ACCEPTED | REJECTED; REJECTED -> PENDING_REVIEW via resubmit" }
      - { name: review_note, type: string, source: system, description: "Reviewer note recorded at review time; null until reviewed" }

  - name: Study
    parent: null
    common_fields: true
    fields:
      - { name: cluster_group_id, type: string, source: system, description: "FK -> ClusterGroup.id; at most one Study exists per ClusterGroup" }
      - { name: total_cost_cents, type: integer, source: input, description: "Total study cost in cents to be allocated across included member projects; must be > 0" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS -> RESULTS_PUBLISHED -> FINALIZED; RESULTS_PUBLISHED -> IN_PROGRESS on restudy reopen (cycle)" }

  - name: CostShare
    parent: null
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> Study.id; study whose cost is shared" }
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; member project bearing the share" }
      - { name: basis, type: enum, source: computed, description: "PROVISIONAL | FINAL; reflects the formula used for the most recent recomputation" }
      - { name: allocated_cents, type: integer, source: computed, description: "Read-only share in cents; recomputed at scoping, publish-results, and post-withdrawal restudy; set to 0 for withdrawn projects" }

  - name: InterconnectionAgreement
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; project the agreement is issued to" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp at issuance" }
      - { name: execution_deadline, type: datetime, source: computed, description: "Read-only = issued_at + 90 days" }
      - { name: target_cod, type: datetime, source: input, description: "Target commercial operation date; must be strictly after issued_at" }
      - { name: extension_count, type: integer, source: system, default: 0, description: "Number of granted COD extensions; max 2" }
      - { name: max_injection_mw, type: number, source: input, description: "Operating limit: maximum injection in MW; must be > 0 and <= project capacity_mw" }
      - { name: curtailment_hours_cap, type: integer, source: input, default: 0, description: "Operating limit: annual curtailment hours cap; 0 means firm service" }
      - { name: status, type: enum, source: system, description: "ISSUED -> EXECUTED | EXPIRED" }

  - name: CurtailmentLimit
    parent: null
    common_fields: false
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; project the operating limit applies to" }
      - { name: limit_type, type: enum, source: input, description: "SEASONAL | EMERGENCY | ECONOMIC" }
      - { name: max_output_mw, type: number, source: input, description: "Maximum output in MW while the limit is effective; must be > 0 and <= project capacity_mw" }
      - { name: effective_start, type: datetime, source: input, description: "Start of the CLOSED effective interval [start, end]" }
      - { name: effective_end, type: datetime, source: input, description: "End of the CLOSED effective interval; must be strictly after effective_start" }
      - { name: curtailment_hours_per_year, type: integer, source: input, description: "Annual curtailment hours allowed under this limit; must be >= 0" }

  - name: TransparencyReport
    parent: null
    common_fields: false
    fields:
      - { name: reporting_period, type: string, source: input, description: "Unique period label, e.g. 2026-Q3" }
      - { name: queued_project_count, type: integer, source: computed, description: "Snapshot count of Projects with status in {SUBMITTED, QUEUED, READY, IN_STUDY, STUDY_COMPLETE, RESTUDY_REQUIRED, AGREEMENT_PENDING, AGREEMENT_EXECUTED}" }
      - { name: queued_mw, type: number, source: computed, description: "Snapshot sum of capacity_mw over the same queued set" }
      - { name: withdrawn_project_count, type: integer, source: computed, description: "Snapshot count of Projects with status WITHDRAWN" }
      - { name: commercial_operation_project_count, type: integer, source: computed, description: "Snapshot count of Projects with status COMMERCIAL_OPERATION" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: SUBMITTED
    terminal_states: [WITHDRAWN, COMMERCIAL_OPERATION]
    transitions:
      - from: SUBMITTED
        to: QUEUED
        trigger: "system (automatic on POST /interconnection/projects/{id}/deposits when deposit_posted_cents >= deposit_required_cents)"
        actor: system
        preconditions:
          - "project.status == SUBMITTED"
          - "cumulative deposit_posted_cents after applying this DEPOSIT entry >= deposit_required_cents"
        side_effects:
          - "queue_position assigned = 1 + max(queue_position over non-withdrawn members of the same ClusterGroup; 0 if none)"
      - from: QUEUED
        to: READY
        trigger: "system (automatic on milestone review acceptance when readiness becomes satisfied)"
        actor: system
        preconditions:
          - "project.status == QUEUED"
          - "readiness_satisfied flipped to true (both SITE_CONTROL and TECHNICAL_DATA have ACCEPTED submissions)"
        side_effects:
          - "readiness_satisfied = true"
      - from: READY
        to: IN_STUDY
        trigger: "system (automatic on POST /interconnection/cluster-groups/{id}/studies scoping)"
        actor: system
        preconditions:
          - "project.status == READY"
        side_effects:
          - "a PROVISIONAL CostShare row is created for (study, project)"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system (automatic readiness enforcement at study scoping) or POST /interconnection/projects/{id}/withdraw"
        actor: system
        preconditions: []
        side_effects:
          - "deposit forfeiture per calculations.deposit_forfeiture_schedule (10% band); FORFEIT + REFUND DepositTransactions created when posted > 0; deposit_posted_cents -> 0"
          - "ClusterGroup.committed_mw -= capacity_mw"
          - "queue compaction: every non-withdrawn cluster member with queue_position > this project's position decrements by 1"
          - "no restudy cascade when the withdrawal happens at scoping time"
      - from: QUEUED
        to: WITHDRAWN
        trigger: "system (readiness enforcement at study scoping) or POST /interconnection/projects/{id}/withdraw"
        actor: system
        preconditions: []
        side_effects:
          - "same forfeiture/compaction/committed_mw side effects as SUBMITTED -> WITHDRAWN (10% band)"
      - from: READY
        to: WITHDRAWN
        trigger: "POST /interconnection/projects/{id}/withdraw"
        actor: Developer | QueueAdministrator
        preconditions: []
        side_effects:
          - "same forfeiture/compaction/committed_mw side effects (10% band)"
      - from: IN_STUDY
        to: STUDY_COMPLETE
        trigger: "system (automatic on POST /interconnection/studies/{id}/publish-results)"
        actor: system
        preconditions:
          - "project.status == IN_STUDY and project is an included member of the study"
        side_effects:
          - "CostShare rows recomputed under FINAL basis"
      - from: STUDY_COMPLETE
        to: RESTUDY_REQUIRED
        trigger: "system (automatic when the cluster Study reopens RESULTS_PUBLISHED -> IN_PROGRESS on a sibling withdrawal)"
        actor: system
        preconditions:
          - "project.status == STUDY_COMPLETE and the cluster Study status was RESULTS_PUBLISHED"
        side_effects:
          - "project remains an included member for the next cost recomputation"
      - from: RESTUDY_REQUIRED
        to: STUDY_COMPLETE
        trigger: "system (automatic on the reopened study's next POST /interconnection/studies/{id}/publish-results)"
        actor: system
        preconditions:
          - "project.status == RESTUDY_REQUIRED"
        side_effects:
          - "CostShare rows recomputed under FINAL basis"
      - from: STUDY_COMPLETE
        to: AGREEMENT_PENDING
        trigger: "POST /interconnection/projects/{id}/agreements (first issuance)"
        actor: QueueAdministrator
        preconditions:
          - "project.status == STUDY_COMPLETE (ERR_PROJECT_NOT_STUDY_COMPLETE)"
          - "expected_project_version == project.version (ERR_STALE_VERSION)"
          - "cluster Study.status in {RESULTS_PUBLISHED, FINALIZED} (ERR_STUDY_NOT_PUBLISHED)"
        side_effects:
          - "InterconnectionAgreement created with status ISSUED; issued_at = logical clock now; execution_deadline = issued_at + 90 days"
          - "increments Project.version by 1"
      - from: AGREEMENT_PENDING
        to: AGREEMENT_PENDING
        trigger: "POST /interconnection/projects/{id}/agreements (re-issuance superseding expired agreements)"
        actor: QueueAdministrator
        preconditions:
          - "every existing InterconnectionAgreement of the project has status EXPIRED (otherwise ERR_PROJECT_NOT_STUDY_COMPLETE)"
          - "expected_project_version == project.version (ERR_STALE_VERSION)"
          - "cluster Study.status in {RESULTS_PUBLISHED, FINALIZED} (ERR_STUDY_NOT_PUBLISHED)"
        side_effects:
          - "new InterconnectionAgreement created with status ISSUED; issued_at = logical clock now; execution_deadline = issued_at + 90 days"
          - "increments Project.version by 1"
      - from: AGREEMENT_PENDING
        to: AGREEMENT_EXECUTED
        trigger: "system (on POST /interconnection/agreements/{id}/execute success)"
        actor: system
        preconditions:
          - "see InterconnectionAgreement ISSUED -> EXECUTED preconditions"
        side_effects: []
      - from: AGREEMENT_EXECUTED
        to: COMMERCIAL_OPERATION
        trigger: "POST /interconnection/projects/{id}/declare-commercial-operation"
        actor: Developer
        preconditions:
          - "project.status == AGREEMENT_EXECUTED (ERR_PROJECT_NOT_READY_FOR_OPERATION)"
          - "logical clock now <= target_cod as extended (ERR_COD_DEADLINE_PASSED)"
        side_effects:
          - "bubble-up: if cluster.status == STUDY_COMPLETE and every member project is in {WITHDRAWN, COMMERCIAL_OPERATION}, ClusterGroup -> CLOSED"
      - from: IN_STUDY
        to: WITHDRAWN
        trigger: "POST /interconnection/projects/{id}/withdraw"
        actor: Developer | QueueAdministrator
        preconditions: []
        side_effects:
          - "50% forfeiture band; FORFEIT + REFUND DepositTransactions; deposit_posted_cents -> 0"
          - "ClusterGroup.committed_mw -= capacity_mw; queue compaction"
          - "any ISSUED InterconnectionAgreement of this project -> EXPIRED"
          - "restudy cascade if cluster Study.status in {IN_PROGRESS, RESULTS_PUBLISHED}: Study (if RESULTS_PUBLISHED) -> IN_PROGRESS; that reopen -> sibling projects in STUDY_COMPLETE -> RESTUDY_REQUIRED; that demotion -> CostShare rows recomputed over remaining included members (withdrawn project's row set to 0)"
      - from: STUDY_COMPLETE
        to: WITHDRAWN
        trigger: "POST /interconnection/projects/{id}/withdraw"
        actor: Developer | QueueAdministrator
        preconditions: []
        side_effects:
          - "same as IN_STUDY -> WITHDRAWN (50% band; restudy cascade when study not FINALIZED)"
      - from: RESTUDY_REQUIRED
        to: WITHDRAWN
        trigger: "POST /interconnection/projects/{id}/withdraw"
        actor: Developer | QueueAdministrator
        preconditions: []
        side_effects:
          - "same as IN_STUDY -> WITHDRAWN (50% band; restudy cascade when study not FINALIZED)"
      - from: AGREEMENT_PENDING
        to: WITHDRAWN
        trigger: "POST /interconnection/projects/{id}/withdraw"
        actor: Developer | QueueAdministrator
        preconditions: []
        side_effects:
          - "100% forfeiture band; deposit_posted_cents -> 0"
          - "ClusterGroup.committed_mw -= capacity_mw; queue compaction"
          - "any ISSUED InterconnectionAgreement of this project -> EXPIRED"
          - "restudy cascade if cluster Study.status in {IN_PROGRESS, RESULTS_PUBLISHED}"
      - from: AGREEMENT_EXECUTED
        to: WITHDRAWN
        trigger: "POST /interconnection/projects/{id}/withdraw"
        actor: Developer | QueueAdministrator
        preconditions: []
        side_effects:
          - "100% forfeiture band; committed_mw / compaction / agreement-expiry / restudy side effects as above"

  - entity: ClusterGroup
    initial_state: FORMING
    terminal_states: [CLOSED]
    transitions:
      - from: FORMING
        to: STUDY_UNDERWAY
        trigger: "POST /interconnection/cluster-groups/{id}/studies (study scoping)"
        actor: StudyEngineer
        preconditions:
          - "cluster.status == FORMING (ERR_CLUSTER_NOT_ACCEPTING_PROJECTS)"
          - "no Study exists yet for this cluster (ERR_STUDY_ALREADY_EXISTS)"
          - "at least one member project has status READY (ERR_NO_READY_PROJECTS)"
        side_effects:
          - "Study created IN_PROGRESS with total_cost_cents"
          - "member projects READY -> IN_STUDY; member projects SUBMITTED/QUEUED -> WITHDRAWN (readiness enforcement, 10% forfeiture band, no restudy cascade)"
          - "PROVISIONAL CostShare rows created for the IN_STUDY members"
      - from: STUDY_UNDERWAY
        to: STUDY_COMPLETE
        trigger: "system (automatic on POST /interconnection/studies/{id}/finalize)"
        actor: system
        preconditions:
          - "the cluster Study transitioned RESULTS_PUBLISHED -> FINALIZED"
        side_effects: []
      - from: STUDY_COMPLETE
        to: CLOSED
        trigger: "system (automatic when every member project reaches a terminal state: WITHDRAWN or COMMERCIAL_OPERATION)"
        actor: system
        preconditions:
          - "cluster.status == STUDY_COMPLETE"
          - "no member project has status outside {WITHDRAWN, COMMERCIAL_OPERATION}"
        side_effects: []

  - entity: Study
    initial_state: IN_PROGRESS
    terminal_states: [FINALIZED]
    transitions:
      - from: IN_PROGRESS
        to: RESULTS_PUBLISHED
        trigger: "POST /interconnection/studies/{id}/publish-results"
        actor: StudyEngineer
        preconditions:
          - "study.status == IN_PROGRESS (ERR_STUDY_INVALID_STATE)"
        side_effects:
          - "included member projects IN_STUDY -> STUDY_COMPLETE and RESTUDY_REQUIRED -> STUDY_COMPLETE"
          - "CostShare rows recomputed under FINAL basis (basis -> FINAL)"
      - from: RESULTS_PUBLISHED
        to: IN_PROGRESS
        trigger: "system (automatic restudy reopen on member withdrawal)"
        actor: system
        preconditions:
          - "a member project was withdrawn while study.status == RESULTS_PUBLISHED"
        side_effects:
          - "sibling member projects in STUDY_COMPLETE -> RESTUDY_REQUIRED"
      - from: RESULTS_PUBLISHED
        to: FINALIZED
        trigger: "POST /interconnection/studies/{id}/finalize"
        actor: StudyEngineer
        preconditions:
          - "study.status == RESULTS_PUBLISHED (ERR_STUDY_INVALID_STATE)"
        side_effects:
          - "ClusterGroup STUDY_UNDERWAY -> STUDY_COMPLETE"
          - "cost shares locked; later withdrawals do not reopen or reallocate"

  - entity: MilestoneSubmission
    initial_state: PENDING_REVIEW
    terminal_states: [ACCEPTED]
    transitions:
      - from: PENDING_REVIEW
        to: ACCEPTED
        trigger: "POST /interconnection/milestone-submissions/{id}/review with decision=ACCEPTED"
        actor: QueueAdministrator
        preconditions:
          - "submission.status == PENDING_REVIEW (ERR_MILESTONE_NOT_PENDING_REVIEW)"
        side_effects:
          - "review_note recorded"
          - "if all required milestone types for the project are now ACCEPTED: project.readiness_satisfied = true; if project.status == QUEUED, project -> READY"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /interconnection/milestone-submissions/{id}/review with decision=REJECTED"
        actor: QueueAdministrator
        preconditions:
          - "submission.status == PENDING_REVIEW (ERR_MILESTONE_NOT_PENDING_REVIEW)"
        side_effects:
          - "review_note recorded"
      - from: REJECTED
        to: PENDING_REVIEW
        trigger: "POST /interconnection/milestone-submissions/{id}/resubmit"
        actor: Developer
        preconditions:
          - "submission.status == REJECTED (ERR_MILESTONE_NOT_REJECTED)"
          - "acting Developer owns the parent project (ERR_FORBIDDEN_RESOURCE_OWNERSHIP)"
        side_effects:
          - "evidence_uri replaced with the new value; review_note cleared to null"

  - entity: InterconnectionAgreement
    initial_state: ISSUED
    terminal_states: [EXECUTED, EXPIRED]
    transitions:
      - from: ISSUED
        to: EXECUTED
        trigger: "POST /interconnection/agreements/{id}/execute"
        actor: Developer
        preconditions:
          - "agreement.status == ISSUED (ERR_AGREEMENT_NOT_ISSUED)"
          - "acting Developer owns the parent project (ERR_FORBIDDEN_RESOURCE_OWNERSHIP)"
          - "logical clock now <= execution_deadline (ERR_AGREEMENT_EXECUTION_DEADLINE_PASSED)"
          - "cluster Study.status == FINALIZED (ERR_STUDY_NOT_FINALIZED)"
        side_effects:
          - "Project AGREEMENT_PENDING -> AGREEMENT_EXECUTED"
      - from: ISSUED
        to: EXPIRED
        trigger: "system (materialized lazily when an execute attempt arrives after execution_deadline)"
        actor: system
        preconditions:
          - "agreement.status == ISSUED and logical clock now > execution_deadline"
        side_effects:
          - "the execute attempt is rejected with ERR_AGREEMENT_EXECUTION_DEADLINE_PASSED"
          - "the project remains AGREEMENT_PENDING and may receive a re-issued agreement"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: agreement-reissue-stale-project
    parent_entity: Project
    write_endpoint: "POST /interconnection/projects/{id}/agreements"
    occ_field: "expected_project_version"
    description: |
      Issuing (or re-issuing) an InterconnectionAgreement against a Project whose
      version has advanced since the client last observed it is rejected. This
      captures the case where another writer has just issued a superseding
      agreement (which legitimately replaces the expired one under the
      AGREEMENT_PENDING re-issuance rule) and the current writer's view of the
      project is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: deposit_assessment
    trigger: "POST /interconnection/projects (project creation)"
    algorithm: tiered_pricing
    formula: |
      Variant selection (evaluated first):
        if technology == STORAGE and capacity_mw <= EXPEDITED_MAX_MW: variant = EXPEDITED
        else: variant = STANDARD
      STANDARD:
        base_cents = min(capacity_mw, TIER1_MW) * TIER1_RATE_CENTS
                   + max(capacity_mw - TIER1_MW, 0) * TIER2_RATE_CENTS
        multiplier = 1.0 if service_type == ENERGY_ONLY else CAPACITY_MULTIPLIER (1.2 if service_type == CAPACITY)
        deposit_required_cents = round_half_up(base_cents * multiplier, 0)
      EXPEDITED:
        deposit_required_cents = EXPEDITED_FLAT_CENTS
    input_set: "the new Project's technology, capacity_mw, service_type"
    constants:
      TIER1_MW: 20
      TIER1_RATE_CENTS: 100000
      TIER2_RATE_CENTS: 250000
      CAPACITY_MULTIPLIER: 1.2
      EXPEDITED_MAX_MW: 5
      EXPEDITED_FLAT_CENTS: 300000
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: STANDARD
        when: "default; any technology, or STORAGE above EXPEDITED_MAX_MW"
        difference: "tiered per-MW rate times service-type multiplier"
      - name: EXPEDITED
        when: "technology == STORAGE and capacity_mw <= 5"
        difference: "flat 300000 cents regardless of capacity or service_type; diverges from STANDARD (e.g. identical 5 MW ENERGY_ONLY project: 500000 STANDARD vs 300000 EXPEDITED)"

  - name: study_cost_allocation
    trigger: "study scoping (PROVISIONAL), publish-results (FINAL), member-withdrawal restudy recompute (current basis)"
    algorithm: waterfall_allocation
    formula: |
      Included set I = member projects of the study's cluster whose status is in
        {IN_STUDY, STUDY_COMPLETE, RESTUDY_REQUIRED, AGREEMENT_PENDING, AGREEMENT_EXECUTED}.
      N = |I|; C = sum(capacity_mw over I); T = study.total_cost_cents.
      Rounding order is pinned: round each component to integer cents FIRST, then sum.
      PROVISIONAL (at scoping):
        share_i = round_half_up(T * capacity_i / C, 0)
      FINAL (at publish-results and at any post-withdrawal recompute):
        head_i = round_half_up(0.5 * T / N, 0)
        cap_i  = round_half_up(0.5 * T * capacity_i / C, 0)
        share_i = head_i + cap_i
      Residual reconciliation (both variants):
        residual = T - sum(share_i); if residual != 0, add residual to the project in I
        with the largest capacity_mw; tie-break: earliest created_at.
      Projects leaving I (withdrawn) have their CostShare.allocated_cents set to 0.
      Invariant after every run: sum(allocated_cents over all CostShare rows of the study) == T.
    input_set: "included member projects of the study's cluster (status-filtered as above); withdrawn projects excluded"
    constants:
      HEAD_COUNT_FRACTION: 0.5
    precision: "0 decimal places (integer cents), round_half_up, per-component rounding before summation"
    variants:
      - name: PROVISIONAL
        when: "study scoping, before any results are published"
        difference: "pure pro-rata by capacity_mw"
      - name: FINAL
        when: "publish-results and every subsequent recompute"
        difference: "50% equal headcount split + 50% pro-rata capacity split, each component rounded before summing; produces different shares than PROVISIONAL for identical membership (e.g. T=1000000, capacities 10/30 MW: PROVISIONAL 250000/750000 vs FINAL 375000/625000)"

  - name: deposit_forfeiture_schedule
    trigger: "POST /interconnection/projects/{id}/withdraw and scoping-time readiness auto-withdrawal"
    algorithm: threshold
    formula: |
      forfeit_pct by project.status at withdrawal:
        SUBMITTED | QUEUED | READY                              -> 0.10
        IN_STUDY | STUDY_COMPLETE | RESTUDY_REQUIRED            -> 0.50
        AGREEMENT_PENDING | AGREEMENT_EXECUTED                  -> 1.00
      forfeit_cents = round_half_up(deposit_posted_cents * forfeit_pct, 0)
      refund_cents  = deposit_posted_cents - forfeit_cents
      If deposit_posted_cents > 0: create a FORFEIT DepositTransaction (amount forfeit_cents)
      and a REFUND DepositTransaction (amount refund_cents, only when refund_cents > 0);
      deposit_posted_cents -> 0.
    input_set: "the withdrawing project's deposit ledger"
    constants:
      FORFEIT_PCT_EARLY: 0.10
      FORFEIT_PCT_STUDY: 0.50
      FORFEIT_PCT_AGREEMENT: 1.00
    precision: "0 decimal places (integer cents), round_half_up"

  - name: queue_position_assignment_and_compaction
    trigger: "project entering QUEUED; project withdrawal"
    algorithm: chronological
    formula: |
      Assignment (on QUEUED): queue_position = 1 + max(queue_position over
      non-withdrawn members of the same ClusterGroup; 0 when none).
      Compaction (on withdrawal): every non-withdrawn member of the same
      ClusterGroup whose queue_position > the withdrawn project's queue_position
      decrements by exactly 1. Positions stay dense 1..N over non-withdrawn members.
    input_set: "non-withdrawn member projects of the same ClusterGroup"
    precision: "integer positions, no ties possible"

  - name: committed_mw_reconciliation
    trigger: "project creation; project withdrawal (any trigger)"
    algorithm: aggregation
    formula: |
      ClusterGroup.committed_mw = sum(capacity_mw over member Projects with status != WITHDRAWN).
      Applied incrementally: +capacity_mw on creation, -capacity_mw on withdrawal.
      Invariant: creating then withdrawing the same project leaves committed_mw unchanged.
    input_set: "member Projects of the ClusterGroup with status != WITHDRAWN"
    precision: "MW as number; exact (no rounding)"

  - name: agreement_execution_deadline
    trigger: "agreement issuance; lazily evaluated on execute"
    algorithm: threshold
    formula: |
      execution_deadline = issued_at + 90 days (exact timestamp arithmetic).
      Execute is permitted iff logical clock now <= execution_deadline;
      equality at the exact deadline timestamp is permitted.
    input_set: "the InterconnectionAgreement and the logical clock"
    constants:
      EXECUTION_DEADLINE_DAYS: 90
    precision: "second-level timestamp comparison, inclusive boundary"

  - name: transparency_snapshot
    trigger: "POST /interconnection/transparency-reports"
    algorithm: aggregation
    formula: |
      Snapshot over ALL projects at creation time:
        queued_project_count = count(status in {SUBMITTED, QUEUED, READY, IN_STUDY,
          STUDY_COMPLETE, RESTUDY_REQUIRED, AGREEMENT_PENDING, AGREEMENT_EXECUTED})
        queued_mw = sum(capacity_mw over the same set)
        withdrawn_project_count = count(status == WITHDRAWN)
        commercial_operation_project_count = count(status == COMMERCIAL_OPERATION)
      The snapshot is immutable once created.
    input_set: "all Projects regardless of cluster"
    precision: "integer counts; MW as number"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers must be present and valid", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role must be permitted for this endpoint per §1.5 roles", error_id: ERR_INSUFFICIENT_PERMISSIONS, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path and body resource ids must exist, validated left-to-right", error_id: "ERR_DEVELOPER_NOT_FOUND | ERR_CLUSTER_GROUP_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_STUDY_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_MILESTONE_SUBMISSION_NOT_FOUND | ERR_TRANSPARENCY_REPORT_NOT_FOUND", http_status: 404, applies_to: "all endpoints with resource ids" }
  - { priority: 4, category: auth, check: "Developer-role caller must own the target resource (X-User-ID == the target Project's developer_id, resolved via the parent project for child resources and via the request body developer_id for POST /projects)", error_id: ERR_FORBIDDEN_RESOURCE_OWNERSHIP, http_status: 403, applies_to: "Developer-scoped write endpoints: POST /projects, /projects/{id}/deposits, /projects/{id}/milestone-submissions, /milestone-submissions/{id}/resubmit, /agreements/{id}/execute, /agreements/{id}/extensions, /projects/{id}/withdraw, /projects/{id}/declare-commercial-operation" }
  - { priority: 5, category: state, check: "OCC: expected_project_version must equal the Project's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /interconnection/projects/{id}/agreements" }
  - { priority: 6, category: state, check: "Target resource must be in the required state for this operation", error_id: "varies (ERR_CLUSTER_NOT_ACCEPTING_PROJECTS, ERR_PROJECT_NOT_ACCEPTING_DEPOSITS, ERR_PROJECT_NOT_ACCEPTING_MILESTONES, ERR_PROJECT_NOT_STUDY_COMPLETE, ERR_PROJECT_NOT_READY_FOR_OPERATION, ERR_PROJECT_NOT_WITHDRAWABLE, ERR_PROJECT_NOT_ACCEPTING_CURTAILMENT_LIMITS, ERR_STUDY_INVALID_STATE, ERR_MILESTONE_NOT_PENDING_REVIEW, ERR_MILESTONE_NOT_REJECTED, ERR_AGREEMENT_NOT_ISSUED, ERR_AGREEMENT_NOT_EXECUTED)", http_status: 409, applies_to: "state transition and state-gated endpoints" }
  - { priority: 7, category: business_temporal, check: "Clock-relative deadlines: execute within execution_deadline; extension requested at least 30 days before current target_cod; declare-commercial-operation no later than target_cod", error_id: "ERR_AGREEMENT_EXECUTION_DEADLINE_PASSED | ERR_EXTENSION_WINDOW_MISSED | ERR_COD_DEADLINE_PASSED", http_status: 409, applies_to: "POST /agreements/{id}/execute, /agreements/{id}/extensions, /projects/{id}/declare-commercial-operation" }
  - { priority: 8, category: business_referential, check: "Cross-entity state: agreement issuance requires cluster Study in {RESULTS_PUBLISHED, FINALIZED}; agreement execution requires cluster Study FINALIZED", error_id: "ERR_STUDY_NOT_PUBLISHED | ERR_STUDY_NOT_FINALIZED", http_status: 409, applies_to: "POST /projects/{id}/agreements, POST /agreements/{id}/execute" }
  - { priority: 9, category: business_constraint, check: "Structural constraints: cluster capacity (committed_mw + capacity_mw <= capacity_mw); cluster application windows per region must not overlap (half-open); at most one Study per cluster; at least one READY project at scoping; at most one PENDING_REVIEW/ACCEPTED submission per (project, milestone_type); curtailment effective windows per (project, limit_type) must be disjoint (closed intervals); extension_count < 2; new_target_cod within (target_cod, target_cod + 365 days]; reporting_period unique", error_id: "ERR_CLUSTER_CAPACITY_EXCEEDED | ERR_CLUSTER_WINDOW_OVERLAP | ERR_STUDY_ALREADY_EXISTS | ERR_NO_READY_PROJECTS | ERR_MILESTONE_SUBMISSION_CONFLICT | ERR_CURTAILMENT_WINDOW_OVERLAP | ERR_EXTENSION_LIMIT_REACHED | ERR_REPORTING_PERIOD_CONFLICT | ERR_INVALID_REQUEST", http_status: 409, applies_to: "corresponding create/action endpoints" }
  - { priority: 10, category: business_fiscal, check: "Deposit ledger: a DEPOSIT amount must not push deposit_posted_cents above deposit_required_cents", error_id: ERR_DEPOSIT_OVERPAYMENT, http_status: 422, applies_to: "POST /interconnection/projects/{id}/deposits" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/interconnection/developers"
    description: "Onboard a new interconnection customer"
    roles: [QueueAdministrator]
    code: 201
    input: [legal_name, contact_email, developer_type]
    output: Developer
    side_effects: []

  - method: GET
    path: "/interconnection/developers/{id}"
    description: "Get a developer"
    roles: [Developer, QueueAdministrator, StudyEngineer, Regulator]
    code: 200
    input: []
    output: Developer
    side_effects: []

  - method: GET
    path: "/interconnection/developers/{id}/projects"
    description: "List projects owned by a developer (paginated)"
    roles: [Developer, QueueAdministrator, StudyEngineer, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "Project[]"
    side_effects: []

  - method: POST
    path: "/interconnection/cluster-groups"
    description: "Create a cluster study group with an application window"
    roles: [QueueAdministrator]
    code: 201
    input: [name, region, application_window_open, application_window_close, capacity_mw]
    output: ClusterGroup
    side_effects:
      - "committed_mw initialized to 0; status FORMING"

  - method: GET
    path: "/interconnection/cluster-groups/{id}"
    description: "Get a cluster group"
    roles: [Developer, QueueAdministrator, StudyEngineer, Regulator]
    code: 200
    input: []
    output: ClusterGroup
    side_effects: []

  - method: GET
    path: "/interconnection/cluster-groups/{id}/projects"
    description: "List member projects of a cluster (paginated)"
    roles: [Developer, QueueAdministrator, StudyEngineer, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "Project[]"
    side_effects: []

  - method: GET
    path: "/interconnection/cluster-groups/{id}/studies"
    description: "List studies of a cluster (array of length 0 or 1)"
    roles: [Developer, QueueAdministrator, StudyEngineer, Regulator]
    code: 200
    input: []
    output: "Study[]"
    side_effects: []

  - method: POST
    path: "/interconnection/projects"
    description: "Submit a new interconnection request into a cluster"
    roles: [Developer]
    code: 201
    input: [developer_id, cluster_group_id, project_name, technology, capacity_mw, service_type, point_of_interconnection]
    output: Project
    side_effects:
      - "deposit_required_cents computed via deposit_assessment"
      - "ClusterGroup.committed_mw += capacity_mw"
      - "status SUBMITTED; deposit_posted_cents 0; queue_position null; readiness_satisfied false"

  - method: GET
    path: "/interconnection/projects/{id}"
    description: "Get a project"
    roles: [Developer, QueueAdministrator, StudyEngineer, Regulator]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: POST
    path: "/interconnection/projects/{id}/deposits"
    description: "Post additional deposit funds (DEPOSIT entry); auto-promotes SUBMITTED -> QUEUED when the required amount is reached"
    roles: [Developer]
    code: 201
    input: [amount_cents]
    output: DepositTransaction
    side_effects:
      - "DepositTransaction DEPOSIT created with balance_after_cents"
      - "Project.deposit_posted_cents += amount_cents"
      - "if deposit_posted_cents >= deposit_required_cents and status == SUBMITTED: status -> QUEUED, queue_position assigned"

  - method: GET
    path: "/interconnection/projects/{id}/deposits"
    description: "List the deposit ledger of a project (paginated)"
    roles: [Developer, QueueAdministrator, StudyEngineer, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "DepositTransaction[]"
    side_effects: []

  - method: POST
    path: "/interconnection/projects/{id}/milestone-submissions"
    description: "Submit readiness milestone evidence"
    roles: [Developer]
    code: 201
    input: [milestone_type, evidence_uri]
    output: MilestoneSubmission
    side_effects:
      - "status PENDING_REVIEW"

  - method: GET
    path: "/interconnection/projects/{id}/milestone-submissions"
    description: "List milestone submissions of a project (paginated)"
    roles: [Developer, QueueAdministrator, StudyEngineer, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "MilestoneSubmission[]"
    side_effects: []

  - method: POST
    path: "/interconnection/milestone-submissions/{id}/review"
    description: "Accept or reject a pending milestone submission"
    roles: [QueueAdministrator]
    code: 200
    input: [decision, "review_note?"]
    output: MilestoneSubmission
    side_effects:
      - "status -> ACCEPTED or REJECTED; review_note recorded"
      - "on ACCEPTED: if all required types accepted, project.readiness_satisfied = true; if project QUEUED, project -> READY"

  - method: POST
    path: "/interconnection/milestone-submissions/{id}/resubmit"
    description: "Resubmit evidence for a rejected milestone (REJECTED -> PENDING_REVIEW)"
    roles: [Developer]
    code: 200
    input: [evidence_uri]
    output: MilestoneSubmission
    side_effects:
      - "status -> PENDING_REVIEW; evidence_uri replaced; review_note cleared"

  - method: POST
    path: "/interconnection/cluster-groups/{id}/studies"
    description: "Scope the cluster impact study; enforces readiness (auto-withdraws non-READY members) and creates PROVISIONAL cost shares"
    roles: [StudyEngineer]
    code: 201
    input: [total_cost_cents]
    output: Study
    side_effects:
      - "Study created IN_PROGRESS"
      - "ClusterGroup FORMING -> STUDY_UNDERWAY"
      - "READY members -> IN_STUDY; SUBMITTED/QUEUED members -> WITHDRAWN (10% forfeiture band; no restudy cascade)"
      - "PROVISIONAL CostShare rows created for included members"

  - method: GET
    path: "/interconnection/studies/{id}"
    description: "Get a study"
    roles: [Developer, QueueAdministrator, StudyEngineer, Regulator]
    code: 200
    input: []
    output: Study
    side_effects: []

  - method: POST
    path: "/interconnection/studies/{id}/publish-results"
    description: "Publish study results; members complete the study and cost shares are recomputed under the FINAL basis"
    roles: [StudyEngineer]
    code: 200
    input: []
    output: Study
    side_effects:
      - "Study IN_PROGRESS -> RESULTS_PUBLISHED"
      - "included members IN_STUDY/RESTUDY_REQUIRED -> STUDY_COMPLETE"
      - "CostShare recomputed FINAL basis"

  - method: POST
    path: "/interconnection/studies/{id}/finalize"
    description: "Finalize the study; locks cost shares and advances the cluster"
    roles: [StudyEngineer]
    code: 200
    input: []
    output: Study
    side_effects:
      - "Study RESULTS_PUBLISHED -> FINALIZED"
      - "ClusterGroup STUDY_UNDERWAY -> STUDY_COMPLETE"

  - method: GET
    path: "/interconnection/studies/{id}/cost-shares"
    description: "List cost shares of a study (paginated)"
    roles: [Developer, QueueAdministrator, StudyEngineer, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "CostShare[]"
    side_effects: []

  - method: GET
    path: "/interconnection/projects/{id}/cost-shares"
    description: "List cost shares borne by a project (paginated)"
    roles: [Developer, QueueAdministrator, StudyEngineer, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "CostShare[]"
    side_effects: []

  - method: POST
    path: "/interconnection/projects/{id}/agreements"
    description: "Issue (or re-issue after expiry) an interconnection agreement; OCC-guarded on the project version"
    roles: [QueueAdministrator]
    code: 201
    input: [target_cod, max_injection_mw, "curtailment_hours_cap?", expected_project_version]
    output: InterconnectionAgreement
    side_effects:
      - "InterconnectionAgreement ISSUED; issued_at = logical clock now; execution_deadline = issued_at + 90 days"
      - "Project STUDY_COMPLETE -> AGREEMENT_PENDING (first issuance)"
      - "increments Project.version by 1"

  - method: GET
    path: "/interconnection/projects/{id}/agreements"
    description: "List agreements of a project (paginated)"
    roles: [Developer, QueueAdministrator, StudyEngineer, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "InterconnectionAgreement[]"
    side_effects: []

  - method: POST
    path: "/interconnection/agreements/{id}/execute"
    description: "Developer executes an issued agreement before its deadline"
    roles: [Developer]
    code: 200
    input: []
    output: InterconnectionAgreement
    side_effects:
      - "Agreement ISSUED -> EXECUTED"
      - "Project AGREEMENT_PENDING -> AGREEMENT_EXECUTED"
      - "on deadline breach: agreement -> EXPIRED and the call fails with ERR_AGREEMENT_EXECUTION_DEADLINE_PASSED"

  - method: POST
    path: "/interconnection/agreements/{id}/extensions"
    description: "Request a commercial-operation-date extension (max 2; each <= 365 days; at least 30 days before current target_cod)"
    roles: [Developer]
    code: 201
    input: [new_target_cod]
    output: InterconnectionAgreement
    side_effects:
      - "target_cod replaced with new_target_cod; extension_count += 1"

  - method: POST
    path: "/interconnection/projects/{id}/withdraw"
    description: "Withdraw a project from the queue; applies the forfeiture schedule, compacts queue positions, and triggers restudy when the study is not final"
    roles: [Developer, QueueAdministrator]
    code: 200
    input: []
    output: Project
    side_effects:
      - "Project -> WITHDRAWN (not allowed from COMMERCIAL_OPERATION or WITHDRAWN)"
      - "forfeiture schedule creates FORFEIT/REFUND ledger entries; deposit_posted_cents -> 0"
      - "ClusterGroup.committed_mw -= capacity_mw; queue compaction"
      - "ISSUED agreements of the project -> EXPIRED"
      - "restudy cascade when cluster Study.status in {IN_PROGRESS, RESULTS_PUBLISHED}"

  - method: POST
    path: "/interconnection/projects/{id}/declare-commercial-operation"
    description: "Declare commercial operation at the current logical clock time"
    roles: [Developer]
    code: 200
    input: []
    output: Project
    side_effects:
      - "Project AGREEMENT_EXECUTED -> COMMERCIAL_OPERATION (rejected past target_cod)"
      - "bubble-up: cluster -> CLOSED when all members terminal"

  - method: POST
    path: "/interconnection/projects/{id}/curtailment-limits"
    description: "Record a curtailment/operating-limit condition with a closed effective interval"
    roles: [QueueAdministrator]
    code: 201
    input: [limit_type, max_output_mw, effective_start, effective_end, curtailment_hours_per_year]
    output: CurtailmentLimit
    side_effects: []

  - method: GET
    path: "/interconnection/projects/{id}/curtailment-limits"
    description: "List curtailment limits of a project (paginated)"
    roles: [Developer, QueueAdministrator, StudyEngineer, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "CurtailmentLimit[]"
    side_effects: []

  - method: POST
    path: "/interconnection/transparency-reports"
    description: "Publish an immutable transparency snapshot of queue statistics for a reporting period"
    roles: [QueueAdministrator]
    code: 201
    input: [reporting_period]
    output: TransparencyReport
    side_effects:
      - "snapshot fields computed at creation (see calculations.transparency_snapshot)"

  - method: GET
    path: "/interconnection/transparency-reports/{id}"
    description: "Get a transparency report"
    roles: [Developer, QueueAdministrator, StudyEngineer, Regulator]
    code: 200
    input: []
    output: TransparencyReport
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Startup default is 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default and never falls back to wall-clock time."
    roles: [QueueAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "logical clock advanced to to_iso8601"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_RESOURCE_OWNERSHIP, http: 403, condition: "Developer-role caller does not own the target project" }
  - { id: ERR_DEVELOPER_NOT_FOUND, http: 404, condition: "Developer id does not exist" }
  - { id: ERR_CLUSTER_GROUP_NOT_FOUND, http: 404, condition: "ClusterGroup id does not exist" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "Project id does not exist" }
  - { id: ERR_STUDY_NOT_FOUND, http: 404, condition: "Study id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "InterconnectionAgreement id does not exist" }
  - { id: ERR_MILESTONE_SUBMISSION_NOT_FOUND, http: 404, condition: "MilestoneSubmission id does not exist" }
  - { id: ERR_TRANSPARENCY_REPORT_NOT_FOUND, http: 404, condition: "TransparencyReport id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, non-positive amount/capacity, capacity_mw > 500, target_cod not after issued_at, or new_target_cod outside (target_cod, target_cod + 365 days]" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "application_window_close <= application_window_open, or curtailment effective_end <= effective_start" }
  - { id: ERR_CLUSTER_NOT_ACCEPTING_PROJECTS, http: 409, condition: "ClusterGroup not in FORMING when creating a project or scoping a study" }
  - { id: ERR_CLUSTER_CAPACITY_EXCEEDED, http: 409, condition: "committed_mw + capacity_mw would exceed the cluster capacity_mw" }
  - { id: ERR_CLUSTER_WINDOW_OVERLAP, http: 409, condition: "Application window overlaps another non-CLOSED cluster's window in the same region (half-open semantics; adjacency allowed)" }
  - { id: ERR_STUDY_ALREADY_EXISTS, http: 409, condition: "A Study already exists for this ClusterGroup" }
  - { id: ERR_NO_READY_PROJECTS, http: 409, condition: "Study scoping requires at least one member project in READY" }
  - { id: ERR_STUDY_INVALID_STATE, http: 409, condition: "publish-results requires IN_PROGRESS; finalize requires RESULTS_PUBLISHED" }
  - { id: ERR_STUDY_NOT_PUBLISHED, http: 409, condition: "Agreement issuance requires cluster Study in RESULTS_PUBLISHED or FINALIZED" }
  - { id: ERR_STUDY_NOT_FINALIZED, http: 409, condition: "Agreement execution requires cluster Study FINALIZED" }
  - { id: ERR_PROJECT_NOT_ACCEPTING_DEPOSITS, http: 409, condition: "Deposit posted while project status is not SUBMITTED or QUEUED" }
  - { id: ERR_DEPOSIT_OVERPAYMENT, http: 422, condition: "Deposit would push deposit_posted_cents above deposit_required_cents" }
  - { id: ERR_PROJECT_NOT_ACCEPTING_MILESTONES, http: 409, condition: "Milestone submission while project status is not SUBMITTED or QUEUED" }
  - { id: ERR_MILESTONE_SUBMISSION_CONFLICT, http: 409, condition: "A PENDING_REVIEW or ACCEPTED submission already exists for (project, milestone_type)" }
  - { id: ERR_MILESTONE_NOT_PENDING_REVIEW, http: 409, condition: "Review requires submission in PENDING_REVIEW" }
  - { id: ERR_MILESTONE_NOT_REJECTED, http: 409, condition: "Resubmit requires submission in REJECTED" }
  - { id: ERR_PROJECT_NOT_STUDY_COMPLETE, http: 409, condition: "Agreement issuance requires project STUDY_COMPLETE, or AGREEMENT_PENDING with all prior agreements EXPIRED" }
  - { id: ERR_AGREEMENT_NOT_ISSUED, http: 409, condition: "Execute requires agreement ISSUED" }
  - { id: ERR_AGREEMENT_EXECUTION_DEADLINE_PASSED, http: 409, condition: "Execute attempted after execution_deadline; the agreement transitions to EXPIRED" }
  - { id: ERR_AGREEMENT_NOT_EXECUTED, http: 409, condition: "Extension requires agreement EXECUTED" }
  - { id: ERR_EXTENSION_LIMIT_REACHED, http: 409, condition: "extension_count already at the maximum of 2" }
  - { id: ERR_EXTENSION_WINDOW_MISSED, http: 409, condition: "Extension requested less than 30 days before the current target_cod" }
  - { id: ERR_COD_DEADLINE_PASSED, http: 409, condition: "Commercial operation declared after the (extended) target_cod" }
  - { id: ERR_PROJECT_NOT_READY_FOR_OPERATION, http: 409, condition: "declare-commercial-operation requires project AGREEMENT_EXECUTED" }
  - { id: ERR_PROJECT_NOT_WITHDRAWABLE, http: 409, condition: "Withdraw not allowed from COMMERCIAL_OPERATION or WITHDRAWN" }
  - { id: ERR_PROJECT_NOT_ACCEPTING_CURTAILMENT_LIMITS, http: 409, condition: "Curtailment limit requires project AGREEMENT_EXECUTED or COMMERCIAL_OPERATION" }
  - { id: ERR_CURTAILMENT_WINDOW_OVERLAP, http: 409, condition: "Effective interval overlaps an existing limit of the same project and limit_type (closed intervals; touching endpoints count as overlap)" }
  - { id: ERR_REPORTING_PERIOD_CONFLICT, http: 409, condition: "A TransparencyReport already exists for this reporting_period" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_project_version does not match the Project's current version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Developer
    description: "Interconnection customer; acts on its own projects, deposits, milestones, and agreements"
    identity: "entity_backed:Developer"
    exclusive_operations:
      - "POST /interconnection/projects — submit interconnection request"
      - "POST /interconnection/projects/{id}/deposits — post deposit funds"
      - "POST /interconnection/projects/{id}/milestone-submissions — submit readiness evidence"
      - "POST /interconnection/milestone-submissions/{id}/resubmit — resubmit rejected evidence"
      - "POST /interconnection/agreements/{id}/execute — execute agreement"
      - "POST /interconnection/agreements/{id}/extensions — request COD extension"
      - "POST /interconnection/projects/{id}/declare-commercial-operation — declare COD"
    shared_operations:
      - "POST /interconnection/projects/{id}/withdraw — withdraw own project (shared with QueueAdministrator)"
      - "All GET endpoints (shared with all roles)"

  - name: QueueAdministrator
    description: "ISO/utility queue staff; onboards developers, manages clusters, reviews milestones, issues agreements, sets operating limits, publishes transparency reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /interconnection/developers — onboard developer"
      - "POST /interconnection/cluster-groups — create cluster study group"
      - "POST /interconnection/milestone-submissions/{id}/review — review milestone evidence"
      - "POST /interconnection/projects/{id}/agreements — issue / re-issue agreement"
      - "POST /interconnection/projects/{id}/curtailment-limits — record operating limit"
      - "POST /interconnection/transparency-reports — publish transparency snapshot"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /interconnection/projects/{id}/withdraw — administrative withdrawal (shared with Developer)"
      - "All GET endpoints (shared with all roles)"

  - name: StudyEngineer
    description: "ISO/utility engineering staff; scopes studies, publishes results, finalizes studies"
    identity: "opaque"
    exclusive_operations:
      - "POST /interconnection/cluster-groups/{id}/studies — scope the cluster study"
      - "POST /interconnection/studies/{id}/publish-results — publish study results"
      - "POST /interconnection/studies/{id}/finalize — finalize study"
    shared_operations:
      - "All GET endpoints (shared with all roles)"

  - name: Regulator
    description: "Oversight body with read-only access to the queue and transparency reports"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints (shared with all roles)"
