            - "TermSheetRound.${late_round} stays EXPIRED and is never answerable, so the lapsed round is closed by re-issuance rather than by a late answer"

      - name: instrument_tenor_rule_binds_letters_and_guarantees_but_exempts_cash
        claim_type: conditional_validation
        grounds:
          - validations.priority_21_ERR_INSTRUMENT_TENOR_TOO_SHORT
          - calculations.lifecycle_deadlines
          - endpoints.POST_/ppa/credit-support/{id}/post
          - entities.CreditSupportInstrument.fields.instrument_type
        distinguishing_aspect: |
          The same 30-day tenor is fatal for a letter of credit and irrelevant for cash,
          because the rule is conditioned on instrument_type - cash in hand needs no
          remaining tenor. The AAA issuer keeps the eligibility limb satisfied so that
          the tenor limb is unambiguously the one that fires, and the boundary is walked
          on both sides: exactly MIN_TENOR_DAYS (365) whole days from the clock passes,
