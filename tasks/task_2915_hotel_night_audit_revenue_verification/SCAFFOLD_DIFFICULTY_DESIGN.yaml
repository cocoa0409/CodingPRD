            - call: "POST /night-audit/business-dates"
              payload: { property_id: "${prop_id}", business_date: "2026-08-01", out_of_order_room_count: 4 }
              as: NightAuditor
              as_user_id: "u_na_1"
              captures: { bd1_id: "$.data.id" }
          trigger: "POST /night-audit/business-dates/00000000-0000-4000-8000-0000000000ff/reopen as FrontDeskAgent (X-User-ID u_fd_1)."
          assert:
            - "The trigger fails with HTTP 403 and error code ERR_UNAUTHORIZED, not 404 ERR_BUSINESS_DATE_NOT_FOUND - the caller learns nothing about whether that id exists."
            - "Repeating the same non-existent path as Controller (X-User-ID u_ctl_1) then returns 404 ERR_BUSINESS_DATE_NOT_FOUND, proving the existence check is live and was merely outranked."
            - "Calling reopen on the real ${bd1_id} as Controller returns 409 ERR_DATE_NOT_CLOSED, because that date is still OPEN - showing all three bands ordered auth, existence, state."
            - "GET /night-audit/business-dates/${bd1_id} still returns status == OPEN and reopen_count == 0."

  - rule_id: boundary_precision_check
    instances:

      - name: allowance_manager_threshold_inclusive_at_two_fifty
        grounds: "§1.3 calculation allowance_approval_tier ('the comparison is >= so requested_amount 250.00 against allowance_manager_threshold_amount 250.00 requires RevenueManager, while 249.99 does not'); §1.4 priority 52 ERR_APPROVAL_TIER_INSUFFICIENT."
        distinguishing_aspect: >-
          An inclusive >= money threshold whose failure mode is an authorization outcome rather
          than a number: one cent decides which role may approve. The two sides are exercised on
          the same folio in the same request sequence so nothing but requested_amount differs.
        test_recipe:
          setup: "Standard property (allowance_manager_threshold_amount 250.00); business date 2026-08-01 in ROOM_POSTING; one CASH folio at rate 200.00 with room and tax posted; two allowances raised by FrontDeskAgent u_fd_1 on that folio for exactly 250.00 and for 249.99, both submitted."
          setup_api_calls:
