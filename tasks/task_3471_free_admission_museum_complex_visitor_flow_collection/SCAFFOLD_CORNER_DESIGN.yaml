        distinguishing_aspect: "One visitor may hold only one non-terminal pass per museum per date: the second reservation for the same (visitor_name, museum, visit_date) fails 409 even when it targets a different, empty slot."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Timed museum quotas 5/20; one RESERVED pass for 'Repeat Visitor' on 2026-09-20 slot 1."
          setup_api_calls:
