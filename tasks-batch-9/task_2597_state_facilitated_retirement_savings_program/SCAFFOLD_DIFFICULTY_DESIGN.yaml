          setup:
            - "Program year 2026; Rosa Lim enrolled and ACTIVE with a ROTH_IRA account"
            - "A posted remittance of 600000 cents plus a 600000-cent earnings posting leave balance_cents 1200000 and contribution_basis_cents 600000, so PROGRAM_CASH (balance plus in-transit) is 1200000 with nothing in flight"
