      customer's orders with pagination fields present.
    test_recipe:
      setup:
      - two customers; one order for the first customer
      setup_api_calls:
      - call: POST /agents
        payload:
          legal_name: Booking Co
          agent_code: CB02
          capabilities:
          - BOOKING
          home_market: Chicago
        as: VanLineAdmin
        captures:
          ag_b: $.data.id
      - call: POST /customers
        payload:
          full_name: Cust A
          email: ca@x.com
          phone: 555-2001
        as: VanLineAdmin
        captures:
          cust_a: $.data.id
      - call: POST /customers
        payload:
          full_name: Cust B
          email: cb@x.com
          phone: 555-2002
        as: VanLineAdmin
        captures:
          cust_b: $.data.id
      - call: POST /tariffs
        payload:
          tariff_code: T-C2
          effective_start: '2026-01-01T00:00:00Z'
          effective_end: '2027-01-01T00:00:00Z'
          base_rate_cents_per_cwt: 4500
          mileage_bands:
          - min_miles: 0
            max_miles: 999999
            rate_multiplier: 1.0
          fuel_surcharge_pct: 0.1
          sit_daily_rate_cents_per_cwt: 250
          hourly_labor_rate_cents: 4000
        as: VanLineAdmin
        captures:
          tar: $.data.id
      - call: POST /tariffs/${tar}/publish
        payload: {}
        as: VanLineAdmin
      - call: POST /orders
        payload:
          customer_id: ${cust_a}
          tariff_id: ${tar}
          pricing_mode: BINDING
          origin_city: Chicago
          origin_state: IL
          destination_city: Denver
          destination_state: CO
          mileage: 900
          pickup_date: '2026-06-10T00:00:00Z'
        as: BookingAgent
        as_user_id: ${ag_b}
        captures:
          ord: $.data.id
      trigger:
      - call: GET /orders
        payload:
          customer_id: ${cust_a}
        as: VanLineAdmin
      - call: GET /orders
        payload:
          customer_id: ${cust_b}
        as: VanLineAdmin
      assert:
      - GET /orders?customer_id=${cust_a} returns total_count == 1 with data[0].id
        == ${ord}
      - GET /orders?customer_id=${cust_b} returns total_count == 0 and has_more ==
        false
  - name: get_missing_order_returns_not_found
    claim_type: not_found
    grounds:
    - validations[priority=4]
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: A well-formed UUID that was never registered yields ERR_NOT_FOUND
      (404), not a validation error.
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: POST /agents
        payload:
          legal_name: B
          agent_code: CB03
          capabilities:
          - BOOKING
          home_market: X
        as: VanLineAdmin
      trigger:
      - call: GET /orders/00000000-0000-0000-0000-000000000000
        as: VanLineAdmin
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_NOT_FOUND with http 404
  - name: estimate_create_rejected_missing_required_weight
