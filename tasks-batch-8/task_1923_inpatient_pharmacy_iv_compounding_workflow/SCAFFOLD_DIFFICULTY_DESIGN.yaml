              payload: { hood_session_id: "${sess_id}", order_ids: ["${o1}", "${o2}", "${o3}", "${o4}"], usp_risk_level: "LOW" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy/batches/${batch_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /pharmacy/batches/${batch_id}/complete"
              payload: { prepared_volumes_ml: [0.3, 0.2, 0.3, 1.5], waste_ml: 7.7, storage_condition: "REFRIGERATED" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { run1_drawn: $.data.total_drawn_ml, run1_waste: $.data.waste_ml, run1_ovg: $.data.overage_pct }
            - call: "POST /pharmacy/batches/${batch_id}/qa-reject"
              payload: { reason: "labeling defect" }
              as: Pharmacist
              as_user_id: "${pharm_id}"
            - call: "POST /pharmacy/batches/${batch_id}/rework"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/batches/${batch_id}/start"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/batches/${batch_id}/complete"
              payload: { prepared_volumes_ml: [0.3, 0.2, 0.3, 1.5], waste_ml: 7.7, storage_condition: "REFRIGERATED" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
            - call: "POST /pharmacy/batches/${batch_id}/qa-release"
              payload: {}
              as: Pharmacist
              as_user_id: "${pharm_id}"
              captures: { fin_status: $.data.status }
            - call: "GET /pharmacy/batches/${batch_id}"
              payload: {}
              as: Pharmacist
              captures: { fin_drawn: $.data.total_drawn_ml, fin_del: $.data.delivered_ml, fin_waste: $.data.waste_ml }
          assert:
            - "first run: overage_pct == 77.0 (7.7/10.0*100) — would fail SMALL-tier release at 60% tolerance if attempted"
            - "after reject+rework+recomplete+release: status == RELEASED"
            - "invariant: total_drawn_ml == 20.0 == delivered_ml 2.3 + waste_ml 17.7 (7.7 + 2.3 rejected + 7.7)"
            - "GET /pharmacy/batches/${batch_id}/waste-records returns rows covering both the completion waste and the QA_REJECT waste"
