            - "LiabilityAssessment.${la_id}.lifecycle_status == DRAFT"
            - "WithdrawalEvent.${we_id}.status == COMPLETE_DETERMINED (the failed attempt left it untouched)"

      - name: construction_complete_withdrawal_requires_employer_still_performing_covered_work
