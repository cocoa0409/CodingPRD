              as_user_id: "${appl_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "GET /fee-assessments?application_id=${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { exec: "$.data[0].execution_fee_cents", total: "$.data[0].total_due_cents" }
          assert:
            - "Application.${app_id}.requires_execution == false"
            - "FeeAssessment.execution_fee_cents == 0"
            - "FeeAssessment.total_due_cents == 13000"

      - name: fee_card_new_execution_only_no_delivery_default
        claim_type: Constants Applied
        grounds:
          - calculations.fee_assessment
          - entities.FeeAssessment.fields.one_day_delivery
          - entities.FeeAssessment.fields.one_day_delivery_cents
        distinguishing_aspect: "one_day_delivery defaults false at submit (no input field on POST /applications), so one_day_delivery_cents==0; an adult NEW CARD ROUTINE totals 3000 base + 3500 execution == 6500, exercising the CARD_ADULT_CENTS and EXECUTION_FEE_CENTS constants with the delivery component at its default-zero branch."
