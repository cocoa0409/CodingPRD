              payload: { content_item_id: "${ci_id}", policy_category_code: "VIOLENT_THREAT", classifier_id: "clf-violence-1", classifier_confidence: 0.7000 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { sig_id: $.data.id, case_id: $.data.resulting_case_id }
            - call: "GET /moderation/moderation-cases/${case_id}"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { c_v: $.data.version }
            - call: "POST /moderation/moderation-cases/${case_id}/assign"
              payload: { expected_case_version: "${c_v}", target_reviewer_id: "${r1_id}" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/policy-versions"
              payload: { policy_category_id: "${cat_id}", version_label: "v2", auto_action_threshold: 0.9000, review_floor: 0.4000, enforcement_action: "REMOVE", appeal_window_hours: 24, review_sla_minutes: 60, requires_recertification: false }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { pv2_id: $.data.id }
            - call: "POST /moderation/policy-versions/${pv2_id}/back-test"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/policy-versions/${pv2_id}/activate"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-bob"
          trigger:
            - call: "POST /moderation/moderation-cases/${case_id}/decide"
              payload: { outcome: "REMOVE" }
              as: Reviewer
              as_user_id: "${r1_id}"
          assert:
            - "PolicyVersion ${pv2_id}.backtest_sample_size == 0 and backtest_divergence_rate == 0.0000, and its activation returned 200"
            - "PolicyVersion ${pv1_id}.status == SUPERSEDED, ${pv2_id}.status == ACTIVE, PolicyCategory ${cat_id}.active_version_id == ${pv2_id}"
            - "Reviewer ${r1_id}.certified_policy_version_ids == [${pv1_id}] and pending_retraining_version_ids == [] and status ACTIVE — requires_recertification false touched nothing"
            - "ModerationCase ${case_id}.requires_recertified_review == false, policy_version_id still ${pv1_id}, and the decide returns 200 on the v1 certification alone"
            - "ModerationCase ${case_id}.appeal_deadline_at == 2026-08-04T09:00:00Z — decided_at 2026-08-01T09:00:00Z plus v1's 72 hours, NOT v2's 24 hours (which would give 2026-08-02T09:00:00Z)"
            - "ModerationCase ${case_id}.sla_due_at is still 2026-08-01T11:00:00Z and sla_breached == false — the pinned 240-minute base, halved by the T2 divisor, is untouched by v2's 60"
            - "ModerationCase ${case_id}.strike_points_applied == 4 and Account ${acct_id}.strike_points == 4 with standing LIMITED"
      - name: activation_cascade_chain_covered_by_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PolicyVersion.transitions.BACKTESTING_to_ACTIVE
        excluded_because:
          difficulty_instance: policy_activation_cascade_supersede_decert_and_case_recert_flag
          rationale: "The three-level supersede -> decertify -> case-flag chain and its ordering are asserted end-to-end by the named §1.8 instance."
      - name: transparency_two_variant_layer_covered_by_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - calculations.transparency_enforcement_volumes
        excluded_because:
          difficulty_instance: transparency_provisional_vs_restated_volume_diverge
          rationale: "Both variants over one dataset, their delta, and the reconciliation on restatement are asserted by the named §1.8 instance."
  - section: consistency_model
    instances:
      - name: decide_cascade_is_visible_on_immediate_reads_without_a_clock_advance
        claim_type: immediate
        grounds:
          - state_machines.ModerationCase.transitions.ASSIGNED_to_DECIDED
          - calculations.account_strike_ledger
          - calculations.account_standing_posture
        distinguishing_aspect: "Every denormalised counter the decide touches — account, content item, reviewer and queue — is correct on a read issued straight after the write with the logical clock still at 2026-08-01T09:00:00Z, so nothing is deferred to a later sweep."
        test_recipe:
          setup:
            - "CHAIN-A base, case and assignment; the logical clock stays at 2026-08-01T09:00:00Z for the whole instance."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/accounts"
              payload: { external_handle: "acct_1", region_code: "US", tier: "STANDARD" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { acct_id: $.data.id }
            - call: "POST /moderation/policy-categories"
              payload: { code: "VIOLENT_THREAT", name: "Violent Threat", severity_tier: "T2", specialty: "VIOLENCE" }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { cat_id: $.data.id }
            - call: "POST /moderation/policy-versions"
              payload: { policy_category_id: "${cat_id}", version_label: "v1", auto_action_threshold: 0.9000, review_floor: 0.4000, enforcement_action: "REMOVE", appeal_window_hours: 72, review_sla_minutes: 240 }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { pv1_id: $.data.id }
            - call: "POST /moderation/policy-versions/${pv1_id}/back-test"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/policy-versions/${pv1_id}/activate"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-bob"
            - call: "POST /moderation/review-queues"
              payload: { name: "EN Violence", policy_category_id: "${cat_id}", language: "EN", specialty: "VIOLENCE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { q_id: $.data.id }
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Rita", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "FRONTLINE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { r1_id: $.data.id, r1_v: $.data.version }
            - call: "POST /moderation/reviewers/${r1_id}/certifications"
              payload: { policy_version_id: "${pv1_id}", expected_reviewer_version: "${r1_v}" }
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/content-items"
              payload: { account_id: "${acct_id}", language: "EN", media_kind: "TEXT", graphic_weight: 2 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { ci_id: $.data.id }
            - call: "POST /moderation/detection-signals"
              payload: { content_item_id: "${ci_id}", policy_category_code: "VIOLENT_THREAT", classifier_id: "clf-violence-1", classifier_confidence: 0.7000 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { sig_id: $.data.id, case_id: $.data.resulting_case_id }
            - call: "GET /moderation/moderation-cases/${case_id}"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { c_v: $.data.version }
            - call: "POST /moderation/moderation-cases/${case_id}/assign"
              payload: { expected_case_version: "${c_v}", target_reviewer_id: "${r1_id}" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          trigger:
            - call: "POST /moderation/moderation-cases/${case_id}/decide"
              payload: { outcome: "REMOVE" }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "GET /moderation/accounts/${acct_id}"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "GET /moderation/content-items/${ci_id}"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "GET /moderation/reviewers/${r1_id}"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "GET /moderation/review-queues/${q_id}"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          assert:
            - "the decide response itself carries status DECIDED, decided_at 2026-08-01T09:00:00Z, strike_points_applied 4 and appeal_deadline_at 2026-08-04T09:00:00Z"
            - "Account ${acct_id}: lifetime_removed_count 1, strike_points 4, standing LIMITED, appeal_credits_remaining 3"
            - "ContentItem ${ci_id}: visibility_status REMOVED, review_status ACTIONED, open_case_count 0"
            - "Reviewer ${r1_id}: open_case_count 0, exposure_points_today 2 (exposure is never refunded), status ACTIVE"
            - "ReviewQueue ${q_id}: open_case_count 0, unassigned_case_count 0"
            - "no clock-set call occurs between the write and the reads, so none of these values can be attributed to a later recompute"
