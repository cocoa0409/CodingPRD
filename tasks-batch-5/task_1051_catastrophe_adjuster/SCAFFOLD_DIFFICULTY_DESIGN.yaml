            - { call: "POST /claims", payload: { claim_number: "C-8", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "RCV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T10:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/start", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections/${insp_id}/complete", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /estimates", payload: { inspection_id: "${insp_id}", claim_id: "${claim_id}", line_items: [ { description: "L1", rcv_cents: 4000000, depreciation_pct: 0 } ] }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { est_id: $.data.id } }
            - { call: "POST /estimates/${est_id}/approve", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /reports", payload: { inspection_id: "${insp_id}", assignment_id: "${asg_id}", scope_narrative: "s", photo_count: 2 }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { rpt_id: $.data.id } }
            - { call: "POST /reports/${rpt_id}/submit", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /reports/${rpt_id}/qa-decision", payload: { decision: "APPROVED", qa_notes: "ok" }, as: QAReviewer, as_user_id: "${qa_id}" }
            - { call: "GET /assignments/${asg_id}", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { asg_ver: $.data.version } }
            - { call: "POST /fee-bills", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", fee_schedule_id: "${fs_id}", billing_method: "FEE_SCHEDULE", expected_assignment_version: "${asg_ver}" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { bill_id: $.data.id } }
