            - "First verify: HTTP 409 with data.error_id == ERR_RATE_PLAN_STATE_INVALID, ChannelMapping.${map_id}.mapping_state stays DRAFT and its version is unchanged"
            - "activate: RatePlan.${bar_id}.plan_state == ACTIVE"
            - "Second verify: HTTP 200 with ChannelMapping.${map_id}.mapping_state == VERIFIED, verified_at == 2026-08-25T00:00:00.000Z, parity_state still IN_PARITY"

  # =====================================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: restriction_closed_date_ranges_are_mutually_exclusive_per_scope_key
        grounds:
          - endpoints[POST /distribution/restrictions]
          - errors[ERR_RESTRICTION_WINDOW_OVERLAP]
          - entities.Restriction.fields.origin
          - validations[priority=17]
        distinguishing_aspect: |
          Resource entity Restriction, interval semantics CLOSED [start_date, end_date] on whole dates:
          two windows conflict when they share even one date, so end_date == other.start_date IS an
          overlap while a one-day gap is not, and exclusivity is keyed on the full tuple
          (room_type_id, rate_plan_id, restriction_type, origin) - the same dates are legal again for a
          plan-scoped or differently-typed restriction.
        test_recipe:
          setup:
            - "Property HTL-SFO at logical clock 2026-08-25T00:00:00.000Z with booking_horizon_days 365, so every date below is inside the horizon."
            - "Room type KING; rate plan BAR ACTIVE (needed only as an alternative restriction scope)."
            - "No VERIFIED mappings exist, so each accepted restriction still queues its RESTRICTION DistributionBatch but with total_jobs 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/restrictions"
              payload: { room_type_id: "${king_id}", restriction_type: "MIN_STAY", value_nights: 2, start_date: "2026-09-10", end_date: "2026-09-12" }
              as: RevenueManager
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /distribution/restrictions"
              payload: { room_type_id: "${king_id}", restriction_type: "MIN_STAY", value_nights: 3, start_date: "2026-09-12", end_date: "2026-09-14" }
              as: RevenueManager
            - call: "POST /distribution/restrictions"
              payload: { room_type_id: "${king_id}", restriction_type: "MIN_STAY", value_nights: 3, start_date: "2026-09-13", end_date: "2026-09-14" }
              as: RevenueManager
              captures: { r3_id: $.data.id }
            - call: "POST /distribution/restrictions"
              payload: { room_type_id: "${king_id}", rate_plan_id: "${bar_id}", restriction_type: "MIN_STAY", value_nights: 3, start_date: "2026-09-10", end_date: "2026-09-12" }
              as: RevenueManager
              captures: { r4_id: $.data.id }
            - call: "POST /distribution/restrictions"
              payload: { room_type_id: "${king_id}", restriction_type: "CLOSED_TO_ARRIVAL", start_date: "2026-09-10", end_date: "2026-09-12" }
              as: RevenueManager
              captures: { r5_id: $.data.id }
            - call: "GET /distribution/restrictions"
              payload: { room_type_id: "${king_id}", restriction_state: "ACTIVE" }
              as: RevenueManager
          assert:
            - "Setup restriction: Restriction.${r1_id}.restriction_state == ACTIVE, origin == MANUAL, rate_plan_id == null, value_nights == 2"
            - "2026-09-12..2026-09-14 on the same scope key: HTTP 409 with data.error_id == ERR_RESTRICTION_WINDOW_OVERLAP - sharing the single date 2026-09-12 is enough, because both bounds are inclusive"
            - "2026-09-13..2026-09-14 on the same scope key: HTTP 201 - a zero-day gap is adjacency, not overlap, so Restriction.${r3_id}.restriction_state == ACTIVE"
            - "2026-09-10..2026-09-12 scoped to rate_plan_id ${bar_id}: HTTP 201, because (room_type_id, rate_plan_id, restriction_type, origin) differs from the null-plan key of ${r1_id}"
            - "CLOSED_TO_ARRIVAL over the identical 2026-09-10..2026-09-12 range: HTTP 201, and Restriction.${r5_id}.value_nights == null (value_nights must be omitted for this type)"
            - "GET /distribution/restrictions?room_type_id=${king_id}&restriction_state=ACTIVE returns total_count == 4 with data holding exactly ${r1_id}, ${r3_id}, ${r4_id} and ${r5_id} - only the one rejected window is absent"

      - name: allotment_ranges_may_overlap_freely_until_the_aggregate_ceiling_binds
        grounds:
          - calculations.allocation_aggregate_capacity_check
          - calculations.inventory_pool_state
          - errors[ERR_ALLOCATION_EXCEEDS_CEILING]
          - concurrency_rules[allocation-create-stale-room-type]
        distinguishing_aspect: |
          Resource entity ChannelAllocation over the same CLOSED date ranges, but with the opposite
          exclusivity rule: overlapping allotments from different channels are perfectly legal and are
          instead summed per date, so what fails is a per-date AGGREGATE against
          overbooking_ceiling_units - and only the dates in the intersection fail, which is why a
          one-day request lands on the single saturated date.
        test_recipe:
          setup:
            - "Property HTL-SFO with overbooking_pct_bp 1000; room type KING capacity 10 -> overbooking_ceiling_units 11 on every day."
            - "Inventory days 2026-09-10, 2026-09-11, 2026-09-12 and 2026-09-13 open, all with committed_units 0."
            - "Three channels with HEALTHY connections: OTA1 (OTA_PUBLIC), BRAND (DIRECT_BRAND) and OPQ1 (OTA_OPAQUE)."
          setup_api_calls:
