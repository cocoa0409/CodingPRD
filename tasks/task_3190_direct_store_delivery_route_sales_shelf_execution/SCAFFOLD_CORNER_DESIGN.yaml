              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_id}", lot_code: "L-1", expiration_date: "2026-09-20", loaded_cases: 10 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/route-days/${day_id}/start"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/promo-agreements"
              payload: { store_id: "${store_id}", product_id: "${prod_id}", window_start: "2026-09-01", window_end: "2026-09-10", display_type: "ENDCAP", rebate_cents: 5000 }
              as: RouteSupervisor
              captures: { agr_id: $.data.id, agr_v1: $.data.version }
            - call: "POST /dsd/promo-agreements/${agr_id}/activate"
              payload: {}
              as: RouteSupervisor
              captures: { agr_v2: $.data.version }
            - call: "POST /dsd/promo-executions"
              payload: { agreement_id: "${agr_id}", route_day_id: "${day_id}", photo_url: "https://photos/one.jpg", expected_promo_agreement_version: "${agr_v2}" }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
          trigger:
            - call: "POST /dsd/promo-executions"
              payload: { agreement_id: "${agr_id}", route_day_id: "${day_id}", photo_url: "https://photos/two.jpg", expected_promo_agreement_version: "${agr_v2}" }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 and err == ERR_STALE_VERSION (the first submission bumped the agreement version; OCC precedes the pending-execution state check)"

      - name: cascade_lot_open_on_start_observable_immediately
        claim_type: Violation → Error
        grounds:
          - state_machines.TruckInventoryLot.SEALED_to_OPEN
        distinguishing_aspect: "Cascading side effect of start: every lot flips SEALED -> OPEN; the pre-start lot is observable as SEALED via the filtered list before the transition."
        test_recipe:
          setup: ["Clock at default; full setup; day loaded with one lot but not started."]
          setup_api_calls:
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 500, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_id}", lot_code: "L-1", expiration_date: "2026-09-20", loaded_cases: 10 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "GET /dsd/truck-lots"
              payload: { route_day_id: "${day_id}" }
              as: RouteSupervisor
              captures: { lot_id: "$.data[0].id" }
          trigger:
            - call: "POST /dsd/route-days/${day_id}/start"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "GET /dsd/truck-lots/${lot_id}"
              payload: {}
              as: RouteSupervisor
          assert:
            - "TruckInventoryLot.${lot_id}.status == OPEN after start (was SEALED after load)"
            - "RouteDay.${day_id}.status == IN_PROGRESS"

      - name: derived_fields_reconciled_on_credit_approval_immediately
        claim_type: Violation → Error
        grounds:
          - entities.TruckInventoryLot.fields.remaining_cases
          - state_machines.StaleCredit.PENDING_APPROVAL_to_APPROVED
        excluded_because:
          difficulty_instance: credit_approval_reopens_balanced_settlement_via_lot_and_day
          rationale: "The §1.8 cascade instance asserts the lot stale_pulled mutation, day recompute, and settlement recompute in the same request."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: delivery_effects_visible_in_same_read_after_write
        claim_type: Violation → Error
        grounds:
          - complexity_profile.consistency_model
          - state_machines.StoreOrder.SUBMITTED_to_DELIVERED
        distinguishing_aspect: "Immediate consistency: the deliver response itself and a follow-up GET show identical delivered quantities, day totals, and lot allocations with no asynchronous lag."
        test_recipe:
          setup: ["Clock 2026-09-01T09:00:00Z; full setup; 30 cases loaded; order of 12 submitted."]
          setup_api_calls:
            - call: "POST /dsd/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dsd/reps"
              payload: { full_name: "Rep One", home_depot: "DEP-1" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /dsd/stores"
              payload: { store_code: "SA", name: "Store A", format: "GROCERY", credit_policy: "FULL_RETAIL", delivery_window_start_minute: 480, delivery_window_end_minute: 720, store_credit_cap_cents: 100000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /dsd/products"
              payload: { sku: "P-1", name: "Chips", case_price_cents: 500, shelf_life_days: 60 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /dsd/routes"
              payload: { territory_code: "T-1", rsr_id: "${rep_id}", base_capacity_cases: 100, truck_cap_cases: 200 }
              as: RouteSupervisor
              captures: { route_id: $.data.id }
            - call: "POST /dsd/route-assignments"
              payload: { route_id: "${route_id}", store_id: "${store_id}", service_weekdays: ["TUE"], stop_sequence: 1 }
              as: RouteSupervisor
            - call: "POST /dsd/route-days"
              payload: { route_id: "${route_id}", service_date: "2026-09-01" }
              as: RouteSupervisor
              captures: { day_id: $.data.id }
            - call: "POST /dsd/route-days/${day_id}/load"
              payload: { lots: [{ product_id: "${prod_id}", lot_code: "L-1", expiration_date: "2026-09-20", loaded_cases: 30 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/route-days/${day_id}/start"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "POST /dsd/orders"
              payload: { route_day_id: "${day_id}", store_id: "${store_id}", lines: [{ product_id: "${prod_id}", qty_cases: 12 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
              captures: { order_id: $.data.id }
            - call: "POST /dsd/orders/${order_id}/submit"
              payload: {}
              as: RouteSalesRep
              as_user_id: "${rep_id}"
          trigger:
            - call: "POST /dsd/orders/${order_id}/deliver"
              payload: { lines: [{ product_id: "${prod_id}", qty_cases: 12 }] }
              as: RouteSalesRep
              as_user_id: "${rep_id}"
            - call: "GET /dsd/route-days/${day_id}"
              payload: {}
              as: RouteSupervisor
          assert:
            - "the deliver response body has status DELIVERED and gross_total_cents == 6000"
            - "the follow-up GET shows RouteDay.${day_id}.delivered_cases == 12 immediately (no eventual-consistency window)"
