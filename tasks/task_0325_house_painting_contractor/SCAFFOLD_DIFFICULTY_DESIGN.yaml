  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_double_book_buffer_gap_required
        grounds:
          - validations[priority=9]
          - errors[ERR_CREW_DOUBLE_BOOKED]
          - entities.CrewAssignment.fields.crew_member_id
        distinguishing_aspect: |
          CrewMember resource with buffer-gap interval semantics: a second assignment starting the day right
          after the first ends ([03-10,03-12] then [03-13,03-14]) is rejected ERR_CREW_DOUBLE_BOOKED because a
          >=1 free day buffer is required (adjacency is a conflict), unlike Equipment's closed-interval rule.
        test_recipe:
          setup:
            - "Crew member M1 SCHEDULED on [2026-03-10,2026-03-12] under project; second assignment is back-to-back."
          setup_api_calls:
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR" }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/crew-members"
              payload: { full_name: "Pat Painter", skill_level: "MASTER", daily_rate_cents: 50000 }
              as: ProjectManager
              captures: { cm1: $.data.id }
            - call: "POST /painting/crew-assignments"
              payload: { project_id: "${proj}", crew_member_id: "${cm1}", start_date: "2026-03-10", end_date: "2026-03-12" }
              as: ProjectManager
              captures: { ca1: $.data.id }
          trigger:
            - call: "POST /painting/crew-assignments"
              payload: { project_id: "${proj}", crew_member_id: "${cm1}", start_date: "2026-03-13", end_date: "2026-03-14" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_CREW_DOUBLE_BOOKED (no buffer day between 03-12 and 03-13)"

      - name: equipment_overbook_aggregate_capacity
        grounds:
          - validations[priority=10]
          - errors[ERR_EQUIPMENT_OVERBOOKED]
          - entities.Equipment.fields.total_units
        distinguishing_aspect: |
          Equipment resource with aggregate-capacity, closed-interval semantics (no buffer): with total_units=1,
          a second assignment whose window OVERLAPS the first (peak 2 > 1) is rejected ERR_EQUIPMENT_OVERBOOKED;
          unlike crew, mere adjacency is allowed and capacity (not a buffer) governs.
        test_recipe:
          setup:
            - "Equipment E1 total_units=1; assignment ca1 holds E1 on [2026-03-10,2026-03-12] with crew M1."
          setup_api_calls:
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR" }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/crew-members"
              payload: { full_name: "Pat Painter", skill_level: "MASTER", daily_rate_cents: 50000 }
              as: ProjectManager
              captures: { cm1: $.data.id }
            - call: "POST /painting/crew-members"
              payload: { full_name: "Jo Painter", skill_level: "MASTER", daily_rate_cents: 50000 }
              as: ProjectManager
              captures: { cm2: $.data.id }
            - call: "POST /painting/equipment"
              payload: { name: "AirlessSprayer-A", equipment_kind: "SPRAYER", total_units: 1 }
              as: ProjectManager
              captures: { e1: $.data.id }
            - call: "POST /painting/crew-assignments"
              payload: { project_id: "${proj}", crew_member_id: "${cm1}", equipment_id: "${e1}", start_date: "2026-03-10", end_date: "2026-03-12" }
              as: ProjectManager
              captures: { ca1: $.data.id }
          trigger:
            - call: "POST /painting/crew-assignments"
              payload: { project_id: "${proj}", crew_member_id: "${cm2}", equipment_id: "${e1}", start_date: "2026-03-11", end_date: "2026-03-13" }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "data.error_id == ERR_EQUIPMENT_OVERBOOKED (overlap peak 2 exceeds total_units 1)"

