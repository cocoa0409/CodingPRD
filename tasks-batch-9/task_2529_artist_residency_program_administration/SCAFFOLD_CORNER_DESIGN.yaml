              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { s_a: "$.data.id" }
            - call: "POST /studios"
              payload: { code: "S-B", capability_tags: ["WELDING", "KILN"], ventilation_class: "FUME_HOOD", max_concurrent_residents: 1, status: "AVAILABLE" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { s_b: "$.data.id" }
            - call: "POST /studios"
              payload: { code: "S-C", capability_tags: ["WELDING", "KILN"], ventilation_class: "LOCAL", max_concurrent_residents: 1, status: "AVAILABLE" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { s_c: "$.data.id" }
            - call: "POST /studios"
              payload: { code: "S-D", capability_tags: ["WELDING", "KILN"], ventilation_class: "LOCAL", max_concurrent_residents: 1, status: "AVAILABLE" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { s_d: "$.data.id" }
            - call: "POST /studios"
              payload: { code: "S-E", capability_tags: ["PRINT_PRESS"], ventilation_class: "LOCAL", max_concurrent_residents: 1, status: "AVAILABLE" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { s_e: "$.data.id" }
            - call: "POST /studios"
              payload: { code: "S-F", capability_tags: ["WELDING"], ventilation_class: "NONE", max_concurrent_residents: 1, status: "AVAILABLE" }
