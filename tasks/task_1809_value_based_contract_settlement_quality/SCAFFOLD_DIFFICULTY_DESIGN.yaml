            - { call: "POST /vbc/performance-years", payload: { contract_id: "${c1}", year_label: 2026, period_start: "2026-01-01", period_end: "2027-01-01" }, as: PayerAdmin, captures: { y1: $.data.id } }
            - { call: "POST /vbc/performance-years/${y1}/open-attribution", payload: {}, as: PayerAdmin }
          trigger:
            - { call: "POST /vbc/quality-measure-results", payload: { performance_year_id: "${y1}", measure_code: HBA1C, numerator_count: 350, denominator_count: 1000 }, as: QualityAnalyst, captures: { q1: $.data.id, st0: $.data.result_status, rate0: $.data.rate_bp } }
            - { call: "POST /vbc/quality-measure-results/${q1}/validate", payload: {}, as: QualityAnalyst, captures: { st1: $.data.result_status, rate1: $.data.rate_bp, pts1: $.data.achievement_points } }
            - { call: "POST /vbc/quality-measure-results/${q1}/return-for-correction", payload: {}, as: QualityAnalyst, captures: { st2: $.data.result_status, rate2: $.data.rate_bp, pts2: $.data.achievement_points } }
            - { call: "POST /vbc/quality-measure-results/${q1}/validate", payload: {}, as: QualityAnalyst, captures: { st3: $.data.result_status, rate3: $.data.rate_bp, pts3: $.data.achievement_points } }
            - { call: "POST /vbc/quality-measure-results/${q1}/lock", payload: {}, as: QualityAnalyst, captures: { st4: $.data.result_status } }
          assert:
            - "Created REPORTED with rate_bp == null and achievement_points == null"
            - "First validate: VALIDATED, rate_bp == 3500, achievement_points == 3"
            - "Return-for-correction: REPORTED, rate_bp == null, achievement_points == null (loop edge clears computed fields)"
            - "Second validate: VALIDATED, rate_bp == 3500, achievement_points == 3 (recomputed identically)"
