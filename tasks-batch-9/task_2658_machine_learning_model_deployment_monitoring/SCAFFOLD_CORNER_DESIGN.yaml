      - name: manual_override_pins_traffic_blocks_ramp_and_is_compensated_on_resolve
        claim_type: Conditional action
        grounds:
          - endpoints.POST_prediction_incidents_actions
          - validations.priority_19
          - validations.priority_36
          - errors.ERR_OVERRIDE_EXCEEDS_CURRENT_TRAFFIC
          - errors.ERR_MANUAL_OVERRIDE_ACTIVE
          - entities.TrafficRampStep.fields.reason
        distinguishing_aspect: |
          MANUAL_OVERRIDE is only legal below the deployment's CURRENT traffic (strictly), so the same
          action with override_traffic_pct 15.00 is a 422 and with 5.00 is a valid transition. Once
          active it wins the priority race: the deployment now violates BOTH priority 19 (override
          active) and priority 33 (an incident is MITIGATING), and ramp answers the lower-numbered
          ERR_MANUAL_OVERRIDE_ACTIVE. RESOLVE compensates exactly — an OVERRIDE_RELEASE step of the
          opposite sign restores the pre-override traffic and the ramp table resumes where it left off.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one REALTIME Deployment ramped twice (RAMPING, traffic_pct 15.00, ramp_step_index 2) with fallback_strategy PREVIOUS_CHAMPION"
            - "one OPEN PredictionIncident on it"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { m_id: $.data.id }
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /training-datasets/${ds_id}/decision"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "u_stew_1"
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200, doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH"] }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { v1_id: $.data.id }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ModelApprover
              as_user_id: "u_appr_1"
            - call: "POST /serving-endpoints"
              payload: { name: "rt-cluster-a", region: "us-east-1", serving_feature_spec_hash: "fs-v1", max_traffic_pct: 100.00, deploy_cooldown_minutes: 30 }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { se1_id: $.data.id, se1_v: $.data.version }
            - call: "POST /deployments"
              payload: { model_version_id: "${v1_id}", serving_endpoint_id: "${se1_id}", pattern: "REALTIME", serve_from: "2026-08-01T00:00:00Z", serve_until: "2026-08-31T00:00:00Z", expected_serving_endpoint_version: "${se1_v}", fallback_strategy: "PREVIOUS_CHAMPION" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { d1_id: $.data.id }
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { pre_traffic: $.data.traffic_pct, pre_index: $.data.ramp_step_index, pre_cum: $.data.cumulative_ramp_delta_pct }
            - call: "POST /prediction-incidents"
              payload: { deployment_id: "${d1_id}", summary: "calibration collapse on the realtime path", severity: "SEV2" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /prediction-incidents/${inc_id}/actions"
              payload: { action: "MANUAL_OVERRIDE", override_traffic_pct: 15.00 }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { equal_err: $.data.error_id }
            - call: "POST /prediction-incidents/${inc_id}/actions"
              payload: { action: "MANUAL_OVERRIDE", override_traffic_pct: 5.00, note: "pinning traffic to the last safe checkpoint" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { ov_status: $.data.status, ov_pinned: $.data.manual_override_traffic_pct }
            - call: "GET /deployments/${d1_id}"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { ov_traffic: $.data.traffic_pct, ov_active: $.data.manual_override_active, ov_field: $.data.override_traffic_pct, ov_index: $.data.ramp_step_index, ov_cum: $.data.cumulative_ramp_delta_pct }
            - call: "GET /serving-endpoints/${se1_id}"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { ov_alloc: $.data.allocated_traffic_pct }
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { ramp_blocked_err: $.data.error_id }
            - call: "POST /prediction-incidents/${inc_id}/actions"
              payload: { action: "MONITOR" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { mon_status: $.data.status }
            - call: "POST /prediction-incidents/${inc_id}/actions"
              payload: { action: "RESOLVE" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { res_status: $.data.status }
            - call: "GET /deployments/${d1_id}"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { post_traffic: $.data.traffic_pct, post_active: $.data.manual_override_active, post_field: $.data.override_traffic_pct, post_cum: $.data.cumulative_ramp_delta_pct }
            - call: "GET /deployments/${d1_id}/ramp-steps"
              payload: { limit: 20, offset: 0 }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { steps_total: $.meta.total_count }
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { resumed_traffic: $.data.traffic_pct, resumed_index: $.data.ramp_step_index }
          assert:
            - "VIOLATION: MANUAL_OVERRIDE with override_traffic_pct 15.00 == the current traffic_pct returns HTTP 422 'ERR_OVERRIDE_EXCEEDS_CURRENT_TRAFFIC' — the comparison is strict (<), so equal is rejected"
            - "the rejected action left the incident OPEN and traffic_pct at 15.00"
            - "SUCCESS: override at 5.00 moves the incident OPEN -> MITIGATING with manual_override_traffic_pct 5.00 recorded on the incident"
            - "the deployment is pinned: traffic_pct 5.00, manual_override_active true, override_traffic_pct 5.00, and ramp_step_index UNCHANGED at 2 (the override is not a ramp)"
            - "the ledger followed the pin: ServingEndpoint allocated_traffic_pct == 5.00, and a TrafficRampStep with reason 'MANUAL_OVERRIDE' and delta_pct -10.00 was appended"
            - "PRIORITY: ramp now violates both priority 19 (override active) and priority 33 (incident MITIGATING) and answers HTTP 409 'ERR_MANUAL_OVERRIDE_ACTIVE' — the lower priority number wins"
            - "RESOLVE compensates exactly: traffic_pct back to 15.00, manual_override_active false, override_traffic_pct null, and one TrafficRampStep with reason 'OVERRIDE_RELEASE' and delta_pct +10.00"
            - "the compensation telescopes: cumulative_ramp_delta_pct == 15.00 == the sum of +5.00, +10.00, -10.00, +10.00 over 4 ramp-step rows"
            - "the ramp table resumes from the preserved index: the next ramp lands on traffic_pct 35.00 with ramp_step_index 3, exactly as if the override had never happened"

      - name: retraining_trigger_link_version_lands_on_in_progress_then_satisfied
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_retraining_triggers_disposition
          - state_machines.RetrainingTrigger.ACKNOWLEDGED_to_IN_PROGRESS
          - state_machines.RetrainingTrigger.IN_PROGRESS_to_SATISFIED
          - validations.priority_48
          - errors.ERR_RETRAINED_VERSION_LINEAGE_INVALID
        distinguishing_aspect: |
          One action with two possible destinations chosen by the LINKED VERSION's approval_state: the
          same LINK_VERSION request lands on IN_PROGRESS while the retrained version is DRAFT and on
          SATISFIED once it is APPROVED, and it is explicitly re-issuable from IN_PROGRESS. The lineage
          precondition is structural, not existential — a perfectly valid version of the same model is
          still rejected when it has no parent_version_id.
