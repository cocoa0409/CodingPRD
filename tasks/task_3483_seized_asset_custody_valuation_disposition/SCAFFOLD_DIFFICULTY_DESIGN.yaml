  - rule_id: resource_temporal_overlap
    instances:
      - name: custody_window_contiguity
        grounds:
          - errors.ERR_CUSTODY_WINDOW_BREAK
          - validations[priority=8]
          - entities.CustodyTransfer.fields.window_start
        distinguishing_aspect: "Custody windows use CONTIGUOUS-CHAIN semantics (the new window_start must equal the latest non-CANCELLED window_end exactly): a one-hour gap [09-02T09:00 after a 09-02T08:00 end] and an overlap [09-01T12:00 inside the first window] are both ERR_CUSTODY_WINDOW_BREAK, while exact adjacency 09-02T08:00 is accepted."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Case open; one VEHICLE asset; transfer T1 [2026-09-01T08:00, 2026-09-02T08:00) completed."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-0015", judicial_district: "D. Kan.", forfeiture_type: "CIVIL", lead_agency_code: "DEA" }
              as: CaseAgent
              captures: { case15: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${case15}", asset_type: "VEHICLE", description: "box van", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "GOOD" }
              as: AssetCustodian
              captures: { ta: $.data.id }
            - call: "POST /custody/custody-transfers"
              payload: { asset_id: "${ta}", from_location_ref: "impound-4", to_location_ref: "warehouse-1", to_location_kind: "STORAGE", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-02T08:00:00Z" }
              as: AssetCustodian
              captures: { tt1: $.data.id }
            - call: "POST /custody/custody-transfers/${tt1}/complete"
              payload: { condition_on_arrival: "GOOD" }
              as: AssetCustodian
          trigger:
            - call: "POST /custody/custody-transfers"
              payload: { asset_id: "${ta}", from_location_ref: "warehouse-1", to_location_ref: "warehouse-2", to_location_kind: "STORAGE", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-03T09:00:00Z" }
              as: AssetCustodian
              captures: { gap_err: $.data.error_id }
            - call: "POST /custody/custody-transfers"
              payload: { asset_id: "${ta}", from_location_ref: "warehouse-1", to_location_ref: "warehouse-2", to_location_kind: "STORAGE", window_start: "2026-09-01T12:00:00Z", window_end: "2026-09-02T12:00:00Z" }
              as: AssetCustodian
              captures: { ovl_err: $.data.error_id }
            - call: "POST /custody/custody-transfers"
              payload: { asset_id: "${ta}", from_location_ref: "warehouse-1", to_location_ref: "warehouse-2", to_location_kind: "STORAGE", window_start: "2026-09-02T08:00:00Z", window_end: "2026-09-03T08:00:00Z" }
              as: AssetCustodian
              captures: { tt2: $.data.id }
          assert:
            - "gap_err == ERR_CUSTODY_WINDOW_BREAK (one-hour gap after the 2026-09-02T08:00 chain end)"
            - "ovl_err == ERR_CUSTODY_WINDOW_BREAK (12:00 start sits inside T1's window)"
            - "CustodyTransfer.${tt2} created 201 with status SCHEDULED — exact adjacency window_start == 2026-09-02T08:00:00Z chains legally"

