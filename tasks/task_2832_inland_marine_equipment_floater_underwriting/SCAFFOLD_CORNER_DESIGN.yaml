              payload: { description: "Wrong Type Machine", equipment_type: "EXCAVATOR", model_year: "twenty twenty-two", original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v2}" }
              as: Underwriter
            - call: "POST /inland-marine/policies"
