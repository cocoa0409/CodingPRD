            - { call: "POST /bulk-liquid/tank-wash-certificates", payload: { trailer_id: "${trl2}", wash_bay_id: "${bay}", wash_level: FLUSH, window_start: "2026-08-02T10:00:00Z", window_end: "2026-08-02T11:00:00Z" }, as: WashOperator, captures: { err: $.data.error_id } }
            - { call: "POST /bulk-liquid/tank-wash-certificates", payload: { trailer_id: "${trl3}", wash_bay_id: "${bay}", wash_level: FLUSH, window_start: "2026-08-02T10:30:00Z", window_end: "2026-08-02T11:30:00Z" }, as: WashOperator, captures: { c3: $.data.id } }
