scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:
      - name: create_rate_card_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.RateCard, endpoints]
        distinguishing_aspect: "POST /rate-cards with all required fields returns 201 and echoes daily/weekly/four_week rates, deposit, version==1, active==true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id, rc_v: $.data.version }
          assert:
            - "response.status == 201"
            - "RateCard.${rc_id}.daily_rate_cents == 4000"
            - "RateCard.${rc_id}.version == 1"
            - "RateCard.${rc_id}.active == true"

      - name: get_equipment_unit_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.EquipmentUnit, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /equipment-units/{nonexistent-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /rental-yard/equipment-units/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: YardManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_catalog_item_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.RentalCatalogItem, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /catalog-items omitting required `category` returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["RateCard rc exists."]
          setup_api_calls:
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", fuel_capacity_liters: 40 }
              as: YardManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_catalog_item_invalid_enum_category_returns_400
        claim_type: Type Constraints
        grounds: [entities.RentalCatalogItem.fields.category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /catalog-items with category 'SPACESHIP' (not in enum) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["RateCard rc exists."]
          setup_api_calls:
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "X", category: "SPACESHIP", fuel_capacity_liters: 40 }
              as: YardManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_equipment_unit_duplicate_asset_tag_returns_409
        claim_type: Type Constraints
        grounds: [entities.EquipmentUnit.fields.asset_tag, "errors[ERR_DUPLICATE_KEY]", "validations[priority=6]"]
        distinguishing_aspect: "Second POST /equipment-units with an already-used asset_tag returns 409 ERR_DUPLICATE_KEY."
        test_recipe:
          setup: ["Catalog item ci with one unit having asset_tag 'EU-1'."]
          setup_api_calls:
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: false, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
          trigger:
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_KEY"

      - name: catalog_item_requires_delivery_default_false
        claim_type: Defaults
        grounds: [entities.RentalCatalogItem.fields.requires_delivery]
        distinguishing_aspect: "POST /catalog-items omitting requires_delivery applies default false."
        test_recipe:
          setup: ["RateCard rc exists."]
          setup_api_calls:
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "POWER_TOOL", fuel_capacity_liters: 0 }
              as: YardManager
              captures: { ci_id: $.data.id }
          assert:
            - "RentalCatalogItem.${ci_id}.requires_delivery == false"

      - name: equipment_unit_id_system_minted_input_ignored
        claim_type: System Fields
        grounds: [entities.EquipmentUnit.fields.availability_state]
        distinguishing_aspect: "POST /equipment-units returns server-minted id, availability_state AVAILABLE, fuel_level_liters 0, lifetime_rental_days 0, version 1 regardless of input attempts."
        test_recipe:
          setup: ["Catalog item ci exists."]
          setup_api_calls:
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: false, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
          trigger:
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu_id: $.data.id }
          assert:
            - "EquipmentUnit.${eu_id}.availability_state == AVAILABLE"
            - "EquipmentUnit.${eu_id}.lifetime_rental_days == 0"
            - "EquipmentUnit.${eu_id}.version == 1"

      - name: damage_charge_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.DamageCharge]
        distinguishing_aspect: "DamageCharge is common_fields:false (append-only): it carries id + created_at only, no version, and there is no DamageCharge update endpoint in §1.5."
        test_recipe:
          setup: ["No DamageCharge update endpoint exists; only GET /damage-charges and GET /damage-charges/{id}."]
          setup_api_calls: []
          trigger:
            - call: "GET /rental-yard/damage-charges"
              payload: {}
              as: YardManager
          assert:
            - "response.status == 200"
            - "no PUT/PATCH/DELETE endpoint for /damage-charges exists in §1.5"

      - name: list_rate_cards_paginated_envelope
        claim_type: Listing
        grounds: [entities.RateCard, response_envelope]
        distinguishing_aspect: "GET /rate-cards returns response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two rate cards exist."]
          setup_api_calls:
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "A", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "B", daily_rate_cents: 5000, weekly_rate_cents: 25000, four_week_rate_cents: 80000, deposit_cents: 60000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 2.0 }
              as: YardManager
          trigger:
            - call: "GET /rental-yard/rate-cards?limit=1&offset=0"
              payload: {}
              as: YardManager
          assert:
            - "response.response_type == array"
            - "response.meta has total_count == 2 and has_more == true"

  # =====================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_reservation_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Reservation.CONFIRMED_to_CANCELLED, "errors[ERR_INVALID_STATE]", "validations[priority=7]"]
        distinguishing_aspect: "Cancelling a reservation already in CANCELLED returns 409 ERR_INVALID_STATE; no DEPOSIT_REFUND posts twice."
        test_recipe:
          setup: ["Reservation r CONFIRMED then CANCELLED (one DEPOSIT_HOLD + one DEPOSIT_REFUND, balance 0)."]
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: false, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu_id: $.data.id }
            - call: "POST /rental-yard/contractor-accounts"
              payload: { company_name: "Acme", credit_limit_cents: 1000000 }
              as: YardManager
              captures: { acct_id: $.data.id }
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu_id}", fulfillment_method: "PICKUP", rental_start_date: "2026-06-01", rental_end_date: "2026-06-10", damage_waiver_opted: false }
              as: RentalAgent
              captures: { r_id: $.data.id }
            - call: "POST /rental-yard/reservations/${r_id}/cancel"
              payload: {}
              as: RentalAgent
          trigger:
            - call: "POST /rental-yard/reservations/${r_id}/cancel"
              payload: {}
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "ContractorAccount.${acct_id}.outstanding_balance_cents == 0"

      - name: return_agreement_from_terminal_closed_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.RentalAgreement.RETURNED_PENDING_INSPECTION_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling /return on an agreement already CLOSED (terminal) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Agreement ag CLOSED via on-time clean return + inspection (no damage)."]
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: false, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu_id: $.data.id }
            - call: "POST /rental-yard/contractor-accounts"
              payload: { company_name: "Acme", credit_limit_cents: 1000000 }
              as: YardManager
              captures: { acct_id: $.data.id }
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu_id}", fulfillment_method: "PICKUP", rental_start_date: "2026-06-01", rental_end_date: "2026-06-10", damage_waiver_opted: false }
              as: RentalAgent
              captures: { r_id: $.data.id }
            - call: "POST /rental-yard/reservations/${r_id}/pickup"
              payload: {}
              as: RentalAgent
            - call: "GET /rental-yard/rental-agreements?reservation_id=${r_id}"
              payload: {}
              as: RentalAgent
              captures: { ag_id: "$.data[0].id" }
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rental-agreements/${ag_id}/return"
              payload: {}
              as: RentalAgent
            - call: "POST /rental-yard/return-inspections"
              payload: { rental_agreement_id: "${ag_id}", return_fuel_level_liters: 40, cleanliness: "CLEAN", damage_assessed_cents: 0 }
              as: Inspector
          trigger:
            - call: "POST /rental-yard/rental-agreements/${ag_id}/return"
              payload: {}
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: pickup_delivery_only_item_returns_delivery_required
        claim_type: guarded transitions
        grounds: [state_machines.Reservation.CONFIRMED_to_PICKED_UP, "errors[ERR_DELIVERY_REQUIRED]", "validations[priority=9]"]
        distinguishing_aspect: "Creating a PICKUP reservation for a requires_delivery==true item is rejected with 422 ERR_DELIVERY_REQUIRED (cross-entity guard on RentalCatalogItem.requires_delivery)."
        test_recipe:
          setup: ["Catalog item ci with requires_delivery==true and one unit eu."]
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: true, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu_id: $.data.id }
            - call: "POST /rental-yard/contractor-accounts"
              payload: { company_name: "Acme", credit_limit_cents: 1000000 }
              as: YardManager
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu_id}", fulfillment_method: "PICKUP", rental_start_date: "2026-06-01", rental_end_date: "2026-06-10", damage_waiver_opted: false }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_DELIVERY_REQUIRED"

      - name: dispatch_on_pickup_reservation_returns_wrong_fulfillment
        claim_type: Invalid Transitions
        grounds: [state_machines.Reservation.CONFIRMED_to_DISPATCHED_DELIVERY, "errors[ERR_WRONG_FULFILLMENT]", "validations[priority=14]"]
        distinguishing_aspect: "Calling /dispatch on a PICKUP reservation returns 422 ERR_WRONG_FULFILLMENT."
        test_recipe:
          setup: ["Reservation r CONFIRMED with fulfillment_method PICKUP. Truck tk exists."]
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: false, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu_id: $.data.id }
            - call: "POST /rental-yard/delivery-trucks"
              payload: { name: "Truck-1", buffer_minutes: 60 }
              as: YardManager
              captures: { tk_id: $.data.id }
            - call: "POST /rental-yard/contractor-accounts"
              payload: { company_name: "Acme", credit_limit_cents: 1000000 }
              as: YardManager
              captures: { acct_id: $.data.id }
            - call: "POST /rental-yard/reservations"
              payload: { contractor_account_id: "${acct_id}", catalog_item_id: "${ci_id}", equipment_unit_id: "${eu_id}", fulfillment_method: "PICKUP", rental_start_date: "2026-06-01", rental_end_date: "2026-06-10", damage_waiver_opted: false }
              as: RentalAgent
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /rental-yard/reservations/${r_id}/dispatch"
              payload: { delivery_truck_id: "${tk_id}", delivery_window_start: "2026-06-01T09:00:00.000Z", delivery_window_end: "2026-06-01T10:00:00.000Z" }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_WRONG_FULFILLMENT"

      - name: resolve_already_resolved_ticket_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.MaintenanceTicket.OPEN_to_RESOLVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resolving a ticket already RESOLVED returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Unit eu pulled OUT_OF_SERVICE with ticket tk; tk RESOLVED."]
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
              captures: { rc_id: $.data.id }
            - call: "POST /rental-yard/catalog-items"
              payload: { rate_card_id: "${rc_id}", sku: "MX15", name: "Mini Excavator", category: "HEAVY_EQUIPMENT", requires_delivery: false, fuel_capacity_liters: 40 }
              as: YardManager
              captures: { ci_id: $.data.id }
            - call: "POST /rental-yard/equipment-units"
              payload: { catalog_item_id: "${ci_id}", asset_tag: "EU-1", service_due_at_days: 1000 }
              as: YardManager
              captures: { eu_id: $.data.id }
            - call: "POST /rental-yard/maintenance-tickets"
              payload: { equipment_unit_id: "${eu_id}", reason: "SCHEDULED_SERVICE" }
              as: YardManager
              captures: { tk_id: $.data.id }
            - call: "POST /rental-yard/maintenance-tickets/${tk_id}/resolve"
              payload: {}
              as: YardManager
          trigger:
            - call: "POST /rental-yard/maintenance-tickets/${tk_id}/resolve"
              payload: {}
              as: YardManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: reservation_starts_in_confirmed_initial_state
        claim_type: Initial State
        grounds: [state_machines.Reservation, entities.Reservation.fields.reservation_state]
        distinguishing_aspect: "A newly created reservation has reservation_state CONFIRMED."
        test_recipe:
          setup: ["Unit eu AVAILABLE, account acct."]
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
              as: YardManager
