# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Sports Facility Scheduling & Field Allocation
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: permit_fee_provisional_vs_settlement_final
        grounds:
          - calculations.permit_fee_quote
          - state_machines.Permit.CONFIRMED_to_COMPLETED
          - entities.Permit.fields.quoted_total_cents
          - entities.Permit.fields.final_total_cents
        distinguishing_aspect: |
          Same pinned FeeSchedule and same permit: the provisional variant bills the requested
          120 slot-minutes plus 120 lights-minutes (9600 cents), while the final_settlement
          variant at settle recomputes from attendance_minutes=90 and actual_lights_minutes=60
          (5800 cents) — identical inputs context, two valid algorithms, different money.
        test_recipe:
          setup:
            - "Org (RESIDENT, YOUTH_LEAGUE, 3 prior seasons), facility with lights, published fee schedule R1 (2000/hr resident, 700/15min lights, deposit 25% min 5000)"
            - "Window 2026-FALL OPEN; one LEAGUE_GAME application 2026-08-10 18:00-20:00 with lights, headcount 40"
            - "Window CLOSED then ALLOCATED; permit RESERVED with quote 9600, deposit 5000; invoice ISSUED, 5000 paid; permit CONFIRMED"
            - "Clock advanced into the slot; check-in attended 90 minutes; clock past slot end"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /organizations", payload: { name: "Riverview SC", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 3 }, as: AthleticsAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Memorial Field 1", facility_class: "RECTANGLE", has_lights: true, capacity: 120, weekly_prime_hour_cap: 12, nightly_light_block_cap: 16 }, as: AthleticsAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /fee-schedules", payload: { name: "2026 Standard", effective_from: "2026-07-01T00:00:00Z", hourly_resident_cents: 2000, hourly_nonresident_cents: 3250, hourly_commercial_cents: 5000, lights_block_cents: 700, nonresident_surcharge_pct: 15, commercial_surcharge_pct: 25, tournament_day_cents: 24000, tournament_day_min_minutes: 360, deposit_pct: 25, min_deposit_cents: 5000 }, as: AthleticsAdmin, captures: { fs_id: $.data.id } }
            - { call: "POST /fee-schedules/${fs_id}/publish", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows", payload: { season_code: "2026-FALL", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-20T23:59:59Z", prime_cap_hours_per_org: 10, max_tournament_days_per_org: 2 }, as: AthleticsAdmin, captures: { w_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/open", payload: {}, as: AthleticsAdmin }
            - { call: "POST /permit-applications", payload: { window_id: "${w_id}", facility_id: "${f_id}", event_date: "2026-08-10", start_minute: 1080, end_minute: 1200, event_type: "LEAGUE_GAME", wants_lights: true, headcount: 40 }, as: OrgCoordinator, as_user_id: "${o_id}", captures: { a_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/close", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows/${w_id}/run-allocation", payload: {}, as: AthleticsAdmin }
            - { call: "GET /permits", payload: { application_id: "${a_id}" }, as: AthleticsAdmin, captures: { p_id: "$.data[0].id", p_quoted: "$.data[0].quoted_total_cents" } }
            - { call: "GET /invoices", payload: { permit_id: "${p_id}" }, as: FinanceClerk, captures: { i_id: "$.data[0].id" } }
            - { call: "POST /invoices/${i_id}/issue", payload: {}, as: FinanceClerk }
            - { call: "POST /invoices/${i_id}/payments", payload: { amount_cents: 5000, method: "CHECK" }, as: FinanceClerk }
            - { call: "POST /permits/${p_id}/confirm", payload: {}, as: OrgCoordinator, as_user_id: "${o_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T19:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /permits/${p_id}/check-in", payload: { attended_minutes: 90 }, as: FieldSupervisor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T20:01:00Z" }, as: AthleticsAdmin }
          trigger:
            - { call: "POST /permits/${p_id}/settle", payload: { actual_lights_minutes: 60 }, as: FieldSupervisor, captures: { p_final: $.data.final_total_cents, p_status: $.data.status } }
            - { call: "GET /invoices/${i_id}", payload: {}, as: FinanceClerk, captures: { i_total: $.data.total_cents, i_bal: $.data.balance_due_cents, i_status: $.data.status } }
          assert:
            - "Permit.${p_id}.quoted_total_cents == 9600 (provisional: field 4000 + lights 8 blocks x 700 = 5600)"
            - "Permit.${p_id}.final_total_cents == 5800 (final: min(4000, round(90/60*2000))=3000 + min(5600, 4*700)=2800)"
            - "Invoice.${i_id}.total_cents == 5800 and Invoice.balance_due_cents == 800 (5800 - 5000 paid)"
            - "Invoice.${i_id}.status == PARTIALLY_PAID"
            - "Permit.${p_id}.status == COMPLETED"
            - "provisional (9600) != final (5800) for identical fee schedule and slot identity"

      - name: priority_score_provisional_vs_final_after_late_strike
        grounds:
          - calculations.allocation_priority_score
          - entities.PermitApplication.fields.provisional_score
          - entities.PermitApplication.fields.final_score
          - state_machines.Permit.CONFIRMED_to_NO_SHOW
        distinguishing_aspect: |
          Same organization and same application: provisional_score is snapshotted at submission
          with 0 active strikes (112); final_score is recomputed at the allocation run after a
          no-show strike lands between submission and run (100). Entity domain: priority scoring
          on PermitApplication/Organization — distinct from the fiscal domain of the sibling instance.
        test_recipe:
          setup:
            - "Org (RESIDENT, YOUTH_LEAGUE, 3 prior seasons); facility; published schedule"
            - "Window W1 (closes 2026-08-03) allocated: permit P1 for 2026-08-05 18:00-20:00 no lights, CONFIRMED (quote 4000, deposit 4000, fully paid)"
            - "Window W2 (closes 2026-08-08) OPEN; application A2 submitted 2026-08-04 with 0 active strikes -> provisional 112"
            - "Clock past P1 end; P1 marked NO_SHOW -> 1 active strike"
            - "W2 CLOSED, run-allocation executed"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /organizations", payload: { name: "Riverview SC", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 3 }, as: AthleticsAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Memorial Field 1", facility_class: "RECTANGLE", has_lights: true, capacity: 120, weekly_prime_hour_cap: 12, nightly_light_block_cap: 16 }, as: AthleticsAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /fee-schedules", payload: { name: "2026 Standard", effective_from: "2026-07-01T00:00:00Z", hourly_resident_cents: 2000, hourly_nonresident_cents: 3250, hourly_commercial_cents: 5000, lights_block_cents: 700, nonresident_surcharge_pct: 15, commercial_surcharge_pct: 25, tournament_day_cents: 24000, tournament_day_min_minutes: 360, deposit_pct: 25, min_deposit_cents: 5000 }, as: AthleticsAdmin, captures: { fs_id: $.data.id } }
            - { call: "POST /fee-schedules/${fs_id}/publish", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows", payload: { season_code: "2026-FALL", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-03T23:59:59Z", prime_cap_hours_per_org: 10, max_tournament_days_per_org: 2 }, as: AthleticsAdmin, captures: { w1_id: $.data.id } }
            - { call: "POST /allocation-windows/${w1_id}/open", payload: {}, as: AthleticsAdmin }
            - { call: "POST /permit-applications", payload: { window_id: "${w1_id}", facility_id: "${f_id}", event_date: "2026-08-05", start_minute: 1080, end_minute: 1200, event_type: "LEAGUE_GAME", wants_lights: false, headcount: 40 }, as: OrgCoordinator, as_user_id: "${o_id}", captures: { a1_id: $.data.id } }
            - { call: "POST /allocation-windows/${w1_id}/close", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows/${w1_id}/run-allocation", payload: {}, as: AthleticsAdmin }
            - { call: "GET /permits", payload: { application_id: "${a1_id}" }, as: AthleticsAdmin, captures: { p1_id: "$.data[0].id" } }
            - { call: "GET /invoices", payload: { permit_id: "${p1_id}" }, as: FinanceClerk, captures: { i1_id: "$.data[0].id" } }
            - { call: "POST /invoices/${i1_id}/issue", payload: {}, as: FinanceClerk }
            - { call: "POST /invoices/${i1_id}/payments", payload: { amount_cents: 4000, method: "CHECK" }, as: FinanceClerk }
            - { call: "POST /permits/${p1_id}/confirm", payload: {}, as: OrgCoordinator, as_user_id: "${o_id}" }
            - { call: "POST /allocation-windows", payload: { season_code: "2026-FALL", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-08T23:59:59Z", prime_cap_hours_per_org: 10, max_tournament_days_per_org: 2 }, as: AthleticsAdmin, captures: { w2_id: $.data.id } }
            - { call: "POST /allocation-windows/${w2_id}/open", payload: {}, as: AthleticsAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T12:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /permit-applications", payload: { window_id: "${w2_id}", facility_id: "${f_id}", event_date: "2026-08-12", start_minute: 1080, end_minute: 1200, event_type: "LEAGUE_GAME", wants_lights: false, headcount: 40 }, as: OrgCoordinator, as_user_id: "${o_id}", captures: { a2_id: $.data.id, a2_prov: $.data.provisional_score } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T21:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /permits/${p1_id}/mark-no-show", payload: {}, as: FieldSupervisor }
            - { call: "POST /allocation-windows/${w2_id}/close", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows/${w2_id}/run-allocation", payload: {}, as: AthleticsAdmin }
          trigger:
            - { call: "GET /permit-applications/${a2_id}", payload: {}, as: AthleticsAdmin, captures: { a2_final: $.data.final_score, a2_status: $.data.status } }
          assert:
            - "PermitApplication.${a2_id}.provisional_score == 112 (80 base + 15 youth + 9 loyalty + 0 util - 0 strikes + 8 LEAGUE_GAME)"
            - "PermitApplication.${a2_id}.final_score == 100 (112 - 12 for the strike that landed after submission)"
            - "PermitApplication.${a2_id}.status == AWARDED (still the only candidate despite the lower final score)"
            - "Organization.${o_id}.no_show_strikes_active == 1 and standing == GOOD"

  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_loyalty_cap_and_tiebreak
        grounds:
          - calculations.allocation_priority_score
          - calculations.allocation_run
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — loyalty min(12, 3*seasons) caps B's
          8 seasons (24 raw) at 12, producing an exact 115-115 tie with A's 4 seasons; the run's
          deterministic tie-break (created_at ASC) then decides the award. Without the cap B wins 127-115.
        test_recipe:
          setup:
            - "Two RESIDENT YOUTH_LEAGUE orgs: A with prior_seasons_active=4, B with prior_seasons_active=8"
            - "Both apply for the identical slot 2026-08-10 18:00-20:00 LEAGUE_GAME no lights; A submits before B"
            - "Window closed and allocated"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /organizations", payload: { name: "Alpha Youth", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 4 }, as: AthleticsAdmin, captures: { oa_id: $.data.id } }
            - { call: "POST /organizations", payload: { name: "Beta Youth", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 8 }, as: AthleticsAdmin, captures: { ob_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Memorial Field 1", facility_class: "RECTANGLE", has_lights: true, capacity: 120, weekly_prime_hour_cap: 12, nightly_light_block_cap: 16 }, as: AthleticsAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /fee-schedules", payload: { name: "2026 Standard", effective_from: "2026-07-01T00:00:00Z", hourly_resident_cents: 2000, hourly_nonresident_cents: 3250, hourly_commercial_cents: 5000, lights_block_cents: 700, nonresident_surcharge_pct: 15, commercial_surcharge_pct: 25, tournament_day_cents: 24000, tournament_day_min_minutes: 360, deposit_pct: 25, min_deposit_cents: 5000 }, as: AthleticsAdmin, captures: { fs_id: $.data.id } }
            - { call: "POST /fee-schedules/${fs_id}/publish", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows", payload: { season_code: "2026-FALL", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-20T23:59:59Z", prime_cap_hours_per_org: 10, max_tournament_days_per_org: 2 }, as: AthleticsAdmin, captures: { w_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/open", payload: {}, as: AthleticsAdmin }
            - { call: "POST /permit-applications", payload: { window_id: "${w_id}", facility_id: "${f_id}", event_date: "2026-08-10", start_minute: 1080, end_minute: 1200, event_type: "LEAGUE_GAME", wants_lights: false, headcount: 40 }, as: OrgCoordinator, as_user_id: "${oa_id}", captures: { aa_id: $.data.id } }
            - { call: "POST /permit-applications", payload: { window_id: "${w_id}", facility_id: "${f_id}", event_date: "2026-08-10", start_minute: 1080, end_minute: 1200, event_type: "LEAGUE_GAME", wants_lights: false, headcount: 40 }, as: OrgCoordinator, as_user_id: "${ob_id}", captures: { ab_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/close", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows/${w_id}/run-allocation", payload: {}, as: AthleticsAdmin }
          trigger:
            - { call: "GET /permit-applications/${aa_id}", payload: {}, as: AthleticsAdmin, captures: { aa_score: $.data.final_score, aa_status: $.data.status } }
            - { call: "GET /permit-applications/${ab_id}", payload: {}, as: AthleticsAdmin, captures: { ab_score: $.data.final_score, ab_status: $.data.status, ab_note: $.data.decision_note } }
          assert:
            - "PermitApplication.${aa_id}.final_score == 115 (80+15+min(12,12)+0+8)"
            - "PermitApplication.${ab_id}.final_score == 115 (80+15+min(12,24)+0+8 — loyalty capped at 12, NOT 24)"
            - "PermitApplication.${aa_id}.status == AWARDED (tie-break: earlier created_at wins)"
            - "PermitApplication.${ab_id}.status == WAITLISTED and decision_note == SLOT_CONFLICT"

      - name: fee_per_line_rounding_then_sum_order
        grounds:
          - calculations.permit_fee_quote
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — NONRESIDENT 45 minutes at 3250/hr gives raw field
          2437.5 -> line 2438; surcharge is computed on the ROUNDED field line then rounded
          (round(2438*0.15)=366); total = 2438+366 = 2804. The forbidden sum-then-round order
          yields round(2437.5+365.625) = 2803 — one cent less.
        test_recipe:
          setup:
            - "NONRESIDENT ADULT_LEAGUE org; facility; published schedule with hourly_nonresident_cents=3250 and nonresident_surcharge_pct=15"
            - "Application 2026-08-10 14:00-14:45 LEAGUE_PRACTICE, no lights; window allocated"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /organizations", payload: { name: "Metro Adults", classification: "NONRESIDENT", org_type: "ADULT_LEAGUE", prior_seasons_active: 0 }, as: AthleticsAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Memorial Field 1", facility_class: "RECTANGLE", has_lights: true, capacity: 120, weekly_prime_hour_cap: 12, nightly_light_block_cap: 16 }, as: AthleticsAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /fee-schedules", payload: { name: "2026 Standard", effective_from: "2026-07-01T00:00:00Z", hourly_resident_cents: 2000, hourly_nonresident_cents: 3250, hourly_commercial_cents: 5000, lights_block_cents: 700, nonresident_surcharge_pct: 15, commercial_surcharge_pct: 25, tournament_day_cents: 24000, tournament_day_min_minutes: 360, deposit_pct: 25, min_deposit_cents: 5000 }, as: AthleticsAdmin, captures: { fs_id: $.data.id } }
            - { call: "POST /fee-schedules/${fs_id}/publish", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows", payload: { season_code: "2026-FALL", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-20T23:59:59Z", prime_cap_hours_per_org: 10, max_tournament_days_per_org: 2 }, as: AthleticsAdmin, captures: { w_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/open", payload: {}, as: AthleticsAdmin }
            - { call: "POST /permit-applications", payload: { window_id: "${w_id}", facility_id: "${f_id}", event_date: "2026-08-10", start_minute: 840, end_minute: 885, event_type: "LEAGUE_PRACTICE", wants_lights: false, headcount: 20 }, as: OrgCoordinator, as_user_id: "${o_id}", captures: { a_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/close", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows/${w_id}/run-allocation", payload: {}, as: AthleticsAdmin }
          trigger:
            - { call: "GET /permits", payload: { application_id: "${a_id}" }, as: AthleticsAdmin, captures: { p_field: "$.data[0].quoted_field_fee_cents", p_sur: "$.data[0].quoted_surcharge_cents", p_total: "$.data[0].quoted_total_cents", p_dep: "$.data[0].deposit_required_cents" } }
          assert:
            - "Permit.quoted_field_fee_cents == 2438 (round_half_up(45*3250/60 = 2437.5))"
            - "Permit.quoted_surcharge_cents == 366 (round_half_up(2438 * 0.15 = 365.7) on the ROUNDED field line)"
            - "Permit.quoted_total_cents == 2804 (per-line-then-sum; sum-then-round would give 2803)"
            - "Permit.deposit_required_cents == 2804 (min(2804, max(5000, round(2804*0.25)=701)) — deposit clamped to total)"

      - name: cancel_penalty_pre_cancel_base_then_waterfall
        grounds:
          - calculations.cancellation_penalty
          - calculations.deposit_disposition_waterfall
          - state_machines.Permit.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — penalty is a percentage of the invoice total,
          yet the closeout replaces the total with the penalty. The pinned order (penalty from
          PRE-CANCEL quoted total 9600 at the 30% tier = 2880; then total := 2880; then waterfall
          deposit 5000 -> 2880 penalty -> 0 balance -> 2120 refund) makes the value well-defined;
          any other order changes the refund.
        test_recipe:
          setup:
            - "Happy-path CONFIRMED permit 2026-08-10 18:00-20:00 with lights: quoted total 9600, deposit 5000 paid"
            - "Clock at 2026-08-09T12:00:00Z -> notice = 30 hours -> 30% tier"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /organizations", payload: { name: "Riverview SC", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 3 }, as: AthleticsAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Memorial Field 1", facility_class: "RECTANGLE", has_lights: true, capacity: 120, weekly_prime_hour_cap: 12, nightly_light_block_cap: 16 }, as: AthleticsAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /fee-schedules", payload: { name: "2026 Standard", effective_from: "2026-07-01T00:00:00Z", hourly_resident_cents: 2000, hourly_nonresident_cents: 3250, hourly_commercial_cents: 5000, lights_block_cents: 700, nonresident_surcharge_pct: 15, commercial_surcharge_pct: 25, tournament_day_cents: 24000, tournament_day_min_minutes: 360, deposit_pct: 25, min_deposit_cents: 5000 }, as: AthleticsAdmin, captures: { fs_id: $.data.id } }
            - { call: "POST /fee-schedules/${fs_id}/publish", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows", payload: { season_code: "2026-FALL", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-20T23:59:59Z", prime_cap_hours_per_org: 10, max_tournament_days_per_org: 2 }, as: AthleticsAdmin, captures: { w_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/open", payload: {}, as: AthleticsAdmin }
            - { call: "POST /permit-applications", payload: { window_id: "${w_id}", facility_id: "${f_id}", event_date: "2026-08-10", start_minute: 1080, end_minute: 1200, event_type: "LEAGUE_GAME", wants_lights: true, headcount: 40 }, as: OrgCoordinator, as_user_id: "${o_id}", captures: { a_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/close", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows/${w_id}/run-allocation", payload: {}, as: AthleticsAdmin }
            - { call: "GET /permits", payload: { application_id: "${a_id}" }, as: AthleticsAdmin, captures: { p_id: "$.data[0].id" } }
            - { call: "GET /invoices", payload: { permit_id: "${p_id}" }, as: FinanceClerk, captures: { i_id: "$.data[0].id" } }
            - { call: "POST /invoices/${i_id}/issue", payload: {}, as: FinanceClerk }
            - { call: "POST /invoices/${i_id}/payments", payload: { amount_cents: 5000, method: "CHECK" }, as: FinanceClerk }
            - { call: "POST /permits/${p_id}/confirm", payload: {}, as: OrgCoordinator, as_user_id: "${o_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T12:00:00Z" }, as: AthleticsAdmin }
          trigger:
            - { call: "POST /permits/${p_id}/cancel", payload: {}, as: OrgCoordinator, as_user_id: "${o_id}" }
            - { call: "GET /invoices/${i_id}", payload: {}, as: FinanceClerk, captures: { i_pen: $.data.penalty_cents, i_total: $.data.total_cents, i_b1: $.data.deposit_penalty_applied_cents, i_b2: $.data.deposit_balance_applied_cents, i_b3: $.data.deposit_refunded_cents, i_ref: $.data.refunded_cents, i_bal: $.data.balance_due_cents } }
          assert:
            - "Invoice.penalty_cents == 2880 (round_half_up(9600 * 0.30), notice 30h in [24,48) tier)"
            - "Invoice.total_cents == 2880 (total REPLACED by penalty after penalty computed from the pre-cancel 9600)"
            - "Invoice.deposit_penalty_applied_cents == 2880 and deposit_balance_applied_cents == 0 and deposit_refunded_cents == 2120"
            - "Invoice.refunded_cents == 2120 and balance_due_cents == 0"
            - "Waterfall conservation: 5000 == 2880 + 0 + 2120"

  - rule_id: non_linear_state_machine
    instances:
      - name: application_info_request_cycle_twice
        grounds:
          - state_machines.PermitApplication.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.PermitApplication.NEEDS_INFO_to_UNDER_REVIEW
