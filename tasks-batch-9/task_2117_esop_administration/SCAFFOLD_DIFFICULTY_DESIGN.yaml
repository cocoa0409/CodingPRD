      - name: put_window_closed_interval_plus_cooling_buffer_on_participant
        grounds:
          - calculations.put_window_cooling_buffer
          - validations[priority=16]
          - entities.Participant.fields.last_put_window_close_date
          - errors[ERR_PUT_WINDOW_BUFFER_VIOLATION]
        distinguishing_aspect: |
          Different interval arithmetic on a different resource entity: put windows on a
          Participant are closed on both ends and carry a mandatory 30-day cooling buffer,
          so adjacency is forbidden - a second window opening 2026-06-28 is refused while
          2026-06-29, exactly 30 days after the first window's inclusive close of
