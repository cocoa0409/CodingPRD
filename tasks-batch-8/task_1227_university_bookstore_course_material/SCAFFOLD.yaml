scenario: |
  generate task hard than expert level! 1227. University Bookstore & Course Material Adoption (Barnes & Noble College store): faculty adoption collection & deadline compliance, price transparency posting requirement, inventory buy decision (new/used/rental/digital), inclusive-access billing & opt-out handling, buyback pricing & wholesale market, financial-aid charge-to-account window, returns policy at term start, publisher deal & commission to institution

domain_name: university-bookstore-course-materials
api_prefix: /bookstore

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: AcademicTerm
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique term code, e.g. 2026-FALL", constraints: "unique" }
      - { name: length_weeks, type: integer, source: input, description: "Instruction weeks; drives rental tier", constraints: "> 0" }
      - { name: registration_open_at, type: datetime, source: input, description: "Registration open instant (UTC)" }
      - { name: price_posting_deadline_at, type: datetime, source: input, description: "HEOA price-transparency posting deadline" }
      - { name: adoption_deadline_at, type: datetime, source: input, description: "Faculty adoption deadline (inclusive): submitted_at <= deadline is on time" }
      - { name: aid_charge_window_start_at, type: datetime, source: input, description: "Financial-aid charge window start (inclusive)" }
      - { name: aid_charge_window_end_at, type: datetime, source: input, description: "Financial-aid charge window end (inclusive)" }
      - { name: add_drop_return_deadline_at, type: datetime, source: input, description: "Last instant for full-refund returns (inclusive)" }
      - { name: census_at, type: datetime, source: input, description: "Census instant; inclusive-access billing runs at/after this" }
      - { name: ia_opt_out_deadline_at, type: datetime, source: input, description: "Inclusive-access opt-out deadline (inclusive)" }
      - { name: buyback_window_start_at, type: datetime, source: input, description: "Buyback window start (inclusive)" }
      - { name: buyback_window_end_at, type: datetime, source: input, description: "Buyback window end (inclusive)" }
      - { name: buy_budget_cents, type: integer, source: input, description: "Term-level cap on committed buy-plan landed cost", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Lifecycle state", default: SETUP, constraints: "SETUP | ADOPTION_OPEN | ADOPTION_CLOSED | SALES_OPEN | CENSUS_DONE | BUYBACK_OPEN | TERM_CLOSED" }
      - { name: noncompliant_section_count, type: integer, source: computed, description: "Sections marked NON_COMPLIANT at adoption close", default: 0 }
      - { name: compliance_posture, type: enum, source: computed, description: "CLEAR if no non-compliant sections else RESTRICTED; gates commission issue", default: CLEAR, constraints: "CLEAR | RESTRICTED" }

  - name: Publisher
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Publisher name", constraints: "unique" }

  - name: PublisherAgreement
    parent: null
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: input, description: "FK -> Publisher.id" }
      - { name: start_date, type: string, source: input, description: "Closed interval start date YYYY-MM-DD (inclusive)" }
      - { name: end_date, type: string, source: input, description: "Closed interval end date YYYY-MM-DD (inclusive)" }
      - { name: discount_pct, type: number, source: input, description: "New-print discount off list, e.g. 0.10", constraints: "0 <= x < 1" }
      - { name: digital_discount_pct, type: number, source: input, description: "Digital format discount off list", constraints: "0 <= x < 1" }
      - { name: commission_pct, type: number, source: input, description: "Commission paid to institution on net sales", constraints: "0 <= x < 1" }

  - name: Title
    parent: null
    common_fields: true
    fields:
      - { name: isbn, type: string, source: input, description: "ISBN-13", constraints: "unique" }
      - { name: publisher_id, type: string, source: input, description: "FK -> Publisher.id" }
      - { name: list_price_cents, type: integer, source: input, description: "New-print list price in cents", constraints: "> 0" }
      - { name: has_new, type: boolean, source: input, description: "New format offered" }
      - { name: has_used, type: boolean, source: input, description: "Used format offered" }
      - { name: has_rental, type: boolean, source: input, description: "Rental format offered" }
      - { name: has_digital, type: boolean, source: input, description: "Digital format offered" }
      - { name: initial_new_stock_qty, type: integer, source: input, description: "Seeded new stock at creation", default: 0, constraints: ">= 0" }
      - { name: initial_used_stock_qty, type: integer, source: input, description: "Seeded used stock at creation", default: 0, constraints: ">= 0" }
      - { name: initial_rental_stock_qty, type: integer, source: input, description: "Seeded rental stock at creation", default: 0, constraints: ">= 0" }
      - { name: new_stock_qty, type: integer, source: computed, description: "On-hand new stock; decremented on NEW line placement, restocked on returns and buy-plan receipt" }
      - { name: used_stock_qty, type: integer, source: computed, description: "On-hand used stock; incremented on buyback accept, decremented on USED line placement" }
      - { name: rental_stock_qty, type: integer, source: computed, description: "On-hand rental stock; decremented on RENTAL line placement, restored on rental return" }

  - name: Faculty
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Instructor name" }
      - { name: email, type: string, source: input, description: "Instructor email", constraints: "unique" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Student name" }
      - { name: email, type: string, source: input, description: "Student email", constraints: "unique" }
      - { name: awarded_aid_cents, type: integer, source: input, description: "Total financial aid awarded for charges", default: 0, constraints: ">= 0" }
      - { name: aid_balance_cents, type: integer, source: computed, description: "Remaining aid; debited by order aid tenders and IA aid applications, credited by refunds; equals awarded_aid_cents at creation" }

  - name: CourseSection
    parent: null
    common_fields: true
    fields:
      - { name: term_id, type: string, source: input, description: "FK -> AcademicTerm.id" }
      - { name: faculty_id, type: string, source: input, description: "FK -> Faculty.id; adoption ownership anchor" }
      - { name: course_code, type: string, source: input, description: "e.g. CS101" }
      - { name: section_code, type: string, source: input, description: "e.g. 01", constraints: "unique with (term_id, course_code)" }
      - { name: enrollment_capacity, type: integer, source: input, description: "Max ENROLLED enrollments", constraints: ">= 0" }
      - { name: ia_enabled, type: boolean, source: input, description: "Inclusive-access billing enabled for this section" }
      - { name: ia_material_fee_cents, type: integer, source: input, description: "Inclusive-access fee; required when ia_enabled true", constraints: ">= 0; required iff ia_enabled" }
      - { name: status, type: enum, source: system, description: "Section lifecycle", default: DRAFT, constraints: "DRAFT | OPEN | LOCKED | CLOSED" }
      - { name: compliance_status, type: enum, source: computed, description: "PENDING until adoption close; then COMPLIANT or NON_COMPLIANT", default: PENDING, constraints: "PENDING | COMPLIANT | NON_COMPLIANT" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: section_id, type: string, source: input, description: "FK -> CourseSection.id" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: status, type: enum, source: system, description: "ENROLLED or DROPPED", default: ENROLLED, constraints: "ENROLLED | DROPPED", }

  - name: Adoption
    parent: null
    common_fields: true
    fields:
      - { name: section_id, type: string, source: input, description: "FK -> CourseSection.id" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id" }
      - { name: faculty_id, type: string, source: computed, description: "FK -> Faculty.id; copied from CourseSection.faculty_id at creation" }
      - { name: qty_new_requested, type: integer, source: input, description: "Requested new copies", constraints: ">= 0" }
      - { name: qty_used_requested, type: integer, source: input, description: "Requested used copies; buyback demand quota input", constraints: ">= 0" }
      - { name: qty_rental_requested, type: integer, source: input, description: "Requested rental copies", constraints: ">= 0" }
      - { name: qty_digital_requested, type: integer, source: input, description: "Requested digital seats", constraints: ">= 0" }
      - { name: posted_price_cents, type: integer, source: input, description: "HEOA price-transparency posted price; caps charged shelf price; required before submit", constraints: ">= 0; nullable until submit" }
      - { name: status, type: enum, source: system, description: "Adoption lifecycle", default: DRAFT, constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | RETURNED | EXPIRED | SUPERSEDED" }
      - { name: submitted_at, type: datetime, source: system, description: "Set at submit; null before" }
      - { name: late_flag, type: boolean, source: computed, description: "true iff submitted_at > term.adoption_deadline_at", default: false }
      - { name: transparency_late_flag, type: boolean, source: computed, description: "true iff submitted_at > term.price_posting_deadline_at", default: false }
      - { name: review_note, type: string, source: input, description: "Manager note on return; cleared when revised back to DRAFT" }

  - name: BuyPlan
    parent: null
    common_fields: true
    fields:
      - { name: adoption_id, type: string, source: system, description: "FK -> Adoption.id; created by approve cascade; unique", constraints: "unique" }
      - { name: qty_new, type: integer, source: input, description: "Decided new quantity (initialized from adoption request)", constraints: ">= 0" }
      - { name: qty_used, type: integer, source: input, description: "Decided used quantity", constraints: ">= 0" }
      - { name: qty_rental, type: integer, source: input, description: "Decided rental quantity", constraints: ">= 0" }
      - { name: qty_digital, type: integer, source: input, description: "Decided digital seats", constraints: ">= 0" }
      - { name: discount_pct_applied, type: number, source: computed, description: "Agreement discount plus tier bonus when projected publisher volume crosses tier", default: 0 }
      - { name: tier_bonus_applied, type: boolean, source: computed, description: "true when projected cumulative committed units >= TIER_QTY at commit", default: false }
      - { name: landed_cost_cents, type: integer, source: computed, description: "qty_new * round_half_up(list_price_cents * (1 - discount_pct_applied)); computed at commit", default: 0 }
      - { name: status, type: enum, source: system, description: "Buy plan lifecycle", default: DRAFT, constraints: "DRAFT | COMMITTED | RECEIVED | CANCELLED" }
      - { name: committed_by_user_id, type: string, source: system, description: "X-User-ID of committing manager; segregation-of-duties anchor" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: computed, description: "FK -> Student.id; taken from X-User-ID" }
      - { name: term_id, type: string, source: input, description: "FK -> AcademicTerm.id" }
      - { name: aid_only, type: boolean, source: input, description: "If true, order must be fully aid-tendered", default: false }
      - { name: total_cents, type: integer, source: computed, description: "Sum of line_total_cents", default: 0 }
      - { name: aid_tendered_cents, type: integer, source: computed, description: "Aid portion applied by waterfall", default: 0 }
      - { name: card_tendered_cents, type: integer, source: computed, description: "Card remainder", default: 0 }
      - { name: refund_total_cents, type: integer, source: computed, description: "Sum of line refunds", default: 0 }
      - { name: status, type: enum, source: system, description: "Order lifecycle", default: SETTLED, constraints: "SETTLED | PARTIALLY_REFUNDED | REFUNDED | CLOSED" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: adoption_id, type: string, source: input, description: "FK -> Adoption.id; pins title, section, posted price" }
      - { name: title_id, type: string, source: computed, description: "FK -> Title.id; copied from adoption" }
      - { name: format, type: enum, source: input, description: "Purchase format", constraints: "NEW | USED | RENTAL | DIGITAL" }
      - { name: qty, type: integer, source: input, description: "Units; must be 1 for RENTAL and DIGITAL", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Shelf price resolved at placement, capped by adoption.posted_price_cents" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents * qty" }
      - { name: aid_tendered_cents, type: integer, source: computed, description: "Aid applied to this line by waterfall", default: 0 }
      - { name: card_tendered_cents, type: integer, source: computed, description: "Card applied to this line", default: 0 }
      - { name: aid_refunded_cents, type: integer, source: computed, description: "Aid refunded on return", default: 0 }
      - { name: card_refunded_cents, type: integer, source: computed, description: "Card refunded on return", default: 0 }
      - { name: status, type: enum, source: system, description: "Line lifecycle", default: FULFILLED, constraints: "FULFILLED | RETURNED" }

  - name: InclusiveAccessCharge
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; one charge per enrollment", constraints: "unique" }
      - { name: section_id, type: string, source: system, description: "FK -> CourseSection.id" }
      - { name: student_id, type: string, source: system, description: "FK -> Student.id" }
      - { name: term_id, type: string, source: system, description: "FK -> AcademicTerm.id" }
      - { name: fee_cents, type: integer, source: computed, description: "Locked from CourseSection.ia_material_fee_cents at creation" }
      - { name: aid_applied_cents, type: integer, source: computed, description: "Aid applied at census billing", default: 0 }
      - { name: balance_due_cents, type: integer, source: computed, description: "fee_cents - aid_applied_cents while BILLED; zeroed on refund", default: 0 }
      - { name: status, type: enum, source: system, description: "IA charge lifecycle", default: PENDING, constraints: "PENDING | OPTED_OUT | BILLED | REFUNDED | CANCELLED" }
      - { name: opted_out_at, type: datetime, source: system, description: "Set on opt-out; cleared on revoke" }

  - name: WholesaleQuote
    parent: null
    common_fields: true
    fields:
      - { name: title_id, type: string, source: input, description: "FK -> Title.id" }
      - { name: condition, type: enum, source: input, description: "Copy condition grade", constraints: "LIKE_NEW | GOOD | ACCEPTABLE" }
      - { name: price_cents, type: integer, source: input, description: "Wholesale market price", constraints: "> 0" }
      - { name: effective_from, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Half-open window end (exclusive)" }

  - name: BuybackTicket
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: computed, description: "FK -> Student.id; taken from X-User-ID" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id" }
      - { name: upcoming_term_id, type: string, source: input, description: "FK -> AcademicTerm.id; term whose adoptions define demand" }
      - { name: condition, type: enum, source: input, description: "Declared condition grade", constraints: "LIKE_NEW | GOOD | ACCEPTABLE" }
      - { name: pricing_variant, type: enum, source: computed, description: "NEEDS_BASED when adoption demand quota unmet else WHOLESALE", constraints: "NEEDS_BASED | WHOLESALE" }
      - { name: quoted_price_cents, type: integer, source: computed, description: "Locked offer price at creation" }
      - { name: quote_valid_until, type: datetime, source: system, description: "now + QUOTE_TTL_HOURS at creation" }
      - { name: status, type: enum, source: system, description: "Ticket lifecycle", default: QUOTED, constraints: "QUOTED | ACCEPTED | PAID | EXPIRED | REJECTED" }

  - name: CommissionStatement
    parent: null
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: input, description: "FK -> Publisher.id" }
      - { name: term_id, type: string, source: input, description: "FK -> AcademicTerm.id" }
      - { name: calculation_variant, type: enum, source: computed, description: "PROVISIONAL snapshot at draft creation; FINAL recompute at issue", constraints: "PROVISIONAL | FINAL" }
      - { name: gross_sales_cents, type: integer, source: computed, description: "Sum of line totals for publisher titles in term", default: 0 }
      - { name: returns_cents, type: integer, source: computed, description: "Sum of line refunds counted in this calculation", default: 0 }
      - { name: net_sales_cents, type: integer, source: computed, description: "gross_sales_cents - returns_cents", default: 0 }
      - { name: commission_cents, type: integer, source: computed, description: "Sum over titles of round_half_up(title_net * commission_pct)", default: 0 }
      - { name: status, type: enum, source: system, description: "Statement lifecycle", default: DRAFT, constraints: "DRAFT | ISSUED | SETTLED" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of issuing FinanceAdmin" }

state_machines:
  - entity: AcademicTerm
    initial_state: SETUP
    terminal_states: [TERM_CLOSED]
    transitions:
      - from: SETUP
        to: ADOPTION_OPEN
        trigger: "POST /bookstore/terms/{id}/open-adoption"
        actor: PlatformAdmin
        preconditions: ["term.status == SETUP"]
        side_effects: ["term.version incremented"]
      - from: ADOPTION_OPEN
        to: ADOPTION_CLOSED
        trigger: "POST /bookstore/terms/{id}/close-adoption"
        actor: BookstoreManager
        preconditions: ["term.status == ADOPTION_OPEN"]
        side_effects:
          - "CASCADE-1 hop 1: every Adoption (of sections in this term) in status DRAFT or RETURNED transitions to EXPIRED"
          - "CASCADE-1 hop 2: each Adoption flip recomputes its CourseSection.compliance_status: NON_COMPLIANT iff the section has zero APPROVED adoptions OR any adoption (any status) with late_flag == true; else COMPLIANT"
          - "CASCADE-1 hop 3: each CourseSection compliance flip recomputes AcademicTerm.noncompliant_section_count (count of NON_COMPLIANT sections in term) and AcademicTerm.compliance_posture (RESTRICTED iff count > 0 else CLEAR)"
          - "term.version incremented"
      - from: ADOPTION_CLOSED
        to: SALES_OPEN
        trigger: "POST /bookstore/terms/{id}/open-sales"
        actor: BookstoreManager
        preconditions: ["term.status == ADOPTION_CLOSED"]
        side_effects: ["term.version incremented"]
      - from: SALES_OPEN
        to: CENSUS_DONE
        trigger: "POST /bookstore/terms/{id}/run-census-billing"
        actor: BookstoreManager
        preconditions: ["term.status == SALES_OPEN", "now >= term.census_at (else ERR_CENSUS_NOT_REACHED)"]
        side_effects:
          - "every InclusiveAccessCharge in status PENDING whose CourseSection.status == LOCKED transitions to BILLED with aid_applied_cents and balance_due_cents per calculations.ia_billing_split"
          - "CASCADE: each BILLED charge debits Student.aid_balance_cents by aid_applied_cents and bumps Student.version"
          - "term.version incremented"
      - from: CENSUS_DONE
        to: BUYBACK_OPEN
        trigger: "POST /bookstore/terms/{id}/open-buyback"
        actor: BookstoreManager
        preconditions: ["term.status == CENSUS_DONE"]
        side_effects: ["term.version incremented"]
      - from: BUYBACK_OPEN
        to: TERM_CLOSED
        trigger: "POST /bookstore/terms/{id}/close"
        actor: BookstoreManager
        preconditions: ["term.status == BUYBACK_OPEN"]
        side_effects:
          - "every BuybackTicket in QUOTED with quote_valid_until <= now transitions to EXPIRED"
          - "every Order in SETTLED or PARTIALLY_REFUNDED for this term transitions to CLOSED"
          - "every CourseSection in LOCKED for this term transitions to CLOSED"
          - "term.version incremented"

  - entity: CourseSection
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /bookstore/sections/{id}/open"
        actor: PlatformAdmin
        preconditions: ["section.status == DRAFT", "term.status IN {ADOPTION_OPEN, ADOPTION_CLOSED, SALES_OPEN}"]
        side_effects: ["section.version incremented"]
      - from: OPEN
        to: LOCKED
        trigger: "POST /bookstore/sections/{id}/lock"
        actor: BookstoreManager
        preconditions: ["section.status == OPEN", "term.status == SALES_OPEN"]
        side_effects:
          - "if section.ia_enabled: for each Enrollment with status ENROLLED, create InclusiveAccessCharge PENDING with fee_cents locked from section.ia_material_fee_cents"
          - "section.version incremented"
      - from: LOCKED
        to: CLOSED
        trigger: "POST /bookstore/terms/{id}/close (cascade)"
        actor: system
        preconditions: ["term closing"]
        side_effects: ["section.version incremented"]

  - entity: Enrollment
    initial_state: ENROLLED
    terminal_states: [DROPPED]
    transitions:
      - from: ENROLLED
        to: DROPPED
        trigger: "POST /bookstore/enrollments/{id}/drop"
        actor: Student | BookstoreManager
        preconditions:
          - "enrollment.status == ENROLLED"
          - "if actor is Student: enrollment.student_id == X-User-ID AND section.status != LOCKED (else ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE: if an InclusiveAccessCharge for this enrollment is PENDING or OPTED_OUT, it transitions to CANCELLED"
          - "CASCADE: if that charge is BILLED, it transitions to REFUNDED, Student.aid_balance_cents is credited by aid_applied_cents, and balance_due_cents is zeroed"
          - "enrollment.version incremented"

  - entity: Adoption
    initial_state: DRAFT
    terminal_states: [EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /bookstore/adoptions/{id}/submit"
        actor: Faculty
        preconditions:
          - "adoption.status == DRAFT"
          - "adoption.faculty_id == X-User-ID (else ERR_NOT_OWNER)"
          - "term.status == ADOPTION_OPEN (else ERR_INVALID_STATE)"
          - "adoption.posted_price_cents is not null (else ERR_PRICE_POSTING_REQUIRED)"
        side_effects:
          - "submitted_at = now"
          - "late_flag = (now > term.adoption_deadline_at)"
          - "transparency_late_flag = (now > term.price_posting_deadline_at)"
          - "adoption.version incremented"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /bookstore/adoptions/{id}/start-review"
        actor: BookstoreManager
        preconditions: ["adoption.status == SUBMITTED"]
        side_effects: ["adoption.version incremented"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /bookstore/adoptions/{id}/approve"
        actor: BookstoreManager
        preconditions:
          - "adoption.status == UNDER_REVIEW"
          - "an active PublisherAgreement covers title.publisher_id at now (else ERR_NO_ACTIVE_AGREEMENT)"
        side_effects:
          - "create BuyPlan DRAFT with adoption_id, qty_new/qty_used/qty_rental/qty_digital initialized from adoption requested quantities"
          - "adoption.version incremented"
      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /bookstore/adoptions/{id}/return"
        actor: BookstoreManager
        preconditions: ["adoption.status == UNDER_REVIEW"]
        side_effects: ["review_note stored", "adoption.version incremented"]
      - from: RETURNED
        to: DRAFT
        trigger: "PATCH /bookstore/adoptions/{id} (revision loop)"
        actor: Faculty
        preconditions: ["adoption.status == RETURNED", "adoption.faculty_id == X-User-ID", "term.status == ADOPTION_OPEN"]
        side_effects: ["status becomes DRAFT", "review_note cleared", "submitted_at cleared", "late_flag and transparency_late_flag reset to false", "adoption.version incremented"]
      - from: DRAFT
        to: EXPIRED
        trigger: "POST /bookstore/terms/{id}/close-adoption (cascade sweep)"
        actor: system
        preconditions: ["term closing adoption period"]
        side_effects: ["triggers CourseSection.compliance_status recompute (CASCADE-1 hop 2)"]
      - from: RETURNED
        to: EXPIRED
        trigger: "POST /bookstore/terms/{id}/close-adoption (cascade sweep)"
        actor: system
        preconditions: ["term closing adoption period"]
        side_effects: ["triggers CourseSection.compliance_status recompute (CASCADE-1 hop 2)"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "POST /bookstore/adoptions (create-with-supersede for same section_id + title_id)"
        actor: system
        preconditions: ["new adoption creation succeeds"]
        side_effects: ["prior BuyPlan (if still DRAFT) transitions to CANCELLED", "adoption.version incremented"]

  - entity: BuyPlan
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: COMMITTED
        trigger: "POST /bookstore/buy-plans/{id}/commit"
        actor: BookstoreManager
        preconditions:
          - "plan.status == DRAFT"
          - "adoption.status == APPROVED (else ERR_ADOPTION_NOT_APPROVED)"
          - "expected_buy_plan_version == plan.version (else ERR_STALE_VERSION)"
          - "sum of landed_cost_cents over COMMITTED/RECEIVED plans in the term + this plan's landed_cost_cents <= term.buy_budget_cents (else ERR_TERM_BUDGET_EXCEEDED)"
        side_effects:
          - "calculations.buyplan_landed_cost computes discount_pct_applied, tier_bonus_applied, landed_cost_cents"
          - "committed_by_user_id = X-User-ID"
          - "plan.version incremented"
      - from: COMMITTED
        to: RECEIVED
        trigger: "POST /bookstore/buy-plans/{id}/receive"
        actor: BookstoreManager
        preconditions: ["plan.status == COMMITTED", "each received qty <= committed qty (else ERR_VALIDATION)"]
        side_effects:
          - "Title.new_stock_qty += received_new_qty; Title.used_stock_qty += received_used_qty; Title.rental_stock_qty += received_rental_qty"
          - "Title.version incremented; plan.version incremented"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /bookstore/buy-plans/{id}/cancel or supersede cascade"
        actor: BookstoreManager | system
        preconditions: ["plan.status == DRAFT"]
        side_effects: ["plan.version incremented"]
      - from: COMMITTED
        to: CANCELLED
        trigger: "POST /bookstore/buy-plans/{id}/cancel"
        actor: BookstoreManager
        preconditions: ["plan.status == COMMITTED"]
        side_effects: ["plan.version incremented"]

  - entity: Order
    initial_state: SETTLED
    terminal_states: [REFUNDED, CLOSED]
    transitions:
      - from: SETTLED
        to: PARTIALLY_REFUNDED
        trigger: "POST /bookstore/orders/{id}/lines/{line_id}/return (first line return)"
        actor: Student | BookstoreManager
        preconditions: ["order.status == SETTLED"]
        side_effects: ["order.refund_total_cents recomputed (CASCADE-2 hop 2)", "order.version incremented"]
      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /bookstore/orders/{id}/lines/{line_id}/return (last open line returned)"
        actor: Student | BookstoreManager
        preconditions: ["all lines RETURNED after this return"]
        side_effects: ["order.refund_total_cents recomputed", "order.version incremented"]
      - from: PARTIALLY_REFUNDED
        to: PARTIALLY_REFUNDED
        trigger: "POST /bookstore/orders/{id}/lines/{line_id}/return (more lines remain)"
        actor: Student | BookstoreManager
        preconditions: ["order.status == PARTIALLY_REFUNDED"]
        side_effects: ["order.refund_total_cents recomputed", "order.version incremented"]
      - from: SETTLED
        to: CLOSED
        trigger: "POST /bookstore/terms/{id}/close (cascade)"
        actor: system
        preconditions: ["term closing"]
        side_effects: ["order.version incremented"]
      - from: PARTIALLY_REFUNDED
        to: CLOSED
        trigger: "POST /bookstore/terms/{id}/close (cascade)"
        actor: system
        preconditions: ["term closing"]
        side_effects: ["order.version incremented"]

  - entity: OrderLine
    initial_state: FULFILLED
    terminal_states: [RETURNED]
    transitions:
      - from: FULFILLED
        to: RETURNED
        trigger: "POST /bookstore/orders/{id}/lines/{line_id}/return"
        actor: Student | BookstoreManager
        preconditions:
          - "line.status == FULFILLED (else ERR_INVALID_STATE)"
          - "order.status IN {SETTLED, PARTIALLY_REFUNDED}"
          - "if actor is Student: order.student_id == X-User-ID (else ERR_NOT_OWNER)"
          - "if format == DIGITAL: now <= order.created_at + DIGITAL_RETURN_HOURS (else ERR_DIGITAL_NOT_RETURNABLE)"
          - "if format != DIGITAL: now <= term.add_drop_return_deadline_at, unless actor is BookstoreManager with override == true (else ERR_RETURN_WINDOW_CLOSED)"
        side_effects:
          - "restock: NEW -> Title.new_stock_qty += qty; USED -> Title.used_stock_qty += qty; RENTAL -> Title.rental_stock_qty += qty; DIGITAL -> no restock"
          - "calculations.order_line_refund computes refund (full vs override variant) and splits aid_refunded_cents / card_refunded_cents"
          - "Student.aid_balance_cents credited by aid_refunded_cents; Student.version incremented"
          - "CASCADE-2 hop 2: the OrderLine mutation recomputes Order.refund_total_cents and re-derives Order.status (PARTIALLY_REFUNDED or REFUNDED)"
          - "line.version incremented"

  - entity: InclusiveAccessCharge
    initial_state: PENDING
    terminal_states: [REFUNDED, CANCELLED]
    transitions:
      - from: PENDING
        to: OPTED_OUT
        trigger: "POST /bookstore/inclusive-access-charges/{id}/opt-out"
        actor: Student
        preconditions:
          - "charge.status == PENDING (on BILLED -> ERR_CHARGE_ALREADY_BILLED)"
          - "charge.student_id == X-User-ID (else ERR_NOT_OWNER)"
          - "now <= term.ia_opt_out_deadline_at (else ERR_OPT_OUT_WINDOW_CLOSED)"
        side_effects: ["opted_out_at = now", "charge.version incremented"]
      - from: OPTED_OUT
        to: PENDING
        trigger: "POST /bookstore/inclusive-access-charges/{id}/revoke-opt-out"
        actor: Student
        preconditions:
          - "charge.status == OPTED_OUT (else ERR_INVALID_STATE)"
          - "charge.student_id == X-User-ID (else ERR_NOT_OWNER)"
          - "now <= term.ia_opt_out_deadline_at (else ERR_OPT_OUT_WINDOW_CLOSED)"
        side_effects: ["opted_out_at cleared", "charge.version incremented"]
      - from: PENDING
        to: BILLED
        trigger: "POST /bookstore/terms/{id}/run-census-billing (cascade)"
        actor: system
        preconditions: ["charge.status == PENDING", "section.status == LOCKED", "now >= term.census_at"]
        side_effects:
          - "calculations.ia_billing_split sets aid_applied_cents and balance_due_cents"
          - "Student.aid_balance_cents debited by aid_applied_cents; Student.version incremented"
          - "charge.version incremented"
      - from: BILLED
        to: REFUNDED
        trigger: "POST /bookstore/inclusive-access-charges/{id}/refund or enrollment drop cascade"
        actor: BookstoreManager | system
        preconditions: ["charge.status == BILLED"]
        side_effects:
          - "Student.aid_balance_cents credited by aid_applied_cents; Student.version incremented"
          - "aid_applied_cents zeroed; balance_due_cents zeroed"
          - "charge.version incremented"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /bookstore/enrollments/{id}/drop (cascade)"
        actor: system
        preconditions: ["enrollment dropped before billing"]
        side_effects: ["charge.version incremented"]
      - from: OPTED_OUT
        to: CANCELLED
        trigger: "POST /bookstore/enrollments/{id}/drop (cascade)"
        actor: system
        preconditions: ["enrollment dropped before billing"]
        side_effects: ["charge.version incremented"]

  - entity: BuybackTicket
    initial_state: QUOTED
    terminal_states: [PAID, EXPIRED, REJECTED]
    transitions:
      - from: QUOTED
        to: ACCEPTED
        trigger: "POST /bookstore/buyback-tickets/{id}/accept"
        actor: Student
        preconditions:
          - "ticket.status == QUOTED (else ERR_INVALID_STATE)"
          - "ticket.student_id == X-User-ID (else ERR_NOT_OWNER)"
          - "now <= ticket.quote_valid_until (else ERR_QUOTE_EXPIRED)"
          - "a term in BUYBACK_OPEN has buyback_window_start_at <= now <= buyback_window_end_at (else ERR_BUYBACK_WINDOW_CLOSED)"
        side_effects:
          - "demand quota consumed: accepted_count(title_id, upcoming_term_id) increments (tickets in {ACCEPTED, PAID})"
          - "Title.used_stock_qty += 1; Title.version incremented"
          - "ticket.version incremented"
      - from: ACCEPTED
        to: PAID
        trigger: "POST /bookstore/buyback-tickets/{id}/pay"
        actor: BookstoreManager
        preconditions: ["ticket.status == ACCEPTED (else ERR_INVALID_STATE)"]
        side_effects: ["ticket.version incremented"]
      - from: QUOTED
        to: REJECTED
        trigger: "POST /bookstore/buyback-tickets/{id}/reject"
        actor: BookstoreManager
        preconditions: ["ticket.status == QUOTED"]
        side_effects: ["ticket.version incremented"]
      - from: ACCEPTED
        to: REJECTED
        trigger: "POST /bookstore/buyback-tickets/{id}/reject (intake condition mismatch)"
        actor: BookstoreManager
        preconditions: ["ticket.status == ACCEPTED"]
        side_effects:
          - "compensation: Title.used_stock_qty -= 1; Title.version incremented"
          - "demand quota released: accepted_count decrements"
          - "ticket.version incremented"
      - from: QUOTED
        to: EXPIRED
        trigger: "POST /bookstore/terms/{id}/close (cascade sweep)"
        actor: system
        preconditions: ["quote_valid_until <= now"]
        side_effects: ["ticket.version incremented"]

  - entity: CommissionStatement
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /bookstore/commission-statements/{id}/issue"
        actor: FinanceAdmin
        preconditions:
          - "statement.status == DRAFT"
          - "term.compliance_posture == CLEAR (else ERR_TERM_NOT_COMPLIANT)"
          - "X-User-ID not in { committed_by_user_id of BuyPlans in COMMITTED/RECEIVED for this publisher in this term } (else ERR_SOD_COMMISSION_CONFLICT)"
        side_effects:
          - "calculations.publisher_commission recomputed with FINAL variant (includes all returns through issue time) and locked"
          - "calculation_variant = FINAL; issued_by_user_id = X-User-ID"
          - "statement.version incremented"
      - from: ISSUED
        to: SETTLED
        trigger: "POST /bookstore/commission-statements/{id}/settle"
        actor: FinanceAdmin
        preconditions: ["statement.status == ISSUED"]
        side_effects: ["statement.version incremented"]

concurrency_rules:
  - rule_id: adoption-patch-stale-version
    parent_entity: Adoption
    write_endpoint: "PATCH /bookstore/adoptions/{id}"
    occ_field: expected_adoption_version
    description: |
      Updating an Adoption whose version has advanced since the client last
      observed it is rejected; the client's quantities and posted price are
      based on a stale read of the adoption.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: adoption-create-supersede-stale-section
    parent_entity: CourseSection
    write_endpoint: "POST /bookstore/adoptions"
    occ_field: expected_section_version
    description: |
      Creating an Adoption against a CourseSection whose version has advanced
      since the client last observed it is rejected; adoption creation
      legitimately supersedes a prior APPROVED adoption for the same
      (section_id, title_id), so the client's view of which adoption is in
      force is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: buyplan-commit-stale-version
    parent_entity: BuyPlan
    write_endpoint: "POST /bookstore/buy-plans/{id}/commit"
    occ_field: expected_buy_plan_version
    description: |
      Committing a BuyPlan whose version has advanced since the client last
      observed it is rejected; the tier projection and budget arithmetic the
      client relied on were computed from stale quantities.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: buyback-create-stale-title
    parent_entity: Title
    write_endpoint: "POST /bookstore/buyback-tickets"
    occ_field: expected_title_version
    description: |
      Creating a BuybackTicket against a Title whose version has advanced
      since the client last observed it is rejected; the needs-based vs
      wholesale variant selection depends on demand-quota consumption and
      stock movements that bump Title.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: shelf_price_resolution
    trigger: "on POST /bookstore/orders for each line"
    algorithm: tiered_pricing
    formula: |
      base(format):
        NEW     -> list_price_cents
        USED    -> round_half_up(USED_RATIO * list_price_cents)
        RENTAL  -> round_half_up(rental_pct * list_price_cents)
                   where rental_pct = 0.40 if term.length_weeks <= 8
                                      0.50 if 9 <= term.length_weeks <= 16
                                      0.60 if term.length_weeks >= 17
        DIGITAL -> round_half_up(list_price_cents * (1 - active_agreement.digital_discount_pct))
      unit_price_cents = min(base(format), adoption.posted_price_cents)   # HEOA cap; posted price is an upper bound
      line_total_cents = unit_price_cents * qty
    input_set: "order lines at placement; agreement active for title.publisher_id at now"
    constants:
      USED_RATIO: 0.75
      RENTAL_TIER_1_MAX_WEEKS: 8
      RENTAL_TIER_1_PCT: 0.40
      RENTAL_TIER_2_MAX_WEEKS: 16
      RENTAL_TIER_2_PCT: 0.50
      RENTAL_TIER_3_PCT: 0.60
    precision: "integer cents, round_half_up per line before min() cap"

  - name: aid_tender_waterfall
    trigger: "on POST /bookstore/orders after line pricing"
    algorithm: waterfall_allocation
    formula: |
      aid_window_open = (term.aid_charge_window_start_at <= now <= term.aid_charge_window_end_at)
      if aid_only and not aid_window_open -> ERR_AID_WINDOW_CLOSED
      remaining_aid = student.aid_balance_cents if aid_window_open else 0
      for each line in request-array order (index ASC; ties impossible):
        line.aid_tendered_cents = min(line.line_total_cents, remaining_aid)
        line.card_tendered_cents = line.line_total_cents - line.aid_tendered_cents
        remaining_aid -= line.aid_tendered_cents
      order.aid_tendered_cents = sum(line.aid_tendered_cents)
      order.card_tendered_cents = sum(line.card_tendered_cents)
      if aid_only and order.aid_tendered_cents < order.total_cents -> ERR_INSUFFICIENT_AID
      student.aid_balance_cents -= order.aid_tendered_cents
    input_set: "lines of the new order only, in request array order"
    constants: {}
    precision: "integer cents"

  - name: order_line_refund
    trigger: "on POST /bookstore/orders/{id}/lines/{line_id}/return"
    algorithm: threshold
    formula: |
      variant within_window:
        applies when format != DIGITAL and now <= term.add_drop_return_deadline_at
        (DIGITAL: when now <= order.created_at + DIGITAL_RETURN_HOURS)
        refund_cents = line_total_cents
      variant manager_override_post_deadline:
        applies when format != DIGITAL, now > term.add_drop_return_deadline_at,
        actor is BookstoreManager and override == true
        refund_cents = round_half_up((1 - RESTOCKING_KEEP_PCT) * line_total_cents)
      split (both variants):
        aid_refunded_cents = min(line.aid_tendered_cents, refund_cents)
        card_refunded_cents = refund_cents - aid_refunded_cents
    input_set: "the single returned line"
    constants:
      RESTOCKING_KEEP_PCT: 0.20
      DIGITAL_RETURN_HOURS: 48
    precision: "integer cents, round_half_up"
    variants:
      - name: within_window
        when: "return on or before the applicable deadline"
        difference: "100% of line_total_cents refunded to original tenders"
      - name: manager_override_post_deadline
        when: "past add/drop deadline with manager override"
        difference: "80% of line_total_cents refunded; 20% restocking kept (counts as net revenue)"

  - name: buyback_offer_price
    trigger: "on POST /bookstore/buyback-tickets"
    algorithm: threshold
    formula: |
      quota = sum(qty_used_requested) over APPROVED adoptions of (title_id, upcoming_term_id)
      accepted_count = count of BuybackTickets for (title_id, upcoming_term_id) in {ACCEPTED, PAID}
      if quota > 0 and accepted_count < quota:
        pricing_variant = NEEDS_BASED
        quoted_price_cents = round_half_up(NEEDS_RATIO * title.list_price_cents)
      else:
        pricing_variant = WHOLESALE
        quoted_price_cents = price_cents of the unique WholesaleQuote for (title_id, condition)
                             with effective_from <= now < effective_to
                             (half-open; adjacency effective_from == prior.effective_to is allowed)
        if no such quote -> ERR_WHOLESALE_QUOTE_MISSING
      quote_valid_until = now + QUOTE_TTL_HOURS
    input_set: "APPROVED adoptions of the title in upcoming_term_id; tickets in {ACCEPTED, PAID}; quotes active at now"
    constants:
      NEEDS_RATIO: 0.50
      QUOTE_TTL_HOURS: 24
    precision: "integer cents, round_half_up"
    variants:
      - name: needs_based
        when: "approved-adoption demand quota for the upcoming term is not yet consumed"
        difference: "50% of new list price regardless of condition"
      - name: wholesale
        when: "no unmet demand quota"
        difference: "wholesale market price for the declared condition at now"

  - name: buyplan_landed_cost
    trigger: "on POST /bookstore/buy-plans/{id}/commit"
    algorithm: constraint_propagation
    formula: |
      evaluation order is pinned (circular-looking dependency made explicit):
      (1) gross_units = plan.qty_new + plan.qty_used + plan.qty_rental + plan.qty_digital
      (2) projected_units = gross_units + sum of (qty_new+qty_used+qty_rental+qty_digital)
          over BuyPlans in status {COMMITTED, RECEIVED} in the same term for the same publisher
      (3) tier_bonus = TIER_BONUS_PCT if projected_units >= TIER_QTY else 0
      (4) discount_pct_applied = active_agreement.discount_pct + tier_bonus
      (5) unit_new_cost = round_half_up(list_price_cents * (1 - discount_pct_applied))
      (6) landed_cost_cents = qty_new * unit_new_cost
      tier_bonus_applied = (tier_bonus > 0)
      Note: the tier is selected on projected volume INCLUDING this plan, but the bonus
      applies only to this plan's cost; no retroactive repricing of prior plans.
    input_set: "this plan; COMMITTED/RECEIVED plans in same term whose adoption's title shares the publisher"
    constants:
      TIER_QTY: 100
      TIER_BONUS_PCT: 0.02
    precision: "integer cents, round_half_up"

  - name: publisher_commission
    trigger: "on POST /bookstore/commission-statements (PROVISIONAL) and on POST /bookstore/commission-statements/{id}/issue (FINAL)"
    algorithm: aggregation
    formula: |
      rounding order is pinned: per-title round THEN sum (NOT sum then round).
      for each Title t where t.publisher_id == statement.publisher_id:
        title_gross = sum(line_total_cents) over OrderLines with title_id == t.id
                      in orders with term_id == statement.term_id (all non-CLOSED-excluded; both FULFILLED and RETURNED lines contribute gross)
        title_returns = sum(aid_refunded_cents + card_refunded_cents) over those lines
        title_net = title_gross - title_returns
        title_commission = round_half_up(title_net * active_agreement.commission_pct)
      gross_sales_cents = sum(title_gross); returns_cents = sum(title_returns)
      net_sales_cents = gross_sales_cents - returns_cents
      commission_cents = sum(title_commission)   # sum of per-title rounded values
    input_set: "all OrderLines for the publisher's titles in the term; returns counted only if processed before calculation time"
    constants: {}
    precision: "integer cents, round_half_up per title"
    variants:
      - name: provisional
        when: "statement created (status DRAFT)"
        difference: "snapshot: only returns processed before creation are netted out"
      - name: final
        when: "statement issued (DRAFT -> ISSUED)"
        difference: "recomputed including returns processed between creation and issue; then locked"

  - name: ia_billing_split
    trigger: "on census billing run for each PENDING charge in a LOCKED section"
    algorithm: waterfall_allocation
    formula: |
      in_window = (term.aid_charge_window_start_at <= now <= term.aid_charge_window_end_at)
      aid_applied_cents = min(charge.fee_cents, student.aid_balance_cents) if in_window else 0
      balance_due_cents = charge.fee_cents - aid_applied_cents
      student.aid_balance_cents -= aid_applied_cents
    input_set: "the single charge being billed"
    constants: {}
    precision: "integer cents"

validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role is allowed for this endpoint per §1.5 roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "ownership: Faculty actor matches adoption.faculty_id (via section), Student actor matches order/charge/ticket student_id", error_id: ERR_NOT_OWNER, http_status: 403, applies_to: "owner-scoped endpoints" }
  - { priority: 4, category: existence, check: "path ids and body FK ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "target resource from-state matches the transition (generic)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 5, category: state, check: "opt-out/revoke on a charge already BILLED", error_id: ERR_CHARGE_ALREADY_BILLED, http_status: 409, applies_to: ["POST /bookstore/inclusive-access-charges/{id}/opt-out", "POST /bookstore/inclusive-access-charges/{id}/revoke-opt-out"] }
  - { priority: 6, category: business_safety, check: "adoption submit requires posted_price_cents non-null (HEOA price transparency)", error_id: ERR_PRICE_POSTING_REQUIRED, http_status: 422, applies_to: ["POST /bookstore/adoptions/{id}/submit"] }
  - { priority: 6, category: business_safety, check: "segregation of duties: commission issuer id differs from every committed buy-plan committer id for the publisher+term", error_id: ERR_SOD_COMMISSION_CONFLICT, http_status: 403, applies_to: ["POST /bookstore/commission-statements/{id}/issue"] }
  - { priority: 7, category: business_temporal, check: "census run requires now >= census_at", error_id: ERR_CENSUS_NOT_REACHED, http_status: 422, applies_to: ["POST /bookstore/terms/{id}/run-census-billing"] }
  - { priority: 7, category: business_temporal, check: "aid tender requires now inside [aid_charge_window_start_at, aid_charge_window_end_at] inclusive when aid_only is true", error_id: ERR_AID_WINDOW_CLOSED, http_status: 422, applies_to: ["POST /bookstore/orders"] }
  - { priority: 7, category: business_temporal, check: "non-digital return requires now <= add_drop_return_deadline_at unless manager override", error_id: ERR_RETURN_WINDOW_CLOSED, http_status: 422, applies_to: ["POST /bookstore/orders/{id}/lines/{line_id}/return"] }
  - { priority: 7, category: business_temporal, check: "digital return requires now <= order.created_at + 48h", error_id: ERR_DIGITAL_NOT_RETURNABLE, http_status: 422, applies_to: ["POST /bookstore/orders/{id}/lines/{line_id}/return"] }
  - { priority: 7, category: business_temporal, check: "IA opt-out and revoke require now <= ia_opt_out_deadline_at", error_id: ERR_OPT_OUT_WINDOW_CLOSED, http_status: 422, applies_to: ["POST /bookstore/inclusive-access-charges/{id}/opt-out", "POST /bookstore/inclusive-access-charges/{id}/revoke-opt-out"] }
  - { priority: 7, category: business_temporal, check: "buyback create/accept requires a BUYBACK_OPEN term whose window contains now", error_id: ERR_BUYBACK_WINDOW_CLOSED, http_status: 422, applies_to: ["POST /bookstore/buyback-tickets", "POST /bookstore/buyback-tickets/{id}/accept"] }
  - { priority: 7, category: business_temporal, check: "ticket accept requires now <= quote_valid_until", error_id: ERR_QUOTE_EXPIRED, http_status: 422, applies_to: ["POST /bookstore/buyback-tickets/{id}/accept"] }
  - { priority: 8, category: business_constraint, check: "required fields present, types valid, enums in range, qty >= 0/1 as declared", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 8, category: business_constraint, check: "requested/adopted format must be offered by the title (has_new/has_used/has_rental/has_digital)", error_id: ERR_FORMAT_NOT_OFFERED, http_status: 422, applies_to: ["POST /bookstore/adoptions", "POST /bookstore/orders"] }
  - { priority: 8, category: business_constraint, check: "no other adoption in {DRAFT, SUBMITTED, UNDER_REVIEW, RETURNED} for same (section_id, title_id)", error_id: ERR_DUPLICATE_ADOPTION, http_status: 409, applies_to: ["POST /bookstore/adoptions"] }
  - { priority: 8, category: business_constraint, check: "no existing enrollment for same (section_id, student_id)", error_id: ERR_ENROLLMENT_DUPLICATE, http_status: 409, applies_to: ["POST /bookstore/sections/{id}/enrollments"] }
  - { priority: 8, category: business_constraint, check: "ENROLLED enrollment count < section.enrollment_capacity", error_id: ERR_SECTION_CAPACITY_REACHED, http_status: 409, applies_to: ["POST /bookstore/sections/{id}/enrollments"] }
  - { priority: 8, category: business_constraint, check: "Title stock for the requested format >= line qty at placement", error_id: ERR_INSUFFICIENT_STOCK, http_status: 409, applies_to: ["POST /bookstore/orders"] }
  - { priority: 8, category: business_constraint, check: "no overlapping PublisherAgreement for same publisher on closed intervals: overlap iff new.start_date <= existing.end_date AND new.end_date >= existing.start_date (adjacency start == end IS an overlap)", error_id: ERR_AGREEMENT_OVERLAP, http_status: 409, applies_to: ["POST /bookstore/publishers/{id}/agreements"] }
  - { priority: 8, category: business_constraint, check: "no overlapping WholesaleQuote for same (title_id, condition) on half-open intervals: overlap iff new.effective_from < existing.effective_to AND new.effective_to > existing.effective_from (adjacency from == to is NOT an overlap)", error_id: ERR_QUOTE_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /bookstore/titles/{id}/wholesale-quotes"] }
  - { priority: 8, category: business_constraint, check: "no other CommissionStatement in {DRAFT, ISSUED} for same (publisher_id, term_id)", error_id: ERR_DUPLICATE_COMMISSION_STATEMENT, http_status: 409, applies_to: ["POST /bookstore/commission-statements"] }
  - { priority: 9, category: business_referential, check: "an active agreement covers the title's publisher at now", error_id: ERR_NO_ACTIVE_AGREEMENT, http_status: 422, applies_to: ["POST /bookstore/adoptions/{id}/approve", "POST /bookstore/buy-plans/{id}/commit", "POST /bookstore/orders"] }
  - { priority: 9, category: business_referential, check: "referenced adoption is APPROVED", error_id: ERR_ADOPTION_NOT_APPROVED, http_status: 422, applies_to: ["POST /bookstore/buy-plans/{id}/commit", "POST /bookstore/orders"] }
  - { priority: 9, category: business_referential, check: "wholesale variant requires an active quote for (title, condition)", error_id: ERR_WHOLESALE_QUOTE_MISSING, http_status: 422, applies_to: ["POST /bookstore/buyback-tickets"] }
  - { priority: 9, category: business_referential, check: "term.compliance_posture == CLEAR for commission issue", error_id: ERR_TERM_NOT_COMPLIANT, http_status: 422, applies_to: ["POST /bookstore/commission-statements/{id}/issue"] }
  - { priority: 10, category: business_fiscal, check: "committed+receiving landed cost for term + this plan <= term.buy_budget_cents", error_id: ERR_TERM_BUDGET_EXCEEDED, http_status: 422, applies_to: ["POST /bookstore/buy-plans/{id}/commit"] }
  - { priority: 10, category: business_fiscal, check: "aid_only order requires aid to cover the full total", error_id: ERR_INSUFFICIENT_AID, http_status: 402, applies_to: ["POST /bookstore/orders"] }
  - { priority: 5, category: state, check: "OCC: expected_<parent>_version equals current parent version (checked after existence and from-state, before business rules)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["PATCH /bookstore/adoptions/{id}", "POST /bookstore/adoptions", "POST /bookstore/buy-plans/{id}/commit", "POST /bookstore/buyback-tickets"] }

