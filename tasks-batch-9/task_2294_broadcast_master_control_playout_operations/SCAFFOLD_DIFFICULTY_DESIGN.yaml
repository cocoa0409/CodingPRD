      - name: open_ended_override_slot_blocks_a_later_non_overlapping_request_until_released
        grounds:
          - validations[priority=41]
          - errors[ERR_OVERRIDE_WINDOW_OVERLAP]
          - state_machines.EmergencyOverride.PENDING_to_ACTIVE_CRAWL
          - state_machines.EmergencyOverride.ACTIVE_CRAWL_to_RELEASED
          - entities.EmergencyOverride.fields.expected_duration_seconds
          - entities.EmergencyOverride.fields.released_utc
        distinguishing_aspect: |
          Resource == the Channel's single emergency-override slot, and its
          occupancy interval is OPEN-ENDED: an override in ACTIVE_CRAWL or ACTIVE_CUTIN has a start instant
          but no end instant at all, because expected_duration_seconds is advisory
          and only released_utc closes the interval. A second request whose
          requested_start_utc (13:00:00Z) lies 1500 s AFTER the incumbent's
          start-plus-expected-duration (12:05:00Z + 1800 s == 12:35:00Z) must still
          be refused while the incumbent is un-released, and the identical request
          must be accepted the moment the incumbent reaches RELEASED — so
          occupancy is decided by lifecycle state, not by any arithmetic on the two
          declared time ranges.
