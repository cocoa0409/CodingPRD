          setup_api_calls:
            - call: "POST /hoa/associations"
              payload: { name: "Dunmore Village", total_planned_lots: 40, turnover_threshold_pct: 50.00, fixed_turnover_date: "2028-01-01T00:00:00Z", statute_of_repose_years: 8, reserve_pool_cents: 800000, reserve_claim_pool_cents: 3000000, declarant_monthly_subsidy_cents: 90000 }
