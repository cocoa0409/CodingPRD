  # ===========================================================================
  # 8 — cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_route_version_on_construction_method_returns_stale_route_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.segment-method-stale-route
          - errors.ERR_STALE_ROUTE_VERSION
          - endpoints[POST /segments/{id}/construction-method]
        distinguishing_aspect: "A budget adjustment between the read and the write advances Route.version, so the method selection carrying the pre-adjustment number is refused with 412 and the retry with the observed number succeeds."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Harbor Loop' in PLANNING with one walked RouteSegment (400 feet, URBAN_PAVED)"
            - "the client reads Route.version, then an admin budget adjustment of +500000 advances it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
              as: RouteEngineer
              captures: { route_id: $.data.id }
            - call: "POST /segments"
              payload: { route_id: "${route_id}", sequence_index: 1, street_name: "Dock Street", municipality_code: "MUN-014", length_feet: 400, terrain_class: "URBAN_PAVED", planned_work_start_on: "2026-09-15", planned_work_end_on: "2026-09-20" }
              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false }
              as: FieldSurveyor
              captures: { wo_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "B", available_vertical_clearance_in: 45, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "GET /routes/${route_id}"
              payload: {}
              as: RouteEngineer
              captures: { rv_stale: $.data.version }
            - call: "POST /routes/${route_id}/budget-adjustments"
              payload: { delta_cents: 500000, reason: "supplemental authorization" }
              as: NetworkRecordsAdmin
              captures: { rv_fresh: $.data.version }
          trigger:
            - call: "POST /segments/${seg_id}/construction-method"
              payload: { method: "AERIAL", expected_route_version: "${rv_stale}" }
              as: RouteEngineer
              captures: { err: $.data.error_id }
            - call: "POST /segments/${seg_id}/construction-method"
              payload: { method: "AERIAL", expected_route_version: "${rv_fresh}" }
              as: RouteEngineer
              captures: { cost: $.data.preliminary_cost_cents }
          assert:
            - "${rv_fresh} is ${rv_stale} plus 1"
            - "${err} == ERR_STALE_ROUTE_VERSION with HTTP 412"
            - "after the first trigger RouteSegment.${seg_id}.engineering_status == WALKED, construction_method == null and Route.${route_id}.version == ${rv_fresh}"
            - "the second trigger returns HTTP 200 with ${cost} == 630870 and Route.${route_id}.version == ${rv_fresh} plus 1"
            - "Route.${route_id}.total_preliminary_cost_cents == 630870 only after the accepted write"

      - name: stale_expected_route_version_on_design_create_returns_stale_route_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.design-package-create-stale-route
          - errors.ERR_STALE_ROUTE_VERSION
          - endpoints[POST /design-packages]
        distinguishing_aspect: "The second OCC rule guards a different endpoint on the same parent: a design create built from a pre-adjustment view of the route is refused, and the retry then mints revision 1 rather than revision 2, proving nothing was created by the refused call."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Harbor Loop' SCOPE_LOCKED with one walked RouteSegment (400 feet, URBAN_PAVED)"
            - "the client reads Route.version, then an admin budget adjustment of +500000 advances it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
              payload: { name: "Harbor Loop", topology_objective: "RING_CLOSURE", target_in_service_date: "2027-03-01", budget_authorized_cents: 250000000 }
