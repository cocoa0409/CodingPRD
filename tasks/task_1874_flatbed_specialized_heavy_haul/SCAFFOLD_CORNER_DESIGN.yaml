      - name: second_invoice_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INVOICE_EXISTS]", state_machines.Invoice]
        distinguishing_aspect: "A load may have at most one non-VOID invoice: creating a second while the first is ISSUED fails with ERR_INVOICE_EXISTS; after voiding, creation succeeds again (recovery path preserved)."
        test_recipe:
