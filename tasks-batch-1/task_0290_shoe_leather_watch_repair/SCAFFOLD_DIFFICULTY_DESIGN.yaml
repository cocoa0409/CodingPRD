# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Shoe / Leather & Watch Repair — Expert
# 9 rules x 2 instances = 18 instances.
# Canonical bootstrap pattern (reused): set clock -> create customer ->
# create service-types -> create technician(s) -> intake ticket -> add item ->
# add service-line(s) -> create estimate -> present (OCC) -> approve.
# Ticket.version is captured from a GET right before any OCC call.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_total_provisional_vs_final_diverge
        grounds:
          - calculations.estimate_total
          - entities.Estimate.fields.estimate_total_cents
          - entities.RepairTicket.fields.final_charge_cents
          - state_machines.RepairTicket.IN_REPAIR_to_READY_FOR_PICKUP
        distinguishing_aspect: |
          PROVISIONAL (Estimate.estimate_total_cents, quote domain) sums QUOTED lines =
          6500+? ; FINAL (RepairTicket.final_charge_cents, billing domain) sums only
          COMPLETED lines after one line is VOIDED, so the two land on different entities
          with different totals (9200 vs 7200) from the same underlying ticket.
        test_recipe:
          setup:
            - "Customer, two ServiceTypes (base 4000 SHOE, 2500 LEATHER), one technician."
            - "Ticket with two QUOTED lines (4000, 2500) and one RECEIVED part (supplier 1000 x2 RETAIL = 2700)."
            - "Estimate presented (PROVISIONAL total = 6500 labor + 2700 parts = 9200), approved, parts received, start-repair."
            - "During IN_REPAIR: line A completed at adjusted 4500, line B VOIDED; then mark-ready (FINAL = 4500 + 2700 = 7200)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { full_name: "Ada Lovelace", email: "ada@x.com", phone: "555-0001" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "SHOE_SOLE", name: "Sole Replacement", item_category: "SHOE", base_price_cents: 4000, standard_turnaround_days: 3, warranty_days: 90 }
              as: ShopManager
              captures: { st_shoe: $.data.id }
            - call: "POST /service-types"
              payload: { code: "LEATHER_DYE", name: "Leather Recolor", item_category: "LEATHER", base_price_cents: 2500, standard_turnaround_days: 2, warranty_days: 30 }
              as: ShopManager
              captures: { st_leather: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Tess Tech", skills: ["SHOE", "LEATHER"] }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", priority: "STANDARD", assigned_technician_id: "${tech_id}" }
              as: FrontDeskClerk
              captures: { tkt_id: $.data.id, tkt_v0: $.data.version }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "SHOE", description: "brown Oxford", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_shoe: $.data.id }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "LEATHER", description: "satchel", condition_grade: "FAIR" }
              as: FrontDeskClerk
              captures: { item_leather: $.data.id }
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_shoe}", service_type_id: "${st_shoe}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { line_a: $.data.id }
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_leather}", service_type_id: "${st_leather}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { line_b: $.data.id }
            - call: "POST /parts-orders"
              payload: { ticket_id: "${tkt_id}", service_line_id: "${line_a}", part_name: "half-sole", supplier_cost_cents: 1000, quantity: 2, lead_time_days: 1 }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { part_id: $.data.id }
            - call: "POST /estimates"
              payload: { ticket_id: "${tkt_id}", authored_by_technician_id: "${tech_id}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/present"
              payload: { expected_ticket_version: "${tkt_v0}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { est_total_prov: $.data.estimate_total_cents }
            - call: "POST /estimates/${est_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /parts-orders/${part_id}/order"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_id}"
            - call: "POST /parts-orders/${part_id}/receive"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_id}"
            - call: "POST /repair-tickets/${tkt_id}/start-repair"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_id}"
            - call: "PATCH /service-lines/${line_a}"
              payload: { adjusted_price_cents: 4500, status: "COMPLETED" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
            - call: "PATCH /service-lines/${line_b}"
              payload: { status: "VOIDED" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /repair-tickets/${tkt_id}/mark-ready"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { final_charge: $.data.final_charge_cents }
          assert:
            - "Estimate.${est_id}.estimate_total_cents == 9200"
            - "RepairTicket.${tkt_id}.final_charge_cents == 7200"
            - "RepairTicket.${tkt_id}.final_charge_cents != Estimate.${est_id}.estimate_total_cents"

      - name: parts_markup_retail_vs_warranty_redo_diverge
        grounds:
          - calculations.parts_markup
          - entities.PartsOrder.fields.marked_up_cost_cents
          - entities.WarrantyClaim.fields.redo_ticket_id
          - state_machines.WarrantyClaim.FILED_to_APPROVED
        distinguishing_aspect: |
          Identical supplier_cost_cents=1000, quantity=2 yields marked_up_cost_cents 2700
          (RETAIL, on a normal ticket) versus 2000 (WARRANTY_REDO, on a redo ticket
          referenced by a WarrantyClaim.redo_ticket_id) — a parts-pricing-domain dual
          variant distinct from the billing-domain estimate_total dual variant.
        test_recipe:
          setup:
            - "A normal ticket carrying a RETAIL part (1000 x2 = 2700)."
            - "A warranty-redo ticket (spawned by an approved WarrantyClaim) carrying an identical part priced WARRANTY_REDO (1000 x2 = 2000)."
            - "Original ticket fully picked up within warranty so the claim can be filed and approved."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { full_name: "Grace Hopper", email: "grace@x.com", phone: "555-0002" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "WATCH_BATT", name: "Watch Battery", item_category: "WATCH", base_price_cents: 1500, standard_turnaround_days: 1, warranty_days: 90 }
              as: ShopManager
              captures: { st_watch: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Tom Author", skills: ["WATCH"] }
              as: ShopManager
              captures: { tech_author: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Rita Ruler", skills: ["WATCH"] }
              as: ShopManager
              captures: { tech_ruler: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", priority: "STANDARD", assigned_technician_id: "${tech_author}" }
              as: FrontDeskClerk
              captures: { tkt_id: $.data.id, tkt_v0: $.data.version }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "WATCH", description: "wristwatch", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_w: $.data.id }
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_w}", service_type_id: "${st_watch}" }
              as: RepairTechnician
              as_user_id: "${tech_author}"
              captures: { line_w: $.data.id }
            - call: "POST /parts-orders"
              payload: { ticket_id: "${tkt_id}", service_line_id: "${line_w}", part_name: "crystal", supplier_cost_cents: 1000, quantity: 2, lead_time_days: 0 }
              as: RepairTechnician
              as_user_id: "${tech_author}"
              captures: { part_retail: $.data.id, retail_cost: $.data.marked_up_cost_cents }
            - call: "POST /estimates"
              payload: { ticket_id: "${tkt_id}", authored_by_technician_id: "${tech_author}" }
              as: RepairTechnician
              as_user_id: "${tech_author}"
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/present"
              payload: { expected_ticket_version: "${tkt_v0}" }
              as: RepairTechnician
              as_user_id: "${tech_author}"
            - call: "POST /estimates/${est_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /parts-orders/${part_retail}/order"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_author}"
            - call: "POST /parts-orders/${part_retail}/receive"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_author}"
            - call: "POST /repair-tickets/${tkt_id}/start-repair"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_author}"
            - call: "PATCH /service-lines/${line_w}"
              payload: { status: "COMPLETED" }
              as: RepairTechnician
              as_user_id: "${tech_author}"
            - call: "POST /repair-tickets/${tkt_id}/mark-ready"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_author}"
              captures: { final_charge: $.data.final_charge_cents }
            - call: "GET /repair-tickets/${tkt_id}"
              payload: {}
              as: FrontDeskClerk
              captures: { tkt_v_ready: $.data.version }
            - call: "POST /payments"
              payload: { ticket_id: "${tkt_id}", amount_cents: 4500, method: "CARD", expected_ticket_version: "${tkt_v_ready}" }
              as: FrontDeskClerk
            - call: "POST /repair-tickets/${tkt_id}/pickup"
              payload: {}
              as: FrontDeskClerk
            - call: "POST /warranty-claims"
              payload: { ticket_id: "${tkt_id}", service_line_id: "${line_w}", reported_by_customer_id: "${cust_id}", defect_description: "crystal cracked" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /warranty-claims/${claim_id}/approve"
              payload: { ruled_by_technician_id: "${tech_ruler}" }
              as: ShopManager
              captures: { redo_tkt: $.data.redo_ticket_id }
            - call: "GET /service-lines?ticket_id=${redo_tkt}"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_ruler}"
              captures: { redo_line: "$.data[0].id" }
          trigger:
            - call: "POST /parts-orders"
              payload: { ticket_id: "${redo_tkt}", service_line_id: "${redo_line}", part_name: "crystal", supplier_cost_cents: 1000, quantity: 2, lead_time_days: 0 }
              as: RepairTechnician
              as_user_id: "${tech_ruler}"
              captures: { part_redo: $.data.id, redo_cost: $.data.marked_up_cost_cents }
          assert:
            - "PartsOrder.${part_retail}.marked_up_cost_cents == 2700"
            - "PartsOrder.${part_redo}.marked_up_cost_cents == 2000"
            - "PartsOrder.${part_redo}.marked_up_cost_cents != PartsOrder.${part_retail}.marked_up_cost_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: estimate_total_rush_tiered_nonlinear
        grounds:
          - calculations.estimate_total
          - calculations.rush_surcharge
          - entities.Estimate.fields.rush_surcharge_cents
          - entities.Estimate.fields.estimate_total_cents
        distinguishing_aspect: |
          Mode (a)+(c): estimate_total has >=3 inputs (labor 6500, parts 2700, priority RUSH)
          with a non-linear, evaluation-order-pinned rush surcharge tiered on the running
          pre_rush total (5000@0.30 + 4200@0.20 = 2340); total = 9200 + 2340 = 11540.
        test_recipe:
          setup:
            - "RUSH ticket, two QUOTED lines (4000, 2500), one part marked-up 2700 -> pre_rush 9200."
            - "rush_surcharge = 5000*0.30 + 4200*0.20 = 1500 + 840 = 2340; estimate_total = 11540."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { full_name: "Rush Customer", email: "rush@x.com", phone: "555-0003" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "SHOE_SOLE", name: "Sole Replacement", item_category: "SHOE", base_price_cents: 4000, standard_turnaround_days: 3, rush_eligible: true, warranty_days: 90 }
              as: ShopManager
              captures: { st_shoe: $.data.id }
            - call: "POST /service-types"
              payload: { code: "LEATHER_DYE", name: "Leather Recolor", item_category: "LEATHER", base_price_cents: 2500, standard_turnaround_days: 2, rush_eligible: true, warranty_days: 30 }
              as: ShopManager
              captures: { st_leather: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Tess Tech", skills: ["SHOE", "LEATHER"] }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", priority: "RUSH", assigned_technician_id: "${tech_id}" }
              as: FrontDeskClerk
              captures: { tkt_id: $.data.id, tkt_v0: $.data.version }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "SHOE", description: "boot", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_shoe: $.data.id }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "LEATHER", description: "belt", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_leather: $.data.id }
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_shoe}", service_type_id: "${st_shoe}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { line_a: $.data.id }
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_leather}", service_type_id: "${st_leather}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { line_b: $.data.id }
            - call: "POST /parts-orders"
              payload: { ticket_id: "${tkt_id}", service_line_id: "${line_a}", part_name: "half-sole", supplier_cost_cents: 1000, quantity: 2, lead_time_days: 1 }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { part_id: $.data.id }
            - call: "POST /estimates"
              payload: { ticket_id: "${tkt_id}", authored_by_technician_id: "${tech_id}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /estimates/${est_id}/present"
              payload: { expected_ticket_version: "${tkt_v0}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { rush_sur: $.data.rush_surcharge_cents, est_total: $.data.estimate_total_cents }
          assert:
            - "Estimate.${est_id}.rush_surcharge_cents == 2340"
            - "Estimate.${est_id}.estimate_total_cents == 11540"
            - "Estimate.${est_id}.parts_subtotal_cents == 2700"

      - name: parts_markup_rounding_order_pinned
        grounds:
          - calculations.parts_markup
          - entities.PartsOrder.fields.marked_up_cost_cents
        distinguishing_aspect: |
          Mode (b): supplier_cost_cents=333, quantity=3 must round the full product once
          -> round_half_up(333*3*1.35)=round(1348.65)=1349, NOT per-unit-first
          (round(333*1.35)*3 = 450*3 = 1350). A different rounding order than instance 1.
        test_recipe:
          setup:
            - "A ticket with a single ServiceLine and one part supplier_cost_cents=333, quantity=3."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { full_name: "Round Customer", email: "round@x.com", phone: "555-0004" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "SHOE_SOLE", name: "Sole Replacement", item_category: "SHOE", base_price_cents: 4000, standard_turnaround_days: 3, warranty_days: 90 }
              as: ShopManager
              captures: { st_shoe: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Tess Tech", skills: ["SHOE"] }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", assigned_technician_id: "${tech_id}" }
              as: FrontDeskClerk
              captures: { tkt_id: $.data.id }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "SHOE", description: "loafer", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_shoe: $.data.id }
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_shoe}", service_type_id: "${st_shoe}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { line_a: $.data.id }
          trigger:
            - call: "POST /parts-orders"
              payload: { ticket_id: "${tkt_id}", service_line_id: "${line_a}", part_name: "eyelet set", supplier_cost_cents: 333, quantity: 3, lead_time_days: 2 }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { part_id: $.data.id, marked: $.data.marked_up_cost_cents }
          assert:
            - "PartsOrder.${part_id}.marked_up_cost_cents == 1349"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: repair_ticket_estimate_revision_cycle
        grounds:
          - state_machines.RepairTicket.AWAITING_APPROVAL_to_REVISION_REQUESTED
          - state_machines.RepairTicket.REVISION_REQUESTED_to_AWAITING_APPROVAL
          - entities.RepairTicket.fields.repair_status
          - entities.Estimate.fields.revision_number
        distinguishing_aspect: |
          RepairTicket is cyclic: AWAITING_APPROVAL -> REVISION_REQUESTED (reject) ->
          AWAITING_APPROVAL (present revision), and the second presented estimate carries
          revision_number == 2 while the rejected first is SUPERSEDED. This is a cycle on
          RepairTicket, a different entity from the WarrantyClaim branch in instance 2.
        test_recipe:
          setup:
            - "Ticket with one QUOTED line; first estimate presented then rejected (ticket REVISION_REQUESTED)."
            - "A revision estimate (supersedes the rejected one) presented -> ticket AWAITING_APPROVAL again, revision_number=2."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { full_name: "Cy Cle", email: "cycle@x.com", phone: "555-0005" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "SHOE_SOLE", name: "Sole Replacement", item_category: "SHOE", base_price_cents: 4000, standard_turnaround_days: 3, warranty_days: 90 }
              as: ShopManager
              captures: { st_shoe: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Tess Tech", skills: ["SHOE"] }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", assigned_technician_id: "${tech_id}" }
              as: FrontDeskClerk
              captures: { tkt_id: $.data.id, tkt_v0: $.data.version }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "SHOE", description: "pump", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_shoe: $.data.id }
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_shoe}", service_type_id: "${st_shoe}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { line_a: $.data.id }
            - call: "POST /estimates"
              payload: { ticket_id: "${tkt_id}", authored_by_technician_id: "${tech_id}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { est1: $.data.id }
            - call: "POST /estimates/${est1}/present"
              payload: { expected_ticket_version: "${tkt_v0}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
            - call: "POST /estimates/${est1}/reject"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /repair-tickets/${tkt_id}"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { tkt_v1: $.data.version }
            - call: "POST /estimates"
              payload: { ticket_id: "${tkt_id}", authored_by_technician_id: "${tech_id}", supersedes_estimate_id: "${est1}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { est2: $.data.id }
          trigger:
            - call: "POST /estimates/${est2}/present"
              payload: { expected_ticket_version: "${tkt_v1}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { rev2: $.data.revision_number }
          assert:
            - "RepairTicket.${tkt_id}.repair_status == AWAITING_APPROVAL"
            - "Estimate.${est2}.revision_number == 2"
            - "Estimate.${est1}.status == SUPERSEDED"

      - name: warranty_claim_branch_approve_vs_deny
        grounds:
          - state_machines.WarrantyClaim.FILED_to_APPROVED
          - state_machines.WarrantyClaim.FILED_to_DENIED
          - entities.WarrantyClaim.fields.status
          - entities.WarrantyClaim.fields.redo_ticket_id
        distinguishing_aspect: |
          WarrantyClaim branches FILED -> {APPROVED, DENIED} with divergent side-effect
          sets: APPROVED spawns a redo ticket (redo_ticket_id set non-null); DENIED leaves
          redo_ticket_id null. A branching machine on WarrantyClaim, a different entity from
          the RepairTicket cycle in instance 1.
        test_recipe:
          setup:
