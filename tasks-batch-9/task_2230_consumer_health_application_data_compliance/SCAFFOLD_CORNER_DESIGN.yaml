              as: PrivacyOfficer
              captures: { asmt_id: $.data.id }
            - call: "POST /health-data/applicability-assessments/${asmt_id}/submit"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /health-data/applicability-assessments/${asmt_id}/approve"
              payload: {}
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /health-data/security-risk-assessments"
              payload: { app_product_id: "${prod_id}", assessment_label: "Annual review", admin_control_score: 60, technical_control_score: 60, physical_control_score: 60, vendor_oversight_score: 60, documented_gap_count: 0, remediation_plan_present: false }
              as: SecurityEngineer
              captures: { sra_id: $.data.id }
          trigger:
            - call: "POST /health-data/security-risk-assessments/${sra_id}/finalize"
              payload: {}
              as: SecurityEngineer
          assert:
            - "error_id == ERR_REMEDIATION_PLAN_REQUIRED"
            - "http_status == 409"
            - "SecurityRiskAssessment.${sra_id}.residual_risk_score == 40.00"
            - "SecurityRiskAssessment.${sra_id}.risk_tier == HIGH"
            - "SecurityRiskAssessment.${sra_id}.state == DRAFT"
            - "SecurityRiskAssessment.${sra_id}.finalized_at == null"
            - "AppProduct.${prod_id}.security_program_state == NONE"

  - section: rbac
    instances:
      - name: role_permissions_privacy_officer_drafts_and_submits_an_assessment
        claim_type: role_permissions
        grounds: ["roles.PrivacyOfficer.exclusive_operations", "state_machines.ApplicabilityAssessment.DRAFT_to_SUBMITTED"]
        distinguishing_aspect: "PrivacyOfficer holds both create and submit on ApplicabilityAssessment, so the same role completes DRAFT -> SUBMITTED without any hand-off, and no segregation rule fires because approve is the segregated step."
        test_recipe:
          setup: ["one AppProduct with one ACTIVE DIAGNOSIS element"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "apnea_dx", display_name: "Sleep apnea diagnosis", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
            - call: "POST /health-data/applicability-assessments"
              payload: { app_product_id: "${prod_id}", entity_status_claim: "NOT_COVERED", analyst_note: "Consumer wellness app" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "POST /health-data/applicability-assessments/${asmt_id}/submit"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "po-1"
          assert:
            - "http_status == 200"
            - "ApplicabilityAssessment.${asmt_id}.state == SUBMITTED"
            - "ApplicabilityAssessment.${asmt_id}.submitted_by_user_id == po-1"
            - "AppProduct.${prod_id}.applicability_status == UNDETERMINED"

      - name: data_steward_cannot_create_an_applicability_assessment
        claim_type: role_denials
        grounds: ["roles.PrivacyOfficer.exclusive_operations", "errors[ERR_UNAUTHORIZED]", "validations[priority=2]"]
        distinguishing_aspect: "Creating an ApplicabilityAssessment is exclusive to PrivacyOfficer, so a DataSteward is refused with ERR_UNAUTHORIZED even though the body is perfectly well formed and every FK resolves."
        test_recipe:
          setup: ["one AppProduct with no assessments"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /health-data/applicability-assessments"
              payload: { app_product_id: "${prod_id}", entity_status_claim: "NOT_COVERED", analyst_note: "Consumer wellness app" }
              as: DataSteward
              as_user_id: "ds-1"
          assert:
            - "error_id == ERR_UNAUTHORIZED"
            - "http_status == 403"
            - "GET /health-data/applicability-assessments?app_product_id=${prod_id} returns total_count == 0"

      - name: compliance_approver_cannot_submit_the_assessment_it_would_approve
        claim_type: role_denials
        grounds: ["roles.PrivacyOfficer.exclusive_operations", "roles.ComplianceApprover.exclusive_operations", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "ComplianceApprover owns approve but not submit, so it cannot walk the assessment forward one step earlier; the refusal is ERR_UNAUTHORIZED at priority 2, not the segregation-of-duties error at priority 10."
        test_recipe:
          setup: ["one AppProduct with one DRAFT ApplicabilityAssessment authored by po-1"]
          setup_api_calls:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/applicability-assessments"
              payload: { app_product_id: "${prod_id}", entity_status_claim: "NOT_COVERED", analyst_note: "Consumer wellness app" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "POST /health-data/applicability-assessments/${asmt_id}/submit"
              payload: {}
              as: ComplianceApprover
              as_user_id: "ca-1"
          assert:
            - "error_id == ERR_UNAUTHORIZED"
            - "http_status == 403"
            - "ApplicabilityAssessment.${asmt_id}.state == DRAFT"
            - "ApplicabilityAssessment.${asmt_id}.submitted_by_user_id == null"

      - name: consumer_cannot_read_another_consumers_request
        claim_type: role_denials
        grounds: ["roles.Consumer.shared_operations", "errors[ERR_CONSUMER_SCOPE_VIOLATION]", "validations[priority=7]"]
        distinguishing_aspect: "The consumer-scoped read is allowed for the Consumer role in general, so the second consumer's request resolves and then fails the scope check with ERR_CONSUMER_SCOPE_VIOLATION rather than ERR_UNAUTHORIZED or a 404."
        test_recipe:
          setup: ["logical clock at 2026-08-10T00:00:00Z", "two ADULT Consumers on one AppProduct, the second holding an ACCESS request"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/consumers"
              payload: { app_product_id: "${prod_id}", external_ref: "acct-1", residency_state_code: "WA", age_band: "ADULT" }
              as: PlatformAdmin
              captures: { cons_a_id: $.data.id }
            - call: "POST /health-data/consumers"
              payload: { app_product_id: "${prod_id}", external_ref: "acct-2", residency_state_code: "WA", age_band: "ADULT" }
              as: PlatformAdmin
              captures: { cons_b_id: $.data.id }
            - call: "POST /health-data/consumer-requests"
              payload: { consumer_id: "${cons_b_id}", request_kind: "ACCESS", submitted_channel: "WEB_FORM" }
              as: Consumer
              as_user_id: "${cons_b_id}"
              captures: { req_b_id: $.data.id }
          trigger:
            - call: "GET /health-data/consumer-requests/${req_b_id}"
              payload: {}
              as: Consumer
              as_user_id: "${cons_a_id}"
          assert:
            - "error_id == ERR_CONSUMER_SCOPE_VIOLATION"
            - "http_status == 403"
            - "ConsumerRequest.${req_b_id}.consumer_id == ${cons_b_id}"

      - name: request_without_the_user_id_header_is_unauthorized
        claim_type: role_denials
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "Authentication requires both X-User-Role and X-User-ID, so a request carrying a valid role header but no X-User-ID is refused with ERR_UNAUTHENTICATED at priority 1, ahead of every role and shape check."
        test_recipe:
          setup: ["no preexisting rows"]
          setup_api_calls: []
          trigger:
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              note: "the request carries X-User-Role: PlatformAdmin and deliberately omits the X-User-ID header"
          assert:
            - "error_id == ERR_UNAUTHENTICATED"
            - "http_status == 401"
            - "GET /health-data/app-products returns total_count == 0"

      - name: segregation_of_duties_publisher_cannot_be_the_policy_author
        claim_type: role_denials
        excluded_because:
          difficulty_instance: business_constraint_segregation_of_duties_beats_business_fiscal_threshold_on_publish
          rationale: "That difficulty instance already publishes with the authoring user's own identity and asserts ERR_SEGREGATION_OF_DUTIES ahead of the completeness threshold, which covers the corner claim that authored_by_user_id and the publishing X-User-ID must differ."

  - section: cross_cutting_complexity_layers
    instances:
      - name: optimistic_concurrency_stale_product_version_on_policy_create_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[policy-version-create-stale-product]", "errors[ERR_STALE_PRODUCT_VERSION]", "validations[priority=9]"]
        distinguishing_aspect: "Approving the assessment increments AppProduct.version, so the version captured before approval is stale by exactly one and the drafted policy is refused with 412 while the assessment stays APPROVED."
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T00:00:00Z"
            - "one AppProduct whose version was captured at creation time"
            - "one APPROVED ApplicabilityAssessment created after that capture, which has since bumped the product version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id, stale_pv: $.data.version }
            - call: "POST /health-data/data-elements"
              payload: { app_product_id: "${prod_id}", element_key: "apnea_dx", display_name: "Sleep apnea diagnosis", source_kind: "USER_PROVIDED", health_signal_kind: "DIAGNOSIS" }
              as: DataSteward
            - call: "POST /health-data/applicability-assessments"
              payload: { app_product_id: "${prod_id}", entity_status_claim: "NOT_COVERED", analyst_note: "Consumer wellness app" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asmt_id: $.data.id }
            - call: "POST /health-data/applicability-assessments/${asmt_id}/submit"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /health-data/applicability-assessments/${asmt_id}/approve"
              payload: {}
              as: ComplianceApprover
              as_user_id: "ca-1"
          trigger:
            - call: "POST /health-data/privacy-policy-versions"
              payload: { app_product_id: "${prod_id}", applicability_assessment_id: "${asmt_id}", version_label: "v1", specificity_mode: "ELEMENT_LEVEL", disclosed_category_count: 1, disclosed_purpose_count: 0, disclosed_third_party_count: 0, named_third_party_count: 0, effective_from: "2026-09-01", expected_app_product_version: "${stale_pv}" }
              as: PrivacyOfficer
              as_user_id: "po-1"
          assert:
            - "error_id == ERR_STALE_PRODUCT_VERSION"
            - "http_status == 412"
            - "ApplicabilityAssessment.${asmt_id}.state == APPROVED"
            - "AppProduct.${prod_id}.applicability_status == CHD_REGULATED"
            - "GET /health-data/privacy-policy-versions?app_product_id=${prod_id} returns total_count == 0"

      - name: optimistic_concurrency_stale_consumer_version_on_consent_record_create_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[consent-record-create-stale-consumer]", "errors[ERR_STALE_CONSUMER_VERSION]", "validations[priority=9]"]
        distinguishing_aspect: "The first consent record bumps Consumer.version, so replaying the version captured at registration is refused with 412 and the incumbent record stays ACTIVE rather than being superseded."
        test_recipe:
          setup: ["logical clock at 2026-08-20T00:00:00Z", "one ADULT Consumer whose registration version has already been consumed by a first ConsentRecord"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /health-data/app-products"
              payload: { product_name: "SleepSense", company_legal_name: "SleepSense Inc", primary_state_code: "WA", consumer_count: 40000, annual_revenue_cents: 900000000, hipaa_covered_transaction_ratio: 0.10 }
              as: PlatformAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /health-data/consumers"
              payload: { app_product_id: "${prod_id}", external_ref: "acct-1", residency_state_code: "WA", age_band: "ADULT" }
              as: PlatformAdmin
              captures: { cons_id: $.data.id, stale_cv: $.data.version }
            - call: "POST /health-data/consent-records"
              payload: { consumer_id: "${cons_id}", expected_consumer_version: "${stale_cv}" }
              as: PrivacyOfficer
              captures: { cr1_id: $.data.id }
          trigger:
            - call: "POST /health-data/consent-records"
              payload: { consumer_id: "${cons_id}", expected_consumer_version: "${stale_cv}" }
              as: PrivacyOfficer
          assert:
            - "error_id == ERR_STALE_CONSUMER_VERSION"
            - "http_status == 412"
            - "ConsentRecord.${cr1_id}.record_state == ACTIVE"
            - "GET /health-data/consent-records?consumer_id=${cons_id} returns total_count == 1"

      - name: cascading_side_effects_five_hop_vendor_termination_chain
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: vendor_termination_five_hop_cascade_pauses_geofence_campaign
          rationale: "That difficulty instance already walks the full five-hop chain from terminate-agreement through mapping suspension, policy supersession, policy_compliance_state LAPSED and campaign pause, asserting every hop's fields, which subsumes the end-to-end cascade claim for this layer."

      - name: dual_variant_calculation_policy_specificity_variant_delta
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: policy_completeness_element_versus_category_specificity_divergence
          rationale: "That difficulty instance holds the disclosure counts fixed and scores the same product under ELEMENT_LEVEL and CATEGORY_LEVEL, asserting both scores and the resulting publish outcomes, which is exactly this layer's both-variants-and-delta claim."

      - name: rate_threshold_triggers_media_notice_boundary
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: media_notice_threshold_at_exactly_five_hundred_state_residents
          rationale: "That difficulty instance pins affected_state_max_count at 499 and 500 across two incidents and asserts media_notice_required plus the notify outcome on each, covering the boundary claim for this layer."

