              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Buyer
              as_user_id: "${acct_id}"
          assert:
            - "Account.${acct_id}.outstanding_cents == 0"
            - "Account.${acct_id}.credit_available_cents == 100000"
