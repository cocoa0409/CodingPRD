  # ==========================================================================
  # Rule 6 — boundary_precision_check (pct_of_claim 90.0; ordered_qty == MOQ)
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: assay_pct_boundary_90_inclusive
        grounds:
          - calculations.pct_of_claim
          - state_machines.Batch."quality_status=PENDING_QC_to_quality_status=ASSAY_HOLD"
        distinguishing_aspect: |
          Boundary on metric pct_of_claim via POST /api/batches/{id}/assay-results:
          exactly 90.0 (assayed 405.0 vs claim 450) is INCLUSIVE-pass (no hold),
          while 89.8 (assayed 404.0) trips ASSAY_HOLD — one batch per side.
        test_recipe:
          setup:
            - "Two COMPLETED batches B1 and B2 of the same formula (label claim 450 mg/unit)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: QAManager
            - call: "POST /api/customers"
              payload: { brand_name: "Acme" }
