# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Catering Commissary & Event Staffing — Expert
# 9 Difficulty Rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: food_revenue_estimate_vs_actual_headcount
        grounds:
          - calculations.event_estimate
          - calculations.event_settlement
          - entities.EventOrder.fields.actual_food_revenue_cents
          - entities.Quote.fields.food_revenue_cents
          - state_machines.EventOrder.COMPLETED_to_ACTUALIZED
        distinguishing_aspect: "Same food-revenue formula keyed on two different headcounts on two different entities: Quote.food_revenue_cents uses EventOrder.guest_count (100 -> 100000) while EventOrder.actual_food_revenue_cents uses actual_guest_count (120 -> 120000)."
        test_recipe:
          setup:
            - "Ingredient LETTUCE (unit_cost 10, on_hand 100000); MenuItem SALAD (sell 1000) with one RecipeLine LETTUCE qty 5 -> portion_food_cost 50."
            - "EventOrder guest_count=100, sc=0.20, grat=0.15; one ACTIVE OrderLine SALAD ppg=1.0; quote generated (food_revenue 100000); order driven to COMPLETED."
          setup_api_calls:
            - call: "POST /ingredients"
              payload: { name: "Lettuce", unit: "GRAM", unit_cost_cents: 10, on_hand_qty: 100000 }
              as: Admin
              captures: { let_id: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /recipe-lines"
              payload: { menu_item_id: "${salad_id}", ingredient_id: "${let_id}", qty_per_portion: 5 }
              as: KitchenManager
            - call: "POST /stations"
              payload: { name: "Hot Line", concurrent_capacity: 2 }
              as: Admin
              captures: { stn_id: $.data.id }
            - call: "POST /staff-members"
              payload: { name: "Sam Server", staff_role: "SERVER", hourly_rate_cents: 2000 }
              as: Admin
              captures: { sm_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 100, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.20, gratuity_pct: 0.15 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 1.0 }
              as: SalesManager
            - call: "GET /event-orders/${oid}"
              payload: {}
              as: SalesManager
              captures: { ov: $.data.version }
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov}" }
              as: SalesManager
              captures: { q_id: $.data.id, q_food_rev: $.data.food_revenue_cents }
            - call: "POST /event-orders/${oid}/confirm"
              payload: {}
              as: SalesManager
            - call: "POST /production-runs"
              payload: { event_order_id: "${oid}", station_id: "${stn_id}", menu_item_id: "${salad_id}", portions: 120, scheduled_start: "2026-06-01T06:00:00Z", scheduled_end: "2026-06-01T08:00:00Z" }
              as: KitchenManager
              captures: { pr_id: $.data.id }
            - call: "POST /event-orders/${oid}/start-production"
              payload: {}
              as: KitchenManager
            - call: "POST /production-runs/${pr_id}/start"
              payload: {}
              as: KitchenManager
            - call: "POST /production-runs/${pr_id}/complete"
              payload: {}
              as: KitchenManager
            - call: "POST /event-orders/${oid}/pack"
              payload: {}
              as: KitchenManager
            - call: "POST /staff-assignments"
              payload: { event_order_id: "${oid}", staff_member_id: "${sm_id}", staff_role: "SERVER", shift_start: "2026-06-01T09:00:00Z", shift_end: "2026-06-01T15:00:00Z" }
              as: EventCaptain
              captures: { sa_id: $.data.id }
            - call: "POST /staff-assignments/${sa_id}/confirm"
              payload: {}
              as: EventCaptain
            - call: "POST /event-orders/${oid}/dispatch"
              payload: {}
              as: EventCaptain
            - call: "POST /event-orders/${oid}/complete"
              payload: {}
              as: EventCaptain
          trigger:
            - call: "POST /event-orders/${oid}/actualize"
              payload: { actual_guest_count: 120 }
              as: SalesManager
          assert:
            - "Quote.${q_id}.food_revenue_cents == 100000"
            - "EventOrder.${oid}.actual_food_revenue_cents == 120000"
            - "EventOrder.${oid}.actual_food_revenue_cents != Quote.${q_id}.food_revenue_cents"

      - name: staff_labor_scheduled_vs_actual_window
        grounds:
          - calculations.staff_labor
          - entities.StaffAssignment.fields.scheduled_labor_cents
          - entities.StaffAssignment.fields.actual_labor_cents
          - state_machines.StaffAssignment.CHECKED_IN_to_CHECKED_OUT
        distinguishing_aspect: "On the StaffAssignment domain (not the order/food domain), scheduled_labor_cents comes from the 6h shift window (12000) while actual_labor_cents comes from the 9h clocked window with overtime (19000)."
        test_recipe:
          setup:
            - "StaffMember rate 2000; EventOrder CONFIRMED; StaffAssignment shift 6h (scheduled_labor 12000), then clocked 9h actual."
          setup_api_calls:
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /staff-members"
              payload: { name: "Sam Server", staff_role: "SERVER", hourly_rate_cents: 2000 }
              as: Admin
              captures: { sm_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 50, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T20:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.20, gratuity_pct: 0.15 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 1.0 }
              as: SalesManager
            - call: "GET /event-orders/${oid}"
              payload: {}
              as: SalesManager
              captures: { ov: $.data.version }
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov}" }
              as: SalesManager
            - call: "POST /event-orders/${oid}/confirm"
              payload: {}
              as: SalesManager
            - call: "POST /staff-assignments"
              payload: { event_order_id: "${oid}", staff_member_id: "${sm_id}", staff_role: "SERVER", shift_start: "2026-06-01T10:00:00Z", shift_end: "2026-06-01T16:00:00Z" }
              as: EventCaptain
              captures: { sa_id: $.data.id, sched: $.data.scheduled_labor_cents }
            - call: "POST /staff-assignments/${sa_id}/confirm"
              payload: {}
              as: EventCaptain
            - call: "POST /staff-assignments/${sa_id}/check-in"
              payload: { actual_start: "2026-06-01T10:00:00Z" }
              as: EventCaptain
          trigger:
            - call: "POST /staff-assignments/${sa_id}/check-out"
              payload: { actual_end: "2026-06-01T19:00:00Z" }
              as: EventCaptain
              captures: { actual: $.data.actual_labor_cents }
          assert:
            - "StaffAssignment.${sa_id}.scheduled_labor_cents == 12000"
            - "StaffAssignment.${sa_id}.actual_labor_cents == 19000"

  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_conditional_bases_grand_total
        grounds:
          - calculations.event_settlement
          - entities.EventOrder.fields.actual_service_charge_cents
          - entities.EventOrder.fields.actual_gratuity_cents
          - entities.EventOrder.fields.actual_grand_total_cents
          - state_machines.EventOrder.COMPLETED_to_ACTUALIZED
        distinguishing_aspect: "Mode (a): >=3 inputs with conditional branches — service charge base is (food_revenue+labor) EXCLUDING rentals (12400, not 12800), gratuity base is food ONLY (7500, not on labor), yielding grand_total 83900."
        test_recipe:
          setup:
            - "SALAD (sell 1000, cost 50); order guest 50, actual 50, sc 0.20, grat 0.15; 1 line ppg 1.0; 1 SERVER 6h actual labor 12000; CHAFER qty 4 @500 = 2000 rental; driven to COMPLETED."
          setup_api_calls:
            - call: "POST /ingredients"
              payload: { name: "Lettuce", unit: "GRAM", unit_cost_cents: 10, on_hand_qty: 100000 }
              as: Admin
              captures: { let_id: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /recipe-lines"
              payload: { menu_item_id: "${salad_id}", ingredient_id: "${let_id}", qty_per_portion: 5 }
              as: KitchenManager
            - call: "POST /stations"
              payload: { name: "Hot Line", concurrent_capacity: 2 }
              as: Admin
              captures: { stn_id: $.data.id }
            - call: "POST /equipment-items"
              payload: { name: "Chafer", asset_type: "CHAFER", total_units: 20, rental_price_cents: 500 }
              as: Admin
              captures: { eq_id: $.data.id }
            - call: "POST /staff-members"
              payload: { name: "Sam Server", staff_role: "SERVER", hourly_rate_cents: 2000 }
              as: Admin
              captures: { sm_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 50, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T20:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.20, gratuity_pct: 0.15 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 1.0 }
              as: SalesManager
            - call: "GET /event-orders/${oid}"
              payload: {}
              as: SalesManager
              captures: { ov: $.data.version }
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov}" }
              as: SalesManager
            - call: "POST /event-orders/${oid}/confirm"
              payload: {}
              as: SalesManager
            - call: "POST /production-runs"
              payload: { event_order_id: "${oid}", station_id: "${stn_id}", menu_item_id: "${salad_id}", portions: 50, scheduled_start: "2026-06-01T06:00:00Z", scheduled_end: "2026-06-01T08:00:00Z" }
              as: KitchenManager
              captures: { pr_id: $.data.id }
            - call: "POST /rental-reservations"
              payload: { event_order_id: "${oid}", equipment_item_id: "${eq_id}", qty: 4, out_time: "2026-06-01T08:00:00Z", return_time: "2026-06-01T21:00:00Z" }
              as: EventCaptain
            - call: "POST /staff-assignments"
              payload: { event_order_id: "${oid}", staff_member_id: "${sm_id}", staff_role: "SERVER", shift_start: "2026-06-01T10:00:00Z", shift_end: "2026-06-01T16:00:00Z" }
              as: EventCaptain
              captures: { sa_id: $.data.id }
            - call: "POST /staff-assignments/${sa_id}/confirm"
              payload: {}
              as: EventCaptain
            - call: "POST /staff-assignments/${sa_id}/check-in"
              payload: { actual_start: "2026-06-01T10:00:00Z" }
              as: EventCaptain
            - call: "POST /staff-assignments/${sa_id}/check-out"
              payload: { actual_end: "2026-06-01T16:00:00Z" }
              as: EventCaptain
            - call: "POST /event-orders/${oid}/start-production"
              payload: {}
              as: KitchenManager
            - call: "POST /production-runs/${pr_id}/start"
              payload: {}
              as: KitchenManager
            - call: "POST /production-runs/${pr_id}/complete"
              payload: {}
              as: KitchenManager
            - call: "POST /event-orders/${oid}/pack"
              payload: {}
              as: KitchenManager
            - call: "POST /event-orders/${oid}/dispatch"
              payload: {}
              as: EventCaptain
            - call: "POST /event-orders/${oid}/complete"
              payload: {}
              as: EventCaptain
          trigger:
            - call: "POST /event-orders/${oid}/actualize"
              payload: { actual_guest_count: 50 }
              as: SalesManager
          assert:
            - "EventOrder.${oid}.actual_food_revenue_cents == 50000"
            - "EventOrder.${oid}.actual_labor_total_cents == 12000"
            - "EventOrder.${oid}.actual_rental_cents == 2000"
            - "EventOrder.${oid}.actual_service_charge_cents == 12400"
            - "EventOrder.${oid}.actual_gratuity_cents == 7500"
            - "EventOrder.${oid}.actual_grand_total_cents == 83900"

      - name: portion_food_cost_sum_then_round
        grounds:
          - calculations.portion_food_cost
          - entities.MenuItem.fields.portion_food_cost_cents
          - entities.RecipeLine.fields.qty_per_portion
        distinguishing_aspect: "Mode (b): rounding order pinned. Two lines each contribute exactly 12.5c; SUM-THEN-ROUND gives 25, whereas per-line-round-then-sum would give 26 — the scaffold pins 25."
        test_recipe:
          setup:
            - "Ingredient SAFFRON (unit_cost 1000), Ingredient CREAM (unit_cost 500); MenuItem RISOTTO with RecipeLines SAFFRON qty 0.0125 (12.5c) and CREAM qty 0.025 (12.5c)."
          setup_api_calls:
            - call: "POST /ingredients"
              payload: { name: "Saffron", unit: "GRAM", unit_cost_cents: 1000, on_hand_qty: 1000 }
              as: Admin
              captures: { saf_id: $.data.id }
            - call: "POST /ingredients"
              payload: { name: "Cream", unit: "ML", unit_cost_cents: 500, on_hand_qty: 1000 }
              as: Admin
              captures: { cream_id: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Risotto", category: "ENTREE", sell_price_cents_per_portion: 1800 }
              as: KitchenManager
              captures: { ris_id: $.data.id }
            - call: "POST /recipe-lines"
              payload: { menu_item_id: "${ris_id}", ingredient_id: "${saf_id}", qty_per_portion: 0.0125 }
              as: KitchenManager
          trigger:
            - call: "POST /recipe-lines"
              payload: { menu_item_id: "${ris_id}", ingredient_id: "${cream_id}", qty_per_portion: 0.025 }
              as: KitchenManager
          assert:
            - "MenuItem.${ris_id}.portion_food_cost_cents == 25"

  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: event_order_quote_revise_cycle
        grounds:
          - state_machines.EventOrder.DRAFT_to_QUOTED
          - state_machines.EventOrder.QUOTED_to_DRAFT
          - entities.Quote.fields.status
        distinguishing_aspect: "EventOrder is cyclic: DRAFT->QUOTED->DRAFT->QUOTED. After revise the order returns to DRAFT and the prior Quote flips to SUPERSEDED; a fresh quote re-enters QUOTED."
        test_recipe:
          setup:
            - "MenuItem SALAD; EventOrder DRAFT with one line."
          setup_api_calls:
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 20, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 1.0 }
              as: SalesManager
            - call: "GET /event-orders/${oid}"
              payload: {}
              as: SalesManager
              captures: { ov1: $.data.version }
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov1}" }
              as: SalesManager
              captures: { q1_id: $.data.id }
            - call: "POST /event-orders/${oid}/revise"
              payload: {}
              as: SalesManager
            - call: "GET /event-orders/${oid}"
              payload: {}
              as: SalesManager
              captures: { ov2: $.data.version }
          trigger:
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov2}" }
              as: SalesManager
              captures: { q2_id: $.data.id }
          assert:
            - "Quote.${q1_id}.status == SUPERSEDED"
            - "Quote.${q2_id}.status == ACTIVE"
            - "EventOrder.${oid}.status == QUOTED"

      - name: production_run_reschedule_cycle
        grounds:
          - state_machines.ProductionRun.SCHEDULED_to_IN_PROGRESS
          - state_machines.ProductionRun.IN_PROGRESS_to_SCHEDULED
          - entities.ProductionRun.fields.status
        distinguishing_aspect: "ProductionRun is cyclic on a different entity: SCHEDULED->IN_PROGRESS->SCHEDULED via reschedule (QA-fail loop) returns status to SCHEDULED."
        test_recipe:
          setup:
            - "SALAD w/ LETTUCE recipe; order CONFIRMED then IN_PRODUCTION; run started (IN_PROGRESS)."
          setup_api_calls:
            - call: "POST /ingredients"
              payload: { name: "Lettuce", unit: "GRAM", unit_cost_cents: 10, on_hand_qty: 100000 }
              as: Admin
              captures: { let_id: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /recipe-lines"
              payload: { menu_item_id: "${salad_id}", ingredient_id: "${let_id}", qty_per_portion: 5 }
              as: KitchenManager
            - call: "POST /stations"
              payload: { name: "Hot Line", concurrent_capacity: 2 }
              as: Admin
              captures: { stn_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 40, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 1.0 }
              as: SalesManager
            - call: "GET /event-orders/${oid}"
              payload: {}
              as: SalesManager
              captures: { ov: $.data.version }
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov}" }
              as: SalesManager
            - call: "POST /event-orders/${oid}/confirm"
              payload: {}
              as: SalesManager
            - call: "POST /production-runs"
              payload: { event_order_id: "${oid}", station_id: "${stn_id}", menu_item_id: "${salad_id}", portions: 40, scheduled_start: "2026-06-01T06:00:00Z", scheduled_end: "2026-06-01T08:00:00Z" }
              as: KitchenManager
              captures: { pr_id: $.data.id }
            - call: "POST /event-orders/${oid}/start-production"
              payload: {}
              as: KitchenManager
            - call: "POST /production-runs/${pr_id}/start"
              payload: {}
              as: KitchenManager
          trigger:
            - call: "POST /production-runs/${pr_id}/reschedule"
              payload: { scheduled_start: "2026-06-01T06:30:00Z", scheduled_end: "2026-06-01T08:30:00Z" }
              as: KitchenManager
          assert:
            - "ProductionRun.${pr_id}.status == SCHEDULED"

  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: order_cancel_run_cancel_ingredient_release
        grounds:
          - state_machines.EventOrder.CONFIRMED_to_CANCELLED
          - state_machines.ProductionRun.SCHEDULED_to_CANCELLED
          - calculations.ingredient_commitment
          - entities.Ingredient.fields.on_hand_qty
        distinguishing_aspect: "Depth-3 chain from EventOrder cancel: EventOrder(A)->CANCELLED sets ProductionRun(B)->CANCELLED, and that run cancel itself releases committed Ingredient(C) qty back to on_hand (100000). Each hop is caused by the previous."
        test_recipe:
          setup:
            - "LETTUCE on_hand 100000; SALAD recipe LETTUCE qty 5; order CONFIRMED; one SCHEDULED run portions 50 (committed 250 -> on_hand 99750)."
          setup_api_calls:
            - call: "POST /ingredients"
              payload: { name: "Lettuce", unit: "GRAM", unit_cost_cents: 10, on_hand_qty: 100000 }
              as: Admin
              captures: { let_id: $.data.id }
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /recipe-lines"
              payload: { menu_item_id: "${salad_id}", ingredient_id: "${let_id}", qty_per_portion: 5 }
              as: KitchenManager
            - call: "POST /stations"
              payload: { name: "Hot Line", concurrent_capacity: 2 }
              as: Admin
              captures: { stn_id: $.data.id }
            - call: "POST /event-orders"
              payload: { guest_count: 50, event_start: "2026-06-01T09:00:00Z", event_end: "2026-06-01T17:00:00Z", venue_address: "1 Palazzo", service_charge_pct: 0.10, gratuity_pct: 0.10 }
              as: SalesManager
              captures: { oid: $.data.id }
            - call: "POST /order-lines"
              payload: { event_order_id: "${oid}", menu_item_id: "${salad_id}", portions_per_guest: 1.0 }
              as: SalesManager
            - call: "GET /event-orders/${oid}"
              payload: {}
              as: SalesManager
              captures: { ov: $.data.version }
            - call: "POST /event-orders/${oid}/quotes"
              payload: { expected_event_order_version: "${ov}" }
              as: SalesManager
            - call: "POST /event-orders/${oid}/confirm"
              payload: {}
              as: SalesManager
            - call: "POST /production-runs"
              payload: { event_order_id: "${oid}", station_id: "${stn_id}", menu_item_id: "${salad_id}", portions: 50, scheduled_start: "2026-06-01T06:00:00Z", scheduled_end: "2026-06-01T08:00:00Z" }
              as: KitchenManager
              captures: { pr_id: $.data.id }
          trigger:
            - call: "POST /event-orders/${oid}/cancel"
              payload: { reason: "client cancelled" }
              as: SalesManager
          assert:
            - "EventOrder.${oid}.status == CANCELLED"
            - "ProductionRun.${pr_id}.status == CANCELLED"
            - "Ingredient.${let_id}.on_hand_qty == 100000"
            - "Ingredient.${let_id}.committed_qty == 0"

      - name: staff_checkout_labor_bubbles_to_order
        grounds:
          - state_machines.StaffAssignment.CHECKED_IN_to_CHECKED_OUT
          - calculations.staff_labor
          - entities.EventOrder.fields.actual_labor_total_cents
        distinguishing_aspect: "Depth-2 chain from a different trigger (staff check-out): StaffAssignment(A) check-out computes actual_labor_cents (19000) which bubbles into EventOrder(B).actual_labor_total_cents (19000)."
        test_recipe:
          setup:
            - "StaffMember rate 2000; order CONFIRMED; assignment CHECKED_IN with actual_start 10:00."
          setup_api_calls:
            - call: "POST /menu-items"
              payload: { name: "Salad", category: "SIDE", sell_price_cents_per_portion: 1000 }
              as: KitchenManager
              captures: { salad_id: $.data.id }
            - call: "POST /staff-members"
              payload: { name: "Sam Server", staff_role: "SERVER", hourly_rate_cents: 2000 }
              as: Admin
              captures: { sm_id: $.data.id }
            - call: "POST /event-orders"
