      - name: partnership_pledge_reused_across_disjoint_windows_but_capped_within_overlap
        grounds:
          - calculations.partnership_pledge_window_load
          - validations.priority_21.ERR_PARTNERSHIP_PLEDGE_WINDOW_EXCEEDED
          - validations.priority_17.ERR_COMMITMENT_OUTSIDE_TERM
        distinguishing_aspect: |
          The pledge is an AGGREGATE-CAPACITY resource over half-open day
          ranges rather than an exclusive one: two 1500000-cent commitments
          each consume the whole 2000000-cent pledge but are accepted because
          their windows are adjacent and therefore disjoint, while a small
          600000-cent commitment straddling both is rejected because its peak
          instantaneous load reaches 3600000. A fourth, later window is then
          accepted again — the pledge is not consumed cumulatively, only
          per-instant.
        test_recipe:
          setup:
            - "AssessmentCycle in STRATEGY_DEVELOPMENT with posture OPEN and one DRAFT ImplementationStrategy with authorized_budget_cents 9000000, deliberately large so the priority-22 budget rule cannot fire"
            - "one PARTNER ResponsibleParty with fte_capacity_bp 10000"
            - "one EXECUTED PartnershipAgreement with pledged_cents 2000000 and term 2026-09-01 .. 2027-08-31 (inclusive end)"
          setup_api_calls:
