              as: PermitSpecialist
              captures: { app_1: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_1}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
            - call: "POST /osup/permit-applications"
              payload: { outfitter_id: "${oa_id}", use_area_id: "${ua_id}", application_type: "NEW", season_year: 2027, requested_service_days: 3, proposed_activity_type: "FISHING", narrative: "Three days." }
              as: PermitSpecialist
              captures: { app_2: "$.data.id" }
            - call: "POST /osup/permit-applications/${app_2}/submit"
              payload: {}
              as: OutfitterRepresentative
              as_user_id: "${oa_id}"
          trigger:
            - call: "POST /osup/permit-applications/${app_1}/screen"
              payload: {}
              as: PermitSpecialist
            - call: "GET /osup/use-areas/${ua_id}/allocation-summary"
              payload: {}
              as: PermitSpecialist
            - call: "POST /osup/permit-applications/${app_1}/issue-permit"
              payload: { term_start_date: "2027-01-01", term_end_date: "2029-12-31", indemnification_acknowledged: true }
              as: AuthorizedOfficer
            - call: "GET /osup/use-areas/${ua_id}/allocation-summary"
              payload: {}
