        grounds:
          - validations[priority=8]
          - state_machines.Expert.ACTIVE_to_PROBATION
          - errors[ERR_EXPERT_ROSTER_INELIGIBLE]
        distinguishing_aspect: |
          Entity pair (Engagement, Expert): a fully-screened READY request still cannot produce an engagement
          while the expert's roster_status is PROBATION; reinstating to ACTIVE unlocks the identical request.
        test_recipe:
          setup: ["Expert manually probated (no engagements, so allowed); request for that expert screened to READY"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "S Fox", specialty_area: "med" }, as: PlatformAdmin, captures: { e17: $.data.id } }
            - { call: "POST /litigation/experts/${e17}/roster-status", payload: { to_status: "PROBATION", rationale: "quality review" }, as: PlatformAdmin }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-1700", court: "SDNY", title: "OO v PP", budget_cents: 1000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { c17: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${c17}", specialty_area: "med" }, as: CaseManager, as_user_id: "cm-1", captures: { r17: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${r17}/conflict-checks", payload: { expert_id: "${e17}", adverse_parties: [] }, as: ConflictAnalyst, captures: { cc17: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${cc17}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${r17}/credential-reviews", payload: { expert_id: "${e17}" }, as: CredentialAnalyst, captures: { cr17: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${cr17}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
          trigger:
            - call: "POST /litigation/engagements"
              payload: { engagement_request_id: "${r17}", expert_id: "${e17}", hourly_rate_cents: 40000, retainer_cents: 0, expense_cap_cents: 0 }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { err17: $.data.error_id }
            - call: "POST /litigation/experts/${e17}/roster-status"
              payload: { to_status: "ACTIVE", rationale: "reinstated" }
              as: PlatformAdmin
            - call: "POST /litigation/engagements"
              payload: { engagement_request_id: "${r17}", expert_id: "${e17}", hourly_rate_cents: 40000, retainer_cents: 0, expense_cap_cents: 0 }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { g17: $.data.id }
          assert:
            - "err17 == ERR_EXPERT_ROSTER_INELIGIBLE  (READY request insufficient while expert PROBATION)"
            - "after reinstate: Engagement.${g17}.status == DRAFT"

  - rule_id: resource_temporal_overlap
    instances:
      - name: expert_calendar_half_open_adjacency
        grounds:
          - calculations.schedule_overlap_detection
          - validations[priority=19]
          - errors[ERR_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) on the Expert resource — a session starting exactly at the
          prior session's end is legal adjacency, while one second of true overlap conflicts.
        test_recipe:
          setup: ["ACTIVE engagement (rate 40000, retainer 0); session 1 proposed 2026-06-15T10:00-12:00Z"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "T Gol", specialty_area: "med" }, as: PlatformAdmin, captures: { e18: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-1800", court: "SDNY", title: "QQ v RR", budget_cents: 1000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { c18: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${c18}", specialty_area: "med" }, as: CaseManager, as_user_id: "cm-1", captures: { r18: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${r18}/conflict-checks", payload: { expert_id: "${e18}", adverse_parties: [] }, as: ConflictAnalyst, captures: { cc18: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${cc18}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${r18}/credential-reviews", payload: { expert_id: "${e18}" }, as: CredentialAnalyst, captures: { cr18: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${cr18}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${r18}", expert_id: "${e18}", hourly_rate_cents: 40000, retainer_cents: 0, expense_cap_cents: 0 }, as: CaseManager, as_user_id: "cm-1", captures: { g18: $.data.id } }
            - { call: "POST /litigation/engagements/${g18}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g18}/sign", payload: {}, as: Expert, as_user_id: "${e18}" }
            - { call: "POST /litigation/engagements/${g18}/fund-retainer", payload: { amount_cents: 0 }, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g18}/testimony-schedules", payload: { kind: "DEPOSITION", start_at: "2026-06-15T10:00:00Z", end_at: "2026-06-15T12:00:00Z", estimated_hours: 2 }, as: CaseManager, as_user_id: "cm-1", captures: { s181: $.data.id } }
          trigger:
            - call: "POST /litigation/engagements/${g18}/testimony-schedules"
              payload: { kind: "DEPOSITION", start_at: "2026-06-15T12:00:00Z", end_at: "2026-06-15T14:00:00Z", estimated_hours: 2 }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { s182: $.data.id }
            - call: "POST /litigation/engagements/${g18}/testimony-schedules"
              payload: { kind: "DEPOSITION", start_at: "2026-06-15T11:59:59Z", end_at: "2026-06-15T13:00:00Z", estimated_hours: 1 }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { err18: $.data.error_id }
          assert:
            - "TestimonySchedule.${s182}.status == PROPOSED  (start == prior end: half-open adjacency allowed)"
            - "err18 == ERR_SCHEDULE_CONFLICT  (11:59:59 overlaps [10:00, 12:00) by one second)"

      - name: venue_closed_interval_turnover_buffer
        grounds:
          - calculations.schedule_overlap_detection
          - validations[priority=20]
          - errors[ERR_VENUE_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: CLOSED intervals plus a symmetric 30-minute turnover buffer on the Venue resource —
          a session starting exactly 30 minutes after the prior end still conflicts (buffered edges touch),
          while 30 minutes + 1 second is free. Different resource entity and different adjacency rule than the
          expert calendar.
        test_recipe:
          setup: ["ACTIVE engagement; venue V; session 1 at venue V 2026-06-15T10:00-12:00Z (effective occupancy [09:30, 12:30] closed)"]
