errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is missing, empty, or names a role outside the nine declared in section 1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "{project_id} does not resolve to a Project"
  - id: ERR_INFLUENT_PROFILE_NOT_FOUND
    http: 404
    condition: "{profile_id} does not resolve to an InfluentProfile"
  - id: ERR_TREATMENT_STAGE_NOT_FOUND
    http: 404
    condition: "{stage_id} does not resolve to a TreatmentStage"
  - id: ERR_EQUIPMENT_PACKAGE_NOT_FOUND
    http: 404
    condition: "{package_id} does not resolve to an EquipmentPackage"
  - id: ERR_SKID_NOT_FOUND
    http: 404
    condition: "{skid_id} does not resolve to a Skid"
  - id: ERR_FAT_RUN_NOT_FOUND
    http: 404
    condition: "{run_id} does not resolve to a FatRun"
  - id: ERR_SUBMITTAL_NOT_FOUND
    http: 404
    condition: "{submittal_id} does not resolve to an OrEqualSubmittal"
  - id: ERR_DEVIATION_NOT_FOUND
    http: 404
    condition: "{deviation_id} does not resolve to a SpecDeviation"
  - id: ERR_DEMO_NOT_FOUND
    http: 404
    condition: "{demo_id} does not resolve to a PerformanceDemo"
  - id: ERR_SERVICE_AGREEMENT_NOT_FOUND
    http: 404
    condition: "{agreement_id} does not resolve to a ServiceAgreement"
  - id: ERR_CONSUMABLE_DRAW_NOT_FOUND
    http: 404
    condition: "{draw_id} does not resolve to a ConsumableDraw"
  - id: ERR_TREATMENT_OBJECTIVE_NOT_FOUND
    http: 404
    condition: "{objective_id} does not resolve to a TreatmentObjective"
  - id: ERR_CATALOG_REF_NOT_FOUND
    http: 404
    condition: "a foreign key supplied in the request body or a catalog id supplied in the path (material_spec_id, technology_id, bay_id, skid_id, project_id) does not resolve to a live row"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is absent, a field has the wrong type, an enum value is not a declared member, a numeric field violates its declared constraint, or an end instant is not strictly after its start instant"
  - id: ERR_DUPLICATE_CATALOG_CODE
    http: 409
    condition: "a ProcessTechnology.code, MaterialSpec.code or TestBay.bay_code already exists in its catalog"
  - id: ERR_DUPLICATE_TAG_NUMBER
    http: 409
    condition: "an EquipmentPackage with the same tag_number already exists on the same treatment_stage_id"
  - id: ERR_STALE_SKID_VERSION
    http: 412
    condition: "expected_skid_version does not equal the stored Skid.version at the moment the FAT run is booked"
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_service_agreement_version does not equal the stored ServiceAgreement.version at the moment the draw is posted"
  - id: ERR_STALE_SUBMITTAL_VERSION
    http: 412
    condition: "expected_or_equal_submittal_version does not equal the stored OrEqualSubmittal.version at the moment the deviation is disclosed"
  - id: ERR_AGREEMENT_EXPIRED
    http: 409
    condition: "the logical clock is at or after ServiceAgreement.expires_at; the agreement is swept to EXPIRED and the operation is refused"
  - id: ERR_INVALID_PROJECT_STATE
    http: 409
    condition: "the project is not in the lifecycle state the requested operation departs from"
  - id: ERR_BID_ALREADY_SUBMITTED
    http: 409
    condition: "a bid has already been posted for the project"
  - id: ERR_PROFILE_ALREADY_DECIDED
    http: 409
    condition: "the influent profile has already been accepted or rejected"
  - id: ERR_PACKAGE_INVALID_STATE
    http: 409
    condition: "the equipment package is not in the state the requested operation departs from"
  - id: ERR_SKID_MILESTONE_OUT_OF_ORDER
    http: 409
    condition: "the requested milestone is not the immediate successor of the skid's current state on the addressed build dimension"
  - id: ERR_FAT_RUN_NOT_SCHEDULED
    http: 409
    condition: "the FAT run is no longer SCHEDULED and can be neither witnessed nor cancelled"
  - id: ERR_SUBMITTAL_INVALID_STATE
    http: 409
    condition: "the or-equal submittal is not in the state the requested operation departs from"
  - id: ERR_DEVIATION_ALREADY_DISPOSITIONED
    http: 409
    condition: "the disclosed deviation already carries a disposition"
  - id: ERR_DEMO_ALREADY_CERTIFIED
    http: 409
    condition: "the performance demonstration already carries a certified result"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "the service agreement is PENDING_ACTIVATION or SUSPENDED and accepts no draw"
  - id: ERR_DRAW_ALREADY_REVERSED
    http: 409
    condition: "a REVERSAL row already references the target draw, or the target draw is itself a REVERSAL row"
  - id: ERR_DELIVERABLE_ALREADY_ACCEPTED
    http: 409
    condition: "the addressed closeout deliverable has already been accepted"
  - id: ERR_STAGE_SUPERSEDED
    http: 409
    condition: "the parent TreatmentStage has been superseded by a later process-selection run and accepts no further engineering"
  - id: ERR_SOD_DESIGNER_IS_REVIEWER
    http: 403
    condition: "the X-User-ID rendering a design review decision, or witnessing a FAT result, equals the EquipmentPackage.designed_by_user_id of the package under review"
  - id: ERR_SOD_AUTHOR_IS_BIDDER
    http: 403
    condition: "the X-User-ID posting the bid equals the authored_by_user_id of the project's PRE_APPROVED or-equal submittal"
  - id: ERR_SOD_RECORDER_IS_CERTIFIER
    http: 403
    condition: "the X-User-ID certifying a demonstration equals PerformanceDemo.recorded_by_user_id"
  - id: ERR_MATERIAL_NOT_RATED_FOR_SERVICE
    http: 422
    condition: "the selected material is not rated for the governing influent chloride, temperature or pH, or does not allow the stage technology's chemical service class"
  - id: ERR_MATERIAL_PRESSURE_EXCEEDED
    http: 422
    condition: "the package design pressure exceeds the selected material's max_pressure_psig"
  - id: ERR_MATERIAL_NOT_CODE_STAMPABLE
    http: 422
    condition: "the selected material lacks the code-stamp capability the stage technology requires"
  - id: ERR_NO_ACCEPTED_INFLUENT_PROFILE
    http: 422
    condition: "the project has no InfluentProfile in qa_status ACCEPTED, so no governing design basis exists"
  - id: ERR_NO_TREATMENT_OBJECTIVES
    http: 422
    condition: "the project has no ACTIVE TreatmentObjective, so no stage roles can be derived"
  - id: ERR_NO_ELIGIBLE_TECHNOLOGY
    http: 422
    condition: "a required stage role has an empty candidate pool once catalog status, feed-quality envelope and flow envelope screens are applied"
  - id: ERR_SKID_NOT_FAT_READY
    http: 422
    condition: "the parent equipment package is not RELEASED_FOR_FAB, or the skid's derived fat_readiness is NOT_READY or BLOCKED"
  - id: ERR_TEST_BAY_UNAVAILABLE
    http: 409
    condition: "the target test bay is OUT_OF_SERVICE"
  - id: ERR_TEST_BAY_EXCLUSIVE_CONFLICT
    http: 409
    condition: "a run in the changeover-buffered overlap set requires an exclusive bay, or the incoming run requires one while the overlap set is non-empty"
  - id: ERR_TEST_BAY_CAPACITY_EXCEEDED
    http: 409
    condition: "the summed footprint of the changeover-buffered overlap set plus the incoming run exceeds the bay's max_skid_footprint_sf"
  - id: ERR_DEMO_WINDOW_CONFLICT
    http: 409
    condition: "the requested demonstration window shares a closed-interval overlap with a PENDING demonstration on the same skid"
  - id: ERR_FUNDAMENTAL_DEVIATION_OPEN
    http: 422
    condition: "the submittal still carries at least one PENDING deviation of severity FUNDAMENTAL at pre-approval"
  - id: ERR_COMPLIANCE_SCORE_TOO_LOW
    http: 422
    condition: "the submittal's compliance_score is below MIN_COMPLIANCE_SCORE, or the submittal carries no disclosed deviation at all on submit"
  - id: ERR_OR_EQUAL_NOT_PREAPPROVED
    http: 422
    condition: "no or-equal submittal of the project is PRE_APPROVED, or a non-superseded stage carries no priced equipment package"
  - id: ERR_BID_WINDOW_CLOSED
    http: 422
    condition: "the logical clock is at or after Project.bid_due_at"
  - id: ERR_BID_MARGIN_BELOW_FLOOR
    http: 422
    condition: "the offered price yields a margin below MIN_MARGIN_PCT over the evaluated bid price"
  - id: ERR_GUARANTEE_PREREQ_NOT_MET
    http: 422
    condition: "the project is not COMMISSIONING, the skid's package has not passed factory acceptance testing, or the skid does not belong to the named project"
  - id: ERR_MAX_DEMO_ROUNDS_EXCEEDED
    http: 422
    condition: "the project has already consumed MAX_DEMO_ROUNDS certified demonstration rounds"
  - id: ERR_DEMO_READING_MISSING
    http: 422
    condition: "an ACTIVE treatment objective of the project has no reading of its parameter in the recorded demonstration"
  - id: ERR_DELIVERABLES_INCOMPLETE
    http: 422
    condition: "one of the three closeout deliverable statuses on the project is not ACCEPTED"
  - id: ERR_INVALID_DRAW_QUANTITY
    http: 422
    condition: "the draw quantity is not an integer of at least 1"
  - id: ERR_RESERVE_INSUFFICIENT
    http: 422
    condition: "the draw's ACCRUAL line amount exceeds the agreement's reserve_available_cents"

roles:
  - name: PlatformAdmin
    description: "Maintains the shared catalogs (process technologies, wetted materials, test bays) and the logical clock. Holds no project authority whatsoever."
    identity: opaque
    exclusive_operations:
      - "POST /water-treatment/_clock/set_current_utc"
      - "POST /water-treatment/process-technologies"
      - "POST /water-treatment/material-specs"
      - "POST /water-treatment/test-bays"
    shared_operations:
      - "every GET route in section 1.5"
  - name: ApplicationEngineer
    description: "Owns application engineering: influent characterisation, treatment objectives, process selection, equipment package design and revision, and authorship of the or-equal submittal package. Never reviews its own design and never posts the bid."
    identity: opaque
    exclusive_operations:
      - "POST /water-treatment/projects/{project_id}/influent-profiles"
      - "POST /water-treatment/projects/{project_id}/treatment-objectives"
      - "POST /water-treatment/projects/{project_id}/process-selection"
      - "POST /water-treatment/treatment-stages/{stage_id}/equipment-packages"
      - "PATCH /water-treatment/equipment-packages/{package_id}"
      - "POST /water-treatment/equipment-packages/{package_id}/submit-for-review"
      - "POST /water-treatment/or-equal-submittals"
      - "POST /water-treatment/or-equal-submittals/{submittal_id}/spec-deviations"
      - "POST /water-treatment/or-equal-submittals/{submittal_id}/submit"
    shared_operations:
      - "POST /water-treatment/projects"
      - "every GET route in section 1.5"
  - name: DesignReviewer
    description: "Renders the independent design review that freezes the firm price and engineers the stage. Segregation of duties: cannot review a package it designed."
    identity: opaque
    exclusive_operations:
      - "POST /water-treatment/equipment-packages/{package_id}/review-decision"
    shared_operations:
      - "every GET route in section 1.5"
  - name: FabricationManager
    description: "Runs the shop floor: releases approved packages, advances the two skid build dimensions, and books or cancels test-bay time."
    identity: opaque
    exclusive_operations:
      - "POST /water-treatment/equipment-packages/{package_id}/release-for-fabrication"
      - "POST /water-treatment/skids/{skid_id}/milestones"
      - "POST /water-treatment/fat-runs"
      - "POST /water-treatment/fat-runs/{run_id}/cancel"
    shared_operations:
      - "every GET route in section 1.5"
  - name: QualityEngineer
    description: "Independent quality authority: accepts or rejects sampled influent data, witnesses factory acceptance test results, and certifies performance-guarantee demonstrations. Segregation of duties: cannot witness a FAT for a package it designed, and cannot certify a demonstration it recorded."
    identity: opaque
    exclusive_operations:
      - "POST /water-treatment/influent-profiles/{profile_id}/qa-decision"
      - "POST /water-treatment/fat-runs/{run_id}/witness-result"
      - "POST /water-treatment/performance-demos/{demo_id}/certify"
    shared_operations:
      - "every GET route in section 1.5"
  - name: CommissioningEngineer
    description: "Provides installation and startup support in the field and records the finished-water readings of each guarantee demonstration run. Never certifies its own readings."
    identity: opaque
    exclusive_operations:
      - "POST /water-treatment/performance-demos"
    shared_operations:
      - "every GET route in section 1.5"
  - name: EngineerOfRecord
    description: "The owner's design engineer: dispositions each disclosed specification deviation and decides whether the offered equipment is pre-approved as an equal product."
    identity: opaque
    exclusive_operations:
      - "POST /water-treatment/spec-deviations/{deviation_id}/disposition"
      - "POST /water-treatment/or-equal-submittals/{submittal_id}/engineer-decision"
    shared_operations:
      - "every GET route in section 1.5"
  - name: OwnerRepresentative
    description: "Accepts or rejects the three closeout deliverables: operations and maintenance manual, operator training programme, and recommended spare-parts list."
    identity: opaque
    exclusive_operations:
      - "POST /water-treatment/projects/{project_id}/deliverable-acceptance"
    shared_operations:
      - "every GET route in section 1.5"
  - name: ContractsAdministrator
    description: "Owns the commercial record: posts the municipal bid, records the award, opens the long-term service agreement, and posts and reverses consumable and membrane draws. Segregation of duties: cannot post a bid resting on an or-equal submittal it authored."
    identity: opaque
    exclusive_operations:
      - "POST /water-treatment/projects/{project_id}/bid"
      - "POST /water-treatment/projects/{project_id}/award"
      - "POST /water-treatment/projects/{project_id}/service-agreements"
      - "POST /water-treatment/service-agreements/{agreement_id}/consumable-draws"
      - "POST /water-treatment/consumable-draws/{draw_id}/reversal"
    shared_operations:
      - "POST /water-treatment/projects"
      - "every GET route in section 1.5"
