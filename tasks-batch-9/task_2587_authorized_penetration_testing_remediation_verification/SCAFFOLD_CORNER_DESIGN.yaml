              as_user_id: "co-2"
              captures: { f1_status: $.data.status }
          assert:
            - "HTTP 422 and ${err_residual} == ERR_RESIDUAL_NOTE_REQUIRED for the FAIL verification without a residual note"
            - "${rv_fail_state} == VERIFIED, so the row itself is signable in principle"
            - "HTTP 409 and ${err_not_validated} == ERR_REMEDIATION_NOT_VALIDATED because the FAIL sent the remediation back to ASSIGNED"
            - "${rv_fail_state_after} == SUPERSEDED once the owner resubmits"
            - "HTTP 409 and ${err_superseded} == ERR_RETEST_ALREADY_SIGNED_OFF — the superseded row is refused by the state gate, which is checked before the PASS gate"
            - "HTTP 422 and ${err_sod} == ERR_SOD_SIGNOFF_CONFLICT when co-1 signs the remediation co-1 owns"
            - "${rv_pass_state} == SIGNED_OFF with ${signer} == co-2 and ${f1_status} == CLOSED"
            - "HTTP 409 and ${err_already} == ERR_RETEST_ALREADY_SIGNED_OFF on the repeat sign-off"

  - section: rbac
    instances:
      - name: every_roles_exclusive_write_is_refused_to_the_other_four_roles
        claim_type: exclusive_operations
        grounds:
          - roles[PlatformAdmin].exclusive_operations
          - roles[ProgramManager].exclusive_operations
          - roles[ComplianceOfficer].exclusive_operations
          - roles[Tester].exclusive_operations
          - roles[RemediationOwner].exclusive_operations
          - errors[ERR_UNAUTHORIZED]
          - validations.priority_3
        distinguishing_aspect: "One exclusive write is sampled from each of the five roles and issued under a role that does not own it; every attempt is refused with ERR_UNAUTHORIZED (403) before the body is inspected, so even a perfectly formed payload never takes effect — and each sampled endpoint is then shown to succeed for its owning role."
        test_recipe:
          setup:
            - "An asset and a DRAFT test plan created by their owning roles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88, last_tested_at: "2025-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_a_id: $.data.id }
            - call: "POST /pentest/test-plans"
              payload: { fiscal_year: 2026, risk_appetite_score: 100, planned_engagement_count: 5, prioritization_mode: "RISK_DRIVEN" }
