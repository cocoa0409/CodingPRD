    side_effects: []
  - method: POST
    path: "/health-data/geofence-campaigns/{id}/activate"
    description: "Activates a planned or paused campaign subject to prohibition, standoff, window and cooldown checks"
    roles: [DataSteward]
    code: 200
    input: []
    output: GeofenceCampaign
    side_effects: ["PLANNED -> ACTIVE or PAUSED -> ACTIVE", "sets the zone's last_campaign_activated_at to the logical clock", "clears pause_reason"]
  - method: POST
    path: "/health-data/geofence-campaigns/{id}/pause"
    description: "Pauses an active campaign"
