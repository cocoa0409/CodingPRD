            - call: "POST /participants/${pg_id}/attestation"
              payload: { attestation_document_reference: "ATT-GAMMA-2026-08" }
              as: ParticipantAdmin
              as_user_id: "${pg_id}"
            - call: "POST /participants/${pg_id}/certification-window"
              payload: { certification_test_suite_version: "CERT-2026.2" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pg_id}/certification-results"
              payload: { outcome: "PASS" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pg_id}/activation"
              payload: { go_live_business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pg_v: $.data.version }
            - call: "POST /segment-policies"
              payload: { participant_id: "${pg_id}", segment: "CORPORATE", per_transaction_limit_cents: 250000000, daily_aggregate_limit_cents: 500000000, rolling_window_count_limit: 5, rolling_window_amount_limit_cents: 400000000, effective_from: "2026-08-01T00:00:00Z", expected_participant_version: "${pg_v}" }
              as: ParticipantAdmin
              as_user_id: "${pg_id}"
            - call: "POST /customer-accounts"
              payload: { participant_id: "${pg_id}", segment: "CORPORATE", account_reference: "CUST-GAMMA-0001", fraud_risk_baseline: 20 }
              as: ParticipantAdmin
              as_user_id: "${pg_id}"
              captures: { gca_id: $.data.id }
            - call: "POST /settlement-cycles"
              payload: { business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "GET /position-accounts/${gacct_id}"
