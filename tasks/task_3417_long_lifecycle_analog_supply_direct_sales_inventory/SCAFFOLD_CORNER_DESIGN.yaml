            - "both lines show allocation_priority_score == 40 (STANDARD, no bonus) — only created_at separates them"
            - "GET /orders/${c5_o1}: ALLOCATED; GET /orders/${c5_o2}: BACKORDERED"

      - name: allocation_waterfall_canonical_fixture
        claim_type: Correct Result
        grounds:
          - calculations.calc_allocation_awards
        excluded_because:
