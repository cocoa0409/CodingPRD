    output: EventLog
    side_effects: ["EventLog.finalized=true", "run calc final_settlement -> Booking.final_subtotal", "recompute Booking.balance_due = final_subtotal - amount_paid", "increments EventLog.version and Booking.version by 1"]

  # ---- galleries ----
