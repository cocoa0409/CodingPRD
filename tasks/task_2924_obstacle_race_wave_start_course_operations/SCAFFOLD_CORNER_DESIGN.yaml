        excluded_because:
          difficulty_instance: entry_result_cycle_provisional_under_protest_bounded_at_two_rounds
          rationale: "§1.8 walks the PROVISIONAL -> UNDER_PROTEST -> PROVISIONAL cycle to its MAX_PROTEST_ROUNDS ceiling and asserts the ERR_PROTEST_ROUNDS_EXHAUSTED refusal on the third lap, covering both the loop and its termination condition."

      - name: vacating_a_marshal_cascades_down_four_levels
        claim_type: Cascade down
        excluded_because:
          difficulty_instance: vacating_the_only_marshal_cascades_staff_to_obstacle_to_course_to_wave
          rationale: "§1.8 verifies the full StaffAssignment -> Obstacle -> Course -> Wave chain end-to-end in one response, including that only non-terminal children are touched."

      - name: denial_and_expiry_cascade_down_from_the_parcel
        claim_type: Cascade down
        excluded_because:
          difficulty_instance: permit_expiry_at_the_clock_freezes_venue_courses_waves_and_festival_services
          rationale: "§1.8 asserts the Venue -> Course -> Wave chain plus the FestivalService fan-out from a single clock advance, so a second cascade-down instance would only restate it."

      - name: the_wave_hold_link_fires_only_inside_the_holdback_window
        claim_type: Conditional cascade
        excluded_because:
          difficulty_instance: vacating_the_only_marshal_cascades_staff_to_obstacle_to_course_to_wave
          rationale: "§1.8 pins the conditional edge of cascade link 4 — only heats with release_status SCHEDULED whose scheduled_start_utc falls inside the 45-minute holdback window are held, and a heat outside the window is asserted untouched."

      - name: reinspection_reverses_the_bond_ledger_without_drift
        claim_type: Compensation
        excluded_because:
          difficulty_instance: failed_reinspection_claws_the_bond_share_back_and_the_three_cent_fields_still_sum
          rationale: "§1.8 drives VERIFIED -> REMEDIATION_REQUIRED, asserts the clawback of the exact released amount, resets the task's bond_release_cents to 0 and re-checks the held + released + forfeited invariant."

      - name: verification_syncs_the_parcel_bond_ledger
        claim_type: Ledger sync
        excluded_because:
          difficulty_instance: failed_reinspection_claws_the_bond_share_back_and_the_three_cent_fields_still_sum
          rationale: "The forward PENDING -> VERIFIED ledger sync is the first half of that §1.8 instance, which asserts Venue.bond_released_cents and bond_held_cents after each of the three verifications before reversing one of them."

      - name: release_is_guarded_by_the_courses_publication_state
        claim_type: guarded transitions
        excluded_because:
          difficulty_instance: wave_release_blocked_by_the_courses_publication_state_two_levels_up
          rationale: "§1.8 asserts the cross-entity guard on SCHEDULED -> RELEASED — the heat is refused for its grandparent's state while every wave-local precondition is satisfied — which is exactly the guarded-transition claim."

      - name: the_gun_sorts_entries_by_their_own_progress_state
        claim_type: Side Effect Execution
        excluded_because:
          difficulty_instance: entry_fate_at_the_gun_is_decided_by_the_participants_clearance_state
          rationale: "§1.8 already asserts the RELEASED -> STARTED fan-out: CHECKED_IN entries become STARTED with computed chip_start_utc while REGISTERED entries become DNS / NOT_CLASSIFIED, plus the roster's advance to SEALED."

  - section: calculations
    instances:
      - name: design_rates_land_on_twelve_seven_fifty_and_a_corral_capped_twelve
        claim_type: Correct Result
        grounds:
          - calculations.obstacle_design_clearance_rate
          - calculations.course_design_capacity
          - errors[ERR_DESIGN_CAPACITY_EXCEEDED]
        distinguishing_aspect: "Three stations exercise all three branches of the design formula in one course: 12.00 with no relief, 7.50 with MANDATORY suppressing relief, and station 3's 9.00 + 4.50 relief clipped to the corral's 12.00 — so the minimum is 7.50, design_capacity_pph is floor(60 × 7.50) = 450 and the wave-creation ceiling is floor(450 × 15 / 60) = 112."
        test_recipe:
          setup:
            - "An unpermitted DRAFT course with corral_release_rate_per_min 12.00 and corral_throughput_capacity 200, carrying three primary stations: 4 lanes at 3.00 with bypass NONE, 3 lanes at 2.50 with bypass MANDATORY, and 3 lanes at 3.00 with bypass TIMED_PENALTY."
            - "No permit is approved, so wave creation skips the quiet-hours rule and the only capacity gate is the design ceiling."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 1000000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { o1_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Mud Trench", station_index: 2, difficulty_rating: 5, lane_count: 3, service_rate_per_min: 2.50, marshals_required: 1, footprint_sqm: 1500, water_contact: false, bypass_mode: "MANDATORY", penalty_seconds: 120 }
              as: CourseDesigner
              captures: { o2_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Wall Climb", station_index: 3, difficulty_rating: 7, lane_count: 3, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1000, water_contact: false, bypass_mode: "TIMED_PENALTY", penalty_seconds: 90 }
              as: CourseDesigner
              captures: { o3_id: $.data.id }
            - call: "POST /ocr/divisions"
              payload: { name: "Open Wave", division_type: "OPEN", bypass_policy: "ALLOWED_WITH_PENALTY", scoring_mode: "GUN_TIME", min_age: 16, team_size_min: 1, team_size_max: 1 }
              as: RaceDirector
              captures: { div_open_id: $.data.id }
          trigger:
            - call: "POST /ocr/courses/${course_id}/waves"
              payload: { division_id: "${div_open_id}", wave_code: "S1", scheduled_start_utc: "2026-09-12T08:00:00Z", capacity: 113 }
              as: RaceDirector
            - call: "POST /ocr/courses/${course_id}/waves"
              payload: { division_id: "${div_open_id}", wave_code: "S1", scheduled_start_utc: "2026-09-12T08:00:00Z", capacity: 112 }
              as: RaceDirector
              captures: { wave_s1_id: $.data.id }
          assert:
            - "Obstacle.${o1_id}.design_clearance_rate_per_min == 12.00 (4 × 3.00 with no relief)"
            - "Obstacle.${o2_id}.design_clearance_rate_per_min == 7.50 (3 × 2.50; MANDATORY suppresses the relief term entirely)"
            - "Obstacle.${o3_id}.design_clearance_rate_per_min == 12.00 (9.00 plus min(4.50, 8.00) relief is 13.50, clipped by the 12.00 corral rate)"
            - "Course.${course_id}.design_capacity_pph == 450 and obstacle_count == 3"
            - "The first trigger call returns 409 with data.error_id == ERR_DESIGN_CAPACITY_EXCEEDED"
            - "The second trigger call returns 201 with Wave.${wave_s1_id}.capacity == 112 — the ceiling is inclusive"
            - "Course.${course_id}.scheduled_capacity_total == 112 and bottleneck_capacity_pph == 0 (nothing is staffed yet)"

      - name: only_verified_tasks_release_bond_and_the_denominator_stays_the_disturbed_area
        claim_type: Input Set Filtering
        grounds:
