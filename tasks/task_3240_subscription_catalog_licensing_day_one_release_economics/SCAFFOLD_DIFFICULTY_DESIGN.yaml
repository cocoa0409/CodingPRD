              captures: { subr_bo_id: $.data.id }
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_ana_id}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { sub_ana_id: $.data.id }
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_bo_id}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { sub_bo_id: $.data.id }
            - call: "POST /catalog/subscriptions/${sub_ana_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_ana_id}"
            - call: "POST /catalog/subscriptions/${sub_bo_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_bo_id}"
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-08-31T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 6000, popularity_index_cents_30d_avg: 3000 }
              as: CatalogAdmin
              captures: { entry_a_id: $.data.id }
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-09-30T00:00:00Z", release_class: "BACK_CATALOG", popularity_index_cents: 4000, popularity_index_cents_30d_avg: 4000 }
              as: CatalogAdmin
              captures: { entry_b_id: $.data.id }
            - call: "POST /catalog/catalog-entries/${entry_a_id}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "POST /catalog/catalog-entries/${entry_b_id}/publish"
              payload: {}
              as: CatalogAdmin
          trigger:
            - call: "POST /catalog/subscriptions/${sub_ana_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_ana_id}"
          assert:
            - "hop 1: GET /catalog/subscriptions/${sub_ana_id} reports lifecycle_status == CANCELLED"
            - "hop 2: GET /catalog/entitlements?subscription_id=${sub_ana_id} returns two rows, both status == REVOKED — including the one naming the BACK_CATALOG entry, which the retention clause would have spared"
            - "hop 2: GET /catalog/entitlements?subscription_id=${sub_bo_id} returns two rows, both still status == ACTIVE"
            - "hop 3: CatalogEntry.${entry_a_id}.subscriber_impact_count == 1 and CatalogEntry.${entry_b_id}.subscriber_impact_count == 1"
            - "hop 3: SubscriptionTier PREMIUM current_subscriber_count == 1"
            - "no Entitlement row was deleted: GET /catalog/entitlements?subscription_id=${sub_ana_id} still returns 2 rows"

  - rule_id: priority_pair_validation_conflict
    instances:

      # ---------------------------------------------------------------- 1 of 2
      - name: already_added_entry_beats_region_ceiling
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors.ERR_ENTRY_NOT_PUBLISHABLE
          - errors.ERR_REGION_CATALOG_CEILING_REACHED
        distinguishing_aspect: |
          A different error-category pair from the temporal-vs-constraint instance: this
          request fails both the state check and the fiscal ceiling check, and the state
          error (priority 5) is returned even though the fiscal error (priority 8) is also
          live at the same instant.
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. An NA region with availability_ceiling_titles 2, so the ceiling can be exhausted with two entries."
            - "Two published ADDED entries already occupy the region; the first entry is then re-submitted to publish."
          setup_api_calls:
            - *c_may
            - call: "POST /catalog/regions"
              payload: { region_code: "NA", currency_code: "USD", price_multiplier: 1.20, availability_ceiling_titles: 2, catalog_tier_floor: "ESSENTIAL" }
              as: CatalogAdmin
            - *t_prem
            - *t_ess
            - *p_nova
            - *ti_crimson
            - *d_hybrid
            - *sign_deal
            - *c_jun
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-08-31T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 6000, popularity_index_cents_30d_avg: 3000 }
              as: CatalogAdmin
              captures: { entry_a_id: $.data.id }
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-09-30T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 4000, popularity_index_cents_30d_avg: 4000 }
              as: CatalogAdmin
              captures: { entry_b_id: $.data.id }
            - call: "POST /catalog/catalog-entries/${entry_a_id}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "POST /catalog/catalog-entries/${entry_b_id}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-10-31T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 1000, popularity_index_cents_30d_avg: 1000 }
              as: CatalogAdmin
              captures: { entry_c_id: $.data.id }
          trigger:
            - call: "POST /catalog/catalog-entries/${entry_a_id}/publish"
              payload: {}
              as: CatalogAdmin
              captures: { err_republish: $.data.error_id, err_republish_msg: $.data.message }
            - call: "POST /catalog/catalog-entries/${entry_c_id}/publish"
              payload: {}
              as: CatalogAdmin
              captures: { err_ceiling: $.data.error_id }
          assert:
            - "the re-publish returns 409 with err_republish == ERR_ENTRY_NOT_PUBLISHABLE, not ERR_REGION_CATALOG_CEILING_REACHED"
            - "the first publish of entry_c returns 409 with err_ceiling == ERR_REGION_CATALOG_CEILING_REACHED, proving the fiscal condition is live at the same instant"
            - "state (priority 5) therefore outranks fiscal (priority 8) on the identical request shape"
            - "GET /catalog/catalog-entries?region_code=NA&status=ADDED returns exactly 2 rows"

      # ---------------------------------------------------------------- 2 of 2
      - name: insufficient_notice_beats_day_one_ineligibility
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors.ERR_INSUFFICIENT_REMOVAL_NOTICE
          - errors.ERR_DAY_ONE_NOT_ELIGIBLE
        distinguishing_aspect: |
          A different pair from the state-vs-fiscal instance: the creation request violates
          both the temporal notice rule and the day-one eligibility rule, and the temporal
          error (priority 6) wins over the constraint error (priority 7).
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. NA region, PREMIUM tier, publisher, a back-catalog title that is NOT day-one eligible (list 4000.00, unit_sales_30d 8000), and a HYBRID deal LIVE for it."
          setup_api_calls:
            - *c_may
            - *r_na
            - *t_prem
            - *t_ess
            - call: "POST /catalog/publishers"
              payload: { name: "Halcyon Works", home_region_code: "NA" }
              as: CatalogAdmin
              captures: { pub2_id: $.data.id }
            - call: "POST /catalog/titles"
              payload: { publisher_id: "${pub2_id}", name: "Static Vale", platform_set: ["PC"], day_one_eligible: false, list_price_cents: 4000, unit_sales_30d: 8000 }
              as: CatalogAdmin
              captures: { title2_id: $.data.id, title2_v: $.data.version }
            - call: "POST /catalog/licensing-deals"
              payload: { publisher_id: "${pub2_id}", title_id: "${title2_id}", compensation_model: "HYBRID", guaranteed_compensation_cents: 150000, monthly_engagement_cap_cents: 300000, engagement_rate_cents_per_hour: 251, term_start_date: "2026-06-01T00:00:00Z", term_end_date: "2026-12-01T00:00:00Z", add_effective_date: "2026-06-05T00:00:00Z" }
              as: CatalogAdmin
              captures: { deal2_id: $.data.id }
            - call: "POST /catalog/licensing-deals/${deal2_id}/sign"
              payload: { expected_title_version: "${title2_v}" }
              as: CatalogAdmin
            - *c_jun
          trigger:
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title2_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-06-07T00:00:00Z", release_class: "DAY_ONE", popularity_index_cents: 5000, popularity_index_cents_30d_avg: 5000 }
              as: CatalogAdmin
              captures: { err_both: $.data.error_id }
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title2_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-06-20T00:00:00Z", release_class: "DAY_ONE", popularity_index_cents: 5000, popularity_index_cents_30d_avg: 5000 }
              as: CatalogAdmin
              captures: { err_eligibility_only: $.data.error_id }
          assert:
            - "the first request returns 409 with err_both == ERR_INSUFFICIENT_REMOVAL_NOTICE — the 5-day notice fails the 14-day DAY_ONE minimum, and temporal (priority 6) outranks constraint (priority 7)"
            - "err_both != ERR_DAY_ONE_NOT_ELIGIBLE even though the title is not day-one eligible"
            - "the second request, whose 18-day notice is sufficient but whose title is still ineligible, returns 409 with err_eligibility_only == ERR_DAY_ONE_NOT_ELIGIBLE"
            - "GET /catalog/catalog-entries?title_id=${title2_id} returns 0 rows, so neither rejected request persisted anything"

  - rule_id: boundary_precision_check
    instances:

      # ---------------------------------------------------------------- 1 of 2
      - name: parity_multiplier_threshold_is_strictly_greater
        grounds:
          - calculations.regional_monthly_price
          - entities.Region.fields.price_multiplier
          - endpoints.POST_/catalog/subscriptions
        distinguishing_aspect: |
          A numeric threshold crossing on the price multiplier: exactly 1.50 stays on the raw
          multiplier (1500.00) while 1.60 blends to 1.44 (1440.00), so a single step of 0.01
          in the multiplier moves the billed price downward by 60.00 rather than upward.
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. PREMIUM tier at a global 1000.00 monthly price; two regions, NA at multiplier exactly 1.50 and EU at 1.60; two subscribers, one in each region."
          setup_api_calls:
            - *c_may
            - call: "POST /catalog/regions"
              payload: { region_code: "NA", currency_code: "USD", price_multiplier: 1.50, availability_ceiling_titles: 4000, catalog_tier_floor: "ESSENTIAL" }
              as: CatalogAdmin
            - call: "POST /catalog/regions"
              payload: { region_code: "EU", currency_code: "EUR", price_multiplier: 1.60, availability_ceiling_titles: 4000, catalog_tier_floor: "ESSENTIAL" }
              as: CatalogAdmin
            - call: "POST /catalog/tiers"
              payload: { tier_code: "PREMIUM", monthly_price_cents: 1000, console_access: true, pc_access: true, cloud_access: true, online_play_bundle: true, member_discount_pct: 0.075, discount_retention_days: 30, annual_prepay_credit_ratio: 0.25 }
              as: CatalogAdmin
            - call: "POST /catalog/tiers"
              payload: { tier_code: "ESSENTIAL", monthly_price_cents: 500, console_access: true, pc_access: false, cloud_access: false, online_play_bundle: false, member_discount_pct: 0.0, discount_retention_days: 0, annual_prepay_credit_ratio: 0.25 }
              as: CatalogAdmin
            - call: "POST /catalog/subscribers"
              payload: { email: "na_edge@example.com", display_name: "NA Edge", home_region_code: "NA", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_na_edge: $.data.id }
            - call: "POST /catalog/subscribers"
              payload: { email: "eu_edge@example.com", display_name: "EU Edge", home_region_code: "EU", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_eu_edge: $.data.id }
          trigger:
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_na_edge}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { sub_na_edge_id: $.data.id, bill_na: $.data.monthly_bill_cents, unpaid_na: $.data.unpaid_months }
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_eu_edge}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { sub_eu_edge_id: $.data.id, bill_eu: $.data.monthly_bill_cents }
          assert:
            - "bill_na == 1500.00 — a multiplier of exactly 1.50 does NOT take the blend"
            - "bill_eu == 1440.00 — 1.60 > 1.50 blends to round_half_up(1.60 * 0.90, 4) == 1.4400, then 1000 * 1.44"
            - "bill_eu < bill_na even though EU's multiplier is the larger of the two"
            - "unpaid_na == 1 for a MONTHLY subscription"
            - "GET /catalog/regions/NA reports price_multiplier == 1.50 unchanged, so the blend is computed per read and never written back"

      # ---------------------------------------------------------------- 2 of 2
      - name: cloud_capacity_over_capacity_boundary_on_a_different_metric
        grounds:
          - calculations.cloud_capacity_allocation
          - entities.Region.fields.capacity_status
          - endpoints.GET_/catalog/regions/{region_code}
        distinguishing_aspect: |
          A boundary on a collection-derived quantity rather than a scalar threshold: the
          JP region sits at 11600.00 required slots against 12000.00 usable (WITHIN_CAPACITY),
          and one more 1000-point entry lifts it to 12600.00, turning the strict > comparison
          OVER_CAPACITY with a 600.00 deficit.
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. NA region ceiling 4000 and JP region ceiling 400, PREMIUM tier, publisher, title, HYBRID deal LIVE."
            - "Three published ADDED entries, two of them inside their 14-day launch window."
          setup_api_calls:
            - *c_may
            - *r_na
            - call: "POST /catalog/regions"
              payload: { region_code: "JP", currency_code: "JPY", price_multiplier: 1.10, availability_ceiling_titles: 400, catalog_tier_floor: "ESSENTIAL" }
              as: CatalogAdmin
            - *t_prem
            - *t_ess
            - *p_nova
            - *ti_crimson
            - *d_hybrid
            - *sign_deal
            - *c_jun
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "JP", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-12-31T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 6000, popularity_index_cents_30d_avg: 3000 }
              as: CatalogAdmin
              captures: { jp_entry_a: $.data.id }
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "JP", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-12-31T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 8000, popularity_index_cents_30d_avg: 8000 }
              as: CatalogAdmin
              captures: { jp_entry_b: $.data.id }
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "JP", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-12-31T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 4000, popularity_index_cents_30d_avg: 4000 }
              as: CatalogAdmin
              captures: { jp_entry_c: $.data.id }
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "JP", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-12-31T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 2000, popularity_index_cents_30d_avg: 2000 }
              as: CatalogAdmin
              captures: { jp_entry_d: $.data.id }
            - call: "POST /catalog/catalog-entries/${jp_entry_a}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "POST /catalog/catalog-entries/${jp_entry_b}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "POST /catalog/catalog-entries/${jp_entry_c}/publish"
              payload: {}
              as: CatalogAdmin
          trigger:
            - call: "GET /catalog/regions/JP"
              payload: {}
              as: CatalogAdmin
              captures: { jp_required_below: $.data.capacity_required_slots, jp_usable: $.data.capacity_usable_slots, jp_status_below: $.data.capacity_status, jp_util_below: $.data.capacity_utilization_pct }
            - call: "POST /catalog/catalog-entries/${jp_entry_d}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "GET /catalog/regions/JP"
              payload: {}
              as: CatalogAdmin
              captures: { jp_required_above: $.data.capacity_required_slots, jp_deficit: $.data.capacity_deficit_slots, jp_status_above: $.data.capacity_status }
          assert:
            - "jp_usable == 12000.00 (JP ceiling 400 * 30 slots per ceiling unit), with no maintenance window active"
            - "jp_required_below == 11600.00 (base 9000.00 + launch spike 2400.00 + overhead 200.00) and jp_status_below == WITHIN_CAPACITY"
            - "jp_util_below == 96.67 (11600.00 / 12000.00 * 100)"
            - "jp_required_above == 12600.00 and jp_status_above == OVER_CAPACITY — the comparison is strict >, so equality would still be WITHIN_CAPACITY"
            - "jp_deficit == 600.00"
            - "GET /catalog/regions/NA reports capacity_status == WITHIN_CAPACITY at the same instant, so the boundary is regional and not global"

  - rule_id: cross_entity_state_dependency
    instances:

      # ---------------------------------------------------------------- 1 of 2
      - name: entry_readiness_depends_on_the_licensing_deal_state
        grounds:
          - state_machines.LicensingDeal.DRAFT_to_SIGNED
          - state_machines.CatalogEntry.PLANNED_to_ADDED
          - state_machines.CatalogEntry.PLANNED_to_DELISTED
          - errors.ERR_NO_BINDING_DEAL
        distinguishing_aspect: |
          The CatalogEntry -> LicensingDeal pair: the byte-identical POST /catalog/catalog-entries
          body is rejected while the title's deal is still DRAFT and accepted once the deal is
          signed, so the child's creatability is decided entirely by the parent's state.
        test_recipe:
          setup:
            - "Logical clock 2026-05-25T00:00:00Z. NA region, PREMIUM tier, publisher, day-one-eligible title, and a HYBRID deal created but deliberately left in DRAFT."
          setup_api_calls:
            - *c_may
            - *r_na
            - *t_prem
            - *t_ess
            - *p_nova
            - *ti_crimson
            - call: "POST /catalog/licensing-deals"
              payload: { publisher_id: "${pub_id}", title_id: "${title_id}", compensation_model: "HYBRID", guaranteed_compensation_cents: 150000, monthly_engagement_cap_cents: 300000, engagement_rate_cents_per_hour: 251, term_start_date: "2026-06-01T00:00:00Z", term_end_date: "2026-12-01T00:00:00Z", add_effective_date: "2026-06-05T00:00:00Z" }
              as: CatalogAdmin
              captures: { deal_id: $.data.id, deal_state_seed: $.data.status }
          trigger:
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-08-31T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 6000, popularity_index_cents_30d_avg: 3000 }
              as: CatalogAdmin
              captures: { err_unsign_deal: $.data.error_id }
            - call: "POST /catalog/licensing-deals/${deal_id}/sign"
              payload: { expected_title_version: "${title_v}" }
              as: CatalogAdmin
              captures: { deal_state_signed: $.data.status }
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-08-31T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 6000, popularity_index_cents_30d_avg: 3000 }
              as: CatalogAdmin
              captures: { entry_id: $.data.id, entry_state_seed: $.data.status }
          assert:
            - "deal_state_seed == DRAFT and deal_state_signed == SIGNED"
            - "the first create returns 409 with err_unsign_deal == ERR_NO_BINDING_DEAL"
            - "the second create, with an identical payload, returns 201 and entry_state_seed == PLANNED"
            - "GET /catalog/catalog-entries?title_id=${title_id} returns exactly 1 row, so the rejected request persisted nothing"
            - "Publication is likewise gated: after signing, GET /catalog/catalog-entries/${entry_id} reports deal_id == ${deal_id}"

      # ---------------------------------------------------------------- 2 of 2
      - name: entitlement_access_narrowing_tracks_the_subscription_lifecycle_dimension
        grounds:
          - state_machines.Subscription.PAID_to_FAILED
          - state_machines.Entitlement.ACTIVE_to_GRACE
          - state_machines.Entitlement.ACTIVE_to_ACTIVE
          - entities.Entitlement.fields.status
        distinguishing_aspect: |
          The Entitlement -> Subscription pair, distinct from the entry/deal pair: publishing one
          entry resolves the SAME request shape into two different entitlement states, decided
          solely by the owning subscription's billing dimension.
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. NA region, PREMIUM tier, publisher, title, HYBRID deal LIVE, two Subscribers each with a MONTHLY PREMIUM subscription, and one planned CATALOG_ADD entry."
            - "One subscription is deliberately left unpaid while the clock is advanced past its renewal instant, the other is paid in full."
          setup_api_calls:
            - *c_may
            - *r_na
            - *t_prem
            - *t_ess
            - *p_nova
            - *ti_crimson
            - *d_hybrid
            - *sign_deal
            - *c_jun
            - call: "POST /catalog/subscribers"
              payload: { email: "grace@example.com", display_name: "Grace Example", home_region_code: "NA", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_grace_id: $.data.id }
            - call: "POST /catalog/subscribers"
              payload: { email: "paid@example.com", display_name: "Paid Example", home_region_code: "NA", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_paid_id: $.data.id }
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_grace_id}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { sub_grace_id: $.data.id }
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_paid_id}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { sub_paid_id: $.data.id }
            - call: "POST /catalog/subscriptions/${sub_paid_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_paid_id}"
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: CatalogAdmin
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-07-01T00:00:00Z", removal_date: "2026-11-30T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 6000, popularity_index_cents_30d_avg: 3000 }
              as: CatalogAdmin
              captures: { entry_id: $.data.id }
          trigger:
            - call: "GET /catalog/subscriptions/${sub_grace_id}"
              payload: {}
              as: CatalogAdmin
              captures: { grace_billing: $.data.billing_status, grace_lifecycle: $.data.lifecycle_status }
            - call: "POST /catalog/catalog-entries/${entry_id}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "GET /catalog/entitlements"
              payload: { subscription_id: "${sub_grace_id}", limit: 10, offset: 0 }
              as: CatalogAdmin
              captures: { ent_grace_state: "$.data[0].status", ent_grace_channels: "$.data[0].access_channels" }
            - call: "GET /catalog/entitlements"
              payload: { subscription_id: "${sub_paid_id}", limit: 10, offset: 0 }
              as: CatalogAdmin
              captures: { ent_paid_state: "$.data[0].status" }
          assert:
            - "grace_billing == FAILED and grace_lifecycle == GRACE before the publish"
            - "ent_grace_state == GRACE while ent_paid_state == ACTIVE — the same publish produced two different entitlement states"
            - "both entitlements name the same entry: GET /catalog/entitlements?entry_id=${entry_id} returns exactly 2 rows"
            - "ent_grace_channels still lists CLOUD, because the channel set is derived from the tier flags and GRACE suspends rather than rewrites it"
            - "after paying, GET /catalog/entitlements?subscription_id=${sub_grace_id} returns a row whose status == ACTIVE"

  - rule_id: resource_temporal_overlap
    instances:

      # ---------------------------------------------------------------- 1 of 2
      - name: adjacent_maintenance_windows_touch_but_do_not_overlap
        grounds:
          - entities.CatalogMaintenance
          - endpoints.POST_/catalog/regions
          - errors.ERR_MAINTENANCE_WINDOW_OVERLAP
          - validations[priority=6]
        distinguishing_aspect: |
          Interval semantics by adjacency on the Region maintenance resource: two half-open
          windows that share only the boundary instant 2026-07-05T00:00:00Z are accepted,
          while shifting the second window one second earlier makes them overlap and the
          whole region creation is rejected.
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. No regions exist yet."
          setup_api_calls:
            - *c_may
          trigger:
            - call: "POST /catalog/regions"
              payload: { region_code: "NA", currency_code: "USD", price_multiplier: 1.20, availability_ceiling_titles: 4000, catalog_tier_floor: "ESSENTIAL", maintenance_windows: [{ maintenance_start: "2026-07-01T00:00:00Z", maintenance_end: "2026-07-05T00:00:00Z", capacity_reduction_pct: 0.25 }, { maintenance_start: "2026-07-05T00:00:00Z", maintenance_end: "2026-07-10T00:00:00Z", capacity_reduction_pct: 0.25 }] }
              as: CatalogAdmin
              captures: { na_region_created: $.data.region_code }
            - call: "POST /catalog/regions"
              payload: { region_code: "EU", currency_code: "EUR", price_multiplier: 1.20, availability_ceiling_titles: 4000, catalog_tier_floor: "ESSENTIAL", maintenance_windows: [{ maintenance_start: "2026-07-01T00:00:00Z", maintenance_end: "2026-07-05T00:00:00Z", capacity_reduction_pct: 0.25 }, { maintenance_start: "2026-07-04T23:59:59Z", maintenance_end: "2026-07-10T00:00:00Z", capacity_reduction_pct: 0.25 }] }
              as: CatalogAdmin
              captures: { err_overlap: $.data.error_id }
          assert:
            - "na_region_created == NA and GET /catalog/catalog-maintenances?region_code=NA returns exactly 2 rows, both status == SCHEDULED"
            - "the EU create returns 409 with err_overlap == ERR_MAINTENANCE_WINDOW_OVERLAP"
            - "GET /catalog/catalog-maintenances?region_code=EU returns 0 rows and GET /catalog/regions/EU returns 404 ERR_REGION_NOT_FOUND — the rejection is all-or-nothing, not a partial region with one window"
            - "the accepted pair is adjacent, not overlapping: 2026-07-05T00:00:00Z is the exclusive end of the first window and the inclusive start of the second"

      # ---------------------------------------------------------------- 2 of 2
      - name: renewal_tightens_the_term_window_around_existing_removal_dates
        grounds:
          - entities.LicensingDeal.fields.term_end_date
          - state_machines.LicensingDeal.EXPIRING_to_LIVE
          - endpoints.POST_/catalog/licensing-deals/{deal_id}/renew
          - errors.ERR_TERM_WINDOW_INVALID
        distinguishing_aspect: |
          Interval semantics by window tightening on the LicensingDeal resource rather than by
          adjacency on Region: the identical renewal request (new end 2027-02-15) is rejected for
          the deal whose entry removal date 2027-03-01 sits outside the new window and accepted
          for the deal whose entry removal date 2026-12-20 sits inside it.
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. NA region, PREMIUM tier, one publisher with two titles, and one HYBRID deal per title, both signed, both ending 2026-12-01."
            - "Each deal has one published CATALOG_ADD entry; the first entry's removal date is 2027-03-01 and the second's is 2026-12-20."
            - "The clock is then advanced to 2026-11-29, so both deals are EXPIRING."
          setup_api_calls:
            - *c_may
            - *r_na
            - *t_prem
            - *t_ess
            - *p_nova
            - call: "POST /catalog/titles"
              payload: { publisher_id: "${pub_id}", name: "Crimson Drift", platform_set: ["CONSOLE", "PC"], day_one_eligible: true, list_price_cents: 7000, unit_sales_30d: 25000 }
              as: CatalogAdmin
              captures: { title_a_id: $.data.id, title_a_v: $.data.version }
            - call: "POST /catalog/titles"
              payload: { publisher_id: "${pub_id}", name: "Second Wind", platform_set: ["PC"], day_one_eligible: false, list_price_cents: 4000, unit_sales_30d: 9000 }
              as: CatalogAdmin
              captures: { title_b_id: $.data.id, title_b_v: $.data.version }
            - call: "POST /catalog/licensing-deals"
              payload: { publisher_id: "${pub_id}", title_id: "${title_a_id}", compensation_model: "HYBRID", guaranteed_compensation_cents: 150000, monthly_engagement_cap_cents: 300000, engagement_rate_cents_per_hour: 251, term_start_date: "2026-06-01T00:00:00Z", term_end_date: "2026-12-01T00:00:00Z", add_effective_date: "2026-06-05T00:00:00Z" }
              as: CatalogAdmin
              captures: { deal_a_id: $.data.id }
            - call: "POST /catalog/licensing-deals"
              payload: { publisher_id: "${pub_id}", title_id: "${title_b_id}", compensation_model: "HYBRID", guaranteed_compensation_cents: 150000, monthly_engagement_cap_cents: 300000, engagement_rate_cents_per_hour: 251, term_start_date: "2026-06-01T00:00:00Z", term_end_date: "2026-12-01T00:00:00Z", add_effective_date: "2026-06-05T00:00:00Z" }
              as: CatalogAdmin
              captures: { deal_b_id: $.data.id }
            - call: "POST /catalog/licensing-deals/${deal_a_id}/sign"
              payload: { expected_title_version: "${title_a_v}" }
              as: CatalogAdmin
            - call: "POST /catalog/licensing-deals/${deal_b_id}/sign"
              payload: { expected_title_version: "${title_b_v}" }
              as: CatalogAdmin
            - *c_jun
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_a_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2027-03-01T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 6000, popularity_index_cents_30d_avg: 3000 }
              as: CatalogAdmin
              captures: { entry_a_id: $.data.id }
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_b_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-12-20T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 4000, popularity_index_cents_30d_avg: 4000 }
              as: CatalogAdmin
              captures: { entry_b_id: $.data.id }
            - call: "POST /catalog/catalog-entries/${entry_a_id}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "POST /catalog/catalog-entries/${entry_b_id}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-11-29T00:00:00Z" }
              as: CatalogAdmin
          trigger:
            - call: "GET /catalog/licensing-deals/${deal_a_id}"
              payload: {}
              as: CatalogAdmin
              captures: { deal_a_state_expiring: $.data.status }
            - call: "POST /catalog/licensing-deals/${deal_a_id}/renew"
              payload: { renew_term_end_date: "2027-02-15T00:00:00Z" }
              as: CatalogAdmin
              captures: { err_tight: $.data.error_id }
            - call: "POST /catalog/licensing-deals/${deal_b_id}/renew"
              payload: { renew_term_end_date: "2027-02-15T00:00:00Z" }
              as: CatalogAdmin
              captures: { deal_b_state_renewed: $.data.status, deal_b_end: $.data.term_end_date, deal_b_removal: $.data.removal_effective_date }
            - call: "POST /catalog/licensing-deals/${deal_a_id}/renew"
              payload: { renew_term_end_date: "2027-06-01T00:00:00Z" }
              as: CatalogAdmin
              captures: { deal_a_state_renewed: $.data.status, deal_a_end: $.data.term_end_date, deal_a_removal: $.data.removal_effective_date }
          assert:
            - "deal_a_state_expiring == EXPIRING, so both deals are in the same state before the renewals"
            - "the first renewal returns 409 with err_tight == ERR_TERM_WINDOW_INVALID, because entry_a's removal date 2027-03-01 falls outside the window ending 2027-02-15"
            - "the second renewal, with an identical body, returns 200 and deal_b_state_renewed == LIVE, because entry_b's removal date 2026-12-20 falls inside that window"
            - "deal_b_end == 2027-02-15T00:00:00Z and deal_b_removal == 2027-02-13T00:00:00Z (term end minus two days)"
            - "the third renewal widens rather than tightens: deal_a_state_renewed == LIVE with deal_a_end == 2027-06-01T00:00:00Z and deal_a_removal == 2027-05-30T00:00:00Z"
            - "GET /catalog/catalog-entries/${entry_a_id} reports status == ADDED after the successful renewal, the same value it held before the failed one"

  - rule_id: compensating_invariant
    instances:

      # ---------------------------------------------------------------- 1 of 2
      - name: revoke_restore_conserves_the_entitlement_census
        grounds:
          - endpoints.POST_/catalog/entitlements/{entitlement_id}/revoke
          - endpoints.POST_/catalog/entitlements/{entitlement_id}/restore
          - state_machines.Entitlement.ACTIVE_to_REVOKED
          - entities.CatalogEntry.fields.subscriber_impact_count
        distinguishing_aspect: |
          A conserved census rather than a currency: an operator revoke followed by its
          compensating restore returns the named quantity
          ACTIVE(entitlements of the subscription) to its pre-revoke value and leaves the
          row-plus-status census unchanged, so no entitlement is orphaned by the pair.
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. NA region, PREMIUM tier, publisher, title, HYBRID deal LIVE, one Subscriber with a paid MONTHLY PREMIUM subscription, and two published entries — one CATALOG_ADD and one BACK_CATALOG."
            - "Both entitlements resolve ACTIVE, so ACTIVE(entitlements of the subscription) is 2."
          setup_api_calls:
            - *c_may
            - *r_na
            - *t_prem
            - *t_ess
            - *p_nova
            - *ti_crimson
            - *d_hybrid
            - *sign_deal
            - *c_jun
            - call: "POST /catalog/subscribers"
              payload: { email: "census@example.com", display_name: "Census Case", home_region_code: "NA", wallet_credit_cents: 0 }
              as: Anonymous
              captures: { subr_census_id: $.data.id }
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_census_id}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { sub_census_id: $.data.id }
            - call: "POST /catalog/subscriptions/${sub_census_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_census_id}"
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-10-31T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 6000, popularity_index_cents_30d_avg: 3000 }
              as: CatalogAdmin
              captures: { entry_add_id: $.data.id }
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-09-30T00:00:00Z", release_class: "BACK_CATALOG", popularity_index_cents: 4000, popularity_index_cents_30d_avg: 4000 }
              as: CatalogAdmin
              captures: { entry_back_id: $.data.id }
            - call: "POST /catalog/catalog-entries/${entry_add_id}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "POST /catalog/catalog-entries/${entry_back_id}/publish"
              payload: {}
              as: CatalogAdmin
            - call: "GET /catalog/entitlements"
              payload: { subscription_id: "${sub_census_id}", entry_id: "${entry_add_id}", limit: 10, offset: 0 }
              as: CatalogAdmin
              captures: { ent_add_id: "$.data[0].id" }
            - call: "GET /catalog/entitlements"
              payload: { subscription_id: "${sub_census_id}", limit: 10, offset: 0 }
              as: CatalogAdmin
          trigger:
            - call: "POST /catalog/entitlements/${ent_add_id}/revoke"
              payload: {}
              as: CatalogAdmin
              captures: { ent_state_revoked: $.data.status }
            - call: "GET /catalog/catalog-entries/${entry_add_id}"
              payload: {}
              as: CatalogAdmin
              captures: { impact_after_revoke: $.data.subscriber_impact_count }
            - call: "POST /catalog/entitlements/${ent_add_id}/restore"
              payload: {}
              as: CatalogAdmin
              captures: { ent_state_restored: $.data.status }
            - call: "GET /catalog/catalog-entries/${entry_add_id}"
              payload: {}
              as: CatalogAdmin
              captures: { impact_after_restore: $.data.subscriber_impact_count }
            - call: "GET /catalog/entitlements"
              payload: { subscription_id: "${sub_census_id}", limit: 10, offset: 0 }
              as: CatalogAdmin
          assert:
            - "ent_state_revoked == REVOKED and impact_after_revoke == 0"
            - "ent_state_restored == ACTIVE and impact_after_restore == 1 — the census term is back to its pre-revoke value"
            - "GET /catalog/entitlements?subscription_id=${sub_census_id} still returns exactly 2 rows after the revoke-and-restore pair, so the pair created and deleted nothing"
            - "ACTIVE(entitlements of ${sub_census_id}) == 2 after the restore, equal to its value before the revoke"
            - "the second entitlement naming the BACK_CATALOG entry was never touched by either call and still reports status == ACTIVE"

      # ---------------------------------------------------------------- 2 of 2
      - name: purchase_and_reversal_conserve_subscriber_currency
        grounds:
          - calculations.member_purchase_discount
          - endpoints.POST_/catalog/purchases
          - endpoints.POST_/catalog/purchases/{purchase_id}/reverse
          - entities.Subscriber.fields.wallet_credit_cents
        distinguishing_aspect: |
          A conserved currency rather than a status census: the named quantity
          wallet_credit_cents + sum(wallet_applied_cents over COMPLETED purchases) is
          identical before the purchase, after the purchase and after the compensating
          reversal, and the reversed purchase leaves the unit-sales accumulator too.
        test_recipe:
          setup:
            - "Logical clock 2026-06-02T00:00:00Z. NA region at multiplier 1.20, PREMIUM tier, publisher, day-one-eligible title (list 7000.00), HYBRID deal LIVE, one published CATALOG_ADD entry."
            - "One Subscriber seeded with wallet_credit_cents 1000, with a paid PREMIUM subscription."
          setup_api_calls:
            - *c_may
            - *r_na
            - *t_prem
            - *t_ess
            - *p_nova
            - *ti_crimson
            - *d_hybrid
            - *sign_deal
            - *c_jun
            - call: "POST /catalog/subscribers"
              payload: { email: "wallet@example.com", display_name: "Wallet Case", home_region_code: "NA", wallet_credit_cents: 1000 }
              as: Anonymous
              captures: { subr_wallet_id: $.data.id, wallet_seed: $.data.wallet_credit_cents }
            - call: "POST /catalog/subscriptions"
              payload: { subscriber_id: "${subr_wallet_id}", tier_code: "PREMIUM", billing_period: "MONTHLY" }
              as: CatalogAdmin
              captures: { sub_wallet_id: $.data.id }
            - call: "POST /catalog/subscriptions/${sub_wallet_id}/pay"
              payload: {}
              as: Subscriber
              as_user_id: "${subr_wallet_id}"
            - call: "POST /catalog/catalog-entries"
              payload: { title_id: "${title_id}", region_code: "NA", tiers: ["PREMIUM"], announced_add_date: "2026-06-02T00:00:00Z", removal_date: "2026-12-31T00:00:00Z", release_class: "CATALOG_ADD", popularity_index_cents: 6000, popularity_index_cents_30d_avg: 3000 }
              as: CatalogAdmin
              captures: { entry_id: $.data.id }
            - call: "POST /catalog/catalog-entries/${entry_id}/publish"
              payload: {}
              as: CatalogAdmin
          trigger:
            - call: "POST /catalog/purchases"
              payload: { subscriber_id: "${subr_wallet_id}", title_id: "${title_id}", entry_id: "${entry_id}", region_code: "NA", quantity: 1 }
              as: Subscriber
              as_user_id: "${subr_wallet_id}"
              captures: { purchase_id: $.data.id, wallet_applied: $.data.wallet_applied_cents, charged: $.data.total_charged_cents }
            - call: "GET /catalog/subscribers"
              payload: { home_region_code: "NA", limit: 10, offset: 0 }
              as: CatalogAdmin
            - call: "POST /catalog/purchases/${purchase_id}/reverse"
              payload: {}
              as: CatalogAdmin
              captures: { reversed_status: $.data.status, restored_wallet: $.data.wallet_restored_cents }
          assert:
            - "wallet_seed == 1000 and the purchase reports wallet_applied == 1000 with charged == 7400.00 (8400.00 list less the 1000.00 wallet offset)"
            - "after the purchase the subscriber's wallet_credit_cents == 0, so wallet_credit_cents + wallet_applied(COMPLETED) == 1000, unchanged from the seed"
            - "the reversal returns reversed_status == REFUNDED with restored_wallet == 1000 and the subscriber's wallet_credit_cents back to 1000, so the named quantity is still 1000"
            - "GET /catalog/purchases?subscriber_id=${subr_wallet_id} returns 1 row whose status == REFUNDED, so the row was retained rather than deleted"
            - "the REFUNDED row is excluded from the chronological cannibalization accumulator, so a later finalize sees the pre-purchase accumulator value"
            - "POST /catalog/purchases/${purchase_id}/reverse repeated returns 409 ERR_PURCHASE_ALREADY_REVERSED, so the compensation cannot be applied twice"