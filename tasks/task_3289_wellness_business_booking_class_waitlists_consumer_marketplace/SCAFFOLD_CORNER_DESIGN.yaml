          assert:
            - "the first cancel lands 11 hours before its session start, inside the window: Booking.${bk_late_id}.status == LATE_CANCELLED and booking_fee_cents == 3360, the full list price"
            - "the second cancel lands 59 hours before its session start, outside the window: Booking.${bk_free_id}.status == CANCELLED and booking_fee_cents == 0 with fee_status NONE"
            - "Client.${maya_id}.late_cancel_count == 1 and Client.${maya_id}.outstanding_fee_cents == 3360"
            - "Client.${bea_id}.late_cancel_count == 0 and outstanding_fee_cents == 0"

      - name: no_show_fee_strike_multiplier_is_capped_at_twice_list_price
        claim_type: Constants Applied
        grounds:
          - calculations.no_show_fee
          - calculations.no_show_fee.constants.STRIKE_MULTIPLIER_CAP
          - calculations.no_show_fee.constants.FIRST_OFFENCE_FREE_STRIKES
          - state_machines.Booking.RESERVED_to_NO_SHOW
        distinguishing_aspect: "The variable term is min(2, strikes − 1), so the fee steps from free at 1 strike, to 1.5x at 2 strikes, and then sticks at 2.0x for every later strike because the multiplier is capped."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with a June payroll period, a 4000-cent template, an instructor, three capacity-2 sessions and three clients seeded at 1, 2 and 4 strikes."
          setup_api_calls:
            - *e_tier_growth
            - *e_clock_jun
            - *e_studio
            - *e_pp_june
            - *e_tpl_flow
            - *e_staff_ivy
            - *e_sess
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-B", start_at: "2026-06-21T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_b_id: $.data.id }
            - call: "POST /wellness/class-sessions"
              payload: { studio_id: "${studio_id}", class_template_id: "${tpl_id}", instructor_staff_id: "${ivy_id}", room_code: "ROOM-C", start_at: "2026-06-22T17:00:00Z", capacity: 2, expected_subscription_version: "${sub_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { sess_c_id: $.data.id }
            - *e_client_maya
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Bea Tan", email: "bea@example.com", home_state_code: "CA" }
              as: Client
              captures: { bea_id: $.data.id }
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Cleo Ruiz", email: "cleo@example.com", home_state_code: "CA" }
              as: Client
              captures: { cleo_id: $.data.id }
            - call: "POST /_inject/client-history"
              payload: { client_id: "${maya_id}", no_show_strike_count: 1, late_cancel_count: 0 }
              as: OperatorOnly
            - call: "POST /_inject/client-history"
              payload: { client_id: "${bea_id}", no_show_strike_count: 2, late_cancel_count: 0 }
              as: OperatorOnly
            - call: "POST /_inject/client-history"
              payload: { client_id: "${cleo_id}", no_show_strike_count: 4, late_cancel_count: 0 }
              as: OperatorOnly
            - call: "POST /wellness/bookings"
              payload: { client_id: "${maya_id}", class_session_id: "${sess_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${maya_id}"
              captures: { bk_m_id: $.data.id }
            - call: "POST /wellness/bookings"
              payload: { client_id: "${bea_id}", class_session_id: "${sess_b_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${bea_id}"
              captures: { bk_b_id: $.data.id }
            - call: "POST /wellness/bookings"
              payload: { client_id: "${cleo_id}", class_session_id: "${sess_c_id}", channel: "STUDIO", payment_source: "DROP_IN" }
              as: Client
              as_user_id: "${cleo_id}"
              captures: { bk_c_id: $.data.id }
          trigger:
            - call: "POST /wellness/class-sessions/${sess_id}/complete"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wellness/class-sessions/${sess_b_id}/complete"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wellness/class-sessions/${sess_c_id}/complete"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Booking.${bk_m_id}.status == NO_SHOW with booking_fee_cents == 0 and fee_status NONE, because one prior strike is the free first offence"
            - "Booking.${bk_b_id}.status == NO_SHOW with booking_fee_cents == 5040, which is the 3360 list price at the 1.5x strike multiplier"
            - "Booking.${bk_c_id}.status == NO_SHOW with booking_fee_cents == 6720, which is the 3360 list price at the capped 2.0x multiplier rather than the uncapped 3.0x"
            - "Client.${cleo_id}.no_show_strike_count == 5 and Client.${cleo_id}.outstanding_fee_cents == 6720"

      - name: pack_expiry_returns_a_quarter_of_the_unused_credits_to_the_studio
        claim_type: Precision
        grounds:
          - calculations.pack_credit_expiry
          - calculations.pack_credit_expiry.constants.UNUSED_CREDIT_RETURN_DENOMINATOR
          - calculations.pack_credit_expiry.constants.PACK_EXPIRY_GRACE_DAYS
          - errors.ERR_PACK_EXTENSION_CAP_EXCEEDED
        distinguishing_aspect: "The sweep divides and floors, so a pack expiring with 6 credits returns exactly 1 credit to the studio, and the 14-day grace window afterwards is a separate clock boundary — the two operations are testable independently."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with two clients holding packs: one with 6 credits expiring on 2026-06-30T00:00:00Z, and one on a promotional pack of 8 credits."
          setup_api_calls:
            - *e_tier_growth
            - *e_clock_jun
            - *e_studio
            - &cx_maya1
              call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Maya Alvarez", email: "maya@example.com", home_state_code: "CA" }
              as: Client
              captures: { maya_id: $.data.id, maya_v: $.data.version }
            - call: "POST /wellness/clients"
              payload: { home_studio_id: "${studio_id}", display_name: "Bea Tan", email: "bea@example.com", home_state_code: "CA" }
              as: Client
              captures: { bea_id: $.data.id, bea_v: $.data.version }
            - call: "POST /wellness/class-packs"
              payload: { studio_id: "${studio_id}", client_id: "${bea_id}", pack_size: 6, purchased_at: "2026-01-01T00:00:00Z", expiry_scheme: "NONE", expected_client_version: "${bea_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pack_bea_id: $.data.id, bea_v2: $.data.version }
            - call: "POST /wellness/class-packs"
              payload: { studio_id: "${studio_id}", client_id: "${maya_id}", pack_size: 8, purchased_at: "2026-06-01T00:00:00Z", expiry_scheme: "PROMOTIONAL", expected_client_version: "${maya_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { pack_maya_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-15T00:00:00Z" }
              as: OperatorOnly
            - call: "POST /wellness/class-packs/${pack_bea_id}/sweep-expiry"
              payload: { advance_clock_days: 0 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { credits_returned: $.data.credits_returned_to_studio, expired_count: $.data.expired_count }
            - call: "POST /wellness/class-packs/${pack_maya_id}/sweep-expiry"
              payload: { advance_clock_days: 0 }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { credits_returned_m: $.data.credits_returned_to_studio }
          assert:
            - "the June-30 pack is swept with credits_returned_to_studio == 1, which is floor(6 / 4)"
            - "the promotional pack swept after its 30-day window returns 2, which is floor(8 / 4)"
            - "ClassPack.${pack_bea_id}.status == EXPIRED and pending_expiry_grace_until == 2026-07-14T00:00:00Z, exactly 14 days past its expiry"
            - "a pack extension is refused with ERR_PACK_EXTENSION_CAP_EXCEEDED once extension_days_used would pass 90"

      - name: freezing_a_membership_reports_the_prorated_fee_on_the_row
        claim_type: Input Set Filtering
        grounds:
          - calculations.membership_freeze_proration
          - entities.Membership.fields.prorated_fee_cents
          - errors.ERR_FREEZE_CAP_EXCEEDED
          - state_machines.Membership.ACTIVE_to_FROZEN
          - endpoints.POST_/wellness/memberships/{id}/freeze
        distinguishing_aspect: "The proration only enters the input set for memberships actually transitioning into FROZEN, and the frozen days are counted against the plan's own per-cycle ceiling, so the same freeze request lands differently on a plan capping at 10 days than on one capping at 3."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with one client and two memberships at 9000 cents: one capped at 10 frozen days per cycle, one at 3."
          setup_api_calls:
            - *e_tier_growth
            - *e_clock_jun
            - *e_studio
            - *e_client_maya
            - call: "POST /wellness/memberships"
              payload: { studio_id: "${studio_id}", client_id: "${maya_id}", plan_name: "Unlimited Monthly", monthly_fee_cents: 9000, included_credits_per_cycle: 8, minimum_term_months: 3, freeze_allowed: true, freeze_max_days_per_cycle: 10, billing_anchor_day: 1, auto_renew: true }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { memb_wide_id: $.data.id, memb_wide_v: $.data.version }
            - call: "POST /wellness/memberships"
              payload: { studio_id: "${studio_id}", client_id: "${maya_id}", plan_name: "Light Monthly", monthly_fee_cents: 9000, included_credits_per_cycle: 4, minimum_term_months: 0, freeze_allowed: true, freeze_max_days_per_cycle: 3, billing_anchor_day: 1, auto_renew: true }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { memb_narrow_id: $.data.id, memb_narrow_v: $.data.version }
          trigger:
            - call: "POST /wellness/memberships/${memb_wide_id}/freeze"
              payload: { freeze_days: 12, expected_membership_version: "${memb_wide_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
              captures: { wide_v2: $.data.version }
            - call: "POST /wellness/memberships/${memb_narrow_id}/freeze"
              payload: { freeze_days: 12, expected_membership_version: "${memb_narrow_v}" }
              as: StudioOwner
              as_user_id: "${studio_id}"
          assert:
            - "both memberships move to FROZEN with freeze_resume_at exactly 12 days after the freeze instant"
            - "the wide plan prorates only the first 10 of the 12 days, so Membership.${memb_wide_id}.prorated_fee_cents == 6000: 9000 times (1 − 10/30), floored"
            - "the narrow plan prorates only 3 days, so Membership.${memb_narrow_id}.prorated_fee_cents == 8100: 9000 times (1 − 3/30), floored"
            - "when the elapsed freeze exceeds the planned days by more than the 5-day grace, the excess is dropped before proration and the over-freeze penalty is visible in freeze_days_used"
            - "a freeze pushing freeze_days_used past 60 annual days is refused with ERR_FREEZE_CAP_EXCEEDED and posts no proration"

  # ===========================================================================
  - section: validations
    instances:

      - name: overlapping_client_schedules_are_refused_before_capacity_is_considered
        claim_type: Priority Ordering
        grounds:
          - validations.check_temporal_band
          - validations.check_capacity_band
          - errors.ERR_CLIENT_SCHEDULE_OVERLAP
          - errors.ERR_STUDIO_CAPACITY_EXCEEDED
        distinguishing_aspect: "The hidden overlap is temporal while the visible failure is capacity, and the ordering rule says temporal wins: a client already booked on an overlapping session must be refused for the overlap even when the target session is also full."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with a June payroll period, a 50-minute template, an instructor, two sessions on the same day (17:00 and 17:20 in different rooms) and one client already booked on the first."
          setup_api_calls:
            - &f_tier_growth
              call: "POST /wellness/subscription-tiers"
