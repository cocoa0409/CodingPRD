      - name: transparency_axis_advances_while_the_procurement_axis_stays_budgeted
        claim_type: parallel
        grounds:
          - state_machines.WorkPackage.transparency_status
          - state_machines.WorkPackage.procurement_status
          - endpoints.POST_/work-packages/{id}/transparency
        distinguishing_aspect: |
          One WorkPackage row carries two independent machines. Walking the disclosure axis
          SEALED -> DISCLOSED -> AUDITED (by two different roles) must leave procurement_status
          at BUDGETED and awarded_bid_id null. The axis also forbids skipping: SEALED -> AUDITED
          in one call is rejected even though AUDITED is a legal target from DISCLOSED.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id }
