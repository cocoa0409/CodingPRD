              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { asset_b_id: $.data.id }
            - call: "POST /projects"
              payload: { title: "Expiry Boundaries", client_name: "Distributor Co", client_user_id: "client-user-1", delivery_deadline_utc: "2026-12-31T00:00:00Z" }
