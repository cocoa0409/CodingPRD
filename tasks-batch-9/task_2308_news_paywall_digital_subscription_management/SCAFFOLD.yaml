errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for the endpoint, or an entity_backed role acting on a resource it does not own"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The ComplianceOfficer applying a price change is the same user id that dispatched the notices"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, malformed date/datetime, negative integer, or discount fraction outside [0, 1]"
  - id: ERR_OFFER_PLAN_NOT_FOUND
    http: 404
    condition: "offer_plan_id in the path or body matches no OfferPlan"
  - id: ERR_PAYWALL_RULE_NOT_FOUND
    http: 404
    condition: "PaywallRule id in the path matches no rule"
  - id: ERR_ARTICLE_NOT_FOUND
    http: 404
    condition: "article_id in the path or body matches no Article"
  - id: ERR_READER_NOT_FOUND
    http: 404
    condition: "reader_id in the path or body matches no Reader"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "Subscription id in the path matches no subscription"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "Invoice id in the path matches no invoice"
  - id: ERR_CANCELLATION_REQUEST_NOT_FOUND
    http: 404
    condition: "CancellationRequest id in the path matches no request"
  - id: ERR_SAVE_OFFER_NOT_FOUND
    http: 404
    condition: "SaveOffer id in the path matches no offer"
  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "Hold id in the path matches no hold"
  - id: ERR_GROUP_ACCOUNT_NOT_FOUND
    http: 404
    condition: "GroupAccount id in the path or body matches no group account"
  - id: ERR_SEAT_NOT_FOUND
    http: 404
    condition: "Seat id in the path matches no seat"
  - id: ERR_STALE_OFFER_PLAN_VERSION
    http: 412
    condition: "expected_offer_plan_version does not equal the OfferPlan's current version"
  - id: ERR_STALE_GROUP_ACCOUNT_VERSION
    http: 412
    condition: "expected_group_account_version does not equal the GroupAccount's current version"
  - id: ERR_PLAN_NOT_ACTIVE
    http: 409
    condition: "Target OfferPlan.status is DRAFT when an ACTIVE plan is required"
  - id: ERR_PLAN_ALREADY_ACTIVE
    http: 409
    condition: "Activating a plan whose status is already ACTIVE"
  - id: ERR_PRICE_CHANGE_STATE_INVALID
    http: 409
    condition: "price_change_state is not the state the requested pipeline step requires"
  - id: ERR_SUBSCRIPTION_TERMINAL
    http: 409
    condition: "Subscription lifecycle_status is CANCELLED or CANCELLED_NONPAY"
  - id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http: 409
    condition: "Subscription lifecycle_status is PENDING_ACTIVATION, PAUSED or CANCEL_SCHEDULED where ACTIVE is required"
  - id: ERR_DUNNING_EXHAUSTED
    http: 409
    condition: "dunning_status is FAILED_FINAL, or attempt_no would exceed max_payment_attempts (checked at priority 26, ahead of the invoice-status rule)"
  - id: ERR_INVOICE_NOT_PAYABLE
    http: 409
    condition: "Invoice status is PAID or VOID while the subscription's dunning episode is still open"
  - id: ERR_RETRY_TOO_EARLY
    http: 409
    condition: "A payment attempt is recorded before next_retry_on"
  - id: ERR_CANCELLATION_REQUEST_CLOSED
    http: 409
    condition: "CancellationRequest status is CONFIRMED, COMPLETED, SAVE_OFFER_ACCEPTED or ABANDONED"
  - id: ERR_SAVE_OFFER_ALREADY_DECIDED
    http: 409
    condition: "SaveOffer status is ACCEPTED, DECLINED or EXPIRED"
  - id: ERR_HOLD_NOT_RELEASABLE
    http: 409
    condition: "Hold status is COMPLETED or RELEASED, or its credit has already been swept onto an invoice"
  - id: ERR_SEAT_NOT_INVITED
    http: 409
    condition: "Activating a seat whose status is not INVITED"
  - id: ERR_SEAT_INVITE_EXPIRED
    http: 409
    condition: "Activating a seat after invite_expires_on"
  - id: ERR_PRICE_NOTICE_WINDOW_TOO_SHORT
    http: 422
    condition: "Fewer than PRICE_NOTICE_WINDOW_DAYS (30) days between the clock date and pending_effective_on when notices are dispatched"
  - id: ERR_PRICE_NOTICE_NOT_SENT
    http: 409
    condition: "Applying a price change with notice_sent_on still null"
  - id: ERR_PRICE_CHANGE_NOT_EFFECTIVE_YET
    http: 409
    condition: "Applying a price change before pending_effective_on"
  - id: ERR_STEP_UP_SCHEDULE_INVALID
    http: 422
    condition: "step_up_schedule violates monotonicity or straddles the intro/standard cycle boundaries"
  - id: ERR_SAVE_OFFER_LIMIT_EXCEEDED
    http: 409
    condition: "A second save offer is presented inside the same cancellation flow"
  - id: ERR_SAVE_OFFER_DISCOUNT_CAP
    http: 422
    condition: "discount_pct above SAVE_OFFER_DISCOUNT_CAP_PCT (0.40), duration_cycles outside 1..12, or pause_days outside 7..90"
  - id: ERR_SEAT_DOMAIN_MISMATCH
    http: 422
    condition: "The reader's email domain does not match the group account's allowed_email_domain"
  - id: ERR_GROUP_SUBSCRIPTION_NOT_ACTIVE
    http: 422
    condition: "The group account has no funding Subscription with lifecycle_status ACTIVE and dunning_status != FAILED_FINAL"
  - id: ERR_INTERVENTION_NOT_WARRANTED
    http: 422
    condition: "An INTERVENTION_* event is logged for a reader whose churn_risk_band is LOW or MEDIUM, or whose intervention_count_in_period is already 2"
  - id: ERR_EVENT_TYPE_SYSTEM_ONLY
    http: 422
    condition: "A system-generated event_type (ARTICLE_VIEW_GRANTED, ARTICLE_VIEW_BLOCKED, PRICE_INCREASE_NOTICE) is posted directly"
  - id: ERR_READER_NOT_REGISTERED
    http: 422
    condition: "Opening a subscription for a reader with is_registered false or a null email"
  - id: ERR_ARTICLE_UNPUBLISHED
    http: 422
    condition: "An access decision is requested for an article whose published_at is after the logical clock"
  - id: ERR_PLAN_NOT_PRINT_BUNDLE
    http: 422
    condition: "A VACATION_DELIVERY or DELIVERY_INTERRUPTION hold is requested on a plan that is not PRINT_DIGITAL with at least one print delivery per cycle"
  - id: ERR_PLAN_NOT_INSTITUTIONAL
    http: 422
    condition: "A group account is funded by a plan whose bundle_type is not INSTITUTIONAL_SEAT or whose per_seat_price_cents is 0"
  - id: ERR_HOLD_START_NOT_FUTURE
    http: 422
    condition: "A VACATION_DELIVERY or PAUSE_BILLING hold starts on or before the clock date"
  - id: ERR_HOLD_START_IN_PAST
    http: 422
    condition: "A DELIVERY_INTERRUPTION hold starts before the clock date"
  - id: ERR_HOLD_INTERVAL_INVALID
    http: 422
    condition: "end_date earlier than start_date, or a closed interval longer than 90 days"
  - id: ERR_HOLD_BUFFER_VIOLATION
    http: 409
    condition: "The requested hold interval conflicts with an existing hold under the type's overlap geometry (2-day buffer for reader holds, bare containment for delivery interruptions)"
  - id: ERR_VACATION_DAY_CAP_EXCEEDED
    http: 422
    condition: "vacation_days_used_365 plus the requested closed-interval length exceeds ANNUAL_VACATION_DAY_CAP (28)"
  - id: ERR_PAUSE_LIMIT_EXCEEDED
    http: 409
    condition: "A third PAUSE_BILLING hold is requested within the trailing 365 days"
  - id: ERR_SEAT_INTERVAL_INVALID
    http: 422
    condition: "starts_on before the clock date, or ends_on not strictly after starts_on"
  - id: ERR_SEAT_READER_DUPLICATE
    http: 409
    condition: "The reader already holds an overlapping INVITED or ACTIVE seat on the same group account"
  - id: ERR_SEAT_CAPACITY_EXCEEDED
    http: 409
    condition: "Admitting the candidate seat would push the maximum concurrent seat occupancy above seat_capacity"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 422
    condition: "amount_cents differs from the invoice's total_cents"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "current_utc is earlier than the clock's current value"

roles:
  - name: Reader
    description: "The consumer: browses articles through the paywall, manages their own card, requests vacation holds, and drives their own cancellation flow."
    identity: "entity_backed:Reader"
    exclusive_operations: ["decide a presented save offer", "activate an invited institutional seat"]
    shared_operations: ["request an access decision", "log an engagement event", "update the stored card", "create a hold on their own subscription", "start a cancellation request", "confirm a cancellation", "read their own reader, subscriptions, invoices, holds, cancellation requests, save offers and seats"]
  - name: GroupAdmin
    description: "Institutional administrator of one GroupAccount; manages seat assignment inside the purchased capacity but never touches pricing or billing."
    identity: "entity_backed:GroupAccount"
    exclusive_operations: ["invite a reader to a seat", "reclaim a seat"]
    shared_operations: ["read the group account, its seats, its readers and its funding subscription"]
  - name: SubscriptionOpsAgent
    description: "Consumer-revenue operations: creates readers, opens subscriptions, records processor results, presents save offers, releases holds, and runs the nightly batch."
    identity: opaque
    exclusive_operations: ["create a reader", "open a subscription", "create a group account", "record a payment attempt", "present a save offer", "release a hold", "run a billing run"]
    shared_operations: ["request an access decision", "log an engagement event", "update a reader's card", "create a hold", "start a cancellation request", "set the logical clock", "read every entity"]
  - name: RevenueManager
    description: "Owns the commercial surface: authors offer plans, activates them, schedules price increases, and configures dynamic paywall rules and article access classes."
    identity: opaque
    exclusive_operations: ["author an offer plan", "activate an offer plan", "schedule a price change", "create a paywall rule", "publish an article"]
    shared_operations: ["set the logical clock", "read offer plans, paywall rules, subscriptions, reader events and group accounts"]
  - name: ComplianceOfficer
    description: "Guards the regulated pipelines: dispatches price-increase notices, applies noticed increases (never the same officer who noticed them), and can confirm a cancellation on a reader's behalf."
    identity: opaque
    exclusive_operations: ["dispatch price-increase notices", "apply a noticed price change"]
    shared_operations: ["confirm a cancellation", "set the logical clock", "read offer plans, subscriptions, invoices, payment attempts, cancellation requests and save offers"]
