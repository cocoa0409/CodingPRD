# ---------------------------------------------------------------------------
# §1.9 Scaffold Corner Design (Claim Coverage Index)
# Resort Spa Operations & Treatment Scheduling.
# Nine sections walked against §1.1-§1.7 per the claim-extraction guide.
# Corners that §1.8 already pins down carry `excluded_because:` and no recipe.
# Every one of the 47 error ids in §1.6 is triggered by at least one instance
# here or in §1.8 (see the errors section for the residual map).
# ---------------------------------------------------------------------------
scaffold_corner_design:
- section: entities
  instances:
  - name: treatment_type_defaults_and_system_fields
    claim_type: Defaults
    grounds:
    - entities.TreatmentType.fields.contraindication_codes
    - entities.TreatmentType.fields.high_demand
    - endpoints.POST_/treatment-types
    distinguishing_aspect: Omitting contraindication_codes and high_demand must yield [] and false, and every common field must be server-minted at the default clock instant — an implementation that requires those inputs, or that accepts a client-supplied id/version, fails.
    test_recipe:
      setup:
      - an empty system at the default logical clock
      setup_api_calls: []
      trigger:
      - call: POST /treatment-types
        payload:
          code: DRY60
          name: Swedish Dry 60
          duration_minutes: 60
          room_class_required: DRY
          required_skill_code: SWEDISH
          required_scope_level: BASIC
          base_price_cents: 18000
          retail_product_line: MARINE
          required_consent_version: '2026.1'
        as: SpaDirector
        captures:
          tt_id: $.data.id
          tt_v: $.data.version
      assert:
      - returns 201 with contraindication_codes == [] and high_demand == false (both omitted, both defaulted)
      - id is a non-empty server-generated string, created_at == updated_at == 2026-08-01T00:00:00.000Z (the default clock) and version == 1
      - 'the caller cannot set id, created_at, updated_at or version: they are source: system'
  - name: treatment_room_required_fields_enums_and_code_uniqueness
    claim_type: Required Fields
    grounds:
    - entities.TreatmentRoom.fields.room_class
    - entities.TreatmentRoom.fields.hourly_fixed_cost_cents
    - validations[priority=3]
    - validations[priority=6]
    - endpoints.POST_/treatment-rooms
    distinguishing_aspect: 'Separates the three refusal reasons on one collection: a missing no-default field and an out-of-enum room_class are 422s at priority 3, while a duplicate code is a 409 at priority 6 — an implementation that returns 409 for the shape errors or 422 for the duplicate fails.'
    test_recipe:
      setup:
      - one existing TreatmentRoom with code HYDRO-1
      setup_api_calls:
      - call: POST /treatment-rooms
        payload:
          code: HYDRO-1
          room_class: HYDRO
          capacity_guests: 1
          turnover_buffer_minutes: 30
          hourly_fixed_cost_cents: 4000
        as: SpaDirector
        captures:
          room_id: $.data.id
      trigger:
      - call: POST /treatment-rooms
        payload:
          code: DRY-1
          room_class: DRY
          capacity_guests: 1
          turnover_buffer_minutes: 15
        as: SpaDirector
        captures:
          err_missing_cost: $.data.error_id
      - call: POST /treatment-rooms
        payload:
          code: DRY-2
          room_class: SAUNA
          capacity_guests: 1
          turnover_buffer_minutes: 15
          hourly_fixed_cost_cents: 2500
        as: SpaDirector
        captures:
          err_bad_enum: $.data.error_id
      - call: POST /treatment-rooms
        payload:
          code: HYDRO-1
          room_class: HYDRO
          capacity_guests: 2
          turnover_buffer_minutes: 30
          hourly_fixed_cost_cents: 4000
        as: SpaDirector
        captures:
          err_dup: $.data.error_id
      assert:
      - 'the first trigger returns 422 ERR_INVALID_REQUEST: hourly_fixed_cost_cents is required and has no default'
      - 'the second trigger returns 422 ERR_INVALID_REQUEST: SAUNA is outside the DRY | WET | HYDRO | COUPLES enum'
      - 'the third trigger returns 409 ERR_DUPLICATE_CODE (priority 6): code is unique across the collection, and shape validation at priority 3 passes first'
      - only one TreatmentRoom exists after the three triggers and GET /treatment-rooms/${room_id} still reports capacity_guests == 1
  - name: not_found_on_every_path_addressed_collection
    claim_type: Not Found
    grounds:
    - validations[priority=4]
    - errors.ERR_ROOM_NOT_FOUND
    - errors.ERR_THERAPIST_NOT_FOUND
    - errors.ERR_LICENSE_NOT_FOUND
    - errors.ERR_CERTIFICATION_NOT_FOUND
    - errors.ERR_GUEST_NOT_FOUND
    - errors.ERR_INTAKE_FORM_NOT_FOUND
    - errors.ERR_APPOINTMENT_NOT_FOUND
    - errors.ERR_RETAIL_ATTACHMENT_NOT_FOUND
    distinguishing_aspect: Eight path-addressed collections must each raise their OWN 404 error id from priority 4, before any body or business rule runs — an implementation with one shared ERR_NOT_FOUND, or one that validates the revoke/resolve body first, fails.
    test_recipe:
      setup:
      - an empty system; every id below is the well-formed but unknown value 00000000-0000-0000-0000-000000000000
      setup_api_calls: []
      trigger:
      - call: GET /treatment-rooms/00000000-0000-0000-0000-000000000000
        payload: {}
        as: SpaDirector
      - call: GET /therapists/00000000-0000-0000-0000-000000000000
        payload: {}
        as: SpaDirector
      - call: GET /therapist-licenses/00000000-0000-0000-0000-000000000000
        payload: {}
        as: ComplianceOfficer
      - call: POST /certifications/00000000-0000-0000-0000-000000000000/revoke
        payload:
          reason_note: n/a
        as: ComplianceOfficer
      - call: GET /guests/00000000-0000-0000-0000-000000000000
        payload: {}
        as: SpaCoordinator
      - call: GET /intake-forms/00000000-0000-0000-0000-000000000000
        payload: {}
        as: SpaCoordinator
      - call: GET /appointments/00000000-0000-0000-0000-000000000000
        payload: {}
        as: SpaCoordinator
      - call: POST /retail-attachments/00000000-0000-0000-0000-000000000000/resolve
        payload:
          outcome: DECLINED
        as: SpaCoordinator
      assert:
      - the eight triggers return 404 with error_id ERR_ROOM_NOT_FOUND, ERR_THERAPIST_NOT_FOUND, ERR_LICENSE_NOT_FOUND, ERR_CERTIFICATION_NOT_FOUND, ERR_GUEST_NOT_FOUND, ERR_INTAKE_FORM_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND and ERR_RETAIL_ATTACHMENT_NOT_FOUND respectively
      - each 404 body is the error envelope { error_id, message } under data, never a 500 and never an empty 200
      - 'path existence (priority 4) is evaluated before any body-shape or business rule: the revoke and resolve calls carry legal bodies and still 404'
  - name: nested_path_existence_resolves_left_to_right
    claim_type: Parent Relationships
    grounds:
    - validations[priority=4]
    - entities.TherapistLicense.fields.therapist_id
    - entities.IntakeForm.fields.guest_id
    - endpoints.POST_/therapists/{id}/licenses
    - endpoints.GET_/guests/{id}/intake-forms
    distinguishing_aspect: The parent segment is resolved before the child body is judged (404 beats 422), and a valid parent with zero children is an empty 200 rather than a 404 — an implementation that 404s an empty child list, or 422s the unknown parent, fails.
    test_recipe:
      setup:
      - one ACTIVE Therapist and one Guest exist
      setup_api_calls:
      - call: POST /therapists
        payload:
          full_name: Leilani Akana
          employment_type: EMPLOYEE
          commission_tier: SENIOR
          base_hourly_cost_cents: 5200
          practice_state_code: HI
        as: SpaDirector
        captures:
          th_id: $.data.id
      - call: POST /guests
        payload:
          full_name: Nia Kalani
          resort_room_number: '1204'
          loyalty_tier: PLATINUM
          folio_limit_cents: 500000
        as: SpaCoordinator
        captures:
          guest_id: $.data.id
          g_v: $.data.version
      trigger:
      - call: POST /therapists/00000000-0000-0000-0000-000000000000/licenses
        payload:
          license_number: HI-LMT-0001
          license_type: LMT
          state_code: HI
          issued_on: '2024-01-01'
          expires_on: '2026-12-31'
          current_period_start_on: '2024-01-01'
        as: ComplianceOfficer
        as_user_id: co-1
      - call: POST /therapists/${th_id}/licenses
        payload:
          license_number: HI-LMT-0001
          license_type: LMT
          state_code: CA
          issued_on: '2024-01-01'
          expires_on: '2026-12-31'
          current_period_start_on: '2024-01-01'
        as: ComplianceOfficer
        as_user_id: co-1
      - call: GET /guests/${guest_id}/intake-forms
        payload:
          limit: 10
          offset: 0
        as: SpaCoordinator
      assert:
      - the first trigger returns 404 ERR_THERAPIST_NOT_FOUND — the parent segment is resolved before the child is created, and ce_hours_required defaults to 0 when omitted
      - the second trigger returns 422 ERR_INVALID_REQUEST because state_code CA does not equal the therapist's practice_state_code HI (a creation precondition of the NEW -> PENDING_REVIEW transition)
      - the third trigger returns 200 with an empty data array, total_count == 0 and has_more == false — a valid parent with no children is not a 404
      - no TherapistLicense row exists after the triggers
  - name: immutable_entities_have_no_version_and_no_update_endpoint
    claim_type: Immutability
    grounds:
    - entities.ContinuingEducationRecord
    - entities.FolioCharge
    - endpoints.POST_/therapist-licenses/{id}/ce-records
    - endpoints.GET_/therapist-licenses/{id}/ce-records
    distinguishing_aspect: 'ContinuingEducationRecord carries only id and created_at: an implementation that adds version/updated_at, exposes a mutation route, or trusts a body-supplied recorded_by_user_id instead of the X-User-ID header, fails.'
    test_recipe:
      setup:
      - one ACTIVE Therapist with one PENDING_REVIEW licence
      setup_api_calls:
      - call: POST /therapists
        payload:
          full_name: Kai Mahelona
          employment_type: EMPLOYEE
          commission_tier: MASTER
          base_hourly_cost_cents: 6000
          practice_state_code: HI
        as: SpaDirector
        captures:
          th_id: $.data.id
      - call: POST /therapists/${th_id}/licenses
        payload:
          license_number: HI-LMT-9002
          license_type: LMT
          state_code: HI
          issued_on: '2022-01-01'
          expires_on: '2027-06-30'
          current_period_start_on: '2024-01-01'
          ce_hours_required: 12
        as: ComplianceOfficer
        as_user_id: co-1
        captures:
          lic_id: $.data.id
      trigger:
      - call: POST /therapist-licenses/${lic_id}/ce-records
        payload:
          course_code: ETH-201
          category: ETHICS
          ce_hours: 3.0
          completed_on: '2024-03-15'
        as: ComplianceOfficer
        as_user_id: co-1
        captures:
          ce_id: $.data.id
      - call: GET /therapist-licenses/${lic_id}/ce-records
        payload:
          category: ETHICS
        as: ComplianceOfficer
        as_user_id: co-1
      assert:
      - 'the created ContinuingEducationRecord ${ce_id} has id and created_at but NO version and NO updated_at field (common_fields: false)'
      - recorded_by_user_id == co-1 and is server-derived from the X-User-ID header, not from the body
      - '§1.5 exposes no PATCH, PUT or DELETE for /ce-records or /folio-charges: the only way to change the CE picture is to add another record'
      - the filtered list returns exactly 1 row and echoes limit 10 / offset 0 defaults with total_count == 1
      - FolioCharge is immutable on the same terms — the REVERSAL row in the compensating-invariant flow is a new row, never an edit
  - name: computed_guest_pointer_and_screened_codes_are_server_owned
    claim_type: Computed Fields
    grounds:
    - entities.Guest.fields.authoritative_intake_form_id
    - entities.Guest.fields.screened_condition_codes
    - entities.IntakeForm.fields.flagged_condition_codes
    - endpoints.POST_/intake-forms/{id}/screen
    - endpoints.GET_/guests/{id}
    distinguishing_aspect: Screening writes three derived places at once (form.flagged_condition_codes, guest.authoritative_intake_form_id, guest.screened_condition_codes) and flags only registry members — an implementation that flags LATEX_SENSITIVITY, or copies only the flagged subset into screened_condition_codes, fails.
    test_recipe:
      setup:
      - one Guest with a DRAFT intake form declaring two condition codes, one of which is a HIGH_RISK_CONDITION_CODES member
      setup_api_calls:
      - call: POST /guests
        payload:
          full_name: Nia Kalani
          resort_room_number: '1204'
          loyalty_tier: GOLD
          folio_limit_cents: 500000
        as: SpaCoordinator
        captures:
          guest_id: $.data.id
          g_v: $.data.version
      - call: POST /guests/${guest_id}/intake-forms
        payload:
          expected_guest_version: ${g_v}
          condition_codes:
          - ACTIVE_INFECTION
          - LATEX_SENSITIVITY
          medications:
          - AMOXICILLIN
        as: Guest
        as_user_id: ${guest_id}
        captures:
          intake_id: $.data.id
      - call: POST /intake-forms/${intake_id}/submit
        payload: {}
        as: Guest
        as_user_id: ${guest_id}
      trigger:
      - call: POST /intake-forms/${intake_id}/screen
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-3
      - call: GET /guests/${guest_id}
        payload: {}
        as: SpaCoordinator
        captures:
          g_v2: $.data.version
      assert:
      - immediately after creation Guest.${guest_id}.authoritative_intake_form_id == null and screened_condition_codes == []
      - the screen trigger returns 200 with status == SCREENED_FLAGGED and flagged_condition_codes == ["ACTIVE_INFECTION"] — LATEX_SENSITIVITY is recorded but is not a registry member, so it never flags
      - the GET shows authoritative_intake_form_id == ${intake_id} and screened_condition_codes == ["ACTIVE_INFECTION", "LATEX_SENSITIVITY"] (the full declared set, not just the flagged subset)
      - '${g_v2} is exactly one greater than the version observed before screening: screening increments Guest.version by 1'
      - 'neither computed field can be supplied on POST /guests: they are absent from that endpoint''s input list'
  - name: body_foreign_keys_validated_in_declared_field_order
    claim_type: Type Constraints
    grounds:
    - validations[priority=5]
    - errors.ERR_TREATMENT_TYPE_NOT_FOUND
    - complexity_profile.entity_topology
    - endpoints.POST_/appointments
    distinguishing_aspect: With three unresolvable body ids at once the response is pinned to the declared field order, so treatment_type_id wins over room_id and therapist_id — an implementation that checks ids in schema/alphabetical order, or aggregates them into one error, fails.
    test_recipe:
      setup:
      - one Guest, one TreatmentRoom and one Therapist exist; no TreatmentType exists yet
      setup_api_calls:
      - call: POST /treatment-rooms
        payload:
          code: HYDRO-1
          room_class: HYDRO
          capacity_guests: 1
          turnover_buffer_minutes: 30
          hourly_fixed_cost_cents: 4000
        as: SpaDirector
        captures:
          room_id: $.data.id
      - call: POST /therapists
        payload:
          full_name: Leilani Akana
          employment_type: EMPLOYEE
          commission_tier: SENIOR
          base_hourly_cost_cents: 5200
          practice_state_code: HI
        as: SpaDirector
        captures:
          th_id: $.data.id
      - call: POST /guests
        payload:
          full_name: Nia Kalani
          resort_room_number: '1204'
          loyalty_tier: PLATINUM
          folio_limit_cents: 500000
        as: SpaCoordinator
        captures:
          guest_id: $.data.id
      trigger:
      - call: POST /appointments
        payload:
          guest_id: 00000000-0000-0000-0000-000000000000
          treatment_type_id: 00000000-0000-0000-0000-000000000000
          room_id: 00000000-0000-0000-0000-000000000000
          therapist_id: 00000000-0000-0000-0000-000000000000
          start_at: '2026-08-10T17:00:00.000Z'
        as: SpaCoordinator
      - call: POST /appointments
        payload:
          guest_id: ${guest_id}
          treatment_type_id: 00000000-0000-0000-0000-000000000000
          room_id: ${room_id}
          therapist_id: ${th_id}
          start_at: '2026-08-10T17:00:00.000Z'
        as: SpaCoordinator
      - call: POST /appointments
        payload:
          guest_id: ${guest_id}
          treatment_type_id: 00000000-0000-0000-0000-000000000000
          room_id: 00000000-0000-0000-0000-000000000000
          therapist_id: 00000000-0000-0000-0000-000000000000
          start_at: '2026-08-10T17:00:00.000Z'
        as: SpaCoordinator
      assert:
      - the first trigger returns 404 ERR_GUEST_NOT_FOUND — guest_id is the first body id in the declared order
      - the second trigger returns 404 ERR_TREATMENT_TYPE_NOT_FOUND
      - 'the third trigger returns 404 ERR_TREATMENT_TYPE_NOT_FOUND, not ERR_ROOM_NOT_FOUND and not ERR_THERAPIST_NOT_FOUND: with three ids unresolvable the declared order guest_id, treatment_type_id, room_id, therapist_id decides'
      - 'flat topology: these are body-level cross-references, so the failure is a 404 from priority 5 rather than a path 404 from priority 4'
      - no Appointment row is created by any trigger
  - name: shift_block_bounds_and_pagination_envelope
    claim_type: Listing
    grounds:
    - entities.ShiftBlock.fields.start_at
    - entities.ShiftBlock.fields.end_at
    - validations[priority=3]
    - response_envelope.pagination_fields
    - endpoints.GET_/therapists/{id}/shift-blocks
    distinguishing_aspect: A zero-length block is a 422, and limit/offset/total_count/has_more must be exact across two pages plus an out-of-range limit — an implementation that allows end_at == start_at, silently clamps limit to 100, or computes has_more from the page size, fails.
    test_recipe:
      setup:
      - one ACTIVE Therapist with three published shift blocks
      setup_api_calls:
      - call: POST /therapists
        payload:
          full_name: Leilani Akana
          employment_type: EMPLOYEE
          commission_tier: SENIOR
          base_hourly_cost_cents: 5200
          practice_state_code: HI
        as: SpaDirector
        captures:
          th_id: $.data.id
      - call: POST /therapists/${th_id}/shift-blocks
        payload:
          block_type: AVAILABLE
          start_at: '2026-08-10T08:00:00.000Z'
          end_at: '2026-08-10T22:00:00.000Z'
        as: SpaCoordinator
      - call: POST /therapists/${th_id}/shift-blocks
        payload:
          block_type: BREAK
          start_at: '2026-08-10T12:00:00.000Z'
          end_at: '2026-08-10T13:00:00.000Z'
          note: lunch
        as: SpaCoordinator
      - call: POST /therapists/${th_id}/shift-blocks
        payload:
          block_type: ADMIN
          start_at: '2026-08-11T08:00:00.000Z'
          end_at: '2026-08-11T09:00:00.000Z'
        as: SpaCoordinator
      trigger:
      - call: POST /therapists/${th_id}/shift-blocks
        payload:
          block_type: AVAILABLE
          start_at: '2026-08-12T10:00:00.000Z'
          end_at: '2026-08-12T10:00:00.000Z'
        as: SpaCoordinator
      - call: GET /therapists/${th_id}/shift-blocks
        payload:
          limit: 2
          offset: 0
        as: SpaCoordinator
      - call: GET /therapists/${th_id}/shift-blocks
        payload:
          limit: 2
          offset: 2
        as: SpaCoordinator
      - call: GET /therapists/${th_id}/shift-blocks
        payload:
          limit: 101
          offset: 0
        as: SpaCoordinator
      assert:
      - 'the first trigger returns 422 ERR_INVALID_REQUEST: end_at must be strictly after start_at, so a zero-length block is refused'
      - the second trigger returns 2 rows with limit == 2, offset == 0, total_count == 3 and has_more == true
      - the third trigger returns 1 row with offset == 2, total_count == 3 and has_more == false
      - 'the fourth trigger returns 422 ERR_INVALID_REQUEST: limit must be within 1..100'
      - 'filter and pagination compose: GET /therapists/${th_id}/shift-blocks?block_type=BREAK returns total_count == 1'
- section: state_machines
  instances:
  - name: appointment_initial_states_on_both_dimensions
    claim_type: Initial State
    grounds:
    - state_machines.Appointment.schedule_status
    - state_machines.Appointment.clearance_status
    - entities.Appointment.fields.assignment_mode
    - endpoints.POST_/appointments
    distinguishing_aspect: One create call must set both dimensions' initial states AND five derived fields (duration snapshot, end_at, high_demand_slot, assignment_mode, quote) plus both minute ledgers — an implementation that defaults clearance_status to CLEARED, or defers the ledger increments to confirm, fails.
    test_recipe:
      setup:
      - the canonical HYDRO90 / HYDRO-1 / SENIOR therapist fixture with a SCREENED_CLEAR intake and consent 2026.1
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-03T09:00:00.000Z'
        as: SpaDirector
      - call: POST /treatment-types
        payload:
          code: HYDRO90
          name: Marine Hydrotherapy 90
          duration_minutes: 90
          room_class_required: HYDRO
          required_skill_code: HYDROTHERAPY
          required_scope_level: ADVANCED
          base_price_cents: 30000
          contraindication_codes:
          - ACUTE_HYPERTENSION
          retail_product_line: MARINE
          required_consent_version: '2026.1'
          high_demand: true
        as: SpaDirector
        captures:
          tt_id: $.data.id
      - call: POST /treatment-rooms
        payload:
          code: HYDRO-1
          room_class: HYDRO
          capacity_guests: 1
          turnover_buffer_minutes: 30
          hourly_fixed_cost_cents: 4000
        as: SpaDirector
        captures:
          room_id: $.data.id
      - call: POST /therapists
        payload:
          full_name: Leilani Akana
          employment_type: EMPLOYEE
          commission_tier: SENIOR
          base_hourly_cost_cents: 5200
          practice_state_code: HI
        as: SpaDirector
        captures:
          th_id: $.data.id
      - call: POST /therapists/${th_id}/licenses
        payload:
          license_number: HI-LMT-4410
          license_type: LMT
          state_code: HI
          issued_on: '2024-01-01'
          expires_on: '2026-12-31'
          current_period_start_on: '2024-01-01'
          ce_hours_required: 0
        as: ComplianceOfficer
        as_user_id: co-1
        captures:
          lic_id: $.data.id
      - call: POST /therapist-licenses/${lic_id}/review
        payload:
          decision: VERIFIED
        as: ComplianceOfficer
        as_user_id: co-2
      - call: POST /therapists/${th_id}/certifications
        payload:
          skill_code: HYDROTHERAPY
          scope_level: ADVANCED
          granted_on: '2024-01-01'
          expires_on: '2027-12-31'
        as: ComplianceOfficer
        as_user_id: co-2
      - call: POST /therapists/${th_id}/shift-blocks
        payload:
          block_type: AVAILABLE
          start_at: '2026-08-10T08:00:00.000Z'
          end_at: '2026-08-10T22:00:00.000Z'
        as: SpaCoordinator
      - call: POST /guests
        payload:
          full_name: Nia Kalani
          resort_room_number: '1204'
          loyalty_tier: PLATINUM
          folio_limit_cents: 500000
        as: SpaCoordinator
        captures:
          guest_id: $.data.id
          g_v: $.data.version
      - call: POST /guests/${guest_id}/intake-forms
        payload:
          expected_guest_version: ${g_v}
          condition_codes: []
          medications: []
        as: Guest
        as_user_id: ${guest_id}
        captures:
          intake_id: $.data.id
      - call: POST /intake-forms/${intake_id}/consent
        payload:
          consent_version: '2026.1'
        as: Guest
        as_user_id: ${guest_id}
      - call: POST /intake-forms/${intake_id}/submit
        payload: {}
        as: Guest
        as_user_id: ${guest_id}
      - call: POST /intake-forms/${intake_id}/screen
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-3
      trigger:
      - call: POST /appointments
        payload:
          guest_id: ${guest_id}
          treatment_type_id: ${tt_id}
          room_id: ${room_id}
          therapist_id: ${th_id}
          start_at: '2026-08-10T17:00:00.000Z'
        as: SpaCoordinator
        captures:
          appt_id: $.data.id
