    side_effects: ["roster_lock_active derived from calculations.league_window_state"]
  - method: GET
    path: "/leagues/{id}"
    description: "Read one league, including the derived roster_lock_active flag"
    roles: [LeagueAdmin, GeneralManager, PlayerAgent, FinanceOfficer]
    code: 200
    input: []
    output: League
    side_effects: []
  - method: GET
    path: "/leagues"
    description: "List leagues"
    roles: [LeagueAdmin, GeneralManager, PlayerAgent, FinanceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: League[]
    side_effects: []
  - method: PATCH
    path: "/leagues/{id}"
    description: "Adjust league calendar, caps and association terms"
    roles: [LeagueAdmin]
    code: 200
    input: ["roster_lock_at?", "transfer_window_open_at?", "transfer_window_close_at?", "minimum_salary_cents?", "min_roster_size?", "max_roster_size?", "offer_response_window_hours?", "max_negotiation_rounds?", "minor_max_weekly_minutes?", "adult_max_weekly_minutes?", "education_reserved_minutes?", "association_min_prize_split_bp?", "association_max_streaming_hours_per_week?", "tryout_required_before_offer?"]
    output: League
