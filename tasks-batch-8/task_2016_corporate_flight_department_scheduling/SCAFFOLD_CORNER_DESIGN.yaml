              as_user_id: "disp-1"
            - call: "POST /flight-ops/trip-requests/${trip_id}/approve-personal-use"
              payload: {}
              as: FinanceAdmin
              as_user_id: "fin-1"
            - call: "POST /flight-ops/trip-requests/${trip_id}/dispatch"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-2"
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T14:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/flight-legs/${leg_id}/complete"
              payload: {}
              as: Dispatcher
              as_user_id: "disp-2"
            - call: "GET /flight-ops/trip-requests/${trip_id}"
              as: FinanceAdmin
              captures: { trip_v2: $.data.version }
          trigger:
            - call: "POST /flight-ops/trip-requests/${trip_id}/settle"
              payload: { expected_trip_request_version: "${trip_v2}" }
              as: FinanceAdmin
              as_user_id: "fin-2"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RATE_PERIOD_NOT_FOUND"

  # ===========================================================================
  # Section: roles (RBAC) — exclusive ops and shared ops
  # ===========================================================================
  - section: roles
    instances:
      - name: rbac_dispatcher_cannot_approve_trip
        claim_type: exclusive_operations_denial
        grounds:
          - "roles.Dispatcher"
          - "roles.FlightDeptManager"
          - "endpoints[POST /flight-ops/trip-requests/{id}/approve]"
        distinguishing_aspect: "Dispatcher (not FlightDeptManager) attempts approve → 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Trip in SUBMITTED"]
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-R1", name: "R1", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E8001", full_name: "Pax R1", priority_tier: "TIER_1", home_bu_id: "${bu_id}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax: $.data.id }
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax}", charge_bu_id: "${bu_id}", trip_kind: "BUSINESS", purpose: "X", requested_departure_utc: "2026-08-10T12:00:00Z", requested_return_utc: "2026-08-10T14:00:00Z", passenger_ids: ["${pax}"] }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { trip_id: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KDCA", scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", distance_statute_miles: 200 }
              as: ExecutiveRequester
              as_user_id: "${pax}"
            - call: "POST /flight-ops/trip-requests/${trip_id}/submit"
              payload: {}
              as: ExecutiveRequester
              as_user_id: "${pax}"
          trigger:
            - call: "POST /flight-ops/trip-requests/${trip_id}/approve"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED"

      - name: rbac_executive_cannot_settle
        claim_type: exclusive_operations_denial
        grounds:
          - "roles.ExecutiveRequester"
          - "roles.FinanceAdmin"
          - "endpoints[POST /flight-ops/trip-requests/{id}/settle]"
        distinguishing_aspect: "ExecutiveRequester attempting settle → 403."
        test_recipe:
          setup: ["Trip exists (state irrelevant because auth check fires first)"]
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-R2", name: "R2", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E8002", full_name: "Pax R2", priority_tier: "TIER_1", home_bu_id: "${bu_id}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax: $.data.id }
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax}", charge_bu_id: "${bu_id}", trip_kind: "BUSINESS", purpose: "X", requested_departure_utc: "2026-08-10T12:00:00Z", requested_return_utc: "2026-08-10T14:00:00Z", passenger_ids: ["${pax}"] }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { trip_id: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KDCA", scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", distance_statute_miles: 200 }
              as: ExecutiveRequester
              as_user_id: "${pax}"
            - call: "GET /flight-ops/trip-requests/${trip_id}"
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { trip_v: $.data.version }
          trigger:
            - call: "POST /flight-ops/trip-requests/${trip_id}/settle"
              payload: { expected_trip_request_version: "${trip_v}" }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED"

      - name: rbac_maintenance_planner_cannot_assign_crew
        claim_type: exclusive_operations_denial
        grounds:
          - "roles.MaintenancePlanner"
          - "roles.Dispatcher"
          - "endpoints[POST /flight-ops/flight-legs/{id}/assign-crew]"
        distinguishing_aspect: "MaintenancePlanner attempting assign-crew → 403."
        test_recipe:
          setup: ["Any leg id"]
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
          trigger:
            - call: "POST /flight-ops/flight-legs/00000000-0000-0000-0000-000000000000/assign-crew"
              payload: { pic_crew_id: "x", sic_crew_id: "y" }
              as: MaintenancePlanner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED"

  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds:
          - "complexity_profile.complexity_layers"
          - "concurrency_rules"
        distinguishing_aspect: "TripRequest.version increments by 1 on every mutation (submit, approve, assign, dispatch, settle); verified by reading version between mutations."
        test_recipe:
          setup: ["Fresh trip"]
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-L1", name: "L1", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E9001", full_name: "Pax L1", priority_tier: "TIER_1", home_bu_id: "${bu_id}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax: $.data.id }
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax}", charge_bu_id: "${bu_id}", trip_kind: "BUSINESS", purpose: "X", requested_departure_utc: "2026-08-10T12:00:00Z", requested_return_utc: "2026-08-10T14:00:00Z", passenger_ids: ["${pax}"] }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { trip_id: $.data.id, v0: $.data.version }
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KDCA", scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", distance_statute_miles: 200 }
              as: ExecutiveRequester
              as_user_id: "${pax}"
          trigger:
            - call: "POST /flight-ops/trip-requests/${trip_id}/submit"
              payload: {}
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { v1: $.data.version }
            - call: "POST /flight-ops/trip-requests/${trip_id}/approve"
              payload: {}
              as: FlightDeptManager
              captures: { v2: $.data.version }
          assert:
            - "v0 == 1"
            - "v1 == v0 + 1"
            - "v2 == v1 + 1"

      - name: derived_field_reconciliation_posture_after_maintenance_window_cancel
        claim_type: derived_field_reconciliation
        grounds:
          - "complexity_profile.complexity_layers"
          - "calculations.aircraft_posture_derivation"
        distinguishing_aspect: "Aircraft.posture recomputed after maintenance-window cancel; derived field stays consistent with source data."
        test_recipe:
          setup: ["Aircraft with a planned window covering current clock (posture MAINTENANCE_HOLD); cancel the window"]
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N9001CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
              captures: { ac_id: $.data.id }
            - call: "POST /flight-ops/aircraft/${ac_id}/maintenance-windows"
              payload: { window_start_utc: "2026-07-31T00:00:00Z", window_end_utc: "2026-08-05T00:00:00Z", maintenance_kind: "SCHEDULED_INSPECTION" }
              as: MaintenancePlanner
              captures: { mw_id: $.data.id }
            - call: "GET /flight-ops/aircraft/${ac_id}"
              as: Dispatcher
              captures: { posture_hold: $.data.posture }
          trigger:
            - call: "POST /flight-ops/maintenance-windows/${mw_id}/cancel"
              payload: {}
              as: MaintenancePlanner
            - call: "GET /flight-ops/aircraft/${ac_id}"
              as: Dispatcher
              captures: { posture_avail: $.data.posture }
          assert:
            - "posture_hold == MAINTENANCE_HOLD"
            - "posture_avail == AVAILABLE"

  # ===========================================================================
  # Section: consistency_model — immediate
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_mutation
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "After POST, a subsequent GET in the same test flow returns the new state with no delay."
        test_recipe:
          setup: ["Fresh aircraft created"]
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N9101CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
              captures: { ac_id: $.data.id }
          trigger:
            - call: "POST /flight-ops/aircraft/${ac_id}/ground"
              payload: {}
              as: MaintenancePlanner
            - call: "GET /flight-ops/aircraft/${ac_id}"
              as: Dispatcher
              captures: { status: $.data.status }
          assert:
            - "status == GROUNDED (same-request visibility)"
