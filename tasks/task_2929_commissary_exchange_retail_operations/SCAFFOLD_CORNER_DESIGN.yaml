            - "The delegate patron's version has been re-read immediately before the trigger."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Meade Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-SUP-500", name: "Pasta 2lb", category: "GROCERY_STAPLE", unit_cost_cents: 500 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "H7", facings: 6, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SFC X Lindqvist", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { sponsor_1_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "SFC Y Bertrand", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { sponsor_2_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Z Lindqvist", id_card_class: "DEPENDENT", sponsor_patron_id: "${sponsor_1_id}" }
              as: ComplianceOfficer
              captures: { delegate_id: $.data.id, delegate_v0: $.data.version }
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${sponsor_1_id}", delegate_patron_id: "${delegate_id}", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-09-01T00:00:00Z", per_sale_spend_cap_cents: 30000, expected_delegate_patron_version: "${delegate_v0}" }
              as: ComplianceOfficer
              captures: { delegation_1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: SystemOperator
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${sponsor_1_id}", acting_delegation_id: "${delegation_1_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 1 }
              as: StoreCashier
            - call: "GET /patrons/${delegate_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { delegate_v1: $.data.version }
          trigger:
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${sponsor_2_id}", delegate_patron_id: "${delegate_id}", valid_from: "2026-08-05T00:00:00Z", valid_to: "2026-08-20T00:00:00Z", per_sale_spend_cap_cents: 45000, expected_delegate_patron_version: "${delegate_v1}" }
              as: ComplianceOfficer
              captures: { delegation_2_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ShopperDelegation.${delegation_2_id}.status == ACTIVE and superseded_by_delegation_id == null"
            - "ShopperDelegation.${delegation_1_id}.status == SUPERSEDED"
            - "ShopperDelegation.${delegation_1_id}.superseded_by_delegation_id == ${delegation_2_id}"
            - "Sale.${sale_id}.compliance_state == FLAGGED and tender_state == OPEN"
            - "Patron.${delegate_id}.version is exactly one greater than ${delegate_v1}"

      - name: corner_second_tender_of_tendered_sale_returns_sale_not_open
        claim_type: idempotency
        grounds:
          - state_machines.Sale.OPEN_to_TENDERED
          - errors[ERR_SALE_NOT_OPEN]
          - validations[priority=20]
        distinguishing_aspect: |
          Tender is single-shot: the second call returns 409 ERR_SALE_NOT_OPEN and
          the surcharge fund is NOT credited twice — the ledger keeps exactly one
          SURCHARGE_COLLECTION entry of 25.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, surcharge_rate_bp 500, one product at unit_cost_cents 500 with an ACTIVE assortment."
            - "One TENDERED sale carrying one line of quantity 1 (merchandise 500, surcharge 25)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Jackson Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-IDM-500", name: "Cereal Box", category: "GROCERY_STAPLE", unit_cost_cents: 500 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "I8", facings: 6, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SGT A Boudreaux", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 1 }
              as: StoreCashier
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
              captures: { tendered_version: $.data.version }
          trigger:
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_SALE_NOT_OPEN"
            - "Sale.${sale_id}.tender_state == TENDERED and version == ${tendered_version}"
            - "Store.${store_id}.surcharge_fund_balance_cents == 25"
            - "GET /stores/${store_id}/fund-ledger with fund == SURCHARGE returns total_count == 1"

      - name: corner_project_returned_then_resubmitted_increments_revision_count
        claim_type: cyclic
        grounds:
          - state_machines.CapitalProject.RETURNED_FOR_REVISION_to_SUBMITTED
          - entities.CapitalProject.fields.revision_count
        excluded_because:
          difficulty_instance: combinatorial_formula / capital_project_revision_cycle_increments_revision_count
          rationale: "The RETURN -> re-SUBMIT loop, the revision_count increment and the pinned immutability of requested_amount_cents across the cycle are the whole subject of the named §1.8 instance."

      - name: corner_special_order_route_fork_produces_divergent_side_effect_sets
        claim_type: branching
        grounds:
          - state_machines.SpecialOrder.SUBMITTED_to_LOCAL_FILL_PENDING
          - state_machines.SpecialOrder.SUBMITTED_to_OVERSEAS_SHIP_PENDING
        excluded_because:
          difficulty_instance: non_linear_state_machine / special_order_fork_join_local_fill_vs_overseas_ship
          rationale: "Both fork branches and the shared close-period join into FULFILLED are asserted side by side in the named §1.8 instance."

      - name: corner_sponsor_suspension_cascades_down_to_open_sale_flag
        claim_type: cascade_down
        grounds:
          - state_machines.Patron.VALID_to_SUSPENDED
          - state_machines.ShopperDelegation.ACTIVE_to_SUSPENDED_BY_SPONSOR
          - state_machines.Sale.CLEARED_to_FLAGGED
        excluded_because:
          difficulty_instance: transitive_cascade / sponsor_suspension_cascades_three_hops_to_open_sale_flag
          rationale: "The named §1.8 instance walks all three suspension hops and asserts each intermediate entity, including the non-cascade to an already-SUSPENDED dependent."

      - name: corner_tender_ledger_sync_updates_store_derived_balances
        claim_type: ledger_sync
        grounds:
          - state_machines.Sale.OPEN_to_TENDERED
          - entities.Store.fields.surcharge_fund_balance_cents
        excluded_because:
          difficulty_instance: transitive_cascade / tender_cascades_four_hops_into_awaiting_funds_project_approval
          rationale: "The named §1.8 instance reconciles the ledger against Store.surcharge_fund_balance_cents and fund_posture across all four tender cascade hops."

  # ===========================================================================
  - section: calculations
    instances:
      - name: corner_governing_assortment_selector_prefers_newest_effective_from
        claim_type: correct_result
        grounds:
          - calculations.governing_assortment_selector
          - calculations.line_retail_price
          - entities.Assortment.fields.overseas_shipping_allowance_cents
          - entities.SaleLine.fields.line_shipping_allowance_cents
        distinguishing_aspect: |
          Two ACTIVE allocations of the same (store, product) both cover
          2026-08-10; the ranking is effective_from DESC, so the window opening
          2026-08-05 governs and the line carries its 250-cent-per-unit shipping
          allowance (500 for quantity 2), not the older window's 100 (200).
        test_recipe:
          setup:
            - "One COMMISSARY / OVERSEAS store, surcharge_rate_bp 500, shelf_block_capacity_facings 24."
            - "One GROCERY_STAPLE product at unit_cost_cents 400."
            - "Allocation OLD on shelf_block Q1, facings 4, WAREHOUSE, 2026-08-01 through 2026-08-31, overseas_shipping_allowance_cents 100."
            - "Allocation NEW on shelf_block Q2, facings 4, WAREHOUSE, 2026-08-05 through 2026-08-25, overseas_shipping_allowance_cents 250."
            - "Logical clock at 2026-08-10T00:00:00Z and one empty OPEN sale."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Grafenwoehr Commissary", channel: "COMMISSARY", region: "OVERSEAS", surcharge_rate_bp: 500, shelf_block_capacity_facings: 24 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-SEL-400", name: "Canned Tuna 12pk", category: "GROCERY_STAPLE", unit_cost_cents: 400 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "Q1", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", overseas_shipping_allowance_cents: 100, expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
              captures: { assortment_old_id: $.data.id }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: AssortmentPlanner
              captures: { store_v1: $.data.version }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "Q2", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-05T00:00:00Z", effective_to: "2026-08-25T00:00:00Z", overseas_shipping_allowance_cents: 250, expected_store_version: "${store_v1}" }
              as: AssortmentPlanner
              captures: { assortment_new_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "SSG B Kowalczyk", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: SystemOperator
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 2 }
              as: StoreCashier
              captures: { line_id: $.data.id }
          assert:
            - "SaleLine.${line_id}.unit_price_cents == 400 and extended_cents == 800 and line_markup_cents == 0"
            - "SaleLine.${line_id}.line_surcharge_cents == 40"
            - "SaleLine.${line_id}.line_shipping_allowance_cents == 500 — the NEW window governs, not 200 from the OLD one"
            - "Sale.${sale_id}.subsidized_shipping_cents == 500 and total_due_cents == 840"
            - "Assortment.${assortment_old_id}.status == ACTIVE and Assortment.${assortment_new_id}.status == ACTIVE"

      - name: corner_retired_assortment_is_excluded_from_selector_candidates
        claim_type: input_set_filtering
        grounds:
          - calculations.governing_assortment_selector
          - state_machines.Assortment.ACTIVE_to_RETIRED
          - entities.Assortment.fields.status
        distinguishing_aspect: |
          Identical geometry to the newest-window case, except the newer
          allocation has been RETIRED: RETIRED rows are never candidates, so the
          older window governs and the line's shipping allowance is 200 rather
          than 500 — the filter runs before the ranking.
        test_recipe:
          setup:
            - "One COMMISSARY / OVERSEAS store, surcharge_rate_bp 500, shelf_block_capacity_facings 24."
            - "One GROCERY_STAPLE product at unit_cost_cents 400."
            - "Allocation OLD on shelf_block R1, facings 4, 2026-08-01 through 2026-08-31, overseas_shipping_allowance_cents 100, still ACTIVE."
            - "Allocation NEW on shelf_block R2, facings 4, 2026-08-05 through 2026-08-25, overseas_shipping_allowance_cents 250, then RETIRED."
            - "Logical clock at 2026-08-10T00:00:00Z and one empty OPEN sale."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Sagamihara Commissary", channel: "COMMISSARY", region: "OVERSEAS", surcharge_rate_bp: 500, shelf_block_capacity_facings: 24 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-RET-400", name: "Canned Salmon 6pk", category: "GROCERY_STAPLE", unit_cost_cents: 400 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "R1", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", overseas_shipping_allowance_cents: 100, expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
              captures: { assortment_old_id: $.data.id }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: AssortmentPlanner
              captures: { store_v1: $.data.version }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "R2", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-05T00:00:00Z", effective_to: "2026-08-25T00:00:00Z", overseas_shipping_allowance_cents: 250, expected_store_version: "${store_v1}" }
              as: AssortmentPlanner
              captures: { assortment_new_id: $.data.id }
            - call: "POST /assortments/${assortment_new_id}/retire"
              payload: { reason: "VENDOR_DISCONTINUED" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SGT C Whitfield", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: SystemOperator
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 2 }
              as: StoreCashier
              captures: { line_id: $.data.id }
          assert:
            - "Assortment.${assortment_new_id}.status == RETIRED and Assortment.${assortment_old_id}.status == ACTIVE"
            - "SaleLine.${line_id}.line_shipping_allowance_cents == 200 — the OLD window governs once the newer one is filtered out"
            - "SaleLine.${line_id}.extended_cents == 800 and line_surcharge_cents == 40"
            - "Sale.${sale_id}.subsidized_shipping_cents == 200"

      - name: corner_commissary_line_price_equals_unit_cost_with_no_markup
        claim_type: correct_result
        grounds:
          - calculations.line_retail_price
          - entities.Store.fields.exchange_markup_bp
          - entities.Sale.fields.markup_total_cents
          - entities.Sale.fields.tax_cents
        distinguishing_aspect: |
          At a COMMISSARY the unit price is exactly Product.unit_cost_cents with
          markup_total_cents 0 even at the maximum surcharge_rate_bp of 1000: cost
          777 at quantity 3 gives extended 2331, surcharge round_half_up(233.1) ==
          233, tax 0 and total_due 2564 — the surcharge is a fund contribution,
          never a markup.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store with surcharge_rate_bp 1000 and exchange_markup_bp 0."
            - "One GROCERY_STAPLE product at unit_cost_cents 777 with an ACTIVE WAREHOUSE assortment."
            - "One empty OPEN sale."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Leonard Wood Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 1000 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-NOM-777", name: "Frozen Berries 3lb", category: "GROCERY_STAPLE", unit_cost_cents: 777 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "S1", facings: 6, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SPC D Amankwah", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 3 }
              as: StoreCashier
              captures: { line_id: $.data.id }
          assert:
            - "SaleLine.${line_id}.unit_price_cents == 777 and line_markup_cents == 0"
            - "SaleLine.${line_id}.extended_cents == 2331 and line_surcharge_cents == 233"
            - "Sale.${sale_id}.merchandise_cents == 2331, markup_total_cents == 0, surcharge_total_cents == 233"
            - "Sale.${sale_id}.tax_cents == 0 and total_due_cents == 2564"

      - name: corner_dividend_waterfall_fills_first_program_to_ceiling_then_second
        claim_type: correct_result
        grounds:
          - calculations.dividend_waterfall_distribution
          - calculations.vendor_promotional_allowance
          - entities.MwrProgram.fields.ytd_funded_cents
          - entities.FundLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          A 1000-cent dividend balance is poured through two ACTIVE programs in
          priority_rank order: rank 1 fills to its 600 ceiling exactly, rank 2
          receives the 400 remainder, and the fund lands at 0 — the second bucket
          never receives money before the first is full.
        test_recipe:
          setup:
            - "One EXCHANGE / CONUS store, surcharge_rate_bp 500, exchange_markup_bp 0."
            - "One DSD assortment from vendor Bluewater Snacks with promo_allowance_bp 2000 over the promo window [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)."
            - "One TENDERED sale of 5 units at unit_cost_cents 1000, settled inside the promo window: surcharge 250, settled allowance round_half_up(5000 * 2000 / 10000) == 1000."
            - "Two ACTIVE MwrPrograms of that store: rank 1 with funding_ceiling_cents 600 created first, rank 2 with funding_ceiling_cents 1000."
            - "Store.dividend_fund_balance_cents == 1000 and period_close_index == 0 before the trigger."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Shafter Exchange", channel: "EXCHANGE", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-WAT-1000", name: "Snack Mix Case", category: "GENERAL_MERCHANDISE", unit_cost_cents: 1000 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "T2", facings: 6, supply_mode: "DSD", vendor_name: "Bluewater Snacks", promo_allowance_bp: 2000, promo_window_start: "2026-08-01T00:00:00Z", promo_window_end: "2026-09-01T00:00:00Z", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /mwr-programs"
              payload: { store_id: "${store_id}", name: "Library Expansion", priority_rank: 1, funding_ceiling_cents: 600 }
              as: MwrBoardOfficer
              captures: { program_1_id: $.data.id }
            - call: "POST /mwr-programs"
              payload: { store_id: "${store_id}", name: "Fitness Center Equipment", priority_rank: 2, funding_ceiling_cents: 1000 }
              as: MwrBoardOfficer
              captures: { program_2_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "SGT E Villalobos", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: SystemOperator
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 5 }
              as: StoreCashier
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
          trigger:
            - call: "POST /stores/${store_id}/close-period"
              payload: {}
              as: SurchargeFundController
          assert:
            - "HTTP status == 200"
            - "MwrProgram.${program_1_id}.ytd_funded_cents == 600 — filled exactly to its ceiling"
            - "MwrProgram.${program_2_id}.ytd_funded_cents == 400 — the remainder only"
            - "Store.${store_id}.dividend_fund_balance_cents == 0"
            - "GET /stores/${store_id}/fund-ledger with fund == DIVIDEND returns total_count == 3"
            - "the DIVIDEND rows in created_at ASC order are ALLOWANCE_CREDIT +1000 (balance_after 1000), DIVIDEND_TRANSFER -600 (balance_after 400), DIVIDEND_TRANSFER -400 (balance_after 0)"
            - "Sale.${sale_id}.provisional_allowance_cents == 1000, settled_allowance_cents == 1000, allowance_variance_cents == 0"
            - "Store.${store_id}.surcharge_fund_balance_cents == 250, fund_posture == FROZEN, period_close_index == 1"

      - name: corner_contingency_tier_boundary_at_ceiling_selects_second_tier
        claim_type: constants_applied
        grounds:
          - calculations.capital_contingency_obligation
          - entities.CapitalProject.fields.contingency_bp
          - entities.CapitalProject.fields.obligation_cents
        distinguishing_aspect: |
          TIER_1_CEILING_CENTS is a strict upper bound: 499999 takes TIER_1_BP
          1000 (contingency 50000, obligation 549999) while exactly 500000 falls
          through to TIER_2_BP 700 (contingency 35000, obligation 535000) — so the
          larger request carries the SMALLER obligation, and an inclusive
          comparison would produce 550000.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store."
            - "One DRAFT capital project of requested_amount_cents 499999, one cent below the tier-1 ceiling."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Huachuca Commissary", channel: "COMMISSARY", region: "CONUS" }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Freezer compressor bank", requested_amount_cents: 499999 }
              as: SurchargeFundController
              as_user_id: "sfc-110"
              captures: { project_below_id: $.data.id }
          trigger:
            - call: "POST /capital-projects"
              payload: { store_id: "${store_id}", title: "Loading dock leveler", requested_amount_cents: 500000 }
              as: SurchargeFundController
              as_user_id: "sfc-110"
              captures: { project_at_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "CapitalProject.${project_below_id}.contingency_bp == 1000, contingency_cents == 50000, obligation_cents == 549999"
            - "CapitalProject.${project_at_id}.contingency_bp == 700, contingency_cents == 35000, obligation_cents == 535000"
            - "CapitalProject.${project_at_id}.obligation_cents < CapitalProject.${project_below_id}.obligation_cents"
            - "Store.${store_id}.surcharge_obligated_cents == 0 — DRAFT projects obligate nothing"

      - name: corner_third_confirmed_strike_crosses_watch_threshold
        claim_type: correct_result
        grounds:
          - calculations.patron_resale_risk_score
          - state_machines.Patron.CLEAR_to_WATCH_STRIKE
          - entities.Patron.fields.manual_strike_count
        distinguishing_aspect: |
          STRIKE_WEIGHT is 25, so manual strikes alone move the score 25 -> 50 ->
          75: the watch axis stays CLEAR after two strikes (50 < WATCH_THRESHOLD
          60) and flips to WATCH on the third (75 >= 60), while the card axis stays
          VALID because 75 < CARD_SUSPEND_THRESHOLD 80.
        test_recipe:
          setup:
            - "One ACTIVE_DUTY patron with two confirmed resale strikes, resale_risk_score 50 and resale_watch_status still CLEAR."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { full_name: "SPC F Osterberg", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /patrons/${patron_id}/compliance-review"
              payload: { decision: "CONFIRM_STRIKE" }
              as: ComplianceOfficer
            - call: "POST /patrons/${patron_id}/compliance-review"
              payload: { decision: "CONFIRM_STRIKE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /patrons/${patron_id}/compliance-review"
              payload: { decision: "CONFIRM_STRIKE" }
              as: ComplianceOfficer
          assert:
            - "HTTP status == 200"
            - "Patron.${patron_id}.manual_strike_count == 3"
            - "Patron.${patron_id}.resale_risk_score == 75 and resale_watch_status == WATCH"
            - "Patron.${patron_id}.recent_sales_risk_score == 75 and card_status == VALID and suspension_reason == null"
            - "Patron.${patron_id}.restricted_units_30d == 0 and flagged_sale_count_30d == 0"

      - name: corner_clear_watch_zeroes_strikes_and_rederives_watch_status
        claim_type: input_set_filtering
        grounds:
          - state_machines.Patron.RESTRICTED_to_CLEAR
          - calculations.patron_resale_risk_score
          - entities.Patron.fields.manual_strike_count
        distinguishing_aspect: |
          CLEAR_WATCH zeroes manual_strike_count FIRST and then re-scores from the
          surviving input set, so a patron whose only risk was three strikes drops
          from 75 to exactly 0 and from WATCH to CLEAR — the status is re-derived
          from the fresh score, not simply forced to CLEAR.
        test_recipe:
          setup:
            - "One ACTIVE_DUTY patron with three confirmed strikes, resale_risk_score 75 and resale_watch_status WATCH."
          setup_api_calls:
            - call: "POST /patrons"
              payload: { full_name: "SGT G Petrusich", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /patrons/${patron_id}/compliance-review"
              payload: { decision: "CONFIRM_STRIKE" }
              as: ComplianceOfficer
            - call: "POST /patrons/${patron_id}/compliance-review"
              payload: { decision: "CONFIRM_STRIKE" }
              as: ComplianceOfficer
            - call: "POST /patrons/${patron_id}/compliance-review"
              payload: { decision: "CONFIRM_STRIKE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /patrons/${patron_id}/compliance-review"
              payload: { decision: "CLEAR_WATCH" }
              as: ComplianceOfficer
          assert:
            - "HTTP status == 200"
            - "Patron.${patron_id}.manual_strike_count == 0"
            - "Patron.${patron_id}.resale_risk_score == 0 and recent_sales_risk_score == 0"
            - "Patron.${patron_id}.resale_watch_status == CLEAR"
            - "Patron.${patron_id}.card_status == VALID"

      - name: corner_surcharge_rollup_rounds_per_line_before_summing
        claim_type: precision
        grounds:
          - calculations.sale_surcharge_rollup
          - entities.Sale.fields.surcharge_total_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / surcharge_rounded_per_line_then_summed_not_summed_then_rated
          rationale: "The pinned rounding order and the one-cent divergence it produces are the entire subject of the named §1.8 instance."

      - name: corner_allowance_variants_diverge_between_provisional_and_settled
        claim_type: variant_divergence
        grounds:
          - calculations.vendor_promotional_allowance.variants
          - entities.Sale.fields.allowance_variance_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / allowance_provisional_vs_settled_diverge_when_clock_passes_promo_window
          rationale: "Both variants, the divergence and the resulting allowance_variance_cents are asserted in the named §1.8 instance."

      - name: corner_risk_score_variants_diverge_between_rolling_and_last_five
        claim_type: variant_divergence
        grounds:
          - calculations.patron_resale_risk_score.variants
          - entities.Patron.fields.recent_sales_risk_score
        excluded_because:
          difficulty_instance: dual_variant_calc / patron_risk_rolling30d_and_last5_diverge_on_aged_restricted_sale
          rationale: "The age-filtered and rank-filtered input sets are contrasted on the same patron in the named §1.8 instance."

      - name: corner_shipping_allowance_clamped_by_allowance_cap
        claim_type: correct_result
        grounds:
          - calculations.special_order_shipping_allowance
          - entities.SpecialOrder.fields.shipping_allowance_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / shipping_allowance_nested_min_max_clamped_by_cap
          rationale: "The nested min/max with the 15000-cent cap is exercised at the clamp in the named §1.8 instance."

      - name: corner_settled_allowance_reconciles_into_the_dividend_fund
        claim_type: reconciliation
        grounds:
          - calculations.vendor_promotional_allowance.variants
          - entities.Store.fields.dividend_fund_balance_cents
        excluded_because:
          difficulty_instance: boundary_precision_check / dividend_waterfall_with_no_eligible_programs_retains_balance
          rationale: "The named §1.8 instance asserts that only the SETTLED variant reaches the DIVIDEND fund and that the credited amount matches settled_allowance_cents exactly."

  # ===========================================================================
  - section: validations
    instances:
      - name: corner_duplicate_sku_returns_conflict
        claim_type: violation_to_error
        grounds:
          - validations.priority_10_ERR_DUPLICATE_SKU
          - entities.Product.fields.sku
          - errors.ERR_DUPLICATE_SKU
        distinguishing_aspect: |
          SKU uniqueness is global, not per-category: a second product reusing an
          existing sku under a different name and category is rejected with 409
          ERR_DUPLICATE_SKU and no second row is created.
        test_recipe:
          setup:
            - "One product with sku SKU-DUP-001 already on file."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SKU-DUP-001", name: "Ground Coffee 2lb", category: "GROCERY_STAPLE", unit_cost_cents: 899 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { sku: "SKU-DUP-001", name: "Beach Towel", category: "GENERAL_MERCHANDISE", unit_cost_cents: 1299 }
              as: AssortmentPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and ${error_id} == ERR_DUPLICATE_SKU"
            - "GET /products with category == GENERAL_MERCHANDISE returns total_count == 0"
            - "Product.${product_id}.name == 'Ground Coffee 2lb' and unit_cost_cents == 899"

      - name: corner_markup_on_commissary_store_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - validations.priority_8_ERR_MARKUP_FORBIDDEN_IN_COMMISSARY
          - entities.Store.fields.exchange_markup_bp
          - errors.ERR_MARKUP_FORBIDDEN_IN_COMMISSARY
        distinguishing_aspect: |
          The no-markup rule is enforced at enrollment, not at pricing time: a
          COMMISSARY store carrying exchange_markup_bp 300 is refused with 422
          while the identical basis points are accepted for an EXCHANGE store.
        test_recipe:
          setup:
            - "One EXCHANGE / CONUS store already enrolled with exchange_markup_bp 300, proving the value itself is legal."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Camp Zama Exchange", channel: "EXCHANGE", region: "CONUS", surcharge_rate_bp: 500, exchange_markup_bp: 300 }
              as: SurchargeFundController
              captures: { exchange_store_id: $.data.id }
          trigger:
            - call: "POST /stores"
              payload: { name: "Camp Zama Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500, exchange_markup_bp: 300 }
              as: SurchargeFundController
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 422 and ${error_id} == ERR_MARKUP_FORBIDDEN_IN_COMMISSARY"
            - "Store.${exchange_store_id}.exchange_markup_bp == 300 — the same value is legal on the EXCHANGE channel"
            - "GET /stores with channel == COMMISSARY returns total_count == 0"

      - name: corner_dsd_assortment_without_vendor_name_returns_error
        claim_type: conditional_validation
        grounds:
          - validations.priority_9_ERR_VENDOR_REQUIRED_FOR_DSD
          - entities.Assortment.fields.supply_mode
          - entities.Assortment.fields.vendor_name
          - errors.ERR_VENDOR_REQUIRED_FOR_DSD
        distinguishing_aspect: |
          vendor_name is required only under supply_mode DSD: the same payload
          shape is accepted as WAREHOUSE with no vendor and rejected with 422 as
          DSD, so the rule is conditional on the supply mode rather than on the
          presence of the field.
        test_recipe:
          setup:
            - "One store with shelf capacity 24 and one product."
            - "One WAREHOUSE assortment created with no vendor_name at all, which succeeds."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Yokota Exchange", channel: "EXCHANGE", region: "OVERSEAS", surcharge_rate_bp: 500, shelf_block_capacity_facings: 24 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-DSD-500", name: "Sports Drink 12pk", category: "GENERAL_MERCHANDISE", unit_cost_cents: 500 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "U1", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
              captures: { warehouse_assortment_id: $.data.id }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: AssortmentPlanner
              captures: { store_v1: $.data.version }
          trigger:
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "U2", facings: 4, supply_mode: "DSD", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v1}" }
              as: AssortmentPlanner
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 422 and ${error_id} == ERR_VENDOR_REQUIRED_FOR_DSD"
            - "Assortment.${warehouse_assortment_id}.supply_mode == WAREHOUSE and vendor_name == null and promo_allowance_bp == 0"
            - "GET /assortments with shelf_block == U2 returns total_count == 0"
            - "Store.${store_id}.version == ${store_v1} — the rejected write did not bump the parent"

      - name: corner_tender_with_nonzero_collected_tax_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - validations.priority_45_ERR_TAX_COLLECTION_FORBIDDEN
          - entities.Sale.fields.tax_cents
          - errors.ERR_TAX_COLLECTION_FORBIDDEN
        distinguishing_aspect: |
          Tax-free resale is enforced on the tender input, not merely on the
          derived field: supplying collected_tax_cents 25 on an otherwise
          tenderable sale returns 422 and leaves the sale OPEN with tax_cents 0.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, surcharge_rate_bp 500, and one assorted product at unit_cost_cents 500."
            - "One OPEN sale of an ACTIVE_DUTY patron holding one line of quantity 1: extended 500, surcharge 25, total_due 525."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Riley Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-TAX-500", name: "Rice 10lb", category: "GROCERY_STAPLE", unit_cost_cents: 500 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "V1", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SGT H Brannigan", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 1 }
              as: StoreCashier
          trigger:
            - call: "POST /sales/${sale_id}/tender"
              payload: { collected_tax_cents: 25 }
              as: StoreCashier
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 422 and ${error_id} == ERR_TAX_COLLECTION_FORBIDDEN"
            - "Sale.${sale_id}.tender_state == OPEN and tax_cents == 0 and total_due_cents == 525"
            - "Store.${store_id}.surcharge_fund_balance_cents == 0 — no fund movement from a refused tender"
            - "GET /stores/${store_id}/fund-ledger returns total_count == 0"

      - name: corner_tender_above_delegation_spend_cap_returns_payment_required
        claim_type: violation_to_error
        grounds:
          - validations.priority_44_ERR_DELEGATION_SPEND_CAP_EXCEEDED
          - entities.ShopperDelegation.fields.per_sale_spend_cap_cents
          - entities.Sale.fields.total_due_cents
          - errors.ERR_DELEGATION_SPEND_CAP_EXCEEDED
        distinguishing_aspect: |
          The cap is tested against total_due_cents, which includes the surcharge:
          merchandise 1200 plus surcharge 60 gives 1260 against a per-sale cap of
          1000, and the 402 lands on the tender rather than on the line add, so the
          cap is a fiscal gate at settlement and not a ringing-up limit.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, surcharge_rate_bp 500, one assorted product at unit_cost_cents 600."
            - "One RETIREE sponsor and one ACTIVE_DUTY delegate with an ACTIVE delegation over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) capped at 1000 cents per sale."
            - "One OPEN sale on that delegation holding quantity 2: extended 1200, surcharge 60, total_due 1260."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Bliss Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-CAP-600", name: "Detergent 100oz", category: "GENERAL_MERCHANDISE", unit_cost_cents: 600 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "W1", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "MSG (Ret) I Nakagawa", id_card_class: "RETIREE" }
              as: ComplianceOfficer
              captures: { sponsor_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "SPC J Ferreira", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { delegate_id: $.data.id, delegate_v0: $.data.version }
            - call: "POST /shopper-delegations"
              payload: { sponsor_patron_id: "${sponsor_id}", delegate_patron_id: "${delegate_id}", valid_from: "2026-08-01T00:00:00Z", valid_to: "2026-09-01T00:00:00Z", per_sale_spend_cap_cents: 1000, expected_delegate_patron_version: "${delegate_v0}" }
              as: ComplianceOfficer
              captures: { delegation_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${delegate_id}", acting_delegation_id: "${delegation_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 2 }
              as: StoreCashier
          trigger:
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 402 and ${error_id} == ERR_DELEGATION_SPEND_CAP_EXCEEDED"
            - "Sale.${sale_id}.merchandise_cents == 1200, surcharge_total_cents == 60, total_due_cents == 1260"
            - "Sale.${sale_id}.tender_state == OPEN and compliance_state == CLEARED"
            - "ShopperDelegation.${delegation_id}.status == ACTIVE — a cap breach does not disturb the grant"
            - "Store.${store_id}.surcharge_fund_balance_cents == 0"

      - name: corner_tender_of_empty_sale_returns_sale_has_no_lines
        claim_type: violation_to_error
        grounds:
          - validations.priority_26_ERR_SALE_HAS_NO_LINES
          - entities.Sale.fields.line_count
          - errors.ERR_SALE_HAS_NO_LINES
        distinguishing_aspect: |
          An OPEN sale with line_count 0 is refused at tender with 409 even though
          every eligibility gate above it passes, and the empty sale remains OPEN
          and re-tenderable rather than being voided.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store and one ACTIVE_DUTY patron with a VALID card."
            - "One OPEN sale with no lines."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Carson Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "PFC K Salvatierra", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and ${error_id} == ERR_SALE_HAS_NO_LINES"
            - "Sale.${sale_id}.line_count == 0 and tender_state == OPEN"
            - "Sale.${sale_id}.total_due_cents == 0"
            - "Store.${store_id}.period_close_index == 0 and surcharge_fund_balance_cents == 0"

      - name: corner_tender_of_flagged_sale_returns_compliance_flagged
        claim_type: violation_to_error
        grounds:
          - validations.priority_27_ERR_SALE_COMPLIANCE_FLAGGED
          - state_machines.Sale.CLEARED_to_FLAGGED_STRIKE
          - state_machines.Patron.CLEAR_to_WATCH_STRIKE
          - errors.ERR_SALE_COMPLIANCE_FLAGGED
        distinguishing_aspect: |
          The compliance gate is observed on its own: a single CONFIRM_STRIKE flags
          the patron's OPEN sale without touching any delegation and leaves the
          card VALID at score 25, so tender fails on priority 27 rather than on the
          delegation gate at 23 or the card gate at 30.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store, surcharge_rate_bp 500, one assorted product at unit_cost_cents 500."
            - "One ACTIVE_DUTY patron shopping on their own card — NO delegation exists anywhere in this fixture."
            - "One OPEN sale with one line of quantity 1 (total_due 525)."
            - "One CONFIRM_STRIKE compliance review, which flags that OPEN sale and leaves resale_risk_score 25, resale_watch_status CLEAR and card_status VALID."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Drum Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /products"
              payload: { sku: "SKU-FLG-500", name: "Cooking Oil 48oz", category: "GROCERY_STAPLE", unit_cost_cents: 500 }
              as: AssortmentPlanner
              captures: { product_id: $.data.id }
            - call: "POST /assortments"
              payload: { store_id: "${store_id}", product_id: "${product_id}", shelf_block: "X1", facings: 4, supply_mode: "WAREHOUSE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T00:00:00Z", expected_store_version: "${store_v0}" }
              as: AssortmentPlanner
            - call: "POST /patrons"
              payload: { full_name: "SSG L Okonjo", id_card_class: "ACTIVE_DUTY" }
              as: ComplianceOfficer
              captures: { patron_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", patron_id: "${patron_id}" }
              as: StoreCashier
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${product_id}", quantity: 1 }
              as: StoreCashier
            - call: "POST /patrons/${patron_id}/compliance-review"
              payload: { decision: "CONFIRM_STRIKE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /sales/${sale_id}/tender"
              payload: {}
              as: StoreCashier
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 409 and ${error_id} == ERR_SALE_COMPLIANCE_FLAGGED"
            - "Sale.${sale_id}.compliance_state == FLAGGED and tender_state == OPEN and acting_delegation_id == null"
            - "Patron.${patron_id}.card_status == VALID, resale_risk_score == 25, resale_watch_status == CLEAR"
            - "GET /shopper-delegations with delegate_patron_id == ${patron_id} returns total_count == 0"
            - "Store.${store_id}.surcharge_fund_balance_cents == 0"

      - name: corner_sale_outside_delegation_window_returns_not_covering
        claim_type: temporal_validation
        grounds:
          - validations.priority_36_ERR_DELEGATION_WINDOW_NOT_COVERING
          - entities.ShopperDelegation.fields.valid_from
          - entities.Sale.fields.business_date
          - errors.ERR_DELEGATION_WINDOW_NOT_COVERING
        distinguishing_aspect: |
          A delegation is ACTIVE from the moment it is granted, yet a sale stamped
          2026-08-05 against a window opening 2026-08-10 is refused with 409:
          coverage is decided by business_date against the half-open window, not by
          the grant's status.
        test_recipe:
          setup:
            - "One COMMISSARY / CONUS store."
