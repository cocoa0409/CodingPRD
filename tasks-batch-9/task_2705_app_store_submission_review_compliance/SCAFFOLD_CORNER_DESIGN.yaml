      - name: guideline_rule_supersedes_self_referential_edge_is_queryable
        claim_type: graph
        grounds:
          - entities.GuidelineRule.fields.supersedes_rule_id
          - endpoints.GET_/guideline-rules
        distinguishing_aspect: "supersedes_rule_id is a self-FK on GuidelineRule; after drafting 5.1.1-v2 against 5.1.1, GET /guideline-rules?supersedes_rule_id=${rule_id} returns exactly the successor and the successor is still DRAFT so no cascade has run."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. GuidelineRule 5.1.1 is EFFECTIVE."
          setup_api_calls:
            - *c_clock
            - *c_rule
            - *c_rule_pub
          trigger:
            - &c_rule2
              call: "POST /guideline-rules"
              payload: { rule_code: "5.1.1", title: "Data Collection and Storage", category: "PRIVACY", version_label: "2026.09", effective_from: "2026-07-20T00:00:00Z", supersedes_rule_id: "${rule_id}", requires_feature_mapping: true }
              as: PlatformPolicyAdmin
              as_user_id: "ppa-01"
              captures: { rule2_id: $.data.id }
          assert:
