          - roles.Consumer.identity
        distinguishing_aspect: >
          For the entity-backed Consumer role X-User-ID must equal the DeletionRequest's own
          consumer_id, so consumer A withdrawing consumer B's request gets
          ERR_NOT_RESOURCE_OWNER at HTTP 403 and B's request stays RECEIVED; B's own withdrawal of
          the same request then succeeds.
        test_recipe:
          setup:
