  - rule_id: non_linear_state_machine
    instances:
      - name: project_request_matching_three_way_branch
        grounds:
          - state_machines.ProjectRequest.MATCHING_to_SCOPED
          - state_machines.ProjectRequest.MATCHING_to_RESCOPING
          - state_machines.ProjectRequest.MATCHING_to_ABANDONED
          - entities.ProjectRequest.fields.failed_match_rounds
          - entities.ProjectRequest.fields.rescope_count
          - entities.ScopeDefinition.APPROVED_to_SUPERSEDED
        distinguishing_aspect: |
          ProjectRequest is cyclic and MATCHING is a three-way branch point: the SAME trigger
          (POST /match-offers/{id}/decline) sends the request to SCOPED, RESCOPING or ABANDONED purely
          on the counters failed_match_rounds and rescope_count. Round 1 returns to SCOPED and leaves
          the APPROVED ScopeDefinition intact; round 2 crosses MAX_MATCH_ROUNDS (2) and instead enters
          RESCOPING, which resets failed_match_rounds to 0, increments rescope_count to 1, supersedes
          the APPROVED revision and zeroes active_scope_revision_no. An implementation that treats
          decline as a single edge back to SCOPED never supersedes the scope revision.
        test_recipe:
          setup:
            - "Canonical world: cycle 2026-Q1 (10 slots), LARGE partner, SENIOR volunteer at 150.00/h vetted with LEGAL_CONTRACTS proficiency 4 verified, HARD window [2026-01-05, 2026-03-01) offering 300.00 hours, clock 2026-01-10T00:00:00Z."
            - "One ROUTINE ProjectRequest scoped at estimated_hours 40.00 x complexity_factor 1.00 (reserved_hours 40.00) and approved."
            - "Round 1: matched, then declined with SCHEDULE_CONFLICT (a non-exclusionary reason, so the same volunteer stays eligible) - request is back at SCOPED with failed_match_rounds 1."
            - "Round 2: matched again against the same still-APPROVED revision 1."
          setup_api_calls:
            - call: "POST /program-cycles"
              payload: { cycle_code: "2026-Q1", starts_at: "2026-01-01T00:00:00Z", ends_at: "2026-04-01T00:00:00Z", capacity_slot_total: 10 }
