scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: descent_schedule_variant_divergence_on_plan
        grounds:
          - calculations.descent_schedule_projection
          - entities.DescentPlan.fields.plan_variant
          - entities.DescentPlan.fields.weekly_delta_lbs
          - entities.DescentMilestone.fields.allowable_weight_lbs
          - state_machines.DescentPlan.DRAFT_to_CERTIFIED
        distinguishing_aspect: |
          This dual-variant calculation lives in the weight-descent scheduling domain (DescentPlan
          x DescentMilestone): from byte-identical wrestler figures (alpha 159.6, target class 150,
          rate 1.5%) the WEEKLY_STEP variant certifies a 6-milestone schedule ending 2026-12-07
          with week 3 allowable 152.5, while LINEAR_RATE certifies a 5-milestone schedule ending
          2026-11-30 with week 3 allowable 152.4 and weekly_delta_lbs 2.4.
        test_recipe:
          setup:
            - "One OPEN Season with the default weight_classes [106,113,120,126,132,138,144,150,157,165,175,190,215,285], min_body_fat_pct_male 7.0 and max_weekly_descent_pct 1.5."
            - "One Team 'Northgate High' with compliance_status CLEAR and open_flag_severity_total 0."
            - "One Assessor in status CERTIFIED (8 training hours recorded) credentialed for SKINFOLD."
            - "Wrestler Alex Mercer (M, grade 11) with one VALIDATED Assessment: measured_weight_lbs 159.6, body_fat_pct 14.0, urine_specific_gravity 1.020, so lean_body_weight_lbs 137.3, minimum_certified_weight_lbs 147.6, min_weight_class_lbs 150, alpha_weight_lbs 159.6, certification_status PROVISIONAL."
            - "Logical clock at 2026-11-01T12:00:00Z."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { status: "OPEN" }
              as: StateOffice
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High" }
              as: StateOffice
              captures: { team_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Dana Ruiz", credential_number: "AS-1001", certified_methods: ["SKINFOLD", "BIA"], certification_expires_on: "2027-06-30" }
              as: StateOffice
              captures: { assessor_id: $.data.id }
            - call: "POST /assessors/${assessor_id}/training-records"
              payload: { credential_code: "NFHS-BC-101", hours: 8 }
              as: StateOffice
            - call: "POST /teams/${team_id}/wrestlers"
              payload: { full_name: "Alex Mercer", sex: "M", grade: 11 }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wrestler_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T12:00:00Z" }
              as: StateOffice
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T09:00:00Z", measured_weight_lbs: 159.6, body_fat_pct: 14.0, urine_specific_gravity: 1.020 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_a: $.data.id }
            - call: "POST /assessments/${assess_a}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_id}"
            - call: "GET /wrestlers/${wrestler_a}"
              payload: {}
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wa_ver_1: $.data.version }
          trigger:
            - call: "POST /wrestlers/${wrestler_a}/descent-plans"
              payload: { source_assessment_id: "${assess_a}", plan_variant: "WEEKLY_STEP", target_class_lbs: 150, plan_start_date: "2026-11-02", expected_wrestler_version: "${wa_ver_1}" }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { plan_step: $.data.id }
            - call: "POST /descent-plans/${plan_step}/certify"
              payload: {}
              as: StateOffice
            - call: "GET /wrestlers/${wrestler_a}"
              payload: {}
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wa_ver_2: $.data.version }
            - call: "POST /wrestlers/${wrestler_a}/descent-plans"
              payload: { source_assessment_id: "${assess_a}", plan_variant: "LINEAR_RATE", target_class_lbs: 150, plan_start_date: "2026-11-02", expected_wrestler_version: "${wa_ver_2}" }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { plan_linear: $.data.id }
            - call: "POST /descent-plans/${plan_linear}/certify"
              payload: {}
              as: StateOffice
            - call: "GET /descent-plans/${plan_step}/milestones"
              payload: {}
              as: StateOffice
            - call: "GET /descent-plans/${plan_linear}/milestones"
              payload: {}
              as: StateOffice
          assert:
            - "DescentPlan.${plan_step}.total_weeks == 5"
            - "DescentPlan.${plan_step}.milestone_count == 6"
            - "DescentPlan.${plan_step}.projected_certification_date == '2026-12-07'"
            - "DescentPlan.${plan_step}.weekly_delta_lbs == null"
            - "DescentMilestone(plan_id=${plan_step}, week_index=1).allowable_weight_lbs == 157.2"
            - "DescentMilestone(plan_id=${plan_step}, week_index=3).allowable_weight_lbs == 152.5"
            - "DescentMilestone(plan_id=${plan_step}, week_index=4).allowable_weight_lbs == 150.2"
            - "DescentMilestone(plan_id=${plan_step}, week_index=4).min_eligible_class_lbs == 157"
            - "DescentMilestone(plan_id=${plan_step}, week_index=5).allowable_weight_lbs == 147.9"
            - "DescentMilestone(plan_id=${plan_step}, week_index=5).min_eligible_class_lbs == 150"
            - "DescentPlan.${plan_linear}.total_weeks == 4"
            - "DescentPlan.${plan_linear}.milestone_count == 5"
            - "DescentPlan.${plan_linear}.projected_certification_date == '2026-11-30'"
            - "DescentPlan.${plan_linear}.weekly_delta_lbs == 2.4"
            - "DescentMilestone(plan_id=${plan_linear}, week_index=3).allowable_weight_lbs == 152.4"
            - "DescentMilestone(plan_id=${plan_linear}, week_index=4).allowable_weight_lbs == 150.0"
            - "DescentMilestone(plan_id=${plan_linear}, week_index=4).min_eligible_class_lbs == 150"
            - "GET /descent-plans/${plan_step}/milestones returns 6 rows and GET /descent-plans/${plan_linear}/milestones returns 5 rows"
            - "DescentPlan.${plan_step}.status == CANCELLED and DescentPlan.${plan_step}.cancel_reason == 'SUPERSEDED'"
            - "DescentPlan.${plan_linear}.supersedes_plan_id == ${plan_step}"

      - name: audit_discrepancy_scoring_variant_divergence_on_assessor
        grounds:
          - calculations.audit_discrepancy_score
          - entities.ProgramAudit.fields.scoring_variant
          - entities.ProgramAudit.fields.discrepancy_score
          - entities.Assessor.fields.last_audit_outcome
          - state_machines.Assessor.CERTIFIED_to_SUSPENDED
        distinguishing_aspect: |
          This dual-variant calculation lives in a different entity domain — assessor credential
          risk (ProgramAudit x Assessor), not wrestler weight scheduling: the identical sample
          deviation set [1.20, 2.40, 0.60] scores 1.40 under SAMPLE_MEAN and finalizes PASS with
          zero cascade, but scores 2.40 under WORST_CASE, crosses audit_fail_threshold_pct 2.0 and
          finalizes FAIL, suspending the assessor and voiding all three sampled assessments.
        test_recipe:
          setup:
            - "One OPEN Season with audit_fail_threshold_pct 2.0 and audit_min_sample_count 3."
            - "One Team and one CERTIFIED Assessor credentialed for SKINFOLD."
            - "Three wrestlers, each with one VALIDATED Assessment recorded by that assessor on the UTC day 2026-11-01 (exactly the assessor_daily_assessment_capacity of 3): body_fat_pct 14.0, 16.0 and 20.0 respectively."
            - "Logical clock at 2026-11-01T12:00:00Z."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { status: "OPEN" }
              as: StateOffice
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High" }
              as: StateOffice
              captures: { team_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Dana Ruiz", credential_number: "AS-1001", certified_methods: ["SKINFOLD", "BIA"], certification_expires_on: "2027-06-30" }
              as: StateOffice
              captures: { assessor_id: $.data.id }
            - call: "POST /assessors/${assessor_id}/training-records"
              payload: { credential_code: "NFHS-BC-101", hours: 8 }
              as: StateOffice
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T12:00:00Z" }
              as: StateOffice
            - call: "POST /teams/${team_id}/wrestlers"
              payload: { full_name: "Alex Mercer", sex: "M", grade: 11 }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wrestler_a: $.data.id }
            - call: "POST /teams/${team_id}/wrestlers"
              payload: { full_name: "Blake Ito", sex: "M", grade: 12 }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wrestler_b: $.data.id }
            - call: "POST /teams/${team_id}/wrestlers"
              payload: { full_name: "Casey Nolan", sex: "M", grade: 10 }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wrestler_c: $.data.id }
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T09:00:00Z", measured_weight_lbs: 159.6, body_fat_pct: 14.0, urine_specific_gravity: 1.020 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_a: $.data.id }
            - call: "POST /assessments/${assess_a}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_id}"
            - call: "POST /wrestlers/${wrestler_b}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T10:00:00Z", measured_weight_lbs: 165.0, body_fat_pct: 16.0, urine_specific_gravity: 1.018 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_b: $.data.id }
            - call: "POST /assessments/${assess_b}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_id}"
            - call: "POST /wrestlers/${wrestler_c}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T11:00:00Z", measured_weight_lbs: 175.0, body_fat_pct: 20.0, urine_specific_gravity: 1.015 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_c: $.data.id }
            - call: "POST /assessments/${assess_c}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_id}"
          trigger:
            - call: "POST /seasons/${season_id}/audits"
              payload: { audit_type: "ASSESSOR_SAMPLE", scoring_variant: "SAMPLE_MEAN", sample_window_start: "2026-11-01", assessor_id: "${assessor_id}", samples: [{ assessment_id: "${assess_a}", remeasured_body_fat_pct: 15.2 }, { assessment_id: "${assess_b}", remeasured_body_fat_pct: 18.4 }, { assessment_id: "${assess_c}", remeasured_body_fat_pct: 20.6 }] }
              as: StateOffice
              captures: { audit_mean: $.data.id }
            - call: "POST /audits/${audit_mean}/finalize"
              payload: {}
              as: StateOffice
            - call: "POST /seasons/${season_id}/audits"
              payload: { audit_type: "ASSESSOR_SAMPLE", scoring_variant: "WORST_CASE", sample_window_start: "2026-11-01", assessor_id: "${assessor_id}", samples: [{ assessment_id: "${assess_a}", remeasured_body_fat_pct: 15.2 }, { assessment_id: "${assess_b}", remeasured_body_fat_pct: 18.4 }, { assessment_id: "${assess_c}", remeasured_body_fat_pct: 20.6 }] }
              as: StateOffice
              captures: { audit_worst: $.data.id }
            - call: "POST /audits/${audit_worst}/finalize"
              payload: {}
              as: StateOffice
          assert:
            - "ProgramAudit.${audit_mean}.sample_count == 3"
            - "ProgramAudit.${audit_mean}.discrepancy_score == 1.40"
            - "ProgramAudit.${audit_mean}.outcome == PASS"
            - "ProgramAudit.${audit_mean}.voided_assessment_count == 0"
            - "ProgramAudit.${audit_worst}.discrepancy_score == 2.40"
            - "ProgramAudit.${audit_worst}.outcome == FAIL"
            - "ProgramAudit.${audit_worst}.voided_assessment_count == 3"
            - "Assessor.${assessor_id}.status == SUSPENDED and Assessor.${assessor_id}.suspension_reason == 'AUDIT_FAIL:${audit_worst}'"
            - "Assessor.${assessor_id}.last_audit_outcome == FAIL"
            - "Assessment.${assess_a}.status == VOIDED and Assessment.${assess_a}.void_reason == 'AUDIT_FAIL:${audit_worst}'"
            - "Wrestler.${wrestler_a}.certification_status == SUSPENDED and Wrestler.${wrestler_a}.minimum_certified_weight_lbs == null"
            - "the two audits differ only in scoring_variant, yet ProgramAudit.${audit_mean}.outcome != ProgramAudit.${audit_worst}.outcome and the delta between the scores is 2.40 - 1.40 == 1.00"

  - rule_id: combinatorial_formula
    instances:
      - name: weekly_step_per_week_rounding_order_pinned
        grounds:
          - calculations.descent_schedule_projection
          - entities.DescentMilestone.fields.allowable_weight_lbs
          - entities.DescentPlan.fields.total_weeks
          - state_machines.DescentPlan.DRAFT_to_CERTIFIED
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order changes the answer: the WEEKLY_STEP schedule
          must round each week to 1 decimal BEFORE that value becomes the next week's base, so
          week 5 is 147.9; the single-shot form round_half_up(159.6 * 0.985**5, 1) yields 148.0.
          The scaffold pins per-step rounding, and the two forms are distinguishable at exactly
          one milestone, so the assertion is falsifiable to a tenth of a pound.
        test_recipe:
          setup:
            - "One OPEN Season with max_weekly_descent_pct 1.5 and the default weight_classes."
            - "Wrestler Alex Mercer with a VALIDATED Assessment giving alpha_weight_lbs 159.6, minimum_certified_weight_lbs 147.6 and min_weight_class_lbs 150."
            - "Logical clock at 2026-11-01T12:00:00Z."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { status: "OPEN" }
              as: StateOffice
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High" }
              as: StateOffice
              captures: { team_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Dana Ruiz", credential_number: "AS-1001", certified_methods: ["SKINFOLD", "BIA"], certification_expires_on: "2027-06-30" }
              as: StateOffice
              captures: { assessor_id: $.data.id }
            - call: "POST /assessors/${assessor_id}/training-records"
              payload: { credential_code: "NFHS-BC-101", hours: 8 }
              as: StateOffice
            - call: "POST /teams/${team_id}/wrestlers"
              payload: { full_name: "Alex Mercer", sex: "M", grade: 11 }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wrestler_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T12:00:00Z" }
              as: StateOffice
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T09:00:00Z", measured_weight_lbs: 159.6, body_fat_pct: 14.0, urine_specific_gravity: 1.020 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_a: $.data.id }
            - call: "POST /assessments/${assess_a}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_id}"
            - call: "GET /wrestlers/${wrestler_a}"
              payload: {}
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wa_ver_1: $.data.version }
            - call: "POST /wrestlers/${wrestler_a}/descent-plans"
              payload: { source_assessment_id: "${assess_a}", plan_variant: "WEEKLY_STEP", target_class_lbs: 150, plan_start_date: "2026-11-02", expected_wrestler_version: "${wa_ver_1}" }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { plan_step: $.data.id }
          trigger:
            - call: "POST /descent-plans/${plan_step}/certify"
              payload: {}
              as: StateOffice
            - call: "GET /descent-plans/${plan_step}/milestones"
              payload: {}
              as: StateOffice
          assert:
            - "DescentMilestone(plan_id=${plan_step}, week_index=0).allowable_weight_lbs == 159.6"
            - "DescentMilestone(plan_id=${plan_step}, week_index=1).allowable_weight_lbs == 157.2"
            - "DescentMilestone(plan_id=${plan_step}, week_index=2).allowable_weight_lbs == 154.8"
            - "DescentMilestone(plan_id=${plan_step}, week_index=3).allowable_weight_lbs == 152.5"
            - "DescentMilestone(plan_id=${plan_step}, week_index=4).allowable_weight_lbs == 150.2"
            - "DescentMilestone(plan_id=${plan_step}, week_index=5).allowable_weight_lbs == 147.9"
            - "DescentMilestone(plan_id=${plan_step}, week_index=5).allowable_weight_lbs != 148.0 (the single-shot compounding value)"
            - "DescentMilestone(plan_id=${plan_step}, week_index=5).effective_date == '2026-12-07'"
            - "DescentPlan.${plan_step}.total_weeks == 5"

      - name: eligibility_floor_circular_evaluation_order_pinned
        grounds:
          - calculations.lowest_eligible_class_at_date
          - entities.EligibilityCheck.fields.growth_allowance_lbs
          - entities.EligibilityCheck.fields.schedule_allowable_weight_lbs
          - entities.EligibilityCheck.fields.lowest_eligible_class_lbs
          - entities.Wrestler.fields.min_weight_class_lbs
          - entities.GrowthAllowance.fields.effective_date
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order: the class decides
          which growth allowance applies, the descent milestone decides the floor, and the floor
          decides the class. With G(2026-12-12)=4.0 and schedule allowable 147.9 the naive fixed
          point returns class 144, but the pinned order forbids folding growth back into
          min_weight_class_lbs, so the answer is exactly 150; on 2026-11-10 the same four steps
          return 165 because the governing milestone is week 1 (157.2) and G is still 0.0.
        test_recipe:
          setup:
            - "One OPEN Season with the default weight_classes and two published growth allowances: 2026-12-01 for 1.0 lb and 2026-12-12 for 3.0 lb."
            - "Wrestler Alex Mercer with a CERTIFIED WEEKLY_STEP plan starting 2026-11-02 (milestones week 0..5 at 159.6, 157.2, 154.8, 152.5, 150.2, 147.9 on 2026-11-02, 11-09, 11-16, 11-23, 11-30 and 12-07), minimum_certified_weight_lbs 147.6 and min_weight_class_lbs 150."
            - "Two events in the season: an early dual on 2026-11-10 and a tournament on 2026-12-12."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 State Wrestling Season", start_date: "2026-11-01" }
              as: StateOffice
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { status: "OPEN" }
              as: StateOffice
            - call: "POST /seasons/${season_id}/growth-allowances"
              payload: { effective_date: "2026-12-01", allowance_lbs: 1.0, note: "December growth date" }
              as: StateOffice
            - call: "POST /seasons/${season_id}/growth-allowances"
              payload: { effective_date: "2026-12-12", allowance_lbs: 3.0, note: "Mid-December growth date" }
              as: StateOffice
            - call: "POST /teams"
              payload: { season_id: "${season_id}", school_name: "Northgate High" }
              as: StateOffice
              captures: { team_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Dana Ruiz", credential_number: "AS-1001", certified_methods: ["SKINFOLD", "BIA"], certification_expires_on: "2027-06-30" }
              as: StateOffice
              captures: { assessor_id: $.data.id }
            - call: "POST /assessors/${assessor_id}/training-records"
              payload: { credential_code: "NFHS-BC-101", hours: 8 }
              as: StateOffice
            - call: "POST /teams/${team_id}/wrestlers"
              payload: { full_name: "Alex Mercer", sex: "M", grade: 11 }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wrestler_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T12:00:00Z" }
              as: StateOffice
            - call: "POST /wrestlers/${wrestler_a}/assessments"
              payload: { assessor_id: "${assessor_id}", method: "SKINFOLD", assessed_at: "2026-11-01T09:00:00Z", measured_weight_lbs: 159.6, body_fat_pct: 14.0, urine_specific_gravity: 1.020 }
              as: Assessor
              as_user_id: "${assessor_id}"
              captures: { assess_a: $.data.id }
            - call: "POST /assessments/${assess_a}/finalize"
              payload: {}
              as: Assessor
              as_user_id: "${assessor_id}"
            - call: "GET /wrestlers/${wrestler_a}"
              payload: {}
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { wa_ver_1: $.data.version }
            - call: "POST /wrestlers/${wrestler_a}/descent-plans"
              payload: { source_assessment_id: "${assess_a}", plan_variant: "WEEKLY_STEP", target_class_lbs: 150, plan_start_date: "2026-11-02", expected_wrestler_version: "${wa_ver_1}" }
              as: TeamCoach
              as_user_id: "${team_id}"
              captures: { plan_step: $.data.id }
            - call: "POST /descent-plans/${plan_step}/certify"
              payload: {}
              as: StateOffice
            - call: "POST /seasons/${season_id}/events"
              payload: { name: "Early Dual", event_type: "DUAL", event_date: "2026-11-10", competition_days: 1, weigh_in_days: 1, consecutive_day_allowance_lbs: 1.0 }
              as: StateOffice
              captures: { event_early: $.data.id }
            - call: "POST /seasons/${season_id}/events"
              payload: { name: "December Invitational", event_type: "TOURNAMENT", event_date: "2026-12-12", competition_days: 2, weigh_in_days: 2, consecutive_day_allowance_lbs: 1.0 }
              as: StateOffice
              captures: { event_dec: $.data.id }
          trigger:
