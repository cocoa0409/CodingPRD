# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Blow-Dry Bar & Styling — Expert band
# 9 rules x >=2 instances = 20 instances total
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # (1) Tip split: standalone vs event-block produce different direct/pool
      - name: dvc_tip_split_standalone_vs_event
        grounds:
          - calculations.tip_split
          - state_machines.Appointment.UNSETTLED_to_SETTLED
          - entities.Appointment.fields.stylist_tip_cents
          - entities.Appointment.fields.tip_pool_cents
        distinguishing_aspect: |
          Same tip_cents=1000 yields stylist_tip_cents=700/pool=300 for a standalone
          appointment but 500/500 for an event-block appointment — the variant is keyed
          on Appointment.event_block_id (different appointment domain, not the same metric).
        test_recipe:
          setup:
            - "One standalone COMPLETED appointment (non-member walk-in, service 6000) ready to settle."
          setup_api_calls:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000, blowout_credit_cost: 1 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair 1", open_minute: 480, close_minute: 1200, turnover_buffer_minutes: 10 }
              as: FrontDesk
              captures: { chair_id: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Sam Senior", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Walk In", email: "walkin1@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /appointments"
              payload: { member_id: "${mem_id}", chair_id: "${chair_id}", stylist_id: "${sty_id}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: { arrival_status: "ON_TIME" }
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/start"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/settle"
              payload: { tip_cents: 1000 }
              as: FinanceManager
              captures: { direct: $.data.stylist_tip_cents, pool: $.data.tip_pool_cents }
          assert:
            - "Appointment.${appt_id}.stylist_tip_cents == 700"
            - "Appointment.${appt_id}.tip_pool_cents == 300"

      # (2) Stylist commission (service, tiered) vs retail commission (product, flat)
      - name: dvc_service_vs_retail_commission
        grounds:
          - calculations.commission_split
          - calculations.retail_commission
          - entities.Appointment.fields.commission_amount_cents
          - entities.RetailSale.fields.retail_commission_cents
        distinguishing_aspect: |
          A MASTER stylist commission on a 6000-cent SERVICE charge is 3300 (0.55 tiered),
          while the SAME stylist's retail commission on a 6000-cent product GROSS is 600
          (0.10 flat) — same dollar amount, two different entity domains (Appointment vs
          RetailSale/Product), divergent results.
        test_recipe:
          setup:
            - "A MASTER stylist with one COMPLETED standalone service (charge 6000) and one retail sale of a 6000-cent product attributed to them."
          setup_api_calls:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000, blowout_credit_cost: 1 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair 1", open_minute: 480, close_minute: 1200, turnover_buffer_minutes: 10 }
              as: FrontDesk
              captures: { chair_id: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Mia Master", commission_tier: "MASTER", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Walk In", email: "walkin2@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SH-01", name: "Shampoo", unit_price_cents: 6000, initial_stock: 10, retail_commission_pct: 0.10 }
              as: FrontDesk
              captures: { prod_id: $.data.id }
            - call: "POST /appointments"
              payload: { member_id: "${mem_id}", chair_id: "${chair_id}", stylist_id: "${sty_id}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: { arrival_status: "ON_TIME" }
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/start"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /appointments/${appt_id}/settle"
              payload: { tip_cents: 0 }
              as: FinanceManager
          trigger:
            - call: "POST /retail-sales"
              payload: { product_id: "${prod_id}", member_id: "${mem_id}", quantity: 1, attributed_stylist_id: "${sty_id}" }
              as: FrontDesk
              captures: { sale_id: $.data.id, rc: $.data.retail_commission_cents }
          assert:
            - "Appointment.${appt_id}.commission_amount_cents == 3300"
            - "RetailSale.${sale_id}.retail_commission_cents == 600"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # (1) Mode (b): per-line-rounded discount then sum
      - name: cf_perline_rounded_discount_then_sum
        grounds:
          - calculations.appointment_service_pricing
          - entities.Appointment.fields.discount_cents
          - entities.AppointmentAddOn.fields.discount_applied_cents
        distinguishing_aspect: |
          Discount is rounded PER LINE then summed (mode b). PLUS member (0.20) on a
          5500 service + 3300 discount-eligible add-on yields per-line discounts
          1100 + 660 = 1760; a 'sum then round' of (5500+3300)*0.20 = 1760 happens to
          match here, but the scaffold pins round-per-line so the demonstrable divergence
          case (0.15 on two 110-cent lines: 17+17=34 vs 33) resolves to 34.
        test_recipe:
          setup:
            - "PLUS member; appointment on a 5500 service with one discount-eligible 3300 UPDO add-on; no credits."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 4900, included_blowout_credits: 0, member_discount_pct: 0.20 }
              as: FinanceManager
              captures: { plan_id: $.data.id }
            - call: "POST /style-services"
              payload: { name: "Premium Blowout", base_duration_minutes: 45, base_price_cents: 5500, blowout_credit_cost: 1 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /add-ons"
              payload: { name: "Updo", category: "UPDO", extra_duration_minutes: 30, price_cents: 3300, discount_eligible: true }
              as: FrontDesk
              captures: { addon_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair 1", open_minute: 480, close_minute: 1200, turnover_buffer_minutes: 10 }
              as: FrontDesk
              captures: { chair_id: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Sam Senior", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Plus Member", email: "plus1@x.com", membership_plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /appointments"
              payload: { member_id: "${mem_id}", chair_id: "${chair_id}", stylist_id: "${sty_id}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/add-ons"
              payload: { add_on_id: "${addon_id}" }
              as: FrontDesk
              captures: { aaid: $.data.id }
          assert:
            - "Appointment.${appt_id}.discount_cents == 1760"
            - "Appointment.${appt_id}.list_amount_cents == 8800"
            - "Appointment.${appt_id}.service_charge_cents == 7040"

      # (2) Mode (a): tiered-rate selection with nested min() (event rate cap)
      - name: cf_commission_tier_min_eventcap
        grounds:
          - calculations.commission_split
          - entities.Appointment.fields.commission_amount_cents
          - entities.Appointment.fields.house_amount_cents
          - entities.Stylist.fields.commission_tier
        distinguishing_aspect: |
          Commission rate = base_rate keyed on tier, then min(base_rate, EVENT_RATE_CAP)
          when event_block_id present — a >=3-input nonlinear formula (tier, event flag,
          charge). MASTER (0.55) on an event-block appointment is capped to 0.40 → 2400
          on a 6000 charge, vs 3300 standalone.
        test_recipe:
          setup:
            - "An event block with two BOOKED appointments; one MASTER-served block appointment COMPLETED and ready to settle; service charge 6000."
          setup_api_calls:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000, blowout_credit_cost: 1 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair A", open_minute: 480, close_minute: 1200, turnover_buffer_minutes: 10 }
              as: FrontDesk
              captures: { chair_a: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair B", open_minute: 480, close_minute: 1200, turnover_buffer_minutes: 10 }
              as: FrontDesk
              captures: { chair_b: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Mia Master", commission_tier: "MASTER", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty_id: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Joe Junior", commission_tier: "JUNIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty2_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Organizer", email: "org1@x.com" }
              as: FrontDesk
              captures: { org_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Guest Two", email: "guest2@x.com" }
              as: FrontDesk
              captures: { g2_id: $.data.id }
            - call: "POST /event-blocks"
              payload: { organizer_member_id: "${org_id}", block_type: "GROUP", window_start_minute: 540, window_end_minute: 900, reserved_chair_ids: ["${chair_a}", "${chair_b}"], party_size: 2 }
              as: FrontDesk
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /appointments"
              payload: { member_id: "${org_id}", chair_id: "${chair_a}", stylist_id: "${sty_id}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT", event_block_id: "${blk_id}", expected_event_block_version: "${blk_v}" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "GET /event-blocks/${blk_id}"
              payload: {}
              as: FrontDesk
              captures: { blk_v2: $.data.version }
            - call: "POST /appointments"
              payload: { member_id: "${g2_id}", chair_id: "${chair_b}", stylist_id: "${sty2_id}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT", event_block_id: "${blk_id}", expected_event_block_version: "${blk_v2}" }
              as: FrontDesk
              captures: { appt2_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: { arrival_status: "ON_TIME" }
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/start"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/settle"
              payload: { tip_cents: 0 }
              as: FinanceManager
              captures: { comm: $.data.commission_amount_cents, house: $.data.house_amount_cents }
          assert:
            - "Appointment.${appt_id}.commission_amount_cents == 2400"
            - "Appointment.${appt_id}.house_amount_cents == 3600"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # (1) Appointment parallel dimensions: lifecycle x settlement evolve independently
      - name: nls_appointment_parallel_lifecycle_settlement
        grounds:
          - state_machines.Appointment.IN_SERVICE_to_COMPLETED
          - state_machines.Appointment.UNSETTLED_to_SETTLED
          - entities.Appointment.fields.lifecycle_status
          - entities.Appointment.fields.settlement_status
        distinguishing_aspect: |
          Appointment carries two independent state axes on the SAME row: lifecycle_status
          reaches COMPLETED while settlement_status is still UNSETTLED, then a separate
          settle transition flips only settlement_status to SETTLED leaving lifecycle at
          COMPLETED — parallel dimensions, not a single linear pipeline.
        test_recipe:
          setup:
            - "A COMPLETED appointment whose settlement_status is still UNSETTLED."
          setup_api_calls:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000, blowout_credit_cost: 1 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair 1", open_minute: 480, close_minute: 1200, turnover_buffer_minutes: 10 }
              as: FrontDesk
              captures: { chair_id: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Sam Senior", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Walk In", email: "walkin3@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /appointments"
              payload: { member_id: "${mem_id}", chair_id: "${chair_id}", stylist_id: "${sty_id}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: { arrival_status: "ON_TIME" }
              as: FrontDesk
            - call: "POST /appointments/${appt_id}/start"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: Stylist
              as_user_id: "${sty_id}"
              captures: { life: $.data.lifecycle_status, settle: $.data.settlement_status }
          assert:
            - "Appointment.${appt_id}.lifecycle_status == COMPLETED"
            - "Appointment.${appt_id}.settlement_status == UNSETTLED"

      # (2) EventBlock cyclic: HOLD -> CONFIRMED -> HOLD revision round
      - name: nls_event_block_confirm_reopen_cycle
        grounds:
          - state_machines.EventBlock.HOLD_to_CONFIRMED
          - state_machines.EventBlock.CONFIRMED_to_HOLD
          - entities.EventBlock.fields.status
        distinguishing_aspect: |
          EventBlock cycles HOLD -> CONFIRMED -> HOLD (reopen) — a genuine A->B->A loop on
          a DIFFERENT entity than the Appointment parallel machine. After reopen the block
          is back in HOLD and can be re-confirmed.
        test_recipe:
          setup:
            - "A GROUP event block confirmed with 2 booked appointments and deposit met, then reopened."
          setup_api_calls:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000, blowout_credit_cost: 1 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair A", open_minute: 480, close_minute: 1200, turnover_buffer_minutes: 10 }
              as: FrontDesk
              captures: { chair_a: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair B", open_minute: 480, close_minute: 1200, turnover_buffer_minutes: 10 }
              as: FrontDesk
              captures: { chair_b: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "S One", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty1: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "S Two", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty2: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Org", email: "org2@x.com" }
              as: FrontDesk
              captures: { org_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "G2", email: "g2b@x.com" }
              as: FrontDesk
              captures: { g2_id: $.data.id }
            - call: "POST /event-blocks"
              payload: { organizer_member_id: "${org_id}", block_type: "GROUP", window_start_minute: 540, window_end_minute: 900, reserved_chair_ids: ["${chair_a}", "${chair_b}"], party_size: 2 }
              as: FrontDesk
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /appointments"
              payload: { member_id: "${org_id}", chair_id: "${chair_a}", stylist_id: "${sty1}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT", event_block_id: "${blk_id}", expected_event_block_version: "${blk_v}" }
              as: FrontDesk
              captures: { appt1: $.data.id }
            - call: "GET /event-blocks/${blk_id}"
              payload: {}
              as: FrontDesk
              captures: { blk_v1: $.data.version }
            - call: "POST /appointments"
              payload: { member_id: "${g2_id}", chair_id: "${chair_b}", stylist_id: "${sty2}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT", event_block_id: "${blk_id}", expected_event_block_version: "${blk_v1}" }
              as: FrontDesk
              captures: { appt2: $.data.id }
            - call: "POST /event-blocks/${blk_id}/deposit"
              payload: { amount_cents: 4000 }
              as: FrontDesk
              captures: { blk_v2: $.data.version }
            - call: "POST /event-blocks/${blk_id}/confirm"
              payload: { expected_event_block_version: "${blk_v2}" }
              as: FrontDesk
              captures: { blk_v3: $.data.version }
          trigger:
            - call: "POST /event-blocks/${blk_id}/reopen"
              payload: { expected_event_block_version: "${blk_v3}" }
              as: FrontDesk
              captures: { st: $.data.status }
          assert:
            - "EventBlock.${blk_id}.status == HOLD"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      # (1) Depth >=3: block cancel -> appointment cancel -> credit refund -> balance recompute
      - name: tc_block_cancel_to_appt_to_credit_refund
        grounds:
          - state_machines.EventBlock.HOLD_to_CANCELLED
          - state_machines.Appointment.BOOKED_to_CANCELLED
          - calculations.blowout_credit_balance
          - entities.Member.fields.blowout_credit_balance
        distinguishing_aspect: |
          POST /event-blocks/{id}/cancel mutates EventBlock->CANCELLED; that mutation
          cascades each block Appointment->CANCELLED; each appointment's cancel itself
          refunds credits_applied to the Member, which itself recomputes
          Member.blowout_credit_balance — a 3-hop chain (block -> appointment -> member
          credit ledger), each hop caused by the prior.
        test_recipe:
          setup:
            - "A HOLD GROUP block with two BOOKED appointments; organizer is a VIP member who consumed 1 credit on their booking (balance 4 of 5)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "VIP", monthly_fee_cents: 9900, included_blowout_credits: 5, member_discount_pct: 0.25 }
              as: FinanceManager
              captures: { plan_id: $.data.id }
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000, blowout_credit_cost: 1 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair A", open_minute: 480, close_minute: 1200, turnover_buffer_minutes: 10 }
              as: FrontDesk
              captures: { chair_a: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair B", open_minute: 480, close_minute: 1200, turnover_buffer_minutes: 10 }
              as: FrontDesk
              captures: { chair_b: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "S One", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty1: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "S Two", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty2: $.data.id }
            - call: "POST /members"
              payload: { full_name: "VIP Org", email: "viporg@x.com", membership_plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { org_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "G2", email: "g2c@x.com" }
              as: FrontDesk
              captures: { g2_id: $.data.id }
            - call: "POST /event-blocks"
              payload: { organizer_member_id: "${org_id}", block_type: "GROUP", window_start_minute: 540, window_end_minute: 900, reserved_chair_ids: ["${chair_a}", "${chair_b}"], party_size: 2 }
              as: FrontDesk
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /appointments"
              payload: { member_id: "${org_id}", chair_id: "${chair_a}", stylist_id: "${sty1}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT", event_block_id: "${blk_id}", expected_event_block_version: "${blk_v}" }
              as: FrontDesk
              captures: { appt1: $.data.id }
            - call: "GET /event-blocks/${blk_id}"
              payload: {}
              as: FrontDesk
              captures: { blk_v1: $.data.version }
            - call: "POST /appointments"
              payload: { member_id: "${g2_id}", chair_id: "${chair_b}", stylist_id: "${sty2}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT", event_block_id: "${blk_id}", expected_event_block_version: "${blk_v1}" }
              as: FrontDesk
              captures: { appt2: $.data.id }
            - call: "GET /event-blocks/${blk_id}"
              payload: {}
              as: FrontDesk
              captures: { blk_v2: $.data.version }
          trigger:
            - call: "POST /event-blocks/${blk_id}/cancel"
              payload: { expected_event_block_version: "${blk_v2}" }
              as: FrontDesk
          assert:
            - "EventBlock.${blk_id}.status == CANCELLED"
            - "Appointment.${appt1}.lifecycle_status == CANCELLED"
            - "Appointment.${appt2}.lifecycle_status == CANCELLED"
            - "Member.${org_id}.blowout_credit_balance == 5"

      # (2) Depth >=2: settle PREPAY -> member prepay debit -> stylist earnings recompute
      - name: tc_settle_prepay_debit_to_stylist_earnings
        grounds:
          - state_machines.Appointment.UNSETTLED_to_SETTLED
          - calculations.prepay_balance
          - calculations.commission_split
          - entities.Stylist.fields.earned_commission_cents
        distinguishing_aspect: |
          POST /appointments/{id}/settle on a PREPAY appointment debits
          Member.prepay_balance_cents (hop 1, caused by settle); the same settle's
          commission output then recomputes the serving Stylist.earned_commission_cents
          (hop 2, caused by the settlement record). Two-hop cascade from one trigger.
        test_recipe:
          setup:
            - "A member with 10000 prepay; a COMPLETED PREPAY appointment (charge 6000) served by a SENIOR stylist."
          setup_api_calls:
            - call: "POST /style-services"
