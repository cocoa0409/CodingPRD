  - name: reuse_seat_pool_is_conserved_across_grant_revoke_and_regrant
    grounds:
    - calculations.reuse_seat_ledger
    - state_machines.ReuseGrant.access_state_not_REVOKED_to_REVOKED
    - concurrency_rules[reuse-grant-stale-authorization]
    - entities.Authorization.fields.reuse_seats_available
    - entities.Agency.fields.reuse_grant_count
    distinguishing_aspect: reuse_seats_total 5 == reuse_seats_granted + reuse_seats_available holds after each of four writes
      (grant EPA, grant HHS, revoke EPA, re-grant EPA), the revoke returns the integer seat AND decrements Agency.reuse_grant_count,
      and each grant must present the Authorization version observed after the previous write.
