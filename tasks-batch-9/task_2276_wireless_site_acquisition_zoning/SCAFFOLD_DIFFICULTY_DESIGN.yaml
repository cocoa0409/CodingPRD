  # =========================================================================
  # Rule 8 — resource/temporal overlap with different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: provider_half_open_crew_window_adjacent_allowed_overlap_rejected
        grounds:
          - calculations.provider_crew_day_ledger
          - validations[priority=59]
          - errors[ERR_PROVIDER_CAPACITY_EXCEEDED]
          - entities.UtilityProvider.fields.concurrent_crew_capacity
        distinguishing_aspect: |
          Half-open [window_start, window_end) day coverage on the UtilityProvider resource: with
          concurrent_crew_capacity 1, an order starting exactly at another order's window_end shares no
          UTC day and is accepted (4 + 3 = 7 committed crew days), while a window overlapping two covered
          days is rejected and leaves the ledger untouched.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one candidate and one provider with concurrent_crew_capacity 1"
            - "one existing REQUESTED order over [2026-09-01, 2026-09-05)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
