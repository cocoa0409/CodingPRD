        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers fails priority-1 with 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 40, umbrella_liability_limit_cents: 100000000 }
              as: LocationManager
              captures: { err: $.data.error_id }
          assert:
            - "Request sent with auth headers omitted: error_id == ERR_UNAUTHENTICATED with http 401"

      - name: role_denied_precedes_existence_check
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "FilmOffice calling LocationManager-only POST /productions gets 403 ERR_FORBIDDEN even though the body is otherwise valid — role authorization (priority 2) precedes all resource checks."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 40, umbrella_liability_limit_cents: 100000000 }
              as: FilmOffice
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN with http 403"
            - "No production created (GET /productions of any id 404s)"

