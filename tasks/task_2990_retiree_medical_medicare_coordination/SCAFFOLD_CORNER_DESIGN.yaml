  - section: errors
    instances:
      - name: unknown_identifier_on_every_resource_path_not_found
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_PLAN_YEAR_NOT_FOUND
          - errors.ERR_RETIREE_NOT_FOUND
          - errors.ERR_PLAN_OPTION_NOT_FOUND
          - errors.ERR_DETERMINATION_NOT_FOUND
          - errors.ERR_ELECTION_EVENT_NOT_FOUND
          - errors.ERR_ENROLLMENT_NOT_FOUND
          - errors.ERR_HRA_ACCOUNT_NOT_FOUND
          - errors.ERR_CLAIM_NOT_FOUND
          - errors.ERR_INVOICE_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: |
          Nine distinct existence errors share one HTTP status but must not
          share one error_id: every resource path reports the error_id named
          after ITS OWN entity, so a single generic ERR_NOT_FOUND fails the
          instance. All nine are exercised against the same well-formed but
          absent UUID on an otherwise empty store, which also proves the
          existence check runs before any state or business rule.
        test_recipe:
          setup:
            - "An empty store: no PlanYear, Retiree, PlanOption, EligibilityDetermination, ElectionEvent, Enrollment, HraAccount, ReimbursementClaim or PremiumInvoice rows."
            - "The identifier 00000000-0000-0000-0000-000000000000 is well-formed and belongs to no row of any entity."
          setup_api_calls: []
          trigger:
            - call: "GET /retiree-benefits/plan-years/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { e_py: $.data.error_id }
            - call: "GET /retiree-benefits/retirees/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-01"
              captures: { e_ret: $.data.error_id }
            - call: "GET /retiree-benefits/plan-options/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BenefitsAdmin
