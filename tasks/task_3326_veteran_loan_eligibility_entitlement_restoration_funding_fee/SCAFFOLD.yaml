  - { id: ERR_INSUFFICIENT_SERVICE, http: 422, condition: "qualifying service days below the category minimum at COE issue" }
  - { id: ERR_SERVICE_PERIOD_MISMATCH, http: 422, condition: "referenced child ids do not belong to the asserted parent (service periods vs veteran; coe vs veteran)" }
  - { id: ERR_SERVICE_PERIOD_OVERLAP, http: 409, condition: "new ServicePeriod closed-interval overlaps an existing one (touching endpoints collide)" }
  - { id: ERR_DEPLOYMENT_WINDOW_OVERLAP, http: 409, condition: "new DeploymentException half-open window overlaps an existing one (end == start allowed)" }
  - { id: ERR_SEASONING_NOT_MET, http: 422, condition: "refinance evaluate with seasoning_days < 210" }
  - { id: ERR_REPAIRS_OUTSTANDING, http: 409, condition: "close or VALUE_ISSUED attempted with clearance repairs still OPEN or COMPLETED" }
  - { id: ERR_ASSUMPTION_INELIGIBLE, http: 422, condition: "assumption approval blocked: buyer not a veteran when substituting, insufficient buyer entitlement, or loan not CLOSED" }
  - { id: ERR_INVALID_DOWN_PAYMENT, http: 422, condition: "down_payment_cents negative or greater than purchase_price_cents" }
  - { id: ERR_INSUFFICIENT_ENTITLEMENT, http: 422, condition: "close-time entitlement shortfall not covered by the down payment" }

# =============================================================================
# Table 5: API Endpoint Table (44 endpoints)
# =============================================================================
endpoints:
  - { method: POST, path: "/va-loans/veterans", description: "Create a veteran; cascade-creates the 1:1 EntitlementAccount", roles: [LoanOfficer, ProgramAdmin], code: 201, input: [full_name, ssn_last4, service_category, character_of_discharge, receives_disability_compensation, 'is_surviving_spouse?'], output: Veteran, side_effects: ["EntitlementAccount created with system constants", "AuditEvent appended"] }
  - { method: GET, path: "/va-loans/veterans/{id}", description: "Read a veteran", roles: [Veteran, LoanOfficer, Underwriter, ProgramAdmin], code: 200, input: [], output: Veteran, side_effects: [] }
  - { method: POST, path: "/va-loans/veterans/{id}/service-periods", description: "Add a service period (closed-interval overlap rejected)", roles: [LoanOfficer], code: 201, input: [branch, start_date, end_date, discharge_character], output: ServicePeriod, side_effects: ["qualifying_days computed; veteran.total_qualifying_service_days recomputed", "AuditEvent appended"] }
  - { method: GET, path: "/va-loans/veterans/{id}/service-periods", description: "List a veteran's service periods", roles: [Veteran, LoanOfficer, ProgramAdmin], code: 200, input: ['limit?', 'offset?'], output: "ServicePeriod[]", side_effects: [] }
  - { method: POST, path: "/va-loans/veterans/{id}/coe-requests", description: "Request a Certificate of Eligibility", roles: [LoanOfficer], code: 201, input: [entitlement_code], output: CertificateOfEligibility, side_effects: ["AuditEvent appended"] }
  - { method: GET, path: "/va-loans/veterans/{id}/coe-requests", description: "List a veteran's COE requests", roles: [Veteran, LoanOfficer, ProgramAdmin], code: 200, input: ['limit?', 'offset?'], output: "CertificateOfEligibility[]", side_effects: [] }
  - { method: POST, path: "/va-loans/coe-requests/{id}/issue", description: "Issue a COE after discharge and service review", roles: [ProgramAdmin], code: 200, input: ['service_period_ids?'], output: CertificateOfEligibility, side_effects: ["COE -> ISSUED; veteran.has_issued_coe recomputed", "AuditEvent appended"] }
  - { method: POST, path: "/va-loans/coe-requests/{id}/deny", description: "Deny a COE; cascades to deny SUBMITTED loans and cancel their appraisals with queue promotion", roles: [ProgramAdmin], code: 200, input: [], output: CertificateOfEligibility, side_effects: ["CASCADE A links 1-4", "AuditEvent appended"] }
  - { method: POST, path: "/va-loans/coe-requests/{id}/reconsider", description: "Move a DENIED COE back into RECONSIDERATION (max 2)", roles: [LoanOfficer, ProgramAdmin], code: 200, input: [], output: CertificateOfEligibility, side_effects: ["reconsideration_count += 1", "AuditEvent appended"] }
  - { method: GET, path: "/va-loans/veterans/{id}/entitlement-account", description: "Read the veteran's 1:1 entitlement account (array of 0-1)", roles: [Veteran, LoanOfficer, Underwriter, ProgramAdmin], code: 200, input: [], output: "EntitlementAccount[]", side_effects: [] }
  - { method: POST, path: "/va-loans/veterans/{id}/loans", description: "Create a loan; computes loan_use and creates the FundingFeeAssessment", roles: [LoanOfficer], code: 201, input: [coe_id, purpose, property_region, purchase_price_cents, down_payment_cents, interest_rate_percent, rate_type, 'term_months?'], output: Loan, side_effects: ["originator_user_id = X-User-ID; loan_amount_cents, down_payment_pct, loan_use computed", "FundingFeeAssessment created (ASSESSED) via funding_fee_calc", "AuditEvent appended"] }
  - { method: GET, path: "/va-loans/veterans/{id}/loans", description: "List a veteran's loans", roles: [Veteran, LoanOfficer, Underwriter, ProgramAdmin], code: 200, input: ['limit?', 'offset?'], output: "Loan[]", side_effects: [] }
  - { method: GET, path: "/va-loans/loans/{id}", description: "Read a loan", roles: [Veteran, LoanOfficer, Underwriter, ProgramAdmin], code: 200, input: [], output: Loan, side_effects: [] }
  - { method: GET, path: "/va-loans/loans", description: "Filtered list of loans, e.g. by coe_id (FK reverse lookup)", roles: [LoanOfficer, Underwriter, ProgramAdmin], code: 200, input: ['coe_id?', 'veteran_id?', 'limit?', 'offset?'], output: "Loan[]", side_effects: [] }
  - { method: POST, path: "/va-loans/loans/{id}/underwriting-decisions", description: "Record an underwriting decision; residual-income and DTI gates computed; loan underwriting_status follows outcome", roles: [Underwriter], code: 201, input: [gross_monthly_income_cents, new_housing_payment_cents, other_obligations_annual_cents, family_size, region], output: UnderwritingDecision, side_effects: ["computed fields via dti_calc + residual_income_calc", "loan.underwriting_status -> APPROVED or DENIED; on DENIED cascade cancels appraisals with queue promotion", "loan.version += 1", "AuditEvent appended"] }
  - { method: GET, path: "/va-loans/loans/{id}/underwriting-decisions", description: "List decisions on a loan", roles: [LoanOfficer, Underwriter, ProgramAdmin], code: 200, input: ['limit?', 'offset?'], output: "UnderwritingDecision[]", side_effects: [] }
  - { method: POST, path: "/va-loans/loans/{id}/close", description: "Close an approved loan; charges entitlement, collects the fee, creates the occupancy certificate", roles: [LoanOfficer], code: 200, input: [closing_date, first_payment_due_date], output: Loan, side_effects: ["CASCADE B links 1-4", "AuditEvent appended"] }
  - { method: POST, path: "/va-loans/loans/{id}/record-payoff", description: "Record payoff of a closed loan (sale or refinance)", roles: [LoanOfficer], code: 200, input: [payoff_type], output: Loan, side_effects: ["closing_status -> PAID_IN_FULL; loan.version += 1", "AuditEvent appended"] }
  - { method: GET, path: "/va-loans/loans/{id}/funding-fee-assessments", description: "List funding fee assessments for a loan (array of 0-1)", roles: [Veteran, LoanOfficer, Underwriter, ProgramAdmin], code: 200, input: [], output: "FundingFeeAssessment[]", side_effects: [] }
  - { method: POST, path: "/va-loans/funding-fee-assessments/{id}/refund", description: "Refund a collected fee on retroactive disability exemption", roles: [ProgramAdmin], code: 200, input: [disability_evidence], output: FundingFeeAssessment, side_effects: ["refunded_cents = collected_cents; status REFUNDED", "AuditEvent appended"] }
  - { method: POST, path: "/va-loans/appraisers", description: "Register an appraiser in the assignment pool", roles: [ProgramAdmin], code: 201, input: [name, region, 'max_open_assignments?', 'active?'], output: Appraiser, side_effects: ["AuditEvent appended"] }
  - { method: GET, path: "/va-loans/appraisal-requests", description: "Filtered list of appraisals, e.g. by appraiser_id", roles: [Appraiser, LoanOfficer, ProgramAdmin], code: 200, input: ['appraiser_id?', 'loan_id?', 'status?', 'limit?', 'offset?'], output: "Appraisal[]", side_effects: [] }
  - { method: POST, path: "/va-loans/loans/{id}/appraisal-requests", description: "Order an appraisal; system assigns via selector policy or queues when the pool is exhausted", roles: [LoanOfficer], code: 201, input: [], output: Appraisal, side_effects: ["assignment selector policy runs; on assignment appraiser.open_assignment_count += 1", "AuditEvent appended"] }
  - { method: GET, path: "/va-loans/loans/{id}/appraisal-requests", description: "List appraisals of a loan", roles: [Veteran, LoanOfficer, Appraiser, ProgramAdmin], code: 200, input: ['limit?', 'offset?'], output: "Appraisal[]", side_effects: [] }
  - { method: GET, path: "/va-loans/appraisal-requests/{id}", description: "Read an appraisal", roles: [Veteran, LoanOfficer, Appraiser, ProgramAdmin], code: 200, input: [], output: Appraisal, side_effects: [] }
  - { method: POST, path: "/va-loans/appraisal-requests/{id}/submit-report", description: "Assigned appraiser submits the report: VALUE_ISSUED with a value, or REPAIRS_REQUIRED with MPR repair items", roles: [Appraiser], code: 200, input: [outcome, 'appraised_value_cents?', 'repairs?'], output: Appraisal, side_effects: ["state transition per outcome; RepairRequirements created for REPAIRS_REQUIRED; appraiser.open_assignment_count decremented on VALUE_ISSUED with queue promotion", "AuditEvent appended"] }
  - { method: GET, path: "/va-loans/appraisal-requests/{id}/repair-requirements", description: "List MPR repairs of an appraisal", roles: [Veteran, LoanOfficer, Appraiser, ProgramAdmin], code: 200, input: ['limit?', 'offset?'], output: "RepairRequirement[]", side_effects: [] }
  - { method: POST, path: "/va-loans/repair-requirements/{id}/complete", description: "Mark a repair completed by the builder side", roles: [LoanOfficer], code: 200, input: [], output: RepairRequirement, side_effects: ["AuditEvent appended"] }
  - { method: POST, path: "/va-loans/repair-requirements/{id}/verify", description: "Assigned appraiser verifies a completed repair", roles: [Appraiser], code: 200, input: [], output: RepairRequirement, side_effects: ["AuditEvent appended"] }
  - { method: POST, path: "/va-loans/repair-requirements/{id}/waive", description: "ProgramAdmin waives an open repair (segregation: LoanOfficer may not)", roles: [ProgramAdmin], code: 200, input: [], output: RepairRequirement, side_effects: ["AuditEvent appended"] }
  - { method: GET, path: "/va-loans/loans/{id}/occupancy-certificates", description: "List occupancy certificates of a loan (array of 0-1)", roles: [Veteran, LoanOfficer, ProgramAdmin], code: 200, input: [], output: "OccupancyCertificate[]", side_effects: [] }
  - { method: POST, "path": "/va-loans/occupancy-certificates/{id}/verify-occupancy", description: "Verify move-in against the 60-day deadline; deployment exception yields EXCEPTED", roles: [LoanOfficer], code: 200, input: [move_in_date], output: OccupancyCertificate, side_effects: ["status SATISFIED | EXCEPTED | VIOLATED", "AuditEvent appended on VIOLATED"] }
  - { method: POST, path: "/va-loans/veterans/{id}/deployment-exceptions", description: "Record a deployment window (half-open overlap rejected)", roles: [Veteran, LoanOfficer], code: 201, input: [deployment_start, deployment_end, orders_reference], output: DeploymentException, side_effects: ["AuditEvent appended"] }
  - { method: GET, path: "/va-loans/veterans/{id}/deployment-exceptions", description: "List a veteran's deployment exceptions", roles: [Veteran, LoanOfficer, ProgramAdmin], code: 200, input: ['limit?', 'offset?'], output: "DeploymentException[]", side_effects: [] }
  - { method: POST, path: "/va-loans/loans/{id}/assumption-requests", description: "Submit an assumption of the existing loan by a qualified buyer", roles: [LoanOfficer], code: 201, input: [buyer_name, buyer_is_veteran, 'buyer_veteran_id?', substitute_entitlement, release_of_liability], output: AssumptionRequest, side_effects: ["AuditEvent appended"] }
