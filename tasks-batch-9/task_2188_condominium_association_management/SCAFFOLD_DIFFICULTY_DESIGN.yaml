  # =====================================================================
  # Rule 7 — Cross-entity state dependencies (distinct entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_in_litigation_requires_approved_funding_assessment_on_that_same_claim
        grounds:
          - state_machines.InsuranceClaim.TENDERED_to_IN_LITIGATION
          - state_machines.SpecialAssessment.APPROVED_to_RESCINDED
          - validations[priority=21]  # ERR_LITIGATION_FUNDING_MISSING
          - validations[priority=60]  # ERR_LITIGATION_ACTIVE
          - calculations.special_assessment_tally
        distinguishing_aspect: |
          ENTITY PAIR (InsuranceClaim, SpecialAssessment). The claim's litigation dimension
          cannot reach IN_LITIGATION unless some SpecialAssessment whose funding_claim_id is
          THIS claim has approval_status exactly APPROVED. Three near-miss funders are each
          rejected: a BALLOTING assessment on the right claim, an APPROVED assessment on a
          DIFFERENT claim, and a FAILED assessment on the right claim. The dependency is then
          shown to run backwards too: once the claim is IN_LITIGATION its funding assessment can
          no longer be rescinded (ERR_LITIGATION_ACTIVE), and rescission unblocks only after the
          claim reaches RESOLVED.
