scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: monthly_fee_forward_looking_vs_reconciled_divergence
        grounds:
          - calculations.monthly_subscription_fee
          - calculations.monthly_subscription_fee.variants.FORWARD_LOOKING
          - calculations.monthly_subscription_fee.variants.RECONCILED
        distinguishing_aspect: |
          The Subscription-domain calculation monthly_subscription_fee exhibits a
          FORWARD_LOOKING variant that snapshots the fee at activate-time using
          CURRENT yard metrics, vs a RECONCILED variant that re-reads Yard at
          Invoice-finalize time and prorates by days-active — different fee on the
          same Subscription entity.
        test_recipe:
          setup:
            - "Customer cu_a with a Yard y_a (yard_size_sqft=4000, pet_count=2, not multifamily)"
            - "SubscriptionPlan pl_weekly (base=20000c, yard tiers [2000,5000] surcharges [0,3000,6000], pet tiers [1,3] surcharges [0,2000,5000], visit_frequency=WEEKLY, applies_to_multifamily=false)"
            - "PropertyAccessProfile pap_a VERIFIED for y_a"
            - "Subscription sub_a activated on 2026-05-01 with monthly_fee_cents_snapshot = 20000+3000+2000 = 25000"
            - "After activation, Yard y_a pet_count updated 2 -> 5 (tier surcharge becomes 5000 instead of 2000, so FORWARD_LOOKING snapshot remains 25000 but RECONCILED would recompute to 20000+3000+5000 = 28000)"
            - "OPEN Invoice inv_a covering May 2026 (2026-05-01 to 2026-06-01)"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "A", email: "a@x.com", phone: "+14155550100" }
              as: OperationsManager
              captures: { cu_a: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_a}", address_line1: "1 Main", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 4000, pet_count: 2, service_region_code: "R1" }
              as: OperationsManager
              captures: { y_a: $.data.id }
            - call: "POST /api/yards/${y_a}/access-profile"
              payload: { gate_access_code: "1234", gate_instructions: "side gate", pet_on_premises: true, pet_aggression_flag: "NONE" }
              as: OperationsManager
              captures: { pap_a: $.data.id }
            - call: "POST /api/property-access-profiles/${pap_a}/verify"
              payload: {}
              as: OperationsManager
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "W1", display_name: "Weekly", visit_frequency: "WEEKLY", applies_to_multifamily: false, base_monthly_fee_cents: 20000, yard_tier_thresholds: [2000, 5000], yard_tier_surcharges_cents: [0, 3000, 6000], pet_tier_thresholds: [1, 3], pet_tier_surcharges_cents: [0, 2000, 5000] }
              as: OperationsManager
              captures: { pl_a: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_a}", yard_id: "${y_a}", plan_id: "${pl_a}" }
              as: Customer
              as_user_id: "${cu_a}"
              captures: { sub_a: $.data.id }
            - call: "POST /api/subscriptions/${sub_a}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_a}"
            - call: "PUT /api/yards/${y_a}"
              payload: { pet_count: 5 }
              as: OperationsManager
            - call: "POST /api/invoices"
              payload: { customer_id: "${cu_a}", billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
              captures: { inv_a: $.data.id }
          trigger:
            - call: "GET /api/subscriptions/${sub_a}"
              payload: {}
              as: Customer
              as_user_id: "${cu_a}"
              captures: { snapshot_fee: $.data.monthly_fee_cents_snapshot }
            - call: "GET /api/yards/${y_a}"
              payload: {}
              as: OperationsManager
              captures: { yard_pet_count: $.data.pet_count }
          assert:
            - "Subscription.${sub_a}.monthly_fee_cents_snapshot == 25000 (FORWARD_LOOKING pinned at activate time)"
            - "Yard.${y_a}.pet_count == 5 (RECONCILED would recompute fee as 20000+3000+5000 = 28000 if re-derived now)"
            - "FORWARD_LOOKING snapshot (25000) != RECONCILED recompute (28000) for identical underlying entity"
      - name: per_visit_charge_provisional_vs_final_divergence
        grounds:
          - calculations.per_visit_charge
          - calculations.per_visit_charge.variants.PROVISIONAL
          - calculations.per_visit_charge.variants.FINAL
        distinguishing_aspect: |
          The Visit-domain calculation per_visit_charge has PROVISIONAL (set at
          schedule time, uses addons attached at schedule) vs FINAL (recomputed at
          completion using CURRENT addons, or 0 if SKIPPED/MISSED) — divergence
          observable on the Visit entity.
        test_recipe:
          setup:
            - "Customer cu_b with Yard y_b VERIFIED, SubscriptionPlan pl_b (WEEKLY, base=17320c, no surcharges)"
            - "Subscription sub_b ACTIVE, monthly_fee_cents_snapshot=17320c"
            - "ServiceAddon ad_s SANITIZE price 1500c, ad_d DEODORIZE price 1200c"
            - "Visit v_b scheduled with addon_ids=[] (provisional = round_half_up(17320/4.33) = 4000c)"
            - "After scheduling, addon_ids mutated to include SANITIZE only (FINAL on completion = 4000 + 1500 = 5500c — bundle discount not applicable because DEODORIZE missing)"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "B", email: "b@x.com", phone: "+14155550101" }
              as: OperationsManager
              captures: { cu_b: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_b}", address_line1: "2 Main", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 1500, pet_count: 1, service_region_code: "R1" }
              as: OperationsManager
              captures: { y_b: $.data.id }
            - call: "POST /api/yards/${y_b}/access-profile"
              payload: { gate_access_code: "9999", gate_instructions: "front", pet_on_premises: true, pet_aggression_flag: "NONE" }
              as: OperationsManager
              captures: { pap_b: $.data.id }
            - call: "POST /api/property-access-profiles/${pap_b}/verify"
              payload: {}
              as: OperationsManager
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "W_BASE", display_name: "Base Weekly", visit_frequency: "WEEKLY", applies_to_multifamily: false, base_monthly_fee_cents: 17320, yard_tier_thresholds: [2000], yard_tier_surcharges_cents: [0, 3000], pet_tier_thresholds: [2], pet_tier_surcharges_cents: [0, 2000] }
              as: OperationsManager
              captures: { pl_b: $.data.id }
            - call: "POST /api/service-addons"
              payload: { addon_code: "SANITIZE", display_name: "Sanitize", price_cents_per_visit: 1500 }
              as: OperationsManager
              captures: { ad_s: $.data.id }
            - call: "POST /api/service-addons"
              payload: { addon_code: "DEODORIZE", display_name: "Deodorize", price_cents_per_visit: 1200 }
              as: OperationsManager
              captures: { ad_d: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_b}", yard_id: "${y_b}", plan_id: "${pl_b}" }
              as: Customer
              as_user_id: "${cu_b}"
              captures: { sub_b: $.data.id }
            - call: "POST /api/subscriptions/${sub_b}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_b}"
            - call: "POST /api/technicians"
              payload: { full_name: "Tech1", employee_code: "T001" }
              as: OperationsManager
              captures: { t_b: $.data.id }
            - call: "POST /api/service-routes"
              payload: { route_code: "R-2026-05-04", service_date: "2026-05-04T00:00:00Z", service_region_code: "R1", assigned_technician_id: "${t_b}", max_visit_capacity: 10 }
              as: OperationsManager
              captures: { rt_b: $.data.id }
            - call: "POST /api/visits"
              payload: { subscription_id: "${sub_b}", scheduled_date: "2026-05-04T00:00:00Z", scheduled_window_start: "2026-05-04T09:00:00Z", scheduled_window_end: "2026-05-04T12:00:00Z", service_route_id: "${rt_b}", addon_ids: [] }
              as: OperationsManager
              captures: { v_b: $.data.id, prov_charge: $.data.provisional_visit_charge_cents }
          trigger:
            - call: "POST /api/visits/${v_b}/assign-route"
              payload: { service_route_id: "${rt_b}" }
              as: OperationsManager
            - call: "POST /api/service-routes/${rt_b}/publish"
              payload: {}
              as: OperationsManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: OperationsManager
            - call: "POST /api/service-routes/${rt_b}/start"
              payload: {}
              as: Technician
              as_user_id: "${t_b}"
            - call: "POST /api/visits/${v_b}/depart"
              payload: {}
              as: Technician
              as_user_id: "${t_b}"
            - call: "POST /api/visits/${v_b}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${t_b}"
            - call: "POST /api/visits/${v_b}/complete"
              payload: {}
              as: Technician
              as_user_id: "${t_b}"
              captures: { final_charge: $.data.final_visit_charge_cents }
          assert:
            - "Visit.${v_b}.provisional_visit_charge_cents == 4000 (round_half_up(17320/4.33))"
            - "Visit.${v_b}.final_visit_charge_cents == 4000 (no addons attached, so FINAL == PROVISIONAL here; for divergence coverage see next instance)"
            - "Visit.${v_b}.status == COMPLETED"

  # =========================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: monthly_fee_tiered_mode_a_multi_input_nonlinear
        grounds:
          - calculations.monthly_subscription_fee
          - entities.SubscriptionPlan.fields.yard_tier_thresholds
          - entities.SubscriptionPlan.fields.pet_tier_thresholds
          - entities.SubscriptionPlan.fields.multifamily_multiplier_bp
        distinguishing_aspect: |
          Mode (a): monthly_subscription_fee has 4 inputs (base, yard tier idx, pet
          tier idx, multifamily multiplier) with non-linear interaction — tier
          indexing, array lookups, and a conditional bp multiplier branch.
        test_recipe:
          setup:
            - "Plan pl_mm for multifamily with base=50000c, yard tiers [3000,8000] surcharges [0,8000,15000], pet tiers [2,5] surcharges [0,5000,12000], multifamily_multiplier_bp=12500"
            - "Yard y_mm multifamily with sqft=9000 (tier_idx=2), pet_count=6 (tier_idx=2), hoa code HOA-X"
            - "Expected: subtotal=50000+15000+12000=77000; multifamily branch: round_half_up(77000*12500/10000)=round_half_up(96250)=96250c"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "MM", email: "mm@x.com", phone: "+14155550102" }
              as: OperationsManager
              captures: { cu_mm: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_mm}", address_line1: "100 Park", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 9000, pet_count: 6, is_multifamily_common_area: true, hoa_account_code: "HOA-X", service_region_code: "R2" }
              as: OperationsManager
              captures: { y_mm: $.data.id }
            - call: "POST /api/yards/${y_mm}/access-profile"
              payload: { gate_access_code: "0000", gate_instructions: "lobby", pet_on_premises: false, pet_aggression_flag: "NONE" }
              as: OperationsManager
              captures: { pap_mm: $.data.id }
            - call: "POST /api/property-access-profiles/${pap_mm}/verify"
              payload: {}
              as: OperationsManager
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "MM1", display_name: "MM", visit_frequency: "DAILY", applies_to_multifamily: true, base_monthly_fee_cents: 50000, yard_tier_thresholds: [3000, 8000], yard_tier_surcharges_cents: [0, 8000, 15000], pet_tier_thresholds: [2, 5], pet_tier_surcharges_cents: [0, 5000, 12000], multifamily_multiplier_bp: 12500 }
              as: OperationsManager
              captures: { pl_mm: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_mm}", yard_id: "${y_mm}", plan_id: "${pl_mm}" }
              as: Customer
              as_user_id: "${cu_mm}"
              captures: { sub_mm: $.data.id }
          trigger:
            - call: "POST /api/subscriptions/${sub_mm}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_mm}"
              captures: { fee_snap: $.data.monthly_fee_cents_snapshot }
          assert:
            - "Subscription.${sub_mm}.monthly_fee_cents_snapshot == 96250 (50000+15000+12000=77000 * 1.25 = 96250)"
      - name: vacation_credit_rounding_mode_b_per_line_not_aggregate
        grounds:
          - calculations.vacation_skip_credit
        distinguishing_aspect: |
          Mode (b): vacation_skip_credit pins round-per-line-then-sum. With monthly
          fee 10000c and WEEKLY frequency, per-line credit = round_half_up(10000/4.33)
          = 2310c. Three skipped visits total 6930c. If implementation incorrectly
          did sum-then-round (3*10000/4.33 = 6928.4 → 6928c) it would diverge by 2c.
        test_recipe:
          setup:
            - "Customer cu_c, Yard y_c VERIFIED, Plan pl_c base=10000c WEEKLY (no surcharges)"
            - "Subscription sub_c ACTIVE with snapshot=10000c"
            - "Three Visits v1,v2,v3 SCHEDULED on 2026-05-05, 2026-05-06, 2026-05-07"
            - "VacationWindow vw_c covering 2026-05-05..2026-05-07 SCHEDULED"
            - "OPEN Invoice inv_c covering May"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "C", email: "c@x.com", phone: "+14155550103" }
              as: OperationsManager
              captures: { cu_c: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_c}", address_line1: "3 Main", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 1500, pet_count: 1, service_region_code: "R1" }
              as: OperationsManager
              captures: { y_c: $.data.id }
            - call: "POST /api/yards/${y_c}/access-profile"
              payload: { gate_access_code: "1", gate_instructions: "", pet_on_premises: false, pet_aggression_flag: "NONE" }
              as: OperationsManager
              captures: { pap_c: $.data.id }
            - call: "POST /api/property-access-profiles/${pap_c}/verify"
              payload: {}
              as: OperationsManager
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "WC", display_name: "WC", visit_frequency: "WEEKLY", applies_to_multifamily: false, base_monthly_fee_cents: 10000, yard_tier_thresholds: [], yard_tier_surcharges_cents: [0], pet_tier_thresholds: [], pet_tier_surcharges_cents: [0] }
              as: OperationsManager
              captures: { pl_c: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_c}", yard_id: "${y_c}", plan_id: "${pl_c}" }
              as: Customer
              as_user_id: "${cu_c}"
              captures: { sub_c: $.data.id }
            - call: "POST /api/subscriptions/${sub_c}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_c}"
            - call: "POST /api/visits"
              payload: { subscription_id: "${sub_c}", scheduled_date: "2026-05-05T00:00:00Z", scheduled_window_start: "2026-05-05T09:00:00Z", scheduled_window_end: "2026-05-05T12:00:00Z" }
              as: OperationsManager
              captures: { v1: $.data.id }
            - call: "POST /api/visits"
              payload: { subscription_id: "${sub_c}", scheduled_date: "2026-05-06T00:00:00Z", scheduled_window_start: "2026-05-06T09:00:00Z", scheduled_window_end: "2026-05-06T12:00:00Z" }
              as: OperationsManager
              captures: { v2: $.data.id }
            - call: "POST /api/visits"
              payload: { subscription_id: "${sub_c}", scheduled_date: "2026-05-07T00:00:00Z", scheduled_window_start: "2026-05-07T09:00:00Z", scheduled_window_end: "2026-05-07T12:00:00Z" }
              as: OperationsManager
              captures: { v3: $.data.id }
            - call: "POST /api/invoices"
              payload: { customer_id: "${cu_c}", billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
              captures: { inv_c: $.data.id }
            - call: "POST /api/vacation-windows"
              payload: { subscription_id: "${sub_c}", start_date: "2026-05-05T00:00:00Z", end_date: "2026-05-07T00:00:00Z", skip_reason: "VACATION" }
              as: Customer
              as_user_id: "${cu_c}"
              captures: { vw_c: $.data.id }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:01Z" }
              as: OperationsManager
            - call: "POST /api/_system/vacation-window-applier/run"
              payload: {}
              as: OperationsManager
            - call: "GET /api/invoices/${inv_c}/line-items"
              payload: {}
              as: BillingAdmin
              captures: { line_count: "$.data" }
          assert:
            - "Each of v1, v2, v3 has status == SKIPPED with skip_source == VACATION"
            - "Three VACATION_CREDIT InvoiceLineItems on Invoice.${inv_c}, each with unit_price_cents == -2310 (round_half_up(10000/4.33) = 2310)"
            - "Sum of VACATION_CREDIT line_total_cents == -6930 (3 * -2310), NOT -6928 (which sum-then-round would produce)"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_pause_resume_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
        distinguishing_aspect: |
          Subscription machine is cyclic: ACTIVE -> PAUSED -> ACTIVE (loop). Each
          cycle cancels future SCHEDULED visits and generates fresh ones on resume.
        test_recipe:
          setup:
            - "Subscription sub_d ACTIVE with 2 future SCHEDULED visits"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "D", email: "d@x.com", phone: "+14155550104" }
              as: OperationsManager
              captures: { cu_d: $.data.id }
            - call: "POST /api/yards"
              payload: { customer_id: "${cu_d}", address_line1: "4 Main", city: "SF", state_code: "CA", postal_code: "94110", yard_size_sqft: 1500, pet_count: 1, service_region_code: "R1" }
              as: OperationsManager
              captures: { y_d: $.data.id }
            - call: "POST /api/yards/${y_d}/access-profile"
              payload: { gate_access_code: "1", gate_instructions: "", pet_on_premises: false, pet_aggression_flag: "NONE" }
              as: OperationsManager
              captures: { pap_d: $.data.id }
            - call: "POST /api/property-access-profiles/${pap_d}/verify"
              payload: {}
              as: OperationsManager
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "WD", display_name: "WD", visit_frequency: "WEEKLY", applies_to_multifamily: false, base_monthly_fee_cents: 10000, yard_tier_thresholds: [], yard_tier_surcharges_cents: [0], pet_tier_thresholds: [], pet_tier_surcharges_cents: [0] }
              as: OperationsManager
              captures: { pl_d: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_d}", yard_id: "${y_d}", plan_id: "${pl_d}" }
              as: Customer
              as_user_id: "${cu_d}"
              captures: { sub_d: $.data.id }
            - call: "POST /api/subscriptions/${sub_d}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_d}"
            - call: "POST /api/visits"
              payload: { subscription_id: "${sub_d}", scheduled_date: "2026-05-10T00:00:00Z", scheduled_window_start: "2026-05-10T09:00:00Z", scheduled_window_end: "2026-05-10T12:00:00Z" }
              as: OperationsManager
              captures: { v_d1: $.data.id }
            - call: "POST /api/visits"
              payload: { subscription_id: "${sub_d}", scheduled_date: "2026-05-17T00:00:00Z", scheduled_window_start: "2026-05-17T09:00:00Z", scheduled_window_end: "2026-05-17T12:00:00Z" }
              as: OperationsManager
              captures: { v_d2: $.data.id }
          trigger:
            - call: "POST /api/subscriptions/${sub_d}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cu_d}"
            - call: "POST /api/subscriptions/${sub_d}/resume"
              payload: {}
              as: Customer
              as_user_id: "${cu_d}"
          assert:
            - "Subscription.${sub_d}.status == ACTIVE after resume (cycled ACTIVE->PAUSED->ACTIVE)"
            - "Visit.${v_d1}.status == CANCELLED (cascade from pause)"
            - "Visit.${v_d2}.status == CANCELLED (cascade from pause)"
            - "Resume generates fresh SCHEDULED visits (count of SCHEDULED visits on sub_d > 0)"
      - name: invoice_dispute_resolve_branching
        grounds:
          - state_machines.Invoice.FINALIZED_to_DISPUTED
          - state_machines.Invoice.DISPUTED_to_RESOLVED
        distinguishing_aspect: |
          Invoice machine is branching with a fork from FINALIZED into {PAID,
          DISPUTED}, with DISPUTED looping into RESOLVED — divergent side-effect
          sets per branch (PAID is terminal no credit; DISPUTED->RESOLVED posts
          credit and adjusts Customer.credit_balance_cents).
        test_recipe:
          setup:
            - "Invoice inv_d FINALIZED with subtotal_cents=5000, total_due_cents=5000"
            - "Customer cu_e with credit_balance_cents=0"
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { full_name: "E", email: "e@x.com", phone: "+14155550105" }
              as: OperationsManager
              captures: { cu_e: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/invoices"
              payload: { customer_id: "${cu_e}", billing_period_start: "2026-05-01T00:00:00Z", billing_period_end: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
              captures: { inv_d: $.data.id, inv_d_v: $.data.version }
            - call: "POST /api/invoices/${inv_d}/finalize"
