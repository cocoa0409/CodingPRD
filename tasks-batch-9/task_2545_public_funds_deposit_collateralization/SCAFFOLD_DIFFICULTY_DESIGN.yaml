        grounds:
          - calculations.required_collateral_percentage
          - domain_constants.WELL_CAPITALIZED_MIN_BPS
          - entities.Depository.fields.capital_ratio_bps
        distinguishing_aspect: |
          The WELL_CAPITALIZED_MIN_BPS bound (1000) is inclusive, so 999 / 1000 / 1001 bps must produce
          11000 / 10500 / 10500 required-percentage bps and requirements of 82,500,000 / 78,750,000 /
          78,750,000 cents on identical 100,000,000-cent balances. A `>` implementation, or one that
          rounds the ratio, changes the middle account's requirement by 3,750,000 cents.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One public unit with DEDICATED preference and a 100,000,000,000-cent statutory ceiling."
            - "Three APPROVED depositories, identical except capital_ratio_bps 999, 1000 and 1001, each with insurance_determination_basis AGGREGATED_BY_UNIT."
