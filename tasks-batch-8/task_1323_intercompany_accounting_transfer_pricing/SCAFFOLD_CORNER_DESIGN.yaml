        distinguishing_aspect: "The CbC fiscal error surfaces when state is valid: an APPROVED CBC_REPORT in a below-threshold year (600000000) fails filing with ERR_CBC_NOT_REQUIRED — complementing the §1.8 priority pair where the state error masks it."
        test_recipe:
          setup: ["Year 2026 with revenue 600000000 (cbc_required false); CBC_REPORT package APPROVED"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 600000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/doc_packages", payload: { fiscal_year_id: "${fy}", doc_type: "CBC_REPORT" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { doc: $.data.id } }
            - { call: "POST /tp/doc_packages/${doc}/submit", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/doc_packages/${doc}/approve", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /tp/doc_packages/${doc}/file", payload: {}, as: TaxManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CBC_NOT_REQUIRED"
            - "DocPackage.${doc}.status == APPROVED (unchanged)"

      - name: submit_response_without_defense_docs_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DEFENSE_FILE_EMPTY]", "state_machines.AuditCase.OPENED_to_SUBMITTED_TO_AUTHORITY"]
        distinguishing_aspect: "Submitting a response directly from OPENED with an empty defense file raises the business error ERR_DEFENSE_FILE_EMPTY (not a state error); the case stays OPENED."
        test_recipe:
          setup: ["E1 ACTIVE; AUDIT case OPENED for E1 with no attachments"]
          setup_api_calls:
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/audit_cases", payload: { entity_id: "${e1}", case_type: "AUDIT", authority_country: "US" }, as: TransferPricingLead, captures: { ac: $.data.id } }
          trigger:
            - { call: "POST /tp/audit_cases/${ac}/submit_response", payload: {}, as: TransferPricingLead, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DEFENSE_FILE_EMPTY"
            - "AuditCase.${ac}.status == OPENED (unchanged)"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: sweeps_forbidden_for_tax_manager
        claim_type: rbac_denial
        grounds: ["roles[TreasuryManager]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Cash-pool sweeps are exclusive to TreasuryManager; TaxManager (an otherwise privileged approver) gets ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup: ["Year 2026; E1/E2; pool OPEN with captured version"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "E1", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "E2", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/cash_pools", payload: { fiscal_year_id: "${fy}", interest_method: "AVERAGE_BALANCE", admin_fee_cents: 0 }, as: TreasuryManager, captures: { pool: $.data.id, pool_v: $.data.version } }
          trigger:
            - { call: "POST /tp/cash_pools/${pool}/sweeps", payload: { movements: [ { entity_id: "${e1}", amount_cents: 100000 }, { entity_id: "${e2}", amount_cents: -100000 } ], expected_cash_pool_version: "${pool_v}" }, as: TaxManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE"

      - name: analyst_cannot_create_audit_case
        claim_type: rbac_denial
        grounds: ["roles[TransferPricingLead]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Audit-case creation is exclusive to TransferPricingLead; TaxAnalyst gets ERR_FORBIDDEN_FOR_ROLE."
        test_recipe:
          setup: ["E1 ACTIVE"]
          setup_api_calls:
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /tp/audit_cases", payload: { entity_id: "${e1}", case_type: "AUDIT", authority_country: "US" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE"

      - name: begin_closing_forbidden_for_tax_analyst
        claim_type: rbac_denial
        grounds: ["roles[GroupTaxAdmin]", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Fiscal-year lifecycle is exclusive to GroupTaxAdmin; TaxAnalyst gets ERR_FORBIDDEN_FOR_ROLE on begin_closing."
        test_recipe:
          setup: ["Year 2026 OPEN"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
          trigger:
            - { call: "POST /tp/fiscal_years/${fy}/begin_closing", payload: {}, as: TaxAnalyst, as_user_id: "ana-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE"
            - "FiscalYear.${fy}.status == OPEN (unchanged)"

      - name: any_role_can_read_audit_case
        claim_type: rbac_allowed
        grounds: [roles]
        distinguishing_aspect: "All GET endpoints are shared: TaxAnalyst can read an audit case created by TransferPricingLead (200, full body)."
        test_recipe:
          setup: ["E1 ACTIVE; AUDIT case created by TransferPricingLead"]
          setup_api_calls:
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/audit_cases", payload: { entity_id: "${e1}", case_type: "AUDIT", authority_country: "US" }, as: TransferPricingLead, captures: { ac: $.data.id } }
          trigger:
            - { call: "GET /tp/audit_cases/${ac}", payload: {}, as: TaxAnalyst, as_user_id: "ana-1", captures: { st: $.data.status } }
          assert:
            - "GET succeeds (200); AuditCase.${ac}.status == OPENED; entity_id == ${e1}"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_study_refresh_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[study-refresh-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "optimistic_concurrency layer: after one refresh advances the study's version, a second refresh carrying the previously observed version is rejected 412 ERR_STALE_VERSION; exactly one successor line exists."
        test_recipe:
          setup: ["Study approved CURRENT; its post-approve version captured"]
          setup_api_calls:
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1", captures: { study_v: $.data.version } }
          trigger:
            - { call: "POST /tp/benchmarking_studies/${study}/refresh", payload: { comparables_bp: [350, 450, 550, 650, 750], expected_study_version: "${study_v}" }, as: TransferPricingLead, as_user_id: "tpl-1", captures: { child: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/refresh", payload: { comparables_bp: [360, 460, 560, 660, 760], expected_study_version: "${study_v}" }, as: TransferPricingLead, as_user_id: "tpl-1", captures: { err: $.data.error_id } }
          assert:
            - "first refresh succeeds: new DRAFT study ${child} with supersedes_study_id == ${study}"
            - "second refresh with the same observed version: error_id == ERR_STALE_VERSION (412)"
            - "GET /tp/benchmarking_studies?supersedes_study_id=${study} returns exactly 1 successor"

      - name: occ_stale_pool_sweep_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[pool-sweep-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "optimistic_concurrency layer: a sweep computed from pool version N succeeds and advances to N+1; a later sweep still carrying expected version N is rejected 412."
        test_recipe:
          setup: ["Year 2026; E1/E2; pool OPEN, version captured"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "E1", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "E2", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/cash_pools", payload: { fiscal_year_id: "${fy}", interest_method: "AVERAGE_BALANCE", admin_fee_cents: 0 }, as: TreasuryManager, captures: { pool: $.data.id, pool_v: $.data.version } }
          trigger:
            - { call: "POST /tp/cash_pools/${pool}/sweeps", payload: { movements: [ { entity_id: "${e1}", amount_cents: 100000 }, { entity_id: "${e2}", amount_cents: -100000 } ], expected_cash_pool_version: "${pool_v}" }, as: TreasuryManager, captures: { pool_v2: $.data.version } }
            - { call: "POST /tp/cash_pools/${pool}/sweeps", payload: { movements: [ { entity_id: "${e1}", amount_cents: 50000 }, { entity_id: "${e2}", amount_cents: -50000 } ], expected_cash_pool_version: "${pool_v}" }, as: TreasuryManager, captures: { err: $.data.error_id } }
          assert:
            - "first sweep succeeds: pool version == ${pool_v} + 1"
            - "second sweep with stale expected version: error_id == ERR_STALE_VERSION (412)"
            - "position(${e1}).balance_cents == 100000 (second sweep not applied)"

      - name: agreement_version_increments_on_each_mutation
        claim_type: version_increment
        grounds: [entities.IntercompanyAgreement, "concurrency_rules[study-refresh-stale-version]"]
        distinguishing_aspect: "common_fields version starts at 1 on create and increments by exactly 1 per mutation: after activate (v2) and start_amendment (v3), GET confirms version 3."
        test_recipe:
          setup: ["Year 2026; E1/E2; study CURRENT; agreement created and activated"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id, v0: $.data.version } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1", captures: { v1: $.data.version } }
          trigger:
            - { call: "POST /tp/agreements/${agr}/start_amendment", payload: { new_markup_bp: 300 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { v2: $.data.version } }
          assert:
            - "version at create == 1, after activate == 2, after start_amendment == 3"
            - "IntercompanyAgreement.${agr}.status == UNDER_AMENDMENT and pending_markup_bp == 300"

      - name: activation_pins_study_snapshot_against_later_refresh
        claim_type: version_pinning
        grounds: [entities.IntercompanyAgreement.fields.pinned_study_id, state_machines.IntercompanyAgreement.DRAFT_to_ACTIVE]
        distinguishing_aspect: "version_pinning_on_approval layer: after the pinned study is refreshed and its successor approved (median moves 500 -> 1100), the agreement still reports pinned_study_id = old study and pinned_median_bp == 500."
        test_recipe:
          setup: ["Year 2026; E1/E2; study S1 CURRENT (range 400/500/600); agreement ACTIVE pinned to S1"]
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1", captures: { study_v: $.data.version } }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
          trigger:
            - { call: "POST /tp/benchmarking_studies/${study}/refresh", payload: { comparables_bp: [900, 1000, 1100, 1200, 1300], expected_study_version: "${study_v}" }, as: TransferPricingLead, as_user_id: "tpl-1", captures: { study2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study2}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-2" }
            - { call: "GET /tp/agreements/${agr}", payload: {}, as: TaxManager, captures: { pin: $.data.pinned_study_id, med: $.data.pinned_median_bp } }
          assert:
            - "BenchmarkingStudy.${study}.status == SUPERSEDED after successor approval"
            - "BenchmarkingStudy.${study2}.median_bp == 1100"
            - "IntercompanyAgreement.${agr}.pinned_study_id == ${study} (unchanged by refresh)"
            - "IntercompanyAgreement.${agr}.pinned_median_bp == 500 (snapshot frozen at activation)"

      - name: cascading_side_effects_layer_coverage
        claim_type: cascade_chain
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: true_up_post_cascades_adjustment_elimination_pool_accrual
          rationale: "The 3-level cascade (post -> adjustment tx -> auto-elimination -> pool pending accrual) is asserted link-by-link in the named §1.8 instance; year-close staleness cascade is covered by year_close_stales_study_flags_pinned_agreements."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "immediate consistency: an entity created by POST is fully readable with all computed/system fields by the very next GET in the same test flow — no lag, no recompute endpoint."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tp/legal_entities", payload: { name: "ReadCo", country_code: "JP", functional_currency: "JPY" }, as: GroupTaxAdmin, captures: { e: $.data.id } }
            - { call: "GET /tp/legal_entities/${e}", payload: {}, as: TreasuryManager, captures: { nm: $.data.name, st: $.data.status } }
          assert:
            - "GET immediately after POST returns name == 'ReadCo', country_code == 'JP', status == ACTIVE, version == 1"
