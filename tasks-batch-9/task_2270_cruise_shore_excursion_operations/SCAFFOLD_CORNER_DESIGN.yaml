# =============================================================================
# task_2270 - Cruise Shore Excursion Operations
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
#
# Breadth probe over the nine sections of references/claim-extraction-guide.md,
# walked against SCAFFOLD.yaml 1.1-1.7. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry excluded_because: and no test_recipe.
#
# Every setup_api_calls chain starts from an empty database: the first call sets
# the logical clock, and every later precondition is produced by composing 1.5
# endpoints only. All 59 error ids in 1.6 are triggered by at least one instance
# here or by a named 1.8 instance cited in a stub.
#
# Shared fixture instants: clock 2026-08-01T00:00:00Z, port call arrival
# 2026-09-15T08:00:00Z, all_aboard 16:30, departure 17:00, meeting 09:00.
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: port_create_returns_every_stored_field_and_version_one
        claim_type: creation
        grounds:
          - entities.Port
          - entities.Port.fields.port_code
          - entities.Port.fields.docking_mode
          - endpoints[POST /shore-excursions/ports]
          - response_envelope.success
        distinguishing_aspect: |
          A create call with every declared input present returns 201 and echoes all six stored
          Port fields plus the common fields, with version exactly 1.
        test_recipe:
          setup:
            - "Empty database."
            - "The logical clock is set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
          trigger:
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "COZ", name: "Cozumel", country_code: "MX", docking_mode: "ALONGSIDE", risk_buffer_minutes: 30, tender_egress_minutes: 25 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { new_port_id: $.data.id }
          assert:
            - "the create call returns HTTP 201"
            - "the response envelope carries meta.api_request_id and response_type == object"
            - "Port.${new_port_id}.port_code == COZ"
            - "Port.${new_port_id}.name == Cozumel"
            - "Port.${new_port_id}.country_code == MX"
            - "Port.${new_port_id}.docking_mode == ALONGSIDE"
            - "Port.${new_port_id}.risk_buffer_minutes == 30"
            - "Port.${new_port_id}.tender_egress_minutes == 25"
            - "Port.${new_port_id}.version == 1"
            - "Port.${new_port_id}.id is a non-empty string and created_at is a non-null ISO-8601 instant"

      - name: port_defaults_apply_when_both_buffer_fields_are_omitted
        claim_type: defaults
        grounds:
          - entities.Port.fields.risk_buffer_minutes
          - entities.Port.fields.tender_egress_minutes
          - endpoints[POST /shore-excursions/ports]
        distinguishing_aspect: |
          Omitting risk_buffer_minutes and tender_egress_minutes yields exactly 30 and 25, not
          null and not 0.
        test_recipe:
          setup:
            - "Empty database."
            - "The logical clock is set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
          trigger:
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "PGO", name: "Progreso", country_code: "MX", docking_mode: "ALONGSIDE" }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { bare_port_id: $.data.id }
          assert:
            - "the create call returns HTTP 201"
            - "Port.${bare_port_id}.risk_buffer_minutes == 30"
            - "Port.${bare_port_id}.tender_egress_minutes == 25"
            - "Port.${bare_port_id}.docking_mode == ALONGSIDE"
            - "Port.${bare_port_id}.version == 1"

      - name: guest_create_defaults_medical_flags_to_empty_and_loyalty_to_none
        claim_type: defaults
        grounds:
          - entities.Guest.fields.medical_flags
          - entities.Guest.fields.loyalty_tier
          - endpoints[POST /shore-excursions/guests]
        distinguishing_aspect: |
          Omitting medical_flags and loyalty_tier yields the empty array and the NONE tier, which
          later drives loyalty_bps 0 in calculations.booking_price_quote.
        test_recipe:
          setup:
            - "Empty database."
            - "The logical clock is set to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
          trigger:
            - call: "POST /shore-excursions/guests"
              payload: { full_name: "Ida Nyland", birth_date: "1985-04-02T00:00:00Z", voyage_code: "V2609", mobility_level: "FULL", language_pref: "EN" }
              as: ShoreExcursionDesk
              as_user_id: "u_desk_1"
              captures: { bare_guest_id: $.data.id }
          assert:
            - "the create call returns HTTP 201"
            - "Guest.${bare_guest_id}.medical_flags == []"
            - "Guest.${bare_guest_id}.loyalty_tier == NONE"
            - "Guest.${bare_guest_id}.voyage_code == V2609"
            - "Guest.${bare_guest_id}.version == 1"

      - name: port_read_by_id_returns_the_stored_row_to_every_role
        claim_type: retrieval
        grounds:
          - endpoints[GET /shore-excursions/ports/{portId}]
          - roles.Guest
          - entities.Port.fields.tender_egress_minutes
        distinguishing_aspect: |
          A GET by id returns the same field values the create call stored, and the read is shared
          with the Guest role rather than exclusive to ExcursionManager.
        test_recipe:
          setup:
            - "One ALONGSIDE port COZ exists with risk_buffer_minutes 30 and tender_egress_minutes 25."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "COZ", name: "Cozumel", country_code: "MX", docking_mode: "ALONGSIDE", risk_buffer_minutes: 30, tender_egress_minutes: 25 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { port_id: $.data.id }
          trigger:
            - call: "GET /shore-excursions/ports/${port_id}"
              payload: {}
              as: Guest
              as_user_id: "u_guest_1"
          assert:
            - "the read returns HTTP 200"
            - "Port.${port_id}.port_code == COZ"
            - "Port.${port_id}.risk_buffer_minutes == 30"
            - "Port.${port_id}.tender_egress_minutes == 25"
            - "Port.${port_id}.version == 1"

      - name: guest_listing_is_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /shore-excursions/guests]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three stored guests, limit 2 offset 0 returns 2 rows with total_count 3 and
          has_more true; offset 2 returns the remaining 1 row with has_more false.
        test_recipe:
          setup:
            - "Three guests exist on voyage V2609."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/guests"
              payload: { full_name: "Ada Reyes", birth_date: "1985-04-02T00:00:00Z", voyage_code: "V2609", mobility_level: "FULL", language_pref: "EN" }
              as: ShoreExcursionDesk
              as_user_id: "u_desk_1"
              captures: { g_a_id: $.data.id }
            - call: "POST /shore-excursions/guests"
              payload: { full_name: "Ben Ortiz", birth_date: "1979-11-20T00:00:00Z", voyage_code: "V2609", mobility_level: "FULL", language_pref: "EN" }
              as: ShoreExcursionDesk
              as_user_id: "u_desk_1"
              captures: { g_b_id: $.data.id }
            - call: "POST /shore-excursions/guests"
              payload: { full_name: "Cleo Marsh", birth_date: "1990-02-14T00:00:00Z", voyage_code: "V2609", mobility_level: "FULL", language_pref: "EN" }
              as: ShoreExcursionDesk
              as_user_id: "u_desk_1"
              captures: { g_c_id: $.data.id }
          trigger:
            - call: "GET /shore-excursions/guests"
              payload: { limit: 2, offset: 0 }
              as: ShoreExcursionDesk
              as_user_id: "u_desk_1"
            - call: "GET /shore-excursions/guests"
              payload: { limit: 2, offset: 2 }
              as: ShoreExcursionDesk
              as_user_id: "u_desk_1"
          assert:
            - "the first list call returns HTTP 200 with response_type == array"
            - "the first list call returns exactly 2 Guest rows with total_count == 3 and has_more == true"
            - "the second list call returns exactly 1 Guest row with total_count == 3 and has_more == false"
            - "no Guest row appears in both pages"

      - name: departure_read_with_an_unknown_identifier_returns_departure_not_found
        claim_type: not_found
        grounds:
          - validations[7].ERR_DEPARTURE_NOT_FOUND
          - errors[ERR_DEPARTURE_NOT_FOUND]
          - endpoints[GET /shore-excursions/departures/{departureId}]
        distinguishing_aspect: |
          A syntactically valid but unstored departure id returns 404 ERR_DEPARTURE_NOT_FOUND, not
          an empty 200 body.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
          trigger:
            - call: "GET /shore-excursions/departures/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the read returns HTTP 404"
            - "data.error_id == ERR_DEPARTURE_NOT_FOUND"
            - "no ExcursionDeparture row is created"

      - name: booking_create_without_the_channel_field_returns_a_field_validation_error
        claim_type: required_fields
        grounds:
          - validations[6].ERR_VALIDATION
          - errors[ERR_VALIDATION]
          - endpoints[POST /shore-excursions/bookings]
          - entities.Booking.fields.channel
        distinguishing_aspect: |
          channel is a required input with no default, so omitting it returns 400 ERR_VALIDATION
          before any seat is consumed.
        test_recipe:
          setup:
            - "Cozumel world: approved operator, published PREMIUM excursion, port call V2609 OPEN_FOR_SALE, one SELLING departure of capacity 40 split 25/15."
            - "One guest exists and the departure version has been read."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "COZ", name: "Cozumel", country_code: "MX", docking_mode: "ALONGSIDE", risk_buffer_minutes: 30, tender_egress_minutes: 25 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { port_id: $.data.id }
            - call: "POST /shore-excursions/ports/${port_id}/meeting-points"
              payload: { name: "Terminal Hall B", zone: "TERMINAL_HALL", max_concurrent_groups: 4, slot_buffer_minutes: 10 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { mp_id: $.data.id }
            - call: "POST /shore-excursions/operators"
              payload: { port_id: "${port_id}", legal_name: "Maya Reef Excursions", contact_email: "ops@maya.example", insurance_expiry_date: "2027-06-30T00:00:00Z", insurance_liability_limit_cents: 100000000, commission_rate_bps: 1800 }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
              captures: { op_id: $.data.id }
            - call: "POST /shore-excursions/operators/${op_id}/safety-audits"
              payload: { audit_type: "INITIAL", conducted_on: "2026-07-20T00:00:00Z", raw_score: 82, critical_finding_count: 0 }
              as: OperatorVettingOfficer
              as_user_id: "u_aud_1"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "SUBMIT" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "APPROVE" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
            - call: "POST /shore-excursions/excursions"
              payload: { port_id: "${port_id}", operator_id: "${op_id}", title: "Reef Snorkel", duration_minutes: 300, min_age: 18, mobility_level: "LEVEL_2", languages: ["EN", "ES"], base_price_cents: 12000, price_tier: "PREMIUM", is_line_operated: false }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { exc_id: $.data.id }
            - call: "POST /shore-excursions/excursions/${exc_id}/catalog-actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
            - call: "POST /shore-excursions/excursions/${exc_id}/catalog-actions"
              payload: { action: "PUBLISH" }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
            - call: "POST /shore-excursions/port-calls"
              payload: { port_id: "${port_id}", voyage_code: "V2609", ship_code: "MS-AURORA", arrival_utc: "2026-09-15T08:00:00Z", all_aboard_utc: "2026-09-15T16:30:00Z", departure_utc: "2026-09-15T17:00:00Z" }
              as: PortAgent
              as_user_id: "u_agent_1"
              captures: { pc_id: $.data.id }
            - call: "POST /shore-excursions/port-calls/${pc_id}/transitions"
              payload: { action: "OPEN_SALES" }
              as: PortAgent
              as_user_id: "u_agent_1"
            - call: "POST /shore-excursions/departures"
              payload: { excursion_id: "${exc_id}", port_call_id: "${pc_id}", meeting_point_id: "${mp_id}", meeting_time_utc: "2026-09-15T09:00:00Z", dispatch_dwell_minutes: 20, total_capacity: 40, precruise_allocation: 25, onboard_allocation: 15 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { dep_id: $.data.id }
            - call: "POST /shore-excursions/guests"
              payload: { full_name: "Ada Reyes", birth_date: "1985-04-02T00:00:00Z", voyage_code: "V2609", mobility_level: "FULL", language_pref: "EN" }
              as: ShoreExcursionDesk
              as_user_id: "u_desk_1"
              captures: { g_id: $.data.id }
            - call: "GET /shore-excursions/departures/${dep_id}"
              payload: {}
              as: ShoreExcursionDesk
              as_user_id: "u_desk_1"
              captures: { dep_v: $.data.version }
          trigger:
            - call: "POST /shore-excursions/bookings"
              payload: { departure_id: "${dep_id}", guest_id: "${g_id}", party_size: 2, language_choice: "EN", expected_departure_version: "${dep_v}" }
              as: ShoreExcursionDesk
              as_user_id: "u_desk_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the create call returns HTTP 400"
            - "data.error_id == ERR_VALIDATION"
            - "no Booking row is created"
            - "ExcursionDeparture.${dep_id}.precruise_sold_seats == 0"
            - "ExcursionDeparture.${dep_id}.onboard_sold_seats == 0"

      - name: operator_create_with_a_commission_rate_above_the_cap_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.TourOperator.fields.commission_rate_bps
          - validations[6].ERR_VALIDATION
          - endpoints[POST /shore-excursions/operators]
        distinguishing_aspect: |
          commission_rate_bps is constrained to [0, 5000], so 6000 is a range violation returning
          400 ERR_VALIDATION.
        test_recipe:
          setup:
            - "One port COZ exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "COZ", name: "Cozumel", country_code: "MX", docking_mode: "ALONGSIDE", risk_buffer_minutes: 30, tender_egress_minutes: 25 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { port_id: $.data.id }
          trigger:
            - call: "POST /shore-excursions/operators"
              payload: { port_id: "${port_id}", legal_name: "Greedy Tours", contact_email: "ops@greedy.example", insurance_expiry_date: "2027-06-30T00:00:00Z", insurance_liability_limit_cents: 100000000, commission_rate_bps: 6000 }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
              captures: { err_id: $.data.error_id }
          assert:
            - "the create call returns HTTP 400"
            - "data.error_id == ERR_VALIDATION"
            - "no TourOperator row is created"

      - name: port_create_with_an_unknown_docking_mode_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Port.fields.docking_mode
          - validations[6].ERR_VALIDATION
          - endpoints[POST /shore-excursions/ports]
        distinguishing_aspect: |
          docking_mode accepts only ALONGSIDE or TENDER, so FLOATING is an enum violation
          returning 400 ERR_VALIDATION rather than being stored verbatim.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
          trigger:
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "FLTNG", name: "Floating Pier", country_code: "MX", docking_mode: "FLOATING" }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the create call returns HTTP 400"
            - "data.error_id == ERR_VALIDATION"
            - "no Port row is created"

      - name: safety_audit_is_immutable_with_no_version_field_and_no_write_back_endpoint
        claim_type: immutability
        grounds:
          - entities.SafetyAudit
          - endpoints[GET /shore-excursions/safety-audits/{auditId}]
          - endpoints[POST /shore-excursions/operators/{operatorId}/safety-audits]
        distinguishing_aspect: |
          SafetyAudit declares common_fields false: the stored row exposes id, created_at and its
          seven business fields but no version and no updated_at, and §1.5 declares no PATCH, PUT
          or DELETE for it.
        test_recipe:
          setup:
            - "One port and one DRAFT operator exist."
            - "One INITIAL audit scoring 82 with 0 critical findings has been filed by u_aud_1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "COZ", name: "Cozumel", country_code: "MX", docking_mode: "ALONGSIDE", risk_buffer_minutes: 30, tender_egress_minutes: 25 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { port_id: $.data.id }
            - call: "POST /shore-excursions/operators"
              payload: { port_id: "${port_id}", legal_name: "Maya Reef Excursions", contact_email: "ops@maya.example", insurance_expiry_date: "2027-06-30T00:00:00Z", insurance_liability_limit_cents: 100000000, commission_rate_bps: 1800 }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
              captures: { op_id: $.data.id }
            - call: "POST /shore-excursions/operators/${op_id}/safety-audits"
              payload: { audit_type: "INITIAL", conducted_on: "2026-07-20T00:00:00Z", raw_score: 82, critical_finding_count: 0 }
              as: OperatorVettingOfficer
              as_user_id: "u_aud_1"
              captures: { audit_id: $.data.id }
          trigger:
            - call: "GET /shore-excursions/safety-audits/${audit_id}"
              payload: {}
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
          assert:
            - "the read returns HTTP 200"
            - "SafetyAudit.${audit_id}.raw_score == 82"
            - "SafetyAudit.${audit_id}.critical_finding_count == 0"
            - "SafetyAudit.${audit_id}.auditor_user_id == u_aud_1"
            - "SafetyAudit.${audit_id}.audit_type == INITIAL"
            - "the response body contains no version field and no updated_at field"
            - "TourOperator.${op_id}.safety_score == 82"
            - "TourOperator.${op_id}.latest_audit_auditor_user_id == u_aud_1"

      - name: refund_ledger_entries_are_listable_by_booking_and_carry_no_version_field
        claim_type: immutability
        grounds:
          - entities.RefundLedgerEntry
          - endpoints[GET /shore-excursions/refund-ledger-entries]
          - state_machines.Booking.financial_status.AUTHORIZED_to_VOIDED
        distinguishing_aspect: |
          RefundLedgerEntry rows are system-written only: the AUTH_VOID entry appears from the
          cancellation cascade, is readable through the booking_id filter, and exposes no version
          field because §1.1 declares common_fields false.
        test_recipe:
          setup:
            - "Cozumel world with one SELLING departure."
            - "One guest holds a party_size 2 PRE_CRUISE booking still in BOOKED / AUTHORIZED."
            - "The booking is then cancelled by the desk, voiding the never-charged authorisation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ExcursionManager
            - call: "POST /shore-excursions/ports"
              payload: { port_code: "COZ", name: "Cozumel", country_code: "MX", docking_mode: "ALONGSIDE", risk_buffer_minutes: 30, tender_egress_minutes: 25 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { port_id: $.data.id }
            - call: "POST /shore-excursions/ports/${port_id}/meeting-points"
              payload: { name: "Terminal Hall B", zone: "TERMINAL_HALL", max_concurrent_groups: 4, slot_buffer_minutes: 10 }
              as: ExcursionManager
              as_user_id: "u_mgr_1"
              captures: { mp_id: $.data.id }
            - call: "POST /shore-excursions/operators"
              payload: { port_id: "${port_id}", legal_name: "Maya Reef Excursions", contact_email: "ops@maya.example", insurance_expiry_date: "2027-06-30T00:00:00Z", insurance_liability_limit_cents: 100000000, commission_rate_bps: 1800 }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
              captures: { op_id: $.data.id }
            - call: "POST /shore-excursions/operators/${op_id}/safety-audits"
              payload: { audit_type: "INITIAL", conducted_on: "2026-07-20T00:00:00Z", raw_score: 82, critical_finding_count: 0 }
              as: OperatorVettingOfficer
              as_user_id: "u_aud_1"
            - call: "POST /shore-excursions/operators/${op_id}/vetting-actions"
              payload: { action: "SUBMIT" }
              as: OperatorVettingOfficer
              as_user_id: "u_vet_a"
