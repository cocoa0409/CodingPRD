  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_temporal_on_attest
        grounds:
          - validations[priority=7]
          - validations[priority=22]
          - errors[ERR_INVALID_READING_STATE]
          - errors[ERR_ATTESTATION_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Category pair state vs business_temporal: the reading is REJECTED (wrong from-state, priority 7)
          AND the logical clock is past the 30-day attestation window (priority 22) — the higher-priority
          state error ERR_INVALID_READING_STATE MUST win.
        test_recipe:
          setup: ["Generator ACTIVE; reading for 2026-07 REJECTED by the attester; logical clock advanced past period_end + 30 days (2026-09-15)"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
