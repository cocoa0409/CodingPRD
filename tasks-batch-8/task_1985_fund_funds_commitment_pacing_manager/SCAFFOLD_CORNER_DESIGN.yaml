  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_commitment_execute
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[commitment-execute-stale-program]", "errors[ERR_STALE_VERSION]", "validations[priority=6]"]
        distinguishing_aspect: "OCC on FoFProgram.version: after a successful execute bumps the version, a second execute of another commitment carrying the pre-bump expected_program_version is rejected with 412 ERR_STALE_VERSION; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["Program open, cash 30,000,000; two IC_APPROVED proposals (C1, C2) on two VENTURE vehicles of one manager"]
          setup_api_calls:
            - call: "POST /fof/staff-users"
