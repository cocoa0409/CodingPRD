      - name: autoship_pause_blocks_new_cycles_and_resume_restores_them
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/pharmacy/patients/{id}/autoship
          - validations.priority_9
          - errors.ERR_AUTOSHIP_PAUSED
          - entities.Patient.fields.pause_reason
        distinguishing_aspect: "One action endpoint with three verbs is driven through PAUSE and RESUME around a blocked write, showing the pause both cancels the DRAFT cycle and gates the create path, and that RESUME reopens the identical window."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; synchronized patient with one pouchable tablet"
            - "cycle C1 [2026-08-15, 2026-09-12) left DRAFT"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, refill_too_soon_threshold_pct: 75, coinsurance_pct: 20 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Rosa Klein", date_of_birth: "1954-09-09", email: "rosa.klein@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-25", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx1: $.data.id }
            - call: "POST /pharmacy/patients/${pt_id}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "BRIDGE_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /pharmacy/patients/${pt_id}/autoship"
              payload: { action: "PAUSE" }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { paused: $.data.autoship_status, reason: $.data.pause_reason }
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { err: $.data.error_id }
            - call: "POST /pharmacy/patients/${pt_id}/autoship"
              payload: { action: "RESUME" }
              as: PharmacyOperations
              captures: { resumed: $.data.autoship_status, reason_after: $.data.pause_reason }
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c2: $.data.id }
          assert:
            - "${paused} == PAUSED_PATIENT with ${reason} == PATIENT_REQUEST, and FillCycle.${c1}.packaging_status == CANCELLED"
            - "the blocked create returns ${err} == ERR_AUTOSHIP_PAUSED and no FillCycle row is added"
            - "${resumed} == ACTIVE, ${reason_after} == null and consecutive_missed_pickups == 0"
            - "the retried create succeeds: ${c2} covers the same [2026-08-15, 2026-09-12) window without tripping priority 28, because the CANCELLED ${c1} is excluded from the overlap scan"
            - "Patient.${pt_id}.version rises by exactly 1 per autoship call and GET /pharmacy/fill-cycles?patient_id=${pt_id} returns total_count 2"

      - name: reissue_mints_the_successor_cycle_and_the_credit
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/pharmacy/fill-cycles/{id}/reissue
        excluded_because:
          difficulty_instance: compensating_invariant / partial_reissue_conserves_every_billed_cent
          rationale: "That instance drives the reissue action end to end — successor cycle, replacement lines, credit memo, fee and the conservation identity — so a separate action-endpoint pass would only restate it."
      - name: adjudicate_action_holds_lines_and_stamps_dispenses
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/pharmacy/fill-cycles/{id}/adjudicate
        excluded_because:
          difficulty_instance: non_linear_state_machine / fill_cycle_insurance_and_packaging_dimensions_move_independently
          rationale: "The adjudicate action's full outcome matrix (CLEARED, EDITS_PENDING, REJECTED_TOO_SOON and the re-adjudication path) is asserted there."

  - section: errors
    instances:

      - name: every_entity_detail_read_has_its_own_not_found_error_id
        claim_type: not_found
        grounds:
          - validations.priority_4
