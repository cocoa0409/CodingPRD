              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "I1", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 5000 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_i_id: $.data.id, claim_i_v: $.data.version }
            - call: "POST /claims/${claim_i_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_i_id}/reprice"
              payload: { expected_claim_version: "${claim_i_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { det_i_id: $.data.id, claim_i_v: $.data.version }
            - call: "POST /claims/${claim_i_id}/appeals"
              payload: { determination_id: "${det_i_id}", appeal_reason: "units miscounted" }
              as: ProviderRep
              as_user_id: "${pr1_id}"
              captures: { ap_i_id: $.data.id }
            - call: "POST /appeals/${ap_i_id}/start-review"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /appeals/${ap_i_id}/resolve"
              payload: { outcome: "ADJUSTED", adjusted_amount_cents: 44000 }
              as: PayerRep
