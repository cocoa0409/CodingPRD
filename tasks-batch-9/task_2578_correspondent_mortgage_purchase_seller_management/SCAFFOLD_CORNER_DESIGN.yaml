      - name: cascading_side_effects_layer_is_covered_by_the_depth_probe
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: advice_settlement_cascades_advice_loan_commitment_seller_escrow
          rationale: |
            The depth probe already walks the full five-level chain from a single
            settle call (advice -> loan -> escrow transfer -> commitment fill and
            tolerance write-off -> seller net_funded and released MANDATORY
            exposure) and its ordering sensitivity, plus the compensating unwind
            in demand_satisfaction_unwinds_advice_escrow_and_net_funded. A
            breadth instance here would re-walk the same chain with no new
            distinguishing aspect.

      - name: dual_variant_pair_off_fee_layer_is_covered_by_the_depth_probe
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: pair_off_fee_mandatory_mark_to_market_vs_best_efforts_admin_only
          rationale: |
            Variant divergence and variant selection for the only dual-variant
            calculation in the scaffold are the depth probe's subject: the same
            unfulfilled notional and market price are run through the MANDATORY
            mark-to-market variant and the BEST_EFFORTS administrative-only
            variant and the delta is asserted. The breadth file instead pins the
            variant's boundaries (tolerance netting to zero billable, the flat
            admin fee, the 397400 MTM case) inside its calculation and endpoint
            instances.

      - name: rate_threshold_trigger_layer_is_covered_by_the_depth_probe
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: scorecard_defect_rate_loan_count_vs_upb_weighted
          rationale: |
            The cumulative defect-rate thresholds (WATCH at 1000 bps,
            SUSPENSION at 5000 bps) and their two competing denominators are
            probed in depth there, including the boundary rates and the standing
            action they trigger. The breadth file keeps only the guards around
            that trigger — the MIN_SCORED_LOANS empty-set guard and the
            period-close preconditions — so a second threshold instance would
            duplicate the depth probe.

