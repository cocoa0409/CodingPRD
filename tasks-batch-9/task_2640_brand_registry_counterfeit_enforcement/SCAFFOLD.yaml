# =============================================================================
# PRD Benchmark Scaffold — Brand Registry & Counterfeit Enforcement
# Difficulty band: BEYOND EXPERT (14 entities / 70 endpoints / 7 calculations /
#                  13 state machines / 3 OCC races / 36 error codes)
# Sections: §1.0 response envelope, §1.1 entities, §1.2 state machines,
#           §1.2.1 concurrency rules, §1.3 calculations, §1.4 validations,
#           §1.5 endpoints, §1.6 errors, §1.7 RBAC
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2640. Brand Registry & Counterfeit Enforcement (brand protection team): trademark registration prerequisites and marketplace brand enrollment with authorized representative designation, listing monitoring for counterfeit, copyright and trademark violations with automated image and text matching, test buy programs to substantiate infringement claims with evidence packages, takedown submission with counter-notice handling and marketplace decision timelines, seller identification, cease-and-desist correspondence and escalation to litigation, supply chain leak investigation to identify sources of diverted product, customs recordation and border seizure coordination, enforcement metrics on listing removal rate and repeat infringers

domain_name: brand-registry-counterfeit-enforcement
api_prefix: /brand-protection

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a top-level peer resource addressed at
  # `/brand-protection/<collection>/{id}`. Parent linkage is expressed purely by
  # foreign-key fields carried in request bodies; no entity is nested in a URL
  # path. Reverse navigation is always the filtered-list form
  # `GET /brand-protection/<children>?<fk_field>=...`.

  state_machine_shape: cyclic
  # Dominant shape is cyclic: TakedownSubmission loops
  # SUBMITTED → APPROVED_REMOVED → COUNTER_NOTICED → APPROVED_REMOVED and
  # REJECTED/REINSTATED → SUBMITTED (bounded by round_number <= 3).
  # Also present: parallel dimensions (MonitoredListing.monitor_status ×
  # MonitoredListing.enforcement_status; EnforcementCase.correspondence_status ×
  # EnforcementCase.litigation_status), branching (TestBuy authentication fork,
  # CounterNotice resolution fork), compound (Brand.status derived from its
  # enrollments; InfringementClaim.status bubbles up from its takedowns) and
  # fully derived (Seller.status is a pure function of cluster_strike_points).

  relationship_patterns:
    - one_to_many          # Brand → TrademarkRegistration / MarketplaceEnrollment / MonitoredListing
    - self_referential     # Seller.canonical_seller_id -> Seller.id (alias cluster, depth 1)
    - cross_aggregate      # strike attribution walks TakedownSubmission → InfringementClaim → MonitoredListing → Seller

  role_model: segregation_of_duties
  # The AuthorizedRepresentative that sent a case's cease-and-desist letter is
  # barred from authorizing litigation on that same case; authority is further
  # partitioned by AuthorizedRepresentative.authority_scope, and the marketplace
  # side of the conversation is owned by a distinct MarketplaceLiaison role.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# Global conventions that every table below relies on
# -----------------------------------------------------------------------------
global_conventions:
  logical_clock: |
    Every system-stamped datetime (created_at, updated_at, ordered_at,
    submitted_at, decided_at, filed_at, concluded_at, ...) is read from the
    logical clock, never from wall-clock time. The clock's startup default is
    exactly 2026-08-01T00:00:00Z and it only moves when
    POST /_clock/set_current_utc is called.
  decimal_arithmetic: |
    All monetary (integer cents), score (4 decimals) and strike-point
    (2 decimals) arithmetic is performed in exact decimal arithmetic, NOT binary
    floating point, with ROUND_HALF_UP at the pinned precision. Worked trap:
    12.55 * 0.50 = 6.275 -> 6.28 (a binary float implementation yields 6.27 and
    is wrong).
  list_ordering: |
    Every list endpoint returns rows ordered by `created_at` ASC and, when two
    rows share the same `created_at` (possible because the logical clock only
    moves on demand), by persistence sequence ASC — the order in which the
    server actually persisted the rows. `id` MUST NEVER participate in ordering,
    ranking, tie-breaking or any other observable decision.
  version_semantics: |
    `version` starts at 1 and increments by exactly 1 per mutating request that
    touches the row, even when that request both recomputes derived fields and
    satisfies an OCC contract. Cascaded side effects that touch other rows
    increment those rows' `version` by 1 as well.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Brand
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: brand name as it appears on the marketplace
        constraints: "1..120 chars, non-blank"
      - name: owner_legal_entity
        type: string
        source: input
        description: legal entity that owns the trademark portfolio
        constraints: "1..160 chars, non-blank"
      - name: home_jurisdiction
        type: string
        source: input
        description: ISO 3166-1 alpha-2 code of the brand owner's home jurisdiction
        constraints: "exactly 2 uppercase letters"
      - name: authorized_msrp_cents
        type: integer
        source: input
        description: brand-level authorized reference price in cents; the denominator of the price-deviation term of calculations.listing_match_score
        constraints: ">= 1"
      - name: enforcement_budget_cents
        type: integer
        source: input
        description: ceiling for cumulative test-buy spend on this brand
        default: 500000
        constraints: ">= 0"
      - name: enforcement_spend_cents
        type: integer
        source: computed
        description: "ledger mirror of calculations.test_buy_billable_total: sum of TestBuy.billable_total_cents over TestBuy rows whose claim resolves to this brand and whose status IN {ORDERED, RECEIVED, AUTHENTICATED_AUTHENTIC, AUTHENTICATED_COUNTERFEIT}"
        default: 0
        constraints: ">= 0, <= enforcement_budget_cents"
      - name: status
        type: enum
        source: computed
        description: "compound registry posture derived from this brand's MarketplaceEnrollment rows by calculations.brand_registry_posture"
        default: DRAFT
        constraints: "one of {DRAFT, ENROLLMENT_PENDING, ENROLLED, ENROLLMENT_LAPSED}"

  - name: TrademarkRegistration
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; the brand whose portfolio holds this registration"
      - name: registration_number
        type: string
        source: input
        description: registry-issued registration or application number
        constraints: "1..40 chars, unique per (jurisdiction, registration_number)"
      - name: jurisdiction
        type: string
        source: input
        description: ISO 3166-1 alpha-2 code of the issuing registry
        constraints: "exactly 2 uppercase letters"
      - name: nice_class
        type: integer
        source: input
        description: Nice classification class covered by this registration
        constraints: "1..45"
      - name: registration_date
        type: string
        source: input
        description: registry grant date, ISO 8601 date (YYYY-MM-DD)
        constraints: "valid calendar date"
      - name: expiry_date
        type: string
        source: input
        description: registry expiry date, ISO 8601 date (YYYY-MM-DD)
        constraints: "valid calendar date, strictly after registration_date"
      - name: principal_register
        type: boolean
        source: input
        description: true when the mark sits on the principal (not supplemental) register; prerequisite for customs recordation
      - name: status
        type: enum
        source: input
        description: "registry status at creation time; only PENDING and REGISTERED may be supplied, LAPSED is reached only by the sweep's auto-lapse step"
        constraints: "input value one of {PENDING, REGISTERED}; full domain {PENDING, REGISTERED, LAPSED}"

  - name: MarketplaceEnrollment
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; the enrolled brand"
      - name: asserted_registration_id
        type: string
        source: input
        description: "FK -> TrademarkRegistration.id; the registration asserted as the enrollment's legal basis"
      - name: marketplace_code
        type: enum
        source: input
        description: marketplace this enrollment covers
        constraints: "one of {AMZ, EBY, WLM}"
      - name: requested_nice_class
        type: integer
        source: input
        description: Nice class the brand asks the marketplace registry to cover
        constraints: "1..45"
      - name: enrollment_status
        type: enum
        source: computed
        description: enrollment lifecycle state driven by state_machines.MarketplaceEnrollment
        default: SUBMITTED
        constraints: "one of {SUBMITTED, ACTIVE, SUSPENDED, TERMINATED}"
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant of the SUBMITTED->ACTIVE transition, null while never activated
      - name: suspension_reason_code
        type: enum
        source: system
        description: why the enrollment left ACTIVE, null while never suspended
        constraints: "one of {MANUAL, REGISTRATION_LAPSED, MARKETPLACE_ACTION}"
      - name: superseded_by_enrollment_id
        type: string
        source: system
        description: "FK -> MarketplaceEnrollment.id; set on the losing row when a later enrollment for the same (brand_id, marketplace_code) supersedes it, null otherwise"

  - name: AuthorizedRepresentative
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> MarketplaceEnrollment.id; the enrollment this designation acts under"
      - name: authority_scope
        type: enum
        source: input
        description: "delegated authority; scope_set(SUBMIT_TAKEDOWN)={SUBMIT_TAKEDOWN}, scope_set(AUTHORIZE_LITIGATION)={AUTHORIZE_LITIGATION}, scope_set(BOTH)={SUBMIT_TAKEDOWN, AUTHORIZE_LITIGATION}"
        constraints: "one of {SUBMIT_TAKEDOWN, AUTHORIZE_LITIGATION, BOTH}"
      - name: effective_from
        type: datetime
        source: input
        description: inclusive start of the designation window (ISO 8601 UTC)
      - name: effective_to
        type: datetime
        source: input
        description: exclusive end of the designation window (ISO 8601 UTC); null means open-ended (treated as +infinity)
      - name: power_of_attorney_ref
        type: string
        source: input
        description: document reference substantiating the designation
        constraints: "1..80 chars, non-blank"
      - name: designation_status
        type: enum
        source: computed
        description: designation lifecycle state driven by state_machines.AuthorizedRepresentative
        default: DESIGNATED
        constraints: "one of {DESIGNATED, REVOKED}"
      - name: revoked_at
        type: datetime
        source: system
        description: logical-clock instant of revocation, null while DESIGNATED

  - name: Seller
    parent: null
    common_fields: true
    fields:
      - name: marketplace_code
        type: enum
        source: input
        description: marketplace on which this seller identity trades
        constraints: "one of {AMZ, EBY, WLM}"
      - name: seller_ref
        type: string
        source: input
        description: marketplace-assigned seller reference
        constraints: "1..40 chars, unique per (marketplace_code, seller_ref)"
      - name: legal_name
        type: string
        source: input
        description: legal name obtained through seller identification
        constraints: "1..160 chars, non-blank"
      - name: jurisdiction
        type: string
        source: input
        description: ISO 3166-1 alpha-2 code of the seller's declared jurisdiction
        constraints: "exactly 2 uppercase letters"
      - name: canonical_seller_id
        type: string
        source: system
        description: "FK -> Seller.id; set when this row is identified as an alias of another seller, null when this row is itself a cluster root; chains deeper than one hop are rejected"
      - name: standalone_strike_points
        type: number
        source: computed
        description: "STANDALONE variant of calculations.seller_strike_points — decayed strike points earned by this seller row alone"
        default: 0.00
        constraints: "2 decimals, 0.00..100.00"
      - name: cluster_strike_points
        type: number
        source: computed
        description: "CLUSTER variant of calculations.seller_strike_points — decayed strike points summed over the whole alias cluster; the escalation and blocking thresholds read this field"
        default: 0.00
        constraints: "2 decimals, 0.00..100.00"
      - name: status
        type: enum
        source: computed
        description: "pure function of cluster_strike_points per state_machines.Seller (BLOCKED >= 60.00, UNDER_INVESTIGATION >= 25.00, else ACTIVE)"
        default: ACTIVE
        constraints: "one of {ACTIVE, UNDER_INVESTIGATION, BLOCKED}"

  - name: MonitoredListing
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; brand whose rights the listing allegedly violates"
      - name: seller_id
        type: string
        source: input
        description: "FK -> Seller.id; seller that owns the listing"
      - name: marketplace_code
        type: enum
        source: input
        description: marketplace hosting the listing
        constraints: "one of {AMZ, EBY, WLM}"
      - name: listing_ref
        type: string
        source: input
        description: marketplace listing identifier
        constraints: "1..40 chars, unique per (marketplace_code, listing_ref)"
      - name: title_text
        type: string
        source: input
        description: listing title captured by the crawler, input to text matching
        constraints: "1..300 chars, non-blank"
      - name: image_hash
        type: string
        source: input
        description: perceptual hash of the listing hero image, input to image matching
        constraints: "1..80 chars, non-blank"
      - name: price_cents
        type: integer
        source: input
        description: listing price in cents, numerator of the price-deviation term
        constraints: ">= 0"
      - name: nice_class
        type: integer
        source: input
        description: Nice class the listed product falls in; compared against TrademarkRegistration.nice_class for registration strength
        constraints: "1..45"
      - name: image_match_score
        type: number
        source: system
        description: last image-matcher score supplied to POST /listings/{id}/screen, null before the first screen
        constraints: "4 decimals, 0.0000..1.0000"
      - name: text_match_score
        type: number
        source: system
        description: last text-matcher score supplied to POST /listings/{id}/screen, null before the first screen
        constraints: "4 decimals, 0.0000..1.0000"
      - name: price_deviation_factor
        type: number
        source: computed
        description: "clamped discount depth versus Brand.authorized_msrp_cents, per calculations.listing_match_score"
        constraints: "4 decimals, 0.0000..1.0000"
      - name: match_score
        type: number
        source: computed
        description: "output of calculations.listing_match_score; the FLAG threshold reads this field"
        constraints: "4 decimals, 0.0000..1.0000"
      - name: violation_type
        type: enum
        source: computed
        description: "violation classification assigned by calculations.listing_match_score's ordered rule list; NONE whenever monitor_status is NEW or CLEARED"
        default: NONE
        constraints: "one of {NONE, COUNTERFEIT, COPYRIGHT, TRADEMARK}"
      - name: monitor_status
        type: enum
        source: computed
        description: "first parallel state dimension — screening posture, driven by state_machines.MonitoredListing"
        default: NEW
        constraints: "one of {NEW, CLEARED, FLAGGED}"
      - name: enforcement_status
        type: enum
        source: computed
        description: "second parallel state dimension — enforcement posture, evolves independently of monitor_status"
        default: NONE
        constraints: "one of {NONE, CLAIM_OPEN, TAKEDOWN_PENDING, REMOVED, REINSTATED}"

  - name: InfringementClaim
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; asserting brand"
      - name: listing_id
        type: string
        source: input
        description: "FK -> MonitoredListing.id; the flagged listing the claim is filed against"
      - name: asserted_registration_id
        type: string
        source: input
        description: "FK -> TrademarkRegistration.id; registration asserted as the claim's legal basis"
      - name: claimed_violation_type
        type: enum
        source: input
        description: violation the brand asserts; selects the required evidence-item set
        constraints: "one of {COUNTERFEIT, COPYRIGHT, TRADEMARK}"
      - name: registration_strength
        type: number
        source: computed
        description: "registration term of calculations.claim_substantiation_score (1.00 / 0.60 / 0.30)"
        constraints: "2 decimals, one of {1.00, 0.60, 0.30}"
      - name: preliminary_score
        type: number
        source: computed
        description: "PRELIMINARY variant of calculations.claim_substantiation_score, stamped at claim creation and never recomputed afterwards"
        constraints: "2 decimals, 0.00..100.00"
      - name: substantiation_score
        type: number
        source: computed
        description: "FULL variant of calculations.claim_substantiation_score, recomputed on test-buy authentication and on POST /claims/{id}/substantiate"
        default: 0.00
        constraints: "2 decimals, 0.00..100.00"
      - name: dismissal_reason_code
        type: enum
        source: system
        description: why the claim was dismissed, null while not DISMISSED
        constraints: "one of {ANALYST_WITHDRAWN, TEST_BUY_AUTHENTIC, REGISTRATION_INVALID}"
      - name: status
        type: enum
        source: computed
        description: claim lifecycle state driven by state_machines.InfringementClaim; ENFORCED/SUBSTANTIATED bubble up from this claim's takedowns
        default: DRAFT
        constraints: "one of {DRAFT, SUBSTANTIATED, ENFORCED, DISMISSED}"

  - name: TestBuy
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> InfringementClaim.id; claim this purchase substantiates"
      - name: seller_id
        type: string
        source: computed
        description: "FK -> Seller.id; copied at creation from the claim's listing (InfringementClaim.listing_id -> MonitoredListing.seller_id) so the cooling-period rule can be evaluated per seller"
      - name: order_ref
        type: string
        source: input
        description: marketplace order reference of the covert purchase
        constraints: "1..40 chars, non-blank"
      - name: purchase_price_cents
        type: integer
        source: input
        description: price paid for the sample
        constraints: ">= 0"
      - name: shipping_cents
        type: integer
        source: input
        description: shipping paid for the sample
        constraints: ">= 0"
      - name: lab_fee_cents
        type: integer
        source: input
        description: authentication laboratory fee booked with the order
        constraints: ">= 0"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "purchase_price_cents + shipping_cents + lab_fee_cents, per calculations.test_buy_billable_total"
        constraints: ">= 0"
      - name: service_fee_rate
        type: number
        source: computed
        description: "tier rate selected from subtotal_cents ONLY, per calculations.test_buy_billable_total"
        constraints: "2 decimals, one of {0.15, 0.12, 0.09, 0.06}"
      - name: service_fee_cents
        type: integer
        source: computed
        description: "ROUND_HALF_UP(subtotal_cents * service_fee_rate) in whole cents"
        constraints: ">= 0"
      - name: billable_total_cents
        type: integer
        source: computed
        description: "subtotal_cents + service_fee_cents; the amount debited from Brand.enforcement_spend_cents"
        constraints: ">= 0"
      - name: ordered_at
        type: datetime
        source: system
        description: logical-clock instant of creation; anchors the seller cooling-period interval
      - name: received_at
        type: datetime
        source: system
        description: logical-clock instant of the ORDERED->RECEIVED transition, null before receipt
      - name: lot_code
        type: string
        source: input
        description: lot / batch code found on the received sample, supplied at receipt; the traceability key for diversion investigations
        constraints: "1..40 chars, non-blank"
      - name: chain_of_custody_ref
        type: string
        source: input
        description: "custody log reference optionally recorded at receipt; stays null when the receipt omitted it, in which case authentication is refused and a claim's test-buy bonus never counts"
        constraints: "1..80 chars, non-blank"
      - name: authentication_result
        type: enum
        source: input
        description: laboratory verdict supplied to POST /test-buys/{id}/authenticate, null before authentication
        constraints: "one of {AUTHENTIC, COUNTERFEIT}"
      - name: lab_ref
        type: string
        source: input
        description: laboratory report reference, supplied at authentication
        constraints: "1..80 chars, non-blank"
      - name: status
        type: enum
        source: computed
        description: purchase lifecycle state driven by state_machines.TestBuy (branching fork at authentication)
        default: ORDERED
        constraints: "one of {ORDERED, RECEIVED, AUTHENTICATED_AUTHENTIC, AUTHENTICATED_COUNTERFEIT, CANCELLED}"

  - name: EvidencePackage
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> InfringementClaim.id; claim this package substantiates"
      - name: package_ref
        type: string
        source: input
        description: internal package reference
        constraints: "1..40 chars, non-blank"
      - name: items
        type: array
        source: system
        description: "append-only list of evidence items; each element is { item_type, item_ref, added_at }, appended by POST /evidence-packages/{id}/items and frozen once SEALED"
        default: []
      - name: item_count
        type: integer
        source: computed
        description: length of items
        default: 0
        constraints: ">= 0"
      - name: required_type_coverage
        type: integer
        source: computed
        description: "count of distinct required item types present in items, per calculations.evidence_completeness_score"
        default: 0
        constraints: ">= 0"
      - name: completeness_score
        type: number
        source: computed
        description: "output of calculations.evidence_completeness_score; the seal gate reads this field"
        default: 0.0000
        constraints: "4 decimals, 0.0000..1.0000"
      - name: sealed_at
        type: datetime
        source: system
        description: logical-clock instant of sealing, null while not SEALED
      - name: status
        type: enum
        source: computed
        description: package lifecycle state driven by state_machines.EvidencePackage
        default: ASSEMBLING
        constraints: "one of {ASSEMBLING, SEALED, WITHDRAWN}"

  - name: TakedownSubmission
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> MarketplaceEnrollment.id; enrollment through which the notice is filed"
      - name: claim_id
        type: string
        source: input
        description: "FK -> InfringementClaim.id; substantiated claim being enforced"
      - name: evidence_package_id
        type: string
        source: input
        description: "FK -> EvidencePackage.id; sealed package attached to the current round"
      - name: submitted_by_rep_id
        type: string
        source: system
        description: "FK -> AuthorizedRepresentative.id; representative that performed the latest submit/resubmit, null while DRAFT"
      - name: round_number
        type: integer
        source: computed
        description: submission round; 1 on first submit, incremented by every resubmit, capped at 3
        default: 0
        constraints: "0..3"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the latest submit/resubmit, null while DRAFT
      - name: decision_due_at
        type: datetime
        source: computed
        description: "marketplace decision deadline from calculations.marketplace_decision_deadline, recomputed on every submit/resubmit"
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the latest marketplace decision, null before the first decision
      - name: counter_notice_deadline_at
        type: datetime
        source: computed
        description: "seller counter-notice filing deadline, set when the marketplace decision is REMOVED, per calculations.marketplace_decision_deadline"
      - name: marketplace_case_ref
        type: string
        source: input
        description: marketplace-side case reference supplied with the decision, null before the first decision
        constraints: "1..60 chars, non-blank"
      - name: status
        type: enum
        source: computed
        description: notice lifecycle state driven by state_machines.TakedownSubmission (cyclic)
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, APPROVED_REMOVED, REJECTED, COUNTER_NOTICED, REINSTATED, WITHDRAWN}"

  - name: CounterNotice
    parent: null
    common_fields: true
    fields:
      - name: takedown_id
        type: string
        source: input
        description: "FK -> TakedownSubmission.id; the removal being contested"
      - name: seller_id
        type: string
        source: input
        description: "FK -> Seller.id; seller that swore the counter notice"
      - name: sworn_statement_ref
        type: string
        source: input
        description: reference to the seller's sworn statement
        constraints: "1..80 chars, non-blank"
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant of filing
      - name: response_due_at
        type: datetime
        source: computed
        description: "brand rebuttal deadline = filed_at + REBUTTAL_WINDOW_BUSINESS_DAYS business days, per calculations.marketplace_decision_deadline"
      - name: rebuttal_ref
        type: string
        source: input
        description: reference to the brand's rebuttal, supplied when resolution is REBUTTED
        constraints: "1..80 chars, non-blank"
      - name: resolved_at
        type: datetime
        source: system
        description: logical-clock instant of resolution or expiry, null while FILED
      - name: status
        type: enum
        source: computed
        description: counter-notice state driven by state_machines.CounterNotice (branching fork at resolution)
        default: FILED
        constraints: "one of {FILED, REBUTTED, ACCEPTED, EXPIRED}"

  - name: EnforcementCase
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; brand pursuing the seller"
      - name: seller_id
        type: string
        source: input
        description: "FK -> Seller.id; cluster-root seller under enforcement"
      - name: originating_takedown_id
        type: string
        source: system
        description: "FK -> TakedownSubmission.id; the takedown whose removal cascade auto-opened the case, null when the case was opened manually"
      - name: cease_desist_sent_by_rep_id
        type: string
        source: system
        description: "FK -> AuthorizedRepresentative.id; representative that sent the cease-and-desist letter, null while none was sent; segregation of duties compares this field with the litigation authorizer"
      - name: litigation_authorized_by_rep_id
        type: string
        source: system
        description: "FK -> AuthorizedRepresentative.id; representative that authorized litigation, null while unauthorized"
      - name: letter_ref
        type: string
        source: input
        description: cease-and-desist letter reference, null while none was sent
        constraints: "1..80 chars, non-blank"
      - name: cd_sent_at
        type: datetime
        source: system
        description: logical-clock instant the cease-and-desist letter was sent, null while none was sent
      - name: cd_response_due_at
        type: datetime
        source: computed
        description: "cease-and-desist response deadline = cd_sent_at + CD_RESPONSE_BUSINESS_DAYS business days, per calculations.marketplace_decision_deadline"
      - name: response_kind
        type: enum
        source: input
        description: nature of the seller's response, null while none recorded
        constraints: "one of {DENIAL, SETTLEMENT_OFFER, COMPLIANCE_UNDERTAKING}"
      - name: correspondence_status
        type: enum
        source: computed
        description: "first parallel state dimension — correspondence track, driven by state_machines.EnforcementCase"
        default: NONE
        constraints: "one of {NONE, CD_SENT, CD_RESPONDED, CD_IGNORED}"
      - name: litigation_status
        type: enum
        source: computed
        description: "second parallel state dimension — litigation track, evolves independently of correspondence_status once it is unblocked"
        default: NONE
        constraints: "one of {NONE, AUTHORIZED, FILED, SETTLED, DISMISSED}"
      - name: case_status
        type: enum
        source: computed
        description: "compound roll-up of the two tracks: IN_LITIGATION once litigation_status is AUTHORIZED or FILED, CLOSED once the case is closed, else OPEN"
        default: OPEN
        constraints: "one of {OPEN, IN_LITIGATION, CLOSED}"
      - name: docket_ref
        type: string
        source: input
        description: court docket reference, null before filing
        constraints: "1..80 chars, non-blank"
      - name: closure_outcome
        type: enum
        source: input
        description: closure outcome, null while not CLOSED
        constraints: "one of {SETTLED, DISMISSED, NO_ACTION}"

  - name: CustomsRecordation
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; brand recording the mark with customs"
      - name: registration_id
        type: string
        source: input
        description: "FK -> TrademarkRegistration.id; registration presented to customs; must sit on the principal register"
      - name: customs_authority_code
        type: enum
        source: input
        description: customs authority the mark is recorded with
        constraints: "one of {US_CBP, EU_TAXUD, CN_GACC}"
      - name: nice_class
        type: integer
        source: input
        description: Nice class the recordation covers
        constraints: "1..45"
      - name: recorded_on
        type: string
        source: input
        description: inclusive first day of the recordation coverage window (YYYY-MM-DD)
      - name: expires_on
        type: string
        source: input
        description: inclusive last day of the recordation coverage window (YYYY-MM-DD)
        constraints: "valid calendar date, >= recorded_on"
      - name: recordation_number
        type: string
        source: input
        description: customs-issued recordation number, supplied at the DRAFT->RECORDED transition
        constraints: "1..40 chars, non-blank"
      - name: status
        type: enum
        source: computed
        description: recordation lifecycle state driven by state_machines.CustomsRecordation
        default: DRAFT
        constraints: "one of {DRAFT, RECORDED, EXPIRED}"

  - name: DiversionInvestigation
    parent: null
    common_fields: true
    fields:
      - name: brand_id
        type: string
        source: input
        description: "FK -> Brand.id; brand whose distribution chain leaked"
      - name: recordation_id
        type: string
        source: input
        description: "FK -> CustomsRecordation.id; recordation under which the border detention was made, required when source_kind is BORDER_SEIZURE, null otherwise"
      - name: source_test_buy_id
        type: string
        source: input
        description: "FK -> TestBuy.id; counterfeit-confirmed test buy that produced the lot code, required when source_kind is TEST_BUY, null otherwise"
      - name: seller_id
        type: string
        source: input
        description: "FK -> Seller.id; seller the diverted goods were shipped by, null when the shipper could not be identified"
      - name: source_kind
        type: enum
        source: input
        description: how the diverted product entered the investigation
        constraints: "one of {BORDER_SEIZURE, TEST_BUY}"
      - name: lot_code
        type: string
        source: input
        description: lot / batch code being traced; must already be attested by a counterfeit-confirmed test buy or by an existing confirmed diversion
        constraints: "1..40 chars, non-blank"
      - name: seizure_ref
        type: string
        source: input
        description: customs detention notice reference, required when source_kind is BORDER_SEIZURE
        constraints: "1..60 chars, non-blank"
      - name: port_code
        type: string
        source: input
        description: port of detention, required when source_kind is BORDER_SEIZURE
        constraints: "1..12 chars, non-blank"
      - name: seized_qty
        type: integer
        source: input
        description: units detained, required when source_kind is BORDER_SEIZURE
        constraints: ">= 1"
      - name: declared_value_cents
        type: integer
        source: input
        description: declared customs value of the detained units, required when source_kind is BORDER_SEIZURE
        constraints: ">= 0"
      - name: detention_notice_at
        type: datetime
        source: system
        description: logical-clock instant the investigation was opened; anchors the brand response window
      - name: response_due_at
        type: datetime
        source: computed
        description: "brand evidence deadline = detention_notice_at + DIVERSION_RESPONSE_BUSINESS_DAYS business days, per calculations.marketplace_decision_deadline"
      - name: evidence_ref
        type: string
        source: input
        description: brand-side evidence bundle reference, supplied at evidence submission
        constraints: "1..80 chars, non-blank"
      - name: suspected_distributor_ref
        type: string
        source: input
        description: authorized distributor suspected of leaking the lot, supplied at evidence submission
        constraints: "1..80 chars, non-blank"
      - name: findings_ref
        type: string
        source: input
        description: conclusion memo reference, supplied at conclusion
        constraints: "1..80 chars, non-blank"
      - name: concluded_at
        type: datetime
        source: system
        description: logical-clock instant of conclusion; the effective instant of a SEIZURE_CONFIRMED strike
      - name: status
        type: enum
        source: computed
        description: investigation lifecycle state driven by state_machines.DiversionInvestigation (branching fork at conclusion)
        default: OPEN
        constraints: "one of {OPEN, EVIDENCE_SUBMITTED, DIVERSION_CONFIRMED, RELEASED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- compound: Brand.status is a pure function of its enrollments -----------
  - entity: Brand
    initial_state: DRAFT
    terminal_states: []
    note: |
      Brand.status is never supplied by a client. After every mutation of any
      MarketplaceEnrollment row belonging to the brand, the server re-evaluates
      calculations.brand_registry_posture and writes the result. The precedence
      order is fixed: ACTIVE beats SUBMITTED beats "any enrollment at all".
    transitions:
      - from: DRAFT
        to: ENROLLMENT_PENDING
        trigger: "POST /brand-protection/enrollments (first enrollment for this brand)"
        actor: BrandAdministrator
        preconditions:
          - "brand exists"
          - "the new enrollment row was persisted with enrollment_status == SUBMITTED"
        side_effects:
          - "Brand.status recomputed to ENROLLMENT_PENDING (no ACTIVE enrollment exists, at least one SUBMITTED does)"
          - "increments Brand.version by 1"
      - from: ENROLLMENT_PENDING
        to: ENROLLED
        trigger: "POST /brand-protection/enrollments/{enrollmentId}/activate"
        actor: BrandAdministrator
        preconditions:
          - "at least one MarketplaceEnrollment with brand_id == Brand.id has enrollment_status == ACTIVE after the activation"
        side_effects:
          - "Brand.status = ENROLLED"
          - "increments Brand.version by 1"
      - from: ENROLLED
        to: ENROLLMENT_PENDING
        trigger: "system — recompute after an enrollment leaves ACTIVE (suspend, supersede) while a SUBMITTED enrollment remains"
        actor: system
        preconditions:
          - "no MarketplaceEnrollment with brand_id == Brand.id has enrollment_status == ACTIVE"
          - "at least one has enrollment_status == SUBMITTED"
        side_effects:
          - "Brand.status = ENROLLMENT_PENDING"
          - "increments Brand.version by 1"
      - from: ENROLLED
        to: ENROLLMENT_LAPSED
        trigger: "system — recompute after the last ACTIVE enrollment is suspended, superseded or auto-suspended by the sweep"
        actor: system
        preconditions:
          - "no MarketplaceEnrollment with brand_id == Brand.id has enrollment_status IN {ACTIVE, SUBMITTED}"
          - "at least one MarketplaceEnrollment with brand_id == Brand.id exists"
        side_effects:
          - "Brand.status = ENROLLMENT_LAPSED"
          - "increments Brand.version by 1"
      - from: ENROLLMENT_PENDING
        to: ENROLLMENT_LAPSED
        trigger: "system — recompute after the last SUBMITTED enrollment is superseded"
        actor: system
        preconditions:
          - "no MarketplaceEnrollment with brand_id == Brand.id has enrollment_status IN {ACTIVE, SUBMITTED}"
        side_effects:
          - "Brand.status = ENROLLMENT_LAPSED"
          - "increments Brand.version by 1"
      - from: ENROLLMENT_LAPSED
        to: ENROLLMENT_PENDING
        trigger: "POST /brand-protection/enrollments (re-enrollment after every prior enrollment left ACTIVE/SUBMITTED)"
        actor: BrandAdministrator
        preconditions:
          - "the new enrollment row was persisted with enrollment_status == SUBMITTED"
        side_effects:
          - "Brand.status = ENROLLMENT_PENDING"
          - "increments Brand.version by 1"

  # --- enrollment lifecycle with supersede + cascade --------------------------
  - entity: MarketplaceEnrollment
    initial_state: SUBMITTED
    terminal_states: [TERMINATED]
    transitions:
      - from: SUBMITTED
        to: ACTIVE
        trigger: "POST /brand-protection/enrollments/{enrollmentId}/activate"
        actor: BrandAdministrator
        preconditions:
          - "enrollment_status == SUBMITTED"
          - "the asserted TrademarkRegistration.status == REGISTERED (cross-entity gate; PENDING or LAPSED is rejected with ERR_REGISTRATION_NOT_ELIGIBLE)"
          - "the asserted TrademarkRegistration.expiry_date >= the logical clock's calendar date"
          - "the asserted TrademarkRegistration.nice_class == MarketplaceEnrollment.requested_nice_class"
        side_effects:
          - "activated_at = logical clock now"
          - "Brand.status recomputed (ENROLLMENT_PENDING -> ENROLLED)"
          - "increments MarketplaceEnrollment.version and Brand.version by 1 each"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /brand-protection/enrollments/{enrollmentId}/suspend"
        actor: BrandAdministrator | MarketplaceLiaison
        preconditions:
          - "enrollment_status == ACTIVE"
        side_effects:
          - "suspension_reason_code = the supplied reason_code"
          - "CASCADE L1 (because the enrollment left ACTIVE): every TakedownSubmission with enrollment_id == this enrollment and status IN {DRAFT, SUBMITTED} -> WITHDRAWN"
          - "CASCADE L2 (because those takedowns became WITHDRAWN): for each of them, the listing reached through claim_id -> InfringementClaim.listing_id whose enforcement_status == TAKEDOWN_PENDING -> enforcement_status = CLAIM_OPEN"
          - "CASCADE L3 (because those listings left TAKEDOWN_PENDING): every InfringementClaim with listing_id == that listing and status == ENFORCED -> SUBSTANTIATED"
          - "Brand.status recomputed"
          - "increments version by 1 on every row touched by L1/L2/L3 and on Brand"
      - from: SUBMITTED
        to: TERMINATED
        trigger: "POST /brand-protection/enrollments (a later enrollment for the same (brand_id, marketplace_code) supersedes this row)"
        actor: BrandAdministrator
        preconditions:
          - "enrollment_status == SUBMITTED"
          - "the incoming request carries a non-stale expected_brand_version"
        side_effects:
          - "superseded_by_enrollment_id = the new enrollment's id"
          - "every AuthorizedRepresentative with enrollment_id == this row and designation_status == DESIGNATED -> REVOKED"
          - "Brand.status recomputed"
          - "increments version by 1 on this row, on each revoked representative and on Brand"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /brand-protection/enrollments (a later enrollment for the same (brand_id, marketplace_code) supersedes this row)"
        actor: BrandAdministrator
        preconditions:
          - "enrollment_status == SUSPENDED"
        side_effects:
          - "superseded_by_enrollment_id = the new enrollment's id"
          - "every AuthorizedRepresentative with enrollment_id == this row and designation_status == DESIGNATED -> REVOKED"
          - "Brand.status recomputed"
          - "increments version by 1 on this row, on each revoked representative and on Brand"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — sweep step 1 auto-lapse of the asserted registration"
        actor: system
        preconditions:
          - "enrollment_status == ACTIVE"
          - "the asserted TrademarkRegistration transitioned REGISTERED -> LAPSED in the same sweep"
        side_effects:
          - "suspension_reason_code = REGISTRATION_LAPSED"
          - "the same L1/L2/L3 cascade as the manual suspension"
          - "Brand.status recomputed"
          - "increments version by 1 on every row touched"

  # --- registration: input-seeded, auto-lapsed by the sweep -------------------
  - entity: TrademarkRegistration
    initial_state: PENDING
    terminal_states: [LAPSED]
    note: |
      A registration row is created either PENDING or REGISTERED (client-supplied);
      PENDING -> REGISTERED is not offered as an API operation in this version, so
      a brand that must enroll creates the row already REGISTERED. LAPSED is only
      reachable from REGISTERED through the sweep's auto-lapse step.
    transitions:
      - from: REGISTERED
        to: LAPSED
        trigger: "POST /brand-protection/ops/run-enforcement-sweep (step 1)"
        actor: system
        preconditions:
          - "status == REGISTERED"
          - "expiry_date < the logical clock's calendar date"
        side_effects:
          - "status = LAPSED"
          - "CASCADE (because the registration lapsed): every MarketplaceEnrollment with asserted_registration_id == this row and enrollment_status == ACTIVE -> SUSPENDED with suspension_reason_code = REGISTRATION_LAPSED, which in turn runs the enrollment suspension cascade L1/L2/L3"
          - "increments version by 1 on every row touched"

  # --- representative designation --------------------------------------------
  - entity: AuthorizedRepresentative
    initial_state: DESIGNATED
    terminal_states: [REVOKED]
    transitions:
      - from: DESIGNATED
        to: REVOKED
        trigger: "POST /brand-protection/representatives/{representativeId}/revoke"
        actor: BrandAdministrator
        preconditions:
          - "designation_status == DESIGNATED"
        side_effects:
          - "revoked_at = logical clock now"
          - "the (enrollment_id, scope_set) occupancy this row held is released, so a new designation may cover an overlapping window"
          - "increments version by 1"
      - from: DESIGNATED
        to: REVOKED
        trigger: "system — the owning enrollment is superseded (-> TERMINATED)"
        actor: system
        preconditions:
          - "designation_status == DESIGNATED"
          - "the owning MarketplaceEnrollment transitioned to TERMINATED in the same request"
        side_effects:
          - "revoked_at = logical clock now"
          - "increments version by 1"

  # --- seller status is a pure function of cluster_strike_points --------------
  - entity: Seller
    initial_state: ACTIVE
    terminal_states: []
    note: |
      Every recompute of calculations.seller_strike_points rewrites `status` for
      EVERY member of the alias cluster from the cluster total, so all members
      always share the same status. Recomputes are triggered by: link-alias, a
      REMOVED marketplace decision, a counter-notice resolution or expiry, a
      confirmed diversion, the sweep's CD_IGNORED step and the sweep's decay step.
    transitions:
      - from: ACTIVE
        to: UNDER_INVESTIGATION
        trigger: "system — recompute of cluster_strike_points"
        actor: system
        preconditions: ["cluster_strike_points >= 25.00", "cluster_strike_points < 60.00"]
        side_effects:
          - "status = UNDER_INVESTIGATION for every cluster member"
          - "increments version by 1 on every cluster member whose status or points changed"
      - from: ACTIVE
        to: BLOCKED
        trigger: "system — recompute of cluster_strike_points"
        actor: system
        preconditions: ["cluster_strike_points >= 60.00"]
        side_effects:
          - "status = BLOCKED for every cluster member"
          - "increments version by 1 on every cluster member whose status or points changed"
      - from: UNDER_INVESTIGATION
        to: BLOCKED
        trigger: "system — recompute of cluster_strike_points"
        actor: system
        preconditions: ["cluster_strike_points >= 60.00"]
        side_effects:
          - "status = BLOCKED for every cluster member"
          - "increments version by 1 on every cluster member whose status or points changed"
      - from: UNDER_INVESTIGATION
        to: ACTIVE
        trigger: "system — recompute of cluster_strike_points after a strike reversal or decay step"
        actor: system
        preconditions: ["cluster_strike_points < 25.00"]
        side_effects:
          - "status = ACTIVE for every cluster member"
          - "increments version by 1 on every cluster member whose status or points changed"
      - from: BLOCKED
        to: UNDER_INVESTIGATION
        trigger: "system — recompute of cluster_strike_points after a strike reversal or decay step"
        actor: system
        preconditions: ["cluster_strike_points >= 25.00", "cluster_strike_points < 60.00"]
        side_effects:
          - "status = UNDER_INVESTIGATION for every cluster member"
          - "increments version by 1 on every cluster member whose status or points changed"
      - from: BLOCKED
        to: ACTIVE
        trigger: "system — recompute of cluster_strike_points after a strike reversal or decay step"
        actor: system
        preconditions: ["cluster_strike_points < 25.00"]
        side_effects:
          - "status = ACTIVE for every cluster member"
          - "increments version by 1 on every cluster member whose status or points changed"

  # --- PARALLEL DIMENSIONS: screening posture x enforcement posture -----------
  - entity: MonitoredListing
    initial_state: "NEW / NONE"
    terminal_states: []
    note: |
      MonitoredListing carries two independent state dimensions on the same row:
      `monitor_status` (NEW -> CLEARED/FLAGGED, re-screenable in both directions)
      and `enforcement_status` (NONE -> CLAIM_OPEN -> TAKEDOWN_PENDING ->
      REMOVED -> REINSTATED). A re-screen may flip monitor_status FLAGGED ->
      CLEARED while enforcement_status stays REMOVED, and a marketplace decision
      may flip enforcement_status while monitor_status stays FLAGGED. The single
      coupling between the dimensions is the guard on re-screening while a notice
      is pending, and the requirement that a claim may only be filed on a listing
      whose monitor_status == FLAGGED.
    transitions:
      - from: "monitor_status=NEW"
        to: "monitor_status=FLAGGED"
        trigger: "POST /brand-protection/listings/{listingId}/screen"
        actor: EnforcementAnalyst
        preconditions:
          - "monitor_status IN {NEW, CLEARED, FLAGGED}"
          - "enforcement_status != TAKEDOWN_PENDING (cross-dimension guard)"
          - "calculations.listing_match_score output >= 0.7000"
        side_effects:
          - "image_match_score / text_match_score persisted from the request"
          - "price_deviation_factor, match_score recomputed"
          - "violation_type assigned by the ordered classification rules"
          - "increments version by 1"
      - from: "monitor_status=NEW"
        to: "monitor_status=CLEARED"
        trigger: "POST /brand-protection/listings/{listingId}/screen"
        actor: EnforcementAnalyst
        preconditions:
          - "monitor_status IN {NEW, CLEARED, FLAGGED}"
          - "enforcement_status != TAKEDOWN_PENDING"
          - "calculations.listing_match_score output < 0.7000"
        side_effects:
          - "match_score recomputed, violation_type reset to NONE"
          - "increments version by 1"
      - from: "monitor_status=FLAGGED"
        to: "monitor_status=CLEARED"
        trigger: "POST /brand-protection/listings/{listingId}/screen (re-screen with weaker matcher output)"
        actor: EnforcementAnalyst
        preconditions:
          - "enforcement_status != TAKEDOWN_PENDING"
          - "calculations.listing_match_score output < 0.7000"
        side_effects:
          - "violation_type reset to NONE; enforcement_status is left untouched (dimensions are independent)"
          - "increments version by 1"
      - from: "monitor_status=CLEARED"
        to: "monitor_status=FLAGGED"
        trigger: "POST /brand-protection/listings/{listingId}/screen (re-screen with stronger matcher output)"
        actor: EnforcementAnalyst
        preconditions:
          - "enforcement_status != TAKEDOWN_PENDING"
          - "calculations.listing_match_score output >= 0.7000"
        side_effects:
          - "violation_type reassigned; enforcement_status is left untouched"
          - "increments version by 1"
      - from: "enforcement_status=NONE"
        to: "enforcement_status=CLAIM_OPEN"
        trigger: "POST /brand-protection/claims"
        actor: EnforcementAnalyst
        preconditions:
          - "monitor_status == FLAGGED"
          - "no InfringementClaim with listing_id == this listing has status IN {DRAFT, SUBSTANTIATED, ENFORCED}"
        side_effects:
          - "enforcement_status = CLAIM_OPEN"
          - "increments version by 1"
      - from: "enforcement_status=CLAIM_OPEN"
        to: "enforcement_status=NONE"
        trigger: "POST /brand-protection/claims/{claimId}/dismiss, or the AUTHENTIC branch of POST /brand-protection/test-buys/{testBuyId}/authenticate"
        actor: EnforcementAnalyst | system
        preconditions:
          - "after the dismissal, no InfringementClaim with listing_id == this listing has status IN {DRAFT, SUBSTANTIATED, ENFORCED}"
        side_effects:
          - "enforcement_status = NONE"
          - "increments version by 1"
      - from: "enforcement_status=CLAIM_OPEN"
        to: "enforcement_status=TAKEDOWN_PENDING"
        trigger: "POST /brand-protection/takedowns/{takedownId}/submit"
        actor: AuthorizedRepresentative
        preconditions:
          - "enforcement_status == CLAIM_OPEN"
        side_effects:
          - "enforcement_status = TAKEDOWN_PENDING"
          - "increments version by 1"
      - from: "enforcement_status=REINSTATED"
        to: "enforcement_status=TAKEDOWN_PENDING"
        trigger: "POST /brand-protection/takedowns/{takedownId}/resubmit"
        actor: AuthorizedRepresentative
        preconditions:
          - "enforcement_status IN {CLAIM_OPEN, REINSTATED}"
        side_effects:
          - "enforcement_status = TAKEDOWN_PENDING"
          - "increments version by 1"
      - from: "enforcement_status=TAKEDOWN_PENDING"
        to: "enforcement_status=REMOVED"
        trigger: "system — POST /brand-protection/takedowns/{takedownId}/marketplace-decision with decision REMOVED"
        actor: system
        preconditions:
          - "enforcement_status == TAKEDOWN_PENDING"
        side_effects:
          - "enforcement_status = REMOVED"
          - "this transition is CASCADE L2 of the removal chain and itself causes CASCADE L3 (a TAKEDOWN_REMOVAL strike on the listing's seller)"
          - "increments version by 1"
      - from: "enforcement_status=TAKEDOWN_PENDING"
        to: "enforcement_status=CLAIM_OPEN"
        trigger: "system — POST /brand-protection/takedowns/{takedownId}/marketplace-decision with decision REJECTED, or the enrollment-suspension cascade"
        actor: system
        preconditions:
          - "enforcement_status == TAKEDOWN_PENDING"
        side_effects:
          - "enforcement_status = CLAIM_OPEN"
          - "increments version by 1"
      - from: "enforcement_status=REMOVED"
        to: "enforcement_status=REINSTATED"
        trigger: "system — a counter notice on the listing's takedown is ACCEPTED or EXPIRED"
        actor: system
        preconditions:
          - "enforcement_status == REMOVED"
        side_effects:
          - "enforcement_status = REINSTATED"
          - "this transition is CASCADE L3 of the reinstatement chain and itself causes CASCADE L4 (reversal of the TAKEDOWN_REMOVAL strike)"
          - "increments version by 1"

  # --- claim lifecycle, bubbles up from its takedowns -------------------------
  - entity: InfringementClaim
    initial_state: DRAFT
    terminal_states: [DISMISSED]
    transitions:
      - from: DRAFT
        to: SUBSTANTIATED
        trigger: "POST /brand-protection/claims/{claimId}/substantiate"
        actor: EnforcementAnalyst
        preconditions:
          - "status == DRAFT"
          - "the FULL variant of calculations.claim_substantiation_score evaluates to >= 85.00 (otherwise ERR_CLAIM_NOT_SUBSTANTIATED and NO field is persisted)"
        side_effects:
          - "substantiation_score persisted"
          - "increments version by 1"
      - from: DRAFT
        to: DISMISSED
        trigger: "POST /brand-protection/claims/{claimId}/dismiss"
        actor: EnforcementAnalyst
        preconditions:
          - "status IN {DRAFT, SUBSTANTIATED}"
          - "no TakedownSubmission with claim_id == this claim has status IN {SUBMITTED, APPROVED_REMOVED, COUNTER_NOTICED}"
        side_effects:
          - "dismissal_reason_code = ANALYST_WITHDRAWN"
          - "the listing's enforcement_status recomputed (CLAIM_OPEN -> NONE when no open claim remains)"
          - "every EvidencePackage with claim_id == this claim and status IN {ASSEMBLING, SEALED} -> WITHDRAWN"
          - "increments version by 1 on every row touched"
      - from: DRAFT
        to: DISMISSED
        trigger: "system — AUTHENTIC branch of POST /brand-protection/test-buys/{testBuyId}/authenticate"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "dismissal_reason_code = TEST_BUY_AUTHENTIC"
          - "CASCADE (because the claim was dismissed): the listing's enforcement_status -> NONE and its monitor_status -> CLEARED with violation_type reset to NONE"
          - "every EvidencePackage with claim_id == this claim and status IN {ASSEMBLING, SEALED} -> WITHDRAWN"
          - "increments version by 1 on every row touched"
      - from: SUBSTANTIATED
        to: DISMISSED
        trigger: "POST /brand-protection/claims/{claimId}/dismiss"
        actor: EnforcementAnalyst
        preconditions:
          - "status == SUBSTANTIATED"
          - "no TakedownSubmission with claim_id == this claim has status IN {SUBMITTED, APPROVED_REMOVED, COUNTER_NOTICED}"
        side_effects:
          - "dismissal_reason_code = ANALYST_WITHDRAWN"
          - "the listing's enforcement_status recomputed"
          - "increments version by 1 on every row touched"
      - from: SUBSTANTIATED
        to: ENFORCED
        trigger: "system — a TakedownSubmission on this claim reaches APPROVED_REMOVED"
        actor: system
        preconditions:
          - "status == SUBSTANTIATED"
        side_effects:
          - "status = ENFORCED (bubble-up from the child takedown)"
          - "increments version by 1"
      - from: ENFORCED
        to: SUBSTANTIATED
        trigger: "system — the enforcing TakedownSubmission leaves APPROVED_REMOVED (reinstated or withdrawn)"
        actor: system
        preconditions:
          - "status == ENFORCED"
          - "no TakedownSubmission with claim_id == this claim has status == APPROVED_REMOVED after the change"
        side_effects:
          - "status = SUBSTANTIATED"
          - "increments version by 1"

  # --- BRANCHING FORK: authentication verdict splits the side-effect sets -----
  - entity: TestBuy
    initial_state: ORDERED
    terminal_states: [AUTHENTICATED_AUTHENTIC, AUTHENTICATED_COUNTERFEIT, CANCELLED]
    transitions:
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /brand-protection/test-buys/{testBuyId}/receive"
        actor: EnforcementAnalyst
        preconditions:
          - "status == ORDERED"
        side_effects:
          - "received_at = logical clock now; lot_code and chain_of_custody_ref persisted"
          - "increments version by 1"
      - from: RECEIVED
        to: AUTHENTICATED_COUNTERFEIT
        trigger: "POST /brand-protection/test-buys/{testBuyId}/authenticate with authentication_result COUNTERFEIT"
        actor: EnforcementAnalyst
        preconditions:
          - "status == RECEIVED"
          - "chain_of_custody_ref is non-null (otherwise ERR_CHAIN_OF_CUSTODY_INCOMPLETE)"
        side_effects:
          - "authentication_result = COUNTERFEIT, lab_ref persisted"
          - "the claim's substantiation_score recomputed with the FULL variant (test-buy bonus now applies)"
          - "the claim's lot_code becomes traceable for DiversionInvestigation creation"
          - "the claim's status is NOT auto-advanced — the analyst must still call substantiate"
          - "increments version by 1 on this row and on the claim"
      - from: RECEIVED
        to: AUTHENTICATED_AUTHENTIC
        trigger: "POST /brand-protection/test-buys/{testBuyId}/authenticate with authentication_result AUTHENTIC"
        actor: EnforcementAnalyst
        preconditions:
          - "status == RECEIVED"
          - "chain_of_custody_ref is non-null"
        side_effects:
          - "authentication_result = AUTHENTIC, lab_ref persisted"
          - "DIVERGENT BRANCH: the claim is auto-dismissed with dismissal_reason_code = TEST_BUY_AUTHENTIC (the COUNTERFEIT branch never touches claim.status)"
          - "CASCADE (because the claim was dismissed): the listing's enforcement_status -> NONE, monitor_status -> CLEARED, violation_type -> NONE"
          - "the brand's enforcement_spend_cents is NOT refunded (the purchase happened) — contrast with the CANCELLED transition"
          - "increments version by 1 on every row touched"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /brand-protection/test-buys/{testBuyId}/cancel"
        actor: EnforcementAnalyst
        preconditions:
          - "status == ORDERED"
        side_effects:
          - "COMPENSATING ACTION: Brand.enforcement_spend_cents -= this row's billable_total_cents, restoring the ledger invariant exactly"
          - "increments version by 1 on this row and on Brand"

  # --- evidence package: append-only until sealed -----------------------------
  - entity: EvidencePackage
    initial_state: ASSEMBLING
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ASSEMBLING
        to: SEALED
        trigger: "POST /brand-protection/evidence-packages/{packageId}/seal"
        actor: EnforcementAnalyst
        preconditions:
          - "status == ASSEMBLING"
          - "required_type_coverage == the cardinality of the required item-type set for the claim's claimed_violation_type"
          - "completeness_score >= 0.8000"
        side_effects:
          - "sealed_at = logical clock now; the items array becomes immutable"
          - "increments version by 1"
      - from: ASSEMBLING
        to: WITHDRAWN
        trigger: "POST /brand-protection/evidence-packages/{packageId}/withdraw"
        actor: EnforcementAnalyst
        preconditions:
          - "status == ASSEMBLING"
          - "no TakedownSubmission with evidence_package_id == this package has status IN {SUBMITTED, APPROVED_REMOVED, COUNTER_NOTICED}"
        side_effects:
          - "increments version by 1"
      - from: SEALED
        to: WITHDRAWN
        trigger: "POST /brand-protection/evidence-packages/{packageId}/withdraw, or the cascade from claim dismissal / takedown withdrawal"
        actor: EnforcementAnalyst | system
        preconditions:
          - "status == SEALED"
          - "no TakedownSubmission with evidence_package_id == this package has status IN {SUBMITTED, APPROVED_REMOVED, COUNTER_NOTICED}"
        side_effects:
          - "increments version by 1"

  # --- CYCLIC: submit -> decision -> counter notice -> resubmit -> ... ---------
  - entity: TakedownSubmission
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    note: |
      This machine is the cyclic core of the domain. APPROVED_REMOVED is NOT
      terminal: a seller counter notice pulls the row back to COUNTER_NOTICED,
      from which it can return to APPROVED_REMOVED (brand rebuts in time) or fall
      to REINSTATED (seller wins or the brand lets the rebuttal window lapse).
      REJECTED and REINSTATED both re-enter SUBMITTED through resubmit, which
      increments `round_number`. The loop terminates on `round_number == 3`
      (MAX_TAKEDOWN_ROUNDS): a fourth submit attempt is ERR_MAX_TAKEDOWN_ROUNDS.
      Each pass around the loop must present a DIFFERENT sealed EvidencePackage,
      so the cycle cannot be traversed by replaying an identical request.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /brand-protection/takedowns/{takedownId}/submit"
        actor: AuthorizedRepresentative
        preconditions:
          - "status == DRAFT"
          - "the acting representative's designation_status == DESIGNATED and the logical clock now falls in [effective_from, effective_to) (else ERR_REPRESENTATIVE_NOT_EFFECTIVE)"
          - "the acting representative's authority_scope set contains SUBMIT_TAKEDOWN (else ERR_REPRESENTATIVE_SCOPE_INSUFFICIENT)"
          - "CROSS-ENTITY: the referenced MarketplaceEnrollment.enrollment_status == ACTIVE (else ERR_ENROLLMENT_NOT_ACTIVE)"
          - "CROSS-ENTITY: the referenced InfringementClaim.status IN {SUBSTANTIATED, ENFORCED} (else ERR_INVALID_STATE)"
          - "CROSS-ENTITY: the referenced EvidencePackage.status == SEALED (else ERR_INVALID_STATE)"
        side_effects:
          - "submitted_by_rep_id = the acting representative's id"
          - "submitted_at = logical clock now"
          - "decision_due_at = submitted_at advanced by MARKETPLACE_SLA_BUSINESS_DAYS[enrollment.marketplace_code] business days (calculations.marketplace_decision_deadline)"
          - "the listing's enforcement_status -> TAKEDOWN_PENDING"
          - "increments version by 1 on this row and on the listing"
      - from: SUBMITTED
        to: APPROVED_REMOVED
        trigger: "POST /brand-protection/takedowns/{takedownId}/marketplace-decision with decision REMOVED"
        actor: MarketplaceLiaison
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "decided_at = logical clock now; marketplace_case_ref persisted"
          - "counter_notice_deadline_at = decided_at advanced by COUNTER_NOTICE_FILING_BUSINESS_DAYS business days"
          - "CASCADE L1 -> L4/L5: listing enforcement_status REMOVED; a TAKEDOWN_REMOVAL strike is attributed to the listing's seller and both strike variants recomputed; the seller escalates ACTIVE -> UNDER_INVESTIGATION at cluster_strike_points >= 25.00; when the seller escalates and no OPEN EnforcementCase exists for (claim.brand_id, seller_id), one is auto-created with originating_takedown_id = this row"
          - "the parent InfringementClaim SUBSTANTIATED -> ENFORCED"
          - "increments version by 1 on every row touched"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /brand-protection/takedowns/{takedownId}/marketplace-decision with decision REJECTED"
        actor: MarketplaceLiaison
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "decided_at = logical clock now; counter_notice_deadline_at stays null"
          - "the listing's enforcement_status -> CLAIM_OPEN; NO strike is attributed"
          - "increments version by 1 on this row and on the listing"
      - from: APPROVED_REMOVED
        to: COUNTER_NOTICED
        trigger: "system — POST /brand-protection/counter-notices creates a CounterNotice against this row"
        actor: system
        preconditions:
          - "status == APPROVED_REMOVED"
          - "the logical clock now <= counter_notice_deadline_at (else ERR_COUNTER_NOTICE_WINDOW_EXPIRED)"
          - "no CounterNotice with takedown_id == this row already exists (else ERR_DUPLICATE_COUNTER_NOTICE)"
        side_effects:
          - "the child CounterNotice.response_due_at = filed_at advanced by REBUTTAL_WINDOW_BUSINESS_DAYS business days"
          - "the listing stays REMOVED for the duration of the rebuttal window"
          - "increments version by 1"
      - from: COUNTER_NOTICED
        to: APPROVED_REMOVED
        trigger: "system — POST /brand-protection/counter-notices/{counterNoticeId}/resolve with resolution REBUTTED (closes the cycle)"
        actor: system
        preconditions:
          - "status == COUNTER_NOTICED"
          - "the logical clock now <= the counter notice's response_due_at"
        side_effects:
          - "the row returns to APPROVED_REMOVED WITHOUT re-running the strike attribution — the original TAKEDOWN_REMOVAL strike was never reversed, so traversing the cycle must not double-count it"
          - "counter_notice_deadline_at is NOT extended"
          - "increments version by 1"
      - from: COUNTER_NOTICED
        to: REINSTATED
        trigger: "system — POST /brand-protection/counter-notices/{counterNoticeId}/resolve with resolution ACCEPTED, or the sweep expiring the rebuttal window"
        actor: system
        preconditions:
          - "status == COUNTER_NOTICED"
        side_effects:
          - "CASCADE L2 -> L4: listing enforcement_status REMOVED -> REINSTATED; the TAKEDOWN_REMOVAL strike attributed by this row is reversed and both strike variants recomputed; the seller de-escalates UNDER_INVESTIGATION -> ACTIVE when cluster_strike_points drops below 25.00"
          - "the parent InfringementClaim ENFORCED -> SUBSTANTIATED"
          - "increments version by 1 on every row touched"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /brand-protection/takedowns/{takedownId}/resubmit"
        actor: AuthorizedRepresentative
        preconditions:
          - "status IN {REJECTED, REINSTATED}"
          - "round_number < 3 (MAX_TAKEDOWN_ROUNDS) else ERR_MAX_TAKEDOWN_ROUNDS"
          - "the supplied evidence_package_id differs from the current evidence_package_id, belongs to the same claim, and is SEALED (else ERR_EVIDENCE_PACKAGE_MISMATCH / ERR_INVALID_STATE)"
          - "the enrollment is still ACTIVE and the acting representative is still effective and in scope"
        side_effects:
          - "round_number += 1; evidence_package_id replaced; submitted_at and decision_due_at recomputed from the current clock; decided_at, marketplace_case_ref and counter_notice_deadline_at reset to null"
          - "the listing's enforcement_status -> TAKEDOWN_PENDING"
          - "increments version by 1 on this row and on the listing"
      - from: REINSTATED
        to: SUBMITTED
        trigger: "POST /brand-protection/takedowns/{takedownId}/resubmit"
        actor: AuthorizedRepresentative
        preconditions:
          - "status IN {REJECTED, REINSTATED}"
          - "round_number < 3"
          - "the supplied evidence_package_id differs from the current one, belongs to the same claim, and is SEALED"
        side_effects:
          - "round_number += 1; the same field resets as the REJECTED -> SUBMITTED edge"
          - "the listing's enforcement_status REINSTATED -> TAKEDOWN_PENDING"
          - "increments version by 1 on this row and on the listing"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system — CASCADE L2 of enrollment suspension"
        actor: system
        preconditions:
          - "status IN {DRAFT, SUBMITTED}"
          - "the parent enrollment moved to SUSPENDED or TERMINATED"
        side_effects:
          - "increments version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system — CASCADE L2 of enrollment suspension, or the sweep withdrawing a submission whose enrollment is no longer ACTIVE"
        actor: system
        preconditions:
          - "status IN {DRAFT, SUBMITTED}"
        side_effects:
          - "the listing's enforcement_status TAKEDOWN_PENDING -> CLAIM_OPEN (CASCADE L3)"
          - "increments version by 1 on this row and on the listing"

  # --- counter notice ---------------------------------------------------------
  - entity: CounterNotice
    initial_state: FILED
    terminal_states: [REBUTTED, ACCEPTED, EXPIRED]
    transitions:
      - from: FILED
        to: REBUTTED
        trigger: "POST /brand-protection/counter-notices/{counterNoticeId}/resolve with resolution REBUTTED"
        actor: MarketplaceLiaison
        preconditions:
          - "status == FILED"
          - "the logical clock now <= response_due_at (else the row must be EXPIRED by the sweep first; a late rebuttal is ERR_INVALID_STATE)"
          - "rebuttal_ref present in the request (else ERR_INVALID_REQUEST)"
        side_effects:
          - "resolved_at = logical clock now; rebuttal_ref persisted"
          - "the parent takedown COUNTER_NOTICED -> APPROVED_REMOVED"
          - "increments version by 1 on both rows"
      - from: FILED
        to: ACCEPTED
        trigger: "POST /brand-protection/counter-notices/{counterNoticeId}/resolve with resolution ACCEPTED"
        actor: MarketplaceLiaison
        preconditions:
          - "status == FILED"
          - "the logical clock now <= response_due_at"
        side_effects:
          - "resolved_at = logical clock now"
          - "CASCADE: the parent takedown COUNTER_NOTICED -> REINSTATED and the whole reinstatement chain runs"
          - "increments version by 1 on every row touched"
      - from: FILED
        to: EXPIRED
        trigger: "system — POST /brand-protection/ops/run-enforcement-sweep, step 2"
        actor: system
        preconditions:
          - "status == FILED"
          - "the logical clock now > response_due_at"
        side_effects:
          - "resolved_at = response_due_at (NOT the clock value, so replaying the sweep is a no-op)"
          - "CASCADE: the parent takedown COUNTER_NOTICED -> REINSTATED, identical to the ACCEPTED path"
          - "increments version by 1 on every row touched"

  # --- PARALLEL: correspondence track x litigation track x rollup -------------
  - entity: EnforcementCase
    initial_state: "NONE / NONE / OPEN"
    terminal_states: []
    note: |
      Three dimensions on one row. `correspondence_status` and `litigation_status`
      advance independently; `case_status` is a COMPOUND rollup derived from the
      other two after every mutation: IN_LITIGATION while litigation_status IN
      {AUTHORIZED, FILED}, CLOSED once close() runs, OPEN otherwise. A case can
      reach litigation_status FILED while correspondence_status is still CD_SENT
      only through the CD_IGNORED path — authorize-litigation demands a settled
      correspondence track.
    transitions:
      - from: "correspondence_status=NONE"
        to: "correspondence_status=CD_SENT"
        trigger: "POST /brand-protection/cases/{caseId}/cease-desist"
        actor: AuthorizedRepresentative
        preconditions:
          - "correspondence_status == NONE"
          - "case_status == OPEN"
          - "the acting representative is DESIGNATED, effective at the clock now, and its authority_scope set contains SUBMIT_TAKEDOWN or AUTHORIZE_LITIGATION"
          - "CROSS-ENTITY: the case's Seller.status IN {UNDER_INVESTIGATION, BLOCKED} (else ERR_SELLER_NOT_UNDER_INVESTIGATION)"
        side_effects:
          - "cease_desist_sent_by_rep_id = the acting representative's id (this pins the segregation-of-duties constraint for authorize-litigation)"
          - "cd_sent_at = logical clock now; letter_ref persisted"
          - "cd_response_due_at = cd_sent_at advanced by CD_RESPONSE_BUSINESS_DAYS business days"
          - "increments version by 1"
      - from: "correspondence_status=CD_SENT"
        to: "correspondence_status=CD_RESPONDED"
        trigger: "POST /brand-protection/cases/{caseId}/record-response"
        actor: LegalCounsel
        preconditions:
          - "correspondence_status == CD_SENT"
          - "the logical clock now <= cd_response_due_at"
        side_effects:
          - "response_kind persisted from the request"
          - "increments version by 1"
      - from: "correspondence_status=CD_SENT"
        to: "correspondence_status=CD_IGNORED"
        trigger: "system — POST /brand-protection/ops/run-enforcement-sweep, step 3"
        actor: system
        preconditions:
          - "correspondence_status == CD_SENT"
          - "the logical clock now > cd_response_due_at"
        side_effects:
          - "a CD_IGNORED strike is attributed to the case's seller with effective_at = cd_response_due_at, and both strike variants are recomputed"
          - "increments version by 1 on this row and on the seller"
      - from: "litigation_status=NONE"
        to: "litigation_status=AUTHORIZED"
        trigger: "POST /brand-protection/cases/{caseId}/authorize-litigation"
        actor: AuthorizedRepresentative
        preconditions:
          - "litigation_status == NONE and case_status == OPEN"
          - "correspondence_status IN {CD_RESPONDED, CD_IGNORED} (else ERR_CEASE_DESIST_NOT_ANSWERED)"
          - "SEGREGATION OF DUTIES: the acting representative's id != cease_desist_sent_by_rep_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "the acting representative's authority_scope set contains AUTHORIZE_LITIGATION, is DESIGNATED, effective at the clock now, and sits under an ACTIVE enrollment of this case's brand"
        side_effects:
          - "litigation_authorized_by_rep_id = the acting representative's id"
          - "COMPOUND ROLLUP: case_status OPEN -> IN_LITIGATION"
          - "increments version by 1"
      - from: "litigation_status=AUTHORIZED"
        to: "litigation_status=FILED"
        trigger: "POST /brand-protection/cases/{caseId}/file-suit"
        actor: LegalCounsel
        preconditions:
          - "litigation_status == AUTHORIZED"
        side_effects:
          - "docket_ref persisted; case_status stays IN_LITIGATION"
          - "increments version by 1"
      - from: "litigation_status=FILED"
        to: "litigation_status=SETTLED"
        trigger: "POST /brand-protection/cases/{caseId}/close with outcome SETTLED"
        actor: LegalCounsel
        preconditions:
          - "litigation_status == FILED"
        side_effects:
          - "closure_outcome = SETTLED; COMPOUND ROLLUP: case_status -> CLOSED"
          - "increments version by 1"
      - from: "litigation_status=FILED"
        to: "litigation_status=DISMISSED"
        trigger: "POST /brand-protection/cases/{caseId}/close with outcome DISMISSED"
        actor: LegalCounsel
        preconditions:
          - "litigation_status == FILED"
        side_effects:
          - "closure_outcome = DISMISSED; COMPOUND ROLLUP: case_status -> CLOSED"
          - "increments version by 1"
      - from: "case_status=OPEN"
        to: "case_status=CLOSED"
        trigger: "POST /brand-protection/cases/{caseId}/close with outcome NO_ACTION"
        actor: LegalCounsel
        preconditions:
          - "case_status == OPEN"
          - "litigation_status == NONE (a case with an active litigation track can only be closed through SETTLED or DISMISSED)"
        side_effects:
          - "closure_outcome = NO_ACTION; litigation_status stays NONE; strikes already attributed are NOT reversed"
          - "increments version by 1"

  # --- customs recordation ----------------------------------------------------
  - entity: CustomsRecordation
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: RECORDED
        trigger: "POST /brand-protection/customs-recordations/{recordationId}/record"
        actor: CustomsCoordinator
        preconditions:
          - "status == DRAFT"
          - "CROSS-ENTITY: the referenced TrademarkRegistration.status == REGISTERED (else ERR_REGISTRATION_NOT_ELIGIBLE)"
          - "the referenced TrademarkRegistration.principal_register == true (else ERR_RECORDATION_NOT_PRINCIPAL_REGISTER)"
          - "no other RECORDED recordation for the same (brand_id, customs_authority_code, nice_class) has a [recorded_on, expires_on] interval intersecting this row's (else ERR_RECORDATION_WINDOW_OVERLAP)"
        side_effects:
          - "recordation_number persisted; the row becomes an eligible parent for BORDER_SEIZURE investigations"
          - "increments version by 1"
      - from: RECORDED
        to: EXPIRED
        trigger: "system — POST /brand-protection/ops/run-enforcement-sweep, step 4"
        actor: system
        preconditions:
          - "status == RECORDED"
          - "the logical clock now (date part) > expires_on"
        side_effects:
          - "OPEN DiversionInvestigation rows that reference this recordation are NOT auto-closed — an in-flight seizure survives the recordation lapsing"
          - "increments version by 1"

  # --- diversion / border seizure investigation -------------------------------
  - entity: DiversionInvestigation
    initial_state: OPEN
    terminal_states: [DIVERSION_CONFIRMED, RELEASED]
    transitions:
      - from: OPEN
        to: EVIDENCE_SUBMITTED
        trigger: "POST /brand-protection/diversion-investigations/{investigationId}/submit-evidence"
        actor: EnforcementAnalyst
        preconditions:
          - "status == OPEN"
          - "for source_kind == BORDER_SEIZURE: the logical clock now <= response_due_at (else ERR_SEIZURE_RESPONSE_WINDOW_EXPIRED)"
          - "for source_kind == TEST_BUY: the source TestBuy.status == AUTHENTICATED_COUNTERFEIT and its lot_code equals this row's lot_code (else ERR_LOT_CODE_NOT_TRACEABLE)"
        side_effects:
          - "evidence_ref and suspected_distributor_ref persisted"
          - "increments version by 1"
      - from: EVIDENCE_SUBMITTED
        to: DIVERSION_CONFIRMED
        trigger: "POST /brand-protection/diversion-investigations/{investigationId}/conclude with outcome DIVERSION_CONFIRMED"
        actor: CustomsCoordinator
        preconditions:
          - "status == EVIDENCE_SUBMITTED"
          - "seller_id is non-null (a confirmed diversion must name the seller that receives the strike, else ERR_INVALID_STATE)"
        side_effects:
          - "concluded_at = logical clock now; findings_ref persisted"
          - "CASCADE: a SEIZURE_CONFIRMED strike (25.15 base points) is attributed to seller_id with effective_at = concluded_at; both strike variants recomputed; the seller escalates at cluster_strike_points >= 25.00 and auto-blocks at >= 60.00"
          - "when the seller escalates and no OPEN EnforcementCase exists for (brand_id, seller_id), one is auto-created with originating_takedown_id = null"
          - "increments version by 1 on every row touched"
      - from: EVIDENCE_SUBMITTED
        to: RELEASED
        trigger: "POST /brand-protection/diversion-investigations/{investigationId}/conclude with outcome RELEASED"
        actor: CustomsCoordinator
        preconditions:
          - "status == EVIDENCE_SUBMITTED"
        side_effects:
          - "concluded_at = logical clock now; findings_ref persisted; NO strike is attributed and no case is created"
          - "increments version by 1"
      - from: OPEN
        to: RELEASED
        trigger: "POST /brand-protection/diversion-investigations/{investigationId}/conclude with outcome RELEASED"
        actor: CustomsCoordinator
        preconditions:
          - "status == OPEN"
          - "a seizure may be released without evidence ever being submitted (the DIVERSION_CONFIRMED outcome may NOT skip EVIDENCE_SUBMITTED — that attempt is ERR_INVALID_STATE)"
        side_effects:
          - "concluded_at = logical clock now; findings_ref persisted"
          - "increments version by 1"

# =============================================================================
# 1.2.1 CONCURRENCY RULES (optimistic concurrency control)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-create-stale-brand
    parent_entity: Brand
    child_entity: MarketplaceEnrollment
    write_endpoint: "POST /brand-protection/enrollments"
    occ_field: expected_brand_version
    error_id: ERR_STALE_BRAND_VERSION
    http_status: 412
    race_description: |
      Enrolling a brand on a marketplace pins the brand's registration portfolio
      and its authorized_msrp_cents into the enrollment decision. A caller reads
      the brand at version V, decides which registration to assert, and posts the
      enrollment quoting expected_brand_version = V. If another operator has
      since amended the brand (its version is now V+1), the caller's premise is
      stale and the create is rejected with 412; nothing is persisted.
      Serial observability check: with strictly-sequential requests the second
      enrollment create is legitimate — a brand may hold one ACTIVE enrollment per
      marketplace, so a second create quoting the CURRENT brand version and a
      different marketplace_code succeeds and returns 201. The rejection is
      therefore caused only by the stale version premise, not by any duplicate or
      capacity constraint.
    correct_version_behaviour: "quoting the brand's current version returns 201 and increments Brand.version by 1"
  - rule_id: evidence-package-create-stale-claim
    parent_entity: InfringementClaim
    child_entity: EvidencePackage
    write_endpoint: "POST /brand-protection/evidence-packages"
    occ_field: expected_claim_version
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    race_description: |
      An evidence package is assembled against a specific reading of the claim:
      its claimed_violation_type determines the REQUIRED_ITEM_TYPES set, and its
      substantiation posture determines whether a lab report is expected. A caller
      that read the claim at version V and posts a package quoting
      expected_claim_version = V is rejected with 412 once the claim has been
      re-scored or re-classified (version V+1), because the required item-type set
      it was building against may no longer apply.
      Serial observability check: a claim legitimately holds several packages
      (round 2 of a takedown must present a different sealed package), so a second
      create quoting the CURRENT claim version succeeds and returns 201. Only the
      stale premise is refused.
    correct_version_behaviour: "quoting the claim's current version returns 201 and increments InfringementClaim.version by 1"
  - rule_id: alias-link-stale-canonical-seller
    parent_entity: Seller
    child_entity: Seller
    write_endpoint: "POST /brand-protection/sellers/{sellerId}/link-alias"
    occ_field: expected_canonical_seller_version
    error_id: ERR_STALE_SELLER_VERSION
    http_status: 412
    race_description: |
      Linking an alias account to a canonical seller merges the alias's strike
      history into the canonical cluster, so the caller's decision depends on the
      canonical row's current cluster membership and strike totals. A caller that
      read the canonical seller at version V and posts the link quoting
      expected_canonical_seller_version = V is rejected with 412 once the canonical
      row has changed (another alias linked, a strike attributed, an escalation
      applied), because the merge it computed was against a superseded cluster.
      Serial observability check: a canonical seller may absorb many aliases, so a
      second link of a DIFFERENT alias quoting the CURRENT canonical version
      succeeds and returns 200. The refusal is purely about the stale premise.
    correct_version_behaviour: "quoting the canonical seller's current version returns 200, recomputes both strike variants across the enlarged cluster, and increments the canonical Seller.version by 1"

# =============================================================================
# 1.3 CALCULATION RULES
# =============================================================================
calculations:
  - name: listing_match_score
    trigger: "POST /brand-protection/listings/{listingId}/screen — the automated image+text matcher reports its two sub-scores and the server derives the composite"
    algorithm: weighted_scoring
    formula: |
      # --- step 1: price deviation is DERIVED, never supplied ------------------
      msrp  = brand.authorized_msrp_cents          # integer cents, > 0
      price = listing.price_cents                  # integer cents, >= 0
      raw_pdf = (msrp - price) / msrp              # exact rational, may be negative
      clamped = min(1, max(0, raw_pdf))
      price_deviation_factor = ROUND_HALF_UP(clamped, 4)

      # --- step 2: the three weighted terms -----------------------------------
      # weights sum to exactly 1.00; each term is kept at full precision and
      # only the FINAL composite is rounded (no intermediate rounding drift).
      raw = 0.45 * listing.image_match_score
          + 0.35 * listing.text_match_score
          + 0.20 * price_deviation_factor

      # --- step 3: seller-risk boost (mutually exclusive ladder) --------------
      if   seller.status == 'BLOCKED':                    boost = 0.05
      elif seller.standalone_strike_points >= 10.00:      boost = 0.03
      else:                                               boost = 0.00

      # --- step 4: composite, capped then rounded ----------------------------
      match_score = ROUND_HALF_UP(min(1.0000, raw + boost), 4)

      # --- step 5: screening verdict (inclusive threshold) --------------------
      monitor_status = 'FLAGGED' if match_score >= FLAG_THRESHOLD else 'CLEARED'

      # --- step 6: violation classification — ORDERED, first match wins -------
      if monitor_status == 'CLEARED':
          violation_type = 'NONE'
      elif listing.image_match_score >= 0.85:
          violation_type = 'COUNTERFEIT'
      elif listing.text_match_score >= 0.80:
          violation_type = 'TRADEMARK'
      elif listing.image_match_score >= 0.60 and price_deviation_factor >= 0.50:
          violation_type = 'COPYRIGHT'
      else:
          violation_type = 'TRADEMARK'
      # NOTE: the ladder is evaluated top-down and the FIRST satisfied branch
      # wins. A listing with image 0.92 AND text 0.88 is COUNTERFEIT, never
      # TRADEMARK, even though both sub-conditions hold.
    input_set: |
      The listing being screened, its parent Brand (for authorized_msrp_cents) and
      its Seller (for the risk boost). image_match_score and text_match_score come
      from the request body; price_deviation_factor and match_score are computed
      and any client-supplied value for them is ignored.
    constants:
      IMAGE_WEIGHT: 0.45
      TEXT_WEIGHT: 0.35
      PRICE_DEVIATION_WEIGHT: 0.20
      FLAG_THRESHOLD: 0.7000
      BLOCKED_SELLER_BOOST: 0.05
      STRIKED_SELLER_BOOST: 0.03
      STRIKED_SELLER_POINT_FLOOR: 10.00
      COUNTERFEIT_IMAGE_FLOOR: 0.85
      TRADEMARK_TEXT_FLOOR: 0.80
      COPYRIGHT_IMAGE_FLOOR: 0.60
      COPYRIGHT_PDF_FLOOR: 0.50
    precision: "price_deviation_factor and match_score: 4 decimal places, ROUND_HALF_UP; the weighted sum is accumulated at full precision and rounded exactly once"
    worked_examples:
      - "msrp 10000, price 3000 -> pdf 0.7000; image 0.92, text 0.88, boost 0.00 -> raw = 0.414 + 0.308 + 0.14 = 0.8620 -> match_score 0.8620, FLAGGED, COUNTERFEIT"
      - "msrp 10000, price 3000 -> pdf 0.7000; image 0.70, text 0.70, boost 0.00 -> raw = 0.315 + 0.245 + 0.14 = 0.7000 -> match_score 0.7000, FLAGGED (the threshold comparison is inclusive), violation_type COPYRIGHT (image 0.70 < 0.85 so not COUNTERFEIT; text 0.70 < 0.80 so not TRADEMARK; image 0.70 >= 0.60 and pdf 0.70 >= 0.50 so the third branch wins)"
      - "msrp 10000, price 3000 -> pdf 0.7000; image 0.70, text 0.6990 -> raw = 0.315 + 0.24465 + 0.14 = 0.69965 -> match_score 0.6997, CLEARED, NONE"
      - "msrp 10000, price 9500 -> pdf 0.0500; image 0.50, text 0.40 -> raw = 0.225 + 0.14 + 0.01 = 0.3750 -> match_score 0.3750, CLEARED, NONE"
      - "msrp 10000, price 12000 -> raw_pdf negative -> clamped 0 -> pdf 0.0000 (never negative)"

  - name: claim_substantiation_score
    trigger: "POST /brand-protection/claims (PRELIMINARY variant), POST /brand-protection/claims/{claimId}/substantiate and POST /brand-protection/test-buys/{testBuyId}/authenticate (FULL variant)"
    algorithm: weighted_scoring
    formula: |
      listing = claim.listing
      reg     = claim.asserted_registration
      seller  = listing.seller

      # --- registration strength ladder (ordered, first match wins) ----------
      if reg.status == 'REGISTERED' and reg.principal_register
                                   and reg.nice_class == listing.nice_class:
          registration_strength = 1.00
      elif reg.status == 'REGISTERED':
          registration_strength = 0.60
      elif reg.status == 'PENDING':
          registration_strength = 0.30
      else:                       # LAPSED
          registration_strength = 0.00

      # --- seller history factor --------------------------------------------
      seller_history_factor = ROUND_HALF_UP(
          min(1, seller.standalone_strike_points / HISTORY_NORMALISER), 4)

      base = MATCH_WEIGHT         * listing.match_score
           + REGISTRATION_WEIGHT  * registration_strength
           + HISTORY_WEIGHT       * seller_history_factor

      # --- the two variants diverge HERE ------------------------------------
      if variant == 'PRELIMINARY':
          score = ROUND_HALF_UP(PRELIMINARY_DISCOUNT * base, 2)
          # no test-buy bonus is ever applied, even if a COUNTERFEIT test buy
          # already exists; and the result is NOT capped at 100 because
          # 0.80 * 100 = 80 < 100 by construction.
      else:  # FULL
          has_corroboration = EXISTS TestBuy t WHERE t.claim_id == claim.id
                                AND t.status == 'AUTHENTICATED_COUNTERFEIT'
                                AND t.chain_of_custody_ref IS NOT NULL
          bonus = TEST_BUY_BONUS if has_corroboration else 0.00
          score = ROUND_HALF_UP(min(100.00, base + bonus), 2)

      substantiated = (variant == 'FULL' and score >= SUBSTANTIATION_THRESHOLD)
    input_set: |
      Exactly one claim, its listing, the listing's seller, and the asserted
      TrademarkRegistration. The corroboration probe scans only TestBuy rows whose
      claim_id equals this claim and whose status is AUTHENTICATED_COUNTERFEIT with
      a non-null chain_of_custody_ref — a RECEIVED-but-unauthenticated buy, a
      CANCELLED buy, an AUTHENTICATED_AUTHENTIC buy, and a COUNTERFEIT buy with a
      null chain_of_custody_ref all contribute nothing.
    constants:
      MATCH_WEIGHT: 60
      REGISTRATION_WEIGHT: 25
      HISTORY_WEIGHT: 15
      HISTORY_NORMALISER: 37.65
      PRELIMINARY_DISCOUNT: 0.80
      TEST_BUY_BONUS: 20.00
      SUBSTANTIATION_THRESHOLD: 85.00
    precision: "2 decimal places, ROUND_HALF_UP; seller_history_factor is rounded to 4 places before it is weighted"
    variants:
      - name: PRELIMINARY
        when: "claim creation (POST /brand-protection/claims) — evidence has not been gathered yet"
        difference: "multiplies the base by PRELIMINARY_DISCOUNT (0.80) and NEVER adds TEST_BUY_BONUS, so it can never reach SUBSTANTIATION_THRESHOLD"
      - name: FULL
        when: "POST /brand-protection/claims/{claimId}/substantiate, and the recompute performed by POST /brand-protection/test-buys/{testBuyId}/authenticate"
        difference: "uses the undiscounted base, adds TEST_BUY_BONUS when a corroborating COUNTERFEIT test buy with intact chain of custody exists, and caps the result at 100.00"
    worked_examples:
      - "match 0.8620, strength 1.00, spp 0.00 -> shf 0.0000; base = 51.72 + 25 + 0 = 76.72; PRELIMINARY = 61.376 -> 61.38; FULL without corroboration = 76.72 (< 85 -> ERR_CLAIM_NOT_SUBSTANTIATED); FULL with corroboration = 96.72 (>= 85 -> SUBSTANTIATED)"
      - "match 0.7000, strength 1.00, spp 0.00 -> base = 42 + 25 = 67.00; PRELIMINARY = 53.60; FULL with corroboration = 87.00 (substantiates)"
      - "match 0.8620, strength 0.60, spp 0.00 -> base = 51.72 + 15 = 66.72; PRELIMINARY = 53.376 -> 53.38; FULL with corroboration = 86.72"
      - "match 0.8620, strength 1.00, spp 12.55 -> shf = ROUND_HALF_UP(12.55/37.65, 4) = 0.3333; base = 51.72 + 25 + 4.9995 = 81.7195; PRELIMINARY = 65.3756 -> 65.38; FULL with corroboration = min(100, 101.7195) = 100.00 (cap engaged)"

  - name: seller_strike_points
    trigger: "recomputed whenever a strike is attributed or reversed (takedown removal, counter-notice reinstatement, diversion confirmation, CD_IGNORED sweep step), whenever an alias is linked, and by sweep step 5 for age decay"
    algorithm: decay_function
    formula: |
      # --- the three strike sources, with their effective instants -----------
      # (A) TakedownSubmission with status == 'APPROVED_REMOVED'
      #       seller  := takedown.claim.listing.seller_id
      #       effective_at := takedown.decided_at
      #       kind    := 'TAKEDOWN_REMOVAL'
      # (B) DiversionInvestigation with status == 'DIVERSION_CONFIRMED'
      #       seller  := investigation.seller_id
      #       effective_at := investigation.concluded_at
      #       kind    := 'SEIZURE_CONFIRMED'
      # (C) EnforcementCase with correspondence_status == 'CD_IGNORED'
      #       seller  := case.seller_id
      #       effective_at := case.cd_response_due_at
      #       kind    := 'CD_IGNORED'
      # Any row that has LEFT these statuses contributes nothing — reversal is
      # therefore exclusion from the input set, not a negative contribution.

      def points_for(seller_ids):
          strikes = [all strikes whose seller is in seller_ids]
          # enumeration order is fully determined: effective_at ASC, then the
          # source row's created_at ASC. `id` is never consulted.
          strikes.sort(key = (effective_at ASC, created_at ASC))
          contributions = []
          for s in strikes:
              age_days = floor((clock_now - s.effective_at).total_seconds() / 86400)
              weight   = FRESH_WEIGHT if age_days <= DECAY_AGE_DAYS else DECAYED_WEIGHT
              # ROUNDED PER STRIKE, BEFORE SUMMING — this is load bearing.
              contributions.append(ROUND_HALF_UP(BASE_POINTS[s.kind] * weight, 2))
          return min(POINT_CAP, ROUND_HALF_UP(sum(contributions), 2))

      # --- the two variants ---------------------------------------------------
      root = self.canonical_seller_id if self.canonical_seller_id else self.id
      cluster = {root} UNION {s.id : s.canonical_seller_id == root}

      standalone_strike_points = points_for({self.id})
      cluster_strike_points    = points_for(cluster)

      # --- escalation ladder, driven ONLY by the CLUSTER variant --------------
      if   cluster_strike_points >= BLOCK_THRESHOLD:      status = 'BLOCKED'
      elif cluster_strike_points >= INVESTIGATE_THRESHOLD: status = 'UNDER_INVESTIGATION'
      else:                                                status = 'ACTIVE'
      # BLOCKED is reached only by sweep step 5 or by a strike-attributing
      # cascade; de-escalation below INVESTIGATE_THRESHOLD returns the seller to
      # ACTIVE, and a BLOCKED seller that decays below BLOCK_THRESHOLD but stays
      # at or above INVESTIGATE_THRESHOLD returns to UNDER_INVESTIGATION.
    input_set: |
      Strikes are gathered per seller row, not per cluster member's own view: the
      STANDALONE variant looks only at strikes whose seller is this exact row, the
      CLUSTER variant unions the cluster root with every row that names the root as
      its canonical_seller_id. Alias chains are one level deep only — linking an
      alias whose canonical_seller_id is already set, or linking a seller that is
      itself a canonical root of other aliases, is ERR_ALIAS_CHAIN_NOT_ALLOWED.
    constants:
      BASE_POINTS:
        TAKEDOWN_REMOVAL: 12.55
        SEIZURE_CONFIRMED: 25.15
        CD_IGNORED: 5.05
      FRESH_WEIGHT: 1.00
      DECAYED_WEIGHT: 0.50
      DECAY_AGE_DAYS: 180
      INVESTIGATE_THRESHOLD: 25.00
      BLOCK_THRESHOLD: 60.00
      POINT_CAP: 100.00
    precision: "2 decimal places, ROUND_HALF_UP, applied to EACH strike's decayed contribution first and to the sum afterwards. Summing raw products and rounding once at the end is WRONG and observably differs."
    variants:
      - name: STANDALONE
        when: "always maintained on Seller.standalone_strike_points; it is the value the listing screener consults for its seller-risk boost"
        difference: "counts only strikes attributed to this exact seller row and ignores every alias and the canonical root"
      - name: CLUSTER
        when: "always maintained on Seller.cluster_strike_points; it is the ONLY value the escalation ladder consults"
        difference: "counts strikes across the whole alias cluster, so a seller with zero standalone points can still be BLOCKED"
    worked_examples:
      - "one TAKEDOWN_REMOVAL aged 181 days plus one SEIZURE_CONFIRMED aged 181 days: contributions ROUND_HALF_UP(12.55*0.50,2)=6.28 (6.275 rounds UP) and ROUND_HALF_UP(25.15*0.50,2)=12.58 (12.575 rounds UP); sum = 18.86. Summing first (12.55*0.50 + 25.15*0.50 = 18.85) and rounding once yields 18.85 and is WRONG."
      - "three TAKEDOWN_REMOVAL strikes all aged 181 days: 6.28 * 3 = 18.84 per-strike-first, versus 18.825 -> 18.83 sum-first. Per-strike-first is correct: 18.84."
      - "one fresh TAKEDOWN_REMOVAL (age 0..180): 12.55 -> below INVESTIGATE_THRESHOLD, seller stays ACTIVE"
      - "two fresh TAKEDOWN_REMOVAL strikes: 25.10 -> >= 25.00, seller escalates to UNDER_INVESTIGATION"
      - "one fresh SEIZURE_CONFIRMED: 25.15 -> escalates to UNDER_INVESTIGATION on its own"
      - "one fresh CD_IGNORED: 5.05"
      - "age boundary: age_days == 180 is still FRESH (weight 1.00); age_days == 181 is DECAYED (weight 0.50)"

  - name: test_buy_billable_total
    trigger: "POST /brand-protection/claims/{claimId}/test-buys — computed once at order time and never re-derived"
    algorithm: tiered_pricing
    formula: |
      subtotal_cents = purchase_price_cents + shipping_cents + lab_fee_cents

      # The tier is selected from subtotal_cents ALONE. It is emphatically NOT
      # re-selected from billable_total_cents, even when adding the fee pushes the
      # total across the next band. Exactly one pass, no fixed-point iteration.
      if   subtotal_cents <= 5000:     service_fee_rate = 0.15
      elif subtotal_cents <= 20000:    service_fee_rate = 0.12
      elif subtotal_cents <= 50000:    service_fee_rate = 0.09
      else:                            service_fee_rate = 0.06

      service_fee_cents   = ROUND_HALF_UP(subtotal_cents * service_fee_rate, 0)
      billable_total_cents = subtotal_cents + service_fee_cents

      # --- budget check, evaluated against the brand ledger ------------------
      if brand.enforcement_spend_cents + billable_total_cents
             > brand.enforcement_budget_cents:
          raise ERR_TEST_BUY_BUDGET_EXCEEDED    # 402, nothing persisted
      brand.enforcement_spend_cents += billable_total_cents
    input_set: |
      Only the three money fields on the request plus the parent Brand's ledger.
      The tier ladder is a lookup on the freshly computed subtotal; no other test
      buy on the same claim, seller or brand influences the rate.
    constants:
      TIER_1_MAX_CENTS: 5000
      TIER_1_RATE: 0.15
      TIER_2_MAX_CENTS: 20000
      TIER_2_RATE: 0.12
      TIER_3_MAX_CENTS: 50000
      TIER_3_RATE: 0.09
      TIER_4_RATE: 0.06
    precision: "service_fee_cents is an integer number of cents, ROUND_HALF_UP at 0 decimal places; the rate itself is exact"
    worked_examples:
      - "4200 + 700 + 0 = 4900 -> tier 1 (rate 0.15) -> fee 735 -> billable_total 5635. Note 5635 sits in tier 2's band, yet the rate is NOT revised to 0.12."
      - "4200 + 700 + 2000 = 6900 -> tier 2 (rate 0.12) -> fee 828 -> billable_total 7728"
      - "5000 + 0 + 0 = 5000 -> tier 1 (inclusive upper bound) -> fee 750 -> billable_total 5750"
      - "5001 + 0 + 0 = 5001 -> tier 2 -> fee 600 -> billable_total 5601. NON-MONOTONIC: one extra cent of subtotal makes the total 149 cents CHEAPER (5601 < 5750). This is the intended contract."
      - "19000 + 1000 + 0 = 20000 -> tier 2 (inclusive) -> fee 2400 -> billable_total 22400"

  - name: evidence_completeness_score
    trigger: "POST /brand-protection/evidence-packages/{packageId}/items (recomputed on every append) and re-checked by POST /brand-protection/evidence-packages/{packageId}/seal"
    algorithm: weighted_scoring
    formula: |
      required = REQUIRED_ITEM_TYPES[claim.claimed_violation_type]
      present_types = { i.item_type for i in package.items }

      required_type_coverage = |required INTERSECT present_types|
      optional_count = |[ i for i in package.items
                            if i.item_type NOT IN required ]|
      # duplicates of a required type count toward optional_count only if they
      # exceed the first occurrence? NO — a second item of a REQUIRED type is
      # neither additional coverage nor an optional item; it is simply ignored by
      # both terms.

      coverage_term = required_type_coverage / |required|
      optional_term = min(1, optional_count / OPTIONAL_TARGET)
      completeness_score = ROUND_HALF_UP(
            COVERAGE_WEIGHT * coverage_term + OPTIONAL_WEIGHT * optional_term, 4)

      # --- the seal gate is a CONJUNCTION, not just the score ----------------
      sealable = (required_type_coverage == |required|)
                 and (completeness_score >= SEAL_THRESHOLD)
      # Piling optional items on a package that is missing one required type can
      # push the score to 0.70*(3/4) + 0.30*1 = 0.8250 >= 0.8000 and STILL be
      # unsealable, because the coverage conjunct fails -> ERR_EVIDENCE_INCOMPLETE.
      # item_count is the raw length of the items array, including duplicates.
    input_set: |
      Only the items appended to this package, classified against the required set
      of the package's OWN claim. A package inherits its required set from
      claim.claimed_violation_type at score time, so re-classifying the claim
      changes the score of an ASSEMBLING package on its next append (a SEALED
      package's items and score are frozen).
    constants:
      REQUIRED_ITEM_TYPES:
        COUNTERFEIT: [TEST_BUY_INVOICE, LAB_AUTHENTICATION_REPORT, LISTING_SCREENSHOT, REGISTRATION_CERTIFICATE]
        TRADEMARK: [LISTING_SCREENSHOT, REGISTRATION_CERTIFICATE, MARK_COMPARISON]
        COPYRIGHT: [LISTING_SCREENSHOT, COPYRIGHT_DEPOSIT_COPY, WORK_COMPARISON]
      OPTIONAL_ITEM_TYPES: [SELLER_PROFILE_SNAPSHOT, PRICE_HISTORY_EXPORT, CUSTOMER_COMPLAINT, CUSTOMS_SEIZURE_NOTICE, SHIPPING_LABEL_PHOTO]
      COVERAGE_WEIGHT: 0.70
      OPTIONAL_WEIGHT: 0.30
      OPTIONAL_TARGET: 4
      SEAL_THRESHOLD: 0.8000
    precision: "4 decimal places, ROUND_HALF_UP"
    worked_examples:
      - "COUNTERFEIT claim, all 4 required types + 2 optional items -> 0.70*1 + 0.30*(2/4) = 0.8500 -> sealable"
      - "COUNTERFEIT claim, all 4 required types + 1 optional item -> 0.70 + 0.075 = 0.7750 -> score below SEAL_THRESHOLD -> ERR_EVIDENCE_INCOMPLETE"
      - "COUNTERFEIT claim, all 4 required types + 0 optional -> 0.7000 -> not sealable"
      - "COUNTERFEIT claim, all 4 required types + 4 optional -> 0.70 + 0.30 = 1.0000; a 5th optional item leaves it at 1.0000 (the optional term is capped)"
      - "TRADEMARK claim, all 3 required types + 2 optional -> 0.70*1 + 0.30*0.5 = 0.8500 -> sealable"
      - "COUNTERFEIT claim, 3 of 4 required + 4 optional -> 0.70*0.75 + 0.30 = 0.8250, above SEAL_THRESHOLD but coverage 3 != 4 -> NOT sealable"
      - "empty package (0 items) -> coverage_term 0, optional_term 0 -> 0.0000, item_count 0"

  - name: brand_registry_posture
    trigger: "recomputed on every MarketplaceEnrollment create/activate/suspend/terminate and on every TrademarkRegistration status change that cascades into enrollments"
    algorithm: projection
    formula: |
      enrollments = [ e for e in MarketplaceEnrollment
                        if e.brand_id == brand.id ]
      # ORDERED precedence — the strongest enrollment posture the brand holds
      # anywhere wins; the count of weaker enrollments is irrelevant.
      if   any(e.enrollment_status == 'ACTIVE'    for e in enrollments):
          brand.status = 'ENROLLED'
      elif any(e.enrollment_status == 'SUBMITTED' for e in enrollments):
          brand.status = 'ENROLLMENT_PENDING'
      elif len(enrollments) > 0:
          brand.status = 'ENROLLMENT_LAPSED'   # only SUSPENDED/TERMINATED remain
      else:
          brand.status = 'DRAFT'               # no enrollment has ever existed
    input_set: "every MarketplaceEnrollment of the brand regardless of marketplace_code or age; no time filtering"
    constants:
      PRECEDENCE: [ACTIVE, SUBMITTED, ANY_OTHER, NONE]
    precision: "not applicable — enum derivation"
    worked_examples:
      - "one ACTIVE (AMZ) + one SUSPENDED (EBY) -> ENROLLED"
      - "one SUBMITTED (AMZ) + one TERMINATED (EBY) -> ENROLLMENT_PENDING"
      - "two SUSPENDED enrollments -> ENROLLMENT_LAPSED"
      - "the brand's only ACTIVE enrollment is suspended by the registration-lapse cascade -> ENROLLED becomes ENROLLMENT_LAPSED in the same request"

  - name: brand_enforcement_metrics
    trigger: "GET /brand-protection/brands/{brandId}/enforcement-metrics — derived on read, nothing is persisted"
    algorithm: aggregation
    formula: |
      # scope: every takedown whose claim belongs to this brand, all time, no
      # marketplace or date filtering whatsoever.
      takedowns = [ t for t in TakedownSubmission
                      if t.claim.brand_id == brand.id ]

      decided = |[ t for t in takedowns
                     if t.status IN {'APPROVED_REMOVED','REJECTED','REINSTATED'} ]|
      removed = |[ t for t in takedowns if t.status == 'APPROVED_REMOVED' ]|
      # DRAFT, SUBMITTED, COUNTER_NOTICED and WITHDRAWN rows are in NEITHER
      # numerator nor denominator: an in-flight or abandoned notice is not a
      # marketplace decision. A row currently COUNTER_NOTICED is excluded even
      # though it was once APPROVED_REMOVED.

      listing_removal_rate = 0.0000 if decided == 0
                             else ROUND_HALF_UP(removed / decided, 4)

      # repeat infringers: cluster ROOTS (never alias rows) at or above the
      # investigation threshold that have at least one strike attributable to
      # THIS brand.
      roots = { (s.canonical_seller_id or s.id) for s in Seller }
      repeat_infringer_count = |{ r for r in roots
            if seller(r).cluster_strike_points >= INVESTIGATE_THRESHOLD
            and EXISTS a strike attributable to brand.id against any member of
                r's cluster }|

      open_case_count = |[ c for c in EnforcementCase
                             if c.brand_id == brand.id
                             and c.case_status IN {'OPEN','IN_LITIGATION'} ]|
      enforcement_spend_cents = brand.enforcement_spend_cents
    input_set: |
      All-time, brand-scoped. Strike attributability to the brand: a
      TAKEDOWN_REMOVAL strike is attributable through takedown.claim.brand_id, a
      SEIZURE_CONFIRMED strike through investigation.brand_id, and a CD_IGNORED
      strike through case.brand_id.
    constants:
      DECIDED_STATUSES: [APPROVED_REMOVED, REJECTED, REINSTATED]
      REMOVED_STATUSES: [APPROVED_REMOVED]
      INVESTIGATE_THRESHOLD: 25.00
    precision: "listing_removal_rate: 4 decimal places, ROUND_HALF_UP; counts are integers"
    worked_examples:
      - "no takedown has ever been decided -> listing_removal_rate 0.0000 (NOT null, NOT an error, and NOT 1.0000)"
      - "1 APPROVED_REMOVED, 0 others -> decided 1, removed 1 -> 1.0000"
      - "1 APPROVED_REMOVED, 2 REJECTED -> decided 3, removed 1 -> 0.3333 (0.33333... rounds down at the 4th place)"
      - "1 APPROVED_REMOVED, 1 SUBMITTED -> decided 1, removed 1 -> 1.0000 (the SUBMITTED row is invisible to both terms)"
      - "1 REINSTATED, 0 others -> decided 1, removed 0 -> 0.0000"
      - "2 APPROVED_REMOVED, 1 REINSTATED -> decided 3, removed 2 -> 0.6667"

  - name: marketplace_decision_deadline
    trigger: "every deadline field in the domain: takedown decision_due_at and counter_notice_deadline_at, counter notice response_due_at, case cd_response_due_at, investigation response_due_at"
    algorithm: chronological
    formula: |
      def add_business_days(start_utc, n):
          # Mon..Fri are business days; Sat and Sun are not. No holiday calendar.
          # The TIME-OF-DAY of start_utc is preserved exactly.
          cursor = start_utc
          remaining = n
          while remaining > 0:
              cursor = cursor + 1 day
              if cursor.weekday() < 5:      # Mon=0 .. Fri=4
                  remaining -= 1
          return cursor
      # A start instant that itself falls on a weekend is NOT first advanced to
      # Monday; the loop simply skips the weekend days it walks over. Day 0 is
      # never counted, so add_business_days(x, n) is always strictly after x.

      takedown.decision_due_at =
          add_business_days(submitted_at, MARKETPLACE_SLA_BUSINESS_DAYS[marketplace_code])
      takedown.counter_notice_deadline_at =
          add_business_days(decided_at, COUNTER_NOTICE_FILING_BUSINESS_DAYS)
      counter_notice.response_due_at =
          add_business_days(filed_at, REBUTTAL_WINDOW_BUSINESS_DAYS)
      case.cd_response_due_at =
          add_business_days(cd_sent_at, CD_RESPONSE_BUSINESS_DAYS)
      investigation.response_due_at =
          add_business_days(detention_notice_at, DIVERSION_RESPONSE_BUSINESS_DAYS)

      # Every window is checked with `clock_now <= due_at`: acting exactly AT the
      # deadline instant is still in time; one second later is not.
    input_set: "a single start instant and a single business-day count taken from the constants below; the enrollment's marketplace_code selects the takedown SLA"
    constants:
      MARKETPLACE_SLA_BUSINESS_DAYS:
        AMZ: 5
        EBY: 8
        WLM: 10
      COUNTER_NOTICE_FILING_BUSINESS_DAYS: 10
      REBUTTAL_WINDOW_BUSINESS_DAYS: 10
      CD_RESPONSE_BUSINESS_DAYS: 14
      DIVERSION_RESPONSE_BUSINESS_DAYS: 7
      BUSINESS_WEEKDAYS: [MON, TUE, WED, THU, FRI]
    precision: "second-level UTC instants; the time-of-day component is carried through untouched"
    worked_examples:
      - "AMZ, submitted 2026-08-10T09:00:00Z (Monday) + 5 business days -> 2026-08-17T09:00:00Z (Monday)"
      - "EBY, submitted 2026-08-03T10:00:00Z (Monday) + 8 business days -> 2026-08-13T10:00:00Z (Thursday)"
      - "WLM, submitted 2026-08-17T09:00:00Z (Monday) + 10 business days -> 2026-08-31T09:00:00Z (Monday)"
      - "counter-notice filing window: decided 2026-08-12T10:00:00Z (Wednesday) + 10 business days -> 2026-08-26T10:00:00Z"
      - "rebuttal window: filed 2026-08-24T09:00:00Z (Monday) + 10 business days -> 2026-09-07T09:00:00Z (Monday)"
      - "cease-and-desist: sent 2026-08-24T09:00:00Z (Monday) + 14 business days -> 2026-09-11T09:00:00Z (Friday)"
      - "diversion response: notice 2026-08-05T08:00:00Z (Wednesday) + 7 business days -> 2026-08-14T08:00:00Z (Friday)"
      - "weekend start: 2026-08-01T00:00:00Z is a Saturday; + 5 business days -> 2026-08-07T00:00:00Z (Friday)"

# =============================================================================
# TEMPORAL INTERVAL RULES (overlap semantics — each is deliberately different)
# =============================================================================
interval_rules:
  - rule_id: representative_window_overlap
    entity: AuthorizedRepresentative
    interval: "[effective_from, effective_to)  — HALF-OPEN, end exclusive"
    open_ended: "effective_to == null means +infinity"
    scope: "same enrollment_id, designation_status == DESIGNATED, and INTERSECTING authority_scope sets (BOTH intersects every scope; SUBMIT_TAKEDOWN and AUTHORIZE_LITIGATION do not intersect each other)"
    conflict: "two windows conflict iff a_from < b_to and b_from < a_to"
    adjacency: "ALLOWED — a window ending exactly when the next begins does not conflict, because the end is exclusive"
    error_id: ERR_REPRESENTATIVE_WINDOW_OVERLAP
  - rule_id: test_buy_cooling_period
    entity: TestBuy
    interval: "[ordered_at - 7 days, ordered_at + 7 days]  — CLOSED, buffer-inflated on both sides"
    open_ended: "not applicable"
    scope: "same seller (resolved through claim.listing.seller_id), excluding rows with status == CANCELLED"
    conflict: "a new order at T conflicts with an existing order at E iff |T - E| <= 7 days, i.e. EXACTLY 7 days apart IS a conflict (inclusive endpoints)"
    adjacency: "NOT allowed — the boundary instant itself is a conflict, the opposite of the representative rule"
    error_id: ERR_TEST_BUY_COOLING_PERIOD
  - rule_id: recordation_window_overlap
    entity: CustomsRecordation
    interval: "[recorded_on, expires_on]  — CLOSED on both ends, whole-date granularity"
    open_ended: "not applicable — expires_on is mandatory"
    scope: "same (brand_id, customs_authority_code, nice_class) triple among rows with status == RECORDED"
    conflict: "two intervals conflict iff a_start <= b_end and b_start <= a_end; sharing a single boundary DATE is a conflict"
    adjacency: "NOT allowed on a shared date; a new interval starting the DAY AFTER an existing expires_on is fine"
    error_id: ERR_RECORDATION_WINDOW_OVERLAP

# =============================================================================
# 1.4 VALIDATION RULES (evaluated in strict ascending priority order; the FIRST
#     violated rule determines the response and nothing is persisted)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role names one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body / query shape: required fields present, enums in range, integers non-negative, dates ISO-8601, decimal sub-scores within [0, 1], effective_from < effective_to when both supplied, recorded_on <= expires_on"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints and all list endpoints with filters"
  - priority: 4
    category: existence
    check: "every id embedded in the PATH exists, validated strictly left to right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 5
    category: existence
    check: "every foreign key supplied in the BODY exists, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying FK fields"
  - priority: 6
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 15
    category: state
    check: "the supplied expected_<parent>_version equals the parent row's current version (see §1.2.1)"
    error_id: "ERR_STALE_BRAND_VERSION | ERR_STALE_CLAIM_VERSION | ERR_STALE_SELLER_VERSION"
    http_status: 412
    applies_to: "POST /brand-protection/enrollments, POST /brand-protection/evidence-packages, POST /brand-protection/sellers/{sellerId}/link-alias"
  - priority: 20
    category: state
    check: "the target row is in a state from which the requested transition exists (including the cross-entity state gates spelled out in §1.2: claim SUBSTANTIATED before submit, package SEALED before submit, test buy RECEIVED before authenticate, investigation EVIDENCE_SUBMITTED before a DIVERSION_CONFIRMED conclusion, litigation_status NONE before a NO_ACTION closure)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 22
    category: state
    check: "the referenced MarketplaceEnrollment.enrollment_status == ACTIVE"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /brand-protection/takedowns/{takedownId}/submit, POST /brand-protection/takedowns/{takedownId}/resubmit, POST /brand-protection/representatives"
  - priority: 25
    category: state
    check: "the target EvidencePackage is still ASSEMBLING (items may not be appended to a SEALED or WITHDRAWN package)"
    error_id: ERR_EVIDENCE_PACKAGE_SEALED
    http_status: 409
    applies_to: "POST /brand-protection/evidence-packages/{packageId}/items"
  - priority: 28
    category: state
    check: "the target MonitoredListing.monitor_status == FLAGGED"
    error_id: ERR_LISTING_NOT_FLAGGED
    http_status: 409
    applies_to: "POST /brand-protection/claims"
  - priority: 30
    category: state
    check: "the acting AuthorizedRepresentative row is DESIGNATED and the logical clock now lies inside [effective_from, effective_to)"
    error_id: ERR_REPRESENTATIVE_NOT_EFFECTIVE
    http_status: 409
    applies_to: "POST /brand-protection/takedowns/{takedownId}/submit, POST /brand-protection/takedowns/{takedownId}/resubmit, POST /brand-protection/cases/{caseId}/cease-desist, POST /brand-protection/cases/{caseId}/authorize-litigation"
  - priority: 35
    category: business_safety
    check: "the acting representative's authority_scope set contains the scope the operation demands (SUBMIT_TAKEDOWN for notices and cease-and-desist letters, AUTHORIZE_LITIGATION for litigation authorisation; BOTH satisfies either)"
    error_id: ERR_REPRESENTATIVE_SCOPE_INSUFFICIENT
    http_status: 403
    applies_to: "POST /brand-protection/takedowns/{takedownId}/submit, POST /brand-protection/takedowns/{takedownId}/resubmit, POST /brand-protection/cases/{caseId}/cease-desist, POST /brand-protection/cases/{caseId}/authorize-litigation"
  - priority: 40
    category: business_safety
    check: "SEGREGATION OF DUTIES — the representative authorising litigation is not the one that sent the cease-and-desist letter (X-User-ID != case.cease_desist_sent_by_rep_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /brand-protection/cases/{caseId}/authorize-litigation"
  - priority: 42
    category: business_safety
    check: "the case's Seller.status IN {UNDER_INVESTIGATION, BLOCKED} — correspondence and litigation may only be aimed at an escalated seller"
    error_id: ERR_SELLER_NOT_UNDER_INVESTIGATION
    http_status: 422
    applies_to: "POST /brand-protection/cases/{caseId}/cease-desist"
  - priority: 44
    category: business_safety
    check: "the correspondence track has been answered or has lapsed (correspondence_status IN {CD_RESPONDED, CD_IGNORED}) before litigation may be authorised"
    error_id: ERR_CEASE_DESIST_NOT_ANSWERED
    http_status: 409
    applies_to: "POST /brand-protection/cases/{caseId}/authorize-litigation"
  - priority: 45
    category: business_safety
    check: "the asserted TrademarkRegistration is enforceable: status == REGISTERED (not PENDING, not LAPSED) and, for marketplace enrollment activation, its nice_class covers the requested class"
    error_id: ERR_REGISTRATION_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /brand-protection/enrollments/{enrollmentId}/activate, POST /brand-protection/takedowns, POST /brand-protection/takedowns/{takedownId}/submit, POST /brand-protection/customs-recordations/{recordationId}/record"
  - priority: 46
    category: business_safety
    check: "the registration behind a customs recordation sits on the principal register"
    error_id: ERR_RECORDATION_NOT_PRINCIPAL_REGISTER
    http_status: 422
    applies_to: "POST /brand-protection/customs-recordations/{recordationId}/record"
  - priority: 48
    category: business_safety
    check: "the test buy's chain_of_custody_ref is non-null before an authentication verdict may be recorded"
    error_id: ERR_CHAIN_OF_CUSTODY_INCOMPLETE
    http_status: 422
    applies_to: "POST /brand-protection/test-buys/{testBuyId}/authenticate"
  - priority: 50
    category: business_safety
    check: "the evidence package satisfies BOTH seal conjuncts: full required-type coverage and completeness_score >= 0.8000"
    error_id: ERR_EVIDENCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /brand-protection/evidence-packages/{packageId}/seal"
  - priority: 52
    category: business_safety
    check: "the FULL variant of claim_substantiation_score reaches SUBSTANTIATION_THRESHOLD (85.00); on failure NO field is persisted, not even the freshly computed score"
    error_id: ERR_CLAIM_NOT_SUBSTANTIATED
    http_status: 422
    applies_to: "POST /brand-protection/claims/{claimId}/substantiate"
  - priority: 55
    category: business_temporal
    check: "a counter notice is filed at or before the takedown's counter_notice_deadline_at"
    error_id: ERR_COUNTER_NOTICE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /brand-protection/counter-notices"
  - priority: 56
    category: business_temporal
    check: "border-seizure evidence is submitted at or before the investigation's response_due_at"
    error_id: ERR_SEIZURE_RESPONSE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /brand-protection/diversion-investigations/{investigationId}/submit-evidence"
  - priority: 57
    category: business_temporal
    check: "no TakedownSubmission of the claim sits in a live status {SUBMITTED, APPROVED_REMOVED, COUNTER_NOTICED} — a claim may not be withdrawn while a marketplace notice is still in flight or in force"
    error_id: ERR_DECISION_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /brand-protection/claims/{claimId}/dismiss"
  - priority: 58
    category: business_referential
    check: "the source TestBuy of a TEST_BUY investigation is AUTHENTICATED_COUNTERFEIT and its lot_code matches the investigation's lot_code"
    error_id: ERR_LOT_CODE_NOT_TRACEABLE
    http_status: 422
    applies_to: "POST /brand-protection/diversion-investigations, POST /brand-protection/diversion-investigations/{investigationId}/submit-evidence"
  - priority: 60
    category: business_referential
    check: "the evidence package belongs to the same claim as the takedown, and on resubmit differs from the package already attached"
    error_id: ERR_EVIDENCE_PACKAGE_MISMATCH
    http_status: 422
    applies_to: "POST /brand-protection/takedowns, POST /brand-protection/takedowns/{takedownId}/resubmit"
  - priority: 62
    category: business_referential
    check: "an alias link is at most one level deep: the alias must not already name a canonical seller, the target must not itself be an alias, and self-linking is refused"
    error_id: ERR_ALIAS_CHAIN_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /brand-protection/sellers/{sellerId}/link-alias"
  - priority: 65
    category: business_constraint
    check: "at most one CounterNotice per takedown"
    error_id: ERR_DUPLICATE_COUNTER_NOTICE
    http_status: 409
    applies_to: "POST /brand-protection/counter-notices"
  - priority: 66
    category: business_constraint
    check: "at most one ACTIVE enrollment per (brand_id, marketplace_code); a SUBMITTED or SUSPENDED row on the same marketplace does NOT block the create — it is superseded (-> TERMINATED) by the new enrollment per §1.2, which is the only way that transition is reached"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /brand-protection/enrollments"
  - priority: 68
    category: business_constraint
    check: "round_number < MAX_TAKEDOWN_ROUNDS (3) before a resubmission is accepted"
    error_id: ERR_MAX_TAKEDOWN_ROUNDS
    http_status: 409
    applies_to: "POST /brand-protection/takedowns/{takedownId}/resubmit"
  - priority: 70
    category: business_temporal
    check: "the representative's [effective_from, effective_to) window does not overlap another DESIGNATED representative of the same enrollment with an intersecting authority_scope set (half-open, adjacency allowed)"
    error_id: ERR_REPRESENTATIVE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /brand-protection/representatives"
  - priority: 72
    category: business_temporal
    check: "the new test buy is more than 7 days away from every non-CANCELLED test buy against the same seller (closed, buffer-inflated interval — exactly 7 days apart is refused)"
    error_id: ERR_TEST_BUY_COOLING_PERIOD
    http_status: 409
    applies_to: "POST /brand-protection/claims/{claimId}/test-buys"
  - priority: 74
    category: business_temporal
    check: "the recordation's [recorded_on, expires_on] interval does not intersect another RECORDED recordation for the same (brand_id, customs_authority_code, nice_class)"
    error_id: ERR_RECORDATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /brand-protection/customs-recordations/{recordationId}/record"
  - priority: 80
    category: business_fiscal
    check: "brand.enforcement_spend_cents + this test buy's billable_total_cents <= brand.enforcement_budget_cents (fiscal checks run LAST, after every state and safety check)"
    error_id: ERR_TEST_BUY_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /brand-protection/claims/{claimId}/test-buys"

# --- deliberately engineered priority conflicts (Difficulty Rule 5) ----------
validation_conflict_pairs:
  - pair_id: state-beats-fiscal-on-test-buy
    lower_priority_rule: "priority 20 — ERR_INVALID_STATE (the claim is DISMISSED, so no test buy may be ordered against it)"
    higher_priority_rule: "priority 80 — ERR_TEST_BUY_BUDGET_EXCEEDED (the brand's remaining budget cannot cover the order)"
    endpoint: "POST /brand-protection/claims/{claimId}/test-buys"
    single_request_violating_both: "order a test buy on a DISMISSED claim of a brand whose enforcement_spend_cents already exhausts enforcement_budget_cents"
    expected_error_id: ERR_INVALID_STATE
    expected_http_status: 409
    why: "state precedes every business rule; the fiscal check is the last gate in the ladder and is never reached"
  - pair_id: safety-beats-referential-on-takedown-create
    lower_priority_rule: "priority 45 — ERR_REGISTRATION_NOT_ELIGIBLE (the claim's asserted registration has LAPSED)"
    higher_priority_rule: "priority 60 — ERR_EVIDENCE_PACKAGE_MISMATCH (the supplied package belongs to a different claim)"
    endpoint: "POST /brand-protection/takedowns"
    single_request_violating_both: "create a takedown quoting a claim whose asserted registration has lapsed AND an evidence package that belongs to another claim"
    expected_error_id: ERR_REGISTRATION_NOT_ELIGIBLE
    expected_http_status: 422
    why: "regulatory eligibility (business_safety, 45) outranks referential coherence (business_referential, 60) in this domain — asserting a dead trademark is the graver defect"
  - pair_id: temporal-beats-constraint-on-counter-notice
    lower_priority_rule: "priority 55 — ERR_COUNTER_NOTICE_WINDOW_EXPIRED (the filing window has closed)"
    higher_priority_rule: "priority 65 — ERR_DUPLICATE_COUNTER_NOTICE (a counter notice already exists for this takedown)"
    endpoint: "POST /brand-protection/counter-notices"
    single_request_violating_both: "file a second counter notice against a takedown after its counter_notice_deadline_at has passed"
    expected_error_id: ERR_COUNTER_NOTICE_WINDOW_EXPIRED
    expected_http_status: 422
    why: "the temporal gate at 55 fires before the uniqueness gate at 65; a late duplicate reports lateness, not duplication"

# =============================================================================
# 1.5 API ENDPOINTS (70 total, every business path under /brand-protection)
# =============================================================================
endpoints:
  # --- test-driving surface ---------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every deadline, expiry, window and decay computation in this domain reads instead of wall-clock time. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [BrandAdministrator, MarketplaceLiaison, CustomsCoordinator]
    code: 200
    input: [to_iso8601]
    output: "{current_utc: string}"
    side_effects: ["no rows are mutated; subsequent requests evaluate every temporal rule against the new instant"]

  # --- brands ----------------------------------------------------------------
  - method: POST
    path: "/brand-protection/brands"
    description: "Registers a brand owner in the registry. Starts in DRAFT with enforcement_spend_cents 0."
    roles: [BrandAdministrator]
    code: 201
    input: [name, owner_legal_entity, home_jurisdiction, authorized_msrp_cents, "enforcement_budget_cents?"]
    output: Brand
    side_effects: ["status = DRAFT", "enforcement_spend_cents = 0", "enforcement_budget_cents defaults to 500000 when omitted"]
  - method: GET
    path: "/brand-protection/brands/{brandId}"
    description: "Reads one brand, including its derived status and spend ledger."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    output: Brand
    side_effects: []
  - method: GET
    path: "/brand-protection/brands"
    description: "Lists brands with pagination and optional status filtering."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    input: ["status?", "home_jurisdiction?", "limit?", "offset?"]
    output: "Brand[]"
    side_effects: []
  - method: GET
    path: "/brand-protection/brands/{brandId}/enforcement-metrics"
    description: "Computed read: listing removal rate and repeat-infringer count for the brand (calculations.brand_enforcement_metrics). Nothing is persisted."
    roles: [BrandAdministrator, EnforcementAnalyst, LegalCounsel]
    code: 200
    output: "{listing_removal_rate: decimal, repeat_infringer_count: integer, decided_takedown_count: integer, removed_takedown_count: integer, open_case_count: integer, enforcement_spend_cents: integer}"
    side_effects: ["runs calculations.brand_enforcement_metrics"]

  # --- trademark registrations ------------------------------------------------
  - method: POST
    path: "/brand-protection/trademark-registrations"
    description: "Records a trademark registration or pending application for a brand. status accepts PENDING or REGISTERED; LAPSED is reachable only through the sweep."
    roles: [BrandAdministrator]
    code: 201
    input: [brand_id, registration_number, jurisdiction, nice_class, registration_date, expiry_date, principal_register, status]
    output: TrademarkRegistration
    side_effects: ["the registration becomes assertable by enrollments, claims and customs recordations"]
  - method: GET
    path: "/brand-protection/trademark-registrations/{registrationId}"
    description: "Reads one trademark registration."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    output: TrademarkRegistration
    side_effects: []
  - method: GET
    path: "/brand-protection/trademark-registrations"
    description: "Lists trademark registrations, filterable by owning brand."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    input: ["brand_id?", "status?", "jurisdiction?", "nice_class?", "limit?", "offset?"]
    output: "TrademarkRegistration[]"
    side_effects: []

  # --- marketplace enrollments ------------------------------------------------
  - method: POST
    path: "/brand-protection/enrollments"
    description: "Enrolls a brand in a marketplace brand registry, asserting one registration. Optimistically concurrent on the parent brand (§1.2.1 enrollment-create-stale-brand)."
    roles: [BrandAdministrator]
    code: 201
    input: [brand_id, asserted_registration_id, marketplace_code, requested_nice_class, expected_brand_version]
    output: MarketplaceEnrollment
    side_effects: ["enrollment_status = SUBMITTED", "recomputes calculations.brand_registry_posture", "increments Brand.version by 1"]
  - method: GET
    path: "/brand-protection/enrollments/{enrollmentId}"
    description: "Reads one marketplace enrollment."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    output: MarketplaceEnrollment
    side_effects: []
  - method: GET
    path: "/brand-protection/enrollments"
    description: "Lists marketplace enrollments, filterable by brand, asserted registration, marketplace, status, or the enrollment that superseded them."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    input: ["brand_id?", "asserted_registration_id?", "superseded_by_enrollment_id?", "marketplace_code?", "enrollment_status?", "limit?", "offset?"]
    output: "MarketplaceEnrollment[]"
    side_effects: []
  - method: POST
    path: "/brand-protection/enrollments/{enrollmentId}/activate"
    description: "Marketplace accepts the enrollment. Gated on the asserted registration being REGISTERED and covering the requested nice class."
    roles: [MarketplaceLiaison]
    code: 200
    output: MarketplaceEnrollment
    side_effects: ["enrollment_status = ACTIVE", "activated_at = logical clock now", "recomputes calculations.brand_registry_posture", "increments version by 1"]
  - method: POST
    path: "/brand-protection/enrollments/{enrollmentId}/suspend"
    description: "Suspends an ACTIVE enrollment, cascading through its representatives and live takedowns (CASCADE L1 -> L3)."
    roles: [MarketplaceLiaison]
    code: 200
    input: [reason_code]
    output: MarketplaceEnrollment
    side_effects: ["enrollment_status = SUSPENDED", "suspension_reason_code persisted", "every DRAFT/SUBMITTED TakedownSubmission of this enrollment -> WITHDRAWN, and each such listing's enforcement_status TAKEDOWN_PENDING -> CLAIM_OPEN", "recomputes calculations.brand_registry_posture", "increments version by 1 on every row touched"]

  # --- authorized representatives ---------------------------------------------
  - method: POST
    path: "/brand-protection/representatives"
    description: "Designates an authorized representative under an ACTIVE enrollment for a half-open effective window. Overlap-checked against intersecting authority scopes."
    roles: [BrandAdministrator]
    code: 201
    input: [enrollment_id, authority_scope, effective_from, power_of_attorney_ref, "effective_to?"]
    output: AuthorizedRepresentative
    side_effects: ["designation_status = DESIGNATED", "the row's id becomes a valid X-User-ID for the AuthorizedRepresentative role"]
  - method: GET
    path: "/brand-protection/representatives/{representativeId}"
    description: "Reads one authorized representative designation."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    output: AuthorizedRepresentative
    side_effects: []
  - method: GET
    path: "/brand-protection/representatives"
    description: "Lists representative designations, filterable by enrollment."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    input: ["enrollment_id?", "designation_status?", "authority_scope?", "limit?", "offset?"]
    output: "AuthorizedRepresentative[]"
    side_effects: []
  - method: POST
    path: "/brand-protection/representatives/{representativeId}/revoke"
    description: "Revokes a designation. The representative can no longer submit notices or authorize litigation, but rows already stamped with its id keep that attribution."
    roles: [BrandAdministrator]
    code: 200
    input: ["reason_code?"]
    output: AuthorizedRepresentative
    side_effects: ["designation_status = REVOKED", "revoked_at = logical clock now", "increments version by 1"]

  # --- sellers ---------------------------------------------------------------
  - method: POST
    path: "/brand-protection/sellers"
    description: "Registers a marketplace seller account under enforcement observation. Starts ACTIVE with zero strike points on both variants."
    roles: [EnforcementAnalyst]
    code: 201
    input: [marketplace_code, seller_ref, legal_name, "jurisdiction?"]
    output: Seller
    side_effects: ["status = ACTIVE", "standalone_strike_points = 0.00", "cluster_strike_points = 0.00", "canonical_seller_id = null"]
  - method: GET
    path: "/brand-protection/sellers/{sellerId}"
    description: "Reads one seller, including both strike-point variants and its escalation status."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    output: Seller
    side_effects: []
  - method: GET
    path: "/brand-protection/sellers"
    description: "Lists sellers, filterable by canonical seller (to enumerate an alias cluster), marketplace and status."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    input: ["canonical_seller_id?", "marketplace_code?", "status?", "limit?", "offset?"]
    output: "Seller[]"
    side_effects: []
  - method: POST
    path: "/brand-protection/sellers/{sellerId}/link-alias"
    description: "Declares the path seller to be an alias of a canonical seller, merging its strike history into the canonical cluster. Optimistically concurrent on the canonical row (§1.2.1 alias-link-stale-canonical-seller)."
    roles: [EnforcementAnalyst]
    code: 200
    input: [canonical_seller_id, expected_canonical_seller_version]
    output: Seller
    side_effects: ["canonical_seller_id persisted on the path seller", "recomputes cluster_strike_points for every member of the enlarged cluster and re-evaluates the escalation ladder for each", "increments version by 1 on the alias and on the canonical seller"]

  # --- monitored listings -----------------------------------------------------
  - method: POST
    path: "/brand-protection/listings"
    description: "Places a marketplace listing under monitoring for a brand. Starts NEW / NONE with no match scores yet."
    roles: [EnforcementAnalyst]
    code: 201
    input: [brand_id, seller_id, marketplace_code, listing_ref, title_text, image_hash, price_cents, nice_class]
    output: MonitoredListing
    side_effects: ["monitor_status = NEW", "enforcement_status = NONE", "violation_type = NONE", "match_score = null until the first screen"]
  - method: GET
    path: "/brand-protection/listings/{listingId}"
    description: "Reads one monitored listing, including both of its state dimensions and its derived match score."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    output: MonitoredListing
    side_effects: []
  - method: GET
    path: "/brand-protection/listings"
    description: "Lists monitored listings, filterable by brand, seller and either state dimension."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    input: ["brand_id?", "seller_id?", "marketplace_code?", "monitor_status?", "enforcement_status?", "violation_type?", "limit?", "offset?"]
    output: "MonitoredListing[]"
    side_effects: []
  - method: POST
    path: "/brand-protection/listings/{listingId}/screen"
    description: "Records the automated image/text matcher output and derives price_deviation_factor, match_score, monitor_status and violation_type (calculations.listing_match_score). Re-screenable, but blocked while enforcement_status is TAKEDOWN_PENDING."
    roles: [EnforcementAnalyst]
    code: 200
    input: [image_match_score, text_match_score]
    output: MonitoredListing
    side_effects: ["runs calculations.listing_match_score", "monitor_status flips to FLAGGED or CLEARED independently of enforcement_status", "violation_type reassigned or reset to NONE", "increments version by 1"]

  # --- infringement claims ----------------------------------------------------
  - method: POST
    path: "/brand-protection/claims"
    description: "Opens an infringement claim on a FLAGGED listing, asserting one registration. Scores the PRELIMINARY variant immediately."
    roles: [EnforcementAnalyst]
    code: 201
    input: [brand_id, listing_id, asserted_registration_id, claimed_violation_type]
    output: InfringementClaim
    side_effects: ["status = DRAFT", "registration_strength and preliminary_score derived via the PRELIMINARY variant of calculations.claim_substantiation_score", "the listing's enforcement_status NONE -> CLAIM_OPEN", "increments MonitoredListing.version by 1"]
  - method: GET
    path: "/brand-protection/claims/{claimId}"
    description: "Reads one infringement claim, including both score fields."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    output: InfringementClaim
    side_effects: []
  - method: GET
    path: "/brand-protection/claims"
    description: "Lists infringement claims, filterable by brand, listing, asserted registration and status."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    input: ["brand_id?", "listing_id?", "asserted_registration_id?", "status?", "claimed_violation_type?", "limit?", "offset?"]
    output: "InfringementClaim[]"
    side_effects: []
  - method: POST
    path: "/brand-protection/claims/{claimId}/substantiate"
    description: "Runs the FULL variant of the substantiation score and promotes the claim when it reaches 85.00. On failure nothing at all is persisted."
    roles: [EnforcementAnalyst]
    code: 200
    output: InfringementClaim
    side_effects: ["runs the FULL variant of calculations.claim_substantiation_score", "status DRAFT -> SUBSTANTIATED on success", "substantiation_score persisted on success only", "increments version by 1 on success"]
  - method: POST
    path: "/brand-protection/claims/{claimId}/dismiss"
    description: "Withdraws a claim. Refused while any of its takedowns is still live. Cascades to the listing and to the claim's non-withdrawn evidence packages."
    roles: [EnforcementAnalyst]
    code: 200
    input: [reason_code]
    output: InfringementClaim
    side_effects: ["status = DISMISSED", "dismissal_reason_code persisted", "the listing's enforcement_status recomputed (CLAIM_OPEN -> NONE when no open claim remains)", "every ASSEMBLING/SEALED EvidencePackage of this claim -> WITHDRAWN", "increments version by 1 on every row touched"]

  # --- test buys --------------------------------------------------------------
  - method: POST
    path: "/brand-protection/claims/{claimId}/test-buys"
    description: "Orders a test buy to substantiate the claim. Prices the order through the tiered fee ladder and charges the brand's enforcement budget. Cooling-period checked against the seller's other non-cancelled buys."
    roles: [EnforcementAnalyst]
    code: 201
    input: [order_ref, purchase_price_cents, shipping_cents, lab_fee_cents]
    output: TestBuy
    side_effects: ["status = ORDERED", "ordered_at = logical clock now", "seller_id copied from the claim's listing", "runs calculations.test_buy_billable_total to derive subtotal_cents, service_fee_rate, service_fee_cents and billable_total_cents", "Brand.enforcement_spend_cents += billable_total_cents", "increments Brand.version by 1"]
  - method: GET
    path: "/brand-protection/test-buys/{testBuyId}"
    description: "Reads one test buy, including its derived fee breakdown and authentication verdict."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    output: TestBuy
    side_effects: []
  - method: GET
    path: "/brand-protection/test-buys"
    description: "Lists test buys, filterable by claim, seller and status."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    input: ["claim_id?", "seller_id?", "status?", "limit?", "offset?"]
    output: "TestBuy[]"
    side_effects: []
  - method: POST
    path: "/brand-protection/test-buys/{testBuyId}/receive"
    description: "Logs receipt of the purchased unit with its lot code and, when the courier supplied one, its chain-of-custody reference. A receipt without custody paperwork is accepted and leaves chain_of_custody_ref null, which later blocks authentication (ERR_CHAIN_OF_CUSTODY_INCOMPLETE) and suppresses the test-buy corroboration bonus."
    roles: [EnforcementAnalyst]
    code: 200
    input: [lot_code, "chain_of_custody_ref?"]
    output: TestBuy
    side_effects: ["status = RECEIVED", "received_at = logical clock now", "increments version by 1"]
  - method: POST
    path: "/brand-protection/test-buys/{testBuyId}/authenticate"
    description: "Records the lab verdict. The two verdicts take radically different branches: COUNTERFEIT only re-scores the claim, AUTHENTIC auto-dismisses it and clears the listing."
    roles: [EnforcementAnalyst]
    code: 200
    input: [authentication_result, lab_ref]
    output: TestBuy
    side_effects: ["status = AUTHENTICATED_COUNTERFEIT or AUTHENTICATED_AUTHENTIC", "COUNTERFEIT: re-runs the FULL variant of calculations.claim_substantiation_score so the +20.00 corroboration bonus applies; claim.status is NOT advanced", "AUTHENTIC: claim -> DISMISSED with reason TEST_BUY_AUTHENTIC, listing -> CLEARED / NONE with violation_type NONE, the claim's live evidence packages -> WITHDRAWN", "no budget refund on either branch", "increments version by 1 on every row touched"]
  - method: POST
    path: "/brand-protection/test-buys/{testBuyId}/cancel"
    description: "Cancels an ORDERED test buy and reverses its exact charge against the brand ledger (compensating action)."
    roles: [EnforcementAnalyst]
    code: 200
    input: [reason_code]
    output: TestBuy
    side_effects: ["status = CANCELLED", "Brand.enforcement_spend_cents -= billable_total_cents, restoring the ledger to its pre-order value exactly", "the row leaves the cooling-period input set", "increments version by 1 on this row and on Brand"]

  # --- evidence packages ------------------------------------------------------
  - method: POST
    path: "/brand-protection/evidence-packages"
    description: "Opens an evidence package against a claim. Optimistically concurrent on the parent claim (§1.2.1 evidence-package-create-stale-claim)."
    roles: [EnforcementAnalyst]
    code: 201
    input: [claim_id, package_ref, expected_claim_version]
    output: EvidencePackage
    side_effects: ["status = ASSEMBLING", "items = [] with item_count 0, required_type_coverage 0 and completeness_score 0.0000", "increments InfringementClaim.version by 1"]
  - method: GET
    path: "/brand-protection/evidence-packages/{packageId}"
    description: "Reads one evidence package with its item array and derived completeness score."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    output: EvidencePackage
    side_effects: []
  - method: GET
    path: "/brand-protection/evidence-packages"
    description: "Lists evidence packages, filterable by claim and status."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: "EvidencePackage[]"
    side_effects: []
  - method: POST
    path: "/brand-protection/evidence-packages/{packageId}/items"
    description: "Appends one evidence item and re-derives the completeness score. Refused once the package is SEALED."
    roles: [EnforcementAnalyst]
    code: 200
    input: [item_type, item_ref]
    output: EvidencePackage
    side_effects: ["the item is appended with added_at = logical clock now", "item_count += 1", "runs calculations.evidence_completeness_score to re-derive required_type_coverage and completeness_score", "increments version by 1"]
  - method: POST
    path: "/brand-protection/evidence-packages/{packageId}/seal"
    description: "Seals the package for submission. Both seal conjuncts must hold: full required-type coverage AND completeness_score >= 0.8000."
    roles: [EnforcementAnalyst]
    code: 200
    output: EvidencePackage
    side_effects: ["status = SEALED", "sealed_at = logical clock now", "the items array becomes immutable", "increments version by 1"]
  - method: POST
    path: "/brand-protection/evidence-packages/{packageId}/withdraw"
    description: "Withdraws a package from use. Refused while a live takedown still references it."
    roles: [EnforcementAnalyst]
    code: 200
    input: [reason_code]
    output: EvidencePackage
    side_effects: ["status = WITHDRAWN", "increments version by 1"]

  # --- takedown submissions ---------------------------------------------------
  - method: POST
    path: "/brand-protection/takedowns"
    description: "Drafts a takedown notice binding an ACTIVE enrollment, a SUBSTANTIATED claim and a SEALED evidence package of that same claim."
    roles: [EnforcementAnalyst, AuthorizedRepresentative]
    code: 201
    input: [enrollment_id, claim_id, evidence_package_id]
    output: TakedownSubmission
    side_effects: ["status = DRAFT", "round_number = 0", "submitted_by_rep_id = null until submit"]
  - method: GET
    path: "/brand-protection/takedowns/{takedownId}"
    description: "Reads one takedown notice, including its round number and every deadline it carries."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    output: TakedownSubmission
    side_effects: []
  - method: GET
    path: "/brand-protection/takedowns"
    description: "Lists takedown notices, filterable by claim, enrollment, evidence package, submitting representative and status."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    input: ["claim_id?", "enrollment_id?", "evidence_package_id?", "submitted_by_rep_id?", "status?", "limit?", "offset?"]
    output: "TakedownSubmission[]"
    side_effects: []
  - method: POST
    path: "/brand-protection/takedowns/{takedownId}/submit"
    description: "The authorized representative files the notice with the marketplace. Requires an effective, in-scope designation and an ACTIVE enrollment; stamps the marketplace SLA deadline."
    roles: [AuthorizedRepresentative]
    code: 200
    output: TakedownSubmission
    side_effects: ["status = SUBMITTED", "submitted_by_rep_id = X-User-ID", "submitted_at = logical clock now", "decision_due_at derived via calculations.marketplace_decision_deadline from the enrollment's marketplace_code", "the listing's enforcement_status -> TAKEDOWN_PENDING", "increments version by 1 on this row and on the listing"]
  - method: POST
    path: "/brand-protection/takedowns/{takedownId}/marketplace-decision"
    description: "The marketplace liaison records the platform's decision. The REMOVED branch launches the four-to-five level enforcement cascade; the REJECTED branch releases the listing with no strike."
    roles: [MarketplaceLiaison]
    code: 200
    input: [decision, marketplace_case_ref]
    output: TakedownSubmission
    side_effects: ["status = APPROVED_REMOVED or REJECTED", "decided_at = logical clock now", "REMOVED: counter_notice_deadline_at stamped, listing -> REMOVED, claim SUBSTANTIATED -> ENFORCED, a TAKEDOWN_REMOVAL strike attributed to the listing's seller, both strike variants recomputed, the seller escalated at >= 25.00, and an EnforcementCase auto-created for (claim.brand_id, seller_id) when the seller escalates and no live case exists", "REJECTED: listing -> CLAIM_OPEN and no strike", "increments version by 1 on every row touched"]
  - method: POST
    path: "/brand-protection/takedowns/{takedownId}/resubmit"
    description: "Files the next round of the notice after a rejection or reinstatement, presenting a DIFFERENT sealed package of the same claim. Capped at round_number 3."
    roles: [AuthorizedRepresentative]
    code: 200
    input: [evidence_package_id]
    output: TakedownSubmission
    side_effects: ["status = SUBMITTED", "round_number += 1", "evidence_package_id replaced", "submitted_at and decision_due_at recomputed from the current clock", "decided_at, marketplace_case_ref and counter_notice_deadline_at reset to null", "the listing's enforcement_status -> TAKEDOWN_PENDING", "increments version by 1 on this row and on the listing"]

  # --- counter notices --------------------------------------------------------
  - method: POST
    path: "/brand-protection/counter-notices"
    description: "The marketplace relays the seller's sworn counter notice against a removed listing. Must land inside the takedown's filing window and be the only counter notice on that takedown."
    roles: [MarketplaceLiaison]
    code: 201
    input: [takedown_id, seller_id, sworn_statement_ref]
    output: CounterNotice
    side_effects: ["status = FILED", "filed_at = logical clock now", "response_due_at derived via calculations.marketplace_decision_deadline (10 business days)", "the parent takedown APPROVED_REMOVED -> COUNTER_NOTICED", "the listing stays REMOVED", "increments TakedownSubmission.version by 1"]
  - method: GET
    path: "/brand-protection/counter-notices/{counterNoticeId}"
    description: "Reads one counter notice with its rebuttal deadline and resolution."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    output: CounterNotice
    side_effects: []
  - method: GET
    path: "/brand-protection/counter-notices"
    description: "Lists counter notices, filterable by takedown, seller and status."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    input: ["takedown_id?", "seller_id?", "status?", "limit?", "offset?"]
    output: "CounterNotice[]"
    side_effects: []
  - method: POST
    path: "/brand-protection/counter-notices/{counterNoticeId}/resolve"
    description: "Resolves the counter notice. REBUTTED closes the cycle back to APPROVED_REMOVED without re-charging the strike; ACCEPTED reinstates the listing and reverses the strike."
    roles: [MarketplaceLiaison]
    code: 200
    input: [resolution, "rebuttal_ref?"]
    output: CounterNotice
    side_effects: ["status = REBUTTED or ACCEPTED", "resolved_at = logical clock now", "REBUTTED: takedown COUNTER_NOTICED -> APPROVED_REMOVED, the original strike is neither reversed nor re-charged, counter_notice_deadline_at is not extended", "ACCEPTED: takedown -> REINSTATED, listing REMOVED -> REINSTATED, claim ENFORCED -> SUBSTANTIATED, the TAKEDOWN_REMOVAL strike is dropped from the input set, both strike variants recomputed and the seller de-escalated when it falls below 25.00", "increments version by 1 on every row touched"]

  # --- enforcement cases ------------------------------------------------------
  - method: POST
    path: "/brand-protection/cases"
    description: "Opens an enforcement case against an escalated seller. Also auto-created by the removal and diversion cascades."
    roles: [LegalCounsel]
    code: 201
    input: [brand_id, seller_id]
    output: EnforcementCase
    side_effects: ["correspondence_status = NONE", "litigation_status = NONE", "case_status = OPEN", "originating_takedown_id = null for manually opened cases"]
  - method: GET
    path: "/brand-protection/cases/{caseId}"
    description: "Reads one enforcement case with all three of its state dimensions."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    output: EnforcementCase
    side_effects: []
  - method: GET
    path: "/brand-protection/cases"
    description: "Lists enforcement cases, filterable by brand, seller, originating takedown, either acting representative, and rollup status."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    input: ["brand_id?", "seller_id?", "originating_takedown_id?", "cease_desist_sent_by_rep_id?", "litigation_authorized_by_rep_id?", "case_status?", "correspondence_status?", "litigation_status?", "limit?", "offset?"]
    output: "EnforcementCase[]"
    side_effects: []
  - method: POST
    path: "/brand-protection/cases/{caseId}/cease-desist"
    description: "An authorized representative sends the cease-and-desist letter, stamping the 14-business-day response deadline and pinning the segregation-of-duties identity."
    roles: [AuthorizedRepresentative]
    code: 200
    input: [letter_ref]
    output: EnforcementCase
    side_effects: ["correspondence_status = CD_SENT", "cease_desist_sent_by_rep_id = X-User-ID", "cd_sent_at = logical clock now", "cd_response_due_at derived via calculations.marketplace_decision_deadline (14 business days)", "increments version by 1"]
  - method: POST
    path: "/brand-protection/cases/{caseId}/record-response"
    description: "Legal counsel records the seller's answer to the letter, arriving inside the response window."
    roles: [LegalCounsel]
    code: 200
    input: [response_ref, response_kind]
    output: EnforcementCase
    side_effects: ["correspondence_status = CD_RESPONDED", "response_kind persisted", "increments version by 1"]
  - method: POST
    path: "/brand-protection/cases/{caseId}/authorize-litigation"
    description: "A SECOND authorized representative escalates to litigation. Requires an answered or lapsed correspondence track and an identity different from the letter's sender."
    roles: [AuthorizedRepresentative]
    code: 200
    input: [authorization_ref]
    output: EnforcementCase
    side_effects: ["litigation_status = AUTHORIZED", "litigation_authorized_by_rep_id = X-User-ID", "case_status OPEN -> IN_LITIGATION (compound rollup)", "increments version by 1"]
  - method: POST
    path: "/brand-protection/cases/{caseId}/file-suit"
    description: "Legal counsel files the complaint and records the docket reference."
    roles: [LegalCounsel]
    code: 200
    input: [docket_ref, court_code]
    output: EnforcementCase
    side_effects: ["litigation_status = FILED", "case_status stays IN_LITIGATION", "increments version by 1"]
  - method: POST
    path: "/brand-protection/cases/{caseId}/close"
    description: "Closes the case. SETTLED and DISMISSED require a FILED suit; NO_ACTION is only available while the litigation track is untouched."
    roles: [LegalCounsel]
    code: 200
    input: [outcome, "closure_note?"]
    output: EnforcementCase
    side_effects: ["closure_outcome persisted", "litigation_status = SETTLED or DISMISSED for the litigated outcomes; unchanged for NO_ACTION", "case_status = CLOSED", "strikes already attributed are NOT reversed by closure", "increments version by 1"]

  # --- customs recordations ---------------------------------------------------
  - method: POST
    path: "/brand-protection/customs-recordations"
    description: "Drafts a customs recordation of a registration with a border authority for a fixed date interval."
    roles: [CustomsCoordinator]
    code: 201
    input: [brand_id, registration_id, customs_authority_code, nice_class, recorded_on, expires_on]
    output: CustomsRecordation
    side_effects: ["status = DRAFT", "recordation_number = null until the recordation is confirmed"]
  - method: GET
    path: "/brand-protection/customs-recordations/{recordationId}"
    description: "Reads one customs recordation with its validity interval."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    output: CustomsRecordation
    side_effects: []
  - method: GET
    path: "/brand-protection/customs-recordations"
    description: "Lists customs recordations, filterable by brand, registration, authority and status."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    input: ["brand_id?", "registration_id?", "customs_authority_code?", "nice_class?", "status?", "limit?", "offset?"]
    output: "CustomsRecordation[]"
    side_effects: []
  - method: POST
    path: "/brand-protection/customs-recordations/{recordationId}/record"
    description: "Confirms the recordation with the border authority. Requires a REGISTERED, principal-register registration and a non-overlapping interval for the (brand, authority, class) triple."
    roles: [CustomsCoordinator]
    code: 200
    input: [recordation_number]
    output: CustomsRecordation
    side_effects: ["status = RECORDED", "recordation_number persisted", "the row becomes an eligible parent for BORDER_SEIZURE investigations", "increments version by 1"]

  # --- diversion / border-seizure investigations -------------------------------
  - method: POST
    path: "/brand-protection/diversion-investigations"
    description: "Opens a supply-chain leak investigation, either from a border seizure under a RECORDED recordation or from an AUTHENTICATED_COUNTERFEIT test buy whose lot code matches."
    roles: [CustomsCoordinator]
    code: 201
    input: [brand_id, source_kind, lot_code, "recordation_id?", "source_test_buy_id?", "seller_id?", "seizure_ref?", "port_code?", "seized_qty?", "declared_value_cents?"]
    output: DiversionInvestigation
    side_effects: ["status = OPEN", "for BORDER_SEIZURE: detention_notice_at = logical clock now and response_due_at derived via calculations.marketplace_decision_deadline (7 business days)", "for TEST_BUY: detention_notice_at and response_due_at stay null and the lot code is verified against the source test buy"]
  - method: GET
    path: "/brand-protection/diversion-investigations/{investigationId}"
    description: "Reads one diversion investigation with its seizure details and findings."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    output: DiversionInvestigation
    side_effects: []
  - method: GET
    path: "/brand-protection/diversion-investigations"
    description: "Lists diversion investigations, filterable by brand, recordation, source test buy, suspected seller and status."
    roles: [BrandAdministrator, EnforcementAnalyst, AuthorizedRepresentative, MarketplaceLiaison, CustomsCoordinator, LegalCounsel]
    code: 200
    input: ["brand_id?", "recordation_id?", "source_test_buy_id?", "seller_id?", "source_kind?", "status?", "limit?", "offset?"]
    output: "DiversionInvestigation[]"
    side_effects: []
  - method: POST
    path: "/brand-protection/diversion-investigations/{investigationId}/submit-evidence"
    description: "The analyst files the brand's evidence and names the suspected distributor. For border seizures this must land inside the 7-business-day detention response window."
    roles: [EnforcementAnalyst]
    code: 200
    input: [evidence_ref, suspected_distributor_ref]
    output: DiversionInvestigation
    side_effects: ["status = EVIDENCE_SUBMITTED", "evidence_ref and suspected_distributor_ref persisted", "increments version by 1"]
  - method: POST
    path: "/brand-protection/diversion-investigations/{investigationId}/conclude"
    description: "Concludes the investigation. DIVERSION_CONFIRMED requires the EVIDENCE_SUBMITTED state and a named seller, and attributes the heaviest strike in the domain; RELEASED may also be reached directly from OPEN."
    roles: [CustomsCoordinator]
    code: 200
    input: [outcome, findings_ref]
    output: DiversionInvestigation
    side_effects: ["status = DIVERSION_CONFIRMED or RELEASED", "concluded_at = logical clock now", "DIVERSION_CONFIRMED: a SEIZURE_CONFIRMED strike (25.15 base points) attributed to seller_id, both strike variants recomputed, the seller escalated at >= 25.00 and auto-blocked at >= 60.00, and an EnforcementCase auto-created for (brand_id, seller_id) when the seller escalates and no live case exists", "RELEASED: no strike, no case", "increments version by 1 on every row touched"]

  # --- operational sweep ------------------------------------------------------
  - method: POST
    path: "/brand-protection/ops/run-enforcement-sweep"
    description: "Runs every time-driven rule in the domain against the current logical clock, in a PINNED step order. Idempotent: a second run at the same clock value changes nothing and returns all-zero counts."
    roles: [MarketplaceLiaison, BrandAdministrator]
    code: 200
    output: "{lapsed_registration_count: integer, suspended_enrollment_count: integer, withdrawn_takedown_count: integer, expired_counter_notice_count: integer, reinstated_takedown_count: integer, cd_ignored_case_count: integer, expired_recordation_count: integer, escalated_seller_count: integer, blocked_seller_count: integer, deescalated_seller_count: integer}"
    side_effects:
      - "STEP 1 — lapse registrations: every REGISTERED TrademarkRegistration whose expiry_date has passed -> LAPSED; each ACTIVE enrollment asserting it -> SUSPENDED with reason REGISTRATION_LAPSED, cascading to its representatives and live takedowns; affected brands' postures re-derived"
      - "STEP 2 — expire counter notices: every FILED CounterNotice past response_due_at -> EXPIRED with resolved_at = response_due_at; its takedown COUNTER_NOTICED -> REINSTATED, listing -> REINSTATED, claim ENFORCED -> SUBSTANTIATED, and the TAKEDOWN_REMOVAL strike leaves the input set"
      - "STEP 3 — ignore cease-and-desist: every CD_SENT EnforcementCase past cd_response_due_at -> CD_IGNORED, attributing a CD_IGNORED strike with effective_at = cd_response_due_at"
      - "STEP 4 — expire recordations: every RECORDED CustomsRecordation whose expires_on has passed -> EXPIRED, leaving OPEN investigations untouched"
      - "STEP 5 — decay and auto-block: recompute both strike variants for every seller at the current clock (applying the 180-day decay weight) and auto-block any seller whose cluster total is >= 60.00"
      - "STEP 6 — escalate and de-escalate: apply the remaining escalation ladder, moving sellers between ACTIVE and UNDER_INVESTIGATION"
      - "the step order is normative: strikes removed in step 2 and added in step 3 are both visible to the step 5 recompute, so the sweep never reports a stale escalation"
      - "NO EnforcementCase row is ever created by the sweep — auto-creation happens only in the marketplace-decision and diversion-conclude cascades, where the owning brand is unambiguous"
      - "increments version by 1 on every row the sweep actually changes and on no other row"

# =============================================================================
# 1.6 ERROR CODE CATALOG
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the requested endpoint"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body: a required field is missing, an enum is out of range, a number is negative, a timestamp is not ISO-8601, a sub-score falls outside [0, 1], effective_from >= effective_to, or recorded_on > expires_on"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset negative"
  - id: ERR_BRAND_NOT_FOUND
    http: 404
    condition: "the referenced brand id does not exist"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "the referenced trademark registration id does not exist"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "the referenced marketplace enrollment id does not exist"
  - id: ERR_REPRESENTATIVE_NOT_FOUND
    http: 404
    condition: "the referenced authorized representative id does not exist, including an X-User-ID that names no representative row while acting as AuthorizedRepresentative"
  - id: ERR_SELLER_NOT_FOUND
    http: 404
    condition: "the referenced seller id does not exist"
  - id: ERR_LISTING_NOT_FOUND
    http: 404
    condition: "the referenced monitored listing id does not exist"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "the referenced infringement claim id does not exist"
  - id: ERR_TEST_BUY_NOT_FOUND
    http: 404
    condition: "the referenced test buy id does not exist"
  - id: ERR_EVIDENCE_PACKAGE_NOT_FOUND
    http: 404
    condition: "the referenced evidence package id does not exist"
  - id: ERR_TAKEDOWN_NOT_FOUND
    http: 404
    condition: "the referenced takedown submission id does not exist"
  - id: ERR_COUNTER_NOTICE_NOT_FOUND
    http: 404
    condition: "the referenced counter notice id does not exist"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "the referenced enforcement case id does not exist"
  - id: ERR_CUSTOMS_RECORDATION_NOT_FOUND
    http: 404
    condition: "the referenced customs recordation id does not exist"
  - id: ERR_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "the referenced diversion investigation id does not exist"
  - id: ERR_STALE_BRAND_VERSION
    http: 412
    condition: "expected_brand_version does not equal the brand's current version"
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version does not equal the claim's current version"
  - id: ERR_STALE_SELLER_VERSION
    http: 412
    condition: "expected_canonical_seller_version does not equal the canonical seller's current version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition does not exist from the row's current state, or a cross-entity state gate declared in §1.2 is unmet (claim not SUBSTANTIATED, package not SEALED, test buy not RECEIVED, investigation not EVIDENCE_SUBMITTED, litigation track already engaged for a NO_ACTION closure)"
  - id: ERR_ENROLLMENT_NOT_ACTIVE
    http: 409
    condition: "the referenced marketplace enrollment is not ACTIVE"
  - id: ERR_LISTING_NOT_FLAGGED
    http: 409
    condition: "a claim is opened on a listing whose monitor_status is not FLAGGED"
  - id: ERR_EVIDENCE_PACKAGE_SEALED
    http: 409
    condition: "an item is appended to a package that is no longer ASSEMBLING"
  - id: ERR_REPRESENTATIVE_NOT_EFFECTIVE
    http: 409
    condition: "the acting representative is REVOKED, or the logical clock now falls outside its half-open [effective_from, effective_to) window"
  - id: ERR_REPRESENTATIVE_SCOPE_INSUFFICIENT
    http: 403
    condition: "the acting representative's authority_scope set does not contain the scope the operation demands"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the representative authorising litigation is the same one that sent the cease-and-desist letter"
  - id: ERR_SELLER_NOT_UNDER_INVESTIGATION
    http: 422
    condition: "correspondence is aimed at a seller whose status is still ACTIVE"
  - id: ERR_CEASE_DESIST_NOT_ANSWERED
    http: 409
    condition: "litigation is authorised before the correspondence track reached CD_RESPONDED or CD_IGNORED"
  - id: ERR_REGISTRATION_NOT_ELIGIBLE
    http: 422
    condition: "the asserted registration is PENDING or LAPSED, or its nice class does not cover the requested class"
  - id: ERR_RECORDATION_NOT_PRINCIPAL_REGISTER
    http: 422
    condition: "a customs recordation is confirmed against a registration that is not on the principal register"
  - id: ERR_CHAIN_OF_CUSTODY_INCOMPLETE
    http: 422
    condition: "an authentication verdict is recorded on a test buy with no chain_of_custody_ref"
  - id: ERR_EVIDENCE_INCOMPLETE
    http: 422
    condition: "a seal is attempted with incomplete required-type coverage or a completeness_score below 0.8000"
  - id: ERR_CLAIM_NOT_SUBSTANTIATED
    http: 422
    condition: "the FULL substantiation score falls below 85.00; nothing is persisted"
  - id: ERR_COUNTER_NOTICE_WINDOW_EXPIRED
    http: 422
    condition: "a counter notice is filed after the takedown's counter_notice_deadline_at"
  - id: ERR_SEIZURE_RESPONSE_WINDOW_EXPIRED
    http: 422
    condition: "border-seizure evidence is submitted after the investigation's response_due_at"
  - id: ERR_DECISION_WINDOW_OPEN
    http: 409
    condition: "a claim is dismissed while one of its takedowns is SUBMITTED, APPROVED_REMOVED or COUNTER_NOTICED"
  - id: ERR_LOT_CODE_NOT_TRACEABLE
    http: 422
    condition: "a TEST_BUY investigation names a source test buy that is not AUTHENTICATED_COUNTERFEIT or whose lot_code differs from the investigation's"
  - id: ERR_EVIDENCE_PACKAGE_MISMATCH
    http: 422
    condition: "the evidence package belongs to a different claim than the takedown, or a resubmission re-presents the package already attached"
  - id: ERR_ALIAS_CHAIN_NOT_ALLOWED
    http: 422
    condition: "an alias link would be more than one level deep, or a seller is linked to itself"
  - id: ERR_DUPLICATE_COUNTER_NOTICE
    http: 409
    condition: "a second counter notice is filed against the same takedown"
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "the brand already holds an ACTIVE enrollment on that marketplace (a SUBMITTED or SUSPENDED row is superseded instead of refused)"
  - id: ERR_MAX_TAKEDOWN_ROUNDS
    http: 409
    condition: "a resubmission is attempted when round_number has already reached 3"
  - id: ERR_REPRESENTATIVE_WINDOW_OVERLAP
    http: 409
    condition: "a new designation's half-open window overlaps a DESIGNATED peer of the same enrollment with an intersecting authority scope"
  - id: ERR_TEST_BUY_COOLING_PERIOD
    http: 409
    condition: "the new order falls within 7 days (inclusive) of a non-cancelled test buy against the same seller"
  - id: ERR_RECORDATION_WINDOW_OVERLAP
    http: 409
    condition: "the recordation's closed date interval intersects another RECORDED recordation for the same brand, authority and nice class"
  - id: ERR_TEST_BUY_BUDGET_EXCEEDED
    http: 402
    condition: "the brand's enforcement budget cannot absorb the order's billable_total_cents"

# =============================================================================
# 1.7 RBAC MATRIX (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: BrandAdministrator
    description: "The brand owner's registry administrator: registers brands and trademark registrations, enrolls brands in marketplace registries, and designates or revokes authorized representatives."
    identity: opaque
    exclusive_operations:
      - "POST /brand-protection/brands"
      - "POST /brand-protection/trademark-registrations"
      - "POST /brand-protection/enrollments"
      - "POST /brand-protection/representatives"
      - "POST /brand-protection/representatives/{representativeId}/revoke"
    shared_operations:
      - "POST /_clock/set_current_utc (with MarketplaceLiaison, CustomsCoordinator)"
      - "POST /brand-protection/ops/run-enforcement-sweep (with MarketplaceLiaison)"
      - "GET /brand-protection/brands/{brandId}/enforcement-metrics (with EnforcementAnalyst, LegalCounsel)"
      - "every GET read and list endpoint"
  - name: EnforcementAnalyst
    description: "The brand protection analyst: monitors and screens listings, opens and substantiates claims, runs test buys, assembles evidence packages, maintains the seller alias graph, and files diversion evidence."
    identity: opaque
    exclusive_operations:
      - "POST /brand-protection/sellers"
      - "POST /brand-protection/sellers/{sellerId}/link-alias"
      - "POST /brand-protection/listings"
      - "POST /brand-protection/listings/{listingId}/screen"
      - "POST /brand-protection/claims"
      - "POST /brand-protection/claims/{claimId}/substantiate"
      - "POST /brand-protection/claims/{claimId}/dismiss"
      - "POST /brand-protection/claims/{claimId}/test-buys"
      - "POST /brand-protection/test-buys/{testBuyId}/receive"
      - "POST /brand-protection/test-buys/{testBuyId}/authenticate"
      - "POST /brand-protection/test-buys/{testBuyId}/cancel"
      - "POST /brand-protection/evidence-packages"
      - "POST /brand-protection/evidence-packages/{packageId}/items"
      - "POST /brand-protection/evidence-packages/{packageId}/seal"
      - "POST /brand-protection/evidence-packages/{packageId}/withdraw"
      - "POST /brand-protection/diversion-investigations/{investigationId}/submit-evidence"
    shared_operations:
      - "POST /brand-protection/takedowns (with AuthorizedRepresentative)"
      - "GET /brand-protection/brands/{brandId}/enforcement-metrics (with BrandAdministrator, LegalCounsel)"
      - "every GET read and list endpoint"
  - name: AuthorizedRepresentative
    description: "The designated agent of record for a marketplace enrollment. X-User-ID is the id of an AuthorizedRepresentative row, so every notice and letter it files is attributable to a specific designation with its own effective window and authority scope. This is the role the segregation-of-duties rule constrains."
    identity: "entity_backed:AuthorizedRepresentative"
    exclusive_operations:
      - "POST /brand-protection/takedowns/{takedownId}/submit"
      - "POST /brand-protection/takedowns/{takedownId}/resubmit"
      - "POST /brand-protection/cases/{caseId}/cease-desist"
      - "POST /brand-protection/cases/{caseId}/authorize-litigation"
    shared_operations:
      - "POST /brand-protection/takedowns (with EnforcementAnalyst)"
      - "every GET read and list endpoint"
    identity_notes:
      - "X-User-ID MUST equal the id of an existing AuthorizedRepresentative row; an id that names no such row is ERR_REPRESENTATIVE_NOT_FOUND (404)"
      - "the row's designation_status and [effective_from, effective_to) window gate the operation via ERR_REPRESENTATIVE_NOT_EFFECTIVE (409)"
      - "the row's authority_scope set gates the operation via ERR_REPRESENTATIVE_SCOPE_INSUFFICIENT (403)"
      - "authorize-litigation additionally requires X-User-ID != case.cease_desist_sent_by_rep_id (ERR_SEGREGATION_OF_DUTIES, 409) and a designation sitting under an ACTIVE enrollment of the case's brand"
  - name: MarketplaceLiaison
    description: "The marketplace-side counterparty: activates and suspends brand enrollments, records platform decisions on notices, relays seller counter notices and resolves them."
    identity: opaque
    exclusive_operations:
      - "POST /brand-protection/enrollments/{enrollmentId}/activate"
      - "POST /brand-protection/enrollments/{enrollmentId}/suspend"
      - "POST /brand-protection/takedowns/{takedownId}/marketplace-decision"
      - "POST /brand-protection/counter-notices"
      - "POST /brand-protection/counter-notices/{counterNoticeId}/resolve"
    shared_operations:
      - "POST /_clock/set_current_utc (with BrandAdministrator, CustomsCoordinator)"
      - "POST /brand-protection/ops/run-enforcement-sweep (with BrandAdministrator)"
      - "every GET read and list endpoint"
  - name: CustomsCoordinator
    description: "The border-enforcement coordinator: records trademark registrations with customs authorities, opens border-seizure and supply-chain-leak investigations, and concludes them."
    identity: opaque
    exclusive_operations:
      - "POST /brand-protection/customs-recordations"
      - "POST /brand-protection/customs-recordations/{recordationId}/record"
      - "POST /brand-protection/diversion-investigations"
      - "POST /brand-protection/diversion-investigations/{investigationId}/conclude"
    shared_operations:
      - "POST /_clock/set_current_utc (with BrandAdministrator, MarketplaceLiaison)"
      - "every GET read and list endpoint"
  - name: LegalCounsel
    description: "Outside or in-house counsel: opens enforcement cases, records seller responses to cease-and-desist letters, files suit once litigation has been authorized by a representative other than the letter's sender, and closes cases."
    identity: opaque
    exclusive_operations:
      - "POST /brand-protection/cases"
      - "POST /brand-protection/cases/{caseId}/record-response"
      - "POST /brand-protection/cases/{caseId}/file-suit"
      - "POST /brand-protection/cases/{caseId}/close"
    shared_operations:
      - "GET /brand-protection/brands/{brandId}/enforcement-metrics (with BrandAdministrator, EnforcementAnalyst)"
      - "every GET read and list endpoint"

role_model_notes:
  segregation_of_duties: |
    The domain's compliance spine is a two-representative rule on the litigation
    path. Sending the cease-and-desist letter stamps
    EnforcementCase.cease_desist_sent_by_rep_id; authorising litigation refuses
    that same X-User-ID with ERR_SEGREGATION_OF_DUTIES (409). Because
    AuthorizedRepresentative is entity_backed, the two identities are concrete
    rows, and a brand that has designated only one representative simply cannot
    reach litigation_status AUTHORIZED — it must designate a second one, whose
    authority_scope set must contain AUTHORIZE_LITIGATION and whose effective
    window must cover the logical clock now. Note the scope sets deliberately do
    NOT intersect between SUBMIT_TAKEDOWN and AUTHORIZE_LITIGATION, so two
    single-scope designations may hold overlapping effective windows on the same
    enrollment, while two BOTH designations may not.
  cross_role_handoffs: |
    Every enforcement outcome requires at least three distinct roles:
    EnforcementAnalyst builds the case, AuthorizedRepresentative files it,
    MarketplaceLiaison decides it, and LegalCounsel litigates it. No role can
    complete a removal alone, and no role may perform another's exclusive
    operations (ERR_UNAUTHORIZED, 403).
