              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-1007", customer_name: "Esme Cardoso", service_address: "5 Gable Row", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_e_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_e_id}", meter_serial: "MTR-E-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
              captures: { meter_e_id: $.data.id }
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_e_id}", read_date: "2025-05-31", read_type: "ACTUAL", reading_value: 100000 }
              as: MeterTechnician
            - call: "POST /meter-readings"
              payload: { meter_id: "${meter_e_id}", read_date: "2025-06-30", read_type: "ACTUAL", reading_value: 104000 }
              as: MeterTechnician
            - call: "POST /bills"
              payload: { account_id: "${acct_e_id}", period_id: "${p1_id}", meter_id: "${meter_e_id}", read_type: "ACTUAL" }
              as: BillingSupervisor
              captures: { bill_p1_id: $.data.id }
            - call: "POST /bills/${bill_p1_id}/issue"
              as: BillingSupervisor
            - call: "POST /service-accounts/${acct_e_id}/schedule-shutoff"
              as: BillingSupervisor
          trigger:
            - call: "POST /service-accounts/${acct_e_id}/payments"
              payload: { amount_cents: 209, memo: "leaves one cent above the threshold" }
              as: CustomerServiceRep
            - call: "POST /service-accounts/${acct_e_id}/payments"
              payload: { amount_cents: 1, memo: "lands exactly on the threshold" }
              as: CustomerServiceRep
            - call: "POST /service-accounts/${acct_e_id}/payments"
              payload: { amount_cents: 1, memo: "one cent below the threshold" }
              as: CustomerServiceRep
          assert:
            - "Pre-trigger: ServiceAccount.${acct_e_id}.balance_cents == 5210, credit_status == PAST_DUE, service_status == SHUTOFF_SCHEDULED, shutoff_scheduled_for == 2026-08-11"
            - "JUST ABOVE: after the 209 payment balance_cents == 5001, credit_status == PAST_DUE and service_status == SHUTOFF_SCHEDULED"
            - "AT THRESHOLD: after the first 1-cent payment balance_cents == 5000, credit_status == CURRENT and service_status == ACTIVE with shutoff_scheduled_for == null"
            - "JUST BELOW: after the second 1-cent payment balance_cents == 4999, credit_status == CURRENT and service_status == ACTIVE"
            - "GET /service-accounts/${acct_e_id}/ledger-entries returns exactly 4 rows whose amount_cents sum to 4999"
            - "Every payment row has entry_type PAYMENT, source_kind CUSTOMER_PAYMENT and a negative amount_cents"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      # -------- pair: HighBillInvestigation <- MeterTestRequest --------
      - name: cross_entity_investigation_meter_error_determination_gated_by_test_closure
        grounds:
          - state_machines.HighBillInvestigation
          - state_machines.MeterTestRequest
          - calculations.bench_test_accuracy
          - validations[ERR_INVALID_STATE_TRANSITION]
          - endpoints[POST /investigations/{id}/determine]
        distinguishing_aspect: |
          ENTITY PAIR: HighBillInvestigation depends on MeterTestRequest. A METER_ERROR
          determination is legal only once a MeterTestRequest on the bill's meter has reached a
          FAST or SLOW terminal state; while the request sits in BENCH_TEST_PENDING the
          investigation cannot leave EVIDENCE_REQUESTED, so determine is refused 409. Recording a
          SLOW bench result on the OTHER entity — with no call against the investigation at all —
          moves the investigation to EVIDENCE_UNDER_REVIEW and the identical determine call then
          succeeds. The METER_ERROR determination also exempts the adjustment from the
          repair-proof and leak-type rules, which is asserted by drafting a SERVICE_LINE
          adjustment with no RepairProof anywhere in the fixture.
        test_recipe:
          setup:
            - "The full ACC-1001 fixture is in place with four ISSUED bills; the 2026-07 bill is 41000 gallons, 44939 cents, baseline 4000."
