# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist (left-to-right)" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body FK reference does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic illegal transition for the resource's current state" }
  - { id: ERR_STALE_FUND_VERSION, http: 412, condition: "expected_fund_version does not match Fund.version" }
  - { id: ERR_STALE_POOL_VERSION, http: 412, condition: "expected_pool_version does not match InvestmentPool.version on BUY_IN/REDEMPTION" }
  - { id: ERR_AGREEMENT_NOT_EXECUTED, http: 409, condition: "Fund activation attempted without an EXECUTED agreement" }
  - { id: ERR_AGREEMENT_ALREADY_EXECUTED, http: 409, condition: "Second DRAFT agreement executed while another EXECUTED agreement exists (amendment path not used)" }
  - { id: ERR_MIN_INITIAL_CONTRIBUTION, http: 422, condition: "No ACCEPTED contribution with net_proceeds >= agreement.min_initial_contribution at activation" }
  - { id: ERR_FUND_NOT_ACCEPTING, http: 409, condition: "Contribution accept attempted while fund not in {PENDING_AGREEMENT, ACTIVE}" }
  - { id: ERR_FUND_NOT_ACTIVE_FOR_GRANTS, http: 409, condition: "Grant submit or award disburse attempted while fund not ACTIVE" }
  - { id: ERR_FUND_NOT_EMPTY, http: 409, condition: "Close attempted with cash_balance != 0 or invested_units != 0" }
  - { id: ERR_PENDING_GRANTS, http: 409, condition: "Close attempted with a grant in a non-terminal state" }
  - { id: ERR_PROGRAM_OPEN, http: 409, condition: "Fund close attempted while a scholarship program is non-terminal" }
  - { id: ERR_FUND_NOT_CLOSED, http: 409, condition: "Agreement terminate attempted before fund CLOSED" }
  - { id: ERR_SUCCESSOR_NOT_ON_FUND, http: 422, condition: "successor_advisor_id references an advisor of a different fund" }
  - { id: ERR_NOT_THE_INVITED_ADVISOR, http: 403, condition: "Advisor accept/resign attempted by a different X-User-ID" }
  - { id: ERR_ADVISOR_NOT_AUTHORIZED, http: 403, condition: "DONOR_ADVISED grant submitted by an advisor who is not ACTIVE on the fund, or recommended_by_advisor_id missing/mismatched" }
  - { id: ERR_GRANT_BELOW_MINIMUM, http: 422, condition: "Grant amount < 250.00" }
  - { id: ERR_GRANTEE_NOT_CLEARED, http: 422, condition: "Approve attempted while grantee not CLEARED (UNVETTED/IN_REVIEW/REJECTED_DD/EXPIRED)" }
  - { id: ERR_ER_ACK_REQUIRED, http: 422, condition: "Grantee requires expenditure responsibility but acknowledgement not supplied" }
  - { id: ERR_EXCEEDS_SPENDABLE, http: 422, condition: "Grant amount > fund.spendable_balance at approve" }
  - { id: ERR_INSUFFICIENT_CASH, http: 422, condition: "Disbursement, buy-in, fee debit, or winner slate exceeds fund.cash_balance (or units_held for redemption)" }
  - { id: ERR_SOD_SELF_APPROVAL, http: 403, condition: "Approver is the same user who claimed the review" }
  - { id: ERR_SOD_SELF_DISBURSE, http: 403, condition: "Disburser is the same user who approved" }
  - { id: ERR_REVISION_LIMIT_REACHED, http: 422, condition: "Resubmission attempted after revision_count already 3 (grant DENIED)" }
  - { id: ERR_OUTSIDE_WINDOW, http: 422, condition: "Application outside [application_open, application_close) or close-applications before window end or gift_date in future" }
  - { id: ERR_COMMITTEE_TOO_SMALL, http: 422, condition: "Program open attempted with committee_size < 3" }
  - { id: ERR_NO_APPLICATIONS, http: 422, condition: "close-applications with zero applications" }
  - { id: ERR_QUORUM_NOT_MET, http: 422, condition: "select-winners with no application reaching quorum" }
  - { id: ERR_TOO_MANY_WINNERS, http: 422, condition: "winner_application_ids length > max_awards" }
  - { id: ERR_UNSCORED_WINNER, http: 422, condition: "A winner application has final_score null (quorum not met for it)" }
  - { id: ERR_AWARDS_PENDING, http: 409, condition: "Program close attempted with awards in OFFERED/ACCEPTED" }
  - { id: ERR_PROGRAM_LOCKED, http: 409, condition: "Committee mutation attempted after program left SETUP/OPEN" }
  - { id: ERR_NOT_THE_APPLICANT, http: 403, condition: "Award accept/decline by a different X-User-ID than the applicant" }
  - { id: ERR_NOT_THE_MEMBER, http: 403, condition: "Recuse attempted by a different X-User-ID than the member" }
  - { id: ERR_POOL_NOT_OPEN, http: 409, condition: "BUY_IN/REDEMPTION attempted while pool SUSPENDED or TERMINATED" }
  - { id: ERR_POOL_NOT_EMPTY, http: 409, condition: "Pool terminate with units_outstanding != 0" }
  - { id: ERR_INSUFFICIENT_HISTORY, http: 422, condition: "Spending run lacks 12 quarter-end or 3 fiscal-year-end snapshots" }
  - { id: ERR_LOT_PROCEEDS_MISSING, http: 422, condition: "Liquidate payload missing gross_proceeds for at least one lot" }
  - { id: ERR_DUPLICATE_SCORE, http: 409, condition: "Second ScoreEntry for same (application_id, member_id)" }
  - { id: ERR_UNIQUENESS_VIOLATION, http: 409, condition: "fund_name / tax_id / advisor email / applicant email per program / statement (fund,fiscal_year) uniqueness" }
  - { id: ERR_FIELD_CONSTRAINT, http: 422, condition: "Scalar domain violation (score range, rate range, positive amounts, tax_id shape, enum membership)" }
  - { id: ERR_CROSS_REFERENCE_MISMATCH, http: 422, condition: "Referenced entity belongs to a different parent (advisor/fund, application/program, member/program)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FoundationAdmin
    description: "Foundation staff executive; fund establishment, agreements, advisor invitations, fund activation/closure, statements"
    identity: opaque
    exclusive_operations: [create fund, activate fund, close fund, create/execute/terminate agreement, invite/revoke advisor, record advisor deceased, generate/deliver annual statement, set logical clock]
    shared_operations: [create grant (staff-initiated), submit grant (staff-initiated on DESIGNATED/SCHOLARSHIP funds), list/get most resources]

  - name: GiftOfficer
    description: "Gift acceptance staff; contributions, complex asset lots, liquidation"
    identity: opaque
    exclusive_operations: [create contribution, add asset lot, accept contribution, decline contribution, liquidate contribution]
    shared_operations: [list/get funds and contributions]

  - name: ComplianceOfficer
    description: "Grants compliance; grantee due diligence, grant review/approve/return/deny/cancel. SoD: approver != claimer"
    identity: opaque
    exclusive_operations: [register grantee, begin/clear/reject due diligence, claim grant review, approve grant, return grant, deny grant, cancel grant]
    shared_operations: [list/get funds, grants, grantees, advisors, agreements]

  - name: FinanceOfficer
    description: "Finance staff; disbursements, spending policy runs, fee assessments, snapshots, unitization bookkeeping"
    identity: opaque
    exclusive_operations: [disburse grant, disburse award, record snapshot, run spending policy, assess fee]
    shared_operations: [record unitization event, list/get funds, pools, statements, disbursements]

  - name: ProgramOfficer
    description: "Scholarship program staff; program lifecycle, committee management, winner selection, forfeiture"
    identity: opaque
    exclusive_operations: [create program, open program, close applications, select winners, close program, cancel program, seat committee member, remove committee member, forfeit award]
    shared_operations: [list/get programs, applications, scores, awards]

  - name: InvestmentManager
    description: "Investment staff; pool lifecycle and rebalancing events"
    identity: opaque
    exclusive_operations: [create pool, suspend pool, reopen pool, terminate pool]
    shared_operations: [record unitization event, list/get pools and holdings]

  - name: Advisor
    description: "Fund advisor (donor-advised); recommends grants, views fund statements"
    identity: "entity_backed:FundAdvisor"
    exclusive_operations: [submit grant, accept advisor invitation, resign]
    shared_operations: [create grant, list/get own fund, grants, grantees, statements]

  - name: Applicant
    description: "Scholarship applicant; applies and responds to award offers"
    identity: "entity_backed:ScholarshipApplication"
    exclusive_operations: [submit application, accept award, decline award]
    shared_operations: [get own application/award, list programs]

  - name: CommitteeMember
    description: "Scholarship committee member; scores applications, may recuse self"
    identity: "entity_backed:CommitteeMember"
    exclusive_operations: [score application, recuse self]
    shared_operations: [list/get program, applications]
