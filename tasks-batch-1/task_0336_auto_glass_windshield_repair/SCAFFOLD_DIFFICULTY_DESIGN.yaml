  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: schedule_blocked_until_part_order_reserved_workorder_to_partorder
        grounds:
          - state_machines.WorkOrder.ASSESSED_to_SCHEDULED
          - state_machines.PartOrder.BACKORDERED_to_RESERVED
          - validations[priority=14]
        distinguishing_aspect: |
          WorkOrder->PartOrder pair: a REPLACE WorkOrder's ASSESSED->SCHEDULED
          transition is gated on a sibling PartOrder being RESERVED. While
          the PartOrder is BACKORDERED the schedule is refused ERR_PART_NOT_READY;
          after BACKORDERED->RESERVED via receive it succeeds.
        test_recipe:
          setup:
            - "A REPLACE non-ADAS work order in ASSESSED whose only PartOrder is BACKORDERED (GlassPart on_hand_qty=0), plus a booked in-shop appointment."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Gail Gate", email: "gail@x.com", phone: "555-0112", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "EHGCM82633A004366", make: "Honda", model: "Odyssey", model_year: 2014, adas_equipped: false, glass_part_number: "FW04137" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /glass-parts"
              payload: { oem_part_number: "FW04137", description: "Odyssey windshield", adas_compatible: false, unit_price_cents: 22000, on_hand_qty: 0 }
              as: ShopManager
              captures: { part_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Ned Need", can_mobile: false, adas_certified: false, home_state: "CA" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /service-bays"
              payload: { name: "Install Bay 8", bay_type: "INSTALL", cleanroom: false }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/damage-assessments"
              payload: { chip_count: 0, longest_crack_mm: 300, in_driver_primary_view: true, edge_distance_mm: 5 }
              as: ServiceAdvisor
              captures: { asmt_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/accept-assessment"
              payload: { assessment_id: "${asmt_id}" }
              as: ServiceAdvisor
              captures: { wo_v2: $.data.version }
            - call: "POST /part-orders"
              payload: { work_order_id: "${wo_id}", glass_part_id: "${part_id}", quantity: 1, expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
              captures: { po_id: $.data.id }
            - call: "POST /service-appointments"
              payload: { work_order_id: "${wo_id}", technician_id: "${tech_id}", service_bay_id: "${bay_id}", service_location: "IN_SHOP", start_at: "2026-06-15T08:00:00Z", end_at: "2026-06-15T09:00:00Z" }
              as: ServiceAdvisor
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { appointment_id: "${appt_id}" }
              as: ServiceAdvisor
              captures: { err_before: $.data.error_id }
            - call: "POST /part-orders/${po_id}/receive"
              payload: {}
              as: ShopManager
              captures: { po_status: $.data.status }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { appointment_id: "${appt_id}" }
              as: ServiceAdvisor
              captures: { wo_status: $.data.status }
          assert:
            - "first schedule fails 409 ERR_PART_NOT_READY (PartOrder BACKORDERED)"
            - "PartOrder.${po_id}.status == RESERVED after receive"
            - "second schedule succeeds; WorkOrder.${wo_id}.status == SCHEDULED"

      - name: recalibration_pass_gated_on_work_order_awaiting_recalibrationjob_to_workorder
        grounds:
          - state_machines.RecalibrationJob.SCHEDULED_to_PASSED
          - state_machines.WorkOrder.IN_SERVICE_to_AWAITING_RECALIBRATION
          - validations[priority=5]
        distinguishing_aspect: |
          RecalibrationJob->WorkOrder pair (different from WorkOrder->PartOrder): a
          RecalibrationJob's SCHEDULED->PASSED precondition requires the linked
          WorkOrder.status == AWAITING_RECALIBRATION. Passing while the work order is
          still IN_SERVICE is impossible to reach, and the pass precondition is the
          cross-entity guard; here we show pass succeeds only once the work order is
          AWAITING_RECALIBRATION.
        test_recipe:
          setup:
            - "A REPLACE+ADAS work order driven to AWAITING_RECALIBRATION with a SCHEDULED RecalibrationJob; clock 2026-06-13T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { full_name: "Gus Guard", email: "gus@x.com", phone: "555-0113", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "FHGCM82633A004367", make: "BMW", model: "X3", model_year: 2022, adas_equipped: true, glass_part_number: "FW04138" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /glass-parts"
              payload: { oem_part_number: "FW04138", description: "X3 ADAS windshield", adas_compatible: true, unit_price_cents: 41000, on_hand_qty: 3 }
              as: ShopManager
              captures: { part_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Cleo Cert", can_mobile: false, adas_certified: true, home_state: "CA" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /service-bays"
              payload: { name: "Install Bay 9", bay_type: "INSTALL", cleanroom: false }
              as: ShopManager
              captures: { ibay_id: $.data.id }
            - call: "POST /service-bays"
              payload: { name: "Calib Bay 3", bay_type: "CALIBRATION", cleanroom: false }
              as: ShopManager
              captures: { cbay_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/damage-assessments"
              payload: { chip_count: 0, longest_crack_mm: 300, in_driver_primary_view: true, edge_distance_mm: 5 }
              as: ServiceAdvisor
              captures: { asmt_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/accept-assessment"
              payload: { assessment_id: "${asmt_id}" }
              as: ServiceAdvisor
              captures: { wo_v2: $.data.version }
            - call: "POST /part-orders"
              payload: { work_order_id: "${wo_id}", glass_part_id: "${part_id}", quantity: 1, expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments"
              payload: { work_order_id: "${wo_id}", technician_id: "${tech_id}", service_bay_id: "${ibay_id}", service_location: "IN_SHOP", start_at: "2026-06-13T08:00:00Z", end_at: "2026-06-13T08:59:00Z" }
              as: ServiceAdvisor
              captures: { appt_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { appointment_id: "${appt_id}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments/${appt_id}/check-in"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/finish-install"
              payload: { temp_c: 25, humidity_pct: 40 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_v_fin: $.data.version, wo_status_fin: $.data.status }
            - call: "POST /recalibration-jobs"
              payload: { work_order_id: "${wo_id}", technician_id: "${tech_id}", service_bay_id: "${cbay_id}", calibration_type: "STATIC", start_at: "2026-06-13T09:10:00Z", end_at: "2026-06-13T09:40:00Z", expected_work_order_version: "${wo_v_fin}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /recalibration-jobs/${rc_id}/pass"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { rc_status: $.data.status }
          assert:
            - "WorkOrder.${wo_id}.status == AWAITING_RECALIBRATION immediately after finish-install (cross-entity guard satisfied)"
            - "RecalibrationJob.${rc_id}.status == PASSED and WorkOrder.${wo_id}.status == CURING after pass"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_overlap_no_buffer_half_open
        grounds:
          - validations[priority=11]
          - endpoints./service-appointments
          - errors[ERR_TECHNICIAN_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Technician resource, half-open [start,end) interval semantics with NO
          buffer: two appointments for the same technician collide only on positive
          overlap; touching boundaries (10:00 end == 10:00 start) do not collide.
