        excluded_because:
          difficulty_instance: cross_entity_state_dependency / assignment_activation_blocked_by_case_benefit_status_pending_issuance
          rationale: "That instance asserts benefit_status PENDING_ISSUANCE before the issuance and ACTIVE immediately after it."

  - section: calculations
    instances:
      - name: self_report_verification_source_halves_credited_hours_with_a_floor
        claim_type: precision
        grounds:
          - calculations.participation_credit
          - constants.SELF_REPORT_CREDIT_FACTOR
          - endpoints[POST /participation-reports/{id}/verify]
        distinguishing_aspect: |
          41 self-reported hours credit as floor(41 * 0.50) == 20, not 20.5 and not
          21: the factor is applied before the floor and the floor truncates rather
          than rounding half up.
        test_recipe:
          setup:
            - "A SINGLE_PARENT case of household size 3 with no income is ACTIVE with 2026-08 issued and has an ACTIVE COMMUNITY_SERVICE assignment of 20 scheduled weekly hours for 2026-08-01..2026-12-01."
            - "That assignment has one SUBMITTED 2026-08 report of 41 hours with verification_source SELF_REPORT."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Self Report Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
