# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe) - task 2403
# Walks references/claim-extraction-guide.md row by row against §1.1-§1.7.
# YAML anchors carry the canonical fixture chain (same fixture as
# SCAFFOLD_DIFFICULTY_DESIGN.yaml, re-declared here because that is a separate
# document): clock 2026-08-01 -> clubs -> clinicians -> player + baseline ->
# week-1 game IN_PROGRESS -> observer-initiated evaluation -> screen ->
# locker-room exam at 18:10 -> diagnosis at 18:19 (severity_index 82).
# Corners already asserted by a §1.8 instance are emitted as excluded_because
# stubs naming that instance.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: club_creation_initialises_compliance_and_slot_fields
        claim_type: creation
        grounds:
          - entities.Club
          - endpoints.POST_clubs
          - response_envelope.success
        distinguishing_aspect: "A club created with only name, market_code and exemption_slots_total comes back with every computed compliance field seeded (score 100, TIER_0, ACTIVE, 0 fines, 0 used slots, 3 available) and version 1."
        test_recipe:
          setup: ["Empty database, logical clock at the default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - &k_clock_aug1
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueAdmin
          trigger:
            - &k_club_h
              call: "POST /concussion-program/clubs"
              payload: { name: "Harbor City Kraken", market_code: "HCK", exemption_slots_total: 3 }
              as: LeagueAdmin
              captures: { club_h_id: $.data.id }
          assert:
            - "response status 201 and response_type == object"
            - "meta.api_request_id and meta.api_request_timestamp are present"
            - "Club.${club_h_id}.name == Harbor City Kraken and market_code == HCK"
            - "Club.${club_h_id}.compliance_score == 100 and adjudicated_compliance_score == 100"
            - "Club.${club_h_id}.escalation_tier == TIER_0 and status == ACTIVE"
            - "Club.${club_h_id}.outstanding_fine_cents == 0 and open_violation_count == 0"
            - "Club.${club_h_id}.exemption_slots_total == 3, exemption_slots_used == 0, exemption_slots_available == 3"
            - "Club.${club_h_id}.version == 1 and created_at == 2026-08-01T00:00:00.000Z"

      - name: club_duplicate_market_code_rejected
        claim_type: type_constraints
        grounds:
          - entities.Club.fields.market_code
          - errors.ERR_UNIQUENESS_VIOLATION
        distinguishing_aspect: "market_code is unique league-wide: a second club reusing HCK is refused with ERR_UNIQUENESS_VIOLATION (409) and no second Club row appears."
        test_recipe:
          setup: ["Harbor City Kraken already registered with market_code HCK"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
          trigger:
            - call: "POST /concussion-program/clubs"
              payload: { name: "Harbor City Krakens B", market_code: "HCK", exemption_slots_total: 2 }
              as: LeagueAdmin
          assert:
            - "response status 409 with error_id ERR_UNIQUENESS_VIOLATION"
            - "GET /concussion-program/clubs/${club_h_id} still returns name Harbor City Kraken"

      - name: club_default_exemption_slots_total_applied
        claim_type: defaults
        grounds:
          - entities.Club.fields.exemption_slots_total
          - endpoints.POST_clubs
        distinguishing_aspect: "Omitting the optional exemption_slots_total yields the declared default 3, and exemption_slots_available is seeded to that same 3."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - *k_clock_aug1
          trigger:
            - call: "POST /concussion-program/clubs"
              payload: { name: "Ridgeway Sentinels", market_code: "RWS" }
              as: LeagueAdmin
              captures: { club_d_id: $.data.id }
          assert:
            - "response status 201"
            - "Club.${club_d_id}.exemption_slots_total == 3"
            - "Club.${club_d_id}.exemption_slots_used == 0 and exemption_slots_available == 3"

      - name: player_creation_exposes_computed_readiness_fields
        claim_type: computed_fields
        grounds:
          - entities.Player.fields.baseline_status
          - entities.Player.fields.availability_status
          - entities.Player.fields.public_injury_designation
          - entities.Player.fields.diagnosed_case_count
        distinguishing_aspect: "A brand-new player with no BaselineTest is baseline_status NONE, availability AVAILABLE, public_injury_designation NONE and diagnosed_case_count 0, all computed rather than accepted from input."
        test_recipe:
          setup: ["Harbor City registered"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
          trigger:
            - &k_player
              call: "POST /concussion-program/players"
              payload: { club_id: "${club_h_id}", full_name: "K Mbeki", jersey_number: 24, position: "WR" }
              as: LeagueAdmin
              captures: { player_id: $.data.id, player_v1: $.data.version }
          assert:
            - "response status 201"
            - "Player.${player_id}.baseline_status == NONE"
            - "Player.${player_id}.availability_status == AVAILABLE"
            - "Player.${player_id}.public_injury_designation == NONE"
            - "Player.${player_id}.diagnosed_case_count == 0"
            - "Player.${player_id}.version == 1"

      - name: jersey_number_and_license_number_uniqueness_enforced
        claim_type: type_constraints
        grounds:
          - entities.Player.fields.jersey_number
          - entities.Clinician.fields.license_number
          - errors.ERR_UNIQUENESS_VIOLATION
        distinguishing_aspect: "jersey_number is unique only inside one club while license_number is unique league-wide: reusing 24 inside Harbor City is refused, reusing it at Ridgeway succeeds, and reusing LIC-1001 anywhere is refused."
        test_recipe:
          setup: ["Two clubs, one Harbor City player wearing 24, and one clinician holding licence LIC-1001"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - &k_club_r
              call: "POST /concussion-program/clubs"
              payload: { name: "Ridgeway Sentinels", market_code: "RWS", exemption_slots_total: 3 }
              as: LeagueAdmin
              captures: { club_r_id: $.data.id }
            - &k_doc_h
              call: "POST /concussion-program/clinicians"
              payload: { full_name: "Dr Vance", affiliation: "CLUB_AFFILIATED", license_number: "LIC-1001", credential_expires_at: "2027-12-31T00:00:00Z", club_id: "${club_h_id}" }
              as: LeagueAdmin
              captures: { doc_h_id: $.data.id }
            - *k_player
          trigger:
            - call: "POST /concussion-program/players"
              payload: { club_id: "${club_h_id}", full_name: "R Silva", jersey_number: 24, position: "DB" }
              as: LeagueAdmin
            - call: "POST /concussion-program/players"
              payload: { club_id: "${club_r_id}", full_name: "R Silva", jersey_number: 24, position: "DB" }
              as: LeagueAdmin
              captures: { player_r_id: $.data.id }
            - call: "POST /concussion-program/clinicians"
              payload: { full_name: "Dr Kaur", affiliation: "CLUB_AFFILIATED", license_number: "LIC-1001", credential_expires_at: "2027-12-31T00:00:00Z", club_id: "${club_r_id}" }
              as: LeagueAdmin
          assert:
            - "trigger 1 (same club, jersey 24): response status 409 with error_id ERR_UNIQUENESS_VIOLATION"
            - "trigger 2 (other club, jersey 24): response status 201 and Player.${player_r_id}.jersey_number == 24"
            - "trigger 3 (duplicate licence): response status 409 with error_id ERR_UNIQUENESS_VIOLATION"

      - name: enum_and_range_constraints_rejected_as_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Player.fields.position
          - entities.Player.fields.jersey_number
          - entities.Club.fields.exemption_slots_total
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "An out-of-enum position (GOALIE), an out-of-range jersey_number (100) and an out-of-range exemption_slots_total (6) are each rejected with ERR_INVALID_REQUEST (400) before any row is written."
        test_recipe:
          setup: ["Harbor City registered"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
          trigger:
            - call: "POST /concussion-program/players"
              payload: { club_id: "${club_h_id}", full_name: "Bad Position", jersey_number: 12, position: "GOALIE" }
              as: LeagueAdmin
            - call: "POST /concussion-program/players"
              payload: { club_id: "${club_h_id}", full_name: "Bad Number", jersey_number: 100, position: "WR" }
              as: LeagueAdmin
            - call: "POST /concussion-program/clubs"
              payload: { name: "Overslotted FC", market_code: "OVS", exemption_slots_total: 6 }
              as: LeagueAdmin
          assert:
            - "each of the three triggers returns status 400 with error_id ERR_INVALID_REQUEST"
            - "GET /concussion-program/players returns meta.total_count == 0"
            - "GET /concussion-program/clubs/${club_h_id} succeeds, proving no partial write occurred"

      - name: baseline_test_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_baseline-tests
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "composite_score is a required input with no default, so a baseline test submitted without it returns ERR_INVALID_REQUEST (400) and the player's baseline_status stays NONE."
        test_recipe:
          setup: ["Harbor City with Dr Vance and K Mbeki, no baseline on file"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - *k_doc_h
            - *k_player
          trigger:
            - call: "POST /concussion-program/baseline-tests"
              payload: { player_id: "${player_id}", season_year: 2026, reaction_time_ms: 520, symptom_score: 0, expected_player_version: "${player_v1}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
          assert:
            - "response status 400 with error_id ERR_INVALID_REQUEST"
            - "Player.${player_id}.baseline_status == NONE and version == 1"
            - "GET /concussion-program/baseline-tests?player_id=${player_id} returns meta.total_count == 0"

      - name: game_system_fields_are_server_assigned
        claim_type: system_fields
        grounds:
          - entities.Game
          - endpoints.POST_games
        distinguishing_aspect: "id, created_at, updated_at, version and status are stamped by the server: a game created at 2026-08-01T00:00:00Z is SCHEDULED with created_at equal to the logical clock, regardless of what the caller supplies."
        test_recipe:
          setup: ["Two clubs registered, logical clock 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - *k_club_r
          trigger:
            - &k_game
              call: "POST /concussion-program/games"
              payload: { season_year: 2026, week_index: 1, home_club_id: "${club_h_id}", away_club_id: "${club_r_id}", kickoff_at: "2026-09-13T17:00:00Z" }
              as: LeagueAdmin
              captures: { game_id: $.data.id }
          assert:
            - "response status 201"
            - "Game.${game_id}.status == SCHEDULED"
            - "Game.${game_id}.created_at == 2026-08-01T00:00:00.000Z and updated_at == 2026-08-01T00:00:00.000Z"
            - "Game.${game_id}.version == 1 and id is a server-minted uuid"
            - "Game.${game_id}.kickoff_at == 2026-09-13T17:00:00.000Z"

      - name: unknown_ids_return_entity_specific_not_found_errors
        claim_type: not_found
        grounds:
          - errors.ERR_CLUB_NOT_FOUND
          - errors.ERR_PLAYER_NOT_FOUND
          - errors.ERR_CLINICIAN_NOT_FOUND
          - errors.ERR_GAME_NOT_FOUND
          - errors.ERR_EVALUATION_NOT_FOUND
          - errors.ERR_CASE_NOT_FOUND
          - errors.ERR_RESOURCE_NOT_FOUND
        distinguishing_aspect: "The catalog distinguishes six first-class entities from the generic bucket: reads of an unknown id return ERR_CLUB_NOT_FOUND, ERR_PLAYER_NOT_FOUND, ERR_CLINICIAN_NOT_FOUND, ERR_GAME_NOT_FOUND, ERR_EVALUATION_NOT_FOUND, ERR_CASE_NOT_FOUND respectively, while an unknown ReturnStep returns ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database (no rows of any kind)"]
          setup_api_calls:
            - *k_clock_aug1
          trigger:
            - call: "GET /concussion-program/clubs/00000000-0000-0000-0000-000000000000"
              as: LeagueAdmin
            - call: "GET /concussion-program/players/00000000-0000-0000-0000-000000000000"
              as: LeagueAdmin
            - call: "GET /concussion-program/clinicians/00000000-0000-0000-0000-000000000000"
              as: LeagueAdmin
            - call: "GET /concussion-program/games/00000000-0000-0000-0000-000000000000"
              as: LeagueAdmin
            - call: "GET /concussion-program/sideline-evaluations/00000000-0000-0000-0000-000000000000"
              as: LeagueAdmin
            - call: "GET /concussion-program/concussion-cases/00000000-0000-0000-0000-000000000000"
              as: LeagueAdmin
            - call: "GET /concussion-program/return-steps/00000000-0000-0000-0000-000000000000"
              as: LeagueAdmin
          assert:
            - "trigger 1: 404 ERR_CLUB_NOT_FOUND"
            - "trigger 2: 404 ERR_PLAYER_NOT_FOUND"
            - "trigger 3: 404 ERR_CLINICIAN_NOT_FOUND"
            - "trigger 4: 404 ERR_GAME_NOT_FOUND"
            - "trigger 5: 404 ERR_EVALUATION_NOT_FOUND"
            - "trigger 6: 404 ERR_CASE_NOT_FOUND"
            - "trigger 7: 404 ERR_RESOURCE_NOT_FOUND"
            - "every error response has response_type == error and a message string"

      - name: clinician_listing_filters_and_paginates
        claim_type: listing
        grounds:
          - endpoints.GET_clinicians
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /clinicians honours affiliation filtering together with limit/offset: three clinicians exist, filtering to CLUB_AFFILIATED with limit 1 returns one row with meta.total_count 2 and has_more true."
        test_recipe:
          setup: ["Two club-affiliated clinicians at Harbor City and one independent consultant"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - *k_doc_h
            - &k_doc_h2
              call: "POST /concussion-program/clinicians"
              payload: { full_name: "Dr Nakamura", affiliation: "CLUB_AFFILIATED", license_number: "LIC-1002", credential_expires_at: "2027-12-31T00:00:00Z", club_id: "${club_h_id}" }
              as: LeagueAdmin
              captures: { doc_h2_id: $.data.id }
            - &k_inc
              call: "POST /concussion-program/clinicians"
              payload: { full_name: "Dr Iyer", affiliation: "INDEPENDENT_CONSULTANT", license_number: "LIC-3001", credential_expires_at: "2027-12-31T00:00:00Z" }
              as: LeagueAdmin
              captures: { inc_id: $.data.id }
          trigger:
            - call: "GET /concussion-program/clinicians?affiliation=CLUB_AFFILIATED&limit=1&offset=0"
              as: LeagueAdmin
            - call: "GET /concussion-program/clinicians?affiliation=CLUB_AFFILIATED&limit=1&offset=1"
              as: LeagueAdmin
            - call: "GET /concussion-program/clinicians?club_id=${club_h_id}"
              as: LeagueAdmin
          assert:
            - "trigger 1: response_type == array, one element, meta.total_count == 2, meta.has_more == true, meta.limit == 1, meta.offset == 0"
            - "trigger 2: one element, meta.has_more == false"
            - "triggers 1 and 2 return disjoint ids drawn from {${doc_h_id}, ${doc_h2_id}}"
            - "trigger 3: meta.total_count == 2 and ${inc_id} is absent (club_id is null on the consultant)"

      - name: evaluation_with_unknown_player_reference_rejected
        claim_type: foreign_key_validation
        grounds:
          - entities.SidelineEvaluation.fields.player_id
          - errors.ERR_PLAYER_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "In this flat topology the body FK is validated before any state logic: a sideline evaluation naming an unknown player_id returns ERR_PLAYER_NOT_FOUND (404) even though the game is live and the caller is authorised."
        test_recipe:
          setup: ["Harbor City and Ridgeway, Dr Vance, a live week-1 game"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - *k_club_r
            - *k_doc_h
            - *k_game
            - &k_clock_kick
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T17:00:00Z" }
              as: LeagueAdmin
            - &k_game_live
              call: "POST /concussion-program/games/${game_id}/advance-status"
              payload: { to_status: "IN_PROGRESS" }
              as: LeagueAdmin
          trigger:
            - call: "POST /concussion-program/sideline-evaluations"
              payload: { player_id: "00000000-0000-0000-0000-000000000000", game_id: "${game_id}", trigger_source: "CLUB_MEDICAL_STAFF" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
          assert:
            - "response status 404 with error_id ERR_PLAYER_NOT_FOUND"
            - "GET /concussion-program/sideline-evaluations returns meta.total_count == 0"

      - name: audit_with_unknown_case_reference_rejected
        claim_type: cross_reference_integrity
        grounds:
          - entities.ProtocolAudit.fields.case_id
          - errors.ERR_CASE_NOT_FOUND
        distinguishing_aspect: "The optional case_id on a protocol audit is still reference-checked: an audit opened against a real club but an unknown case_id returns ERR_CASE_NOT_FOUND and creates no audit."
        test_recipe:
          setup: ["Harbor City registered, no cases"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
          trigger:
            - call: "POST /concussion-program/protocol-audits"
              payload: { club_id: "${club_h_id}", case_id: "00000000-0000-0000-0000-000000000000" }
              as: LeagueAuditor
              as_user_id: "auditor-a"
          assert:
            - "response status 404 with error_id ERR_CASE_NOT_FOUND"
            - "GET /concussion-program/protocol-audits?club_id=${club_h_id} returns meta.total_count == 0"
            - "Club.${club_h_id}.open_violation_count == 0"

      - name: player_retrieval_returns_stored_and_linked_data
        claim_type: retrieval
        grounds:
          - endpoints.GET_players_id
          - endpoints.GET_clubs_id_players
        distinguishing_aspect: "GET /players/{id} echoes the stored roster data and its club FK, and the same row appears in the club's sub-listing filtered by availability_status AVAILABLE."
        test_recipe:
          setup: ["Harbor City with K Mbeki #24 and no baseline"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - *k_player
          trigger:
            - call: "GET /concussion-program/players/${player_id}"
              as: LeagueAdmin
            - call: "GET /concussion-program/clubs/${club_h_id}/players?availability_status=AVAILABLE"
              as: ClubComplianceOfficer
              as_user_id: "${club_h_id}"
          assert:
            - "trigger 1: 200, full_name == K Mbeki, jersey_number == 24, position == WR, club_id == ${club_h_id}"
            - "trigger 2: meta.total_count == 1 and the single element id == ${player_id}"

  - section: state_machines
    instances:
      - name: game_advances_scheduled_to_in_progress_to_final
        claim_type: valid_transition
        grounds:
          - state_machines.Game.SCHEDULED_to_IN_PROGRESS
          - state_machines.Game.IN_PROGRESS_to_FINAL
          - state_machines.Game.initial_state
        distinguishing_aspect: "A game starts SCHEDULED, moves to IN_PROGRESS on the first advance and to FINAL on the second, with updated_at tracking the logical clock at each step."
        test_recipe:
          setup: ["A week-1 game created at 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - *k_club_r
            - *k_game
            - *k_clock_kick
          trigger:
            - call: "POST /concussion-program/games/${game_id}/advance-status"
              payload: { to_status: "IN_PROGRESS" }
              as: LeagueAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T20:00:00Z" }
              as: LeagueAdmin
            - call: "POST /concussion-program/games/${game_id}/advance-status"
              payload: { to_status: "FINAL" }
              as: LeagueAdmin
          assert:
            - "after trigger 1: Game.${game_id}.status == IN_PROGRESS and updated_at == 2026-09-13T17:00:00.000Z"
            - "after trigger 3: Game.${game_id}.status == FINAL and updated_at == 2026-09-13T20:00:00.000Z"
            - "Game.${game_id}.version == 3"

      - name: game_advance_from_final_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Game.terminal_states
          - errors.ERR_RESOURCE_STATE_INVALID
        distinguishing_aspect: "FINAL is terminal: a further advance to IN_PROGRESS is refused with ERR_RESOURCE_STATE_INVALID (409) and the game stays FINAL."
        test_recipe:
          setup: ["A week-1 game already advanced to FINAL at 2026-09-13T20:00:00Z"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - *k_club_r
            - *k_game
            - *k_clock_kick
            - *k_game_live
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T20:00:00Z" }
              as: LeagueAdmin
            - call: "POST /concussion-program/games/${game_id}/advance-status"
              payload: { to_status: "FINAL" }
              as: LeagueAdmin
          trigger:
            - call: "POST /concussion-program/games/${game_id}/advance-status"
              payload: { to_status: "IN_PROGRESS" }
              as: LeagueAdmin
          assert:
            - "response status 409 with error_id ERR_RESOURCE_STATE_INVALID"
            - "Game.${game_id}.status == FINAL"

      - name: evaluation_initial_state_is_initiated_with_stamped_deadline
        claim_type: initial_state
        grounds:
          - state_machines.SidelineEvaluation.initial_state
          - entities.SidelineEvaluation.fields.protocol_deadline_at
          - entities.SidelineEvaluation.fields.mandatory_removal
        distinguishing_aspect: "An observer-initiated evaluation is created in INITIATED with mandatory_removal true and protocol_deadline_at exactly 15 minutes after initiation (2026-09-13T18:20:00.000Z)."
        test_recipe:
          setup: ["Live week-1 game, K Mbeki with a pre-season baseline, Dr Osei on duty as the unaffiliated observer, clock 2026-09-13T18:05:00Z"]
          setup_api_calls:
            - *k_clock_aug1
            - *k_club_h
            - *k_club_r
            - *k_doc_h
            - &k_obs
              call: "POST /concussion-program/clinicians"
              payload: { full_name: "Dr Osei", affiliation: "UNAFFILIATED_OBSERVER", license_number: "LIC-2001", credential_expires_at: "2027-12-31T00:00:00Z" }
              as: LeagueAdmin
              captures: { obs_id: $.data.id }
            - *k_inc
            - *k_player
            - &k_baseline
              call: "POST /concussion-program/baseline-tests"
              payload: { player_id: "${player_id}", season_year: 2026, composite_score: 88, reaction_time_ms: 520, symptom_score: 0, expected_player_version: "${player_v1}" }
              as: ClubPhysician
              as_user_id: "${doc_h_id}"
              captures: { baseline_id: $.data.id }
            - *k_game
            - *k_clock_kick
            - *k_game_live
            - &k_clock_1805
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T18:05:00Z" }
              as: LeagueAdmin
          trigger:
            - &k_eval
              call: "POST /concussion-program/sideline-evaluations"
              payload: { player_id: "${player_id}", game_id: "${game_id}", trigger_source: "UNAFFILIATED_OBSERVER" }
              as: UnaffiliatedObserver
              as_user_id: "${obs_id}"
              captures: { eval_id: $.data.id }
          assert:
            - "response status 201"
            - "SidelineEvaluation.${eval_id}.status == INITIATED"
            - "SidelineEvaluation.${eval_id}.mandatory_removal == true"
            - "SidelineEvaluation.${eval_id}.initiated_at == 2026-09-13T18:05:00.000Z"
            - "SidelineEvaluation.${eval_id}.protocol_deadline_at == 2026-09-13T18:20:00.000Z"
