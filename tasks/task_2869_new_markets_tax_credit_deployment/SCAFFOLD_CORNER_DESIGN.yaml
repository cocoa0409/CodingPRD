            - call: "POST /nmtc/qalicbs/${la_qalicb_id}/eligibility-tests"
              payload: { gross_income_lic_pct: 72.00, services_lic_pct: 65.00, tangible_property_lic_pct: 88.00, collectibles_pct: 0.00, nonqualified_financial_property_pct: 1.00, location_prong_passed: true }
              as: ComplianceReviewer
              as_user_id: "reviewer-eligibility"
            - call: "POST /nmtc/community-benefits-agreements"
              payload: { qalicb_id: "${ms_qalicb_id}", allocation_award_id: "${award_id}", target_fte_count: 25, wage_floor_cents_per_hour: 1800, local_hire_pct_target: 40.00, measurement_basis: "HEADCOUNT" }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "POST /nmtc/community-benefits-agreements"
              payload: { qalicb_id: "${la_qalicb_id}", allocation_award_id: "${award_id}", target_fte_count: 25, wage_floor_cents_per_hour: 1800, local_hire_pct_target: 40.00, measurement_basis: "HEADCOUNT" }
              as: CDESponsor
