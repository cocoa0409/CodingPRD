# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task_1569 (§1.9 Coverage Index, breadth probe)
# Enumerates the testable claims of SCAFFOLD.yaml §1.1–§1.7 that §1.8 does not
# already cover. Sections/claim_types per references/claim-extraction-guide.md.
# §1.8-covered corners are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section 1 — Entities (Table 1 claims)
  # ===========================================================================
  - section: entities
    instances:
      - name: base_creation_applies_defaults
        claim_type: defaults
        grounds:
          - entities.Base.fields.weather_ceiling_min_ft
          - entities.Base.fields.weather_visibility_min_sm
          - entities.Base.fields.weather_wind_max_kt
          - entities.Base.fields.weather_validity_min
          - entities.Base.fields.complaint_quota_threshold
          - entities.Base.fields.complaint_window_days
          - entities.Base.fields.hold_expire_minutes
          - entities.Base.fields.posture
          - entities.Base.fields.ops_run_index
        distinguishing_aspect: |
          Omitting every optional Base field on creation applies the declared
          defaults (ceiling 1000, visibility 3, wind 25, validity 60, quota 3,
          window 30, hold 30) with posture NORMAL and ops_run_index 0.
        test_recipe:
          setup: ["Empty DB; logical clock at startup default or explicit 2026-08-03"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { b_ceil: $.data.weather_ceiling_min_ft, b_vis: $.data.weather_visibility_min_sm, b_wind: $.data.weather_wind_max_kt, b_val: $.data.weather_validity_min, b_quota: $.data.complaint_quota_threshold, b_win: $.data.complaint_window_days, b_hold: $.data.hold_expire_minutes, b_posture: $.data.posture, b_ops: $.data.ops_run_index, b_ver: $.data.version }
          assert:
            - "trigger capture b_ceil == 1000 and b_vis == 3 and b_wind == 25 and b_val == 60 (weather defaults)"
            - "trigger capture b_quota == 3 and b_win == 30 and b_hold == 30 (quota/hold defaults)"
            - "trigger capture b_posture == NORMAL and b_ops == 0 and b_ver == 1 (initial derived/system state)"

      - name: route_creation_derives_turn_minutes
        claim_type: computed_fields
        grounds:
          - entities.Route.fields.turn_minutes
          - entities.Route.fields.status
          - calculations.turn_window
        distinguishing_aspect: |
          turn_minutes is derived from tier at creation (SHORT 15, STANDARD 25,
          GRAND 40) and status starts ACTIVE; client input cannot set either.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /routes"
              payload: { route_code: "RS", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { t_short: $.data.turn_minutes, st_short: $.data.status }
            - call: "POST /routes"
              payload: { route_code: "RT", tier: "STANDARD", duration_minutes: 50, base_seat_price_cents: 30000, fuel_required_lb: 450, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { t_std: $.data.turn_minutes }
            - call: "POST /routes"
              payload: { route_code: "RG", tier: "GRAND", duration_minutes: 75, base_seat_price_cents: 40000, fuel_required_lb: 600, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { t_grand: $.data.turn_minutes }
          assert:
            - "trigger capture t_short == 15 and t_std == 25 and t_grand == 40 (tier-derived turn buffers)"
            - "trigger capture st_short == ACTIVE (initial state)"

      - name: flight_creation_computes_derived_fields
        claim_type: computed_fields
        grounds:
          - entities.Flight.fields.scheduled_arrival_utc
          - entities.Flight.fields.rotation_seq
          - entities.Flight.fields.seats_booked
          - entities.Flight.fields.seats_available
          - entities.Flight.fields.estimated_gross_weight_lb
          - entities.Flight.fields.pilot_acknowledged
          - state_machines.Flight
        distinguishing_aspect: |
          A freshly created flight reports scheduled_arrival_utc == departure +
          route.duration_minutes, rotation_seq 1, seats_booked 0 / seats_available
          == seat_capacity, estimated gross == empty + fuel (no passengers),
          pilot_acknowledged false, status SCHEDULED.
        test_recipe:
          setup:
            - "Base; route R1 SHORT 25 min fuel 300; 4-seat aircraft (empty 1500); pilot P"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
          trigger:
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: Dispatcher
              captures: { f_status: $.data.status, f_arr: $.data.scheduled_arrival_utc, f_rot: $.data.rotation_seq, f_sb: $.data.seats_booked, f_sa: $.data.seats_available, f_est: $.data.estimated_gross_weight_lb, f_ack: $.data.pilot_acknowledged, f_ver: $.data.version }
          assert:
            - "trigger capture f_status == SCHEDULED (initial state)"
            - "trigger capture f_arr == 2026-08-03T14:25:00Z (14:00 + 25 min)"
            - "trigger capture f_rot == 1 (first flight of aircraft N1 on 2026-08-03)"
            - "trigger capture f_sb == 0 and f_sa == 4"
            - "trigger capture f_est == 1800 (1500 empty + 0 pax + 300 fuel)"
            - "trigger capture f_ack == false and f_ver == 1"

      - name: weather_observation_computed_fields_and_immutability
        claim_type: immutability
        grounds:
          - entities.WeatherObservation
          - entities.WeatherObservation.fields.adverse
          - entities.WeatherObservation.fields.validity_until
          - calculations.weather_posture
        distinguishing_aspect: |
          WeatherObservation (common_fields: false) carries id/created_at but no
          version/updated_at; adverse is computed (wind 26 > max 25 alone flips
          it) and validity_until == observed_at + 60 min; at now == validity_until
          the strict-< rule reads posture NORMAL.
        test_recipe:
          setup: ["Base with default weather limits; logical clock 2026-08-03T12:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
          trigger:
            - call: "POST /weather-observations"
              payload: { base_id: "${base_id}", observed_at: "2026-08-03T11:00:00Z", ceiling_ft: 5000, visibility_sm: 10, wind_kt: 26 }
              as: Dispatcher
              captures: { obs_id: $.data.id, obs_adverse: $.data.adverse, obs_valid: $.data.validity_until }
            - call: "GET /bases/${base_id}"
              as: Dispatcher
              captures: { posture: $.data.posture }
          assert:
            - "trigger capture obs_adverse == true (wind 26 > weather_wind_max_kt 25 alone is sufficient)"
            - "trigger capture obs_valid == 2026-08-03T12:00:00Z (observed_at + weather_validity_min 60)"
            - "WeatherObservation.${obs_id} response carries id and created_at but NO version or updated_at keys (common_fields: false)"
            - "trigger capture posture == NORMAL at now == 12:00 == validity_until (strict < on validity_until)"

      - name: missing_required_field_rejected_unknown_field_ignored
        claim_type: required_fields
        grounds:
          - validations[priority=1]
          - errors[ERR_INVALID_REQUEST]
          - entities.Route.fields.route_code
        distinguishing_aspect: |
          A create missing a required input field fails with ERR_INVALID_REQUEST
          (400), while the same create with an extra undeclared field succeeds
          and the unknown field is ignored (validation priority 1).
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /routes"
              payload: { tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY", sponsor_name: "ACME" }
              as: OpsAdmin
              captures: { r_id: $.data.id, r_code: $.data.route_code }
          assert:
            - "trigger capture err == ERR_INVALID_REQUEST (route_code missing)"
            - "second create succeeded (201) despite unknown sponsor_name — captured r_id is a UUID"
            - "trigger capture r_code == R1 and the stored Route has no sponsor_name field (unknown input ignored)"

      - name: invalid_enum_and_range_values_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=1]
          - validations[priority=19]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_SEASON_OVERLAP]
          - entities.Aircraft.fields.noise_class
          - entities.Season.fields.multiplier_bps
        distinguishing_aspect: |
          An out-of-enum noise_class and an out-of-range multiplier_bps (40000 >
          30000) both fail as ERR_INVALID_REQUEST (400), while a season with
          end_date == start_date violates the window rule as ERR_SEASON_OVERLAP (409).
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "ULTRA" }
              as: OpsAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /seasons"
              payload: { label: "BAD", start_date: "2026-06-01", end_date: "2026-09-01", multiplier_bps: 40000 }
              as: OpsAdmin
              captures: { err2: $.data.error_id }
            - call: "POST /seasons"
              payload: { label: "DEGEN", start_date: "2026-06-01", end_date: "2026-06-01", multiplier_bps: 10000 }
              as: OpsAdmin
              captures: { err3: $.data.error_id }
          assert:
            - "trigger capture err1 == ERR_INVALID_REQUEST (noise_class ULTRA not in enum)"
            - "trigger capture err2 == ERR_INVALID_REQUEST (multiplier_bps 40000 outside 1..30000)"
            - "trigger capture err3 == ERR_SEASON_OVERLAP (end_date must be > start_date)"

      - name: get_nonexistent_resource_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          A GET whose path id does not exist returns 404 ERR_NOT_FOUND regardless
          of resource type (flight and booking shown).
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /flights/00000000-0000-4000-8000-000000000000"
              as: Dispatcher
              captures: { err1: $.data.error_id }
            - call: "GET /bookings/00000000-0000-4000-8000-000000000000"
              as: BookingAgent
              captures: { err2: $.data.error_id }
          assert:
            - "trigger capture err1 == ERR_NOT_FOUND (404)"
            - "trigger capture err2 == ERR_NOT_FOUND (404)"

      - name: create_booking_with_unknown_flight_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
          - entities.Booking.fields.flight_id
        distinguishing_aspect: |
          Flat-topology FK integrity: a booking whose body FK flight_id does not
          exist is rejected with ERR_NOT_FOUND (404) before any business rule runs.
        test_recipe:
          setup: ["Empty DB (no flights exist)"]
          setup_api_calls: []
          trigger:
            - call: "POST /bookings"
              payload: { flight_id: "00000000-0000-4000-8000-000000000000", contact_name: "A", contact_email: "a@x.com", passengers: [ { full_name: "P0", declared_weight_lb: 150 } ] }
              as: BookingAgent
              captures: { err: $.data.error_id }
          assert:
            - "trigger capture err == ERR_NOT_FOUND (body FK validated at existence priority 4)"

      - name: pilot_creation_mints_system_fields
        claim_type: system_fields
        grounds:
          - entities.Pilot.fields.status
          - state_machines.Pilot
        distinguishing_aspect: |
          The server mints a UUID id, created_at stamped from the logical clock,
          version 1, and initial status AVAILABLE; none are request inputs.
        test_recipe:
          setup: ["Logical clock pinned at 2026-08-03T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { p_id: $.data.id, p_created: $.data.created_at, p_ver: $.data.version, p_status: $.data.status }
          assert:
            - "trigger capture p_id is a server-minted UUID (no type prefix)"
            - "trigger capture p_created == 2026-08-03T00:00:00Z (logical clock, not wall clock)"
            - "trigger capture p_ver == 1 and p_status == AVAILABLE (initial state)"

      - name: pilots_list_paginates_with_limit_offset
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          GET /pilots honors limit/offset with the envelope pagination fields:
          3 pilots with limit=2 yields a 2-item page with has_more true, and
          offset=2 yields the final 1-item page with has_more false.
        test_recipe:
          setup: ["Three pilots registered"]
          setup_api_calls:
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
            - call: "POST /pilots"
              payload: { display_name: "Pat Two", certificate_no: "C2" }
              as: OpsAdmin
            - call: "POST /pilots"
              payload: { display_name: "Pat Three", certificate_no: "C3" }
              as: OpsAdmin
          trigger:
            - call: "GET /pilots?limit=2&offset=0"
              as: Dispatcher
              captures: { page1_first: "$.data[0].certificate_no" }
            - call: "GET /pilots?limit=2&offset=2"
              as: Dispatcher
              captures: { page2_first: "$.data[0].certificate_no" }
          assert:
            - "page 1 (limit=2, offset=0): exactly 2 items in data, total_count == 3, has_more == true"
            - "page 2 (limit=2, offset=2): exactly 1 item in data, total_count == 3, has_more == false"
            - "trigger captures page1_first != page2_first (disjoint pages)"
            - "GET /pilots with no params defaults to limit 10 / offset 0 and returns all 3 with has_more == false"

      - name: booking_creation_pins_waiver_and_computed_fields
        claim_type: computed_fields
        grounds:
          - entities.Booking.fields.waiver_version_pinned
          - entities.Booking.fields.expires_at
          - entities.Booking.fields.seat_count
          - entities.Booking.fields.quoted_per_seat_cents
          - entities.Booking.fields.quoted_total_cents
          - entities.Booking.fields.season_id
          - state_machines.Booking
        distinguishing_aspect: |
          A created booking starts HELD with waiver_version_pinned copied from
          Base.current_waiver_version, expires_at == created_at + hold_expire_minutes
          (30), seat_count derived from the passengers array, quote locked at
          25000/seat with no season, and season_id null.
        test_recipe:
          setup:
            - "Base waiver WAV-9, default hold_expire_minutes 30; route R1; aircraft; pilot; flight dep 2026-08-03T14:00:00Z"
            - "Logical clock 2026-08-03T00:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-9" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: Dispatcher
              captures: { flight_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "A", contact_email: "a@x.com", passengers: [ { full_name: "P0", declared_weight_lb: 150 }, { full_name: "P1", declared_weight_lb: 160 } ] }
              as: BookingAgent
              captures: { b_status: $.data.status, b_seats: $.data.seat_count, b_waiver: $.data.waiver_version_pinned, b_created: $.data.created_at, b_exp: $.data.expires_at, b_per_seat: $.data.quoted_per_seat_cents, b_total: $.data.quoted_total_cents, b_season: $.data.season_id, b_paid: $.data.paid_cents }
          assert:
            - "trigger capture b_status == HELD (initial state) and b_paid == 0"
            - "trigger capture b_seats == 2 (derived from passengers array length)"
            - "trigger capture b_waiver == WAV-9 (pinned from Base.current_waiver_version at creation)"
            - "trigger capture b_created == 2026-08-03T00:00:00Z and b_exp == 2026-08-03T00:30:00Z (created_at + 30 min hold)"
            - "trigger capture b_per_seat == 25000 and b_total == 50000 (no season -> 10000 bps, load tier 10000, weekday)"
            - "trigger capture b_season == null (no PUBLISHED season covers 2026-08-03)"

  # ===========================================================================
  # Section 2 — State Machines (Table 2 claims)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: flight_delay_accept_round_trip
        claim_type: valid_transition
        grounds:
          - state_machines.Flight.SCHEDULED_to_DELAYED
          - state_machines.Flight.DELAYED_to_SCHEDULED
        distinguishing_aspect: |
          DELAY moves SCHEDULED -> DELAYED and rewrites scheduled_departure_utc /
          scheduled_arrival_utc; ACCEPT_DELAY confirms the new slot back to
          SCHEDULED with no field changes — a reversible pair, not a one-way pipe.
        test_recipe:
          setup: ["Flight dep 2026-08-03T14:00:00Z on route R1 (25 min); clock 2026-08-03T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: Dispatcher
              captures: { flight_id: $.data.id }
          trigger:
            - call: "POST /flights/${flight_id}/events"
              payload: { event_type: "DELAY", new_departure_utc: "2026-08-03T16:00:00Z" }
              as: Dispatcher
              captures: { st1: $.data.status, dep1: $.data.scheduled_departure_utc, arr1: $.data.scheduled_arrival_utc }
            - call: "POST /flights/${flight_id}/events"
              payload: { event_type: "ACCEPT_DELAY" }
              as: Dispatcher
              captures: { st2: $.data.status, dep2: $.data.scheduled_departure_utc }
          assert:
            - "trigger capture st1 == DELAYED and dep1 == 2026-08-03T16:00:00Z and arr1 == 2026-08-03T16:25:00Z (arrival recomputed)"
            - "trigger capture st2 == SCHEDULED and dep2 == 2026-08-03T16:00:00Z (ACCEPT_DELAY keeps the delayed slot)"

      - name: cancelled_flight_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Flight
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
