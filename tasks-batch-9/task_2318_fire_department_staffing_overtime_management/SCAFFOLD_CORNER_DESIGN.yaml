              as: StaffingOfficer
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st120}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh120: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh120}/publish"
              payload: {}
              as: StaffingOfficer
            - call: "GET /fire-ops/vacancies"
              payload: { duty_shift_id: "${sh120}", status: "OPEN" }
              as: StaffingOfficer
              captures: { vac120: "$.data[0].id" }
