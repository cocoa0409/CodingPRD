          second bubbles the cycle to ARCHIVED, after which reopen is ERR_INVALID_CYCLE_STATE.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is FROZEN with two CERTIFIED components: ENROLLMENT (TOTAL_HEADCOUNT 1000 vs prior 1000) and COMPLETIONS (TOTAL_COMPLETIONS 250 vs prior 250); neither prepare raised a check."
