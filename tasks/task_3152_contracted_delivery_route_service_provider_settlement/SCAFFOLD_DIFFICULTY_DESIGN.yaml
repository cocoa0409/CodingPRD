scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: settlement_exoneration_late_accrual_divergence
    grounds:
    - calculations.gross_settlement_calculation
    - calculations.provider_composite_score
    - state_machines.SettlementPeriod.OPEN_to_ACCRUAL_CLOSED
    - state_machines.SettlementPeriod.ACCRUAL_CLOSED_to_RECONCILED
    - validations[priority=21]
    - entities.RouteAssignment.fields.occupancy_ends_at
    distinguishing_aspect: 'The settlement domain''s provisional figure and its reconcile figure are

      computed from the SAME accrual window and the SAME deduction rows, yet

      differ because the reconcile variant first re-reads the insurance

      invariant and moves the provider to UNDER_REVIEW, which re-weights the

      composite score and raises the week''s performance_multiplier from 1.00

      to 1.10 — so the same inputs yield a 2000-cent larger deduction.

      '
    test_recipe:
      setup:
      - Provider A is APPROVED with one ACTIVE non-temporary CLASS_B driver, one PASSED vehicle, one VERIFIED AUTO_LIABILITY policy at 1000000 cents expiring 2027-01-01, and is named on an ACTIVE route assignment over area A1
      - Agreement A1 is ACTIVE with base_rate 22 c/stop, package rate 8 c, peak_surcharge 150 c/stop, insurance_coverage 500000 c
      - The logical clock reads 2026-09-01T00:00:00Z (server default) when the week is opened
      - PerformanceMetric 1 composes to 95.00, then a second composition of the sub-scores 70/68/60 under the now-safety-emphasized weights drives the composite to 88.00, which demotes Provider A to UNDER_REVIEW and re-weights the composite formula
      - SettlementPeriod W1 is OPEN with performance_multiplier 1.00 while the provider is UNDER_REVIEW
      - One stop observation of 1200 stops / 800 packages / 0 miles / 5000 accessorial cents is recorded
      - 'Deduction rows: MAINTENANCE 20000, CHARGEBACK 7000, FUEL 9000'
      setup_api_calls:
      - call: POST /route-settlement/service-providers
        payload:
          legal_name: Acme Route Services LLC
          tax_id: 27-1000001
        as: AccountManager
        captures:
          prov_a_id: $.data.id
          prov_a_v: $.data.version
      - call: POST /route-settlement/service-areas
        payload:
          area_code: TR11
          state_code: TN
          zip_prefix_low: '372'
          zip_prefix_high: '374'
          stop_capacity_weekly: 2000
        as: AccountManager
        captures:
          area_a1_id: $.data.id
      - call: POST /route-settlement/insurance-policies
        payload:
          provider_id: ${prov_a_id}
          policy_type: AUTO_LIABILITY
          coverage_cents: 1000000
          expires_at: '2027-01-01T00:00:00Z'
        as: ServiceProvider
        as_user_id: ${prov_a_id}
        captures:
          pol_a_id: $.data.id
      - call: POST /route-settlement/insurance-policies/${pol_a_id}/verify
        payload: {}
        as: ComplianceOfficer
      - call: POST /route-settlement/vehicles
        payload:
          provider_id: ${prov_a_id}
          service_area_id: ${area_a1_id}
          vehicle_class: BOX_TRUCK
          gvwr_pounds: 26000
          is_temporary: false
        as: AccountManager
        captures:
          veh_a_id: $.data.id
      - call: POST /route-settlement/vehicles/${veh_a_id}/activate
        payload: {}
        as: AccountManager
      - call: POST /route-settlement/drivers
        payload:
          provider_id: ${prov_a_id}
          service_area_id: ${area_a1_id}
          full_name: Dana Cruz
          license_class: CLASS_B
          qualification_status: QUALIFIED
          is_temporary: false
        as: AccountManager
        captures:
          drv_a_id: $.data.id
      - call: POST /route-settlement/drivers/${drv_a_id}/qualify
        payload:
          qualification_status: QUALIFIED
        as: ComplianceOfficer
      - call: POST /route-settlement/service-providers/${prov_a_id}/approve
        payload: {}
        as: AccountManager
        captures:
          prov_a_v_approved: $.data.version
      - call: POST /route-settlement/agreements
        payload:
          provider_id: ${prov_a_id}
          service_area_id: ${area_a1_id}
          base_rate_cents_per_stop: 22
          package_rate_cents: 8
          peak_surcharge_cents: 150
          insurance_coverage_cents: 500000
          negotiated_by: am_001
        as: AccountManager
        captures:
          agr_a1_id: $.data.id
      - call: POST /route-settlement/agreements/${agr_a1_id}/submit
        payload: {}
        as: ServiceProvider
        as_user_id: ${prov_a_id}
      - call: POST /route-settlement/agreements/${agr_a1_id}/sign
        payload: {}
        as: AccountManager
      - call: GET /route-settlement/service-areas/${area_a1_id}
        payload: {}
        as: AccountManager
        captures:
          area_a1_id_pre: $.data.version
      - call: POST /route-settlement/route-assignments
        payload:
          service_area_id: ${area_a1_id}
          provider_id: ${prov_a_id}
          effective_date: '2026-09-03T00:00:00Z'
          transfer_price_cents: 0
          expected_service_area_version: ${area_a1_id_pre}
        as: AccountManager
        captures:
          asg_a1_id: $.data.id
          area_a1_v: $.data.version
      - call: POST /route-settlement/route-assignments/${asg_a1_id}/activate
        payload: {}
        as: AccountManager
      - call: POST /route-settlement/performance-metrics
        payload:
          provider_id: ${prov_a_id}
          service_score: 96
          safety_score: 94
          customer_experience_score: 92
        as: SettlementAnalyst
        captures:
          pm_a1_id: $.data.id
      - call: POST /route-settlement/performance-metrics/${pm_a1_id}/compose
        payload: {}
        as: SettlementAnalyst
      - call: GET /route-settlement/service-providers/${prov_a_id}
        payload: {}
        as: AccountManager
        captures:
          prov_a_id_pre: $.data.version
      - call: POST /route-settlement/settlement-periods
        payload:
          provider_id: ${prov_a_id}
          service_area_id: ${area_a1_id}
          week_start_at: '2026-09-07T00:00:00Z'
          is_peak_week: false
          fuel_rate_cents_per_mile: 3
          expected_provider_version: ${prov_a_id_pre}
        as: SettlementAnalyst
        captures:
          per_w1_id: $.data.id
      - call: POST /route-settlement/settlement-periods/${per_w1_id}/stop-observations
        payload:
          observed_date: '2026-09-08T00:00:00Z'
          recorded_at: '2026-09-08T18:00:00Z'
          stops_count: 1200
          packages_count: 800
          miles_driven: 0
          accessorial_cents: 5000
        as: SettlementAnalyst
      - call: POST /route-settlement/settlement-periods/${per_w1_id}/deductions
        payload:
          deduction_type: MAINTENANCE
          amount_cents: 20000
          performance_factor_eligible: true
        as: SettlementAnalyst
      - call: POST /route-settlement/settlement-periods/${per_w1_id}/deductions
        payload:
          deduction_type: CHARGEBACK
          amount_cents: 7000
          chargeback_category: DAMAGE
          performance_factor_eligible: false
        as: SettlementAnalyst
      - call: POST /route-settlement/settlement-periods/${per_w1_id}/deductions
        payload:
          deduction_type: FUEL
          amount_cents: 9000
          performance_factor_eligible: false
        as: SettlementAnalyst
      - call: POST /route-settlement/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-15T00:00:00Z'
        as: PlatformAdmin
      - call: POST /route-settlement/settlement-periods/${per_w1_id}/close-accrual
        payload: {}
        as: SettlementAnalyst
        captures:
          per_w1_v: $.data.version
      trigger:
      - call: POST /route-settlement/performance-metrics/${pm_a1_id}/compose
        payload: {}
        as: SettlementAnalyst
        captures:
          pm_a1_v: $.data.version
      - call: POST /route-settlement/settlement-periods/${per_w1_id}/reconcile
        payload:
          deduction_order: MAINTENANCE_FIRST
        as: SettlementAnalyst
      assert:
      - SettlementPeriod.${per_w1_id}.status == RECONCILED
      - SettlementPeriod.${per_w1_id}.base_gross_cents == 41400
      - SettlementPeriod.${per_w1_id}.performance_multiplier == 1.10
      - SettlementPeriod.${per_w1_id}.net_amount_cents == 3400
      - SettlementPeriod.${per_w1_id}.base_gross_cents - SettlementPeriod.${per_w1_id}.net_amount_cents == 38000
      - the ACCRUAL_CLOSED reading of the same window was 5400, so the reconcile variant differs from the provisional variant by exactly 2000
  - name: provider_composite_weight_shift_divergence
    grounds:
    - calculations.provider_composite_score
    - calculations.settlement_performance_multiplier
    - state_machines.ServiceProvider.APPROVED_to_UNDER_REVIEW
    - validations[priority=21]
    - entities.PerformanceMetric.fields.composite_score
    distinguishing_aspect: 'The provider domain''s composite score has two weight sets selected by the

      provider''s lifecycle state: the same three sub-scores 70/68/60 compose to

      70.60 while ServiceProvider.status is APPROVED but to 67.20 once the

      provider is UNDER_REVIEW, a 3.40-point spread produced purely by the

      variant selector rather than by any change in the inputs.

      '
    test_recipe:
      setup:
      - Provider A is APPROVED with one ACTIVE non-temporary CLASS_B driver, one PASSED vehicle, one VERIFIED AUTO_LIABILITY policy at 1000000 cents expiring 2027-01-01
      - Agreement A1 is ACTIVE over service area A1
      - PerformanceMetric 1 composes to 92.00 while the provider is APPROVED
      setup_api_calls:
      - call: POST /route-settlement/service-providers
        payload:
          legal_name: Acme Route Services LLC
          tax_id: 27-1000001
        as: AccountManager
        captures:
          prov_a_id: $.data.id
      - call: POST /route-settlement/service-areas
        payload:
          area_code: TR11
          state_code: TN
          zip_prefix_low: '372'
          zip_prefix_high: '374'
          stop_capacity_weekly: 2000
        as: AccountManager
        captures:
          area_a1_id: $.data.id
      - call: POST /route-settlement/insurance-policies
        payload:
          provider_id: ${prov_a_id}
          policy_type: AUTO_LIABILITY
          coverage_cents: 1000000
          expires_at: '2027-01-01T00:00:00Z'
        as: ServiceProvider
        as_user_id: ${prov_a_id}
        captures:
          pol_a_id: $.data.id
      - call: POST /route-settlement/insurance-policies/${pol_a_id}/verify
        payload: {}
        as: ComplianceOfficer
      - call: POST /route-settlement/vehicles
        payload:
          provider_id: ${prov_a_id}
          service_area_id: ${area_a1_id}
          vehicle_class: BOX_TRUCK
          gvwr_pounds: 26000
          is_temporary: false
        as: AccountManager
        captures:
          veh_a_id: $.data.id
      - call: POST /route-settlement/vehicles/${veh_a_id}/activate
        payload: {}
        as: AccountManager
      - call: POST /route-settlement/drivers
        payload:
          provider_id: ${prov_a_id}
          service_area_id: ${area_a1_id}
          full_name: Dana Cruz
          license_class: CLASS_B
          qualification_status: QUALIFIED
          is_temporary: false
        as: AccountManager
        captures:
          drv_a_id: $.data.id
      - call: POST /route-settlement/drivers/${drv_a_id}/qualify
        payload:
          qualification_status: QUALIFIED
        as: ComplianceOfficer
      - call: POST /route-settlement/service-providers/${prov_a_id}/approve
        payload: {}
        as: AccountManager
      - call: POST /route-settlement/agreements
        payload:
          provider_id: ${prov_a_id}
          service_area_id: ${area_a1_id}
          base_rate_cents_per_stop: 22
          package_rate_cents: 8
          peak_surcharge_cents: 150
          insurance_coverage_cents: 500000
          negotiated_by: am_001
        as: AccountManager
        captures:
          agr_a1_id: $.data.id
      - call: POST /route-settlement/agreements/${agr_a1_id}/submit
        payload: {}
        as: ServiceProvider
        as_user_id: ${prov_a_id}
      - call: POST /route-settlement/agreements/${agr_a1_id}/sign
        payload: {}
        as: AccountManager
      - call: POST /route-settlement/performance-metrics
        payload:
          provider_id: ${prov_a_id}
          service_score: 96
          safety_score: 94
          customer_experience_score: 92
        as: SettlementAnalyst
        captures:
          pm_a1_id: $.data.id
      - call: POST /route-settlement/performance-metrics/${pm_a1_id}/compose
        payload: {}
        as: SettlementAnalyst
      - call: POST /route-settlement/performance-metrics
        payload:
          provider_id: ${prov_a_id}
          service_score: 70
          safety_score: 68
          customer_experience_score: 60
        as: SettlementAnalyst
        captures:
          pm_a2_id: $.data.id
      trigger:
      - call: POST /route-settlement/performance-metrics/${pm_a2_id}/compose
        payload: {}
        as: SettlementAnalyst
      assert:
      - PerformanceMetric.${pm_a1_id}.composite_score == 95.00
      - ServiceProvider.${prov_a_id}.status == UNDER_REVIEW
      - PerformanceMetric.${pm_a2_id}.composite_score == 88.00
      - the same sub-scores 96/94/92 evaluate to 95.00 under the DELIVERY_EMPHASIZED weight set and to 88.00 under SAFETY_EMPHASIZED, a 7.00-point spread produced by the variant selector alone
- rule_id: combinatorial_formula
  instances:
  - name: tiered_stop_rate_cliff_boundary
    grounds:
    - calculations.gross_settlement_calculation
    - calculations.deduction_segment_cap
    - entities.ServiceArea.fields.stop_capacity_weekly
    - state_machines.SettlementPeriod.OPEN_to_ACCRUAL_CLOSED
    distinguishing_aspect: 'Mode (a) plus mode (b): the stop tier is a cliff, not a marginal

      bracket, so the 1000-to-1001 stop step moves the rate applied to ALL

      1001 stops and the week''s gross jumps by 3025 cents, while the same

      week''s capped deduction bundle is scaled once and rounded once.

      '
    test_recipe:
      setup:
      - Provider A APPROVED with an ACTIVE CLASS_B driver and PASSED vehicle on area A1, ACTIVE agreement at base_rate 22 c/stop and package rate 8 c, ACTIVE assignment over A1
      - SettlementPeriod W1 is OPEN over area A1 with stop_capacity_weekly 2000 and no peak surcharge
      - One stop observation of 1000 stops / 800 packages / 0 miles / 0 accessorial cents is recorded
      setup_api_calls:
      - call: POST /route-settlement/service-providers
        payload:
          legal_name: Acme Route Services LLC
          tax_id: 27-1000001
        as: AccountManager
        captures:
          prov_a_id: $.data.id
      - call: POST /route-settlement/service-areas
        payload:
          area_code: TR11
          state_code: TN
          zip_prefix_low: '372'
          zip_prefix_high: '374'
          stop_capacity_weekly: 1001
        as: AccountManager
        captures:
          area_a1_id: $.data.id
      - call: POST /route-settlement/insurance-policies
        payload:
          provider_id: ${prov_a_id}
          policy_type: AUTO_LIABILITY
          coverage_cents: 1000000
          expires_at: '2027-01-01T00:00:00Z'
        as: ServiceProvider
        as_user_id: ${prov_a_id}
        captures:
          pol_a_id: $.data.id
      - call: POST /route-settlement/insurance-policies/${pol_a_id}/verify
        payload: {}
        as: ComplianceOfficer
      - call: POST /route-settlement/vehicles
        payload:
          provider_id: ${prov_a_id}
          service_area_id: ${area_a1_id}
          vehicle_class: BOX_TRUCK
          gvwr_pounds: 26000
          is_temporary: false
        as: AccountManager
        captures:
          veh_a_id: $.data.id
      - call: POST /route-settlement/vehicles/${veh_a_id}/activate
        payload: {}
        as: AccountManager
      - call: POST /route-settlement/drivers
        payload:
          provider_id: ${prov_a_id}
          service_area_id: ${area_a1_id}
          full_name: Dana Cruz
          license_class: CLASS_B
          qualification_status: QUALIFIED
          is_temporary: false
        as: AccountManager
        captures:
          drv_a_id: $.data.id
      - call: POST /route-settlement/drivers/${drv_a_id}/qualify
        payload:
          qualification_status: QUALIFIED
        as: ComplianceOfficer
      - call: POST /route-settlement/service-providers/${prov_a_id}/approve
        payload: {}
        as: AccountManager
      - call: POST /route-settlement/agreements
        payload:
          provider_id: ${prov_a_id}
          service_area_id: ${area_a1_id}
          base_rate_cents_per_stop: 22
          package_rate_cents: 8
          peak_surcharge_cents: 150
          insurance_coverage_cents: 500000
          negotiated_by: am_001
        as: AccountManager
        captures:
          agr_a1_id: $.data.id
      - call: POST /route-settlement/agreements/${agr_a1_id}/submit
        payload: {}
        as: ServiceProvider
        as_user_id: ${prov_a_id}
      - call: POST /route-settlement/agreements/${agr_a1_id}/sign
        payload: {}
        as: AccountManager
      - call: GET /route-settlement/service-areas/${area_a1_id}
        payload: {}
        as: AccountManager
        captures:
          area_a1_id_pre: $.data.version
      - call: POST /route-settlement/route-assignments
        payload:
          service_area_id: ${area_a1_id}
          provider_id: ${prov_a_id}
          effective_date: '2026-09-03T00:00:00Z'
          transfer_price_cents: 0
          expected_service_area_version: ${area_a1_id_pre}
        as: AccountManager
        captures:
          asg_a1_id: $.data.id
      - call: POST /route-settlement/route-assignments/${asg_a1_id}/activate
        payload: {}
        as: AccountManager
      - call: GET /route-settlement/service-providers/${prov_a_id}
        payload: {}
        as: AccountManager
        captures:
          prov_a_id_pre: $.data.version
      - call: POST /route-settlement/settlement-periods
        payload:
          provider_id: ${prov_a_id}
          service_area_id: ${area_a1_id}
          week_start_at: '2026-09-07T00:00:00Z'
          is_peak_week: false
          fuel_rate_cents_per_mile: 3
          expected_provider_version: ${prov_a_id_pre}
        as: SettlementAnalyst
        captures:
          per_w1_id: $.data.id
      - call: POST /route-settlement/settlement-periods/${per_w1_id}/stop-observations
        payload:
          observed_date: '2026-09-08T00:00:00Z'
          recorded_at: '2026-09-08T18:00:00Z'
          stops_count: 1000
          packages_count: 800
          miles_driven: 0
          accessorial_cents: 0
        as: SettlementAnalyst
      - call: POST /route-settlement/settlement-periods/${per_w1_id}/deductions
        payload:
          deduction_type: MAINTENANCE
          amount_cents: 20000
          performance_factor_eligible: true
        as: SettlementAnalyst
      - call: POST /route-settlement/settlement-periods/${per_w1_id}/deductions
        payload:
          deduction_type: ACCESSORIAL
          amount_cents: 34000
          performance_factor_eligible: true
        as: SettlementAnalyst
      - call: POST /route-settlement/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-15T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /route-settlement/settlement-periods/${per_w1_id}/close-accrual
        payload: {}
        as: SettlementAnalyst
      assert:
      - SettlementPeriod.${per_w1_id}.base_gross_cents == 28400 and the close succeeds because 1000 stops sit at a stop_capacity_weekly of 1001
      - SettlementPeriod.${per_w1_id}.net_amount_cents == 28400 because only the 20000-cent MAINTENANCE row is performance-eligible and the multiplier is 1.05
      - at 1001 stops the same week yields stops_gross 25025 rather than 22000, a 3025-cent step, because the tier rate is a cliff applied to all stops
      - 'the close boundary is inclusive: raising the area to exactly 1001 stops would still succeed while 1002 stops would raise ERR_STOP_CAPACITY_EXCEEDED'
      - a separate week carrying MAINTENANCE 40000 and ACCESSORIAL 34000 fills MAINTENANCE to 40000 and ACCESSORIAL to 10000, for a capped_deduction_cents of exactly 50000
  - name: late_accrual_recut_evaluation_order
    grounds:
    - calculations.gross_settlement_calculation
    - calculations.deduction_segment_cap
    - state_machines.SettlementPeriod.ACCRUAL_CLOSED_to_RECONCILED
