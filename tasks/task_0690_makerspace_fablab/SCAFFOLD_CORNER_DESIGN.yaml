# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Makerspace & Fab-Lab — Expert. Breadth probe across §1.1–§1.7.
# Logical clock default: 2026-04-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_member_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Member
          - endpoints
        distinguishing_aspect: "POST /members with email/full_name/tier_id returns 201; subscription_status defaults PENDING_WAIVER, wallet_credit_cents 0, version 1."
        test_recipe:
          setup:
            - "A MembershipTier exists."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { email: "c1@x.com", full_name: "C One", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { c1: $.data.id, c1_status: $.data.subscription_status }
          assert:
            - "HTTP status == 201"
            - "Member.${c1}.subscription_status == PENDING_WAIVER"
            - "Member.${c1}.wallet_credit_cents == 0"
            - "Member.${c1}.version == 1"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Member
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /members/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty member set."
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_member_missing_required_field_returns_422
        claim_type: Required Fields
        grounds:
          - entities.Member
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /members omitting full_name returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "A MembershipTier exists."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { email: "c2@x.com", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_machine_invalid_enum_class_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.Machine.fields.machine_class
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /machines with machine_class=PLASMA (not in LASER|CNC|PRINTER_3D) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Empty machine set."
          setup_api_calls: []
          trigger:
            - call: "POST /machines"
              payload: { name: "Bad", machine_class: "PLASMA", hourly_rate_cents: 1000 }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_tier_duplicate_code_returns_409
        claim_type: Type Constraints
        grounds:
          - entities.MembershipTier.fields.code
          - "errors[ERR_DUPLICATE_TIER_CODE]"
        distinguishing_aspect: "A second POST /membership-tiers with the same code returns ERR_DUPLICATE_TIER_CODE (409)."
        test_recipe:
          setup:
            - "A MAKER tier already exists."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
          trigger:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker Dup", billing_mode: "MONTHLY", monthly_fee_cents: 9000 }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_DUPLICATE_TIER_CODE"

      - name: create_material_item_duplicate_sku_returns_409
        claim_type: Type Constraints
        grounds:
          - entities.MaterialItem.fields.sku
          - "errors[ERR_DUPLICATE_SKU]"
        distinguishing_aspect: "A second POST /material-items with an existing sku returns ERR_DUPLICATE_SKU (409)."
        test_recipe:
          setup:
            - "A material item with sku ACR1 exists."
          setup_api_calls:
            - call: "POST /material-items"
              payload: { sku: "ACR1", name: "Acrylic", unit_price_cents: 133, stock_qty: 10 }
              as: FacilityAdmin
              captures: { item1: $.data.id }
          trigger:
            - call: "POST /material-items"
              payload: { sku: "ACR1", name: "Acrylic Dup", unit_price_cents: 200 }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_DUPLICATE_SKU"

      - name: create_member_unknown_tier_fk_returns_404
        claim_type: Parent Relationships
        grounds:
          - entities.Member.fields.tier_id
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "POST /members with a tier_id that resolves to nothing returns ERR_NOT_FOUND (404) — FK existence check."
        test_recipe:
          setup:
            - "No tier with the cited id."
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "c3@x.com", full_name: "C Three", tier_id: "00000000-0000-4000-8000-000000000001" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: list_machines_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Machine
          - endpoints
        distinguishing_aspect: "GET /machines returns an array envelope with limit/offset/total_count/has_more; limit defaults to 10."
        test_recipe:
          setup:
            - "Two machines exist."
          setup_api_calls:
            - call: "POST /machines"
              payload: { name: "M1", machine_class: "LASER", hourly_rate_cents: 4800 }
              as: FacilityAdmin
            - call: "POST /machines"
              payload: { name: "M2", machine_class: "CNC", hourly_rate_cents: 9000 }
              as: FacilityAdmin
          trigger:
            - call: "GET /machines"
              payload: {}
              as: Member
              as_user_id: "any-operator"
          assert:
            - "response_type == array"
            - "data length == 2; meta.total_count == 2; has_more == false"

      - name: pagination_limit_over_max_returns_400
        claim_type: Type Constraints
        grounds:
          - entities.Machine
          - "errors[ERR_VALIDATION_LIMIT]"
        distinguishing_aspect: "GET /machines?limit=101 (above max 100) returns ERR_VALIDATION_LIMIT (400)."
        test_recipe:
          setup:
            - "Empty machine set is fine."
          setup_api_calls: []
          trigger:
            - call: "GET /machines?limit=101"
              payload: {}
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response error_id == ERR_VALIDATION_LIMIT"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_reservation_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Reservation.HELD_to_CONFIRMED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Confirming a reservation already in CONFIRMED (not HELD) returns ERR_INVALID_STATE (409); no double-debit."
        test_recipe:
          setup:
            - "MAKER member activated wallet 10000; LASER; ACTIVE cert; reservation 60 min CONFIRMED."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
            - call: "POST /members"
              payload: { email: "c4@x.com", full_name: "C Four", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { c4: $.data.id }
            - call: "POST /members/${c4}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${c4}"
            - call: "POST /members/${c4}/topup"
              payload: { amount_cents: 10000 }
              as: Member
              as_user_id: "${c4}"
            - call: "POST /members/${c4}/activate"
              payload: {}
              as: Member
              as_user_id: "${c4}"
              captures: { c4_v: $.data.version }
            - call: "POST /machines"
              payload: { name: "Laser X", machine_class: "LASER", hourly_rate_cents: 4800, setup_fee_cents: 500, min_billing_minutes: 30, cooldown_minutes: 15, requires_certification: true }
              as: FacilityAdmin
              captures: { laser_x: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${c4}", machine_class: "LASER", orientation_complete: true, supervised_minutes: 240, required_supervised_minutes: 240 }
              as: StaffInstructor
              as_user_id: "${c4}"
              captures: { cert_c4: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${c4}", machine_id: "${laser_x}", certification_id: "${cert_c4}", start_at: "2026-05-10T10:00:00Z", end_at: "2026-05-10T11:00:00Z", supervision_mode: "SUPERVISED" }
              as: Member
              as_user_id: "${c4}"
              captures: { res_c4: $.data.id }
            - call: "POST /reservations/${res_c4}/confirm"
              payload: { expected_member_version: "${c4_v}" }
              as: Member
              as_user_id: "${c4}"
            - call: "GET /members/${c4}"
              payload: {}
              as: Member
              as_user_id: "${c4}"
              captures: { c4_v2: $.data.version }
          trigger:
            - call: "POST /reservations/${res_c4}/confirm"
              payload: { expected_member_version: "${c4_v2}" }
              as: Member
              as_user_id: "${c4}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "Member.${c4}.wallet_credit_cents == 5180 (single 4820 debit, no second debit)"

      - name: cancel_terminal_completed_reservation_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Reservation.CHECKED_IN_to_COMPLETED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancelling a COMPLETED (terminal) reservation returns ERR_INVALID_STATE (409); cancel from terminal is not allowed."
        test_recipe:
          setup:
            - "Reservation driven to COMPLETED via confirm/check-in/check-out (60 reserved, 30 actual)."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
            - call: "POST /members"
              payload: { email: "c5@x.com", full_name: "C Five", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { c5: $.data.id }
            - call: "POST /members/${c5}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${c5}"
            - call: "POST /members/${c5}/topup"
              payload: { amount_cents: 10000 }
              as: Member
              as_user_id: "${c5}"
            - call: "POST /members/${c5}/activate"
              payload: {}
              as: Member
              as_user_id: "${c5}"
              captures: { c5_v: $.data.version }
            - call: "POST /machines"
              payload: { name: "Laser Y", machine_class: "LASER", hourly_rate_cents: 4800, setup_fee_cents: 500, min_billing_minutes: 30, cooldown_minutes: 15, requires_certification: true }
              as: FacilityAdmin
              captures: { laser_y: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${c5}", machine_class: "LASER", orientation_complete: true, supervised_minutes: 240, required_supervised_minutes: 240 }
              as: StaffInstructor
              as_user_id: "${c5}"
              captures: { cert_c5: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${c5}", machine_id: "${laser_y}", certification_id: "${cert_c5}", start_at: "2026-05-12T10:00:00Z", end_at: "2026-05-12T11:00:00Z", supervision_mode: "SUPERVISED" }
              as: Member
              as_user_id: "${c5}"
              captures: { res_c5: $.data.id }
            - call: "POST /reservations/${res_c5}/confirm"
              payload: { expected_member_version: "${c5_v}" }
              as: Member
              as_user_id: "${c5}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /reservations/${res_c5}/check-in"
              payload: {}
              as: Member
              as_user_id: "${c5}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-12T10:30:00Z" }
              as: FacilityAdmin
            - call: "POST /reservations/${res_c5}/check-out"
              payload: {}
              as: Member
              as_user_id: "${c5}"
          trigger:
            - call: "POST /reservations/${res_c5}/cancel"
              payload: {}
              as: Member
              as_user_id: "${c5}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_INVALID_STATE"

      - name: workshop_full_then_open_on_withdraw_bubble_up
        claim_type: bubble_up
        grounds:
          - state_machines.Workshop.OPEN_to_FULL
          - state_machines.Workshop.FULL_to_OPEN
          - state_machines.WorkshopEnrollment.ENROLLED_to_WITHDRAWN
        distinguishing_aspect: "Workshop capacity 1 becomes FULL on first enrollment; a withdrawal returns it to OPEN (enrolled_count drops below capacity)."
        test_recipe:
          setup:
            - "An instructor; a workshop capacity 1; one member enrolled (workshop FULL)."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
            - call: "POST /members"
              payload: { email: "inst2@x.com", full_name: "Inst Two", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { inst2: $.data.id }
            - call: "POST /members"
              payload: { email: "stu2@x.com", full_name: "Stu Two", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { stu2: $.data.id }
            - call: "POST /workshops"
              payload: { title: "Tiny Class", instructor_id: "${inst2}", starts_at: "2026-05-20T09:00:00Z", capacity: 1 }
              as: StaffInstructor
              as_user_id: "${inst2}"
              captures: { ws2: $.data.id }
            - call: "POST /workshop-enrollments"
              payload: { workshop_id: "${ws2}", member_id: "${stu2}" }
              as: Member
              as_user_id: "${stu2}"
              captures: { enr2: $.data.id }
          trigger:
            - call: "POST /workshop-enrollments/${enr2}/withdraw"
              payload: {}
              as: Member
              as_user_id: "${stu2}"
          assert:
            - "WorkshopEnrollment.${enr2}.status == WITHDRAWN"
            - "Workshop.${ws2}.status == OPEN (was FULL; enrolled_count dropped to 0)"
            - "Workshop.${ws2}.enrolled_count == 0"

      - name: check_in_before_window_returns_window_not_open
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
          - "errors[ERR_WINDOW_NOT_OPEN]"
        distinguishing_aspect: "Check-in attempted while clock (2026-04-01 default) < start_at (2026-05-15) returns ERR_WINDOW_NOT_OPEN (409)."
        test_recipe:
          setup:
            - "MAKER member activated wallet 10000; LASER; ACTIVE cert; reservation 60 min CONFIRMED, window 2026-05-15."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
            - call: "POST /members"
              payload: { email: "c6@x.com", full_name: "C Six", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { c6: $.data.id }
            - call: "POST /members/${c6}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${c6}"
            - call: "POST /members/${c6}/topup"
              payload: { amount_cents: 10000 }
              as: Member
              as_user_id: "${c6}"
            - call: "POST /members/${c6}/activate"
              payload: {}
              as: Member
              as_user_id: "${c6}"
              captures: { c6_v: $.data.version }
            - call: "POST /machines"
              payload: { name: "Laser Z", machine_class: "LASER", hourly_rate_cents: 4800, setup_fee_cents: 500, min_billing_minutes: 30, cooldown_minutes: 15, requires_certification: true }
              as: FacilityAdmin
              captures: { laser_z: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${c6}", machine_class: "LASER", orientation_complete: true, supervised_minutes: 240, required_supervised_minutes: 240 }
              as: StaffInstructor
              as_user_id: "${c6}"
              captures: { cert_c6: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${c6}", machine_id: "${laser_z}", certification_id: "${cert_c6}", start_at: "2026-05-15T10:00:00Z", end_at: "2026-05-15T11:00:00Z", supervision_mode: "SUPERVISED" }
              as: Member
              as_user_id: "${c6}"
              captures: { res_c6: $.data.id }
            - call: "POST /reservations/${res_c6}/confirm"
              payload: { expected_member_version: "${c6_v}" }
              as: Member
              as_user_id: "${c6}"
          trigger:
            - call: "POST /reservations/${res_c6}/check-in"
              payload: {}
              as: Member
              as_user_id: "${c6}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_WINDOW_NOT_OPEN"

      - name: certification_expired_blocks_confirm_via_invalid_state
        claim_type: guarded transitions
        grounds:
          - state_machines.Certification.ACTIVE_to_EXPIRED
          - state_machines.Reservation.HELD_to_CONFIRMED
          - "errors[ERR_CERTIFICATION_REQUIRED]"
        distinguishing_aspect: "After a cert lapses to EXPIRED, confirming a new HELD reservation relying on it returns ERR_CERTIFICATION_REQUIRED (409) — no ACTIVE cert on (member, class)."
        test_recipe:
          setup:
            - "MAKER member activated wallet 10000; LASER; cert granted 2026-04-01 then expired via clock 2027-05-01 + refresh-expiry."
            - "A new HELD reservation (window 2027-06-01) referencing the now-EXPIRED cert."
          setup_api_calls:
            - call: "POST /membership-tiers"
              payload: { code: "MAKER", name: "Maker", billing_mode: "MONTHLY", monthly_fee_cents: 0, discount_bps: 1000, prepaid_machine_minutes: 0, locker_free_liters: 50, unsupervised_allowed: true }
              as: FacilityAdmin
              captures: { tier_maker: $.data.id }
            - call: "POST /members"
              payload: { email: "c7@x.com", full_name: "C Seven", tier_id: "${tier_maker}" }
              as: FacilityAdmin
              captures: { c7: $.data.id }
            - call: "POST /members/${c7}/sign-waiver"
              payload: {}
              as: Member
              as_user_id: "${c7}"
            - call: "POST /members/${c7}/topup"
              payload: { amount_cents: 10000 }
              as: Member
              as_user_id: "${c7}"
            - call: "POST /members/${c7}/activate"
              payload: {}
              as: Member
              as_user_id: "${c7}"
              captures: { c7_v: $.data.version }
            - call: "POST /machines"
              payload: { name: "Laser W", machine_class: "LASER", hourly_rate_cents: 4800, setup_fee_cents: 500, min_billing_minutes: 30, cooldown_minutes: 15, requires_certification: true }
              as: FacilityAdmin
              captures: { laser_w: $.data.id }
            - call: "POST /certifications"
              payload: { member_id: "${c7}", machine_class: "LASER", orientation_complete: true, supervised_minutes: 240, required_supervised_minutes: 240 }
              as: StaffInstructor
              as_user_id: "${c7}"
              captures: { cert_c7: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /certifications/${cert_c7}/refresh-expiry"
              payload: {}
              as: StaffInstructor
              as_user_id: "${c7}"
            - call: "POST /reservations"
              payload: { member_id: "${c7}", machine_id: "${laser_w}", certification_id: "${cert_c7}", start_at: "2027-06-01T10:00:00Z", end_at: "2027-06-01T11:00:00Z", supervision_mode: "SUPERVISED" }
              as: Member
              as_user_id: "${c7}"
              captures: { res_c7: $.data.id }
            - call: "GET /members/${c7}"
              payload: {}
              as: Member
              as_user_id: "${c7}"
              captures: { c7_v2: $.data.version }
          trigger:
            - call: "POST /reservations/${res_c7}/confirm"
              payload: { expected_member_version: "${c7_v2}" }
              as: Member
              as_user_id: "${c7}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response error_id == ERR_CERTIFICATION_REQUIRED"

      - name: reservation_estimate_vs_final_divergence
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Reservation.CHECKED_IN_to_COMPLETED
        excluded_because:
          difficulty_instance: dual_variant_calc / session_charge_estimate_vs_final_on_reservation
          rationale: "Estimate-vs-final divergence and wallet reconciliation are the asserted outcome of the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: locker_overage_threshold_boundary_at_free_quota
        claim_type: threshold
        grounds:
          - calculations.locker_overage
          - entities.Locker.fields.overage_fee_cents
        distinguishing_aspect: "MAKER free 50L: a locker at exactly 50L has overage_fee_cents == 0; PATCH to 51L makes it 30; 80L makes it 900."
        test_recipe:
          setup:
            - "MAKER member activated; a locker assigned with used_liters 50 (at the free quota)."
          setup_api_calls:
            - call: "POST /membership-tiers"
