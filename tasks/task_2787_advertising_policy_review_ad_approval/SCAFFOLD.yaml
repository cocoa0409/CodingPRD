  - method: GET
    path: "/ad-policy/ad-creatives/{id}/destination-checks"
    description: "List the creative's destination checks, ordered by created_at ASC"
    roles: [PolicyAdmin, PolicyReviewer, IntegrityAnalyst, Advertiser]
    code: 200
