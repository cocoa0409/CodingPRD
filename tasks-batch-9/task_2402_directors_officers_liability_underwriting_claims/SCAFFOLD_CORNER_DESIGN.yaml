            - "the second score attempt is 422 ERR_DISCLOSURE_STALE — the only package was filed 2025-01-01, which is 577 days before the clock and therefore outside DISCLOSURE_STALE_DAYS 540"
            - "the third score attempt is 200: the selected package is now the fiscal-2025 one filed 2026-03-01, which is fresh, and the stale 2024 package on file does not block scoring"
