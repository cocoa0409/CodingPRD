              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { cn: $.data.id }
            - call: "POST /surveillance/cases/${cn}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${cn}/classify"
              payload: { classification: "CONFIRMED" }
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/nedss-exports"
              payload: { program_id: "${prog}", case_id: "${cn}" }
              as: EpiAnalyst
              captures: { ex: $.data.id }
            - call: "POST /surveillance/cases/${cn}/close"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${cn}/reopen"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${cn}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/cases/${cn}/classify"
              payload: { classification: "PROBABLE" }
              as: CaseInvestigator
              as_user_id: "${j1}"
          trigger:
            - call: "POST /surveillance/nedss-exports/${ex}/transmit"
              payload: {}
              as: EpiAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EXPORT_SNAPSHOT_STALE"
            - "NedssExport.${ex}.status == GENERATED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: exposure_event_outside_closed_infectious_window
        grounds:
          - validations[priority=8]
          - calculations.infectious_period_window
          - entities.ExposureEvent.fields.encounter_date
        distinguishing_aspect: |
          Point-in-CLOSED-interval semantics on the Case infectious window: an encounter on
          the inclusive end edge 2026-03-20 is accepted, but 2026-03-21 (one day past the
          closed end) is rejected with ERR_ENCOUNTER_OUTSIDE_INFECTIOUS_WINDOW — distinct from
          the day-range adjacency semantics of MonitoringPeriod overlap.
        test_recipe:
          setup:
            - "Program P, condition COVID19 (presymptomatic 2, tail 10), jurisdiction J1."
            - "Index case CI symptomatic onset 2026-03-10 interviewed -> window [2026-03-08, 2026-03-20]."
            - "Contact KE elicited."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
