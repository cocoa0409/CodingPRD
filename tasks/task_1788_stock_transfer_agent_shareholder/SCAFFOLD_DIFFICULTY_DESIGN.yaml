            - "hop3: Issuer.${iss}.total_book_entry_shares == 300 (100 + 200) and total_certificated_shares == 0 (was 200)"
            - "Issuer.${iss}.shares_outstanding == 300 (conserved)"
            - "TransferRequest.${t}.status == SETTLED and settled_at is set"

      - name: stale_dating_cascade_payment_account_case
        grounds:
          - state_machines.DividendPayment.DISBURSED_to_STALE_DATED
          - entities.ShareholderAccount.fields.stale_dividend_cents
          - state_machines.EscheatmentCase
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (the logical-clock endpoint, not a business
          action): hop1 stale-dates the payment at disbursed_at + 180 days, hop2 debits the
          account's stale_dividend_cents, hop3 (on the subsequent sweep) turns dormancy into an
          identified escheatment case. A fan-out would not explain the payment -> account -> case
          ordering.
        test_recipe:
          setup:
            - "CA account created at default clock 2026-08-01 holding 10 shares; declaration 25000 millicents, record 2026-08-02, payable 2026-08-03"
            - "Payment disbursed 2026-08-03 (gross 250), never cashed; clock advanced to 2029-08-01 (past both stale horizon and 3-year dormancy)"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Iota Ltd", cusip: "000000009", ticker: "IOTA", shares_outstanding: 10, par_value_cents: 1, current_market_price_cents: 6000 }
