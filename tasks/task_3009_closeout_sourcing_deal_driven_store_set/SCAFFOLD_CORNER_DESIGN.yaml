              as_user_id: so-1
            - call: "POST /lots/${lot1}/price"
              payload: { retail_price_cents: 4000, advertises_comparison: true }
              as: PricingLead
            - call: "POST /lots/${lot1}/allocations"
              payload: { store_id: "${st1}", qty_requested: 60 }
              as: AllocationManager
              captures: { al1: $.data.id }
            - call: "POST /lots/${lot1}/allocations/commit"
              payload: {}
              as: AllocationManager
            - call: "POST /lots/${lot1}/allocations/${al1}/ship"
              payload: {}
              as: AllocationManager
            - call: "POST /lots/${lot1}/allocations/${al1}/receive"
              payload: {}
              as: AllocationManager
            - call: "POST /stores/${st1}/aisle-assignments"
              payload: { lot_id: "${lot1}", aisle_code: "A1", daily_unit_limit: 10, expected_store_version: "${st1_v}" }
              as: StoreManager
          trigger:
            - call: "POST /stores/${st1}/purchases"
              payload: { lot_id: "${lot1}", qty: 3 }
              as: Anonymous
            - call: "GET /lots/${lot1}"
              payload: {}
              as: Admin
              captures: { sold: $.data.qty_sold }
            - call: "GET /lots/${lot1}/allocations/${al1}"
              payload: {}
              as: Admin
              captures: { onhand: $.data.store_on_hand_qty }
          assert:
            - "${sold} == 3 and ${onhand} == 57"
            - "conservation: 100 == qty_pool(40) + outstanding(57) + sold(3) + 0 + 0"

      - name: cascading_side_effects_excluded
        claim_type: cascade_coverage
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "transitive_cascade / recall_block_cascades_allocations_and_assignments"
          rationale: "N-level cascade ordering is exercised end-to-end by the named §1.8 instances (recall block depth-3 and liquidation depth-2)."

      - name: rate_threshold_pacing_excluded
        claim_type: rate_threshold_coverage
        grounds: [complexity_profile.complexity_layers, calculations.sell_through_pacing]
        excluded_because:
          difficulty_instance: "combinatorial_formula / pacing_evaluation_order_eligibility_gate"
          rationale: "The cumulative pacing threshold and its strict inequality are covered by the named §1.8 instance and the pacing_exactly_half_target_does_not_trigger corner."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: purchase_response_reflects_computed_fields_immediately
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.Purchase.fields.line_total_cents]
        distinguishing_aspect: "immediate consistency: the purchase creation response itself carries the computed pricing fields (no re-read needed) and they match a follow-up GET exactly."
        test_recipe:
          setup: ["lot ON_SALE at S1 with 60 on hand, retail 4000; GOLD member; assignment limit 10"]
          setup_api_calls:
            - call: "POST /jurisdiction-rules"
              payload: { jurisdiction_code: "CA", comparison_rule: "WAS_NOW_WINDOW", window_days: 90, required_offer_days: 30, max_advertised_discount_pct: 70, member_discount_cap_pct: 30 }
              as: PricingLead
              captures: { jur_ca: $.data.id }
            - call: "POST /vendors"
              payload: { name: "Acme Closeouts", vendor_code: "ACME" }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { ven1: $.data.id }
            - call: "POST /stores"
              payload: { name: "Store One", store_code: "S1", jurisdiction_id: "${jur_ca}", performance_tier: "TIER_1" }
              as: Admin
              captures: { st1: $.data.id, st1_v: $.data.version }
            - call: "POST /lots"
              payload: { vendor_id: "${ven1}", home_jurisdiction_id: "${jur_ca}", title: "Widget Lot", source_type: "MFR_OVERRUN", condition_grade: "A", quantity_total: 100, total_cost_cents: 100000, est_sellable_qty: 100, comparison_price_cents: 10000, vendor_msrp_cents: 10000, pace_target_units_per_week: 1000 }
              as: SourcingBuyer
              as_user_id: buyer-1
              captures: { lot1: $.data.id }
            - call: "POST /lots/${lot1}/screenings"
              payload: {}
              as: SafetyOfficer
              as_user_id: so-1
              captures: { scr1: $.data.id }
            - call: "POST /lots/${lot1}/screenings/${scr1}/complete"
              payload: { recall_check: "PASS", expiration_check: "PASS", condition_verified: true, qty_grade_a: 100, qty_grade_b: 0, qty_grade_c: 0 }
              as: SafetyOfficer
              as_user_id: so-1
            - call: "POST /lots/${lot1}/price"
              payload: { retail_price_cents: 4000, advertises_comparison: true }
              as: PricingLead
            - call: "POST /lots/${lot1}/allocations"
              payload: { store_id: "${st1}", qty_requested: 60 }
              as: AllocationManager
              captures: { al1: $.data.id }
            - call: "POST /lots/${lot1}/allocations/commit"
              payload: {}
              as: AllocationManager
            - call: "POST /lots/${lot1}/allocations/${al1}/ship"
              payload: {}
              as: AllocationManager
            - call: "POST /lots/${lot1}/allocations/${al1}/receive"
              payload: {}
              as: AllocationManager
            - call: "POST /stores/${st1}/aisle-assignments"
              payload: { lot_id: "${lot1}", aisle_code: "A1", daily_unit_limit: 10, expected_store_version: "${st1_v}" }
              as: StoreManager
            - call: "POST /members"
              payload: { member_code: "M-GOLD", tier: "GOLD", home_store_id: "${st1}" }
              as: Anonymous
              captures: { mem1: $.data.id }
          trigger:
            - call: "POST /stores/${st1}/purchases"
              payload: { lot_id: "${lot1}", qty: 2, member_id: "${mem1}" }
              as: ClubMember
              as_user_id: "${mem1}"
              captures: { pur1: $.data.id, unit_r: $.data.unit_price_cents, total_r: $.data.line_total_cents, variant_r: $.data.pricing_variant }
            - call: "GET /purchases/${pur1}"
              payload: {}
              as: Admin
              captures: { unit_g: $.data.unit_price_cents, total_g: $.data.line_total_cents }
          assert:
            - "${variant_r} == STANDARD and ${unit_r} == 3400 and ${total_r} == 6800 (in the creation response itself)"
            - "${unit_g} == ${unit_r} and ${total_g} == ${total_r} (GET agrees with the write response)"
