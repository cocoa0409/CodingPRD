# =============================================================================
# Census & Field-Survey Operations — Scaffold Seed Tables (§1.0–§1.7)
# Difficulty band: Expert
# =============================================================================

scenario: |
  Census & Field-Survey Operations: assignment-area & case roster, enumerator
  hire/route & geo, attempt log & disposition, response capture (in-person/phone),
  reinterview/QC & fraud, payroll/mileage, multilingual, completion/coverage
  reporting

domain_name: census-field-survey
api_prefix: ""          # root-mounted; collections are flat top-level siblings

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: hybrid          # SurveyProject→AssignmentArea→Case→Attempt/Response tree
                                   # + cross-cutting Enumerator, CaseAssignment junction, Pay* ledger
  state_machine_shape: cyclic      # Case reopens (COMPLETE→IN_PROGRESS); ReinterviewCase branches
  relationship_patterns:
    - one_to_many
    - many_to_many                 # CaseAssignment junction between Case and Enumerator
    - cross_aggregate              # Attempt/Response reference Enumerator across the area tree
  role_model: segregation_of_duties  # a response's capturer may not be its reinterview reviewer
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SurveyProject
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Survey/census wave name" }
      - { name: region_code, type: string, source: input, description: "Geographic region code" }
      - { name: default_language, type: enum, source: input, description: "Default interview language; MUST be a member of supported_languages", constraints: "one of EN|ES|ZH|VI and present in supported_languages" }
      - { name: supported_languages, type: array, source: input, description: "Non-empty list of language codes offered by this wave", constraints: "each of EN|ES|ZH|VI; at least one" }
      - { name: fraud_score_threshold, type: integer, source: input, default: 60, description: "Response fraud_score >= this value flags needs_reinterview", constraints: "0..100" }
      - { name: max_attempts, type: integer, source: input, default: 6, description: "Maximum contact attempts allowed per Case before it closes as MAX_ATTEMPTS", constraints: ">=1" }
      - { name: mileage_rate_cents_per_mile, type: integer, source: input, default: 67, description: "Reimbursement rate applied to in-person attempt mileage", constraints: ">=0" }
      - { name: status, type: enum, source: system, description: "PLANNING -> IN_FIELD -> CLOSED", default: PLANNING, constraints: "PLANNING|IN_FIELD|CLOSED" }

  - name: AssignmentArea
    parent: SurveyProject
    common_fields: true
    fields:
      - { name: survey_project_id, type: string, source: system, description: "FK -> SurveyProject.id" }
      - { name: area_code, type: string, source: input, description: "Area / block identifier unique within the project" }
      - { name: budget_cents, type: integer, source: input, description: "Total field-work budget available to commit against attempts in this area", constraints: ">=0" }
      - { name: budget_committed_cents, type: integer, source: computed, default: 0, description: "Sum of pay_committed_cents over this area's LOGGED (non-cancelled) attempts" }
      - { name: budget_remaining_cents, type: integer, source: computed, description: "= budget_cents - budget_committed_cents" }
      - { name: total_case_count, type: integer, source: computed, default: 0, description: "Count of Cases in this area" }
      - { name: pending_case_count, type: integer, source: computed, default: 0, description: "Count of Cases in UNASSIGNED or ASSIGNED" }
      - { name: in_progress_case_count, type: integer, source: computed, default: 0, description: "Count of Cases in IN_PROGRESS" }
      - { name: complete_case_count, type: integer, source: computed, default: 0, description: "Count of Cases in COMPLETE" }
      - { name: refused_case_count, type: integer, source: computed, default: 0, description: "Count of Cases in REFUSED" }
      - { name: vacant_case_count, type: integer, source: computed, default: 0, description: "Count of Cases in VACANT" }
      - { name: max_attempts_case_count, type: integer, source: computed, default: 0, description: "Count of Cases in MAX_ATTEMPTS" }
      - { name: projected_coverage_rate, type: number, source: computed, default: 0, description: "= (complete_case_count + in_progress_case_count) / total_case_count, else 0 when total=0; 4 dp round_half_up" }
      - { name: final_coverage_rate, type: number, source: computed, default: 0, description: "= complete_case_count / total_case_count, else 0 when total=0; 4 dp round_half_up" }
      - { name: status, type: enum, source: system, description: "DRAFT -> IN_FIELD -> FROZEN -> COMPLETE (FROZEN<->IN_FIELD reversible; COMPLETE->IN_FIELD on reopen)", default: DRAFT, constraints: "DRAFT|IN_FIELD|FROZEN|COMPLETE" }

  - name: Enumerator
    parent: SurveyProject
    common_fields: true
    fields:
      - { name: survey_project_id, type: string, source: system, description: "FK -> SurveyProject.id" }
      - { name: full_name, type: string, source: input, description: "Field worker full name" }
      - { name: languages, type: array, source: input, description: "Language codes this enumerator can interview in", constraints: "each of EN|ES|ZH|VI; at least one" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Pay rate used to compute attempt stipend", constraints: ">=0" }
      - { name: gross_pay_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over ALL of this enumerator's PayLines ever created (incremented on every pay-line create; a later reversal does NOT decrement it)" }
      - { name: reversed_pay_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this enumerator's REVERSED PayLines" }
      - { name: net_pay_cents, type: integer, source: computed, default: 0, description: "= gross_pay_cents - reversed_pay_cents" }
      - { name: fraud_flag, type: boolean, source: computed, default: false, description: "Set true when a reinterview on one of this enumerator's responses finalizes FRAUD" }
      - { name: status, type: enum, source: system, description: "APPLICANT -> HIRED -> ACTIVE; ACTIVE<->SUSPENDED", default: APPLICANT, constraints: "APPLICANT|HIRED|ACTIVE|SUSPENDED" }

  - name: Case
    parent: AssignmentArea
    common_fields: true
    fields:
      - { name: assignment_area_id, type: string, source: system, description: "FK -> AssignmentArea.id" }
      - { name: address, type: string, source: input, description: "Household / dwelling address" }
      - { name: respondent_language, type: enum, source: input, description: "Preferred respondent language; MUST be in the project's supported_languages", constraints: "one of the project supported_languages" }
      - { name: assigned_enumerator_id, type: string, source: computed, default: null, description: "Enumerator id of the current ACTIVE CaseAssignment, else null" }
      - { name: attempt_count, type: integer, source: computed, default: 0, description: "Number of LOGGED (non-cancelled) attempts on this case" }
      - { name: status, type: enum, source: system, description: "UNASSIGNED -> ASSIGNED -> IN_PROGRESS -> COMPLETE/REFUSED/VACANT/MAX_ATTEMPTS; COMPLETE->IN_PROGRESS on reopen", default: UNASSIGNED, constraints: "UNASSIGNED|ASSIGNED|IN_PROGRESS|COMPLETE|REFUSED|VACANT|MAX_ATTEMPTS" }

  - name: CaseAssignment
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: enumerator_id, type: string, source: input, description: "FK -> Enumerator.id" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> SUPERSEDED (on reassignment) / RELEASED (on case terminal or enumerator suspension)", default: ACTIVE, constraints: "ACTIVE|SUPERSEDED|RELEASED" }

  - name: Attempt
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: acting_enumerator_id, type: string, source: system, description: "Acting enumerator id captured from X-User-ID; equals the case's active CaseAssignment.enumerator_id (audit reference, not a routable FK)" }
      - { name: mode, type: enum, source: input, description: "Contact mode", constraints: "IN_PERSON|PHONE" }
      - { name: window_start, type: datetime, source: input, description: "Planned contact window start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Planned contact window end (ISO 8601 UTC); MUST be strictly after window_start" }
      - { name: disposition, type: enum, source: input, description: "Outcome of the attempt", constraints: "NO_ONE_HOME|REFUSED|VACANT|LANGUAGE_BARRIER|CONTACT_MADE|APPOINTMENT_SET" }
      - { name: mileage_miles, type: number, source: input, default: 0, description: "Miles driven for this attempt; only reimbursed for IN_PERSON attempts", constraints: ">=0" }
      - { name: pay_committed_cents, type: integer, source: computed, default: 0, description: "Stipend + mileage reimbursement committed by this attempt (0 for PHONE mileage)" }
      - { name: status, type: enum, source: system, description: "LOGGED -> CANCELLED", default: LOGGED, constraints: "LOGGED|CANCELLED" }

  - name: Response
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: capturing_enumerator_id, type: string, source: system, description: "Capturing enumerator id from X-User-ID (audit reference, not a routable FK)" }
      - { name: mode, type: enum, source: input, description: "Capture mode", constraints: "IN_PERSON|PHONE" }
      - { name: language_used, type: enum, source: input, description: "Language the interview was conducted in; MUST be in the capturing enumerator's languages", constraints: "one of EN|ES|ZH|VI" }
      - { name: duration_minutes, type: integer, source: input, description: "Interview length in minutes; < 8 contributes a short-duration fraud penalty", constraints: ">=0" }
      - { name: flagged_answer_count, type: integer, source: input, description: "Number of internally inconsistent answers", constraints: ">=0" }
      - { name: gps_variance_meters, type: number, source: input, description: "Distance between capture GPS and the case address in meters", constraints: ">=0" }
      - { name: fraud_score, type: integer, source: computed, description: "0..100 fraud score; see calculations.response_fraud_score" }
      - { name: needs_reinterview, type: boolean, source: computed, description: "True when fraud_score >= project.fraud_score_threshold" }
      - { name: status, type: enum, source: system, description: "CAPTURED -> ACCEPTED / INVALIDATED", default: CAPTURED, constraints: "CAPTURED|ACCEPTED|INVALIDATED" }

  - name: ReinterviewCase
    parent: Response
    common_fields: true
    fields:
      - { name: response_id, type: string, source: system, description: "FK -> Response.id" }
      - { name: reviewer_enumerator_id, type: string, source: input, description: "Enumerator conducting the reinterview; MUST be ACTIVE and MUST differ from the response's capturing_enumerator_id (segregation of duties)" }
      - { name: reason, type: enum, source: input, description: "Why the response was pulled for QC", constraints: "RANDOM_SAMPLE|HIGH_FRAUD_SCORE|MANUAL" }
      - { name: finding_note, type: string, source: input, default: null, description: "Optional reviewer note" }
      - { name: status, type: enum, source: system, description: "OPEN -> IN_REVIEW -> CONFIRMED / DISCREPANT / FRAUD", default: OPEN, constraints: "OPEN|IN_REVIEW|CONFIRMED|DISCREPANT|FRAUD" }

  - name: PayPeriod
    parent: SurveyProject
    common_fields: true
    fields:
      - { name: survey_project_id, type: string, source: system, description: "FK -> SurveyProject.id" }
      - { name: label, type: string, source: input, description: "Pay period label, e.g. 2026-W09" }
      - { name: overtime_threshold_cents, type: integer, source: input, default: 200000, description: "Per-enumerator STIPEND total above which excess is paid an overtime premium at LOCK", constraints: ">=0" }
      - { name: provisional_total_cents, type: integer, source: computed, default: 0, description: "Running sum of amount_cents over this period's non-REVERSED PayLines" }
      - { name: final_total_cents, type: integer, source: computed, default: 0, description: "Reconciled total computed at LOCK including overtime premiums; see calculations.pay_period_total" }
      - { name: status, type: enum, source: system, description: "OPEN -> LOCKED -> PAID", default: OPEN, constraints: "OPEN|LOCKED|PAID" }

  - name: PayLine
    parent: Enumerator
    common_fields: true
    fields:
      - { name: enumerator_id, type: string, source: system, description: "FK -> Enumerator.id" }
      - { name: pay_period_id, type: string, source: system, description: "FK -> PayPeriod.id" }
      - { name: line_type, type: enum, source: input, description: "Kind of pay line; only STIPEND totals count toward overtime", constraints: "STIPEND|MILEAGE|BONUS" }
      - { name: amount_cents, type: integer, source: input, description: "Positive amount in cents; a reversal is modeled by flipping the line's status to REVERSED, not by a negative line", constraints: ">0" }
      - { name: status, type: enum, source: system, description: "ACCRUED -> REVERSED", default: ACCRUED, constraints: "ACCRUED|REVERSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SurveyProject
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: IN_FIELD
        trigger: "POST /survey-projects/{id}/open"
        actor: SurveyAdmin
        preconditions: ["Project in PLANNING (ERR_PROJECT_INVALID_STATE)"]
        side_effects: []
      - from: IN_FIELD
        to: CLOSED
        trigger: "POST /survey-projects/{id}/close"
        actor: SurveyAdmin
        preconditions: ["Project in IN_FIELD (ERR_PROJECT_INVALID_STATE)"]
        side_effects: []

  - entity: AssignmentArea
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: IN_FIELD
        trigger: "POST /assignment-areas/{id}/open"
        actor: SurveyAdmin
        preconditions:
          - "Area in DRAFT (ERR_AREA_INVALID_STATE)"
          - "Parent SurveyProject in IN_FIELD (ERR_PROJECT_NOT_IN_FIELD) — cross-entity guard"
        side_effects: []
      - from: IN_FIELD
        to: FROZEN
        trigger: "POST /assignment-areas/{id}/freeze"
        actor: SurveyAdmin
        preconditions: ["Area in IN_FIELD (ERR_AREA_INVALID_STATE)"]
        side_effects: []
      - from: FROZEN
        to: IN_FIELD
        trigger: "POST /assignment-areas/{id}/unfreeze"
        actor: SurveyAdmin
        preconditions: ["Area in FROZEN (ERR_AREA_INVALID_STATE)"]
        side_effects: []
      - from: IN_FIELD
        to: COMPLETE
        trigger: "system (bubble-up when a Case reaches COMPLETE and in_progress_case_count + pending_case_count == 0)"
        actor: system
        preconditions: ["Area IN_FIELD and no case remains pending or in_progress"]
        side_effects: []
        note: "Auto-transition; last leg of the completion cascade."
      - from: COMPLETE
        to: IN_FIELD
        trigger: "system (reopen when a Case leaves COMPLETE via reinterview FRAUD)"
        actor: system
        preconditions: ["Area COMPLETE and a member case reopened to IN_PROGRESS"]
        side_effects: []
        note: "Auto-revert; part of the fraud cascade."

  - entity: Enumerator
    initial_state: APPLICANT
    terminal_states: []
    transitions:
      - from: APPLICANT
        to: HIRED
        trigger: "POST /enumerators/{id}/hire"
        actor: SurveyAdmin
        preconditions: ["Enumerator in APPLICANT (ERR_ENUMERATOR_INVALID_STATE)"]
        side_effects: []
      - from: HIRED
        to: ACTIVE
        trigger: "POST /enumerators/{id}/activate"
        actor: SurveyAdmin
        preconditions: ["Enumerator in HIRED (ERR_ENUMERATOR_INVALID_STATE)"]
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /enumerators/{id}/suspend"
        actor: SurveyAdmin
        preconditions: ["Enumerator in ACTIVE (ERR_ENUMERATOR_INVALID_STATE)"]
        side_effects: ["Each ACTIVE CaseAssignment for this enumerator -> RELEASED; each affected Case's assigned_enumerator_id cleared to null"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /enumerators/{id}/reinstate"
        actor: SurveyAdmin
        preconditions: ["Enumerator in SUSPENDED (ERR_ENUMERATOR_INVALID_STATE)"]
        side_effects: []

  - entity: Case
    initial_state: UNASSIGNED
    terminal_states: [REFUSED, VACANT, MAX_ATTEMPTS]
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /cases/{id}/assignments"
        actor: FieldSupervisor
        preconditions:
          - "Parent area in IN_FIELD (ERR_AREA_NOT_IN_FIELD) — cross-entity guard"
          - "Target Enumerator in ACTIVE (ERR_ENUMERATOR_NOT_ACTIVE) — cross-entity guard"
          - "expected_case_version matches Case.version (ERR_STALE_CASE_VERSION)"
        side_effects:
          - "Create CaseAssignment(status=ACTIVE)"
          - "Case.assigned_enumerator_id = enumerator_id"
          - "Case moves UNASSIGNED->ASSIGNED (pending_case_count unchanged; both are pending)"
          - "increments Case.version by 1"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /cases/{id}/assignments (reassignment / supersede)"
        actor: FieldSupervisor
        preconditions:
          - "Parent area in IN_FIELD (ERR_AREA_NOT_IN_FIELD)"
          - "Target Enumerator in ACTIVE (ERR_ENUMERATOR_NOT_ACTIVE)"
          - "expected_case_version matches Case.version (ERR_STALE_CASE_VERSION)"
        side_effects:
          - "Prior ACTIVE CaseAssignment -> SUPERSEDED"
          - "Create new CaseAssignment(status=ACTIVE)"
          - "Case.assigned_enumerator_id = new enumerator_id"
          - "increments Case.version by 1"
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /cases/{id}/attempts (first LOGGED attempt with a non-terminal disposition)"
        actor: Enumerator
        preconditions:
          - "Acting enumerator == Case.assigned_enumerator_id (ERR_NOT_ASSIGNED_ENUMERATOR)"
          - "Parent area IN_FIELD, not FROZEN (ERR_AREA_FROZEN)"
        side_effects:
          - "attempt_count += 1"
          - "area pending_case_count -= 1; area in_progress_case_count += 1"
          - "recompute projected/final coverage"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /cases/{id}/attempts (subsequent attempt with NO_ONE_HOME|APPOINTMENT_SET|LANGUAGE_BARRIER|CONTACT_MADE)"
        actor: Enumerator
        preconditions:
          - "Acting enumerator == Case.assigned_enumerator_id (ERR_NOT_ASSIGNED_ENUMERATOR)"
          - "attempt_count < project.max_attempts (ERR_MAX_ATTEMPTS_REACHED)"
        side_effects: ["attempt_count += 1"]
        note: "Cyclic self-loop — the revisit pattern."
      - from: IN_PROGRESS
        to: REFUSED
        trigger: "POST /cases/{id}/attempts (disposition=REFUSED)"
        actor: Enumerator
        preconditions: ["Acting enumerator == Case.assigned_enumerator_id (ERR_NOT_ASSIGNED_ENUMERATOR)"]
        side_effects:
          - "attempt_count += 1"
          - "area in_progress_case_count -= 1; area refused_case_count += 1"
          - "active CaseAssignment -> RELEASED"
          - "recompute projected/final coverage"
      - from: IN_PROGRESS
        to: VACANT
        trigger: "POST /cases/{id}/attempts (disposition=VACANT)"
        actor: Enumerator
        preconditions: ["Acting enumerator == Case.assigned_enumerator_id (ERR_NOT_ASSIGNED_ENUMERATOR)"]
        side_effects:
          - "attempt_count += 1"
          - "area in_progress_case_count -= 1; area vacant_case_count += 1"
          - "active CaseAssignment -> RELEASED"
          - "recompute projected/final coverage"
      - from: IN_PROGRESS
        to: MAX_ATTEMPTS
        trigger: "system (when attempt_count reaches project.max_attempts on a non-CONTACT_MADE attempt and the case is not otherwise closed)"
        actor: system
        preconditions: ["attempt_count == project.max_attempts after increment"]
        side_effects:
          - "area in_progress_case_count -= 1; area max_attempts_case_count += 1"
          - "active CaseAssignment -> RELEASED"
          - "recompute projected/final coverage"
        note: "Boundary auto-close at the max_attempts threshold."
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /cases/{id}/responses"
        actor: Enumerator
        preconditions:
          - "Acting enumerator == Case.assigned_enumerator_id (ERR_NOT_ASSIGNED_ENUMERATOR)"
          - "Parent area IN_FIELD, not FROZEN (ERR_AREA_FROZEN)"
          - "At least one LOGGED attempt on the case has disposition CONTACT_MADE (ERR_NO_CONTACT_MADE)"
        side_effects:
          - "Create Response(status=CAPTURED); compute fraud_score, needs_reinterview"
          - "area in_progress_case_count -= 1; area complete_case_count += 1"
          - "recompute projected/final coverage"
          - "if area now has pending_case_count + in_progress_case_count == 0: area IN_FIELD -> COMPLETE (bubble-up)"
      - from: COMPLETE
        to: IN_PROGRESS
        trigger: "system (reinterview FRAUD finalize invalidates the Response)"
        actor: system
        preconditions: ["The case's Response transitioned to INVALIDATED"]
        side_effects:
          - "area complete_case_count -= 1; area in_progress_case_count += 1"
          - "recompute projected/final coverage"
          - "if area was COMPLETE: area COMPLETE -> IN_FIELD"
        note: "Reopen leg of the fraud cascade; the cycle edge."

  - entity: CaseAssignment
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, RELEASED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a newer CaseAssignment is created on the same case)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RELEASED
        trigger: "system (case reaches REFUSED/VACANT/MAX_ATTEMPTS, or enumerator suspended)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Attempt
    initial_state: LOGGED
    terminal_states: [CANCELLED]
    transitions:
      - from: LOGGED
        to: CANCELLED
        trigger: "POST /attempts/{id}/cancel"
        actor: FieldSupervisor
        preconditions: ["Attempt in LOGGED (ERR_ATTEMPT_NOT_CANCELLABLE)"]
        side_effects:
          - "case.attempt_count -= 1"
          - "area.budget_committed_cents -= attempt.pay_committed_cents (compensating; budget_remaining recomputed)"
          - "acting enumerator.reversed_pay_cents unaffected (pay lines are a separate ledger)"

  - entity: Response
    initial_state: CAPTURED
    terminal_states: [ACCEPTED, INVALIDATED]
    transitions:
      - from: CAPTURED
        to: ACCEPTED
        trigger: "system (reinterview finalize CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CAPTURED
        to: INVALIDATED
        trigger: "system (reinterview finalize FRAUD)"
        actor: system
        preconditions: []
        side_effects:
          - "Parent Case COMPLETE -> IN_PROGRESS (reopen cascade)"
          - "capturing enumerator.fraud_flag = true"

  - entity: ReinterviewCase
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISCREPANT, FRAUD]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /reinterviews/{id}/start"
        actor: QCReviewer
        preconditions: ["Reinterview in OPEN (ERR_REINTERVIEW_INVALID_STATE)"]
        side_effects: []
      - from: IN_REVIEW
        to: CONFIRMED
        trigger: "POST /reinterviews/{id}/finalize (outcome=CONFIRMED)"
        actor: QCReviewer
        preconditions: ["Reinterview in IN_REVIEW (ERR_REINTERVIEW_INVALID_STATE)"]
        side_effects: ["Response CAPTURED -> ACCEPTED"]
        note: "Branch A — benign confirmation."
      - from: IN_REVIEW
        to: DISCREPANT
        trigger: "POST /reinterviews/{id}/finalize (outcome=DISCREPANT)"
        actor: QCReviewer
        preconditions: ["Reinterview in IN_REVIEW (ERR_REINTERVIEW_INVALID_STATE)"]
        side_effects: []
        note: "Branch B — discrepancy noted, Response remains CAPTURED, no cascade."
      - from: IN_REVIEW
        to: FRAUD
        trigger: "POST /reinterviews/{id}/finalize (outcome=FRAUD)"
        actor: QCReviewer
        preconditions: ["Reinterview in IN_REVIEW (ERR_REINTERVIEW_INVALID_STATE)"]
        side_effects:
          - "Response CAPTURED -> INVALIDATED (link 1)"
          - "which reopens parent Case COMPLETE -> IN_PROGRESS (link 2)"
          - "which recomputes AssignmentArea counts + coverage and reverts COMPLETE -> IN_FIELD (link 3)"
          - "capturing enumerator.fraud_flag = true (fan-out)"
        note: "Branch C — fraud; drives the depth-3 cascade."

  - entity: PayPeriod
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /pay-periods/{id}/lock"
        actor: SurveyAdmin
        preconditions: ["Period in OPEN (ERR_PAY_PERIOD_INVALID_STATE)"]
        side_effects: ["compute final_total_cents including per-enumerator overtime premiums"]
      - from: LOCKED
        to: PAID
        trigger: "POST /pay-periods/{id}/pay"
        actor: SurveyAdmin
        preconditions: ["Period in LOCKED (ERR_PAY_PERIOD_INVALID_STATE)"]
        side_effects: []

  - entity: PayLine
    initial_state: ACCRUED
    terminal_states: [REVERSED]
    transitions:
      - from: ACCRUED
        to: REVERSED
        trigger: "POST /pay-lines/{id}/reverse"
        actor: SurveyAdmin
        preconditions:
          - "PayLine in ACCRUED (ERR_PAY_LINE_ALREADY_REVERSED)"
          - "Parent PayPeriod in OPEN (ERR_PAY_PERIOD_INVALID_STATE)"
        side_effects:
          - "period.provisional_total_cents -= amount_cents"
          - "enumerator.reversed_pay_cents += amount_cents; enumerator.net_pay_cents recomputed"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: assignment-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /cases/{id}/assignments"
    occ_field: "expected_case_version"
    description: |
      Creating a CaseAssignment against a Case whose version has advanced since
      the client last observed it is rejected. A newer assignment legitimately
      supersedes the prior one, so a client acting on a stale view of the case
      (its version already bumped by an earlier assignment or attempt) is
      rejected on the stale-version check rather than silently clobbering the
      current assignment.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: attempt_pay_commit
    trigger: "POST /cases/{id}/attempts (on LOGGED attempt creation)"
    algorithm: aggregation
    formula: |
      attempt_minutes = floor((window_end - window_start) total_seconds / 60)   # whole minutes
      stipend_cents   = round_half_up(enumerator.hourly_rate_cents * attempt_minutes / 60)
      if mode == IN_PERSON:
        mileage_cents = round_half_up(mileage_miles * project.mileage_rate_cents_per_mile)
      else:
        mileage_cents = 0                                   # phone attempts reimburse no mileage
      # ROUNDING ORDER IS PINNED: round each component to whole cents INDEPENDENTLY,
      # THEN sum. Do NOT sum fractional stipend + fractional mileage and round once.
      pay_committed_cents = stipend_cents + mileage_cents
      # side effect: area.budget_committed_cents += pay_committed_cents
    input_set: "The single attempt being created; enumerator.hourly_rate_cents and project.mileage_rate_cents_per_mile as of request time."
    constants: {}
    precision: "whole cents, round_half_up, applied per component before summation"

  - name: response_fraud_score
    trigger: "POST /cases/{id}/responses (on Response capture)"
    algorithm: weighted_scoring
    formula: |
      base            = FLAG_WEIGHT * flagged_answer_count
      if mode == IN_PERSON:
        gps_component = max(0, ceil((gps_variance_meters - GPS_TOLERANCE_M) / 10)) * GPS_STEP
      else:
        gps_component = 0                                   # phone captures have no GPS geometry
      duration_penalty = SHORT_DURATION_PENALTY if duration_minutes < DURATION_FLOOR_MIN else 0
      raw              = base + gps_component + duration_penalty
      fraud_score      = min(100, max(0, raw))              # clamped to [0,100]
      needs_reinterview = (fraud_score >= project.fraud_score_threshold)
    input_set: "The single response being captured; four inputs interact non-linearly (flag count, gps variance with a mode branch, duration floor, and the 0/100 clamp)."
    constants:
      FLAG_WEIGHT: 12
      GPS_TOLERANCE_M: 50
      GPS_STEP: 5
      DURATION_FLOOR_MIN: 8
      SHORT_DURATION_PENALTY: 25
    precision: "integer points"

  - name: area_coverage
    trigger: "any Case status change that mutates an area count (assign first-attempt, response, refuse, vacant, max-attempts, fraud reopen)"
    algorithm: aggregation
    formula: |
      if total_case_count == 0:
        projected_coverage_rate = 0
        final_coverage_rate     = 0
      else:
        projected_coverage_rate = round_half_up((complete_case_count + in_progress_case_count) / total_case_count, 4)
        final_coverage_rate     = round_half_up(complete_case_count / total_case_count, 4)
    input_set: "Cases in the area partitioned by status. Projected counts IN_PROGRESS as expected-complete; final counts only COMPLETE."
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: projected
        when: "operational dashboards mid-field"
        difference: "numerator includes in_progress_case_count (optimistic completion)"
      - name: final
        when: "coverage sign-off / official completion reporting"
        difference: "numerator is complete_case_count only"

  - name: pay_period_total
    trigger: "provisional: every PayLine create/reverse while OPEN. final: POST /pay-periods/{id}/lock"
    algorithm: tiered_pricing
    formula: |
      # provisional (while OPEN): raw ledger sum
      provisional_total_cents = sum(amount_cents for pl in period.pay_lines if pl.status == ACCRUED)
      # final (at LOCK): provisional plus per-enumerator overtime premium on STIPEND excess
      premium_total = 0
      for each enumerator e with >=1 ACCRUED line in this period:
        S = sum(pl.amount_cents for pl in period.pay_lines if pl.enumerator_id == e and pl.line_type == STIPEND and pl.status == ACCRUED)
        if S > period.overtime_threshold_cents:
          premium_total += round_half_up(OT_PREMIUM_RATE * (S - period.overtime_threshold_cents))
      final_total_cents = provisional_total_cents + premium_total
    input_set: "Non-reversed PayLines in the period. Only STIPEND lines feed the overtime excess; BONUS/MILEAGE do not."
    constants:
      OT_PREMIUM_RATE: 0.5
    precision: "whole cents, round_half_up on each enumerator's premium before summation"
    variants:
      - name: provisional
        when: "period OPEN"
        difference: "raw ledger sum, no overtime"
      - name: final
        when: "period LOCKED"
        difference: "adds overtime premium on STIPEND totals above overtime_threshold_cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys exist (enumerator_id on assignment, reviewer_enumerator_id, enumerator_id on pay-line)"
    error_id: ERR_ENUMERATOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /cases/{id}/assignments, POST /responses/{id}/reinterviews, POST /pay-periods/{id}/pay-lines"

  - priority: 5
    category: business_constraint
    check: "Input field types / enum membership / window_end > window_start / language codes valid"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all create/mutation endpoints"

  - priority: 6
    category: business_constraint
    check: "default_language is in supported_languages; respondent_language is in project.supported_languages; language_used is a valid code"
    error_id: ERR_UNSUPPORTED_LANGUAGE
    http_status: 400
    applies_to: "POST /survey-projects, POST /assignment-areas/{id}/cases"

  - priority: 7
    category: concurrency
    check: "expected_case_version equals Case.version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /cases/{id}/assignments"

  - priority: 8
    category: state
    check: "Target resource is in a legal source state for this transition (project/area/case/enumerator/reinterview/pay-period). For attempts and responses the parent area MUST be IN_FIELD and not FROZEN."
    error_id: "ERR_{RESOURCE}_INVALID_STATE / ERR_AREA_FROZEN / ERR_AREA_NOT_IN_FIELD"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_safety
    check: "Acting Enumerator (X-User-ID) equals Case.assigned_enumerator_id"
    error_id: ERR_NOT_ASSIGNED_ENUMERATOR
    http_status: 403
    applies_to: "POST /cases/{id}/attempts, POST /cases/{id}/responses"

  - priority: 10
    category: state
    check: "Target Enumerator for an assignment is ACTIVE"
    error_id: ERR_ENUMERATOR_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /cases/{id}/assignments"

  - priority: 11
    category: state
    check: "Attempt boundary: if the case is already MAX_ATTEMPTS, or attempt_count >= project.max_attempts, reject. This case-state check is evaluated before the generic legal-source-state check for the attempt endpoint (and note assigned_enumerator_id is retained through MAX_ATTEMPTS close, so the ownership check at priority 9 still passes for the assigned enumerator)."
    error_id: ERR_MAX_ATTEMPTS_REACHED
    http_status: 409
    applies_to: "POST /cases/{id}/attempts"

  - priority: 12
    category: business_temporal
    check: "New attempt window does not overlap any other LOGGED attempt by the same enumerator (half-open [start,end); adjacency end==start allowed; no buffer)"
    error_id: ERR_ENUMERATOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /cases/{id}/attempts"

  - priority: 13
    category: business_temporal
    check: "New attempt window, expanded by REST_BUFFER_MINUTES=240 on each side (closed interval), does not overlap any other LOGGED attempt on the same case. Two attempts collide when the gap between the earlier window_end and the later window_start is < 240 minutes."
    error_id: ERR_CASE_CONTACT_COOLDOWN
    http_status: 409
    applies_to: "POST /cases/{id}/attempts"

  - priority: 14
    category: business_referential
    check: "language_used is a member of the capturing enumerator's languages"
    error_id: ERR_LANGUAGE_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /cases/{id}/responses"

  - priority: 15
    category: business_constraint
    check: "Case has >=1 LOGGED attempt with disposition CONTACT_MADE"
    error_id: ERR_NO_CONTACT_MADE
    http_status: 409
    applies_to: "POST /cases/{id}/responses"

  - priority: 16
    category: business_referential
    check: "reviewer_enumerator_id references an Enumerator in ACTIVE status"
    error_id: ERR_REVIEWER_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /responses/{id}/reinterviews"

  - priority: 17
    category: business_safety
    check: "reviewer_enumerator_id differs from the response's capturing_enumerator_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /responses/{id}/reinterviews"

  - priority: 18
    category: business_fiscal
    check: "area.budget_remaining_cents >= attempt.pay_committed_cents"
    error_id: ERR_AREA_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /cases/{id}/attempts"

