    side_effects: []

  - method: GET
    path: "/society/practicum-placements"
    description: "List placements with optional filters."
    roles: [SocietyAdmin, ProgramDirector, Registrar, AccreditationReviewer]
    code: 200
    input: ["learner_id?", "host_school_id?", "supervisor_credential_id?", "status?", "limit?", "offset?"]
    output: "PracticumPlacement[]"
    side_effects: []

  - method: POST
    path: "/society/practicum-placements/{id}/log-hours"
    description: "Learner logs practicum hours (work_date must fall inside [start_date, end_date]). Auto-transitions ACTIVE -> HOURS_COMPLETE when hours_logged reaches target_hours."
