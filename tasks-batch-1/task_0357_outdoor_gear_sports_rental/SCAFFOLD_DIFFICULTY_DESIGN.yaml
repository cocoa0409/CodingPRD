              as: ShopAdmin
              captures: { gu_id: $.data.id, gu_v: $.data.version }
            - call: "POST /rental/customers"
              payload: { full_name: "Fay Lund", email: "fay@x.com", skill_level: "BEGINNER" }
              as: Renter
              captures: { cust_id: $.data.id }
            - call: "POST /rental/reservations"
              payload: { customer_id: "${cust_id}", gear_unit_id: "${gu_id}", pickup_at: "2026-05-08T08:00:00Z", due_at: "2026-05-08T10:00:00Z", expected_gear_unit_version: "${gu_v}" }
              as: Renter
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
