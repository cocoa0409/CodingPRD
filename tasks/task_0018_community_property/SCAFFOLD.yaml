scenario: |
  Community property management system: owner information with household registration, property ownership records, family-member binding, tenant registration, and move-in/move-out tracking; property repair work order with issue category classification, location tagging, photo upload, dispatch to maintenance staff, status tracking, completion confirmation, and satisfaction rating; property fee bill generation and collection with billing rules by area/fixed-amount, periodic bill issuance, late-fee calculation, payment-channel integration, payment reconciliation, and dunning workflow; public facility reservation with facility-type configuration (clubhouse/gym/meeting room), available-slot booking, cancellation rules, usage rules, and damage compensation; owners committee voting with proposal submission, eligible-voter list generation, voting period setting, multiple voting methods (per-household/per-area), result tallying, and result publication; parking space allocation with fixed/temporary/visitor classification, application and approval workflow, monthly fee billing, license-plate binding, and entry-exit record integration; event-driven synchronization with payment, access control, and IM systems; audit logging for fee changes and vote records.

domain_name: community-property-management
api_prefix: /communities

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - ops_run_checkpoint
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: building_no
        type: string
        source: input
        description: Building identifier within community.
        constraints: required, non-empty
      - name: unit_no
        type: string
        source: input
        description: Unit (room) identifier within building.
        constraints: required, unique with building_no
      - name: area_sqm
        type: number
        source: input
        description: Floor area in square meters; drives area-based billing.
        constraints: > 0, two decimal places
      - name: occupancy_status
        type: enum
        source: computed
        description: Current occupancy, derived from active OwnerBinding/TenantBinding.
        constraints: VACANT | OWNER_OCCUPIED | TENANT_OCCUPIED
        default: VACANT
      - name: owner_id
        type: string
        source: input
        description: Foreign key to Owner; the registered legal owner.
        constraints: must reference existing Owner
      - name: parking_quota
        type: integer
        source: input
        description: Maximum FIXED parking allocations this property may hold simultaneously.
        constraints: >= 0
        default: 1

  - name: Owner
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name of the owner.
        constraints: required
      - name: id_card_no
        type: string
        source: input
        description: Government ID; unique across community.
        constraints: required, unique
      - name: household_register_no
        type: string
        source: input
        description: Hukou/household registration number used for voting eligibility.
        constraints: required
      - name: phone
        type: string
        source: input
        description: Primary contact for IM/notifications.
        constraints: required
      - name: voting_status
        type: enum
        source: computed
        description: Whether this owner is eligible to vote in proposals at the moment.
        constraints: ELIGIBLE | INELIGIBLE_DELINQUENT | INELIGIBLE_NO_PROPERTY
        default: ELIGIBLE

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: The Property this resident is bound to.
        constraints: must reference existing Property
      - name: full_name
        type: string
        source: input
        description: Resident name.
      - name: id_card_no
        type: string
        source: input
        description: Government ID; unique within property+kind.
      - name: relation_kind
        type: enum
        source: input
        description: Whether bound as family of owner or as tenant.
        constraints: FAMILY | TENANT
      - name: phone
        type: string
        source: input
        description: Contact phone.
      - name: lifecycle_status
        type: enum
        source: system
        description: Move-in/out lifecycle.
        constraints: PENDING_MOVE_IN | RESIDING | MOVED_OUT
        default: PENDING_MOVE_IN
      - name: move_in_at
        type: datetime
        source: system
        description: Set on transition to RESIDING.
      - name: move_out_at
        type: datetime
        source: system
        description: Set on transition to MOVED_OUT.
      - name: lease_end_at
        type: datetime
        source: input
        description: Required for TENANT; not used for FAMILY.

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: Property where the issue is reported.
      - name: reporter_owner_id
        type: string
        source: input
        description: Owner who filed the work order.
      - name: category
        type: enum
        source: input
        description: Issue category.
        constraints: PLUMBING | ELECTRICAL | STRUCTURAL | LANDSCAPING | SECURITY | OTHER
      - name: location_tag
        type: string
        source: input
        description: Free-form physical location, e.g. "kitchen sink".
      - name: photo_urls
        type: array
        source: input
        description: List of uploaded photo URLs.
        default: []
      - name: status
        type: enum
        source: system
        description: Lifecycle status.
        constraints: SUBMITTED | DISPATCHED | IN_PROGRESS | RESOLVED | CONFIRMED | REJECTED | CANCELLED
        default: SUBMITTED
      - name: assigned_staff_id
        type: string
        source: system
        description: Maintenance staff opaque user id; set on DISPATCHED.
      - name: resolved_at
        type: datetime
        source: system
        description: Set on transition to RESOLVED.
      - name: confirm_deadline_at
        type: datetime
        source: computed
        description: resolved_at + 72h; auto-confirm if reporter does not act.
      - name: satisfaction_score
        type: integer
        source: input
        description: 1-5 rating, only on owner CONFIRMED transition.
        constraints: 1 <= x <= 5

  - name: FeeBillingRule
    parent: null
    common_fields: true
    fields:
      - name: rule_code
        type: string
        source: input
        description: Stable code, unique across active rules.
        constraints: unique
      - name: kind
        type: enum
        source: input
        description: Pricing scheme.
        constraints: PER_SQM_MONTHLY | FIXED_AMOUNT_MONTHLY
      - name: rate
        type: number
        source: input
        description: Yuan/sqm/month for PER_SQM_MONTHLY; total yuan/month for FIXED_AMOUNT_MONTHLY.
        constraints: >= 0, four decimal places allowed
      - name: late_fee_daily_rate
        type: number
        source: input
        description: Daily late-fee rate as fraction of principal (e.g. 0.0005).
        constraints: 0 <= x <= 0.01
        default: 0.0005
      - name: late_fee_cap_pct
        type: number
        source: input
        description: Late fees never exceed this fraction of the principal.
        constraints: 0 <= x <= 1
        default: 0.30
      - name: rule_status
        type: enum
        source: system
        description: ACTIVE rules generate bills; ARCHIVED rules do not.
        constraints: ACTIVE | ARCHIVED
        default: ACTIVE

  - name: FeeBill
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: Owning property.
      - name: rule_id
        type: string
        source: input
        description: FeeBillingRule snapshot id used for this bill.
      - name: period_year
        type: integer
        source: input
        description: Billing period year.
      - name: period_month
        type: integer
        source: input
        description: Billing period month (1-12).
      - name: principal_amount
        type: number
        source: computed
        description: Computed via fee_principal calc; pinned at issuance.
      - name: late_fee_amount
        type: number
        source: computed
        description: Recomputed via fee_late_charge each clock advance until paid.
        default: 0
      - name: total_due
        type: number
        source: computed
        description: principal_amount + late_fee_amount, recomputed on each read while OPEN/OVERDUE.
      - name: due_date
        type: datetime
        source: system
        description: Last day of issuance month + 14 days grace.
      - name: status
        type: enum
        source: system
        description: Billing lifecycle.
        constraints: OPEN | OVERDUE | PARTIALLY_PAID | PAID | WAIVED
        default: OPEN
      - name: paid_amount
        type: number
        source: system
        description: Sum of reconciled payments for this bill.
        default: 0
      - name: dunning_stage
        type: enum
        source: system
        description: Dunning escalation level.
        constraints: NONE | REMINDED | ESCALATED | LEGAL_NOTICE
        default: NONE

  - name: PaymentRecord
    parent: null
    common_fields: false
    fields:
      - name: bill_id
        type: string
        source: input
        description: FK to FeeBill being paid.
      - name: channel
        type: enum
        source: input
        description: Payment channel.
        constraints: WECHAT | ALIPAY | BANK_TRANSFER | CASH
      - name: external_txn_id
        type: string
        source: input
        description: Idempotency key from payment gateway; unique per channel.
      - name: amount
        type: number
        source: input
        description: Paid amount in yuan.
        constraints: > 0
      - name: paid_at
        type: datetime
        source: input
        description: Timestamp from payment provider.
      - name: reconciliation_status
        type: enum
        source: system
        description: Reconciliation lifecycle.
        constraints: PENDING | RECONCILED | DISPUTED
        default: PENDING

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - name: facility_type
        type: enum
        source: input
        description: Type controls slot length and rules.
        constraints: CLUBHOUSE | GYM | MEETING_ROOM
      - name: name
        type: string
        source: input
        description: Display name; unique within community.
        constraints: unique
      - name: slot_minutes
        type: integer
        source: input
        description: Length of one bookable slot (e.g. 60 for GYM, 120 for CLUBHOUSE).
        constraints: 30 | 60 | 120 | 180 | 240
      - name: capacity_per_slot
        type: integer
        source: input
        description: Maximum simultaneous reservations per slot.
        constraints: >= 1
        default: 1
      - name: cancellation_window_hours
        type: integer
        source: input
        description: Free-cancellation cutoff before slot start.
        default: 24
      - name: damage_deposit
        type: number
        source: input
        description: Deposit collected at booking, refunded on clean closure.
        default: 0

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: Facility being booked.
      - name: owner_id
        type: string
        source: input
        description: Owner making the reservation.
      - name: slot_start_at
        type: datetime
        source: input
        description: Inclusive slot start (UTC).
      - name: slot_end_at
        type: datetime
        source: input
        description: Exclusive slot end (UTC); must equal slot_start_at + facility.slot_minutes.
      - name: status
        type: enum
        source: system
        description: Lifecycle.
        constraints: BOOKED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW | DAMAGED
        default: BOOKED
      - name: deposit_held
        type: number
        source: system
        description: Amount currently held; reduced or forfeited on closure.
        default: 0
      - name: damage_amount
        type: number
        source: input
        description: Set when staff records damage on closure.
        default: 0
      - name: cancellation_at
        type: datetime
        source: system
        description: Timestamp of cancellation event.

  - name: Proposal
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Proposal title.
        constraints: required
      - name: voting_method
        type: enum
        source: input
        description: How votes are weighted.
        constraints: PER_HOUSEHOLD | PER_AREA
      - name: pass_threshold_pct
        type: number
        source: input
        description: Required YES weight fraction of TOTAL eligible weight to pass (not of cast votes).
        constraints: 0.5 <= x <= 1.0
        default: 0.6667
      - name: voting_starts_at
        type: datetime
        source: input
        description: Inclusive open instant.
      - name: voting_ends_at
        type: datetime
        source: input
        description: Exclusive close instant.
      - name: status
        type: enum
        source: system
        description: Proposal lifecycle.
        constraints: DRAFT | OPEN | TALLIED_PASSED | TALLIED_FAILED | PUBLISHED | CANCELLED
        default: DRAFT
      - name: eligible_weight_total
        type: number
        source: computed
        description: Frozen at OPEN — sum of weights for the eligible voter list (households or area).
      - name: yes_weight
        type: number
        source: computed
        description: Sum of YES weights at tally time.
        default: 0
      - name: no_weight
        type: number
        source: computed
        description: Sum of NO weights at tally time.
        default: 0
      - name: published_at
        type: datetime
        source: system
        description: Set when result is PUBLISHED.

  - name: Vote
    parent: null
    common_fields: false
    fields:
      - name: proposal_id
        type: string
        source: input
        description: Proposal voted on.
      - name: voter_owner_id
        type: string
        source: input
        description: Owner casting the vote.
      - name: property_id
        type: string
        source: input
        description: Property the voter represents (one vote per (proposal, property)).
      - name: choice
        type: enum
        source: input
        description: Owner's choice.
        constraints: YES | NO | ABSTAIN
      - name: weight
        type: number
        source: computed
        description: 1.0 if PER_HOUSEHOLD; property.area_sqm if PER_AREA. Frozen at cast time.

  - name: ParkingSpace
    parent: null
    common_fields: true
    fields:
      - name: space_no
        type: string
        source: input
        description: Physical space label (e.g. "B2-077"); unique within community.
        constraints: unique
      - name: kind
        type: enum
        source: input
        description: Allocation classification.
        constraints: FIXED | TEMPORARY | VISITOR
      - name: monthly_fee
        type: number
        source: input
        description: Base monthly fee (FIXED only); 0 for TEMPORARY/VISITOR.
        default: 0
      - name: status
        type: enum
        source: system
        description: Lifecycle.
        constraints: AVAILABLE | RESERVED | ALLOCATED | UNAVAILABLE
        default: AVAILABLE

  - name: ParkingApplication
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: Applicant owner.
      - name: property_id
        type: string
        source: input
        description: Owner's property the slot is bound to.
      - name: requested_kind
        type: enum
        source: input
        description: Requested classification.
        constraints: FIXED | TEMPORARY | VISITOR
      - name: license_plate
        type: string
        source: input
        description: Vehicle plate; bound to the allocation upon approval.
      - name: status
        type: enum
        source: system
        description: Application lifecycle.
        constraints: PENDING | APPROVED | REJECTED | TERMINATED
        default: PENDING
      - name: allocated_space_id
        type: string
        source: system
        description: Set on APPROVED.
      - name: started_at
        type: datetime
        source: system
        description: Allocation start (used for first prorated billing).

  - name: AccessLog
    parent: null
    common_fields: false
    fields:
      - name: license_plate
        type: string
        source: input
        description: Plate captured at gate.
      - name: direction
        type: enum
        source: input
        description: ENTRY or EXIT.
        constraints: ENTRY | EXIT
      - name: occurred_at
        type: datetime
        source: input
        description: Timestamp from access-control system.
      - name: parking_space_id
        type: string
        source: computed
        description: Resolved by license-plate→ParkingApplication binding at occurred_at; null if unmatched.
      - name: classification
        type: enum
        source: computed
        description: How the gate event was classified.
        constraints: BOUND | VISITOR_OK | UNAUTHORIZED

  - name: AuditEntry
    parent: null
    common_fields: false
    fields:
      - name: subject_kind
        type: enum
        source: system
        description: What kind of object the entry describes.
        constraints: FEE_BILL | FEE_BILLING_RULE | PROPOSAL | VOTE
      - name: subject_id
        type: string
        source: system
        description: Id of the audited object.
      - name: action
        type: string
        source: system
        description: e.g. "RATE_CHANGED", "VOTE_CAST", "BILL_WAIVED".
      - name: actor_role
        type: string
        source: system
        description: Acting role at the time of the action.
      - name: actor_id
        type: string
        source: system
        description: X-User-ID at the time.
      - name: before
        type: object
        source: system
        description: Pre-mutation snapshot (relevant fields only).
      - name: after
        type: object
        source: system
        description: Post-mutation snapshot.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Resident
    initial_state: PENDING_MOVE_IN
    terminal_states: [MOVED_OUT]
    transitions:
      - from: PENDING_MOVE_IN
        to: RESIDING
        trigger: "POST /residents/{id}/move-in"
        actor: PropertyManager
        preconditions:
          - "Resident.lifecycle_status == PENDING_MOVE_IN"
          - "Property.occupancy_status not blocking — see validations"
          - "If relation_kind == TENANT, lease_end_at > now()"
        side_effects:
          - "Set Resident.move_in_at = now()"
          - "Recompute Property.occupancy_status (cascade): if any RESIDING tenant → TENANT_OCCUPIED; else if any RESIDING family or owner present → OWNER_OCCUPIED; else VACANT"
      - from: RESIDING
        to: MOVED_OUT
        trigger: "POST /residents/{id}/move-out"
        actor: PropertyManager
        preconditions:
          - "Resident.lifecycle_status == RESIDING"
        side_effects:
          - "Set Resident.move_out_at = now()"
          - "Recompute Property.occupancy_status"
          - "If TENANT and was sole RESIDING resident: reset Owner.voting_status to ELIGIBLE if previously INELIGIBLE_NO_PROPERTY logic re-evaluates"

  - entity: WorkOrder
    initial_state: SUBMITTED
    terminal_states: [CONFIRMED, REJECTED, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: DISPATCHED
        trigger: "POST /work-orders/{id}/dispatch"
        actor: PropertyManager
        preconditions:
          - "WorkOrder.status == SUBMITTED"
          - "assigned_staff_id provided in body"
        side_effects:
          - "Set assigned_staff_id"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Owner
        preconditions:
          - "WorkOrder.status == SUBMITTED"
          - "Owner.id == reporter_owner_id"
        side_effects: []
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: MaintenanceStaff
        preconditions:
          - "WorkOrder.status == DISPATCHED"
          - "X-User-ID == assigned_staff_id"
        side_effects: []
      - from: DISPATCHED
        to: REJECTED
        trigger: "POST /work-orders/{id}/reject"
        actor: MaintenanceStaff
        preconditions:
          - "WorkOrder.status == DISPATCHED"
          - "X-User-ID == assigned_staff_id"
          - "rejection_reason provided"
        side_effects: []
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "POST /work-orders/{id}/resolve"
        actor: MaintenanceStaff
        preconditions:
          - "WorkOrder.status == IN_PROGRESS"
        side_effects:
          - "Set resolved_at = now(); confirm_deadline_at = resolved_at + 72h"
      - from: RESOLVED
        to: CONFIRMED
        trigger: "POST /work-orders/{id}/confirm"
        actor: Owner
        preconditions:
          - "WorkOrder.status == RESOLVED"
          - "Owner.id == reporter_owner_id"
          - "satisfaction_score 1..5 in body"
        side_effects:
          - "Set satisfaction_score"
      - from: RESOLVED
        to: SUBMITTED
        trigger: "POST /work-orders/{id}/reopen"
        actor: Owner
        preconditions:
          - "WorkOrder.status == RESOLVED"
          - "Owner.id == reporter_owner_id"
          - "now() < confirm_deadline_at"
        side_effects:
          - "Clear assigned_staff_id, resolved_at, confirm_deadline_at"
          - "Increment WorkOrder.version (revision cycle)"
      - from: RESOLVED
        to: CONFIRMED
        trigger: "Auto on POST /_clock/advance when now() >= confirm_deadline_at"
        actor: system
        preconditions:
          - "WorkOrder.status == RESOLVED"
          - "now() >= confirm_deadline_at"
        side_effects:
          - "Set satisfaction_score = 5 (auto-confirm baseline)"
          - "Set status = CONFIRMED"

  - entity: FeeBill
    initial_state: OPEN
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: OPEN
        to: OVERDUE
        trigger: "Auto on POST /_clock/advance when now() > due_date AND paid_amount < total_due"
        actor: system
        preconditions:
          - "FeeBill.status == OPEN"
          - "now() > due_date"
        side_effects:
          - "Trigger fee_late_charge calc — recompute late_fee_amount and total_due"
          - "Set dunning_stage = REMINDED if NONE"
          - "Recompute Owner.voting_status: if any FeeBill for owner's property in OVERDUE → INELIGIBLE_DELINQUENT"
      - from: OPEN
        to: PARTIALLY_PAID
        trigger: "POST /payments (reconciled) when 0 < paid_amount < total_due AND now() <= due_date"
        actor: system
        preconditions:
          - "FeeBill.status == OPEN"
          - "0 < paid_amount < total_due"
        side_effects: []
      - from: OVERDUE
        to: PARTIALLY_PAID
        trigger: "POST /payments (reconciled) when 0 < paid_amount < total_due"
        actor: system
        preconditions:
          - "FeeBill.status == OVERDUE"
          - "0 < paid_amount < total_due"
        side_effects:
          - "Recompute late_fee_amount (frozen at first reconciliation timestamp inside the period? — see calc fee_late_charge)"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /payments (reconciled) when paid_amount >= total_due"
        actor: system
        preconditions:
          - "paid_amount >= total_due"
        side_effects:
          - "Freeze late_fee_amount at current value"
          - "Recompute Owner.voting_status (delinquency may clear)"
          - "Recompute dunning_stage = NONE"
      - from: OPEN
        to: PAID
        trigger: "POST /payments (reconciled) when paid_amount >= total_due"
        actor: system
        preconditions:
          - "FeeBill.status == OPEN"
        side_effects:
          - "Recompute Owner.voting_status (no-op if already ELIGIBLE)"
      - from: OVERDUE
        to: PAID
        trigger: "POST /payments (reconciled) when paid_amount >= total_due"
        actor: system
        preconditions: []
        side_effects:
          - "Freeze late_fee_amount; clear dunning_stage to NONE"
          - "Recompute Owner.voting_status — may clear delinquency"
      - from: OVERDUE
        to: OVERDUE
        trigger: "Auto on POST /_clock/advance — dunning escalation"
        actor: system
        preconditions:
          - "FeeBill.status == OVERDUE"
          - "now() > due_date + 30d AND dunning_stage == REMINDED"
        side_effects:
          - "dunning_stage = ESCALATED"
        note: "Self-loop captures dunning advance without state change"
      - from: OVERDUE
        to: OVERDUE
        trigger: "Auto on POST /_clock/advance — dunning escalation level 3"
        actor: system
        preconditions:
          - "FeeBill.status == OVERDUE"
          - "now() > due_date + 60d AND dunning_stage == ESCALATED"
        side_effects:
          - "dunning_stage = LEGAL_NOTICE"
      - from: OPEN
        to: WAIVED
        trigger: "POST /fee-bills/{id}/waive"
        actor: PropertyManager
        preconditions:
          - "FeeBill.status IN {OPEN, OVERDUE, PARTIALLY_PAID}"
          - "reason provided in body"
        side_effects:
          - "Append AuditEntry(subject_kind=FEE_BILL, action=BILL_WAIVED)"
          - "Recompute Owner.voting_status"
      - from: OVERDUE
        to: WAIVED
        trigger: "POST /fee-bills/{id}/waive"
        actor: PropertyManager
        preconditions: []
        side_effects:
          - "Append AuditEntry"
          - "Recompute Owner.voting_status"

  - entity: Reservation
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW, DAMAGED]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /reservations/{id}/check-in"
        actor: Owner
        preconditions:
          - "Reservation.status == BOOKED"
          - "Owner.id == reservation.owner_id"
          - "slot_start_at <= now() < slot_end_at"
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Owner
        preconditions:
          - "Reservation.status == BOOKED"
          - "Owner.id == reservation.owner_id"
        side_effects:
          - "If now() <= slot_start_at - facility.cancellation_window_hours: refund full deposit_held; else forfeit 50% (set deposit_held = round(deposit_held*0.5, 2))"
          - "Set cancellation_at = now()"
      - from: BOOKED
        to: NO_SHOW
        trigger: "Auto on POST /_clock/advance when now() >= slot_end_at AND status == BOOKED"
        actor: system
        preconditions:
          - "now() >= slot_end_at"
        side_effects:
          - "Forfeit full deposit_held (set to 0 after marking forfeit)"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /reservations/{id}/close"
        actor: PropertyManager
        preconditions:
          - "Reservation.status == CHECKED_IN"
          - "now() >= slot_end_at"
          - "damage_amount == 0 in body"
        side_effects:
          - "Refund full deposit_held"
      - from: CHECKED_IN
        to: DAMAGED
        trigger: "POST /reservations/{id}/close"
        actor: PropertyManager
        preconditions:
          - "Reservation.status == CHECKED_IN"
          - "now() >= slot_end_at"
          - "damage_amount > 0 in body"
        side_effects:
          - "Forfeit deposit up to damage_amount; if damage_amount > deposit_held, create FeeBill with kind=FIXED_AMOUNT_MONTHLY for the difference (principal_amount = damage_amount - deposit_held, due_date = now() + 14d)"

  - entity: Proposal
    initial_state: DRAFT
    terminal_states: [PUBLISHED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /proposals/{id}/open"
        actor: CommitteeChair
        preconditions:
          - "Proposal.status == DRAFT"
          - "voting_starts_at < voting_ends_at"
          - "now() < voting_ends_at"
        side_effects:
          - "Snapshot eligible voter list: all Owners whose voting_status == ELIGIBLE at this instant. Freeze eligible_weight_total."
          - "Append AuditEntry(subject_kind=PROPOSAL, action=PROPOSAL_OPENED)"
      - from: OPEN
        to: TALLIED_PASSED
        trigger: "POST /proposals/{id}/tally"
        actor: CommitteeChair
        preconditions:
          - "Proposal.status == OPEN"
          - "now() >= voting_ends_at"
          - "yes_weight / eligible_weight_total >= pass_threshold_pct"
        side_effects:
          - "Append AuditEntry(action=PROPOSAL_TALLIED_PASSED)"
      - from: OPEN
        to: TALLIED_FAILED
        trigger: "POST /proposals/{id}/tally"
        actor: CommitteeChair
        preconditions:
          - "Proposal.status == OPEN"
          - "now() >= voting_ends_at"
          - "yes_weight / eligible_weight_total < pass_threshold_pct"
        side_effects:
          - "Append AuditEntry(action=PROPOSAL_TALLIED_FAILED)"
      - from: TALLIED_PASSED
        to: PUBLISHED
        trigger: "POST /proposals/{id}/publish"
        actor: CommitteeChair
        preconditions:
          - "Proposal.status IN {TALLIED_PASSED, TALLIED_FAILED}"
        side_effects:
          - "Set published_at = now()"
          - "Append AuditEntry(action=PROPOSAL_PUBLISHED)"
      - from: TALLIED_FAILED
        to: PUBLISHED
        trigger: "POST /proposals/{id}/publish"
        actor: CommitteeChair
        preconditions: []
        side_effects:
          - "Set published_at = now()"
          - "Append AuditEntry(action=PROPOSAL_PUBLISHED)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /proposals/{id}/cancel"
        actor: CommitteeChair
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /proposals/{id}/cancel"
        actor: CommitteeChair
        preconditions:
          - "now() < voting_ends_at"
        side_effects:
          - "Append AuditEntry(action=PROPOSAL_CANCELLED)"

  - entity: ParkingApplication
    initial_state: PENDING
    terminal_states: [REJECTED, TERMINATED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /parking-applications/{id}/approve"
        actor: PropertyManager
        preconditions:
          - "ParkingApplication.status == PENDING"
          - "allocated_space_id provided AND ParkingSpace.status == AVAILABLE"
          - "ParkingSpace.kind == ParkingApplication.requested_kind"
          - "If requested_kind == FIXED: count of APPROVED ParkingApplications for this property is < Property.parking_quota"
          - "Owner.voting_status != INELIGIBLE_DELINQUENT (no fixed allocation if delinquent)"
        side_effects:
          - "Set allocated_space_id; set started_at = now()"
          - "ParkingSpace.status = ALLOCATED"
          - "If kind == FIXED: schedule first FeeBill with prorated principal for the remainder of current month (see fee_principal variant for parking)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /parking-applications/{id}/reject"
        actor: PropertyManager
        preconditions:
          - "ParkingApplication.status == PENDING"
          - "rejection_reason provided"
        side_effects: []
      - from: APPROVED
        to: TERMINATED
        trigger: "POST /parking-applications/{id}/terminate"
        actor: PropertyManager
        preconditions:
          - "ParkingApplication.status == APPROVED"
        side_effects:
          - "ParkingSpace.status = AVAILABLE"
          - "If outstanding parking FeeBill exists in OPEN/OVERDUE: keep it; do NOT auto-waive"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Two owners simultaneously book the same facility slot at full capacity"
    guarantee: "At most capacity_per_slot reservations admitted per (facility, slot_start_at). Excess is rejected."
    error_id: ERR_FACILITY_SLOT_FULL
    http_status: 409
    serialization: "First-writer-wins on Reservation creation per (facility_id, slot_start_at)"

  - scenario: "Two parking applications approved against the same ParkingSpace simultaneously"
    guarantee: "Exactly one approval succeeds; loser is rejected."
    error_id: ERR_PARKING_SPACE_TAKEN
    http_status: 409
    serialization: "First-writer-wins on ParkingSpace.status flip AVAILABLE→ALLOCATED"

  - scenario: "Two votes cast by the same owner for the same proposal simultaneously"
    guarantee: "Exactly one vote per (proposal_id, property_id). Duplicate is rejected."
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    serialization: "First-writer-wins on Vote insert per (proposal_id, property_id)"

  - scenario: "Two payments with the same external_txn_id submitted concurrently"
    guarantee: "Exactly one PaymentRecord persists; duplicate rejected (idempotency on external_txn_id within channel)."
    error_id: ERR_DUPLICATE_PAYMENT
    http_status: 409
    serialization: "First-writer-wins on (channel, external_txn_id)"

  - scenario: "Tally and cancel race after voting_ends_at on the same proposal"
    guarantee: "Once voting_ends_at has passed, only tally is admitted. Cancel is rejected."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Proposal.status; cancel requires now() < voting_ends_at"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fee_principal
    trigger: "Bill issuance via POST /fee-bills/issue OR auto on POST /_clock/advance for the next monthly period; pinned into FeeBill.principal_amount."
    algorithm: tiered_pricing
    formula: |
      if FeeBillingRule.kind == PER_SQM_MONTHLY:
        base = round(FeeBillingRule.rate * Property.area_sqm, 2)   # per-line rounding step
      elif FeeBillingRule.kind == FIXED_AMOUNT_MONTHLY:
        base = round(FeeBillingRule.rate, 2)
      # Discount tier (applied AFTER rounding base, BEFORE adding parking surcharge)
      if Owner has 12 consecutive months of PAID bills immediately preceding this period:
        discount_pct = 0.05
      else:
        discount_pct = 0.0
      principal = round(base * (1 - discount_pct), 2)
      # Note: rounding order — round base first, then apply discount, then round again.
      # "Sum-then-round" would yield different cents in edge cases; this scaffold pins per-line-rounding.
    input_set: "Active FeeBillingRule (rule_status == ACTIVE) + Property.area_sqm + last 12 FeeBill.status records for the same property"
    constants:
      DISCOUNT_PCT: 0.05
      DISCOUNT_LOOKBACK_MONTHS: 12
    precision: "2 decimal places, round_half_up; intermediate per-line rounding pinned"
    variants:
      - name: regular_property_fee
        when: "FeeBillingRule.kind in {PER_SQM_MONTHLY, FIXED_AMOUNT_MONTHLY} for property"
        difference: "Standard formula above."
      - name: parking_fixed_first_month_prorated
        when: "ParkingApplication APPROVED mid-month for FIXED parking"
        difference: |
          principal = round(ParkingSpace.monthly_fee * (days_remaining_in_month / days_in_month), 2)
          where days_remaining_in_month = days_in_month - day_of_month(started_at) + 1.
          Discount tier does NOT apply to parking fees.

  - name: fee_late_charge
    trigger: "Auto on POST /_clock/advance when FeeBill.status IN {OPEN, OVERDUE} AND now() > due_date; also on read of FeeBill while not yet PAID/WAIVED."
    algorithm: chronological
    formula: |
      days_overdue = max(0, floor((min(now(), payment_freeze_at) - due_date).total_days))
      raw_late = round(principal_amount * late_fee_daily_rate * days_overdue, 2)
      cap = round(principal_amount * late_fee_cap_pct, 2)
      late_fee_amount = min(raw_late, cap)
      total_due = round(principal_amount + late_fee_amount, 2)
      # payment_freeze_at: timestamp of the first reconciled payment that brings paid_amount >= total_due.
      # Until that moment, late_fee accrues against now(). After PAID/WAIVED, late_fee is frozen.
    input_set: "FeeBill (must be in OPEN or OVERDUE), FeeBillingRule snapshot at issuance, PaymentRecord history (for freeze timestamp)"
    constants:
      ROUNDING_MODE: round_half_up
    precision: "2 decimal places"
    variants:
      - name: accrual_until_now
        when: "FeeBill.status IN {OPEN, OVERDUE, PARTIALLY_PAID}"
        difference: "days_overdue uses now()."
      - name: frozen_at_payment
        when: "FeeBill.status IN {PAID, WAIVED}"
        difference: "days_overdue uses payment_freeze_at (timestamp of fully-reconciling payment) — late fee NEVER moves after PAID."

  - name: vote_tally
    trigger: "POST /proposals/{id}/tally"
    algorithm: aggregation
    formula: |
      # eligible_weight_total: frozen at OPEN transition.
      # For PER_HOUSEHOLD: each ELIGIBLE Owner's properties contribute weight = 1.0 PER PROPERTY they own.
      # For PER_AREA: each ELIGIBLE Owner's property contributes weight = property.area_sqm.
      # On Vote cast, Vote.weight is the per-property weight under the proposal's voting_method.
      yes_weight = sum(Vote.weight for v in proposal.votes where v.choice == YES)
      no_weight  = sum(Vote.weight for v in proposal.votes where v.choice == NO)
      # ABSTAIN votes count toward turnout but NOT toward yes/no totals.
      pass = (yes_weight / eligible_weight_total) >= pass_threshold_pct
      # Note: denominator is FROZEN eligible_weight_total, NOT (yes+no+abstain). A non-vote = NO effect on numerator.
    input_set: "All Vote rows for the proposal where Owner was on the eligible list at OPEN time"
    constants:
      PASS_DEFAULT: 0.6667
    precision: "Weights stored as numbers; ratio compared with strict >= using two decimal places after dividing"
    variants:
      - name: per_household
        when: "Proposal.voting_method == PER_HOUSEHOLD"
        difference: "Each property contributes weight = 1.0 regardless of area."
      - name: per_area
        when: "Proposal.voting_method == PER_AREA"
        difference: "Each property contributes weight = property.area_sqm; eligible_weight_total = sum of area_sqm over eligible properties."

  - name: reservation_deposit_settlement
    trigger: "Reservation closure transitions: BOOKED→CANCELLED, BOOKED→NO_SHOW, CHECKED_IN→COMPLETED, CHECKED_IN→DAMAGED."
    algorithm: waterfall_allocation
    formula: |
      # Outcome-based settlement of deposit_held (initially = facility.damage_deposit at booking)
      if transition is BOOKED→CANCELLED and now() <= slot_start_at - facility.cancellation_window_hours:
        refund = deposit_held; forfeit = 0
      elif transition is BOOKED→CANCELLED:
        refund = round(deposit_held * 0.5, 2); forfeit = round(deposit_held - refund, 2)
      elif transition is BOOKED→NO_SHOW:
        refund = 0; forfeit = deposit_held
      elif transition is CHECKED_IN→COMPLETED:
        refund = deposit_held; forfeit = 0
      elif transition is CHECKED_IN→DAMAGED:
        absorb = min(deposit_held, damage_amount)
        refund = round(deposit_held - absorb, 2)
        forfeit = absorb
        if damage_amount > deposit_held:
          spillover = round(damage_amount - deposit_held, 2)
          # spillover is billed via FeeBill (kind=FIXED_AMOUNT_MONTHLY, principal_amount=spillover)
        else:
          spillover = 0
      # Invariant (audited per Rule 9): deposit_held_initial == refund + forfeit  (spillover is a SEPARATE FeeBill)
    input_set: "Reservation, Facility, current clock"
    constants:
      LATE_CANCEL_FORFEIT_PCT: 0.5
    precision: "2 decimal places"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and parseable"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the declared roles in §1.7"
    error_id: ERR_AUTH_INVALID_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path parameters resolve to existing entities, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Body foreign-key fields (property_id, owner_id, facility_id, rule_id, bill_id, allocated_space_id) reference existing entities"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all writes referencing FKs"

  - priority: 6
    category: state
    check: "Source entity is in a state from which the requested transition is allowed (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_referential
    check: "Owner.voting_status is ELIGIBLE when casting a Vote (the eligible list is frozen at OPEN; later delinquency does NOT retro-disqualify, but a brand-new owner who was not on the list cannot vote)"
    error_id: ERR_VOTER_NOT_ELIGIBLE
    http_status: 403
    applies_to: "POST /proposals/{id}/votes"

  - priority: 8
    category: business_referential
    check: "Vote uniqueness — exactly one Vote per (proposal_id, property_id)"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /proposals/{id}/votes"

  - priority: 9
    category: business_temporal
    check: "Reservation slot_end_at - slot_start_at == facility.slot_minutes; slot_start_at minute-aligned to facility's slot grid (00:00 base)"
    error_id: ERR_SLOT_MISALIGNED
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 10
    category: business_temporal
    check: "Reservation slot_start_at is in the future (> now())"
    error_id: ERR_SLOT_IN_PAST
    http_status: 422
    applies_to: "POST /reservations"

  - priority: 11
    category: business_temporal
    check: "Reservation does not collide with another non-terminal Reservation on (facility, [slot_start_at, slot_end_at)) beyond facility.capacity_per_slot"
    error_id: ERR_FACILITY_SLOT_FULL
    http_status: 409
    applies_to: "POST /reservations"

  - priority: 12
    category: business_safety
    check: "Owner has no FeeBill in OVERDUE before booking facility, opening parking application, or moving in tenants"
    error_id: ERR_OWNER_DELINQUENT
    http_status: 403
    applies_to: "POST /reservations, POST /parking-applications, POST /residents (TENANT)"

  - priority: 13
    category: business_constraint
    check: "Approving a FIXED parking application: count of currently-APPROVED FIXED applications for this property < Property.parking_quota"
    error_id: ERR_PARKING_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /parking-applications/{id}/approve"

  - priority: 14
    category: business_constraint
    check: "ParkingSpace.kind matches ParkingApplication.requested_kind"
    error_id: ERR_PARKING_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /parking-applications/{id}/approve"

  - priority: 15
    category: business_constraint
    check: "ParkingSpace.status == AVAILABLE at approval time"
    error_id: ERR_PARKING_SPACE_TAKEN
    http_status: 409
    applies_to: "POST /parking-applications/{id}/approve"

  - priority: 16
    category: business_constraint
    check: "PaymentRecord (channel, external_txn_id) is unique"
    error_id: ERR_DUPLICATE_PAYMENT
    http_status: 409
    applies_to: "POST /payments"

  - priority: 17
    category: business_fiscal
    check: "PaymentRecord.amount > 0 and amount <= 10 * total_due (sanity)"
    error_id: ERR_PAYMENT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /payments"

  - priority: 18
    category: business_fiscal
    check: "WorkOrder satisfaction_score in [1,5] when CONFIRMED via owner action"
    error_id: ERR_RATING_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /work-orders/{id}/confirm"

  - priority: 19
    category: business_temporal
    check: "Proposal voting_starts_at < voting_ends_at; both in the future at OPEN time"
    error_id: ERR_VOTING_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /proposals, POST /proposals/{id}/open"

  - priority: 20
    category: business_temporal
    check: "Vote cast only when Proposal.status == OPEN and voting_starts_at <= now() < voting_ends_at"
    error_id: ERR_VOTING_CLOSED
    http_status: 409
    applies_to: "POST /proposals/{id}/votes"

  - priority: 21
    category: business_constraint
    check: "FeeBillingRule rule_code unique among ACTIVE rules"
    error_id: ERR_DUPLICATE_RULE_CODE
    http_status: 409
    applies_to: "POST /fee-billing-rules"

  - priority: 22
    category: business_constraint
    check: "Property unique on (building_no, unit_no)"
    error_id: ERR_DUPLICATE_PROPERTY
    http_status: 409
    applies_to: "POST /properties"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Owners & Properties & Residents ---
  - method: POST
    path: "/owners"
    description: "Register a new owner."
    roles: [PropertyManager]
    code: 201
    input: [full_name, id_card_no, household_register_no, phone]
    output: Owner
    side_effects: [Compute initial voting_status]

  - method: GET
    path: "/owners"
    description: "List owners with optional filters (voting_status, building_no via property join)."
    roles: [PropertyManager, CommitteeChair]
    code: 200
    input: [limit?, offset?, voting_status?]
    output: Owner[]
    side_effects: []

  - method: GET
    path: "/owners/{id}"
    description: "Get one owner."
    roles: [PropertyManager, CommitteeChair, Owner]
    code: 200
    input: []
    output: Owner
    side_effects: []

  - method: POST
    path: "/properties"
    description: "Register a property and bind owner."
    roles: [PropertyManager]
    code: 201
    input: [building_no, unit_no, area_sqm, owner_id, parking_quota?]
    output: Property
    side_effects: [Set occupancy_status = VACANT]

  - method: GET
    path: "/properties/{id}"
    description: "Get one property."
    roles: [PropertyManager, Owner]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: POST
    path: "/residents"
    description: "Register a resident (FAMILY or TENANT)."
    roles: [PropertyManager]
    code: 201
    input: [property_id, full_name, id_card_no, relation_kind, phone, lease_end_at?]
    output: Resident
    side_effects: [lifecycle_status = PENDING_MOVE_IN]

  - method: POST
    path: "/residents/{id}/move-in"
    description: "Mark resident as moved in."
    roles: [PropertyManager]
    code: 200
    input: []
    output: Resident
    side_effects: [Recompute Property.occupancy_status]

  - method: POST
    path: "/residents/{id}/move-out"
    description: "Mark resident as moved out."
    roles: [PropertyManager]
    code: 200
    input: []
    output: Resident
    side_effects: [Recompute Property.occupancy_status]

  # --- Work Orders ---
  - method: POST
    path: "/work-orders"
    description: "Owner submits a repair work order."
    roles: [Owner]
    code: 201
    input: [property_id, category, location_tag, photo_urls?]
    output: WorkOrder
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/dispatch"
    description: "Dispatch to maintenance staff."
    roles: [PropertyManager]
    code: 200
    input: [assigned_staff_id]
    output: WorkOrder
    side_effects: [status SUBMITTED→DISPATCHED]

  - method: POST
    path: "/work-orders/{id}/start"
    description: "Maintenance begins work."
    roles: [MaintenanceStaff]
    code: 200
    input: []
    output: WorkOrder
    side_effects: [status DISPATCHED→IN_PROGRESS]

  - method: POST
    path: "/work-orders/{id}/reject"
    description: "Maintenance rejects assignment."
    roles: [MaintenanceStaff]
    code: 200
    input: [rejection_reason]
    output: WorkOrder
    side_effects: [status DISPATCHED→REJECTED]

  - method: POST
    path: "/work-orders/{id}/resolve"
    description: "Maintenance marks work resolved."
    roles: [MaintenanceStaff]
    code: 200
    input: []
    output: WorkOrder
    side_effects: [status IN_PROGRESS→RESOLVED, set confirm_deadline_at]

  - method: POST
    path: "/work-orders/{id}/confirm"
    description: "Owner confirms with satisfaction rating."
    roles: [Owner]
    code: 200
    input: [satisfaction_score]
    output: WorkOrder
    side_effects: [status RESOLVED→CONFIRMED]

  - method: POST
    path: "/work-orders/{id}/reopen"
    description: "Owner reopens within confirm window."
    roles: [Owner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: [status RESOLVED→SUBMITTED]

  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Owner cancels before dispatch."
    roles: [Owner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: [status SUBMITTED→CANCELLED]

  # --- Fee billing rules ---
  - method: POST
    path: "/fee-billing-rules"
    description: "Create active billing rule."
    roles: [PropertyManager]
    code: 201
    input: [rule_code, kind, rate, late_fee_daily_rate?, late_fee_cap_pct?]
    output: FeeBillingRule
    side_effects: [Append AuditEntry(FEE_BILLING_RULE, RULE_CREATED)]

  - method: PATCH
    path: "/fee-billing-rules/{id}"
    description: "Update rate or late-fee configuration."
    roles: [PropertyManager]
    code: 200
    input: [rate?, late_fee_daily_rate?, late_fee_cap_pct?, version?]
    output: FeeBillingRule
    side_effects: [Append AuditEntry(FEE_BILLING_RULE, RATE_CHANGED, before/after)]

  # --- Fee bills ---
  - method: POST
    path: "/fee-bills/issue"
    description: "Issue bills for a given (year, month) period for all active rules and matching properties."
    roles: [PropertyManager]
    code: 201
    input: [period_year, period_month]
    output: "FeeBill[]"
    side_effects: [Compute principal_amount via fee_principal calc; status=OPEN]

  - method: GET
    path: "/fee-bills/{id}"
    description: "Get bill including current total_due (recomputed)."
    roles: [PropertyManager, Owner]
    code: 200
    input: []
    output: FeeBill
    side_effects: [On read: refresh late_fee_amount and total_due if status IN {OPEN, OVERDUE, PARTIALLY_PAID}]

  - method: GET
    path: "/fee-bills"
    description: "List bills with filters (property_id, status, dunning_stage)."
    roles: [PropertyManager, Owner]
    code: 200
    input: [property_id?, status?, dunning_stage?, limit?, offset?]
    output: "FeeBill[]"
    side_effects: []

  - method: POST
    path: "/fee-bills/{id}/waive"
    description: "Waive a bill (manager action)."
    roles: [PropertyManager]
    code: 200
    input: [reason]
    output: FeeBill
    side_effects: [status →WAIVED, AuditEntry, recompute Owner.voting_status]

  - method: POST
    path: "/payments"
    description: "Record a payment from external channel."
    roles: [PropertyManager, Owner]
    code: 201
    input: [bill_id, channel, external_txn_id, amount, paid_at]
    output: PaymentRecord
    side_effects: [Reconcile against bill; advance FeeBill.status; freeze late_fee on PAID; recompute Owner.voting_status; emit IM event]

  # --- Facilities & reservations ---
  - method: POST
    path: "/facilities"
    description: "Create a facility."
    roles: [PropertyManager]
    code: 201
    input: [facility_type, name, slot_minutes, capacity_per_slot?, cancellation_window_hours?, damage_deposit?]
    output: Facility
    side_effects: []

  - method: POST
    path: "/reservations"
    description: "Owner books a slot."
    roles: [Owner]
    code: 201
    input: [facility_id, slot_start_at, slot_end_at]
    output: Reservation
    side_effects: [Hold deposit = facility.damage_deposit]

  - method: POST
    path: "/reservations/{id}/check-in"
    description: "Owner checks in at slot start."
    roles: [Owner]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Owner cancels."
    roles: [Owner]
    code: 200
    input: []
    output: Reservation
    side_effects: [Settle deposit per cancellation_window]

  - method: POST
    path: "/reservations/{id}/close"
    description: "Manager closes after slot end."
    roles: [PropertyManager]
    code: 200
    input: [damage_amount?]
    output: Reservation
    side_effects: [Settle deposit; spillover bill if damage > deposit]

  # --- Proposals & votes ---
  - method: POST
    path: "/proposals"
    description: "Submit a proposal in DRAFT."
    roles: [CommitteeChair]
    code: 201
    input: [title, voting_method, pass_threshold_pct?, voting_starts_at, voting_ends_at]
    output: Proposal
    side_effects: []

  - method: POST
    path: "/proposals/{id}/open"
    description: "Open voting; freeze eligible voter list."
    roles: [CommitteeChair]
    code: 200
    input: []
    output: Proposal
    side_effects: [Snapshot eligible_weight_total; AuditEntry]

  - method: POST
    path: "/proposals/{id}/votes"
    description: "Cast a vote on an open proposal."
    roles: [Owner]
    code: 201
    input: [property_id, choice]
    output: Vote
    side_effects: [Update proposal yes_weight/no_weight; AuditEntry]

  - method: POST
    path: "/proposals/{id}/tally"
    description: "Tally votes after voting_ends_at."
    roles: [CommitteeChair]
    code: 200
    input: []
    output: Proposal
    side_effects: [Set status TALLIED_PASSED/TALLIED_FAILED; AuditEntry]

  - method: POST
    path: "/proposals/{id}/publish"
    description: "Publish result."
    roles: [CommitteeChair]
    code: 200
    input: []
    output: Proposal
    side_effects: [Set published_at; emit IM event; AuditEntry]

  - method: POST
    path: "/proposals/{id}/cancel"
    description: "Cancel a proposal before voting_ends_at."
    roles: [CommitteeChair]
    code: 200
    input: []
    output: Proposal
    side_effects: [AuditEntry]

  - method: GET
    path: "/proposals/{id}"
    description: "Get proposal with current tally state."
    roles: [PropertyManager, CommitteeChair, Owner]
    code: 200
    input: []
    output: Proposal
    side_effects: []

  # --- Parking ---
  - method: POST
    path: "/parking-spaces"
    description: "Register a parking space."
    roles: [PropertyManager]
    code: 201
    input: [space_no, kind, monthly_fee?]
    output: ParkingSpace
    side_effects: []

  - method: POST
    path: "/parking-applications"
    description: "Owner applies for parking."
    roles: [Owner]
    code: 201
    input: [property_id, requested_kind, license_plate]
    output: ParkingApplication
    side_effects: []

  - method: POST
    path: "/parking-applications/{id}/approve"
    description: "Approve and allocate a parking space."
    roles: [PropertyManager]
    code: 200
    input: [allocated_space_id]
    output: ParkingApplication
    side_effects: [ParkingSpace.status=ALLOCATED; first prorated FeeBill if FIXED; emit access-control sync event]

  - method: POST
    path: "/parking-applications/{id}/reject"
    description: "Reject a pending application."
    roles: [PropertyManager]
    code: 200
    input: [rejection_reason]
    output: ParkingApplication
    side_effects: []

  - method: POST
    path: "/parking-applications/{id}/terminate"
    description: "Terminate an active allocation."
    roles: [PropertyManager]
    code: 200
    input: []
    output: ParkingApplication
    side_effects: [ParkingSpace.status=AVAILABLE; emit access-control sync event]

  - method: POST
    path: "/access-logs"
    description: "Ingest entry/exit gate event from access-control system."
    roles: [PropertyManager]
    code: 201
    input: [license_plate, direction, occurred_at]
    output: AccessLog
    side_effects: [Resolve parking_space_id and classification]

  # --- Audit ---
  - method: GET
    path: "/audit-entries"
    description: "List audit entries with filters."
    roles: [PropertyManager, CommitteeChair]
    code: 200
    input: [subject_kind?, subject_id?, limit?, offset?]
    output: "AuditEntry[]"
    side_effects: []

  # --- Test-driving endpoints (per §1.5 testability-completeness principle) ---
  - method: POST
    path: "/_clock/advance"
    description: "Advance system clock to a specified ISO8601 timestamp; runs all auto-transitions due at or before the new time (FeeBill OPEN→OVERDUE, dunning escalation, work-order auto-confirm, reservation NO_SHOW)."
    roles: [PropertyManager]
    code: 200
    input: [to]
    output: object
    side_effects: [Apply all due auto-transitions in chronological order]

  - method: POST
    path: "/_events/emit"
    description: "Emit a synthetic external event (payment-channel webhook, access-control gate event, IM ack). Used to test event-driven sync."
    roles: [PropertyManager]
    code: 202
    input: [source, payload]
    output: object
    side_effects: [Triggers domain-side effect identical to natural inbound]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "Required X-User-Role or X-User-ID header missing or empty."
  - id: ERR_AUTH_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of the declared roles."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role does not permit this endpoint or resource ownership check failed."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-parameter resource does not exist."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body field references a non-existent entity."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Source entity not in a state allowing this transition."
  - id: ERR_VOTER_NOT_ELIGIBLE
    http: 403
    condition: "Owner not on the eligible list snapshot for this proposal."
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "Vote already exists for (proposal_id, property_id)."
  - id: ERR_VOTING_CLOSED
    http: 409
    condition: "Vote attempted outside [voting_starts_at, voting_ends_at)."
  - id: ERR_VOTING_WINDOW_INVALID
    http: 422
    condition: "Voting window times incoherent (start>=end or end already past)."
  - id: ERR_SLOT_MISALIGNED
    http: 422
    condition: "Reservation slot length does not match facility.slot_minutes or start not on facility's slot grid."
  - id: ERR_SLOT_IN_PAST
    http: 422
    condition: "Reservation slot_start_at <= now()."
  - id: ERR_FACILITY_SLOT_FULL
    http: 409
    condition: "Reservations for this slot already at facility.capacity_per_slot."
  - id: ERR_OWNER_DELINQUENT
    http: 403
    condition: "Owner has at least one FeeBill in OVERDUE; action blocked."
  - id: ERR_PARKING_QUOTA_EXCEEDED
    http: 422
    condition: "Approving FIXED application would exceed Property.parking_quota."
  - id: ERR_PARKING_KIND_MISMATCH
    http: 422
    condition: "ParkingSpace.kind != ParkingApplication.requested_kind."
  - id: ERR_PARKING_SPACE_TAKEN
    http: 409
    condition: "ParkingSpace not AVAILABLE at approval."
  - id: ERR_DUPLICATE_PAYMENT
    http: 409
    condition: "PaymentRecord (channel, external_txn_id) already exists."
  - id: ERR_PAYMENT_AMOUNT_INVALID
    http: 422
    condition: "Payment amount <= 0 or implausibly large."
  - id: ERR_RATING_OUT_OF_RANGE
    http: 422
    condition: "satisfaction_score outside [1,5]."
  - id: ERR_DUPLICATE_RULE_CODE
    http: 409
    condition: "Active FeeBillingRule with same rule_code already exists."
  - id: ERR_DUPLICATE_PROPERTY
    http: 409
    condition: "Property (building_no, unit_no) already exists."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "PATCH version field does not match current entity version (OCC)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PropertyManager
    description: "Property-management staff with broad operational authority."
    identity: "opaque"
    exclusive_operations:
      - "POST /owners"
      - "POST /properties"
      - "POST /residents"
      - "POST /residents/{id}/move-in"
      - "POST /residents/{id}/move-out"
      - "POST /work-orders/{id}/dispatch"
      - "POST /fee-billing-rules"
      - "PATCH /fee-billing-rules/{id}"
      - "POST /fee-bills/issue"
      - "POST /fee-bills/{id}/waive"
      - "POST /facilities"
      - "POST /reservations/{id}/close"
      - "POST /parking-spaces"
      - "POST /parking-applications/{id}/approve"
      - "POST /parking-applications/{id}/reject"
      - "POST /parking-applications/{id}/terminate"
      - "POST /access-logs"
      - "POST /_clock/advance"
      - "POST /_events/emit"
    shared_operations:
      - "GET /owners"
      - "GET /owners/{id}"
      - "GET /properties/{id}"
      - "GET /fee-bills"
      - "GET /fee-bills/{id}"
      - "POST /payments"
      - "GET /audit-entries"
      - "GET /proposals/{id}"

  - name: Owner
    description: "Property owner; can act on resources tied to their owner_id."
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /work-orders"
      - "POST /work-orders/{id}/cancel"
      - "POST /work-orders/{id}/confirm"
      - "POST /work-orders/{id}/reopen"
      - "POST /reservations"
      - "POST /reservations/{id}/check-in"
      - "POST /reservations/{id}/cancel"
      - "POST /parking-applications"
      - "POST /proposals/{id}/votes"
    shared_operations:
      - "GET /owners/{id}"
      - "GET /properties/{id}"
      - "GET /fee-bills"
      - "GET /fee-bills/{id}"
      - "POST /payments"
      - "GET /proposals/{id}"

  - name: MaintenanceStaff
    description: "Maintenance technician dispatched to work orders."
    identity: "opaque"
    exclusive_operations:
      - "POST /work-orders/{id}/start"
      - "POST /work-orders/{id}/reject"
      - "POST /work-orders/{id}/resolve"
    shared_operations: []

  - name: CommitteeChair
    description: "Owners-committee chair, runs proposal lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /proposals"
      - "POST /proposals/{id}/open"
      - "POST /proposals/{id}/tally"
      - "POST /proposals/{id}/publish"
      - "POST /proposals/{id}/cancel"
    shared_operations:
      - "GET /owners"
      - "GET /proposals/{id}"
      - "GET /audit-entries"
