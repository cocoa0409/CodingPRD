      - name: waitlisted_screening_request_expires_when_the_clock_passes_the_fourteen_day_window
        claim_type: valid_transition
        grounds:
          - state_machines.ScreeningRequest.WAITLISTED_to_EXPIRED
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          The clock-driven expiry is strict: at exactly requested_entry_date + 14 days at
          00:00:00Z the request survives with its waitlist_position intact, and one second later it
          moves to EXPIRED with waitlist_position cleared and expired_screening_request_count 1.
        test_recipe:
