              as: Controller
              captures: { ph_c1: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${p_id}", wbs_code: "02-CD", fee_basis: "LUMP_SUM", parent_phase_id: "${ph_root}", lump_sum_fee: 200000.00, budget_labor_cost: 40000.00, consultant_budget: 0.00 }
              as: Controller
            - call: "POST /phases"
              payload: { project_id: "${p_id}", wbs_code: "02-CD", fee_basis: "LUMP_SUM", parent_phase_id: "${ph_root}", lump_sum_fee: 150000.00, budget_labor_cost: 40000.00, consultant_budget: 0.00 }
              as: Controller
              captures: { ph_c2: $.data.id }
            - call: "POST /phases"
              payload: { project_id: "${p_id}", wbs_code: "02-DD", fee_basis: "LUMP_SUM", parent_phase_id: "${ph_root}", lump_sum_fee: 10000.00, budget_labor_cost: 5000.00, consultant_budget: 0.00 }
              as: Controller
            - call: "POST /billing-multipliers"
              payload: { project_id: "${p_id}", multiplier: 3.0500, effective_from: "2026-01-01", expected_project_version: "${p_v0}" }
              as: Controller
            - call: "POST /projects/${p_id}/activate"
              payload: {}
