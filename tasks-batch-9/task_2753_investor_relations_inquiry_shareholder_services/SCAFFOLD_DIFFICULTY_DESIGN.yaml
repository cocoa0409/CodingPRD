              captures: { ins1_id: "$.data.id" }
          trigger:
            - call: "POST /transfer-agent-instructions"
              payload: { company_id: "${co_id}", instruction_type: "DIVIDEND_PAYMENT", record_date: "2026-08-25", payable_date: "2026-09-05", declared_rate_cents_per_share: 1.0000, funding_mode: "DECLARED_RATE" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /transfer-agent-instructions"
              payload: { company_id: "${co_id}", instruction_type: "DIVIDEND_PAYMENT", record_date: "2026-08-26", payable_date: "2026-09-05", declared_rate_cents_per_share: 1.0000, funding_mode: "DECLARED_RATE" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { ins2_id: "$.data.id" }
          assert:
            - "trigger step 1 responds HTTP 409 with $.data.error_id == ERR_DIVIDEND_CYCLE_OVERLAP (record_date == the stored payable_date is inside the closed interval)"
            - "trigger step 2 responds HTTP 201 with $.data.status == SUBMITTED"
            - "TransferAgentInstruction.${ins2_id}.record_date == 2026-08-26 and payable_date == 2026-09-05"
            - "TransferAgentInstruction.${ins1_id}.status == SUBMITTED and version == 1 (untouched by both attempts)"

  - rule_id: compensating_invariant
    instances:
      - name: dividend_reversal_restores_reserve_paid_and_holder_totals
        grounds:
          - calculations.dividend_cash_conservation
          - calculations.dividend_payout_ledger
          - state_machines.TransferAgentInstruction.EXECUTED_to_REVERSED
          - entities.Company.fields.dividend_reserve_cents
          - entities.Contact.fields.dividend_received_cents
        distinguishing_aspect: |
          Conserved quantity 1 — issuer dividend cash: Company.dividend_reserve_cents +
          Company.dividend_paid_cents equals 100000 before execute, after execute and after reverse,
          and sum(Contact.dividend_received_cents) equals Company.dividend_paid_cents at every step,
          because reverse replays the stored payout_ledger rather than recomputing amounts.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, moved to 2026-08-25T00:00:00Z for execution and 2026-08-27T00:00:00Z for reversal (inside the 72-hour window)."
            - "Issuer REV with 1,000,000 shares outstanding and a 100,000-cent reserve."
            - "Three holders with 333, 667 and 1000 shares."
            - "One acknowledged DECLARED_RATE dividend instruction at 0.4567 cents per share, record_date 2026-08-15, payable_date 2026-08-25."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "REV", legal_name: "Reversal Invariant Corp", shares_outstanding: 1000000, dividend_reserve_cents: 100000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { co_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Rev Holder One", email: "rv1@funds.test", shares_held: 333 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { v1_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "INSTITUTIONAL_HOLDER", display_name: "Rev Holder Two", email: "rv2@funds.test", shares_held: 667 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { v2_id: "$.data.id" }
            - call: "POST /contacts"
              payload: { company_id: "${co_id}", contact_type: "RETAIL_HOLDER", display_name: "Rev Holder Three", email: "rv3@retail.test", shares_held: 1000 }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { v3_id: "$.data.id" }
            - call: "POST /transfer-agent-instructions"
              payload: { company_id: "${co_id}", instruction_type: "DIVIDEND_PAYMENT", record_date: "2026-08-15", payable_date: "2026-08-25", declared_rate_cents_per_share: 0.4567, funding_mode: "DECLARED_RATE" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
              captures: { ins_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /transfer-agent-instructions/${ins_id}/acknowledge"
              payload: { decision: "ACKNOWLEDGE" }
              as: TransferAgentLiaison
              as_user_id: "u_ta_1"
          trigger:
            - call: "POST /transfer-agent-instructions/${ins_id}/execute"
              payload: {}
              as: TransferAgentLiaison
              as_user_id: "u_ta_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-27T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /transfer-agent-instructions/${ins_id}/reverse"
              payload: { reason: "Transfer agent reported an incorrect record-date file." }
              as: TransferAgentLiaison
              as_user_id: "u_ta_1"
          assert:
            - "after trigger step 1: Company.${co_id}.dividend_reserve_cents == 99086, Company.${co_id}.dividend_paid_cents == 914, and their sum == 100000"
            - "after trigger step 1: Contact.${v1_id}.dividend_received_cents == 152, Contact.${v2_id}.dividend_received_cents == 305, Contact.${v3_id}.dividend_received_cents == 457"
            - "after trigger step 3: TransferAgentInstruction.${ins_id}.status == REVERSED and decision_reason == 'Transfer agent reported an incorrect record-date file.'"
            - "after trigger step 3: Company.${co_id}.dividend_reserve_cents == 100000 and Company.${co_id}.dividend_paid_cents == 0, so the conserved sum is still exactly 100000"
            - "after trigger step 3: Contact.${v1_id}.dividend_received_cents == 0, Contact.${v2_id}.dividend_received_cents == 0, Contact.${v3_id}.dividend_received_cents == 0 — sum(dividend_received_cents) == Company.dividend_paid_cents == 0"
            - "after trigger step 3: TransferAgentInstruction.${ins_id}.total_payout_cents == 914 and payout_ledger amounts are still [152, 305, 457] (retained for audit)"

      - name: event_request_ledger_conserved_across_release_and_complete
        grounds:
          - calculations.event_request_ledger
          - calculations.roadshow_allocation_run
          - state_machines.RoadshowEvent.LOCKED_to_COMPLETED
          - state_machines.MeetingRequest.WAITLISTED_to_DECLINED
          - entities.RoadshowEvent.fields.request_ledger_total
        distinguishing_aspect: |
          Conserved quantity 2 — meeting-slot headcount, a different type of conserved quantity from
          issuer cash: request_ledger_total stays 3 across the allocation run, a release with its
          waitlist promotion and the event completion, always equalling
          allocated_count + waitlisted_count + released_count + declined_count + the REQUESTED remainder.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Issuer LDG with three INSTITUTIONAL_HOLDER contacts: L1 120,000 shares nda true (TIER_1), L2 20,000 shares nda true (TIER_2), L3 5,000 shares nda false (TIER_3)."
            - "One NDR event OPEN_FOR_REQUESTS with capacity_slots 1, window 2026-09-01T13:00:00Z to 2026-09-01T18:00:00Z, slot_minutes 30."
            - "All three contacts hold REQUESTED requests in distinct slots (13:00, 14:00, 15:00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IRAdmin
              as_user_id: "u_ir_admin_1"
            - call: "POST /companies"
              payload: { ticker: "LDG", legal_name: "Ledger Conservation Corp", shares_outstanding: 1000000 }
              as: IRAdmin
