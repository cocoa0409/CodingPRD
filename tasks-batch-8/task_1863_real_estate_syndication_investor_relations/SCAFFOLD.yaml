    code: 200
    input: []
    output: Distribution
    side_effects:
      - "status DRAFT -> CALCULATED"
      - "calculated_at := current UTC"
      - "Synthesize DistributionLine per FUNDED Subscription per distribution_waterfall_allocation"
      - "increments Distribution.version by 1"

  - method: POST
    path: "/syndications/{syndicationId}/offerings/{offeringId}/distributions/{distributionId}/approve"
