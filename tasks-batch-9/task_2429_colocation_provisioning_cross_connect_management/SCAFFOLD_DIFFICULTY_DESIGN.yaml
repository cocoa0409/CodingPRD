  - rule_id: priority_pair_validation_conflict
    instances:
      - name: contract_lifecycle_gate_outranks_credit_hold_gate_on_order_intake
        grounds:
          - validations.priority_18_ERR_CONTRACT_NOT_ACTIVE
          - validations.priority_38_ERR_CREDIT_HOLD_ACTIVE
          - endpoints.POST_colocation_cross_connect_orders
          - state_machines.Contract.ACTIVE_to_SUSPENDED
          - state_machines.Contract.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          The same intake call is walked through all four cells of the truth table:
          ACTIVE + hold gives 402 ERR_CREDIT_HOLD_ACTIVE, SUSPENDED + hold gives 409
          ERR_CONTRACT_NOT_ACTIVE (priority 18 beats priority 38 even though the fiscal
          violation is still present), SUSPENDED + no hold still gives 409, and only
          ACTIVE + no hold returns 201 — so an implementation that checks the cheaper fiscal
          flag first is caught on the second cell.
        test_recipe:
