  # ---------------------------------------------------------------------------
  # section: errors
  # The claim-extraction guide's Table 6 has no claim-type rows - it states a
  # single obligation: "verify every error code is triggerable". Every instance
  # below therefore carries claim_type: error_triggerable, and the section
  # covers exactly the §1.6 codes that no other §1.8 or §1.9 instance asserts.
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: product_trial_create_without_role_header_returns_401_unauthenticated
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - rbac.identity_header
        distinguishing_aspect: |
          Absent X-User-Role is 401 at priority 1 and outranks every later check: the payload here is
          otherwise valid and its FKs resolve, so a 403, 404 or 422 answer proves the auth gate runs late.
        test_recipe:
          setup:
            - "one Customer and one ACTIVE MachineModel"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 4.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
