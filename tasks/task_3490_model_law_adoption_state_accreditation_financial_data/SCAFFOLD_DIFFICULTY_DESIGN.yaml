scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: rbc_covariance_vs_additive_divergence
        grounds:
          - calculations.rbc_action_level
          - calculations.rbc_capital_aggregation
          - entities.RBCReport.fields.ratio_covariance
          - entities.RBCReport.fields.ratio_additive
        distinguishing_aspect: |
          Same filing inputs yield ratio_covariance 2.8284 (band NONE) but
          ratio_additive 1.6667 (band COMPANY_ACTION); the insurer-domain
          solvency calc is the subject here, unlike the state-domain
          accreditation score in accreditation_desk_vs_onsite_divergence.
        test_recipe:
          setup:
            - "State CA exists; insurer 90001 domiciled in CA; valuation standard VM-20 v2026.1 is ACTIVE"
            - "A 2026 ANNUAL filing with surplus 4000000 and charges 1000000/800000/600000 is SUBMITTED"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/insurers", payload: { naic_code: "90001", name: "Insurer One", domicile_state_code: "CA" }, as: AssociationStaff, captures: { ins_id: $.data.id, ins_v: $.data.version } }
            - { call: "POST /naic/valuation-standards", payload: { code: "VM-20", version_label: "v2026.1", guidance_text: "Reserve guidance" }, as: Actuary, as_user_id: "actuary-1", captures: { std_id: $.data.id } }
            - { call: "POST /naic/valuation-standards/${std_id}/activate", payload: {}, as: Actuary, as_user_id: "actuary-2" }
            - { call: "POST /naic/filings", payload: { insurer_id: "${ins_id}", period_year: 2026, period_quarter: "ANNUAL", valuation_standard_code: "VM-20", reported_surplus_cents: 4000000, asset_risk_cents: 1000000, underwriting_risk_cents: 800000, other_risk_cents: 600000, expected_insurer_version: "${ins_v}" }, as: InsurerUser, as_user_id: "${ins_id}", captures: { f_id: $.data.id } }
            - { call: "POST /naic/filings/${f_id}/submit", payload: {}, as: InsurerUser, as_user_id: "${ins_id}" }
          trigger:
            - { call: "POST /naic/filings/${f_id}/validate", payload: {}, as: AssociationStaff }
            - { call: "GET /naic/filings/${f_id}/rbc-reports", payload: {}, as: AssociationStaff, captures: { acl_cov: "$.data[0].acl_covariance_cents", acl_add: "$.data[0].acl_additive_cents", r_cov: "$.data[0].ratio_covariance", r_add: "$.data[0].ratio_additive", lvl: "$.data[0].action_level" } }
          assert:
            - "RBCReport.acl_additive_cents == 2400000.0"
            - "RBCReport.acl_covariance_cents == 1414213.56"
            - "RBCReport.ratio_covariance == 2.8284 and action_level == NONE"
            - "RBCReport.ratio_additive == 1.6667 which would classify as COMPANY_ACTION, proving the two variants diverge on identical data"
            - "Insurer.${ins_id}.latest_action_level == NONE (official variant drives posture)"
      - name: accreditation_desk_vs_onsite_divergence
        grounds:
          - calculations.accreditation_score
          - entities.AccreditationReview.fields.desk_score
          - entities.AccreditationReview.fields.onsite_score
        distinguishing_aspect: |
          The same review scores 90.0 under the desk (self-assessed) variant
          but 60.0 under the onsite (findings) variant, flipping the outcome
          past PASS_THRESHOLD 75.0; subject is state accreditation, not the
          insurer solvency calc of rbc_covariance_vs_additive_divergence.
        test_recipe:
          setup:
            - "State CA exists; a review is SCHEDULED with self-assessment 18/20"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/reviews", payload: { state_id: "${s_ca_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", team_lead_id: "lead-1", self_assessment_compliant: 18, self_assessment_total: 20 }, as: AssociationStaff, captures: { rv_id: $.data.id, rv_desk: $.data.desk_score } }
          trigger:
            - { call: "POST /naic/reviews/${rv_id}/issue-findings", payload: { findings_compliant: 12, findings_total: 20 }, as: ReviewTeamLead, as_user_id: "lead-1", captures: { rv_onsite: $.data.onsite_score, rv_prop: $.data.proposed_outcome } }
          assert:
            - "AccreditationReview.${rv_id}.desk_score == 90.0"
            - "AccreditationReview.${rv_id}.onsite_score == 60.0"
            - "AccreditationReview.${rv_id}.proposed_outcome == FAIL even though desk_score 90.0 >= 75.0"
            - "AccreditationReview.${rv_id}.status == FINDINGS_ISSUED"
  - rule_id: combinatorial_formula
    instances:
      - name: exam_priority_tiered_min_formula
        grounds:
          - calculations.exam_priority_score
          - entities.MarketConductResponse.fields.exam_priority_score
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — a capped
          complaint term (min inside a product), a 5-band tiered RBC lookup,
          and a 2-band share lookup, all under an outer min(SCORE_CAP, ...).
          Not a rounding-order or evaluation-order instance.
        test_recipe:
          setup:
            - "State CA; insurer 90010 domiciled CA; standard VM-20 v2026.1 ACTIVE"
            - "Insurer has a VALIDATED filing with ratio_covariance 0.6928 (MANDATORY_CONTROL, so insurer is UNDER_SUPERVISION)"
            - "Call MC-100 OPEN with total_cost_cents 100000 led by CA"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/insurers", payload: { naic_code: "90010", name: "Insurer Ten", domicile_state_code: "CA" }, as: AssociationStaff, captures: { ins_id: $.data.id, ins_v: $.data.version } }
            - { call: "POST /naic/valuation-standards", payload: { code: "VM-20", version_label: "v2026.1", guidance_text: "g" }, as: Actuary, as_user_id: "actuary-1", captures: { std_id: $.data.id } }
            - { call: "POST /naic/valuation-standards/${std_id}/activate", payload: {}, as: Actuary, as_user_id: "actuary-2" }
            - { call: "POST /naic/filings", payload: { insurer_id: "${ins_id}", period_year: 2026, period_quarter: "ANNUAL", valuation_standard_code: "VM-20", reported_surplus_cents: 1200000, asset_risk_cents: 1000000, underwriting_risk_cents: 1000000, other_risk_cents: 1000000, expected_insurer_version: "${ins_v}" }, as: InsurerUser, as_user_id: "${ins_id}", captures: { f_id: $.data.id } }
            - { call: "POST /naic/filings/${f_id}/submit", payload: {}, as: InsurerUser, as_user_id: "${ins_id}" }
            - { call: "POST /naic/filings/${f_id}/validate", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/market-conduct-calls", payload: { call_code: "MC-100", topic: "claims handling", total_cost_cents: 100000 }, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { call_id: $.data.id } }
          trigger:
            - { call: "POST /naic/market-conduct-calls/${call_id}/responses", payload: { direct_premium_cents: 200000000, complaint_count: 40 }, as: InsurerUser, as_user_id: "${ins_id}", captures: { resp_score: $.data.exam_priority_score, resp_esc: $.data.escalation_flag } }
          assert:
            - "MarketConductResponse.exam_priority_score == 80.0 (complaints_per_million 20.0 -> capped component 10.0; rbc tier 50 for ratio < 0.7000; share 1.0 -> 20; min(100, 80) == 80.0)"
            - "MarketConductResponse.escalation_flag == true because the insurer is UNDER_SUPERVISION at creation"
            - "Insurer.${ins_id}.status == UNDER_SUPERVISION"
      - name: rbc_acl_rounding_order_pinned
        grounds:
          - calculations.rbc_capital_aggregation
          - entities.RBCReport.fields.acl_covariance_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          sqrt-then-round-ACL-to-2dp-then-divide; the alternative order
          (divide by the unrounded sqrt) yields 1.7321 instead of 1.7341.
          Not a tiered-formula or evaluation-order instance.
        test_recipe:
          setup:
            - "State CA; insurer 90011; standard VM-20 v2026.1 ACTIVE; filing with surplus 3 and charges 1/1/1 SUBMITTED"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/insurers", payload: { naic_code: "90011", name: "Insurer Eleven", domicile_state_code: "CA" }, as: AssociationStaff, captures: { ins_id: $.data.id, ins_v: $.data.version } }
            - { call: "POST /naic/valuation-standards", payload: { code: "VM-20", version_label: "v2026.1", guidance_text: "g" }, as: Actuary, as_user_id: "actuary-1", captures: { std_id: $.data.id } }
            - { call: "POST /naic/valuation-standards/${std_id}/activate", payload: {}, as: Actuary, as_user_id: "actuary-2" }
            - { call: "POST /naic/filings", payload: { insurer_id: "${ins_id}", period_year: 2026, period_quarter: "ANNUAL", valuation_standard_code: "VM-20", reported_surplus_cents: 3, asset_risk_cents: 1, underwriting_risk_cents: 1, other_risk_cents: 1, expected_insurer_version: "${ins_v}" }, as: InsurerUser, as_user_id: "${ins_id}", captures: { f_id: $.data.id } }
            - { call: "POST /naic/filings/${f_id}/submit", payload: {}, as: InsurerUser, as_user_id: "${ins_id}" }
          trigger:
            - { call: "POST /naic/filings/${f_id}/validate", payload: {}, as: AssociationStaff }
            - { call: "GET /naic/filings/${f_id}/rbc-reports", payload: {}, as: AssociationStaff, captures: { acl_cov: "$.data[0].acl_covariance_cents", r_cov: "$.data[0].ratio_covariance", r_add: "$.data[0].ratio_additive", lvl: "$.data[0].action_level" } }
          assert:
            - "RBCReport.acl_covariance_cents == 1.73 (round_half_up(sqrt(3), 2))"
            - "RBCReport.ratio_covariance == 1.7341 (3 / 1.73 rounded to 4dp), NOT 1.7321 (3 / sqrt(3) unrounded)"
            - "RBCReport.ratio_additive == 1.0"
            - "RBCReport.action_level == COMPANY_ACTION"
      - name: cost_share_two_pass_renormalization
        grounds:
          - calculations.cost_share_assessment
          - entities.MarketConductResponse.fields.allocated_cost_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the exclusion floor depends
          on shares, and shares depend on who is excluded; the scaffold pins a
          single renormalization pass (pass 1 over all, exclude below 5%,
          pass 2 over survivors exactly once). Not a tiered or rounding-order
          instance.
        test_recipe:
          setup:
            - "State CA; insurers 90020/90021/90022; call MC-200 OPEN with total_cost_cents 1000000"
            - "Responses filed: A premium 950000000, B 40000000, C 10000000 (pass-1 shares 0.95 / 0.04 / 0.01)"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/insurers", payload: { naic_code: "90020", name: "A", domicile_state_code: "CA" }, as: AssociationStaff, captures: { ins_a: $.data.id } }
            - { call: "POST /naic/insurers", payload: { naic_code: "90021", name: "B", domicile_state_code: "CA" }, as: AssociationStaff, captures: { ins_b: $.data.id } }
            - { call: "POST /naic/insurers", payload: { naic_code: "90022", name: "C", domicile_state_code: "CA" }, as: AssociationStaff, captures: { ins_c: $.data.id } }
            - { call: "POST /naic/market-conduct-calls", payload: { call_code: "MC-200", topic: "complaints", total_cost_cents: 1000000 }, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { call_id: $.data.id } }
            - { call: "POST /naic/market-conduct-calls/${call_id}/responses", payload: { direct_premium_cents: 950000000, complaint_count: 0 }, as: InsurerUser, as_user_id: "${ins_a}", captures: { ra: $.data.id } }
            - { call: "POST /naic/market-conduct-calls/${call_id}/responses", payload: { direct_premium_cents: 40000000, complaint_count: 0 }, as: InsurerUser, as_user_id: "${ins_b}", captures: { rb: $.data.id } }
            - { call: "POST /naic/market-conduct-calls/${call_id}/responses", payload: { direct_premium_cents: 10000000, complaint_count: 0 }, as: InsurerUser, as_user_id: "${ins_c}", captures: { rc: $.data.id } }
          trigger:
            - { call: "POST /naic/market-conduct-calls/${call_id}/close", payload: {}, as: StateRegulator, as_user_id: "${s_ca_id}" }
          assert:
            - "MarketConductResponse.${ra}.allocated_cost_cents == 1000000 and cost_share_excluded == false (sole survivor of the floor)"
            - "MarketConductResponse.${rb}.allocated_cost_cents == 0 and cost_share_excluded == true (pass-1 share 0.04 < 0.05)"
            - "MarketConductResponse.${rc}.allocated_cost_cents == 0 and cost_share_excluded == true (pass-1 share 0.01 < 0.05)"
            - "sum of allocated_cost_cents over the call's responses == 1000000 (cents conserved under renormalization)"
  - rule_id: non_linear_state_machine
    instances:
      - name: model_act_ballot_failure_revision_cycle
        grounds:
          - state_machines.ModelAct.BALLOTING_to_DRAFTING
          - state_machines.ModelAct.DRAFTING_to_EXPOSURE_OPEN
          - state_machines.MemberBallot.CAST_to_VOID
        distinguishing_aspect: |
          ModelAct is cyclic: a failed close-ballot loops BALLOTING back to
          DRAFTING and voids the round's ballots, after which a second
          exposure/ballot round reaches ADOPTED. The companion cyclic machine
          (state_accreditation_fail_reinstate_cycle) lives on State, a
          different entity.
        test_recipe:
          setup:
            - "States CA and NY exist (both ACCREDITED, so eligible_count == 2, quorum == 2)"
            - "Act MDL-700 v1 has completed round 1: exposure, ballot (CA YEA / NY NAY), close-ballot failed -> DRAFTING, both ballots VOID"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/states", payload: { code: "NY", name: "New York" }, as: AssociationStaff, captures: { s_ny_id: $.data.id } }
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-700", version_label: "v1", title: "Model Guaranty Act", act_type: "MODEL_LAW", committee_name: "E Committee", is_core: false }, as: AssociationStaff, captures: { act_id: $.data.id } }
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${act_id}", comment_window_start: "2026-09-01T00:00:00Z", comment_window_end: "2026-10-01T00:00:00Z" }, as: AssociationStaff, captures: { d1_id: $.data.id } }
            - { call: "POST /naic/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: AssociationStaff }
            - { call: "POST /naic/exposure-drafts/${d1_id}/close", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "CA", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_ca_id}" }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "NY", vote: "NAY" }, as: StateRegulator, as_user_id: "${s_ny_id}" }
            - { call: "POST /naic/model-acts/${act_id}/close-ballot", payload: {}, as: AssociationStaff, captures: { act_st1: $.data.status, act_vc1: $.data.votes_cast } }
            - { call: "GET /naic/model-acts/${act_id}/ballots", payload: {}, as: AssociationStaff, captures: { b1_st: "$.data[0].status", b2_st: "$.data[1].status" } }
          trigger:
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${act_id}", comment_window_start: "2026-11-01T00:00:00Z", comment_window_end: "2026-12-01T00:00:00Z" }, as: AssociationStaff, captures: { d2_id: $.data.id, d2_num: $.data.exposure_number } }
            - { call: "POST /naic/_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: AssociationStaff }
            - { call: "POST /naic/exposure-drafts/${d2_id}/close", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "CA", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_ca_id}" }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "NY", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_ny_id}" }
            - { call: "POST /naic/model-acts/${act_id}/close-ballot", payload: {}, as: AssociationStaff, captures: { act_st2: $.data.status, act_vc2: $.data.votes_cast, act_fv2: $.data.favorable_votes } }
          assert:
            - "after round 1: ModelAct.${act_id}.status == DRAFTING and votes_cast == 0 (1 YEA of 2 < required 2; ballots voided)"
            - "both round-1 ballots have status VOID"
            - "round-2 draft has exposure_number == 2"
            - "after round 2: ModelAct.${act_id}.status == ADOPTED, votes_cast == 2, favorable_votes == 2"
      - name: state_accreditation_fail_reinstate_cycle
        grounds:
          - state_machines.State.ACCREDITED_to_PROBATION
          - state_machines.State.PROBATION_to_SUSPENDED
          - state_machines.State.SUSPENDED_to_ACCREDITED
        distinguishing_aspect: |
          State.accreditation_status is cyclic (ACCREDITED -> PROBATION ->
          SUSPENDED -> ACCREDITED on a later FINAL_PASS), driven entirely by
          review finalize cascades; the companion cyclic machine
          (model_act_ballot_failure_revision_cycle) lives on ModelAct, a
          different entity.
        test_recipe:
          setup:
            - "State CA exists"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
          trigger:
            - { call: "POST /naic/reviews", payload: { state_id: "${s_ca_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", team_lead_id: "lead-1", self_assessment_compliant: 0, self_assessment_total: 1 }, as: AssociationStaff, captures: { rv1: $.data.id } }
            - { call: "POST /naic/reviews/${rv1}/issue-findings", payload: { findings_compliant: 10, findings_total: 20 }, as: ReviewTeamLead, as_user_id: "lead-1" }
            - { call: "POST /naic/reviews/${rv1}/finalize", payload: {}, as: AssociationStaff }
            - { call: "GET /naic/states/${s_ca_id}", payload: {}, as: AssociationStaff, captures: { st1: $.data.accreditation_status, fc1: $.data.consecutive_fail_count } }
            - { call: "POST /naic/reviews", payload: { state_id: "${s_ca_id}", period_start: "2026-12-27T00:00:00Z", period_end: "2027-06-30T00:00:00Z", team_lead_id: "lead-2", self_assessment_compliant: 0, self_assessment_total: 1 }, as: AssociationStaff, captures: { rv2: $.data.id } }
            - { call: "POST /naic/reviews/${rv2}/issue-findings", payload: { findings_compliant: 5, findings_total: 20 }, as: ReviewTeamLead, as_user_id: "lead-2" }
            - { call: "POST /naic/reviews/${rv2}/finalize", payload: {}, as: AssociationStaff }
            - { call: "GET /naic/states/${s_ca_id}", payload: {}, as: AssociationStaff, captures: { st2: $.data.accreditation_status, fc2: $.data.consecutive_fail_count } }
            - { call: "POST /naic/reviews", payload: { state_id: "${s_ca_id}", period_start: "2027-12-27T00:00:00Z", period_end: "2028-06-30T00:00:00Z", team_lead_id: "lead-1", self_assessment_compliant: 1, self_assessment_total: 1 }, as: AssociationStaff, captures: { rv3: $.data.id } }
            - { call: "POST /naic/reviews/${rv3}/issue-findings", payload: { findings_compliant: 20, findings_total: 20 }, as: ReviewTeamLead, as_user_id: "lead-1" }
            - { call: "POST /naic/reviews/${rv3}/finalize", payload: {}, as: AssociationStaff }
            - { call: "GET /naic/states/${s_ca_id}", payload: {}, as: AssociationStaff, captures: { st3: $.data.accreditation_status, fc3: $.data.consecutive_fail_count } }
          assert:
            - "after first FINAL_FAIL: accreditation_status == PROBATION and consecutive_fail_count == 1"
            - "after second FINAL_FAIL: accreditation_status == SUSPENDED and consecutive_fail_count == 2"
            - "after FINAL_PASS: accreditation_status == ACCREDITED and consecutive_fail_count == 0 (loop closes)"
  - rule_id: transitive_cascade
    instances:
      - name: publish_supersede_coverage_cascade
        grounds:
          - state_machines.ModelAct.ADOPTED_to_PUBLISHED
          - state_machines.ModelAct.PUBLISHED_to_SUPERSEDED
          - state_machines.StateAdoption.CERTIFIED_SIMILAR_to_SUPERSEDED
          - calculations.core_act_coverage
        distinguishing_aspect: |
          Depth-4 chain triggered by publish: publish v2 -> prior PUBLISHED
          act v1 SUPERSEDED -> v1's certified adoption SUPERSEDED -> state
          coverage recomputed (100.0 -> 0.0) -> AUTO_COVERAGE review
          auto-created. Each hop is caused by the previous hop, not by the
          original request; the companion cascade
          (validate_rbc_supervision_escalation_cascade) starts from a
          different trigger (filing validate).
        test_recipe:
          setup:
            - "State CA (ACCREDITED); act MDL-101 v1 (is_core true) is PUBLISHED; CA holds a CERTIFIED_SIMILAR adoption of v1; coverage == 100.0"
            - "Act MDL-101 v2 (is_core true) is ADOPTED"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id, s_ca_v: $.data.version } }
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-101", version_label: "v1", title: "Model Privacy Act", act_type: "MODEL_LAW", committee_name: "E Committee", is_core: true }, as: AssociationStaff, captures: { a1: $.data.id } }
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${a1}", comment_window_start: "2026-09-01T00:00:00Z", comment_window_end: "2026-10-01T00:00:00Z" }, as: AssociationStaff, captures: { d1: $.data.id } }
            - { call: "POST /naic/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: AssociationStaff }
            - { call: "POST /naic/exposure-drafts/${d1}/close", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/model-acts/${a1}/ballots", payload: { state_code: "CA", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_ca_id}" }
            - { call: "POST /naic/model-acts/${a1}/close-ballot", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/model-acts/${a1}/publish", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/adoptions", payload: { model_act_id: "${a1}", state_code: "CA", adopted_citation: "Cal. Ins. Code 101", enacted_on: "2026-11-01T00:00:00Z", expected_state_version: "${s_ca_v}" }, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { ad1: $.data.id } }
            - { call: "POST /naic/adoptions/${ad1}/certify", payload: { variation_class: "SUBSTANTIALLY_SIMILAR" }, as: AssociationStaff }
            - { call: "GET /naic/states/${s_ca_id}", payload: {}, as: AssociationStaff, captures: { cov_before: $.data.core_act_coverage_pct } }
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-101", version_label: "v2", title: "Model Privacy Act (2026 rev.)", act_type: "MODEL_LAW", committee_name: "E Committee", is_core: true }, as: AssociationStaff, captures: { a2: $.data.id } }
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${a2}", comment_window_start: "2026-11-01T00:00:00Z", comment_window_end: "2026-12-01T00:00:00Z" }, as: AssociationStaff, captures: { d2: $.data.id } }
            - { call: "POST /naic/_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: AssociationStaff }
            - { call: "POST /naic/exposure-drafts/${d2}/close", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/model-acts/${a2}/ballots", payload: { state_code: "CA", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_ca_id}" }
            - { call: "POST /naic/model-acts/${a2}/close-ballot", payload: {}, as: AssociationStaff }
          trigger:
            - { call: "POST /naic/model-acts/${a2}/publish", payload: {}, as: AssociationStaff }
            - { call: "GET /naic/model-acts/${a1}", payload: {}, as: AssociationStaff, captures: { a1_st: $.data.status } }
            - { call: "GET /naic/model-acts/${a1}/adoptions", payload: {}, as: AssociationStaff, captures: { ad1_st: "$.data[0].status" } }
            - { call: "GET /naic/states/${s_ca_id}", payload: {}, as: AssociationStaff, captures: { cov_after: $.data.core_act_coverage_pct } }
            - { call: "GET /naic/states/${s_ca_id}/reviews", payload: {}, as: AssociationStaff, captures: { rv_origin: "$.data[0].origin", rv_st: "$.data[0].status" } }
          assert:
            - "coverage before publish == 100.0"
            - "ModelAct.${a1}.status == SUPERSEDED (hop 1)"
            - "StateAdoption.${ad1}.status == SUPERSEDED (hop 2)"
            - "State.${s_ca_id}.core_act_coverage_pct == 0.0 (hop 3: v1 adoption superseded, only PUBLISHED core act is v2)"
            - "an AccreditationReview with origin == AUTO_COVERAGE and status == SCHEDULED exists for CA (hop 4: 0.0 < MIN_COVERAGE_PCT 50.0 while ACCREDITED)"
      - name: validate_rbc_supervision_escalation_cascade
        grounds:
          - state_machines.FinancialFiling.SUBMITTED_to_VALIDATED
          - state_machines.Insurer.ACTIVE_to_UNDER_SUPERVISION
          - entities.MarketConductResponse.fields.escalation_flag
        distinguishing_aspect: |
          Depth-3 chain triggered by filing validate: validate pass ->
          RBCReport created (hop 1) -> insurer status recomputed to
          UNDER_SUPERVISION (hop 2) -> the insurer's open-call responses get
          escalation_flag := true (hop 3). Companion cascade
          (publish_supersede_coverage_cascade) starts from a different
          trigger (publish).
        test_recipe:
          setup:
            - "State CA; call MC-300 OPEN led by CA; insurer 90030 (no filings yet) has responded to MC-300 with escalation_flag == false"
            - "Standard VM-20 v2026.1 ACTIVE; a SUBMITTED filing with surplus 1600000 and charges 1200000/1200000/0 awaits validation (expected ratio 0.9428 -> AUTHORIZED_CONTROL)"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/insurers", payload: { naic_code: "90030", name: "Insurer Thirty", domicile_state_code: "CA" }, as: AssociationStaff, captures: { ins_id: $.data.id, ins_v: $.data.version } }
            - { call: "POST /naic/market-conduct-calls", payload: { call_code: "MC-300", topic: "underwriting", total_cost_cents: 100000 }, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { call_id: $.data.id } }
            - { call: "POST /naic/market-conduct-calls/${call_id}/responses", payload: { direct_premium_cents: 100000000, complaint_count: 0 }, as: InsurerUser, as_user_id: "${ins_id}", captures: { resp_id: $.data.id, esc0: $.data.escalation_flag } }
            - { call: "POST /naic/valuation-standards", payload: { code: "VM-20", version_label: "v2026.1", guidance_text: "g" }, as: Actuary, as_user_id: "actuary-1", captures: { std_id: $.data.id } }
            - { call: "POST /naic/valuation-standards/${std_id}/activate", payload: {}, as: Actuary, as_user_id: "actuary-2" }
            - { call: "POST /naic/filings", payload: { insurer_id: "${ins_id}", period_year: 2026, period_quarter: "ANNUAL", valuation_standard_code: "VM-20", reported_surplus_cents: 1600000, asset_risk_cents: 1200000, underwriting_risk_cents: 1200000, other_risk_cents: 0, expected_insurer_version: "${ins_v}" }, as: InsurerUser, as_user_id: "${ins_id}", captures: { f_id: $.data.id } }
            - { call: "POST /naic/filings/${f_id}/submit", payload: {}, as: InsurerUser, as_user_id: "${ins_id}" }
          trigger:
            - { call: "POST /naic/filings/${f_id}/validate", payload: {}, as: AssociationStaff }
            - { call: "GET /naic/filings/${f_id}/rbc-reports", payload: {}, as: AssociationStaff, captures: { lvl: "$.data[0].action_level", ratio: "$.data[0].ratio_covariance" } }
            - { call: "GET /naic/insurers/${ins_id}", payload: {}, as: AssociationStaff, captures: { ins_st: $.data.status } }
            - { call: "GET /naic/market-conduct-calls/${call_id}/responses", payload: {}, as: AssociationStaff, captures: { esc1: "$.data[0].escalation_flag" } }
          assert:
            - "escalation_flag at creation == false (insurer was ACTIVE)"
            - "RBCReport.ratio_covariance == 0.9428 and action_level == AUTHORIZED_CONTROL (hop 1)"
            - "Insurer.${ins_id}.status == UNDER_SUPERVISION (hop 2)"
            - "MarketConductResponse.${resp_id}.escalation_flag == true after the cascade (hop 3)"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: draft_create_state_beats_window_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=21]
          - errors[ERR_ACT_NOT_OPEN_FOR_EXPOSURE]
          - errors[ERR_COMMENT_WINDOW_TOO_SHORT]
        distinguishing_aspect: |
          Error-category pair (state, business_constraint): the request
          violates both the act-state gate (act is BALLOTING) and the
          30-day window minimum (10-day window); priority 6 beats 21, so
          ERR_ACT_NOT_OPEN_FOR_EXPOSURE wins. Companion instance
          (review_create_rotation_beats_temporal_overlap) exercises the
          disjoint pair (business_safety, business_temporal).
        test_recipe:
          setup:
            - "Act MDL-701 v1 has been exposed and closed; act is BALLOTING"
          setup_api_calls:
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-701", version_label: "v1", title: "Model Claims Act", act_type: "MODEL_REGULATION", committee_name: "C Committee", is_core: false }, as: AssociationStaff, captures: { act_id: $.data.id } }
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${act_id}", comment_window_start: "2026-09-01T00:00:00Z", comment_window_end: "2026-10-01T00:00:00Z" }, as: AssociationStaff, captures: { d1: $.data.id } }
            - { call: "POST /naic/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: AssociationStaff }
            - { call: "POST /naic/exposure-drafts/${d1}/close", payload: {}, as: AssociationStaff }
          trigger:
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${act_id}", comment_window_start: "2026-11-01T00:00:00Z", comment_window_end: "2026-11-11T00:00:00Z" }, as: AssociationStaff, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ACT_NOT_OPEN_FOR_EXPOSURE (state gate reported, not ERR_COMMENT_WINDOW_TOO_SHORT)"
      - name: review_create_rotation_beats_temporal_overlap
        grounds:
          - validations[priority=18]
          - validations[priority=28]
          - errors[ERR_REVIEWER_ROTATION_REQUIRED]
          - errors[ERR_REVIEW_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Error-category pair (business_safety, business_temporal): the
          request violates reviewer rotation (same lead as the state's most
          recent FINAL review) and the period overlaps an existing review;
          priority 18 beats 28, so ERR_REVIEWER_ROTATION_REQUIRED wins.
          Companion instance exercises the disjoint pair
          (state, business_constraint).
        test_recipe:
          setup:
            - "State CA has a FINAL_PASS review led by lead-1 over [2026-01-01, 2026-06-30]"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/reviews", payload: { state_id: "${s_ca_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", team_lead_id: "lead-1", self_assessment_compliant: 0, self_assessment_total: 1 }, as: AssociationStaff, captures: { rv1: $.data.id } }
            - { call: "POST /naic/reviews/${rv1}/issue-findings", payload: { findings_compliant: 20, findings_total: 20 }, as: ReviewTeamLead, as_user_id: "lead-1" }
            - { call: "POST /naic/reviews/${rv1}/finalize", payload: {}, as: AssociationStaff }
          trigger:
            - { call: "POST /naic/reviews", payload: { state_id: "${s_ca_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", team_lead_id: "lead-1", self_assessment_compliant: 0, self_assessment_total: 1 }, as: AssociationStaff, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_REVIEWER_ROTATION_REQUIRED (safety gate reported, not ERR_REVIEW_WINDOW_OVERLAP)"
  - rule_id: boundary_precision_check
    instances:
      - name: ballot_supermajority_count_boundary
        grounds:
          - calculations.ballot_adoption_rule
          - entities.ModelAct.fields.favorable_votes
        distinguishing_aspect: |
          Discrete vote-count boundary on POST close-ballot: with 5 votes
          cast, ceil(2/3 x 5) == 4 YEA required; exactly 3 YEA fails the
          supermajority even though quorum (3) is met. Companion instance
          (rbc_ratio_two_hundred_percent_boundary) is a continuous-ratio
          boundary on a different endpoint (filing validate).
        test_recipe:
          setup:
            - "Five ACCREDITED states CA/NV/OR/WA/AZ (eligible_count 5, quorum 3); act MDL-702 v1 is BALLOTING with 5 CAST ballots: 3 YEA, 2 NAY"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca: $.data.id } }
            - { call: "POST /naic/states", payload: { code: "NV", name: "Nevada" }, as: AssociationStaff, captures: { s_nv: $.data.id } }
            - { call: "POST /naic/states", payload: { code: "OR", name: "Oregon" }, as: AssociationStaff, captures: { s_or: $.data.id } }
            - { call: "POST /naic/states", payload: { code: "WA", name: "Washington" }, as: AssociationStaff, captures: { s_wa: $.data.id } }
            - { call: "POST /naic/states", payload: { code: "AZ", name: "Arizona" }, as: AssociationStaff, captures: { s_az: $.data.id } }
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-702", version_label: "v1", title: "Model Adjuster Act", act_type: "MODEL_LAW", committee_name: "C Committee", is_core: false }, as: AssociationStaff, captures: { act_id: $.data.id } }
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${act_id}", comment_window_start: "2026-09-01T00:00:00Z", comment_window_end: "2026-10-01T00:00:00Z" }, as: AssociationStaff, captures: { d1: $.data.id } }
            - { call: "POST /naic/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: AssociationStaff }
            - { call: "POST /naic/exposure-drafts/${d1}/close", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "CA", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_ca}" }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "NV", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_nv}" }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "OR", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_or}" }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "WA", vote: "NAY" }, as: StateRegulator, as_user_id: "${s_wa}" }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "AZ", vote: "NAY" }, as: StateRegulator, as_user_id: "${s_az}" }
          trigger:
            - { call: "POST /naic/model-acts/${act_id}/close-ballot", payload: {}, as: AssociationStaff, captures: { st: $.data.status, vc: $.data.votes_cast, fv: $.data.favorable_votes } }
          assert:
            - "ModelAct.${act_id}.votes_cast == 5 and favorable_votes == 3"
            - "ModelAct.${act_id}.status == DRAFTING because 3 < ceil(2/3 x 5) == 4 (quorum 3 was met; only the supermajority fails)"
      - name: rbc_ratio_two_hundred_percent_boundary
        grounds:
          - calculations.rbc_action_level
          - entities.RBCReport.fields.action_level
        distinguishing_aspect: |
          Continuous-ratio boundary on POST filing validate: ratio exactly
          2.0000 classifies NONE while 1.9999 classifies COMPANY_ACTION
          (lower-inclusive bands). Companion instance
          (ballot_supermajority_count_boundary) is a discrete vote-count
          boundary on a different endpoint (close-ballot).
        test_recipe:
          setup:
            - "State CA; insurers 90040 and 90041; standard VM-20 v2026.1 ACTIVE"
            - "Two SUBMITTED filings: A surplus 4000000 charge 2000000 (ratio exactly 2.0000); B surplus 3999800 charge 2000000 (ratio 1.9999)"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/insurers", payload: { naic_code: "90040", name: "A", domicile_state_code: "CA" }, as: AssociationStaff, captures: { ins_a: $.data.id, ins_a_v: $.data.version } }
            - { call: "POST /naic/insurers", payload: { naic_code: "90041", name: "B", domicile_state_code: "CA" }, as: AssociationStaff, captures: { ins_b: $.data.id, ins_b_v: $.data.version } }
            - { call: "POST /naic/valuation-standards", payload: { code: "VM-20", version_label: "v2026.1", guidance_text: "g" }, as: Actuary, as_user_id: "actuary-1", captures: { std_id: $.data.id } }
            - { call: "POST /naic/valuation-standards/${std_id}/activate", payload: {}, as: Actuary, as_user_id: "actuary-2" }
            - { call: "POST /naic/filings", payload: { insurer_id: "${ins_a}", period_year: 2026, period_quarter: "ANNUAL", valuation_standard_code: "VM-20", reported_surplus_cents: 4000000, asset_risk_cents: 2000000, underwriting_risk_cents: 0, other_risk_cents: 0, expected_insurer_version: "${ins_a_v}" }, as: InsurerUser, as_user_id: "${ins_a}", captures: { fa: $.data.id } }
            - { call: "POST /naic/filings/${fa}/submit", payload: {}, as: InsurerUser, as_user_id: "${ins_a}" }
            - { call: "POST /naic/filings", payload: { insurer_id: "${ins_b}", period_year: 2026, period_quarter: "ANNUAL", valuation_standard_code: "VM-20", reported_surplus_cents: 3999800, asset_risk_cents: 2000000, underwriting_risk_cents: 0, other_risk_cents: 0, expected_insurer_version: "${ins_b_v}" }, as: InsurerUser, as_user_id: "${ins_b}", captures: { fb: $.data.id } }
            - { call: "POST /naic/filings/${fb}/submit", payload: {}, as: InsurerUser, as_user_id: "${ins_b}" }
          trigger:
            - { call: "POST /naic/filings/${fa}/validate", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/filings/${fb}/validate", payload: {}, as: AssociationStaff }
            - { call: "GET /naic/filings/${fa}/rbc-reports", payload: {}, as: AssociationStaff, captures: { ra_ratio: "$.data[0].ratio_covariance", ra_lvl: "$.data[0].action_level" } }
            - { call: "GET /naic/filings/${fb}/rbc-reports", payload: {}, as: AssociationStaff, captures: { rb_ratio: "$.data[0].ratio_covariance", rb_lvl: "$.data[0].action_level" } }
          assert:
            - "filing A ratio_covariance == 2.0 and action_level == NONE (2.0000 >= 2.0000)"
            - "filing B ratio_covariance == 1.9999 and action_level == COMPANY_ACTION (1.9999 < 2.0000)"
  - rule_id: cross_entity_state_dependency
    instances:
      - name: adoption_requires_published_act
        grounds:
          - validations[priority=10]
          - state_machines.ModelAct.ADOPTED_to_PUBLISHED
          - errors[ERR_ACT_NOT_PUBLISHED]
        distinguishing_aspect: |
          Entity pair (StateAdoption, ModelAct): adoption create is gated on
          the ACT's status — ADOPTED is rejected with ERR_ACT_NOT_PUBLISHED,
          and only after publish does the identical request succeed.
          Companion instance (license_issue_blocked_when_state_suspended)
          crosses the disjoint pair (ProducerLicense, State).
        test_recipe:
          setup:
            - "State CA (version captured); act MDL-703 v1 is ADOPTED but not yet PUBLISHED"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id, s_ca_v: $.data.version } }
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-703", version_label: "v1", title: "Model Rebating Act", act_type: "MODEL_LAW", committee_name: "D Committee", is_core: false }, as: AssociationStaff, captures: { act_id: $.data.id } }
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${act_id}", comment_window_start: "2026-09-01T00:00:00Z", comment_window_end: "2026-10-01T00:00:00Z" }, as: AssociationStaff, captures: { d1: $.data.id } }
            - { call: "POST /naic/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: AssociationStaff }
            - { call: "POST /naic/exposure-drafts/${d1}/close", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/model-acts/${act_id}/ballots", payload: { state_code: "CA", vote: "YEA" }, as: StateRegulator, as_user_id: "${s_ca_id}" }
            - { call: "POST /naic/model-acts/${act_id}/close-ballot", payload: {}, as: AssociationStaff, captures: { act_st: $.data.status } }
          trigger:
            - { call: "POST /naic/adoptions", payload: { model_act_id: "${act_id}", state_code: "CA", adopted_citation: "CIC 703", enacted_on: "2026-11-01T00:00:00Z", expected_state_version: "${s_ca_v}" }, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { err: $.data.error_id } }
            - { call: "POST /naic/model-acts/${act_id}/publish", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/adoptions", payload: { model_act_id: "${act_id}", state_code: "CA", adopted_citation: "CIC 703", enacted_on: "2026-11-01T00:00:00Z", expected_state_version: "${s_ca_v}" }, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { ad_id: $.data.id, ad_st: $.data.status } }
          assert:
            - "first adoption attempt fails with ERR_ACT_NOT_PUBLISHED (act was ADOPTED, not PUBLISHED)"
            - "act.status at close-ballot == ADOPTED (the gating state)"
            - "after publish, the identical adoption payload succeeds: status == PENDING_CERTIFICATION"
      - name: license_issue_blocked_when_state_suspended
        grounds:
          - validations[priority=26]
          - state_machines.State.PROBATION_to_SUSPENDED
          - errors[ERR_STATE_SUSPENDED]
        distinguishing_aspect: |
          Entity pair (ProducerLicense, State): license issue is gated on
          the licensing STATE's accreditation_status — two failed reviews
          push CA to SUSPENDED and issue is rejected with
          ERR_STATE_SUSPENDED. Companion instance
          (adoption_requires_published_act) crosses the disjoint pair
          (StateAdoption, ModelAct).
        test_recipe:
          setup:
            - "State CA is SUSPENDED (two consecutive FINAL_FAIL reviews)"
            - "Producer P-1 holds an APPLIED LIFE license for CA"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/reviews", payload: { state_id: "${s_ca_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", team_lead_id: "lead-1", self_assessment_compliant: 0, self_assessment_total: 1 }, as: AssociationStaff, captures: { rv1: $.data.id } }
            - { call: "POST /naic/reviews/${rv1}/issue-findings", payload: { findings_compliant: 10, findings_total: 20 }, as: ReviewTeamLead, as_user_id: "lead-1" }
            - { call: "POST /naic/reviews/${rv1}/finalize", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/reviews", payload: { state_id: "${s_ca_id}", period_start: "2026-12-27T00:00:00Z", period_end: "2027-06-30T00:00:00Z", team_lead_id: "lead-2", self_assessment_compliant: 0, self_assessment_total: 1 }, as: AssociationStaff, captures: { rv2: $.data.id } }
            - { call: "POST /naic/reviews/${rv2}/issue-findings", payload: { findings_compliant: 5, findings_total: 20 }, as: ReviewTeamLead, as_user_id: "lead-2" }
            - { call: "POST /naic/reviews/${rv2}/finalize", payload: {}, as: AssociationStaff }
            - { call: "POST /naic/producers", payload: { npn: "P-1", full_name: "Producer One", home_state_code: "CA" }, as: AssociationStaff, captures: { pr_id: $.data.id } }
            - { call: "POST /naic/licenses", payload: { producer_id: "${pr_id}", state_code: "CA", license_class: "LIFE", effective_from: "2027-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: ProducerUser, as_user_id: "${pr_id}", captures: { lic_id: $.data.id } }
          trigger:
            - { call: "POST /naic/licenses/${lic_id}/issue", payload: {}, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { err: $.data.error_id } }
            - { call: "GET /naic/states/${s_ca_id}", payload: {}, as: AssociationStaff, captures: { st: $.data.accreditation_status } }
          assert:
            - "error_id == ERR_STATE_SUSPENDED"
            - "State.${s_ca_id}.accreditation_status == SUSPENDED (the cross-entity gate)"
            - "ProducerLicense.${lic_id}.status remains APPLIED"
  - rule_id: resource_temporal_overlap
    instances:
      - name: exposure_window_half_open_adjacency
        grounds:
          - validations[priority=27]
          - entities.ExposureDraft.fields.comment_window_start
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) on the ModelAct
          exposure timeline — a new draft starting exactly at the previous
          draft's end is legal, while one second of intersection is
          rejected. Companion instance
          (review_period_closed_interval_min_gap) uses closed intervals plus
          a mandatory buffer on a different resource (State review calendar).
        test_recipe:
          setup:
            - "Act MDL-704 v1 is EXPOSURE_OPEN with draft 1 OPEN over [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /naic/model-acts", payload: { model_code: "MDL-704", version_label: "v1", title: "Model Cyber Act", act_type: "MODEL_REGULATION", committee_name: "H Committee", is_core: false }, as: AssociationStaff, captures: { act_id: $.data.id } }
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${act_id}", comment_window_start: "2026-09-01T00:00:00Z", comment_window_end: "2026-10-01T00:00:00Z" }, as: AssociationStaff, captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${act_id}", comment_window_start: "2026-10-01T00:00:00Z", comment_window_end: "2026-10-31T00:00:00Z" }, as: AssociationStaff, captures: { d2: $.data.id, d2_num: $.data.exposure_number, d2_st: $.data.status } }
            - { call: "POST /naic/exposure-drafts", payload: { model_act_id: "${act_id}", comment_window_start: "2026-10-15T00:00:00Z", comment_window_end: "2026-11-15T00:00:00Z" }, as: AssociationStaff, captures: { err: $.data.error_id } }
          assert:
            - "adjacent draft (start == prior end) is created: exposure_number == 2, status OPEN (half-open adjacency legal)"
            - "overlapping draft (2026-10-15 intersects [10-01, 10-31)) fails with ERR_EXPOSURE_WINDOW_OVERLAP"
      - name: review_period_closed_interval_min_gap
        grounds:
          - validations[priority=28]
          - entities.AccreditationReview.fields.period_start
        distinguishing_aspect: |
          Interval semantics: CLOSED [start, end] on the State review
          calendar PLUS a mandatory 180-day buffer — touching the prior
          period_end overlaps (unlike half-open adjacency), and a
          non-overlapping start 179 days out still fails the gap rule while
          180 days succeeds. Companion instance
          (exposure_window_half_open_adjacency) uses half-open intervals on
          a different resource (ModelAct exposure timeline).
        test_recipe:
          setup:
            - "State CA has a FINAL_PASS review over closed period [2026-01-01, 2026-06-30]"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/reviews", payload: { state_id: "${s_ca_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", team_lead_id: "lead-1", self_assessment_compliant: 0, self_assessment_total: 1 }, as: AssociationStaff, captures: { rv1: $.data.id } }
            - { call: "POST /naic/reviews/${rv1}/issue-findings", payload: { findings_compliant: 20, findings_total: 20 }, as: ReviewTeamLead, as_user_id: "lead-1" }
            - { call: "POST /naic/reviews/${rv1}/finalize", payload: {}, as: AssociationStaff }
          trigger:
            - { call: "POST /naic/reviews", payload: { state_id: "${s_ca_id}", period_start: "2026-06-30T00:00:00Z", period_end: "2026-12-31T00:00:00Z", team_lead_id: "lead-2", self_assessment_compliant: 0, self_assessment_total: 1 }, as: AssociationStaff, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /naic/reviews", payload: { state_id: "${s_ca_id}", period_start: "2026-12-26T00:00:00Z", period_end: "2027-06-30T00:00:00Z", team_lead_id: "lead-2", self_assessment_compliant: 0, self_assessment_total: 1 }, as: AssociationStaff, captures: { err_gap: $.data.error_id } }
            - { call: "POST /naic/reviews", payload: { state_id: "${s_ca_id}", period_start: "2026-12-27T00:00:00Z", period_end: "2027-06-30T00:00:00Z", team_lead_id: "lead-2", self_assessment_compliant: 0, self_assessment_total: 1 }, as: AssociationStaff, captures: { rv_ok: $.data.id, rv_ok_st: $.data.status } }
          assert:
            - "start == prior period_end fails with ERR_REVIEW_WINDOW_OVERLAP (closed intervals share the boundary day)"
            - "start 179 days after prior period_end fails with ERR_REVIEW_GAP_TOO_SHORT"
            - "start exactly 180 days after prior period_end succeeds with status SCHEDULED"
  - rule_id: compensating_invariant
    instances:
      - name: license_issue_revoke_count_invariant
        grounds:
          - state_machines.ProducerLicense.APPLIED_to_ISSUED
          - state_machines.ProducerLicense.ISSUED_to_REVOKED
          - entities.Producer.fields.active_license_count
        distinguishing_aspect: |
          Conserved quantity is a COUNT: issue (forward) raises
          Producer.active_license_count to 1 and its compensating revoke
          returns it to exactly its pre-issue value 0 — no drift. Companion
          instance (filing_supersede_surplus_sum_invariant) conserves a
          MONETARY sum, a different quantity type.
        test_recipe:
          setup:
            - "State CA (ACCREDITED); producer P-2 with active_license_count == 0; one APPLIED LIFE license for CA over [2027-01-01, 2028-01-01]"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/producers", payload: { npn: "P-2", full_name: "Producer Two", home_state_code: "CA" }, as: AssociationStaff, captures: { pr_id: $.data.id, cnt0: $.data.active_license_count } }
            - { call: "POST /naic/licenses", payload: { producer_id: "${pr_id}", state_code: "CA", license_class: "LIFE", effective_from: "2027-01-01T00:00:00Z", valid_until: "2028-01-01T00:00:00Z" }, as: ProducerUser, as_user_id: "${pr_id}", captures: { lic_id: $.data.id } }
          trigger:
            - { call: "POST /naic/licenses/${lic_id}/issue", payload: {}, as: StateRegulator, as_user_id: "${s_ca_id}" }
            - { call: "GET /naic/producers/${pr_id}", payload: {}, as: AssociationStaff, captures: { cnt1: $.data.active_license_count } }
            - { call: "POST /naic/licenses/${lic_id}/revoke", payload: {}, as: StateRegulator, as_user_id: "${s_ca_id}", captures: { lic_st: $.data.status } }
            - { call: "GET /naic/producers/${pr_id}", payload: {}, as: AssociationStaff, captures: { cnt2: $.data.active_license_count } }
          assert:
            - "Producer.active_license_count == 0 before issue"
            - "Producer.active_license_count == 1 after issue (forward action)"
            - "Producer.active_license_count == 0 after revoke (compensating action restores the count exactly)"
            - "ProducerLicense.${lic_id}.status == REVOKED"
      - name: filing_supersede_surplus_sum_invariant
        grounds:
          - state_machines.FinancialFiling.VALIDATED_to_SUPERSEDED
          - concurrency_rules[filing-refile-stale-insurer]
          - entities.FinancialFiling.fields.reported_surplus_cents
        distinguishing_aspect: |
          Conserved quantity is a MONETARY SUM: re-creating a filing for an
          already-used period (forward) plus the automatic supersession of
          the prior filing (compensating) leaves sum(reported_surplus_cents
          over non-SUPERSEDED filings of the period) equal to the new
          filing's 6000000, never the additive 11000000. Companion instance
          (license_issue_revoke_count_invariant) conserves a count, a
          different quantity type.
        test_recipe:
          setup:
            - "State CA; insurer 90050; standard VM-20 v2026.1 ACTIVE"
            - "Filing 1 for (insurer, 2026, ANNUAL) with surplus 5000000 is VALIDATED"
          setup_api_calls:
            - { call: "POST /naic/states", payload: { code: "CA", name: "California" }, as: AssociationStaff, captures: { s_ca_id: $.data.id } }
            - { call: "POST /naic/insurers", payload: { naic_code: "90050", name: "Insurer Fifty", domicile_state_code: "CA" }, as: AssociationStaff, captures: { ins_id: $.data.id, ins_v: $.data.version } }
            - { call: "POST /naic/valuation-standards", payload: { code: "VM-20", version_label: "v2026.1", guidance_text: "g" }, as: Actuary, as_user_id: "actuary-1", captures: { std_id: $.data.id } }
            - { call: "POST /naic/valuation-standards/${std_id}/activate", payload: {}, as: Actuary, as_user_id: "actuary-2" }
            - { call: "POST /naic/filings", payload: { insurer_id: "${ins_id}", period_year: 2026, period_quarter: "ANNUAL", valuation_standard_code: "VM-20", reported_surplus_cents: 5000000, asset_risk_cents: 100000, underwriting_risk_cents: 50000, other_risk_cents: 25000, expected_insurer_version: "${ins_v}" }, as: InsurerUser, as_user_id: "${ins_id}", captures: { f1: $.data.id } }
            - { call: "POST /naic/filings/${f1}/submit", payload: {}, as: InsurerUser, as_user_id: "${ins_id}" }
            - { call: "POST /naic/filings/${f1}/validate", payload: {}, as: AssociationStaff }
            - { call: "GET /naic/insurers/${ins_id}", payload: {}, as: AssociationStaff, captures: { ins_v2: $.data.version } }
          trigger:
            - { call: "POST /naic/filings", payload: { insurer_id: "${ins_id}", period_year: 2026, period_quarter: "ANNUAL", valuation_standard_code: "VM-20", reported_surplus_cents: 6000000, asset_risk_cents: 100000, underwriting_risk_cents: 50000, other_risk_cents: 25000, expected_insurer_version: "${ins_v2}" }, as: InsurerUser, as_user_id: "${ins_id}", captures: { f2: $.data.id, f2_st: $.data.status } }
            - { call: "GET /naic/filings/${f1}", payload: {}, as: AssociationStaff, captures: { f1_st: $.data.status } }
            - { call: "GET /naic/insurers/${ins_id}", payload: {}, as: AssociationStaff, captures: { ins_ratio: $.data.latest_rbc_ratio } }
          assert:
            - "FinancialFiling.${f1}.status == SUPERSEDED (compensating retirement)"
            - "exactly one filing for (insurer, 2026, ANNUAL) has status != SUPERSEDED, namely ${f2} in DRAFT"
            - "sum of reported_surplus_cents over non-SUPERSEDED filings of the period == 6000000, not 11000000"
            - "Insurer.${ins_id}.latest_rbc_ratio == null (cleared because the VALIDATED filing was superseded and the successor is unvalidated)"






