  # =========================================================================
  - section: errors
    instances:

      - name: every_collection_has_its_own_not_found_error
        claim_type: triggerable_error
        grounds:
          - errors[ERR_CHANNEL_NOT_FOUND .. ERR_RETRAINING_ASSIGNMENT_NOT_FOUND]
          - validations[priority 4]
          - validations[priority 5]
        distinguishing_aspect: "The catalog carries twelve distinct 404 identifiers and each collection returns its own: the same unknown id 00000000-0000-4000-8000-000000000001 yields ERR_CHANNEL_NOT_FOUND, ERR_GALLERY_NOT_FOUND, ERR_REPRESENTATIVE_NOT_FOUND, ERR_PROSPECT_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_PRESENTATION_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_FINANCING_APPLICATION_NOT_FOUND, ERR_RESCISSION_REQUEST_NOT_FOUND, ERR_REFUND_DISBURSEMENT_NOT_FOUND, ERR_CLOSING_PACKAGE_NOT_FOUND and ERR_RETRAINING_ASSIGNMENT_NOT_FOUND depending on the collection addressed, and a body foreign key resolves to the same identifier as a path id."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z; the store is empty of every entity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /tour-channels/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: MarketingManager
              captures: { e1: "$.data.error_id" }
            - call: "GET /sales-galleries/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: GalleryManager
            - call: "GET /sales-representatives/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: GalleryManager
            - call: "GET /prospects/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: MarketingManager
            - call: "GET /tour-bookings/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: MarketingManager
            - call: "GET /sales-presentations/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "GET /purchase-agreements/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ContractAdministrator
              as_user_id: "admin-intake"
            - call: "GET /financing-applications/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ContractAdministrator
              as_user_id: "admin-underwriter"
            - call: "GET /rescission-requests/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ContractAdministrator
              as_user_id: "admin-intake"
            - call: "GET /refund-disbursements/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ContractAdministrator
              as_user_id: "admin-disburser"
            - call: "GET /closing-packages/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ContractAdministrator
              as_user_id: "admin-funder"
            - call: "GET /retraining-assignments/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /sales-representatives"
              payload: { gallery_id: "00000000-0000-4000-8000-000000000001", full_name: "Dana Reyes", license_number: "FL-SL-410077", rotation_position: 1 }
              as: GalleryManager
          assert:
            - "triggers 1-12 each return 404, and ${e1} == ERR_CHANNEL_NOT_FOUND"
            - "trigger 2 returns ERR_GALLERY_NOT_FOUND, trigger 3 ERR_REPRESENTATIVE_NOT_FOUND, trigger 4 ERR_PROSPECT_NOT_FOUND, trigger 5 ERR_BOOKING_NOT_FOUND, trigger 6 ERR_PRESENTATION_NOT_FOUND"
            - "trigger 7 returns ERR_AGREEMENT_NOT_FOUND, trigger 8 ERR_FINANCING_APPLICATION_NOT_FOUND, trigger 9 ERR_RESCISSION_REQUEST_NOT_FOUND, trigger 10 ERR_REFUND_DISBURSEMENT_NOT_FOUND, trigger 11 ERR_CLOSING_PACKAGE_NOT_FOUND, trigger 12 ERR_RETRAINING_ASSIGNMENT_NOT_FOUND"
            - "trigger 13 returns 404 with error_id ERR_GALLERY_NOT_FOUND -- an unresolvable body foreign key maps to the same identifier as an unresolvable path id"
            - "every error body is shaped { data: { error_id, message } } with response_type error"

      - name: logical_clock_rejects_backward_time_but_accepts_a_replay
        claim_type: triggerable_error
        grounds:
          - errors[ERR_CLOCK_NOT_MONOTONIC]
          - validations[priority 22]
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "Only a strictly earlier value is refused: from 2026-08-10T00:00:00Z a request for 2026-08-09T23:59:59Z returns 422 ERR_CLOCK_NOT_MONOTONIC and leaves the clock at 2026-08-10T00:00:00Z, while re-submitting the identical current value succeeds."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z then advanced to 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
