            - { call: "POST /preservation/properties", payload: { servicer_id: "${sv}", address_line1: "20 Test Dale", municipality_code: "COL", state_code: "OH", zip: "43215", investor_type: "FHA", lot_size_sqft: 6000, heating_system: "FORCED_AIR", fixture_count: 8 }, as: VendorAdmin, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /preservation/work-orders", payload: { property_id: "${p}", order_type: "DEWINTERIZATION", due_date: "2026-01-20" }, as: Servicer, as_user_id: "${sv}", captures: { est: $.data.estimated_cost_cents } }
          assert:
            - "est == 12300 — half base, seasonal multiplier suppressed for dewinterization"

