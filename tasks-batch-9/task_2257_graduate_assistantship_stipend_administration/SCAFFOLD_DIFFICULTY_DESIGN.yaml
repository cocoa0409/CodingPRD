      - name: pay_period_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - "validations[priority=23]"
          - "errors[ERR_PAY_PERIOD_OVERLAP]"
          - entities.PayPeriod.fields.period_end_exclusive
          - entities.PayPeriod.fields.workday_count
          - entities.AcademicTerm.fields.pay_period_count
        distinguishing_aspect: |
          PayPeriod windows are half-open, so a period starting exactly on the incumbent's
          period_end_exclusive (2026-10-01) is accepted as adjacent, while a period starting one day
          earlier (2026-09-30) overlaps by a single day and is rejected with ERR_PAY_PERIOD_OVERLAP -
          the opposite convention to the closed-closed Appointment windows tested in
          over_appointment_on_single_day_inclusive_window_touch.
        test_recipe:
          setup:
            - "Term PPO2026 (2026-09-01..2026-12-31, CALENDAR_DAY) still in PLANNING, since POST /pay-periods requires PLANNING."
            - "Exactly one existing PayPeriod: sequence_no 1, [2026-09-01, 2026-10-01), pay_date 2026-10-05, with calendar_day_count 30 and workday_count 22."
            - "AcademicTerm.pay_period_count is 1."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "PPO2026", term_start: "2026-09-01", term_end: "2026-12-31", tax_calendar_year: 2026, session_type: "IN_SESSION", proration_method: "CALENDAR_DAY", remission_drop_deadline: "2026-11-15" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { term_id: "$.data.id" }
            - call: "POST /pay-periods"
              payload: { term_id: "${term_id}", sequence_no: 1, period_start: "2026-09-01", period_end_exclusive: "2026-10-01", pay_date: "2026-10-05" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { pp1_id: "$.data.id" }
          trigger:
            - call: "POST /pay-periods"
              payload: { term_id: "${term_id}", sequence_no: 2, period_start: "2026-10-01", period_end_exclusive: "2026-11-01", pay_date: "2026-11-05" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { pp2_id: "$.data.id" }
            - call: "POST /pay-periods"
              payload: { term_id: "${term_id}", sequence_no: 3, period_start: "2026-09-30", period_end_exclusive: "2026-10-15", pay_date: "2026-10-20" }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "GET /academic-terms/${term_id}/pay-periods"
              payload: { limit: 10, offset: 0 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
          assert:
            - "The adjacent period returns HTTP 201: PayPeriod.${pp2_id}.period_start == 2026-10-01, calendar_day_count == 31, workday_count == 22, status == OPEN"
            - "The overlapping period returns HTTP 409 with data.error_id == ERR_PAY_PERIOD_OVERLAP"
            - "PayPeriod.${pp1_id}.calendar_day_count == 30 and PayPeriod.${pp1_id}.workday_count == 22"
            - "GET /academic-terms/${term_id}/pay-periods returns total_count == 2 with sequence_no values 1 and 2 in ascending order"
            - "AcademicTerm.${term_id}.pay_period_count == 2 and status == PLANNING"

