              as: AllocationManager
              captures: { a2_id: "$.data[0].id" }
            - call: "GET /allocation/assortment-actions"
              payload: { status: "PENDING" }
              as: AllocationManager
          assert:
            - "The sweep raises exactly 2 actions, both at store 0101, ordered SKU-1001 then SKU-2001 by sku_code ASC"
            - "AssortmentAction.${a1_id}.action_type == CONSOLIDATION with consolidation_target_store_id == ${s5_id} (store 0105) and markdown_pct_bp == null"
            - "0102 loses despite the highest sell-through among ACTIVE stores (9000): headroom = 24 - 22 - 0 = 2 is short of the 4 units to be moved, and the filter runs before the ranking"
            - "0107 loses despite an even higher 9500 and ample headroom, because its store status is REMODEL and the filter demands ACTIVE"
            - "Among the four survivors tied at 8000, grade rank A = 1 beats C = 3 and D = 4, eliminating 0103 and 0104; 0105 then beats the equally-graded 0106 on store_code ASC"
            - "The action snapshots the source, not the target: broken_size_count == 2, units_at_detection == 4 and trigger_reason == BROKEN_ASSORTMENT"
            - "AssortmentAction.${a2_id}.action_type == MARKDOWN with consolidation_target_store_id == null and markdown_pct_bp == 4500 (4 of 4 core sizes out)"
            - "That MARKDOWN is chosen even though 0103 holds a COMPLETE position of SKU-2001 with headroom 16: available_units == 0 empties the candidate set outright, because there is nothing to move"
            - "Both actions are PENDING and no TransferRecommendation exists yet - the sweep only recommends, and the consolidation transfer is created by execute"
      - name: money_rounding_placement_per_size_line
        claim_type: precision
        grounds:
          - calculations.transfer_benefit_usd.precision
          - calculations.transfer_landed_cost_usd.precision
        excluded_because:
          difficulty_instance: transfer_benefit_per_size_line_rounding_before_summation
          rationale: "That instance is entirely about where the rounding happens: it contrasts a single-size 6-unit transfer (78.29) with a two-size 4+2 split of the same 6 units (78.30) on identical inputs, which is only reproducible if ROUND_HALF_UP is applied per size line before summation, and it pins the two independent 2-decimal roundings of the freight and handling legs as well."
      - name: benefit_ratio_gate_at_and_one_bp_below_the_threshold
        claim_type: threshold
        grounds:
          - calculations.transfer_benefit_ratio_bp
          - validations[priority:34]
          - errors.ERR_BENEFIT_RATIO_BELOW_THRESHOLD
        excluded_because:
          difficulty_instance: benefit_ratio_threshold_equality_passes_one_bp_below_fails
          rationale: "The inclusive threshold is already probed there from both sides on the same dataset - a ratio exactly equal to transfer_min_ratio_bp is approved and a ratio one basis point lower is refused with ERR_BENEFIT_RATIO_BELOW_THRESHOLD while the recommendation stays PROPOSED."
      - name: forward_looking_pipeline_includes_on_order_units
        claim_type: forward_looking
        grounds:
          - calculations.store_need_units.variants[FORWARD_LOOKING]
          - entities.StorePosition.fields.on_order_units
        excluded_because:
          difficulty_instance: store_need_forward_looking_vs_historical_sell_through
          rationale: "The forward-looking arm is run there against the same four positions as the historical arm, which is what makes the on_order visibility and the pre-cover rounding observable; repeating it here would only restate that instance with fewer contrasts."
      - name: fixture_plan_interval_algebra_is_half_open
        claim_type: interval_merge
        grounds:
          - validations[priority:22]
          - validations[priority:25]
          - entities.FixturePlan.fields.effective_to
        excluded_because:
          difficulty_instance: fixture_plan_half_open_intervals_adjacency_versus_intersection
          rationale: "Five creations there cover adjacency at both ends, strict containment, the open-ended tail as +infinity and the (store, item_class) keying, plus the consumer-side ERR_NO_FIXTURE_PLAN_IN_EFFECT when no interval contains the clock."
      - name: derived_health_propagates_from_sizes_to_item
        claim_type: constraint_propagation
        grounds:
          - calculations.assortment_health_derivation
          - entities.SizeProfile.fields.core_size_count
          - entities.Item.fields.broken_store_count
        excluded_because:
          difficulty_instance: core_size_share_threshold_inclusive_and_zero_core_sizes_is_complete
          rationale: "The propagation chain size_on_hand -> broken_size_count -> assortment_status -> item counters -> lifecycle_state is walked there at the core-share boundary, including the degenerate curve with zero core sizes where an empty position is still COMPLETE."
      - name: need_variants_diverge_on_identical_positions
        claim_type: variant_divergence
        grounds:
          - calculations.store_need_units.variants
          - entities.AllocationRun.fields.need_basis
        excluded_because:
          difficulty_instance: store_need_forward_looking_vs_historical_sell_through
          rationale: "That instance runs both need_basis variants over one identical four-store dataset and pins a different spread for each, isolating the three declared differences: on_order visibility, rounding placement relative to COVER_WEEKS, and grade_index versus promo lift."
      - name: scorecard_basis_selected_from_body_then_program
        claim_type: variant_selection
        grounds:
          - calculations.cluster_scorecard.variants
          - entities.PerformanceSnapshot.fields.basis
          - entities.AllocationProgram.fields.scorecard_basis
        excluded_because:
          difficulty_instance: cluster_scorecard_simple_average_vs_unit_weighted
          rationale: "Selection is tested there in both directions - an explicit body basis overriding the program default, and an omitted basis inheriting it - with the two bases producing different in_stock and sell_through values on the same cluster."
      - name: ledger_reconciles_after_every_ledger_moving_call
        claim_type: reconciliation
        grounds:
          - calculations.receipt_unit_ledger_invariant
          - calculations.network_on_hand_invariant
        excluded_because:
          difficulty_instance: receipt_unit_ledger_survives_commit_recall_recommit_with_zero_drift
          rationale: "Reconciliation between the derived legs and their ancestor total is asserted there after every operation of a commit / recall / re-commit cycle, and its sibling instance does the same for NET(item) across the seven transfer calls."
  # section 1.4 validations: priority, conditionality and satisfaction
  - section: validations
    instances:
      - name: transfer_create_ladder_from_missing_auth_down_thirteen_priorities
        claim_type: priority_ordering
        grounds:
          - validations[priority:1]
          - validations[priority:2]
          - validations[priority:4]
          - validations[priority:6]
          - validations[priority:7]
          - validations[priority:9]
          - validations[priority:11]
          - validations[priority:21]
          - validations[priority:26]
          - validations[priority:29]
          - validations[priority:33]
          - endpoints.POST /allocation/transfer-recommendations
        distinguishing_aspect: |
          POST /allocation/transfer-recommendations is the one endpoint that sits under eleven distinct
          priority rungs, so the whole ladder can be walked on a single call shape with a single dataset.
          Every call violates its own rung AND every rung below it, which is the only construction that
          actually pins the order: a request with no headers, a bad role, an out-of-range units, two
          non-existent stores and two identical store ids must answer
          ERR_UNAUTHENTICATED and nothing else, and each subsequent call repairs exactly one rung so the
          next error surfaces. The peeling continues past the interesting middle - body shape before path
          and body FKs, FK existence before cross-program membership, program lock before optimistic
          concurrency, concurrency before the semantic same-store check, and the three business rejections
          in their declared 21 -> 26 -> 29 -> 33 order - and terminates in a 201 that proves the dataset was
          always capable of succeeding.
        test_recipe:
          setup:
            - "The logical clock is 2026-08-01T00:00:00Z"
            - "Program FA26 (ACTIVE) with stores 0101(A, freight 41.00), 0102(B, freight 38.00, sell-through 5800), 0103(C) and 0104(D); a SECOND program FA26 Kids Tops holds store 0201"
            - "Shelf plans: 0101 capacity 48 / pmin 12, 0102 capacity 24 / pmin 8, 0103 capacity 20 / pmin 8, 0104 capacity 20 / pmin 6"
            - "SKU-1001 (SEASONAL, retail 36.50) on TOP-4SZ (S 2000 / M 3500 / L 3000 / XL 1500)"
            - "Positions of SKU-1001: 0101 holds 20 (S 5 / M 7 / L 6 / XL 2) and is the donor; 0102 holds 6 (M 4 / L 2) so core S and XL are out; 0103 holds 4; 0104 holds 4 (S 1 / M 1 / L 1 / XL 1) and is COMPLETE"
            - "Store 0103 was moved to CLOSING - it may donate but may never receive"
            - "Every ladder call targets the same endpoint with the same body shape; only one field changes per rung"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
            - call: "POST /allocation/programs"
              payload: { name: "FA26 Core Tops", season_code: "FA26", banner_code: "NORTH" }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { prog_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0101", grade: "A", grade_index_bp: 13000, cluster_code: "URBAN", freight_flat_usd: 41.00, historical_sell_through_bp: 6500 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s1_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0102", grade: "B", grade_index_bp: 10000, cluster_code: "URBAN", freight_flat_usd: 38.00, historical_sell_through_bp: 5800 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s2_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0103", grade: "C", grade_index_bp: 12500, cluster_code: "SUBURBAN", freight_flat_usd: 42.00, historical_sell_through_bp: 4200 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s3_id: $.data.id }
            - call: "POST /allocation/stores"
              payload: { program_id: "${prog_id}", store_code: "0104", grade: "D", grade_index_bp: 11000, cluster_code: "SUBURBAN", freight_flat_usd: 55.00, historical_sell_through_bp: 3100 }
              as: PlanningAdmin
              as_user_id: "u-plan-1"
              captures: { s4_id: $.data.id }
            - call: "POST /allocation/fixture-plans"
              payload: { store_id: "${s1_id}", item_class: "APPAREL_TOP", effective_from: "2026-07-01T00:00:00Z", fixture_count: 4, facings_per_fixture: 3, units_per_facing: 4, presentation_min_units: 12 }
              as: PlanningAdmin
