  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: delivery_parallel_dimensions_independent
        grounds:
          - state_machines.Delivery.processing_status
          - state_machines.Delivery.regulatory_status
          - errors[ERR_DELIVERY_REGULATORY_HOLD]
        distinguishing_aspect: |
          Delivery carries PARALLEL state dimensions: processing_status and
          regulatory_status evolve independently on one row — a HELD delivery
          keeps processing_status RECEIVED, and releasing regulatory hold does
          not advance processing; sort operations guard on BOTH dimensions.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower, HAMLIN grove with CURRENT PASS maturity, pool OPEN wk 2026-07-27, JUICE channel present"
            - "Crew + assignment IN_PROGRESS; delivery 100 net boxes in RECEIVED x CLEAR"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-PD1", display_name: "Parallel Dim Groves" }, as: PackinghouseAdmin, captures: { pd_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${pd_g}", block_code: "B1", variety: HAMLIN, acreage: 50, county_code: "POLK" }, as: PackinghouseAdmin, captures: { pd_gr: "$.data.id", pd_gr_v: "$.data.version" } }
            - { call: "POST /packinghouse/groves/${pd_gr}/maturity-tests", payload: { sampled_at: "2026-07-31T10:00:00Z", brix: 9.0, acid_pct: 1.0, juice_pct: 45.0, expected_grove_version: "${pd_gr_v}" }, as: QualityInspector, as_user_id: "qi_pd1" }
            - { call: "POST /packinghouse/pools", payload: { variety: HAMLIN, week_start: "2026-07-27" }, as: PoolAccountant, captures: { pd_p: "$.data.id" } }
            - { call: "POST /packinghouse/allocation-channels", payload: { channel_code: "JU-PD1", channel_type: JUICE, destination_market: NONE, variety: HAMLIN, week_start: "2026-07-27", allocation_boxes: 0, price_cents_per_box: 220, priority_rank: 9, accepts_grades: ["FANCY", "CHOICE", "STANDARD", "JUICE"] }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/crews", payload: { crew_code: "CR-PD1", daily_capacity_boxes: 400 }, as: PackinghouseAdmin, captures: { pd_c: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments", payload: { crew_id: "${pd_c}", grove_id: "${pd_gr}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z", planned_boxes: 100 }, as: FieldSupervisor, captures: { pd_a: "$.data.id" } }
            - { call: "POST /packinghouse/harvest-assignments/${pd_a}/start", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/deliveries", payload: { grove_id: "${pd_gr}", assignment_id: "${pd_a}", gross_boxes: 100, tare_boxes: 0 }, as: FieldSupervisor, captures: { pd_d: "$.data.id" } }
          trigger:
            - { call: "POST /packinghouse/deliveries/${pd_d}/hold", payload: {}, as: ComplianceOfficer, as_user_id: "co_pd1" }
            - { call: "GET /packinghouse/deliveries/${pd_d}", payload: {}, as: ComplianceOfficer, captures: { pd_d_v2: "$.data.version" } }
            - { call: "POST /packinghouse/sort-runs", payload: { delivery_id: "${pd_d}", fancy_boxes: 90, choice_boxes: 0, standard_boxes: 0, juice_boxes: 10, cull_boxes: 0, color_score: 8, defect_pct: 5, expected_delivery_version: "${pd_d_v2}" }, as: LineOperator, as_user_id: "op_pd1", captures: { pd_err: "$.data.error_id" } }
            - { call: "POST /packinghouse/deliveries/${pd_d}/release", payload: {}, as: ComplianceOfficer, as_user_id: "co_pd1" }
            - { call: "GET /packinghouse/deliveries/${pd_d}", payload: {}, as: ComplianceOfficer, captures: { pd_d_v3: "$.data.version" } }
            - { call: "POST /packinghouse/sort-runs", payload: { delivery_id: "${pd_d}", fancy_boxes: 90, choice_boxes: 0, standard_boxes: 0, juice_boxes: 10, cull_boxes: 0, color_score: 8, defect_pct: 5, expected_delivery_version: "${pd_d_v3}" }, as: LineOperator, as_user_id: "op_pd1", captures: { pd_sr: "$.data.id" } }
            - { call: "POST /packinghouse/sort-runs/${pd_sr}/verify", payload: {}, as: QualityInspector, as_user_id: "qi_pd1" }
            - { call: "POST /packinghouse/sort-runs/${pd_sr}/post", payload: {}, as: LineOperator, as_user_id: "op_pd1" }
          assert:
            - "After hold: Delivery.${pd_d}.regulatory_status == HELD and processing_status == RECEIVED (processing dimension untouched)"
            - "Sort create while HELD fails with ${pd_err} == ERR_DELIVERY_REGULATORY_HOLD"
            - "After release: regulatory_status == RELEASED (a third value, distinct from the original CLEAR) and processing_status still == RECEIVED"
            - "After post: processing_status == SORTED and regulatory_status == RELEASED — both dimensions settled independently"

      - name: caretaking_invoice_dispute_reissue_cycle
        grounds:
          - state_machines.CaretakingInvoice.ISSUED_to_DISPUTED
          - state_machines.CaretakingInvoice.DISPUTED_to_ISSUED
          - state_machines.CaretakingInvoice.ISSUED_to_PAID
        distinguishing_aspect: |
          CaretakingInvoice is CYCLIC: ISSUED -> DISPUTED -> ISSUED revision
          loops may repeat; each loop re-opens the grower balance by exactly
          (adjusted_total - paid). Two full loops are exercised before final
          payment closes the cycle at PAID.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower GR-IC1 with enrolled grove (30 acres)"
            - "One MOW order 11.111 acres COMPLETED (line 20000); invoice created (total 20000) and ISSUED; grower caretaking_balance 20000"
          setup_api_calls:
            - { call: "POST /packinghouse/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PackinghouseAdmin }
            - { call: "POST /packinghouse/growers", payload: { grower_code: "GR-IC1", display_name: "Invoice Cycle Groves" }, as: PackinghouseAdmin, captures: { ic_g: "$.data.id" } }
            - { call: "POST /packinghouse/groves", payload: { grower_id: "${ic_g}", block_code: "B1", variety: HAMLIN, acreage: 30, county_code: "POLK", caretaking_enrolled: true }, as: PackinghouseAdmin, captures: { ic_gr: "$.data.id" } }
            - { call: "POST /packinghouse/caretaking-orders", payload: { grove_id: "${ic_gr}", service_type: MOW, service_date: "2026-08-01", acres_treated: 11.111 }, as: FieldSupervisor, captures: { ic_o: "$.data.id" } }
            - { call: "POST /packinghouse/caretaking-orders/${ic_o}/schedule", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/caretaking-orders/${ic_o}/complete", payload: {}, as: FieldSupervisor }
            - { call: "POST /packinghouse/caretaking-invoices", payload: { grower_id: "${ic_g}", period_start: "2026-08-01", period_end: "2026-08-31" }, as: PoolAccountant, captures: { ic_inv: "$.data.id" } }
            - { call: "POST /packinghouse/caretaking-invoices/${ic_inv}/issue", payload: {}, as: PoolAccountant }
          trigger:
            - { call: "POST /packinghouse/caretaking-invoices/${ic_inv}/dispute", payload: {}, as: Grower, as_user_id: "${ic_g}" }
            - { call: "POST /packinghouse/caretaking-invoices/${ic_inv}/reissue", payload: { adjusted_total_cents: 15000 }, as: PoolAccountant }
            - { call: "POST /packinghouse/caretaking-invoices/${ic_inv}/dispute", payload: {}, as: Grower, as_user_id: "${ic_g}" }
            - { call: "POST /packinghouse/caretaking-invoices/${ic_inv}/reissue", payload: { adjusted_total_cents: 12000 }, as: PoolAccountant }
            - { call: "POST /packinghouse/caretaking-invoices/${ic_inv}/payments", payload: { amount_cents: 12000 }, as: Grower, as_user_id: "${ic_g}" }
          assert:
            - "After first dispute: CaretakingInvoice.${ic_inv}.status == DISPUTED and Grower.${ic_g}.caretaking_balance_cents == 0 (20000 suspended)"
            - "After first reissue: status == ISSUED, total_cents == 15000, balance == 15000 (loop 1 closes)"
            - "After second dispute/reissue: status == ISSUED, total_cents == 12000, balance == 12000 (loop 2 closes — cycle repeats)"
            - "After payment of 12000: status == PAID, paid_cents == 12000, balance == 0"

      - name: export_lot_rework_loop
        grounds:
          - state_machines.ExportLot.INSPECTION_READY_to_REJECTED
          - state_machines.ExportLot.REJECTED_to_BUILDING
          - state_machines.ExportLot.INSPECTION_READY_to_CERTIFIED
        distinguishing_aspect: |
          ExportLot is CYCLIC via the rework loop: REJECTED -> BUILDING ->
          INSPECTION_READY -> CERTIFIED. A FAIL inspection creates a REVOKED
          certificate record and rejects the lot; rework clears the requester so
          a second inspection round can certify.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; grower, HAMLIN grove with CURRENT PASS maturity; pool OPEN wk 2026-07-27"
            - "JP EXPORT channel 25@900 rank1 [FANCY]; JUICE channel present; delivery 100 net; sort 40F/.../POSTED so JP channel holds 25 allocated FANCY boxes"
