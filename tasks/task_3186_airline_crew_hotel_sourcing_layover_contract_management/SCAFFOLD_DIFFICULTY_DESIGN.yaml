              payload: { contract_id: "${ctr_k13}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-06-30T00:00:00Z", billed_room_nights: 8, billed_amount_cents: 80000 }
              as: HotelVendorRep
