            - "InstallCrew.${c1}.booked_minutes_total == 210"
            - "InstallCrew.${c2}.booked_minutes_total == 210"
            - "GET /install-appointments?crew_id=${c3} returns total_count 1"

  - rule_id: compensating_invariant
    instances:
      - name: deposit_cents_conserved_across_preorder_create_then_cancel
        grounds:
          - entities.Account.fields.deposit_held_cents
          - entities.LedgerEntry.fields.amount_cents
          - state_machines.Preorder.preorder_status.PENDING_to_CANCELLED
          - state_machines.Preorder.deposit_status.HELD_to_REFUNDED
          - endpoints["POST /preorders/{id}/cancel"]
        distinguishing_aspect: |
          Conserved quantity: deposit cents. Creating the preorder moves the account's
          deposit_held_cents 0 -> 1000 and appends DEPOSIT_HELD +1000; cancelling appends
          DEPOSIT_REFUNDED -1000 so the signed ledger sum returns to exactly 0 and
          deposit_held_cents returns to 0 — the reversal is a compensating entry, never an edit or
          deletion of the original, and the zone's demand counters unwind with it.
        test_recipe:
          setup:
            - "Campaign with deposit_amount_cents 1000; zone with household_count 10 and threshold_pct 10.00."
            - "One SERVICEABLE address and one RESIDENT account whose deposit_held_cents is 0."
            - "One PENDING preorder created inside the window, so the account holds 1000 and the zone's provisional rate is 10.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000, max_deadline_extensions: 2, extension_grant_days: 30, claim_filing_window_days: 45, restoration_sla_days: 7, late_filing_factor: 0.60 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10, threshold_pct: 10.00, required_permit_types: ["ROW"], max_concurrent_bury_ops: 2 }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /service-addresses"
              payload: { build_zone_id: "${z1}", street_address: "1 Elm St", dwelling_type: "SINGLE_FAMILY", unit_count: 1, distance_to_node_m: 100 }
              as: ProgramManager
              captures: { a1: $.data.id }
            - call: "POST /service-addresses/${a1}/serviceability-determination"
              payload: { serviceability: "SERVICEABLE" }
              as: ProgramManager
            - call: "POST /accounts"
              payload: { full_name: "Ann Reyes", email: "ann@example.com", phone: "+13035550101", account_type: "RESIDENT" }
              as: ProgramManager
              captures: { acct1: $.data.id }
            - call: "GET /accounts/${acct1}"
              payload: {}
              as: ProgramManager
              captures: { held_at_zero: $.data.deposit_held_cents }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { zv1: $.data.version }
            - call: "POST /preorders"
              payload: { build_zone_id: "${z1}", service_address_id: "${a1}", account_id: "${acct1}", plan_tier: "BASIC_300", tendered_deposit_cents: 1000, expected_build_zone_version: "${zv1}" }
              as: Subscriber
              as_user_id: "${acct1}"
              captures: { p1: $.data.id }
            - call: "GET /accounts/${acct1}"
              payload: {}
              as: ProgramManager
              captures: { held_after_create: $.data.deposit_held_cents }
            - call: "GET /build-zones/${z1}"
              payload: {}
              as: ProgramManager
              captures: { rate_after_create: $.data.prereg_rate_pct, count_after_create: $.data.provisional_qualifying_count }
          trigger:
            - call: "POST /preorders/${p1}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${acct1}"
          assert:
            - "${held_at_zero} == 0"
            - "${held_after_create} == 1000"
            - "${rate_after_create} == 10.00"
            - "${count_after_create} == 1"
            - "Preorder.${p1}.preorder_status == CANCELLED"
            - "Preorder.${p1}.deposit_status == REFUNDED"
            - "Account.${acct1}.deposit_held_cents == 0"
            - "GET /ledger-entries?account_id=${acct1} returns exactly 2 entries whose amount_cents are +1000 (DEPOSIT_HELD) and -1000 (DEPOSIT_REFUNDED), summing to 0"
            - "the original DEPOSIT_HELD LedgerEntry row still exists unchanged with amount_cents 1000"
            - "BuildZone.${z1}.prereg_rate_pct == 0.00"
            - "BuildZone.${z1}.provisional_qualifying_count == 0"

      - name: crew_minutes_conserved_across_appointment_schedule_then_cancel
        grounds:
          - entities.InstallCrew.fields.booked_minutes_total
          - entities.InstallCrew.fields.scheduled_appointment_count
          - state_machines.InstallAppointment.status.SCHEDULED_to_CANCELLED
          - endpoints["POST /install-appointments/{id}/outcome"]
        distinguishing_aspect: |
          A different conserved quantity: crew minutes. Booking a 09:00..11:00 window raises
          booked_minutes_total 0 -> 150 and scheduled_appointment_count 0 -> 1; cancelling the
