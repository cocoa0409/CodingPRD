            - "ConsolidationCase.${case1_id}.status == NOTICE_FILED and Branch.${b101_id}.status == CLOSURE_SCHEDULED (unaffected by the second market filing)"
            - "MarketArea.${ma_id}.own_branch_count == 3 and branch_density_per_100k == 26 (both closing branches are still occupied inventory)"

      - name: atm_retention_margin_at_the_inclusive_floor
        claim_type: correct_result
        grounds:
          - calculations.atm_retention_decision
        distinguishing_aspect: "An annual ATM margin of exactly 600000 must retain the fleet while 599999 flips RETAIN_OFFSITE to DECOMMISSION."
        excluded_because:
          difficulty_instance: atm_retention_margin_exactly_at_inclusive_floor
          rationale: "That §1.8 instance already tests both sides of the inclusive floor in one recipe (margin exactly 600000 retained, one cent of monthly revenue less flipped to DECOMMISSION) and asserts atm_breakeven_met on both rows."

      - name: retention_forecast_variant_divergence_on_identical_inputs
        claim_type: variant_divergence
        grounds:
          - calculations.deposit_retention_forecast.variants
        distinguishing_aspect: "DISTANCE_DECAY floors the mileage and adds a digital uplift while SEGMENT_MIX ceils it into a multiplicative penalty, so identical request bodies must produce different retention_bps and different retained/runoff splits."
        excluded_because:
          difficulty_instance: retention_forecast_distance_decay_vs_segment_mix_divergence
          rationale: "That §1.8 instance already creates both variants on the same case with identical distance and share inputs, asserts each retention_bps, retained and runoff figure, and confirms the case mirrors only the ACTIVE forecast."

      - name: campaign_aggregate_daily_load_across_overlapping_waves
        claim_type: interval_merge
        grounds:
          - calculations.campaign_wave_capacity_conflict
          - validations.priority_30_ERR_ABSORPTION_CAPACITY_EXCEEDED
        distinguishing_aspect: "Two campaigns may share a receiving branch and overlap in time as long as the summed per-day load stays within capacity; the third wave breaks it."
        excluded_because:
          difficulty_instance: campaign_waves_share_receiving_branch_until_aggregate_capacity_breaks
          rationale: "That §1.8 instance already exercises the aggregate per-day sum across two accepted overlapping waves plus a third that exceeds capacity, and the touching-endpoint case that does not collide."

      - name: deposit_and_headcount_conservation_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.deposit_conservation_invariant
          - calculations.headcount_conservation_invariant
        distinguishing_aspect: "Deposits and FTE must reconcile exactly across execution and its reversal, with no rounding drift left on the market or receiving branch."
        excluded_because:
          difficulty_instance: unwind_closure_restores_market_deposit_ledger_exactly
          rationale: "That §1.8 instance (together with rescind_redeployment_restores_network_headcount_exactly) already asserts both conservation invariants before and after the reversal at exact cent and headcount equality."

  - section: validations
    instances:
      - name: list_market_areas_missing_x_user_id_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 requires BOTH headers, so a request that carries a valid X-User-Role but no X-User-ID is still ERR_UNAUTHENTICATED 401 — it must not fall through to a 403 or return data."
        test_recipe:
          setup:
            - "No fixtures are required."
          setup_api_calls: []
          trigger:
            - call: "GET /distribution/market-areas"
              payload: {}
              as: NetworkStrategist
              captures: { err_unauth: $.data.error_id }
          assert:
            - "the request is sent with X-User-Role: NetworkStrategist and NO X-User-ID header"
            - "${err_unauth} == ERR_UNAUTHENTICATED with HTTP 401"
            - "the same call with an unknown role value (X-User-Role: Auditor) also returns ERR_UNAUTHENTICATED 401, not ERR_FORBIDDEN_ROLE"

      - name: list_market_areas_with_limit_above_maximum_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - validations.priority_6_ERR_INVALID_REQUEST
          - endpoints[GET /distribution/market-areas]
        distinguishing_aspect: "Pagination limit is constrained to 1..100, so limit=101 is a 400 ERR_INVALID_REQUEST rather than a silent clamp to 100."
        test_recipe:
          setup:
            - "No fixtures are required."
          setup_api_calls: []
          trigger:
            - call: "GET /distribution/market-areas?limit=101"
              payload: {}
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { err_limit: $.data.error_id }
          assert:
            - "${err_limit} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /distribution/market-areas?limit=100 succeeds with HTTP 200 (the boundary is inclusive)"
            - "GET /distribution/market-areas?limit=0 also returns ERR_INVALID_REQUEST 400"

      - name: duplicate_branch_code_rejected_with_duplicate_key
        claim_type: violation_to_error
        grounds:
          - validations.priority_33_ERR_DUPLICATE_KEY
          - errors[ERR_DUPLICATE_KEY]
        distinguishing_aspect: "branch_code is unique across ALL Branch rows, not per market, so re-using RB-101 in a second market area is still ERR_DUPLICATE_KEY 409."
        test_recipe:
          setup:
            - "Two market areas exist and RB-101 already lives in the first one."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/market-areas"
              payload: { name: "Crown Heights", region_code: "MD-02", population: 100000, median_household_income_cents: 12000000, deposit_market_total_cents: 435000000000, competitor_branch_count: 28, household_growth_pct_bps: 500, digital_penetration_bps: 6000 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma2_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 5400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 40000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b101_id: $.data.id }
          trigger:
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma2_id}", branch_code: "RB-101", branch_type: "LIMITED_SERVICE", tenure_class: "OWNED", deposit_balance_cents: 2000000000, monthly_transaction_count: 3000, digital_adoption_bps: 5000, annual_noninterest_expense_cents: 20000000, annual_revenue_cents: 25000000, fte_count: 5, atm_count: 1, opened_on: "2016-01-04" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { err_dup: $.data.error_id }
          assert:
            - "${err_dup} == ERR_DUPLICATE_KEY with HTTP 409"
            - "MarketArea.${ma2_id}.own_branch_count == 0 and branch_density_per_100k == 28 (the rejected creation ran no ledger side effect)"
            - "a second POST /distribution/market-areas with name Harbor Metro and region_code MD-01 also returns ERR_DUPLICATE_KEY 409, while the same name under region_code MD-02 succeeds"

      - name: segment_shares_summing_to_9999_rejected_with_segment_mix_invalid
        claim_type: violation_to_error
        grounds:
          - validations.priority_34_ERR_SEGMENT_MIX_INVALID
          - calculations.deposit_retention_forecast
        distinguishing_aspect: "The three share inputs must total exactly 10000 bps even for the DISTANCE_DECAY variant that never reads them, so 8000 + 1500 + 499 is a 422 and no forecast row is written."
        test_recipe:
          setup:
            - "A DRAFT case exists on RB-101 with receiving branch RB-102."
          setup_api_calls:
