# =============================================================================
# PRD Benchmark Scaffold — Ladder & Access Equipment Manufacturing
# §1.0–§1.7. Difficulty design (§1.8) lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design (§1.9) lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2231. Ladder & Access Equipment Manufacturing (ladder manufacturer): duty rating design with load testing to standards for each rating class and product type, extrusion, fiberglass pultrusion and assembly operations with rivet and joint integrity testing, labeling requirements with warnings, duty rating and instruction placement per standards, certification testing and third-party listing with periodic audit testing of production samples, product liability documentation with design history and test records retention, retail channel packaging with assembly instructions and consumer safety information, recall readiness with lot traceability and consumer registration data, field incident investigation and design corrective action

domain_name: ladder-access-equipment-manufacturing
api_prefix: /ladder-ops

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a top-level collection under /ladder-ops with scalar FK
  # references in the request body. No entity is addressed through a nested
  # ownership path; child discovery is by filtered list or sub-resource read.

  state_machine_shape: parallel
  # Product carries two independent state dimensions (design_status ×
  # market_status) on the same row; market_status is additionally cyclic
  # (RETAIL_RELEASED <-> STOP_SHIP). DesignRevision is cyclic
  # (DRAFT -> UNDER_REVIEW -> CHANGES_REQUESTED -> DRAFT). FieldIncident is
  # branching (UNDER_INVESTIGATION forks to NOT_SUBSTANTIATED or
  # ROOT_CAUSE_IDENTIFIED with divergent side-effect sets).

  relationship_patterns:
    - one_to_many
    - self_referential      # DesignRevision.supersedes_revision_id, CorrectiveAction.supersedes_action_id
    - cross_aggregate       # TestCampaign spans Product, DesignRevision, ListingRecord, ProductionLot

  role_model: segregation_of_duties
  # DesignApprover may not review a revision they submitted; SafetyDirector may
  # not verify a corrective action they authored; SCRAP disposition of a
  # quarantined lot is reserved to SafetyDirector and denied to the
  # ProductionSupervisor who quarantined it.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 15 entities / 65 endpoints / 41 error codes / 6 calculations (2 dual-variant)
  # / 10 state machines (1 parallel-dimension pair, 2 cyclic, 1 branching)
  # / 2 OCC races on different parents / 5-hop and 4-hop transitive cascades.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: Catalog model code; globally unique across Product.
        constraints: "1..40 chars; unique"
      - name: product_type
        type: enum
        source: input
        description: Product family that selects the required test-code set.
        constraints: "STEP_LADDER | EXTENSION_LADDER | PLATFORM_LADDER | ARTICULATED_LADDER | MOBILE_SCAFFOLD_TOWER"
      - name: material
        type: enum
        source: input
        description: Primary rail construction process.
        constraints: "ALUMINUM_EXTRUSION | FIBERGLASS_PULTRUSION | STEEL"
      - name: duty_rating
        type: enum
        source: input
        description: Duty rating class declared for the model.
        constraints: "TYPE_III | TYPE_II | TYPE_I | TYPE_IA | TYPE_IAA"
      - name: working_length_ft
        type: number
        source: input
        description: Maximum working length in feet, used by the safety-factor length adder.
        constraints: "> 0; <= 60; 1 decimal place"
      - name: retail_sku
        type: string
        source: input
        description: Retail channel SKU printed on the carton.
      - name: rated_load_lb
        type: integer
        source: computed
        description: Rated working load in pounds, derived from duty_rating (§1.3 required_test_load_derivation).
      - name: safety_factor
        type: number
        source: computed
        description: Design safety factor after length adder, type bonus, material bonus and cap (§1.3).
        constraints: "2 decimal places"
      - name: required_test_load_lb
        type: number
        source: computed
        description: Load a qualifying static test must reach, rated_load_lb * safety_factor (§1.3).
        constraints: "2 decimal places"
      - name: required_pull_force_lbf
        type: number
        source: computed
        description: Minimum joint pull force per sample, rated_load_lb * JOINT_PULL_MULTIPLE (§1.3 lot_conformance_index).
        constraints: "2 decimal places"
      - name: max_allowed_deflection_in
        type: number
        source: computed
        description: Deflection ceiling for a passing load test, working_length_ft * 12 / DEFLECTION_SPAN_DIVISOR.
        constraints: "3 decimal places"
      - name: design_status
        type: enum
        source: computed
        description: First independent state dimension (design lifecycle).
        default: DRAFT
        constraints: "DRAFT | DESIGN_FROZEN | DESIGN_OBSOLETE"
      - name: market_status
        type: enum
        source: computed
        description: Second independent state dimension (retail channel lifecycle).
        default: NOT_RELEASED
        constraints: "NOT_RELEASED | RETAIL_RELEASED | STOP_SHIP | RECALLED"
      - name: design_frozen_at
        type: datetime
        source: computed
        description: Logical-clock instant design_status became DESIGN_FROZEN; null before that.
      - name: frozen_revision_id
        type: string
        source: computed
        description: "FK -> DesignRevision.id; the revision pinned at design freeze; null before freeze."
      - name: market_status_changed_at
        type: datetime
        source: computed
        description: Logical-clock instant market_status last changed; null while NOT_RELEASED.
      - name: stop_ship_reason_code
        type: enum
        source: computed
        description: Reason recorded when market_status became STOP_SHIP; cleared on resume.
        constraints: "LOT_QUARANTINE | FIELD_INCIDENT_REVIEW | LISTING_SUSPENDED | null"
      - name: held_registration_count
        type: integer
        source: computed
        description: Count of ConsumerRegistration rows for this product with hold_flag == true.
        default: 0
      - name: risk_score_gross
        type: number
        source: computed
        description: Un-mitigated field-incident risk score (§1.3 design_risk_score, GROSS_BASIS variant).
        default: 0.00
        constraints: "2 decimal places; 0.00..100.00"
      - name: risk_score_mitigated
        type: number
        source: computed
        description: Risk score after verified-CAPA credit (§1.3 design_risk_score, MITIGATED_BASIS variant).
        default: 0.00
        constraints: "2 decimal places; 0.00..100.00"
      - name: dhf_retention_until
        type: datetime
        source: computed
        description: Design-history-file retention expiry (§1.3 dhf_retention_until); null before design freeze.
      - name: retention_anchor_source
        type: enum
        source: computed
        description: Which candidate supplied the retention anchor.
        constraints: "LOT_RELEASE | INCIDENT_CLOSURE | RECALL | DESIGN_FREEZE | null"

  - name: DesignRevision
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the model this revision belongs to."
      - name: revision_label
        type: string
        source: input
        description: Engineering revision label, unique per product_id.
        constraints: "unique per (product_id, revision_label)"
      - name: joint_type
        type: enum
        source: input
        description: Rail-to-rung joining process; RIVETED adds RIVET_SHEAR to the required test set.
        constraints: "RIVETED | BONDED | WELDED"
      - name: structural_margin_pct
        type: number
        source: input
        description: Predicted structural margin over the duty rating, in percent.
        constraints: ">= 0; 2 decimal places"
      - name: rail_section_modulus_in3
        type: number
        source: input
        description: Rail section modulus in cubic inches used for the bending check.
        constraints: "> 0; 3 decimal places"
      - name: supersedes_revision_id
        type: string
        source: input
        description: "FK -> DesignRevision.id; prior revision this one replaces; null for the first revision."
      - name: status
        type: enum
        source: computed
        description: Cyclic review lifecycle state.
        default: DRAFT
        constraints: "DRAFT | UNDER_REVIEW | CHANGES_REQUESTED | APPROVED | SUPERSEDED"
      - name: review_round
        type: integer
        source: computed
        description: Number of completed review loops; starts at 1 and increments on each CHANGES_REQUESTED -> DRAFT revise.
        default: 1
      - name: submitted_by_user_id
        type: string
        source: computed
        description: Opaque X-User-ID of the DesignEngineer who submitted for review; null while DRAFT.
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: Opaque X-User-ID of the DesignApprover who last decided; null before first decision.
      - name: reviewer_notes
        type: string
        source: computed
        description: Notes supplied with the last review decision.
      - name: superseded_at
        type: datetime
        source: computed
        description: Logical-clock instant status became SUPERSEDED; null otherwise.

  - name: ProductDocument
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the model this label or packaging document belongs to."
      - name: doc_kind
        type: enum
        source: input
        description: Document class; the first four are label kinds requiring a placement_zone.
        constraints: "DUTY_RATING_LABEL | WARNING_LABEL | INSTRUCTION_LABEL | CERT_MARK_LABEL | RETAIL_CARTON | ASSEMBLY_INSTRUCTION_SHEET | CONSUMER_SAFETY_SHEET"
      - name: document_version
        type: string
        source: input
        description: Artwork/document version string.
      - name: text_digest
        type: string
        source: input
        description: Digest of the approved wording, used to detect silent text changes.
      - name: placement_zone
        type: enum
        source: input
        description: Physical placement on the ladder; required for label kinds, must be null otherwise.
        constraints: "SIDE_RAIL_UPPER | SIDE_RAIL_LOWER | TOP_CAP | BACK_RAIL | null"
      - name: pictogram_count
        type: integer
        source: input
        description: Number of warning pictograms present on the artwork.
        default: 0
      - name: includes_assembly_instructions
        type: boolean
        source: input
        description: Whether this document carries retail assembly instructions.
        default: false
      - name: status
        type: enum
        source: computed
        description: Document approval lifecycle state.
        default: DRAFT
        constraints: "DRAFT | APPROVED | SUPERSEDED"
      - name: approved_at
        type: datetime
        source: computed
        description: Logical-clock instant status became APPROVED; null otherwise.

  - name: TestBench
    parent: null
    common_fields: true
    fields:
      - name: bench_code
        type: string
        source: input
        description: Lab bench identifier, unique across TestBench.
        constraints: "unique"
      - name: max_load_capacity_lb
        type: number
        source: input
        description: Maximum load the bench can apply, in pounds.
        constraints: "> 0"
      - name: cooldown_minutes
        type: integer
        source: input
        description: Mandatory buffer appended after each reservation before the bench may be re-occupied.
        constraints: ">= 0; <= 480"
      - name: reserved_minutes_total
        type: integer
        source: computed
        description: Conserved aggregate; must always equal the sum of duration_minutes over BenchReservation rows on this bench with status IN {HELD, CONSUMED}.
        default: 0

  - name: BenchReservation
    parent: null
    common_fields: true
    fields:
      - name: test_bench_id
        type: string
        source: input
        description: "FK -> TestBench.id; the bench occupied by this reservation."
      - name: test_campaign_id
        type: string
        source: input
        description: "FK -> TestCampaign.id; the campaign that will consume this reservation."
      - name: start_at
        type: datetime
        source: input
        description: Inclusive start of the occupied interval.
      - name: end_at
        type: datetime
        source: input
        description: Exclusive end of the occupied interval.
      - name: duration_minutes
        type: integer
        source: computed
        description: Whole minutes between start_at and end_at.
      - name: status
        type: enum
        source: computed
        description: Reservation lifecycle state.
        default: HELD
        constraints: "HELD | CONSUMED | CANCELLED"

  - name: TestCampaign
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the model under test."
      - name: design_revision_id
        type: string
        source: input
        description: "FK -> DesignRevision.id; the revision the campaign qualifies; pins the joint_type driving RIVET_SHEAR."
      - name: purpose
        type: enum
        source: input
        description: Why the campaign exists; selects the required test-code set and the sample-size rule.
        constraints: "DESIGN_QUALIFICATION | CERTIFICATION_LISTING | PERIODIC_AUDIT | INCIDENT_INVESTIGATION"
      - name: listing_record_id
        type: string
        source: input
        description: "FK -> ListingRecord.id; required for PERIODIC_AUDIT, must be null otherwise."
      - name: sampled_lot_id
        type: string
        source: input
        description: "FK -> ProductionLot.id; production lot the audit units were drawn from; required for PERIODIC_AUDIT."
      - name: sample_window_start
        type: datetime
        source: input
        description: Inclusive start of the audit sample-draw window; required for PERIODIC_AUDIT.
      - name: sample_window_end
        type: datetime
        source: input
        description: Inclusive end of the audit sample-draw window; required for PERIODIC_AUDIT.
      - name: status
        type: enum
        source: computed
        description: Campaign lifecycle state.
        default: PLANNED
        constraints: "PLANNED | IN_PROGRESS | PASSED | FAILED | CANCELLED"
      - name: audit_sample_size
        type: integer
        source: computed
        description: Units to be tested for a PERIODIC_AUDIT campaign (§1.3 periodic_audit_sample_size); null for other purposes.
      - name: escalation_tier
        type: enum
        source: computed
        description: Tier selected from the prior audit's failure rate.
        constraints: "TIER_0 | TIER_1 | TIER_2 | TIER_3 | null"
      - name: prior_failure_rate_pct
        type: number
        source: computed
        description: Failure rate of the prior concluded PERIODIC_AUDIT on the same listing record; null when there is none.
        constraints: "2 decimal places"
      - name: load_test_count
        type: integer
        source: computed
        description: Number of LoadTest rows recorded against this campaign.
        default: 0
      - name: failed_test_count
        type: integer
        source: computed
        description: Number of LoadTest rows on this campaign with outcome FAIL.
        default: 0
      - name: started_at
        type: datetime
        source: computed
        description: Logical-clock instant status became IN_PROGRESS.
      - name: concluded_at
        type: datetime
        source: computed
        description: Logical-clock instant status became PASSED or FAILED.

  - name: LoadTest
    parent: null
    common_fields: false
    fields:
      - name: test_campaign_id
        type: string
        source: input
        description: "FK -> TestCampaign.id; the campaign this test record belongs to."
      - name: test_code
        type: enum
        source: input
        description: Standardised test performed.
        constraints: "STATIC_VERTICAL | RAIL_BENDING | SLIP_RESISTANCE | HINGE_CYCLE | ELECTRICAL_LEAKAGE | RIVET_SHEAR"
      - name: applied_load_lb
        type: number
        source: input
        description: Load actually applied during the test, in pounds.
        constraints: "> 0; 2 decimal places"
      - name: measured_deflection_in
        type: number
        source: input
        description: Peak deflection measured under load, in inches.
        constraints: ">= 0; 3 decimal places"
      - name: permanent_set_in
        type: number
        source: input
        description: Permanent set remaining after load removal, in inches.
        constraints: ">= 0; 3 decimal places"
      - name: outcome
        type: enum
        source: computed
        description: PASS only when the applied load reaches the requirement and both deformation ceilings hold.
        constraints: "PASS | FAIL"
      - name: failure_reason_code
        type: enum
        source: computed
        description: First failing criterion, evaluated in the order load, deflection, permanent set; null on PASS.
        constraints: "LOAD_BELOW_REQUIRED | DEFLECTION_EXCEEDED | PERMANENT_SET_EXCEEDED | null"

  - name: ProductionLot
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the model built in this lot."
      - name: design_revision_id
        type: string
        source: input
        description: "FK -> DesignRevision.id; revision pinned to the lot at creation; production requires it to still be APPROVED."
      - name: lot_code
        type: string
        source: input
        description: Traceability lot code, globally unique across ProductionLot.
        constraints: "unique"
      - name: planned_units
        type: integer
        source: input
        description: Units planned for the lot.
        constraints: "> 0"
      - name: extrusion_heat_number
        type: string
        source: input
        description: Aluminium extrusion heat number; null for non-extruded materials.
      - name: pultrusion_batch_id
        type: string
        source: input
        description: Fiberglass pultrusion batch id; required when the product material is FIBERGLASS_PULTRUSION.
      - name: produced_units
        type: integer
        source: computed
        description: Units actually produced, recorded at start-production; 0 while OPEN.
        default: 0
      - name: units_wip
        type: integer
        source: computed
        description: Conserved bucket - units in work in process.
        default: 0
      - name: units_quarantined
        type: integer
        source: computed
        description: Conserved bucket - units held under quarantine.
        default: 0
      - name: units_released
        type: integer
        source: computed
        description: Conserved bucket - units released to the retail channel.
        default: 0
      - name: units_scrapped
        type: integer
        source: computed
        description: Conserved bucket - units scrapped by disposition.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Lot lifecycle state.
        default: OPEN
        constraints: "OPEN | IN_PROCESS | RELEASED | QUARANTINED | SCRAPPED"
      - name: joint_sample_count
        type: integer
        source: computed
        description: Number of JointIntegritySample rows on this lot.
        default: 0
      - name: joint_fail_count
        type: integer
        source: computed
        description: Number of JointIntegritySample rows on this lot with result FAIL.
        default: 0
      - name: required_joint_sample_count
        type: integer
        source: computed
        description: max(MIN_JOINT_SAMPLES, ceil(produced_units / JOINT_SAMPLE_UNITS_PER_SAMPLE)); 0 while produced_units is 0.
        default: 0
      - name: conformance_index
        type: number
        source: computed
        description: Mean of per-sample whole-percent joint margins (§1.3 lot_conformance_index); null while joint_sample_count is 0.
        constraints: "2 decimal places or null"
      - name: released_at
        type: datetime
        source: computed
        description: Logical-clock instant the lot first reached RELEASED; retained across quarantine cycles.
      - name: quarantine_reason_code
        type: enum
        source: computed
        description: Reason recorded on the most recent quarantine.
        constraints: "JOINT_INTEGRITY | LABEL_DEFECT | AUDIT_FAILURE | FIELD_INCIDENT | null"
      - name: disposition
        type: enum
        source: computed
        description: Outcome of the most recent quarantine disposition.
        constraints: "RELEASE | SCRAP | null"

  - name: JointIntegritySample
    parent: null
    common_fields: false
    fields:
      - name: production_lot_id
        type: string
        source: input
        description: "FK -> ProductionLot.id; the lot this rivet/joint pull sample was drawn from."
      - name: sample_seq
        type: integer
        source: input
        description: Sample sequence number within the lot; unique per lot and used as the deterministic evaluation order.
        constraints: "> 0; unique per production_lot_id"
      - name: pull_force_lbf
        type: number
        source: input
        description: Measured joint pull force in pounds-force.
        constraints: "> 0; 2 decimal places"
      - name: required_pull_force_lbf
        type: number
        source: computed
        description: Snapshot of Product.required_pull_force_lbf at sample time.
        constraints: "2 decimal places"
      - name: margin_pct
        type: integer
        source: computed
        description: Per-sample margin over requirement rounded to a whole percent, half-up (§1.3 lot_conformance_index step 1).
      - name: result
        type: enum
        source: computed
        description: PASS when pull_force_lbf >= required_pull_force_lbf, else FAIL.
        constraints: "PASS | FAIL"

  - name: ListingBody
    parent: null
    common_fields: true
    fields:
      - name: body_code
        type: string
        source: input
        description: Third-party certification body code, unique across ListingBody.
        constraints: "unique"
      - name: accredited_standards
        type: array
        source: input
        description: Standard codes this body may list against (array of enum values, not a scalar FK).
        constraints: "non-empty; members of ANSI_ASC_A14_2 | ANSI_ASC_A14_5 | EN_131_2 | CSA_Z11"
      - name: audit_interval_days
        type: integer
        source: input
        description: Days between periodic production-sample audits for records held by this body.
        constraints: "> 0; <= 730"

  - name: ListingRecord
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the listed model."
      - name: listing_body_id
        type: string
        source: input
        description: "FK -> ListingBody.id; the body that owns this listing; equals X-User-ID for the CertificationBody role."
      - name: standard_code
        type: enum
        source: input
        description: Standard the product is listed against.
        constraints: "ANSI_ASC_A14_2 | ANSI_ASC_A14_5 | EN_131_2 | CSA_Z11"
      - name: status
        type: enum
        source: computed
        description: Listing lifecycle state; SUSPENDED can return to LISTED.
        default: APPLIED
        constraints: "APPLIED | LISTED | SUSPENDED | WITHDRAWN"
      - name: listed_at
        type: datetime
        source: computed
        description: Logical-clock instant status first became LISTED.
      - name: audit_due_at
        type: datetime
        source: computed
        description: Next periodic audit deadline; cleared to null while SUSPENDED.
      - name: listing_expires_at
        type: datetime
        source: computed
        description: Listing term expiry, stamped at first listing.
      - name: suspended_at
        type: datetime
        source: computed
        description: Logical-clock instant status last became SUSPENDED; null otherwise.
      - name: suspension_reason
        type: enum
        source: computed
        description: Reason recorded on the most recent suspension.
        constraints: "AUDIT_FAILURE | STOP_SHIP_CASCADE | BODY_REQUEST | null"

  - name: ConsumerRegistration
    parent: null
    common_fields: true
    fields:
      - name: production_lot_id
        type: string
        source: input
        description: "FK -> ProductionLot.id; traceability link from the consumer to the manufacturing lot."
      - name: recall_event_id
        type: string
        source: computed
        description: "FK -> RecallEvent.id; set by the system when a recall announcement puts this registration in scope; null otherwise."
      - name: consumer_email
        type: string
        source: input
        description: Consumer contact address for recall notification.
      - name: purchase_channel
        type: enum
        source: input
        description: Retail channel of purchase.
        constraints: "BIG_BOX_RETAIL | PRO_DEALER | ONLINE"
      - name: purchase_date
        type: datetime
        source: input
        description: Consumer purchase instant; must not be after the logical clock.
      - name: serial_suffix
        type: string
        source: input
        description: Unit serial suffix stamped on the rail.
      - name: registration_status
        type: enum
        source: computed
        description: Notification lifecycle state.
        default: REGISTERED
        constraints: "REGISTERED | NOTIFIED | ACKNOWLEDGED"
      - name: hold_flag
        type: boolean
        source: computed
        description: Set true when the registration's lot is quarantined; drives Product.held_registration_count.
        default: false
      - name: notified_at
        type: datetime
        source: computed
        description: Logical-clock instant the recall notice was issued.
      - name: acknowledged_at
        type: datetime
        source: computed
        description: Logical-clock instant the consumer acknowledged the notice.
      - name: remedy_choice
        type: enum
        source: computed
        description: Remedy the consumer selected on acknowledgement.
        constraints: "REPAIR_KIT | REPLACEMENT | REFUND | null"

  - name: FieldIncident
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the model involved in the incident."
      - name: production_lot_id
        type: string
        source: input
        description: "FK -> ProductionLot.id; lot involved when traceable; null otherwise."
      - name: consumer_registration_id
        type: string
        source: input
        description: "FK -> ConsumerRegistration.id; reporting consumer's registration when known; null otherwise."
      - name: incident_type
        type: enum
        source: input
        description: Failure mode reported from the field.
        constraints: "RAIL_FRACTURE | RUNG_SEPARATION | HINGE_FAILURE | SLIP_FALL | LABEL_ILLEGIBLE"
      - name: injury_severity
        type: enum
        source: input
        description: Worst injury outcome reported.
        constraints: "NONE | MINOR | HOSPITALIZATION | FATALITY"
      - name: occurred_at
        type: datetime
        source: input
        description: When the incident happened; must not be after the logical clock.
      - name: narrative
        type: string
        source: input
        description: Free-text incident description.
      - name: status
        type: enum
        source: computed
        description: Branching investigation lifecycle state.
        default: REPORTED
        constraints: "REPORTED | UNDER_INVESTIGATION | NOT_SUBSTANTIATED | ROOT_CAUSE_IDENTIFIED | CAPA_OPENED | CLOSED"
      - name: finding
        type: enum
        source: computed
        description: Investigation branch selected at resolve-investigation.
        constraints: "NOT_SUBSTANTIATED | ROOT_CAUSE_IDENTIFIED | null"
      - name: root_cause_code
        type: enum
        source: computed
        description: Root cause recorded on the ROOT_CAUSE_IDENTIFIED branch; null on the other branch.
        constraints: "RIVET_SHEAR_MARGIN | RAIL_SECTION_MODULUS | LABEL_ADHESION | HINGE_STOP_GEOMETRY | CONSUMER_MISUSE | null"
      - name: requires_capa
        type: boolean
        source: computed
        description: True only after the ROOT_CAUSE_IDENTIFIED branch is taken.
        default: false
      - name: incident_points
        type: number
        source: computed
        description: Severity weight times type weight, rounded to 2 decimals (§1.3 design_risk_score step 1).
        constraints: "2 decimal places"
      - name: closed_at
        type: datetime
        source: computed
        description: Logical-clock instant status became CLOSED; feeds the DHF retention anchor.

  - name: CorrectiveAction
    parent: null
    common_fields: true
    fields:
      - name: field_incident_id
        type: string
        source: input
        description: "FK -> FieldIncident.id; the incident this design corrective action answers."
      - name: design_revision_id
        type: string
        source: input
        description: "FK -> DesignRevision.id; the corrective design revision, when the fix is a design change; null for process-only actions."
      - name: supersedes_action_id
        type: string
        source: input
        description: "FK -> CorrectiveAction.id; prior OPEN action on the same incident that this one replaces; null when there is none."
      - name: action_summary
        type: string
        source: input
        description: Summary of the corrective action taken.
      - name: authored_by_user_id
        type: string
        source: computed
        description: Opaque X-User-ID of the DesignEngineer who created the action; the verifier must differ from it.
      - name: status
        type: enum
        source: computed
        description: Corrective-action lifecycle state.
        default: OPEN
        constraints: "OPEN | VERIFIED | SUPERSEDED"
      - name: verified_at
        type: datetime
        source: computed
        description: Logical-clock instant status became VERIFIED.
      - name: verified_by_user_id
        type: string
        source: computed
        description: Opaque X-User-ID of the SafetyDirector who verified the action.

  - name: RecallEvent
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the recalled model."
      - name: remedy_type
        type: enum
        source: input
        description: Remedy offered to consumers.
        constraints: "REPAIR_KIT | REPLACEMENT | REFUND"
      - name: affected_revision_ids
        type: array
        source: input
        description: Design revision ids inside the recall scope (array of id values, not a scalar FK).
        constraints: "non-empty"
      - name: hazard_description
        type: string
        source: input
        description: Hazard statement published with the recall.
      - name: status
        type: enum
        source: computed
        description: Recall lifecycle state.
        default: DRAFT
        constraints: "DRAFT | ANNOUNCED | IN_PROGRESS | CLOSED"
      - name: announced_at
        type: datetime
        source: computed
        description: Logical-clock instant status became ANNOUNCED; exposure figures are frozen here.
      - name: exposure_units_shipped_basis
        type: integer
        source: computed
        description: Exposure on the shipped basis (§1.3 recall_exposure_units, SHIPPED_BASIS variant).
      - name: exposure_units_registered_basis
        type: integer
        source: computed
        description: Exposure on the registered basis (§1.3 recall_exposure_units, REGISTERED_BASIS variant).
      - name: notification_coverage_pct
        type: number
        source: computed
        description: registered basis over shipped basis as a percentage; 0.00 when the shipped basis is 0.
        constraints: "2 decimal places"
      - name: units_remedied
        type: integer
        source: computed
        description: Count of in-scope registrations that acknowledged with a remedy choice.
        default: 0
      - name: units_outstanding
        type: integer
        source: computed
        description: exposure_units_registered_basis minus units_remedied; computed at notify and maintained on acknowledgement.
        default: 0
      - name: closed_at
        type: datetime
        source: computed
        description: Logical-clock instant status became CLOSED.

# =============================================================================
# §1.2 State Machine Table
# Product carries TWO independent state dimensions on the same row; each is
# declared as its own machine with an explicit `dimension:` key.
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- DesignRevision (CYCLIC)
  - entity: DesignRevision
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /ladder-ops/design-revisions/{id}/submit"
        actor: DesignEngineer
        preconditions:
          - "revision.status == DRAFT"
          - "revision.structural_margin_pct >= MIN_STRUCTURAL_MARGIN_PCT (2.00)"
        side_effects:
          - "sets revision.submitted_by_user_id = X-User-ID of the caller"
          - "increments revision.version by 1"
      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /ladder-ops/design-revisions/{id}/review with decision=REQUEST_CHANGES"
        actor: DesignApprover
        preconditions:
          - "revision.status == UNDER_REVIEW"
          - "X-User-ID != revision.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "sets revision.reviewed_by_user_id = X-User-ID, revision.reviewer_notes = payload reviewer_notes"
      - from: CHANGES_REQUESTED
        to: DRAFT
        trigger: "POST /ladder-ops/design-revisions/{id}/revise"
        actor: DesignEngineer
        preconditions:
          - "revision.status == CHANGES_REQUESTED"
        side_effects:
          - "increments revision.review_round by 1"
          - "clears revision.submitted_by_user_id to null so the next submit re-stamps it"
          - "overwrites structural_margin_pct / rail_section_modulus_in3 / joint_type with any supplied values"
        note: "This edge closes the DRAFT -> UNDER_REVIEW -> CHANGES_REQUESTED -> DRAFT review cycle; review_round is the loop counter."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /ladder-ops/design-revisions/{id}/review with decision=APPROVE"
        actor: DesignApprover
        preconditions:
          - "revision.status == UNDER_REVIEW"
          - "X-User-ID != revision.submitted_by_user_id (segregation of duties)"
          - "revision.rail_section_modulus_in3 >= MIN_SECTION_MODULUS_IN3 (0.180)"
        side_effects:
          - "sets revision.reviewed_by_user_id = X-User-ID, revision.reviewer_notes"
          - "if revision.supersedes_revision_id is not null and that revision.status == APPROVED, that revision transitions APPROVED -> SUPERSEDED and its superseded_at is stamped with the logical clock"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system event: a later revision naming this row in supersedes_revision_id is approved"
        actor: system
        preconditions:
          - "revision.status == APPROVED"
        side_effects:
          - "stamps revision.superseded_at with the logical clock"
          - "any ProductionLot pinned to this revision with status == OPEN can no longer start production (ERR_REVISION_NOT_APPROVED)"

  # ---------------------------------------------------------------- Product dimension 1 (design)
  - entity: Product
    dimension: design_status
    initial_state: DRAFT
    terminal_states: [DESIGN_OBSOLETE]
    transitions:
      - from: DRAFT
        to: DESIGN_FROZEN
        trigger: "POST /ladder-ops/products/{id}/freeze-design"
        actor: DesignEngineer
        preconditions:
          - "product.design_status == DRAFT"
          - "payload frozen_revision_id names a DesignRevision with product_id == product.id and status == APPROVED"
          - "at least one TestCampaign exists with product_id == product.id, design_revision_id == payload frozen_revision_id, purpose == DESIGN_QUALIFICATION and status == PASSED"
        side_effects:
          - "sets product.design_frozen_at = logical clock and product.frozen_revision_id = payload frozen_revision_id"
          - "recomputes product.dhf_retention_until (§1.3 dhf_retention_until); with no lots, incidents or recall the anchor is design_frozen_at and retention_anchor_source = DESIGN_FREEZE"
          - "increments product.version by 1"
        note: "design_status is independent of market_status: freezing a design never changes market_status."
      - from: DESIGN_FROZEN
        to: DESIGN_OBSOLETE
        trigger: "system event: a RecallEvent for this product is announced"
        actor: system
        preconditions:
          - "product.design_status == DESIGN_FROZEN"
        side_effects:
          - "no further ProductionLot may start production for this product (ERR_DESIGN_NOT_FROZEN)"

  # ---------------------------------------------------------------- Product dimension 2 (market, CYCLIC)
  - entity: Product
    dimension: market_status
    initial_state: NOT_RELEASED
    terminal_states: [RECALLED]
    transitions:
      - from: NOT_RELEASED
        to: RETAIL_RELEASED
        trigger: "POST /ladder-ops/products/{id}/release-to-retail"
        actor: ComplianceOfficer
        preconditions:
          - "product.market_status == NOT_RELEASED"
          - "product.design_status == DESIGN_FROZEN"
          - "every doc_kind in REQUIRED_DOC_KINDS has at least one ProductDocument for this product with status == APPROVED"
          - "at least one ListingRecord for this product has status == LISTED"
        side_effects:
          - "sets product.market_status_changed_at = logical clock"
          - "increments product.version by 1"
      - from: RETAIL_RELEASED
        to: STOP_SHIP
        trigger: "POST /ladder-ops/products/{id}/stop-ship, or system event (a lot of this product is quarantined, or a LISTED listing of this product becomes SUSPENDED)"
        actor: ComplianceOfficer | system
        preconditions:
          - "product.market_status == RETAIL_RELEASED"
        side_effects:
          - "sets product.stop_ship_reason_code (payload reason_code for the manual trigger; LOT_QUARANTINE for the quarantine cascade; LISTING_SUSPENDED for the listing cascade)"
          - "sets product.market_status_changed_at = logical clock"
          - "CASCADE HOP: every ListingRecord of this product with status == LISTED transitions LISTED -> SUSPENDED with suspension_reason = STOP_SHIP_CASCADE"
        note: "Guarded to fire only from RETAIL_RELEASED, so the listing-suspension cascade cannot re-enter this transition and loop."
      - from: STOP_SHIP
        to: RETAIL_RELEASED
        trigger: "POST /ladder-ops/products/{id}/resume-ship, or system event (a CorrectiveAction verification drops risk_score_mitigated below RISK_CLEAR_THRESHOLD)"
        actor: ComplianceOfficer | system
        preconditions:
          - "product.market_status == STOP_SHIP"
          - "product.risk_score_mitigated < RISK_CLEAR_THRESHOLD (25.00)"
          - "no ProductionLot of this product has status == QUARANTINED"
          - "product.held_registration_count == 0"
        side_effects:
          - "clears product.stop_ship_reason_code to null"
          - "sets product.market_status_changed_at = logical clock"
          - "CASCADE HOP: every ListingRecord of this product with status == SUSPENDED transitions SUSPENDED -> LISTED, suspension_reason cleared to null, and audit_due_at re-stamped = logical clock + its ListingBody.audit_interval_days"
        note: "Closes the RETAIL_RELEASED <-> STOP_SHIP cycle. The system-triggered form is silently skipped when any precondition fails."
      - from: RETAIL_RELEASED
        to: RECALLED
        trigger: "POST /ladder-ops/recall-events/{id}/announce"
        actor: ComplianceOfficer
        preconditions:
          - "product.market_status IN {RETAIL_RELEASED, STOP_SHIP}"
        side_effects:
          - "sets product.market_status_changed_at = logical clock"
          - "CASCADE HOP: product.design_status DESIGN_FROZEN -> DESIGN_OBSOLETE"
          - "CASCADE HOP: every ListingRecord of this product with status IN {LISTED, SUSPENDED} transitions to WITHDRAWN"
          - "recomputes product.dhf_retention_until with retention_anchor_source = RECALL when market_status_changed_at is the maximum candidate"
      - from: STOP_SHIP
        to: RECALLED
        trigger: "POST /ladder-ops/recall-events/{id}/announce"
        actor: ComplianceOfficer
        preconditions:
          - "product.market_status IN {RETAIL_RELEASED, STOP_SHIP}"
        side_effects:
          - "identical to the RETAIL_RELEASED -> RECALLED side-effect set; stop_ship_reason_code is retained for the liability dossier"

  # ---------------------------------------------------------------- ProductDocument
  - entity: ProductDocument
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /ladder-ops/product-documents/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "document.status == DRAFT"
          - "if doc_kind IN LABEL_DOC_KINDS then placement_zone is not null"
          - "if doc_kind == WARNING_LABEL then pictogram_count >= MIN_WARNING_PICTOGRAMS (2)"
          - "if doc_kind == ASSEMBLY_INSTRUCTION_SHEET then includes_assembly_instructions == true"
        side_effects:
          - "sets document.approved_at = logical clock"
          - "any other ProductDocument with the same product_id and doc_kind and status == APPROVED transitions APPROVED -> SUPERSEDED"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system event: a newer document with the same product_id and doc_kind is approved"
        actor: system
        preconditions:
          - "document.status == APPROVED"
        side_effects:
          - "the superseded document no longer satisfies the REQUIRED_DOC_KINDS gate on POST /ladder-ops/products/{id}/release-to-retail"

  # ---------------------------------------------------------------- BenchReservation
  - entity: BenchReservation
    initial_state: HELD
    terminal_states: [CONSUMED, CANCELLED]
    transitions:
      - from: HELD
        to: CONSUMED
        trigger: "POST /ladder-ops/test-campaigns/{id}/start"
        actor: TestLabTechnician
        preconditions:
          - "reservation.status == HELD"
          - "reservation.test_campaign_id == the campaign being started"
        side_effects:
          - "TestBench.reserved_minutes_total is unchanged (CONSUMED remains inside the conserved sum)"
      - from: HELD
        to: CANCELLED
        trigger: "POST /ladder-ops/bench-reservations/{id}/cancel, or system event (its campaign is cancelled by the stop-ship cascade)"
        actor: TestLabTechnician | system
        preconditions:
          - "reservation.status == HELD"
        side_effects:
          - "decrements TestBench.reserved_minutes_total by reservation.duration_minutes, restoring the pre-reservation value (§1.3 invariant bench_minutes_conservation)"

  # ---------------------------------------------------------------- TestCampaign
  - entity: TestCampaign
    initial_state: PLANNED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /ladder-ops/test-campaigns/{id}/start"
        actor: TestLabTechnician
        preconditions:
          - "campaign.status == PLANNED"
          - "payload bench_reservation_id names a BenchReservation with test_campaign_id == campaign.id and status == HELD"
          - "that reservation's TestBench.max_load_capacity_lb >= product.required_test_load_lb"
        side_effects:
          - "sets campaign.started_at = logical clock"
          - "the named BenchReservation transitions HELD -> CONSUMED"
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /ladder-ops/test-campaigns/{id}/conclude"
        actor: TestLabTechnician
        preconditions:
          - "campaign.status == IN_PROGRESS"
          - "campaign.failed_test_count == 0"
          - "for purpose IN {DESIGN_QUALIFICATION, CERTIFICATION_LISTING, INCIDENT_INVESTIGATION}: every test_code in the campaign's required test-code set has a LoadTest row on this campaign"
          - "for purpose == PERIODIC_AUDIT: campaign.load_test_count >= campaign.audit_sample_size"
        side_effects:
          - "sets campaign.concluded_at = logical clock"
          - "for purpose == PERIODIC_AUDIT: the linked ListingRecord.audit_due_at is re-stamped = logical clock + its ListingBody.audit_interval_days"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /ladder-ops/test-campaigns/{id}/conclude"
        actor: TestLabTechnician
        preconditions:
          - "campaign.status == IN_PROGRESS"
          - "campaign.failed_test_count > 0"
          - "the same required-coverage precondition as the PASSED edge holds (coverage is required before a verdict of either polarity)"
        side_effects:
          - "sets campaign.concluded_at = logical clock"
          - "CASCADE HOP 1 (purpose == PERIODIC_AUDIT only): the linked ListingRecord transitions LISTED -> SUSPENDED with suspension_reason = AUDIT_FAILURE and audit_due_at cleared to null"
          - "CASCADE HOP 2 (caused by hop 1): because a LISTED listing of the product became SUSPENDED, product.market_status RETAIL_RELEASED -> STOP_SHIP with stop_ship_reason_code = LISTING_SUSPENDED"
          - "CASCADE HOP 3 (caused by hop 2, purpose == PERIODIC_AUDIT only): the campaign's sampled_lot_id ProductionLot with status IN {IN_PROCESS, RELEASED} transitions to QUARANTINED with quarantine_reason_code = AUDIT_FAILURE, and that edge's own hop 1 sets hold_flag on its REGISTERED / NOTIFIED ConsumerRegistration rows; the product is already STOP_SHIP at this point, so the LOT_QUARANTINE reason-code reassignment is skipped and the chain terminates on the product"
          - "CASCADE HOP 4 (caused by hop 2): because the product entered STOP_SHIP, every other TestCampaign of that product with status == PLANNED transitions PLANNED -> CANCELLED and each of its HELD BenchReservation rows transitions HELD -> CANCELLED, decrementing TestBench.reserved_minutes_total"
        note: "Hop order is pinned: listing suspension (AUDIT_FAILURE) precedes the lot quarantine, so stop_ship_reason_code is LISTING_SUSPENDED and never LOT_QUARANTINE for an audit failure."
      - from: PLANNED
        to: CANCELLED
        trigger: "system event: the campaign's product entered STOP_SHIP, or a lot of that product was quarantined"
        actor: system
        preconditions:
          - "campaign.status == PLANNED"
        side_effects:
          - "every BenchReservation for this campaign with status == HELD transitions HELD -> CANCELLED and TestBench.reserved_minutes_total is decremented by that reservation's duration_minutes"

  # ---------------------------------------------------------------- ProductionLot (CYCLIC)
  - entity: ProductionLot
    initial_state: OPEN
    terminal_states: [SCRAPPED]
    transitions:
      - from: OPEN
        to: IN_PROCESS
        trigger: "POST /ladder-ops/production-lots/{id}/start-production"
        actor: ProductionSupervisor
        preconditions:
          - "lot.status == OPEN"
          - "the pinned DesignRevision (lot.design_revision_id) has status == APPROVED"
          - "product.design_status == DESIGN_FROZEN"
          - "if product.material == FIBERGLASS_PULTRUSION then lot.pultrusion_batch_id is not null"
          - "0 < payload produced_units <= lot.planned_units"
        side_effects:
          - "sets lot.produced_units = payload produced_units and lot.units_wip = payload produced_units"
          - "sets lot.required_joint_sample_count = max(MIN_JOINT_SAMPLES, ceil(produced_units / JOINT_SAMPLE_UNITS_PER_SAMPLE))"
      - from: IN_PROCESS
        to: RELEASED
        trigger: "POST /ladder-ops/production-lots/{id}/release"
        actor: ProductionSupervisor
        preconditions:
          - "lot.status == IN_PROCESS"
          - "lot.joint_sample_count > 0"
          - "lot.joint_sample_count >= lot.required_joint_sample_count"
          - "lot.joint_fail_count == 0"
          - "lot.conformance_index >= MIN_CONFORMANCE_INDEX (2.00)"
        side_effects:
          - "moves the whole units_wip bucket into units_released (units_wip -> 0), preserving units_wip + units_quarantined + units_released + units_scrapped == produced_units"
          - "sets lot.released_at = logical clock when it is currently null"
          - "recomputes product.dhf_retention_until; with released_at as the maximum candidate retention_anchor_source becomes LOT_RELEASE"
      - from: IN_PROCESS
        to: QUARANTINED
        trigger: "POST /ladder-ops/production-lots/{id}/quarantine"
        actor: ProductionSupervisor
        preconditions:
          - "lot.status IN {IN_PROCESS, RELEASED}"
        side_effects:
          - "moves units_wip and units_released into units_quarantined; the conserved sum is unchanged"
          - "sets lot.quarantine_reason_code = payload reason_code"
      - from: RELEASED
        to: QUARANTINED
        trigger: "POST /ladder-ops/production-lots/{id}/quarantine, or system event (an audit campaign on this lot concluded FAILED)"
        actor: ProductionSupervisor | system
        preconditions:
          - "lot.status IN {IN_PROCESS, RELEASED}"
        side_effects:
          - "moves units_wip and units_released into units_quarantined; the conserved sum is unchanged"
          - "sets lot.quarantine_reason_code (payload reason_code, or AUDIT_FAILURE for the system trigger)"
          - "CASCADE HOP 1: every ConsumerRegistration with production_lot_id == lot.id and registration_status IN {REGISTERED, NOTIFIED} has hold_flag set to true"
          - "CASCADE HOP 2 (caused by hop 1): because registrations were flagged, product.held_registration_count is recomputed; when it becomes > 0 and product.market_status == RETAIL_RELEASED, market_status transitions RETAIL_RELEASED -> STOP_SHIP with stop_ship_reason_code = LOT_QUARANTINE"
          - "CASCADE HOP 3 (caused by hop 2): because the product entered STOP_SHIP, every ListingRecord of the product with status == LISTED transitions LISTED -> SUSPENDED with suspension_reason = STOP_SHIP_CASCADE and audit_due_at cleared to null"
          - "CASCADE HOP 4 (caused by hop 2): because the product entered STOP_SHIP, every TestCampaign with product_id == lot.product_id and status == PLANNED transitions PLANNED -> CANCELLED, regardless of whether it names a listing_record_id"
          - "CASCADE HOP 5 (caused by hop 4): because those campaigns were cancelled, each of their BenchReservation rows with status == HELD transitions HELD -> CANCELLED and TestBench.reserved_minutes_total is decremented by that reservation's duration_minutes"
        note: "Five-hop transitive chain: lot -> registrations -> product -> listing -> campaign -> reservation/bench. Each hop is caused by the preceding hop's mutation, not by the original quarantine call."
      - from: QUARANTINED
        to: RELEASED
        trigger: "POST /ladder-ops/production-lots/{id}/disposition with disposition=RELEASE"
        actor: ProductionSupervisor
        preconditions:
          - "lot.status == QUARANTINED"
          - "lot.joint_fail_count == 0"
          - "lot.conformance_index >= MIN_CONFORMANCE_INDEX (2.00)"
        side_effects:
          - "moves the whole units_quarantined bucket back into units_released, restoring the pre-quarantine bucket split exactly (compensating action for the quarantine edge)"
          - "sets lot.disposition = RELEASE and clears lot.quarantine_reason_code to null"
          - "clears hold_flag to false on every ConsumerRegistration of this lot and recomputes product.held_registration_count"
        note: "Closes the RELEASED -> QUARANTINED -> RELEASED cycle."
      - from: QUARANTINED
        to: SCRAPPED
        trigger: "POST /ladder-ops/production-lots/{id}/disposition with disposition=SCRAP"
        actor: SafetyDirector
        preconditions:
          - "lot.status == QUARANTINED"
          - "the caller's X-User-Role is SafetyDirector (a ProductionSupervisor may quarantine but may not scrap)"
        side_effects:
          - "moves the whole units_quarantined bucket into units_scrapped; the conserved sum is unchanged"
          - "sets lot.disposition = SCRAP"
          - "clears hold_flag to false on every ConsumerRegistration of this lot and recomputes product.held_registration_count"

  # ---------------------------------------------------------------- ListingRecord (CYCLIC)
  - entity: ListingRecord
    initial_state: APPLIED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: APPLIED
        to: LISTED
        trigger: "POST /ladder-ops/listing-records/{id}/list"
        actor: CertificationBody
        preconditions:
          - "record.status == APPLIED"
          - "record.listing_body_id == X-User-ID"
          - "record.standard_code is a member of the owning ListingBody.accredited_standards"
          - "product.design_status == DESIGN_FROZEN"
          - "at least one TestCampaign exists with product_id == record.product_id, design_revision_id == product.frozen_revision_id, purpose == CERTIFICATION_LISTING and status == PASSED"
        side_effects:
          - "sets record.listed_at = logical clock"
          - "sets record.audit_due_at = logical clock + ListingBody.audit_interval_days"
          - "sets record.listing_expires_at = logical clock + LISTING_TERM_DAYS (1825)"
      - from: LISTED
        to: SUSPENDED
        trigger: "POST /ladder-ops/listing-records/{id}/suspend, or system event (an audit campaign concluded FAILED, or the product entered STOP_SHIP)"
        actor: CertificationBody | system
        preconditions:
          - "record.status == LISTED"
        side_effects:
          - "sets record.suspended_at = logical clock and record.suspension_reason (payload suspension_reason for the manual trigger, AUDIT_FAILURE or STOP_SHIP_CASCADE for the system triggers)"
          - "clears record.audit_due_at to null"
          - "CASCADE HOP: when product.market_status == RETAIL_RELEASED it transitions RETAIL_RELEASED -> STOP_SHIP with stop_ship_reason_code = LISTING_SUSPENDED; when it is already STOP_SHIP or RECALLED this hop is skipped, which terminates the chain"
      - from: SUSPENDED
        to: LISTED
        trigger: "system event: the product returned to RETAIL_RELEASED (manual resume-ship or the corrective-action verification cascade)"
        actor: system
        preconditions:
          - "record.status == SUSPENDED"
          - "product.market_status transitioned STOP_SHIP -> RETAIL_RELEASED in this request"
        side_effects:
          - "clears record.suspended_at and record.suspension_reason to null"
          - "re-stamps record.audit_due_at = logical clock + ListingBody.audit_interval_days"
        note: "Closes the LISTED -> SUSPENDED -> LISTED cycle."
      - from: LISTED
        to: WITHDRAWN
        trigger: "system event: a RecallEvent for the product is announced"
        actor: system
        preconditions:
          - "record.status IN {LISTED, SUSPENDED}"
        side_effects:
          - "clears record.audit_due_at to null; no further audit campaign may be planned against this record"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "system event: a RecallEvent for the product is announced"
        actor: system
        preconditions:
          - "record.status IN {LISTED, SUSPENDED}"
        side_effects:
          - "clears record.audit_due_at to null"

  # ---------------------------------------------------------------- ConsumerRegistration
  - entity: ConsumerRegistration
    initial_state: REGISTERED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: REGISTERED
        to: NOTIFIED
        trigger: "POST /ladder-ops/recall-events/{id}/notify"
        actor: ComplianceOfficer
        preconditions:
          - "registration.registration_status == REGISTERED"
          - "registration.recall_event_id == the recall being notified"
        side_effects:
          - "sets registration.notified_at = logical clock"
      - from: NOTIFIED
        to: ACKNOWLEDGED
        trigger: "POST /ladder-ops/consumer-registrations/{id}/acknowledge"
        actor: Consumer
        preconditions:
          - "registration.registration_status == NOTIFIED"
          - "the linked RecallEvent.status == IN_PROGRESS"
          - "payload remedy_choice == the linked RecallEvent.remedy_type"
        side_effects:
          - "sets registration.acknowledged_at = logical clock and registration.remedy_choice"
          - "increments RecallEvent.units_remedied by 1 and decrements RecallEvent.units_outstanding by 1, preserving units_remedied + units_outstanding == exposure_units_registered_basis"

  # ---------------------------------------------------------------- FieldIncident (BRANCHING)
  - entity: FieldIncident
    initial_state: REPORTED
    terminal_states: [NOT_SUBSTANTIATED, CLOSED]
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: "POST /ladder-ops/field-incidents/{id}/investigate"
        actor: SafetyDirector
        preconditions:
          - "incident.status == REPORTED"
        side_effects:
          - "recomputes product.risk_score_gross and product.risk_score_mitigated; this incident's incident_points now enter both variants for the first time"
          - "increments incident.version by 1"
      - from: UNDER_INVESTIGATION
        to: NOT_SUBSTANTIATED
        trigger: "POST /ladder-ops/field-incidents/{id}/resolve-investigation with finding=NOT_SUBSTANTIATED"
        actor: SafetyDirector
        preconditions:
          - "incident.status == UNDER_INVESTIGATION"
          - "payload root_cause_code is null on this branch"
        side_effects:
          - "sets incident.finding = NOT_SUBSTANTIATED and leaves requires_capa false"
          - "recomputes product.risk_score_gross and product.risk_score_mitigated with this incident REMOVED from both input sets"
        note: "Branch A of the fork. Divergent side-effect set: score removal, no CAPA obligation, terminal."
      - from: UNDER_INVESTIGATION
        to: ROOT_CAUSE_IDENTIFIED
        trigger: "POST /ladder-ops/field-incidents/{id}/resolve-investigation with finding=ROOT_CAUSE_IDENTIFIED"
        actor: SafetyDirector
        preconditions:
          - "incident.status == UNDER_INVESTIGATION"
          - "payload root_cause_code is not null on this branch"
        side_effects:
          - "sets incident.finding = ROOT_CAUSE_IDENTIFIED, incident.root_cause_code and incident.requires_capa = true"
          - "risk scores are NOT recomputed on this branch: the incident stays in both input sets at full weight"
        note: "Branch B of the fork. Divergent side-effect set: CAPA obligation opened, scores untouched, non-terminal."
      - from: ROOT_CAUSE_IDENTIFIED
        to: CAPA_OPENED
        trigger: "POST /ladder-ops/corrective-actions"
        actor: DesignEngineer
        preconditions:
          - "incident.status == ROOT_CAUSE_IDENTIFIED"
          - "incident.requires_capa == true"
          - "payload expected_field_incident_version == incident.version"
        side_effects:
          - "increments incident.version by 1"
          - "any other CorrectiveAction on this incident with status == OPEN named by supersedes_action_id transitions OPEN -> SUPERSEDED"
      - from: CAPA_OPENED
        to: CLOSED
        trigger: "system event: the incident's OPEN CorrectiveAction is verified"
        actor: system
        preconditions:
          - "incident.status == CAPA_OPENED"
        side_effects:
          - "sets incident.closed_at = logical clock (join point of the fork: both branches now terminal)"
          - "triggers recomputation of product.risk_score_mitigated with the verified-CAPA credit factor and of product.dhf_retention_until"

  # ---------------------------------------------------------------- CorrectiveAction
  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: VERIFIED
        trigger: "POST /ladder-ops/corrective-actions/{id}/verify"
        actor: SafetyDirector
        preconditions:
          - "action.status == OPEN"
          - "X-User-ID != action.authored_by_user_id (segregation of duties)"
          - "if action.design_revision_id is not null then that revision.status == APPROVED"
        side_effects:
          - "CASCADE HOP 1: sets action.verified_at = logical clock and action.verified_by_user_id = X-User-ID"
          - "CASCADE HOP 2 (caused by hop 1): because this action is now VERIFIED, its FieldIncident transitions CAPA_OPENED -> CLOSED and incident.closed_at is stamped"
          - "CASCADE HOP 3 (caused by hop 2): because the incident closed, product.risk_score_mitigated is recomputed with CAPA_CREDIT_FACTOR applied to that incident, and product.dhf_retention_until / retention_anchor_source are re-derived from the new closed_at"
          - "CASCADE HOP 4 (caused by hop 3): because risk_score_mitigated dropped below RISK_CLEAR_THRESHOLD, product.market_status STOP_SHIP -> RETAIL_RELEASED (when no QUARANTINED lot exists and held_registration_count == 0), which in turn returns every SUSPENDED ListingRecord of the product to LISTED with audit_due_at re-stamped"
        note: "Four-hop transitive chain from a different trigger than the quarantine chain: action -> incident -> product scores/retention -> market status + listings."
      - from: OPEN
        to: SUPERSEDED
        trigger: "system event: a later CorrectiveAction on the same incident names this row in supersedes_action_id"
        actor: system
        preconditions:
          - "action.status == OPEN"
        side_effects:
          - "a SUPERSEDED action can no longer be verified (ERR_CORRECTIVE_ACTION_NOT_OPEN)"

  # ---------------------------------------------------------------- RecallEvent
  - entity: RecallEvent
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ANNOUNCED
        trigger: "POST /ladder-ops/recall-events/{id}/announce"
        actor: ComplianceOfficer
        preconditions:
          - "recall.status == DRAFT"
          - "product.market_status IN {RETAIL_RELEASED, STOP_SHIP}"
          - "the recall's in-scope lot set (§1.3 recall_exposure_units input_set) is non-empty"
        side_effects:
          - "computes recall.exposure_units_shipped_basis and recall.exposure_units_registered_basis (both §1.3 variants) and recall.notification_coverage_pct; these are frozen at announcement"
          - "sets recall.units_outstanding = recall.exposure_units_registered_basis and recall.units_remedied = 0"
          - "sets recall.announced_at = logical clock"
          - "sets recall_event_id on every in-scope ConsumerRegistration with registration_status == REGISTERED"
          - "product.market_status transitions to RECALLED, product.design_status DESIGN_FROZEN -> DESIGN_OBSOLETE, and every LISTED or SUSPENDED ListingRecord of the product transitions to WITHDRAWN"
      - from: ANNOUNCED
        to: IN_PROGRESS
        trigger: "POST /ladder-ops/recall-events/{id}/notify"
        actor: ComplianceOfficer
        preconditions:
          - "recall.status == ANNOUNCED"
        side_effects:
          - "every ConsumerRegistration with recall_event_id == recall.id and registration_status == REGISTERED transitions REGISTERED -> NOTIFIED with notified_at stamped"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /ladder-ops/recall-events/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "recall.status == IN_PROGRESS"
          - "recall.units_outstanding == 0 OR logical clock >= recall.announced_at + MAX_RECALL_WINDOW_DAYS (365)"
        side_effects:
          - "sets recall.closed_at = logical clock"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:

  - rule_id: design-revision-create-stale-product
    parent_entity: Product
    write_endpoint: "POST /ladder-ops/design-revisions"
    occ_field: "expected_product_version"
    description: |
      Creating a DesignRevision against a Product whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another engineer has already added a revision that legitimately
      supersedes the prior approved revision (§1.2 DesignRevision
      APPROVED -> SUPERSEDED), so the current writer's view of the product's
      design history is stale.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412

  - rule_id: corrective-action-create-stale-incident
    parent_entity: FieldIncident
    write_endpoint: "POST /ladder-ops/corrective-actions"
    occ_field: "expected_field_incident_version"
    description: |
      Creating a CorrectiveAction against a FieldIncident whose version has
      advanced since the client last observed it is rejected. This captures the
      case where an earlier corrective action has already moved the incident to
      CAPA_OPENED and a superseding action would legitimately replace it, so the
      current writer's view of the incident is stale.
    error_id: ERR_STALE_INCIDENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---------------------------------------------------------------- (a) multi-input non-linear formula
  - name: required_test_load_derivation
    trigger: "POST /ladder-ops/products (creation); the outputs are immutable afterwards because Product has no update endpoint"
    algorithm: threshold
    formula: |
      # STEP 1 — duty rating class selects the rated working load.
      rated_load_lb = RATED_LOAD_BY_DUTY[product.duty_rating]

      # STEP 2 — length adder: whole 4-ft steps above the 12-ft baseline.
      #          ceil() means 12.1 ft already buys a full step; 12.0 ft buys none.
      length_steps = max(0, ceil((product.working_length_ft - LENGTH_BASELINE_FT) / LENGTH_STEP_FT))

      # STEP 3 — three independent adders combine, then a hard cap clamps them.
      raw_sf = BASE_SAFETY_FACTOR
             + LENGTH_ADDER_PER_STEP * length_steps
             + TYPE_SF_BONUS[product.product_type]
             + (FIBERGLASS_SF_BONUS if product.material == FIBERGLASS_PULTRUSION else 0.00)
      safety_factor = round_half_up(min(raw_sf, SAFETY_FACTOR_CAP), 2)

      # STEP 4 — three derived requirements. Rounding happens ONCE, at the end
      #          of each expression; safety_factor is used already-rounded.
      required_test_load_lb     = round_half_up(rated_load_lb * safety_factor, 2)
      required_pull_force_lbf   = round_half_up(rated_load_lb * JOINT_PULL_MULTIPLE, 2)
      max_allowed_deflection_in = round_half_up(product.working_length_ft * 12 / DEFLECTION_SPAN_DIVISOR, 3)
    input_set: "The single Product row being created; no other entity participates."
    constants:
      RATED_LOAD_BY_DUTY: { TYPE_III: 200, TYPE_II: 225, TYPE_I: 250, TYPE_IA: 300, TYPE_IAA: 375 }
      BASE_SAFETY_FACTOR: 4.00
      LENGTH_BASELINE_FT: 12
      LENGTH_STEP_FT: 4
      LENGTH_ADDER_PER_STEP: 0.15
      TYPE_SF_BONUS: { STEP_LADDER: 0.00, EXTENSION_LADDER: 0.00, PLATFORM_LADDER: 0.00, ARTICULATED_LADDER: 0.10, MOBILE_SCAFFOLD_TOWER: 0.25 }
      FIBERGLASS_SF_BONUS: 0.05
      SAFETY_FACTOR_CAP: 4.60
      JOINT_PULL_MULTIPLE: 1.50
      DEFLECTION_SPAN_DIVISOR: 180
    precision: "safety_factor and the two load figures: 2 decimal places, round_half_up. max_allowed_deflection_in: 3 decimal places, round_half_up."
    variants: []

  - name: load_test_outcome
    trigger: "POST /ladder-ops/test-campaigns/{id}/load-tests"
    algorithm: threshold
    formula: |
      # Criteria are evaluated in this fixed order and the FIRST failure is the
      # recorded failure_reason_code. All three comparisons are inclusive on the
      # passing side, so a test that exactly meets every limit PASSES.
      if test.applied_load_lb < product.required_test_load_lb:
          outcome = FAIL; failure_reason_code = LOAD_BELOW_REQUIRED
      elif test.measured_deflection_in > product.max_allowed_deflection_in:
          outcome = FAIL; failure_reason_code = DEFLECTION_EXCEEDED
      elif test.permanent_set_in > MAX_PERMANENT_SET_IN:
          outcome = FAIL; failure_reason_code = PERMANENT_SET_EXCEEDED
      else:
          outcome = PASS; failure_reason_code = null

      # Campaign counters, recomputed over every LoadTest row of the campaign.
      campaign.load_test_count  = count(LoadTest where test_campaign_id == campaign.id)
      campaign.failed_test_count = count(LoadTest where test_campaign_id == campaign.id and outcome == FAIL)
    input_set: "The LoadTest row being created plus the immutable Product thresholds; counters aggregate every LoadTest row on the campaign regardless of outcome."
    constants:
      MAX_PERMANENT_SET_IN: 0.020
    precision: "Comparisons use the stored values at full declared precision (load 2 dp, deflection and set 3 dp); no intermediate rounding."
    variants: []

  # ---------------------------------------------------------------- (b) nested rounding, order pinned
  - name: lot_conformance_index
    trigger: "POST /ladder-ops/production-lots/{id}/joint-samples (recomputed on every sample insert)"
    algorithm: aggregation
    formula: |
      # STEP 1 — per-sample requirement snapshot and verdict.
      sample.required_pull_force_lbf = product.required_pull_force_lbf   # snapshot at insert time
      sample.result = PASS if sample.pull_force_lbf >= sample.required_pull_force_lbf else FAIL

      # STEP 2 — PER-SAMPLE ROUNDING FIRST. The standard reports each sample's
      #          margin to a WHOLE percent, so the rounding happens once per
      #          sample and the already-rounded integers are what get averaged.
      #          THE ORDER IS PINNED: round-per-sample-then-average.
      #          (Averaging the unrounded margins and rounding once at the end
      #           is a DIFFERENT, non-conforming result — see distinguishing
      #           aspect of §1.8 combinatorial_formula / joint_margin_round_then_average.)
      sample.margin_pct = round_half_up(
          (sample.pull_force_lbf - sample.required_pull_force_lbf) / sample.required_pull_force_lbf * 100, 0)

      # STEP 3 — average the per-sample integers over the whole lot.
      S = [ every JointIntegritySample with production_lot_id == lot.id ]   # ordered by sample_seq ASC
      lot.joint_sample_count = count(S)
      lot.joint_fail_count   = count(s in S where s.result == FAIL)
      lot.conformance_index  = null                       if count(S) == 0
                               else round_half_up(sum(s.margin_pct for s in S) / count(S), 2)
      lot.required_joint_sample_count = 0 if lot.produced_units == 0
                               else max(MIN_JOINT_SAMPLES, ceil(lot.produced_units / JOINT_SAMPLE_UNITS_PER_SAMPLE))
    input_set: "Every JointIntegritySample row whose production_lot_id equals the lot, with no status filter (samples are immutable and never excluded); iteration order is sample_seq ASC. An empty set yields conformance_index null, NOT 0.00."
    constants:
      JOINT_PULL_MULTIPLE: 1.50
      MIN_JOINT_SAMPLES: 4
      JOINT_SAMPLE_UNITS_PER_SAMPLE: 250
      MIN_CONFORMANCE_INDEX: 2.00
    precision: "margin_pct: 0 decimal places, round_half_up, applied once per sample. conformance_index: 2 decimal places, round_half_up, applied once to the mean of the integers."
    variants: []

  # ---------------------------------------------------------------- (c) circular-looking dependency, order pinned
  - name: periodic_audit_sample_size
    trigger: "POST /ladder-ops/test-campaigns when purpose == PERIODIC_AUDIT"
    algorithm: constraint_propagation
    formula: |
      # The escalation tier is keyed on a failure RATE, and a failure rate is
      # fails/sample_size — the very quantity being computed. The circularity is
      # broken by an EXPLICIT evaluation order: the tier is always keyed on the
      # PRIOR concluded audit's own sample_size, never on this campaign's.
      #
      # STEP 1 — select the prior audit deterministically.
      P = [ TestCampaign c where c.listing_record_id == new.listing_record_id
                              and c.purpose == PERIODIC_AUDIT
                              and c.status IN {PASSED, FAILED} ]
      prior = null if P is empty
              else first of P ordered by (sample_window_end DESC, created_at DESC)

      # STEP 2 — failure rate of the PRIOR campaign, from the PRIOR sample size.
      prior_failure_rate_pct = null if prior is null
              else round_half_up(prior.failed_test_count / prior.audit_sample_size * 100, 2)

      # STEP 3 — tier boundaries are INCLUSIVE on the upper edge.
      escalation_tier = TIER_0 if prior is null or prior_failure_rate_pct == 0.00
                        else TIER_1 if prior_failure_rate_pct <= 20.00
                        else TIER_2 if prior_failure_rate_pct <= 40.00
                        else TIER_3

      # STEP 4 — only now is this campaign's own sample size well-defined.
      audit_sample_size = BASE_AUDIT_SAMPLE + ESCALATION_ADDER_BY_TIER[escalation_tier]
    input_set: "Concluded PERIODIC_AUDIT campaigns on the SAME listing_record_id only (PLANNED, IN_PROGRESS and CANCELLED campaigns are excluded); the newest by sample_window_end wins, tie-broken by created_at DESC. Campaigns of other purposes and other listing records never participate."
    constants:
      BASE_AUDIT_SAMPLE: 5
      ESCALATION_ADDER_BY_TIER: { TIER_0: 0, TIER_1: 3, TIER_2: 8, TIER_3: 15 }
    precision: "prior_failure_rate_pct: 2 decimal places, round_half_up. audit_sample_size: exact integer."
    variants: []

  # ---------------------------------------------------------------- dual variant #1 (recall / distribution domain)
  - name: recall_exposure_units
    trigger: "POST /ladder-ops/recall-events/{id}/announce (both variants are computed and frozen in the same request)"
    algorithm: aggregation
    formula: |
      # Shared input set — the recall's in-scope lots.
      L = [ ProductionLot l where l.product_id == recall.product_id
                              and l.design_revision_id IN recall.affected_revision_ids
                              and l.status IN {RELEASED, QUARANTINED}
                              and l.released_at is not null ]

      # Same data, two defensible counting algorithms, different answers.
      exposure_units_shipped_basis    = sum(l.produced_units for l in L)
      exposure_units_registered_basis = count( ConsumerRegistration r
                                               where r.production_lot_id IN ids(L)
                                                 and r.registration_status IN {REGISTERED, NOTIFIED, ACKNOWLEDGED} )

      notification_coverage_pct = 0.00 if exposure_units_shipped_basis == 0
              else round_half_up(exposure_units_registered_basis / exposure_units_shipped_basis * 100, 2)
    input_set: "Lots of the recalled product pinned to an in-scope revision whose status is RELEASED or QUARANTINED and whose released_at is set. SCRAPPED, OPEN and IN_PROCESS lots are excluded from BOTH variants, so the two variants always read the same lot set."
    constants: {}
    precision: "Both exposure figures are exact integers. notification_coverage_pct: 2 decimal places, round_half_up; the zero-shipped case short-circuits to 0.00 instead of dividing."
    variants:
      - name: SHIPPED_BASIS
        when: "Regulatory notice and the units-in-commerce figure published with the recall."
        difference: "Counts manufactured units (sum of ProductionLot.produced_units). Sees every unit that left the plant, including unregistered ones."
      - name: REGISTERED_BASIS
        when: "Consumer outreach planning and the units_outstanding remedy ledger."
        difference: "Counts ConsumerRegistration rows instead of units. Sees only units whose owner self-registered, so for the same lots it is normally far smaller than SHIPPED_BASIS."

  # ---------------------------------------------------------------- dual variant #2 (product engineering domain)
  - name: design_risk_score
    trigger: "POST /ladder-ops/field-incidents/{id}/investigate, POST /ladder-ops/field-incidents/{id}/resolve-investigation, and the CorrectiveAction OPEN -> VERIFIED cascade"
    algorithm: weighted_scoring
    formula: |
      # STEP 1 — per-incident points, rounded once per incident.
      incident.incident_points = round_half_up(
          SEVERITY_WEIGHT[incident.injury_severity] * TYPE_WEIGHT[incident.incident_type], 2)

      # STEP 2 — shared input set for both variants.
      I = [ FieldIncident i where i.product_id == product.id
                              and i.status IN {UNDER_INVESTIGATION, ROOT_CAUSE_IDENTIFIED, CAPA_OPENED, CLOSED} ]
      # REPORTED and NOT_SUBSTANTIATED incidents are excluded from both variants.

      # STEP 3 — the two variants differ ONLY in whether a verified corrective
      #          action discounts its incident.
      risk_score_gross     = round_half_up(min(sum(i.incident_points for i in I), RISK_SCORE_CEILING), 2)
      risk_score_mitigated = round_half_up(min(sum(
              i.incident_points * CAPA_CREDIT_FACTOR
                  if exists CorrectiveAction a where a.field_incident_id == i.id and a.status == VERIFIED
              else i.incident_points
          for i in I), RISK_SCORE_CEILING), 2)
    input_set: "FieldIncident rows of the product whose status is UNDER_INVESTIGATION, ROOT_CAUSE_IDENTIFIED, CAPA_OPENED or CLOSED. Both variants read exactly this set; SUPERSEDED corrective actions never grant credit."
    constants:
      SEVERITY_WEIGHT: { NONE: 1, MINOR: 4, HOSPITALIZATION: 12, FATALITY: 30 }
      TYPE_WEIGHT: { RAIL_FRACTURE: 3.0, RUNG_SEPARATION: 2.5, HINGE_FAILURE: 2.0, SLIP_FALL: 1.5, LABEL_ILLEGIBLE: 1.0 }
      CAPA_CREDIT_FACTOR: 0.25
      RISK_SCORE_CEILING: 100.00
      RISK_CLEAR_THRESHOLD: 25.00
    precision: "incident_points and both scores: 2 decimal places, round_half_up. The ceiling is applied to the sum BEFORE the final rounding."
    variants:
      - name: GROSS_BASIS
        when: "Product liability dossier and regulatory disclosure — the un-discounted exposure."
        difference: "Every in-set incident contributes its full incident_points regardless of corrective-action state."
      - name: MITIGATED_BASIS
        when: "The STOP_SHIP -> RETAIL_RELEASED resume gate (RISK_CLEAR_THRESHOLD is compared against this variant only)."
        difference: "An incident with a VERIFIED CorrectiveAction contributes incident_points * CAPA_CREDIT_FACTOR, so for identical incident data this variant is strictly lower once any CAPA is verified."

  # ---------------------------------------------------------------- retention anchor aggregation
  - name: dhf_retention_until
    trigger: "POST /ladder-ops/products/{id}/freeze-design, POST /ladder-ops/production-lots/{id}/release, the CorrectiveAction verification cascade (incident CLOSED), and POST /ladder-ops/recall-events/{id}/announce"
    algorithm: aggregation
    formula: |
      # Candidate instants, each with an explicit status filter.
      c_lot      = max( l.released_at for ProductionLot l
                        where l.product_id == product.id
                          and l.status IN {RELEASED, QUARANTINED}
                          and l.released_at is not null )                      # null when empty
      c_incident = max( i.closed_at for FieldIncident i
                        where i.product_id == product.id
                          and i.status == CLOSED
                          and i.closed_at is not null )                        # null when empty
      c_recall   = product.market_status_changed_at if product.market_status == RECALLED else null
      c_freeze   = product.design_frozen_at                                     # null before freeze

      if c_freeze is null:
          dhf_retention_until = null; retention_anchor_source = null
      else:
          anchor = max(non-null of [c_lot, c_incident, c_recall, c_freeze])
          # Source priority when two or more candidates equal the anchor:
          # LOT_RELEASE > INCIDENT_CLOSURE > RECALL > DESIGN_FREEZE.
          retention_anchor_source = the first of
              [LOT_RELEASE(c_lot), INCIDENT_CLOSURE(c_incident), RECALL(c_recall), DESIGN_FREEZE(c_freeze)]
              whose candidate is non-null and equals anchor
          dhf_retention_until = anchor plus RETENTION_YEARS calendar years
              (same month and day; 29 February maps to 1 March of the target year)
    input_set: "Four named candidates with the status filters above; SCRAPPED lots, OPEN/IN_PROCESS lots and non-CLOSED incidents never contribute. The window is unbounded in the past and inclusive of the current logical clock."
    constants:
      RETENTION_YEARS: 7
    precision: "Instants are ISO 8601 UTC with three fractional digits; the year addition is calendar-based, not 365-day arithmetic."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the §1.7 role names"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the supplied X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every id in the request path exists, validated left to right"
    error_id: "ERR_PRODUCT_NOT_FOUND | ERR_DESIGN_REVISION_NOT_FOUND | ERR_PRODUCT_DOCUMENT_NOT_FOUND | ERR_TEST_BENCH_NOT_FOUND | ERR_BENCH_RESERVATION_NOT_FOUND | ERR_TEST_CAMPAIGN_NOT_FOUND | ERR_PRODUCTION_LOT_NOT_FOUND | ERR_LISTING_RECORD_NOT_FOUND | ERR_CONSUMER_REGISTRATION_NOT_FOUND | ERR_FIELD_INCIDENT_NOT_FOUND | ERR_CORRECTIVE_ACTION_NOT_FOUND | ERR_RECALL_EVENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: existence
    check: "every foreign-key id in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_PRODUCT_NOT_FOUND | ERR_DESIGN_REVISION_NOT_FOUND | ERR_LISTING_BODY_NOT_FOUND | ERR_LISTING_RECORD_NOT_FOUND | ERR_PRODUCTION_LOT_NOT_FOUND | ERR_TEST_BENCH_NOT_FOUND | ERR_TEST_CAMPAIGN_NOT_FOUND | ERR_FIELD_INCIDENT_NOT_FOUND | ERR_CORRECTIVE_ACTION_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys"

  - priority: 5
    category: auth
    check: "for the CertificationBody role, the target ListingRecord.listing_body_id equals X-User-ID"
    error_id: ERR_LISTING_BODY_MISMATCH
    http_status: 403
    applies_to: "POST /ladder-ops/listing-records/{id}/list, POST /ladder-ops/listing-records/{id}/suspend"

  - priority: 6
    category: business_constraint
    check: "request body shape: all required fields present, enum members valid, numbers inside their declared ranges, datetimes ISO 8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 7
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list GET endpoints"

  - priority: 8
    category: business_temporal
    check: "when both window bounds are supplied, sample_window_start < sample_window_end (and start_at < end_at for reservations)"
    error_id: ERR_INVALID_WINDOW
    http_status: 400
    applies_to: "POST /ladder-ops/test-campaigns, POST /ladder-ops/bench-reservations"

  - priority: 9
    category: business_temporal
    check: "purchase_date (registrations) and occurred_at (incidents) are not after the logical clock"
    error_id: ERR_DATE_IN_FUTURE
    http_status: 400
    applies_to: "POST /ladder-ops/consumer-registrations, POST /ladder-ops/field-incidents"

  - priority: 10
    category: state
    check: "expected_product_version equals Product.version (§1.2.1 design-revision-create-stale-product)"
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412
    applies_to: "POST /ladder-ops/design-revisions"

  - priority: 11
    category: state
    check: "expected_field_incident_version equals FieldIncident.version (§1.2.1 corrective-action-create-stale-incident)"
    error_id: ERR_STALE_INCIDENT_VERSION
    http_status: 412
    applies_to: "POST /ladder-ops/corrective-actions"

  - priority: 12
    category: state
    check: "the target DesignRevision is in the from-state the requested transition declares"
    error_id: ERR_REVISION_STATE_INVALID
    http_status: 409
    applies_to: "POST /ladder-ops/design-revisions/{id}/submit, .../review, .../revise"

  - priority: 13
    category: state
    check: "the target ProductDocument.status == DRAFT"
    error_id: ERR_DOCUMENT_NOT_DRAFT
    http_status: 409
    applies_to: "POST /ladder-ops/product-documents/{id}/approve"

  - priority: 14
    category: state
    check: "the target TestCampaign is in the from-state the requested transition declares"
    error_id: ERR_CAMPAIGN_STATE_INVALID
    http_status: 409
    applies_to: "POST /ladder-ops/test-campaigns/{id}/start, .../conclude, .../load-tests"

  - priority: 15
    category: state
    check: "the target BenchReservation.status == HELD"
    error_id: ERR_RESERVATION_NOT_HELD
    http_status: 409
    applies_to: "POST /ladder-ops/bench-reservations/{id}/cancel, POST /ladder-ops/test-campaigns/{id}/start"

  - priority: 16
    category: state
    check: "the target ProductionLot is in the from-state the requested transition declares (OPEN for start-production, IN_PROCESS for release and joint samples, IN_PROCESS or RELEASED for quarantine, QUARANTINED for disposition)"
    error_id: ERR_LOT_STATE_INVALID
    http_status: 409
    applies_to: "POST /ladder-ops/production-lots/{id}/start-production, .../joint-samples, .../release, .../quarantine, .../disposition"

  - priority: 17
    category: state
    check: "the target ListingRecord is in the from-state the requested transition declares (APPLIED for list, LISTED for suspend)"
    error_id: ERR_LISTING_STATE_INVALID
    http_status: 409
    applies_to: "POST /ladder-ops/listing-records/{id}/list, POST /ladder-ops/listing-records/{id}/suspend"

  - priority: 18
    category: state
    check: "the target Product's relevant state dimension is in the required from-state (design_status == DRAFT for freeze-design; market_status == NOT_RELEASED for release-to-retail, RETAIL_RELEASED for stop-ship, STOP_SHIP for resume-ship)"
    error_id: ERR_PRODUCT_STATE_INVALID
    http_status: 409
    applies_to: "POST /ladder-ops/products/{id}/freeze-design, .../release-to-retail, .../stop-ship, .../resume-ship"

  - priority: 19
    category: state
    check: "the target FieldIncident is in the from-state the requested transition declares (REPORTED for investigate, UNDER_INVESTIGATION for resolve-investigation, ROOT_CAUSE_IDENTIFIED for corrective-action creation)"
    error_id: ERR_INCIDENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /ladder-ops/field-incidents/{id}/investigate, .../resolve-investigation, POST /ladder-ops/corrective-actions"

  - priority: 20
    category: state
    check: "the target CorrectiveAction.status == OPEN"
    error_id: ERR_CORRECTIVE_ACTION_NOT_OPEN
    http_status: 409
    applies_to: "POST /ladder-ops/corrective-actions/{id}/verify"

  - priority: 21
    category: state
    check: "the target RecallEvent is in the from-state the requested transition declares (DRAFT for announce, ANNOUNCED for notify, IN_PROGRESS for close)"
    error_id: ERR_RECALL_STATE_INVALID
    http_status: 409
    applies_to: "POST /ladder-ops/recall-events/{id}/announce, .../notify, .../close"

  - priority: 22
    category: state
    check: "the target ConsumerRegistration.registration_status == NOTIFIED"
    error_id: ERR_REGISTRATION_NOT_NOTIFIED
    http_status: 409
    applies_to: "POST /ladder-ops/consumer-registrations/{id}/acknowledge"

  - priority: 23
    category: auth
    check: "X-User-ID differs from DesignRevision.submitted_by_user_id (a submitter may not review their own revision)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ladder-ops/design-revisions/{id}/review"

  - priority: 24
    category: auth
    check: "X-User-ID differs from CorrectiveAction.authored_by_user_id (an author may not verify their own corrective action)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /ladder-ops/corrective-actions/{id}/verify"

  - priority: 25
    category: auth
    check: "disposition == SCRAP requires X-User-Role == SafetyDirector; a ProductionSupervisor may only choose RELEASE"
    error_id: ERR_SCRAP_REQUIRES_SAFETY_DIRECTOR
    http_status: 403
    applies_to: "POST /ladder-ops/production-lots/{id}/disposition"

  - priority: 26
    category: business_safety
    check: "on release, the lot has at least one JointIntegritySample row (joint_sample_count > 0)"
    error_id: ERR_NO_JOINT_SAMPLES
    http_status: 422
    applies_to: "POST /ladder-ops/production-lots/{id}/release"

  - priority: 27
    category: business_safety
    check: "on release, joint_sample_count >= required_joint_sample_count"
    error_id: ERR_JOINT_SAMPLE_COUNT_SHORT
    http_status: 422
    applies_to: "POST /ladder-ops/production-lots/{id}/release"

  - priority: 28
    category: business_safety
    check: "on release or RELEASE disposition, lot.joint_fail_count == 0"
    error_id: ERR_JOINT_INTEGRITY_FAILURE
    http_status: 422
    applies_to: "POST /ladder-ops/production-lots/{id}/release, POST /ladder-ops/production-lots/{id}/disposition"

  - priority: 29
    category: business_safety
    check: "on release or RELEASE disposition, lot.conformance_index >= MIN_CONFORMANCE_INDEX (2.00)"
    error_id: ERR_CONFORMANCE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /ladder-ops/production-lots/{id}/release, POST /ladder-ops/production-lots/{id}/disposition"

  - priority: 30
    category: business_safety
    check: "every doc_kind in REQUIRED_DOC_KINDS {DUTY_RATING_LABEL, WARNING_LABEL, INSTRUCTION_LABEL, RETAIL_CARTON, ASSEMBLY_INSTRUCTION_SHEET, CONSUMER_SAFETY_SHEET} has an APPROVED ProductDocument for the product"
    error_id: ERR_LABEL_SET_INCOMPLETE
    http_status: 422
    applies_to: "POST /ladder-ops/products/{id}/release-to-retail"

  - priority: 31
    category: business_safety
    check: "placement_zone is non-null for label kinds {DUTY_RATING_LABEL, WARNING_LABEL, INSTRUCTION_LABEL, CERT_MARK_LABEL} and null for the three non-label kinds; a WARNING_LABEL carries at least MIN_WARNING_PICTOGRAMS (2) pictograms; an ASSEMBLY_INSTRUCTION_SHEET has includes_assembly_instructions == true"
    error_id: ERR_LABEL_PLACEMENT_INVALID
    http_status: 422
    applies_to: "POST /ladder-ops/product-documents, POST /ladder-ops/product-documents/{id}/approve"

  - priority: 32
    category: business_referential
    check: "the DesignRevision named by design_revision_id (or frozen_revision_id) has product_id equal to the product in the request"
    error_id: ERR_REVISION_PRODUCT_MISMATCH
    http_status: 409
    applies_to: "POST /ladder-ops/test-campaigns, POST /ladder-ops/production-lots, POST /ladder-ops/products/{id}/freeze-design"

  - priority: 33
    category: business_referential
    check: "for PERIODIC_AUDIT campaigns the ListingRecord named by listing_record_id and the ProductionLot named by sampled_lot_id both have product_id equal to the campaign's product_id"
    error_id: ERR_AUDIT_SCOPE_MISMATCH
    http_status: 409
    applies_to: "POST /ladder-ops/test-campaigns"

  - priority: 34
    category: business_referential
    check: "purpose == PERIODIC_AUDIT requires listing_record_id, sampled_lot_id, sample_window_start and sample_window_end to be present; every other purpose requires all four to be null"
    error_id: ERR_AUDIT_FIELDS_MISMATCH
    http_status: 422
    applies_to: "POST /ladder-ops/test-campaigns"

  - priority: 35
    category: business_referential
    check: "supersedes_revision_id (revisions) and supersedes_action_id (corrective actions) reference a row on the same product / same incident respectively"
    error_id: ERR_SUPERSEDE_TARGET_MISMATCH
    http_status: 409
    applies_to: "POST /ladder-ops/design-revisions, POST /ladder-ops/corrective-actions"

  - priority: 36
    category: business_constraint
    check: "the pinned DesignRevision.status == APPROVED and its superseded_at is null"
    error_id: ERR_REVISION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /ladder-ops/production-lots/{id}/start-production, POST /ladder-ops/products/{id}/freeze-design, POST /ladder-ops/corrective-actions/{id}/verify"

  - priority: 37
    category: business_constraint
    check: "product.design_status == DESIGN_FROZEN"
    error_id: ERR_DESIGN_NOT_FROZEN
    http_status: 409
    applies_to: "POST /ladder-ops/production-lots/{id}/start-production, POST /ladder-ops/products/{id}/release-to-retail, POST /ladder-ops/listing-records/{id}/list"

  - priority: 38
    category: business_constraint
    check: "a PASSED TestCampaign of the required purpose exists (DESIGN_QUALIFICATION for freeze-design, CERTIFICATION_LISTING on the frozen revision for listing)"
    error_id: ERR_QUALIFYING_CAMPAIGN_MISSING
    http_status: 422
    applies_to: "POST /ladder-ops/products/{id}/freeze-design, POST /ladder-ops/listing-records/{id}/list"

  - priority: 39
    category: business_constraint
    check: "the ListingRecord.standard_code is a member of the owning ListingBody.accredited_standards"
    error_id: ERR_STANDARD_NOT_ACCREDITED
    http_status: 422
    applies_to: "POST /ladder-ops/listing-records/{id}/list"

  - priority: 40
    category: business_constraint
    check: "at least one ListingRecord of the product has status == LISTED"
    error_id: ERR_NO_ACTIVE_LISTING
    http_status: 422
    applies_to: "POST /ladder-ops/products/{id}/release-to-retail"

  - priority: 41
    category: business_constraint
    check: "the named BenchReservation's TestBench.max_load_capacity_lb >= product.required_test_load_lb"
    error_id: ERR_BENCH_CAPACITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /ladder-ops/test-campaigns/{id}/start"

  - priority: 42
    category: business_constraint
    check: "if product.material == FIBERGLASS_PULTRUSION the lot carries a non-null pultrusion_batch_id; if material == ALUMINUM_EXTRUSION it carries a non-null extrusion_heat_number"
    error_id: ERR_PROCESS_TRACEABILITY_MISSING
    http_status: 422
    applies_to: "POST /ladder-ops/production-lots/{id}/start-production"

  - priority: 43
    category: business_constraint
    check: "0 < produced_units <= lot.planned_units"
    error_id: ERR_PRODUCED_UNITS_INVALID
    http_status: 422
    applies_to: "POST /ladder-ops/production-lots/{id}/start-production"

  - priority: 44
    category: business_constraint
    check: "the lot named by production_lot_id has status IN {RELEASED, QUARANTINED} (a consumer cannot register a unit that never shipped)"
    error_id: ERR_LOT_NOT_SHIPPABLE
    http_status: 409
    applies_to: "POST /ladder-ops/consumer-registrations"

  - priority: 45
    category: business_constraint
    check: "for purpose IN {DESIGN_QUALIFICATION, CERTIFICATION_LISTING, INCIDENT_INVESTIGATION}: every test_code in the campaign's required set has a LoadTest row"
    error_id: ERR_REQUIRED_TESTS_MISSING
    http_status: 422
    applies_to: "POST /ladder-ops/test-campaigns/{id}/conclude"

  - priority: 46
    category: business_constraint
    check: "for purpose == PERIODIC_AUDIT: campaign.load_test_count >= campaign.audit_sample_size"
    error_id: ERR_AUDIT_SAMPLE_SHORT
    http_status: 422
    applies_to: "POST /ladder-ops/test-campaigns/{id}/conclude"

  - priority: 47
    category: business_constraint
    check: "product.risk_score_mitigated < RISK_CLEAR_THRESHOLD (25.00)"
    error_id: ERR_RISK_SCORE_ABOVE_THRESHOLD
    http_status: 422
    applies_to: "POST /ladder-ops/products/{id}/resume-ship"

  - priority: 48
    category: business_constraint
    check: "no ProductionLot of the product has status == QUARANTINED and product.held_registration_count == 0"
    error_id: ERR_QUARANTINE_HOLD_PRESENT
    http_status: 409
    applies_to: "POST /ladder-ops/products/{id}/resume-ship"

  - priority: 49
    category: business_constraint
    check: "no other RecallEvent for the same product has status IN {DRAFT, ANNOUNCED, IN_PROGRESS}"
    error_id: ERR_RECALL_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /ladder-ops/recall-events"

  - priority: 50
    category: business_constraint
    check: "the recall's in-scope lot set (§1.3 recall_exposure_units input_set) is non-empty"
    error_id: ERR_RECALL_SCOPE_EMPTY
    http_status: 422
    applies_to: "POST /ladder-ops/recall-events/{id}/announce"

  - priority: 51
    category: business_constraint
    check: "recall.units_outstanding == 0 or the logical clock has reached announced_at + MAX_RECALL_WINDOW_DAYS (365)"
    error_id: ERR_RECALL_UNITS_OUTSTANDING
    http_status: 409
    applies_to: "POST /ladder-ops/recall-events/{id}/close"

  - priority: 52
    category: business_constraint
    check: "payload remedy_choice equals the linked RecallEvent.remedy_type"
    error_id: ERR_REMEDY_CHOICE_MISMATCH
    http_status: 422
    applies_to: "POST /ladder-ops/consumer-registrations/{id}/acknowledge"

  - priority: 53
    category: business_constraint
    check: "finding == ROOT_CAUSE_IDENTIFIED requires a non-null root_cause_code; finding == NOT_SUBSTANTIATED requires root_cause_code to be null"
    error_id: ERR_FINDING_ROOT_CAUSE_MISMATCH
    http_status: 422
    applies_to: "POST /ladder-ops/field-incidents/{id}/resolve-investigation"

  - priority: 54
    category: business_constraint
    check: "structural_margin_pct >= MIN_STRUCTURAL_MARGIN_PCT (2.00) at submit, and rail_section_modulus_in3 >= MIN_SECTION_MODULUS_IN3 (0.180) at APPROVE"
    error_id: ERR_DESIGN_MARGIN_INSUFFICIENT
    http_status: 422
    applies_to: "POST /ladder-ops/design-revisions/{id}/submit, POST /ladder-ops/design-revisions/{id}/review"

  - priority: 55
    category: business_temporal
    check: "half-open buffered bench occupancy: reject when an existing BenchReservation on the same test_bench_id with status IN {HELD, CONSUMED} satisfies new.start_at < existing.end_at + bench.cooldown_minutes AND new.end_at > existing.start_at"
    error_id: ERR_BENCH_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /ladder-ops/bench-reservations"

  - priority: 56
    category: business_temporal
    check: "closed-interval audit windows: reject when an existing TestCampaign on the same listing_record_id with purpose == PERIODIC_AUDIT and status IN {PLANNED, IN_PROGRESS, PASSED, FAILED} satisfies new.sample_window_start <= existing.sample_window_end AND new.sample_window_end >= existing.sample_window_start (touching endpoints DO collide; no buffer is applied)"
    error_id: ERR_AUDIT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /ladder-ops/test-campaigns"

  - priority: 57
    category: business_constraint
    check: "uniqueness: Product.model_code, TestBench.bench_code, ListingBody.body_code and ProductionLot.lot_code are globally unique; DesignRevision.revision_label is unique per product_id; JointIntegritySample.sample_seq is unique per production_lot_id"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /ladder-ops/products, POST /ladder-ops/test-benches, POST /ladder-ops/listing-bodies, POST /ladder-ops/production-lots, POST /ladder-ops/design-revisions, POST /ladder-ops/production-lots/{id}/joint-samples"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ------------------------------------------------------------------ Product
  - method: POST
    path: /ladder-ops/products
    roles: [DesignEngineer]
    input: [model_code, product_type, material, duty_rating, working_length_ft, retail_sku]
    output: Product
    side_effects:
      - "derives rated_load_lb, safety_factor, required_test_load_lb, required_pull_force_lbf and max_allowed_deflection_in per §1.3 required_test_load_derivation"
      - "sets design_status = DRAFT, market_status = NOT_RELEASED, held_registration_count = 0, risk_score_gross = 0.00, risk_score_mitigated = 0.00"
      - "leaves dhf_retention_until and retention_anchor_source null until design freeze"
    errors: [ERR_INVALID_REQUEST, ERR_DUPLICATE_KEY]

  - method: GET
    path: /ladder-ops/products/{id}
    roles: [DesignEngineer, DesignApprover, TestLabTechnician, ProductionSupervisor, ComplianceOfficer, CertificationBody, SafetyDirector]
    input: []
    output: Product
    side_effects: []
    errors: [ERR_PRODUCT_NOT_FOUND]

  - method: GET
    path: /ladder-ops/products
    roles: [DesignEngineer, DesignApprover, TestLabTechnician, ProductionSupervisor, ComplianceOfficer, CertificationBody, SafetyDirector]
    input: ["frozen_revision_id?", "product_type?", "material?", "duty_rating?", "design_status?", "market_status?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
    errors: [ERR_INVALID_PAGINATION]

  - method: POST
    path: /ladder-ops/products/{id}/freeze-design
    roles: [DesignApprover]
    input: [frozen_revision_id]
    output: Product
    side_effects:
      - "design_status DRAFT -> DESIGN_FROZEN; sets design_frozen_at = logical clock and frozen_revision_id"
      - "recomputes dhf_retention_until / retention_anchor_source per §1.3 dhf_retention_until (DESIGN_FREEZE anchor on a product with no lots and no closed incidents)"
    errors: [ERR_PRODUCT_NOT_FOUND, ERR_DESIGN_REVISION_NOT_FOUND, ERR_PRODUCT_STATE_INVALID, ERR_REVISION_PRODUCT_MISMATCH, ERR_REVISION_NOT_APPROVED, ERR_QUALIFYING_CAMPAIGN_MISSING]

  - method: POST
    path: /ladder-ops/products/{id}/release-to-retail
    roles: [ComplianceOfficer]
    input: []
    output: Product
    side_effects:
      - "market_status NOT_RELEASED -> RETAIL_RELEASED; sets market_status_changed_at = logical clock"
    errors: [ERR_PRODUCT_NOT_FOUND, ERR_PRODUCT_STATE_INVALID, ERR_LABEL_SET_INCOMPLETE, ERR_DESIGN_NOT_FROZEN, ERR_NO_ACTIVE_LISTING]

  - method: POST
    path: /ladder-ops/products/{id}/stop-ship
    roles: [ComplianceOfficer, SafetyDirector]
    input: [reason_code]
    output: Product
    side_effects:
      - "market_status RETAIL_RELEASED -> STOP_SHIP; sets stop_ship_reason_code = payload reason_code and market_status_changed_at = logical clock"
      - "cascade: LISTED ListingRecords of the product -> SUSPENDED (suspension_reason STOP_SHIP_CASCADE), PLANNED TestCampaigns -> CANCELLED, their HELD BenchReservations -> CANCELLED with TestBench.reserved_minutes_total decremented"
    errors: [ERR_PRODUCT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PRODUCT_STATE_INVALID]

  - method: POST
    path: /ladder-ops/products/{id}/resume-ship
    roles: [SafetyDirector]
    input: []
    output: Product
    side_effects:
      - "market_status STOP_SHIP -> RETAIL_RELEASED; clears stop_ship_reason_code and sets market_status_changed_at = logical clock"
      - "cascade: SUSPENDED ListingRecords of the product -> LISTED with audit_due_at re-stamped to logical clock + ListingBody.audit_interval_days"
    errors: [ERR_PRODUCT_NOT_FOUND, ERR_PRODUCT_STATE_INVALID, ERR_RISK_SCORE_ABOVE_THRESHOLD, ERR_QUARANTINE_HOLD_PRESENT]

  - method: GET
    path: /ladder-ops/products/{id}/documents
    roles: [DesignEngineer, DesignApprover, ComplianceOfficer, CertificationBody, SafetyDirector]
    input: ["doc_kind?", "status?", "limit?", "offset?"]
    output: ProductDocument[]
    side_effects: []
    errors: [ERR_PRODUCT_NOT_FOUND, ERR_INVALID_PAGINATION]

  - method: GET
    path: /ladder-ops/products/{id}/liability-dossier
    roles: [ComplianceOfficer, SafetyDirector]
    input: []
