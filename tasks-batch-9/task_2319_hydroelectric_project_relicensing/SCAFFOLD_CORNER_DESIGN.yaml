              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9018", project_name: "Invalid From Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
