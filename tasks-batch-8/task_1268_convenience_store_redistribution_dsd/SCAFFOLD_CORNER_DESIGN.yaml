            - "captured st2 == ACTIVE"
            - "captured old_id == rpr1"

  - section: errors
    instances:
      - name: not_found_error_shape
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", response_envelope]
        distinguishing_aspect: "GET with a non-existent UUID returns 404 with error envelope: response_type 'error' and data.error_id ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /purchase-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: WholesaleAdmin, captures: { err: $.data.error_id, rt: $.response_type } }
          assert:
            - "captured err == ERR_NOT_FOUND"
            - "captured rt == 'error'"
      - name: unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "Request without X-User-Role/X-User-ID fails priority-1 auth with 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /products", payload: {}, as: Anonymous }
          assert:
            - "response http status == 401 and data.error_id == ERR_UNAUTHENTICATED"
      - name: duplicate_sku_error
        claim_type: type_constraint
        grounds: ["errors[ERR_DUPLICATE_SKU]", entities.Product.fields.sku]
        distinguishing_aspect: "Second product with an existing sku is rejected with ERR_DUPLICATE_SKU (uniqueness constraint)."
        test_recipe:
          setup: ["Product with sku P1 exists"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin }
          trigger:
            - { call: "POST /products", payload: { sku: "P1", description: "dupe", case_pack_units: 6, case_cost_cents: 600, unit_cost_cents: 60, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 5 }, as: WholesaleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_DUPLICATE_SKU"
      - name: duplicate_rate_week_error
        claim_type: type_constraint
        grounds: ["errors[ERR_DUPLICATE_RATE_WEEK]", entities.FuelSurchargeRate.fields.week_start_date]
        distinguishing_aspect: "Second fuel rate for the same week_start_date is rejected with ERR_DUPLICATE_RATE_WEEK."
        test_recipe:
          setup: ["Rate for week 2026-05-25 exists"]
          setup_api_calls:
            - { call: "POST /fuel-surcharge-rates", payload: { week_start_date: "2026-05-25", doe_index_usd: 3.75 }, as: WholesaleAdmin }
          trigger:
            - { call: "POST /fuel-surcharge-rates", payload: { week_start_date: "2026-05-25", doe_index_usd: 3.80 }, as: WholesaleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_DUPLICATE_RATE_WEEK"
      - name: duplicate_jurisdiction_error
        claim_type: type_constraint
        grounds: ["errors[ERR_DUPLICATE_JURISDICTION]", entities.TaxStampSupply.fields.jurisdiction_code]
        distinguishing_aspect: "Second stamp supply for the same jurisdiction_code is rejected with ERR_DUPLICATE_JURISDICTION."
        test_recipe:
          setup: ["Supply for CA_NORTH exists"]
          setup_api_calls:
            - { call: "POST /tax-stamp-supplies", payload: { jurisdiction_code: "CA_NORTH", stamp_rate_cents_per_pack: 200, handling_fee_per_roll_cents: 1500, packs_per_roll: 6000, min_charge_cents: 5000 }, as: WholesaleAdmin }
          trigger:
            - { call: "POST /tax-stamp-supplies", payload: { jurisdiction_code: "CA_NORTH", stamp_rate_cents_per_pack: 210, handling_fee_per_roll_cents: 1600, packs_per_roll: 6000, min_charge_cents: 5000 }, as: WholesaleAdmin, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_DUPLICATE_JURISDICTION"

  - section: rbac
    instances:
      - name: store_manager_cannot_create_product
        claim_type: role_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Peer-role denial: StoreManager hits WholesaleAdmin's exclusive create_product and gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Retailer R exists (provides the StoreManager identity)"]
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
          trigger:
            - { call: "POST /products", payload: { sku: "PX", description: "x", case_pack_units: 12, case_cost_cents: 900, unit_cost_cents: 90, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 6 }, as: StoreManager, as_user_id: "${ret_id}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_FORBIDDEN"
      - name: store_manager_scoped_to_own_retailer
        claim_type: ownership_scoping
        grounds: [roles, entities.Retailer]
        distinguishing_aspect: "Entity-backed identity: StoreManager authenticated as retailer A cannot read retailer B's resource (ownership check via X-User-ID == Retailer.id)."
        test_recipe:
          setup: ["Retailers A and B exist"]
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "A", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_a: $.data.id } }
            - { call: "POST /retailers", payload: { store_name: "B", jurisdiction_code: "NV_CLARK", credit_terms: "COD", credit_limit_cents: 500000, delivery_day: "TUE" }, as: WholesaleAdmin, captures: { ret_b: $.data.id } }
          trigger:
            - { call: "GET /retailers/${ret_b}", payload: {}, as: StoreManager, as_user_id: "${ret_a}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_FORBIDDEN"
      - name: credit_manager_cannot_close_manifest
        claim_type: role_denial
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "CreditManager hits WholesaleAdmin's exclusive close_manifest and gets ERR_FORBIDDEN; role checked before state logic."
        test_recipe:
          setup: ["Manifest in LOADING"]
          setup_api_calls:
            - { call: "POST /delivery-manifests", payload: { route_code: "R-1", delivery_date: "2026-05-25", capacity_lbs: 100000 }, as: WholesaleAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /delivery-manifests/${m_id}/begin-loading", payload: {}, as: WholesaleAdmin, captures: { m_ver: $.data.version } }
          trigger:
            - { call: "POST /delivery-manifests/${m_id}/close", payload: { expected_manifest_version: "${m_ver}" }, as: CreditManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_FORBIDDEN"

  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_order_submit
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[order-submit-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Submit with expected_order_version one behind the current version (DRAFT, version 1) is rejected with 412 ERR_STALE_VERSION; the fresh-version submit then succeeds."
        test_recipe:
          setup: ["DRAFT order exists, version 1"]
          setup_api_calls:
            - { call: "POST /retailers", payload: { store_name: "R", jurisdiction_code: "CA_NORTH", credit_terms: "NET7", credit_limit_cents: 10000000, delivery_day: "MON", tobacco_license_id: "TLIC-9" }, as: WholesaleAdmin, captures: { ret_id: $.data.id } }
            - { call: "POST /products", payload: { sku: "P1", description: "p1", case_pack_units: 12, case_cost_cents: 1200, unit_cost_cents: 110, split_case_allowed: true, is_tobacco: false, weight_lbs_per_case: 10 }, as: WholesaleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /order-guides", payload: { retailer_id: "${ret_id}", delivery_day: "MON", cutoff_hours_before: 24, lines: [ { product_id: "${p1}", par_cases: 0 } ] }, as: SalesRep, captures: { g1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 50, split_units_qty: 0 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
          trigger:
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver} - 1" }, as: StoreManager, as_user_id: "${ret_id}", captures: { err: $.data.error_id } }
            - { call: "POST /purchase-orders/${po_id}/submit", payload: { expected_order_version: "${po_ver}" }, as: StoreManager, as_user_id: "${ret_id}", captures: { st: $.data.status, ver: $.data.version } }
          assert:
            - "captured err == ERR_STALE_VERSION (stale expected version rejected, 412)"
            - "captured st == SUBMITTED and ver == 2 (correct version succeeds and increments)"
      - name: occ_stale_version_on_manifest_close
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[manifest-close-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Close carrying the pre-begin-loading version is stale: begin-loading incremented the manifest version, so the old expected value fails with 412 while the current value succeeds."
        test_recipe:
          setup: ["Manifest in LOADING at version 2 (created v1, begin-loading -> v2)"]
          setup_api_calls:
            - { call: "POST /delivery-manifests", payload: { route_code: "R-1", delivery_date: "2026-05-25", capacity_lbs: 100000 }, as: WholesaleAdmin, captures: { m_id: $.data.id, m_ver1: $.data.version } }
            - { call: "POST /fuel-surcharge-rates", payload: { week_start_date: "2026-05-25", doe_index_usd: 3.00 }, as: WholesaleAdmin }
            - { call: "POST /delivery-manifests/${m_id}/begin-loading", payload: {}, as: WholesaleAdmin, captures: { m_ver2: $.data.version } }
          trigger:
            - { call: "POST /delivery-manifests/${m_id}/close", payload: { expected_manifest_version: "${m_ver2} - 1" }, as: WholesaleAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /delivery-manifests/${m_id}/close", payload: { expected_manifest_version: "${m_ver2}" }, as: WholesaleAdmin, captures: { st: $.data.status, ver: $.data.version } }
          assert:
            - "captured err == ERR_STALE_VERSION"
            - "captured st == CLOSED and ver == 3 (version increments on every mutation)"
      - name: authorize_cascade_to_guide_and_price_covered
        claim_type: cascade_side_effect
        grounds: [state_machines.NewItemRequest.UNDER_REVIEW_to_AUTHORIZED]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / new_item_revision_cycle"
          rationale: "Guide-line append and RetailPriceRecord creation are asserted in the named difficulty instance's final state."

