            - "status CONSUMED: 1 row with ${consumed_heat} == \"H-77Q\" and ${consumed_remaining} == 0.00, total_count == 1"
            - "metal ALUMINUM: 1 row (H-AL1), total_count == 1; metal ALUMINUM + status CONSUMED: 0 rows, total_count == 0 - the two filters intersect"
