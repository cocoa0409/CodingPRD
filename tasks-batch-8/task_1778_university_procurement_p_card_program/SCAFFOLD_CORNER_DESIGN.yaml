              as: Cardholder
              as_user_id: "${pc_id}"
            - call: "POST /pcards/${pc_id}/close-cycle"
              as: ProcurementAdmin
          trigger:
            - call: "POST /pcards/${pc_id}/transactions"
              payload: { amount_cents: 20000, entry_type: "DEBIT", merchant_name: "Lowes", mcc_code: "5200" }
              as: Cardholder
              as_user_id: "${pc_id}"
            - call: "GET /pcards/${pc_id}"
              as: ProcurementAdmin
              captures: { util: $.data.utilization_cents, avail: $.data.available_credit_cents, cyc: $.data.cycle_index, cons: $.data.consecutive_unreconciled_cycles }
          assert:
            - "cycle_index == 1 and consecutive_unreconciled_cycles == 1 (dirty cycle 0 aged the card once)"
            - "utilization_cents == 20000 (only the new-cycle debit counts; the 30,000 cycle-0 debit is filtered out)"
            - "available_credit_cents == 480000"

