        grounds:
          - state_machines.PelletLot.RELEASED_to_RECALLED
          - state_machines.PelletAllocation.CONSUMED_to_RECALL_FLAGGED
          - state_machines.Procedure.NONE_to_RECALL_AFFECTED
          - state_machines.Procedure.RECALL_AFFECTED_to_NOTIFIED
          - calculations.recall_impact_counts
          - conservation_invariants.lot_pellet_conservation
        distinguishing_aspect: |
          Depth-5 chain, each hop caused by the previous one: lot RECALLED causes
          allocations to flip, which causes COMPLETED procedures to become
          RECALL_AFFECTED, which causes PatientNotification rows to be minted, which
          causes SURVEILLANCE AdverseEvent rows for CLASS_I. The VOIDED procedure's
          CONSUMED allocation flips at hop 2 but is explicitly skipped at hop 3a, which
          is what makes the PROJECTION and ACTUAL impact counts differ (2 versus 1).
